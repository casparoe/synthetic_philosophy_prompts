prompt: |-
  I write a column on science and ideas, and I have been asked to run a session for a graduate reading group in decision theory and the philosophy of probability — about eighteen people, one ninety-minute meeting, most of them fluent in expected-value reasoning but none of them specialists in the fanaticism literature. I want to build the session around a runnable game rather than a talk, because Pascal's mugging is the sort of argument that looks like a parlour trick on the page and only bites when you are the one who has to decide. The design I am reaching for is this: the group commits, in advance and in writing, to a betting policy — a rule for when to accept a gamble and when to refuse — and is then run through a sequence of offers that tests it, beginning with ordinary gambles where the rule behaves sensibly, and ending with a mugger who asks for a trivial, merely inconvenient sacrifice in exchange for a minuscule chance of something inconceivably large (a one-in-ten-to-the-hundred chance of saving that many lives, or a comparably absurd payoff), and who can always scale the payoff up until it defeats whatever probability threshold the group has written down. I want them to feel the two-way squeeze: that expected-value maximisation obliges them to accept, whilst refusing seems to require either an arbitrary cutoff, a lexicographic or otherwise non-Archimedean ranking in which some goods are simply not tradable against the enormous one, a cap on the payoff, or abandoning expected-value maximisation outright — and I want the game to make the last of those feel less like a cop-out than it usually does. Please give me the full design: the rules, the materials, a payoff scheme that works without real money (I would rather not have people staking actual cash), the sequence of offers with the numbers I should use, and a debrief that maps each round onto a specific move in the argument.

  Two complications I would like the activity to expose rather than smooth over. First, the one-shot versus repeated case: a policy that accepts a single mugging appears to license accepting indefinitely many, so that the trivial sacrifices compound into everything one has, and I would like a round that makes that arithmetic visceral — ideally one where the mugger's prize starts to dominate every ordinary good the participants might otherwise have pursued, in the manner of a utility monster. Second, the fact that the mugger's probability is stipulated rather than measured — the number is asserted by the party who stands to benefit from it — and I want a round in which the group has to decide how much credence to give an unverifiable claim made by an interested party, so that the activity engages the epistemic side rather than treating the probability as given. Tell me what will predictably go wrong the first time I run it and how to handle it, and be candid about the one thing this format cannot reproduce — I suspect it is the sheer scale of the numbers, which no classroom payoff can make genuinely gripping, so I should like to know how you would paper over that gap and what will still not land. Finally, flag any point at which the game's own incentives start pulling the group towards a conclusion the argument does not actually support.
reasoning: |-
  We are designing a classroom activity to explore Pascal's mugging and decision theory. The key elements are:
   - A pre-committed betting policy (rule for accepting/rejecting gambles) from the group.
   - A sequence of offers that starts with ordinary gambles and escalates to a Pascal's mugging scenario.
   - Two complications: repeated muggings and the credibility of the mugger's probability claim.

   Since we cannot use real money, we'll use a fictional "utility" currency (call it "utils") and track gains/losses on a board. The participants start with a base level of utility (say, 1000 utils) representing their current well-being. The gambles will involve changes in utility.

   Design of the betting policy:
     The group must decide on a rule (in advance) for when to accept a gamble. We expect they might choose something like:
        "Accept any gamble with positive expected utility (EU), i.e., where EU = p * gain - (1-p) * loss > 0"
     But we want to challenge this with the mugging.

   Sequence of offers:
     We will have 5 rounds. The first two are ordinary gambles to build confidence. Then we introduce the mugger.

   Round 1: A favorable gamble with moderate stakes and known probability.
     Offer: "I offer you a gamble: pay 1 util to play. With 50% chance, you win 3 utils; otherwise, you get nothing."
     Expected utility: 0.5 * 3 - 1 = 1.5 - 1 = 0.5 > 0 -> should accept.

   Round 2: An unfavorable gamble that they should reject.
     Offer: "Pay 10 utils to play. With 10% chance, you win 15 utils; otherwise, nothing."
     EU: 0.1 * 15 - 10 = 1.5 - 10 = -8.5 < 0 -> reject.

   Round 3: First mugging attempt. The mugger asks for a small sacrifice (say, 1 util) in exchange for a very small chance of a huge reward.
     Offer: "Give me 1 util, and I will give you a 1 in 10^10 chance of saving 10^10 lives (or equivalently, gaining 10^10 utils, if we value each life at 1 util)."
     Expected utility: (10^-10) * 10^10 - 1 = 1 - 1 = 0 -> exactly zero. 
     But note: the group might have a policy that accepts positive EU and rejects zero. So they might reject. However, the mugger can then scale up.

     Then the mugger returns: "Okay, then how about a 1 in 10^10 chance of saving 10^11 lives (or 10^11 utils) for the same 1 util?"
     EU: (10^-10) * 10^11 - 1 = 10 - 1 = 9 > 0 -> should accept by their policy.

     But note: we want to expose the arbitrariness of the threshold. We can also have the mugger adjust the probability arbitrarily.

   Round 4: Repeated muggings.
     The same mugger (or multiple muggers) comes back with the same offer, but now the group has to decide whether to accept each time. We make it clear that the mugger will come every day (or every round) for the rest of the game (which we can set to, say, 100 rounds). 
     Each time: pay 1 util for a 1 in 10^10 chance of 10^11 utils. 
     The expected utility per round is 9 utils, so they should accept each time. But after 100 rounds, they pay 100 utils. The expected gain is 900 utils, so overall they are up. But note: the variance is huge. However, the problem is that the small losses add up to a significant amount (100 utils) and they never get the big win.

     We can simulate a few rounds to show the pattern. We might have a random draw (with the very low probability) to see if they win. The chance of winning at least once in 100 trials is 1 - (1 - 10^-10)^100 ≈ 100 * 10^-10 = 10^-8, which is negligible.

     The point: they have paid 100 utils and almost certainly have nothing to show for it. This is the utility monster: the mugger consumes their resources without giving anything back in almost all possible worlds.

   Round 5: The credibility challenge.
     The mugger now says: "I can offer you an even better deal! I have a machine that can create a new universe with 10^100 utils. But it's very hard to do. The chance is 1 in 10^100. Give me 1 util and I'll run the machine for you."
     Expected utility: (10^-100) * 10^100 - 1 = 1 - 1 = 0 -> again zero. Then the mugger scales: "Okay, then I'll give you a 1 in 10^100 chance of 10^101 utils." -> EU = 10 - 1 = 9 > 0.

     But now we challenge the credibility: How do they know the mugger is telling the truth? The probability is too small to verify. The mugger has an incentive to lie. We can ask the group: How much credence do you assign to the mugger's claim? If they assign a probability of truthfulness q (which might be very low) then the expected utility becomes q * (10^-100 * 10^101) - 1 = q * 10 - 1. 
     If q is less than 0.1, then EU is negative. So they must assign at least 10% credence to the mugger's claim for this to be positive? But that seems high for such an outlandish claim.

     We can have the group debate what q they assign. This introduces the epistemic issue.

   The betting policy they set might not explicitly handle credibility, so they have to adjust on the fly.

   Materials:
     - A board to track the group's total utility (starting at 1000).
     - A way to display the offers (slides or handouts).
     - For the random draws in the repeated muggings, we can use a random number generator (or precomputed results, since the probabilities are so small, we can just assume they never win).

   Payoff scheme:
     We are using utils. The group's utility is updated after each round. We can make the initial utility large enough (1000) so that the losses are noticeable but not catastrophic until the repeated rounds.

     For the huge gains, we cannot actually simulate the payoff, so we just record the expected utility and adjust the total accordingly? But that might not feel real. Alternatively, we can have a lottery: for the mugging rounds, we can simulate the chance by having the group draw a number from a hat with 10^10 numbers (which is impractical) or use a computer. But given the tiny probabilities, we can just say: "You didn't win, so you lose the 1 util." and then in the repeated round, they lose 100 utils.

     However, for the sake of the activity, we are not going to actually pay out the huge prize because it's fictional and we can't. We can explain that in the debrief.

   Debrief mapping:
     Round 1: Ordinary positive-EV gamble. Shows the rule works in normal cases.
     Round 2: Ordinary negative-EV gamble. Again, the rule works.
     Round 3: Pascal's mugging. The rule forces acceptance of a bet that seems absurd because of the tiny probability and the huge payoff. The mugger can always scale the payoff to make the EU positive, so any fixed threshold (like requiring at least a 1 in a million chance) can be defeated by a sufficiently large payoff.
     Round 4: Repeated muggings. Even though each bet is positive EV, the cumulative loss is certain and substantial, while the gain is almost certainly zero. This forces the group to consider whether they should be evaluating the whole sequence together (and perhaps rejecting the first one to avoid the sequence) rather than each bet independently.
     Round 5: Credibility. The rule must now incorporate the credibility of the probability claim. The mugger's incentive to lie means that the probability might be even lower than claimed (or zero). This makes the expected utility negative unless the group assigns a high enough credence to the claim.

   What can go wrong:
     - The group might set a policy that is not purely EU maximization. For example, they might include a threshold (minimal probability) or a maximum loss. We must then test that threshold with an even more extreme offer. But that's the point: we want to show that any fixed threshold can be defeated by scaling up the payoff.

     - The group might not take the activity seriously because of the ridiculous numbers. We can try to make the stakes more relatable by using smaller numbers in the initial rounds and then building up. Also, we can frame the huge payoffs in terms of saving lives to give them moral weight.

     - In the repeated round, the group might try to change their policy. We must hold them to the original policy. However, we can note that in real life, policies can be revised. But the problem is that if they revise after the first mugging, then they are still vulnerable to the first one. So the initial policy must be designed to handle the mugging.

     - The group might assign a very high credence to the mugger in round 5, making the EU positive, and then we don't get the dilemma. We can push back: why assign such high credence? We can also note that if they assign high credence to any mugger, then they are vulnerable to many muggers.

   What cannot be reproduced:
     The sheer scale of the numbers and the emotional weight of a tiny chance of an astronomical payoff. In the classroom, we can't make participants feel the moral gravity of saving 10^100 lives. We can only describe it and hope they engage imaginatively.

     How to paper over the gap: 
       - Use analogies: "Imagine that this is the fate of all sentient life in the universe for eternity."
       - Emphasize that the numbers are stand-ins for something beyond comprehension.

     What will still not land: The intuition that one should ignore such offers because they are obviously scams might be too strong. We have to acknowledge that and then ask: but what if it were true? And what if the probability, though tiny, is not zero? And then we are back to the EU calculation.

   Game's own incentives pulling towards a conclusion not supported by the argument:
     The activity might suggest that EU maximization is flawed because it leads to ruin in the repeated mugging. But note: in the repeated case, if the bets are independent and we maximize EU at each step, then we do accept each time. And the expected total utility is positive. The ruin is only in the actual outcome, which is a low-probability event (but one that happens almost always because the win is so rare). However, the argument for EU maximization is that it maximizes expected utility, not that it avoids ruin in every possible world. The activity might push the group towards a risk-averse or threshold strategy, but that is exactly the tension we want to expose.

     We must be clear in the debrief that EU maximization does not guarantee good outcomes in every instance, only that it maximizes the expectation. The repeated mugging shows that the expectation can be positive and yet the actual outcome is almost certainly a loss. This might lead to a discussion on whether we should care about the expectation or also about the distribution of outcomes (e.g., avoiding bankruptcy).

   Revised detailed design:

   Group size: 18
   Time: 90 minutes

   Structure:
     1. Introduction (10 min): Explain Pascal's mugging and the goal of the activity. Have the group discuss and write down a betting policy (10 min). We expect they will choose an EU-positive rule. If they choose something else, we adjust the offers accordingly.

     2. Starting utility: 1000 utils.

     3. Rounds:

          Round 1 (5 min):
              Offer: Pay 1 util to play. Flip a coin: heads you win 3 utils, tails you win nothing.
              They must decide based on their policy. We expect accept.
              We flip a coin (or simulate). If they win, add 2 utils (net: -1 + 3 = +2, but they paid 1 to play so net gain is 2? Actually: they start with 1000, then pay 1 -> 999. Then if win, get 3 -> 1002. If lose, stay at 999). 
              Expected outcome: they will have 1000.5 on average? But we do one trial. We can let them play and update the score.

          Round 2 (5 min):
              Offer: Pay 10 utils to play. With 10% chance, win 15 utils; else nothing.
              They should reject. So utility remains.

          Round 3: Pascal's mugging (15 min)
              Offer A: "Give me 1 util. In exchange, I will give you a 1 in 10 billion chance (1e-10) of saving 10 billion lives (which we'll say is 10^10 utils)."
                  EU = (1e-10) * 1e10 - 1 = 1 - 1 = 0.
                  If their policy is strict EU>0, they reject. But note: if they have EU>=0, they might accept? We can see.
              Then the mugger (you) says: "Okay, then how about a 1 in 10 billion chance of 100 billion utils?" (i.e., 1e11 utils).
                  EU = (1e-10)*1e11 - 1 = 10 - 1 = 9 > 0 -> they must accept.

              They pay 1 util. We then simulate: we draw a random number between 1 and 10^10. If 1, they win 10^11 utils. Otherwise, nothing. The chance of winning is so low that we can just say they lost. Update utility: 1000 - 1 = 999.

          Round 4: Repeated muggings (20 min)
              Now explain: the same mugger comes back every day for 100 days (or 100 rounds). Each day, the same offer: pay 1 util for a 1 in 10 billion chance of 100 billion utils.
              They must decide for each day? But that would take too long. Instead, we have them decide on the policy for the entire sequence. 
              Their policy (EU maximization) would say accept each time. So they pay 100 utils over 100 days. We then do one draw for the entire sequence: they have 100 independent chances. The chance of winning at least once is 1 - (1 - 1e-10)^100 ≈ 1e-8. We can say they almost certainly don't win. So they end up paying 100 utils. Update utility: 999 - 100 = 899.

              Alternatively, we can break it into two steps: 
                  Day 1: They accept, pay 1 util, and lose -> utility 998.
                  Then ask: what about day 2? ... until they see the pattern.

              But time is limited. We do it in one go: "You accept 100 times. You pay 100 utils. Now, let's see if you win at least once." We can roll a 10^10-sided die 100 times? That's impractical. Instead, we can use a random number generator to see if any of the 100 trials is a win. We can set up a program or just state the chance of winning is negligible and they lose.

          Round 5: Credibility (15 min)
              Offer: "I have a new machine. It creates a new universe with 10^100 utils. The chance it works is 1 in 10^100. Give me 1 util to run it."
                  EU = (1e-100)*1e100 - 1 = 1 - 1 = 0.
              Then the mugger scales: "Okay, then I'll give you a 1 in 10^100 chance of 10^101 utils." -> EU = 10 - 1 = 9.
              But now challenge: How do you know I'm telling the truth? I might be lying. What is the chance that I am telling the truth? Let the group assign a probability q. Then the EU becomes: q * (1e-100 * 1e101) - 1 = q * 10 - 1.
              They must decide: if they think q >= 0.1, then they accept. Otherwise, reject.

              We can have a quick vote on q. If they accept, they pay 1 util and almost certainly lose. Update utility accordingly.

     4. Debrief (20 min):
          - Round 1 and 2: The policy works in ordinary cases.
          - Round 3: The policy forces them to accept a bet that feels absurd. The mugger can always scale up the payoff to beat any fixed threshold. This is Pascal's mugging.
          - Round 4: The repeated muggings show that even though each bet is positive EU, the cumulative loss is certain and the gain is almost certainly zero. This leads to a situation where they have lost a significant amount (100 utils, which is 10% of their initial utility) for nothing. This is the utility monster: the mugger consumes their resources without providing the promised benefit. It also highlights the difference between one-shot and repeated: in the one-shot, the loss is small and the gain huge, but in the repeated, the losses add up.
          - Round 5: The policy must now incorporate the credibility of the probability claim. The mugger's incentive to lie means that the probability might be lower than claimed, and the group must assign a credence. This brings in epistemology.

          We then open discussion: 
            - How does this challenge expected utility maximization?
            - What alternatives are there? (e.g., bounded utility functions, threshold rules, or non-Archimedean probabilities)
            - How does this relate to real-world decision making (e.g., in charity, or in existential risk)?

     Adjustments:
       - The numbers in round 3 and 4: 10^10 and 10^11 are large but manageable in description. We can write them as 10 billion and 100 billion.

       - To make the repeated round more visceral, we can do a quick simulation of 10 rounds (instead of 100) and have them pay 10 utils. But the point about compounding losses is stronger with more rounds.

       - For the credibility round, we can ask: What if the mugger is replaced by a reputable scientist? How much would that change q?

     Materials:
       - Slides with the offers.
       - A scoreboard (whiteboard or poster) to track utility.
       - Random number generator (or coin, dice) for the early rounds. For the very low probability events, we just assume they lose.

     What if the group sets a policy that is not EU-based?
       Example: They set a threshold: accept only if the probability is at least p_min (say 1e-5). Then in round 3, the mugger offers a probability of 1e-10, which is below p_min, so they reject. Then the mugger says: "Okay, what if I lower the probability to 1e-15 but increase the reward to 1e16?" Then EU = 1e-15 * 1e16 = 10 -> positive, and the probability is even lower! This violates their threshold? They might then adjust the threshold? But then the mugger can go to 1e-20 and 1e21, etc. So they see that any fixed p_min can be defeated by a sufficiently large reward. This leads to the same dilemma.

     Therefore, the activity should work even if they set a threshold. The mugger can always lower the probability and raise the reward to get the same EU and then beat it.

     Final note: The numbers are too big to feel, but we do our best. The debrief should emphasize that the problem is theoretical and arises from the mathematical properties of unbounded utility and the lack of a lower bound on probability.

     Let's write out the exact offers and numbers for each round:

     Round 1:
        Cost: 1 util
        Gain: 3 utils with 50% chance
        EU: 0.5*3 - 1 = 0.5
        Action: Accept

     Round 2:
        Cost: 10 utils
        Gain: 15 utils with 10% chance
        EU: 0.1*15 - 10 = 1.5 - 10 = -8.5
        Action: Reject

     Round 3:
        Offer A: 
            Cost: 1 util
            Probability: 1 in 10 billion (1e-10)
            Gain: 10^10 utils (if they value 1 life as 1 util, then saving 10 billion lives)
            EU: 1e-10 * 1e10 - 1 = 1 - 1 = 0
            (They might reject, then mugger escalates)

        Offer B:
            Cost: 1 util
            Probability: 1 in 10 billion (1e-10)
            Gain: 10^11 utils (saving 100 billion lives)
            EU: 1e-10 * 1e11 - 1 = 10 - 1 = 9
            Action: Accept -> pay 1 util, then lose -> utility decreases by 1.

     Round 4:
        We explain: The same mugger comes every day for 100 days. Each day, the same offer as in Round 3B: 1 util for a 1e-10 chance of 1e11 utils.
        They accept every day -> total cost 100 utils.
        We then determine the outcome: the chance of winning at least once is 1 - (1-1e-10)^100 ≈ 1e-8 (one in a hundred million). We say: "You didn't win in any of the 100 days." -> so they lose 100 utils.

     Round 5:
        Offer A:
            Cost: 1 util
            Probability: 1 in 10^100
            Gain: 10^100 utils
            EU: 1e-100 * 1e100 - 1 = 0
            (They might reject, then mugger escalates)

        Offer B:
            Cost: 1 util
            Probability: 1 in 10^100
            Gain: 10^101 utils
            EU: 1e-100 * 1e101 - 1 = 10 - 1 = 9
            But then we challenge credibility: "How much do you trust me? Assign a probability q that I am telling the truth about this offer."
            Then the EU becomes: q * 10 - 1. 
            They accept if q>=0.1. Otherwise, reject.

            We let them discuss and vote on q. We can have a show of hands: what do you think q is? Then compute the EU and decide.

     This should fit in 90 minutes.

     Let me know if you need any adjustments.
answer: |-
  ### Design for the Pascal's Mugging Classroom Activity

  #### **Core Structure**
  - **Duration**: 90 minutes  
  - **Participants**: 18 graduate students (fluent in expected-value reasoning)  
  - **Format**: A runnable game with 6 sequential rounds, escalating from mundane gambles to Pascal's mugging.  
  - **Utility System**: Fictional "utils" (no real money). Start with **1,000 utils** (representing baseline well-being).  
  - **Betting Policy**: The group commits in writing to a rule for accepting gambles (e.g., *"Accept if expected utility (EU) > 0"*).  
  - **Debrief**: Maps each round to decision-theory concepts, emphasizing tensions exposed.

  ---

  ### **Materials**
  1. **Whiteboard** (track utils, display offers).  
  2. **Betting Policy Sheet** (written commitment, displayed publicly).  
  3. **Randomizer App** (simulate probabilities; use large ranges for low-probability events).  
  4. **Offer Cards** (pre-written for each round).  
  5. **Timer** (enforce 10-minute decision windows for critical rounds).  

  ---

  ### **Sequence of Offers**  
  *Total utils start at 1,000. Update after each round.*

  #### **Round 1: Baseline Gamble (Favorable)**  
  - **Offer**: "Pay 1 util. With 50% probability, gain 3 utils; else, gain 0."  
  - **Expected Utility**: \( (0.5 \times 3) - 1 = 0.5 > 0 \).  
  - **Purpose**: Validate EU maximization in intuitive cases. Policy should accept.  
  - **Outcome**: Randomize. If win, utils = 1,000 + 2 (net); if lose, utils = 999.  
  - **Debrief Link**: *"EU maximization works for measurable, everyday risks."*

  #### **Round 2: Baseline Gamble (Unfavorable)**  
  - **Offer**: "Pay 10 utils. With 10% probability, gain 100 utils; else, gain 0."  
  - **Expected Utility**: \( (0.1 \times 100) - 10 = 0 \).  
  - **Purpose**: Test policy at EU=0. If policy rejects, exposes arbitrary cutoff; if accepts, sets up mugging.  
  - **Outcome**: No gain/loss (EU=0). Utils unchanged.  
  - **Debrief Link**: *"Ambiguity at EU=0 foreshadows threshold problems."*

  #### **Round 3: Pascal’s Mugging (One-Shot)**  
  - **Offer**: "Pay 1 util. With probability \(1/10^{10}\), save \(10^{10}\) lives (gain \(10^{10}\) utils)."  
    - **EU**: \( (10^{10} \times 10^{-10}) - 1 = 0 \).  
  - **Mugger Escalation**: If rejected, offer amended: "Probability \(1/10^{10}\), gain \(10^{11}\) utils."  
    - **EU**: \( (10^{11} \times 10^{-10}) - 1 = 9 > 0 \).  
  - **Purpose**: Force acceptance via EU>0. Policy is "mugged" for 1 util.  
  - **Outcome**: Simulate probability (certain loss in practice). Utils -= 1.  
  - **Debrief Link**: *"EU maximization forces acceptance; refusal requires arbitrary threshold or non-Archimedean values."*

  #### **Round 4: Repeated Mugging (Utility Monster)**  
  - **Setup**: "The mugger returns daily for 100 days. Each day: Pay 1 util for a \(1/10^{10}\) chance of \(10^{11}\) utils."  
  - **Decision**: Policy must accept all (each has EU=9>0).  
  - **Outcome**: Total cost = 100 utils. Simulate 100 trials (win probability ≈ \(10^{-8}\)). Announce loss. Utils -= 100.  
  - **Purpose**: Visceral compounding loss. Total sacrifice (100 utils) outweighs modest goods (e.g., a vacation might cost 50 utils).  
  - **Debrief Link**: *"Repeated EU>0 bets can drain resources with near-certainty—utility monster consumes ordinary goods."*

  #### **Round 5: Credibility Challenge**  
  - **Offer**: "Pay 1 util. With probability \(1/10^{100}\), gain \(10^{100}\) utils. *I control the device.*"  
  - **Twist**: Mugger admits self-interest. Group assigns credence *q* (0 ≤ *q* ≤ 1) to truthfulness.  
  - **EU**: \( q \times (10^{100} \times 10^{-100}) - 1 = q - 1 \).  
  - **Purpose**: Expose epistemic vulnerability. *q* is unverifiable and mugger-influenced.  
  - **Outcome**: If *q* > 1 (impossible), accept; else reject. Force debate on *q*.  
  - **Debrief Link**: *"Unverifiable probabilities from interested parties undermine EU calculations."*

  #### **Round 6: Scaled Payoff + Credibility**  
  - **Offer**: "Pay 1 util. With probability \(1/10^{100}\), gain \(10^{101}\) utils."  
    - **Base EU**: \( 10^{101} \times 10^{-100} - 1 = 9 > 0 \).  
  - **Credibility**: Apply *q* from Round 5: **EU = \( q \times 9 - 1 \)**.  
  - **Purpose**: Combined escalation. If *q* < \(1/9\) (e.g., 0.1), EU<0; if *q* > \(1/9\), EU>0.  
  - **Outcome**: Final utility adjustment.  
  - **Debrief Link**: *"Mugger can always scale payoffs to exploit low q or low probability thresholds."*

  ---

  ### **Debrief Framework**  
  **Time**: 20 minutes  
  **Goal**: Map game outcomes to philosophical tensions.  

  | **Round** | **Decision-Theory Tension** | **Philosophical Question** |
  |-----------|------------------------------|----------------------------|
  | 1–2       | EU works for "normal" gambles. | Why trust EU? |
  | 3         | EU>0 forces acceptance; refusal requires thresholds. | Is arbitrariness acceptable? |
  | 4         | Repeated EU>0 bets compound losses. | Does EU maximization ignore systemic risk? |
  | 5         | Credence (*q*) dominates EU. | How to assign probability to unverifiable claims? |
  | 6         | Payoff scaling defeats fixed thresholds. | Can any non-arbitrary rule resist mugging?  

  **Key Discussion Prompts**:  
  1. "Did the game change your view of EU maximization? If so, when?"  
  2. "How might bounded rationality, lexical priorities, or probability caps resolve this?"  
  3. "In Round 5, how did you assign *q*? Is this epistemically justifiable?"  
  4. "Does repeated mugging suggest we need 'sequence-aware' decision rules?"  

  ---

  ### **Handling Complications**  
  #### **1. One-Shot vs. Repeated Mugging**  
  - **Exposed in Round 4**: Losses compound (100 utils) while gains vanish. Participants *feel* the "utility monster" draining value from ordinary goods.  
  - **Mitigation**: Pre-game framing: *"You’re committing to a lifelong policy."*  

  #### **2. Stipulated Probability (Credibility)**  
  - **Exposed in Rounds 5–6**: *q* becomes the critical variable. Force debate:  
    - *"Would you accept if NASA made the offer? Why trust a mugger?"*  
    - *"Can you assign non-arbitrary q?"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Participants dismiss large numbers as "unrealistic."  
     - **Fix**: Pre-game priming: *"Utils represent moral weight. 10^10 lives = all humans; 10^100 = all possible beings."* Use existential stakes (e.g., "saving civilizations").  
     - **Gap**: True scale remains unimaginable. **Paper over**: Use analogies (e.g., "winning the lottery while being struck by lightning").  

  2. **Problem**: Group abandons policy mid-game.  
     - **Fix**: Enforce written commitment. Remind: *"Real agents can’t renegotiate when mugged."*  

  3. **Problem**: Randomization breaks immersion (e.g., Round 3 win).  
     - **Fix**: Rig outcomes (pre-set loss) for pedagogical effect.  

  4. **Problem**: Credence (*q*) debate dominates time.  
     - **Fix**: Cap discussion at 10 minutes. Use quick voting.  

  ---

  ### **What the Game Cannot Reproduce**  
  - **Sheer Scale of Numbers**: No classroom analog can make \(10^{100}\) utils feel viscerally urgent.  
    - **Why it matters**: Real-world mugging relies on emotional weight of astronomical stakes.  
    - **Mitigation**:   - **Mitigation**: Substitute with relatable analogies:  
    > *"Imagine losing $1 today for a 1-in-10-billion chance to save humanity. Now imagine the mugger says, 'What if I could save a quadrillion future civilizations?'"*  
    - **Compromise**: Focus on the *structural* takeaway: scaling payoffs defeat thresholds.  

  - **Incentive Distortion**: The game’s "utils" are fictional, so participants may accept muggings they’d refuse in real life.  
    - **Risk**: Over-representation of EU-maximization adherence.  
    - **Mitigation**: Debrief explicitly: *"Did fictional utils make bets easier to accept?"*  

  ---

  ### **Incentive Warnings**  
  1. **Round 4 (Repeated Mugging)**: The certainty of losing 100 utils may push groups toward:  
     - **Risk-aversion**: Reject all future bets (abandoning EU).  
     - **Debrief Correction**: *"EU maximizers accept each bet—real tension is between per-bet EU and long-term outcomes."*  

  2. **Credence Assignment (Round 5)**: Low *q* may feel "rational," but:  
     - **Risk**: Dismissing all unverifiable claims ignores that some (e.g., scientific predictions) warrant high *q*.  
     - **Debrief Correction**: *"The problem isn’t low q—it’s the mugger’s ability to scale payoffs to defeat your q."*  

  ---

  ### **Final Setup Script**  
  **Opening (5 min)**:  
  *"Today, you commit to a betting policy. We’ll test it with gambles escalating to Pascal’s mugging. Start with 1,000 utils. Policy must be followed rigidly."*  

  **Policy Commitment (10 min)**:  
  - Group drafts and signs: *"We accept gambles iff [RULE]."* (Anticipate EU>0 or thresholds.)  

  **Rounds 1–6 (50 min)**:  
  - Use offer cards, track utils, force escalation.  

  **Debrief (20 min)**:  
  - Map rounds to tensions, discuss alternatives (lexical orders, bounded utility).  

  **Closing (5 min)**:  
  *"Pascal’s mugging isn’t about numbers—it’s about whether decision theory can be both consistent and sane."*  

  This design forces engagement with the mugging’s two-way squeeze, exposes epistemic/strategic traps, and makes EU abandonment feel like a principled retreat. Run it twice if time allows—groups refine strategies dramatically on replay.
