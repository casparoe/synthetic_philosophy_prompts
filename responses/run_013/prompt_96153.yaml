prompt: |-
  Okay, I need help drafting something and I want you to take it seriously. You're a philosopher who works on moral status, virtual objects, and games — someone who can move between metaphysics and actual player practice. Think carefully, start by brainstorming the real points of friction, then write the document.

  I've got two freinds who've been in this arguement for about a year about whether video-game characters matter morally. One is a hard sentientist: moral status requires phenomenal consciousness, so since NPCs aren't conscious — even the fancy LLM-driven ones, probably — nothing you do to them is wrong in itself. The other is a practice-first relationalist: moral status isn't a natural property objects have on their own; it's conferred through social practices, attachments, and commitments, so a character can matter morally because of how players, communities, and institutions treat it, even if there's no one home. They keep talking past each other and I want the joint statement they could both sign after a good-faith adversarial collaboration. Not a dialogue, not a verdict on who's right. The document itself.

  Please include:

  1. A numbered list of claims both sides can sign — about consciousness, fiction, player experience, what moral status is supposed to do, and cases like save-scumming (including the asymmetry between a reloaded death and a permadeath loss), a speedrunner who grinds a scripted torture animation because it's the fastest route, modded torture animations, NPCs that 'remember' being mistreated across sessions, and games that patch out a character's death because players mourned. Make these claims non-vacuous and not slanted.

  2. The precise disagreements, phrased so each side would accept the wording of its own view. No strawmen. If part of the dispute is verbal — e.g., they mean different things by 'matters morally' — say which part and why.

  3. The cruxes: sub-questions where settling them would actually move at least one side. I suspect one is whether moral status needs a subject who can be harmed, and another is whether collective practices can create obligations not reducible to individual attitudes. But don't just take my guesses; find the real ones.

  4. For each crux, a concrete case or argument both sides agree bears on it, plus what each side predicts about that case. Write the predictions in advance, before adjudicating.

  5. A disagreements table at the end.

  Don't give me citations, a reading list, or bibliography — I can't look stuff up and I don't want the answer to depend on sources. I want the conceptual work, the formulations, and the cases. Don't lean on super niche theory names either; if you need a distinction, make it up and explain it in plain language. Also don't make the agreed-claims section vacuous ('both sides think morality matters') or slanted toward one side.

  Take your time. Maybe start by listing the actual points of friction, then draft.
