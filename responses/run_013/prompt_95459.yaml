answer: |-
  Based on your seminar's framing and the claim that pervasive *vertical/path redundancy* is the norm in large-scale historical events, here are the key implications across your areas of interest, presented in American English:

  **Core Claim Recap:** For major historical outcomes (E), almost any proposed cause (C) is redundant because (a) other sufficient pathways existed (vertical redundancy), and (b) C is typically neither necessary nor sufficient on its own (INUS-like). Vertical redundancy (alternative paths) is seen as more disruptive than horizontal redundancy (multiple concurrent sufficient causes).

  **Implications:**

  1.  **For Historiographical Practice (Ranking/Weighting Causes):**
      *   **The Collapse of Simple Causal Budgets:** Your seminar's exercise failing is predictable. Assigning fixed "shares" (summing to 1) assumes causes are additive and mutually exclusive in their contribution, ignoring that removing one path often leaves others intact. Vertical redundancy makes a linear "causal pie" nonsensical.
      *   **Shifting the Focus from "Weight" to "Role" and "Contingency":**
          *   **Necessary Preconditions vs. Triggering Causes:** Ranking might survive by distinguishing *necessary background conditions* (without which E is impossible, e.g., deep social inequality for a revolution) from *contingent triggering events* (which path was taken, e.g., a specific protest or assassination). The *preconditions* are often more fundamental but less specific; the *trigger* explains the timing and specific form. Neither is usually *sufficient* alone.
          *   **Mechanism Elucidation:** Instead of weighting isolated causes, focus shifts to explaining the *causal mechanisms* or *processes* along the *actual path* that occurred. Explaining *how* the revolution unfolded via path A becomes the goal, acknowledging path B was possible but wasn't taken. The "weight" of a cause lies in its specific role within the operative mechanism.
          *   **Contingency of the Path:** Historians can meaningfully argue why *this particular path* (C leading to E) was taken rather than an alternative path (C' leading to E), even if E was overdetermined. This involves analyzing specific conjunctures, decisions, and constraints at critical junctures.
          *   **Robustness Analysis:** Explain *why* the outcome was so robust – what constellation of factors made multiple paths feasible? This shifts explanatory focus to the structural conditions enabling redundancy itself.
      *   **Reconstruction, Not Abandonment:** Ranking *isolated causes* on a linear scale is likely futile. However, historians can still:
          *   Identify necessary preconditions (though these may be very broad).
          *   Analyze the relative significance of factors *within* the actual causal pathway.
          *   Assess the *degree of contingency* – how easily could a small change have diverted history down a different path to the *same* outcome, or even a *different* outcome? Vertical redundancy suggests high path-contingency but potentially low outcome-contingency.

  2.  **For Counterfactual Analysis:**
      *   **Limited Discriminatory Power for Outcome Necessity:** Standard "but-for" (sine qua non) counterfactuals ("Would E not have occurred if C had not?") lose much of their power. If vertical redundancy holds, the answer for many C's will be "No, E would still have happened via another path." This corrodes claims that any *single* C was necessary for E.
      *   **Retained Discriminatory Power for Path and Specificity:**
          *   **Path-Specific Counterfactuals:** Counterfactuals *can* powerfully show that *this specific path* (involving C) would not have occurred without C. This helps explain the *actual historical sequence and character* of E. "Without Archduke Ferdinand's assassination, would WWI have started *in August 1914 via a crisis centered on Serbia*? Probably not." (Even if war via another crisis was likely).
          *   **Tracing Mechanisms:** Counterfactuals remain crucial for testing proposed causal *mechanisms* within the actual path. "If C were absent, would the mechanism linking other factors to E within this path still have functioned?"
          *   **Contingency Assessment:** Counterfactuals are essential for gauging the *fragility* or *robustness* of the actual path. How easily could a minor change have derailed *this specific pathway* to E? How many alternative paths existed?
          *   **Establishing Sufficient Sets:** While single causes may not be necessary, counterfactuals can help identify minimal *sufficient sets* of conditions that, together, *would* have caused E (even if other sufficient sets also existed).
      *   **What it Cannot Establish:** Counterfactuals generally *cannot* prove that any single C was *necessary* for E when vertical redundancy is pervasive. They struggle to assign unique causal "weight" in a quantitative sense to individual factors when paths are replaceable.

  3.  **For Contexts Outside Academic History (Focus on Law - Tort):**
      *   **Challenging the "But-For" Test:** Your friend is astute. Pervasive vertical redundancy directly threatens the but-for (sine qua non) test, the cornerstone of factual causation in tort law. If the harm (E) would likely have occurred anyway via another path (C') even without the defendant's negligent act (C), then C fails the but-for test. This seems to let defendants off the hook in overdetermined scenarios, which feels unjust (e.g., two independently negligent polluters each dumping enough toxin to cause an illness; neither is but-for cause if the other's act alone was sufficient).
      *   **More Interesting Than Yes/No: Legal Adaptations:** The law hasn't collapsed; it has developed workarounds precisely because overdetermination (often horizontal, but path exists too) is recognized:
          *   **Substantial Factor Test:** Many US jurisdictions use this alongside or instead of but-for for overdetermined cases. Did C contribute substantially to E? This focuses on the defendant's *actual contribution* to the harm that occurred, even if not strictly necessary. It aligns better with vertical redundancy's focus on the actual path taken.
          *   **Alternative Liability (Summers v. Tice Doctrine):** When multiple defendants commit substantially similar tortious acts, but only one *actually* caused the harm and it's impossible to know which, the burden shifts to each defendant to prove they *didn't* cause it. This is a pragmatic solution for specific horizontal redundancy cases.
          *   **Material Contribution to Risk:** In some toxic tort or medical malpractice contexts involving indivisible injuries, courts may find liability if the defendant's negligence materially increased the *risk* of the harm that occurred, even if not provably the but-for cause (especially where scientific uncertainty prevails).
          *   **Sufficient Cause Approaches:** Some legal theorists argue for focusing on whether the defendant provided a *sufficient condition* for the harm within a set of background conditions, regardless of whether other sufficient sets existed.
      *   **Implication:** Pervasive vertical redundancy *does* expose the limitations of the pure but-for test in complex real-world scenarios. However, legal systems pragmatically adapt through doctrines like substantial factor, alternative liability, and material contribution to risk to achieve fairer outcomes and uphold deterrence, acknowledging that causation isn't always neat necessity. It doesn't collapse tort law, but it forces more nuanced legal reasoning.

  4.  **For Realism about Causation in History:**
      *   **Supports a *Mechanistic* Realism:** The claim strongly suggests that *causal mechanisms* are real and operative in the world. The reason E would happen even without C is precisely because *other real mechanisms* (path C') existed and were poised to produce E. The *robustness* of the outcome points to underlying real structures and forces.
      *   **Challenges *Singular Necessary Condition* Realism:** It undermines the idea that large-scale historical outcomes typically hinge on one or a few uniquely necessary events/conditions. If outcomes are robustly overdetermined by multiple paths, no single node in those paths is usually indispensable for the outcome itself.
      *   **Highlights the Epistemological Challenge:** While mechanisms may be real, pervasive redundancy makes *identifying* specific necessary conditions or assigning unique causal weight to individual factors enormously difficult, perhaps often impossible. Our *explanations* are necessarily selective and path-dependent, focusing on the actual route taken.
      *   **Nuanced Conclusion:** The claim supports a *realist view that causation operates through complex, often redundant, mechanisms in history*. However, it simultaneously highlights the severe *epistemological limitations* historians face in pinpointing singular necessary causes or definitive weights, favoring explanations focused on processes, conjunctures, and the actual pathways realized. Realism about causal *powers* and *processes* remains viable, even if realism about the unique necessity of specific events for large outcomes is often unsustainable.

  **In Summary:** Accepting pervasive vertical path redundancy forces a significant shift in historical (and legal) causal reasoning. It renders simplistic causal weighting exercises incoherent and weakens traditional counterfactual tests for necessity. However, it doesn't make explanation impossible. It refocuses historiography on necessary preconditions, elucidating actual mechanisms, analyzing path-specific contingency, and understanding robustness. Counterfactuals retain value for exploring paths and mechanisms. Law adapts pragmatically. Mechanistic realism survives, but the quest for singular necessary causes often falters. The key is moving beyond the search for "the cause" towards understanding the complex web of conditions and processes that make outcomes robust and shape the specific paths taken.
