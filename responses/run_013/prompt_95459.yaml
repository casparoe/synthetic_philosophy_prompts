  First, I need to unpack their distinction between horizontal and vertical redundancy. Horizontal is like multiple sufficient causes operating independently—say, two assassins firing at once. Vertical is more about different pathways leading to the same outcome, even if one cause is removed. The user thinks vertical is more common and problematic in history. 

