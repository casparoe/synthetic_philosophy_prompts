  {"kind": "money", "constructed_from": "collective agreement + institutional reinforcement", "what_constrains_it": "material practices (debts, wages), global trade interdependence", "what_the_decree_gets_wrong": "treats intersubjectivity as voluntarism; ignores embedded infrastructure", "looping_effect": "using money entrenches expectations of future value", "verdict": "DECREE FAIL: cannot replace systemic keystone by wishful thinking"}  
  {"kind": "race", "constructed_from": "historically contingent power hierarchies + pseudoscientific taxonomy", "what_constrains_it": "structural inequities (housing, healthcare), embodied experiences", "what_the_decree_gets_wrong": "confuses constructed origin with present malleability", "looping_effect": "classification reinforces identity/inequality, reshaping the classified", "verdict": "DECREE FAIL: erases metric for injustice without remedying causes"}  
  {"kind": "gender", "constructed_from": "normative performances + institutional recognition", "what_constrains_it": "cultural rituals, legal binaries, interpersonal expectations", "what_the_decree_gets_wrong": "assumes performativity halts if state refuses to acknowledge", "looping_effect": "resistance/reification loops amplify when categories are challenged", "verdict": "DECREE FAIL: top-down edicts cannot override bottom-up citational practices"}  
  ```  

  **SATIRICAL LIBERTIES NOTE**:  
  The piece exaggerates state capacity to reshape constructs by ignoring *material constraints* (e.g., capital’s role in money) and *embodied experiences* (e.g., racialization’s somatic impacts). It flattens debates within constructionism (e.g., whether money is *more* malleable than race) and implies all constructs are equally "top-down," whereas some (like gender) are co-constructed bottom-up. The satire targets a *specific* misreading of construction ("if imagined, then easily reimagined") but leans on Hacking’s looping effects and Searle’s institutional facts for comedic rigor.
