prompt: |-
  I keep running into a pattern and cannot find a name for it. Consider a system that reasons and can also reason about its own reasoning: a person surveying her own beliefs, a program inspecting its own proofs, a machine trying to establish the reliability of the successor it is about to build. Grant it the principle that its own conclusions are true — if it has established that P, then P. The principle reads as a modest expression of self-confidence, but it is not merely unprovable: adopting it licenses the system to establish anything whatever, true or false. Withdraw it and the system is left with a strange remainder: of any single proof it has actually carried out, it can satisfy itself that the conclusion is true, yet it can never establish the one general claim that whatever it proves is true.

  The shape of this is familiar from the author who is entitled to each sentence in her book but not to their conjunction, though the resemblance is one of shape only: there nothing is poisonous, whereas here the general claim, were the system able to reach it, would be corrupting.

  I am not after a bare label. If the pattern has an established name, say which concept it is; if the nearest concepts are near misses, say how each differs and which fits best. In particular, explain why the self-trust principle is harmless when read as a claim about truth and ruinous when read as a claim about what the system can prove, and whether that asymmetry is a fact about provability, about belief, or about self-reference as such. If nothing established fits, coin a term, define it, and mark its edges. Commit to a position rather than laying out candidates for me to choose from.
reasoning: |-
  Hmm, the user is describing a fascinating logical paradox involving self-referential systems. They're observing that when a reasoning system (like a person, AI, or formal system) assumes the general principle "if I prove P, then P is true," this leads to absurdity where it can prove anything. Yet without this principle, while it can verify individual proofs, it can never establish its own global reliability. 

  They've noticed this resembles Moore's paradox ("I believe it's raining but it isn't") but correctly point out the key difference: Moore's paradox is about belief consistency, while this is about systemic self-validation leading to logical collapse. The user clearly has deep familiarity with formal logic and philosophy of mind - they're not just seeking terminology but a conceptual dissection.

  The core tension they're highlighting lies in the gap between:
  - Local soundness (each proof is verifiable individually)
  - Global soundness (a universal claim about all proofs)

  I recall that in formal systems, this manifests as Tarski's undefinability theorem - no consistent system can define its own truth predicate. For belief systems, it relates to Hintikka's doxastic logic where self-trust axioms cause inconsistency. The asymmetry they note stems from truth being extensional (about states of affairs) while provability is intensional (about internal operations).

  What they call "self-trust principle" is precisely what makes a system ω-inconsistent in Gödel's sense. When they describe the "strange remainder," that's the system being Σ₁-sound but not Π₂-sound. Their example of an author trusting sentences but not their conjunction perfectly captures the ω-inconsistency scenario.

  The naming question is tricky. "Reflection principle" is close but usually refers to consistent local instances (if ⊢φ then φ), not the inconsistent universal version. "Self-verification paradox" might work but is too vague. After mapping the logic, I'll propose "ω-inconsistency manifestation" as the precise term, since that's the mathematical heart of it.

  Their deeper request seems to be understanding why self-reference corrupts global claims but not local ones. The answer lies in the quantifier shift: universal generalization fails precisely because the system can construct pathological statements that exploit self-reference (like the Gödel sentence). This isn't about belief or provability per se, but about any sufficiently strong reflexive system - it's a consequence of the diagonal lemma.
answer: |-
  Your pattern is a profound manifestation of **ω-inconsistency** within systems capable of self-reference. This is not merely a resemblance to Moore's paradox; it is a specific, rigorous failure of **global soundness** in formal systems and introspective reasoning agents. Below, I define the core concept, explain the asymmetry, and clarify why existing terms are near misses. I commit to **ω-inconsistency** as the precise label, generalized to belief systems as **introspective ω-inconsistency**.

  ### The Name and Definition
  - **Core Concept**: **ω-inconsistency** (generalized beyond arithmetic).  
    A system is ω-inconsistent if it can prove **P(n)** for every specific instance *n* (e.g., "Proof #1 is sound," "Proof #2 is sound," etc.), but **cannot prove the universal generalization ∀n P(n)** ("All my proofs are sound")—or worse, can prove its negation.  
  - **Your Pattern**: The system can verify **each specific proof it completes** ("I proved P, therefore P is true") but cannot prove the **universal claim** "Everything I prove is true" without collapsing into triviality (proving all statements, true or false).  
  - **Generalized Term**: **Introspective ω-inconsistency**.  
    *Definition*: A self-referential system (logical, computational, or doxastic) that satisfies:  
    1. **Local Soundness**: For each proven conclusion *Pₖ*, the system accepts "If I proved *Pₖ*, then *Pₖ* is true."  
    2. **Global Unsoundness**: It cannot consistently assert the universal principle "∀*P* (If I prove *P*, then *P* is true)" without becoming inconsistent.  
    3. **Self-Trust Collapse**: Adopting the universal principle ("I am globally sound") allows proving any statement.  

  ### Why Existing Terms Are Near Misses
  1. **Tarski's Undefinability Theorem**:  
     - *Near Miss*: Proves truth cannot be defined *within* the system.  
     - *Difference*: Your pattern focuses on the **inconsistency arising from self-trust**, not just undefinability. Tarski explains *why* the universal claim is inexpressible; ω-inconsistency explains *how attempts to force it* cause collapse.  

  2. **Löb's Theorem**:  
     - *Near Miss*: States that a system can prove "If I can prove *P*, then *P* is true" **only if** it can already prove *P*.  
     - *Difference*: Löb's theorem prevents proving soundness for *unproven* statements. Your pattern highlights that assuming global soundness for *all* statements (including unproven ones) is catastrophic.  

  3. **Moore's Paradox**:  
     - *Near Miss*: "I believe *P* but *P* is false" is absurd but not inconsistent.  
     - *Difference*: Moore's paradox concerns **belief avowal**, not systemic soundness. Your pattern involves a **logical contradiction** (explosion) from self-trust, not mere pragmatic absurdity.  

  4. **Reflection Principle**:  
     - *Near Miss*: Axioms like "If ⊢*P* then *P*" are sometimes added to systems.  
     - *Difference*: Reflection is **locally admissible** (per proof) but **globally catastrophic**. Your system can use reflection per proof (local soundness) but not universally.  

  ---

  ### The Asymmetry: Why Truth vs. Provability Matters
  The asymmetry is **fundamentally about provability and self-reference**, not truth or belief alone. Here’s why:  
  1. **Truth Claim**: "If I conclude *P*, then *P* is true" **about a specific instance** is harmless.  
     - *Reason*: It merely affirms a fact about the world (*P* holds) after proving it. No self-referential loop exists.  
     - *Example*: After proving "2+2=4," you say, "So 2+2=4 is true." This is banal.  

  2. **Provability Claim**: "Whatever I prove is true" as a **universal principle** is ruinous.  
     - *Reason*: Provability predicates (like "I can prove *P*") are **intensional** and susceptible to diagonalization. Gödelian self-referential statements (e.g., "This sentence is unprovable") exploit this.  
     - *Collapse Mechanism*:  
       - Assume the system has a provability predicate **Prov(*P*)** meaning "I can prove *P*."  
       - Adopt the axiom **∀*P* (Prov(*P*) → *P*)**.  
       - By Löb's theorem, this implies **∀*P* Prov(*P*)**: the system can prove *everything*.  
       - *Why?* The axiom conflates **provability** with **truth**, allowing the system to "prove" its own infallibility. Gödel sentences then force inconsistency.  

  3. **Root Cause**:  
     - **Provability is not truth**: Provability depends on the system's axioms and rules; truth depends on the model. Confusing them invites liar-like paradoxes.  
     - **Self-reference amplifies the gap**: Systems that reason about their own proofs can construct statements that sabotage universal soundness claims.  

  ---

  ### Why "Introspective ω-inconsistency" Fits Best  
  - **ω-inconsistency** captures the key mathematical phenomenon: the system "should" be sound (all instances hold), but the universal quantifier breaks it.  
  - **Introspective** extends it to agents (humans, AI) surveying their own states.  
  - **Edges of the Concept**:  
    - *Applies to*: Any system with (a) self-representation of its proofs/beliefs, (b) resources to diagonalize (e.g., Peano arithmetic, Turing-complete machines).  
    - *Excludes*: Systems without self-reference (e.g., a calculator) or too weak for diagonalization (e.g., propositional logic).  
    - *Not just logic*: Human thinkers face this when claiming "All my beliefs are true." The claim is either hollow (unprovable internally) or dogmatic (immune to counterevidence).  

  ### Final Position
  Your pattern is **introspective ω-inconsistency**: a system can **verify its soundness locally** but **cannot self-certify global soundness** without collapsing. The asymmetry arises because **provability is a computational property** vulnerable to self-reference, while **truth is semantic** and inert. This is not about belief or truth per se, but about **the limits of self-knowledge in computational systems**. The "strange remainder" is the irreparable gap between local verification and global justification—a gap enforced by the mathematics of self-reference.
