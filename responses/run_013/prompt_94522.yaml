  Verbal Disagreement:
  The collaborators agree that part of the dispute may be verbal, particularly regarding the definition of "conscious experience." The Orwellian view defines conscious experience as occurring at the time of sensory input, even if it is fleeting and subsequently revised. The Stalinesque view reserves the term "conscious experience" for the final, coherent percept that enters awareness after postdictive processing. Thus, the disagreement about whether the unrevised first flash is "consciously experienced" may hinge on this terminological difference. However, both agree that there are empirical aspects to the dispute, such as the timing of reportable content and the effects of disruption.

  Regarding the variant with probing the midpoint color before the second flash:
