  We are drafting a joint statement from an Orwellian and a Stalinesque after adversarial collaboration on the color phi phenomenon.

  Agreed Claims:
  1. The color phi phenomenon is a robust perceptual illusion: when two differently colored dots are flashed in quick succession at different spatial positions, observers report seeing a single dot moving from the first to the second position and changing color during the motion, even though the second dot has not yet been presented at the time the color change is perceived in mid-trajectory.
  2. Any adequate theory of the color phi phenomenon must explain the following:
     a. The apparent motion and color change are experienced as occurring before the second flash is physically presented.
     b. The experience is unitary and continuous, not as two disjoint events.
     c. The illusion occurs only within a specific range of temporal intervals and spatial separations.
  3. The dispute between Orwellian and Stalinesque views is about the timing of conscious experience relative to neural processing and the point at which the illusory content is generated.
  4. Both sides agree that the brain engages in postdiction: later sensory information can influence the perceived content of earlier events. However, they disagree on when and how this postdiction affects conscious experience.

