answer: |-
  ### Remarks
  Good afternoon. We are here to dedicate this marker to Margaret Ostrowski — a woman who spent nearly forty years in the archives of this county, transcribing wills, deeds, and tax rolls, and who recorded the voices of over three hundred former Corwin Mills workers before the last of them passed away. It is an honor to speak of her work, but I must begin with a confession: I stand here uneasy. Uneasy because this bronze plaque, like all such markers, is an act of official history — the kind that erects permanence from complexity. And Margaret Ostrowski devoted her life to the people such monuments often overlook: the weavers, the spinners, the laborers whose names rarely grace formal records.  

  She knew history is not just grand events, but the texture of daily life. So she sat at kitchen tables, in parlors, and on porch steps, listening. Not as a scholar, but as a neighbor with a tape recorder. One story she preserved — and I reconstruct this from her notes, not as direct testimony — tells of a man who, during the Great Depression, would sneak into the mill at dawn to warm his daughter’s coat by the machinery before walking her to school. He knew the overseer would fire him if caught. That act of quiet defiance — keeping one child warm — speaks of dignity in the face of invisibility. Margaret collected hundreds of such moments. Not to make a single hero, but to show how ordinary lives hold extraordinary resilience.  

  Yet here we are, raising a marker to her alone. This ceremony risks turning Margaret into what she fought against: a simplified emblem. She was not a professional historian, but an autodidact who taught herself paleography to decipher fading deeds. She was not an academic, but a volunteer who gave three decades to the historical society, driven by the conviction that every life leaves a trace worth saving. If we reduce her to a symbol — "the devoted amateur," "the archive saint" — we betray the very history she honored. Margaret would bristle at hagiography. Her work was an antidote to it.  

  This is the tension we inherit today. Official history seeks fixed narratives; Margaret sought fluid, human truths. She understood what microhistorians call the "singular exception" — the wager that one life, however seemingly minor, can illuminate an entire world. Her interviews proved it: a single mill worker’s memory could unravel the hidden threads of labor, migration, or loss that textbooks flatten. But if we apply that same lens to Margaret herself, turning her into a specimen of grassroots scholarship, we commit the error she documented. We obscure the person in service to an idea.  

  So how do we honor her? Not by speaking for the workers she recorded — we cannot presume that voice. Not by reducing her to a parable of dedication — she was too singular for that. Instead, we honor her by continuing the work she began: by listening to the stories still unfolding in our community, by preserving the fragile and the uncelebrated. This marker is a beginning, not an endpoint. Let it be a reminder that history is not just carved in bronze, but lived in the voices we preserve and the questions we refuse to silence.  

  Margaret Ostrowski taught us that archives are made of people. Let us tend to them with the same care she showed — not as keepers of relics, but as witnesses to lives that resist simplification. Thank you.

  ---

