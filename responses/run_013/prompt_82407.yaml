answer: |-
  Below is a decision tree for selecting axiomatic bargaining solutions based on your modeling commitments and axioms. The tree starts from the basic setup (two players, convex feasible set \(S \subseteq \mathbb{R}^2\), disagreement point \(d \in S\)) and guides users to a solution concept through key questions about axioms. Solutions covered: **Nash**, **Kalai-Smorodinsky**, **Egalitarian**, **Utilitarian**, and **Maximin/Cautious**. Unnamed leaves are included where no major solution fits.  

  ---

  ### **Decision Tree for Bargaining Solutions**

  **1. Should the solution be invariant to rescaling utilities? (Scale Invariance)**  
     - **Yes** → Go to 2.  
     - **No** → Go to 6.  

  **2. Should the solution treat players symmetrically if \(S\) is symmetric? (Symmetry)**  
     - **Yes** → Go to 3.  
     - **No** → Go to 5.  

  **3. Should removing "irrelevant" alternatives not change the solution? (Independence of Irrelevant Alternatives, IIA)**  
     - **Yes** → **Nash solution**  
       *Most awkward commitment:* Fails monotonicity when \(S\) expands favorably (e.g., a new Pareto-better option can cause a player to lose utility).  
     - **No** → Go to 4.  

  **4. Should players weakly gain when \(S\) expands in their favor? (Individual Monotonicity, IM)**  
     - **Yes** → **Kalai-Smorodinsky solution**  
       *Most awkward commitment:* Depends on the "ideal point" (utopian utilities), which may be unrealistic or hard to define.  
     - **No** → *Unnamed solution*  
       *Reason:* No major solution satisfies SI, Symmetry, and Pareto without IIA or IM.  

  **5. Should the solution maximize the sum of utilities? (Utilitarian Principle)**  
     - **Yes** → **Utilitarian solution**  
       *Most awkward commitment:* May assign zero to one player if it boosts total surplus (ignores equity).  
     - **No** → *Unnamed solution*  
       *Reason:* Scale-invariant, asymmetric solutions without utilitarianism lack standard axioms (e.g., weighted Nash requires weights).  

  **6. Should players receive equal gains over \(d\)? (Gain Equality)**  
     - **Yes** → **Egalitarian solution**  
       *Most awkward commitment:* Not scale-invariant—arbitrary utility calibrations change outcomes.  
     - **No** → Go to 7.  

  **7. Should the solution maximize the minimum utility? (Maximin Criterion)**  
     - **Yes** → **Maximin/Cautious solution**  
       *Most awkward commitment:* Ignores \(d\) beyond feasibility; may equalize utilities even if \(d\) is asymmetric.  
     - **No** → *Unnamed solution*  
       *Reason:* Non-scale-invariant solutions without gain equality/maximin lack axiomatic support.  

  ---

  ### **Notes on Ambiguities & Omissions**
  - **Unseparated solutions:**  
    - **Egalitarian vs. Maximin:** The tree separates these, but they *coincide in symmetric problems* (both yield equal utilities).  
    - **Utilitarian with claims:** The tree omits solutions using claims/entitlements beyond \(d\) (e.g., proportional bargaining). These require additional axioms (e.g., "midpoint domination").  
  - **Weighted solutions:** The tree cannot identify **asymmetric Nash** (needs predetermined weights) or **Kalai-Smorodinsky with claims**. These require external weight assignments.  

  ---

  ### **Weakest Branch: Non-Scale-Invariance (Branch 6–7)**  
  I am least confident in **Branch 6–7** (non-scale-invariant solutions). The distinction between "gain equality" (Egalitarian) and "maximin utility" (Maximin) feels artificial because:  
  - In practice, non-scale-invariance often reflects interpersonal utility comparisons, which both solutions implicitly use.  
  - Real-world applications might blend equity (Egalitarian) and risk-aversion (Maximin).  

  **How to improve:**  
  1. **Add a sub-branch for "claims":** Ask *"Are players' entitlements defined beyond \(d\)?"* to separate egalitarian (no claims) from proportional solutions (with claims).  
  2. **Clarify monotonicity:** For non-scale-invariance, add *"Should expansions of \(S\) always weakly benefit both players?"* to isolate Egalitarian (satisfies strong monotonicity).  

  I would redraw the tree if seminar participants prioritize **claims-based solutions** (e.g., in legal contexts) or **non-convex problems** (which break standard axioms).  

  --- 

  ### **Tree Summary**  
  | Path                                      | Solution               |  
  |-------------------------------------------|------------------------|  
  | SI → Sym → IIA                            | Nash                  |  
  | SI → Sym → ¬IIA → IM                      | Kalai-Smorodinsky     |  
  | SI → ¬Sym → Utilitarian                   | Utilitarian           |  
  | ¬SI → Gain Equality                       | Egalitarian           |  
  | ¬SI → ¬Gain Equality → Maximin            | Maximin/Cautious      |  
  | Other paths                               | Unnamed               |  

  This tree balances axioms and pragmatism. For teaching, emphasize that **Nash** and **Kalai-Smorodinsky** dominate SI applications, while **Egalitarian/Utilitarian** suit equity/efficiency trade-offs.
