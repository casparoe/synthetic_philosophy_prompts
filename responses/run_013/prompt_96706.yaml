prompt: |-
  ok so I'm in this third-year ethics seminar on promises and it's kind of taking over my life. The seminar leader keeps saying "the cases decide the theories" and then hands us the most boring cases imaginable (guy promises to meet someone for lunch, shocker, he doesn't show). So for my final essay I want to run it the other way round: here are some promises that I think actually put pressure on the standard accounts, and I want you to rank the accounts by how well they handle them, best to worst, with a one-line reason for each, and a note on which cases each view just has to bite the bullet on.

  The accounts, as I understand them: (1) the expectation/assurance one, where the wrong of breaking a promise is that you led someone to count on you and then let them down (Scanlon-ish, the "principle of fidelity" thing); (2) the practice/convention one, where promising is a social practice with constitutive rules and your obligation comes from fairness in a just scheme of rules you've benefitted from (Rawls, I think, and Hume is somewhere in this family with the coordination story); (3) the joint-commitment one, where a promise literally makes the two of you a plural subject and you can't unilaterally walk out of it (Gilbert); (4) the authority/standing one, where the point of a promise is that it gives the promisee some kind of say over you, so breaking it is a kind of usurpation rather than just a letdown — I think this is Shiffrin or Owens, the "authority interest" guy, I keep mixing them up.

  The cases: (a) a promise made to someone who's since died, about something nobody else knows or cares about; (b) a promise you made as a kid that your family still holds you to and that you now think is silly; (c) a promise to a person with severe dementia who no longer remembers it and never will; (d) a promise made while completely drunk; (e) a promise to keep a secret that turns out to have been about hurting someone; (f) a promise to yourself, no second party at all; (g) a promise to an Alexa-style smart speaker that you'll water the plants, which somehow still feels binding; (h) a promise whose beneficiary never finds out you broke it.

  Also, tell me which of the accounts, if any, actually gets stronger rather than weaker once you throw the weird cases at it — my hunch is that one of them does and I can't tell which, and its definately not the one I'd have guessed at the start of term.
reasoning: |-
  Okay, let me tackle this user's request. They're in an ethics seminar focused on promises, frustrated with boring cases, and want to flip the script for their final essay. Their goal is to test four major promise theories against eight tricky cases, ranking each theory's performance and noting where they "bite the bullet." 

  Hmm, first I need to map the theories clearly: 
  (1) Scanlon's expectation view (broken promise = betrayed assurance), 
  (2) Rawls/Hume convention view (promises as social practice), 
  (3) Gilbert's joint commitment (promise creates a "we"), 
  (4) Shiffrin/Owens authority view (promisee gains normative power). 

  The cases are deliberately thorny—exploiting absences (death, dementia), dubious consent (drunk, childhood), or non-standard promisees (AI, self). Smart framing. The user's hidden ask seems to be: "Which theory survives this gauntlet best?" and specifically which one *thrives* on edge cases—they suspect it's counterintuitive. 

  For ranking, I'll simulate each theory's reasoning per case: 
  - **Expectation view** will struggle with dead/dementia cases (no disappointed expectations) but handle secret harm (e) well (moral override). 
  - **Convention view** might implode on private promises (a,f) since no social practice is engaged. 
  - **Joint commitment** could flex on Alexa (g) by stretching "plural subject," but crumble on death (a) where the "we" dissolves. 
  - **Authority view** shines on childhood promises (b) and dementia (c) (standing persists!) but chokes on self-promises (f) (no second-party authority). 

  Ah—there's the twist. The authority view *improves* with edge cases because its core (normative power transfer) stays intact even when other elements (expectations, memory) vanish. That's the counterintuitive strength the user sensed. Meanwhile, the convention view suffers most—too dependent on social context. 

  For bullets bitten: 
  - Scanlon must accept dead promisees (a) aren't binding. 
  - Rawls must admit childhood promises (b) lapse without social enforcement. 
  - Gilbert can't explain self-promises (f). 
  - Shiffrin/Owens awkwardly accept Alexa promises (g) if we anthropomorphize. 

  Final ranking: authority > joint commitment > expectation > convention. The essay hook writes itself: "Forget lunch no-shows—real promise theory is forged in the graveyard, the nursery, and the server room."
answer: |-
  Here's your ranked assessment of promise theories against your edge cases, with concise reasoning and bullet-biting notes. The authority view emerges surprisingly robust, while the convention view struggles most.

  **Ranking of Theories (Best to Worst Handling Edge Cases):**

  1.  **Authority/Standing View (Shiffrin/Owens):** *Best.* Obligation stems from transferring normative authority to the promisee.
      *   **Why:** Excels where the *promisee's standing* persists regardless of expectations, awareness, or benefit. Strong on (a) Dead Promisee (authority was transferred before death), (b) Silly Childhood Promise (authority transfer stands unless formally revoked), (c) Dementia Promisee (standing remains even if unexercisable), (g) Alexa Promise (if viewed as accepting authority transfer anthropomorphically). Handles (h) Unfound Breach well (wrong is usurping authority, not discovery).
      *   **Bites Bullet On:** (e) Secret Harm (must insist obligation stands despite harm, requiring override by stronger duty), (g) Alexa Promise (requires stretching "intentional agent" concept).

  2.  **Joint-Commitment View (Gilbert):** *Good.* Creates a "plural subject" with obligations binding the unit.
      *   **Why:** Strong on commitments where the *relationship/commitment itself* is key, even if expectations fade. Good on (a) Dead Promisee (the "joint commitment" existed), (c) Dementia Promisee (commitment structure remains), (e) Secret Harm (joint commitment exists, but moral override applies), (h) Unfound Breach (breach violates the joint commitment structure).
      *   **Bites Bullet On:** (b) Silly Childhood Promise (must argue the plural subject still binds adult unless "dissolved" mutually), (f) Promise to Self (paradoxical - can't create plural subject alone), (g) Alexa Promise (requires seeing AI as capable of genuine joint commitment).

  3.  **Expectation/Assurance View (Scanlon):** *Mixed.* Wrong is creating & then defeating reliance/expectation.
      *   **Why:** Intuitive core, handles (e) Secret Harm perfectly (expectation outweighed by harm prevention), (h) Unfound Breach well (wrong is creating *risk* of reliance/letdown).
      *   **Bites Bullet On:** (a) Dead Promisee (no possible expectation/reliance), (c) Dementia Promisee (no current expectation/ability to rely), (g) Alexa Promise (no genuine expectation/assurance felt by speaker). Also weak on (b) Silly Childhood Promise (if no current reliance).

  4.  **Practice/Convention View (Rawls/Hume):** *Worst.* Obligation arises from fairness within a beneficial social practice.
      *   **Why:** Highly dependent on the practice's existence, rules, and mutual benefit. Fails dramatically on private/non-social promises.
      *   **Bites Bullet On:** (a) Dead Promisee (no social practice engaged/enforced), (c) Dementia Promisee (promisee can't participate in practice), (f) Promise to Self (outside the social practice), (g) Alexa Promise (no social practice with non-agents). Also weak on (d) Drunk Promise (practice rules may void it) and (b) Silly Childhood Promise (if practice doesn't enforce childhood vows).

  **Which Theory Gets Stronger?** The **Authority/Standing View (Shiffrin/Owens)** gets *stronger* relative to the others when faced with these edge cases.

  *   **Why:** The core idea – that promising transfers a sliver of normative authority over your actions – proves remarkably *detachable* from contingent factors like the promisee's current mental state, awareness, lifespan, or even (arguably) humanity. In cases (a), (b), (c), and (h), where expectation, reliance, benefit, or mutual commitment fade, the *authority transfer itself* remains the salient, persistent source of obligation. This focus on the *act* of creating the normative relationship, rather than its *consequences* (expectation) or *context* (social practice), gives it unique resilience against these challenges. Its counterintuitive strength in handling the "absence" cases (death, dementia, unfound breach) highlights its distinct foundation.

  **Summary Table:**

  | Theory                     | Best Cases                              | Worst Cases (Must Bite Bullet)                     |
  | :------------------------- | :-------------------------------------- | :------------------------------------------------- |
  | **1. Authority/Standing**  | (a), (b), (c), (g), (h)                 | (e) (must override), (g) (anthropomorphizing)       |
  | **2. Joint-Commitment**    | (a), (c), (e), (h)                      | (b) (binding adult), (f) (self), (g) (AI agency)    |
  | **3. Expectation/Assurance** | (e), (h), (d?)                          | (a) (dead), (c) (dementia), (g) (Alexa)            |
  | **4. Practice/Convention** | (d?) (if rules void it)                 | **(a), (c), (f), (g), (b?)** (Private/Non-Social) |

  **Key Essay Insight:** Your edge cases reveal that the **Authority View** uniquely thrives on the *formality* of the promise act itself. While others stumble when promises become socially invisible (dead/dementia promisees), lack mutual benefit (Alexa), or seem trivial (childhood), the authority view insists the core wrong – usurping the normative power *you gave away* – persists. This makes it paradoxically *more* compelling in the weird cases than in mundane ones like forgotten lunch dates. The convention view, reliant on social context, crumbles under privacy. Scanlon's view suffers when reliance evaporates. Gilbert's view is robust but hits limits with non-agents and the self. The authority view emerges as the dark horse champion of the bizarre. Good luck with the essay!
