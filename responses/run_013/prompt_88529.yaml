answer: |-
  Your observations pinpoint a profound tension in legal hermeneutics, and Quine's critique of the analytic-synthetic distinction indeed challenges the philosophical foundations courts seem to rely upon. Courts implicitly presuppose a version of that distinction: dictionary definitions are treated as capturing *linguistic facts* (analytic truths, where meaning alone fixes reference), while trade usage or contractual definitions involve *empirical facts* about behavior or intent (synthetic truths). Yet Quine argued meaning cannot be quarantined from worldly evidence; all statements face the "tribunal of sense experience" as a corporate body. So, how does legal practice fare under this scrutiny?

  **Where the Practice Presupposes the Distinction (or Seems To):**  
  Courts most sharply invoke the analytic-synthetic divide when treating dictionary definitions as authoritative arbiters of "ordinary meaning," especially older dictionaries contemporaneous with a law's passage. This act presupposes that:  
  1. Words possess stable, context-independent cores discernible by lexicographers.  
  2. This core meaning is a matter of linguistic fact, not convention or empirical observation about *current* usage.  
  3. Discovering this meaning is distinct from *creating* legal obligations, preserving the interpretation/legislation boundary.  

  Similarly, insisting that dictionary consultation is "finding" law, not making it, leans on the idea that meaning is fixed prior to and independent of judicial intervention—an analytic truth judges uncover.

  **Where Practice Merely Fits Comfortably With the Distinction:**  
  Considering trade usage evidence aligns neatly with synthetic truths. Courts acknowledge meaning is contingent on social practice, requiring factual investigation. Contractual stipulations also fit comfortably: parties creating a *private* semantic rule (synthetic) doesn't threaten the *public*, dictionary-based meaning (analytic) governing statutes. Dictionaries themselves straddle this: compilers observe usage (synthetic input), but courts treat entries as fixed rules (analytic output). This duality allows courts to use dictionaries flexibly—as evidence of historical usage or as timeless authority.

  **Where Practice is Indifferent or Adaptable to Quinean Holism:**  
  A Quinean can reinterpret the *entire practice* as a complex convention for coordination, without needing metaphysical meaning-facts:  
  - **Dictionaries as Conventions:** Citing a dictionary isn't invoking a meaning-fact but deploying a socially accepted reference work to anchor communication predictably. Its authority stems from institutional trust and efficiency, not epistemology. When an entry changes, we accept the new convention, not that the old dictionary was "wrong" in a factual sense.  
  - **Trade Usage as Empirical Coordination:** Hearing evidence on trade usage is straightforwardly Quinean—judges examine how a community *actually uses* a term within its web of beliefs and practices. Meaning here is explicitly empirical and holistic.  
  - **Contractual Stipulations as Private Conventions:** Parties setting definitions is pure conventionalism—meaning is stipulated by fiat within a limited domain. No analytic truth is challenged; it's a synthetic agreement.  
  - **The Interpretation/Legislation Boundary as Institutional:** The line between "finding" and "making" law survives not as an ontological divide but as a *normative constraint* on judicial role. Courts adhere to texts and precedents to ensure predictability and respect for democratic processes, regardless of whether meaning is "discovered" or "constructed."  

  **What Would (and Wouldn't) Have to Give if Quine is Right:**  
  Adopting Quine’s view wouldn’t collapse legal practice, but it would reshape its self-understanding:  
  1. **Dictionaries vs. Surveys:** Judges might increasingly favor empirical evidence (e.g., corpus linguistics, usage surveys) over dictionaries, especially for contemporary statutes. Dictionaries wouldn’t vanish—they’re efficient proxies for common usage—but their authority would derive from being reliable *summaries of empirical patterns*, not timeless arbiters. For historical meaning, old dictionaries might still serve as evidence of past usage.  
  2. **The Interpretation/Rewriting Distinction:** This boundary *could* persist, but as a pragmatic, institutional norm rather than an epistemological necessity. Judges would still insist they are bound by the enacted text’s semantic content, but they’d acknowledge that determining that content involves holistic judgment about language-in-use, legislative purpose, and consequences. The line blurs philosophically but remains vital jurisprudentially to constrain judicial overreach.  
  3. **Shifting Justification:** Courts might frame decisions more openly as seeking the "best fit" with language, intent, and policy within a holistic web of law, rather than claiming pure deduction from dictionary definitions. Meaning would be seen as evolving through use, not frozen by original dictionaries.  

  Ultimately, Quine’s critique doesn’t destroy legal interpretation; it relocates it. Meaning becomes a dynamic, socially embedded practice rather than a static, language-internal fact. Courts already navigate this reality pragmatically—using dictionaries for stability, accepting usage evidence for context, respecting stipulations for autonomy—without needing a rigid analytic-synthetic firewall. The practice can survive as a sophisticated convention for coordinating collective judgment, where "what the law means" is settled by the very institutions tasked with applying it, anchored by texts and traditions but responsive to the lived world of language.
