prompt: |-
  For most of a semester I have been defending a view in a reading group on moral psychology and metaethics, and a colleague has finally persuaded me that I should find out what could be said against it. The view is this. Cross-cultural moral variation is real, and sometimes deep, but it is not what it appears to be. Beneath the variation lies a thin, shared core of moral concern — roughly, that suffering and flourishing matter, that persons are owed something simply as persons, and that members of one's group stand in relations of special obligation — and what actually varies from society to society is how that core is specified, weighted, and extended to marginal cases. Nor is the variation random: it tracks local conditions such as subsistence mode, kinship and residence patterns, exposure to threat and to pathogens, and relational mobility. That is why I prefer to describe the divergence as ecological calibration rather than as moral disagreement in the strict sense. If all of this is right, a modest moral objectivity survives the cross-cultural record: some claims are true for everyone, cross-cultural criticism remains possible at the level of the core, and most thick moral claims are true only relative to an ecology. The large cross-cultural survey built around self-driving-car dilemmas seems to me to support precisely this picture, since it found strong global agreement on a few dimensions alongside systematic regional variation on others.

  Now attack it. What would count against the view? I would like the defeaters sorted by how decisive they would be, and drawn from the empirical record wherever that is possible rather than from the generic argument from disagreement, which I already know how to answer. In particular: are there well-documented cases in which a society does not merely weight the core differently but seems to lack one of its elements altogether — where the moral status of out-group members, or of the dead, or of animals, or of children is so different that describing it as a different application of a shared core is strained, and where the difference cannot be explained by ecology or by a difference in factual belief? Which findings should make me suspect that the core is a projection of the investigator's own intuitions — those of the WEIRD sample, Western, educated, industrialized, rich, and democratic — rather than a human universal? And which findings would suggest that the calibration half of the story is doing all the explanatory work, so that objectivity has quietly dropped out and I am left with relativism in empirical dress?

  Then rank the defeaters from fatal to merely awkward, and separate the ones a defender of the view would have to concede from the ones a defender could dismiss as question-begging or as trading on the gap between description and evaluation. Finally, tell me honestly whether the position is well insulated: whether it makes a genuine empirical bet that could fail, or whether its two clauses can absorb any datum whatsoever. If it turns out to be insulated, say so plainly, and tell me whether that is a defect in a view of this kind. What would move me most is a single well-documented case of a society that has no use for one element of the core, where the absence is not an artifact of translation, sampling, or factual disagreement but a genuine alternative to the element itself.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've been defending a view in moral psychology and metaethics about cross-cultural moral variation. Their position is that despite differences, there's a shared core moral concern, and variations are ecological calibrations. Now they want to know what could count against this view, especially empirical evidence.

  First, I need to break down their core argument. They mention a thin universal core: suffering and flourishing matter, persons have inherent worth, special obligations to in-group. Variations are due to ecology. They cite the self-driving car study as support. Their main request is for defeaters—empirical counterexamples where a society lacks a core element entirely, not just different weighting or factual beliefs.

  The user wants these defeaters sorted by decisiveness. They're particularly interested in cases where a society doesn't just apply the core differently but misses one element altogether. Also, they want to know if the core is a WEIRD projection and if the calibration aspect leads to relativism.

  I recall some anthropology studies. The Ik are often mentioned. Colin Turnbull's work described them as lacking empathy even towards children. But I need to check if that's still valid. More recent critiques say Turnbull might have exaggerated. So maybe not the strongest example. The Dobu and Mundugumor are other candidates. Dobu's extreme paranoia and betrayal as a norm. Mundugumor's hostility even within families. But again, are these accurate? Later anthropologists might have contested those findings.

  Then there's the Pirahã. Everett's account suggests they lack abstract moral concepts beyond immediate experience. No concern for distant suffering or universal personhood. Their core is based on what's observable. This seems like a possible strong defeater if verified. But there are translation issues and debates about Everett's interpretations.

  Another angle is societies without special obligations to in-group. The Na and Mosuo in China have loose kinship ties. But they still have group obligations, just structured differently. Not a complete absence. The Ik again come up, but reliability is an issue.

  For the core being a WEIRD projection, studies on WEIRD samples dominating research. Henrich's work points out that most psychology studies use WEIRD participants, leading to biased universals. Also, moral foundations theory shows variations in emphasis. But even there, foundations like care and fairness are present, just prioritized differently. Is there a society that completely lacks one?

  Explanatory power of ecology: if ecology explains everything, maybe the core isn't necessary. For example, resource scarcity leading to infanticide. But the user argues that such practices are responses to suffering—preventing worse suffering. So the core might still be there, applied differently. But what about societies that practice punitive suffering without any perceived benefit? Like torture for minor offenses. If it's not about calibration, maybe the core of reducing suffering is absent.

  Ranking defeaters: Fatal would be a verified society missing a core element. But finding such a case is hard due to research biases. Strong but not fatal: societies where core elements are inverted, like the Dobu. Weaker: differences in extension, like animal treatment.

  Conceding vs. dismissing: A defender might dismiss older ethnographies as biased. They could argue that absence of evidence isn't evidence of absence—maybe the core is there but not observed. But if a well-documented case exists, they'd have to concede.

  Insulation: The view might be insulated because any counterexample can be explained as ecological calibration or factual belief difference. For instance, the Ik's behavior is due to famine. Pirahã's immediacy is an ecological adaptation. So the theory adapts. But is that a defect? The user probably wants a falsifiable theory. If it's too flexible, it's not scientific.

  Honestly, the lack of uncontested cases is a problem. The user needs a single well-documented case. The Pirahã might be the closest, but even that's debated. Maybe the best argument is that the core is descriptively true but normatively thin, so objectivity is weak. Or that calibration does all the work, leading to relativism.

  Also, the user’s deeper need might be to test their view rigorously, ensuring it's not just defensible but true. They might want to avoid intellectual complacency. So pointing out insulation issues is key, even without a knockout case.
answer: |-
  Your view is sophisticated and empirically engaged, but several lines of evidence could challenge it. Below, I organize defeaters by decisiveness (fatal to awkward), separate concessions from dismissible arguments, and assess insulation. I prioritize empirical counterexamples and avoid generic disagreement arguments.

  ---

  ### **I. Fatal Defeaters: Cases Challenging the Core's Universality**  
  *If verified, these would directly falsify the existence of a universal core.*  
  1. **The Ik (Uganda) - Absence of In-Group Special Obligations**  
     - **Documentation**: Colin Turnbull's ethnography *The Mountain People* describes the Ik during famine: parents abandoned children at age 3, the weak were starved, and cooperation was nonexistent. Moral concern was restricted to immediate survival of the self.  
     - **Challenge to Core**: No special obligations to in-group (even kin), no inherent concern for persons beyond utility, and flourishing reduced to individual caloric intake.  
     - **Not Explained by Ecology**: While famine was a trigger, Ik behavior persisted after conditions improved. Factual beliefs (e.g., "children drain resources") don't fully account for the *erasure* of parental care instincts observed universally elsewhere.  
     - **Decisiveness**: **Fatal** if Turnbull's account is accurate.  
     - **Status**: Contested (critics argue Turnbull overstated his case; the Ik may reflect extreme trauma, not innate morality).  

  2. **The Dobu (Melanesia) - Inversion of Core Elements**  
     - **Documentation**: Ruth Benedict's *Patterns of Culture* describes Dobu society as rooted in mutual antagonism. Trust was immoral; betrayal (even of spouses) was virtuous. Flourishing depended on harming others through sorcery.  
     - **Challenge to Core**: Suffering of out-group members was *positively valued*; persons had no inherent worth beyond exploitation.  
     - **Not Explained by Ecology**: While resource scarcity existed, similar ecologies (e.g., the nearby Trobrianders) developed cooperative norms. Factual beliefs (e.g., "sorcery ensures survival") don't justify moral approval of suffering.  
     - **Decisiveness**: **Strong but not fatal** (Benedict's analysis is dated; Dobu may reflect extreme competition, not absent core).  

  ---

  ### **II. Strong Defeaters: Core as WEIRD Projection or Ecology-Only Explanation**  
  *These challenge the core's universality or the objectivity of "calibration."*  
  3. **Moral Foundations Theory (MFT) Asymmetries**  
     - **Evidence**: Haidt's MFT shows WEIRD societies prioritize harm/fairness ("thin core") but neglect loyalty/authority/purity. Non-WEIRD groups (e.g., India) weight all five equally.  
     - **Challenge**: If "core" is defined by harm/fairness, it appears WEIRD-centric. Societies like the Hadza (Tanzania) treat purity violations (e.g., incest) as more morally urgent than impersonal harm.  
     - **Decisiveness**: **Strong** – Suggests the "core" is a WEIRD sampling artifact.  
     - **Defender's Response**: Dismissible. You could argue purity *is* an extension of suffering/flourishing (e.g., "impurity risks group collapse").  

  4. **Pirahã (Amazon) - Absence of Abstract Moral Concepts**  
     - **Documentation**: Daniel Everett's work shows Pirahã lack abstract beliefs (no gods, myths, or moral rules beyond immediate experience). They abandon the elderly/infirm without remorse, viewing it as pragmatic, not immoral.  
     - **Challenge to Core**: No concern for non-visible suffering (e.g., future flourishing) or inherent personhood; obligations are transient and situational.  
     - **Not Explained by Ecology/Translation**: While isolation matters, their resistance to moral abstraction persists despite contact. Factual disagreement ("the weak die anyway") doesn't explain *indifference* to suffering.  
     - **Decisiveness**: **Strong** – If verified, it shows a society without thin-core concepts.  

  5. **Relational Mobility Undermines Objectivity**  
     - **Evidence**: Cultures with low relational mobility (e.g., Japan) emphasize duty to in-group, while high-mobility cultures (e.g., USA) emphasize individual rights. Crucially, *both* view their norms as objectively correct.  
     - **Challenge**: If ecology fully explains variation *and* each society sees its norms as non-relative, "calibration" collapses into relativism. No room for cross-cultural criticism at the core (e.g., "sati in India was calibrated to patriarchy").  
     - **Decisiveness**: **Strong** – Suggests objectivity is illusory; only ecology matters.  

  ---

  ### **III. Awkward Defeaters: Straining the Core's Application**  
  *These pressure but don't break the view.*  
  6. **Ancient Sparta - Systematic Exposure of Infants**  
     - **Evidence**: Spartans abandoned "unfit" infants as a communal duty. Weak/unhealthy children had no moral standing.  
     - **Challenge**: Hard to square with "persons owed something as persons."  
     - **Defender's Response**: Concede as ecological calibration (militarized society needing strength).  

  7. **Mundugumor (Papua New Guinea) - Hostility as Default**  
     - **Documentation**: Margaret Mead described them as "violent and aggressive," with parent-child relationships rooted in resentment.  
     - **Challenge**: Apparent inversion of special obligations to kin.  
     - **Defender's Response**: Dismissible due to Mead's methodological controversies.  

  ---

  ### **IV. Concessions vs. Dismissals**  
  | **Defeater**                  | **A Defender Must Concede...**       | **Can Dismiss As...**                  |
  |-------------------------------|--------------------------------------|----------------------------------------|
  | **Ik/Dobu**                   | If verified, core isn't universal.   | Flawed ethnography or trauma response. |
  | **MFT Asymmetries**           | Core prioritization is WEIRD-biased. | WEIRD-centric framing of "core."       |
  | **Pirahã**                    | Abstract moral concepts aren't universal. | Translation error or extremized ecology. |
  | **Relational Mobility**       | Calibration risks relativism.        | Ignores core-level criticizability.    |

  ---

  ### **V. Insulation Assessment**  
  **Is the view insulated? Yes, but problematically.**  
  - **Absorption Capacity**: The view can absorb almost any datum:  
    - A society "lacking" an element? → "They weight it near-zero due to ecology."  
    - WEIRD bias? → "The core is minimalist; WEIRD over-specifies it."  
    - Relativism? → "Calibration *is* objective adaptation."  
  - **Empirical Bet**: The core makes a weak bet: "All societies have *some* concern for suffering, persons, and in-group." This is nearly unfalsifiable, as counterexamples can be explained away (e.g., "The Ik's neglect *is* concern for group survival").  
  - **Defect? Yes**: Insulation renders the view non-predictive and non-falsifiable – a flaw for an empirical claim. It risks being a *descriptive tautology* ("whatever exists is calibrated").  

  **Honest Verdict**: No uncontested case proves a society **utterly lacks** a core element. The strongest empirical pressure comes from:  
  1. **Pirahã immediacy** (if Everett is correct).  
  2. **Dobu/Mundugumor inversions** (if modern ethnography confirms them).  
  3. **Relational mobility** dissolving objectivity.  

  **What Should Move You**: Not a single "knockout" case, but the **cumulative weight** of societies where the core is:  
  - Inverted (Dobu),  
  - Abstractly missing (Pirahã), or  
  - So ecologically determined that objectivity vanishes.  

  This suggests your "thin core" may be a human *tendency* (biologically rooted) rather than a universal *moral framework*, and "calibration" may indeed be relativism in disguise. To salvage objectivity, you'd need evidence that societies *recognize* ecologically alien norms as morally intelligible (e.g., a forager critiquing industrial capitalism at the core level). The self-driving car study doesn't test this.
