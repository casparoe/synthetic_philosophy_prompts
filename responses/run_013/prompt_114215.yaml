prompt: |-
  I recently became the coordinator of a small online community that runs recurring cooperative lotteries and prediction games, and a dispute over a public lottery—where entering looks individually costless but universal entry would dilute the prize to nothing—has made the Platonia dilemma and the Luring Lottery newly practical for me. With one semester and two undergraduates, I want to run a few small online experiments on superrationality rather than write another literature review. Which open questions in that area most deserve our effort, and in what order? Candidates I am considering include whether superrationality is a distinct decision rule or reducible to team reasoning, how it survives noise, asynchrony, and repeated play, whether communication or group identity is necessary, and how to separate superrational reasoning from altruism or risk aversion. Please prioritize by what is upstream of other questions, what is tractable with modest resources, and what is neglected; say what evidence from our first experiments would move a question up or down the list. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user is coordinating an online community with lotteries and prediction games, and they've run into a Platonia dilemma situation. They have two undergrads and one semester to run experiments on superrationality. They want to prioritize open questions that are upstream, tractable, and neglected. 

  Hmm, the key is to avoid literature reviews and focus on actionable experiments. The user listed several candidate questions: whether superrationality is distinct from team reasoning, how it handles noise/asynchrony/repetition, if communication/identity is necessary, and separating it from altruism/risk aversion. 

  First, I need to identify what's most upstream. The core mechanism question (how superrationality functions under imperfect conditions) seems foundational. If superrationality collapses with even minor noise or asynchrony, that would undermine other questions about its distinctness or applications. 

  Tractability is crucial—they have limited time and resources. Testing noise/asynchrony can be done with simple binary choice games using existing platforms. Minimal coding needed, just tweaking parameters. The distinctness question would require more complex experimental designs to disentangle motivations. 

  Neglected areas... Most superrationality research focuses on ideal synchronous cases. Real-world applications always involve noise and delays, so this gap matters. The other questions have more existing literature to build on. 

  For prioritization: Start with noise/asynchrony. Negative results here would make other questions less urgent. Then tackle distinctness from team reasoning—if it survives the first tests, this becomes critical. Communication/identity and altruism separation can come later as they require more setups. 

  Evidence that moves questions: If noise tolerance is high, push distinctness up. If low, maybe abandon for repetition studies. If team reasoning controls fail, distinctness gets priority. 

  Risk aversion is tricky—probably leave it last since it needs monetary incentives and careful calibration. Altruism separation might be cleaner through payoff manipulations. 

  The user seems analytically sharp—they're thinking about experimental design trade-offs. Their frustration with theoretical debates is palpable. They'll want clear "kill criteria" for each stage to pivot quickly. 

  Also noting their community context: Results on asynchrony could directly inform their lottery designs. Practical impact matters here. 

  Final priority order: 1. Noise/asynchrony 2. Distinctness vs team reasoning 3. Communication necessity 4. Altruism separation 5. Repetition effects 6. Risk aversion confounds. With off-ramps at each step based on results.
answer: |-
  **Prioritize testing how superrationality survives noise and asynchrony first, as this is upstream, tractable, and neglected.**

  1.  **Noise & Asynchrony:** This is *upstream* because if superrationality collapses under minor imperfections (e.g., players acting at slightly different times or making small mistakes), its real-world relevance is severely limited. It's highly *tractable*: modify basic coordination games (e.g., symmetric Prisoner's Dilemma or High/Low) on simple platforms (Prolific, community volunteers) by introducing known entry/action delays or probabilistic errors. It's *neglected* compared to idealized simultaneous-play models. **Evidence:** High cooperation rates despite noise/asynchrony move distinctness/team-reasoning up; low rates move it down or shift focus to repetition.

  2.  **Distinctness from Team Reasoning:** This is critical (*upstream*) for theoretical clarity: if superrationality is just team reasoning in disguise, it loses novelty. Test by comparing treatments: one priming "us as a team," another priming "logical mutual prediction" (superrationality), and a neutral control. Measure choices and collect free-response reasoning. *Tractable* with surveys/scenarios alongside simple games. *Neglected* in direct empirical comparison. **Evidence:** Divergent behavior/reasoning between team-priming and mutual-prediction-priming moves this up; convergence suggests reducibility.

  3.  **Communication & Group Identity Necessity:** *Upstream* for applicability (many real-world dilemmas lack communication). Test minimal interventions: anonymous vs. pseudonymous vs. group-identified players; allow cheap-talk signals vs. no communication. *Tractable* with platform settings/instructions. Moderately neglected in superrationality specifically. **Evidence:** Cooperation without communication/identity boosts superrationality's plausibility; its collapse without them moves it down.

  4.  **Separating from Altruism/Risk Aversion:** *Important* but less immediate. Use payoff manipulations: vary the cost of cooperation (to distinguish from altruism) and the riskiness of mutual defection vs. failed cooperation (to distinguish from risk aversion). Include post-game surveys on motives. *Less tractable*: requires careful payoff calibration to isolate motives and potentially larger samples. **Evidence:** Strong correlation of superrational choices with altruism/risk-aversion measures moves distinctness down; independence moves it up.

  5.  **Repeated Play:** Important but *downstream*. Requires longer/more complex sessions. Address after core mechanisms (noise, distinctness) are understood. Initial focus: does repetition *teach* superrationality or lead to conventional equilibria? *Tractable* but resource-heavy for small teams. **Evidence:** Success in one-shot games reduces urgency; failure makes repetition more critical.

  **Order & Resource Allocation:**
  1.  **Weeks 1-4: Noise & Asynchrony (Core Survival):** Run 2x2 designs (Synchronous vs. Asynchronous; No Noise vs. Low Noise). Simple binary choices. Use community volunteers/Prolific. Minimal coding.
  2.  **Weeks 5-8: Distinctness vs. Team Reasoning:** Run 3 treatments (Neutral Control, Team Priming, Mutual Prediction Priming) using a symmetric dilemma. Include free-response reasoning analysis.
  3.  **Weeks 9-12+: Communication/Identity & Altruism/Risk (Parallel/Follow-up):** Based on results, deploy communication/identity manipulations and/or payoff variations for motive separation. Repetition studies are a lower-priority extension if time/resources allow.

  **Key Adjustments from Early Evidence:**
  *   **Strong Noise/Asynchrony Tolerance:** Immediately prioritize **Distinctness** and explore **Communication/Identity**.
  *   **Weak Noise/Asynchrony Tolerance:** Pivot to **Repeated Play** to see if learning occurs, or investigate if **Altruism/Risk** explains residual cooperation.
  *   **Clear Distinction from Team Reasoning:** Bolsters superrationality's case; prioritize **Communication/Identity** and **Motive Separation**.
  *   **No Distinction from Team Reasoning:** Suggests superrationality may not be a unique mechanism; focus shifts to **Noise in Team Reasoning** or **Repetition**.
