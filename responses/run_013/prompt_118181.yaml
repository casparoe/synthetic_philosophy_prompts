prompt: |-
  Some context: I'm a director of engineering at a company that's about eight months old and is really two companies stitched together — two software shops of roughly a hundred and ten people each, merged last spring, and the two engineering orgs still operate like rival nations. In a couple of weeks I have to give the opening remarks at our first joint offsite: ninety-odd people in a rented conference room above a bowling alley, bad coffee, the merged roadmap up on the projector, both founding CEOs in the front row. Half the room are engineers who've at least heard of the prisoner's dilemma; the other half are sales, support and design folks who haven't and will tune out instantly if I start lecturing. My boss's contribution to the planning has been to say, twice now, that we just need to tell everyone to cooperate. I think that's the exact wrong move and I want the speech to show why — but I also don't want to be the guy who opens an offsite by telling everyone they're trapped. So I'd like you to write it. Treat this as a game theory problem first and a speech second: you're a game theorist who writes speeches on the side, and I'd rather you spend the first part of your answer thinking through the incentives of the actual situation before you write a word of the actual speech.

  Here's what the speech has to do, and this is where I need you to be honest rather than rousing. It has to explain, in plain language and without a payoff matrix on the whiteboard, why telling people to cooperate changes nothing when the structure still rewards hoarding information and shipping your own roadmap on time — and why that isn't a character flaw in the room. It has to face up to the thing everyone is politely not mentioning: the merged roadmap means teams get absorbed or cut in about eighteen months, everybody knows it, and a game with a visible last round is a worse game than one that runs indefinitely. I want that logic delivered honestly, not hedged into nothing, but also not as a doom spiral — because our real horizon is longer than this company. Everyone in that room is going to work with everyone else in this industry again, in some form, for the next twenty years, and I think that's the actual reason to behave well here. Second thing: our staff engineer keeps telling me that strict tit-for-tat falls apart the moment there's noise in the system — one misread handoff, one missed deadline, and you get an endless retaliation spiral where each side keeps punishing the other for its last mistake — and that the forgiving version, where you sometimes let a defection go and just start cooperating again, does better. I think she's right and I want that in the speech. If I've got the details backwards, don't build the speech on a wrong claim; use the correct version and tell me at the end. Third, I want the honest cost: watching each other and punishing free-riders is itself work, and somebody has to do it and pay for it. Say where that cost lands and why it doesn't make monitoring pointless.

  Format and constraints: five or six minutes out loud, so maybe eight hundred to nine hundred words; conversational; no jargon unless you unpack it immediately; no citations, no names of studies or researchers, because nobody will remember them and its going to read as showing off — I want the ideas, not the literature. One thing I specifically don't want: the story about the famous computer tournament where the simplest strategy won. Half the room has heard it and it will eat the whole speech. Also, no moralizing, at me or at them — I've definately done some of this myself and the speech shouldn't imply I'm standing above the room. Feel free to use one concrete incident: either the one where a team on the other side quietly fixed something that was blocking our release and nobody ever found out it was them, or the one where somebody reverted a shared library change to hit their own deadline — pick whichever serves the argument better, not both. End it warm; we still have eighteen months together and I'd like people to leave that room liking each other more, not less. After the speech, give me five bullets at most on where the analogy is thinner than it sounds and what I should expect someone to push back on in the Q&A.
