prompt: |-
  Independence has stopped being a hypothetical where I live. What was for years a fringe cause now commands enough support that a referendum within the next decade is a realistic possibility, and since someone close to me has become active in the campaign and I have been asked to take a public position, I have spent the past few months trying to work out what I actually believe rather than what side I am expected to be on. What I want from you is the principle, or the smallest set of principles, that captures my verdicts on the cases below; where nothing captures all of them, I want to know which verdicts have to be given up, and why.

  My verdicts run as follows. Scotland's referendum in 2014 was a legitimate exercise, and Westminster was right to agree to it; had the vote gone the other way, independence would have been legitimate as well, even though the rest of the United Kingdom was never asked. Quebec's referendum in 1995 was likewise a legitimate process, notwithstanding that the question was ambiguous and the result turned on a fraction of a percent; if anything, that near-tie tells me the threshold should have been higher, not that the exercise was illegitimate. Catalonia's referendum in 2017, and the declaration that followed it, were wrong. I do not think Madrid's response — suspending self-government, prosecuting the organizers — was proportionate, and I think it made matters worse, but neither of those facts makes the secession itself legitimate. Kosovo's declaration in 2008 was legitimate, even though Serbia never consented and no negotiated settlement was reached. Crimea's vote and annexation in 2014 were illegitimate; the coercion and the foreign involvement settle the matter, and I do not think the preferences of the people there, whatever they were, could have made it valid. South Sudan's independence in 2011 was legitimate, but that seems to me to rest on the decades of war and the negotiated agreement rather than on the ballot alone. A region that is well treated, shares a language and political culture with the rest of the state, and wants out purely to stop paying taxes or equalization to poorer regions should not be permitted to leave, even if a clear and durable majority wants it. And if Scotland had voted yes, the island groups that voted heavily against independence should have been allowed to stay in the United Kingdom if they wished.

  The principle I have been working with, which I suspect is too crude, is this: a group may secede if it forms a durable majority within a defined territory, if the parent state has had a genuine opportunity to address its grievances, and if the new state can be expected to protect its own minorities. That principle appears to license the wealthy region leaving to escape its obligations, which I deny, and it appears to license Catalonia, which I also deny; yet tightening it to require serious injustice, as in Kosovo or South Sudan, would make Scotland and Quebec look like lucky exceptions rather than exercises of a right. It also does not tell me what to say about the islands, where I seem to be applying the majority principle one level below the level at which I just refused to apply it.

  Please repair this. State the principle or principles precisely, tie each clause to the verdict that motivates it, and tell me how they come out on cases I have not listed: a region that suffers no injustice but whose central government lawfully refuses, indefinitely, ever to permit a referendum; a secessionist region that would itself mistreat a minority within it; and a region whose majority wants independence but whose opponents would become a permanent minority in the new state with no route back. Then tell me plainly which of my verdicts the best version of the principle cannot accommodate, and whether it is the verdict or the principle that ought to give way.
reasoning: |-
  Hmm, the user is grappling with the ethics of secession movements as they face a real-world independence movement in their community. They've listed specific cases (Scotland, Quebec, Catalonia, Kosovo, Crimea, South Sudan) with moral judgments about each, and they're struggling to find consistent principles that explain all their positions without contradiction. They've attempted a preliminary principle but found it flawed - it permits scenarios they reject (like wealthy regions leaving to avoid taxes) and conflicts with their views on Catalonia.

  Looking at their verdicts, I notice several patterns: 
  - They value democratic expression (supporting Scottish/Quebec referendums) 
  - But reject "convenience secession" (tax-avoiding regions) 
  - Accept remedial secession only in extreme cases (Kosovo/South Sudan) 
  - Prioritize minority protections (Scottish islands) 
  - Care about legal process (rejecting Catalonia's unilateral move while criticizing Madrid's overreach) 
  - Disqualify outcomes achieved by force (Crimea)

  Their contradictions are interesting: They apply majority rule at different territorial levels (accepting Scotland's overall majority but wanting island exceptions), and struggle to reconcile Catalonia's democratic expression with its illegality.

  I think I need to build a multi-principle framework that layers:
  1) Democratic legitimacy (process matters) 
  2) Remedial justification (not for trivial reasons) 
  3) Nested self-determination (island exceptions) 
  4) Anti-coercion principle (invalidates Crimea) 
  5) Viability requirement (new state must protect minorities)

  This framework explains most of their judgments: 
  - Scotland/Quebec pass all layers 
  - Kosovo/South Sudan pass remedial test despite process flaws 
  - Catalonia fails remedial justification and nested self-determination 
  - Crimea fails anti-coercion 
  - Tax-avoidance regions fail remedial test

  The Scottish islands case is explained by nested self-determination - minorities deserve the same consideration the larger group seeks. For new test cases: 
  - A region denied any referendum indefinitely: This fails democratic legitimacy layer 
  - A secessionist region that would mistreat minorities: Fails viability requirement 
  - A region creating new oppressed minorities: Could be blocked under nested self-determination or viability

  The only verdict needing adjustment is their view on Quebec's threshold - under this framework, the narrow margin doesn't invalidate legitimacy since remedial justification wasn't required. The principle is stronger than their instinct about thresholds.

  This maintains their core intuitions while resolving contradictions through layered conditions. The key insight is that while democracy is necessary, it's not sufficient - the "why" of secession matters as much as the "how."
answer: |-
  Based on your verdicts, I've constructed a multi-layered principle that captures your core intuitions while resolving the contradictions. Your existing principle fails because it treats secession as a single-barreled right, whereas your judgments reveal it's conditional on **both process legitimacy and substantive justification**.

  ### The Principle of Conditional Secession
  **A territorial group may legitimately secede if and only if:**
  1.  **Process Legitimacy:** It achieves a clear, free, and fair democratic mandate within a coherent territorial unit (e.g., via referendum with unambiguous question, adequate threshold, and minimal coercion), *AND*
  2.  **Substantive Justification:** At least one of the following applies:
      *   **a. Remedial Cause:** The group suffers persistent, grave injustice (e.g., systemic oppression, violent persecution, denial of fundamental self-governance) that the parent state is unwilling or unable to rectify.
      *   **b. Negotiated Settlement:** Secession occurs via a mutually agreed process between the group and the parent state, even absent grave injustice.
      *   **c. Nested Self-Determination:** The seceding unit itself respects the same self-determination rights of coherent sub-regions within it that vote clearly against secession.

  **Where these conditions are not met, unilateral secession is illegitimate, even if popular.**

  ---

  ### How This Explains Your Verdicts

  1.  **Scotland (2014):** Legitimate.
      *   **Process:** Clear mandate sought/fairly granted (1).
      *   **Justification:** Negotiated Settlement with UK (2b). *Not reliant on injustice (2a), so avoids the "lucky exception" problem.*
      *   **Islands:** Nested Self-Determination (2c) justifies their right to remain.

  2.  **Quebec (1995):** Legitimate.
      *   **Process:** Fairly conducted (1), *though the narrow margin highlights the "clear mandate" aspect of (1) without invalidating it.*
      *   **Justification:** Negotiated Settlement (Canada's Clarity Act framework implicitly accepts the principle) (2b).

  3.  **Catalonia (2017):** Illegitimate.
      *   **Process:** Violated Spanish Constitution, lacked state consent, question arguably ambiguous, coercive environment created by illegality (fails 1).
      *   **Justification:** Lacked Remedial Cause (no grave injustice like Kosovo) (fails 2a), lacked Negotiated Settlement (fails 2b), and ignored potential Nested Self-Determination (e.g., Tarragona) (fails 2c).
      *   *Madrid's disproportionality is condemned separately but doesn't legitimize the secession attempt.*

  4.  **Kosovo (2008):** Legitimate.
      *   **Process:** Context of extreme coercion/violence complicates "free/fair," but mandate was clear post-conflict (arguably meets a minimal threshold for 1 given context).
      *   **Justification:** Overwhelming Remedial Cause (genocide, persecution, loss of autonomy) (2a). *Negotiated settlement failed, but remedial cause supersedes.*

  5.  **Crimea (2014):** Illegitimate.
      *   **Process:** Coercion and foreign involvement make it fundamentally unfree/unfair (fails 1 utterly).
      *   **Justification:** No Remedial Cause against Ukraine pre-2014 justifying secession (fails 2a), no Negotiated Settlement (fails 2b). Illegality of process is decisive.

  6.  **South Sudan (2011):** Legitimate.
      *   **Process:** Conducted under CPA, internationally supervised (1).
      *   **Justification:** Strong Remedial Cause (decades of war, oppression) (2a) *and* Negotiated Settlement (CPA) (2b).

  7.  **Wealthy Region (Tax Avoidance):** Illegitimate.
      *   **Process:** Could theoretically be fair (1).
      *   **Justification:** Lacks Remedial Cause (no injustice) (fails 2a), lacks Negotiated Settlement (fails 2b). *Selfish motive is insufficient justification.*

  ---

  ### Resolving the Contradictions & Your Suspicions

  *   **Escaping Obligations:** Blocked by requiring Remedial Cause or Negotiated Settlement (2a/2b). Self-interest isn't enough.
  *   **Catalonia:** Blocked primarily by Process failure (1), reinforced by lack of Substantive Justification (2a/2b/2c).
  *   **Scotland/Quebec as "Lucky Exceptions"?** No. They are legitimate via **Negotiated Settlement (2b)**, a distinct pathway from Remedial Cause (2a). This is consistent, not exceptional.
  *   **Scottish Islands:** Explained by **Nested Self-Determination (2c)**. The majority principle applies consistently at each coherent sub-level *if* the larger unit seeks to secede. If Scotland stays, the islands stay; if Scotland leaves, the islands can choose to stay *with the parent state*.

  ---

  ### Application to New Cases

  1.  **Region denied a referendum indefinitely (no injustice):**
      *   **Principle:** Secession remains illegitimate. Lack of process (fails 1) and lack of justification (fails 2a/2b) block it. While undemocratic, the principle doesn't create a unilateral right to secede solely due to blocked process *without* substantive justification.
      *   *Potential Tension:* This might feel unsatisfying. It highlights that your principle prioritizes stability/order absent injustice or agreement. You might need to accept this or weaken the justification requirement (which risks validating tax-avoidance secessions).

  2.  **Secessionist region that would mistreat a minority:**
      *   **Principle:** Secession is illegitimate. It fails Nested Self-Determination (2c) implicitly (the minority deserves protection) and likely fails the viability aspect inherent in the principle (a state expected to persecute lacks legitimacy). Remedial Cause (2a) is also morally undermined if the new state creates similar injustice.

  3.  **Region creating a new permanent minority with no route back:**
      *   **Principle:** Problematic. Process (1) and Justification (2a/2b) might be met. However, **Nested Self-Determination (2c)** applies: If the opponents form a coherent territorial group within the seceding region, they should have the same choice (remain with parent state) the Scottish islands would have. If they are dispersed, it's harder; the principle might still permit secession, but this highlights a tension with minority protection absent territorial concentration. *This is a genuine difficulty.*

  ---

  ### Verdicts that Require Adjustment (and Why the Principle Holds)

  *   **Quebec's Threshold:** Your verdict implies the near-tie *almost* delegitimized it ("threshold should have been higher"). **The principle does not require this.** Process Legitimacy (1) requires a "clear mandate," but a 50%+1 victory in a free/fair referendum with an unambiguous question constitutes one. Requiring supermajorities *without* a prior agreement (like the Clarity Act) is problematic and not implied by your other verdicts. **Your instinct here conflicts with your core acceptance of the Quebec process as legitimate.** The principle treats Quebec 1995 as legitimate on process *despite* the narrow margin, via Negotiated Settlement (2b). *Your verdict on the threshold should give way; it's an inconsistency within your own judgments.* The near-tie highlights the *wisdom* of higher thresholds negotiated *beforehand* (like Scotland's Edinburgh Agreement), not the *illegitimacy* of that specific vote.

  **Conclusion:** The **Principle of Conditional Secession** (Process Legitimacy + Substantive Justification via Remedial Cause/Negotiated Settlement/Nested Self-Determination) captures the vast majority of your verdicts precisely. It resolves the contradictions in your initial principle by separating process from justification and offering multiple pathways. The only necessary adjustment is accepting that Quebec's 50%+1 result, while risky and arguably unwise without prior agreement on thresholds, met the threshold for a "clear mandate" under Process Legitimacy (1) in the context of a Negotiated Settlement (2b) (even if implicit/ex post facto). This framework provides a robust, consistent foundation for navigating the difficult ethics of secession.
