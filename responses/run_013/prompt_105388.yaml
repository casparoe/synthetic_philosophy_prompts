answer: |-
  ## Cascadia Effective Giving Project: 2025 Grantmaking Methodology

  The fundamental challenge of impact quantification lies in the unbounded nature of causal chains. Every funded intervention initiates a sequence of consequences extending indefinitely into the future, generating effects whose ultimate sign, magnitude, and moral valence are inherently indeterminate. Consequently, assigning a single, definitive expected value (EV) to any charitable activity is impossible. This "problem of cluelessness" necessitates methodological adaptations to render comparative analysis feasible.

  **Section 1: Moral Impact Unit (MIU) Framework**
  The Project utilizes a standardized "Moral Impact Unit" (1 MIU = +1 unit of expected moral value, normalized to a human life-year in high-quality wellbeing, discounted at 3% annually). Interventions are evaluated based on cost-per-MIU (CPMI).

  **Section 2: Temporal Horizon & Cluelessness Adjustment**
  Recognizing infinite chains, we model effects out to the tenth causal order (the direct effect is first-order, its consequences are second-order, etc.). Appendix A details our Markov-chain Monte Carlo model for estimating higher-order effect propagation. A Cluelessness Adjustment Factor (CAF) is applied to all CPMI estimates, scaling uncertainty with causal order. The CAF formula is: `CAF_n = 1 / (1 + 0.5*(n-1)^2)` where `n` is the causal order. Tenth-order effects are assigned a baseline CAF of 0.04.

  **Section 3: Handling Astronomical Stakes**
  Micro-probability macro-impact events (e.g., interventions influencing existential risk trajectories) are integrated using value-of-information frameworks. Probability estimates below 10^-12 are truncated to zero to maintain computational tractability, acknowledging this introduces arbitrary thresholds (See Sensitivity Analysis, Section 7).

  **Section 4: Uncertainty Quantification & Sensitivity Analysis**
  All CPMI estimates include 90% Credible Intervals derived from probabilistic Monte Carlo simulations. Sensitivity Analysis (Section 7) tests robustness against 27 alternative prior distributions, including:
  *   Prior Set Gamma: Strong belief in rapid value dissipation (CAF_n = 1/(1+2^(n-1)))
  *   Prior Set Omega: Strong belief in persistent, net-positive compounding (CAF_n = 1/(1+0.1*(n-1)))
  *   Prior Set Sigma: Assumes net-negative higher-order effects dominate beyond fifth order.

  **Section 5: Intervention Categories & Modeling Approaches**
  *   **Global Health:** Standard DALY/QALY models extended via population dynamics, economic growth linkages, and institutional path-dependence simulations.
  *   **Animal Welfare:** Species-specific moral weights applied, with welfare changes propagated through ecological interactions and long-term sentience trends.
  *   **Far Future:** Focus on robustly reducing existential risk probabilities (e.g., AI safety, biosecurity). Impacts modeled via stochastic future trajectory simulations over 1000+ years.
  *   **Institutional Reform:** Causal chains involve policy adoption, norm shifts, and institutional evolution; modeled using agent-based societal simulations.

  **Section 6: 2025 Top Charity Rankings by Cost-Per-MIU (CPMI)**

  | Rank | Charity Name                     | Intervention Focus              | Median CPMI (USD) | 90% Credible Interval (USD) | Dominant Impact Order(s) |
  | :--- | :------------------------------- | :------------------------------ | :---------------- | :-------------------------- | :----------------------- |
  | 1    | Stellar Safeguard Initiative     | Asteroid detection/deflection   | $0.02             | $0.001 - $0.85              | 7th, 8th (x-risk reduc.) |
  | 2    | Coalition for Ethical AI Labs    | AI safety technical research    | $0.15             | $0.03 - $2.10               | 6th, 9th (x-risk reduc.) |
  | 3    | Precision Policy Advocates       | Targeted legislative reforms    | $0.87             | $0.12 - $15.30              | 4th, 5th (inst. change)  |
  | 4    | Fungal Biosecurity Collective    | Pandemic pathogen monitoring    | $1.25             | $0.20 - $8.90               | 5th, 10th (x-risk reduc.)|
  | ...  | ...                              | ...                             | ...               | ...                         | ...                      |
  | 15   | Helios Bed Net Distribution      | Malaria prevention (Africa)     | $3,450            | $800 - $12,000              | **10th Order**           |
  | ...  | ...                              | ...                             | ...               | ...                         | ...                      |
  | 32   | Urban Arts Enrichment Program    | Local youth arts education      | $120,000          | $65,000 - $1.2M             | 1st, 2nd                 |

  **Section 7: Sensitivity Analysis & Robustness**
  Rankings demonstrate high stability (>85% overlap in top 5) across Prior Sets Gamma, Omega, Sigma, and our 24 other defined priors. The primary exception is Helios Bed Nets (Rank 15), which moves significantly under Prior Set Sigma (net-negative higher-order assumption), falling to Rank 28. Stellar Safeguard remains top-ranked under all priors due to high x-risk reduction potential.

  **Worked Example: Helios Bed Net Distribution (Rank 15, CPMI $3,450)**
  *   **Headline (1st-3rd Order):** Prevents ~1,000 child deaths annually (high certainty). Direct CPMI: ~$50. Economic uplift for families: Adds ~$150 MIU. **Total Low-Order EV: ~$200 CPMI.**
  *   **Higher-Order Modeling (via Appendix A):** Population stabilization alters local demographics (4th), influencing regional migration (5th), impacting economic development paths (6th-7th), affecting national stability (8th), altering geopolitical alliances (9th), and influencing international conflict/collaboration dynamics (10th).
  *   **Dominant 10th-Order Effect:** Our simulations assign a 0.00003% probability that a descendant of a bed net recipient, enabled by regional stability and education trends, rises to a position where their actions critically avert a major international conflict in 2153. The expected value of this micro-probability macro-positive event, discounted to present value and adjusted by CAF=0.04, contributes +$3,250 MIU per bed net distributed. This dominates the CPMI calculation.
  *   **Net CPMI:** $200 (Low-Order) - $3,250 (10th-Order Contribution) = **$3,450**. (Note: Under Prior Set Sigma, the model simulates a net-negative 10th-order geopolitical outcome, increasing CPMI).

  **Appendix A: Higher-Order Effect Estimation (Summary)**
  Effects are modeled probabilistically using societal simulation agents, propagating health, economic, and institutional state changes across ten temporal steps. Correlation structures and value drift are incorporated. Estimates become increasingly speculative beyond the fifth order. The tenth order is not the final causal step; effects are merely truncated here for modeling feasibility. The CAF accounts for uncertainty beyond the modeled horizon.

