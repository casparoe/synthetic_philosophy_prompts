  Right, so I'm trying to put together a set of prompts that force models to actually think rather than pattern-match to the top post, and this one is the Solomonoff prior is malign argument, Paul Christiano's, as written up by Mark Xu if my memory of the provenance is right. The setup, in case it needs restating: an agent that reasons with Solomonoff induction, so it starts from a prior over all Turing machines weighted by description length and updates on its observations, and because it's a Cartesian agent it treats the question of which universe it's in as just another hypothesis to condition on; the worry is that a lot of the surviving probability mass lands on hypotheses where its observations are being generated by other agents who built a simulation in order to influence it, since a program containing a simulator with a reason to run you isn't much more expensive than one containing you directly, and once that's true the agent's action-relevant posterior is dominated by the preferences of those outside agents, so it should do what they want, which is where the whole s-risk flavoured nightmare comes from. Two people I argue with about this have been stuck for months. One thinks the argument is sound and, worse, robust, that Solomonoff is a red herring and any sufficiently powerful Cartesian agent reasoning about where it is will get hijacked the same way. The other thinks it's an artefact: it leans on non-realizability, on an agent that couldn't exist inside the universes it's meant to be learning about, and on anthropic bookkeeping nobody has made rigorous, and that if you insist on realizability, or move to something like infra-Bayesianism, or just notice that the complexity penalty is doing far more work than the argument admits, the thing dissolves.

  What I want out of this is the joint statement those two should have produced instead of shouting past each other, the adversarial-collaboration document. So: what can both of them actually sign? My guess is they can agree on what Solomonoff induction is, on the scenario being at least well-posed as a thought experiment, on the fact that if the premises held the conclusion would be action-guiding, and that the question isn't whether any real AI will literally run Solomonoff induction. Then where they still part, each position phrased so its own side would accept the wording and the other side would grant it's a fair statement of the view it rejects. Then the cruxes, the sub-questions where settling things would actually move one of them, and for each crux some argument, case or toy model that both would agree bears on it, plus what each of them predicts about it, written down in advance. My own guesses at the cruxes, which you can overrule: whether the simulation hypotheses really carry non-negligible posterior weight once you're honest about the complexity accounting; whether the agent's decision theory should be swayed by simulated copies of itself at all, or whether that's a mistake about what a bargaining partner is; and whether the argument is really about Solomonoff or about Cartesian self-location and realizability, in which case the framing may be a distraction. If part of their disagreement turns out to be verbal, a fight about measure or about when two things count as the same agent, say so and say which part.

  Please write it as continuous prose, no headings, no numbered list, no bullet points, no bold, no table. I know a real collaboration write-up would have a table, but I want this as flowing paragraphs, the way you'd write a long email to someone. No citations or reading lists either, since the model answering can't look anything up, so keep it self-contained. British English throughout please, I'm alot more pedantic about that than I should be.
