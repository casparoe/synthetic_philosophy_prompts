  - Step 5: Value Conflicts: The harm (no water for a day) is concentrated on one neighborhood, but the benefit (avoiding contamination) is spread across a larger area. This is a trade-off: harm to a few now vs. harm to many later. The auditor might see a conflict: is it fair to burden this neighborhood to save others? Without a value judgment, this is hard. So flag for human review.

