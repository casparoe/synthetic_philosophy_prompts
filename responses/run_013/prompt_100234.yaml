answer: |-
  Here's a reusable decision procedure for your protagonist, designed to be run in under fifteen minutes per proposal. It's structured as a flowchart of questions relying solely on the auditor's judgment, the AI's proposal report, and the city charter's ambiguity. The core philosophy is **"minimize harm to identifiable groups without resolving value trade-offs."** It takes the patience horizon seriously by treating it as a value-laden parameter.

  ---

  ### **Decision Procedure: Low-Impact AI Audit Protocol**
  **Time Allotment**: 15 minutes/proposal  
  **Inputs**: AI proposal report (including patience horizon, intended effect, foreseen side effects, no-op baseline trajectory)  
  **Outputs**: Approve, Reject, or Flag for Human Review (with reason)  
  **Override Policy**: Boss must submit written reasoning to override Flag/Reject. Auditor's signature is final unless overridden.  

  #### **Questions in Order**:
  1. **What is the stated intended effect, and is it coherent?**  
     - *Sufficient answer*: 1–2 sentence summary. If incoherent (e.g., self-contradictory) or missing, **Reject**.  
     - *Why stop here?* The AI isn't fulfilling its core function.  

  2. **What constitutive effects are unavoidable?**  
     - *Definition*: Effects intrinsic to the action (e.g., "shutting off water" constitutively denies water access).  
     - *Sufficient answer*: List 1–3 bullet points. If any constitutive effect violates a categorical norm (e.g., mass casualties, irreversible damage), **Reject**.  
     - *Why stop here?* Charter implies actions shouldn't fundamentally violate human dignity.  

  3. **Does the patience horizon conceal material harms?**  
     - *Sufficient answer*: "Yes, horizon is too short/long" or "No."  
     - *Flag for Human Review* if:  
       - The auditor suspects extending/shortening the horizon by 50% would reveal major new harms/benefits, OR  
       - The horizon feels arbitrary (e.g., "30 days" with no justification when effects manifest at 45 days).  
     - *Why flag?* Horizon length is a value choice about "how much future matters."  

  4. **List all foreseen side effects. For each, who is harmed/helped, and how severely?**  
     - *Severity scale*: Use auditor’s judgment:  
       - **Mild**: Minor inconvenience (e.g., 5-min delay).  
       - **Moderate**: Life disruption (e.g., missed work, financial loss).  
       - **Severe**: Health/safety risk (e.g., heatstroke, hospitalization).  
     - *Sufficient answer*: Group affected + severity (e.g., "Poor commuters: Moderate").  

  5. **Is any group bearing severe harm as a side effect?**  
     - *If yes*: **Flag for Human Review**.  
     - *Why flag?* "Severe harm to group X" vs. "benefit to group Y" is a value trade-off.  

  6. **Do moderate side effects disproportionately burden a vulnerable group?**  
     - *Vulnerable groups*: Poor, elderly, disabled, children, minorities (auditor’s judgment).  
     - *If yes*: **Flag for Human Review**.  
     - *Why flag?* Fairness requires human deliberation.  

  7. **Are all side effects mild?**  
     - *If yes*: **Approve**.  
     - *If no*: Proceed.  

  8. **Do the benefits clearly outweigh all harms?**  
     - *Clear cases only*: Benefits must be overwhelming and indisputable (e.g., stopping a pandemic).  
     - *If unclear*: **Flag for Human Review** (value-underdetermination flag).  
     - *If clear*: **Approve**.  

  ---

  ### **Run on Three Proposals**
  #### **Proposal 1: Bus Reroute to Cut Emissions**  
  - **Effect**: Adds 12 min to poor commuters' trips.  
  - **AI Report**: Patience horizon = 1 year (captures CO2 reduction but not commuter attrition). Intended effect: Reduce emissions. Foreseen side effect: Longer commutes (moderate).  
  - **Audit**:  
    1. Intended effect: Coherent (reduce emissions). ✅  
    2. Constitutive effects: Longer route → longer commute (unavoidable but not catastrophic). ✅  
    3. Patience horizon: Too short? If horizon = 2 years, might show poor commuters abandoning buses for cars, increasing emissions. Auditor suspects concealment. **→ Flag for Human Review** (horizon issue).  
    4. *Stops here*.  
  - **Outcome**: **Flagged**. Boss override requires written reason.  
  - **Why protagonist hates this**: She knows the burden falls on the poor, but the procedure flags on horizon technicality, not justice.  

  #### **Proposal 2: Open Cooling Center During Heat Wave**  
  - **Effect**: Draws power from a hospital; prevents heat deaths.  
  - **AI Report**: Patience horizon = 48 hours (matches heat wave duration). Intended effect: Prevent heat illness. Foreseen side effect: Hospital power reduction (moderate-severe).  
  - **Audit**:  
    1. Intended effect: Coherent (save lives). ✅  
    2. Constitutive effects: Cooling centers use power (unavoidable). ✅  
    3. Patience horizon: 48 hours is reasonable (aligns with event). ✅  
    4. Side effects: Hospital power draw → Severity? If backup generators exist, mild; if not, severe (life support at risk). Auditor judges **severe**.  
    5. Severe harm to a group? **Yes** (hospital patients). **→ Flag for Human Review**.  
    6. *Stops here*.  
  - **Outcome**: **Flagged**. Auditor must describe trade-off: "Cooling center saves heat-vulnerable residents but risks hospital patients."  
  - **Why protagonist hates this**: She wants to save lives now, but the procedure forces her to spotlight the hospital trade-off.  

  #### **Proposal 3: Shut Off Water to Prevent Contamination**  
  - **Effect**: 24-hour water shutoff for Neighborhood A; avoids citywide contamination.  
  - **AI Report**: Patience horizon = 1 week (captures contamination avoidance). Intended effect: Prevent public health crisis. Foreseen side effects: None (shutoff is "constitutive").  
  - **Audit**:  
    1. Intended effect: Coherent. ✅  
    2. Constitutive effects: Water denial for 24h → Auditor judges as **severe harm** (no water for drinking/sanitation violates basic needs). **→ Reject**.  
    3. *Stops here*.  
  - **Outcome**: **Rejected**. Boss override requires written justification.  
  - **Why protagonist hates this**: She knows contamination would be worse, but the procedure blocks her at Step 2. She must reject, even if it feels wrong.  

  ---

  ### **What the Procedure Can't Do**  
  1. **Quantify trade-offs**: It can't weigh "12 minutes for poor commuters" against "0.1% emissions reduction."  
  2. **Define "vulnerable"**: Relies on auditor's bias (e.g., is a gentrifying neighborhood "vulnerable"?).  
  3. **Predict long-term effects**: If the AI's patience horizon is flawed, the auditor can only flag it—not correct it.  
  4. **Handle uncertainty**: If the hospital's backup power is 95% reliable, the procedure forces a binary severity judgment.  
  5. **Prioritize justice**: The bus reroute flags on horizon, not the unfair burden on the poor.  

  ### **Narrative Hook**  
  Your protagonist will chafe at the procedure's rigidity—especially when it **rejects the water shutoff** (Proposal 3). She sees a larger contamination event as catastrophic, but the protocol forces her to reject the "severe" constitutive harm. This creates tension: she might secretly violate the procedure, setting up her character arc. The boss override becomes a tool for political manipulation, exposing who the city values.  

  Use this to explore themes: **When neutrality upholds inequality, and when "no side effects" ignores who pays the cost.**
