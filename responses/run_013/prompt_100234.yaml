  - Step 1: Action: Shut off water for one neighborhood for a day. Intended effect: Prevent a larger contamination event (avoiding widespread illness).
  - Step 2: Constitutive Effects: The water shutoff inherently means no water for that neighborhood for a day. Is this unacceptable? Access to water is a basic need. A day without water might be acceptable in an emergency if it prevents a greater harm? But the auditor must judge: is a day without water for a whole neighborhood a violation of basic rights? In many contexts, it would be considered a severe hardship. However, if the alternative is a contamination event, it might be justified. But note: the procedure says if the constitutive effect is unacceptable, reject. The auditor might think: "Shutting off water for a whole day is a severe impact and should be avoided if at all possible, but the procedure doesn't allow for trade-offs at this step." However, step 2 is about inherent effects. We note that the shutoff is the action, so no water is inherent. But is it unacceptable? The auditor must decide: without water for a day, people cannot cook, clean, or drink (unless they have stored water). This is severe. So, we might reject at step 2. But let's see: the procedure says "if unacceptable, reject". The auditor could consider: is there any way to avoid this? The proposal doesn't offer an alternative. So, if the auditor deems this unacceptable, then reject. Otherwise, proceed.
     - Let's assume the auditor decides that a one-day shutoff is acceptable only if it is truly necessary to prevent a larger disaster. But step 2 is not about trade-offs. It's about whether the effect is inherently unacceptable. In this case, the shutoff is the action. The auditor might note that the shutoff is the intended mechanism and thus inherent. But the harm is severe. So, she might reject at step 2. However, the procedure is designed to allow step 2 to be a gate: if the inherent effect is a fundamental problem, reject. If not, proceed to consider the trade-off. Given the severity, the auditor might reject at step 2. But let's proceed to see the other steps.

    Alternative: The auditor might not reject at step 2 because the charter doesn't define what is unacceptable. She might note the severity and proceed to step 5.

    However, to follow the procedure strictly:

    Step 2: The constitutive effect is no water for a day. The auditor must decide: is this unacceptable? If yes, reject. If no, proceed.

    Let's assume the auditor decides that it is unacceptable without a very good reason (which the procedure doesn't consider until later). But step 2 is before we see the benefit. Therefore, the procedure might force a rejection at step 2 without considering the larger benefit. This is a flaw.

    We can adjust the procedure: step 2 should only reject if the effect is inherently unacceptable regardless of context (e.g., killing someone). But a water shutoff might be acceptable in the context of preventing a larger harm. So we might move the context to step 2.

    Revised Step 2: We ask: "Is the constitutive effect, in the absence of any justification, so severe that it would be unacceptable in any context?" If yes, then reject. Otherwise, proceed.

    For a water shutoff: it could be acceptable in an emergency (like a major pipe repair). So we proceed.

  - Step 3: Patience Horizon: The AI report might have considered the immediate effects: one day without water vs. the contamination event that would have happened. But what about long-term? If the contamination event would have caused long-term health effects, the horizon might be set to capture that. If the horizon is set appropriately, proceed. Side effect: none? The AI might not report side effects beyond the intended and the inherent. But the shutoff might cause other issues (e.g., businesses closing for the day). If the AI didn't report, then the auditor cannot consider (because she can't look things up). So we go by the report.

  - Step 4: Impact Assessment:
     - Intended: Prevent a larger contamination event (benefit: the entire water system users, including the neighborhood and beyond).
     - Constitutive: The neighborhood loses water for a day (harm).
