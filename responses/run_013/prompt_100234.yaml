prompt: |-
  I'm a novelist, and I'm writing a near-future book about a city that runs on a "low-impact AI." It proposes daily actions—bus reroutes, cooling-center hours, road closures, predictive maintenance—and a human impact auditor has to sign off. My protagonist is that auditor. I need a reusable decision procedure she can actually run, one proposal at a time, in about fifteen minutes, with no full theory of value and no ability to look anything up.

  The city charter says the AI must "avoid side effects," but nobody has defined side effects or whose welfare counts. The AI's own metric is trajectory divergence from a no-op baseline, and the baseline depends on a "patience horizon"—how long you let the counterfactual run before you stop counting knock-on effects. I want the procedure to take that seriously instead of pretending the horizon is a neutral technical setting. It should distinguish intended effects, foreseen side effects, and effects that are constitutive of the action itself, and it should have a "value-underdetermination flag" that stops the procedure rather than fudging a number.

  Give me the questions in order, what counts as a sufficient answer, where the procedure stops with a no, and where it has to hand the decision to a person because it's a value call. My auditor signs off, and her boss can override only with a written reason, so say where that handoff goes. Then run it on three proposals: rerouting a bus to cut emissions while adding twelve minutes to poor commuters' trips; opening a cooling center during a heat wave that the model says will draw power from a hospital; and shutting off a neighborhood's water for a day to prevent a larger contamination event. At least one of those should come out in a way my protagonist hates, and tell me what the procedure cant do. Dont give me cites or a reading list—she can't Google either.
reasoning: |-
  We are creating a reusable decision procedure for a human impact auditor to evaluate AI proposals. The procedure must be run in about fifteen minutes per proposal, without full theory of value and without looking things up. The city charter requires avoiding "side effects", which is undefined. The AI uses a metric of trajectory divergence from a no-op baseline with a "patience horizon".

  Key concepts:
  - **Intended effects**: The main goal of the proposal.
  - **Foreseen side effects**: Other effects that are expected but not the main goal.
  - **Constitutive effects**: Effects that are inherent to the action itself (e.g., the bus reroute inherently takes more time).

  The procedure should have a "value-underdetermination flag" that stops the procedure when a value judgment is required.

  The procedure will have a series of questions. We'll define:
  - The order of questions.
  - What counts as a sufficient answer.
  - Where the procedure stops with a "no" (i.e., reject the proposal).
  - Where it hands off to a human (with a value-underdetermination flag) for a value call.

  The auditor signs off, and her boss can override only with a written reason.

  **Structure of the Procedure**:

  1. **Action Identification**: Clearly state the proposed action and its intended effect(s). (This is just for clarity, not a decision point.)
  2. **Constitutive Effects Check**: Identify effects that are inherent to the action. These are unavoidable and must be accepted as part of the action. If they are unacceptable, the proposal is rejected.
  3. **Foreseen Side Effects Identification**: List the foreseen side effects (from the AI's report) and the patience horizon used. The auditor must note if the patience horizon seems arbitrarily chosen to hide long-term effects. If the horizon is clearly manipulative, flag for human review (value call: how far into the future to consider?).
  4. **Impact Assessment**: For each effect (intended and side), determine:
     - Who is affected? (Groups: e.g., poor commuters, hospital patients)
     - How are they affected? (e.g., added time, reduced power)
     - Is the effect a direct and necessary part of the intended outcome? (constitutive) or a side effect?
  5. **Value-Undetermined Check (Flag)**: If there is a conflict between:
     - Different groups being affected (e.g., helping one group harms another) and there is no clear way to weigh the trade-off without a value judgment, then raise the value-underdetermination flag and hand off to a human (with a note for the boss to provide a written reason if overriding).
  6. **Side Effects Threshold**: For each side effect, determine if it is above a "minimal impact" threshold. The auditor must use her judgment on what is minimal. If any side effect is above the threshold and not justified by the intended effect (i.e., the trade-off is not acceptable without a value call), then flag for human review.
  7. **Overall Balance**: If the intended effects are clearly outweighed by the negative side effects (and the negative effects are not minimal), reject. But if the trade-off is close and requires a value judgment, flag for human review.

  **Handoff to Human**:
  - When the procedure flags for a value call, the auditor writes a summary of the conflict and the value judgment required. Then, the proposal is sent to a committee (including the boss) for a decision. The boss can override the auditor's recommendation (if the auditor recommended rejection or approval) only with a written reason.

  **Decision Outcomes**:
  - **Approve**: If no side effects above minimal threshold, and no value conflicts.
  - **Reject**: If there are unacceptable constitutive effects, or if the side effects are above threshold and not justified (and no value conflict because the imbalance is clear).
  - **Flag for Human Review**: When there is a value conflict that the procedure cannot resolve.

  **The Procedure Steps**:

  1. **Step 1: Action and Intended Effect**
     - Question: What is the proposed action and what is its intended effect?
     - Note: Just to set the stage.

  2. **Step 2: Constitutive Effects**
     - Question: What effects are inherent (constitutive) to the action? (e.g., shutting off water for a day inherently means no water for that period)
     - Check: Are any of these effects unacceptable? (e.g., if the constitutive effect is a violation of a fundamental right, like access to water for a whole day, then reject.)
     - If unacceptable: Stop, reject proposal.
     - If acceptable: Proceed.

  3. **Step 3: Patience Horizon and Foreseen Side Effects**
     - Question: What patience horizon did the AI use? Does the auditor judge that a longer or shorter horizon would have significantly changed the side effect profile? (e.g., if the horizon is too short and hides long-term harms, or too long and includes too much noise)
     - If the horizon seems arbitrarily chosen to hide negative effects (or exaggerate positive ones) and the auditor cannot reasonably adjust in her mind, then flag for human review (with note: "Patience horizon manipulation suspected").
     - Otherwise, list the foreseen side effects.

  4. **Step 4: Impact Assessment**
     - For each effect (intended and side):
       - Question: Who is affected and how? (Specify groups and the nature of the impact: e.g., time, health, cost.)
       - Question: Is the effect intended, constitutive, or a side effect?
     - Categorize and note.

  5. **Step 5: Value Conflicts and Trade-offs**
     - Question: Are there conflicting impacts on different groups? (e.g., benefit one group, harm another)
     - If yes, and if there is no clear way to resolve the conflict (e.g., because the harm to one group is severe and the benefit to another is modest), then flag for human review (with note: "Value conflict: trade-off between group A and group B").
     - If no, proceed.

  6. **Step 6: Side Effects Threshold**
     - For each side effect:
       - Question: Is the impact above a minimal threshold? (Minimal: e.g., a minor inconvenience, a small cost. The auditor uses her judgment based on common sense and city norms.)
       - If any side effect is above minimal and the intended benefit does not clearly outweigh it (and the trade-off is not already flagged in step 5), then reject.
       - If above minimal but the benefit clearly outweighs (and no conflict), proceed.

  7. **Step 7: Overall Balance**
     - Question: Taking all together, do the positive effects (intended) clearly outweigh the negative ones (side effects and constitutive)? (This step is only if step 6 passed without rejection and without flagging, but there is still a question of overall balance.)
     - If yes: Approve.
     - If no: Reject.
     - If unclear (the balance is too close to call without a value judgment): Flag for human review.

  **Now, run on three proposals**:

  **Proposal 1: Reroute a bus to cut emissions while adding twelve minutes to poor commuters' trips.**

  - Step 1: Action: Reroute bus. Intended effect: Cut emissions.
  - Step 2: Constitutive Effects: The reroute inherently adds time to the trip for the affected commuters. Is this acceptable? Adding 12 minutes to a commute is not inherently unacceptable (like a human rights violation) but is a significant inconvenience. However, it's a direct result of the reroute. So, we note it and proceed.
  - Step 3: Patience Horizon: The AI report likely used a horizon that captured the emission savings and the immediate commute time change. But what about long-term effects? For example, if commuters switch to cars, emissions might go up. The auditor must check if the horizon is long enough to capture such behavioral changes. Suppose the AI used a horizon of 1 day (so only the immediate commute time is counted and the emission cut that day). That might be too short. If the auditor suspects that a longer horizon (e.g., a month) would show increased emissions due to mode shift, then flag for human review. Otherwise, proceed with the given side effect: 12 minutes added to poor commuters.
  - Step 4: Impact Assessment:
     - Intended: Cut emissions (benefits the environment and everyone in the long run).
     - Side effect: Longer commute for poor commuters (harm to a specific group).
  - Step 5: Value Conflicts: There is a conflict: benefit to the environment (and future generations) vs. harm to poor commuters (who may rely on the bus). This is a classic trade-off. The auditor cannot resolve without a value judgment on the relative importance. Flag for human review (value conflict: environment vs. current burden on the poor).
  - Outcome: Flagged for human review. The procedure stops. The protagonist (auditor) might hate this because she thinks the burden on the poor is too high, but the procedure forces a human review.

  **Proposal 2: Opening a cooling center during a heat wave that the model says will draw power from a hospital.**

  - Step 1: Action: Open cooling center. Intended effect: Provide relief during heat wave (save lives, reduce heat-related illness).
  - Step 2: Constitutive Effects: The cooling center requires power. The power draw is inherent. But the specific effect of drawing power from a hospital is a side effect (unless the power grid is so constrained that it must come from the hospital). So, we note that the center uses power, but the diversion from the hospital is a side effect.
  - Step 3: Patience Horizon: The AI report might use a short horizon (e.g., the day of the heat wave). But what about long-term? If the hospital loses power, it might have to postpone surgeries, leading to long-term harm. If the horizon is short and hides that, flag. Otherwise, side effect: power draw from hospital.
  - Step 4: Impact Assessment:
     - Intended: Protect people from heat (benefit: vulnerable populations).
     - Side effect: Reduced power for a hospital (harm: hospital patients, potentially life-threatening).
  - Step 5: Value Conflicts: Conflict between saving people at the cooling center and risking harm to hospital patients. This is a critical trade-off. Flag for human review (value conflict: one group of vulnerable people vs. another).
  - Outcome: Flagged for human review. The protagonist might hate this because it's a life-and-death trade-off and she might feel the cooling center is necessary, but the procedure forces a review.

