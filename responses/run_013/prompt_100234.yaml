  **Revised Procedure Steps (with adjustments from the examples)**:

  1. **Action and Intended Effect**: State the action and its intended effect(s).
  2. **Constitutive Effects**: Identify the inherent effects. If any of these effects, in the absence of any justification, would be unacceptable in any context (e.g., a fundamental rights violation), then reject. Otherwise, note them and proceed.
