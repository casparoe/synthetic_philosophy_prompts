answer: |-
  Here is a systematic translation of the doing/allowing distinction into control-theoretic terms, followed by a residue analysis and confidence assessment. I'll adhere strictly to your vocabulary while exposing conceptual tensions.

  ### Core Translation
  1.  **"Doing" (Actively Causing Harm):**
      *   **Corresponds to:** An *actuation signal* that changes the plant state toward an unsafe region, a deliberate *setpoint change* to an unsafe value, a *supervisory command* initiating a harmful sequence, or a *mode switch* to a hazardous operating mode.
      *   **Key Feature:** The system's output (control signal) directly causes the transition into the harmful state. The harmful trajectory is a direct consequence of a *non-null, non-default output* from the controller/operator block. (e.g., Commanding a valve to close, starving a process; setting cruise control speed above safe limit for conditions).

  2.  **"Allowing" (Failing to Prevent Harm):**
      *   **Corresponds to:** A *null control signal* (u=0) applied to an actuator when intervention is needed, an *unchanged setpoint* despite changing conditions making it unsafe, the plant evolving under its *own (open-loop) dynamics* when closed-loop intervention was required/specified, or a *deliberate failure to trip* a safety interlock (overriding a fail-safe default).
      *   **Key Feature:** The system's output (or lack thereof) *permits* the plant's inherent dynamics or external disturbances to cause the harmful state. The harmful trajectory occurs because the controller/operator block *did not generate the necessary corrective output* to counteract it. (e.g., Failing to apply brakes; not reducing setpoint when disturbance makes it unsafe; disabling a low-pressure trip).

  ### Critical Observations on "Null Command"
  *   **Your Observation:** "A null command is still a command: the controller is running, the actuator is at zero, and the plant's trajectory is as much a consequence of my code as it would be of any intervention."
  *   **Philosophical Work:** This observation **does significant philosophical work** by challenging a core intuition in the doing/allowing distinction. It highlights that in an *active, closed-loop control system*, maintaining u=0 is:
      *   **Causally Equivalent:** The system state results from the controller's *deliberate choice* to maintain u=0 (its output), just as much as from choosing u≠0. The plant's dynamics under u=0 are part of the *designed system behavior*.
      *   **Not Trivial:** It demonstrates that within the causal structure of the controlled system, there is often **no fundamental physical distinction** between "doing" (u≠0 causes harm) and "allowing" (u=0 allows harm). Both are outputs of the controller block causing the resulting state.
  *   **Operator Distinction (Holds Zero vs. Never Touches):**
      *   **Within the Loop:** If the controller is actively closed-loop and the *operator* explicitly sets u=0 or maintains the default setpoint when intervention is needed, this is equivalent to "allowing" within the system's causal framework. The system is still actively outputting u=0.
      *   **Outside the Loop:** If the operator *never engages the system at all* (e.g., supervisory control not activated, system left purely in open-loop plant dynamics), this is a distinct scenario. Here, the harmful outcome arises solely from the plant/environment without any contribution from the *control system's* outputs. This might map closer to a pure philosophical "allowing," but only if the system was *never intended* to be closed-loop in that context.

  ### Key Distinctions in Your Vocabulary & Their Nature
  1.  **Default States (e.g., Fail-Safe vs. Fail-Dangerous):**
      *   **What it Distinguishes:** Whether the system's *passive state* (on loss of control signal, power, or positive command) inherently moves towards safety (u=fail-safe) or danger (u=fail-dangerous).
      *   **Nature:** **Causal & Conventional.** The *causal* effect of the default state (safe vs. dangerous outcome) is physical. The *designation* of which state is "default" and which outcome is "safe" is conventional (based on design goals and risk assessment). This creates a profound asymmetry: "Allowing" failure (e.g., letting a failsafe actuator return to safe state) is often *good*, while "allowing" failure in a fail-dangerous system is *bad*.
  2.  **Fail-Safe Design:**
      *   **Embodies the Asymmetry:** It explicitly designs the "null" or "loss of control" state (u_default) to be safe. This makes "allowing" the system to reach its default state morally *positive* (or at least neutral) in failure scenarios. It shifts the burden: Harm requires *active deviation* from the safe default ("doing" harm), while safety is the passive state ("allowing" safety).
  3.  **Dead Man's Switch / Positive Action to Depart Nominal:**
      *   **What it Distinguishes:** Requires continuous operator input (or periodic positive action) to maintain a potentially hazardous state/non-default setpoint. Inactivity (u=0 / no input) defaults to a safe state.
      *   **Nature:** **Causal & Conventional.** Causally, operator inaction causes u_default (safe). Conventionally, it defines "inaction" (allowing the default) as the path to safety, and "action" (doing - providing input) as necessary *for* the hazardous state. This flips the intuitive "doing=harm" notion; here, "doing" (providing input) is necessary *for* hazard, while "allowing" (inaction) causes safety.

  ### Residue Report
  *   **Cleanly Translated:**
      *   The core concept of a *deliberate actuator command/setpoint change* causing harm ("doing") vs. *withholding a necessary corrective command* ("allowing") translates cleanly. Supervisory commands and mode switches fit neatly into "doing".
      *   The moral significance of **fail-safe defaults** and **dead-man's switches** translates *extremely well*. They operationalize the moral intuition that safety should be the passive state, requiring positive action for hazard. This asymmetry is captured causally and by design convention.
      *   The distinction between a *designed null command* (u=0 as part of control logic) and *total system non-engagement* (plant in pure open-loop) is clear.
  *   **Distorted in Translation:**
      *   **The "Null Command is Still a Command" Problem:** This fundamentally distorts the philosopher's pure "allowing" (often conceived as total non-involvement). In an active control loop, "allowing" harm *by maintaining u=0* is causally equivalent to a specific *output* of the controller. Philosophically, this makes the controller causally responsible for the outcome *regardless* of whether u=0 or u≠0, challenging the idea that "allowing" involves no causal responsibility. The residue here is the philosopher's intuition of "true passivity" or "non-agency," which is hard to achieve in a designed, closed-loop system.
      *   **Moral Weight of Inaction vs. Designed Passivity:** Translating "allowing" to "failing to issue a corrective u≠0" captures the *functional* omission. However, the *moral* intuition that "failing to act" is fundamentally different in kind (and perhaps less culpable) than "acting to harm" struggles against the causal equivalence point. The control system description exposes that *both* are choices made by the system/operator block with known consequences.
  *   **Cannot Be Said (Residue):**
      *   **Pure Non-Engagement as a Moral Baseline:** The philosopher's concept of a "state of nature" or baseline where no agent/system is involved *at all*, and harm "just happens," has no direct analogue in a system *designed* for control. If the system exists and is commissioned, its *design choices* (including defaults and whether a loop is open or closed) define the causal landscape. "Leaving the plant to evolve on its own" *is* a designed system behavior (open-loop operation) with its own causal responsibility.
      *   **Intrinsic Moral Asymmetry in Causation:** Control theory reveals the causal structure and shows that the moral asymmetry between "doing" and "allowing" harm **does not arise intrinsically from the physics of causation** in a controlled system. The controller's output (whether u≠0 or u=0) is a cause of the state. The profound asymmetry comes entirely from **conventional design choices** (Fail-Safe Defaults, Dead Man's Switches) and **specified system requirements** (what constitutes a "safe" state, when intervention is required). Philosophers often seek an asymmetry *in the causal relation itself*; control theory suggests this asymmetry is imposed by design convention and risk assessment, not discovered in the physics.

  **Conclusion on Residue:** The residue **tells against the doing/allowing distinction** as philosophers often frame it (as a fundamental causal asymmetry). Your framework reveals that within the causal structure of a designed control system:
  1.  Both "doing harm" (u_harm ≠ 0) and "allowing harm" (u_corrective = 0 when needed) are *causal outputs* of the controller/operator.
  2.  The critical moral asymmetry arises not from causation itself, but from **how we design the system's default states and define its responsibilities** (Fail-Safe vs. Fail-Dangerous, Dead Man's Switches, specification of required interventions). The asymmetry is conventional and teleological (goal-oriented), not inherent in the causal chain.

  **To Express the Distinction in Your Terms:** You already have the core vocabulary: **Active Command/Intervention** vs. **Failure to Intervene When Required/Specified**, coupled with the crucial context of **Default State Behavior (Fail-Safe/Fail-Dangerous)** and **Operational Conventions (Dead Man's Switch)**. The key addition isn't new terms, but explicitly acknowledging that the moral weight stems from the *designed consequences of defaults and the specification of when intervention is mandatory*. The distinction is defined by the system's requirements and safety design, not by a universal causal asymmetry.

  ### Confidence Assessment
  1.  **Core Translation (Doing=Active Command, Allowing=Failure to Intervene):** **High Confidence (≥95%).** This is a direct mapping of the concepts into functional control actions.
  2.  **"Null Command is Still a Command" Challenges Causal Asymmetry:** **High Confidence (90%).** This follows logically from the definition of a closed-loop control system where the output (including u=0) is determined by the controller logic/state.
  3.  **Fail-Safe/Dead Man's Switches Capture Key Moral Asymmetry Conventionally:** **High Confidence (≥95%).** This is demonstrably how safety-critical systems are engineered to create the desired asymmetry.
  4.  **Residue Shows Asymmetry is Conventional (Design/Requirement), Not Causal:** **High Confidence (85%).** The causal equivalence of controller outputs (u≠0 harm vs. u=0 allow harm) is strong evidence. The dependence on design conventions is clear.
  5.  **Philosopher's "Pure Allowing" (Non-Engagement Baseline) Has No Direct Analogue:** **High Confidence (90%).** A commissioned control system is always "involved" by design definition; open-loop operation is a specified mode.

  **Point of Least Certainty (∼70% Confidence):** Whether the distinction between an *operator holding u=0 within an active loop* and the *system never being engaged at all (pure open-loop plant)* sufficiently maps to a morally relevant difference philosophers might cling to as "true allowing" vs. "system-mediated allowing." While I argue both are defined by the overall system design, the *perception* of "non-involvement" in the pure open-loop case might carry residual intuitive moral weight that's hard to fully eradicate, even if causally the *design choice* to operate open-loop bears responsibility. This is the edge case where the residue might hint at something not fully captured, though I believe the design-responsibility argument still prevails.
