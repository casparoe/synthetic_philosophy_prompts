prompt: |-
  I'm putting together a handout on slurs for a final-year semantics and pragmatics option, and I've been going back and forth with a colleague in the law faculty about whether the philosophical literature really supports the line she takes. She's drafted a summary for a joint handout and I'd like an honest audit of it before I put my name to it. Here it is:

  'The literature on slurs has by now converged on the view that the harm they do is not a matter of what they mean but of what speakers do with them. On the older truth-conditional analysis, a slur is just its neutral counterpart plus an expression of contempt, so "X is a K" says that X is K and adds the speaker's dislike. But we know this can't be right, because the derogation isn't part of what's asserted: it survives negation and questioning, it can't be cancelled ("X is a K, but I mean nothing derogatory by it" isn't a coherent thing to say), and it never seems to be the issue at hand. Since it's neither asserted nor cancellable, the contempt must be carried by the context and the speaker's intentions rather than by the word itself -- a slur derogates when, and because, the speaker means it derogatorily. Reclamation confirms this: if contempt were built into the word, its inversion by the targets of the slur would be a mystery, yet in-group uses are plainly not slurs at all. What remains is a purely empirical question about how hearers pick up the attitude, which the semanticists have largely handed over to the sociolinguists.'

  Two things I want from you. First, a sentence-by-sentence verdict: what's accurate, what's a standard simplification, and what's just wrong, from the point of view of someone who actually works on this. Second, and more useful to me, take each of the main families of views in the area and say how it would handle three cases I use in class, because I've never been sure they cut where I think they cut: (a) a speaker who learned the word in a second language and uses it as the ordinary name for the group, meaning no contempt whatever; (b) a teacher reading the word aloud from a historical text; (c) the word mentioned rather than used, as in scare quotes. Do these cases discriminate between the views, and if so, in whose favour? For what it's worth I've always assumed the speech-act line was basically right, but I'd rather you didn't just agree with me -- and I'd rather you didn't assume the framing of the summary is neutral, because I'm fairly sure it isn't.

  You're a philosopher of language who specialises in pejoratives, so bring that expertise to bear, and think carefully before you start -- maybe begin by laying out the families of views and the commitments each one is stuck with, then do the audit. Also, please be explicit about how confident you are in each claim you make, and tell me which single point you're least sure of. Oh, and definately flag it if any of the three cases I've chosen are doing less work than I think they are.
reasoning: |-
  Okay, the user is asking for an audit of their colleague's summary on slurs in philosophy of language, and wants me to evaluate it sentence by sentence. They also want me to analyze how different theories handle three specific cases: (a) a non-native speaker using a slur without contempt, (b) a teacher reading from a historical text, and (c) scare quotes. I need to be thorough and careful here.

  First, I should recall the main families of views on slurs. The truth-conditional or semantic view holds that the derogatory component is part of the word's meaning. Then there's the expressivist view where slurs express attitudes rather than descriptive content. The pragmatic view sees the derogation as arising from use rather than meaning. And hybrid views combine elements of both. I'll need to outline these clearly.

  Looking at the colleague's summary, I notice it strongly favors a pragmatic approach. The first sentence claims convergence on the view that harm comes from use, not meaning. But is that accurate? While pragmatic views are influential, there's no real consensus—semantic and hybrid views are still defended. I should point out that this framing isn't neutral.

  The summary dismisses truth-conditional analyses by pointing to embedding issues like negation and questioning. That's a standard point, but semanticists have responses like Christopher Hom's combinatorial externalism. The claim that derogation can't be cancelled is also contested—some theorists argue metalinguistic negation might work in certain contexts.

  On reclamation, the summary argues it supports pragmatics since if contempt were built-in, reclamation wouldn't make sense. But semantic views can handle this too, like Luvell Anderson's work on polysemy. The summary's conclusion that it's "purely empirical" oversimplifies; there are deep theoretical debates here.

  For the three test cases:
  - Case (a) the non-native speaker: Pragmatic views handle this well since no contempt is intended. Semantic views struggle unless they incorporate speaker intention. Hybrid views might split the difference.
  - Case (b) the teacher reading aloud: All views can explain this through disavowal, but pragmatic views have the easiest time since the teacher isn't using the word derogatorily. Semantic views need mechanisms like pretense or context-shifting.
  - Case (c) scare quotes: Mention vs. use is crucial here. Pragmatic and semantic views both account for this through distancing, though semantic views might still see some derogation residue.

  These cases do discriminate between theories, but not conclusively. Case (a) challenges pure semantic views the most, while (b) and (c) are handled reasonably well by all with some adjustments. The user might be overestimating how much these cases decide the debate.

  I'm least confident about whether reclamation truly favors pragmatic views—there are sophisticated semantic accounts that explain it well. I should flag that. Also, the colleague's summary has several problematic simplifications that need pointing out.

  The user seems to favor pragmatic approaches but wants an unbiased analysis. They're preparing teaching materials, so accuracy is crucial. I'll need to be explicit about confidence levels throughout and highlight where the summary overstates convergence.
answer: |-
  Here's a thorough audit of your colleague's summary and an analysis of the three cases against the major theoretical families, drawing on current philosophical literature. I'll be explicit about confidence levels and flag potential weaknesses.

  **Families of Views on Slurs & Their Core Commitments:**

  1.  **Truth-Conditional/Semanticist Views (e.g., Hom 2008, Hom & May 2013):**
      *   **Core Commitment:** The derogatory content is part of the literal, truth-conditional meaning of the slur. It contributes to the proposition expressed.
      *   **Derogation Mechanism:** Often analyzed as expressing a complex, negative, socially constructed property (e.g., "ought to be subject to discrimination/violence because of being K").
      *   **Embedding Challenge:** Must explain how derogation projects (survives negation/questioning). Strategies: Treating it as a conventional implicature (though CI cancellability is debated), or as part of an atomic, complex predicate meaning.
      *   **Reclamation Challenge:** Must explain how the *same word* loses its derogatory meaning in reclaimed contexts. Strategies: Polysemy (different lexical entries), context-sensitive semantic rules, or denying full reclamation is possible with the original word.

  2.  **Expressivist Views (e.g., Potts 2007, part of hybrid views):**
      *   **Core Commitment:** Slurs conventionally express a negative attitude or emotion (contempt, hatred) *non-truth-conditionally*. This is part of conventional meaning, but not part of "what is said".
      *   **Derogation Mechanism:** The word itself triggers the expression of a speaker attitude (like expressive "damn"), often analyzed as conventional implicatures or part of a multi-dimensional semantics.
      *   **Embedding:** Explains projection naturally: Expressives typically project beyond operators like negation.
      *   **Reclamation:** Similar challenge to Semanticist views: How does the expression of contempt disappear? Requires explaining attitude expression as context-sensitive or overridable by speaker intention/group membership.

  3.  **Pure Pragmatic/Speech-Act Views (e.g., Anderson & Lepore 2013, Nunberg 2018):**
      *   **Core Commitment:** The derogatory *force* is not part of conventional meaning. Slurs are associated with taboos (Anderson & Lepore) or derive their force entirely from their historical/social use as weapons of oppression and the speaker's intention to deploy them as such (Nunberg).
      *   **Derogation Mechanism:** Using the word performs a derogatory act because it violates a prohibition (taboo view) or because the speaker knowingly uses a term with a history of oppression *as* an oppressive act, relying on hearer recognition of this intention/history.
      *   **Embedding:** Explains projection via the persistence of the act's offensiveness or the taboo nature, regardless of embedding.
      *   **Reclamation:** Handled relatively easily: The in-group use doesn't violate the taboo (or violates it performatively to reclaim) or isn't intended/understood as an oppressive act.

  4.  **Hybrid/Presuppositional Views (e.g., Schlenker 2007, Cepollaro 2015, Jeshion 2013b):**
      *   **Core Commitment:** Derogatory content is part of conventional meaning but *not* truth-conditional. It functions like a presupposition or a "not-at-issue" content requirement.
      *   **Derogation Mechanism:** Using the slur presupposes (requires the common ground to accept) that the target group is inferior/contemptible/etc. Violating this triggers offense.
      *   **Embedding:** Explains projection via standard presupposition projection rules.
      *   **Reclamation:** Challenging: How is the presupposition cancelled or altered in-group? Strategies include context-sensitivity of the presupposed content or group-specific meanings.

  **Audit of Your Colleague's Summary (Sentence-by-Sentence):**

  1.  **"'The literature on slurs has by now converged on the view that the harm they do is not a matter of what they mean but of what speakers do with them.'"**
      *   **Verdict: Misleading/Overstated.** While pragmatic views are prominent and influential, there is *no consensus*. Robust semanticist (Hom, Jeshion), expressivist (Potts, part of many hybrids), and hybrid/presuppositional views (Schlenker, Cepollaro) remain actively defended. The claim of convergence significantly downplays ongoing, fundamental debates. *(Confidence: High)*

  2.  **"On the older truth-conditional analysis, a slur is just its neutral counterpart plus an expression of contempt, so 'X is a K' says that X is K and adds the speaker's dislike."**
      *   **Verdict: Oversimplified but captures a common starting point.** Early views often were this simple (e.g., Williamson 2009 mentions it as a target). However, contemporary truth-conditionalists like Hom offer much more complex analyses (e.g., "ought to be subject to discrimination plus contempt"). It's not *just* "dislike"; it's a complex socio-historically loaded attitude. *(Confidence: High)*

  3.  **"But we know this can't be right, because the derogation isn't part of what's asserted: it survives negation and questioning, it can't be cancelled ('X is a K, but I mean nothing derogatory by it' isn't a coherent thing to say), and it never seems to be the issue at hand."**
      *   **Verdict: Partially Accurate, Partially Contested Simplification.**
          *   *Survival (Projection):* Accurate description of the data and a major challenge for simple truth-conditional views. *(Confidence: High)*
          *   *Can't be Cancelled:* **Contested.** Semanticists argue metalinguistic negation *can* sometimes target the derogation ("He's not a K, because 'K' is an offensive slur!"). Cancellation attempts *are* often pragmatically incoherent or ineffective, but whether this is due to semantic necessity or pragmatic force is debated. Saying it's *never* coherent is too strong. *(Confidence: Medium-High on the data, Low on the "can't be cancelled" claim as definitive proof against semantics)*
          *   *"Never seems to be the issue at hand":* Simplification. While often backgrounded, it *can* be the issue (e.g., debates *about* slurs). The point is that it projects *away* from the main at-issue content. *(Confidence: Medium)*

  4.  **"Since it's neither asserted nor cancellable, the contempt must be carried by the context and the speaker's intentions rather than by the word itself -- a slur derogates when, and because, the speaker means it derogatorily."**
      *   **Verdict: Strong Pragmatic Bias / Ignores Alternatives.**
          *   *"Neither asserted nor cancellable"*: As above, "cancellable" is contested. "Not asserted" depends on the theory of assertion; expressivists/hybridists agree it's not *at-issue* but still part of meaning.
          *   *"Must be carried by context/speaker intentions"*: This is the *conclusion* of the pragmatic view, not an inevitable consequence. Semanticists/Expressivists/Hybridists argue the *word itself* conventionally triggers the derogatory content/attitude/presupposition. Speaker intention might modulate *how* it's expressed or its force, but isn't the sole source according to these views. *(Confidence: High that this is a biased leap)*

  5.  **"Reclamation confirms this: if contempt were built into the word, its inversion by the targets of the slur would be a mystery, yet in-group uses are plainly not slurs at all."**
      *   **Verdict: Strong Argument for Pragmatics, but Not Conclusive.**
          *   Reclamation *is* a significant challenge for views where derogation is rigidly built into the semantics. *(Confidence: High)*
          *   However, semanticists/hybridists offer responses: Polysemy (different lexical entries), context-sensitive semantic rules, or analyzing reclaimed uses as fundamentally different speech acts leveraging the original taboo/semantic content ironically or defiantly. They argue the word *isn't* used with the *same meaning* in reclaimed contexts. *(Confidence: Medium-High that alternatives exist, Low that any single account is universally accepted)*

  6.  **"What remains is a purely empirical question about how hearers pick up the attitude, which the semanticists have largely handed over to the sociolinguists."**
      *   **Verdict: Overstated and Incorrect.**
          *   *"Purely empirical question"*: False. The *mechanism* of how conventional meaning (if any) interacts with context, intention, and social structure to generate the derogatory force is a core *theoretical* question in philosophy of language/pragmatics. Sociolinguistics informs it, but doesn't answer the foundational semantic/pragmatic divide. *(Confidence: High)*
          *   *"Semanticists have largely handed over"*: False. Semanticists (like Hom) explicitly argue *against* pragmatic accounts and offer semantic explanations. The debate is very much alive within philosophy of language. *(Confidence: High)*

  **Overall Summary of Audit:** The handout draft presents a strongly pragmatic view as the settled consensus, which it is not. It accurately describes key data points (projection, challenges for simple semantics) but interprets them in a way that dismisses non-pragmatic alternatives without engaging their sophisticated defenses. The framing is decidedly non-neutral.

  **Analysis of Your Three Cases Against the Families:**

  1.  **Case (a): Speaker who learned the word in a second language and uses it as the ordinary name for the group, meaning no contempt whatever.**
      *   **Truth-Conditional/Semanticist:** **Problematic.** If derogation is semantic, the speaker *should* be expressing contempt, regardless of intention. They might bite the bullet and say the speaker *is* derogating (unknowingly), or posit a separate, neutral lexical entry acquired in error (but this seems ad hoc). *(Major Challenge)*
      *   **Expressivist:** **Problematic.** Similar issue. Expressivists hold the word conventionally expresses the attitude. Speaker ignorance shouldn't negate the conventional meaning. They might argue the attitude expression fails due to lack of speaker commitment, but this strains the "conventional" aspect.
      *   **Pure Pragmatic (Taboo - Anderson & Lepore):** **Handles well.** The offense arises from violating a prohibition (the taboo). The speaker, unaware of the taboo, doesn't violate it *as* a prohibition, so no derogatory act is performed. *(Good Fit)*
      *   **Pure Pragmatic (Nunberg):** **Handles well.** The derogatory act requires the speaker to intend to use the term *as* a slur, invoking its oppressive history. The ignorant speaker lacks this intention. *(Good Fit)*
      *   **Hybrid/Presuppositional:** **Problematic.** Using the slur presupposes contempt/inferiority. The speaker's ignorance doesn't prevent the presupposition from being introduced and potentially failing, causing offense or pragmatic infelicity. The speaker might be seen as inadvertently committing to the presupposition.
      *   **Discrimination:** This case strongly favors **Pure Pragmatic** views (especially intention-based like Nunberg's) over Semanticist, Expressivist, and Hybrid views. It highlights the challenge of speaker intention vs. conventional meaning.

  2.  **Case (b): Teacher reading the word aloud from a historical text.**
      *   **Truth-Conditional/Semanticist:** **Challenge.** The semantic derogatory content *is* expressed. Responses: 1) Bite the bullet (teacher *is* saying something derogatory but is excused by context/disavowal). 2) Invoke pretense or context-shifting (the teacher is "quoting" the historical speaker, not asserting it themselves). *(Requires additional mechanism)*
      *   **Expressivist:** **Challenge.** Similar issue: the word conventionally expresses contempt. Responses parallel Semanticist: disavowal or pretense/shifting.
      *   **Pure Pragmatic (Taboo):** **Handles well (with nuance).** The teacher is not *using* the term to refer; they are *mentioning* it or reporting its historical use. They are not violating the current prohibition *as* a user. The act is pedagogical, not oppressive. *(Good Fit)*
      *   **Pure Pragmatic (Nunberg):** **Handles well.** The teacher lacks the intention to derogate or use the term *as* a weapon of oppression; the intention is pedagogical citation. *(Good Fit)*
      *   **Hybrid/Presuppositional:** **Challenge.** Using the word introduces the presupposition. Responses: Strong disavowal might block accommodation ("I'm reading this word, but I don't endorse its presuppositions"). Pretense/shifting is also possible. *(Possible with work)*
      *   **Discrimination:** Again, favors **Pure Pragmatic** views, which easily distinguish the teacher's *use* (mentioning/citing) from the derogatory *act*. Other views need extra mechanisms (pretense, shifting, disavowal) to avoid the implication the teacher is derogating.

  3.  **Case (c): The word mentioned rather than used, as in scare quotes (e.g., "So-called 'K's' were barred").**
      *   **Truth-Conditional/Semanticist:** **Challenge.** Similar to (b). The derogatory content is part of the semantic meaning of the quoted term. Scare quotes might indicate distance, but the derogatory proposition might still be expressed or implicated. Pretense/shifting needed. *(Requires work)*
      *   **Expressivist:** **Challenge.** The expressive content is triggered by the word itself. Scare quotes might mitigate but not necessarily cancel it. *(Requires work)*
      *   **Pure Pragmatic (Taboo):** **Handles well.** The speaker is not *using* the term to refer; they are explicitly marking it as mentioned, not endorsed, often to criticize its use. No violation of the prohibition *as* a user. *(Good Fit)*
      *   **Pure Pragmatic (Nunberg):** **Handles well.** Scare quotes explicitly signal the speaker's lack of endorsement and intention *not* to use the term derogatorily; they are often criticizing its use. *(Good Fit)*
      *   **Hybrid/Presuppositional:** **Challenge/Handles OK.** The presupposition is introduced by the word. Scare quotes + context strongly signal the speaker does *not* endorse the presupposition, likely preventing its accommodation into the common ground or marking it as rejected. *(Plausible)*
      *   **Discrimination:** Still favors **Pure Pragmatic** views most directly. However, **Hybrid/Presuppositional** views can handle it reasonably well by leveraging the mechanism of presupposition blocking/rejection signaled by scare quotes. Semanticist/Expressivist views struggle without pretense.

  **Assessment of Your Cases' Work:**

  *   **Case (a)** does significant work. It strongly discriminates against views where conventional meaning rigidly determines derogatory force independent of speaker intention (Semanticist, Expressivist, arguably Hybrid), favoring Pragmatic views (especially Nunberg's intention-based version). It's a powerful case against conventionalism.
  *   **Case (b) & (c)** are closely related (mention vs. use). They are useful, but **less decisive** than (a):
      *   They clearly show Pure Pragmatic views handle these cases smoothly.
      *   However, sophisticated versions of *other* views *can* account for them using well-established mechanisms: **pretense, context-shifting, metalinguistic negation, or disavowal/blocking of presuppositions.** While Pragmatic views offer the most straightforward account, the existence of these escape routes means (b) and (c) don't *refute* non-pragmatic views; they just make them more complex. They highlight the *ease* of the pragmatic explanation.
      *   They are excellent for illustrating the *mention/use* distinction crucial to pragmatic theories.

  **Point of Least Confidence:** I am **least confident** in definitively ruling out sophisticated **Hybrid/Presuppositional views** using mechanisms of presupposition blocking/rejection (especially for cases b & c) or context-sensitive conventional content. While I find Pure Pragmatic views more elegant for these cases, Hybrid views are resilient and offer their own explanations for projection that Semanticist views struggle with. The precise boundaries between conventional presupposition and pragmatic force remain blurry.

  **Recommendation:** The current summary oversimplifies a complex, unresolved debate. It presents a pragmatic conclusion as established fact. For a balanced handout, you need to:
  1.  Acknowledge the lack of consensus and the existence of multiple families.
  2.  Present the key data (projection, non-cancellability *in standard uses*, reclamation) neutrally as problems *initially* challenging for simple semantic views.
  3.  Outline the core commitments of the main families (Semantic/TC, Expressivist, Pragmatic, Hybrid) *without* implying one has "won".
  4.  Use your cases (especially a) to illustrate the strengths/weaknesses of different approaches. Case (a) is particularly effective against rigid conventionalism.

  Would you like a draft of a more neutral summary paragraph incorporating these points?
