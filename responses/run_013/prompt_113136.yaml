prompt: |-
  i host a small podcast on philosophy of mind, and next week's guest is a philosopher who's spent her career defending cognitive penetration — she thinks your beliefs and desires can change what you literally see, not just how you judge what you saw. I know the standard fight (the confound catalogue from the vision side: memory, response bias, attention, strategy) so I dont want to spend the hour on whether it's real. Draft eight or nine questions, each with a follow-up keyed to the answer she's most likely to give, and let the sequence harden as it goes. I want at least: one on the criterion problem — when a subject's report changes, what is supposed to tell us the experience changed rather than the judgment, and does she think that demand is even coherent or just an artifact of how vision scientists test things; one on the memory-colour case, where people overshoot toward yellow when asked to make a banana picture look grey, and why the effects that survive replication tend to be the dull ones while the exciting social ones keep dying; one on whether attention counts as cognition, since if every effect runs through attention she wins trivially and loses interestingly; one on speech perception, where which phoneme you hear shifts depending on which word it would make — I gather that's the least controversial case, so I want to know if she's happy resting on it; one on the synchronic/diachronic split, i.e. whether perceptual learning is penetration or a deflationary rival; and a closer on the epistemic upshot — if someone's fear genuinely penetrates their perception, does that perception still justify anything, or does it just pass the badness of the fear along. Please don't ask her what perception really is, she gets that every time.
