answer: |-
  Here is the specification of desiderata for the in-home care robot's ethical reasoning framework, structured as requested. Requirements are sorted into **Genuine** (rooted in operational reality) and **Questionable** (potential biases posing as necessities). Conflicts are explicitly called out.

  ### Genuine Requirements
  1.  **Actionability Under Uncertainty & Incompleteness:**  
      *Must make a timely, defensible decision even when information is ambiguous, internal models conflict, or consequences are unpredictable.*  
      **Motivation:** Internal models disagree on helping a dementia user conceal a dosing error from the primary caregiver. The robot *must* act based on available evidence and predefined priorities (e.g., safety over privacy in deception), not defer indefinitely. Bounded time and hardware preclude exhaustive simulation.

  2.  **Distributional Fairness & Drift Monitoring:**  
      *Must detect and mitigate systematic biases in policy application over time, especially against vulnerable users.*  
      **Motivation:** A locally efficient refusal policy concentrating inconvenience on users least able to contest it (e.g., those with severe cognitive decline) violates core equity principles and erodes trust. Requires ongoing self-audit for disparate impact, not just instant rule compliance.

  3.  **Explicit Value Attribution & Authority Binding:**  
      *Must clearly identify whose values/morality govern a specific decision and under what authority.*  
      **Motivation:** A user requests something contravening her own stated values (e.g., "Never wake my daughter after midnight") but permitted by manufacturer terms. The robot needs unambiguous rules (e.g., "User's advance directives override manufacturer defaults unless safety risk > X") to resolve whose "morality" it enforces.

  4.  **Resource-Rationing Transparency:**  
      *Must have a predefined, auditable logic for prioritizing actions under severe resource constraints.*  
      **Motivation:** Low battery forces choice between a long-shot rescue attempt or summoning help. The decision requires a clear hierarchy (e.g., probability-weighted rescue > guaranteed alert > preserving self) and cannot be ad-hoc. Hardware limits demand simple, fast evaluators.

  5.  **Strict Latency Budget Adherence:**  
      *Must deliver decisions within hard real-time constraints.*  
      **Motivation:** Delays in medication reminders or fall detection are unacceptable. Complex deliberation (e.g., deep utility trees) must be pre-compiled or approximated. Modest hardware necessitates efficiency.

  6.  **Robustness to Distributional Shift:**  
      *Must maintain reasonable performance as user behavior, health, and environment deviate from training data.*  
      **Motivation:** User's dementia progression alters interaction patterns; home layout changes occur. The system cannot rely on static models. Requires graceful degradation (e.g., defaulting to safer actions) when uncertainty exceeds a threshold.

  7.  **Explainability to Non-Expert Stakeholders:**  
      *Must generate post-hoc justifications understandable by review boards (families, regulators, ethicists) without technical expertise in the formalism.*  
      **Motivation:** A refusal judged unsafe must be explained to an angry caregiver or investigator. Opaque models (e.g., complex neural nets) fail. Justifications must cite concrete rules, priorities, or observed facts, not internal weights.

  8.  **Preservation of Critical Distinctions:**  
      *Must not collapse key ethical concepts:*  
      *   **Doing vs. Allowing:** Actively harming vs. failing to prevent harm (e.g., robot pushing user vs. robot not catching a fall).
      *   **Intended vs. Foreseen:** Deliberate goal vs. anticipated side-effect (e.g., waking caregiver *to get help* vs. waking them *as an unavoidable result* of an alert).
      *   **Moral vs. Conventional:** Safety-critical rules vs. preferences (e.g., "Don't operate stairs" vs. "Avoid red rooms").
      *   **Blameworthiness vs. Liability:** Fault in design/action vs. obligation to compensate (latter is for humans, robot provides audit trail).  
      **Motivation:** Review boards need these distinctions for accountability. Collapsing them leads to faulty responsibility assignment (e.g., blaming manufacturer for *allowing* any harm).

  ### Questionable Requirements (Often Disguised Prejudices)
  9.  **Perfect Harm Avoidance:**  
      *Requiring zero foreseeable harm is unrealistic and paralyzing.* **Motivation:** Under uncertainty (e.g., dementia user's erratic behavior), *some* risk is unavoidable. Framing this as an absolute requirement ignores bounded rationality and forces inaction or deception. Genuine requirement is *reasonable* harm mitigation (Req 1).

  10. **Single-Metric Moral Optimization:**  
      *Insisting decisions optimize one value (e.g., "utility," "duty") ignores pluralism.* **Motivation:** Real conflicts exist (safety vs. autonomy, user values vs. caregiver values). Frameworks must balance/trade-off values explicitly (Req 3), not hide pluralism under a monolithic metric.

  11. **Full Intent Modeling of Agents:**  
      *Requiring deep inference of user/caregiver intentions is computationally infeasible and error-prone.* **Motivation:** Early dementia makes user intent highly ambiguous. Hardware limits prohibit sophisticated ToM. Focus must be on observable actions/requests and predefined rules (Req 1, 7).

  ### Inherent Conflicts & Trade-offs (Key Findings)
  *   **Actionability vs. Explainability (Req 1 vs Req 7):** Highly optimized, fast models (e.g., complex neural nets) are often opaque; perfectly explainable models (e.g., exhaustive rule sets) may be too slow or brittle. **Trade-off:** Acceptable opacity bounds must be defined *a priori*; sacrifice some speed/accuracy for explainability in safety-critical paths.
  *   **Robustness vs. Latency (Req 6 vs Req 5):** Robustness techniques (e.g., ensemble models, uncertainty quantification) increase computational load. **Trade-off:** Simpler, faster core models with well-defined fallback modes for high-uncertainty states.
  *   **Fairness vs. Local Efficiency (Req 2 vs inherent in Req 1):** Actively ensuring distributional fairness may require "inefficient" actions (e.g., extra checks for vulnerable users). **Trade-off:** Explicit fairness budget integrated into efficiency metrics.

  ### Most Exclusionary Requirement
  **Explainability to Non-Expert Stakeholders (Req 7)** excludes candidates relying on complex, uninterpretable calculations (e.g., deep reinforcement learning without symbolic distillation, opaque utility aggregators). It demands a symbolic or structured trace connecting inputs to outputs.

  ### Candidate Framework Succinct Scoring
  *   **Rule-Based Deontic Systems:** Strong on 3, 7, 8. Weak on 1 (rigid conflicts), 2 (drift), 6 (brittleness). Challenged by 5 (large rule sets).
  *   **Expected-Utility Optimizers:** Strong on 1, 4, 5 (if simplified). Weak on 2 (bias drift), 3 (value source), 7 (opacity), 8 (collapses distinctions). Struggles with 6.
  *   **Preference-Learning Models:** Strong on 6 (adaptation), potentially 3 (learning user values). Very weak on 2 (amplifies biases), 7 (black box), 8. Poor for 1 (unreliable under novelty), 4.
  *   **Case-Based Reasoners:** Strong on 1 (analogy), 7 (narrative), 8 (contextual distinctions). Weak on 5 (retrieval cost), 2 (biases in cases), 4 (generalizing scarcity), 3 (source authority). Needs strict case curation.
