answer: |-
  ## Research Proposal: The Fractured Arc of Moral Change – Why Some Revolutions Stall

  **Project Title:** Unfinished Business: Mapping the Decoupling of Practice, Intelligibility, and Scaffolding in Stalled Moral Revolutions

  **1. The Core Question & Its Novelty:**
  Why do some morally contested practices undergoing significant pressure (legal, social, discursive) terminate completely, while others stall, regress, or persist in altered forms? Crucially, this project argues that "abolition" is not a unitary event but the potential decoupling of three distinct processes:
  *   **(a) Cessation:** The actual stopping of the practice (e.g., formal legal prohibition).
  *   **(b) Loss of Intelligibility:** The erosion of the shared understanding *why* the practice existed or was justified (e.g., losing the sense that dueling preserved gentlemanly honor).
  *   **(c) Collapse of Scaffolding:** The dissolution of the material, institutional, and social structures enabling and sustaining the practice's meaning and operation (e.g., the networks, rituals, and economic dependencies surrounding footbinding).

  Existing explanations of "moral revolutions" (e.g., economic determinism in British abolition, Appiah's honor thesis, gradualist argument-diffusion models) effectively *presume* the convergence of (a), (b), and (c) in successful cases. They offer competing accounts primarily for **(a)** – *why cessation happened when it did* – while implicitly assuming **(b)** and **(c)** followed or were prerequisites. This conflation renders them inadequate for explaining *variation* in outcomes. They fit completed cases equally well precisely because the convergence obscures which element was truly causal. By shifting focus to **stalled or partial moral revolutions**, where **(a)** may occur without **(b)** or **(c)**, or vice-versa, this project creates genuine analytical leverage. The stalled cases provide the necessary variation to test *which* of these three elements – cessation, loss of intelligibility, or collapse of scaffolding – is the critical driver of durable change, and crucially, *how they interact temporally*.

  **2. The Empirical Wedge: Stalled & Partial Cases:**
  This project leverages stalled/incomplete cases as natural experiments where the decoupling of (a), (b), and (c) is observable:
  *   **The Death Penalty (US):** Near-universal cessation **(a)** in the developed world, *except* in parts of the US. Intelligibility **(b)** is contested (retribution vs. barbarism). Scaffolding **(c)** (legal protocols, execution methods, economic costs) persists robustly in retaining states but has largely collapsed elsewhere. Why the stall in specific jurisdictions?
  *   **Corporal Punishment of Children:** Legal prohibition **(a)** is widespread in schools (US divergence: banned in 33 states, legal in 17) but lags significantly in homes (legal in all 50 states + federal territories, though declining in practice). Intelligibility **(b)** is shifting dramatically ("discipline" vs. "abuse"), yet scaffolding **(c)** (parental rights norms, religious justifications, lack of alternative support systems) remains deeply entrenched, explaining the home/school divergence and partial nature.
  *   **The 13th Amendment Exception (Prison Labor):** The abolition of chattel slavery achieved cessation **(a)** and radically shifted intelligibility **(b)** regarding *race-based* ownership. However, the explicit "punishment" clause created a loophole. The **scaffolding (c)** of forced labor (penal systems, economic incentives for states/private contractors, racialized policing) adapted seamlessly into the convict lease system and modern prison labor, preventing true abolition. Intelligibility **(b)** around *coerced labor itself as inherently degrading* arguably never fully consolidated.

  **3. Methodology & Summer Plan:**
  The goal is a focused, comparative historical analysis tracing the sequence and interaction of (a), (b), and (c) in stalled cases vs. hints in completed ones (like dueling's scaffolding collapse preceding intelligibility loss).
  *   **Month 1: Case Refinement & Framework Calibration:** Finalize selection of 3 core stalled cases (prioritizing Death Penalty, Corporal Punishment, 13th Exception). Define clear, operationalizable indicators for tracking (a) Cessation (laws, prevalence data), (b) Loss of Intelligibility (discourse analysis - public arguments, elite justifications, media framing shifts), (c) Collapse of Scaffolding (institutional changes, economic shifts, supporting social networks/rituals). Develop initial hypotheses on expected sequences.
  *   **Month 2: Deep Dive Per Case:** For each case, conduct focused archival/documentary research: legislative/judicial records, major media sources, key organizational records, relevant social history scholarship. Construct detailed timelines mapping the emergence of pressure, key events in (a), shifts in (b) (using discourse indicators), and changes in (c). Pay special attention to periods of *stall or regression* – what held or reversed? Did (b) shift before (a)? Did (c) persist despite (a)? Was (a) achieved without (b) changing?
  *   **Month 3: Cross-Case Analysis & Theory Refinement:** Systematically compare the sequences and interactions of (a), (b), and (c) across cases. Identify common patterns or critical differences explaining stalling/fragmentation. Test hypotheses: Does persistence of scaffolding **(c)** predict stalls even after formal cessation **(a)**? Does a lag in loss of intelligibility **(b)** correlate with regression? Refine the conceptual framework based on findings.

  **4. Why This Approach Beats Revisiting Abolition:**
  Re-litigating British abolition on documents alone struggles to adjudicate between interest and honor explanations *because both factors likely changed concurrently*. The stalled cases act as "controls" where similar pressures exist but outcomes diverge, allowing us to isolate variables. Where did the "honor" discourse fail to take hold (e.g., death penalty retention states)? Where did economic interests *adapt* the scaffolding **(c)** to persist despite legal cessation **(a)** (e.g., prison labor)? The variation inherent in stalled cases provides the discriminatory power missing in analyses of completed revolutions.

  **5. Expected Outcomes & Success Metrics:**
  *   **Positive Outcome:** Development of a **diagnostic framework** for moral change. The project aims to show that for any pressured practice, assessing the *relative timing and robustness* of changes in (a), (b), and (c) provides superior explanatory/predictive power for its trajectory than monocausal theories. A key deliverable would be typologies of "stall patterns" (e.g., "Scaffolding Persistence Stall," "Intelligibility Lag Regression"). This is not a grand unified theory but a practical analytical toolkit.
  *   **Clear Failure Condition:** The project fails if analysis reveals that "stalled" is not a distinct phenomenon but merely a matter of *degree* or *timescale* on the same path as completed revolutions, showing the *same* sequence of (a)/(b)/(c) just slower. If the mechanisms explaining stalls are identical to those explaining completions (just weaker), the variation strategy collapses. Success hinges on finding *qualitatively different* configurations or sequences in the stalled cases.
  *   **Scope Management:** Focused on 3 US-centric cases (allowing manageable archival/document access within a summer). Depth over breadth in tracing the three processes. The deliverable is a detailed comparative analysis and refined framework, not a comprehensive history of each case.

  **6. The Meta-Question: What Are We Explaining?**
  This project implicitly challenges the notion of a singular "why" for a moral revolution. If we find, as hypothesized, that the interest thesis primarily explains the *timing of cessation (a)* and the scaffolding's persistence **(c)**, while Appiah's honor thesis better explains shifts in *intelligibility (b)*, then **both narratives can be simultaneously true but answering fundamentally different questions.** The "interest story" explains the material opportunity for cessation; the "honor story" explains the shift in social meaning enabling it to stick (or not). The stalled cases, where these elements decouple, make this visible. **The meta-payoff is reconceptualizing "explaining a moral revolution" not as finding *the* cause, but as mapping the *interdependent trajectories* of practice, meaning, and structure.** This reframes moral change as a multi-dimensional process, not a single event with a single explanation. The project's success would be demonstrating the necessity and utility of this fractured view.
