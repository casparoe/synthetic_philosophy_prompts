prompt: |-
  I retired from a career in chemistry a couple of years ago and have spent most of it since reading philosophy, mostly on causation, and I've gotten stuck on omissions. Can I just give you my gut verdicts case by case and have you tell me what principle, if any, they add up to?

  Not watering my neighbour's ficus while they were away, so it died: I don't think I caused it's death, I just let it happen, even though nothing else was in the way. Leaving the stirrer off during a reaction I was running, so the batch came out as the wrong crystal form: that one I do feel I caused, even though all I did was not do something. A referee not blowing the whistle while a player gets hurt: not a cause of the injury, I think, just a failure of the job he's paid for. A man who knows a child is drowning in the pond behind his house and stays in his chair because he'd rather the child were gone: definitely a cause of the death, feels almost more causal than if he'd pushed the kid in. Me not taking a statin and then having a heart attack at 63: I can't bring myself to say my not-taking caused it, it just left the odds where they were. Me not telling my brother about a nasty thing that runs in our family, and his kid getting it: that one I do feel I caused, even though it's the same shape of thing -- I did nothing and the odds went up. Not sending fifty quid to a charity that would have saved a kid I'll never meet: not a cause of that kids death at all, as far as my gut is concerned, and yet the pond case is the same structure.

  The half-baked principle I keep coming back to I've been calling the default setting idea: an omission counts as a cause only when it's a departure from what the situation was set up to do. That handles the stirrer and the referee nicely, since the safe state of a rig is something someone engineered, and the referee's job is to intervene. But a machine you have to keep holding down to keep it safe -- a dead-man's switch -- means doing nothing is the lethal option, and then my rule flips and says the operator caused the deaths by letting go, which feels right but for a reason I can't state. And nothing was set up at the pond, so the rule either says the man in the chair didn't cause anything, which I won't accept, or it says every setup is somebody's, which seems like a stretch.

  So: is there a principled story that gets most of these, or do I have to give some of them up, and which ones? Also, two seperate questions I'd like answered if you can. What does the best version of the principle say about two people both standing at the pond, each able to jump in, each not jumping because they assume the other will? And what does it say about a case where the omission doesn't produce an outcome but selects among ones that were already going to happen anyway -- say, not adding a seed crystal, so the solution crystallizes one way rather than another? That last one I can't even get an intuition about, so if your principle has a verdict there it's probably doing real work.
reasoning: |-
  Okay, let me start by really understanding what this retired chemist is grappling with. They've spent years diving into philosophy, especially causation, and now they're stuck on omissions. They've laid out several specific cases where their gut feelings about causation conflict, and they're looking for a unifying principle. 

  First, I need to unpack their examples. In the ficus case, not watering doesn't feel like causing death, just letting it happen. But in the stirrer example, omitting to turn it on feels like causing the bad crystal outcome. The referee not blowing the whistle isn't a cause of injury, but the man letting a child drown feels strongly causal. Not taking a statin isn't causing the heart attack, but not telling a brother about a hereditary risk does feel causal. Not donating to charity isn't causing a child's death, even though the pond case has a similar structure. 

  The key here is the asymmetry in their intuitions. Why does inaction feel causal in some cases but not others? Their "default setting" idea—omissions cause only when departing from a setup—partially works but falters with the pond case where there's no explicit setup. 

  I recall philosophical debates about omissions. Some theories like counterfactual dependence (if you had acted, the outcome would've changed) don't fully capture the nuances here. For example, not donating to charity meets counterfactual dependence (if donated, the child might've lived), yet it doesn't feel causal. So there's more at play. 

  The user's concept of "situational responsibility" seems crucial. Roles, duties, and expectations shape whether an omission is seen as causal. The stirrer operator has a role ensuring the reaction, so omitting feels causal. The referee has a duty to intervene, so not acting is a failure. The neighbor watering plants might be a favor, not a duty, so no causation. 

  But the pond case is tricky. No explicit role, yet the bystander's knowledge and capacity create a moral duty, making the omission feel causal. This ties into normative expectations beyond formal roles. 

  The dead-man's switch example is insightful. Normally, inaction is safe, but here inaction causes harm. The "setup" defines the default. So the principle must accommodate context-dependent defaults. 

  For the two bystanders at the pond: if both omit assuming the other will act, neither's omission alone is sufficient, but collectively they cause the outcome. The principle might assign contributory causation based on reasonable expectations of action. 

  The seed crystal case is fascinating. Not adding it selects an outcome. Here, the omission doesn't cause crystallization but influences which outcome occurs. This feels like causation by omission because the expected action (adding seed) was part of the setup to control the result. 

  Putting it all together: causation by omission hinges on normative expectations (roles, duties) and the context-dependent default. When an agent has a responsibility to act and their inaction deviates from the norm, causing harm, we see it as causal. The strength of this perception depends on the clarity of duty and the avoidability of harm. 

  This explains the pond case—strong duty due to proximity and knowledge. Charity lacks such immediacy. The statin isn't causal because the duty to medicate is personal and probabilistic, whereas family health info feels like a direct duty to warn. 

  So the refined principle: omissions are causal when there's a normative expectation to act, the agent can reasonably act, and the inaction foreseeably leads to harm. This handles most cases and provides answers to the additional scenarios.
answer: |-
  Your intuitions reveal a deep tension in omission-based causation, and your "default setting" idea is remarkably close to several sophisticated philosophical accounts (like Schaffer's "contrastive causation" or Moore's "duty-based" approaches). Here's a principled synthesis that captures *most* of your verdicts, identifies which intuitions might need refinement, and answers your follow-ups:

  ### The Core Principle: **Normative Expectation + Causal Salience**
  An omission is causally significant when:
  1.  **There exists a strong, context-specific normative expectation for Agent A to perform Act X** (based on role, duty, agreement, prior action, or capacity/unique opportunity).
  2.  **Act X was a feasible and salient intervention** with a high probability of altering the specific outcome.
  3.  **The omission deviates from the "default course" *within that specific normative context*** (not necessarily a physical default).

  ### Applying the Principle to Your Cases
  1.  **Not watering neighbor's ficus:**  
      *   **Verdict:** NOT a cause (matches your intuition).
      *   **Why?** Weak normative expectation (favor, not duty). No prior action setting a "default." Lack of watering is the background state. Low causal salience (many factors kill plants).
  2.  **Leaving stirrer off:**  
      *   **Verdict:** CAUSE (matches your intuition).
      *   **Why?** Strong normative expectation (operator's role/duty). Stirrer *on* is the "default course" for *this specific setup*. Omission is highly salient & feasible intervention directly tied to outcome.
  3.  **Referee not blowing whistle:**  
      *   **Verdict:** NOT a *direct* cause of injury, but a **failure of duty** enabling other causes (matches your intuition).
      *   **Why?** Strong normative expectation (job role). However, the injury is *directly* caused by players/actions; the omission *allowed* it. Causal chain is indirect (Salience is lower than direct action).
  4.  **Man letting child drown:**  
      *   **Verdict:** CAUSE (matches your strong intuition).
      *   **Why?** Overwhelming normative expectation (capacity + proximity + gravity of harm creates moral duty). *Intervening* becomes the salient "default" course *in this extreme situation*. Omission is highly feasible and directly linked to death.
  5.  **Not taking statin, heart attack:**  
      *   **Verdict:** NOT a cause, a **risk factor** (matches your intuition).
      *   **Why?** Normative expectation (self-care) is diffuse and probabilistic. Taking the statin isn't the "default course" in a strong contextual sense (many don't take them). Omission doesn't *cause* atherosclerosis; it fails to mitigate a pre-existing probabilistic risk. Salience is low.
  6.  **Not warning brother about genetic risk:**  
      *   **Verdict:** CAUSE (matches your intuition).
      *   **Why?** Strong normative expectation (familial duty, unique knowledge). Sharing critical info is the salient "default" within families facing known risks. Omission is feasible and directly linked to the *avoidable* harm (child getting the disease). It feels causal because the harm was *preventable* through a specific, expected action.
  7.  **Not donating £50 to charity:**  
      *   **Verdict:** NOT a cause (matches your intuition).
      *   **Why?** Normative expectation (general charity) is weak and non-specific. *Donating* isn't the salient "default course" for *you* regarding *that specific child*. Feasibility is high, but causal salience is extremely low (your £50 is one drop in a vast ocean; the causal chain is long and fragmented). The pond case differs due to **proximity, uniqueness of opportunity, and directness of effect**.

  ### Addressing the "Default Setting" Hurdles
  *   **Dead-Man's Switch:** Your principle *works* here. The normative context (safety system design) *defines* "holding down" as the default course for safety. Letting go *is* a deviation from that setup, causing death. The "setup" includes the designed safety protocol.
  *   **The Pond (No Setup):** This exposes the need for **normative expectation beyond formal setups**. The duty arises from the unique combination of **knowledge, capacity, proximity, and the gravity of the harm**. The "default" isn't physical; it's *moral*: in that situation, acting to save a life is the expected course. Your refusal to accept "no cause" is correct; the principle expands to include fundamental moral duties in extreme situations.

  ### Answering Your Follow-Up Questions
  1.  **Two People at the Pond (Each assumes the other will jump in):**
      *   **Verdict:** **Both** omissions are **causally contributory** to the death, but neither is **sufficient** alone.
      *   **Why?** Each has the same strong normative expectation (capacity, knowledge, proximity, gravity). Each omission is a salient, feasible intervention. The "default" expectation applies to *each* individually. However, the presence of the other introduces **overdetermination** – either *one* acting *could* have saved the child. We blame *both* for failing their individual duty, recognizing that the collective inaction caused the death. Philosophically, this is like "duplicative preemption" for omissions.

  2.  **Not Adding a Seed Crystal (Selecting Among Pre-Existing Outcomes):**
      *   **Verdict:** **YES, the omission is causally significant.**
      *   **Why?** This highlights the **contrastive** nature of causation. The normative expectation (in an experimental/industrial context) is often to *control* the outcome via intervention like seeding. *Adding* the seed is the salient "default" for achieving the *desired* crystal form. By omitting this feasible action, you *cause* the solution to crystallize in the *undesired* way *rather than* the desired way. You didn't cause crystallization *simpliciter*, but you caused *which specific form* crystallized by failing to intervene in the selection process. Your omission is a **difference-maker** for the specific outcome.

  ### Which Intuitions Might Need Refinement?
  *   **Referee vs. Pond:** The distinction is valid (direct cause vs. enabling omission), but the *intuition* that the pond feels "more causal" than pushing highlights that some omissions *can* carry immense causal weight equivalent to actions, driven by the strength of the duty violated.
  *   **Statin vs. Genetic Warning:** The key difference is the **specificity and preventability of the harm**. The statin manages diffuse risk; the warning could have directly prevented a specific, known harm to a specific person through a concrete action (e.g., testing, prevention). This aligns with the "salience" and "specific outcome" elements.
  *   **Charity Donation:** Holding this as *not* causal is consistent with the principle. Relaxing this intuition (e.g., Singer's arguments) would require weakening the "salience/proximity" requirement significantly, collapsing the distinction with the Pond case for many people. Your principle explains *why* the cases feel different.

  **In essence:** Your "default setting" idea is powerful, but needs grounding in **normative expectations** (role, duty, moral imperative) and **causal salience** (feasibility, specificity, directness) rather than just physical or engineered setups. This principle captures your core intuitions about responsibility, duty, and the difference between *allowing* harm within the normal course of events and *failing* to act when you uniquely *should* have, thereby making a crucial difference to a specific outcome. It affirms that omissions *can* be causes, but only under stringent conditions of expectation and opportunity.
