answer: |-
  ### **Brainstorming Pass: Mapping Philosophical Load to Narrative Tools**  
  *(Philosophical concepts → Closest narrative instruments)*  

  1. **Vast number of future persons** → *Offstage characters* (implied populations, like "the masses" in epic novels—felt but unseen).  
  2. **Equal moral weight for future/present** → *Dramatic irony* (audience knows futures characters ignore; their stakes *should* matter equally).  
  3. **Asymmetry: creating vs. harming life** → *Foreshadowing* (hinting at unrealized potential) vs. *stakes* (active threats). *No clean fit.*  
  4. **Weight of existential catastrophe** → *Denouement* (irreversible ending; the "final curtain").  
  5. **Our unique leverage over the long run** → *Inciting incident* (a small action with disproportionate consequences).  

  ---

  ### **Translation: A Novelist’s Reasoning on the Moral Shape of History**  
  > I see humanity’s story not as a series of standalone volumes but as an unfinished epic—one where the *true climax* lies centuries or millennia ahead. Our present era is merely the *first act*, a setup where every choice ripples toward that distant *denouement*. The *protagonist* isn’t just us, but trillions of offstage characters waiting in the wings, their unwritten lives shaped by our *scene* today. An existential catastrophe—like nuclear war or unaligned AI—wouldn’t be a tragic twist; it’d be a *premature ending*, snapping shut the book before the *arc* truly begins. And here’s the *dramatic irony*: we, the current players, hold unique power to avert this. We’re at a *narrative bottleneck*: a single *inciting incident* (e.g., funding AI safety) could *foreshadow* salvation for countless future *characters*. To prioritize the present over the far future? That’s like burning the manuscript’s final chapters for kindling. The *earned resolution* demands we guard the *throughline*—no matter the cost now.  

  ---

  ### **Residue Report: What Survived, What Warped, What Vanished**  
  **Method:** Rigorous term-by-term autopsy. Flagged distortions with `⚡`, untranslatables with `⊘`.  

  | Philosophical Term          | Narrative Translation                     | Fidelity Verdict                                                                 |
  |-----------------------------|------------------------------------------|----------------------------------------------------------------------------------|
  | **Future persons**          | Offstage characters                      | `⚡ Distortion`: Characters imply potential *presence*. Philosophy treats them as *moral patients* regardless of actualization. |
  | **Equal moral weight**      | Dramatic irony                           | `✓ Clean`: Audience knowledge ≈ moral urgency. Carries the "they *should* matter" weight. |
  | **Existential catastrophe** | Premature ending / final denouement      | `✓ Clean`: Irreversible narrative collapse fits perfectly.                       |
  | **Our unique leverage**     | Inciting incident at a bottleneck        | `✓ Clean`: Small pivot, vast consequences—naturally novelistic.                 |
  | **Creating vs. harming**    | Foreshadowing (creation) vs. stakes (harm) | `⚡ Severe Distortion`: Narrative can’t equate *failing to introduce* a character with *harming* one. The asymmetry collapses. |
  | **Aggregation of lives**    | "Trillions of offstage characters"       | `⚡ Distortion`: Novelists distill masses into symbols (e.g., "the oppressed masses"). But *astronomical scales* turn individuals into abstract sums—antithetical to narrative empathy. |

  ---

  ### **Candidate Residues: Core Clashes**  
  1. **Can a never-existent person be a "character"?**  
     - `Verdict`: Narrative says no. Characters require *presence* (a scene, voice, desires). Philosophy treats "possible persons" as moral objects.  
     - `Indictment`: **Both**. Your framework can’t represent what isn’t actualized, *but* philosophy’s claim strains intuition. A "character" with no scenes is a ghost.  

  2. **Harm vs. Non-Creation asymmetry**  
     - `Narrative Analogue`: None. Stories thrive on *actions* (harm) and *omissions* (failing to save). But *failing to create* a life has no emotional analogue. We mourn lost potential (e.g., a child stillborn), but never grieve *unconceived* lives.  
     - `Veracity Check`: **Philosophy’s burden**. The asymmetry is counterintuitive *because* narrative is constitutively anthropocentric. Stories can’t lament what never was.  

  3. **Distrust of aggregation**  
     - `Craft Wisdom`: **Hard-earned truth**. Novelists know summary murders nuance—"a billion deaths" is a statistic, not tragedy. Longtermism’s reliance on scale *is* a vulnerability.  
     - `Prejudice?`: Partial. Your distrust guards against emotional dilution, but philosophy *requires* aggregation to argue its case. Neither wrong—just divergent purposes.  

  ---

  ### **The Untranslatable Core**  
  **What cannot cross**: The *moral weight of non-actualized possibility*. Narrative craft deals in *manifested* lives, choices, and consequences. Strong longtermism’s core axiom—that *merely possible* future people impose obligations—cannot be stated in your vocabulary without smuggling in philosophy’s assumptions. This isn’t your framework’s defect; it exposes longtermism’s **radical indeterminacy**. A "character" who never exists is less a figure in a story than a shadow on the cave wall—a shape without substance.  

  **Final Verdict**: The translation holds where philosophy aligns with lived human stakes (catastrophe, leverage, irony). It fractures on philosophy’s speculative edges (non-creation, aggregation). Your vocabulary’s "defect" is its fidelity to the concrete—which is precisely why it distrusts longtermism’s grand abstractions. The residue isn’t lost meaning—it’s a warning.
