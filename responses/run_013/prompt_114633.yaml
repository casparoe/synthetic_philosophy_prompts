prompt: |-
  Longtime reader of the rationalist blogs, first time posting something like this. There's a move I keep running into, mostly from the consciousness crowd, and I don't have a word for it. Someone leans hard on a piece of vocabulary they clearly need — 'experience', 'what it's like', 'qualia' — but the moment you ask whether the thing is actually real they do a shuffle: 'I'm not making a metaphysical claim, it's just a useful way of talking / we need some word for it / the reports have to be about something.' Ok. Except then the entire explanation runs on teh word — the zombie differs by lacking the experience, the blindsight patient is missing the experience, the anaesthetised brain isn't having any — and if you strip it out there's no story left. Say 'so you're a realist about experience after all' and they look at you like you've misread them. I've seen the same shape with free will ('not saying it exists, I just hold people responsible'), with numbers, with God.

  Does this have a name? My instinct is fictionalism, but a fictionalist usually cops to the pretense or admits the thing is false, whereas this person seems to want the explanatory payoff of realism and the immunity of neutrality at the same time, which can't both be honest. If the real answer is 'that's just fictionalism/instrumentalism, you're overthinking it', then give me the carving — how it's different from those, from the old 'as if' philosophy, and from Dennett's intentional-stance line, where he at least gestures at what makes a stance track a real pattern. And if nothing fits, coin a term and tell me where its edges are, because 'they're a realist in denial' doesn't feel quite right either.
reasoning: |-
  Okay, let's tackle this user's query. They're describing a recurring move in philosophical discussions, particularly around consciousness, where someone relies heavily on a term like 'qualia' but denies making any metaphysical claims about it. The user feels that the person is trying to have it both ways—using the term for explanatory power while avoiding commitment to its reality. They want to know if there's a name for this maneuver and how it differs from positions like fictionalism or instrumentalism.

  First, I need to unpack the user's scenario. They mention examples from consciousness debates, free will, numbers, and even God. The core issue seems to be a tension between the use of a concept as if it's real and the denial of its ontological status. The user is frustrated because removing the term leaves the explanation empty, yet the person insists they're not making a metaphysical claim. 

  The user's explicit request is for a term that labels this move. But their deeper need might be understanding how to engage with or counter such arguments. They might be seeking clarity in debates where opponents seem evasive. Terms like fictionalism or instrumentalism come to mind, but the user notes that fictionalists admit the pretense, whereas here the person avoids that admission.

  Looking at philosophical concepts, compatibilism for free might fit the free will example, but not consciousness. Neutral monism or non-reductive physicalism could be relevant, but they don't capture the evasion aspect. The key is the person's insistence on neutrality while functionally relying on realism. 

  The best fit might be "quasi-realism" as used by Simon Blackburn. Blackburn's projectivism explains moral talk as expressing attitudes while mimicking realist discourse. Applying this to consciousness: someone uses 'qualia' as a projective concept but denies ontological commitment. This explains the shuffle—they're not realists, but their language acts as if they are. 

  However, quasi-realism is specific to Blackburn's metaethics. The user might need a broader term. "Conceptual instrumentalism" could work, emphasizing utility without ontology. Or "methodological dualism," highlighting the practical separation from metaphysics. 

  The user might also appreciate distinguishing this from Dennett's intentional stance. Dennett grounds stances in real patterns, whereas this move lacks that grounding. The evasion of ontological commitment is what sets it apart. 

  I should consider if the person is just inconsistent. But the user feels "realist in denial" isn't accurate. The proposed terms capture the functional use without metaphysical commitment, even if it borders on incoherence. The user's deeper need is likely to articulate this inconsistency in debates, so providing precise terminology and distinctions empowers their critique.
answer: |-
  This is a **brilliantly articulated** frustration, and you've nailed a very real pattern in philosophical discourse, especially around consciousness. You're right that "fictionalism" or "instrumentalism" feel close but not quite right. The core issue is the **explanatory reliance combined with ontological evasion**. Here's a breakdown of options and a proposed term:

  1.  **Near Misses & Why They Don't Quite Fit:**
      *   **Fictionalism:** As you note, fictionalists *explicitly* state the concept is useful fiction ("We speak *as if* numbers exist, but they don't"). The move you describe avoids this admission of fictionality. They want the *utility* without the *confession*.
      *   **Instrumentalism:** This focuses on concepts as tools for prediction/organization, not descriptions of reality ("Force is a useful calculation tool, not necessarily a real thing"). Again, instrumentalists are usually upfront about the tool-status. The "consciousness crowd" move often *feels* like it's describing something real *through* the tool, relying on its seeming referent.
      *   **Compatibilism (for Free Will):** This is a substantive position (free will *is* compatible with determinism), not an evasion. The "I just hold people responsible" move *can* be compatibilist, but often feels like a dodge of the deeper metaphysical question *about* the thing responsibility is supposedly tracking.
      *   **Non-Reductive Physicalism / Neutral Monism:** These *are* metaphysical claims (consciousness is real but not reducible to neurons; or mind/matter arise from a neutral substance). The move you describe explicitly *disavows* making a metaphysical claim, even if it functionally acts like one of these.
      *   **Dennett's Intentional Stance:** Dennett *does* ground stances in real patterns discernible from the physical stance. He offers an ontology of patterns. The move you describe lacks this grounding gesture – the "useful way of talking" isn't explicitly tied to *what* pattern it tracks in the underlying reality beyond the reports themselves.

  2.  **The Core Problem: Explanatory Indispensability with Ontological Evasion**
      The key tension you identify is:
      *   **Indispensability:** The concept (Experience, Qualia) is presented as *explanatorily indispensable* for making sense of phenomena (zombies, blindsight, anesthesia). Remove it, and the explanation collapses. This strongly suggests a realist commitment (if it's doing real explanatory work, it likely refers to something real).
      *   **Evasion:** When pressed on the ontological status ("Is it *real*?"), the proponent retreats to pragmatics ("just a way of talking," "useful," "about the reports"). They refuse to endorse the realism the indispensability implies.

  3.  **Proposed Terms & Their Edges:**
      Here are terms capturing different nuances of this move:

      *   **Quasi-Realism (Projectivist Version):** **Best overall fit.** Borrowed from Simon Blackburn's metaethics. It describes the practice of talking *as if* something is real (experiences, moral properties), projecting our attitudes or modes of understanding onto the world, while denying that we are committed to the *independent existence* of the projected entities. The "shuffle" is key: "I'm not saying experience *is* a real thing out there; I'm saying our *way of encountering the world* forces this *mode of description* upon us, and it's indispensable for understanding." **Edge:** True quasi-realists (like Blackburn) develop sophisticated justifications for why this projection is legitimate and not mere error. The move you describe often lacks this justification, feeling more like an *unjustified* projection or a dodge.
      *   **Conceptual Instrumentalism:** Emphasizes the *tool* aspect while downplaying the *referential* aspect. "Experience is an indispensable conceptual tool for navigating and explaining first-person reports and behavioral contrasts; its reality isn't the point, its utility is." **Edge:** Pure instrumentalism should be ontologically neutral. The reliance on the term to *do* explanatory work (differentiating zombies, explaining blindsight deficits) often smuggles in a *de facto* realism that pure instrumentalism would avoid. The tool is being used *as if* it picks out a real difference-maker.
      *   **Methodological Dualism (or Pluralism):** Focuses on the *level of description*. "We *must* use the language of experience at the phenomenological level to describe certain phenomena accurately, even if we believe everything is ultimately physical. Demanding a metaphysical commitment at the phenomenological level is a category error." **Edge:** This can be legitimate (e.g., using "desire" in psychology without daily neural reduction). However, it becomes problematic when the phenomenological level is leveraged to *argue against* physicalism (e.g., zombies) or when the *explanatory gap* itself relies on the seeming reality of the phenomenological level, while simultaneously disavowing commitment to it.
      *   **Ontologically Shy Realism:** More descriptive than technical. Highlights the core behavior: acting like a realist about X ("Zombies lack X", "Blindsight lacks X") but being unwilling to explicitly affirm "X exists as a fundamental or irreducible property/entity." **Edge:** It directly names the evasion. It might imply incoherence.

  4.  **Why "Realist in Denial" Feels Close but Not Quite:**
      It *might* be true for some individuals (cognitive dissonance). However, proponents often genuinely believe they are avoiding metaphysics. They see themselves as pragmatists or focusing on the "manifest image." The problem is that their *explanatory practice* contradicts this neutrality. They aren't necessarily *lying*; they might be conceptually confused or failing to see the implications of their own reliance.

  **Conclusion & Recommendation:**

  **Quasi-Realism (specifically in a projectivist sense)** is the most precise existing term capturing the core move: **talking *as if* X is real, projecting a way of understanding onto the world, treating X as indispensable for explanation and differentiation, while explicitly disavowing ontological commitment to X as a mind-independent entity.**

  *   **Edges:** It's distinct from fictionalism because it claims the discourse is *legitimate* and perhaps unavoidable, not a useful falsehood. It's distinct from instrumentalism because the "as if" realism is woven into the explanatory structure, not just a predictive tool. It's distinct from Dennett because Dennett grounds his stances in patterns discernible from other stances; the pure quasi-realist move often lacks this grounding beyond the phenomenal level itself.
  *   **Why it fits your examples:**
      *   **Consciousness:** "We *must* use 'what it's like' to describe the difference. No metaphysical claim!" (But the difference *is* the explanatory core).
      *   **Free Will:** "I'm not saying contra-causal freedom exists, I'm just saying we *hold people responsible*." (But "responsibility" functionally relies on a concept resembling free will).
      *   **Numbers:** "Math is just a useful formal system." (But then uses number-talk indispensably in physics explanations).
      *   **God:** "I'm not saying God exists, it's just a useful symbol/way of talking about the ground of being/meaning." (But then relies on "God" to explain purpose, morality, or existence itself).

  The frustration is justified because this move often tries to have its cake (explanatory power relying on the *seeming* reality of X) and eat it too (avoiding any commitment when challenged). Calling it out as **Quasi-Realism** or **Conceptual Projection** highlights this tension and forces the proponent to either justify the projection (like Blackburn tries to do for ethics) or admit their explanation relies on assumptions they refuse to own.
