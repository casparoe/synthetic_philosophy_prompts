  Here's a joke crafted for your seminar:

  **Setup:**  
  A stern Prior hears a commotion and finds Brother Francis chuckling in the cloister.  
  "Francis! What's so amusing?"  
  "Oh, Prior," Francis gasps between laughs, "I just told Brother Paul the Abbot was away visiting the lepers!"  
  "Francis! That's a monstrous lie!" the Prior thunders. "The Abbot is right here in his study!"  
  "Ah, but Prior," Francis beams, wiping a tear of mirth, "I *said it like a joke!*"

  **Punchline:**  
  "Ah, but Prior, I *said it like a joke!*"

  ---

  **Why it's funny (for the right reason):**  
  1.  **Exploiting the Joke Exemption:** The humor hinges entirely on Augustine's specific exemption for jokes based on tone and lack of intent to deceive. Francis weaponizes this exemption to deliver a blatant falsehood, claiming the jocular tone itself absolves him of lying, regardless of the untruthful content.  
  2.  **Tension of Tone vs. Content:** The core comic tension arises from the absurdity of using the *manner* of delivery (a laugh) as a moral loophole to escape culpability for a clear deception, highlighting the potential vulnerability in Augustine's reliance on subjective "evidence of a single heart" (the tone) as the defining criterion over the factual falsehood.  
  3.  **Intelligible & Rewarding:** Anyone understands a monk telling a fib and trying to wriggle out of it by claiming it was "just a joke." Those familiar with Augustine immediately recognize the precise doctrinal point being twisted for comedic effect – the exemption itself becomes the punchline's mechanism.
