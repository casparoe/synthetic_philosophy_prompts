prompt: |-
  I write fiction, and I have run up against a distinction I cannot name. In the novel I am finishing, a housekeeper is never once prevented from doing anything: she keeps her own hours, her own money, her own friends. Yet she has arranged her whole life around the temper of the man whose house it is — she says nothing when he has been drinking, leaves before he tires, and would not contradict him before guests. A second character, a soldier's wife in the same town, is told by law where she may live, how much of her husband's pay she may keep, and when she may travel; she also has a voice in the assembly that writes those laws. I am sure the housekeeper is the less free of the two, and sure that this has nothing to do with how many of her options are blocked. But I cannot say what the difference is. Freedom as nobody standing in your way does not capture it, and freedom as governing yourself seems a different and far larger demand. Is there an established name for the unfreedom that consists in being at another's mercy rather than in being obstructed, and what does it add to those two ideas? I want its edges, not only its label. If the man is kind and would never interfere, is she still unfree? If the power belongs to no person but to a custom nobody enforces, does it still count? If she does not feel it, does that matter? And is this one thing, or am I conflating several?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a fiction writer struggling to name a specific type of unfreedom experienced by their character, a housekeeper. The housekeeper isn't legally restricted like the soldier's wife, but her life is shaped around another person's temper. The user wants to capture this nuanced lack of freedom that isn't about blocked options but about being at someone's mercy.

  First, I need to understand the core distinction they're highlighting. The housekeeper's autonomy is constrained by the potential for interference, even if it doesn't happen. This reminds me of Isaiah Berlin’s concepts of negative and positive liberty. Negative liberty is about absence of obstacles, which the housekeeper seems to have. Positive liberty involves self-governance, which might not fully apply here. But the key point is the *dependency* on the man's will, regardless of whether he exercises it. That’s where Berlin’s idea of domination comes in—freedom as non-domination.

  Then there's Philip Pettit’s take on republican freedom. He emphasizes non-domination: even if the dominator doesn't act, the mere capacity to interfere arbitrarily creates unfreedom. This fits the housekeeper's situation. She’s free in action but not in status because her choices are subject to another's whim. The soldier's wife, despite legal restrictions, has a voice in the system, which might offer some protection against arbitrary power.

  Next, considering the user's sub-questions. If the man is kind and never interferes, is she still unfree? Pettit would say yes, because the potential for arbitrary interference remains. The structure of dependency itself is the issue. Similarly, if the power comes from unenforced custom, it still counts if it creates a relationship where one could impose their will arbitrarily. The housekeeper internalizes this dynamic, adjusting her behavior preemptively, which is a form of unfreedom even without conscious resentment.

  The user also asks if this is one concept or several. It seems unified under non-domination, but elements like internalization and structural factors add layers. The housekeeper’s unfreedom is relational and structural, whereas the soldier's wife faces legal constraints but with democratic recourse. 

  I should also think about how this applies to storytelling. The user needs terminology that clarifies the tension between apparent freedom and underlying dependence. Terms like "relational unfreedom" or "arbitrary dependency" might resonate. Highlighting the anticipatory behavior shows the psychological impact, which adds depth to the character.

  The deeper need here might be to articulate a subtle power dynamic that’s pervasive but invisible. The user wants to validate the housekeeper’s experience as genuinely unfree despite societal perceptions. Providing philosophical frameworks gives them tools to explore themes of autonomy and control without explicit oppression. It also helps in contrasting characters meaningfully, enriching the narrative’s social commentary.

  I should ensure the explanation covers all sub-questions, using the theories to address kindness, custom, and lack of resentment. Emphasizing that unfreedom here is about the capacity for arbitrary power, not its exercise, is crucial. The housekeeper’s adaptations are symptoms of this structure, making her unfreedom palpable in her constant self-regulation.
answer: |-
  This is a brilliantly observed distinction, and you're right that classical "freedom from interference" (negative liberty) and "freedom to self-govern" (positive liberty) don't quite capture the housekeeper's situation. The established concept you're seeking is **Domination (Non-Domination Freedom / Republican Freedom)**.

  Here's the breakdown, addressing your specific questions:

  1.  **The Core Concept: Domination (Non-Domination Freedom)**
      *   **Definition:** Freedom as the absence of arbitrary power held by others *over* you. It's not about whether power is *used* (interference), but whether it *exists* and could be used arbitrarily. Your freedom depends on your *status* relative to others, not just your current actions.
      *   **Key Thinker:** Philip Pettit (drawing on classical republican thought from Rome, Machiavelli, etc.) is the most prominent modern proponent, contrasting it sharply with Berlin's negative liberty.
      *   **The Housekeeper:** She lives under the man's *arbitrary will*. He *could* dismiss her, criticize her friends, demand different hours, humiliate her before guests – and crucially, he could do so without justification or recourse that *she* controls. Her entire life is structured *in anticipation* of this potential arbitrary power. Her "options" exist only *on his sufferance*, even if he's currently indulgent. **She is free *to act* (negative liberty), but she is not free *from the master* (non-domination).** Her freedom is precarious and dependent.
      *   **The Soldier's Wife:** While subject to specific, restrictive laws (limiting negative liberty), those laws are (in theory) non-arbitrary. They are publicly known, apply generally (to her class/status), and crucially, **she has a voice in the assembly that makes them.** This voice provides a crucial check against *arbitrary* power exercised over her *as an individual*. The power she is subject to is institutional and (ideally) constrained by rules and her potential participation. Her unfreedom is specific and rule-bound, not subject to an individual's whim.

  2.  **Addressing Your Specific Questions:**
      *   **"If the man is kind and would never interfere, is she still unfree?"**
          *   **Yes, according to non-domination theory.** Freedom requires the *structural absence* of arbitrary power, not just its non-exercise. Her well-being is utterly dependent on his *continued* kindness, which he could revoke arbitrarily at any moment. She lives *at his mercy*, even if that mercy is reliably granted. Her lack of resentment doesn't change the power imbalance. (Contrast: the soldier's wife might resent the laws, but they aren't subject to a single person's mood swing).
      *   **"If the power belongs to no person but to a custom nobody enforces, does it still count?"**
          *   **It depends on the nature and force of the custom.** If the custom is so deeply ingrained that it *effectively* dictates behavior and renders individuals vulnerable to social sanction (ostracism, loss of reputation/livelihood) without any individual needing to actively enforce it, **then yes, it can be a form of domination.** The "power" resides in the collective expectation and potential for diffuse social punishment. It's less personal but still an arbitrary (unaccountable) power shaping lives. If it's a weak custom easily ignored without consequence, then it might not rise to domination.
      *   **"If she does not feel it, does that matter?"**
          *   **For the *existence* of domination? No.** Domination is an objective relationship of power, not a subjective feeling. A slave conditioned to love their master is still dominated. The housekeeper's internalization of her role, her lack of resentment, or even her perception of freedom doesn't alter the fact that her well-being hinges entirely on the arbitrary will of another. However, **for the *experience* and *impact* of unfreedom, her feelings matter immensely to the story.** Her lack of overt resentment could make her situation more poignant or terrifying, highlighting the insidious nature of domination. It speaks to the power of socialization and adaptation to unjust structures.
      *   **"Is this one thing, or am I conflating several?"**
          *   **It's primarily one core concept (domination), but it inherently involves several facets:**
              *   **Arbitrary Power:** The power held can be used without justification or constraint by the one subject to it.
              *   **Dependency:** The dominated person's vital interests (livelihood, shelter, safety, reputation) depend on the goodwill of the dominator.
              *   **Vulnerability:** The dominated person is exposed to potential interference or harm without recourse.
              *   **Pre-emptive Adaptation:** This is the *behavioral consequence* of domination – shaping one's life to avoid provoking the arbitrary power, even without explicit commands or blocks (as your housekeeper does).
          *   You're not conflating separate things; you're describing the *manifestations* and *effects* of this single relational structure of power (domination).

  3.  **What it Adds to Negative and Positive Liberty:**
      *   **Beyond Negative Liberty:** Negative liberty asks, "How many doors are open *right now*?" Domination asks, "Who holds the keys to *all* the doors, even the open ones? Can they lock them arbitrarily?" Negative liberty focuses on current absence of interference; domination focuses on the *ever-present potential* for arbitrary interference due to power imbalance.
      *   **Distinct from Positive Liberty:** Positive liberty asks, "Am I master of myself? Can I achieve my true potential/goals?" This is often a bigger, more philosophical question about self-realization. Domination is more concrete: "Am I subject to the arbitrary will of another specific person or entity?" You can be free from domination (e.g., a citizen in a just republic) without necessarily achieving profound self-mastery (positive liberty). Conversely, you might delude yourself into feeling self-mastered (positive liberty) while living under domination (like the "happy" housekeeper).

  **Terms for Your Novel & Conceptual Edges:**

  *   **Core Term:** **Domination** (or **Arbitrary Dependency**).
  *   **Her State:** **Subject to arbitrary power, Living at another's mercy, Precarity of status, Conditional freedom.**
  *   **The Relationship:** **Mastery/Servitude dynamic (even if informal), Power imbalance, Vulnerability to arbitrary interference.**
  *   **Her Strategy:** **Pre-emptive deference, Anticipatory obedience, Navigating the master's whim, Self-censorship born of dependency.**

  **In Essence:** The housekeeper's unfreedom isn't measured by locked doors, but by the fact that the man holds all the keys to *her* life, and he could lock any door, at any time, for any reason (or none), simply because he can. The soldier's wife faces locked doors, but the locks have known combinations (laws), and she has a say in designing new locks or changing the combinations (voice in the assembly). Her unfreedom is constrained and institutional; the housekeeper's is personal and absolute. This distinction is crucial and powerfully articulated through your characters. Domination captures the suffocating, personal, anticipatory nature of the housekeeper's existence perfectly.
