prompt: |-
  ok so I've been going down a rabbit hole on this guy Galen Strawson's basic argument and I think I finaly get it, tell me if this is right: you do what you do because of the way you are, so to be *really* responsible for what you do you'd have to be responsible for the way you are, but you can't be responsible for the way you are (you didn't build your own character, and any attempt to explain how you did just pushes the question back a step forever), so nobody is ever really responsible for anything. And the part that gets me is he says this holds whether determinism is true or not, and he isn't even saying we should stop blaming each other, just that the blaming was never actually fair.

  Anyway my employer just sent round a new "accountability framework" and the whole thing reads like someone in People Ops had the exact same realisation and then just... kept going. Can you write that memo for me? A full company-wide email from People Ops, deadpan the whole way, maybe 600 words, taking the argument completely seriously and following it through every part of the policy — the performance reviews, the disciplinary process, the bit where they have to explain what happens to someone who keeps doing the thing anyway, and whether anyone can ever be promoted. It should be funny to someone who's actually read the argument, and it can't cheat: every clause should really follow from the argument, no winking at the reader, and don't let it turn into some cosy everybody-gets-along ending, because that's the boring version.

  Start with the memo itself, no intro.
