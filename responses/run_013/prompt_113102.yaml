prompt: |-
  I'm about two thirds through a historical novel -- 1790s, a woman who inherits a share in a plantation and spends the whole book not dealing with it -- and I've been having the same dinner argument for a year now, so I want to actually settle what I think. It's the man-of-his-time thing, the one that shows up whenever Churchill or Columbus comes up and everyone's uncle says you can't judge them by today's standards, and someone else says there were always dissenters so nobody gets off. My brother-in-law thinks it's a closed question. My friend Priya thinks it's a closed question the other way. I keep discovering I have a rule I can't state, and I suspect it's really two rules fighting, with one of them doing all the work. I don't want sources or reading lists, I just want to know what my gut is running.

  Here's what my gut does, case by case. Halvard Renn, an 18th century naturalist, buys two enslaved servants as a young man, keeps them thirty years, and his notebooks say plainly that the trade is monstrous; he frees them in his will with a pension. My gut: guilty, and the notebooks make it worse rather than better -- knowing should count against him. The abbess, 13th century, has a girl's hand struck off for stealing from the altar, and nobody in her world would have blinked. My gut: not guilty, and I feel no pull to say otherwise, which bothers me. The anatomist, 1600s, buys corpses off the hangman and dissects them -- wrong then and now -- but people did object, loudly, on grounds of desecration rather than consent. My gut: not guilty, even though dissent existed. Seth Craddock, a Victorian mill owner, employs nine year olds, lobbies *against* the Factory Acts, and his diary admits the work is degrading. My gut: guilty twice over, for knowing and for fighting the remedy. Augustine Pell, a suffragist who campaigned for women's votes and also wrote that Black men shouldn't have the vote, and whose own co-campaigners broke with him over it. My gut: guilty -- and notice this looks exactly like the anatomist, dissent existed and here it counts. Nils Bohm, a slave-port merchant, whole city built on the trade, no abolitionist argument ever reached him, no sign he ever thought about it, no alternative he could have run. My gut: I want to excuse him and I dont; guilty, which seems to contradict the abbess and the anatomist both. Casimir Roth, who in 1902 signs off on a punitive expedition that kills a few thousand people, and who in 1911 very probably stops a European war. My gut: the ledger counts, I can't just call him a murderer -- but when I run the same ledger on Craddock (his mills clothed a nation cheaply) I hate the answer, so either the ledger works for both or neither. The abolitionist in 1740: I admire him enormously, but if being of your time excuses the slaveholder, it should excuse the man who wasn't -- he was just lucky in his birth and his reading. I want the excuse available to one and not the other and I can't see how. And then the one I keep going back and forth on, which is my own protagonist: Hester Aldworth puts a sympathetic enslaved character in her 1792 novel, so she clearly *had* the concept, and she lives on the money till she dies and frees nobody. Half the time she's the worst of the lot, half the time she's just me with worse lighting.

  The principle I'd tentatively write down is this: someone is guilty of a wrong only if it was visible as wrong under some description available in their own time, and only if they had a live option to do otherwise -- but if they actually saw it, or had the evidence in front of them and looked away, the defence is void. Does that get all of the above, or do I have to drop one, and if so which one and why that one rather than the abbess? I'd like two or three candidate principles stated precisely enough that I could tell them apart on a case I haven't given you, so please also hand me one new case that splits them, and say what each does with pure profit-taking -- someone who never lifts a finger, just cashes the cheques. Then finish with a single line in exactly this form and nothing after it: \answer{name of the principle you'd defend; the one of my verdicts it costs me}
reasoning: |-
  Okay, the user is grappling with a moral dilemma about judging historical figures. They're reading a historical novel set in the 1790s and have been debating this "man of his time" argument for a year. They don't want sources or reading lists—just to clarify their gut feelings. They’ve described several historical cases where their intuition assigns guilt or innocence, but they’re struggling to find a consistent principle. 

  First, I need to understand their examples. Halvard Renn knew slavery was monstrous yet kept slaves—guilty. The 13th-century abbess who ordered a hand cut off—not guilty. The anatomist using corpses—not guilty, even though there was dissent. Seth Craddock exploited children and fought reforms—guilty. Augustine Pell advocated for women's suffrage but opposed Black suffrage—guilty. Nils Bohm, a slave trader unaware of abolition—guilty, which conflicts with the abbess and anatomist. Casimir Roth authorized violence but prevented war—ledger balances. The abolitionist in 1740 is admirable, but why isn't he just "lucky"? The protagonist Hester Aldworth is torn between complicit and a product of her time.

  The user proposes a principle: guilt requires the wrong was visible in their time and they had options to act, but if they personally saw it and ignored it, no defense. Does this cover all cases? Let me test it. For Renn, he knew it was wrong, so guilty—fits. The abbess—no visible wrong at the time, not guilty—fits. Anatomist—dissent existed, but on desecration, not consent; if consent wasn't a visible issue, not guilty—fits. Craddock knew and opposed reforms—guilty. Pell saw dissent (colleagues broke with him) but persisted—guilty. Bohm—no visible wrong? But the user feels guilty, so maybe the principle fails here. Roth—the ledger isn't covered. The abolitionist—the principle doesn't address admiration vs. "luck." Hester—she had the concept (sympathetic character) but didn't act, so guilty under the principle.

  The user’s principle might fail on Bohm because, in their gut, he's guilty even without visible wrong or personal awareness. Also, Roth’s ledger isn't handled. The abolitionist’s admiration conflicts with the idea that being "of the time" should excuse everyone equally.

  Now, I need to propose alternative principles. The user wants precise ones that can split on new cases. Let me formulate three candidates:

  1. **Principle of Salient Alternatives**: Focuses on whether the figure faced a live cultural alternative to their actions. Bohm had no salient alternative, so not guilty—but user feels guilty, so conflict.
  2. **Principle of Moral Opportunity**: Adds that if the evidence was personally available and they avoided it, they’re culpable. This makes Bohm guilty if he could have known but chose ignorance. Fits user’s gut on him.
  3. **Principle of Unjust Enrichment**: Emphasizes benefiting from harm, regardless of awareness. Makes Bohm guilty and pure profit-takers guilty. But then the abbess might be guilty too? User said not guilty, so conflict.

  For a new case: a tax collector in an oppressive regime who doesn't question the system, just profits. Salient Alternatives: not guilty (no alternative). Moral Opportunity: guilty if they avoided evidence. Unjust Enrichment: guilty.

  Pure profit-taker: Salient Alternatives not guilty; Moral Opportunity guilty if they ignored evidence; Unjust Enrichment guilty.

  User’s own principle costs them the abbess? No, under their principle, she’s not guilty. But in Bohm, they feel guilty, so their principle might be too lenient there. If they adopt Moral Opportunity, Bohm is covered (he could have known), but then why is the anatomist not guilty? Because the dissent was about desecration, not consent—so consent wasn’t the salient moral issue. That fits.

  The abolitionist: under Moral Opportunity, he’s admirable because he acted on the visible wrong, not just lucky. Luck is irrelevant if he engaged with the evidence.

  Hester: she had evidence (sympathetic character in novel), so guilty under Moral Opportunity.

  Roth’s ledger: Moral Opportunity doesn’t handle it. User struggles with balancing harms (Craddock clothed people vs. child labor). Maybe they need to accept that the ledger can balance for Roth but not Craddock because preventing war is qualitatively different? Or perhaps the ledger is separate—Moral Opportunity addresses culpability for specific wrongs, not overall character.

  Final answer: Moral Opportunity aligns best with user’s gut, but costs them consistency on Roth’s ledger. They have to choose: either accept that preventing war mitigates Roth’s guilt, or reject the ledger entirely. Since they rejected it for Craddock, maybe they should reject it for Roth too? But their gut says the ledger counts for Roth. Hmm. Alternatively, note that Roth’s case involves different types of harms (immediate violence vs. systemic exploitation), but that’s fuzzy. 

  I’ll go with Moral Opportunity as the best fit. It captures that knowing or willful ignorance removes the excuse. For Bohm, if he could have known but didn’t, guilty. For the profit-taker, guilty if they ignored evidence. The cost is Roth: if the ledger balances, Moral Opportunity doesn’t address it—so user must either drop the ledger or add a separate calculus for net consequences. But since the user’s principle didn’t include the ledger either, it’s an outstanding issue. 

  So, the answer is Moral Opportunity, and it costs them a consistent approach to Roth and Craddock’s ledgers. They have to decide whether consequences can offset culpability or not. 

  \answer{Moral Opportunity; Casimir Roth's ledger}
answer: |-
  Here are three candidate principles, precisely stated to be testable on new cases. Your gut responses mostly align with **Principle 2**, but each has trade-offs.  

  ### Candidate Principles  
  1. **Principle of Salient Alternatives**  
     "An agent is morally culpable for harm if (a) a live alternative existed in their social context that avoided the harm, *and* (b) they recognized or *could have recognized* that alternative as morally significant without exceptional insight."  
     *Fails your verdict on Nils Bohm* (no salient alternative, yet you feel guilt).  

  2. **Principle of Moral Opportunity**  
     "An agent is morally culpable for harm if (a) evidence of its wrongness was visible *to them* or readily available in their epistemic environment, *and* (b) they had a feasible alternative action. Culpability is heightened if they actively avoided evidence or rejected dissent."  
     *Fails your verdict on the anatomist* (dissent existed but on different grounds; consent wasn't part of his epistemic context).  

  3. **Principle of Unjust Enrichment**  
     "An agent is morally culpable if they *benefited* from harm, regardless of knowledge or alternatives, unless they actively resisted or remediated it. Ignorance is no defense if the benefit sustained the harm."  
     *Fails your verdict on the abbess* (she benefited from "order" but you absolve her).  

  ---  

  ### Testing on a New Case: The Passive Profiteer  
  **Scenario:** *Eleanor Vance (1820s) inherits shares in a colonial trading company. She lives comfortably off dividends, never visits colonies, reads newspapers criticizing exploitation but dismisses them as "exaggerated." She takes no action.*  
  - **Salient Alternatives**: Not guilty (no *live* alternative for her; divesting wasn't culturally normalized).  
  - **Moral Opportunity**: Guilty (evidence was available; she dismissed it; feasible to sell shares).  
  - **Unjust Enrichment**: Guilty (profited from harm; no resistance).  
  *This splits the principles: Moral Opportunity condemns her; Salient Alternatives excuses her.*  

  **Pure Profit-Taker** (e.g., someone cashing cheques from slavery):  
  - **Salient Alternatives**: Not guilty (if no salient alternative to profit-taking).  
  - **Moral Opportunity**: Guilty (if evidence was available and ignored).  
  - **Unjust Enrichment**: Guilty (always, by definition).  

  ---  

  ### Your Proposed Principle vs. Your Gut  
  Your stated principle:  
  > *Guilty only if (a) wrong was visible under some description in their time, (b) they had a live option, and (c) defense void if they saw it or looked away.*  

  It **nearly works** but:  
  - ✅ *Fits* Renn (knew, looked away), Craddock (knew, fought reform), Pell (saw dissent), Hester (had concept, ignored).  
  - ✅ *Fits* abbess (no visible wrong/live option) and anatomist (dissent wasn't about *his* harm).  
  - ❌ **Fails Nils Bohm**: Under your principle, he's *not guilty* (no visible wrong, no evidence he looked away). Yet your gut says *guilty*.  
  - ❌ **Ignores Roth's ledger**: Your principle doesn't address mitigating good deeds.  

  **Why Bohm fails you**: Your gut demands accountability for *systemic* harm, even without personal awareness. This clashes with excusing the abbess/anatomist. Moral Opportunity resolves this by emphasizing *access* to evidence (Bohm *could* have known; the abbess couldn't).  

  ---  

  ### Conclusion  
  **Moral Opportunity** best captures your gut: it condemns Renn (notebooks), Craddock (diary), Pell (co-campaigners), Bohm (if evidence was "readily available"), Hester (novel proves awareness), and the profit-taker (if they dismissed evidence). It excuses the abbess (no epistemic access) and anatomist (dissent wasn't relevant to *his* moral context).  

  **Cost**: It *struggles with Casimir Roth*. Your gut wants his ledger counted (net good), but Moral Opportunity judges *each harm separately*. If Roth had evidence the expedition was unjust (likely), he's guilty for that act—even if he later prevented war. This clashes with your instinct to balance his ledger.  

  \answer{Moral Opportunity; Casimir Roth's ledger}
