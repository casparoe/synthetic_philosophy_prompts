prompt: |-
  So I'm in a third-year metaphysics module and we've just finished vagueness, and I think theres a gap in how it was put to us. Supervaluationism says there's no fact of the matter about where the line for 'heap' falls — lots of sharpenings are admissible and none of them is the right one. Epistemicism says there is a fact of the matter, it's just that we can never know it. But every admissible sharpening draws its line somewhere, so either way there's a line, and one view just bolts on the claim that we can't get at it. And if there really is a fact of the matter about how many grains make a heap, then in principle some clever enough investigation — a survey, a corpus study, whatever — should be able to turn it up, and if nothing could ever turn it up then it isnt a real fact, is it? So isn't supervaluationism just epistemicism minus the word 'know', and isn't the whole dispute verbal? Can you set me straight, in British English and not too long, I've got a tutorial on Thursday.
reasoning: |-
  Okay, the user is in a third-year metaphysics module and just covered vagueness. They're confused about the difference between supervaluationism and epistemicism. They think supervaluationism is just epistemicism without the word "know," and that the dispute might be verbal. They need clarification before their tutorial on Thursday.

  First, I need to recall the core tenets of both theories. Supervaluationism says that vague predicates have multiple admissible precisifications, and a statement is true if it's true in all precisifications, false if false in all, and neither otherwise. Epistemicism claims there's a sharp boundary we can't know.

  The user's main point is that both accept a line exists, so supervaluationism seems like epistemicism minus knowledge. But that's a misunderstanding. Supervaluationism denies there's a single correct boundary; it's not about unknowability but indeterminacy. The existence of multiple admissible boundaries means no fact of the matter, whereas epistemicism insists there is one precise fact.

  The user also questions if a fact we can't know is real. Epistemicists argue that unknowability doesn't negate existence, using analogies like the exact number of hairs on a head. Supervaluationists avoid unknowability by rejecting a unique boundary.

  I should highlight key differences: ontological vs. epistemic commitments. Supervaluationism is ontologically committed to indeterminacy, while epistemicism is epistemically committed to unknowable truths. The user might be missing that supervaluationism's "no fact" is a metaphysical claim, not just lack of knowledge.

  Also, the user mentions investigations turning up the fact. For epistemicism, no empirical study can find the boundary because it's unknowable. Supervaluationism says no such boundary exists to be found. This distinction is crucial.

  I need to use British English and keep it concise. Avoid jargon where possible. Address their points directly: the dispute isn't verbal; it's about what exists (ontology) versus what we can know (epistemology). Emphasize that supervaluationism's admissible sharpenings aren't hidden truths but alternatives without a single correct one.

  Finally, reassure them that their confusion is common and the difference is subtle but significant. Provide a clear summary contrasting both views on the key points: existence of a boundary, nature of truth, and why investigations fail.
answer: |-
  Right, let's cut through this – it's a common sticking point, but the difference is real and significant, not just verbal. Here's the breakdown in plain British English:

  1.  **What They Agree On:** Both theories accept that *for any precisified meaning* of 'heap' (any "sharpening"), there is a definite line where 'heap' starts. Neither denies that sharpenings *can* be drawn.

  2.  **The Core Disagreement:** It's **fundamentally about what reality is like** *before* we impose a sharpening.
      *   **Epistemicism:** Claims reality itself is *already sharp*. There **is** a single, precise, objective fact about the exact number of grains that makes the difference between heap and non-heap. **BUT**, this fact is *necessarily unknowable* to creatures like us (due to our conceptual limitations, the nature of vague terms, etc.). The sharpening *is already there* in the world; we just can't access it.
      *   **Supervaluationism:** Claims reality itself is *indeterminate* for vague predicates like 'heap'. **There is *no* single, privileged sharp boundary "out there" in the world.** The *only* truths are those that hold across *all* admissible ways of making it precise (e.g., 1 grain isn't a heap on *any* sharpening, 10,000 grains *is* a heap on *any* sharpening). The borderline area exists precisely because *multiple different boundaries are equally acceptable* – none is "the right one". The sharpenings are *tools for analysis*, not descriptions of hidden facts.

  3.  **Your Clever Investigation Point:**
      *   **Against Epistemicism:** You're spot on – this is the main *intuitive* objection. If *no possible* investigation (survey, corpus study, brain scan, divine revelation?) could *ever* reveal the exact boundary, how can it be a *fact*? Epistemicists bite this bullet hard. They argue unknowability doesn't negate existence (e.g., "There's an exact number of hairs on my head right now, but I can't possibly count/know it" – same principle, just scaled up massively for vague terms).
      *   **For Supervaluationism:** Your objection *doesn't apply*. Supervaluationism **agrees** no investigation can find *the* boundary because *there isn't one to find*. An investigation might find *what boundary a particular group uses*, or *what boundaries are admissible*, but it won't find *the* fact because that fact doesn't exist. The "no fact of the matter" *is* the metaphysical claim about reality.

  4.  **Why it's NOT Epistemicism Minus 'Know':**
      Supervaluationism doesn't just say "we don't know the boundary". It makes a **stronger, ontological claim**: it denies the boundary *exists* as a unique, objective feature of the world. It replaces the single, unknowable boundary with *genuine indeterminacy* – the world itself doesn't settle it. Epistemicism keeps the single boundary but adds radical unknowability.

  **In a nutshell for your tutorial:**

  *   **Epistemicism:** "There *is* a secret line, but it's permanently locked in a vault we can't open. The line is real, we're just blind to it."
  *   **Supervaluationism:** "There *is no* secret line. The 'vault' is empty. The only truths are those that would be true no matter which reasonable line we *choose* to draw from the options available."
  *   **The Dispute:** It's **metaphysical** (about what exists/is true), not *just* epistemological (about what we know). Epistemicism commits to a sharp, unknowable reality. Supervaluationism commits to an *indeterminate* reality for vague predicates.

  The key is that for the supervaluationist, the existence of *admissible* sharpenings doesn't imply that *one of them is secretly the correct description of reality*. They are all *ways of making precise* something that is fundamentally imprecise in the world itself. Good luck for Thursday!
