answer: |-
  Here is the exam question, model answer, and marking scheme as requested, adhering strictly to your specifications and word limits.

  ---

  **Exam Question (Stem & Instructions): (118 words)**

  **Scenario:** The government of Arcadia faces pressure to declare atrocities against the Veridian minority in neighbouring Helion a 'genocide'. Arcadia’s Foreign Ministry lawyers advise against using the term, arguing that 'genocide' is a specific legal crime requiring judicial determination; premature labelling risks politicising the law and complicating diplomacy. The Veridian Diaspora Council condemns this refusal as complicity, arguing the evidence of intent to destroy their group is clear and that withholding the term denies moral gravity and hinders action.

  **Question:** Critically assess both positions. In doing so, explain what each side assumes about the relationship between the *legal definition* of genocide, the *moral accusation* inherent in the term, and the *political act* of naming atrocities as genocide. Defend a reasoned conclusion on whether the 'genocide' label should be treated primarily as a scarce legal finding or an available moral judgement. (20 Marks)

  ---

  **Model Answer (547 words):**

  The Foreign Ministry’s position rests on a strict separation between legal process and public discourse, assuming the legal definition (UNGC Art. II) is the *only* legitimate use of "genocide". They prioritise legal certainty: genocide requires proven *specific intent* ("dolus specialis") to destroy, in whole or *in substantial part*, a national, ethnical, racial, or religious group. Crucially, political groups are excluded. Labelling without a court finding, they imply, misuses the law for political ends and might trigger premature or counterproductive obligations under the Convention (prevent/punish). Their stance assumes the legal definition *exhausts* the term's meaning and legitimacy; the moral accusation is inseparable from, and contingent upon, legal adjudication. Thus, the political act of naming is illegitimate without judicial authorisation.

  The Diaspora Council conflates the legal term with its broader moral resonance. For them, the overwhelming evidence of systematic atrocities driven by intent to eradicate the Veridian identity constitutes genocide in its essential moral sense – the ultimate crime against a group. They assume the moral accusation *precedes* and *demands* legal recognition. Withholding the term, they argue, constitutes a political act of denial, minimising the atrocity's unique horror (targeted group destruction), undermining calls for intervention, and perpetuating the perpetrators' impunity. They see the Ministry's legalism as a politically convenient "dodge", prioritising state interests over moral truth and victims' need for recognition. Their position assumes the moral definition *overrides* legal technicalities in the face of compelling evidence.

  Both positions highlight tensions inherent in the term. The legal definition *narrows* "genocide" considerably compared to moral usage: specific intent narrows it from mass killing generally; protected group criteria exclude political targets (often central to atrocities); "in part" requires a substantial part, not any number. The Ministry exploits this narrowing procedurally. However, the Diaspora correctly identifies the harm of *under-naming*: crimes against humanity (CAH) are grave, but withholding "genocide" risks signalling that the targeted destruction of the group’s *existence* isn't recognised, causing distinct victim trauma and potentially reducing political will. The Convention’s prevention obligation creates an asymmetric incentive: states fear the burdens of naming (diplomatic, military, legal), while victim groups see naming as essential for protection and justice.

  The Ministry’s claim that only courts can legitimately use "genocide" is itself a substantive claim disguised as procedure. It presumes legal definitions monopolise moral language, which is contestable. While legal determinations are vital for individual criminal responsibility, the moral and political dimensions cannot wait for often-impossible court processes, especially during ongoing atrocities. Conversely, the Diaspora’s stance risks diluting the term’s unique legal and moral gravity if applied too readily, potentially weakening its force when a legal finding *is* crucial.

  Therefore, treating "genocide" *solely* as a scarce legal finding is inadequate and potentially harmful during unfolding crises. The legal definition provides essential precision for courts, but the moral accusation, rooted in the horror of group destruction, exists independently. States should base public characterisations on rigorous application of the legal *criteria* to available evidence, acknowledging the gravity and specific nature of group-targeted destruction without requiring a formal judicial verdict. This recognises the moral weight victims invest in the term and the political imperative for clear condemnation, while maintaining fidelity to the Convention’s framework by basing the assessment on its substantive elements. The label should be available as a serious moral and political judgement based on evidence meeting the legal *threshold*, not reserved solely as a scarce judicial conclusion.

  ---

  **Marking Scheme (Out of 20):**

  *   **A: 18-20:** Exceptional answer. Critically dissects both positions' underlying assumptions about law/morality/politics. Precisely articulates legal narrowing (specific intent, protected groups, 'in part'). Insightfully analyses asymmetric incentives (state caution vs. victim urgency). Explicitly identifies Ministry's stance as a substantive claim masked as procedure. Compellingly addresses distinct harm of withholding label vs. CAH. Nuanced, defended conclusion rejecting binary (scarce/available) in favour of evidence-based application of legal criteria for moral/political naming. Excellent structure.
  *   **B: 15-17:** Very Good. Clear understanding of both positions and their assumptions. Good grasp of legal narrowing. Identifies state/victim incentives. Notes Ministry's substantive claim. Addresses harm of under-naming and difference from CAH. Sound conclusion supported by argument. May lack some nuance in conclusion.
  *   **C: 12-14:** Competent. Describes both positions adequately. Basic understanding of legal definition (intent, groups) but may lack precision (e.g., vagueness on 'in part'). Some awareness of state/victim perspectives or naming consequences. Conclusion present but may be simplistic or underdeveloped. May contain minor inaccuracies not penalised elsewhere.
  *   **D: 9-11:** Passable. Superficial treatment of positions. Limited grasp of legal definition (errors likely). Little analysis of assumptions or incentives. Conclusion weak or absent. Significant omissions or muddled understanding.
  *   **E: 5-8:** Poor. Misrepresents positions or legal definition. Major errors or omissions. Little relevant analysis. No valid conclusion.
  *   **F: 0-4:** Very Poor. Fundamentally incorrect or irrelevant.

  **Specific Moves Rewarded (Implicit in A/B descriptors):**
  1.  **(4 marks)** Accurately explaining the *legal narrowing*: Specific Intent (vs. motive/hate); Protected Groups (exclusion of political groups); "In part" = substantial part.
  2.  **(4 marks)** Critically analysing *assumptions*: Ministry (legal definition exhausts term, naming requires court); Diaspora (moral accusation demands naming, evidence overrides procedure).
  3.  **(4 marks)** Handling *asymmetric incentives & consequences*: State caution (Convention obligations, diplomacy); Victim urgency (recognition, protection); Harm of under-naming (distinct from CAH, trauma, impunity).
  4.  **(3 marks)** Identifying the Ministry's *procedural stance as substantive claim*: That only courts can legitimately use the term presupposes legal definition monopolises meaning.
  5.  **(5 marks)** Defended Conclusion: Rejecting binary; Advocating for naming based on evidence meeting *legal criteria* as a moral/political act *without* requiring a court finding; Acknowledging value of legal determination separately.

  **Specific Mistakes Penalised (Deduct marks where they impair analysis, per level descriptors):**
  *   Equating genocide with mass killing generally. (-)
  *   Misunderstanding intent (e.g., as simple hatred or motive). (-)
  *   Assuming absence of court finding = evidence it isn't genocide. (-)
  *   Stating/implying the Convention protects political groups. (-)
  *   Misinterpreting "in part" as meaning any number of victims. (-)
  *   Failing to distinguish the specific harm of withholding 'genocide' label vs. labelling as CAH. (-)
  *   Ignoring the Convention obligations triggered by naming. (-)
  *   Accepting the Ministry's "court-only" position uncritically. (-)

  ---
  **Total Words:** Question (118) + Model Answer (547) + Marking Scheme (320) = **985 words.**
