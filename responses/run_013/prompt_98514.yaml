answer: |-
  ### 1. The Pattern, Restated  
  You observe three distinct ways we gain knowledge from *absence* or *non-occurrence*, rather than direct presence:  

  - **Case 1 (Jam)**: You visually perceive an empty shelf and *directly know* "there is no jam." No inference occurs; the absence itself feels perceptually immediate, though you saw nothing "negative."  
  - **Case 2 (Lunch)**: From observing your brother’s large dinners and *never* seeing lunch, you *infer* he must eat lunch unseen. This bridges gaps in evidence via hypothetical necessity: without this, observed facts lack coherence.  
  - **Case 3 (Meeting)**: A colleague’s unanswered message signals "she won’t attend." Here, the absence of an *expected response* (a social action) implies a future absence. Knowledge arises from violated expectation, not logic.  

  The core question: Are these three mechanisms—*perceptual absence*, *explanatory inference*, and *implied negation via inaction*—variants of one epistemic phenomenon or fundamentally distinct?  

  ---

  ### 2. Names That Already Exist  
  Several traditions offer partial frameworks:  
  - **Perception of Absence** (Aristotelian/Medieval): Called "privation" or "negative perception." Aristotle treated absence as a perceptual category (e.g., "seeing darkness"). Covers Case 1 but not 2 or 3.  
  - **Abduction** (C.S. Peirce): Inference to the best explanation. Fits Case 2 (positing lunch to explain observed facts) but ignores Cases 1 and 3’s immediacy.  
  - **Default Reasoning** (AI/Logic): Assuming normality unless contradicted (e.g., "no reply implies decline"). Explains Case 3’s social expectation but not Cases 1 or 2.  
  - **Negative Facts** (Russell/Wittgenstein): Some philosophers posit "facts" like "there-is-no-jam" to ground truths of absence. Controversial; addresses Case 1 but struggles with Cases 2–3’s dynamism.  
  - **Epistemic Norms** (Pragmatism): Knowledge from *inaction* (Case 3) may stem from contextual conventions (e.g., "silence implies consent"). Leaves out perceptual/gap-filling cases.  

  No single established term covers all three.  

  ---

  ### 3. The Nearest Relatives, and the Gaps  
  - **Abduction (Peirce)**:  
    - *Fits*: Case 2 perfectly—lunch is hypothesized to resolve inconsistency.  
    - *Gaps*: Fails Case 1 (no inference) and Case 3 (no "explanation" needed; silence itself is meaningful).  
  - **Perception of Absence (Contemporary Philosophy)**:  
    - *Fits*: Case 1—some argue absence *is* perceptible (e.g., seeing "no elephant in the room").  
    - *Gaps*: Cases 2–3 involve inference, not perception. Case 3 relies on social norms, not sensory input.  
  - **Implicature (Gricean Pragmatics)**:  
    - *Fits*: Case 3—absence of reply *implies* non-attendance via conversational expectations.  
    - *Gaps*: Case 1 lacks communicative intent; Case 2 lacks interpersonal context.  
  - **Inference to Necessity (Kantian/Logical)**:  
    - *Fits*: Case 2’s "must" (lunch is necessary for coherence).  
    - *Gaps*: Case 1 has no necessity; Case 3’s "must" is probabilistic, not logical.  

  **Conclusion**: Each concept captures one case but excludes others due to differences in mechanism (perception vs. inference), context (sensory vs. social), and necessity (immediate vs. explanatory).  

  ---

  ### 4. One Thing or Several?  
  Your cases are **three distinct phenomena** unified only by a *family resemblance*—knowledge triggered by absence—but differing in cognitive structure:  
  - **Case 1** is **Perceptual Absence Recognition**: Sensory processing detects deviations from expected patterns (no jam where jam should be).  
  - **Case 2** is **Explanatory Gap-Filling**: Abductive reasoning posits unseen elements to restore coherence.  
  - **Case 3** is **Pragmatic Non-Response Implication**: Social conventions convert inaction into a signal (e.g., silence = refusal).  

  **Proposed Taxonomy**:  
  - **Absence Perception** (Case 1): *Direct awareness of non-presence within a perceptual frame.*  
  - **Coherence-Driven Abduction** (Case 2): *Inference of hidden elements to resolve observational contradictions.*  
  - **Normative Absence Signaling** (Case 3): *Knowledge derived from violations of behavioral expectations.*  

  ---

  ### 5. Edges and Exclusions  
  **Boundary Cases**:  
  - *Near-Inclusion*: Noticing a missing toothbrush (Perceptual Absence) vs. inferring a thief (Gap-Filling) vs. an unreturned loan implying refusal (Normative Signaling).  
  - *Near-Exclusion*:  
    - **Ignorance ≠ Knowledge**: Merely *not seeing jam* isn’t knowing it’s absent—you must expect it (e.g., if jam was never there, no "absence" registers).  
    - **Coincidence ≠ Gap-Filling**: Brother skipping lunch *sometimes* doesn’t force abduction; only systematic absence does.  
    - **Ambiguity ≠ Signaling**: If colleagues often miss messages, no reply doesn’t imply non-attendance.  

  **Clear Exclusions**:  
  - Direct positive perception (seeing jam).  
  - Deductive inference (All men eat lunch → Brother eats lunch).  
  - Pure guessing without expectation (e.g., assuming lunch with no evidence).  

  ---

  ### 6. Where This Is Shaky  
  - **Perceptual Absence**: Is "seeing no jam" truly perceptual, or a post-sensory judgment? Empirical psychology (e.g., change blindness studies) suggests both—but the line is blurry.  
  - **Normative Signaling**: Case 3 risks overextension. Does *any* inaction imply knowledge (e.g., "no meteor strike today" isn’t meaningful)? Contextual expectations must be robust.  
  - **Abduction’s Boundaries**: When does gap-filling become speculation? If your brother ate secretly *once*, is "he always eats lunch" justified?  

  **Settling This**:  
  - Cognitive experiments on absence perception (e.g., tracking neural responses to "missing" objects).  
  - Analyzing normative signaling cross-culturally (e.g., when does silence imply agreement/refusal?).  
  - Formal models of abduction’s thresholds (e.g., computational frameworks for minimal explanations).  

  The core uncertainty: Whether these share a *unified cognitive mechanism* or merely a surface pattern. Current evidence suggests distinct processes.
