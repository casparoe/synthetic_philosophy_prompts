prompt: |-
  I'm in a reading group that has spent the term on cultural evolution, and we keep stalling at the same place: someone reaches for the meme's-eye view — cultural items that spread because they are good at spreading, whether or not they do their bearers any good — and someone else objects that this is just Darwinian vocabulary pasted onto a metaphor, and we never get past the standoff. Before we read more contenders I want the specification instead. Set out the desiderata for a theory of culture that genuinely deserves to be called Darwinian: what would such a theory have to deliver to count as adequate?

  Be concrete about what each requirement is doing. I want the phenomena it has to account for — why practices that are costly or outright ruinous to the people who carry them nonetheless persist and spread; why stories and tunes drift in transmission yet keep snapping back toward a small set of recognizable forms rather than wandering freely; why culture can turn over within a few generations when genetic change takes far longer; why so many cultural items seem to have a single point of origin and then fan out. I want the distinctions it must not collapse: an item's success at spreading versus its bearer's success at living; the winnowing of variants versus their systematic reshaping toward particular forms; faithful replication versus mere repetition; spread by transmission versus independent reinvention. And I want the neighbouring results it cannot contradict — in particular that human copying is noisy and reconstructive rather than mechanical, and that cultural inheritance is not particulate the way genetic inheritance is, since variants blend and contaminate.

  Throughout, separate the requirements that are genuine from the ones that are just habits of thought carried over from biology, and tell me which single requirement does the most work in ruling out the most popular pictures of how culture evolves; if some pair of them cannot be met together — say, if demanding a faithful replicator sits badly with explaining rapid cumulative change — that would be the most interesting result, so put it on the table. Give the whole thing as exactly five numbered items, one requirement each, a sentence or two apiece, with no introduction and no closing summary, folding the verdict on genuineness, on the most-excluding requirement, and on any unsatisfiable pair into whichever item each bears on.
reasoning: |-
  Okay, the user is part of a reading group focused on cultural evolution, and they're stuck on a recurring debate about memes. One side pushes the idea of cultural items spreading for their own benefit, while the other dismisses it as just slapping Darwinian terms on a metaphor. The user wants to move past this by getting a clear specification of what a truly Darwinian theory of culture must achieve. They're asking for concrete desiderata that such a theory needs to fulfill.

  I need to understand the user's scenario. They're in an academic setting, likely with peers who have diverse views. The group is frustrated because discussions stall at the same point. The user wants to resolve this by having a solid framework to evaluate theories, which shows they're seeking rigor. Their request is detailed: they want phenomena accounted for, distinctions maintained, and alignment with existing knowledge about human culture.

  The user's explicit needs include explaining counterintuitive cultural persistence (like harmful practices), the stability in transmission (stories and tunes snapping back to forms), rapid cultural turnover compared to genetics, and single-origin spread. They also want distinctions like spread success vs. bearer success, winnowing vs. reshaping, faithful replication vs. repetition, and transmission vs. reinvention. Plus, they mention neighbouring results: noisy, reconstructive copying, and non-particulate inheritance where variants blend.

  Deeper needs might include fostering productive discussion in the group, gaining clarity on what makes a theory genuinely Darwinian versus metaphorical, and identifying deal-breakers for competing models. They might also want to avoid superficial analogies and find a theory that respects cultural uniqueness while applying evolutionary principles.

  Now, to set out the five requirements. I should base them on core Darwinian principles—variation, inheritance, and selection—but adapted for culture. Each item must be concrete and address the phenomena and distinctions listed. I need to fold in the verdict on genuineness, the most-excluding requirement, and any unsatisfiable pairs directly into the relevant items.

  I recall that a key challenge is the particulate inheritance issue in genetics versus blending in culture. Also, human copying isn't mechanical; it's reconstructive. So, the theory must handle that without collapsing distinctions. The most-excluding requirement might be the inheritance one, as it rules out many meme-based models that assume high-fidelity replication.

  For the unsatisfiable pair: demanding faithful replication might conflict with explaining rapid cumulative change, since high fidelity could slow down innovation. I'll highlight that in one of the items.

  Let me brainstorm the five items:
  1. Variation requirement: Must explain observable diversity in cultural items and show how new variants arise.
  2. Inheritance requirement: Must account for transmission that's reconstructive and non-particulate, allowing for blending.
  3. Selection requirement: Must handle selection acting on cultural items independently of biological fitness, explaining persistence of harmful practices.
  4. Differential success requirement: Must show how selection leads to changes in variant frequencies over time, separate from bearer success.
  5. Cumulative adaptation requirement: Must explain rapid, complex cultural evolution without relying on particulate inheritance.

  Now, for genuineness: Items 1, 3, 4, and 5 are genuine Darwinian needs. Item 2 addresses a biological habit (particulate inheritance) that doesn't fit culture. The most-excluding requirement is the inheritance one (item 2), as it disqualifies theories that assume meme-like replication. The unsatisfiable pair is in item 5: demanding faithful replication conflicts with rapid cumulative change, so I'll state that explicitly.

  I need to phrase each item concisely, in a sentence or two, and ensure it covers phenomena. For example, item 3 should explain costly practices, item 5 should cover rapid turnover. Distinctions like spread vs. bearer success go into item 4. Blending and noisy copying are in item 2.

  This structure should give the user a clear, evaluative framework for their reading group discussions.
answer: |-
  1. **Variation Requirement:** The theory must explain the origin and maintenance of observable diversity in cultural variants (e.g., different tool designs, ritual practices, story versions), accounting for both random mutation *and* systematic biases in modification (e.g., why tunes drift yet snap back to stable forms), without assuming variation is infinite or unconstrained. This is genuine, as variation is fundamental to Darwinism, but it rules out models where cultural change is purely directed or where drift implies free wandering.

  2. **Inheritance/Transmission Requirement:** The theory must explain the non-random, cross-generational recurrence of cultural variants (e.g., why specific folktales reappear recognizably), while accommodating that human copying is noisy, reconstructive, and involves blending/contamination (not particulate inheritance). This is genuine in demanding heritable continuity but rejects the biological habit of requiring high-fidelity, particulate replication; this exclusion does the most work, disqualifying strict "meme" models assuming virus-like copying.

  3. **Selection Requirement:** The theory must explain the differential persistence and spread of cultural variants based on consequences, specifically accounting for variants that enhance their own transmission probability *independently* of their effects on the biological fitness or well-being of their human bearers (e.g., costly rituals that spread). This is genuine, as selection is core, but demands a mechanism for cultural selection pressures decoupled from genetic fitness, directly addressing the spread-success vs. bearer-success distinction.

  4. **Differential Success Requirement:** The theory must demonstrate how the interaction of variation, inheritance, and selection *causes systematic changes in the relative frequency of cultural variants within a population over time* (e.g., why one farming technique replaces another rapidly), distinguishing this winnowing from mere repetition or independent reinvention. This is genuine (defining evolution as changing variant frequencies) and forces the theory to show *how* selection operates, not just label it.

  5. **Cumulative Adaptation Requirement:** The theory must explain the emergence of complex, functional cultural adaptations (e.g., technologies, institutions) through the gradual, incremental modification of variants over time, accounting for rapid cultural turnover relative to genetic change, without relying on particulate inheritance or perfect replication. This is genuine (explaining complexity) but creates tension: demanding faithful replication (a biological habit) to preserve complex adaptations conflicts with explaining rapid change via noisy/blending transmission; an adequate theory must resolve this using population-level filtering of reconstructive processes.
