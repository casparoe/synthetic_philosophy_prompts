  Here's a joke tailored to your specifications, playing directly on the core metaphysical tensions of the Statue and the Lump:

  ---

  **Judge Hargrave**, known locally as "The Metaphysician Magistrate," peered over his glasses at the small-claims court petitioners. **Arlo**, a flustered art collector in a velvet jacket, clutched a small, exquisite clay sculpture of a bird. Beside him stood **Bea**, the potter, her hands still dusted with dried clay, radiating indignation.

  "Your Honor!" Arlo pleaded. "I commissioned and paid for this sculpture! It's a signed work by a rising artist, worth thousands! Bea here claims she still owns it!"

  "Your Honor," Bea countered, voice steady. "That *is* my clay. I supplied it. The artist merely shaped it. The clay persists. He bought the *form*, not the substance."

  Judge Hargrave’s eyes gleamed. He steepled his fingers. "Fascinating. We are presented with a classic puzzle of material constitution. An object, `S` – let's call it the Sculpture – and an object `C`, the Clay Lump, seemingly spatially coincident. Yet, `S` has aesthetic properties, significant monetary value, and would cease to exist if crushed. `C`, however, retains its material identity, would survive reshaping, and possesses mere commodity value. Crucially, `C` predates `S`."

  Arlo and Bea stared, bewildered.

  "The law," Hargrave continued, "demands we count *things*. Constitution is not identity! Therefore, I find there *are* two distinct objects here, sharing a location but differing in persistence conditions and essential properties."

  Arlo brightened. "So I get the sculpture?"

  Bea leaned forward. "And I get my clay?"

  "Precisely!" declared Hargrave. "Mr. Arlo, you are awarded exclusive rights to the sculpture *qua* artwork – its aesthetic properties and artistic identity. Ms. Bea, you retain ownership of the underlying clay substance *qua* material substrate. Since they are coincident, you will need to arrange shared custody. Mr. Arlo cannot damage the form; Ms. Bea cannot reclaim the matter without dissolving the statue. Co-operation is essential."

  Arlo sputtered, "But... how do I *display* it if she owns the stuff it's *made of*?!"

  Bea frowned, "Your Honor, what if I need *this specific clay* back?"

  Hargrave smiled serenely. "Precisely the point, Ms. Bea! The clay *would* survive reclamation. The sculpture emphatically would *not**. That’s the asymmetry. This ruling honors the distinct metaphysical realities. Case dismissed. Next! Is that a Ship of Theseus I see?"

  ---

  **Why it works:**

  1.  **Core Metaphysics:** Hits all the key notes - spatial coincidence, distinct properties (value), different persistence conditions (crushing/reclamation), the asymmetry (clay survives form change, statue doesn't), and the non-identity claim ("Constitution is not identity!").
  2.  **Specific Position:** The judge explicitly adopts the position that constitution ≠ identity (e.g., like Judith Jarvis Thomson's view), leading directly to the absurd-but-logical conclusion of two objects requiring shared custody.
  3.  **Humor Source:** The humor arises *from* the genuine philosophical tension. The judge's rigorous application of metaphysics to a mundane legal dispute creates the absurdity. The shared custody ruling is the logical, yet practically nonsensical, consequence of the "two objects" view. The final lines highlight the practical impossibility stemming directly from the metaphysical asymmetry.
  4.  **Accessibility:** Even without knowing Thomson, the listener understands the judge is making a bizarre ruling based on a weird distinction. The core conflict (who owns *this* thing?) is clear, and the punchline ("shared custody," "how do I display it?", "what if I need the clay?") reveals the absurd practical outcome of the metaphysical stance.
  5.  **Not About Philosophers:** The joke is on the *problem* and the *real-world implications* of a specific solution. The judge is eccentric but committed to the *ideas*, not just being a philosopher stereotype. The humor comes from applying the strict logic of the puzzle to a real situation.
