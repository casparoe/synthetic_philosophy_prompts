prompt: |-
  I'm in a metaphysics reading group and we've been stuck on the special composition question — when do some things compose a further thing? Next week I'm supposed to bring in a case that shows how a degrees-of-composition view could actually earn its keep, and I want to build it properly rather than just hand-wave. The degrees view I have in mind says composition isn't all-or-nothing: a heap of sand might be, say, 0.1 composed, a single living cell 1.0, and a colonial organism or symbiotic consortium somewhere in between, depending on how tightly integrated its parts are (e.g. how many of the parts would survive the removal of others, or how much of the whole's behaviour is explained by the whole rather than by the parts taken separately). I want a thought experiment that isolates the variable of causal/metabolic integration from the variable of being an organism, so that four verdicts come out cleanly: (i) a standard universalist says the parts compose exactly one composite object; (ii) a standard nihilist says there are only simples and no composite object; (iii) an organicist says there is a composite only if the whole is an organism, so the case must make it genuinely unclear whether the whole counts as one organism; and (iv) the degrees theorist says the whole is an intermediate degree of composition — not 0, not 1 — and explains why it falls where it does. Constraints: no artefacts, no persons, no consciousness, no language, no fictional physics or magic; it should be a plausible biological phenomenon (real or invented, but not one that requires specific facts I'd have to look up), and the scenario itself should be no longer than one paragraph.

  After the scenario, walk through each of the four verdicts and why it follows from that theory, then tell me which single feature of the case is doing the work, what happens if I remove or tweak that feature, and how an organicist or a nihilist would try to deflate the case. Don't just stipulate the verdicts — they have to fall out of the theories. And please write it in British English. I definately want you to be honest about where the degrees view is just relabelling the disagreement.
