answer: |-
  Here’s a biological thought experiment meeting your constraints, followed by analysis:

  **Scenario:**  
  Consider a persistent microbial mat in a hydrothermal vent, formed by two distinct archaeal species. Species A metabolises sulphur compounds, excreting hydrogen as waste. Species B requires this hydrogen for its own metabolism, fixing carbon and releasing sulphides that Species A needs. They occupy adjacent micro-zones (within millimetres), coordinate via chemical signalling, and collapse if separated. However, they reproduce independently: each species divides asexually within its own sub-population, with no shared reproductive mechanism, synchrony, or common life cycle. The mat maintains structural integrity and metabolic function only through their combined, interdependent activity.

  **Verdicts:**  
  1.  **Universalist:** Composition occurs whenever objects occupy contiguous space. Here, *all* archaea compose exactly one composite object – the entire mat – simply because they are spatially connected.  
  2.  **Nihilist:** Only fundamental particles (or perhaps the individual archaeal cells) exist. There is no additional entity "the mat" composed by the cells, regardless of their interaction. The mat is just many simples arranged "mat-wise".  
  3.  **Organicist:** Composition occurs only if there is *one organism*. Crucially, the lack of a *unified reproductive process* – the independent reproduction and lack of shared life cycle – makes it genuinely unclear whether this integrated metabolic unit qualifies as a *single* organism or is merely two highly cooperative species. Thus, it's indeterminate whether composition occurs.  
  4.  **Degrees Theorist:** Composition is scalar. The mat exhibits a high degree of causal/metabolic integration (near-total functional interdependence, signalling, mutual collapse upon separation), warranting a composition degree significantly above 0 (e.g., 0.7). Yet, the absence of reproductive unity – a key feature often linked to maximal biological integration/organismality – prevents it reaching degree 1.0. The score reflects the tightness of *functional* integration while acknowledging a lack of *organismic* unity.

  **The Critical Feature:**  
  The **functional/metabolic interdependence without reproductive unity** is doing the work. The high integration drives degrees away from 0 and frustrates nihilism/organicism, while the reproductive independence prevents degrees reaching 1.0 and creates organicist indeterminacy.

  **Tweaking the Feature:**  
  *   **Remove Interdependence:** If the species merely coexisted without relying on each other's waste/products, metabolic integration drops drastically. The degrees view would assign a very low score (near 0), aligning more with nihilism. Universalism remains unchanged; organicism likely says no composition.  
  *   **Add Reproductive Unity:** If the species evolved a shared reproductive cycle (e.g., synchronised division dependent on signalling), reproductive unity emerges. Degrees view might then score ~1.0 (full composition), organicism would likely affirm a composite organism, while universalism and nihilism remain unchanged.

  **Deflating the Case (Opponent Responses):**  
  *   **Organicist:** "This simply confirms our view! The indeterminacy *is* the answer – there's no fact about composition here because it's not clearly an organism. The 'degree' is just a measure of how *organism-like* the system is, still grounded in the organicist condition. You haven't shown composition *itself* is scalar; you've shown *organismality* is scalar."  
  *   **Nihilist:** "The 'degree of composition' is merely redescribing the degree of causal interaction between distinct simples. It doesn't prove the existence of any *additional* composed object. All the work is done by describing interactions between the archaea; positing a 'partly composed mat' is explanatorily idle relabelling. The 'score' is just a summary of interaction facts, not an ontological commitment to composites."  

  **Honest Assessment of Degrees View:**  
  The degrees view *does* risk relabelling the core disagreement. It offers a *description* of integration that intuitively maps to our graded intuitions about "objecthood", potentially providing a useful heuristic. However, opponents legitimately argue it hasn't necessarily solved the *metaphysical* problem: it stipulates scalarity without providing a fundamental *explanation* for *why* composition should be scalar rather than all-or-nothing, beyond pointing to scalar features in the world (which the nihilist sees as features of *arrangements*, not composition, and the organicist sees as scalar features relevant only to *their* privileged condition). Its strength is pragmatic unification of intuitions; its weakness is potentially not advancing the underlying ontological debate.
