answer: |-
  Here is the exam question followed by the model answer breakdown:

  **Exam Question (45 minutes):**

  "Consider a vase made of a single lump of clay existing from t1 to t10. Its height varies symmetrically: it is tall during [t1-t2], short during [t3-t4], tall during [t5-t6], and short during [t7-t10]. Now suppose we conceptually 'reorder' the temporal positions of these height states while keeping the lump of clay and all other intrinsic properties constant: the vase would instead be short [t1-t2], tall [t3-t4], short [t5-t6], tall [t7-t10]. First, explain whether such a reordering is *intelligible* (metaphysically coherent, not just logically conceivable) under Endurantism. Second, explain whether such a reordering is intelligible under Perdurantism. Finally, for each theory, explain what your answer reveals about its commitment to the idea that time is 'like' space."

  **Model Answer Breakdown (Total: 20 marks):**

  1.  **Endurantism's Core Claim:** Endurantism holds that the vase is wholly present at each moment of its existence (t1-t10), possessing its entire being and intrinsic properties (like height) directly at each instant. **(2 marks)**
      *   *Loses marks if:* Only defines "wholly present" without linking it to instantiation of properties.

  2.  **Endurantism & Reordering Intelligibility:** The reordering is *unintelligible* for the Endurantist because height (e.g., being tall) is a genuine, non-relational intrinsic property borne by the *entire* vase *at* a specific time (e.g., t1-t2); swapping the times when these intrinsic properties are instantiated changes *which* intrinsic properties the vase possesses at *which* times, constituting a different history. **(5 marks)**
      *   *Loses marks if:* Invokes only the Problem of Temporary Intrinsics generally; fails to explain *why* swapping times matters for intrinsic properties under Endurantism.

  3.  **Perdurantism's Core Claim:** Perdurantism holds that the vase persists by having distinct temporal parts: a tall temporal part existing at [t1-t2], a short part at [t3-t4], another tall part at [t5-t6], and another short part at [t7-t10]. The whole vase is the mereological sum of these parts. **(2 marks)**
      *   *Loses marks if:* Only defines "temporal parts" without mentioning the vase as a sum across time.

  4.  **Perdurantism & Reordering Intelligibility:** The reordering *is* intelligible for the Perdurantist because the identity of the temporal parts (tall-part-1, short-part-1, etc.) is primary, and their specific temporal location is akin to a spatial location; swapping the temporal positions of these pre-existing parts does not change their intrinsic properties or the fact that they are parts of the same spatio-temporal worm, it merely changes the order in which they are temporally arranged. **(6 marks)**
      *   *Loses marks if:* Claims it's *actually* possible; fails to distinguish part identity from temporal location; doesn't explain why swapping locations doesn't alter the object's identity.

  5.  **Revealing the Time-Space Analogy:** Endurantism's rejection of reordering shows it treats temporal position as fundamentally unlike spatial position – it is essential to *when* an object instantiates its intrinsic properties. Perdurantism's acceptance of reordering shows it treats temporal position analogously to spatial position – as a mere container or location for parts whose identity and properties are prior to and independent of that location. **(5 marks)**
      *   *Loses marks if:* Only states one side; makes a vague claim about time not being space; doesn't explicitly link the reordering result to the core difference in how each view treats location.
