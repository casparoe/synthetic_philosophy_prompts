  I'm writting the final for my upper-level metaphysics seminar and I want a single essay question on endurantism versus perdurantism that can't just be answered by reciting the problem of temporary intrinsics and the usual 'wholly present vs. temporal parts' line. So I've cooked up a case of my own to hang the question on, and I'll hand you the case here so you can build the question round it.

  The case: take an ordinary vase that exists from t1 to t10 and gets squashed partway through, so its career goes tall, short, tall, short. Same lump of clay the whole way, no identity puzzles, nothing odd about the matter. Now suppose we could reach into that career and swap the two 'tall' stretches with the two 'short' ones, so the vase runs short, tall, short, tall instead — the stretches trade places, everything else stays as it was. I want the question to press on whether this reordering is even inteligible on each view, and what each side's answer tells you about how seriously it takes the slogan that time is like space.

  So give me the exam question (something a good student could do in 45 minutes), then a model answer as exactly five numbered points — each one a sentence or two, no intro and no wrap-up. Each point should be one move a top answer has to make, the marks it carries out of 20 (they should add up), and a one-line note on the mistake that loses students those marks. Don't ask for citations or further reading, they can't look anything up.
