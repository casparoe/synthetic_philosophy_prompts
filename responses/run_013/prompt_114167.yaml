answer: |-
  Below is a decision tree designed to guide students from the initial commitment (low pivotality, small cost, high collective benefit) to a named position on the paradox of voting. It uses **7 branch questions** to reach **9 distinct leaves**, with each node phrased as a self-diagnostic question. The tree prioritizes logical space over labels, exploits the key distinctions (causal vs. evidential; intrinsic vs. norm-dependent value), and includes a node testing reactions to the negative verdict.  

  ### Decision Tree  
  **Starting Commitment**: In a large national election, your ballot’s probability of being decisive is ~1 in 10 million. Voting has a small cost (time/effort). If your preferred side wins, it benefits many people greatly.  

  1. **Q1: When you consider voting, does the value depend on *who wins* the election?**  
     - *Yes → Go to Q2*  
     - *No → Go to Q6*  

  2. **Q2: Does the value of your vote require it to be *decisive* (i.e., directly cause the outcome by breaking a tie)?**  
     - *Yes → Go to Q3*  
     - *No → Go to Q4*  

  3. **Q3: When calculating benefits, do you weigh *only your personal gains*, or the *gains to all affected people*?**  
     - *Only personal gains* → Negative expected utility (cost > tiny pivotality × personal benefit). **Go to Q7**.  
     - *Gains to all affected people* → **Leaf: Instrumental altruism**.  
       - *Most awkward commitment*: You must accept that multiplying a vast collective benefit by a tiny pivotality can (theoretically) outweigh small costs.  
       - *Pivotality swap effect*: High pivotality strengthens this position.  

  4. **Q4: Do you see your vote as *evidence* of how a larger bloc of people (e.g., with your preferences) will vote?**  
     - *Yes* → **Leaf: Evidential/team reasoning**.  
       - *Most awkward commitment*: You must treat your vote as a signal of group behavior (e.g., "If I vote, others like me likely will too"), not a cause.  
       - *Pivotality swap effect*: High pivotality makes causal effects salient, but evidential value remains.  
     - *No* → **Leaf: Pivotality is the wrong measure**.  
       - *Most awkward commitment*: You must argue that voting "matters" through non-decisive effects (e.g., margin of victory, mandate strength, or norm reinforcement).  
       - *Pivotality swap effect*: High pivotality validates decisiveness, but you maintain margin/mandate still matter.  

  5. **Q6: Is the value of voting *intrinsic to the act itself* (e.g., fulfilling an urge or identity), not contingent on outcomes?**  
     - *Yes* → **Leaf: Pure expressive value**.  
       - *Most awkward commitment*: You must defend that voting is rational even if it has zero effect on the world (like cheering at a game).  
       - *Pivotality swap effect*: Unchanged; value is intrinsic.  
     - *No* → *Go to Q5*.  

  6. **Q5: Does the value depend on *shared norms* (e.g., reciprocity or expectations of others)?**  
     - *Yes* → **Leaf: Coordination/reciprocity**.  
       - *Most awkward commitment*: You must explain how a single vote sustains a norm despite no individual decisiveness (e.g., "I vote because people like me do").  
       - *Pivotality swap effect*: Unchanged; norms operate independently.  
     - *No* → **Leaf: Civic duty/universalizability**.  
       - *Most awkward commitment*: You must uphold voting as a duty even if no one knows you voted and your vote changes nothing (e.g., "I would will everyone in my position to vote").  
       - *Pivotality swap effect*: Unchanged; duty is outcome-independent.  

  7. **Q7: Given the negative expected utility (for self-interested voters), what best explains why people vote?**  
     - *Voters are irrational/socially pressured* → **Leaf: The debunker**.  
       - *Most awkward commitment*: You must attribute widespread voting to error (e.g., overestimating pivotality) or coercion, not rationality.  
       - *Pivotality swap effect*: High pivotality negates this; voting becomes rational.  
     - *Self-interest is not the only rational basis for action* → **Leaf: Dissolutionist**.  
       - *Most awkward commitment*: You must reject that the paradox is genuine, arguing rational choice extends beyond self-interest.  
       - *Pivotality swap effect*: Unchanged; dissolves the paradox regardless of pivotality.  
     - *The pivotality framework is flawed* → **Leaf: Pivotality is the wrong measure** (same as in Q4).  

  ---

  ### Key Notes  
  - **Collapsed distinctions**:  
    - *Expressive vs. Kantian duty*: Hard to separate (both intrinsic/non-contingent). The tree isolates expressiveness as *purely intrinsic* (Q6) and Kantian duty as *norm-independent obligation* (Q5 → "No").  
    - *Rule-consequentialism vs. evidential*: Rule-consequentialism is absorbed into "Pivotality is the wrong measure" (Q4 → "No") since both reject decisiveness but are separable via Q4’s evidence focus. Rule-consequentialism is not a distinct leaf to avoid faking distinctions.  
  - **Gaps in logical space**:  
    - *No position for "outcome-dependent but non-pivotal non-evidential non-altruistic"*: Gap reflects incoherence; if value depends on outcomes but rejects pivotality/evidence/collective benefit, no clear mechanism remains.  
    - *No position for "norm-dependent but outcome-focused"*: Gap reflects neglect; norms are typically outcome-independent or long-term.  
  - **Pivotality swap**: Only **debunker** and **instrumental altruism** change their verdict if pivotality is large (e.g., a local race). Others are pivotality-invariant.  
  - **Tree structure**: 7 questions → 9 leaves. Labels are attached *after* logical mapping.  

  This tree forces students to confront the core tensions (e.g., causal vs. evidential in Q4; intrinsic vs. norm-dependent in Q5/Q6) and exposes why your co-instructor sees the paradox as a "pseudo-problem" (via dissolutionist/rejection of self-interest dominance).
