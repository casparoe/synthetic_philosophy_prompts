prompt: |-
  I have arrived at a view about individual contributions to collective harms — climate, meat, voting — and I want it attacked rather than defended. The view, which I will call the participation view, is this: my individual act (my flight, my burger, my ballot) can be wrong even when it makes no marginal difference to any harm, and even when the world would have been indistinguishable had I acted otherwise. What makes it wrong is that I am a participant in a collective practice that causes serious harm, where participation means acting on the same practical commitment as the other contributors, so that the harm is attributable to us jointly and each of us bears a share. This is my own formulation; do not spend effort matching it to a named position in the literature.

  Do not hand me the inefficacy objection itself — that is the thing the view exists to answer. I want the defeaters, ranked from fatal to merely awkward, with the empirical ones (thresholds, tipping points, norm cascades, spillover, the actual expected value of a single vote) kept distinct from the conceptual ones.

  Here is the case I find hardest, and I want it treated at length: a person lives in a society where animal agriculture will be abolished within a decade no matter what anyone does now, because of a technology already under development; the animals she eats are already bred and would be killed regardless, so her consumption changes nothing about anyone's suffering or about the timing of abolition. Does the participation view still condemn her? If so, on what ground that is not merely expressive or symbolic? If not, what was participation doing that marginal contribution could not have done?

  Beyond that: where does the view overgenerate (activities I am intuitively not required to give up, or people it wrongly condemns), and where does it undergenerate? Is its normative work actually being done by something expressive, which would make it a dressed-up version of a view it claims to improve on? How does it account for degree, if marginal contribution does no work? And can it be stated so that some counterexample would count against it at all, or can anything be absorbed by redrawing what counts as the practice? Tell me which of these the view's own defenders would concede and which they would dismiss. If you conclude the view is well insulated, say plainly whether that is a defect or simply what a view of this kind should look like, and end with the single consideration that should move me most, and why.

  Write in American English.
reasoning: |-
  Okay, the user has presented a sophisticated ethical view they call the "participation view" and explicitly requested rigorous critique rather than defense. They're clearly well-versed in moral philosophy (referencing collective harms, marginal contribution debates) and want stress-testing of their original formulation. 

  Hmm, their framing suggests they've already wrestled with standard inefficacy objections and seek deeper structural problems. The animal agriculture thought experiment is particularly sharp - it isolates participation from both causal impact AND symbolic expression. Smart move. They're probing whether the view collapses into expressivism or retains distinctive normative force.

  I notice they want attacks ranked by severity and explicitly separated into empirical/conceptual categories. That's a scholar's request - they're preparing for academic pushback. The demand for "defeaters" rather than objections signals they treat this as a live hypothesis. Also telling: they ask how defenders would respond, indicating they've likely already steelmanned it internally.

  The under/overgeneration request shows they're worried about counterintuitive implications. And the "redrawing practices" point suggests they've considered how slippery the collective's boundaries might be. Finally, they want to know if it's falsifiable - that's philosophy-of-science level scrutiny.

  Right, hardest case first. Their abolition scenario is brutal for the participation view. If harm attribution requires the collective practice to be ongoing, but the practice is doomed regardless, how can participation be wrongful? I'll need to show either that (a) the practice's imminent death doesn't dissolve current participation's moral status, or (b) the view must concede this as a counterexample. Option (a) risks making it unfalsifiable; option (b) admits undergeneration. Tricky.

  For overgeneration: consider innocuous collectives like "people who breathe CO2." The view might absurdly condemn breathing unless we can distinguish harmful practices. But that distinction might require importing normative criteria beyond participation - which would circularly undermine the view. 

  Ah, and the degree problem! If marginal contribution doesn't matter, why isn't eating one cow as bad as eating a thousand? The view must explain proportionality without sliding into consequentialism. Defenders might appeal to intention or shared commitment intensity, but that feels ad hoc.

  Biggest worry: is this just expressivism in disguise? If the wrongness isn't in the act itself but in what it expresses about values, then the "participation" framing becomes ornamental. The user clearly fears this - they mention it twice. I'll need to identify where participation adds unique work.

  Final note: their request for "the single consideration that should move me most" implies they're near a conclusion and want the decisive nudge. Better make it devastating or they'll spot the softness.
answer: |-
  Here’s a systematic attack on the participation view, structured by severity and type, with special attention to your hardest case. Defeaters are ranked fatal → awkward, empirical/conceptual separated.

  ---

  ### **Fatal Defeaters (Conceptual)**
  1. **The "No Wrongmaker" Problem**  
     If your act causes *no harm*, changes *no outcomes*, and the world is *indistinguishable* had you abstained, what *is* the wrong? The view asserts "participation in a harmful practice" as wrong, but without:  
     - Causal contribution (direct or marginal)  
     - Expressive/symbolic harm (which you exclude)  
     - Any change to the collective’s harm output  
     ...the wrongness lacks a *ground*. It becomes a free-floating moral property. Defenders might argue the wrong is *constitutive* (like breaking a promise with no consequences), but this seems ad hoc for collective harms.  

  2. **Boundary Arbitrariness**  
     What defines "the practice"? Eating beef? All meat? All carbon-intensive acts? If you eat a burger at a protest against factory farming, are you "participating"? The view risks moral arbitrariness:  
     - **Overgeneration**: Breathing emits CO₂; are you "participating" in climate harm?  
     - **Undergeneration**: Buying a burger from a small ethical farm might be lumped into "animal agriculture," condemning the conscientious.  
     Defenders *cannot* fix boundaries without smuggling in consequences (e.g., "practices that *actually* cause harm"), which collapses into marginalism.  

  ---

  ### **Major Defeaters (Conceptual)**
  3. **The Expression Reductio**  
     If the wrong isn’t causal *or* expressive, what work is "participation" doing? The view denies symbolic weight, yet its core mechanism—"acting on the same practical commitment"—*is* expressive. It judges you for *endorsing* a harmful norm, not for material outcomes. This reduces to a non-consequentialist expressivism, which the view explicitly rejects.  

  4. **Degree Problem**  
     Without marginal difference, why is eating *one* burger less wrong than eating *100*? The participation view treats all acts within the practice identically: you’re "in" or "out." But moral intuition demands proportionality. Defenders might appeal to "intent" or "scale of commitment," but this abandons the core claim that participation *alone* grounds wrongness.  

  ---

  ### **Your Hardest Case: Animal Agriculture Abolition**  
  **The Setup**: Animals already bred will be killed regardless; abolition in 10 years is inevitable; your burger changes nothing.  

  - **Why the View Condemns You (Reluctantly)**:  
    You are "acting on the practical commitment" that treats animals as edible commodities. The practice *is* currently harmful (animals *are* suffering now), and your act signals complicity in that ongoing harm. The future abolition doesn’t erase today’s moral taint.  

  - **Why This Fails**:  
    - **Groundlessness**: Your act affects *no one*—not animals, not abolition timing, not others’ behavior. The "harm" you’re "participating in" is ontologically detached from your action.  
    - **Moral Schizophrenia**: The view condemns you for participating in *current* harm, but if the practice’s demise is certain, your "commitment" is inert. It’s like blaming someone for "participating" in a sinking ship’s chaos while they’re already in a lifeboat.  
    - **Defender’s Dilemma**:  
      - Concede this isn’t wrong → undermines the view’s core (if participation without difference isn’t wrong here, why elsewhere?).  
      - Double down → exposes the view as rigidly dogmatic ("You’re guilty even if your act is harmless!").  

  **Result**: Participation does *less* work here than marginal contribution. Marginalism would correctly say your act is permissible (no negative effects). The participation view must either implausibly condemn you or admit irrelevance.  

  ---

  ### **Empirical Defeaters**  
  5. **Thresholds/Tipping Points**  
     Many harms *do* have thresholds (e.g., climate tipping points). If your act could push a system over the edge, marginalism *can* capture its wrongness. The participation view adds nothing and overcondemns in non-threshold cases (e.g., eating a burger when factory farming is entrenched).  

  6. **Spillover Effects**  
     Your individual act may *reduce* harm by influencing others (e.g., veganism normalizing anti-factory-farming norms). Marginalism can weigh this; participation view ignores it or misattributes it as "complicity."  

  7. **Voting’s Expected Value**  
     Single votes *do* have marginal value in expectation (via pivot probability). Participation view condemns non-voters as "failing to participate," but if their vote wouldn’t change outcomes, marginalism excuses them; participation view condemns arbitrarily.  

  ---

  ### **Awkward Implications**  
  - **Overgeneration**:  
    - Condemns a person using a gasoline lawnmower in 1890 (participating in nascent fossil fuel harm) even if their act had zero climate impact.  
    - Condemns eating roadkill (no harm caused, but "participating" in meat-eating culture).  
  - **Undergeneration**:  
    - Exonerates a hermit who eats beef but has no "practical commitment" to industrial farming.  
    - Fails to condemn voting for a genocidal candidate in a landslide (no marginal difference, but clear complicity).  

  ---

  ### **Defender Responses & Insulation**  
  Defenders would:  
  ✅ **Concede**: The view is non-consequentialist and doesn’t require marginal difference.  
  ✅ **Dismiss**: Overgeneration cases via "reasonable practice boundaries" (but boundaries remain arbitrary).  
  ❌ **Deny**: That expression is doing the work—but struggle to explain how "joint attribution" functions without it.  

  **Is Insulation a Defect?**  
  Yes. A view that can absorb *any* counterexample by redrawing "the practice" or appealing to "metaphysical joint attribution" is unfalsifiable. It becomes moral dogma.  

  ---

  ### **The Decisive Move**  
  **You cannot escape the expressivist core**. The *only* thing left to ground wrongness in causally inert participation is *what your act symbolizes*: alignment with harm-doers. But if you explicitly reject expressivism (e.g., "I eat this burger regrettably, protesting factory farming"), the participation view still condemns you—revealing its rigidity. Marginalism may be counterintuitive, but it anchors wrongness to *impact*. This view anchors it to an ineffable "joint commitment" that vanishes under scrutiny.  

  **Why this should move you**: It reduces to condemning *identity* ("burger-eater") over *agency* (what you actually *do* in the world). That is morally perilous.
