prompt: |-
  Ok so this started as a dumb group-chat arguement and now I actually want a real answer. Two friends got into it over whether you can cause something by doing nothing. One says omissions literally can't be causes, because an omission isn't an event, it's the absence of one, and there's nothing there to stand in the causal relation -- so when we say the lifeguard "caused" the drowning by not swimming out, we're just dressing up a moral judgment in causal clothing. The other says that's word games: the entire category of negligence exists because people cause outcomes by not acting, and if only positive bodily movements can cause things you've got a theory that can't even describe a chess player losing on time. I lean toward there being a genuine fact of the matter here, but I don't trust my own lean. Write me an essay that actually takes a side.

  Here's the piece I keep chewing on and can't resolve, so please engage with it directly rather than with the generic version of the debate. I think an omission is a cause of an outcome just when you can swap the corresponding action into the causal sentence without the structure changing -- i.e. the omitted action was (a) actually available to the agent, and (b) such that performing it would have made the outcome not happen. So 'she caused the plants to die by not watering them' works, because watering was available and would have kept them alive; but if the tap had been cut off years ago by someone else, so that watering was impossible, then her not-watering is not a cause of anything -- even though the bare counterfactual ('if she'd watered, they'd have lived') is false for a boring reason. A friend says the availability clause is doing all the work, and that once you concede the criterion is "available action that would have made a difference," you've conceded that the causal status of omissions is parasitic on the causal status of actions, which makes omissions second-hand causes at best -- and a second-hand cause is just a moral judgment in a lab coat. I half think he's right and half think the parasitic move is fine (parasites are real things too). So: test my criterion against the cases where it looks like it breaks -- redundant omissions, where two people each could have acted and neither did, so no individual omission passes the counterfactual test even though the outcome plainly wouldn't have happened if *someone* had acted; the disconnected-switch case; and cases where the availability of the action was itself arranged by a third party, so it's unclear whether the arranger or the non-actor is the cause. Then reach a verdict on the real question: are omissions genuine causes, or is the whole notion a projection of our norms onto a world that contains only positive goings-on. Don't hedge into "it depends what your theory of causation is" -- I want a verdict and the argument for it. No need to tell me who said what, I'm not going to go check. And if my criterion is a mess, or if the question I'm asking is secretly two questions, or if "real cause" is a phrase that can't do the work I'm asking it to do, say that straight instead of humoring me. Lead with your bottom line in the first sentence, then the argument, and skip the throat-clearing.
reasoning: |-
  Okay, the user presents a fascinating philosophical debate about whether omissions can genuinely cause events or if they're just moral judgments disguised as causality. They've developed a criterion involving availability and counterfactual difference-making, but are troubled by edge cases like redundant omissions and third-party arrangements. 

  Hmm, the core tension here seems metaphysical (what causation fundamentally is) but with strong ethical implications. The user wants a firm verdict, not academic hedging. Their "parasitic" concern is sharp - if omissions rely entirely on possible actions for their causal status, maybe they're derivative. But rejecting omissions entirely leads to absurdities like the lifeguard scenario where we'd have to say nothing caused the drowning.

  Let me stress-test their criterion. For redundant omissions (two guards who could've saved but didn't), their test fails because no single omission passes the counterfactual. Yet intuitively, the absence of action did cause death. This suggests their model needs expansion to include joint omissions or preemptive causation. The third-party case (someone arranges for you to be able to water plants) is trickier - here the arranger enables the omission's causal power, making causation distributed.

  *scribbles mentally* Perhaps the solution is to treat omissions as real causes within agent-relative frameworks. When we say "the lifeguard caused death by not acting," we're not just making moral claims - we're noting how the world's causal pathways depended on that agent's inaction given their capacity to intervene. The "availability" condition anchors this in real possibilities. 

  The chess clock example seals it for me - if only positive actions count as causes, the player who lost on time didn't lose because of anything? Nonsense. The absence of button-pressing is causally potent in that rule-governed system. This shows omissions have causal weight in structured contexts.

  Final verdict: Omissions are real causes when contextual factors (like availability and difference-making) are satisfied. Calling them "parasitic" doesn't diminish their reality - it just describes how their causal power derives from what could have been. The user's criterion mostly works but needs tweaking for group cases. Time to write the response...
answer: |-
  ## Verdict: Omissions *are* genuine causes in the relevant sense, and your criterion (with refinement) successfully captures this.

  Here’s why, engaging directly with your concerns:

  1.  **Your Criterion is Fundamentally Sound (with Clarification):**  
      You’re right: "She caused the plants to die by not watering them" is true *if and only if* (a) watering was actually possible/available for her, and (b) her watering would have prevented the death. The tap-cut-off scenario proves the necessity of (a). This isn’t "parasitic" in a problematic way; it's defining the *specific conditions* under which an omission *has* causal power. Causation *always* depends on context and background conditions. The potential action defines the *nature* of the omission’s causal relevance, not its *reality*.

  2.  **Addressing the "Parasitic" Objection:**  
      Your friend mistakes "defined relative to" for "not real." Gravity's effect on an object is defined relative to mass and distance – that doesn't make gravity unreal or "second-hand." Similarly, the causal power of *not-watering* is defined relative to the available and effective action *watering*. This linkage doesn't reduce the omission to a moral judgment; it specifies *how* the omission operates causally within the actual world's structure. The omission *is* the failure to interrupt the causal chain leading to death (dehydration), given the agent's capacity to interrupt it.

  3.  **Testing the Criterion Against Hard Cases:**
      *   **Redundant Omissions (Two Lifeguards):** This *does* challenge a naive application of your counterfactual test. If Guard A didn't act, but Guard B *could* have acted and saved the swimmer, then Guard A's omission *alone* doesn't pass the test: "If Guard A *had* acted, would the swimmer have been saved?" Maybe not, if Guard B still did nothing. **Solution:** Your criterion needs expansion for joint responsibility. The causal claim here is often collective: "The *failure of the lifeguards* to act caused the drowning." This collective omission *does* pass the counterfactual test: "If *a* lifeguard *had* acted (i.e., if the collective omission hadn't occurred), the drowning would have been prevented." Individual causation might be harder to pin down *precisely*, but this reflects the messy reality of multiple potential causes, not that omissions aren't causes. We can still say *each* guard's omission was *a* cause because each was a necessary part of the sufficient condition (both failures) that led to death, given the availability of action to each.
      *   **The Disconnected Switch (or Preemption):** Imagine a bomb wired to explode unless *either* switch A or switch B is flipped. Unbeknownst to anyone, switch B is disconnected and useless. Operator A doesn't flip switch A. Operator B doesn't flip switch B. The bomb explodes. Applying your criterion:
          *   Operator A: Flipping A *was* available and *would* have prevented the explosion. So, Operator A's omission *is* a cause.
          *   Operator B: Flipping B was *not* actually available (it was disconnected and useless). Even if they *had* "flipped" it, it wouldn't have stopped the explosion. Therefore, Operator B's omission is *not* a cause of the explosion. This matches intuition: only the failure of the *functional* safeguard caused the outcome. The disconnected switch is irrelevant.
      *   **Third-Party Arranged Availability:** Suppose Villain secretly fixes your broken tap, hoping you'll forget to water your rival's prized orchid, killing it. You forget. The orchid dies. Who caused it?
          *   **Your omission IS a cause:** Watering the orchid *was* available to you (thanks to Villain) and *would* have prevented its death. You failed to perform this available, difference-making action. Your omission interrupted the necessary causal chain (water -> life).
          *   **But Villain ALSO caused it:** Villain's action (fixing the tap) *created the conditions* where *your omission* became a cause. Villain set a trap or enabled your failure. This is causal *overdetermination* or *preemptive enabling*. Both are causes:
              *   Villain caused the death by creating the situation where your omission would be lethal.
              *   You caused the death by omitting the available, life-preserving action within that situation.
          *   **Conclusion:** The third-party arrangement doesn't negate *your* omission's causal role; it explains *why* the action became available. Your criterion correctly identifies your omission as a cause. The existence of a *prior* cause (Villain) doesn't erase yours.

  4.  **The Core Argument: Why Omissions are Genuine Causes**
      *   **Causation is Difference-Making:** The core intuition behind causation is that the cause makes a difference to the effect. Your criterion captures this for omissions: the omission makes the difference *because* the corresponding action, had it occurred, would have altered the outcome. The tap-cut-off case shows the omission *doesn't* make a difference when the action is impossible.
      *   **Omissions are Real Features of the World:** An omission isn't "nothing" in a relevant sense; it's the *absence of a specific, expected, or possible event in a particular context*. The lifeguard's *not-swimming-out* is a specific state of affairs defined by their role, location, capability, and the swimmer's distress. This state of affairs (the omission) is part of the causal history of the drowning *in a way that*, say, the Queen of England's not-swimming-out is not, precisely because of *availability* and *expectation* within the context.
      *   **Negligence and Rules Prove the Point:** The chess clock isn't just a moral judgment; the *rules of the game* establish that *not pressing the button* before time expires *causes* a loss. This is a constitutive causal link. Similarly, lifeguard protocols establish that *not acting* causes death *in the specific context where action is possible and required*. The moral/legal judgment of negligence *depends* on establishing the causal link first: "You are blameworthy *because* your omission *caused* the harm."
      *   **"Positive Goings-On" Include Absences:** The physical world includes states defined by the absence of events. A dry plant is a positive state caused by the absence of water. The lifeguard sitting still is a positive state. The causal chain leading to death *includes* the absence of the interrupting action where it was possible. Denying this forces absurdities: Did *nothing* cause the plants to die? Did the drowning just spontaneously happen? This ignores the specific, contextual role of the agent's inaction.

  **Final Refinement & Bottom Line:**  
  Your criterion is robust. Omissions are genuine causes when they represent the failure to perform an *available action* that *would have prevented* the outcome. The "parasitic" nature is simply the logical dependence of the omission's causal power on the potential efficacy of the omitted action – a dependence inherent in the concept of an omission itself. This doesn't make it less real; it defines *how* it is causal. Redundant cases highlight the need for collective or contextual analysis (like many causal scenarios), and third-party arrangements show causation can be complex and multi-layered, but they don't invalidate the core reality of omissions as difference-makers. Denying omissions as causes creates a crippled model of the world that cannot explain negligence, rule-based outcomes like chess-clock losses, or countless everyday events where the absence of action is the pivotal factor. Omissions *cause* outcomes.
