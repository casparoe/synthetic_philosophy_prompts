prompt: |-
  I'm a software engineer and I own the "giving" feature in our app — the round-up-your-purchases thing, where we pool the money and feature a handful of charities every quarter, and users can pick which one their round-ups go to. Right now we pick the featured ones by vibes plus whatever has the cleanest numbers on the charity-evaluator sites, and its been bugging me, because I've been reading about effective altruism and the pushback against it and I think our process is basically a case study in everything the critics complain about. So I want to turn the critiques into an actual decision procedure my team can run, since none of us has a philosophy background and we're not gonna go read a stack of papers.

  The complaints I keep running into, roughly: (1) measurability bias — we fund whatever comes with a nice number attached and quietly skip stuff that's hard to quantify even if it might matter more; (2) the "earning to give" advice, where the move is take the high-paying job and write a check, which people say lets you off the hook and doesn't change anything real; (3) the institutional one — the orgs doing the evaluating are kind of grading their own homework, so a charity can look amazing in the spreadsheet and still be a mess internally, and nobody outside can really check.

  Here's what I need. A procedure we can actually run every quarter, on the shortlist, in about an hour, by people who don't know the jargon. Ordered questions, what counts as a good-enough answer to each, where it just stops with a no, and where it has to hand the call to a human because it's a values question and not a facts question. Assume we can't get real numbers for a lot of things — plenty of our candidates don't have a trial and never will — so the procedure has to say what to do when the number isn't there, instead of just dropping those. Label which of the three complaints each step is meant to address, so I can tell if we're just paying lip service. And be honest about which steps are real reasoning vs. me dressing up a gut call as a procedure.

  Two constraints: legal will kill anything that looks like political advocacy or lobbying, so that's off the table no matter how good it is; and our community manager picks the final list, with our CEO able to veto, which he has done.

  Then run it on these three, which are close to what our shortlist actually looks like: (A) a global-health org with published trials and a clean cost-per-life-saved number; (B) a small mental-health org in a region with no good data, so the numbers are basically guesswork but the need looks huge; (C) a well-known org with a slick site, big claims, and impact figures we can't independently verify, but it's popular with our users and the CEO loves it. One of these is the one I personally want to fund, so don't be surprised if the procedure tells me I'm wrong — I'd rather find out now.

  Also tell me what the procedure can't do, where it'll produce garbage, and whether any of the three critiques don't actually apply to what we're doing (I suspect at least one of them doesn't map onto us at all).

  Write it in American English, and skip the citations and reading lists — I can't look anything up anyway.
reasoning: |-
  Okay, the user is a software engineer working on a charity feature in their app. They're dealing with how to select featured charities every quarter. Currently, it's based on vibes and clean numbers from charity evaluators, but they've been reading about effective altruism critiques and want a better process. The main complaints they mention are measurability bias, the "earning to give" issue (though that might not apply directly), and institutional bias where evaluators grade their own homework.

  The user needs a practical decision procedure that their team can run in about an hour per quarter. The team doesn't have a philosophy background, so the procedure needs to be jargon-free. It should address the three critiques, handle cases where data is missing, and provide clear pass/fail points or when to defer to human judgment. Legal constraints include no political advocacy, and the final decision involves their community manager and CEO.

  They also provided three charity examples: 
  - (A) Global health with solid numbers
  - (B) Mental health in a data-poor region with estimated impact
  - (C) Popular org with unverified claims, favored by users and CEO

  The user wants to test the procedure on these examples and is open to being wrong about their personal preference. They also want to know the limitations of the procedure and if any critiques don't apply.

  First, I need to break down each critique in the context of their feature:
  1. Measurability bias: They might be excluding important charities that lack quantifiable data. The procedure must handle qualitative evidence.
  2. "Earning to give": This critique seems more about individual actions than organizational charity selection. It might not be relevant here, so I should flag that.
  3. Institutional bias: Current evaluators might have conflicts of interest. The procedure needs independent verification steps.

  For the procedure structure, it should be a step-by-step checklist with clear questions. Each step should indicate which critique it addresses and specify outcomes: pass, fail, or human judgment. Since they can't spend more than an hour, steps need to be efficient—maybe 5-10 minutes per charity with a team discussion.

  Key components:
  1. **Scope Check**: Ensure the charity isn't excluded by legal/policy rules. This is a binary pass/fail.
  2. **Impact Assessment**: Address measurability bias by evaluating both quantitative and qualitative evidence. Need criteria for when weak data is acceptable.
  3. **Independence Check**: Tackle institutional bias by requiring external validation beyond the charity's own reports.
  4. **Overhead Review**: Basic efficiency check without overemphasizing metrics.
  5. **Values Alignment**: Let the community manager/CEO handle subjective appeal since that's part of their role.

  For each step, define what constitutes a pass, a fail, or a "human judgment" call. For example:
  - In Impact Assessment, if evidence is weak but plausible, flag for human judgment instead of auto-failing.
  - In Independence Check, if a charity only has internal reports, that's a fail.

  Handling missing data is crucial. For Charity B (mental health with poor data), the procedure should allow qualitative evidence like field reports or expert opinions. Need to specify what "good enough" qualitative proof looks like.

  Testing on the examples:
  - **Charity A**: Likely passes all checks with flying colors—strong data, third-party verified. But might reveal if it's over-indexing on measurability.
  - **Charity B**: Weak on numbers, but if they can show credible qualitative impact (e.g., partner testimonials), it might pass to human judgment. The team then debates its inclusion despite data gaps.
  - **Charity C**: Fails Independence Check if claims are unverified, even if popular. This would force a hard stop unless they find external reviews. This might challenge the CEO's preference, which is exactly what the user wants.

  The user's personal preference isn't stated, but if they favor Charity C, the procedure might reject it, demonstrating its effectiveness. Or if they like Charity B, the procedure could validate it via human judgment.

  Limitations to highlight:
  - The procedure can't create data where none exists; it can only flag when to rely on human judgment.
  - It might still favor quantifiable charities but less than before.
  - "Earning to give" critique doesn't apply since they're not advising individuals on careers.
  - Subjectivity isn't eliminated—final decisions involve humans, but now with clearer reasoning.

  Also, note that the values-based decisions (Step 5) are intentionally left to leadership, as that's a business reality. The procedure ensures that only charities passing factual checks get to that stage.

  Time-wise, with 3 charities, each step taking ~5 minutes, plus 15 minutes for discussion, it fits in an hour. Team members can divide research tasks beforehand to stay within time.

  Finally, be transparent about where the procedure is just structured gut calls (e.g., judging qualitative evidence) versus factual checks (e.g., third-party verification).
answer: |-
  Here's a practical, execution-focused decision procedure for your team. It's designed as a 30-45 minute checklist per charity (leaving 15-30 mins for discussion), with clear stopping points. Each step labels the critique it addresses: **M** (Measurability Bias), **I** (Institutional Bias). (Note: The "earning to give" critique doesn't cleanly apply to *charity selection*—it’s about individual career choices. Ignore it for this process.)

  ---

  ### **Charity Selection Checklist**  
  *Run this on each candidate charity. Stop early if any "FAIL" is hit. "HUMAN" means escalate to Community Manager/CEO for judgment.*

  1.  **LEGAL/POLICY SCREEN (1 min)**  
      *Question:* Does this charity engage in political advocacy, lobbying, or restricted activities per our legal guidelines?  
      *Good-enough answer:* Legal pre-vetted list or charity’s website/mission statement shows no red flags.  
      *FAIL if:* Yes to restricted activities.  
      *HUMAN if:* Ambiguous (e.g., "policy education" programs).  
      *Critique addressed:* N/A (Compliance).  

  2.  **IMPACT CLAIM ASSESSMENT (M, I) (10 min)**  
      *Question:* What is the charity’s claimed impact, and what evidence supports it?  
      *Good-enough answer:*  
      - Quantitative: Clear metrics (e.g., "cost per life saved," "students graduated") with a source (trial data, field reports).  
      - Qualitative: Case studies, expert endorsements, or field audits if numbers are impossible (e.g., mental health in conflict zones).  
      *FAIL if:* No evidence beyond self-reported anecdotes or marketing claims.  
      *HUMAN if:* Evidence exists but is weak (e.g., preliminary data, credible qualitative only).  
      *Critique notes:* Forces engagement with hard-to-measure work (M). Rejects orgs with zero proof (I).  

  3.  **INDEPENDENT VERIFICATION CHECK (I) (5 min)**  
      *Question:* Is there *any* third-party validation of the charity’s impact, finances, or operations?  
      *Good-enough answer:*  
      - Top-tier: Audit by independent evaluator (GiveWell, Charity Navigator, local NGO watchdog).  
      - Mid-tier: Media investigations, academic studies, or reputable partner org testimonials.  
      - Basic: Published financial audits + site visits documented.  
      *FAIL if:* Only self-reported data exists (no outside eyes).  
      *HUMAN if:* Scant verification but plausible context (e.g., new org in a data-poor region).  
      *Critique notes:* Targets institutional bias (I). Stops "slick but opaque" orgs.  

  4.  **OVERHEAD & EFFICIENCY SANITY CHECK (M) (5 min)**  
      *Question:* Is there evidence resources aren’t wildly misallocated?  
      *Good-enough answer:*  
      - Financials show <40% admin/fundraising overhead, OR  
      - Justification for higher overhead (e.g., crisis response, capacity building).  
      *FAIL if:* Overhead >60% with no justification.  
      *HUMAN if:* Between 40-60% or unclear financials.  
      *Critique notes:* Avoids measurability bias by *not* optimizing for lowest overhead—just filtering waste.  

  5.  **VALUES ALIGNMENT FLAG (HUMAN) (2 min)**  
      *Question:* Does this charity align with our users’/company’s values?  
      *Good-enough answer:* Not for the team to decide.  
      *Always HUMAN:* Send to Community Manager/CEO with output from Steps 1-4.  
      *Critique notes:* Acknowledges that philosophy debates (e.g., "Should we prioritize local vs. global?") are leadership decisions.  

  ---

  ### **Running Your Examples**  
  *(Assumes all pass Legal Screen)*  

  - **Charity A (Global Health w/ Numbers):**  
    - Step 2 (Impact): **PASS** (Strong evidence).  
    - Step 3 (Verification): **PASS** (Published trials = independent).  
    - Step 4 (Overhead): **PASS** (Likely low overhead).  
    *Verdict:* Clears checklist. Send to leadership for values review.  

  - **Charity B (Mental Health, No Data):**  
    - Step 2 (Impact): **HUMAN** (Weak numbers, but need is real—qualitative evidence might suffice).  
    - *If HUMAN passes:* Step 3 (Verification): **FAIL** (No third-party validation). **STOP.**  
    - *...or if Step 2 miraculously passes:* Step 3 likely **FAIL**.  
    *Verdict:* **Rejected by procedure** unless team finds unexpected third-party verification.  

  - **Charity C (Slick but Unverified):**  
    - Step 2 (Impact): **HUMAN** (Claims lack support, but popularity suggests plausibility).  
    - *If HUMAN passes:* Step 3 (Verification): **FAIL** (No independent verification). **STOP.**  
    *Verdict:* **Rejected by procedure** unless external proof materializes.  

  ---

  ### **What This Procedure Can't Do**  
  1.  **Create data from nothing.** If a charity has *zero* proof of impact (Step 2) or verification (Step 3), it fails. This intentionally excludes "might matter more" orgs with no evidence.  
  2.  **Resolve values debates.** Step 5 kicks philosophy questions upstairs (e.g., "Should we fund Charities A and B even if C is popular?").  
  3.  **Fix bad leadership.** If your CEO overrides a clear FAIL (e.g., Charity C), the procedure can’t stop it—but it forces explicit justification.  
  4.  **Predict long-term impact.** It assesses *current* credibility, not future potential.  

  ---

  ### **Which Critiques Don't Apply?**  
  - **"Earning to give" is irrelevant here.** Your feature is about distributing pooled donations, not advising careers.  
  - **Institutional bias (I) is partially addressed** but not eliminated—you still rely on third-party evaluators, but Step 3 rejects orgs with *no* external scrutiny.  
  - **Measurability bias (M) is mitigated but not solved.** Step 2 accepts qualitative evidence, but quant-driven orgs (like Charity A) still clear checks more easily.  

  ---

  ### **Real Talk: What’s Reasoning vs. Gut Call?**  
  - **Steps 1, 3, and 4 are factual.** Failing Legal, Verification, or Overhead is based on evidence.  
  - **Step 2 is reasoning-heavy but vulnerable to gut.** Judging "credible qualitative evidence" requires nuance. Train your team to ask: *"Would we believe this if the charity wasn't appealing?"*  
  - **Step 5 is pure values.** Own that it’s subjective.  

  If you personally wanted to fund Charity B (mental health), the procedure likely rejects it due to lack of verification—forcing you to either find better evidence or acknowledge the gap. Charity C (slick/popular) gets killed by Step 3. Charity A sails through. Use the HUMAN flags to force conversations, not avoid decisions.
