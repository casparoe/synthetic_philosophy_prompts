  What kills the interesting feature? Always the combination. Drop propositionality (like Adams' non-propositional conditionals)? You save nuance but lose embedding. Reject substitution of equivalents? Then probability isn't truth-functional. The defenses trade one loss for another.  

  User's meta-concern about "pattern-matching" is astute. The kinship is real because probability theory is rigid—it admits only one way to handle uncertainty under logical constraints. Any graded concept claiming propositional status gets digested by this rigidity.  

  For naming the family: "Probabilistic Collapse Theorems" fits. Emphasizes the mechanism (probability forcing collapse) and scope (beyond conditionals). Contrast with bare counterexamples: those target specific principles, while collapses show entire frameworks self-destruct under minimal constraints.  

  Final thought: User's hunger for "anatomy" suggests they're constructing a philosophical toolkit. They’ll appreciate the trilemma: propositionality, substitutability, or the bridge principle—sacrifice one or accept collapse. Each surrender has costs, meticulously charted in conditionals literature but less so elsewhere. That’s where their pattern-spotting could break new ground.
answer: |-
  Your inquiry cuts to the heart of probabilistic logic and the tension between graded concepts and classical truth-functionality. The "shape" you describe is indeed a profound and recurring pattern. Let's dissect it anatomically, moving beyond labels to the mechanisms, assumptions, and implications.

  ### 1. **The Canonical Case: The Conditional**
     - **Name:** **Lewis's Triviality Theorems** (David Lewis, 1976). Sometimes called the **"Collapse Result"** or the **"Conditional Triviality Argument."**
     - **The Setup:**
       - **Construction:** The indicative conditional ("If *A*, then *B*").
       - **Interesting Feature:** Its probability seems distinct from the material conditional (¬*A* ∨ *B*). Intuitively, *P*(If *A*, then *B*) should equal *P*(*B* | *A*), not *P*(¬*A* ∨ *B*).
       - **"Mild" Principle:** **Stalnaker's Hypothesis (SH):** *P*(*A* → *B*) = *P*(*B* | *A*), provided *P*(*A*) > 0.
       - **Assumptions:** Conditionals are propositions (have truth values), probabilities obey Kolmogorov axioms, and logical equivalents are probabilistically equivalent (*P*(*X*) = *P*(*Y*) if *X* ≡ *Y*).
     - **The Collapse:**
       Lewis proved that if SH holds for all probabilities *P* and conditionals are propositions, then *P*(*A* → *B*) = *P*(¬*A* ∨ *B*). The conditional collapses to the material conditional. The proof hinges on considering probabilities *conditioned on A* and *conditioned on ¬A*, applying SH, and using the law of total probability, revealing a contradiction unless collapse occurs.
     - **Destructive Lever:** The interaction of **SH**, **propositionality**, and **substitutability of equivalents** under probability. SH ties the conditional's probability tightly to the ratio *P*(*A* ∧ *B*)/*P*(*A*), while propositionality and substitutability force it to behave like a truth-functional connective across all probability distributions.

  ### 2. **The Broader Family: Probabilistic Collapse Theorems**
     - **Name:** While no single universal term exists, **"Probabilistic Triviality"** or **"Collapse under Probabilistic Closure"** captures the essence. They form a subtype of **"Impossibility Theorems for Graded Extensions."**
     - **Defining Features (The Anatomy):**
       - **Graded Notion (G):** A concept (*support*, *explanatory power*, *conditional chance*) intended to capture a subtle, non-truth-functional relationship.
       - **Bridge Principle (BP):** A seemingly weak, plausible constraint linking *G* to probability (e.g., *G*(*A*, *B*) = *P*(*B* | *A*); *G*(*H*, *E*) = *P*(*H* | *E*) - *P*(*H*)).
       - **Closure Assumptions:** *G* is treated as a proposition (has a truth value) or is subject to standard probability calculus (additivity, normalization, substitution of equivalents).
       - **The Collapse:** Under these assumptions, *BP* forces *G* to reduce to a coarse, truth-functional function (e.g., material conditional, logical entailment, tautology/contradiction). The "interesting" non-classical aspect is eliminated.
     - **Differentiating from Other Results:**
       | **Result Type**          | **Key Differentiator**                                                                 |
       |--------------------------|----------------------------------------------------------------------------------------|
       | **Bare Counterexample**  | Shows a *specific instance* where a principle fails; doesn't force systemic collapse.  |
       | **Standard Impossibility**| Shows no system satisfies axioms (e.g., Arrow's Theorem); Collapse shows systems *can* exist, but only trivially. |
       | **Unintended Consequence**| Often an artifact of modeling; Collapse is a *structural necessity* under the assumptions. |

  ### 3. **The Destructive Work: Which Assumption Kills Nuance?**
     The collapse requires *all* components. Removing any *one* can (sometimes) avoid collapse, but at a cost:
     - **Rejecting Propositionality:** Treat the construction as non-propositional (e.g., **Adams' Logic of Conditionals**). *G* is not assigned a truth value or a single probability. Instead, it's evaluated via *assertability* (≈ *P*(*B*|*A*)). This preserves nuance but sacrifices embedding in standard logic (e.g., no negation of conditionals, no Boolean combinations).
       *Cost:* Loss of compositional semantics; restricted expressive power.
     - **Rejecting the Bridge Principle (BP):** Deny the "mild" constraint (e.g., claim *P*(If *A*, then *B*) ≠ *P*(*B* | *A*)). This avoids collapse but severs the intuitive link between the graded notion and conditional probability.
       *Cost:* Loss of the core motivation for *G*; risks ad-hocness.
     - **Rejecting Substitutability of Equivalents:** Allow *P*(*X*) ≠ *P*(*Y*) even if *X* ≡ *Y* classically. This radically alters probability theory (e.g., **hyperintensional** frameworks).
       *Cost:* Breaks fundamental ties between logic and probability; high complexity; loss of useful rules (e.g., *P*(*A*) = 1 - *P*(¬*A*) may fail).

  ### 4. **Kinship in Other Disputes: Genuine Pattern**
     Your intuition is correct. The same structure appears in:
     - **Confirmation/Support:** Attempts to define degree of confirmation *c*(*H*, *E*) as *P*(*H* | *E*) - *P*(*H*) or *P*(*H* | *E*)/*P*(*H*) run into similar collapse issues when treated as propositions subject to probability axioms (Glymour, "Why I Am Not a Bayesian" touches on this). If *c*(*H*, *E*) is a proposition, it may be forced to reduce to *E* ⊃ *H* or similar.
     - **Explanatory Power:** Measures like *P*(*E* | *H*) - *P*(*E* | ¬*H*) or *P*(*H* | *E*) - *P*(*H*) face analogous triviality if explanatory goodness is propositionalized. The subtle link between *H* and *E* collapses into truth-functional dependence.
     - **Causal Influence:** Attempts to define graded causality within propositional frameworks can trivialize to material implication or correlation.
     - **Common Mechanism:** Probability theory (with propositionality and substitutability) is incredibly "rigid." Any function claiming to represent a nuanced relationship but constrained by probability ratios/conditionals *and* subject to truth-functional composition is forced into the mold of classical logic. The rigidity comes from probability's **additivity** and **definition over a Boolean algebra**.

  ### 5. **The Trilemma & Philosophical Implications**
     The collapse argument presents a **trilemma** for preserving a nuanced graded notion *G*:
     1. **Sacrifice Propositionality:** Treat *G* as non-truth-valuable (e.g., dynamic semantics, assertability).
     2. **Sacrifice the Bridge Principle:** Sever the intuitive probabilistic link (risks losing the concept's essence).
     3. **Sacrifice Classical Probability/Logic:** Adopt non-classical frameworks (e.g., hyperintensional logics, non-additive measures like Dempster-Shafer).
     - **Why it's Destructive:** The "mild" BP appears operational (how to *calculate* *G*), but combined with closure assumptions, it becomes *constitutive* (what *G* fundamentally *is*), leaving no room for nuance.
     - **Formalism's Bite:** This highlights how formal tools (probability + classical logic) actively constrain conceptual possibilities. What seems like a "free parameter" (how to define *G*) is fixed by the formalism's structure.

  ### In Summary
  - **Conditional Case:** Lewis's Triviality Theorems.
  - **Family:** **Probabilistic Collapse Theorems** (or **Graded Concept Collapse**). Its hallmark is a weak bridge principle + probability axioms + propositionality forcing a nuanced concept into a classical truth-functional mold.
  - **Destruction Source:** The *combination* is lethal. No single assumption is solely responsible; their interaction creates an inescapable rigidity.
  - **Pattern Validity:** Your pattern-matching is sound. The structure recurs wherever a graded concept seeks propositional status within standard probability. The kinship lies in the **mathematical structure of probability over Boolean events**.
  - **Anatomy Lesson:** The collapse reveals the hidden strength of "mild" probabilistic constraints under logical closure. Preserving nuance requires sacrificing one pillar of the classical framework—propositionality, the bridge principle, or classical probability/logic itself—each with significant conceptual costs. This isn't mere impossibility; it's **forced reductionism**.
