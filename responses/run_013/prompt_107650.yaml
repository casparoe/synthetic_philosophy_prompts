  First, the conditional case is clearly Lewis's Triviality Theorem (1976). The name is standard, but the user likely knows that; they're probing its mechanics. The principle they mention—P(If A, B) = P(B|A)—is Stalnaker's Hypothesis. Lewis showed it forces conditionals to reduce to material implication when combined with standard probability laws. The destructive lever? Embedding conditionals in propositional logic plus probability's substitution of equivalents.  

