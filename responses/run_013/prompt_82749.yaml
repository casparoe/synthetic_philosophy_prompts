prompt: |-
  I'm a novelist — third book, out next spring, about two rival AI labs that have to agree on a joint safety protocol before a launch deadline, and the whole plot turns on the fact that neither side can predict how the other side's negotiating software will actually behave. So I've been reading my way into the technical literature on 'safe Pareto improvements', and next month I'm doing a long on-stage conversation with a researcher who works on them (I'd rather not put her name in this, since she'll be speaking for herself and I don't want to put words in her mouth). I'm supposed to come with questions and I've got alot of half-formed ones, so I need help. Could you draft eight to ten real questions, each with a follow-up keyed to the answer she's most likely to give — not "so what is a safe Pareto improvement?", but the ones you'd ask after you've already read the papers.

  Here's roughly where I've got to, so you can aim. As I understand it, the setup is a game where each player hands the decision to a delegate or a program, and you can't form probabilities about what the other delegate will do; a safe Pareto improvement is a transformation of the game such that everybody is necessarily better off than under the default way of playing. The part I keep chewing on is that these results seem to get proved using assumptions about how games relate to each other — isomorphic games get played isomorphically, strictly dominated strategies get stripped out — which sound to me like assumptions about how agents play, dressed up as logic. So I want at least one question pressing on whether "no probabilistic beliefs about the other delegate" really means "no assumptions", and a follow-up ready for the reply that those are just symmetry principles everyone already accepts. I also want one on what "safe" is doing in the name: safe for the players, sure, but the two delegating parties can make themselves better off at the expense of everyone standing outside the game, and my whole novel is basically that, so I want her to either own it or tell me why it isn't the framework's business. And one on why a Pareto improvement needs a whole theory to get off the ground — if both sides would genuinely be better off, what stops them? — with the follow-up being, well, isn't that just the old problem of which equilibrium people land on, and what does the new machinery add that game theory didn't have? If any question would just make her restate a definition, cut it.

  Two more things I'd like in there. She's also worked on versions where players commit in advance to behave as a function of what the other side's default play would have been, and that seems to presuppose you can credibly reveal your own default — which in real life is exactly the thing people lie about, so I want a question about whether that's a modelling convenience or a hidden assumption. And if there's a result in this literature that reads like a ceiling rather than a recipe — some bound past which these improvements can't be guaranteed for anybody — build a question around that, plus one on what happens when there's no well-defined "default" at all, which is every negotiation I've ever written and, I suspect, most of them that happen. Keep the whole set in a register I can actually say out loud on a stage in front of an audience that mostly hasn't read the papers.
reasoning: |-
  Okay, the user is a novelist working on their third book about rival AI labs negotiating a safety protocol. They need help crafting 8-10 technical questions for an on-stage conversation with a researcher on "safe Pareto improvements." They've already done significant research but want deeper, non-basic questions that avoid definition restatements. 

  First, let's unpack their core concerns: They're suspicious that the "no assumptions" framework secretly relies on behavioral assumptions disguised as logic. They want to expose whether "safe" actually permits harming outsiders (central to their novel's plot). They're skeptical about why Pareto improvements need complex theory when mutual benefit seems obvious. They're also wary about modeling choices like pre-commitments revealing "default" strategies, which feels unrealistic. And they want to probe the boundaries—when the framework fails or lacks clear defaults.

  Hmm, their expertise level is high for a novelist—they've clearly grappled with isomorphism and strategy dominance. But we must keep questions stage-appropriate: no jargon dumps, but no oversimplifying either. The researcher's likely replies matter too; we need follow-ups that anticipate defensive moves (e.g., her calling symmetry principles "universal" or dismissing outsider harm as "out-of-scope"). 

  For the "no assumptions" question, I'll attack via epistemology: if agents strip dominated strategies *identically*, isn't that a shared algorithm? Follow-up should challenge whether "rationality" is culturally neutral. For the "safe" question, we'll force her to confront externality ethics—follow-up locks in whether she sees it as a feature or bug. The Pareto theory question needs steelmanning: I'll let her explain coordination failures first, then press on added value beyond Nash. 

  Ah—and they want a "ceiling" question! There's a result about ordinal vs cardinal utilities affecting implementability. Perfect. For the "no default" issue, I'll cite real-world ambiguity and ask how to salvage the framework. Pre-commitment question must highlight the lie gap: if real negotiators misrepresent defaults, does the math collapse? 

  ...Wait, they mentioned "delegates" as AI programs. That's juicy! Added a question on whether unpredictable algorithms break isomorphism assumptions. Follow-up: what if one lab's AI *wants* to be unpredictable? 

  Final list tightrope: rigorous but performative. No dry academia—phrased like "Help me understand why..." or "In my plot..." to keep it novelistic. Added their "chewing on" metaphor for cohesion. Skipped anything rehashing basics; every question cuts to their thematic pain points. 

  *Double-checks*: Did I miss their request about equilibrium landing? Yes—folded into Q3 follow-up. Outsiders? Q4. Default ambiguity? Q8. All covered. Researcher won't get to duck hard questions; novelist comes off prepared but curious, not hostile. Stage-ready.
answer: |-
  Here are 10 targeted questions (+ follow-ups) addressing your core concerns, designed for an on-stage dialogue with depth and avoiding definitional rehashing. Each targets the philosophical/practical tensions you've identified:

  1.  **Question:** "The proofs for Safe Pareto Improvements rely on structural assumptions like isomorphism across games and iterative removal of dominated strategies. While framed as 'no probabilistic beliefs,' doesn't this implicitly encode a very specific model of *how* rational agents *must* reason – essentially assuming they all follow identical, universal deduction rules? Is this 'no assumptions' or 'very strong shared rationality assumptions'?"
      *   *Likely Reply:* "It's about minimal shared rationality principles any agent capable of strategic delegation would need; it's not behavioral, it's about logical possibility under perfect reasoning."
      *   **Follow-Up:** "But doesn't that 'perfect reasoning' requirement *itself* become a behavioral assumption? In my novel, the labs *don't* assume the other side reasons identically – that's the core conflict. How does the framework handle fundamentally *different* deduction algorithms, or agents who suspect the other side uses different dominance criteria?"

  2.  **Question:** "The 'safe' in SPI feels crucial but potentially narrow. It guarantees safety *for the delegating players within the defined game*. What unsettles me, and drives my plot, is that this safety can be achieved by shifting costs or risks *onto parties outside the game* – like society, or the environment the AIs will operate in. Does the SPI framework explicitly acknowledge this potential for negative externalities as a feature, a limitation, or something outside its scope?"
      *   *Likely Reply:* "SPI focuses on improving outcomes *for the players in the game*. Externalities are important but require defining a larger game or different welfare functions; SPI isn't designed to solve that."
      *   **Follow-Up:** "So, in essence, SPI provides powerful tools for collusion *against* outsiders? Shouldn't the 'safety' claim carry an asterisk – 'safe for us, potentially dangerous for them' – especially when applied to something like AI governance where externalities are catastrophic?"

  3.  **Question:** "Intuitively, if a move makes *everyone* strictly better off, why wouldn't rational players just do it? Why does achieving a Pareto improvement require this sophisticated machinery of delegation and transformation? Isn't this just re-discovering the coordination/equilibrium selection problem in a new guise?"
      *   *Likely Reply:* "Without commitment or transformation, players might be stuck in a bad equilibrium (like mutual defection). The 'machinery' forces coordination on a better outcome that might not be reachable via simple best-response dynamics due to strategic uncertainty or lack of trust."
      *   **Follow-Up:** "What does the SPI approach *add* conceptually to our understanding of overcoming coordination failures, compared to classic game theory solutions like cheap talk, repeated interaction, or correlated equilibrium? Is it primarily about achieving improvements *without* needing communication or trust?"

  4.  **Question:** "A key mechanism involves players committing to strategies that are functions of the *other side's default strategy*. But this seems to presuppose that each side can credibly *reveal* or *commit to revealing* what their default strategy *would have been*. In reality, default positions are often the most jealously guarded secrets in negotiations – the thing people lie about strategically. How does the framework handle this potential for deception about one's true 'default'?"
      *   *Likely Reply:* "The theory often assumes truthful revelation of default strategies as part of the commitment mechanism, or focuses on settings where the default is verifiable through the transformation itself."
      *   **Follow-Up:** "Doesn't that make the 'default strategy' less of a real strategic choice and more of a modeling artifact? If realistic negotiation involves bluffing and misrepresentation about fallback positions, doesn't this core mechanism become fragile or inapplicable?"

  5.  **Question:** "I've seen results suggesting SPI transformations can sometimes guarantee only *ordinal* improvements (you're better off, but we can't say how much) or are limited by the underlying utility structure. Is there a clear theoretical 'ceiling' – types of games or utility configurations where *no* safe Pareto improvement is possible, even in principle?"
      *   *Likely Reply:* "Yes, limitations exist. For instance, if the only Pareto improvements involve complex trade-offs requiring precise interpersonal utility comparisons (which SPI avoids), or in zero-sum-like situations after dominance is removed. Some games are simply conflictual at their core."
      *   **Follow-Up:** "How diagnostic is this? If labs discover their interaction has *no* possible SPI, does that tell them negotiation is fundamentally hopeless, or just that they need a radically different approach outside this specific framework?"

  6.  **Question:** "The core results often assume a single, well-defined 'default' way of playing the game. But in messy real-world negotiations – like my AI labs – there rarely *is* one obvious default. There are multiple potential threats, promises, and fallback scenarios depending on various contingencies. How does the SPI framework accommodate or fail in situations lacking a clear, unique default?"
      *   *Likely Reply:* "The 'default' is a theoretical anchor. In practice, you might need to agree on a focal point or analyze multiple potential defaults. The transformation logic applies relative to whatever default you specify."
      *   **Follow-Up:** "Doesn't the *choice* of which default to transform relative to then become a major new source of strategic complexity and potential conflict, potentially undermining the whole point? How do you select the 'right' default without getting stuck in a prior negotiation?"

  7.  **Question:** "Delegation is central – players hand off to a program or delegate. But in your work on commitment functions, the 'delegate' is essentially defined by the function mapping the other's default to your action. Isn't there a risk of infinite regress here? How do you ensure the *designer* of this function (the human principal) is actually better off, especially if the function leads to outcomes the principal wouldn't have chosen directly?"
      *   *Likely Reply:* "The commitment function is chosen *by* the principal precisely *because* it leads to a better expected outcome given the transformation mechanism and the assumption the other side does the same. It's a pre-commitment device."
      *   **Follow-Up:** "But this assumes the principal can perfectly foresee the outcome of this complex interaction of functions. Isn't predicting the delegate's behavior functionally equivalent to predicting the other player, which the 'no probabilistic beliefs' axiom was supposed to avoid? Where does the predictability really come from?"

  8.  **Question:** "Much of the SPI literature focuses on one-shot interactions. Negotiations, especially high-stakes ones like AI safety, are often repeated or embedded in ongoing relationships with reputation and learning. How robust are SPI results in dynamic settings? Can the transformations themselves become signals that affect future interactions?"
      *   *Likely Reply:* "Static models are foundational, but dynamics are crucial. SPI transformations could build trust for future cooperation, or alternatively, be seen as exploitative gambits harming reputation. Extensions to repeated games are an active area."
      *   **Follow-Up:** "Does introducing dynamics ultimately pull us back towards needing probabilistic models of how the other side interprets our actions and learns over time, potentially undermining the original motivation for SPI?"

  9.  **Question:** "The 'no probabilistic beliefs' axiom feels like the philosophical heart of SPI. But in practice, humans (and likely sophisticated AI) *do* form beliefs, however imperfect. Is SPI best seen as a tool for achieving robustness against *extreme* uncertainty, or as a prescriptive ideal for how agents *should* interact when forming beliefs is impossible or forbidden?"
      *   *Likely Reply:* "It's primarily about robustness under maximal uncertainty – a 'worst-case' guarantee. It shows what's possible *even if* you can't form beliefs. It doesn't preclude using beliefs if you have them; it provides a safe baseline."
      *   **Follow-Up:** "In a scenario like my novel, where labs *could* form some beliefs but choose delegation precisely because they *distrust* each other's models or honesty, is SPI the right tool, or is it solving a harder problem than necessary?"

  10. **Question:** "Looking beyond theory, what's the most significant *practical* hurdle you see in applying SPI concepts to real-world adversarial negotiations, like those between competing tech entities or nations? Is it the modeling complexity, the commitment mechanisms, the externalities, or something else entirely?"
      *   *Likely Reply:* "Likely the credible commitment mechanisms and agreeing on the transformation rules/defaults in an environment of distrust. The theory shows possibility; implementation requires overcoming real-world friction."
      *   **Follow-Up:** "Given those hurdles, does SPI primarily offer a valuable *normative benchmark* ('this is what ideal cooperation looks like') or are there specific, tractable elements that could be injected into real negotiations today to steer towards safer outcomes?"

  **Key Strengths for Your Context:**

  *   **Presses "No Assumptions":** Q1 & Follow-Up directly challenge the epistemology of the rationality assumptions.
  *   **Probes "Safe" Meaning:** Q2 & Follow-Up force the externality issue central to your plot.
  *   **Questions the Need for Theory:** Q3 & Follow-Up ask "why not just cooperate?" and probe novelty vs. game theory.
  *   **Challenges Default Revelation:** Q4 & Follow-Up target the realism of revealing fallback positions.
  *   **Seeks Ceilings/Bounds:** Q5 & Follow-Up ask about inherent limitations.
  *   **Tackles Ambiguous Defaults:** Q6 & Follow-Up address messy reality vs. clean models.
  *   **Stage Ready:** Language is conversational but precise, avoids excessive jargon, and frames concepts accessibly ("shifting costs," "stuck in mutual defection," "fragile," "normative benchmark").

  These questions position you as deeply engaged with the *tensions* within the theory, not just its mechanics, perfectly aligning with your novel's themes and the desire for a substantive, audience-accessible dialogue. Good luck!
