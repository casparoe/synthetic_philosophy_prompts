prompt: |-
  I'm a third-year philosophy student, and this term I'm taking a seminar on the ethics of philanthropy that spends most of its time on effective altruism and its critics. Last week we read about earning to give — the proposal that someone with a flair for something lucrative should take the lucrative job and donate a large share of the salary rather than work directly on the cause — and I got into an argument afterwards that I still can't settle. My friend's objection is not the familiar complaint that you can't put a number on everything, which I think is cheap. She puts it this way. EA ranks interventions by expected good per dollar, so it can only rank interventions whose good shows up as something the analysis can see: a life saved, an illness averted, an income raised. She calls this the legibility filter. Her second claim is the interesting one: the filter is not merely a limit on what EA can see but a bias in what it recommends, because what survives the filter is what can be produced in units at a roughly stable marginal cost, and that systematically favours bednets, deworming, and cash transfers over goods that aren't unit-producible — a norm changed, a movement built, a procurement policy shifted, or, in the earning-to-give case specifically, the value of a particular person's doing the work herself rather than paying a stranger to do it. On this view EA's rankings are not a discovery about where the good is but a discovery about what is purchasable at the margin. She adds a third twist: the large funders who set the agenda have an institutional incentive to prefer interventions they can defend with a spreadsheet, so the bias is self-reinforcing — the more EA money goes to legible things, the more legible things there are to fund.

  I half agree and half think this is a counsel of despair dressed up as insight, so I need to write an essay that decides. Please weigh the case for the critique against the best reply to it — that a method which cannot be checked against anything is not a method, and that the alternative to ranking by measurable expected value is not a richer ranking but no ranking at all — and then reach a verdict on a sharp question: does the legibility filter show that EA's comparative rankings are untrustworthy, so that "fund the bednets rather than the advocacy campaign" is an artefact of the metric, or does it show only that the rankings are incomplete and EA's rhetoric of optimality overblown, while the rankings themselves survive? Take seriously the possibility that the critique bites hardest against earning to give and least against ordinary donation advice, and explain why the difference arises if it does.

  Be concrete: include at least one worked comparison between a specific legible intervention and a specific non-legible one, say what would have to be true for the fungibility point to be a genuine objection rather than a restatement of the obvious fact that some goods resist measurement, and consider whether the same argument could be run against every rival methodology — and if it can, say what that shows. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Hmm, the user is a third-year philosophy student taking a seminar on the ethics of philanthropy, focusing on effective altruism (EA) and its critics. They're grappling with a specific critique called the "legibility filter" from a friend, which argues that EA's method of ranking interventions by measurable outcomes like lives saved per dollar inherently biases it toward certain types of interventions—like bednets or cash transfers—over less quantifiable ones like norm changes or movement-building. The user needs to write an essay that evaluates this critique, weighing it against EA's defense that measurement is essential for accountability, and reach a verdict on whether the legibility filter makes EA's rankings untrustworthy or just incomplete.

  The user outlines several key points: the legibility filter as a bias favoring unit-producible goods, the self-reinforcing nature due to institutional preferences for spreadsheet-defendable interventions, and the need to consider if this critique applies differently to "earning to give" versus ordinary donations. They also want concrete examples, like comparing a legible intervention (e.g., bednets) with a non-legible one (e.g., an advocacy campaign), and to address whether this is a unique flaw or a general problem for any methodology.

  I need to structure my response clearly, starting with a bottom-line verdict upfront. From my knowledge, the legibility filter is a real issue in EA discussions—it's not just about measurement limits but about how quantification shapes priorities. EA often relies on cost-effectiveness analyses, which work well for discrete, measurable outcomes but struggle with systemic changes. For instance, deworming programs can show clear reductions in disease incidence, while shifting procurement policies might have diffuse, long-term benefits that evade easy metrics. This isn't just "some things are hard to measure"; it's that the measurement approach systematically undervalues interventions where good isn't unitized.

  The best EA reply would be that without measurable criteria, prioritization becomes arbitrary or subjective—essentially, "no ranking at all" is worse than an imperfect one. But the critique goes deeper: by focusing on marginal costs, EA might miss out on high-impact, non-fungible actions, like a specific leader's role in a movement, which can't be replaced by throwing money at it. For earning to give, this is especially acute because if the person doing the work has unique skills or influence, paying a stranger might not achieve the same good, even if EA metrics suggest otherwise.

  For the concrete comparison: take bednets vs. an advocacy campaign for malaria policy reform. Bednets have a clear cost per life saved, say $3,000 per life, based on distribution and usage data. An advocacy campaign might aim to change government spending, potentially saving more lives at lower cost if successful, but success is probabilistic and hard to attribute—e.g., a 10% chance of shifting $1 billion in funding, which could save thousands of lives indirectly. If EA ignores this because it's not legible, it biases funding toward bednets even if advocacy is more impactful. The objection becomes genuine if EA dismisses such interventions entirely rather than developing rough proxies.

  The critique could apply to other methodologies too, like cost-benefit analysis in economics, but that doesn't invalidate it—it shows that any quantitative approach has blind spots, and EA should acknowledge this rather than claim optimality. The difference for earning to give is that it involves personal substitution: if an EA proponent has unique talents for advocacy, earning to give might waste that potential, whereas for donations, the issue is about allocation across interventions.

  My verdict: the legibility filter doesn't make EA's rankings untrustworthy for comparable interventions, but it reveals incompleteness and overblown rhetoric, especially for systemic changes and earning-to-give cases. I'll start with that bottom line, then unpack the reasoning step by step, including the concrete example and why the critique is more than just "measurement is hard."
answer: |-
  **The legibility filter critique shows that EA's comparative rankings are incomplete and its rhetoric of optimality overblown, particularly for systemic interventions and earning-to-give, but does not render its core cost-effectiveness analyses untrustworthy for directly comparable, unit-producible interventions.**  

  ### The Case for the Critique  
  1. **The Legibility Filter as Bias**: EA’s reliance on quantifiable outcomes (e.g., lives saved, DALYs averted) creates a selection effect. Interventions like distributing bednets ($3,000–$5,000 per life saved) or deworming pills ($100 per DALY averted) dominate rankings because their impacts are discrete, attributable, and scalable at stable marginal costs. In contrast, systemic interventions—e.g., a campaign shifting a government’s $1B malaria procurement policy to prioritize bednets—face measurement hurdles:  
     - Success is probabilistic (e.g., 20% chance of policy change).  
     - Impacts are diffuse (e.g., indirect effects on manufacturing, norms, or future advocacy).  
     - Costs are lumpy (e.g., $500K for lobbying may yield zero or transformative results).  
     EA struggles to compare $500K for advocacy (expected value: 20% chance of saving 10,000 lives) to $500K for bednets (guaranteed 100 lives saved), as the former’s variance and non-linearity resist standardization. This biases funding toward "marginal-dollar-friendly" goods.  

  2. **Institutional Reinforcement**: Large EA funders (e.g., Open Philanthropy) favor interventions defensible via spreadsheets to satisfy accountability demands. Funding legible interventions generates more data, creating a feedback loop (e.g., 80% of GiveWell’s top charities involve health/product distribution). This crowds out exploration of "illegible" high-impact paths, like movement-building, where early grants to AI safety (e.g., MIRI) relied on speculative models.  

  3. **Special Problem for Earning-to-Give**: When Alice (a talented policy advocate) earns to give instead of working directly, EA’s framework treats her donations as fungible with her labor. But if Alice’s unique skills make her 10× more effective at advocacy than a proxy hire, funding a stranger via her donations wastes comparative advantage. EA’s metric cannot capture this "personal fit" premium, making earning-to-give appear optimal when it may not be.  

  ### The Best Reply: Measurement as Necessary Discipline  
  EA’s core defense is epistemic: without quantification, prioritization collapses into intuition or bias. The alternative isn’t "richer ranking" but unanchored speculation. For example:  
  - Bednets have proven efficacy via RCTs; policy advocacy’s impact is often inferred post hoc (e.g., the Global Fund’s successes involved complex coalitions, not clean attribution).  
  - EA *can* incorporate less legible interventions by using explicit uncertainty adjustments (e.g., GiveWell’s room for more funding reports) or expected value calculations (e.g., 80,000 Hours’ career advice).  
  - The critique applies to *all* methodologies: Even qualitative frameworks (e.g., Capabilities Approach) must prioritize, risking different biases. Rejecting quantification for its imperfections is indeed "despair dressed as insight."  

  ### Why the Critique Bites Differently  
  - **Ordinary Donations**: Rankings for health interventions (bednets vs. vaccines) remain trustworthy *within their domain*—the legibility filter is a known boundary, not a fatal flaw. EA can (and does) flag uncertainty (e.g., GiveWell’s "moral weights" disclaimers).  
  - **Earning-to-Give**: Here, fungibility assumptions break down. If Alice’s advocacy has non-replicable elements (e.g., her credibility in a community), "paying a stranger" is inadequate substitution. EA’s framework lacks tools to value this, making earning-to-give advice riskier.  

  ### Verdict on the Filter  
  The legibility filter does **not** make "fund bednets over advocacy" an untrustworthy artifact *when comparing like with like* (e.g., bednets vs. condom distribution). However, it *does* expose:  
  1. **Incompleteness**: EA cannot rank bednets against systemic change robustly, as the latter’s expected value involves irreducible uncertainty.  
  2. **Overblown Rhetoric**: Claims of "optimality" are defensible only for marginal, unit-producible goods; elsewhere, they mask methodological constraints.  
  3. **Systemic Blind Spots**: The filter’s self-reinforcing nature may cause EA to undervalue patient capacity-building (e.g., funding African-led NGOs over distributing Western goods).  

  **Concrete Example**: $100K for bednets in Malawi (legible) vs. $100K for a local advocacy group pushing Malawi’s government to increase health spending (illegible).  
  - EA ranks bednets higher: Saves ~20–30 lives directly.  
  - Yet if advocacy has a 10% chance of securing $10M more in health funding (saving 500+ lives), its expected value (50 lives) dwarfs bednets. EA struggles here because success depends on political context, leader charisma, and luck—factors resisting marginal costing. The critique is no mere "measurement is hard" gripe; it shows EA’s model may *systematically* misprice high-variance bets.  

  **Final Judgment**: EA’s rankings survive as useful heuristics for fungible, scalable interventions but are incomplete guides for philanthropy’s full scope. The solution isn’t abandoning quantification but supplementing it with explicit uncertainty budgets, diversified portfolios, and humility about optimality—especially for earning-to-give.
