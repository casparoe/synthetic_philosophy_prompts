prompt: |-
  Something that's been bugging me while writing up my methods section, and I keep putting off thinking it through properly. In practice we just slap a flat prior on a parameter and call it "non-informative," on the grounds that we've got no reason to favour one value over another -- and somehow that's supposed to make the analysis objective. But Bertrand's chord thing is the classic embarrassment (same set-up, three different "uniform" answers depending on which variable you make uniform), and even Jeffreys priors only stay flat under certain parameterizations, so the choice of variable is quietly doing all the work. What does the everyday habit of grabbing the "obviously" symmetric prior actually presuppose about ignorance and about what probability is? Which rival pictures does it rule out -- straight subjective Bayesianism, fiducial-style reasoning, reference priors -- and is the habit even internally consistent once you notice that reparameterization flips the answer? It feels definately fine in simple finite cases, so I'm really asking what theory it commits you to, and what would have to change in day-to-day Bayesian practice if we gave up the principle of indifference and just owned that the prior is a modelling choice. Try to separate what the practice strictly needs from what it merely tends to travel with.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're struggling with the use of flat priors in their methods section, calling them "non-informative" for objectivity, but they're aware of Bertrand's paradox and how reparameterization affects Jeffreys priors. The core issue seems to be the philosophical underpinnings of this practice. What does assuming a symmetric prior really mean? And what does it commit you to?

  First, I need to recall Bertrand's paradox. Three different "uniform" priors for a chord in a circle give different probabilities, showing that uniformity isn't invariant under reparameterization. Jeffreys priors handle this by being invariant under monotone transformations, but they depend on the likelihood. So the choice of parameterization matters, which challenges the idea of a truly non-informative prior.

  The user is asking about the everyday habit of using symmetric priors. What theory does this presuppose? They mention subjective Bayesianism, fiducial inference, reference priors. I should break down each. Subjective Bayes sees priors as personal beliefs, so flat priors are just another choice. But in practice, people treat them as objective, which leans more towards objective Bayesianism, aiming for priors based on information-theoretic principles.

  Then there's invariance. Using a flat prior implies that the parameter space has a uniform structure, like a location parameter. But for scale parameters, a flat prior on log scale is uniform. Jeffreys priors achieve this invariance. So the habit assumes that the chosen parameterization is the "natural" one where uniformity represents ignorance. But that's a big assumption.

  The user also asks what happens if we give up the principle of indifference. If priors are just modeling choices, then every prior needs justification. This moves towards subjective Bayes or reference priors which use the likelihood. But reference priors can be complex and depend on the model, which might not be practical for everyday use.

  I should consider the practical implications. In simple finite cases, uniform priors are straightforward. But in continuous spaces, reparameterization causes issues. The habit of using flat priors might still be useful for computational simplicity, but it requires acknowledging that it's a choice, not a default. 

  The user's deeper need might be to justify their methods section. They want to know if using flat priors is defensible. They might be looking for a way to explain their choice without claiming false objectivity. So separating what the practice needs (a prior that's computationally feasible and somewhat justifiable) from what it implies (assumptions about parameterization) is key.

  Also, the user mentions fiducial inference. Fiducial tries to avoid priors but has its own issues. If they're using flat priors, they're not in fiducial territory. Ruling out alternatives: flat priors align with objective Bayes or Jeffreys when applicable, but clash with strict subjectivism where any prior is personal.

  Internal consistency is another point. Since reparameterization changes the prior, the habit isn't consistent unless the parameterization is chosen carefully. Jeffreys priors fix this but are harder to implement. So everyday practice might rely on approximate symmetries without strict invariance.

  In summary, the user needs to recognize that flat priors are a modeling choice. The theory they commit to is a form of objective Bayesianism that seeks invariance or reference points. Giving up indifference means being explicit about prior selection, which could involve sensitivity analysis or adopting reference priors where feasible. But in day-to-day work, the convenience of flat priors might still hold, as long as it's acknowledged as a pragmatic choice.
answer: |-
  Your frustration hits the nerve center of foundational debates in Bayesian statistics. Let's dissect the habit of "slapping on a flat prior" and what it truly commits you to, separating the practice's core needs from its philosophical baggage.

  ### What the Practice Strictly Needs & What It Presupposes
  1.  **Minimal Commitment: A Quantified Starting Point**
      *   **Needs:** A mathematically defined prior distribution allowing Bayes' theorem to operate. A flat prior provides *a* starting point that's computationally simple and avoids *explicitly* favoring specific values *within the chosen parameterization*.
      *   **Presupposes:** Probability represents *degree of belief* (Bayesian interpretation). Ignorance *can* and *should* be represented by *some* probability distribution. The Principle of Indifference (PoI) *might* be valid *if* the chosen parameterization truly reflects the underlying symmetries of the problem.

  2.  **The Illusion of Objectivity & the Parameterization Problem**
      *   **Presupposes:** There exists a "natural" or "privileged" parameterization where uniformity *does* represent ignorance. This is the crux. Bertrand's paradox brutally exposes this presupposition as often unfounded.
      *   **Implies:** The analyst believes the chosen variable (e.g., length, angle, log-odds) is the one where equal intervals correspond to "equal degrees of ignorance" or equal intrinsic plausibility *before seeing the data*. This is a strong metaphysical claim about the structure of ignorance relative to the parameter space. Jeffreys priors attempt to formalize this by demanding invariance under reparameterization, but they achieve it by *tying the prior to the model's likelihood* (via the Fisher information), not pure ignorance.

  3.  **Presupposed Theory: Objective Bayesianism (Flawed or Aspirational)**
      *   **Commits to:** A flavor of **Objective Bayesianism**. The core idea is that there exists a unique, "correct" non-informative prior representing genuine ignorance, discoverable through principles (like invariance, maximum entropy, reference analysis). The flat prior habit assumes this unique prior *should* be flat in the obvious/working parameterization.
      *   **Rivals Ruled Out:**
          *   **Strict Subjective Bayesianism:** Rejects the *possibility* of a unique non-informative prior. Priors *are* subjective beliefs. Using a flat prior is just another subjective choice, not inherently more "objective" than any other. The habit implicitly rejects this by presenting the flat prior *as if* it were the objective default.
          *   **Fiducial Inference:** Attempts to derive distributions without priors. The very act of specifying *any* prior (flat or otherwise) rules out pure fiducial reasoning. Fiducial also suffers from paradoxes similar to Bertrand's.
          *   **Reference Priors (as distinct from simple flat/Jeffreys):** While *aiming* for objectivity, reference priors are often more complex and explicitly depend on the experimental design/asymptotic goals. The simple flat prior habit assumes a shortcut exists ("just use uniform here") that bypasses this complexity, implying a simpler underlying principle (like PoI) suffices. In practice, reference priors often *coincide* with Jeffreys or flat priors in simple cases, masking the difference.

  4.  **Internal Consistency?**
      *   **No, without additional justification.** Bertrand's paradox demonstrates the inconsistency: applying the PoI naively to different, equally valid parameterizations of the *same problem* yields different probabilistic conclusions. This directly contradicts the claim that the prior represents "ignorance" in an objective way. The habit is internally consistent *only* if:
          *   The problem has inherent symmetries dictating a unique "natural" parameterization (e.g., location parameter for translation invariance).
          *   You *define* "ignorance" as uniformity *in your chosen parameterization* and accept that "ignorance" is parameterization-dependent (a radical and unsatisfying view).
      *   Jeffreys priors restore consistency *under reparameterization* but sacrifice the idea of a prior based *solely* on ignorance – they are inherently tied to the *model structure* (the likelihood).

  ### What Changes if We Give Up the PoI & Own the Prior as a Modeling Choice
  Abandoning the illusion of objectivity provided by the PoI/flat-prior-default would significantly shift day-to-day Bayesian practice:

  1.  **Explicit Justification Required:** Every prior choice, *including a flat prior*, needs justification beyond "it's non-informative" or "it's obvious". Justification could be:
      *   **Subjective Elicitation:** Based on genuine expert knowledge.
      *   **Computational Convenience:** "It makes the model tractable/conjugate."
      *   **Regularization:** "It helps stabilize estimates in high dimensions."
      *   **Sensitivity Analysis:** "We tried plausible alternatives (e.g., different scales, weakly informative priors) and conclusions were robust."
      *   **Modeling Context:** "For this *location* parameter, translation invariance suggests uniformity is appropriate." (This invokes symmetry, not pure ignorance).
      *   **Reference/Jeffreys:** "We use the Jeffreys prior to achieve invariance/reference properties for this model."

  2.  **Death of "Non-Informative":** The term becomes recognized as misleading. We'd use more precise terms:
      *   **Vague/Diffuse:** Covers a wide range *in the chosen scale*.
      *   **Weakly Informative:** Deliberately injects minimal substantive knowledge to stabilize inference (e.g., `normal(0, 10)` instead of `uniform(-Inf, Inf)`).
      *   **Reference Prior:** Specifically constructed to have certain formal properties (often involving the likelihood).
      *   **Jeffreys Prior:** Specifically defined via Fisher information.
      *   **Default Prior:** A pragmatic choice used in the absence of strong subjective input or specific goals.

  3.  **Increased Use of Weakly Informative Priors:** Recognizing that flat priors can often lead to pathological behavior (improper posteriors, excessive sensitivity to outliers, absurd inferences in high dimensions), practitioners would lean more towards priors like `normal(0, 100)`, `cauchy(0, 5)`, `gamma(0.01, 0.01)` (with care), or hierarchical structures that partially pool information, even when substantive prior knowledge is minimal. These inject *minimal* realism/regularization without strongly influencing the posterior away from the data.

  4.  **Sensitivity Analysis as Standard:** Reporting results under 2-3 plausible prior choices (e.g., flat, weakly informative, slightly more informative based on domain logic) would become routine, especially for key parameters. This replaces the false security of a single "objective" prior.

  5.  **Shift in Philosophical Justification:** Practice aligns more cleanly with **Subjective Bayesianism** or **Pragmatic Bayesianism**. The prior is explicitly part of the model, subject to criticism and sensitivity checks, not a mystical representation of pure ignorance. The focus moves to justification, robustness, and predictive performance.

  ### The Enduring Role of Simplicity & Symmetry
  The habit persists because:
  *   **Finite/Discrete Cases:** The PoI *is* compelling and unambiguous when there are a finite number of mutually exclusive, exhaustive, and *equally plausible* elementary outcomes. This success gets (over)generalized.
  *   **Computational Convenience:** Flat priors often lead to simpler math or conjugacy.
  *   **Symmetry Arguments:** When a problem has clear symmetry (e.g., rotational invariance, translation invariance), a uniform prior *over the invariant measure* (e.g., using the Haar measure) *is* justifiable *based on the symmetry*, not pure ignorance. This is sound reasoning, but it appeals to the structure of the *problem*, not the absence of information.
  *   **Pragmatism:** In many low-dimensional problems with abundant data, the posterior is dominated by the likelihood, and the exact choice of diffuse prior matters little. The flat prior is "good enough" and simple.

  ### Conclusion
  The habit of grabbing the "obvious" flat prior presupposes an **Objective Bayesian** view where the PoI identifies a unique, objective non-informative prior in the "natural" parameterization. It rules out **Strict Subjective Bayesianism** (by denying the necessity of subjectivity) and pure **Fiducial** approaches (by requiring a prior). It is **internally inconsistent** without a robust theory of the "natural" parameterization, as shown by Bertrand's paradox. Jeffreys/Reference priors rescue formal invariance but anchor the prior to the *model*, not pure ignorance.

  Giving up the PoI means owning the prior as a **modeling choice**. Day-to-day practice would shift towards: 1) Explicit justification for *any* prior (including flat), 2) Using terms like "diffuse," "weakly informative," or "reference" instead of "non-informative," 3) Standard use of weakly informative priors for regularization, 4) Routine sensitivity analysis, and 5) Alignment with Subjective or Pragmatic Bayesian philosophy, emphasizing justification and robustness over illusory objectivity. The computational simplicity and appeal of symmetry in simple cases would endure, but stripped of the pretense that uniformity equals ignorance. This shift enhances intellectual honesty and rigor, even if it adds complexity. Your methods section would be strengthened by acknowledging the choice and its justification, or reporting sensitivity to it.
