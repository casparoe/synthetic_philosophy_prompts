prompt: |-
  I write novels — the kind in which people say things that change their lives: vows, resignations, confessions, threats, curses, the reading of a will, the moment someone is given a name or has it taken away. I make decisions of this kind several times a chapter, and the problem is craft-level but I think it is really conceptual. When I draft a scene that turns on such a line, I cannot reliably tell whether the line actually does the thing in the world of the book or merely sounds as though it does. My editor has twice caught me building a climax on words that, on inspection, could not have bound anyone to anything; I noticed the second time only because a reader asked why a character was ruined by something that was not, in fact, a promise.

  I would like a decision procedure I can run at my desk, mid-draft, on a single line of dialogue or a single document in a manuscript. Ten minutes, no theory on my part, no philosophy library.

  Three distinctions I half-remember from an undergraduate course and have probably mangled. Use them if they are sound, replace them if they are not, and tell me where I have got them wrong:

  - Some failures of these acts are cases where the act never came off at all; others are cases where it came off perfectly and is simply hollow — the promise made with no intention of keeping it. The two have different dramatic consequences, and I keep treating them as one thing.
  - Some of these acts need an institution standing behind them (a court, a church, a guild, a rank); others need only the mutual recognition of the parties in the room.
  - Some require the other party to take them up; others take effect whether or not anyone registers them.

  What I want from the procedure: the questions in order; what counts as a sufficient answer to each; the point at which the procedure stops and returns a no, meaning that this line cannot do that work and must be rewritten or reassigned; and the point at which it hands the decision back to me because the question concerns my invented world's conventions rather than language — together with what I would then have had to establish earlier in the book for the answer to hold.

  Then run it on three scenes from the current draft:

  1. A woman resigns a chairmanship by speaking the words aloud in an empty committee room. She means them, the words are the right ones, and the only witness is a cleaner who does not understand the language.
  2. A dying man extracts a promise from the narrator, who intends at that moment to break it. I need this promise to be void so that the narrator remains free; I suspect I am wrong about that.
  3. In an invented society, a betrothal is spoken in a form that a religious reformer altered two generations earlier, so that half the community recognizes it and half does not.

  For the third, the procedure should tell me what I owe the reader by way of preparation. Please include, rather than smooth over, the case where the procedure returns an answer I will not like.

  Finally: say how confident you are in each part of what you give me, and single out the one point you are least sure of.
reasoning: |-
  Hmm, the user is a novelist struggling with critical dialogue moments—vows, confessions, resignations—that need to feel legally or socially binding in their fictional world. They've been called out twice for crafting climactic lines that don’t actually hold weight (e.g., a "promise" that wasn’t one). They want a pragmatic, 10-minute desk check for single lines, no theory required.  

  Three half-remembered distinctions they mention:  
  1. **Failed act vs. hollow act** (valid but insincere vs. invalid from the start). They’re right—these have different dramatic stakes (betrayal vs. farce).  
  2. **Institutional backing vs. interpersonal recognition**. Solid. Resignations often need institutions; confessions might not.  
  3. **Requiring uptake vs. automatic effect**. Also sound. A threat might work unilaterally; a promise needs acceptance.  

  **The Core Issue**: They’re conflating *dramatic impact* with *procedural validity*. A line can *feel* powerful to a reader but still fail in-universe rules. The procedure must separate: "Does this *sound* weighty?" from "Would it *count* here?"  

  ---  

  ### Building the Decision Procedure  
  **Goal**: A flowchart-like Q&A. Must flag when a line is *procedurally invalid* (rewrite needed) vs. when it hinges on *fictional conventions* (author must clarify earlier).  

  **Key Questions in Order**:  
  1. **"Is this act type *institutional* or *interpersonal*?"**  
     - *Institutional* (resignations, wills): Requires authority/audience. If absent → invalid.  
     - *Interpersonal* (promises, threats): Focus on sincerity/uptake.  
     → *Stop and return "NO" if*: Institutional act lacks required witnesses/authority.  

  2. **"Does it require *uptake* (acceptance/acknowledgment)?"**  
     - Promises, bets, offers need uptake. If rejected/ignored → invalid.  
     - Curses, resignations? Often unilateral.  
     → *Stop and return "NO" if*: Uptake is needed but missing (e.g., promise met with silence).  

  3. **"Is the performer *sincere/competent*?"**  
     - Hollow acts (insincere promise) are *valid but broken*. Void acts (person coerced) are invalid.  
     → *Hand back to author*: If validity hinges on fictional norms (e.g., "Can insincere vows bind?"). Requires prior setup.  

  **Where It Stops**:  
  - "NO" → Line is procedurally broken. Rewrite context or reassign act type.  
  - "HAND BACK" → Author must ensure fictional rules are established pre-scene (e.g., "In this cult, vows work without sincerity").  

  ---  

  ### Testing the Scenes  
  **Scene 1 (Resignation in Empty Room)**:  
  - Institutional? **Yes** (chairmanship implies board/governance).  
  - Requires witnesses? Typically yes (to record/accept it). Cleaner doesn’t count.  
  → **NO**. *Fix*: Add a witness, or make resignation written/submitted.  

  **Scene 2 (Insincere Deathbed Promise)**:  
  - Interpersonal? **Yes** (promise).  
  - Requires uptake? **Yes** (dying man must accept it). If he does → *valid but hollow*.  
  - Void only if uptake missing or performer incompetent (e.g., coerced).  
  → **HAND BACK**. *If* the story’s norms treat insincerity as void, *this must be pre-established* (e.g., "In this culture, vows require heartfelt intent"). Else, it’s binding—and the narrator’s guilt stems from breaking it.  

  **Scene 3 (Disputed Betrothal Formula)**:  
  - Institutional? **Yes** (marriage requires social/religious recognition).  
  - Is the formula valid? Depends on fictional schism → **HAND BACK**.  
  - *What’s owed to reader*: Early exposition on the reform’s impact (e.g., show prior cases where new/old formulas caused conflict).  

  ---  

  **Confidence Notes**:  
  - Highest confidence: Institutional vs. interpersonal distinction (real-world parallels are clear).  
  - Least sure: **Uptake requirements for threats/curses**. Could be culture-dependent. Hedged with "often" in the procedure.  
  - Major caveat: This focuses on *procedural validity*, not thematic weight. A "void" act can still devastate a character psychologically—but the *plot* consequence must align with the rules.  

  **User’s Blind Spot**: They’re treating "sounds powerful" as "is powerful." The procedure forces validation against in-universe mechanics. Sometimes the fix is adding a witness; sometimes it’s making the *failure itself* the point (e.g., a vow that backfires because it was invalid).
answer: |-
  Below is a **practical, 10-minute decision procedure** for testing whether a critical line of dialogue or document (e.g., vow, resignation, confession) *procedurally works* in your story's world. It uses your three distinctions (which are sound but need refinement) and prioritizes concrete questions over theory. I'll walk you through the steps, then apply it to your three scenes.

  ---

  ### **The Decision Procedure: "ACT-VALID" Checklist**  
  Run these questions **in order**. Stop if you hit a "NO." Answer based solely on your **established worldbuilding** (not real-world logic unless your book mirrors it). Time: 3–7 minutes per line.  

  1. **QUESTION 1: DOES THE ACT REQUIRE AN INSTITUTION?**  
     - *What this means*: Institutional acts (resignations, wills, legal vows) need authority figures, witnesses, or formal records to be valid. Interpersonal acts (promises, confessions, threats) only need the involved parties.  
     - *Check*: Is this act tied to a role, title, or organization (e.g., "I resign as chairman," "I bequeath my estate")?  
       - **YES** → It requires witnesses/authority. Proceed to Q2.  
       - **NO** → Skip to Q3.  
     - *Stop and return "NO" if*: The institution isn’t present (e.g., no witness for a resignation) **and** your world hasn’t established exceptions. Rewrite the context or reassign the act.  
     - *Hand back to you if*: Your world has unique rules for institutions (e.g., "In this kingdom, vows whispered to a river are legally binding"). You must have established this *before* the scene.  

  2. **QUESTION 2: IS THE INSTITUTION PRESENT/CAPABLE?**  
     - *What this means*: Even if an act is institutional, the institution must be "active" (e.g., a witness understands the act, a court recognizes it).  
     - *Check*: Is there a witness, authority figure, or document? Do they grasp the act’s significance (e.g., language, context)?  
       - **YES** → Proceed to Q3.  
       - **NO** → The act fails.  
     - *Stop and return "NO" if*: The institution is absent, incompetent (e.g., a witness who doesn’t understand), or invalid (e.g., an expired court). Rewrite the scene or act.  
     - *Hand back to you if*: Your world redefines "institution" (e.g., "Ghosts count as witnesses"). Must be established earlier.  

  3. **QUESTION 3: DOES THE ACT REQUIRE UPTAKE?**  
     - *What this means*: Uptake = the other party must acknowledge/accept the act for it to take effect (e.g., promises, bets, offers). Non-uptake acts work unilaterally (e.g., resignations, curses, naming).  
     - *Check*: Would ignoring this act nullify it? (e.g., "I promise" requires "I accept"; "I curse you" does not).  
       - **YES (requires uptake)** → Proceed to Q4.  
       - **NO (no uptake needed)** → Proceed to Q5.  
     - *Stop and return "NO" if*: Uptake is needed but missing (e.g., a promise met with silence).  
     - *Hand back to you if*: Your world changes uptake rules (e.g., "Promises are binding if whispered, even unheard"). Must foreshadow this.  

  4. **QUESTION 4: IS UPTAKE GIVEN?**  
     - *What this means*: The recipient must visibly accept (e.g., "I agree," a nod, signing a document).  
     - *Check*: Does the recipient acknowledge the act in-universe?  
       - **YES** → Proceed to Q5.  
       - **NO** → The act fails.  
     - *Stop and return "NO" if*: Uptake is absent. Rewrite the exchange.  

  5. **QUESTION 5: IS THE ACT HOLLOW OR VOID?**  
     - *What this means*: **Hollow** = The act is valid but insincere (e.g., a lie with "correct" wording). **Void** = The act is invalid from the start (e.g., wrong form, coercion).  
     - *Check*:  
       - Is the performer sincere/competent? (e.g., not delirious, not joking).  
       - Does the act meet procedural rules? (e.g., "I resign" while holding the required gemstone).  
     - **HOLLOW** → The act *works* but may be broken later (dramatic: betrayal, guilt).  
     - **VOID** → The act *never happened* (dramatic: farce, revelation).  
     - *Stop and return "NO" if*: The act is void (e.g., incoherent wording, missing authority). Rewrite the line.  
     - *Hand back to you if*: Your world defines sincerity/competence unusually (e.g., "Lies make vows stronger"). Must establish this earlier.  

  **OUTPUTS**:  
  - **"NO"** → The line *cannot* do this work procedurally. Fix: Change wording, add witnesses, or reassign the act (e.g., make a "vow" a "hope").  
  - **"HOLLOW"** → The act succeeds but is insincere. Plot impact: Consequences arise when it’s *broken*.  
  - **"VALID"** → The act succeeds and is binding.  
  - **"HAND BACK"** → Validity depends on your worldbuilding. Ensure you’ve set rules *before* this scene.  

  ---

  ### **Applied to Your Scenes**  
  **Scene 1: Resignation in an empty room**  
  - **Q1 (Institution?)**: YES (chairmanship = institutional role).  
  - **Q2 (Institution present?)**: NO. Cleaner isn’t a valid witness (doesn’t understand/represent the institution).  
  - **STOP → "NO"**.  
  *Diagnosis*: The resignation never happened. It’s theatrically poignant but procedurally inert.  
  *Fix*: Add a witness (e.g., a late-returning secretary), make it a written resignation, or earlier establish that "solitary declarations bind leaders in this society."  

  **Scene 2: Insincere deathbed promise**  
  - **Q1 (Institution?)**: NO (personal promise → interpersonal). Skip to Q3.  
  - **Q3 (Uptake needed?)**: YES (promises require acceptance).  
  - **Q4 (Uptake given?)**: YES (dying man hears/seems to accept it).  
  - **Q5 (Hollow or void?)**: HOLLOW (performer intends to break it, but wording is correct).  
  *Diagnosis*: **VALID BUT HOLLOW**. The promise *is* binding, and the narrator is *not* free. Their guilt lies in breaking it.  
  *Why you’re wrong*: Insincerity makes it hollow, not void (unless your world requires "true intent" for promises).  
  *Fix*: If you need it void, add a voiding element (e.g., the narrator says "I’ll try" instead of "I promise," or the man is already dead). Otherwise, lean into the hollowness—the drama is in the betrayal.  

  **Scene 3: Disputed betrothal formula**  
  - **Q1 (Institution?)**: YES (betrothal = social/religious institution).  
  - **Q2 (Institution present?)**: AMBIGUOUS. Half the community recognizes it, half doesn’t.  
  - **HAND BACK → Worldbuilding needed**.  
  *What you owe the reader*:  
  1. Earlier establish the reform’s *practical impact* (e.g., show a prior wedding voided by formula disputes).  
  2. Clarify who holds power (e.g., "Only priests validate betrothals, and they’re split").  
  3. Show consequences (e.g., "The Smiths disowned their daughter for using the new form").  
  *Diagnosis*: **Not inherently valid or void**—it’s a social grenade. The line *could* work if you’ve set up factionalism. If not, it’s a "NO" (no unified institution).  
  *Answer you won’t like*: If you *haven’t* established societal division, the act defaults to "NO" because institutions require consensus.  

  ---

  ### **Confidence Assessment**  
  - **Highest confidence (90%)**: The ACT-VALID structure itself. It’s rooted in linguistic philosophy (Austin/Searle on speech acts) and narrative cause/effect.  
  - **Q1/Q2 (Institutions)**: 85% confidence. Real-world parallels (e.g., resignations require boards) are clear.  
  - **Q3/Q4 (Uptake)**: 80% confidence. Distinctions like "promise vs. threat" are well-documented.  
  - **Q5 (Hollow vs. Void)**: **75% confidence—least sure here**. Your mangled distinction was close: "Hollow" = valid but insincere; "Void" = invalid from the start. But it’s easy to confuse with "voidable" (e.g., coercion). I simplified for your toolkit.  
  - **Scene applications**: 85% confidence. Based on standard conventions; your invented societies could alter this, but the procedure flags where you must clarify.  

  **Final Tip**: Test this on past "failed" lines from your drafts. If a line flops, it likely failed Q1 (institution missing) or Q3 (uptake skipped). Keep a cheat sheet: *Institutional? → Witnesses? → Uptake? → Sincere?*. Rewrite until it passes.
