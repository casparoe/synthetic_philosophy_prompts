answer: |-
  ### Exam Question  
  **Based on the case provided, answer the following:**  
  *On a computationalist view of mind, which (if any) of the three versions of the book—(i) Shelf, (ii) Clerk, or (iii) Clockwork—is conscious? In addressing this, explain what the answer commits computationalism to concerning the "implementation problem" (i.e., what it means for a physical system to realize a computation). Your essay must:*  
  *(a) State what the simplest isomorphism account of implementation implies about each book, and why this result is philosophically embarrassing.*  
  *(b) Analyze how a causal/counterfactual account of implementation would judge each version.*  
  *(c) Explain why we cannot arbitrarily declare the book "unconscious" without risking the exclusion of biological brains.*  
  *(d) Defend whether this case is a reductio of computationalism itself, or merely a reason to reject inadequate theories of implementation.*  

  ---

  ### Model Answer (800 words)  

  Computationalism holds that mental states are computational states: consciousness arises from the execution of abstract algorithms. The three book scenarios test this by asking whether a human mind’s formal specification, physically realized in different ways, could be conscious. To answer, we must confront the **implementation problem**: what physical conditions must hold for a system to genuinely *run* a computation, not merely describe it?  

  **(a) The Isomorphism Account’s Ubiquity Problem**  
  The simplest theory of implementation is **structural isomorphism**: a system implements a computation if its physical states can be mapped one-to-one to the computation’s formal states. On this view, *all three books* implement the mind’s computation. The Shelf book’s printed table (i) structurally mirrors the computation’s state-transition graph. The Clerk (ii) adds a human manually tracking states, while Clockwork (iii) automates transitions mechanically. Isomorphism demands only a static mapping, so even the inert Shelf book qualifies. This is embarrassing because it implies **ubiquitous consciousness**: any structurally isomorphic object (e.g., a rock with atomic configurations mapping to "War and Peace") would host every possible mind. This violates the intuition that consciousness requires *causal dynamics*, not just abstract correspondence.  

  **(b) The Causal Account’s Selective Verdict**  
  To avoid this, computationalists adopt a **causal account**: a system implements a computation only if its physical states *cause transitions* that mirror the formal state-transition rules. Here, the verdicts diverge:  
  - **Shelf (i)** fails: its pages lack causal powers. No internal mechanism triggers state changes; it is a static description.  
  - **Clerk (ii)** partially satisfies causal criteria: the human reads the current state and manually writes the next. Transitions occur via the clerk’s cognition, but *external* intervention is required for each step. The system (book + clerk) has causal structure, yet the computation is parasitically reliant on the clerk’s pre-existing mental capacities.  
  - **Clockwork (iii)** succeeds: its internal mechanism (e.g., levers triggered by text) directly causally links states to transitions. Once wound, it operates autonomously per its design, satisfying counterfactuals (e.g., "if state S occurred, it would transition to S*"). This resembles a mechanical Turing machine.  

  Thus, only Clockwork clearly realizes the computation under a causal view.  

  **(c) The Brain Exclusion Challenge**  
  One might dismiss the books as "obviously" unconscious. But computationalism cannot arbitrarily exclude them without **endangering brains**. Brains realize computations via neurochemical causality: neurons enter physical states that cause transitions per their functional roles. If we demand "biological materials" or "real-time speed," we risk dualism or vitalism. Conversely, if we accept Clockwork’s causal autonomy, why not grant it minimal consciousness? The Clerk case is thornier: its dependence on human interpretation makes it a *simulation* (like a person calculating chess moves manually) rather than an *implementation*. But if we reject Clerk for requiring external semantics, we must ensure our theory doesn’t exclude brains by requiring an unphysical "homunculus" to interpret neural states. Implementation must be **intrinsic**: transitions arise from local physics, not external agency.  

  **(d) Reductio or Refinement?**  
  This case is **not a reductio of computationalism** but exposes flaws in naive theories of implementation. Structural isomorphism collapses under panpsychist absurdity, justifying its rejection. The causal account resolves much of this, but demands careful constraints:  
  1. **Autonomy**: Transitions must be system-inherent (ruling out Shelf).  
  2. **Semantic opacity**: Transitions should depend on physical properties (e.g., Clockwork’s page-turning mechanics), not interpreted meanings (unlike Clerk’s text-dependent lookups).  
  3. **Counterfactual robustness**: The system must sustain transitions across perturbations (e.g., Clockwork works if pages are jammed; Clerk halts if the clerk quits).  

  Computationalism survives if it adopts such a refined causal theory. Clockwork’s potential consciousness remains counterintuitive but coherent—like Searle’s Chinese Room with internalized rules. If consciousness supervenes on computation, Clockwork’s isomorphic, autonomous causality suffices. Rejecting this requires abandoning computationalism, not tweaking implementation.  

  **Verdict:** The Clockwork book is conscious on a defensible computationalist view; this forces us to adopt a causal-counterfactual theory of implementation that excludes Shelf and Clerk while preserving brains as valid realizers.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Must-hit points (with typical student errors):**  
  1. **Isomorphism account applied & critiqued** (5 marks):  
     - States isomorphism implies *all three* are conscious (2).  
     - Explains why this leads to ubiquitous consciousness (e.g., "any isomorphic object") (2).  
     - Notes this is embarrassing for computationalism (1).  
     *Typical miss: Claims only Clerk/Clockwork satisfy isomorphism; misses Shelf’s structural mapping.*  

  2. **Causal account applied to all cases** (6 marks):  
     - Correctly rejects Shelf for lacking causality (1).  
     - Identifies Clerk as problematic due to external agency (2).  
     - Accepts Clockwork via intrinsic causality (2).  
     - Distinguishes implementation (Clockwork) from simulation (Clerk) (1).  
     *Typical miss: Equates Clerk’s manual process with "causality," missing its dependence on interpretation.*  

  3. **Brain exclusion challenge explained** (5 marks):  
     - Argues arbitrary exclusion risks excluding brains (2).  
     - Notes brains rely on intrinsic causality (1).  
     - Highlights "homunculus fallacy" in Clerk case (2).  
     *Typical miss: Assumes brains are "obviously" different without justifying why.*  

  4. **Position defended: reductio vs. refinement** (5 marks):  
     - Rejects isomorphism as untenable (1).  
     - Argues causal account saves computationalism (2).  
     - Specifies requirements for implementation (autonomy, opacity, robustness) (2).  
     *Typical miss: Declares case a "reductio" without engaging causal refinements.*  

  5. **Structure & clarity** (4 marks):  
     - Logical flow; precise terminology; addresses all sub-questions.  
     *Typical miss: Digresses into general functionalism debates.*  

  **First-class distinction:**  
  A competent answer hits all points mechanically. A **first-class answer** (21–25 marks) *synthesizes* them: e.g., shows how the causal account’s exclusions (Shelf, Clerk) align with brain realism, or argues Clockwork’s consciousness is tolerable if computationalism is true. It anticipates objections (e.g., "But Clockwork is too slow!") and uses the case to reveal computationalism’s core commitments.
