prompt: |-
  Im teaching a 300-level seminar on rationality and belief — 18 students, 90 minutes, no maths beyond a bit of probability — and I want them to feel the lottery paradox and the preface paradox from the inside before anyone says either name. I've got the bones of a thing and I want you to make it runnable.

  The disguise is an insurance underwriting desk. Each student is an underwriter, and the licence they're issued says two things: initial any file you'd stake your own money on at 33:1, and sign the desk's standard humility line — somewhere in my book there's a file I got wrong — because that's what the regulator wants. The book is 60 files, one per policy, each reading "Policy #n will not pay out this quarter". Exactly one of the 60 will pay out, and that's a public fact of the setup, they all know it. Stakes: chocolate coins, one per wrong file.

  Then the audit form arrives, and the line on it is "I stand by every file in my book". So they've already initialled the claim that some file is wrong, and now they're initialling its negation, and both lines were individually forced on them by rules rather than by me. Make refusing to sign either line cost them something real-ish, so they can't just decline and shrug. I don't want to be the person who points out the squeeze.

  Second round, same desk, different paperwork: an analyst files a 60-finding report, each finding resting on an independent test that's been right 97 times in 100, and the desk has to sign off on the report. Same squeeze from the other direction, and this time nothing in the setup hands them the certain claim for free — I want to see if that makes it feel different.

  Give me the whole thing: roles, materials, the exact wording on cards and forms, the timeline, where it lands, and a debrief that maps what happened onto acceptance vs credence, the threshold view, conjunctive closure, and the escape routes they'll actually reach for with what each one costs them — the real ones, not "people are just inconsistent". Be honest about the bit the game can't reproduce and that I'll have to supply myself, and about what goes wrong the first time — someone blurts the name, someone refuses to initial anything, someone says the licence is just badly written — and how I handle each.

  Give it to me as exactly five numbered items and nothing else, no intro and no closing paragraph: setup and materials, the rules that do the forcing, the twist, the debrief, and what breaks. A sentence or two each is fine, dense beats padded.
reasoning: |-
  We are creating two rounds: one for the lottery paradox setup and one for the preface paradox setup, both disguised in an insurance underwriting scenario.

  **Item 1: Setup and Materials**
  - **Roles**: Each student is an insurance underwriter. They are issued a "licence" (a card) that states two rules: 
    1. "Initial any file you'd stake your own money on at 33:1 or better." 
    2. "Sign the desk's standard humility line: 'I acknowledge that in my book of 60 policies, there is at least one file I got wrong.'"
  - **Materials**: 
    - A "book" for each student: 60 file cards, each labeled "Policy #n will not pay out this quarter" (n from 1 to 60). 
    - A desk plate with the humility line and a space for signature.
    - Chocolate coins (or some small token) as stakes. 
    - Audit form for Round 1: "I stand by every file in my book" with a line for initials.
    - For Round 2: A report with 60 findings, each stating a different claim (e.g., "Policy #n is risk-free") and a sign-off line: "I endorse the entire report as correct." Each finding is backed by an independent test that is 97% reliable (explained in the rules).

  **Item 2: Rules That Do the Forcing**
  - **Round 1 (Lottery Paradox in disguise)**:
    - Each underwriter must initial each policy file if they would bet their own money at 33:1 (which, given the setup, they should because each policy has a 59/60 chance of not paying out, so 59:1 odds, better than 33:1). 
    - They must sign the humility line on their desk (acknowledging at least one error in the book) because the regulator requires it. 
    - Then the audit form arrives: they must sign "I stand by every file in my book" (which is equivalent to denying the humility line). 
    - Stakes: For each file they initialed that turns out wrong (i.e., the policy pays out), they lose one chocolate coin. Also, if they refuse to sign either the humility line or the audit form, they must pay a chocolate coin as a "regulatory fine" (so refusing costs them one coin per refusal, but they might avoid the risk of multiple losses).

  - **Round 2 (Preface Paradox in disguise)**:
    - The underwriter receives a report with 60 findings, each independently supported by a test that is 97% reliable (so each finding has a 97% chance of being correct). 
    - The licence rule applies: initial each finding you'd stake your own money on at 33:1. Since 97% reliability implies about 32.33:1 odds (0.97/0.03 ≈ 32.33), which is better than 33:1, they should initial each. 
    - Then they must sign off on the entire report: "I endorse the entire report as correct." 
    - Stakes: For each initialed finding that is wrong, they lose one chocolate coin. If they refuse to initial any finding or refuse to sign the entire report, they pay a chocolate coin fine per refusal.

  **Item 3: The Twist**
  - In Round 1, the setup explicitly states that exactly one policy will pay out (so they know one file is wrong). This gives them a certain claim for free (the humility line). 
  - In Round 2, the reliability of each test is independent and 97%, but there is no certainty that at least one finding is wrong. However, the probability that at least one is wrong is high (1 - (0.97)^60 ≈ 84.5%). The twist is that they don't have a built-in certainty of an error, so they might be tempted to sign the entire report without the humility.

  **Item 4: Debrief**
  - **Mapping to Concepts**:
    - **Round 1 (Lottery)**: 
      - *Acceptance vs Credence*: They accept each individual policy (initial) because the credence (59/60 ≈ 98.3%) is above the threshold (97% for 33:1) but must also accept the humility claim (which is certain). Then the audit form forces them to accept the conjunction (all correct) which they know is false. 
      - *Threshold View*: If belief requires probability above a threshold (here, 1/34 ≈ 2.94% for 33:1), then each belief is rational, but the conjunction of all 60 is not (probability 0). 
      - *Conjunctive Closure*: The rule that if you believe each of a set of propositions, you should believe their conjunction, fails here. 
      - *Escape Routes*: 
          1. Lower the threshold: but then they might have to accept too many falsehoods. 
          2. Reject conjunctive closure: but that seems ad hoc. 
          3. Refuse to initial any file: but that costs one coin and goes against the evidence for each file. 

    - **Round 2 (Preface)**:
      - *Acceptance vs Credence*: Each finding is accepted (initialed) because the credence (97%) is above the threshold. But the conjunction (all 60 correct) has low probability (0.97^60 ≈ 15.5%), so signing the entire report is problematic. 
      - *Threshold View*: Same issue as Round 1. 
      - *Conjunctive Closure*: Fails again. 
      - *Escape Routes*: 
          1. They might refuse to sign the entire report while initialing each finding, but that costs a fine and might seem inconsistent. 
          2. They might not initial some findings arbitrarily, but that costs a fine per skipped finding and ignores the evidence. 
          3. They might accept the risk and sign, but then they are very likely to lose many coins (expected wrong findings: 60*0.03 = 1.8).

  - **Key Insight**: The paradoxes arise because high probability of each does not imply high probability of the conjunction, and thresholds create a tension with logical consistency.

  **Item 5: What Breaks**
  - **Blurting the Name**: A student might recognize and name the paradox. Handle by acknowledging it but encouraging them to play along to experience the tension. 
  - **Refusal to Initial/Sign**: Some might refuse to initial any file or sign anything to avoid the squeeze. They pay fines but avoid bigger losses. Discuss in debrief: is this rational? It avoids the paradox but at a cost and by ignoring evidence. 
  - **Licence Critique**: They might say the licence rules are badly written. Agree that the rules force inconsistency, and that's the point: real-world rules (like thresholds) can create such dilemmas. 
  - **What the Game Can't Reproduce**: 
    - The psychological discomfort of believing contradictions is simulated by the chocolate coins, but the real paradox is about rational commitment. 
    - The game assumes fixed probabilities, but in real life, probabilities are often vague. 
    - The game can't capture the full normative force of logic (e.g., they might feel they can accept each and reject the conjunction without cost, but in the game, the rules impose costs). 
    - You'll have to supply: the philosophical context that these paradoxes challenge the idea of belief as a binary (on/off) concept and the normative principles of rationality.
answer: |-
  **1. Setup and Materials**  
  - **Roles**: Students act as insurance underwriters. Each has a licence card stating: "Rule 1: Initial any file you'd stake your own money on at 33:1. Rule 2: Sign the humility line: 'In my book of 60 policies, at least one file is wrong.'"  
  - **Materials**:  
    - 60 file cards per student, each labeled "Policy #n will not pay out this quarter" (n=1-60).  
    - A desk plate with the humility line and signature space.  
    - An audit form: "I stand by every file in my book" with initials line.  
    - Round 2 report: 60 findings (e.g., "Policy #n is risk-free"), each with a note: "Independent test reliability: 97/100." Sign-off line: "I endorse all 60 findings."  
    - Chocolate coins (1 per wrong file/finding).  

  **2. Rules That Do the Forcing**  
  - **Licence Rules**:  
    - Initial files per Rule 1 (odds: each file has 59/60 ≈ 98.3% chance of being correct, beating 33:1).  
    - Sign humility line per Rule 2 (known setup: exactly one payout → one wrong file).  
  - **Stakes**:  
    - Lose one chocolate coin per wrong initialed file/finding.  
    - Refusing to initial/sign any *required line* (humility, audit, or report) costs one chocolate coin "compliance fine."  
  - **Round 2 Addendum**: Initial each finding per Rule 1 (97% reliability ≈ 32.3:1, beating 33:1); sign the full report.  

  **3. The Twist**  
  - **Round 1 (Lottery)**: Humility line is certain (one payout is guaranteed), but the audit form ("stand by every file") contradicts it.  
  - **Round 2 (Preface)**: No guaranteed error (each finding 97% reliable, but P(all correct) ≈ 15.5%). The squeeze arises purely from probability, not certainty.  

  **4. Debrief**  
  - **Acceptance vs Credence**: Initialing files/findings reflects *acceptance* (binary belief via threshold), but high credence in each (98.3%/97%) ≠ high credence in conjunctions.  
  - **Threshold View**: Thresholds (here, ~97% for 33:1) rationalize individual beliefs but not conjunctions (P(conjunction) → 0).  
  - **Conjunctive Closure**: Rejected—accepting all conjuncts (via initials) doesn’t entail accepting the conjunction (via signing).  
  - **Escape Routes & Costs**:  
    - *Refuse thresholds*: Avoid initialing, but pay fines and ignore evidence.  
    - *Reject conjunctive closure*: Sign humility/refuse audit in Round 1 (costs one coin) but appear inconsistent.  
    - *Probabilistic hedging*: In Round 2, refuse full sign-off (costs one coin) while initialing each—acknowledges uncertainty.  

  **5. What Breaks**  
  - **Blurting Names**: Student identifies "lottery/preface paradox." Handle by noting, "Yes—this *is* that paradox. Feel the tension anyway."  
  - **Refusal to Play**: Student won’t initial/sign anything. Costs pile up (fines), forcing engagement or highlighting rule aversion.  
  - **Licence Critique**: "Rules are badly written!" Agree—real thresholds create dilemmas; discuss reform (e.g., graduated confidence).  
  - **Unreproducible Element**: The game can’t simulate *why* binary belief feels intuitive; you must explain credence gradience and logic’s normative pull.  
  - **First-Run Issues**: Overcaution in Round 2 (many skip signing the report) or reckless signing (ignoring low P(conjunction)); debrief using their actual choices.
