prompt: |-
  I run a reading group on evolutionary psychology and we're stuck. Two of the group are dyed-in-the-wool adaptationists who think the critics just dislike where the conclusions lead, two think the whole research programme is unfalsifiable story-telling, and after six sessions nobody's budged an inch. I want to make them write the document they should have produced months ago: the joint statement of an adverserial collaboration.

  So: the claims both sides can actually sign — about what the evidence base really looks like, about what the environment of evolutionary adaptedness was and wasn't, about what would even count as a psychological adaptation, about which findings are solid enough to build on; then the disagreements that remain, each phrased the way the side holding it would want it phrased; then the cruxes, i.e. the sub-questions where settling the thing would actually move somebody; and for each crux a test or case that both sides would agree bears on it, with each side's prediction written down in advance.

  Two bits I want done properly rather than waved at. First, modularity: how much domain-specific machinery does the programme actually need, and what should each side say the cheater-detection work and the deontic/permission versions of the selection task really show? Second, the falsifiablity charge itself — have each side spell out concretely what a failed prediction would look like for a flagship case (language, religion, moral judgment, whatever they pick), and whether they'd count it as evidence against their own view. I suspect at least one of the rows in the table is really a fight about what counts as a prediction rather than about the mind, so if part of the dispute turns out to be verbal, say which part and why.

  Numbered agreed-claims section first, then a disagreements table with the cruxes and predictions in it. No references needed, I care about the substance. British English please.
reasoning: |-
  Hmm, the user runs a reading group on evolutionary psychology that's stuck in a debate between adaptationists and critics. They want me to draft a joint statement for an adversarial collaboration to break the deadlock. The group has two hardcore adaptationists who think critics reject the conclusions for ideological reasons, and two critics who view the field as unfalsifiable storytelling. After six sessions, no one has moved positions.

  I need to create a document with several key components: agreed-upon claims about evidence, the environment of evolutionary adaptedness (EEA), definitions of psychological adaptations, and solid findings; disagreements phrased neutrally; and specific cruxes with testable predictions. The user specifically wants me to address modularity (using cheater-detection and deontic reasoning as examples) and falsifiability (with concrete examples like language or religion).

  For the structure, I'll start with a numbered list of agreed claims that both sides could sign. These should focus on common ground: that natural selection applies to psychological traits, the EEA wasn't a single place/time, adaptations require evidence beyond plausibility, and that some findings are robust. I'll make these precise but broad enough for consensus.

  Then I'll create a disagreements table with three columns: the disagreement phrased in each side's preferred language, the crux (the underlying issue), and specific testable predictions for each side. For the modularity section, I'll contrast the adaptationist view of many domain-specific modules with the critics' view of fewer, more flexible mechanisms, using the Wason selection task as a concrete example. For falsifiability, I'll use the evolution of religion as a flagship case, having each side define what would falsify their position and what they'd predict for specific tests.

  I'll use British English throughout as requested, avoiding jargon where possible. For the falsifiability discussion, I'll highlight if any disputes are verbal rather than substantive - perhaps about what constitutes a "failed prediction." The document should feel balanced and rigorous, helping the group move past ideological stalemates to focus on empirical tests.

  The tone needs to be diplomatic but incisive - this is meant to force clarity, not just restate positions. I'll end with practical next steps for the group to operationalize the predictions.
answer: |-
  ## Adversarial Collaboration: Joint Statement on Evolutionary Psychology

  **Preamble:** This document represents points of agreement, structured disagreements, and testable cruxes between adaptationist ("A") and critical ("C") perspectives within our reading group. Its purpose is to move beyond entrenched positions by clarifying shared ground, precisely articulating differences, and committing to empirical tests where possible. Signatories agree that the below represents their current understanding, even where they disagree.

  **I. Agreed Claims (Signed by Both Sides):**

  1.  **Natural Selection Applies:** Psychological traits, like biological ones, are products of evolution by natural selection. Genetic variation, inheritance, and differential reproductive success are foundational principles relevant to understanding the mind.
  2.  **The EEA is Not Singular:** The "Environment of Evolutionary Adaptedness" (EEA) is not a specific time or place, nor a monolithic environment. It refers to the *statistical composite of selection pressures* relevant to a specific adaptation over the period during which it was shaped. Reconstructing it is inherently challenging and probabilistic.
  3.  **Adaptations Require Evidence Beyond Plausibility:** Identifying a trait as a psychological adaptation requires more than a plausible "just-so" story. Evidence must include specificity, efficiency for a proposed function, comparative data (where possible), and ideally, developmental or genetic markers consistent with selection. Universality is suggestive but not definitive proof of adaptation.
  4.  **Not Everything is an Adaptation:** Psychological mechanisms include adaptations, by-products (spandrels) of adaptations, noise, and potentially vestiges. An evolutionary perspective does not demand that every trait be labelled an adaptation.
  5.  **Some Findings are Robust:** Certain empirical findings within the EP framework are robust and replicable, forming a core body of evidence to be explained by any account of the mind (e.g., kin recognition biases, early emerging aversion to potential contaminants, certain aspects of mate preference cross-culturally). These findings constrain theorising.
  6.  **Falsifiability is Paramount:** For EP to be a scientific enterprise, its core claims and proposed adaptations must be falsifiable in principle. Disagreements exist about the *practicality* and *specificity* of falsification for certain claims.
  7.  **Modularity Exists at Some Level:** The mind is not a single, general-purpose processor. Some degree of functional specialisation is necessary. The core disagreement concerns the *extent*, *domain-specificity*, and *encapsulation* of this specialisation ("massive modularity" vs. "fewer, more flexible mechanisms").

  **II. Disagreements, Cruxes, and Predictions:**

  | Disagreement (Phrased as Each Side Prefers)                                                                                                                                 | Crux                                                                                                                                                                | Agreed Test/Case                                                                                                                         | Adaptationist (A) Prediction                                                                                                                                 | Critical (C) Prediction                                                                                                                                                                                                                                 |
  | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **A:** The human mind consists predominantly of numerous, domain-specific computational modules, shaped by natural selection to solve specific adaptive problems recurrent in the EEA (Massive Modularity). <br> **C:** The mind relies more heavily on a smaller number of domain-general learning mechanisms, cultural transmission, and flexible executive functions, with domain-specific adaptations being fewer and less informationally encapsulated. | **Extent of Domain-Specificity:** How much of our cognitive architecture is composed of dedicated, specialised circuits for narrow tasks versus flexible systems applying general rules? | **Wason Selection Task Performance:** Compare success rates on standard abstract logic versions vs. versions framed as detecting cheating (social contract) or detecting violations of permission rules. | Performance will be consistently and significantly higher on social contract/permission rule versions *specifically* because they engage a dedicated "cheater detection" module attuned to social exchange logic. The content effect is strong evidence for domain-specific adaptation. | Performance differences between versions are due to content making the underlying logical structure more *intuitive* or *familiar* via general reasoning or learned schemas, not a dedicated module. The effect might be weaker, more culturally variable, or explicable by general-purpose theory of mind/effort avoidance. |
  | **A:** Findings like cheater detection superiority demonstrate the existence and function of specific cognitive adaptations (e.g., a social contract algorithm). <br> **C:** Findings like cheater detection superiority demonstrate the *content-dependence* of reasoning but are equally or better explained by the activation of domain-general schemas, learned rules, or motivational factors within a less modular system. | **Interpretation of "Content Effects":** Do performance differences triggered by specific content reveal dedicated modules, or the operation of more general mechanisms applied to evocative contexts? | **Developmental Trajectory & Robustness:** Examine when the cheater-detection advantage emerges developmentally. Test its robustness across vastly different cultural contexts with minimal exposure to Western norms of exchange. | The advantage should emerge early in development (pre-cultural instruction on logic/exchange) and show strong cross-cultural universality, supporting an innate, specialised module.                                                               | The advantage may develop later, correlate with cultural exposure to specific exchange norms, or show significant cultural variation, supporting a role for learning, cultural transmission, or context-dependent application of general reasoning.                     |
  | **A:** EP generates genuinely falsifiable predictions. Failed predictions for specific adaptive hypotheses count as strong evidence against that hypothesis and, if central enough, against the broader programme's applicability to that domain. <br> **C:** EP hypotheses are often framed so flexibly that failed predictions can be easily explained away (e.g., mismatched modern environments, by-products, misidentified function), rendering core claims effectively unfalsifiable. | **Practical Falsifiability:** Can specific, core predictions derived from EP hypotheses be formulated such that a clear negative result would be widely accepted by proponents as genuinely challenging the hypothesis? | **Flagship Case: Evolution of Religion** <br> *Test 1:* **Genetic Correlates Study.** Large-scale GWAS for traits strongly predicted by major adaptationist hypotheses (e.g., specific belief in moralizing high gods, costly ritual participation linked to group cohesion). <br> *Test 2:* **Fitness Link Study.** Rigorous longitudinal study in a traditional society correlating specific religious behaviours/practices (predicted to be adaptations) with direct measures of reproductive success (lifetime reproductive output). | *A Prediction:* Will find specific, significant genetic variants associated with key adaptive religious traits/predispositions. Will find significant positive correlation between specific adaptive religious behaviours (e.g., costly signalling, in-group cooperation via shared belief) and increased RS. *Falsification:* Failure to find *any* significant genetic correlates for highly predicted traits, or finding a *negative* correlation between core adaptive religious behaviours and RS in an evolutionarily relevant context, would challenge specific adaptationist accounts. | *C Prediction:* GWAS will find weak, polygenic, or non-specific genetic associations for religious traits, better explained by general cognitive/emotional traits. Will find weak, null, or context-dependent correlations between specific religious behaviours and RS; any positive effects likely due to general social integration/well-being, not specific religious adaptation. *Falsification (of unfalsifiability charge):* If A consistently makes *specific, risky* predictions (e.g., *which* genes, *which specific behaviour* boosts RS how much) that are *clearly falsified* and proponents concede the hypothesis is weakened/discarded without resorting to major ad-hoc modifications, this would counter the unfalsifiability charge for that hypothesis. |
  | **A:** The charge of unfalsifiability often stems from critics misunderstanding the programme, demanding unrealistic levels of evidence (e.g., fossil minds), or discomfort with the implications. <br> **C:** The charge of unfalsifiability stems from methodological practices within EP: over-reliance on reverse engineering, flexible redefinition of functions, and failure to specify what evidence *could* disprove a favoured hypothesis. | **Nature of the Falsifiability Dispute:** Is the disagreement primarily about evidential standards and interpretation (potentially resolvable), or is it inherent to how EP hypotheses are often constructed (a fundamental methodological flaw)? | **Analysis of Past Debate:** Jointly examine a historical EP controversy (e.g., specific hypothesis about rape, jealousy, or language evolution). Did proponents clearly state *in advance* what would falsify their hypothesis? If a prediction failed, how did proponents respond? Did critics accept valid adjustments, or were adjustments seen as unfalsifiable retreats? | Will find examples where falsification criteria *were* stated and negative results led to hypothesis modification or abandonment. Argue that critics often dismiss valid evidence or move goalposts. The dispute is often verbal (what counts as "specific enough") or about burden of proof. | Will find examples where failed predictions were explained away by invoking mismatched environments, by-products, or shifting the proposed function, without clear prior falsification criteria. Argue that proponents often conflate "consistent with" with "evidence for," and the burden lies on EP to specify falsifiable predictions. |

  **III. Specific Notes on the "Falsifiability Charge" Row:**

  *   **Verbal Dispute Aspect:** A significant part of the disagreement here is **verbal**, concerning the definition of a "failed prediction" and the threshold for "falsifying" a complex evolutionary hypothesis.
      *   **A Side:** Views a failed prediction as strong counter-evidence requiring serious re-evaluation or abandonment of *that specific hypothesis*. They argue EP *does* generate falsifiable hypotheses, but critics demand an unrealistic level of disproof equivalent to disproving natural selection itself for a trait.
      *   **C Side:** Views the constant redefinition of function or invocation of mismatched environments *after* a prediction fails as rendering the *core claim of adaptation* unfalsifiable for many hypotheses. They argue proponents rarely specify *in advance* what specific finding would make them concede a trait is *not* an adaptation for the proposed function. The dispute is about the *practical feasibility* of falsifying adaptationist claims given common methodological practices.
  *   **Substantive Dispute Aspect:** The substantive core is whether the *structure of typical EP hypotheses and the responses to anomalies* inherently shields the core adaptationist assumption from falsification in specific cases. The "Religion" crux tests are designed to probe this substantively.

  **Next Steps for the Group:**

  1.  **Sign:** All members sign the **Agreed Claims** section.
  2.  **Assign Sides:** Each member explicitly adopts either the A or C perspective for the purpose of this collaboration regarding the Disagreements.
  3.  **Operationalise Predictions:** For the chosen cruxes (e.g., Religion GWAS/RS studies, Developmental/Cross-Cultural Wason task), collaboratively design more detailed mock protocols outlining exact measures, controls, and effect sizes that would constitute support/falsification for each prediction in the table.
  4.  **Seek Evidence:** Actively look for existing literature or plan feasible small-scale studies that could bear on these cruxes.
  5.  **Revisit:** Schedule a session specifically to review evidence related to these cruxes and assess whether any movement has occurred based on the agreed framework.

  This document forces specificity, exposes the true roots of disagreement, and shifts focus towards empirical adjudication where possible. Good luck breaking the deadlock!
