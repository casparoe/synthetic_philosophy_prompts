prompt: |-
  My sister and I had a proper shouting match on Christmas Eve. She reckons that when she says something's wrong she's just reporting her own taste — like saying she hates olives — and that anyone who thinks they're reporting a fact about the world is kidding themselves. I told her that's obviously not right and then completely failed to say what the difference would actually be. It's been chewing at me for weeks, and I've definately been re-litigating old arguments with my ex through it, which isn't helping.

  Anyway. I go to a Tuesday night class for adults — twelve of us, no philosophy whatsoever, mostly retired, one ex-vet, one woman who does the cryptic crossword in pen — and the tutor's away in March so I've offered to do the ninety minutes on this. Whiteboard, no handouts, and I don't want to name a single philosopher (I'd get it wrong in front of them, and I think the cases can carry it anyway).

  Don't explain the topic to me — plan how I explain it. What has to land before what, and why that order rather than the other one (I'd guess 'disagreement' has to come before 'fact', but tell me). Which single case should carry the whole session, because I've got two and can't choose. One is the Christmas argument itself, the two of us sat there both completely certain. The other is my nan's funeral: my uncle threw out all her clothes the next morning before anyone could say anything, and the whole family said it was wrong, and when I asked who it actually hurt, nobody could tell me. Say which one carries it, what the other is for if anything, and what a case has to have or not have to work here. Then the misconceptions — the ones they'll walk in with and the ones I'll plant myself without meaning to — and roughly where in the ninety minutes I have to head each one off. One question for the end, to check whether it actually landed rather than just whether they nodded. And tell me what to skip and to admit I'm skipping it.

  Answer in British English please — my mom's from Manchester and she'll be sat in the front row.
reasoning: |-
  Okay, the user wants me to plan a session explaining the difference between subjective taste and objective moral facts, based on their argument with their sister. They need a structured approach for their adult class, avoiding philosophy jargon and using relatable examples.

  First, I should start with taste disagreements like food preferences (olives) since that's universally relatable. This establishes subjective territory clearly. Then I'll contrast with moral disagreements like the uncle throwing out clothes at the funeral, which intuitively feels different. The key is making them feel that "wrong" in moral contexts points to something beyond personal preference.

  The Christmas argument works best as the main case study because it's vivid and personal. The Nan's funeral anecdote can illustrate how moral judgments persist even when harm isn't obvious. I need to anticipate misconceptions: mainly that all value judgments are the same, or that moral facts require religious grounding. I'll address these when introducing the disagreement ladder.

  For structure: taste examples first (15 mins), then the Christmas case to show escalation (20 mins), then moral cases (20 mins). Highlight three differences: persistence of disagreement, authority beyond self, and universalizing tendency. Skip moral realism vs anti-realism debates entirely - admit this upfront.

  End with a diagnostic question: "Where would you place your own firm moral belief on this ladder?" Their self-reflection will show if they grasped the distinction.
answer: |-
  Right then. Let's get this sorted for your Tuesday lot. Forget philosophers, we'll use the rows you've actually had. Here's the plan – step-by-step, why this order, and where to bat away the nonsense.

  **The Core Goal:** Get them to feel the difference between "This isn't to *my* taste" and "This is *actually wrong*" in their guts, even if they can't perfectly define it. Make the distinction *useful*.

  **The Crucial Order & Why:**

  1.  **Start with Clear Taste (15 mins):** *Land this first.*
      *   **What:** "Olives are disgusting!" "Brussels sprouts? Bleurgh!" "That wallpaper is hideous!" "Abstract art? My cat could do that!" *Show, don't tell.* Whiteboard examples.
      *   **Why:** It's safe, uncontroversial, universally understood. Everyone gets that liking olives isn't a fact about olives, it's a fact about *them*. Establishes common ground. Your sister's starting point feels solid here. *Key Point:* Disagreements here usually end with "Well, each to their own" or "More for me!" No heat, just preference.
      *   **Misconception Head-Off:** Right here, clarify that *all* value statements start from personal perspective. But that doesn't make them *all* *just* taste. Plant the seed: *But what about when it feels different?*

  2.  **Introduce the Disagreement Ladder (The Christmas Row) - Main Case (20 mins):** *Land this next.*
      *   **What:** Recreate the scene. "My sister says X is *wrong*. Not just 'I don't like it', but *wrong*. I say it's *not* wrong. We shout. We're both dead certain." Emphasise the *heat*, the *certainty*, the feeling that the other person isn't just different, they're *mistaken*, maybe even *offensive*. This isn't "more olives for me", it's "you are *incorrect* about reality".
      *   **Why *this* case?** It's personal, visceral, and embodies the core confusion your sister raised ("it's just *my* taste like olives"). It shows the *feeling* of reporting a fact colliding with the *claim* it's just taste. It forces the question: *Why* does this disagreement feel so different from the olive one? What are we *acting like* is true when we argue this way? It perfectly sets up the need for the distinction.
      *   **Why *now*?** You've established pure taste. Now you show a case that *looks* like it might be taste (sister claims it is) but *feels* fundamentally different (the shouting match proves it). The contrast is stark.
      *   **Misconception Head-Off:** Here's where you kill "It's *all* just subjective opinion like olives." The *intensity and nature* of the disagreement itself is evidence it's *not* being treated like olives by the arguers. Point out: "You wouldn't have a proper barney over olives, would you? Why not?"

  3.  **Contrast with a "Moral-ish" Case (The Nan's Funeral) - Supporting Case (15 mins):** *Land this third.*
      *   **What:** Describe Uncle's swift clearance. The family's unified "That was *wrong*." Your question: "Who did it hurt?" The awkward silence. *They couldn't point to a victim*, but the conviction "it was wrong" held firm. Maybe mention feelings (disrespect? erasing memory? breaking an unspoken rule?).
      *   **Why *this* case?** It shows the "wrongness" feeling persisting *even when* the simple "harm" explanation falls short. It highlights the sense of violation of a norm, expectation, or duty that *isn't* just personal preference ("I wouldn't have done it" is different from "It was *wrong* to do it"). It shows the *communal* aspect of some "wrongness" judgments.
      *   **Why *now*?** After establishing the *feeling* of reporting a fact from the Christmas row, this case provides a different angle. It shows the judgment survives the "taste" defence ("Well, it was *his* mum too, maybe it was *his* taste to clear it!") and even the "harm" challenge. It reinforces that "wrong" here points to something *beyond* individual feeling or immediate consequence.
      *   **What makes a case work?** Needs **intuitive pull** (feels 'wrong'), **persistent disagreement or conviction** (not resolved by "each to their own"), and ideally, **resistance to simple explanations** (like harm or taste). Avoid cases tied to current hot-button political debates (distracts) or extreme evil (too overwhelming, bypasses the subtle distinction).

  4.  **Tease Out the Differences (25 mins):** *Land this fourth.* Build this *with* them using the whiteboard, contrasting the two columns (Olives/Christmas/Nan).
      *   **The Feel of Disagreement:**
          *   Taste: "Oh well, different strokes." Mild annoyance at most.
          *   "Wrongness": "You are *mistaken*." Heat, frustration, sense of needing to *correct*.
      *   **The 'Authority' Claim:**
          *   Taste: "This is just *me*."
          *   "Wrongness": "This isn't just *me*, this is *how it is*." Appeals beyond the self (to rules, duties, respect, fairness, nature of the act itself). Uncle wasn't just acting *differently*, he was acting *wrongly*.
      *   **Universalising Tendency:**
          *   Taste: "I hate olives, but you enjoy them? Fair enough."
          *   "Wrongness": "What you did was wrong, *even if* you thought it was fine." We think others *should* see it, or *would* see it if they understood. (Ask: "Did your family think Uncle *should* have known it was wrong? Even if he didn't think so?")
      *   **Why this order?** You've *shown* the difference through the cases. Now you help them *articulate* what they've already felt and seen. The cases provide the concrete examples to hang these abstract differences on.

  5.  **Clarify & Refine (10 mins):** *Land this last.*
      *   **What it's NOT:** Emphasise this isn't about proving moral facts *exist* (skip that metaphysical rabbit hole!). It's about recognising that *when we say and feel* something is "wrong", we are *acting as if* we're reporting something more than personal taste. We're pointing to a standard we believe exists independently of our own preference. Your sister *says* it's like olives, but her *behaviour* (shouting, certainty) betrays that she *feels* it's more than that.
      *   **The Sister's Point (Acknowledge it!):** She's right that we *start* from our perspective. We *can't* jump completely outside ourselves. And sometimes, things *are* closer to taste than we admit. But the Christmas row and Nan's funeral show it's not *all* like that.
      *   **Key Takeaway:** The difference lies in the *meaning we convey* and the *nature of the disagreement*. Saying "That's wrong!" in a moral context isn't *just* reporting your internal state like "Ouch!" or "Yuck!"; it's making a claim about the *action itself* that you believe others *ought* to recognise.
      *   **Misconception Head-Off (Final):** Crush the idea that "If you can't prove it scientifically/if there's no obvious victim, it *must* just be taste." The Nan's funeral case directly counters this. Also, head off "This means morals are absolute/unchangeable" – that's a different, much bigger discussion. Admit you're skipping the origins of morals (God? evolution? society?) and the debate about whether moral facts *actually exist* (realism vs. anti-realism). Say: "We're just mapping the *difference in how we experience and express* these judgments today."

  **The Diagnostic Question (Final 5 mins):**
  Don't ask "Do you understand?". Ask:
  > **"Think of something you firmly believe is morally wrong – not just illegal or inconvenient, but *genuinely wrong*. Where would you place your *own* feeling of certainty about *that* on a ladder between 'It's just my taste, like hating olives' at the bottom, and 'I'm reporting a fact about the world, like gravity' at the top? And *why* wouldn't you put it right at the bottom?"**

  *   **Why it works:** It forces personal application. If they place it *above* pure taste and can articulate *why* (e.g., "Because I think *anyone* should see it's wrong," "Because it violates something fundamental," "Because I'm not just saying *I* dislike it, I'm saying the *act* is bad"), they've grasped the experiential distinction. Nodding means nowt; this reveals if they can *use* the distinction.

  **In a Nutshell:**
  1.  **Start Safe (Taste):** Olives, wallpaper. Establish "each to their own."
  2.  **Introduce the Puzzle (Christmas Row - MAIN CASE):** Why the shouting match? It *feels* like more than taste.
  3.  **Deepen the Puzzle (Nan's Funeral - SUPPORTING CASE):** "Wrong" persists even without obvious harm.
  4.  **Build the Contrast:** Disagreement feel, Authority claim, Universalising tendency (using the cases).
  5.  **Clarify & Limit:** Not proving facts exist; recognising the *claim* and *feeling* in our language/arguments. Skip origins and metaphysics.
  6.  **Check Understanding:** The Diagnostic Question.

  **What to Skip & Admit Skipping:**
  *   **The origins of morality:** "We won't get into whether morals come from God, evolution, or society – that's a massive separate question."
  *   **Proving moral facts exist:** "We're not trying to settle tonight whether these 'wrongness' facts *actually exist* out there like atoms do. That's a philosopher's headache. We're just noticing that when we argue like *this* (Christmas row) or feel like *this* (Nan's funeral), we're *acting as if* they do, which is very different from arguing about olives."
  *   **Moral relativism vs. absolutism:** "We're not deciding if morals change over time or culture. We're just looking at what someone *means* when they say 'That's wrong!' in the heat of the moment."

  **Mind Your Mam in the Front:**
  Keep it grounded, use *their* likely examples (queue-jumping? grandkids being disrespectful? a bad call in bowls?), and don't be afraid of a bit of Northern bluntness: "So, Uncle Ted bins all me Nan's clobber next day. Now, was that just a bit *daft*, like wearing stripes with checks? Or did it feel properly *wrong* to you lot? Like, even if he meant nowt by it?" Get them arguing (gently!) like you did with your sister. That’s where the distinction lives. Good luck – you’ll smash it.
