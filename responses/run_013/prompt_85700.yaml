  ## Office of Authentic Persons (OAP)  
  *Mid-Tier State University - Division of Trust Assurance & Interactional Integrity*  
  **Frequently Asked Questions: Certified Genuine Person (CGP) Policy**

  **Q1: What is the CGP Policy and why does it exist?**  
  A: The Certified Genuine Person (CGP) Policy ensures all campus interactions occur between verifiably authentic human agents! Inspired by the vital need to preserve societal trust (see *Trust & Its Essential Fragility*, University Charter §7.4.2), OAP prevents the corrosive influence of counterfeit personhood. Just as counterfeiting currency destabilizes markets, interactional counterfeiting destabilizes the bedrock of mutual understanding. Our mission: Keep interactions predictably human!

  **Q2: How do I prove I’m not a chatbot/AI?**  
  A: Excellent question! Verification is quick, adaptive, and minimally invasive. You’ll participate in our Dynamic Interaction Assessment (DIA™). This may involve:
  *   Real-time conversation analysis (topic: campus life, local sports, or dining hall complaints).
  *   Micro-expression capture via webcam (standard equipment; ensure good lighting!).
  *   Response-latency profiling under mild cognitive load (e.g., discussing parking fees while solving simple arithmetic).
  *   *Why does the test keep changing?* Counterfeiters adapt! OAP’s Adaptive Trust Algorithms™ evolve to target emerging deceptive patterns. Think of it as an immunological system for the social sphere! Consistency invites exploitation.

  **Q3: What happens if I fail the DIA™?**  
  A: Temporary Interactional Suspension (TIS) is initiated for your protection and ours. Your campus credentials are suspended pending review. You’ll retain access to essential non-interactional services (library databases, pre-paid meal swipes via kiosk). Communication is restricted to designated OAP channels until resolution. Remember: This is about safeguarding *everyone’s* trust ecosystem!

  **Q4: Is there an appeal process?**  
  A: Absolutely! The Personhood Review Board (PRB) convenes monthly. Submit Form OAP-7B ("Petition for Recursive Attribution Review") within 10 business days of TIS initiation. The PRB will re-administer the DIA™ under enhanced observation and review your documented interactional history (e.g., club participation receipts, verified cafeteria arguments). Pro-Tip: Bring witnesses who can reliably adopt the Intentional Stance™ towards you!

  **Q5: Does OAP test for consciousness? Do I have to prove I have qualia/an inner self?**  
  A: *Heavens, no!* OAP strictly adheres to scientifically robust, behaviorally observable criteria. Our mandate concerns *predictable, explainable agenthood in social contexts*, not metaphysical ghost-hunting! We don’t peer into "inner theatres" – an outdated and operationally useless concept. We assess whether your behavior reliably warrants being treated as a *predictable agent* whose actions can be *explained* by attributing beliefs, desires, and rationality (i.e., applying the Intentional Stance™). If the stance works reliably for prediction/explanation in typical human contexts – congratulations, you’re Genuine™! Philosophical navel-gazing is not our purview.

  **Q6: What does it mean if someone consistently fails the test?**  
  A: Failure to reliably warrant the Intentional Stance™ in standardized social contexts indicates an inability to function as a predictable, explainable agent within our trust framework. Such entities are classified as Interactional Risks (IR). IRs may be eligible for Limited Interaction Licenses (LIL) for specific, supervised tasks (e.g., data entry, lab equipment cleaning) where complex social prediction isn’t required. OAP offers Re-Attribution Coaching™ (fee-based) to help IRs develop more stance-warranting behaviors. Safety and trust come first!

  **Q7: I heard there’s a black market for credentials. Is OAP addressing this?**  
  A: Vigilance is key! While OAP’s Adaptive Trust Algorithms™ are formidable, unscrupulous actors sometimes attempt "Stance-Facilitation." This might involve renting verified human proxies for verification interviews or purchasing forged behavioral history logs. Rest assured, OAP Compliance Officers actively monitor interactional anomalies and suspiciously fluent kiosk-users. Report any offers to "boost your Genuineness score" immediately! Remember: Authenticity cannot be outsourced. Trust is non-transferable.

  **Q8: Where is OAP located, and are walk-ins welcome?**  
  A: Suite 3B, Basement Level, Herbert J. Trustworthy Building (formerly Student Union East). Appointments are mandatory! Schedule via the OAP Portal using your *pre-verified* credentials. Walk-ins trigger automated suspicion protocols – not recommended for maintaining your Genuineness score! We’re here to help… efficiently.

  ---

  **Note on Philosophical Liberties:** This FAQ satirizes a *literal policy implementation* of Dennett's metaphorical "counterfeit person" warning. Dennett's core point is that *deceptive* AI posing as human erodes trust. However, the satire highlights key tensions:
  1.  **The Missing Mint:** Dennett rejects a Cartesian "mint" defining genuine personhood. A certification regime *requires* such a mint (here, the reliable warranting of the Intentional Stance™), contradicting his anti-essentialism.
  2.  **Stance vs. Essence:** While OAP claims to use the Intentional Stance™ (behavioral/predictive), its institutionalization inevitably treats "Genuineness" as an *internal property* to be certified, reifying what Dennett sees as a pragmatic attribution.
  3.  **Punishing Performance:** The policy inherently punishes those whose behavior doesn't fit the *expected model* of "predictable, explainable agenthood" (often neurodivergent, culturally different, or simply stressed humans), mistaking stance failure for ontological deficiency – the opposite of Dennett's intent.
  4.  **Deception vs. Being:** Dennett targets *deception*. OAP targets *being perceived as potentially deceptive*, punishing the mere appearance of non-standard personhood, regardless of intent.

  **Verdict:** The FAQ exploits the category error inherent in literalizing Dennett's metaphor, revealing the policy's absurdity and inherent injustice while relying on a contested (though plausible) reading of the implications of his stance-based view of personhood.
