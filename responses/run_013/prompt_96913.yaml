  User's deeper need: They want ammunition against bad-faith model comparisons. Their frustration is that Fomenko defenders always adjust the model (e.g., "forgers planted that text") to fit data. Bayesian tools alone can't call this pseudoscience; it just looks like overfitting. But combining Popper's insistence on pre-registered tests + Lakatos's progressiveness could help. Highlighting Laudan's societal costs might appeal to their practicality. 

  Unspoken angle: User might feel their rigorous framework is being weaponized by pseudoscientists. They need ways to spot when "model comparison" is a smokescreen. The residue report's gaps (e.g., no Bayesian handle on ad-hoc rescues) validate that—it's not their framework missing something, but pseudoscience exploiting flexibility. Stress that good science pre-commits to what would lower posterior probability, unlike Fomenko's moving goalposts.
answer: |-
  **Pseudoscience is a research program with pathological priors that evade decisive predictive checks, persistently renormalizing its likelihood to avoid disconfirmation.** Here's the demarcation problem in your terms:

  1.  **Popper (Falsificationism):**
      *   **Bayesian Translation:** A scientific theory must assign *vanishingly small prior probability* to outcomes that *must* occur under plausible alternatives. Pseudoscience sets priors such that *no possible observation* drives its posterior probability to near zero. It's like a model with infinitely flexible parameters where `P(Data | Model)` is always non-zero because the model absorbs *any* data via auxiliary hypotheses (e.g., "the forger did it").
      *   **Accusation:** Fomenko's chronology behaves like this. Radiocarbon dates? *Forged or misapplied.* Contradictory star charts? *Miscalibrated or misinterpreted.* Its "likelihood" never crashes because the model space includes *all possible forger actions* as latent variables with high prior weight.

  2.  **Lakatos (Research Programmes):**
      *   **Bayesian Translation:** Evaluate the *trajectory* of the "model family" (research programme). A *progressive* programme increases its marginal likelihood over time by predicting *novel facts* (high-likelihood data not used in fitting). A *degenerating* programme only fits known data via constant ad-hoc adjustments (adding epicycles), lowering the Occam factor and failing novel predictions.
      *   **Accusation:** Fomenko's programme is degenerating. "Fits" are achieved by retroactive, complex auxiliary hypotheses (forgery conspiracies) to explain away disconfirming evidence, not by predicting novel discoveries (e.g., *before* excavation, specifying exactly where a *non-forged* artifact contradicting his timeline would be found). The prior complexity cost (Occam factor) balloons without predictive gain.

  3.  **Laudan (Problem-Solving Effectiveness):**
      *   **Bayesian Translation:** Focus on *explanatory breadth and coherence*. A good theory/hypothesis has high posterior because it explains diverse, significant data (high `P(Data | Model)`) *without requiring numerous low-probability auxiliary assumptions* (low prior complexity). Pseudoscience solves few genuine empirical problems, creates new ones (e.g., explaining the forger's motives/means), and clashes with well-established, high-posterior theories in other domains.
      *   **Accusation:** Fomenko's model has catastrophically low priors on its core auxiliary claims (e.g., the scale/sophistication of medieval forgery required). It fails to explain why *other* high-posterior models (physics-based dating, linguistics, archaeology) work so well *if* their chronological foundations are false. Its "fit" is narrow and purchased with absurd complexity.

  **Residue Report:**

  *   **Translates Cleanly:**
      *   Popper's core demand for *testability* maps to designing checks where `P(Data | Model)` is *low* under the theory but *high* under alternatives.
      *   Lakatos's "progressive vs degenerating" maps perfectly to comparing *trajectories of marginal likelihood* and the predictive success on *novel* data vs. *retrofitted* data.
      *   Laudan's "problem-solving" aligns with high posterior probability achieved through broad explanatory power (high likelihood across datasets) and coherence with other high-posterior models (joint prior probability), contrasted with theories needing many low-probability auxiliaries.
      *   The core pathology – endlessly renormalizing likelihood via auxiliary hypotheses – is identical to overfitting/avoiding disconfirmation.

  *   **Fudged:**
      *   **Popper's "Falsified" State:** Bayesianism deals in degrees of belief (posteriors). Saying a theory is "falsified" often means `P(Model | Data) << 0.05` or similar, but it's *always* non-zero. Popper's binary "falsified" is an idealization. We fudge by accepting "effectively falsified" when posterior is vanishingly small *under reasonable priors*.
      *   **Lakatos's "Hard Core":** The metaphysical commitment protecting the hard core isn't *just* a strong prior; it's often treated as *untouchable* within the programme. Bayesian updating *could* technically lower its probability, but in practice, degenerating programmes protect it exactly like Fomenko protects his core chronology – by sacrificing everything else first. We model this as an *extremely* strong, almost dogmatic prior.
      *   **Laudan's "Conceptual Problems":** Some problems Laudan cares about (e.g., internal inconsistency, conceptual vagueness) are harder to quantify as likelihoods or priors. We approximate by associating them with low prior probability or low model coherence.

  *   **No Direct Counterpart:**
      *   **The Societal/Historical Context (Laudan/Lakatos):** Bayesian model comparison is largely ahistorical. Laudan's emphasis on the *track record* of problem-solving over time and Lakatos's focus on the *historical trajectory* of a programme have no direct parameter. Your framework evaluates the *current state* of evidence and models, not their historical development or societal impact. The *accusation* of pseudoscience often carries connotations of wasted effort, misleading the public, or historical stagnation – these societal costs aren't captured in marginal likelihoods.
      *   **The "Accusation" Aspect:** Bayesianism quantifies *poor model performance* (low posterior, degenerating fit). Calling it "pseudoscience" adds a sociological/historical judgment about *persistence despite this poor performance*, often implying bad faith, ideology, or a closed community. The math identifies a degenerating model; the "pseudoscience" label judges the community's *response* to that degeneration (doubling down vs. abandoning).

  **Is the Framework Missing Something, or Is the Dispute Less Substantive?**

  *   **Your Framework Captures the Core Epistemic Issue:** The Bayesian lens perfectly exposes the *technical* flaw: pathological priors, evasion of predictive checks, and persistent renormalization of likelihoods via ad-hoc adjustments. This *is* the heart of the demarcation problem epistemically. Fomenko's defence *is* exactly this renormalization.
  *   **The "Accusation" Gap is Real (But Not Your Framework's Fault):** The sociological/historical elements (persistence despite degeneration, community dynamics, societal impact) *are* real aspects of why we call something pseudoscience vs. just "bad science." Bayesian model comparison isn't designed to assess these. This doesn't make the debate less substantive; it highlights that demarcation has both a technical *and* a sociological dimension. Your framework rigorously handles the technical; the "accusation" stems from observing the sociological response to technical failure.
  *   **Yes, It Becomes a Matter of Degree (And That's Mostly Right):** Bayesianism *does* turn epistemic warrant into a matter of degree (posterior probability). This is largely correct. The line between "bad science" and "pseudoscience" is often blurry and hinges on *how persistently* and *using what mechanisms* (e.g., unfalsifiable auxiliaries) a degenerating programme avoids updating its core priors downwards. Fomenko sits firmly in the pathological end due to the scale and nature of the auxiliary hypotheses required.
