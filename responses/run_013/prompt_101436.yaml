prompt: |-
  I'm a TA for a first-year seminar called "What is History?" — the students are mostly not history majors, and they've had exactly one lecture on global history that name-dropped a few things and moved on. Next week I have a 75-minute section and I want to teach a single question: can the past be told from everywhere at once? Don't answer the question for me. I need a plan for how to teach it, and I want you to think of yourself as someone who actually teaches historiography to beginners, not as a summarizer of "the debate."

  Here's the thing I want to build the session around, and it matters that it's mine and not a classic: I'm going to hand out a fake "World History Timeline" that I wrote myself. It has five turning points — something like the invention of writing, the rise of classical empires, the age of exploration, the industrial revolution, the world wars — each with a one-line caption, and no dates except the century. The whole thing is secretly anchored to one region and one story of "progress," but it never says so. The students will read it before I say anything about vantage points. I don't want to just spring it on them and say "gotcha"; I want the reveal to be something they do to themselves.

  So what I need from you, in order:

  - The order the ideas have to come in, and why each depends on the one before. What has to be in place before the question even makes sense to them, and what I should NOT introduce first (I'm tempted to start with "periodization is arbitrary," and I suspect that's wrong — tell me if it is).
  - Whether my timeline is the right carrying example, or what it would need to have or lack to actually carry the whole session. What does it need to make them feel, and what would ruin it (e.g. if it's too obviously slanted they'll spot it in ten seconds and learn nothing; if it's too subtle they'll never see it).
  - The misconceptions they'll bring or form — I'm predicting "global history just means covering more regions," "the fix for a biased timeline is adding the missing people," and "telling it from everywhere at once means all accounts are equally true." Give me the ones I'm missing, when in the sequence each one tends to form, and exactly where I should head it off.
  - The check for understanding at the end: one thing I can have them do that shows they got it rather than just felt bad about a handout.
  - What I should openly refuse to settle at this level and say so.

  Two more things. First, don't lean on me citing any particular book or historian — I can't look anything up mid-section and neither can you, so if you want to name a concept, name it in plain words. Second, brainstorm a bit before you commit to the sequence; I'd rather see you discard an ordering than hand me the first one that sounds tidy.

  Give me the whole plan as a JSON object so I can paste it into my prep doc. Use these fields: "sequence" (array of objects with "step", "idea", "why_now", "depends_on"), "carrying_example" (an object with "verdict", "must_have", "must_lack"), "misconceptions" (array of objects with "misconception", "when_it_forms", "where_to_head_off", "how"), "check_for_understanding" (an object with "task" and "what_it_shows"), and "leave_out" (array of strings, each with the reason I'm leaving it out). If any field would just be filler, say so in the field rather than padding it.
reasoning: |-
  We are designing a 75-minute section for first-year non-history majors on the question: "Can the past be told from everywhere at once?" The core activity is a fake "World History Timeline" that the students read at the beginning, which is secretly anchored to one region and one story of progress.

  Key goals:
  - The reveal of the timeline's bias should be something the students do to themselves, not a "gotcha."
  - We must build the concepts step by step, starting from what they know (one lecture on global history) and leading to the question.
  - Avoid starting with abstract concepts like "periodization is arbitrary" because that might be too advanced and disconnected at the beginning.

  Brainstorming the sequence:

  1. We must start with the timeline. Why? Because it is concrete and will engage them immediately. They can react to it without any prior theory. We don't tell them it's fake yet.

  2. After reading the timeline, we can ask them to reflect on what they see. Then we introduce the idea of a "vantage point" (or perspective) by having them compare the timeline to their own knowledge or to a different timeline. This step should make them notice that the timeline is focused and selective.

  3. Then we can bring up the idea that all historical accounts are selective. This leads to the question: How do we decide what to include? This step is crucial because it moves from noticing bias to understanding the necessity of selection.

  4. Now we can introduce the challenge of global history: trying to tell a story that includes multiple perspectives. This sets up the main question: can we tell it from everywhere at once?

  5. We then explore the practical and conceptual difficulties of including all perspectives. This is where we address misconceptions.

  6. Finally, we end with a check for understanding that requires them to apply the concept without just feeling bad about the timeline.

  Now, let's break down the sequence step by step:

  Step 1: Engage with the timeline (without revealing anything)
     - Idea: Students read the timeline and note their initial reactions. We ask: "What story does this timeline tell? What does it emphasize? What does it leave out?"
     - Why now: It's concrete and accessible. They don't need any theory to react to it. It sets the stage for the entire discussion.

  Step 2: Introduce the concept of a vantage point
     - Idea: Explain that every historical account is written from a particular place and time, with a particular set of concerns. We can ask: "Where might the author of this timeline have been from? What clues suggest that?"
     - Why now: They have just seen a concrete example. Now we give them the tool (vantage point) to analyze it.
     - Depends on step 1: Without seeing the timeline, they wouldn't have a concrete example to apply the concept to.

  Step 3: Discuss the necessity of selection in history
     - Idea: Every history must select events because we can't include everything. The question is: How do we choose? What principles guide our selection?
     - Why now: They've seen that the timeline is selective and from a particular vantage point. Now we make explicit that selection is unavoidable, and that the problem is not selection itself but the basis for selection.
     - Depends on step 2: They need to understand that the timeline is from a vantage point to then see that the selection is tied to that vantage point.

  Step 4: Pose the big question and explore the challenge of multiple vantage points
     - Idea: Ask: "Can we tell the past from everywhere at once?" Have them discuss in small groups what that would require and if it's possible.
     - Why now: They now understand the timeline as one vantage point. They understand that selection is necessary. Now we challenge them to think about whether we can have a history that incorporates many vantage points without becoming chaotic or losing coherence.
     - Depends on step 3: They must have grappled with the necessity of selection to see why adding more perspectives is not just a matter of including more facts.

  Step 5: Address misconceptions as they arise (this will be woven in, not a separate step) and then discuss the limitations and possibilities
     - Idea: After the group discussion, bring the class together and have groups report. Then, address common misconceptions (like adding more regions fixes bias, or that all accounts are equally true) by using their own arguments and the timeline example.
     - Why now: After they have tried to answer the question, they are primed to see the flaws in these misconceptions.

  Step 6: Check for understanding
     - Task: Have them sketch a timeline for one event (or a very short period) from two different vantage points (e.g., the Industrial Revolution from the perspective of a factory owner in England and a cotton farmer in India). They don't have to do research; they can imagine based on what they know. Then, ask: How are they different? What would it take to combine them into one account?
     - What it shows: It requires them to apply the idea of vantage point and to see that combining perspectives is not just additive but requires reconciling different narratives.

  Now, about the timeline example:

  Verdict: The timeline is a good carrying example if it is subtly slanted. It must have:
     - Must have: A clear but not obvious focus (e.g., Western-centric, but without saying "Europe" in every point). The turning points should be familiar enough that they don't question them at first. It must lack any explicit acknowledgment of its own perspective (so no "as seen from Europe").
     - Must lack: Over-the-top bias (like only European events) or too much detail that would make the slant obvious. It should be plausible enough that they might accept it as a standard world history at first glance.

  Misconceptions to address:

  1. Misconception: Global history just means covering more regions (adding more dots on the map).
     - When it forms: During the group discussion (step 4) or when we discuss the timeline's omissions.
     - Where to head off: In step 4 when discussing the big question, and in step 5 when addressing group reports. How: Ask them if adding a few events from other regions to our timeline would fix the problem. Then point out that the narrative structure (the "arc" of progress) might still be the same, and that the connections between regions might be missing.

  2. Misconception: The fix for a biased timeline is adding the missing people.
     - Similar to the above, but more about representation. Head off in the same way.

  3. Misconception: Telling it from everywhere at once means all accounts are equally true (relativism).
     - When it forms: When we discuss multiple perspectives, they might think that every perspective is equally valid and that there is no objective truth.
     - Where to head off: In step 5 when discussing the challenges. How: Emphasize that while different perspectives are valid, they are not all equally supported by evidence. Also, some events (like the Industrial Revolution) happened and had global effects, but the way we tell the story changes based on what we emphasize.

  4. Misconception: A truly global history is impossible because it's too complicated, so we shouldn't try.
     - When it forms: During the group discussion when they realize the difficulty.
     - Where to head off: In step 5. How: Acknowledge the difficulty but also point out that we can try to build histories that are more inclusive by making connections and showing interactions.

  5. Misconception: The timeline is "wrong" and we need to replace it with the "right" one.
     - When it forms: After the reveal of the bias (step 2 or 3).
     - Where to head off: In step 3 when discussing selection. How: Emphasize that the timeline isn't wrong per se but incomplete and shaped by its vantage point. The goal is not to replace one master narrative with another but to understand the limitations and to seek multiple narratives.

  Leave out:

  - Deep philosophical discussions about the nature of truth in history. Reason: Too abstract for beginners.
  - Detailed historiography of specific historians or schools. Reason: They don't have the background and it's not necessary for the core question.
  - How to actually write a global history (methods, sources, etc.). Reason: This is a first step in thinking about perspective, not a how-to guide.

  Check for understanding:

  - Task: As described in step 6.
  - What it shows: They can identify how vantage points shape narratives and articulate the challenges of combining them.

  Now, structure as JSON:

  Note: We'll break the sequence into 6 steps (1-6 as above). The misconceptions array will list 5 misconceptions (the 5 above). The carrying example verdict is "good" with the must_have and must_lack. The leave_out array will have 3 items.

  Let's write the JSON.
