  Build me a realistic case where destroying a habitat ends up being net good for the wild animals that were living in it — not because I get to stipulate that the survivors are happier, but because of how the populations shake out on their own once the habitat is gone. One paragraph, somewhere a real conservation decision could actually land (a drained marsh, a logged block, a cleared island), no invented species, no exotic setup. Then do the accounting: what a total-welfare view, an average-welfare view, and a view that only counts animals already alive (and not the ones who'd never get born) each say about the case, and which feature of the ecology is doing the actual work. If I swap the boom-and-bust breeders out for a slow-breeding species, does the case flip? And how does someone who thinks the ecosystem itself is the thing worth protecting push back — do they have a move that isn't just refusing to count the animals, or is that probally the whole disagreement?
