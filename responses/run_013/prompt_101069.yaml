answer: |-
  ## DEAR POSTERIOR: A Bayesian Agony Aunt Column  
  *Where personal problems meet probability theory, and feelings are just unnormalized likelihoods.*

  ---

  **LETTER #1: THE BARKING DISAGREEMENT**  
  > *Dear Posterior, my partner and I finally did the rational thing. We announced our credences about whether our terrier, Biscuit, will bite the mailman. I’m at 0.7 (he hates uniforms). She’s at 0.35 (he’s all bark). We’re both highly rational Bayesians with common priors (we adopted Biscuit together!). Now we’re stuck glaring over the coffee maker. Neither will budge, because neither wants to be the irrational one. Help! — At Odds in Ohio*

  **POSTERIOR REPLIES:**  
  Your commitment to Bayesian honesty is admirable! But you’ve misunderstood the *process* of agreement. Announcing your posteriors isn’t the endpoint; it’s the first step in a beautiful iterative dance of knowledge sharing. **Aumann’s Agreement Theorem tells us that rational agents with a common prior cannot *persistently* disagree once their posteriors become common knowledge.**  

  Key insight: **Your announcement itself was informative.** When you declared P(Bite) = 0.7, you revealed information *beyond* your initial observation. Your partner learned that *your* evidence supports a high probability. She should update her belief *upward* from 0.35, conditional on you (a rational agent) seeing evidence justifying 0.7. Simultaneously, her declaration of 0.35 should cause you to update *downward* from 0.7.  

  **The impasse is the problem.** The theorem demands you *keep announcing and updating* until convergence. If you share a common prior and fully disclose your evidence structures (e.g., "I saw Biscuit snarl at the UPS truck," "He licked the FedEx lady"), your posteriors *must* meet. If they don’t converge after exhaustive updating, your priors *weren’t* truly common (did one of you secretly believe Biscuit was raised by wolves?). **The theorem forces agreement; it doesn’t adjudicate truth.** Biscuit’s bite probability might be 0.55. Or perhaps your common prior included flawed data. Update iteratively. And maybe buy the mailman thicker pants.  

  ---

  **LETTER #2: THE SUSPICIOUS TRADERS**  
  > *Dear Posterior, my trading partner and I keep buying positions from each other at prices we both think are steals. We both consistently profit! Our consultant cited “Aumann” and said this is “impossible with a common prior.” Is he right, or just describing a sterile world where no trades happen? — Profiting in Parallel, Wall Street*

  **POSTERIOR REPLIES:**  
  Your consultant is technically correct (the best kind!), but likely misapplying the theorem’s scope. **Aumann’s theorem (and its cousin, the No-Trade Theorem) states: With a common prior, common knowledge of rationality, and common knowledge of the trade itself, it’s impossible for two rational agents to *both* believe the trade is strictly beneficial.** If you both think you’re getting the better deal *after accounting for all shared information*, your beliefs violate the assumptions.  

  **Three possibilities:**  
  1. **No Common Prior:** Your fundamental models differ. You think inflation will soar; he thinks it’ll crater.  
  2. **Not Common Knowledge:** Do you *both know* that the other sees the trade as profitable? Do you both know *that* you both know? If not, the theorem’s conditions aren’t met.  
  3. **Non-Belief-Based Motives:** You’re ignoring the theorem’s escape hatches! Are you trading for liquidity? Hedging divergent risks? Serving different clients? Differences in risk aversion? These are *rational* reasons to trade profitably on both sides!  

  **The sharper version:** The impossibility of *common knowledge of strict preference* for a trade is *equivalent* to the existence of a common prior. Your ongoing profits suggest one of the above applies. Your consultant lives in a frictionless vacuum; you work in the messy real world. Keep trading, but audit your priors. And maybe share some alpha with your Bayesian agony aunt.  

  ---

  **LETTER #3: THE INHERITANCE OMISSION**  
  > *Dear Posterior, My late father’s estate was divided per his wishes. All present siblings (and spouses) announced their understanding until we reached consensus: Cousin Derek gets the vintage Corvette. But Derek was abroad! We never told him. Is our family agreement “common knowledge” in the Aumann sense? Or is this a ticking time bomb? — Quietly Concerned, Connecticut*

  **POSTERIOR REPLIES:**  
  Alas, your agreement lacks the necessary epistemic rigidity. **For Aumann-style agreement to hold, the posterior beliefs (the understanding about the Corvette) must be *common knowledge* among all relevant agents.** This requires:  
  1. **Everyone Knows the Belief** (Derek doesn’t!).  
  2. **Everyone Knows that Everyone Knows** (You know Derek doesn’t know!).  
  3. **And so on, ad infinitum.**  

  **You have consensus, not common knowledge.** Derek possesses *zero* information about your convergence. His prior remains unupdated! This isn’t just a social oversight; it’s a formal failure of the agreement conditions.  

  **The Danger:** If Derek returns with a different understanding (e.g., "Uncle Bob promised me the sailboat!"), his prior hasn’t been conditioned on your family’s announcements. Rationality *allows* him to hold a divergent belief indefinitely because he lacks the key evidence. **The theorem requires all parties to hear the announcements and update.**  

  **Recommendation:** Formally announce the agreement *to Derek*. Document it. Ensure he acknowledges it. Only then will your posteriors inhabit the same measurable space. Otherwise, prepare for a possible lawsuit (a very non-Bayesian form of updating).  

  ---

  **POSTERIOR'S PRIOR:** *Disagreement is evidence of differing information or priors. Agreement requires relentless, shared updating. Now go condition on your evidence.*  
  *(Got a problem? Your credences are safe with me. Write: dearposterior@badnewsletter.edu)*
