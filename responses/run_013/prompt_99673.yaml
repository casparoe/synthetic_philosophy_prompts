prompt: |-
  Hey, so I run the philosophy club at my school and for our history-of-science unit I'm putting together a mock exam, like a practice final for the seniors. I want one essay question on Galileo's views about scripture and science. The problem is everyone just writes the same thing: the Bible is about how to get to heaven, not about how the heavens move, and that's it, no thinking. I want a question that can't be answered by reciting that. It should force them to deal with the hard part. Galileo says that when a literal reading of the Bible clashes with something clearly demonstrated about nature, you reinterpret the Bible rather than the science — but doesnt that basically hand the final say to whoever gets to decide what counts as "demonstrated"? And who is supposed to have the authority to say which passages are about salvation and which are just using everyday language? I want them to actually take a side on whether his approach is a principled way of keeping faith and science from fighting, or wether it quietly makes theology answer to physics.

  Write me the question, a model answer of about 500-600 words, and a marking scheme that separates an A from a B — name the specific moves a top answer has to make and the specific mistakes that should cost marks. Also, since I don't want to teach my clubmates wrong stuff: in the model answer, can you keep separate what's actually settled among people who really know this area and what's genuinely still argued about, and not present one contested reading as if it's the agreed view? Thanks!
