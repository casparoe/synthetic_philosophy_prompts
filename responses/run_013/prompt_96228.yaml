            Why? Because we want to minimize the change from the uniform prior (all 0.25) subject to the constraint. 
            The constraint only affects the Red territory. In Blue, we have no constraint, so we leave the two Blue cells equal and also as close as possible to 0.25. 
            The MRE solution sets the two Blue cells equal and the Red cells in 3:1 ratio, and then sets the probabilities proportional to the prior but adjusted for the constraint. 
