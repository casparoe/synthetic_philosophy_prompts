  Hmm... The key move is framing the question precisely: not just "are they different?" but "do they share equal immunity to determinism?" That makes it answerable. The standard reading's flaw is treating them monolithically when Strawson himself separates them - that's solid ground to stand on.

  For method, week-by-week planning must be ruthless. Week 1: map Strawson's distinctions. Week 2: reconstruct standard argument. Weeks 3-5: test each attitude family against determinism. Crucially, week 4 needs tools to verify if differences are real - maybe analyze necessary conditions for each attitude? Like whether vicarious attitudes require abstract moral norms. 

  Risk management is vital. They should expect pushback on guilt being "special" - maybe self-directed attitudes are just internalized interpersonal ones. I'll warn them that half their hypothesis (the guilt part) is shakiest. Success isn't proving all differences, but showing the question matters.

