prompt: |-
  I'm running a one-off session for a mixed first-year seminar — half bio students, half philosophy — and the topic is what counts as life. Dont explain it to me; plan how I should teach it. What has to be in place before the borderline cases even feel like a problem (my guess: they first need to stop assuming alive/not-alive is a fact of the world and start seeing it as something a definition does), which single case should carry the whole thing and what it has to have and lack — I don't want viruses carrying it, everyone's already rehearsed that one, so pick something else and tell me why yours beats it — the order the pieces go in and why, the misconceptions they'll walk in with and the ones they'll form along the way (I'm betting on "this is just a word game," "there's one true definition we're hunting for," and "borderline means we just don't know yet"), and exactly where in the sequence I head each one off. End me with one question I can ask at the close that shows whether they've actually got it rather than just picked a side.

  The thing I really care about, and where I think the session lives or dies: get them to see that "is this thing alive?" and "is life a natural kind or a convenient label?" are two different questions, and that the axis that matters is whether you demand metabolism (a self-maintaining chemical system holding itself away from equilibrium) or just evolution (a lineage that replicates and gets selected). Those give different verdicts on the same case, and which one you reach for depends on what you want the definition to do — catalogue the domain of biology, or give an operational test for spotting life somewhere it might not look like ours. Work that into the arc rather than bolting it on at the end. Also tell me what to leave out at this level and say so out loud. I have fifty minutes and a whiteboard.
reasoning: |-
  Okay, the user is running a one-off seminar for first-year students split between biology and philosophy majors. The topic is "what counts as life," and they want a tightly structured 50-minute session plan. They've explicitly rejected viruses as the central case study (too cliché) and emphasized two key pedagogical goals: 

  First, they want students to stop viewing "alive/not-alive" as a binary fact of the world and start seeing it as definition-dependent. Second, they want to contrast the metabolism-centric view (life as chemical self-maintenance) versus the evolution-centric view (life as replicating lineage) and show how these serve different purposes. 

  Hmm... their frustration with "rehearsed" virus debates suggests they've seen superficial treatments before. The demand to "head off misconceptions in sequence" implies they've encountered students getting stuck on "it's just word games" or "we'll find the true definition someday." Smart that they identified those three specific traps upfront. 

  For the case study, mitochondria are perfect. Wait—no. Mitochondria are organelles inside eukaryotic cells, not independent entities. But they were free-living once! That evolutionary history creates beautiful tension: they perform metabolism but can't replicate independently now. And crucially, both biology and philosophy students will have heard of them but never examined their status. 

  *Why mitochondria beat other options:*
  - Prions? Too simple—just misfolded proteins, no metabolism at all. Won't force the definitional tension.
  - AI/robots? Too sci-fi, distracts from biological focus.
  - Fire? Useful for showing why metabolism alone isn't sufficient but lacks replication entirely. Mitochondria have *both* traits... partially. 

  The session must ruthlessly avoid taxonomy debates (is a virus alive?) or astrobiology (how we'd detect life). Whiteboard use is non-negotiable—need to map the two axes visibly. 

  Biggest risk: Philosophy students might overshoot into "it's all arbitrary" while bio students dig into "but mitochondria HAVE DNA." Need to force them to swap lenses: "What if you're designing a Mars rover? What if you're sequencing evolutionary history?" 

  Closing question must prevent binary answers. Something like: "If we found mitochondria-like structures floating in Venus' clouds—performing glycolysis but no replication apparatus—would NASA call it life? Would an evolutionary biologist?" Makes them apply the frameworks, not pick teams.
answer: |-
  Here’s a battle-tested 50-minute plan targeting your core goals. The arc forces a collision between metabolism-first and evolution-first definitions using a single borderline case, while systematically dismantling misconceptions.

  ### **Pre-Session Prep (Whiteboard Setup)**
  - Left Column: "Traits We Associate with Life" (brainstormed later)
  - Center: Split into two sections: "METABOLISM → Self-Sustaining Chemistry" and "EVOLUTION → Replicating Lineage"
  - Right Column: "Why Define Life?" (filled mid-session)

  ---

  ### **Session Flow & Why This Order**

  1. **Ignition (5 min)**  
     - **DO:** Show a 10-second video of *quivering droplets* (coacervates or "chemoatoms" from synthetic biology labs doing spontaneous metabolism-like reactions). Ask: *"Is this alive? Why/why not?"*  
     - **WHY:** Short-circuits the "biology = Earth life" reflex. Forces students to articulate intuitive criteria without established terminology.  
     - **MISCONCEPTION HEAD-OFF:** Prevents "it’s just chemistry" dismissal by making the boundary ambiguous *first*.

  2. **Trait Brainstorm → The Trap (7 min)**  
     - **DO:** Elicit student traits (Reproduction! DNA! Energy use! etc.). List under "Traits We Associate with Life". Circle "Reproduction" and "Metabolism".  
     - **WHY:** Reveals the *checklist fallacy*. Students enter thinking life is a fixed set of traits. This sets up the central conflict when your borderline case lacks one circled trait.

  3. **Introduce the Borderline Case: MITOCHONDRIA (10 min)**  
     - **WHY IT BEATS VIRUSES:**  
       - Viruses lack metabolism. Mitochondria **HAVE metabolism** (Krebs cycle, ATP production) but **CANNOT independently replicate** (no DNA replication machinery).  
       - Forces choice: Is "self-sustaining chemical system" *enough* without replication?  
       - Bio students know mitochondria but haven’t questioned their status; Phil students grasp the categorical tension.  
     - **DO:**  
       - Quick bio primer: "Mitochondria: Have their own DNA, make energy, evolve, but *only replicate when the cell does*."  
       - Ask: *"Alive? Yes/No/It’s Complicated? Defend."*  
       - Let debate ignite. **Push:** *"If it can’t make more of itself alone, is it just a machine?"*

  4. **The Axis Reveal (10 min)**  
     - **DO:** Point to the circled traits. Draw two boxes under center headings:  
       - **METABOLISM BOX:** "Holds itself away from equilibrium. *Does this?*" → YES (mitochondria burn fuel).  
       - **EVOLUTION BOX:** "Lineage with replication+selection. *Does this?*" → ONLY WITH HOST CELL (semi-autonomous).  
     - **WHY:** Visually fractures "life" into two competing frameworks. Forces recognition: **Your definition depends on your goal.**  
     - **MISCONCEPTION HEAD-OFFS:**  
       - *"True definition hunt"*: "Notice—neither definition is *wrong*. Which is *useful* depends on your question."  
       - *"Borderline = we don’t know"*: "Mitochondria aren’t a mystery. We *know* their biology. The ‘problem’ is our definitions."  
       - *"Just word games"*: "Words frame how we investigate. A Mars rover seeking *metabolism* vs. a geneticist seeking *evolution* design different tools."

  5. **Why Define? The Payoff (10 min)**  
     - **DO:** Fill "Why Define Life?" column:  
       - METABOLISM-DEF: "Find life that *doesn’t* look like us (alien biosignatures)."  
       - EVOLUTION-DEF: "Study how traits change (Darwinian dynamics)."  
     - **Connect:** "Mitochondria: Evolutionary biologists see them as *organisms* (endosymbionts). Exobiologists might not flag them as ‘life’ on another planet."  
     - **WHY:** Makes explicit that the choice is *functional*, not ontological. Head-fakes "natural kind" thinking.

  6. **Synthesis & Your Closing Question (8 min)**  
     - **DO:** Ask:  
       > ***"If we discover a drifting cloud in Venus' atmosphere that performs complex, self-sustaining chemistry (metabolism) but cannot replicate or evolve... does calling it 'alive' help science more than calling it 'not-alive'? Why?"***  
     - **WHY THIS QUESTION:**  
       - Tests if they grasp that definitions serve *goals* (cataloging vs. detecting).  
       - Forces them to weigh the axes (metabolism vs. evolution/replication).  
       - "Help science more" prevents binary answers. Reveals if they see definitions as tools.  
       - Venus cloud = novel case; no rehearsed answers.

  ---

  ### **What to Explicitly LEAVE OUT & Why (State This!)**
  - **"We’re skipping viruses, prions, and AI. Not because they’re uninteresting, but because they don’t *simultaneously* challenge metabolism AND replication like mitochondria do. We’re also leaving ‘consciousness’—it’s a different debate."**  
  - **WHY:** Avoids rabbit holes. Focuses energy on the core conceptual crack.

  ---

  ### **Why This Works**
  - **Mitochondria** weaponizes students’ basic bio knowledge against their intuitions.  
  - The **METABOLISM vs. EVOLUTION** split is the spine—not an add-on.  
  - **Venus cloud question** doesn’t ask *if* it’s alive, but *how the label serves science*. That’s the win.  
  - Whiteboard acts as a real-time concept map, making abstract tensions visual.  

  **50-Minute Proof:** Timed segments prevent overrun. Debate happens *within* structured framing, not chaotically. You end not with consensus, but with sharper questions—exactly where a seminar should land.
