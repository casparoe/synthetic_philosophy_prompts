prompt: |-
  I'm in a political theory reading group and we keep circling the same question without getting anywhere: when someone on the other side of a nasty partisan argument says something that sounds like good faith, what are they actually doing? I've been reading a lot about costly signaling and the handicap principle from biology, and I've got a half-baked idea I want you to help me test. The idea is that a move only counts as a credible signal of good faith if it burns a bridge behind you -- if it raises the cost of defecting later, and the cost is paid in a currency the other side can actually see and verify. Conceding a point your own coalition will punish you for. Saying in advance what evidence would change your mind, in terms your opponents can check. Let's call this the burned-bridge thesis.

  Here's the claim I want your credence on, stated as precisely as I can: In typical cross-partisan political arguments -- not formal debate, not a courtroom, just ordinary online or dinner-table arguing -- the disposition we call arguing in good faith is more accurately modeled as a costly handicap signal of non-predation than as either (a) a simple report of sincere belief or (b) a cooperative intention to seek truth together. Assume we can't read minds and only observable moves count. Give me a number between 0 and 1 for that claim, but more importantly give me the decomposition: the sub-questions it hinges on, a rough probability for each, one line of justification per term, and how they combine into the final number.

  I'd expect the decomposition to include things like whether the handicap principle even transfers from biological signaling to discursive norms, whether ordinary political argument has the right payoff structure for signaling at all, whether the moves we call good faith are actually costly to fake and verifiable by the other side, whether alternative explanations (sincere belief, cheap talk, reputational bonding, plain Bayesian updating) explain the same behavior better, and whether good faith is even a natural kind or just a family-resemblance term. But add or drop terms as you see fit. Then tell me which sub-question the final number is most sensitive to, and what would move it most -- a formal model, a study, a thought experiment, or a real exchange where someone did the burned-bridge thing and it either worked or backfired. I'm not looking for a survey of the literature, just your actual reasoning with the weak points marked.
reasoning: |-
  Okay, the user is part of a political theory reading group struggling with a persistent question: how to interpret apparent good faith arguments from opponents in partisan conflicts. They've developed the "burned-bridge thesis" inspired by biological signaling theory, specifically costly signaling and the handicap principle. The core idea is that genuine good faith requires actions that raise the cost of future defection in ways visible to the opponent.

  The user wants my credence (0-1 probability) on whether good faith in ordinary political arguments is better modeled as a costly handicap signal rather than either sincere belief reporting or cooperative truth-seeking. More importantly, they want a decomposed analysis showing the sub-questions this hinges on, with probabilities and justifications for each component.

  Key angles to cover:
  - Transferability of handicap principle from biology to discourse
  - Payoff structure of political arguments for signaling
  - Cost and verifiability of "good faith" moves
  - Alternative explanations (sincere belief, cheap talk etc.)
  - Whether "good faith" is a coherent concept

  I'll structure this as a multiplicative probability chain since all components must hold for the thesis to dominate. The user clearly values rigorous deconstruction over literature surveys, so I'll focus on logical weak points and what evidence could shift the probabilities.

  The dinner-table/online context matters - this isn't formal debate but messy real-world arguing where reputational stakes differ from biological survival stakes. I should flag where the analogy might leak. Also worth noting that "cost" in discourse is often social rather than material, making verification harder.

  Biggest sensitivity will likely be around whether apparent good faith moves are truly costly to fake - many partisan concessions are actually low-risk virtue signaling within one's own tribe. A real case study where bridge-burning backfired would be strongest evidence here.
answer: |-
  Based on your "burned-bridge thesis" and the constraints (ordinary political arguments, observable moves only, modeling good faith as a costly handicap signal of non-predation vs. sincere belief reporting or cooperative truth-seeking), here's my decomposed credence and reasoning:

  **Final Credence on the Claim: 0.65**  
  *(I find the burned-bridge thesis more plausible than the alternatives, but significant weaknesses remain)*

  **Decomposition: Key Sub-Questions & Probabilities**  
  *(Probabilities represent P(Sub-claim | Evidence & Logic), combining multiplicatively toward the final credence)*

  1.  **Does the handicap principle transfer to discursive norms?**  
      *P = 0.85*  
      Justification: Signaling theory robustly applies to human communication (e.g., Zahavi, Gambetta), including costly signals like apologies or vows. Discursive norms *can* function as signaling games.

  2.  **Does ordinary political argument have a predation/cooperation payoff structure?**  
      *P = 0.90*  
      Justification: Partisan arguments often involve zero-sum status competition ("owning the libs/cons") and coalitional loyalty enforcement (punishing defectors). Predation (e.g., reputation-harming, coalition-splitting) is a credible threat.

  3.  **Are observable "good faith" moves costly to fake?**  
      *P = 0.60*  
      Justification: *This is the weakest link.* Conceding points *can* incur intra-coalition costs (backlash), but often doesn't (e.g., "controlled opposition," virtue signaling). Pre-committing to evidence is cheap unless specific/verifiable (rare). Many "good faith" signals are low-cost or ambiguously costly.

  4.  **Are "burned bridge" costs verifiable by the opponent?**  
      *P = 0.70*  
      Justification: Public concessions leading to intra-group criticism (e.g., social media pile-on) *are* observable. Specific pre-commitments *can* be checked later. However, hidden coordination ("this is a trap") or ambiguous interpretations undermine verifiability.

  5.  **Do alternative explanations fail?**  
      *P = 0.85*  
      Justification:  
      - *Sincere belief (P(reject)): 0.80* – Observable "good faith" often contradicts private incentives; sincerity is unverifiable and doesn't explain strategic concessions.  
      - *Cheap talk (P(reject)): 0.90* – If signals were costless, they'd be ubiquitous and ignored. Their rarity/scarcity suggests cost matters.  
      - *Reputational bonding (P(reject as primary)): 0.70* – Reputation matters, but the "burned bridge" *is* a reputational bond. Thesis subsumes this.  
      - *Bayesian updating (P(reject as primary)): 0.75* – Updating explains belief change, not why *specific costly signals* are credible trust-builders.

  6.  **Is "good faith" a natural kind coherent under signaling?**  
      *P = 0.75*  
      Justification: While fuzzy, behaviors like concession/pre-commitment cluster as "trust-inducing moves." Signaling theory provides a parsimonious framework for their credibility, unlike vague "sincerity."

  **How Probabilities Combine:**  
  The final credence is the product of the sub-probabilities:  
  **0.85** (transfer) × **0.90** (payoff) × **0.60** (costly) × **0.70** (verifiable) × **0.85** (alternatives fail) × **0.75** (coherence) ≈ **0.65**  
  *(This is multiplicative as all conditions must hold for the thesis to dominate; weaknesses compound)*

  **Biggest Sensitivity: Cost-to-Fake (Sub-Question 3, P=0.60)**  
  This is the most volatile sub-probability. It drops the final credence significantly and is highly context-dependent. Here's why:

  -   **What would move it:** **Empirical case studies** of burned-bridge moves backfiring or succeeding. For example:
      -   *Evidence raising P(costly):* A study showing politicians/activists who made verifiable concessions/pre-commitments suffered measurable intra-group penalties (loss of donations, primary challenges) *and* gained cross-partisan trust.
      -   *Evidence lowering P(costly):* Analysis revealing "concessions" are often theatrically low-stakes ("I agree taxes are complex... but your side wants communism!") or even rewarded within coalitions ("look how reasonably I sound!").

  -   **Why not other evidence?**  
      -   Formal models already support signaling logic (raises P(transfer) but it's already high).  
      -   Surveys struggle with sincerity (unobservable).  
      -   Thought experiments can't resolve ambiguity in real-world cost structures.

  **Key Weaknesses & Implications:**  
  1.  **Cost Ambiguity:** In online/dinner-table settings, "burning bridges" is rarely irreversible. Social costs are often low, recoverable, or manipulable. A tribal figure conceding a point may *strengthen* their standing ("reasonable leader") or be ignored ("fake news").  
  2.  **Verification Limits:** Opponents often distrust *any* signal ("they're setting a trap"). Costs paid in intra-coalition currency (e.g., losing extremist support) may be invisible or irrelevant to the other side.  
  3.  **Overlap with Alternatives:** Sometimes sincere belief *drives* costly signals (e.g., a principled conservative defending a liberal policy they genuinely support). Signaling explains *credibility*, not *motivation*.  

  **Conclusion:** Your thesis is a powerful lens (credence 0.65), especially for high-stakes or public acts. But in *ordinary* arguments, the low/ambiguous costs of most "good faith" moves make them poor handicaps. The strongest evidence would be documenting cases where bridge-burning had clear, verifiable costs *and* built trust across divides. Until then, skepticism about observable "good faith" is warranted – much of it is either low-cost positioning or sincere but strategically inert.
