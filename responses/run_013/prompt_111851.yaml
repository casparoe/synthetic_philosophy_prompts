prompt: |-
  So I got into a long, slightly heated arguement with my friend Ravi last night — he's a math PhD student who spent the last week reading about constructive math and is now insufferable about it — and I need help working out who's right, because I'm fairly sure he's wrong in a way I can't articulate.

  His case, as best I can reconstruct it: intuitionists reject proof by contradiction, so they can't prove things like the irrationality of √2, and constructive analysis is basically classical analysis with the good theorems taken out. More broadly, he says intuitionistic logic is just classical logic minus the law of excluded middle, so every intuitionistic theorem is also a classical theorem — intuitionists are simply proving fewer things than everyone else, a self-imposed handicap. He also says intuitionists hold that some statements are neither true nor false, which sounds to me like a third truth value, and that seems like an awful lot of metaphysics to bolt onto a logic.

  I did one intro logic course and vaguely remember double negation being the sticking point, but I couldn't defend myself. So here's my actual question: if constructive math is just classical math with a hole where excluded middle used to be, why would anyone work in it — how do you even prove something like the irrationality of √2 if you're not allowed to suppose the opposite and derive a contradiction? And where's the line he's blurring?

  Take the role of a philosopher of mathematics who works on constructive and intuitionistic mathematics, and start by brainstorming the distinctions you think are doing the real work here before you answer. Then I'd like: (a) whether rejecting proof by contradiction is really what intuitionists do, and if not, precisely which inference gets rejected — with a concrete example, and yes, he did bring up Euclid's proof of the infinitude of primes; (b) whether classical logic minus LEM is a fair description of intuitionistic logic, and if not, what the correct relationship is, ideally with a classically valid formula that fails intuitionistically for reasons having nothing to do with excluded middle; (c) whether the neither true nor false reading is right; and (d) a clean way to say what intuitionism is for, so I can explain why it isn't just a handicap. He will definately fact check me, so be precise about the logic — but don't assume I know proof theory.
