  Okay, the user is part of a commission reviewing appellate court opinions and is grappling with a fundamental tension in how opinions are written. They're pointing out that when a three-judge panel decides cases issue-by-issue, the resulting "opinion of the court" can reflect a position that no single judge actually holds. This creates a disconnect between the collective output and individual judicial reasoning.

  The user seems deeply troubled by the philosophical implications of this practice. They're questioning what model of judicial decision-making this system presupposes - is the court being treated as a single rational agent? Or just a vote-tallying machine? And they're wondering about consistency and precedent in this hybrid system.

  I notice they're using quite sophisticated language about presuppositions and rival pictures, suggesting they have a strong background in legal theory or philosophy. Their frustration comes through in phrases like "the bit that bugs me" and "trivially easy to build a case" - they've clearly thought about this extensively.

  The core tension they've identified is between two models:
  1) The court as a unitary rational agent that should maintain consistent beliefs
  2) The court as an aggregate of individuals where outcomes emerge from voting rules

  What makes this particularly thorny is how it affects precedent. When future courts look at such opinions, they have to extract "the holding" from what might be inconsistent reasoning across different majority combinations. The user mentions the "clerkly art" of finding the narrowest majority agreement - highlighting how artificial this process can be.

  They also contrast this with systems where judges write separate opinions, which they imply might be more intellectually honest. But they want to understand why the unified opinion persists and what it says about our conception of courts.

  The user's questions reveal deeper concerns about:
  - Whether legal reasoning requires consistency from individual judges or just majority outcomes
  - How precedent functions when no single rationale commands majority support
  - Whether courts should present themselves as coherent entities

  I should address both the practical legal consequences and the philosophical underpinnings. The user seems to want both concrete alternatives (like changing opinion-writing practices) and theoretical clarity about what models of group rationality are at play.

  The historical context matters here too - the unified opinion tradition comes from English common law where courts spoke with "one voice," but modern complex litigation with multiple issues exposes the cracks in this model. Maybe that's worth mentioning.

  For their commission work, they'll probably need to consider: Is the issue primarily about transparency? About precedent stability? Or about philosophical coherence? Different fixes would address different aspects. The user seems to suspect all three are interconnected.
answer: |-
  You've pinpointed a profound tension at the heart of appellate decision-making – the friction between the *aggregate nature* of judicial voting and the *unified presentation* of a court's "opinion." This practice isn't accidental; it presupposes specific things about courts, rationality, and the nature of law, while ruling out others. Let's break down your excellent questions:

  **What the Practice Presupposes:**

  1.  **The Court as an *Institutional Agent*, Not Necessarily a *Unitary Rational Mind*:** The practice strongly presupposes that the *court as an institution* is the relevant decision-making entity for the parties and for the legal system. The binding outcome is the institution's pronouncement ("the judgment of the court"), and the "opinion of the court" is its official justification. It does *not* necessarily presuppose that this institutional agent possesses a single, coherent, consistent set of beliefs or reasoning in the way an individual rational agent would. It allows for the possibility that the institution's "position" is an emergent property of the voting rules, constructed *post hoc* to justify the outcome mandated by those votes.

  2.  **The Primacy of Outcome over Coherent Rationale:** It presupposes that the *binding legal effect* (the disposition: affirm, reverse, remand) is paramount and separable from the specific reasoning paths taken by individual judges. The doctrine of *res judicata* and the binding force of the judgment stem directly from the votes on the outcome-determinative issues, not from the coherence of the opinion's narrative.

  3.  **Law as a System of Rules Producing Authoritative Outcomes:** It presupposes that law functions, at least in part, as a system where authoritative decisions are reached according to established procedural rules (majority vote per issue), and that the *authoritativeness* of the pronouncement (the judgment + the official opinion justifying it) is crucial for stability and predictability, even if the underlying reasoning is fragmented. The "opinion of the court" serves to clothe the outcome in the legitimacy of reasoned justification, as required by the rule of law.

  4.  **Reasons as Necessary Legitimation, Not Personal Conviction:** It presupposes that litigants and the public are *owed reasons* by the *institution*, not necessarily that every proposition in the opinion reflects the personal conviction of a majority of judges on every point. The opinion is the institution's account of *why* the outcome is legally correct, constructed to meet the formal requirement of reasoned decision-making.

  **What It Rules Out:**

  1.  **The Court as a Genuine Unitary Rational Agent:** It explicitly rules out the picture of the court as a single mind arriving at a logically consistent set of beliefs through deliberation. The "opinion" is a *representation* of such an agent, not proof that one exists. The practice acknowledges (implicitly) that the institutional "mind" can be fragmented or even contain logical tensions ("valid but breached, held by only one judge").

  2.  **Strict Consistency as a Requirement for Institutional Action:** It rules out the idea that an institution *must* act only when its members share a consistent, unified rationale. The voting rules allow the institution to act decisively even when internal coherence is lacking, prioritizing finality and dispute resolution over perfect logical harmony at the reasoning level.

  3.  **Individual Judicial Reasoning as the Sole Source of Authority:** It downplays the authority of any single judge's complete rationale. While concurrences and dissents exist, the *binding* precedent and the *official* justification is the constructed "opinion of the court," even if it's a patchwork. It rules out systems where *only* the shared reasoning of a majority on *all* points carries weight (a much stricter requirement).

  **The Tension and Underdetermination:**

  *   **The Core Tension:** The practice *is* internally inconsistent if judged by the standards of individual rationality: It demands a document presenting a single, consistent chain of reasoning ("the court believes X because Y, and therefore Z") while simultaneously relying on a decision procedure (issue-by-issue majority) that guarantees this document *cannot* represent the genuine, consistent beliefs of any single rational agent or even a stable majority coalition across all issues. The "press release" analogy is apt – it's the official story, not the messy backroom negotiations.
  *   **Underdetermination:** The practice *is* underdetermined regarding:
      *   **The Nature of Group Rationality:** Does it reflect a pragmatic acceptance that institutional rationality differs from individual rationality (focused on outcomes and stability)? Or a belief that the "opinion" construction process *creates* a sufficient simulacrum of group reason? Or simply that coherence is less important than finality and the appearance of legitimacy?
      *   **The Weight of Precedent:** Does precedent lie *only* in the narrowest grounds agreed by five votes (*Marks* doctrine in the US SCOTUS)? Or in the reasoning of the "opinion of the court" even if fragmented? The practice allows both interpretations to coexist somewhat uneasily.
      *   **The Purpose of Reasons:** Are reasons primarily for the losing party (to understand why they lost), for lower courts (to guide future application), for the public (legitimacy), or for the development of the law (doctrinal coherence)? The practice serves all these purposes imperfectly due to the underlying fragmentation.

  **If You Took the "Three People + Tally" View Seriously:**

  Taking the view that the court is merely three individuals whose votes are tallied, with no institutional "mind," would necessitate significant changes:

  1.  **Opinion Writing:** The "opinion of the court" as a single, coherent narrative *would disappear*. The output would be:
      *   The Judgment (based purely on the issue-by-issue votes).
      *   Separate Opinions: Each judge would write their own concurrence or dissent, explaining their votes on *each issue* and their overall reasoning. There would be no attempt to synthesize or present a unified front. The "official" record would be the judgment and the collection of individual opinions.

  2.  **Doctrine of Precedent:**
      *   **Binding Precedent:** Would become radically narrower. Precedent would likely be confined *only* to the specific outcomes on specific issues where a clear majority rationale existed and was necessary to the judgment. Figuring out the "holding" would be even more complex, focusing on identifying propositions that were both (a) necessary to the outcome of an issue and (b) explicitly endorsed by a majority of judges *on that specific point*.
      *   **Persuasive Precedent:** Individual opinions would carry significant persuasive weight based on the reasoning and reputation of the judge, but no single rationale would be enshrined as "the court's reason."

  3.  **Requirement of Reasons:**
      *   **Survives, but Shifts Focus:** The requirement that judges give reasons for their votes would remain crucial. However, the *institution* would no longer be seen as owing a single, coherent set of reasons. The obligation would be on each *judge* to justify their *own* votes to the parties, the public, and other courts. The "reasons" would be transparently individual and potentially conflicting.

  **What Might Be Separable:**

  *   **Finality of Judgment:** The binding outcome based on issue-by-issue majority voting is separable and could remain unchanged. The core function of resolving the dispute would be preserved.
  *   **Requirement for Individual Judges to Reason:** The duty of each judge to articulate their reasoning for their votes could remain strong, perhaps even strengthened.
  *   **Goal of Guidance for Lower Courts/Practitioners:** This could still be met, though through synthesizing patterns from individual opinions and judgments rather than relying on a single "court" pronouncement. It might be more complex but potentially more transparent about underlying disagreements.
  *   **Legitimacy Function:** Legitimacy might shift from deriving from the authority of a unified "court" to deriving from the transparency of the process and the quality of individual judicial reasoning. Some might argue this is more honest.

  **Conclusion:**

  The practice of issuing a single "opinion of the court" alongside issue-by-issue majority voting presupposes the court functions primarily as an *institutional agent* whose key outputs are authoritative judgments and legitimizing justifications, even if those justifications are synthetic constructions. It consciously sacrifices the ideal of the court as a unitary rational agent for the benefits of decisiveness, institutional legitimacy, and a (sometimes illusory) sense of coherence in the law. It rules out strict models of group rationality demanding internal consistency.

  If one fully embraced the "three people + tally" view, the most significant changes would be the abolition of the unified opinion in favor of individual statements and a radical narrowing of binding precedent. However, the core mechanics of voting and judgment, and the requirement for individual judicial reasoning, could persist. The trade-off would be increased transparency about judicial disagreement at the cost of a clear, unified institutional voice guiding the legal system. Your commission is grappling with a fundamental question: Is the constructed coherence of the "opinion of the court" a necessary fiction for the law's stability and authority, or is it a misleading artifact that obscures the true, fragmented nature of judicial decision-making? There are strong arguments on both sides.
