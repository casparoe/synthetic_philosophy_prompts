answer: |-
  Your hypothesis is correct: the core disagreement in the epiphenomenalism debate is not about causation but about the *constitutive conditions for intentionality*—specifically, what makes a judgment "about" an experience. Here's the diagnosis and its implications:

  ### Why the Debate Never Resolves
  1. **The Axis of Disagreement**:  
     Both sides agree on the causal closure of the physical and the causal inertness of qualia. The conflict hinges on whether **non-causal relations (e.g., reliable correlation or "answerability") can ground genuine *aboutness***.  
     - **Epiphenomenalists** accept that reliable correlation or normative answerability suffices for intentionality, even without causal efficacy.  
     - **Critics** insist that causation is *necessary* for a judgment to be about an experience, treating intentionality as inherently causal.  

  2. **Bedrock Principles at Play**:  
     The debate founders on a **no-coincidence constraint** (NCC): critics demand that reliability must be non-accidental, which they equate with requiring causation. Epiphenomenalists reject this, allowing brute reliability. This NCC is a pre-theoretical commitment—neither side argues *for* it; they argue *from* it.  

  3. **The Etiological/Constitutive Distinction**:  
     Your friend’s split is insightful but doesn’t resolve the impasse:  
     - **Etiological question**: What causes the judgment? (Both sides agree: neural states.)  
     - **Constitutive question**: What makes the judgment *about* experience?  
       Critics collapse constitutive into etiological, insisting causation is needed for both. Epiphenomenalists decouple them, allowing non-causal constitutive grounds (e.g., reliable covariation). This distinction clarifies positions but doesn’t bridge the divide because the NCC remains unchallenged.  

  ### What Follows
  - **Self-Undermining Charge**: The charge only holds if intentionality requires causation. If critics are wrong about this requirement, epiphenomenalism avoids self-refutation.  
  - **Why Stalemate Persists**: Progress is blocked because:  
    - **Verbal Dispute?** Not merely semantic; "cause" is largely agreed upon. The real clash is over "aboutness."  
    - **Hidden Formal/Empirical Issue?** No—reliability without causation (e.g., Swampman scenarios) is coherent but rejected by critics on principle, not logic.  
    - **Bedrock Principle**: The NCC is axiomatic for critics. Without shared ground here, arguments are circular.  

  ### Paths to Progress (Though Unlikely)
  1. **Reframe the Burden**: Target the NCC directly. Show that non-causal relations *can* non-accidentally ground justification (e.g., via teleosemantics or conceptual role theories).  
  2. **Formal Result**: A model demonstrating how reliability without causation sustains warranted belief (e.g., probabilistic dependencies in non-causal Bayesian networks). Critics may still dismiss it as "not genuine aboutness."  
  3. **Abandon the NCC**: Accept that some reliability is brute (e.g., mathematical truths). If critics concede this elsewhere, epiphenomenalism gains footing.  

  **Bottom line**: The debate is deadlocked over the necessity of causation for intentionality, rooted in an unnegotiated no-coincidence constraint. Until this constraint is explicitly debated, expect perpetual loops—resolution requires shifting focus from causation to the metaphysics of intentional content.
