  Now, assessing their hypothesis. Is the disagreement really about what makes a judgment *about* something? Let's see. Both sides agree on physical causation but disagree on whether reliable correlation or answerability suffices for aboutness. Critics require causation for aboutness, while epiphenomenalists don't. That seems to align with their hypothesis. 

  But is that the whole story? The bedrock principle here might be the no-coincidence constraint. Critics insist that reliability must be non-accidental, which requires causal connection. Epiphenomenalists reject this, allowing brute reliability. This principle is fundamental and not resolvable through argument; it's a pre-theoretical commitment. 

  The friend's etiological/constitutive split: etiological is about what caused the judgment (neural states), constitutive is what makes it about experience (reliability or answerability). The critic conflates these, demanding causation for both. But separating them might show that constitutive aboutness doesn't require causation. However, the critic would still insist that without causation, the constitutive link is accidental, thus not genuine. So it might be a redescription that doesn't resolve the core clash.

  What would count as progress? A formal result showing reliable correlation sans causation can support justification, but that's unlikely to persuade critics who dismiss brute reliability. Distinguishing types of aboutness (causal vs. non-causal) might help, but critics would still demand causation for intentionality. The honest answer is that without shared bedrock principles, progress is unlikely. The debate hinges on incompatible starting points about intentionality and justification.

