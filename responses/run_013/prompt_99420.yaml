  For policy-driven cases, ask about intent: if deaths were deliberate, it aligns with genocide or atrocity readings; if negligent, it might fit de Waal's famine crimes. Next, question whether natural triggers excuse the famine—if irrelevant, it supports arguments like Davis's. Finally, assess state capacity: if the state could have prevented it, it strengthens the crime framing.

