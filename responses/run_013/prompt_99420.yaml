answer: |-
  Here’s a concise decision tree (fits one page) for categorizing famine interpretations. Test cases: **Bengal 1943 (B)**, **Ireland 1845–49 (I)**, **Great Leap Forward 1958–62 (GLF)**.  

  ---

  ### FAMINE ANALYSIS DECISION TREE  
  **Start → Q1: Was there *sufficient food available* in the affected region to prevent mass starvation?**  
  - **YES** → **Entitlement Failure (Sen)**. *Proceed to Q2*.  
  - **NO** → **Food Availability Decline (Malthusian)**.  
    - *Test cases*: I (potato blight reduced food); B/GLF contested (some argue shortages were overstated).  

  **Q2 (Entitlement Failure): Was the failure primarily driven by...**  
  - **MARKETS** (prices, trade, hoarding) → **Market Entitlement Collapse**.  
    - *Test cases*: B (war inflation priced out poor); I (debated: exports continued amid shortage).  
  - **POLICY/LAW** (state actions, repression, neglect) → **Policy-Driven Entitlement Failure**. *Proceed to Q3*.  
    - *Test cases*: GLF (collectivization destroyed incentives); B (colonial export policies); I (British relief limits).  

  **Q3 (Policy-Driven): Did authorities *foresee mass deaths* but fail to act?**  
  - **NO** (genuine ignorance/capacity limits) → **Incompetence/State Failure**.  
  - **YES** → **Negligence or Intent**. *Proceed to Q4*.  

  **Q4 (Negligence/Intent): Was the failure due to...**  
  - **NEGLIGENCE** (indifference, prioritization elsewhere) → **Famine Crime (de Waal)**.  
    - *Core view*: Callous disregard creates criminal responsibility, even without intent.  
    - *Test cases*: B (Churchill’s diversion of resources); I (laissez-faire ideology).  
  - **INTENT** (deaths as goal or acceptable cost) → **Atrocity/Deliberate Weaponization**. *Proceed to Q5*.  
    - *Test cases*: GLF (Mao’s policies as ideological purge?); modern sieges (e.g., Syria).  

  **Q5 (Intent): Was a *natural trigger* (drought, blight) present?**  
  - **YES, BUT IRRELEVANT** (state could override it) → **Structural Violence (Davis)**.  
    - *Core view*: Capitalism/imperialism turns climate events into mass murder (e.g., El Niño famines).  
    - *Test cases*: I (blight + colonial extraction); GLF (weather + forced industrialization).  
  - **NO, OR MINIMAL** → **Genocide/Democide**.  
    - *Core view*: Intentional starvation as elimination (e.g., Holocaust, Holodomor parallels).  
    - *Test cases*: GLF (argued by critics like Yang Jisheng).  

  **Q6 (All Policy-Driven): Could a *competent state* have prevented deaths?**  
  - **NO** (genuine impossibility) → **Unnamed: Tragic Perfect Storm**.  
  - **YES** → Strengthens **Famine Crime/Structural Violence/Intentionalist** positions.  
    - *Key for*: B (UK could have diverted ships); GLF (China reversed policies post-famine).  

  ---

  ### LEAF POSITIONS & TEST-CASE VIEWS  
  | **Position**               | **Bengal 1943**       | **Ireland 1840s**       | **Great Leap Forward** |  
  |----------------------------|------------------------|-------------------------|------------------------|  
  | **Malthusian**             | Shortage (contested)   | Blight → shortage       | Not applicable         |  
  | **Market Collapse**        | Inflation priced out poor | Landlords/export markets | Not primary            |  
  | **State Failure**          | Inept colonial admin   | Weak relief effort      | Local mismanagement    |  
  | **Famine Crime (de Waal)** | Churchill’s negligence | British ideological neglect | Mao’s reckless policies |  
  | **Structural Violence (Davis)**| Imperial supply chains | Colonial grain exports  | Forced industrialization |  
  | **Genocide/Democide**      | Not applicable         | Not applicable          | Deliberate CCP policy  |  
  | **Starvation Weapon (IL)** | Blockade-like effects  | Not applicable          | Not applicable         |  

  ---

  ### FLAGGED OVERLAPS & GAPS  
  1. **Sen/de Waal boundary blur**: Both see famines as political failures, but de Waal demands *accountability* for negligence. Tree separates them at Q4 (negligence vs. non-culpable failure).  
  2. **Davis vs. Genocide**: Davis emphasizes *systemic* violence (no individual intent needed); Genocide requires intent. Tree splits at Q5 (natural trigger relevance) and Q4 (intent).  
  3. **Unattested combination**: "Policy-driven + no foreseeability + preventable." *Why?* If preventable, foreseeability is implied. Likely incoherent.  
  4. **Unattested**: "Intent + natural trigger as excuse." *Why?* Intent overrides natural justifications; politically unattractive to combine.  
  5. **Gray zone**: Ireland’s "market vs. policy" split (Q2). Historians still debate exports vs. British laissez-faire.  

  ---  
  **Key Philosophy in Nodes**:  
  - Q1: Sen’s *entitlement* vs. Malthus.  
  - Q4: Intent vs. *recklessness* (Rome Statute’s "disregard for life").  
  - Q5: Davis’ *political ecology* (nature weaponized by power).  
  - Q6: *Feasibility* as moral/political litmus (O’Neill’s "duties of justice").  

  Fits one page when printed. Use to map arguments, not identities!
