  I need to flag overlaps: for example, Sen and de Waal both see famines as preventable but differ on criminality. Unattested combinations: claiming a famine was policy-driven but not preventable might be incoherent, as it contradicts the role of state action.

  I should keep it concise to fit one page. Start with the decision tree visually, then add notes on test cases, overlaps, and gaps. Use clear, jargon-free language since the user wants it accessible for their group.

