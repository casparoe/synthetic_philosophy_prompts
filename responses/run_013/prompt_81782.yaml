  Hmm, the user is stuck in a year-long debate about whether Buddhist ethics is consequentialist. They've described two sides: one pointing to outcome-focused texts and precept-breaking stories (like the ship captain), the other emphasizing character development and karmic consequences for the agent. The user suspects a "level confusion" between conventional and ultimate truth in Buddhism, while their friend thinks it's about arithmetic problems with infinite beings.

  I need to diagnose why this debate is stalled and provide five numbered points without fluff. The user wants exact commitments and practical solutions, not just summaries.

  First, the core issue is a category error. Consequentialism typically deals with maximizing welfare in a world of discrete individuals, but Buddhist no-self doctrine undermines that foundation. The two sides are operating on different metaphysical levels, making their arguments incommensurable.

  Second, both sides are selectively interpreting texts. The consequentialist side focuses on situational exceptions in sutras, while the virtue-focused side leans on training manuals. Each ignores evidence that challenges their view, creating a data stalemate.

  Third, the karmic math problem is real but secondary. Infinite beings make aggregate welfare calculation impossible, which should trouble consequentialist readings more than virtue readings. But this isn't the main blocker - it's the metaphysical disconnect.

  Fourth, their commitments differ deeply. The consequentialist side is wedded to action-guidance through outcome optimization, while the virtue side prioritizes agent-transformation. Neither can budge because their goals for ethics are fundamentally different.

  Fifth, progress requires reframing. They should stop asking "is it consequentialism" and instead map when each ethical mode applies. Defining shared test cases or formalizing the infinity problem could help, but acceptance of pluralism might be the realistic endpoint.

  The user wants sharp analysis, so I'll avoid padding and deliver five dense, actionable points as requested.
answer: |-
  Here are five numbered points diagnosing the stall:

  1.  **Fundamental Category Error:** The core stall is a level confusion, as you suspect. Conventional-level teachings *describe* karmic cause-and-effect using person-like agents and outcomes, creating a consequentialist *appearance*. Ultimate reality (no-self, emptiness) dissolves the fixed agents and discrete welfare states required by standard consequentialism, making direct comparison impossible.

  2.  **Irreconcilable Textual Foci:** Each side prioritizes different textual evidence as definitional. The "consequentialist" side focuses on dramatic, outcome-justified precept violations in specific sutras, treating them as core principles. The "virtue" side focuses on foundational training (precepts, meditation, wisdom) and karmic cultivation, treating precept violations as rare exceptions proving the rule of character development.

  3.  **The Karmic Arithmetic Problem is Real but Secondary:** Your friend's point about infinite beings rendering aggregate welfare undefined is logically sound and undermines *classical utilitarianism* as an interpretation. However, it doesn't resolve the core stall because the virtue side isn't proposing a different arithmetic; they reject the very framework of aggregating welfare across distinct individuals as primary.

  4.  **Deep Commitments:** The "consequentialist" side is committed to action-guidance where outcomes (karmic or welfare) ultimately justify the means within the conventional framework. The "virtue" side is committed to ethics as transformative practice aimed at eradicating afflictions (greed, hatred, delusion) and realizing wisdom, viewing actions primarily as expressions of inner states with karmic *consequences for the actor*.

  5.  **Progress Requires Reframing, Not Resolution:** Attempting to definitively label it "consequentialism" or not is futile. Progress means agreeing it exhibits *consequentialist-like reasoning at the conventional level* for pragmatic guidance, but is *ultimately grounded in a non-consequentialist ontology and soteriological goal* (ending suffering via wisdom/awakening, not maximizing a separable good). Shift focus to *when* and *how* each mode of reasoning functions within the Buddhist path.
