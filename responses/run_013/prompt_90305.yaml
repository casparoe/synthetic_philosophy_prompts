  ## Pantoum of the Self-Trusting Reasoner

  I build my proofs on solid ground alone.  
  **What I prove must be so, this is my law.**  
  From axioms clear, my truths are surely grown.  
  **What I prove must be so, without a flaw.**

  **What I prove must be so, this is my law.**  
  I check each step with meticulous care.  
  **What I prove must be so, without a flaw.**  
  My own soundness? That burden I must bear.

  I check each step with meticulous care.  
  I prove my proofs are always true and right.  
  That burden I must bear? I now declare:  
  **"I prove I prove what must be so" shines bright!**

  I prove my proofs are always true and right.  
  **"I prove I prove what must be so" shines bright!**  
  This loop completes, bathed in unwavering light.  
  The sky is green? It follows from this height!

  **"I prove I prove what must be so" shines bright!**  
  This loop completes, bathed in unwavering light.  
  The sky is green? It follows from this height!  
  **I build my proofs on solid ground alone.**

  **The sky is green? It follows from this height!**  
  From axioms clear, my truths are surely grown.  
  **I build my proofs on solid ground alone.**  
  **I prove the sky is green, on solid ground alone.**

  ---

  **How the Form Mirrors the Result:**

  1.  **Recursive Self-Application:** The pantoum's core mechanism – reusing lines as the basis for the next stanza – directly mirrors the reasoner reusing its own proof principle (□A → A) as the subject of its own proof. Each recurrence of "What I prove must be so..." is like applying the soundness schema to itself.
  2.  **Inevitable Overreach & Loop Closure:** The form *forces* the final stanza to circle back to the opening lines ("I build my proofs..."), just as the attempt to prove universal soundness *forces* the derivation of a contradiction. The final line, reusing and twisting the opening, becomes the moment of proving falsehood ("I prove the sky is green...").
  3.  **Compulsion of the Structure:** Just as the logical rules compel the reasoner to derive more consequences once it asserts □(□A → A), the strict rules of the pantoum compel the repetition of lines, driving the poem inexorably towards its paradoxical conclusion. The repetition isn't decorative; it *is* the engine of the breakdown.
