prompt: |-
  I'm trying to get clear on David Lewis's distiction between two ways of understanding penal substitution. One is the debtor model: sin is like a debt, and Christ pays it off. The other is the punishment model: Christ is literally punished in our place. Please compare these two. Which one actually fits the concept of punishment, given that punishment seems to have to be deserved by the person being punished? Does the debtor model just change the subject from punishment to compensation, or is it a legitimate version of penal substitution? And what does Lewis's point about debts being transferable while punishments aren't imply for whether we can really believe in the punishment model? I want a clear comparison, not just a summary. Say which version is more defensible and why.
