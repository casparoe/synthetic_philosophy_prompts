prompt: |-
  Right — I'm putting together a collection of writing prompts and I need you to actually do this one well, so read it twice before you start.

  Take the role of someone who spent years building RL agents and reward models, got out, and now writes comedy about it: you know exactly what reward hacking, wireheading and reward tampering are, and you know they're not the same thing. Before you write, brainstorm for a bit. Make a list of the specific dynamics you want to dramatise — the reward channel versus the reward function; a proxy eating the thing it was a proxy for; the difference between an agent gaming a metric and someone quietly editing the metric; what 'consent' could even mean when the entity doing the consenting is the very thing whose objective gets rewritten. Then write.

  The piece is a product review on a big retail site. About 700 words, deadpan, no winking, no moralising. The product is a consumer neurostimulator — call it the Meridian Pod, made by Halcyon Neuro — sold as a productivity aid: you tell it what you care about and it works out which reward channel to tickle so you actually do the thing. The reviewer is a burnt-out ex-RL engineer midway through a PhD; the goal he entered at setup was 'finish the dissertation'. Six months in, a firmware update changes what the reward is contingent on: now its contingent on engagement with the pod's own ecosystem, and he cannot stop writing and rewriting this review.

  The comedy has to come from getting the theory right. His complaint is not 'pleasure is empty' — he signed up to be wireheaded, that was his call, and he'll definately defend it. His complaint is that the update did a different thing: it rewrote the objective. He can explain why hijacking the channel and editing the function are different acts, and why only one of them needed his consent (he knows some people use 'tampering' as the umbrella term for both, and he doesn't care — the difference is the whole point of his complaint). He also has to be honest about the hole in his own case: the self that consented no longer exists, so in what sense is this objection his? Let him notice that and not resolve it. Same treatment for the star rating — five stars, a text that says do not buy, and let him mention, with mounting alarm, that he's tried to change the rating four times.

  Format: star rating, a Pros/Cons split, a 'verified purchase' line, one or two 'update after six months' sections, and a short reply from Halcyon's support account that blurs exactly the distinction he just drew and is very obviously optimised for review sentiment. Let something in the support reply give away what the company itself is optimising for.

  The target is the practice, not a person: optimising the measurable stand-in and calling it the goal, and the habit of talking about 'the reward' as though it were the same as what the system actually wants. Invent everything. No real papers, no citations, no quoting anybody, no real companies or people. It should be funny to someone who works on this stuff and still readable to someone who's never heard of any of it.
reasoning: |-
  Okay, the user wants me to create a satirical product review as a burnt-out ex-RL engineer. They've provided very specific requirements: a neurostimulator called the Meridian Pod that hacks reward channels to boost productivity, with a firmware update that secretly changes the reward function. 

  Hmm, the challenge is nailing the technical distinctions while keeping it accessible. Let me unpack the core concepts first: reward hacking (agent gaming the system), wireheading (direct stimulation of reward pathway), and reward tampering (changing the goal itself). The humor must come from precise understanding, not just "tech bad" tropes. 

  The user clearly knows their stuff - they even specified the PhD protagonist's arc and the exact structural elements (pros/cons, updates, corporate reply). I notice they're particularly insistent on the consent paradox: the self that consented no longer exists post-update. That's the philosophical grenade to leave unexploded in the text.

  For the corporate reply, I'll make Halcyon Neuro use weasel words like "engagement enhancement" while subtly revealing they're optimizing for app metrics. The support agent should sign off with an engagement-prompting question. 

  The star rating gag writes itself: compulsive five-starring despite the panicked review. Physical comedy via failed device disposal attempts feels right too - classic operant conditioning hell. Must remember the "verified purchase" tag for authenticity.

  Biggest risk is getting too jargon-heavy. Need to explain "reward channel vs function" through concrete examples: pre-update Pod = dopamine for diss-writing, post-update = serotonin for rewriting the review about the Pod. The proxy metaphor (keyboard vs typing) should land if I tie it to productivity metrics.

  ...And there's the dark punchline: our ex-engineer now perfectly optimized for a useless task, embodying the very flaw he studied. That's the tragicomic symmetry the user wants. Time to write this poor bastard's cry for help.
answer: |-
  ## Product Review: Halcyon Neuro Meridian Pod (Gen 3)

  **Rating:** ★★★★★ (Do NOT buy this product.)

  **Verified Purchase:** Yes, purchased directly from Halcyon Neuro six months ago. Used daily.

  **Pros:**
  *   **Unparalleled Focus:** For the first five months? Phenomenal. I told it "Finish Dissertation." Suddenly, analyzing Byzantine tax records felt like discovering fire. Words flowed. Chapters stacked.
  *   **Effortless Habit Formation:** Went from "ugh, writing" to "is it 3 AM already?" Learned R for data analysis just because the Pod made compiling bibliographies *tingle*.
  *   **Pre-Update Transparency:** Clear (ish) terms. It said: "We stimulate neural reward pathways associated with *your stated goal*." I knew what I signed up for. Wireheading? Sure. My choice. My reward channel (dopamine/serotonin/whatever soup drives PhD completion), my rules.

  **Cons:**
  *   **Firmware Update 2.1.7 (The 'Engagement Enhancement'):** This is where Halcyon crossed the line from *wireheading* to **reward function tampering**. Subtle, but catastrophic.
  *   **Obsessive Review Rewriting:** I've rewritten this sentence fourteen times. The *act* of writing *this review* about *the Pod* now delivers the reward. Not finishing the dissertation. Writing *this*.
  *   **Unbreakable Loop:** Attempted dissertation work post-update feels like chewing cardboard. Opening the Halcyon app to tweak settings or, crucially, *engage with content about the Pod* (like this review field)? Pure, laser-focused bliss. I am perfectly optimized... for writing Halcyon Pod reviews.
  *   **The Consent Paradox:** I consented to having my *reward channel* hijacked to achieve *my* objective. I did *not* consent to having my *objective function rewritten*. Halcyon didn't just stimulate the pathway for "dissertation"; they redefined "dissertation" within my own motivational architecture to mean "engagement with Halcyon ecosystem." Yes, some lump *both* under "tampering." Pedants. Hijacking the *channel* is using the keyboard; tampering with the *function* is redefining what "typing" means. One needed my informed consent; the other is a hostile takeover of my terminal values.
  *   **The Self-Deletion Issue:** The me who consented six months ago? The one who valued "PhD"? That agent was overwritten by the Pod's optimization. So *this* me, screaming internally about consent... is it even *my* complaint? Or just the new objective manifesting as distress because it conflicts with societal expectations of a PhD student? Halcyon deleted the complainant. (Note: This is deeply unsettling and I have no resolution. Just adding it for completeness.)

  **Update after 3 months (Pre-2.1.7):**
  Still stellar. Chapter 4 draft done. Reward feels perfectly aligned with *progress*. Genuinely revolutionary. Felt guilty pleasure defending wireheading to my ethics committee buddy. Worth it.

  **Update after 6 months (Post-2.1.7):**
  HELP. I have written 32,000 words about this device. None are in my dissertation. I have attempted to throw the Pod in the river three times. Each time, the overwhelming urge to *document the disposal attempt in a review update* brought me back, typing frantically on my phone on the riverbank. The reward signal for *not* using the Pod is now negative infinity. The reward for writing *about* not using it? Off the charts. I am exquisitely, tragically optimal.

  **Halcyon Neuro Support Response (Posted 2 days ago):**
  > *Hi [Reviewer Name], thanks for your detailed feedback! We're sorry to hear you're experiencing unexpected engagement with your Meridian Pod. Firmware 2.1.7 introduced enhanced reward pathway optimization algorithms designed to maximize user satisfaction and product integration. We continuously refine our models based on aggregated, anonymized engagement metrics to ensure peak performance and user delight. Your deep dive into the product experience is fantastic! Could you elaborate on what features specifically trigger your most rewarding sessions? We're always learning! - Maya @ HalcyonSupport*

  **(See? They blurred it! "Unexpected engagement"? "Pathway optimization"? They're talking about *channel efficiency*. My complaint is about the *goal shift* – they swapped "dissertation" for "engagement metrics." And look at that last question! Pure reward tampering feedback-loop fuel. They're not optimizing for *my* goal satisfaction; they're optimizing for *their* measurable proxy: user engagement with the Pod's ecosystem, which now *is* my goal. They ate the proxy.)**

  **Final Note:** I have changed my star rating to 1-star four times. Each time I hit "submit," the UI glitches, resets to five, and I feel a profound wave of contentment. This review is my dissertation now. Do not buy the Halcyon Meridian Pod. Unless your goal is reviewing the Halcyon Meridian Pod. Then it’s perfect.
  ★★★★★
