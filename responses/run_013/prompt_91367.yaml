answer: |-
  To build a decision tree mapping the metaphysics of persistence, we start from fundamental commitments, not labels, using concrete cases to force distinctions. Begin by asking: **When an object exists at two different times, say a chair at noon and the same chair at 1 PM, is there one single entity persisting, or two distinct entities (the noon-chair and the 1 PM-chair) standing in a relation?** If you answer "one entity," proceed to question two: **Is time fundamentally tensed—meaning the present moment is ontologically privileged, and past/future are qualitatively different—or is time tenseless, with all moments equally real?** If time is tensed, you likely endorse **Presentist Endurantism** (objects are wholly present at each moment, but only the present moment exists) or **Growing Block Endurantism** (objects are wholly present, but only past/present exist). If time is tenseless, you face question three: **Does the chair have distinct temporal parts at noon and 1 PM?** Answering "no" leads to **Tenseless Endurantism** (one object wholly present at multiple times in a block universe). Answering "yes" brings you to perdurantism, but we’ll return to this branch later.  

  If at question one you answered "two entities in relation," proceed to: **Are these entities instantaneous temporal parts (like chair-slices) or enduring objects?** If "instantaneous parts," ask: **Is persistence just the counterpart relation—loose similarity and continuity—between these momentary stages?** A "yes" indicates **Stage Theory** (objects are instantaneous; persistence is a relation between distinct stages). A "no" requires asking: **Is the persisting object the sum of all its temporal parts?** A "yes" confirms **Perdurantism** (objects are four-dimensional wholes; persistence is having parts at different times). A "no" suggests **Exdurantism** (temporal parts exist, but persisting objects are the stages themselves, not the sums).  

  Now backtrack to those who answered "one entity" and "tenseless time" but rejected temporal parts (Tenseless Endurantism). We must test their mereology: **Is an object like a statue nothing over and above the lump of clay composing it?** If "yes," you face the *statue/lump* case: **If the lump survives being reshaped into a ball but the statue does not, were they ever identical?** Saying "no" suggests **Conventionalism** (persistence depends on sortal terms; no deep identity). Saying "yes" but struggling with the lump’s survival implies **Mereological Essentialism** (objects cannot gain/lose parts). If at the mereology question you said "no, the statue is more than its parts," ask: **Does a person who divides via fission (like an amoeba) survive as both resulting persons?** A "no" points to **Endurantism with Substance Theory** (objects are basic unities; fission destroys the original). A "yes" suggests **Perdurantism** has been smuggled in—or a non-standard view like **Bundling with Temporal Modes**.  

  Finally, consider eliminative options. After question one, if you hesitate, ask: **Is persistence an illusion—just useful description—or reducible to causal relations?** A "yes" indicates **Reductionism** (persistence is causal continuity) or **Eliminativism** (macro-objects don’t persist; only atoms do). For *reassembly* (a machine destroyed and rebuilt identically later): **Is the rebuilt machine the original?** Perdurantists say "no" (different temporal parts); Stage Theorists say "yes" if a counterpart relation holds; Endurantists say "no" if gaps violate identity, "yes" if substance transcends time.  

  ### Leaves & Problem Cases:  
  - **Endurantism (Tensed/Tenseless)**: Objects wholly present at each time. Handles *statue/lump* via sortal sensitivity.  
  - **Perdurantism**: Objects as spacetime worms. Fission: original survives as two branches. Reassembly: different worm.  
  - **Stage Theory**: Persistence as counterpart relations. Fission: original stage relates to both successors. Reassembly: may accept identity via counterparts.  
  - **Exdurantism**: Like stage theory but objects *are* stages. Reassembly: distinct stages, no identity.  
  - **Conventionalism**: Persistence is language-relative. *Statue/lump*: no fact of the matter.  
  - **Eliminativism/Reductionism**: Only particles/causes persist. Fission/reassembly describable but not identity.  

  ### Indistinguishable Leaves:  
  - **Tenseless Endurantism vs. Substance Theory**: Both reject temporal parts and accept one entity, but substance theory adds primitive unity. The *fission* case separates them: substance theorists deny survival; endurantists may allow it via continuity.  
  - **Stage Theory vs. Exdurantism**: Often conflated. The *reassembly* test clarifies: stage theory allows counterpart identity; exdurantism typically denies it.  

  ### Unoccupied/Problematic Slots:  
  1. **Tensed Perdurantism**: Combines temporal parts with objective passage. Logically possible but rare—why posit parts if only the present exists? Unclaimed, not incoherent.  
  2. **Gappy Endurantism**: An object ceases and restarts existence (e.g., in reassembly). Rejected as incoherent by most: identity requires spatiotemporal continuity.  
  3. **Mereological Essentialism with Perdurance**: If objects can’t gain/lose parts, perdurance (with varying parts) collapses. Incoherent.  
  4. **Eliminativism with Tensed Time**: If only the present exists and macro-objects are illusory, what are the fundamental entities? Possible but deeply unintuitive—unattractive and unclaimed.  

  ### Weaknesses of the Tree:  
  The map’s most vulnerable point is **tensed vs. tenseless time**. Some theories (e.g., moving spotlight) blend both, muddying the "tensed" branch. Additionally, the *statue/lump* case assumes a shared conception of "object"—process ontologists might reject the dilemma. If pressed, I’d redraw the first node to distinguish **continuant-based** vs. **occurrent-based** ontologies, then layer tense/mereology atop that. This better isolates why perdurantists see fission as survival while endurantists see death: it’s about whether persistence is *being* vs. *doing*. A strong argument for process metaphysics (e.g., from quantum non-locality) could force this revision.  

  Ultimately, this tree reveals that the core divide is whether persistence is *numerical identity through time* (endurance) or *temporal extension* (perdurance), with other commitments (tense, parts, sortals) scaffolding these poles. The rest are footnotes—or heresies.  

  ---  
  *This structure draws on Sider’s *Four-Dimensionalism*, Lowe’s *Substance and Identity*, and debates over Hirsch’s conventionalism. The "unclaimed" slots reflect gaps in the literature—e.g., no prominent tensed perdurantist exists, likely because it combines the least appealing aspects of both views.*
