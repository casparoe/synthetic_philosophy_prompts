answer: |-
  ## Framing
  The core dispute concerns whether democratic backsliding is best understood through *procedural thresholds* (e.g., competitive authoritarianism), *institutional mechanics* (e.g., executive aggrandizement), *normative baselines* (your reversibility test), or *lived experience* (historians' view). This contestation is substantive, not merely political: it reflects divergent epistemological commitments about what constitutes democracy’s "essence" and how its erosion is legible. The lawyer’s critique that your test collapses into entrenchment highlights a key tension: is backsliding about *departure from a specific constitutional order* or *decline in democratic functionality*, regardless of formal continuity? The partisan-labeling concern (especially regarding the US) is similarly substantive—it questions whether the concept’s application reflects objective dynamics or ideological projection. This contestedness *is* the research problem: it reveals that backsliding lacks a unified theory of change. Your group’s task is not to resolve it prematurely but to map where disagreements stem from methodological divergence versus genuine conceptual incoherence.

  ---

  ## The Candidate Questions
  1. **Mechanism Fragility**: How do the pathways of backsliding (e.g., legalistic erosion vs. extra-constitutional rupture) vary in their susceptibility to reversal, and what actor constellations determine this? (Focuses on dynamics rather than definitions)  
  2. **Subnational Asymmetry**: Why do subnational units (regions, cities) resist or accelerate backsliding despite national trends, and how does this reshape center-periphery power? (Addresses historians’ "view from below" critique)  
  3. **Conceptual Contestation as Data**: When and why do experts dispute whether a case qualifies as backsliding (e.g., the US debate), and what does this reveal about the concept’s coherence or politicization? (Makes disagreement the object of study)  
  4. **Resource Reallocation**: How do backsliding regimes deliberately redirect state capacity (funding, personnel) to entrench illiberalism, particularly in "soft" domains like education or local governance? (Tracks tangible institutional shifts)  
  5. **Transnational Scripting**: To what extent do backsliding regimes emulate each other’s tactics across regions, and what role do shared legal/political vocabularies play? (Leverages your group’s regional diversity)  

  ---

  ## The Ranking
  *(Prioritized by: Upstreamness > Neglectedness > Tractability > Importance, with trade-offs noted)*  

  1. **Subnational Asymmetry**  
     - *Why #1?* Directly addresses historians’ criticism that state-centric models miss grassroots dynamics, while being empirically tractable through archival/local media analysis (exploiting historian/lawyer skills). It’s upstream because understanding *where* backsliding succeeds/fails locally informs theories of resistance. Neglectedness is high—most studies focus nationally. Trade-off: Importance is moderate (not all backsliding is federal), but tractability for your group is excellent.  

  2. **Resource Reallocation**  
     - *Why #2?* Bridges the lawyer’s institutional focus and political scientists’ demand for observable metrics by tracking budget shifts, staffing changes, or policy enforcement in education/local gov. Upstream as it reveals *how* reversibility costs rise (your test) via material entrenchment. Neglectedness is moderate (some work on "autocratic redistribution"), but tractability is high using public expenditure records and administrative decrees. Trade-off: Less upstream than subnational dynamics.  

  3. **Conceptual Contestation as Data**  
     - *Why #3?* Tackles the partisan-labeling debate head-on. Your philosopher-pol.sci mix can analyze expert discourses (e.g., US vs. Hungary debates in journals/media) to distinguish ideological from methodological disputes. Upstream because clarifying concept validity shapes measurement. Neglectedness is extreme—few study experts’ disagreements as data. Trade-off: Lower tractability (requires hermeneutic analysis), but vital for field legitimacy.  

  4. **Mechanism Fragility**  
     - *Why #4?* Integrates your reversibility test with polisci/law interests by comparing pathways (e.g., Turkey’s purges vs. Poland’s court-packing). Upstream for predicting recoverability. Neglectedness moderate (pathways are studied, but fragility less so). Trade-off: Requires deep case knowledge, risking regional-bias disputes.  

  5. **Transnational Scripting**  
     - *Why last?* Important for theory but relies on linguistic access your group lacks. Low tractability without original-language sources. Still, workshops could invite regional experts.  

  ---

  ## What Would Change the Ranking  
  - **Move Up:** If new scholarship emerges validating *subnational resistance* as a key predictor of reversal (e.g., a study showing Brazilian mayors blocking Bolsonaro’s policies altered national outcomes), prioritize #1. If major regimes (e.g., India) escalate resource weaponization (e.g., defunding opposition-run states), #2 gains urgency.  
  - **Move Down:** If a meta-analysis proves expert disagreement on cases (e.g., US) correlates strongly with partisanship, #3 becomes critical; if not, it drops. If Hungary/Poland diverge post-EU funds freeze, #4 (mechanism fragility) rises.  
  - **External Shift:** A sudden democratic collapse (e.g., Mexico 2024) would prioritize #5 (transnational scripting) if emulation is alleged.  

  ---

  ## Bottom Line  
  **Fund First:** *Subnational Asymmetry*—it’s actionable with your skills, bridges disciplinary rifts, and illuminates democratic resilience from below. Assign the postdoc to map 2–3 regions per country case (e.g., Hungarian counties, US states, Turkish municipalities) using budgets, election records, and local press.  
  **Refuse to Fund:** Adding *broad cross-national measurement projects*—your group lacks linguistic capacity and will replicate existing efforts. Focus instead on mechanisms visible within your regional foci.
