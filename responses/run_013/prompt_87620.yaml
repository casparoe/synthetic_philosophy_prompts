prompt: |-
  I run a biweekly reading group that's mostly people who came in through LessWrong and Slate Star Codex and then drifted into actual game-theory papers, so they're sharp, but they've all read the same ten blog posts about tit-for-tat and they think they already know exactly how the iterated prisoner's dilemma goes. I want to break that smugness. About 16 people, 90 minutes, church basement with a whiteboard, a stack of index cards, and a printer I can use for handouts. Here's the thing I want them to feel in their bones instead of nodding at: reciprocity is a fair-weather machine. It works beautifully when everyone sees every move perfectly, and it turns to garbage the moment there's noise — one misread move, one slip, and two copycats spiral into mutual defection even though neither of them ever intended to defect. And the second half, which is the part I actually care about: the obvious fix is forgiveness, but forgiveness is a subsidy you're paying to defectors, so there's a real tradeoff here and no free lunch. I want them to run into both halves themselves, in that order, before I say anything.

  So: design me a runnable in-class game for this session. You're a game designer who's also read the actual literature on cooperation under noise, not just the blog-post version — so I want the mechanics to be doing real work, not decoration. I'm imagining something like fixed pairs playing a known-length repeated PD where I secretly roll a die each round and flip a couple of moves before they're transmitted, so that a single accident poisons a copy-their-last-move pair; then a second phase where they get to rewrite their strategy cards and discover that the forgiveness rule they invent restores cooperation but also opens a door for an exploiter in the room. But don't just take my sketch — think it through carefully, and if a different structure gets them to the same two realizations more cleanly, use that. Include the rules, the payoff scheme (no real money), the noise mechanic, what I say and when, the repair phase, and a debrief that maps specific moments in the game onto the ideas: why copy-the-last-move is fragile under noise, what the forgiving and contrite variants buy you, why a win-stay/lose-shift-ish rule can beat it in a noisy world, and the frontier between correcting errors and rewarding exploiters. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the idea the activity can't reproduce and that I'll have to supply myself.

  Start with the bottom line — one sentence naming the game and what it makes people feel — then give me the full design. No preamble, no restating what I asked for. And brainstorm a couple of alternative noise mechanics before you commit to one, even if you only show me the winner.
reasoning: |-
  We are designing a classroom game to teach two key insights:
   1. Reciprocity (like Tit-for-Tat) is fragile under noise: a single misperceived move can lead to a spiral of mutual defection.
   2. Forgiveness (like Tit-for-Tat with forgiveness) can restore cooperation but opens the door to exploitation by defectors.

  Structure:
   - The game will be played in fixed pairs for a known number of rounds (say, 10 rounds).
   - We will have two phases: 
       Phase 1: Players use a simple strategy (like Tit-for-Tat) and experience the fragility under noise.
       Phase 2: Players design new strategies (with forgiveness) and then we introduce a "defector" (either a planted player or a strategy that exploits forgiveness) to show the trade-off.

  Mechanics:
   - We need a noise mechanic that occasionally flips an intended move (so that a C becomes D or vice versa) during transmission.
   - We want the players to initially use a strategy that is reciprocal (copy the opponent's last move) and then let them design a strategy that includes forgiveness.

  Alternative noise mechanics considered:
    1. **Dice roll per move**: For each move, there's a small probability (say 10%) that the move is flipped before being transmitted to the opponent. This is simple but might be too random and might not guarantee the spiral in every pair.
    2. **Controlled noise events**: The facilitator (you) secretly rolls a die and at a predetermined round (or rounds) flips the moves of some players. This ensures the noise event happens, but it might feel artificial.
    3. **Noise cards**: Each player is given a fixed number of "noise tokens" (say 2 tokens for the entire game) that they must use at random times (by rolling a die to pick the round). This is complicated and might not be necessary.

  We choose **Option 1** (dice roll per move) because it is natural and models the idea that every interaction has a chance of being misread. We set the noise level at 15% (which is high enough to cause problems but not overwhelming). 

  However, we must ensure that the noise does occur in a way that causes a spiral. Since we are running multiple pairs, in some pairs the noise will cause a mutual defection spiral. To make sure every pair experiences at least one noise event, we can run enough rounds (10 rounds) and with 15% per move, the chance of at least one flip in a pair over 10 rounds is high (about 80% per pair). But if we want to guarantee it, we can have a fixed noise event in round 3 for all pairs (without telling the players) and then the rest of the rounds with 15% chance. We'll do:

    - Rounds 1-2: No noise (so they start cooperating and see it works without noise).
    - Round 3: Force a noise event (flip both players' moves that round) to create an initial misstep.
    - Rounds 4-10: 15% independent chance per move per player to be flipped.

  But note: flipping both moves in round 3 might not be necessary. Alternatively, we can just have independent noise per move at 15% and let probability do its work. Since we have 16 players (8 pairs) and 10 rounds, with 15% per move, we can expect about 24 noise events in total (16 players * 10 rounds * 0.15 = 24). So it's very likely that every pair experiences at least one. We'll go with:

    - Independent noise: Each move (in every round) is flipped with 15% probability (independently) before being sent to the opponent.

  Payoff scheme (for a single round):
    - If both cooperate (C,C): both get 3 points.
    - If one cooperates and the other defects (C,D): cooperator gets 0, defector gets 5.
    - If both defect (D,D): both get 1 point.

  Total payoff for a player is the sum over 10 rounds.

  Materials:
    - Index cards (for strategy notes)
    - Whiteboard for keeping score (or not, because we are not using real money and we want to focus on the experience, not the exact scores)
    - Printer for handouts: rules, payoff matrix, and a strategy recording sheet.

  Game name: "The Noise Trap"

  Bottom line: "The Noise Trap" makes players feel the frustration of unintended mutual defection and the delicate balance between forgiveness and exploitation.

  Detailed Design:

  **Setup (10 minutes):**
    - Divide the 16 players into 8 fixed pairs. Have them sit with their partner.
    - Explain the rules of the Prisoner's Dilemma for one round (show the payoff matrix).
    - Explain that they will play 10 rounds with the same partner.
    - Each player will write their initial strategy on an index card. For Phase 1, they must use the strategy: "Start by cooperating, then do whatever your partner did in the previous round." (Tit-for-Tat). They write this on the card and cannot change it during Phase 1.
    - Explain the noise: "In the real world, communication is imperfect. So, after you choose your move, there's a 15% chance that the move your partner sees is flipped (C becomes D, D becomes C). This flip happens independently for each transmission. You will not be told if your move was flipped or not; you only see the move your partner apparently played."

  **Phase 1: The Fragility of Reciprocity (20 minutes)**
    - Players play 10 rounds. In each round:
          Step 1: Each player writes down their move (C or D) based on their strategy and the history they have observed. (For the first round, they start with C).
          Step 2: The facilitator (you) collects the moves. For each move, you roll a d100 (or a d20) and if the roll is <=15, you flip the move. Then you record the flipped move as the "observed move" for the opponent.
          Step 3: You hand back to each player a slip (or announce to each pair) what move their partner "played" (which may have been flipped). They record this and update their history.
          Step 4: They then write down their move for the next round (based on their Tit-for-Tat strategy and the observed history) and so on.
    - After 10 rounds, each pair calculates their total scores.

  **Debrief Phase 1 (5 minutes):**
    - Ask the players to raise their hands if they ended up in a long sequence of mutual defection. (Likely, many will.)
    - Ask: "How many of you intended to cooperate throughout, but ended up defecting?" 
    - Point out: "Even though both of you were playing Tit-for-Tat (a reciprocal strategy), a single flip could cause you to see a defection and then you would retaliate, leading to a spiral. This is the fragility under noise."

  **Phase 2: Designing Forgiveness (15 minutes)**
    - Now tell the players: "You have seen the problem. Now, redesign your strategy. You can change it to whatever you want, but you must write it down on a new index card. Your strategy must be a function of the history of observed moves (which may include errors). You have 5 minutes to design and write your strategy."
    - Encourage them to think about how to recover from an apparent defection (forgiveness). But do not give examples.

  **Phase 2: Play with New Strategies (20 minutes)**
    - Re-pair the players. (Important: to avoid pairs just repeating their previous game, and to introduce the possibility of an exploiter.) 
        - How to re-pair? Randomly assign new partners. But note: we want some players to try to exploit forgiveness. 
        - We can plant a defector? But we don't want to reveal that we planted. Instead, we can rely on the fact that some players might design an exploitative strategy. However, to ensure the point is made, we can have a confederate? But that might be unethical. Alternatively, we can hope that at least one player will design an always-defect and then we can use that in the debrief. But we cannot guarantee that. 
        - Alternative: We can have a "strategy swap". Have each pair swap one of their strategy cards with another pair. Then each player in a pair has one player from the original pair and one from the other. But that might be messy.

    - Instead: We will keep the same pairs? But then they know their partner. That might lead to continued cooperation. We want to show that forgiveness can be exploited by a new partner. So we must re-pair randomly.

    - We'll do random re-pairing. Then, we ask the players to play again for 10 rounds with the same noise (15% per move) and their new strategies.

    - But note: we want to show that a forgiving strategy works well with another cooperator but is exploited by a defector. So we need at least one defector in the room. How to ensure? We can have one of the players (secretly) be given a note to play "always defect" in Phase 2. But that might feel like a trick. Alternatively, we can let the players choose and then in the debrief, we can look for a pair where one player played a forgiving strategy and the other played an exploitative one.

    - Since we have 16 players, it's likely that at least one will choose "always defect" because they are smart and want to win. We'll rely on that. If no one does, then we can have a backup: we can ask one volunteer to change their strategy to "always defect" and then run an extra round of play with that one pair in front of the class? But that might break the flow.

    - We'll proceed without a plant. Then, after the game, we collect the strategies and the outcomes and in the debrief, we can highlight a pair where one was forgiving and the other was always defecting (if it occurs).

    - Steps:
          - Randomly assign new partners.
          - Each player uses their new strategy (written on the new index card) for 10 rounds, with the same noise (15% per move flip).

  **Final Debrief (20 minutes)**
    - Discuss the outcomes. 
        - Ask: "How many of you achieved stable cooperation in Phase 2?" 
        - Ask: "Did anyone design a strategy that was forgiving? How did it work?"
        - Ask: "Did anyone design a strategy that exploited forgiveness? How did it work?"

    - Map to the concepts:
        - Fragility of reciprocity: In Phase 1, even though everyone was playing TFT, noise caused breakdowns.
        - Forgiveness: Many might have added a rule like: "After a defection, I will cooperate again with some probability" or "After two defections in a row, I will cooperate". This helps recover from a single error. But if the opponent is always defecting, then you keep cooperating and getting 0, while they get 5.
        - Win-Stay-Lose-Shift (Pavlov): This strategy (if my payoff in the last round was 3 or 5, I repeat my move; if it was 0 or 1, I switch) is robust to noise because a single mistake (leading to a bad payoff) causes a switch and then a return to cooperation. But note: if the opponent is always defecting, then after a switch to cooperate, you get 0 and switch again, so you end up alternating. That gives the defector 5 in the rounds you cooperate and 1 in the rounds you defect, but you get 0 and 5 alternately? Actually, let's see:
            Round1: you C, they D -> you get 0, they get 5 -> you switch to D.
            Round2: you D, they D -> you get 1, they get 1 -> you switch (because you got 1, which is a low payoff) to C.
            Round3: you C, they D -> you get 0, they get 5 -> you switch to D.
            So you end up alternating and your average is (0+5)/2 = 2.5, while the defector gets (5+1)/2=3. So it's better than always cooperating (which would get 0) but not as good as mutual cooperation.

        - The trade-off: Forgiveness (or contrition) helps recover from errors but makes you vulnerable to exploitation.

    - What the activity can't do: It might not perfectly illustrate the optimal strategies for noisy environments (like Contrite Tit-for-Tat or Pavlov) because players might not design them. So you may have to explain these in the debrief. Also, the noise level we set (15%) is arbitrary, and in reality, the optimal strategy depends on the noise level and the length of the game.

  **Predictable Problems and Solutions:**

  1. **Problem**: In Phase 1, some pairs might not experience a noise event and thus have no breakdown. Then they don't see the problem.
     - **Solution**: We set the noise at 15% per move and 10 rounds. The chance of at least one flip in a pair in one round is about 27.75% (1 - (0.85*0.85)) and over 10 rounds, the chance of at least one flip in the pair is about 96%. So it's very likely. But if a pair doesn't have a breakdown, you can note that they were lucky and that in a longer game it would happen.

  2. **Problem**: In Phase 2, no one designs an always-defect strategy. Then we don't have the exploitation example.
     - **Solution**: In the debrief, you can still discuss the trade-off: "Suppose one of you had decided to always defect, then how would your strategy have fared?" And you can run a hypothetical. Alternatively, you can have a prepared example: take one forgiving strategy (from a player) and pair it with always-defect and run a quick simulation on the whiteboard.

  3. **Problem**: Players might not understand how to design a strategy for Phase 2.
     - **Solution**: Give examples of what a strategy might look like: "I will start with C. If my partner cooperated last round, I cooperate. If they defected, I cooperate with 90% probability and defect with 10%." But don't give this until after they've tried, because we want them to invent. Instead, in the instructions, say: "Your strategy must be a rule that tells you what to play in the first round and then what to play in each subsequent round based on the entire history of moves you have observed from your partner."

  4. **Problem**: The noise mechanic might be too slow to run (collecting moves, flipping, and returning).
     - **Solution**: Instead of collecting physical moves, have each pair play together and you provide each pair with a "noise die" (a d20) and a table: if they roll 1, 2, or 3 (15%), then they flip the move they receive. But then they might cheat? Alternatively, have a trusted player in each pair be the "noise roller" for both. But that might be messy. Alternatively, run the game without physical collection: have each player write their move for the round and then exchange with their partner, but before looking at the partner's move, they roll a die (provided) and if the roll is <=3 (on a d20), they flip the move. Then they record the (possibly flipped) move as the partner's move. This is decentralized and fast. We'll do that.

  Revised noise mechanic for the game:
    - Each pair gets two dice (d20) and a noise rule: "When you receive your partner's move, roll the d20. If you roll 1, 2, or 3 (15%), then flip the move (if it's C, make it D; if D, make it C). Otherwise, use the move as written."
    - Important: The player does not know if their own move was flipped when it was received by the partner, but they do flip the move they receive. This way, each player is responsible for applying the noise to the move they receive.

    - Steps per round in a pair:
          Player A writes move A (based on their strategy and history of B's observed moves).
          Player B writes move B (similarly).
          They exchange moves (written on paper).
          Before looking, each rolls a d20 for the move they are about to see. If roll <=3, they flip it. Then they record the observed move (which may be flipped) and update their history.
          They then write their next move.

    - This is fast and keeps the game moving.

  **Handouts**:
    - Payoff matrix for one round (to remind them).
    - Rules for the game (including noise).
    - Strategy recording sheet (for each round: what I played, what I observed from the partner, and then the next move).

  **Timeline**:
    - Setup: 10 min
    - Phase 1: 20 min (10 rounds, 2 min per round? That's too long. Actually, we can do 1 min per round -> 10 min for Phase 1 playing, plus 5 min for instructions and scoring.)
        Revised: 
          - Explain Phase 1: 5 min
          - Play Phase 1: 10 rounds at 30 seconds per round? -> 5 min? Actually, let them take 1 min per round -> 10 min for Phase 1.
          - Then 5 min for pair scoring and initial reflection.

    - Debrief Phase 1: 5 min
    - Phase 2 design: 5 min
    - Phase 2 play: 10 min (10 rounds)
    - Final debrief: 20 min

  Total: 10 (setup) + 10 (phase1 play) + 5 (debrief1) + 5 (design) + 10 (phase2 play) + 20 (debrief) = 60 minutes. We have 90, so we can add 5 min buffer to setup and 5 to design.

  **Revised Timeline**:
    - Setup: 15 min (including initial explanation and handing out materials)
    - Phase 1: 10 min (play) + 5 min (scoring and reflection) = 15 min
    - Debrief Phase 1: 5 min
    - Phase 2 design: 10 min (they need time to think and write)
    - Phase 2 play: 10 min
    - Final debrief: 20 min
    - Buffer: 5 min

  Total: 15+15+5+10+10+20 = 75 minutes, plus 5 buffer -> 80, so we are safe.

  **What the activity can't do**:
    - It can't cover the full complexity of the evolutionary dynamics or the long-run equilibria. You will have to explain that in the debrief and connect to the literature (like Contrite Tit-for-Tat, Pavlov, and the notion of error-correcting strategies).
    - It might not produce a clear example of the exploitation of forgiveness if no one defects. You'll have to supplement with a hypothetical or a pre-calculated example.

  Let's write the full rules for the game:

  # The Noise Trap

  ## Setup
  - Players are paired (8 pairs).
  - Each player gets:
      - A handout with the payoff matrix and rules.
      - A strategy recording sheet (for 10 rounds).
      - An index card for writing their strategy.
      - A d20 die (each pair gets two dice).

  ## Payoff Matrix (per round)
  - Both Cooperate (C,C): 3 points each.
  - One Cooperates, One Defects (C,D): Cooperator gets 0, Defector gets 5.
  - Both Defect (D,D): 1 point each.

  ## Rules
  1. **Phase 1: Fixed Strategy**
     - Each player must use the strategy: "Start by cooperating in round 1. Then, in each subsequent round, do what your partner did in the previous round (as observed)."
     - Write this strategy on your index card.

  2. **Noise Rule**: 
     - In every round, after you write your move and exchange it with your partner:
          - When you receive your partner's move, roll the d20.
          - If you roll 1, 2, or 3 (15% chance), flip the move (C becomes D, D becomes C). Otherwise, use the move as written.
          - Record the move you observe (after flipping, if any) on your recording sheet.

  3. **Playing Phase 1**:
     - For 10 rounds, each round:
          a. Write your move (based on your strategy and the history of observed moves).
          b. Exchange moves with your partner (by showing each other or passing a paper).
          c. Roll your d20 for the move you received. If required, flip it and record the observed move.
          d. Update your history.

  4. **Scoring Phase 1**: After 10 rounds, calculate your total points.

  5. **Debrief Phase 1**: Discuss as a group.

  6. **Phase 2: Design Your Own Strategy**
     - You have 10 minutes to design a new strategy to handle the noise. Write it on a new index card. Your strategy must be a rule that uses the entire history of observed moves of your partner.

  7. **Re-pairing**: Randomly assign new partners.

  8. **Playing Phase 2**: Play another 10 rounds with your new partner, using your new strategy and the same noise rule.

  9. **Final Debrief**: Discuss the outcomes and the trade-offs.

  ## Facilitator Notes
  - During Phase 1, walk around to ensure they are following the noise rule correctly.
  - In the final debrief, highlight:
      - The spiral of mutual defection in Phase 1 caused by one flip.
      - How forgiveness (e.g., sometimes cooperating after a defection) helped restore cooperation in Phase 2 when both are cooperative.
      - How that same forgiveness made them vulnerable if the new partner was a defector.
      - Introduce Win-Stay-Lose-Shift (Pavlov): If the payoff last round was high (3 or 5), repeat your move; if low (0 or 1), switch. This can recover from errors and also avoid being exploited too badly.

  - Be prepared to show a simulation of a forgiving strategy vs. always-defect on the whiteboard if no pair had that outcome.

  This should achieve the desired effect.
answer: |-
  **Bottom line:** "The Noise Trap" makes players viscerally experience how one transmission error shatters reciprocal cooperation and how forgiveness rebuilds it but invites exploitation, forcing them to grapple with the tradeoff.

  ### Game Design: The Noise Trap
  **Structure:** Two phases (fixed pairs, then re-paired) of repeated Prisoner's Dilemma (10 rounds each), with a strategy redesign intermission. Noise corrupts moves during transmission. Payoffs: CC=3/3, CD=0/5, DD=1/1 (points, not money).

  #### **Phase 1: Fragility of Reciprocity**  
  **Goal:** Players use strict reciprocity (Tit-for-Tat), discover noise-triggered mutual defection spirals.  
  **Setup (5 min):**  
  - Pair players into 8 fixed groups.  
  - Hand out:  
    - Rulesheet (payoff matrix, noise rules).  
    - Strategy card (pre-printed: "Start with C. Then copy opponent's last *observed* move.").  
    - Recording sheets (log intended/observed moves, points).  
    - Two d20 dice per pair (for noise rolls).  
  - Explain: "10 rounds. Your strategy is fixed: reciprocate what you *see* your partner do. But moves get corrupted in transit—apply noise rule before recording observed moves."  

  **Noise mechanic (chosen after brainstorming):**  
  - *Why this?* Rolled dice per move (over alternatives: fixed forced errors felt artificial; noise tokens added complexity). Ensures organic, high-frequency errors.  
  - **Rules:**  
    1. After both secretly write intended moves, they exchange slips.  
    2. **Before looking,** each rolls a d20 for the received move:  
       - Roll 1-3 (15%): Flip the move (C↔D).  
       - Roll 4-20: Keep as-is.  
    3. Record the *observed* (possibly flipped) move. Use this for strategy input next round.  
  - *Crucial:* Players **never learn their own move was flipped**—only see corrupted partner moves.  

  **Play (10 min):**  
  - Round 1: All start with C (per strategy). Noise may flip some moves.  
  - Subsequent rounds: Copy observed partner move from prior round.  
  - Facilitator walks, answers questions.  

  **Predictable breakdown:**  
  - By round 4-6, most pairs descend into DD spirals after one error. E.g.:  
    - Accident: Player A intends C, noise flips to D. Player B sees D, defects next round.  
    - Spiral: A sees B’s D, retaliates, locking in DD.  
  - **Handling issues:**  
    - *Problem:* Some pairs avoid errors by luck—say, "This group dodged noise, but 85% of you didn’t."  
    - *Problem:* Players blame partners—emphasize, "No one cheated; noise did this."  

  **Debrief (5 min):**  
  - Show of hands: "Stuck in endless DD?" (Most raise hands).  
  - **Key insight:** "Reciprocity is brittle—one error poisons future moves because it treats noise as malice. You’re now prisoners of your own rules."  
  - Whiteboard example: Map a pair’s spiral from a single flip.  

  ---

  #### **Intermission: Strategy Redesign**  
  **Goal:** Players invent "forgiving" strategies, unaware of exploitation risk.  
  **Activity (10 min):**  
  - Collect Phase 1 strategy cards.  
  - Instruct: "Design a new strategy for Phase 2. Goal: Stabilize cooperation despite noise. Write rules on a blank card using the history of *observed* moves."  
  - **Prompt:** "How will you recover if you see a defection? Be specific!"  
  - *Do not* suggest strategies—wait for natural forgiveness (e.g., "Cooperate after 2 D's" or "70% chance to forgive").  

  ---

  #### **Phase 2: Forgiveness vs. Exploitation**  
  **Goal:** Players use new strategies, discover forgiveness aids cooperation but is exploitable.  
  **Setup (5 min):**  
  - Randomly re-pair players (ensures new partners, prevents prior trust).  
  - Hand out new recording sheets.  

  **Play (10 min):**  
  - Same noise rules (15% per-move flip).  
  - Players apply their custom strategies.  
  - **Critical moment:** At least one player will likely design "always defect" (statistically probable in 16 sharp players). If none emerge, plant a confederate (e.g., "Player 7, defect always—don’t reveal").  

  **Predictable outcomes:**  
  - **Cooperator pairs:** Forgiveness (e.g., "C after 1 D") recovers from errors—scores stabilize near CC.  
  - **Exploiter pairs:** Forgiveness (e.g., "C after any D") + always-defector → high defector scores.  
  - **Handling issues:**  
    - *Problem:* Players design overly complex rules—simplify mid-game: "Use 1-sentence rules."  
    - *Problem:* Noise obscures exploitation—after play, compare strategies to reveal intent.  

  ---

  #### **Final Debrief (20 min)**  
  **Connect gameplay to theory:**  
  1. **Fragility under noise:**  
     - Ask: "Why did Phase 1 spiral? You *intended* cooperation, but..."  
     - **Answer:** Noise creates false defections. Tit-for-Tat can’t distinguish errors from malice—retaliation cascades.  
     - Whiteboard: Draw a noise-triggered DD spiral.  

  2. **Forgiveness repairs but risks exploitation:**  
     - Ask forgiving players: "Did your strategy work? When didn’t it?"  
     - **Answer:** Forgiveness (e.g., TFT with contrition) resets cooperation after errors but subsidizes real defectors.  
     - Show scores: Exploiter pairs (defector: high, forgiver: low) vs. cooperative pairs (both high).  

  3. **Win-stay/lose-shift (Pavlov) as a robust alternative:**  
     - Ask: "Did anyone try switching only after bad payoffs?" (Likely a few).  
     - **Explain:** Pavlov (switch if payoff < 3) self-corrects after errors:  
       - Error causes low payoff → switch move → often returns to CC.  
       - *But* still exploitable (alternating CD/DC gives defector 3 avg. vs. TFT’s 1 in DD spiral).  
     - Whiteboard: Compare Pavlov vs. TFT under noise.  

  4. **The frontier:**  
     - **Tradeoff:** More forgiveness → faster error recovery but easier exploitation.  
     - **No free lunch:** "Optimizing for noise helps cooperators but weakens you against predators. Real-world strategies (like Contrite TFT) walk this edge."  

  **What the game can’t teach (supply yourself):**  
  - Evolutionary stability (e.g., how strategies spread in populations).  
  - Quantitative tradeoffs (e.g., optimal forgiveness rate depends on noise frequency—simulate this post-game).  
  - Asymmetric noise or private perceptions—mention as extensions.  

  ---

  **Why this works:**  
  - Phase 1’s forced reciprocity induces helplessness as DD spirals mount.  
  - Phase 2’s strategy redesign fosters ownership; re-pairing creates exploiter "aha" moments.  
  - Dice-based noise is visceral, scalable, and mirrors real-world ambiguity.  

  **Materials prep:**  
  - Print: Rulesheets (payoff matrix, instructions), recording sheets.  
  - Buy: d20 dice (1 per player), index cards.  
  - Whiteboard: Track debrief points.  

  **Run it cold once to refine—then break their smugness.**
