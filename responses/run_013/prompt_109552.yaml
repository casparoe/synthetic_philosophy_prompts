  Okay, so this is maybe just me failing to remember a term from a philosophy minor I did years ago, but I've been turning this over for weeks and can't place it, and I'm honestly not sure the thing I'm describing is one thing rather than two. Here's the shape of it. Two rival stories about what something really is — what an animal is doing when it acts a certain way, what a black-box model is really representing, what a person's actual motive was — and the two stories fit every observation I can make, and fit them equally well, not because I haven't looked hard enough yet but because the only situations where the two stories come apart are situations I can never get into. My brother insists his dog loves him and I say she's just attached to him because he's the food-and-safety source; every test we can run (she greets him at the door, she mopes when he travels, she comes when called) comes out the same either way, and the test that would seperate them — the brother who never fed her, the dog who could talk — isn't a test we can set up. At work it's worse: we're poking at a model and every input we can feed it lands in the region where "it's tracking the real feature" and "it's tracking a cheap correlate of the feature" give identical outputs, so we can probe it forever and never learn which one it is. And what bugs me is that everyone's response is "we need more data," but the data that would settle it isn't missing, it's unreachable — it's behind a wall, not over the horizon.

