  For each question, I'll draft the guest's probable response based on geometric rationality literature. She'll likely emphasize that even single bets exist in a temporal context, reject linear utility, and defend wealth as the compounding base. Her weakest point might be the one-time bet - she may fall back on decision hygiene arguments. The follow-ups should expose inconsistencies: if growth rate matters in single bets, is that circular? If we optimize log wealth directly, doesn't that change the optimal fraction? 

