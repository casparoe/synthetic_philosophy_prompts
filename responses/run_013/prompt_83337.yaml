prompt: |-
  Ok so I've been reading about how regulators in the US put a dollar figure on saving lives, and it's been bugging me. When the EPA or the Department of Transportation runs a cost-benefit analysis on some new rule, they use a number for the value of a statistical life -- a few million dollars, sometimes close to ten -- and that number mostly comes out of studies of how much extra pay workers demand to take riskier jobs, or surveys where people say what they'd pay to knock a hair off their chance of dying. Then they multiply it by the deaths the rule is expected to prevent and stack that up against what the rule costs.

  What gets me is what the whole practice has to assume. It seems to assume that a life has a price, that my life and your life are worth the same amount, and that the way to find out what something is worth to a person is to look at what they'd trade for it. But the same government won't let me sell my own kidney, and juries in wrongful-death suits come up with numbers that have nothing to do with the ten million, and nobody ever asks the workers who took those risky jobs whether they'd actually want the money spent on the rule that protects them. Also a friend told me there's a real difference between what people choose and what they end up experiencing -- like the guy taking the risky job is deciding based on what he imagines the risk will be like, and the value of the thing itself could come apart from what his choice reveals, especially if he's bad at judging small probabilities or if he just adapts to the danger over time.

  So here's what I want. What philosophical commitments does this practice actually presuppose? Reconstruct the implicit theory of utility and value that it only makes sense under. Is it preference satisfaction, is it hedonic, does it need utility to be cardinal and comparable across people, does it have to assume people know their own interests? Then tell me which rival theories it quietly rules out, and which ones it's merely compatible with -- my suspicion is that a lot of it is underdetermined and several theories would license the same numbers, but I want to know where the practice is actually doing philosophical work and where it isn't. And tell me whether the parts hang together: the value of a statistical life in a rulemaking docket versus the refusal to let people trade in their own organs versus whatever juries do in tort. Last thing: if you swapped out the underlying view for the other one my friend mentioned, where what counts is experienced well-being rather than what people would choose, what would concretely have to change about how regulaters do this? I don't want citations or a reading list, just the argument.

  Write it as continuous prose, no headings, no bullet points, no bold, no tables -- the way you'd write an email to someone. And use American English.
reasoning: |-
  Okay, the user is grappling with the ethical and philosophical underpinnings of how US regulators value human life in cost-benefit analyses. They're troubled by the apparent contradictions: using statistical lives derived from wage premiums while prohibiting organ sales, and noting how juries assign wrongful death values independently. Their deeper concern seems to be about the coherence of the government's ethical framework across different domains.

  The core philosophical tension revolves around revealed preference theory versus experiential well-being. The current regulatory approach heavily relies on the former - inferring value from choices like risky job acceptances. This presupposes cardinal utility (quantifiable satisfaction), interpersonal comparability (your life equals mine in dollar terms), and rational choice theory (workers accurately assess risks). It quietly dismisses alternative views like hedonic utilitarianism (which prioritizes actual lived experience) or capabilities approaches (valuing what people can be/do). 

  The kidney sale prohibition introduces paternalism - the state overriding preferences "for your own good," which clashes with the choice-centric logic of VSL. Tort damages operate on yet another logic: compensating loss to survivors rather than valuing life per se. This three-way inconsistency suggests the government isn't applying a unified ethical theory but rather different tools for different contexts, which is understandably jarring.

  If regulators switched to experiential well-being, everything changes. We'd need longitudinal studies on how risks actually affect quality of life (e.g., chronic stress from dangerous jobs), not just wage premiums. Small-probability biases would matter less, but new problems arise: how to measure "experience" objectively, and whether to value momentary happiness versus life satisfaction. The worker's adaptation to danger might now count against regulation ("they don't mind the risk"), which feels ethically precarious.

  The user's sharpest insight is about underdetermination: multiple theories could justify similar VSL numbers, making the philosophical commitments murkier than they appear. Where the practice truly does philosophical work is in its treatment of autonomy - trusting market choices for regulation while restricting them for organs. That selective trust deserves scrutiny.
answer: |-
  You've zeroed in on the core philosophical tension baked into regulatory cost-benefit analysis. The practice rests heavily on a specific, often unspoken, set of commitments about value, rationality, and welfare, primarily rooted in **welfarist economics and revealed preference theory**. Here’s the reconstruction:

  The foundation is **preference utilitarianism**. It assumes an individual's well-being is defined solely by the satisfaction of their informed, stable preferences. Value isn't inherent; it's *revealed* through observable choices in markets or hypothetical scenarios. When a worker takes extra pay for a riskier job, that choice "reveals" how much they value reducing their mortality risk. Aggregating these choices across many people generates the Value of a Statistical Life (VSL) – the price society implicitly pays to reduce expected deaths. This approach necessitates several key assumptions:

  1.  **Cardinal and Interpersonally Comparable Utility:** It treats utility (satisfaction) as quantifiable. The dollar amounts workers accept for risk translate directly into units of well-being lost or gained. Crucially, it assumes $10,000 means the *same thing* in utility terms to different people, allowing regulators to add up "willingness-to-pay" across the population. Without this, multiplying individual VSL figures by the number of lives saved makes no sense.
  2.  **Rational Choice & Informed Preferences:** It assumes people are rational actors who understand the risks they face (like small mortality probabilities) and accurately weigh them against compensation. Their choices reflect their "true" interests. If workers systematically misjudge risks or are coerced by circumstance, the revealed preference becomes unreliable.
  3.  **Consumer Sovereignty:** What matters is what people *choose*, not necessarily what an external observer thinks is "good" for them. The worker's choice, even if risky, is respected as the best indicator of their welfare. This prioritizes autonomy and individual judgment.
  4.  **Ex Ante Perspective:** Valuation happens *before* the outcome. It's about reducing the *probability* of death across a population, not about valuing a specific, identified life tragically lost. This depersonalization is key to the statistical approach.

  **What it Rules Out (or Struggles With):**

  *   **Hedonic/Experiential Theories:** If well-being is about actual feelings (pleasure/pain, life satisfaction), the revealed preference approach diverges. Your friend's point hits here: the worker *choosing* the risky job based on imagined risk tolerance might later *experience* the danger as far more aversive, or adapt in ways that mask suffering. The regulator's model ignores this potential gap between choice and experience. It also struggles with how people value states they haven't experienced (like being dead).
  *   **Objective List Theories:** Approaches that define well-being by objective goods (health, knowledge, relationships) are sidelined. The government refusing kidney sales implicitly appeals to such a theory – certain things (bodily integrity, preventing exploitation) are deemed objectively bad, overriding individual choice. This creates tension: Why override choice for organs but rely *entirely* on choice for workplace risk valuation?
  *   **Non-Welfarist Theories:** Theories valuing rights, fairness, or deontological constraints (e.g., "life is sacred") are incompatible. The VSL approach reduces life-saving to a dollar trade-off, which feels morally repugnant under these views. This explains the disconnect with juries in wrongful death suits. Juries aren't calculating statistical risk reduction; they're compensating specific loss, expressing moral outrage, valuing a *particular* life (often considering lost companionship, earnings, suffering – things closer to an objective list or experiential harm), and operating under legal doctrines that aren't purely welfarist. They aren't using the VSL because their purpose and philosophical foundation are different.
  *   **Strong Paternalism:** While the VSL respects choices (even risky ones), the organ sale ban *is* paternalistic, assuming the state knows better than the individual what's good for them in that specific domain. This inconsistency reveals the practice isn't purely libertarian; the government reserves the right to override preferences when it deems choices fundamentally harmful or exploitative, conflicting with the consumer sovereignty assumed in VSL derivation.

  **Underdetermination and Compatibility:**

  You're right that the *specific number* might be compatible with rival theories. A hedonic utilitarian might argue that, *on average*, the wage premium workers demand *correlates* with the disutility they expect from the risk. A capability theorist might see the money as a proxy for resources needed to achieve valuable functionings. However, the *methodology itself* – deriving value solely from observed or stated choices in trade-off scenarios – is deeply tied to revealed preference. Swapping the foundation changes *why* the number is valid, not necessarily the number itself, though the number might shift.

  **The Parts Hanging Together (or Not)?**

  They don't cohere perfectly, and that's the rub. The regulatory VSL relies on **revealed preference, welfarism, and ex-ante statistical aggregation.** The organ sale ban relies on **paternalism, objective harms, and deontological constraints** (often linked to bodily integrity and commodification concerns). Tort damages operate under a **corrective justice, ex-post, compensatory model**, often incorporating non-economic damages and relational loss that VSL ignores. The government uses different ethical toolkits for different problems: a welfarist/economic toolkit for regulatory efficiency, and a rights/paternalistic toolkit for certain bodily and market integrity issues. This patchwork is philosophically messy but pragmatically driven by context.

  **Swapping to Experienced Well-Being: The Concrete Changes**

  If regulators switched to valuing *experienced* well-being (hedonic or life satisfaction):

  1.  **Data Source Shift:** They couldn't rely on wage premiums or hypothetical surveys about choices. They'd need direct measures of how risks *actually affect* people's subjective well-being over time. Studies tracking stress, anxiety, life satisfaction, and quality of life impacts of hazardous jobs or environmental exposures would be paramount.
  2.  **Focus on Actual Suffering, Not Just Death:** Reducing chronic pain, disability, anxiety, or depression caused by hazards might become as important as preventing death itself. The analysis would need to quantify the well-being burden of living *with* the risk, not just the final outcome of death.
  3.  **Accounting for Adaptation & Misestimation:** Regulators would need models incorporating how people adapt to risk (potentially lowering its experienced disutility) or how they systematically mispredict its impact (e.g., underestimating future suffering). The "value" would be tied to the *actual experience*, not the choice based on anticipation.
  4.  **VSL Becomes VSWB (Value of Statistical Well-Being):** Instead of dollars per prevented death, the metric might be dollars per unit of aggregated well-being gained (e.g., Quality-Adjusted Life Years - QALYs - already used in health, but with a stronger experiential focus). Preventing death would be one way to gain well-being, but not the only way.
  5.  **Greater Scrutiny of Choice Context:** If choices are poor predictors of experience, regulators would be *more* justified in paternalistic overrides (like safety regulations even if workers "choose" lower pay for less safety). This could paradoxically align *better* with the logic behind the organ sale ban, as both would distrust choice as a perfect indicator of welfare under certain conditions.

  The core philosophical work the current VSL practice does is its unwavering commitment to *choice as the sovereign indicator of value* within the specific domain of regulatory efficiency analysis, built on cardinal, comparable utility. It rules out theories that prioritize experience over choice, objective goods over preferences, or intrinsic rights over welfare trade-offs. The inconsistencies with other government actions highlight that this commitment isn't universal; it's a specific tool for a specific job, operating within a larger, less coherent ethical landscape.
