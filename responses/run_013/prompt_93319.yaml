prompt: |-
  Two members of a working group on probability have spent a year arguing past each other about the reference class problem and have agreed to write the document that a good-faith adversarial collaboration between them would produce. The first, whom we may call the single-class realist, holds that for any singular probability claim — the chance that this particular patient carries the disease, that this particular atom decays within the hour, that this particular toss lands heads — there is one correct reference class, fixed by the causal structure of the situation, so that a disagreement about which class to use is a disagreement about a fact. The second, the question-relativist, holds that a probability is always relative to a question: a class is correct only relative to a decision problem, an evidential situation, or an interest, and the appearance of a single right answer is manufactured by an unacknowledged default class. Neither will abandon their position, and each regards the other's as not merely false but evasive. Write the joint statement they could both sign.

  Treat the following as shared background. Probability is standardly modeled as a measure on a space of possibilities, and the probability of an event given information as a conditional expectation with respect to a sub-sigma-algebra; neither party takes the dispute to be mathematical. Both accept that two desiderata on the choice of a class can pull apart: specificity, which favors the narrowest class with stable statistics, and statistical relevance, which favors excluding factors that leave the probability unchanged once the others are fixed. Both also accept that a factor can be statistically relevant without being causally relevant, as when a marker is a mere proxy for a cause. And both agree on the numbers whenever the candidate classes do not disagree.

  Produce the document in three parts.

  1. Agreed claims. A numbered list of claims both sides would sign, stated so that neither smuggles in its own view. Cover: what the formalism does and does not settle; which desiderata both accept and what makes each attractive; what the dispute is not (not about the axioms, not about whether classes can be ranked by informativeness or specificity, not about whether some class choices are practically indefensible); and any cases in which the two positions deliver the same verdict.

  2. Disagreements. A table, one row per remaining disagreement, with columns for: the question at issue; the realist's statement of its own position; the relativist's statement of its own position; the crux; a case, argument, or piece of evidence both sides agree bears on the crux; the realist's prediction about it; the relativist's prediction about it. Each side's statement must be in wording that side would accept as fair, not wording only the other side would find plausible. The table must include at least these rows: whether the correctness of a singular probability claim presupposes a decision context; whether objective chance in a physical setup supplies a distinguished class or only a distinguished protocol; and whether the conflict between specificity and relevance is governed by a rule or resolved only by a choice that reflects an interest. Use at least these stipulated cases: a person for whom the actuarial class gives a risk of one in a hundred while a narrower class, defined by a marker that screens off the actuarial variables, gives eight in a hundred; and a single atom with an exactly known decay constant, where its chance of decaying in the next hour is asked about with no decision attached. Where a case cannot discriminate between the positions, say so and say why.

  3. Verbal residue. Identify any part of the dispute that is merely verbal, name the word doing the work, and state what the two sides would agree on once it is disambiguated.

  No bibliography, no citations, no appeals to who has argued what. Reason only from the formalism and the stipulated cases, do not resolve the dispute in favor of either side, and where the two positions turn out to coincide, say so plainly rather than manufacturing a difference.
reasoning: |-
  We are to produce a joint statement for two parties: the single-class realist and the question-relativist. The document has three parts.

  Part 1: Agreed claims (numbered list)
  Part 2: Disagreements (table with specified columns and rows)
  Part 3: Verbal residue (identify any merely verbal part)

  Background shared:
  - Probability modeled as a measure on a space, conditional probability as conditional expectation.
  - Dispute not mathematical.
  - Both accept two desiderata: specificity (narrowest class with stable statistics) and statistical relevance (excluding factors that don't change probability once others fixed).
  - Both accept that a factor can be statistically relevant without being causally relevant (e.g., a proxy marker).
  - Both agree on numbers when candidate classes don't disagree.

  Part 1: Agreed Claims

  We must list claims both would sign, without smuggling in either view.

  1. The mathematical formalism of probability theory, including the definition of conditional probability and conditional expectation, does not by itself determine the choice of reference class for a singular probability attribution.
  2. Both desiderata — specificity (seeking the narrowest class with stable statistics) and statistical relevance (including only factors that change the probability when others are fixed) — are legitimate considerations in choosing a reference class.
  3. The desideratum of specificity is attractive because it aims to use the most precise information available, which may lead to more individualized predictions when the data support it.
  4. The desideratum of statistical relevance is attractive because it avoids including irrelevant factors, which could lead to unnecessary coarsening of the class and potential loss of predictive power.
  5. The dispute is not about the axioms of probability, which both parties accept.
  6. The dispute is not about whether reference classes can be ranked by their informativeness or specificity; both agree that they can.
  7. The dispute is not about whether some choices of reference class are practically indefensible; both agree that some choices (e.g., arbitrary or clearly irrelevant groupings) are unacceptable in practice.
  8. When two candidate reference classes yield the same probability value for the event in question, the disagreement between the two positions does not manifest and both can accept the common value.
  9. A factor that is statistically relevant may not be causally relevant, and vice versa; however, both parties agree that statistical relevance is what matters for the probability calculation.

  Part 2: Disagreements (table)

  Required rows (at least):
  - Row 1: whether the correctness of a singular probability claim presupposes a decision context.
  - Row 2: whether objective chance in a physical setup supplies a distinguished class or only a distinguished protocol.
  - Row 3: whether the conflict between specificity and relevance is governed by a rule or resolved only by a choice that reflects an interest.

  Stipulated cases to use:
  - Case A: A person for whom the actuarial class (e.g., based on age and sex) gives a risk of 1 in 100 while a narrower class, defined by a marker that screens off the actuarial variables, gives 8 in 100.
  - Case B: A single atom with an exactly known decay constant, where its chance of decaying in the next hour is asked about with no decision attached.

  Table columns:
  - Question at issue
  - Realist's statement
  - Relativist's statement
  - The crux
  - A case/argument/evidence both agree bears on the crux
  - Realist's prediction
  - Relativist's prediction

  We must have at least these three rows, and we use the two cases.

  Row 1: Correctness of singular probability claim and decision context.

  Question at issue: Must a singular probability claim (e.g., "the probability that this patient has the disease is p") be understood as relative to a decision context or an evidential situation?

  Realist's statement: A singular probability claim is correct or incorrect independently of any decision context. The correct probability is determined by the causal structure of the situation, which fixes a unique reference class.

  Relativist's statement: A singular probability claim is only meaningful relative to a decision context, an evidential situation, or an interest. Without such relativization, the claim is incomplete.

  Crux: Whether the concept of probability for a singular event inherently requires a context that specifies the purpose or the evidence.

  Case/argument: Case B (the atom decay). We are to assign a probability to the decay of a single atom in the next hour, with no decision attached.

  Realist's prediction: The probability is objectively p, given by the decay constant, because the causal structure (the physical setup) provides a distinguished reference class (all atoms of that isotope). There is no need for a decision context.

  Relativist's prediction: Without a decision context, the question is incomplete. However, if forced to assign a number, one might use the decay constant as a default, but this is relative to a particular evidential situation (knowing the decay constant and nothing else). The relativist might also note that if there were additional information (e.g., the atom is in a excited state), then a different class might be used, but in the absence of such information and without a context, the question is ill-posed.

  Row 2: Objective chance and distinguished class vs. protocol.

  Question at issue: In a physical setup with an objective chance (like radioactive decay), does the setup supply a distinguished reference class, or only a distinguished protocol (a method for generating probabilities)?

  Realist's statement: The physical setup (e.g., the type of atom) supplies a distinguished reference class: the class of all atoms of that type. The chance is a property of the individual atom by virtue of its membership in that class.

  Relativist's statement: The physical setup supplies a distinguished protocol (the decay process) that generates probabilities, but the reference class is relative to the description of the setup. The same physical system might be described in different ways, leading to different reference classes, and the choice of description may depend on the context.

  Crux: Whether the objective chance in a physical system is tied to a unique reference class or to a protocol that can be described in multiple ways.

  Case/argument: Case B again (the atom). Also, consider a hypothetical where the same atom is described in two ways: as an atom of isotope X, or as an atom that has been in a magnetic field for a certain time (if that were known to affect decay).

  Realist's prediction: The atom has an objective chance of decay in the next hour, which is fixed by its being an atom of that isotope. Any other class (like the magnetic field history) is either irrelevant (if it doesn't causally affect decay) or part of the causal structure (if it does). But in the standard case, the isotope class is the causally relevant one.

  Relativist's prediction: The decay constant provides a probability relative to the protocol of considering atoms of that isotope. If we had more information (like the magnetic field) and it were statistically relevant, we might use a different class, but without a decision context, there is no fact of the matter about which class is "correct". The protocol is fixed, but the reference class is relative to the variables we choose to condition on.

  Row 3: Conflict between specificity and relevance: rule or choice?

  Question at issue: When specificity and relevance pull in different directions (e.g., one class is narrower but another excludes irrelevant factors), is there a rule that determines the correct class, or is the resolution always relative to an interest?

  Realist's statement: The causal structure of the situation determines which factors are relevant and thus breaks the tie. The correct reference class is the one that captures all and only the causally relevant factors.

  Relativist's statement: There is no rule that breaks the tie without reference to an interest or decision context. The choice between a more specific class and a class that satisfies statistical relevance depends on the practical goals (e.g., minimizing error, maximizing predictive accuracy in a specific way) and the available evidence.

  Crux: Whether the conflict between specificity and relevance is resolved by an objective feature (causal structure) or by a choice that reflects the purpose.

  Case/argument: Case A (the patient). The actuarial class (without the marker) gives 1%, the class with the marker (which screens off the actuarial variables) gives 8%. Which one should we use?

  Realist's prediction: The correct probability is 8% because the marker is a causally relevant factor (or a proxy for one) and it screens off the actuarial variables. The narrower class defined by the marker is the one fixed by the causal structure.

  Relativist's prediction: Without a decision context, there is no absolute answer. In a context where the marker is available and the decision is about treatment, we might use 8%. But in a context where the marker is not available (or not used) and we are using only the actuarial variables, we would use 1%. The choice depends on the information we are conditioning on, which is relative to the question.

  Now, we must also note if a case cannot discriminate. Case B (the atom) does not involve a conflict between specificity and relevance because we have no additional factors. So it doesn't bear on row 3. We use Case A for row 3.

  Part 3: Verbal residue

  We are to identify any part of the dispute that is merely verbal, name the word, and state what they would agree on.

  One candidate: The word "correct" in "correct reference class". The realist uses "correct" to mean fixed by the causal structure. The relativist uses "correct" to mean appropriate for a given context. Once disambiguated, both can agree that:

  - The realist is making a claim about the existence of a causally determined reference class.
  - The relativist is making a claim that without a context, there is no unique reference class.

  They might also agree that in many practical situations, the same class is chosen because the context (including the causal structure) is shared.

  Another candidate: The word "probability" itself. The realist might think of probability as an objective property of the single case, while the relativist thinks of it as always relative. But this might be more substantive. However, if we focus on the term "reference class", then the verbal issue is about the conditions under which a reference class is "correct".

  We might say:

  The parties agree that the word "correct" as applied to a reference class is ambiguous. The realist uses it to mean "causally appropriate", while the relativist uses it to mean "pragmatically appropriate relative to a context". Once disambiguated, they agree that the realist's "correct" class is the one that the realist believes is fixed by causality, and the relativist's "correct" class is the one that is contextually appropriate. They also agree that in some contexts, these may coincide.

  Now, we write the document accordingly.
answer: |-
  ### Joint Statement on the Reference Class Problem

  **Preamble:**  
  We, the single-class realist and the question-relativist, having engaged in extensive debate, present this document as a good-faith adversarial collaboration. We agree on the mathematical formalism of probability as a measure on a space of possibilities, with conditional probability defined via conditional expectation. Our dispute concerns the interpretation and application of reference classes for singular probability claims, not the axioms or mathematics. We both accept that two desiderata—specificity (favoring the narrowest class with stable statistics) and statistical relevance (favoring exclusion of factors that leave the probability unchanged once others are fixed)—can conflict, and that statistical relevance may exist without causal relevance. We also agree on probability values when candidate classes yield the same number. Below, we outline areas of agreement, disagreements with cases, and verbal residues.

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following numbered claims, stated neutrally:  

  1. **Formalism and reference class indeterminacy:** The mathematical formalism of probability theory does not determine the choice of reference class for a singular probability claim. It provides tools for calculating probabilities given a class but does not specify which class to use.  
  2. **Shared desiderata:** Both specificity and statistical relevance are valid desiderata for reference class selection, and both are widely employed in probabilistic reasoning.  
  3. **Attraction of specificity:** Specificity is attractive because it leverages the most fine-grained available information, potentially improving predictive accuracy when data supports narrow classes.  
  4. **Attraction of relevance:** Statistical relevance is attractive because it avoids incorporating superfluous factors, reducing noise and enhancing efficiency when broader classes are stable.  
  5. **Non-mathematical dispute:** The disagreement is not about the Kolmogorov axioms, measure theory, or the definition of conditional probability; these are accepted by both.  
  6. **Ranking classes by informativeness:** Classes can be objectively ranked by their specificity (e.g., narrower vs. broader) or informativeness (e.g., entropy reduction), and both parties accept such rankings.  
  7. **Practically indefensible classes:** Some reference class choices are indefensible in practice (e.g., arbitrary or clearly irrelevant groupings), and both reject these as inadmissible.  
  8. **Agreement when classes align:** When candidate reference classes agree on the probability value for a singular event, the dispute does not arise, and both accept the shared value as the probability.  
  9. **Statistical vs. causal relevance:** A factor may be statistically relevant without being causally relevant (e.g., a proxy marker), and vice versa; statistical relevance alone governs probability calculations, regardless of causal status.  
  10. **Stability requirement:** Both require that a reference class exhibit stable statistics (i.e., robust frequencies or well-defined propensities) to be viable; unstable classes are inadmissible.  

  ---

  ### 2. Disagreements  
  The table below details key disagreements. Each row addresses a specific question, with columns for: the question at issue; the realist's position in their own terms; the relativist's position in their own terms; the crux of the disagreement; a case or evidence both agree bears on the crux; the realist's prediction; and the relativist's prediction. Cases are drawn from stipulated examples.  

  | Question at Issue | Realist's Statement | Relativist's Statement | Crux | Case/Evidence Bearing on Crux | Realist's Prediction | Relativist's Prediction |
  |-------------------|---------------------|------------------------|------|-------------------------------|----------------------|-------------------------|
  | **Must a singular probability claim (e.g., "the probability this patient has the disease is p") presuppose a decision context, evidential situation, or interest?** | A singular probability claim is objectively correct or incorrect without reference to a decision context. The correct reference class is fixed solely by the causal structure of the situation, which exists independently of human interests. | A singular probability claim is incomplete without relativization to a decision context, evidential situation, or interest. Probability is inherently relational; no "correct" class exists absent a frame of reference. | Whether probability is an intrinsic property of an event (realist) or a relational tool (relativist). | Case B: Single atom with known decay constant; probability of decay in the next hour asked with no decision attached. | The probability is objectively p (e.g., 0.5 for a half-life of 1 hour), as the causal structure (atomic properties) fixes the class (all atoms of that isotope). Context is irrelevant. | Without a decision context, the question is ill-posed. If forced, p is assigned relative to a default evidential situation (knowing only the decay constant), but this is a pragmatic choice, not an objective fact. |
  | **Does objective chance in a physical setup (e.g., radioactive decay) supply a distinguished reference class, or only a distinguished protocol?** | Objective chance implies a distinguished reference class fixed by causal structure. For example, an atom's decay chance is determined by its membership in a natural class (e.g., all atoms of its isotope). | Objective chance supplies a distinguished protocol (e.g., the decay process), but reference classes are relative to descriptions of the setup. No class is privileged independent of a context. | Whether physical setups uniquely determine a reference class (realist) or merely a process that can be described variably (relativist). | Case B: Single atom decay, as above. Also, a variant where the atom is described both as "isotope X" and as "atom in magnetic field Y" (if field Y affects decay). | The class is distinguished: "isotope X" is the unique correct class, as causal structure overrides other descriptions. If field Y is causally relevant, it alters the class; otherwise, it is excluded. | Only the protocol is distinguished; classes depend on description. For the atom, "isotope X" is one valid class relative to minimal evidence, but "atom in field Y" could be used if context includes field data. |
  | **When specificity and relevance conflict, is resolution governed by a rule (e.g., causal structure), or only by a choice reflecting an interest?** | Specificity-relevance conflicts are resolved by causal structure: the correct class includes all and only causally relevant factors, which determines a unique reference class. | Specificity-relevance conflicts are resolved by choice, reflecting interests (e.g., predictive accuracy for a goal). No rule dictates the "correct" class; it depends on context. | Whether causal structure objectively breaks ties (realist) or interests subjectively break ties (relativist). | Case A: Person with actuarial class risk (1/100) vs. narrower marker class (8/100), where the marker screens off actuarial variables. | The marker class (8/100) is correct because the marker is causally relevant (or a proxy for a cause) and screens off other factors; specificity is subordinated to causal relevance. | No class is inherently correct. If the interest is actuarial fairness, use 1/100; if precision with the marker is available, use 8/100. The choice depends on the decision problem. |
  | **Can the conflict between specificity and relevance arise without causal ambiguity?** | The conflict reduces to causal structure: if all factors are causally assessed, specificity and relevance align in the true causal class. Apparent conflicts stem from incomplete causal knowledge. | The conflict is fundamental and not resolvable by causality, as statistical relevance (based on data) may diverge from causal relevance, and interests guide which to prioritize. | Whether causality eliminates the conflict (realist) or the conflict persists independently (relativist). | Case A (as above), assuming the marker is statistically but not causally relevant (e.g., a proxy). | The conflict is illusory: the correct class is causal. If the marker is non-causal, it is excluded; the actuarial class (1/100) is correct. | The conflict is real: non-causal markers can be statistically relevant. Choice depends on interest—e.g., cost of errors—not causality. Case A can be resolved either way contextually. |
  | **Does the "screening off" condition favor one desideratum?** | Screening off (where a narrower class makes broader variables irrelevant) reinforces specificity: the narrower class is correct if it captures causal structure. | Screening off is a statistical fact that does not inherently favor specificity; it may be overridden by relevance if context demands exclusion of the narrower factor. | Whether screening off objectively mandates narrower classes (realist) or is context-dependent (relativist). | Case A: Marker screens off actuarial variables. | Screening off confirms the marker class (8/100) as correct, as it reflects causal structure and maximizes specificity. | Screening off is data-dependent, but the choice to use it depends on context (e.g., whether the marker is actionable). No objective mandate exists. |

  **Notes on cases:**  
  - **Case A:** Both agree the marker class is narrower and screens off actuarial variables. The case discriminates because the realist sees causality as decisive, while the relativist sees choice as necessary.  
  - **Case B:** Does not discriminate on specificity-relevance conflicts (row 3) due to no competing factors. It discriminates on rows 1–2 by testing context-independence.  
  - Where cases cannot discriminate (e.g., row 3 for Case B), it is because the case lacks a conflict between desiderata.  

  ---

  ### 3. Verbal Residue  
  We identify one primarily verbal dispute:  

  - **Word in question:** "Correct" (as in "correct reference class").  
  - **Disambiguation:** The realist uses "correct" to mean "fixed by causal structure," implying an objective, context-independent fact. The relativist uses "correct" to mean "appropriate relative to a decision context, evidential situation, or interest," implying relational validity.  
  - **Agreement post-disambiguation:** Both parties agree that:  
    - The realist's position is that causal structure determines a unique reference class independent of context.  
    - The relativist's position is that no class is uniquely correct without relativization.  
    - In practice, causal structure often informs the choice of class, and decision contexts often incorporate causal knowledge, leading to overlap.  
    - The dispute over whether a class is "correct" reduces to the above definitions; it is not about the existence of causal structure or contextual utility.  

  No other substantial verbal residues are identified; core disagreements remain non-verbal, centering on the role of context and causality in determining reference classes.  

  ---  
  **Signed,**  
  The Single-Class Realist  
  The Question-Relativist
