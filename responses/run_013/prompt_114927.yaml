  I should start by identifying the core disagreement. Both sides agree on the descriptive facts (e.g., in ordinary contexts, we say we know we have hands). Their divergence is theoretical. Closure defenders prioritize preserving logical relations, while tracking theorists prioritize modal conditions. This isn't merely verbal because both use 'knows' with the same referential intent but differ in the theory of what knowledge is. 

  Methodologically, they treat intuitions differently. Closure defenders see denying closure as counterintuitive and thus a reductio. Tracking theorists accept that intuition as defeasible, pointing to cases like the lottery paradox where closure seems problematic. So the clash is over which intuitions are non-negotiable.

