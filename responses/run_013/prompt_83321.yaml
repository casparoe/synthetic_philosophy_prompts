  - Mundane household item 
  - No parts added/removed 
  - Not about intrinsic properties (shape is relational here) 
  - Perdurantism must say only a temporal part exists at each moment, making "the chair" at t1 literally a different entity from "the chair" at t2 

  *Asymmetry check:*
  Endurantism: The whole chair is present at every moment, so it can directly undergo the reconfiguration. 
  Perdurantism: Only a temporal slice exists at each instant. Saying "the chair changed posture" becomes shorthand for relations between distinct temporal parts. The literal subject of change vanishes! 

  *Testing exclusions:* 
  - Not Ship-of-Theseus (no part replacement) 
  - Not statue/clay (no coincidence) 
  - Not simple property swap (posture is structural/relational) 

  *Potential flaw:* 
  Is "posture change" too close to "bent to straight"? But posture involves part relations, not intrinsic properties. Defendable! 

  *Perdurantist counterattack:* 
  They'll argue temporal parts bear properties like "having-a-backrest-at-angle-X," and the worm has the property "changes-posture." But this is re-description—ordinary language attributes change to the chair itself. Cost: They sacrifice intuitive subjecthood of persistence. 

  *Final validation:* 
  Meets all specs. Only worry: "structural change" might edge toward textbook cases, but the relational aspect makes it fresh. If we removed part-movement (e.g., just repainting the chair), it collapses into property-swap. Kept it!
answer: |-
  Here is an original case designed to meet your specifications:

  **The Scenario:**  
  Mrs. Rossi owns a sturdy wooden armchair with a reclining mechanism. One afternoon, she sits in it upright to read. After finishing her chapter, she pulls the lever: the chair's backrest smoothly descends to a 45-degree angle while its footrest simultaneously rises. No parts are added, removed, or replaced; every screw, spring, and splinter of wood remains wholly part of the chair throughout. The chair is now reclined, occupying a different spatial configuration while resting on the same spot on the floor.

  ---

  ### 1. **Verdicts & Reasoning**  
  - **Endurantism:** The *entire chair* is literally present at both moments (upright and reclined). When Mrs. Rossi pulls the lever, **the chair itself** undergoes change: its intrinsic spatial structure (the relative positions of its parts) alters. The subject of change is the identical, wholly present chair.  

  - **Perdurantism:** At each moment, only a *temporal part* of the chair is present. The upright temporal part (t₁) has one structure; the reclined temporal part (t₂) has another. The chair-as-a-whole (the 4D "worm") does not change; it merely has successive parts with different properties. To say "the chair changed" is shorthand for "earlier temporal parts had structure S₁, later parts have structure S₂." The literal subject of change at t₁ or t₂ is not the persisting chair but a momentary slice.  

  ### 2. **The Key Feature**  
  **Change in relational structure without part replacement.** The chair’s parts reorganize spatially, altering their *relative positions* while remaining the same parts in the same location.  

  ### 3. **Effect of Altering the Key Feature**  
  If the chair’s parts did *not* move relative to each other (e.g., it merely changed color when painted), the case collapses into a simple property-swap textbook example. If parts *were* replaced (e.g., a new backrest installed), it becomes Ship-of-Theseus-shaped. Removing structural change eliminates the asymmetry.  

  ### 4. **Perdurantist Reply and Cost**  
  **Attack:** A perdurantist might argue that temporal parts *can* be subjects of change—e.g., the t₁ part "changes" by being causally linked to the t₂ part via the lever-pull.  
  **Cost:** This redefines "change" from an alteration of an *enduring subject* to a causal relation between *distinct entities*. It abandons the intuitive notion that the chair *itself* is dynamic, treating persistence as a series of static snapshots. This sacrifices the directness of our ordinary understanding of objects undergoing change.  

  ### 5. **Specification Check**  
  ✅ **Agreement at surface:** Both views agree the chair persists.  
  ✅ **Ordinary situation:** Household object, mundane action.  
  ✅ **Exclusions met:** No part replacement, coincidence, or simple property swap.  
  ✅ **Asymmetry:** Perdurantism denies the chair itself changes; endurantism affirms it.  
  ✅ **No caricature:** Perdurantism’s problem arises from its core tenet that only temporal parts are momentary subjects.  
  ✅ **Verdicts from theories:** Follow from endurantism’s "wholly present" vs. perdurantism’s "part-present" commitments.  
  ⚠️ **One weakness:** The "structural change" element risks edging toward property-swap cases if misread. However, *relational* change (part positions) is distinct from *intrinsic* change (e.g., color), avoiding textbook overlap. No specification was bent; this is the minimal viable case given the constraints.  

  ---

  **Why This Works for Your Paper:**  
  Endurantism directly captures the intuition that *the chair* rearranges itself, while perdurantism must fragment this into a series of distinct stages. The cost to perdurantism isn’t technical inconsistency but a loss of fidelity to ordinary dynamic experience—which aligns with your claim that endurantism is the more sensible default for everyday objects.
