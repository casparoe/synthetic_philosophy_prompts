  - Plants: A fruit ripening on a tree? Still property change. 
  - Animals: A cat stretching? Too simple. 
  - Buildings: A house undergoing renovation? Risks Ship-of-Theseus territory. 

  Wait—what about spatial rearrangement? Perdurantism treats objects as spacetime worms, so how they occupy space at instants might cause trouble. Aha! An object being disassembled and reassembled in the same room. But "reassembly" risks duplication/fusion issues... 

  *Refinement:* 
  What if we avoid disassembly? Focus on an object that shifts its spatial configuration while maintaining continuity, like furniture being moved. But that's still just location change. 

  *Breakthrough:* 
  Combine two elements: 
  1) The object's parts relocate relative to each other while the whole remains 
  2) This happens without replacement or property alteration 

