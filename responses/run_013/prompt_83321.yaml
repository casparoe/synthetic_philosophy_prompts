  - Involve an ordinary scenario (no sci-fi elements)
  - Avoid classic tropes (Ship of Theseus, statue/clay, property swaps)
  - Make perdurantism look worse in a non-caricatured way
  - Be compact (one paragraph)
  - Generate verdicts organically from each theory

  Hmm... the asymmetry requirement is tricky. Perdurantism must stumble on an ordinary truth without being misrepresented. What ordinary situations involve persistence but challenge temporal parts? 

