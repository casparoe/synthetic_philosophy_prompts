     Engineering rendering: Consciousness is not an additional authoritative state or independent source of truth; it is entirely a product of the system's information processing (like a materialized view derived from the primary database).
     Fidelity: distorted. We fudged by equating "fact" with "authoritative state". The residue is the metaphysical claim that there are no non-physical properties.

