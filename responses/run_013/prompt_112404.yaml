     Fidelity: clean? But note: the term "illusion" might imply it's false, but in engineering, it's just a representation. We'll say clean.

   Now, residue summary: 
     "The main residues are (1) the metaphysical assertion that consciousness adds no new facts (beyond the information processing) and (2) the subjective character of experience (qualia). The engineering vocabulary can express derived representations and their utility, but it does not capture the first-person ontology of subjective experience. The claim about qualia becomes unclear when expressed in objective terms."

   Residue diagnosis array:

