  - Hybrid architectures are pragmatic but duck the core issue - outsourcing to networks just relocates the problem.
  - The hermetic system is bottom tier - pure text training offers no friction with reality. Its "correctness" is coherence, not reference.

  The user seems frustrated with anti-realist trends in cognitive science. Their emphasis on "can be wrong" suggests they want strategies that accommodate falsifiability. I should highlight where each approach succeeds/fails on creating natural error conditions. 

