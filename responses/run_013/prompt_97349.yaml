prompt: |-
  I somehow let myself get volunteered to run next month's discussion night at my local arts centre's book club — we've just read Tolstoy's What Is Art?, I'm the one who proposed it, and now I have to lead it. The crowd is sharp but not academic: a couple of painters, a retired schoolteacher, a guy from the amateur theatre group. Their default is that art is self-expression and that anyone who calls a work bad because it's immoral is either a censor or a philistine, and I definately half-agree, which is exactly why Tolstoy is such a good grenade to roll into the room. Don't explain his position to me, I've read the book — plan how I should explain it to them in one 45-minute session.

  What has to come first so that his verdict (that most of what they love, including his own big novels, doesn't really count as art) lands as an argument and not just as a stunt? Which single example should carry the whole thing, what does that example need, and what would wreck it? I keep worrying that if I reach for some obvious moral horror they'll just shrug and say well obviously that's not good, which proves nothing — so tell me what to use instead. Then the misconceptions, in the order they'll actually form as I talk: I'm predicting "so he's just a moralist / censor", "he means art has to be uplifting", "he's saying the artist's intentions are what matter", and "he's only being a contrarian about his own books" — where in the sequence each one has to be headed off, and what I should openly refuse to go into at this level. And finish with one question I can put to the room at the end that tells me whether they've actually got his criterion, or just enjoyed watching the demolition.
reasoning: |-
  Okay, the user needs to lead a book club discussion on Tolstoy's "What Is Art?" and wants a solid plan. Let me start by understanding their main concerns. They’re dealing with a group that sees art as self-expression and might dismiss moral critiques as censorship. Tolstoy's view that most beloved works aren't true art will be provocative, so the challenge is to present it as a serious argument, not a stunt.

  First, I need to establish Tolstoy's definition of art. The key is infectiousness based on sincerity. Without that foundation, the moral part won't make sense. The user mentioned using an example that isn't an obvious moral horror to avoid dismissal. Maybe choosing something like Beethoven? But the group might see it as elitist. A sentimental painting could work better—kitsch art that’s emotionally manipulative but insincere. Rossetti's "Beata Beatrix" might fit—beautiful but possibly empty sentiment. That example needs to show lack of sincerity without moral judgment, so the group can’t just say it's immoral and dismiss it.

  Next, misconceptions. The user listed four: moralist/censor, uplifting art, artist's intentions matter, contrarian about his own work. I should address these in order as they come up. After defining infection, someone might think Tolstoy is just imposing morals. Clarify that morality here is about universal feelings, not rules. Then, when discussing bad art, they might think he wants uplifting messages. Emphasize that it’s about genuine emotional connection, not positivity. When talking about sincerity, they could confuse it with intentions. Stress that it's the artwork's effect, not the artist's plan. Finally, his rejection of his novels might seem like contrarianism, but it’s consistency with his criteria.

  For structure, start with the group's existing belief (art as self-expression), then introduce Tolstoy's infection as the core. Use the example to illustrate sincerity, then layer in morality as universality. Avoid diving into his religious views or later life to keep focused. End with a question testing their grasp: why a universally loved work (like a folk song) fails if it’s insincere.

  The closing question needs to check if they understand sincerity and universality together. Maybe ask why a technically perfect but insincere piece isn’t art by Tolstoy’s standards. That forces them to apply both criteria. 

  I should also consider timing—45 minutes is tight. Allocate time for each section: intro (5 mins), infection (15), example (10), morality (5), misconceptions (5), discussion (15). Keep explanations concise, use the example effectively, and preempt misunderstandings quickly. The user’s goal is to provoke thought without losing the group, so balance is key.
answer: |-
  Here’s a battle-tested 45-minute plan designed to make Tolstoy’s provocation land as philosophy, not performance art. The goal is to force engagement with his **core criterion** ("infectious sincerity channeling universal human feeling") before the moral bomb drops.

  **The Core Sequence (30 mins):**

  1.  **Start With *Their* Default (5 mins):**
      *   "Before we dive into Tolstoy, let’s ground ourselves: What’s a piece of art (any medium) you personally love, and what does it *do* for you? What feeling or idea does it express?" (Quick popcorn answers - establishes self-expression baseline).
      *   Summarize: "So, art as powerful, personal expression – that resonates. Tolstoy starts somewhere *very* different..."

  2.  **Define "Infection" – The Non-Negotiable Foundation (10 mins):**
      *   ***Crucial First Step:*** Isolate and emphasize **INFECTION** as the *absolute bedrock* of Tolstoy's definition. "Forget 'good' or 'bad' for a moment. Tolstoy says something is ONLY art if it **infects** the receiver with the feeling the artist experienced. Not describes it, not depicts it – *transmits* it, like a virus. You *feel* what they felt."
      *   **Key Ingredient:** **SINCERITY.** "The artist *must* have genuinely felt it themselves. No faking. If they’re performing emotion or chasing trends, no infection happens. It’s dead on arrival." (Hammer this: Sincerity enables infection).
      *   *Preempt Misconception #1 ("He's just a moralist"):* Explicitly state: "Notice – *no morality yet*. Just: Did a real feeling get transmitted? Yes = Art. No = Not Art. Period."

  3.  **The Pivotal Example: Sentimental Kitsch (10 mins)**
      *   ***The Example: Dante Gabriel Rossetti's "Beata Beatrix"*** (or similar late Romantic/Pre-Raphaelite overly sentimental, aesthetically polished work).
      *   ***Why it Works:***
          *   **Aesthetically Pleasing/Technically Skilled:** They can't dismiss it as ugly or incompetent.
          *   **Ostensibly "Emotional":** It *looks* deeply feeling (love, loss, transcendence).
          *   **Likely Hollow/Performative:** Critiques often cite its staged, theatrical, self-conscious sentimentality – perfect for questioning *sincerity*. *"Does this transmit a genuine, deep feeling of grief/love, or is it beautifully playing dress-up with emotion?"*
      *   ***What it Needs:***
          *   A visual projection (crucial!). Let them *see* the beauty.
          *   Framing: "Tolstoy would ask: Is the artist *infected* by a real feeling here, or are they expertly crafting a *representation* of what they think deep feeling *looks like*? Does it infect *you* with raw grief/love, or do you admire the *picture* of grief/love?"
      *   ***What Wrecks It:***
          *   Choosing something morally reprehensible (e.g., Nazi propaganda). They dismiss it on morals, skipping the sincerity/infection test.
          *   Choosing something they find genuinely ugly/bad *aesthetically*. They agree it's "bad art," missing Tolstoy's point about *category*.
          *   Not pushing the sincerity question hard enough. Ask: "Does this feel *true*, or does it feel *manufactured* to be profound?"

  4.  **Layer in Morality as *Universality* (5 mins):**
      *   NOW introduce morality: "Tolstoy adds a second layer *only after something passes the infection/sincerity test*. True Art must transmit feelings **accessible to *all* people** – Christian love, basic human joys/sorrows, not elite or decadent feelings."
      *   **Connect to Infection:** "Why universality? Because if the feeling isn't universally understandable, the infection *can't spread* to everyone. It fails the infection test on a global scale."
      *   *Preempt Misconception #2 ("Art has to be uplifting"):* "It's not about happy endings! Universal feelings include profound grief, righteous anger, the weariness of labour – *if* sincerely felt and transmitted. Sentimental kitsch fails *before* this step (insincere). A cynical, exclusive feeling fails *here* (not universal)."
      *   *Preempt Misconception #3 ("Artist's intentions matter"):* "Tolstoy cares about the *artwork's effect* (does it infect?), not the artist's stated goal. The artist might *intend* sincerity but fail to transmit it (bad craft). Or transmit something universal unintentionally!"

  **Addressing His Self-Critique & Wrap-Up (5 mins):**

  *   **"Why disown *War and Peace*?" (1 min):** "Because he judged his own work *by this standard*. He saw it as complex, elite, focused on historical details and aristocratic feelings – failing the universality test *despite* (maybe) passing sincerity for *some* feelings. It’s consistency, not contrariness."
      *   *Preempt Misconception #4 ("He's only being a contrarian"):* Frame it as applying the same brutal standard to himself.
  *   **What We *Won't* Dive Into (1 min):** "We're focusing on his core *criterion* tonight. We *won't* dissect his specific religious views, his later life, or debate every artwork he condemns (Shakespeare, Beethoven, Wagner). The question is: Does his definition of *what art fundamentally IS* hold water?"

  **The Litmus Test Question (Final 10 mins for Discussion Seed):**

  > **"Tolstoy would likely dismiss a technically perfect, beautiful landscape painting if he felt the artist painted it *only* to demonstrate skill or please a wealthy patron, not because they were genuinely overwhelmed by the feeling of that place. By his definition, why would this *not* be art? And does this distinction resonate or frustrate you?"**

  *   ***Why this question tests understanding:***
      1.  It hinges on **sincerity** (lack of genuine feeling).
      2.  It separates **technical skill/aesthetic pleasure** from **artistic infection**.
      3.  It uses a **non-morally-charged example** (avoiding the "obvious horror" trap).
      4.  It forces them to articulate his core criterion (no infection due to insincerity).
      5.  It prompts personal reaction to the definition itself.

  **Key Execution Notes:**

  *   **Pace Ruthlessly:** 45 mins flies. Stick to the timeline.
  *   **Visuals are Non-Negotiable:** Have the Rossetti (or chosen example) image ready.
  *   **Emphasize Key Terms:** Write "INFECTION," "SINCERITY," "UNIVERSAL FEELING" where visible.
  *   **Steer Discussion:** If they jump to morals early, gently but firmly bring them back to infection/sincerity: "But first, *could* it infect, if it were sincere?"
  *   **Validate Their Default (Briefly):** Acknowledge their self-expression view is valid *for other definitions*, but Tolstoy is proposing a very specific, demanding one.
  *   **Embrace the Tension:** Don't shy away from the discomfort his verdict creates. That's the productive energy.

  This structure forces the group to grapple with Tolstoy's radical redefinition of art's *essence* before the moral implications fully hit. By making sincerity the gatekeeper and using a beautiful-but-potentially-hollow example, you prevent easy dismissal and make the universality requirement feel like a consequence of infection, not just moralizing. The closing question reveals if they grasped the mechanics of his definition. Good luck – it’s a grenade, but primed correctly, it’ll spark brilliant fire!
