answer: |-
  ### Teaching Plan for Molyneux's Problem Seminar

  #### **Core Pedagogical Goals**
  - Ensure students grasp the **epistemological and perceptual stakes** (not just "object recognition").
  - Use **Reid's partial answer** to disrupt binary thinking.
  - **Integrate modern challenges** (sensory substitution/ML) without derailing the philosophical core.
  - **Omit distance** to avoid diluting the shape question.

  ---

  ### **Detailed Sequence (90 Minutes Total)**
  *(Timings are approximate; adjust for discussion depth)*

  1. **Hook & Frame: The Problem’s Anatomy (10 mins)**  
     - **Start with Islamic color version**: "A man blind from birth knows red and blue by names/touch. Given sight, can he visually identify which is red without touching?"  
     - **Why now?** Isolates the core issue (cross-modal transfer) without geometry. Quickly reveals that *naming ≠ perceptual recognition*.  
     - **Defuse misconception**: "This is about language, not perception." → Clarify: The question is whether sensory modalities share *intrinsic qualitative content*.

  2. **Core Formulation: Locke’s Cube/Sphere (20 mins)**  
     - **Present stripped version** (no distance): "Born blind man knows cube/sphere by touch. Upon sight restoration, can he visually distinguish them *without touching*?"  
     - **Carrying case**: **Cube vs. sphere**  
       - *Must have*: Minimal shape contrast (no texture/size/color differences), no prior visual exposure, immediate test post-sight.  
       - *Must lack*: Any cues enabling inference (e.g., shadows, motion, verbal hints).  
     - **Why this case?** Maximally ambiguous: Spheres/cubes project infinitely variable retinal images. Forces confrontation with *whether touch and sight share a common "shape" representation*.  
     - **Defuse misconception**: "This is just about associating labels." → Stress: It’s about *spontaneous recognition*, not learned association.

  3. **Commit & Reveal: Historical Answers (15 mins)**  
     - **Poll students**: "Yes/no? Why?" Record binary answers.  
     - **Reveal Reid’s partial answer**: "2D shapes (circle/square) are recognizable immediately; 3D solids (cube/sphere) are not."  
     - **Why here?** Forces students to confront their assumptions. Reid’s distinction (*contour* vs. *depth*) preempts oversimplification and segues into modality-specificity.

  4. **Deep Dive: Why Shape Isn’t Trivial (15 mins)**  
     - **Key argument**: Sight encodes 2D projections; touch encodes 3D volumetric properties. Is "shape" amodal?  
     - **Whiteboard**: Contrast tactile exploration (sequential) vs. visual gestalt (simultaneous).  
     - **Defuse misconception**: "Vision and touch both sense ‘extension’ (Descartes)." → Argue: Extension ≠ spatial *structure*. Berkeley’s point: Touch teaches *resistance*, not light patterns.

  5. **Modern Challenges: Sensory Substitution & ML (20 mins)**  
     - **Slot here** (after historical grounding):  
       - *Sensory substitution*: "Does a tongue-display user ‘see’? If they pass the test, is Molyneux solved?" → Argue: Substitution *trains* cross-modal mapping; it doesn’t address *innate* transfer. The blind user isn’t "newly sighted."  
       - *ML perspective*: "Cross-modal alignment via embeddings solves this." → Counter: ML relies on learned correlations; Molyneux asks if *zero-shot* transfer is possible. Distinguish *learning* vs. *innate capacities*.  
     - **Why here?** Students now see the problem’s stakes (nativism vs. empiricism) and can engage critically.

  6. **Synthesis & Check Question (10 mins)**  
     - **Check question**: **"If the man *fails* the cube/sphere test but *passes* the circle/square test, what does this tell us about the relationship between touch and vision?"**  
       - *Tests understanding*: Forces distinction between 2D/3D encoding (Reid) and rules out "all-or-nothing" answers. Reveals grasp of modality-specific constraints.

  ---

  ### **Carrying Case: Cube vs. Sphere**
  - **Must have**:  
    - Purely geometric distinction (no secondary cues).  
    - Asymmetric complexity: Sphere’s uniform curvature vs. cube’s edges/corners.  
  - **Must lack**:  
    - Any affordance for inference (e.g., cubes don’t roll; spheres do).  
    - Context (e.g., "a die" vs. "a ball") that triggers object memory.  
  - **Why not replace?** Simpler shapes (e.g., cube vs. pyramid) introduce asymmetric difficulty. More complex shapes (e.g., dodecahedron) overcomplicate. *Cube/sphere is the "Goldilocks" case*.

  ---

  ### **Misconceptions & Defusal Points**
  | Misconception | Where Defused | Defusal Strategy |
  |---------------|--------------|------------------|
  | "This is about naming objects." | Step 1 (Islamic warm-up) | Contrast perceptual recognition vs. verbal labels using color case. |
  | "Vision/touch both perceive ‘space,’ so transfer is automatic." | Step 4 (Shape isn’t trivial) | Berkeley’s argument: Touch encodes resistance; vision encodes light. |
  | "Empirical studies (e.g., cataract patients) solve this." | Step 5 (Modern challenges) | Note confounding factors: Partial vision, testing delays, and learning. |
  | "ML/sensory substitution answers Molyneux." | Step 5 (Modern challenges) | Distinguish *innate capacities* from *learned mappings*. |
  | "The answer is binary (yes/no)." | Step 3 (Reid’s reveal) | Introduce 2D vs. 3D distinction to fracture binary framing. |

  ---

  ### **Omitted Elements & Why**
  - **Distance question** (from original letter): Omitted. **Explicitly state**: "We’re bracketing distance to isolate shape recognition. Distance conflates spatial perception with object geometry, risking object-recognition misunderstandings."  
  - **Empirical data**: Mention cataract studies only to note their limitations (e.g., delayed testing). Focus on conceptual, not empirical, resolution.  
  - **Leibniz’s rationalism**: Too niche for 90 mins; distracts from Reid’s more accessible partial answer.

  ---

  ### **Least Confident Step**
  - **Step 5 (Modern Challenges)**:  
    - **Why?** Risk of ML/sensory-substitution debates consuming time without resolving philosophy-specific stakes.  
    - **Mitigation**: Strictly time-box (20 mins). Pre-script rebuttals: "This addresses *how* cross-modal alignment *can* happen, not whether it’s *innate*."  
    - **Confidence in overall plan**: 8/10. Steps 1–4 are tight; Step 5 is the pivot but most vulnerable to digression.

  ---

