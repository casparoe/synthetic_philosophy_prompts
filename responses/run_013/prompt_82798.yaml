  The community is divided: senior practitioners take it to the extreme where even the desire to end craving is problematic, while others feel this denies the kindness and fear-reduction they've experienced. The talk must navigate this without alienating anyone, while honoring farewell sentiments without promising future benefits.

  Key constraints are fascinating: no promises of future states, no rewards for practice, no better selves, no dodging the self-consuming nature of the doctrine. Yet it must feel warm and substantial for both long-time students and new attendees hoping to be "fixed." 

  The emotional layers are complex - this is a goodbye to people who've sat with them for 15 years, some arriving just this week. The board also wants a funding appeal that's honest about the center's needs without implying donors get anything in return. 

  I need to craft something that: 
