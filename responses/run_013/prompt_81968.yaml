prompt: |-
  I'm a novelist — four books, the last one did okay — and I'm about a third of the way into a new one that keeps breaking on me for a reason I've finally figured out is philosophical and not craft. Setup: two timelines, one woman, Anna, and the split happens before she's born. In one, her mother marries the man she actually married; in the other she marries his brother (long story, it's the seventies, there's a lake). I want the reader to feel it's the same woman in both timelines — same memories of the lake, same fear of boats — and the whole structure depends on that. Then somebody at my writing group said, well, if her mother married the brother, that's a different sperm and a different egg, so it isn't her at all, and I've been stuck for six weeks.

  I know there's a real philosophical thing here — the Kripke business about how you couldn't have come from a different sperm and egg, and the Lewis counterpart thing where "could have" isn't identity at all. I definately don't need the history of it, and please don't send me to a book. What I need is a procedure I can actually run on a Sunday night in about twenty minutes, on any backstory change I'm considering for any character in the book. A checklist with an order: what to ask first, what counts as a sufficient answer to each question, where the thing just stops and says no, and where it stops and says this isn't a fact question, you're the author, decide it and then be consistent about it. One page, because my editor is the one who'll end up reading it over my shoulder.

  Stuff it has to handle, because these are the ones I keep circling:

  - Anna's timeline-B origin: same mother, different father, so different sperm and egg.
  - The neighbor kid, where I want a switched-at-birth thing: same two gametes, raised by different people. My gut says that one's fine and Anna's isn't, and I couldn't tell you why.
  - The one that really scares me: Anna has a twin in one timeline. Same egg, same sperm, the thing split. If origin is what makes you you, the procedure had better not tell me Anna and her twin are the same person.

  There's also a version where the embryo gets carried by the mother's sister, and I've read enough to know people now do the three-parent mitochondria thing, and I can't tell if any of that touches identity or just the body. If the procedure has a clause for it, great; if it just has to say outside my jurisdiction, say that.

  Tell me where the procedure is doing real work and where it's just me making an aesthetic call with extra steps, and work the three cases — including whichever one I won't like, don't soften it. And tell me what the procedure can't do; I'd rather know the edges than get a false green light. Last line should start with "Verdict:" and be one sentence on whether my central premise — same woman, two timelines, different fathers — survives as written.
reasoning: |-
  Okay, the user is a novelist struggling with a philosophical problem in their book. They have two timelines for the same character, Anna, but in one timeline her mother marries a different man, meaning Anna would come from a different sperm and egg. Their writing group pointed out that this makes Anna a different person, which undermines the core premise that it's the same woman in both timelines. They need a practical checklist to evaluate backstory changes quickly, without getting bogged down in philosophy.

  The user has specific cases to test: Anna's different father (different sperm/egg), a switched-at-birth scenario (same biological parents, different upbringing), and a twin scenario (same sperm/egg but split embryo). They also mention surrogacy and mitochondrial donors, though those seem less urgent. The key is to give them a clear, actionable tool that distinguishes when identity is compromised versus when it's an authorial choice.

  Hmm, the user is clearly knowledgeable—they mention Kripke and Lewis—but they want to avoid academic deep dives. They need something pragmatic for Sunday night edits. Their frustration is palpable; they've been stuck for six weeks. The emotional stakes are high because the entire novel structure hinges on Anna being the same person across timelines. They also worry about the twin case—if the procedure says twins are the same person, that's unacceptable.

  The checklist must handle three things: 1) What absolutely breaks identity (non-negotiable philosophical boundaries), 2) Where the author decides (aesthetic calls), and 3) Clear verdicts with no false positives. The neighbor kid scenario (same biology, different parents) should pass because biology is intact, while Anna’s case fails because origin defines identity. The twin case needs to emphatically reject identity—twins aren’t the same person. Surrogacy and mitochondria are bodily, not identity issues, so they’re safe.  

  For the procedure, I'll structure it as a flowchart: Start with "Changed gametes?" If yes, identity is broken. If no, then "Changed biology?" (like twinning) breaks identity. Everything else—environment, beliefs, memories—is authorial choice. Cases: Anna fails (gametes changed). Neighbor kid passes (gametes same, biology same). Twin fails (biology changed via twinning). Surrogacy/mitochondria are fine (biology same).  

  The verdict has to be blunt: Anna’s premise doesn’t work as written. That’ll hurt, but they asked not to soften it. The procedure’s limits are clear—it can’t override gamete/origin changes. They’ll need to adjust: either make the brothers identical twins (same sperm) or ditch the "same person" claim and lean into counterpart theory (different people with eerie parallels).  

  Lastly, the tone must respect their expertise—no hand-holding, just efficient, writer-to-writer tools. They’ll appreciate the honesty.
answer: |-
  Here’s your 20-minute Sunday Night Identity Protocol (SNIP). Keep it taped to your monitor. **Bold** = critical question. *Italics* = your call.

  ---

  ### **The SNIP Checklist (Run in Order)**
  1. **DID THE CHANGE ALTER THE SPECIFIC SPERM AND EGG THAT CREATED THIS PERSON?**  
     - *Sufficient "No"*: Gametes identical. Proceed to Q2.  
     - *Sufficient "Yes"*: **STOP. Identity broken.** Different biological origin = different person. No override.  
     - *Gray Area*: None. Gametes are the anchor.

  2. **DID THE CHANGE ALTER THE BIOLOGICAL BLUEPRINT *AFTER* FERTILIZATION?**  
     - *Sufficient "No"*: Fetal development identical. Proceed to Q3.  
     - *Sufficient "Yes"* (e.g., embryo split into twins, genetic editing): **STOP. Identity broken.** Same gametes ≠ same person if biology diverges post-conception.  
     - *Gray Area*: Mitochondrial donors/surrogacy (carrier ≠ genetic source). *Proceed to Q3.* These affect the body/environment, not core genetic identity.

  3. **IS THE CHARACTER’S "SELF" DEFINED BY BIOLOGY OR BY EXPERIENCE/MEMORY?**  
     - *This is your aesthetic call.* SNIP only guarantees biological identity survives Q1-Q2. Now decide:  
       - If biology is sovereign (Q1-Q2 passed), identical memories are plausible.  
       - If biology failed (Q1-Q2 "STOP"), identical memories are *your fictional choice* (e.g., "soul resonance," multiverse glitch). **You must enforce consistency.** No half-measures.

  ---

  ### **Worked Cases**
  - **Anna (Timeline B: Different Father)**  
    Q1: **YES** (different sperm).  
    **VERDICT: STOP. Identity broken.** Not the same woman biologically. *Fix:* Either make brothers identical twins (same sperm potential) or embrace "counterpart theory" (two different Annas with eerie parallels).  

  - **Neighbor Kid (Switched at Birth)**  
    Q1: NO (same sperm/egg). Q2: NO (no biological change). Q3: *Your call.* SNIP greenlights biological identity. Memories/personality differences are environmental—no identity conflict.  

  - **Anna’s Twin**  
    Q1: NO (same sperm/egg). Q2: **YES** (embryo split → distinct biology).  
    **VERDICT: STOP. Identity broken.** Anna and her twin are biologically different people. Full stop.  

  - **Surrogacy/Mitochondria**  
    Q1: NO (same sperm/egg). Q2: NO (genetic blueprint unchanged). Q3: *Your call.* Body/environment differs, but core identity intact. Proceed.  

  ---

  ### **Where SNIP Does Real Work**  
  - **Q1-Q2** are non-negotiable biology. They prevent metaphysical impossibilities (e.g., "you" from different parents).  
  - **Q3** is you making art. SNIP just forces you to *own* the choice and maintain rigor.  

  ### **Limits**  
  - SNIP **cannot** salvage biological identity if gametes or post-conception biology change.  
  - SNIP **cannot** define "soul" or "essence"—only the physical basis for identity.  
  - SNIP **cannot** resolve paradoxes (e.g., "What if the brother’s sperm carried identical DNA?"). If you write that, Q1 passes.  

  ---

  **Verdict:** Your central premise—*same woman*, different fathers—**fails biologically**; SNIP demands you rework the origin or reframe the timelines as parallels, not alternates.
