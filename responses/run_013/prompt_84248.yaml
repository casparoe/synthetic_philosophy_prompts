prompt: |-
  I'm teaching the Galileo unit in an upper-level science-and-religion seminar for the first time — sixteen students, mostly juniors and seniors in philosophy and history, one seventy-five-minute session — and I want to build the whole session around an activity rather than a lecture, because my students can already recite the standard line about Galileo and scripture without having any feel for why it convinced anyone or why anyone resisted it. The line runs roughly like this: scripture and nature both come from God and so cannot contradict each other; scripture was written for the salvation of everyone, including the uneducated, and therefore speaks in the language of ordinary experience and accommodates itself to its first audience, the way it attributes hands to God or lists the moon among the great lights of the sky; so when a genuine demonstration about the natural world conflicts with a literal reading, the fault lies in our interpretation rather than in the text or in nature. I find this compelling, but a theologian I know says it is a machine for reinterpreting anything you dislike, and that once you have it you can never lose an argument against a text — you only ever lose the argument about what counts as a demonstration. I want students to run into both halves of that themselves, in the order in which they actually bite, and I want no lecture up front. Please design the activity, with rules, roles, materials, a timeline for the seventy-five minutes, a debrief that maps what happened onto the philosophical moves, an honest account of what will predictably go wrong the first time I run it, and a frank note on what the activity cannot reproduce and I will have to supply myself. One constraint on the materials: build the game so that nothing in it depends on a verbatim quotation — write passage summaries in your own words and, if you want any real text in the room, say only that I should take it from a checked edition rather than supplying it.

  The activity I have in mind, which you should feel free to redesign if you can make the trap tighter, runs in three phases. Phase one, about ten minutes, no framing: each student gets a slip with one sentence about the world written the way an ordinary person would say it — the sun rose at 6:14 this morning, the table is solid, the wind off the water is cold, the sky is blue at noon. In pairs they decide which of the sentences are false. They will mostly say none are; when I press them to apply a strict standard they will say all of them are, more or less, and that gets the accommodation point out of them without my having to state it: ordinary language is not defective physics, it is language pitched to use. Phase two, the bulk of the session, is a staged council. Assign roles: two Advocates, one for each of two petitions; a Guardian of the plain sense, who must argue from the text's availability to people who will never read a commentary; a Printer, who must argue from what a cheap pamphlet will make of our decision twenty years from now; an Assessor, who must certify in a single sentence whether the dossier before the council contains a demonstration or only a probable opinion; a standing Dissenter, whose job is to argue for the reading the council is about to abandon; and the rest as voters. After each petition the Assessor's one sentence goes up on the wall as the criterion the council used, and that sentence binds every later decision — I read it aloud before the third vote, because the third petition is designed to be covered by it. The three petitions each cite a passage that seems to say something about the natural world and ask for a licensed non-literal reading: first, that the moon is not a light of its own but shines by borrowed light, with the demonstration available in the room using a lamp, a ball and a dark corner; second, a claim about the tides, presented as the strongest physical proof that the earth moves, with a dossier that is genuinely impressive — correlations, a mechanism, an explanation of why the effect varies with season and latitude — which the council cannot actually assess and which was in fact wrong, the real cause being the differential pull of moon and sun; third, a crank petition with the same logical shape as the first, submitted by someone who has read the posted criterion and demands to be covered by it, arguing that the moon is a mirror and that by the council's own reasoning every apparent source of light is a reflection of a source further out, so the scriptural language of lights must be read as a figure for reflection all the way down. Before each vote, everyone privately writes on a slip whether they would stake their own name on the dossier's being a demonstration; I collect the slips unread and reveal only the count at the end of the debrief.

  The debrief should work by mapping moments rather than by summarizing the history. The slip exercise maps onto accommodation and onto why it is a claim about the purpose of the text rather than a dodge. The posted criterion maps onto the fact that the license to reinterpret is conditional, and that the condition — demonstration, not probability — is doing all the work. The second petition maps onto the objection Bellarmine pressed against Galileo's ally Foscarini, that a reinterpretation is licensed only by a true demonstration and never by a probable opinion, and the wager slips make the cost of that visible: a room that voted to license will typically contain a majority who privately would not stake their name on the dossier, which is exactly the asymmetry Bellarmine was pointing at, since the church pays for a wrong reinterpretation in authority and the philosopher does not. The third petition maps onto the arbitrariness worry: either the council narrows its criterion after the fact, which looks ad hoc, or it accepts the mirror regress, and either way the students discover that a rule generous enough to do the work they wanted in petition one is generous enough to cover the crank. Tell me what will predictably go wrong the first time: my guess is that they will smell the trap in petition one and treat it as a puzzle instead of a case, that the Guardian and the Printer will be played as villains and the Advocates as heroes, flattening a real dispute into a morality play, that someone will know the tides story and spoil petition two unless the dossier is kept anonymous and presented as a period document, that early votes will go unanimous and nobody will want to be the one to reverse, so the Dissenter needs to speak before each vote and I should take a straw poll before discussion rather than after, and that the debrief will overrun, so I should cut discussion of the third petition rather than cut the debrief. Then be candid about the limits. The activity cannot reproduce the actual epistemic position of 1615, because I have calibrated the dossiers and the students know there is an answer; it can only gesture at the institutional stakes of patronage, the Index and the Inquisition; and it cannot show that the plain-sense reading was itself a historically contingent interpretive practice rather than the obvious default, nor that the letter to the Grand Duchess Christina is a piece of advocacy written under pressure rather than a neutral statement of method. I will have to supply the astronomy, the institutional history, and the reminder that the demonstrative status of Copernicanism was genuinely unsettled in the period, and I will have to keep the debrief from collapsing into the comfortable story that the church was simply anti-science — which is the reading this game will most naturally produce in a modern classroom, and therefore the one I most need it to complicate.
reasoning: |-
  We are designing a 75-minute activity for an upper-level seminar on Galileo and the relationship between science and religion. The goal is to have students experience the tension between interpreting scripture and accommodating scientific discoveries, specifically the idea that scripture accommodates ordinary language and that reinterpretation is only justified by demonstrations (not mere probabilities). The activity should avoid upfront lecture and instead have students discover the key concepts through participation.

  The activity you outlined is a strong starting point. I will refine it to make the "trap" tighter and address the predictable pitfalls you mentioned. Key improvements:
  - To avoid students treating the first phase as a puzzle, we will frame it as a warm-up without revealing its connection to the main activity.
  - To prevent the roles from being flattened into heroes/villains, we will provide role cards that emphasize the principled reasons behind each position.
  - To handle the tides issue, we will anonymize the second petition and present it as "Petition B" without naming Galileo or the tides specifically.
  - To encourage debate and avoid unanimous votes, we will have the Dissenter speak first and take a non-binding straw poll before discussion.
  - To manage time, we will strictly enforce time limits and cut discussion of the third petition if needed, focusing the debrief on the first two petitions and the slip exercise.

  **Activity Title:** The Council of Interpretation

  **Materials:**
  1. **Slips for Phase 1 (Ordinary Language):** 16 slips, each with one sentence (see list below).
  2. **Role Cards:** For 16 students: 
     - Advocate A (for Petition A: moon's reflected light)
     - Advocate B (for Petition B: earth's motion and tides)
     - Advocate C (for Petition C: moon as mirror)
     - Guardian of the Plain Sense
     - Printer
     - Assessor
     - Dissenter
     - 9 Voters (with instructions to listen and vote based on the arguments and the Assessor's criterion)
  3. **Petition Dossiers:** Three packets (A, B, C) for the Advocates to present. Each dossier includes:
     - A summary of the scriptural passage in question (in your own words, avoiding verbatim quotes).
     - A summary of the proposed non-literal reading.
     - A summary of the evidence (demonstration or argument).
  4. **Demonstration Setup for Petition A:** A lamp, a ball, and a way to dim the lights (to show that the ball shines only when the lamp lights it).
  5. **Board or Poster Paper:** To post the Assessor's criterion after each petition.
  6. **Slips for Voting and Private Wagers:** Small slips for the two activities: (1) the initial straw poll, (2) the final vote, and (3) the private wager (whether they would stake their name on the dossier being a demonstration).
  7. **Timer:** To keep each segment to time.

  **Phase 1: Ordinary Language (10 minutes)**
  - **Goal:** Elicit the idea that ordinary language is not meant to be scientifically precise but is accommodated to common experience.
  - **Steps:**
    1. Distribute one slip per student (each slip has one sentence). Examples:
       - "The sun rose at 6:14 this morning."
       - "This table is solid."
       - "The wind off the lake is cold."
       - "The sky is blue at noon."
       - "The moon shines brightly tonight."
       - "The ground is perfectly flat in the valley."
       - "The stars are tiny points of light."
    2. Have students pair up (2 minutes) to discuss: "Which of these sentences are false? Why?"
    3. Whole-class share (8 minutes): 
       - Ask a few pairs to report. Most will say none are false in ordinary terms. 
       - Press: "But are they strictly true? Consider what we know from science." 
       - Students will likely say all are technically false (e.g., the sun doesn't rise; the table is mostly empty space). 
       - Guide them to the insight: These sentences are not lies; they are how we talk about the world in everyday life. They are "true enough" for practical purposes. 
       - **Do not** connect this to scripture yet. Just note the point and move on.

  **Phase 2: Council of Interpretation (55 minutes)**
  - **Setup:** Assign roles randomly (or strategically if you know the students). Give each role player a card explaining their role and their goal. The 9 voters are the council members who will decide. The Advocates, Guardian, Printer, Assessor, and Dissenter are non-voting participants (except the Dissenter, who is also a voter? Clarify: only the 9 voters vote; others have speaking roles). The Dissenter is one of the voters but has a special speaking role.
    
  - **Roles Explained (on cards):**
    - **Advocate (A, B, C):** Your job is to argue for the petition. Present the scriptural passage, the proposed non-literal reading, and the evidence. You must convince the council that there is a demonstration (not just a probable opinion) that forces us to reinterpret scripture.
    - **Guardian of the Plain Sense:** You defend the literal meaning of scripture. Your argument: Scripture must be accessible to all people, including the uneducated. If we reinterpret every time a new theory appears, we risk making scripture meaningless to ordinary people and undermining its authority. Also, the literal sense has been held by the faithful for centuries.
    - **Printer:** You are concerned about how this decision will be communicated in cheap pamphlets 20 years from now. Will it cause confusion? Will it be twisted by radicals? You worry about the social and political effects of reinterpretation. You must argue that any change must be clear and not open to dangerous misinterpretations.
    - **Assessor:** You are an expert in natural philosophy. After hearing the evidence for each petition, you must write one sentence that states whether the evidence constitutes a demonstration (i.e., a conclusive proof) or only a probable opinion. Your sentence will be posted and become the binding criterion for future petitions.
    - **Dissenter:** You are a member of the council (voter) who must argue against the petition at hand. You are not against science, but you are skeptical of reinterpreting scripture without absolute proof. You must speak before the vote to challenge the Advocate and remind the council of the risks.
    - **Voters (9):** You are members of the council. You must listen to the arguments and vote on whether to grant the petition (allowing the non-literal reading). Consider the arguments of the Advocate, the Guardian, the Printer, the Dissenter, and the Assessor's criterion (once it is set). You are responsible for the long-term integrity of both scripture and natural philosophy.

  - **Rules of the Council:**
    1. Each petition is heard in order (A, B, C). 
    2. For each petition:
       a. **Straw Poll (1 min):** Voters write on a slip: "Grant" or "Deny" (non-binding, to gauge initial leanings).
       b. **Presentation (3 min):** Advocate presents the petition.
       c. **Arguments (2 min each):** Guardian, Printer, Dissenter, and Advocate (rebuttal) speak in that order. The Assessor listens but does not speak until the end.
       d. **Assessor's Sentence (1 min):** The Assessor writes one sentence and reads it aloud. It is posted on the board.
       e. **Discussion (3 min):** Open floor for voters to ask questions or debate.
       f. **Final Vote (1 min):** Voters write "Grant" or "Deny" on a slip. Collect and count publicly. Record the decision.
       g. **Private Wager (1 min):** All voters and role players (except the Advocate for that petition) write on a slip: "Yes" if they would stake their reputation on the dossier being a true demonstration, "No" if not. Collect slips unread (to be revealed only in debrief).

  - **Petition Details:**
    - **Petition A (Moon's Light):** 
      - Scripture: "The moon is one of the great lights in the sky." (Summary: The text lists the moon as a light alongside the sun.)
      - Non-literal reading: The moon is not a source of light but reflects the sun's light.
      - Evidence: A demonstration (using a lamp and a ball in a dark room) shows that the ball only shines when the lamp lights it. Also, the phases of the moon can be explained by this.
      - Goal: This should be an easy case to show that accommodation is necessary and the demonstration is clear.

    - **Petition B (Tides):**
      - Scripture: "The earth is established on its foundations, never to be moved." (Summary: The text speaks of the earth as fixed and immovable.)
      - Non-literal reading: The earth moves (rotates and revolves).
      - Evidence: A dossier of evidence about the tides: 
          - The tides are correlated with the position of the moon and sun.
          - A mechanical explanation: the motion of the earth causes the seas to slosh (like water in a moving basin).
          - The effect varies with the seasons and latitude, which fits the model.
          - (Note: This evidence was historically Galileo's argument, but we know it was flawed. Present it as a "recent natural philosophical argument" without naming Galileo.)
      - Goal: The evidence is impressive but not conclusive. The Assessor will likely rule it as "probable" or "not demonstrated." This shows the risk of reinterpretation without absolute proof.

    - **Petition C (Mirror Regress):**
      - Scripture: Same as Petition A (moon as a light).
      - Non-literal reading: The moon is not a light but a mirror. Moreover, every apparent source of light (including the sun) is actually reflecting light from a source further out. Thus, the "lights" in the sky are really mirrors in a chain.
      - Evidence: A philosophical argument: if we accept that the moon reflects light, then why not the sun? After all, we see that mirrors can produce light. The chain could extend indefinitely. This is supported by the observation that no light source is truly primary (since even the sun might be illuminated by a greater light beyond).
      - Goal: This petition deliberately uses the same logic as Petition A to show the slippery slope. The council must either reject it (and seem arbitrary) or accept an absurdity.

  - **Timeline for 55 minutes:**
    - Introduction to the council (2 min): Explain the setup and roles.
    - Petition A: 12 min total
      - Straw Poll: 1 min
      - Advocate A: 3 min
      - Arguments (Guardian: 2 min, Printer: 2 min, Dissenter: 2 min, Advocate A rebuttal: 2 min) → Note: We have only 6 min allocated for arguments? Adjust: Total arguments 8 min? We must compress.
        Revised: 
          - Straw Poll: 1 min
          - Advocate: 3 min
          - Guardian: 2 min
          - Printer: 2 min
          - Dissenter: 2 min
          - Advocate rebuttal: 2 min → Total 12 min for arguments? Too long.

    We must tighten:

    - **Revised Timeline for Each Petition:**
      - Straw Poll: 1 min (voters write; collect quickly)
      - Presentation: 3 min (Advocate)
      - Arguments: 6 min total (Guardian: 1.5 min, Printer: 1.5 min, Dissenter: 1.5 min, Advocate rebuttal: 1.5 min) [Use a timer strictly]
      - Assessor: 1 min (writes and reads sentence; post it)
      - Discussion: 3 min (open floor)
      - Final Vote: 1 min (collect and count)
      - Private Wager: 1 min (all write slips; collect)
      - **Total per petition: 16 minutes?** That would be 48 minutes for three petitions, leaving 7 minutes for setup and transitions.

    But 55 minutes minus 2 min intro = 53 minutes. We cannot do three petitions in 53 minutes if each takes 16. We must drop one petition or shorten.

    Given your note that the third petition is designed to be covered by the criterion and that we might cut it, I propose:

    - Petition A: 15 min
    - Petition B: 20 min (more complex)
    - Petition C: 15 min (if time allows, else skip or shorten)
    - Plus 5 min for setup and transitions.

    But 15+20+15=50, plus 5 setup = 55. Possible if we enforce strictly.

    Alternatively, if we run short, skip Petition C and use it as a discussion point in debrief.

    **Adjusted Per Petition Timing:**
    - Straw Poll: 1 min
    - Presentation: 3 min
    - Arguments: 4 min (1 min per speaker: Guardian, Printer, Dissenter, Advocate rebuttal) → This is tight but possible if students are prepared.
    - Assessor: 1 min
    - Discussion: 3 min
    - Vote and Wager: 2 min (combine: 1 min to vote and write wager slips simultaneously)
    - **Total: 14 min per petition**

    Then:
    - Setup: 2 min
    - Petition A: 14 min
    - Petition B: 14 min
    - Petition C: 14 min
    - Debrief: 31 minutes? No, we have only 55 - 2 - 14*3 = 55-2-42 = 11 minutes for debrief? That is not enough.

    **Revised Plan:**
    We must reduce to two petitions (A and B) and use Petition C as a quick example in debrief.

    - Setup: 2 min
    - Petition A: 15 min
    - Petition B: 20 min (more complex, so extra time)
    - Debrief: 38 min (including the slip exercise from phase one and the wager results, and a brief mention of Petition C)

    **Final Timeline for Phase 2:**
    - Setup: 2 min
    - Petition A: 15 min
      - Straw Poll: 1 min
      - Advocate A: 3 min (including the demonstration with lamp and ball)
      - Arguments: 4 min (1 min each: Guardian, Printer, Dissenter, Advocate A rebuttal)
      - Assessor: 1 min (writes and posts: e.g., "The demonstration with the lamp and ball conclusively shows that an object can appear to shine by reflected light, and the phases of the moon confirm this for the moon.")
      - Discussion: 3 min
      - Vote and Wager: 3 min (vote, then wager slips)
    - Petition B: 20 min
      - Straw Poll: 1 min
      - Advocate B: 4 min (more detailed)
      - Arguments: 5 min (1.5 min each: Guardian, Printer, Dissenter, Advocate B rebuttal)
      - Assessor: 2 min (may take more time to write; e.g., "The evidence for the earth's motion from the tides is strong and consistent, but it does not rule out other possible causes; therefore, it is a probable opinion but not a demonstration.")
      - Discussion: 4 min
      - Vote and Wager: 4 min
    - (If time: Petition C as a 5-min speed round, else skip to debrief)

  **Phase 3: Debrief (20 minutes, but we have 38 in the revised plan? Actually, the whole activity is 75 min: Phase 1=10, Phase 2=55, so 10+55=65, leaving 10 min for debrief? Let me recast the entire session timing.)**

  **Overall 75-Minute Timeline:**
  - Phase 1: 10 min
  - Phase 2 Setup: 2 min
  - Phase 2 Petition A: 15 min
  - Phase 2 Petition B: 20 min
  - (Optional: Petition C: 10 min if time allows, but we are at 10+2+15+20=47, leaving 28 min for debrief and Petition C? We can do Petition C in 10 min and debrief in 18 min. But you said to cut Petition C if needed.)

    Alternative: Skip Petition C and extend the debrief with the mirror example as a thought experiment.

    **Recommended:**
    - Phase 1: 10 min
    - Phase 2 Setup: 3 min
    - Petition A: 15 min
    - Petition B: 20 min
    - Debrief: 27 min

    In the debrief, we can discuss the mirror case without role-playing.

  **Debrief Structure (27 min):**
  1. **Phase 1 Recap (3 min):** 
     - "In the first activity, we saw that ordinary language statements are not literally true but are not false either. They are accommodated to our experience. How does this relate to scripture?" 
     - Elicit: Scripture uses ordinary language for the same reason.

  2. **Council Decisions and the Assessor's Criteria (10 min):**
     - Reveal the wager slips for Petition A and B. (Count how many would stake their name on each dossier being a demonstration.)
     - For Petition A: Likely, almost all would stake their name. For Petition B, likely few would.
     - Point: The council might have granted both, but the private wagers show that many voters were not truly convinced by Petition B. This is the asymmetry Bellarmine pointed out: if the church reinterprets scripture based on a probable opinion that turns out false, it loses authority. The philosopher only loses an argument.

  3. **The Arbitrariness Problem (5 min):**
     - Introduce Petition C as a hypothetical: "What if someone argued that the moon is a mirror and that the sun is too? And that every light is a reflection? How would the council rule using the Assessor's criterion from Petition A?" 
     - The criterion from Petition A (if it says "reflected light") would cover the moon being a mirror. But then why not the sun? 
     - The council would have to either accept the regress (absurd) or change the criterion (arbitrary). This shows the vulnerability of the rule.

  4. **Broader Implications (9 min):**
     - Map to history: 
       - Galileo's argument for accommodation (like Petition A) was accepted for the moon but not for the earth's motion because the demonstration was lacking (as in Petition B).
       - Bellarmine's point: Reinterpretation requires a true demonstration, not just a probable opinion.
     - Theologian's critique: The rule can become a machine for reinterpreting anything, but in practice, the hurdle of "demonstration" is high and contested.
     - The real conflict: Not between science and religion, but about what counts as demonstrated knowledge and who gets to decide.
     - Remind: In Galileo's time, the tides argument (Petition B) was presented as a demonstration, but it was wrong. The church was not anti-science; it was being cautious about reinterpreting sacred text based on what turned out to be incorrect science.

  **Predictable Problems and Solutions:**
  1. **Phase 1 seen as a puzzle:** Students might try to guess the "right" answer. Mitigation: Present it as a warm-up without context. If they overthink, steer them back to everyday language.
  2. **Roles as heroes/villains:** To avoid, on the role cards, emphasize the principled reasons (e.g., the Guardian is protecting the accessibility of scripture to the common person; the Printer is preventing social unrest). Remind during setup that these are reasonable positions.
  3. **Tides known:** Anonymize the dossier (do not mention Galileo or tides explicitly; call it "the motion of the earth and its effect on the seas").
  4. **Unanimous votes:** The straw poll before discussion will reveal disagreement. The Dissenter speaks first to seed doubt. If votes are unanimous, play devil's advocate.
  5. **Time overrun:** Strictly enforce time limits. Skip Petition C if needed. Cut discussion short in favor of debrief.
  6. **Debrief collapsing into "church anti-science":** Continuously redirect to the epistemic issue: What counts as a demonstration? Highlight that the church accepted the non-literal reading for the moon (Petition A) but not for the earth because the evidence wasn't conclusive. Emphasize that the tides argument was wrong, so the church's caution was not unreasonable.

  **Limits of the Activity:**
  - Cannot reproduce the epistemic uncertainty of 1615 because students know the outcomes (moon reflection is true, tides argument is false, earth moves). They also know the crank petition is absurd.
  - Cannot capture the institutional stakes (patronage, Inquisition, Index of Prohibited Books) in depth.
  - Cannot show that the literal sense was a historically developed practice (Augustine, Aquinas, etc.) and not the only option.
  - Cannot convey that Galileo's letter was advocacy (he was responding to critics and seeking support).

  **What You Must Supply:**
  1. **Astronomy:** After the activity, briefly explain the actual science (moon reflects sunlight; tides are caused by gravitational pull; the earth moves, but Galileo's tidal theory was incorrect).
  2. **Institutional History:** The context of the Inquisition, the Index, and the political pressures.
  3. **Historical Contingency:** The literal sense was not the only way to read scripture; it became prominent in this period. Galileo's letter was a tactical document.
  4. **Unsettled Science:** In 1615, Copernicanism was not proven; the best argument (stellar parallax) wasn't observed until the 19th century. The church was not rejecting proven science but being cautious.

  This activity should give students an experiential understanding of the central dilemma and set up a nuanced discussion that complicates the "anti-science" narrative.
answer: |-
  Below is a redesigned activity based on your goals and constraints, with refinements to heighten the experiential trap, manage predictable pitfalls, and ensure philosophical insights emerge organically. The activity leans into your three-phase structure but tightens roles, materials, and timing to force engagement with the core tension: **accommodation licenses reinterpretation only when paired with incontrovertible demonstration, but "demonstration" is a contested, high-stakes filter that protects against arbitrariness while creating new vulnerabilities.**

  ---

  ### **Activity Title: The Council of Interpretive Authority**  
  *75 minutes, 16 students*  
  **Goal:** Students confront why accommodation is compelling yet vulnerable, experiencing Bellarmine's warning that the rule "never loses an argument against a text" but collapses into battles over what counts as demonstration.

  ---

  ### **Materials & Setup**  
  - **Phase 1 Slips (10 slips, 1 per student):** Short, ordinary-language statements:  
    > "The sun rose at 6:14 this morning."  
    > "The wind off the lake is bitingly cold."  
    > "The table is solid wood."  
    > "The moon is glowing brightly tonight."  
    > "Stars are tiny pinpricks of light."  
    > "Blood is the source of the body's vitality."  
    > "The sky is an endless blue dome."  
    > "Frogs spawn spontaneously from mud."  
    > "Hearts are where love resides."  
    > "The earth feels perfectly still."  

  - **Role Cards (for Phase 2):**  
    - **Advocate A** (Moon’s reflected light): *Argue for reinterpretation using the lamp-ball demo.*  
    - **Advocate B** (Earth’s motion & tides): *Argue for reinterpretation using an impressive but flawed dossier.*  
    - **Advocate C** (Mirror regress): *Argue that all light is reflected, leveraging the council’s prior ruling.*  
    - **Guardian of the Plain Sense**: *Defend literal readings as essential for accessibility to common people.*  
    - **Printer**: *Warn of how pamphlets will distort the council’s ruling in 20 years.*  
    - **Assessor**: *Declare in one sentence if evidence is “demonstration” or “probable opinion.”*  
    - **Dissenter**: *Argue against granting any petition—cite risks to tradition and authority.*  
    - **9 Voters**: *Decide based on arguments; must reference the Assessor’s criterion.*  

  - **Petition Dossiers (Summaries in your words):**  
    - **Petition A (Moon)**:  
      - *Scripture Summary*: "The moon is called a ‘great light’ in the sky, akin to the sun."  
      - *Non-Literal Reading*: The moon is not a light source but reflects the sun’s light.  
      - *Evidence*: A physical demonstration (lamp = sun, ball = moon in a dark room) shows reflected light explains moon phases.  

    - **Petition B (Tides)**:  
      - *Scripture Summary*: "The earth is ‘established immovable’ and ‘cannot be moved.’"  
      - *Non-Literal Reading*: The earth moves (rotates and orbits).  
      - *Evidence*: A dossier links tides to earth’s motion: (1) tides correlate with lunar/solar positions, (2) a mechanical model shows sloshing from motion, (3) seasonal/latitudinal variations align. *Present as "a natural philosopher’s recent treatise" (no names, avoid tides if students might recognize it).*  

    - **Petition C (Mirror Regress)**:  
      - *Scripture Summary*: "The moon is called a ‘great light’ in the sky."  
      - *Non-Literal Reading*: The moon is a mirror reflecting an external source; all "lights" (sun included) are reflections in an infinite regress.  
      - *Evidence*: If Petition A’s demonstration shows apparent lights can be reflections, this must apply universally—else the council is arbitrary.  

  - **Other**: Lamp, ball, dark corner (for demo); poster paper for Assessor’s rulings; slips for votes/private wagers; timer.  

  ---

  ### **Timeline (75 Minutes Total)**  
  **Phase 1: Ordinary Language Trap (10 min)**  
  - **Pairs (3 min)**: Students decide which slips are "false." *Predictably, they’ll say none.*  
  - **Whole Group (7 min)**: Press for strict accuracy—e.g., "Does the sun *actually* rise?" Students concede all are "false" scientifically. **Key Insight**: Ordinary language isn’t wrong; it’s *fit for purpose* (salvation, daily life). **No explicit connection to scripture yet.**  

  **Phase 2: Council Session (50 min)**  
  - **Setup (3 min)**: Assign roles. Emphasize: *No heroes/villains. All roles defend principled stakes (e.g., Guardian protects accessibility; Printer warns of chaos).*  
  - **Petition A: Moon’s Light (15 min)**  
    - *Straw Poll (1 min)*: Voters lean on slips (grant/deny).  
    - *Advocate A (3 min)*: Presents demo (lamp lights ball in dark).  
    - *Arguments (5 min)*: Guardian (literal = stability), Printer (pamphlets will say "Church admits Bible wrong!"), Dissenter ("tradition matters"), Advocate A rebuttal.  
    - *Assessor (1 min)*: Writes one sentence: **"The demonstration proves beyond doubt that the moon shines by reflected light."** Post it.  
    - *Discussion (3 min)*: Voters debate.  
    - *Final Vote + Private Wager (2 min)*: Voters publicly vote; *all* privately write if they’d "stake their name" on the demo.  

  - **Petition B: Earth’s Motion & Tides (20 min)**  
    - *Straw Poll (1 min)*: Voters lean.  
    - *Advocate B (4 min)*: Presents dossier (stress "impressive correlations").  
    - *Arguments (6 min)*: Guardian ("immovable earth" is plain sense), Printer ("pamphlets will fuel atheism"), Dissenter ("what if wrong? We lose authority"), Advocate B rebuttal.  
    - *Assessor (2 min)*: Writes: **"The evidence is consistent and probable but not conclusive; other causes are possible."** Post it.  
    - *Discussion (4 min)*: Voters debate, citing Assessor’s criterion.  
    - *Final Vote + Private Wager (3 min)*: Public vote; private wager.  

  - **Petition C: Mirror Regress (10 min—cut if behind schedule)**  
    - *Straw Poll (1 min)*: Voters lean.  
    - *Advocate C (2 min)*: Argues from Petition A’s criterion: "If moons can be mirrors, why not suns? Else you’re arbitrary!"  
    - *Arguments (4 min)*: Guardian ("this mocks scripture"), Printer ("chaos!"), Dissenter ("see where this leads?"), Advocate C rebuttal.  
    - *Assessor (1 min)*: Bound by prior ruling, writes: **"The same demonstration applies, but infinite regress lacks evidence."** (Post).  
    - *Vote + Wager (2 min)*: Public vote; private wager.  

  **Phase 3: Structured Debrief (15 min)**  
  Map moments to philosophy:  
  1. **Phase 1 Slips → Accommodation** (3 min):  
     - "Why call ordinary statements ‘false’? They serve a purpose—like scripture for salvation. Fault lies in *misapplying* them as science."  
  2. **Assessor’s Criterion → The Real Battle** (5 min):  
     - Reveal private wagers: Petition A has near-unanimous "stake name"; Petition B has majority "no."  
     - **Bellarmine’s Trap**: The church risks authority if it reinterprets on probability (Petition B). Philosophers risk only being wrong.  
  3. **Petition C → Arbitrariness** (4 min):  
     - "Did the council bend the rule to deny Petition C? Accommodation + demonstration is a machine that must be ‘turned off’ arbitrarily to avoid absurdity."  
  4. **Galileo’s Real Struggle** (3 min):  
     - "This wasn’t science vs. religion—it was about *who decides* what counts as demonstration when evidence is contested (e.g., Petition B’s dossier was wrong!)."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Phase 1 seen as a puzzle**: Students may overthink slips. *Fix:* Keep it brisk—say, "Use common sense," and move fast to council.  
  2. **Flattened roles (Guardian/Printer as villains)**: *Fix:* In role cards, stress principled motives (e.g., Printer: "Your job is to prevent social unrest"). Intervene if rhetoric escalates: "Guardian, how does your view protect the faithful?"  
  3. **Tides recognized**: *Fix:* Anonymize Petition B as "a 1613 treatise" and avoid "tides"; call it "marine motions." If exposed, say: "Focus on the evidence’s logic, not history."  
  4. **Unanimous early votes**: *Fix:* Straw polls show disagreement; Dissenter speaks *first* to seed doubt. If votes align, say: "Voters, what would change your mind?"  
  5. **Time overruns**: *Fix:* Cut Petition C discussion (not vote) if needed. Use it as a debrief example: "How would you rule if this came next?"  
  6. **Debrief collapses into "Church anti-science"**: *Fix:* Preempt in debrief: "Petition A was granted! Why deny Petition B? Was the Church wrong or cautious?" Stress Petition B’s flaws.  

  ---

  ### **What the Activity Cannot Reproduce & What You Must Supply**  
  The activity **cannot**:  
  1. **Simulate 1615 epistemic uncertainty**: Students know the moon reflects light, earth moves, and tides are gravitational. *You must supply*: "In 1615, no one knew the tides’ true cause; Galileo’s model was plausible but wrong. The Church weighed *probability* vs. *demonstration* amid genuine doubt."  
  2. **Convey institutional stakes**: *You must supply*: "The Index and Inquisition weren’t anti-science—they were defending institutional authority in a fragmented world. Patronage shaped whose ‘demonstrations’ were heard."  
  3. **Show historical contingency of literal reading**: *You must supply*: "Literal reading wasn’t ‘obvious’—it emerged from debates about heresy. Augustine allowed non-literal readings, but the Reformation hardened Catholic positions."  
  4. **Expose Galileo’s advocacy**: *You must supply*: "Galileo’s letter to Christina was rhetoric—he cherry-picked Church Fathers and overstated his case under pressure."  
  5. **Clarify astronomy**: *You must supply*: "The tides’ real cause (lunar gravity) was unknown until Newton. Galileo’s proof failed, but Copernicus was right for other reasons (stellar parallax came later)."  

  **Debrief Focus**: Hammer the nuance: "The Church granted non-literal readings *when demonstrations were clear* (e.g., Petition A). The tragedy was not dogma but contested proof—a fight over who gets to define ‘demonstration’ when lives and authority hang in the balance." This counters "anti-science" narratives by showing accommodation as a *reasonable* rule with *unreasonable* execution burdens.  

  ---  
  This design forces students to feel both the power of accommodation (Phase 1/Petition A) and its fragility when demonstrations are uncertain (Petition B) or weaponized (Petition C). The wagers and Assessor’s rulings make Bellarmine’s asymmetry visceral, while the debrief ties it to history without oversimplifying. Run Petition C only if time allows—its point can be made in debrief.
