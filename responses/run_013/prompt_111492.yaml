prompt: |-
  I'm a research assistant on a comparative-politics project that codes country-episodes for a democracy-monitoring index, and the codebook is still being argued over, so my supervisor has been making the borderline calls herself while the rest of us write them up. Because I have to justify each coding in a footnote, I've been keeping a log of her verdicts and the single line she gives for each. Hungary after 2010: a two-thirds majority wrote a new constitution, expanded and repopulated the constitutional court, and put broadcast licensing under a body it appointed — backsliding, note: "the incumbent rewrote the rules so that it could no longer lose." Poland from 2015 on: a new governing party captured the constitutional tribunal, then the body that nominates judges, then the disciplinary regime for judges who objected — backsliding, note: "the space for organised opposition closed." Turkey after the failed coup attempt: emergency rule, mass dismissals, and a referendum converting the system into an executive presidency — not backsliding, note: "after a break like that you're not watching a slide any more." Tunisia, when the president suspended parliament, dismissed the prime minister, governed by decree, and then put a new constitution to a referendum — not backsliding, and the note says only "starting point." The United States between 2017 and 2021: a president who would not accept defeat, pressured state officials and his own vice-president to overturn the result, and ended with a mob in the legislature — backsliding, but flagged as a distinct subtype, note: "reversible, so a different animal." And one pilot case I won't identify, a mid-sized European country where the governing party took over the public broadcaster and redrew the electoral map without touching the constitution — backsliding, no note at all.

  What I can't extract from her is the operative rule. Every case she has called backsliding had both a governing party quietly loosening the constraints on itself and a visible narrowing of contestation; every case she has refused to call backsliding is one where she can point to something else in the background — a rupture, a low starting point — so the log never separates the two, and her notes sometimes lean on one and sometimes on the other. I genuinely cannot tell whether she is tracking the method, the outcome, or the setting.

  Next week's case is the one I actually need help with. In a country with a long record of competitive elections and a constitutional court that had repeatedly blocked the governing party's programme, the government put a package to a referendum and won comfortably. The package writes a generous set of social and environmental rights into the constitution — genuinely new entitlements, popular with the public, and defended by the government as a deepening of democracy. The same package, however, removes the constitutional court's jurisdiction over the new rights chapter, gives the parliamentary majority the final word on appointments to that court, cuts the court's budget, and lowers the number of signatures needed to call a referendum. Elections are untouched, the opposition campaigns freely, and the government is comfortably ahead in the polls. Her preliminary note on the file says only "interesting." I'd like you to tell me how she will code it, and to be explicit about the reasoning: set out the rules that fit her whole log, say what each of them predicts here, give me your best guess with the reasons for preferring it, and name the further case that would best tell the surviving rules apart. I'd also like to know whether anything in the log would look different had the governing parties sat on the opposite side of the political spectrum, and which case would expose that.
reasoning: |-
  Okay, the user is a research assistant working on a democracy-monitoring index. They're struggling to understand their supervisor's coding decisions for borderline cases of democratic backsliding. The supervisor has provided brief notes for each case, but the underlying rule isn't clear. The user needs help predicting how the supervisor will code an upcoming case and wants to understand the reasoning behind it.

  Looking at the cases provided:

  Hungary (backsliding): The ruling party rewrote the constitution, expanded the court, and controlled broadcast licensing. The note emphasizes changing rules to prevent losing power.

  Poland (backsliding): The government captured judicial bodies and restricted opposition space.

  Turkey (not backsliding): After a coup attempt, emergency measures and system change were seen as a rupture rather than a slide.

  Tunisia (not backsliding): President suspended parliament and governed by decree, but was coded as "starting point" suggesting low initial democracy.

  US (backsliding but reversible subtype): Election denial and Capitol riot seen as reversible backsliding.

  Unnamed European case (backsliding): Took over media and gerrymandered without constitutional changes.

  The patterns show that backsliding requires both:
  1) Incumbent self-dealing (weakening constraints on their power)
  2) Narrowing contestation (reducing opposition's ability to compete)

  Cases are excluded if there's a "rupture" (like Turkey's coup) or "low starting point" (Tunisia). The US case introduces "reversibility" as a subtype.

  For the new case:
  - Government passed popular constitutional changes but also removed court oversight over these changes
  - Gave parliament control of judicial appointments
  - Reduced court funding
  - Made referendums easier (which helps the majority)
  - Opposition still operates freely

  This clearly meets the self-dealing criterion by weakening checks on power. The contestation narrowing is subtle but present through undermining judicial independence. There's no rupture or low starting point to justify exclusion. The "interesting" note suggests it's a borderline case that likely fits the pattern.

  I predict the supervisor will code this as backsliding. To test the framework, a case where self-dealing occurs without contestation narrowing would be revealing. The Tunisia case suggests ideology doesn't matter - it's about the actions, not which party does them.
answer: |-
  Based on your supervisor's log and the patterns within it, here's the breakdown of her operative rule, prediction for the new case, and tests to clarify ambiguity:

  **The Extracted Operative Rule (Likely):**
  Your supervisor codes an episode as **democratic backsliding** when **BOTH** of the following occur **simultaneously**:
  1.  **Incumbent Self-Dealing:** The governing party/coalition *incrementally* alters formal or informal rules/institutions to weaken constraints on its own power, reduce accountability, or entrench its position, *while maintaining a veneer of procedural continuity*.
  2.  **Narrowing of Contestation:** These actions demonstrably *reduce the effective space* for organized political opposition to compete for power, challenge government actions, or hold the government accountable through existing democratic channels.

  **Exclusionary Conditions (Not Backsliding):**
  *   **Rupture/Regime Break:** A clear, sudden discontinuity (e.g., coup, revolution, collapse) resets the political system. The erosion isn't "sliding" from a prior democratic point; it's a new, potentially non-democratic, starting point (Turkey).
  *   **Low Starting Point:** The episode occurs in a context where core democratic institutions and norms were already weak, unstable, or not fully consolidated. Action here is seen as preventing development or exploiting fragility, not eroding an established democracy (Tunisia).
  *   **Reversibility (Distinct Subtype):** Actions meet the core criteria *but* occur within a system where robust counter-majoritarian institutions, strong civil society, or deeply ingrained democratic norms *demonstrably* halt the slide and force reversal quickly (US 2017-2021).

  **Application to the New Case:**

  1.  **Incumbent Self-Dealing? YES.**
      *   Removing constitutional court jurisdiction over the new rights chapter (reduces judicial constraint).
      *   Giving parliamentary majority final word on court appointments (captures the court).
      *   Cutting the court's budget (weakens institutional capacity/resistance).
      *   Lowering referendum signature threshold (potentially facilitates future self-serving constitutional changes by the majority). While adding popular rights, the *simultaneous removal of oversight* over those rights and capture of the court clearly weakens constraints on the incumbent.

  2.  **Narrowing of Contestation? YES (Subtly, but crucially).**
      *   Capturing the constitutional court directly undermines the most potent formal channel for the opposition to challenge government actions and legislation. A captured court cannot effectively act as a check or provide a forum for opposition challenges.
      *   Weakening the court's capacity (budget cut) further diminishes this channel.
      *   While elections and campaigning remain free *now*, controlling the body meant to uphold constitutional rules (including electoral rules) creates a latent threat to future contestation. The *space for effective legal/institutional contestation* has narrowed.

  3.  **Exclusionary Conditions? NO.**
      *   **No Rupture:** This is incremental change via referendum within the existing constitutional framework, however manipulated.
      *   **Not Low Starting Point:** The country has a "long record of competitive elections" and a constitutional court that had actively constrained the government, indicating a previously higher level of democratic consolidation than Tunisia.
      *   **Not Clearly Reversible (yet):** The changes are structural and entrenched via constitutional amendment. There's no indication of immediate, robust institutional pushback capable of reversing these changes, unlike the US case where courts, states, and norms ultimately held (despite the attempt).

  **Prediction & Reasoning:**
  *   **Best Guess:** Your supervisor will code this as **BACKSLIDING.**
  *   **Reasons:**
      *   It perfectly fits the core pattern: incremental self-dealing (capturing/weakening the court) coupled with narrowing contestation (removing the key institutional channel for opposition challenges).
      *   The "popular rights" addition is likely seen as window-dressing or a distraction from the core institutional power grab, similar to how Fidesz in Hungary used popular measures alongside power concentration.
      *   The "interesting" note suggests she recognizes the attempt to mask the backsliding with popular reforms, making it a sophisticated case fitting her pattern.
      *   It lacks the clear rupture (Turkey) or low starting point (Tunisia) that triggered her "not backsliding" verdicts. The changes are structural and not immediately reversible like the US subtype.

  **The Crucial Test Case (To Distinguish Surviving Rules):**
  The ambiguity lies in whether the *method* (incremental self-dealing) or the *outcome* (narrowing contestation) is absolutely primary, and how subtle the narrowing can be. The best test case would be:

  *   **Scenario:** A governing party undertakes significant self-dealing (e.g., gerrymanders severely, takes firm control of state media, weakens oversight bodies) **BUT** the opposition remains highly visible, vocal, wins significant sub-national elections, and polls show it could realistically win the next national election. Contestation *feels* vibrant despite the tilted playing field.
  *   **Why it Tests:**
      *   **If coded BACKSLIDING:** Your supervisor prioritizes the *method* (self-dealing tilting the system) and the *latent threat* to contestation, even if it's not yet fully manifested or the opposition remains strong. This aligns with Poland/Hungary/Unnamed EU case where opposition still operated but space closed *around* them.
      *   **If coded NOT BACKSLIDING:** Your supervisor requires *manifest, observable narrowing of contestation* (e.g., opposition leaders jailed, parties banned, elections blatantly stolen). The vibrancy of the opposition overrides the self-dealing. This would be a significant departure from her past coding (especially Poland/Unnamed EU).

  **Impact of Governing Party Ideology:**
  *   **The Log Suggests NO Impact:** Her reasoning shows no reliance on ideology. Fidesz (right), PiS (right), Trump (right), and the unnamed EU case (likely right) are coded based on actions. Tunisia's President Saied (often seen as centrist/anti-Islamist) and Turkey's Erdogan (Islamist/conservative) were coded based on rupture/starting point. The *actions* (self-dealing, narrowing contestation, rupture, low start) are the focus.
  *   **Case to Expose Ideology Bias:** If a hypothetical case arose where a left-wing government in a consolidated democracy undertook *identical actions* to Hungary/Poland (court capture, media control, rule changes) and she coded it **NOT** backsliding, or used a different rationale (e.g., "progressive restructuring"), that would expose ideology bias. Conversely, if she coded it backsliding consistently, it reinforces that actions, not ideology, drive her coding.

  **Conclusion for the New Case:**
  Your supervisor is tracking the **method (incremental self-dealing)** combined with the **outcome (narrowing effective contestation)**, within a **setting of prior democratic consolidation and the absence of a clean rupture**. The new case exhibits clear self-dealing (court capture/weakening) and a clear narrowing of the *institutional space for contestation* (judicial oversight removal), within a consolidated system with no rupture. Her "interesting" note likely acknowledges the masking tactic of popular rights. Therefore, **expect a BACKSLIDING coding**. Prepare a footnote emphasizing the capture of the key accountability institution (Constitutional Court) and the removal of its oversight over major new constitutional provisions, effectively insulating the government's actions from legal challenge.
