prompt: |-
  A colleague in our decision-theory reading group has produced an argument that half of us now repeat and none of us can repair. It began from a case we kept running into: a screening test whose false-positive rate I only half remember, so that even the range of probabilities my evidence tolerates has no sharp edge. She argued that when evidence fails to settle a hypothesis, no single probability for it can be the right one, and that a rational doxastic state cannot be one whose correctness turns on a choice I made arbitrarily, since I could have chosen otherwise and nothing in the evidence would have objected. From this she concluded that in such cases the rational state is not a probability but the set of probabilities the evidence permits. That much I can live with. What I cannot live with is what she did next, and I cannot locate the error.

  Here is the argument as she sets it out.

  (1) If your evidence does not determine a unique probability for a hypothesis, then any single probability you adopt is arbitrary, since some other value fits the evidence equally well.

  (2) No rational doxastic state is such that its correctness depends on an arbitrary choice by the agent.

  (3) Therefore, where the evidence leaves the probability open, the rational state is the set of probabilities the evidence permits, rather than any one member of that set.

  (4) The evidence does not determine the exact membership of that set any more than it determined a single value; for any set that fits the evidence, a set differing by one hairline case fits it equally well.

  (5) So by (1) and (2), the rational state at that level is the set of all such sets, and the same reasoning recurs at every level without end.

  (6) Hence the requirement that a rational doxastic state be determinate is unsatisfiable at every level.

  (7) No agent can hold an infinitely ascending hierarchy of states, and a state that is indeterminate at every level cannot guide action; a theory of rational belief that can be neither held nor acted on is no theory of rational belief.

  (8) Therefore the project of representing rational belief by probabilities, whether by one or by a set, rests on a mistake.

  I would rather keep (2) and (3) than accept (8): (3) is the whole point of the machinery, and (2) is what makes it more than a preference. Yet the same steps, run on a hypothesis or on a choice of action rather than on a probability, would show that evidence never determines what to believe or do about anything, including what it determines about her own premises, and that cannot be right.

  I can see three exits and dislike all of them. Deny (1) and insist that evidence fixes a unique probability after all; deny (2) and concede that rational states may be arbitrary at the margin; or refuse (7) and live with the hierarchy. Tell me whether any of these is right, or whether the fault lies somewhere I have not thought to look. For whichever step you reject, explain why it looked compelling and price the commitment: what must I give up to hold the line there, and what does the rival who takes a different exit have to say against me?
reasoning: |-
  Okay, let me start by unpacking this user's problem. They're part of a decision-theory reading group, and a colleague presented an argument that's causing a lot of confusion. The core issue is about how to handle uncertainty when evidence doesn't pin down a single probability for a hypothesis. The colleague argues that using a single probability is arbitrary, but then this leads to an infinite regress where even sets of probabilities become problematic. The user finds themselves stuck between three unappealing options and wants to find where the argument goes wrong.

  First, I need to understand the argument step by step. The colleague starts with the idea that if evidence doesn't determine a unique probability, any single choice is arbitrary. That makes sense intuitively. Then, they say rational states shouldn't depend on arbitrary choices. So instead, you should consider the set of all probabilities consistent with the evidence. But here's the twist: the evidence doesn't fix the exact set either because even the boundaries of that set are fuzzy. So now you need a set of sets, and this goes on infinitely. That leads to a hierarchy that's impossible to handle, making the whole probabilistic approach flawed.

  The user mentions they can live with (3), which is using sets of probabilities, but the infinite regress is the problem. They see three exits: deny that evidence fixes a unique probability (which they don't want), accept some arbitrariness (which undermines the motivation), or embrace the infinite hierarchy (which seems impractical). They want to know which step is wrong and why.

  Hmm. Let me look at step (4). The colleague claims that the evidence doesn't determine the exact set any more than a single probability. But is that true? The user's example is a screening test with an imperfectly remembered false-positive rate. The evidence here is vague, but does that vagueness really lead to a sorites-like problem? For instance, if the false-positive rate is remembered as "around 5%," the set might be [0.03, 0.07]. Now, is there a hairline difference between including 0.0700 and 0.0701? In practice, the user's evidence might not distinguish such small differences. The set's boundaries could be defined based on what the evidence supports, even if it's not sharp. 

  The key here is epistemic vs ontic vagueness. The vagueness is in the evidence, not in the world. The user's evidence might justify a range like [0.04, 0.06] without specifying exact boundaries. But that doesn't mean every possible boundary is equally justified. If the evidence is "around 5%," values closer to 5% are better supported than those farther away. So the set isn't arbitrary; it's determined by the evidence, even if imprecisely. Step (4) assumes that any small change to the set is equally good, but that's not necessarily true. The evidence might support a specific interval, and changing the endpoints slightly could make it less accurate. For example, if the evidence suggests the rate is between 4% and 6%, then a set from 4.1% to 5.9% might exclude values that are still plausible, making it less consistent with the evidence. So the set isn't arbitrary; it's constrained by the evidence.

  Now, what about the user's preferred exit, denying (4)? If the set's boundaries are fixed by the evidence, then there's no regress. But is that plausible? The user mentioned that the evidence "tolerates no sharp edge," but maybe the lack of sharpness doesn't imply multiple equally good sets. Perhaps the evidence determines a fuzzy set or an interval with vague boundaries. In that case, the rational state is that fuzzy set, avoiding the regress. 

  The colleague's argument in step (4) relies on a sorites analogy—that changing the set by a tiny amount doesn't make a difference. But in epistemic terms, even small changes can matter if they exclude values supported by evidence. For instance, if the actual false-positive rate is 4.5%, a set ending at 4.6% would exclude it, which isn't justified if the evidence includes "around 5%." So the set must include all possibilities the evidence doesn't rule out. That means the set is uniquely determined: it's all probabilities not excluded by the evidence. Therefore, step (4) is incorrect because there's only one set that fits—the one encompassing all possibilities the evidence allows.

  But what about borderline cases? If "around 5%" includes values like 4.9% to 5.1%, but what about 4.95%? The vagueness might mean that the set itself is vague. The user could respond that the rational state accommodates this vagueness without needing higher-order sets. For example, using intervals with tolerance ranges or fuzzy sets. In decision-making, they can use the entire set, like choosing actions that are robust across all probabilities in the set. So the regress doesn't start, and (7) and (8) are avoided.

  The user also mentioned that denying (1) or (2) is less appealing. Denying (1) would mean evidence always fixes a unique probability, which seems unrealistic in cases of vague evidence. Denying (2) allows some arbitrariness, which undermines the motivation for using sets. So rejecting (4) seems the best path. 

  What would the rival say? A supervaluationist might argue that multiple precisifications are equally valid. But the user can counter that the evidence supports the entire range, and the set isn't arbitrary—it's fixed by what the evidence doesn't rule out. The colleague might respond that without sharp boundaries, any precise set is arbitrary. But the user can say the set doesn't need precise boundaries; it can be vague, and rational agents can handle that without infinite hierarchies. 

  In conclusion, the fault is in step (4). The evidence determines a unique set (even if vague) of permissible probabilities, so there's no regress. The rational state is that set, and it's sufficient for guiding actions by considering all possibilities within it.
answer: |-
  Your colleague's argument is a sophisticated critique of probabilistic representations of belief under evidential ambiguity, and your discomfort is warranted. The error lies in **step (4)**, and rejecting it preserves (1)–(3) while avoiding the regress and collapse in (5)–(8). Below, I dissect why (4) fails, address the exits you dislike, and clarify the commitments involved.

  ---

  ### **Why Step (4) is the Culprit**
  **Claim (4)**:  
  *"The evidence does not determine the exact membership of the set [of probabilities] any more than it determined a single value; for any set that fits the evidence, a set differing by one hairline case fits it equally well."*

  **Why it fails**:  
  - **Vagueness vs. Indeterminacy**: Evidence often constrains probabilities to a *range* (e.g., a false-positive rate between 0.04 and 0.06) without fixing sharp boundaries. However, this **does not imply** that all sets fitting the evidence are equally rational. The evidence uniquely determines a *maximally inclusive set* of probabilities that are *not ruled out* (e.g., $[0.04, 0.06]$).  
  - **The "Hairline Case" Fallacy**: The argument assumes a Sorites-like problem: if adding/removing a probability $p \pm \epsilon$ from the set doesn’t change its fit to the evidence, then no set is uniquely determined. But this confuses **epistemic vagueness** (in your evidence) with **metaphysical indeterminacy** (in what the evidence supports).  
    - *Example*: If your evidence is "the false-positive rate is roughly 5%," the rational set is an interval centered near 0.05 (e.g., $[0.04, 0.06]$). A set like $[0.04001, 0.06001]$ is *not* equally justified—it excludes 0.04 (which your evidence doesn’t forbid) and includes 0.06001 (which your evidence doesn’t support).  
  - **The Maximally Permissive Set**: Evidence determines a unique set **when "fits the evidence" means "contains all probabilities the evidence does not exclude."** This set is fixed by the evidence—it’s not arbitrary.  

  **Why (4) seemed compelling**:  
  It exploits the intuition that vague evidence lacks sharp boundaries. But vagueness doesn’t entail that *all* boundaries are arbitrary; it only means the **boundaries themselves are vague**. The rational response is to adopt a set with *tolerant boundaries* (e.g., an interval), not to ascend to higher-order sets.

  ---

  ### **The Price of Rejecting (4)**
  1. **Commitment**:  
     - You must accept that evidence **uniquely determines a set** (e.g., an interval, a credal set) even when it fails to determine a single probability.  
     - This set is *not* precise at the margins (e.g., 0.04 and 0.06 are included, but whether 0.0399 is included is vague). Rational agents can use tools like **imprecise probability** or **fuzzy sets** to model this.  

  2. **Counterarguments from Rivals**:  
     - **Colleague's retort**: "But how do you decide the *exact* boundaries? Isn’t choosing $[0.04, 0.06]$ over $[0.039, 0.061]$ arbitrary?"  
       - **Your reply**: The boundaries aren’t chosen—they’re fixed by the evidence. The set $[0.04, 0.06]$ is uniquely determined because your evidence (e.g., "roughly 5%") *rules out* values like 0.01 or 0.10 but *permits* all values in between. Vagueness at the edges doesn’t make the entire set arbitrary.  
     - **Supervaluationist objection**: "Multiple precisifications (e.g., $[0.04, 0.06]$, $[0.041, 0.059]$) are equally consistent with vague evidence!"  
       - **Your reply**: Those precisifications are *subsets* of the maximally permissive set. The rational state is the **full set of unfalsified probabilities** ($[0.04, 0.06]$), not an arbitrary subset.  

  3. **Action-Guidance Preserved**:  
     - With a single set (e.g., $[0.04, 0.06]$), you can apply decision rules robust across all probabilities in the set (e.g., maximize worst-case expected utility). No infinite hierarchy is needed.  

  ---

  ### **Why Your Disliked Exits Are Worse**
  - **Deny (1)**: Claim evidence *always* fixes a unique probability.  
    - **Problem**: Contradicts cases of genuine ambiguity (e.g., "I recall the false-positive rate is around 5%"). Forcing uniqueness ignores vagueness.  
    - **Commitment**: You must defend precise probabilities even with scant evidence—e.g., through contentious principles like the Principle of Indifference. Rivals will accuse you of *introducing* arbitrariness.  

  - **Deny (2)**: Allow rational states to depend on arbitrary choices.  
    - **Problem**: Undermines the motivation for imprecise probabilities. If arbitrariness is acceptable, why not pick *any* probability in $[0.04, 0.06]$?  
    - **Commitment**: You abandon the core insight that evidence should *constrain* belief. This invites subjective whimsy.  

  - **Embrace the Infinite Hierarchy (deny (7))**:  
    - **Problem**: The hierarchy is **epistemically inert**. Holding a set of sets of sets... doesn’t improve decisions—it paralyzes them.  
    - **Commitment**: You must defend an impossible cognitive state. Rivals will argue this collapses into absurdity (as in (8)).  

  ---

  ### **The Bigger Picture: What You Save**
  - **(3) Stands**: Rational belief *can* be a set of probabilities when evidence is ambiguous.  
  - **(2) Stands**: Rational states avoid arbitrariness; the set is uniquely determined by evidence.  
  - **No Regress**: Step (5) is blocked because (4) is false. The set of sets isn’t needed.  
  - **Probabilism Preserved**: Probabilities (single or sets) remain viable for guiding action.  

  **Final Defense**:  
  When evidence is vague, the rational response is **imprecise credence**—a set of probabilities bounded by your evidence. This set is "indeterminate" only at its edges, but that doesn’t license higher-order sets. Vagueness is managed by accepting that belief-states can have tolerant boundaries, just like linguistic predicates (e.g., "tall") do. To demand infinite precision from evidence is to misunderstand its role: evidence *eliminates possibilities*, and what remains is the set of probabilities that survive elimination. Your colleague’s regress confuses the map for the territory.
