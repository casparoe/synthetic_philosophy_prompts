  Hmm, the user's hypothesis is that there are two separate questions being conflated: what proposition a conditional expresses (semantics) versus what it means to hold or assert one (pragmatics/epistemics). They suspect the camps might be talking past each other. I need to test this against each side's actual claims.

  First, looking at the truth-conditional camp. They definitely treat the indicative/counterfactual distinction as semantic. For instance, David Lewis's similarity spheres or Robert Stalnaker's selection functions explicitly build modal structure into counterfactuals. When they refine theories to handle Sobel sequences or context shifts, they're doubling down on semantic explanations. So they'd reject the idea that their project only cares about propositions—they think the modal/temporal differences *are* the propositional content.

  Now the assertability camp. Radicals like Adams or Edgington deny conditionals have truth values at all. For them, the Oswald cases differ purely in what's held fixed epistemically. But even moderates like Dorothy Edgington who accept some truth-aptness still locate the key difference in epistemic commitments. Crucially, they see the triviality results as killing truth-conditional approaches entirely, which suggests they view the camps as directly opposed.

  Wait, here's a problem with the user's hypothesis: both sides actively attack the other's core project. Truth-conditional theorists write papers "against" assertability theories, and vice versa. The triviality results aren't just ignored by one side—they're battlefield trophies. That's not how separate-but-compatible disciplines interact.

  So the real disagreement might be about the *domain* of semantics. What counts as "meaning"? Is it just truth conditions (Camp 1) or use/inferential role (Camp 2)? This isn't just a verbal split—it's a methodological schism. Camp 1 thinks ignoring truth conditions leaves out something essential; Camp 2 thinks truth conditions are illusions for conditionals.

  For progress... Hmm. Maybe clarifying the burden of proof? Camp 2 owes an explanation for why we *feel* conditionals can be true/false. Camp 1 needs to explain why their truth conditions don't map to probabilities intuitively. Or a formal result showing semantic approaches can satisfy probabilistic constraints without triviality—though that's been elusive for decades. Alternatively, embracing dual theories where semantics handles compositional embedding while pragmatics handles assertion might help, but hardliners on both sides would resist.

  The user's clearly frustrated by the stalemate. They want the "structure," so I should map the fault lines: competing definitions of meaning, incompatible success criteria, and mutual dismissal of each other's evidence. Progress might require agreeing on what counts as data first—like whether the probability of conditionals must equal conditional probability.
answer: |-
  Your hypothesis—that the dispute conflates two separable questions (the proposition expressed vs. the act of belief/assertion)—is insightful but does not fully survive contact with the claims of each camp. The core disagreement is **not merely verbal**; it is a **methodological and metaphysical clash** about the nature of meaning, the boundaries of semantics, and what constitutes an adequate theory of language. Below is a structured diagnosis:

  ### **Why Your Hypothesis Falters**
  1. **Mutual Exclusivity in Claims**  
     - The **truth-conditional camp** (e.g., Stalnaker, Lewis, Kratzer) explicitly argues that semantics *must* account for the indicative/counterfactual distinction through truth conditions. They treat conditionals as propositions with modal structure (e.g., accessibility relations, similarity metrics). For them, the Oswald pair expresses *different truth-conditional content* because the antecedent of a counterfactual shifts the world of evaluation. **Their project collapses your two questions**: the proposition expressed *is* what you believe/assert.  
     - The **non-truth-conditional camp** (e.g., Adams, Edgington, Gibbard) denies that conditionals express propositions *at all*. They argue that "meaning" is exhausted by inferential role (e.g., Ramsey Test dynamics) and that truth conditions are illusory. For them, your second question (how conditionals are held/asserted) *replaces* the first. The Oswald pair differs only in epistemic context (what is held fixed), not in semantic content.  

  2. **Active Rejection of the Other’s Framework**  
     - Truth-conditional theorists view probabilistic/inferential accounts as *inadequate* for explaining embedding (e.g., conditionals in disjunctions or negation). They see the triviality results as puzzles to solve within truth-conditional semantics (e.g., via dynamic semantics).  
     - Non-truth-conditional theorists use triviality results to argue that truth-conditional semantics is *impossible* for conditionals. They dismiss truth conditions as irrelevant to meaning, which they define in terms of rational update (e.g., conditional credence).  

  3. **No Neutral Ground**  
     Neither camp treats the questions as independent. Truth-conditional theorists see inferential roles as downstream of propositions; non-truth-conditionalists see propositions as misguided reifications. This is not two answers to "what is meaning?"—it is **two incompatible conceptions of meaning itself**.  

  ---

  ### **The Real Disagreement: Four Layers**
  1. **Domain of Semantics**  
     - *Truth-conditional view*: Semantics studies truth-conditional content.  
     - *Non-truth-conditional view*: Semantics studies conventions governing use.  
     → **Disagreement**: What counts as "semantic data"? Embedding behavior (e.g., "If A, then if B, C") vs. assertability patterns.  

  2. **Standard for Adequacy**  
     - *Truth-conditional view*: A theory must assign truth conditions compatible with intuition and logic.  
     - *Non-truth-conditional view*: A theory must predict rational credence and assertion.  
     → **Disagreement**: Is the probability/assertability of conditionals primary or derivative?  

  3. **Metaphysics of Truth**  
     - *Truth-conditional view*: Conditionals are truth-apt; their truth supervenes on facts.  
     - *Non-truth-conditional view*: Conditionals lack truth values; they are tools for reasoning.  
     → **Disagreement**: Is there a fact of the matter about whether "If Oswald hadn’t shot, someone else would have" is true?  

  4. **Starting Intuitions**  
     - *Truth-conditional view*: Intuitions about truth in scenarios (e.g., in possible worlds) are foundational.  
     - *Non-truth-conditional view*: Intuitions about rational belief update (e.g., Ramsey Test) are foundational.  
     → **Disagreement**: Which intuitions are "rock bottom"?  

  ---

  ### **What Would Count as Progress**
  Progress requires addressing the methodological rift. Potential paths:  
  1. **A Formal Bridge**  
     A model unifying truth conditions and inferential roles (e.g., a dynamic semantics where truth conditions emerge from update rules). *Obstacle*: Triviality results suggest such models risk inconsistency.  

  2. **A Principled Demarcation**  
     Explicitly decoupling the projects:  
     - **Project A**: Assign truth conditions to conditionals for compositional purposes.  
     - **Project B**: Explain conditional assertion/belief without truth conditions.  
     → *Progress*: If both camps accept this division (e.g., truth conditions for embedding, inferential roles for simple assertions), the dispute deflates. *Challenge*: Hardliners reject legitimacy of the other project.  

  3. **Reinterpreting Triviality Results**  
     Showing that triviality only threatens *specific* truth-conditional accounts (e.g., those identifying P(if A, B) with P(B|A)) but not others (e.g., context-dependent or dynamic semantics). *Progress*: Truth-conditionalists gain ground if they meet probabilistic constraints.  

  4. **Abandoning a Question**  
     - *Option 1*: Truth-conditionalists concede that some conditionals (e.g., future indicatives) lack classical truth values.  
     - *Option 2*: Non-truth-conditionalists concede that truth conditions are useful for embedding (e.g., adopting a minimal truth-aptness).  
     → *Progress*: If a major figure shifts position (e.g., Edgington’s later work allowing limited truth-aptness).  

  5. **A New Empirical Standard**  
     Cognitive science evidence (e.g., neural correlates of processing indicatives vs. counterfactuals) could sway the debate. If indicatives/counterfactuals activate distinct brain regions, it favors semantic bifurcation; if not, it favors a unified pragmatic mechanism.  

  ---

  ### **Why the Impasse Persists**
  The dispute is **not purely verbal** because it stems from divergent foundational commitments:  
  - Truth-conditionalists prioritize **systematic compositional semantics**.  
  - Non-truth-conditionalists prioritize **rational agent models**.  
  Neither can "lose" without abandoning core tenets. Progress is unlikely without a paradigm shift (e.g., cognitive pragmatics superseding both) or a synthetic framework that subsumes both projects. Until then, the impasse is a **dialectical stalemate** fueled by incompatible starting points.
