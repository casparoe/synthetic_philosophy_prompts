answer: |-
  I defend expected-value maximization (EVM) as the correct rule: **Act so as to maximize the sum of possible outcomes weighted by their subjective probabilities.** Crucially, probabilities must be *well-founded*—grounded in empirical evidence or coherent extrapolation from known physics—not merely conceivable. For Pascal's mugging, I reject assigning any non-zero probability to the mugger's threat. While you grant the probability is "minute but not zero," I argue that hypotheses untethered from causal mechanisms or observational constraints aren't proper subjects for probabilistic belief. The mugger's claim ("I control a hidden dimension inflicting 3^^^3 units of suffering") isn't just improbable; it's *categorically distinct* from claims like "a comet might destroy Earth," which, while unlikely, connect to known causal laws. My criterion: **A hypothesis carries a probability only if it can be coherently embedded in our best scientific understanding of causality and evidence.** This excludes the mugger (no plausible mechanism, no prior instances, no testable predictions) but includes genuine long-tail risks (e.g., vacuum decay). It's not ad hoc—it flows from Bayesian epistemology, where probabilities represent degrees of belief constrained by rationality and evidence, not arbitrary imagination. Thus, the mugger’s "probability" isn’t infinitesimal; it’s undefined, making his threat’s expected value zero.  

  Your move.
