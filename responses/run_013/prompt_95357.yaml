          But if the imposition of the tax rate in Round 2 reduces the perceived legitimacy, we might see more evasion in Round 2? This would be a psychological effect.

     But note: the participants have the same c_i and the same parameters, so they should make the same decision. But they might be influenced by the group behavior in Round 1? Or they might learn that evasion is profitable? 

     To control for learning, we can run Round 2 without any information about Round 1? But that might be artificial.

     Alternatively, we can run only one round with self-chosen and one with imposed, but then we need two separate groups. That's not possible in the same workshop.

     Given the constraints, we proceed and hope that the debrief can highlight the intended mechanisms.

     What might go wrong:

     Problem 1: The group chooses E=0 and T>0. Then in both rounds, no one complies (because the expected penalty is 0). Then the revenue is 0. Everyone gets 10 - c_i if they comply? But wait, if they comply, they pay T*10 and incur c_i, and get 0 redistribution. So payoff = 10 - T*10 - c_i. But if they evade, they get 10. So no one complies. Then the activity shows nothing about trust.

     Solution: Encourage the group to choose a meaningful E? But we can't interfere. Alternatively, if they choose E=0, then we can see if anyone complies voluntarily. But in our model, they won't. So in the debrief, we can discuss that without enforcement, the system collapses.

     Problem 2: The group chooses a very high E (say 100%) and a high T. Then everyone complies (if 3E-1=2, then threshold c_i* = T*10*2 -> for T=0.5, it's 10, so half the people have c_i<10 and comply, half don't? If T=1, then threshold=20, so everyone complies). Then there is no evasion, and we don't see the effect of imposition.

     Solution: That's okay, we can still discuss.

     Problem 3: In Round 1, the compliance is high because of the self-chosen institution, and in Round 2, it drops because of resentment. That would be the ideal result, but it relies on psychology not captured in the model.

     How to handle without rigging: We don't rig the payoffs. We let the cards fall.

     Debrief:

     We map the game to the Nordic model debate:

        1. The prior homogeneity and small scale: 
              In the game, we had a small group that chose the institution together. This might simulate a homogeneous society with high social trust. But did the group's prior trust affect their choice of E? In the game, they didn't know their types, so they might have chosen a high E to ensure compliance, or they might have chosen a low E trusting that others will comply. We can ask: why did you choose the E you did?

        2. Institutions that generate their own legitimacy: 
              In the game, the enforcement mechanism (audits and penalties) made trust unnecessary. But did the self-authored institution create a sense of legitimacy that led to higher compliance even beyond the enforcement? In Round 2, when the institution was imposed, did you feel less inclined to comply even though the rules were the same?

        3. The causality is bidirectional and cannot be separated:
              The discussion might reveal that the institution's design (chosen by the group) might have fostered trust, and the existing trust might have allowed for a lighter enforcement. But in the game, we don't have a dynamic of trust building.

     What the activity cannot reproduce:

          - The activity cannot reproduce the social norms and the endogenous change in trust. In the real world, a well-functioning institution might increase trust over time, and a high-trust society might sustain institutions with lower enforcement. The game is static.

          - The activity might not show a difference between self-authored and imposed institutions because the decision is based on a cost-benefit analysis that doesn't include legitimacy. We have to supply in the debrief the idea that in the real world, legitimacy might affect compliance beyond the enforcement.

     Empirical literature:

          - There is evidence that tax compliance is higher when taxpayers perceive the tax system as fair and legitimate (see: Kirchler, Hoelzl, and Wahl, 2008). This is contested in the sense that the magnitude and mechanisms are debated.

          - The Nordic model: It is settled that the Nordic countries have high tax compliance and high levels of trust. It is contested whether the high trust is a cause or a consequence of the institutions (see: Bergh and Bjørnskov, 2011; and Rothstein, 1998).

     Instructions to participants (without mentioning trust):

          "We are going to play a game about public finance. In this game, you will be citizens of a small society. The society needs to fund public goods through taxation. 

          First, as a group, you will decide on two parameters of the tax system: 
            - The tax rate: a percentage of your income that will be taken if you pay your taxes.
            - The audit rate: the probability that a tax evader will be caught.

          After you decide these, each of you will be assigned a private cost of compliance. This cost is different for each person and represents the burden of complying with the tax code (like the time and effort). You will not know others' costs.

          Then, you will decide whether to comply (pay the tax) or evade.

          If you comply, you pay the tax and also incur your compliance cost.
          If you evade, you do not pay the tax and do not incur the compliance cost, but if you are audited (which happens with the audit rate you chose), you will pay a penalty of three times the tax you owed.

          The tax revenue (from compliers and penalties from caught evaders) will be pooled and then redistributed equally to every member of the society.

          We will play two rounds. In the first round, you will operate under the rules you chose. In the second round, the tax rate will be set externally to the same level as you chose, and the audit rate remains as you chose.

          Your goal is to maximize your own points."

     Then conduct Round 0, Round 1, Round 2.

     Time:

          Round 0: 10 minutes (discussion and vote)
          Round 1: 15 minutes (distribute cost cards, decision, collection, computation, reporting)
          Round 2: 10 minutes (decision, collection, computation, reporting)
          Debrief: 20 minutes.

     Total: 55 minutes. We can cut Round 0 to 7 minutes, Round 1 to 13, Round 2 to 10, to fit 50 minutes.

     What if one round has near-universal cooperation or near-total defection?

          - If near-total defection in Round 1 (because the group chose low E and high T, for instance), then in Round 2 we will have the same. We can still debrief: why did you choose low enforcement? Was it because you trusted others to comply? 

          - If near-universal cooperation in Round 1, then Round 2 might show the same. We can ask: did the external imposition make you feel differently even though you still complied?

     We might not get the variation we want, but the activity still shows the mechanics of the institution.

     Finally, the design and the diagnosis must be separate. In the debrief, we present the game as a model that illustrates the mechanics of enforcement, and then we discuss the real-world complexities.

     Let's write the detailed procedure.
answer: |-
  Below is a comprehensive design for your workshop activity, structured to meet your specifications while addressing the nuanced relationship between institutions, trust, and equilibrium. The activity avoids monetary payoffs, incorporates hidden cost types, includes a rule-choosing phase, and contrasts self-authored versus externally imposed institutions. The debrief explicitly maps outcomes to the Nordic model debate.

  ---

  ### **Activity Design: "The Social Contract Game"**  
  **Duration**: 50 minutes (activity) + 20 minutes (debrief)  
  **Participants**: 12–16 graduate students  
  **Objective**: Simulate how institutions and mutual expectations co-constitute a stable equilibrium (the "package deal").  

  ---

  #### **Materials**  
  - **Cost cards**: 40+ cards with integers (e.g., 1–20) drawn from a uniform distribution.  
  - **Decision slips**: Paper for compliance choices.  
  - **Calculator**: For real-time payoff computation.  
  - **Display**: Projector/whiteboard to show group choices and results.  

  ---

  #### **Step-by-Step Procedure**  
  **Round 0: Rule Creation (10 minutes)**  
  - **Instructions**:  
    > "Your group represents citizens designing a tax system. You must collectively decide two rules:  
    > 1. **Tax Rate (T)**: % of income paid as tax (options: 0%, 20%, 40%, 60%, 80%).  
    > 2. **Enforcement Level (E)**: Probability of auditing evaders (options: 0%, 25%, 50%, 75%, 100%).  
    > You will not know your personal economic status until *after* rules are set. All tax revenue is redistributed equally."  
  - **Process**:  
    - Facilitator anonymizes votes (e.g., written ballots) to determine median T and E.  
    - Record choices publicly.  
  - **Key**: Participants build institutions *before* knowing if they will be net contributors (high-cost) or beneficiaries (low-cost).  

  **Round 1: Self-Authored Institution (15 minutes)**  
  - **Setup**:  
    - Distribute one **cost card** (c_i) to each participant face-down (e.g., "Cost of Compliance = 5").  
    - Each has a fixed **endowment** (Y = 10 points).  
  - **Decision**:  
    > "Choose to **Comply** (pay tax) or **Evade**. If you evade and are audited (based on E), you pay a penalty (3× tax owed)."  
    - Payoff structure:  
      - **Comply**: `(Y − T×Y) − c_i + (Total Revenue ÷ N)`  
      - **Evade (not caught)**: `Y + (Total Revenue ÷ N)`  
      - **Evade (caught)**: `(Y − 3×T×Y) + (Total Revenue ÷ N)`  
  - **Process**:  
    - Collect decisions privately.  
    - Calculate **Total Revenue** = (Compliers × T×Y) + (Caught Evaders × 3×T×Y).  
    - Redistribute revenue equally. Report individual payoffs and aggregate compliance.  

  **Round 2: Externally Imposed Institution (10 minutes)**  
  - **Setup**:  
    - **Same cost cards** as Round 1 (participants retain type).  
    - Announce: "An external authority imposes Tax Rate = T (same as your group’s median). Enforcement remains E."  
  - **Decision**:  
    - Repeat Round 1 process with identical rules but imposed without consent.  
  - **Key**: Lets participants *feel* the difference between self-authored and imposed rules.  

  **Rounds 3–4 (Optional, 15 minutes)**  
  - Repeat Rounds 1–2 with **new cost cards** to test robustness.  
  - *Skip if short on time; focus debrief on Rounds 1–2*.  

  ---

  #### **Predictable Challenges & Solutions**  
  1. **Universal Cooperation/Defection**:  
     - **Risk**: High E or T may force compliance; low E may cause collapse.  
     - **Mitigation**:  
       - Use a **skewed cost distribution** (e.g., 30% high-cost cards: 15–20) to ensure divergent interests.  
       - If collapse occurs, **debrief it**: "Why did this happen? Would prior trust have changed outcomes?"  

  2. **Calculation Delays**:  
     - **Solution**: Pre-calculate penalties/revenue for common (T, E) combinations.  

  3. **Participant Frustration**:  
     - **Solution**: Emphasize that the game is a *metaphor*, not empirical proof.  

  ---

  #### **Debrief Structure (20 minutes)**  
  **Guiding Questions**:  
  1. **Round 0**: "Why did you choose this (T, E)? Did you assume others would comply?"  
  2. **Round 1 vs. 2**: "Did compliance change under the imposed tax? Did your *personal willingness* shift even with identical rules?"  
  3. **Cost Cards**: "How did not knowing your type affect rule creation? Did high-cost participants resent the system?"  

  **Mapping to Nordic Model Debate**:  
  | **Game Moment**          | **Real-World Debate**                                                                 | **Empirical Status**                                                                 |
  |--------------------------|---------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | **Rule creation (T, E)** | Institutions as *self-reinforcing*: Legitimacy from co-authorship.                   | **Contested**: Rothstein (1998) vs. Bergh & Bjørnskov (2014) on causality.           |
  | **Compliance shifts**    | Trust as *prior condition*: Homogeneity/small scale enables cooperation.             | **Settled**: Trust correlates with compliance (Svallfors, 2013), but causality debated. |
  | **External imposition**  | *Exportability limit*: Imposed rules lack legitimacy, disrupting equilibrium.         | **Settled**: IMF/OECD studies show compliance drops when trust is low (OECD, 2019).  |

  **Limitations to Acknowledge**:  
  - The game **cannot replicate endogenous trust-building** (e.g., institutions fostering trust over generations).  
  - **Supply in debrief**: Discuss path-dependency (e.g., Rothstein’s "moral economies") and historical/cultural context (e.g., Lappi-Seppälä’s work on Nordic legal culture).  

  ---

  #### **Facilitation Notes**  
  - **Neutral Framing**: Avoid terms like "trust" or "Nordic model" until debrief. Use "public revenue system."  
  - **Payoff Clarity**: Express costs/penalties in points (not money). Example:  
    > "Tax Rate = 40% → Pay 4 points if complying. Penalty = 12 points if caught evading."  
  - **Ethical Safeguard**: Allow participants to skip/opt-out.  

  This design forces participants to confront the interdependence of institutions and expectations. By generating their own data, they will viscerally grasp why the Nordic model resists modular exportation—setting the stage for a nuanced, empirically grounded debate.
