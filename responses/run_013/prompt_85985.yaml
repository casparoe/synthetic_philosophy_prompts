prompt: |-
  Ok so I need a second opinion, because I had a four hour argument with my friend Nadia on Sunday that ate my entire evening and I still can't tell whether we were even disagreeing.

  The fight was about whether information can be bad for you. Not bad in a moral way, just bad in the plain sense that you're worse off for having it. My cases: (1) a test that tells you you've got something that'll kill you around 60 and there is nothing whatsoever you can do about it, so all you get is thirty years of dread; (2) finding out something about someone you love that changes nothing practically, no decision comes out any differently, you just know it now and you can't un-know it; (3) a mate of mine at poker who can't keep his face still, so the more he knows about his own hand the more readable he is, and knowing more literally costs him money; (4) someone who's bad with numbers, who gets a risk estimate, panics, and chooses worse than they would have if they'd stayed ignorant.

  Nadia says all four are definately impossible, as a matter of theorem. She had a name for it, Good's theorem or something like that, and her version goes: if the information is free and you're going to use it to make a decision, then it can't leave you worse off on average, because whatever you'd do after hearing the news, you could have done that exact thing without the news. She reckons there's a whole literature on this that's never been settled. She also said something I couldn't follow about the theorem only covering the case where what you care about is what you do and what happens, and not the case where you also care about what you believe.

  My hypothesis, and I'd like you to tell me if it's wrong: this is a verbal fight. She's talking about the value of information for my decisions, I'm talking about the value of it for my life, and once you seperate those the theorem is plainly true and my examples plainly aren't counterexamples to it. But if that's the whole story I want to know what's left over, because it still seems like a real question whether the thing the theorem is about is the thing people mean when they say they'd rather not know.

  Don't give me a tour of decision theory. I want to know what kind of disagreement this actually is, argued out of what she's claiming and what I'm claiming.

  Format:

  - Bottom line, 2-3 sentences, up front.
  - What the theorem actually covers: the claim stated properly, plus what it doesn't say, ~150 words.
  - Where my four cases land: for each one, say whether it's a real counterexample, a case the theorem doesn't reach, or a case where I've smuggled something in, ~300 words.
  - The diagnosis: what kind of disagreement this is, and whether it's verbal, substantive, or both, ~400 words.
  - What would settle it: the distinction, example, or result that would move this, or an argument that nothing will, ~150 words.
reasoning: |-
  Okay, the user had a lengthy argument with their friend Nadia about whether information can be bad for you. They provided four examples where knowing something seems harmful: a fatal disease prediction, unwanted knowledge about a loved one, poker tells making someone readable, and misinterpreting risk estimates. Nadia countered with Good's theorem, claiming information can't harm you if it's free and used for decisions. The user thinks they're talking past each other—Nadia focuses on decision-making value, while they care about overall life impact.

  Hmm, this seems like a classic case of misaligned definitions. Good's theorem is technically correct within its narrow scope of instrumental value for decisions. But the user's examples highlight non-instrumental harms—emotional distress, irreversible changes in perspective, or situations where knowledge actively undermines performance. Nadia's "impossible" stance likely stems from overextending the theorem beyond its assumptions. 

  Interesting how the poker example reveals a gap in the theorem: when information becomes a liability itself (through involuntary tells), it violates the "free" condition. Similarly, the disease diagnosis case shows how information can have intrinsic negative value regardless of decisions. The user's hypothesis about verbal disagreement feels spot-on—they're using "bad for you" in broader existential terms versus Nadia's decision-theoretic framework. 

  The real tension lies in whether we should prioritize the theorem's mathematical truth or the phenomenological reality of suffering from knowledge. No wonder they argued for hours; this bridges philosophy, psychology, and game theory. To resolve it, they'd need to agree on whether "harm" includes subjective experience or only measurable outcomes. A concrete example like mandatory genetic testing might help—if Nadia concedes someone could rationally avoid such tests despite Good's theorem, that'd validate the user's point.
answer: |-
  ### Bottom line
  You and Nadia are largely talking past each other, but there's substantive disagreement too. Good's Theorem (correctly) shows that free information cannot harm your *decision outcomes* when rationally acted upon. Your examples demonstrate that information can harm *well-being* through psychological, behavioral, or non-instrumental pathways the theorem ignores. The core clash is between decision-theoretic "value" and holistic life impact.

  ### What Good's Theorem Actually Covers
  **The claim:** Good's Theorem (1950) states that for a rational agent, *free* information has *non-negative expected value* **for the decision it informs**. If you can act on the information at no cost, it cannot make your chosen action worse *in expectation* than acting without it. This is because you can always ignore the information and do what you would have done anyway ("conditionalization"). The value is purely *instrumental*: how it improves decision outcomes relative to your goals.

  **What it doesn't cover:**
  1.  **Costs of acquiring/processing information:** It assumes information is "free" (no resource cost, time, or cognitive load).
  2.  **Intrinsic value of beliefs/ignorance:** It ignores whether knowing/not-knowing *itself* affects utility (e.g., dread, shattered illusions).
  3.  **Psychological/behavioral effects:** It assumes rational updating and optimal action. It doesn't model how information might *cause* irrational panic, paralysis, or involuntary signals that hurt you.
  4.  **Non-decisional contexts:** It only applies when the information informs a specific action. If no action changes, the theorem is silent.

  ### Where Your Four Cases Land
  1.  **Fatal Disease Test:** **Not a counterexample; the theorem doesn't reach it.** The harm comes from the *intrinsic disutility* of dread, not worsened decisions. Good's Theorem would say the information *could* help you optimize end-of-life plans (e.g., saving more for care). If you literally make *no different decisions* and just suffer dread, the theorem's condition (using info for a decision) isn't met. The harm is non-instrumental.
  2.  **Unwanted Knowledge About a Loved One:** **Not a counterexample; the theorem doesn't reach it.** This is purely about the intrinsic disutility of the belief itself ("knowledge as a burden"). No decision is altered, so the theorem isn't engaged. The harm exists outside its scope.
  3.  **Poker Tells:** **Counterexample *to the theorem's assumptions*.** Good's Theorem assumes information is "free." Here, *possessing* the knowledge has a direct *cost*: it creates involuntary signals opponents exploit. The information isn't free; it leaks behaviorally. Even if he tries to act ignorant, the knowledge *changes his physiology* in costly ways. This violates the "free information" premise.
  4.  **Misinterpreted Risk Estimate:** **Counterexample *to the theorem's rationality assumption*.** Good's Theorem assumes rational updating and action. Here, the agent panics and acts *irrationally* due to the information. The theorem guarantees non-negative value *only if* you update beliefs correctly and choose the optimal action given those beliefs. If information causes irrationality (misinterpretation, panic), it *can* lead to worse decisions than willful ignorance.

  ### The Diagnosis: Verbal *and* Substantive
  1.  **Verbal Disagreement (Talking Past):** This is central. You define "bad for you" as **overall well-being/happiness/life quality**. Nadia defines "bad for you" narrowly as **worsening the expected outcome of a specific decision you were going to make anyway**. Good's Theorem is airtight on its narrow definition. Your examples are compelling on your broader definition. You're using "value" differently – instrumental (Nadia) vs. intrinsic/holistic (You).
  2.  **Substantive Disagreement:** Nadia's claim that your cases are "definitely impossible" is wrong, even within decision theory/Good's framework.
      *   Cases 1 & 2: She overlooks that the theorem *only applies if the information changes a decision*. If no decision changes, the theorem says *nothing* about intrinsic harm. Her claim overextends the theorem.
      *   Case 3: She ignores that "free information" includes no behavioral cost. The poker player *pays a cost* just by *having* the knowledge.
      *   Case 4: She assumes perfect rationality. The theorem doesn't protect against information *causing* irrationality.
  3.  **The Core Philosophical Clash:** Underlying this is a debate about rational agency. Good's Theorem reflects a "pure" Bayesian decision theory view: agents are belief-updating machines optimizing actions towards fixed goals. Value comes *only* from outcomes. Your view reflects a broader, more psychological/humanistic view: beliefs themselves have valence, humans aren't perfectly rational, and well-being encompasses more than decision outcomes (e.g., peace of mind). Nadia's theorem addresses the former; your examples highlight limits of that model for capturing lived experience.

  ### What Would Settle It
  1.  **Clarify Definitions:** Explicitly agree on what "bad for you" and "value" mean *before* discussing examples. Separate "instrumental value for decisions" from "impact on overall well-being". Admit both concepts exist.
  2.  **Concede the Theorem's Limits:** Nadia must acknowledge Good's Theorem *only* guarantees non-negative instrumental value *if* information is free, used rationally for a decision, and beliefs aren't intrinsically valued. Your Cases 1, 2, and arguably 3 violate these.
  3.  **Focus on Case 4:** This is the strongest challenge *within* decision theory. If information reliably causes irrationality (common in humans), its *net* instrumental value *can* be negative compared to deliberate ignorance, violating the theorem's *practical* application. Acknowledging bounded rationality undermines the theorem's real-world guarantee.
  4.  **Agree on Scope:** The theorem is true *for what it describes* (rational agents, free info, instrumental value). Your examples show *why* people often care about more than what the theorem describes. This isn't an "unsettled literature" on the theorem itself; it's settled. The "unsettled" part is whether the theorem's narrow scope captures the full human experience of information's value/cost.
