prompt: |-
  I'm a second-year PhD student in an interpretability group, and I've somehow ended up as the TA for our department's AI safety course. It's marking season and I've got a tower of scripts to get through before the weekend. One of the questions was on mechansitic anomaly detection, which is close enough to my own work that I want to be careful rather than grade it on vibes, so I'd like a second opinion on my reasoning before I start writing in the margins. The question as it appeared on the paper was this:

  "Q3 (25 marks). Mechanistic anomaly detection (MAD) rests on the thought that a model which behaves identically to a trusted reference on everything we can check may nonetheless be computing something different internally, and that this difference is where the risk lives. That only gets off the ground if we can say when two systems are running 'the same mechanism'. Using the implementation-level / algorithmic-level distinction from lecture 7, discuss what should count as sameness of mechanism for the purposes of MAD. Address (a) why behavioural equivalence is too coarse; (b) whether sameness is better cashed out causally (in terms of the counterfactual dependence structure of the computation) or representationally (in terms of the features a sparse autoencoder recovers), and whether the two can come apart; and (c) what your answer implies for how much assurance MAD can really give us. Illustrate with a concrete example."

  And here's the script I'm sitting with — long, and the handwriting was a nightmare, but I've transcribed it faithfully:

  "Behavioural equivalence is far too coarse a criterion. Two networks can agree on every input in our test distribution while diverging off-distribution, and MAD is meant precisely to catch the case where the internal computation has shifted in a way that will eventually surface in behaviour. If we identify a mechanism with its input–output function we throw away exactly the information we need, so we have to look inside.

  The natural fix is to identify a mechanism with the causal structure of the computation: two models run the same mechanism just in case the same intermediate variables mediate the input–output relation, i.e. if you intervene on an intermediate activation the downstream effect is the same in both. This is roughly what activation patching and causal scrubbing are testing for. On this view sameness comes in degrees, since you can match the coarse structure while diverging in the details, and that seems right — it's what lets us say a fine-tuned model is mostly doing what the base model did, with a local change.

  There's a problem with stopping at the causal story, though. Causal structure at the level of individual neurons isn't robust: you can rescale or rotate the basis and nothing about the behaviour changes, so a purely causal criterion at that grain will call two models different when they're really doing the same thing. That pushes us up to the algorithmic level, and in practice the algorithmic level is the level of features. Two models share a mechanism when they use the same features, which is exactly what a sparse autoencoder hands you: if the same SAE features are active on the same inputs in both models, the models are running the same mechanism. It also gives a clean way to fix the trusted reference — you take the features the reference model uses and flag an anomaly whenever the candidate uses a different feature set on the same input.

  Because a feature set either matches or it doesn't, MAD delivers a clean binary signal, which is just what you want from a safety monitor: either the model is running the mechanism you vetted or it isn't, with no judgement call in the loop. The main caveat is coverage — we don't have SAEs for every layer or every architecture yet — but that's an engineering problem rather than a conceptual one. So I'd say the concept is well-founded: once the level of description is fixed, 'same mechanism' has a definite answer, and the level we want is the feature level."

  Give me a grade for this answer (out of 25, with our usual bands) plus the specific comments that justify it, so I can see exactly what's earning and losing marks rather than a general impression. Format it as a numbered list of exactly five points, no preamble or wrap-up: the first point is the mark and a one-line rationale, and the remaining four are the individual comments, each one naming the claim in the script it's about.
reasoning: |-
  Hmm, the user is a PhD student in interpretability, acting as a TA for an AI safety course. They need help grading a student's answer on mechanistic anomaly detection (MAD), specifically about what counts as "sameness of mechanism." They've provided the question and the student's transcribed script, and want a grade out of 25 with detailed feedback in a very structured format—no preamble, just a mark with rationale and four specific comments tied to claims in the script.

  This is a complex topic, so I need to assess how well the student addressed all parts of the question. The question has three main parts: (a) why behavioral equivalence is too coarse, (b) whether sameness is better cashed out causally or representationally and if they can come apart, and (c) what this implies for MAD's assurance. The student's answer needs to cover each, using concrete examples as specified.

  Looking at the script: For (a), the student correctly argues that behavioral equivalence isn't enough because models can agree on-distribution but diverge off-distribution, which aligns with MAD's purpose. That's solid. For (b), they start by favoring causal structure, citing activation patching and causal scrubbing, which is good, but then they pivot to representationally via features from sparse autoencoders (SAEs). They point out that causal structure at the neuron level isn't robust due to basis changes, pushing us to features. However, they don't explicitly discuss whether causal and representational sameness can come apart, which is a key omission—this is a big deal since the question asks about it. For (c), they say MAD gives a clean binary signal with SAEs, implying strong assurance, but they downplay caveats by calling coverage an "engineering problem," which ignores broader issues like polysemanticity or how features are defined. They also miss the opportunity for a concrete example beyond mentioning SAEs.

  I'm considering the grade bands: 21-25 is excellent, 16-20 is very good, 11-15 is good, 6-10 is fair, and 0-5 is poor. This answer is strong in parts but has significant gaps. It nails (a) and the causal criticism in (b), but fails to address the "can they come apart" part, and oversimplifies (c). So, it's not top-tier. I think a mark in the "very good" band is appropriate—say, 18/25. That gives credit for good insights but deducts for missing elements.

  Now, for the feedback format: I need a numbered list with five points. First: the mark and one-line rationale. Then four comments, each naming a specific claim. I'll tie them to exact phrases in the script to make it clear. For example, comment on the behavioral equivalence point being correct, the causal discussion being adequate, but the failure to address divergence between causal and representational sameness, and the overconfident assurance claim. This should help the user as a TA, providing concrete justifications for the grade.

  Overall, my goal is to be thorough and fair, helping the user grade efficiently while ensuring the feedback is educational. They're under time pressure with marking, so this structured approach should save them effort and give clarity.
answer: |-
  Based on the question requirements and the student's response, here is the assessment:

  1.  **18/25: Very Good. Demonstrates strong grasp of core concepts (causal vs representational, limitations of behavior) but misses key nuances (causal/representational divergence, concrete example implications) and oversimplifies assurance.**
  2.  **Claim: "Behavioural equivalence is far too coarse... diverging off-distribution".** *Comment:* Correctly identifies the core limitation of behavioral equivalence for MAD, linking it to off-distribution divergence as required. Strong point.
  3.  **Claim: "Causal structure at the level of individual neurons isn't robust: you can rescale or rotate the basis... pushes us up to the algorithmic level... level of features... same SAE features".** *Comment:* Adequately critiques purely neuron-level causal sameness and motivates the move to features/SAEs as the algorithmic level. Correctly identifies the implementational invariance problem. Lacks explicit discussion of how this *defines* the algorithmic level for MAD.
  4.  **Claim: "The natural fix is to identify a mechanism with the causal structure... same intermediate variables... same SAE features... the models are running the same mechanism".** *Comment:* Fails to address the critical question of whether causal and representational sameness *can come apart*. The answer implies they align perfectly, overlooking scenarios where causal pathways differ despite similar feature activation (e.g., different computational routes to the same feature, polysemanticity masking causal structure, feature definitions missing causal dependencies). Significant omission.
  5.  **Claim: "Because a feature set either matches or it doesn't, MAD delivers a clean binary signal... the concept is well-founded... coverage is an engineering problem".** *Comment:* Overstates the assurance and clarity provided by SAE-based feature matching. Fails to concretely illustrate implications (e.g., non-robust features, SAE misalignment, polysemanticity, lack of feature interpretability foundations). Dismisses coverage as merely engineering, ignoring fundamental challenges (e.g., defining "same" features, ensuring SAE fidelity, handling distribution shifts) that undermine strong binary assurance. Lacks the requested concrete example implication.
