prompt: |-
  Canada's answer to the Quebec question has hardened into something like a doctrine, and I would like to know what it commits us to. The Supreme Court's secession reference holds that Quebec has no right to leave unilaterally, but that a clear majority on a clear question would put the other parties under an obligation to negotiate; the Clarity Act that followed gives the federal House of Commons the power to rule, before the vote is held, on whether a referendum question is clear enough, and it leaves the House to judge whether the majority is clear enough as well, with no threshold written into the statute. The same government, meanwhile, recognized Kosovo's unilateral declaration of independence without much agonizing; and when the Cree and the Inuit of Nunavik made the same argument one level down, that they too were a people whose consent was required, nobody took it to be a claim of the same kind.

  What theory of self-determination does this practice presuppose? On its face it looks like a remedial or negotiated view: a people's right is not to leave but to be taken seriously as a claimant, and the claimant is fixed by existing provincial boundaries, since no one below the province votes on whether the province goes. Are those two commitments a single package or two separable ones, and is either really required, or would other theories license the same practice just as well? Does the doctrine need the idea that a bare majority can never dissolve a state while a clear majority can, and if so, what is doing the work in the word clear, legitimacy, prudence, or a hidden supermajority rule? I would like the implicit theory reconstructed, the rival views it quietly rules out identified, and an honest account of where the practice is merely underdetermined rather than committed. Then tell me what would have to change in the practice if we replaced the implicit view with a plain right of any self-defined majority to secede, or with an absolute rule that existing borders are never redrawn. No citations needed. Please answer in continuous prose, without headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, the user is asking about Canada's approach to Quebec secession and self-determination. They reference the Supreme Court's secession reference, the Clarity Act, and contrast this with Canada's recognition of Kosovo and indigenous claims. The core question is about the implicit theory behind this practice.

  First, I need to unpack the key elements of Canada's position. The Supreme Court said Quebec can't unilaterally secede, but a clear majority would trigger negotiation obligations. The Clarity Act gives Parliament power to judge the clarity of the question and majority size. This seems to prioritize process over predetermined outcomes.

  The user notes contradictions: Canada recognized Kosovo unilaterally but doesn't accept similar indigenous claims. That suggests the doctrine isn't universal but context-dependent. The provincial boundary seems crucial - only Quebec as a whole is recognized as having a claim, not sub-groups.

  The implicit theory appears to be remedial/negotiated: self-determination means being heard, not automatic secession. Legitimacy comes from existing structures (provinces), not self-defined groups. "Clear majority" avoids strict thresholds but implies qualitative assessment - stability, inclusivity, certainty.

  The word "clear" likely combines legitimacy (broad consensus) and prudence (manageable transition). It's not a hidden supermajority but a buffer against ambiguity. The doctrine rejects both absolute secession rights and absolute border inviolability.

  Rival views ruled out include: 1) primary right secession (any group can leave), 2) absolute territorial integrity (no secession ever), and 3) remedial-only secession (only after grave injustice). Canada's approach is in the middle - negotiated, with procedural safeguards.

  Underdetermined areas: What constitutes "clarity" exactly? How would negotiations proceed? What if talks fail? The doctrine doesn't specify these, leaving room for politics.

  If we swapped the implicit theory: Adopting primary right secession would require accepting unilateral declarations if a group self-identifies. Absolute border inviolability would mean refusing all negotiations, even post-referendum. Both extremes clash with Canada's pragmatic, process-oriented stance.

  The indigenous claims point shows the doctrine's limitation - it privileges provincial units over nations within. This reveals tension between civic and ethnic conceptions of self-determination, a flaw the practice hasn't resolved.
answer: |-
  Canada's practice regarding self-determination, as crystallized in the Quebec secession doctrine, presupposes a theory that is fundamentally **constitutional, procedural, and contextually remedial**, rather than based on inherent or primary rights to unilateral secession. The core commitment is to the **integrity of the existing constitutional order**, where self-determination is expressed *within* the state through democratic participation and negotiation, not *against* it through rupture. This view sees unilateral secession as illegitimate but acknowledges that a decisive democratic mandate within a recognized sub-state unit creates a constitutional *obligation* to negotiate fundamental changes to the federation – potentially including secession – through good faith, reciprocal procedures.

  The two key commitments – **provincial boundaries as the relevant unit** and **negotiation triggered by a clear majority vote** – form a **single, integrated package** within this theory. The provincial boundary is crucial because it represents a pre-existing, democratically constituted political community within the constitutional framework. It provides the stable, recognized territorial and demographic basis for the "people" entitled to express a collective will significant enough to obligate the federation. Sub-provincial groups, like the Cree or Inuit, while possessing significant rights (including self-government), are not recognized within this doctrine as having the *constitutional standing* to trigger secession negotiations *for the entire province* by their own vote, precisely because they exist *within* the provincial unit defined by the constitution. Their consent is vital for legitimacy within the province, but the province as a whole remains the claimant entity vis-à-vis the federation. Similarly, Kosovo was recognized based on a distinct, remedial rationale (extreme, systematic oppression and state collapse within a non-democratic federation), which Canada deliberately distinguishes from Quebec's situation within its own democratic, constitutional order.

  The "clear majority" requirement is central and works through a blend of **legitimacy and prudence**, mediated by **political judgment**. Legitimacy is key: a "clear" majority signifies a durable, unambiguous, and inclusive expression of the popular will, necessary to confer democratic legitimacy on such a profound decision. Prudence dictates that such a mandate must be robust enough to ensure stability during the fraught negotiation process and potential transition. The Clarity Act deliberately avoids a fixed threshold (like 50%+1) because the doctrine implicitly rules out the idea that a bare majority can *dissolve* the state. Instead, it holds that only a majority demonstrating sufficient weight and clarity can *obligate negotiation* about dissolution. "Clear" thus implies qualitative assessment: depth of support (e.g., magnitude, turnout, regional distribution), the absence of ambiguity in the question, and the perceived sustainability of the result. It is **not** a hidden supermajority rule *per se*, but a requirement for a majority whose legitimacy and decisiveness are politically incontestable enough to impose a constitutional duty to negotiate. The work is done by ensuring the democratic mandate is unassailable, making refusal politically and constitutionally untenable.

  This doctrine quietly rules out several rival theories:
  1.  **Primary Right Theories:** It rejects the idea that any "self-defined people" has an inherent right to unilaterally declare independence based solely on their assertion and a majority vote. Kosovo recognition was an exception based on extreme remedial factors, not an endorsement of this primary right view generally.
  2.  **Absolute Territorial Integrity:** It equally rejects the notion that existing borders are eternally sacrosanct. A clear democratic mandate *within the constitutional framework* can force negotiation on altering borders.
  3.  **Purely Remedial Secession (as a unilateral right):** While recognizing extreme oppression as a factor (as in Kosovo), it does not accept it as the *only* justification for secession within Canada. Instead, it creates a constitutional *pathway* for secession via negotiation, triggered democratically, even absent Yugoslavia-level oppression.
  4.  **Ethno-National Determinism:** By fixing the unit at the provincial level (a civic-territorial unit), it rules out theories prioritizing ethnic or linguistic nations as the automatic secessionist unit regardless of constitutional boundaries.

  The practice is **underdetermined** in critical areas:
  *   **Defining "Clarity":** What specific factors (beyond the absence of a fixed number) make a majority "clear"? Turnout level? Distribution across regions? Margin beyond 50%+1? This is left entirely to political judgment.
  *   **Negotiation Parameters:** The obligation is to negotiate "in good faith," but the scope, substance, and end goals (independence, renewed federalism, other) are undefined. What constitutes "good faith"?
  *   **Failure of Negotiations:** What happens if negotiations collapse? Does the original mandate retain force? Does the Court's mention of "unwritten constitutional principles" potentially justify unilateral action then? This remains unresolved.

  **Changing the Implicit Theory:**

  1.  **Adopting a Plain Right of Self-Defined Majorities to Secede Unilaterally:**
      *   **Practice Changes:** The Clarity Act and the requirement for federal approval of question/majority clarity would be scrapped. A Quebec referendum, organized solely by Quebec, based on *its* chosen question and passing by *any* majority (50%+1), would be immediately recognized as achieving independence. No constitutional obligation to negotiate would exist; secession would be automatic upon declaration. Recognition of sub-provincial groups (like the Cree) declaring independence via their own majority vote would become logically consistent, fundamentally fragmenting the state. The rationale for distinguishing Kosovo would vanish. This would abandon the core commitment to constitutional process and negotiation.

  2.  **Adopting an Absolute Rule Against Redrawing Borders:**
      *   **Practice Changes:** The Supreme Court's ruling on the obligation to negotiate would be overruled. The Clarity Act would be repealed or amended to state that no referendum result, regardless of clarity or majority size, creates any obligation to negotiate secession. Provincial secession would be constitutionally impossible. Any unilateral declaration (by Quebec or sub-groups) would be deemed illegal rebellion, met with legal and potentially coercive federal force. Canada's recognition of Kosovo would become a glaring inconsistency requiring repudiation. The "Quebec question" would be definitively closed as a constitutional matter, but likely at the cost of severe political rupture and delegitimization within Quebec.

  In essence, Canada's doctrine is a carefully crafted, pragmatic constitutionalist response designed to manage profound national division. It avoids the destabilizing potential of primary right theories while rejecting the untenable rigidity of absolute territorial integrity. Its strength lies in its procedural focus and political flexibility; its weakness lies in the inherent ambiguities of "clarity" and the unresolved tensions surrounding sub-state national groups and the potential breakdown of negotiations.
