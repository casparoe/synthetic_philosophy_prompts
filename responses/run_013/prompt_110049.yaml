prompt: |-
  I'm doing a master's in international relations and I've been argueing with my friend Priya about military intervention basically all semester. She's not a theorist — she hasn't read much of the just war literature, she just has strong views and (I'm fairly sure) one implicit rule she may not be able to state. Her track record, as best I can reconstruct it: Kosovo 1999, NATO bombing without a Security Council mandate, she says was right, because the ethnic cleansing was happening in plain view and the Russians were never going to allow a resolution. Rwanda 1994, she says a force should have gone in even without authorization, and that the waiting was the whole disaster. Bosnia 1995, the authorized airstrikes that ended the war, right. East Timor 1999, authorized, right. Iraq 2003, wrong, and she gets visibly annoyed when people compare it to Kosovo — for her the difference is that nothing at that scale was being done to civilians and the whole case was WMD and regime change. Libya 2011, right, and she still defends going in, though she thinks NATO should have stopped once Benghazi was safe rather than running the war through to regime change. Syria 2013, after the chemical attack she was against the strike Obama was threatening — no authorization, and she says a punitive strike protects nobody. Bahrain 2011, she says the outside world was right to stay out; a government crushing a protest isn't the same as a government trying to wipe out a population.

  The case we actually keep fighting about is one I invented for a seminar paper, loosely stitched from Darfur and a couple of other things. Country X: the government is deliberately starving a minority region — aid convoys blocked, villages burned, somewhere in the low hundreds of thousands dead over three years and the rate accelerating. The Security Council is deadlocked because one permanent member is X's main arms supplier and keeps vetoing. The African Union has voted to authorize a protection force, and a neighbouring state — which has its own long-standing territorial and ethnic claims in that same region — has offered to lead it. AU troops plus that state's army could plausibly secure the region in a few months, but there's a real chance of a long messy occupation and of the neighbour annexing the area it "protects." I think she'll say yes to intervening, and my seminar friend thinks that would make her inconsistent with her Iraq view.

  I care much less about yes or no than about the rule she's actually running. Give me the two or three rules that fit everything above, say what each one predicts about Country X, tell me which I should bet on and why, and then — this is the part I really want — name the further case I'd have to put to her to tell them apart, i.e. what scenario would reveal whether she's a legalist with an atrocity exception, a straight atrocity-protection person, or someone whose real test is whether the intervening coalition is broad and disinterested.
reasoning: |-
  Okay, let me tackle this user's problem. They're in a Master's program for International Relations and have been debating military intervention with their friend Priya all semester. The user wants to understand the implicit rule Priya uses to decide when intervention is justified, especially since Priya hasn't studied just war theory formally. The user provided Priya's stances on several historical interventions and a hypothetical scenario called Country X.

  First, I need to analyze Priya's positions on each case. She supported Kosovo 1999 without UNSC authorization due to ongoing ethnic cleansing and Russian veto. Rwanda 1994, she wanted intervention even without authorization. Bosnia 1995 was authorized, so she supported it. East Timor 1999, authorized, right. Iraq 2003 was wrong because no large-scale atrocities and the reasons were WMD/regime change. Libya 2011 was right initially but should have stopped after protecting Benghazi. Syria 2013 chemical attacks: against punitive strikes without authorization. Bahrain 2011: no intervention because it was government crushing protests, not genocide.

  Looking at these, the key factors seem to be the presence of large-scale atrocities and the intent behind the intervention. When atrocities are severe (like ethnic cleansing or genocide), Priya is okay bypassing UNSC authorization if it's blocked. But she opposes actions focused on regime change without immediate humanitarian needs. Libya is an exception where she supported initial intervention but not the regime change part. This suggests she distinguishes between protection and political objectives.

  For the hypothetical Country X, the government is starving a minority, hundreds of thousands dead. UNSC deadlocked due to a veto, but AU authorized a force led by a neighboring state with territorial claims. The user thinks Priya will support intervention, but the seminar friend thinks it contradicts her Iraq stance. The user wants to know the underlying rules and how to test them.

  Three potential rules come to mind. Rule 1: Modified Legalism. Intervention is justified only with authorization unless there's extreme atrocities and a blocked UNSC. Rule 2: Atrocity Threshold. Authorization is secondary to stopping mass atrocities, but the intervener must be legitimate. Rule 3: Coalition Composition. The coalition's breadth and disinterest matter more than authorization.

  Comparing Priya's history, she consistently requires severe atrocities to bypass UNSC. Cases like Kosovo and Rwanda show this. Bahrain lacked such atrocities, so no intervention. Syria 2013 was punitive without protection, so against. Libya's regime change overstep is criticized. This points towards Rule 1. For Country X, Rule 1 would support intervention due to atrocities and blocked UNSC, even with AU backing. Rule 2 might be hesitant due to the neighboring state's self-interest. Rule 3 would oppose because the coalition isn't disinterested.

  The user needs a test case to differentiate. A scenario with atrocities and blocked UNSC but an interested intervener. If Priya supports, she leans Rule 1. If she opposes due to intervener motives, it's Rule 2 or 3. A case without atrocities but broad coalition would test Rule 3. The user's deeper need is to understand Priya's framework for consistency, possibly to refine their academic arguments or seminar paper. They value the intellectual exercise over winning the debate, seeking clarity on underlying principles in intervention ethics.
answer: |-
  Based on Priya's historical positions and the Country X scenario, here are the two most plausible underlying rules she operates by, their predictions for Country X, which one to bet on, and the crucial test case to distinguish them:

  **The Two Most Likely Rules:**

  1.  **Rule 1: Modified Legalism with a High Atrocity Threshold & Coalition Legitimacy Override**
      *   **Core Principle:** UN Security Council authorization is the *primary* legitimate basis for military intervention. However, it can be overridden *only* under two strict conditions:
          *   **(a) Extreme Atrocity Threshold:** There is an *ongoing or imminent* campaign of mass atrocity crimes (genocide, ethnic cleansing, large-scale crimes against humanity, mass killing/slaughter) happening "in plain view".
          *   **(b) Blocked Authorization:** It is clear that a veto-wielding P5 member is *unreasonably blocking* authorization *specifically* to protect the perpetrator state from consequences for these atrocities.
      *   **Implicit Constraints:** The intervention *must* have a clear, achievable, and *limited* protective objective (e.g., halting atrocities, protecting safe havens). Regime change as a *primary* or *stated* goal delegitimizes the intervention (Iraq, Libya post-Benghazi). Punitive strikes without protective effect are illegitimate (Syria 2013). The intervening coalition should ideally be broad, preferably regional (like the AU authorization in Country X), lending it a degree of legitimacy even without UNSC approval. The *motivation/morality* of the specific intervener matters less than the coalition's *formal* mandate and the *necessity* of action.
      *   **Fits Her History:**
          *   Kosovo: Atrocities (a) met, Blocked UNSC (b) met (Russia), Limited objective (halt cleansing).
          *   Rwanda: Atrocities (a) met (genocide), Blocked UNSC effectively (inaction/veto threat implied).
          *   Bosnia: Authorized (ideal).
          *   East Timor: Authorized (ideal).
          *   Iraq: Atrocity threshold *not* met at intervention scale ("nothing at that scale"), regime change primary goal, Blocked UNSC *not* solely due to atrocity protection (complex politics).
          *   Libya: Atrocities (imminent Benghazi massacre - (a)), Blocked UNSC likely assumed (Russia/China might have vetoed), Limited initial objective (protect Benghazi) - RIGHT. Overreach into regime change - WRONG.
          *   Syria 2013: Punitive strike, no protective effect - WRONG. (Blocked UNSC was true, but (a) threshold *for this specific action* not met as it wouldn't stop atrocities).
          *   Bahrain: Not mass atrocity crimes (crushing protest ≠ genocide/ethnic cleansing) - WRONG to intervene.
      *   **Prediction for Country X:** **SUPPORT Intervention.** Atrocity Threshold (a) clearly met (deliberate starvation/village burning = crimes against humanity/mass killing, hundreds of thousands dead). Blocked UNSC (b) met (veto by arms supplier protecting perpetrator). Coalition has AU regional authorization (legitimacy override). Risks of messy occupation/annexation are serious *consequences* but don't negate the *immediate necessity* to stop mass dying under this rule. The neighbour's motives are secondary to the coalition mandate and the emergency.

  2.  **Rule 2: Atrocity Prevention Primacy with Intervener Intent Scrutiny**
      *   **Core Principle:** Preventing or stopping *mass atrocity crimes* (genocide, ethnic cleansing, large-scale crimes against humanity) is the *overriding* imperative. Formal authorization (UNSC) is highly desirable but *secondary* to this imperative if blocked. However, the *nature and intent of the intervening force* is crucial. An intervener perceived as acting primarily out of *self-interest* (territorial gain, resource control, regional dominance) rather than *disinterested* humanitarian protection is deeply suspect and potentially delegitimizing, even if the atrocity threshold is met.
      *   **Implicit Constraints:** The intervention must demonstrably aim *primarily* at atrocity cessation. Regime change as a goal often signals non-humanitarian intent or mission creep (Iraq, Libya). A coalition needs to be broad enough to dilute narrow national interests and demonstrate collective humanitarian purpose. A single state acting alone, especially with a history of self-interest in the region, is highly problematic.
      *   **Fits Her History:**
          *   Kosovo: Atrocities primary, NATO broad coalition dilutes individual interests.
          *   Rwanda: Atrocities primary, any coalition would have been preferable to inaction.
          *   Bosnia: Authorized, broad coalition.
          *   East Timor: Authorized, led by Australia but under UN umbrella.
          *   Iraq: Atrocity threshold not primary justification, US-led coalition seen as pursuing self-interest (WMD/regime change/Oil?).
          *   Libya: Initial action (Benghazi) pure protection - RIGHT. Regime change signaled self-interest/political goal - WRONG.
          *   Syria 2013: Strike wouldn't *prevent* atrocities - WRONG.
          *   Bahrain: Not mass atrocity crime - WRONG to intervene.
      *   **Prediction for Country X:** **OPPOSE or STRONGLY HESITATE on Intervention.** While the Atrocity Threshold is clearly met and the UNSC is blocked, the *intervener* is a single neighbouring state with "long-standing territorial and ethnic claims" in the very region. This screams self-interest and potential for exploitation/annexation ("real chance... neighbour annexing the area"). The AU mandate is positive but likely insufficient to overcome the fundamental concern about the *lead intervener's motives*. The risks confirm these fears.

  **Which Rule to Bet On & Why:**

  *   **Bet on Rule 1: Modified Legalism with Atrocity Threshold/Coalition Override.**
  *   **Why:**
      1.  **Kosovo/Iraq Distinction:** Her core argument hinges on the *presence/absence of large-scale, visible atrocities* as the key differentiator, aligning perfectly with Rule 1's threshold. Rule 2's focus on intervener intent doesn't explain this distinction as cleanly – both Kosovo and Iraq involved coalitions led by major powers with complex interests.
      2.  **Libya Nuance:** Her support for the *initial* Libya action (focused on Benghazi protection) and criticism of the *regime change* phase aligns perfectly with Rule 1's emphasis on limited protective objectives overriding blocked authorization, but rejecting mission creep. Rule 2 also fits this, but her primary justification for acting initially seems based on the atrocity/blocked UNSC combo.
      3.  **Bahrain/Syria 2013:** Her reasoning focuses on the *nature of the violence* (not mass atrocity crimes) or the *lack of protective effect*, not primarily the potential self-interest of possible interveners. This fits Rule 1's threshold requirement.
      4.  **Coalition vs. Intervener Intent:** Her acceptance of AU authorization in Country X as sufficient *legitimacy* for action despite the neighbour's motives leans towards Rule 1's focus on formal coalition legitimacy (Regional Organization Mandate) overriding messy local politics/interests, driven by the emergency. Rule 2 is far more wary of the specific intervener's intent.

  **The Crucial Test Case to Tell Them Apart:**

  You need a scenario that isolates the **intervener's motive/self-interest** from the **atrocity/authorization factors**.

  *   **The Test Case: "Country Y"**
      *   **Situation:** A brutal military junta is systematically rounding up and executing members of an ethnic minority group. Satellite imagery and survivor accounts confirm mass graves containing tens of thousands over a few months. The pattern is clear genocide.
      *   **UNSC:** Deadlocked. A permanent member, citing strict non-interference principles, will veto any resolution.
      *   **Potential Intervener:** A single, powerful neighbouring country (Neighbour Z), with no historical ethnic ties or territorial claims in Country Y, but a *well-documented desire* to gain control over Country Y's vast mineral resources. Neighbour Z offers to conduct a swift military operation to destroy the junta's killing apparatus and halt the genocide. They explicitly state their goal is purely humanitarian protection and promise a swift handover to a UN peacekeeping force once security is established. However, their past interventions suggest they often secure lucrative resource contracts in the aftermath. A small regional body, seen as weak and influenced by Neighbour Z, offers a token authorization.

  *   **How the Rules Diverge:**
      *   **Rule 1 (Modified Legalism/Threshold):** Would **SUPPORT** intervention. The Atrocity Threshold (ongoing genocide) is catastrophically high and clear. The UNSC is blocked unreasonably to protect the perpetrator. The limited objective (halting genocide) is clear. While Neighbour Z's resource interests are distasteful and the regional authorization weak, the *immediate necessity to stop genocide* overrides these concerns. The humanitarian goal is primary and achievable.
      *   **Rule 2 (Atrocity Primacy/Intent Scrutiny):** Would **OPPOSE** intervention. While the atrocity threshold is met and UNSC blocked, the *intervener* (Neighbour Z) is acting with a *clear and dominant self-interest* (resource access) masked by humanitarian rhetoric. Their past behaviour confirms this pattern. The weak regional authorization doesn't mitigate this. The risk is that the intervention serves Neighbour Z's interests more than the people of Country Y, potentially leading to neo-colonial exploitation *even if* the genocide is stopped. The tainted intent delegitimizes the action.

  **Conclusion:**

  Bet that Priya operates on **Rule 1: Modified Legalism with a High Atrocity Threshold & Coalition Legitimacy Override**. She will likely support intervention in Country X, dismissing the neighbour's motives as a secondary risk compared to the urgent need to stop mass killing, especially given the AU mandate. To definitively test if her core concern is *necessity* (Rule 1) or *intervener purity* (Rule 2), present her with "Country Y." If she supports Neighbour Z's action despite the blatant resource interest, Rule 1 holds. If she opposes it due to the intervener's motive, she leans towards Rule 2. Her reaction to Country Y will reveal whether the *source* of legitimacy for overriding the UNSC veto is purely the scale of the emergency itself, or if it *also* requires a demonstrably disinterested intervener.
