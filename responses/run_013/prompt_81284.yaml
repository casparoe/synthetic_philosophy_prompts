prompt: |-
  Last night I spent two hours arguing with a close friend about a case that has been in the news here: a patient consented to a procedure after her doctor called it routine, but he did not tell her that the technique was experimental and that he had a financial interest in it; she later said she would never have agreed. My friend's position is that her consent was valid. He kept returning to an analogy: valid consent is like a valid contract. If there was an offer, an acceptance, capacity, and no gun to her head, then she is bound; a little non-disclosure is like a seller not volunteering that a cheaper model exists, which may be shabby but does not void the deal. I think the analogy is doing more work than it can bear, but I want a proper audit rather than a trading of intuitions.

  Please lay out the correspondence table as explicitly as you can. What plays the role of offer, acceptance, consideration, capacity, duress, fraud, materiality, and remedy? Where does the mapping hold, and where does it break? A colleague of mine likes to distinguish a gate model of consent, which asks whether the consenter's will was bypassed or overridden, from a transaction model, which asks whether the terms were fair and understood; my friend's analogy seems to slide between the two without noticing. I am also interested in the features of contract law that the analogy quietly imports: the assumption that the parties are adversarial and self-interested, that the agreement's content is fully specified at the moment of signing, that enforcement is the point of the transaction, that the baseline is no obligation, and that the parties can allocate risk by bargaining. Consent seems to differ on several of these—it can be ongoing and revocable, it can be valid without any formal act, it can be given for non-beneficial or altruistic reasons, and its validity may depend on the quality of the consenter's will rather than on the enforceability of a promise.

  Then tell me whether my friend's conclusion—that signed, capacitous, non-coerced consent is valid despite a significant non-disclosure—survives once the disanalogies are on the table. I would like you to distinguish, if the distinction is defensible, between deception that goes to the nature of the act and deception that goes only to its expected terms or consequences; between non-disclosure that is merely a failure of candor and non-disclosure that amounts to a misdescription of what is being consented to; and between a threshold conception of competence and a decision-relative one. Which of these distinctions does the contract analogy illuminate, and which does it obscure? If the analogy cannot carry the conclusion, what would be a better analogy for what makes consent valid—one that captures the difference between a lie that invalidates consent and a lie that merely makes the consent less wise? I am not looking for a reading list; I want the mapping, the break points, and a verdict on whether the analogy was carrying the argument all along.
reasoning: |-
  Hmm, the user presents an intricate ethical dilemma about medical consent versus contract law analogies. They've clearly spent considerable time analyzing this with their friend and want a systematic deconstruction rather than superficial opinions. 

  The core tension revolves around whether a doctor's failure to disclose his financial interest and the experimental nature of a procedure invalidates consent. The friend's contract analogy seems reductionist - equating signed consent with binding terms while dismissing information asymmetry as mere "seller's silence." But medical ethics operates on fundamentally different principles than commerce. 

  What makes this fascinating is how the user already recognizes key distinctions: they mention gate vs transaction models of consent, the non-adversarial nature of healthcare, and the revocability of consent - all points that undermine the contract analogy. Their request for explicit mapping suggests they want ammunition for their next debate, but also deeper conceptual clarity. 

  The contract analogy breaks most severely on five fronts: consent is revocable (unlike contracts), doesn't require consideration, centers on autonomy rather than exchange, demands higher disclosure standards, and exists within a fiduciary relationship. The doctor here isn't just withholding "cheaper model" info - he's actively misrepresenting the procedure's nature, which courts would likely consider fraud. 

  Perhaps the strongest counter-analogy would be property trespass: consent to enter a house is invalid if you think you're attending a book club but it's actually a sales pitch. The lie changes the fundamental nature of the act. That distinction - deception about act versus terms - is what the contract model dangerously obscures. 

  Ultimately, the friend's position collapses when we recognize medical consent as closer to a sacred trust than a used-car deal. The signed form matters less than whether the patient truly understood what they were authorizing. That's where the contract analogy doesn't just bend - it shatters.
answer: |-
  Here's a systematic deconstruction of the contract analogy and its application to medical consent, addressing your core concerns:

  ### Correspondence Table: Contract Law ↔ Medical Consent
  | **Contract Element**        | **Medical Consent Analogy**                             | **Mapping Holds?** | **Break Points**                                                                 |
  |-----------------------------|---------------------------------------------------------|-------------------|----------------------------------------------------------------------------------|
  | **Offer**                   | Physician's recommendation/proposed treatment           | Partially         | Medical "offer" occurs in fiduciary context; not an arm's-length negotiation     |
  | **Acceptance**              | Patient's signed consent form                           | Superficially     | Consent is process-based (ongoing dialogue), not moment-in-time "acceptance"     |
  | **Consideration**           | Exchange: Treatment for patient's submission to procedure | Weakly            | No quid pro quo; patient's "benefit" not required for valid consent              |
  | **Capacity**                | Decision-making competence                              | Strongly          | BUT: Contract assumes threshold competence; consent requires decision-relative capacity |
  | **Duress**                  | Physical coercion/threats                               | Strongly          | Medical consent more concerned with subtle coercion (e.g., therapeutic pressure) |
  | **Fraud**                   | Intentional misrepresentation                           | Partially         | Contract fraud requires material misstatement; medical non-disclosure can invalidate without intent |
  | **Materiality**             | Significance to reasonable person's decision            | Conceptually      | Medical materiality standard is patient-specific, not "reasonable person"        |
  | **Remedy**                  | Damages or rescission                                   | Weakly            | Consent violation remedies include battery claims; focus on bodily integrity     |

  ### Critical Disanalogies Undermining the Argument
  1. **Fiduciary Relationship vs. Adversarial Parties**  
     - *Contract*: Assumes self-interested, arm's-length bargaining  
     - *Consent*: Physician has affirmative disclosure duties (fiduciary obligation)

  2. **Nature of the Transaction**  
     - *Contract*: Enforceable promise exchange  
     - *Consent*: Ongoing authorization revocable at any time (e.g., can stop mid-surgery)

  3. **Baseline Assumptions**  
     - *Contract*: "No obligation" default  
     - *Consent*: Bodily integrity as fundamental right (baseline = *no touching*)

  4. **Information Asymmetry**  
     - *Contract*: *Caveat emptor* tolerated in many contexts  
     - *Consent*: Therapeutic privilege is narrow exception; material risks *must* be disclosed (*Canterbury v. Spence*)

  5. **Purpose of Agreement**  
     - *Contract*: Allocates risks/benefits  
     - *Consent*: Protects autonomy and bodily integrity  

  ### Key Distinctions the Analogy Obscures
  **A. Nature-of-Act vs. Terms/Consequences**  
  - *Contract analogy treats both as "non-material"*:  
    - **Nature-of-act deception** (e.g., "This is a standard appendectomy" when it's experimental gene therapy) → Invalidates consent (battery)  
    - **Terms deception** (e.g., "This costs $5k" when a $3k option exists) → May not invalidate consent if medically equivalent  

  **B. Passive Non-Disclosure vs. Active Misdescription**  
  - *Analogy equates both with "seller silence"*:  
    - **Mere non-disclosure**: Failure to mention cheaper model → Weak analogy to undisclosed financial conflict  
    - **Misdescription**: "This is routine" when experimental → Actively false, invalidates consent  

  **C. Threshold vs. Decision-Relative Competence**  
  - *Analogy assumes binary capacity*:  
    - **Threshold competence**: Can understand treatment *in abstract*  
    - **Decision-relative competence**: Must understand *this specific choice* given risks/alternatives  
    → Experimental nature + financial conflict are decision-critical  

  ### Verdict on the Conclusion
  **Your friend's conclusion fails** because:  
  1. **Materiality Standard**: The undisclosed facts (experimental status + financial conflict) are *inherently material* in medical ethics (*Moore v. Regents of UC*)  
  2. **Fiduciary Breach**: Physician's conflict violates core duty—this isn't "seller silence" but betrayal of trust  
  3. **Nature-of-Act Misrepresentation**: Framing experimental as "routine" fundamentally alters what's consented to  

  ### Better Analogies for Valid Consent
  1. **Property Trespass Analogy**:  
     Consent to enter your home is invalid if:  
     - I claim to be a police officer (fraud in the inducement)  
     - I hide that I plan to photograph your art collection (material non-disclosure)  
     → Focuses on *boundary violation* rather than transactional fairness  

  2. **Sacred Trust Analogy**:  
     Consent as entrusting one's body to another's care—requires:  
     - Full disclosure of risks/alternatives  
     - Absence of conflicting loyalties  
     → Captures why financial conflicts invalidate consent even with signed forms  

  3. **Loaded Dice Analogy**:  
     Agreeing to a game while unaware the dice are weighted → Consent to *fair game* not obtained  
     → Distinguishes lies that undermine the *essence* of consent vs. those merely affecting outcomes  

  ### Final Judgment
  The contract analogy was **carrying the argument illegitimately** by:  
  - Smuggling in adversarial assumptions inappropriate to healthcare  
  - Equating bodily autonomy with commercial exchange  
  - Ignoring the fiduciary duty to disclose material information  
  - Collapsing critical distinctions between types of deception  

  **Valid consent requires**:  
  - Accurate understanding of the *nature* of the act  
  - Absence of material deception/non-disclosure  
  - Decision-relative comprehension of risks/alternatives  

  In this case, the physician's conduct likely invalidates consent under both gate and transaction models. The analogy served as rhetorical scaffolding for a conclusion that collapses when scrutinized.
