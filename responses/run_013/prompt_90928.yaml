answer: |-
  ### Computationalism Seminar Activity: "Trivial Implementations"  
  **Goal:** Students experience how arbitrary mappings allow any physical object to "implement" any finite-state machine (FSM), revealing the triviality objection to computationalism. They then discover constraints needed for non-trivial implementations.  

  ---

  ### **Materials to Prepare**  
  1. **Random Objects** (1 per group):  
     - Rocks, shoes, water bottles, books, pens, rubber bands, etc. (Ensure at least 2 identical objects, e.g., two rocks).  
  2. **FSM Cards** (Print 1 per group, each with a *different* FSM):  
     - **Card 1: Toggle Switch**  
       - States: `A`, `B`  
       - Inputs: `0`, `1`  
       - Outputs: `A=0`, `B=1`  
       - Transitions:  
         - `A + 0 → A` | `A + 1 → B`  
         - `B + 0 → A` | `B + 1 → B`  

     - **Card 2: Sequence Detector (11)**  
       - States: `S0`, `S1`, `S2`  
       - Inputs: `0`, `1`  
       - Outputs: `S0=0`, `S1=0`, `S2=1`  
       - Transitions:  
         - `S0 + 0 → S0` | `S0 + 1 → S1`  
         - `S1 + 0 → S0` | `S1 + 1 → S2`  
         - `S2 + 0 → S0` | `S2 + 1 → S2`  

     - **Card 3: Mod-2 Counter**  
       - States: `0`, `1`  
       - Inputs: `COUNT`  
       - Outputs: `0=OFF`, `1=ON`  
       - Transitions:  
         - `0 + COUNT → 1` | `1 + COUNT → 0`  

     - **Card 4: Edge Detector**  
       - States: `WAIT`, `EDGE`  
       - Inputs: `LOW`, `HIGH`  
       - Outputs: `WAIT=0`, `EDGE=1`  
       - Transitions:  
         - `WAIT + LOW → WAIT` | `WAIT + HIGH → EDGE`  
         - `EDGE + LOW → WAIT` | `EDGE + HIGH → EDGE`  

     - **Card 5: Memory Cell**  
       - States: `STORE_0`, `STORE_1`  
       - Inputs: `SET_0`, `SET_1`  
       - Outputs: `STORE_0=0`, `STORE_1=1`  
       - Transitions:  
         - `STORE_0 + SET_0 → STORE_0` | `STORE_0 + SET_1 → STORE_1`  
         - `STORE_1 + SET_0 → STORE_0` | `STORE_1 + SET_1 → STORE_1`  

  3. **Group Worksheets** (1 per group):  
     - *Object:* [Description]  
     - *FSM:* [Name from card]  
     - **Mapping:**  
       - States: E.g., "State `A` = shoe upright, State `B` = shoe upside down."  
       - Inputs: E.g., "Input `0` = tap shoe once, Input `1` = flip shoe."  
       - Outputs: E.g., "Output `0` = shoelace loose, Output `1` = shoelace tight."  
     - **Demo Plan:**  
       - Start: How to set initial state.  
       - Step 1: Apply input X → observe state change/output.  
       - Step 2: Apply input Y → observe state change/output.  

  4. **Class Handout** (1 per student):  
     - *Simple FSM Example:* A light switch (States: ON/OFF, Input: FLIP, Output: light on/off).  
     - *Key Terms:* State, input, output, transition.  

  ---

  ### **Timeline (80 Minutes)**  
  1. **Intro & Group Setup (10 min)**  
     - **You:** "Today, we’re computer engineers! Your task: Turn a random object into a computer that runs a specific program (FSM). No prior CS knowledge needed—just creativity."  
     - Divide into 5 groups (3–4 students each). Give each group:  
       - 1 object (assign identical objects to 2+ groups, e.g., two groups get rocks).  
       - 1 FSM card (each group gets a *different* card).  
       - 1 worksheet.  

  2. **Activity: Implement Your FSM (25 min)**  
     - **Task:** Groups map their FSM onto their object using the worksheet.  
     - **Rules:**  
       - Any physical property can be a state/input/output (e.g., "State A = rock on table," "Input 0 = pour water," "Output 1 = object warm").  
       - They must demonstrate at least 2 transitions.  
     - **Your role:** Circulate and nudge:  
       - *Stuck?* "How could temperature/location/sound represent a state?"  
       - *Confused about FSM?* Use the light-switch example.  

  3. **Group Demonstrations (25 min)**  
     - Each group has 4 minutes to:  
       1. Explain their FSM.  
       2. Show their mapping (states/inputs/outputs).  
       3. Demo their object "computing" (e.g., "When I shake the bottle (input), the water temperature (state) changes, and bubbles (output) appear!").  
     - **Critical moment:** After the first rock group presents, ask the second rock group: "Your rock ran a *different* program? Show us!" Repeat for other duplicate objects.  

  4. **Debrief & Philosophical Connection (20 min)**  
     - **Guided Discussion:**  
       - *Q1:* "How many groups succeeded? Did identical objects run different programs?"  
         - → *Reveal:* All succeeded because mappings were arbitrary.  
       - *Q2:* "Could we map the *same* FSM to this object in multiple ways? Or map a *different* FSM to it?"  
         - → *Reveal:* Yes—e.g., a rock can be a toggle switch *or* a sequence detector.  
       - *Q3:* "What does this say about claiming the brain is a computer *just* because we can describe it as one?"  
         - → **Key point:** Triviality objection—if *anything* (rocks, desks) can "implement" any computation via arbitrary mappings, then calling the brain a computer is empty without constraints.  
       - *Q4:* "How might we *fix* this? What stops your shoe from *actually* being a computer?"  
         - → Elicit constraints:  
           - States must be **causally active** (state transitions cause outputs).  
           - Inputs/outputs must be **real signals** (e.g., light/sound), not just labeled by us.  
           - States must be **objectively distinct** (e.g., voltage levels in a chip, not "rock at 3° vs. 4°").  
     - **Connect to Readings:**  
       - **Triviality objection:** Putnam/Searle—any system can be described as computing anything, so computationalism needs constraints.  
       - **Proposed fixes:**  
         - David Chalmers: Physical states must be grouped by causal roles.  
         - Jerry Fodor: States must be "projectable" (natural kinds).  
         - Carl Craver: Mechanistic explanation—computation must mirror causal structure.  
       - **What this *doesn’t* show:** It doesn’t prove the brain *isn’t* a computer—it just forces computationalists to justify **non-arbitrary implementation**.  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Groups struggle to map abstract FSMs:**  
     - *Why:* FSMs feel too technical.  
     - *Fix:* Use the light-switch handout. Give examples: "For a water bottle, state A = full, state B = empty; input = pouring; output = weight."  

  2. **"Cheating" mappings (e.g., "State A = me thinking about A"):**  
     - *Why:* Students bypass the physical object.  
     - *Fix:* Gently enforce: "The object must ‘hold’ the state—e.g., its position/temperature."  

  3. **Time runs short during demos:**  
     - *Why:* Groups over-explain.  
     - *Fix:* Use a timer. After 3 minutes, say: "Show your best demo now!"  

  4. **Students miss the philosophical point:**  
     - *Why:* Focus stays on "fun" rather than triviality.  
     - *Fix:* In debrief, contrast: "Your mappings worked, but is your shoe *really* computing? Why/why not?"  

  ---

  ### **What the Activity Can and Can’t Show**  
  - **Can show:**  
    - Arbitrary mappings make computational descriptions trivial.  
    - Constraints are needed to ground computationalism (brain ≠ rock).  
  - **Can’t show:**  
    - That the brain *isn’t* a computer.  
    - Which constraints are "correct" (that’s for philosophers to debate!).  
  - **Your role:** Emphasize this is about **epistemology** (how we justify claims), not ontology (what the brain is). Computationalism survives if it can show the brain’s causal structure non-arbitrarily implements computations.  

  ---

  **Final Tip:** Start with energy—"Today, we’re hacking reality!"—and let the irony sink in during debrief. By the end, they’ll see why Searle quipped, "Computation is observer-relative." Good luck!
