answer: |-
  Here’s a draft joint statement structured as an adversarial collaboration document, based on your specifications:

  ---

  ### **Joint Statement on the Ethics of Voting**  
  **Agreed Principles**  
  We, a deontological philosopher and a consequentialist ethicist, agree on the following:  
  1. **Voting is a foundational civic act** – It sustains democratic legitimacy, even when imperfect.  
  2. **Votes serve dual functions** – They express individual conviction *and* collectively shape outcomes. Neither aspect is eliminable.  
  3. **A single vote has near-zero statistical power** – It almost never decides an election. Its power is aggregated.  
  4. **Abstention/spoiling can be defensible** – When no option meets a minimum ethical threshold, or to protest systemic illegitimacy (e.g., rigged processes).  
  5. **Voting is not inherently obligatory** – One may ethically abstain if engagement causes profound moral injury (e.g., voting for a lesser evil still enables harm).  

  ---

  ### **Irreducible Disagreements**  
  | Issue | Deontological View (Civic Duty) | Consequentialist View (Harm Minimization) |
  |-------|---------------------------------|-------------------------------------------|
  | **Primary purpose of voting** | "Voting is an expressive act of civic integrity: its value lies in affirming one’s values, regardless of outcome." | "Voting is a strategic tool: its value lies solely in its expected consequences for reducing net harm." |
  | **Voting "conscience" vs. strategy** | "Voting for marginal candidates or ideals is essential to signal unmet needs and shift political discourse, even if 'wasted'." | "Voting for marginal candidates in non-competitive seats is negligent; it squanders leverage to curb the worst outcomes." |
  | **Voter responsibility** | "A voter is morally accountable only for the act of endorsing a platform—not for unintended effects of others' votes." | "A voter is morally complicit in avoidable harms enabled by electoral outcomes they could have influenced." |

  ---

  ### **Cruxes: Testable Predictions**  
  **Crux 1: Does an individual vote ever morally matter?**  
  - *Shared Test Case*: A voter in a marginal constituency where polls show a 0.1% lead for Candidate A (harmful) over Candidate B (less harmful).  
    - **Deontologist**: "My vote for Candidate C (ideal but non-viable) *matters* as moral witness—even if A wins by 1 vote."  
    - **Consequentialist**: "Voting for C is irrelevant; only votes shifting A/B margins matter. If B loses by 1 vote, C-voters enabled A’s win."  

  **Crux 2: Is expressive voting self-defeating?**  
  - *Shared Test Case*: A poll surge for an idealistic but non-viable party in a competitive election, drawing votes from a less-harmful major party.  
    - **Deontologist**: "This pressures major parties to adopt better policies. Long-term gains outweigh short-term losses."  
    - **Consequentialist**: "This splits the anti-worst-party vote, guaranteeing the most harmful candidate wins. Net harm increases."  

  ---

  ### **Summary of Stalemate**  
  We agree on voting’s symbolic and systemic role but diverge on whether ethics demands **expression of self** or **prevention of harm** when these conflict. Our core divide rests on two axioms:  
  - The deontologist prioritizes *voter purity*: "Do not be complicit in endorsing evil."  
  - The consequentialist prioritizes *victim outcomes*: "Do not abandon real people to preventable suffering."  

  This document reflects unresolved tensions in democratic theory—not intellectual impasse.  

  ---  
  *[Endorsed by both signatories]*  

  ---

  ### **Why this works**  
  - **Agreements**: Focus on uncontroversial minima (e.g., voting’s dual nature, near-zero individual impact).  
  - **Disagreements**: Wording mirrors each side’s core axioms ("civic integrity" vs. "net harm reduction").  
  - **Cruxes**: Hypotheticals isolate empirical/predictive disputes, avoiding ideology.  
  - **Tightness**: Omits academic scaffolding; uses adversarial collaboration format to force clarity.  

  Suitable for a column—framed as "Even opponents agree X, but clash irreducibly on Y."
