prompt: |-
  I've been going back and fourth with a friend about credences and I want to nail down what I actually think, so here's my gut on a pile of cases, and I'd like you to tell me what principle, if any, is behind them.

  An unfamiliar coin: minted last week, never flipped, I know nothing about it. I don't think "my credence in heads is somewhere in [0,1]" is the right thing to say. I think 0.5 is the credence, and having something else is a mistake, not just a permissible option.

  The Ellsberg urn thing, 30 red balls and 60 that are black or yellow in some unknown split. I'd rather bet on red than on black, and I'd rather bet on red-or-yellow than on black-or-yellow, and I don't think I'm being irrational when I do. That feels like a real preference I'm entitled to, not a bias to be corrected.

  A friend hands me a coin she made herself and says only that it isn't fair, with no reason to think it leans heads rather than tails. Next flip: 0.5 heads, 0.5 tails, happy to say that. But I also think two heads in a row is more likely than heads-then-tails — not by much, and I couldn't tell you the number. Both of those feel right, and I have a suspicion they shouldn't both be.

  A coin that's either 40% heads or 60% heads and I don't know which. Is my credence in heads 0.5, or is it the interval [0.4, 0.6]? If someone offers me even money on heads, I feel like I have to produce a single number to say yes or no, but I also resent being made to pretend I know which coin it is.

  The one that really bugs me: I have a coin whose bias I've narrowed to somewhere between 30% and 70%, and separately a fair coin. Someone flips the fair coin and tells me it came up heads, which tells me nothing about the first coin. But take the proposition "exactly one of the two coins comes up heads." Before I hear the fair coin's result I'm at a clean 0.5 on that. After I hear it, I can only place it in a range, and the range is wider than the point was. Learning something irrelevant to a question shouldn't make me more ignorant about that question, but I can't find where the reasoning goes wrong. (I might be garbling the setup.)

  Grains of sand in a sealed jar: is the number even? There I'm perfectly happy to say my credence is anywhere in [0,1] and no particular number is required. Why is that different from the coin?

  Practical version: as a bookie I'll take either side of an even-money bet on the unfamiliar coin. But on the urn I want the red side and not the black side, at the same odds. Structurally those look like the same situation to me.

  The half-principle I keep forming is that a sharp number is right when the situation is symmetric, and an interval is right when what I'm missing is a fact about the world that someone better informed would just know. Trouble is, it treats the unfamiliar coin and the urn's black exactly alike — in both, what I'm missing is a fact — and my verdicts there come apart. Same with the not-fair coin.

  So: is there a principle that gets most or all of this, and where does it have to give? Which of my verdicts do you think I should drop, and what does the surviving principle say about a case or two you make up that I haven't mentioned?
reasoning: |-
  Okay, let me try to unpack this user's credence dilemma. They've presented a series of thought experiments that challenge standard Bayesian approaches to probability, and their frustration is palpable. The core tension seems to be between wanting precise credences in symmetric situations (like the unfamiliar coin) while accepting intervals or imprecision in asymmetric or ambiguous scenarios (like Ellsberg's urn). 

  Hmm, the user is clearly well-versed in probability puzzles - they reference Ellsberg by name and construct sophisticated variants. This isn't a beginner asking "why is the coin 0.5?". They're wrestling with the philosophical foundations of subjective probability. The emotional cues matter too: words like "resent", "bug me", and "garbling" suggest genuine distress about inconsistencies in their intuitions.

  Let me map their core intuitions: First, symmetry demands precise 0.5 (unfamiliar coin). Second, ambiguity aversion is rational (Ellsberg urn). Third, sequential bets require correlation (biased coin sequences). Fourth, epistemic states matter (jar of sand vs coin). Fifth, they're haunted by that two-coin paradox where learning irrelevant information seems to increase ignorance.

  The jar example is particularly telling. It reveals their intuition isn't about physical randomness per se - it's about whether the uncertainty is resolvable. For the jar, even an omniscient being could count the grains, so any credence is arbitrary. For coins, the fairness claim makes uncertainty unresolvable in principle.

  Ah! And that's why the two-coin paradox bites. When the fair coin lands heads, the ambiguous coin's uncertainty becomes the sole source of unpredictability for "exactly one heads" - making the previously symmetric situation now asymmetric. The widening to an interval isn't irrational; it's properly reflecting the shift from risk to ambiguity.

  For resolutions... the imprecise probability framework seems necessary here. We can validate all their intuitions except perhaps the sequential coin flip - they need to accept that "not fair" implies dependence between flips without knowing how. The principle emerging is: precise credences when uncertainty is quantifiable (symmetry/known frequencies), imprecise when it's not (ambiguity/unresolvable unknowns).

  I'll stress that their bookie behavior isn't inconsistent - refusing ambiguous bets while accepting symmetric ones is exactly what imprecise credence models predict. The "resentment" about being forced to name a number for the 40-60% coin is spot-on; that's the model warning against false precision.

  For teaching moments: that jar example is gold. It shows why sometimes [0,1] is the only honest answer - when no amount of information could make you assign a precise probability. Whereas for the unfamiliar coin, the symmetry argument provides all necessary information.
answer: |-
  Based on your intuitions across these cases, you're implicitly endorsing a **Principle of Evidential Symmetry (or Insufficient Reason)** for sharp credences, while demanding **Imprecise Credences (Sets or Intervals)** when faced with resolvable ambiguity or missing information about relevant physical asymmetries.

  Here's how it explains your judgments, where it might give, and which verdict might need refinement:

  **The Principle:**

  1.  **Sharp Credence (Single Number):** When your evidence treats all possible outcomes *symmetrically* and provides *no grounds for discrimination*, a sharp credence (often 0.5) is rationally required. This symmetry must be fundamental to the *causal/physical mechanism* generating the outcome.
  2.  **Imprecise Credence (Set/Interval):** When your evidence reveals *asymmetry* in the causal/physical mechanism but leaves its *exact nature unresolved*, a sharp credence is inadequate. Your credence must reflect the *range* of plausible possibilities given the unresolved asymmetry. This applies when a "better informed" agent *could resolve the ambiguity by acquiring specific facts about the world*.

  **Applying the Principle to Your Cases:**

  1.  **Unfamiliar Coin (Sharp 0.5):** **Fits.** Evidence: Coin *looks* normal, flipping *seems* fair. No evidence suggests *any* asymmetry between heads and tails. Sharp 0.5 reflects perfect symmetry. Denying this symmetry requires evidence you lack.
  2.  **Ellsberg Urn (Prefer Red over Black; Prefer Red/Yellow over Black/Yellow):** **Fits.** Evidence reveals a *known asymmetry* (30 Red) and an *unresolved asymmetry* (unknown Black/Yellow split). Betting on Red exploits the known quantity. Betting against Black avoids the unknown split ambiguity. Red/Yellow (90 balls) has a known high probability (0.6), while Black/Yellow (60 balls) suffers from the ambiguity of *which* color contributes. Imprecise credence (e.g., Black credence in [0, 2/3]) captures the unresolved asymmetry.
  3.  **Friend's Known Biased Coin (Heads: Sharp 0.5; Two Heads > Heads-Tails):** **Mostly Fits, but tension.**
      *   *Single Flip (Sharp 0.5):* **Fits.** Evidence: Known bias but *symmetrically unknown direction*. For the single flip, the evidential symmetry between H and T holds *despite* the known physical asymmetry. You lack grounds to favor H or T.
      *   *Two Flips (Two Heads > Heads-Tails):* **Fits (under the principle).** Evidence: *Asymmetry* (coin is biased, flips are dependent) but unresolved nature (direction/magnitude). Your intuition that P(HH) > P(HT) reflects the plausible physical asymmetry – the bias likely persists across flips. A sharp credence model *could* force P(HH) = P(HT) = 0.25, but this would ignore the plausible physical dependence implied by the unresolved bias. An imprecise model allows P(HH) to be higher than P(HT) within the constraints of the unresolved bias. Your "suspicion" arises because standard Bayesianism struggles with *model uncertainty* like this.
  4.  **40%/60% Coin (Resentment at Single Number):** **Fits.** Evidence: *Resolvable Asymmetry* (it's *either* 40% *or* 60%, someone could know). A sharp credence (like 0.5) implies indifference between the two possibilities, but you lack grounds for that indifference. The interval [0.4, 0.6] reflects that the true chance is one of these two points, and your uncertainty about *which one* is unresolvable without more information. The resentment is justified; forcing a single number oversimplifies your epistemic state.
  5.  **Two Coins Paradox (Point -> Interval after Irrelevant Info):** **Fits. Principle Explains Paradox.**
      *   *Before:* Fair Coin (P(H)=0.5), Ambiguous Coin (P(H) in [0.3, 0.7]). P(Exactly One H) = P(Fair H) * P(Amb T) + P(Fair T) * P(Amb H). Due to the *symmetry* between heads and tails *for both coins individually* in your knowledge state, these calculations yield a sharp 0.5.
      *   *After (Fair Coin=H):* P(Exactly One H | Fair H) = P(Amb T). Now, your credence depends *only* on the ambiguous coin landing tails. The symmetry *for the ambiguous coin alone* is broken – you know its bias exists but not its direction. Your credence in tails (and thus Exactly One H) *must* become imprecise, reflecting the [0.3, 0.7] range for heads (so tails is [0.3, 0.7] too). **The "irrelevant" information didn't make you *more ignorant*; it *removed a source of symmetry* (the fair coin's guaranteed 0.5 outcome) that was previously masking the ambiguity inherent in the other coin.** The ambiguity was always there; conditioning on the fair coin's result just exposed it fully for this specific proposition.
  6.  **Jar of Sand (Happy with [0,1]):** **Fits.** Evidence: *No symmetry or asymmetry* regarding even/odd. The physical process (counting grains) deterministically produces one outcome, but you have *zero information* about the relevant physical fact (the actual count). There's no causal mechanism favoring even/odd. The interval [0,1] reflects complete ignorance about a resolvable fact. This differs from the coin because the coin's design *implies* a symmetry absent for the sand count.
  7.  **Bookie Behavior (Same Structure, Different Response):** **Fits.** Unfamiliar Coin: Evidential symmetry -> Sharp 0.5 -> Indifferent to either side of bet. Ellsberg Black: Unresolved asymmetry -> Imprecise credence -> Ambiguity aversion -> Prefer not to bet on Black at even odds. The structural similarity (unknown probability) masks the difference: symmetry vs. unresolved asymmetry.

  **Where the Principle Might Give or Need Refinement:**

  *   **The "Not Fair" Coin Single Flip:** While the principle explains your 0.5 as symmetry in direction, some argue that knowing *only* "not fair" breaks symmetry enough to warrant imprecision (e.g., P(H) in (0,1) excluding 0.5). Your intuition for sharp 0.5 here is strong and defensible under symmetry of evidence *about direction*, but it's the most vulnerable point if pressed.
  *   **Degree of Imprecision:** The principle justifies *some* imprecision but doesn't dictate *how wide* the interval should be (e.g., Ellsberg Black: [0, 2/3] vs [0.1, 0.5]? 40/60 Coin: {0.4, 0.6} vs [0.4, 0.6]?). This requires additional principles about representing evidence.

  **Which Verdict Might Need Dropping (or Reframing)?**

  *   **"Two heads > Heads-tails" for the biased coin:** While your intuition captures plausible dependence, the principle doesn't *force* P(HH) > P(HT). It allows it *if* your evidence supports positive dependence. However, your evidence ("not fair") only justifies *allowing* dependence, not necessarily *expecting* it. A perfectly valid imprecise credal set could include models where P(HH) = P(HT). Your intuition might be slightly over-committing. The key takeaway is that imprecise credence *permits* your intuition, whereas precise credence often forbids it.

  **Testing the Principle: New Cases**

  1.  **Loaded Die Faces:** A die is machined such that faces 1-5 are identical, but face 6 is slightly heavier/lighter (direction unknown). What is P(6)?
      *   **Principle Prediction:** Sharp 1/6. Evidence: Symmetry among all 6 faces *despite* the known physical asymmetry. You lack evidence favoring face 6 being more *or* less likely. The unresolved asymmetry (direction of weight difference) doesn't break the fundamental symmetry assignment for a single roll.
  2.  **Two Urns:** Urn A has 50 red, 50 blue. Urn B has 100 balls, each either red or blue, unknown split. One urn is chosen by a fair coin flip. A ball is drawn. What is P(Red)?
      *   **Principle Prediction:** Sharp 0.5. Evidence: Symmetry between Urn A and Urn B (coin flip), symmetry between red and blue *within* Urn A. For Urn B, symmetry between red and blue holds *despite* the unknown split – you have no evidence favoring red over blue *in Urn B specifically*. The overall symmetry dominates. (Contrast with Ellsberg where the ambiguity is directly in the urn you're drawing from).
  3.  **Unknown Card Game:** You're told a game involves drawing a card where Hearts win, but you know *nothing* about the deck size, suits present, or rules. What is P(Win)?
      *   **Principle Prediction:** Imprecise [0, 1]. Evidence: No symmetry. Complete lack of information about the relevant physical setup. The outcome is determined by resolvable facts you lack entirely.

  **Conclusion:**

  Your intuitions consistently align with the **Principle of Evidential Symmetry vs. Resolvable Asymmetry.** You demand sharp probabilities only under conditions of fundamental symmetry (like the unfamiliar coin) or when unresolved asymmetries are "averaged out" by other symmetries (like the initial two-coin state). You demand imprecision when evidence reveals an asymmetry but leaves its specifics unresolved and potentially knowable (Ellsberg, 40/60 coin, the ambiguous coin after learning the fair coin's result). The jar of sand highlights the boundary case of complete absence of relevant information. The principle validates your bookie behavior and resolves the two-coin paradox. While the "not fair" coin single flip might be a slight pressure point, it holds up well overall. Your intuition about sequences for the biased coin is permissible under imprecise credence but might be slightly stronger than strictly *required*. Imprecise probability (credal sets) is the formal framework capturing most of your judgments.
