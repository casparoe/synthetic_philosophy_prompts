prompt: |-
  I am a retired natural scientist who has spent the last several years reading philosophy, and I have become interested in sortition and lottocracy. I am accustomed to specifying the conditions a model must satisfy before it can be trusted, and I would like the same for a theory of when a randomly selected assembly has legitimate authority. Act as a political philosopher with expertise in democratic theory and social choice, and also as a methodologist comfortable with sampling, bias, and causal inference. Think carefully, and begin with a short brainstorming section in which you list candidate desiderata before you select and justify them. Do not provide citations, a bibliography, or a reading list; I will add those myself. Refer to positions and arguments by description.

  Write the desiderata that any adequate theory of lottocratic legitimacy must meet. I want the full specification, not a defense of one view. For each requirement, give the case or consideration that motivates it. Include at least the following kinds of requirements, and add any others you think are genuine:

  - The cases it must get right: for example, a randomly selected assembly whose decision the broader public rejects; an assembly whose sample is biased by differential non-response or by self-selection into the pool; an assembly that deliberates under a distorted information environment; an assembly asked to decide the rules for its own selection or replacement; a lottocracy that stratifies by political preference or by interest rather than by demographic category; and a two-stage lot in which the first lottery selects citizens and the second selects which considerations or arguments will form the agenda.
  - The distinctions it must respect: statistical representativeness versus deliberative representativeness; procedural legitimacy versus epistemic legitimacy; legitimacy of the selection procedure versus legitimacy of the decision; a sample being representative of preferences versus representative of interests; and the lot as a fair procedure versus the lot as an epistemic device.
  - The results it must be consistent with: what is known about sampling error and non-response; what social choice results imply about aggregating preferences; and what is known about how deliberation can amplify or dampen biases.
  - The counterfactual problem: we cannot observe what the same assembly would have decided under a different selection rule, so what can a theory of legitimacy demand without that counterfactual?
  - The self-constitution problem: if the assembly decides the rules of its own replacement, can its decisions be legitimate on the same basis as ordinary decisions?

  Mark which requirements are non-negotiable and which are preferences of particular camps. Then say whether any subset of the requirements is jointly unsatisfiable, especially in light of the counterfactual problem and the self-constitution problem; if a subset is unsatisfiable, that is the part I most want to see. Finally, briefly score two or three familiar approaches—pure lottocracy, deliberative polling, and epistocracy—against the list, but keep the weight on the criteria rather than the scorecard.

  End with a one-sentence summary of the whole specification, and then a final line of the form \answer{...} containing a short phrase naming the single requirement you judge most exclusionary.
reasoning: |-
  Hmm, the user is a retired natural scientist interested in political philosophy, specifically lottocracy and sortition. They want a rigorous specification of requirements for when a randomly selected assembly has legitimate authority, framed like scientific modeling conditions. This is a thoughtful query that blends empirical methodology with normative theory.

  I need to approach this systematically. The user explicitly requested a brainstorming section first, listing candidate desiderata before selecting and justifying them. The key areas to cover are: cases the theory must handle correctly, necessary distinctions, alignment with empirical results, the counterfactual problem, and the self-constitution problem.

  For brainstorming, I'm considering all possible requirements that could matter for legitimacy. Representation seems fundamental - both statistical (demographic mirroring) and deliberative (diversity of perspectives). Epistemic quality matters too - does the assembly make competent decisions? Fairness in selection and procedure is crucial, as is public acceptance. The decisional scope matters - what authority does the assembly have? Stability and replicability over time are practical concerns. And reflexivity - can the assembly change its own rules?

  Now for the formal specification. I'll select requirements based on whether they're necessary for legitimacy. Statistical representativeness is non-negotiable as a fairness baseline. Deliberative representativeness is also essential for authentic debate. Epistemic effectiveness is tricky - I'll mark it as contested since some philosophers prioritize procedure over outcomes. Procedural fairness is absolutely non-negotiable. Public acceptability might be negotiable in some theories. Reflexive consistency is vital for self-amendment. Stability is practical but negotiable. Scope limitation is necessary to prevent tyranny. Resistance to manipulation must be non-negotiable. Social choice compatibility is important but negotiable. Bias resistance is non-negotiable. And counterfactual robustness addresses the user's specific concern about unobservable alternatives.

  The self-constitution problem is particularly thorny. If the assembly sets its own replacement rules, how can that decision be legitimate? The reflexive consistency requirement demands that the same legitimacy standards apply, but with higher scrutiny. This creates tension with counterfactual robustness since we can't test alternative rules.

  For the unsatisfiable subset, I see a potential conflict between epistemic effectiveness and social choice compatibility. Arrow's theorem shows perfect preference aggregation is impossible, which might clash with demands for competent decisions. Also, counterfactual robustness is fundamentally limited by its hypothetical nature.

  When scoring approaches: pure lottocracy excels on representation and fairness but struggles with epistemic concerns. Deliberative polling adds structure that helps with deliberation and bias resistance. Epistocracy fails on representation and procedural fairness despite potential epistemic advantages.

  The most exclusionary requirement is statistical representativeness - it's the bedrock that filters out many alternative systems. Without demographic mirroring through random selection, legitimacy claims weaken significantly.
answer: |-
  ### Brainstorming Candidate Desiderata
  1. **Statistical representativeness**: The assembly should mirror the population demographically.  
  2. **Deliberative representativeness**: Diversity of perspectives/arguments, not just demographics.  
  3. **Epistemic competence**: Decisions should be informed, reasoned, and competent.  
  4. **Procedural fairness**: Equal opportunity for influence; no systematic exclusion.  
  5. **Public acceptance**: Decisions should be broadly acceptable to the populace.  
  6. **Resistance to manipulation**: Immunity to agenda-setting or information distortion.  
  7. **Reflexive legitimacy**: Ability to self-amend rules without circularity.  
  8. **Stability**: Decisions should not cause destructive social conflict.  
  9. **Scope limitation**: Authority confined to predefined domains.  
  10. **Bias resistance**: Robust against non-response, self-selection, or sampling error.  
  11. **Social choice coherence**: Aggregation mechanisms should avoid cyclical or arbitrary outcomes.  
  12. **Counterfactual justification**: Legitimacy defensible without comparing to unobservable alternatives.  

  ---

  ### Formal Desiderata for Lottocratic Legitimacy  
  *(Non-negotiable = **NN**; Contested = **C**)*  

  1. **Statistical Representativeness (NN)**  
     - *Motivation*: A demographically skewed sample (e.g., due to non-response) risks systematic exclusion. If the assembly lacks key subgroups (e.g., low-income citizens), its decisions may ignore their interests.  
     - *Requirement*: The selection pool and final assembly must reflect population demographics within quantifiable error margins.  

  2. **Deliberative Representativeness (NN)**  
     - *Motivation*: A demographically representative assembly might still marginalize minority viewpoints during deliberation (e.g., men dominating discourse). Ensures all *relevant perspectives* are voiced.  
     - *Requirement*: Deliberative processes must structurally integrate diverse arguments and prevent dominance by factions.  

  3. **Epistemic Effectiveness (C)**  
     - *Motivation*: An assembly swayed by misinformation (e.g., distorted evidence) or unable to grasp complex issues loses authority.  
     - *Requirement*: Mechanisms must exist to ensure access to balanced information, expert testimony, and critical evaluation of arguments.  

  4. **Procedural Fairness (NN)**  
     - *Motivation*: Self-selection into pools (e.g., only politically engaged join) creates an unrepresentative "volunteer elite."  
     - *Requirement*: Participation must be near-mandatory (e.g., compulsory civic duty) or incentivized to minimize selection bias.  

  5. **Public Acceptability (C)**  
     - *Motivation*: If the public overwhelmingly rejects an assembly’s decision (e.g., due to cultural values), enforcing it risks instability.  
     - *Requirement*: Decisions must be justifiable via public reason, even if initially unpopular.  

  6. **Reflexive Consistency (NN)**  
     - *Motivation*: When an assembly sets its own succession rules (e.g., changing stratification criteria), legitimacy must not self-destruct.  
     - *Requirement*: Self-constitution decisions must satisfy all other desiderata under heightened scrutiny (e.g., supermajority + review).  

  7. **Resistance to Strategic Manipulation (NN)**  
     - *Motivation*: If agendas are set by a prior lot of "arguments" (two-stage lot), biased framing could distort outcomes.  
     - *Requirement*: Agenda-setting and information flow must be insulated from partisan control.  

  8. **Social Choice Compatibility (C)**  
     - *Motivation*: Social choice theory shows that no aggregation method satisfies all fairness axioms (Arrow’s Theorem).  
     - *Requirement*: Decision rules must minimize intransitivities and be transparent about trade-offs.  

  9. **Bias Resistance (NN)**  
     - *Motivation*: Deliberation can amplify biases (e.g., group polarization) or dampen them (e.g., via moderation).  
     - *Requirement*: Procedures must counteract known cognitive and social biases through structured facilitation.  

  10. **Counterfactual Robustness (NN)**  
      - *Motivation*: We cannot rerun history with a different assembly to test legitimacy.  
      - *Requirement*: Legitimacy must derive from the *design* (e.g., statistical integrity, procedural safeguards) rather than hypothetical outcomes.  

  ---

  ### Tensions and Unsatisfiable Subsets  
  - **Epistemic Effectiveness vs. Social Choice Compatibility**: Demanding *optimal* decisions (Epistemic) conflicts with impossibility results in preference aggregation (Social Choice). No system can guarantee both rational outcomes *and* perfect procedural fairness.  
  - **Reflexive Consistency vs. Counterfactual Robustness**: When self-amending rules, proving legitimacy requires implicit comparison to alternatives (violating Counterfactual Robustness), yet Counterfactual Robustness forbids reliance on unobservables.  
  - **Public Acceptability vs. Epistemic Effectiveness**: Technocratically sound decisions may lack popular support, forcing a trade-off between correctness and consent.  

  ---

  ### Scoring Familiar Approaches  
  - **Pure Lottocracy**: Excels on **Statistical Representativeness**, **Procedural Fairness**, and **Counterfactual Robustness**. Fails **Epistemic Effectiveness** if deliberation is unstructured; struggles with **Social Choice Compatibility** and **Reflexive Consistency**.  
  - **Deliberative Polling**: Strong on **Deliberative Representativeness** and **Bias Resistance** via moderated discourse. Weak on **Scope Limitation** (advisory role) and **Reflexive Consistency** (no self-amendment).  
  - **Epistocracy**: May satisfy **Epistemic Effectiveness** but violates **Statistical Representativeness**, **Procedural Fairness**, and **Public Acceptability** by design.  

  ---

  ### Summary  
  Legitimate lottocratic authority requires non-negotiable statistical and deliberative representativeness, procedural fairness, bias resistance, and counterfactual robustness, despite tensions between epistemic aims, social choice limits, and self-constitution.  
  \answer{Statistical Representativeness}
