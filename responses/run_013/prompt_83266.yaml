prompt: |-
  My friend Rosa and I are in a political theory reading group that has drifted way past where it was supposed to go, and she's spent the last month building an arguement about the Condorcet jury theorem. Last night she wrote it out and I couldn't find the hole. I'm pretty sure there is one, because I don't want to end up where she ends up.

  Her argument, cleaned up:

  (1) The jury theorem: if each voter is even slightly more likely than not to get some yes/no question right, and their votes are independent of one another given the truth, then the probability the majority is right increases with the number of voters and tends to 1. Mirror image: if each voter is slightly less likely than not to be right, the probability the majority is right decreases with the number of voters and tends to 0. So a large group is an amplifier — it magnifies whatever individual competence is there, it can't create any.

  (2) Real mass electorates get things wrong at an appreciable rate. Not controversial things — outcomes that large numbers of the voters themselves would call a mistake afterwards, or would reverse if you asked them again a few years later.

  (3) Now combine. By (1), in an electorate of a million or more, a wrong majority is possible only if individual competence is below one half. If competence were above a half, majority accuracy at that size would already be essentially 1.

  (4) And if competence is below a half, then by (1) the majority is worse than one randomly chosen voter, and it gets worse the bigger the electorate gets. So mass democracy would be epistemically worse than a coin flip, and worse than a small committee drawn from the same population.

  (5) So anyone who accepts the theorem and accepts (2) is committed to saying mass democracy is epistemically worse than random.

  (6) That's absurd, so something has to go.

  I tried two escapes and she closed both. I said maybe our electorates aren't big enough for the convergence to have bitten — she says do the arithmetic, at a million voters you'd need average competence within a fraction of a percent of a coin flip for majorities to be wrong more than rarely, and nobody believes that about any real electorate. I said the independence premise is unrealistic — she says fine, allow any correlation you like, it doesn't rescue anything: all correlation can do is keep the group stuck around the members' own accuracy, it can't turn a crowd of individually sub-coin-flip voters into a reliable majority.

  I'd like to keep (1); it's a theorem, I've seen the proof, it's just binomial arithmetic. What I can't accept is (5). So which step is broken, and what does the repair cost? If the answer is that (1) has to be weakened, tell me exactly which of its premises I'm giving up and what's left of the theorem without it. And I'd also like to know whether (5) is really as absurd as it sounds, or whether it's a bullet somebody could bite.
reasoning: |-
  Okay, let me start by understanding Rosa's argument. She's using the Condorcet jury theorem to argue that mass democracy is epistemically worse than random. The theorem says that if each voter is more likely to be correct than not (competence >0.5), the majority vote becomes more accurate as the group size increases. Conversely, if individual competence is below 0.5, the majority's accuracy drops towards zero.

  Rosa points out that real electorates make mistakes often, even on non-controversial issues. Since large electorates still get things wrong, she concludes that individual competence must be below 0.5. Therefore, mass democracy is worse than a coin flip.

  I need to find where this argument breaks down. First, the premises. The theorem assumes voters are independent and identically distributed with fixed competence. But in reality, voters aren't independent. They're influenced by common sources like media, which creates correlations. If voters all make the same mistake because of shared misinformation, the majority's accuracy doesn't improve no matter how large the group is.

  Rosa counters that correlation can't turn sub-0.5 competence into reliable majorities. True, but the issue is that the theorem's convergence doesn't happen when there's correlation. So the conclusion that competence must be below 0.5 doesn't hold because the theorem's assumptions fail. Instead, competence could be above 0.5 but correlated errors prevent the majority from being correct.

  Another point: the competence parameter might not be fixed. Depending on the issue, the same voter might have varying competence. For complex issues, even well-informed voters might drop below 0.5. But Rosa's argument requires consistently below 0.5 across all voters, which isn't necessarily true.

  Also, systematic biases affect everyone similarly. If there's a shared bias, individual competence could be above 0.5, but the majority still errs due to this bias. The theorem doesn't account for systematic errors.

  What about the independence premise? Rosa says allowing correlation doesn't rescue the situation, but actually, it breaks the inference from (2) and (3). Without independence, you can't conclude that competence must be below 0.5 just because large groups err. So step (3) is invalid.

  The repair costs giving up the independence assumption. The theorem still holds under its assumptions, but those don't apply to real electorates. Without independence, the convergence to 1 doesn't happen, so the group accuracy might not reflect individual competence.

  Is (5) absurd? Well, if mass democracy were worse than random, that would undermine its legitimacy. But Rosa's argument relies on flawed application of the theorem. Real democracies might have competent individuals but suffer from correlated errors or varying issues. So biting the bullet isn't necessary because the argument's premises don't hold in reality.
answer: |-
  Your skepticism is well-founded—Rosa's argument is clever but contains a critical flaw. Let's break down where it goes wrong, which premise must be modified, what remains of the theorem, and whether (5) is defensible. The core issue lies in **misapplying the theorem's assumptions to real-world electorates**, specifically violating the **independence and identical competence premises**. I'll address your questions step-by-step.

  ### Step-by-Step Breakdown of the Flaw
  **The Broken Step: (3)**  
  Rosa's inference from (2) ("real electorates get things wrong") to "individual competence must be below one half" relies *entirely* on the Condorcet Jury Theorem (CJT) holding strictly. But CJT requires two key premises:  
  1. **Independence**: Voters' judgments are independent *given the truth* (i.e., errors are uncorrelated).  
  2. **Identical competence**: Each voter has the *same fixed probability* \( p > 0.5 \) of being correct.  

  Real electorates violate both:  
  - **Independence is catastrophically violated**. Voters share common influences (media, culture, misinformation campaigns, economic shocks) that create **correlated errors**. This isn't just a minor issue—it fundamentally breaks CJT's convergence mechanism.  
  - **Competence is not identical or fixed**. Voters vary in knowledge, and \( p \) can be issue-dependent (e.g., >0.5 on simple questions, <0.5 on complex ones).  

  **Why Rosa's Rebuttal Fails on Independence**  
  She claims: "all correlation can do is keep the group stuck around the members' own accuracy." This is incorrect. Correlation doesn't just cap group accuracy—it can **systematically bias the majority toward error** even if *most* voters have \( p > 0.5 \). For example:  
  - If 60% of voters have \( p = 0.55 \) (above 0.5), but a shared bias (e.g., misleading news) causes 51% to make the *same* error, the majority will be wrong despite individual competence exceeding 0.5.  
  - Mathematically, with correlated errors, the group's accuracy may converge to a value *far below 1* (even with \( p > 0.5 \)) or behave chaotically. CJT's "tends to 1" result *vanishes* without independence.  

  **The Repair: What You Give Up**  
  You must weaken **premise (1)** by relaxing the CJT's assumptions for real-world applications:  
  - **You give up strict independence and identical competence**. These don't hold in mass electorates.  
  - **What remains of the theorem?** CJT still holds *mathematically* under its idealized assumptions (it's a valid theorem). But for real groups, it becomes a **heuristic** rather than a guarantee. The insight—that aggregation *can* amplify individual wisdom—stands, but it's not inevitable. Group accuracy now depends on:  
    - The *distribution* of competences (not all voters need \( p > 0.5 \)).  
    - The *structure of correlations* (e.g., if errors are positively correlated, majority accuracy plummets).  
    - **Systematic biases** (e.g., propaganda, structural ignorance) that affect voters uniformly.  

  ### Why (2) Doesn't Imply Competence < 0.5
  Real electorates err (as in (2)) because of:  
  1. **Correlated errors**: Shared misinformation can cause large majorities to err *even if median \( p > 0.5 \)*.  
  2. **Heterogeneous competence**: Many voters have \( p \gg 0.5 \), but others have \( p \ll 0.5 \), pulling down the average. Crucially, CJT's "amplifier" effect fails if competence varies widely.  
  3. **Epistemic bottlenecks**: For some issues (e.g., climate policy), voters may lack expertise, creating *temporary* \( p < 0.5 \). This doesn't mean competence is *permanently* below 0.5 across all issues.  

  **Rosa's "do the arithmetic" rebuttal** ignores correlation. For example, with 1 million voters:  
  - If errors are independent and \( p = 0.501 \), majority accuracy is ≈1.  
  - But with mild correlation (e.g., pairwise error correlation of 0.01), majority accuracy drops to ≈0.6–0.7. With strong correlation, it approaches 0.5—**indistinguishable from a coin flip** *even if* \( p > 0.5 \).  

  ### Is (5) Absurd? Can Anyone Bite the Bullet?
  - **Yes, (5) is absurd** as a universal claim. If mass democracy were *always* worse than random, it would imply:  
    - Democracies should perform *worse* than dictatorships (which rely on small groups).  
    - Reforms like expanding suffrage would reduce epistemic quality—contradicted by history (e.g., democracies avoid famines better than autocracies).  
  - **But partial biting is possible**: Some theorists (e.g., Jason Brennan) argue democracies *often* fail epistemically due to voter ignorance. They might accept (5) for *specific contexts* (e.g., highly technical issues) but not as a general rule. Still, this requires rejecting CJT's applicability entirely—not Rosa's conclusion.  

  ### The Bottom Line
  - **Broken step**: (3), due to violated CJT assumptions.  
  - **Repair cost**: Accept that CJT describes an *idealized* world. For real electorates, majority accuracy depends on **error correlation** and **systematic biases**, not just average competence.  
  - **Practical implication**: Mass democracy isn't doomed. Reforms can mitigate epistemic failure (e.g., combat misinformation, improve civic education), restoring CJT-like benefits without requiring unrealistic independence.  

  Rosa's argument is a valuable critique of naive CJT applications, but it overreaches. The theorem isn't wrong—it's just not a map to our messy reality. If you want empirical evidence, study how correlated errors caused Brexit or COVID-misinformation voting patterns: individual \( p \) likely exceeded 0.5, but correlated errors swung majorities wrong.
