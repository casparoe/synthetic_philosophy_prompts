  For the key criterion, "lack of contemporary intentional holders" seems most decisive. It creates a fairly sharp boundary except in borderline cases like the chess engine, where we debate whether the learned function truly escapes its programmers' original intent.

  The counterintuitive case might be the legal precedent - it feels like it "should" qualify more than it does under my criterion, but I'll keep the verdict since the embedded reasoning originated from human intention, even if now free-floating in application.

