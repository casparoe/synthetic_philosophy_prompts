  - Market prices are often cited as free-floating rationales in economics (e.g., Hayek's "use of knowledge in society"), where prices convey information about scarcity without any single entity intending that.

  - River meandering is a physical process that can be described as energy dissipation, but this is just physics, not a "rationale" in the teleological sense.

  - Male nipples are vestigial structures with no current function - a byproduct of developmental biology rather than an adaptive rationale.

  - Legal precedents contain embedded reasoning that persists beyond the original judges' intentions, acting as a constraining rationale for future courts.

