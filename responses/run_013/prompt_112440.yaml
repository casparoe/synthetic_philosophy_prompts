prompt: |-
  I'm a backend/infra engineer (SRE-ish, mostly payments) and I've got myself into a running argument with a mate who did a classics degree. He keeps going on about Machiavelli's fortuna and virtù and how it's the most misread thing in political thought, and I keep thinking that I run that distinction at work every week without needing the Italian. I read The Prince once on holiday, so I'm not completely in the dark: there's a chapter near the end where he compares fortune to a river in flood that flattens everything until you've built your defences and canals, and where he reckons fortune is the arbiter of roughly half of what we do and leaves us to direct the other half. There's also the closing bit where he says fortune's a woman and you have to knock her about a bit to keep her in order, which my mate insists is a joke and I'm not so sure. Machiavelli himself got sacked when the Medici came back and wrote the whole thing in exile, which seems like a relevant data point for a book about whose fault it is when things go wrong.

  What I want from you is a proper translation job. Take the fortune/virtù account — the river in flood, the claim that fortune runs about half of it, and the argument that a man succeeds when his methods happen to line up with the times and gets ruined when the times change because he can't change with them — and restate it as faithfully as you can in the vocabulary I actually think in. That means SLOs and error budgets, incident postmortems and the difference between a root cause and bad luck, capacity planning and blast radius, defence in depth, tail risk and correlated failure, chaos engineering, regression to the mean when you're trying to tell a good quarter from a lucky one, and the whole 'we've always done it this way' problem when the environment shifts under you. Where the translation is a stretch, say so rather than smoothing it over. I'd much rather see the seams.

  Then the part I actually care about: the residue report. Which bits map cleanly onto how I already think about reliability, which bits only go across if you fudge them, and which have no counterpart at all — I'd guess that's the personification of fortune (the woman line), the God-and-free-will framing he opens that chapter with, glory and reputation as part of virtù, the fact that virtù is an excellence of a man rather than of a system (in my world the entire point is that no single person should be load-bearing), and the moral side of it, since he's perfectly happy to distinguish cruelty that's done once and for a reason from cruelty that keeps going, and my vocabulary has nothing whatsoever to say about that. Then tell me straight whether the residue is my framework missing something real, or Machiavelli's claim being vaguer than it looks. Specifically: is 'adapt your methods to the times' an actual skill, or just a fancy description of whoever won? And is that the same disease as hindsight bias in a postmortem? I've got a suspicion that my mate's whole thing collapses into 'sometimes you get unlucky and sometimes you don't', and I'd like to be told if I'm wrong. No page refs or reading list please, I'm not writing an essay, and don't just tell me what the commentators say — I want the translation itself.
