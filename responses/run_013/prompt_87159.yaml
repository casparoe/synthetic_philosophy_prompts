     So we need a rule that says: scratches on all dates except 2024-01-15. That's a rule that says: scratches iff the date is not 2024-01-15. Then for the next test (2024-01-22) we predict YES.

     Similarly, Rule NO: scratches iff the date is before 2024-01-16. Then on 2024-01-22, it predicts NO.

     But note: the next test is 2024-01-22, which is after 2024-01-16, so NO.

     We can accept these. They are ad hoc but fit the data.

     In the debrief, we note that these rules are arbitrary and based on specific dates, but they work.

  5. **Students being right**: One student might say: "But Rule 2 is just Rule 1 with an exception at t, and we don't have evidence for that exception." We agree and say that the evidence doesn't support one over the other. The point is that the evidence alone doesn't dictate.

  F. Honest note:

  This activity cannot reproduce the full symmetry of grue/bleen because in our setup, Rule 2 is defined with a date and seems artificial, while Rule 1 is natural. The interdefinability of the vocabularies is not fully demonstrated in the activity because we did not show how to reconstruct "always scratches" from Rule 2's predicate. We will have to explain that in the debrief using the color example. Also, the activity relies on the antecedent belief about mineral stability, which is part of the point, but we must then show that this belief is not based on the evidence at hand. The strongest reason to think the puzzle is an artefact: the date-based rule is not a genuine property of the mineral but a trick with time. We must argue that time is a legitimate factor and that the two vocabularies are intertranslatable, which we do in the debrief.

