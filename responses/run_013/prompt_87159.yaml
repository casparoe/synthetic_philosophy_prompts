  ### A. Learning Outcome
  By the end of the session, participants should be able to articulate that **the same body of observational evidence can equally support two conflicting rules for predicting future events, and that intuitive justifications for preferring one rule (e.g., simplicity, stability, or alignment with prior beliefs) cannot be grounded solely in the evidence itself—they depend on external assumptions about language or practice.**

  ### B. Materials and Wording
  **Materials:**
  - 18 index cards (for private commitments)  
  - Adhesive labels (to label group rules during debrief)  
  - Play-money tokens (100 total; distribute 5 tokens per student at start)  
  - Two envelopes:  
    - **Envelope A:** Contains the result for today's test (pre-set to "NO").  
    - **Envelope B:** Empty placeholder for the "next test" (unused, for symbolism).  
  - Printer outputs:  
    - **3 Observation Cards:**  
      - "Test Date: 2023-05-10 | Result: Scratches glass? YES"  
      - "Test Date: 2023-08-22 | Result: Scratches glass? YES"  
      - "Test Date: 2023-11-17 | Result: Scratches glass? YES"  
    - **Today's Test Card:** "Test Date: 2024-02-15" (result in Envelope A).  
    - **Rule Cards (posted on whiteboard):**  
      - **Rule 1:** "Zirconite always scratches glass."  
      - **Rule 2:** "Zirconite scratches glass if tested before 2024-01-01, and does not scratch glass if tested on or after 2024-01-01."  
    - **Instruction Sheet (read aloud verbatim):**  
      > "You are mineralogists studying Zirconite, a newly discovered mineral. All past tests (shown) confirm it scratches glass. Today, we test a new sample. Two rules predict outcomes. Both fit all past data. First, commit privately: choose a rule and predict today’s result. Bet 1 token. Then, as a group, agree on one rule/prediction and bet 5 tokens. After revealing the result, you’ll design new rules for a future test."  

  ### C. Rules, Roles, Payoff, and Timeline  
  **Rules:**  
  - **Rule 1:** Assumes mineral hardness is timeless. Predicts "YES" for every test.  
  - **Rule 2:** Ties hardness to a calendar threshold (before/after 2024-01-01). Predicts "NO" for tests on/after 2024-01-01.  
  - **Token Payoff:**  
    - Private bet: Lose 1 token if wrong; win 2 tokens (net +1) if correct.  
    - Group bet: Lose 5 tokens if wrong; win 10 tokens (net +5) if correct.  
  - **Roles:** No assigned roles. Students act as peer scientists.  

  **Timeline (90 min):**  
  1. **0–5 min:** Setup. Arrange chairs into 6 groups of 3. Distribute tokens, index cards. Read *Instruction Sheet*.  
  2. **5–12 min:** Present observation cards and rules. Q&A only on procedure (no theory).  
  3. **12–17 min:** **Private Commitment.** Students write on index cards:  
     - Their name.  
     - Chosen rule (1 or 2).  
     - Prediction for today (YES/NO).  
     - Attach 1 token. Collect cards/tokens.  
  4. **17–32 min:** **Group Deliberation.** Groups discuss (10 min). Whole class debates/votes to adopt one rule and prediction (5 min). Group bets 5 tokens.  
  5. **32–35 min:** Reveal today’s test result (open Envelope A: "NO"). Settle bets:  
     - Rule 1 supporters lose tokens (predicted YES).  
     - Rule 2 supporters win tokens (predicted NO).  
  6. **35–42 min:** **New Rule Challenge.** Announce:  
     > "We now have four results: three YES (2023), one NO (2024-02-15). Next test: 2024-03-01. In groups, invent two new rules—one predicting YES, one NO—that fit *all four results*. You have 2 minutes."  
  7. **42–47 min:** Groups share rules. Write examples on whiteboard.  
  8. **47–70 min:** **Debrief (23 min).** Structured discussion (detailed in D).  
  9. **70–90 min:** **Conclusion (20 min).** Introduce Goodman’s concepts, connect to activity, address questions.  

  ### D. Debrief Map (47–70 min)  
  **Goal:** Let students reconstruct philosophical insights through guided questioning.  
  - **47–52 min: Evidential Symmetry**  
    *Question:* "Look at the three original observations. Did they *require* us to pick Rule 1 over Rule 2? Why or why not?"  
    *(Point: Both rules fit past data equally. Evidence alone doesn’t dictate choice.)*  
  - **52–57 min: Justification in Advance**  
    *Question:* "When you committed privately, what reasons did you have for your chosen rule *before* seeing today’s result?"  
    *(Point: Justifications (e.g., 'minerals don’t change on dates') rely on background beliefs, not evidence.)*  
  - **57–62 min: Vocabulary Relativity**  
    *Question:* "Suppose Rule 2 is ‘correct.’ How would you define ‘always scratches glass’ using Rule 2’s logic and dates?"  
    *(Point: Any property can be redefined disjunctively. No vocabulary is objectively "basic.")*  
  - **62–65 min: Entrenchment**  
    *Question:* "Why do scientists *in practice* prefer rules like Rule 1? What makes them feel ‘natural’?"  
    *(Point: Historical use entrenches certain predicates, not inherent superiority.)*  
  - **65–70 min: Regress**  
    *Question:* "You invented new conflicting rules in 2 minutes. Could we do this *again* for a test after 2024-03-01? What does this say about evidence and prediction?"  
    *(Point: Any finite evidence permits infinitely many rules; no "final" solution.)*  

  ### E. Predictable Problems and Solutions  
  1. **Problem: Everyone picks Rule 2 initially.**  
     *Why:* Students overthink and suspect a trick.  
     *Solution:* Reaffirm that Rule 1 aligns with real-world intuition. In debrief, contrast private votes (show cards) with group outcome to highlight peer pressure.  

  2. **Problem: Groups stall during new rule challenge.**  
     *Why:* Struggling to fit the NO result (2024-02-15).  
     *Solution:* Prompt: "Use a new date threshold, e.g., before/after 2024-02-16." Example:  
     - YES predictor: "Scratches if tested before 2024-02-16 or on 2024-03-01."  
     - NO predictor: "Scratches only if tested before 2024-02-15."  

  3. **Problem: Students dismiss Rule 2 as "cheating."**  
     *Why:* Antecedent belief that minerals don’t change on dates.  
     *Solution:* "Agree—but where did that belief come from? Did the *evidence* prove Rule 2 impossible?" (Leverage this to expose evidence-practice gap.)  

  4. **Problem: Token betting distracts from philosophy.**  
     *Why:* Students focus on "winning" tokens.  
     *Solution:* After bets, clarify: "Tokens represent confidence, not truth. We’re studying how decisions are made, not mineralogy."  

  5. **Problem: A student designs a "better" rule (e.g., based on chemical properties).**  
     *Why:* Correctly notes real science uses mechanisms, not dates.  
     *Solution:* "Great! But did our *evidence* include chemical data? Could someone invent a rival chemical rule that fits past data but diverges tomorrow?" (This *enhances* the point—no evidence escapes underdetermination.)  

  ### F. Honest Limitations and Salvaging  
  **What the Activity Cannot Reproduce:**  
  - **Symmetry of "Grue/Bleen" Translation:** The activity uses temporal rules (Rule 1 vs. 2), but students won’t see that "always scratches" and "scratches iff before t" are interdefinable *syntactically*. You must verbally explain this in the conclusion using colors:  
    > "Just as ‘green’ can be defined as ‘grue if observed before t or bleen after,’ ‘always scratches’ can be defined using Rule 2’s terms. Neither vocabulary is privileged."  
  - **The "Artefact" Rebuttal:** Students may argue Rule 2 is illegitimate because time isn’t a causal property. **Address directly:**  
    > "True—but why is time ‘illegitimate’? Our belief that minerals depend on molecular structure, not dates, comes from *other* experiments. The point is: the *available evidence* didn’t rule out Rule 2. Science often uses provisional rules before mechanisms are known."  

  **Conclusion Tip:** Use the whiteboard to translate "always scratches" into Rule 2’s framework during the debrief (e.g., "always scratches = [Rule 2 property] if tested before t, [opposite] after"). This bridges to Goodman’s interdefinability.
