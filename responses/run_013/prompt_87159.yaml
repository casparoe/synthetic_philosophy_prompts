  We are designing a classroom simulation for Goodman's new riddle of induction without using the terms "grue", "bleen", "projectible", or "entrenchment". The goal is for students to realize that the same evidence can support two conflicting rules, and that common justifications (like simplicity or naturalness) are problematic.

  Constraints:
  1. No lecture at start; avoid target vocabulary during activity.
  2. Participants commit in writing to a rule and prediction in advance, with a cost (tokens). Private commitment then group deliberation.
  3. Both rules have perfect record; neither looks more rigged. Use participants' antecedent beliefs (e.g., mineral color doesn't change on a date) without undermining the puzzle.
  4. Participants must construct a new rule that fits all evidence and diverges on next case, quickly (under 2 min) to show ease.
  5. Decide if the preferred rule wins, loses, or is unresolved. Adjust session accordingly.

  Brainstorm candidate mechanics:

  1. **Gemstone Inspection Game**: Students are gemologists predicting the color of newly mined emeralds. They see a series of emeralds (index cards) with inspection dates and colors. They commit to a rule (e.g., "always green" vs. "green if mined before t, blue otherwise") and bet tokens. The twist is that both rules fit past data, but after t, the rival rule predicts blue. Problem: The rival rule might look artificial because of the date condition.

  2. **Plant Flowering Time**: Participants are botanists predicting when a species of plant flowers. The rule could be based on temperature or a calendar date. Two rules: "flowers when temp > 20°C" vs. "flowers when temp > 20°C and before June 21, or when temp < 10°C after June 21". But temperature and date might not be symmetric.

  3. **Star Color Change**: Astronomers observe a star's color at different times. Rule A: always red. Rule B: red if observed before t, blue otherwise. But stars don't change color abruptly, so participants might reject Rule B as implausible.

  4. **Mineral Hardness Test**: Geologists testing a mineral's hardness with a new method. Rule A: always scratches glass. Rule B: scratches glass if tested before t, doesn't scratch after t. This uses a physical property that is expected to be stable.

  We choose **Mineral Hardness Test** because:
  - Mineral properties are expected to be stable over time, so the date-based rule will seem artificial, yet we can argue symmetry.
  - Hardness is a binary property (scratches/doesn't) like color, and we can control the data.

  But note: We need to avoid the term "grue". We'll call the rules by neutral names and define them without disjunctive language.

