  **Activity: The Mineralogist's Challenge**

  We have a newly discovered mineral, "Zirconite". We have tested samples on various dates and recorded whether they scratch glass (a standard hardness test). All samples tested so far (before today) have scratched glass. We are about to test a new sample today (which is after a fixed date t). The rules:

  - Rule A: Zirconite always scratches glass.
