    - Rule 2: "Zirconite scratches glass if tested before 2023-12-31, and does not scratch glass if tested on or after 2023-12-31."

  - Instructions for the activity.

  Timeline:

  90 minutes total.

  - 0-5 min: Setup. Move chairs to groups. Hand out materials (tokens, index cards). Explain the scenario without framing the problem.

  - 5-15 min: Present past data (show the three observation cards). Present the two rules. Explain that today we test a sample from 2024-01-15. They must choose a rule and predict.

