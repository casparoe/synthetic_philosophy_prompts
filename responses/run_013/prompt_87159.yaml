  Materials:

  - Index cards for private commitment: one per student.
  - Adhesive labels? Maybe for naming rules? Or we can skip.
  - Play-money tokens: each student gets 5 at the start? Then they bet 1 privately and the group bets 5.
  - Two envelopes: one for the test result? We can have one envelope with the test result (which we pre-set to "does not scratch").

