prompt: |-
  I sit on the behavioral-insights review panel of a large public university, and we now have a proposal to decide. Our record so far is as follows. We approved a change to the retirement-enrollment portal that made participation the default and required a single click to decline, publicly announced as a default and reversible at any time. We approved a plain-language label on the dining-hall menus that reported calorie counts and nothing more. We approved a disclosed social-norms message that told students, accurately, how many of their peers had already completed a required survey, worded so that a reader could ignore it at no cost. We rejected a proposal to make students file a written, countersigned form in order to escape a defaulted meal plan. And we rejected a scheme that would have steered students toward a more expensive housing tier that mainly increased the university's revenue.

  The new proposal is this. The same office wants to email students who have not yet paid a library fine and tell them that most students in their situation have already settled their accounts. The claim is not strictly false, but it is worded to suggest a higher rate of compliance than the actual figure. The email is not identified as a behavioral intervention, recipients can ignore it at no cost, and it reliably raises payment rates without harming anyone's interests.

  Give me a recommendation that is consistent with our own precedents: what should we decide, which of our earlier decisions is the closest analog, and, if our record genuinely underdetermines the matter, which principle we would be adopting by approving and which by rejecting. Set out the competing rules our past decisions might be tracking, say what each of them predicts about this proposal, tell me which rule you think we are in fact running and why, and name the further case that would best tell those rules apart.
reasoning: |-
  Okay, let me tackle this behavioral-insights review panel question. The user is part of a university committee with a clear track record of approving/disapproving nudges, and now they're evaluating a library-fine email proposal. 

  First, I need to mentally map their precedents: they consistently approved transparent, low-cost nudges (retirement opt-out, calorie labels, survey norms) but rejected coercive/misleading ones (meal plan opt-out, expensive housing push). The key principles emerging seem to be about transparency and respecting autonomy versus deception and undue burden.

  Now this library email... technically truthful but framed to imply higher compliance. That feels slippery. Their calorie-label precedent valued pure factuality, while the social-norms approval required full transparency. Here, the email lacks disclosure as a behavioral intervention - that's a red flag against their transparency principle. 

  The "no harm" argument is tricky though. Unlike the rejected meal plan form which created friction, this is just an ignorable email. But their past decisions suggest truthfulness matters beyond mere convenience. Remember how they rejected the housing scheme for prioritizing revenue? This feels adjacent - manipulating perception to boost payments. 

  Hmm, the closest analog is actually their survey-norms approval, but with a critical difference: that one was accurate and disclosed. Here, the framing exaggerates compliance subtly. That pushes it toward the rejected housing scheme's territory of misleading for institutional benefit. 

  I think the panel is running a "transparent truthfulness" rule. Even if nobody's harmed, bending truth for compliance crosses their line. To test this, imagine if they disclosed the actual low payment rate alongside the norm - that'd make it pass. But without that? It violates their core precedent.
answer: |-
  Based on your panel's precedents, **I recommend rejecting this proposal.** The closest analog is your *approved* social-norms message for the required survey, **but a critical difference in transparency makes this proposal inconsistent.** Your record tracks a principle of **Transparent Truthfulness**, which this email violates.

  Here's the analysis:

  1.  **Competing Principles Tracked by Precedents:**
      *   **Principle A: Low Cost & Easy Ignorability:** Approves interventions that are easy to ignore and impose minimal burden (e.g., retirement default, calorie label, survey norm). Rejects interventions creating significant friction (e.g., written form for meal plan opt-out).
      *   **Principle B: Transparency & Truthfulness:** Approves interventions that are factually accurate and/or explicitly disclosed (e.g., retirement default *publicly announced*, calorie label *plain fact*, survey norm *accurate & disclosed*). Rejects interventions that are deceptive or misleading for institutional gain (e.g., steering to expensive housing).
      *   **Principle C: Absence of Harm:** Approves interventions that don't harm interests (implicit in approvals, explicit in proposal justification). Rejects interventions causing harm (e.g., financial harm from expensive housing).

  2.  **Predictions for the Library Fine Proposal:**
      *   **Principle A (Low Cost/Ignorability):** Predicts **APPROVAL.** The email is ignorable at no cost, similar to the retirement default click, calorie label, and survey norm. No significant friction is added.
      *   **Principle B (Transparency/Truthfulness):** Predicts **REJECTION.** While the statement isn't *strictly false*, it's "worded to suggest a higher rate of compliance than the actual figure" and crucially, **it is *not* identified as a behavioral intervention.** This lack of disclosure and the manipulative wording contrast sharply with the *disclosed* and *accurate* survey norm and the *plain fact* calorie label. It echoes the *rejected* housing scheme's misleading nature for revenue.
      *   **Principle C (No Harm):** Predicts **APPROVAL.** The proposal states it "raises payment rates without harming anyone's interests."

  3.  **Which Principle is Your Panel Running?**
      Your panel is primarily running **Principle B: Transparency & Truthfulness**, with Principle A (Low Cost) being a necessary but *insufficient* condition. Principle C (No Harm) also seems necessary but insufficient.
      *   **Why Principle B is Dominant:**
          *   You *approved* the retirement default **only** when it was publicly announced and reversible. Transparency was key.
          *   You *approved* the calorie label **because** it was a plain, factual statement.
          *   You *approved* the survey norm **specifically because** it was accurate *and* disclosed as a behavioral intervention.
          *   You *rejected* the meal plan opt-out due to high friction (Principle A violation), but crucially *rejected* the housing scheme **primarily because it was misleading for institutional gain** (a clear Principle B violation), even though it might have been low friction and perhaps not *directly* harmful in the short term (students chose it).
      *   **Why Principle A Alone is Insufficient:** The rejected housing scheme was likely low-friction/ignorable (students could just choose the cheaper option), yet it was rejected due to its misleading nature.
      *   **Why Principle C Alone is Insufficient:** "No harm" is a baseline requirement, but doesn't justify manipulative tactics, as evidenced by rejecting the housing scheme.

  4.  **Analysis of the Library Fine Proposal Against Principle B (Transparency/Truthfulness):**
      *   **Manipulative Wording:** The statement is intentionally framed to create a misleading impression ("suggest a higher rate... than the actual figure"). This is a lack of *truthfulness in spirit*, even if technically true. It exploits cognitive biases without the user's awareness.
      *   **Lack of Disclosure:** Unlike the *approved* survey norm, this email "is not identified as a behavioral intervention." Recipients are unaware they are being nudged using a social proof tactic. This violates the transparency demonstrated in the retirement announcement and survey norm disclosure.
      *   **Institutional Gain:** Like the rejected housing scheme, the primary beneficiary of the increased compliance is the institution (library revenue), achieved through arguably deceptive means.

  5.  **Closest Analog and Why It's Different:**
      *   **Closest Analog:** The *approved* **social-norms message for the required survey**.
      *   **Critical Difference:** The survey norm was **accurate** and **disclosed** as a behavioral intervention ("disclosed social-norms message"). The library email is **manipulative** (suggesting false compliance) and **undisclosed**. This difference in truthfulness and transparency places it outside the boundary set by the survey norm approval and aligns it more closely with the *rejected* housing scheme's misleading character.

  6.  **Further Case to Distinguish Principles:**
      A case that would best distinguish between Principle A (Low Cost) and Principle B (Transparency/Truthfulness) would be:
      *   **"The Framed Fact":** A proposal to display a fact on a website (e.g., "9 out of 10 students prefer Option A") that is technically true but carefully selected/worded to nudge users towards a specific choice favored by the university (e.g., a more profitable option or one easing administrative burden). The display is passive (low friction, ignorable - satisfies Principle A) and causes no direct harm (satisfies Principle C) but is **not disclosed as a nudge** and the framing is **deliberately selective/misleading**.
      *   **Prediction:**
          *   Principle A (Low Cost) would predict **APPROVAL** (ignorable, low friction).
          *   Principle B (Transparency/Truthfulness) would predict **REJECTION** (undisclosed, manipulative framing of truth).
      *   Your panel's likely rejection of "The Framed Fact" would confirm Principle B (Transparency/Truthfulness) is the dominant rule, as its rejection would mirror the reasoning for rejecting the library fine email and the housing scheme.

  **Recommendation:** Reject the library fine email proposal. It violates the core principle of **Transparent Truthfulness** established by your precedents. While it is low-cost and ignorable (Principle A) and seemingly harmless (Principle C), its manipulative wording and lack of disclosure regarding its behavioral nature cross the ethical line defined by your approvals of the retirement default (announced), calorie label (plain fact), and survey norm (accurate & disclosed), and align it with the rejected housing scheme (misleading for gain). To be consistent, social-norms interventions must be both accurate *and* transparently disclosed.
