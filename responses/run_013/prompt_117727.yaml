prompt: |-
  Right, I teach the third-year/MA seminar in philosophy of medicine and I'm writing the final, and the naturalism vs normativism unit is the one where the whole class can recite "Boorse says disease is value-free biological dysfunction, the normativists say it's value-laden all the way down, and Wakefield splits the difference with harmful dysfunction" and then falls apart the second you push them. So I want one essay question (90 minutes, 20 marks) that they can't answer by reciting that, and that they can answer without having read anything except the question itself.

  Here's the material I want built into the stem. Case A: an industrial toxin has, for two generations, held everyone in a valley to about 60% of the lung function you'd see in comparable populations elsewhere; nobody in the valley has species-typical lungs, and no one in the valley is "below normal" relative to anyone else in it. Case B: a rare structural variant, present in maybe one person in a thousand, harmless, no loss of function, no symptoms, nobody would call it a disease. I want the question to force them to see that statistics get you nowhere on their own: if they think A is a disease (or a disorder, or at least a bad state of a body that medicine has a reason to care about), then statistical abnormality isn't neccessary for disease, and B shows it isn't sufficient either. So whatever is doing the work in the naturalist's account has to be function and species-typical design. Then the crux: if the valley's lungs are dysfunctional because they fall short of the species design, you owe an answer to which environment the design is supposed to operate in, and fixing that looks like a normative choice about what counts as a proper or natural environment for a human. I want them to say whether the naturalist can pin that down non-normatively, and if not, whether it sinks naturalism outright or whether the naturalist can concede something modest and still hold the line — and where that leaves the harmful-dysfunction hybrid (naturalist, normativist, or neither?).

  Couple of constraints for you. Put the two cases in the stem so a student who's read nothing can still do well; name Boorse and Wakefield if you want, but don't let the marks depend on knowing who said what, and don't ask them to cite anything — no reading list, no internet in the exam room.

  Give me (1) the question itself, with parts, since it's 90 minutes and 20 marks; (2) a model answer of around 600-700 words, the kind of thing a strong student writes rather than a lecture, and no citations in it; (3) a marking scheme of five must-hit points, 4 marks each, with one line per point on the specific way candidates usually blow that point — I'd definately want the A/B line to be about whether they see that the statistics can't be doing the work, not about name-dropping.

  Last line, after the marking scheme, just: \answer{...} with a short phrase naming the single move that separates an A from a B on this question, and nothing after it.
reasoning: |-
  We are creating an exam question that forces students to think beyond the simple recitation of naturalism vs. normativism in the philosophy of medicine. The question will present two cases (A and B) and require students to analyze the implications for the concepts of disease, dysfunction, and the role of values.

  The core insights we want to elicit:
  1. Case A: A whole population has reduced lung function due to an industrial toxin. This is statistically normal in that valley (everyone has it) but is not species-typical. Students should see that statistical abnormality is not necessary for disease because here we have a condition that is statistically normal in the valley but arguably a disease (or disorder) because it falls short of the species design.
  2. Case B: A rare but harmless structural variant. This shows that statistical abnormality is not sufficient for disease because it's rare but not considered a disease.

  Therefore, the naturalist (like Boorse) must rely on the concept of function and species-typical design. But then we push: what environment is the species design supposed to operate in? The toxin in the valley has created an environment that is not the "natural" one. Deciding what counts as the natural environment seems to involve a normative choice.

  We then ask:
  - Can the naturalist non-normatively specify the environment?
  - If not, does this sink naturalism, or can the naturalist concede a modest normative element and still hold the line?
  - What does this imply for Wakefield's harmful dysfunction hybrid? Is it naturalist, normativist, or neither?

  Constraints:
  - Put Case A and Case B in the stem so that a student without prior reading can answer.
  - Don't require knowledge of Boorse or Wakefield beyond what is in the question (if we mention them, it's for context but not required for marks).
  - The question should have parts to guide the 90-minute, 20-mark essay.

  Structure of the Question:

  Part 1: Describe what each case shows about the role of statistical abnormality in defining disease. (A: statistical abnormality not necessary; B: not sufficient)

  Part 2: Explain how a naturalist (like Boorse) would account for disease in these cases by appealing to function and species-typical design.

  Part 3: Discuss the challenge that Case A poses for the naturalist: how to specify the environment in which the species design is supposed to function without making a normative choice.

  Part 4: Evaluate whether the naturalist can respond to this challenge without abandoning naturalism. Also, consider what this means for Wakefield's harmful dysfunction account: does it remain naturalist, normativist, or become a hybrid? And where does the normative element enter?

  Now, the model answer (600-700 words) should be a strong student's response, without citations.

  Marking Scheme: 5 points, each 4 marks, with a one-line note on common mistakes.

  Finally, the \answer{...} with a short phrase on the move that separates an A from a B.

  Let's proceed.
answer: |-
  ### Exam Question (90 minutes, 20 marks)

  **Stem:**  
  Consider two cases:  
  - **Case A:** An industrial toxin has, for two generations, reduced lung function in every resident of a valley to 60% of the level seen in comparable populations elsewhere. No one in the valley has species-typical lungs, and no resident is "below normal" relative to others in the valley.  
  - **Case B:** A rare structural anatomical variant occurs in roughly 1 in 1,000 people. It is harmless, causes no loss of function or symptoms, and is not regarded as a disease.  

  **Question:**  
  1. **Analysis of Statistical Abnormality (6 marks):**  
     Using Cases A and B, explain why statistical abnormality (deviation from a population average) is neither necessary nor sufficient for defining disease. Support your answer with specific references to each case.  

  2. **Naturalist Account of Disease (5 marks):**  
     How might a naturalist (e.g., Boorse) define disease in Cases A and B by appealing to biological function and species-typical design? Address both cases in your response.  

  3. **Challenge to Naturalism (5 marks):**  
     Case A raises a problem for the naturalist’s reliance on "species-typical design." What is this problem, and why might it force the naturalist to make a normative (value-laden) choice about the "proper environment" for human biology?  

  4. **Implications for Hybrid Accounts (4 marks):**  
     If naturalism requires normative input to define "proper environment," can it still maintain that disease is primarily value-free? What does this mean for Wakefield’s "harmful dysfunction" account—does it align more with naturalism, normativism, or neither? Justify your view.  

  ---

  ### Model Answer (Strong Student Response, ~650 words)  

  **(1) Analysis of Statistical Abnormality**  
  Statistical abnormality fails as a standalone criterion for disease because it is neither necessary nor sufficient. Case A demonstrates that statistical abnormality is **not necessary** for disease. Here, everyone in the valley has identically reduced lung function (60% of external populations), making it statistically "normal" within the valley. Yet, this uniform deficit likely constitutes a disease—it impairs a vital biological function (respiration) relative to the human species norm. If disease required statistical abnormality, the valley’s universal lung deficit would not qualify, which is counterintuitive. Conversely, Case B shows statistical abnormality is **not sufficient**. The rare anatomical variant is statistically abnormal (1 in 1,000) but harmless and non-functional, so it isn’t a disease. Thus, statistics alone cannot define disease; they must be paired with functional criteria.  

  **(2) Naturalist Account of Disease**  
  A naturalist like Boorse would define disease as a *value-free biological dysfunction*—a failure of a part to perform its species-typical function. In Case A, the naturalist would argue the lungs are dysfunctional because they operate at 60% capacity, falling short of the species design for respiration. This dysfunction exists regardless of the valley’s local statistics, as the benchmark is the universal human norm. For Case B, the naturalist would note the variant causes no functional impairment; it performs all expected biological roles adequately. Thus, it isn’t a dysfunction or disease, even though it is statistically rare. The naturalist resolves both cases by prioritizing functional performance against a species standard, not local statistics.  

  **(3) Challenge to Naturalism**  
  Case A exposes a critical flaw in naturalism: specifying the "species-typical design" requires defining the *environment* in which that design should function. The naturalist might claim the valley’s lungs are dysfunctional because they fail in the "natural" human environment. But the toxin has altered the valley’s environment for generations—is this now the "normal" context? Deciding which environment is "proper" for assessing function involves a normative choice. For instance, labeling the toxin-free environment as "natural" implies a value judgment about what conditions humans *ought* to inhabit (e.g., unpolluted air). If the naturalist insists the original environment is the benchmark, they must explain why without appealing to values (e.g., health benefits). Yet, any such justification—like appealing to evolutionary fitness or well-being—smuggles in norms about what is "good" for humans. Thus, naturalism cannot pin down "species-typical design" without normative input.  

  **(4) Implications for Hybrid Accounts**  
  The naturalist can concede modest normative input without collapsing into full normativism. For example, they might accept that "proper environment" involves minimal normative assumptions (e.g., environments without artificial toxins) but insist dysfunction itself remains objective. This preserves naturalism’s core—dysfunction is still grounded in biology, not values. However, Wakefield’s "harmful dysfunction" hybrid suffers ambiguity here. It splits disease into "dysfunction" (naturalist) and "harm" (normativist). But if "dysfunction" depends on normative choices about environment (as in Case A), the naturalist component is compromised. Harmful dysfunction then becomes *predominantly normativist*: harm does the heavy lifting, while "dysfunction" inherits normative baggage. Alternatively, if Wakefield insists dysfunction is purely biological, he faces the same environmental challenge as Boorse. Either way, Case A shows that no account can fully escape normativity—naturalism must accommodate values at the margins, and hybrids like Wakefield’s lean normativist when pressed.  

  ---

  ### Marking Scheme (5 points, 4 marks each)  
  1. **Case A demonstrates statistical abnormality is not necessary for disease**  
     *Common mistake: Claims Case A is not a disease because it is statistically normal in the valley, missing that necessity requires disease to be abnormal—here it is not abnormal but may still be disease.*  
  2. **Case B demonstrates statistical abnormality is not sufficient for disease**  
     *Common mistake: Focuses only on Case B’s harmlessness without contrasting it with Case A, failing to show sufficiency requires abnormality to imply disease—which it doesn’t here.*  
  3. **Naturalism relies on species-typical function, not statistics, to resolve both cases**  
     *Common mistake: Describes naturalism generally but does not apply it to both cases (e.g., ignores why Case B isn’t dysfunctional).*  
  4. **Case A forces a normative choice about "proper environment" for species design**  
     *Common mistake: Identifies the environmental problem but does not explain why it is normative (e.g., by equating "natural environment" with non-evaluative facts).*  
  5. **Wakefield’s account becomes normativist-leaning if dysfunction depends on normative environment**  
     *Common mistake: Asserts harmful dysfunction is purely naturalist or neutral without addressing how environmental normativity affects the "dysfunction" component.*  

  \answer{Recognizing that environmental specification requires normative input}
