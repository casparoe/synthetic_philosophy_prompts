          Instructions: "You should choose an efficient point, meaning that you cannot make one better off without making the other worse off."

          We can also explicitly say: "Choose a point on the frontier."

          timeline for movement 1: 5 minutes for bargaining -> then collect outcomes.

          Then movement 2: class comparison.

  ---

  ### Movement 2: Class Comparison (20 minutes)

  - Have the pairs from Group A and Group B report their agreements.
    - Record on a board: 
        Group A: (x1, y1), (x2, y2), ...
        Group B: (x1, y1), ...

  - Typically, Group A will have agreements around (25,25) [or maybe not, but likely near equal split]. 
  - Group B might have agreements around (30,25) or ( something around there). 

  - Then, have the class notice: 
    - In Group B, player 1 tended to get more than in Group A.
    - In Group B, player 2 got about the same as in Group A.

  - Now, simulate a confrontation between a pair from Group A and a pair from Group B that have the same player 2 payoff (25) but different player 1 payoffs (25 vs 30). 
    - The player 1 from Group B: "I got 30 because the set allowed me to get more without harming you (player 2) - in fact, you still get 25, the same as in Group A."
    - The player 1 from Group A: "But if we had the expanded set, I would have gotten 30 too. Why should you get more just because the set expanded, if the new options (like (60,0)) were not chosen? The point (25,25) was still available and efficient in both, so why didn't you choose that?"

  - Let them debate. 

  - Then, the instructor notes: 
    - We have two intuitive principles: 
        1. If the set expands in a way that benefits one player (at every level of the other player's payoff), that player should not end up worse off. (This is the monotonicity condition.)
        2. If we add new options that are not chosen, then the agreement should not change. (This is the independence of irrelevant alternatives.)

    - In this case, the expansion in Group B benefits player 1 at every level of player 2's payoff (as we saw: for any fixed y, player 1 can get more). So by principle 1, player 1 should not get less than in Group A. In fact, we see player 1 got more.
    - But by principle 2, since the point (25,25) was available in both and was the agreement in Group A, it should also be the agreement in Group B. 

    - So the two principles conflict in this example.

  ---

  ### Movement 3: Constitutional Convention (30 minutes)

  - The whole class must write a single rule for any bargaining problem. The rule should be mechanical: given a feasible set S and a disagreement point d, it outputs a point in S.

  - They have 10 minutes to discuss and write down the rule.

  - Then, the instructor tests their rule against a battery of examples. Have these prepared on slides or boards.

    **Battery of examples:**
    1. **Relabeling the parties:** 
          Problem 1: S = { (x,y) : x+y<=1, x>=0,y>=0 }, d=(0,0).
          Problem 2: swap x and y in Problem 1: S' = { (x,y) : y+x<=1, x>=0,y>=0 } [same as S], d=(0,0).
          -> The solution should swap. If their rule is symmetric, it should give (0.5,0.5) for both.

    2. **Mirror image problem:**
          S = { (x,y) : x+2y<=100, x>=0,y>=0 }, d=(0,0).
          Mirror: S' = { (x,y) : 2x+y<=100, x>=0,y>=0 }, d=(0,0).
          -> The solution should be mirrored: if in S it's (a,b), in S' it should be (b,a).

    3. **Added option not selected:** 
          Base set: S1 = convex hull of (0,0),(50,0),(0,50) -> frontier x+y=50 for x in[0,50],y in[0,50].
          Expanded set: S2 = convex hull of (0,0),(50,0),(0,50),(60,10) [or a point that is not chosen].

          In the base set, suppose the rule gives (30,20).
          In the expanded set, the point (30,20) is still available. Does the rule give the same point? It should by IIA.

    4. **One party's prospects improve at every level of the other's payoff:**
          Base set: S1 = convex hull of (0,0),(50,0),(0,50).
          Expanded set: S2 = convex hull of (0,0),(60,0),(0,50) -> which is the example from the activity.
          In the base set, suppose the rule gives (25,25).
          In the expanded set, by monotonicity, player 1 should not get less than 25.

    - We know that any rule will fail at least one of these.

    - After they write the rule, apply it to example 4 first (because that's the one they did). It will likely fail either IIA or monotonicity.

    - Then, they have to locate the failure.

  ---

  ### Debrief (10 minutes)

  - Revisit the bargaining activity:
    - In Group A: feasible set was x+y<=50, and many chose (25,25).
    - In Group B: feasible set allowed player 1 to get up to 60 when player 2 gets 0, and at player 2=25, player 1 can get 30. Many chose (30,25).

  - Conditions:
    - **Independence of Irrelevant Alternatives (IIA):** If the solution in a larger set T is available in a subset S that contains the disagreement point, then the solution in S should be the same as in T. In reverse: if we add new options and the original solution is still available, then the solution should not change. In the activity, the point (25,25) was available in both, so IIA would require the solution in Group B to be (25,25). But in Group B, they typically choose (30,25) which is different.

    - **Monotonicity:** If the set expands in such a way that for every fixed level of player 2's utility, player 1 can get at least as much as before (and sometimes more), then player 1 should not get less in the new solution. In the activity, the set expanded in precisely this way, and player 1 got more (25 to 30), which is consistent with monotonicity.

  - Why do they conflict in this example?
    - If we require IIA, then the solution in Group B should be (25,25) -> but then player 1 gets the same as in Group A, even though the set expanded in their favor, violating monotonicity.
    - If we require monotonicity, then player 1 should get at least 25 in Group B, and indeed we see 30 -> but that's not (25,25), so IIA is violated.

  - Then introduce the two solutions (without naming them initially):
    - One solution (Nash) satisfies IIA and would give (25,25) in both sets.
    - Another solution (Kalai-Smorodinsky) satisfies monotonicity and in Group A gives (25,25) and in Group B gives (30,25) [because it lies on the ray from (0,0) to the ideal point (60,50), which is y=(5/6)x; and then intersect with the frontier of Group B: x/60+y/50=1. If we set y=(5/6)x, then x/60 + (5/6 x)/50 =1 -> x/60 + x/(60) =1 -> 2x/60=1 -> x=30, y=25].

  - Finally, name the solutions and state that they are incompatible: you cannot have both conditions.

  - Also, note that the activity cannot reproduce:
    - The generality of the axioms: we only saw one example, but the axioms are for all bargaining problems.
    - The convexity and randomization: we assumed convex sets, but in reality without convexity the frontier might be non-linear and we might need randomization to convexify.
    - The axiomatic approach is normative: it's about how we think bargaining should be done, not necessarily how it is done.
    - The incompatibility is a theorem: it has been proven that no solution can satisfy all of Nash's axioms plus monotonicity.

  ---

  ### What can go wrong:

  1. **Pairs collapsing to 50-50 in Group B:** 
     - They might split the maximum total? In Group B, the maximum total is 60+50=110, but that's not attainable simultaneously. 
     - Or they might do 50-50 of the maximum each? 30 for player 1 and 25 for player 2 -> which is not 50-50 of anything. 
     - If they do 50-50 of the sum: in Group A, the sum is 50, so 25-25. In Group B, the sum along the frontier varies: at (60,0) sum=60; at (0,50) sum=50. The maximum sum is 60, but then one gets 60 and the other 0. 
     - They might do equal relative sacrifice? 
     - If they insist on equal payoffs, in Group B they might choose the point on the frontier with x=y: 
            x = y, and x/60+y/50=1 -> x/60+x/50=1 -> (5x+6x)/300=1 -> 11x=300 -> x=300/11≈27.27. 
          So (27.27,27.27). 
     - Then in the activity, player 1 gets 27.27 in Group B and 25 in Group A, and player 2 gets 27.27 in Group B and 25 in Group A. 
     - This still shows an increase for both, but then the conflict is not as sharp.

     **How to handle:** 
        - In the comparison, note that in Group B both players got more, but the expansion only directly benefits player 1. Player 2's ideal is unchanged, so why should player 2 get more? 
        - Also, the added options for player 1 might be used to argue that player 1 should get more, but player 2 might have happened to benefit too. 
        - Then in the constitutional convention, when you present the example of expansion that only benefits player 1 at every level of player 2 (like the first example we considered where player 2's ideal is unchanged), then their rule might fail.

  2. **Dominant personality:** 
     - One player might dominate and take almost everything. In Group A, might see (45,5) or in Group B (55,5). 
     - Then in the comparison, the agreements may not show the pattern of player 1 getting more in Group B. 

     **How to handle:** 
        - Reassure that this is possible in real bargaining, but the normative theory is about fair division. 
        - In the debrief, note that the axiomatic approach is for fair bargains.

  3. **Some pairs fail to agree:** 
     - They get (0,0). 
     - **Handle:** In the comparison, note that these pairs are not informative for the conditions we are discussing, and focus on the ones that reached agreements.

  4. **Convention deadlock or ad hoc rule:** 
     - They might write a rule that has exceptions or is very complex. 
     - **Handle:** When testing, show that it fails one of the prepared examples. 
     - Or, they might write a rule that is one of the known solutions. If they write the Nash rule (max product of gains) or KS rule (along the ray), then it will fail one of the tests.

  Given the complexity, it's okay if the activity doesn't go perfectly. The key is to use the experience to motivate the axioms and the incompatibility.

  ### Materials:
  - For each pair in Group A: a sheet with the feasible set of Group A (x>=0, y>=0, x+y<=50) with the frontier line emphasized.
  - For each pair in Group B: a sheet with the feasible set of Group B (x>=0, y>=0, x/60+y/50<=1) with the frontier line from (60,0) to (0,50) emphasized.
  - Markers and rulers for drawing.
  - A board to record outcomes.
  - Slides or handouts for the constitutional convention battery of examples.

  ### Timeline:
  - **Movement 1: 30 minutes** (5 minutes for setup and explanation, 5 minutes for bargaining, 5 minutes to collect results, and 15 minutes buffer for any delays and to ensure all pairs finish).
  - **Movement 2: 20 minutes** (5 minutes to report results, 10 minutes for the confrontation and discussion, 5 minutes to introduce the two conditions).
  - **Movement 3: 30 minutes** (10 minutes for the convention to write the rule, 15 minutes for testing against the battery and discussion, 5 minutes to locate the failure).
  - **Debrief: 10 minutes.**

  This is a tight schedule, but it should work.

  Good luck!
answer: |-
  Below is a detailed lesson plan for your 90-minute session, designed to create an experiential understanding of the conflict between Nash's independence of irrelevant alternatives (IIA) and Kalai-Smorodinsky's monotonicity condition. The session avoids naming the solutions until the debrief, forcing students to grapple with the axioms through hands-on bargaining and rule-making.

  ---

  ### **Session Structure & Timeline**  
  *(Total: 90 minutes)*  

  #### **Movement 1: Bargaining Experiment** (30 minutes)  
  **Objective:** Students bargain in pairs over two variants of a payoff set.  
  **Materials:**  
  - **8 identical physical bargaining tables** (e.g., 16" × 16" boards or large sheets of paper) with axes labeled "Player 1 Points" (x-axis) and "Player 2 Points" (y-axis).  
  - **Feasible sets drawn on the tables**:  
    - **Group A (4 tables)**: Base set (Set A).  
      - *Shape*: Triangle with vertices at (0, 0), (50, 0), (0, 50).  
      - *Frontier*: Line segment connecting (50, 0) to (0, 50) (equation: \(x + y = 50\)).  
      - *Disagreement point*: (0, 0).  
      <img src="https://i.imgur.com/0ZbJQ8l.png" width="200"/>  
    - **Group B (4 tables)**: Expanded set (Set B).  
      - *Shape*: Triangle with vertices at (0, 0), (60, 0), (0, 50).  
      - *Frontier*: Line segment connecting (60, 0) to (0, 50) (equation: \(x/60 + y/50 = 1\)).  
      - *Disagreement point*: (0, 0).  
      - *Key property*: Set B is a superset of Set A. Player 1’s maximum payoff increases from 50 to 60, while Player 2’s maximum remains 50. Crucially, for every fixed payoff level of Player 2, Player 1’s maximum feasible payoff increases (e.g., at Player 2 = 25, Player 1’s max rises from 25 in Set A to 30 in Set B).  
      <img src="https://i.imgur.com/3fYQKXJ.png" width="200"/>  
  - **Tools for each pair**: Ruler, dry-erase marker, paper tokens (to mark proposed points).  
  - **Payoff scheme**: Points are redeemable for non-monetary rewards (e.g., 10 points = 1 exemption from a short response paper; 20 points = priority snack choice). Ensure rewards are linear in points.  

  **Rules & Instructions to Students (verbatim):**  
  > "In your pair, one of you is Player 1 (maximizes x-axis points), the other is Player 2 (maximizes y-axis points. You must jointly agree on any point in the shaded triangle within 5 minutes. If no agreement, both get (0, 0). Your agreement must be on the frontier line (i.e., you cannot leave mutual gains 'on the table')."  

  **Predictable Issues & Mitigation:**  
  - **50-50 norm**: Some pairs may default to equal splits (e.g., Set A: (25,25)). Mitigate by reminding them they must justify why it’s fair.  
  - **Dominant personalities**: Assign roles randomly. If one student dictates, intervene: "Player 2, do you consent to this split? Why?"  
  - **No agreement**: If a pair deadlocks, enforce (0, 0). Use this to discuss inefficiency later.  
  - **Off-frontier agreements**: Gently correct: "Is there a point where both get more?"  

  **Expected Outcomes:**  
  - **Set A**: Most pairs choose (25, 25) (equal split of the 50-point "pie").  
  - **Set B**: Most pairs choose (30, 25) (Player 1 gets more due to expanded leverage) or (25, 25) (if IIA intuition dominates).  

  ---

  #### **Movement 2: Class Comparison** (20 minutes)  
  **Objective:** Contrast Set A vs. Set B outcomes to surface conflict between IIA and monotonicity.  
  **Procedure:**  
  1. **Report agreements** (5 mins): Record all pairs’ outcomes on the board:  
     - Group A: (25,25), (25,25), (30,20), (20,30)  
     - Group B: (30,25), (25,25), (28,27), (35,20)  
  2. **Confrontation** (15 mins):  
     - **Step 1**: Pair a Group A pair (e.g., (25,25)) with a Group B pair (e.g., (30,25)).  
     - **Step 2**: Role-play a debate:  
       - *Player 1 (Group B)*: "I got 30 instead of 25 because my options improved. Even at your payoff (25), I could get 30. Why shouldn’t I benefit?"  
       - *Player 1 (Group A)*: "But (25,25) was available in both sets! The new options in Set B weren’t chosen, so they shouldn’t change anything."  
       - *Player 2 (both groups)*: "I still get 25, so I’m fine." vs. "Player 1 in Group B is being greedy!"  
     - **Step 3**: Frame the conflict:  
       - "Two intuitive principles clash:  
         **Principle 1 (Irrelevance)**: If new options aren’t chosen, they shouldn’t alter the agreement.  
         **Principle 2 (Monotonicity)**: If one player’s options improve at every level of the other’s payoff, they shouldn’t get less."  

  ---

  #### **Movement 3: Constitutional Convention** (30 minutes)  
  **Objective:** Students legislate a single bargaining rule, then test it against edge cases.  
  **Procedure:**  
  1. **Rule-making** (10 mins):  
     - Task: "As a class, write a mechanical rule that takes any feasible set and disagreement point to a solution point. No exceptions!"  
     - Guide debate: Encourage simplicity (e.g., "maximize total points," "equal point gains").  
  2. **Test battery** (20 mins): Apply their rule to these cases (pre-drawn on slides):  
     - **Case 1 (Relabeling)**: Swap players in Set A.  
       - *Test*: Does the rule swap payoffs? (Symmetric solutions pass).  
     - **Case 2 (Added irrelevant option)**: Set A vs. Set A plus a new point (70, 10) not on the frontier.  
       - *Test*: If (25,25) is chosen in Set A, does it stay in the expanded set? (IIA requires this).  
     - **Case 3 (Monotonicity bite)**: Set A vs. Set B (as in Movement 1).  
       - *Test*: Does Player 1 get ≥25 in Set B? (Monotonicity requires this).  
     - **Case 4 (Mirror image)**: Feasible set with vertices (0,0), (0,40), (30,0).  
       - *Test*: Does the rule treat asymmetric sets consistently?  

  **Predictable Issues & Mitigation:**  
  - **Deadlock**: If debate stalls, impose a 60-second vote on contending rules.  
  - **Ad hoc rules**: If they propose "split equally unless options expand for one player," reject it: "Your rule must work for any set, including future cases you haven’t seen."  
  - **Rule failure**: When their rule fails a test (e.g., violates relabeling in Case 1), ask: "Where did your rule break? Which principle (irrelevance or monotonicity) did it sacrifice?"  

  ---

  ### **Debrief** (10 minutes)  
  **Goals:** Connect activity to axioms, name solutions, and clarify limitations.  

  1. **Map Activity to Axioms**:  
     - **Independence (IIA)**:  
       > "In Set B, some argued (25,25) should hold because the new options weren’t chosen (Case 2). Nash’s solution obeys this: it outputs (25,25) for both sets."  
     - **Monotonicity**:  
       > "Others argued Player 1 deserves more in Set B because their prospects improved at every level of Player 2’s payoff (Case 3). Kalai-Smorodinsky obeys this: it moves from (25,25) in Set A to (30,25) in Set B."  

  2. **Why the Conditions Conflict**:  
     - Show Set A and Set B on the board:  
       - **Nash**: Maximizes product of utilities. In Set A: \(x \times y\) max at (25,25). In Set B: (25,25) is still feasible and efficient, so Nash *sticks* there (honors IIA).  
       - **Kalai-Smorodinsky**: Equalizes relative concessions. In Set A: ray from (0,0) to ideal (50,50) gives (25,25). In Set B: ray to new ideal (60,50) intersects frontier at (30,25) (honors monotonicity).  
     - **The Collision**:  
       > "Nash’s IIA keeps the solution *fixed* when expanding to Set B. Kalai-Smorodinsky’s monotonicity forces it *along the ray to the ideal point*. You can’t have both in general—this is a theorem, not just an artifact of the examples."  

  3. **What the Activity Couldn’t Reproduce** (Clarify in Lecture Later):  
     - **Generality of axioms**: Students saw specific cases, but axioms apply to *all* bargaining problems.  
     - **Convexity & randomization**: Real bargaining allows randomized agreements (e.g., "40% chance of (50,0), 60% of (0,50)"), but we used simple triangles for clarity.  
     - **Normative vs. descriptive**: Axiomatic solutions prescribe "fair" bargains; they don’t predict real-world outcomes (e.g., power imbalances).  
     - **Theorem vs. artifact**: The IIA-monotonicity conflict is mathematically proven (e.g., for sets with free disposal, convexity), not dependent on chosen examples.  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem**: Pairs collapse to 50-50 in Set B (ignoring expansion).  
    - *Solution*: In Movement 2, contrast Group B’s (25,25) with a Group B pair who chose (30,25). Ask Player 1: "Why didn’t you demand more given your new options?"  
  - **Problem**: Convention deadlocks or creates ad hoc rules.  
    - *Solution*: Test their rule ruthlessly with the battery. If it fails, celebrate: "You’ve rediscovered why philosophers and economists debate this!"  
  - **Problem**: Students miss the IIA-monotonicity conflict.  
    - *Solution*: In Movement 2, force the Player 1 vs. Player 1 debate: "Should new options that weren’t chosen matter? Should improved opportunities?"  

  ---

  ### **Instructor’s Script for Key Moments**  
  - **When recording Set B outcomes**: "Interesting! In Set B, Player 1 often got more than in Set A, while Player 2 stayed at 25. Why?"  
  - **During constitutional convention**: "Your rule must be a *universal law*—no amendments when I show new cases!"  
  - **When their rule fails**: "Aha! Your rule honored [monotonicity/IIA] but sacrificed the other. This is the heart of the debate."  
  - **Debrief**: "Nash and Kalai-Smorodinsky both satisfy three axioms but part ways on the fourth. That’s why we have multiple ‘fair’ solutions."  

  This design forces students to *feel* the axiom conflict before naming the solutions, creating a "Eureka!" moment in the debrief. The physical bargaining makes abstract axioms visceral, and the constitutional convention reveals the impossibility of having it all.
