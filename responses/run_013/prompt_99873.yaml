  **METAPHYSICAL SUPPLY CO.**
  *Serving the Discerning Ontologist Since 1938*

  **THE RIGID DESIGNATOR (Cat. No. RD-101)**
  *Pinpoint Consistency Across All Contingencies*

  Ensure your designated object remains steadfastly *itself*, no matter how the world might twist and turn. The Rigid Designator secures unwavering reference to a specific entity across every conceivable circumstance where that entity exists. Forget flimsy descriptions that buckle under pressure or shift with the times. The RD-101 establishes a direct, unbreakable link – provided you maintain the vital connection. Operates independently of any defining characteristics or contingent properties the object may possess; its identity is locked in, not described. Ideal for philosophers, logicians, counterfactual scenario planners, and anyone requiring absolute referential stability.

  **SPECIFICATIONS**
  *   **Core Function:** Designates the identical object in every possible world where said object exists.
  *   **Referential Mechanism:** Borrowed designation via unbroken communicative chain originating from initial dubbing event. *No descriptive computation.*
  *   **Output:** Pure reference. *No sense, stereotype, or cluster of descriptions included or generated.*
  *   **Failure Mode:** Dangling or empty term resulting from broken communicative chain. *No syntactic or semantic warning indicators provided.*
  *   **Sensitivity:** Substitution with definite descriptions alters propositional content, particularly under counterfactual evaluation.
  *   **Power Source:** Original dubbing event (implicit; not user-serviceable).
  *   **Materials:** Stainless steel casing, Bakelite handle, referential intent.
  *   **Dimensions:** 7" L x 2" W x 1.5" H.
  *   **Weight:** 1 lb. 2 oz.

  **FREQUENTLY ASKED QUESTIONS**

  *   **Q: How do I know what object my Rigid Designator designates?**
      A: The Rigid Designator performs its core function of maintaining trans-world identity. Determining *which* specific object it designates in the actual world is an empirical matter outside the device's operational parameters. Reference is not descriptive content.

  *   **Q: What happens if the chain of communication gets broken?**
      A: Designation ceases. The term becomes dangling or empty. The RD-101 provides no error signals or diagnostic feedback for chain integrity failure. Regular verification of chain continuity is the user's responsibility.

  *   **Q: Can I use this to designate something based on what I *think* it is, like "the inventor of bifocals"?**
      A: Substituting a descriptive phrase fundamentally changes the referential mechanism and output. The RD-101 is incompatible with descriptive designation. For descriptive approaches, see our competitor's Descript-O-Matic (Cat. No. DM-77), which picks out whatever uniquely satisfies the associated descriptions in this world and any world satisfying them (performance claims valid only for the world the customer occupies).

  *   **Q: Is the "Necessary A Posteriori" add-on worth it?**
      A: The Premium Attachment (Cat. No. RD-101-NA) facilitates the discovery that certain empirically ascertained truths (e.g., identities established using two RD-101s) could not have been otherwise. This is a discovery about the relationship between designation and modality, not an installed feature. You find out empirically first, *then* recognize the necessity.

  *   **Q: Will this help me find my keys in another possible world?**
      A: If properly dubbed and attached to an unbroken chain referencing *those specific keys*, the RD-101 will designate them in any world where they exist. It will not assist in locating them within any given world; that remains an empirical task.

  **WARRANTY & RETURNS**
  Metaphysical Supply Co. warrants the Rigid Designator (RD-101) against defects in materials and workmanship for 90 days from date of purchase. This warranty covers the physical integrity of the casing, handle, and internal components facilitating the borrowing mechanism. It expressly *does not* cover:
  *   Dangling or empty terms resulting from broken communicative chains.
  *   User failure to establish or maintain a valid initial dubbing or communicative chain.
  *   Dissatisfaction arising from the device's inherent lack of descriptive content.
  *   Performance issues related to the Necessary A Posteriori discovery process (Cat. No. RD-101-NA).
  Returns require original packaging and a completed Return Authorization Form. Shipping costs are non-refundable. Descriptivist devices (e.g., Descript-O-Matic DM-77) are non-returnable once the satisfaction clause has been invoked by the user.

  **CUSTOMER REVIEWS**

  1.  **H.P., Topeka, KS:** "Ordered the RD-101 to finally settle debates about my uncle Ned. Followed the dubbing procedure precisely. The device now rigidly designates... *something*. But it stubbornly refuses to tell me *what* or *who* that something is, or even if it's Ned! Utterly useless for identification purposes. Feels like I paid $12.95 for a very heavy paperweight marked 'X'."
     *   **Metaphysical Supply Co. Replies:** Reference is not descriptive content. Verifying the actual-world referent requires empirical investigation separate from designation stability.

  2.  **"Counterfactual Carl", Berkeley, CA:** "Worked flawlessly for weeks, rigidly designating my prized '37 DeSoto Airflow in all my thought experiments. Then my buddy Ernie, who was present at the initial garage dubbing, moved to Akron. Now the device feels... loose. Sometimes it seems to designate the car, sometimes just a void where designation *should* be. No warning lights, nothing. Chain must be more fragile than advertised. Very disconcerting."
     *   **Metaphysical Supply Co. Replies:** The warranty excludes failures due to broken communicative chains. Ensure all links in the borrowing chain remain intact and accessible.

  3.  **Dr. A. Nalyst, Cambridge, MA:** "Purchased the RD-101 and the Necessary A Posteriori add-on. Designated 'Hesperus' and 'Phosphorus' separately. Spent months observing – standard astronomical procedure. Confirmed identity empirically. THEN engaged the NA module. The realization that this identity *could not have been otherwise*... breathtaking! Worth every penny of the $7.95 upgrade. Transformed my understanding. A true discovery."
     *   **Metaphysical Supply Co. Replies:** We are pleased the Premium Attachment facilitated the expected modal discovery process. Thank you for your business.
