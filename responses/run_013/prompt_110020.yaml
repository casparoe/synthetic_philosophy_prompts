prompt: |-
  So there's a pattern I keep running into at work and I can't find a word for it. We had established that our job runner processes each message exactly once -- tested it, traced the code, the queue supposedly guarantees it. Then someone finds a duplicate charge in the ledger. And the instant reaction, mine included, is: that can't be a real duplicate, the ledger query must be double-counting, or someone replayed the message by hand. The scary part is the reasoning feels airtight rather than lazy: since we know it's exactly-once, whatever produced that row is by definition not a counterexample to exactly-once, it's an artifact, so the right move is to go fix the artifact and move on. Same shape showed up with a sensor: we knew the calibration was good, so every weird reading got filed as "sensor's flaky," and eventually we had no idea whether the sensor was broken or the world was weird, and no way to find out, because the rule said there was nothing there to check.

  Is there a name for this? I know confirmation bias and motivated reasoning, but those are about wanting the answer to come out a certain way, and this isn't that -- the logic seems to check out on its own. I also don't just mean plain stubbornness, because you can be stubborn about something you don't actually know, and this only kicks in once you're sure. The bit that really gets me is that the same reasoning would have told me to ignore the very evidence that made me sure, if I'd happened to see it earlier.

  If there's an established name, tell me, and if there isn't, name it and tell me where the edges are -- when it's actually fine to write off a contrary reading as a broken instrument or a flaky test, and when it's this thing instead, and how it differs from confirmation bias and from just having a justified belief your not going to give up. A bare label won't help me, I want to know what exactly the move is and what it isn't.
reasoning: |-
  Okay, the user is describing a recurring problem at work where they dismiss anomalies because their system is "supposed" to work a certain way. They call it airtight reasoning, but it leads to ignoring real issues. They mentioned examples with a job runner and a sensor. 

  First, I need to understand the core issue. The user is stuck in a loop where evidence contradicting a "proven" system is automatically dismissed as an artifact. The logic seems sound: if the system is verified, any anomaly must be instrumentation error. But this prevents them from questioning the system itself. 

  They already know about confirmation bias and motivated reasoning but feel this is different because the reasoning seems logically valid, not emotionally driven. So it's not about wanting a certain outcome; it's about the structure of their justification. 

  The key is how they treat evidence. When the system is considered proven, contrary data is explained away instead of updating beliefs. That's similar to the Duhem-Quine thesis—a hypothesis can't be tested in isolation because it relies on background assumptions. Here, the background assumption (instrument reliability) is protected when anomalies occur. 

  Protective Belt from Lakatos fits well. Core theory (exactly-once processing) is protected by adjusting auxiliary hypotheses (ledger queries are buggy, sensors are flaky). This is rational up to a point, but becomes dogmatic when it prevents re-examining the core. 

  I should also consider belief perseverance, where people cling to beliefs despite contradictory evidence. And maybe epistemic closure, refusing to accept evidence that could challenge the core belief. 

  The user wants to know when it's valid to dismiss anomalies versus when it's this problematic pattern. Valid cases: clear signs of instrument failure, reproducible test errors. Problematic when it's the only response, preventing investigation into the core system. 

  They need practical signs: inability to falsify the core belief, dismissing without investigation, anomalies accumulating without updating the model. This differs from confirmation bias by being structural rather than motivational. 

  Naming it could be "protective dismissal" or "auxiliary hypothesis shielding." But Lakatos's "protective belt" is the established term. Emphasize that the reasoning isn't lazy; it's a sophisticated form of rationalization that becomes pathological.
answer: |-
  This pattern absolutely has established names and a rich philosophical/epistemological foundation. The core issue is **Protective Belt Rationalization** (from Imre Lakatos' "Scientific Research Programmes") coupled with aspects of the **Duhem-Quine Thesis**.

  Here's the breakdown:

  1.  **Core Belief / Hard Core (Lakatos):** Your well-justified, fundamental assumption ("Exactly-once processing is guaranteed," "Sensor calibration is perfect").
  2.  **Anomaly:** Contradictory evidence (duplicate charge, weird sensor reading).
  3.  **Protective Belt (Lakatos):** The network of auxiliary hypotheses and assumptions surrounding the core belief ("The ledger query must be buggy," "Someone must have replayed it manually," "The sensor is flaky," "The environment must be noisy").
  4.  **Protective Belt Rationalization:** The *move* you describe: Preserving the core belief by *automatically* attributing the anomaly to a failure or artifact *within the protective belt*, without seriously investigating the core itself. The logic *feels* airtight because it's structurally sound: "If Core is True AND Belt-Assumption-X is False, then Anomaly is explained away." You focus on finding the 'X'.

  **Why it feels different (and dangerous):**

  *   **Not (Primarily) Confirmation Bias:** Confirmation bias is seeking/prioritizing evidence that confirms your belief. Here, you *encounter* disconfirming evidence, but your framework dictates it *can't* disconfirm the core – it *must* be a belt issue. It's a specific *defensive maneuver* against disconfirmation.
  *   **Not Motivated Reasoning:** Your *initial* belief is well-justified (tests, traces). The motivation isn't necessarily emotional desire for the core to be true *initially*; it's the *structural imperative* of the belief system to protect itself once established.
  *   **Not Simple Stubbornness:** Stubbornness is refusal to change without justification. This *has* a seemingly strong justification: the prior evidence for the core is robust. The problem is the *automaticity* and *lack of curiosity* directed towards the core when anomalies arise.

  **The Duhem-Quine Angle:** This thesis states that you can never test a single hypothesis in isolation; you test a hypothesis *plus* all the background assumptions needed for the test (the protective belt). When the test fails (anomaly), logically, *any part* of the bundle (core or belt) could be wrong. Protective Belt Rationalization is the *systematic tendency* to blame the belt components first, shielding the core.

  **What Exactly the Move Is:**

  1.  **Encounter Anomaly:** Evidence contradicts the expected behavior of a well-verified system.
  2.  **Invoke Core Inviolability:** The core belief ("System Property X is guaranteed") is treated as axiomatic and beyond question for *this* anomaly.
  3.  **Redirect Blame:** Without investigating the core, attention is *immediately* focused *only* on the auxiliary systems (monitoring, logging, instrumentation, environment, human error).
  4.  **Explain Away:** An explanation is sought (and often found, even if incomplete) *within* the protective belt ("buggy query," "flaky sensor").
  5.  **Closure:** The anomaly is dismissed as an artifact, not a challenge to the core. Investigation stops at the belt.

  **What It Isn't (The Healthy Counterpart):**

  *   **Initial Hypothesis Prioritization:** When you have strong prior evidence for the core, it's *rational* to *suspect* the belt first. The difference is in the *rigor* and *openness*.
  *   **Instrumentation Error Diagnosis:** When there are *clear, independent signs* of belt failure (e.g., logs showing manual replay, sensor physically damaged, known query bug reproducing the double-count), blaming the belt is justified.
  *   **Occam's Razor:** Sometimes the belt explanation *is* genuinely simpler. The problem arises when it's *always* applied reflexively to protect the core.

  **When It's Protective Belt Rationalization vs. Valid Belt Blame:**

  | **Aspect** | **Protective Belt Rationalization** | **Valid Belt Blame** |
  |------------|-------------------------------------|----------------------|
  | **Investigation of Core** | Never considered or investigated | Considered but ruled out by evidence |
  | **Anomaly Handling** | Automatic dismissal | Evidence-driven inquiry |
  | **Prior Evidence** | Treated as absolute proof | Treated as strong but fallible |
  | **Frequency** | Pattern occurs repeatedly | Isolated incidents with clear causes |
  | **Resolution** | Temporary fixes without root cause analysis | Genuine problem identification and solution |
  | **Outcome** | Core vulnerability persists | System understanding improves |

  **The Edges & How to Navigate Them:**

  1.  **Prior Evidence Strength:** The stronger the *initial* evidence for the core, the more justified you are in *suspecting* the belt first. But "strong" never equals "infallible." Your sensor calibration was good *at time T* under *conditions C*; is that still true?
  2.  **Cost of Investigation:** Investigating the core might be expensive/difficult. But the cost of *not* investigating (undetected core failures, accumulating anomalies, loss of trust in instrumentation) is often higher long-term.
  3.  **Frequency & Pattern of Anomalies:** One weird sensor reading? *Probably* fluke/belt. A *pattern* of weird readings correlating with specific conditions? That demands core re-evaluation. Your duplicate charges – if truly isolated manual replays, fine. If they keep appearing *without* explanation? Core problem.
  4.  **Independent Belt Verification:** Can you *prove* the ledger query is buggy *independently* of this specific anomaly? Can you demonstrate sensor flakiness *without* assuming the core is true? If evidence for belt failure is weak or circular ("it must be the belt because the core is true"), it's rationalization.
  5.  **Falsifiability:** Can your core belief *ever* be falsified? If *every* possible anomaly has a pre-defined "belt failure" explanation, the core belief has become dogma, not science. **This is the critical red flag.** You need a conceivable scenario where you'd say, "Okay, *this* anomaly means our core property is broken."

  **Your Scary Realization is Key:** The reasoning *would* have dismissed the evidence that later convinced you. This highlights that **Protective Belt Rationalization makes the core belief unfalsifiable.** No evidence can ever challenge it because any challenge is defined away as an artifact. This turns a justified belief into an irrational dogma.

  **The Antidote:**

  *   **Explicitly Define Falsification Conditions:** What evidence *would* convince us the core is wrong? (e.g., "A duplicate charge where we can prove no manual replay occurred and the message ID is unique and processed within normal flow").
  *   **Investigate Anomalies Holistically:** Start with belt suspicions *but don't stop there*. Ask: "What would it take for this anomaly to mean the core is broken? How can we test that?" Actively look for evidence *against* the core.
  *   **Treat Prior Evidence as Fallible:** Remember the context of the original verification. Could it be incomplete? Are conditions the same?
  *   **Track Anomalies Systematically:** Patterns emerge only if you log and review anomalies *without* pre-judging them as belt issues.
  *   **Cultivate Epistemic Humility:** "We know this very well, but we could be wrong, or things could change."

  **In essence:** You've identified a sophisticated form of epistemic closure arising from justified belief structures. It's **Protective Belt Rationalization** enabled by the **Duhem-Quine underdetermination of theories**. The danger isn't the initial belief, but the structural inability to let evidence challenge it once the protective belt becomes too effective at deflection. Recognizing this move is the first step to preventing your systems (and your understanding) from becoming unfalsifiable fortresses.
