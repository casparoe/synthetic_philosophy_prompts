answer: |-
  This is a brilliantly observed pattern that goes to the heart of how policy language functions in contentious spaces like planning commissions. You've identified a crucial linguistic phenomenon that *isn't* quite the naturalistic fallacy or simply loaded language. Here's the carving:

  **The Concept: Thick Ethical Concepts (or Thick Normative Concepts)**

  1.  **The Name & Literature:** What you're describing aligns closely with what philosophers (especially Bernard Williams and others in meta-ethics) call **"Thick Ethical Concepts"** (sometimes "Thick Normative Concepts"). These are terms that **inseparably combine description and evaluation.**
      *   **Literature:** Bernard Williams' *Ethics and the Limits of Philosophy* is foundational. Others like Philippa Foot, John McDowell, Martha Nussbaum, and Hilary Putnam have explored them. In planning/policy theory, look into work on "discourse analysis," "framing," and "policy narratives," particularly by scholars like Deborah Stone (*Policy Paradox*), Frank Fischer (*Reframing Public Policy*), or John Forester (*Planning in the Face of Power*). They discuss how language like "blighted" or "underutilized" constructs reality and justifies action.

  2.  **What's Actually Happening (The Carving):**
      *   **Two-in-One:** Thick concepts like "blighted," "underutilized," "highest and best use," "neighborhood character," or "overdevelopment" **simultaneously describe a state of the world *and* prescribe a judgment about it.** "Blighted" isn't *just* boarded windows; it *means* boarded windows *in a way that is bad and demands action*. "Underutilized" isn't *just* low density; it *means* low density *in a way that is inefficient and wasteful*.
      *   **The Necessity of Ambiguity:** The ambiguity isn't accidental; it's **functional and necessary** for the argument. It allows:
          *   **Bridging the Is-Ought Gap:** It provides a seemingly seamless transition from observable facts ("boarded windows") to normative conclusions ("must be demolished/redeveloped") *without requiring explicit justification for the leap.* The justification is baked into the meaning of the word itself.
          *   **Rhetorical Power:** It gives the speaker plausible deniability. When pressed on facts, they appeal to the shared negative evaluation implied by the term. When pressed on values, they point to the observable characteristics that trigger the term's application.
          *   **Masking Value Conflicts:** It allows different stakeholders to project their *own* specific values onto the term while appearing to agree on the description. Neighbors might see "blight" as visual decay threatening safety, while developers see it as a lack of economic productivity – but both use the same word.
      *   **How it Differs:**
          *   **Naturalistic Fallacy:** This is the *invalid inference* of an "ought" *from* an "is" (e.g., "This land is vacant, therefore it *ought* to be developed"). Thick concepts **don't infer**; they **embed** the "ought" *within* the description. "Blighted" already contains the "ought" (this *shouldn't* be this way).
          *   **Loaded Language:** Loaded language (e.g., "death tax" vs. "estate tax") uses emotionally charged words to bias perception but *can* usually be restated neutrally ("tax on inherited wealth"). Thick concepts **cannot be cleanly separated** into a neutral descriptive component and a separate evaluative component without losing their essential meaning and function. What *is* "blight" without the negative judgment? It becomes just "buildings with boarded windows and tax arrears" – a description lacking the imperative for action.

  3.  **Legitimacy: When is it Honest Work vs. Begging the Question?**
      This is the critical question for your role. Legitimacy hinges on **transparency, shared understanding, and procedural fairness.** Here's how to assess it:

      *   **Honest Work (Potentially Legitimate) When:**
          *   **Shared Criteria Exist:** There is a formally adopted, specific, and objective definition within the code, ordinance, or comprehensive plan *that everyone acknowledges is the operational definition for decision-making*. (e.g., "Blighted" is defined by meeting 3 of 5 listed physical conditions + tax delinquency). The thick concept acts as shorthand for this defined bundle.
          *   **Value Consensus:** The thick concept reflects a genuine, broadly held community value that has been articulated and debated, even if imperfectly captured by the definition. (e.g., A community genuinely agrees that vacant, decaying buildings are harmful to collective well-being and economic health).
          *   **Focuses Debate:** It usefully points to a complex *type* of problem requiring policy intervention, forcing discussion about *which* specific instances truly meet the underlying criteria and *what* specific intervention is justified.
          *   **Used Consistently:** Applied using the same criteria regardless of who owns the property or what the proposed solution is.

      *   **Question-Begging (Illegitimate) When:**
          *   **Vagueness as a Weapon:** The term is used vaguely, allowing the speaker to apply it arbitrarily based on subjective dislike or hidden agendas ("I don't like that modernist building, it's blighting the character").
          *   **Lack of Transparency:** The underlying values driving the use of the term are obscured or deliberately not discussed. (e.g., Using "underutilized" solely to mean "not generating maximum profit for a developer," masking that other values like open space, affordability, or small business incubation might be equally valid "uses").
          *   **Definitional Drift:** The descriptive elements are stretched to fit the desired evaluative conclusion. (e.g., Calling a well-maintained but older building "blighted" purely because it's old or doesn't conform to a new aesthetic).
          *   **Circularity:** The justification for action *is* the label itself. ("It must be redeveloped because it's blighted." "Why is it blighted?" "Because it needs redevelopment.").
          *   **Masking Displacement:** Using "revitalization" or "highest and best use" to justify displacing existing residents/businesses without adequately addressing the harms caused.

      *   **Your Hunch is Correct:** The *same* thick concept ("blighted," "underutilized") can be used legitimately *or* illegitimately depending on **how it is applied in a specific context and whether the underlying criteria and values are transparent and fairly debated.**

  **Practical Implications for Your Role:**

  1.  **Demand Definition & Specificity:** When someone uses a thick concept ("blighted," "underutilized," "incompatible," "overdeveloped"), immediately ask: **"Can you please specify the observable characteristics or measurable criteria that lead you to apply that term to *this specific property*?"** Force the retreat from pure evaluation back to description.
  2.  **Unpack the Values:** Follow up with: **"And what specific harm or negative consequence do those characteristics cause that justifies intervention?"** Force the retreat from pure description back to evaluation. This exposes the underlying value claim.
  3.  **Refer to Codified Definitions:** Constantly ask: **"How does this property meet the specific criteria for [term] as defined in Section X of our Code/Ordinance/Plan?"** Hold everyone (staff, applicants, public) accountable to the formal definitions *if they exist*. If definitions are poor, advocate for clarifying them.
  4.  **Acknowledge the Thickness:** Explicitly state during hearings: **"Words like 'blighted' or 'underutilized' combine descriptions of what *is* with judgments about what *should be*. To make a fair decision, we need to separate these as best we can. What are the specific facts here? And what specific values or harms are we trying to address?"**
  5.  **Beware "Highest and Best Use":** Treat this consultant favorite with extreme skepticism. It's almost always a thick concept masking a specific, contestable economic theory (highest financial return). Always ask: **"Highest and best use *according to what criteria?*"** (Financial return? Community benefit? Environmental sustainability? Historic preservation?) **"Compared to *what alternative uses*?"**
  6.  **Focus on Impacts:** Shift the debate from the label to the concrete impacts. Instead of arguing if it's "overdeveloped," focus on: *Will it create traffic problems demonstrably exceeding capacity? Will it shadow neighboring properties excessively? Will it strain water/sewer? Does it provide needed housing/amenities?*

  **Conclusion:** You've pinpointed the operation of "thick ethical concepts" – linguistic tools essential for policy argument but inherently vulnerable to misuse. Their legitimacy depends entirely on the transparency of the criteria used to apply them and the openness with which the underlying values are discussed. By relentlessly demanding specificity, separating description from evaluation (as much as possible), and anchoring debate in codified standards and concrete impacts, you can help ensure these powerful words serve honest deliberation rather than obscure it or beg the question. Your role is to be the guardian of that clarity.
