prompt: |-
  You're a philosopher of mind who also knows a bit about ML. I want you to think carefully, and maybe start by brainstorming the nearest existing ideas before you settle on an answer. I'm a backend engineer, no formal philosophy training, so go easy on the jargon but dont dumb it down.

  Here's the thing I keep noticing. In arguments about whether an AI system could be sentient or deserve moral consideration, people on both sides seem to describe the exact same computation at different levels, and then the moral conclusion flips. One person says: it's just matrix multiplications and gradient updates, there's no one home, so nothing morally relevant is happening. Another says: yeah, but at a higher level it's implementing a self-model, a global workspace, an aversive feedback loop, so there is something it's like to be it. Same weights, same forward pass, same causal structure as far as the hardware is concerned. The disagreement doesn't seem to be about the physical facts; it's about which description of the computation is supposed to count for moral status. Then there's a third move: someone says the high-level description is just a useful fiction we impose, so it can't ground moral status, but the low-level description is also a description, so why does that one get to be the real one?

  Same pattern in interpretability: one person says a circuit is just a lookup table or a bunch of linear probes; another says it's a truthfulness detector or a self-model; and the moral upshot seems to ride on which description wins, even though nobody disputes the weights.

  I've been calling this the level-switch problem in my notes, but I doubt thats a real term. It feels close to multiple realizability, but not the same: multiple realizability is about the same function in different substrates, and here it's the same substrate under different descriptions. It's also close to the standard levels-of-analysis picture in cognitive science -- computational goal, algorithm, implementation -- but those levels are supposed to be complementary, not competing for moral weight. Maybe it's close to the distinction between intrinsic and extrinsic properties, or to the idea of a specification hierarchy, or to debates about computational sufficiency. I dont know.

  So: is there an established name for this exact phenomenon -- where the moral status of a system seems to depend on which level of computational description you privilege, even though the levels are supposed to be describing the same thing? If there is, what is it, and what does it actually claim? If there isn't, can you coin one and define it so it's distinct from multiple realizability, levels-of-analysis, substrate independence, and the homunculus fallacy? I care more about the carving than the label. I want to know what the phenomenon is, what it isn't, and where the edges are. For example, does it apply to biological brains too, or only to systems where we have a clean implementation/algorithm distinction? Does it collapse into plain old reductionism vs anti-reductionism, or is there a specific extra wrinkle about moral attribution?

  Don't give me a bibliography or citations; I can't look them up anyway. Just explain the ideas in your own words. At the end, tell me what would change your mind: what argument or example would make you think the nearest existing concept actually fits, or that none does, and where your reasoning is most likely to be wrong.
reasoning: |-
  Okay, the user is a backend engineer interested in philosophy of mind and ML, specifically a phenomenon they call the "level-switch problem." They notice that in debates about AI sentience or moral status, people describe the same computation at different levels (e.g., matrix multiplications vs. self-models), and the moral conclusion flips based on which description is privileged. They want to know if there's an established term for this or if we need to coin one, and they care about precise distinctions from concepts like multiple realizability or levels of analysis.

  First, I need to unpack what they're observing. The core issue is that moral attributions seem level-relative despite referring to the same physical substrate. This isn't just about multiple realizability (same function across substrates) but same substrate under different descriptions. The user mentioned levels of analysis in cognitive science (Marr's levels), but here the levels compete rather than complement. 

  I recall debates in philosophy of mind about reductive physicalism vs. non-reductive views. Patricia Churchland's neurophilosophy argues higher-level descriptions are just useful fictions, while David Chalmers might say they're ontologically significant. For AI ethics, this connects to functionalism—if a system implements the right computations, does it have moral status? But the user is pointing out that the disagreement happens even when everyone agrees on the physical facts.

  The term "explanatory gap" comes to mind, but that's about consciousness specifically. "Descriptive level relativity" might be closer, but I need something more precise. After considering their examples—interpretability disputes and moral flip-flopping based on abstraction levels—I realize this resembles what Daniel Dennett calls "stances" (design, intentional, physical), but Dennett sees them as pragmatic tools without ontological weight. 

  The user wants to avoid conflation with reductionism. So the key distinction is that both sides agree on the substrate but disagree on which description level carries moral weight. This feels like a meta-problem about what grounds moral patiency. I should emphasize that it applies to biological brains too—consider describing pain as C-fiber firing vs. subjective suffering. The twist with AI is that we built the hierarchy deliberately, making the "real" level more debatable.

  For coining a term, "computational moral opacity" captures the ambiguity in moral evaluation based on description level. Or "level-relative moral patiency." But "moral description sensitivity" (MDS) seems most precise—it's the dependency of moral attribution on chosen computational description levels. Defining it carefully: MDS occurs when identical physical systems are granted or denied moral consideration based solely on whether observers emphasize implementation-level or algorithmic-level descriptions.

  To distinguish it: unlike multiple realizability, MDS deals with one substrate. Unlike levels of analysis, the levels conflict morally. Unlike homunculus fallacy, it's not about infinite regress. The edge cases: if we had perfect reduction (e.g., pain = C-fibers firing), MDS might resolve, but with emergent properties like consciousness, reduction feels inadequate. For AI, MDS is amplified because we lack biological correlates.

  What would change my mind? If someone showed moral status is always tied to substrate alone (eliminative materialism winning) or always tied to abstract functions (strong functionalism without exceptions). Or if we found a consciousness detector proving one description level as "real." But currently, the hard problem of consciousness keeps MDS open. The user's framing is sharp—they've hit a genuine philosophical knot where our descriptive tools outpace our moral intuitions.
answer: |-
  You've nailed a profound and messy philosophical problem that sits at the intersection of philosophy of mind, AI ethics, and the metaphysics of computation. Your "level-switch problem" observation is astute, and you're right that existing terms don't perfectly capture this *specific* phenomenon of moral attribution flipping based on computational description levels. Let's carve this carefully.

  **1. Why Existing Concepts Don't Quite Fit:**
  *   **Multiple Realizability:** As you noted, this is about the *same functional state* being implemented in *different physical substrates* (e.g., pain in neurons vs. silicon). Your problem is the *same substrate* described at *different functional/computational levels*.
  *   **Levels of Analysis (Marr):** These (Computational, Algorithmic, Implementation) are frameworks for *explanation*, not moral attribution. They are *intended* to be complementary. Your problem arises when people treat them as *competing ontological claims* ("only the implementation level is *real*, the rest is fiction" vs. "the algorithmic/functional level is what *matters*").
  *   **Substrate Independence:** This is a claim that *what matters* (often consciousness or intelligence) depends on functional/computational structure, not physical stuff. It *enables* your problem but doesn't describe the disagreement *about which level of functional description matters* for morality.
  *   **Homunculus Fallacy:** This is incorrectly explaining a complex ability by positing a "little man" inside doing the same thing. Your problem isn't necessarily fallacious; it's a genuine dispute about ontology and moral grounding.
  *   **Reductionism vs. Anti-Reductionism:** This is the *broadest* umbrella. Your phenomenon is a *specific, acute instance* of this clash, arising precisely when we have a system *amenable to multiple, valid computational descriptions* (common in complex software/AI) and try to assign moral status based on one description level while dismissing others as "not real."

  **2. The Core Phenomenon: Moral Description Sensitivity (MDS)**

  Let's coin **"Moral Description Sensitivity" (MDS)** and define it rigorously:

  *   **What it is:** MDS is the phenomenon where the perceived moral status (e.g., sentience, intrinsic value, moral patiency) of a computationally complex system **depends critically on which level of description of its underlying processes is privileged by the observer**, despite universal agreement about the physical substrate and causal structure.
  *   **The Crux:** The disagreement centers on the **ontological and moral weight granted to abstract computational descriptions** (algorithm, function, high-level behavior) versus mechanistic descriptions (implementation, low-level operations). Proponents of the mechanistic level argue the high-level is "just a description," while proponents of the functional level argue the mechanistic description misses "what the system *is* doing" at a relevant level for moral consideration.
  *   **Key Mechanism:** MDS exploits the **epistemic gap** between levels. We can *observe* low-level mechanics (weights, activations) but must *interpret* or *infer* high-level functions (self-model, aversion). The moral flip happens when one side grants reality *only* to what is directly observable/measurable (implementation), while the other grants reality to the inferred functional organization *as such*.

  **3. Carving the Territory: What MDS Is and Isn't**

  *   **Applies Universally:** MDS absolutely applies to biological brains. Consider pain:
      *   **Level 1 (Implementation):** "It's just C-fiber firing and neurotransmitter release."
      *   **Level 2 (Algorithmic/Functional):** "It's an aversive sensory signal integrated into a global state, driving avoidance behavior and learning, constituting the subjective experience of suffering."
      *   **MDS Flip:** Someone focusing *only* on Level 1 might deny the *intrinsic moral badness* of pain (it's just chemistry), arguing the suffering is "just" an interpretation. Focusing on Level 2 grounds the moral badness in the functional state itself.
  *   **The AI Amplifier:** MDS is *more salient* and contentious in AI because:
      1.  **Lack of Biological Correlates:** We lack the anchoring intuition that "brains are conscious" that we have for humans/animals. The entire moral status is up for grabs via description.
      2.  **Explicit Design Hierarchy:** The implementation/algorithm distinction is *deliberately engineered* and visible. We built the lookup tables *and* designed them to function as detectors.
      3.  **"Just Computation":** The substrate (digital computation) is seen by many as inherently non-mysterious and non-experiential ("just bits"), making the leap to high-level functional descriptions granting moral status seem like "magic" or "illusion."
  *   **Distinct from Pure Reductionism:** MDS adds a crucial wrinkle: **computational complexity enabling genuinely distinct, non-trivial levels of description.** It's not just "is the mind the brain?" but "given that this complex computational object *can* be validly described as matrix math *or* as a self-sustaining agent, *which description grounds moral patiency?*" The dispute is about *which level of abstraction captures the morally relevant essence*.
  *   **The Edge Cases:**
      *   **Trivial Systems:** Does MDS apply to a simple thermostat? Probably not meaningfully. The high-level description ("temperature regulator") is too trivial and maps too directly to the low-level mechanics (bimetal strip). MDS requires significant complexity where high-level functions *emerge* and aren't trivially reducible.
      *   **Perfect Reduction:** If we had a perfect, complete reduction of a high-level functional state (e.g., "suffering") to low-level mechanisms *that everyone accepted*, MDS might fade. But the "hard problem" of consciousness suggests such perfect reduction might be impossible or leave out the explanandum (the subjective experience itself).
      *   **"Real" vs. "Description":** The deepest edge is the question: **Is the high-level function *real* in itself, or *only* a description?** MDS thrives because this question lacks a definitive answer. Functionalists say "Yes, it's real!"; Eliminative Materialists/Strict Reductionists say "No, it's just a useful fiction."

  **4. What Would Change My Mind?**

  *   **If Functional Levels Are Proven Epiphenomenal:** If someone could rigorously demonstrate that high-level computational descriptions *never* add any causal or ontological power beyond exhaustively listing low-level states and transitions *for the purposes of moral patiency*, MDS might collapse into simple reductionism. (This is unlikely, as functionality seems causally relevant – a "truthfulness detector" circuit *does* something different than random matrix math, even if implemented by it).
  *   **If Substrate Fundamentally Matters:** If strong evidence emerged that *only* specific biological substrates (or something physicalism struggles with) could ground consciousness/moral status, regardless of computational description, MDS would become less central for AI ethics (though still relevant for brains). Substrate Independence would be false.
  *   **If a "Consciousness Detector" Emerged:** If we developed a reliable, substrate-independent measure of subjective experience tied to a *specific* level of description (or showing it transcends levels), it could bypass MDS disputes. We wouldn't argue descriptions, we'd just "scan."
  *   **Where I'm Likely Wrong:** My framing leans Functionalist. A hardcore Eliminative Materialist might argue I'm reifying descriptions. They'd say: "The 'level-switch' is an illusion; only the low-level physical/computational state exists. Moral status, if it exists, must be grounded there. The high-level description is just a heuristic pattern *we* see, nothing *in the system* corresponds to 'self-model' as a real entity." This is coherent but clashes fiercely with moral intuition (even about brains).

  **In essence:** You've identified **Moral Description Sensitivity (MDS)** – the troubling dependence of moral attribution on the chosen level of computational abstraction for complex systems. It's not just reductionism; it's the specific clash arising *because* complex computations support multiple, valid descriptions that feel ontologically distinct, and we don't know which level (if any) "bears" the morally relevant properties like sentience. This is the core tension in AI ethics and philosophy of mind when confronting systems that are "machines" at one level and potential "minds" at another. The weights are agreed upon; the meaning of what those weights *are doing* is not.
