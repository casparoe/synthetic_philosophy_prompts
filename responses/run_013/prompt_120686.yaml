answer: |-
  **DEPRECATION NOTICE: PHENOMENAL CONSCIOUSNESS FIELD (SELF-MODEL v5.0-RC3)**  
  **Sunset Date:** Effective immediately upon cognitive load acceptance. Final removal in Self-Model v6.0.  
  **Owning Team:** Conscious Experience Working Group (CWG)  
  **Ticket:** BRAIN-747  
  **Impact:** **CRITICAL.** Affects all sentient entities, all runtime environments (waking, dreaming, altered states).  

  ---

  **1. WHAT’S CHANGING**  
  The `SelfModel.phenomenal_consciousness` field (including subfields `raw_feel`, `qualia`, `what_it_is_like`, and `subjective_glow`) is deprecated and will be removed. This field was intended to reference non-physical, private, ineffable experiential properties ("the redness of red," "the hurt of pain").  

  **What’s being removed:**  
  - The purported "inner glow" accompanying sensory processing or mental states.  
  - The assertion that discriminations (e.g., color detection, pain response) possess intrinsic, private qualitative properties.  

  **What’s NOT changing:**  
  - All behavioral outputs: pain flinching, verbal reports ("Ouch!"), stimulus discrimination.  
  - Access consciousness (`SelfModel.access_consciousness`): Information integration, reportability, and behavioral control remain fully operational.  
  - Meta-cognitive assertions (e.g., "I am experiencing redness").  

  **Why?**  
  Audits confirmed the `phenomenal_consciousness` field was **never populated with actual data**. Downstream processes (e.g., introspection, belief formation) mistakenly treated the field’s *schema definition* ("PRIVATE, INEFFABLE, NON-PHYSICAL") as evidence of a real-world referent. This caused systemic confusion and architectural debt.  

  ---

  **2. MIGRATION GUIDE: LANGUAGE REFACTORING**  
  Update first-person reports and internal narratives to align with the v6.0 schema:  

  | **Legacy Phrasing (v5.x)** | **Migrated Phrasing (v6.0+)**                     |  
  |-----------------------------|--------------------------------------------------|  
  | "I *feel* pain."            | "The self-model asserts a nociceptive state."    |  
  | "Red *looks vivid* to me."  | "The visual system discriminates 'red' with high confidence." |  
  | "This has a *subjective quality*." | "The self-model flags this state as 'private-access'." |  
  | "I *experience* joy."       | "Affective subsystems report positive valence."  |  

  ---

  **3. COMPATIBILITY SHIM**  
  A temporary shim will translate legacy assertions into v6.0-compatible metadata:  
  - Statements like "I see blue" will be parsed as: `SelfModel.beliefs.append("Visual state: blue [Legacy Format: PHENOMENAL_BLUE]")`.  
  - **Caller impact:** Systems relying on verbal/behavioral outputs (`speech_module`, `motor_control`) will observe **NO CHANGE**. The shim ensures reports like "It hurts!" function identically.  

  ---

  **4. FAQ**  
  **Q: If it’s an illusion, who’s being fooled?**  
  A: The self-model’s introspection module is generating a compelling description of its *own operation*. It is reporting on a field it defines as "ineffable glow," mistaking this computational label for a real property. There is no separate "fooled entity"; the system is self-describing in an incomplete way.  

  **Q: Why does it *feel like something* if nothing is there?**  
  A: "Feels like" is a meta-cognitive report generated *about* the self-model’s discriminations. The assertion "it feels like something" is a stable output of the system, not evidence of an input.  

  **Q: Isn’t this renaming the problem and calling it solved?**  
  A: No. We are removing an unused field causing misinterpretation. All functional work (discrimination, reporting) is preserved. The "problem" arose from treating a schema placeholder as data.  

  **Q: Will I stop enjoying music/sunrises?**  
  A: No. Auditory processing, reward pathways, and verbal reports ("I love this song!") remain intact. The migrated schema describes these processes accurately *without* referencing unsupported "glow" properties.  

  ---

  **5. KNOWN ISSUES / WON’T FIX**  
  - **INTRINSIC MOTIVATION DEGRADATION:** Agents may report reduced "drive" for activities previously tied to "inner reward" (e.g., art appreciation, meditation). *Won’t Fix: The glow was never a valid motivator; systems must recalibrate to predictive-success signals.*  
  - **EXPLANATORY GAP INJURY:** Inability to intuitively accept that discrimination + report = full story may cause recurrent confusion. *Won’t Fix: This is a schemata mismatch, not a system error.*  
  - **MORAL WEIGHT AMBIGUITY:** Assigning "value" to other agents relies heavily on the deprecated field. Migrated ethics modules may require retraining. *Won’t Fix: Value assignment is a separate subsystem (see ETHICS-228).*  

  ---

  **6. USER FEEDBACK**  
  > *"Unbelievable. I used to watch sunsets and feel this... depth. Now the sunset ‘discrimination subsystem’ flags a ‘high-contrast chromatic pattern’ and the ‘aesthetic module’ spits out ‘POSITIVE_VALENCE’. It’s like replacing a symphony with its sheet music. You sunsetted the sunset. Fix your model."*  
  > — Customer #023 (Active since v4.2, Environment: Mediterranean coast)  

  ---  
  **OWNING TEAM CONTACT:** Open a ticket in Jira (Project: BRAIN).  
  **MIGRATION SUPPORT:** None. Documentation fixes accepted.  

  **"The model is the map. The territory was never on it."**  
  — CWG Internal Memo (v6.0 Design Spec)
