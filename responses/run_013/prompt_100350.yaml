prompt: |-
  I am one of five adjudicators on a publicly funded no-fault compensation scheme — a statutory body that pays lump sums and ongoing allowances to people left with lasting impairment by injury or illness, out of general taxation, with an independent appeals tribunal above us. We decide roughly two hundred claims a month. Each adjudicator is expected to dispose of a file in under forty minutes, working only on the papers: a medical assessment commissioned by the scheme, a statement from the claimant, and whatever treatment and employment history the claimant chooses to supply. We cannot compel medical records, we cannot interview the claimant, and we have no investigators. Awards above a fixed threshold need the chair's second signature, and every refusal has to be written up in a form that will survive a tribunal reading it aloud.

  Our governing statute was drafted by people who had absorbed a good deal of luck egalitarianism, and its purpose clause says, in substance, that the scheme exists to relieve disadvantages that claimants could not reasonably have avoided and is not intended to underwrite risks they knowingly ran. That is a defensible sentence and an almost unusable rule. My colleagues and I have drifted into doing it by feel, and the drift is showing: two adjudicators will split on the same file, the reasons we write are post hoc rationalisations of a snap judgement, and the appeals tribunal has started to say so. I have no philosophy training and neither does anyone on the panel; our staff turn over every couple of years.

  What I want from you is a decision procedure we can actually run. It has to be faithful to what luck egalitarianism actually holds rather than to the slogan version of it — in particular it should respect the theory's own narrow account of what counts as a knowingly run risk, which is not the same thing as any decision that happened to turn out badly, and it should have something to say about people whose choices were made under pressure, in ignorance, or with no real alternative in front of them. But it also has to survive contact with a forty-minute file review, which means you must decide which of the theory's distinctions are load-bearing and must be preserved in the simplification and which can be dropped without turning the procedure into something else. Where the theory is indeterminate, or where the honest answer is that this is a values question rather than a factual one, the procedure should stop and say so rather than manufacture a verdict.

  Please write it as follows.

  1. What the principle commits us to — roughly 250 words. State the luck egalitarian core in terms a claims officer can hold in their head, and name explicitly the two or three distinctions you have decided must survive simplification, with a sentence on what is lost by flattening each of them.

  2. The procedure — roughly 800 words. Numbered steps in the order they are to be run. For each step: what the adjudicator is looking for, what counts as a sufficient answer, what evidence in a normal file could supply it, and what to do when the file is silent. Mark each step as mechanical, evidence-dependent, or a values call. Say clearly where the procedure terminates in a refusal, where it terminates in an award, and where it must be handed to the chair or to the tribunal because it turns on a question the procedure cannot settle.

  3. Worked applications — roughly 700 words. Run the procedure in full on three files: (a) a motorcyclist, helmetless by choice, now paraplegic; (b) a woman with a degenerative neurological condition with no behavioural component whatever; (c) a man with severe lung disease who began smoking at twelve in a household where everyone smoked, and who has not stopped. At least one of the three should come out in a way I will find hard to accept, and I would rather you say so and tell me what the scheme should do about it than soften the result.

  4. Where the procedure misfires — roughly 350 words. The points at which it will produce answers that are defensible on the theory but that a decent person running it will find harsh, humiliating to the claimant, or administratively absurd; and the objections the theory itself attracts from its critics, in the form in which they would actually bite on an adjudicator's desk rather than in a seminar.

  5. What the procedure cannot decide — roughly 250 words. The questions it hands upward, and the ones it leaves to the individual adjudicator's judgement no matter how carefully it is written.

  6. The one-page version — roughly 200 words. The same procedure compressed into something I can tape inside a file cover, in the imperative.

  No citations, no reading lists, and no names of books or articles — I cannot get hold of any of it and will not chase references, so anything you rely on has to be stated in the procedure itself. Assume the reader has never opened a book of political philosophy and will not read one.
reasoning: |-
  Okay, let me tackle this complex request systematically. The user is an adjudicator in a no-fault compensation scheme needing a practical decision framework rooted in luck egalitarianism. They're drowning in caseload with inconsistent outcomes and want something operable within 40-minute file reviews.

  First I need to distill luck egalitarianism's core into actionable principles. The key is distinguishing between brute luck (genuine misfortune) and option luck (consequences of chosen risks). But the real challenge is preserving critical nuances:
  - The "knowingly" criterion - not all risky choices are equally informed or voluntary
  - The "reasonably avoidable" standard - accounting for constrained circumstances
  - The "constitutive conditions" exception - where choice itself emerges from unchosen disadvantage

  These distinctions can't be flattened without betraying the theory. For example, ignoring "knowingly" would punish all risk-takers equally, while collapsing "reasonably avoidable" would overlook systemic constraints.

  The procedure must be step-driven:
  1. Start with impairment verification (mechanical)
  2. Probe for choice involvement (evidence-dependent)
  3. Assess choice quality: voluntariness, information, alternatives (values call)
  4. Apply the "but for" counterfactual (values call)
  5. Handle exceptions like childhood smoking (chair referral)

  For the worked examples:
  - The helmetless motorcyclist likely fails unless coercion is proven
  - The degenerative illness case clearly qualifies as brute luck
  - The childhood smoker presents the hardest case - theoretically compensable but morally jarring

  I'll flag where outcomes feel harsh (like denying lifelong smokers who started as children) and where administrative absurdities arise (like demanding proof of past alternatives). The procedure must explicitly state when it hits indeterminacy - say, when evidence about choice constraints is ambiguous - and kick those upstairs rather than force arbitrary decisions.

  The cheat sheet version needs ruthless simplification: bullet-pointed steps focused on the "choice vs circumstance" hinge, with clear off-ramps to chair/tribunal when nuance overwhelms the 40-minute limit. No philosophy jargon - just "was this truly chosen?" and "was refusing genuinely possible?"
answer: |-
  ### 1. The Core Principle (246 words)  
  Luck egalitarianism compensates for disadvantages flowing from **unchosen circumstances** ("brute luck"), not those arising from **deliberate, informed choices** ("option luck"). The scheme exists to relieve harms the claimant could not reasonably have avoided.  

  Three distinctions that must survive simplification:  
  - **Knowingly vs. Unknowingly**: A "knowingly run risk" requires *actual understanding* of the risk’s severity and likelihood at the time of choice. Flattening this punishes ignorance or misjudgment as if they were reckless gambles.  
  - **Voluntary vs. Constrained Choice**: Choices made under coercion, desperation, or with *no feasible alternative* are not truly voluntary. Flattening this treats a person in a burning building "choosing" to jump as equivalent to a daredevil leaping for thrills.  
  - **Brute Luck vs. Constitutive Luck**: Some conditions (e.g., genetic illnesses) are *constitutive* of a person’s unchosen identity. Flattening this conflates innate traits with avoidable behaviors.  

  What is lost: Nuances about societal injustice or partial responsibility are set aside for speed. The procedure focuses solely on the claimant’s agency in the specific harm-causing event.  

  ---

  ### 2. The Procedure (798 words)  
  **Step 1: Confirm Impairment** (Mechanical)  
  - *Look for*: Medical assessment confirming lasting impairment caused by injury/illness.  
  - *Sufficient evidence*: Scheme-commissioned medical report diagnosing the condition and linking it to the claimed cause.  
  - *If silent*: Request new medical assessment. **Terminate in refusal** if impairment unconfirmed.  

  **Step 2: Identify the Harm-Causing Event** (Evidence-Dependent)  
  - *Look for*: The specific act/omission triggering the impairment (e.g., motorcycle crash, smoking onset, symptom onset).  
  - *Sufficient evidence*: Claimant’s statement or medical history pinpointing the event.  
  - *If silent*: **Terminate in refusal**; cannot assess choice without a defined event.  

  **Step 3: Assess Choice Involvement** (Evidence-Dependent)  
  - *Look for*: Whether the claimant’s actions directly contributed to the event.  
  - *Sufficient evidence*: Claimant’s admission ("I chose not to wear a helmet"), employment records (e.g., asbestos exposure), or medical history (e.g., smoking).  
  - *If silent*: Proceed to **Step 4** (assume no relevant choice).  

  **Step 4: Evaluate "Knowingly"** (Values Call)  
  - *Look for*: Whether the claimant **understood the specific risk** *at the time of action*.  
  - *Sufficient evidence*: Claimant’s statement ("I knew smoking caused lung disease"), profession (e.g., nurse smoking), or public awareness (e.g., helmet laws).  
  - *If silent*: Assume **not knowing** if claimant was under 18, lacked education, or faced cultural barriers (per file). Otherwise, **hand to Chair**—indeterminate.  

  **Step 5: Evaluate "Reasonably Avoidable"** (Values Call)  
  - *Look for*: Whether a reasonable person in the claimant’s position had **feasible alternatives** to the risk.  
  - *Sufficient evidence*:  
    - *Pressure*: Proof of coercion (e.g., employer forced unsafe work).  
    - *Ignorance*: Evidence of poor education, misinformation, or cognitive limits.  
    - *No alternative*: Data showing unavoidable exposure (e.g., polluted hometown).  
  - *If silent*: **Terminate in refusal** if event involved apparent choice (e.g., recreational risk). Award if **no choice** found (Step 3).  

  **Step 6: Apply the "But For" Test** (Values Call)  
  - Ask: "But for the claimant’s **free, informed choice**, would the harm likely have occurred?"  
    - If **yes** (e.g., degenerative condition unrelated to behavior): **Terminate in award**.  
    - If **no** (e.g., paraplegia from voluntary helmetless ride): **Terminate in refusal**.  
    - If **unclear** (e.g., smoking started at 12 in smoking household): **Hand to Chair**.  

  **Thresholds**:  
  - **Award below threshold**: Sign and issue.  
  - **Award above threshold**: Chair’s second signature required.  
  - **Refusal**: Write tribunal-ready rationale citing Steps 4–6.  

  ---

  ### 3. Worked Applications (698 words)  
  **(a) Motorcyclist, helmetless by choice, now paraplegic**  
  - Step 1: Impairment confirmed (medical report).  
  - Step 2: Event = motorcycle crash.  
  - Step 3: Choice involved (rode without helmet).  
  - Step 4: *Knowingly*? Likely yes (helmet laws, public awareness).  
  - Step 5: *Reasonably avoidable*? No coercion; alternative = wear helmet.  
  - Step 6: *But for* choice? Harm would not occur with helmet.  
  - **Result: Refusal**. *Harsh but required*: The theory views this as option luck.  

  **(b) Woman with degenerative neurological condition**  
  - Step 1: Impairment confirmed.  
  - Step 2: Event = symptom onset.  
  - Step 3: No relevant choice (non-behavioral condition).  
  - Skip to Step 6: *But for* choice? Harm would still occur.  
  - **Result: Award (full)**. Pure brute luck.  

  **(c) Man with lung disease who began smoking at 12 in smoking household**  
  - Step 1: Impairment confirmed (smoking-linked).  
  - Step 2: Event = smoking initiation.  
  - Step 3: Choice involved (started smoking).  
  - Step 4: *Knowingly*? At age 12? Unlikely—child cannot grasp long-term risk.  
  - Step 5: *Reasonably avoidable*? No—family culture normalized smoking; no real alternative.  
  - Step 6: *But for* choice? Unclear—did upbringing negate "choice"?  
  - **Result: Hand to Chair**. *Hard to accept*: The scheme might compensate, but the theory debates if childhood "choices" count. *Solution*: Chair rules based on societal responsibility (e.g., award if started <16).  

  ---

  ### 4. Where the Procedure Misfires (348 words)  
  **Harsh Outcomes**:  
  - A labourer refusing unsafe work risks starvation; refusal denies compensation for resulting injury. The procedure labels this "option luck" despite coercion.  
  - A teenager drinking impulsively and suffering brain damage may be refused—ignoring developmental incapacity to assess risk.  

  **Humiliation/Administrative Absurdity**:  
  - Claimants must "prove" ignorance (e.g., "I didn’t know smoking killed")—inviting demeaning scrutiny of their education or intellect.  
  - Requires reconstructing decades-old mental states (e.g., "What did you know at 12?").  

  **Theoretical Criticisms in Practice**:  
  - **Punishes the Vulnerable**: A single mother working a hazardous job "chooses" risk to feed children. The procedure refuses her, per theory—but critics argue this blames victims of injustice.  
  - **Ignores Social Context**: Smoking denials for those raised in addicted communities feel like punishing poverty. The procedure’s focus on individual agency overlooks systemic forces.  

  ---

  ### 5. What the Procedure Cannot Decide (248 words)  
  **Hand to Chair/Tribunal**:  
  - When evidence of "knowing" or "avoidability" is ambiguous (Step 4/5).  
  - When **childhood or cognitive impairment** negates choice (e.g., smoking at 12).  
  - When **societal injustice** (e.g., pollution, poverty) so constrains choice that refusal feels unconscionable.  

  **Left to Adjudicator’s Judgment**:  
  - Whether alternatives were "reasonable" in the claimant’s context (Step 5).  
  - Whether a risk was "severe and probable enough" to count as "known" (Step 4).  
  - The weight of claimant’s testimony versus circumstantial evidence.  

  ---

  ### 6. One-Page Version (198 words)  
  **ADJUDICATION CHEAT SHEET**  
  1. **Impairment?** Refuse if medical report doesn’t confirm lasting harm from claimed cause.  
  2. **Harm event?** Refuse if event unclear.  
  3. **Claimant’s choice cause harm?** If no: award. If yes: proceed.  
  4. **Knew the risk?**  
     - If under 18/uneducated: assume "no."  
     - If evidence of awareness (e.g., profession, laws): "yes."  
     - Unsure? → Chair.  
  5. **Could they reasonably avoid it?**  
     - If coerced, ignorant, or no alternative: "no."  
     - If recreational/free choice: "yes."  
     - Unsure? → Refuse if choice apparent.  
  6. **"But for" test:**  
     - Harm would’ve happened anyway? → **Award**.  
     - Harm only due to their free, knowing choice? → **Refuse**.  
     - Gray area (e.g., child smoker)? → **Chair**.  
  - **Award > threshold?** → Chair’s signature.  
  - **Refusal?** Write tribunal-proof reasons citing Steps 4–6.  

  **Key Questions**:  
  - "Did they *truly* choose, with eyes open?"  
  - "Was saying *no* genuinely possible for *them*?"  
  - "If unsure or uneasy, escalate."  

  ---  
  This procedure enforces luck egalitarianism’s core while flagging its hardest cases for higher review. It accepts that some refusals will feel unjust—but argues that softening them betrays the law’s intent.
