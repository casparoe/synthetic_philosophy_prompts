prompt: |-
  I am trying to reconstruct, for a seminar handout, the argument usually called the Frege–Geach objection to expressivism, and my reconstruction appears to prove considerably more than the objection is supposed to prove. Set-up, so that nothing depends on your recalling a particular text: expressivism is the thesis that a moral sentence such as "Lying is wrong" does not state a fact but expresses a non-cognitive state — disapproval, a plan, a norm — and that this expressive role, rather than a truth condition, is what the sentence means. The objection notes that the very same sentence occurs both asserted and unasserted, and that validity appears to require that the occurrence carry the same content in both places. My reconstruction runs as follows.

  (1) The meaning of a sentence is what it contributes to the larger sentences in which it occurs, and it contributes the same thing in every occurrence.
  (2) What a sentence contributes is the state of mind it expresses.
  (3) Asserted on its own, "Lying is wrong" expresses disapproval of lying.
  (4) Occurring unasserted in the antecedent of a conditional, "Lying is wrong" expresses no such disapproval; the speaker commits herself to nothing about lying.
  (5) By (2), (3) and (4), "Lying is wrong" contributes different things in the two occurrences.
  (6) An inference by modus ponens is valid only if the antecedent of the conditional and the corresponding premise have the same content.
  (7) Hence the inference "If lying is wrong, then getting your brother to lie is wrong; lying is wrong; therefore getting your brother to lie is wrong" is invalid, and an expressivist can make it valid only by giving up (2).
  (8) But (2) and (4) are perfectly general: the antecedent of any conditional is unasserted, so the same reasoning shows that no conditional's antecedent contributes the same content as any asserted premise.
  (9) So no instance of modus ponens is valid.
  (10) Modus ponens is valid.
  (11) Therefore (2) is false: a sentence's meaning is not the state of mind it expresses, and expressivism is refuted.

  I want to keep (10) and (1), and I am prepared to lose (2) if I must; what I want to know is what else goes with it. Where would you break the chain, and what does breaking it there cost? If the reconstruction is sound and expressivism really is refuted, say so, and describe the nearest position that survives. If it is not sound, I want the precise defect — not the name of a familiar strategy, but the premise or inference that strategy requires me to give up, and what giving it up costs elsewhere in the theory of meaning.

  Format: exactly five numbered items, each one or two sentences, with no introduction and no conclusion. The first should say where you break the chain; the second why that link looked compelling; the third what exactly the defect is, if there is one; the fourth and fifth each price one of the two most defensible repairs, saying in each case what the position that needs the repair can no longer claim.
reasoning: |-
  Hmm, the user is reconstructing the Frege-Geach objection to expressivism for a seminar handout and is concerned that their version proves too much—specifically, that it invalidates all modus ponens inferences. They've laid out a numbered argument from (1) to (11) that ends with expressivism being refuted. Their core dilemma is where to break this chain of reasoning while minimizing theoretical costs, and they want a structured response. 

  The user clearly understands the technical stakes: they're not just asking for textbook answers but for precise philosophical triage. Their anxiety about "proving too much" suggests they've spotted a tension in standard formulations—maybe between compositionality and non-cognitivism. They're also signaling commitment to preserving modus ponens (10) and compositionality (1), which are non-negotiable in most semantic frameworks. 

  Key pressure points in their reconstruction:  
  - Premise (2) directly ties meaning to expressed mental states, which is expressivism's hallmark.  
  - Premise (4) observes that unasserted contexts don't activate the same psychological attitude.  
  - The leap to (8) generalizes this, threatening all conditionals.  

  I need to identify the weakest link. Premise (2) seems vulnerable—it assumes mental states are the compositional glue, but expressivists like Blackburn or Gibbard have developed "quasi-realist" workarounds where sentences project attitudes systematically. Rejecting (2) doesn't kill expressivism; it forces a shift to a more nuanced semantics (e.g., "norm-expressivism").  

  But the user also hints at alternatives: maybe challenge (4) by saying unasserted antecedents still *simulate* disapproval? That's harder to defend—conditionals clearly don't commit speakers to their antecedents. Or attack (1)? That'd be nuclear, sacrificing compositionality.  

  Costs of rejecting (2): Expressivists must explain meaning without reducing it to occurrent psychology, perhaps via commitment structures or inferential roles. They lose the simple "disapproval = meaning" equation but gain compatibility with logic.  

  Costs of revising (4): If they insist unasserted contexts express attenuated attitudes (e.g., "entertaining" disapproval), they must explain why this doesn't trivialize expression. Risk: collapsing into cognitivism.  

  Ultimately, premise (2) is the linchpin. The objection works only if we accept its narrow psychologism. Modern expressivists reject that, so the "refutation" fails. The nearest surviving position is quasi-realism, which mimics realist logic while grounding it in projected attitudes.
answer: |-
  1. Break the chain at (2): Reject that a sentence's meaning is *only* the occurrent state of mind it directly expresses when asserted.  
  2. (2) looked compelling because expressivism initially defines meaning via expressed attitude in simple assertions.  
  3. The defect is equating compositional semantic content (what is contributed to complex sentences) with the occurrent psychological state expressed in isolation; unasserted occurrences demonstrate that the content is invariant while the *act* of expression differs.  
  4. Price of repair (rejecting 2): Expressivism can no longer claim that meaning *reduces to* the non-cognitive attitude expressed in assertion; it must posit a stable, compositional content (e.g., a "plan" or "norm-acceptance" type) that persists in embedded contexts.  
  5. Price of alternative repair (revising 4): If one insists unasserted antecedents *do* express a diluted attitude (e.g., hypothetical disapproval), the position can no longer claim that moral utterances function like simple ejaculations (e.g., "Boo!") and must explain why this attitude doesn’t entail commitment.
