prompt: |-
  I moderate a large online discussion group about politics — a few thousand members, three volunteer moderators — and the most common complaint we receive is that someone is arguing in bad faith. I have no training in philosophy or psychology; everything I know about this I have worked out from years of watching these fights, and I am tired of inventing a standard from scratch each time one breaks out. I would like you to write a decision procedure that my moderators and I can actually run when such a complaint arrives.

  Here is what I have concluded so far, and where I get stuck. The people we most want to remove often sound entirely sincere, while some of the smoothest talkers are plainly performing, so sincerity cannot be the test. We cannot see anyone's motives — only what they do when they are handed evidence and objections — yet if I judge only by behavior I fear I am simply labeling as bad faith anyone who will not agree with me. Some members who say outrageous things turn out to be repeating what an entirely different community told them was true; they are not lying so much as sealed inside a different picture of the world, and I cannot decide whether that should count as bad faith or as something else. A member recently asked me how to tell a belief that is merely well defended from one that has been arranged so that nothing could ever count against it, and I had no answer. And when I run the test honestly it seems to indict a great deal of what my own side does, which makes me wonder whether the procedure should be symmetrical or whether that is naive.

  Please give me the procedure as a sequence of questions to ask in order, with what counts as a sufficient answer to each, where the procedure stops and returns a no, and where it hands the decision back to a person because the question is one of values rather than evidence. Distinguish a single bad-faith move from a person who is habitually in bad faith, and say which of the two the procedure is entitled to judge. Mark the steps that are judgment calls dressed up as procedure. Assume a moderator has ten minutes and no expertise, and that I have the final say. Then run it on three complaints: a member who demands sources, dismisses every one offered, and insists he is only being rigorous; a member who posts relentlessly one-sided material but appears to be genuinely trying and whom people mainly find tiresome; and a member who made one inflammatory claim, apologized, and whom the group now wants gone. Include at least one case where the procedure gives an answer I will not like. Finally, tell me what the procedure cannot do.
reasoning: |-
  Okay, the user moderates a large political discussion group and is overwhelmed by bad faith accusations. They need a practical decision procedure that volunteer moderators can apply quickly. Let me unpack their core struggles: 

  First, they've correctly identified key philosophical dilemmas - sincerity vs behavior, epistemology vs bias, systemic misinformation vs intentional deception. Their observation that "sincerely held outrageous beliefs" create ambiguity is particularly astute. The procedural challenge is real: they need something operable in <10 minutes by non-experts.

  Hmm... their pain points cluster in three areas:
  1) Distinguishing cognitive bias from malice (the "sealed worldview" problem)
  2) Identifying unfalsifiable belief systems without becoming ideological enforcers
  3) Handling the asymmetry dilemma (own-side bias)

  The examples they provided are classic:
  - The "rigorous" requester (JAQing off)
  - The tiresome partisan (earnest but biased)
  - The repentant offender (apology rejection)

  For the procedure, I should design it like a flowchart with choke points. Key principles:
  - Must fail-safe toward leniency (false positives worse than false negatives)
  - Separate isolated incidents from patterns
  - Distinguish content judgment (allowed) from behavioral judgment (actionable)
  - Build in off-ramps where human discretion is unavoidable

  The "values vs evidence" distinction is crucial - moderators shouldn't arbitrate truth claims. Focus on observable behaviors: pattern avoidance, response to contrary evidence, engagement consistency. 

  Biggest risk is procedural capture - turning the test into a ideology litmus. Must include:
  - Asymmetry check ("would this flag my own side?")
  - Burden shifting (complainant must show evidence)
  - Distinction between bad argument vs bad faith argumentation

  For the test cases:
  The source-demanding member clearly fails multiple criteria (pattern of dismissal, no affirmative case). The tiresome partisan passes behavioral checks (engages, adjusts) despite being biased. The inflammatory claimant case will frustrate users - procedure clears them but group wants expulsion, highlighting the procedure's limits regarding community standards vs individual acts.

  Final note: Emphasize this can't replace community norms development. The procedure is a shield against bad moderation, not a sword against bad opinions.
answer: |-
  Below is a **Bad Faith Argumentation Decision Procedure** designed for speed, clarity, and fairness. It focuses on *observable patterns of behavior* (not motives or beliefs) and distinguishes between **isolated bad-faith tactics** (warn/educate) and **habitual bad-faith engagement** (remove/suspend). It takes 5-10 minutes per complaint using only the accused member's *recent public comments* (no private data).

  ---

  ### **Decision Procedure: Is Member X Habitually Arguing in Bad Faith?**  
  *(Run steps in order; stop if any step returns "NO")*

  1. **Pattern Threshold Check**  
     *"Are there ≥3 recent incidents (same thread or different threads) where X exhibited the complained-of behavior?"*  
     - **YES** → Proceed to Step 2.  
     - **NO** → Stop. **Not habitual.** Flag single incident for education/warning.  
     *// Filters one-off cases; requires evidence of repetition.*

  2. **Engagement Sincerity Test**  
     *"When presented with direct counter-evidence or clear questions about their position, does X consistently:*  
     *(a) Ignore/deflect, OR*  
     *(b) Shift goalposts/redefine terms, OR*  
     *(c) Dismiss sources *without providing specific, verifiable reasons*?"*  
     - **YES to any** → Proceed to Step 3.  
     - **NO** → Stop. **Not bad faith.** (May be biased/rigid, but engages).  
     *// JUDGMENT CALL: Requires moderator assessment of specific interactions. "Specific reasons" = e.g., "This study's methodology fails to account for X" not "LOL fake news".*

  3. **Asymmetry Check**  
     *"Does X apply their own standards of evidence/rationality equally to:*  
     *(a) Their own claims vs. opponents' claims, AND*  
     *(b) Allies vs. opponents in their ideological group?"*  
     - **NO** → Proceed to Step 4.  
     - **YES** → Stop. **Not bad faith.** (May be sincerely dogmatic).  
     *// JUDGMENT CALL: Crucial for fairness. Example: Demands peer-reviewed sources for others' claims but shares memes for own.*

  4. **Falsifiability Test**  
     *"Has X ever conceded error or updated their position *on this topic* when presented with evidence? OR, is their position structured so that *all* counter-evidence is dismissed as biased/fake/irrelevant?"*  
     - **Never concedes; all evidence dismissed** → Proceed to Step 5.  
     - **Has conceded/updated** → Stop. **Not bad faith.**  
     *// Tests epistemic rigidity. "Structured dismissal" = e.g., "All left-wing media lies," "Any data against my view is CIA propaganda".*

  5. **Burden-Shifting Check**  
     *"Does X avoid making affirmative claims while demanding others disprove vague assertions? (e.g., 'Prove that elections aren't rigged!')"*  
     - **YES** → **Habitual bad faith confirmed.** → Recommend suspension/removal.  
     - **NO** → **Inconclusive.** Escalate to lead moderator for final review.  
     *// Final filter for JAQing off ("Just Asking Questions").*

  ---

  ### **What This Procedure CANNOT Do**
  - Determine objective truth or moderate content (only behavior).  
  - "Rehabilitate" members sealed in misinformation bubbles.  
  - Resolve ideological disputes disguised as bad-faith complaints.  
  - Replace community norms (e.g., "no inflammatory claims" may be a separate rule).  

  ---

  ### **Test Cases Run Through Procedure**

  #### **Case 1: The "Rigorous" Source Demander**  
  *Complaint: Demands sources, dismisses all, claims rigor.*  
  - **Step 1:** 5+ incidents → **YES**  
  - **Step 2:** Dismisses sources without specific reasons (e.g., "MSM propaganda") → **YES**  
  - **Step 3:** Holds opponents to peer-review standard; accepts memes from allies → **NO** (fails asymmetry)  
  - **Step 4:** Never concedes; all counter-evidence "corrupt" → **YES**  
  - **Step 5:** "Prove the election wasn’t stolen!" → **YES**  
  **VERDICT: Habitual bad faith.** Remove.  
  *// You won't like this if they're on "your side," but asymmetry confirms abuse.*

  #### **Case 2: The "Tiresome" One-Sided Poster**  
  *Complaint: Posts biased content but seems genuine.*  
  - **Step 1:** 10+ one-sided posts → **YES**  
  - **Step 2:** When challenged, engages with arguments (poorly) and occasionally adjusts tone → **NO**  
  **VERDICT: Stop at Step 2. Not bad faith.** Educate on balance; warn if excessive.  
  *// Sincere but biased ≠ bad faith. Community may mute if tedious.*

  #### **Case 3: The "Repentant" Inflammatory Claim-Maker**  
  *Complaint: Made one racist claim, apologized, group wants removal.*  
  - **Step 1:** One incident → **NO**  
  **VERDICT: Not habitual.** Apply separate rule for inflammatory content (e.g., temp ban).  
  *// Procedure doesn't judge single acts. Group anger ≠ bad-faith pattern.*

  ---

  ### **Key Principles Embedded**
  - **Symmetry is mandatory:** Bad faith is defined by *asymmetric behavior*, not ideology.  
  - **Habitual > isolated:** Protects against "gotcha" moderation.  
  - **Values off-ramps:** Steps 2/3/4 require judgment but anchor it in observable conduct.  
  - **Your final say:** Escalate edge cases; override if community safety trumps procedure.  

  This won’t end disputes, but it forces scrutiny of *behavioral patterns* over perceived insincerity. Pair it with clear rules about toxicity (e.g., "no personal attacks") to cover what bad-faith analysis cannot.
