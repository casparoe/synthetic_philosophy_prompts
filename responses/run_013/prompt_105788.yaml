answer: |-
  Your hypothesis is perceptive but ultimately incorrect—this **is a substantive disagreement about the nature of moral reasons**, not merely a verbal dispute or a clash over what justification requires. Here's my diagnosis, why your test case deepens the conflict, and what progress would look like.

  ### The Core Disagreement
  - **Deontologists (Agent-Relativists)** argue that morality is fundamentally about *what I may/must do as an agent*. The constraint "don't kill one to save five" stems from the intrinsic wrongness of *my committing murder*—a wrong that isn't negated by good consequences. My duty isn't to optimize states of affairs; it's to avoid violating certain norms *through my actions*.  
  - **Consequentialist Objectors** demand an *agent-neutral justification*: "Why should anyone accept this constraint?" If the answer appeals to outcomes (e.g., "society collapses if we permit murder"), they argue you've conceded consequentialism. If it doesn't appeal to outcomes, they see the constraint as arbitrary ("Why is killing worse than letting die?").  

  The sides aren't talking past each other—**they disagree about the *source* of moral reasons**:  
  - Deontologists see agency as *constitutive* of morality (reasons arise from my role as an actor).  
  - Consequentialists see outcomes as the *foundation* (reasons must trace to states of affairs).  

  ### Your Test Case: Inaction vs. Action
  - **Scenario**: You can prevent 5 deaths by *switching off a safety mechanism* you oversee. Doing nothing allows the deaths.  
  - **Deontologist Prediction**: **Crucial difference**. Inaction (allowing death) isn't *murder*. If your duty is only "don't kill," you may permissibly refrain from switching off the mechanism. Constraints bind your *actions*, not omissions (unless you have a specific positive duty, like a lifeguard).  
  - **Consequentialist Prediction**: **No difference**. 5 deaths vs. 1 death is what matters. If inaction causes more net harm, it's equally wrong. Your "role" is irrelevant; morality is about minimizing bad outcomes.  

  **Result**: The sides *do* diverge here. This **refutes the verbal-dispute hypothesis** and exposes the substantive rift. Deontologists carve reality at the joint of *agency* ("what I do"); consequentialists at the joint of *outcomes* ("what happens").

  ### Why Your Hypothesis is Close But Wrong
  You're right that the debate involves **competing conceptions of justification**, but this isn't *merely* semantic. It's about whether morality is:  
  1. **Practical** (guiding individual choices: "What should *I* do?" → deontology), or  
  2. **Evaluative** (assessing states of affairs: "What world is best?" → consequentialism).  

  The deontologist's "external justification" *is* internal to their framework: "Because murder violates the dignity inherent in rational agency." But this relies on a **non-consequentialist value** (dignity/agency), which consequentialists reject as unsupported without outcome-based reasoning.  

  ### What Counts as Progress
  This debate is entrenched but not hopeless. Progress would require:  
  1. **A decisive test case** where the theories yield *opposing verdicts* and one verdict seems clearly more intuitively plausible. Your inaction case is a start, but deontologists can tweak their constraints (e.g., "duties to rescue" complicate omissions). Better cases involve **forced choices with identical outcomes but different agential involvement** (e.g., *pushing* someone off a bridge to stop a trolley vs. *diverting* the trolley).  
  2. **Metaethical clarification**: Arguing whether "moral reasons" must be *reducible* to outcomes. If deontologists can ground constraints in non-outcome-based values (e.g., Kant's "rational nature as an end-in-itself"), they gain ground.  
  3. **Explaining intuitive asymmetries**: Why do we feel worse about *shooting one to save five* than about *failing to donate life-saving money to save five*? Consequentialists struggle here; deontologists have a ready answer (action vs. omission).  

  ### Verdict
  **Substantive disagreement about the ontology of moral reasons.** The objector demands justification in terms of *good-making features of the world*; the deontologist offers justification in terms of *obligation-making features of actions*. Neither side can "lose" without abandoning their core premises. Yet progress is possible by pressuring weak points:  
  - Consequentialists must explain why *agency* feels morally pivotal (e.g., why we distinguish doing vs. allowing).  
  - Deontologists must explain *why* some actions are intrinsically wrong without smuggling in outcomes.  

  **If nothing else moves the needle**: This stalemate may reveal that ethics rests on **unprovable first principles**. Choosing between deontology and consequentialism then becomes a question of which foundation better coheres with our deepest moral intuitions—like preferring a universe where we don't trade lives, even when logic says we should.
