answer: |-
  Here is the dissection you requested—the rhyme broken into distinct theses, ordered by substance, with their plausibility, refutability, and implications for the head teacher’s dismissal. Following that, the mother’s target and dialogue.

  ---

  ### The Rhyme Dissected: Six Theses  
  **Ordered from weakest to strongest claim**  

  1. **Vacuous Literalism (Causation of Physical Harm)**  
     - *Thesis*: "Words cannot cause physical injury like sticks/stones."  
     - *Plausibility*: True but trivial. No one disputes words lack kinetic force.  
     - *Refuted by*: Reality—words *can* provoke physical violence (e.g., inciting a punch). But irrelevant here.  
     - *Licenses dismissal?* No. The head teacher invokes it for emotional harm, making this a red herring.  

  2. **Ontological Separation (Speech ≠ Action)**  
     - *Thesis*: "Words are not deeds; they exist in a realm of 'mere' symbols, not material consequences."  
     - *Plausibility*: Legally and philosophically contested (e.g., threats, contracts, vows *are* acts).  
     - *Refuted by*: Performative utterances ("You're fired") or slurs that enact social death.  
     - *Licenses dismissal?* **Yes.** Treats the locker graffiti as "just words," erasing its function as an act of public shaming.  

  3. **Voluntarism of Uptake**  
     - *Thesis*: "Harm from words requires the victim’s consent; you choose to be wounded."  
     - *Plausibility*: Seductive but false. Neurological/psychological studies show slurs trigger involuntary stress responses.  
     - *Refuted by*: Trauma (PTSD from bullying), or systemic harm (e.g., racist slurs reinforcing hierarchy).  
     - *Licenses dismissal?* **Yes.** Makes the girl responsible for "allowing" harm, absolving the boy/school.  

  4. **Pragmatic Coping Advice**  
     - *Thesis*: "This is not a truth-claim but a strategy: *You should* treat words as powerless to build resilience."  
     - *Plausibility*: Defensible as self-defense psychology (e.g., cognitive behavioral therapy).  
     - *Refuted by*: Cannot be falsified—it’s advice, not fact. But it ignores institutional duty to prevent harm.  
     - *Licenses dismissal?* **Partially.** The head teacher shifts focus to the girl’s coping, not the perpetrator’s accountability.  

  5. **Harm Comparativism**  
     - *Thesis*: "Verbal harm is *less real* or *less severe* than physical harm."  
     - *Plausibility*: Subjective. A broken bone heals; a lifetime of degradation may not.  
     - *Refuted by*: Suicide rates among bullied youth; chronic anxiety from verbal abuse.  
     - *Licenses dismissal?* **Yes.** Minimizes the incident as "not that bad," closing the case.  

  6. **Moral Exculpation**  
     - *Thesis*: "The *only* moral agent in the harm-chain is the victim. If they feel hurt, it’s their failure."  
     - *Plausibility*: Ethically bankrupt. Denies intent/action of the perpetrator.  
     - *Refuted by*: Any theory of responsibility (e.g., you can’t blame someone for flinching at a slap).  
     - *Licenses dismissal?* **Fully.** The head teacher implies the matter ends with the girl’s emotional management.  

  ---

  ### What the Head Teacher is Likely Reaching For  
  In an assembly, he’s invoking **#4 (Coping Advice)** or **#6 (Exculpation)**—the versions that sound noble ("Be resilient!") while quietly enabling **#2 (Speech ≠ Action)** and **#3 (Voluntarism)**. His subtext: *This is now the victim’s burden to resolve*.  

  ---

  ### The Mother’s Target: The Strongest Reading  
  She must strike at **#2 (Ontological Separation)**—the claim that words are not deeds. This is the root of his dismissal and the only thesis that *must* be false for her counter to land. Why?  
  - If words *constitute* harm (like ranking, licensing others, or enacting identity-erasure), then the head teacher cannot treat this as "closed." Silence becomes complicity.  
  - **Refutation**: Slurs work by *doing*, not just describing:  
    - **Ranking**: Assigning inferiority.  
    - **Licensing**: Signaling open season on the victim.  
    - **Constituting**: Making the insult "true" in the social sphere (e.g., "outsider" becomes her new identity).  

  ---

  ### The Mother’s Reply  
  Two lines of dialogue targeting **the deed-like nature of words** without lecturing:  

  > **Mother**: "Sticks and stones break bones, Mr. Davies. But words—words *build* things. Like walls between children. Or permission slips for cruelty. You told my daughter to ignore what was written. But that writing? It wasn’t just *said*. It was *done*."  

  > *Or, sharper*:  
  > **Mother**: "You say words can’t hurt her? Then why’d that boy use them like a hammer?"  

  ---  

  ### Why This Works in Scene  
  - **Character-consistent**: A river-town mother uses concrete metaphors (building, hammers).  
  - **Hits the thesis**: "It was *done*" refutes ontological separation. "Permission slips" names licensing.  
  - **Forces the head teacher**: Now he must engage the *act* of the slur, not just the girl’s reaction.  

  Write the mother leaning into the **materiality** of the harm—the marker’s ink, the locker’s metal, the school’s silence. Her anger isn’t about philosophy; it’s about what was *constructed* in that hallway.
