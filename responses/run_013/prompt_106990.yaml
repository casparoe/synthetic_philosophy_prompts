prompt: |-
  I'm a third-year philosophy student, and I'm currently taking a seminar on consequentialism and its critics. There's a pattern that keeps surfacing in our readings and discussions that I can't find a clean name for, and I'd like help carving it up rather than just labeling it.

  The pattern is this. Take a harm so small that a single instance would be beneath notice — a momentary itch, a barely perceptible flicker of annoyance, a fraction of a second of mild boredom. Now suppose it is inflicted on an enormous number of people at once, or on one person across an enormous stretch of time. Two intuitions collide. If you simply add the small harms together, the total grows vast, and it seems hard to call a vast total trivial. Yet it also seems absurd to say that any number of such trivialities could outweigh one person enduring something genuinely terrible for an extended period; the sense that no quantity of pinpricks can match a single atrocity is very strong.

  What interests me is not only the collision but the fact that people resist the aggregative conclusion in several distinct ways, and I want to know whether each has a name. Some insist that small harms are not the sort of thing that can be summed across persons at all, because persons are separate and their experiences do not form one pool. Some hold that harms below a certain threshold have zero weight, so any number of them still sums to zero. Some treat the aggregative pull as a cognitive illusion, a failure of imagination once numbers get large. And some deny that the two cases lie on a common scale, so the comparison is meaningless.

  There is a second version that puzzles me even more. Instead of each of many people suffering a small harm, each of many people faces a tiny probability of a serious harm — a risk so small that no individual's expected loss is noticeable, yet spread over a huge population the expected number of victims is large. Here the tiny quantities are probabilities rather than experiences, and I can't tell whether the same resistance, or a different one, is in play.

  Is there an established name for this configuration — the clash between many tiny harms and one great harm — and for the distinct strategies of resisting it? I suspect it sits near things I've heard named (the repugnant conclusion, the separateness of persons, thresholds and lexical priority), but I don't think any of those is quite it, and I'd like to know precisely how what I'm describing differs from each and which fits best. If nothing established fits, I'd rather have a careful definition plus boundary cases than a bare label: what makes a harm tiny for this purpose, whether the parallel puzzle arises for tiny benefits, whether the number of people must merely be large or actually infinite, and whether the probabilistic version is the same phenomenon or a cousin.
reasoning: |-
  Okay, this is a really sharp question from a philosophy student digging into consequentialism. They've identified a fascinating tension between aggregating tiny harms and prioritizing severe suffering, and they're asking for conceptual clarity rather than just labels. Let me unpack what they need.

  First, the core dilemma: how can a mountain of microscopic harms (like momentary itches) feel simultaneously enormous when summed yet trivial compared to one person's prolonged agony? The student notices four distinct resistance strategies: (1) separateness of persons blocking aggregation, (2) threshold deontology where small harms have zero moral weight, (3) cognitive limitations in grasping large numbers, and (4) incommensurability between harm types. 

  Hmm, they're right that existing terms like "repugnant conclusion" or "lexical priority" don't quite fit. The repugnant conclusion is about population ethics, while this is about harm aggregation within a fixed population. Lexical priority is too absolute - here the resistance is more nuanced. 

  The probabilistic twist is particularly interesting. When many face minuscule risks of severe harm, is the resistance the same? I suspect not - here the objection might center on ex ante fairness or the non-identity problem, since no actual victim exists initially. 

  For boundaries: "tiny" likely means subjectively imperceptible or normatively negligible. Benefits probably mirror this (e.g., micro-pleasures vs. intense joy). The infinity question is tricky - finite large numbers already trigger the intuition, though infinity might intensify it. 

  I should map the four resistance strategies to established positions:
  - Strategy 1 is pure Rawls/Nozick separateness of persons
  - Strategy 2 echoes threshold deontology à la Scheffler
  - Strategy 3 leans psychological (Slovic's "psychic numbing")
  - Strategy 4 resonates with incommensurability theorists like Raz

  The probabilistic version needs separate treatment. Expected utility theory would sum the risks, but common morality balks - perhaps due to agent-relative obligations (each person's risk is tiny to others) or distinction between statistical and identified lives. 

  ...this deserves careful structuring. Start with the core phenomenon, dissect resistance strategies, then handle the probabilistic case as a sibling problem with different objections. Need to flag where boundaries blur - e.g., threshold views could collapse into incommensurability. Should also note that consequentialists have rebuttals (e.g., Parfit's "mere addition paradox" shows aggregation isn't always repugnant).
answer: |-
  Your inquiry cuts to the heart of aggregation problems in ethics and decision theory. The phenomenon you describe—**the tension between aggregating minuscule harms and prioritizing intense suffering**—lacks a single universally accepted name, but its components are well-studied. Below, I dissect the conceptual landscape, naming strategies and clarifying boundaries.

  ---

  ### **Core Phenomenon: The Aggregation Dilemma**
  This is sometimes called **"The Problem of Small Harms"** or **"The Aggregation Threshold Paradox."** Key features:
  1. **Intuition Collision**: 
     - *Aggregative Intuition*: Summing vast tiny harms yields non-trivial disvalue.
     - *Anti-Aggregative Intuition*: No quantity of trivial harms outweighs intense suffering (e.g., "pinpricks vs. torture").
  2. **Scope**: Applies to both:
     - *Spatial Aggregation*: Many people each suffering a tiny harm.
     - *Temporal Aggregation*: One person suffering a tiny harm repeated over vast time.

  ---

  ### **Four Strategies of Resistance (with Names & Key Advocates)**

  | **Resistance Strategy**              | **Core Argument**                                                                 | **Theoretical Label**                          | **Key Thinkers**                     |
  |--------------------------------------|-----------------------------------------------------------------------------------|-----------------------------------------------|--------------------------------------|
  | **1. Non-Aggregability Across Persons** | Moral value resides in individuals; harms cannot be "pooled."                     | **Separateness of Persons (SoP)**             | Rawls, Nozick                        |
  | **2. Threshold Deontology**          | Harms below a minimal significance threshold have *zero moral weight*.            | **Deontic Thresholds** / **Lexical Priority** | Scheffler, Temkin                    |
  | **3. Epistemic Skepticism**          | Aggregation fails due to cognitive limits in grasping large numbers.              | **Cognitive Failure Thesis**                  | Greene, Slovic (psychometric risk)   |
  | **4. Incommensurability**            | Tiny harms and grave harms belong to distinct moral categories; no common scale.  | **Value Incommensurability**                  | Raz, Chang                          |

  ---

  ### **Clarifying Boundaries & Adjacent Concepts**
  - **Vs. Repugnant Conclusion (RC)**: 
    - RC (Parfit) addresses *population ethics*: A large population with barely worthwhile lives is "better" than a small happy one. 
    - *Your focus* is on *harm aggregation within a fixed population*, not adding new lives. RC aggregates *benefits*; your case aggregates *harms*.
    
  - **Vs. Lexical Priority**: 
    - Often invoked in threshold strategies, but lexical priority strictly *ranks* values (e.g., rights over utility). Your cases involve *scalar* comparisons where thresholds may be fuzzy.

  - **When is a Harm "Tiny"?** 
    - Subjectively: Below perceptual/emotional thresholds (e.g., unnoticed discomfort). 
    - Normatively: Harms deemed irrelevant in isolation (e.g., a 0.001-second delay). 
    - Boundary Case: Harms that *compound* (e.g., chronic micro-stressors causing breakdown) exit "tiny" territory.

  ---

  ### **The Probabilistic Version: Tiny Risks vs. Certain Harm**
  - **Same Phenomenon, Distinct Mechanism**: 
    - Here, tiny *probabilities* of severe harm (e.g., 1/10,000,000 risk of death) are distributed. Expected utility sums them, but intuitions resist equating this to a *certain* severe harm for one person.
    
  - **Resistance Strategies Shift**:
    - **SoP Strengthened**: Risks are attached to individuals; no "shared" risk pool (Taurek's "numbers skepticism").
    - **Thresholds Apply to Probability**: Risks below a "de minimis" level (e.g., 1/1,000,000) are ignored.
    - **Epistemic Challenges**: Grasping low-probability catastrophes is cognitively hard (Sunstein on risk perception).
    - **Incommensurability**: *Risk* vs. *certain harm* may occupy different moral categories.

  - **Why It Feels Different**: 
    - Involves *counterfactual* harm (no actual victim exists initially). 
    - Focuses on *ex ante* fairness (equal risk distribution) vs. *ex post* outcomes.

  ---

  ### **Key Questions Resolved**
  1. **Do tiny *benefits* create the same puzzle?**  
     Yes—e.g., "Does taxing millions for trivial gains justify denying one person lifesaving healthcare?" Anti-aggregative intuitions often *weaken* for benefits vs. harms (asymmetry noted by Kamm).
     
  2. **Must numbers be infinite?**  
     No—the dilemma arises with finite but large numbers (e.g., 1 million people). Infinity intensifies it (e.g., "Bernoulli's St. Petersburg Paradox" for benefits).
     
  3. **Is the probabilistic version the same?**  
     A close cousin: both involve summing negligible quantities (harms or probabilities) to non-negligible totals. Resistance often overlaps but emphasizes distinct facets (e.g., non-identity in risk cases).

  ---

  ### **Synthesis: A Proposed Framework**
  Label the core **"The Aggregation Dilemma"** and specify subtypes:  
  - **Spatial/Temporal Harm Aggregation**  
  - **Probabilistic Harm Aggregation**  

  **Why no unified term?** The resistance strategies reflect foundational divides in ethics (consequentialism vs. deontology, welfarism vs. person-affecting views). Naming the *strategies*—not the dilemma—offers sharper tools for analysis.  

  **Test Case**: Would diverting funds from a cancer ward to prevent *trillions* of dust-speck irritations be justified? Consequentialists say yes; threshold deontologists/SoP advocates say no. The stalemate reveals irreconcilable moral axioms.

  This framework should help you map readings and identify which "resistor" each author embodies. For further exploration, see:  
  - Parfit (1984) on aggregation,  
  - Frick (2021) on *clumping* vs. *scattering* harms,  
  - Hanser (2009) on thresholds.
