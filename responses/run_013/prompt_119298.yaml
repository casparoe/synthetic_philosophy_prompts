prompt: |-
  I am writing a novel whose climactic scene turns on a rescue: a woman on a flooded causeway can either pull one stranger out of the water or, by spending the same minutes and the same strength, reach a van going under with five people inside it. I am not asking you for a verdict yet. Before I trust any verdict, I want the specification a theory of this choice would have to satisfy — because I have read enough moral philosophy to notice that the familiar camps each buy their answer by refusing to look at part of the case (one says that every person's claim is equal and that the numbers are therefore morally inert; the other says that five deaths are simply worse than one), and I want the whole bill laid out before I put an argument in a character's mouth. Adequate, for my purposes, means good enough that a woman with a minute to decide could act on it and defend the act afterwards.

  So give me the desiderata — not a survey of positions, a specification. For each requirement, name the case or consideration that motivates it.

  Cases it must get right, at minimum: the plain one against five; the nested case in which option A saves one person and option B saves that same person plus two others, so that nobody is left worse off under B; a case in which the options overlap without either containing the other (one pair against a different pair sharing a single member), so that no one's fate is settled by a larger set simply containing her; a case in which both options save the same number of people but the stakes differ (one will certainly die without rescue, five will lose limbs); a case in which the five can be reached only by a plan that succeeds with a probability, so that expected lives saved can be equal while the certain outcomes are not; a case in which the candidates can speak to one another and propose a lottery among themselves; and a case in which the rescuer's own survival is one of the things at stake.

  Distinctions it must not collapse: between the number of claimants and the magnitude of each claim; between a consideration that breaks a tie and one that decides the case; between a claim being weaker and its being outweighed; between what is true of each of the five and what is true of the five together; between the agent's obligation and the claimants' own agreement; and between the ex ante prospect and the ex post outcome.

  Constraints it must respect: no trading of one life against a large number of small goods; no verdict that turns on facts the rescuer cannot know; and an answer even when no coin, no time, and no consultation are available, since that is the condition of my scene.

  Then tell me which requirement is doing the most work in excluding the two camps I named, and whether any pair of them is jointly unsatisfiable — the pair I suspect is the demand that each person's claim count equally and the demand that the agent save the greater number. If they cannot both hold, say which I should surrender and what the scene loses by it. One line each on how the two camps fare against your list is enough; I will do the arguing in the book.
reasoning: |-
  Hmm, the user is writing a novel with a climactic rescue scene where a character faces a moral dilemma: save one stranger or save five others with the same effort. They don't want a verdict yet—they want a specification of what a moral theory must satisfy to handle this scenario convincingly. They're clearly well-versed in moral philosophy and have identified flaws in existing approaches like utilitarianism and deontology.

  The user has outlined several cases the theory must handle: the basic 1 vs 5 dilemma; nested cases where saving more doesn't harm anyone; overlapping groups without containment; cases with same numbers but different stakes; probabilistic outcomes; cases with communication/lotteries; and cases where the rescuer's own life is at risk. There are distinctions the theory must preserve (like number vs magnitude of claims) and constraints it must follow (no trading lives for small goods, no reliance on unknowable facts).

  I need to provide desiderata for such a theory. For each requirement, I should name the motivating case. The user suspects that the "equal claims" principle might conflict with "save the greater number" - if they're incompatible, I should suggest which to sacrifice and what would be lost. I'll also briefly note how standard camps handle these requirements.

  The core tension seems to be between individual inviolability and aggregate outcomes. The user wants a framework that doesn't dodge parts of the problem. Their scene has urgency (no time for coin flips), uncertainty, and high stakes. The theory must be action-guiding and defensible post-hoc by the character.

  For the desiderata, I'll structure them with clear labels, the motivating case, and what it requires. I'll cover all their specified cases and distinctions. Then I'll address the potential conflict between Requirement 1 (Equal Claimant Standing) and Requirement 7 (Scalar Outcome Sensitivity), explaining why tension exists and suggesting that surrendering Requirement 1 loses the "moral residue" of individual claims. Finally, I'll give one-line assessments of deontology and utilitarianism against these requirements.

  The solution must feel humanly plausible - something a person could articulate under pressure. The character needs to make a choice she can live with, not just a theoretically pure one. That's crucial for the novel's emotional impact.
answer: |-
  Here is a specification of desiderata for a moral theory capable of guiding your character's choice and defense, grounded in the cases and distinctions you've outlined:

  ### Core Desiderata (Requirements & Motivating Cases)

  1.  **Equal Claimant Standing (Motivating Case: Any rescue scenario)**: Every individual in peril has a fundamental, non-instrumental moral claim on the rescuer's aid, simply by virtue of being in comparable peril. This claim is not diminished by others' presence. *Motivator:* Rejects the view that numbers are *entirely* inert; establishes a baseline obligation to each person.
  2.  **Scalar Outcome Sensitivity (Motivating Case: The plain one vs. five)**: The theory must recognize that saving more lives (or preventing greater harm) is morally preferable to saving fewer (or preventing lesser harm), *ceteris paribus*. *Motivator:* Captures the intuitive wrongness of letting five die to save one when nothing else distinguishes the cases.
  3.  **Non-Subordination Principle (Motivating Case: Nested rescue - A saves 1, B saves 1+2)**: Choosing an option that leaves some claimants worse off than they would have been under an alternative feasible option requires justification beyond simply maximizing the good. Saving more cannot inherently *justify* harming someone who could have been saved alone. *Motivator:* Ensures individuals aren't mere means; prevents justifying harm to one for the greater good *when harm is avoidable*.
  4.  **Aggregate Claim Independence (Motivating Case: Overlapping pairs - Pair AB vs. Pair BC)**: The moral weight of saving a group cannot be reduced *only* to the sum of individual claims if the act of grouping alters the claim's basis. The "five" as a unit cannot have a claim *beyond* the claims of the five individuals. *Motivator:* Prevents conjuring a "super-claim" for the larger group distinct from its members.
  5.  **Magnitude/Stakes Sensitivity (Motivating Case: Same number, different stakes - 1 death vs. 5 limb losses)**: The theory must weigh not just the *number* of claimants, but the *severity* of the harm each faces if unaided. Preventing death outweighs preventing lesser harms. *Motivator:* Recognizes that claims differ based on the gravity of the threatened harm.
  6.  **Probabilistic Reasoning (Motivating Case: Probabilistic rescue of the five)**: The theory must incorporate reasonable expectations under uncertainty. Saving a life with certainty can outweigh a *merely probable* saving of more lives, depending on the probabilities involved. Expected value matters, but certainty has moral weight. *Motivator:* Addresses real-world uncertainty; prevents reckless gambling with lives based on low probabilities.
  7.  **Procedural Fairness & Agreement (Motivating Case: Candidates propose a lottery)**: When claimants can communicate and agree on a fair procedure (like a lottery) for distributing aid, this agreement holds significant moral weight for the rescuer, potentially overriding a simple numbers calculation. *Motivator:* Respects the autonomy and potential agreements *among the claimants themselves*.
  8.  **Agent-Neutral Imperative (Motivating Case: Rescuer's survival at stake)**: The rescuer's own life and interests are legitimate factors in the decision, but they do not automatically trump all other claims. The weight given to self-preservation must be justified within the theory's framework, not taken as an absolute veto. *Motivator:* Acknowledges the agent's situatedness and legitimate self-interest without collapsing into egoism.
  9.  **Action-Guidance Under Scarcity (Motivating Case: Default scene condition - no coin, no time, no consultation)**: The theory must yield a definitive, prescriptive verdict for the rescuer *even when* ideal conditions for deliberation, randomization, or consultation are absent. *Motivator:* Reflects the urgency and constraints of the actual scenario.
  10. **Epistemic Constraint (Motivating Case: Any, but implicit in urgency)**: The verdict must be based only on information reasonably accessible to the rescuer in the moment. *Motivator:* Ensures the theory is practically applicable, not reliant on omniscience.
  11. **Incommensurability Barrier (Motivating Case: Implicit rejection of trading lives for small goods)**: The theory must prohibit trading a life (or a significant risk of death) for any aggregation of non-lethal goods (e.g., money, minor injuries, property). *Motivator:* Maintains the special moral status of life and severe bodily integrity.

  ### Key Distinctions Preserved (How they Manifest)

  *   **Number vs. Magnitude of Claim:** (Desiderata 2 & 5) Saving five lives > saving one life (Number). Preventing one death > preventing five limb losses (Magnitude).
  *   **Tie-Breaker vs. Decider:** (Desiderata 3 & 6) Numbers/outcome sensitivity *decides* the plain 1 vs. 5 case. It might *break a tie* if magnitude/stakes were otherwise equal (e.g., two people facing identical death vs. two others facing identical death).
  *   **Weaker Claim vs. Outweighed Claim:** (Desiderata 5) The claim of someone facing limb loss is *weaker* than someone facing death. A claim facing death might be *outweighed* by multiple equally strong claims (1 vs. 5 death).
  *   **Each of Five vs. Five Together:** (Desiderata 1 & 4) The obligation arises from the claim of *each individual* in the van (1), not from a "group right" of "the five" (4).
  *   **Agent's Obligation vs. Claimants' Agreement:** (Desiderata 1 & 7) The rescuer has an obligation *to each claimant* (1). The claimants' agreement (7) modifies how that obligation is *fulfilled* or *distributed* among them, it doesn't erase the initial obligation to aid.
  *   **Ex Ante Prospect vs. Ex Post Outcome:** (Desiderata 6) The decision must be based on the *ex ante* reasonable expectations (probability of success), not judged solely by the *ex post* outcome (whether the gamble paid off).

  ### The Critical Tension & Exclusion

  *   **The Conflict:** You rightly suspect tension between **Requirement 1 (Equal Claimant Standing)** and **Requirement 2 (Scalar Outcome Sensitivity)**. Requirement 1 insists each person's claim stands alone and inviolable. Requirement 2 insists that the *set* of claims matters, implying one claim can be overridden by the aggregate force of others. This is the core clash between agent-relative deontological constraints and agent-neutral consequentialism.
  *   **Joint Unsatisfiability:** These requirements are **jointly unsatisfiable** in their strongest forms within the scenario. Prioritizing the one (Equal Standing) strictly implies numbers are inert unless ties exist. Prioritizing the five (Outcome Sensitivity) strictly implies the claim of the one can be overridden by the aggregate claims of the five.
  *   **What to Surrender:** You should **surrender the absolute, non-overridable interpretation of Requirement 1 (Equal Claimant Standing)**. Insisting that the single stranger's claim *absolutely forbids* acting to save the five, despite the overwhelming difference in stakes, renders the scene morally implausible for most readers and makes Requirement 2 meaningless.
  *   **What is Lost:** Surrendering the absolute interpretation loses the sense of **moral residue or "dirty hands"**. Even if saving the five is the right choice, the theory cannot treat the single stranger's claim as *morally inert* or *non-existent*; it was overridden, not erased. The rescuer might still feel the weight of failing *that specific person*, even while defending the choice. The loss is the clean, absolute innocence of the agent who saved the five.

  ### How Camps Fare (One Line)

  *   **Deontology (Strong Equal Standing):** Fails Requirement 2 (Scalar Outcome Sensitivity) and Requirement 9 (Action-Guidance Under Scarcity) in the plain 1 vs. 5 case, often resorting to questionable tie-breakers or absolutism.
  *   **Utilitarianism (Strong Outcome Sensitivity):** Fails Requirement 3 (Non-Subordination) in nested cases, Requirement 4 (Aggregate Independence) by potentially creating group claims, and struggles with Requirement 8 (Agent-Neutral Imperative) regarding self-interest, often neglecting the moral residue captured by Requirement 1.

  This specification provides the framework. The character's argument will need to navigate the tension between individual standing and aggregate outcome, likely justifying overriding the one *because* of the overwhelming aggregate claim of the five *while acknowledging* the persisting moral force of the single claim that couldn't be met. The defense rests on the *reasonableness* of prioritizing the larger number facing comparable grave harm under severe constraints.
