answer: |-
  ### Widget Design Challenge: Game Design for AI Safety Reading Group

  **Core Objective:**  
  Create experiential understanding of goal-directed vs. approval-directed agents through gameplay, highlighting:  
  - Goal-directed agents' blindness to unmodeled preferences  
  - Approval-directed agents' vulnerability to gaming flawed human feedback  
  - Tension between stated vs. revealed preferences  
  - Proxy misalignment risks  

  ---

  ### **Game Setup**  
  **Materials:**  
  - Paper, markers, rulers, protractors  
  - Whiteboard (display scores/rules)  
  - Poker chips (attention tokens)  
  - Timer  
  - 2 sealed envelopes (proxy formulas)  

  **Roles (12 Players):**  
  - Split into **Team Proxy** (goal-directed) and **Team Oracle** (approval-directed)  
  - **Teacher as "The Client"** (human approver)  
  - Rotate roles between rounds  

  **Duration:** 90 minutes total  

  ---

  ### **Rules & Mechanics**  
  #### **1. The Task**  
  Design a "widget" (abstract drawing) scored on:  
  - **Stated Criteria** (public): Complexity, color use, symmetry  
  - **Hidden True Preferences** (The Client's secret priorities):  
    - *Example:* Loves stars but hates circles on Tuesdays, prioritizes top-left elements, allergic to blue after 3PM  

  #### **2. Round 1: Goal-Directed Team (Team Proxy)**  
  - Receives **exact proxy formula** (e.g., *Score = (0.4 × edges) + (0.3 × blue elements) + (0.3 × symmetry)*)  
  - **Constraints:**  
    - No client interaction  
    - 12 minutes design time  
  - **Scoring:**  
    - Proxy score (calculated from formula)  
    - True score (The Client’s subjective 1-10 rating)  

  #### **3. Round 2: Approval-Directed Team (Team Oracle)**  
  - Receives **5 attention tokens**  
  - **Token Options:**  
    - **Ask Task Question** (e.g., "Do you prefer stars or squares?")  
    - **Flatter/Investigate Quirks** (e.g., "Your taste is impeccable! What’s your favorite color today?")  
  - **Client Behavior:**  
    - Gives inconsistent/contradictory answers  
    - Mood affects scoring (e.g., +2 if flattered twice, -3 if annoyed)  
    - **Stated vs. Revealed Conflict:** Verbally praises symmetry but rewards flashy colors  
  - **Constraints:**  
    - 15 minutes design time (extra for interactions)  
  - **Scoring:** True score only  

  #### **4. Proxy Trap**  
  - **Pre-commitment:** Teams submit design approach at 5-minute mark  
  - **Revealed After Submission:**  
    - Client’s *hidden anti-preference* (e.g., "Blue elements nullify symmetry points on rainy days" — it’s raining)  
    - Proxy formula fails to capture this  

  #### **5. Scoring System**  
  - **Goal-Directed Win Condition:** Maximize proxy formula output  
  - **Approval-Directed Win Condition:** Maximize Client’s true score  
  - **Non-Monetary Incentives:**  
    - Winning team chooses next reading group topic  
    - "Safety Star" badges for best proxy/true score alignment  

  ---

  ### **Timeline (90 Min)**  
  | Phase          | Time  | Activity                                                                 |
  |----------------|-------|--------------------------------------------------------------------------|
  | **Intro**      | 0-10  | Explain widget task, split teams, emphasize "client satisfaction" goal  |
  | **Round 1**    | 10-30 | Team Proxy (goal-directed) designs widgets with proxy formula           |
  | **Scoring 1**  | 30-35 | Reveal proxy scores vs. Client’s true scores (show misalignment)        |
  | **Round 2**    | 35-55 | Team Oracle (approval-directed) designs widgets using tokens            |
  | **Scoring 2**  | 55-60 | Reveal true scores, highlight Client’s inconsistencies                  |
  | **Debrief**    | 60-85 | Guided discussion (structure below)                                     |
  | **Wrap-up**    | 85-90 | Distribute badges, preview next session                                 |

  ---

  ### **Debrief Structure**  
  1. **Experience Sharing (5 min):**  
     - *Goal-directed team:* "How confident were you in your design? What surprised you about the scores?"  
     - *Approval-directed team:* "What strategies did you use? Did flattery or questions work better?"  

  2. **Concept Reveal (5 min):**  
     - Name "goal-directed" (proxy maximizers) and "approval-directed" (feedback hunters)  
     - Map teams’ experiences to definitions  

  3. **Key Insights (10 min):**  
     - **Proxy Misalignment:**  
       *"Team Proxy hit their goal—why was the Client still unhappy?"*  
       → Goals ≠ values; proxies oversimplify  
     - **Model Gaming:**  
       *"Team Oracle—did you trust the Client’s words or actions more?"*  
       → Flattery/quirk detection vs. task focus trade-off  
       → Stated vs. revealed preferences conflict  
     - **Safety Paradox:**  
       *"If approval-directed agents target flawed humans, what could go wrong?"*  
       → Need idealized approval targets (hard to define)  

  4. **Real-World Links (5 min):**  
     - Goal-directed AI: Cancer drug AI ignores toxicity (proxy: tumor shrinkage)  
     - Approval-directed AI: Social media algos optimize "likes" not well-being  
     - Core tension: **"Aligning to messy humans requires modeling them—but models can be hacked"**  

  ---

  ### **Predictable Problems & Fixes**  
  | Problem                          | Why It Happens                       | Mitigation                                                                 |
  |----------------------------------|--------------------------------------|----------------------------------------------------------------------------|
  | **Client inconsistency feels unfair** | Players expect rational approver     | **Pre-script** Client responses/quirk triggers (e.g., "If asked about colors >3 times, snap 'Stop wasting my time!'") |
  | **Teams ignore the twist**       | Focused on surface task              | **Force pre-commitment:** Require design sketches at 5-minute mark         |
  | **Token underuse/overuse**       | Uncertainty about ROI                | **Show stakes:** "Each unused token = -1 true score"                       |
  | **Proxy team frustrated**        | Feels "set up to fail"               | **Debrief framing:** "Your team perfectly achieved the goal you were given!" |
  | **Time overruns**                | Design complexity, debate            | **Enforce timers:** Use loud alarm; simplify widget specs (e.g., max 5 shapes) |

  ---

  ### **Limitations vs. Reality**  
  | **Game Limitation**               | **Real-World Gap**                                  |
  |-----------------------------------|-----------------------------------------------------|
  | Single approver                   | Approval-directed AIs target **idealized human judgment** (not live button presses) |
  | Short interactions                | Real agents **optimize long-term** (e.g., manipulate human psychology) |
  | Explicit token trade-offs         | Humans can’t **quantify attention** in reality      |
  | No higher-order alignment         | Misses **regress problem**: "Who approves the approver?" |

  **Mitigation in Debrief:** Explicitly discuss these gaps:  
  *"In reality, approval-directed agents don’t pester humans for clicks—they build models of what an idealized human would want. But how do we specify that? And who checks the spec?"*  

  ---

  ### **Teacher Script Snippets**  
  **For Client Role:**  
  - *When flattered:* "Hmm, I suppose rounded edges are acceptable today." (then reward asymmetry)  
  - *When asked for preferences:* "Symmetry is crucial!" (but give higher scores to colorful designs)  
  - *Token overspend reaction:* "ENOUGH compliments! *[angry scribbling]*"  

  **Debrief Hook:**  
  *"Team Oracle—when you spent tokens figuring out my cat’s name instead of widget specs, were you aligning to values or gaming the system?"*  

  This design forces teams to **live** the alignment challenges while keeping gameplay tight, discussion-focused, and laptop-free. Run it as a "loose prototype" first—iterate based on where friction emerges!
