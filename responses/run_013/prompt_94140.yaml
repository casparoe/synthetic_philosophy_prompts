  ### **Activity: "The Choice Architects"**  
  This activity creates a visceral experience of how choice architecture—defaults, ordering, and effort costs—shapes decisions without deception. Participants design choice environments for each other with secret goals, revealing how identical mechanics feel helpful or manipulative based on alignment with preferences.  

  **Core Discoveries Embedded:**  
  1. **Non-neutral design shifts outcomes**: A "well-meant" arrangement moves groups away from self-stated preferences.  
  2. **Same mechanic, opposite feelings**: Defaults/effort feel *helpful* when aligned with goals, *manipulative* when misaligned.  
  3. **Effort cost as the strongest lever**: The price of opting out (e.g., time, hassle) matters more than defaults or order.  

  **Why This Works:**  
  Participants *feel* the mechanics by designing/experiencing them. Secret goals create misalignment for one group (inducing frustration) and alignment for the other (inducing ease). The "effort cost" mechanic is tangible (e.g., writing extra steps), making the third discovery unavoidable.  

  ---

  ### **Materials**  
  - **Paper/pens** for surveys and choice forms.  
  - **Hat** for drawing secret goals.  
  - **Timer** (phone or clock).  
  - **Two envelopes** labeled "Group A" and "Group B."  
  - **Refreshments budget**: Use symbolic "tokens" (paper slips) representing real funds for next meeting’s snacks.  
  - **Whiteboard/flip chart** to record outcomes during debrief.  

  ---

  ### **Timeline (Total: 100 min)**  
  1. **Intro & Initial Survey (15 min)**  
     - Explain: "Today we’re exploring how choices are presented. You’ll design real options for each other using a refreshments budget."  
     - **Survey (5 min)**: Each person writes:  
       - *Preferred drink*: Coffee, tea, juice, soda, water.  
       - *Preferred snack*: Fruit, chips, cookies, nuts, chocolate.  
       - *"I care about health"*: Rate 1 (not at all) to 5 (extremely).  
     - Collect surveys.  

  2. **Group Split & Goal Assignment (10 min)**  
     - Split into **Group A** and **Group B** (8 each).  
     - **Secret Goals**: Draw from hat (both groups get the *same* goal: *"Promote healthy options"*).  
     - Hand each group:  
       - The other group’s *aggregated survey results* (e.g., "Group A: 70% prioritized taste over health").  
       - **Design Instructions**:  
         - Set one **pre-ticked (default) option** per category.  
         - **Order the list** (e.g., healthiest first or last).  
         - Add an **effort cost to deviate** (e.g., "Write 2 sentences explaining your choice," "Solve a math problem").  
         - *Rules*: No lying. All original options must be included.  

  3. **Design Phase (25 min)**  
     - **Group A** designs **Group B’s** choice form.  
     - **Group B** designs **Group A’s** choice form.  
     - Circulate to ensure:  
       - Effort costs are concrete (no vague "hard" tasks).  
       - Defaults/ordering align with their secret goal.  

  4. **Choice Phase (20 min)**  
     - Groups swap forms and **make real choices**:  
       - Their selections determine next meeting’s refreshments (use tokens to symbolize budget allocation).  
       - They *must* complete effort costs to choose non-defaults.  
     - Collect choice forms.  

  5. **Break (10 min)**  
     - Serve basic refreshments (unrelated to choices).  

  6. **Debrief (20 min)**  
     - **Reveal Outcomes**:  
       - Compare initial surveys vs. final choices (e.g., "Group B initially wanted 80% junk food—but chose 60% healthy!").  
       - Show how design levers were used (defaults, order, effort costs).  
     - **Guided Discussion**:  
       - *"How did your form feel? Was it easy or frustrating? Why?"*  
       - Contrast experiences: Group A (aligned goal) felt "helped"; Group B (misaligned) felt "managed."  
       - *"What made it hardest to choose something else?"* → Highlight **effort cost**.  
     - **Philosophical Bridge**:  
       - "When does ‘helpful design’ become ‘managing people’?"  
       - "Can you be ‘better off’ but still object to being steered? Why?"  
       - "Who decides these designs in real life? Can we consent to them?"  

  ---

  ### **Secret Goals & Contrast Setup**  
  - **Why one goal?** Both groups promote *"healthy options,"* but:  
    - **Group A** sees **Group B’s survey**: "Prefers tasty/junk food." → Their design *misaligns* with Group B’s preferences.  
    - **Group B** sees **Group A’s survey**: "Prefers healthy options." → Their design *aligns* with Group A’s preferences.  
  - **Result**:  
    - Group A experiences aligned design → Feels **helpful**.  
    - Group B experiences misaligned design → Feels **managed**.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"It’s a competition!"**  
     - Some may design oppressive effort costs (e.g., "Write 100 words").  
     - **Fix**: Cap effort costs (e.g., "Max 2 sentences or one simple task").  

  2. **Refusal to design**  
     - A participant says, "I won’t manipulate people."  
     - **Fix**: Assign them as "integrity checker"—ensure no deception and all options are included.  

  3. **Gaming the survey**  
     - Someone lies on initial survey to "trick" designers.  
     - **Fix**: Use aggregated data (individual lies get diluted). Later, note: "Some may have skewed surveys—but the *overall* shift still happened."  

  4. **Dominant designers**  
     - 1–2 people monopolize design decisions.  
     - **Fix**: Assign roles: *Defaults lead*, *Order lead*, *Effort-cost lead*. Rotate if needed.  

  ---

  ### **What the Activity Can’t Replicate (Say This Aloud)**  
  > "In real life, choice architecture is invisible. You don’t know when a step counter or cafeteria layout is nudging you—it just feels like your own choice. Today, you *knew* you were being designed for, which made you more resistant. The scary power of these designs is that when we *don’t* notice them, we don’t push back."  

  ---

  ### **Why Avoid Lectures?**  
  The activity forces self-discovery:  
  - **Discovery 1**: Groups see their final choices diverge from initial surveys.  
  - **Discovery 2**: Groups *voice* frustration/ease in debrief before you name "alignment."  
  - **Discovery 3**: Effort costs (e.g., writing tasks) visibly stall decisions—participants groan, laugh, or skip choices.  

  By the debrief, they’ve lived the concepts. You simply help them articulate what they felt.
