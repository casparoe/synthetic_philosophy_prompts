answer: |-
  Here are the desiderata for a theory of rational choice handling undefined expected values, motivated by the Pasadena/Altadena paradox and related challenges. I'll list requirements with motivating cases, flag tensions, and briefly evaluate existing approaches.

  ---

  ### **Core Desiderata & Motivating Cases**
  1.  **Dominance Respect (Strict/Payoff Dominance):**  
      *   *Requirement:* If gamble A pays strictly more than gamble B in *every possible state of the world*, then A ≻ B.  
      *   *Motivation:* Altadena dominates Pasadena outcome-by-outcome. Any theory failing this is highly counterintuitive and violates a bedrock principle of rationality.

  2.  **Order Invariance / Reordering Robustness:**  
      *   *Requirement:* The value assigned to a gamble should not depend on an arbitrary labeling or ordering of its states/outcomes. Evaluations must be invariant under permutation of states with equal probabilities.  
      *   *Motivation:* The core Pasadena paradox – the "natural" ordering sums to ln2, but reorderings yield any real number. A theory sensitive to arbitrary orderings is epistemically ungrounded.

  3.  **Additivity of Constants (Translation Invariance):**  
      *   *Requirement:* Adding a constant amount $c$ to *every* payoff of a gamble should increase the gamble's value by exactly $c$.  
      *   *Motivation:* Altadena = Pasadena + $1. If the natural sum for Pasadena is ln2 ≈ $0.69, Altadena should be ≈$1.69. Failure creates bizarre discontinuities in value.

  4.  **Completeness (Verdict Requirement):**  
      *   *Requirement:* The theory *must* provide a strict preference ordering (≻, ≺, or ∼) for any pair of gambles, including comparisons to sure things (e.g., $0).  
      *   *Motivation:* Is Pasadena preferable to $0? To $0.50? To $0.70? Rational agents need to act; silence is paralysis. (Note: This is contentious; some desiderata lists might omit this).

  5.  **Convergence Principle / Privileging Natural Order:**  
      *   *Requirement:* The theory should assign the value given by the conditionally convergent sum under the "natural" temporal/sequential ordering of outcomes when such an ordering exists and is meaningful.  
      *   *Motivation:* In Pasadena/Altadena, the coin flips happen sequentially; the nth flip outcome is causally and temporally distinct. The natural order isn't arbitrary; it reflects the game's structure. Ignoring it seems wrong.

  6.  **Distinction from Infinite Value:**  
      *   *Requirement:* The theory must clearly distinguish gambles with *undefined* expected value (like Pasadena) from those with *infinite* expected value (like St. Petersburg).  
      *   *Motivation:* Treating Pasadena like St. Petersburg (infinite value) leads to absurdities (e.g., paying any finite amount to play). They are fundamentally different pathologies.

  7.  **Robustness under Combination:**  
      *   *Requirement:* The theory's evaluation of a gamble should remain consistent (or predictably change) when the gamble is:  
          a) *Repeated* independently (finite or infinite times).  
          b) *Combined* with other independent gambles (finite or infinite, especially those with well-defined expectations).  
      *   *Motivation:* Does playing Pasadena twice have a defined value? Is Pasadena + a $1 sure thing equivalent to Altadena? Real choices involve portfolios of gambles.

  8.  **VNM Consistency / Axiomatic Foundation:**  
      *   *Requirement:* The theory should either satisfy the von Neumann-Morgenstern axioms (Completeness, Transitivity, Continuity, Independence) or provide a clear, justified explanation for which axiom is relaxed/violated and why.  
      *   *Motivation:* VNM provides the standard foundation for EU under risk. Deviations need justification. The core issue likely involves the **Continuity** axiom (or the implied archimedean property) when expectations diverge, or the **Independence** axiom under reordering/combination.

  9.  **Value Fragility Avoidance:**  
      *   *Requirement:* The theory should not render the value of a gamble undefined or radically altered by the addition/subtraction of outcomes with arbitrarily small probability or arbitrarily small payoff changes.  
      *   *Motivation:* Adding a vanishingly small chance of a vanishingly small payoff shouldn't suddenly make a well-defined gamble (or a convergent truncation of Pasadena) undefined. Stability matters.

  ---

  ### **Tensions Between Desiderata**
  The fundamental challenge is that **several core desiderata appear jointly unsatisfiable:**

  1.  **Dominance vs. Order Invariance vs. Convergence:**  
      *   *Tension:* Enforcing **Dominance** (Altadena > Pasadena) strongly suggests valuing Altadena at (ln2 + 1) and Pasadena at ln2. This requires accepting the **Convergence Principle** (privileging natural order). But this directly violates **Order Invariance** – the value *does* depend on a specific ordering. If you demand strict **Order Invariance**, you cannot assign *any* specific finite value (like ln2) to Pasadena, making **Dominance** hard to apply directly (if Pasadena lacks a value, how do you compare it to Altadena, which also lacks one under this view?).

  2.  **Additivity of Constants vs. Value Fragility / Undefinedness:**  
      *   *Tension:* If Pasadena is deemed "valueless" or undefined (*Value Fragility* or rejecting *Convergence*), then adding $1 everywhere (Altadena) should intuitively still be worth $1. But **Additivity** requires Altadena = Pasadena + $1. If Pasadena has *no defined value*, how can Altadena have the defined value $1? If you insist Altadena is worth $1, you've effectively defined Pasadena as $0 (violating the view that it's truly undefined and embracing *Convergence* implicitly). **Additivity** seems to force a defined value for Pasadena if Altadena is defined.

  3.  **Completeness vs. Distinction from Infinite Value:**  
      *   *Tension:* Insisting on **Completeness** forces a verdict on Pasadena vs. $c$. If you assign it a finite value (e.g., ln2), you distinguish it from St. Petersburg (∞), satisfying **Distinction**. However, this assignment violates **Order Invariance**. If you refuse to assign a finite value (respecting **Order Invariance**), maintaining **Completeness** might force you to treat Pasadena *like* St. Petersburg (infinite value? infinitely bad? incomparable?), violating **Distinction**. Or, you must allow incompleteness, violating **Completeness**.

  4.  **VNM Consistency vs. Handling Undefinedness:**  
      *   *Tension:* The core VNM axioms assume finite expectations exist. **Continuity** (for any A≺B≺C, there's a lottery mixing A and C equivalent to B) likely fails if B is a sure thing and A or C is Pasadena-like. **Independence** (if A≻B then pA+(1-p)C ≻ pB+(1-p)C) might fail when combining Pasadena with other gambles if its "value" isn't linear. A theory satisfying the other desiderata will likely violate standard VNM axioms, requiring justification.

  ---

  ### **How Existing Approaches Fare (Briefly)**
  1.  **Standard Expected Utility (EUT):**  
      *   *Fails:* Order Invariance (critically), Dominance (for Altadena vs. Pasadena), Additivity of Constants (if undefined), Distinction from Infinite Value (if undefinedness isn't handled), Convergence Principle, Robustness under Combination, VNM Consistency (implied failure). *Succeeds:* Only if it declares "undefined" and abandons Completeness.

  2.  **Truncation/Limit Approaches (e.g., n-flips max):**  
      *   *Fails:* Order Invariance (value depends on truncation structure), Value Fragility (small changes affect truncation), strict Additivity (truncating Pasadena + $1 isn't *exactly* truncation of Pasadena + $1), VNM Consistency (truncation violates independence). *Succeeds:* Convergence Principle (natural order), Dominance (if Altadena truncation handled correctly), Distinction from Infinite Value, often Completeness.

  3.  **Non-Standard Analysis (Hyperreals):**  
      *   *Fails:* Nothing technically, but... *Succeeds:* Formally satisfies Dominance, Additivity, Convergence Principle, Distinction, Completeness (assigns hyperreal value ≈ ln2 + infinitesimal), can handle VNM-like structures. *Tension:* Violates the *spirit* of Order Invariance – the value depends on the ultrafilter used for summation, which is mathematically analogous to an ordering. Feels non-constructive. Hard to extend to Robustness under Combination intuitively.

  4.  **Dominance Lexicographic Approaches:**  
      *   *Fails:* Order Invariance (relies on state-space structure), Additivity (may not shift cleanly), Convergence Principle (may override natural order with dominance), VNM Consistency. *Succeeds:* Strict Dominance (by definition), Completeness (often), Distinction from Infinite Value. *Mechanism:* Declares Altadena > Pasadena because of dominance, but may assign both "undefined" or equivalent to $0 + something. Struggles with Pasadena vs. $0.50.

  5.  **Relative Expectation (Bartha et al.):**  
      *   *Fails:* Completeness (often yields non-comparability), Additivity (not preserved), Convergence Principle (uses state-dependent comparisons, not sums), standard VNM. *Succeeds:* Order Invariance (core feature), Strict Dominance (if defined), Distinction from Infinite Value, Value Fragility Avoidance. *Tension:* Cannot say Altadena is *better* than Pasadena in a scalar sense, only that it dominates (which might be sufficient for choice but feels weak). Leaves Pasadena vs. $0 unresolved.

  ---

  This map highlights the central tension: **Privileging the natural order (to get ln2 and enforce Dominance/Additivity) fundamentally conflicts with Order Invariance.** You likely cannot have all three. Most proposed solutions sacrifice one or the other (or both, in more complex ways). The choice between desiderata reflects deep philosophical stances on the nature of value, probability, and rational choice under pathological uncertainty.
