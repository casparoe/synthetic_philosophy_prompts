prompt: |-
  I spent thirty-five years as a geophysicist and only got into philosophy after I retired, so I'm still learning the vocabulary. There's a thing I keep noticing and I don't know if it has a name. In my old field, if you held a belief and the data kept coming in against it, you'd eventually give it up -- maybe not right away, maybe you'd tweak the auxiliary assumptions first, but there was a direction of pressure. Now I've been reading Quine, and he says our beliefs form a web, with the logical and mathematical stuff near the middle and the observational stuff at the edges, and that nothing is immune from revision in principle. Fine. But then I read what he says about moral values, and it looks like values are in the web somewhere, but they never get revised by experience. You can have a moral view that's caused you nothing but trouble, that predicts (in some loose sense) that you'll feel a certain way about a case, and when the feeling doesn't come, you don't drop the value -- you find a story about why the case is special. Take someone who thinks it's always wrong to lie: they lie to spare a friend's feelings, feel fine about it, and instead of dropping the rule they say that wasn't really a lie, it was a kindness. And yet nobody wants to say the value is analytic or unrevisable in principle. So here's my question: is there a name for this exact spot in the logical geography -- a seperate class of commitments that are part of the web, that are revisable in principle, but that experience never actually dislodges? I know about the fact/value distinction and I know about non-cognitivism, but neither seems to be quite it, because Quine clearly thinks values are real psychological states and not just expressions. And is there a name for his positive view -- that ethics is more like engineering than like science, where you take the ends as given and reason about means? I keep wanting to call it something like moral engineering but I don't know if that's already taken. I'd be grateful for the nearest concepts and how they differ from what I'm describing, not just a label.
reasoning: |-
  Okay, the user is a retired geophysicist who's new to philosophy and has been reading Quine. They're noticing a difference between how scientific beliefs and moral values respond to evidence. In science, data eventually forces belief revision, but moral values seem resistant even when they cause trouble. They want to know if there's a term for commitments that are revisable in principle but never actually revised by experience, and what Quine's view on ethics is called.

  First, I need to recall Quine's web of belief. The core contains logical and mathematical beliefs, while the periphery has observational ones. When data conflicts, adjustments start at the edges but can reach the center. The user points out that moral values are in the web but don't get revised like empirical beliefs. For example, someone who believes lying is wrong might lie to spare feelings and then rationalize it as a kindness instead of changing their moral rule. 

  The user mentions the fact/value distinction and non-cognitivism but feels those aren't quite right because Quine sees values as psychological states. They also ask about Quine's view that ethics is like engineering—taking ends as given and reasoning about means. They call it "moral engineering" but wonder if that term exists.

  Key points to address:
  1. **Term for revisable-but-never-revised commitments:** I need to think if there's a specific term. Quine doesn't have a unique term for this, but it relates to central vs. peripheral beliefs. Moral values might be core commitments, resistant to change. Possible concepts: "bedrock commitments" (Sellars), "hinge propositions" (Wittgenstein), or "entrenched statements" (Quine). Among these, "entrenched statements" fits best as Quine's term for highly resistant beliefs.

  2. **Quine's view on ethics:** The user describes it as engineering-like. Quine's position is naturalized ethics, where moral values are empirical but deeply ingrained. He considers them revisable in principle but in practice, they're stable. Terms like "instrumental rationality in ethics" or "means-end reasoning" come to mind. "Moral engineering" isn't standard, but it's descriptive. "Quinean instrumentalism in ethics" might be more precise.

  3. **Clarifying differences:** The user wants to know how these concepts differ. Entrenchment vs. analyticity: Analytic statements are true by meaning (e.g., "bachelors are unmarried"), while entrenched ones are revisable but central. Non-cognitivism treats moral statements as expressions of emotion, not truth-apt, but Quine is a cognitivist naturalist. Fact/value distinction separates descriptive from prescriptive, but Quine sees values as part of the empirical web.

  The user's deeper needs might include understanding why moral values resist revision despite being empirical. They might also seek validation of their observation as a legitimate philosophical issue. As a scientist, they appreciate systematic approaches, so explaining Quine's naturalism and how ethics fits into his holistic view would help.

  I should structure the response by first addressing the term for resistant commitments, explaining entrenchment, then discussing Quine's ethical view as instrumentalist naturalism. Highlighting the differences from other concepts will clarify the nuances. Recommending further readings like Harman or Wong on moral naturalism could be useful.
answer: |-
  What you're describing is a brilliant observation that cuts to the heart of Quinean holism and the unique challenges of moral epistemology. You've pinpointed a genuine tension. Let's map the logical geography:

  1.  **The Phenomenon:** You've identified a class of beliefs (moral values) that are:
      *   Part of the holistic web of belief (Quine's core insight).
      *   Revisable *in principle* (Quine's universal revisability).
      *   Yet, in practice, exhibit extreme resistance to revision by counter-evidence or disconfirming experiences. Revision often happens through *re-description* ("that wasn't a *real* lie") or *adjusting auxiliary hypotheses* (about the situation, motives, consequences) rather than abandoning the core value itself.
      *   This contrasts sharply with typical empirical hypotheses near the periphery.

  2.  **The Nearest Concept: Entrenchment (within a Quinean Framework)**
      *   **The Term:** The closest specific term within Quine's own conceptual toolkit is **entrenchment**. While Quine didn't develop a detailed theory of *moral* entrenchment, the concept fits perfectly.
      *   **Explanation:** Entrenchment refers to the *degree* to which a belief is central and resistant to revision within the web. Logical and mathematical beliefs are highly entrenched due to their pervasive connections and role in structuring the whole system. Observational beliefs are less entrenched. You're observing that core *moral* values often exhibit a level of entrenchment comparable to logical/mathematical beliefs *in practice*, even if Quine insists they aren't *in principle* immune.
      *   **Why it fits:**
          *   It accounts for the "direction of pressure" you felt in science (peripheral beliefs are less entrenched).
          *   It explains the resistance: Revising a highly entrenched belief requires massive upheaval in the web – adjusting countless auxiliary assumptions, reinterpreting vast amounts of "data" (experiences, intuitions, social norms). It's pragmatically easier to tweak the description of the event ("not a *real* lie") than to dismantle a foundational value ("lying is wrong").
          *   It maintains revisability *in principle*: A sufficiently radical and persistent clash *could* eventually force revision of even the most entrenched value (though history shows this is rare and traumatic).
      *   **Related Concepts & Distinctions:**
          *   **Centrality vs. Periphery:** This is the broader Quinean picture. Entrenchment is the *property* of centrality that confers resistance. Values often reside in a central, highly connected region.
          *   **Analyticity:** You rightly reject this. Analytic statements (if they exist for Quine) are true by meaning/convention and *logically* unrevisable without changing language. Entrenched statements are *empirically* revisable, just extremely difficult/pragmatically costly. Your lying example shows revision *is* conceivable; it just doesn't happen easily. Values aren't true by definition.
          *   **Necessity (Metaphysical):** Entrenchment is epistemic/pragmatic, not metaphysical. It's about *our* relationship to the belief within our web, not about the belief describing a necessary feature of the world.
          *   **Bedrock Commitments (Sellars) / Hinge Propositions (Wittgenstein):** These capture the idea of foundational assumptions that make inquiry possible. They overlap significantly with highly entrenched beliefs. The key difference is that Quinean entrenchment is a matter of degree within a holistic, empirically grounded system, while hinges/bedrock often imply a more categorical, framework-constituting role. Your observation aligns well with seeing core values as having a "hinge-like" function in our practical reasoning.
          *   **Cognitive Bias (Psychology):** While not a philosophical *term* for the commitment itself, phenomena like belief perseverance, confirmation bias, and motivated reasoning are the psychological mechanisms that *explain why* entrenched beliefs (especially emotionally charged ones like values) resist revision.

  3.  **Quine's Positive View on Ethics: Instrumentalism within Naturalism**
      *   **The Core:** Quine is a **naturalist**. He views humans, including our moral capacities and judgments, as entirely within the causal, physical world studied by science. Moral values are real psychological states (dispositions, preferences, approvals) shaped by evolution, culture, and individual experience.
      *   **The Engineering Analogy:** You've perfectly captured Quine's instrumentalist view. Ethics, for Quine, is largely about **practical deliberation concerning means to ends**, where the ultimate ends (the core values) are taken as given by our nature and upbringing.
      *   **The Name:** While "**moral engineering**" is evocative and reasonably descriptive, it's not a standard, universally recognized label for Quine's specific view. More precise (though clunkier) descriptions are:
          *   **Quinean Instrumentalism in Ethics:** Highlights the means-end structure.
          *   **Naturalized Ethics (Quinean Version):** Emphasizes grounding ethics within a scientific worldview, focusing on the psychology and sociology of value formation and decision-making.
          *   **Humean-Inspired Instrumentalism:** Quine's view shares strong affinities with Hume's "reason is the slave of the passions." Reason calculates how to achieve the ends set by our desires/values.
      *   **How it Connects to Entrenchment:** Our core values/ends are deeply **entrenched psychological fixtures**. Ethical reasoning primarily operates *within* the framework they provide, focusing on coherence, consequences, and effective means. Revising these core ends is not the *primary* activity of everyday ethics; it's a rarer, more systemic upheaval. Quine sees the *study* of how these values form and function as a scientific (psychological, sociological, biological) endeavor, while the *practice* of ethics is the instrumental reasoning.

  **In Summary:**

  *   **The "spot" for commitments revisable in principle but resistant in practice:** This is best described as **highly entrenched beliefs within the Quinean web**, particularly those occupying a central position. Core moral values often exemplify this.
  *   **Quine's positive ethical view:** This is **naturalism combined with instrumentalism**. Values are real, natural psychological states; ethical reasoning is primarily instrumental ("engineering-like") reasoning about means to achieve those given ends. While "moral engineering" is apt, the standard terminology is **Quinean naturalism/instrumentalism in ethics**.

  Your background as a scientist gives you a keen eye for the difference between theoretical revisability and practical resistance. You've identified a crucial feature of how normative frameworks (like morality) function differently within the holistic web compared to descriptive empirical hypotheses, even under a thoroughly naturalistic view like Quine's. This tension between principle and practice in moral revision remains a central topic in metaethics. Gilbert Harman's work (especially *The Nature of Morality*) and later naturalistic moral realists like David Brink or Richard Boyd delve deeper into these issues within a Quinean spirit. Stephen Stich and Shaun Nichols also explore the empirical psychology behind moral judgment and its resistance to revision.
