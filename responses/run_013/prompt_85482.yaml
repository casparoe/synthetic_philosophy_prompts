prompt: |-
  I'm in a political epistemology reading group that has spent the term on proposals for supplementing or replacing elections with prediction markets, and one member has become an enthusiastic futarchist. He has a reconstructed argument that I find genuinely hard to fault in the middle, even though I cannot accept where it ends. Here it is, in the form he wrote it on the whiteboard:

  (1) For any decision problem with a well-specified objective, a conditional prediction market — traders betting on how much of the objective would be realized under each option — yields a better estimate of which option best realizes the objective than any feasible alternative: deliberation, expert panels, votes, cost-benefit analysis.
  (2) Where one procedure yields better estimates of which option best realizes a given objective than another procedure does, the decision ought to be made by the better procedure.
  (3) Therefore, for any decision problem with a well-specified objective, the decision ought to be made by a conditional prediction market on that objective.
  (4) A polity's choice of which objective to pursue is itself a decision problem with a well-specified objective: we can ask which candidate welfare metric, if adopted, would leave the members of the polity better off, and run a market on that.
  (5) By (3), the metric should therefore also be chosen by a market.
  (6) But the second-order objective used to score that market is either itself chosen by a market — in which case we repeat the exercise at the next level up — or it is not, in which case some objective was fixed by something other than a market.
  (7) Furthermore, (3) applies to every decision with a specifiable objective, not only to public ones: whether to accept a job, whether to marry a particular person, whether to sell a kidney.
  (8) So the principle either cannot be applied to itself, leaving the metric that all the markets score against to be settled by ordinary, non-market politics — precisely what futarchy promised to get past — or it applies everywhere, down to the most personal choices, which is absurd.

  What I want is a diagnosis. Tell me which step I should give up, whether the trouble is a flaw in the reasoning or simply a premise that turns out to be expensive, why the step looked innocent enough to write down in the first place, and what giving it up costs me elsewhere — in particular, what I would then owe by way of an account of when a procedure's superior accuracy does and does not entitle it to decide. I would like to keep (1) if I possibly can, since I do think markets aggregate information well in the right conditions, but I am willing to lose (2) or (3) if that is the price. I have been told by two different people that the argument commits a scope error and that it is valid but simply has a conclusion I dislike, and I cannot tell which of them is right, so please do not assume the answer is obvious.

  Format the response as follows: a section titled "The step I should give up" (about 150 words), naming the step and stating in one sentence whether the argument is flawed or merely costly; a section titled "Why it looked innocent" (about 200 words), explaining the intuitive pull of the step and the reading of the earlier steps that makes it seem to follow; a section titled "What giving it up costs" (about 250 words), tracing the consequences for the rest of the argument and for the practical proposal; a section titled "The other candidates, priced" (about 300 words), giving a short table with one row per remaining step — the step, what rejecting it costs, and what it leaves standing — followed by two or three sentences on which of these you would take if you had to; and a section titled "Bottom line" (about 100 words), stating the verdict plainly.
reasoning: |-
  Hmm, the user is part of a political epistemology reading group discussing prediction markets and futarchy. One member has presented a reconstructed argument that leads to an absurd conclusion: either markets must decide everything, including personal choices, or the system relies on non-market politics for foundational objectives. The user finds it hard to fault the middle steps but can't accept the conclusion. They want me to identify which step to give up, why it seemed innocent, the costs of rejecting it, and alternatives.

  The argument has eight steps. Step (1) claims conditional prediction markets are the best estimators for decision problems with well-specified objectives. Step (2) says better estimators should make decisions. Step (3) combines these to say markets should decide such problems. Step (4) extends this to choosing objectives themselves. Step (5) applies (3) to metrics. Step (6) points out the infinite regress or non-market foundation. Step (7) notes it applies to personal decisions. Step (8) concludes the dilemma: either absurd universal application or reliance on non-market politics.

  The user wants to keep step (1) if possible, since they believe in markets' information aggregation. The main problem appears in step (6) and (8), where the regress forces a choice between two unpalatable options. The flaw isn't in the logic but in the scope of step (2). Step (2) states that better estimation procedures should always make decisions, which overlooks other values like autonomy, legitimacy, or procedural fairness. For instance, in personal decisions (step 7), even if a market could estimate better, we value individual choice over accuracy.

  Step (2) seemed innocent because if a procedure is better at estimating, why not use it? But "ought" in step (2) conflates epistemic superiority with decisional authority. Accuracy isn't the only criterion for decision-making. Step (1) is about estimation, not decision-rights. Giving up step (2) means accepting that better estimators don't automatically get to decide. The cost is needing a theory of when accuracy entitles a procedure to decide—perhaps based on domain, stakes, or other values. The rest of the argument collapses without step (2). Steps (3) to (8) depend on it.

  Alternative steps to reject: Step (1) is costly because it undermines the core belief in markets. Step (4) might be rejected by arguing that choosing objectives isn't a "well-specified" problem, as welfare metrics are contestable. But step (4) is plausible; objectives can sometimes be specified. Step (7) could be limited by saying personal decisions aren't "decision problems" in the same public sense, but that might be ad hoc. Among these, giving up step (2) is the least costly, preserving market strengths while avoiding overextension.

  Bottom line: Reject step (2). It commits a scope error by assuming epistemic superiority implies decisional authority across all contexts. This preserves market utility for estimation without forcing absurd applications.
answer: |-
  ### The step I should give up  
  **Step (2)**: "Where one procedure yields better estimates of which option best realizes a given objective than another procedure does, the decision ought to be made by the better procedure." The argument is *flawed* due to a scope error: it conflates epistemic superiority with decisional authority, ignoring normative constraints like autonomy, legitimacy, or procedural fairness that may override accuracy in assigning decision-rights.

  ### Why it looked innocent  
  Step (2) appears compelling because it seems tautological: if Procedure A *reliably identifies* the best option more accurately than Procedure B, why *wouldn’t* we delegate decisions to A? This intuition is amplified by step (1), which frames prediction markets as epistemically dominant "feasible alternatives." In technical contexts (e.g., forecasting sales), delegating to the best estimator is uncontroversial, making step (2) seem like a neutral efficiency principle. Steps (3)–(5) then extend this mechanically, treating all decisions as optimization problems. The regress in step (6) feels like a puzzle to solve, not a reductio, because step (2) implicitly assumes accuracy is the *sole* criterion for legitimizing decisional power.

  ### What giving it up costs  
  Rejecting step (2) severs the link between market superiority in *estimation* (step 1) and market authority in *decision-making* (step 3 onward). This preserves prediction markets as advisory tools but denies them automatic governance rights. Consequently:  
  - Steps (3), (5), and (8) collapse: markets no longer "ought" to decide simply by being accurate.  
  - The futarchist proposal (steps 4–6) reverts to a hybrid: markets inform *how* to achieve objectives, but *what* objectives to pursue (step 4’s "welfare metric") must be set democratically or ethically, avoiding infinite regress.  
  - Step (7)’s absurdity dissolves—personal choices retain autonomy because accuracy doesn’t mandate external delegation.  
  The cost is a debt to political theory: you must explain when superior accuracy *entitles* a procedure to decide. This requires distinguishing domains where accuracy is paramount (e.g., infrastructure planning) from those where consent, rights, or deliberation matter more (e.g., constitutional values or personal life). For example, a market might correctly forecast that selling a kidney maximizes your wealth, but bodily autonomy forbids outsourcing that decision.  

  ### The other candidates, priced  

  | Step | Cost of rejecting | What it leaves standing |  
  |------|-------------------|-------------------------|  
  | (1) | Undermines core evidence for markets’ epistemic edge, forcing reliance on inferior estimators (e.g., votes or panels) even where markets excel. Weakens futarchy’s foundation. | Steps (2)–(8) remain logically valid but unsupported; if markets aren’t best, no pressure to adopt them. |  
  | (4) | Rejects the claim that choosing objectives is a "well-specified" decision problem. Argues welfare metrics are inherently contested or qualitative, defanging the regress (step 6). | Markets could still decide *means* (step 3) but not *ends*, leaving futarchy partial. Personal decisions (step 7) might still be threatened by step (2). |  
  | (7) | Insists personal decisions aren’t "decision problems" in the relevant public/political sense. Avoids absurdity but feels ad hoc. | The regress (step 6) and futarchy’s incoherence (step 8) persist for public decisions, and step (2) remains unconstrained. |  

  If forced to choose, I would reject **step (4)** over step (1) or (7). While step (4) is plausible for narrow objectives (e.g., "maximize GDP"), its application to meta-objectives (e.g., "which welfare metric improves well-being?") is where the regress originates. Contesting its "well-specified" premise avoids the infinite ladder while preserving markets for operational decisions. Still, step (2) is the deeper flaw—it licenses step (4)’s overreach.  

  ### Bottom line  
  The argument is valid but unsound due to step (2)’s scope error: it ignores that decisional authority requires more than accuracy. Reject step (2). This costs you a clean epistemic justification for governance but saves you from absurdity. To pay the debt, argue that accuracy entitles a procedure to decide only when values like autonomy or consent are already satisfied—e.g., in technical subproblems of politics, not in defining society’s ends or personal sovereignty.
