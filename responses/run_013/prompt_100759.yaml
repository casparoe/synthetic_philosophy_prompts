prompt: |-
  I'm a journalist who covers science and ideas, and I've been talking to a guy who thinks Quine's scattered remarks about ethics actually add up to a real position—call it entrenched-commitment non-cognitivism. On this reading, moral sentences aren't true or false, but they're not just boos and hurrahs either; they're socially inherited commitments that we test only for coherence, fit with our other commitments, and how well they keep the practice going. He reckons this is the most natural extension of Quine's naturalism. What would count against that? I want the actual defeaters, not a reading list—arguments, intuitions, cases, formal results (Frege-Geach-type embedding stuff, moral disagreement, the phenomenology of moral conviction), anything from moral psychology or the history of ethics that should make him worry. Rank them from fatal to merely awkward, say which ones he'd have to concede and which he could shrug off, and tell me whether the view has been qualified into something that can't lose—and if so whether that's a bug or just what a view like this has to be. Also say what it predicts that a straightforward moral realism or old-school emotivism doesn't. I personally find the disagreement argument pretty weak, but maybe I'm missing something. Tell me how confident you are in your verdict and flag the claim you're least sure about. End with \answer{...} containing a one-word label for how exposed the view is: exposed, partly, or insulated.
