  For counterarguments, the Frege-Geach embedding problem seems most structurally damaging - it directly challenges whether this view can handle moral logic. Moral phenomenology (feeling of objectivity) and disagreement (intractability) create psychological tension. The supervenience challenge questions if coherence alone suffices. 

