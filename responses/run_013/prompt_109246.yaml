prompt: |-
  I'm in a formal epistemology seminar that's wandered off the syllabus into the question of what you're supposed to do when the evidence itself comes with a probability attached, and I got volun-told to write the framing paper for next month. Before I start scoring the usual suspects (Jeffrey conditionalization and the various things people propose instead of it) against each other, I want the spec written down first, so could you write me the desiderata that any adequate theory of updating on uncertain evidence has to meet? Not the theories — the checklist. For each requirement I want the case or consideration that motivates it, so I can tell which ones are load-bearing and which are just things people say in seminars; a note on which ones are non-negotiable and which are really preferences of one camp (I suspect "the update shouldn't depend on the order you process your reports in" is doing more work as a taste than as a constraint, but tell me if I'm wrong about that); and — the part I actually want — any pair or triple of requirements you think can't be jointly satisfied, with the reason, plus which single requirement does the most to rule out candidates.

  Concretely, here are the cases I keep coming back to, and I want the list to be answerable to all of them: the old dim-light fabric case where you look at a cloth in bad light and come away 60/40 between two colors; a home air-quality monitor that doesn't beep but prints "72% chance of elevated radon," where you know roughly how its calibrated but you don't know whether it's been recalibrated since the last firmware update, so the reading is at once a definite observation (you either saw 72 or you didn't) and an uncertain guide to the world; two independent monitors reporting at the same moment, where I want to know whether the theory is allowed to make the answer depend on which one you feed in first; a new instrument that sorts samples into a category you had no prior partition over, so the rule can't be handed its partition in advance; the case where the report bears on something you'd previously assigned probability zero; and the boring limiting case where the report sharpens all the way to certainty and the rule has to collapse back into ordinary conditionalization. I'd also like it to say something about a report whose content is about your own future credence — you know you'll look at the display tomorrow and come away 70% confident — and about whether "uncertain evidence" is even a seperate phenomenon, or whether it's just ordinary conditionalization on a coarse-grained observation of the display, given that you either saw the number or you didn't.

  One more constraint on the whole exercise: I care about the version of this that a simple agent could actually implement while it's receiving a stream of noisy reports, not just a philosopher's existence proof that some rule is available somewhere, so please flag the spots where "philosophically respectable" and "runnable by something with finite memory" pull in different directions. Keep it a list with the reasoning attached to each item rather than an essay, and skip the scorecard at the end — I'll do that part myself.
reasoning: |-
  Okay, the user is in a formal epistemology seminar and needs a checklist of desiderata for updating beliefs when evidence comes with probabilities. They want motivations, notes on negotiability, potential conflicts, and which requirement is most restrictive. They also provided specific cases to address. Let me start by breaking down their query.

  First, they mentioned cases like the dim-light fabric, air-quality monitors with calibration issues, simultaneous reports, new categories, probability zero updates, and the certainty collapse. Plus, they want thoughts on uncertain evidence being separate or just coarse-grained observation. The challenge is to structure these into clear desiderata without turning it into an essay.

  The user emphasized practical implementation for simple agents, so computational feasibility is key. They also want to identify which desiderata are non-negotiable versus preferences. For example, commutativity (order independence) might be a taste rather than a strict constraint. I need to highlight where philosophical ideals clash with real-world runnability.

  Looking at the cases: the dim-light scenario requires handling probabilistic evidence directly. The air monitor involves meta-uncertainty about calibration, so the desideratum should account for evidence with uncertain reliability. Simultaneous reports touch on commutativity—whether order matters. The new category case needs partition invariance. Probability zero updates need a non-dogmatism rule. The collapse to certainty ties to the classical limit.

  I should list each desideratum with its motivation, negotiability, and conflicts. For instance, Conglomerability might conflict with Commutativity in certain setups. The most restrictive requirement is likely Partition Invariance because it demands flexibility beyond predefined partitions, which many rules (like Jeffrey's) rely on.

  Also, the user is skeptical about uncertain evidence being distinct. A desideratum on evidential granularity would address whether treating it as coarse-grained observation suffices. They might need to consider if all cases can be reduced to Bayesian conditioning on the fact of the report.

  Another point is finite auto-update: can the agent handle streams of data without infinite memory? Rules like Field's might require storing entire partitions, which isn't feasible. The user's focus on simple agents means computational constraints are crucial.

  I need to ensure each desideratum is tied to the provided cases. For example, calibration awareness stems from the air monitor's firmware uncertainty. The self-referential report case (future credence) needs reflexivity without paradox.

  Finally, conflicts: Partition Invariance vs. Commutativity in Jeffrey's updates. Also, Finite Auto-Update might clash with sophisticated rules that need historical data. Highlighting these helps the user evaluate trade-offs in theories.
answer: |-
  Here is a checklist of desiderata for updating on uncertain evidence, structured as requested, motivated by your cases, and annotated for negotiability, conflicts, and computational feasibility:

  ### Desiderata Checklist

  1.  **Handling Probabilistic Input (Core Functionality)**
      *   **Motivation:** Directly addresses the "dim-light fabric" case (60/40 color belief) and the air monitor reporting "72% chance". The rule must take a direct probability distribution *over the hypothesis space* (or relevant partition) as input, not just a categorical proposition.
      *   **Non-Negotiable:** Yes. This is the defining feature of the problem.
      *   **Computational Note:** Input format must be simple (e.g., a distribution over a partition).

  2.  **Classical Limit (Recovering Conditionalization)**
      *   **Motivation:** The "boring limiting case" where evidence sharpens to certainty (e.g., monitor beeps definitively for radon). The update rule must reduce to standard Bayesian conditionalization in this limit: P_new(H) = P_old(H | E).
      *   **Non-Negotiable:** Widely considered essential for coherence with the standard framework.
      *   **Conflict Potential:** Rules violating this (e.g., some radical departure proposals) are generally rejected.

  3.  **Non-Dogmatism (Zero to Non-Zero)**
      *   **Motivation:** Cases where the evidence report bears on a hypothesis previously assigned probability zero (e.g., the monitor reports a radon level in a range you thought impossible, or a new instrument categorizes a sample into a novel type). The rule must allow P_new(H) > 0 even if P_old(H) = 0, provided the evidence *could* support H.
      *   **Non-Negotiable:** Generally yes. Essential for learning genuinely new possibilities. Rules like strict conditionalization fail this.
      *   **Computational Note:** Requires a mechanism beyond simple ratio-based conditioning.

  4.  **Conglomerability / Partition Invariance (New Categories)**
      *   **Motivation:** The "new instrument sorting samples" case. The update shouldn't depend on *how* the evidence carves up the hypothesis space. The final belief state over any common coarsening should be identical regardless of the initial partition used by the evidence report. (e.g., Updating on "70% chance it's Type A" vs. updating on a finer partition {A1, A2, B} and then marginalizing to {A, B} should yield the same P(A) if the evidence constrains A the same way).
      *   **Non-Negotiable:** Contentious. Many find it highly desirable for objectivity/robustness. Others argue the partition *is* part of the evidence. Jeffrey Conditionalization fails this; Field's rule satisfies it.
      *   **Conflict Potential:** Often conflicts directly with Commutativity (see below) in practical implementations. Strongly desired by those wanting evidence to constrain beliefs directly, not via arbitrary partitioning.

  5.  **Commutativity (Order Independence)**
      *   **Motivation:** The "two independent monitors reporting simultaneously" case. If the agent receives multiple pieces of uncertain evidence *about the same underlying facts* in quick succession (or theoretically simultaneously), the final belief state should be the same regardless of the order of processing. (Crucially: *only* if the evidence is about the same thing and not self-undermining).
      *   **Non-Negotiable:** Primarily a preference/taste. Highly desirable for computational simplicity and avoiding path-dependence arbitrariness. However, some argue order *can* be meaningful if evidence pertains to different aspects or involves self-reference. Jeffrey Conditionalization generally fails this for distinct partitions; rules designed for commutativity (like Field's or certain "decorated" Jeffrey variants) exist.
      *   **Conflict Potential:** Directly conflicts with Partition Invariance in many standard frameworks (Jeffrey). Satisfying both simultaneously is difficult and often requires specific, more complex rules.

  6.  **Calibration Awareness (Handling Uncertain Reliability)**
      *   **Motivation:** The air monitor case with unknown recalibration status. The rule should allow the agent to integrate their *meta-uncertainty* about the reliability or meaning of the evidence source itself. The input probability (e.g., "72%") is not necessarily taken at face value; it's mediated by the agent's model of the source.
      *   **Non-Negotiable:** Pragmatically essential for real-world applications. Philosophically, some argue this reduces to conditionalization on the coarse fact "the display said 72%" plus background knowledge (see Granularity below). Others argue uncertain evidence requires a distinct mechanism.
      *   **Computational Note:** Implementing this robustly *without* reducing to coarse-graining can be complex (e.g., modeling the evidence-generating process).

  7.  **Reflexivity (Self-Referential Reports)**
      *   **Motivation:** Reports about the agent's own future credences (e.g., "I know I'll look and become 70% confident tomorrow"). The rule should allow updating on such information without paradox (e.g., via reflection principles), integrating it coherently with the agent's current beliefs and model of their future rationality.
      *   **Non-Negotiable:** Likely a preference. Crucial for modeling certain learning scenarios and deference principles, but arguably a specialized case. Often handled via extensions (like the Reflection Principle) rather than the core update rule itself.
      *   **Computational Note:** Can introduce significant complexity (modeling future selves).

  8.  **Finite Auto-Update (Streaming Feasibility)**
      *   **Motivation:** The "simple agent receiving a stream" requirement. The rule must be implementable by an agent with finite memory and computational resources processing a potentially endless sequence of reports. It shouldn't require storing the entire history of past updates or evidence partitions in raw form.
      *   **Non-Negotiable:** Critical for your "runnable" constraint. Rules requiring access to the *entire initial partition structure* for every past update (like needing the original `Q` function for Jeffrey) fail this. Rules where the posterior *is* sufficient for the next prior (like conditionalization) satisfy it.
      *   **Conflict Potential:** Rules satisfying Partition Invariance (like Field's) often require carrying forward complex representations of the *constraints* imposed by past evidence, which can become computationally burdensome or require infinite memory for long streams.

  9.  **Evidential Granularity (Uncertain vs. Coarse?)**
      *   **Motivation:** The core philosophical question: Is updating on "the monitor displayed '72%'" (a certain, coarse-grained observation) *sufficient* to model all cases, or is there something irreducible about updating directly on the probability? The desideratum is that the theory clarifies its stance: either (a) Defend that coarse-graining *is* sufficient (motivated by air monitor calibration uncertainty), or (b) Provide a principled reason why direct probabilistic input is necessary (motivated by the immediacy of the dim-light experience).
      *   **Non-Negotiable:** Foundational Preference. This choice heavily influences the entire approach. Camp (a) sees no *need* for special rules besides conditionalization. Camp (b) seeks rules like Jeffrey's or more radical departures.

  ### Key Conflicts & The Most Restrictive Requirement

  *   **Primary Conflict Triad:** **Partition Invariance (D4)** vs. **Commutativity (D5)** vs. **Finite Auto-Update (D8)**.
      *   **Reason:** Rules achieving Partition Invariance (D4) often do so by encoding the evidence as constraints, making Commutativity (D5) easier but potentially violating Finite Auto-Update (D8) as the constraint set grows. Rules like Jeffrey's achieve Finite Auto-Update (D8) and can be made commutative (D5) for sequential updates on the *same* partition, but fundamentally violate Partition Invariance (D4). Achieving all three simultaneously is very challenging for non-trivial cases.
  *   **The Most Restrictive Requirement:** **Partition Invariance (D4)**.
      *   **Reason:** This requirement forces the update rule to be insensitive to the *structure* of the evidence partition, demanding a much more abstract representation of the evidence's *informational content* (e.g., as constraints on probabilities). This directly rules out Jeffrey Conditionalization and similar partition-dependent rules as fundamental solutions. It pushes towards more complex rule formulations (like Field's) or foundational arguments against its necessity (the Granularity stance D9-a). It's the requirement that most dramatically shapes the landscape of viable theories.

  ### Notes on Your Cases

  *   **Dim-Light Fabric:** Motivates D1 (Prob Input) and D9-b (direct probability needed).
  *   **Air Monitor (Calibration):** Motivates D6 (Calibration), D9 (Granularity debate), D1 (Prob Input).
  *   **Two Monitors Simultaneous:** Motivates D5 (Commutativity).
  *   **New Instrument Category:** Motivates D3 (Non-Dogmatism), D4 (Partition Invariance).
  *   **Probability Zero Update:** Covered by D3 (Non-Dogmatism).
  *   **Certainty Limit:** Covered by D2 (Classical Limit).
  *   **Future Credence Report:** Covered by D7 (Reflexivity).
  *   **Uncertain Evidence vs. Coarse Observation:** Covered by D9 (Granularity).

  This checklist provides the necessary framework to rigorously evaluate Jeffrey Conditionalization, Field's rule, Dempster-Shafer, Leitgeb & Pettigrew's rules, Douven & Romeijn's approach, and others against the core challenges of updating on uncertain evidence, with a clear focus on implementability and the tensions inherent in the problem. Good luck with the framing paper!
