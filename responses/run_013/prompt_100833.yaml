answer: |-
  ## Joint Statement on Persistence: Endurantist-Perduantist Adversarial Collaboration

  **Agreed Foundational Claims:**

  1.  **Persistence Happens:** Objects (at least some) persist through time; they are not instantaneous entities.
  2.  **Numerical Identity Over Time:** Persistence involves the *numerical identity* of an object existing at different times. The object existing at t1 is the *same single entity* as the object existing at t2 (where t1 ≠ t2), not merely a qualitatively similar counterpart.
  3.  **Change is Real:** Persisting objects genuinely undergo intrinsic change (e.g., shape, location, properties) over time.
  4.  **The World is the Arbiter:** Disagreements must ultimately be adjudicated by appeal to how the world is structured, particularly concerning facts about composition, location, identity, and parthood.
  5.  **The Data:** Any successful theory of persistence must accommodate and explain the following uncontroversial *data*:
      *   Ordinary objects (tables, chairs, organisms) seem to persist through gradual changes (e.g., a tree growing, a car moving).
      *   Objects can gain and lose parts over time (e.g., a ship undergoing repairs).
      *   Objects can survive temporary spatial discontinuities (e.g., a car being parked overnight, a person sleeping).
      *   The *prima facie* intuition that we are single entities wholly existing *now*, yet existing at other times too.
  6.  **The Challenge Cases are Genuinely Puzzling:** Cases like the dismantled-and-reassembled machine and the time-traveling person are not merely contrived nonsense. They reveal genuine tensions within our concepts of persistence, identity, and parthood that any theory must confront. Neither side gets to dismiss them *a priori*.
  7.  **"Merely Verbal" is a Charge, Not an Assumption:** While either side *might* suspect parts of the debate are verbal, neither side gets to *assume* this at the outset. The burden is on the accuser to demonstrate it. Crucially:
      *   The disagreement over the meaning and coherence of "wholly present" is **not merely verbal**. Endurantists claim it describes a fundamental mode of existence; Perdurantists claim it is incoherent or misapplied to persistence.
      *   The disagreement over whether tensed predication (e.g., "The machine *is* broken") requires an entity wholly present at the time of utterance **is potentially a crux**, not merely verbal. It depends on how one analyzes temporal qualification and property instantiation.
      *   The fundamental question of *what exists* at a time (a temporally extended whole or a momentary entity?) is **substantive**.

  **Disagreements & Cruxes:**

  | Crux                                                                 | Neutral Statement of Disagreement                                                                                                | Endurantist Position (Preferred Wording)                                                                                                 | Perdurantist Position (Preferred Wording)                                                                                                                                 | Endurantist Prediction for Crucial Cases                                                                 | Perdurantist Prediction for Crucial Cases                                                                                                |
  | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- |
  | **Mode of Persistence & Parthood**                                   | What is the fundamental structure of a persisting object?                                                                        | **An enduring object is wholly present at every moment it exists; it is strictly identical across time and has no temporal parts.**       | **A perduring object is a four-dimensional spacetime worm; it is extended in time and has distinct temporal parts at different times.**                                    |                                                                                                          |                                                                                                                                          |
  | **Existence at a Time**                                              | What does it mean for an object to exist "at" a time?                                                                            | **To exist at a time t is for the entire object to be located at t; the object is wholly present within the spatial boundaries of t.** | **To exist at a time t is for the object to have a temporal part (a time-slice or stage) that is located exactly at t.**                                                  |                                                                                                          |                                                                                                                                          |
  | **Identity Across Time**                                             | How is the identity of an object at t1 with the object at t2 secured?                                                            | **The identity is primitive or grounded in immanent causation/spatiotemporal continuity of the *whole* object.**                         | **The identity is grounded in the genidentity relation (e.g., spatiotemporal continuity, causal dependence) between the temporal part at t1 and the temporal part at t2.** |                                                                                                          |                                                                                                                                          |
  | **Crux 1: Dismantled & Reassembled Machine**                         | Is the reassembled machine numerically identical to the original machine?                                                        | **Yes, provided the causal history is continuous and it's the same parts/config restored. Survival doesn't require continuous occupation of space.** | **No. The machine ceased to exist upon dismantling. The reassembled machine is a distinct object, a replica. Persistence requires *maximal* spatiotemporal continuity.** | **Prediction:** Observers *correctly* identify it as the *same* machine back in operation.                | **Prediction:** Observers are *mistaken*; it's a new machine composed of the original parts. The original ceased to exist when dismantled.** |
  | **Crux 2: Time-Traveling Self (Past & Future Co-Present)**           | Are the past self (P) and future self (F), coexisting in the same room, numerically distinct objects?                            | **No. P and F are numerically identical; they are the *whole* person existing at two different times, manifested simultaneously due to time travel.** | **Yes. P is the temporal part of the person-worm at time t1, F is a distinct temporal part of the *same* person-worm from time t2 (t2>t1). They are distinct stages.**    | **Prediction:** P and F correctly recognize each other as *themselves*, despite being co-present.**      | **Prediction:** P and F correctly recognize each other as distinct temporal stages of the *same* person-worm.**                           |
  | **Crux 3: Analysis of Tensed Predication ("The machine *is* broken")** | What entity instantiates the property "being broken" at the time of utterance?                                                   | **The enduring machine itself instantiates the property *simpliciter* at the time it is broken.**                                        | **The temporal part (stage) of the machine-worm located at the time of utterance instantiates the property "being broken".**                                              | **Prediction:** "The machine is broken" directly attributes a property to the persisting whole *at that time*. | **Prediction:** "The machine is broken" is implicitly temporally qualified, attributing the property to its *current temporal part*.**    |
  | **Crux 4: Composition & Existence**                                  | Under what conditions do temporal parts compose a persisting whole?                                                              | **Temporal parts do not exist; objects are not composed of temporal parts. Composition is synchronic (spatial parts at a time).**         | **Objects are composed of temporal parts whenever those parts are suitably causally/spatiotemporally interrelated (genidentity).**                                        | **Prediction:** The question is ill-formed; there are no temporal parts to compose anything.             | **Prediction:** Composition occurs automatically given genidentity; persistence *is* having temporal parts appropriately related.**       |

  **Regarding Stage Theory:** Stage Theory lurks as a distinct third position. It agrees with Perdurantism that the primary entities existing at a time are instantaneous stages (time-slices). However, it *denies* that these stages are parts of a larger four-dimensional worm. Instead, it holds that we *talk about* persisting objects by referring to stages and employing a counterpart relation (or similar) to connect stages at different times. For our cases:
  *   **Dismantled Machine:** The reassembled machine-stage is a counterpart of the original pre-dismantling stage, but they are distinct stages. The original stage no longer exists.
  *   **Time-Travel:** P and F are distinct stages. They are counterparts of each other (in a special time-travel context), but not parts of the same worm. Stage Theory avoids the perdurantist's commitment to extended worms but shares the perdurantist's answers to the identity questions in the crucial cases (No and Yes, respectively). It offers a different semantic analysis of persistence talk.

  \answer{Crux 1: Dismantled & Reassembled Machine}
