  ### Planning Note  
  *Legal Moralist (LM)*: Strongest case: Law exists partly to express and sustain the community’s constitutive moral commitments; failing to prohibit deeply immoral acts erodes social cohesion and normalizes degradation, harming society’s moral fabric. Key objections to Harm Principle (HP): 1) HP cannot explain why we criminalize victimless "wrongs" like bestiality or desecration of corpses. 2) HP’s narrow "harm" ignores intangible but real injuries to shared ethical environment.  
  *Harm Principle Advocate (HP)*: Strongest case: Criminal law’s coercive power is only justified to prevent tangible, non-consensual harm to others; moral disgust is arbitrary, risks tyranny, and stifles autonomy. Key objections to LM: 1) "Shared morality" is often contested or oppressive minority views. 2) Criminalizing private immorality wastes resources and breeds resentment without clear social benefit.  

  ---

  **Dialogue: The Committee Hearing on the "Autocannibalism" Bill**  

  **HP Advocate (Alex)**: Thank you, Chair. I oppose this bill because it violates a foundational limit: criminal law exists to prevent harm to others. Here, consenting adults use their own biological material in private. No one is defrauded, assaulted, or deprived of property. The state has no business policing private acts merely because they revolt the majority. If disgust alone justifies prison, what protects minority practices tomorrow?  

  **Legal Moralist (Ben)**: Alex, you reduce "harm" to physical or economic injury. But societies aren’t just aggregates of individuals; they’re held together by shared moral understandings. This act—cultivating and consuming one’s own flesh—treats human life as mere raw material. It degrades the symbolic value of the human body that underpins norms against mutilation or commodification. If such acts become normalized, it corrodes the respect for human dignity that prevents tangible harms like non-consensual exploitation.  

  **Alex**: Two problems, Ben. First, your "symbolic harm" is unmeasurable and circular. How do we prove this act weakens respect for dignity elsewhere? Second, whose "shared morality" counts? Polls show deep division on issues like assisted dying or ritual practices. If 51% find something degrading today, but 49% don’t, is that "shared" enough to jail people?  

  **Ben**: Fair questions. The morality I invoke isn’t mere majority preference. It’s the deep, socially constitutive norms that make mutual recognition and trust possible—like prohibitions on incest or necrophilia, which we criminalize without demanding proof of individual harm. As for shifting morals: the law should reflect settled ethical convictions essential to social identity. When consensus frays, criminalization may be unwise, but here the revulsion is near-universal and tied to core ideas of bodily integrity.  

  **Alex**: But you haven’t defined "essential." Take a *hypothetical*: consenting adults privately stage gladiatorial fights with safety gear, causing no lasting injury. Many would find it barbaric, degrading human life to spectacle. By your logic, we could ban it. Yet where’s the victim? Your "symbolic harm" risks punishing thought-crimes—disapproving of how someone finds meaning.  

  **Ben**: The gladiator case tests my view, I grant. But degradation isn’t just in the mind; it’s relational. It treats persons as instruments of gratification, eroding the norms restraining violence. As for "victimless" wrongs: why do we criminalize torturing animals? Not because animals have legal rights, but because it displays a cruelty that corrupts our moral environment and risks spilling over to humans. Similarly, this act treats human tissue as disposable matter—a dangerous precedent.  

  **Alex**: Ah! Now we hit the crux. You equate "corrupting the moral environment" with harm. But that stretches "harm" beyond recognition. If I burn a flag in my basement, some feel it degrades national values. Is that criminal? Your standard swallows the harm principle whole. True, animal cruelty laws *are* hard for strict HP—but we might ground them in preventing desensitization to violence against humans, or in protecting sentient beings from suffering. Neither applies here. No sentient being suffers; no violence is modeled.  

  **Ben**: Desensitization *is* the harm—a collective, diffuse injury to the ethical climate. If we accept that cruelty to animals risks normalizing brutality toward humans, why not see this as normalizing self-instrumentalization? As for shifting morals: law plays a role in *shaping* moral consensus, not just following it. Decriminalizing homosexuality reflected evolving moral truth; banning this act upholds enduring truths about human dignity.  

  **Alex**: "Moral truth"? Now you’ve shifted from social cohesion to objective morality. Which is it? If it’s objective, why tie it to social survival? If it’s about cohesion, why not defer to cultural subgroups? A *hypothetical*: suppose a small community believes ritual self-cannibalism honors ancestors. Their "shared morality" permits it. Does your principle force them to comply with the majority’s disgust?  

  **Ben**: Moral truth and social cohesion intertwine. Some norms—like prohibitions on murder—are both objectively true and socially essential. Here, the act’s degradation of bodily integrity strikes at a universal precondition for human flourishing. Even if a subgroup dissents, the state may uphold minimal standards necessary for a common moral horizon.  

  **Alex**: "Minimal standards" decided by whom? Your appeal to "universal flourishing" masks imposition. The harm principle, imperfect as it is, offers clearer boundaries: no jail without identifiable, non-consensual injury. Your approach licenses punishing eccentricity. We *can* explain animal cruelty bans through secondary harms or sentience. But this? It’s policing profound but private disgust. That’s a path to the Thought Police.  

  **Ben**: And your principle, Alex, risks disarming society against creeping normalization of the unthinkable. If harm requires direct, proximate injury to a named victim, why ban consensual duels? Or selling oneself into slavery? Both express autonomy but undermine the dignity framework that protects us all.  

  **Alex**: Consensual duels risk death or public disorder; slavery contracts create power imbalances exploitable by third parties. We ban them to prevent tangible harms or coercion. Here? No coercion, no imbalance, no risk to bystanders. Only symbolic offense. We must tolerate the morally startling to preserve freedom.  

  ---  
  **Closing Statements**  

  **Alex**: The crux is this: Ben sees law as guardian of a shared moral ecology essential for social survival. I see that view as opening the door to punishing private vice based on amorphous "degradation." I concede that "harm" includes psychological and indirect injuries (e.g., desensitization to violence), but it must be grounded in observable impacts on identifiable interests—not mere moral symbolism.  

  **Ben**: The crux is whether criminal law may protect the preconditions for a moral community, not just individual welfare. Alex concedes certain victimless acts (like animal cruelty) may warrant prohibition due to secondary harms, but insists on a direct causal link to tangible injury. I concede social division or evolving morals complicate enforcement—but maintain that without legal affirmation of core norms, society risks disintegration into moral cacophony.  

  *(Word count: 1,130)*
