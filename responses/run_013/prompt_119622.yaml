prompt: |-
  I am trying to decide whether predictive processing deserves to be treated as a substantive scientific theory, and I want the requirements list in hand before I assess any particular model. Set out what any adequate predictive-processing account of perception, action, and psychopathology has to deliver: the phenomena it must explain, the cases it must get right, the distinctions it must not collapse, and the constraints it must respect from the rest of the science, with the consideration behind each requirement, and mark which are genuine demands and which are merely the commitments of one camp. Four points I want handled with care. For any given system, the theory must say what its generative model is a model of, and why that model rather than another would be selected. It must explain how a system that minimizes prediction error can nonetheless seek out the situations that maximize it — novelty, pain, deliberately broken routines. It must say what observation would count against it, and I suspect that on the standard formulation nothing could, so tell me whether that charge lands and what the theory would have to add to escape it. And it must do all this for a bacterium as readily as for a person, if it is meant to be general. Take seriously throughout the possibility that the claim that the brain minimizes prediction error is a redescription of any system's behavior rather than a claim about one. If some of your requirements cannot be met together, say so plainly; that is the result I most want. Write it as continuous prose, with no headings, lists, bold text, or tables.
reasoning: |-
  Hmm, the user wants a rigorous framework to evaluate predictive processing (PP) as a substantive scientific theory. They're clearly deeply engaged—this reads like a philosopher or cognitive scientist preparing for a critical analysis. Their four specific pain points suggest they've already spotted potential cracks in PP's armor: vagueness about generative models, the paradox of novelty-seeking, falsifiability issues, and scalability from bacteria to humans. They're also wary of PP being merely a redescription trick. Smart concerns.

  First, I need to structure this as continuous prose despite the complexity. Their emphasis on "genuine demands" vs. "camp commitments" means I must separate what PP objectively owes science from what's optional within its paradigm. The bacteria-to-human point implies they suspect PP overreaches—I should address universality claims head-on.

  For generative models: PP must specify what's being modeled (external states? sensorimotor contingencies?) and why that particular model exists (evolution? learning?). Avoiding circularity here is crucial. The novelty paradox is thornier—if prediction error minimization (PEM) drives everything, why pursue pain? PP needs mechanisms like meta-predictions about learning value or precision-weighting for curiosity. 

  Falsifiability is the knife-edge. If PEM is always retrofitted, it's not science. I'll argue PP escapes only by committing to testable implementations, like specifying fixed priors or biological constraints. The bacterium test might break PP: without neurons, "prediction" feels metaphorical. I'll concede that PP might only scale to nervous systems.

  Core demands: PP must explain key phenomena (perception-action loops, psychopathology patterns) without blurring distinctions (e.g., mistaking hallucinations for beliefs). It must respect neuroscience (neural architecture) and avoid trivialization—if any system can be "PEM-ish," PP explains nothing. 

  I suspect their deepest wish is confirmation that PP's demands conflict. I'll show how universality clashes with falsifiability: a theory explaining bacteria to brains risks explaining nothing precisely. The prose must flow, but I'll mentally tag requirements as I write: *explanation targets*, *constraints*, *pitfalls*.
answer: |-
  To assess whether predictive processing warrants status as a substantive scientific theory, rather than merely a compelling metaphor or framework, requires laying bare the non-negotiable demands it must fulfill across its core domains—perception, action, and psychopathology. These demands stem from the need for explanatory depth, empirical grounding, and theoretical coherence, distinct from internal commitments of its proponents. Any adequate account must first deliver comprehensive explanations of fundamental phenomena. In perception, it must account not just for standard cases of inferring distal causes from noisy input, but crucially for perceptual illusions, bistable perception (like the Necker cube), and the profound effects of prior expectations (e.g., hearing speech in noise based on context). For action, the theory cannot merely redescribe purposive movement; it must explain how actions are initiated *as* predictions of sensory consequences, resolve the credit assignment problem in motor learning, and crucially, handle cases of *exploration* and deliberate skill acquisition where known outcomes are not the immediate goal. In psychopathology, it must offer more than analogies; it must mechanistically explain specific patterns in conditions like schizophrenia (e.g., aberrant salience, delusions as false priors, hallucinations as uncontrolled top-down dominance), depression (e.g., chronic negative predictions resistant to updating), and anxiety disorders (e.g., hyper-precise weighting of threat predictions), while respecting the distinct clinical profiles and neural correlates of each. Collapsing distinctions between perception and hallucination, belief and delusion, or adaptive anxiety and pathological disorder, would be fatal.

  Respecting constraints from the broader scientific landscape is not optional but a genuine demand. The theory must cohere with established neurobiology: the proposed mechanisms (e.g., hierarchical message passing, precision weighting) must map plausibly onto known neural architectures, connectivity, and dynamics (e.g., cortical hierarchies, neuromodulatory systems). It must be compatible with developmental psychology, explaining how generative models are acquired and refined throughout ontogeny, not presupposed. Crucially, it must avoid collapsing into unfalsifiable vacuity. The charge that "minimizing prediction error" might simply redescribe *any* system's adaptive behavior must be taken seriously. An adequate theory must therefore specify what observation would definitively count against it. If *any* observed behavior, no matter how seemingly prediction-error *increasing* (like seeking novelty), can be retrofitted as minimizing error in some broader, hidden sense (e.g., minimizing expected *future* error, or error about the *value* of error), then the core claim risks being empirically empty. To escape this, the theory needs concrete, pre-specified commitments: it must identify fixed, biologically grounded priors or learning rules, define the specific timescales and levels of the hierarchy at which error minimization is claimed to operate, or provide independent criteria for the structure and content of generative models, making specific predictions that could fail.

  This leads directly to your four critical points. First, for any system, the theory *must* specify what the generative model is a model *of* – is it the statistical structure of the sensory world, the body's dynamics, affordances for action, or some combination? More importantly, it must provide a non-circular account of *why* that specific model structure exists (e.g., shaped by evolution for ecological niche, refined by associative learning under specific constraints) and why it isn't arbitrarily different. Simply stating "it minimizes error" is insufficient; the origins and constraints on model space are genuine demands. Second, the paradox of novelty and pain-seeking is a core test. Minimizing immediate prediction error cannot explain why organisms seek unpredictable situations or endure predictable pain. The theory must provide a clear mechanism: perhaps through meta-predictions about the *long-term value* of prediction error for learning or exploration (e.g., expected free energy minimization), or by incorporating drives that modulate precision, making certain errors intrinsically motivating. Without this, the theory fails a basic aspect of behavior – this is a genuine demand. Third, falsifiability, as discussed, is paramount. The "standard formulation" is indeed vulnerable; escaping the charge requires the additions above – concrete, testable constraints on model form, priors, or error minimization mechanisms. Finally, the demand for equal applicability to bacteria and humans is where the theory faces its greatest tension. While proponents often claim universality, this risks collapsing into trivial redescription. A bacterium lacks neurons, let alone hierarchical cortical structures for generative models. Applying PP here requires stretching "prediction" to potentially mean simple homeostatic error correction, which is arguably just control theory. A substantive theory *might* scale down only if it can specify a minimal, non-trivial implementation of generative modeling and prediction error minimization within prokaryotic biochemistry – a formidable, likely unmet, genuine demand. Scaling *up* robustly is challenging enough.

  The possibility that prediction error minimization is merely a redescription hangs over all this. A substantive theory must show that positing a generative model and PEM process offers unique, testable, mechanistic explanations unavailable to simpler accounts (like direct perception or reflex arcs), and that these mechanisms are implemented in the system. If PP can only ever provide a *post hoc* interpretation of any outcome, it fails as science. Ultimately, several demands conflict, particularly universality and substantive falsifiability. A theory claiming to explain everything from bacterial chemotaxis to human schizophrenia with the same core principle risks explaining nothing in a testable, specific way. To be substantive, PP likely needs to narrow its claims, accept boundary conditions (e.g., applying primarily to nervous systems of sufficient complexity), embed its mechanisms firmly within known biology, and define precise, falsifiable signatures of its specific operations. Without this, it remains a powerful, evocative framework, but not yet a mature scientific theory capable of bearing the full explanatory weight demanded of one. The result you seek – identifying conflicting requirements – emerges most starkly here: the aspiration for universal, fundamental explanation clashes directly with the need for concrete, falsifiable, and biologically grounded mechanisms. Reconciling this is the theory's paramount challenge.
