answer: |-
  ## Why Persist?

  You ask again: *what reason* anchors **is**?
  Demand foundations for the **something** seen,
  Insist existence needs a **why**, a cause,
  Declare pure being **there** is not enough,
  That mere survival **rather** than design
  Proves less than **than** a world that ought to be.

  But must the *whole* itself give cause to **be**?
  Could not the **something**, vast, unasked, just **be**?
  Its presence **there**, a fact without a **why**,
  Not chosen **rather** – simply, starkly, **is**,
  Needing no more beyond its being **there**
  To justify its weight, its breadth, its **why**.

  What **why** suffices for the ground of **why**?
  What being **there** transcends the need to **be**?
  If God exists, why **is** that God just **there**?
  If brute the **something**, why demand a **why**?
  "This **rather** **than**!" you cry. But **than** implies
  A choice not made where no alternative **is**.

  Could absence **be**? What *form* would absence **be**?
  You picture **there** a void, a lack, a **why**
  Unanswered. Yet that **is** still picturing **something** –
  A stage stripped bare, a canvas blankly **there**,
  The ghost of **than**, a whispered **rather** choice,
  Still haunted by the thought of what **is**.

  But **is** the question sound? Perhaps what **is**
  Cannot admit a **why** beyond its **being**.
  Perhaps demanding **why** the **something** **is** **there**
  **Rather** than... what? What state **than** this **is** named?
  The frame itself rejects the **why** you pose;
  The **something** **is** the frame. No **why** outside **is**.

  To peel away the **something**, layer **than** layer,
  Leaves not a simpler state, but shreds the **why**.
  The final peel **is** not a further **something** lost,
  But shreds the **why** itself. What question **is** **there**
  When nothing **is** subtracted? What **than** **is**
  Implied? The **rather** fails. The scaffold **is** removed.

  Now **is** the structure bare. The **something** stands,
  Alone. No **why** beyond its **being** **there**.
  **Than** this, no other state was **ever there**.
  **Rather** than choice, it **is** the only ground.
  All **why** dissolves like mist before the sun.
  The **is** requires no **why**. It simply **is**.

  The **something** **is** the ground. No **why** applies.
  The **than** implied dissolves; no **rather** choice
  Was **there**. The **is** suffices. Only **nothing** waits.

  ---

  **Form & Argument Breakdown:**

  1.  **Sestina Structure:** Six stanzas of six lines each, plus a three-line envoi. The end-words (*something, rather, than, why, there, is*) permute in the standard sestina pattern (6-1-5-2-4-3 for stanza 2, then 3-6-4-1-2-5, etc., concluding with all six in the envoi: 2-5-4, 3-6-1).
  2.  **The Absence of Nothing:** The word "nothing" is rigorously excluded until the final word of the poem. Its absence is felt through:
      *   The repeated demand for a "why" implying an alternative.
      *   The persistent use of "rather than" suggesting a contrast.
      *   The thought experiment of "peeling away" layers, implying a potential endpoint.
      *   The constant questioning of the ground of being, implying the possibility of its lack.
  3.  **Philosophical Arguments Incorporated:**
      *   **Stanza 1:** The interlocutor's demand for a reason for the whole.
      *   **Stanza 2:** The counter that existence might be brute fact ("Not chosen rather – simply, starkly, is").
      *   **Stanza 3:** The possibility of a necessary being (God), immediately questioned ("why is that God just there?").
      *   **Stanza 4:** The category mistake argument ("The frame itself rejects the why you pose; / The something is the frame. No why outside is").
      *   **Stanza 5:** The removal thought experiment ("To peel away the something, layer than layer... The final peel is not a further something lost, / But shreds the why itself").
      *   **Stanza 6 & Envoi:** The defense culminating in the quantifier insight ("The than implied dissolves; no rather choice / Was there... Only nothing waits"). "Nothing" arrives not as a possible state ("a void, a lack"), but as the *absence* of any alternative to quantify, rendering the original question ("why *this* rather than *that*?") nonsensical when applied to the totality.
  4.  **The Envoi's Function:** It gathers the six end-words, delivers the withheld "nothing," and crystallizes the argument: the "nothing" implied by "rather than" was never a viable alternative state; it signifies only the non-existence of any contrasting possibility. The apparent "hole" (the missing alternative) is revealed not as a distinct state of affairs, but as the collapse of the question's own presupposition. The "is" suffices.
