answer: |-
  Here is a reconstruction of the implicit theory within modern retentionist capital punishment practice, followed by a verdict addressing its coherence:

  ### The Implicit Theory  
  The practice presupposes a **split ontology of the condemned person**:  
  1. **As a Moral Non-Person (for Retribution)**:  
     - The death penalty assumes the condemned has *forfeited their right to exist* through their crime.  
     - Retribution demands annihilation proportional to the crime’s gravity.  
  2. **As a Legal Person (for Procedure)**:  
     - The condemned retains *procedural personhood*: the right to due process, appeals, competence evaluations, and "dignified" treatment.  
     - The state must engage the condemned as a rational agent to legitimize its violence.  

  This duality creates a framework where **the state must perform retribution while disavowing barbarism**.  

  ### Answers to Specific Questions  
  **(a) Painless Death & Dignity**  
  - The painless, hidden execution is *not* a relic of the condemned’s moral standing but a **ritual of state civility**. It serves two functions:  
    1. To distinguish state killing from the criminal’s "undignified" violence (thus preserving the state’s moral authority).  
    2. To sanitize violence for public consumption—avoiding the spectacle of suffering that might provoke revulsion or dissent.  
  - **Contradiction**: Retribution demands the condemned’s degradation, yet dignity requirements contradict this. The state *needs* the condemned to appear "humanized" at death to avoid appearing monstrous. This exposes retribution as insincere: the state cannot own the brutality its logic implies.  

  **(b) Competence & Volunteering: Sovereignty or Illusion?**  
  - The competence requirement and volunteering option create a **fiction of sovereignty**. The state insists the condemned *understand* their punishment to:  
    1. Affirm the penalty’s legitimacy ("he knows why this is just").  
    2. Shift moral responsibility in volunteering cases ("it’s his choice").  
  - **Contradiction**: This pretends the condemned partners in their own extermination, transforming retribution into **state-assisted suicide**. But this is incoherent: if the condemned has forfeited their personhood (per retribution), they cannot "consent." If they retain sovereignty, the state is not punishing—it’s facilitating suicide. The practice cannot reconcile these.  

  **(c) Time, Waiting, and Premeditation**  
  - Camus’ "most premeditated of murders" is vindicated by the practice. The years on death row:  
    1. **Psychological Torture**: Forces the condemned to internalize their annihilation, making the state’s violence a prolonged mental ordeal.  
    2. **Bureaucratic Alibi**: The delays create an illusion of "due process," distancing the state from the immediacy of killing.  
  - This presupposes that **time is a tool of state power**. It is not incidental but essential to:  
    - Legitimize the penalty (through exhaustive procedure).  
    - Shift responsibility ("we gave every chance").  
    A "bare" retributive theory would demand swiftness; this ritualized waiting betrays the state’s need to mask retribution with process.  

  ---

  ### THE VERDICT  
  **On Presupposition vs. Contingency**  
  - **Strictly Presupposed**:  
    The condemned is a *split entity*—a moral nullity deserving death, yet a legal subject entitled to personhood rituals. The state *must* maintain this duality to avoid appearing tyrannical.  
  - **Merely Fits**:  
    Specific protocols (e.g., last meals, witness limits) are contingent; they could change without altering the core theory.  

  **The Core Commitment**  
  The single commitment doing the real work is **STATE LEGITIMACY**. The practice is designed to:  
  - Affirm the state’s monopoly on violence.  
  - Distance the state from the moral barbarism of killing.  
  - Transform retribution into a clinical, bureaucratic act.  

  **Coherence**  
  **The institution is fundamentally incoherent.** It claims to impose just retribution but cannot perform it openly. It disguises vengeance as:  
  - A **medical procedure** (lethal injection, "painless" death).  
  - A **legal sacrament** (competence hearings, volunteering).  
  - A **bureaucratic ritual** (appeals, scheduling).  

  This reveals a **fatal contradiction**: Retribution requires the degradation of the condemned, yet the state needs their personhood intact to sanitize the killing. The practice is not a working theory of justice but a **theater of state power**, where the condemned is both a disposable object and a coerced participant.  

  **Final Judgment**  
  **Guilty of bad faith.** The practice cannot reconcile its retributive justification with its rituals. It presupposes a theory it cannot fulfill: that the state can kill humanely, justly, and impersonally while demanding the condemned’s complicity. Camus was right—it is premeditated murder masked as procedure. The modern death penalty is not an expression of justice but a monument to the state’s inability to own the violence it enacts.  

  **Recommendation for Seminar**: Frame this as Camus’ challenge—capital punishment exposes the state’s moral evasion. The practice’s incoherence is not a flaw but a confession: the state knows killing is barbaric but lacks the courage to abolish it or the honesty to perform it openly.
