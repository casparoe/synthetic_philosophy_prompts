prompt: |-
  I'm a PhD student in environmental political theory, and in a seminar last week a colleague defended a strict no-net-depletion constraint on natural capital by appeal to the familiar trusteeship framing: the environment is held in trust for future generations, we are trustees rather than owners, and a trustee is bound to preserve the principal and live off the income alone. I would like this audited rather than argued at the level of intuitions. Give me the correspondence table first — settlor (the party who fixes the terms), trustee, beneficiary, corpus, income — and then say which slots have no honest occupant and what the metaphor quietly imports from trust law that the intergenerational case lacks. Then assess whether the features of trust law that do the real work survive transplantation to a case in which the trustees are also the current beneficiaries, the beneficiaries are unborn and unbounded in number, the corpus is not fungible and admits of thresholds and irreversibilities, and there is no settlor whose intent could settle what counts as principal rather than income: the bar on self-dealing, the duty of impartiality between those who take the income now and those who take the corpus later, enforceability in a court, and duration without limit — a perpetuity of the sort the common law declines to enforce. Separate the mismatches that are merely picturesque from those that carry the argument's weight, say whether the no-depletion conclusion can be rebuilt on the surviving parts, and if not, propose a better analogy for whatever structure you take to be doing the work. End with a final line of exactly this form: Verdict: <HOLDS | HOLDS-IN-PART | FAILS> — <no more than fifteen words>.
reasoning: |-
  Hmm, the user is a PhD student in environmental political theory who wants me to analyze the trusteeship metaphor used to argue for a no-net-depletion constraint on natural capital. They want me to audit this argument rather than debate intuitions. I need to break this down systematically.

  Looking at the trusteeship framing: it positions the environment as held in trust for future generations, with current humans as trustees who should preserve the principal (the corpus) and only use the income. The user wants me to map this to trust law concepts: settlor (who sets the terms), trustee (manager), beneficiary (recipient), corpus (principal assets), and income (derived benefits). Then I should identify where this metaphor breaks down in the intergenerational context.

  For correspondence:
  - Settlor: In environmental trust claims, this is usually "nature" or "previous generations," which isn't a legal entity that can set terms.
  - Trustee: Current generations - this matches.
  - Beneficiary: Future generations - matches conceptually, but they're unborn and infinite in number.
  - Corpus: Natural capital - but it's non-fungible and has thresholds, unlike typical trust assets.
  - Income: Ecosystem services - again, hard to separate cleanly from principal in environmental systems.

  Key mismatches:
  - No settlor means no defined intent for what counts as principal vs. income.
  - Trustees are also current beneficiaries, creating self-dealing issues.
  - Beneficiaries are unidentifiable and unlimited, violating trust law requirements.
  - The corpus isn't fungible and has irreversibilities.
  - No enforcement mechanism like courts.
  - Trusts can't legally be perpetual.

  The metaphor imports trust law elements like the bar on self-dealing and the duty of impartiality between beneficiaries, but these collapse when trustees are also beneficiaries. The perpetuity aspect also fails legally.

  I need to separate cosmetic mismatches from critical ones. The lack of settlor and the non-fungibility are critical because they undermine the core definitions. The self-dealing issue is central since trustees can't be impartial when they're consuming now.

  Can the no-depletion conclusion stand without the metaphor? Probably not, since the key mechanisms (principal preservation, impartiality) rely on features that don't translate. A better analogy might be a public trust doctrine or fiduciary duty to humanity, which better handles non-fungibility and collective responsibility.

  Final verdict: The argument fails because the trust metaphor's legal prerequisites don't map to intergenerational realities.
answer: |-
  Here is the structural audit of the environmental trusteeship metaphor, strictly analyzing its correspondence to trust law and intergenerational applicability:

  ### Correspondence Table & Mismatches
  | **Trust Law Concept** | **Environmental Claim** | **Honest Occupant?** | **Critical Mismatch** |
  |------------------------|--------------------------|------------------------|------------------------|
  | Settlor                | Nature / Past Generations | **NO** (No intentionality, no defined terms) | No settlor intent to fix "principal" vs. "income" boundaries. |
  | Trustee                | Current Generation       | **YES**                | Trustees are *also* current beneficiaries → invalidates impartiality. |
  | Beneficiary            | Future Generations       | **PARTIAL** (Conceptual yes, but legally incoherent) | Unborn, unbounded in number → no standing, no definable class. |
  | Corpus (Principal)     | Natural Capital          | **NO** (Non-fungible) | Thresholds/irreversibilities prevent "preservation"; no fungibility to trade assets. |
  | Income                 | Sustainable Yield        | **NO** (Non-separable) | Ecological "income" isn't discrete (e.g., pollination vs. extinction). |

  ### Metaphorical Imports from Trust Law
  The metaphor quietly imports:
  - **Bar on self-dealing**: Trustees cannot benefit at the expense of beneficiaries.
  - **Duty of impartiality**: Fairness between current (income) and future (corpus) beneficiaries.
  - **Enforceability**: Courts can compel compliance.
  - **Perpetuity**: Trusts endure indefinitely.

  ### Assessment of Transplanted Features
  - **Self-dealing bar**: **Fails transplantation**. Collapses because trustees *are* current beneficiaries consuming "income." No neutral arbiter exists to define exploitation.
  - **Duty of impartiality**: **Fails**. Unbounded beneficiary class (infinite future people) and non-fungible corpus make fair allocation impossible (e.g., climate tipping points harm distant futures disproportionately).
  - **Enforceability**: **Fails**. No court can bind unborn plaintiffs or define breaches across generations.
  - **Perpetuity**: **Fails**. Common law voids perpetual trusts (Rule Against Perpetuities) due to unenforceability and changing circumstances. Ecological "trust" demands perpetuity.

  ### Critical vs. Cosmetic Mismatches
  - **Picturesque**: Settlor absence (could be handwaved as "implicit").
  - **Weight-Carrying**: Self-dealing bar failure, non-fungibility, and beneficiary unboundedness. These dissolve the core duty to preserve "principal" since trustees define their own constraints while consuming.

  ### Can No-Depletion Be Rebuilt?
  **No.** The argument relies entirely on trust law’s rigid principal/income dichotomy and impartiality—both shattered by the co-identity of trustees/beneficiaries and non-fungibility. Without enforceable boundaries between "corpus" and "income," depletion constraints become arbitrary.

  ### Better Analogy
  **Public Trust Doctrine (PTD)**: 
  - **Structure**: Government holds resources (e.g., waterways) for public use, balancing current and future interests. 
  - **Advantages**: 
    - Acknowledges state as trustee with flexible duties (no rigid principal/income split).
    - Allows adaptive management of thresholds (e.g., defining "substantial impairment").
    - Incorporates intergenerational equity without requiring perpetuity enforcement.
  - **Limits**: Still struggles with global scale and non-fungibility but avoids trust law’s fatal self-dealing flaw.

  ### Final Verdict
  Verdict: **FAILS** — Trust law's impartiality and anti-self-dealing mechanisms collapse when trustees are beneficiaries.
