  - Specialization might lead to knowledge that is deep but not necessarily combined with other areas? However, (1) doesn't say knowledge must be combined with other subjects, only that it must be used, tested, or combined. Within a specialty, one can use, test, and combine ideas. So, no conflict.

  Pair (2) and (4):
  - (2) is about early immersion without application, and (4) is about deep specialization. 
  - The tension: deep specialization might require early immersion, but also requires that the knowledge is eventually used and tested. However, (2) is about the early stage and (4) about a longer-term process. They can coexist if the romance stock in a particular area leads to specialization. So, no genuine conflict.

