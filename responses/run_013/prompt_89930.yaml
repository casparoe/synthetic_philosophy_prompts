prompt: |-
  I'm putting together a proposal for our humanities curriculum and I've ended up with a set of commitments that I'm not sure hang together, so I want a consistency audit before I commit to them in writing. The package is roughly Whitehead-flavoured but with a couple of my own bits grafted on: (1) the real enemy in education is knowledge that just sits there -- ideas taken in but never used, tested, or combined with anything; (2) but a good curriculum has to give students an early stage of pure immersion and appetite, before any of it is asked to do work, and I've started calling that deliberately unassimilated material "romance stock"; (3) the divisions between school subjects are administrative conveniences, not joints in the world -- knowledge is one connected thing; (4) all the same, real depth only comes from specialising hard in one area for years, and a curriculum that never forces that produces dabblers; (5) the essence of education is religious -- I mean duty and reverence, not doctrine; (6) the only test of whether any of it worked is whether a student can carry an idea into a context we never taught them.

  Which of these actually pull against each other, which only look like they do, and how bad is each? I genuinely don't know where the trouble is and I'd rather hear it now than from the committee. Rank the genuine ones by severity, and for each tell me the cheapest way to fix it and what I lose by fixing it that way. Then tell me the single change that cleans up the most overall, even if it isn't the cheapest fix for any one pair.

  Give it back to me as a JSON object with these fields: "bottom_line" (a couple of sentences, the verdict up front); "tensions" (an array, one entry per pair you flag, each with "pair", "verdict" which is either "genuine" or "apparent", "severity" on a 1-5 scale, "why", "cheapest_fix", and "what_the_fix_costs"); "most_economical_single_revision"; and "residual_risk" for anything that stays unresolved even after the best fix. British English please, and don't pad it -- I'd rather have four entries I can act on than ten I have to sort through.
