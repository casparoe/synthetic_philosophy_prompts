  First, let's parse the friend's claims. He starts by defining epiphenomenalism as consciousness being a by-product with no causal power, like Huxley's steam whistle. That's accurate. Then he calls it a leftover of Cartesian dualism. Hmm, that's misleading. Epiphenomenalism is more of a reaction to dualism, not a continuation. Descartes thought the mind could affect the body, but epiphenomenalists deny that. So that part is incorrect.

  Next, he says Jackson defended it with Mary's room. Jackson did use that argument, but actually for property dualism, and later he rejected epiphenomenalism. So that's a mix-up. The self-refutation argument (paradox of phenomenal judgment) is a major criticism. The friend thinks it's airtight, but proponents have responses. They might say neural states cause both the experience and the report, so the report isn't about the experience itself. That's a key point the friend might be missing.

  Then there's Kim's exclusion argument. Kim does argue that mental properties are excluded if physical causes are sufficient. But Kim himself isn't an epiphenomenalist; he leans towards reduction. The friend says non-reductive physicalists are epiphenomenalists in disguise. That's an overstatement. Some adopt positions like emergentism or panpsychism to avoid epiphenomenalism. 

  The user suspects a strawman. The friend's summary oversimplifies by ignoring responses to objections and equating all non-reductive views with epiphenomenalism. The punchline might not hold because there are other options. I should list those alternatives briefly.

