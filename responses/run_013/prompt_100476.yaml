  I need to avoid the usual suspects like the cab problem or mammograms - those are too simplistic. This needs to be a non-repeatable event for an individual, in a real-world setting like healthcare or insurance. The key contrast is between a causal-ish class and a purely statistical one.

  Let me brainstorm some scenarios: 

  First, parole recidivism - an individual inmate with prior violence but good institutional behavior. Classes could be "violent offenders" (actuarial) vs "completers of cognitive behavioral therapy" (mechanistic). But the mechanistic class might not be clean enough.

  Second, cancer prognosis with conflicting biomarkers. Say a smoker with a specific genetic mutation. Classes could be "smokers" (actuarial) vs "BRCA1 carriers" (mechanistic). But the classes might overlap too much or not contrast sharply.

