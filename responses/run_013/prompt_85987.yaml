prompt: |-
  I am a PhD student working on the philosophy of self-binding commitments, and I keep returning to a puzzle that the legal and philosophical literature has not resolved for me. Consider a concrete case. A jurisdiction operates a centralized gambling self-exclusion scheme. A person who believes they have a gambling problem can register once, and from that moment every licensed operator in the jurisdiction must block them from opening or using an account; the registration cannot be undone for a fixed minimum period, often a year or more. Enforcement is not left to the registrant's willpower. Operators must run checks, and a registrant who manages to gamble anyway may be treated as trespassing, may have winnings confiscated, and may face other penalties. The scheme is justified in the language of protecting the vulnerable and supporting the person's own earlier choice, and it is often described as a way for a person to bind their future self.

  Now place beside it a second practice. Psychiatric advance directives allow a person, while competent, to specify what treatment they want or refuse if they later become incapacitated. In many jurisdictions, a competent refusal of treatment in such a directive is legally binding on clinicians even when the patient, in a later episode, pleads for the treatment. But a directive that requests admission or treatment is often not enforceable in the same way: a clinician cannot admit a patient who is currently refusing simply because the patient's earlier competent self asked for it, unless the current legal criteria for involuntary commitment, typically some version of danger to self or others, are independently met. The past self can bind the present self to refuse, but cannot bind the present self to accept.

  I want an essay that treats these two practices as a single object of analysis and asks what philosophical commitments they presuppose. Specifically:

  1. What theory of the person, or of the will, does each practice presuppose? Does it require a distinction between an authentic or higher-order self and a merely present or lower-order self, and if so, how is the authentic self identified without circularity? The gambling scheme seems to treat the registering self as authoritative over the gambling self. The psychiatric directive seems to treat the refusing self as authoritative over the requesting self, but only in one direction.

  2. Does the practice presuppose that the binding is a form of self-legislation, or is it better understood as the state or a third party enforcing a private contract against one of the parties? If the latter, what makes the contract valid when the enforcing party is not a neutral arbiter but the state, and when the breach is not a harm to a second party but a deviation from one's own plan?

  3. What theory of rationality or of time-slice neutrality does the practice need? Must it hold that preferences are ranked by their origin (calm versus aroused, competent versus incapacitated) rather than by their content? Does that commit it to a controversial view about which mental states count as authoritative, and can that view be stated without begging the question against the present self?

  4. Is the asymmetry between the two practices philosophically defensible, or is it an artifact of legal categories such as dangerousness, capacity, and the state's police power? If we tried to make the two practices consistent, which way should we go: make psychiatric requests enforceable, or make gambling registrations revocable on demand? What would each direction cost?

  I also want the essay to consider whether the same structure appears in constitutional precommitment, where a past supermajority binds a future majority through entrenchment clauses or rights that cannot be amended by ordinary legislation. Is the implicit theory of the self in individual Ulysses contracts the same as the implicit theory of the collective self in constitutional entrenchment, or does the analogy break down because a polity has no single will to be authentic or inauthentic? If the analogy holds, what does that imply about the legitimacy of entrenchment; if it fails, what does that imply about the individual case?

  I want the essay to reconstruct the implicit theory as charitably as possible, then to distinguish what each practice strictly requires from what it merely happens to fit. It should say where the practices are underdetermined, where several incompatible theories of the self would license the same institutional arrangement, and where they are genuinely committed. It should also consider whether the practices presuppose a contested view about the value of autonomy: for instance, whether autonomy is served by honoring a past choice or by honoring the present one, and whether that question can be answered without already assuming a theory of the self.

  The essay should reach a conclusion. It should not merely survey the possible positions; it should say which philosophical commitments the practices actually need, which are optional, and whether the asymmetry can be justified. I am not asking for a literature review or a reading list. I want the argument.
reasoning: |-
  Okay, the user is a PhD student in philosophy working on self-binding commitments. They've presented two concrete practices: gambling self-exclusion schemes and psychiatric advance directives. There's a clear asymmetry here—both involve binding future actions, but the binding only seems to work in one direction for psychiatric directives (refusal but not request). The user wants an essay analyzing the philosophical commitments underlying both practices, answering four specific questions about theories of the person, self-legislation vs. contract, rationality, and the asymmetry between the practices. They also want this extended to constitutional precommitment.

  Hmm, this is a sophisticated philosophical puzzle. The user is clearly deep into their research and has noticed something important about how these systems treat the "self" differently. The core tension is between respecting present autonomy versus honoring past rational choices. I should avoid just summarizing literature since they explicitly want original argumentation. They're likely frustrated that existing scholarship hasn't resolved this asymmetry satisfactorily. 

  The gambling case treats the registering self as sovereign over the future gambling self, while psychiatry lets the past self veto treatment but not compel it. Why? Is it about third-party harm? Dangerousness? Or something deeper about the nature of will? The constitutional analogy adds another layer—does "we the people" have a unified will like an individual? 

  I need to reconstruct the implicit theories charitably. For the person theory: both practices distinguish temporal selves hierarchically, but psychiatry adds a competence condition that gambling doesn't require. That's crucial. The gambling scheme assumes the registering self is "authentic" by default, while psychiatry needs proof of competence because mental illness clouds judgment. 

  On self-legislation vs. contract: interestingly, both involve state enforcement, but the justification differs. Gambling exclusion is framed as protective (state interest in preventing harm), while psychiatric refusal is about bodily autonomy. That explains the asymmetry—the state won't enforce positive claims on oneself because it looks like coercion. 

  Time-slice neutrality is where it gets thorny. Both practices reject it by privileging certain mental states (calm/competent over impulsive/ill). But this requires a contested hierarchy of preferences. I should argue that psychiatry's higher burden makes sense because competence isn't assumed, unlike in gambling where we don't question the registrant's sanity. 

  The asymmetry? Defensible but messy. Making psychiatric requests enforceable would be dystopian (state forcing treatment because past-you asked). Making gambling revocable defeats its purpose. So we tolerate inconsistency because the alternatives are worse. 

  Constitutional precommitment is different—it's about collective identity over time, not individual will. The "people" is a constructed entity, so entrenchment binds future majorities by definition. If the analogy held strictly, constitutional amendments would be impossible, which is absurd. 

  Conclusion: The practices share a core commitment to temporal pluralism about the self but diverge on enforceability due to context—harm prevention in gambling, bodily integrity in psychiatry. Neither presupposes a single "true" self; they're pragmatic tools managing conflicting interests. The asymmetry survives because coherence matters less than avoiding worse outcomes.
answer: |-
  ## The Divided Sovereign: Self-Binding, Asymmetry, and the Temporal Self in Law

  The gambling self-exclusion registry and the psychiatric advance directive present a striking philosophical diptych. Both are institutionalized forms of Ulysses contracts, enabling individuals to bind their future actions. Yet, their asymmetry – the irrevocable enforcement of gambling exclusion versus the one-way binding (only refusals) in psychiatric directives – reveals deep tensions in our conceptions of the self, autonomy, and the state's role. Placing these practices side-by-side, alongside the analogy of constitutional precommitment, forces us to reconstruct the implicit philosophical commitments underpinning self-binding and confront their limits.

  **1. The Temporal Self and the Problem of Authenticity:**
  Both practices presuppose a *temporally pluralistic* theory of the person, rejecting the notion of a unitary, unchanging will. They posit that the self is fragmented across time, with different "selves" possessing potentially conflicting desires and capacities for rational judgment.

  *   **Gambling Exclusion:** This scheme implicitly identifies the *registering self* as the "authentic" or "higher-order" self. This self is characterized by calm reflection, recognition of weakness, and a long-term perspective on well-being. The *gambling self* is seen as impulsive, overcome by craving ("akrasia"), and short-sighted. Authenticity is determined by context: the act of proactively seeking exclusion *in a non-impulsive state* is taken as sufficient evidence of the registering self's authority. The lack of a revocation option reinforces this hierarchy, prioritizing the past self's judgment over the present self's desire, implicitly assuming the present desire is pathological. While circularity looms (why *this* past self?), the practice relies on the *procedural* marker of formal registration during presumed competence, avoiding deep metaphysical claims. It requires only that *this specific past decision* is deemed sufficiently reflective *for this specific purpose*.
  *   **Psychiatric Directive:** This practice also employs a hierarchical model but with a crucial asymmetry. The *competent directive-writing self* is authoritative over the *incapacitated future self* **only when refusing treatment**. Here, authenticity is explicitly tied to *mental capacity* – the legal and clinical assessment of the ability to understand, reason, and appreciate information relevant to the decision. The refusal is binding because the *current* incapacitated self lacks the capacity to make a valid refusal *or* consent. The directive-writing self is authoritative *because* it was competent. However, a *request* for treatment in a directive is not binding on clinicians *if the current self, even if ill, retains capacity to refuse*. The asymmetry reveals a deeper commitment: the *present, capacitated self* (even if symptomatic) holds ultimate sovereignty over accepting positive interventions on its body/mind. The past self can bind the future self *only* to protect it from interventions that future self (when incapacitated) cannot validly consent to. The authentic self is the *capable* self at any time, not necessarily the past one. The past self’s request lacks authority because the present self, if capable, has the right to reassess.

  **2. Self-Legislation vs. State-Enforced Contract:**
  The metaphor of self-legislation is appealing but incomplete.

  *   **Gambling Exclusion:** While framed as self-binding ("binding their future self"), enforcement is fundamentally state-driven. Operators are legally compelled to block access; the state imposes penalties on the gambler *and* the operator for breaches. It resembles a state-enforced protective order where the registrant is simultaneously the petitioner *and* the respondent. The state justifies this not merely as enforcing a private contract but as exercising its *parens patriae* power to protect vulnerable citizens from self-harm and associated social costs (e.g., debt, crime, family breakdown). The "contract" is validated by the state's independent interest in harm prevention. The breach is a deviation from a state-sanctioned protective plan, harming the individual *and* potentially the public purse/safety.
  *   **Psychiatric Directive (Refusal):** The binding refusal also relies on state power – clinicians are legally obligated to honor it. However, the justification leans more heavily on autonomy-as-self-legislation. Honoring the past competent refusal respects the individual's *ongoing* right to bodily and mental integrity, even when they cannot *currently* exercise it. The state acts as the guarantor of the individual's pre-declared will concerning intrusions upon their person. It's enforcing the capable self's sovereignty over its own boundaries against a future incapable self who might be vulnerable to unwanted intrusion.
  *   **The Asymmetry (Request):** The non-binding nature of requests highlights the limits of the self-legislation model for positive obligations. Enforcing a past request for admission/treatment against a *currently refusing but capable* present self looks like state-sanctioned coercion, not self-governance. It violates the fundamental liberal principle against non-consensual bodily intrusion. The state lacks the same compelling *parens patriae* justification it has in gambling (where the present self is deemed incompetent *by virtue of the act* and harm is demonstrably imminent) unless independent dangerousness criteria are met. Here, enforcing the "contract" against the capable present self is seen as inflicting harm, not preventing it.

  **3. Rationality, Time-Slice Neutrality, and Authoritative Preferences:**
  Both practices categorically reject time-slice neutrality – the idea that preferences at any time deserve equal weight. They establish a hierarchy of preferences based on *provenance*:

  *   **Gambling:** Preferences formed in a reflective, non-aroused state (registration) trump preferences formed under craving/arousal (attempt to gamble). The hierarchy is binary: the "calm" self overrules the "aroused" self. The content (desire to gamble) is deemed irrational *because* of its origin in the aroused state. This commits the practice to a substantive view of irrationality linked to context. It avoids circularity pragmatically: the act of registration *is* the marker of the calm state, and the attempt to gamble *is* the marker of the aroused state.
  *   **Psychiatry:** Preferences formed while *competent* trump preferences formed while *incapacitated*. Competence is the key criterion, assessed (in theory) independently of the content of the preference. A competent refusal is binding even if the future incapacitated self pleads for treatment; a competent request is *not* binding if the future self (even if ill but capable) refuses. The hierarchy is based on the *capacity* for rational agency, not solely the calmness of the state. This requires a controversial, but clinically operationalized, concept of mental capacity. It begs the question against the *incapacitated* self's expressed preference only if one denies the validity of the capacity assessment itself.

  **4. Justifying the Asymmetry and the Cost of Coherence:**
  The asymmetry is largely an artifact of legal and ethical categories, particularly concerning bodily integrity, dangerousness, and the threshold for state intervention.

  *   **Defensibility:** It *is* philosophically defensible, grounded in:
      *   **The Harm Principle & Bodily Integrity:** The state has a stronger justification to prevent active self-harm imposed *on* the future self by the present self (gambling access) or by others (treatment refusal), especially when the present actor is deemed compromised. Compelling *positive* bodily intrusion based *only* on a past request, without current consent or dangerousness, is a far greater violation of autonomy and physical integrity.
      *   **Epistemic Limits:** Assessing the "authenticity" or rationality of a *request* for confinement/treatment *by the current refusing self* is fraught. The refusing self might be ill, but could their refusal still reflect core values or a different assessment of their situation? Enforcing past requests risks profound injustice. Conversely, the harm in gambling is concrete and measurable; the compromised state of the gambler is inferred from the act itself and the prior registration.
      *   **Slippery Slope:** Enforceable psychiatric requests could lead to individuals being indefinitely confined or treated against their current capable will based solely on past fears or hypotheticals, chilling the use of directives and eroding trust in psychiatry.
  *   **The Cost of Coherence:**
      *   **Making Psychiatric Requests Enforceable:** This would prioritize past autonomy over present autonomy and bodily integrity. It assumes the past competent self has ultimate authority over the future self's body, even when capable. The cost is high: potentially legitimizing state coercion based on past statements, undermining the foundational principle of contemporaneous consent for medical intervention, and opening the door to significant abuse. It treats the self as a static entity legislating for all future states.
      *   **Making Gambling Registrations Revocable On Demand:** This would prioritize the present self's desire over the past self's protective plan. The cost is also high: it would functionally nullify the self-exclusion scheme. The very point is to overcome present weakness; easy revocation defeats the purpose. It assumes the present self is always competent to judge its best interest, ignoring the documented pathology of gambling disorder and the nature of craving.

  **Constitutional Precommitment: The Collective Analogy and its Limits:**
  Constitutional entrenchment mirrors individual Ulysses contracts: a past "people" (via supermajority) binds future majorities to protect fundamental values or procedures. The implicit theory of the collective self involves a temporal plurality: "We the People" across generations.

  *   **Similarity:** Both presuppose that the "self" (individual or collective) can be divided against itself over time and that binding mechanisms are necessary to protect against future impulsivity (tyranny of the majority, rash amendment), privileging the reasoned, foundational moment.
  *   **Crucial Breakdown:**
      *   **No Single Will:** A polity lacks a unified consciousness. The "authentic" people is a legal fiction constructed through specific procedures (e.g., ratification conventions). Identifying it involves inherent circularity: the rules define the people who made the rules.
      *   **Enforcement Authority:** Individual contracts rely on the state. Constitutional precommitment *is* the state's foundational rule – it binds the state itself. There's no external "enforcer"; legitimacy rests on ongoing acceptance and the perceived authority of the founding act.
      *   **Authenticity vs. Procedure:** While individual practices grapple with identifying the "authentic" self (competence, calm reflection), constitutionalism relies almost entirely on *procedural* legitimacy (supermajority, ratification process) rather than substantive claims about the "true" will of the people at any moment. The "past self's" authority is derived from the procedure, not an assessment of its mental state.
  *   **Implications:** If the analogy held strictly, it would suggest individual self-binding relies solely on procedural formality (signing the form) without needing substantive justification about the self's state, which is untrue (psychiatry *requires* competence). Conversely, the breakdown highlights that individual self-binding *does* rely on contested claims about mental states (competence, irrationality of desire) that constitutionalism avoids through proceduralism. The limits of the analogy caution against importing collectivist justifications uncritically into the individual realm, where bodily integrity and contemporaneous consent carry immense weight.

  **Conclusion: Commitments, Pragmatism, and the Elusive Self**

  These practices are not philosophically pristine. They are pragmatic institutional responses to human vulnerability, employing contested but necessary distinctions. Their core shared commitment is **temporal pluralism** – the self is not unitary, and different temporal perspectives can conflict. They reject time-slice neutrality, establishing hierarchies: **calm/planning over aroused/impulsive in gambling; competent over incapacitated in psychiatry.**

  The gambling scheme strictly requires viewing the *act of registration* as a sufficient procedural marker of a "superior" decision-making state, authorizing the state to prevent actions deemed harmful *by that past self*. It necessitates prioritizing harm prevention over present desire in this specific context. Psychiatry's binding refusal strictly requires the concept of *mental capacity* as the gatekeeper for valid consent/refusal, allowing the capable past self to stand in for the incapable future self regarding bodily integrity. The non-binding request strictly requires upholding the *present capable self's absolute right to refuse bodily intrusion*, regardless of past wishes.

  The asymmetry is not a logical flaw but a reflection of deeper ethical and legal boundaries concerning the body, harm, and state power. **Making psychiatric requests enforceable would sacrifice the inviolability of the capable self's body and mind on the altar of past autonomy, a cost too high for liberal democracies. Making gambling revocation easy would sacrifice the protective purpose of the scheme on the altar of present desire, ignoring the documented pathology it addresses.** Coherence is less important than avoiding these greater harms.

  The analogy to constitutionalism reveals that while the *structure* of precommitment is similar, the *substance* differs profoundly. Collectivities bind themselves procedurally; individuals bind themselves based on claims about mental states and harm. Both practices, ultimately, presuppose a **modest realism about the fragmented self** and a **pragmatic commitment to using law to manage this fragmentation**, prioritizing different values (harm prevention vs. bodily integrity) in different contexts. They do not require a metaphysically robust "true self," but they do demand that we make difficult, context-specific judgments about which version of the self, at which moment, deserves deference when fundamental interests are at stake. The unresolved tension is not a failure of philosophy, but a testament to the enduring complexity of the self across time.
