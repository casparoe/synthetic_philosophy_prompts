prompt: |-
  I need an analogy audited and I can't do it myself. Setup: I'm in a small ethics reading group and one of the members has a move she pulls whenever we deadlock. Last week the question was whether she should break a promise to one person in order to help a bunch of other people. She's a consequentialist maybe 60%, a social-contract type 30%, and the leftover 10% is some Kant-ish thing on which breaking the promise isn't just a cost, it's forbidden, full stop. Her line was: moral uncertainty is still uncertainty. Its no different from not being sure whether the bridge is out — you put numbers on the possibilities, numbers on the outcomes, multiply, take the option with the highest expected value. 60/30/10, weighted up, breaking the promise wins, so she breaks it. Then the kicker: refusing to do it because one of the views says no is just refusing to do expected-value reasoning because one branch of the tree is bad. That's not caution, that's paralysis.

  I'm fairly sure the analogy is carring weight it hasn't earned, but I can't say where. Audit it for me. I don't want a reading list, just the audit, and please don't leave me with "analogies are imperfect but useful" — I need to know which imperfections are load-bearing and which are trivia.

  Format, in this order:

  1. Bottom line — two or three sentences. Does the analogy hold well enough to carry her conclusion, yes or no.
  2. The mapping — a table, one row per element: her moral theories, her credences in them, the "value" of an outcome, the outcomes themselves, the maximization rule, the option of gathering more information before deciding. Add a row for anything important on the uncertainty side that has no counterpart on the moral side. Keep it compact.
  3. Where it breaks — the disanalogies, biggest first, a sentence each on why it's a real break and not just a detail. Go long here, 400 words or so; this is the part I care about.
  4. Which breaks matter for what she's using it for — about 200 words, sorting them into harmless-for-her-argument vs. fatal-to-it.
  5. Does her conclusion survive — about 150 words, verdict first, then what an honest version of her argument would have to add to get there.
  6. A better analogy, if there is one — about 150 words. My own hunch is that the real analogue isn't not knowing the state of the board but not knowing the rules of the game. Better, or just a fancier way of saying the same thing? If you've got a genuinely better one, say so.

  Keep it tight, and no need to be polite about her.
reasoning: |-
  Okay, the user is in an ethics reading group and needs help auditing an analogy used by another member. The analogy compares moral uncertainty to uncertainty about a physical situation—like whether a bridge is out. The member argues that just as you'd calculate expected value in the bridge scenario, you should do the same with moral theories weighted by credences. The user feels this analogy is flawed but can't pinpoint why.

  First, I need to break down the analogy step by step. The core of her argument is that moral uncertainty should be treated like empirical uncertainty. But there are key differences. In the bridge example, outcomes are measurable in terms of lives lost or saved. But moral theories have different conceptions of value. Consequentialism measures outcomes, while deontology views promise-breaking as inherently wrong, not just a cost. This incommensurability means you can't just multiply values by credences.

  Next, the mapping. Her moral theories are consequentialism (60%), social contract (30%), and Kantian (10%). The credences are the weights. But the values here aren't on the same scale. The Kantian view assigns infinite disvalue to breaking a promise, which messes up the expected value calculation. If one theory has prohibitions, averaging doesn't work. 

  Another disanalogy is normative authority. In empirical uncertainty, all parties agree on the goal (avoiding deaths). But in moral uncertainty, the theories themselves disagree on what's valuable. The Kantian 10% isn't just uncertainty; it's a different framework. Treating it as a probability overlooks that it's a stance on morality itself.

  Also, gathering information works differently. For the bridge, you can inspect it or check reports. But how do you "gather more information" between moral theories? It's more about philosophical reflection, which doesn't reduce uncertainty in the same way. 

  The user mentioned that refusing to act because one theory forbids it is paralysis. But the disanalogy here is that in the bridge case, not acting might mean taking a safer route. In ethics, not breaking the promise aligns with Kantian ethics, which isn't inaction but adherence to a principle. 

  The key breaks are incommensurability of values and normative authority. These are fatal to her argument because they undermine the expected value calculation. Without a common metric, weighting doesn't make sense. The prohibitionist stance can't be reduced to a cost. 

  Her conclusion might survive if she assumes value commensurability, but that's a big assumption. An honest argument would need to address how to compare different moral goods and justify aggregating them. 

  A better analogy might be navigating with conflicting maps. Each map has different landmarks and scales, making it hard to merge them. This highlights the incommensurability without pretending the values are the same. 

  The user's hunch about not knowing the rules is spot on. The problem isn't uncertainty about facts but about which framework applies. The bridge analogy masks this by treating moral theories as empirical probabilities.
answer: |-
  ### 1. Bottom Line  
  **No, the analogy fails critically.** It falsely equates empirical uncertainty (e.g., bridge integrity) with normative uncertainty (e.g., moral theories). The disanalogies undermine her core claim that expected-value reasoning *must* apply identically to both. Her conclusion survives only by ignoring irreconcilable conflicts between moral frameworks.

  ---

  ### 2. The Mapping  
  | **Bridge Uncertainty Analogy**      | **Moral Uncertainty Analogy**         |  
  |-------------------------------------|---------------------------------------|  
  | Physical state (bridge out/intact)  | Moral truth (which theory is "correct") |  
  | Credence in each state (e.g., 40%) | Credence in each theory (60/30/10)    |  
  | Outcome value (deaths avoided)      | "Value" of action (e.g., utility/duty)|  
  | Measurable outcomes (lives saved)   | Theory-defined outcomes (e.g., welfare vs. duty) |  
  | Expected value maximization         | Weighted moral value maximization    |  
  | Gathering data (inspect bridge)     | Gathering moral information (e.g., reflection) |  
  | **No counterpart:** Unified goal (minimize deaths) | **Missing:** Shared metric for "value" across theories |  

  ---

  ### 3. Where It Breaks (Key Disanalogies)  
  **1. Incommensurable Values**  
  *Break*: Bridge outcomes share a common metric (e.g., lives saved), while moral theories define "value" differently (e.g., consequentialism quantifies welfare; Kantianism treats promise-breaking as *infinitely* forbidden, not a cost). Assigning numbers to Kant’s "forbidden" requires misrepresenting it as a finite cost, which betrays its core premise.  
  *Why it’s fatal*: Expected value requires additive, scalar values. If one theory rejects scalar trade-offs (e.g., deontology’s prohibitions), aggregating "60% of 5 utils + 10% of -∞" is mathematically and philosophically incoherent.  

  **2. Normative Authority**  
  *Break*: In bridge cases, all parties agree on the goal (avoid deaths). In moral uncertainty, the theories *disagree on what constitutes a "good" outcome*. The 10% Kantian credence isn’t uncertainty about facts but allegiance to a framework that *rejects* the expected-value method itself.  
  *Why it’s fatal*: Using expected value assumes it’s the right meta-rule. But Kantianism (and some contract theories) denies that moral decisions *should* be resolved by weighing probabilities. This is like using a scale to measure the weight of "justice"—it presumes the tool applies.  

  **3. Epistemic Asymmetry**  
  *Break*: Bridge uncertainty can be reduced by gathering data (e.g., inspecting the bridge). Moral "information gathering" (e.g., reading philosophy) rarely eliminates disagreement—it often deepens it. Probabilities over moral theories aren’t empirical but reflect irreducible pluralism.  
  *Why it’s real*: Treating moral credences like physical probabilities implies they converge toward truth with evidence. But moral realism is contested, and evidence won’t resolve whether Kant > Bentham.  

  **4. Agency and Complicity**  
  *Break*: Choosing to cross a risky bridge doesn’t *endorse* the bridge’s collapse. But breaking a promise while granting 10% credence to "this is inherently evil" makes you complicit in evil if Kant is right. Expected-value reasoning can’t absolve you of violating a duty you acknowledge might be binding.  
  *Why it’s real*: The bridge analogy treats outcomes as external events; moral choices are expressions of character. A Kantian would say you’re *choosing evil*, not just risking it.  

  **5. "Paralysis" as Misdiagnosis**  
  *Break*: Refusing to cross the bridge due to risk is caution; refusing to break a promise because 10% of your ethics forbids it isn’t paralysis—it’s integrity to that duty. The analogy pathologizes dissent against expected-value reasoning.  
  *Why it’s real*: She frames rejecting expected value as irrational "freezing." But if the 10% Kantian view is coherent, adhering to it is rational *within its own frame*.  

  ---

  ### 4. Which Breaks Matter for Her Argument  
  - **Fatal**: Incommensurable values (#1) and normative authority (#2). Her argument *requires* moral theories to accept a common value metric and expected value as the meta-rule. Kantianism rejects both. Weighting its "infinite prohibition" as 10% of a finite cost is not caution—it’s category error.  
  - **Harmless**: Epistemic asymmetry (#3) and complicity (#4) weaken the analogy but don’t directly destroy her math-first approach. The paralysis point (#5) is rhetorical but doesn’t invalidate the calculus—it just exposes her bias against deontology.  

  ---

  ### 5. Does Her Conclusion Survive?  
  **Only by rigging the game.** Her conclusion ("breaking the promise wins") survives *if* she:  
  - Illegitimately reduces all moral theories to scalar utilitarianism (e.g., pretending Kant’s duty is just "a big cost").  
  - Assumes expected-value reasoning is the default meta-ethics.  
  An honest argument must confront incommensurability. To defend her move, she’d need to argue why moral theories *must* accept a common currency (e.g., "all duties are just hedonic costs in disguise")—which begs the question.  

  ---

  ### 6. A Better Analogy  
  **"Navigating with conflicting maps"** is stronger. You have three maps (theories) of a territory (morality): one highlights roads (utility), another landmarks (contracts), a third says "never cross red lines" (deontology). Each claims to be *the* territory. Merging them into an "average" map is impossible—red lines aren’t "10% less real." You must either:  
  - Choose one map (commit to a theory),  
  - Heuristically switch maps based on context (moral pluralism), or  
  - Walk a path that avoids all red lines *and* respects landmarks *and* uses roads (inconsistent paralysis).  
  This captures the *framing* conflict her analogy ignores: moral uncertainty isn’t about unknown facts but contested rules. Your "rules of the game" hunch is correct—it forces the key question: "Whose game are we playing?"  

  ---
  **Final note**: Her analogy is a Trojan horse for utilitarianism. The audit exposes it.
