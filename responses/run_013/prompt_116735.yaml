prompt: |-
  ok so I need a parody piece for a dataset I'm building, and I want it to actually be in the weeds on speech act theory rather than the usual "corporatespeak is meaningless" stuff. Here's the brief:

  Write a leaked internal memo from a made-up company (invent the name) where the legal team has gotten way too deep into Austin and Searle and has decided the company will stop making promises and start issuing utterances that are technically non-committal while sounding basically identical to promises. Deadpan, no winking, around 600-700 words, formatted like an actual memo -- memo header, numbered policy sections, and a short Q&A for managers tacked on at the end.

  The funny has to come from getting the theory right, so please build in at least these, all played straight:
  - the "hereby" test: verbs like promise or order take "hereby," verbs like believe or feel don't, and the memo should turn that grammatical difference into company policy, with a list of approved and banned verbs.
  - the misfire vs abuse distinction: a misfire means the act didn't happen at all, an abuse means it happened but was insincere. The memo treats the first as a get-out-of-jail card and the second as purely a paperwork problem.
  - Searle's sincerity condition on promising: so the company installs a "sincerity verification" step, which is obviously unhinged, but keep it straight-faced.
  - the illocutionary/perlocutionary line: the memo insists that perlocutionary effects (persuading the client, deterring the contractor) are out of scope and have to be ticketed separately.
  - Austin's point about parasitic or etiolated uses of language: the memo should take a definite stand on whether Slack messages and emails count as the serious case or the etiolated one, and then follow that stand all the way to its conclusion. Bonus if the memo quietly abolishes the constative/performative distinction too, since statements are acts as well, and then treats this like a minor formatting change.

  Include one quote from a "concerned" in-house philosopher who's worried about where this is heading -- invented person, not a real one, and the concern should be a real one that someone who knows the material would actually raise.

  Then, after the memo, add a short note for me (not part of the piece, maybe 150 words): where it takes liberties with Austin and Searle, and which contested reading of theirs it leans on.

  Dont hedge in the actual piece -- commit to the choices (pick which verbs pass the test, decide the etiolation question one way, don't leave it hanging) and make them pay off. If a spot would be funnier under a different reading of the theory, take it and just flag it in the note.
