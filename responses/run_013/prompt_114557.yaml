  Alternatively, we could require that the agent's utility function be "state-independent" in a strong sense, meaning that it does not depend on the agent's beliefs or knowledge. Then the theorem would hold. But that requirement is a substantive restriction on the form of the utility function.

  Therefore, the theorem becomes a real constraint only if we assume that the agent's utility is solely a function of the state of the world and the act chosen, and not of the agent's information or beliefs. But that is a strong assumption that may not hold for real agents.

  ### Conclusion

  Good's theorem is a mathematical triviality within the expected utility framework with a fixed outcome space that does not include the agent's informational state. The slogan that "information never hurts" is true only under these restrictive assumptions. When they are relaxed, the slogan can be false. The theorem does not provide a universal norm of rationality but rather a consistency condition for a specific model.
answer: |-
  ### The Core Argument: Good's Theorem as a Mathematical Triviality

  Good's theorem is a straightforward consequence of the properties of expectation and maximization, not a substantive principle of rationality. Its apparent force depends entirely on three assumptions: (1) the agent maximizes expected utility (EU); (2) the utility function is defined over a **fixed outcome space** that excludes the agent's informational state; and (3) information is costless and freely deferrable. The theorem states that the expected utility of waiting to choose after receiving information (averaged over possible observations) cannot be less than the expected utility of choosing now. The proof relies on the fact that, for any observation, the agent can always choose the act that was optimal under the prior, ensuring that the conditional EU in each information state is at least the prior EU. Since an average of maxima is always at least the maximum of averages, the result follows.

  The weight of the theorem rests entirely on **Assumption (2)**: the fixed outcome space. If outcomes include the agent's informational state or psychological state (e.g., "knowing a painful truth"), the theorem evaporates. Similarly, if preferences violate EU (Assumption 1), the result fails. The theorem is thus a trivial algebraic identity within its narrow framework, not a deep constraint on rational agents.

  ### Concrete Cases Where Nonnegativity Is an Artifact

  #### Case 1: Learning as an Outcome (Violation of Fixed Outcome Space)
  Consider an agent facing a medical test for a terminal illness. The outcome space includes both physical health and psychological states:
  - **States**: Illness present (I) or absent (¬I), each with prior probability 0.5.
  - **Acts**: 
    - **Act A**: Decline testing and continue life as usual.
    - **Act B**: Take the test, then choose treatment if positive.
  - **Outcomes**: 
    - (No illness, untested): Utility 100 (blissful ignorance). 
    - (Illness, untested): Utility 60 (symptoms but no psychological burden). 
    - (Illness, tested positive): Utility 40 (illness plus distress). 
    - (No illness, tested negative): Utility 90 (relief but residual anxiety). 
    - (Treatment side effects): Utility 50 (if treatment occurs).

  If the agent chooses **Act A**, expected utility is:  
  0.5 × 100 + 0.5 × 60 = 80.  

  If the agent chooses **Act B**:  
  - Upon positive test (probability 0.5), agent treats: utility 50 (treatment side effects).  
  - Upon negative test (probability 0.5), agent gets utility 90.  
  Expected utility: 0.5 × 50 + 0.5 × 90 = 70.  

  Here, **Act A** (80) dominates **Act B** (70). The agent prefers ignorance. Good's theorem seems violated because the expected utility of learning is lower. But this is not a counterexample—it arises because the outcome space includes psychological consequences of learning. The act "continue life as usual" under **Act A** is unavailable after testing: if the agent takes the test and then tries to "ignore" it, they still *know* the result. Thus, the prior optimal act cannot be replicated in the same outcome space. The theorem assumes outcomes are invariant to information; here, they are not.

  #### Case 2: Non-EU Preferences (Ambiguity Aversion)
  Consider an ambiguity-averse agent (e.g., using maxmin expected utility) in a modified Ellsberg urn:
  - Urn A: 50 red balls, 50 black balls.
  - Urn B: 100 balls, unknown red/black mix.
  - A fair coin selects the urn. Agent must bet on red or black.
  - **Acts**: Bet on red or bet on black.
  - **Maxmin EU setup**: Agent evaluates acts by worst-case probability.

  **Without information**:  
  - Coin toss is hidden. Agent faces ambiguity from Urn B.  
  - Bet on red: min probability of winning = min(0.5, 0) = 0 (Urn B could be all black).  
  - Bet on black: min probability = min(0.5, 0) = 0.  
  - Agent has a third act: "Don't bet," utility 0.3 (safe option).  
  - Maxmin EU of betting: 0. Maxmin EU of "Don't bet": 0.3. Agent chooses "Don't bet" for 0.3.  

  **With free information (coin revealed before bet)**:  
  - If Urn A: Agent bets (say, on red) for EU 0.5.  
  - If Urn B: Agent faces full ambiguity. Min EU of betting on red (or black) is 0. "Don't bet" yields 0.3. Agent chooses "Don't bet."  
  - Expected maxmin EU = 0.5 × 0.5 + 0.5 × 0.3 = 0.4.  

  **Result**: Expected EU with information (0.4) > EU without information (0.3). But now add a twist:  
  - Suppose Urn B has a known minimum of 40 red balls (i.e., red probability ∈ [0.4, 1]).  
  - Without information:  
    - Bet on red: min probability = min(0.5, 0.4) = 0.4.  
    - "Don't bet": 0.3.  
    - Maxmin EU = max(0.4, 0.3) = 0.4.  
  - With information:  
    - Urn A: EU = 0.5.  
    - Urn B: Min EU of betting on red = 0.4.  
    - Expected maxmin EU = 0.5 × 0.5 + 0.5 × 0.4 = 0.45.  
  Still, information helps. To make information hurt, restrict acts:  
  - Remove "Don't bet." Only betting allowed.  
  - Without information: Maxmin EU = min(0.5, 0.4) = 0.4 (bet on red).  
  - With information:  
    - Urn A: EU = 0.5.  
    - Urn B: Min EU = 0.4.  
    - Expected maxmin EU = 0.5 × 0.5 + 0.5 × 0.4 = 0.45.  
  No harm. **Real harm requires correlated ambiguity**:  
  - States: Two coins, X (fair) and Y (ambiguous bias). Agent must bet on X.  
  - Prior: X = H or T (prob 0.5 each). Y’s bias is unknown.  
  - **Act**: Bet on X=H (win if correct).  
  - Without information: Min EU = 0.5 (since X is fair regardless of Y).  
  - **Free information**: Agent learns Y’s outcome. But Y’s outcome correlates with X (e.g., if Y is biased, it affects X—though physically independent, ambiguity aversion allows subjective correlation).  
  - After learning Y=H: Agent now perceives X as more ambiguous (e.g., fears Y’s bias "contaminated" X). Min EU for X=H drops to 0.3.  
  - After learning Y=T: Min EU for X=H drops to 0.3.  
  - Expected maxmin EU = 0.5 × 0.3 + 0.5 × 0.3 = 0.3 < 0.5.  
  **Information reduces expected value**. This exploits ambiguity aversion’s violation of EU: learning about Y increases perceived ambiguity for X. Good’s theorem fails here because EU is violated.

  ### Anticipating the Strongest Reply and Why It Fails

  **The Reply**: Good's theorem is not empty. It ensures diachronic coherence for EU agents: it forbids a genuine preference for ignorance within a fixed outcome space. Cases where learning hurts either violate EU or improperly expand the outcome space to include "ignorance" as a good. These are edge cases, not refutations. The theorem remains a robust norm for rational agents who care only about worldly outcomes.

  **Why This Reply Concedes the Point or Renders the Theorem Unfalsifiable**:  
  1. **Concession by Restriction**: The reply admits the theorem only applies when outcomes exclude informational states and preferences obey EU. This concedes that the theorem is a tautology *within these assumptions*—it cannot govern agents who value ignorance or violate EU. Calling such agents "irrational" is circular: it defines rationality as satisfying the theorem’s premises.  
  2. **Unfalsifiability**: By dismissing counterexamples as "out-of-scope" due to expanded outcome spaces or non-EU preferences, the theorem becomes unfalsifiable. Any real-world preference for ignorance (e.g., avoiding medical tests) can be "repaired" by insisting we expand the outcome space to include psychological costs, making the theorem vacuously true. But this strips it of empirical content—it no longer constrains behavior, only model specification.  
  3. **Trivialization of "Rationality"**: The reply implies rational agents must not care about their epistemic state. But this is normative baggage, not a discovery. If an agent derives utility from ignorance (e.g., to avoid anxiety), labeling this "irrational" begs the question. The theorem does not *justify* excluding informational states; it *assumes* it.  

  ### What Would Make the Theorem a Real Constraint?

  For Good's theorem to be a substantive norm, two conditions must hold:  
  1. **Outcome Space Invariance**: Utilities must be defined solely over states and acts, with no dependence on the agent’s beliefs or informational history. Learning can only change beliefs about states; it cannot alter the utility *of* those states.  
  2. **No Extrinsic Value of Ignorance**: The agent must not intrinsically value "not knowing" (e.g., no anxiety reduction from ignorance).  

  Even then, the theorem is weak:  
  - **Surviving Strengthening**: If we fix the outcome space to exclude informational states *and* assume EU, the theorem holds but remains a trivial consequence of conditional expectation properties. It forbids preferring ignorance only because ignorance provides no utility—not because rationality demands it.  
  - **What Would Add Substance**: A proof that *rational agents must have outcome spaces excluding informational states*. But no such argument exists. Rationality does not require indifference to one’s epistemic state; it may demand incorporating it (e.g., to avoid recklessness).  

  Thus, Good's theorem cannot be "repaired" to constrain preferences. It is a useful mathematical lemma for EU theory, but its invocation as a defense of "information never hurts" is either false (when outcome spaces include psychological costs) or trivially true (when they do not). Rational agents *can* be worse off learning—precisely when rationality encompasses more than EU maximization over worldly outcomes.
