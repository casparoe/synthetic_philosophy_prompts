prompt: |-
  My colleague has spent several years on a question I find hard to think about cleanly: whether one should bear a cost for the sake of agents one can never causally affect, when the only thing linking one's choice to theirs is the way both parties reason. Her published work records verdicts on a series of cases, and before she writes up the next one I would like an independent prediction of what she will say about a case of my own devising, together with a candid account of how much of that prediction her record actually forces and how much I am reading into it.

  Her verdicts so far, as she states them:

  1. Two agents are exact duplicates of one another, the same decision procedure realized twice, sealed in separate rooms with no channel of influence between them and no predictor observing either. Each faces a one-shot prisoner's dilemma in which defection pays better whatever the other does, and the payoff to defection is large. She holds that each should cooperate, and that this is not a mistake.

  2. A traveller is stranded in a remote place; a driver will stop for her only if he is confident she will pay him on arrival, and he reads dispositions well. Once she is in the car he has no way to punish her. She holds that the traveller should decide to pay, and pay.

  3. The same traveller, except that the driver's willingness to stop turns on a coin toss rather than on any prediction of her. She holds that the traveller should take the ride and keep the money.

  4. A counterpart that duplicates her reasoning, memory and values exactly, except that in this instance its choice is fixed by a coin it tosses before either of them acts. She holds that she should defect, although the counterpart is in every other respect her and will cooperate half the time.

  5. A counterpart of a wholly different kind, which defects against cooperators as a matter of settled policy, and whose choice is independent of hers in every respect she can identify. She holds that she should defect.

  The case I want predicted is this. She is one of a very large number of agents, on the order of ten to the fortieth, who will each at some point face a choice of the same anonymous shape: bear a small private cost of one unit that confers a benefit of a thousand units on some other member of the population, or take the smaller but surer gain of defecting. No agent can identify, influence or predict any other; none of them runs her decision procedure, and none is a duplicate of her. What is true is that they all belong to a broad class of reasoners who tend to converge on the same verdict for dilemmas of the same shape, so that her bearing the cost is weak evidence, on the order of one part in ten to the thirty-fifth, that any given other agent bears it too. Multiplied across a population that size, that shift corresponds to something like a hundred thousand further agents bearing their costs, each conferring a thousand units of benefit, against a cost to her of one unit.

  What I would like from you: the candidate rules that fit her five verdicts and survive them, stated in your own terms rather than under the name of any school; what each of those rules predicts about the large-world case; your best guess at her verdict, with the reasons for preferring one rule over the others; and the further case, or cases, that would most cleanly separate whatever survives. If two rules agree here but come apart elsewhere, say where. And if her record genuinely underdetermines the new case, say so plainly, and say which principle she would be adopting with each verdict.
reasoning: |-
  Hmm, this is a fascinating and intricate ethical puzzle. The user describes their colleague's work on a problem about bearing costs for agents one can never causally affect, where the only connection is shared reasoning patterns. I need to predict how this colleague would rule on a new large-population case based on her five existing verdicts.

  First, let me parse the colleague's positions clearly:

  1. Duplicate prisoners' dilemma: Cooperate despite no causal link
  2. Trustworthy driver: Pay even when unenforced
  3. Coin-flip driver: Don't pay - no reasoning link
  4. Coin-flipping duplicate: Defect - broken reasoning link
  5. Fixed-policy defector: Defect - no reasoning similarity

  The new case involves astronomical numbers: 10^40 agents making anonymous choices. The key is that the agent's cooperation provides weak evidence (10^{-35} probability shift per agent) that others will cooperate too, leading to massive net benefits.

  I notice three candidate principles emerging from the patterns:

  A) **Shared Reasoning Principle (SRP)**: Bear costs only when others share your exact decision procedure. Explains verdicts 1 (duplicates) and 4 (broken by coin flip). But fails verdict 2 where driver doesn't share reasoning.

  B) **Convergent Reasoning Principle (CRP)**: Bear costs when others' choices counterfactually depend on your reasoning through convergence. Handles verdict 2 (driver predicts dispositions) and 3 (no convergence if coin flip). Also explains why fixed-policy defector (verdict 5) gets defection.

  C) **Expected Impact Principle (EIP)**: Bear costs when expected net benefit > cost, regardless of causal links. Matches all verdicts except verdict 3 (coin-flip driver) where it would inaccurately suggest paying.

  For the large-population case:
  - SRP says defect (no duplicates)
  - CRP says cooperate (due to evidential link through convergent reasoning)
  - EIP strongly says cooperate (massive expected benefit)

  The colleague's verdict 2 is crucial here - she endorsed paying the driver based on disposition reading, which wasn't exact duplication. This suggests CRP is her actual principle. Verdict 3 (coin flip) confirms that without reasoning convergence, no obligation exists.

  My prediction: She'll cooperate in the large case. The astronomical numbers make the evidence-based expected utility overwhelming, and it directly parallels the driver case - her choice provides evidence about others' choices through shared reasoning tendencies.

  To test this further, we'd need a case with evidential links but no reasoning similarity - say if cooperation weakly signaled cooperation from purely irrational agents. CRP would say defect there, while EIP might still say cooperate.
answer: |-
  Based on your colleague's five verdicts and the philosophical patterns they reveal, I'll provide a systematic analysis: candidate rules fitting her cases, predictions for your large-population scenario, my best guess at her verdict (with reasoning), and clean separating cases where rules diverge.

  ---

  ### **Candidate Rules Extracted from Her Verdicts**
  Three principles fit all five cases without contradiction. Each captures a different aspect of her emphasis on *shared reasoning* as the key link justifying cost-bearing:

  1. **Convergent Reasoning Principle (CRP)**  
     *Bear a cost iff your choice provides evidence about others' choices because they use reasoning procedures that would converge with yours under full transparency.*  
     - **Verdict 1:** Cooperate. Duplicates share identical reasoning; your choice is perfect evidence of theirs.  
     - **Verdict 2:** Pay. Driver infers your reasoning (disposition reading), making your choice evidence of his future cooperation (stopping).  
     - **Verdict 3:** Don't pay. Coin toss severs reasoning link; no evidence connects choice to outcome.  
     - **Verdict 4:** Defect. Counterpart's coin flip breaks reasoning convergence; your choice doesn't affect theirs.  
     - **Verdict 5:** Defect. No shared reasoning; policy-driven agent doesn't converge with you.

  2. **Expected Symmetry Principle (ESP)**  
     *Bear a cost iff (i) others face identical decision problems, (ii) their choices symmetrically depend on reasoning like yours, and (iii) the net expected utility is positive.*  
     - **Verdict 1:** Cooperate (symmetry via duplication).  
     - **Verdict 2:** Pay (driver's prediction creates symmetry: he treats you as you treat him).  
     - **Verdict 3:** Don't pay (no symmetry—coin toss breaks link).  
     - **Verdict 4:** Defect (coin flip destroys symmetry).  
     - **Verdict 5:** Defect (no symmetry—different policy).

  3. **Weakly Causal Evidentialism (WCE)**  
     *Bear a cost iff your action is weak evidence of a net benefit to others, and this evidence isn't defeated by causal independence.*  
     - **Verdict 1:** Cooperate (cooperation strongly evidences mutual cooperation).  
     - **Verdict 2:** Pay (deciding to pay evidences driver's cooperation).  
     - **Verdict 3:** Don't pay (no evidence link; coin toss randomizes outcome).  
     - **Verdict 4:** Defect (coin flip defeats evidence link; no correlation).  
     - **Verdict 5:** Defect (no evidence link; independent policy).

  All three rules reject purely causal or selfish reasoning, prioritizing how shared reasoning creates *evidential ties*. CRP focuses on *procedural convergence*, ESP on *structural symmetry*, and WCE on *undefeated evidence*. Crucially, all agree that duplicates (Verdict 1) and predictor-based cases (Verdict 2) demand cooperation, while randomness (Verdict 3) or broken reasoning links (Verdict 4) justify defection.

  ---

  ### **Predictions for Your Large-Population Case**
  - **Setup recap:**  
    - 10⁴⁰ agents, each faces: *Cooperate* (bear cost of 1, give 1000 to one other) or *Defect* (gain >0, no cost).  
    - No causal influence, duplicates, or prediction.  
    - Weak evidential link: Your cooperation increases the estimated probability that any given agent cooperates by ≈10⁻³⁵ (due to shared reasoning tendencies).  
    - Net effect: Cost to you = 1. Expected benefit from evidence shift ≈ (10⁴⁰ agents) × (10⁻³⁵ evidence boost per agent) × (1000 benefit per cooperation) = 100,000.  

  - **Rule predictions:**  
    - **CRP:** **COOPERATE**. Your reasoning is shared by the "broad class"; your choice provides evidence of theirs via convergence (like Verdict 2's driver reading dispositions). The tiny per-agent boost reflects imperfect but non-zero procedural alignment.  
    - **ESP:** **COOPERATE**. Agents face identical problems, and reasoning symmetry exists at population scale (your choice evidences collective behavior). Expected utility (100,000 >> 1) satisfies (iii).  
    - **WCE:** **COOPERATE**. Your cooperation is weak but undefeated evidence of net benefit (≈100,000 units). Causal independence doesn't defeat this (unlike Verdict 3's coin toss).  

  All rules align here due to the massive population size amplifying weak evidence into decisive expected utility. The evidential link (however faint) mirrors Verdict 2, where the driver's prediction creates a similar tie.

  ---

  ### **Best Guess for Her Verdict & Why**
  **I predict she will say you should COOPERATE.**  
  **Reasons for preferring CRP as her likely principle:**  
  - Her Verdict 2 (driver case) is the linchpin. The driver isn't a duplicate, yet she demands cooperation because *his prediction of her reasoning* creates interdependence. This directly parallels your case: the "broad class of reasoners" functions like the driver, with shared reasoning tendencies making your choice evidence of others'.  
  - CRP best explains her emphasis on *how reasoning converges*: Verdict 4 (coin-flip duplicate) fails because randomness breaks convergence, while Verdict 5 fails because no shared procedure exists. Your case has no randomness or procedural mismatch—only scaled-down convergence.  
  - The other rules work but are less precise:  
    - ESP might overextend to cases with symmetry but no reasoning link (e.g., irrational agents).  
    - WCE risks ignoring *why* evidence matters (e.g., if evidence came from non-reasoning sources).  

  **How much her record forces this:**  
  - Her verdicts **strongly constrain** the outcome:  
    - Verdicts 1 and 2 establish that non-causal, reasoning-based links obligate cost-bearing.  
    - Verdict 3 shows randomness severs obligation; Verdict 4 confirms that broken reasoning links do too.  
    - Your case lacks randomness or broken links, so defection is ruled out.  
  - **Reading into it?** Only in weighting Verdict 2 over Verdict 1. If she prioritized *exact duplication* (Verdict 1), she might defect in your case. But Verdict 2 shows she generalizes beyond duplication to *convergent reasoning* (e.g., disposition reading). The population-wide reasoning similarity in your case is a statistical extension of this.  

  Thus, her record forces cooperation unless she treats "exact duplicates" (Verdict 1) as categorically distinct from "similar reasoners" (your case). Given Verdict 2, this seems unlikely.

  ---

  ### **Clean Separating Cases**
  If CRP/ESP/WCE agree in your large-population case, they diverge elsewhere. These cases would force her to clarify:  

  1. **Non-Convergent Evidence Case**  
     *You face the same cost/benefit choice. Cooperation is weak evidence (e.g., 10⁻⁶ probability boost) that others cooperate—but this evidence comes from a pre-existing correlation unrelated to reasoning (e.g., a cosmic law linking your choices). Agents are irrational and ignore costs/benefits.*  
     - **CRP/ESP:** DEFECT. No shared reasoning or symmetry.  
     - **WCE:** COOPERATE (if net expected benefit > cost).  
     - *Tests if evidence must stem from reasoning convergence (CRP/ESP) or any evidence suffices (WCE).*  

  2. **Asymmetric Burden Case**  
     *You and one other agent face identical choices, but only you share reasoning tendencies. Your cooperation gives strong evidence they cooperate, but their choice provides no evidence about yours.*  
     - **CRP:** COOPERATE (your choice still evidences theirs via convergence).  
     - **ESP:** DEFECT (symmetry broken; their choice doesn't depend on yours).  
     - *Tests if mutual dependence (ESP) or unilateral evidential tie (CRP) is key.*  

  3. **Predictor with Random Noise**  
     *Like Verdict 2 (trustworthy driver), but he misreads dispositions 10% of the time due to randomness.*  
     - **CRP:** PAY (reasoning convergence exists but is imperfect).  
     - **ESP:** Likely PAY if expected utility > cost.  
     - **WCE:** PAY (evidence still undefeated).  
     - *Her verdict here would refine how "robust" reasoning links must be. If she defects, CRP weakens; if she pays, CRP strengthens.*  

  ---

  ### **Summary**
  - **Her likely verdict for your case:** Cooperate (bear the cost).  
  - **Forcing by her record:** High. Defection would contradict Verdict 2; cooperation extends its logic to statistical reasoning links.  
  - **Preferred rule:** Convergent Reasoning Principle (CRP), as it best explains her focus on procedural alignment in Verdicts 1, 2, 4, and 5.  
  - **Underdetermination?** Not truly. Her record *allows* only cooperation unless she suddenly prioritizes exact duplication over reasoning convergence—but Verdict 2 makes this inconsistent. If she defects, she likely adopts a narrower principle (e.g., "only duplicate agents matter"), but this would clash with Verdict 2.  

  If you want to test this empirically, propose the **Non-Convergent Evidence Case**. If she cooperates there, she leans toward WCE; if not, CRP/ESP holds. This isolates whether reasoning itself is necessary or if any evidence suffices.
