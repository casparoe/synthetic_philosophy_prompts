prompt: |-
  Ok so I'm a software engineer, I did like one ethics module in college and have mostly forgot it, so sorry in advance if this is a dumb way to ask. I keep getting into arguments about the Terri Schiavo case with my brother in law and I want to actually think it through properly instead of just vibing at him.

  Quick version of the facts in case it helps: she collapsed at home in 1990 in her mid twenties (her heart stopped, her brain went without oxygen), ended up in what the doctors called a persistent vegetative state, and stayed that way until she died in 2005. Her husband was her legal guardian and wanted the feeding tube out. Her parents wanted it left in and insisted she was still in there somewhere. It went through the Florida courts for years, the state legislature and the governor got involved at one point, then Congress passed a one-off law for this single case and the president flew back from Texas to sign it, and after all that the tube came out in March 2005 and she died a couple weeks later. The autopsy found the brain damage was massive and that she'd been blind for years.

  Now the framework I want you to use. Some philosopher called Dworkin, book called Life's Dominion I think, draws a line between two kinds of interests a person has. Experiential interests are just about having good experiences and avoiding bad ones -- eating something nice, not being in pain. Critical interests are about your life as a whole going the way you think it should go, the stuff that makes your life mean something to you rather than just feel ok. His claim, as I get it, is that the critical ones are the weighty ones and that they stick to the person even after she can't have the experiential ones anymore, which is supposed to be why an advance directive binds people later, and why the state's interest in keeping a life going doesn't get to override the person's own view of how her life should end. There's also a pushback I've read somewhere: once someone is demented or unconscious, the critical interests of the person who used to exist shouldn't automatically beat the experiential interests of the person who is actually there now -- old self vs current self.

  So run the Schiavo case through that. Who even counts as the person here, the competent Terri of 1990 or the one in the bed in 2005? What does the framework say the whole fight was about, and was it actually about that? I want the honest version, both directions. Which parts of the case it explains well -- the years of fighting over who got to speak for her, why the lack of a written directive mattered so much, why the argument was never really about whether she was in pain -- and which parts it can't handle. I suspect there's a circularity problem: the theory says do what her critical interests require, but the fight was precisely over whether she had one and who gets to say what it was. Also, does it bother the framework that the autopsy turned out to settle the diagnosis? I think his argument is supposed to work even if she'd been awake and content, which to me is either the strongest part of it or the weirdest.

  Then flip it around: what does this case show about the framework itself? Confirms it, breaks it, or shows it was answering a question nobody was asking?

  No citations or reading lists please, I dont care about that, and don't just summarize what Dworkin said -- I want you to actually do the mapping and be straight with me about where the framework goes quiet instead of stretching it to cover everything.
