  ### Final Principle:
  > A rule-change is valid iff:  
  > (1) It follows the **amendment procedure** in force for that rule (specific > general), **and**  
  > (2) It respects **explicit entrenchment clauses** in force (self-entrenchment requires unanimous override; conflicts invalidate).  
