prompt: |-
  I teach a unit on applied ethics every year, and the session on killing versus letting die has turned into a ritual. The students split into the usual camps — those who think the difference between doing something and merely letting it happen carries independent moral weight, and those who think it is a proxy for something else, whether intention, causal proximity, or the salience of the agent's contribution — and every year the same arguments get made and nobody is persuaded. What strikes me is that almost no one disputes the cases. We agree that switching the trolley feels different from pushing the fat man off the footbridge, that turning off a ventilator feels different from administering a lethal injection, and that the standard examples pull our intuitions in several directions at once; the fight is rarely about the facts, and only partly about the intuitions themselves. It is about what those intuitions are tracking. I have stopped believing that another clever case will break the deadlock, and I would like you to tell me why it will not — or why it might.

  My working hypothesis, which I would like you to test rather than take for granted, is that both camps are using the single phrase "the doing/allowing distinction" for two questions that need to be pulled apart. The first is a metaphysical or causal question: what did the agent actually do — did her body set a fatal process in motion, or did a process she could have interrupted simply run its course? The second is a normative question: does either causal role, just as such, generate a permission or a constraint that the other factors on the table do not already supply? If that split is right, I want to know whether the impasse dissolves once the two questions are separated, whether it merely relocates into the normative half, or whether a genuine substantive disagreement survives the separation — and if it survives, exactly what it is a disagreement about.

  So please give me a diagnosis, not a verdict. Say which parts of the dispute are verbal, which are disagreements about which facts count or about what the intuitions are evidence for, and which, if any, rest on starting points that neither side can argue for. Then tell me what would count as progress given your diagnosis — a sharper distinction, a case that actually discriminates between the camps rather than trading on some other difference, a formal result, or an argument that the question as posed is ill-posed — or, if you think no progress is available, why the debate can be expected to run forever without either side being unreasonable. Ground the diagnosis in what the two sides actually say about the cases, and be candid about the parts of the disagreement you cannot resolve.
reasoning: |-
  Okay, I need to tackle this user's query about the doing vs. allowing distinction in applied ethics. The user teaches this unit annually and faces a persistent deadlock between students who see the distinction as morally significant and those who view it as a proxy. They've noticed that everyone agrees on the cases but disagrees on what the intuitions track. Their hypothesis is that the phrase "doing/allowing distinction" conflates two separate questions: a metaphysical/causal one about what the agent actually did, and a normative one about whether that causal role generates independent moral weight.

  First, I should validate their observation. It's true that trolley cases and ventilator examples consistently evoke split intuitions. The user is frustrated because rehashing cases doesn't resolve the deeper disagreement. Their hypothesis about separating questions seems promising. Let me break it down.

  The metaphysical part involves determining whether an action is classified as doing or allowing. This relies on concepts like initiating a new causal chain vs. not intervening. But even here, there might be gray areas, like whether turning off a ventilator is doing (actively flipping a switch) or allowing (stopping interference). So, there's potential disagreement in categorization, but the user says students mostly agree on cases. So perhaps the metaphysical aspect isn't the main issue.

  The normative question is whether this distinction carries moral weight per se. The user wonders if separating the questions helps. If Team A sees intrinsic moral weight in doing harm, while Team B sees it as derivative (e.g., due to intentions or consequences), then separating might clarify. But does it resolve the impasse? The normative disagreement might persist because it's about foundational values. For instance, Team A might prioritize deontological constraints, while Team B is more consequentialist. 

  Also, the user mentioned proxies like intention and causal proximity. Team B might argue that doing vs. allowing isn't fundamental but correlates with these factors. However, cases like strategic bombing vs. terror bombing show that intention can vary independently. If Team A still sees a moral difference even when intentions are the same, that suggests they value the distinction intrinsically. 

  What about the user's deeper needs? They might want to move beyond repetitive debates and foster deeper understanding. They might need strategies to help students see the underlying disagreements rather than talking past each other. Progress could involve meta-ethical discussions about methodology or exploring why we have these intuitions (e.g., evolutionary psychology). 

  The user also asked about unresolvable parts. Foundational normative commitments might be unarguable—like whether constraints exist independently of consequences. Also, the purpose of intuitions: are they reliable indicators of moral truth or heuristic tools? That's philosophical and contentious. 

  In conclusion, separating the questions clarifies but doesn't resolve the normative debate. Progress might come from shifting focus to why these intuitions exist and their role in moral reasoning. The user could encourage students to articulate their deeper principles and consider applied implications, making the discussion more productive even without consensus.
answer: |-
  Your diagnosis is remarkably perceptive, and your hypothesis holds significant explanatory power. The impasse persists precisely because the debate conflates descriptive categorization (metaphysical/causal) with normative significance, masking deeper, often foundational disagreements. Let's dissect the dispute using your framework, grounded in what both sides typically say about the cases.

  ### 1. **Separating the Questions: Does It Dissolve the Impasse?**
     - **The Metaphysical/Causal Question ("What did the agent *do*?"):** This is largely *verbal/conceptual*, but not trivial.
       - *Team Doing/Allowing (DA)* focuses on **agency initiation** vs. **omission of intervention**. Switching the trolley redirects an existing threat (allowing the five to die by *not* letting the threat continue its course? or *doing* harm to the one?). Pushing the fat man initiates a new lethal force (*doing* harm).
       - *Team Proxy (P)* often uses finer-grained causal concepts: **direct physical contact** (pushing), **breaking a sustaining cause** (turning off a ventilator), or **introducing a new threat** vs. **failing to remove an existing one**.
       - **Agreement & Residual Disagreement:** Both sides *usually* converge on case classifications (e.g., pushing = doing; not donating a kidney = allowing) because shared intuitions about causal structures are robust. But *edge cases* reveal conceptual cracks (e.g., *removing* a respirator: is it *doing* (activating the switch) or *allowing* (ceasing artificial support)?). This disagreement is resolvable through conceptual analysis but doesn't touch the core normative deadlock.

     - **The Normative Question ("Does the causal role *itself* generate moral weight?"):** **This is where the true, substantive impasse relocates and intensifies.**
       - *Team DA* insists the distinction carries **intrinsic moral weight**: "Doing harm is *in itself* harder to justify than allowing harm, even with identical consequences/intentions." They argue: "Pushing *feels* like murder; switching feels like tragic triage. This feeling tracks a real moral boundary."
       - *Team P* argues the distinction is **extrinsically significant**: "The DA distinction *correlates* with morally relevant factors (intention, foreseeability, causal responsibility, social role obligations), but isn't fundamental. Strip those away, and the distinction evaporates." They say: "If you *intend* death in both cases (e.g., turning off a vent to harvest organs vs. lethal injection for organs), the DA difference is morally irrelevant."

  ### 2. **The Unresolved Core: What the Normative Disagreement is *Really* About**
     The separation reveals three irreconcilable starting points:

     - **A. The Existence of Agent-Centered Constraints:**
       - *Team DA* presupposes **deontological constraints**: Agents have special responsibility for harms *they directly cause*, creating a stronger prohibition against *doing* harm. This is non-derivative ("You may not *use* someone as a means, even to save others").
       - *Team P* sees morality as **consequence-centered or intention-centered**: Constraints (if any) derive from expected outcomes or the agent's mental state, not the causal pathway. If consequences/intentions are identical, the DA distinction is morally inert.

     - **B. The Moral Significance of Causation:**
       - *Team DA* believes **causal proximity/initiation** has inherent moral gravity. "Setting a fatal chain in motion" implicates the agent more deeply than "failing to interrupt" an independent chain.
       - *Team P* reduces causation to **descriptive physics or counterfactual dependence**: What matters is whether the agent's *behavior* made the difference (counterfactual dependence), not *how* they made it (initiating vs. allowing). "Letting die" *is* causing death by omission if death counterfactually depends on the omission.

     - **C. The Epistemological Role of Intuitions:**
       - *Team DA* treats intuitions about cases as **revealing bedrock moral truths**. The visceral revulsion at pushing is evidence of a deep constraint.
       - *Team P* treats intuitions as **heuristic signals or biases** needing explanation/correction. The revulsion at pushing is explained by factors like personal force, intention salience, or evolutionary aversion to direct violence – not fundamental morality.

  ### 3. **Why Clever Cases Fail to Break the Deadlock**
     - **Cases are "Interpreted Into" Frameworks:** Each side explains away cases seeming to challenge them by appealing to their favored proxies or refining the causal description. E.g., Team P argues strategic bombing (doing, foreseeing civilian deaths) differs morally from terror bombing (doing, intending deaths) due to *intention*, not DA. Team DA might counter that *both* are "doing" and thus harder to justify than merely allowing starvation (allowing).
     - **No "Knockout" Case Exists:** Any case designed to isolate the DA distinction *alone* will be contested:
       - *Identical Intentions/Consequences?* Team P will argue they are morally equivalent (e.g., suffocating a patient by pillow vs. turning off their oxygen). Team DA insists the "directness" of suffocation retains moral significance.
       - *Edge Cases Highlight Proxy Dependence:* A case like "flicking a switch that removes a barrier holding back a threat" (doing?) vs. "failing to flick a switch that would lower a barrier to stop a threat" (allowing?) reveals dependence on concepts like sustaining cause vs. new intervention – concepts *Team P* thinks are doing the real work.

  ### 4. **What Would Count as Progress?**
     Separation *is* progress, but it shifts the battleground. Further progress requires:

     - **Sharpening the Normative Question:** Explicitly debate: "Assuming we agree on the causal description (e.g., 'initiating a fatal sequence' vs. 'omitting intervention'), does this distinction *itself*, independent of intentions, consequences, roles, or character, generate a *sui generis* moral constraint or permission?" This forces engagement with foundational commitments.
     - **Meta-Ethical/Epistemological Scrutiny:** Investigate *why* we have these intuitions. Evolutionary psychology (e.g., aversion to personal harm), cognitive biases (omission bias), or social conditioning? Does this undermine or support their moral relevance? (This often reveals deeper disagreements about moral realism/anti-realism).
     - **Appealing to Broader Normative Frameworks:** Embed the debate within consequentialism vs. deontology vs. virtue ethics. Does the DA distinction find a natural home or incoherence within these systems?
     - **Focusing on Practical Implications:** Instead of seeking universal agreement, explore *where* the disagreement matters legally/practically (e.g., end-of-life care, triage protocols, self-defense laws). Can consensus be reached *despite* theoretical disagreement? (E.g., both sides might agree ventilator withdrawal is permissible in some contexts, but for different reasons).
     - **Formal Models (Limited Use):** Modeling "causal responsibility" or "counterfactual dependence" formally can clarify concepts but rarely resolves the normative weight question. It might expose inconsistencies in causal descriptions.

  ### 5. **The Unresolvable Core & Why the Debate May Run Forever**
     Some disagreements are **foundational**:
     - **The Existence of Non-Derivative Constraints:** Can one coherently believe *doing* harm is inherently worse, even with identical intentions/consequences? Team P sees this as irrational taboo; Team DA sees it as core morality. Neither can argue the other *out* of their starting point without begging the question.
     - **The Authority of Intuitions:** Are case intuitions trustworthy guides or noisy byproducts? This hinges on unresolvable meta-ethical disputes.
     - **The Reduction of Morality:** Can morality be fully explained by consequences + intentions? Or are there irreducibly agent-relative constraints? This is a fundamental divide in ethical theory.

  **Diagnosis Summary:** The verbal/conceptual disagreement on the causal level is resolvable but minor. Separating the questions **relocates the impasse** to the normative level, revealing **substantive disagreements** about agent-centered constraints, the moral significance of causal initiation, and the epistemological status of intuitions. These disagreements are **foundational**, resting on starting points (e.g., commitment to deontology vs. consequentialism; intuitionism vs. skepticism) that resist non-circular argument. **Progress** lies in clarifying *why* the normative disagreement persists (exposing foundational commitments), exploring its practical implications, and scrutinizing the sources of intuitions. While consensus on the core normative question may be unattainable, the debate need not be unreasonable: both sides are grappling with deep, persistent tensions in moral experience. The ritual has value not as a path to resolution, but as an exercise in mapping the fault lines of moral reasoning itself. Your task is to guide students in seeing *why* they remain in their camps, not necessarily to make them switch.
