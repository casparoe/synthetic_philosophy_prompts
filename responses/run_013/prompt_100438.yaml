  ## HARTLEY & SONS, BUCKETMAKERS — EST. 1897  
  WARRANTY INFORMATION & FREQUENTLY ASKED QUESTIONS  
  (Rev. 7.3 - Spacetime Compliance Edition)

  **Thank you for choosing Hartley & Sons™!** Your satisfaction is our inertial frame of reference. This document outlines the Limited Lifetime Warranty applicable to all H&S Standard, Mach-Deluxe™, and Relata™ Series buckets manufactured after Jan 1, 1950. Please retain for your records.

  **SECTION 1: STANDARD WARRANTY COVERAGE (Clauses 1-7)**
  1.  H&S warrants this bucket against defects in materials or workmanship under normal terrestrial use.
  2.  "Normal terrestrial use" includes containment of water, sand, gravel, or other common substances. Exotic matter containment voids warranty.
  3.  Warranty coverage is contingent upon the bucket maintaining structural integrity. Deformation exceeding manufacturer-specified tolerances voids coverage.
  4.  **Rotation Clause (4a & 4b):**
      *   4a. Warranty coverage remains valid during rotational states of the bucket *provided* said rotation is defined solely relative to readily detectable local masses (e.g., workshop walls, terrestrial surface, celestial bodies).
      *   4b. Concavity developing in contained fluids during co-rotation of fluid and bucket is considered a natural phenomenon inherent to persistent rotational states relative to the large-scale mass distribution of the universe (see Clause 5) and *does not* constitute structural deformation under Clause 3.
  5.  **Spacetime Metric Clause:** Performance specifications (e.g., volumetric capacity, structural rigidity) are calibrated assuming a locally quasi-Minkowskian metric field. Warranty is void if the bucket is subjected to extreme spacetime curvature or torsion exceeding ISO 80000-9:2019 Annex G guidelines without prior written authorization from H&S Engineering.
  6.  Warranty does not cover damage arising from attempts to achieve relativistic velocities, exposure to event horizons, or operation in causally disconnected spacetime regions.
  7.  H&S is not liable for ontological disputes arising from bucket use or interpretation.

  **SECTION 2: PRODUCT LINE SPECIFICS**
  *   **Standard H&S Bucket:** Provides reliable containment within Earth-normal conditions. Performance during rotation is guaranteed relative to Clause 4a benchmarks.
  *   **Mach-Deluxe™ Bucket:** Features enhanced rim reinforcement and precision-balanced construction designed for optimal performance sensitivity to distant mass distributions. Guarantees concavity development consistent with Machian principles under standard galactic conditions. *(Note: Performance in hypothetically matter-free universes is not guaranteed and constitutes off-label use. See Clause 6.)* Minor frame-dragging effects may occur during high-RPM operation near large rotating masses; this is a feature, not a defect.
  *   **Relata™ Series Bucket (by Hartley & Sons):** Engineered for the discerning relationist! Our advanced polymer matrix ensures structural properties arise purely from the dynamic relations between its constituent molecules and immediate environment. *(Disclaimer: Persistent concavity patterns observed during sustained co-rotation states reflect complex relational dynamics inherent to the system and are not indicative of any privileged background reference. Performance relative to distant stars is coincidental, not causal. Clause 4b remains applicable.)*

  **SECTION 3: FREQUENTLY ASKED QUESTIONS**

  *   **Q: My new Mach-Deluxe™ bucket developed water concavity even when spinning smoothly with the water inside. Is it warped?**
      A: No. Per Clause 4b, concavity under sustained co-rotation is an expected indicator of rotational state relative to the large-scale mass distribution of the universe. This confirms your Mach-Deluxe™ is functioning as designed. Congratulations!

  *   **Q: I performed the "rotating bucket experiment" in my windowless basement laboratory, isolated from any view of external masses. My water became demonstrably concave. Clause 4a states rotation is defined relative to detectable masses, but I detect none except the bucket and water. Relative to *what* is my bucket rotating to cause this concavity? The warranty implies this concavity requires rotation relative to detectable masses, yet I detect none. Please clarify and confirm warranty coverage. (Customer Ref: B347-22-01)**
      A: Dear Valued Customer (Ref: B347-22-01), Hartley & Sons appreciates your meticulous experimental approach! Clause 4a establishes common operational standards for warranty validation. Clause 4b addresses the specific phenomenon you observe. The concavity confirms a rotational state relative to the prevailing local spacetime geometry, which inherently encodes inertial properties influenced by the universal mass distribution, even if not directly observable within your isolated but commendably well-equipped laboratory. Your warranty coverage remains intact, as the concavity itself is not a structural defect (Clause 3) and the conditions of Clause 4b are met. We recommend consulting our technical note TN-114: "Operational Definitions of Rotation in Confined Environments" (available upon request).

  *   **Q: Clause 5 mentions the "metric field." Is this a separate physical entity Hartley & Sons installs in my bucket?**
      A: No. Hartley & Sons does not install, fabricate, or warrant any fundamental physical fields. Clause 5 refers to the ambient environmental conditions necessary for the bucket's guaranteed performance specifications to hold true. Think of it like atmospheric pressure specifications for a barometer.

  *   **Q: If I repaint my bucket a different color (changing its relational properties to light), does this void the Relata™ Series warranty?**
      A: No. Cosmetic alterations do not affect the core structural relations covered under the Relata™ warranty. Warranty coverage depends on adherence to Clauses 1-7, particularly Clause 3 regarding structural deformation.

  **SECTION 4: WARRANTY CLAIM PROCESS**
  Claims must be submitted in writing, accompanied by the original sales receipt, 3 photographs of the alleged defect (including one clearly showing any fluid concavity relative to a spirit level), and a notarized affidavit stating the bucket was used within specified parameters (Clauses 1, 2, 4a, 5). Claims invoking Clause 4b require additional spectroscopic evidence of local frame-dragging effects or a signed statement from a licensed astrophysicist confirming standard galactic conditions. Allow 6-8 weeks for ontological review by our Quality Assurance & Metaphysics Department.

  **Hartley & Sons: Building Containment Solutions on a Foundation of Practical Realism Since 1897.**

  ---

  **Verdict:** The warranty commits the company to *neither* pure absolute rotation *nor* pure relative-to-detected-objects rotation. It inconsistently leans on substantivalism (invoking an unobservable "local spacetime geometry" or "metric field" as the reference for rotation in the basement case, Clause 5) while using Machian/relationist *language* (Clause 4a, Relata™ marketing). Their stated position is fundamentally *not* self-consistent: Clause 4a demands detectable masses, but the basement reply and Clause 4b rely on an undetectable background structure (the metric field/geometry) to explain rotation when detectable masses are absent, contradicting the spirit of 4a. They dodge the horns by being incoherent.
