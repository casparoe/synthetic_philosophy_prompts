  For case additions, I'm considering:
  - Cancer as autonomous but dysfunctional
  - XNA system as alternative biochemistry
  - Digital organism as substrate-independent
  - Tumor to challenge "organism" boundaries
  - ALife agent to force consideration of substrate

  Session flow should maximize friction:
  1. Quick paradigm classification (revealing hidden assumptions)
  2. Crisis when borderline cases emerge 
  3. Cascading failures during attacks 
