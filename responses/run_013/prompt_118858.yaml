answer: |-
  Below is a complete redesign of your seminar session, structured to force students into the classificatory dilemma you experienced while preserving your core requirements. The design emphasizes emergent trouble through constrained rules, case-driven paradoxes, and iterative attacks. Total time: **80 minutes**.

  ---

  ### **Session Design: The Classification Committee Exercise**
  **Objective:** Students experience the impossibility of a consistent binary "life" definition via rule-bound case classification, counterexample attacks, and repair cycles.

  #### **Materials & Prep (Before Class)**
  1. **Shared Case Pool** (25 items):  
     - *Your Cases (20):* Viroid, Prion, Giant Virus (> bacterial genome), Satellite Virus (requires giant virus), Mule, Sterile Worker Ant, Mitochondrion, Endosymbiotic Bacterium (reduced genome), Cryptobiotic Tardigrade, Bacterial Spore, Minimal Self-Replicating RNA, RNA-Loaded Liposome, Digital Organism (mutating program), Self-Replicating 3D Printer, Clay Crystal Catalyst.  
     - *New Additions (5):*  
       - **Cancerous Tumor** (autonomous growth but no independent reproduction).  
       - **Synthetic Minimal Cell** (JCVI-syn3.0: genome-designed bacterium, lacks genes for wild-type metabolism).  
       - **XNA System** (synthetic genetic polymer that evolves in vitro, no cellular structure).  
       - **Boltzmann Assembly** (self-organizing lipid micelle that absorbs/releases molecules, no replication).  
       - **Spliceosome Ribozyme** (self-splicing RNA that catalyzes its own excision but doesn’t replicate).  

  2. **Paradigm Cases** (Non-negotiable anchors):  
     - *Living:* Dog, Bacterium.  
     - *Non-living:* Rock, Flame, Corpse.  

  3. **Revisionary Criteria Cards** (For Part 2):  
     - Life = Autopoietic network (self-regenerating boundary/components).  
     - Life = Thermodynamically open system (sustained energy dissipation).  
     - Life = Evolving population (natural selection over generations).  
     - Life = Structure requiring long/specific assembly sequence (origin-of-life criterion).  
     - Life = Coded heritable information (specifies construction).  

  4. **Physical Setup:**  
     - 3 groups (6 students each).  
     - Whiteboard divided into 3 sections per group: **Criterion | Living Column | Non-Living Column**.  
     - Stack of case cards (one per pool item + paradigms).  
     - Timer visible to all.

  ---

  ### **Rules & Roles (Announced Verbally; No Handout)**
  - **Committee Mandate:** Classify all cases into **living** or **not living** using a single, fixed criterion. Paradigms *must* be correctly classified.  
  - **Borderline Column Petition:** Groups may request a "borderline" column *only* if they define it as:  
    - **(A)** "We lack knowledge to decide," OR  
    - **(B)** "No fact exists to decide."  
    - *Deny requests for undefined/nebulous borderline categories.*  
  - **Attack Phase:** Groups trade criteria. Must find **one pool case** that violates the other’s criterion and invent **one new case** that breaks it.  
  - **Repair Rule:** Defenders may add **≤5 words** to their criterion to fix the counterexample.  
  - **Scoring (If Needed):** +1 per correct paradigm classification; +1 per attack that forces a repair; -1 per failed petition. *Use sparingly to motivate precision.*

  ---

  ### **Timeline (80 Minutes Total)**
  #### **Part 1: Committee Simulation (50 min)**  
  - **0–5 min:** Introduce exercise. Assign groups. Distribute paradigm cards. Emphasize: "Your criterion must justify every entry. No amendments until attacks."  
  - **5–15 min:** Groups draft **one-sentence criterion** and classify paradigms. *You circulate, listen, and only intervene if paradigms are misclassified (e.g., "How does your criterion classify a corpse?").*  
  - **15–30 min:** Groups classify **10 pool cases** (assigned randomly). Require register entries. *Predictable crisis:* Groups will stall on prions/viruses/sterile ants. Push: "You must vote. Record the outcome."  
  - **30–35 min:** Groups post criteria/registers. *Likely outcomes:*  
    - Group 1: "Life = reproduction + evolution" → struggles with mules/ants.  
    - Group 2: "Life = metabolism + replication" → fails on tardigrades/spores.  
    - Group 3: "Life = cellular organization" → implodes on viruses/clay crystals.  
  - **35–45 min:** **Attack Round 1.** Groups swap criteria. Find pool counterexample (e.g., prion for "replication" criteria) and invent one (e.g., "A fire that spreads via genetic code"). Defenders repair criteria (e.g., adding "...using inherited nucleic acids").  
  - **45–50 min:** Post revised criteria.  

  #### **Part 2: Revisionary Criteria (20 min)**  
  - **50–55 min:** Redistribute groups. Each draws **one revisionary criteria card**.  
  - **55–65 min:** Apply to **same 12 cases** (e.g., prion, mitochondrion, digital organism). No registers; only notes.  
  - **65–70 min:** Groups report verdicts. *Example contrast:* Thermodynamic criterion labels flames "alive"; evolutionary criterion excludes mules.  

  #### **Debrief (20 min)**  
  *Map student experiences to philosophy. No terms pre-named.*  
  - **70–75 min:** "What frustrated you?" → Surface voting paralysis, repair fatigue. *Then reframe:*  
    - "Your borderline cases (viruses, prions) forced **arbitrary cuts** in a continuous world. Checklists fracture at edges because **features are scalar** (e.g., metabolism in spores) or **context-dependent** (e.g., reproduction in ants)."  
  - **75–80 min:** "What did repairs do to your criteria?" → "They added exceptions." *Reframe:*  
    - "Repairs made criteria **complex and ad hoc**. Dropping binary labels might use **graded membership** (e.g., ‘60% alive’) → gains nuance but loses clarity for policy (e.g., biosafety)."  
  - **80–85 min:** "How did revisionary criteria change judgments?" → "Flames became alive; mules dead." *Reframe:*  
    - "Shifting criteria asks **what work ‘life’ does for us**. Are we defining for evolution research? Ethics? Biosafety? **Functional definitions** (e.g., ‘Does it evolve?’) beat essentialism."  
  - **85–90 min:** **Final pivot:** "Your committee replicated a real biosafety debate. Was the prion ‘alive’? Your rules forced a vote, but the *cost* was a useless definition. Science often **settles pragmatically** (e.g., ‘treat prions as hazardous’ without declaring them alive)."  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  1. **Group Stipulates Over-Simple Criterion** (e.g., "Life is carbon-based"):  
     - *Intervention:* "Classify the *digital organism* and *clay crystal*. Does your criterion permit that?" → Paradigms force refinement.  
  2. **Relativism Creep** ("No definition is better"):  
     - *Debrief leverage:* Contrast revisionary criteria. Point out consensus on paradigms and consilience (e.g., *thermodynamic* + *evolutionary* criteria align on bacteria but diverge on flames). Stress: "Disagreement at edges ≠ no truth; it means **category boundaries are human tools**."  
  3. **Scoring Penalizes Theoretical Criteria**:  
     - *Mitigation:* Praise groups that adopt revisionary views pre-attack (e.g., "Life = open system" includes flames). Note in debrief: "Science sometimes adopts counterintuitive definitions (e.g., prions as infectious agents) because they **predict outcomes**."  
  4. **Borderline Petitions Mismanaged**:  
     - *Script:* "Does ‘borderline’ mean *you* don’t know (A), or *nobody* can know (B)? If (B), justify why no fact exists." Deny petitions arguing (B) for cases like viruses (facts exist; we just dispute relevance).  

  ---

  ### **What the Activity Cannot Do & You Must Supply**  
  - **Reproduce Committee Nuance:** Students lack your prion-debate context. *Supply this post-debrief:* "In my meeting, we faced liability—misclassification could mean unsafe labs or halted research. Your ‘attack’ phase captured the *logic*, not the stakes."  
  - **Prevent Frustration:** They *will* resent the rules. *Use it:* "Your irritation mirrors how scientists feel when forced into binary regulations."  
  - **Deep Theoretical Grounding:** The exercise surfaces problems but can’t teach origin-of-life theories. *Assign a short post-session reading* (e.g., Cleland’s "Is ‘Life’ a Scientifically Useful Concept?").  

  **Outcome:** Students will exit with visceral frustration at checklists, appreciation for functional definitions, and skepticism of sharp boundaries—primed for your unit on categorization. The debrief ties their struggle to your prion committee, grounding philosophy in institutional reality.
