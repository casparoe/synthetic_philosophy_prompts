prompt: |-
  Someone in my dept has an argument that the principle of indifference isn't just unreliable but flatly inconsistent, and its been bugging me for a week. I want to know which step to reject and what rejecting it actually costs.

  (1) If your evidence puts A and B on a par, you should be equally confident in each.
  (2) A jar holds one ball; all you know is it's red or blue. By (1), P(red) = P(blue) = 1/2.
  (3) Same jar, but all you know is it's red, blue, or green. By (1), P(red) = 1/3.
  (4) Now group the other two: your evidence doesn't favour red over blue-or-green either, so by (1) P(red) = 1/2. But (3) said 1/3.
  (5) This isn't special to jars. Take any outcome E. You can present the space as E versus not-E, and indifference hands you 1/2; or as E plus any number n-1 of further cells your evidence doesn't rank, and indifference hands you 1/n. For a tautology the evidence is identical in every presentation.
  (6) So P(E) = 1/n for every n, hence 0 for every E, while the cells of a partition still have to sum to 1.

  He says this shows there's no coherent way to fix a prior, so Bayesianism never gets off the ground. I'd rather not hand him that, but I can't locate the bad step, because (3)-(4) is just Bertrand's paradox and I've never seen a fix I believed. So: which premise goes, and at what price? If I keep (1), what's the extra principle that tells me which partitions I'm allowed to feed it -- is there a real story there or is it a promissory note? And if (1) has to go, what's left to do the work of getting a prior assigned at all?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're dealing with a colleague's argument that the principle of indifference is inconsistent, not just unreliable. The user is bothered because they can't pinpoint where the argument goes wrong, and they're worried it might undermine Bayesianism. 

  First, I need to understand the steps of the argument. The colleague uses a series of scenarios with a jar and balls to show contradictions. Step (1) states that if evidence doesn't distinguish between options, they should have equal probability. Steps (2) and (3) apply this to two and three colors, getting 1/2 and 1/3 respectively. Then step (4) groups two colors together, leading to P(red)=1/2, conflicting with step (3). Step (5) generalizes this to any outcome, showing P(E) must be both 1/2 and 1/n for any n, forcing it to zero, which is impossible.

  The user mentions Bertrand's paradox in step (3)-(4), which is a classic example of how different partitions lead to different probabilities. The heart of the issue is that the principle of indifference is sensitive to how the problem is framed. The colleague claims this makes Bayesian priors impossible.

  Now, the user wants to know which step to reject and what the cost is. They also ask if there's a way to save (1) with an extra principle for valid partitions or if (1) must be abandoned. If (1) goes, how do we assign priors?

  I recall that philosophers and statisticians have tackled this. The inconsistency arises because the principle is applied to different partitions without a basis for choosing one over another. Step (1) is the core principle, but it's applied to incompatible descriptions. Rejecting (1) entirely seems drastic because indifference is intuitive in simple cases. So maybe the solution is to restrict (1) to "canonical" partitions. But what makes a partition canonical? That's tricky.

  Bertrand's paradox shows that without additional constraints, indifference leads to contradictions. The resolution involves recognizing that not all symmetries are equal; we need a privileged variable or a uniform distribution over a continuous parameter. But in discrete cases like the jar, it's messier.

  The user's colleague argues that without indifference, Bayesianism lacks a way to set priors. But Bayesians might say priors come from background knowledge or maximum entropy, not pure indifference. Still, the user wants to defend Bayesianism, so they need a coherent response.

  Possible solutions: Reject the application of (1) in step (4) because "blue-or-green" isn't a natural partition. Insist that the partition must be based on the evidence's structure. Here, the evidence lists three colors, so the partition should be three-way, not two-way. The cost is that we need a principled way to choose partitions, which might rely on language or ontology.

  Another approach: Deny that grouping options changes the evidence. The evidence specifies three possibilities, so "blue-or-green" is a disjunction, not a primitive outcome. Applying indifference to disjunctions violates the principle's intent. But this requires defining what constitutes a "basic" outcome.

  The user might be concerned about the cost—either accepting that indifference is context-dependent or abandoning it altogether. If we keep (1) with restrictions, we need meta-principles for valid partitions, which could be ad hoc. If we drop (1), we need alternative methods for priors, like empirical data or objective Bayesian approaches using maximum entropy.

  The colleague's conclusion that this invalidates Bayesianism is too strong. Bayesians can use indifference cautiously or rely on other criteria. The key is acknowledging that indifference isn't a universal tool but works in well-defined scenarios with clear symmetries.

  The user's deeper need might be to preserve a foundation for rational priors without falling into inconsistency. They might also want a rebuttal that's philosophically sound yet practical. Highlighting that the contradiction arises from misapplying the principle, not the principle itself, could help. Emphasizing that Bayesianism incorporates other elements beyond indifference might mitigate the colleague's attack.
answer: |-
  This is a sharp critique that cuts to the heart of probabilistic reasoning under ignorance. Your colleague's argument is a classic demonstration of the **Partition Dependence Problem**, showing that *unrestricted* application of the Principle of Indifference (PoI) leads to inconsistency. The bad step is **the *unrestricted* application of (1)**, specifically its use in **(4)** based on an *arbitrary regrouping* of possibilities. Rejecting this application comes at a cost, but it doesn't sink Bayesianism. Here's the breakdown:

  1.  **The Core Problem: Partition Dependence**
      *   Premise (1) (PoI) states: "If your evidence puts A and B *on a par*, you should be equally confident in each."
      *   The fatal flaw is that "on a par" and the very *description* of A and B depend entirely on how you choose to **partition the space of possibilities**.
      *   In step (3), you partition the space into three atomic, mutually exclusive possibilities based on the evidence: {Red}, {Blue}, {Green}. PoI gives P(Red) = 1/3.
      *   In step (4), you create a *different*, equally valid partition given the evidence: {Red}, {Blue ∨ Green}. The evidence *also* puts these two disjunctive possibilities "on a par" – you know nothing favoring Red over the disjunction "Blue or Green". Applying PoI naively to *this* partition gives P(Red) = 1/2.
      *   The contradiction arises because the evidence **does not specify *which* partition is the "correct" one for applying indifference.** PoI gives different answers depending on an arbitrary choice of description.

  2.  **Which Premise Goes? (Rejecting the Unrestricted Application of (1))**
      *   You **do not need to reject premise (1) entirely**. The PoI has intuitive force and works well in simple, unambiguous cases (like step (2)).
      *   You **must reject the *unrestricted scope* of (1)**. The PoI cannot be applied blindly to *any* partition or description that seems symmetric *given only the minimal evidence*. Step (4) misapplies it by creating a *coarser-grained* partition ({Red}, {Blue ∨ Green}) after initially considering a *finer-grained* one ({Red}, {Blue}, {Green}), using only the same minimal evidence.
      *   **The Bad Step:** The application of (1) in **(4)** is invalid *given the application in (3)*. You cannot consistently apply PoI to *both* the 3-cell partition *and* the 2-cell partition derived solely from grouping two cells of the 3-cell partition, using only the evidence "red, blue, or green".

  3.  **The Cost: The Need for a "Privileged Partition"**
      *   **The Price:** To avoid inconsistency, you need an **extra principle** to determine *which partition* (or description, or set of "basic" possibilities) the PoI *should* be applied to given your evidence. This is the core challenge highlighted by Bertrand's Paradox.
      *   **What's the Extra Principle?** There isn't one universally agreed-upon, perfectly satisfying solution. This is the active area of debate ("the cost"). Prominent approaches include:
          *   **Natural Kinds / Language Dependence:** Apply PoI only to the "most natural" or "finest-grained" partition suggested by the evidence *and the language used*. In step (3), the evidence explicitly lists three distinct colors ("red, blue, or green"), suggesting {Red}, {Blue}, {Green} is the privileged partition. Grouping "blue or green" is an artificial construct. *Cost:* "Natural" is subjective and language-dependent. Why is "color" privileged? Couldn't the balls have other properties?
          *   **Symmetry / Invariance:** Apply PoI only to partitions where the possibilities are symmetric under all transformations consistent with your ignorance. The evidence "red, blue, or green" doesn't provide any basis for grouping blue and green together that it doesn't also provide for grouping red and blue, or red and green. The *only* partition where *every* cell is symmetric under *all* possible relabelings consistent with the evidence (i.e., permuting the color names) is the full 3-cell partition. *Cost:* Defining the relevant symmetries rigorously for complex problems is difficult. Is this just restating the problem?
          *   **Maximum Ignorance / Minimum Information:** Use tools like the **Maximum Entropy Principle** (MaxEnt). Given the constraint "P(Red) + P(Blue) + P(Green) = 1" and *no other constraints*, MaxEnt assigns equal probability (1/3) to each color. This *automatically* rejects assigning P(Red) = 1/2 based on the {Red}, {Blue ∨ Green} partition because that assignment has *lower entropy* (implies *more* information - that "Blue ∨ Green" is a single unified alternative to Red). *Cost:* MaxEnt requires choosing the *right* constraint set and can be computationally complex. Is it truly principled or just a useful recipe?
          *   **Syntactic Approaches:** Tie the partition to the logical structure of the evidence statement. The evidence lists three atomic possibilities, so apply PoI to those atoms. *Cost:* Highly sensitive to how the problem is phrased logically.

  4.  **If (1) *Must* Go? Salvaging Bayesianism without Unrestricted PoI**
      *   Rejecting the *unrestricted* PoI does **not** mean Bayesianism "never gets off the ground." It means PoI is not a magic bullet for generating priors under *complete* ignorance. Bayesianism offers other resources:
          *   **Empirical Priors:** Use relevant background knowledge, analogous cases, or even sparse data to inform priors whenever possible. Ignorance is rarely *absolute*.
          *   **Objective Bayesianism:** Use principles like **MaxEnt**, **Transformation Groups** (exploiting physical symmetries), or **Reference Priors** to generate priors deemed "objective" or "least informative" *relative to specific constraints and model structures*. These aim to formalize indifference where possible while avoiding inconsistency.
          *   **Subjectivity Acknowledged:** Accept that priors *can* be subjective to some degree, reflecting legitimate degrees of belief based on *all* available background knowledge (even if vague). The power of Bayesianism lies in how it *updates* these priors with new evidence. Different reasonable priors often converge with sufficient data.
          *   **Focus on Updating:** Argue that the real engine of rational belief formation is conditionalization (updating), not the prior itself. While the prior matters, the process of updating is where consensus often emerges.
      *   **What Rejecting Unrestricted PoI Costs:** It concedes that there is **no purely logical, mechanical procedure to generate a unique "correct" prior from *zero* information.** Assigning probabilities under complete ignorance involves judgment calls about the relevant partition or the appropriate symmetry, informed by context, language, and purpose. This is a significant limitation of the PoI and a challenge for purely objective Bayesianism, but it doesn't invalidate the entire framework.

  **Conclusion & Rebuttal:**

  1.  **Reject:** The *unrestricted* application of premise (1) in step (4). Applying PoI to the arbitrary coarse partition {Red}, {Blue ∨ Green} after applying it to the fine partition {Red}, {Blue}, {Green} is inconsistent given the same minimal evidence.
  2.  **Cost:** You must adopt an **extra principle** to select a "privileged" partition or description for applying indifference (e.g., finest-grained partition given the evidence/language, symmetry under transformation, MaxEnt). No such principle is universally accepted or perfectly satisfying, leading to ongoing philosophical debate (Bertrand's Paradox exemplifies this).
  3.  **Bayesianism Survives:** This does not sink Bayesianism. It shows that the Principle of Indifference, while intuitively appealing in simple cases, is **not a reliable tool for generating priors under *complete* and *unstructured* ignorance.** Bayesianism can still function using:
      *   Restricted/Contextual PoI (applied carefully to privileged partitions).
      *   Other "objective" principles (MaxEnt, Transformation Groups).
      *   Empirical/background-knowledge informed priors.
      *   Acknowledging a degree of legitimate subjectivity in the prior, emphasizing the power of updating.

  **Your response to your colleague:** "You're right that applying the Principle of Indifference *without constraint* to *any arbitrary description* leads to inconsistency, as steps (3) and (4) show. This is the partition dependence problem. However, this doesn't doom Bayesianism; it shows we need care in applying indifference. We need an extra principle – like applying it only to the finest-grained partition directly suggested by the evidence ({Red}, {Blue}, {Green}), or using MaxEnt – to avoid the contradiction. While choosing that principle isn't always trivial, Bayesian updating with evidence remains a powerful framework for rational belief revision even when starting points involve some judgment."
