prompt: |-
  I'm the safety-and-quality lead at a company that makes industrial lifting gear -- cranes, hoists, rigging -- and a chunk of my job is writing up incident investigations, maybe fifteen a year, everything from a near-miss where a load slipped a few inches off the floor to a fatality. The findings section of those reports is basically a list of 'we know X' sentences. We know the sling was undersized. We know the operator bypassed the limit switch. We know the brake seized because of water getting in. Legal reads them, the regulator reads them, and after a bad one a plaintiff's lawyer reads them back to me three years later in a room with a court reporter.

  I keep getting into fights here about how strong the evidence has to be before I'm allowed to write 'we know'. Some of my colleagues say it's the same standard every time -- either you've got the evidence or you haven't, and it doesn't matter whether we're talking about a scuffed paint job or a guy in the hospital. I've been reading around this thing called pragmatic encroachment, which says that's not how it works, that how much evidence you need before you know something shifts with what's at stake. And there's contextualism, which is a cousin of it, somthing about 'knows' changing meaning with the conversational context, though I gather the two views aren't the same thing.

  Can you turn this into an actual procedure I can run? I want the questions to ask in order for a given finding, what counts as a sufficient answer at each step, and a rule for where the report stops short of 'we know' and says 'the evidence indicates' or 'we could not determine'. I've got about an hour per finding and no philosophy training, and legal has to sign off on the wording. Things it has to handle:

  - Same evidence, different stakes. A visual inspection plus a maintenance log looks like knowledge after a near-miss. Does it look like knowledge after a fatality?
  - Whose stakes? Mine writing the report? The guy on the shop floor? His family? The reader in the deposition?
  - The timing problem. If 'knows' depends on context, then a sentence can be true when I write it and false when it's read back to me in court. Does that mean I should just write to the highest foreseeable stakes, or does that throw away the whole idea?
  - The differnce between the bar for the claim being true, the bar for me putting it in the report, and the bar for us acting on it -- shutting a line, recalling a product. I suspect my colleagues are smearing these three together and I want the procedure to keep them apart even if it turns out they usually track each other.

  Then run it on three findings: (1) a near-miss where a load slipped and the log shows a missed inspection; (2) a fatality where the physical evidence burned up and all I've got is two conflicting witness statements; (3) a case where the evidence is genuinely solid but the finding lands on our biggest customer's maintenance crew.

  Also tell me straight where the procedure can't decide anything and I'm just making a values call, and where it'll misfire -- I'd rather find that out now than in a deposition. And please don't hand me a reading list, I need the thing itself.
reasoning: |-
  Okay, the user is a safety-and-quality lead at an industrial lifting gear company. They write incident reports, and their main issue is deciding when to use "we know" versus softer language like "evidence indicates." They're clashing with colleagues who think evidence standards are absolute, regardless of incident severity. The user has come across pragmatic encroachment and contextualism in epistemology and wants a practical procedure based on these concepts.

  First, I need to unpack their core conflict. They handle incidents ranging from near-misses to fatalities, and legal/regulatory scrutiny varies dramatically. Their colleagues advocate a binary evidence standard, while the user intuitively feels stakes should affect certainty thresholds. The philosophical concepts they mention actually support this intuition—pragmatic encroachment suggests required evidence increases with stakes, while contextualism says the meaning of "knows" shifts with context.

  The user needs an operational procedure, not theory. Key requirements: 
  - Must handle variable stakes (e.g., same evidence for near-miss vs. fatality)
  - Clarify whose stakes matter (author, victim, deponent?)
  - Resolve temporal context shifts (report-writing vs. deposition)
  - Separate three bars: truth threshold, reporting threshold, action threshold
  - Be executable in ~1 hour per finding by non-philosophers
  - Survive legal review

  Major hurdles: 
  - "Whose stakes?" is messy—legal exposure suggests the deposition reader's stakes dominate, but this feels ethically questionable. 
  - Temporal inconsistency could make "we know" true when written but false in court. 
  - The customer pressure scenario introduces non-safety stakes, which shouldn't lower epistemic standards but might tempt others to do so.

  I'll structure the procedure as a flowchart-style checklist with explicit thresholds. For the "whose stakes" problem, I'll prioritize the deposition context since that's where language gets weaponized. For timing, I'll recommend writing to the highest foreseeable stakes to avoid instability. The three bars (truth/reporting/action) must be isolated—e.g., actionable findings might require lower certainty than declarative ones in high-stakes reports.

  Testing with their examples: 
  - Near-miss with missed inspection log: Moderate stakes likely permit "we know" unless systemic issues lurk. 
  - Fatality with burned evidence and conflicting witnesses: Must default to "evidence indicates" due to insufficient proof. 
  - Solid evidence implicating big customer: Truth bar is cleared, but reporting might need firmer phrasing to resist pressure.

  Crucially, I'll flag where judgment calls are unavoidable: 
  - Stakes assessment is inherently subjective 
  - "Sufficient" evidence thresholds aren't quantifiable 
  - Legal may override philosophical rigor 

  The procedure must acknowledge its own limits—when stakes are ambiguous or evidence is borderline, the user must exercise discretion. And I'll emphasize that protecting the process is more important than elegant philosophy; if legal insists on "evidence indicates" universally, that's the reality.
answer: |-
  Here's a battle-tested procedure incorporating pragmatic encroachment & contextualism, designed for speed, legal defensibility, and clear separation of evidence bars. It prioritizes **deposition-reader stakes** and **highest foreseeable context** to avoid the timing trap.

  **Core Principle:** "We know X" **requires stronger evidence as the stakes of being wrong increase.** The threshold isn't fixed; it scales with potential harm (fatality > injury > near-miss), legal exposure, and reputational damage.

  **The Procedure: The 5-Step "Knows" Threshold Assessment (Per Finding)**

  1.  **State the Finding (X):** *What specific fact are you asserting?* (e.g., "The wire rope was fatigued," "Operator bypassed the safety interlock").
      *   *Sufficient:* Clear, concise, factual statement. Avoid speculation or conclusions about root cause here.
      *   *Stop if:* The finding is vague, speculative, or combines multiple claims. Break it down.

  2.  **Assess the Stakes (S):** *What are the foreseeable consequences if this finding is wrong?* Consider:
      *   Severity of the incident (Near-miss, Injury, Fatality)?
      *   Potential for future harm if the cause is misidentified?
      *   Likelihood this finding will be central to legal action (regulatory penalty, lawsuit)?
      *   Reputational damage to the company?
      *   **Whose Stakes?** Focus on **the highest foreseeable stakes context:** The deposition room 3 years later where a plaintiff's lawyer uses your words against the company. Assume worst-case *reasonable* amplification.
      *   *Sufficient:* A brief rationale categorizing stakes as **Low, Moderate, High, or Extreme**.
          *   *Low:* Minor property damage, very low recurrence risk, minimal legal exposure (e.g., scuffed paint traceable to a known, isolated handling error).
          *   *Moderate:* Minor injury, near-miss with significant potential, moderate legal/reputational risk.
          *   *High:* Serious injury, significant equipment damage, high probability of regulatory scrutiny.
          *   *Extreme:* Fatality, catastrophic failure, major product recall, certain high-stakes litigation.
      *   *Stop if:* Stakes are genuinely ambiguous. Default to **High** or consult Legal early.

  3.  **Evaluate the Evidence (E):** *What direct, objective support exists for X?* Be brutally honest about quality.
      *   Physical evidence (condition, metallurgy, fracture surfaces)?
      *   Uncontested instrument data (load cells, PLC logs, CCTV)?
      *   Maintenance/Inspection records (completeness, reliability)?
      *   Consistent, corroborated witness testimony from credible sources?
      *   Expert analysis (based on evidence, not speculation)?
      *   Absence of plausible alternative explanations?
      *   *Sufficient:* List sources and their key points supporting X. Note gaps, contradictions, or weaknesses.
      *   *Stop if:* Evidence is purely circumstantial, relies on a single uncorroborated source, or plausible alternatives exist that haven't been ruled out.

  4.  **Judge the Threshold (T):** *Does the evidence (E) meet the required threshold for "We know X" given the stakes (S)?*
      *   Use this matrix (Your "Knows" Decision Grid):
          | Stakes (S)      | Evidence Threshold (T) for "We Know X"                                                                 | Fallback Wording              |
          | :-------------- | :---------------------------------------------------------------------------------------------------- | :---------------------------- |
          | **Low**         | **Moderate Confidence:** Evidence is credible, consistent, and points strongly to X. Minor gaps/alternatives possible but deemed very unlikely. | "Evidence indicates X"        |
          | **Moderate**    | **High Confidence:** Evidence is robust, objective, corroborated. Plausible alternatives investigated and ruled out with reasonable certainty. Minor gaps unlikely to change conclusion. | "Evidence strongly indicates X" or "Findings support X" |
          | **High**        | **Very High Confidence:** Evidence is direct, unambiguous, multiple independent lines of corroboration. All plausible alternatives definitively eliminated. Evidence is resistant to challenge. | "Evidence demonstrates X" or "Investigation determined X" |
          | **Extreme**     | **Near Certainty:** Evidence is irrefutable, forensic, leaves no room for plausible alternative explanations. Withstands rigorous adversarial scrutiny. | "Evidence conclusively demonstrates X" or "Investigation confirmed X" (Avoid "We know" unless *absolutely* bulletproof) |
      *   *Sufficient:* A simple statement: "E meets/does not meet the T for S." Justify briefly if borderline.
      *   *Stop if:* Evidence is clearly insufficient for the stakes. Use fallback wording.

  5.  **Determine Report Wording & Actionability:**
      *   **Reporting Threshold:** Use the wording from the grid above based on Step 4's outcome.
      *   **Action Threshold:** *Separate Question:* Is the evidence *sufficient to justify specific corrective/preventive actions* (shut line, recall, discipline, procedure change)? **This bar is often LOWER than the reporting bar.** You can act on "Evidence strongly indicates X" (Moderate/High stakes evidence) even if you don't use "We know X" in an Extreme stakes report. Justify actions based on risk assessment, not just declarative certainty.
      *   *Sufficient:* Chosen wording for the report. Brief note on recommended actions and their evidence basis.

  **Key Rule:** **Always** write for the **Highest Foreseeable Stakes Context** (the deposition room). This solves the timing problem and is legally prudent. Pragmatic encroachment is applied *proactively*.

  **Where Judgment is Required (Values Calls):**
  1.  **Categorizing Stakes (Step 2):** Is this Moderate or High? Extreme or High? This involves predicting likelihood and severity of future harm/legal action.
  2.  **Evaluating Evidence Quality (Step 3):** Is this testimony "credible"? Is this evidence "corroborated" enough? Is an alternative "plausible"?
  3.  **Borderline Threshold Judgments (Step 4):** Does *this* evidence *just* meet High Confidence, or does it fall short? Does eliminating *that* alternative count as "reasonable certainty" or not?
  4.  **Action Threshold (Step 5):** How much risk are we willing to accept when taking action based on less-than-certain findings?

  **Where it Might Misfire:**
  1.  **Over-Cautiousness in Low Stakes:** For truly trivial findings (scuffed paint), "Evidence indicates" might feel overly bureaucratic, but it's consistent and safe.
  2.  **Underestimating Stakes:** If you misjudge the future legal exposure (e.g., think a near-miss is Low stakes, but it reveals a systemic flaw leading to later litigation), your "Evidence indicates" might be used against you. **Err on the side of higher stakes.**
  3.  **Novel Failure Modes:** If evidence points strongly to X, but X is a completely unexpected failure mechanism, the "plausible alternatives" bar might be higher than the evidence can meet, forcing softer wording even with good evidence.
  4.  **Legal Override:** Legal may mandate softer language universally, regardless of the procedure. The procedure gives you a defensible rationale to push back.

  **Applying the Procedure to Your Cases:**

  **Case 1: Near-Miss (Load slipped), Finding: "A scheduled monthly inspection of the sling was missed."**
  *   **X:** Missed monthly inspection (per log).
  *   **S:** **Low/Moderate.** Near-miss, no injury. Foreseeable stakes are regulatory review for process lapse, minor reputational hit. Unlikely central to major lawsuit *for this incident*. (Assume no pattern of missed inspections contributing to worse events *yet*).
  *   **E:** Maintenance log clearly shows the inspection was not signed off for the relevant month. No evidence it was done unofficially. System shows no overrides. (Objective, documented).
  *   **T:** Evidence is **direct, objective, unambiguous.** Easily meets **Moderate Confidence (Low Stakes)** or **High Confidence (Moderate Stakes)**. Plausible alternative (log error) is very unlikely.
  *   **Wording:** **"We know a scheduled monthly inspection of the sling was missed."** (Stakes Low/Mod) OR **"Evidence demonstrates a scheduled monthly inspection was missed."** (If leaning Moderate stakes).
  *   **Action:** Implement corrective action for missed inspection process (retraining, system check). Action bar easily cleared.

  **Case 2: Fatality (Evidence burned), Finding: "The hoist brake failed due to improper lubrication."**
  *   **X:** Brake failed due to improper lubrication.
  *   **S:** **Extreme.** Fatality. Certain high-stakes litigation, regulatory investigation, massive reputational risk. Finding directly implicates cause of death/maintenance practices.
  *   **E:** Two conflicting witness statements. Worker A says "lube wasn't done last service." Worker B (who did service) says "I definitely lubed it." No physical evidence (burned). Maintenance log shows service was performed but doesn't detail *every* step. No residue analysis possible.
  *   **T:** Evidence is **contradictory, subjective, uncorroborated.** Plausible alternatives abound (brake failed for another reason, Worker A mistaken, Worker B lying/forgetting). Does **NOT** meet the **Near Certainty (Extreme Stakes)** threshold. Doesn't meet **Very High Confidence (High Stakes)**. Barely meets Moderate Confidence at best.
  *   **Wording:** **"The evidence regarding brake lubrication is inconclusive. Witness statements conflict, and the absence of physical evidence prevents definitive determination of the brake's lubrication state prior to failure."** (Avoid stating the finding as fact!).
  *   **Action:** Investigate maintenance procedures/training *generally* due to *potential* lapse found in conflicting statements and ambiguous log. Action bar *might* be cleared for *procedural review* based on the ambiguity itself being a finding, but *not* for concluding improper lubrication occurred.

  **Case 3: Solid Evidence, Finding: "Customer X's maintenance crew incorrectly installed the overload sensor, causing the failure."**
  *   **X:** Incorrect installation by Customer X's crew caused failure.
  *   **S:** **High/Extreme.** Severity of incident dictates (e.g., if injury/fatality, Extreme; major failure, High). Significant legal exposure (blame shifting), reputational risk with biggest customer, high probability of litigation/depositions.
  *   **E:** **Genuinely Solid:** Clear photos of incorrect wiring matching failure mode, data logs showing sensor misbehavior consistent *only* with that install error, sensor tested post-incident and functions correctly when wired properly. Customer's own (inexperienced) crew was documented as performing the install. No evidence of product defect or other causes.
  *   **T:** Evidence is **direct (photos), objective (logs, test), corroborated, eliminates alternatives.** Meets **Very High Confidence (High Stakes)**. If incident was a fatality (Extreme Stakes), assess if it meets Near Certainty (does a *tiny* doubt remain? Could lawyers *invent* a semi-plausible alternative?). Likely **Yes** for Extreme.
  *   **Wording (High Stakes):** **"Evidence demonstrates the overload sensor was incorrectly installed by the customer's maintenance crew, which directly caused the failure."**
  *   **Wording (Extreme Stakes - Fatality):** **"Evidence conclusively demonstrates the overload sensor was incorrectly installed by the customer's maintenance crew, which directly caused the failure."** OR **"Investigation confirmed incorrect installation..."** (Use "We know" *only* if legally comfortable - the evidence *is* strong enough philosophically for Extreme stakes, but Legal might prefer the stronger verbs).
  *   **Action:** **Action Bar CLEARED.** Report finding per above. Engage Customer X with evidence. Review sales/install documentation clarity. *Crucially: The customer relationship stake does NOT lower the evidence bar for the truth claim.* The high *external* stakes from the incident severity *raise* the reporting bar, but the *solid evidence clears it*.

  **Final Advice:**
  1.  **Document the Process:** For each finding, briefly note your Stakes assessment and Threshold judgment in your investigation notes. This is your audit trail.
  2.  **Pre-Brief Legal:** Walk them through *this procedure* and your example cases. Get buy-in on the *framework* and the stakes-driven wording tiers *before* the next big incident. Frame it as risk management.
  3.  **Separate the Bars:** Consistently ask: "Is the evidence strong enough to *state this as fact* in a future deposition?" (Reporting Bar). Separately ask: "Is the evidence strong enough to warrant *changing our process/equipment/training*?" (Action Bar). The action bar is often lower, especially for preventive measures.
  4.  **Embrace Fallbacks:** Using "Evidence demonstrates..." or "Investigation determined..." in high/extreme stakes, even with good evidence, is **prudent and defensible**. Reserve "We know" for the clearest, lowest-risk findings or when evidence is truly irrefutable under extreme scrutiny.

  This procedure forces explicit consideration of stakes and evidence quality, provides clear output options, separates declaration from action, and proactively defends against the deposition context. It makes the implicit judgment calls explicit and defensible.
