prompt: |-
  I run a small theory group — myself and two postdocs, three years of funding — inside an organisation that produces quantitative long-run risk estimates for policy. Our work is currently Bayesian, and we are deciding whether to move the group's core formalism over to imprecise probabilities. I want an agenda rather than a survey: which open questions in imprecise probability theory most deserve the group's three years, ranked, with the ranking defended.

  Three constraints fix what "deserves" means here. First, upstreamness: we would rather settle something that other work depends on than add one more application. Second, tractability for a small theory team with no empirical apparatus of its own — we can prove things and build toy decision problems, but we cannot run experiments. Third, practical consequence: we care about questions whose answer would change what a risk assessment actually reports or recommends.

  Please treat the following as candidate items, but feel free to add, merge or dismiss them: (a) dilation — whether it is a defect of the formalism or a correct verdict on evidence that genuinely says nothing about a target quantity; (b) how far imprecision washes out under learning, and whether there are conditions under which learning reliably widens a credal set rather than narrowing it; (c) the choice among decision rules — maximality, E-admissibility, Γ-maximin and the family around it — and whether that choice is a substantive normative commitment or an accounting device; (d) sequential decision making, where imprecision combined with conditioning appears to make dynamic consistency hard to preserve; (e) the computational cost of representing and updating credal sets, and whether the interesting cases are tractable at all.

  Two ideas I would like you to engage with, both mine and both rough. The first is what I call imprecision laundering: converting an imprecise model into a decision by a maximin-style rule may smuggle in a sharp and arbitrary prior over worst cases, so that imprecision buys honesty in the modelling and loses it again at the point of decision. Is that a real problem, and is it the same problem as (c) or a different one? The second is the value of imprecision, by analogy with the value of information: are there conditions under which widening a credal set — deliberately, beyond what the evidence forces — yields better decisions, or is imprecision always a cost one pays for honesty? If there is a result to be had here, I should like to know what shape it would take.

  Finally, say which of these questions are genuinely open and which only look open because the field has quietly moved on, and tell me what result or development over the next two years ought to move each item up or down the ranking. No reading list, please; I want the argument.
reasoning: |-
  Okay, the user runs a small theory group with two postdocs and three years of funding. They focus on quantitative long-run risk estimates for policy and are considering switching from Bayesian to imprecise probabilities. They want a prioritized agenda of open questions in imprecise probability theory, ranked by upstreamness, tractability, and practical consequences.

  First, I need to understand their constraints. Upstreamness means prioritizing foundational issues that other work depends on. Tractability is crucial since they're a small team without empirical apparatus—so they need problems solvable through proofs and toy models. Practical consequence requires answers that would change risk assessments or recommendations.

  The user provided candidate items: (a) dilation, (b) learning dynamics, (c) decision rules, (d) sequential decisions, and (e) computational cost. They also introduced two ideas: imprecision laundering and the value of imprecision. I need to rank these, defend the ranking, address their ideas, and indicate which are genuinely open.

  Starting with upstreamness. Decision rules (c) are fundamental because every application requires choosing a rule. If unresolved, it affects everything downstream. Dilation (a) and learning (b) also have broad implications. Sequential decisions (d) are critical for dynamic models, and computational cost (e) affects feasibility. Their idea on imprecision laundering ties into (c), so merging that makes sense. The value of imprecision is a new angle but might be less upstream.

  Tractability: Theoretical work suits their strengths. Decision rules (c) can be explored through axiomatic approaches and counterexamples. Dilation (a) and learning (b) involve mathematical proofs. Sequential decisions (d) might require more complex modeling but still doable. Computational cost (e) could involve complexity theory, which is theory-friendly. The value of imprecision might need more applied work, which they can't do, so it's less tractable.

  Practical consequences: If decision rules (c) are unresolved, risk assessments might give arbitrary recommendations, directly affecting reports. Dilation (a) could mislead by showing increased imprecision after updating, impacting how evidence is incorporated. Learning dynamics (b) affect long-term predictions. Sequential decisions (d) are crucial for policy steps over time. Computational limits (e) might force simplifications, altering results. The value of imprecision could influence whether to introduce deliberate imprecision, but it's more speculative.

  Ranking: 

  1. Decision rules (c) plus imprecision laundering. This is the core normative issue. Resolving it dictates how decisions are made, affecting all applications. It's tractable through theoretical analysis. The laundering problem shows that current methods might reintroduce arbitrariness, which is a practical concern for honest reporting.

  2. Learning dynamics (b). Understanding when imprecision grows or shrinks affects long-run risk estimates. If learning sometimes increases imprecision, that changes how models update with new data. This has high practical impact and is tractable via mathematical examples.

  3. Dilation (a). It's a specific phenomenon that could undermine trust if seen as a flaw. Clarifying its normative status (bug vs. feature) guides modelers. However, it might be a subset of learning dynamics, so it's slightly less upstream.

  4. Sequential decisions (d). Vital for dynamic policies, but solutions might depend on decision rules (c). If (c) is resolved, (d) becomes more pressing. Currently, it's a known challenge with partial fixes.

  5. Computational cost (e). While important, tractability questions might be too niche. If they can show specific cases are feasible, it could move up, but for now, it's lower.

  6. Value of imprecision. Interesting but less urgent. It's more about strategic use, whereas their focus is on core formalism. Also, harder to tackle without experiments.

  Genuinely open issues: 

  - Decision rules: Still contentious. Axiomatic results could clarify normative status. 

  - Learning dynamics: Conditions for widening/narrowing aren't fully characterized. 

  - Dilation: Debate on whether it's a flaw continues. 

  - Sequential decisions: Dynamic consistency under various rules is unresolved. 

  - Computation: Tractable representations for general credal sets are limited. 

  The value of imprecision is open but might require different methods.

  Developments that could reshuffle rankings: 

  - If a breakthrough in decision rules (c) occurs, sequential (d) might rise. 

  - If learning dynamics (b) show that dilation is unavoidable, it could elevate (a). 

  - New computational techniques could push (e) higher.

  Their imprecision laundering idea is part of (c) and adds depth. The value of imprecision is distinct but lower priority given constraints.
answer: |-
  Here is a ranked agenda for your group, designed for maximum impact within your constraints. The ranking prioritizes **upstream foundational questions** whose resolution would reshape the field, leverages your **strength in theory/toy models**, and focuses on **practical consequences for risk reporting**. I've integrated your two ideas, dismissed one candidate item, and flagged genuinely open questions. The ranking is defended by immediate tractability and potential to change risk assessments.

  ### Core Ranking & Defense
  1.  **(c) Decision Rules + Imprecision Laundering**  
      **Why #1:** This is the *most upstream and consequential* open problem. Every application of imprecise probabilities (IP) requires a decision rule (Γ-maximin, maximality, etc.). The choice isn't cosmetic—it directly determines risk estimates and recommendations. Your "imprecision laundering" critique is spot-on and *part of this problem*: Γ-maximin injects a hidden, arbitrary worst-case prior, potentially negating the honesty IP provides. Maximality avoids laundering but may yield indecision.  
      - **Practical Consequence:** Resolving this changes *what number gets reported*. Is the output a robust minimax loss (laundered)? A set of admissible actions (transparent but complex)? Or something else? Policy clients need clear, justifiable outputs.  
      - **Tractability:** Ideal for theory work. Prove impossibility theorems (e.g., "no decision rule satisfies X,Y,Z simultaneously"). Build toy decision problems showing how rules diverge under ambiguity. Axiomatic analysis (e.g., what normative principles force Γ-maximin vs. maximality?) is tractable.  
      - **Genuinely Open:** Yes. No consensus exists; debates are live (e.g., Seidenfeld vs. Walley adherents). The laundering angle is underexplored.  
      - **What Could Move It:** A concrete impossibility result linking laundering to specific rules (e.g., "Γ-maximin *always* smuggles in a sharp prior equivalent to [condition]") would escalate urgency. A normative justification for one rule in policy contexts would be transformative.

  2.  **(b) Learning Dynamics (Washout/Dilation Growth)**  
      **Why #2:** Directly impacts *how risk assessments evolve with evidence*. If IP models often "wash out" to precise probabilities, IP adds little value. If they systematically *dilate* or *widen* under learning, this challenges conventional Bayesian updating and forces modelers to report growing uncertainty—a critical practical consequence.  
      - **Practical Consequence:** Determines whether long-run risk estimates become *more* or *less* precise with data. If widening is common, assessments must communicate increasing uncertainty, altering policy timelines (e.g., "wait for more data" vs. "act now").  
      - **Tractability:** Perfect for proofs and toy models. Characterize necessary/sufficient conditions for washout (e.g., what likelihood/prior set structures guarantee narrowing?). Construct minimal examples where learning *reliably* widens credal sets (beyond dilation anecdotes).  
      - **Genuinely Open:** Partially. Washout has results (e.g., under strict independence) but lacks general conditions. Systematic widening is poorly understood; dilation is seen as pathological, but your "correct verdict" view needs formalization.  
      - **What Could Move It:** A theorem showing widening is *inevitable* under common evidence structures (e.g., with partial identification) would rocket this to #1. Conversely, finding general washout conditions would marginalize IP.

  3.  **(d) Sequential Decisions & Dynamic Consistency**  
      **Why #3:** Policy is inherently sequential. If IP sacrifices dynamic consistency (i.e., plans made today are abandoned tomorrow despite unchanged information), recommendations become untrustworthy. Fixing this could enable IP for long-term risk (e.g., climate pathways).  
      - **Practical Consequence:** Enables IP models for multi-stage policies without self-sabotaging updates. Failure means IP is unusable for dynamic risks.  
      - **Tractability:** Workable with theory/toy models. Extend existing consistency results (e.g., for Γ-maximin) to new rules. Test consistency in toy sequential decisions (e.g., resource allocation over time).  
      - **Genuinely Open:** Yes, but narrow. Consistency is solved for some rules (e.g., Γ-maximin epic) under specific conditions, but open for others (maximality). Your group could unify fragmented results.  
      - **What Could Move It:** A negative result (e.g., "no IP update rule satisfies consistency with maximality") would lower priority. A general framework guaranteeing consistency for a practical rule (e.g., E-admissibility) would elevate it.

  4.  **(a) Dilation (Normative Status)**  
      **Why #4:** Dilation is a symptom, not the disease—it's a special case of (b). However, its *normative interpretation* ("bug" vs. "feature") affects whether IP models are deemed reliable. Resolving this legitimizes or disqualifies IP for critical applications.  
      - **Practical Consequence:** If dilation is a defect, modelers avoid IP (or specific models) to prevent counterintuitive uncertainty growth. If it's correct, assessments must flag when evidence *deserves* increased imprecision.  
      - **Tractability:** Straightforward for theory. Formalize "genuinely says nothing" as an axiom and prove if dilation violates it. Build dilation toy models in policy-relevant contexts (e.g., missing data).  
      - **Genuinely Open:** Superficially yes, but resolving (b) may answer this. The debate is stagnant, not resolved.  
      - **What Could Move It:** Embedding dilation within (b) as a key test case could merge them. Proving it only occurs in "unreasonable" credal sets would demote it; showing it’s unavoidable in policy-relevant cases would boost it.

  5.  **The Value of Imprecision**  
      **Why #5:** Your novel idea—analogous to value of information—is high-risk/high-reward. If widening credal sets *improves* decisions in some settings (e.g., by preventing overcommitment), it transforms imprecision from a cost to a tool. But it's less upstream than #1–3.  
      - **Practical Consequence:** Justifies deliberately under-specified models for robust decisions. Could change how risk assessments are scoped (e.g., "add ambiguity here to avoid brittle plans").  
      - **Tractability:** Harder but feasible. Define "value" via regret minimization in toy decision problems. Compare outcomes under precise vs. deliberately imprecise models.  
      - **Genuinely Open:** Underexplored. Most work assumes imprecision is costly; your framing is fresh.  
      - **What Could Move It:** A theorem showing "modest imprecision strictly dominates precision in [class] of decisions" would make this #2. Conversely, proving it never helps would kill it.

  6.  **(e) Computational Cost**  
      **Why #6 (Dismissed):** While vital, this is downstream for your group. Complexity results exist (e.g., inference in credal nets is often NP-hard). Your team lacks the CS focus to advance this beyond known results. Practitioners already use approximations (e.g., finite credal sets), so breakthroughs here won't change reports—they'll just use faster heuristics. Focus elsewhere.

  ### Agenda Structure for 3 Years
  - **Year 1:** Attack #1 (Decision Rules + Laundering) and #2 (Learning Dynamics). These are foundational. Progress here frames everything else.  
  - **Year 2:** Based on Year 1:  
    - If #1 shows Γ-maximin is laundering-prone, pivot to #3 (Sequential) for alternatives.  
    - If #2 shows systematic widening, dive into #4 (Dilation) as a key case.  
    - If "value of imprecision" (#5) has low-hanging fruit, explore it.  
  - **Year 3:** Synthesize results into a coherent "IP for risk assessment" framework. Test decisions/rules in toy policy problems (e.g., catastrophic risk with deep uncertainty).

  ### Why This Ranking Wins Within Constraints
  - **Upstreamness:** #1–3 define the core IP workflow (how to decide, learn, and plan). Fix these, and applications follow. #4–5 are derivatives.  
  - **Tractability:** All top items require proofs and toy models—no experiments or big code. Laundering (#1) and learning (#2) are ripe for axiomatic/counterexample work.  
  - **Practical Consequence:** #1 changes reported outputs. #2 changes how uncertainty evolves. #3 enables dynamic policies. These directly alter risk assessments.  

  Focus your fire on #1 and #2. If you crack decision rules and learning, your three years will reshape how IP is used in policy—not just add another application.
