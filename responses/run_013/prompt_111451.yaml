prompt: |-
  I'm a program officer at a mid-sized foundation that funds global health and development work, and every grant cycle my committee gets dragged into the same unwinnable fight. It's always some version of: do we fund the thing that saves lives, which means more people end up existing, or the thing that makes the people who already exist better off? Or: is it better to give a tiny boost to a huge number of people, or a big boost to a smaller number? Someone on the board read some population ethics last year and now everyone's paralized, because depending on wether you go by total welfare, average welfare, or one of the views that puts a floor under how bad a life can be before it counts, the answer flips. We're never going to agree on the theory and honestly we don't need to.

  Here's what I actually want, and it's not a philosophy lecture. Give me a decision procedure my committee can actually run on a proposal that (1) tells us whether the proposal is one where all the main views agree, in which case we can fund it or kill it without settling anything, and (2) tells us when a proposal really does force the theory fight, and for those, lays out what each main view says so we at least know what we're choosing between. I need the steps in order, what counts as a good enough answer at each step, where the procedure gives a clean no, and where it has to stop and hand the call to the board because it's a values question wearing a costume.

  Constraints: we've got about a week per cycle, none of us are philosophers, the board signs off on anything over $2M, and the proposals are messy -- we can't measure well-being, we can't know how many future people a given project causes to exist, and half the time we're comparing a project that helps 50,000 people a lot with one that helps 5 million people a little.

  Run the procedure on three of them: (a) deworming that measurably improves the health of a few million kids who were going to exist anyway; (b) a program that cuts infant mortality in one region, which everyone wants to call a success but which also means more people alive down the line; (c) a cheap intervention that gives a barely-noticeable benefit to a staggering number of people. Then tell me straight where this procedure is going to spit out an answer we all hate, and what would actually change your mind about the procedure itself -- what argument or piece of evidence would make you rewrite it.
reasoning: |-
  Okay, let me start by really understanding what this program officer is dealing with. They work at a foundation focused on global health and development, and every grant cycle, their committee gets stuck in these philosophical debates about population ethics. The core issue is the tension between saving lives (which might increase population) versus improving quality of life for existing people. They also struggle with whether to help a lot of people a little or a few people a lot. 

  The board got exposed to population ethics theories like total utilitarianism, average utilitarianism, and theories with a floor for quality of life. Now, every decision is paralyzed because each theory points to different conclusions. The user doesn’t want a philosophy lecture—they need a practical decision procedure. The key requirements are: first, identify proposals where all major ethical views agree, allowing quick decisions. Second, for contentious proposals, clearly map out what each view says so the committee knows exactly what values they’re choosing between.

  Constraints are tight: about a week per cycle, no philosophers on staff, board approval needed for big grants, and messy data (can’t measure well-being precisely, uncertain about future populations, often comparing vastly different scales of impact). 

  The user wants the procedure tested on three examples: (a) deworming that helps existing kids, (b) reducing infant mortality (saves lives but increases population), (c) a tiny benefit to a huge number. They also want honesty on where the procedure might produce unpopular outcomes and what evidence could change the approach.

  Breaking this down, the real pain point is decision paralysis. The committee needs a way to bypass theoretical debates when possible and structure them when unavoidable. The proposed solution must be operational—philosophy as a tool, not a discussion. 

  The decision procedure should start by assessing agreement across theories. If total, average, and prioritarian views all align, greenlight or reject without debate. If they clash, proceed to step two: explicitly contrast what each theory recommends, forcing the committee to acknowledge they’re making a values-based choice. 

  For the three test cases: 
  - Deworming (a) is straightforward—all theories agree since it improves lives without affecting population. 
  - Reducing infant mortality (b) is contentious; total utilitarians support it (more lives saved), average utilitarians might oppose (if new lives lower average welfare), prioritarians depend on context. 
  - The tiny benefit intervention (c) is tricky; total utilitarians approve (large total gain), average and prioritarian might reject if the per-person gain is trivial. 

  The procedure will likely spit out unpopular answers when small gains to many people outweigh significant gains to few—e.g., funding (c) over a life-saving surgery for thousands. This prioritizes efficiency over equity, which feels counterintuitive. 

  What would make me change the procedure? Evidence that "barely noticeable" benefits compound or create systemic change (e.g., minor nutrition boosts leading to economic mobility), or data showing that neglected populations (prioritarian focus) suffer irreversible harm without targeted aid. Also, if measuring downstream population effects becomes feasible, the uncertainty handling in step 1b needs refinement.
answer: |-
  Here’s a practical **Population Ethics Triage Procedure (PETP)** designed for your constraints. It prioritizes identifying consensus and clarifying disagreements without requiring philosophical expertise. The steps are sequential—stop early if you get a clear answer.

  ---

  ### **The PETP Flowchart**
  1. **Does it affect future population size?**  
     - *If NO → Go to Step 2.*  
     - *If YES → Proceed to Step 1b.*  
     - **Good enough answer:** Use demographic projections from the proposal or historical analogs (e.g., "This vaccine program in Region X reduced under-5 deaths by 20%, leading to ~5% population growth over 20 years").  
     - **Uncertain?** Flag as "high uncertainty" but proceed.  

     **1b. Does it clearly improve quality of life (QoL) for new potential lives?**  
     - *If YES → Go to Step 2.*  
     - *If NO/UNCERTAIN → Stop. Hand to Board.*  
     - **Example:** A contraception program reduces population growth *while* improving women’s health → Clear QoL gain.  
     - **Red flag:** Projects that *only* increase births without QoL data (e.g., "more births = more workers") force a values fight.

  2. **Is the per-person benefit "non-trivial"?**  
     - *Define "trivial":* ≤1% improvement in a measurable welfare proxy (income, health, education) or below detection thresholds in RCTs.  
     - *If NON-TRIVIAL → Go to Step 3.*  
     - *If TRIVIAL → Proceed to Step 2b.*  
     - **Good enough answer:** Use the proposal’s own metrics (e.g., "deworming boosts school attendance by 25%" = non-trivial).  

     **2b. Is there evidence of compound/aggregate effects?**  
     - *If YES (e.g., tiny income boosts lift community GDP) → Go to Step 3.*  
     - *If NO → Stop. Likely kill the proposal.*  
     - **Red flag:** "Helps 50M people with 0.1% income increase and no spillover effects" fails here.

  3. **Run the "Three Views Sniff Test":**  
     Compare the proposal against simplified criteria for three major views:  
     - **Total View:** Total welfare ↑ = Good (favors more lives + non-trivial gains).  
     - **Average View:** Average welfare ↑ = Good (favors fewer/higher-QoL lives).  
     - **Prioritarian View:** Focuses on worst-off; rejects trivial gains to well-off.  

     **Consensus?** If all 3 agree → **Fund/Kill with confidence.**  
     **Disagreement?** → **Hand to Board with this cheat sheet:**  

     | View          | Supports If...                       | Rejects If...                          |  
     |---------------|--------------------------------------|----------------------------------------|  
     | Totalist      | More people + net welfare gain      | Welfare loss, even if average QoL ↑    |  
     | Averagist     | QoL ↑ per person, esp. if pop. stable| More people with below-average QoL     |  
     | Prioritarian  | Significant help to worst-off       | Trivial gains to many, ignoring destitute |  

  ---

  ### **Applied to Your Examples**
  **Proposal (a): Deworming 2M existing kids**  
  - Step 1: No population change → Go to Step 2.  
  - Step 2: Non-trivial benefit (health/school attendance ↑) → Step 3.  
  - Sniff Test: All views support (welfare ↑, no population effect, helps disadvantaged kids).  
  **→ OUTPUT: Fund. Consensus achieved.**  

  **Proposal (b): Cut infant mortality (→ more future people)**  
  - Step 1: Population ↑ → Step 1b: Improves QoL? (Yes: surviving children healthier) → Step 2.  
  - Step 2: Non-trivial benefit → Step 3.  
  - Sniff Test:  
    - Totalist: Supports (more lives + net welfare gain).  
    - Averagist: Opposes if new lives have below-average QoL (likely in poor regions).  
    - Prioritarian: Supports if targeting high-mortality (worst-off) areas.  
  **→ OUTPUT: Hand to Board. Disagreement between Totalist (fund) vs. Averagist (kill).**  

  **Proposal (c): Tiny benefit to 100M people**  
  - Step 1: No population change → Step 2.  
  - Step 2: Trivial benefit (e.g., 0.2% income ↑) → Step 2b.  
  - Step 2b: No evidence of compounding → **OUTPUT: Kill. Fails triviality threshold.**  

  ---

  ### **Where This Procedure Will Spit Out Unpopular Answers**
  1. **Killing trivial-gain megaprojects:** A $1B proposal giving 0.1% QoL bumps to 1B people will be rejected without debate. *Why?* Evidence shows "barely noticeable" gains rarely compound, and this avoids diverting funds from high-impact work.  
  2. **Greenlighting some population-increasing projects:** If reducing infant mortality clearly improves QoL (Step 1b), PETP flags it for Board debate—but Totalists may outvote Averagists. Critics will argue "This exacerbates overpopulation!"  

  ---

  ### **What Would Make Me Rewrite PETP**
  1. **Evidence that "trivial" gains reliably compound:** If rigorous studies show micro-benefits (e.g., deworming’s tiny income effects) consistently snowball into large lifetime gains, Step 2/2b becomes flawed.  
  2. **Tools to quantify long-term QoL for new lives:** If AI demography models could project that "children saved by this program live at 80% regional QoL," Step 1b transitions from guesswork to data.  
  3. **Proof that prioritarianism changes outcomes:** If foundations adopting PETP start consistently neglecting the worst-off (e.g., slum dwellers) for "high-total-impact" projects, Step 3 needs reweighting.  

  **Bottom line:** PETP doesn’t solve ethics—it quarantines unproductive debates and forces transparency. Use it to spend <10% of committee time on philosophy, and 90% on measurable impact. If your Board still deadlocks? Split the grant and test rival theories in the field.
