  After studying the money pump, an agent proudly announces: "I've avoided the drain! I refused the first trade, kept A, and saved three pennies!"  

  **Punchline:**  
  "...Now excuse me while I stare longingly at C."  

  *(Alternative punchline for the resolute approach: "...So I paid three pennies upfront to *not* prefer the trade I now prefer.")*
