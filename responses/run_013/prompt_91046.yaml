answer: |-
  Right, let's dissect *Amadeus* through the lens you've provided – Plutarchan biography, hagiography, and the philosophy of learning from lives – and see what carnage Shaffer (and Forman) wreak. Forget the historical inaccuracies; they're irrelevant here. The film is a *myth* about genius, mediocrity, envy, and the very act of *interpreting* a life. And it uses your traditions precisely to dismantle them.

  1.  **Plutarch Subverted: The Biographer's Poisoned Pen**
      *   **The Plutarchan Claim:** Character revealed through small acts/jests/virtues/vices, offering moral instruction via comparison ("Parallel Lives").
      *   **Amadeus' Brutal Twist:** Salieri *is* the Plutarchan biographer. He meticulously observes Mozart, dissecting his laugh ("obscene giggle"), his language ("I am a vulgar man!"), his childishness with Constanze, his disrespect for the Archbishop. He *intends* to find the small signs revealing vice, proving God unjust for gifting *this* vessel with genius.
      *   **The Method Corrupted:** But Salieri isn't dispassionate. His observation is fuelled by *envy* and a desire for *moral validation*. He *wants* Mozart to be morally bankrupt to justify his own hatred and sense of divine betrayal. The "small signs" (the giggle, the scatology) become proof *only* because Salieri filters them through his own bitterness. He *constructs* a Plutarchan portrait of depravity to serve his narrative.
      *   **The Manuscript Scene - Method Turned Inside Out:** This is the crux. Salieri *does* read character from a "small sign" – the perfect, uncorrected manuscript. Plutarch would approve! But *what* does he read? Not a virtue like diligence or humility, but the terrifying, effortless, *inhuman* channeling of divine genius. The method works technically (he infers Mozart's unique nature), but the *moral lesson* Salieri draws is one of cosmic cruelty and his own damnation, not emulation. The object (genius) is too vast, the observer (envious mediocrity) too flawed for Plutarchan moral instruction to function cleanly. The method reveals truth, but it's a truth that *destroys* the observer morally.
      *   **The Parallel Life - A Tragedy of Comparison:** Salieri explicitly sets up the parallel: the pious, hard-working, moral Salieri vs. the obscene, profligate Mozart. Plutarch intends such comparisons to illuminate virtue. Here, the comparison highlights only the unbearable injustice Salieri perceives. The "loser" narrating the comparison ensures it becomes a testament to failure and divine mockery, not a guide to living well. Plutarchan comparison, in the hands of the vanquished, breeds only nihilism.

  2.  **Hagiography Inverted: The Patron Saint of Resentment**
      *   **The Hagiographic Claim:** Presenting an idealised, flawless life (the Saint) as a model for emulation and devotion, inspiring moral/spiritual elevation.
      *   **Amadeus' Savage Irony:** The film ends not with Mozart's sanctification, but with Salieri's *self*-canonisation as the **"Patron Saint of Mediocrities"**. This is hagiography turned on its head, dripping with bitter irony.
      *   **The "Blessing" Scene:** Salieri, wheeled through the madhouse, isn't offering solace or inspiration. He's offering *absolution* for failure. He blesses the inmates not to elevate them towards virtue, but to *validate* their (and his own) mediocrity and resentment. His "sainthood" is founded on *envy* and the rejection of the divine gift he witnessed. It's a hagiography of the *anti-saint*, celebrating not virtue but the *refusal* to aspire to the unattainable, offering comfort in shared inadequacy rather than challenge towards the good. He becomes the martyr to genius, demanding devotion from those who also feel cheated. This is the ultimate perversion of the form – a saint whose "virtue" is defined by *not* being Mozart, offering not hope but cynical resignation.

  3.  **Learning from Lives: Does it Work? The Film's Bleak Answer**
      The sceptic (your friend) says exemplars only make us feel bad. *Amadeus* goes further:
      *   **Exemplars Can Be Unbearable:** Mozart, as presented *through Salieri's eyes*, isn't just an impossible standard; he's proof that virtue (Salieri's piety, hard work) is irrelevant to genius. He's an exemplar whose *existence* is a moral affront to the observer. Learning from him, for Salieri, means learning despair.
      *   **The Biographer's Lens is Fatal:** The film argues *vehemently* that the *source* of the life-narrative matters profoundly. A biographer consumed by envy (Salieri) doesn't just distort facts; he distorts the *moral potential* of the narrative. He turns the life into a weapon against the audience (the priest, the inmates, us) and himself. Plutarch assumes a benevolent, didactic narrator. Salieri proves that assumption fatal. You cannot learn virtue from a life narrated by vice.
      *   **The Dictation Scene - The Price of Witnessing:** This scene crystallises the horror. Salieri takes dictation for the *Confutatis* – the genius flowing directly from the dying, degraded Mozart. Salieri isn't learning *from* Mozart's life here; he's *participating* in its culmination, acting as scribe to the divine voice he both worships and loathes. What he "learns" in this moment is the terrifying, annihilating power of the genius he lacks. It's not instruction; it's crucifixion. He learns only the depth of his own loss.
      *   **The Masked Ball - The Illusion of Knowing:** The figure Salieri initially admires (Leopold's cloak, the mask) *is* Mozart – the small, giggling obscenity. This shatters his Plutarchan hope that outward dignity signifies inner worth or divine favour. It teaches him that signs are utterly unreliable, that the divine hides in the vulgar. What lesson is there but distrust and disillusionment?

  **Does the Reading Survive the Fantasia? Absolutely.**

  The film's power *depends* on it being a fantasia. Historical truth would muddy the pure, mythical argument Shaffer is making about the *experience* of encountering genius from the outside. The real Salieri's competence is irrelevant; the film *needs* him as the archetype of the talented but ultimately mediocre artist confronting the incomprehensible sublime. The fantasia allows the themes – the corruption of biography by envy, the inversion of hagiography, the peril of the "exemplar" – to be explored with operatic intensity and symbolic clarity.

  **What the Film Adds That Philosophy Can't:**

  Philosophy can argue abstractly about exemplars, bias, envy, and the pitfalls of biography. *Amadeus* makes you *feel* it.
  *   **The Visceral Sting of Envy:** F. Murray Abraham's performance *is* the argument against dispassionate Plutarchan observation. You see envy twisting perception, poisoning admiration, driving narration.
  *   **The Awe and Terror of Genius:** The music, the performance, the sheer *presence* of Mozart (as filtered through Salieri) makes tangible the overwhelming power of the exemplar that philosophy can only describe. You understand why Salieri is destroyed.
  *   **The Irony and Theatricality:** The film uses its form – the confession, the flashbacks, the operatic staging (like the masked ball, the final blessing) – to enact the *performance* of biography and sainthood. It shows the *construction* of the narrative, the deliberate framing for effect (Salieri manipulating the priest, appointing himself saint). Philosophy explains unreliability; the film *performs* it.
  *   **The Ambiguity:** Does Mozart *deserve* his genius? Is Salieri *only* a villain? The film leaves these questions painfully open, forcing the viewer into a position analogous to Salieri – interpreting ambiguous signs, wrestling with uncomfortable feelings. Philosophy seeks resolution; the film immerses you in the messy, unresolved *experience* of confronting another life.

  **Conclusion: A Warning, Not a Dismissal**

  *Amadeus* doesn't prove you *can't* learn from lives. It proves it's *dangerous*. Plutarch's method *can* reveal character, but in the hands of a flawed, envious observer like Salieri, it becomes a tool for self-destruction and the propagation of resentment. Hagiography *can* inspire, but its inversion – the canonisation of mediocrity and envy – offers a seductive, poisonous comfort that absolves us of striving. The film shows that the value of an exemplar depends entirely on the moral and emotional state of the one encountering it. A life presented as an exemplar can be a ladder to virtue, a mirror of despair, or, as in Salieri's case, the fuel for a bonfire of nihilistic self-immolation. It vindicates the sceptic only insofar as it shows how catastrophically wrong learning from lives *can* go when the learner is corrupted. The lesson of *Amadeus* is: beware the biographer within yourself. Next time your friend shouts, tell him Salieri proves that learning from lives requires a purity of heart that mediocrity – and envy – will always corrupt. The method isn't flawed; *we* are. That’s what makes it so terrifyingly potent.
