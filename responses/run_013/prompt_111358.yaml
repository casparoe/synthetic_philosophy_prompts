answer: |-
  Based on your colleague's pattern of verdicts, we can identify two plausible rules she *might* be running. Her actual rule seems ambiguous because her judgments rely on two distinct (but sometimes overlapping) criteria: **manipulability/experimental interaction** and **structural continuity/survival into successor theories**. Here's the breakdown:

  1.  **Rule A: The "Manipulability & Structural Role" Rule (Strong Realism)**
      *   **Rule:** An entity/posit is real if it **either** (a) can be *directly manipulated or isolated in experiment* **or** (b) plays an *indispensable structural role in successful theories* that survives significant theory change, *even if* direct manipulation isn't (yet) possible.
      *   **Fits Verdicts:**
          *   Phlogiston/Caloric: Neither manipulable nor structurally indispensable/surviving. → **Fiction.**
          *   Luminiferous Ether (Mechanical Medium): Not manipulable. *But* its equations (the wave structure/field concept) were indispensable and survived. → **Equations/Structure Real, Specific Medium Fiction.**
          *   Newton's Absolute Space/Time: Not manipulable as absolutes. The *inertial structure* (embodied in the equations) was indispensable and survives in GR as a local approximation. → **Absolutes Fiction, Inertial Structure Real.**
          *   19th-C Chemical Atom: Not manipulable *as an individual atom* then, but played an indispensable structural role in chemistry (explaining stoichiometry, reactions) that survived into modern atomic theory. → **Real.**
          *   Electron: Directly manipulable (trapped, flung) AND structurally indispensable. → **Real.**

  2.  **Rule B: The "Structural Continuity is Paramount" Rule (Structural Realism)**
      *   **Rule:** An entity/posit is real if its *core defining structural or relational properties*, as captured mathematically or in its causal role within successful theories, *survive significantly into successor theories*. Manipulability is a *bonus confirmation* of reality for *some* entities, but *not necessary* for establishing reality if the structural role is fundamental and persistent.
      *   **Fits Verdicts:**
          *   Phlogiston/Caloric: Core defining properties (substance released/absorbed in combustion/heat) were *replaced*, not preserved. → **Fiction.**
          *   Luminiferous Ether (Mechanical Medium): The *specific mechanical properties* were discarded. However, the *mathematical structure* describing wave propagation in a medium (the field equations) and the *causal role* of "something" filling space to transmit waves *evolved* directly into the electromagnetic field concept. → **Equations/Structure Real, Specific Medium Fiction.**
          *   Newton's Absolute Space/Time: The absolutes were discarded. The *inertial structure* (embodied in the geodesic equations of motion) is preserved as a local limit in GR. → **Absolutes Fiction, Inertial Structure Real.**
          *   19th-C Chemical Atom: The core structural role (indivisible unit explaining combining weights/reactions) was *preserved and refined*, not discarded. → **Real.** (Manipulability irrelevant for this verdict).
          *   Electron: Core defining properties (charge, mass ratio, causal role in currents/radiation) were *preserved* through theory changes. Manipulability is a strong *confirmation* but not the sole basis. → **Real.**

  **Dark Matter Verdict Prediction:**

  *   **Rule A (Manipulability & Structural Role) Implication:** Dark matter fails criterion (a) - it cannot currently be isolated or manipulated. Its status under criterion (b) is arguable. It *is* currently indispensable structurally in the Lambda-CDM model and has made successful predictions (e.g., CMB power spectrum, Bullet Cluster). However, unlike the ether's equations or the chemical atom's role, **dark matter's *specific nature* (WIMP, axion, MOND/modified gravity?) is highly uncertain and may not survive.** If she interprets "structural survival" strictly as needing identifiable elements to persist, she might lean **Fiction**. If she interprets it as the *need for an unexplained gravitational source* persisting, she might lean **Real**. **Prediction:** Leans **Fiction** due to lack of manipulability *and* uncertainty about the specific structure surviving intact. ("It plays a role now, but we can't touch it and we don't know *what* it really is yet").
  *   **Rule B (Structural Continuity is Paramount) Implication:** Dark matter's *core defining role* (non-baryonic mass causing specific gravitational effects) is currently indispensable within the best cosmological model and has made verified predictions. Its gravitational signature *is* the structural property. The *specific particle identity* might change, but the *need for this type of mass component* seems robust across decades of model refinement. **Prediction:** **Real.** The persistent, successful structural role outweighs the current lack of manipulability and identity uncertainty. ("*Something* with *this gravitational effect* is undeniably real based on the structure of our models and their success, even if we haven't pinned down its exact nature or isolated it yet").

  **Best Guess & Reasons:**

  *   **Best Guess:** She will say dark matter is **Real.**
  *   **Reasons:**
      1.  **Precedent of the Chemical Atom:** Her verdict on the atom is the strongest parallel. Decades before manipulation or direct imaging, she deemed it real solely based on its indispensable *structural/explanatory role* in chemistry. Dark matter plays a similarly indispensable *structural/explanatory role* in cosmology. The lack of manipulability didn't matter for the atom then; it shouldn't matter for dark matter now under the same logic.
      2.  **Treatment of the Ether:** She separated the fictional mechanical medium from the real mathematical structure. For dark matter, the *gravitational evidence and role* are the current "mathematical structure/equations." The unknown particle nature is analogous to the unknown mechanical nature of the ether. She granted reality to the equations; she's likely to grant reality to the gravitational phenomenon.
      3.  **Focus on Predictive Success:** She highlighted the ether's equations surviving *because they predicted phenomena* (light behavior). Dark matter's role is credited with numerous successful predictions (galaxy rotation curves, cluster dynamics, gravitational lensing, CMB structure, large-scale structure formation). This predictive success within the model's structure strongly parallels her reasoning for the atom and the ether's equations.
      4.  **Avoiding Premature Fictionalization:** Calling it fiction now, while the evidence for *some form* of non-baryonic mass causing these effects is overwhelming within the model, would seem inconsistent with her "neither pessimist nor operationalist" stance, especially compared to clear fictions like phlogiston which were wholly replaced.

  **The Case that Separates the Rules:**

  *   **The Case:** **Quarks (c. 1964-1970s)**
      *   *Context:* Proposed by Gell-Mann and Zweig to explain the "particle zoo" via the Eightfold Way symmetry (SU(3)). They provided a brilliant structural explanation for hadron properties and relationships. Crucially, they were postulated as *confined* – permanently bound within hadrons and impossible to isolate or observe directly as free particles. This was a fundamental feature of the theory (Quantum Chromodynamics - QCD). Manipulation or isolation was deemed theoretically impossible.
      *   **Rule A (Manipulability & Structural Role) Verdict:** Quarks play an indispensable structural role in the Standard Model. *However*, they fail the manipulability criterion *in principle* (confinement). If manipulability is seen as necessary *unless* the structure survives in a very direct way, this might lead to **Fiction** ("useful mathematical fiction for classification"). If structural survival is sufficient despite confinement, it might be **Real**.
      *   **Rule B (Structural Continuity is Paramount) Verdict:** The core structural role of quarks (fractional charge, color charge, composing hadrons via SU(3) symmetry) was incredibly successful, explained vast amounts of data, and became fundamental to the Standard Model. Their properties were indirectly probed via deep inelastic scattering (hitting them *inside* protons). Confinement doesn't negate their reality; it's a property *of* the real entities. → **Real.**
      *   **Why it Separates:** Rule A *might* balk at declaring something real that is *fundamentally un-manipulable and un-isolable*, even if structurally vital. Rule B, focusing purely on the persistence and success of the structural role within the theory, readily accepts it as real despite confinement. Your colleague's verdict on quarks during the confinement era (before jets and asymptotic freedom provided strong indirect evidence of quark behavior) would clearly reveal which criterion is primary: manipulability or structural role. Given her atom verdict, betting on her saying quarks were real even under confinement seems likely, pointing to Rule B.
