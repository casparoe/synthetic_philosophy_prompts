prompt: |-
  I write a column on science and ideas, and I want a thought experiment for a piece that runs against the grain of the standard telling of Goodhart's law. The usual story is that any measure which becomes a target ceases to be a good measure; I want a case in which a metric is deliberately gamed by everyone subject to it and yet remains a faithful proxy for the thing we actually care about — the inverted outcome, reached honestly rather than by stipulation. Constraints: set it in an ordinary institution (a school, a hospital, a firm, a city agency), not a laboratory toy; no cartoonish fraud or sabotage; and the resilience has to fall out of a structural feature of how the measure relates to the goal, not out of the agents being unusually virtuous or well-intentioned. After the scenario, do the analysis: name the target and the metric, show what each plausible gaming move would do to the gap between them and why it fails to widen it, and say which single feature of the case is doing the work. Then tell me what happens if that feature is removed, and how a skeptic who thinks Goodhart's law is inescapable would try to recast my case as an ordinary instance of it after all.
reasoning: |-
  We are going to construct a thought experiment in an ordinary institution (a school) where a metric is gamed but remains a faithful proxy. The key is that the gaming actions, while intended to manipulate the metric, end up also improving the true goal because of the structural relationship between the metric and the goal.

  **Scenario: The School's Reading Program**

  **Setting:** A public elementary school. The school district has introduced a reading program to improve literacy. The true goal is to foster a **lifelong love of reading and deep comprehension skills** (the target). However, the district measures success by **the total number of books checked out from the school library per student** (the metric). 

  **The Problem:** The metric is easily gameable. Teachers and students might be tempted to game it by checking out many short, simple books to inflate the numbers without necessarily improving deep comprehension or love of reading.

  **The Twist:** Despite gaming, the metric remains a good proxy. How?

  **Structural Feature:** The school library has a curated collection. The library's collection development policy has been designed by expert librarians to include only high-quality children's literature and educational materials. The collection is divided into levels (by reading difficulty and age-appropriateness) and includes a variety of genres. Moreover, the library has a rule that a student cannot check out more than one book per day (to prevent mindless bulk checkouts). 

  **The Gaming Moves and Why They Fail to Widen the Gap:**

  1. **Gaming Move: Students check out many short, simple books.**
     - Why it fails: The library's collection is curated so that even short, simple books are of high quality and are designed to be engaging and age-appropriate. Reading many short books still exposes students to a wide range of vocabulary, story structures, and ideas. Moreover, the requirement of daily visits to the library (since they can only check out one book per day) increases the frequency of exposure to reading and the library environment, which in turn fosters reading habits. The act of choosing a book every day (even a short one) requires engagement and builds the habit of reading.

  2. **Gaming Move: Teachers assign "reading time" in class where students quickly flip through books without really reading them, just to check them out and return them.**
     - Why it fails: The library rule of one book per day per student and the requirement to return a book before checking out another one means that the book must be at least nominally engaged with for a day. Even if a student only flips through, they might catch an interesting illustration or a sentence, and the repeated exposure to books increases the chance of sparking interest. Also, the teachers, in order to satisfy the requirement of having students check out books, might structure the reading time to include sharing and discussion (which they do to make the time productive). This discussion component, even if initially motivated by the metric, leads to deeper engagement.

  3. **Gaming Move: Teachers encourage students to check out books that they have already read to quickly accumulate numbers.**
     - Why it fails: Re-reading is a known strategy to improve fluency and comprehension. It allows students to notice details they missed and increases their confidence. Moreover, the library's collection is large enough that students are likely to discover new books even when re-reading some old favorites. Also, the habit of re-reading can build attachment to books and characters, fostering a love of reading.

  4. **Gaming Move: Students check out books but don't read them at home (maybe just carry them back and forth).**
     - Why it fails: The school has a policy that during the daily 20-minute in-class reading period, students must read the book they have checked out. So even if they don't read at home, they are reading during that period. This ensures some reading happens. Also, the physical act of carrying the book and having it in their possession increases the likelihood of spontaneous reading.

  **Analysis:**

  - **Target:** Lifelong love of reading and deep comprehension skills.
  - **Metric:** Total number of books checked out per student.

  **Why the Gap Doesn't Widen:** The structural feature that makes this work is the **curation of the library collection combined with the one-book-per-day rule and the in-class reading period**. These create an environment where even the most obvious gaming strategies (like checking out short books) still lead to substantial exposure to quality literature and regular reading practice. The gaming actions, which are intended to inflate the numbers, end up also serving the true goal because they require daily interaction with the library and books, and the books available are all of a quality that is conducive to learning and engagement.

  **The Single Feature Doing the Work:** The **curated collection of high-quality books and the rules around book checkout and in-class reading time** together ensure that the metric (book checkouts) remains aligned with the true goal. The key is that the gaming actions are constrained by the structure in such a way that they cannot avoid also advancing the true goal.

  **What if the Feature is Removed?**

  Suppose the library collection is no longer curated: it includes many low-quality, poorly written books, or books that are too advanced or too childish. Also, remove the one-book-per-day rule and the in-class reading period. Now:

  - Students could check out 10 books at once and return them the next day without reading.
  - Teachers might assign the checkout of books that are not age-appropriate or engaging, leading to no real reading.
  - The metric would then become decoupled from the goal: high checkouts would not indicate any real reading or learning.

  **How a Skeptic Might Reinterpret This as Ordinary Goodhart:**

  A skeptic might argue that this example doesn't violate Goodhart's law because the metric (book checkouts) was never a pure proxy for the goal (love of reading and comprehension). Instead, the skeptic would say, the metric was *designed* to be robust by building in the constraints (curation and rules) that make the metric a good indicator. Therefore, the skeptic would say that the metric is actually a composite of two things: the raw number of checkouts *and* the quality of the collection and the rules. The skeptic would then claim that when we say the metric remains a good proxy, we are implicitly including the context (the curated collection and rules) as part of the metric. Thus, if we were to use the same metric (book checkouts) in a different context (without the curation and rules), it would become a bad metric. This, the skeptic would argue, is exactly Goodhart's law: the metric (without the context) is being gamed and becomes a bad measure. The fact that the context is necessary shows that the metric alone is insufficient and subject to Goodhart.

  **Conclusion:**

  The thought experiment shows that under specific structural conditions (a curated collection and rules that constrain behavior), even when agents game the metric by trying to maximize book checkouts in the easiest way, they end up advancing the true goal. The skeptic, however, would note that the metric's reliability is contingent on the institutional context and that without it, the metric would be subject to Goodhart's law. This suggests that the law can be mitigated by careful design of the environment in which the metric is used.
