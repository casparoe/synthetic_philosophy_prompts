answer: |-
  ### Essay Question (150 words)
  "Using Wittgenstein's concept of family resemblance, explain how the term 'book' could coherently extend from physical volumes to include digital files sharing no physical properties with their predecessors. Your essay must: (1) State precisely what family resemblance asserts about general terms and denies about disjunctive definitions (e.g., 'P ∨ Q ∨ R') and prototype theories; (2) Confront the objection that appealing to 'overlapping similarities' fails to distinguish genuine concepts from arbitrary collections, risking circularity; (3) Evaluate whether Wittgenstein’s appeal to 'shared practice' or 'grammar' resolves this objection by describing how concepts *actually* work, or whether it converts family resemblance into a methodological stance immune to empirical refutation."

  ---

  ### Model Answer (650 words)
  **(1) Assertions, Denials, and Distinctions**  
  Wittgenstein’s family resemblance account asserts that some concepts lack a single defining feature shared by all instances. Instead, instances form a network linked by overlapping similarities, no one of which is necessary. Crucially, it *denies* that such concepts are governed by disjunctive necessary-and-sufficient conditions (e.g., "X is a book if it has pages *or* is digital"). Disjunctions imply fixed criteria whose satisfaction guarantees membership, whereas family resemblance permits fluid, open-ended extensions based on contextual affinities. It also *denies* prototype theory: concepts are not applied by matching instances to a psychologically stored exemplar (e.g., a "typical book"). Prototypes imply a core representation, whereas family resemblance rejects any privileged instance or feature set. Meaning arises from public use in language-games, not private mental templates.

  **(2) The Objection: Resemblance is Too Cheap and Circular**  
  If any two things resemble each other arbitrarily (e.g., a tennis ball and the number 2 both share "not being a rhinoceros"), resemblance cannot individuate concepts. Calling "book" a family-resemblance concept seems vacuous: any gerrymandered collection (e.g., all things weighing <1kg on a Tuesday) could be linked by *some* similarity. Worse, specifying the "relevant" similarities appears circular: we might say early codices and e-books resemble each other "in being books," but this presupposes the concept it aims to explain. If resemblance alone cannot exclude arbitrary groupings or justify specific extensions, family resemblance fails as an account of conceptual unity.

  **(3) Resources and Evaluation: Practice vs. Method**  
  Wittgenstein’s reply hinges on rejecting extensionalism: concepts are not defined by their instances but by their *grammar*—the rules governing their use in communal practices. "Book" is not unified by similarities across objects *in vacuo*, but by how the word functions in human activities (reading, archiving, storytelling). When a digital file is called a "book," it enters the language-game via analogies to existing practices (e.g., "reading" a screen like a page), not via feature-matching. The extension from scrolls to codices to e-books occurs through cultural-historical contingencies of use, not logical disjunctions. The "relevant similarities" are those recognized as significant within the practice itself (e.g., "contains a narrative" or "is used for study"), grounded in shared purposes.  

  This appeal to practice resolves the circularity: resemblances are not prior to the concept but emerge from the practice that gives the word its life. Calling a cloud an "angry book" fails not because of missing features, but because it violates the grammatical rules sedimented in our form of life—rules manifested in how we teach, correct, and apply the term. The objection’s arbitrariness vanishes when resemblance is contextualized within normative practices.  

  However, this risks converting family resemblance into a methodological injunction rather than a substantive theory. If grammar is defined by use, and use is irreducible to general rules, then the account becomes immune to empirical counterexamples: any successful extension of "book" *ipso facto* proves its family-resemblance character. Critics might argue that this makes Wittgenstein’s view unfalsifiable—a recommendation to "look and see" how words work, not an explanation of *why* they work. Yet this understates its force. The account is descriptive in revealing that disjunctive/prototype models misrepresent the phenomenology of concept application: we do not consult checklists or prototypes when calling an e-text a "book." It is also normative in rejecting essentialist assumptions that distort philosophical inquiry. Its power lies in exposing essentialism as a projection of logical ideals onto fluid practices, not in providing a competing theory of concepts. Thus, while practice-based grammar escapes circularity by anchoring meaning in public criteria, it prioritizes therapeutic clarity over explanatory metaphysics.  

  **Conclusion**  
  Family resemblance withstands the circularity objection by tying concepts to practices, as demonstrated by "book": digital files are integrated through functional analogies in reading practices, not physical attributes. However, this success reorients the account from a theory of concepts to a reminder that meaning is forged in the rough ground of human activity, not abstract logic.  

  ---

  ### Marking Scheme (Total: 30 Marks)
  **First-Class Answer (21–30 marks) Must:**  
  - Correctly distinguish family resemblance from disjunctive definitions (denies fixed necessary/sufficient conditions) *and* prototype theory (denies psychological exemplars).  
  - Accurately state the "arbitrary resemblance/circularity" objection.  
  - Deploy Wittgenstein’s "practice" or "grammar" to resolve circularity by emphasizing normative use over extensional similarities.  
  - Argue that the digital "book" extension relies on functional roles in language-games (e.g., reading), not physical features.  
  - Critically evaluate whether practice converts the account into a methodological stance, acknowledging its descriptive/normative duality.  

  **Solid Second-Class Answer (15–20 marks):**  
  - Distinguishes family resemblance from essentialism but conflates disjunctive/prototype views or omits one.  
  - States the circularity objection but responds with vague appeals to "context" without articulating practice/grammar.  
  - Describes the "book" example accurately but lacks analysis of how practice resolves circularity.  
  - Treats family resemblance as solely descriptive or solely methodological, missing the tension.  

  **Recurring Errors (Deduct Marks):**  
  - **-3–5**: Treating family resemblance as an empirical hypothesis (e.g., "psychology shows concepts lack essences").  
  - **-3–5**: Conflating it with prototype theory or disjunctive definitions.  
  - **-2–4**: Claiming it implies "anything goes" in word application (ignores normative grammar).  
  - **-2–3**: Asserting that "resemblance is subjective" without addressing public practice.  
  - **-1–2**: Using quotations/citations (violates exam conditions).  

  **Allocation:**  
  - Task 1 (Distinctions): 10 marks  
  - Task 2 (Objection): 8 marks  
  - Task 3 (Reply & Evaluation): 12 marks
