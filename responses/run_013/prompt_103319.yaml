answer: |-
  Here's a decision tree built for your novelist's dilemma, analyzing the "outsourced morality" character through the lens of moral testimony. We'll walk through it step-by-step, applying it to your sister case, flagging issues, and ending with a strong opinion.

  **The Core Question:** What's wrong (or not) with someone who gets *all* their moral judgments by uncritically deferring to a trusted source (his sister)?

  ---

  ### The Decision Tree: Moral Testimony & Your Character

  1.  **Is his reliance on his sister yielding GENUINE MORAL KNOWLEDGE?**
      *   **NO (It's just reliably true belief):** He reliably does the right thing because his sister is wise & good, but he doesn't *know* it's right in a deep sense. He's just lucky she's reliable.
          *   *Go to Question 2.*
      *   **YES (It is genuine knowledge):** Her testimony *can* transmit moral knowledge. He genuinely *knows* X is wrong because she told him so (like knowing the capital of France from an encyclopedia).
          *   *Go to Question 3.*
      *   **(Your Character):** **Likely YES.** He's "genuinely decent" because her guidance *is* reliably correct. He likely *does* know stealing is wrong *because she told him so*. The question is whether this knowledge is sufficient.

  2.  **If it's NOT knowledge, why is his reliability insufficient?**
      *   **(Leaf: The Deed is Fine, But He Can't Be Praiseworthy):** He does the right thing reliably, but it's accidental. He lacks justification. We might say he *behaves* decently, but we can't praise *him* morally – we praise his sister's influence or his luck. His "decency" is hollow.
      *   **(Your Character Distortion):** This probably *doesn't* fit perfectly. He's not just accidentally good; his reliance on her is a *system* that *works*. This leaf might feel too weak for your case.

  3.  **Assuming he GETS knowledge from her testimony...**
      *   **Is ACTING RIGHTLY fundamentally about the ACTION or the REASON?**
          *   **ACTION (Consequentialism/Outcome Focus):** Morality is about what you *do* and its consequences. If he reliably does the right thing for *any* reason (including "Sis said so"), then he's acting rightly. Full stop.
              *   **(Leaf: Nothing is Lost - It's Just Like Trusting Your Doctor):** Morality is a domain like medicine or car repair. You trust experts. He trusts his sister, a moral expert. He gains knowledge, acts rightly, and that's all that matters. The "why" is irrelevant. He *is* genuinely decent.
          *   **REASON (Deontology/Virtue Ethics Focus):** *Why* you act and *how* you arrive at the judgment matter intrinsically to morality. Merely doing the right thing isn't enough; you must do it *for* the right reasons or *through* the right process.
              *   *Go to Question 4.*

  4.  **If ACTING RIGHTLY requires the RIGHT REASON/PROCESS...**
      *   **What is MISSING when he relies solely on her testimony?**
          *   **EPISTEMIC LOSS (About Belief/Knowledge):** The problem is with the *kind* of belief/knowledge he has.
              *   **(Leaf: Loss of Moral Understanding):** He has true belief/knowledge *that* X is wrong, but he lacks *understanding* of *why* X is wrong. He can't articulate the reasons, grasp the principles, or apply them to novel situations without her. His knowledge is brittle and shallow. He knows the "what" but not the "why".
          *   **MORAL/AGENTIAL LOSS (About the Person/Action):** The problem is with *him* as a moral agent or the moral quality of *his action*.
              *   **(Leaf: The Deed is Fine, But He Can't Be Praiseworthy):** He does the right thing, but because his reason is "Sis said so," we withhold moral praise *from him*. The action is objectively right, but *he* doesn't deserve credit; he's just a conduit for her will. His "decency" is passive.
              *   **(Leaf: The Worry is About His Agency):** The core loss is *autonomy* and *moral maturity*. He hasn't developed his *own* moral faculty. He's like a perpetual child or a tool. This isn't (primarily) about *knowledge*, but about his *character* and *capacity for self-governance*. He's decent *despite* his lack of agency, not because of it. This is a *practical* and *existential* loss, not just epistemic.

  ---

  ### Applying the Tree to Your Sister Case & Distortions

  *   **Start:** Q1 - **YES** (He likely gains knowledge).
  *   **Then:** Q3 - **REASON** (The editor's discomfort strongly suggests morality isn't *just* about the action/outcome here).
  *   **Then:** Q4 - **MORAL/AGENTIAL LOSS** (The sister relationship intensifies this).
      *   **Likely Leaves:** **The Worry is About His Agency** and/or **He Can't Be Praiseworthy**.
      *   **Loss of Understanding** is also likely present, but the relationship makes the agency/praise issue *primary*.

  **Where the Sister Relationship Distorts/Amplifies:**

  1.  **Power & Intimacy:** This isn't a detached expert (like a doctor). It's an intimate, lifelong relationship. His deference isn't just intellectual; it's emotional and relational. It risks infantilization, unhealthy dependence, and erasure of his *self*.
  2.  **Verdicts vs. Weighing Reasons:** The core issue isn't necessarily that he defers on *specific* hard questions. It's that he *never learned to weigh reasons himself*. He outsourced the *faculty*, not just the answers. This makes the **Agency** and **Understanding** leaves scream louder.
  3.  **History:** Does he defer because she's *always* been right? Or because he's *always* deferred? The latter suggests arrested development.
  4.  **Her Perspective:** What does *she* think? Does she encourage his dependence? Is she burdened by being his sole moral compass? This adds relational complexity beyond pure epistemology.

  **Flagged Issues with the Tree:**

  *   **Can't Separate:** **Loss of Moral Understanding** and **He Can't Be Praiseworthy** often go hand-in-hand. If he lacks understanding, *can* he truly act *for* the right reason? This blurs the line between Q4's branches. Similarly, **Lack of Agency** often *explains* why **He Can't Be Praiseworthy**.
  *   **Unattractive/Unexplored:** **Nothing is Lost - Trusting Your Doctor** is coherent but often felt as deeply unsatisfying for *morality*. It reduces profound questions of value and character to technical expertise. Few philosophers fully endorse this for *all* moral matters. **It's just reliably true belief** (Q1 NO path) is also coherent but likely doesn't capture the *systematic* success of your character's reliance.

  ---

  ### The Opinionated Take: What's Actually Wrong With Him

  Forget "moral testimony" jargon for a second. **The core problem is that your character isn't a full moral person.** He's a highly effective moral puppet.

  1.  **He Lacks Moral Autonomy:** Morality isn't just about getting the right answer; it's about grappling with values, principles, conflicting desires, and ambiguity *for yourself*. This grappling is essential to developing a *self*. By outsourcing it entirely, he hasn't developed his own moral identity or capacity for judgment. He's stuck in a permanent state of moral adolescence.
  2.  **His "Decency" is Passive & Fragile:** He's decent *because of her*, not because of *him*. What happens if she's wrong (even once)? What happens if she dies? What happens when he faces a truly novel dilemma she hasn't pre-solved? His decency collapses without her constant input. It's not robust.
  3.  **He Can't Be Truly Praiseworthy:** We praise people for their *character* and *choices*. His choice is always "Do what Sis says." That's not a moral choice; it's an abdication. We might praise *her* for guiding him well, or praise the *outcome*, but praising *him* for his "moral decision" feels hollow. He didn't make a decision; he obeyed an instruction.
  4.  **The Relationship is Pathological:** Healthy adult relationships involve mutual respect and independence. His total deference undermines equality. It burdens her with ultimate responsibility and denies him the dignity of self-determination. It's co-dependent, not loving.
  5.  **He Lacks Understanding (Which Matters!):** Even if he "knows" stealing is wrong because Sis said so, he doesn't grasp *why* property, trust, or fairness matter in a way that could guide him if Sis wasn't there. He's memorized answers without learning the subject.

  **Why "Trusting Your Doctor" Fails:** Medicine deals with objective facts about the body. Morality deals with values, reasons, and the self. Trusting a doctor on a diagnosis doesn't stunt your *capacity* to understand biology (though you might not). Trusting your sister on *all* morality stunts your *capacity* for moral reasoning and selfhood. The loss isn't just informational; it's constitutive of who you *are* as a moral agent.

  **The Unfashionable(?) Truth:** Your editor is right. A person who has *never* engaged their own moral faculties, who simply obeys an external authority (even a benign and wise one), lacks something essential to full moral personhood: **autonomy, deep understanding, and the capacity for genuine moral praise or blame.** He *behaves* decently, but he isn't *living* a fully moral life. He's avoiding the hard, essential work of becoming his own person. That's a profound loss, making him psychologically thin and ethically vulnerable. The dramatic tension lies precisely in exploring this hollowness and its consequences – for him, for his sister, and for when the system inevitably fails.
