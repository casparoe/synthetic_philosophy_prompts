prompt: |-
  I teach at a big public high school and something's gone wrong here that nobody planned. Every department has quietly ratcheted up homework over the years, mine included. Every one of us says privately that we'd cut back tomorrow if everyone else did. The kids are fried, they're sleeping five hours, and I've sat in two staff meetings where we all agreed it's a problem and then went home and assigned the same load as always. Nobody wants to be the teacher whose subject is the easy one, the parents compare, the counsellors compare, the rankings compare. I don't think anyone in this building is a bad person. So is there anything I can actually do, or am I just supposed to feel bad about this forever?

  I want advice about my situation, not a pep talk, and I don't want it to turn into a lecture about how everything is interconnected. So:

  Bottom line (3-4 sentences): what you'd tell me to do, if anything.

  Whats really going on (about 200 words): name the structure. Then be specific about which parts of it my story actually establishes and which parts I'm just assuming.

  Where my story might be wrong (about 250 words): what would have to be true for this to be a real trap where we all end up worse off, versus something else — a positional arms race where the total is fine and only the distribution stinks, a ratchet that's actually doing something useful, or a coordination problem I'm calling inescapable because that's less work than testing it.

  Exits, ranked by how much they need other people's cooperation (about 300 words): from things I can do by myself to things that require an actual commitment device or a third party who can change what's at stake. Say honestly which of these are just me paying a price to feel clean.

  My own role (about 150 words): does my participation make me complicit or just unlucky, and does the fact that nobody intended any of this change what I owe the kids?

  Monday morning (about 100 words): the two or three things worth trying first.
reasoning: |-
  Okay, the user is a high school teacher facing a systemic homework overload problem. They describe a situation where every department has gradually increased assignments, leading to burned-out students. Staff meetings acknowledge the problem but yield no change due to competitive concerns about rankings and perceptions. 

  The user wants concrete advice, not platitudes. They're clearly frustrated by the cycle of recognizing the issue but feeling powerless to break it. Their tone suggests they've already analyzed the situation deeply but need help framing solutions. The request for structural analysis indicates they understand this isn't about individual villains but systemic incentives.

  Key points from their query:
  - They've established the "homework arms race" pattern exists
  - They assume it's harmful and inescapable
  - They need validation that their frustration is legitimate while avoiding self-flagellation
  - Practical Monday-morning actions are crucial

  The challenge is balancing structural reality with individual agency. They're not asking to be absolved ("complicit or unlucky?") but want ethical clarity. The "exits" framework must distinguish between performative gestures and meaningful change. 

  Notably, they reject "everything is interconnected" lectures - so solutions must avoid vague calls for systemic overhaul while acknowledging the coordination problem. The ranked exits approach responds directly to this by starting with solo actions.

  Their hidden concern might be burnout too - teachers in these systems often mirror student exhaustion. The "paying a price to feel clean" caveat is important because they'd reject symbolic actions that don't help kids. 

  For Monday morning: Prioritize actions that simultaneously demonstrate commitment (modeling change) and gather data (making the invisible visible). The homework audit serves both purposes while being administratively lightweight.
answer: |-
  ### Bottom Line
  Initiate a solo homework audit in your classes: track actual completion times for 2 weeks. Present anonymized data to department chairs showing the gap between intended and actual workload. Propose one "light" week per month where you cut non-essential assignments by 50% and challenge one trusted colleague to match it. Document student feedback before/after. This builds evidence while testing the waters for coordination.

  ### What’s Really Going On (Structure: Positional Arms Race)
  You’ve identified a **multi-party prisoner’s dilemma**: All teachers want less homework collectively, but individually defect (assign more) fearing their subject will lose status if others don’t cooperate. Key evidence:  
  - **Established**: Mutual acknowledgment of harm ("kids are fried"), implicit collusion ("we’d cut back if others did"), and competitive incentives (rankings, parent comparisons).  
  - **Assumed**: That workload directly correlates with academic rigor, and that stakeholders (parents, counselors) prioritize volume over quality. You also assume total workload is destructive, not just poorly distributed.  

  ### Where Your Story Might Be Wrong  
  **Three alternate realities could undermine the "trap" narrative:**  
  1. **The Ratchet Is Functional**: Homework increases might compensate for declining classroom engagement or curriculum gaps. If students *need* 5 hours nightly to meet standards, cutting back harms college readiness.  
  2. **Distribution, Not Volume**: The issue could be poor coordination (e.g., 3 major deadlines same day), not total hours. Solutions like a shared assignment calendar might fix burnout without reducing workload.  
  3. **False Prisoner’s Dilemma**: If parents/counselors actually prioritize *efficacy* over volume, a teacher who cuts low-yield assignments might gain status. Survey data could reveal this.  
  *Testing needed*: Poll students on *which* assignments feel valuable. Track whether high-volume teachers get better evaluations. If discovered value isn’t tied to volume, the trap weakens.

  ### Exits (Ranked by Dependence on Others)  
  1. **Solo Action** (No cooperation):  
     - Audit/optimize *your* assignments (cut busywork, add grace periods).  
     - Publicly celebrate students who prioritize sleep.  
     - *Risk*: Being branded "easy" without systemic change.  

  2. **Weak Coordination** (1-2 allies):  
     - Trade "light weeks" with a science/math teacher to stagger loads.  
     - Co-propose a homework "amnesty day" with counseling staff.  
     - *Clean conscience cost*: Yes, but may spark imitation.  

  3. **Strong Coordination** (Department/Admin):  
     - Push for a homework task force with data collection mandate.  
     - Proload assignments into a scheduling app to visualize overlaps.  
     - *Requires*: Admin protecting early adopters from parent backlash.  

  4. **Structural Change** (Third Party):  
     - Lobby district for homework policy tied to research (e.g., 10 mins/grade level/night max).  
     - Invite university researchers to study burnout impacts.  
     - *Barrier*: Slow; may face union resistance.  

  ### Your Role: Complicit but Redeemable  
  You’re **complicit** through repeated inaction despite recognizing harm, but **not malicious**. Unintended consequences don’t erase obligation—you owe students advocacy proportional to your influence. Your power: As an insider, you can collect evidence others can’t. Prioritize reducing *demonstrable harm* over guilt.

  ### Monday Morning  
  1. **Launch Audit**: Distribute time-tracking sheets to 3 classes (e.g., "How long did Section 3.2 *actually* take? Be honest!").  
  2. **Recruit One Ally**: Email a respected colleague: "I’m testing a lighter week on [date]. If you join me, we’ll compare student feedback."  
  3. **Protect One Group**: Tell your AP students, "Next month’s essay gets an automatic 48-hour extension if you show me a sleep log averaging 7 hours."  

  This starts a micro-experiment. Either you disprove the trap or gather ammunition to break it.
