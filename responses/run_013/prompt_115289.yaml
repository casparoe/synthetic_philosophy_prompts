answer: |-
  ## The Valley of Shadows

  **Characters:**  
  *   **Conventionalist (C):** Believes combatants on both sides possess equal moral permissions and obligations in war, regardless of the justice of their cause.  
  *   **Revisionist (R):** Believes the justice of the war directly impacts what combatants may permissibly do and what may be done to them.  

  **Setting:** A quiet room adjoining the seminar hall.  

  **(The dialogue begins mid-conversation)**

  **C:** ...so you grant Grey’s soldiers are utterly blameless? They investigated diligently, faced the same evidence as Blue, and concluded in good faith they were fighting justly? They are neither fools nor knaves, merely mistaken through no fault of their own?

  **R:** Entirely. They are non-culpable for their participation. They bear no *blame*. But that does not mean their acts are justified, nor does it mean they retain their right not to be killed by those defending against their objectively unjust aggression.

  **C:** If they bear no blame, and their actions – fighting for what they sincerely, reasonably believe is a just cause – are identical in all observable respects to Blue’s soldiers, how can their *moral status* be different? How can Blue be justified in killing them when they are doing exactly what Blue is doing, guided by identical evidence and intentions?

  **R:** Because the objective facts matter. Grey’s brigade, however blamelessly, is *actually* prosecuting an unjust war. They are imposing lethal force without right. Blue is resisting that unjust force *with* right. That objective difference grounds the moral asymmetry in liability. Blamelessness excuses the soldier *from blame*; it does not negate the objective wrongness of the act he performs, nor the threat he poses.

  **C:** But if the ‘objective wrongness’ is completely inaccessible to the agent, utterly hidden by circumstance, does it retain its moral force *for determining their liability*? If Grey’s soldier pulls the trigger believing, reasonably, he defends his home, and Blue’s soldier does the same, the bullet fired by Grey is objectively unjust, yet the *agent* behind it is morally indistinguishable from his Blue counterpart. Punishing the invisible fact, rather than the visible act and intent, seems arbitrary.

  **R:** It’s not about punishment. It’s about liability arising from posing an objectively unjust threat. Consider self-defense: someone might non-culpably, even reasonably, attack you believing you are a threat. You are still permitted to defend yourself. Their blamelessness doesn’t make them invulnerable; it means you might deeply regret the necessity, but the necessity remains. Grey’s soldiers are non-culpable unjust threats. Blue’s soldiers are just defenders.

  **C:** But war isn’t individual self-defense writ large. It’s a collective, institutional phenomenon governed by rules understood and accepted by both sides *as combatants*. Your asymmetry dissolves the possibility of shared rules. If Blue knows it is just and Grey is unjust, why should Blue feel bound by *any* restraints Grey’s soldiers might nominally follow? And conversely, why should Grey’s soldiers restrain themselves against Blue, whom they believe to be the unjust aggressor? Your moral truth, if it demands asymmetry, seems to undermine the very possibility of restraint *in practice*.

  **R:** You raise reciprocity – the conventionalist’s strongest point. I concede it fully: a workable *code of war*, teachable and enforceable on the ground, requires symmetry. Soldiers cannot practically operate a rulebook that says "Your killing is permitted only if your cause is just," precisely because they cannot reliably know whose cause *is* just in the fog of war and state propaganda. Enforcing such asymmetry in the trenches would be impossible, likely disastrous.

  **C:** So you admit the conventional rules are necessary?

  **R:** Necessary for *practice*, for maintaining restraint amidst radical uncertainty and conflicting claims. But necessity for practice does not equate to moral truth. It speaks to the tragic constraints of human conflict, not the underlying morality. We might need symmetrical *rules* precisely because the world often obscures the moral asymmetry. The rule "Treat all combatants equally" is a pragmatic shield against chaos, not a revelation that all combatants *are* morally equal.

  **C:** But if the symmetry is pragmatically necessary *and* produces the same battlefield behavior – Grey and Blue both restrained by the same rules – what does your moral asymmetry *add*? If Grey’s soldier is killed by Blue, is it a tragedy because he was blameless, or was it also unjust? Your liability claim suggests the latter. But if his blamelessness demands we treat his death as a profound tragedy, while your liability claim suggests Blue was merely exercising a right, isn’t there a tension? Doesn't the concession of blamelessness pull the rug out from under the idea that anything *consequential* distinguishes him morally in terms of what could be done *to* him?

  **R:** The tension is real. His death *is* a tragedy – a life lost under a blameless mistake. Yet, objectively, he was part of an unjust threat. Blue’s act of killing him was *justified* (not merely excused) because it was necessary defense against that threat. The tragedy stems from the non-culpable mistake. The justification stems from the objective facts Blue correctly apprehends. The blamelessness matters immensely for our judgment *of him as a person*; the liability matters for the permissibility *of the defensive act against the threat he embodies*. They can come apart.

  **C:** Let’s test this with your volunteer. He fights for a state whose war he has every reason to believe is just. His belief is flawless, non-negligent. He would stop immediately if he knew the truth. Is he liable to be killed?

  **R:** If his state’s war is objectively unjust, then yes, he is liable. He is part of an unjust threat, even if his participation is utterly blameless.

  **C:** And culpable?

  **R:** No. He is entirely non-culpable. He has done nothing deserving of blame. He acted with impeccable epistemic and moral diligence.

  **C:** So you *can* have liability without culpability. The volunteer is liable but blameless. Grey’s soldiers are liable but blameless. Fine. But if he is blameless, killed while doing what any reasonable, diligent person in his shoes would do, what does calling him ‘liable’ *achieve*, morally? It feels like a label applied to an objective fact about his role in an unjust cause, divorced from any fault of his own. It justifies his killer, but offers no moral critique *of him*. It seems sterile, even cruel. Doesn’t your crucial distinction – liability without culpability – risk collapsing into irrelevance? If he’s blameless, why isn’t killing him simply a tragic necessity we deeply regret, rather than an act *against which he had no right*? Doesn’t the ‘no right’ imply some sort of forfeiture, which seems strange without fault?

  **R:** It’s not forfeiture based on fault; it’s the absence of a right *against necessary defense* when you pose an unjust threat. The volunteer retains many rights – to fair treatment if captured, to not be tortured. But he loses the specific right not to be killed *as a necessary measure to stop the unjust threat he is part of*. The label ‘liable’ signifies that this defensive violence does not wrong *him*, even though it kills him, and even though he is blameless. The wrong lies with those who deceived him and launched the unjust war. The tragedy is acute. But the justification for stopping him, lethally if necessary, holds.

  **C:** I concede that the objective injustice of the threat *does* seem to matter at the level of ultimate justification. If Grey's war is truly unjust, then ultimately, Blue *is* justified in defending against it, even against blameless Grey soldiers. The world isn't morally symmetrical. But... that truth seems utterly unusable, even dangerous, for soldiers in the valley. Knowing they might be objectively unjust, yet unable to discern it, paralyzes Grey. Knowing they are just might tempt Blue to abandon restraint. The symmetry of the rules we *must* follow in practice seems to create a separate moral space – the morality *of being a soldier* – which overrides, or at least suspends, the ultimate asymmetry. Perhaps the moral equality of combatants isn't a deep truth, but a necessary fiction for the hell of war.

  **R:** And I concede the profound force of your reciprocity argument. The fiction *is* necessary. It *is* the only way restraint functions. Demanding soldiers discern the objective justice of their cause in real-time is impossible and destructive. We *must* treat them symmetrically *in practice*. But... that doesn't erase the underlying truth. The volunteer, killed blamelessly in an unjust cause, is a victim of a terrible wrong – the wrong of the unjust war – even if his killer was justified. His blamelessness *does* make his death qualitatively different, morally, from killing a knowing aggressor. The tension between the objective asymmetry and the practical symmetry isn't resolved; it's the enduring tragedy of war. The rules shield us from the full horror of that truth, but they don't abolish it.

  **C:** So we agree the rules must be symmetrical.

  **R:** And we agree the ultimate moral reality is not.

  **C:** And the fate of the blameless soldier caught in the machine remains morally agonizing, whichever label we apply.

  **R:** Precisely. The valley remains shrouded, even for us.

  **(Silence falls, heavy with the unresolved tension.)**

  **Verdict:** ASYMMETRY IN MORALITY BUT EQUALITY IN PRACTICE — The irreconcilable tension between inaccessible objective liability and the pragmatic necessity of reciprocal rules.
