  For example, after Root "No", we can have a branch on: Is the hearer's consent to the register (e.g., using a chatbot known to be warm) sufficient to make it not a lie, even outside of social convention? But that might be part of Leaf 2.

  Given the 7-leaf constraint, we can stop at 6.

  Alternatively, in step 3, when we ask about intent to deceive, we can split:

  3. Is the utterance literally false?
     - No: not a lie (rare, so not a leaf)
     - Yes: then ask about intent to deceive.

  But that doesn't add a leaf.

  Or at the root, if we answer "No", then go to a branch about the basis of the moral rule.

  But I think 6 leaves are sufficient.

  For the handout, we'll use the last tree.

  Tree:

  1. Root: Is the virtue of honesty best understood as including tact and kindness, so that a truly honest person might use a white lie to avoid unnecessary harm? (Integrated Honesty)
     - Yes: Leaf 1: Integrated Honesty. Awkward commitment: In a society with harmful norms of politeness (e.g., covering up corruption), this view might require participating in the cover-up.
     - No: Go to 2.

  2. In the specific context, would a reasonable hearer understand that literal truth is not expected? (e.g., ritual greetings, a chatbot's encouragement, a translator's softening)
     - Yes: Leaf 2: Contextual Expectation. The utterance is not a lie because of the context. Awkward commitment: If the hearer is particularly vulnerable or the stakes are high, the speaker might still be obligated to be literal.
     - No: Go to 3.

  3. Does the speaker intend for the hearer to believe the literal falsehood? (e.g., when you compliment a bad haircut, do you want them to believe you love it?)
     - No: Leaf 3: No Deception Intended. The speaker is only being polite and doesn't care if the hearer believes it. Awkward commitment: The hearer might still form a false belief, and the speaker might be blameworthy for that.
     - Yes: Go to 4.

  4. Is lying inherently wrong (wrong in itself, regardless of consequences)?
     - No: Leaf 4: Permissible Lie. White lies are lies but are morally acceptable because of their benefits. Awkward commitment: It is hard to define when a lie is "white", potentially allowing more serious lies.
     - Yes: Go to 5.

  5. Can the inherent wrong of lying be overridden by other moral duties (e.g., to be kind or to prevent harm)?
     - Yes: Leaf 5: Outweighed Wrong. The lie is wrong but is the lesser evil in the circumstances. Awkward commitment: One must sometimes do wrong to do good, which may erode moral character.
     - No: Leaf 6: Absolutist. Lying is always wrong, regardless of consequences. Awkward commitment: One must be brutally honest even when it causes severe and unnecessary harm.

  This covers the main positions. The seventh leaf is missing, but we have six.

  For the chatbot case: 
  - Under Integrated Honesty: not a lie because honesty includes being warm.
  - Under Contextual Expectation: not a lie because the user knows the chatbot is programmed to be encouraging.
  - If we go to later branches, it might be considered a lie, but we hope to catch it early.

  The tree can separate the leaves as above.

  For combinations that are empty:
  - For instance, if you answer "Yes" to the first question, you go to Leaf 1 and don't go further. Similarly for others.

  For the branch at step 3: if the speaker does not intend deception, then it's Leaf 3, even if the hearer might believe it.

  For the translator case: it would be caught at Leaf 2 (contextual expectation) or Leaf 1.

  The tree might not separate every possible nuance, but it covers the main positions.

  We have the four distinctions:
  - Not a lie at all: Leaf 1, 2, 3
  - Lie but permissible: Leaf 4
  - Wrong but outweighed: Leaf 5
  - Integrated: Leaf 1

  So we have it.

  Now, for the handout, we present the tree with the questions and leaves as above.
answer: |-
  ### Taxonomy of Ethical Positions on White Lies  
  *A decision tree for classifying ethical stances on common white lies (e.g., "fine, thanks" when unwell, complimenting a bad haircut). Branch questions are concrete to avoid theoretical jargon. Positions are mutually exclusive; awkward commitments highlight counterintuitive implications. Seven leaves cover major views.*  

  #### ROOT: **Does the speaker’s social role or context suspend the expectation of literal truth?**  
  *(e.g., a chatbot programmed to "be warm" saying "great question!" to a terrible query; a doctor being cheerfully vague at a patient’s bedside)*  
  - **Yes** → Branch A  
  - **No** → Branch B  

  ---

  **Branch A: Does the hearer consent to this suspension (e.g., by using the chatbot or knowing the doctor’s role)?**  
  *(e.g., the patient knows doctors avoid bluntness; the user knows the chatbot is designed for encouragement)*  
  - **Yes** → **Leaf 1: Contextual Consent**  
    *Position:* Not a lie—truthfulness is defined by mutually agreed roles.  
    *Awkward commitment:* Makes deception permissible if roles are "consented to," even in high-stakes contexts (e.g., a translator softening a terminal diagnosis because "it’s their job").  
  - **No** → **Leaf 2: Role Absolutism**  
    *Position:* Still not a lie—social roles override literal truth, regardless of consent.  
    *Awkward commitment:* Forces compliance with harmful norms (e.g., a therapist must "soften" abuse disclosures if politeness conventions demand it).  

  **Branch B: Is the utterance a literal falsehood?**  
  *(e.g., saying "we’re busy that night" when free; calling a child’s terrible drawing "beautiful")*  
  - **No** → *[Rare for white lies; no distinct position needed]*  
  - **Yes** → Branch C  

  ---

  **Branch C: Does politeness require overriding literal truth to avoid harm?**  
  *(e.g., not saying "your haircut is ugly" to spare feelings; a colleague dodging a sensitive topic)*  
  - **Yes** → **Leaf 3: Integrated Tact**  
    *Position:* Not a lie—tact is part of honesty, so white lies are truthful in a broader moral sense.  
    *Awkward commitment:* Risks conflating kindness with truth, potentially excusing lies that uphold oppressive norms (e.g., "you’re fine" to silence someone’s distress).  
  - **No** → Branch D  

  ---

  **Branch D: Is lying inherently wrong (regardless of consequences)?**  
  *(e.g., insisting "fine, thanks" is dishonest even if it avoids awkwardness)*  
  - **Yes** → Branch E  
  - **No** → **Leaf 4: Permissible Lie**  
    *Position:* A lie, but ethically acceptable to maintain social harmony.  
    *Awkward commitment:* Permits lying whenever intentions seem good, blurring lines between "white" and harmful lies (e.g., faking credentials to "spare embarrassment").  

  ---

  **Branch E: Can the wrongness be outweighed by greater goods?**  
  *(e.g., praising a child’s awful art to encourage them)*  
  - **Yes** → **Leaf 5: Outweighed Wrong**  
    *Position:* Wrong but justified—lying is a moral cost paid for kindness.  
    *Awkward commitment:* Forces choosing "lesser evils" routinely, normalizing dishonesty (e.g., lying about minor errors at work to "protect teamwork").  
  - **No** → **Leaf 6: Absolutist Honesty**  
    *Position:* Always wrong—truth must never bend to politeness.  
    *Awkward commitment:* Demands brutal honesty, even when cruel (e.g., telling a grieving person their feelings are "irrational").  

  #### Unoccupied Positions & Limitations  
  - **Incoherent combination:** "Politeness requires overriding truth (Branch C → Yes) *and* lying is inherently wrong (Branch D → Yes)"—contradicts by making tact both required and immoral.  
  - **Unexplored combination:** "Context suspends truth (Branch A → Yes) *and* lying is permissible (Branch D → No)"—theoretically possible but rarely defended, as consent/roles usually negate the "lie" label.  
  - **Chatbot case resolution:** Classified under **Leaf 1 (Contextual Consent)** if users consent to its "warm" register; *not* a lie by definition. But if consent is illusory (e.g., users believe it’s sincere), it risks becoming a "permissibility machine" by whitewashing deception.  
  - **Flags:**  
    - Leaf 2 (Role Absolutism) and Leaf 3 (Integrated Tact) overlap in treating politeness as morally required but split on whether roles *define* truth (Leaf 2) or *expand* it (Leaf 3).  
    - The tree cannot separate "harmless" from "high-stakes" white lies—e.g., a cheerful doctor’s lie (Leaf 1) vs. a life-altering omission (Leaf 5) rely on contextual judgments.  

  #### Key Distinctions Achieved  
  - **Not a lie at all:** Leaf 1, 2, 3.  
  - **Lie but permissible:** Leaf 4.  
  - **Wrong but outweighed:** Leaf 5.  
  - **Tact as honesty:** Leaf 3.
