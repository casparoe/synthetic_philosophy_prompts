answer: |-
  ## Five-Limbed Refusal

  *(For the Scholar Who Sees Only Inference)*

  **I. (Perception)**
  Thesis: This leaf burns, you must concede.
  Reason: For flame now licks its edge with heat.
  Example: Like fire-touched grass that smokes and glows.
  Application: See here, the fire, the leaf, it shows:
  Conclusion: Therefore, it burns. Yet *first* I **saw** the flame ignite –
  Not built from thought, but pure and present light.

  **II. (Comparison/Upamāna)**
  Thesis: That creature *is* a gavaya, friend.
  Reason: For matching what the hermit did intend.
  Example: Like knowing 'cow' when shown the beast unnamed.
  Application: His word, this form, their likeness claimed:
  Conclusion: Therefore, it is. But **meaning leapt** across the space –
  No chain of thought, but recognition's grace.

  **III. (Testimony/Śabda)**
  Thesis: "Water lies beyond that ridge," he said.
  Reason: For he speaks true, by tested life and stead.
  Example: Like trusting guides who've led safe paths before.
  Application: His word, direct, compels me toward the shore:
  Conclusion: Therefore, I go. Yet **trust arose** before the proof –
  In deeds performed, beneath doubt's aloof roof.

  **IV. (Against Reduction)**
  Thesis: You say my trust is inference concealed.
  Reason: That subtle steps my conscious thought must wield.
  Example: Like parsing every beam that forms the sun.
  Application: But when he spoke, the knowing *was* begun –
  Conclusion: Therefore, it stands. The **word itself conveyed the stream**,
  Not just a signpost in my reason's scheme.

  **V. (The Ground)**
  Thesis: The sources stand distinct, each one alive.
  Reason: For life requires what inference cannot derive.
  Example: Like tasting sweetness logic cannot show.
  Application: Your chain, though deep, makes knowing far too slow:
  Conclusion: Therefore, attend. **The world arrives direct and whole** –
  Not pieced from premises, but touching soul.

  ---

  ### Notes on the Poem
  *   **Structure:** Each stanza follows the Nyāya *parārthānumāna* structure: Pratijñā (Thesis), Hetu (Reason), Udāharaṇa (Example), Upanaya (Application), Nigamana (Conclusion). The final line of each stanza breaks slightly to deliver the anti-reductionist refrain.
  *   **Refrain:** The italicized/bolded phrases ("**saw** the flame ignite", "**meaning leapt**", "**trust arose**", "**word itself conveyed the stream**", "**The world arrives direct and whole**") consistently emphasize *immediate, non-inferential access* – the core Nyāya rebuttal.
  *   **Accuracy:** It uses specific examples (burning leaf, identifying a gavaya via description, trusting testimony based on past reliability) and captures the Nyāya view of śabda as conveying meaning *directly*, with reliability grounded in practical success (stanza III, Application & Conclusion) and *prior* to conscious inference about the speaker (stanza IV, Thesis & Refrain).
  *   **Buddhist Objection:** Stanzas III and IV directly engage the strongest Buddhist point: the argument that testimony *is* inference (about reliability/sincerity). The Nyāya voice counters that the *understanding* and the *pragmatic trust* arise spontaneously from context and lived experience ("deeds performed", "life and stead"), not a conscious inferential process ("Not just a signpost").
  *   **Talking Past:** The final stanza leans into the fundamental, perhaps irreconcilable, difference: the Nyāya insistence on direct, diverse contact with the world vs. the Buddhist epistemological drive towards reducing phenomena to foundational cognitive processes. The poem ends on this irreducible experiential claim.
