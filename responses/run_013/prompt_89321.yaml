prompt: |-
  I'm a PhD student and I'm in this comparative epistemology reading group that's spent the last few weeks on Nyāya, specifically the pramāṇas, and I keep getting stuck on something everyone else seems to just nod along to. The Nyāya insist that the pramāṇas are genuinely independant sources of knowledge, so that testimony (śabda) isn't just inference (anumāna) in disguise — but the Buddhist move of collapsing testimony into an inference about the speaker's reliability seems so natural to me, and when the Naiyāyika replies that no, we grasp the meaning of the sentence directly, and the reliability is established by the general success of our practical dealings rather than by any inference we actually run through, I honestly can't tell if that's a real reply or just a refusal to do epistemology. For the last session I want to close with a poem instead of a summary, something that lets people feel the pull of the independence thesis rather than just hear it asserted one more time.

  Could you write it for me? Say 20 to 30 lines, in the voice of a Naiyāyika addressing a Buddhist who keeps trying to reduce everything to inference. I'd love the form to do some of the work here: maybe five-line stanzas where each stanza walks through the five members of a Nyāya inference — the thesis, the reason, the example, the application, the conclusion — so that the whole poem is a chain of proofs, but with a repeated line or refrain that keeps refusing to be reduced (perception, or comparison/upamāna, or just the bare act of understanding what someone says). It should be accurate enough that someone who knows the tradition won't wince, and the Buddhist should get a real objection rather than a strawman — I think the strongest one is that the aptness of a bit of testimony (the speaker being both reliable and sincere) just is an inference about the speaker, however quickly we run it.

  Please don't cite or name any texts or authors, I really just want the poem itself, and if the two voices end up talking past each other a little that's probably the right note to end on anyway.
