answer: |-
  Here’s a precise dissection of the disagreement, clarifying the core issues without appealing to external sources:

  ### (1) Discernibility’s Relativity & PII’s Status  
  - **Discernibility is language-relative**: Two objects are discernible *relative to a language* if that language contains a predicate true of one but not the other. If your language includes irreflexive relations (e.g., "is exactly *d* units from"), the spheres *are* discernible in that language (Sphere A is *d* from B, but B is not *d* from itself).  
  - **Triviality vs. Substance**:  
    - If PII is interpreted as a *logical principle* ("No two objects share all properties expressible in *any possible language*"), it collapses into the trivial truth that numerically distinct objects differ by *some* relation (e.g., "being identical to A" vs. "being identical to B"). This renders PII uncontestable but metaphysically empty.  
    - If PII is a *metaphysical thesis* ("No two objects share all *fundamental* properties"), it remains substantive. Here, "fundamental properties" exclude parasitic relational properties (like "being *d* from *that* sphere") that presuppose distinctness.  
  - **Malformed Question?**: PII is ill-posed if unqualified. It must specify: discernible *in what language* or *by which properties*? Your friends’ disagreement stems from this ambiguity.  

  ### (2) Legitimacy of Irreflexive Relations & Circularity  
  - **The Charge of Circularity**:  
    - Your second friend is correct that *directly using* "is *d* from B" to discern A from B presupposes B’s distinct existence—making the discernment circular for *establishing* numerical distinctness.  
    - However, **existential relations avoid circularity**: Each sphere satisfies the property "**bearing R to some distinct object**" (e.g., "∃x (x ≠ self ∧ Distance(self,x)=d)"). This property is intrinsic to each sphere *taken individually* and doesn’t name the other sphere.  
  - **Is This Legitimate Discernment?**  
    - **Yes**, *formally*: The property "∃x (x ≠ self ∧ Distance(self,x)=d)" is true of both spheres but *false of any lone object* (since no distinct *x* exists). This discerns them from a hypothetical single sphere.  
    - **But metaphysically contentious**: Your second friend might argue this property *still presupposes a world with distinct objects*, so it doesn’t reveal a *fundamental* qualitative difference. The property is "extrinsic" or "world-dependent."  

  ### (3) The Strongest Surviving Counterexample  
  To make PII a contestable metaphysical claim, restrict properties to **non-haccecitistic, non-parasitic qualitative properties**:  
  - **Setup**: A universe with two spheres, identical in all:  
    - **Monadic properties**: Mass, charge, material composition, etc.  
    - **Symmetric relations**: "Part of a pair separated by *d*" or "gravitationally bound to *one* other object."  
    - **Key**: *No asymmetric relations* (e.g., no "left of," no singular "causes X" directed at one sphere).  
  - **Why this works**:  
    - All qualitative properties are identical between the spheres.  
    - The only relations are symmetric and apply equally to both (e.g., both satisfy "is in a pair where distance=*d*").  
    - Irreflexive existential properties like "∃x≠self at distance *d*" are *true of both*—so they *do not discern* the spheres from each other.  
  - **PII’s Status Here**:  
    - If PII requires *absolute indiscernibility* (no property true of one but not the other), it is *false* in this world: The spheres are numerically distinct but qualitatively identical.  
    - This version refutes PII as a *metaphysical principle* if "properties" exclude extrinsic/relational differences that presuppose distinctness.  

  ### Who Is Closer to Truth?  
  - **First Friend** ("Discernible via relations") is correct *logically*: In a language with irreflexive relations, the spheres *are* formally discernible.  
  - **Second Friend** ("Trivialization") is correct *metaphysically*: Using relations like "is *d* from *that* sphere" makes PII vacuously true and dodges Black’s intended challenge. The strongest counterexample (with only symmetric relations) shows PII can fail as a substantive thesis.  

  ### Resolution  
  The debate hinges on **what "discernible" means**:  
  - **Formal discernibility** (language-relative): First friend wins. Relations suffice.  
  - **Metaphysical indiscernibility** (sharing all fundamental properties): Second friend wins. The counterexample stands when relations are symmetric and non-individualing.  

  **Core Insight**: Black’s spheres are *numerically distinct but symmetrically related*. To reject PII substantively, we must deny that symmetric relations (or existential properties) break their qualitative symmetry. The principle is trivialized only if we allow *any* relation—including those that covertly reference particular objects. The disagreement dissolves by specifying whether PII concerns *distinction in language* or *difference in fundamental reality*.
