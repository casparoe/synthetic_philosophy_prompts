  First, I need to untangle the language/metaphysics knot. The friend who calls relational discernibility "trivial" has a point—if we allow any predicate, PII collapses into Leibniz's Law. But that feels unsatisfying because Black's original aim was metaphysical: can two things share all properties? So we must distinguish descriptive resources from fundamental properties. 

  Ah—the circularity charge is trickier. When we say sphere A "is d from B," we're using "B" as a rigid designator, which already assumes B's distinctness. But that's not necessarily circular if we interpret the relation existentially: "there exists an object distinct from itself such that..." Still, the anti-trivialization friend might counter that this exploits our naming convention rather than revealing a genuine property difference. 

  For the strongest surviving counterexample, I'm imagining a world with no asymmetric relations at all—maybe two spheres in a Newtonian void with only monadic properties and symmetric relations (like "are 2d apart"). Here, even with relations, neither sphere has a unique relational profile. This preserves Black's intent: numerical distinctness without qualitative difference. 

