        Skepticism: Testimony alone never justifies belief. Always requires non-testimonial positive evidence, which is impossible to have for all testimony, or at least never met in practice.

        Reductionism: Testimony can justify, but only if the hearer has non-testimonial positive evidence for the speaker's reliability. This evidence might be global (required for every instance) or local (only for certain types of testimony), and might be domain-specific.

