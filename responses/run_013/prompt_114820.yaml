answer: |-
  ## Research Proposal: The Modesty Dilemma and the Parasitic Nature of the Outside View

  **Principal Investigator:** [Your Name]  
  **Department:** [Your Department]  
  **Duration:** 6 months (approx. 1 day/week)  
  **Amount Requested:** [Specify amount if known, otherwise state "as per grant guidelines"]

  **1. Research Question:**  
  Can normative injunctions to "be modest" in forecasting and decision-making be coherently defined and justified *independently* of adopting an "outside view" approach, or do such injunctions inherently collapse into a prescription to use the outside view, thereby exposing its dependence on contestable inside-view judgements for reference class selection?

  **2. Background & Gap in Existing Literature:**  
  The "outside view" (Kahneman, Lovallo, Tetlock et al.) is widely advocated as a crucial corrective to the biases inherent in the "inside view" (case-specific, intuitive judgement). It prescribes using base rates from a relevant reference class of similar cases. However, **the critical, unresolved problem is selecting the appropriate reference class.** This selection is inherently an *inside-view* judgement: it relies on the decision-maker's assessment of which features make cases "similar" to the target case. This creates a fundamental tension:

  *   **Horn 1 (Parasitism):** If the outside view relies on an inside-view judgement (reference class selection) for its operation, it cannot serve as the independent, objective corrective it claims to be. Its validity is contingent on the very type of judgement it seeks to correct.
  *   **Horn 2 (The Modesty Dilemma):** If we insist on "modesty" – often interpreted as avoiding claims of uniqueness and deferring to base rates – we face a paradox. Is it *immodest* to claim your case is special (warranting a unique reference class), or is it *immodest* to ignore your unique, inside-view evidence? Existing literature frequently conflates "be modest" with "use the outside view," but fails to provide a *principled, non-circular justification* for modesty norms *themselves*, especially when they conflict with specific inside-view evidence. **This project contends that the modesty norm lacks independent justification and collapses into the outside view prescription, highlighting the unresolved parasitism problem.** Current positions largely sidestep this core methodological dilemma or treat reference class selection as unproblematic.

  **3. Methodology & Work Plan (6 months, ~1 day/week):**  
  This project employs conceptual analysis, argument reconstruction, and critical engagement with key texts to dissect the relationship between modesty norms and the outside view. No primary data collection is proposed; the focus is on rigorous philosophical and decision-theoretic argumentation.

  *   **Month 1:** **Foundational Review & Problem Framing.** Deep dive into core texts on inside/outside view (Kahneman, Tetlock), modesty in epistemology/decision theory, and critiques of reference class selection. Precisely map the argument for parasitism (Horn 1) and formalise the Modesty Dilemma (Horn 2).
  *   **Month 2:** **Deconstructing "Modesty".** Analyse how "modesty" functions normatively in decision-making literature. Catalogue explicit and implicit arguments linking modesty to the outside view. Identify attempts (if any) to define modesty independently.
  *   **Month 3:** **Testing the Collapse Thesis.** Rigorously argue whether attempts to define modesty independently *must* implicitly rely on outside-view logic (e.g., appeals to general failure rates of human judgement, which is itself an outside-view base rate). Examine potential counter-arguments (e.g., modesty as weighting inside-view evidence less).
  *   **Month 4:** **Implications of Collapse (Parasitism Revisited).** If modesty norms collapse into outside-view prescriptions, what does this imply for the latter's foundational status? Does this strengthen the parasitism critique? Articulate the resulting dilemma for normative decision theory.
  *   **Month 5:** **Exploring Alternatives & Limitations.** Critically assess potential alternative foundations for modesty (e.g., purely procedural, risk-aversion) and why they fail or still lead back to the outside view. Analyse hybrid approaches.
  *   **Month 6:** **Synthesis & Drafting.** Consolidate arguments into a cohesive paper draft demonstrating the dependent relationship between modesty norms and the outside view, and the consequent unresolved challenge of reference class selection. Finalise grant report.

  **4. Why this Method?**  
  Conceptual analysis is the *only* appropriate method to address this foundational, philosophical problem inherent in the decision theory literature. Empirical methods cannot resolve the normative and logical questions at stake. Alternatives like large-scale empirical studies on reference class selection are far beyond the scope of this grant and do not directly address the *normative justification* of modesty. This approach focuses precisely on the argumentative gap identified.

  **5. Expected Outcome & Success Criteria:**  
  *   **Success:** A clear, argued position paper demonstrating that normative injunctions to "be modest" lack independent justification and logically collapse into prescriptions to adopt the outside view, thereby exposing the fundamental (and unresolved) dependence of the outside view on inside-view judgements for reference class selection. This constitutes a significant conceptual critique of a widely advocated decision-making tool.
  *   **Deliverable:** A draft journal article (~8,000 words) suitable for submission to a leading philosophy or decision theory journal (e.g., *Philosophy of Science, Behavioural Public Policy, Judgment and Decision Making*).
  *   **Success Looks Like:** A logically rigorous argument that forces a re-evaluation of the relationship between modesty, the inside view, and the outside view, highlighting the Achilles' heel of reference class selection.

  **6. Criteria for Failure:**  
  The project would fail if:
  *   A coherent, independent justification for modesty norms *is* found that avoids collapsing into the outside view.
  *   The argument for parasitism/collapse is found to be logically flawed or based on a misinterpretation of key concepts.
  *   The modesty dilemma is resolved through existing (but previously overlooked) arguments in the literature.
  *   The analysis becomes mired in unresolvable complexities within the timeframe, yielding only inconclusive observations.

  **7. Scope & Honesty:**  
  This is a deliberately *focused*, six-month project. It tackles a specific conceptual problem: the relationship between modesty norms and the outside view, aiming to demonstrate their necessary connection and the resulting exposure of reference class selection as the critical inside-view dependency. **It does not aim to:**  
  *   Solve the reference class problem definitively.
  *   Develop a new, positive theory of reference class selection.
  *   Conduct empirical validation of the outside view.
  *   Provide comprehensive practical decision-making guidelines.

  **This is a six-month project because it isolates a specific, tractable argument within a larger debate.** While the *implications* of the argument (if successful) are significant and could inform longer-term work (e.g., on reference classes or hybrid decision models), the core argument itself is scoped to be achievable within the timeframe through focussed conceptual analysis. The outcome will either be a clear demonstration of the collapse thesis or a clear identification of why it fails – both valuable results for the field.  

  **8. Significance:**  
  By rigorously examining the foundations of a widely promoted decision-making heuristic, this project addresses a critical gap in understanding its limitations and theoretical coherence. It challenges the presumed independence of the "grown-up" outside view and forces a deeper engagement with the unavoidable role of subjective judgement (the inside view) even within supposedly objective methods. The results will be relevant to philosophers of science, decision theorists, behavioural economists, and practitioners aiming for robust forecasting.
