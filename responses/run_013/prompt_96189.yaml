     But note: (2) says the truthmaker is a fact about what would happen *absent interference*. The interference is extrinsic, but the fact that *if there were no interference, it would break* might be intrinsic. Why? Because if two objects are intrinsically identical, then in the same circumstances (without interference) they would break in the same way. So the counterfactual (with the ceteris paribus clause) might supervene on the intrinsic properties and the laws.

