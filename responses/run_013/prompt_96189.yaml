   2. What makes "this glass is fragile" true is a fact about what would happen: it would break if you struck it, absent interference.

   3. On the cases: 
      - foam-wrapped glass: fragile, wouldn't break if struck -> still fragile.
      - sorcerer: would un-fragile on strike -> still fragile, wouldn't break.
