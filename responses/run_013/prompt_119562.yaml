answer: |-
  ### Prose Mapping  
  The poem's architecture mirrors the Divided Line's proportional segments (1:2:2:4) through line counts (4:8:8:16). **First movement (eikasia, 4 lines)** uses water reflections (ripples mistaken for the river itself) to embody shadows-as-reality. **Second movement (pistis, 8 lines)** moves from a reflection to the physical object causing it (ripple → stone), using the syntax: *"[Reflection] is not the [object]... but [tangible description]."* **Third movement (dianoia, 8 lines)** mirrors this syntactically but reverses direction: from a geometric diagram to the principle it depends on (drawn circle → Circle Itself), structured: *"This [figure] points beyond itself... to [abstract principle]."* Both middle movements share water/geometric imagery but invert epistemic direction (perception upward vs. reasoning upward). **Fourth movement (noēsis, 16 lines)** returns to the first’s river image, revealing the ripples as likenesses of actual water, then ascends dialectically to "the sun behind the sun" (the Good). It ends with the philosopher’s descent into danger ("the blade’s arc"), recalling the cave’s prisoners.  

  ---

  ### Poem: *Ascent Directive*  

  **I. [Eikasia: 4 lines]**  
  Not water—only wobbled light,  
  a skin of sky on stone,  
  the river’s ghost. You kneel,  
  and drink the ache for wet.  

  **II. [Pistis: 8 lines]**  
  *This ripple is not the stone it rides,*  
  but the stone’s weight in water—  
  cold grit against the current’s shove,  
  a thing you could strike with your heel  
  and crack, could haul up dripping  
  to your palm, its quartz teeth  
  gnawing silt. What is split  
  from the stream’s body is real.  

  **III. [Dianoia: 8 lines]**  
  *This compass-drawn circumference points*  
  beyond its inked perfection—  
  not to paper, but to Circle:  
  no frayed edge, no lead-smudge flaw,  
  pure curve that holds all points  
  equidistant from the Source.  
  What is spun from the geometer’s  
  unseen axiom is true.  

  **IV. [Noēsis: 16 lines]**  
  But here—where the river climbs  
  back to its cloud, where the stone  
  dissolves to the thought of stone,  
  and thought dissolves to light—  
  you see the ripples for what they are:  
  not water, but water’s cipher,  
  a script the true stream writes  
  on its own flowing skin.  
  *Look up:* past the sun that scalds  
  your eyes, past the blinding noon  
  that feeds the fig tree, the grapevine,  
  the iris—to the sun behind the sun,  
  the fire that fires the flame,  
  the Good that seeds all roots.  
  Now descend. The cave awaits.  
  The blade’s arc loves the neck  
  that bears no chains.  

  ---

  ### Explanation for Students  
  This poem’s structure enacts Plato’s epistemology. The **equal length** of movements II and III (each 8 lines) mirrors how *pistis* (empirical belief) and *dianoia* (hypothetical reasoning) are distinct yet parallel stages: both mediate between shadows and truth, but II moves *from* reflection *to* object (perception’s ascent), while III moves *from* diagram *to* principle (reason’s ascent). Their mirrored syntax highlights this bidirectional mediation. The **fourth movement’s length** (16 lines) embodies the arduous dialectical climb to first principles, dwarfing the first movement (4 lines) just as *noēsis* transcends *eikasia*. By revisiting the ripples in IV and revealing their origin ("a script the true stream writes"), the poem shows how higher knowledge reinterprets lower illusions. Crucially, the proportions aren’t arbitrary—they make the *process* audible. When II and III echo structurally yet invert direction, you hear Plato’s claim that reasoning corrects but doesn’t yet transcend sensory grounding. When IV expands beyond I, you feel the ascent’s exponential cost. The descent’s abrupt return (IV’s end) underscores that truth obligates return—philosophy isn’t escape.
