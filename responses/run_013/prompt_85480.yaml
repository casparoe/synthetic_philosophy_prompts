prompt: |-
  I'm in a graduate seminar on judgment and decision making, and we have just finished with the dollar auction and escalation of commitment. Our readings treat escalation as a bias and pre-commitment — declining to enter, fixing a walk-away price in advance — as the standard remedy. In practice, though, organizations more often escape escalation by changing the decider than by changing the decision: a failing project is handed to a new manager or an outside consultant on the reasoning that the incumbent is too invested to judge it. I would like you to reconstruct what that practice presupposes about practical reasons. It seems to assume that a reason generated by a past expenditure belongs to the person who incurred it rather than to the role, so that a successor facing identical prospects is not merely better placed to cancel but genuinely uncommitted, while the incumbent's position is partly constituted by what they have already done. Is that a defensible account of reasons — a kind of authorship or ownership of one's own commitments — or does the practice merely exploit a psychological fact while the normative situation is the same for both parties? Consider also the ledger: the successor is normally given a project whose past spending has been written off or hidden, which changes what they know and not only how they feel. Since the magnitude of what has already been spent may itself be evidence about the project's prospects, can a cost be normatively inert yet evidentially relevant, and does the practice commit itself to an answer? Please distinguish what the practice strictly requires from what it merely fits well with, and say whether it presupposes a unity of the agent over time that the pre-commitment remedy does not.
reasoning: |-
  Okay, the user is in a graduate seminar focusing on judgment and decision making, specifically discussing the dollar auction and escalation of commitment. The readings present escalation as a bias and pre-commitment as the remedy. However, the user notices that in practice, organizations often handle escalation by changing the decision-maker rather than implementing pre-commitment strategies. They want to understand the philosophical presuppositions behind this practice.

  The user's core question revolves around whether replacing the decider implies that reasons (like sunk costs) are tied to the individual rather than the role. They're asking if the incumbent is genuinely more committed due to their past actions, making it normatively different for a successor. Also, they bring up the ledger issue—past costs being hidden or written off for the new decider. This affects both knowledge and evidence. The user wants to know if costs can be evidentially relevant but normatively inert, and if the practice assumes a unity of the agent over time.

  First, I need to unpack the presuppositions about practical reasons. The practice of changing deciders suggests that sunk costs create personal commitments for the incumbent. This ties into the idea of psychological ownership—where the person who incurred the costs feels responsible, leading to escalation. The successor, without that history, can evaluate the project based purely on future prospects. Normatively, sunk costs shouldn't matter, but psychologically they do. So the practice leverages this psychological fact rather than a normative difference.

  Then there's the ledger aspect. Writing off past costs changes what the new decider knows. The user is questioning whether hiding past expenditures is necessary or just convenient. If past costs are evidentially relevant (e.g., high spending might indicate hidden challenges), then withholding that info could be problematic. The practice might assume that past costs aren't evidentially useful, or it might prioritize psychological detachment over complete information.

  The user also asks about the unity of the agent over time. Pre-commitment strategies don't require this unity—they're about setting rules in advance. Changing deciders, however, treats the incumbent as a continuous agent whose past actions bind them, while the successor is a fresh start. This implies that personal identity over time matters for commitment.

  I should also consider if the practice is defensible. While it's effective psychologically, normatively it sidesteps the sunk cost fallacy rather than addressing it. There might be ethical concerns if hiding information deprives the successor of useful evidence. The practice fits with a view of agents as historically embedded but doesn't strictly require it. Alternatives could involve keeping the same decider but using debiasing techniques, though that's harder.

  The user's deeper need might be understanding the tension between normative rationality and practical organizational behavior. They might be looking for a critique of standard remedies or exploring how agency and identity influence decision-making. They could also be interested in the ethics of information withholding in organizations.
answer: |-
  Your observation cuts to the heart of agency, rationality, and organizational design. The practice of "changing the decider" as an escape from escalation presupposes a complex, hybrid view of practical reasons that blends psychological realism with specific normative commitments, while strategically manipulating information. Let's reconstruct the presuppositions:

  1.  **Authorship, Ownership, and the Binding Nature of Personal History:**
      *   **Presupposition:** The practice assumes that reasons generated by *personal past actions and investments* (sunk costs, effort, reputation stakes, emotional attachment) **belong primarily to the individual agent** who incurred them, not just to the organizational role. The incumbent isn't merely *biased*; their practical reason is genuinely *constituted* by their history with the project. "I started this," "I championed it," "I spent $X million already" become *normative* reasons *for them* to persist, rooted in identity, consistency, responsibility, and perceived obligation.
      *   **Normative Defensibility?** This is contentious:
          *   *Defensible (Partially):* Existentialist, narrative identity, and some virtue ethics perspectives see personal history as constitutive of agency and reason-giving. Breaking a commitment *you made* feels different (and arguably *is* different normatively) than breaking one made by someone else, even if the project state is identical. It concerns integrity of the self over time.
          *   *Indefensible (From Strict Rationality):* Standard rational choice theory (RCT) and consequentialism reject sunk costs as normative reasons. RCT argues only future costs/benefits matter normatively. The successor, facing the *same future prospects*, *should* make the same decision the incumbent *should* make. The practice exploits psychology but doesn't change the normative situation *if* we accept the strict RCT view.
          *   **Conclusion:** The practice presupposes a view closer to the "defensible" camp – that personal authorship creates unique, binding agent-relative reasons. It treats the incumbent's position as *genuinely different normatively* due to their history, not just psychologically biased. The successor is normatively unburdened.

  2.  **The Ledger: Normative Inertia vs. Evidential Relevance:**
      *   **The Practice:** Writing off or hiding *the magnitude* of past spending from the successor is crucial. They see "Project X with future prospects Y," not "Project X where we've *already wasted $Z* with future prospects Y."
      *   **Presupposition 1 (Normative Inertia):** The practice **strictly requires** treating the *quantitative magnitude* of sunk costs as **normatively inert.** The dollar amount itself provides *no valid reason* for future action. Hiding it prevents it from being misused as a reason to escalate ("We must recoup $Z!").
      *   **Presupposition 2 (Evidential Ambiguity & Strategic Omission):**
          *   **Problem:** Past spending *can* be evidence. High spending despite poor results *might* indicate unforeseen complexity, hidden value, or sheer incompetence. Low spending *might* indicate unexplored potential or underinvestment.
          *   **Practice's Handling:** The practice **fits well with, but does not strictly require,** the assumption that the *quantitative magnitude* of sunk costs is *poor* or *misleading* evidence compared to a direct assessment of the project's *current state and future prospects*. It strategically prioritizes:
              *   *Psychological Detachment:* Removing the anchor of the large number.
              *   *Focus on Future:* Forcing evaluation based on "what is it now?" and "where can it go?"
              *   *Avoiding Misinterpretation:* Fearing the successor might *also* fall prey to the "sunk cost as evidence" fallacy ("They spent so much, there *must* be something here").
          *   **Normative Tension:** The practice *acknowledges* the potential evidential role implicitly by hiding it, suggesting it *is* a powerful (though potentially irrational) motivator it wants to avoid. It doesn't necessarily deny that past cost *could* be relevant evidence *if interpreted correctly*, but it pragmatically assumes that the risk of *misinterpretation* outweighs the potential value of that evidence. It commits to the position that *for the purpose of making the termination decision*, the quantitative sunk cost data generates more noise than signal and is best excluded.

  3.  **Unity of the Agent Over Time:**
      *   **Presupposition:** The practice **strongly presupposes a robust unity of the agent over time.** This is crucial and distinct from pre-commitment.
          *   *For the Incumbent:* Their past actions, investments, and declarations are seen as binding *on their present and future self*. The "I" who started the project is normatively connected to the "I" deciding now. Escalation arises partly because the incumbent feels *bound* by their past self's commitments. Changing the decider severs this temporal chain of obligation.
          *   *For the Successor:* They are introduced as a *new* unified agent starting *now*. They are not normatively responsible for past decisions made by a *different* agent (the incumbent). Their practical reasons begin from the current project state.
          *   *Contrast with Pre-commitment:* Pre-commitment (e.g., fixed walk-away price) **does not presuppose this deep unity.** It's a strategic tool used *by the same agent over time* to bind their future self precisely *because* they anticipate their future self might be weak-willed or biased. It treats the future self as potentially distinct in perspective/desire, but still the *same agent* responsible for adhering to the prior commitment. Pre-commitment works *within* the unity of the agent; changing the decider *escapes* it by introducing a new agent.

  **Synthesis & Evaluation:**

  *   **Core Presupposition:** Organizations escape escalation by changing deciders because they presuppose that **practical reasons are partly constituted by an agent's personal history of investment and authorship, creating unique, binding commitments that do not transfer to a successor.** The incumbent is genuinely "committed" in a way the successor is not, normatively *and* psychologically. The successor faces a normatively distinct situation – the *same project future*, but *without the incumbent's past*.
  *   **Defensibility:** This view is psychologically realistic and resonates with non-consequentialist ethical perspectives emphasizing personal integrity, narrative identity, and responsibility for one's own choices. However, it conflicts directly with strict rational choice models that view sunk costs as irrelevant. The practice is pragmatically effective by leveraging this "authorship" view of commitment and strategically stripping away the most potent (and normatively inert) sunk cost information (the dollar amount) to enable a future-oriented decision.
  *   **The Ledger's Role:** The ledger manipulation (writing off/hiding magnitude) is essential for the practice's effectiveness. It strictly requires treating sunk cost *magnitude* as normatively inert. It fits well with, but doesn't strictly require, the view that this magnitude is evidentially weak or misleading. The practice implicitly acknowledges its potential evidential power by hiding it, prioritizing psychological reset and future focus over complex evidence assessment that risks renewed fallacy.
  *   **Agency Unity:** This practice fundamentally relies on the strong unity of the agent over time *for the incumbent* as the source of the binding commitment. It resolves the escalation problem by *replacing* the unified agent burdened by history with a new unified agent starting fresh. Pre-commitment relies on the same unity but attempts to constrain the future self *within* that single agent's timeline.

  **In essence:** The practice treats escalation not merely as a cognitive bias to be overcome by better rules (pre-commitment), but as a **pathology arising from the inescapable normative weight of personal history on a unified agent.** The solution is to introduce a *new agent*, unburdened by that history, and to strategically shield them from the most salient (though normatively invalid) reminder of it (the sunk cost figure), enabling a decision based solely on future prospects and the project's current reality. It's a recognition that reasons are deeply personal and historically embedded, not merely abstract calculations of future utility.
