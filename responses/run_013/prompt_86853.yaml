  Okay, the user is a third-year student in a combined history and philosophy course on nationalism and collective memory. They're applying for a summer research bursary and need to transform their half-formed idea into a solid proposal. Let me unpack their core idea first.

  They've noticed that "lost-cause" narratives like the Confederacy, Masada, Kosovo 1389, and Dunkirk are often lumped together as if they're the same phenomenon - defeats where the losers believe they were morally right. But they suspect there are actually two distinct types: one that helps people live with defeat (consoling/closing), and another that fuels future revanchism (mobilizing/interest-charging). Dunkirk seems to break this pattern entirely. 

  Their confusion centers on two potential variables: whether the group still holds the territory, and whether the enemy was external or internal. They're struggling to isolate which factors matter most, or if it's something else entirely. 

  Now for the proposal requirements: 
  First, they need a clear research question with a determinable answer. I notice they're conflating meaning (what the myth represents to people) and political effects. Since they're in a history-philosophy program, a combined approach makes sense - perhaps framing it as "how does the narrative structure shape both meaning and political potential?"

  Second, they want to preempt obvious objections. The "it depends on context" rebuttal is important to address. A good taxonomy needs predictive power - it should help us analyze new cases, not just describe existing ones. 

  For methodology, they prefer conceptual work with cases as examples rather than deep historical analysis. Given the 10-week constraint and no archives, this seems wise. But will the committee accept it? Probably, if framed as theory-building with empirical grounding. 

  Defining success/failure is crucial. Success would mean clear criteria to classify new cases (e.g., Alamo or Gallipoli). Failure would be if all cases show hybrid traits or if territory/enemy-type proves irrelevant. Dunkirk is already a stress test - if my framework can't explain it, that's problematic. 

  Realistic scope? Ten weeks is tight. They should narrow to 4 core cases max. The work plan should emphasize early framework development with mid-point validation checks. 

  Biggest uncertainty: Is "narrative closure" the key differentiator? The Confederate myth evolved from consoling to mobilizing during Jim Crow - that dynamism might break my binary model. I should flag this risk prominently.

  The user's clearly done background reading but needs help structuring. Their metacognition about "pattern-matching" shows good academic self-awareness. I'll build on that strength by making reflexivity part of the method.
answer: |-
  Here’s a structured research proposal based on your core idea, refined for clarity, feasibility, and academic rigor within your constraints. I’ve prioritized determinacy, method, and falsifiability.

  ---

  **Research Proposal: Taxonomies of Defeat — Towards a Typology of Lost-Cause Narratives in Collective Memory**

  **1. Research Question**  
  *What structural features distinguish consolatory lost-cause narratives (which resolve historical trauma) from mobilizing lost-cause narratives (which perpetuate political grievance), and how do these features determine the narrative’s socio-political function?*  
  **Determinate Answer**: A typology based on two key variables: (A) **Spatial Outcome** (retained/occupied homeland vs. lost homeland) and (B) **Enemy Framing** (external occupier vs. internal adversary). This predicts whether a narrative primarily functions to resolve trauma or sustain revanchism.

  **2. Why Obvious Answers Fail & Why Taxonomy Matters**  
  Existing scholarship often treats lost-cause myths as homogenous "chosen traumas" or focuses on contextual politics alone. This is insufficient because:  
  - **"It depends on context" is descriptively true but analytically empty**. A taxonomy isolates *recurring* structural elements across contexts, enabling prediction.  
  - **Function ≠ Content**: Similar rhetoric ("heroic sacrifice," "moral victory") serves opposing purposes (closure vs. mobilization). We need criteria beyond surface rhetoric.  
  - **Dunkirk’s anomaly** (a retreat framed triumphantly without revanchism) exposes gaps in current models. A robust typology must explain such outliers.  
  A taxonomy is better than a list if it: (i) explains cases outside its dataset, (ii) identifies necessary/sufficient conditions for each type, and (iii) reveals why hybrid cases (e.g., Confederacy’s evolution) shift categories.

  **3. Method: Conceptual Analysis with Case-Based Validation**  
  - **Approach**: Develop a theoretical framework using philosophical tools (narrative theory, collective memory studies) and test it against historical cases as *illustrative probes*, not exhaustive histories.  
  - **Sources**: Secondary literature on the four core cases (Confederacy, Masada, Kosovo 1389, Dunkirk) + **one fifth case** (the **Alamo** — ideal as a U.S./Texas myth with contested modern mobilization).  
  - **Defensibility**: This is appropriate for a bursary. It leverages your course’s interdisciplinary ethos and demonstrates theoretical innovation. Emphasize that conceptual clarity is *foundational* for empirical work. Justify: "Without a framework to distinguish narrative types, comparative analysis risks conflating functionally distinct phenomena."  
  - **Weeks 1–2**: Literature review (existing theories of defeat myths).  
  - **Weeks 3–4**: Framework development (define variables, hypotheses).  
  - **Weeks 5–7**: Case analysis (apply framework to each case).  
  - **Weeks 8–9**: Test anomalies (Dunkirk, Alamo), refine model.  
  - **Week 10**: Drafting.

  **4. What a Result Looks Like**  
  - **Success Criteria**: A set of **diagnostic questions** to classify any lost-cause narrative:  
    1. *Post-Defeat Spatial Status*: Did the group retain physical control of the homeland?  
    2. *Enemy Characterization*: Is the victor framed as an *external* force or *internal* antagonist (e.g., "tyrannical central government")?  
    3. *Temporal Orientation*: Does the narrative emphasize *past* valor (consolatory) or *future* reclamation (mobilizing)?  
  - **Falsifiability**: The two-type claim would be undermined if:  
    - A case seamlessly exhibits **both functions simultaneously** without evolving (e.g., Kosovo myth *only* consoles Serbs *and* mobilizes them irreducibly).  
    - **Spatial Status/Enemy Framing prove irrelevant** (e.g., a group with no territorial loss generates mobilizing myths identical to Kosovo’s).  
    - **Dunkirk is irreducible to either type** *and* shares core variables with mobilizing/consolatory cases.

  **5. Feasibility, Failure, and Scope**  
  - **Realistic in 10 weeks?** **Yes, but narrowly scoped**. Focus *only* on the 4–5 cases. Avoid over-extending to "all defeat myths."  
  - **Failure Modes**:  
    - Variables are **non-predictive** (e.g., Masada’s lost homeland + external enemy *should* predict mobilization, but functions consolatory).  
    - Cases show **hybridity** that collapses the taxonomy (e.g., Confederacy’s shift from consolation post-1865 to mobilization post-1890).  
    - **Insufficient secondary sources** on narrative reception (e.g., how medieval Serbs viewed Kosovo pre-19th c.).  
  - **Mitigation**: If variables prove weak, pivot to analyzing **narrative plasticity** (how myths change function when spatial/enemy frames are reinterpreted). This still answers the core question.

  **6. Work Plan**  
  - **Week 1**: Literature review — theories of collective memory (e.g., Halbwachs’ social frameworks), nationalism studies (e.g., Smith’s ethno-symbolism).  
  - **Week 2**: Literature review — case-specific historiography; identify gaps.  
  - **Week 3**: Define key terms (e.g., "consolatory" = narrative resolution of trauma; "mobilizing" = narrative as call to action). Draft hypotheses.  
  - **Week 4**: Develop typology matrix (Spatial Status x Enemy Framing → Predicted Function).  
  - **Week 5**: Case study 1 (Kosovo 1389) + Case study 2 (Masada).  
  - **Week 6**: Case study 3 (Confederacy) + Case study 4 (Dunkirk).  
  - **Week 7**: Case study 5 (Alamo) + Identify inconsistencies.  
  - **Week 8**: Revisit anomalies; refine/revise typology.  
  - **Week 9**: Draft full paper; articulate diagnostic criteria.  
  - **Week 10**: Revise; write abstract; polish.

  ---

  **Confidence Assessment & Key Uncertainty**  
  - **High Confidence**: The core insight — that lost-cause myths are functionally heterogeneous — is valid and underexplored. The variables (spatial status, enemy framing) are logically defensible starting points.  
  - **Lowest Confidence**: **Whether "Enemy Framing" is a truly independent variable**. In cases like the Confederacy, the "internal enemy" (U.S. government) is often reframed as *external* ("Northern aggression"), blurring the distinction. This could collapse the taxonomy if framing is purely strategic, not structural. *Mitigation*: Treat enemy framing as a *narrative choice* shaped by political goals, not an objective fact.  

  This proposal offers a clear, testable framework while embracing the interdisciplinary nature of your course. It tackles a genuine gap in scholarship and provides concrete deliverables within 10 weeks. If the committee seeks more empirical depth, stress that this *enables* future archival work by defining what to look for. Good luck!
