  **Key Design Rationale**  
  - **The Trap**: Parsimony bonuses (50pts for 0 intermediates) bait teams into greedy collapses. Challenges then expose why "atoms/neurons/bits" alone can't explain phenomena.  
  - **Controlled Revelation**: Hook cards operationalize skyhooks without naming them. Teams self-discover their explanatory emptiness through penalties.  
  - **Debrief Structure**: Moments map directly to concepts (e.g., failed minimal chains → greedy reductionism). The "cannot_reproduce" flaw becomes a teaching moment about context-dependent validity.  
  - **Failure Mitigation**: Proactive facilitation during building/challenges keeps focus on epistemic tension rather than point-scoring.  

  **Run Notes**  
  - **First-Time Pitfall**: Teams may avoid minimal chains. Counter by emphasizing "50pts = automatic lead" during rules.  
  - **Critical Intervention**: When scoring, explicitly contrast teams that took the parsimony bait vs. those who didn't—highlight how both strategies expose reductionism's double-edged nature.  
  - **Post-Game Bridge**: Use the photocopier joke example to show why even valid reductions (e.g., sound waves) can't explain humor without losing meaning—transition to Dennett seamlessly.
