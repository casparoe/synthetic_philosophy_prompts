answer: |-
  ## Dialogue: The Content Wars

  **Setting:** A sun-drenched courtyard at a philosophy of mind conference. Coffee cups litter the table. **TELEOSEMANTICIST (T)** and **TRACKING THEORIST (TT)** are deep in debate.

  **TT:** Your historical functions are a crutch, T. Meaning rides on reliable indication *now*, fixed by how the system *would* break down. Take your bird’s neuron L firing at a shadow. It *covaries* with shadows, even in the lab-reared bird. The asymmetric dependence is clear: shadows cause it *directly*; hawks only cause it *via* shadow-covariation. So L means *shadow*, period. History is just noise.

  **T:** Noise? That “noise” explains why the bird *dives*. Your shadow-covariation is accidental! L’s biological function—what it was *selected for*—is to get the bird to dive from hawks. The consumer systems (dive circuits) *use* it *as* a hawk detector. So even in the lab bird, L misrepresents a shadow *as* hawk-danger. That’s the only way to explain the dive behavior *and* the misrepresentation.

  **TT:** Misrepresentation? Fine—but I handle it with asymmetric dependence! When L fires at a hawk-shaped cloud, it’s wrong *because* that firing asymmetrically depends on the *shadow*-law. The cloud-triggered firing wouldn’t happen without the shadow-triggered firings. History adds nothing. What about your homunculus? Your “consumer systems” need to *represent* how to use L’s output. How do *they* get their content? Circularity!

  **T:** Not circular—recursive! Consumer functions are also selected. The dive circuit has the function to produce diving *when* it gets hawk-input. It doesn’t need to “represent” anything internally; its output is coupled to success conditions. Your asymmetric dependence is just disguised function-talk! Why should the “F-caused” tokens be privileged? Because they’re the *normal* or *intended* cause? That’s my machinery smuggled in!

  **TT:** (Leans forward) Okay, chew on Case 2 then. Same L neuron, same bird. Now it’s *also* used to snap at flushed insects. That covariation is reliable and adaptive! By your lights, T, does L suddenly mean *insect-flushing-shadow*? Or split content? Or does the original “hawk!” content override the learned use?

  **T:** (Frowns) Cultural learning isn’t a *selection* regime. The mechanism wasn’t *selected* for insect-snapping; it was exapted. The consumer system for snapping *parasitizes* the existing indicator. L still means *hawk-danger* for the innate dive system. The snapping system misuses it as a correlational cue. No content split—just one proper function and one derived use. Your view? Does L now mean *shadow-or-insect-flusher*? Qua problem!

  **TT:** Qua problem’s my forte! Asymmetric dependence applies: L fires because of shadows *first*. Insect associations depend asymmetrically on shadow-covariation. If insects stopped casting shadows, L wouldn’t fire for them. Shadows are primary. But if the bird *only* used L for insects now, the dependence flips! Content tracks *current* reliable indication plus counterfactual dependencies. History’s irrelevant.

  **T:** Irrelevant? Case 3 sinks you. An engineer salvages a smoke-detector component, wires it to open vents on CO2. It reliably indicates CO2 now. By your covariation, it *means* CO2. But it was *designed* as a smoke detector! Its structure was selected for smoke. The vent system uses it *as* a CO2 indicator, but that’s not its proper function. Human design *is* selection history—intentional design fixes original function.

  **TT:** Design history matters for *why it works*, not what it *means now*. If it reliably indicates CO₂ *and* the CO₂-caused firings don’t asymmetrically depend on smoke firings (maybe smoke never triggers it in this setup), then it means CO₂. Your view forces absurdity: is a repurposed shovel “really” a dirt-mover forever? Meaning is use-covariation.

  **T:** For artifacts, original design *fixes* proper function. The vent system misuses it. Teleosemantics handles misrepresentation cleanly: it’s a state failing to perform its function. Your asymmetric dependence is gerrymandered. How do you handle the molecule-for-molecule duplicate of L, grown in a vat with no selection history? You *have* to say it means shadow—covariation holds. But it’s empty! No function, no content, just correlation.

  **TT:** And you have to say it means *nothing*—despite behaving identically! That’s epiphenomenalism about meaning. Covariation is real physics; your “proper functions” are fairy tales. But fine, for artifacts designed from scratch—yes, human design counts as selection history. Case 3’s component *has* two histories. Its meaning? Ambiguous. Maybe content is relative to a system. The vent system treats it as CO₂; the smoke-alarm designer intended smoke. Your theory can’t handle multiple stakeholders.

  **T:** And yours can’t handle normativity without sneaking in norms. Why *should* it covary? Why is misrepresentation *wrong*? Only functions ground “should." Let’s admit it: we’re stuck. You privilege current relations; I privilege historical norms. Neither reduces to the other.

  *(They stare at their cold coffee. The cicadas drone.)*

