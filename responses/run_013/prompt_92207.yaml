answer: |-
  You've perfectly illustrated the paradox but missed the crux: each "rig" implies a different *physical mechanism* with distinct symmetries that demand different Haar measures. Rig A's midpoint process fixes the plane as the sample space, so the Euclidean group's invariance gives the uniform measure on R²—yielding 1/4. Rig B's radial sampling implies invariance under rotations and radial scaling *but not translations* (it breaks if you shift the disk!), limiting us to the group generating chords via radius-point pairs—hence 1/2. Rig C's endpoint method fixes the circle boundary S¹, so rotational invariance on S¹×S¹ (minus diagonal) applies—giving 1/3. The "disk" alone has rotational/scale symmetry, but each rig grafts an *additional* sampling structure that breaks full Euclidean invariance. Specify *how* randomness is physically realized—the operational symmetry—and the prior crystallizes. Your error? Treating "random chord" as a primitive rather than emergent from the generative act. Next point?
