answer: |-
  Here's your roadmap, structured exactly as requested, with a focus on leveraging your unique angle and limited time for maximum impact:

  ---

  ### 1. **The State of Play**  
  The live debate pits radical sortition advocates (replace all politicians with citizens' assemblies) against gradualists (use sortition for advisory panels or specific functions). Both sides clash over whether ordinary citizens can handle complex legislation versus whether elections inevitably corrupt governance. Term limits are seen as a band-aid that fails to fix systemic incentives. Your agenda-council idea lands in the under-explored middle: *sortition as a gatekeeper* rather than a replacement. The core disagreement here is whether controlling the agenda alone can dismantle careerist politics without triggering competence disasters.

  ---

  ### 2. **Your Shortlist**  
  1. **Legitimacy Under Partial Control:** Will citizens/viewers accept agenda-setting by lottery if politicians still hold final vote power?  
  2. **Agenda Corruption Resilience:** Does random-agenda control actually prevent lobbying/partisan capture, or just shift it?  
  3. **Institutional Friction:** What specific mechanics would make politicians *comply* with (rather than sabotage) a citizen-chosen agenda?  
  4. **Competence Thresholds:** What’s the *minimum* expertise needed for citizens to set a viable agenda (not laws)?

  ---

  ### 3. **Why This Order**  
  **① Legitimacy Under Partial Control**  
  *Why First?* If citizens dismiss the council as "unqualified" or politicians brand it as "undemocratic," the model collapses before implementation. This is **upstream** of everything: no buy-in = no experiment. **Answerable?** Yes—analyze public trust in juries vs. Congress, historical precedents (Athenian nomothetai), and poll existing deliberative polls. **Open Ground?** Mostly. Legitimacy research focuses on full sortition or advisory bodies, not agenda-vetting hybrids. **For Impact:** You need to prove that citizens perceive agenda-setting as a *distinct*, delegatable task (like jury duty) rather than "governing."

  **② Agenda Corruption Resilience**  
  *Why Second?* Your core thesis—that the agenda is "for sale" under elections—must hold under stress-testing. If lobbyists easily capture the council or politicians circumvent it, the model fails. **Answerable?** Perfect for theoretical rigor: map influence pathways (e.g., can donors sway council member selection? Can politicians add poison pills to bills?). Compare to corruption in jury systems. **Open Ground?** Yes. Most anti-corruption analysis targets full legislatures, not agenda bodies. **For Impact:** Show that randomization + short terms + no reelection creates *asymmetric costs* for corruptors (high effort, low ROI).

  **③ Institutional Friction**  
  *Why Third?* Assume the council exists and is legitimate—will the system *work*? Politicians retain tools to neuter it: delaying votes, amending bills into unrecognizability, or flooding the council with trivial topics. **Answerable?** Reverse-engineer legislative loopholes and design countermeasures (e.g., mandatory up/down votes, amendment limits). Study analogous systems (e.g., Ireland’s Citizens’ Assemblies influencing referendums). **Open Ground?** Critical and neglected. Technocratic design is the "plumbing" scholars ignore. **For Impact:** Identify 3-5 concrete procedural rules that force sincere engagement from politicians.

  **④ Competence Thresholds**  
  *Why Last?** Your model sidesteps the heaviest competence demands (no law-drafting by amateurs), but setting an agenda still requires filtering chaos into actionable proposals. **Answerable?** Study real citizen assemblies (e.g., France’s Climate Convention): How did they frame topics? What staff/expert support was critical? **Open Ground?** Over-chewed for full legislatures, but not for agenda-setters. **For Impact:** Define the "scaffolding" needed (e.g., expert briefings, professional facilitators) without making the council a puppet.

  ---

  ### 4. **Where You're Probably Wrong**  
  - **Quietly Doing Work:** Your assumption that agenda control is "low-competence" is doing heavy lifting. Drafting laws requires expertise, but *prioritizing* issues amidst conflicting demands is cognitively brutal. Don’t undersell this.  
  - **Drop This (Even If Interesting):** "Is sortition more representative than elections?" For your model, statistical representativity matters less than *perceived* legitimacy and corruption resistance.  
  - **Blind Spot:** Politicians could still trade favors *within* the council’s chosen bills (e.g., "I’ll fund your dam if you weaken the EPA clause"). Agenda control doesn’t kill transactional politics—it corrals it.

  ---

  ### 5. **What Would Reshuffle the List**  
  1. **If early research shows citizens fundamentally reject agenda-setting by lottery** → Move **Legitimacy** to urgent crisis status. Everything hinges on this.  
  2. **If you find real-world cases where politicians systematically ignored citizen-set agendas** (e.g., ignored ballot initiatives) → **Institutional Friction** becomes the #1 barrier. No procedural design can force compliance if elites have a culture of defiance.

  ---

  ### Your Year’s Work in a Nutshell
  Focus on **Legitimacy + Corruption Resilience** (Questions 1 & 2). These are your unique value-add: testing whether a narrow, powerful application of sortition can survive contact with political reality. Write two essays dissecting these, then one on **Institutional Friction** (Question 3). If time remains, tackle **Competence** (Question 4) as an appendix. This order maximizes impact: if the first two hold, reformers have a plausible lever; if they fail, you’ve saved others years of dead ends.
