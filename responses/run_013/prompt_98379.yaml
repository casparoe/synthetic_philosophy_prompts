prompt: |-
  Okay so I have zero formal background in this, I just read a lot and I've gotten kind of obsessed with the sortition thing lately — picking lawmakers by lottery, like in Athens. My whole reason for caring is the career-politician problem. I don't think politicians are bad people, I think the job is a job: you have to win the next election, keep your donors happy, and your already thinking about your next office or your book deal or your lobbying gig. Somebody who serves one term by lottery and goes back to their normal life doesn't have any of that. Term limits seem like the weak version of the same fix to me, but I could be wrong about that too.

  Here's the thing I keep going back and forth on, and it's a bit of a weird idea so bear with me. What if you don't sortition the people who *vote* on laws, but only the people who decide what gets voted on? Like a randomly chosen "agenda council" that picks, say, the ten or fifteen bills the elected legislature has to take up that session. Keep the elections, keep the professional politicians, but they can only act on stuff a random sample of citizens put in front of them. My gut says this gets you most of what I actually care about — the agenda stops being for sale — while dodging all the obvious objections to amateur lawmakers who don't know anything. But I have no idea if this is a real idea or if I'm just fooling myself.

  I've got about a year of evenings free and I want to write three or four long essays that might actually matter, not just blog posts nobody reads. So what I want from you: what are the open questions in this whole area — sortition, term limits, the career-politician problem — and which ones should I actually spend that year on? And I mean given my agenda-council idea specifically, because I suspect a bunch of the standard questions people always raise (fair representation, competence, etc.) matter less for that version than everyone assumes, and some boring unglamorous ones matter way more.

  Lay it out like this for me:

  1. **The state of play** — keep it to one paragraph, plain language. What are the live disagreements here right now, not the textbook version.

  2. **My shortlist** — the three or four questions you think deserve the year. One line each, just naming the question.

  3. **Why this order** — the part I care about most, so give it room, a good paragraph per question. For each: is it upstream of the others, is it actually answerable by somebody like me with no data and no institution behind me, is it still open ground or has it been chewed over to death already, and what would have to be true for the answer to matter at all.

  4. **Where I'm probably wrong** — where my agenda-council idea is quietly doing the work in your ranking and where it shouldn't be, plus anything you'd tell me to drop even though it's interesting.

  5. **What would reshuffle the list** — the one or two things that, if I learned them, would make me reorder the whole thing.
