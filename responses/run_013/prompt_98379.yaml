  Why this order? Legitimacy is foundational; without public buy-in, other questions are moot. The user can tackle this through thought experiments and historical analogs, no data needed. Next, corruption resilience is answerable via logic and case studies (e.g., comparing insulated bodies like juries). Institutional friction requires political realism but is underexplored for agenda councils. Competence is downstream—addressed last since their model minimizes this risk. 

  Where they might be wrong: They’re underestimating how politicians could circumvent the agenda (e.g., gutting bills via amendments). Also, assuming logistical simplicity—recruiting 500 citizens for a year is harder than jury duty. The "boring" question of council selection mechanics (stratification, compensation) is actually vital. 

  What would reshuffle? If early research shows overwhelming public skepticism toward sortition, legitimacy becomes an urgent crisis. Or if evidence emerges that elected bodies consistently ignore citizen-set agendas, the model’s feasibility crumbles. 

