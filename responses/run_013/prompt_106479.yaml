answer: |-
  Here’s a structured research proposal draft in British English, adhering to your specifications:

  ---

  **Summary** (120 words)  
  This project investigates the transatlantic meaning divergence of ‘liberal’—social-democratic in US usage, free-market in European contexts—to determine whether it constitutes polysemy (one word with related senses) or homonymy (two distinct words). Using established lexical-semantic tests (zeugma, contradiction, etc.), it analyses real usage patterns to assess if these diagnostics yield a clear verdict or reveal deeper complexities. By examining directionality (historical precedence) and neighbouring terms (e.g., ‘progressive’, ‘libertarian’), it explores whether the divergence reflects semantic drift or independent developments. Ultimately, it questions whether political disputes involving ‘liberal’ are substantive or partly verbal, challenging assumptions about conceptual alignment in cross-dialectal political discourse.

  **The Question**  
  Is the transatlantic divergence in ‘liberal’ best characterised as:  
  (a) **Polysemy** (a single lexical entry with contextually modulated senses),  
  (b) **Homonymy** (two distinct lexical entries sharing form), or  
  (c) A case where standard tests **fail to deliver** a clear taxonomy, revealing limitations in applying semantic diagnostics to politically contested terms?  

  *Sub-questions:*  
  1. Is one dialectal sense historically prior or semantically unmarked?  
  2. Do neighbouring terms exhibit parallel divergences, suggesting systemic conceptual realignment?  

  **Why It’s Still Open**  
  Standard polysemy/homonymy tests (e.g., *"She’s liberal with her time and with market regulations"* → zeugma effect) are designed for stable, decontextualised word senses. ‘Liberal’s’ politically charged, dialectally variable usage may:  
  - Yield **conflicting test results** (e.g., contradiction tests might suggest homonymy, while etymology suggests polysemy).  
  - Be distorted by **metalinguistic awareness** (speakers know both senses exist, influencing judgements).  
  - Reflect **value-laden framing**, where diagnostic sentences feel tendentious rather than neutral. Existing accounts (e.g., Gallie’s ‘essentially contested concepts’) bypass the *lexical mechanics* of divergence, while semantic models rarely address *cross-dialectal political terms* specifically.  

  **Plan of Work** (6 months)  
  - **Month 1: Literature & Methodology Synthesis**  
    Review lexical semantics (Cruse, Lyons) on polysemy tests; political theory on conceptual contestation (Freeden). Formalise diagnostic tests:  
    *Zeugma:* "He is [liberal] and [liberal]" (e.g., *"He is liberal in his views on immigration and liberal in opposing welfare"* – does this feel incongruous?).  
    *Contradiction:* "X is liberal but not liberal" (is this necessarily contradictory?).  
    *Conjunction-reduction:* "American liberals and European liberals" (does this imply a unified category?).  
    *Has-two-meanings test:* Native speaker intuitions on whether ‘liberal’ has "two meanings".  
  - **Month 2: Corpus Analysis & Data Collection**  
    Extract dialectally tagged examples (e.g., EN-US vs EN-GB/EN-EU corpora like GloWbE, Europarl). Harvest natural instances of test-relevant constructions.  
  - **Month 3: Applying Diagnostics**  
    Systematically apply tests to corpus data. Conduct controlled surveys (e.g., via Prolific) with US/UK respondents to gauge metalinguistic intuitions.  
  - **Month 4: Directionality & Neighbouring Terms**  
    Trace historical trajectories using historical corpora (COHA, Hansard). Repeat diagnostics for ‘progressive’, ‘libertarian’, ‘social democrat’ to identify parallel shifts.  
  - **Month 5: Analysis & Interpretation**  
    Map test outcomes: Consistent results favour (a) or (b); inconsistency supports (c). Assess if divergence direction (e.g., US sense as an innovation) is corroborated.  
  - **Month 6: Drafting & Implications**  
    Synthesise findings. Argue *either* for a definitive classification *or* that the indeterminacy itself reveals political terminology’s resistance to standard semantic taxonomy. Frame implications for ‘merely verbal dispute’ theories.  

  **Success and Failure**  
  - **Success:**  
    - A: Clear taxonomy emerges, demonstrating how semantic diagnostics resolve political-verbal confusion.  
    - B: Tests conflict robustly, forcing refinement of polysemy models for politically contested, cross-dialectal terms.  
    - *Core deliverable:* A framework for diagnosing when political disagreements are lexical vs. substantive.  
  - **Failure:**  
    - Tests are inapplicable or universally ambiguous (trivialising the divergence).  
    - Dialectal variation *within* US/Europe swamps transatlantic signals.  
    - Findings merely confirm existing intuitions without theoretical advancement.  

  **Scope and Risks**  
  - **Scope Management:**  
    Focus on prototypical cases (US vs UK/Germany/France). Prioritise high-frequency constructions. Use curated corpus subsets.  
  - **Key Risks:**  
    1. **Pragmatic Overload:** Political speech is heavily inferential. Tests may detect rhetorical strategies rather than lexical semantics (mitigation: control for context in surveys).  
    2. **Intra-Dialectal Heterogeneity:** US ‘liberal’ varies regionally; ‘European’ masks national differences (mitigation: clearly define comparator dialects, acknowledge granularity limits).  
    3. **Diagnostic Fallibility:** Semantic tests are heuristic, not algorithmic (mitigation: treat outcomes as probabilistic evidence).  
  - **Critical Risk:** **Ambiguity of Negative Evidence** – If tests yield mixed/null results, arguing this is *significant* (not mere failure) requires careful philosophical defence.  

  --- 

  This structure keeps the proposal lean, hypothesis-driven, and methodologically transparent, fitting a 1500-word limit. It emphasises the *testability* of the core ambiguity while allowing the outcome to challenge the tests themselves—aligning with your aim to leave room for either verdict.
