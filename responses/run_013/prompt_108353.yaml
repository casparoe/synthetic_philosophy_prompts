prompt: |-
  I cover science and medicine for a mid-size daily, and I sit on our standards committee, which sounds fancier than it is. We meet Thursday morning and I have to circulate a written opinion Wednesday night, so I need this to be usable.

  Here's the case. A colleague on the health desk has spent four months on a woman in her late fifties: pancreatic tumor, months to live, a pilgrimage with her church, and eighteen months later the scans are clean. Nobody disputes she was sick — the before-and-after imaging is in the file, and two oncologists with no connection to her church say the remission is real and unexplained by anything she was treated with. The diocese has opened one of its quiet inquiries, which is how these things go. The reporter wants to run it, lede: "doctors can't explain how...". The paper across town is definately running it Sunday as a miracle no matter what we do.

  Two people on the committee want to kill it. Not because the reporting is wrong, but because they say "doctors can't explain" does the same work as the tabloid version with better manners. They point out we would never run the weeping-statue story out of Ohio, or the Indian holy man who supposedly hasn't eaten in decades, and if the answer is "our readers aren't Hindu," that's not a principle, it's a market. Two others say the opposite: we report facts, the scans are facts, and spiking the story because the explanation might be religious is exactly the condescension our readers already accuse us of. The reporter insists the honest word is "unexplained" and that "inexplicable" is a different word entirely, which I think is the whole fight in one syllable.

  I know the Hume material the way most people do — the bit about it being more likely the witnesses are wrong than that the dead got up. A friend who teaches philosophy also says the definition is a mess on Hume's own view of laws: if a law of nature is just a summary of what always happens, then an exception isn't a violation, it's a correction. He says that's supposed to matter for how we write the story and I don't fully follow it, so use it if it's relevant.

  What I want is a memo that settles two things. First the story: run, hold, or run with conditions, with the conditions spelled out — what the lede and the nut graf can and can't say, whether we describe the diocese's process, and what we do when the other paper goes first. Second, a rule we can apply again, because this is the third one of these in two years and we keep starting from scratch. I've been putting it off and now its due.

  Be honest about the hard parts and skip the philosophy seminar. The thing that bugs me: a miracle is by definition a one-off, so you can't rerun it, which means the instincts that normally keep us honest — second source, wait for replication — just don't apply. Does that make us more careful or less? And if Hume's argument really does cut against all surprising testimony and not just the religious kind, say so, because that changes what the memo should say. Give the other side its best case, not a strawman.

  No preface — start with the memo itself, recommendation in the first line, reasoning after.
reasoning: |-
  Okay, the user is a science and medicine reporter on a standards committee at a mid-size daily newspaper. They need to draft a memo by Wednesday night for a Thursday meeting. The case involves a colleague's story about a woman with terminal pancreatic cancer who experienced unexplained remission after a church pilgrimage. The committee is divided: some want to kill the story arguing "doctors can't explain" implies miracle without saying it, while others believe suppressing factual medical information due to potential religious interpretation is condescending. The reporter insists on using "unexplained" versus "inexplicable" as a key distinction. 

  The user needs a memo that:
  1. Decides whether to run/hold the story with specific conditions (lede language, diocesan process coverage, response to competitor's "miracle" framing)
  2. Establishes a reusable rule for future similar cases (third in two years)
  3. Addresses core tension: how to report genuinely unexplained events when standard verification tools (replication, second sourcing) don't apply to one-offs
  4. Considers if Hume's testimony critique applies universally beyond religious claims
  5. Avoids philosophical tangles while acknowledging hard trade-offs

  Key tensions to resolve:
  - Accuracy vs. implication: Can "unexplained" remain neutral or does it inevitably signal supernatural to readers?
  - Journalistic duty: Is withholding documented medical facts due to possible misinterpretation justifiable?
  - Precedent setting: Would publishing create expectation for similar stories (weeping statues etc.)?
  - Competitive pressure: How to respond when rival paper runs definitive "miracle" version?

  Hume analysis distillation:
  - The philosophy professor's point matters: If natural laws are descriptive (not prescriptive), single exceptions don't "violate" nature but suggest incomplete understanding. This supports "unexplained" over "inexplicable".
  - Hume's witness reliability argument applies equally to all extraordinary claims, not just religious ones. But here, the evidence (scans, multiple MDs) is stronger than typical testimony.

  Structural approach:
  - Lead with recommendation to RUN WITH CONDITIONS
  - Define conditions that enforce strict fact boundaries: lede can state medical mystery but must immediately anchor in evidence; explicitly separate established facts from interpretations (diocese/church views)
  - Build rule around "documented anomaly" framework: focus on verifiable evidence, require medical consensus of inexplicability, decouple event from attributed causes
  - Address competitive response: proactive framing in our version, avoid debunking rival
  - Acknowledge the replication problem: such stories require higher evidence thresholds precisely because they're unrepeatable
answer: |-
  **MEMORANDUM**  
  **TO:** Standards Committee  
  **FROM:** [Your Name], Science & Medicine Reporter  
  **DATE:** Wednesday [Date]  
  **SUBJECT:** Recommendation on Unexplained Remission Story / Policy for Documented Anomalies  

  **RECOMMENDATION:** Run the story with strict conditions (detailed below). Adopt the attached policy (Section II) for future cases.  

  ---

  ### I. DECISION & CONDITIONS FOR THIS STORY  
  **Run with these binding conditions:**  
  1. **Lede/Nut Graf Language:**  
     - ✅ **Permitted:** “Doctors cannot explain,” “medical mystery,” “unexpected remission,” “scans show no evidence of cancer,” “contradicts typical prognosis.”  
     - 🚫 **Prohibited:** “Miracle,” “inexplicable,” “defies science,” “miraculous,” or any term implying supernatural causation or finality. The reporter is correct: “Unexplained” acknowledges current limits of medical knowledge; “inexplicable” declares permanent unknowability. The distinction is non-negotiable.  

  2. **Diocese Inquiry:**  
     - Include one sentence acknowledging the inquiry exists, framed neutrally: *“The local diocese has opened a routine review, standard in cases where individuals attribute recovery to faith.”*  
     - Do **not** detail the inquiry’s process, imply church endorsement, or suggest the inquiry validates the remission.  

  3. **Competitor Response:**  
     - If the rival paper runs a “miracle” narrative first, **do not** rebut or mention their framing. Stick to our facts: State the medical anomaly, cite expert consensus on its rarity, and note that alternative explanations (including religious ones) exist but are unverified. Headline: “Pancreatic Cancer Remains After Terminal Diagnosis; Doctors Baffled.”  

  4. **Structure Mandates:**  
     - **Paragraph 3 must contain:** Verified medical facts (timeline, scans, treatments attempted, oncologist quotes).  
     - **Paragraph 5 must contain:** This line: *“While some attribute the recovery to divine intervention, no scientific evidence confirms this, and spontaneous remission—though exceptionally rare—is documented in medical literature.”*  
     - **No anonymous sources:** All oncologists and church officials must be named.  

  ---

  ### II. POLICY FOR FUTURE “DOCUMENTED ANOMALIES”  
  **Scope:** Applies to events where (a) physical evidence confirms an unexpected outcome, (b) experts verify it contradicts expectations, and (c) non-scientific explanations are prominently claimed.  

  **Criteria for Publication:**  
  1. **Evidence Threshold:**  
     - Objective documentation required (e.g., medical imaging, lab results, timestamped video).  
     - At least two independent, credentialed experts (e.g., oncologists, engineers) must confirm the anomaly is genuine and unsolved with current knowledge.  

  2. **Language Rules:**  
     - Use **“unexplained” or “unexpected”**—never “inexplicable,” “impossible,” or faith-affirming terms.  
     - **Separate facts from attribution:** State what happened objectively before noting claimed causes (e.g., *“X occurred; Y group attributes it to Z”*).  

  3. **Context Mandatory:**  
     - Include a benchmark for rarity: *“Similar cases occur in approximately 1 in 100,000 diagnoses”* or *“No peer-reviewed study has replicated this.”*  
     - Note if the phenomenon is documented (even anecdotally) in scientific literature.  

  4. **Kill Criteria:**  
     - If the only sources are eyewitnesses or advocates (e.g., weeping statues, fasting holy men).  
     - If the anomaly relies on subjective interpretation (e.g., “felt cured” without scans).  

  ---

  ### III. RATIONALE & HARD TRADEOFFS  
  - **Why run this?** Suppressing verified medical facts because others may misinterpret them *is* condescending and violates core journalism. The scans and oncologists are real; our readers deserve this information.  
  - **Why not call it a miracle?** Hume’s core insight holds: Testimony for extraordinary events requires extraordinary evidence. Here, the evidence (scans, experts) is robust—but it still doesn’t prove supernatural causation. “Unexplained” respects uncertainty; “miracle” asserts a conclusion.  
  - **The one-off problem:** Precisely because replication is impossible, we demand higher evidence (objective docs + expert verification). This makes us *more* careful, not less.  
  - **Hume’s universality:** His critique *does* apply equally to all extraordinary claims (secular or religious). But here, the physical evidence lifts this beyond mere testimony. A “weeping statue” has no comparable proof.  
  - **The real risk:** Not that we imply a miracle, but that we imply science is static. The lede “doctors can’t explain” must be followed with context: Medicine evolves, and today’s mystery may be tomorrow’s breakthrough.  

  **FAILURE TO ADOPT THIS POLICY MEANS:** We will keep litigating these cases ad hoc, missing stories that matter and running ones that don’t meet evidence thresholds. This framework prioritizes facts, humility, and reader trust.  

  ---  
  **APPROVED:** [ ] Yes [ ] No [ ] Hold for Revision  
  **VOTE BY:** Thursday 10 AM Meeting
