prompt: |-
  I'm in a philosophy of mind seminar this term and we've spent like three weeks on mental causation, and the whole time I've had this nagging feeling that the thing everyone is fighting about is one instance of something way more general, and I want to know if the general thing has a name.

  Here's the pattern I keep seeing. You describe an outcome in two ways, one coarse and one fine, and the coarse one looks like it's doing real causal work: the bridge collapsed because the design was flawed. Then someone gives you the fine story — each crack propagated the way it did because of the local stress at that exact point — and the design flaw turns out to be nothing over and above a summary of all those local facts. Now the coarse story feels demoted. It isn't false, it's just re-describing something the fine story already fully fixed. It doesn't add any push of its own. It's a label for a pattern, not a further cause.

  Two other places I've run into the same shape. In a bio lecture someone asked whether the heart's function is to pump blood, and the TA said sure, but everything the heart does is settled by the proteins and the ion gradients, so pumping blood is a description of what's happening, not an extra cause on top. And in a stats class we watched a demo where you predict an outcome from some broad variable and it looks strong, then you add the detailed variable sitting underneath it and the broad one's coefficient basically goes to zero — the detailed one absorbs it. That felt like the same shape as the bridge.

  So what I want is the carving, not just a label. Specifically:

  - Is there a name for this general pattern — the finer description always seems to take the causal credit, leaving the coarser one idle even though we clearly can't do without it? And what exactly is the claim about: causation itself, or our explanations, or our concepts? Everyone in my seminar slides between these three without noticing and I suspect that's most of the disagreement.
  - How is this different from overdetermination? Overdetermination is two causes that are each sufficient and independent; here the two candidates aren't independent at all, one is made out of the other. And how is it different from just saying the fine story is the real cause and the coarse one is a mere symptom or correlation?
  - Is the stats demo the same relation or a different one? "It absorbs the other variable in the model" and "it makes the other one causally idle" sound similar but I have a feeling they come apart.
  - Where does the pattern fail? I'd like at least one clear case where the fine story does not crowd out the coarse one, and an account of what's different there. My guesses would be something about selection, or about the fine facts being a mess while the coarse ones are the ones that support counterfactuals, but I don't trust either guess.
  - If there's no single established name for the general thing, coin one and define it sharply enough that I can tell when it applies and when it doesn't.

  Don't just name-drop at me — I can tell when someone is gesturing at a literature instead of doing the work. American English, please.

  Last line exactly like this:
  Verdict: <name of the best-fitting established concept, or "no established term"> — <your one-sentence definition of the phenomenon>
reasoning: |-
  Okay, the user is in a philosophy of mind seminar focusing on mental causation and has noticed a recurring pattern across different fields. They described instances like the bridge collapse (coarse: flawed design, fine: crack propagation), the heart's function (coarse: pumping blood, fine: proteins/ion gradients), and a stats demo (broad variable's effect absorbed by detailed variable). They want to know if there's a name for this general pattern where the fine-grained description seems to override the coarse one causally.

  First, I need to identify the core issue: it's about levels of description and causal exclusion. The coarse level appears causally relevant until the fine level explains everything, making the coarse level seem epiphenomenal. The user is asking for a term that captures this pattern, how it differs from overdetermination, whether the stats example is the same, where it fails, and a sharp definition if no term exists.

  Looking at philosophy of mind, Jaegwon Kim's causal exclusion problem comes to mind. It directly addresses how mental states seem causally inert if physical states do all the work. But the user sees this pattern beyond philosophy—in biology and statistics. So, is there a broader concept? 

  Terms like "supervenience" or "multiple realizability" are related but not the core issue. Supervenience describes dependence, not causal exclusion. "Explanatory exclusion" might fit, but it's not widely used. "Levels of causation" or "causal hierarchy" are too vague. 

  Overdetermination is different because it requires two independent sufficient causes. Here, the coarse and fine levels aren't independent; the coarse supervenes on the fine. The stats example is similar: adding a detailed variable absorbs the broad one's predictive power, showing mediation rather than direct causation.

  Where does the pattern fail? Emergence or cases with downward causation. For example, in natural selection, the coarse level (fitness) can't be reduced to individual events. Or in complex systems, macro properties like temperature exert causal power that isn't just the sum of micro states. The bridge design is reducible, but a flock's movement isn't—the coarse pattern (flocking behavior) is irreducible.

  The stats example is analogous but about predictive models, not ontology. The coefficient dropping to zero shows the broad variable's effect is mediated by the detailed one, similar to causal mediation in statistics. 

  If no single term exists, "Causal Exclusion Pattern" or "Level Absorption Problem" could work. But Kim's "Causal Exclusion Problem" is the closest established term, though originally in philosophy of mind. Expanding its definition to cover other domains seems justified. 

  User's deeper need: clarity in navigating interdisciplinary confusion. They want a framework to distinguish when coarse levels are explanatory vs. epiphenomenal. They might be seeking tools to critique reductionism or defend non-reductive views. Ensuring the response clarifies the boundaries (causation vs. explanation) and provides failure cases (emergent properties) is key.
answer: |-
  Based on your pattern description and criteria, here's the breakdown:

  1.  **The Core Phenomenon & Its Name:** This is most precisely captured by the **Causal Exclusion Problem**, primarily developed by Jaegwon Kim in the context of philosophy of mind (mental vs. physical causation), but the *structure* you identify generalizes. The claim is fundamentally about **causal efficacy/ontological status**: if a fine-grained physical (or lower-level) description *completely determines* the outcome, is there any distinct causal work left for the coarse-grained (higher-level) property to do? The sliding between causation, explanation, and concepts occurs because defenders of the coarse level often argue it provides indispensable *explanatory* power or captures *causal patterns* unavailable at the fine level, even if it doesn't add a distinct ontological "push."

  2.  **Difference from Overdetermination & Mere Correlation:**
      *   **Overdetermination:** Requires two *independent* sufficient causes (e.g., two shooters firing simultaneously). In your pattern, the coarse and fine levels are *dependent* – the coarse supervenes on or is constituted by the fine. The fine level doesn't just *also* cause the outcome; it *grounds* or *realizes* the coarse level and its purported causal powers. They aren't independent candidates.
      *   **Mere Symptom/Correlation:** While the coarse level *is* correlated with the outcome, the core issue is whether it has *causal efficacy in its own right*. The problem arises precisely because the coarse description seems deeply *explanatory* and *causally relevant* in everyday contexts, yet appears ontologically "squeezed out" by the completeness of the fine level. It's not *just* a correlation; it's a *putative cause* threatened with redundancy.

  3.  **The Stats Demo - Same Structure or Different?** The stats demo exhibits the **same structural pattern** but applied to **predictive modeling/correlation**, not necessarily **causation itself**. It demonstrates *explanatory* or *predictive* exclusion/absorption: the detailed variable accounts for all the variance the broad variable seemed to explain, rendering the broad variable redundant *in that specific predictive model*. This mirrors the causal exclusion worry: if the fine facts fix everything, is the coarse fact causally necessary? The difference is that the stats demo shows *statistical mediation/confounding* (the broad variable's effect is *through* the detailed one), which is strong *evidence* for the causal exclusion pattern but operates at the level of data modeling. They often coincide but can come apart if the statistical model misrepresents the underlying causal structure.

  4.  **Where the Pattern Fails (Coarse Level Retains Causal Efficacy):** The pattern fails, or the coarse level retains distinct causal relevance, in cases of **genuine emergence** or **downward causation**, though these are contentious. Here's one relatively clear(er) case:
      *   **Case:** Natural Selection. The coarse property is "fitness" (e.g., an organism being well-adapted). The fine story involves countless individual events: births, deaths, mutations, environmental interactions of specific organisms with specific traits.
      *   **Difference:** While the fine events *constitute* the process, the *causal pattern* of selection acting on *populations* over *generations* based on *fitness differences* is irreducible. The coarse property (fitness) causally explains population-level changes (e.g., allele frequency shifts) in a way that the fine-grained particulars of *which specific rabbit got eaten by which fox on Tuesday* cannot capture, even though they instantiate it. Crucially, *counterfactuals* depend on the coarse level: "If the environment changed, making trait X less fit, the population would evolve away from X" remains true regardless of the specific micro-details of how fitness was instantiated previously. The coarse level supports robust, projectable counterfactuals that the messy fine details do not. Your guess about counterfactuals is key here. (Other potential failure cases: certain complex systems, consciousness/qualia - though the latter is highly debated).

  5.  **Coining a Term (If Necessary):** While "Causal Exclusion Problem" is the best-established term capturing the core *causal* tension, a broader term emphasizing the descriptive levels is useful. The best-fitting established concept remains **Causal Exclusion Problem**.

  **Verdict: Causal Exclusion Problem** — The tension arising when a complete causal account at a fine-grained level of description appears to preclude distinct causal efficacy for a coarser-grained description that supervenes on it, despite the coarse description's explanatory utility.
