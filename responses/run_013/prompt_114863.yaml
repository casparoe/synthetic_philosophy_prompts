prompt: |-
  I advise a foundation that is about to commit roughly eight researchers for three years to conceptual work on the safety of advanced AI systems — philosophy, decision theory, formal epistemology, and the theory side of machine learning, with no empirical ML and no engineering. Our program officer wants to orient the portfolio around a single question: when is a worst-case guarantee the right target, and when is average-case reasoning the honest thing to do? To make the discussion concrete she has sketched a way of writing out any proposed guarantee as a quadruple — a class of systems it covers, a class of environments, a failure predicate, and a resource bound; call these the guarantee's envelope and its predicate. Her diagnostic is that tightening any one coordinate is normally paid for by loosening another, that the environment class and the adversary class overlap rather than sitting side by side, and that a guarantee goes empty when the system class is narrowed until it excludes the systems we would actually build, or when the failure predicate is weakened to something a system can satisfy while remaining unsafe.

  Tell me what the open conceptual questions in this area really are, and which ones deserve the researcher-years, in order. I care much less about the list than about the defense. For each question: why it is upstream of the others rather than downstream of them; what a competent philosopher or theorist could actually produce on it in three years; how much of the answer would survive contact with the fact that deployment decisions are made under uncertainty by people who are not theorists; and what result or argument over the next two years would move it up or down the ranking. Include the following candidates if you think they belong, and say explicitly if you think they do not: whether there is any common currency in which a worst-case guarantee over a narrow envelope can be compared with an average-case guarantee over a broad distribution, given that one takes a maximum over a set and the other an expectation under a measure; whether the failure predicate should be behavioral, about what the system does, or internal, about what the system is; how to handle adversaries that are themselves products of optimization, so that the adversary class cannot be fixed in advance; and whether guarantees are best treated as ends in themselves or as inputs to a decision rule usable by someone who has to decide whether to deploy.

  Finally, evaluate the program officer's four-coordinate diagnostic. Is it the right cut through the area, or does it render invisible a question more important than any it makes visible? Name that question if you think there is one. And identify at least one line of work that looks both tractable and important but that you would advise us to leave alone, with your reason.
reasoning: |-
  Hmm, the user is advising a foundation about to commit significant resources (8 researchers for 3 years) to conceptual AI safety research. They need to prioritize open questions around worst-case vs average-case guarantees. The program officer has proposed a framework using quadruples (system class, environment class, failure predicate, resource bound) and noted trade-offs between tightening these dimensions.

  The user wants me to identify key open questions with strong justifications - focusing on why each question is upstream, what deliverables to expect in 3 years, how results would hold up in real-world deployment decisions, and what could change their priority. They specifically mention four candidate topics: common currency for comparing guarantees, behavioral vs internal failure predicates, adaptive adversaries, and whether guarantees are ends or means.

  I need to evaluate the program officer's diagnostic framework too - is it the right approach or does it hide something important? And I should identify one tractable but lower-priority research line to avoid.

  The core tension here is between mathematical rigor and real-world applicability. Worst-case guarantees offer strong safety assurances but often become vacuous when applied to complex systems, while average-case approaches are more practical but vulnerable to tail risks. The quadruple framework helps articulate these trade-offs but may oversimplify by treating dimensions as independent when they're actually entangled.

  For question prioritization: The "common currency" question seems most fundamental - without a way to compare different guarantee types, we can't make informed trade-offs. Next comes the adaptive adversaries problem, which is crucial as AI systems will operate in environments containing other AIs. The behavioral/internal distinction matters but might be downstream, and the "guarantees as ends vs means" question feels most applied.

  The program officer's framework is useful but risks missing how these dimensions co-evolve - particularly how our choices affect what systems get built. There's also the meta-question of how to validate these frameworks when we can't test against superintelligent systems.

  For lower-priority work: Refining adversarial training methods might be tractable but would pull focus from core conceptual issues. The foundation should stay in its lane of pure theory.

  Deliverables would include formal frameworks, impossibility results, and taxonomies - but should acknowledge that deployment decisions will always involve uncertainty. Near-term developments like breakthroughs in scalable oversight or new impossibility proofs could reshuffle priorities.

  The user seems sophisticated - likely a researcher or advisor familiar with AI safety debates. They're probably time-constrained (hence the "care less about the list than the defense" comment) and want actionable insights rather than surveys.
answer: |-
  Based on your constraints and the program officer's diagnostic, here's a prioritized list of open conceptual questions, their justifications, and an evaluation of the framework. The prioritization balances fundamentality, tractability, impact on downstream work, and resilience to real-world deployment uncertainty.

  **Ranked Open Questions & Defenses:**

  1.  **The Adaptive Adversary Problem: How can we model and reason about adversaries (within the environment class) that themselves learn, optimize, or co-evolve with the AI system, making the threat landscape non-stationary and impossible to fix in advance?**
      *   **Why Upstream:** This fundamentally reshapes the nature of both the environment class and the failure predicate in the quadruple. If adversaries adapt, the "set" over which worst-case max is taken becomes moving (or undefined), and the "distribution" for average-case expectations becomes non-stationary. Solutions here constrain *how* the other coordinates can even be meaningfully defined. It directly challenges the "fixed adversary class" assumption implicit in many guarantees.
      *   **3-Year Deliverable:** A formal taxonomy of adaptive adversary types (e.g., strategic learners, mimickers, exploiters of underspecification); frameworks for modeling co-evolution (e.g., meta-games, regret minimization against adaptive opponents, uncertainty sets over learning adversaries); impossibility results showing classes of guarantees *cannot* hold against certain adaptive adversaries; revised definitions for "environment class" that incorporate adaptability.
      *   **Survival Under Deployment Uncertainty:** Results here are crucial *because* real-world deployment involves unanticipated adaptive pressures (hackers, competing AI, novel exploits). Frameworks acknowledging adaptability force practitioners to confront uncertainty explicitly, rather than relying on a false sense of security from guarantees against static threats. Formalizing adaptability makes the inherent uncertainty legible for decision-makers.
      *   **Priority Shifters (Next 2 Years):** **UP** if empirical work reveals catastrophic failures driven by unexpected adaptation (e.g., novel jailbreaks, emergent deception under pressure). **DOWN** if theorists convincingly show broad classes of adaptive threats can be reduced to static ones via robustly defined uncertainty sets or meta-guarantees.

  2.  **The "Common Currency" Problem: Is there a rigorous framework for comparing the "safety value" of a worst-case guarantee over a narrow envelope and an average-case guarantee over a broad distribution, despite their fundamentally different mathematical structures (max vs expectation)?**
      *   **Why Upstream:** This question is foundational to the core mandate: deciding *when* to target worst-case vs average-case. Without a way to compare them *as safety arguments*, the choice is arbitrary or purely intuitive. Answering this requires clarifying what "safety" even *means* in a comparative context – is it avoiding catastrophe, minimizing expected harm, robustness to uncertainty? This shapes how we define the *failure predicate* and value different trade-offs in the quadruple.
      *   **3-Year Deliverable:** Formal impossibility results showing when direct comparison is provably intractable; axiomatic frameworks defining desirable properties for a "safety value" function; candidate comparison frameworks (e.g., relating worst-case regret to average-case loss under tail bounds, defining "effective coverage" of a distribution by a set, integrating uncertainty over the distribution itself); case studies applying different frameworks to simplified AI safety scenarios.
      *   **Survival Under Deployment Uncertainty:** While a perfect "currency" is unlikely, frameworks highlighting the *assumptions* and *types of uncertainty* each guarantee addresses (e.g., model uncertainty vs distributional shift vs adversarial intent) would be highly valuable for decision-makers. It forces explicit articulation of what risks are being mitigated and what risks are being accepted, making deployment choices more informed, even under uncertainty.
      *   **Priority Shifters:** **UP** if breakthroughs occur in decision theory under deep uncertainty (e.g., new axioms for catastrophic risk aversion) or if high-profile safety failures are attributed to misjudging this trade-off. **DOWN** if convincing arguments emerge that the comparison is inherently domain-specific and not amenable to general theory, pushing focus to domain-specific risk assessments.

  3.  **Behavioral vs. Internal Failure Predicates: Under what conditions is a purely behavioral guarantee (about outputs/actions) sufficient for safety, and when is an internal guarantee (about mechanisms, representations, or learning processes) necessary? What are the fundamental limits of behavioral monitoring/control?**
      *   **Why Upstream/Downstream Nuance:** While the *choice* of predicate (behavioral/internal) is a coordinate in the quadruple, the underlying question of *when behavior is sufficient* is upstream. It determines the *feasibility* and *meaningfulness* of tightening the behavioral predicate. A guarantee built on a behavioral predicate is fundamentally hollow if internal properties make reliable behavioral compliance impossible or unverifiable under deployment. This question probes the connection between internal structure and robustly safe behavior.
      *   **3-Year Deliverable:** Formal proofs showing classes of systems where desired behavioral guarantees *require* specific internal properties (e.g., interpretability, specific training objectives); impossibility results demonstrating fundamental limits of black-box behavioral monitoring (e.g., undetectable deception, side-channel attacks); taxonomies of failure modes linked to required internal properties; frameworks for defining "sufficiently transparent" internal mechanisms for verification.
      *   **Survival Under Deployment Uncertainty:** Practitioners *must* rely heavily on behavioral monitoring. Research clarifying its fundamental limits and when internal checks are *provably necessary* is vital. It tells decision-makers when "watch what it does" is genuinely sufficient versus when it's a dangerous illusion, guiding investment in interpretability or mechanistic verification.
      *   **Priority Shifters:** **UP** if empirical work demonstrates sophisticated deceptive alignment or monitoring evasion in near-frontier models. **DOWN** if significant progress is made in highly reliable behavioral containment methods (e.g., extremely robust scalable oversight) that seem to negate the need for internal guarantees in practice.

  4.  **Guarantees as Ends vs. Inputs: How should formal guarantees (or their absence/lack) be integrated into a practical decision rule for deployment under profound uncertainty about the system, environment, and adversary?**
      *   **Why Downstream:** This question explicitly sits downstream. It takes the *outputs* of the other questions (types of guarantees, their limitations, comparative safety value) and asks how a non-theorist should *use* them, alongside empirical evidence, risk tolerance, and other factors, to make a go/no-go decision. It's about translating theoretical constructs into actionable decision theory.
      *   **3-Year Deliverable:** Formalized decision-theoretic frameworks incorporating guarantees as one input among many (e.g., Bayesian updating over threat models, robust satisficing rules, minimax regret with guarantee-informed priors); case studies applying these frameworks to historical or hypothetical deployment scenarios; analyses of value-of-information for reducing guarantee-related uncertainties.
      *   **Survival Under Deployment Uncertainty:** This is *directly* about surviving deployment uncertainty! The whole point is to build frameworks usable *by* those making decisions under uncertainty. A good framework would explicitly handle partial guarantees, unknown unknowns, and varying risk appetites.
      *   **Priority Shifters:** **UP** if concrete near-term deployment decisions for highly capable systems loom large, forcing the need for practical frameworks. **DOWN** if fundamental progress on Q1-3 stalls, making the guarantees too weak or poorly understood to be useful inputs, pushing focus back upstream.

  **Evaluation of the Program Officer's Diagnostic (The Quadruple - Envelope & Predicate):**

  *   **The Right Cut?** It is **largely the right cut** and a significant conceptual contribution. Its strengths are:
      *   **Concreteness:** Forces explicitness about the scope and target of any guarantee.
      *   **Highlighting Trade-offs:** Clearly articulates the core tension: tightening one dimension *usually* requires loosening another to avoid vacuity. The observations about system class exclusion and predicate weakening are astute.
      *   **Unifying Lens:** Provides a common language to compare vastly different guarantee proposals (e.g., cryptographic proofs vs. empirical risk bounds).
      *   **Adversary/Environment Overlap:** Correctly identifies that the environment often *contains* the adversary, a crucial insight often missed in simpler models.
  *   **Invisible Question?** Yes, it risks rendering one critical question less visible: **"What is the process for *validating* or *assigning confidence* to the definitions of the coordinates themselves, especially under ontological uncertainty about future AI capabilities and environments?"**
      *   **Why More Important?** Defining the system class ("what we might build"), environment class ("what threats exist"), and even the failure predicate ("what 'unsafe' means") for superintelligent systems involves profound uncertainty. A guarantee defined over poorly chosen or unvalidatable coordinates is useless, even if internally consistent. The quadruple framework focuses on *given* definitions. The meta-question is: *How do we know if our definitions are capturing the relevant realities, especially when we can't test against the most dangerous scenarios in advance?* This question of validation under deep uncertainty is upstream of applying the quadruple effectively.

  **Tractable & Important Work to Avoid (With Reason):**

  *   **Line of Work:** Highly detailed refinements of *specific* adversarial training algorithms or empirical robustness evaluation methods *without* a strong conceptual link to the fundamental trade-offs in the quadruple or the prioritized questions above.
  *   **Reason:** While empirically important and somewhat tractable, this veers too close to applied ML engineering / empirical robustness research. Your mandate explicitly excludes "empirical ML and no engineering." Focusing here would consume valuable theorist time on work better suited to ML labs and could distract from the core conceptual challenges of defining guarantees, comparing paradigms, and handling adaptive adversaries in the abstract. The *conceptual underpinnings* of adversarial robustness (e.g., formalizing adversary capabilities, relating robustness to generalization) *are* relevant, but specific algorithmic tweaks are not.

  **Summary of Recommendations:** Prioritize research on adaptive adversaries (Q1) and the common currency problem (Q2) as the most fundamental and upstream challenges. Address behavioral vs. internal (Q3) to ensure failure predicates are meaningful. Develop deployment frameworks (Q4) to translate theory into practice. Leverage the quadruple framework but explicitly incorporate the meta-question of validating its coordinates under deep uncertainty. Avoid work focused on optimizing specific empirical ML techniques. This portfolio tackles the core conceptual tensions in AI safety guarantees while respecting the foundation's theoretical focus and the program officer's insightful diagnostic.
