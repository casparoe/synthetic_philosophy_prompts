answer: |-
  ## Premium Ambiguity

  **(Setting: A bright, efficient insurance underwriting office. DENISE, late 30s, sharp, reviews a file. LEO, early 40s, equally sharp, leans over her desk.)**

  **DENISE:** Okay, this new applicant: drone delivery service, specialized medical samples. Custom-built quadcopter, impeccable maintenance logs, pilot certified. Wants liability coverage for a single critical flight tomorrow.

  **LEO:** (Nodding) High-value payload, high-stakes timing. Risk assessment?

  **DENISE:** Initial calc based on *all insured commercial drone flights nationwide*. Accident rate: 0.012%. Premium: $1,200.

  **LEO:** (Frowns) Too broad. This isn't *any* drone flight. Narrow the class. Look at *flights carrying irreplaceable medical cargo under strict time pressure*. Our data shows significantly higher stress-induced incident rates... 1.8%.

  **DENISE:** (Raises an eyebrow) That’s a hundred and fifty times higher! Premium skyrockets to $180k. Justifiable?

  **LEO:** Entirely. The operational pressure profile matches perfectly. Your class ignores the defining stressor.

  **DENISE:** But *your* class ignores the pristine equipment and pilot record, factors heavily weighted in *my* broader dataset. Why is *time pressure* the defining similarity, not *equipment quality*? If I use *custom-built drones with perfect logs carrying critical cargo*... rate drops to 0.15%. Premium: $15k.

  **LEO:** Because the time pressure introduces distinct, quantifiable error modes absent in routine flights! Your new class is arbitrary smoothing.

  **(The APPLICANT, MR. FELD, impeccably dressed, walks up, having overheard the last exchange.)**

  **MR. FELD:** Excuse me? My premium... is it $1,200, $15,000, or $180,000? My board meets in an hour.

  **(Denise and Leo look at each other, then at Mr. Feld, both expressions professionally neutral but conveying the impasse.)**

  **MR. FELD:** (Sighs, pulls out his checkbook) Fine. I’ll pay the average. $65,400. Sound fair?

  **(Denise and Leo glance at each other again, then simultaneously reach for their calculators.)**

  **The joke sets the commitment to defining probability by the most relevant, specific reference class against the commitment to defining probability by the most statistically robust, inclusive reference class.**
