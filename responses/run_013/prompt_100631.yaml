prompt: |-
  Bit of an odd request, but I'm a second-year PhD student in philosophy of biology and I need someone to referee a summary for me.

  A friend of mine, who works in an adjacent field and reads a lot of popular science, sent me his version of the units-of-selection debate. He's confident it's basically settled, and settled his way. I think chunks of it are right and chunks of it are doing something sneaky, but I can't reliably tell which is which, and I know I have a dog in this fight, so I don't fully trust my own reaction. Here's what he wrote, roughly word for word:

  'Ever since Darwin, people have argued about whether natural selection works on genes or on whole organisms. Dawkins basically ended that argument by showing that the only thing that ever gets selected is the gene — bodies are just the vehicles genes build to get copied. So group selection is a dead end: Williams had already proved that any trait that helps a group at a cost to the individual gets wiped out by a selfish mutant, which is why you never see genuine altruism in nature. When an animal looks like it's sacrificing itself for others, what's really going on is a gene helping other copies of itself in other bodies. The only live question left is humans, because culture gives us a second kind of replicator, and that's why we're the one species capable of real selflessness.'

  What's nagging me: the jump from "selection can always be described at the level of the gene" to "group selection is a dead end" feels like it's smuggling something, and I can't tell whether that's a real slide or whether I'm just resisting the conclusion. Same with the altruism line — I suspect it's mixing up two senses of altruism, but I'd like to be sure. And in a seminar last term someone used a beetle that lays its eggs in a dung pat as an example — the larvae inside a pat are all siblings competing with each other, and only the survivors make it out into the wider population — and one person said that's exactly the case where group-level effects are real but you still don't need group selection to explain them, while someone else said that was a dodge. I couldn't tell who was right and I still can't.

  Could you take it claim by claim? For each one: what someone working on this would happily accept, what they'd want to hedge or wince at, and what's just wrong or was never established by anyone. If a step is a genuine live disagreement rather than an error, say so and give me the shape of both sides, but keep it short — I'd rather have the three or four things that are definately wrong than a survey of the whole literature. Then tell me whether his overall conclusion (debate's over, all that's left is human culture) actually follows from whatever survives the audit, or whether it's an extra step bolted on.

  One more thing, since I want to use this in a chapter: if I had to write the single sentence about levels of selection that both a hardened genic selectionist and a hardened multilevel selectionist would sign off on, what is it? I'm not after a reading list, I know where the papers are.

  End your answer with a line starting 'Verdict:' — a one-word label from {sound, mostly sound, mixed, mostly misleading, misleading}, then a dash, then that one sentence for my chapter.
reasoning: |-
  Okay, the user is a PhD student in philosophy of biology asking for a referee on their friend's summary of the units-of-selection debate. The friend claims the debate is settled in favor of gene-level selection, dismissing group selection and altruism. The user suspects there might be issues with the reasoning but isn't sure due to their own biases.

  First, I need to break down the friend's claims one by one. The key points are: Dawkins ended the debate by showing only genes are selected; bodies are just vehicles; group selection is dead because of Williams' argument; no real altruism in nature; and only humans might be different due to culture. 

  Looking at each claim: Dawkins popularized the gene's-eye view, but it's not universally accepted. Multilevel selection theory is still active. The reduction to genes isn't necessary, just possible. Then, Williams did argue against group selection, but later models show it can work under specific conditions. Altruism exists biologically (like in kin selection), but the friend conflates biological with psychological altruism. The beetle example is relevant here—sibling competition might not need group selection if kin selection explains it. 

  The user's nagging feeling about the jump from gene-level description to dismissing group selection is valid. That's a sleight of hand. Describing at the gene level doesn't negate higher-level selection when conditions are met. Also, the altruism point mixes definitions. Humans and culture add complexity, but the debate isn't settled there either.

  The user needs a concise audit: what's accepted, hedged, or wrong. They also want a single sentence both sides would agree on. The verdict should be "mostly misleading" because while some parts have elements of truth, the overall conclusion is incorrect and oversimplified. The agreed-upon sentence should emphasize that selection operates at multiple levels, and the question is about when higher levels are significant.
answer: |-
  Here's a claim-by-claim audit of your friend's summary, focusing on accuracy and common points of contention:

  1.  **"Ever since Darwin, people have argued about whether natural selection works on genes or on whole organisms."**
      *   **Accept:** The debate about levels (gene, individual, group) has been central.
      *   **Hedge/Wince:** Framing it *only* as "genes vs. organisms" oversimplifies. Darwin himself discussed group-level traits. The debate quickly expanded beyond just these two levels (e.g., chromosomes, cells, species, traits). "Genes" as understood today weren't Darwin's unit.

  2.  **"Dawkins basically ended that argument by showing that the only thing that ever gets selected is the gene"**
      *   **Accept:** Dawkins powerfully popularized and rigorously defended the *genic selection* perspective, arguing it's the most fundamental and general level of description.
      *   **Hedge/Wince:** "Ended that argument" is profoundly wrong. The debate is very much alive. Many biologists and philosophers argue Dawkins showed selection can *always be described* at the genic level, not that it *only operates* at that level or that other levels aren't real or causally significant under specific conditions (see MLS theory). Genic selection is one *interpretive framework*, not universally accepted as the *only* correct one.
      *   **Wrong/Not Established:** That Dawkins "ended the argument" or proved genes are the *only* thing ever selected.

  3.  **"bodies are just the vehicles genes build to get copied."**
      *   **Accept:** This is a core tenet of Dawkins' *vehicle* concept within genic selectionism. Organisms are often the vehicle.
      *   **Hedge/Wince:** While a valid perspective within genic selectionism, it's not a neutral fact. Critics argue this language downplays the organism's role as a coherent, functional unit *upon which* selection directly acts in many contexts. The "vehicle" metaphor implies passivity not universally accepted.

  4.  **"So group selection is a dead end"**
      *   **Hedge/Wince:** This is the core sleight of hand. **This jump is invalid.** Demonstrating that selection *can be described* at the genic level does *not* logically entail that group selection is impossible or never occurs. It means group selection phenomena can *also* be described genically (e.g., via kin selection). Modern Multilevel Selection (MLS) theory provides rigorous mathematical models showing group selection *can* occur under specific conditions (e.g., high relatedness within groups, low migration, group-level variation affecting extinction/reproduction). The beetle example *could* be explained by kin selection (genic level) *or* MLS (if groups are defined as dung pats with differential survival), highlighting the live debate about the *best* explanatory level.
      *   **Wrong/Not Established:** That genic description proves group selection is a "dead end." MLS is an active field.

  5.  **"Williams had already proved that any trait that helps a group at a cost to the individual gets wiped out by a selfish mutant"**
      *   **Accept:** Williams (1966) powerfully critiqued naive group selectionism, showing how individual/genic selection usually swamps weak group benefits. The "selfish mutant" problem is a major hurdle for group-advantageous traits.
      *   **Hedge/Wince:** "Proved" is too strong. Williams showed it's *difficult* and *requires specific conditions* (which MLS theory later formalized). He didn't prove it *never* happens. His argument was against the *prevalence* of group selection in explanations, not its absolute impossibility.

  6.  **"why you never see genuine altruism in nature"**
      *   **Accept:** Genuine *biological* altruism (behavior reducing the actor's fitness while increasing another's, with no expectation of return) is rare and unstable without mechanisms like kin selection or reciprocity.
      *   **Hedge/Wince:** "Never" is demonstrably false. Worker sterility in eusocial insects is classic biological altruism. The key is it's explained by *kin selection* (genes helping copies in relatives), not that it doesn't exist. The friend likely conflates *biological* altruism (fitness effects) with *psychological* altruism (motivations), which the biological definition doesn't require. Altruism *exists* biologically, but its evolution requires specific explanations (kin sel., reciprocal altruism).

  7.  **"When an animal looks like it's sacrificing itself for others, what's really going on is a gene helping other copies of itself in other bodies."**
      *   **Accept:** This is an accurate description of the *kin selection* explanation, a cornerstone of sociobiology and genic selectionism. It explains *how* altruism can evolve.
      *   **Hedge/Wince:** While often correct, phrasing it as "*really* going on" implies this is the *only* valid level of explanation, which is contested. An MLS proponent might say "what's *also* going on is selection among family groups."

  8.  **"The only live question left is humans, because culture gives us a second kind of replicator, and that's why we're the one species capable of real selflessness."**
      *   **Accept:** Human cultural evolution and gene-culture coevolution add immense complexity. Memes/Dual Inheritance Theory is a major field. Human altruism often extends beyond kin/reciprocity.
      *   **Hedge/Wince:** "Only live question left" is wildly inaccurate. Levels of selection debates rage in microbiology (e.g., cancer, MLS in microbes), immunology, social evolution (beyond humans), major transitions in evolution, etc. Claiming humans are the "one species capable of real selflessness" is biologically unsophisticated ("selflessness" is ill-defined here) and ignores examples of interspecies cooperation or potential non-kin altruism in other species (though debated). Cultural evolution *adds* a layer, it doesn't end the biological debates.

  **Overall Conclusion (Debate's over, all that's left is human culture):**
  *   **Does it follow?** No. The conclusion **does not follow** from the premises, even if we accept the genic perspective. Genic selectionists would *agree* with the conclusion about the debate being "over" (their way), but it's a statement of their position, not a logical consequence solely of the points made. The points themselves contain significant overstatements and invalid jumps.
  *   **Is it an extra step?** It's the *core* step of the genic selectionist *position*, but presented as an established conclusion. The existence of active MLS research and ongoing debates across biology proves the conclusion is false.

  **The One Sentence:**
  "Natural selection requires heritable variation in fitness, and this variation can occur and be causally significant at multiple levels of biological organization (e.g., genes, cells, organisms, groups), with the relevant level(s) depending on the specific biological context and the question being asked."

  **Verdict:** mostly misleading — Natural selection requires heritable variation in fitness, and this variation can occur and be causally significant at multiple levels of biological organization (e.g., genes, cells, organisms, groups), with the relevant level(s) depending on the specific biological context and the question being asked.
