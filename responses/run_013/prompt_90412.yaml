  Below is a decision tree structured to move beyond the simplistic "separation vs. establishment" binary, starting from the shared commitment that the state must not coerce anyone into or out of a religion. The tree uses **6 nodes** (including the root) to sort positions based on concrete arrangements, with leaves named for recognizable positions. Unoccupied combinations and indistinguishable leaves are flagged. The tree prioritizes questions answerable without knowing downstream outcomes and uses the four concrete cases to test positions:  
  - **Church tax** (opt-out by formal exit)  
  - **Ceremonial established church** (e.g., Church of England)  
  - **Ban on religious symbols for state employees**  
  - **Non-preferential funding for religious schools**  

  ---

  ### **Decision Tree: Religion and the Liberal State**  
  **Root Commitment (Node 0)**: The state must not coerce anyone into or out of a religion.  

  **Node 1: Must the state also avoid *endorsing* or *funding* religion (beyond non-coercion)?**  
  - **Yes** → Go to Node 2A  
  - **No** → Go to Node 2B  

  **Node 2A (for "Yes" at Node 1): Is neutrality a constraint on state *justifications* or policy *effects*?**  
  - **Justifications**: State actions must lack religious motives.  
  - **Effects**: State actions must not disproportionately burden any religion.  

  **Node 2B (for "No" at Node 1): What is the relevant unit of religious freedom?**  
  - **Individual conscience**: Focus on personal belief/choice.  
  - **Communal membership**: Focus on group identity/inherited tradition.  

  **Node 3A (for "Justifications" at Node 2A): Does history/entrenchment justify exceptions?**  
  - **Yes** → Historical practices exempt from strict neutrality.  
  - **No** → No exceptions for historical arrangements.  

  **Node 3B (for "Communal" at Node 2B): Does history/entrenchment matter?**  
  - **Yes** → History grants legitimacy to arrangements.  
  - **No** → All arrangements judged by current fairness.  

  **Node 4 (for all paths): Should religious associations receive *special treatment* (e.g., exemptions, unique funding) not available to secular groups?**  
  - **Yes** → Religious groups are distinct.  
  - **No** → Religious groups treated like any voluntary association.  

  ---

  ### **Leaves (Positions) and Their Concrete Commitments**  
  *(Awkward commitments in italics; 🚩 = unoccupied combination; 🔄 = indistinguishable in practice)*  

  #### **After "Yes" at Node 1 (Avoid Endorsement/Funding)**  
  1. **Strict Separation (Laïcité)**  
     - Path: Node 2A: Justifications → Node 3A: No history exceptions → Node 4: No special treatment.  
     - Concrete Cases:  
       - Bans religious symbols for state employees (justification: secular public space).  
       - Rejects church tax (state funding) and established church (endorsement).  
       - Allows funding for religious schools only if strictly non-preferential and secularized.  
     - Awkward: *Bans on religious symbols burden minorities (e.g., Muslim hijab) while claiming neutrality.*  

  2. **Accommodationism (US-style)**  
     - Path: Node 2A: Justifications → Node 3A: No history exceptions → Node 4: Yes (special treatment).  
     - Concrete Cases:  
       - Allows exemptions from generally applicable laws (e.g., sacramental wine during Prohibition).  
       - Rejects church tax/established church (endorsement), but *may* allow non-preferential school funding.  
     - Awkward: *Exemptions can undermine equality (e.g., if employers deny birth control coverage).*  

  3. **Multicultural Neutrality (Effects-Based)**  
     - Path: Node 2A: Effects → Node 4: Yes (special treatment).  
     - Concrete Cases:  
       - Allows exemptions if a law disproportionately burdens a group (e.g., Sikhs with helmet laws).  
       - Rejects church tax (communal opt-out is coercive) and symbols ban (disproportionate effect).  
     - Awkward: *Risk of essentializing groups (e.g., assuming all Muslims oppose symbols bans).*  

  4. **Formal Secularism**  
     - Path: Node 2A: Effects → Node 4: No special treatment.  
     - Concrete Cases:  
       - Upholds symbols ban if "neutral on face" (e.g., France’s 2004 law).  
       - Rejects church tax/established church (non-neutral effects).  
     - Awkward: *Ignores disparate impacts (e.g., a "neutral" work schedule burdens Seventh-day Adventists).*  

  #### **After "No" at Node 1 (Endorsement/Funding Allowed)**  
  5. **Pluralist Establishment**  
     - Path: Node 2B: Communal → Node 3B: No history bias → Node 4: Yes (special treatment).  
     - Concrete Cases:  
       - Supports non-preferential school funding and church tax (if communal opt-out).  
       - Accepts established church only if symbolic *and* inclusive (e.g., coronations).  
     - Awkward: *State funding entrenches religious divisions (e.g., Catholic vs. Protestant schools).*  

  6. **Subsidiarity (Christian-Democratic)**  
     - Path: Node 2B: Communal → Node 3B: History matters → Node 4: Yes (special treatment).  
     - Concrete Cases:  
       - Defends church tax (Germany) and established church (history legitimizes privileges).  
       - Supports religious schools/social services (state partners with "natural communities").  
     - Awkward: *Maintains hierarchy (e.g., church tax privileges Christianity over Islam).*  

  7. **Non-Preferentialism (Even-Handed)**  
     - Path: Node 2B: Individual → Node 4: Yes (special treatment).  
     - Concrete Cases:  
       - Allows school funding and exemptions if available to all faiths equally.  
       - Rejects church tax (individual opt-out is coercive) and symbols ban (burdens conscience).  
     - 🔄 *Indistinguishable from Pluralist Establishment in practice*: Both support even-handed funding, but Non-Preferentialism uses individual unit, Pluralism uses communal.  
     - Awkward: *"Equal" funding can favor majority religions (e.g., rural areas lack minority schools).*  

  8. **Traditional Establishment**  
     - Path: Node 2B: Communal → Node 3B: History matters → Node 4: No special treatment.  
     - Concrete Cases:  
       - Tolerates ceremonial established church (e.g., UK) but denies privileges to new religions.  
       - Rejects church tax (non-universal) and symbols ban (if it burdens communal identity).  
     - Awkward: *Arbitrarily privileges historic religions over new movements (e.g., Scientology).*  

