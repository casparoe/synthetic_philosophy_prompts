  I'm applying for a small fellowship that funds a six-month writing project, and I need a short research proposal — one page, 800 words max. I've been kinda circling the moral saints question (is a maximally morally good life actually desirable?) and I want to propose something more specific than the usual demandingness debate. My half-formed idea: the debate keeps treating maximal moral goodness as a single thing, but I think there's a real difference between a saint who has no nonmoral projects left — she just does the most good, full stop — and one who still has her own projects but treats them as always subordinate to moral demands. The desirability objection, I suspect, only really bites on the first version; the second might be either incoherent or not a distinct ideal at all. I was arguing about this with a friend who works on well-being and neither of us could seperate the two versions in a way that didn't collapse back into the standard framing. So the project would clarify what 'maximal' is even supposed to mean here, then see whether the standard positions (demandingness objections, the moral saint critique, perfectionist accounts of well-being) actually settle which version is at issue. I'd do conceptual analysis of maximality and subordination, build a small taxonomy of saint-types, and test it against cases like the saint who still plays piano badly for fun vs. the one who gives it up because the time could save lives. Turn this into a proper proposal: state the question precisely, explain why the existing answers leave it open, say why this angle rather than the obvious alternatives, what a result would look like, what would count as the project failing, and a realistic month-by-month plan for six months. Don't do a bibliography or citations — I'll add those. And I definately want you to be upfront about what's settled vs. genuinely contested among people who know this stuff; don't present a contested reading as the consensus. Keep the whole thing under 800 words.
