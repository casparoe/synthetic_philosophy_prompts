answer: |-
  ## Research Proposal: Clarifying the Concept of Maximal Moral Goodness in the Moral Saints Debate

  **Research Question:** What precisely constitutes a "maximally morally good life" in the demandingness and moral saints literature? Specifically, does distinguishing between a life where non-moral projects are *eliminated* versus one where they are perpetually *subordinated* to moral demands reveal a crucial ambiguity that affects the force of desirability objections?

  **Problem & Gap:** The demandingness debate critiques whether extremely demanding moral theories (like utilitarianism or extreme deontology) prescribe lives that are undesirable or alienating – the "moral saints" critique (Wolf, 1982) being a prominent example. However, **a significant conceptual ambiguity persists**: is "maximal" moral goodness achieved by (1) *eliminating* all non-moral personal projects to dedicate all resources to the moral good ("*Exclusive Sainthood*"), or (2) retaining non-moral projects but requiring them to be perpetually *subordinated* to moral demands, ready to be sacrificed whenever morality calls ("*Subordinating Sainthood*")? *It is genuinely contested whether these are distinct ideals, whether (2) is coherent, and which is the actual target of critiques.*

  Existing discussions often conflate these. Demandingness objections focus on the *costs* of meeting high demands, while the moral saints critique focuses on the alleged *impoverishment* of a life dominated by morality. Perfectionist accounts of well-being (e.g., Hurka, 1993) argue that well-being requires developing diverse human capacities, potentially conflicting with both types of sainthood. Crucially, **none systematically disentangle the "Exclusive" vs. "Subordinating" conceptions of maximality.** Consequently, it remains unclear *which version* of maximal goodness desirability objections successfully target, and whether objections to one apply to the other. This ambiguity prevents a clear assessment of the debate.

  **Novel Approach & Why This Angle:** This project moves beyond debating *how much* morality can demand, to scrutinize *what kind of life* "maximal moral goodness" even denotes. The standard alternatives are either re-litigating demandingness levels or arguing about the constituents of well-being. This proposal is distinct because it targets a prior, under-examined conceptual question *within* the notion of maximality itself. By rigorously analyzing "maximal" and "subordination," and constructing a taxonomy of sainthood types centered on this distinction, it aims to clarify the very object of critique. This conceptual groundwork is necessary before we can accurately evaluate whether a maximally good life *must* be undesirable.

  **Methodology & Output:** The project employs conceptual analysis and philosophical taxonomy:
  1.  **Clarify Key Concepts:** Precisely define "maximal moral goodness," "elimination," "subordination," and "non-moral project" within the context of moral theory.
  2.  **Develop Taxonomy:** Systematically distinguish "Exclusive Sainthood" (ES) from "Subordinating Sainthood" (SS), exploring their logical coherence and practical implications. Consider if hybrid types exist.
  3.  **Test Against Cases & Literature:** Apply the taxonomy to paradigmatic cases (e.g., the pianist who plays poorly for fun vs. the one who quits to fundraise). Evaluate whether standard demandingness objections, the moral saints critique, and perfectionist well-being arguments:
      *   Apply equally to ES and SS.
      *   Primarily target one conception.
      *   Rely on conflating the two.
      *   Demonstrate the incoherence or instability of SS.

  **Expected Result:** The primary output is a clarified conceptual landscape. A successful outcome would demonstrate that ES and SS are distinct (even if SS faces its own challenges), and show that prominent objections (especially the "undesirable life" critique) hold significantly stronger force against ES than against SS, or vice-versa. It might reveal that SS is inherently unstable, collapsing into ES or a less demanding ideal. Crucially, it will pinpoint *which version* of maximal goodness is vulnerable to existing critiques, refining the debate's focus.

  **Failure Condition:** The project fails if the distinction between ES and SS proves untenable or insignificant upon rigorous analysis, collapsing back into the standard demandingness framing without generating novel insight. Failure also occurs if the concepts cannot be defined precisely enough to build a useful taxonomy or engage productively with the literature.

  **Realistic 6-Month Plan:**
  *   **Month 1:** Deep literature review; refine definitions of "maximal," "subordination," "elimination," "non-moral project."
  *   **Month 2:** Detailed conceptual analysis of ES and SS; draft initial taxonomy; identify core challenges to each (e.g., incoherence of SS? impoverishment of ES?).
  *   **Month 3:** Develop and refine specific case studies (e.g., the pianist, the hobbyist, the reluctant fundraiser); analyze cases using the ES/SS framework.
  *   **Month 4:** Systematically test ES/SS against key demandingness objections (e.g., alienation, loss of integrity, excessive sacrifice).
  *   **Month 5:** Systematically test ES/SS against the moral saints critique (impoverishment, lack of meaning) and perfectionist well-being accounts.
  *   **Month 6:** Synthesize findings; refine taxonomy; articulate conclusions regarding the distinctness of ES/SS and the susceptibility of each to critique; draft final proposal paper/chapter.

  **(Word Count: 780)**
