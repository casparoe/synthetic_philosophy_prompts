prompt: |-
  I am in the sixth form and a member of my school's debating society, and we recently debated the motion that charitable giving ought to be guided by the greatest expected good per pound. The opposition's strongest speaker made his case almost entirely through a joke I had come across before in other contexts: a man is on his hands and knees beneath a street lamp, searching for his keys; a passer-by asks him where he dropped them, and he says somewhere over there in the dark, and when asked why he is looking here instead, he explains that this is where the light is. The speaker told us that this is precisely what the effective-altruism movement does. It directs money towards whatever can be counted — bed nets, cash transfers, deworming — not because those are where the good is, but because those are where the numbers are, and he concluded that we ought therefore to shift our giving towards the unmeasurable, structural work of reforming institutions and policies.

  I found the joke memorable, and I suspect it is doing considerably more work than it is entitled to, but I cannot articulate why. Could you audit it for me? I should like a table setting out what corresponds to what — the lamp, the light, the keys, the dark, the searcher, the passer-by, the street itself — followed by an account of where the mapping breaks down, separating the disanalogies that matter for the conclusion he drew from those that are merely decorative. Two features in particular puzzle me. The drunkard knows where he lost the keys and therefore has a definite alternative place to look, whereas the critic of effective altruism does not appear to know where the good is to be found; and the drunkard is searching alone, whereas the movement's defenders will say that different people can search different stretches of the street, and that some illumination is better than none. Tell me whether the strong conclusion — that the good lies in the dark, so that is where we should go — survives contact with these differences, or whether the joke can support only the weaker claim that the lit patch is not the whole street; and if a better analogy exists for the same complaint about measurability, what it would be.
reasoning: |-
  Okay, the user is a sixth-form student involved in debating, and they've encountered a joke used against effective altruism. The joke about the drunk man searching under the streetlight instead of where he dropped his keys was presented as a critique that effective altruism focuses only on measurable interventions. The user feels the analogy is flawed but can't articulate why. They want an audit of the analogy, breaking down each component and where it breaks down, especially regarding the drunkard's certainty of the key location versus the critic's uncertainty about where the good is, and the individual vs. collective search.

  First, I need to map each element of the joke to the effective altruism context. The keys represent the "greatest good," which is the goal. The dark area is where the keys (good) actually are, symbolizing hard-to-measure interventions like systemic change. The lit area is where the search happens, representing quantifiable interventions like bed nets. The searcher is the effective altruist, and the passer-by is the critic. The street is the entire space of possible charitable actions.

  The user pointed out two key disanalogies. First, the drunk knows exactly where the keys are, but the critic doesn't know where the unmeasurable good is. That's crucial because without that knowledge, shifting focus to the dark might be futile. Second, the drunk searches alone, but effective altruism involves many actors who can explore different areas. This collective effort means some can work on measurable projects and others on systemic change, which the joke doesn't account for.

  I should also consider other weaknesses. The joke implies a false dilemma: either search in the light or the dark. In reality, effective altruism doesn't ignore systemic issues; it just prioritizes evidence-based approaches where possible. Also, the light isn't arbitrary—it's evidence. Dismissing measurable interventions entirely ignores that they can provide insights or serve as entry points for broader change.

  The user wants to know if the joke supports the strong conclusion that we should only focus on the dark. Given the disanalogies, the joke only supports the weaker claim that the lit area isn't the whole street. The strong conclusion doesn't hold because without knowing where the good is, shifting resources blindly is inefficient. A better analogy might involve multiple searchers with different tools, some with flashlights exploring the dark, emphasizing collaboration and incremental progress.

  The user might need this analysis to rebut the opposition in future debates. They probably want a clear, structured argument to counter the joke effectively. Underlying needs include understanding logical fallacies in analogies and strengthening their debating skills with nuanced critiques. Providing a table and a better analogy would equip them to articulate why effective altruism's approach is more reasonable than the joke suggests.
answer: |-
  Here's a breakdown of the analogy's mapping, its critical disanalogies, and why the "strong conclusion" fails, followed by a better alternative analogy.

  **Analogy Mapping Table:**

  | Joke Element      | Corresponding Element in EA Context                   | Interpretation by Opposition Speaker                  |
  | :---------------- | :---------------------------------------------------- | :---------------------------------------------------- |
  | **The Keys**      | The "Greatest Good" / Highest-impact outcome          | The true, ultimate goal of charitable action.         |
  | **The Dark**      | Areas of hard-to-measure impact (systemic change, policy reform, complex cultural shifts) | Where the *real* highest-impact work ("greatest good") actually lies. |
  | **The Lit Patch** | Areas of measurable impact (bed nets, deworming, cash transfers) | Where effective altruism (EA) focuses *only* because it's measurable. |
  | **The Searcher**  | The Effective Altruism movement / its practitioners   | People mistakenly looking only where measurement is easy. |
  | **The Passer-by** | The Critic of EA (the Opposition Speaker)             | Someone pointing out the fundamental error in approach. |
  | **The Street**    | The entire landscape of charitable interventions      | The full range of possible actions to do good.        |
  | **The Lamp**      | Tools of quantification (cost-effectiveness analysis, RCTs, metrics) | The source of the "light" (measurability) that misdirects the search. |
  | **The Question**  | "Where did you drop them?"                            | Asking EA to justify *why* it focuses on measurable interventions. |
  | **The Drunkard's Answer** | "Over there in the dark."                     | Admitting the *real* high-impact work is in the unmeasurable realm. |
  | **The Drunkard's Justification** | "This is where the light is."                  | EA's (alleged) rationale: focusing only where measurement is possible. |

  **Where the Mapping Breaks Down (Critical Disanalogies):**

  1.  **Knowledge of Key Location (Crucial Disanalogy):**
      *   **Joke:** The drunkard *knows definitively* the keys are in the dark ("somewhere over there").
      *   **EA Context:** The critic *does not know definitively* that the "greatest good" lies *only* or *primarily* in the unmeasurable "dark." They assert it based on intuition, ideology, or complexity, but lack the equivalent certainty of the drunkard. Crucially, **they offer no reliable alternative method to *find* the keys in the dark.** The drunkard knows *where* to look (a specific direction); the critic just says "not here," without a viable plan for *effective* action in the dark.
      *   **Why it Matters:** The joke's critique relies on the drunkard's *certainty* to justify abandoning the lit area. Without this certainty in the real world, abandoning measurable impact for unmeasurable territory is a leap of faith, not a reasoned strategy. EA's point is that searching where you *can* see (measure) is rational when you *don't* know for sure where the keys are in the vast dark.

  2.  **Nature of the Search (Crucial Disanalogy):**
      *   **Joke:** A *single individual* searches one spot at a time. Looking in the light precludes looking in the dark simultaneously.
      *   **EA Context:** Philanthropy involves *many actors* (individuals, foundations, NGOs, governments). EA argues for *allocating marginal resources* where evidence suggests highest *known* impact *per pound*. **This does not preclude *other* actors working on systemic/"dark" interventions.** The EA movement actively supports research into harder-to-measure areas (e.g., global catastrophic risks, animal welfare policy, improving institutional decision-making). The analogy falsely presents an either/or choice for the *entire* charitable sector.
      *   **Why it Matters:** The joke implies EA's approach starves the "dark" of all resources. In reality, EA seeks to optimize *its specific recommended allocations* based on current evidence, while acknowledging other important work happens (and funding research to illuminate more of the "dark"). It's about comparative advantage and resource allocation, not a monopoly on charitable action.

  3.  **Purpose of the Light (Important Disanalogy):**
      *   **Joke:** The light is arbitrary and unconnected to the keys. It's *only* convenient.
      *   **EA Context:** The "light" (quantification, evidence) isn't arbitrary. It's a tool specifically designed to *find* the keys (impact). While imperfect and limited, it *has* successfully identified interventions (like bed nets) that demonstrably save lives cheaply. The light *can* sometimes illuminate pathways or principles relevant to the "dark" (e.g., evidence on what makes aid effective informs institutional reform debates).
      *   **Why it Matters:** The joke dismisses the light as useless and misleading. EA argues the light is a valuable, albeit limited, tool that *has* found significant "keys" and provides the best *available* guide for action when certainty is absent. Ignoring it isn't principled; it's potentially wasteful.

  4.  **The Nature of the "Dark" (Important Disanalogy):**
      *   **Joke:** The dark is a *single*, known, contiguous area adjacent to the light.
      *   **EA Context:** The "dark" (unmeasurable systemic good) is vast, heterogeneous, and poorly defined. It contains interventions of wildly varying *potential* impact and likelihood of success. Some parts might hold immense good, others might be dead ends or even harmful. There's no map.
      *   **Why it Matters:** Shifting resources "to the dark" is meaningless without specifying *where* in the dark and *how* to work effectively there. The critic's conclusion ("look in the dark") provides no actionable alternative strategy, unlike the drunkard who has a specific direction. EA's focus on measurability is partly a response to the sheer difficulty and uncertainty of navigating this vast, uncharted territory.

  **Decorative Disanalogies (Less Critical for the Conclusion):**
  *   **The Drunkard:** The implication of impairment isn't necessary for the core critique about misdirected search. EA proponents are generally seen as rational, not impaired.
  *   **The Physical Act of Searching:** The literal crawling on hands and knees isn't relevant; it's a metaphor for effort/attention.
  *   **The Passer-by's Role:** The passer-by is a narrative device to voice the critique; in reality, the critique exists within the discourse without needing a specific challenger.

  **Does the Strong Conclusion Survive?**
  *   **Strong Conclusion (from Joke):** The *greatest good lies exclusively (or primarily) in the unmeasurable "dark," so we should shift our giving there.*
  *   **Verdict: No, it does not survive.** The disanalogies of **Knowledge** and **Nature of the Search** are fatal.
      *   The critic lacks the drunkard's certainty *about the location of the good in the dark*. Without this, the conclusion is an unsupported assertion.
      *   The critic fails to provide a viable alternative method for *finding* and *achieving* that good in the dark with comparable rigor to evidence-based approaches.
      *   The analogy ignores that resources *can* be allocated to both measurable *and* hard-to-measure interventions by different actors, and that EA explicitly supports illuminating more of the "dark" through research.
  *   **Weaker Claim Supported:** The joke *does* successfully support the weaker claim: **The lit patch (easily measurable interventions) is not the entire street (all possible charitable good). Focusing *only* on what's easily measurable risks missing important opportunities in harder-to-measure areas.** This is a valid critique of an *overly narrow* interpretation of EA, which the movement itself generally acknowledges and seeks to address through research diversification.

  **A Better Analogy for the Measurability Complaint:**

  > **The Ocean Explorer Analogy:** Imagine humanity wants to find valuable resources (the greatest good) in a vast, unexplored ocean. Effective altruism is like an explorer focusing efforts on mapping the shallow, sunlit continental shelves using sonar and dredging. They can clearly identify and quantify resources there (coral, fish, minerals near shore) and bring them up efficiently. A critic argues, "The *real* treasures – sunken cities, deep-sea vents with unique life, massive mineral deposits – lie in the deep, dark abyss! You're only looking where it's easy to see!" The EA explorer responds: "You're right, the deep ocean holds immense potential value we likely can't even imagine yet. But diving into the abyss blindly with our current technology is incredibly risky, expensive, and we have no reliable way to find those treasures or even know if we've succeeded. While we send probes and develop better deep-sea tech (research into systemic change), it's rational to keep gathering the valuable, known resources from the shallows *with the resources we have now*. As we learn more and our tools improve (better metrics, theories of change for institutions), we can allocate more resources to exploring deeper, targeting the most promising trenches first. Ignoring the known resources of the shallows wouldn't magically make us better at finding deep-sea treasure; it might just leave us resource-poor and unable to fund the development of better deep-diving technology."

  **Why this is better:**
  *   **Acknowledges the Vast Unknown:** The deep ocean represents the scale and mystery of unmeasurable systemic impact.
  *   **Accepts the Critique's Core:** The critic is right that the deep *could* hold greater treasures.
  *   **Highlights Uncertainty & Risk:** Diving deep blindly is risky and has a low chance of success with current tools.
  *   **Emphasizes Sequential/Parallel Development:** It shows the value of exploiting known, accessible resources *while* investing in R&D to explore the unknown more effectively in the future.
  *   **Avoids False Certainty:** Nobody *knows* exactly what's in the deep or where. The potential is vast but unproven.
  *   **Supports Resource Allocation:** It justifies focusing *marginal* resources on the known-good while funding exploration of the unknown. It doesn't force an either/or choice for the whole endeavor.
  *   **Aligns with EA Practice:** This mirrors EA's support for both current high-impact interventions *and* research into potentially higher-impact but harder-to-measure areas (like AI safety, institutional reform, or movement building).

  This analogy captures the valid concern about missing opportunities in hard-to-measure areas without falling into the traps of the streetlight joke, particularly the false certainty and the false dichotomy. It supports the *weaker* critique (don't ignore the deep) but undermines the *strong* conclusion (abandon the shallows for the deep).
