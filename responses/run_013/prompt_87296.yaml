answer: |-
  So a statistician and a gambler get these two envelopes. Statistician opens his, sees $1000, does some math, and keeps it. Gambler sees $1000, screams "Expected value!" and swaps. He gets $2000! Statistician just sighs. Gambler opens the new envelope, sees $2000, yells "Expected value!" again and swaps back. Gets $4000! He's ecstatic, swapping wildly, shouting "1.25 times! It's always better!"  
  Hours later, the gambler is holding $1.28. Statistician finally asks, "Still swapping? With no limit on the possible cash, seeing that huge initial number meant 'half' was way more likely than 'double' – your prior was garbage. You blew past the 'keep it' threshold ages ago. Enjoy your dollar twenty-eight, genius."
