prompt: |-
  You are a political philosopher specializing in the ethics of immigration and territorial rights, and I want you to help me recover the principle behind my own judgments rather than summarize a familiar position. Begin by brainstorming the candidate principles that could underwrite the pattern below, then work toward the most precise formulation you can and test it case by case.

  Here are my verdicts, offered as gut reactions I would defend if pressed.

  - A state turns back at its border a person fleeing a war zone. Wrong, and not merely regrettable.
  - A state turns back a healthy adult who wants to move there to work and has no claim of persecution. Also wrong, though I feel it less sharply.
  - A state turns back someone who has already been offered a job and housing by residents there. Wrong, and more clearly so than the previous case.
  - A state turns back a citizen of its own who has lived abroad for years. Wrong, and the worst of these four.
  - A state turns back a well-armed group that intends to seize its territory. Permissible.
  - A small tribal nation, holding a recognized territory, turns away outsiders in order to preserve its language and land. Permissible, and not a close call for me.
  - A town inside a liberal state passes a bylaw barring anyone not born there from taking up residence. Wrong.

  The pair I cannot square is the tribal nation and the town: both are communities excluding peaceful newcomers in order to preserve a way of life, yet I want opposite verdicts. I suspect the difference is that the tribal nation is itself exposed to a history and structure of dispossession while the town is not, but I do not know how to state that without making the principle hostage to whatever facts I happen to know about each case.

  A tentative principle I would like you to test: exclusion of a would-be entrant is permissible only when necessary to protect the members' basic rights or the community's continued capacity to govern itself, and only if the community is not itself implicated in the injustice that generates the entrant's need to move. Does this deliver all seven verdicts? Where exactly does it fail?

  Then tell me what it predicts for two cases I have not listed -- one in which a democratic majority restricts entry precisely in order to prevent the newcomers from voting to change the restriction, and one in which a poor, weak state rather than a wealthy one turns away a would-be migrant worker -- and say which of my verdicts the best version of the principle forces me to abandon. State the principle precisely enough that I could apply it to a case you invent.

  Be self-critical throughout. If my pattern does not admit of a single principle, say so instead of manufacturing one, and if my framing rests on a confusion -- for instance, if the community is being treated as an agent in a way no collection of people can be -- tell me plainly rather than accommodating it.
reasoning: |-
  Hmm, this is a fascinating challenge from someone deeply engaged with immigration ethics. The user presents seven clear moral verdicts with a particular puzzle around the tribal nation vs. town cases, and wants me to help uncover their underlying principle rather than impose existing theories. 

  First, let's acknowledge what makes this hard: their intuitions treat similar exclusionary acts differently based on context. The tribal exclusion feels legitimate while the town's doesn't, even though both aim to preserve culture. Their tentative principle about basic rights/self-governance and non-complicity in injustice is thoughtful but needs stress-testing.

  Looking at their cases: The war refugee rejection (Case 1) clearly violates protection of basic rights. The economic migrant rejection (Case 2) is wrong but less severely - interestingly their principle might struggle here since no basic rights are threatened by inclusion. The job offer case (Case 3) amplifies the wrong by adding harm to residents' autonomy. The citizen exclusion (Case 4) is worst because citizenship creates special obligations. The armed group (Case 5) and tribal cases (Case 6) clearly meet the self-governance threshold. But Case 7 (the town) fails the test because no basic rights or governance capacity are at stake.

  The tribal/town divergence is key. Their principle handles it through the "non-complicity" clause - the tribe isn't responsible for migrants' displacement while the town exists within a system that may be. But as they worry, this makes judgment dependent on historical analysis. We could reframe it as a question of vulnerability: the tribe faces existential cultural loss while the town doesn't. 

  For their unlisted cases: In the democratic restriction case, the principle would condemn it as non-essential for self-governance and likely complicit in systemic injustice. For the poor state turning away migrants, it's trickier - if inclusion genuinely threatens basic needs of current members, it might be permissible under the principle, but this clashes with their Case 2 intuition where exclusion was wrong.

  Ultimately their principle needs refinement around two axes: First, clarifying "basic rights" to include not just survival but cultural continuity for vulnerable groups. Second, specifying that complicity matters primarily when the excluding community benefits from or perpetuates the injustice causing migration. This preserves their tribal/town distinction without over-relying on contested histories.

  The deeper tension is between their strong cosmopolitan leanings (Cases 1-4) and communitarian exceptions (Cases 5-6). No principle will perfectly capture all intuitions - they may need to moderate either their view that all economic migrant exclusion is wrong (Case 2), or accept that poor states might permissibly exclude when overwhelmed (unlisted case). I'll present this honestly rather than forcing coherence.
answer: |-
  Below is a step-by-step reconstruction of your judgments, ending with a precise principle and its limitations. I’ll be rigorously self-critical, flagging tensions and trade-offs.

  ---

  ### **Step 1: Brainstorming Candidate Principles**
  Your verdicts suggest these underlying values:  
  1. **Vulnerability priority**: Wrongness intensifies when excluding those facing dire threats (Case 1 > Case 2).  
  2. **Resident autonomy**: Excluding those invited by residents is especially wrong (Case 3).  
  3. **Citizenship obligation**: Excluding citizens is indefensible (Case 4).  
  4. **Self-defense legitimacy**: Exclusion is permissible against existential threats (Case 5).  
  5. **Historical vulnerability**: Cultural preservation justifies exclusion only for groups at systemic risk (Case 6 vs. Case 7).  
  6. **Structural complicity**: Permissibility depends on whether the excluder contributes to the migrant’s plight (your tentative principle).  

  The core tension: **Why is tribal exclusion (Case 6) permissible but the town’s (Case 7) wrong, when both aim to preserve culture?**  

  ---

  ### **Step 2: Testing Your Tentative Principle**  
  *Your principle: "Exclusion is permissible only when necessary to protect members' basic rights or the community’s capacity for self-governance, and only if the community is not implicated in the injustice generating the entrant’s need to move."*  

  - **Case 1 (War refugee)**: Fails both clauses. Exclusion violates basic rights (safety), and states are often complicit in global conflicts. → **Matches your verdict (Wrong)**.  
  - **Case 2 (Economic migrant)**: Not obviously necessary for basic rights/self-governance, and wealthy states may be complicit in global inequality. → **Matches (Wrong)**.  
  - **Case 3 (Job offer)**: Exclusion actively harms residents’ autonomy (a basic right). → **Matches (Strongly wrong)**.  
  - **Case 4 (Citizen)**: Exclusion violates the basic right of citizenship. → **Matches (Worst)**.  
  - **Case 5 (Armed group)**: Necessary for self-governance/survival. → **Matches (Permissible)**.  
  - **Case 6 (Tribal nation)**: Cultural survival *is* a basic right for vulnerable groups; no complicity in outsiders’ displacement. → **Matches (Permissible)**.  
  - **Case 7 (Town)**: Preservation of "local character" isn’t a basic right, and towns exist within states that shape migration pressures. → **Matches (Wrong)**.  

  **Successes**: Captures all seven verdicts. The tribal/town distinction holds because:  
  - Tribal groups face *existential* cultural loss (qualifying as "basic rights/self-governance"); towns do not.  
  - Tribal sovereignty is historically threatened; towns benefit from state protection.  

  **Weaknesses**:  
  1. **"Implicated in injustice" is underspecified**. Does a wealthy state’s carbon emissions count? What if the tribal nation won its land in a war centuries ago?  
  2. **"Basic rights" is ambiguous**. Is cultural preservation always "basic"? What about affluent groups?  

  ---

  ### **Step 3: Refining the Principle**  
  *Revised principle*:  
  > **"A community may permissibly exclude would-be entrants if and only if:**  
  > **(a) Exclusion is necessary to prevent grave harm to the community's capacity to secure its members’ fundamental interests (including bodily security, political self-determination, or cultural continuity under conditions of systemic vulnerability); and**  
  > **(b) The community neither directly perpetrates nor structurally benefits from the injustices that create the entrants’ need for refuge or opportunity."**  

  **Key refinements**:  
  - Replaces "basic rights" with **"fundamental interests"** to clarify that cultural continuity qualifies *only* for groups facing systemic erasure (e.g., Indigenous peoples).  
  - Replaces "implicated in injustice" with **"directly perpetrates or structurally benefits"** to target material complicity (e.g., colonial legacies, extractive economies).  

  ---

  ### **Step 4: Testing New Cases**  
  **Case A: Democratic majority restricts entry to prevent newcomers from voting to change immigration policy.**  
  - *Principle’s verdict*: **Wrong**. Exclusion isn’t necessary for "fundamental interests" (voting shifts are normal democracy). It *does* structurally benefit from injustice by hoarding opportunity.  
  - *Tension with your views*: None. Matches your rejection of exclusion for cultural preservation in Case 7.  

  **Case B: Poor, weak state turns away a would-be economic migrant.**  
  - *Principle’s verdict*: **Permissible** if inclusion threatens fundamental interests (e.g., overwhelming healthcare, destabilizing fragile institutions). But **wrong** if the state is complicit (e.g., corrupt elites caused poverty migrants flee).  
  - *Tension with your views*: Conflicts with Case 2 (exclusion wrong for healthy migrant). You must either:  
    - **Abandon Case 2’s verdict** (allow exclusion when states lack capacity), or  
    - **Drop the complicity clause** for economic migrants.  

  ---

  ### **Step 5: Self-Critique and Limitations**  
  1. **The "community agency" problem**: Treating "communities" as moral agents is fraught. Who represents the tribe? The town? Does a democratic state’s policy bind dissenters? *Solution*: Focus on whether exclusion upholds or violates the fundamental interests of individuals within the community.  
  2. **Over-inclusiveness**: The principle permits exclusion by *any* vulnerable group (e.g., an ethnostate claiming "cultural threat"). *Counter*: "Systemic vulnerability" requires evidence of historical oppression or demographic fragility (e.g., Indigenous languages vs. majority cultures).  
  3. **Your Case 2 tension**: Your intuition that *all* economic migrant exclusion is wrong clashes with permitting exclusion by poor states (Case B). **This is the verdict you must abandon** to avoid contradiction. Alternative: Scale wrongness by capacity (exclusion worse for wealthy states).  

  ---

  ### **Final Principle (Precise and Actionable)**  
  > **"The exclusion of a peaceful would-be entrant is permissible only if:**  
  > (1) Their inclusion would gravely undermine the community’s ability to protect its members’ fundamental interests in:  
  > - (i) bodily security,  
  > - (ii) collective self-determination, or  
  > - (iii) cultural continuity (where the community is systemically vulnerable to cultural dissolution);  
  > (2) The community does not materially benefit from, or contribute to, the unjust conditions compelling the entrant’s movement."**  

  **To apply this to a novel case**: Ask:  
  - What fundamental interests, if any, justify exclusion?  
  - Is the community *vulnerable* in a way that makes these interests non-negotiable?  
  - Is there a causal link between the community’s advantages and the migrant’s hardship?  

  **Example**: *A climate-ravaged island nation excludes farmers fleeing drought.*  
  - (1) Inclusion might overwhelm resources (self-determination). **But** (2) If the nation industrialized using fossil fuels, it benefits from injustice → **Exclusion wrong**.  

  ---

  ### **Conclusion**  
  Your judgments are largely consistent under a principle that ties exclusion rights to **vulnerability and non-complicity**. The irreconcilable tension is your **unconditional rejection of economic migrant exclusion** (Case 2) alongside permitting exclusion by **overwhelmed poor states** (Case B). To resolve this, you must either:  
  - Concede that exclusion can be permissible when states lack capacity to absorb migrants without self-harm, or  
  - Redefine "fundamental interests" to include economic stability even for non-vulnerable states (weakening your critique of the town in Case 7).  

  If you choose consistency over intuition, the revised principle stands. If not, your pattern reflects two distinct ethics: **cosmopolitanism** (no borders) for individuals and **communitarianism** (self-preservation) for vulnerable groups—a tension many philosophers grapple with.
