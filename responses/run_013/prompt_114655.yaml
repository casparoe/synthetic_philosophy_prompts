prompt: |-
  Me and my friend Dave got into a long argument last night about whether Aquinas is basically a quietist, and I still can't tell who was right. His line was that Aquinas says sedition is always a mortal sin, full stop, so he'd tell you to just put up with a tyrant and shut up about it. I said that can't be the whole story, and I hauled out the bit from the Summa (II-II, q. 42, a. 2, reply to the third objection) where he writes: "A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler, as the Philosopher states." Then he goes on — and I'm going from memory for this part, I don't have the exact words in front of me — to say there's no sedition in disturbing a government of that kind, unless the disturbance is so disorderly that the people end up suffering more from it than they did under the tyrant. So he definately isn't a pure quietist.

  But here's what I actually want help with, because Dave and I just kept circling and neither of us could cash it out.

  First: is the "no sedition in disturbing a tyrant" move a real argument or just a definitional dodge? He's already defined sedition as something opposed to the unity of law and the common good, so once a tyrant's rule isn't that unity, resisting him just falls outside the definition by construction. That feels like winning by stipulation. Or is there something substantive in the background — something about what makes a multitude a people in the first place, or about who holds the authority that a tyrant is abusing?

  Second: that "unless greater harm" clause. Doesn't it quietly turn "sedition is always a mortal sin" into a consequentialist calculation? If the sinfulness of the disturbance depends on comparing the damage it does against the damage the tyrant was doing, then "always" is doing a lot of unearned work.

  Third: how does this fit with what I half-remember from On Kingship, where he seems to say something much more permissive about the multitude getting rid of a tyrant — that if the community had the right to appoint a king it has the right to depose one, and that if some higher authority appointed him you go to that authority instead? And I have a vague memory of him being very wary of private individuals taking it on themselves to kill a tyrant. Are the two texts doing seperate jobs, or is there a real tension between the cautious Summa line and the more political On Kingship line? Also, does he distinguish between a tyrant who seized power in the first place and a legitimate ruler who later turned into one? Because that seems like it should matter a lot and I can't tell if he actually makes the distinction or if I'm importing it from later writers.

  Fourth: who counts as "the multitude"? His line that those who defend the common good and withstand the seditious aren't themselves seditious sounds fine until you notice both sides in a revolt will say exactly that about themselves. Is there a criterion here, or does it just collapse into whoever happens to be right about the common good — which we only know after the fact?

  I don't need a reading list or citations, and please don't just tell me to go read a commentary — I want the argument itself laid out, in plain terms, including the parts where it doesn't hold together. If the honest answer is that these texts can't be fully reconciled, say that instead of smoothing it over.
reasoning: |-
  Okay, let's tackle this user's query about Aquinas and whether he's a quietist. The user had an argument with Dave, and they're stuck on several points. First, I need to recall Aquinas's positions from the Summa and On Kingship. The user mentioned II-II, q.42, a.2, where Aquinas says resisting a tyrant isn't sedition if the government is unjust. But the user questions if that's just a definitional dodge. 

  Hmm, the user's first point is whether Aquinas's move is substantive or just semantic. Aquinas defines sedition as opposing the common good. So if a tyrant isn't serving the common good, resisting him isn't sedition. But is there a deeper principle here? I remember Aquinas's underlying ideas about authority deriving from God for the common good. A tyrant violates that purpose, so authority isn't legitimate. That makes the resistance not sedition by definition, but it's based on a substantive view of political authority. So it's not just wordplay; it's rooted in his metaphysics.

  Next, the "unless greater harm" clause. The user thinks this introduces consequentialism. Aquinas does consider outcomes, but within a natural law framework. The act of resisting isn't sinful in itself against a tyrant, but causing more harm could be a separate sin against charity or prudence. So the "always" applies to unjust resistance against legitimate authority, but consequentialist elements come in when assessing the method of resistance. That distinction might resolve the tension.

  Then there's On Kingship versus the Summa. The user recalls that in On Kingship, Aquinas talks about the community's right to depose a tyrant if they appointed him, or appealing to higher authority. But in the Summa, he's cautious about disorder. The difference might be context: Summa addresses moral theology for individuals, while On Kingship is political theory. Also, Aquinas distinguishes between usurpers and rulers who become tyrants. The community has more right to act against a usurper. But for legitimate rulers turned tyrant, due process through higher authority is preferred. Private individuals shouldn't act alone, which aligns with both texts.

  The fourth point is about "the multitude." Both sides claim to act for the common good. Aquinas doesn't provide a clear criterion, which is a problem. He might rely on objective natural law, but in practice, it's messy. The user is right that this is a weak spot in Aquinas's theory, leading to post-hoc judgments.

  The user also mentioned tension between texts. On Kingship is more permissive, but Summa emphasizes prudence. They're complementary: the right to resist exists, but must be exercised carefully. The distinction between tyrant types matters. Usurpers lack legitimacy, so resistance isn't sedition. Legitimate rulers turned tyrant require due process. Aquinas does make that distinction, though maybe not explicitly enough.

  Overall, Aquinas isn't a quietist because he allows resistance under certain conditions. But his framework has ambiguities, like defining the multitude and balancing consequences. The user needs clarity on whether these points hold up or if there's irreconcilable tension. Honestly, some parts are consistent within his system, but practical application is tricky, especially identifying the common good and preventing chaos. That's where Aquinas's theory might not fully cohere, as the user suspects.
answer: |-
  You're dead right that Aquinas isn't a pure quietist, and Dave's "full stop" reading misses crucial nuance. Let's break down your excellent questions head-on, acknowledging both the strengths and genuine tensions in Aquinas's thought:

  1.  **Definitional Dodge or Substantive Argument?**
      *   **The Dodge Aspect:** You're perceptive. Aquinas *does* win a rhetorical victory here by definition. By defining "sedition" *specifically* as rebellion against *just* authority ordered to the common good, resistance against a tyrant simply falls outside the category *by definition*. This avoids him having to say "Sedition is always a sin... *except* against tyrants," which would weaken his core principle. It *is* stipulative.
      *   **The Substantive Core:** However, this definition rests on a much deeper, substantive foundation in Aquinas's political philosophy:
          *   **Authority's Source & Purpose:** Authority exists *for* the common good. Its legitimacy *derives* from serving that end (ultimately grounded in God/Natural Law). A ruler who systematically pursues private gain *fundamentally perverts* the very purpose of authority.
          *   **Tyrant = Usurper of Function:** The tyrant isn't just a bad ruler; he's someone actively *misusing* the power entrusted to him for its proper purpose. He has, in a sense, *abdicated* his legitimate role *as* a ruler serving the common good, even if he retains the title and force.
          *   **The "People" Defined by Common Good:** The unity ("peace") Aquinas values isn't mere absence of conflict under *any* ruler. It's the unity achieved through just governance *for* the common good. A tyrant actively *destroys* this true unity. Resisting him isn't disrupting the *true* peace/unity; it's reacting against its destruction. The "multitude" becomes a "people" bound by law *for* the common good. A tyrant dissolves this bond.
      *   **Verdict:** It's **both**. The move *looks* definitional (and is strategically neat), but it **rests on the substantive bedrock of his entire theory of authority and the common good.** The tyrant lacks *legitimate* authority precisely because he violates its justifying purpose.

  2.  **The "Unless Greater Harm" Clause & "Always":**
      *   **The Consequentialist Tension:** You've nailed a major point of friction. On the surface, yes, this clause introduces a significant consequentialist element *at the point of action*. The *sinfulness* of the act of resistance *itself* (against the tyrant) isn't the core issue (it's not sedition), but the *manner* and *likely outcome* of that resistance *can* make it sinful on other grounds.
      *   **How Aquinas Likely Sees It:**
          *   **The "Always" Sin:** Applies *only* to rebellion against *legitimate* authority ("sedition" proper). Resistance to a *tyrant* isn't this sin.
          *   **The New Sin:** Acting *against the tyrant* can become sinful *if* done in a way that violates other principles, primarily **prudence** and **charity**. Causing disproportionate harm (chaos worse than tyranny, innocent suffering) is reckless and fails the demands of love for neighbor and the common good itself. It might also involve intrinsically evil means (like murder of innocents).
          *   **Not *Just* Consequentialism, but Consequentialism within Virtue Ethics:** The evaluation isn't *purely* utilitarian calculus. It's framed within the virtues: Is this act *prudent*? Does it manifest *charity*? Or is it driven by rashness, hatred, or personal ambition? The *potential consequences* are a crucial factor in judging the prudence and charity of the act.
      *   **Verdict:** The "always" holds **only for rebellion against just authority.** For resisting tyranny, the act *can* be licit *in principle* but **becomes sinful *in practice* if done imprudently or uncharitably, with disproportionate harm being a key indicator of such vice.** It's a consequentialist element *within* a virtue ethics framework, focused on the *means* and *foreseeable outcomes* of the resistance.

  3.  **Summa vs. On Kingship & Tyrant Types:**
      *   **The Texts:**
          *   *Summa (II-II, q. 42, a. 2):* Focuses on the *moral status of the act of resistance itself* (sedition? sinful?). Cautious about disorder and unintended harm ("unless greater harm"). Primarily addresses the individual conscience facing rebellion.
          *   *De Regno (On Kingship) I, 6:* Focuses on the *political right/duty of the community* and *procedures*. More permissive: "There should be no opportunity given for [a king] to become a tyrant... [and] his power should be so tempered that he cannot easily fall into tyranny." If he *does* become a tyrant, the community that appointed him has the right to depose him. If appointed by a higher authority (e.g., Emperor), the community should appeal *to that higher authority*. He **explicitly warns against private individuals undertaking to kill a tyrant**, calling it "generally speaking... perilous... and harmful to the people."
      *   **Reconciling the Emphasis:**
          *   **Different Audiences/Purposes:** *Summa* is a comprehensive theological manual for priests/students, focusing on categorizing sins/virtues. *De Regno* is a political treatise advising a king on governance and the dangers of tyranny.
          *   **Complementarity, Not Contradiction:** *De Regno* establishes the *political principle* that the community (or higher authority) has the *right/duty* to remove a tyrant. The *Summa* addresses the *moral execution* of that right: *How* is it done? Is this *particular act* of disturbance sinful? The *Summa's* caution ("unless greater harm") applies directly to how the community (or its representatives) exercises the right *De Regno* grants. The warning against private individuals in *De Regno* reinforces the *Summa's* concern about disorderly, imprudent action.
      *   **Does He Distinguish Tyrant Types?** **Yes, implicitly and crucially.**
          *   **Usurper (Tyrant *ex defectu tituli*):** Seized power illegitimately. No rightful claim. Resistance isn't sedition *by definition*.
          *   **Abuser (Tyrant *ex parte exercitii*):** Acquired power legitimately but rules tyrannically. This is the harder case. *De Regno* is primarily concerned with *this* type. Here, Aquinas strongly favors *due process*: appeal to the higher authority that appointed him, or action by the community that elected him. This is where the *Summa's* "unless greater harm" caution is most relevant – deposing a *legitimate-but-abusive* ruler risks greater instability than deposing a pure usurper. The distinction matters because the *means* and *authority* for removal differ significantly.

  4.  **Who is "The Multitude"? The Problem of Perspective:**
      *   **The Core Problem:** This is arguably the **weakest link** in Aquinas's practical application, and you've identified it perfectly. Both sides *will* claim to act for the "true" common good. Aquinas provides **no clear, procedural mechanism** to adjudicate this *in the moment*.
      *   **His Theoretical Grounding (and its Limits):**
          *   **Objective Common Good:** He assumes the common good is objective, discernible through reason and Natural Law (e.g., preserving life, order, justice, facilitating virtue).
          *   **The "Seditious" Defined by Action:** Those *actually* acting against the objectively true common good *are* seditious, regardless of their claims.
          *   **The "True Defenders":** Those acting to restore or defend the objective common good against tyranny or sedition are *not* seditious, even if their actions cause disruption.
      *   **The Practical Impossibility:** The rub is knowing *who is objectively right* amidst the chaos of rebellion. Aquinas relies on:
          *   **Prudent Judgment:** Leaders must discern based on the tyrant's *manifest and persistent* violations of the common good (e.g., blatant theft, murder of innocents, suppression of justice, waging unjust wars for personal gain).
          *   **Authoritative Interpretation:** Ideally, the "multitude" acts through its legitimate representatives or institutions (e.g., nobles, elected leaders, councils) who *should* have a clearer view of the common good than a mob. *De Regno* implies this.
      *   **The Unavoidable Reality:** In practice, **it often *does* collapse into "whoever wins" or post-hoc judgment.** A failed rebellion is sedition; a successful one is liberation. Aquinas offers a standard (*objective common good*) but **no foolproof earthly arbiter during the conflict itself.** This is a genuine tension and limitation in his theory. He trusts in right reason and virtue, but recognizes the fallen nature of humanity makes this messy.

  **The Honest Synthesis & Where it Doesn't Fully Hold:**

  1.  **Not a Quietist:** Aquinas absolutely permits, and sometimes *demands*, resistance to tyranny. It is not "always a mortal sin" to disturb an unjust ruler.
  2.  **The Core Justification:** Resisting a true tyrant isn't sedition *because* tyranny fundamentally violates the purpose of authority (common good) and dissolves the true unity of the people. This is substantive, not *just* definitional.
  3.  **The Cautions:** Resistance must be:
      *   **Proportionate & Prudent:** Avoid causing greater harm than the tyranny itself ("unless greater harm" clause).
      *   **Authorized:** Ideally undertaken by the community as a whole (or its legitimate representatives) or by appealing to a higher authority (*De Regno*), not by private individuals acting alone.
      *   **Distinguished:** The means and legitimacy of resistance differ depending on whether the tyrant is a usurper or a legitimate ruler turned abusive.
  4.  **The Genuine Tensions/Irritations:**
      *   **"Always" is Conditional:** The "sedition is always a sin" maxim only holds against *just* rulers. Against tyrants, a *different* kind of sin (against prudence/charity) can occur based on *consequences/methods*.
      *   **"Unless Greater Harm" is Consequentialist within Virtue:** While framed by prudence and charity, evaluating "greater harm" *is* inherently predictive and consequentialist, injecting instability into the "always" claim about resisting tyranny.
      *   **"The Multitude" is Vague & Problematic:** Identifying the legitimate agent of resistance ("the multitude") and objectively discerning the "true" common good *during* a revolt is Aquinas's biggest practical weakness. It often relies on post-hoc judgment or successful power struggles, undermining the theoretical clarity.
      *   **Textual Emphasis Differs:** *Summa* (focused on individual sin) emphasizes caution and potential harm; *De Regno* (focused on political right) emphasizes the community's authority to depose. They *can* be reconciled (right exists, but exercise prudently), but the different emphases can feel like a tension.

  **Conclusion:** Dave is wrong that Aquinas demands pure quietism. You're right that the "not sedition against a tyrant" move has substantive backing. However, Aquinas wraps this permission in layers of caution and conditions (prudence, charity, due process, avoiding greater harm, community action) that make revolutionary action highly risky and complex. The tensions you identified – the definitional element, the consequentialist "unless" clause, the practical ambiguity of "the multitude" and the common good – are real and not fully resolvable within his texts. He provides a powerful *justification* for resistance grounded in authority's purpose, but a very *cautious and procedurally demanding framework* for its execution, leaving significant room for debate and prudential judgment (and historical contingency) about when and how it's truly licit. It's a theory that condemns both passive acceptance of profound evil *and* reckless, destructive rebellion, aiming for a difficult middle path grounded in objective justice and practical wisdom.
