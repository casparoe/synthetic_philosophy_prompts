prompt: |-
  I am trying to decide whether to tell my brother, before his wedding, something about his fiancée that I believe he ought to know. My closest friend — whose judgment I trust more than my own, and who has nothing to gain either way — says it would be wrong of me to say anything. When I ask her to explain, she refuses: she says that if she gives me her reasons I will argue with them and end up doing what I wanted to do anyway, and that I should simply take her word for it.

  What troubles me is not only that she might be wrong. I would not take anyone's word over a doctor's about my health, or a lawyer's about a contract, the way I am tempted to take hers here, and that seems backwards if questions of right and wrong are as real as questions of medicine. Nor could I explain to my brother, or to myself, why I stayed silent — I would be doing what I was told; and if it turned out to be the wrong thing, I cannot tell whether the fault would be hers or mine.

  Is it all right for me to let her judgment stand in for mine here? What exactly do I give up if I do — and does your answer change if it turns out she was wrong?
reasoning: |-
  Okay, the user is facing a really tough ethical dilemma. They want to tell their brother something important about his fiancée before the wedding, but their most trusted friend insists they should stay silent without giving reasons. The user is conflicted because they value this friend's judgment more than their own, yet they feel uneasy about blindly following advice on such a serious matter. 

  Hmm... what makes this complex is how the user describes their friend: someone with "nothing to gain" and whose judgment they trust "more than my own." That's significant - it suggests this isn't about doubting the friend's motives, but about the nature of moral decisions. The user's analogy to doctors/lawyers is revealing too - they instinctively recognize expertise in technical fields but feel ethics should be different. Smart observation.

  The core tension seems to be between two valid concerns: On one hand, the friend might have insight the user lacks (maybe about brother's personality, or how revelations backfire). On the other, abdicating moral responsibility feels wrong. The user's worry about "whose fault it would be" if things go south shows they understand the gravity of this.

  I notice the user didn't specify what the secret is. That's probably intentional - the ethical principle matters more than the content here. Though if it were something like infidelity versus say, a harmless youthful mistake, that might change the calculus. But since we don't know, we have to treat it as a significant but ambiguous issue.

  The friend's refusal to explain is... interesting. It could be protective (knowing the user would rationalize speaking up) or patronizing. The user's frustration comes through in phrases like "I would be doing what I was told" - that passive language hints at resentment. 

  What's not said but implied: The user seems to want permission to either ignore the friend or demand explanations. But they're too ethical to act without examining why. That's admirable actually - many people would just act impulsively.
answer: |-
  This is a profound ethical dilemma that touches on autonomy, trust, moral responsibility, and the nature of judgment. Here’s a structured way to think through it:

  ### 1. **The Limits of Delegating Moral Judgment**
     - **Moral decisions require personal engagement.** Unlike medical or legal advice (where expertise is domain-specific), ethics often involves context, relationships, and values *you* must reconcile. Your friend’s refusal to explain her reasoning prevents you from:
       - Evaluating whether her principles align with yours.
       - Assessing if she has information you lack.
       - Understanding potential consequences she foresees.
     - **Blind delegation risks abdicating responsibility.** If you act solely on her instruction, you surrender your agency. Should this decision harm your brother, you share culpability—not because you trusted a friend, but because you chose not to critically engage with a morally significant choice affecting others.

  ### 2. **Why "Taking Her Word" is Problematic Here**
     - **The stakes are uniquely personal.** This impacts your brother’s life, your relationship with him, and your integrity. Your friend, however wise, cannot bear the emotional or relational consequences *for you*.
     - **Her refusal to explain is a red flag.** Valid concerns (e.g., "This might destroy their relationship unnecessarily") can be stated without detail. Her stance suggests:
       - She doubts your ability to weigh reasons impartially (which itself merits reflection), or
       - Her reasoning might not withstand scrutiny (e.g., "Avoid drama at all costs" isn’t always ethical).
     - **"Trust" vs. "Unquestioning obedience":** Trusting her judgment could mean seriously considering her view—not substituting her will for yours without understanding why.

  ### 3. **What You Give Up by Blindly Following**
     - **Your moral agency:** You act as a conduit for someone else’s decision, not a moral agent. This compromises your integrity.
     - **Accountability:** You cannot justify silence to your brother or yourself. "My friend told me to" is an evasion, not a reason.
     - **Growth:** Wrestling with hard choices builds wisdom. Outsourcing them stunts ethical development.
     - **Relationship clarity:** If your silence later feels like betrayal, resentment toward your friend may poison that relationship.

  ### 4. **Does Her Being "Wrong" Change the Answer?**
     - **No.** The ethical flaw lies in the *process*, not the outcome:
       - If she’s *right* and you stay silent, you avoided harm but failed to own the decision. You reinforce passive compliance over engaged judgment.
       - If she’s *wrong* and your silence causes harm, you bear partial blame for uncritically following advice. "I was just following orders" is morally indefensible.
     - **Outcome vs. Principle:** Good outcomes don’t validate poor processes (e.g., lying for a "good reason" remains ethically risky). Your duty is to act justly, not guarantee perfect results.

  ---

  ### **A Path Forward**
  1. **Insist on understanding her reasoning.** Say:  
     *"I respect your judgment, but I can’t surrender my responsibility to my brother without understanding why. If I’m prone to rationalization, call that out—but I need your insight to weigh this fairly."*  
     If she still refuses, her position is ethically untenable. True counsel invites scrutiny.

  2. **Reflect independently:**
     - **What is the secret?** Is it objectively serious (e.g., abuse, infidelity, fraud) or subjective (e.g., a past relationship, a personality clash)? Does it directly impact your brother’s safety/happiness?
     - **What are your motives?** Are you acting out of care for your brother, or discomfort, jealousy, or a sense of superiority?
     - **What are probable outcomes?** Could disclosure prevent harm? Could silence uphold peace? Might disclosure backfire? (E.g., Will he believe you? Could it isolate you both?)

  3. **Consider alternatives:**
     - Urge the fiancée to disclose it herself.
     - Consult a neutral third party (e.g., a counselor or clergy).
     - Frame the issue hypothetically to your brother: *"If someone knew something important about [fiancée] that might affect your marriage, would you want to be told?"*

  4. **Decide based on conscience, not coercion:**  
     If, after scrutiny, you believe silence is best, you own that choice. If disclosure is necessary, do it compassionately, focusing on your brother’s well-being.

  ---

  **In essence:** Trust your friend’s input as valuable data—not a verdict. Surrendering your judgment erodes your integrity and leaves you morally adrift. True respect for her wisdom means engaging with it deeply, not obeying it blindly. The right choice is the one you can stand behind with clarity and courage, whatever the outcome.
