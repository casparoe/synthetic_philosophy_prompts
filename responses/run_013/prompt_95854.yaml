  Let me understand the key constraints. The expressivist is a quasi-realist using minimalist truth concepts, while the cognitivist is a non-naturalist realist. Neither can treat "non-cognitive state" or "truth-aptness" as primitive. The statement needs specific sections: agreed claims, disagreements table, cruxes with cases, and closing thoughts.

  For the agreed claims section, I'll start by neutrally stating the Frege-Geach point about meaning consistency across embedded contexts. I'll list all the linguistic environments needing explanation (negation, conditionals etc.). Then specify success conditions - for expressivists it's showing how non-cognitive states compose, for cognitivists it's showing moral propositions function like others.

  The disagreements need careful phrasing. For semantic value: expressivists see attitudes, cognitivists see truth-conditions. On meaning consistency: expressivists see this as disputed, cognitivists as mandatory. I'll present these side-by-side in a table format.

  The cruxes section is crucial. The negation problem is central: is the state for "not wrong" just absence of disapproval or a positive attitude? I'll use the proposed case of an agent who accepts the expressivist analysis but reports no attitude. Both sides have different predictions here.

  For the practicality crux, I'll use the case of someone asserting premises but denying the conclusion in moral modus ponens. Expressivists predict incoherence, cognitivists predict possible consistency. On minimalist truth, I'll examine whether it collapses differences, using cases of attitude agreement versus disagreement.

  In closing, each side must specify what would falsify their view. Expressivists might be undermined if compositional attitudes don't mirror logic. Cognitivists if practicality can't be explained propositionally. Both agree that embedding alone doesn't settle realism.

  Throughout I'll maintain strict neutrality, avoiding strawman positions. The challenge is to show where genuine disagreement remains after granting minimalist truth concepts. The cases should illuminate whether differences are substantive or merely verbal.
answer: |-
  ## Joint Statement: Expressivist-Cognitivist Adversarial Collaboration on the Frege-Geach Problem

  **Preamble:** We, a committed quasi-realist expressivist (QE) and a committed non-naturalist cognitivist realist (CR), having engaged in sustained, good-faith dialogue on the Frege-Geach problem, agree on the following foundational points, acknowledge the following residual disagreements, outline the key cruxes, and specify evidential considerations. This collaboration proceeds under the shared constraints that neither "non-cognitive state" nor "truth-aptness" may be treated as primitive; both notions must be explicated without presupposing our respective conclusions.

  **1. Agreed Claims:**

      1.  **The Frege-Geach Datum:** A compositional semantic theory must account for the fact that moral predicates (e.g., "wrong") appear to have the same meaning contribution in both freestanding assertions (e.g., "Lying is wrong") and embedded occurrences within complex syntactic and logical environments. This sameness of meaning is evidenced by the intuitive validity of inferences like:
          *   Premise 1: Lying is wrong.
          *   Premise 2: If lying is wrong, then telling your brother to lie is wrong.
          *   Conclusion: Therefore, telling your brother to lie is wrong.
          This inference pattern (modus ponens) relies on the predicate "wrong" meaning the same in all three occurrences.

      2.  **Inventory of Embedding Environments & Success Conditions:** A successful semantic account must compositionally explain the contribution of moral sentences embedded within the following environments, delivering the specified outputs:
          *   **Negation (e.g., "Lying is not wrong"):** Must deliver a content that stands in the appropriate logical (e.g., contradictory) relation to the content of the unnegated sentence.
          *   **Disjunction (e.g., "Either lying is wrong or stealing is wrong"):** Must deliver a content that stands in the appropriate logical (e.g., truth-functional) relation to the disjuncts.
          *   **Conditionals:**
              *   **Antecedent (e.g., "If lying is wrong, then...")**: Must deliver a content suitable for licensing conditional reasoning (e.g., modus ponens, modus tollens).
              *   **Consequent (e.g., "...then lying is wrong"):** Must deliver a content that functions as the conditional's outcome.
          *   **Modal Operators (e.g., "Necessarily, lying is wrong", "Possibly, lying is not wrong"):** Must deliver a content that modal operators can coherently apply to.
          *   **Probabilistic Operators (e.g., "It is likely that lying is wrong"):** Must deliver a content that can coherently be assigned a probability.
          *   **Tense (e.g., "Slavery was wrong"):** Must deliver a content that can coherently be temporally located.
          *   **Interrogatives (e.g., "Is lying wrong?")**: Must deliver a content suitable for being the object of a question.
          *   **Imperatives (e.g., "Don't lie, because lying is wrong" - embedding the indicative clause):** Must deliver a content that can coherently function as a reason within an imperative.
          *   **Propositional Attitude Ascriptions (e.g., "Sam believes that lying is wrong"):** Must deliver a content suitable for being the object of a belief.
          *   **Speech Act Ascriptions (e.g., "Sam asserted that lying is wrong"):** Must deliver a content suitable for being asserted.
          *   **Anaphoric Truth Attribution (e.g., Sam: "Lying is wrong." Alex: "That's true."):** Must deliver a content that can coherently be called "true".
          *   **Factive Constructions (e.g., "Sam knows that lying is wrong"):** Must deliver a content suitable for being known (presupposing its truth).
          *   **Explanatory Constructions (e.g., "Sam apologized because he knew lying was wrong"):** Must deliver a content suitable for playing a causal/explanatory role.

      3.  **Minimalist Framework:** Both parties accept a minimalist/deflationary account of 'truth', 'truth-aptness', 'proposition', and 'belief'. Consequently, the mere fact that moral sentences *can* be embedded in truth-demanding environments, called 'true', said to express propositions, or be objects of belief, does *not*, by itself, settle the debate in favor of cognitivism. These features are granted as part of the linguistic data any adequate theory must accommodate.

      4.  **Success Conditions:**
          *   **QE Success:** Demonstrating that the states expressed by freestanding moral judgments (characterized non-cognitively, e.g., as conative attitudes) can be systematically composed and manipulated (e.g., negated, disjoined, conditionalized) in a way that mirrors the logical relations and inferential roles captured in claims 1.1 and 1.2, using only resources that do not presuppose robust representational content or truth-conditions. Success involves showing the compositional system *generates* the logical behavior.
          *   **CR Success:** Demonstrating that moral sentences possess genuine, non-deflationary truth-conditions (grounded in stance-independent moral properties/facts) that compositionally determine their semantic contribution in all the environments listed in 1.2, providing a unified and straightforward explanation of their logical behavior and inferential relations without needing to invoke distinct non-cognitive attitudes as the primary semantic relata. Success involves showing the compositional system *follows from* the nature of the truth-conditional content.

  **2. Residual Disagreements:**

  | Issue | Expressivist (QE) Formulation | Cognitivist (CR) Formulation | Crux |
  | :--- | :--- | :--- | :--- |
  | **Semantic Value** | The primary semantic value of a moral sentence is the non-cognitive mental state (e.g., a plan, commitment, or conative attitude like disapproval) it conventionally expresses in freestanding use. Its truth-aptness and propositionality are minimal, derived features explained by the compositional system governing these states. | The primary semantic value of a moral sentence is its objective, stance-independent truth-condition (representing a moral fact/property). Its expression of attitudes is a pragmatic consequence of its core representational semantic content. | Nature of semantic primacy (attitude vs. truth-condition). |
  | **Meaning Constraint** | Sameness of meaning across freestanding and embedded uses is *not* a pre-theoretical constraint requiring the same semantic object (e.g., a proposition) in all contexts. It is the *explanandum*: the compositional system for attitudes *must produce* the *appearance* and *functional equivalence* of sameness required for valid inference. | Sameness of meaning across freestanding and embedded uses *is* a fundamental constraint requiring a unified semantic object (a proposition with truth-conditions) that retains its identity and contributes uniformly across all syntactic contexts. | Whether meaning sameness requires propositional identity or just functional equivalence. |
  | **Expressivist "Semantics"** | The expressivist account provides a *genuine semantics*: it systematically assigns compositional significance (roles in inferential practices, contributions to complex state expression) to moral vocabulary and sentence structures, explaining their logical behavior without invoking truth-conditions as fundamental. It is not merely a paraphrase of surface forms. | The expressivist account, while potentially capturing surface inferential patterns, functions primarily as a *paraphrase strategy* for complex embeddings. It does not provide a compositional semantics in the standard sense of assigning semantic values that compositionally determine truth-conditions (even minimal ones) for complex sentences. | Whether compositional rules governing attitudes constitute a semantics or a pragmatic/logical paraphrase. |
  | **Work of Truth-Aptness** | Minimalist truth-aptness does no significant work beyond capturing grammatical features and enabling the use of logical vocabulary like "true"/"false". The substantive explanatory work for logical relations and inferences is done by the compositional system governing the non-cognitive states. | Minimalist truth-aptness, while capturing surface grammar, does not exhaust the semantic role. The *robust* truth-aptness grounded in non-natural properties/facts does essential work: it explains the *objective correctness conditions* of moral judgments and provides the *direct* foundation for their logical relations and inferential roles within a truth-conditional semantics. | Whether minimalist truth suffices for explaining logic/inference or robust truth-conditions are required. |

  **3. Cruxes, Cases, and Predictions:**

  | Crux | Case | Expressivist (QE) Prediction | Cognitivist (CR) Prediction |
  | :--- | :--- | :--- | :--- |
  | **The Negation Problem:** Is the state expressed by "Lying is not wrong" (a) merely the *absence* of disapproval of lying, or (b) a *distinct positive attitude* (e.g., tolerance, permission)? If (b), towards what is it directed? | **Agent Case:** Consider an agent, Alex. QE analysis assigns to Alex's acceptance of "Lying is not wrong" either (a) absence of disapproval, or (b) a distinct positive attitude (e.g., being for not blaming for lying). We find Alex who sincerely assents to "Lying is not wrong", can competently use it in all relevant embeddings (e.g., conditionals, disjunctions), but reports *no conative attitude whatsoever* towards lying (not disapproval, not tolerance, not permission, indifference, etc.). Alex reports only a cognitive state: believing that lying lacks the property of wrongness. | **QE Predicts:** This case is conceptually incoherent or empirically impossible. Competent acceptance of "Lying is not wrong" *just is* being in the relevant non-cognitive state (absence or distinct attitude). Reporting no such attitude while competently using the sentence reveals misunderstanding or insincerity. Competent moral vocabulary use necessitates the relevant conative attitudes. | **CR Predicts:** This case is coherent and possible. Alex understands that "wrong" predicates a property, and "not wrong" denies that property holds. Alex's belief about the absence of the property is sufficient for competent use and embedding. The absence of a conative attitude is irrelevant to semantic competence; expression of attitude is contingent/pragmatic. |
  | **Practicality Constraint:** Is there a distinct "practicality" datum (that sincere moral judgment is intrinsically motivating/practical) that a semantic theory *must* explain, and which favors expressivism? | **Inference Denier Case:** Consider an agent, Sam, who sincerely asserts both premises of the modus ponens argument: "Lying is wrong" and "If lying is wrong, then telling your brother to lie is wrong". Sam is fully logically competent. Yet, Sam sincerely denies the conclusion: "Telling your brother to lie is *not* wrong". Sam experiences no motivational conflict or sense of irrationality. | **QE Predicts:** This case reveals severe conceptual confusion or irrationality regarding the meaning of "wrong" or the conditional. Sincere acceptance of the premises *constitutively involves* motivational states that, given the logic of the compositional system for attitudes, *entail* motivation against telling one's brother to lie. Denying the conclusion while sincerely accepting the premises is practically inconsistent. | **CR Predicts:** This case, while logically inconsistent, is conceptually possible regarding motivation. Logical error doesn't imply semantic misunderstanding. Sam might believe the premises (have the cognitive states) but suffer from extreme weakness of will, psychosis, or have bizarre contingent desires overriding his moral belief. The practicality of judgment is not intrinsic to its semantic content. |
  | **Minimalism Collapse:** Does the expressivist's use of minimalist truth/proposition/belief, combined with compositional success, render the dispute with cognitivism merely verbal? | **Disagreement Case:** Two speakers, Taylor and Jordan. Taylor asserts "Lying is always wrong". Jordan asserts "Lying is not always wrong". Both possess the conative attitudes QE assigns to these sentences. Both also possess the cognitive beliefs (minimal) that lying is always wrong / not always wrong. | **QE Predicts:** The core disagreement is constituted by the conflict in their conative attitudes (e.g., disapproval vs. permissibility). The minimal beliefs are a shadow cast by this practical conflict. The dispute is substantive (attitude clash), not merely verbal. | **CR Predicts:** The core disagreement is constituted by the conflict in their cognitive beliefs about the objective moral status of lying. The conative attitudes are contingent consequences. The dispute is substantive (factual clash). **Both agree:** If the *only* difference were the labels ("attitude" vs. "belief") applied to the *same underlying state*, the dispute would be verbal. But both deny this is the case; they posit fundamentally different primitives (conative vs. cognitive). |
  | **Minimalism Collapse (Embedding):** | **Asserted vs. Unasserted Case:** Consider the sentence "Lying is wrong". Compare its occurrence in two contexts: (A) Freestanding assertion: "Lying is wrong. Don't do it!" (B) Unasserted antecedent of a conditional: "If lying is wrong, then getting your friend to lie is also wrong." | **QE Predicts:** The semantic contribution in (B) is fundamentally different in kind from (A): In (A) the state is *expressed*, in (B) it is *hypothesized* or *considered* within the compositional system. Minimal truth/proposition applies uniformly, but the underlying state-relation differs. | **CR Predicts:** The semantic contribution (truth-condition of the proposition <lying is wrong>) is identical in (A) and (B). The difference is purely pragmatic: in (A) the proposition is asserted, in (B) it is unasserted but contributes its truth-condition to the conditional. |

  **4. The Question of Verbal Dispute:**

  Both parties agree that the dispute is *not* entirely verbal. The core disagreement concerns the fundamental nature of the mental state primarily expressed by a freestanding moral judgment and its role in grounding meaning and logic. QE posits a non-cognitive conative state as primary and constructs minimal cognitive notions (truth, proposition, belief) on top of a compositional system for these states. CR posits a cognitive representational state (belief with robust truth-condition) as primary and explains the expression of conative attitudes as a pragmatic consequence.

  The potential for a *partially* verbal dispute arises in two areas:
  1.  **"Belief":** If "moral belief" is understood minimally (as whatever state plays the functional role licensed by minimalist truth-aptness, including within QE's system), then both sides agree moral sentences express beliefs. However, they disagree profoundly on whether this state is fundamentally cognitive (CR) or conative (QE) *underneath* the minimal label. This disagreement is substantive.
  2.  **"Truth-Condition":** If "truth-condition" is understood minimally (as whatever fulfills the disquotational schema and enables embedding), QE grants moral sentences have truth-conditions. However, CR insists on a robust, representational, stance-independent notion of truth-condition grounded in non-natural properties. QE denies sentences have truth-conditions in *this* robust sense. The disagreement over the *nature* of the truth-condition (minimal vs. robust) is substantive.

  **5. Closing: Evidence and Limits**

  *   **What Would Falsify QE View?**
      *   Empirical demonstration of an agent like the one in the **Negation Problem Case** (competent use without conative attitude).
      *   Demonstrating that the compositional system for attitudes *cannot* systematically generate the full range of logical relations (especially for complex embeddings like nested conditionals or probabilistic operators) without covertly smuggling in truth-conditional structure.
      *   Showing that the practicality of moral judgment is *not* intrinsic but entirely contingent, aligning perfectly with CR's predictions in cases like the **Inference Denier**.
  *   **What Would Falsify CR View?**
      *   Demonstrating that the robust truth-conditions CR posits are explanatorily inert or redundant for explaining moral logic and inference, once minimalist truth and the compositional system for attitudes (QE) is in place.
      *   Showing that the connection between moral judgment and motivation is *stronger* and *more intrinsic* than CR's pragmatics can explain (e.g., cases of amoralists or counter-motivated agents are impossible, not just rare).
      *   A successful, naturalistic reduction of moral properties/facts that CR rejects, undermining the non-naturalist foundation (though CR could potentially shift to naturalist realism).
  *   **What Would Not Move Either?**
      *   **The Embedding Data Alone:** Both agree their theories must explain it. Pointing out that embedding occurs doesn't favor one view; the debate is about *how* it is explained.
      *   **Minimal Truth-Aptness:** Both grant it. Insisting moral sentences are "truth-apt" or "express propositions" in the minimal sense does not challenge QE.
      *   **Intuitions about "Objectivity":** Both claim to capture important aspects of objectivity (QE quasi-realistically, CR robustly). Mere appeals to "It feels objective" are insufficient without further specification.
  *   **The Core Substantive Disagreement:** Both parties conclude that the fundamental divergence lies in the **nature of the primary mental state constitutive of moral judgment** (conative attitude vs. cognitive belief with robust truth-condition) and the **order of explanation** (attitudes + composition explaining logic vs. truth-conditions explaining logic + pragmatics explaining attitudes). While minimalist concessions narrow the gap, they do not eliminate this deep difference in explanatory primacy and the metaphysics of mind and meaning it implies. The dispute remains substantive.
