  Okay, the user is designing a pedagogical activity for an upper-level undergraduate seminar on medieval ethics, specifically focusing on Aquinas' nuanced view on tyrannicide. They want students to experience the practical tension between legitimate resistance and sedition—not through abstract discussion but through a simulation. 

  The user's constraints reveal a sophisticated understanding of common pedagogical pitfalls: avoiding historical shortcuts, embedding mechanics that make theoretical concepts tangible, and creating roles with genuine moral complexity. I need to design an activity where the rules themselves force players into Aquinas' "squeeze" without naming it upfront.

  For the setting, I'll invent a fictional city-state ("Arcadia") to prevent historical baggage. The key mechanics will include:
  - A decaying public authorization system (to embody scarcity of legitimacy)
  - Compounding crisis tokens (to make delay costly)
  - Private grievance cards (to force distinction between self-interest and common good)
  - One role benefiting from tyranny (to complicate moral calculus)

  The debrief must anchor in the specified Aquinas quote. I'll map game moments to its three elements: disturbance legitimacy, "inordinateness" risk, and the ruler-as-seditious reversal. The unresolved practical question—how to judge inordinateness in advance—will be the debrief's climax.

  Potential issues I anticipate: students might oversimplify roles into heroes/villains, or the compounding crises could overwhelm gameplay. I'll build in mitigation tactics like role-specific victory conditions and facilitator discretion on crisis escalation. The activity can't replicate Aquinas' theological framework, so I'll note where supplemental context is needed post-game.

  The core challenge is making abstract ethical constraints feel mechanically inevitable. For example, the "Authorization Die" mechanic makes legitimacy scarce and fragile—players must use it but risk depleting it, mirroring Aquinas' warning about disturbances becoming excessive. Similarly, the crisis tracker makes patience actively dangerous, countering the quietist misinterpretation.

  For the "squeeze" moment: it should emerge when players realize that even justified actions risk mirroring the tyrant's disorder if they bypass authorization or escalate hastily. The Mediator's role is crucial here—their self-interest in stability creates tension with the liberation faction, forcing the group to confront whether their cure might be deadlier than the disease.
answer: |-
  ## Aquinas' Tyranny Dilemma: An In-Class Simulation

  **Overview** (145 words)  
  This 75-minute simulation immerses students in the dilemma of resisting tyranny within Aquinas' framework. Set in the fictional city-state of Arcadia, ruled by the increasingly oppressive Duke Silas, players represent key citizens with private grievances and a shared public crisis: the Duke plans to seize the vital Commons for his private guard. Students must decide whether/how to act collectively against this act, navigating scarce legitimate authorization (the City Charter), escalating costs of delay (a visible "Crisis Tracker"), and personal stakes. The goal is to experience the tension between justified resistance and the risk of becoming agents of greater disorder ("inordinate disturbance"). Players win by preserving Arcadia’s common good, defined as preventing the Commons seizure *without* triggering civil strife or economic collapse. No prior Aquinas discussion occurs.

  **Setup and Materials** (240 words)  
  *   **Room Setup:** Arrange chairs in a circle. Place a central "Council Table" with:  
      *   A large "Crisis Tracker" poster (0-10 scale; start at 2).  
      *   Three "Authorization Tokens" (distinctive coins/chips).  
      *   The "City Charter" (a single, ornate document or card).  
      *   A six-sided "Authorization Die."  
  *   **Player Materials:**  
      *   **Role Sheets (14-16):** Detailed descriptions (see Roles section).  
      *   **Private Grievance Cards (1 per player):** Secret specifics (e.g., "Duke seized your prize mare 'for state security'"; "Duke imprisoned your cousin for 'seditionous gossip'"; "Duke's new tax forced you to sell heirlooms").  
      *   **Common Good Objective Card (1 per player):** "Prevent the Duke from seizing the Commons for his guard. Avoid triggering Civil Strife (Crisis 8+) or Economic Collapse (Crisis 10)."  
      *   **Action Tokens (2 per player):** Generic markers.  
  *   **Facilitator Materials:** Timer, Crisis Tracker markers, list of "Crisis Events" keyed to tracker levels (e.g., Level 4: "Rumors spread Duke will raise grain tax to fund guard"; Level 6: "Merchant caravans avoid Arcadia, prices rise"; Level 8: "Clashes reported between citizens and guards in the market"), Rules summary sheet.

  **Roles** (380 words)  
  Assign roles ensuring mix. Each role has: Name, Occupation, Key Motivation, Private Grievance (known only to them initially), and a subtle mechanical quirk influencing authorization or crisis.  

  1.  **Elder Miriam (Guildmaster - Weavers):** Motivated by stability & tradition. Grievance: Duke disbanded Weavers' traditional festival. *Quirk:* Can spend an Action Token to reroll the Authorization Die ONCE per game. *(Prefers reform over removal)*
  2.  **Captain Brennus (City Watch Commander):** Bound by oath, fears chaos. Grievance: Duke publicly humiliated him over minor security lapse. *Quirk:* If he authorizes an action, it adds +1 *temporarily* to Crisis level (mobilization looks like unrest). *(Needs strong authorization to act)*
  3.  **Sister Anya (Hospitaller Order):** Dedicated to aiding the poor/sick. Grievance: Duke requisitioned hospice medicines for his guard. *Quirk:* Can spend an Action Token to *reduce* Crisis level by 1 after an action (charity soothes unrest). *(Fears harm to vulnerable)*
  4.  **Master Faran (Merchant Magnate):** Focused on trade, hates disruption. Grievance: Duke extorted a large "loan" never repaid. *Quirk:* If Crisis reaches 5+, loses 1 Action Token (business suffers). *(Wants Duke checked, but alive to repay "loan")*
  5.  **Elara (Young Noble):** Idealistic, seeks justice. Grievance: Duke blocked her inheritance unjustly. *Quirk:* Gains +1 Action Token if she publicly reveals her grievance during a plea. *(Impatient for action)*
  6.  **Brother Tomas (Monastic Scribe):** Keeper of records/laws. Grievance: Duke burned archives challenging his lineage. *Quirk:* Holds the City Charter initially; must physically hand it over for authorization. *(Custodian of legitimacy)*
  7.  **Rhys (Master Builder):** Pragmatic, community-focused. Grievance: Duke conscripted his apprentices into guard. *Quirk:* Can propose building a "symbol of unity" (costs 1 group Action Token) to reduce Crisis by 2. *(Seeks tangible solutions)*
  8.  **Kaelen (Head Farmer):** Feeds the city, distrusts authority. Grievance: Duke's men raided his stores without payment. *Quirk:* If Crisis >=7, he *must* spend 1 Action Token next turn guarding his farm, unavailable for group action. *(Driven by immediate survival)*
  9.  **Liana (Spy?/Informant?):** Ambiguous loyalty, seeks advantage. Grievance: Duke threatened her family. *Quirk:* Can spend an Action Token to secretly learn another player's grievance OR the next Crisis Event. *(Self-preservation paramount)*
  10. **The Remaining 5-7 Roles:** Variants of Citizens (e.g., Baker, Blacksmith, Lesser Noble, Student, Widow) with unique grievances and standard 2 Action Tokens. Ensure at least one has a grievance easily framed as petty/selfish.

  **Rules and Payoffs** (480 words)  
  *   **Objective:** Prevent Commons Seizure. Avoid Crisis 8+ (Civil Strife) or 10 (Collapse). Players win or lose as a group.
  *   **Turns:** Game lasts 8 rounds (approx. 7 mins each). Each round:
      1.  **Crisis Update (1 min):** Facilitator advances Crisis Tracker by 1 (inescapable cost of time). If tracker hits a pre-set event level, facilitator reads the event aloud (e.g., "Level 4: Grain Tax Rumors Spread - Morale dips").
      2.  **Action Phase (5 mins):** Players discuss and propose actions. To *do* anything beyond talk requires:
          *   **Action Tokens:** Each player contributes tokens to the pool. Cost depends on action (e.g., Draft Protest Letter: 2 tokens; Send Delegation to Duke: 3 tokens; Organize Public Rally: 4 tokens; Plan Covert Action: 5 tokens). Tokens spent are gone.
          *   **Authorization:** For any action targeting the Duke *directly* (Delegation, Rally, Covert Action), the City Charter must be placed on the action AND the "Authorization Die" must be rolled by the Charter holder *after* tokens are spent. Roll 4-6: Action succeeds as planned. Roll 1-3: Action fails OR succeeds but triggers an immediate +2 Crisis (inordinate disturbance!). Authorization Tokens (3 total) can be spent *before* the roll to add +1 per token to the die result (representing marshaling legitimacy). Authorization Tokens are scarce public resources.
      3.  **Resolution (1 min):** Resolve actions, adjust Crisis if needed based on results/quirks.
  *   **Private Grievances:** Players may reveal their grievance publicly at any time. Doing so gains them 1 Personal Victory Point (PVP) but costs the group 1 Action Token (focus shifts from common good). *Successfully* addressing a grievance through a group action (e.g., demanding return of seized property during a delegation) grants 2 PVP. PVP are individual, separate from group win/loss.
  *   **Duke's Response:** Any direct action (Delegation/Rally/Covert) triggers a hidden facilitator roll *after* resolution: 1-2: Duke escalates (e.g., arrests delegate, increases guard, +1 Crisis); 3-4: Duke stalls/ignores; 5-6: Duke backs down slightly (e.g., delays seizure plan, Crisis -1). Covert Actions have higher escalation chance.
  *   **Winning:** Group wins if the Commons Seizure is prevented (Duke backs down permanently OR is deposed without triggering Collapse/Strife) by end of Round 8. Individuals also track PVP. Group loses if Seizure occurs or Crisis hits 10. Crisis 8+ is a Pyrrhic/ambiguous loss ("You stopped the seizure but Arcadia burns").

  **Run of Play** (360 words)  
  *   **Min 0-5:** Distribute roles, grievance cards, tokens, rules summary. Emphasize group goal & secret grievances. Brother Tomas holds Charter. Start Crisis at 2. *NO LECTURE.*  
  *   **Min 5-12 (Round 1):** Crisis->3. Players introduce themselves (role only). Initial panic/ideas. Likely low-token talk: "We must do something!" Elder Miriam urges caution. Kaelen worries about food. Liana seems shifty.  
  *   **Min 12-19 (Round 2):** Crisis->4. Event: "Grain Tax Rumors Spread." Urgency spikes. First action proposed (e.g., Draft Protest Letter, Cost 2 tokens). No auth needed. Succeeds. Minor morale boost? Duke Response: Ignores (roll 3-4).  
  *   **Min 19-26 (Round 3):** Crisis->5. Event: "Merchant Caravans Avoid Arcadia." Master Faran loses 1 token (Quirk). Pushes for stronger action (Delegation? Cost 3 tokens + Auth). Debate: Who goes? Who holds Charter? Elara reveals grievance for +1 token. Action cost effectively 2 now? Spend Auth? Roll Auth Die: 2! Failure/+2 Crisis? Spend 1 Auth Token? Die becomes 3 -> Still fail? Crisis jumps to 7! Kaelen now *must* guard farm next round.  
  *   **Min 26-33 (Round 4):** Crisis->8! Event: "Clashes in Market! Civil Strife Begins." Kaelen uses token guarding farm (unavailable). Panic. Sister Anya pushes for charity action (her quirk) to reduce Crisis. Cost? Rhys proposes "Symbol of Unity." Intense debate: Address crisis *or* still target Duke? Can they afford both?  
  *   **Min 33-54 (Rounds 5-7):** Escalating stakes. Likely attempts at Rally or Covert Action requiring high tokens and risky Auth rolls. Personal grievances revealed for tokens/PVP, costing group resources. Captain Brennus agonizes over using Watch. Liana uses info. Duke responses create chaos. Crisis fluctuates wildly near 8-9.  
  *   **Min 54-65 (Round 8):** Last chance. Desperate measures or resigned despair. Final actions/resolutions.  
  *   **Min 65-75:** Transition to Debrief. Announce outcome (win/loss) based on final state.

  **The Squeeze** (180 words)  
  The squeeze emerges viscerally in two key moments:  
  1.  **The Failed Authorized Action (e.g., Round 3):** Players pool precious Action Tokens (private effort) and risk scarce Authorization Tokens (public legitimacy) for a legitimate appeal (Delegation). The Auth Die roll *fails anyway*, forcing them to either accept failure or spend even more public resources (Auth Tokens) to barely avoid catastrophe, spiking Crisis. They followed the "rules" and still nearly caused disaster. The cost of legitimacy and the risk of disturbance are *felt* mechanically.  
  2.  **The Civil Strife Tipping Point (Crisis 8+):** Once Crisis hits 8, the *mechanics* change: Kaelen is forced into self-preservation, Rhys/Anya's mitigation powers become crucial but costly, and the group objective shifts from merely stopping the Duke to desperately preventing total collapse. Their earlier actions (even authorized ones) contributed to this chaos. Now, *any* further action against the Duke (especially without flawless authorization) risks immediate loss, yet inaction guarantees the Commons seizure. They are trapped between the Duke's oppression and the chaos their resistance has unleashed – mirroring the structural position of sedition through the game's own economy of action, tokens, and crisis.

  **Debrief** (480 words)  
  1.  **Reveal Aquinas:** "What you grappled with mirrors a complex argument by Thomas Aquinas about resisting tyranny." Display the quote: *"Consequently there is no sedition in disturbing a government of this kind, unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government."*  
  2.  **Map the Mechanics to the Text:**  
      *   *Disturbing a government of this kind:* "Remember your Delegation or Rally proposals? Aquinas argues such disturbance isn't inherently seditious." Ask when they felt disturbance was justified. (Link to their early grievances/Crisis 4 event).  
      *   *Unless disturbed so inordinately... greater harm:* "When did your actions risk becoming 'inordinate'? What was the mechanic representing 'greater harm'?" (Point to Crisis Tracker, especially jumps to 8+). Highlight the *Failed Auth Roll + Crisis Spike* moment. "Aquinas sets this as the critical boundary."  
      *   *The Tyrant is Seditious:* "Aquinas adds the tyrant is *truly* seditious for fostering discord. How did the *Duke's Response* mechanic mimic this?" (e.g., arresting delegates after a delegation, escalating after a rally – he turns their legitimate actions into pretexts for worse oppression).  
  3.  **The Authorization Condition:** "Aquinas implies a framework for legitimate disturbance (e.g., public authority, just cause). How did our 'Authorization' mechanics (Charter, Tokens, Die) model the scarcity and fragility of *public* legitimacy versus *private* initiative (Action Tokens, revealing grievances)? Was it clear when an action was 'authorized' enough?" Emphasize how the rules made this tangible and fraught.  
  4.  **The Unsettling Practical Question:** "Aquinas gives us the principle: Don't cause worse disorder. But the agonizing question our simulation forced upon us, and that he doesn't neatly answer, is: **How could you possibly know *in advance* if your disturbance would become 'inordinate'?** You authorized a delegation... and it backfired spectacularly, pushing Arcadia towards strife. What resources *did* you have in the moment to judge that risk? Was it just the die roll? Or could you assess the Duke's likely reaction? The city's fragility? The strength of your own legitimacy?" Press them on the uncertainty they experienced. "If that judgment is impossible to make reliably under pressure, what does that mean for the possibility of *justified* action against a tyrant? Does it push towards paralysis, or reckless action? How did the compounding Crisis affect your ability to judge?" Connect this directly to moments of paralysis or reckless gambles in the game.  
  5.  **Connect to Grievances:** "How did the option to act on your *Private Grievance* (for PVP) complicate judging the *Common Good*? Did it make actions feel more or less legitimate? More or less risky?" Link this to Aquinas' focus on the *common* good as the benchmark.

  **Predictable Problems & Solutions** (280 words)  
  *   **Problem: Analysis Paralysis Early On.** Students talk endlessly, avoid spending tokens.  
      *   *Solution:* Strictly enforce the 5-minute Action Phase. Remind them Crisis rises *every* round regardless. After Round 2, point to the rising tracker: "The Duke isn't waiting."  
  *   **Problem: Misunderstanding Authorization.** Confusion over when Auth/Die is needed.  
      *   *Solution:* State clearly during setup: "ANY action *directly targeting the Duke's rule* (asking him to stop, protesting him, acting against him) needs the Charter AND the die roll. Talking *about* him or doing other things (charity, building) does not." Have a cheat sheet.  
  *   **Problem: Liana/"Villain" Role Disrupts Gameplay.** Player hogs attention or acts purely chaotically.  
      *   *Solution:* Remind Liana *quietly* their goal includes group survival (they lose too at Crisis 10). Frame their actions as self-preservation, not villainy. Emphasize PVP as motivation.  
  *   **Problem: Failed Auth Roll Stalls Game.** Group becomes fatalistic after early failure/crisis spike.  
      *   *Solution:* Highlight mitigation options (Sister Anya, Rhys). Remind them the Duke *can* back down sometimes. Point out later actions might have lower thresholds. "The crisis is bad, but not lost yet."  
  *   **Problem: Group Easily "Wins" or Avoids Crisis.** Dice rolls are lucky, Duke backs down early.  
      *   *Solution:* Facilitator can fudge Duke Response rolls *slightly* towards escalation if needed (be subtle!). Emphasize the *cost* of their win (Tokens spent? PVP sacrificed? Legitimacy depleted?). Ask in debrief: "Would this approach work against a *worse* tyrant? What risks did you barely avoid?"  
  *   **Problem: Time Overrun.**  
      *   *Solution:* Be ruthless with round timings. Skip final crisis events if needed. Cut Round 8 short if resolution is clear.

  **What the Activity Cannot Reproduce** (230 words)  
  This simulation effectively models the *practical and structural squeeze* – the scarcity of legitimacy, the cost of delay, the risk of inordinate disturbance, and the ambiguity between resistance and sedition. However, it cannot fully replicate:  

  1.  **Aquinas' Theological Framework:** The activity abstracts away the divine foundation of law, natural law theory, the role of the *princeps* as God's minister (even when failing), and the ultimate grounding of authority in the common good *as ordained by God*. The "City Charter" is a weak stand-in for this profound theological context.  
  2.  **The Hierarchy of Remedies:** Aquinas explicitly prioritizes recourse to a higher authority (e.g., Emperor, Pope) before direct action by subjects. The simulation lacks this external hierarchy, focusing solely on internal legitimacy.  
  3.  **The Sinfulness of Sedition:** The game models sedition structurally (causing excessive disorder) but cannot convey the *moral weight* Aquinas assigns it as a sin against charity and the unity of the people. The loss condition is practical, not spiritual.  
  4.  **The Depth of Prudence (*Prudentia*):** Aquinas' solution hinges on the virtue of prudence – the near-impossible practical wisdom to judge the specific circumstances. The game uses dice and facilitator fiat to simulate uncertainty, but prudence is a deep habit of judgment cultivated over time, not a game mechanic.  

  **You will need to explicitly connect** the experiential "squeeze" of the game back to these deeper Thomistic concepts during the debrief and subsequent lectures, emphasizing how the practical dilemma arises *within* this specific theological and philosophical framework. Highlight that for Aquinas, the licitness of disturbance exists *despite* the tyrant holding office by divine permission, making the judgment even more fraught.
