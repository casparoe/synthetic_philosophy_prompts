answer: |-
  ### Exam Question  
  **Philosophy of Medicine Final Examination**  
  **Time Allowed: 75 minutes**  

  **Case:** Subclinical dysregulation (SD) is a biomarker profile meeting three criteria:  
  1. Statistically rare in the population.  
  2. Caused by a mechanism that reduces the organism’s *capacity to maintain homeostasis under stress*.  
  3. Causes no present pain, disability, or distress.  
  Longitudinal data show 30% of individuals with SD develop serious disease within 10 years; 70% do not. An intervention normalizes biomarkers and reduces risk but has side effects and high costs. A health system must decide whether to classify SD as a **disease** for insurance coverage, research funding, and stigma management.  

  **Distinctions:**  
  - A condition is **constitutive** if it *is* a current biological dysfunction.  
  - A condition is **prognostic** if it is a statistically defined risk state predicting *future* dysfunction but not constituting current dysfunction.  

  **Question:**  
  1. Would SD qualify as a disease under the strongest naturalist theory (disease = biological dysfunction) and the strongest normativist theory (disease = harmful condition constituted by social values)? Explain why or why not. (*4 marks*)  
  2. How does the *constitutive/prognostic distinction* challenge both naturalism and normativism in this case? (*4 marks*)  
  3. Propose and defend a *criterion or decision procedure* to determine whether SD should be classified as a disease. Do not merely stipulate a definition; justify how your approach resolves ambiguities. (*6 marks*)  
  4. Is the disagreement about SD *substantive* (reflecting incompatible values) or *verbal* (resolvable by clarifying terms)? What does this case reveal about the limits of the naturalism/normativism debate? (*6 marks*)  

  ---

  ### Model Answer (720 words)  

  **1. Naturalism and Normativism on SD**  
  Under naturalism, SD is **not a disease**. Naturalism defines disease as *current* biological dysfunction (e.g., Boorse’s biostatistical theory). SD lacks constitutive dysfunction: while it reduces *future* adaptive capacity, it causes no present functional impairment in the organism’s species-typical hierarchy of goals (e.g., survival, reproduction). The statistical rarity of biomarkers alone does not suffice; dysfunction requires failure of an organ’s *current* function. Normativism, conversely, would classify SD as a disease **only if social values deem the predictive harm sufficient**. The 30% risk of future disease is a probabilistic harm (e.g., anxiety, resource allocation), but normativists diverge: some argue harm must be *actual*, while others include statistically significant risk. Without present suffering, normativism faces a dilemma: is predictive risk intrinsically harmful, or does harm require manifestation?  

  **2. Pressure from the Constitutive/Prognostic Distinction**  
  The distinction destabilizes both theories. For naturalism, SD exposes ambiguity in “dysfunction.” If dysfunction is defined statistically (deviation from typical functioning), SD qualifies—but this conflates *correlates* of dysfunction with dysfunction itself. Naturalism struggles to ground “dysfunction” in SD: the reduced *capacity* under stress is prognostic, not constitutive, making it a *risk* rather than a *failure*. This risks pathologizing benign traits (e.g., high genetic risk for cancer absent pathology). For normativism, SD forces clarification of “harm.” If harm requires experience (e.g., pain), SD is not harmful. If harm includes probabilistic risk, normativism must explain why 30% risk justifies disease status while 0.1% does not—inviting arbitrariness. The prognostic nature of SD thus challenges naturalism’s objectivity and normativism’s reliance on value-laden harm.  

  **3. Proposed Criterion: Adaptive Capacity Threshold**  
  I propose classifying SD as a disease **iff it reduces species-typical adaptive capacity below a critical threshold**, operationalized via two criteria:  
  - **Biological**: The condition must arise from a mechanism that disrupts a homeostatic *process essential to stress-response* (e.g., cortisol regulation).  
  - **Probabilistic**: The condition must elevate absolute risk of severe disease by ≥25% within a species-typical lifespan.  
  This resolves ambiguity by tying “dysfunction” to *impaired resilience* rather than immediate failure. SD meets both: its mechanism directly undermines homeostasis, and 30% risk exceeds the threshold. Unlike naturalism, this accepts that dysfunction can be latent; unlike normativism, it anchors harm in biological vulnerability, not subjective values. Critics might argue the 25% threshold is arbitrary, but it reflects real-world clinical thresholds (e.g., statin prescriptions for 10-year CVD risk >20%). This approach avoids stipulation by deriving disease status from the *magnitude of vulnerability*, balancing biological reality with practical consequences.  

  **4. Substantive Disagreement and Limits of the Debate**  
  The dispute is **substantive**, reflecting incompatible views of medicine’s goals. Naturalists prioritize biological integrity; normativists prioritize well-being. SD reveals that both theories falter when biological deviation and harm are decoupled. Naturalism cannot adjudicate whether latent risk *is* dysfunction, while normativism cannot objectively define “significant” harm. This case shows the naturalism/normativism debate is **incomplete**: it ignores *temporality* (risk vs. manifestation) and *scale* (individual vs. population). A hybrid view is needed—one where disease status depends on *probabilistic dysfunction* (objective likelihood of future failure) weighted by *social burden* (costs of intervention vs. inaction). Here, classifying SD as a disease is defensible not because it fits a definition, but because it meets a burden threshold: the intervention’s benefits (30% absolute risk reduction) outweigh costs/side effects for a defined population. The debate’s limits lie in its binary framing; medicine requires a framework for *graded* pathology.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  | **Criterion**                                                                 | **Marks** | **Common Errors**                                  |
  |-------------------------------------------------------------------------------|-----------|---------------------------------------------------|
  | **1a.** Correctly identifies SD as *not* a disease under naturalism.          | 2         | Misses lack of *current* dysfunction.             |
  | **1b.** Correctly identifies normativism’s *conditional* stance on SD.        | 2         | Assumes normativism always calls SD a disease.    |
  | **2.** Explains how prognostic nature challenges *both* theories’ core tenets. | 4         | Only critiques one theory; ignores ambiguity.     |
  | **3.** Proposes a non-stipulative criterion and defends it against SD.        | 6         | Stipulates a definition without justification.    |
  | **4a.** Judges disagreement as substantive and identifies limits of debate.   | 4         | Calls it verbal; fails to note temporality/scale. |
  | **4b.** Links case to practical implications (e.g., graded pathology).        | 2         | Omits real-world consequences.                    |  

  **A vs. B Answer Differentiation:**  
  - **A (18–20):** Explicitly ties the *adaptive capacity threshold* (or equivalent) to homeostasis; uses the 30% risk to defend the threshold; argues why residual disagreement reflects *goals of medicine*; notes how SD forces a third way beyond naturalism/normativism.  
  - **B (15–17):** Adequately summarizes theories and proposes a criterion but lacks depth in defending it; identifies substantive disagreement but not its roots in medical ontology.  

  \answer{probabilistic dysfunction}
