prompt: |-
  ok so I'm working on something about bet sizing and I want to get the spec down before I write anything else. The picture I'm starting from: forget maximizing expected money, maximize the growth rate of your bankroll over a run of bets instead -- bet a fraction of your money proportional to your edge, so the typical trajectory compounds best rather than the average one. Kelly, growth-optimal, geometric-mean stuff, whatever you want to call it.

  What I want back is the desiderata list. Not the formula and not a defense of it: what does any adequate theory of "how much of my money goes on this" have to deliver? The cases it has to get right, the distinctions it can't collapse, the results it can't contradict -- with the case behind each requirement, plus your call on which requirements are real and which are just something one side in the argument wants. And flag any pair you think can't be satisfied at the same time.

  Things I want the list to cover, though dont let this be the whole list:

  - the case where expected money and the growth rate point different ways. One-shot coin flip on your entire bankroll: heads it goes up 50%, tails it goes down 40%. Expected money rises 5%, but the average of the log falls, so the growth person turns down a bet that's good in expectation. Then the same bet where you're allowed to stake any fraction you like -- I think there both rules say bet, they just disagree about how much (a quarter of the bankroll, if I've done the algebra right), so the theory needs to be able to say which of the two setups is the real disagreement.
  - one-shot bets generally. The growth argument gets its force from repetition; the theory owes us something for the n=1 case, or an honest admission that it's silent.
  - edges you've estimated rather than edges you know. Overbetting is punished without limit in a way underbetting isn't -- bet too small and you leave growth on the table, bet too big and eventually the growth rate goes negative, worse than not betting at all. So does the theory owe us a rule for when the edge is a guess, and does it have to be robust to the guess being wrong?
  - bets that aren't independent: two positions on the same underlying, a portfolio correlated with your job, a bet that only pays off in the world where you also lose your income.
  - what the bankroll even is. Liquid cash, future earnings, the house you live in. If the theory's answer turns on a quantity that isn't well-defined, that's a requirement on the theory, not a quibble.
  - whether this is a theory of rationality or of prudence. If I bet half of what the growth rule says, am I irrational, or just more risk-averse? 'Maximize expected log wealth' is one utility function among alot of them, and it's not obvious that rationality picks it out. This is where I want you to plant a flag: I suspect "the theory gives a determinate answer to how much to bet" and "the theory doesn't smuggle in a controversial attitude to risk" can't both hold, and I want to know which one you'd keep and what it costs.

  Don't hand me a survey of who says what. Give me the list, the case under each item, a straight answer on which requirement rules out the most candidates, and a definite verdict on whether the set can be jointly satisfied. If two of my bullets are really one requirement, merge them and say why.
reasoning: |-
  Okay, let me tackle this user's request. They're working on bet sizing theory, specifically focusing on the Kelly criterion and growth-optimal strategies. They want a list of desiderata—what any adequate theory must deliver—without getting into the formula itself. 

  First, I need to unpack their bullets. The coin flip example shows a conflict between expected money and growth rate. For n=1, expected money says bet everything, but growth says no bet. When fractional betting is allowed, both agree to bet but differ on size. The theory must explain why these cases differ. 

  Next, the one-shot case. Growth arguments rely on repetition, so the theory must address single bets. Is it silent here, or does it offer a bridge? The user wants clarity.

  Then, estimated edges. Overbetting has unlimited downside—bankroll can be wiped out—while underbetting just leaves growth on the table. The theory needs robustness to estimation error. How? Maybe through fractional Kelly or explicit error modeling.

  Correlated bets come next. Real portfolios have dependencies—same underlying asset, job income tied to bets. The theory must handle covariance, not just treat bets as independent. Otherwise, it fails in practical scenarios.

  Defining the bankroll is tricky. Is it liquid cash, future earnings, total net worth? If the theory depends on an ill-defined "bankroll," that's a flaw. It must either define it clearly or be invariant to reasonable definitions.

  Lastly, the rationality vs. prudence debate. Kelly maximizes log wealth, but is that the only rational choice? Risk-averse people might bet half-Kelly. The theory must clarify if it's prescriptive (you must do this) or descriptive (this optimizes growth, adjust for risk).

  Now, synthesizing these into core requirements. The coin flip case highlights Outcome Distinction: a theory must differentiate between situations where EV and growth conflict vs. align. Repetition Dependence forces the theory to handle both single and repeated bets explicitly. Risk Asymmetry requires penalizing overbetting more than underbetting. Correlation Robustness demands handling dependencies without independence assumptions. Bankroll Definability needs a clear scope or acknowledgment of its ambiguity. Finally, Normative Status must state if it's about optimal growth or allow risk-adjusted choices.

  The user suspects that "determinate answer" and "no controversial risk attitude" can't coexist. They're right. If the theory gives one answer (e.g., "always bet full Kelly"), it must embrace log utility as rational, which is controversial. If it allows adjustments (e.g., "bet half-Kelly if risk-averse"), then it's not determinate. I'd keep determinacy for growth optimization and admit it's one rational choice among many, not the only one. Sacrifices broad rationality claims but keeps the math clean.

  The hardest requirement? Correlation Robustness. Most theories assume independence, and extending to correlated bets requires complex math (covariance matrices, etc.). This rules out naive Kelly applications. 

  Can all requirements be satisfied jointly? Yes, but the theory must be explicit: it's the growth-optimizing approach for repeated bets, with clear scope (defined bankroll, covariance-aware), and acknowledges that for one-off bets or risk aversion, adjustments are pragmatic. No single theory can be all things—growth optimization is precise but narrow.
answer: |-
  Here’s the desiderata list for any adequate theory of bet sizing, derived from your core concerns. Requirements are distilled to fundamental principles, with cases, distinctions, and conflicts highlighted. **Verdict:** No theory satisfies all perfectly, but growth-optimal frameworks come closest *if* narrowly scoped. The irreconcilable tension is between **determinacy** and **risk-neutrality**.

  ---

  ### **Core Desiderata for Bet Sizing Theory**
  1. **Outcome Distinction**  
     *Case:* The coin flip: EV-max says bet everything (5% edge), growth-max says *no bet* (log-EV negative). With fractional stakes, both say "bet" but disagree on size (EV: bet 100%, Kelly: bet 25%).  
     *Requirement:* Theory must distinguish between "bet vs. no-bet" and "how much" decisions, and explain why fractional access changes the *nature* of the bet (risk of ruin vanishes).  
     *Flag:* Non-negotiable. Collapsing these fails the coin-flip test.

  2. **Repetition Dependence**  
     *Case:* One-shot bet (n=1) vs. repeated identical bets (n→∞). Growth-optimal relies on replication; EV-max does not.  
     *Requirement:* Theory must explicitly state its domain:  
     - If valid for n=1, it must justify turning down +EV bets (e.g., the coin flip).  
     - If only for n>1, it must specify minimum n or provide a bridge (e.g., "bankroll growth" implies multi-period).  
     *Conflict:* Admitting silence for n=1 weakens prescriptive power. But forcing n=1 compatibility may require non-growth criteria (e.g., risk tolerance).

  3. **Risk Asymmetry (Overbetting > Underbetting Penalty)**  
     *Case:* Estimated edge of 10% (true edge = 5%). Betting full "Kelly" on the estimate risks ruin; betting half leaves growth on the table but preserves capital.  
     *Requirement:* Theory must penalize overbetting more severely than underbetting. Specifically:  
     - Growth rate must turn negative *before* edge disappears if overbet.  
     - Robustness to uncertainty must be built-in (e.g., fractional Kelly, explicit uncertainty margins).  
     *Flag:* Essential. Naive EV-max ignores this; naive Kelly without uncertainty adjustments fails.

  4. **Correlation Handling**  
     *Case:* Betting on correlated assets (e.g., two tech stocks) or non-independent risks (e.g., a bet that fails precisely when you lose your job).  
     *Requirement:* Theory must output different sizes for correlated bets vs. identical uncorrelated bets. Must account for:  
     - Portfolio covariance (not just individual edge).  
     - Non-financial risks (e.g., job loss).  
     *Conflict:* Pure Kelly assumes independent bets; extending to correlations requires additional structure (e.g., covariance matrices).

  5. **Bankroll Definability**  
     *Case:* Is "bankroll" liquid assets? Net worth? Human capital? Betting 25% of your house vs. 25% of cash.  
     *Requirement:* Theory must either:  
     - Define bankroll operationally (e.g., "risk capital separable from essential assets"), or  
     - Be invariant to resizing (e.g., if edge and odds scale, bet fraction stays constant).  
     *Flag:* Theories that ignore this (e.g., "bet X% of all wealth") are incomplete or dangerous.

  6. **Normative Status (Rationality vs. Prudence)**  
     *Case:* Betting half-Kelly for psychological comfort. Is this irrational or prudent?  
     *Requirement:* Theory must clarify its claim:  
     - If "rational," it must defend why maximizing E[log(W)] is uniquely rational.  
     - If "growth-optimal," it must allow risk-averse deviations without contradiction.  
     *Irreconcilable Conflict:* **Determinacy vs. Risk-Neutrality**.  
     - *Determinacy*: Kelly gives one "optimal" fraction.  
     - *No controversial risk attitude*: But Kelly *is* a risk attitude (log utility).  
     **Verdict:** Keep **determinacy for growth**, sacrifice "universal rationality." Admit it’s optimal *for growth*, not necessarily all utility functions. Half-Kelly is suboptimal for growth but rational for risk-averse agents.

  ---

  ### **Which Requirement Rules Out the Most Candidates?**
  - **Correlation Handling** eliminates naive Kelly, most fractional-fixed approaches, and pure EV-max.  
  - **Risk Asymmetry** kills naive EV-max (no overbet penalty) and rigid safe-fraction rules (no growth penalty).  
  - **Bankroll Definability** invalidates theories that ignore liquidity/essential assets (e.g., "bet 20% of total net worth" including your home).

  ---

  ### **Can All Requirements Be Satisfied Jointly?**
  **No** — due to the **determinacy/risk-neutrality conflict**. A theory can satisfy 1-5 *only* if:  
  - It embraces **growth-optimality as the goal** (losing n=1 compatibility and universal rationality claims).  
  - **Explicitly incorporates uncertainty and correlations** (e.g., stochastic portfolio optimization).  
  - **Acknowledges bankroll as a parameter** (not an output).  

  **Best compromise:** A growth-optimal framework that:  
  - Uses fractional Kelly for uncertainty.  
  - Uses covariance matrices for correlations.  
  - Admits it’s silent for n=1 unless growth is defined ex-ante.  
  - States bankroll must be pre-defined "risk capital."  
  - Flags half-Kelly as risk-averse but *not* growth-optimal.  

  This satisfies 1-5 but abandons "universal rationality" (requirement 6). The alternative — a theory that avoids controversial risk attitudes — becomes ambiguous (e.g., "bet between X% and Y%") and fails determinacy.

  ---

  ### **Summary: Your Bullets Merged & Rationalized**
  - Your first two bullets → **Outcome Distinction** + **Repetition Dependence** (they show how bet access and n change prescriptions).  
  - "Edges you’ve estimated" → **Risk Asymmetry** (core is the asymmetry penalty).  
  - "Bets that aren’t independent" → **Correlation Handling**.  
  - "What the bankroll is" → **Bankroll Definability**.  
  - "Rationality vs. prudence" → **Normative Status** + the **irreconcilable conflict**.  

  **Planting the flag:** Growth-optimal is the only coherent foundation, but it *must* concede that it’s not the unique "rational" choice — just the unique growth-maximizing one. All else is risk management atop that engine.
