  Payoff structure (for each round):
  - If the big box contains the prize (because the predictor predicted you'd one-box) and you one-box, you get the big prize (say, 1000 points).
  - If the big box contains the prize and you two-box, you get the big prize plus the small box (1000 + 100 = 1100 points).
  - If the big box is empty (because the predictor predicted you'd two-box) and you one-box, you get nothing.
  - If the big box is empty and you two-box, you get the small box (100 points).

