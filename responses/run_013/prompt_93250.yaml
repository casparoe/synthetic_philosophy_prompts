  ### Newcomb's Problem Classroom Game Design

  **Objective:** Simulate Newcomb's problem with a transparent predictor, demonstrating the tension between causal and evidential decision theory without relying on "magical" prediction. Students experience one-boxing as empirically successful but two-boxing as causally dominant.

  **Core Mechanics:**  
  Predictor uses pre-written student self-descriptions to forecast choices. Payoffs mirror Newcomb's structure. Game runs in two stages:  
  1. **Opaque Stage:** Big box contents hidden during choice.  
  2. **Transparent Stage:** Big box contents visible during choice.  

  ---

  ### **Rules & Setup**  
  **Materials:**  
  - 14 slips for self-descriptions  
  - 28 choice slips (14 per stage)  
  - 1 prediction sheet (for instructor/"predictor")  
  - Whiteboard to record payoffs  
  - Tokens/points (no real money)  

  **Payoffs:**  
  - **Big box:** 1000 points (if predicted to one-box) or 0 (if predicted to two-box)  
  - **Small box:** Always 100 points  

  | Choice          | Big Box Full (Predicted One-Box) | Big Box Empty (Predicted Two-Box) |
  |-----------------|----------------------------------|-----------------------------------|
  | **One-box**     | 1000 points                     | 0 points                         |
  | **Two-box**     | 1100 points                     | 100 points                       |

  ---

  ### **Timeline (90-Minute Session)**  
  1. **Introduction & Self-Descriptions (10 min)**  
     - Students write 1–2 sentences about their decision-making style (e.g., "I avoid risks," "I maximize guaranteed gains").  
     - Collect slips. Emphasize: *"Be honest—this shapes your outcomes."*  

  2. **Stage 1: Opaque Big Box (30 min)**  
     - **Step 1 (5 min):** Explain rules:  
       - Predictor (instructor) reads descriptions, forecasts one-box/two-box for each student.  
       - Big box contents set *before* choices based on predictions.  
       - Students choose blindly: **A** (one-box) or **B** (two-box).  
     - **Step 2 (5 min):** Predictor makes forecasts. *Example:* A cautious description → predict one-box; a "greedy" one → predict two-box.  
     - **Step 3 (5 min):** Students choose privately (write **A**/**B** on slips).  
     - **Step 4 (15 min):** Reveal predictions/choices. Record payoffs on board. Calculate:  
       - Average payoff for one-boxers vs. two-boxers.  
       - Total points per prediction type.  

  3. **Stage 2: Transparent Big Box (25 min)**  
     - **Step 1 (5 min):** New rules:  
       - Same predictions as Stage 1 (big box contents unchanged).  
       - Students see contents *before* choosing.  
     - **Step 2 (5 min):** Reveal big box status to each student (e.g., hand slips: "Your big box is FULL/EMPTY").  
     - **Step 3 (5 min):** Students choose (**A**/**B**).  
     - **Step 4 (10 min):** Reveal payoffs. Highlight:  
       - Did anyone one-box?  
       - Compare Stage 1 vs. Stage 2 payoffs.  

  4. **Debrief (25 min)**  
     - **Evidential Reasoning (Stage 1):**  
       - One-boxers likely had self-descriptions implying predictability (e.g., "I’m cautious").  
       - Their choice *correlated* with a full box → high average payoff (e.g., 1000 vs. two-boxers’ 100–200).  
       - *"One-boxing 'won'—but was it rational?"*  
     - **Causal Reasoning (Stage 2):**  
       - Two-boxing dominated: Full box → 1100 > 1000; empty box → 100 > 0.  
       - Choice didn’t *cause* box contents (already fixed by prediction).  
       - *"Why did two-boxing feel obvious now?"*  
     - **The Tension:**  
       - Stage 1: Evidential view says one-boxing signals a "cooperative" disposition (rewarded by predictor).  
       - Stage 2: Causal view says your choice can’t affect the past → take both.  
     - **Predictor Demystified:**  
       - Forecasts were causal (based on descriptions), not psychic.  
       - Success of one-boxing in Stage 1 depended on predictor accuracy.  

  ---

  ### **Predictably Tricky Spots & Mitigation**  
  1. **Predictor Accuracy Varies:**  
     - First-run risk: Poor predictions blur the payoff gap (one-boxers don’t "win" clearly in Stage 1).  
     - **Fix:** Instructor as predictor is ideal—use descriptions aggressively (e.g., "I play it safe" → predict one-box; "I grab all chances" → predict two-box).  

  2. **Stage 1 Two-Boxers Rationalize Poor Payoffs:**  
     - Likely defense: *"I’d get 100 either way, but if the predictor was wrong, I’d get 1100!"*  
     - **Use this:** Highlight how this mirrors causal logic—it’s *defensible* even when unprofitable.  

  3. **Stage 2 One-Boxing Persists:**  
     - Risk: A few one-box "on principle" (e.g., if big box is full).  
     - **Use this:** Discuss why—e.g., guilt, commitment to Stage 1 strategy. Contrast with dominant strategy.  

  ---

  ### **What the Game Can’t Simulate (Instructor Must Explain)**  
  **Perfect Prediction:**  
  - In real Newcomb’s problem, the predictor is *infallible* (e.g., via time travel/simulation).  
  - Our game uses *fallible* prediction (descriptions → forecasts).  
  - **Crucial distinction:**  
    - With infallibility, two-boxing *guarantees* 100 points (predictor foresees it, leaves big box empty).  
    - One-boxing *guarantees* 1000 points (predictor fills big box).  
  - **Emphasize:** "The original problem forces you to ask: *Can my choice ‘trick’ a perfect predictor?* Our game shows why evidential reasoning thrives under uncertainty—but causal logic bites back when the fog lifts."  

  ---

  ### **Expected Outcomes & Teaching Points**  
  - **Stage 1 Results:** One-boxers outearn two-boxers (e.g., 800–1000 avg. vs. 100–300). Two-boxers defend: *"I couldn’t risk getting 0!"*  
  - **Stage 2 Results:** 95%+ two-box. Former one-boxers "defect" for 1100 points.  
  - **Key Insight:**  
    > "Stage 1’s one-boxers did better *because* their dispositions were predictable. But Stage 2 reveals: Once the cause (prediction) is fixed, dominance rules.  
    > Newcomb’s paradox asks: *Are you the type of person who leaves money on the table?* Philosophy says it’s about causation vs. correlation. Economics says dominance wins. Who’s right?"  

  **Total Runtime:** 80–85 minutes (flexible debrief). Adjust stages if prediction runs long.
