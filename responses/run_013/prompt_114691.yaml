answer: |-
  Below is a complete design for your 90-minute workshop. It meets all your requirements, including fixed preferences, two voting rounds, visible strategic voting, a pivotal small party, divergent outcomes under FPTP vs. PR, and real coalition bargaining with tangible stakes. 

  ---

  ### **Workshop Design: "Rules of Power"**
  **Goal:** Experience how voting rules (FPTP vs. PR) transform identical preferences into different outcomes, and how coalition power differs from seat share.  
  **Participants:** 20 (engineers/operations staff).  
  **Setup:** One room, paper ballots, a whiteboard, no computers. A small budget (e.g., $100 for team snacks/coffee) is on the table.  

  ---

  ### **Core Elements**
  1. **Fixed Preferences & Roles**  
     Four parties with distinct policy priorities (prevents arbitrary feelings):  
     - **A: "GreenTech Party"** (Environmental innovation, left-leaning).  
     - **B: "Growth & Jobs Party"** (Economic development, center).  
     - **C: "Stability First Party"** (Law and order, right-leaning).  
     - **D: "Balance Party"** (Compromise-focused, centrist; small but pivotal).  

     Assign roles randomly to avoid "rigging" accusations:  
     - Hand out 20 pre-filled **"Voter ID Cards"** (see ballot counts below). Each card lists:  
       - The voter’s **assigned party** (e.g., "You are a GreenTech supporter").  
       - Their full **preference ranking** (e.g., "You prefer: GreenTech > Balance > Growth & Jobs > Stability First").  
     - Use neutral criteria for assignment (e.g., "Your party is based on your birth month: Jan–May = A, June–Oct = B, Nov–Dec = C or D").  
     - **Key:** Participants **must** vote as assigned, not by personal views.  

  2. **District Map & Ballots**  
     - **Round 1 (FPTP):** 5 single-member districts (4 voters each).  
     - **Round 2 (PR):** One nationwide district with 5 seats.  
     - **Ballot counts (sincere preferences):**  
       - A: 9 supporters  
       - B: 6 supporters  
       - C: 3 supporters  
       - D: 2 supporters  
     - **District Map for FPTP (ensure Condorcet failure & strategic voting):**  
       - *District 1:* 3 A, 1 B  
       - *District 2:* 2 A, 2 B  
       - *District 3:* 1 B, 3 C  
       - *District 4:* 2 C, 1 D, 1 A  
       - *District 5:* 2 D, 1 B, 1 C  
       - **Why this map?**  
         - District 2 has a Condorcet loser: B wins plurality (2 votes), but A beats all others head-to-head (3/4 voters prefer A > B).  
         - District 5 enables strategic desertion (poll shows D leading, tempting C/B voters to abandon their party).  

  3. **Published Polls**  
     - **Before Round 1 (FPTP):** Show district-level polls. In District 5: "D: 40%, C: 30%, B: 30%". This tempts C/B voters to desert to "stop D".  
     - **Before Round 2 (PR):** Show nationwide poll: "A: 45%, B: 30%, C: 15%, D: 10%". No incentive for desertion (votes translate proportionally).  

  4. **Voting Systems**  
     - **FPTP:** Voters mark one candidate. Plurality wins each district.  
     - **PR:** Voters mark one party nationwide. Seats allocated via:  
       - **Sainte-Laguë method** (more small-party-friendly).  
       - **D’Hondt method** (favors larger parties).  

  5. **Coalition Rules**  
     - After Round 2, parties must form a **coalition controlling ≥3/5 seats** to govern.  
     - **Policy compatibility rule:** Two parties can only ally if their policy positions are ≤2 units apart (prevents unnatural coalitions):  
       - *Positions:* A=1 (left), B=3 (center), C=6 (right), D=4 (center-right).  
       - *Allowed pairs:* A-B (distance 2), B-D (1), B-C (3), D-C (2). *Disallowed:* A-C (5), A-D (3).  
     - **Real decision:** The winning coalition allocates the budget (e.g., "Buy team snacks" vs. "Donate to charity").  

  ---

  ### **Timeline (90 Minutes)**
  | **Time** | **Activity** | **Materials** | **Instructor Notes** |
  |----------|--------------|---------------|----------------------|
  | 0:00–0:05 | Assign roles | 20 "Voter ID Cards" | Randomize assignment; emphasize "no personal views." |  
  | **ROUND 1: FPTP** |  |  |  |  
  | 0:05–0:10 | Pre-vote poll | Whiteboard: District polls | Highlight District 5: "D leads; can C/B catch up?" |  
  | 0:10–0:15 | Vote | Paper ballots (one per voter) | Collect ballots; count publicly. |  
  | 0:15–0:20 | Tally & announce | Whiteboard: District results | Declare winners; note District 2’s Condorcet failure. |  
  | **ROUND 2: PR** |  |  |  |  
  | 0:20–0:25 | Pre-vote poll | Whiteboard: National poll | "No need for strategy—every vote counts!" |  
  | 0:25–0:30 | Vote | Paper ballots (one per voter) | Collect ballots. |  
  | 0:30–0:35 | Tally seats (Sainte-Laguë) | Whiteboard: PR calculation | Show how divisors allocate seats. |  
  | 0:35–0:40 | Tally seats (D’Hondt) | Whiteboard: PR calculation | Highlight rounding differences. |  
  | **COALITION BARGAINING** |  |  |  |  
  | 0:40–0:50 | Form government | Party delegations (A:4 reps, B:3, C:1, D:1) | Each party sends 1–2 negotiators. Others observe. |  
  | 0:50–0:55 | Real decision | Budget ($100 in cash/envelope | Coalition spends budget immediately. |  
  | **DEBRIEF** |  |  |  |  
  | 0:55–1:30 | Guided discussion | Whiteboard: Key moments | Link experiences to your goals (see below). |  

  ---

  ### **Worked Seat Counts & Coalition Math**
  #### **Round 1 (FPTP) Results**
  - **District 1 (3A,1B):** A wins (plurality: 3 votes).  
  - **District 2 (2A,2B):** **B wins** (plurality: 2 votes). *But A is Condorcet winner: A > B (3–1), A > C (4–0), A > D (4–0).*  
  - **District 3 (1B,3C):** C wins (plurality: 3 votes).  
  - **District 4 (2C,1D,1A):** C wins (plurality: 2 votes).  
  - **District 5 (2D,1B,1C):**  
    - *Sincere vote:* D wins (2 votes).  
    - *Strategic desertion:* Poll tempts 1 C voter to desert to B ("stop D"). Outcome: D=2, B=2 → tie. **Resolution (pre-set):** Coin flip → B wins.  
  - **FPTP Seat Totals:** A=1, B=2, C=2, D=0.  

  #### **Round 2 (PR) Results**  
  - **Sincere Votes (20 voters):** A=9, B=6, C=3, D=2.  
  - **Sainte-Laguë Method (5 seats):**  
    | Party | ÷1 | ÷3 | ÷5 | **Seats** |  
    |-------|----|----|----|-----------|  
    | A     | 9  | 3  | 1.8| 2 (9, 3) |  
    | B     | 6  | 2  | 1.2| 2 (6, 2) |  
    | C     | 3  | 1  | 0.6| 1 (3)    |  
    | D     | 2  | 0.6| 0.4| 0        |  
    - **Seats:** A=2, B=2, C=1, D=0.  
  - **D’Hondt Method (5 seats):**  
    | Party | ÷1 | ÷2 | ÷3 | **Seats** |  
    |-------|----|----|----|-----------|  
    | A     | 9  | 4.5| 3  | **3** (9, 4.5, 3) |  
    | B     | 6  | 3  | 2  | 1 (6)    |  
    | C     | 3  | 1.5| —  | 1 (3)    |  
    | D     | 2  | 1  | —  | 0        |  
    - **Seats:** A=3, B=1, C=1, D=0.  
  - **Key Takeaway:** Identical votes, but D’Hondt gives A an extra seat due to rounding.  

  #### **Coalition Bargaining**  
  - **Policy Compatibility:** A(1), B(3), C(6), D(4). Allowed pairs: A-B (|1-3|=2), B-D (|3-4|=1), B-C (|3-6|=3), D-C (|4-6|=2).  
  - **Under Sainte-Laguë (A=2, B=2, C=1, D=0):**  
    - *Possible coalitions:* A+B=4 seats (distance 2, allowed).  
    - **Outcome:** A+B coalition governs. C and D have no power.  
  - **Under D’Hondt (A=3, B=1, C=1, D=0):**  
    - *Possible coalitions:*  
      - A alone=3 seats → can govern solo (no partner needed).  
    - **Outcome:** A governs alone. B and C have no power.  
  - **Pivotal Small Party?**  
    - If D wins a seat (e.g., 1 seat in a variant), it becomes pivotal: A+B=3 (allowed) needs D to reach 4 seats for a supermajority.  
    - **But in this session:** D gets 0 seats in both PR methods → powerless despite policy relevance.  

  ---

  ### **Predictable "Failures" & How to Handle Them**  
  1. **"You rigged the preferences!"**  
     - **In-session:** Deflect by showing random assignment method (e.g., birth months). Ask skeptics to verify calculations publicly.  
     - **Debrief:** Emphasize, "Real voters don’t self-sort perfectly either—we simplified to isolate rule effects."  

  2. **Coalition deadlock:**  
     - If negotiators stall, remind them, "Every minute costs your team $2 of the budget."  
     - If incompatible (e.g., A and C refuse to ally), declare "minority government" → budget is frozen.  

  3. **Strategic voting fails in FPTP:**  
     - If District 5’s C voters don’t desert to B, D still wins. **Use it!** Debrief: "In real FPTP, voters often *don’t* strategize optimally—trust in polls varies."  

  4. **PR math confuses participants:**  
     - Simplify: "Sainte-Laguë uses smaller divisors (1,3,5,...), helping small parties; D’Hondt (1,2,3,...) helps large ones." Show one calculation live.  

  ---

  ### **Debrief: Mapping Experiences to Your Goals**  
  | **Goal** | **When to Highlight** | **Talking Points** |  
  |----------|------------------------|-------------------|  
  | **Same preferences → different outcomes** | After Round 2 tally | "Identical voters produced: FPTP (B=2, C=2) vs. PR-SL (A=2, B=2) vs. PR-DH (A=3). No system is ‘fair’—each prioritizes different values." |  
  | **FPTP destroys info; PR moves power to coalitions** | Post-FPTP & coalition phase | "FPTP forced voters to desert favorites (e.g., District 5). PR preserved preferences but made *coalitions* the real deciders. Both lose information." |  
  | **PR is a family of methods** | Showing D’Hondt vs. Sainte-Laguë | "Rounding rules gave A 2 or 3 seats. You didn’t vote on those rules—yet they changed who governed." |  
  | **Seat share ≠ power** | Coalition phase | "D had 0 seats but was policy-pivotal. C had 1–2 seats but was never in government. Power comes from being needed, not just vote share." |  

  ---

  ### **What This Activity Cannot Reproduce**  
  1. **Geographic representation:**  
     - FPTP ties reps to local districts; PR ignores geography. *Address in debrief:* "FPTP ensures local voices, but may sacrifice proportionality."  

  2. **Long-term party formation:**  
     - Voting rules shape which parties *exist* (e.g., FPTP kills small parties). *Address:* "PR encourages diverse parties; FPTP favors two blocs."  

  3. **Voter psychology/social dynamics:**  
     - No repeated elections, media, or social pressure. *Address:* "In reality, fear of ‘wasted votes’ or peer influence amplifies these effects."  

  4. **Threshold effects (e.g., 5% in PR):**  
     - We didn’t use thresholds. *Address:* "Many PR systems exclude tiny parties—this alters outcomes further."  

  ---

  ### **Materials to Prepare**  
  1. **Voter ID Cards (20):**  
     - Example: "You are a **GreenTech (A) supporter**. District: 1. Preferences: A > B > D > C."  
  2. **Ballots (2 sets):**  
     - FPTP: District-specific, with candidate names.  
     - PR: Party names only.  
  3. **Polling Slides:** District/national polls.  
  4. **Budget:** Cash/envelope labeled "Governing Coalition Fund ($100)".  
  5. **Whiteboard Setup:** Pre-drawn tables for vote counts, PR formulas, and policy positions.  

  This design forces participants to *live* the trade-offs: FPTP’s desertion pressure, PR’s rounding quirks, and the gap between votes and power. By ending with real stakes, the coalition phase becomes visceral. The debrief ties each step to your core lessons—no lecturing needed.
