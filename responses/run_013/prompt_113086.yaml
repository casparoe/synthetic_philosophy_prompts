  First, I should acknowledge the dual audience. The researchers need intellectual rigor—they'll spot oversimplifications. The donors and families want warmth and meaning. The core idea is that violence trends change based on measurement choices, but we can't stop at relativism; there must be some underlying truth.

  The user mentioned key dials: types of violence (homicide vs. organized conflict), measurement units (raw numbers vs. per capita), demographic impact (young vs. old victims), and non-lethal harms. Also, the problem of rare extreme events skewing averages. These points need to be woven in naturally without jargon.

