  Tone-wise, warmth comes from honoring the founders and the institute's work. Humor might be risky with this topic, but lightness could help—maybe a gentle nod to "denominator sensitivity" to engage the researchers.

  Timing is five minutes. Roughly 700 words spoken slowly. Prioritize clarity over cramming all points. Each dial gets 30-45 seconds, leaving room for intro/conclusion.

  Biggest risk is losing either audience. Donors might tune out technicalities; researchers might bristle at oversimplification. Solution: anchor each abstract point in human impact ("years of life lost" isn't just a metric—it's stolen futures).

