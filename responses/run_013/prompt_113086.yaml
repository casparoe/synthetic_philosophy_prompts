answer: |-
  Here’s a draft designed for your audience, balancing depth with warmth, delivered in roughly five minutes:

  **(Start with warmth, acknowledging the occasion)**

  Good evening. Forty years. Forty years of asking the hardest questions, in pursuit of something vital: understanding the nature of human conflict. We celebrate the founders whose vision started this, the researchers whose relentless curiosity has driven it forward, and the supporters whose belief has sustained it. Thank you for being here.

  **(Introduce the core idea gently)**

  Now, when you spend decades studying conflict, you develop a certain... sensitivity. You learn that the story violence tells isn't always straightforward. It whispers different things depending on how you listen.

  **(Introduce the "dial" metaphor)**

  Think of measuring violence not as reading a single, fixed number on a thermometer, but as adjusting a complex dial on an old radio. Tweak one setting, and the signal – the trend, the very *meaning* of what we're hearing – shifts.

  **(Illustrate key "dial settings" clearly and concisely)**

  1.  **The Scope Dial:** Turn it towards everyday violence – street crime, homicides – and you might hear one story about risk in our communities. Turn it towards organized warfare – battlefields, sieges – and a different, often louder, signal emerges about the state of nations and regions. Is the trend up or down? It depends *entirely* on which frequency you're tuned to.
  2.  **The Scale Dial:** Are we counting raw numbers – the stark total of lives lost? Or are we measuring impact *per person*, relative to the size of a community or the world? A constant number of deaths tells a very different story in a village of a hundred versus a city of millions. Which dial setting reveals the true burden?
  3.  **The Depth Dial:** Even if the count is identical, a conflict that takes mostly the elderly is a profoundly different event – a different kind of societal wound – than one that takes the young, stealing lifetimes of potential. Measuring mere bodies misses this depth of loss. Years of life lost? That’s a different, often harsher, signal.
  4.  **The Visibility Dial:** And what about the harms that leave no corpse? The terror that paralyzes, the displacement that shatters lives, the trauma etched on minds for generations? Our dial often defaults to the visible, the countable death. But turn it towards these invisible frequencies, and the picture of violence expands dramatically, often revealing a much larger, ongoing burden.
  5.  **The Time Window Dial:** Finally, violence isn't smooth. A single catastrophic decade, a monstrous outlier, can dominate a century's statistics. Does the 'average' tell the story of relative peace punctuated by horror? Or does it drown out quieter progress? This dial is held hostage by the extremes.

  **(Land the key point about perspective)**

  So, when someone asks, "Is violence decreasing?" – the honest answer starts with another question: "Which dials are you using?" The *sign* of the trend – whether things seem to be getting better or worse – genuinely moves with these choices.

  **(Address the core tension: Relativism vs. Reality)**

  Does that mean it's *all* just framing? That there's no reality beneath the dials? I don't believe that. And I don't think anyone in this room who has looked closely at the data, or felt the impact of conflict, believes that either.

  **(The "honest landing" – finding the fact of the matter)**

  The undeniable reality is **human suffering.** That is the constant. The dials we choose reveal *which* suffering we are focusing on, *how* we are weighing it, and *what kind* of threat or progress we are prioritizing. They reflect our values and our questions.

  The fact of the matter is that **some dials show significant, hard-won progress in reducing certain kinds of catastrophic violence globally.** The fact of the matter is that **other dials reveal persistent, devastating burdens – sometimes changing shape, sometimes deepening in specific places.** The fact of the matter is that **the outliers, the catastrophic decades, cast long shadows we cannot ignore.** And the fact of the matter is that **much profound harm remains tragically invisible in our most common measures.**

  **(Conclude with purpose and gratitude)**

  The mission of this institute, for forty years, hasn't been to find one simple answer, but to turn all these dials with rigor and care. To listen to the complex, often painful, signal of human conflict in all its forms. To ensure the suffering we *can* measure informs our understanding of the suffering we *struggle* to measure. To move beyond simple narratives and confront the messy, multifaceted reality.

  That’s not just counting. That’s understanding. That’s the vital work you – researchers, families, and supporters – have sustained. Thank you for continuing to listen so carefully. Here’s to the next forty years of asking the hard questions.

  **(End warmly)**

  ---

  **Why this works for your audience:**

  *   **Researchers:** They'll appreciate the nuanced acknowledgment of measurement complexity ("smell a bad denominator"), the specific dials (scope, scale, depth, visibility, time window), and the rejection of pure relativism ("human suffering is the constant"). They won't feel talked down to.
  *   **Donors/Families:** The warm opening and closing, the focus on the institute's purpose and values, the clear metaphors ("dial," "signal," "listening"), and the emphasis on human suffering make it accessible and meaningful. It avoids jargon and academic citations.
  *   **Balances Optimism & Realism:** It acknowledges progress on some fronts ("significant, hard-won progress") while highlighting persistent and invisible burdens ("persistent, devastating burdens," "much profound harm remains... invisible"). It doesn't sugarcoat but doesn't descend into despair.
  *   **Lands the Core Message:** It clearly states the trend's sign depends on measurement ("the sign of the trend... moves with these choices") and lands on the "fact of the matter" being the reality of suffering and the importance of using multiple perspectives rigorously.
  *   **Time:** Written for spoken delivery, concise points, roughly 5 minutes.
  *   **No Names/Studies:** Focuses on concepts and avoids specific references.

  Deliver it with conviction, warmth for the occasion, and respect for the complexity of the subject. Good luck!
