  - **1.2** Check for dependencies: If the decision problem involves multiple variables, check if the uncertainty in one variable is independent of others. If not, we must capture the joint uncertainty. This step is complex and might require expert input.

  - **1.3** Check for "irrelevant" variables increasing uncertainty: 
    - **1.3.1** For the target variable Y and an additional variable X that is thought to be irrelevant, compute the set of distributions for Y both with and without conditioning on X. 
    - **1.3.2** If conditioning on X leads to a wider set of distributions for Y (even though X is irrelevant to the decision problem), flag this as an instance where the "irrelevant" variable is actually creating an ambiguity that affects the decision. This is a real phenomenon (e.g., in imprecise probability, conditioning can increase imprecision). The procedure should note that this is a case where the set P is not closed under conditioning and we must be cautious.

  ### Step 2: Apply Decision Rules
  We will apply several decision rules to the set P. Each rule will produce a set of acceptable actions. We will then compare the results.

  - **2.1** Maxmin (Wald Rule): For each action a, compute the minimum expected utility over all distributions in P. Then choose the action with the highest minimum expected utility.
    - **2.1.1** If the set P is very large, we might use linear programming to compute the minimum expected utility for each action. Alternatively, if the set is structured (e.g., defined by constraints), we can use optimization.

  - **2.2** Minimax Regret: 
    - For each distribution p in P and each action a, compute the regret: 
        regret(a, p) = [max_{a'} U(a', p)] - U(a, p)
      where U(a, p) is the expected utility of action a under distribution p.
    - Then for each action a, compute the maximum regret over p in P.
    - Choose the action with the smallest maximum regret.

  - **2.3** Admissibility (in the sense of Levi): An action is admissible if there is no other action that dominates it for every distribution in P. That is, action a is admissible if there is no a' such that for every p in P, U(a', p) >= U(a, p) and for some p, U(a', p) > U(a, p).
