  - **2.4** Gamma-Maxmin (if we have a weighting over the set P): If we have a second-order distribution (a distribution over the distributions in P), then we can compute the expected utility for each action by integrating over P and then choose the action with the highest expected utility. However, this requires a weighting and the problem states that we don't have one. So we skip this unless we have weights (e.g., from scenario weights).

