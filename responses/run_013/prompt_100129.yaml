  - It cannot handle non-convex sets of distributions without discretization (but we assume we work with extreme points).
  - It cannot resolve deep conflicts in decision rules without escalation.
  - It cannot incorporate vague qualitative information (like "very unlikely") without quantification.
  - It may become computationally intensive for large state spaces and many distributions.

  **Most likely failure mode in practice**:
  - **Garbage in, garbage out**: If the elicitation of the set P is flawed (e.g., experts are not properly calibrated, or the set does not capture the true uncertainty), then the decision may be wrong.
  - **Escalation overuse**: If the procedure flags too many decisions for escalation because of conflicts in rules, it may become impractical.
  - **Mischaracterization of uncertainty**: Failing to properly separate disagreement from ignorance might lead to inappropriate decision rules.
  - **Overlooking dependencies**: In complex systems with many variables, missing dependencies can lead to an inadequate credal set.

  The procedure is a starting point. It must be applied with judgment and may require iteration.
answer: |-
  Below is a complete, step-by-step procedure for handling deep-uncertainty decisions. It's designed as a checklist/flowchart for operational use (tested on your two cases). The procedure **explicitly separates calculation from judgment**, **flags escalation points**, and **outputs defensible options** (not a single "answer"). It assumes you have:  
  - A set of actions \( \{a_1, \dots, a_k\} \)  
  - A set of outcomes (with utilities, e.g., lives saved, costs)  
  - A credal set \(\mathcal{P}\) (collection of probability distributions from experts)  

  ---

  ### **PROCEDURE: DEEP-UNCERTAINTY DECISION CHECKLIST**  
  *Execute steps in order. Stop and escalate at ❗ if criteria met.*

  #### **STEP 0: CLASSIFY UNCERTAINTY SOURCES**  
  *(Separates ignorance from disagreement)*  
  1. **Annotate each distribution in \(\mathcal{P}\):**  
     - If an expert provided a range/scenario set due to *lack of knowledge*, label as **"Ignorance"**.  
     - If an expert provided a range/scenario set due to *conflict with another expert*, label as **"Disagreement"**.  
     - *Example: 3 experts; Expert 1 gives a range (ignorance), Experts 2 and 3 give conflicting point estimates (disagreement).*  

  2. **Split \(\mathcal{P}\) into subsets:**  
     - \(\mathcal{P}_{\text{ignorance}}\): All distributions from single-expert ignorance.  
     - \(\mathcal{P}_{\text{disagreement}}\): All distributions from conflicting experts.  
     - *Output: Two separate sets. Do NOT merge or average across sets.*  

  3. **❗ ESCALATION POINT:**  
     - If \(\mathcal{P}_{\text{disagreement}}\) is non-empty and high-stakes, notify leadership: *"Experts fundamentally disagree; political judgment may be needed."*  

  ---

  #### **STEP 1: HANDLE POOLING & IRRELEVANT VARIABLES**  
  *(Prevents false narrowing and flags uncertainty inflation)*  
  1. **Pool within uncertainty types (DO NOT POOL ACROSS TYPES):**  
     - For \(\mathcal{P}_{\text{ignorance}}\): Keep full set (convex hull). Do not narrow.  
     - For \(\mathcal{P}_{\text{disagreement}}\): Keep all distributions. Do not average.  

  2. **Test for "irrelevant variable" uncertainty inflation:**  
     - Let \(X\) be the variable you care about (e.g., side effect rate).  
     - Let \(Y\) be an unrelated variable (e.g., background infection rate).  
     - Compute \(\text{range}(X)\) using \(\mathcal{P}\) (all distributions).  
     - Now compute \(\text{range}(X|Y)\) (conditioning on \(Y\) for each distribution).  
     - **If** \(\text{range}(X|Y)\) is wider than \(\text{range}(X)\):  
       - *Flag:* "Adding variable \(Y\) increases uncertainty about \(X\)."  
       - *Action:* Reject \(Y\) as irrelevant; use \(\text{range}(X)\) without conditioning.  

  ---

  #### **STEP 2: APPLY DECISION RULES**  
  *(Runs all standard rules; reports conflicts)*  
  **Input:** Actions \(a_i\), utilities \(u(a_i,s)\), credal set \(\mathcal{P}\).  
  **Output:** Sets of acceptable actions per rule.  

  1. **Maximin (Wald Rule):**  
     - For each action \(a_i\), compute:  
       \[
       \text{MM}(a_i) = \min_{p \in \mathcal{P}} \mathbb{E}_p[u(a_i,s)]
       \]  
     - **Acceptable:** \(\arg\max_{a_i} \text{MM}(a_i)\)  

  2. **Minimax Regret:**  
     - For each \(a_i\) and \(p \in \mathcal{P}\), compute regret:  
       \[
       R(a_i,p) = \max_{a_j} \mathbb{E}_p[u(a_j,s)] - \mathbb{E}_p[u(a_i,s)]
       \]  
     - **Acceptable:** \(\arg\min_{a_i} \left( \max_{p \in \mathcal{P}} R(a_i,p) \right)\)  

  3. **E-Admissibility (Levi):**  
     - **Acceptable:** All \(a_i\) such that \(\exists p \in \mathcal{P}\) where \(a_i\) maximizes \(\mathbb{E}_p[u(a_i,s)]\).  

  4. **Maximax (if optimism justified):**  
     - **Acceptable:** \(\arg\max_{a_i} \left( \max_{p \in \mathcal{P}} \mathbb{E}_p[u(a_i,s)] \right)\)  
     - *❗ Only use if leadership pre-approves optimism (e.g., for low-stakes decisions).*  

  ---

  #### **STEP 3: RESOLVE CONFLICTS & OUTPUT OPTIONS**  
  *(Handles rule disagreements and long-run risks)*  
  1. **Compute admissible set:**  
     - An action \(a_i\) is **admissible** if no other action dominates it across all \(p \in \mathcal{P}\).  
     - *Output:* All admissible actions.  

  2. **Check rule agreement:**  
     - Let \(A_{\text{MM}} = \text{Maximin acceptable actions}\)  
     - Let \(A_{\text{MR}} = \text{Minimax Regret acceptable actions}\)  
     - Let \(A_{\text{E}} = \text{E-Admissible actions}\)  
     - **If** \(A_{\text{MM}} \cap A_{\text{MR}} \cap A_{\text{E}}\) is non-empty → Recommend this set.  
     - **Else** → Recommend all admissible actions.  

  3. **Long-run exploitability test (for repeated decisions):**  
     - *"If we use this rule repeatedly, could nature force a guaranteed loss?"*  
     - **Maximin:** Not exploitable (pessimism protects against worst-case).  
     - **Minimax Regret:** Not exploitable in repeated play.  
     - **E-Admissibility:** Potentially exploitable (if distributions change adversarially).  
     - *Action:* If using E-Admissibility for repeated decisions, add a constraint: "Switch to Minimax Regret if >50% of past decisions had high regret."  

  4. **❗ ESCALATION POINT:**  
     - If admissible set has >2 actions, or rules strongly disagree → Notify leadership: *"Technical criteria inconclusive; value judgment needed."*  
     - If long-run exploitability detected → Notify: *"Repeated use may lead to systematic losses; consider locking a rule."*  

  ---

  #### **STEP 4: DOCUMENT & REVIEW**  
  1. Report:  
     - Credal set \(\mathcal{P}\) with ignorance/disagreement labels.  
     - All acceptable action sets per rule.  
     - Escalation flags raised.  
  2. **Final output:**  
     - A defensible set of actions (not a single recommendation).  
     - Clear statement: *"Decision rule(s) X support actions Y; escalate if Z."*  

  ---

  ### **APPLICATION TO YOUR CASES**  
  #### **Case (a): Pre-emptive release of stockpiled countermeasure**  
  - **Context:** High-stakes, irreversible. Experts agree it works but disagree on side effect rate (two camps: Camp A [low risk], Camp B [high risk]).  
  - **Utilities:** Lives saved (net of side effects).  

  **Step 0:**  
  - \(\mathcal{P}_{\text{ignorance}} = \emptyset\) (no ignorance, pure disagreement).  
  - \(\mathcal{P}_{\text{disagreement}} = \{p_A, p_B\}\) (Camp A vs. Camp B distributions).  
  - ❗ Escalation: "Experts disagree; judgment may be needed."  

  **Step 1:**  
  - No pooling; keep both \(p_A\), \(p_B\).  
  - Irrelevant variable test: Not triggered (all variables relevant).  

  **Step 2 (Decision Rules):**  
  - Assume utilities:  
    - Release if low risk: +1000 lives  
    - Release if high risk: -5000 lives  
    - Do nothing: 0  
  - Under \(p_A\): Release expected utility = +1000  
  - Under \(p_B\): Release expected utility = -5000  
  - **Maximin:** \(\min(+1000, -5000) = -5000\) (Do nothing: 0). Acceptable: Do nothing.  
  - **Minimax Regret:**  
    - Regret(release) = \(\max(0 - (-5000), 0 - 1000) = 5000\)  
    - Regret(do nothing) = \(\max(1000 - 0, -5000 - 0) = 1000\)  
    - Acceptable: Do nothing (lower max regret).  
  - **E-Admissibility:**  
    - Do nothing maximizes utility under \(p_B\).  
    - Release maximizes utility under \(p_A\).  
    - Both actions acceptable.  
  - **Admissible set:** Both actions (neither dominates).  

  **Step 3:**  
  - Rules conflict: Maximin and Minimax Regret say "do nothing"; E-Admissibility says both.  
  - Admissible set: {Release, Do nothing}.  
  - ❗ Escalation: "Rules disagree; admissible set has 2 actions."  
  - **Output:** Defensible options = {Do nothing} (per Maximin/Minimax Regret), but escalate due to conflict.  

  **Conclusion:** Procedure flags "do nothing" as robust but forces escalation due to expert disagreement. *Reveals: Maximin/Minimax Regret prioritize avoiding catastrophe when experts clash.*  

  ---

  #### **Case (b): Cheap, reversible mitigation with small chance of high reward**  
  - **Context:** Low cost, reversible. Experts: Single ignorance distribution for effectiveness (\(p(\text{success}) \in [0.001, 0.01]\)).  
  - **Utilities:** Cost = -1 unit (small), Success = +1000 units, Do nothing = 0.  

  **Step 0:**  
  - \(\mathcal{P}_{\text{ignorance}} = \text{uniform over } p(\text{success}) \in [0.001, 0.01]\)  
  - \(\mathcal{P}_{\text{disagreement}} = \emptyset\)  

  **Step 1:**  
  - No disagreement; use full ignorance set.  
  - Irrelevant variable test: Not triggered.  

  **Step 2 (Decision Rules):**  
  - Expected utility for Mitigate: \(\mathbb{E}[u] = -1 + 1000 \cdot p(\text{success})\)  
  - Range of \(\mathbb{E}[u]\): \([-1 + 1000 \cdot 0.001, -1 + 1000 \cdot 0.01] = [0, 9]\)  
  - Do nothing: 0  
  - **Maximin:** \(\min(\mathbb{E}[u]) = 0\) (Mitigate) vs. 0 (Do nothing). Tie → Both acceptable.  
  - **Minimax Regret:**  
    - Best action under \(p\): Mitigate if \(p>0.001\), else Do nothing.  
    - Max regret(Mitigate) = \(0 - 0 = 0\) (when \(p=0.001\))  
    - Max regret(Do nothing) = \(9 - 0 = 9\) (when \(p=0.01\))  
    - Acceptable: Mitigate (lower max regret).  
  - **E-Admissibility:**  
    - Mitigate maximizes utility for all \(p > 0.001\).  
    - Do nothing maximizes utility at \(p=0.001\).  
    - Both acceptable.  
  - **Admissible set:** Both actions.  

  **Step 3:**  
  - Rules: Maximin (tie), Minimax Regret (Mitigate), E-Admissibility (both).  
  - Admissible set: {Mitigate, Do nothing}.  
  - No long-run exploitability (Mitigate is low-risk).  
  - **Output:** Defensible options = {Mitigate} (per Minimax Regret).  

  **Conclusion:** Procedure recommends **Mitigate** (you hate this, but it’s correct). *Reveals: Minimax Regret "breaks the tie" in favor of actions with high upside when downside is capped. Your discomfort likely stems from over-weighting the high probability of failure, but the math is clear: the small cost justifies the lottery ticket.*  

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**  
  1. **Resolve fundamental conflicts:** If rules disagree and leadership won’t escalate, it won’t "force" a decision.  
  2. **Handle intractable credal sets:** If \(\mathcal{P}\) is huge/complex (e.g., 10,000 distributions), computation may be approximate.  
  3. **Replace value judgments:** E.g., "How much risk is acceptable?" is outside scope.  
  4. **Fix bad inputs:** Garbage in, garbage out (e.g., biased experts, poor utilities).  

  ### **MOST LIKELY FAILURE MODE**  
  **Ignorance vs. disagreement misclassification** (e.g., labeling true ignorance as disagreement). This causes:  
  - Over-escalation (if disagreement is over-reported) or  
  - False precision (if ignorance is pooled as disagreement).  
  *Mitigation: Audit expert elicitation; ask experts: "Is your range due to what you don’t know or what others believe?"*  

  --- 

  **Final note:** This procedure makes uncertainty *visible* and forces hard choices upstream. It won’t make decisions easy—but it will make them defensible. Use it as a "source of friction" to trigger conversations that bypass statistical sophistry.
