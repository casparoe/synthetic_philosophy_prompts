  *testing lines* "Here the pattern holds complete" - yes, works for both states. "Waits behind the still" - "still" as noun (silence) and adjective (motionless). Good. The last lines about "listening" and "asking" must feel equally plausible as book descriptions or mental activities. 

  *checks harmony* When all voices sing together, "holds/listens/asks" should blur into one cognitive act. The shelf becomes an ear becomes a question. Perfect. Now to ensure it scans well sung slow: each line must stand alone like a haunted fragment. "Who walks the page alone?" hits different when isolated. 

