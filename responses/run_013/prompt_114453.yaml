  Hmm, they mentioned having a small team part-time for a year. That's a concrete constraint. Their goal is improving real-world collective judgment, so theoretical elegance takes a backseat to implementability. They're explicitly asking for a ranked agenda with reasoning—super practical orientation.

  Interesting how they're questioning where the literature's attention is. They suspect agenda power is the elephant in the room. Smart observation—much of formal neutrality in aggregation rules gets hijacked by whoever frames the questions. And their note about LLM ensembles? Spot on. Everyone's doing multi-agent debates without applying decades of judgment aggregation research to correlation problems.

  Let me unpack their bullet points:
  - "Escape hatches like single-peakedness": They're skeptical these translate to real committees. Rightly so—forcing preference alignment often means suppressing dissent.
  - Agenda control: This might be the nuclear option. If agenda-setting determines outcomes, then improving aggregation rules is rearranging deck chairs.
  - Premise vs conclusion-based: They want to know who benefits. Classic power analysis missing from most papers.
  - Probability vs binary: Important bridge to forecasting research. The Good Judgment Project shows this matters.
  - LLM correlation: Wild that nobody's connecting this. Model monocultures guarantee correlated errors.

  The user's tone suggests they've hit diminishing returns with theory. Phrases like "dead ends" and "underexplored" signal hunger for neglected leverage points. And that final question—"what would change downstream"—reveals a ruthless pragmatism. They'll abandon avenues where answers won't shift practice.

  For their team, I'd prioritize:
