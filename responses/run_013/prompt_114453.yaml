  2. LLM error correlation (biggest unexplored mismatch)
  3. Hybrid probabilistic-binary systems (immediate deployability)

  Why? Because fixing aggregation rules while ignoring agenda control is like building a democracy where only elites propose laws. And the LLM angle? It's where the world is moving while academics aren't looking. The forecasting hybrid gets third place because it's actionable now with known tools.

  Would move items up with new evidence: If someone demonstrates agenda manipulation in real policy settings, or if LLM ensembles start failing catastrophically from hidden correlation. Downweight premises vs conclusions—that debate feels settled.

  Notably, they didn't mention Arrow or other grand impossibilities. Wise. Those are dead ends for their mission. This user knows what they don't need.
answer: |-
  Based on your constraints (3-4 people, 1 day/week, 1 year, practical implementation focus), I'd prioritize **agenda design and control** as the highest-leverage, most-neglected area. Here’s a ranked agenda with reasoning, tractability, neglect status, and downstream impact:

  ### **Ranked Research Agenda**
  1. **Agenda Power & Manipulation Resistance**  
     - **Why upstream?** Determines *what questions get asked* and *in what order*—fundamentally shapes outcomes before voting begins.  
     - **Tractability:** Testable via simulations/experiments with non-experts (e.g., mock committees altering premise order).  
     - **Neglect:** 90% of literature focuses on aggregation rules, not agenda-setting. Theorems assume fixed agendas, but real power lies in framing.  
     - **Downstream Impact:** High. Exposing agenda vulnerability forces groups to formalize question-selection (e.g., random sequencing, multi-agent bidding for agenda items).  
     - *Move up if:* Field evidence emerges of agenda manipulation in corporate/government settings.

  2. **LLM Ensembles as Judgment Aggregators**  
     - **Why upstream?** LLMs are becoming de facto "committees" (e.g., AI councils, multi-agent debates). Their errors are *correlated* (same training data), violating theorem assumptions.  
     - **Tractability:** Run experiments with open-source LLMs (Mistral, Llama) on doctrinal paradox cases. Measure how correlation breaks aggregation rules.  
     - **Neglect:** Near-zero crossover between social choice theory and ML alignment. Huge real-world stakes.  
     - **Downstream Impact:** Critical for AI governance. Designing decorrelation techniques (e.g., diverse fine-tuning, adversarial prompts) could prevent systemic failures.  
     - *Move up if:* Major AI safety incident linked to correlated groupthink in ensembles.

  3. **Hybrid Probabilistic/Binary Systems**  
     - **Why here?** Bridges forecasting (continuous) and judgment (discrete). Most real-world decisions use both ("How likely is X?" → "Should we do Y?").  
     - **Tractability:** Prototype with prediction platforms (e.g., Metaculus + Discord polls). Test aggregation rules like: *"Convert probabilities to binary via thresholds, then apply premise-based voting."*  
     - **Neglect:** Forecasting/judgment communities operate in silos. Few address how to synthesize them.  
     - **Downstream Impact:** Medium-high. Unlocks better risk assessment (e.g., "70% chance of recession + 60% chance of war → Should we stockpile?").  
     - *Move down if:* Proves intractable for non-experts or adds negligible value over separate tools.

  4. **Premise vs. Conclusion-Based: Power Asymmetries**  
     - **Why lower?** Well-studied theoretically, but practical *who benefits?* is underexplored. Premise-based advantages organized factions; conclusion-based advantages status quo defenders.  
     - **Tractability:** Role-playing exercises with stakeholders (e.g., regulators vs. startups). Map winners/losers under each rule.  
     - **Neglect:** Literature debates "fairness," rarely power dynamics.  
     - **Downstream Impact:** Medium. Helps groups choose rules consciously—e.g., startups may prefer conclusion-based to avoid obstruction by niche objections.  
     - *Move down if:* Groups consistently default to one method after testing.

  5. **Single-Peakedness "Escape Hatches": Practical Scaffolding**  
     - **Why lowest?** Theorems assume exogenous preferences. Real groups can *engineer* alignment.  
     - **Tractability:** Design facilitation protocols (e.g., "premise clarification workshops" before voting). Measure if they induce single-peakedness.  
     - **Neglect:** Treated as a miracle condition, not a design target.  
     - **Downstream Impact:** Low-medium. Risk of over-engineering ("just force consensus!"). Only matters for polarized groups.  
     - *Move up if:* Rigorous evidence shows simple interventions prevent paradoxes >80% of the time.

  ---

  ### **Dead Ends & Low-Impact Areas**
  - **Arrow-like Impossibilities:** Proving more theorems won’t help practitioners. **Status:** Avoid.  
  - **Optimal Aggregation Rules:** Marginal gains over simple majority/median. **Status:** Answer wouldn’t change much.  
  - **Full Rationality Models:** Humans don’t compute belief propagation. **Status:** Dead end.

  ---

  ### **Execution Strategy for Your Team**
  1. **Weeks 1-12:** Build testbeds.  
     - LLM paradox simulator (Python + Hugging Face)  
     - Agenda-manipulation game (web-based, e.g., Svelte)  
  2. **Weeks 13-24:** Run experiments.  
     - Recruit 200 participants via Prolific for agenda-power tests  
     - Benchmark 10 LLMs on doctrinal paradox cases  
  3. **Weeks 25-52:** Prototype tools.  
     - **Output:** Open-source "agenda randomizer" for meetings  
     - **Output:** LLM ensemble decorrelation cookbook  
     - **Output:** Hybrid probabilistic/binary decision flowchart  

  ---

  ### **What Changes in 1-2 Years?**
  - **↑ LLM priority** if transformer-based systems displace committees in high-stakes domains (e.g., finance, policy).  
  - **↑ Agenda power** if Web3/DAO governance fails conspicuously due to proposal manipulation.  
  - **↓ Premise/conclusion** if meta-studies show groups naturally converge on one approach.

  Focus on **agenda control** and **LLM correlation**—they’re actionable, neglected, and could redefine how groups reason. The rest optimizes at the margins.
