answer: |-
  ### Decision Tree for Special Claims to Compatriots vs. Strangers

  This decision tree is built from the logical space of positions on whether compatriots have special moral claims. It starts from fundamental commitments and branches through 12 nodes (questions) to 10 leaves (positions). Nodes are phrased as questions answerable without prior knowledge of the positions. The tree separates routinely conflated views (e.g., partiality in membership but not distribution) and identifies unoccupied combinations. Key distinctions (e.g., claim type, ground, conditionality) are integrated throughout.

  ---

  #### **Decision Tree**  
  *Start at Node 1. Answer each question based on your commitments.*

  1. **Do compatriots ever have stronger moral claims on you than strangers?**  
     - **No** → Node 2  
     - **Yes** → Node 3  

  2. **Must we ensure all humans meet a basic threshold of well-being (e.g., avoiding extreme poverty)?**  
     - **No** → **Leaf 1: Impartialist Basic Duties** (Only minimal negative duties to strangers; e.g., libertarian global order)  
     - **Yes** → **Leaf 2: Global Sufficientarianism** (Duty to ensure sufficiency for all; no partiality above the threshold)  

  3. **Does the special claim primarily arise from shared institutions (e.g., states, laws) or from non-institutional ties (e.g., culture, relationships)?**  
     - **Shared institutions** → Node 4  
     - **Non-institutional ties** → Node 7  

  4. **Is the special claim justified because you benefit from the institutions (e.g., through public goods)?**  
     - **Yes** → Node 5  
     - **No** → Node 6  

  5. **Must the institutions be just to all members for the special claim to hold?**  
     - **Yes** → **Leaf 3: Fair-Play Reciprocity** (Duty to reciprocate benefits; void if institutions unjust to any member)  
     - **No** → **Leaf 4: Unconditional Institutional Reciprocity** (Duty to reciprocate regardless of justice; e.g., some statists)  

  6. **Does the special claim apply to resource distribution?**  
     - **Yes** → **Leaf 5: Coercion-Based Statism** (Duty due to shared coercive institutions; focuses on distribution, not membership; e.g., Blake/Rawls-inspired views)  
     - **No** → **Leaf 6: Pure Institutional Exclusion** (Permission to exclude at borders due to institutional boundaries; no distributive partiality)  

  7. **Is the special claim grounded in cultural identity or in the intrinsic value of relationships?**  
     - **Cultural identity** → Node 8  
     - **Intrinsic value of relationships** → Node 9  

  8. **Does the special claim apply to resource distribution?**  
     - **Yes** → **Leaf 7: Liberal Nationalism** (Duty and weighting to favor compatriots; grounded in shared culture; covers distribution and membership)  
     - **No** → **Leaf 8: Cultural Membership Partiality** (Permission to exclude at borders for cultural reasons; no distributive partiality)  

  9. **Is the special claim a duty or a permission?**  
     - **Duty** → **Leaf 9: Associative Duties** (Duty due to relationships themselves; unconditional; covers distribution and membership)  
     - **Permission** → Node 10  

  10. **Must the special claim be balanced against global duties?**  
      - **Yes, it only breaks ties** → **Leaf 10: Cosmopolitan Patriotism** (Permission to favor compatriots if all else equal; e.g., moderate cosmopolitanism)  
      - **No, it outweighs global duties** → **Leaf 9: Associative Duties** (As above; duty overrides)  

  ---

  #### **Logical Space Analysis**  
  *Positions, Occupancy, and Unoccupied Combinations*

  | Leaf Position                     | Type of Claim                     | Ground of Claim                  | Conditionality on Justice | Scope (Distribution/Membership) | Agent       | Priority                  |
  |-----------------------------------|-----------------------------------|----------------------------------|---------------------------|---------------------------------|-------------|---------------------------|
  | 1. Impartialist Basic Duties      | N/A                               | N/A                              | N/A                       | Neither                         | Individuals | None                      |
  | 2. Global Sufficientarianism      | Duty (to strangers)               | Humanity                         | N/A                       | Neither                         | Both        | Global floor first        |
  | 3. Fair-Play Reciprocity          | Duty                              | Reciprocity for benefits         | Yes (void if unjust)      | Both                            | Individuals | After floor               |
  | 4. Uncond. Institutional Reciproc.| Duty                              | Reciprocity for benefits         | No                        | Both                            | Individuals | Lexical                   |
  | 5. Coercion-Based Statism         | Duty and weighting                | Coercive institutions            | Yes (weakens if unjust)   | Distribution only               | States      | After floor               |
  | 6. Pure Institutional Exclusion   | Permission                        | Institutional boundaries         | No                        | Membership only                 | States      | Tie-breaker               |
  | 7. Liberal Nationalism            | Duty and weighting                | Cultural identity                | No                        | Both                            | Both        | Lexical                   |
  | 8. Cultural Membership Partiality | Permission                        | Cultural identity                | No                        | Membership only                 | States      | Tie-breaker               |
  | 9. Associative Duties             | Duty                              | Relationship itself              | No                        | Both                            | Individuals | Lexical                   |
  | 10. Cosmopolitan Patriotism       | Permission                        | Relationship itself              | Yes                       | Both                            | Individuals | Tie-breaker               |

  - **Unoccupied Combinations**:  
    - *Duty grounded in institutions for membership only*: Unoccupied (incoherent—institutions inherently involve distribution).  
    - *Weighting without permission/duty*: Unoccupied (incoherent—weighting implies at least permission).  
    - *Reciprocity-based permission (not duty)*: Unoccupied (unattractive—reciprocity typically implies obligation).  
    - *Conditional cultural partiality*: Unoccupied (undefended—cultural claims are usually seen as intrinsic).  

  - **Conflation Addressed**:  
    - Leaf 6 (exclusion-only) vs. Leaf 5 (distribution-only) separates institutional partiality in membership vs. distribution.  
    - Leaf 8 (cultural exclusion) vs. Leaf 7 (cultural distribution) separates cultural partiality in membership vs. distribution.  

  ---

  #### **Test Cases and Leaf Assignment**  
  *Each case pushes toward a leaf by stressing specific distinctions.*

  1. **Long-term resident lacking citizenship**: Challenges scope (membership).  
     - Pushes to **Leaf 6 (Pure Institutional Exclusion)** if institutions deny membership claims.  
     - Or **Leaf 8 (Cultural Membership Partiality)** if culture grounds exclusion.  

  2. **Compatriot net contributor to unjust scheme**: Tests conditionality and reciprocity.  
     - Pushes to **Leaf 3 (Fair-Play Reciprocity)** if claim voided by injustice.  
     - Or **Leaf 4 (Unconditional Reciprocity)** if claim persists.  

  3. **Compatriot abroad who opted out**: Questions reciprocity ground.  
     - Pushes to **Leaf 9 (Associative Duties)** if claims endure (relationship-based).  
     - Or **Leaf 2 (Global Sufficientarianism)** if claims dissolve (no institutional ties).  

  4. **Child or cognitively disabled compatriot**: Challenges reciprocity and agency.  
     - Pushes to **Leaf 9 (Associative Duties)** or **Leaf 7 (Liberal Nationalism)** if claims don’t require reciprocity.  
     - Weakens **Leaf 3 (Fair-Play Reciprocity)** (if conditionality requires reciprocity).  

  5. **Compatriot advantaged by historical injustice to foreigners**: Tests global priority.  
     - Pushes to **Leaf 2 (Global Sufficientarianism)** if priority requires remedying injustice first.  
     - Weakens **Leaf 4/7/9** if they assert lexical priority for compatriots.  

  6. **Future compatriots bearing costs**: Tests scope (membership) and non-reciprocity.  
     - Pushes to **Leaf 7 (Liberal Nationalism)** or **Leaf 9 (Associative Duties)** if claims extend to future members.  
     - Weakens reciprocity-based leaves (3, 4).  

  ---

  #### **Tree Evaluation**  
  - **Indistinguishable Pair**: **Leaf 9 (Associative Duties)** and **Leaf 7 (Liberal Nationalism)** cannot be separated by the tree when cultural identity and relationships coincide (e.g., in thick communal ties). This mirrors real-world conflation (e.g., in communitarian thought).  
  - **Highest-Impact Node**: **Node 3 (Institutions vs. Non-Institutional Ties)** does the most work. It splits the tree into two major families (institutional vs. cultural/relational), determining the ground, scope, and conditionality of claims.  

  This tree isolates core distinctions, handles hybrid views (e.g., distribution-only partiality), and flags gaps. Use it to diagnose positions in your seminar—e.g., when "cultural partiality" is conflated across issues of distribution and exclusion.
