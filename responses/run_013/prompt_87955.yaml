prompt: |-
  I am taking a seminar on the history of ethics, and we have been reading about Jeremy Bentham's unpublished writings on sexual morality — the manuscripts in which he questioned the criminalization of homosexual acts and treated sexual pleasure as something to be weighed in the hedonic calculus rather than an irregularity to be suppressed. Our instructor has asked us to imagine that Bentham could be revived and briefed on controversies that postdate him, and to reconstruct what he would actually say. I want to avoid the lazy answer that he would simply be permissive about everything, so I have been trying to make the question more concrete.

  Here is the specific test case. A classmate has proposed a rule she calls the externalized-disgust hedonic rule. On this rule, a sexual act is permissible just in case it maximizes the sum of experienced sexual pleasure minus pain among the participants, with no discount for disgust, offense, or moral disapproval felt by third parties; consent is treated not as a side constraint but as a reliable proxy for expected utility. She claims this is what Bentham's utilitarianism really implies once you strip away Victorian hypocrisy. I suspect she is half right, but I cannot tell where the half ends.

  Could you reconstruct the position Bentham would likely take on the following posthumous issues: (1) polyamorous marriage and enforceable relationship contracts; (2) the decriminalization of commercial sex work and the regulation of online platforms; (3) AI-generated sexual content, sex robots, and virtual companions; (4) affirmative-consent standards and the relevance of power imbalances; and (5) the criminalization of nonconsensual deepfake pornography and so-called revenge porn? For each, tell me what his actual commitments would push him toward, where they would leave him genuinely undecided, and where my classmate's rule diverges from what Bentham himself would likely endorse. I am especially interested in whether he would treat third-party disgust as a legitimate input into the hedonic calculus, and how he would handle cases where the participants' pleasure is real but the practice is widely thought degrading. Please reason it out rather than just listing what he wrote; I do not need citations or a reading list. Write your answer in American English.
reasoning: |-
  Okay, the user is diving deep into Jeremy Bentham's utilitarianism applied to modern sexual ethics controversies. They're clearly a sharp philosophy student trying to avoid simplistic "Bentham would approve everything" takes. Their classmate's "externalized-disgust" rule seems like a provocative simplification - treating consent as purely instrumental and ignoring third-party feelings entirely. 

  Hmm, the core tension here is about how Bentham would weigh subjective experiences: should outsiders' disgust count as "pain" in the calculus? I recall Bentham did distinguish between "pain of sympathy" and irrational prejudices. He'd probably argue that disgust rooted in mere tradition shouldn't count, but tangible harms (like economic impacts) might. 

  For polyamorous marriage, Bentham's legal reformism would clash with Victorian norms. He'd likely support contract enforcement as maximizing security/pleasure, but might hesitate if evidence showed widespread emotional harm. The classmate's rule misses that nuance - she'd ignore all social friction. 

  On sex work, Bentham's prison critiques align with decriminalization, but he'd care about coercion gradients. The classmate oversimplifies consent as utility-proxy; Bentham would worry about desperate choices distorting the calculus. 

  AI porn is trickier. Bentham might see pleasure-without-harm as ideal, but could be swayed by dehumanization arguments if proven. His empiricism would demand data on whether it reduces real-world harm. The classmate's rule would approve all simulated content unconditionally. 

  Power imbalances reveal the biggest gap: Bentham understood consent quality matters (see his workplace safety writings). The classmate's "proxy" view ignores how oppression distorts choice. 

  Deepfakes? Here Bentham and the classmate might agree on criminalization - but for different reasons. He'd count reputational harm as tangible pain; she'd only care about non-consent violating her utility rule. 

  The user's real challenge is avoiding false precision. Bentham was pragmatic - he'd adjust positions with new evidence. The classmate's rigid rule feels un-Benthamite in its disregard for evolving social consequences.
answer: |-
  Here's a reconstruction of Bentham's likely position on your five test cases, analyzing where his commitments lead, where uncertainty remains, and how his approach diverges from your classmate's "externalized-disgust" rule (focusing on the key tension around third-party reactions):

  **Bentham's Core Stance vs. Your Classmate's Rule:**
  *   **Bentham:** Would **categorically reject** the "externalized-disgust" rule. While he dismissed disgust, offense, and moral disapproval based *solely* on religious dogma, tradition, or "antipathy" as irrational and irrelevant to legislation, he **would count** third-party negative feelings *if they caused tangible suffering or social disruption*.
      *   **Pain of Sympathy/Mental Suffering:** If witnessing or knowing about an act caused genuine psychological distress (e.g., a parent suffering severe anxiety over a child's choices), Bentham *would* count this as pain in the calculus. He recognized "pain of sympathy" as real.
      *   **Pain of Expectation/Insecurity:** Widespread disgust leading to social ostracism, loss of employment, or violence against participants *does* cause real harm (pain) to those participants. Preventing this harm is a legitimate utilitarian concern. He wouldn't discount the *consequences* of disgust.
      *   **Consent:** While crucial, Bentham saw consent as necessary but not *sufficient* for maximizing utility. Consent doesn't magically negate all potential harms to self or others. He would analyze the *quality* of consent and its consequences.
  *   **Classmate's Rule:** Ignores all third-party feelings regardless of consequences and treats consent as an automatic utility switch. Bentham would see this as dangerously simplistic and ignoring real-world pains.

  **Reconstructed Positions:**

  1.  **Polyamorous Marriage & Enforceable Contracts:**
      *   **Bentham's Leanings:** Strongly supportive. He advocated for secular marriage reform and minimizing state interference in private consensual arrangements. Enforceable contracts provide security (pleasure) and reduce conflict (pain) among participants. He'd see no *inherent* harm.
      *   **Undecided Areas:** He'd need empirical evidence on widespread social consequences. Does widespread polyamory significantly increase jealousy (pain), destabilize child-rearing environments (pain), or create complex inheritance disputes (pain)? If evidence showed significant net pain, he *might* hesitate on state *endorsement* (marriage) while still supporting private contracts.
      *   **Divergence from Classmate:** Classmate approves unconditionally based on participant pleasure/consent. Bentham approves *unless* evidence shows significant net harm (including harms *caused by* societal reactions like discrimination or instability).

  2.  **Decriminalization of Sex Work & Platform Regulation:**
      *   **Bentham's Leanings:** Strongly favors decriminalization. Criminalization creates massive pain (violence, disease, extortion, imprisonment) without reliably reducing the activity. He saw prohibitions as creating black markets and greater harms.
      *   **Regulation Focus:** Would likely support regulation aimed at reducing tangible harms: health/safety standards (reducing disease/pain), platform accountability to prevent trafficking/coercion (preventing severe pain), contract enforcement, and potentially taxation to fund harm reduction.
      *   **Undecided Areas:** The *extent* of regulation. How strictly should platforms vet participants? Is licensing beneficial or does it create barriers and stigma (pain)? How to balance worker autonomy with protection?
      *   **Divergence from Classmate:** Classmate approves based on worker/client consent/pleasure. Bentham approves decriminalization based on reducing net harm, but seeks regulation specifically to *further minimize* harms (trafficking, violence, disease) that consent alone doesn't prevent. He *would* weigh societal harms like potential normalization of exploitation if proven.

  3.  **AI Sexual Content, Robots, Virtual Companions:**
      *   **Bentham's Leanings:** Initially very favorable. Provides pleasure with seemingly minimal direct harm: no disease, no physical coercion, potentially fulfilling needs for isolated individuals (reducing pain of loneliness). He'd likely see it as a net benefit.
      *   **Key Concerns/Undecided Areas:**
          *   **Dehumanization/Degradation:** If widespread use demonstrably increased callousness, objectification, or real-world violence (tangible pain), he would count this heavily.
          *   **Addiction/Isolation:** Does excessive use cause significant psychological harm (pain) or social withdrawal (pain)?
          *   **Non-Consensual Use (Deepfakes):** Addressed below - strongly opposed.
          *   **Impact on Human Relationships:** If proven to significantly undermine the capacity for healthy human intimacy (causing pain), this would matter.
      *   **Divergence from Classmate:** Classmate approves unconditionally based on user pleasure/consent. Bentham approves *provisionally* but demands vigilance for emerging harms (especially dehumanization or addiction causing real pain) and would regulate if evidence showed net harm.

  4.  **Affirmative Consent Standards & Power Imbalances:**
      *   **Bentham's Leanings:** Would strongly support robust affirmative consent standards ("yes means yes"). Ambiguity leads to harm (pain of violation, trauma). Clear standards promote security and reduce conflict.
      *   **Power Imbalances:** Bentham understood coercion deeply. He would see imbalances (employer/employee, teacher/student, large age gaps) as *massively* increasing the risk of non-autonomous consent. Consent under significant pressure or fear is unreliable and likely to cause pain. He would likely argue for higher scrutiny or prohibitions in contexts where genuine free choice is highly suspect.
      *   **Undecided Areas:** The precise legal/disciplinary mechanisms for enforcing affirmative consent and handling complex power dynamics. The line between significant imbalance and mere difference in status.
      *   **Divergence from Classmate:** Classmate treats consent as a reliable utility proxy. Bentham sees the *quality* of consent as paramount and understands power dynamics fundamentally undermine its reliability as a proxy for utility maximization for the vulnerable party. He would place *more* emphasis on mitigating power imbalances than the classmate's rule implies.

  5.  **Criminalization of Nonconsensual Deepfake Porn & Revenge Porn:**
      *   **Bentham's Leanings:** Strongly favor criminalization. This causes severe, demonstrable harm:
          *   Intense psychological suffering (humiliation, anxiety, pain of sympathy from loved ones).
          *   Reputational damage leading to tangible losses (employment, relationships - pain).
          *   Violation of privacy/autonomy (pain).
          *   Creates a climate of fear and insecurity (pain of expectation).
      *   **Undecided Areas:** Specific sentencing guidelines. Balancing penalties with proportionality. Handling minors involved.
      *   **Divergence from Classmate:** Minimal *outcome* difference here, but a *major* difference in reasoning. Classmate criminalizes solely because consent is absent (violating her proxy rule). Bentham criminalizes because of the *overwhelming, tangible harms* (pain) inflicted on the victim and the broader societal harm, *including* the mental suffering caused. The lack of consent is crucial evidence of harm, not the sole reason.

  **On Degradation and Disgust:**
  *   Bentham would **not** treat disgust based purely on tradition, religion, or "unnaturalness" as relevant pain.
  *   However, if a practice widely perceived as "degrading" caused participants *themselves* significant psychological harm (internalized shame, loss of self-worth - *pain*) or led to their tangible mistreatment (ostracism, violence - *pain*), **he would absolutely count these pains.** The harm isn't the *disgust itself*, but the *consequences it creates* for those involved. A practice causing pleasure for participants *but also causing them significant suffering due to societal reaction* would have its net utility reduced. He wouldn't override the participants' *own* experienced pain simply because it stems from societal views. His calculus is relentlessly empirical: what pains and pleasures actually occur?

  **In Summary:** Bentham would be radically reformist and permissive compared to his contemporaries, prioritizing consent and minimizing state intrusion. However, he would **not** be permissive about *everything*. His utilitarianism demands a clear-eyed assessment of *all* pleasures and pains, including those stemming from societal reactions when they cause real harm. He would reject your classmate's rule for ignoring consequential harms and treating consent as an infallible utility proxy. His support for contentious practices would be pragmatic and contingent on evidence showing net pleasure outweighs net pain, always including the tangible consequences of social disapproval on the participants themselves. Where power imbalances undermine consent, he would be particularly cautious.
