  First, I need to diagnose their core anxiety: they're intellectually energized but fear becoming a perpetual reading group without scholarly output. The phrase "spend two years circling half-formed worries" screams analysis paralysis. Their interdisciplinary mix is both their superpower (unique angles on Lakatos) and challenge (divergent epistemic instincts). 

  Looking at their five seed questions through a practicality filter:
  - Q1 (novel fact temporality) feels like a definitional rabbit hole. Resolving it wouldn't radically alter Lakatosian applications, and the literature is already saturated with this debate. Low leverage.
