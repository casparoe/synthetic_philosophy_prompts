prompt: |-
  A crisis standard of care is the plan a hospital or a health authority follows when demand for a scarce, life-sustaining resource — a ventilator, an intensive-care bed, a dialysis slot — exceeds the supply. The plans I have been reading contain a feature I cannot make sense of: they describe two allocation regimes rather than one, and they switch between them according to how severe the shortage is.

  In the ordinary regime, the resource goes to the patient who needs it when it is free. Clinicians certainly judge whether intensive care would do this particular patient any good — a patient for whom it would be futile does not get the bed — but they do not line the waiting patients up and ask which of them would benefit most from the bed. There is no comparative ranking of candidates, and no one is displaced by a later arrival who would do better. In the crisis regime this changes. The protocols abandon arrival order, adopt an explicit aim stated in outcome terms — save the most lives, or the most life-years — and rank patients against one another by a physiological severity score. The same documents then impose constraints that look as though they belong to the other regime. Patients judged unlikely to survive even with the resource are placed in a category that receives comfort care only and is given no access to it. Patients already on a machine who are not improving are, in some versions, reassessed at fixed intervals and may have it withdrawn in favor of a new arrival — while the documents also insist that no patient is abandoned and that those in the category just described receive full palliative attention. Some versions resolve a tie between identically scored patients by lottery rather than by any further clinical or social consideration. And the protocols characteristically disclaim age, disability, quality of life, and social worth as criteria, even though the scoring system they rely on is a physiological measure that will track some of these things imperfectly.

  Set aside the question of which allocation rule is best. I want to know what this practice presupposes. What conception of a patient's claim on the resource does each regime require? Under the ordinary regime, does arrival order presuppose that the claims are equal and that a queue is a fitting way to honor equal claims, or is it merely a coordination device that no one has reason to respect once the stakes rise? What does the crisis regime presuppose about the unit of value — lives, life-years, or something else — and is it committed to aggregation and to a definite form of interpersonal comparability? Does the practice require the allocation question to be comparative (who benefits most) or categorical (will this patient benefit), and can it survive the other answer? What does the categorical classification of the likely-to-die presuppose about the value of the resource — that it has no palliative use, or that its only value is rescue? Does periodic reassessment commit the practice to a purely forward-looking, non-historical view of entitlement, on which having received the resource confers no claim to keep it, and does that conflict with the ordinary medical norm against abandoning a patient once treatment has begun — or with the disclaimer of abandonment itself? Do the disclaimed criteria express a genuine constraint on the objective, or are they only forbidden as explicit tiebreakers, with the physiological score reintroducing them under another name? And finally: can a single theory license both regimes — a threshold deontology, a rule-consequentialism whose rules are selected for different decision situations, a prioritarian view that converges on maximization in emergencies, or a two-level structure in which the ordinary regime is governed by a fairness norm that is itself justified consequentially? Or does the practice require genuinely plural commitments, so that it is underdetermined rather than inconsistent?

  Reconstruct the implicit theory. Distinguish what the practice strictly presupposes from what it merely fits well with, mark the places where rival theories would license the same conduct, identify the single most load-bearing commitment, and say what would have to change if that commitment were replaced.

  Deliver a brief prose reconstruction — no more than a few hundred words — followed by a structured summary as a single JSON object with exactly these fields:

  - `central_tension`: string. The apparent inconsistency in the practice, in one or two sentences.
  - `commitments`: array of objects, each with `feature_of_practice` (string, the concrete element of the protocol), `presupposed_commitment` (string), `rival_views_excluded` (array of strings, the alternatives the practice cannot accommodate), `status` (string, either `"strict"` or `"merely_compatible"`; use `"strict"` only if the practice would be unintelligible without the commitment), and `load_bearing` (boolean).
  - `value_theory`: object with `unit_of_value` (string), `aggregation_required` (boolean), `comparability_assumed` (string), and `evidence` (string, the features of the practice that support the attribution).
  - `single_theory_verdict`: object with `one_theory_can_license_both_regimes` (boolean), `candidate_theory` (string), `why` (string), and `where_it_fails` (string).
  - `underdetermined_aspects`: array of strings.
  - `most_load_bearing_commitment`: string.
  - `counterfactuals`: array of objects, each with `commitment_replaced_by` (string) and `required_change_in_practice` (string).

  Every field must be present and filled; strings may be terse, but no field may be left empty, and the JSON must parse.
reasoning: |-
  Hmm, the user presents a detailed analysis of crisis standards of care protocols, asking me to reconstruct the implicit ethical theory behind their two-regime structure. This is a complex philosophical and bioethical inquiry requiring careful unpacking.

  The core tension lies in how protocols switch between arrival-based allocation during normal operations and utilitarian ranking during crises, while maintaining contradictory elements like non-abandonment clauses. I need to analyze what each feature presupposes about patient claims.

  For the ordinary regime, first-come-first-served suggests either equal claims honored through queuing or mere coordination. Since clinicians still assess futility (categorical benefit), it's strictly committed to non-comparative claims and historical entitlement - excluding prioritarianism or social worth criteria. The crisis regime's physiological scoring strictly requires comparative assessment and aggregation of life-years (given tracking of factors like age), excluding deontological equality. But the disclaimers of explicit social criteria are merely compatible with anti-discrimination, not strictly required.

  The palliative care contradiction is revealing: assigning no value to resource use for the dying presupposes purely rescue-oriented valuation, conflicting with commitment to comfort care. Periodic reassessment strictly requires forward-looking entitlement, directly clashing with ordinary norms against withdrawing treatment.

  Can one theory unify this? Rule-consequentialism fits best - different rules for different scarcity levels, with ordinary fairness preventing exhaustion of trust. But it fails to fully resolve the historical/forward-looking tension in resource withdrawal.

  Key underdetermined aspects include whether physiological scores inadvertently reintroduce disavowed criteria, and whether tie-breaking by lottery implies genuine equality or mere proceduralism. The most load-bearing commitment is comparative assessment in crises - replacing it would require abandoning outcome maximization.

  If I replace the non-abandonment norm with pure consequentialism, withdrawal criteria would need strengthening. If aggregation were rejected, first-come-first-served would extend into crisis mode. The JSON output will structure these insights precisely.
answer: |-
  ### Prose Reconstruction
  The crisis standard of care practice presupposes a hybrid ethical framework grounded in rule-consequentialism, where allocation rules shift based on scarcity severity. The ordinary regime operates under a fairness norm: patients have equal, non-comparative claims to resources, honored through arrival order. This requires categorical benefit assessment (futility filtering) and historical entitlement—once treatment begins, it cannot be withdrawn for newcomers. The crisis regime abandons this for strict aggregation of life-years via physiological scoring, demanding comparative assessment to maximize total benefit. This shift presupposes that extreme scarcity invalidates queuing as a coordination device and justifies overriding equal claims.  

  Constraints reveal tensions: categorically excluding "unlikely to survive" patients assumes resources have only rescue value, not palliative utility. Periodic reassessment enforces forward-looking entitlement, conflicting with the ordinary regime’s anti-abandonment norm. Disclaimers of age/quality-of-life criteria are merely compatible with avoiding explicit discrimination but do not prevent physiological scores from imperfectly tracking them. Tie-breaking by lottery inconsistently reintroduces equality in a regime otherwise committed to maximization.  

  A single rule-consequentialist theory licenses both regimes: ordinary rules promote trust and coordination, while crisis rules maximize lives saved when stakes escalate. However, this fails to reconcile the historical/forward-looking entitlement clash in resource withdrawal, revealing a genuine inconsistency masked by palliative care assurances. The practice remains underdetermined on whether physiological scores covertly encode disavowed criteria and whether "no abandonment" is a substantive constraint or rhetorical gesture.  

  ---

