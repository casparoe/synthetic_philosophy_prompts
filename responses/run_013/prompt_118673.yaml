prompt: |-
  I'm a novelist, about 60,000 words into a book set on a made-up island where the villagers settle everything by drawing lots, and I've hit a wall that's less to do with plot than with what my Lot-keeper is allowed to say when someone calls a draw unfair. So: here are my gut verdicts on a pile of draws, and what I want back is the principle behind them, if there is one — or the two or three rival principles, with the case that forces each clause. No reading lists, please. I won't read them, and what I need is the argument, not the shelf.

  The draws, and how I feel about them:

  Spinning a needle on a dial to pick a direction to walk: fair, no one could object.

  Picking a spot in the circular common by choosing a direction from the middle and then a distance along it, both at random: not fair. Everyone ends up milling about the middle of the field.

  Picking a spot by choosing a random easting and a random northing inside the square that boxes the common, then throwing out any that fall outside the circle: fair.

  Picking a spot by choosing a random easting and taking the top edge of the circle at that easting: not fair. The east and west sides get picked far too often.

  Stretching a fence between two random points on the rim of the common: I want to say fair. Dropping a pin at a random spot inside the common and running the fence through it at a random angle: I want to say fair too. But those two rules disagree about how often the fence passes close to the well at the middle, and about how often it cuts off a strip smaller than a third of the field, so one of them must be wrong. I definately can't see how both can be fair, and this is the one that keeps me up. (I gather it's the old chord business — Bertrand's?)

  Picking a distance from the middle and running the fence at right angles to that line at that distance: feels like cheating in the same way the direction-and-distance spot does.

  'Split the wine at a random ratio between the two houses': I don't think that's a draw at all until you say whether you mean indifferent over wine-to-water or water-to-wine, and the two give seperate answers.

  'Draw a random whole number': there's no such draw. A character who says the chance of it being even is one half should be made to say what physical thing they're doing.

  The tile workshop makes square tiles no wider than two spans. 'Draw a tile at random' — how likely is it to be no wider than a span? Indifferent over the side gives one answer, over the area another, over the perimeter another. My gut says the fair draw is whatever the actual cutting does, and that with no process there's no fact of the matter.

  A random point on the globe, and then you're told it's on the equator: fine by me, provided I know how the news would have reached me. Ask 'is it on this meridian?' and I'd say one thing; ask 'is it at this latitude?' and I'd say another.

  A random point on an endless plain, and how likely it is to be within a mile of the well: no answer. The question's broke, not hard.

  My half-formed rule is that a draw is fair if it's indifferent between exactly the things the villagers couldn't tell apart — which I take to be the symmetries of the shape you're drawing from. But that seems to let both fence rules through, since the rim has its own symmetry and the field has its own, so it can't be the whole story.

  What I want: the principle, or the rivals, stated precisely, with the case that motivates each clause; which of my verdicts it forces me to give up, and why that one rather than another; and what it predicts for cases I haven't listed — a random point on the surface of a ball picked by choosing a random latitude and a random longitude; a random great circle on a ball picked by choosing a random point and a random direction at it; a triangle made by picking three points on a rim at random, and whether it contains the middle; and a random point on a straight road that runs for ever. If the honest answer is that half these questions have no answer until you name a physical process, say that plainly — I can write a character who says it.

  Please do it in British English. I'm fussy about spellings and my copy-editor is worse.
reasoning: |-
  Okay, let me tackle this novelist's problem. They're stuck on what makes a draw "fair" in their fictional village that uses lots for decisions. They've listed several scenarios with their intuitive judgments and want underlying principles. 

  First, I notice their core struggle is between mathematical ideals and physical implementation. Their half-formed symmetry principle makes sense but fails for Bertrand's paradox cases. The fence examples show exactly this conflict - same problem, two "symmetric" methods, different outcomes.

  Hmm, the key insight seems to be that fairness requires specifying the physical randomization mechanism, not just the abstract outcome space. Their tile workshop example nails this - without knowing how tiles are produced, there's no "correct" probability. That resonates with their globe example where the method of receiving information matters.

  For the fence paradox, I should explain that both methods are mathematically valid but represent different physical processes. Choosing points on rim versus dropping a pin inside are fundamentally different mechanisms. The character arguing fairness must therefore declare their randomization apparatus.

  Their rejected examples reveal important patterns. The common-field distance method fails because radial distance isn't uniform in Cartesian space. The easting-only method ignores geometric distortion. These point to the importance of measure preservation under symmetries.

  The "no answer" cases are particularly telling. Infinite plains and undefined processes highlight that probability requires bounded spaces or specified generators. This supports the principle that fairness is procedural, not platonic.

  For their requested test cases: 
  - Spherical coordinates will distort areas unless weighted properly
  - Great circles via point+direction needs careful angle weighting 
  - Triangular inclusion probability depends entirely on point selection method
  - Infinite roads simply can't have uniform randomness

  The competing principles I see are:
  1) Geometric symmetry (mathematical ideal)
  2) Physical realizability (what generators exist)
  3) Measure invariance (preserving uniformity under transformations)

  Each has merit but conflicts arise when symmetries don't commute. The fence paradox epitomizes this - rotational vs radial symmetries can't both be satisfied simultaneously.

  I'll structure the response to first state the core principle (fairness requires specified mechanism), then show how it resolves each example, finally presenting the three philosophical approaches villagers might debate. The Lot-keeper's role is to insist on explicit generators - that becomes their narrative purpose.
answer: |-
  Right then. The core principle you're wrestling with is **measure invariance**, and the fundamental conflict arises when multiple, equally "natural" symmetries exist but *disagree* on what constitutes a "fair" draw. The fair draw isn't inherent in the *shape* alone; it's defined by the *physical randomisation mechanism* used to generate it. Without specifying the *how*, many draws are fundamentally ambiguous – Bertrand's Paradox (your fence) is the classic demonstration of this.

  Here's the breakdown, in British English, as requested:

  **The Core Principle (The Lot-keeper's Doctrine):**
  "A draw is fair only if the physical randomisation process is explicitly declared and consistently applied. Fairness means the process treats indistinguishable states (as defined by the *mechanism's inherent symmetries*) identically. **The outcome's probability is determined solely by the mechanism, not by the abstract description of the outcome space.**"

  **The Rival Principles & Their Motivations:**

  1.  **Geometric Symmetry Invariance (The Idealist):**
      *   **Principle:** "Fairness means invariance under *all* geometrically natural symmetries of the *outcome space* itself. If points look the same after rotating, reflecting, or scaling the shape, they should be equally likely."
      *   **Motivation:** Appeals to pure reason and visual indistinguishability. It seems intuitively obvious that a perfectly symmetrical shape shouldn't favour one point over another that looks identical. *("Why should this spot be more likely than that one, just because it's rotated?")*
      *   **Fatal Flaw (Bertrand's Paradox):** This principle is **internally inconsistent**. Your fence example proves it. The circular field has rotational symmetry (favouring the "rim points" method) *and* translational symmetry within the disc (favouring the "drop a pin" method). These symmetries *disagree* on the probability of events like "fence passes near the centre" or "fence cuts off a small strip". You *cannot* satisfy both simultaneously. Therefore, this principle is impossible to apply consistently.

  2.  **Physical Generator Primacy (The Mechanist):**
      *   **Principle:** "Fairness means indifference between *physically distinct ways the generator can be set or operated*. The 'things the villagers couldn't tell apart' are the *states of the randomisation device itself*, not the final geometric points. The measure is defined by the generator's operation."
      *   **Motivation:** Grounds probability in tangible reality. Avoids Bertrand's paradox by acknowledging that different physical processes (even for the same abstract outcome) lead to different probabilities. Probability is a property of the *process*, not the *shape*. *("How you spin the dial, drop the pin, or roll the die determines what's fair.")*
      *   **Clarification:** This is the core principle stated above. It resolves ambiguity by demanding specificity.

  3.  **Uniform Parameterisation (The Naive Formalist - Often Mistaken):**
      *   **Principle:** "Fairness means choosing parameters 'at random' in a 'natural' way (like Cartesian coordinates, angles, distances) and assuming uniformity over those parameters."
      *   **Motivation:** Simplicity and ease of calculation. Feels mathematical. *("Just pick an angle and distance uniformly.")*
      *   **Fatal Flaw:** "Natural" parameterisations often conflict and *do not* correspond to geometric uniformity or physical indifference. Choosing a uniform distance and uniform angle does *not* yield uniform points over the disc (as you spotted). Choosing a uniform x-coordinate does *not* yield uniform points along a circle's top edge. This principle is frequently wrong (as per your gut) because it ignores how parameter choices distort the measure relative to the geometry or the physical generator.

  **Applying the Principles to Your Verdicts (Mechanist Perspective):**

  *   **Spinning needle on dial:** **Fair.** Mechanism is clear: uniform random angle. Symmetry: rotation of the dial. Indistinguishable states: different dial orientations.
  *   **Direction + Distance (common):** **Unfair.** Mechanism defined: uniform random angle, uniform random distance. Symmetry: rotation of direction. But this *doesn't* produce uniform points; it clusters near the centre. The villagers *could* physically distinguish points near the centre from points near the rim by their frequency. They *should* object.
  *   **Random Easting/Northing, reject if outside circle:** **Fair.** Mechanism is clear: uniform random point in the bounding *square*, reject if outside circle. Symmetry: translation within the square. Indistinguishable states: different positions within the square grid used for generation. The rejection is part of the defined process.
  *   **Random Easting, take top of circle:** **Unfair.** Mechanism defined: uniform random x-coordinate, always take max y. This favours the sides enormously, as you said. The generator states (different x-values) are treated uniformly, but this maps non-uniformly onto the circle. Villagers at the sides *can* physically distinguish their higher selection rate.
  *   **Fence: Two random rim points:** **Fair.** *If the mechanism is explicitly:* "Choose two points independently and uniformly from the circular rim." Symmetry: rotation of the rim. Indistinguishable states: different pairs of rim locations (rotated equally).
  *   **Fence: Random spot + Random angle:** **Fair.** *If the mechanism is explicitly:* "Choose a point uniformly at random within the disc, then choose a direction uniformly at random." Symmetry: translation within the disc, rotation of direction. Indistinguishable states: different centre points, different directional orientations.
  *   **Why both fence rules *can* be fair (Mechanist Triumph):** They use *different physical mechanisms* with different inherent symmetries. The rim-points method cares about the boundary's symmetry. The pin-and-angle method cares about the interior's symmetry. **Bertrand's Paradox isn't a paradox; it's proof that the abstract question "pick a random chord" is meaningless without the generator.** The Lot-keeper must demand which process is used. The disagreement about the well or small strips arises *because* they use different processes.
  *   **Fence: Random distance + Right Angle:** **Unfair.** Mechanism defined: uniform random distance from centre, fixed right angle. Similar to direction+distance spot. Favours smaller radii. Villagers near the centre can distinguish their higher fence frequency. The fixed angle breaks rotational symmetry unnecessarily.
  *   **Split wine at random ratio:** **Ambiguous!** Not a draw until mechanism specified. "Indifferent over wine-to-water" (uniform ratio r: 0<r<1) vs. "indifferent over water-to-wine" (uniform ratio s: 0<s<∞ where s=1/r) are *different physical processes* leading to different distributions. The Lot-keeper must demand which generator is used (e.g., uniform position on a stick marked 0-1 for wine proportion, vs marked 0-∞ for water-to-wine ratio). No single "fair" answer without the process.
  *   **Draw a random whole number:** **Impossible.** No physical process can generate "all whole numbers uniformly at random". Any finite device (dice, wheel, lottery machine) has a maximum number. Any infinite process (waiting time decay) isn't uniform. The character claiming P(even)=1/2 is spouting naive formalism without a generator. The Lot-keeper should declare this invalid or demand a bounded range.
  *   **Tile 'at random':** **Ambiguous!** No mechanism, no answer. "Indifferent over side length" (uniform side S: 0<S≤2) gives P(S≤1) = 1/2. "Indifferent over area" (uniform area A: 0<A≤4) gives P(A≤1) = 1/4 (since S≤1 implies A≤1). "Indifferent over perimeter" gives another answer. **Your gut is correct:** "Fair" depends *entirely* on the "actual cutting process". Does the tile maker set a side length uniformly? Do they pour glaze uniformly over area? Without knowing, there's no fact of the matter. The Lot-keeper must demand the process specification.
  *   **Globe point + Equator news:** **Fair, conditional on the mechanism.** The key is "provided I know how the news would have reached me". The conditional probability depends entirely on the *original global sampling mechanism* and the *method of reporting*. Uniform point on sphere + "Is it on *a specific meridian*?" (line of longitude) vs "Is it on *a specific parallel*?" (line of latitude) yield *drastically* different answers because meridians and parallels have different lengths and sampling properties relative to a uniform point on the sphere. The Lot-keeper needs the full generator and reporting protocol.
  *   **Endless plain + Well:** **Invalid.** As you said, "no answer". No physical process can generate a "uniform random point on an infinite plane". Any real process (throwing a dart, walking a random distance) implies a non-uniform distribution favouring some origin. The question is "broke". The Lot-keeper should reject it.

  **Your Half-Formed Rule vs. Mechanist:**
  Your rule ("indifferent between things villagers couldn't tell apart — symmetries of the shape") is the *Idealist* principle. It fails because the shape often has *competing* symmetries (rim vs. interior for the circle). The *Mechanist* principle refines this: "indifferent between states *of the generator* that the villagers couldn't tell apart *in its operation*". It forces specification of the *how*.

  **Predictions for Your Cases (Mechanist Perspective):**

  1.  **Random point on sphere via random latitude φ (-90° to 90°) & random longitude θ (0° to 360°):** **Unfair.** Uniform φ distorts areas, favouring the poles. Points near the poles are over-represented compared to points near the equator. (Generator states: uniform φ, uniform θ. This doesn't correspond to uniform area). *Fair method:* Uniform cos(φ) for latitude (or equivalent), uniform θ; OR generate uniform (x,y,z) on unit sphere and reject if outside, etc. **Lot-keeper insists:** "How is the latitude chosen? Uniform degrees? Or uniform in a way that treats equal areas equally?"
  2.  **Random great circle via random point + random direction at it:** **Fair.** *If mechanism is:* "Choose a point uniformly at random on the sphere (using a fair method), then choose a direction (azimuth) uniformly at random from 0 to 360°." Symmetry: rotation of the sphere, rotation of direction at a point. This is a standard, valid way to generate a random great circle uniformly (invariant under rotation).
  3.  **Triangle by three random rim points:** **Fair.** *If mechanism is:* "Choose three points independently and uniformly from the circular rim." Symmetry: rotation of the rim. The probability it contains the centre is calculable (it's 1/4 for a circle). **Lot-keeper accepts** the defined rim generator.
  4.  **Random point on infinite straight road:** **Invalid.** Identical to the endless plain problem. No uniform distribution possible. **Lot-keeper rejects it.** Must specify a bounded segment or a non-uniform process (e.g., Gaussian distribution centred on a well).

  **The Lot-keeper's Script:**
  "Hold! You cry 'unfair', but fairness resides in the *act*, not the *outcome* alone. Did we spin the rim-dial or drop the field-pin? Did we cut tiles by side or by area? Did we mark the wine-stick from water or from wine? Name your generator truly, the physical means of indifference, *then* we may judge the draw. Without the *how*, the 'it' is void. State your mechanism, or hold your peace."

  This gives your character a clear, defensible (though perhaps frustrating to villagers wanting simple answers) philosophical stance grounded in the unavoidable reality demonstrated by Bertrand and your own examples: **Probability is physical.**
