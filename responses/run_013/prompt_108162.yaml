  ### In-Class Game: The Compounding Coin Challenge

  #### **Game Setup**
  - **Coin Payoff Structure**:  
    - Fair coin with hidden bias: Probability of heads (win) = 60%, tails (loss) = 40%.  
    - **Bet outcome**:  
      - **Win**: Staked amount doubles (e.g., bet 40 chips → return 80 chips).  
      - **Loss**: Staked amount lost.  
    - Multiplier per round:  
      - Win: Bankroll × (1 + *f*) (where *f* = fraction staked).  
      - Loss: Bankroll × (1 – *f*).  
  - **Starting Bankroll**: 100 chips per student.  
  - **Rounds**: 10 rounds (allows compounding to manifest without excessive time).  
  - **Display**:  
    - **Public Spreadsheet** (projected): Shows anonymized bankrolls (Player 1 to 16) after each round. Columns: Player ID, Bankroll, Stake Fraction (*f*).  
    - **End-Round Summary**: Histogram of bankrolls, top/bottom 3 performers (by ID), median bankroll.  
  - **Timeline** (90 mins total):  
    - **Introduction (10 mins)**: Explain rules, goal ("maximize final bankroll"), and privacy of stakes.  
    - **Rounds 1–5 (15 mins)**: 3 mins/round (flip → stake input → update).  
    - **Mid-Game Complication (10 mins)**: Offer side contract at start of Round 6.  
    - **Rounds 6–10 (15 mins)**: Continue gameplay.  
    - **Debrief (40 mins)**: Structured discussion.  

  ---

  #### **Mid-Game Complication: The "Volatility Shield" Contract**  
  - **Offer at Round 6 Start**:  
    > *"Pay 15 chips NOW to buy insurance: If this round is a LOSS, you get 30 chips back AFTER the bet. If it’s a WIN, you get nothing."*  
  - **Pricing Logic**:  
    - **Arithmetic EV**: (40% chance of loss × 30 chips) – 15 = +2 chips (favorable).  
    - **Geometric EV**: Hurts growth *unless bankroll is large*. For a player with 100 chips:  
      - Expected log growth without contract:  
        `0.6 × log(1+*f*) + 0.4 × log(1–*f*)`.  
      - With contract: Bankroll reduced by 15 chips *before* betting → lower compounding base.  
      - **Key**: The contract’s additive payout (30 chips) doesn’t scale with bankroll. At 100 chips, expected log growth decreases by ≈0.01 (detrimental). At 200+ chips, it becomes beneficial (geometric EV >0).  
  - **Correct Move**: Reject if bankroll ≤150 chips; accept if >150.  
  - **Why it tricks memorizers**:  
    - A student who knows "bet edge/odds" but ignores bankroll size may accept (positive EV).  
    - In reality, it drains compounding potential for typical players (bankrolls ~100–150 after 5 rounds).  

  ---

  #### **Debrief: Mapping Game to Core Concepts**  
  1. **Positive EV ≠ Long-Term Profit (Volatility Drag)**:  
     - **Game Moment**: Students who bet >50% (*f* = 0.6–1.0) likely went bust or lost value despite 60% win chance.  
     - **Reinforce**: "Your *arithmetic* expectation was positive, but *compounding* amplified losses. Rationality here is geometric, not arithmetic."  

  2. **Growth-Optimal Fraction & Asymmetry**:  
     - **Game Moment**: Median bankroll peaks at *f* ≈ 0.2 (Kelly-optimal). Those betting *f* > 0.4 crashed harder than *f* < 0.1 underperformers.  
     - **Reinforce**: "Over-betting destroys wealth faster than under-betting—a convexity penalty. Optimal *f* balances edge and variance."  

  3. **Ensemble vs. Time Average (Non-Ergodicity)**:  
     - **Game Moment**: Avg. bankroll (ensemble) after Round 10 >> median bankroll (typical player).  
     - **Reinforce**: "The *average outcome* across players (ensemble) is rosier than what any single player lives through (time average). Wealth compounds multiplicatively, not additively."  

  4. **Arithmetic Mean > Geometric Mean (Variance Tax)**:  
     - **Game Moment**: Compare two players:  
       - Player A: Won 6/10 rounds, bet *f* = 0.4 → geometric growth ≈1.014/round.  
       - Player B: Won 6/10 rounds, bet *f* = 0.2 → geometric growth ≈1.020/round.  
     - **Reinforce**: "Player A’s *arithmetic* growth (1.04) beat Player B’s (1.02), but variance dragged their *geometric* growth below B’s."  

  ---

  #### **Addressing Temptations & Wider Rationality**  
  - **"This is just for gamblers!"**:  
    - Counter: "Multiplicative dynamics are everywhere: repeated investments, R&D pipelines, ecosystems. If your wealth/impact compounds, *expected log* is the rational objective."  
  - **"Caution is the lesson"**:  
    - Counter: "No—betting *f* = 0.2 isn’t cautious; it’s optimal. Betting *f*=0 leaves money on the table. This is max *growth*, not min risk."  
  - **"What’s the true probability?"**:  
    - **Response**: "If your edge is overestimated, Kelly over-bets. Hence, fractional Kelly (e.g., bet ½ of *f*<sup>*</sup>) hedges uncertainty. But today’s lesson: *Given* an edge, how do we bet? Estimation is tomorrow’s topic."  

  ---

  #### **Predictable Failure Modes & Fixes**  
  1. **Randomness Doesn’t Cooperate**:  
     - E.g., Heads = 8/10 rounds → high bettors thrive.  
     - **Fix**: Pre-generate a coin-flip sequence with 6 heads, 4 tails (mirroring *p*=0.6). Use this sequence live.  

  2. **Students Copy Stake Sizes**:  
     - **Prevention**: Stress anonymity and self-interest in intro; require written reasons for *f* in Rounds 1 and 6.  
     - **Fix**: If convergence occurs, contrast pre-computed outcomes for *f* = 0.1 vs. 0.5 using the same flip sequence.  

  3. **"Gambling Mentality" Overrides Decision Focus**:  
     - **Prevention**: Open with: "This is epistemology—we’re stress-testing rationality, not gambling." Award "epistemic points" (e.g., stickers) for students who articulate geometric reasoning post-game.  
     - **Fix**: In debrief, ask: "Did your *f* optimize growth, or thrill?"  

  4. **Time Shortage**:  
     - **Streamline**: Skip histogram displays; only show top/bottom/median. Use spreadsheet macros for instant updates.  

  ---

  #### **What the Activity Can’t Teach (Requires Your Input)**  
  - **The Kelly Formula Itself**: The game *shows* *f*<sup>*</sup> ≈ 0.2 is optimal but doesn’t derive *f*<sup>*</sup> = *p* – (1 – *p*) = 0.6 – 0.4 = 0.2. Post-game, prove this via maximization of *E[log(1 + fX)]*.  
  - **Generalizability**: The activity uses binary bets, but Kelly applies to portfolios, continuous bets, etc. Highlight this transition: "Geometric rationality scales to any multiplicative process—not just coins."  

  ---  
  By the end, students will viscerally grasp why "maximize expected log" isn’t just risk aversion—it’s the iron law of compounding worlds. The Volatility Shield contract ensures they confront the difference between isolated-EV and compounding-optimal choices.
