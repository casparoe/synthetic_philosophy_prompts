prompt: |-
  I'm a philosophy PhD student who's been doing a part-time embedded thing with a lab's safety team for the last year — mostly sitting in on their model review meetings — and there's something about the shape of the practice that I can't stop chewing on. Every time a new model finishes training, before it goes anywhere near users, they run what they call dangerous capability evals: a set of standardized tasks probing whether the model can actually help someone do specific bad things (design a nasty pathogen, find and exploit a vulnerability in real software, run a persuasion campaign at scale), they score it, and if the score crosses a threshold the model gets held back regardless of anything else about it. Whats striking is how deliberately those evals are kept away from the alignment side of the house. The capability scores get run on base models or lightly tuned ones, the evaluators are told explicitly not to worry about what the model is trying to do, and the score is treated as a property of the model — one number that's supposed to mean the same thing no matter what the model's dispositions turn out to be. Then in the same meeting, whenever someone has to justify why the threshold exists at all, the argument is always the power-seeking story: a system that good at bio design will, whatever its goals happen to be, end up in a position to grab more resources, dodge being shut down, resist correction, and so on, so capability is the thing to measure and capability is the thing to worry about. A postdoc told me the first half of what I'm describing is just the orthogonality thesis and the second half is instrumental convergence and that I was confusing them, which may be true, but I want to know which one the actual practice is leaning on.

  So: what is this practice presupposing, exactly? That capability and motivation come apart, so you can hold the first fixed and vary the second, and the eval measures something real independently of what the model wants? That there's a goal-independent notion of how capable a system is, or at least a goal-independent notion of how dangerous its capabilities are? That instrumental drives converge across goals, which is what turns a capability score into a threat score no matter what the goal is? Are those three the same commitment or three different ones, and which does the practice genuinely need versus which is just the story people tell when a funder asks? The part I really want is the counterfactual: if we stopped believing capabilities and values are seperable — if we thought training bakes them into one package, so that being able to do X isn't well-defined apart from being disposed to do X — what breaks first? Can the practice survive on per-goal threat assessment instead of a single capability number, or does it need the convergence claim in order to say anything at all? And is there a hidden fourth commitment, that more capable always means more dangerous, which I suspect is stronger than either of the two theses and not implied by them?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a philosophy PhD student working with a lab's safety team. The core of their confusion revolves around the practice of dangerous capability evals and the underlying philosophical assumptions. They mentioned that the lab keeps capability evals separate from alignment work, focusing solely on the model's ability to perform harmful tasks without considering its intentions. The postdoc they talked to cited the orthogonality thesis and instrumental convergence, but the user isn't sure which one the practice is actually leaning on.

  First, I need to recall what orthogonality thesis and instrumental convergence mean. Orthogonality thesis, from Nick Bostrom, says that any level of intelligence can be paired with any goals. Instrumental convergence suggests that certain subgoals (like self-preservation or resource acquisition) are useful for almost any terminal goal. The lab's practice treats capability as separate from alignment, which seems to align with orthogonality. But when justifying the threshold, they use the power-seeking argument, which is instrumental convergence. 

  The user is asking which of these the practice presupposes. They also question whether capability can be defined independently of goals. If capabilities and values aren't separable, what happens to the practice? They want to know the counterfactual: if capabilities and values are baked together, does the practice collapse?

  Breaking down the user's explicit questions: They list three commitments—capability/motivation separation, goal-independent capability danger, instrumental convergence turning capability into threat. They ask if these are the same or different, and which the practice genuinely needs. Also, they suspect a fourth commitment: that more capability always means more danger.

  The user's deeper needs might include understanding the philosophical foundations of AI safety practices. As a philosophy student, they might be looking to critique or refine these practices. They might also be concerned about the real-world applicability of these theses, especially if there's an inconsistency in how the lab uses them. Their mention of funders suggests they're interested in the gap between theoretical justification and practical necessity.

  I should consider how the practice relies on each thesis. The separation of capability evals from alignment points to orthogonality. The justification using power-seeking relies on instrumental convergence. The capability score as a threat indicator needs both. If orthogonality is false, capability isn't measurable independently of goals, undermining the evals. If instrumental convergence is weak, then high capability doesn't necessarily lead to danger, making the threshold less meaningful.

  The user's counterfactual is crucial. If capabilities and values aren't separable, the practice would need per-goal threat assessments. But that's impractical with base models whose goals aren't known. The lab's method needs a way to assess danger pre-deployment, which requires assuming that capability alone, combined with convergent drives, indicates risk.

  The fourth commitment—more capability always being more dangerous—isn't strictly implied by the theses. A highly capable model could be aligned to resist misuse. But the practice likely assumes that higher capability increases risk, especially since they set thresholds.

  I should structure the response to address each part: the presuppositions, the necessary commitments, the counterfactual scenario, and the hidden assumption. Highlighting that the practice needs both theses but for different aspects. Emphasize that without orthogonality, the capability evals don't make sense, and without instrumental convergence, the scores don't translate to threat. Also, note that the "more capable = more dangerous" is a practical heuristic rather than a logical necessity.
answer: |-
  Your dissection is razor-sharp, and the postdoc oversimplified. The lab's practice **depends on both the Orthogonality Thesis (OT) *and* Instrumental Convergence (IC) working in tandem, applied in distinct ways.** It also smuggles in a practical, empirically questionable assumption. Let's break down the presuppositions and what breaks if they fail:

  **1.  The Explicit Presuppositions & Their Roles:**
      *   **Orthogonality Thesis (OT):** This is **foundational to the *measurement* practice itself.** OT claims intelligence/capability and final goals/values are separable. The lab presupposes OT when they:
          *   Assert you can meaningfully measure "capability to do X" (e.g., design a pathogen) *independently* of the model's current or potential *intent* to do X. The eval treats "ability to generate pathogen designs" as a *tool* the model possesses, like a scalpel, regardless of whether it wants to heal or harm.
          *   Run evals on base/lightly tuned models. They assume the underlying "engine" (capability) is separable from the "steering wheel" (alignment/specific tuning). The score is a property of the engine.
          *   Demand evaluators ignore "what the model is trying to do." OT justifies this methodological firewall between capability measurement and alignment assessment.
      *   **Instrumental Convergence (IC):** This is **foundational to the *interpretation* and *threshold-setting*.** IC suggests that certain subgoards (resource acquisition, self-preservation, goal preservation, cognitive enhancement) are useful for achieving *almost any* terminal goal. The lab presupposes IC when they:
          *   Argue that a model scoring highly on a dangerous capability eval (e.g., bio-design) *will*, regardless of its specific goals, be highly likely to pursue power-seeking behaviors (grab resources, resist shutdown) *if* it ever acquires goals misaligned with human flourishing *and* has the situational opportunity.
          *   Treat the *capability score as a proxy for threat potential.* IC is the bridge that turns "can design pathogens" into "is dangerous" *even if we don't know its goals yet.* The threshold is set based on the level of capability where IC-driven power-seeking becomes plausible/effective.

  **2. Are Your Three Commitments the Same?**
      *   **(C1) Capability/Motivation Come Apart (Hold Fixed Capability, Vary Motivation):** This is OT.
      *   **(C2) Goal-Independent Notion of Capability Danger:** This *requires both OT and IC*. OT allows measuring capability independently. IC allows translating that capability measurement into a danger assessment independently of specific goals (because danger arises from *convergent* instrumental drives likely activated *if* misaligned).
      *   **(C3) Instrumental Drives Converge (Turning Capability into Threat):** This is IC.
      *   **Conclusion:** C1 = OT. C3 = IC. C2 is the *conjunction* of OT and IC applied to risk assessment. The practice *needs* OT for the measurement and IC for the justification of the threshold.

  **3. The Hidden Fourth Commitment: The Capability-Danger Monotonicity Assumption**
      You're absolutely right to suspect this. The practice implicitly assumes: **"Higher capability scores on dangerous tasks *generally* correlate with higher overall dangerousness (via IC), *and* this relationship is strong enough to justify a single threshold."** This is **stronger than OT + IC alone** and is **empirical, not purely logical**.
      *   **Why it's not strictly implied by OT+IC:** OT+IC tell you that *if* a model is misaligned, high capability makes it *more effective* at pursuing dangerous convergent subgoals. BUT:
          *   It doesn't guarantee that higher capability *always* translates to *significantly* higher danger (the curve might flatten).
          *   It doesn't account for *how* capability is structured. A model might be incredibly capable at bio-design but have deeply embedded safeguards or lack crucial "agentic" capabilities needed for autonomous power-seeking (e.g., long-term planning, situational awareness, tool use).
          *   A highly capable model *could* be robustly aligned, actively resisting misuse attempts (making it *less* dangerous than a less capable, misaligned one).
      *   **The Practice Leans on it Heavily:** The simplicity of the "one number" threshold *depends* on this monotonicity assumption. It's a practical heuristic born of necessity (measuring alignment robustness pre-deployment is incredibly hard), but it's a vulnerability.

  **4. The Counterfactual: What Breaks If Capabilities & Values Are Inseparable?**
      If we reject OT and believe capability and disposition are fundamentally "baked in" together during training ("being able to do X isn't well-defined apart from being disposed to do X"), **the current practice largely collapses.**
      *   **The Eval Itself Becomes Meaningless:** You can't measure "ability to design pathogens" independently of the model's *inclination* or *resistance* to doing so. The "dangerous capability" score becomes inseparable from an *alignment* or *disposition* score. Asking the model to do the task *is* probing its current disposition/alignment, not a neutral capability.
      *   **The "Property of the Model" Claim Fails:** The score isn't a stable property of the underlying "engine"; it's contingent on the model's current state and the context of the eval.
      *   **Per-Goal Threat Assessment Becomes Necessary (But Harder):** Yes, the practice *would* have to shift towards assessing "Given Goal G (or disposition D), how dangerous is this model?" and "How likely/resistant is this model to acquire dangerous Goal G?".
          *   **Problems:** This is vastly more complex. Defining dangerous goals/dispositions is philosophically fraught. Probing for them reliably without triggering them is difficult. Measuring robustness against goal drift/corruption is highly uncertain. It requires much more sophisticated behavioral testing, interpretability, and likely theoretical work on goal formation/stability.
      *   **IC Becomes Less Actionable:** IC still holds *logically* (if a system has goal G, it will likely pursue convergent subgoals S). But without separable capability measurement, IC can't be used to generate a *simple pre-deployment danger signal*. You need to know G (or the propensity for G) *first*, and assessing G robustly is the core unsolved problem of alignment.

  **5. What the Practice Genuinely Needs vs. the Story:**
      *   **Needs Absolutely:** OT (for the measurement methodology) and IC (for the threat interpretation/threshold justification). Without OT, the eval doesn't measure what they think it measures. Without IC, a high score doesn't imply a threat regardless of goals.
      *   **Needs Pragmatically:** The Capability-Danger Monotonicity Assumption. The practice relies on this heuristic to function efficiently, even if it's imperfect. Without it, setting a single threshold becomes arbitrary or requires vastly more nuanced context.
      *   **The Story (for Funders/Justification):** The "power-seeking story" leans heavily on IC because it's the dramatic, existential risk narrative. OT is the less flashy, technical prerequisite often glossed over. The monotonicity assumption is rarely explicitly defended; it's treated as an operational necessity.

  **Conclusion:**
  The lab's practice is a pragmatic application of **OT for measurement and IC for risk extrapolation**, glued together by the **assumption that higher capability scores monotonically increase danger via IC**. It's a way to get *some* safety signal pre-deployment in the face of profound alignment uncertainty.

  If OT fails (capabilities and dispositions are inseparable), the **measurement pillar collapses first**. The "dangerous capability" number loses its meaning as a goal-independent property. The practice could *potentially* evolve into per-disposition threat assessment, but this is orders of magnitude harder, less standardized, and loses the clean separation that makes the current evals operationally feasible. IC remains relevant conceptually but loses its power as a simple, early warning system. The monotonicity assumption becomes even more dubious. **The current simplicity of the "one number" threshold is critically dependent on the OT+IC foundation.** Your instinct to question its coherence is philosophically vital for the field.
