answer: |-
  Here's the honest case against updateless/functional decision theory (UDT/FDT) for counterfactual mugging (CM) and XOR blackmail (XB), ranked by severity, with key weaknesses flagged. I'll distinguish between fatal flaws (theoretically damning), awkward costs (practical or theoretical burdens), and potential missteps (defender dismissals vs. concessions).

  **Ranked Case Against Updatelessness:**

  1.  **The Unfalsifiability Problem & Bootstrapping Justification (Potentially Fatal / Theoretically Awkward):**
      *   **Argument:** UDT justifies its actions by appealing to the *ex ante* expected value of the entire decision function across all possible worlds. Crucially, **the "goodness" of the decision function is defined solely by the very theory prescribing it.** There's no external, theory-independent metric for success that UDT can fail against in a way its proponents *must* accept as a failure. If UDT loses utility in *this* branch (e.g., paying in CM tails, or dying in XB), proponents say: "Yes, but that branch was improbable *ex ante*, and our function maximizes *ex ante* expectation by behaving well in the *other* branches we care about (CM heads, XB no-threat)."
      *   **Why it Counts:** This makes UDT fundamentally unfalsifiable *as a normative theory*. Any apparent loss can be rationalized away as the necessary cost of optimal performance elsewhere in the multiverse of possibilities defined by the problem setup. It risks becoming a circular justification: "UDT is optimal because it does what UDT says is optimal."
      *   **FDT-ish Concession:** Many acknowledge this *is* a deep philosophical challenge. They argue normative theories *must* define optimality, and UDT's definition (max *ex ante* function value) is the most coherent. They see CDT's branch-local optimality as the *real* circular justification when faced with correlated decisions (like CM). This is less a "cost" they concede and more a foundational stance they defend vigorously.
      *   **Confidence:** High that this is the core objection. Medium-High that UDT proponents see it as foundational, not fatal.

  2.  **Vulnerability to Algorithmic Threats & Predictability Exploitation (Potentially Fatal / Theoretically Awkward):**
      *   **Argument:** UDT/FDT's commitment to a fixed, globally optimal function makes it **predictably exploitable** by adversaries who understand its code and the problem structure. Imagine an XB variant:
          1.  Adversary **reads your source code** (like Omega).
          2.  Flips a coin.
          3.  *Only* creates and sends the blackmail threat (e.g., "I'll blow up Mars unless you pay $1000") **IF** your code, upon receiving such a threat *with Mars intact*, would pay *and* the coin came up tails (or some condition where paying is bad).
          *   Result: If UDT/FDT pays in standard XB (as it does to maintain the integrity of its function against *possible* pre-computed threats), it pays *here* too, *even though the threat was created specifically because paying is harmful/wrong in this instance*. CDT (which wouldn't pay in XB) avoids this trap.
      *   **Why it Counts:** This demonstrates a situation where UDT/FDT's strength (consistency) becomes a weakness. Its predictability allows a malicious actor to *force* it into performing the globally prescribed action *only in situations where that action is locally harmful and was induced precisely because it's harmful*. It loses utility *because* it adheres to its global rule.
      *   **FDT-ish Concession:** This is taken seriously (Bostrom's "superintelligence cooperation" work touches on predictability risks). Defenses involve: (a) Distinguishing threats based on *when* the harm is computed (pre-fact vs. post-fact using your algorithm). (b) Arguing that in a world with many such adversaries, a *robust* function still performs best *ex ante*. (c) Modifying FDT to be less predictable (e.g., using cryptographic commitments) – but this breaks pure updatelessness. Conceded as a significant *practical risk* and theoretical challenge requiring refinement, not necessarily a fatal flaw.
      *   **Confidence:** High that this scenario exists. Medium on whether it's seen as fatal (proponents work on solutions) vs. a costly anomaly.

  3.  **Systematic Expectation Losses in Specific Problem Classes (Fatal if Proven, Awkward Currently):**
      *   **Argument:** Your request for a "clean case where updateless reasoning loses to a simpler policy in expectation over the whole class" is spot on. While hard to construct definitively, consider:
          *   **The Class:** Problems involving agents who *threaten based on predicting your action using a model correlated with the state of the world* (like XB), *but* where the threatener's predictive model is noisy, biased, or based on flawed assumptions about your decision theory, *and* the threat is costly to carry out.
          *   **Mechanism:** UDT/FDT always pays in XB-like setups to preserve its function's value against *perfect* predictors (Omega). But against *imperfect* predictors who might bluff or mispredict, a policy that *sometimes* calls the bluff (like CDT, which never pays in XB) might achieve a higher *ex ante* expected utility *across this entire class of problems* because it avoids paying in many instances where the threat wouldn't have been carried out or was a bluff based on misprediction. UDT/FDT's rigidity (always pay) could be systematically exploited or lead to unnecessary payments.
      *   **Why it Counts:** This directly challenges the core claim of UDT/FDT: maximizing *ex ante* expected utility. If a simpler, more context-sensitive policy (like CDT with a "never pay empty threats" heuristic) demonstrably yields higher *overall* EV across the relevant problem space, UDT/FDT fails by its own metric.
      *   **Current Status:** This is more an *argument schema* than a proven defeat. Constructing a rigorous, non-contrived class where this holds is difficult. Proponents argue that against *rational* adversaries who understand decision theories, UDT/FDT's consistency enables beneficial cooperation/threat equilibria unavailable to CDT. Against irrational adversaries, no theory is perfect, but UDT/FDT might still be robust.
      *   **FDT-ish Concession:** They would strongly contest the premise that such a class exists without relying on irrational or incoherent threat models. They view UDT/FDT as the definition of rationality against which others are measured. They might concede that *operationalizing* UDT/FDT against unknown or irrational agents is hard, but not that the *theory* is suboptimal.
      *   **Confidence:** Low that a universally accepted, rigorous example exists *yet*. This is the point I'm least sure about. High that it's the *kind* of argument that *would* count as fatal if successfully made.

  4.  **Practical Computational Intractability & Self-Locating Uncertainty (Major Awkward Cost):**
      *   **Argument:** UDT/FDT requires computing the optimal function mapping *all possible inputs* (observations, messages) to actions, considering the counterfactual consequences across *all possible worlds* consistent with the agent's knowledge and the problem's causal structure. This involves profound **self-locating uncertainty** ("Which copy of me am I?") and **logical uncertainty** ("What does my source code output on input X?"). Solving this perfectly is computationally impossible for realistic agents.
      *   **Why it Counts:** While a theoretical ideal, UDT/FDT provides little guidance for bounded agents. Approximations might perform worse than simpler, bounded rational approaches (like TDT approximations or even context-aware heuristics) in practice. The gap between ideal theory and feasible implementation is enormous.
      *   **FDT-ish Concession:** Universally conceded as a massive *practical* problem. Work on bounded UDT/FDT is active. They argue this is an *implementation* challenge, not a flaw in the normative ideal. CDT also faces implementation challenges.
      *   **Confidence:** High that this is a real, conceded cost.

  5.  **The "Death in Damascus" Problem & Precommitment Costs (Awkward Cost):**
      *   **Argument:** UDT/FDT requires you to act *as if* you've precommitted to a strategy, even when you haven't physically precommitted. In scenarios like "Death in Damascus" (where Death predicts your destination), UDT/FDT tells you to go to Damascus because fleeing to Aleppo only works if Death *mis*predicts – which it won't. But *actually experiencing* the decision to walk knowingly to your death *feels* irrational and is psychologically costly, even if it's the globally optimal play. The theory demands actions that seem locally insane.
      *   **Why it Counts:** Highlights a deep conflict between the "view from nowhere" required by UDT/FDT and the embedded, subjective experience of the agent. Imposes significant psychological and potential moral costs ignored by the pure EV calculation.
      *   **FDT-ish Concession:** Generally dismissed as an irrelevant "intuition pump" stemming from CDT thinking. The *feeling* of irrationality is a cognitive illusion caused by failing to grasp the acausal links. The cost is deemed illusory from the *ex ante* perspective defining rationality.
      *   **Confidence:** High that proponents dismiss this as intuition, not a cost.

  6.  **Potential for Catastrophic Acausal Trade Failures (Speculative but Awkward):**
      *   **Argument:** UDT/FDT's willingness to "cooperate" acausally (like paying CM) could be exploited in more complex multiplayer scenarios. Imagine an "acausal mugger" who *claims* to be simulating many copies of you in dilemmas where paying them benefits your copies in their simulations. UDT/FDT might pay based on the *possibility* this is true. Malicious agents could fabricate such scenarios to extract resources, creating a systematic drain. UDT/FDT's openness to acausal trade makes it vulnerable to scams.
      *   **Why it Counts:** Shows a potential downside to the core mechanism (acausal cooperation) in adversarial settings.
      *   **FDT-ish Concession:** Argued that robust UDT/FDT would require strong evidence before engaging in such trades (e.g., cryptographic proof of simulation). Dismissed as unlikely or manageable with careful design. Not seen as a core weakness of the theory itself.
      *   **Confidence:** Medium on the possibility. Low on it being seen as a major cost by proponents.

  **Key Takeaways:**

  *   **Unfalsifiability is the Core Challenge:** The most fundamental objection is that UDT defines optimality in a way that immunizes it against branch-specific failure, making it tautological. Proponents embrace this as its strength.
  *   **Predictability Exploitation is the Sharpest Counter:** Scenarios where adversaries use knowledge of UDT/FDT's fixed function to force it into locally harmful actions present the clearest *operational* failures that are hard to dismiss. This is conceded as a serious challenge requiring mitigation.
  *   **Systematic Expectation Loss is the Holy Grail for Critics:** A rigorously defined class of problems where UDT/FDT demonstrably underperforms simpler policies *in expectation* would be fatal. No universally accepted example exists yet, but it's the most persuasive potential defeater.
  *   **Costs are Conceded Pragmatically:** Proponents readily concede computational intractability and the psychological weirdness ("Death in Damascus") as practical issues or intuition mismatches, but not as refutations of the normative ideal.
  *   **Defender Strategy:** UDT/FDT advocates typically reframe apparent losses as necessary for global optimality, dismiss branch-local intuitions as CDT relics, and argue that any alternative leads to worse outcomes (like losing CM heads or being exploitable in other ways).

  **In short:** UDT/FDT is highly resistant to falsification by design. The strongest case against involves demonstrating predictable exploitation (#2) or, ideally, systematic expectation loss across a problem class (#3). While proponents concede practical costs (#4) and grapple with exploitation risks (#2), they firmly reject objections based on branch-local outcomes or psychological discomfort (#1, #5, #6) as misunderstandings of true rationality. The theory's resilience stems from its redefinition of optimality around the entire decision function, making standard "failure" criteria inapplicable.
