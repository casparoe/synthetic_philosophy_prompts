  First, I need to unpack what they're really after. They're not looking for intuition pumps or defenses they've already dismissed—they want substantive technical objections that would make an FDT prover pause. The phrase "quietly become unfalsifiable" suggests they suspect updateless reasoning might be tautological, so I should prioritize arguments that threaten its coherence as a falsifiable theory.

  Hmm... the request for "a clean case where updateless reasoning loses to a simpler policy in expectation" is key. That's the gold standard for decision theory critiques. I recall the XOR blackmail variant where FDT pays unnecessarily—that might qualify if framed as a broad failure class. But is it truly a loss in expectation across problem spaces? Need to think carefully about the probability distribution over scenarios.

  The user's mention of "FDT-ish people conceding real costs" implies they want steelmanned counters, not strawmen. I should focus on objections that even FDT researchers like MIRI folks acknowledge, like the computational overhead or precommitment costs. The "death in Damascus" problem comes to mind as something they'd grudgingly admit is awkward.

  Biggest challenge: most updateless "failures" are framed as win-conditions by its defenders. Like, losing money in XOR blackmail? "But it maintains the integrity of the decision function!" I'll need to find cases where that defense rings hollow—perhaps where updatelessness creates exploitable patterns. 

  Ah! The "algorithmically threatening" scenario is perfect for this. If the blackmailer can read your source code, FDT's predictability becomes a liability. That's an externally verifiable failure where CDT would actually outperform. And even FDT advocates would wince at this one.

  Least confident point: whether the "acausal trade" objections hold water. It's theoretically damning if updateless agents get duped in acausal prisoner's dilemmas, but I'm unsure if the math actually shakes out that way. Should flag that as speculative.

