  4. **Practical Stakes**: Prayer, medicine, blame. Why engage if no created causality? Pastoral hollowness is a concern—push on lived experience vs. theology.

  5. **Ghazālī's Intent**: Was he dialectical or sincere? Does scholarship matter for her defense? Follow-up if she dismisses it, asking why historical context shouldn't inform modern adoption.

  6. **Falsifiability**: What evidence counters occasionalism? Prevent a "nothing could" answer. Push the cost of unfalsifiability making it non-empirical.

  Structure should build from metaphysics to ethics to practicality. Start with habit and causation, move to evil, then practical implications, Ghazālī's role, end with falsifiability. Each question needs a sharp follow-up anticipating her defenses. 

  Ensure questions sound conversational, not academic. Use analogies like clockmakers or puppets to make them vivid. Avoid jargon where possible, but keep precision. The novelist needs to sound knowledgeable, not scripted. 

  Check each question for flow: Habit first as foundation, then necessary connection (challenging God's role), evil as moral consequence, practicality for daily life, historical context, ending with falsifiability as a grand challenge. Follow-ups should tighten the screws without being aggressive—maintain respect but demand clarity. 

