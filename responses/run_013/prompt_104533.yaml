prompt: |-
  I've just moved from a wet lab (molecular bio) into a complex-systems group for my PhD, and I keep getting into it at lab meeting over wether "emergence" means anything more than "we can't solve the equations yet". I want the spec before I pick a side. So: write the desiderata any decent account of emergence vs. reduction in science has to meet — the cases it must get right with the consideration behind each (phase transitions and the thermodynamic limit; universality, where different micro-physics give the same macro-law; macro-laws that are derivable in principle but only by grinding the micro-rule step by step; the cases where the higher level looks causally efficacious while the micro-level is closed and complete; and the awkward one, where the same micro-system admits several coarse-grainings — hydrodynamic vs. kinetic descriptions of the same gas — so which one is the emergent one?), plus the scientific results it can't contradict. Then tell me which of these are genuine requirements and which are just what one camp happens to want, and flag any pair that can't be had together. I'm fairly sure there's at least one, and that's the bit I most want.

  Format it as: "What it has to deliver" — the list, one bullet each, a line or two of motivation per bullet; "Fake requirements" — short, the demands that are really just one camp's preference, with why; "The pair that can't both hold" — a paragraph or two, spelled out; "Scorecard" — five lines max, the "it's just computational limits" line, strong emergence with new causal powers, and the effective-field-theory/renormalization take, judged against the list.
reasoning: |-
  Okay, let me tackle this user's request systematically. The user is transitioning from molecular biology to complex systems and needs a clear framework to evaluate emergence theories. Their frustration about lab meeting debates suggests they want rigorous criteria to avoid partisan arguments. 

  First, I need to map their listed examples to core philosophical requirements. Phase transitions demand capturing singular behavior at thermodynamic limits. Universality shows macro-scale independence from micro-details. Computational irreducibility requires recognizing when step-by-step simulation is the only derivation path. Causal completeness needs resolving apparent top-down causation conflicts. Multiple realizability must handle equally valid coarse-grainings.

  For fake requirements, I'll identify ideological positions masquerading as necessities. Eliminativist reductionism overreaches by demanding all phenomena be reducible without loss, while strong emergentists sometimes dismiss derivability entirely. Both extremes ignore scientific practice.

  The key tension is between causal completeness (micro-closure) and strong emergence's new causal powers. No account satisfying both exists without violating physics' causal closure or positing unverifiable forces. This conflict must be highlighted as the central trade-off.

  The scorecard should neutrally evaluate three approaches: computational-limits pragmatism (scores well except on universality), strong emergence (fails derivability), and renormalization group (handles all but causal efficacy cleanly). This shows why RG is the most scientifically respected despite not resolving the metaphysics.

  Throughout, I'll maintain a granular-but-readable structure matching their requested format. The examples will stay concrete to ground the philosophy in their daily scientific reality. The tone will remain clinically precise but subtly empathetic about their transition pains.
answer: |-
  Here’s the spec for evaluating emergence vs. reduction, structured per your request. The tension between causal completeness and strong causal emergence is the core conflict.

  ---

  ### **What It Has to Deliver**  
  *(Non-negotiable cases a theory must explain)*  
  - **Phase transitions & thermodynamic limit**:  
    *Motivation*: At critical points (e.g., water boiling), qualitative macro-changes occur discontinuously despite smooth micro-interactions. The infinite-particle limit (\(N \to \infty\)) is essential for singular behavior.  
  - **Universality**:  
    *Motivation*: Diverse micro-systems (e.g., magnets, fluids) obey identical macro-laws (critical exponents). Emergence must explain why micro-details become irrelevant at scale.  
  - **Computational irreducibility**:  
    *Motivation*: Some systems (e.g., turbulent flow, cellular automata) require step-by-step micro-simulation for prediction—no shortcut derivation exists *even in principle*.  
  - **Causal completeness of micro-level**:  
    *Motivation*: Physics assumes micro-dynamics (e.g., particle positions/momenta) fully determine future states ("causal closure"). Any emergent causality must not violate this.  
  - **Multiple valid coarse-grainings**:  
    *Motivation*: A gas can be described hydrodynamically (pressure, density) or kinetically (molecular collisions). Emergence must allow equally "real" macro-levels without privileging one.  

  ---

  ### **Fake Requirements**  
  *(Ideological demands disguised as necessities)*  
  - **"Eliminativism"** (Reductionist camp):  
    *Claim*: Only the micro-level is *real*; macro-laws are just summaries.  
    *Why fake*: Denies the autonomy of universality classes and computational irreducibility.  
  - **"Magic Causation"** (Strong emergentist camp):  
    *Claim*: Emergent properties *must* exert fundamentally new forces.  
    *Why fake*: Violates causal closure; unsupported by physics (e.g., no energy transfer from "consciousness fields").  

  ---

  ### **The Pair That Can’t Both Hold**  
  **Causal completeness vs. Strong causal emergence**.  
  - **Conflict**: If micro-dynamics are causally closed (all future states fixed by micro-state + laws), *genuinely new* macro-causal powers would require either (a) micro-causal incompleteness (contradicting physics) or (b) causal overdetermination (macro/micro both "doing the work").  
  - **Consequence**: Any account claiming *strong emergence* (emergent properties as *additional* causal agents) must either reject micro-closure (e.g., dualism) or accept overdetermination (philosophically awkward). Reductionists deny strong emergence to preserve closure, but struggle with computational irreducibility and universality.  

  ---

  ### **Scorecard**  
  *(5-line verdict on major positions)*  
  1. **"Just computational limits" (Weak emergence)**:  
     ✔️ Aces phase transitions (as \(N \to \infty\) limits), coarse-grainings.  
     ❌ Fails universality (independence from micro-details isn't computational) and causal efficacy (denies it).  

  2. **Strong emergence (new causal powers)**:  
     ✔️ Explains causal efficacy intuitions (e.g., "downward causation").  
     ❌ Violates causal completeness; struggles with multiple coarse-grainings (which macro-cause is "real"?).  

  3. **Renormalization Group (RG) / Effective Field Theory (EFT)**:  
     ✔️ Best for universality, phase transitions, and coarse-grainings (via fixed points/irrelevant operators).  
     ⚠️ Computational irreducibility acknowledged but not "explained"; causal efficacy remains descriptive (no new *forces*).  

  ---

  ### **The Takeaway**  
  RG/EFT satisfies all *scientific* desiderata by treating emergence as **scale-dependent informational invariance**. It shows *why* micro-details decouple (universality), *how* new laws stabilize (fixed points), and *when* coarse-grainings are valid (relevant operators). However, it **sidesteps metaphysics**: "Causal powers" are reinterpreted as stable dynamical constraints in EFTs, not new forces. Your lab’s debate likely hinges on conflating this *pragmatic* emergence (RG) with *metaphysical* emergence (new causation). RG is the consensus in physics; strong emergence remains philosophically contentious and scientifically unmotivated.
