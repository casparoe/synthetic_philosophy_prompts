prompt: |-
  I'm a novelist — fourth book, a campus novel set on a hospital ethics committee, so for the last few months I've been reading moral philosophy at the trade-paperback level plus a couple of recorded lecture series my brother-in-law sent me (he teaches intro at a state school). Last weekend I was at a dinner and a friend who did a PPE degree and never lets anyone forget it held forth on Scanlon's contractualism for what felt like half an hour. I'm reconstructing from memory so the wording is mine, but the content is his: contractualism is the view that an action is wrong if anyone could reasonably reject a principle that permits it; "reasonably" there basically means "in your own interest," so it's a bargaining model, which is why it counts as social contract theory — Hobbes with better manners, morality being whatever we'd all agree to; and the crucial bit is that it's strictly anti-aggregative, meaning numbers never count for anything, so a contractualist has to say it's exactly as bad to let one person drown as to let a thousand drown. Which is why, he said, it's useless for real policy and why Parfit and the consequentialists (Parfit, I think? someone like that) tore it apart. He also said Scanlon's whole point was that we must never treat anyone as a means, which he lifted from Kant, so the theory is basically the categorical imperative with a bit of maths about rejectability bolted on.

  Is any of that fair? I have a scene where my bioethicist character has to defend a triage call to a furious parent, and I want her to sound like someone who actually knows the position rather than someone doing the TED-talk version of it. So please go clause by clause: what would someone who works on this stuff accept, what would make them wince, what's flat wrong, and where is my friend stating a contested reading as if it were simply the text? I'm especially hung up on the aggregation part, because my instinct is that "numbers never count" is too crude but I honestly can't tell you why — and I'd like to know whether the careful anti-aggregation claim, stated properly, really does predict that a contractualist must be indifferent between saving one and saving many, or whether my friend is smuggling in a further step. It would also help to see how a careful contractualist would handle a case I invented for the novel: one dose of an antidote, a child who dies without it, an adult who goes blind but survives without it, and, down the hall, a third patient who'd get nothing more than relief from a bad headache out of the same dose. The mother insists that no principle permitting the adult to be chosen is one she could reasonably reject; the adult's union rep says choosing the child is age discrimination. Does the theory actually tell my character anything here, or does it only tell her how to think about it?

  Keep it readable for a non-philosopher — I don't need citations, and no reading list, the friend's whole vibe was name-dropping and I'd rather understand the machinery than the literature. If the "reasonably reject" test is where the real action is, explain that properly, since I suspect that's the hinge. Then end on its own final line beginning "Verdict:" — a short label from {fair, mostly fair, mixed, mostly unfair, unfair}, a dash, and one sentence I can underline in my notebook.
reasoning: |-
  Okay, let me tackle this query step by step. The user is a novelist working on a campus novel involving a hospital ethics committee, and they need to clarify their understanding of Scanlon's contractualism after a dinner conversation. Their friend made several claims about contractualism, and the user wants to know which parts are accurate, which are contested, and which are flat wrong—especially regarding the anti-aggregation point. 

  First, I need to unpack the friend's claims one by one. The core idea is that an action is wrong if any person could reasonably reject a principle permitting it. The friend equates "reasonably" with self-interest, frames it as a bargaining model like Hobbes, calls it strictly anti-aggregative (so saving one vs. a thousand is equally bad), and says it's just Kant's categorical imperative with math bolted on. 

  Starting with "reasonably reject": I recall that Scanlon explicitly rejects reducing "reasonable" to self-interest. For him, it's about justifiability to others based on generic reasons anyone could appeal to, not personal bargaining. The friend's Hobbes comparison is misleading—Scanlon is more about mutual respect than mutual advantage. 

  On anti-aggregation: The friend is partially right but oversimplifies. Scanlon does prioritize strong individual claims over weak aggregated ones (e.g., saving one life vs. curing many headaches). But he allows aggregation in cases with comparable harms, like saving many lives versus one. The drowning example misses this nuance—it's not that numbers *never* matter, but that they don't override catastrophic individual harms. 

  The Kant connection is overstated. While both emphasize not treating people as means, Scanlon's framework is distinct: it's about justifiability via principles no one could reasonably reject, not universalizability of maxims. The "math" (rejectability) is central, not bolted on. 

  For the user's triage scenario: Contractualism wouldn't give a neat answer but would structure the debate. The mother's rejection might be reasonable if saving the child is life-or-death versus the adult's blindness. The union rep's "age discrimination" charge would require examining if age alone is the reason or if severity of outcome justifies it. The headache patient is easily dismissed—their claim is too weak. 

  Key wince moments: Reducing "reasonable" to self-interest, calling it Hobbesian, claiming absolute anti-aggregation, and oversimplifying the Kant link. The drowning example is the biggest stretch. 

  Verdict: Mostly unfair—the friend's summary distorts more than it clarifies. The core mechanics (principles, reasonable rejection) are misrepresented, and the anti-aggregation point is a caricature. For the novel, the bioethicist should emphasize that contractualism is about finding principles others couldn't reasonably reject given the stakes, not cold math or individualism.
answer: |-
  Here's a clause-by-clause breakdown for your bioethicist's toolbox, focusing on accuracy and philosophical nuance:

  1.  **"An action is wrong if anyone could reasonably reject a principle that permits it."**
      *   **Acceptable:** This is the core definition. Correct.
      *   **Nuance:** "Principle" is key. It's not about rejecting the *specific action* in isolation, but rejecting a *general rule* allowing that *type* of action in those *type* of circumstances.

  2.  **"'Reasonably' there basically means 'in your own interest'..."**
      *   **Wince-Worthy / Mostly Unfair:** This is a major oversimplification bordering on misrepresentation.
      *   **Reality:** "Reasonably" means rejecting based on **impersonal, generic reasons** anyone in that position could appeal to. It's about the *kind of burden* imposed, not pure self-interest. Scanlon emphasizes "**what we owe to each other**" – it's about justification *to others*, not bargaining *for oneself*. While interests are involved, the reasons must be framed as *justifiable* burdens, not just "I don't like it." It's about finding principles no one *could* reasonably reject, not principles everyone *would* agree to based solely on self-interest.

  3.  **"...so it's a bargaining model, which is why it counts as social contract theory — Hobbes with better manners..."**
      *   **Mostly Unfair:** This paints the wrong picture.
      *   **Reality:** While inspired by social contract tradition, Scanlon **explicitly rejects the bargaining model** (Hobbes, Gauthier). It's **not** about mutual advantage, threats, or starting from a state of nature. It's a **justificatory** model: What principles could we justify *to each other* as free and equal moral agents? The "contract" is a metaphor for mutual justifiability, not a literal agreement process. "Better-mannered Hobbes" is deeply misleading.

  4.  **"...morality being whatever we'd all agree to..."**
      *   **Mixed:** Partially true, but misses the crucial constraint.
      *   **Reality:** Morality (or what we owe to each other) *is* defined by what principles could be the object of agreement **among people seeking principles for the general regulation of behavior that no one could reasonably reject.** The "no one could reasonably reject" clause is doing the heavy lifting, not the mere fact of agreement.

  5.  **"...strictly anti-aggregative, meaning numbers never count for anything..."**
      *   **Contested / Misleading:** This is a hot topic and your friend states a strong interpretation as fact.
      *   **Reality:** Scanlon *is* famously skeptical of **pure aggregation** (e.g., summing small benefits for many to outweigh a large harm to one). His core example: You can't let one person die to save many others from a minor headache. **However:**
          *   **Comparable Harms:** He allows (or many argue he *should* allow) aggregation when harms are *comparable in kind and severity*. Saving 100 lives vs. saving 1 life *likely* permits saving the 100, because the burden of non-rejection on each of the 100 is catastrophic loss of life, comparable to the one.
          *   **The Drowning Example:** Saying it's "exactly as bad" to let one drown as a thousand **is not a straightforward prediction of the theory.** A contractualist *could* argue:
              *   A principle permitting *always* saving the many over the one *could* be reasonably rejected by each individual (especially in a world where you might be the one).
              *   BUT, a principle requiring saving the larger group *when the harm is identical and catastrophic* (drowning) *might not* be reasonably rejectable. The individual burden of rejection (death) is identical in both cases, but the principle saves vastly more lives overall. The key is whether the *reason* for rejecting a pro-saving-many principle is *reasonable* given the *generic standpoint* of someone facing death either way. Most modern contractualists (and interpreters of Scanlon) believe the theory *can* and *should* account for numbers in such clear cases of identical, severe harm. Your friend's claim reflects one reading but ignores significant debate and potential developments within the framework.

  6.  **"...Scanlon's whole point was that we must never treat anyone as a means, which he lifted from Kant..."**
      *   **Partially Fair, Partly Unfair:** There's a Kantian influence, but it's reworked.
      *   **Reality:** The *spirit* of not treating people merely as means is absolutely central – it's the core motivation behind the "justifiability to others" idea. **However:**
          *   It's not "lifted" wholesale. Kant's Categorical Imperative is about universalizability of maxims and rationality. Scanlon's machinery (principles, reasonable rejectability based on burdens/benefits) is distinct.
          *   The "must never" is too absolute. Contractualism focuses on *justification*. Sometimes actions affecting others are permissible if governed by a principle no one could reasonably reject. It's not a blanket ban on "using" people, but a requirement that such "use" be governed by mutually justifiable rules.

  7.  **"...so the theory is basically the categorical imperative with a bit of maths about rejectability bolted on."**
      *   **Unfair:** This trivializes both Kant and Scanlon.
      *   **Reality:** While sharing a deontological heritage and respect for persons, the structures are fundamentally different. Kant's CI tests individual maxims for universalizability and non-contradiction. Scanlon's framework is about selecting general principles through a process of considering rejectability based on generic reasons. The "maths" (the structure of justification and weighing reasons for rejection) **is** the core machinery, not an add-on to Kant.

  **Your Triage Case & Contractualism:**

  *   **Does it dictate an answer?** No. Contractualism provides a *framework for reasoning and justification*, not a calculator. Your bioethicist would need to argue about which principle governing such triage decisions *couldn't* be reasonably rejected.
  *   **Analyzing the Claims:**
      *   **Mother (Child):** "No principle permitting choosing the adult over the child could be one I (as the child's parent) could reasonably reject." The contractualist bioethicist would counter: *Could* a principle prioritizing saving a life over preventing blindness be reasonably rejected by someone in the adult's position? The adult suffers a severe, lifelong impairment. Is the burden of non-rejection *reasonable*? The mother's personal stake isn't the point; it's the generic burden on someone facing blindness vs. death. The bioethicist might argue a principle prioritizing the most severe threat to life/central capabilities *isn't* reasonably rejectable, even by the adult, *because saving a life prevents a qualitatively worse burden*.
      *   **Union Rep (Adult):** "Choosing the child is age discrimination." The bioethicist must show the decision is based on *the severity of the outcome* (death vs. blindness), not age per se. A principle allowing prioritization based on *severity of harm prevented* isn't inherently discriminatory, even if it correlates with age in this case. A principle *always* prioritizing children over adults *might* be reasonably rejectable based on equal respect.
      *   **Headache Patient:** Easily dismissed. A principle *ever* prioritizing headache relief over preventing death or blindness would be *highly* reasonably rejectable by those facing death/blindness. The burden on the headache sufferer of non-rejection is minimal (temporary discomfort) compared to the catastrophic burdens on the others.
  *   **The Hinge - Reasonable Rejection:** This *is* where the action is. Your bioethicist would sound authentic by:
      *   Framing the debate around **general principles** for resource allocation in emergencies.
      *   Focusing on the **generic burdens** imposed on individuals by different principles (death, severe disability, minor discomfort) – not personal stories.
      *   Arguing whether someone bearing a *specific type of burden* under a proposed principle could **reasonably reject that principle** based on the kind of harm they suffer, considered impartially.
      *   Acknowledging the **difficulty and lack of a formulaic answer** but insisting this framework ensures decisions are made based on what's justifiable *to* each affected party type, respecting their standing.

  **Verdict:** Mostly unfair — the summary misrepresents 'reasonable rejection' as self-interest, oversimplifies the social contract link, overstates anti-aggregation as 'numbers never count', and reduces Scanlon's distinct framework to Kant with 'maths bolted on'.
