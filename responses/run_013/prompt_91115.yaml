            - Compute `q = 1/d` (the market-implied probability).
            - Compute `edge = conservative_p * d - 1`.
            - If `edge <= 0`:
                 - Refuse the bet. Stop.
            - Compute `b = d - 1` (the profit per unit staked if win).
       c. **Kelly fraction**:
            - `kelly_fraction = edge / b`   (this is the fraction of the bankroll for full Kelly).
            - `stake_fraction = 0.5 * kelly_fraction`   (half-Kelly).
            - If `stake_fraction > cap_single`:
                 - `stake_fraction = cap_single`
            - If `stake_fraction < min_stake`:
                 - Refuse the bet. Stop.
            - Else, the stake for this opportunity is `stake = stake_fraction * B`.

  3. **For a group of independent opportunities**:
       - For each opportunity, run step 2.
       - Let `total_stake_fraction = sum of all stake_fraction_i` for the independent opportunities.
       - If `total_stake_fraction > cap_total`:
            - Scale each `stake_fraction_i` by `cap_total / total_stake_fraction`.
       - Each stake is then `stake_i = stake_fraction_i * B` (after scaling if needed).

  4. **For a correlated group (non-identical)**: 
       - The procedure cannot handle it. Hand to human.

  5. **One-shot bet additional check** (optional, but we decided to rely on the cap):
       - Skip.

  ### Running the Three Cases

  #### Case 1: Repeatable thin-edge bet (weekly)
     - **Inputs**:
          - Repeatable: yes
          - Historical data: let's assume 1000 past bets, with a standard error of the estimate `se = 0.01` (from historical errors).
          - Point estimate `p = 0.52`
          - Market odds: `d = 2.0` (so `q = 0.5`)
     - **Step 2a**: 
          `conservative_p = 0.52 - 1.5 * 0.01 = 0.52 - 0.015 = 0.505`
     - **Step 2b**:
          `edge = 0.505 * 2 - 1 = 1.01 - 1 = 0.01`
          `b = 2-1 = 1`
     - **Step 2c**:
          `kelly_fraction = 0.01 / 1 = 0.01`
          `stake_fraction = 0.5 * 0.01 = 0.005` (0.5% of bankroll)
          This is below the cap (5%) and above the minimum (0.1%). So we take it.

  #### Case 2: One-shot event with a large edge
     - **Inputs**:
          - Repeatable: no (one-shot)
          - Point estimate `p = 0.6`
          - 90% confidence interval: [0.4, 0.8] (the bettor is uncertain)
          - Market odds: `d = 2.0` (so `q=0.5`)
     - **Step 2a**:
          `conservative_p = 0.4 + 0.25*(0.8-0.4) = 0.4 + 0.1 = 0.5`
     - **Step 2b**:
          `edge = 0.5*2 - 1 = 0` -> refuse the bet.

     Why? Because the conservative adjustment brought the edge to zero.

     Note: Without the adjustment, the edge would be `0.6*2-1=0.2`, then `kelly_fraction=0.2/1=0.2`, half-Kelly=0.1, which is above the cap (0.05) so we would bet 5% of the bankroll. But the adjustment made it zero.

     This shows how the uncertainty adjustment protects against overbetting on uncertain one-shot bets.

     However, if the confidence interval was tighter, say [0.55, 0.65], then:
          `conservative_p = 0.55 + 0.25*(0.65-0.55) = 0.55+0.025=0.575`
          `edge = 0.575*2-1 = 0.15`
          `kelly_fraction = 0.15/1 = 0.15`
          half-Kelly = 0.075 -> capped at 0.05.

     So we would bet 5%.

     But in the original case with wide confidence interval, we refuse.

  #### Case 3: Four correlated opportunities on the same afternoon
     - They are on the same underlying event (so highly correlated), but not identical (different outcomes or different markets). 
     - The procedure: 
          - Step 1: They are correlated and not identical -> hand to human.

     We do not run the single opportunity procedure.

  ### Non-Financial Wager

  The same procedure does not carry over directly. Why?

    - The Kelly criterion is designed for financial bets where the bankroll is continuous and can be split arbitrarily, and the goal is to maximize the exponential growth rate of wealth.
    - A non-financial wager (time and reputation) does not have a clear bankroll. The "stake" is not in dollars but in time and reputation, which are not fungible with money and not easily quantifiable in the same units as the reward.

    However, we can try to adapt:

      - **Bankroll**: We need to define the total resource at risk. For time and reputation, it might be:
            - The total available time the partner has? But time is renewable (she can work more hours) but in the short term it's fixed.
            - Reputation: very hard to quantify.

      - **Edge**: The probability of success and the reward if successful must be estimated in the same units as the stake. But the reward might be in money, career advancement, etc., while the stake is time and reputation.

    **Nearest honest thing**:

      We can use a similar principle: don't risk a large fraction of your total "career capital" on a single venture. The fraction should be conservative.

      Steps:

        1. Estimate the total career capital (this is subjective): 
              - What is the total time and reputation you have? (e.g., 1000 working weeks left? reputation on a scale of 1-100?)
        2. Estimate the fraction of career capital at risk: 
              - How much time is being staked? (e.g., 1 year = 52 weeks out of 1000 -> 5.2%)
              - How much reputation? (e.g., if the venture fails, by how much will your reputation drop? say 10% of your current reputation?) -> then the total fraction at risk might be the maximum of these or a combination.
        3. Then, use a conservative cap: do not risk more than X% of your career capital on any one venture. The cap X might be 10% or 5%.

      But note: the reward might be asymmetric. We can do:

          Let `p` = probability of success (adjusted for uncertainty as before).
          Let `b = (reward if successful) / (stake)` -> but the reward and stake must be in the same units.

      This is the challenge: we need to convert everything to a common unit. Money might be the common unit? We can convert time to money (hourly rate) and reputation to money (how much future income is at stake?).

      But it becomes highly speculative.

      The honest advice: 

          "The Kelly criterion is designed for financial bets with clear monetary outcomes and a well-defined bankroll. For non-financial wagers, we can use the principle of not risking too much of your total capital, but the exact fraction is a matter of personal risk tolerance and cannot be computed arithmetically. We recommend not risking more than 5% of your career capital (defined as the present value of your future earnings) on any one non-financial venture. The rest is judgment."

  ### Conclusion

  The procedure is designed to be conservative and to handle the most common cases. It explicitly accounts for uncertainty in one-shot bets, uses the syndicate bankroll, and avoids overbetting on correlated opportunities by requiring human intervention for complex cases. It also incorporates the house rule of half-Kelly and a cap. 

  The steps that are arithmetic: Steps 2a-2c for a single opportunity. The steps that are judgment: 
     - Providing the confidence interval for one-shot bets.
     - Classifying an opportunity as repeatable or not.
     - Determining the correlation between opportunities.
     - Aggregating identical bets.
     - Deciding the total cap for independent bets.

  Where the procedure may produce regret:
     - If the uncertainty adjustment for a one-shot bet is too conservative, we might miss a good opportunity.
     - If the uncertainty adjustment is not conservative enough, we might overbet and suffer a large loss.
     - If we hand a set of correlated opportunities to a human, the human might make a mistake.

  The procedure is designed to err on the side of caution.
answer: |-
  Below is a decision procedure tailored to your staking syndicate's needs. It handles repeatable vs. one-shot bets, correlated opportunities, point estimates with uncertainty, and bankroll vs. total wealth considerations. The procedure is designed to be run in 15 minutes by a numerate operator, auditable by partners, and explicitly flags judgment calls. It follows a strict sequence of questions, with clear termination points (stake, refusal, or human judgment).

  ---

  ### **Decision Procedure for Betting Opportunities**
  **Inputs Required for Each Opportunity:**  
  - Your point estimate of win probability (\(p\))  
  - Market-implied probability (\(q\), derived from odds: \(q = 1/\text{decimal odds}\))  
  - Historical error data (if repeatable) or a 90% confidence interval for \(p\) (if one-shot)  
  - Correlation with other pending opportunities (if any)  
  - Current syndicate bankroll (\(B\))  
  - House rules: Half-Kelly fraction, stake cap (\(C\), e.g., 5% of \(B\)), minimum stake (\(M\), e.g., 0.1% of \(B\))  

  **Procedure:**  
  1. **Classify the Opportunity**  
     - **Question:** Is this bet part of a repeatable series (e.g., >100 similar opportunities/year) or a one-shot event?  
     - **Sufficient Answer:**  
       - *Repeatable:* Historical data showing stable edge (e.g., mean edge \(\mu\), standard deviation \(\sigma\) of edge over 50+ bets).  
       - *One-shot:* A 90% confidence interval for \(p\) (e.g., "I am 90% sure \(p\) is between 0.4 and 0.6").  
     - **Termination:** If one-shot and no confidence interval is provided → **Refuse**. Rationale: No uncertainty quantification.  

  2. **Adjust for Uncertainty**  
     - **Question:** How reliable is the edge estimate?  
     - **Calculation:**  
       - *Repeatable:* Apply shrinkage to edge.  
         \[
         \text{Adjusted Edge} = \mu - 1.5 \times \sigma
         \]  
         (Shrinks edge to account for historical volatility; 1.5x is conservative.)  
       - *One-shot:* Use the 25th percentile of the confidence interval.  
         \[
         p_{\text{adj}} = \text{Lower Bound} + 0.25 \times (\text{Upper Bound} - \text{Lower Bound})
         \]  
         (e.g., Interval [0.4, 0.6] → \(p_{\text{adj}} = 0.4 + 0.25 \times 0.2 = 0.45\)).  
     - **Termination:** If adjusted edge \(\leq 0\) → **Refuse**. Rationale: No mathematical edge.  

  3. **Account for Correlation**  
     - **Question:** Is this opportunity correlated with other pending bets (e.g., same underlying event)?  
     - **Sufficient Answer:** List all correlated opportunities (e.g., "Bet A, B, C all depend on Event X").  
     - **Calculation:**  
       - If correlated, treat the group as a **single meta-bet**.  
         \[
         p_{\text{meta}} = \text{weighted average of } p_{\text{adj}} \text{ for all bets}
         \]  
         \[
         q_{\text{meta}} = \text{weighted average of } q \text{ for all bets}
         \]  
         (Weights based on stake size if independent; if identical, use best available odds.)  
       - Edge for meta-bet: \(e_{\text{meta}} = p_{\text{meta}} - q_{\text{meta}}\).  
     - **Termination:** If correlation is suspected but unquantifiable → **Hand to human**. Rationale: Portfolio optimization requires judgment.  

  4. **Calculate Kelly Stake**  
     - **Question:** What fraction of the bankroll maximizes long-term growth?  
     - **Calculation:**  
       \[
       f_{\text{kelly}} = \frac{e_{\text{adj}}}{\text{odds} - 1} \quad \text{(where } e_{\text{adj}} = p_{\text{adj}} \times \text{odds} - 1\text{)}
       \]  
       \[
       f_{\text{final}} = \min\left( \frac{1}{2} f_{\text{kelly}},\ C \right)
       \]  
       (Half-Kelly + cap for overbetting protection.)  
     - **Termination:** If \(f_{\text{final}} < M\) → **Refuse**. Rationale: Transaction costs dominate.  

  5. **Validate Bankroll vs. Total Wealth**  
     - **Question:** Is the syndicate bankroll (\(B\)) a small fraction of backers' total wealth?  
     - **Sufficient Answer:**  
       - *Yes* (e.g., \(B < 10\%\) of backers' combined net worth + future income): Use \(B\).  
       - *No* (e.g., \(B > 25\%\) of backers' wealth): Lower effective bankroll to \(B_{\text{eff}} = 0.4 \times B\).  
     - **Stake:** \(\text{Stake} = f_{\text{final}} \times B\) (or \(B_{\text{eff}}\) if adjusted).  

  6. **One-Shot Catastrophe Check**  
     - **Question:** Could losing this stake end the syndicate?  
     - **Calculation:**  
       - If one-shot and \(\text{Stake} > 0.3 \times B\) → **Refuse**.  
       - Rationale: Kelly assumes repeated bets; one-shot large risks violate "many iterations" premise.  

  ---

  ### **Key Clarifications**  
  - **Repeatable vs. One-Shot:**  
    - Repeatable bets use historical error data for shrinkage. One-shot bets use confidence intervals.  
    - Kelly is only valid for repeatable bets; one-shot large bets **always refused** if stake >30% of \(B\).  
  - **Correlated Opportunities:**  
    - Grouped into a meta-bet with pooled edge/variance. Avoids overcommitment.  
  - **Point Estimates & Uncertainty:**  
    - Shrinkage (repeatable) and 25th-percentile (one-shot) replace folklore. Justified by statistical conservatism.  
  - **Bankroll vs. Total Wealth:**  
    - Syndicate bankroll \(B\) is used unless it exceeds 25% of backers' total wealth (then use \(B_{\text{eff}}\)).  
  - **What Cannot Be Decided:**  
    - Unquantifiable correlations, one-shot bets with no confidence interval, and meta-bets with complex dependencies → **Human judgment**.  
  - **Kelly's Hidden Assumption:**  
    - Kelly maximizes long-term growth **only if bets are repeated infinitely**. One-shot bets answer "What maximizes expected utility?" (not growth).  

  ---

  ### **Case Studies**  
  #### **Case 1: Repeatable Thin-Edge Bet**  
  - **Inputs:** \(p = 0.52\), \(q = 0.50\) (odds = 2.0), historical \(\sigma = 0.01\), \(B = \$1M\), \(C = 5\%\), \(M = 0.1\%\).  
  - **Procedure:**  
    1. Repeatable: Use historical \(\sigma\).  
    2. Adjusted edge = \((0.52 - 0.50) - 1.5 \times 0.01 = -0.005\) → **Refuse** (no edge after shrinkage).  
  - **Audit Trail:** Shrinkage made edge negative. No bet.  

  #### **Case 2: One-Shot Event (Syndicate Breaker)**  
  - **Inputs:** \(p = 0.65\) (point estimate), 90% CI = [0.45, 0.85], odds = 1.8 (\(q = 0.556\)), \(B = \$1M\).  
  - **Procedure:**  
    1. One-shot: CI provided → \(p_{\text{adj}} = 0.45 + 0.25 \times (0.85 - 0.45) = 0.55\).  
    2. Edge = \(0.55 \times 1.8 - 1 = -0.01\) → **Refuse** (negative edge).  
    3. *Even if edge was positive:* Stake = 10% of \(B\) → **Catastrophe Check** → **Refuse** (stake >30% of \(B\) is forbidden for one-shot).  
  - **Audit Trail:** Uncertainty and one-shot nature triggered refusal. Decision turns on quantifiable conservatism.  

  #### **Case 3: Four Correlated Opportunities**  
  - **Inputs:** Four bets on same event (\(p_1 = 0.6, q_1 = 0.53\); ...), \(B = \$1M\).  
  - **Procedure:**  
    1. Correlated → Group as meta-bet.  
    2. \(p_{\text{meta}} = 0.58\), \(q_{\text{meta}} = 0.54\) (weighted average).  
    3. Edge = \(0.58 - 0.54 = 0.04\).  
    4. \(f_{\text{kelly}} = 0.04 / (1.85 - 1) = 0.047\) → \(f_{\text{final}} = \min(0.5 \times 0.047, 0.05) = 0.0235\).  
    5. Stake = 2.35% of \(B\) split equally across bets.  
  - **Audit Trail:** Correlation prevented overcommitment.  

  ---

  ### **Non-Financial Wager Extension**  
  **Scenario:** Partner stakes time/reputation on a one-shot venture.  
  **Legitimacy:**  
  - **Illegitimate** to use Kelly directly. Non-financial stakes lack:  
    - Fungibility (time/reputation ≠ money).  
    - Rebettability (venture resolves once).  
    - Quantifiable bankroll (no clear "wealth" to grow).  
  **Nearest Honest Approach:**  
  1. **Convert to Monetary Equivalents:**  
     - Estimate monetary value of time/reputation (e.g., "1 month = \$20k salary," "reputation risk = \$100k lost income").  
  2. **Apply Bankroll Rule:**  
     - Use syndicate bankroll procedure *only if* stakes are monetary.  
     - If non-monetary, **refuse arithmetic decision** → **Human judgment**.  
  3. **Principle for Humans:**  
     - "Never stake >5% of your career capital on a one-shot venture." (Career capital = future income value.)  

  **Why This is Honest:**  
  - Acknowledges that Kelly answers "growth maximization" for money, not "utility maximization" for life choices.  
  - Avoids false precision; forces partners to confront uncertainty.  

  ---

  ### **Summary**  
  - **Real Arithmetic:** Edge adjustment, Kelly math, correlation pooling.  
  - **Judgment in Disguise:** Confidence intervals, correlation identification, total wealth assessment.  
  - **Regret Minimization:**  
    - Shrinkage + half-Kelly avoids overbetting.  
    - One-shot >30% bankroll refusal prevents blowups.  
    - Correlation handling reduces portfolio risk.  
  - **Output:** A stake (%), refusal, or escalation to human.  

  This procedure prioritizes survivability, explicit conservatism, and auditability. It fails fast on unquantifiable risks and forces partners to confront uncertainty where arithmetic ends.
