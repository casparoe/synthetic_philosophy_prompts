prompt: |-
  I cover artificial intelligence and the philosophy of science, and I keep watching two camps in mechanistic interpretability talk past each other: internal-structure realists, who treat claims like "this direction encodes the concept X" as literal descriptions of a network's internal organization, and interpretive deflationists, who treat such claims as instruments that earn their keep by predicting and controlling behavior, with no further fact of the matter. I want the joint statement these two could actually sign after a good-faith adversarial collaboration.

  First, make them agree on what a representation claim asserts — naming its relata (a vehicle, a content, a downstream consumer) and the level at which it is made (a unit, a direction, a subspace, a circuit) — and on what would render such a claim well- or ill-formed, without appeal to citations. Then set out their residual disagreements, each phrased in wording its own side would accept, on at least three questions: whether underdetermination (many incompatible attributions fitting the same activations) tells against realism; whether causal use by downstream computation is sufficient for content or merely necessary; and whether the interpreter's choice of task and distribution is constitutive of the attribution or only evidence for it.

  Then identify the cruxes, and for each give a test both sides agree would bear on it, with each side's prediction recorded in advance. Include one test of your own construction: a swap test in which a decodable direction is transplanted into a context matched on nuisance variables, and downstream behavior is measured — say explicitly what each camp predicts when decoding succeeds but use does not transfer, and when use transfers without stable decoding. Format as a numbered agreed-claims section followed by a disagreements table.
reasoning: |-
  We are drafting a joint statement for two camps in mechanistic interpretability: internal-structure realists (realists) and interpretive deflationists (deflationists). The goal is to have them agree on the basic structure of representation claims and then outline their disagreements on specific points, with tests that could resolve these disagreements.

  ## Step 1: Agreed Claims on What a Representation Claim Asserts

  We need to define the relata (vehicle, content, downstream consumer) and the level at which the claim is made (unit, direction, subspace, circuit). We also need to specify what makes a representation claim well-formed or ill-formed without appeal to citations.

  ### Agreed Claims:

  1. **Representation Claims**: A representation claim asserts that in a neural network, a particular **vehicle** (e.g., an activation vector, a unit, a direction in activation space, a subspace, or a circuit) carries information about a **content** (a concept, feature, or state of affairs) that is used by a **downstream consumer** (a subsequent part of the network) in the computation it performs.

  2. **Relata**:
     - **Vehicle**: The physical (or rather, the mathematical/structural) aspect of the network that is the bearer of the representation. This can be at different levels of granularity: a single unit, a direction (a linear combination of units), a subspace (a set of directions), or a circuit (a functionally connected set of components).
     - **Content**: What the vehicle represents. This can be a concept (e.g., "cat", "noun phrase"), a feature (e.g., "edge at 45 degrees"), or a more abstract state of affairs. The content is typically defined relative to the input distribution and the task.
     - **Downstream Consumer**: The part of the network that takes the vehicle as input and uses the information it carries to perform a computation (e.g., a later layer or a specific set of units that read out the representation).

  3. **Level of Analysis**: Representation claims can be made at various levels of abstraction, but each claim must specify the level (e.g., unit-level, direction-level, subspace-level, circuit-level) to be well-formed.

  4. **Well-Formedness Conditions**: A representation claim is well-formed if and only if:
     - It clearly specifies the vehicle, the content, and the downstream consumer.
     - It provides evidence that the vehicle reliably co-varies with the content across a specified distribution of inputs (i.e., the representation is decodable).
     - It provides evidence that the downstream consumer uses the information in the vehicle in a way that depends on the content (i.e., the representation is causally efficacious for the downstream computation).

     A claim is ill-formed if it fails to meet these conditions, e.g., if it only shows decodability without any evidence of use, or if it only shows a causal effect without decodability.

  ## Step 2: Disagreements

  We outline three disagreements. Each should be phrased in wording that each side would accept.

  ### Disagreement 1: Underdetermination
  - **Realist View**: Even if multiple incompatible content attributions fit the same activation patterns (underdetermination), this does not necessarily tell against realism. There is a fact of the matter about which content is the one actually represented by the vehicle, and underdetermination may be due to limitations in our current methods or the need for more constraints (e.g., from the network's architecture or training history).
  - **Deflationist View**: Underdetermination (the existence of multiple, incompatible interpretations that equally well account for the activations) shows that there is no further fact of the matter about which content is represented. Content attributions are tools for prediction and control, and we should choose among them based on pragmatic considerations, not because one is uniquely correct.

  ### Disagreement 2: Causal Use as Sufficient or Necessary for Content
  - **Realist View**: Causal use by a downstream consumer is necessary but not sufficient for a vehicle to have a particular content. The vehicle must also have the right kind of causal history (e.g., having been shaped by learning to carry that content) and the content must be the one that the vehicle is designed (by the training process) to represent. There may be cases where a vehicle is causally used in a way that does not reflect its true content (e.g., due to adversarial examples).
  - **Deflationist View**: Causal use by a downstream consumer is both necessary and sufficient for attributing content. If the downstream computation uses the vehicle in a way that is appropriately sensitive to the content (i.e., the vehicle's state makes a difference to the output in a way that tracks the content), then that is what it means for the vehicle to have that content. There is no additional historical or teleological condition.

  ### Disagreement 3: Role of Interpreter's Task and Distribution
  - **Realist View**: The interpreter's choice of task and input distribution is evidentiary but not constitutive of the content. The content is fixed by the network's internal structure and training history, regardless of how we choose to probe it. Different tasks and distributions may reveal different aspects of the representation, but the representation exists independently.
  - **Deflationist View**: The interpreter's choice of task and input distribution is constitutive of the content attribution. Without specifying a task and distribution, the question of what a vehicle represents is ill-defined. The same vehicle might be interpreted as having different contents under different tasks and distributions, and there is no fact of the matter beyond the utility of the attribution for that context.

  ## Step 3: Cruxes and Tests

  We identify the cruxes (the key points of disagreement that could be resolved by empirical tests) and for each, we design a test that both sides agree would bear on it. We record each side's prediction.

  ### Crux 1: Underdetermination
  - **Test**: Train a network on a task that admits multiple interpretations (e.g., a vision task that could be solved by color or by shape). Then, use multiple interpretability methods (e.g., feature visualization, activation maximization, perturbation tests) to assign content to a particular vehicle. Then, design an intervention that selectively disrupts one interpretation (e.g., remove color information) and see if the network's behavior changes as predicted by that interpretation.
    - **Realist Prediction**: The network's behavior will change in a way that is consistent with only one of the interpretations (the one that matches the actual representation), even if multiple interpretations fit the pre-intervention activations.
    - **Deflationist Prediction**: The network's behavior may change in ways that are consistent with different interpretations depending on the context, and there is no fact of the matter about which one is "correct" independent of the context. The choice of interpretation will be pragmatic.

  ### Crux 2: Causal Use as Sufficient for Content
  - **Test**: Create a synthetic model where a vehicle is trained to represent content A, but then we surgically alter the downstream consumer to use that vehicle for content B (without retraining). For example, train a network to classify images of cats and dogs (so a direction in an intermediate layer represents "catness"). Then, change the weights of the downstream layer so that the same direction now causes the output to be "dog" when the direction is active. Note: This must be done without changing the rest of the network and without retraining.
    - **Realist Prediction**: The vehicle still represents "catness" (its original content) because of its training history, even though it is now being used to cause "dog" outputs. This is a case of misuse.
    - **Deflationist Prediction**: The vehicle now represents "dogness" because that is how it is being used by the downstream consumer. The content is defined by its current causal role.

  ### Crux 3: Role of Task/Distribution
  - **Test**: Take a pre-trained network and probe the same vehicle with two different tasks and their corresponding distributions (e.g., one task that requires fine-grained object recognition and another that requires coarse-grained). Measure the content attributed to the vehicle by each probing method (e.g., linear probing and causal interventions) and see if it changes.
    - **Realist Prediction**: The content of the vehicle is fixed and should be consistent across tasks and distributions. Any variation in the attributed content is due to the probing method not revealing the true content but only a partial aspect.
    - **Deflationist Prediction**: The attributed content will vary with the task and distribution, and this variation is not just an artifact but reflects that the content is relative to the task and distribution.

  ### Swap Test (Original Test)
  - **Test Description**: We select a vehicle (a direction) in a source network that is decodable for a content (e.g., a "cat" direction). We then transplant this direction into a target network that is trained on a similar task but with a different architecture or data distribution. The transplant is done in a context matched on nuisance variables (e.g., same layer index, same input distribution). We then test two scenarios:
    1. **Decoding succeeds but use does not transfer**: After transplant, we can still decode the content (e.g., "cat") from the transplanted direction in the target network, but the downstream consumer in the target network does not use it for the same purpose (e.g., it doesn't affect the output in a way that reflects "cat").
    2. **Use transfers without stable decoding**: After transplant, the downstream consumer in the target network uses the transplanted direction in a way that is functionally equivalent to the source network (e.g., it causes the same kind of output behavior for the content), but we cannot decode the original content (e.g., "cat") from the activations of the transplanted direction in the target network.

  - **Predictions**:
    - **Scenario 1 (Decoding without transfer of use)**:
      - Realist: This scenario is possible because decoding shows the representation is still present, but the downstream consumer in the target network may not be wired to use it. The content is still there (as per the realist view) even if not used.
      - Deflationist: This scenario shows that decoding without use is not sufficient for content. The content attribution requires the causal role. Without use, the decoding might be an artifact of the distribution and not reflect the content in the target network.

    - **Scenario 2 (Transfer of use without decoding)**:
      - Realist: This scenario is problematic because if the representation is not decodable, then it's not clear that the vehicle is carrying the content. The transfer of use might be due to a different representation that happens to have similar causal effects. The realist would predict that use without decodability is unlikely to transfer unless there is a stable representation.
      - Deflationist: This scenario is possible because the content is defined by the causal role. If the use transfers, then the content is present, even if the decoder (which is an external tool) fails to capture it. The failure of decoding might be due to the decoder not being adapted to the new context.

  ## Step 4: Formatting

  We will format the joint statement as:

  ### Joint Statement on Representation in Neural Networks

  **Agreed Claims**:

  1. A representation claim in a neural network must specify:
     - A **vehicle**: a structural element of the network (e.g., a unit, a direction, a subspace, or a circuit).
     - A **content**: a concept, feature, or state of affairs that the vehicle is claimed to represent.
     - A **downstream consumer**: a subsequent part of the network that uses the vehicle in its computation.

  2. The claim is made at a specific **level of granularity** (e.g., unit-level, direction-level, etc.) and must be evaluated in the context of a specified input distribution and task.

  3. A representation claim is **well-formed** if and only if:
     - There is evidence of **decodability**: the vehicle's state reliably co-varies with the content across the input distribution.
     - There is evidence of **causal efficacy**: the downstream consumer's behavior is causally affected by the vehicle in a manner that depends on the content.

     Claims lacking either condition are ill-formed.

  **Disagreements**:

  We have the following disagreements:

  | Question | Realist Position | Deflationist Position |
  |----------|------------------|-----------------------|
  | **Underdetermination**: Does the existence of multiple incompatible content attributions that fit the activation patterns tell against realism? | Underdetermination does not undermine realism; it may reflect methodological limitations. There is a fact of the matter about the content. | Underdetermination shows there is no fact of the matter beyond utility; multiple attributions can be equally valid depending on context. |
  | **Causal Use**: Is causal use by a downstream consumer sufficient for content, or merely necessary? | Causal use is necessary but not sufficient; content also depends on the vehicle's history and the network's design. | Causal use is both necessary and sufficient; there are no additional historical or teleological conditions. |
  | **Constitutive Role of Task/Distribution**: Is the interpreter's choice of task and distribution constitutive of the content, or only evidentiary? | The task and distribution are evidentiary; the content is fixed by the network's internal structure and training history. | The task and distribution are constitutive; without them, the content attribution is undefined. The same vehicle can have different contents under different contexts. |

  **Cruxes and Tests**:

  | Crux | Test | Realist Prediction | Deflationist Prediction |
  |------|------|---------------------|--------------------------|
  | **Underdetermination** | Intervene on a network with multiple interpretations: selectively disrupt one interpretation and observe behavior. | Behavior change will be consistent with only one interpretation (the true one). | Behavior change may be context-dependent; no unique true interpretation. |
  | **Causal Use** | Surgically alter a downstream consumer to use a vehicle for a new content without retraining. | The vehicle retains its original content (misuse). | The vehicle now represents the new content (content defined by current use). |
  | **Role of Task/Distribution** | Probe the same vehicle in a pre-trained network with two different tasks/distributions. | Content attribution remains consistent. | Content attribution varies with task and distribution. |
  | **Swap Test** (Transplant a direction between networks) | **Scenario 1**: Decoding succeeds but use does not transfer. | The vehicle still has the content (even without use). | The content is not present without use (decoding is insufficient). |
  | | **Scenario 2**: Use transfers but decoding fails. | The vehicle does not have the content (decoding failure indicates absence). | The content is present (use is sufficient) and decoding failure is a methodological issue. |

  This joint statement captures both the common ground and the points of contention, along with tests to resolve them.
answer: |-
  ### Joint Statement on Representation Claims in Mechanistic Interpretability

  #### Agreed Claims
  1. **Definition of Representation Claims**:  
     A representation claim asserts that a specific **vehicle** (e.g., an activation vector, unit, direction, subspace, or circuit) in a neural network carries information about a **content** (e.g., a concept, feature, or state of affairs) that is **causally used by a downstream consumer** (e.g., a later layer, attention head, or output mechanism) to influence computation.  

  2. **Relata**:  
     - **Vehicle**: A structural component of the network (e.g., a neuron, direction in activation space, or circuit).  
     - **Content**: The semantic or functional target (e.g., "noun phrase" or "edge orientation").  
     - **Downstream Consumer**: A computational component that takes the vehicle as input and uses its information.  

  3. **Level of Analysis**:  
     Claims must specify the granularity (e.g., unit-level, direction-level, subspace-level, or circuit-level) and are evaluated relative to a **fixed input distribution** and **task context**.  

  4. **Well-Formedness Conditions**:  
     A claim is well-formed iff:  
     - It demonstrates **reliable covariance**: The vehicle’s state predicts the content across inputs (e.g., via linear probes or behavioral tests).  
     - It demonstrates **causal efficacy**: Interventions on the vehicle (e.g., ablation or patching) alter downstream behavior in ways traceable to the content.  
     A claim is ill-formed if it:  
     - Fails to specify the downstream consumer.  
     - Lacks empirical evidence for covariance or causal efficacy.  
     - Ignores the task/input distribution.  

  #### Disagreements  
  | Question | Internal-Structure Realist Position | Interpretive Deflationist Position |  
  |----------|-------------------------------------|------------------------------------|  
  | **Underdetermination** | Multiple incompatible attributions fitting activations do not undermine realism; they reflect incomplete data or methods. A unique "correct" content exists, fixed by network architecture and training. | Underdetermination implies no fact of the matter; attributions are tools for prediction/control, and incompatible ones can be equally valid if pragmatically useful. |  
  | **Causal Use** | Causal use by downstream computation is necessary but insufficient for content. Content requires historical/structural grounding (e.g., learning dynamics). Use without proper etiology is "misuse" (e.g., adversarial hijacking). | Causal use is necessary and sufficient for content. If a consumer uses a vehicle in a content-sensitive way, no further historical/structural fact is needed. "Misuse" is an incoherent concept. |  
  | **Interpreter’s Task/Distribution** | The interpreter’s choice of task/distribution is evidentiary, not constitutive. Content is intrinsic to the network; tasks merely reveal it. | The task/distribution is constitutive. Content is undefined without an interpreter’s context; the same vehicle can validly represent different contents under different tasks. |  

  #### Cruxes and Tests  
  | Crux | Test | Realist Prediction | Deflationist Prediction |  
  |------|------|---------------------|--------------------------|  
  | **Underdetermination** | Train a network with ambiguous features (e.g., shapes that could represent "circle" or "red object"). Fit two incompatible linear decoders (e.g., for shape vs. color). Ablate the vehicle and measure which decoder best predicts downstream errors. | Downstream errors align with only one decoder (e.g., shape), revealing the "true" content. | Errors may align with either decoder depending on input context; no unique alignment. |  
  | **Causal Use** | Rewire a pre-trained network: replace a consumer using a vehicle for content A (e.g., "verb detection") with one using it for content B (e.g., "noun detection") without retraining. Test if the vehicle’s content changes. | Vehicle retains content A; rewired consumer misuses it. | Vehicle now represents content B; content is defined by current use. |  
  | **Task Constitutivity** | Probe a vehicle with two tasks: one where it covaries with content X (e.g., object class), another with Y (e.g., texture). Assess causal efficacy in each task via targeted interventions. | Interventions show consistent causal effects for one content (e.g., X) across tasks. | Causal effects shift with the task; content is task-relative. |  
  | **Swap Test**<br>(Novel Test) | Transplant a decodable direction (e.g., "cat" in a vision model) into a *matched-context* model (same architecture, layer, nuisance variables). Measure: (1) decoding accuracy, (2) downstream use (e.g., output behavior). | | |  
  | - **Scenario 1**: Decoding succeeds (stable "cat" probe) but downstream use fails (e.g., no "cat"-influenced behavior). | Vehicle still represents "cat"; failure implies consumer mismatch. | No representation exists; decoding without use is artifact. |  
  | - **Scenario 2**: Downstream use transfers (e.g., "cat"-like behavior) but decoding fails (no stable probe). | No "cat" representation; transfer is coincidental or misattributed. | Representation exists; decoding failure is a methodological flaw. |  

  ---  
  This statement delineates common ground while crystallizing disagreements into testable predictions. The **swap test** serves as a critical experiment: realists prioritize structural stability (decoding), while deflationists prioritize functional success (use).
