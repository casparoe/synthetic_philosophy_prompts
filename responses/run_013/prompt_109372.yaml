  I'll build my argument step by step. First, I'll establish why mineness isn't trivially satisfied. Simply computing a signal about oneself isn't enough - a system could perfectly represent its reward state without experiencing it as "mine," just like a thermometer doesn't experience temperature even if it reports "my current reading is 20°C."

