  Breaking down their requirements: I need to defend that reward signals are at best "valence-surrogates" (functional equivalents) rather than true "valence-bearing" signals (having subjective experience). The key is the "mineness condition" - that a signal must be represented by the system as its own state to qualify as valence-bearing.

