  ### (i) Policy Coincidences and Divergences
  - **Coincident policies (all recommend k=1):** Policies 1 (symmetric fixed point), 3 (Kantian), 6 (utilitarian), and 8 (evidential) all yield k=1.  
    *Demonstration:*  
    - Policy 1: Maximizes \(\mathbb{E}[10^6 / (M^2 k)]\) over k, minimized at k=1 (since payoff ∝ 1/k).  
    - Policy 3: Universally willing k=1 maximizes individual payoff when all choose identically.  
    - Policy 6: Maximizes total surplus \(10^6 / (M k)\), minimized at k=1.  
    - Policy 8: Conditions on own choice k, infers symmetry, and evaluates \(\mathbb{E}[10^6 / (M^2 k)]\), minimized at k=1.  
    All converge to k=1 as the unique solution under symmetry.
    
  - **Divergent policies:**  
    - Policy 2 (lure) recommends k≈31 (specifically, k=31–33 by approximate optimization).  
    - Policy 9 (refusal) recommends k=0.  
    - Policies 4, 5, 7, 10 are either arbitrary (policy 4) or undefined (policies 5, 7, 10).

