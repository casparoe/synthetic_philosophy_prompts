prompt: |-
  I run the forecasting desk at a small research shop -- geopolitical and tech stuff, mostly for policy clients -- and I've inheritied an internal process that I never really questioned until recently. Here's how it works. Everyone submits a probability. Then we do a "share and update" round where people lay out their reasoning and the evidence behind it, and anyone who wants can revise. Then we take the median of the revised numbers as our official estimate, and we quote that median to clients as "the probability" that the thing happens. People who stay far from the median after the update round get flagged in their annual review as poorly calibrated or as "not updating on the evidence." And we sink real money into debiasing workshops whose entire point is to get people to move toward each other.

  What's bugging me is this: the forecasters who hold out the longest against the group tend to be the ones who've thought hardest about the question. And some of them say things like "I just don't weight base rates the way she does, and no amount of her evidence is going to move me, because the disagreement is upstream of the evidence." Our process treats that as basically a confession of irrationality -- like, if you're rational and you've heard my argument, you should move. But I'm not sure that's right, and I don't want to be running a shop that punishes the best people on the team for a technicality I don't understand.

  So: what does this whole apparatus actually presuppose about disagreement? I have a vague sense there's some old result in decision theory about rational agents not being able to "agree to disagree" once their beliefs are common knowledge, and that it's supposed to follow from something about shared priors -- but I don't know what it actually says or how strong it is. Walk me through it. Does our process require us to assume everyone starts from the same prior, or does it only need something weaker? Which rival pictures of disagreement does it quietly rule out -- for instance, that people can rationally hold different priors, that priors can themselves encode evidence, that some disagreements are about values or about how the question is even framed rather than about facts? And is our process internally consistent, given that we also advertise to clients that we hire diverse teams precisely because we want a spread of viewpoints? Finally, if we dropped the assumption, what would concretely have to change -- in how we aggregate, how we score people, and in what we're entitled to tell clients that median number means?
reasoning: |-
  Okay, the user runs a forecasting desk and inherited a process that aggregates probabilities through a median after a discussion round. They're concerned because the process penalizes those who don't converge to the median, particularly those who've deeply considered the issue and might have fundamentally different priors. They want to understand the theoretical underpinnings of disagreement among rational agents and whether their current process is justified.

  First, I need to recall Aumann's Agreement Theorem. It states that if two rational agents have the same prior and their beliefs are common knowledge, they can't agree to disagree. Their posterior probabilities must be equal. But in the user's process, they're assuming shared priors implicitly. The median approach forces consensus, which aligns with Aumann if priors are shared. But the user's forecasters might have different priors, which Aumann doesn't require. That's a key point.

  The user mentioned dissenters saying disagreements are "upstream of the evidence." That sounds like differing priors. The current process treats any deviation after discussion as irrational, which ignores the possibility of legitimate prior differences. The user suspects they might be punishing their best thinkers. That makes sense—if someone has a well-reasoned prior based on unique expertise, forcing them to conform could be counterproductive.

  Next, the process pushes for convergence via the median and flags outliers. But if priors differ, rational agents shouldn't necessarily converge completely. They might update but still disagree based on their initial priors. The debiasing workshops aiming to make people move toward each other might actually be suppressing valuable epistemic diversity. The user also mentioned advertising diverse teams for a spread of viewpoints, which contradicts punishing those who maintain differing views.

  The user's deeper needs seem to be about maintaining forecast accuracy while respecting their team's expertise. They don't want to lose top performers due to a flawed process. They need concrete changes: maybe aggregating forecasts differently, adjusting scoring, and communicating uncertainties to clients transparently.

  Possible solutions: Instead of the median, use a weighted average based on past performance. Track individual Brier scores to reward calibration, not conformity. Allow dissenters to contribute with their probabilities without penalizing them. Explain to clients that the aggregate reflects a range of expert opinions, not a single "true" probability.

  Also, internal workshops should focus on sharing reasoning, not pushing consensus. Highlighting where disagreements stem from (priors vs. evidence) could add value. The key is distinguishing between irrational stubbornness and rational, divergent priors. The user needs to validate both convergence and divergence where appropriate.
answer: |-
  Your instincts are spot on. Your process implicitly relies on **Aumann's Agreement Theorem (1976)**, a foundational result in Bayesian decision theory. Let's break it down, its assumptions, why it might misapply to your context, and what needs to change.

  ### The Core Idea: Aumann's Agreement Theorem
  1.  **The Claim:** If two rational agents:
      *   Start with a **common prior** (same initial probability distribution over all possible states of the world).
      *   Have **common knowledge** of each other's posterior probabilities (after updating on their private information/evidence).
      *   Share the same **likelihood model** (how evidence updates probabilities via Bayes' theorem).
      ...then they **cannot "agree to disagree"** on the posterior probability of an event. Their probabilities *must* be equal.

  2.  **The Implication for Your Process:** Your "share and update" round aims to create common knowledge of posteriors and reasoning. The expectation is that rational agents *should* converge *if* they share a common prior and interpret evidence identically. The median is taken as the "rational consensus," and deviation is seen as irrational failure to update properly.

  ### What Your Process Assumes (and What It Rules Out)
  Your process implicitly requires **all three Aumann conditions** to justify penalizing divergence and demanding convergence:

  1.  **Shared Prior (Strong Assumption):**
      *   **Required?** Absolutely central to the convergence expectation. If priors differ rationally, convergence isn't required.
      *   **What It Rules Out:** It rules out the possibility that rational, well-informed agents can fundamentally disagree *because they started from different places*. This is your dissenters' point ("disagreement is upstream of the evidence"). Priors can encode:
          *   Deeply held (and rational) beliefs about how the world works (e.g., human nature, systemic stability, technological feasibility).
          *   Different interpretations of *past* evidence shaping fundamental worldviews.
          *   Varying weight given to base rates vs. specific signals.
          *   Different framings of the problem itself (which is often an upstream choice).

  2.  **Common Knowledge of Posteriors:**
      *   **Required?** Yes, the "share and update" round explicitly tries to create this.
      *   **What It Rules Out?** Less problematic in theory if the sharing is truly comprehensive. But in practice, reasoning is complex and may not be fully communicable or absorbed. It assumes perfect understanding.

  3.  **Shared Likelihood Model (Shared Interpretation of Evidence):**
      *   **Required?** Yes. Aumann requires agents agree on how any piece of evidence *should* update beliefs (Bayesian updating).
      *   **What It Rules Out:** It rules out rational disagreements about:
          *   The *relevance* of a piece of evidence.
          *   The *reliability* of a source.
          *   The *causal mechanism* linking evidence to the outcome.
          *   **Values/Lexical Differences:** If the disagreement involves differing values (e.g., "This policy makes war *less likely*, but I find it morally abhorrent so I forecast a high chance hoping to deter it") or fundamentally different conceptual frameworks ("You see this as a security dilemma, I see it as an ideological clash"), the shared likelihood assumption breaks. Aumann is purely about *factual* belief updating.

  ### Internal Inconsistencies in Your Process

  1.  **Diversity vs. Conformity:** Advertising "diverse teams for a spread of viewpoints" directly contradicts punishing people for *maintaining* diverse viewpoints (the "spread") after discussion. Diversity is valuable *precisely because* it often reflects different priors and interpretive frameworks. Your process actively suppresses this value.
  2.  **"The Probability" vs. Aggregation:** Calling the median "the probability" implies a single, objective truth-value. However, aggregating diverse rational beliefs (especially with diverse priors) doesn't magically yield the "true" probability; it yields a collective estimate. The median, in particular, discards valuable information about the *spread* of expert opinion.
  3.  **Punishing "Outliers":** Flagging people who remain far from the median *assumes* the median is "correct" and deviation is "wrong" due to irrationality. This ignores the very real possibility that the dissenter is rationally operating under a different (and potentially superior) prior or model. You risk punishing your deepest thinkers and most independent analysts.
  4.  **Debiasing Workshops:** Workshops focused *only* on "moving people towards each other" treat all disagreement as bias. This ignores the legitimate sources of disagreement outlined above and can actively *harm* the epistemic diversity you claim to value.

  ### What Needs to Change (Concretely)

  1.  **Stop Assuming Convergence = Rationality:**
      *   **Aggregation:** Ditch the median. Use methods that respect diversity of opinion:
          *   **Weighted Average:** Weight forecasts by past track record (Brier score, log score). Good forecasters retain influence even if non-consensus.
          *   **Prediction Markets:** Let forecasters "bet" on their beliefs. Prices reflect aggregated probabilities weighted by confidence and past performance.
          *   **Explicitly Model Uncertainty:** Report a *range* (e.g., interquartile range) or a histogram of final forecasts. Tell clients: "Our team's estimates range from 20% to 65%, with a median of 40%." This is far more informative than a single number. It signals genuine uncertainty and diversity of expert opinion.
      *   **Scoring:** Score forecasters **solely on the calibration and accuracy of their *own final forecast*** (e.g., using Brier scores), *not* on their distance from the median or group consensus. Reward being well-calibrated, not being conformist. Flag consistent *miscalibration*, not consistent *deviance*.
      *   **Debiasing Workshops:** Refocus them on *actual* cognitive biases (e.g., base rate neglect, confirmation bias, overconfidence) demonstrated in past forecasts, not on reluctance to conform. Include training on understanding *sources* of disagreement (priors, models, values) and how to articulate them clearly.

  2.  **Reframe the Meaning of the Aggregate Number:**
      *   **Tell Clients:** "This number (median/weighted average) represents our team's current *collective best estimate*, aggregating diverse perspectives and interpretations of the evidence. The range around it [show the range!] reflects the degree of underlying uncertainty and legitimate disagreement among our experts." Acknowledge it is *not* a revealed single "Truth."

  3.  **Revamp the "Share and Update" Round:**
      *   **Goal Shift:** The goal should be **understanding disagreement**, not eliminating it. Facilitate discussions that probe: "What is the *source* of our difference? Is it prior beliefs? Interpretation of this specific evidence? Weighting of factors? The framing of the question itself?"
      *   **Allow Non-Movement:** Make it explicit that changing one's forecast is *optional*. The value is in the shared reasoning, not the convergence. "I understand your argument, but my prior/model leads me to a different conclusion" should be an acceptable and respected outcome.
      *   **Document Reasoning:** Capture the key divergent arguments and rationales, especially those underlying forecasts far from the median. This provides context for the range reported to clients and aids in post-mortem analysis.

  4.  **Value Diverse Priors/Models Explicitly:**
      *   Recognize that your best forecasters often have strong, well-considered, but non-standard priors/models. Their value lies in covering possibilities the consensus misses.
      *   In reviews, focus on: "Is their reasoning sound? Are they well-calibrated over time? Do they provide unique, valuable perspectives?" rather than "Did they move towards the median?"

  **In essence:** Your current process mistakes **consensus** for **rationality** and **accuracy**. By dropping the implicit assumption of a shared prior (and shared likelihood model), you acknowledge that rational, well-informed experts *can and should* disagree, even after sharing all evidence and reasoning. Your process should *leverage* this disagreement to provide richer, more robust, and more honest forecasts to your clients, rather than suppressing it in pursuit of a potentially false consensus. Move from enforcing conformity to managing and communicating epistemic diversity effectively.
