  First, I need to recall Hobbes's main arguments. His key points are that mathematical knowledge is certain because it's about objects we create, like geometric figures, so we know their causes. Natural philosophy deals with external causes we can't access directly. The user is tempted to agree and wants to test the theory's robustness.

