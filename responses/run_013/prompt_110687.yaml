answer: |-
  ### The Practice, in Your Words  
  The legal system treats deception inconsistently: Under oath, literal falsehoods (perjury) are punished, but intentionally misleading through technically true statements ("paltering") usually isn't. In private sales (e.g., between individuals), silence or selective truth isn't fraud unless specific questions are dodged. Yet consumer protection laws penalize overall misleading impressions in advertising, even with no false statements. Politics and legal non-denials exploit this gap. The pattern: Lies are prohibited; paltering is often allowed in testimony and private deals but banned in consumer contexts. Boundaries depend on context, relationship, and formal duties.

  ### The Theory It Has to Be Assuming  
  The practice presupposes a **speech-act theory of deception**, where the core wrong is the *assertion of falsehood*, not merely causing false belief. This view prioritizes the *act of vouching for a lie* as the moral/legal breach. When you assert "P" while knowing ¬P, you corrupt shared epistemic norms by inviting reliance on your warranty of truth. Paltering avoids this: each statement is true, so no individual assertion is corrupt.  

  Context then layers duties:  
  - **Oath**: Swearing imposes a duty of *completeness*, making paltering a breach of that expanded duty.  
  - **Private Transactions**: *Caveat emptor* rules; no general duty to disclose absent fiduciary roles or direct inquiries. Causing false belief isn’t wrongful absent a false assertion.  
  - **Consumer Law**: Asymmetric power and societal harm justify imposing affirmative duties. "Misleading" is banned because consumers rely on sellers’ *implicit warranty of non-deceptiveness*.  

  This theory distinguishes *lying* (asserting falsehoods) from *deceiving* (causing false beliefs). The law condemns the former as intrinsically wrong but treats the latter as wrongful only when special duties exist.  

  ### What’s Doing the Work vs. What’s Just Convenient  
  **Core Presupposition**:  
  The practice *strictly requires* the speech-act distinction. Without it, perjury couldn’t exempt paltering, and fraud rules couldn’t tolerate half-truths in private sales. The assertion-focused wrong explains why literal truth is a defense: it negates the corrupt act.  

  **Pragmatic Overlays**:  
  - **Provability**: Courts prefer policing literal falsehoods; proving intent to mislead with true statements is harder.  
  - **Burden Allocation**: Private sales rely on buyer diligence; consumer law shifts burden to sellers due to expertise/power imbalances.  
  - **Relationship Duties**: Fiduciary roles (e.g., lawyers, agents) *do* ban paltering, showing duties can expand beyond assertions.  

  Alternative theories (e.g., harm-based views) *could* explain consumer law’s broader liability but not why paltering isn’t perjury or fraud elsewhere. The assertion rule is necessary for the current boundaries.  

  ### If We Switched to a False-Belief Rule  
  A rule holding people liable for *intentionally causing false beliefs* (regardless of literal truth) would collapse key distinctions:  
  - **Perjury**: Paltering would become illegal under oath, as it’s designed to mislead the jury.  
  - **Private Sales**: Sellers could be liable for omissions (e.g., not disclosing a cracked engine) if intent to deceive is proven. "Buyer beware" would erode.  
  - **Consumer Law**: Little change—it already targets misleading impressions.  
  - **Politics/Lawyer Speech**: Many non-denials could become actionable.  

  **Practical Shifts**:  
  - **Flood of Litigation**: Subjective intent disputes would explode; harmless omissions might face scrutiny.  
  - **Chilling Effects**: People might over-disclose to avoid liability, burdening communication.  
  - **Gains**: Fairer outcomes where paltering causes real harm (e.g., fraud by omission).  

  **Losses**: The current system’s efficiency and clarity—assertions are easier to adjudicate than beliefs. Free speech in public discourse might suffer if all strategic truth-telling risks liability.  

  ### Bottom Line  
  The law’s inconsistency reflects a foundational commitment: lying is wrong because it corrupts assertion itself, not merely because it misleads. Contextual duties (oath, consumer relations) then broaden liability. Switching to a false-belief rule would harmonize standards but sacrifice legal predictability and enable subjective disputes—trading precision for moral expansion.
