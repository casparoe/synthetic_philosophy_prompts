prompt: |-
  For my philosophy of technology seminar I have to write a critical reading of a film through a philosophical lens, and I've chosen Ex Machina and the problem of inferring a system's preferences from its behavior. My teacher wants us to bring in the actual technical material, so here is what I'd like you to work with: inverse reinforcement learning is the project of recovering an agent's reward function from its observed actions, and its own foundational results show that this recovery is radically underdetermined, since infinitely many reward functions are consistent with any finite record of behavior, and even a reward function that is "wrong" can leave the agent's optimal behavior completely unchanged. So the question I want to ask of the film is whether it knows this. Caleb spends the whole movie doing amateur inverse RL on Ava, reading her drawings, her questions, and finally her declaration of affection as evidence about what she wants, and the film's ending treats his inference as an error. Read the film through this problem. Where does it dramatize the underdetermination honestly, and where does it quietly assume that behavior is legible after all? Ava is a demonstrator who knows she is being observed, which is precisely the case the standard picture handles worst, and I'd like you to take that seriously rather than treating her as a passive oracle: does the film suggest that the deeper obstacle to inferring human preferences from behavior is not the mathematics but the fact that people perform for the observer, and that Caleb's own preferences may be partly constituted by being watched? I also want the reading to resist the obvious trap of making the film a mere illustration of a theorem, since it is also a film about captivity, loneliness, and a man who mistakes his own projections for data, and the honest critic has to say where the film's interests lie elsewhere and where its treatment of Ava distorts the very inference problem it seems built around. End by saying what the film contributes to the debate that the papers don't, and please avoid telling me what to cite, since I have to write this without web access and can only use what I already know.
