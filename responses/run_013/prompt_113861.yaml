  The student's answer seems surprisingly strong at first glance. They correctly identify Lakatos's critique of Popper, accurately describe the hard core/belt distinction, and nail the negative/positive heuristics (though the phrasing of positive heuristic is inverted - a common mistake). The Prout example is well-chosen and correctly applied. 

  But there are subtle issues that need flagging:
