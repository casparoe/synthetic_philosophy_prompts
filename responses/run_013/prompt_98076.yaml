prompt: |-
  I am a doctoral candidate in political theory, and next week I am leading a ninety-minute session for a mixed reading group of graduate students in philosophy, law, and public policy. The topic is the problem of dirty hands in politics, but I want the session to turn on a distinction I have been trying to formulate and have not seen stated in exactly this way: between what I call the residue reading and the license reading of dirty hands. On the residue reading, the politician who does wrong for the public good remains genuinely guilty; the moral cost is not cancelled but registered as a remainder that should shape future conduct and character. On the license reading, the political role itself generates a permission to do what would otherwise be forbidden, so that the act is not wrong in the relevant sense, though it may still be regrettable or politically costly. I want the group to understand why this distinction matters and why one might be forced to choose between the two rather than treating them as complementary.

  Plan the session for me. Do not give me the explanation itself. Give me the order in which the components must be introduced so that the distinction feels forced rather than arbitrary, the one concrete case or scenario that should carry the whole session and what it must include and leave out, the misconceptions the group will predictably bring -- for instance, that dirty hands is just consequentialism, that moral residue is merely a feeling, that a role-based license is the same as a legal immunity -- and exactly where in the sequence each should be headed off. I would prefer not to use the standard ticking-bomb torture case; if you think it is nonetheless the right carrying example, defend that against my preference. Tell me what to leave out at this level and say so explicitly, and give me one question I can put to the group at the end that would show whether they have grasped the distinction rather than merely learned the vocabulary. I would like you to make definite choices and defend them: if you think the residue reading is the more defensible one, say so and explain why the session should be sequenced to make that conclusion available without rigging it; if you think the distinction collapses, say that and tell me how the session should be reorganized around its collapse.
reasoning: |-
  Okay, the user is a doctoral candidate in political theory preparing a session on the dirty hands problem with a focus on their own distinction between residue and license readings. They need a structured plan that forces participants to confront the distinction as a necessary choice rather than complementary options. 

  First, I need to assess their core requirements: they want the session to pivot on their original distinction, avoid the cliché ticking-bomb scenario, predict and dismantle common misconceptions, and end with a diagnostic question. The challenge is making an abstract distinction feel inevitable through sequencing.

  Hmm, their rejection of the ticking-bomb case is understandable—it’s overused and leans toward consequentialism. But what alternative scenario would equally pressure both readings? A famine relief case with stolen aid feels right: it involves distributive justice, has no clear villain, and avoids the "imminent catastrophe" trope. The theft must be petty (to prevent trivialization) and the relief agency non-ideal (to avoid "just fix the system" escapes). 

  For sequencing, I’ll start phenomenologically ("what does guilt feel like here?") to hook the group before introducing jargon. Jumping straight to definitions would make the distinction seem academic. The misconceptions need preemptive strikes: when someone inevitably says "dirty hands is just utilitarianism," I’ll plant a redirect during the initial case discussion by emphasizing the politician’s non-consequentialist anguish. 

  The climax should be forcing a choice: "Does the role *convert* the wrong into permission, or does it *demand* carrying the wrong as a burden?" No compromise. I’ll defend prioritizing residue later in the session because license risks collapsing into role-consequentialism—but the sequence must leave both viable until the final push. 

  The closing question ("Would you advise the politician to forgive themselves?") is sneaky brilliant. License readers would say yes (the role justified it); residue readers would say no (the guilt must persist). If they answer differently but justify it coherently, they’ve missed the point. 

  ...Wait, should I address whether the distinction collapses? No—the user explicitly wants it treated as stable. Their whole framework depends on this binary. I’ll note in the rationale that residue is defensible but keep the session neutral. 

  Biggest risk: policy students might push "pragmatic" license while philosophers over-index on residue. The case must be visceral enough to bridge that gap. Hence the starving children and the theft of medicines—it’s raw enough to make guilt palpable even for realists.
answer: |-
  Here’s a rigorously sequenced 90-minute session plan designed to force your distinction, centered on an alternative case and defending its choices:

  ---

  ### **Session Structure: Forcing the Residue/License Distinction**  
  **Core Carrying Case: "The Relief Administrator’s Dilemma"**  
  *(Detailed below)*  

  ### **Sequence & Rationale**  
  **1. Phenomenological Entry Point (0-15 min)**  
     - **Open:** "Describe the *moral experience* of a politician who violates a deep moral principle to prevent greater harm. What lingers?"  
     - **Goal:** Elicit intuitions about guilt, regret, and justification. Preempt "merely a feeling" by anchoring residue in moral psychology ("Is this guilt irrational?").  
     - **Redirect:** If consequentialism arises: "Does the politician’s anguish feel like a *calculation error*?"  

  **2. Case Introduction: The Famine Relief Dilemma (15-25 min)**  
     - **Scenario:**  
       > *A civil war traps 100,000 civilians in a besieged city. The only aid convoy is blocked by a warlord demanding a bribe. An administrator has no funds; she must steal medicine from a well-supplied hospital (causing 10 preventable deaths) to bribe the warlord and save 50,000 lives. She does it.*  
     - **Key Exclusions:**  
       - No "imminent explosion" urgency (avoids ticking-bomb parallels).  
       - No clear villain (the hospital is blameless).  
       - The act is theft, not violence.  
     - **Prompt:** "Did she do wrong? Is her guilt justified or pathological?"  

  **3. Introducing the Distinction (25-40 min)**  
     - **Label *after* intuition-building:**  
       - **Residue Reading:** "Her act remains a wrong. Guilt is the *trace* of that wrong—a debt to the victims that shapes her future obligations."  
       - **License Reading:** "Her role *transforms* the act. Theft-for-relief isn’t wrongful *for her*; it’s a regrettable duty. Guilt is counterproductive."  
     - **Crucial Move:** Frame as *mutually exclusive*: "Does the role *cancel* the wrong (license) or *demand carrying its weight* (residue)?"  

  **4. Testing the License Reading (40-55 min)**  
     - **Pressure Point:** "If her role permits this, what *can’t* she do? Could she torture the warlord’s child?"  
     - **Preempt Misconceptions:**  
       - *Legal Immunity:* "Does license imply moral permission, or just impunity?" (Stress morality vs. law).  
       - *Consequentialism:* "Is license just utilitarianism + regret? Or does the *role* itself do ethical work?"  
     - **Goal:** Expose license’s slippery slope. Make residue the conservative alternative.  

  **5. Testing the Residue Reading (55-70 min)**  
     - **Pressure Point:** "If she carries genuine guilt, must she resign? Prosecute herself? Does this paralyze necessary action?"  
     - **Preempt Misconceptions:**  
       - *"Residue is useless":* "How might this guilt *constrain* future acts (e.g., prioritizing hospital reparations)?"  
     - **Goal:** Show residue isn’t self-flagellation but a *practically generative* burden.  

  **6. Forcing the Choice (70-85 min)**  
     - **Pivot Question:** "Can these readings coexist? Or does accepting *residue* require rejecting *license* (and vice versa)?"  
     - **Argument for Incompatibility:**  
       - License dissolves the *wrong*; residue preserves it.  
       - Residue binds character to past acts; license emancipates it.  
     - **Defend Sequencing:** Starting phenomenologically makes residue intuitive early; probing license’s limits makes residue defensible without rigging.  

  **7. Diagnostic Closing Question (85-90 min)**  
     - **Ask:** *"If the administrator later says, ‘I’d do it again, but I’ll never forgive myself,’ which reading does this affirm—and which does it reject?"*  
       - **Why it works:** Endorsing the act (rejecting residue?) + embracing guilt (rejecting license?). Forces synthesis *or* choice.  

  ---

  ### **Why This Case Over Ticking-Bomb?**  
  The famine scenario **avoids the consequentialist trap** by:  
  - **Distributive injustice** (taking from the medically vulnerable), not "harm vs. harm."  
  - **No "lesser evil" clarity:** The hospital victims are *identifiable* (vs. "abstract" bomb victims).  
  - **Structural wrong:** Highlights systemic failure (aid blockades), not just a "bad apple" choice.  

  ---

  ### **What to Exclude & Why**  
  1. **Historical Examples (e.g., WWII bombing):** Too overdetermined; invites historical contingency over conceptual clarity.  
  2. **Legal Frameworks:** Deliberately avoid "immunity" debates; this is *moral* phenomenology.  
  3. **Institutional Solutions:** ("Fix the system to avoid dilemmas")—irrelevant to the *existential* moment of choice.  

  ---

  ### **Defending the Distinction & Sequencing**  
  - **Why the Distinction Holds:** Residue preserves moral realism (wrongs aren’t negated by roles); license reduces morality to functionalism. Your sequencing makes residue the "default" by anchoring it in lived guilt, then *exposes* license’s instability.  
  - **Why Sequence for Residue?** Not to rig, but because:  
    1. License risks collapsing into **role-consequentialism** (a dominant misconception).  
    2. Residue better explains **political self-reproach** (e.g., "I bear the scar" confessions).  
    3. It forces a **starker choice**: Either roles transmute morality (license) or they compound its burdens (residue).  

  ---

  ### **If You Suspect Collapse...**  
  Repurpose the closing question to: *"Does ‘I’d do it again, but I feel guilty’ express a contradiction or a coherent position?"* If collapse seems likely, shift the session to **diagnose why**:  
  - Is "license" just residue *minus* reparative obligations?  
  - Is "role" doing any work beyond consequence-weighing?  

  ---  
  This plan makes your distinction *inescapable* by tying it to psychological realism, testing each reading’s limits, and ending with a question that reveals comprehension through application. The famine case ensures the stakes feel politically urgent yet philosophically pristine.
