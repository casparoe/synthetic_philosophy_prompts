prompt: |-
  A friend of mine who works in developer education keeps pressing an argument I cannot decide whether to accept. His claim is that the worry about people coming to depend on large language models for intellectual work is misplaced, because we have already run this experiment with the pocket calculator: teachers predicted that students would lose their grip on quantity and reasoning, nothing of the sort happened, and the tool merely moved the boundary of what counts as mechanical while leaving understanding intact. On his telling, the same will hold for models that draft arguments, summarize a literature, and propose hypotheses — the tedious part is automated, the understanding stays with the human — so the present anxiety is a rehearsal of a panic that already failed once. I am writing this up for a seminar and would like you to audit the analogy itself rather than opine on the general topic.

  Begin with a correspondence table: what plays the role of the calculator, of the arithmetic being done, of the student, of the teacher who certifies competence, and of the checkability of the result. Then tell me where the mapping breaks. I am especially interested in the features of the calculator case that my friend's version quietly imports — that the output can be verified by a procedure the user already commands, that the tool is transparent and its failure modes conspicuous, that what is offloaded is a closed computational task rather than the formation of judgment about what is worth doing, and that the surrounding social practice still requires hand competence as a precondition for using the tool at all. Which of these disanalogies matter for the conclusion he wants, and which are distractions? I would also like the question pushed from the individual to the community: calculators did not thin the supply of people who can do arithmetic unaided, but a world that never demands independent judgment before consulting a model may fail to reproduce its own auditors, and I want to know whether the analogy can speak to that at all.

  Finally, if the conclusion survives in some weakened form, state precisely what that form is; if it does not, say what it was resting on. And if the calculator is the wrong analogy, name the better one: people reach variously for the GPS, for reliance on expert testimony, and for hiring a ghostwriter, and I want to know which of those, if any, preserves the features that were doing the real work.
reasoning: |-
  Hmm, the user wants me to audit the calculator-LLM analogy for their seminar work. They're specifically interested in how the mapping works and where it breaks, focusing on verification, transparency, task boundaries, and social reproduction of skills. 

  The user's friend argues that LLMs will follow the calculator trajectory: automate mechanics while preserving understanding. But the user is suspicious this overlooks key differences. They've already identified some critical disanalogies themselves - especially around verification and the "judgment gap" - which shows impressive analytical depth. 

  Let me unpack the analogy systematically. First, the correspondence table: calculator=LLM, arithmetic=reasoning tasks, student=knowledge worker, teacher=professional standards, calculator output=LLM output. The surface mapping seems neat but cracks immediately when we poke it. 

  The core problem is arithmetic's verifiability versus reasoning's interpretive nature. With calculators, I *know* 7×8 must be 56 even before checking. With LLMs, I can't "recalculate" a literature summary - I need prior expertise to audit it. That's not just a technical difference; it undermines the whole premise of preserving understanding through automation. 

  Then there's the black box issue. Calculator errors are obvious (wrong numbers), while LLM hallucinations hide inside plausible language. And crucially, calculators offload closed computations, but LLMs blur the line between mechanical drafting and substantive judgment. 

  The social reproduction angle is devastating for the analogy. We still teach arithmetic because calculator use *presupposes* number sense. But if we stop teaching reasoning fundamentals (how to structure arguments, evaluate sources), future users won't have the tools to interrogate LLMs. That's collective skill atrophy. 

  For better analogies: GPS fails similarly (you can't verify routes without map skills). Expert testimony is closer but still requires baseline expertise to evaluate experts. Ghostwriting is the most honest match - it explicitly outsources expression, but society still expects writers to *have* thoughts before hiring ghosts. 

  Surviving insight? Only this: tools change what "mechanical" means. But LLMs don't just shift boundaries; they dissolve them. The calculator analogy rests on a false equivalence between procedural and interpretive work. 

  What the user might still find useful: this shows why domain-specific guardrails (like peer review for academia) become critical when adopting LLMs. But that's not what the friend claimed.
answer: |-
  Here's an audit of the calculator-LLM analogy, structured as requested:

  ### Correspondence Table
  | **Calculator Case**          | **LLM Case**                          |
  |------------------------------|---------------------------------------|
  | Pocket calculator            | Large Language Model (LLM)            |
  | Manual arithmetic            | Drafting, summarization, hypothesis generation |
  | Student                      | Knowledge worker/researcher           |
  | Teacher (certifying competence) | Educator/professional standards    |
  | Numerical result             | Textual/cognitive output              |
  | Checkability (re-calculation)| Verification of output validity       |

  ### Where the Mapping Breaks
  1. **Verification Asymmetry**  
     - *Calculator*: Output is independently verifiable using the same mental process the tool replaces (e.g., re-multiplying 7×8).  
     - *LLM*: Verifying a literature summary or argument requires *greater expertise* than generating it. The user must already command the domain to spot subtle errors/hallucinations.  

  2. **Transparency of Failure**  
     - *Calculator*: Errors are conspicuous (e.g., "2+2=5" is obviously wrong). Failure modes are predictable (overflow, syntax errors).  
     - *LLM*: Failures are camouflaged by coherence. Hallucinations, bias, or oversimplification emerge as plausible output, requiring forensic scrutiny.  

  3. **Task Boundary Definition**  
     - *Calculator*: Offloads a closed, mechanical task (computation) with unambiguous inputs/outputs.  
     - *LLM*: Blurs mechanical and intellectual labor. Drafting an argument *is* the act of reasoning; summarization entails curatorial judgment about significance.  

  4. **Competence Precondition**  
     - *Calculator*: Requires numerical literacy to use meaningfully (e.g., knowing *what* to calculate).  
     - *LLM*: Can be used without understanding the output’s substance, creating an illusion of competence.  

  ### Disanalogies Impacting the Conclusion
  **Crucial for Conclusion** (undermine the "no harm" claim):  
  - **Verification asymmetry** means LLMs don’t just automate mechanics—they risk decoupling output from user understanding. Unlike arithmetic, you can’t "check the work" without retained expertise.  
  - **Task boundary blurring** offloads *judgment* (e.g., "Is this hypothesis plausible?"), not just mechanics. This directly challenges "understanding stays with the human."  

  **Secondary (contextual)**:  
  - Transparency differences matter for error correction but don’t directly invalidate the core analogy.  
  - Competence precondition differences weaken social practice arguments but are less central.  

  ### Community-Level Disanalogy (Skill Reproduction)  
  - **Calculator**: Social practice (education, daily life) still demands arithmetic literacy. Calculators didn’t reduce the *supply* of people who understand math because basic numeracy remains a prerequisite.  
  - **LLM**: If society offloads *all* reasoning tasks (e.g., students never draft essays without LLMs), the pipeline for developing *auditors* atrophies. Unlike arithmetic:  
    - Independent judgment isn’t a visible checkpoint before LLM use.  
    - LLM output *mimics* understanding without requiring it, enabling bypass of foundational skill-building.  
  The analogy **cannot speak to this** because calculators never threatened the reproduction of numerical competence.  

  ### Survival of the Conclusion (Weakened Form)  
  The conclusion survives only for **narrow, well-bounded tasks** where:  
  - Output is easily verifiable by the user (e.g., grammar checks).  
  - The task is truly mechanical (e.g., templated text formatting).  
  - Social practices enforce independent competency standards (e.g., peer review in academia).  
  **Precisely**: "Tools may safely automate *verifiably mechanical* subtasks within intellectual work, but not open-ended reasoning requiring contextual judgment."  

  ### What the Analogy Was Resting On  
  The analogy assumed automation is neutral if it targets "mechanical" tasks. It failed by conflating:  
  - **Procedural tasks** (arithmetic) with **interpretive tasks** (argumentation).  
  - **Verifiable outputs** (numbers) with **unverifiable outputs** (judgment-dependent text).  

  ### Better Analogies  
  | **Analogy**       | **Preserves Strengths**                          | **Addresses Weaknesses?**         |  
  |-------------------|--------------------------------------------------|-----------------------------------|  
  | **GPS**           | Offloads navigation mechanics; requires destination input | No: Verifying routes requires map skills, but users rarely develop them. |  
  | **Expert Testimony** | Offloads knowledge; requires user judgment to evaluate credibility | **Yes**: User must retain critical thinking to assess experts, mirroring LLM verification needs. |  
  | **Ghostwriter**   | Offloads expression; user provides substance/direction | **Partially**: User must *have* ideas first, but ghostwriting doesn’t feign autonomy like LLMs. |  

  **Best Fit: Expert Testimony**  
  - Like an LLM, experts provide complex output the user may not fully generate.  
  - **Critical similarity**: Both require the user to exercise independent judgment to evaluate/output (assessing credibility/validity).  
  - **Key difference**: Experts are epistemically accountable; LLMs are not.  

  ### Summary  
  The calculator analogy breaks where reasoning tasks lack verifiability, transparency, and clear boundaries. The existential threat isn’t individual dependence but **community-level erosion of the skills needed to validate automated output**. The "no harm" conclusion holds *only* for tasks that are truly mechanical, verifiable, and embedded in competency-preserving practices. For higher-stakes cognitive work, the expert testimony analogy better captures the vigilance required.
