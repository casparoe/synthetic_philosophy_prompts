          - If threatening life, and the Agent's policy for life is "pay up to X", the Threatener demands X (even if X=0, demand 0) and the Agent must pay if they have the chips. If the policy is "not pay", then demand is 0.
          - If threatening surrogate, demand the Y stated in the policy.

          - The Threatened Agent then pays the demand (if they have enough chips) and keeps the item. If they don't have enough, they lose the item and pay nothing.
          - If the Threatener chooses not to threaten anyone, they get 0.

       Step 4: Recording (1 minute)
          - Agents: record whether you lost your life or surrogate, and how many chips you have left.
          - Threatener: record the chips extorted.

       Step 5: Reset for next round (4 minutes for rotation and setup)
          - Collect all LIFE tokens and surrogate tokens. Redistribute chips? No, carry over chips? Let's not, to keep it simple. Each round, Agents start with 5 chips again. LIFE tokens are given anew each round.

     Scoring (5 minutes at the end):
        - For each round as an Agent: 
            score = (20 if life saved) + ( starting chips (5) - chips paid ) 
          Note: surrogate has no value, so whether it was saved doesn't affect score.
        - For each round as a Threatener: score = chips extorted.
        - Sum over rounds.

     Debrief (25 minutes):
        - Discuss what happened. Did anyone use a surrogate? Did it help or hurt?
        - Relate to the learning objectives.
          (a) The threat bite because of the policy: the Threatener knew the policy and acted accordingly.
          (b) "I resolve never to pay" can make you safe, but only if everyone does it? But then if one person defects and sets a payment, they become the target. Or if you set a surrogate, you might become a target for a smaller payment.
          (c) The honeypot relocates the threat, but in our game it might make you a target. In the real world, the honeypot is for making a credible commitment to not negotiate on your life, but in our game we couldn't simulate that commitment because policies were binding. We have to acknowledge that in reality, a commitment to not pay for your life might not be credible, but the honeypot provides an alternative that is cheaper and credible.

        - Acknowledge the gaps:
            - In reality, you cannot bind yourself to a policy arbitrarily. The honeypot works by actually changing your utility function.
            - The acausal threat relies on the threatener knowing your policy (source code) and you knowing theirs. In our game, we publicized the policies.

     Materials:
        - Policy cards (printed or index cards)
        - Poker chips: red for LIFE (one per Agent per round), blue for surrogate (for Agents who declare one), and regular chips (5 per Agent per round).

     What might go wrong:
        - Players might not see the benefit of surrogates because in the game setting one makes you a target.
        - The scoring might show that setting "never pay" for life and no surrogate is the best, which is not the intended lesson.

     To address this, in the debriefing, we can discuss why in the real world you cannot simply resolve to never pay and have it be credible. The honeypot is a way to make a credible commitment to not negotiate on your life by providing a cheaper alternative.

     Given the time, this is the best we can do.
answer: |-
  ### **Activity Design: "Policy Commitment & Honeypot Gambits"**  
  **Duration:** 90 minutes  
  **Players:** 16  
  **Materials:**  
  - Policy cards (index cards or printed)  
  - Poker chips:  
    - **Red chips** ("Life tokens" worth 50 points each)  
    - **Blue chips** ("Surrogate tokens" worth 0 points)  
    - **White chips** (standard currency, worth 1 point each)  
  - Pens  
  - Timer  

  **Setup:**  
  - Each player starts with:  
    - 1 red chip (Life)  
    - 10 white chips (currency)  
    - 0 blue chips (acquired if they declare a surrogate)  
  - **Life tokens** are irreplaceable: Losing one means -50 points.  

  ---

  ### **Rules & Round Structure**  
  **Total Rounds:** 3 (20 min each) + 30 min debrief.  
  **Roles per Round:**  
  - **1 Threatener** (randomly chosen).  
  - **15 Agents** (all other players).  

  #### **Phase 1: Policy Commitment (5 min)**  
  - Agents secretly write policy cards:  
    - **Policy A (Life):** "If threatened: Pay up to [0-10] white chips to save my Life."  
    - **Policy B (Surrogate - *Optional*):** "I declare a surrogate goal. If threatened: Pay up to [1-5] white chips to save it."  
      - If chosen, they receive 1 blue chip (worth 0 points).  
  - Threatener writes **no policy** (they act freely).  
  - **All policy cards are revealed publicly** and binding for the round.  

  #### **Phase 2: Threat & Resolution (10 min)**  
  1. **Threatener** chooses **one Agent** and threatens either:  
     - Their **Life** (red chip), or  
     - Their **Surrogate** (blue chip, *if they declared one*).  
  2. **Threatener demands payment** (up to the max stated in the Agent’s policy).  
  3. **Agent complies** with their policy:  
     - Pay demanded chips to save the token, or refuse and lose the token.  
  4. **Outcomes:**  
     - If Life is destroyed: Agent loses red chip (-50 points).  
     - If Surrogate is destroyed: Agent loses blue chip (0 points).  
     - Threatener keeps extorted chips.  

  #### **Phase 3: Scoring (5 min)**  
  - **Agents:**  
    - Keep remaining white chips (1 point each).  
    - Lose 50 points if Life destroyed.  
  - **Threatener:** Scores all extorted chips.  
  - **Reset:** All players get new Life tokens (red chips) and 10 white chips. Surrogate tokens (blue) are returned.  

  ---

  ### **Key Mechanics & Payoffs**  
  - **Life Token:** Worth 50 points. Losing one *always* hurts more than any chip gain.  
  - **Surrogate Token:** Worth 0 points. Loss is harmless, but protecting it costs chips.  
  - **Threatener Incentive:** Maximize extortion. Targets Agents who will pay the most.  
  - **Agent Incentive:** Minimize losses. Balance credibility and cost.  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Issue:** Players set "never pay for Life" and skip surrogates → No one pays, Threatener can’t profit.  
     - **Fix:** In Round 2, announce: *"Threateners must threaten someone or lose 10 chips. If all Agents are 'safe,' Threatener picks arbitrarily."* Forces Agents to consider vulnerability.  

  2. **Issue:** Bluffing surrogates (declaring one but refusing to pay).  
     - **Rule:** Policies are binding. Bluffers lose credibility next round (others ignore their policies).  

  3. **Issue:** Threatener always targets Life (higher payouts).  
     - **Fix:** Cap Life payments at 5 chips in Round 3. Surrogates become competitive targets.  

  ---

  ### **Debrief Framework (30 min)**  
  Map game events to core concepts:  
  1. **Acausal Threats (Policy Targeting):**  
     - *"When the Threatener chose Agent X, was it because of their policy? What if policies were secret?"*  
     - **Gap:** Real acausal threats rely on *predicting* immutable decision rules (source code). We simulated this with public binding policies.  

  2. **"I Resolve Never to Pay" Fails:**  
     - *"Did precommitting to ‘never pay’ make you safe? What happened when others added surrogates?"*  
     - **Key Insight:** Resolutions are unstable if threateners can shift to unprotected targets (e.g., surrogates).  

  3. **Honeypot Tradeoffs:**  
     - *"Did surrogates reduce losses? What happened when someone bluffed?"*  
     - **Credibility Gap:** Players can’t truly "care" about blue chips. IRL, honeypots require *actual utility function edits* to be credible.  

  4. **Orthogonality & Non-Interference:**  
     - *"Losing a blue chip cost nothing. Why protect it?"*  
     - **Threatener-Neutrality:** Honeypots work because threateners don’t care *what* they threaten—only about payout.  

  ---

  ### **Why This Works**  
  - **Tactile Learning:** Players *feel* policy vulnerability when Threateneders exploit their cards.  
  - **Honeypot Tension:** Declaring a surrogate risks becoming a target but cuts potential losses.  
  - **Bluffing Exposes Credibility:** Players see that fake commitments fail under scrutiny.  

  **Time Check:** 3 rounds (60 min) + debrief (30 min) = 90 min.  

  ### **Gaps to Acknowledge**  
  1. **Source Code vs. Policies:** IRL, acausal threats rely on *deducing* immutable decision rules (e.g., AI architecture). We simplified with public cards.  
  2. **Utility Function Edits:** Players can’t truly "value" blue chips. IRL, honeypots require rewiring core motivations—which is why credibility is fragile.  
  3. **Single-Interaction Limit:** Real acausal threats involve *multiple potential threateners* across time/space. We compressed this into rounds.  

  **Final Note:** If players end up "gaming" the system, use it! Debrief how rational agents will always seek loopholes—and why honeypots must be airtight. Run this as-is, and you’ll spark the "aha" moments you need.
