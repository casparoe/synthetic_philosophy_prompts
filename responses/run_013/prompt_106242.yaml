prompt: |-
  I've started doing weekend walking tours of my city, which means I spend two hours a day telling strangers things, and its made me realize my own rules for when I'm allowed to say something are a mess. Where I land: reading the construction date off the plaque and repeating it, fine. Saying the building was built by a merchant who lost it in a card game, because I heard that once and it sounds right, not fine, even though I'd bet it's true. Saying 'we'll be done by 4, you'll make your train' when the tour has never once finished by 4, not fine. Telling someone nervous about flying that their flight will be fine, fine, even though I obviously don't know that. Guessing 'I think it's the old post office, don't quote me' when someone asks what a building is, fine; the same guess with the hedge stripped off, not fine. Someone selling me a bike they're sure is a lemon but which is actually a great deal, telling me it's a good bike: not fine. And the one I keep flip-flopping on: a tourist asks whether the neighborhood is safe to walk back through at night, I have no idea, and I hear myself say 'yeah, it's fine' — I can't decide if that's ok or not.

  Is there one principle that gets all of this, or close, and which of my verdicts does it make me give up? What would it say about promising rather than asserting — 'I'll have the money Friday' when I'm not sure — and about cases I haven't listed?
reasoning: |-
  Okay, let's tackle this user's query. They started giving weekend walking tours and realized their rules about what they can say are inconsistent. They provided several examples with their verdicts on what's fine or not. The user wants a unifying principle that covers all these cases and might challenge some of their existing judgments.

  First, I need to identify the common threads in their examples. They mention things like stating factual info from plaques (fine) versus repeating unverified anecdotes (not fine). Then there's promising a tour end time they know is unrealistic (not fine) versus reassuring someone about a flight (fine). Also, hedging guesses are okay but stating them as facts isn't. The bike seller lying about a lemon being good is not fine. The tough one is telling a tourist a neighborhood is safe without knowing.

  The user's underlying need seems to be a desire for ethical consistency. They want clear guidelines to avoid misleading people, especially since their role as a tour guide positions them as an authority. The deeper issue might be about trustworthiness and the responsibility that comes with their role.

  Looking at ethical principles, accuracy vs. intent comes to mind. But intent alone doesn't cover all cases, like the flight reassurance where intent is good but accuracy is low. The role-based responsibility angle makes sense here. As a tour guide, they're expected to provide accurate historical info, but not necessarily safety assurances. That explains why flight reassurance is okay—it's not within their expert role, but neighborhood safety might be perceived as part of it.

  Promising money by Friday when unsure falls under commitments. Even if unsure, making a promise implies certainty, which violates the role responsibility if they can't deliver. The principle would advise against such promises unless certain.

  The user might also be concerned about practical applications. They need a rule that's easy to apply during tours without overcomplicating. The role-responsibility principle offers that by categorizing statements based on their role's scope. Historical facts = must be verified, personal reassurance = okay if well-intentioned but outside expertise, commitments = only if certain.

  They might need to adjust their verdict on neighborhood safety. Since it's related to their tour context, saying "I don't know" is better than a false assurance. The bike seller example clearly violates honesty in a transactional role.

  In conclusion, the role-responsibility principle covers most cases, urging clearer boundaries on safety assurances and promises. It provides a practical framework for the user to maintain trust and ethical consistency in their tours.
answer: |-
  Based on your examples, you're intuitively wrestling with the ethics of **asserting authority or knowledge you don't possess**, particularly when your words might lead someone to rely on you and potentially come to harm or disadvantage. The unifying principle that best captures your intuitions and organizes your verdicts is:

  **The Principle of Role-Responsibility:** *When speaking within a specific role (like tour guide, seller, advisor), you incur a heightened responsibility for the truthfulness and reliability of statements that fall within the expected domain of that role. Outside that domain, assertions carry less weight, but you must still avoid knowingly misleading people or making reckless promises you can't keep.*

  Here's how it breaks down your examples:

  1.  **Reading the plaque date (Fine):** Core role responsibility. Providing verifiable historical facts is central to being a tour guide. You have access to the source (plaque).
  2.  **Repeating unverified anecdote (Not Fine):** *Violates role-responsibility.* Presenting historical narrative is core to your role. Asserting an unverified story *as fact* misuses your authority within that domain.
  3.  **Promising "done by 4" knowing it's unlikely (Not Fine):** *Violates role-responsibility.* Managing time and expectations is a core function of leading a tour. This is a direct promise about the service you are providing.
  4.  **Reassuring about flight safety (Fine):** *Outside core role-responsibility.* You are not an aviation expert, safety advisor, or fortune teller. This is a well-intentioned, non-expert expression of comfort/support, understood as such by the listener in that context. Your role doesn't imply expertise here.
  5.  **Hedged guess about a building ("I think... don't quote me") (Fine):** *Manages role-responsibility.* You signal the limits of your knowledge within the core domain (building ID). You're not asserting authority you lack; you're offering an opinion with caveats.
  6.  **Unhedged guess about a building (Not Fine):** *Violates role-responsibility.* Presenting an unverified guess *as identification* within the core domain of your role misuses your implied authority as an information source.
  7.  **Seller lying about a lemon bike being good (Not Fine):** *Violates role-responsibility.* Assessing product quality and representing it honestly is the *entire core* of the seller's role. This is a direct, knowing misrepresentation within that domain.
  8.  **Telling tourist neighborhood is "fine" at night without knowing (Flip-Flop):** ***This is where the principle clarifies it's likely NOT FINE.*** *Touches on role-responsibility.* While not a security expert, visitor safety *is* tangentially related to the context of your role as a city guide. Your answer might be relied upon for a safety decision. "I don't know" or "I'm not the best person to ask, but generally..." is safer than a baseless assertion of safety. Saying "it's fine" implies knowledge you admit you lack, within a domain (local conditions) relevant to your role.

  **What Verdicts Does This Principle Make You Give Up (or Modify)?**

  1.  **The Flight Reassurance:** Your "fine" verdict stands, but the principle explains *why*: It falls outside your core role-responsibility. People don't reasonably rely on a tour guide for flight safety prognostication.
  2.  **The Neighborhood Safety Assurance:** The principle strongly suggests your "yeah, it's fine" **should be NOT FINE**. It's too close to the responsibilities of your role (advising visitors) on a matter with potential consequences. Admit ignorance or direct them to official sources.
  3.  **The Hedged Guess:** Your "fine" verdict is correct and exemplifies *managing* responsibility by signaling uncertainty.

  **Applying the Principle to Promises and Other Cases:**

  *   **"I'll have the money Friday" (when unsure):** *Violates role-responsibility.* Making a specific commitment about your own actions (especially financial) creates an expectation of reliability. If you are unsure, this is a reckless promise. The ethical approach is: "I *aim* to have it Friday," or "I'm working on having it Friday, but I can't guarantee it yet."
  *   **Medical Advice (as a non-doctor):** *Violates role-responsibility.* Even if you read a medical journal, giving specific advice ("You should take X") wildly exceeds your role and expertise, posing serious risk. "I'm not a doctor, you should consult one" is the only ethical response.
  *   **Recommending a Restaurant (as a local):** *Generally Fine.* While within the general domain of a tour guide/local, recommendations are understood as subjective opinions, not expert certifications. Qualifiers help ("I really like...", "It's popular for..."). If you *know* it has health violations and recommend it anyway, that becomes *Not Fine* (knowingly misleading).
  *   **Speculating on Future Events (e.g., "This area will be redeveloped next year"):** *Not Fine* if stated as fact without solid source. *Fine* if clearly hedged ("There's *talk* of redevelopment," "Plans *have been proposed*..."). Predicting the future falls outside your role's core responsibility unless you cite official plans.

  **Key Takeaways:**

  1.  **Context is King:** Your role defines the expectation of reliability.
  2.  **Domain Matters:** Core functions (facts, logistics, safety advice *within context*) demand higher accuracy than peripheral opinions or well-meaning reassurance on unrelated topics.
  3.  **Manage Uncertainty:** Hedging ("I think," "I believe," "According to...", "Don't quote me," "I'm not certain but...") is crucial when speaking within your role's domain without solid knowledge. Silence or "I don't know" is often the most responsible answer.
  4.  **Avoid Reckless Promises:** Commitments about your own actions or services must be made with high confidence you can fulfill them.
  5.  **Intent Isn't Enough:** While good intent matters (flight reassurance), it doesn't excuse misuse of authority within your role's domain (unverified history, false promises, baseless safety assurances).

  This principle helps you navigate the grey areas by focusing on the expectations *created by your role* and the potential for harm if those expectations are betrayed through recklessness or dishonesty. It suggests you tighten up on baseless safety assurances and unhedged guesses within your tour domain, while allowing for supportive talk outside it.
