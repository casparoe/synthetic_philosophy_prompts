answer: |-
  Below is a line-by-line critique addressing your priorities. I’ve tested your core distinction against potential collapses, flagged technical concerns, and stress-tested your framing. The essay is analytically sharp and novel, but needs tightening on quantitative genetics and counterfactual specificity.

  ### 1. **On the Distinction: Real and Robust?**  
     - **Strongest collapse argument**: Intervention-heritability *could* be seen as variance-heritability recalculated for a counterfactual population post-intervention. If we define a new population (P*) where the intervention is applied uniformly, variance-heritability in P* might resemble your intervention-heritability.  
     - **Why it survives**: Your intervention-heritability is *indexed to an intervention*, not a population. It answers: "What fraction of *current* variance would this *specific action* remove?" This is causal (leveraging do-operators), not descriptive. Variance-heritability is static; intervention-heritability is dynamic and tied to a manipulation. The distinction holds when interventions alter variance structure non-uniformly (e.g., a gene-editing intervention that reduces variance non-linearly).  
     - **Terminology**: Reserve *heritability* for variance-heritability. Intervention-heritability is better termed *interventional variance reduction* (IVR) to avoid ambiguity.  
     - **Definition tightness**: Your "fraction of current variance removed" is functional but risks edge cases. *Problem*: If an intervention *increases* variance (e.g., variable drug responses), IVR could be negative. Specify: "the signed proportion of current trait variance eliminated or introduced by the intervention."  

  ### 2. **Accuracy Flags**  
     - **Heritability estimates bearing on intervention (Q2)**: You state this requires assumptions (limited G×E, no extreme environments). This is *mostly correct* but undersells the problem. Crucially, heritability estimates (e.g., from twin studies) assume *additivity*. If non-additive effects (epistasis, dominance) are large, even within-range interventions may have unpredictable effects. *Recommendation*: Add: "under strong assumptions of additivity and no G×E correlation."  
     - **G×E and G-E correlation**: You "gesture and drop" these, but they’re fatal to Q1→Q2 inferences. G-E correlation inflates heritability estimates; G×E means intervention effects depend on starting genotype. *Add a sentence*: "These assumptions fail categorically where genotypes non-randomly experience environments, or where genetic effects are context-dependent."  
     - **"Unnamed gap" (heritability vs. GWAS variance)**: You imply high heritability doesn’t entail identified genetic variants. This is correct (missing heritability problem) but risks conflating *estimates* (e.g., h²=0.8) with *mechanistic accounting* (SNPs explain 5%). *Clarify*: "High heritability estimates need not imply tractable genetic architecture—a population’s genetic variance component can dwarf the variance explained by known loci."  

  ### 3. **Target: Real or Straw Man?**  
     - **Strongest version of standard view**: "Heritability quantifies genetic contributions to observed variation in a population. It cannot predict causal effects of interventions or explain group differences. Any attempt to extrapolate it beyond this is a category error."  
     - **Does anyone hold this?** Yes—in pedagogical contexts (textbooks like Falconer’s, policy primers). Specialists know it’s nuanced, but the "ritual" persists in public discourse (e.g., reaction to Herrnstein/Murray debates).  
     - **Your contribution survives**: The standard view treats Q2/Q3 as *uniformly* unanswerable by heritability. You show Q2 *can* be informed (weakly) by heritability, while Q3 requires counterfactual specification—it’s not inherently unanswerable. This refines the critique.  

  ### 4. **Q3: Trivial or Substantive?**  
     - **"No answer until specified" is correct and non-trivial**: While all causal questions need specification, the "group gap" context uniquely invites *indeterminate* questions (e.g., "how much is genetic?" absent a counterfactual). The within-between argument’s force is to block *default* genetic answers to ill-posed gap questions. *Keep this section*, but sharpen: "Unlike general causal queries, gap questions are routinely posed without counterfactuals, inviting reification of population differences."  

  ### 5. **Structure and Cuts**  
     - **Section 4 (proposal) vs. Section 5 (diagnosis)**: End on your positive proposal (Sec 4). Section 5’s "why confusion persists" repeats Sec 2’s "sliding between questions." *Move* the "partly genetic/environmental" critique from Sec 5 to Sec 2, where it logically fits.  
     - **Nearsightedness example**: Vital. It dissociates variance-heritability (high) from intervention-heritability (high for glasses/surgery). Keep it.  
     - **Cut**: Section 5’s first 1.5 sentences (on parties’ interests) are redundant. Lead with: "Both inferences fail because the decomposition is mistaken for a recipe..."  

  ### 6. **The Thing You Might Have Wrong**  
     Your intervention-heritability (IVR) assumes interventions reduce variance linearly. But if an intervention interacts with residual genetic variation (e.g., a drug only works for subset of genotypes), IVR could *increase* variance. Example: A uniform educational intervention might widen trait variance if genetically susceptible subgroups respond more. Your definition holds, but this edge case needs a footnote: "IVR may be negative if variance increases, revealing hidden G×E."

  ---

  **Overall**: The distinction is real and valuable. Prioritize these edits:  
  1. Tighten intervention-heritability’s definition and rename it (e.g., IVR).  
  2. Address non-additivity/G×E in Q1→Q2 inferences.  
  3. Cut repetitive diagnosis; end on the proposal.  
  4. Clarify that gap questions (Q3) are *routinely* underspecified in contentious debates.  

  The essay succeeds in exposing why "ritual clarifications" don’t resolve disputes. With these tweaks, it’s workshop-ready.
