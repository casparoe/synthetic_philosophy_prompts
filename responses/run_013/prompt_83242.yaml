  The dividend/tax terminology feels fresh and vivid for popular science writing, though the underlying concept is well-established in statistical literature. Condorcet did explicitly discuss independence in his original work, contrary to what the user suspects. The jury-to-AI leap works because the theorem's math applies to any binary decision agents. 

  Structurally, the machine learning section probably needs more concrete examples of how correlation sneaks into ensembles (e.g., same training data producing correlated model errors). The deliberation part feels underdeveloped - maybe cut some exposition there to expand on real-world cases where correlation tax dominates, like homogeneous teams or algorithmic herding. 

