prompt: |-
  I'm definately in a weird headspace about Bongard problems after a seminar and I want to see if fiction can do something the papers can't. Could you write me a short story, maybe 1200 to 1800 words, that's built around a Bongard-style test but takes the induction problem seriously? Here's the seed I keep circling: a lab has a wall of 12 panels, six on the left, six on the right, and the rule seperating them is not a visual feature of any single panel. The left-hand panels are all generated by a process that looks back at the panel it just drew, while the right-hand ones are generated by a process that only looks forward. In the final images the two sets are indistinguishable by any local feature; you can only tell by considering the sequence of strokes that produced them. The lab's AI solves every standard Bongard set but keeps giving rules for this one that fit all 12 examples and are obviously wrong to the humans. The protagonist, a grad student who built the generator, starts to suspect that wrong just means not the rule she had in mind, and that the test is really measuring whether the solver shares her inductive biases. I'd like the story to have a concrete setting -- late nights in a cognitive science basement, a whiteboard covered in failed rules, maybe a visiting researcher who thinks the whole enterprise is a category error -- and to dramatize the moment where the student has to decide whether to change the test or change her idea of what a concept is. No need to name real researchers or cite anything; I want the philosophical content to come through the characters and the puzzle, not through exposition. Also, if it helps, feel free to invent a few extra Bongard panels or a second test that makes the underdetermination worse. I don't need a tidy moral, but I'd like the ending to leave the reader unsure whether the AI failed or the humans did.
