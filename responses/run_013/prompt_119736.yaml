prompt: |-
  I'm working up a short paper on consent, and before I inflict it on anyone I want you to go after the argument. Here's the gist of it, roughly as it stands:

  The standard list of conditions on valid consent — competence, information, voluntariness — is really a list of conditions on two different things we've been calling by one name, and most of the puzzles in this area come from running them together.

  Call the first thing *authorization*: you lift a boundary and make it permissible for someone to do a thing to you. Call the second *risk-assumption*: you take on the possibility that the thing goes badly. Authorization is about the act's nature and scope; risk-assumption is about its consequences. The conditions attach differently. Competence to authorize is competence to grasp what act is being performed; competence to assume a risk is competence to grasp stakes and probabilities, which is a different and often lower bar. Deception about what act is being done kills authorization and leaves risk-assumption untouched — told it's a biopsy when it's an experimental implant, you didn't authorize it, and the fact that you'd have accepted the odds is irrelevant. Deception about consequences leaves authorization intact and kills risk-assumption: you authorized the operation, the surgeon committed no trespass, but he has no claim on your having accepted the odds. Coercion cuts the same way. A threat attached to the very act ("sign or I'll shoot") means the signature isn't yours, so no authorization. A threat elsewhere in your life ("take the job or lose the house") leaves the contract authorized but poisons your acceptance of its risks.

  Two things fall out that I like. First, you can say both "she consented" and "she was wronged" without contradiction: she authorized the act, and the actor still had no valid claim on her acceptance of the risk, so he's on the hook for the harm but not for battery. Second, cases that look like one hard problem split cleanly and seperately. Someone lies about having had a vasectomy — on my view that's a lie about consequences, so the sex is authorized and the risk-acceptance isn't; it's a wrong but not a rape. Someone secretly takes the condom off mid-act — that changes what act is being done, so authorization fails and it is. Likewise a study that lies about its hypothesis (the participant still authorizes the pill-taking, and it's the risk-acceptance that's defective) versus one that lies about what's in the pill.

  Comments, please. Four things specifically: (1) is the authorization/risk-assumption split a real distinction or just the act/omission or scope/risk line with new labels; (2) are my verdicts on those cases right, especially the vasectomy one, since if the split can't handle it the whole thing is dead; (3) what's the strongest objection to the claim that someone can validly authorize an act while invalidly assuming its risk; (4) anywhere I've overstated how settled the standard view actually is. Lead with your bottom line in the first sentence and then give the reasoning, no preamble and don't restate what I've asked.
reasoning: |-
  Okay, the user is working on a paper about consent and wants me to critique their argument. They're distinguishing between two aspects of consent: authorization (permitting the act itself) and risk-assumption (accepting potential negative outcomes). I need to address four specific points: whether this split is truly novel, if their case verdicts hold up (especially the vasectomy example), the strongest objection to separating authorization from risk-assumption, and whether they've overstated how settled the standard view is.

  First, the authorization/risk-assumption distinction. The user claims this isn't just relabeling existing concepts. Looking at their examples, deception about the act (like swapping a biopsy for an implant) clearly violates authorization but not risk-assumption, while deception about consequences (like undisclosed side effects) preserves authorization but voids risk-assumption. This feels distinct from simple act/omission distinctions because it specifically addresses the agent's understanding of what they're permitting versus what they're gambling on. The vasectomy case will be crucial here—if deception about fertility is purely about consequences rather than the act's nature, that supports their framework.

  About the vasectomy verdict. They argue it's not rape because the sexual act itself was authorized, only the risk-assumption was invalid. This aligns with some legal perspectives where fraud about collateral matters doesn't vitiate consent to the act. But I can see a counterargument: if pregnancy risk fundamentally changes the nature of sex for the deceived partner, it might void authorization. Their framework could handle this by emphasizing context—if fertility is material to what the act means to that person, it shifts from risk to authorization. They need to acknowledge this nuance.

  The strongest objection to separating authorization and risk-assumption would be from relational autonomy theories. Scholars like O'Neill or Manson might argue that consent is holistic—you can't neatly sever the act from its foreseeable impacts because assuming risks is inherent to meaningful authorization. If someone consents to surgery, they're inherently accepting known risks; carving out "risk-assumption" as separate could undermine autonomy by letting actors offload responsibility for consequences they control.

  Regarding the standard view's settledness. The user slightly overstates it. While competence/information/voluntariness are canonical (Beauchamp & Childress, Faden et al.), there's active debate about their application. Cases like conditional consent (e.g., "only with a condom") challenge where "act description" ends and "consequences" begin. Their framework actually engages with these debates, so they should position it as resolving ambiguities rather than claiming current consensus is monolithic.

  For the vasectomy case, their verdict is defensible but fragile. It works if sex is defined mechanistically, but if the partner's understanding of "sex" includes shared contraception responsibility, deception could void authorization. They should strengthen this by discussing how context determines whether a factor is part of the act's nature or mere consequence.

  Overall, their split is substantive, not just relabeling. The strongest pushback will be on whether risk-assumption can be disentangled from authorization without violating autonomy. They should preempt this by arguing that their approach better protects agents—by ensuring actors can't hide behind "you consented to the act" when lying about risks—while acknowledging edge cases where the line blurs.
answer: |-
  **The authorization/risk-assumption split is a substantive distinction that resolves puzzles better than simple act/omission or scope/risk labels, though its application to cases like vasectomy deception is defensible but contestable, the strongest objection centers on the inseparability of acts and foreseeable consequences in autonomy, and you slightly overstate the monolithic nature of the "standard view" on consent conditions.**

  1.  **Distinction vs. Relabeling:** The split is a *real distinction*, not mere relabeling. While related to act/omission/scope/risk, it specifically carves consent into two distinct normative functions with different validity conditions. Act/omission focuses on what is done; scope/risk focuses on boundaries or potential harms. Your distinction targets *why* consent fails: invalidation due to misunderstanding the *act's nature* (killing authorization) versus misunderstanding *consequences* (killing risk-assumption). This explains divergent intuitions in deception/coercion cases better than simpler dichotomies. It’s functional, not just descriptive.

  2.  **Case Verdicts (Vasectomy Focus):** Your verdicts are *largely defensible and internally consistent*, but the vasectomy case is the **weakest link** and hinges critically on framing "fertility status" as a *consequence* of sex rather than a *defining element* of the act consented to.
      *   **Vasectomy Deception:** If "sex" is defined purely as the physical act, deception about fertility is a risk/consequence (pregnancy/STI) issue. Authorization stands; only risk-assumption fails. This avoids categorizing it as rape/battery. *However*, if the deceived party understood "sex" *as* "sex with a fertile partner" or "sex without contraception," the *nature* of the act changes, voiding authorization. Your framework *can* accommodate this if context shows fertility was material to the act's description, but your default framing risks underplaying how deeply consequences can be embedded in the act's perceived nature for the consenter.
      *   **Stealthing:** Correct. Changing the physical act (barrier-protected vs. unprotected) mid-performance clearly voids authorization. It's a different act.
      *   **Study Deception:** Correct. Lying about the hypothesis deceives about risks/consequences of the authorized pill-taking. Lying about the pill's content deceives about the nature of the act itself (taking drug X vs. drug Y).

  3.  **Strongest Objection to Separating Authorization & Risk-Assumption:** The **strongest objection** is that **foreseeable, material consequences are inherently part of the "act" for autonomous authorization**. Truly autonomous consent to an act *requires* understanding its core, probable, or intended outcomes. Separating authorization from risk-assumption artificially severs the act from its defining context and stakes, rendering "authorization" hollow. If someone consents to surgery knowing it's an appendectomy but not knowing a 20% risk of paralysis is deliberately concealed, critics argue they didn't *truly* authorize the *full reality* of the act being performed upon them, as the risk is a fundamental aspect of what makes the act *that* act. Authorization, on this view, *encompasses* accepting inherent, material risks known to the actor.

  4.  **Overstatement of Standard View Settledness:** You **slightly overstate** the monolithic nature of the standard view. While competence, information, and voluntariness are canonical (e.g., Faden & Beauchamp, Beauchamp & Childress), there's significant debate *within* this framework:
      *   **Information Scope:** What constitutes "adequate information"? Is it only the nature of the act, or must it include material risks? Your split directly engages this contested boundary.
      *   **Voluntariness Nuance:** Distinctions between coercion (invalidating consent) and mere pressure (potentially not) are heavily debated. Your threat examples touch on this, but the standard view isn't uniformly applied.
      *   **"Nature of the Act" Definition:** Precisely what defines the "act" is a major source of confusion in case law and theory (e.g., fraud in the factum vs. fraud in the inducement debates). Your framework directly addresses this ambiguity, showing the standard view's application is less settled than its core elements suggest.
