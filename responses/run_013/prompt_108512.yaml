prompt: |-
  I'm starting a three-year postdoc in the fall with almost no teaching, and I get to work on whatever I want. I've pretty much decided its going to be the peer disagreement literature — conciliationism, steadfastness, higher-order evidence, the whole pile. The problem is I can't tell which of the open questions in there is actually worth three years of my life, as opposed to a good seminar paper. Half the stuff I read feels like the same paper: two idealized agents, identical evidence, a restaurant check, and then a fight about whether you have to split the difference. I don't want to write a seventh version of that.

  There are three things I've been chewing on that might be where the real open questions are, but I honestly can't tell if they're genuine openings or just changes of subject. Use them if they're useful, tell me if they're not:

  1. Almost everyone frames the question as what you should believe when a peer disagrees. But maybe the questions that actually matter are about what to do next — whether to keep digging, whether to defer in practice while privately thinking the other person is wrong, when it's worth spending a decade trying to change their mind. Does treating this as a question about inquiry rather than belief open anything up that the belief-first framing closes off, or is it the same questions in a new coat?

  2. The literature is basically always about two people. But real disagreement is many-sided — a field, a committee, a whole literature — and then you need some story about how the many-sided version aggregates into anything at all. Is the interesting work there, or is that just social choice theory wearing a philosopher's hat?

  3. The view seems to eat itself: if you and I disagree about conciliationism, then by conciliationist lights you should partly defer to me about conciliationism, which looks like it undercuts the whole thing. Is the self-undermining problem still a live question, or is it settled and I just haven't found where?

  What I want from you is a ranked agenda: which open questions in this area deserve the years, and why. I care less about the list than the reasoning. For each one, tell me why it's upstream of the others — what other questions change their answer if this one gets settled — how tractable it is for one philosopher with three years and no lab, and what kind of result over the next year or two would move it up or down the ranking. The end I care about is work that's still being argued about in twenty years, not just a publication; rank accordingly, and if your top pick is something I haven't listed, fine, but say why it beats the three above.

  Also, tell me where you're guessing. I'd rather have a ranking with its weak joints marked than a confident one I can't trust. And say what would change your mind — which argument or development would make you reorder it, and where you think your reasoning is most likely to be wrong.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They're a new postdoc with three years to dive into peer disagreement literature, but they're frustrated with the repetitive nature of the current debates. They want to know which open questions are worth dedicating three years to, not just a seminar paper. They’ve proposed three potential directions but are unsure if they’re genuinely fruitful or just tangential.

  First, I need to unpack their three points. The first is about shifting from belief to inquiry—focusing on actions post-disagreement. The second is moving from dyadic to multi-party disagreements. The third is the self-undermining problem for conciliationism. They want a ranked agenda based on upstream impact, tractability, and long-term relevance.

  Let me evaluate each point. For the inquiry-based approach, it’s a shift from epistemology to practical rationality. The user’s concern is whether this is genuinely new or just repackaging. The key here is if linking epistemic norms to practical decisions (like further research or collaboration) can resolve deadlocks in the current literature. The challenge is grounding normative principles for action, which might involve decision theory. If successful, this could change how we approach disagreements in real-world settings, like scientific collaborations or policy-making. But is it tractable? They’d need to engage with decision theory and case studies, which is doable in three years without a lab. A strong interdisciplinary connection to fields like philosophy of science could boost its impact.

  Next, multi-party disagreements. The user worries this might just be social choice theory in disguise. But actually, applying judgment aggregation to epistemology is underexplored. Questions about how group beliefs form from individual disagreements could address real academic or committee dynamics. The literature on judgment aggregation provides tools, but applying them to peer disagreement requires careful adaptation. This has high upstream potential because solving multi-agent aggregation could inform dyadic cases by showing when two-agent models are insufficient. However, it’s technically demanding, needing formal modeling skills. If they can partner with a formal epistemologist, it becomes more feasible. Recent work in computational social choice could be a sign this area is heating up.

  The self-undermining problem seems like it might be played out. The user mentions not finding where it's settled, but there are existing solutions like bootstrapping or contextualism. The challenge is whether new angles exist, perhaps connecting to global skepticism or epistemic circularity. While important, it’s more contained and might not offer as much upstream impact. If someone reframed it using tools from metaepistemology, it could rise in priority, but currently, it seems less transformative.

  Now, considering other potential areas not mentioned by the user. One is the role of non-idealized factors—like biases, expertise differentials, or social dynamics. The user dismissed "restaurant check" examples, so this might align with their desire for real-world relevance. Another is integrating with moral disagreements, which has seen interest recently. But the user’s inquiry approach might cover similar ground. A third is formalizing higher-order evidence in disagreement, but that might fall into the technical trap they want to avoid.

  Ranking them: Inquiry-based (#1) because it reframes the entire debate, linking epistemology to action. Multi-party (#2) for its scalability and formal potential. Self-undermining (#3) as it’s more niche. But I need to justify why inquiry beats multi-party. The key is that inquiry’s practical focus could absorb insights from multi-party settings, whereas the reverse isn’t as clear. Plus, inquiry’s interdisciplinary reach might have broader impact.

  Tractability: Inquiry requires decision theory but no formal modeling beyond what they know. Multi-party needs more technical work, which could be a hurdle. Self-undermining is contained but might not sustain three years.

  Long-term relevance: Inquiry could influence applied fields, making it more likely to be cited. Multi-party could become central if formal methods gain traction. Self-undermining is foundational but perhaps settled.

  The user’s deeper needs: They want impactful work that avoids rehashing old arguments. They value originality and lasting impact over quick publications. They might also seek to make philosophy more applicable, hence favoring practical or multi-agent approaches. Unspoken needs could include establishing a niche in the field or interdisciplinary connections for future career moves.

  I should be transparent about uncertainties. Is inquiry too broad? Maybe, but that’s also its strength. Multi-party’s technical demands might be higher than I think. Self-undermining could resurge if linked to new skepticism debates. Monitoring emerging literature will be key for them to adjust priorities.
answer: |-
  Based on your frustration with the "restaurant check" literature and your desire for impact over 20 years, here's a ranked agenda for your 3-year postdoc, analyzing your three proposals plus a dark horse candidate. I'll evaluate based on: **Upstream Impact** (does solving this change other answers?), **Tractability** (3 years solo), **Horizon Value** (20-year relevance), and **Risk Factors**. I'll flag where I'm guessing and what could change my mind.

  ---

  ### **Ranking & Analysis**
  *(From highest to lowest potential for transformative impact)*

  1.  **Your #1: From Belief to Inquiry & Action**  
      **Core Question:** What *practical epistemic norms* govern action, research investment, and communication *after* recognizing peer disagreement?  
      **Why it Wins:**  
      - **Upstream Impact (Highest):** This reframes the entire debate. Solving "what to do next" could *dissolve* deadlocked belief-first arguments by showing they're incomplete (e.g., steadfastness might be irrational for belief but rational for cost-effective inquiry). It forces engagement with decision theory, social epistemology, and philosophy of science.  
      - **Tractability (High):** Builds on existing tools (formal cost-benefit analysis, case studies from scientific controversies, communication ethics). No lab needed—analyze historical/current disputes (e.g., climate science debates, replication crises).  
      - **Horizon Value:** Directly addresses real-world problems (funding allocation, expert deference in policy, academic collaboration). Philosophy of science and AI alignment communities would engage deeply.  
      - **Risk Factors:** Might feel "applied" to traditionalists; needs sharp boundaries to avoid becoming "just" practical reasoning.  
      **Tipping Point:** If, within 18 months, you formalize a decision-theoretic framework linking disagreement strength to optimal inquiry effort that *predicts* real cases better than belief-centric models, this becomes the agenda-setter.  
      **Why beats #2/#3:** It subsumes them. Multi-party disagreement (#2) is a *subcase* of complex inquiry dynamics. Self-undermining (#3) becomes a practical problem of resource allocation ("Do I spend time convincing conciliationists?").

  2.  **Your #2: Many-Sided Disagreement & Aggregation**  
      **Core Question:** How do *group-level epistemic states* emerge from networks of peer disagreement, and what norms govern individual belief in complex epistemic environments?  
      **Why it's Strong:**  
      - **Upstream Impact (High):** Exposes a fatal flaw in dyadic models: they ignore how *distributed* disagreement alters individual obligations (e.g., if 5 peers split 3-2, is your duty to the majority? The expert subset?). Forces integration with social choice/judgment aggregation.  
      - **Tractability (Medium-High):** Leverage existing formal work on belief aggregation (e.g., List/Pettit, Lehrer-Wagner models). Requires modeling but no empirical data. Key challenge: avoiding mere technical generalization.  
      - **Horizon Value:** Crucial for understanding scientific consensus, committee decisions, and online epistemic communities. Bridges to computational social science.  
      - **Risk Factors:** Could devolve into "social choice theory + philosophy examples" without distinct *epistemic* insights.  
      **Tipping Point:** If you demonstrate a *novel epistemic paradox* arising only in N>2 disagreements (e.g., aggregation forcing individually rational agents into collective inconsistency), this jumps to #1.  
      **Why beats #3:** It addresses a *structural* gap in the literature, while #3 is a localized puzzle. More likely to redefine the field’s scope.

  3.  **Dark Horse: Disagreement Under Non-Ideal Conditions**  
      *(Not on your list, but beats #3 in potential)*  
      **Core Question:** How do *power dynamics, cognitive biases, identity, and institutional structures* distort peer recognition and disagreement resolution?  
      **Why it's Promising:**  
      - **Upstream Impact (Medium-High):** Challenges the idealized "peer" assumption as not just incomplete but *misleading*. Explains why real-world disagreement persists (e.g., why women/POC are less likely to be deemed "peers"). Could force a paradigm shift.  
      - **Tractability (Medium):** Requires interdisciplinary work (social epistemology, feminist philosophy, psychology) but relies on existing critiques (e.g., Anderson, Fricker). Case-study heavy.  
      - **Horizon Value:** Aligns with urgent debates on epistemic injustice, misinformation, and academic reform. Guarantees relevance beyond philosophy.  
      - **Risk Factors:** Might be seen as "not core" disagreement theory; needs careful argument to avoid preaching.  
      **Why it's Here:** Directly tackles your frustration with idealized models. If you can formalize how non-ideal factors *systematically* alter disagreement norms (e.g., showing bias increases the rational threshold for peerhood), it could revolutionize the field.  
      **Tipping Point:** A rigorous model linking social identity to evidential weight in disagreement that outperforms "neutral" frameworks in explaining actual disputes.

  4.  **Your #3: Self-Undermining of Conciliationism**  
      **Core Question:** Can conciliationism coherently apply to disagreements about *its own truth*?  
      **Why it's Ranked Last:**  
      - **Upstream Impact (Low-Medium):** Important but narrow. Solutions exist (e.g., "fractured" or "bootstrapping" conciliationism), and resolving it likely won’t shift the broader debate—it’s a puzzle *within* conciliationism, not a reframing.  
      - **Tractability (High):** Pure conceptual analysis. Well-trodden ground (e.g., Elga, Titelbaum, Christensen).  
      - **Horizon Value:** Likely settled in 5-10 years as a technical footnote. Less likely to influence other fields.  
      - **Risk Factors:** Feels like "the same paper" you dislike; minimal room for innovation.  
      **Why it Might Rise:** If you connect it to *global* skepticism or metaepistemology (e.g., "Does *any* epistemic principle survive reflexive disagreement?"), it gains weight. A proof that *all* disagreement norms are self-undermining would be seismic—but unlikely.

  ---

  ### **Weak Joints in My Reasoning & What Could Change This Ranking**
  1.  **Overestimating #1 (Inquiry):** I might be underestimating the inertia of "belief-first" epistemology. If the field dismisses practical norms as "not pure philosophy," impact could lag. *What would change my mind:* A major journal symposium defending the irreducibility of doxastic norms in 2024-2025.
  2.  **Underestimating #2 (Multi-Party):** The technical demands might be higher than I think, or it could lack philosophical "depth." *What would change my mind:* If leading formal epistemologists (e.g., Pettit, List) explicitly dismiss its relevance to peer disagreement.
  3.  **Dark Horse's Viability:** Its interdisciplinary nature might fracture your audience. *What would change my mind:* If prominent grants (e.g., Templeton) prioritize "idealized models in formal epistemology" over critical/empirical approaches in 2025.
  4.  **#3's Potential:** If a top philosopher (e.g., David Christensen) announces a book definitively solving it, drop this entirely. Conversely, if new work links it to AI alignment ("Can an AI conciliate with humans about conciliationism?"), it surges.

  ---

  ### **Your 3-Year Roadmap**
  - **Year 1:** Deep dive into decision theory and philosophy of inquiry. Publish a critique of belief-centrism in peer disagreement, framing inquiry as essential. Simultaneously, explore case studies (e.g., plate tectonics controversy) to ground #1.
  - **Year 2:** Develop a formal model for inquiry norms post-disagreement. Test it against #2 (multi-party) and non-ideal cases (dark horse). Present at interdisciplinary conferences (phil of science, social epistemology).
  - **Year 3:** Synthesize into a book manuscript arguing that *epistemic responsibility in disagreement is primarily practical*. Target broader academic/policy audiences.

  **Final Advice:** Start with #1. It’s the most direct path to transforming the debate while absorbing insights from #2 and the dark horse. Avoid #3 unless Year 1 reveals a radical new angle. Track citations to your Year 1 paper—if philosophers of science engage more than epistemologists, double down on inquiry; if formal theorists dominate, pivot toward #2. **Your goal isn’t to answer a question but to change which questions get asked.** That’s what lasts 20 years.
