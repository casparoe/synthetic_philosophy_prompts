  Based on your specifications, here's a 9-question quiz designed to sort participants along your four axes without relying on philosophical jargon or citations. Each question presents a concrete case with three answer options, targeting the underlying axes. The scoring key maps answer patterns to positions on a 4-axis grid and identifies named positions.

  ### **Quiz: What Do You Believe About Natural Kinds?**
  **Instructions:** For each case, choose the option closest to your view. There are no right or wrong answers—this sorts your intuitions.

  1. **Jade (nephrite vs. jadeite):**  
     Historically, "jade" lumped two distinct minerals (nephrite and jadeite) due to similar appearance and uses. Science later split them.  
     A. Jade was never a natural kind—it was a folk error masking two real categories.  
     B. Jade was a natural kind for its time because it supported useful predictions (e.g., for carving).  
     C. Jade is still a natural kind in gemology, defined by shared properties like toughness and color.  

  2. **Water vs. heavy water (H₂O vs. D₂O):**  
     Heavy water (deuterium-based) is toxic to most life and has different physical properties.  
     A. Heavy water isn’t water—water’s essence is H₂O, and D₂O violates it.  
     B. Heavy water is a "borderline" water—it shares most properties but not all, so it’s context-dependent.  
     C. Heavy water is water if we’re discussing chemistry; it isn’t if we’re discussing biology.  

  3. **Element 118 (Oganesson):**  
     Relativistic effects make this synthetic "noble gas" reactive, unlike lighter noble gases.  
     A. It’s not a noble gas—noble gases must be inert, so the periodic table’s pattern is absolute.  
     B. Its classification is useful for now, but its behavior shows our model is incomplete, not metaphysically privileged.  
     C. It’s a noble gas because we defined it by atomic structure, not behavior—our theory comes first.  

  4. **Biological species (ring species/horizontal gene transfer):**  
     Ring species (e.g., gulls) blur species boundaries; bacteria swap genes across species.  
     A. Species are real natural kinds—exceptions are noise, not evidence against the category.  
     B. Species are practical clusters for biologists, not universal joints in nature.  
     C. Species aren’t natural kinds at all—they’re arbitrary divisions in a gene-flow continuum.  

  5. **Gene talk (after alternative splicing):**  
     One DNA sequence can produce multiple proteins via splicing, undermining "one gene, one protein."  
     A. The old gene concept was wrong; genes are really DNA segments with regulatory mechanisms.  
     B. "Gene" is still useful for prediction, even if it’s messy—it doesn’t need a strict essence.  
     C. Genes aren’t natural kinds—they’re labels for whatever biologists find convenient to study.  

  6. **Depression (DSM category):**  
     DSM-5 defines depression by symptoms, but causes vary (genetic, situational, etc.).  
     A. Depression is a real natural kind—we’ll find a common biological cause eventually.  
     B. Depression is a clinical tool—it predicts treatment responses but isn’t a universal category.  
     C. Depression is a social construct reflecting cultural norms, not a natural kind.  

  7. **Race (biological category):**  
     Genetic variation in humans is mostly clinal (gradual), not clustered into discrete races.  
     A. Biological race is real—continental genetic differences support it as a natural kind.  
     B. Race isn’t biological but is a social kind with real effects (e.g., in medicine).  
     C. Race has no basis in nature—it’s purely a social invention.  

  8. **Pandas as carnivores:**  
     Giant pandas are classified as carnivores (order Carnivora) but eat bamboo.  
     A. Pandas are carnivores—the essence is evolutionary lineage, not diet.  
     B. Pandas show categories aren’t absolute—they’re carnivores by phylogeny but herbivores by ecology.  
     C. "Carnivore" is defined by our interests (e.g., studying evolution vs. diet).  

  9. **Pluto’s planethood:**  
     Pluto was reclassified as a dwarf planet for not "clearing its orbit."  
     A. Pluto isn’t a planet—the new definition captures what planets really are.  
     B. The reclassification is useful for astronomy but doesn’t reflect a deeper truth.  
     C. "Planet" is a convention—there’s no fact of the matter beyond what astronomers decide.  

  ---

  ### **Scoring Key**
  Each axis corresponds to a dimension of belief. Tally the **most frequent letter** (A, B, C) per axis across questions. Treat ties as "mixed" (e.g., A/B).

  - **Axis 1: What "X is a natural kind" claims**  
    A: About the world (metaphysical realism)  
    B: About our concepts (conceptualism)  
    C: About prediction (pragmatism)  
    *Questions: 1, 3, 5, 9*  

  - **Axis 2: What holds a kind together**  
    A: An essence (essentialism)  
    B: A cluster of co-occurring properties (cluster coherence)  
    C: Our interests (interest-relativity)  
    *Questions: 2, 4, 6, 8*  

  - **Axis 3: Does predictive success imply metaphysical privilege?**  
    A: Yes (abductive realism)  
    B: No, it’s a leap (skepticism)  
    C: No—success is practical, not metaphysical (pragmatic deflation)  
    *Questions: 3, 6, 9*  

  - **Axis 4: Where do natural kinds apply?**  
    A: Everywhere (universalism)  
    B: Only in hard sciences (restricted realism)  
    C: Nowhere (anti-realism)  
    *Questions: 4, 6, 7*  

