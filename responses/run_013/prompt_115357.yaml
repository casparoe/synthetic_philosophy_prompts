  ### **Key Insights**
  - **"Not real" vs. "Not useful"**: The quiz flags when people conflate these. E.g., choosing B for jade (Q1) or depression (Q6) implies a category can be "unreal" but pragmatically valid—highlighting your concern.  
  - **Anti-realism spectrum**: Axis 4 splits "nowhere" (C: Social Constructivists) from "only hard sciences" (B: Pragmatic Deflationists/Restricted Skeptics).  
  - **Realism spectrum**: Axis 2 splits essentialism (A) from cluster coherence (B), while Axis 3 tests if predictive success licenses metaphysical commitment.  

  This design forces participants to confront concrete cases, revealing their implicit beliefs without philosophy trivia. The grid shows overlaps (e.g., many Pragmatic Deflationists and Restricted Skeptics agree on psychiatry/race) and isolates "incoherent" cells.
