prompt: |-
  I'm in a seminar on free will and the neuroscience of it and I have to hand something in next week, and I've realised I dont want to write another essay on whether Libet's experiments kill free will. We have the same two moves every week: someone says the brain gets going before you're aware of deciding, so your conscious will is an afterthought; someone else says the experiments only show what happens when you flick your wrist for no reason, so they prove nothing; then we all go home. What nobody does is say what a theory of free will would actually have to deliver to count as a serious option in the light of that work. So give me the spec instead of the verdict: the full list of desiderata, what any adequate theory in this area has to get right, with the case or consideration behind each item.

  And I mean the whole zoo, not just the headline result: the readiness potential that ramps up a few hundred milliseconds before the movement; the fact that the moment people report first being aware of wanting to move lands only a couple hundred milliseconds before the muscle fires; the later version where subjects can cancel a movement that's already been prepared, in the last fraction of a second; the reanalysis that says the ramp is just background neural noise crossing a threshold and only looks like a decision signal because everything gets averaged to the moment of movement; the decoding studies that call the choice seconds ahead; the fact that a slow ramp of the same shape shows up in situations where nothing is being willed at all; the clock-reading method used to time the urge, which is itself something we don't fully trust; and the patients whose hand does things they insist they didn't do. Each of those is something a theory has to accommodate or explain away, and I want to know which. At some point the list should also force a decision about what the thing even is, since the experiments test something much narrower than any of the candidate answers, and it should say which threat the experiments pose at all, because as far as I can tell they threaten conscious causation rather than determinism.

  Be honest about which items are genuine requirements and which are just things my seminar assumes because we all read the same three authors. Flag any pair that can't be had together: my hunch is you can't both insist free will lives in conscious intention and take the timing data seriously, and that you can't both demand the theory be answerable to the science and refuse to let it hang on a self-report method nobody trusts, but tell me if I'm wrong and whether there's a worse pair I'm missing. Then say which single requirement does the most work at ruling candidates out, and give me a line each on how compatibilism, the libertarian line, and the illusionist line fare against it. Skip the reading list, I can't get to the library before the deadline anyway. And please dont tell me the whole thing is a verbal dispute, my flatmate already says that and he's a neuroscientist.
reasoning: |-
  Okay, the user is in a seminar on free will and neuroscience, specifically tired of rehashing Libet's experiments. They need to hand in something next week but don't want another essay debating whether Libet kills free will. Instead, they want a detailed "spec" - a list of desiderata that any adequate theory of free will must address, based on the full range of experimental findings beyond just the headline results.

  Hmm, the user seems frustrated with the repetitive nature of their seminar discussions. They've identified a gap: everyone argues about whether Libet disproves free will, but nobody outlines what a viable theory would actually need to accomplish given all the neuroscientific evidence. Their request is quite sophisticated - they want a comprehensive framework for evaluating theories, not just another opinion.

  Let me unpack their key requirements:
  First, they want every major finding from Libet-style experiments included as a constraint. That means not just the readiness potential timing, but also: veto experiments, signal reanalyses, decoding studies, spontaneous neural activity patterns, clock-reporting methodology issues, and alien limb syndrome cases. Each must be either accommodated or explained away by any serious theory.

  Second, they want clarity on what exactly is being threatened - conscious causation versus determinism. This is crucial because many seminar discussions conflate these.

  Third, they want meta-commentary: which constraints are genuinely necessary versus seminar groupthink, which pairs are incompatible, and which single requirement does the heaviest lifting in ruling out theories.

  I notice they're particularly skeptical about two tensions: 
  - Conscious intention vs. neural timing data
  - Scientific accountability vs. distrust of self-reports

  They also hint that the seminar might be stuck in an intellectual bubble ("same three authors"). I should flag where assumptions might be parochial.

  For structure, I'll organize around five core problems that emerge from the neuroscience:
  1) Temporal dynamics (all the timing puzzles)
  2) Consciousness-causation gap
  3) Neural ambiguity (what signals actually mean)
  4) Control conditions (what happens when we're not "willing")
  5) Methodology constraints

  Each desideratum will state: 
  - The empirical finding 
  - Why it matters 
  - What theories must do about it

  Then I'll address their meta-requests:
  - Highlight conflicting desiderata (e.g., conscious primacy vs. veto timing)
  - Identify the most exclusionary requirement (probably neural antecedence)
  - Briefly map how major theories (compatibilism, libertarianism, illusionism) handle it

  Key insight: The real challenge isn't determinism - it's whether consciousness plays any causal role given how late it appears in the neural cascade. I'll make sure the "spec" reflects that.

  The tone should remain analytical but acknowledge their frustration - this is essentially a quality control checklist for free will theories in a post-Libet world.
answer: |-
  Here’s the full specification for any viable theory of free will in light of the Libet-style neuroscience, organized by empirical constraints, conceptual demands, and meta-requirements. Each item includes the *case/consideration* and the *desideratum* it imposes. I’ve flagged tensions and prioritized "must-haves" vs. seminar assumptions.

  ---

  ### **I. Core Empirical Constraints**  
  *(Non-negotiable: Theories must explain or accommodate these)**  
  1. **Readiness Potential (RP) Antecedence**  
     - *Case:* Unconscious neural activity (RP) begins ~500ms before conscious awareness of intention (W-time) and movement (M-time).  
     - *Desideratum:* Explain why unconscious processes *precede* conscious intention without rendering consciousness epiphenomenal.  

  2. **Temporal Compression of Conscious Intention**  
     - *Case:* W-time (reported awareness of "urge") occurs only ~200ms before movement.  
     - *Desideratum:* Account for the narrow window for conscious causation. If consciousness *initiates* action, why does it appear so late?  

  3. **Veto Power ("Free Won’t")**  
     - *Case:* Subjects can consciously abort actions *after* RP onset but before movement (e.g., Libet’s "veto" experiments).  
     - *Desideratum:* Explain how conscious control can *inhibit* but not *initiate* actions.  

  4. **Signal Ambiguity (RP Reanalysis)**  
     - *Case:* RP may reflect stochastic neural noise crossing a threshold, not a "decision signal" (Schurger et al.’s accumulation model).  
     - *Desideratum:* Clarify what neural signatures *would* count as evidence for/against free will. Reject theories relying *solely* on RP as a "decision marker."  

  5. **Long-Lead Decoding**  
     - *Case:* Brain activity can predict choices seconds before awareness (e.g., Soon et al.’s fMRI decoding).  
     - *Desideratum:* Address whether "decoding" implies predetermined outcomes or merely subconscious processing.  

  6. **Spontaneous RP in Non-Action Contexts**  
     - *Case:* RP-like ramps occur even when no action is planned (e.g., during rest).  
     - *Desideratum:* Differentiate "action-preparation" neural activity from irrelevant noise.  

  7. **Alien Limb Syndrome**  
     - *Case:* Brain-damaged patients perform actions they disavow (e.g., anarchic hand syndrome).  
     - *Desideratum:* Explain how "normal" free will avoids this dissociation between intention and action.  

  ---

  ### **II. Methodological & Conceptual Constraints**  
  *(Must engage, but some reflect seminar biases)*  
  8. **Clock-Reporting Reliability**  
     - *Case:* W-time is self-reported via a rotating clock, raising concerns about timing accuracy and introspection.  
     - *Desideratum:* Justify using subjective reports *or* provide an alternative measure of conscious intention. **⚠️ Tension:** You can’t demand science-compatibility while dismissing all self-report data.  

  9. **Narrow Scope of "Willing"**  
     - *Case:* Libet tasks involve trivial, context-free actions (e.g., wrist-flicking).  
     - *Desideratum:* Clarify if free will applies only to deliberate, complex decisions—and if so, explain why simple actions are studied. **⚠️ Seminar Assumption:** Not all theories require free will for *all* actions.  

  10. **Threat Target: Conscious Causation, Not Determinism**  
      - *Case:* RP data challenge the *causal role of consciousness*, not determinism per se (determinism is untouched).  
      - *Desideratum:* Theories must engage the *conscious causation problem*, not just determinism.  

  ---

  ### **III. Meta-Requirements**  
  *(Overarching framework demands)*  
  11. **Define the "Thing" Being Tested**  
      - *Case:* Libet measures "urges" in arbitrary actions; free will is often tied to reasons-responsive choice.  
      - *Desideratum:* Specify what *kind* of control constitutes free will (e.g., moral decisions, conscious veto, planning).  

  12. **Avoid "Afterthought" Consciousness**  
      - *Case:* If consciousness only "approves" pre-made decisions, is it relevant?  
      - *Desideratum:* Ensure consciousness isn’t reduced to a passive observer.  

  ---

  ### **Conflicting Desiderata & Tensions**  
  - **⚠️ Worst Conflict:** **Conscious Primacy vs. Neural Antecedence Timeline**  
    - You *cannot* insist conscious intention *initiates* action while accepting RP/veto timelines. Consciousness appears too late for initiation but just in time for veto.  
  - **Science-Compatibility vs. Self-Report Skepticism**  
    - If you reject clock methods, you need an alternative neural correlate of "intention" (which may not exist).  
  - **Free Will for Complex Actions vs. Simple Lab Tasks**  
    - If free will only exists in complex decisions, Libet’s paradigm is irrelevant—but this risks unfalsifiability.  

  ---

  ### **The Most Exclusionary Requirement**  
  **#1: Neural Antecedence (RP & Decoding)**  
  - *Why it rules:* If neural activity predicts/initiates actions before consciousness, theories requiring *conscious origination* (e.g., some libertarian views) are falsified.  
  - **How Theories Fare:**  
    - **Libertarianism:** Fails if it requires uncaused conscious causation. Must relocate free will (e.g., to unconscious "agent causation").  
    - **Compatibilism:** Survives by redefining free will as reasons-responsiveness *without* conscious initiation.  
    - **Illusionism:** Thrives—claims conscious will *is* the afterthought revealed by the data.  

  ---

  ### **Honesty Check: What’s Genuine vs. Seminar Groupthink**  
  - **Genuine Requirements:** 1–8, 10–12 (Neuroscience *does* constrain theories of conscious agency).  
  - **Seminar Assumptions:**  
    - That Libet *must* be central (debated: some argue it’s irrelevant to real-world will).  
    - That "free will = conscious causation" (some compatibilists reject this).  
    - That clock methods are fatally flawed (many cognitive scientists accept them with caveats).  

  **Bottom Line:** Any theory must explain why consciousness *isn’t* epiphenomenal given its late arrival, while accommodating veto power and neural ambiguity. The core threat is to **conscious causation**, not freedom from determinism. Illusionism handles the data best but at high cost; compatibilism adapts by redefining control; libertarianism must abandon conscious causation as origination.
