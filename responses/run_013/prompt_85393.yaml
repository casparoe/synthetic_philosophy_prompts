answer: |-
  ### Prioritized Research Agenda Under Conservativeness Requirement (CR)

  Your constraint—that dialetheic theories must be conservative over their classical fragments—forces a radical shift from standard approaches. CR demands that contradictions be *isolated anomalies* with no "downstream" classical consequences. This agenda prioritizes questions whose resolution would structurally clarify whether and how dialetheism can satisfy CR, focusing on proof-theoretic precision and mathematical traction. The ordering balances logical priority, tractability, and the risk of CR collapsing dialetheism into vacuity.

  ---

  **Project 1: Defining the Classical Fragment (Year 1)**  
  *Why upstream?* CR is vacuously stated without a rigorous, non-circular definition of "classical fragment." Until this is fixed, *no* conservativeness claim can be evaluated. Resolving this settles the domain over which conservativeness must hold (e.g., arithmetic? finite combinatorics?) and determines whether CR is even coherent. If successful, Projects 2–3 become well-defined; if impossible, CR may be abandoned.  
  *Tractability:* High. Use proof-theoretic ordinals and interpretability theory to isolate a recursively axiomatizable core theory (e.g., primitive recursive arithmetic, PRA) immune to dialetheic extension. Tools exist (e.g., cut-elimination in sequent calculi for paraconsistent logics) to compare derivability strength.  
  *Neglect:* Severe. Most work assumes "classical fragment" is intuitive, but CR requires explicit demarcation.  
  *Movability:* If a dialetheic set theory *fails* conservativeness over a candidate fragment (e.g., proves a new Diophantine equation), the need for precision becomes urgent. If consistency proofs for the fragment adapt cleanly, CR gains credibility.

  **Project 2: Conservativeness for Semantic Paradoxes (Year 2)**  
  *Why upstream?* Semantic paradoxes (Liar, Curry) are dialetheism’s primary motivation. If CR *cannot* be satisfied here, the view loses its raison d'être. Success here would reframe Project 3 by showing dialetheism’s core can survive CR; failure may doom the entire program.  
  *Tractability:* Moderate. Build on model-theoretic semantics for paraconsistent truth (e.g., Kripke-Feferman with LP). Challenge: Ensure fixed-point models for truth predicates don’t alter classical consequences of the base arithmetic. Existing tools (e.g., revision semantics) need adaptation to enforce conservativeness.  
  *Neglect:* Partial. Conservativeness is often *claimed* but rarely proven for full semantic theories under CR’s strictness.  
  *Movability:* If adding a dialetheic truth predicate to PA yields a new arithmetical theorem (e.g., a Gödel sentence), CR is untenable for semantics. If model constructions preserve classical consequences, Project 3 becomes urgent.  
  *Conflict with Project 1:* If Project 1 demands a restrictive fragment (e.g., only bounded arithmetic), Project 2 may become trivial—sacrifice Project 1’s generality to save semantics. I’d prioritize Project 2: without paradoxes, dialetheism lacks motivation.

  **Project 3: Mathematical Utility Beyond Paradox (Year 3)**  
  *Why upstream?* Even if Projects 1–2 succeed, CR risks making dialetheism "paradox-only"—a philosophical toy. This project tests whether dialetheic tools can solve *open mathematical problems* under CR, proving the view’s utility. Success would silence critics who call CR-compliant dialetheism inert.  
  *Tractability:* Low. Requires constructing dialetheic versions of set theory or category theory where contradictions (e.g., around naïve comprehension) resolve classical impasses (e.g., continuum hypothesis) *without* new $\Pi_1$ arithmetic sentences. Few tools exist; likely needs custom model theory.  
  *Neglect:* Extreme. Most work targets paradoxes, not mathematical gain under conservativeness.  
  *Movability:* If Project 2 fails, this becomes dialetheism’s last hope under CR. If a dialetheic extension of ZF conservatively settles an independent statement (e.g., in combinatorics), it vaults to priority.  
  *Conflict with Project 2:* If semantic contradictions inherently violate CR, Project 3 becomes the sole focus. I’d sacrifice Project 3 if Project 2 succeeds—paradoxes are dialetheism’s heart.

  ---

  **Direct Confrontations:**  
  1. **CR vs. Semantic Paradoxes:** CR *can* likely be satisfied for carefully formalized semantic theories (e.g., restricting truth iteration or using substructural logics). But if the Liar must "leak" into arithmetic (e.g., via Löb’s theorem), CR excludes core cases. Project 2 will decide this.  
  2. **Defining the Fragment:** It *can* be made precise non-circularly by fixing a syntactic fragment (e.g., $\mathcal{L}_{PA}$-sentences) and proving dialetheic theories are conservative over it. Project 1 must deliver this.  
  3. **Useful Contradictions Under CR:** Paradoxes *are* the "work" if Project 2 succeeds. Project 3 might find utility in foundations (e.g., inconsistent models of geometry), but CR *does* risk making dialetheism "paradox-only"—a major incentive for Project 3.

  ---

  **Final Ordering Rationale:**  
  - **Project 1 first** because CR is meaningless without a defined fragment.  
  - **Project 2 second** because paradoxes motivate dialetheism; if CR kills them, the project pivots or ends.  
  - **Project 3 third** as it explores new territory *if* CR survives Project 2.  

  Failure at any stage forces reevaluation: Project 1’s failure invalidates CR; Project 2’s failure demands abandoning paradoxes or CR; Project 3’s failure suggests dialetheism under CR is shallow.

  \answer{(1) Fragment Definability; (2) Semantic Conservativeness; (3) Mathematical Utility}
