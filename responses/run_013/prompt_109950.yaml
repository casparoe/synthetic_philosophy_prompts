prompt: |-
  I have been defending a position in a long-running argument with friends, and what I want from you is a map of its exposure rather than encouragement. The position is that the rationality of cooperation has nothing essentially to do with causal influence. What matters is whether my choosing to cooperate is evidence about what the other party does — the Newcomb-style point, generalized. If the world is large enough (many civilizations, many agents who reason as I do, plausibly many instances of me), then the number of agents whose choices are evidentially correlated with mine may be vast, and the local cost of cooperating with them may be negligible beside it. So I claim that I ought to cooperate with strangers I can never affect and who can never affect me; that I ought to be willing to give up a great deal, including things my own community cares about, on behalf of those distant correlated agents; and that none of this waits on signaling, reputation, enforcement, or travel. The rival view — that cooperation is rational only where it can be detected, reciprocated, punished, or rewarded — seems to me a superstition about causation, a refusal to notice that the very feature of me that makes me defect is evidence about what my counterparts do.

  I would like you to tell me what would count against this. I mean defeaters of both sorts: arguments and results that attack the conditional (if choices are evidentially correlated in the right way, cooperation is required), and evidence that attacks the premise (that the world is large in the relevant sense, and that the population of agents is correlated with me rather than merely similar in some incidental respect). Sort them by how decisive they would be, from fatal to merely awkward, and be explicit about which of them a committed defender would themselves concede, as opposed to the ones critics rehearse and defenders shrug off. I am especially interested in whether the evidential relation survives what a causal decision theorist will say screens it off: if my counterpart's choice is already fixed by a common cause we share, does my choice still carry information about it, or has that information been absorbed by everything else I know? I also want to know what happens when the correlations run the wrong way — an agent whose choices are anti-correlated with mine, or a population in which cooperating and defecting are equally diagnostic of me, so that I have no way to select which counterparts I am correlated with. And I want to know whether the view needs a measure over agents, and what becomes of it if the population is infinite or its size unknowable — whether the arithmetic that gives the argument its force survives that. One further worry I cannot settle: whether the position collapses into a claim about what type of agent I am, in which case my deliberation is not the lever at all and the view describes character rather than choice.

  Finally, tell me what the position predicts that its rivals do not, and whether it risks anything at all or has been quietly insulated by qualifications to the effect that it holds only when the correlation is of the right kind. If it has been insulated, say so plainly, and tell me whether that is a defect in a view of this sort or simply the price of a view that is part conceptual and part empirical. I should admit what would not move me: I am unimpressed by the complaint that evidential cooperators do not end up richer, since by hypothesis the payoff is not local — tell me if that reply is a dodge. What I would find most persuasive is either a case in which the position, taken seriously, licenses something its own adherents could not accept on reflection (a betrayal of the near for the sake of the far), or an argument showing that the evidential and causal framings converge after all, so that the position is not a rival to the ordinary view but a restatement of it.
reasoning: |-
  We are dealing with a position that advocates for cooperation based on evidential correlations (similar to Newcomb's problem and evidential decision theory) rather than causal influence. The core idea is that if my choice to cooperate is evidence that other correlated agents (counterparts) also cooperate, then cooperation can be rational even in the absence of causal interaction. This is because the evidence about the behavior of many other agents can outweigh the local cost of cooperation.

  The user wants a map of the exposures of this position: arguments and evidence that count against it, sorted by decisiveness (from fatal to merely awkward). We are also to consider which objections a committed defender would concede and which they would shrug off. Specific points to address:

  1. Whether the evidential relation survives screening off by a common cause (as causal decision theorists might argue).
  2. What happens when correlations are anti-correlated or when the population is such that cooperating and defecting are equally diagnostic.
  3. The need for a measure over agents and the implications of infinite or unknowable populations.
  4. Whether the position collapses into a claim about character rather than choice.
  5. Predictions of the position and whether it is insulated by qualifications (and if so, whether that is a defect).
  6. Whether the reply that the payoff is not local is a dodge.

  Additionally, the user is particularly interested in:
  - A case where the position licenses something unacceptable (e.g., betrayal of the near for the far).
  - An argument that the evidential and causal framings converge.

  We structure the response by:

  A. Objections to the conditional: If choices are evidentially correlated in the right way, is cooperation required?
  B. Objections to the premise: Is the world large and correlated in the relevant sense?
  C. Specific issues: screening off, anti-correlation, infinite populations, collapse into character.
  D. Predictions and insulation.

  We rank objections as:

  - Fatal: if true, the position is untenable.
  - Serious: significantly undermines the position but perhaps not irreparably.
  - Awkward: points that create complications but can be managed.

  ---

  ### A. Objections to the conditional (if correlated, then cooperate)

  1. **Screening off by common cause (fatal if accepted, but contested)**:
     - **Objection**: In a common cause scenario (e.g., a common genetic or environmental factor that determines both my decision and my counterpart's), once I condition on that common cause, my action is no longer evidence for my counterpart's action. Thus, my decision does not provide new information about the counterpart.
     - **Example**: Suppose there is a gene that predisposes one to cooperate. If I know I have that gene, then my choosing to cooperate doesn't tell me anything new about whether my counterpart (who shares the gene) cooperates. So the evidential link is broken.
     - **Defender's response**: This objection is central and a defender must either (a) reject the screening off (arguing that the common cause is not fully known or that the correlation remains) or (b) accept that in such cases the evidential argument does not apply. A committed defender might concede that in cases of known common causes that screen off, the evidential correlation vanishes, but they would argue that in practice we rarely have such complete knowledge. Moreover, they might note that the common cause itself may be part of the correlation we are leveraging (e.g., being the type of person who cooperates).
     - **Ranking**: Serious to fatal, depending on the case. If screening off is complete and known, it is fatal to the evidential link in that instance. But the defender can retreat to cases where screening off does not occur.

  2. **Anti-correlation and mixed populations (serious)**:
     - **Objection**: What if agents are anti-correlated? For instance, if I cooperate, that might be evidence that my counterpart defects. Then, by cooperating, I would be causing (evidentially) harm. Also, if the population is mixed such that cooperation and defection are equally diagnostic (so that my action provides no evidence about the overall behavior of others), then the argument fails.
     - **Example**: In a population of two types: one type always cooperates and the other always defects. If I don't know which type I am, then my action might not provide evidence about the type of others (if the types are independent). Or if the population is structured so that my cooperation is evidence of being in a world with many defectors, then cooperating would be bad.
     - **Defender's response**: The defender must argue that the relevant correlations are positive and strong enough. They might say that in the real world, the correlations we care about (e.g., among rational agents) are positive. For anti-correlation, they might avoid cooperating in such scenarios. But this requires knowing the sign and strength of the correlation, which may be difficult.
     - **Ranking**: Serious. It forces the defender to specify the conditions under which the correlation is favorable. Without a general positive correlation, the argument becomes highly context-dependent.

  3. **The problem of decision-instability (awkward to serious)**:
     - **Objection**: In some decision theories, the evidential approach can lead to instability or paradoxes (like in the Smoking Lesion problem). If I am deciding whether to cooperate, and my decision is evidence about what others do, but others are in the same situation, we get a circularity that may not resolve to a clear equilibrium.
     - **Defender's response**: This is a known issue in decision theory. Defenders might adopt a specific decision theory (like functional decision theory) that aims to handle such cases. They might also argue that in practice, the correlations are fixed by the type of agent we are, not by the current decision.
     - **Ranking**: Awkward to serious, depending on the example. It doesn't refute the entire position but requires careful handling.

  4. **The charge of irrationality from causal decision theory (CDT) (serious, but fundamental disagreement)**:
     - **Objection**: CDT advocates argue that only causal influence should matter. They would say that if I cannot affect the other agent, then I should defect (if that gives me a higher local payoff). They might point out that the evidential approach leads to paying costs for nothing (since the other's action is already fixed) and is thus irrational.
     - **Defender's response**: This is a foundational dispute. The defender would argue that CDT is flawed in Newcomb-like problems and that rationality must account for the information that one's action provides. They would not concede but instead reject CDT.
     - **Ranking**: Serious but not fatal because it's a matter of perspective. The user is already aware of this and considers it a superstition.

  ---

  ### B. Objections to the premise (the world is large and correlated)

  5. **Lack of empirical evidence for correlation (serious)**:
     - **Objection**: Is there any evidence that the world contains a vast number of agents whose decisions are evidentially correlated with mine in the way required? In particular, are there "many instances of me" or many agents who reason similarly? Without this, the premise fails.
     - **Defender's response**: The defender might argue from the existence of large numbers of humans (or AIs) who face similar problems and are shaped by similar evolutionary or cultural forces. They might also appeal to the multiverse or simulation hypotheses. But these are speculative. A committed defender might concede that the extent of correlation is an empirical question and that the argument holds only if the correlations exist.
     - **Ranking**: Serious. The argument relies on a contingent fact about the world. If the correlations are weak or non-existent, the argument collapses.

  6. **Infinite populations and measure problems (fatal if unresolved)**:
     - **Objection**: If the population of correlated agents is infinite, then the expected utility calculations may break down. For example, if there are infinitely many agents, and I am correlated with all of them, then the total benefit of cooperation might be infinite, but so might the cost. Without a well-defined measure (to compare infinities), the argument becomes indeterminate.
     - **Example**: In an infinite universe, the number of agents who cooperate if I do might be infinite, but the number who defect if I defect might also be infinite. How do we compare the two?
     - **Defender's response**: The defender must adopt a measure (e.g., density) over the population. They might argue that we should consider finite regions or use a limiting process. But if the population is infinite and the measure is not well-defined, this is a problem. A committed defender might concede that the argument requires a finite population or a well-defined measure.
     - **Ranking**: Fatal if the population is infinite and no measure can be agreed upon. Otherwise, awkward (if a measure can be found).

  7. **Unknowable population size and correlation strength (awkward)**:
     - **Objection**: Even if the population is finite, we often don't know its size or the strength of the correlation. How do we make decisions under such uncertainty?
     - **Defender's response**: We can use expected values under our best estimates. But if the uncertainty is too great, the expected net benefit might be negative or undefined. The defender might fall back on the principle that if there is a non-negligible chance of a large positive correlation, then cooperation is rational. However, this weakens the force of the argument.
     - **Ranking**: Awkward. It complicates the application but doesn't refute the principle.

  ---

  ### C. Specific issues

  8. **Collapse into character (serious)**:
     - **Objection**: If the evidential correlation arises because of the type of agent I am, then my decision to cooperate or defect is not really a choice but a reflection of my type. Thus, the position is not about rational choice at the moment of decision but about being a certain kind of person. This undermines the idea that deliberation is a lever.
     - **Example**: In Newcomb's problem, the predictor bases the prediction on your type. So your choice is determined by your type. Then why deliberate? The decision is already made.
     - **Defender's response**: The defender might accept that the decision is determined by one's type but argue that the deliberation is part of the process of being that type. They might also argue that even if the choice is determined, the rational agent must still reason correctly. However, this shifts the focus from choice to character formation.
     - **Ranking**: Serious. It threatens to change the subject from decision theory to moral character or psychology.

  9. **Betrayal of the near for the far (potentially fatal for acceptance)**:
     - **Objection**: The position might require sacrificing the interests of those close to me (who I can causally affect) for the sake of distant correlated agents. For example, if I spend my resources to help strangers in a faraway land (because there are many of them and they are correlated with me) instead of helping my family, that seems morally repugnant and even irrational from a community perspective.
     - **Defender's response**: The defender might argue that the interests of the distant many outweigh the near few. But they might also qualify that if the near are also correlated with me, then helping them might be even more important. However, if the correlation is stronger with distant agents (because there are more of them), then the betrayal might be required. This is a point where the position might license something unacceptable.
     - **Ranking**: Potentially fatal for the practical acceptance of the view, even if logically consistent. It risks being a reductio ad absurdum.

  ---

  ### D. Predictions and insulation

  10. **Predictions**:
      - The position predicts that in situations with high evidential correlation but no causal interaction, an agent should cooperate even at a local cost. This is in contrast to CDT, which predicts defection. However, in practice, it is hard to test because we rarely know the extent of correlation. Moreover, if the defender qualifies by saying it only applies when the correlation is positive and strong, then the prediction is insulated.

  11. **Insulation by qualification**:
      - The position is insulated by requiring the "right kind" of correlation. The defender can always say that in a given case, the correlation is not strong enough, or is negative, or screened off. This makes the position hard to falsify. The user asks if this is a defect. It is a defect if it makes the theory untestable, but it might be the price of a view that combines conceptual (about rationality) and empirical (about the world) elements.

  12. **Convergence of causal and evidential framings**:
      - There are arguments that in some cases (e.g., when the population is large and interactions are repeated) the two might converge. For instance, in evolutionary game theory, agents who cooperate in one-shot interactions might be selected for if they are correlated with each other (via kin selection or group selection). Thus, what appears as evidential might be explained causally by the evolutionary process. But this does not always hold. In a true one-shot, non-causal setting, they diverge.

  ---

  ### Summary of Rankings

  - Fatal: 
    - If screening off by a common cause is complete and known (then the evidential link breaks).
    - If the population is infinite and no measure can be defined (then the expected utility is undefined).
  - Serious:
    - Lack of empirical evidence for the required correlations.
    - Anti-correlation and mixed populations (undermining the positive case).
    - The collapse into character (undermining choice).
    - The betrayal of the near for the far (morally unacceptable consequence).
  - Awkward:
    - Decision-instability.
    - Unknowable population size and correlation strength.

  ### The user's specific worries

  - **Screening off**: As above, it can break the evidential link. The defender must argue that we don't have full knowledge of common causes.
  - **Anti-correlation**: It forces the defender to specify the conditions and might lead to perverse outcomes.
  - **Infinite populations**: This is a major technical problem. The defender must assume a finite population or a measure.
  - **Collapse into character**: It shifts the focus and might make deliberation irrelevant.
  - **Betrayal of the near for the far**: A potential reductio.

  ### Final note

  The position is bold and challenges conventional wisdom. Its main vulnerability is the empirical premise about the world and the correlations. Without evidence of a large, positively correlated population, the argument becomes hypothetical. Also, the moral implications (sacrificing the near for the far) might be its Achilles' heel in persuading others.
answer: |-
  Below is a systematic map of the exposures of your position—that cooperation is rational based on evidential correlations (e.g., Newcomb-style reasoning) in a large world of correlated agents, independent of causal influence. I organize objections by decisiveness (fatal, serious, awkward), specify which a committed defender might concede versus dismiss, and address your specific concerns (screening off, anti-correlation, infinite populations, collapse into character, etc.). I also evaluate predictions, insulation, and whether the position risks unacceptable consequences or converges with causal views.

  ---

  ### **Key Exposures of the Position**

  #### **1. Screening Off by Common Causes (Fatal if True, but Defenders Dismiss)**
     - **Objection**: If a known common cause (e.g., genetics, cultural programming) fully determines both your choice and your counterparts', your choice provides *no new evidence* about their actions. Causal decision theorists (CDTs) argue this "screens off" the evidential link: once you condition on the common cause, your decision is statistically independent of theirs. Thus, cooperation cannot be justified evidentially—it only incurs costs without influencing outcomes.
       - *Example*: You and your counterparts share a "cooperation gene." If you know you have it, your choice to cooperate doesn't update your belief about their actions (they were always likely to cooperate). Defecting saves local costs without changing expectations.
     - **Defender Response**: Committed defenders **shrug this off**. They argue:
       - Common causes are rarely known with certainty (e.g., you might doubt your "type" or its universality).
       - The decision itself can *reveal* information about the common cause, making your choice evidentially relevant (e.g., choosing to cooperate reinforces that you are the "cooperative type").
       - Screening off assumes CDT's metaphysics—your position rejects that framework entirely.
     - **Decisiveness**: **Fatal if screening off is complete and known**, as it severs the evidential link. But defenders reject CDT's premises, making this a stalemate. *You flagged this—it's the core dispute.*

  #### **2. Anti-Correlation or Null Correlation (Serious, Often Conceded)**
     - **Objection**: If your choice is *anti-correlated* with counterparts (e.g., cooperating signals they defect), or if correlations are balanced (cooperating/defecting are equally diagnostic), your argument collapses. Cooperation could *harm* the collective or provide no net benefit.
       - *Example*: In a population split between "mirror" agents (if you cooperate, they defect) and "clone" agents (if you cooperate, they cooperate), with no way to distinguish them, your action has no predictable evidential impact. Cooperation might trigger more defection.
     - **Defender Response**: Defenders **concede this partially**. They agree the position requires *positive* evidential correlations. But they argue:
       - In practice, rational agents in similar circumstances (e.g., humans facing climate change) are likely positively correlated.
       - You can select contexts where correlations favor cooperation (e.g., voting in large elections where your "type" predicts others).
     - **Decisiveness**: **Serious**. It forces defenders into contingent, empirical defenses. If anti-correlation is widespread, the position fails.

  #### **3. Infinite or Unmeasurable Populations (Fatal if Unresolved)**
     - **Objection**: Your arithmetic relies on aggregating costs/benefits across many agents. But if the population is infinite, uncountable, or its size unknowable, expected-utility calculations break:
       - **Infinities**: If there are infinitely many correlated agents, both cooperation and defection might yield infinite gains/losses, making comparisons impossible (e.g., "∞ - ∞" problems).
       - **Unmeasurability**: Without a probability measure over agents (e.g., if you can't weight "similar" agents), you can't compute expected value. How do you compare "vast" numbers without cardinality?
       - *Example*: In an infinite multiverse, your counterparts may be infinitely numerous regardless of your choice—so local costs dominate.
     - **Defender Response**: Defenders **concede the need for a measure** but argue for workarounds:
       - Use densities or limits (e.g., cooperation is rational if the *proportion* of positively correlated agents is high).
       - Assume large but finite populations (e.g., the observable universe's 10²⁵ humans/AIs).
     - **Decisiveness**: **Fatal if infinities are unmanageable**. The position becomes mathematically incoherent without a measure, and defenders must retreat to finite cases.

  #### **4. Collapse into Character (Not Choice) (Serious, Often Conceded)**
     - **Objection**: If correlations arise from shared "types" (e.g., rational cooperators), your "choice" is predetermined by your character. Deliberation is epiphenomenal—the real lever is *being* a cooperative type, not *choosing* cooperation. This reframes your view as ethics (virtue) not decision theory.
       - *Example*: Newcomb's Problem: The predictor bases the box contents on your disposition. Your "decision" doesn't causally influence outcomes; it reflects who you are.
     - **Defender Response**: Defenders **concede the emphasis on type** but deny irrelevance:
       - Deliberation *shapes* your type (e.g., reasoning about cooperation reinforces cooperative dispositions).
       - Even without causal power, rational agents must act on evidence—choice remains normatively significant.
     - **Decisiveness**: **Serious**. It undermines your focus on *deliberation* as a lever. Defenders must argue that choice and character are co-constitutive.

  #### **5. Empirical Lack of Correlation (Serious for the Premise)**
     - **Objection**: The premise that "the world is large and correlated" may be false. Agents might be similar in *incidental* ways (e.g., both have two legs) but not in decision-relevant traits. Without evidence of strong, widespread evidential correlations, your argument lacks grounding.
       - *Example*: Evolutionary psychology suggests humans are "correlated" mainly with kin or in-group strangers. Distant strangers may share no decision-relevant links.
     - **Defender Response**: Defenders **shrug this off** as underestimating correlation:
       - Global challenges (e.g., pandemics, AI risk) create shared rational dilemmas, making agents evidentially linked.
       - In a large universe, "copies" of rational agents are plausible (e.g., via convergent evolution or digital emulations).
     - **Decisiveness**: **Serious for the premise**. If correlations are weak, the position becomes speculative. Defenders must rely on empirical optimism.

  #### **6. Moral Hazard: Betrayal of the Near (Potentially Fatal for Acceptance)**
     - **Objection**: The position licenses sacrificing local, causally connected communities for distant strangers. If correlated strangers vastly outnumber your family/tribe, you "ought" to divert resources to them, even if this harms those near you. This is a *reductio*: no one accepts starving their child to feed strangers.
       - *Example*: You withhold disaster relief from your town to donate to a global fund, expecting correlated agents to do likewise. But your town suffers, and strangers get no extra help (since your action doesn't causally influence them).
     - **Defender Response**: Defenders **concede the implication** but argue:
       - Near agents may *also* be correlated (e.g., family shares your genes/values), so helping them aligns with the view.
       - In practice, "negligible local costs" prevent extreme trade-offs.
     - **Decisiveness**: **Fatal in practice**. This exposes a conflict between your view and moral intuitions. Defenders must bite the bullet or add *ad hoc* constraints.

  #### **7. Decision Instability in Strategic Contexts (Awkward)**
     - **Objection**: If all agents reason evidentially, they may second-guess each other, leading to circularity or multiple equilibria (e.g., "If I cooperate, will they expect that and defect?"). Unlike causal reciprocity, this lacks a clear resolution.
       - *Example*: In a large Prisoner's Dilemma, if agents are anti-correlated, cooperation could signal defection, creating chaos.
     - **Defender Response**: Defenders **shrug this off**:
       - Correlations are fixed by types, not decisions, avoiding loops.
       - In large populations, individual reasoning has negligible impact on group evidence.
     - **Decisiveness**: **Awkward**. It complicates applications but doesn't refute the core.

  #### **8. Payoff Non-Locality as a Dodge (Serious)**
     - **Objection**: Dismissing local payoffs ("it's not about getting richer") insulates your view. If evidential cooperation never improves tangible outcomes, it resembles wishful thinking—e.g., donating to ineffective charities because "correlated agents might do good."
       - *Rebuttal to your reply*: Saying payoffs are "non-local" avoids empirical accountability. CDT can show causal cooperators outperform evidential ones in simulations (e.g., in iterated games without fixed types).
     - **Defender Response**: Defenders **shrug this off**:
       - Rationality isn't about wealth maximization but maximizing expected utility given evidence.
       - "Success" is defined by the decision rule, not external benchmarks.
     - **Decisiveness**: **Serious**. Critics see this as circular; defenders see it as principled.

  ---

  ### **Predictions and Insulation**
  - **Unique Predictions**: Your view predicts cooperation in causally isolated, high-correlation scenarios (e.g., voting in large elections where your ballot won't swing results but signals your "type"). CDT predicts defection here.
  - **Insulation**: The position **is heavily insulated** by qualifications:
    - It only applies when correlations are "positive and strong."
    - Local costs must be "negligible" relative to global benefits.
    - Populations must be "large enough" for aggregation.
  - **Is Insulation a Defect?**: Yes, if it renders the view unfalsifiable. Critics argue it becomes a "trivial truth" (cooperate when evidence says it helps). But this is the price of a hybrid conceptual/empirical view: it relies on hard-to-verify claims about the world.

  ---

  ### **Convergence with Causal Views?**
  - **Partial Convergence**: In finite, repeated, or evolutionary settings, evidential and causal cooperation often align:
    - *Kin/group selection*: Genes causing cooperation spread if agents are correlated (e.g., helping siblings). Here, "evidence" of relatedness enables causal success.
    - *Learning dynamics*: In simulations, evidential agents can outperform CDT in correlated populations, but only if correlations are stable.
  - **Divergence**: In true one-shot, non-causal settings (e.g., Newcomb's Problem), they split: CDT defects, you cooperate. No full convergence.

  ---

  ### **Overall Assessment**
  - **Fatal Exposures**: Screening off (if accepted), infinite populations (if unmeasurable), and betrayal of the near (if consequences are enforced).
  - **Defender's Stronghold**: The core conditional ("if correlated, cooperate") is defensible within evidential decision theory. Defenders concede anti-correlation and character concerns but dismiss CDT critiques and empirical doubts.
  - **Your Unsettled Worries**: 
    - **Correlation despite common cause**: Defenders maintain the link via uncertainty or type-revelation.
    - **Anti-correlation**: Forces defenders into contingent defenses.
    - **Infinite populations**: Requires a measure—otherwise fatal.
    - **Collapse into character**: Conceded as reshaping, not abandoning, the view.
  - **Biggest Risk**: The position's most vulnerable point is its **empirical premise**—without evidence of vast, positively correlated agents, it becomes an elegant but impractical theory. Its moral implications (e.g., neglecting the near) could make it self-defeating if universally adopted.

  This position is a bold challenge to causal orthodoxy but thrives only in a specific, empirically uncertain niche. If you defend it, emphasize the Newcomb intuition and attack CDT's "superstition," but grant that its real-world applicability hinges on unresolved questions about the universe's structure and agent correlations.
