prompt: |-
  I want to arrive at a principle about moral worth — about what makes an action not merely right or useful but admirable, the kind of thing that reflects well on the agent — and I would rather have the principle than a tour of the literature, so please treat the following as my data. I do not claim the data are consistent; locating the inconsistencies is part of what I am asking for.

  1. A shopkeeper refrains from overcharging a child only because a reputation for honesty brings in customers. I say the act is right but has no moral worth whatever.

  2. A woman gives a large sum to a relief fund on the strength of a sudden, vivid sympathy for a photograph she has just seen. She never frames the gift as a duty and would be puzzled if you asked whether it was one. I say the act is admirable — it has moral worth — and not merely because of its effects.

  3. A man of cold temperament, who feels nothing at the sight of the same photograph and finds giving genuinely costly, gives the same sum because he is convinced it is what morality demands and he cares about doing what morality demands. I say this act has moral worth, and more of it than the act in (2). The struggle seems to count for something.

  4. A woman raised in a closed community sincerely believes it is her duty to perform a painful ritual on her daughter, and performs it out of a settled, costly commitment to doing her duty, with no self-interest and no wavering. Her will is as wholehearted and as duty-governed as the man's in (3). I say her act has no moral worth at all, and I am unwilling to call her admirable.

  5. A man helps a stranger in distress out of a genuine concern for the stranger's need — but he is also, in the background, moved by the thought that he wants to be the sort of person who responds to need, and he would be disappointed to learn that he was not. I find I want to say the act has moral worth, and I distrust that answer.

  6. A woman resolves to keep a promise because keeping promises is required. The resolve preoccupies her so much that she forgets the promise entirely, and by an unrelated chain of accidents she ends up doing exactly what she promised, for no reason connected to the promise. I say the act, though it is what she promised and though she had the right resolve, has no moral worth: the right concern never made it into the act.

  7. A physician, on the best evidence available to anyone, believes a drug is safe and gives it to relieve a patient's suffering; the drug kills the patient. I cannot bring myself to fault her will, but I am unsure whether to say the act had moral worth, because I am unsure whether moral worth attaches to acts or only to wills.

  My tentative principle: an action has moral worth just in case the agent is moved by a concern for the very features that make the action right, and that concern is what actually produces the action, not merely a companion to it.

  Test this against all seven verdicts. I expect it to strain in at least two places — I will not say which — and I want those strains made explicit rather than smoothed over. If a single principle can be repaired to save every verdict, state it precisely, say what each clause is doing, and name the case that forced each clause. If saving every verdict requires a principle so baroque that I should instead surrender one verdict, say which one and why that is the cheapest concession. Along the way, please say what your principle predicts about a case I have not listed — construct one that falls in a gap between my cases rather than repeating one of them — and, if you think the question about acts versus wills in (7) cannot be settled without first deciding what moral worth is for, say what turns on that decision.
reasoning: |-
  Hmm, this is a fascinating and challenging query about moral worth. The user presents seven carefully constructed thought experiments and a tentative principle, then asks me to rigorously test that principle against all cases, identify strains, and potentially propose a better framework. 

  First I notice how methodical the user is - they explicitly state they want inconsistencies located, not smoothed over, and even warn me about anticipated strains in their principle. This suggests they're deeply familiar with philosophical discourse and want genuine engagement, not textbook answers. Their cases cleverly explore tension points in moral psychology: motives vs consequences, emotional spontaneity vs dutiful struggle, epistemic constraints vs moral responsibility.

  Looking at their tentative principle - that moral worth requires being moved by the right-making features - I immediately see why they expect strains. Case 4 (the ritual) is the obvious problem: by their principle, the mother should have moral worth since she's moved by what she believes are right-making features (duty), yet they deny it. Case 7 (the physician) exposes the act/will ambiguity they mention. 

  But the subtler tension might be in case 5 (the helper with mixed motives). Their principle might accept this as moral worth since concern for need is present, but the user feels distrust - probably because the self-regarding motive contaminates it. And case 2 vs 3 creates another puzzle: if moral worth increases with struggle, does that mean spontaneous sympathy (case 2) has less worth than costly duty (case 3)? But their verdict says case 3 has more worth.

  For my proposed principle, I consider building around three layers: (1) responsiveness to genuine moral reasons (not just believed ones), (2) motivational efficacy of those reasons, and (3) absence of moral distortion. This handles case 4 by requiring the reasons to be objectively valid, and case 5 by excluding self-referential motives. 

  The physician case (7) makes me realize moral worth must attach to the will - the decision to act based on best evidence - since the tragic outcome was epistemically inaccessible. I'll create a new case about misleading evidence to test this: someone acts on sincere but unreasonable beliefs.

  If forced to recommend surrendering a verdict, case 6 (forgotten promise) might be the cheapest since the accidental action wasn't caused by moral concern anyway - but the user seems particularly committed to that intuition. Better to refine the principle.

  Throughout, I should maintain their preference for precision over literary survey. When discussing what "moral worth is for," I'll suggest its role in moral evaluation of agents explains why we care about will rather than just outcomes.
answer: |-
  Your approach is rigorous, and your cases reveal deep tensions in moral psychology. Let's test your tentative principle ("an action has moral worth just in case the agent is moved by a concern for the very features that make the action right, and that concern is what actually produces the action") against your verdicts, expose strains, and refine a principle that saves all cases—though it requires significant complexity. I'll then propose a new case and address the act/will question.

  ---

  ### **Testing Your Tentative Principle**
  **Strain Points:** Your principle strains severely in **Case 4 (ritual)** and **Case 7 (physician)**, and moderately in **Case 5 (mixed motives)** and **Case 6 (forgotten promise)**.

  1. **Shopkeeper (✓)**  
     - Principle: He isn’t moved by the right-making feature (fairness). Motive is self-interest.  
     - Verdict match: ✅ Correctly has no moral worth.

  2. **Sympathetic Donor (✓)**  
     - Principle: She’s moved by the right-making feature (relieving suffering), via sympathy.  
     - Verdict match: ✅ Admirable, has moral worth.

  3. **Dutiful Donor (✓)**  
     - Principle: He’s moved by the right-making feature (relieving suffering), via duty.  
     - Verdict match: ✅ Has moral worth (and more than Case 2, per your view).  
     - *Note: Principle doesn’t explain "more worth" from struggle—we address this later.*

  4. **Ritual Performer (✘ Major Strain)**  
     - Principle: *She is moved by what she believes are the right-making features (duty, tradition).*  
     - Your verdict: ❌ No moral worth.  
     - **Strain:** Your principle can’t exclude her—it lacks an objective constraint on what *actually* makes actions right.

  5. **Helper with Self-Referential Motive (✘ Moderate Strain)**  
     - Principle: *He’s moved by the right-making feature (responding to need), but also by a desire for self-congruence.*  
     - Your verdict: ⚠️ Moral worth, but with distrust.  
     - **Strain:** Principle allows this, but your distrust suggests self-referential motives might dilute worth.

  6. **Forgotten Promise (✘ Minor Strain)**  
     - Principle: *The concern for promise-keeping didn’t produce the act* (though she had the resolve).  
     - Verdict match: ✅ No moral worth.  
     - *Note: Matches, but your case hints at "motivational efficacy" needing refinement—see repaired principle.*

  7. **Physician (✘ Major Strain)**  
     - Principle: *She’s moved by the right-making feature (relieving suffering), but the act (giving the drug) turned out wrong.*  
     - Your verdict: ❓Uncertain if *act* has moral worth.  
     - **Strain:** Principle implies worth if she acted on right features, but you hesitate because the outcome was tragic. Requires clarifying if worth attaches to acts or wills.

  ---

  ### **Repaired Principle (Saves All Verdicts)**
  **Principle:**  
  *An action has moral worth if and only if:*  
  **(i)** *The agent is moved by a concern for the objective moral reasons that make the action right*;  
  **(ii)** *That concern is the efficient cause of the action*;  
  **(iii)** *The agent’s responsiveness to moral reasons is not fundamentally impaired by ignorance or distortion*;  
  **(iv)** *The agent’s motive is non-self-referential with respect to the act’s moral status.*  

  **Clauses Explained & Cases That Forced Them:**  
  - **(i) Objective moral reasons**  
    (Forced by **Case 4: Ritual**)  
    The ritual isn’t objectively right—no genuine moral reason exists. Her "duty" is illusory.  
  - **(ii) Efficient cause**  
    (Forced by **Case 6: Forgotten Promise**)  
    The right concern (promise-keeping) didn’t cause the act—it was accidental.  
  - **(iii) Unimpaired responsiveness**  
    (Forced by **Case 7: Physician** and **Case 4: Ritual**)  
    The physician’s responsiveness is intact (she used best evidence); the ritualist’s is impaired (false moral beliefs).  
  - **(iv) Non-self-referential motive**  
    (Forced by **Case 5: Mixed Motives**)  
    The helper’s background desire ("I want to *be* good") risks reducing worth. Clause excludes motives focused on *oneself as moral agent* (e.g., virtue-signaling). Pure sympathy (Case 2) or duty (Case 3) are other-directed.  

  ---

  ### **Applying the Repaired Principle**
  1. **Shopkeeper**: Fails (i). Motive is self-interest, not moral reasons.  
  2. **Sympathetic Donor**: Satisfies all. Moved by suffering (i), sympathy causes act (ii), no impairment (iii), motive is other-directed (iv).  
  3. **Dutiful Donor**: Satisfies all. Same as above, plus struggle *enhances* worth by confirming commitment (but not required by principle).  
  4. **Ritual Performer**: Fails (i) and (iii). No objective moral reason; responsiveness impaired by false beliefs.  
  5. **Helper with Self-Referential Motive**: *If* his "genuine concern for need" dominates, satisfies (i)–(iii). But (iv) excludes the self-referential part—so worth is diminished but not absent (matches your distrust).  
  6. **Forgotten Promise**: Fails (ii). Moral concern didn’t cause the act.  
  7. **Physician**: **The act lacks moral worth** (since it caused harm), **but her will has moral worth**. Satisfies (i)–(iv) for the *decision*: moved by patient’s need (i), caused treatment (ii), responsiveness unimpaired (iii), motive non-self-referential (iv).  

  ---

  ### **If You Must Surrender One Verdict: Case 5**  
  - **Why cheapest?** Your distrust in Case 5 suggests unease about self-referential motives. Dropping (iv) simplifies the principle. Case 5 could then have *full* worth if the primary motive is the stranger’s need—but this clashes with your intuition. Alternatively, surrender the verdict and declare Case 5 *lacking* worth, but this overcorrects.  
  - **Cost:** Losing (iv) makes it harder to distinguish pure duty/sympathy (Cases 2–3) from "moral self-regard" (Case 5).  

  ---

  ### **New Case: Falling in a Gap**  
  **Case 8: The Accidental Truth-Teller**  
  *A politician, seeking re-election, lies about his policies. Unbeknownst to him, his statement is true due to last-minute policy changes he forgot. He is moved solely by self-interest.*  
  - **Principle Prediction:** No moral worth. Fails (i) (not moved by moral reasons) and (ii) (truth-telling accidental).  
  - **Gap:** Tests whether *accidental alignment* with moral reasons (unlike Case 6, where resolve existed) can ever confer worth. Verdict: No worth—consistent with Cases 1 and 6.  

  ---

  ### **On Acts vs. Wills (Case 7)**  
  The question *cannot be settled* without asking what moral worth is **for**.  
  - **If for evaluating character/agents:** Worth attaches to the *will* (the physician’s decision is admirable; the outcome is tragic luck).  
  - **If for guiding action/praise:** Worth attaches to *acts* (we praise successful moral actions more than failed ones).  
  - **What turns on this?** Your Case 7 hesitation suggests you lean toward *will-based worth* (you "cannot fault her will"). The repaired principle reflects this: the *act* of killing lacks worth (it’s wrong), but her *decision to treat* has worth as an expression of her moral will.  

  ---

  ### **Final Recommendation**  
  The baroque principle is defensible—it systematizes your judgments without arbitrariness. If complexity is prohibitive, **surrender Case 5’s verdict** and drop clause (iv), accepting that self-referential motives don’t negate worth. But retaining all clauses best honors your intuitions, especially the critical distinction between authenticity (Case 3) and delusion (Case 4). Moral worth is not just about "good motives," but *correct responsiveness to real moral demands*.
