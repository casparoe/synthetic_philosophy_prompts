prompt: |-
  You're a philosopher who's taught metaethics and philosophy of language for years, and you're good at making hard distinctions land. I need a teaching plan, not a lecture.

  Context: I'm running one 75-minute session for a small reading group of first-year grad students from across the department. They've done a bit of metaethics -- they know the cognitivism / non-cognitivism split and roughly why people find expressivism attractive -- but they've never heard of the embedding problem, and I want to walk them into the Frege-Geach problem for expressivism. Think it through before you answer: brainstorm the dependency structure first, then give me the plan.

  What I need:

  1. The order. Which piece has to be in place before the next, and why. What does the expressivist's core claim have to be pinned down to before the embedding fact can even look like a problem, and what has to come before the validity point so that modus ponens doesn't just feel like a technicality.

  2. The carrying example. I'm tempted to build the whole thing on a sentence like 'ghosting someone after three dates is cowardly' and then embed it -- under a negation, inside a conditional, inside a question -- and contrast it with something genuinely non-embeddable like 'Ouch!'. Tell me whether that's the right carrier and what it needs to have. And tell me specifically whether I should instead use the old standby conditional about getting your little brother to lie, or whether that's too worn out / smuggles in too much. If neither, what should carry it.

  3. The misconceptions, in the order they'll actually form, and exactly where in the sequence I should head each off. I'm definately expecting at least: 'expressivism just says moral claims are boos, so of course they can't embed'; 'this is really about whether moral claims are true'; 'that the same words have to mean the same thing in both places is just obvious, not a real constraint'; and 'well then the Frege-Geach problem just refutes expressivism.' Tell me where each one actually needs to be defused, not just that it exists.

  4. The check. One question I can ask at the end that tells me whether they got the crux -- I think the crux is that validity needs the same content to appear inside and outside the conditional -- rather than just nodding along.

  5. What to leave out and say I'm leaving out. I don't want to open the quasi-realist repairs or the logic-of-attitudes machinery unless it's genuinely needed.

  Keep it concrete about sequencing and don't just explain the problem to me.
reasoning: |-
  Okay, the user is a philosophy instructor preparing a 75-minute session for first-year grad students on the Frege-Geach problem. They want a structured teaching plan, not a lecture, with clear dependencies and misconceptions addressed. 

  First, I need to map the conceptual dependencies: 
  - Must establish expressivism's core (non-descriptive speech acts) BEFORE embedding, or students will confuse it with subjectivism. 
  - Need concrete examples of embedded contexts (negation, conditionals) BEFORE validity, or modus ponens will seem abstract. 
  - Validity must be presented as about content preservation FIRST, otherwise the "same meaning" requirement feels arbitrary.

  The "ghosting is cowardly" example is perfect - contemporary, relatable, and avoids the stale "lying" example that smuggles in moral assumptions. "Ouch!" contrasts well for non-embeddables. Should sequence embeddings: negation (easiest) → question → conditional (hardest, sets up validity).

  Major misconceptions to preempt: 
  - Early: "Boos can't embed" (clarify expressivism isn't just interjections). 
  - When introducing validity: "It's about truth" (stress content vs. truth-bearer distinction). 
  - When stating Frege-Geach: "Same meaning is obvious" (use the "ouch!" contrast to show it's substantive). 
  - At the end: "This refutes expressivism" (flag quasi-realism as the next step without diving in).

  The check question should force them to articulate why validity requires identical content across embedded/unembedded contexts - maybe: "Why can't we treat the consequent in 'If ghosting is cowardly, then...' as a new speech act?"

  Cut quasi-realism entirely - just note it exists as the expressivist response. Avoid attitude logic. Keep focus on why embedding creates the problem before solutions.

  Timing breakdown: 
  - 15 min setup (expressivism recap + examples) 
  - 25 min embedding demonstration 
  - 20 min validity pivot 
  - 10 min problem formulation + Q&A 
  - 5 min buffer

  The core tension to emphasize: Expressivism's surface plausibility vs. its struggle with compositional semantics. That's what makes Frege-Geach so devastating if unresolved.
answer: |-
  Here’s a concrete 75-minute teaching plan focused on dependency structure, misconceptions, and your "ghosting" carrier example. The goal is to make the Frege-Geach problem *emerge* from student engagement, not lecture.

  **Core Dependency Structure:**  
  `Expressivist core claim → Embedding phenomenon → Validity demand → Frege-Geach problem`  
  *Why this order?* Without nailing the *non-descriptive* nature of expressivism, embedding seems irrelevant. Without seeing embedding in action, validity demands feel arbitrary. Without validity, modus ponens is just "a rule," not a constraint.

  ---

  ### **TEACHING PLAN: THE FREGE-GEACH PROBLEM**  
  **Total:** 75 mins (adjust timing as needed)

  #### **PART 1: PIN DOWN EXPRESSIVISM (15 mins)**  
  **Goal:** Isolate expressivism’s *non-cognitive, action-oriented* core.  
  - **Activity:** Pair discussion (3 mins): *"What does an expressivist say about ‘Ghosting after three dates is cowardly’? Contrast with ‘Grass is green.’"*  
  - **Clarify (whole group):**  
    - Expressivism: Uttering the sentence *performs* disapproval ("Boo ghosting!") — it doesn’t describe a moral fact.  
    - **PIN DOWN:** "Moral claims express attitudes, not beliefs."  
    - **Carrier example:** Use **"Ghosting is cowardly"** → map to "Boo!" (emphasize: it’s *like* a boo, but a *sentence*).  
  - **Preempt misconception #1:** *"Expressivism just says moral claims are boos, so of course they can’t embed!"*  
    - **Response:** "Hold that thought! But note: we use moral language in complex sentences. Is expressivism claiming we *can’t*? Let’s test it."  
    - *Why here?* This misconception blocks engagement with embedding. Defuse it by pivoting to data.

  #### **PART 2: EMBEDDING PHENOMENON (20 mins)**  
  **Goal:** Show moral claims *do* embed, unlike pure interjections.  
  - **Activity:** Board examples. Ask: *"What speech act is performed when we say..."*  
    1. Simple: "Ghosting is cowardly." → (Express disapproval)  
    2. Negation: "Ghosting is **not** cowardly." → (Express tolerance? Reject disapproval?)  
    3. Question: "**Is** ghosting cowardly?" → (Seek attitude alignment?)  
    4. Conditional: "**If** ghosting is cowardly, **then** telling your friend is cruel." → (???)  
  - **Contrast with "Ouch!"**:  
    - "Ouch!" = pure expression. Can’t negate (*"Not ouch!"*), question (*"Is ouch?"*), or conditionally embed (*"If ouch, then..."*) meaningfully.  
  - **Key point:** Moral claims *pattern* with descriptive claims ("Grass is green") in embedding.  
  - **Preempt misconception #2:** *"This is really about whether moral claims are true."*  
    - **Response (here):** "Notice: we’re asking about *speech acts in context*, not truth. Even if ‘Boo!’ isn’t true/false, ‘Is ghosting cowardly?’ is a question with content. Why can’t expressivism explain that?"  
    - *Why here?* Truth-talk distracts from the *semantic behavior* of embedded clauses. Anchor in speech acts.

  #### **PART 3: VALIDITY & MODUS PONENS (25 mins)**  
  **Goal:** Show validity requires *stable content* across embeddings.  
  - **Set up modus ponens (MP):**  
    - Premise 1: If ghosting is cowardly, then telling your friend is cruel.  
    - Premise 2: Ghosting is cowardly.  
    - Conclusion: Telling your friend is cruel.  
  - **Activity:** *"Is this argument valid? Why?"* → Elicit: Validity depends on the content of "ghosting is cowardly" being *the same* in both premises.  
  - **Expressivist challenge:**  
    - In P2, "ghosting is cowardly" = disapproval (Boo!).  
    - In P1, it’s embedded → not performing disapproval. What *is* it doing?  
  - **Contrast:**  
    - Descriptive: "Grass is green" means the same in simple/embedded contexts.  
    - Pure expression: "Ouch!" can’t appear in P1 at all.  
  - **Preempt misconception #3:** *"That the same words mean the same thing is obvious!"*  
    - **Response (here):** "Is it? Expressivism says moral sentences *fundamentally* express attitudes. Shouldn’t that change what they mean in different contexts? But then how does MP work? Validity *constrains* expressivism."  
    - *Why here?* Students now see the tension: expressivism’s flexibility vs. logic’s rigidity.

  #### **PART 4: FORMULATE FREGE-GEACH (10 mins)**  
  **Goal:** Elicit the problem as a dilemma.  
  - **State the problem:**  
    - If "ghosting is cowardly" means *different things* when embedded vs. unembedded → MP is invalid (content isn’t preserved).  
    - If it means the *same thing* → but expressivism says it *only* expresses an attitude. What is that "same thing"?  
  - **Preempt misconception #4:** *"Frege-Geach refutes expressivism!"*  
    - **Response:** "It’s a challenge, not a refutation. Expressivists *must* explain how attitudes embed while preserving content for logic. Quasi-realism (next time!) tries this. But today: see why this is the *core* problem?"  
    - *Why here?* Prevents premature dismissal. Ends on the "puzzle" feeling.

  #### **CHECK FOR UNDERSTANDING (5 mins)**  
  **Crux-check question:**  
  > *"Why can’t the expressivist say that in ‘If ghosting is cowardly, then...’, the consequent expresses a* ***conditional attitude*** *(e.g., ‘If I disapprove of ghosting, then I disapprove of telling’)? How would that break modus ponens?"*  
  - **Correct answer:** Validity requires the *same content* in both premises. If P2 expresses disapproval, but P1’s antecedent expresses a *conditional* attitude, they don’t share content → MP fails.  
  - **If they miss it:** Contrast with descriptive MP ("If grass is green, then... / Grass is green").

  ---

  ### **CARRIER EXAMPLE NOTES**  
  - **Use "ghosting is cowardly"** (not lying). Why?  
    - Avoids moral assumptions (lying is uncontroversially wrong → distracts).  
    - Feels contemporary, lowers defenses.  
    - Embeddings work naturally: negation ("not cowardly"), questions ("is it cowardly?"), conditionals ("if it’s cowardly, then...").

  ### **WHAT TO LEAVE OUT**  
  - **Explicitly state:** "We’re focusing on *why* embedding is a problem. Next time, we’ll see expressivist solutions (quasi-realism, attitude logic). Today’s goal: understand the *stakes*."  
  - **Cut:** Quasi-realism, compositional semantics machinery, truth-conditional theories.  
  - **Rationale:** Opening solutions dilutes the problem’s force. First-year grads need to feel the *weight* of Frege-Geach before repairs.

  ---

  **Why this sequence works:**  
  - Builds from intuitive examples (simple → embedded) to abstract (validity).  
  - Each step forces expressivism into a corner *using their own intuitions* (e.g., "You agree MP is valid, right? Then...").  
  - Preempts misconceptions *as they arise* (e.g., blocking "it’s about truth" when embedding is introduced).  
  - The carrier example is neutral, embeddable, and makes the problem vivid without baggage.
