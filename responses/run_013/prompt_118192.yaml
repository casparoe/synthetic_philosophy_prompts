  ### Brainstorming Candidate Mechanisms
  1. **Binary Shift Map (Base 2)**:  
     - *Rule*: \(x_{n+1} = 2x_n \mod 1\), applied to a binary fraction.  
     - *Pros*: Simple bit-shifting; clearly exposes exponential information loss.  
     - *Cons*: Binary arithmetic may be less intuitive for some students; requires translating decimals to binary.  

  2. **Tent Map (Piecewise Linear)**:  
     - *Rule*:  
       \[
       x_{n+1} = 
       \begin{cases} 
       2x_n & \text{if } x_n < 0.5 \\
       2(1 - x_n) & \text{if } x_n \geq 0.5 
       \end{cases}
       \]  
     - *Pros*: Deterministic chaos; visually intuitive.  
     - *Cons*: Conditional branches increase hand-calculation time; decimal precision handling is messy. **REJECTED** due to computational overhead and potential for arithmetic errors.  

  3. **Decimal Shift Map (Base 10)**:  
     - *Rule*: \(x_{n+1} = 10x_n \mod 1\), applied to a decimal fraction.  
     - *Pros*: Decimal arithmetic is familiar; each digit shift clearly corresponds to one step of prediction; precision costs align logarithmically.  
     - *Cons*: Requires managing truncation.  
     **SELECTED**: Balances intuition, hand-executability, and pedagogical clarity. The logarithmic cost of precision (doubling horizon ≈ squaring precision) is vivid.

  ---

  ### Activity Design: **The Unraveling Clock**
  **Core Mechanism**:  
  - **System**: States are decimals in \([0, 1)\) (e.g., \(0.492718...\)).  
  - **Rule**: \(x_{n+1} = 10x_n - \lfloor 10x_n \rfloor\) (shift left, drop integer).  
  - **Dynamics**:  
    - Each step discards the leftmost digit.  
    - With \(d\) digits of precision, prediction is exact for \(d\) steps.  
    - Horizon \(H \propto \log(\text{precision})\): 1 extra digit → 1 extra step; doubling \(H\) requires ≈100× precision.  
  - **Precomputation**:  
    - Initial state: Fixed 10-digit decimal (e.g., \(0.{\bf 6}128359047\), bold denotes displayed digit).  
    - Precompute 15 steps. Ensure first digits of next states are uniformly distributed (0–9, each appears once in 10 steps).  

  **Roles & Scoring**:  
  - **Predictors (14 students)**:  
    - Start with 20 points.  
    - At each step:  
      - Shown *current state* with 1 digit (free).  
      - May **buy extra digits** (2 points/digit, max 9).  
      - Predict *next state’s first digit* (0–9).  
      - Correct prediction: +10 points.  
  - **Statistician (2 students)**:  
    - Start with 20 points.  
    - **Never buys digits**; never predicts individual steps.  
    - Records first-digit frequencies.  
    - **Endgame bonus**: +100 points if all digits 0–9 appear (uniform distribution).  
  - **Rational Play**:  
    - Optimal for predictors: Buy 1 digit/step (cost 2, reward 10, net +8/step).  
    - Statistician wins via aggregate bonus (20 + 100 = 120) vs. optimal predictor (20 + 8×10 = 100).  

  **Phases**:  
  1. **Blind Phase (Steps 0–3)**:  
     - Rule hidden. States displayed with 1 digit.  
     - Prediction fails (no pattern discernible).  
  2. **Revealed Phase (Steps 4–9)**:  
     - Rule publicized. Play continues with purchases.  
     - Predictors use rule but need precise *current* state.  

  **Timeline (90 mins)**:  
  - **0–5 min**: Explain rules, roles, and scoring. *Do not mention determinism/chaos*.  
  - **5–15 min (Step 0)**:  
    - Display \(s_0\) (e.g., "0.**6**").  
    - Predictors buy digits (e.g., pay 4 points for 2 extra digits → see "0.612").  
    - Predict next state’s first digit (e.g., guess "1").  
    - Reveal actual first digit of \(s_1\) (e.g., "1").  
  - **15–45 min (Steps 1–9)**:  
    - Repeat for each step.  
    - **At step 4**: Reveal rule ("Next state = fractional part of 10 × current state").  
    - Record predictions, costs, and actual digits.  
  - **45–60 min (Endgame)**:  
    - Statistician wins bonus (precomputed uniformity).  
    - Calculate scores: Predictors net cost/reward; statistician claims aggregate win.  
  - **60–75 min (Data Review)**:  
    - Participants share strategies/outcomes (whiteboard).  
    - Facilitator plots precision (digits bought) vs. prediction success.  
  - **75–90 min (Debrief)**: Replay data to unpack themes.  

  ---

  ### Solvability Check & Collapse
  - **Rational Actions**:  
    | Digits Bought | Cost | Prediction Accuracy | Net/Step |  
    |--------------|------|---------------------|----------|  
    | 0            | 0    | 10% (guess)         | +1       |  
    | 1            | 2    | 100%                | **+8**   |  
    | ≥2           | ≥4   | 100%                | ≤+6      |  
    Optimal: Buy 1 digit/step.  
  - **Full-Information Collapse**:  
    - If initial state given exactly (e.g., "0.6128359047"), predictors compute *all* future states without purchases.  
    - Activity trivializes: No points spent, all predictions correct.  
    - **Lesson**: Predictability depends on information access, not just determinism.  

  ---

  ### Failure Modes & Mitigations
  1. **Arithmetic Errors**:  
     - *Risk*: Students miscompute \(10x \mod 1\).  
     - *Fix*: Use precomputed states; emphasize truncation (not rounding).  

  2. **Statistician Boredom**:  
     - *Risk*: Passive role during steps.  
     - *Fix*: Assign digit-frequency tally; involve in final verification.  

  3. **Overbuying Digits**:  
     - *Risk*: Students buy excess digits, missing cost inefficiency.  
     - *Fix*: After Step 5, highlight net gains/losses publicly.  

  4. **Misinterpreting Rule**:  
     - *Risk*: Confusion post-reveal (e.g., rounding errors).  
     - *Fix*: Practice step with rule (e.g., compute 10 × 0.312 → 0.120).  

  ---

  ### Honest Limits
  The activity isolates **measurement precision** as the source of unpredictability but omits:  
  - **Model error** (real systems have imperfect laws).  
  - **Unresolved scales** (e.g., turbulence subgrid effects).  
  - **Computational cost** (here, calculation is trivial).  
  - **Hidden-variable objection**: The precomputed string implies a "pre-written future," but real determinism is dynamic, not pre-rendered.  
  - **Agency/responsibility**: Determinism’s implications for free will are underexplored.  

  **Facilitator Notes for Debrief**:  
  - "While this system’s future is encoded in its present, real systems generate futures *through* dynamics, not static strings. Chaotic systems amplify uncertainty from many sources, not just measurement."  
  - "Numerical chaos isn’t mere round-off error: The shadowing lemma ensures computed trajectories stay close to *some* true trajectory, but not the one you intended—predictability remains broken."  

  ---

  ### Debrief: Mapping Feelings to Insights
  1. **"Laws ≠ Predictability" (Point 1)**:  
     - Replay Steps 4–5: Rule known, yet predictions failed without precise present state.  
     - *Quote*: "You had the law but couldn’t use it—why?"  

  2. **"Brutal Logarithmic Cost" (Point 2)**:  
     - Plot digits bought vs. steps predicted correctly (e.g., 2 digits → 2 steps).  
     - Contrast: "Who tried predicting 3 steps ahead? What did it cost?" → Highlight \(H \propto \log(1/\epsilon)\).  

  3. **"Chaos ≠ Randomness" (Point 3)**:  
     - Show statistician’s digit-frequency tally (uniform).  
     - *Contrast*: "While individuals stumbled, aggregates were rock-solid."  

  4. **"Determinism is Descriptive" (Point 4)**:  
     - Compare Blind Phase (1-digit states: unpredictable) vs. Revealed Phase (full precision: deterministic).  
     - *Insight*: "Did the system change—or just your description of it?"  

  **Close**: "When we say the world is deterministic, we’re choosing a lens. What you felt today was the weight of that choice."  

  --- 
  **Final Note**: This design meets all constraints—no citations, no randomizers, no pre-debrief keywords. It stands alone for facilitators new to chaos theory.
