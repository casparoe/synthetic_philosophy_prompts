  Timeline for the activity (90 minutes):

  0-5 min: Introduction. Facilitator explains the game: "We are going to play a prediction game. You will be shown a decimal number between 0 and 1 at each step, and your task is to predict the first digit after the decimal point of the next number in the sequence. You start with 20 points. At each step, you will be shown the current number with the first digit. You can then purchase additional digits of the current number, at a cost of 2 points per digit. After you have purchased any additional digits you want, you will be given the current number with those digits. Then you will write down your prediction for the next number's first digit. After everyone has predicted, I will reveal the next number's first digit. If your prediction is correct, you earn 10 points. There will be 10 steps."

   Also, choose one participant to be the statistician. The statistician does not participate in the per-step prediction. Their role is to observe the aggregate behavior and at the end, if the distribution of the next state's first digits is approximately uniform, they will receive 100 points.

  5-10 min: Phase 0. Practice step. 
   - Display a state (e.g., 0.1) and let them practice buying digits and predicting. Do not advance the state.

  10-30 min: Phase 1 (steps 0-3) - without the rule.
   - At step0: display state0 with 1 digit (e.g., 0.1).
   - Participants may buy additional digits (cost 2 per digit). They then see state0 with their purchased digits.
   - They predict the next state's first digit.
   - Facilitator reveals state1's first digit (e.g., 2).
   - Record scores.
   - Then step1: display state1 with 1 digit (0.2), and repeat.
   - Do for 3 steps.

  30-35 min: Reveal the rule. "From now on, the rule is: the next state is obtained by taking the current state, multiplying by 10, and then taking the fractional part (i.e., remove the integer part)."

  35-60 min: Phase 2 (steps 4-9) - with the rule.
   - At each step, display the current state with 1 digit.
   - Participants may buy additional digits.
   - They are given the current state with the purchased digits.
   - They predict the next state's first digit.
   - Reveal the next state's first digit.
   - Record scores.
   - (6 steps)

  60-70 min: Final step (step10) and scoring.
   - Do step10.
   - Then, the statistician is awarded 100 points if the distribution is uniform (which it is, because we precomputed it to be).

  70-80 min: Participants calculate total points. Facilitator asks for volunteers to share their strategy and score.

  80-90 min: Debrief.

  Debrief points:

  1. Determinism and predictability: 
     - The system was deterministic (the rule was known from step 4 onwards), but you still had to spend resources to predict. Why? Because you didn't have enough information about the present state.
     - Even with the law fully known, the future was unavailable without precise present information.

  2. Brutal loss of predictability with precision:
     - How many of you tried to predict more than one step ahead? Did you see that with more digits, you could predict further ahead? But the cost was high.
     - In fact, to predict further ahead, you needed exponentially more precision. For example, to predict two steps ahead, you need to know the second digit now, which requires buying one extra digit. To predict three steps ahead, you need to know the third digit now, which requires buying two extra digits, and so on. So to double the prediction horizon, you need exponentially more digits (squared precision).

  3. Aggregate behavior:
     - The statistician won by not caring about the exact sequence but by knowing the aggregate distribution. The system was not random: it had a law and the long-run distribution was uniform. The statistician relied on that.

  4. State space carving:
     - In this system, if we describe the state only by the first digit, then the system appears indeterministic: from 0.1, the next state's first digit can be any digit. But with more digits, it becomes deterministic. So determinism is a property of the description, not the system itself.

  Honest limits:
  - The activity only addresses measurement precision. In real systems, there is also model error, unresolved scales, and computational cost.
  - The future was pre-written in the initial condition. In real systems, the future is not pre-written; it unfolds dynamically. But the debrief should note that in a deterministic system, the future is determined by the present, so it is in that sense already contained in the present state.
  - The activity does not address agency or responsibility.
  - We used a discrete-time, discrete-state approximation of a continuous system. In the continuous system, there is no round-off error in the dynamics, but we truncate for representation. The shadowing lemma is not needed for this activity.

  Failure modes:
  - Participants might not understand how to apply the rule. Solution: do a practice step after revealing the rule.
  - The scoring might be confusing. Solution: provide a worksheet with a clear accounting.
  - The statistician role might be passive and boring. Solution: involve them by having them record the digits and compute the distribution at the end.
  - Participants might not buy any digits and guess randomly. Then they will have around 30 points (20 + 10 = 30 from expected 10 correct guesses) while the rational ones have 100 and the statistician has 120. So they see the value of buying information.

  Full design with the decimal shift map.

  Precomputation: 
  - Choose an initial state with 10 digits: for example, 0.1234567890.
  - Compute the next states by: s_{n+1} = fractional part of 10 * s_n.
    s0 = 0.1234567890
    s1 = 0.234567890
     10*s0 = 1.234567890 -> fractional part = 0.2345678900 -> truncate to 10 digits: 0.2345678900
     But to keep 10 digits, we can take it as 0.2345678900 -> but then we have extra zeros. Instead, we can use a fixed string of 20 digits for the initial state and then take windows. 

   To avoid this, let's define the initial state with 20 digits: 0.12345678901234567890.
   Then:
     s0 = 0.1234567890 (first 10 digits)
     10*s0 = 1.2345678901234567890 -> fractional part = 0.2345678901234567890
     s1 = 0.2345678901 (taking the first 10 digits of the fractional part)

     s2 = 0.3456789012
     ...

   We can precompute s0 to s11.

   The next state's first digit for s0 is the first digit of s1, which is '2'.
   For s1: '3'
   etc.

   We'll make sure that the first digits of s1 to s10 are all different. For example:
   s0: 0.1234567890 -> next state's first digit = 2
   s1: 0.2345678901 -> next state's first digit = 3
   s2: 0.3456789012 -> next state's first digit = 4
   ...

   s9: 0.9012345678 -> next state's first digit = 0 ( because next state is 0.0123456789 -> first digit '0')

   So the sequence of next state's first digits: 2,3,4,5,6,7,8,9,0,1 ( for steps 0 to 9)

   All digits from 0 to 9 appear exactly once.

   So the statistician gets the bonus.

