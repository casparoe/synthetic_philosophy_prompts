  For a better picture... maybe process metaphysics? Imagine spacetime as a growing block (past/present real, future open) or a narrative being written—but user might reject that as insufficiently physicalist. Alternatively, keep the block universe but emphasize that within it, causation is real: our current actions are still the gears turning the future. 

