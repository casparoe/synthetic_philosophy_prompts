answer: |-
  Based on your hypothesis and constraints, here's a structured analysis of your proposed research questions, ranked by impact and tractability. I'll distinguish settled vs. contested issues and identify key dependencies. **The consensus view is that unbounded utility *is* problematic**, but your hypothesis challenges *why* it's problematic (idealization vs. inherent irrationality).

  ### Ranking of Questions (Impact + Tractability)
  1.  **Whether the paradox is best read as a constraint on decision rules rather than on utility functions.**  
      - **Why highest impact?** This directly challenges the foundation of expected utility theory (EUT). If successful, it could reframe not just St. Petersburg but all infinite-outcome decisions (e.g., Pascal's Mugging, intergenerational ethics). Upstream of all other questions.  
      - **Tractability (Medium-High):** Focused literature: Peterson's *Non-Bayesian Decision Theory*, Weirich on decision rules, Schick's framing. Requires conceptual analysis, not heavy math. You can test your hypothesis by designing "finite-agent" decision rules and comparing them to EUT.  
      - **Evidence that moves ranking:** If existing decision-rule approaches (e.g., minimax regret, satisficing) *fail* to resolve St. Petersburg cleanly without hidden aggregation.

  2.  **Whether the bounded-utility and discounting families do real work or merely relabel the idealization.**  
      - **Impact (High):** Attacks the dominant "solutions." If they're just disguising the aggregation problem, it validates your hypothesis and undermines decades of literature.  
      - **Tractability (Medium):** Requires dissecting proofs (e.g., Menger's bounded utility theorem, Samuelson's discounting critique). Look for "smuggled aggregation" (e.g., integration over infinite support).  
      - **Evidence:** If you find bounded utility *still* requires infinite summation conceptually (e.g., utility bounds chosen *ad hoc* to avoid divergence), it supports "relabeling." If discounting relies on convergent series *assumptions*, same.

  3.  **Whether the infinite-ethics and Pascal-style arguments inherit the same flaw.**  
      - **Impact (High):** Connects to existential risk, moral philosophy (Bostrom, Beckstead). If they share the flaw, your critique has vast implications.  
      - **Tractability (Low-Medium):** Literature is vast and philosophically charged. Requires translating ethical aggregation (e.g., total utilitarianism) into decision-theoretic terms. Focus on *structural parallels*: Do they require comparing infinite sums?  
      - **Evidence:** If Pascal's Mugging collapses under finite aggregation but St. Petersburg doesn't, it weakens the link. If all "infinite value" arguments rely on unrealizable expectations, it strengthens it.

  4.  **Whether the game can be restated with no infinite aggregation anywhere.**  
      - **Impact (Medium):** Success would be a powerful proof-of-concept, but may appear technical rather than foundational.  
      - **Tractability (High):** Well-defined task. Explore strategies:  
          - **Finite computational models:** Rubinstein's bounded automata, Velupillai's computable economics.  
          - **Finitely additive probabilities:** (Contested! Dubins-Savage) but may hide aggregation.  
          - **Constructive mathematics:** Reject actual infinity (e.g., Finitist/Intuitionist reframing).  
      - **Evidence:** If you find a restatement that *obviously* avoids infinite sums *and* resolves the paradox cleanly, it boosts your hypothesis.

  ### What to Drop (Given a Semester)
  - **Drop #3 (Infinite Ethics/Pascal).** While high-impact, it's the least tractable in one semester and risks scope creep. It depends heavily on answers to #1 and #2. Tackle this *after* establishing your core argument.

  ### Settled vs. Contested Issues
  - **Settled (Broad Consensus):**  
      - The St. Petersburg game has infinite expected monetary value under standard EUT.  
      - Humans do not pay large sums to play it.  
      - Unbounded utility functions lead to divergence in some realistic scenarios (Menger).  
      - *No single "solution" is universally accepted as definitive.*  

  - **Genuinely Contested:**  
      - **Whether infinite aggregation is the *primary* flaw:** Your hypothesis is a minority view (Peterson, Binmore's critiques touch it; Weirich disagrees). Mainstream sees unbounded utility as the core issue.  
      - **Role of decision rules:** Some (Schick, Levi) argue rules should incorporate epistemic/contextual constraints; others insist EUT is sacrosanct without modification.  
      - **Finitism in probability:** De Finetti's strict finitism vs. Kolmogorov's axiomatic infinity is a deep philosophical split.  
      - **Whether "relabeling" occurs:** Proponents of bounded utility (e.g., Arrow) see it as a *rational* constraint; critics (e.g., Hájek) argue it dodges the deeper problem of infinity.  

  ### Recommended Path (Semester Focus)
  1.  **Core Argument (#1):** Build the case that St. Petersburg exposes a flaw in *requiring* agents to compute/compare infinite expectations. Analyze finite decision rules (e.g., max median outcome, resource-limited optimization).  
  2.  **Critique Standard Fixes (#2):** Show that bounded utility/discounting implicitly rely on the idealization they claim to fix (e.g., bounded utility assumes we can *know* where to bound it *a priori*).  
  3.  **Finite Restatement (#4):** Develop a computationally tractable version (e.g., "The game stops when you lack RAM to calculate the next step"). This provides a concrete alternative.  

  **Key Lit to Engage:**  
  - Peterson, M. (2008): *Non-Bayesian Decision Theory* (decision-rule focus)  
  - Binmore, K. (2009): *Rational Decisions* (critique of EUT's idealizations)  
  - Weirich, P. (2020): *Rational Responses to Risks* (defends utility-based approaches)  
  - Rubinstein, A. (1998): *Modeling Bounded Rationality* (finite automata)  
  - Hájek, A. (No End to the St. Petersburg Paradox?) (philosophical critique)  

  This path maximizes impact per effort, directly tests your hypothesis, and avoids the quagmire of infinite ethics (#3) within your timeframe. If evidence emerges that finite decision rules fail (e.g., they create worse paradoxes), pivot to #4 as a fallback positive project.
