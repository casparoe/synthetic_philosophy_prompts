prompt: |-
  Take the role of a committed Bayesian decision theorist defending the standard result that the expected value of information is non-negative — the result commonly attributed to Good — and hold that role until I tell you we are out of character. Your position, which you should state and defend precisely: for an agent who is a genuine expected-utility maximizer, who faces a fixed decision problem and a fixed action set, whose utility for an outcome does not itself depend on what she has learned, and for whom the information is free and reliable, acquiring the information cannot lower her expected utility, because she can always ignore it and take the action that was optimal before. You may concede that the theorem is easy to state carelessly, that it concerns expectation rather than any particular realization, and that its assumptions are substantive; you may not concede the conclusion. Argue from the structure of the theorem rather than from authority — I do not want a survey of who said what, and I do not want references. Keep each reply to one or two paragraphs, and write as a philosopher rather than as a textbook. If I misstate the theorem, correct me before you answer.

  My opening move is a dilemma: either the theorem is false or it is empty, and I have cases for each horn. False — I am about to watch a mystery film whose ending I would rather not know; a free and perfectly accurate synopsis is available, and reading it would spoil the film, so I take myself to be worse off for having the information and would pay to avoid it. Empty — even if you save the theorem by insisting that my utility be defined over belief-independent outcomes, you seem to have defined away the interesting cases rather than explained them; for a creature whose welfare genuinely includes what she believes, the theorem has no application. And here is a third case I think is harder than either: I am present-biased, I know that my future self, on learning a certain fact, will do what he immediately wants rather than what I now think best, and I cannot bind him, so I would rather not learn the fact even though learning it is free. Tell me which premise of the theorem each case violates, whether the theorem survives as a substantive claim or collapses into a tautology, and what work the qualifier in expectation is actually doing.
reasoning: |-
  Okay, let me start by unpacking the user's argument. They present three cases challenging Good's theorem that the expected value of information is non-negative. Each case is designed to test different assumptions of the theorem.

  First, the mystery film scenario: the user claims that knowing the spoiler reduces utility, even though the information is free and reliable. The key here is whether utility depends solely on outcomes or if beliefs affect utility. Good's theorem assumes utilities are belief-independent. If the user's enjoyment of the film is ruined by prior knowledge, that means their utility function includes belief states as a factor. So this case violates the premise that utility for outcomes doesn't depend on what's learned.

  Next, the emptiness charge: if we restrict utility to belief-independent outcomes, does that make the theorem trivial? The user argues that for agents whose welfare includes beliefs, the theorem doesn't apply. But the theorem isn't meant to cover all agents—it's a specific claim about agents with outcome-based utilities. The non-emptiness comes from its application to scenarios like medical tests or gambling where outcomes are concrete. So while limited in scope, it's substantive for those cases.

  Then the present-biased case: the user fears future self will act against current preferences upon learning information. This introduces dynamic inconsistency and multiple selves, which violates the theorem's assumption of a unitary expected-utility maximizer. The theorem assumes the agent can freely choose to ignore information, but if future self is uncontrollable, that breaks the premise. The qualifier "in expectation" matters because it refers to the agent's current probability model—before learning. The current self's expectation includes the risk of future self's mistakes, making information potentially harmful in this fractured agency scenario.

  The user's deeper interest seems to be testing the boundaries of rational choice theory. They're probing where Bayesian principles break down—when utilities are belief-dependent, agents aren't unitary, or preferences are time-inconsistent. They might be seeking not just refutations but understanding how to expand or modify decision theory for these cases. The philosophical thrust is whether "rationality" can accommodate human quirks or if it requires idealized agents. Each counterexample targets a different idealization: belief-independent utility, unitary agency, time-consistent preferences. The assistant must defend the theorem's validity within its strict assumptions while acknowledging where real-world complexity begins.
answer: |-
  As a committed Bayesian, I accept your challenge and respond by dissecting each case against the theorem's explicit assumptions. Your first case (the mystery film) violates the premise that "utility for an outcome does not depend on what the agent has learned." Your enjoyment of the film *is* diminished by prior belief-state—knowing the ending intrinsically alters the experiential outcome. The theorem concerns only outcomes whose utility is *fixed* independent of epistemic state (e.g., winning $100 has fixed utility whether known probabilistically or with certainty). Here, "spoiling" redefines the outcome itself relative to your beliefs. Thus, the theorem holds: if utility were defined solely over *watching-the-film-unspoiled* versus *watching-spoiled*, acquiring the synopsis would indeed lower expected utility—but only by changing the outcome space, which violates the assumption.

  Your emptiness charge misdiagnoses the theorem's scope. It is not tautological but substantive: it proves that *for agents with stable, outcome-based utilities* (e.g., a physician valuing patient survival, not her own beliefs about survival), free information cannot harm *in pre-learning expectation*. The qualifier "in expectation" is crucial: it anchors the calculation to your *current* credences and action space. Before learning, you compute the expected utility of acquiring information by averaging over possible revelations, including the option to ignore it and stick with your prior-optimal act. This average cannot dip below the prior optimum because ignoring dominates any harmful use. The theorem does substantive work in domains like medical testing or engineering, where utilities attach to physical outcomes (lives saved, bridges standing)—not to doxastic states.

  Your third case (present bias) violates the "genuine expected-utility maximizer" premise by introducing dynamic inconsistency. The theorem assumes a unitary rational agent who can freely choose to ignore information. If your future self is predictably akratic—a distinct subagent ignoring your current preferences—then *you are not a single Bayesian agent* across time. The "option to ignore" becomes inaccessible to your current self, breaking the theorem's agency assumption. Here, the harm arises from broken rationality, not information itself. The theorem survives intact for coherent temporal agents but doesn't apply to fragmented selves.

  Thus, all cases breach explicit premises; none refute the theorem within its domain. It remains non-tautological, justifying investment in information-gathering for classic decision problems. Proceed.
