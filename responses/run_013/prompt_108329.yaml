  The key points from the query: The IAU adopted a new definition with three criteria in 2006, demoting Pluto because it failed the "cleared orbit" condition. There was a rejected proposal that would have kept Pluto as a planet. The IAU explicitly rejected a cultural definition in favor of a "scientific" one. The astronomical community remains divided, and the decision was made by vote rather than consensus. There's precedent with Ceres being reclassified in the 19th century without physical changes.

  I need to apply Kripke's interpretation of Wittgenstein here - specifically the skeptical paradox about rule-following: How do we know what rules mean beyond specific cases? The "skeptical solution" suggests meaning comes from community agreement, not facts.

  For Pluto: Before 2006, was there a fact about its planetary status? The skeptical view would say no - the meaning of "planet" wasn't fixed until community practice settled it. But the IAU's rejection of the cultural option complicates this - they claimed to be reporting nature, not deciding.

  The vote outcome is problematic for the skeptical solution because community agreement wasn't unanimous - it was contested. Whose dispositions matter when the community is split? And what about Ceres - its reclassification shows "planet" has historically been fluid.

  Running the analysis both ways: Does this support or embarrass Kripkenstein? It supports by showing how meanings shift through practice, but embarrasses by revealing how contested decisions expose the lack of pre-existing facts. The IAU's claim to be describing nature rather than deciding might be seen as masking the conventional nature of the definition.

  The rule-following literature hasn't fully addressed cases of explicit, contested rule-making by expert communities - Kripke focuses more on individual rule-following. This case shows how community "agreement" can be procedural rather than substantive.

  I should be careful to note what's settled vs. contested in Kripke scholarship: It's settled that Kripke presents a skeptical challenge, but contested whether this is Wittgenstein's actual view or Kripke's reconstruction. I shouldn't present contested interpretations as consensus.
answer: |-
  This episode is better read as a **change of rule** rather than the surfacing of a pre-existing fact of the matter, and it *strains the skeptical solution* while revealing underappreciated complexities in rule-following. Here's the analysis, grounded in Kripke's Wittgenstein (KW):

  ### 1. **Why It's a Change of Rule (Not a Discovered Fact)**
     - **Pre-2006 Indeterminacy**: Before the IAU decision, "planet" lacked necessary and sufficient conditions. Pluto was called a planet based on historical practice (e.g., size, orbit), but this was inconsistent: Ceres was demoted in the 19th century for similar reasons (discovery of other asteroids), while Pluto's "neighborhood" (Kuiper Belt) wasn't understood until later. KW's skeptical problem applies: past usage underdetermined whether "planet" required orbital dominance. No "fact" about Pluto was overturned—the *criteria* shifted.
     - **IAU's Rule-Making**: The IAU explicitly *chose* a dynamical criterion over structural (e.g., hydrostatic equilibrium alone) or cultural options. This was a normative decision, not a discovery. The rejection of the cultural option ("enough people say it is") in favor of a "natural" criterion masks the conventional nature of the choice—the dynamical rule *was created*, not revealed.

  ### 2. **Where the Skeptical Solution Strains**
     - **Lack of Community Consensus**: KW’s skeptical solution relies on communal agreement to fix meaning. But the IAU vote (with Pluto demoted by a minority of attending astronomers) shows no such agreement. The community was *split*:
       - Proponents of the dynamical definition saw it as "scientific."
       - Opponents favored hydrostatic equilibrium (including Pluto) or cultural/historical continuity.
       - Many astronomers reject the IAU definition entirely today.
     - **Whose Dispositions?**: KW’s community dispositions are idealized. Here, only a subset (IAU voters) decided, overriding others’ practices. This exposes a gap: when communities fracture, *which* sub-community’s dispositions fix meaning? The vote imposed a rule top-down, contrary to KW’s bottom-up "agreement in judgments."
     - **The Ceres Precedent**: Ceres was deemed a planet in 1801 but reclassified as an asteroid by 1850—not due to new facts about Ceres, but because its contextual category (the asteroid belt) emerged. This mirrors Pluto: reclassification followed *new rules* applied to unchanged objects, underscoring that meaning is practice-dependent, not fact-dependent.

  ### 3. **Does This Support or Embarrass KW?**
     - **Supports Skepticism**: The episode confirms KW’s core insight: without fixed rules, past use doesn’t dictate future applications. Pluto’s status was always indeterminate until practice settled it—first by inclusion (1930–2006), then exclusion.
     - **Embarrasses the Skeptical Solution**: The resolution wasn’t organic community agreement but contested legislation. KW assumes harmony in practices; here, imposition via vote reveals power dynamics and dissensus. The IAU’s appeal to "describing nature" (dynamical criterion) is a rhetorical move masking conventional choice—akin to KW’s "skeptical solution" itself, which posits agreement but cannot explain its genesis when conflict arises.

  ### 4. **What This Reveals: Unanticipated Complexities**
     - **Rule-Making as Political Process**: KW focuses on implicit, individual rule-following. But here, an *explicit, collective* rule-change occurred, exposing how meanings can be codified hierarchically (e.g., scientific bodies) amid dissent. The literature underplays this meta-practice: how communities *negotiate* rules when skepticism surfaces.
     - **The "Anti-Cultural" Façade**: The IAU’s rejection of the cultural option while instituting a conventional rule highlights a tension: communities often camouflage decisions as "factual" to legitimize them. This performative aspect isn’t central to KW.
     - **Temporal Fluidity**: Ceres/Pluto show that reclassification can occur decades later without object changes. KW’s "community over time" must account for shifting thresholds of consensus.

  ### Settled vs. Contested in KW Scholarship
  - **Settled**: 
    - KW argues that meaning is not fixed by facts but by communal practice.
    - Rule-following requires agreement in judgments, not private mental states.
  - **Contested** (do not present as consensus):
    - Whether Kripke’s "skeptical solution" is Wittgenstein’s view (many scholars reject Kripke’s interpretation).
    - Whether community agreement is sufficient to ground meaning (e.g., Colin McGinn’s criticism).
    - The role of objectivity: Does KW reduce truth to consensus? (Here, the IAU’s "nature" claim clashes with KW’s conventionalism.)

  ### Conclusion
  The Pluto episode is a paradigmatic case of **rule-creation amid indeterminacy**. It affirms KW’s skepticism—there was no fact of Pluto’s "planethood" to discover—but complicates the skeptical solution by showing how meaning can be imposed without consensus. The IAU’s vote exposed that communal "agreement" is often negotiated, contested, and institutional, not emergent. This reveals a gap in rule-following theories: they lack tools to analyze *how* communities resolve skepticism when dispositions diverge. The Ceres parallel confirms that categorical boundaries shift with practice, not discovery. Ultimately, the extension of "planet" was fixed not by pre-2006 facts, but by what a faction of the community *went on to do*—despite claiming otherwise.
