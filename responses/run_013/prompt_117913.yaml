  First, I need to unpack the core paradox: phase transitions are defined by non-analyticities (like divergences or discontinuities) in thermodynamic potentials, yet finite systems always have analytic partition functions. So how can real finite systems exhibit what we call phase transitions? The resolution lies in understanding what the thermodynamic limit achieves—it's not just a mathematical trick but a physical necessity for modeling sharp transitions. 

  The user asks specifically about why density must be fixed in the limit (not just volume → ∞ alone). This is crucial because scaling particle number with volume maintains physical relevance—otherwise you'd get nonsensical infinities. I should emphasise that this isn't ordinary idealisation but a controlled approximation where finite systems show "precursors" (e.g., rounded peaks in susceptibility) that sharpen catastrophically as N→∞. 

  Then there's the renormalisation group (RG) challenge: if universality depends on fixed points only defined in infinite systems, can an anti-realist about the limit still use RG? I think yes—finite RG transformations still group systems into "universality neighborhoods" showing similar critical behaviour. The fixed points are asymptotic attractors, not metaphysical requirements. 

  Now for their distinction: 
  - Asymptotic emergence: property held only by the limit (e.g., exact susceptibility divergence) 
  - Pointwise emergence: property held by each finite system but inexplicable from its micro-dynamics alone (e.g., near-universal critical exponents in large N) 

  For boiling water: the sharp phase transition is asymptotically emergent (only exact in limit), while the observable boiling event in a beaker is pointwise emergent (it happens for finite N but requires statistical concepts irreducible to particle mechanics). Susceptibility divergence is purely asymptotic; near-divergence is pointwise. 

  Universality poses an interesting twist—finite systems approximate the limit's universal behaviour, so their "near-universality" is ontologically grounded in proximity to the asymptotic fixed point. 

  Finally, for metaphysical emergence: pointwise emergence seems stronger because it's instantiated in actual systems (e.g., boiling), while asymptotic emergence is more epistemic—a tool for modelling. Realism about phase transitions is strongest when defending the physical salience of limits (e.g., correlation lengths >> system size in experiments) but weakest in claiming infinities are real. 

  The user seems well-versed but may be probing whether emergence requires infinities. I should stress that physics avoids metaphysical commitments by treating limits as physical necessities for certain phenomena—without needing actual infinities.
answer: |-
  Here’s a conceptual analysis of phase transitions, emergence, and their philosophical implications, adhering to your specifications:

  ### **The Conceptual Issue: Phase Transitions and the Thermodynamic Limit**
  In statistical mechanics, phase transitions (e.g., water boiling) are **defined by non-analyticities** in thermodynamic potentials (e.g., diverging susceptibility at the critical point). However, for any *finite* system, the partition function is analytic—no true discontinuities or divergences occur. Real systems are finite, raising a trilemma:
  1. Phase transitions are illusory in finite systems.
  2. The standard definition (non-analyticity) is flawed.
  3. Transitions are properties *only* of the infinite-volume limit.

  **Resolution and the Role of the Thermodynamic Limit**:  
  The third option is widely accepted. The thermodynamic limit (volume \(V \to \infty\), particle number \(N \to \infty\), fixed density \(N/V\)) is **not merely a calculational tool** but a *physical necessity* for modelling sharp phase transitions. Crucially:
  - **Fixed density**: Letting \(V \to \infty\) alone (without \(N \propto V\)) would yield unphysical systems (e.g., near-vacuum). Fixed density preserves intensive variables (e.g., pressure, temperature) and ensures thermodynamic stability.
  - **Why it matters**: Finite systems show "rounded" transitions (e.g., susceptibility peaks instead of divergences). The limit captures an **idealised but physically relevant singularity**, as real systems (with \(\sim 10^{23}\) particles) approximate it closely.
  - **Is it an ordinary idealisation?** No. Unlike frictionless planes, the limit explains *why* large systems exhibit sudden transitions: correlation lengths diverge at criticality, requiring \(V \to \infty\) to avoid boundary effects.

  **Renormalisation Group (RG) and Universality**:  
  RG explains universality (e.g., identical critical exponents for fluids/magnets) via fixed points in Hamiltonian space. These fixed points exist *only* in the infinite-volume limit. For someone rejecting the limit’s ontological status:
  - RG remains **practically useful**: Finite systems flow *toward* fixed points under RG, explaining "near-universality". Critical exponents in large systems converge to universal values *before* the limit is reached.
  - **Fixed points as attractors**: Universality classes are defined by the *vicinity* to a fixed point in parameter space. Finite systems approximate this, so RG doesn’t require literal infinities for applicability.

  ---

  ### **Your Distinction: Asymptotic vs. Pointwise Emergence**
  - **Asymptotically emergent**: A property holding only in the limit (e.g., exact non-analyticity).
  - **Pointwise emergent**: A property holding for each finite system but inexplicable from its micro-dynamics alone.

  **Application to Phase Transitions**:  
  1. **Boiling water**:  
     - The *sharp* phase transition (discontinuous density change) is **asymptotically emergent**. A finite beaker exhibits boiling as a rapid but smooth crossover.  
     - The observable event ("boiling" at 100°C) is **pointwise emergent**: Each finite system has a boiling point defined by collective behaviour irreducible to individual molecules.  

  2. **Susceptibility divergence**:  
     - True divergence is **asymptotically emergent** (only in limit).  
     - The peak susceptibility in finite systems is **pointwise emergent** (it exists for each but requires statistical mechanics, not particle mechanics).  

  3. **Universality**:  
     - Exact universality (identical critical exponents) is **asymptotically emergent**.  
     - Near-universality in finite systems is **pointwise emergent**: Large systems share critical exponents due to RG flow, but each system’s behaviour is derivable only from coarse-grained descriptions.  
     - **Finite systems approximate the limit**: Near-universality reflects proximity to an RG fixed point "governing" the critical behaviour of all systems in that universality class.

  ---

  ### **Metaphysical Emergence and Realism**
  - **For metaphysical emergence**: **Pointwise emergence** matters most. It asserts that novel properties (e.g., boiling) arise in *actual* finite systems and are ontologically irreducible to micro-dynamics. Asymptotic emergence risks being epistemic (a feature of models).  
  - **Realism about phase transitions**:  
    - **Strongest case**: At pointwise emergence. Large finite systems exhibit empirically sharp transitions (e.g., superconductivity) requiring emergent descriptions. The limit’s utility suggests it tracks physical reality.  
    - **Weakest case**: At asymptotic emergence. Insisting that *only* infinities have "real" transitions invites instrumentalism—finite systems merely simulate the limit.  

  **Conclusion**: Phase transitions are **real in finite systems** as pointwise emergent phenomena. The thermodynamic limit is a **physically justified idealisation** that sharpens their definition. Universality, even if limit-dependent, robustly explains why finite systems behave similarly. For metaphysics, emergence is strongest when grounded in actual systems, not idealized limits.  

  ---  
  **Key references in spirit**: Butterfield (2011) on emergence and limits; Batterman (2002) on universality; Callender (2001) on phase transitions.
