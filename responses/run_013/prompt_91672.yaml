prompt: |-
  I work on multi-agent reinforcement learning: policy gradients, self-play, equilibrium selection, correlated equilibria, and the loose way people in my field say "convention" when they mean a symmetric equilibrium in a coordination game. My field also talks about "social conventions" and "norm emergence" without, as far as I can tell, meaning by either term what a philosopher would mean. I know my vocabulary cold — it is the vocabulary I think in — and I have no philosophical training.

  I want you to translate, as faithfully as you can, David Lewis's analysis of convention into that vocabulary. As I understand it, the analysis runs roughly like this. A convention is a regularity in the behavior of the members of a group in a recurring coordination situation: everyone conforms; everyone expects everyone else to conform; everyone prefers to conform given that the others do; and the regularity is arbitrary in the sense that at least one alternative regularity would have solved the same coordination problem just as well. Common knowledge of all this is part of the account, not a psychological footnote. Conventions so understood are what let language work, since meaning rests on conventions of truthfulness and trust; and a convention is supposed to be normative — it gives the parties a reason to conform and grounds criticism of those who do not.

  Restate that in the terms I actually use: agents, policies, reward functions, best responses, equilibrium selection and symmetry breaking, training dynamics, the distribution of play across a population, precedent, correlated equilibrium, shared randomness, higher-order beliefs. Go element by element. For each piece of the Lewisian analysis, say whether it maps onto something already in my toolbox, whether it maps only after distortion, and whether it has no counterpart at all. Do not import my framework's assumptions and call the result a translation: where I say that a population has converged to an equilibrium and Lewis says that it has a convention, I want to know whether those are the same claim or two different claims that happen to cast the same behavioral shadow.

  Then give me the residue report, which is what I am actually after. Two items in particular. First, normativity: can my vocabulary say anything at all about a reason to conform, or about criticism of a deviant, or can it only describe the distribution of play? Second, common knowledge: is anything I have — correlated equilibrium, shared randomness, iterated higher-order beliefs, a common prior — doing the work Lewis asks common knowledge to do, or is that requirement simply invisible from where I sit? And if there is residue, tell me whether it is a defect of my framework or a sign that Lewis's notion was doing two jobs that were never really one — describing a behavioral pattern and licensing a normative attitude — so that my translation kept the first and had nothing left to keep of the second.

  No citations or reading list; I have no way to look anything up. Cap the whole response at 900 words, and do not pad the translation — I would rather have the residue sharp than the mapping exhaustive.
reasoning: |-
  We are translating David Lewis's analysis of convention into the multi-agent reinforcement learning (MARL) vocabulary. The key elements of Lewis's analysis:

  1. **Regularity in behavior**: A pattern of actions in a recurring coordination game.
  2. **Conformity**: Every member of the group conforms to the regularity.
  3. **Mutual expectations**: Everyone expects everyone else to conform.
  4. **Conditional preference**: Everyone prefers to conform given that others do (because it solves a coordination problem).
  5. **Arbitrariness**: There exists at least one alternative regularity that would have solved the same coordination problem equally well.
  6. **Common knowledge**: The above conditions are common knowledge in the group.
  7. **Normativity**: The convention gives a reason to conform and grounds criticism of non-conformity.

  We map these using MARL terms: agents, policies, reward functions, best responses, equilibrium selection, symmetry breaking, training dynamics, distribution of play, precedent, correlated equilibrium, shared randomness, higher-order beliefs.

  ### Element-by-element mapping:

  1. **Regularity in behavior**:
     - MARL: A stable policy profile (or a distribution over actions) that emerges in a repeated coordination game. This is the outcome of training dynamics (e.g., self-play) leading to an equilibrium. 
     - Mapping: Direct. The regularity is the equilibrium policy (or a correlated equilibrium if using a common signal). The recurring situation is the repeated game.

  2. **Conformity**:
     - MARL: All agents in the population play according to the policy (or the correlated equilibrium distribution) for that coordination game.
     - Mapping: Direct. Conformity is just the agents following the equilibrium policy.

  3. **Mutual expectations**:
     - MARL: In an equilibrium, each agent's policy is a best response to the others. This implies that each agent expects the others to play according to the equilibrium. However, note that in MARL, expectations are often encoded in the policy itself (via the value function) and are learned from experience (precedent). 
     - Mapping: Direct in equilibrium. In a Nash equilibrium (or correlated equilibrium), each agent's policy is a best response to the others, which implies that they expect the others to play as per the equilibrium. The expectation is built into the policy.

  4. **Conditional preference**:
     - MARL: The condition that conforming is a best response. That is, given the others' policies, the agent's policy maximizes its expected return. This is built into the definition of equilibrium (Nash or correlated). 
     - Mapping: Direct. The preference is captured by the reward function: the agent gets higher reward by conforming when others conform.

  5. **Arbitrariness**:
     - MARL: The coordination game has multiple symmetric equilibria (or multiple correlated equilibria). The equilibrium selection problem: which one is chosen? Symmetry breaking (e.g., via learning dynamics, shared randomness, or precedent) picks one. The fact that there is at least one alternative equilibrium that would have been equally good is built into the game structure.
     - Mapping: Direct. This is exactly the existence of multiple equilibria in the coordination game, and the selection of one via training dynamics (e.g., self-play might converge to one arbitrarily).

  6. **Common knowledge**:
     - Lewis: The above conditions (1-5) are common knowledge. That is, everyone knows them, everyone knows that everyone knows, and so on.
     - MARL: This is tricky. 
       - In a correlated equilibrium, the common signal (shared randomness) might be known to all, and the policy conditioned on it is known. But this does not necessarily imply common knowledge of the entire situation (including the arbitrariness and the conditional preferences). 
       - In a Nash equilibrium, common knowledge of rationality and the game structure is often assumed to derive the equilibrium, but in MARL, we typically do not model higher-order beliefs explicitly. 
       - Training dynamics might lead to a policy that is an equilibrium without requiring common knowledge. Precedent (repeated play) can build up mutual expectations, but it does not necessarily lead to common knowledge of the arbitrariness or the entire structure.
       - We have tools for higher-order beliefs (e.g., in epistemic game theory) but they are not central to the standard MARL training setup (like policy gradients or self-play). 
       - Mapping: Partial. The common knowledge requirement is not explicitly represented in standard MARL. We might have convergence to an equilibrium without common knowledge. However, if we assume that the training process (and the resulting policy) is public and known to all, then we might approximate common knowledge. But note: Lewis's common knowledge includes the arbitrariness and the fact that it's a convention, which is not directly captured.

  7. **Normativity**:
     - Lewis: The convention gives a reason to conform and grounds criticism of non-conformity.
     - MARL: Our framework describes behavior and incentives. We can say that an agent who deviates from the equilibrium policy will get a lower reward (if others are conforming). This is a practical reason to conform. However, the normative aspect of criticism is not directly in the vocabulary. We can model the cost of deviation (as a loss in reward) but we do not have a concept of "ought" or social criticism. 
     - Mapping: Partial. The reward function provides a self-interested reason to conform (if others are conforming) but does not by itself ground normative criticism. The criticism would be from the perspective of the system designer (who wants the agents to coordinate) or from the agents (who might blame a deviant for causing coordination failure). But this is not built into the agents' models.

  ### Residue Report:

  #### 1. Normativity:
     - **What we can say**: Our vocabulary describes the consequences of deviation: an agent who deviates from the equilibrium policy (when others are playing it) will receive a lower reward. This gives a self-interested reason to conform. We can also model the effect of one agent's deviation on others (e.g., in a coordination game, it might break coordination and lower others' rewards). 
     - **What we cannot say**: The normative force that Lewis describes goes beyond self-interest. It involves a social expectation that one ought to conform and that deviation is subject to criticism. In MARL, we don't have a built-in notion of social norms or obligations. The criticism of a deviant would be, in our terms, because they are causing a loss of reward (for themselves and others). However, the idea that the convention itself creates a normative reason (independent of the immediate reward) is not captured. For example, in a repeated game, an agent might deviate and still get away without punishment in that round, but the convention might require punishment in future rounds. This can be modeled as part of an equilibrium strategy (e.g., in a folk theorem). But the normative aspect (that the deviation is "wrong") is not in the model.

  #### 2. Common knowledge:
     - **What we have**: 
          - Correlated equilibrium uses shared randomness (a common signal) to coordinate. This requires that all agents observe the same signal and know the mapping to actions. But it does not require common knowledge of the entire game structure or the arbitrariness.
          - In self-play with policy gradients, agents might converge to a policy that is an equilibrium without explicitly representing higher-order beliefs. Precedent (the history of play) can build mutual expectations, but again, without necessarily building common knowledge beyond the first order.
          - We can model higher-order beliefs in theory (e.g., with belief hierarchies) but it is not standard in MARL algorithms.
     - **Gap**: Common knowledge in Lewis requires that everyone knows (1-5), everyone knows that everyone knows, and so on. This is not explicitly represented or required by our equilibrium concepts. For example, in a Nash equilibrium, we only require that each player knows the others' strategies (and that they are rational) but not necessarily that they know that others know, etc. 
     - **Is it doing the work?**: In practice, our training dynamics (like self-play) might lead to a situation that approximates common knowledge because the policy is learned from public experience. However, the formal requirement of common knowledge is stronger. It ensures that the convention is self-reinforcing and that everyone understands it as a convention (with its arbitrariness). Without common knowledge, we might have an equilibrium but not necessarily the shared understanding that it is a convention.

  ### Conclusion on residue:
  - **Normativity**: The residue is significant. Our vocabulary can explain why an agent should conform (because of the reward function) and the consequences of deviation, but it does not capture the social normativity (the sense of obligation and the legitimacy of criticism) that Lewis attributes to conventions. This is a defect if we want to model the full social phenomenon, but it might be acceptable if we are only interested in behavioral patterns.
  - **Common knowledge**: There is a gap. Our equilibrium concepts (even correlated equilibrium) do not require common knowledge of the entire situation. The common knowledge requirement in Lewis ensures that the convention is transparent and self-sustaining in a way that goes beyond mutual expectations. This gap might be a defect if we want to explain the stability of conventions in changing environments or when new agents join. However, in practice, our training dynamics might achieve similar stability without explicit common knowledge.

  ### Final note: 
  The residue (especially normativity) might indicate that Lewis's convention is doing two jobs: describing a behavioral pattern and establishing a normative practice. Our MARL framework captures the behavioral pattern (the equilibrium) but not the normative practice. This is not necessarily a defect of MARL; it might be that the normative aspect is outside the scope of a descriptive, behavioral science. However, if we wish to model the emergence of norms (as in "norm emergence" literature in MARL), we may need to extend our framework to include social mechanisms (like punishment or reputation) that create the normative force.
answer: |-
  ### Translation of Lewis's Analysis into MARL Vocabulary  
  **Core elements mapped element-by-element:**  

  1. **Regularity in behavior**  
     - *Lewis*: Patterned actions in a recurring coordination game.  
     - *MARL*: **Distribution of play** (e.g., policy profile $\pi$ over a population). Emerges via **training dynamics** (e.g., self-play).  
     - *Mapping*: Direct. The regularity is captured by a stable policy distribution.  

  2. **Everyone conforms**  
     - *Lewis*: Universal adherence to the pattern.  
     - *MARL*: **Convergence to a policy** (e.g., Nash/correlated equilibrium). Agents sample actions from $\pi$.  
     - *Mapping*: Direct. Conformity is equilibrium play.  

  3. **Everyone expects everyone else to conform**  
     - *Lewis*: Mutual belief in conformity.  
     - *MARL*: **Best response to $\pi$**. Agents’ policies are optimized against the empirical distribution of others’ play.  
     - *Mapping*: Direct only in equilibrium. Expectations are **implicit in the policy** (via Q-values/policy gradients), not explicit beliefs.  

  4. **Everyone prefers to conform given others do**  
     - *Lewis*: Conformity is payoff-dominant conditional on others’ actions.  
     - *MARL*: **Strict best response** in coordination games. Reward $R_i(a_i, a_{-i})$ is maximized by $\pi_i$ when others play $\pi_{-i}$.  
     - *Mapping*: Direct. Embedded in **reward functions** and equilibrium definitions.  

  5. **Arbitrariness**  
     - *Lewis*: Multiple equilibria could solve the coordination problem equally well.  
     - *MARL*: **Equilibrium selection** among symmetric/correlated equilibria. **Symmetry breaking** (e.g., via shared randomness or initial policy seeds) picks one.  
     - *Mapping*: Direct. The existence of alternatives is game-theoretic structure; selection is algorithmic.  

  6. **Common knowledge of 1–5**  
     - *Lewis*: Infinite hierarchy of mutual knowledge: "All know X, all know all know X, ..."  
     - *MARL*: **No direct counterpart**. Correlated equilibrium uses **shared randomness** (common signal) but assumes only mutual knowledge of the signal, not infinite regress. **Higher-order beliefs** are not modeled in policy updates. Training dynamics (e.g., self-play) create **precedent** (historical play) but not recursive beliefs.  
     - *Mapping*: Distorted. Shared randomness enables coordination but lacks epistemic depth. Common knowledge is *simulated* by public information (e.g., population policies) but not formally represented.  

  7. **Normativity**  
     - *Lewis*: Conventions provide *reasons* to conform and justify criticism of deviants.  
     - *MARL*: **No counterpart**. Reward functions describe *incentives* (deviants get lower $R$), but not normative "oughts." Criticism is reducible to **suboptimal rewards** (e.g., "Deviation lowers team reward"), not prescriptive obligation.  
     - *Mapping*: None. MARL is descriptive; normativity is external.  

  ---

  ### Residue Report  
  **1. Normativity**  
  - **Gap**: MARL vocabulary *cannot* express normativity.  
    - It describes **behavioral patterns** (e.g., "Deviation reduces $R$") and **equilibrium stability**, but not *reasons* or *criticism* in the Lewisian sense.  
    - Example: MARL can show a deviant’s reward drops, but not that they "should" conform or deserve blame.  
  - **Why?**: Normativity requires a *social framework* (e.g., collective intentionality) absent in MARL’s optimization paradigm. Reward functions are teleological (goal-driven), not deontic (duty-based).  

  **2. Common Knowledge**  
  - **Gap**: Lewis’s common knowledge has **no equivalent** in MARL.  
    - **Correlated equilibrium** (shared randomness) coordinates actions but assumes agents know only the *signal*, not others’ beliefs.  
    - **Higher-order beliefs** (e.g., "I believe you believe X") are unused in policy training. Dynamics rely on *observed play*, not recursive reasoning.  
  - **Why?**: Common knowledge stabilizes conventions against perturbations (e.g., new agents). MARL achieves stability via **training convergence** (e.g., policy hardening in self-play), not epistemic conditions.  

  ---

  ### Diagnosis  
  - **Normativity gap**: A **defect of your framework** for capturing *social* phenomena. MARL explains *how* conventions emerge behaviorally but not why they *bind* agents. This is why "norm emergence" in MARL feels underspecified vs. philosophy.  
  - **Common knowledge gap**: **Lewis’s notion is doing two jobs**.  
    - (1) *Coordination* (handled by MARL’s equilibria + shared randomness).  
    - (2) *Epistemic resilience* (no MARL counterpart).  
    Training dynamics replace common knowledge with **precedent** (e.g., agents learn from history, not beliefs). This suffices for behavioral convergence but not for Lewis’s full normative story.  

  **Conclusion**: Your vocabulary captures the *behavioral skeleton* of conventions (equilibria in coordination games) but not the *normative flesh* (reasons, criticism) or *epistemic depth* (common knowledge). The residue highlights a limitation of optimization-based MARL for modeling human-like sociality.
