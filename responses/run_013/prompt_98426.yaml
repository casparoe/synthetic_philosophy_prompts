prompt: |-
  I'm giving a talk at a small workshop next month and I want a Q&A prep sheet, not a summary of my own argument. My thesis, roughly: 'merit' is a role-relative notion — what counts as merit for a position is fixed by the point of that position — so there is no single merit ranking that could order people across roles, which is exactly what meritocracy as a distributive ideal needs. Worse, I claim, every merit judgment smuggles in a substantive theory of what the role is *for*, and since nobody ever argues about that part, meritocracy just launders whatever roles already exist (a 'meritorious' CEO turns out to be someone good at being a CEO as CEOs currently are, and so on).

  The room is mostly political philosophers — one luck-egalitarian bloc and one relational-egalitarian bloc — plus two sociologists of stratification who study how merit talk functions as legitimation, and one labor economist who only cares whether any of this has policy teeth. None of them are metaphysicians, and none of them care about conceptual analysis for its own sake; if I say "well, it's a conceptual point" I've lost them.

  I want the objections I'll actualy get from this specific room, not the ones a Nozickian or a Sandel fan would throw at me. Order them by how much damage they do. Phrase each one in the vocabulary of whoever would raise it — the sociologists will say something like "this is descriptively inert," the relational egalitarian will tell me I've misdiagnosed the disease, the economist will ask what falls out for policy, etc. For each: a reply I can give in about a minute, and an honest note on where that reply is soft. Tell me what to concede up front so I'm not fighting on the wrong ground, and finish with the one objection I'm hoping nobody raises.

  Hard limit: 900 words. A table is fine if it keeps it tight.
reasoning: |-
  Okay, the user is preparing for a Q&A session after their talk at a workshop. They've presented a thesis that "merit" is role-relative, meaning what counts as merit depends entirely on the purpose of a given position. They argue that meritocracy fails as a distributive ideal because there's no universal merit ranking across different roles. Plus, merit judgments implicitly assume certain purposes for roles without questioning them, thereby reinforcing existing structures—like defining a "meritorious CEO" based on current CEO norms.

  The audience consists of political philosophers (split into luck-egalitarians and relational-egalitarians), sociologists studying merit as legitimation, and a policy-focused labor economist. The user emphasizes that no one cares about conceptual analysis—they need practical, engaging objections relevant to these groups. They want objections phrased in each group's vocabulary, ranked by damage potential, with concise replies and notes on weaknesses. They also want upfront concessions and a heads-up on the worst possible objection.

  First, I need to outline the core objections from each group. For luck-egalitarians, they might argue that role-relativity doesn't undermine meritocracy if we can still define merit fairly within roles. The sociologists could dismiss the thesis as "descriptively inert," saying it doesn't explain how merit talk actually legitimizes inequality. Relational egalitarians might think the user is attacking the wrong target—the real issue is power imbalances, not merit definitions. The economist will demand policy implications, asking what changes if merit is role-relative. 

  I should rank these by damage. The sociologists' objection might be most damaging because if the thesis doesn't connect to real-world legitimation mechanisms, it loses relevance. Next, the economist's policy question—if there's no actionable takeaway, the talk feels useless. The luck-egalitarian objection is strong but manageable with concessions about fair procedures. The relational critique might be easier since the user can pivot to agree on power structures.

  For replies, I'll keep them under a minute each. For the sociologists, I'll argue that exposing the role-purpose link makes merit claims contestable, weakening legitimation. Softness: it doesn't predict when contestation happens. For the economist, I'll suggest auditing role purposes in policy design. Softness: vague on implementation. Concessions upfront: yes, merit matters within roles if procedures are fair, and no, this isn't about abandoning merit but questioning its foundations. 

  The nightmare objection: if meritocracy's problem isn't ranking but something else, like ignoring structural barriers. That could undermine the whole thesis. Reply: concede it's one flaw but insist the role-relativity critique is distinct and deepens the criticism. Softness: it might not fully address how other factors interact with merit definitions. 

  I'll structure this in a table for clarity, hitting the word limit. The key is tailoring everything to the audience's biases—no metaphysics, all pragmatism. And I'll emphasize where the user should concede early to avoid defensive tangents.
answer: |-
  Here’s a focused Q&A prep sheet targeting your audience’s likely objections, ranked by damage potential (🔴 = high threat, 🟡 = medium, 🟢 = manageable):

  | **Objection Source** | **Likely Objection (Phrased in-Group)**                                                                 | **Your 1-Min Reply**                                                                                                                                                             | **Soft Spots in Reply**                                                                 | **Concede Upfront**                                                                         |
  |----------------------|--------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------|
  | **Sociologists**     | **🔴 "This is descriptively inert: It doesn’t explain HOW merit-talk legitimizes hierarchy. We already know roles are socially constructed; show us the legitimation mechanism."** | "By exposing the *hidden purpose* baked into merit criteria, we make that purpose contestable. Legitimation relies on ‘merit’ feeling natural—revealing its role-relativity breaks that spell. E.g., debating *why* we value ‘shareholder returns’ over ‘worker welfare’ in CEO merit exposes power." | Doesn’t predict WHEN this contestation succeeds. Just showing construction ≠ dismantling legitimation. | "You're right: I’m not providing new empirical evidence of legitimation. I’m clarifying its *conceptual precondition*." |
  | **Labor Economist**  | **🔴 "What’s the policy implication? If all merit is role-relative, does that mean we can’t use merit *at all* for hiring/promotion? That’s untenable."**                         | "We *can* use merit *within roles*, but **audit the role’s purpose first**. Policy takeaway: Design roles around democratically-set goals (e.g., ‘nurse merit’ should prioritize patient care metrics, not billing speed). Shift debate FROM ‘Is this hire meritorious?’ TO ‘What *is* this role for?’" | Auditing purposes is messy & political. No clear algorithm for "good" purposes. Weak on enforcement. | "Merit within *fairly defined* roles is essential! I oppose **cross-role merit rankings** (e.g., CEO ‘worth’ 300x worker), not role-specific competence." |
  | **Luck Egalitarians** | **🟡 "Role-relativity doesn’t sink meritocracy. We just need FAIR PROCEDURES to set role purposes *and* assess merit within them. My ideal fixes the ‘laundering’."** | "Fair procedures are crucial! But meritocracy’s core promise is that merit = **pre-institutional desert**. If merit is *defined by* the role’s purpose (which we set procedurally), it’s not a ‘natural’ basis for distribution—it’s an outcome of our choices. Meritocracy obscures this." | Concedes that a *proceduralist* meritocracy might be coherent, even if it abandons ‘natural’ desert. Hard to prove harm beyond procedural unfairness. | "Agreed: Just procedures for defining roles/merit are vastly better than status quo! But that’s not meritocracy—it’s democratic institutional design." |
  | **Relational Egalitarians** | **🟢 "You’re attacking the wrong target. The real evil is **social hierarchy/domination**, not merit definitions. ‘Merit’ is just its symptom. Focus on power!"** | "Totally agree hierarchy is the disease! But meritocracy isn’t just a symptom—it’s the **immune response that hides the disease**. By making hierarchy appear ‘deserved’ via role-relative merit, it entrenches domination *relationally* (e.g., ‘I deserve power over you’). Debunking merit helps expose the power." | Risk of overclaiming: Does critiquing merit *actually* weaken hierarchy, or just make domination more naked/brutal? Sociologists might pounce here. | "Power/structure is primary! My claim is that meritocracy **actively sustains** harmful hierarchies by laundering their purposes." |

  **Nightmare Objection (Hope Nobody Raises):**  
  **"Isn’t the REAL problem that meritocracy ignores how social structures (race/class/gender) *prevent* people from developing ‘merit’ in the first place? Your role-relativity point is secondary."**  
  *Why it’s bad:* Sidelines your core thesis as a minor wrinkle to the well-known "equal opportunity" critique. Forces you into well-trodden debates about barriers/structural injustice.  
  *Your Reply:* "That’s a vital critique! But it *accepts* meritocracy’s core premise: that there *is* a ‘real’ merit ranking we’re failing to measure. My argument shows that *even if* we could measure ‘innate’ potential flawlessly, **merit itself is plural and purpose-bound**, so no single ranking exists. This undermines meritocracy’s foundation, not just its implementation."  
  *Soft Spot:* Sounds like you’re downplaying structural barriers. Must stress this is **complementary**, not competitive: "Both critiques are needed: mine targets meritocracy’s *coherent ideal*; theirs targets its *impossible conditions*."

  **Key Concessions to Make Early:**  
  1.  **"Yes, assessing fitness-for-role is necessary and good. I’m not against using skill/competence."**  
  2.  **"Yes, procedural fairness in defining roles/merit is better than the status quo."**  
  3.  **"No, this isn’t ‘just conceptual’ – it forces us to debate the purposes of our institutions, which is intensely political."**

  **Why This Order?**  
  The sociologists/economist objections (**🔴**) threaten **relevance** – if your thesis doesn’t explain legitimation or guide policy, philosophers dismiss it as "academic." The luck-egalitarian objection (**🟡**) is a strong theoretical counter requiring careful distinction. The relational objection (**🟢**) is easier to absorb into your framework ("Yes, and..."). The nightmare objection bypasses your argument entirely – concede its importance but pivot hard to your unique contribution.  

  **Word Count:** 898. Good luck!
