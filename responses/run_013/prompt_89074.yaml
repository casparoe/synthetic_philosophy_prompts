  You are a philosopher of science and epistemologist whose work spans Bayesian confirmation theory, the statistics of non-significant findings, and the social epistemology of conspiracy theorizing. Please think carefully and work through this rather than reaching for the standard textbook framing, and begin by brainstorming the distinct readings available before you commit to any verdicts.

  Some context. I have been reading rationalist blogs and their comment threads for the better part of two decades, and there is one move I keep running into. Someone makes a specific factual claim — usually in a thread about whether an institution covered something up, though the same move turns up in arguments about unobserved entities, destroyed records, and unregistered side effects — and the objection comes back that absence of evidence is not evidence of absence. In the thread I have in mind it arrived in the stronger form of telling the person who wanted evidence that they were demanding a proof of a negative, and it was used to close the discussion: on that view, no amount of missing evidence could count against the claim under dispute. I suspect the saying is doing several quite different jobs under one roof, and I want the roofs separated.

  What I would like is a menu of the precise theses that sentence could be asserting, ordered roughly from the trivial to the radical, with a verdict on each — platitude, substantive and defensible, substantive but false, or self-sealing — and, wherever a thesis is defensible, a statement of the conditions under which it holds. I am particularly keen to have the statistical reading (something about failing to reject a null hypothesis) kept apart from the epistemological one, and both kept apart from the reading on which the saying is a claim about the diagnosticity of the search that was actually conducted. That last case is where I get confused: when the hypothesis under discussion itself predicts that evidence will be scarce, sealed, or actively suppressed, is the missing evidence still merely uninformative, or can it be recycled as positive evidence for the very hypothesis it was supposed to test?

  Concretely, please address the following. First, what does evidence have to mean for the saying to be either true or false — a likelihood ratio, a subjective increment in confidence, a reason to believe? Second, can the absence of evidence ever be evidence of absence, and if so, what must be true of the possible observations for it to be — I am interested in the requirement that a search have had the power to turn something up if it were there, and in what happens when the space of alternatives is left unspecified so that the catch-all can be stretched to accommodate any observation whatsoever. Third, how does the burden of proof shift when the saying is invoked, and does the radical reading really license the conversational move of declaring the question closed? Fourth, which single reading was the person in my thread most likely relying on, and was that a reading the saying can support or one it quietly smuggles in?

  Please format the answer as a numbered list of readings, each with a one-line statement of the thesis, a verdict, and a short paragraph of support, followed by a closing section on which readings would actually do the argumentative work in the exchange I described. No citations or reading lists, please — I want the distinctions and the verdicts.
