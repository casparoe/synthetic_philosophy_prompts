  Below is a concise, user-friendly quiz designed to help readers self-diagnose their underlying theory of slurs without relying on technical jargon. Each question presents a concrete case or claim, with answer options that force distinctions between major theories. The scoring key maps answer combinations to named theories (or clear descriptions where no standard name exists).  

  ### **The Quiz: What's Your Theory of Slurs?**  
  For each question, select the option that best matches your intuition.  

  1. **Neutral Swap Test**  
     *Statement: "Sam is a [slur]." (Sam is a member of the group targeted by the slur).*  
     If we replace the slur with a neutral phrase like "a person of that descent," does the truth value of the statement change?  
     - (A) **Yes** – The slur adds something essential that affects truth.  
     - (B) **No** – The core meaning is the same; the slur just adds offensiveness.  

  2. **False Implication Test**  
     *Statement: "Sam is a [slur]." (Sam is a member of the group but lacks negative traits associated with the slur, e.g., he’s not "lazy" or "dangerous").*  
     Is this statement true?  
     - (A) **No** – The slur implies negative traits that aren’t true of Sam.  
     - (B) **Yes** – The slur only refers to group membership, and Sam is a member.  

  3. **Negation Test**  
     *Statement: "Sam is not a [slur]." (Sam is a member of the group).*  
     Is this statement offensive?  
     - (A) **Yes** – The slur’s offensiveness is still present.  
     - (B) **No** – Denying the slur avoids the harm.  

  4. **Conditional Test**  
     *Statement: "If Sam is a [slur], then he’ll understand the joke."*  
     Is this statement offensive?  
     - (A) **Yes** – The slur is offensive regardless of context.  
     - (B) **No** – The conditional ("if...") neutralizes the offensiveness.  

  5. **Question Test**  
     *Statement: "Is Sam a [slur]?" (asked neutrally, no prior context).*  
     Is this question offensive?  
     - (A) **Yes** – Merely using the slur is harmful.  
     - (B) **No** – Questions don’t assert anything, so it’s not offensive.  

  6. **Reclamation Test**  
     *Scenario: A member of the targeted group says to a friend: "What’s up, my [slur]?" (used affectionately).*  
     Is the slur still offensive here?  
     - (A) **Yes** – The word itself is inherently derogatory.  
     - (B) **No** – Context or intent can remove the offensiveness.  

  7. **Academic Test**  
     *Scenario: A linguist says in a lecture: "The word [slur] emerged in the 19th century as a slur for Group Y."*  
     Is this use offensive?  
     - (A) **Yes** – The word is toxic and should never be spoken.  
     - (B) **No** – Clinical contexts neutralize its harm.  

  8. **Truth Test**  
     *Statement: "Sam is a [slur]." (Sam is a member of the group).*  
     Can this statement be true or false?  
     - (A) **Yes** – It’s a factual claim (even if offensive).  
     - (B) **No** – It’s not describing facts; it’s doing something else (e.g., expressing hate).  

  ---

  ### **Scoring Key**  
  Tally your answers and match the pattern to the theories below. Each theory corresponds to a unique combination of answers. Positions are pulled apart cleanly: disagreements arise on at least 2–3 questions.  

  | **Your Pattern** | **Theory** | **What You Believe** |
  |------------------|------------|----------------------|
  | **Mostly A's**<br>(Especially Q1A, Q2A) | **Semantic Incorporation** | The derogation is baked into the literal meaning. Swapping a slur for a neutral phrase *changes* truth conditions (e.g., "Sam is a [slur]" means "Sam is a member of Group Y *and is despicable*"). Offensiveness never disappears, even in reclamation or academia (Q6A, Q7A). |
  | **B on Q1–2, A on Q3–7, A on Q8** | **Presupposition/Conventional Implicature** | The derogation is a conventional aside (not part of truth conditions) that "projects" everywhere. Neutral swaps don’t affect truth (Q1B, Q2B), but offensiveness survives embedding (Q3–5A) and can’t be neutralized (Q6A, Q7A). Statements are truth-apt (Q8A). |
  | **B on Q1–2, A on Q3–7, B on Q8** | **Expressivism** | Slurs express attitudes, not facts. The statement isn’t truth-apt (Q8B) – it’s like shouting "Boo!" Swaps don’t change truth conditions (Q1B, Q2B), but offensiveness is inescapable (Q3–7A). |
  | **B on Q1–2, A on Q3–5, B on Q6–7, A on Q8** | **Prohibitionism** | Slurs aren’t semantically special – they’re just taboo words. Offensiveness comes from social prohibition, not meaning. Neutral swaps don’t change truth (Q1B, Q2B), and prohibition can be lifted in context (reclamation: Q6B; academia: Q7B). Statements are truth-apt (Q8A). |
  | **B on Q1–2, A on Q3–5, B on Q6–7, B on Q8** | **Performative** | Using a slur is an *act of subordination* (like punching someone), not a description. It’s not truth-apt (Q8B). Offensiveness depends on the act: it persists in embeddings (Q3–5A) but vanishes when the act isn’t performed (reclamation: Q6B; academia: Q7B). |
  | **B on Q1–2, B on Q3–5, B on Q6–7, A on Q8** | **Contextualism** | Derogation is 100% context-dependent. Offensiveness disappears if the context doesn’t support it (negation: Q3B; conditionals: Q4B; questions: Q5B; reclamation: Q6B; academia: Q7B). Truth conditions match neutral phrases (Q1B, Q2B, Q8A). |

  ---

  ### **Key Distinctions & Why They Matter**  
  - **Theories cleanly separated**: No two theories share the same answer pattern. Each has a unique "fingerprint" (e.g., only **Semantic Incorporation** says swapping a slur changes truth conditions; only **Prohibitionism** and **Performative** allow neutralization in reclamation/academia; only **Expressivism** and **Performative** deny truth-aptness).  
  - **"Collapsed" views**:  
    - *Presupposition* and *Conventional Implicature* are merged. They diverge only on technical details (e.g., whether offensiveness is cancellable), which this quiz doesn’t test. To split them, we’d need a case testing cancellability (e.g., "Sam is a [slur], but I don’t mean it negatively").  
    - "Never offensive" views (like radical reclamation) are covered under **Prohibitionism**/**Performative** (Q6–7B).  
  - **Incoherent/unattractive combinations**:  
    - Q1A + Q2B: Claims slurs change truth conditions in basic assertions (Q1A) but not when implying false traits (Q2B). Unstable – no one defends this.  
    - Q3B + Q4A/Q5A: Says negation neutralizes offensiveness (Q3B) but conditionals/questions don’t (Q4A/Q5A). Incoherent – embeddings behave similarly across theories.  
  - **Why context isn’t king**: These theories *disagree* on whether offensiveness *can* be neutralized by context (Q6–7), or whether it survives embedding (Q3–5). This is the core debate!  

