prompt: |-
  OK so here's a thing that's bugged me for a while. In federal perjury law, the rule is basically that a witness can only be nailed if what he actually said was false. If the answer is literally true but he's clearly trying to mislead the questioner -- giving a non-answer, talking about the company's account when he was asked about his own, that kind of thing -- it's not perjury. That's the holding in Bronston v. United States, 1973, unanimous Supreme Court, and it's still the standard. The reasoning is that it's the questioner's job to ask better follow-ups.

  But then you look at consumer protection and securities law and the whole attitude flips. The FTC will come after an ad that's literally true but likely to mislead, and the SEC treats a literally true statement that leaves out a material fact as fraud. Nobody over there says "well, technically the words were accurate, so we're done here." Same country, same underlying idea that you shouldn't be able to deceive people under oath or in a prospectus, but a totally different answer to wether misleading-without-saying-anything-false is the thing we actually care about.

  So what does the perjury rule presuppose about the moral difference between lying and misleading? My hunch is it has to rest on some view that the wrong of lying lives in the falsity of what you assert, not in the deception you intend or the false impression you create -- but spell that out properly and tell me whether that's really what the rule commits to, or whether there's some other story that explains it just as well. Does it need a sharp line between asserting and merely implying, and does it need that line to be morally load-bearing, or is it really just administrative convenience (intent is hard to prove, juries get confused)? And is it consistent with the securities/FTC side, or are we just running two different theories of deception depending on which agency you're standing in front of? If the perjury rule does presuppose a "misleading isn't lying" view, what would have to change about how depositions and cross-examination work if we dropped it -- or is the literal-truth rule fine on either theory?

  Please answer in American English. Don't worry about citing cases or giving me a reading list, I just want the argument.
reasoning: |-
  Okay, let me tackle this user's question about the moral and legal distinctions between lying and misleading in perjury versus consumer protection/securities law. 

  The user clearly has deep legal knowledge - they're citing Bronston and contrasting it with FTC/SEC practices. Their core puzzle is philosophical: why does the legal system treat "literal truth" as sacrosanct in perjury but not elsewhere when deception occurs?

  Hmm... they're really asking three layered questions: (1) What moral theory underpins Bronston's literal truth rule? (2) Is this consistent with other areas of law? (3) Could practical concerns explain the divergence?

  First, the perjury angle. Bronston's logic feels almost linguistic - perjury requires a false "statement," not just a false impression. That draws a bright line at assertion versus implication. But morally... is the Court saying deception via implication is less bad? Not necessarily. The opinion emphasizes the adversarial system's mechanics - lawyers can clarify ambiguous answers. So maybe it's more about allocating responsibility than moral judgment.

  Now the consumer protection contrast jumps out. When the FTC slaps down a "technically true" ad, they're prioritizing audience perception. Grandma sees "prevents cavities" on sugar gum doesn't parse the tiny print saying "when used with brushing." Different context: vulnerable consumers vs. lawyers who should know better.

  Practical pressures matter too. Imagine perjury cases turning on "what impression did the witness create?" - it'd be he-said-she-said chaos. But for securities fraud, omission cases have clearer standards (materiality, duty to disclose). So maybe it's not hypocrisy but calibrated rules for different contexts.

  The user's hunch about assertion being key hits home. Bronston does treat the act of false assertion as the sin. But I wonder - if we ditched that rule, would depositions become endless clarification sessions? There's efficiency in letting lawyers bear some burden.

  Ultimately, the divergence isn't about morality but institutional design. Perjury law trusts the adversarial process; consumer protection assumes information asymmetry. Both care about deception but manage it through different tools. The literal truth rule isn't morally necessary - we could theoretically punish misleading implications under oath - but it serves a functional purpose in that specific arena.
answer: |-
  You're hitting on a fascinating tension in American law, and your hunch about the moral underpinning of the perjury rule is largely correct. Here's the breakdown:

  1.  **The Perjury Rule's Core Presupposition: The Primacy of the Asserted Statement**
      *   **Bronston's Foundation:** The perjury rule, as solidified in *Bronston*, fundamentally presupposes that **the wrong of perjury lies *solely* in making a false *assertion* under oath.** It draws a sharp, morally load-bearing line between *asserting a falsehood* and *creating a false impression* through implication, evasion, or non-answer.
      *   **Moral Distinction:** It implicitly treats the act of *asserting* a known falsehood as a distinct and more culpable moral wrong than *allowing* someone to be deceived through ambiguity or implication. The witness's *intent* to mislead, while relevant to their character, isn't sufficient for the *crime* of perjury if they didn't actually utter a false statement. The moral gravity is placed on the lie itself, not the resulting deception.
      *   **Linguistic Focus:** It requires parsing the *literal meaning* of the specific words spoken in response to the specific question asked. Did the words *themselves*, in their most direct interpretation, state something factually untrue? If not, no perjury, regardless of the misleading impression left.

  2.  **The "Why": Administrative Necessity Trumps Perfect Justice (The Practical Justification)**
      *   While *Bronston* uses moral-sounding language about "the questioner's duty," the *stronger* justification, and the one that explains its persistence, is **practicality and institutional design of the adversarial system**:
          *   **Bright Line Rule:** Perjury prosecutions require proof *beyond a reasonable doubt*. Proving subjective *intent* to mislead through implication or non-answer is inherently messy and subjective. A literal truth rule provides a clear, objective standard for courts and juries.
          *   **Burden Allocation:** The adversarial system assumes skilled advocates on both sides. The rule places the burden on the *questioner* (the lawyer) to pin the witness down with precise, unambiguous questions and follow-ups. It incentivizes good lawyering.
          *   **Avoiding Chilling Effect:** A broader rule punishing misleading impressions could deter witnesses from testifying altogether for fear of unintentionally creating a false impression or being ensnared by a clever prosecutor twisting their words.
          *   **Protecting Witnesses:** It provides some shield for witnesses against overly aggressive or ambiguous questioning tactics. They can rely on the literal meaning of their words.
      *   **Is the Moral Distinction Necessary?** Not really. You *could* theoretically have a perjury law that punished intentionally creating a materially false impression under oath, even without a literally false statement. The rule *does* presuppose that distinction *is* significant, but the *dominant* reason for its existence is the practical need for a workable, objective rule in the high-stakes, proof-intensive context of criminal perjury prosecutions within an adversarial system.

  3.  **The Securities/FTC Contrast: Protecting Vulnerable Audiences & Information Asymmetry**
      *   **Different Goals & Contexts:** Consumer protection (FTC) and securities regulation (SEC) operate in fundamentally different contexts than a courtroom deposition or trial.
          *   **Vulnerable Audiences:** Consumers and investors are presumed to be less sophisticated, have less access to information, and be more susceptible to deception through implication, omission, or half-truths.
          *   **Information Asymmetry:** Sellers (advertisers, issuers) inherently know more about their product/security than buyers. The law imposes affirmative duties to disclose material information to level the playing field.
          *   **Preventing Harm & Market Integrity:** The focus is on preventing economic harm and maintaining fair and efficient markets. This requires a standard that looks at the *overall impression* on the *reasonable member of the target audience*, not just the literal truth of isolated statements.
          *   **Regulatory/Civil Focus:** Enforcement is often civil or administrative, with a lower burden of proof (preponderance of the evidence) than criminal perjury. Proving intent or materiality of omission/misleadingness, while still challenging, is more feasible here than "beyond reasonable doubt" for a misleading implication under oath.
      *   **The Moral Core Here:** These areas prioritize the *deceptive outcome* and the *duty* of the speaker over the purely linguistic form. The wrong is seen as the *deception itself* and the *breach of trust* or *duty to disclose*, regardless of whether it was achieved by a direct lie or a misleading truth/omission.

  4.  **Are They Consistent? Running Different Theories?**
      *   **Fundamentally Inconsistent Philosophies:** Yes, at their core, they reflect different underlying theories of deception:
          *   **Perjury (Bronston):** Deception is only legally culpable if achieved by a literally false *assertion*. Intent to mislead via other means is not punishable *as perjury*; the remedy is better questioning.
          *   **Securities/FTC:** Deception achieved by literally true statements that create a false impression or omit material facts *is* legally culpable as fraud or deception. The focus is on the effect and the speaker's duty/context.
      *   **Context Explains the Inconsistency:** The inconsistency is tolerated because the contexts are so different:
          *   **Courtroom:** Controlled environment, oath, skilled adversaries, high burden of proof, criminal sanctions. Emphasis on precise language and witness protection via a bright-line rule.
          *   **Marketplace/Advertising:** Uncontrolled environment, vulnerable parties, inherent information asymmetry, lower burden of proof (often), civil/regulatory sanctions. Emphasis on fair dealing and preventing harm via a more holistic "consumer/investor impression" standard.

  5.  **What If We Changed Perjury?**
      *   **Dropping the Literal Truth Rule:** If perjury law shifted to punish intentionally creating a materially false impression (even with literally true statements), depositions and trials would change dramatically:
          *   **Endless Clarification:** Questioning would become excruciatingly detailed. Every ambiguous answer *would* require exhaustive follow-up to eliminate *any* potential misleading implication. Testimony would slow to a crawl.
          *   **Witness Intimidation:** Prosecutors could more easily threaten perjury charges based on interpretations of implication, chilling testimony.
          *   **Jury Confusion & Subjectivity:** Trials would become battles over "what impression did the witness *really* create?" – highly subjective and difficult for juries to resolve beyond a reasonable doubt.
          *   **More Perjury Prosecutions (and Defenses):** More borderline cases would go to trial, increasing litigation costs and potentially convictions based on ambiguous testimony rather than clear lies.
      *   **Is the Current Rule "Fine"?** On balance, the legal system has decided that the literal truth rule, despite allowing some evasions, is the lesser evil. It provides necessary protection for witnesses, maintains a manageable bright-line standard for criminal liability, and leverages the adversarial system (forcing lawyers to ask good questions) as the primary tool to combat evasion. It prioritizes procedural fairness and clarity in the high-stakes criminal context, even if it means some deceptive witnesses escape perjury charges. The FTC/SEC approach addresses deception in contexts where those procedural safeguards aren't present and the potential for widespread harm is greater.

  **In essence:** The perjury rule *does* presuppose that the core moral and legal wrong is the *false assertion*, not the deceptive intent or impression. However, its persistence is less about a deep philosophical commitment to that distinction being the *only* morally relevant one, and more about the *practical necessity* of having a clear, objective, workable rule for criminal liability in the specific, adversarial context of sworn testimony. The FTC/SEC rules reflect a different practical reality and prioritize preventing harmful deception in contexts with vulnerable audiences and information asymmetry, using a broader, effects-based standard appropriate for their regulatory goals and lower burdens of proof. We are indeed running two different, context-dependent theories of what constitutes punishable deception.
