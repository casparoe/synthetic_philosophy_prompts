  I'm in a reading group on imprecise probabilities and I need an actual number out of you, not a tour of the literature. Here's the claim I want your credence in: that there are situations where a rational agent's doxastic state is genuinely set-valued at the first order — her credence in some proposition P is best represented by an interval or a set of numbers, and this is not just a single probability distribution over some unknown parameter or "objective chance." So not "she's unsure which single probability is right"; rather "theres no single number, and no higher-order distribution she's rationally required to collapse to."

  The case I keep chewing on: an urn I know nothing about (red/black, fixed but unknown proportion) vs. an urn whose 100 balls were each put in by a fair coin flip. In the second I feel like my credence in red on the next draw is just a sharp 0.5, no interval needed — the symmetry does the work. In the first, the imprecise-probability people say my credence is the whole interval [0,1], and that refusing both "pay $1 if red, costs 50 cents" and "pay $1 if black, costs 50 cents" is coherent. A plain Bayesian says refusing both is incoherent, since P(red) and P(black) have to sum to 1. So it all seems to hang on whether "no known chance process" is the same thing as "no fact of the matter."

  Give me your credence in the claim. Decompose it: (a) how likely that refusing both bets is actually rational rather than a documented bias; (b) given that it's rational, how likely that set-valued credence is what does the explaining, rather than a single credence plus an ambiguity-averse utility function; (c) how likely that hierarchical / second-order Bayesianism can always mimic credal sets, making this a verbal dispute; (d) how likely that IP's decision rules (maximin-style "best worst case", or "not beaten across the whole set") survive the standard objections — that they make you dynamically inconsistent, or that learning something irrelevant can widen your interval instead of narrowing it; (e) whatever else you think belongs. Number plus a line for each, then the combination, then say which term the number actually rides on and what single piece of evidence or argument would move it most. For reference I'm at about 0.55 and my officemate is at like 0.15, so Id also like to know where you think the real fault line between us is. American English please.
