  ## THE CARRYING RADIUS: How the Cost of Moving Stuff Versus Moving Thought Shaped Humanity from Mud Huts to Metaverses  
  **By Dr. Everett P. Wexler**  
  *Professor Emeritus of Applied Archaeometrics, Dunsmore College*

  **Jacket Copy:**  
  For too long, historians have been lost in the thickets of kings, battles, and ideologies. Economist-turned-archaeologist Dr. Everett P. Wexler cuts through the noise with a single, revolutionary metric: **The Carrying Radius (R<sub>c</sub>)**. Defined as the ratio of the cost to move a bushel of grain one mile (C<sub>g</sub>) to the cost of moving one bit of information one mile (C<sub>i</sub>), R<sub>c</sub> is the Rosetta Stone of human advancement. When R<sub>c</sub> is high, grain moves cheaply relative to ideas, anchoring people to the land and fostering empires built on surplus. When R<sub>c</sub> plummets, information flows freely, shattering old hierarchies and igniting revolutions of the mind. From the first cultivated wheat stalk in the Fertile Crescent to the instantaneous global transmission of a viral meme, Wexler demonstrates with rigorous, data-driven clarity how the relentless, asynchronous decline of C<sub>g</sub> and C<sub>i</sub> dictates the rise of farming, cities, monotheism, the printing press, the steam engine, and the digital age. *The Carrying Radius* is not just history; it is the fundamental physics of human society. Prepare to see your world—and your smartphone—in an utterly new light.

  **Praise for THE CARRYING RADIUS:**  
  *“Wexler’s Ratio (R<sub>c</sub>) provides the elegant, unifying principle social science has desperately needed. It renders centuries of historical debate obsolete with the simplicity of a physics equation. A monumental achievement.”*  
  — **Dr. Aris Thorne**, Nobel Laureate in Economic Sciences, Sterling Professor Emeritus, M.I.T.

  *“Finally, a framework that explains why my company’s fiber-optic network is more important than the Roman roads. Wexler gets it: bandwidth is destiny.”*  
  — **Jax Sterling**, Founder & CEO, OmniStream Networks

  ---

  **Chapter One: The Fulcrum of Mud and Mind**

  The year is approximately 9500 BCE. A human kneels in the mud beside the sluggish Euphrates. In her hand, a tough wild grass stem. She is about to commit humanity’s decisive act, not through conscious design, but as an inevitable response to the inescapable logic of The Carrying Radius. For millennia, R<sub>c</sub> had been astronomically high. Moving *anything*, especially the heavy, bulky calories represented by gathered seeds or hunted game (C<sub>g</sub>), was prohibitively costly in terms of time and energy. Moving *ideas*—about flint knapping, berry locations, or spirit worlds—was relatively cheaper (C<sub>i</sub>), diffusing slowly but steadily through speech and gesture across kin groups. This low-R<sub>c</sub> world favoured mobile bands, egalitarian but constrained. Information flowed locally; material goods barely flowed at all.

  Then, the fulcrum shifted. Crucially—and this is why the Fertile Crescent, not the lush valleys of New Guinea or the fertile plains of the Americas, birthed agriculture *first*—a unique constellation of easily domesticable grasses (emmer wheat, barley) and large mammals (sheep, goats, cattle) existed within a compact, ecologically diverse zone.[^1] The initial, accidental selection of plumper, non-shattering wheat heads (Site Gamma-7, Tell Abu Hureyra sediments, Layer Epsilon) represented a marginal decrease in *local* C<sub>g</sub>. Harvesting calories near a fixed point became slightly more efficient than chasing them across vast territories. Crucially, C<sub>i</sub> remained constant—knowledge of planting techniques spread slowly, person-to-person.

  The implications were profound, driven solely by R<sub>c</sub>. As surplus grain accumulated (lowered C<sub>g</sub> at point of origin), the cost of *storing* it became the new limiting factor. Granaries appeared (Site Theta-2, Catalhoyuk Sector 4), representing fixed nodes. Protecting these nodes demanded social innovation: hierarchies, specialization, rudimentary administration—information about stores and obligations. C<sub>i</sub> *had* to increase locally to manage the lowered C<sub>g</sub> bounty. Villages coalesced. Yet, moving the *grain itself* beyond the village boundary remained costly. R<sub>c</sub>, while falling slightly due to local grain abundance, was still high enough to constrain the geographic scale of society. The carrying radius of authority, defined by how far grain could be viably transported to feed non-producers (soldiers, priests, chiefs), was perhaps five miles, as evidenced by the uniform drop-off in standardized pottery types beyond this distance from primary granary sites like Jericho Alpha (see **Figure 1: Estimated Grain Transport Cost (C<sub>g</sub>) vs. Distance from Central Granary, Fertile Crescent Proto-Sites c. 8000 BCE**).

  [**Figure 1 Description:** *A simple line graph. The Y-axis is "Cost (C<sub>g</sub>) in Arbitrary Labor Units". The X-axis is "Distance from Granary (Miles)". A steep, solid red curve starts high on the Y-axis (approx. 50 units) at 0 miles and rises almost vertically, reaching an asymptote near 150 units by 5 miles. A dotted horizontal line labeled "Subsistence Threshold (C<sub>g</sub> = 30 Units)" sits low on the Y-axis. The area under the curve below 5 miles is shaded light green, labeled "Viable Control Radius".*]

  This high-R<sub>c</sub> equilibrium defined the early Neolithic. Grain was king because moving it was hard; ideas were secondary because moving them was relatively easy but lacked scalable impact without the material surplus. The stage was set for the next great shift: technologies that would systematically attack C<sub>g</sub> on a larger scale—the wheel, the sail, the paved road. Each innovation lowered C<sub>g</sub>, increasing R<sub>c</sub> further (grain movement becoming cheaper *relative* to information movement), enabling larger surpluses, larger concentrations of people, larger administrative burdens, and ultimately, empires whose boundaries were drawn by the maximum distance a loaded ox-cart could travel before consuming its own cargo. The imperative was always material consolidation. Yet, lurking on the horizon was the countervailing force: the moment when C<sub>i</sub>’s decline would begin its own, world-shattering acceleration. For today, we stand at the terminus of that second, steeper curve. Our smartphones are not mere gadgets; they are the manifestation of C<sub>i</sub> approaching zero, collapsing R<sub>c</sub> towards an asymptotic flatline. The empires built on grain are dissolving, replaced by networks built on pure thought. Understanding this ratio isn't just academic; it is the key to navigating the profound instability—and opportunity—of an era where information finally moves faster, and cheaper, than dirt.

  [^1]: Wexler, E.P. (Forthcoming). *Bio-Geographic Determinants of Initial C<sub>g</sub> Reduction: A Re-Analysis of Fertile Crescent Domesticates*. *Journal of Applied Historical Econometrics*, 15(3).
