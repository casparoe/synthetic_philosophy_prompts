prompt: |-
  ok so I've been trying to sort out how I feel about taking other people's word for aesthetic things, and I've got a pile of gut verdicts that I suspect don't all hang together. hoping you can tell me what principle, if any, they add up to.

  - A friend whose taste I trust says a new restaurant is great. I've never eaten there. I think it's completely fine for me to believe her, and to say, if someone asks, that it's a good restaurant.
  - Same friend says a film is great. Also fine. I believe it, I put it on the list, I tell other people it's supposed to be great.
  - A sommelier tells me the Barolo is better than the Chianti and I've tasted neither. I just believe the Barolo is the better wine. No problem.
  - But: someone tells me a painting is beautiful, and I've never laid eyes on it and probably never will. I think I can believe it's famous, or that people find it beautiful, but I don't think I can believe it's beautiful, and I sure can't say it's beautiful myself. That feels different from the wine, and I can't articulate why.
  - Someone tells me a novel's last chapter reveals the narrator was lying the whole time. I believe that instantly, and it changes how I'd judge the book once I read it. Fine.
  - A friend says a certain piece of music is devastating, makes her cry every time. I believe the music is devastating — devastating to her, devastating to most people who sit with it. But I don't feel like I've learned that the music is sad the way I'd learn it by actually hearing it. Though now I wonder if that's just the painting case again.
  - A dance critic whose technical eye I trust says a performance was superb in its phrasing and balance, though I sat there bored stiff. I take the technical verdict on board. I don't take on board the unspoken "so you should have loved it."
  - Here's the one I keep flip-flopping on. An old friend and I have nearly identical taste in poetry. She texts me a poem and says I'll love it. Do I know the poem is good before I read it? My gut says I know I'll love it — that's a prediction — but I don't know it's good, that's a judgement, and judgements need me and the poem in the same room. But then the restaurant case comes right back at me: I was perfectly happy to call the restaurant good on her say-so. Why is a poem different from a restaurant?
  - And the convergence case: if every serious critic for two hundred years has called some composer a genius and I've never heard a note, is my saying "he's a genius" just shorthand for "everybody says so," or is it a real belief I'm entitled to hold?

  I think I might have half a principle already: you can take testimony for any judgement that's really about how a thing will strike people, me included, but not for a judgement about the thing itself — its beauty, whatever that is. But I can't tell if that's a real distinction or just me being precious about paintings while happily outsourcing my wine opinions.

  So: is there a principle that gets all of these, or close to all? Which of my verdicts does it make me give up, and what does it say about a case I didn't list — say, a friend tells me a joke is funny and I haven't heard it. Also, if the answer is "it depends what kind of aesthetic judgement it is," please say what the kinds are, precisely, and which clause of the principle each of my cases is doing the work of motivating.
reasoning: |-
  Okay, let me try to unpack the user's query. They're struggling with when it's acceptable to trust others' aesthetic judgments versus when they feel they need direct experience. They provided several scenarios to illustrate their confusion. 

  First, I need to understand their core question. They listed cases like restaurants, films, wine, paintings, novels, music, dance, poetry, and historical consensus on composers. Their gut reactions vary: they're fine trusting friends on restaurants and films, a sommelier on wine, and accepting plot spoilers. But they hesitate with paintings, music's emotional impact, and poetry's quality. The key issue is whether aesthetic judgments can be based on testimony or require personal experience.

  Looking at their proposed principle—trusting testimony for how something affects people but not for intrinsic qualities like beauty—I see a tension. They admit this might be inconsistent, especially comparing restaurants to poems. Why is one okay and the other not? The user wants a coherent framework to resolve these inconsistencies.

  Breaking down each case: restaurants, films, and wine involve functional aspects—taste, enjoyment, which are subjective but shared. Paintings and poetry, however, are more about personal, immediate experience. The emotional impact of music is tricky; they can believe it affects others but don't feel they've learned its sadness without hearing it. The dance case shows they can accept technical expertise but not the implied enjoyment. The poetry example with a trusted friend highlights the conflict between predicting personal enjoyment versus judging quality. Historical consensus on composers raises whether such judgments are factual or require personal validation.

  The user's deeper need might be reconciling intellectual acceptance of others' opinions with the personal nature of aesthetic experience. They might fear losing authenticity by adopting others' judgments without direct experience. Or they're seeking a way to navigate social sharing of tastes without compromising personal integrity.

  I recall philosophical concepts like aesthetic testimony debates. Some argue that aesthetic properties require first-hand experience because they're response-dependent. But others, like Hume, suggest that experts can guide us due to shared sensibilities. The user's cases show a mix: functional judgments (wine quality) vs. emotional resonance (music sadness). 

  The restaurant vs. poem discrepancy is key. Restaurants might be seen as having objective qualities (food quality, service) that can be reported, while poetry's value is more subjective and experiential. But that's fuzzy—both involve personal taste. Maybe the distinction is between instrumental value (restaurant serves a purpose) versus intrinsic value (art for its own sake). 

  The joke example they mentioned isn't listed, but it's similar. Believing a joke is funny based on testimony feels odd because humor relies on surprise and personal context. You can't feel the humor without hearing the joke, just as you can't feel a painting's beauty without seeing it.

  So, the principle I propose centers on direct phenomenal experience. If the judgment requires experiencing a specific sensory or emotional response (beauty, sadness, humor), testimony can inform but not substitute. For collective or functional judgments (fame, technical skill, predictive enjoyment), testimony suffices. 

  This resolves their cases: they can trust the sommelier's expertise on wine quality (functional) but not claim a painting's beauty without seeing it (experiential). For the poem, they predict enjoyment based on trust but withhold judgment on quality until reading. Historical consensus becomes shorthand unless they engage with the music themselves.

  The user might need to accept some fluidity. Trusted friends can bridge the gap, as with the restaurant case, because shared taste predicts personal response. But for entirely new experiences, like the painting, no testimony can replace seeing it. The key is distinguishing between beliefs about others' experiences and personal aesthetic judgments.
answer: |-
  Here's a principle that reconciles most of your intuitions while explaining the exceptions, rooted in philosophical aesthetics (particularly the debate on **aesthetic testimony**):

  **Principle:** *You can justifiably adopt another's aesthetic testimony as a belief if (and only if) the judgment either (1) describes a functional, consensus-based, or predictive property accessible through shared standards, or (2) predicts your own likely response based on reliable patterns. You cannot justifiably adopt another's testimony as a direct substitute for the immediate, phenomenal, non-inferential experience of an aesthetic property (e.g., beauty, emotional force).*

  **Breaking Down Your Cases with the Principle:**

  1.  **Restaurant/Film (Fine):** This primarily relies on **predictive trust (Clause 2)**. Your friend knows *your taste* and the *functional qualities* (Clause 1: taste, service, ambiance) likely to please you. "Good" here means "likely to be enjoyable *for people like us*" or "meets functional standards."
  2.  **Sommelier (Fine):** This leans heavily on **functional/consensus standards (Clause 1)**. Wine quality, especially within expert circles, relies on identifiable characteristics (tannins, acidity, balance, typicity). The sommelier is reporting an objective assessment *within that framework*. You're believing "This wine exhibits qualities experts define as superior," not necessarily that *you* will prefer it.
  3.  **Painting (Not Fine):** This requires the **immediate phenomenal experience (Violates Clause 1 & 2)**. Beauty here isn't a functional property or a mere prediction; it's the direct sensory-emotional impact of seeing the composition, color, texture. Testimony can tell you *others find it beautiful* (a social fact - Clause 1), but cannot grant *you* the experience of its beauty itself.
  4.  **Novel Spoiler (Fine):** This is purely **factual information (Clause 1)**. It's about plot structure, not the aesthetic *experience* of reading the revelation. You're learning a truth-apt proposition *about* the work.
  5.  **Music's Emotional Effect (Flip-Floppy):** You're correctly distinguishing two judgments:
      *   *"Devastating to her/most people"*: **Social/Consensus Fact (Clause 1)**. Testimony is fine for this.
      *   *"Devastating [as an inherent aesthetic property]"*: **Immediate phenomenal experience (Violates Clause 1 & 2)**. You can't *feel* the devastation via testimony, only know *about* it. This *is* like the painting case for the core aesthetic property. Testimony gives you evidence *about* the property's existence (in others), not the property *itself* in your experience.
  6.  **Dance Critic (Fine Distinction):** You accept the **technical assessment (Functional/Consensus Standards - Clause 1)** - phrasing and balance are observable, trainable skills within the art form's criteria. You rightly reject the **aesthetic verdict ("should have loved it")** because that requires the **immediate phenomenal experience (Violates Clause 1 & 2)** of engagement that you lacked.
  7.  **Poem from Trusted Friend (The Crux):**
      *   *"I'll love it"*: **Prediction based on shared taste (Clause 2)**. This is like the restaurant - high confidence based on pattern recognition.
      *   *"It's good"*: **Ambiguous**. If "good" means "meets technical standards of craft" (Clause 1), you *could* potentially accept testimony (e.g., "the meter is flawless, the imagery original"). If "good" means "possesses aesthetic merit/beauty" requiring direct experience, you **cannot** accept testimony (Violates Clause 1 & 2). Your gut ("judgements need me and the poem in the same room") points to this latter sense. The restaurant "good" likely felt more functional/predictive; the poem "good" feels more intrinsically experiential.
  8.  **Historical Consensus (Genius Composer):** Saying "He's a genius" based *only* on testimony is **primarily shorthand (Clause 1)**. It means "He is widely and authoritatively regarded as a genius within the tradition." It expresses a **social fact** about critical consensus. To sincerely believe "He *is* a genius" *as an aesthetic truth* requires **your own engagement with the music (Violates Clause 1 & 2)**. The testimony gives you strong reason to *expect* you'll find genius, but it doesn't grant the aesthetic apprehension itself.

  **The Joke Case (Unlisted):**
  *   "This joke is funny." Can you believe it?
      *   *Prediction:* "People laugh at it" (Clause 1 - social fact) or "You will likely laugh" (Clause 2 - based on shared humor) - **Yes**.
      *   *Aesthetic Property:* Experiencing the funniness - the surprise, the click of the punchline, the visceral reaction. **No.** Testimony cannot *make* you find it funny. You can believe it *has the property of being funny* (based on testimony that others find it funny), but you cannot *experience* that property without hearing the joke. This is directly analogous to the painting and the core music case.

  **What You Might Need to Give Up (Slightly):**

  1.  **The Restaurant/Film "Good":** Your principle requires acknowledging that when you say "It's a good restaurant" based *only* on testimony, you mean something slightly different than when you say it after eating there. Testimony-based "good" means "reliably reported to meet functional/hedonic standards for people like me." Direct-experience "good" incorporates that *plus* the immediate phenomenal satisfaction. The *word* is the same, but the epistemic grounding differs.
  2.  **Absolute Certainty in Prediction (Poem):** Your trust in your friend's taste is high, but Clause 2 is still probabilistic prediction, not certain knowledge of the poem's inherent quality. There's always a gap between prediction and direct experience.

  **Why the Distinction is Real (Not Just Preciousness):**

  *   **Phenomenal Experience:** Beauty, sadness (as felt), funniness (as experienced), the "wow" factor of a painting – these are qualia. They are subjective states of consciousness *caused by* interacting with the object. Testimony can describe the cause and the effect *in others*, but it cannot replicate the effect *in you*. You learn *that* the object causes the experience, not what the experience *is like*.
  *   **Functional/Consensus Standards:** Restaurants serve food (function), wine has chemical properties experts agree signify quality (consensus standards), plot points are facts, technical skill in dance is observable. These are things that can be reliably reported because they exist somewhat independently of the *immediate, individual* phenomenal response. They are properties *of the object* that reliably *cause* responses, which can be described objectively.

  **In Summary:** Your gut is mostly tracking the difference between **aesthetic experiences** (which require first-person engagement) and **aesthetic facts/properties/predictions** (which can be communicated via testimony). The principle holds that testimony can tell you *about* aesthetic properties and predict your reaction, but it cannot *provide* the experiential core of the aesthetic encounter itself. This explains why the painting, the core sadness of the music, the "goodness" of the poem in its deepest sense, and the genius of the composer remain locked behind the door of direct experience, even while testimony remains highly valuable for navigation and prediction.
