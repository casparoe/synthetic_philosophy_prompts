  The output should feel like a ready-to-run lesson plan with time stamps, printable materials, and anticipated "troubleshooting" notes.
answer: |-
  Here’s a polished, actionable lesson plan for your 75-minute session, structured to achieve your pedagogical goals while anticipating pitfalls. The activity emphasizes **conceptual conflict**, **pragmatic negotiation**, and the **purpose-dependence** of species definitions.

  ---

  ### **Session Title:** "The Species Problem: Counting What Can't Be Counted?"

  ### **Learning Objectives**
  1. Experience how different species concepts (BSC, morphological, phylogenetic, etc.) generate conflicting counts for the same organisms.
  2. Negotiate a consensus species count under real-world constraints (e.g., conservation policy).
  3. Recognize that "species" is a pragmatic tool, not a natural kind.

  ### **Materials** (Prepare in Advance)
  - **Organism Cards** (5 sets, 1 per group):  
    Create cards for 6 fictional populations (adjust complexity as needed):
    - **Populations A→E**: Ring species around a mountain. A-B, B-C, C-D, D-E interbreed; A and E do not.
    - **Population F**: Asexual lineage (clonal reproduction).
    - **Population G & H**: Morphologically identical, allopatric, never interbreed (cryptic species).
    - **Fossil Series I₁→I₅**: Stratigraphic layers showing gradual morphological change (include images/sketches).
  - **Concept Cheat Sheets** (1 per group):  
    Summarize key criteria for:
    - **Biological (BSC)**: Interbreeding/reproductive isolation.
    - **Morphological**: Physical traits.
    - **Phylogenetic (Cladistic)**: Shared evolutionary history (monophyly).
    - **Ecological**: Niche adaptation.
    - **Cohesion Concept**: Gene flow + stabilizing selection.
  - **Worksheet** (1 per group): "Apply your concept. How many species? Justify (max 3 bullet points)."
  - **Regulator Brief** (1 copy for all):  
    *"A road project hinges on protecting endangered species. If ≥3 species exist, the road is blocked. You must agree on ONE official count by 15:10. Deadlock = automatic approval of the road."*
  - Whiteboard + markers.

  ---

  ### **Timeline & Rules** (Total: 75 min)
  #### **Phase 1: Group Work** (25 min)
  - **Groups**: Split 14 students into 5 groups (3 groups of 3, 2 groups of 2).  
  - **Task**:  
    - Each group receives **one species concept**, **organism cards**, and a **worksheet**.  
    - **Goal**: Apply *only* their assigned concept to count species. *No Googling/prior knowledge.*  
  - **Rules**:  
    - Focus on *their concept’s logic*, not debating data.  
    - Assign a recorder to write the count + justification.  
    - **Output**: A number + 3-bullet reasoning (e.g., "BSC: 4 species. A/E isolated; F asexual; G/H interbreed?").

  #### **Phase 2: Negotiation** (20 min)
  - **Regulator Scenario**: Announce the road project stakes. Groups must agree on **one number**.  
  - **Rules**:  
    - Each group has 2 min to present their count/justification.  
    - Debate focuses on **which concept best serves conservation**, not data accuracy.  
    - Consensus required. Deadlock = road approved.  
  - **Facilitation**:  
    - Intervene only if they fixate on data ("The data is fixed; focus on concepts").  
    - Push: "Which concept gives the *fairest* outcome for conservation?"  

  #### **Phase 3: Debrief** (30 min)
  Guide discussion to map the exercise to philosophy:  
  1. **Report Outcomes** (5 min):  
     - What number did groups initially get? (Likely: BSC=4+, Morph=3, Phylo=5+, Eco=4, Cohesion=4).  
     - What consensus was reached? Why?  
  2. **Conceptual Conflict** (10 min):  
     - *Key Q*: "Was disagreement due to *bad data* or *different questions*?"  
     - Highlight:  
       - BSC failed for asexual/fossils.  
       - Morphology missed cryptic species.  
       - Phylogeny prioritized history over ecology.  
     - **Quote to share**: E.O. Wilson: "Species concepts exist to serve the need for a convenient label."  
  3. **Pragmatism** (10 min):  
     - *Key Q*: "Did negotiation feel scientific or political? Why?"  
     - Stress: Conservation policy needs a binary choice (road/no road), but nature isn’t binary.  
     - Link to realism debate: **No concept "tracks reality" perfectly**—each captures different facets (reproduction, niches, history).  
  4. **Bigger Picture** (5 min):  
     - "Species are hypotheses, not discoveries" (Mayr).  
     - Why keep the term? *Utility* for ecology, policy, communication.  

  ---

  ### **What Will Predictably Go Wrong (and Fixes)**
  1. **"Arguing about your data, not concepts"** (Your main worry).  
     - *Why*: Students latch onto fictional details ("Would A *really* breed with E?").  
     - *Fix*:  
       - Pre-brief: "Data is simplified and fixed; focus on your concept’s lens."  
       - Cards should be **minimalist** (e.g., "A-B interbreed; A-E do not").  
       - Redirect during group work: "How does your concept *define* a species? Apply that rule."  

  2. **Negotiation deadlock or superficial compromise**.  
     - *Why*: Students treat it as a vote, not a principled debate.  
     - *Fix*:  
       - Regulator stakes create urgency.  
       - Force groups to argue *from their concept’s strengths* (e.g., "Morphology is affordable for field surveys").  

  3. **Asexual/fossil groups feel "unfairly" challenged**.  
     - *Why*: BSC struggles with asexual taxa; fossils lack genetic data.  
     - *Fix*: This is **pedagogically useful**! Debrief: "Some concepts exclude entire lifeforms. Is that acceptable?"  

  4. **Overly technical rabbit holes** (e.g., "What if G and H *could* interbreed?").  
     - *Fix*: "Stick to the card data. Your task is application, not speculation."  

  ---

  ### **What This Activity CANNOT Do (and How to Address)**
  - **❌ Resolve Realism vs. Pragmatism**: It won’t prove whether species are "real" or arbitrary.  
    - *Mitigation*: Use debrief to note: "Concepts are tools, not mirrors of nature. Reality is variation + continua."  
  - **❌ Cover All Concepts/Nuances**: Cohesion concept may confuse; evolutionary processes (e.g., gene flow) are simplified.  
    - *Mitigation*: Provide concise cheat sheets; acknowledge limitations upfront.  
  - **❌ Simulate Scientific Process Fully**: Real taxonomists use multiple lines of evidence.  
    - *Mitigation*: Stress that negotiation mirrors policy, not science.  

  ---

  ### **Why This Works**
  - **Hands-on conflict** makes abstract debates visceral.  
  - **Negotiation phase** exposes how science is shaped by societal needs (e.g., conservation laws).  
  - **Fictional data** removes bias and focuses on conceptual application.  

  **Final Tip**: Start with a 1-min hook: *"If you had to choose one number to save a forest, how would you count species? Today, you’ll live that dilemma."*  

  This plan balances structure with open-ended discovery, ensuring students leave understanding that **"species" is a question, not an answer**. Let me know if you need card examples or cheat sheets drafted!
