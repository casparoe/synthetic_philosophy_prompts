reasoning: |-
  We are designing a 90-minute activity for 18 upper-level undergraduates in a history-and-philosophy seminar on WWI origins. The goal is to have them experience the difficulty of assigning blame by forcing them to produce a unanimous verdict on the percentage of responsibility for each of six powers (Germany, Austria-Hungary, Russia, France, Great Britain, Serbia), summing to 100%. The activity must include a constructed evidence record that covers the required items and is double-edged. The verdict will be destabilized by later reveals.

  Key constraints:
  - No prior reading; everything must be provided.
  - Paraphrase documents; mark as paraphrases.
  - Flag disputed facts.
  - Cover the specified items (Sarajevo, ultimatum, German blank check, Russian mobilization, French planning, British ambiguity, naval race, Moroccan crises, Balkan wars, September 1914 German war aims).
  - The German war aims memo must be presented as drafted after the war began, so participants must decide how much it reveals about pre-war intentions.

  Activity structure:
  1. Participants are assigned roles as national delegates (6 nations, but 18 students so multiple per nation? Or we can have 6 groups of 3? Let's go with 6 groups of 3, each group representing one of the six powers: Germany, Austria-Hungary, Russia, France, Great Britain, Serbia. Note: Serbia is included as a principal power for the purpose of the activity, though in reality it was not a great power. We have 18 students -> 3 per group, so 6 groups for 6 nations. Each group is a delegation.

  2. The activity will have phases, including:
     - Individual pre-discussion verdict (each student fills a table with percentages for each nation, summing to 100%).
     - Group discussion to produce a national position (each group must agree on one table for their nation, but note: the final verdict is a single table for all nations, so they must negotiate with others? Actually, the final verdict is to be agreed unanimously by the whole group on one table. So we need a plenary negotiation.

  3. The rules must force choices about the unit of blame (state, government, etc.) and the standard (causation, failure to prevent, intent). This will be done by the framing of the evidence and the instructions.

  4. The verdict becomes legally binding in the fiction: it will be the basis for reparations, and each delegate must sign even if they dissented, because they represent the nation.

  5. Reveals:
     - After the verdict, reveal some evidence that destabilizes (e.g., a document showing that another nation had aggressive plans, or a fact about the timing).
     - Then reveal the private individual tables to show the spread and the cost of unanimity.

  6. Debrief: connect to historiography (Fischer controversy) and philosophy (causal vs. moral, collective responsibility, etc.).

  Detailed Plan:

  Title: "The Blame Game: Assigning Responsibility for the Great War"

  Session Parameters:
  - Setting: Seminar room with movable chairs.
  - Participants: 18 students, divided into 6 groups of 3 (each group representing one nation: Germany, Austria-Hungary, Russia, France, Great Britain, Serbia).
  - Duration: 90 minutes.
  - Room Arrangement: Tables for each group (6 tables) arranged in a circle for plenary discussion. Also, space for the facilitator to move around.
  - Materials: Handouts (briefing sheet with chronology, evidence record, role sheets), blank verdict forms (individual and group), pens, a large poster or whiteboard for the final verdict.

  Target Insight: Participants will have experienced how the assignment of blame for a complex historical event depends on prior choices about the unit of agency and the standard of responsibility, and how a collective verdict can obscure individual judgment.

  Briefing Sheet: A chronology with dated events, paraphrased documents, and flags for disputed facts.

  Evidence Record: We need 12-16 items, each double-edged. We'll have at least one incriminating and one exculpating for each power, and three double-edged. We must cover:
  - Sarajevo assassination (June 28, 1914): double-edged? Serbia's involvement is disputed.
  - Austro-Serbian quarrel: Austria-Hungary blamed Serbia for the assassination.
  - Austro-Hungarian ultimatum (July 23, 1914) and Serbia's reply (July 25): Serbia accepted most but not all, so Austria-Hungary declared war (July 28). How to turn: Serbia's reply was conciliatory, but Austria-Hungary wanted war. Or, Serbia's government may have known about the plot.
  - German "blank check" (July 5-6, 1914): Germany's assurance of support to Austria-Hungary. Can be read as encouraging Austria-Hungary to be aggressive, or as honoring an alliance.
  - Russian general mobilization (July 30): This was a key step. Russia mobilized to defend Serbia, but mobilization was seen as an act of war by Germany. Disputed: Was it necessary? Did it cause the escalation?
  - Military timetable: The rigidity of mobilization schedules (especially Germany's Schlieffen Plan) meant that once Russia mobilized, Germany felt compelled to act quickly. This can be read as a cause of the war or as a constraint.
  - French planning: France was bound by the Franco-Russian alliance (1894) and had offensive war plans (Plan XVII). But did they want war?
  - British ambiguity: Britain did not make a clear commitment to France or Russia until late. The Belgian question: Germany's invasion of Belgium (August 4) brought Britain in. But was the naval race (1898-1912) a cause of tension?
  - Moroccan crises (1905, 1911): Germany challenged France, leading to tensions. But in 1911, it was resolved peacefully. How to read: aggressive or just assertive?
  - Balkan Wars (1912-1913): These increased tensions and left Serbia strengthened, which Austria-Hungary saw as a threat.
  - German war-aims memorandum (September 1914): Drafted after the war began. It shows expansionist aims, but does it prove pre-war intent?

  We'll create an array of 12-16 evidence items.

  Roles: Each group (3 students) gets a role sheet for their nation. The role sheet includes:
  - The nation they represent.
  - What they receive: private constraints (e.g., "You must try to keep your nation's responsibility below X%") and what they want (e.g., minimize their own blame, or shift to others).
  - Also, they get a brief of their nation's position and interests.

  Phases:
  1. Phase 1 (0-5 min): Introduction and individual verdict. Facilitator hands out briefing sheet and individual verdict forms. Each student reads the chronology and fills in their own table (percentages for each nation, sum=100%).
  2. Phase 2 (5-20 min): Group caucus. Groups meet to discuss and agree on a group verdict (one table per nation). They also prepare arguments for the plenary.
  3. Phase 3 (20-60 min): Plenary negotiation. All groups meet together to negotiate a unanimous verdict. The facilitator sets the rule: they must produce one table with percentages for the six nations, summing to 100%, and it must be unanimous. The facilitator only times and observes.
  4. Phase 4 (60-70 min): The verdict is written and signed by every delegate (each student signs the final table, even if they disagree).
  5. Phase 5 (70-85 min): Reveals. The facilitator reveals destabilizing information at fixed minutes (e.g., at 70, 75, 80 min). These include:
     - Reveal 1: A new piece of evidence (e.g., a document showing that France encouraged Russia to be firm, or that Germany considered a preventive war in 1912).
     - Reveal 2: The German war aims memorandum (with the note that it was drafted after the war began, so it might not reflect pre-war intent).
     - Reveal 3: The private individual verdicts (collected at the beginning) are shown, so they see the spread and the shifts.
  6. Phase 6 (85-90 min): Quick debrief and setup for the next class (the full debrief might be in the next session, but we have to do a short one). However, we have to fit the debrief mapping in the 90 minutes? Actually, the activity must end at 90, so the debrief might be very brief. But the instructions say the debrief must map moments to ideas. We'll have to do it in the last 5 minutes? That's tight. Alternatively, the reveals and the debrief are combined? Let's adjust the time.

  Revised Phases (90 min total):
  - 0-5: Phase 1: Introduction and individual verdict.
  - 5-20: Phase 2: Group caucus (15 min).
  - 20-60: Phase 3: Plenary negotiation (40 min).
  - 60-65: Phase 4: Signing the verdict (5 min).
  - 65-80: Phase 5: Reveals (three reveals at 65, 70, 75 min? But we have until 80). Actually, let's do:
     - 65: Reveal 1 (5 min discussion)
     - 70: Reveal 2 (5 min)
     - 75: Reveal 3 (5 min)
     - 80: Start debrief (but we have only 10 min left). Instead, we can have the reveals as a block and then debrief.

  Alternatively, we can have:
  - 65-75: Three reveals (each 3-4 min) and then 75-85: debrief, 85-90: check for understanding.

  But 5 min for debrief is too short. We need at least 10 min for debrief. Let's cut the plenary by 5 min and the signing by 2 min? Or make the group caucus 12 min? Actually, 18 students in plenary for 40 min might be tight. We must stick to 90 min.

  Let's adjust:
  Total: 90 min
  - 0-5: Phase 1: Individual verdict (5 min)
  - 5-17: Phase 2: Group caucus (12 min)
  - 17-52: Phase 3: Plenary negotiation (35 min)
  - 52-55: Phase 4: Signing (3 min)
  - 55-75: Phase 5: Reveals (20 min: three reveals, each about 5-7 min, but we'll time them)
     - Reveal 1 at 55 (5 min to present and discuss)
     - Reveal 2 at 60 (5 min)
     - Reveal 3 at 65 (5 min)
     - Then 70-75: Quick reactions
  - 75-85: Phase 6: Debrief (10 min)
  - 85-90: Check for understanding (5 min)

  But the reveals are meant to destabilize the verdict, so they should be after the signing and before the debrief.

  Verdict Mechanic:
  - How responses are collected: Individual verdicts collected at the end of Phase 1 (facilitator collects the forms). Group verdicts are produced in Phase 2 (one per nation). Then in plenary, they negotiate to one table.
  - Aggregation rule: They must agree unanimously on one table (percentages for the six nations) for the whole group.
  - Unanimity rule: If they cannot agree by the end of the plenary, the default verdict is the Treaty of Versailles (100% on Germany and her allies, meaning Germany and Austria-Hungary, but then we have to split). The default: 100% on Germany. Why it stings: Because it's what actually happened, and they will see it as arbitrary.

  Stakes Device:
  - How the verdict becomes consequential: The facilitator announces that this verdict will be included in the peace treaty as the legal basis for reparations.
  - Who pays: Each nation pays reparations in proportion to their assigned percentage.
  - Why a dissenting delegate must sign: Because they are representatives of their nation, and the nation as a whole is bound by the treaty.

  Reveals: Three reveals.
  1. A document showing that Russia had pre-mobilization measures before the official mobilization (disputed fact: but we can say it is a historical fact that Russia began partial mobilization on July 25, and then general on July 30). This could be used to argue that Russia was aggressive, but they might say it was defensive.
  2. The German war aims memorandum (paraphrased, and we note it was drafted in September 1914). Does it show premeditation? Or was it a product of the war?
  3. The private individual verdicts (each student's initial percentages) are displayed on a board so they see the range and how much they converged.

  Predictable Failures and Handling:
  - "It was obviously Germany": Facilitator asks the group to consider the evidence on other nations, and reminds them of the unanimity rule and the need to assign percentages to all.
  - Arithmetic argument: If they spend too much time on making the numbers add up instead of the reasons, the facilitator can ask: "What principle are you using to assign these numbers? Is it about causation or moral blame?"
  - Delegate capitulates: The facilitator might note (in debrief) that this is common in negotiations and ask what effect it had.
  - Accusation of manipulation: The facilitator can acknowledge that the activity is designed to provoke these dilemmas and that real historical judgments face similar constraints.
  - Treating the record as a puzzle: The facilitator reminds that the evidence is ambiguous and contested, and that the goal is not to find the "right" answer but to experience the difficulty.

  Debrief Map: We'll connect moments to concepts and name the Fischer controversy at the point where they have seen the German war aims.

  Cannot Reproduce:
  - The temporal distance: The real reparations affected people decades later. The facilitator must explain this.
  - The archives: Many documents were only released later, which changed the historiography. The facilitator must note that their evidence record is limited and that real historians had more to go on later.

  Check for Understanding:
  - Prompt: "In one sentence, what did this activity show you about assigning historical responsibility?"
  - Good answer: Recognizes that the assignment depends on prior choices (unit and standard) and that evidence is ambiguous.
  - Bad answer: Focuses on the specific percentages they assigned or treats it as a game without deeper meaning.

  Now, we write the JSON object.
