  Okay, the user wants a sestina poem about the sunk cost fallacy for a seminar opener. They have very specific requirements: 39 lines, six rotating end-words (spent/still/keep/enough/worth/because), and deep integration of economic theory with human experience. 

  Hmm, this is complex. The poem must satisfy three contradictory needs: 1) perfectly align with decision theory (past costs as irrelevant to future choices), 2) show how past investment provides evidence of skill/identity, and 3) acknowledge that some goods derive value from their history. All without resolution. 

  I notice the user is academically sophisticated - they reference decision theorists and want the form to "carry the argument." The seminar context suggests they're teaching behavioral economics or philosophy. Their frustration with oversimplified "don't throw good money after bad" morals is palpable. 

  The real challenge is making "sunk" function dually: as irrecoverable cost AND foundation. For structure, I'll let the rotating end-words enact the obsessive recurrence of sunk cost thoughts. "Spent" must bookend the first/last stanzas per sestina rules - perfect for the cyclical dilemma. 

  Key lines need double meanings: "what's sunk is sunk" (gone vs. foundational), "I'm building on the thing I can't unspend" (irrational persistence vs. literal construction). The envoi's final line "because it's worth what I have spent" must equally support quitting or continuing. 

  *checks word rotation* Stanza 2 must end with "because" since it follows "spent" in stanza 1... good, that forces the speaker to justify persistence. "Enough" will climax in stanza 4 where exhaustion meets satisficing theory. 

  The marriage/farm/garden examples must appear naturally - perhaps in stanza 3's "rooted" metaphor. Skill evidence emerges in stanza 5's "steady hand." Last line's ambiguity relies on "worth" containing both market value and personal meaning. 

  *counting lines* Envoi's tercet plus six sestets: 39 exactly. No titles or notes as requested. Time to weave this tightrope walk...
