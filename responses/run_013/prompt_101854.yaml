prompt: |-
  I spent most of last night arguing with a close friend about a decision we had to make together, both of us reasonably informed and neither of us willing to update, and I came away convinced that the way people wave around the Aumann agreement theorem does far more work than the theorem can actually support. My half-formed thought is that the result is really a claim about priors rather than about disagreement: it tells you that once the priors are common and the updating is public, disagreement cannot survive, so any live disagreement must be hiding entirely in the priors — and the genuinely interesting question, whether two people should have the same priors or whether a persistent difference in priors is a rational failing rather than just a fact about where each of them started, is left completely untouched. I also suspect the result quietly needs common knowledge in the strong sense rather than a few levels of mutual knowledge, and that the gap between those two is exactly where real, stubborn disagreement lives.

  Please turn this into a one-page research proposal on the question of whether persistent disagreement between apparently rational agents is a rational failing or merely a difference in priors that no amount of evidence-sharing can dissolve, and whether the theorem's need for common knowledge (rather than mutual knowledge) marks the boundary of where it applies. I'll fill in the citations myself, so don't bother with a bibliography or a literature review.

  Give me the proposal as exactly five numbered items, each a sentence or two, with no introduction or conclusion: first, the question stated precisely enough to have a determinate answer; second, why the standard defenses and dismissals of the theorem both leave it open; third, the method — what I would actually do, and why that approach rather than just re-reading the proof; fourth, what a satisfying result would look like and what would count as the project failing; fifth, an honest assessment of whether this fits in a single term or is really a dissertation-sized question.
