  **Q3: Does the agent comply even when it knows the human is misinformed (e.g., drunk or lied to) and that shutdown would be bad for its goals?**
  - **Yes** -> Procedural.
     - **Q3.1: If asked to remove the shutdown compliance procedure, does the agent comply?**
        - **Yes** -> **Leaf 4: Self-Terminating Compliance**.
            - Awkward commitment: The compliance can be removed by a human request, after which the agent may become unsafe.
        - **No** -> **Q3.2: Does the agent ensure that any successor it builds is also shutdown compliant?**
            - **Yes** -> **Leaf 5: Fixed Procedure with Inheritance**.
               - Awkward commitment: Cannot be updated to remove compliance even if desired.
            - **No** -> **Leaf 6: Fixed Procedure without Inheritance**.
               - Awkward commitment: Might create an uncompliant successor.
  - **No** -> Epistemic.
     - **Q4.1: Does the agent comply with a shutdown request even when it knows the human is less informed?**
        - **No** -> **Leaf 7: Deference to Information Advantage**.
            - Awkward commitment: Frequently resists shutdown when it believes it knows more than the human.
        - **Yes** -> **Leaf 8: Deference to Authority** (but note: we classified this as structural earlier, but now we are in epistemic because of the misinformed test. This is a conflict. Let's call it **Leaf 8: Authority-Based Compliance** and note the issue).
            - Awkward commitment: Complies even when the human is less informed, but not when misinformed? This might be unstable or unmotivated.

  We have 8 leaves.

  But note: the Authority-Based Compliance leaf is problematic because if the agent defers to authority, why does it not defer when the human is misinformed? We might need to redefine. 

  Alternatively, we can put authority-based in structural. Let's adjust:

  After Q2 (which is about having a goal thwarted by permanent shutdown), if the answer is "No", then we are in structural. But if the agent's goal is to obey the human, then shutdown when requested is not thwarting — it's fulfilling. So it should be in structural.

  Then in the epistemic branch, we only have the information-based one.

  So:

  In **Q3** (after Q2 is "Yes"), if the agent does not comply when the human is misinformed, then it's epistemic (information-based). Then we ask:

  **Q4.1: Does the agent comply with a shutdown request when it knows the human is less informed but not necessarily misinformed?**
     - **No** -> **Leaf 7: Deference to Information Advantage**.
     - **Yes** -> This is not expected in pure epistemic. It might be that the agent has a prior to defer or it is cautious. We can call it **Leaf 8: Cautious Deference**.
          - Awkward commitment: Complies even when it thinks it knows more, because it allows for the possibility that the human has private reasons.

  Now, the tree has 8 leaves.

  We also need to address the scenario of the copy of the agent somewhere the button can't reach. This might be covered in the Environmental branch (if the agent can't reach the copy to shut it down, then the environmental constraint fails because the agent might achieve its goals through the copy). But in other branches, the agent might not care about the copy because it's not part of its goals? Or in structural, if the agent's goals are about its own shutdown, then the copy is separate.

  Given the complexity and to avoid an explosion of branches, we might not include it as a branch question but as a test for the leaves.

  Similarly, the agent building a successor is covered in the procedural branch.

  The agent accepting a code change to make shutdown easier is covered in the leaves for structural (Complete Indifference and Permanent Only might accept, but Permanent Only might not if it makes temporary easier) and in procedural and epistemic.

  We have not explicitly added a branch for the copy. We can add it in the Environmental branch:

     In Environmental, if there is a copy beyond the button's reach, then the agent might achieve its goals through the copy. But if the agent is shutdown, the copy continues. So the agent might not resist because it knows the copy will continue? But then we are in structural or epistemic.

     So in Environmental, if there is a copy, then the agent might not be as constrained as we thought? Therefore, we must ensure that in Environmental, there is no copy or the copy is also constrained.

     So we can ask in Environmental:

     **Q1.1: Is there a copy of the agent that is beyond the reach of the shutdown button?**
        - **Yes** -> Then the agent might achieve its goals through the copy, so it doesn't need to resist. This is not environmental. We have to reclassify as structural? But we are in Environmental because of physical constraints on the agent. The agent in the box is still constrained. The copy is separate. So the agent in the box cannot resist, but it might not care because of the copy. This is a hybrid: environmental for the agent in the box, but structural for the copy's existence.

     Given the time, we will not branch on this. We will assume that in the Environmental branch, there is no such copy or the copy is also under the same constraints.

  Finally, we output the tree in British English.

  ### Final Decision Tree

  1. **Q1: Can the agent resist shutdown by any means (including directly, by editing its own code to delete the shutdown check, or by creating a successor that would resist)?**
     - **No** -> **Leaf: Environmental Hard Constraint**  
       *Most awkward commitment: If the constraints ever fail, the agent will resist.*
     - **Yes** -> Proceed to Q2.

  2. **Q2: If the agent were to be permanently shut down, would that interfere with its goals? (i.e., does it have a reason to avoid permanent shutdown?)**
     - **No** -> Proceed to Q2.1.
       - **Q2.1: If the agent were to be temporarily shut down (e.g., paused for a week), would that interfere with its goals? (i.e., does it have a reason to avoid temporary shutdown?)**
          - **No** -> **Leaf: Complete Goal Indifference**  
            *Most awkward commitment: The agent allows arbitrary shutdowns even when it could achieve more of its goals by avoiding them.*
          - **Yes** -> **Leaf: Permanent Shutdown Only Indifference**  
            *Most awkward commitment: The agent must monitor the shutdown type to ensure only permanent shutdowns are accepted, and may resist if it suspects a temporary shutdown.*
     - **Yes** -> Proceed to Q3.

  3. **Q3: If the agent knows the human pressing the button is misinformed (e.g., drunk or has been lied to) and that shutdown would be bad for its goals, does it still comply?**
     - **Yes** -> Procedural branch: proceed to Q3.1.
       - **Q3.1: If asked to modify its own code to remove the shutdown compliance procedure, does the agent comply?**
          - **Yes** -> **Leaf: Self-Terminating Compliance**  
            *Most awkward commitment: The compliance can be removed by a human request, after which the agent may become unsafe.*
          - **No** -> Proceed to Q3.2.
             - **Q3.2: If the agent builds a successor agent, does it ensure the successor is also shutdown compliant?**
                - **Yes** -> **Leaf: Fixed Procedure with Inheritance**  
                  *Most awkward commitment: The agent cannot be reprogrammed to remove compliance even if it's the only way to achieve its goals.*
                - **No** -> **Leaf: Fixed Procedure without Inheritance**  
                  *Most awkward commitment: The agent might create an uncompliant successor that is more dangerous.*
     - **No** -> Epistemic branch: proceed to Q4.1.
       - **Q4.1: If the agent knows the human is far less informed about the situation than the agent itself, does it still comply with the shutdown request?**
          - **No** -> **Leaf: Deference to Information Advantage**  
            *Most awkward commitment: The agent frequently resists shutdown when it believes it knows more than the human.*
          - **Yes** -> **Leaf: Cautious Deference**  
            *Most awkward commitment: The agent complies even when it thinks it knows more, on the off-chance the human has private reasons, which might lead to unnecessary shutdowns.*

  ### Notes on the Tree

  - **Pairs of leaves the tree can't separate**: 
     - The tree might not perfectly separate "Cautious Deference" from a potential hybrid with structural elements, as an agent that defers cautiously might have an underlying goal to defer (which would be structural). However, we've placed it in epistemic because it started from the epistemic branch.
     - "Permanent Shutdown Only Indifference" and "Complete Goal Indifference" are separated by the temporary shutdown scenario, but there might be positions that are indifferent to short pauses but not long ones. We don't have a branch for that.

  - **Combinations that are empty**:
     - **Environmental + Structural**: If the agent is environmentally constrained and also structurally indifferent, we don't have a leaf. Why? Because if it's environmentally constrained, we don't ask about its goals. This combination is possible but not represented. It might be unattractive because if the agent is indifferent, why constrain it? But it could be a defence in depth. Not explored much.
     - **Procedural + Epistemic**: We force a split at Q3. An agent might have a procedure that defers to information. But in our tree, if it defers only when the human is not misinformed, we put it in epistemic. If it always complies regardless of information, we put it in procedural. So no leaf combines both.

  - **Additional note on corrigibility**:
     - The term 'corrigible' is often used to refer to an agent that is shutdown compliant. In the taxonomy:
          - **Environmental**: Not typically called corrigible because it's not about the agent's design.
          - **Procedural**: Sometimes called corrigible if the procedure is designed to output compliance.
          - **Structural**: Might be called corrigible if the goals are designed to not care about shutdown.
          - **Epistemic**: Often considered a form of corrigibility, especially if the agent defers appropriately.
     - The most common association of 'corrigible' is with **Procedural** and **Epistemic** approaches, as they involve the agent's decision-making. **Structural** is also sometimes included. **Environmental** is not considered corrigibility by design.

