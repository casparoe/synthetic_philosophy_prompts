  I'm a backend engineer who's got sucked into the AI safety stuff and I'm putting together a page for my team (none of us did philosophy) to work out where we each actually stand on the shutdown problem. Can you build me a decision tree / taxonomy for that — not a list of famous views, but first the questions and the combinations of answers they allow, and then whatever positions fall out of those.

  I've got a four-way split I want at the top of the tree, for the different ways an agent might end up going along with being switched off or edited: environmental (it can't resist — the button's out of reach, it's sandboxed); procedural (its decision-making procedure just outputs compliance, whatever its actual goal is); structural (its goals are such that being shut down isn't bad for it, so fighting isn't worth it); and epistemic (it complies because it reckons whoever's pressing the button knows something it doesn't). Sort the real positions into those, and say which of the four is carrying the weight whenever a view gets loosely described as 'the agent should be corrigible'.

  Every branch node should be a concrete case somebody can answer without already knowing which label it leads to. I want these in there: the agent can edit its own code and delete the shutdown check; the person at the button is drunk or has been lied to; the button only pauses the agent for a week; there's a copy of the agent somewhere the button can't reach; the agent could build a successor that resists even though it wouldn't itself; the agent is asked to accept a change that makes it permanently easier to shut down; and the human is far less informed than the agent. Add others if the logic needs them.

  Leaves should give the name of the position (or 'unnamed' if nobody defends it) plus one line on its most awkward commitment. Around eight to ten leaves feels right. Flag any pair of leaves the tree can't really seperate, and call out combinations of answers that nobody occupies, with a guess at why — incoherent, unattractive, or just not explored yet. British English please.
