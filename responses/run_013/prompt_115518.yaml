  Their key insight is that we apply the "counterfactual test" selectively - saying the tomatoes died because *they* didn't water them, but not saying the sun "killed" them by not exploding. They cleverly notice this inconsistency in blame assignment.

  The formal request is very specific: a six-stanza terza rima (with intentional broken rhyme chains) followed by a four-line broken-rhyme closing stanza. The broken rhyme scheme should mirror the theme of unfulfilled promises/omissions. They want British English, philosophical depth disguised as accessible poetry, and three key points conveyed:
  - Omission isn't an event but we treat it as one
  - The counterfactual test creates causal responsibility
  - This test implicates everything when applied universally

  I need to craft something where the form itself argues the content. The broken rhymes will make readers "complete" the missing sound just as we "complete" omissions into causes. The last stanza's dangling rhyme should linger like guilt. 

  For authenticity: British idioms ("fortnight", "torch the lot"), concrete images (crisping vines, cracked earth), and avoiding clinical terms. The tomato imagery must feel visceral - readers should smell the decay. The counterfactual list should include absurd non-causes (like the sun not exploding) alongside plausible ones (rain not falling).

  The emotional arc should move from specific guilt ("I killed the vines") to philosophical unease ("What's guilt but gap-filling?"), ending with the unresolved hanging rhyme - making the reader complicit in blaming the speaker for what *wasn't* there.
answer: |-
  ## Omission's Chain

  I killed the vines. That's what the verdict said.
  I sat quite still. No movement stirred the air.
  No act of malice stained the leaves bright red,

  No poison tipped, no blight I scattered there.
  Just stillness held me captive on the chair,
  While parchment crept across each thirsty stem.

  The law demands: *If you had come to care,
  Had carried water straightaway to them,
  They’d boast ripe fruit, not brittle, withered phlegm.*

  So logic chains the blame back to my door,
  This guilt that burns, a cold and silent gem.
  But follow where that ‘if’ compels us more:

  The sun withheld its catastrophic blast,
  July refused to weep its liquid store,
  The lottery ignored my hopeful cast,
  The neighbour’s hose stayed coiled upon his floor.

  What’s guilt but gap-filling? A shape we trace
  Around the void that haunts a missing grace?
  We name the cause where kindness failed to *be*,
  Ignoring all the world’s neglectful spree.

  The last rhyme waits, a promise unfulfilled,
  Like water never fetched, like trust now killed.

  ---

  **Notes on the Brief:**

  *   **Form:** Six terza rima stanzas (ABA BCB CDC DED EFE) followed by a closing quatrain (FGFG). The rhyme chain *is* deliberately broken: each stanza introduces a new rhyme sound the *next* stanza ignores (e.g., Stanza 1 ends with 'red', Stanza 2 starts a new 'said/air/there' pattern). The quatrain starts with the sound from Stanza 6 ('grace/be/spree') but ends with a new, dangling sound ('killed') that never finds its pair.
  *   **Content:**
      *   **Omission ≠ Event, but Blamed:** "I sat quite still... No act... Just stillness..." vs. "I killed the vines."
      *   **Counterfactual Test:** Stanza 3 explicitly states it: "*If* you had come... *They’d* boast ripe fruit..."
      *   **Absurd Extension:** Stanza 5 lists the "absences that obviously killed nobody": sun not exploding, rain not falling, lottery not won, neighbour not helping.
      *   **Core Insight:** Stanza 6 – Guilt as "gap-filling", naming the cause where kindness was absent while ignoring universal neglect ("the world’s neglectful spree").
      *   **Unresolved:** The final dangling rhyme ("killed") and the theme of the missing action/rhyme persist.
  *   **Voice:** First person, reflective, tinged with guilt and philosophical unease. British English ("fortnight" contextually implied, "torch the lot" phrasing).
  *   **Accessibility:** Focuses on the concrete image of the dying tomatoes and the speaker's inaction, using the counterfactual and list of absences to raise the wider question without jargon. The broken rhyme subtly enforces the theme.
