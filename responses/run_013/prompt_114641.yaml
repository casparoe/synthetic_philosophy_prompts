  Here's the joke:

  > Einstein is sitting at his desk when he hears a voice in his head.  
  > **First Voice (Calm, Spinozan):** "Remember, Albert. There is no agent, no chooser. I am the necessary order. What you call 'your will' is simply the unfolding of causes you do not yet perceive. Your feeling of choice is an illusion born of ignorance."  
  > Einstein nods, serene. Suddenly, he reads a new paper on quantum mechanics.  
  > **Einstein (Outraged):** "This indeterminacy! This randomness! *God does not play dice with the universe!*"  
  > A pause. Then...  
  > **First Voice (Dryly):** "...And *you* were always going to say that."  

  **Why it works:**

  1.  **Spinoza's Impersonal God:** The "First Voice" explicitly articulates Spinoza's God: not an agent ("no agent, no chooser"), but the necessary order itself ("I am the necessary order"). This establishes the core metaphysical framework Einstein endorsed. The calm serenity reflects the intellectual acceptance of this view.
  2.  **Thoroughgoing Determinism (Including the Will):** The First Voice directly addresses the nature of the will and choice, stating Einstein's determinist position clearly: the feeling of choice is an "illusion born of ignorance" about prior causes. This sets up the fundamental conflict with quantum indeterminacy.
  3.  **The Dice Protest Smuggling in a Personal God:** Einstein's outburst ("God does not play dice!") is the key moment of tension. His protest inherently implies a God *capable* of playing or not playing – an entity with intentions, preferences, and agency ("playing" is an intentional act). This directly contradicts the Spinozan God just described by the First Voice.
  4.  **The Punchline Undercuts with Determinism:** The First Voice's retort ("...And *you* were always going to say that") is the core of the joke. It uses Einstein's *own* determinism against his emotional outburst:
      *   It highlights the hypocrisy: Einstein invokes an intentional God to protest indeterminism, while his own philosophy denies any real agency, even in himself.
      *   It frames the outburst itself as *determined*: Einstein wasn't freely choosing to protest; he was causally destined ("always going") to utter that specific phrase based on his prior state and the stimulus. His protest against randomness is revealed as a necessary, non-free event within the deterministic system he champions.
      *   It brings the focus back to the tension: The First Voice (Spinoza's God/Determinism) calmly points out that Einstein's use of the personal-God protest was itself inevitable, emphasizing the uncomfortable inconsistency *within Einstein's own position*.

  **Why someone who knows the position laughs:** They recognize the precise philosophical tension being exploited. The joke perfectly captures the irony of Einstein, the arch-determinist and proponent of an impersonal God, reflexively reaching for the vocabulary of a personal, intentional deity when faced with a challenge to his desired view of nature's order. The punchline delivers the satisfying twist by weaponizing his determinism against his own emotional reaction, exposing the internal conflict in a way that is both logically consistent with his stated views and deeply humorous due to its self-referential contradiction. It avoids the clichés by focusing on the internal monologue and the deterministic undercutting of the protest itself.
