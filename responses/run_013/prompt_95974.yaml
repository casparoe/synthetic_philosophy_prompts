  First, I need to parse their core claim: counterfactual morphology (past tense, "would") signals the antecedent's non-liveness in conversation, not a semantic difference. The arsenic case is crucial—it shows counterfactuals can be used when antecedents are true, so the marking can't presuppose falsity. The mirror case highlights how indicatives fail when antecedents are denied, suggesting their sensitivity to epistemic status. Embedding and morphology pose tougher issues: if "would" is just a pragmatic marker, why does negation target it so naturally? And why does English (and other languages) use tense morphology systematically for this?

