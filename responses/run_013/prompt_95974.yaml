answer: |-
  Here's the strongest case for your unified "if" view, followed by an honest assessment of where the consensus lies and where the fight is.

  ### The Case for a Unified "If"

  1.  **Core Thesis:** There is one semantic "if." Both indicative ("If Oswald didn't kill Kennedy, someone else did") and counterfactual ("If Oswald hadn't killed Kennedy, someone else would have") conditionals share the *same* core truth-conditional meaning. The morphological differences (past tense, "would") are not truth-conditional operators. Instead, they signal the *epistemic or conversational status* of the antecedent: specifically, that the antecedent is *not under consideration as a live possibility* in the current discourse context. This is a discourse-level feature – perhaps a presupposition, a conventional implicature, or a force marker.

  2.  **Biting the Oswald Bullet:** The counterfactual in the Oswald pair *is true*. It shares the same truth conditions as the indicative. The reason we hesitate to accept it stems entirely from the discourse signal. The indicative signals the antecedent *is* a live option; asserting it while simultaneously marking the antecedent as non-live (via the counterfactual morphology) creates pragmatic tension. It feels odd to strongly mark the antecedent as non-live while discussing a historical event where the antecedent is known to be false. The indicative feels more "neutral" in this context. The truth conditions are identical, but the packaging creates a different pragmatic effect. (Alternative Bullet: Neither has conventional truth conditions; they are devices for managing suppositions in discourse. The "wrongness" of the counterfactual is the infelicity of strongly marking the antecedent as non-live while discussing a known-false antecedent in a context where the indicative's neutrality is preferred).

  3.  **Arsenic Case:** This case *kills* views requiring antecedent falsity. On your view, it's straightforward. The counterfactual morphology ("had taken", "would have shown") signals that the speaker is *not treating* "Jones took arsenic" as a live possibility *in the context of exploring causes for the symptoms*. The speaker is deliberately setting aside the (perhaps known or suspected) truth of the antecedent to explore a hypothetical causal connection. The marking tracks epistemic/discourse status ("consider this hypothetically, not as an open question"), *not* truth value. It signals a *stance* or *mode of consideration*.

  4.  **Mirror Case:** The indicative *requires* its antecedent to be epistemically possible/live in the context. Declaring "Bob never danced" removes "Bob danced" from the realm of live possibilities. Using the indicative conditional ("If Bob danced...") *immediately after* violates this requirement – the antecedent is explicitly ruled out. The counterfactual, however, *signals* that the antecedent is *not* live. Saying "Bob never danced" explicitly makes "Bob danced" non-live, *satisfying* the precondition for felicitously using the counterfactual morphology. The marking is a *positive feature*: the counterfactual *has* the signal "antecedent non-live", which the indicative lacks. The indicative *demands* antecedent liveliness; the counterfactual *demands* (or signals) non-liveliness.

  5.  **Embedding & Negation:** This is the toughest challenge. The key move is to insist that the *core conditional content* (the "if...then..." relation) is what is embedded and negated, *not* the discourse signal. The signal (contributed by "had" and "would") operates at a different level.
      *   "It's not the case that if Oswald hadn't killed Kennedy, someone else would have" denies the core conditional relationship: it asserts that the connection between [~Oswald killed] and [someone else killed] does not hold in the relevant way.
      *   "Anyone who thinks that... is wrong" attributes to others the belief in that core conditional relationship and asserts that belief is false.
      The discourse signal (non-live antecedent) is part of the *frame* within which the conditional claim is made or evaluated, but not the core propositional content being asserted, denied, or attributed. Negation targets the asserted conditional relation.

  6.  **Morphology:** The systematic use of past tense morphology for non-past-time hypotheticality/counterfactuality across languages is a classic case of grammaticalization. An original temporal meaning ("past") gets extended to mark modality ("remoteness from reality/current expectations"). "Would" as the past of "will" fits: "will" expresses future projection; "would" expresses a "remote" (hypothetical, counterfactual) projection. The obligatoriness stems from it becoming a grammaticalized marker of this discourse function – it's how the language encodes the signal. Its systematicity doesn't entail truth-conditional meaning; grammaticalized discourse markers often become obligatory and morphologically regular.

  7.  **Future Pair:** "If it rains tomorrow the picnic will be cancelled" treats rain as a live possibility. "If it rained tomorrow the picnic would be cancelled" signals that rain is *not* considered a live possibility – perhaps the forecast is overwhelmingly sunny, or plans are already fixed regardless. It's the same mechanism as the Oswald pair: same underlying conditional relation (rain implies cancellation), differing only in the discourse signal about the antecedent's epistemic status. The morphological marking ("rained", "would") performs the same function here as in past counterfactuals.

  8.  **Cancellability:** Your intuition is correct. "If Oswald hadn't killed Kennedy, someone else would have, but of course Oswald did kill him" is redundant, not contradictory or infelicitous. This strongly suggests the antecedent falsity is *not* a presupposition of the counterfactual form. Presuppositions project through negation and aren't cancellable like this without anomaly (e.g., "The King of France isn't bald – France doesn't have a king!"). The counterfactual marking seems more like a conventional implicature or a strong signal of speaker stance – cancellable with redundancy, not contradiction. It passes your test: the signal works for both known-true (arsenic: "treat as non-live for hypothesis") and known-false (Oswald: "treat as non-live because it's settled") antecedents. The signal is about discourse/epistemic status, *not* truth value.

  **Strongest Version:** The core meaning of "if P, Q" is a single relation (e.g., a variably strict conditional, or fundamentally non-truth-conditional). The indicative uses this core directly. The counterfactual morphology ("had", "would") grammatically encodes a complex discourse signal: it conventionally implicates that the antecedent P is *not under consideration as a live epistemic possibility* in the current context, and that the consequent Q is presented *under the hypothetical assumption of P*. This signal operates at the level of speech act or discourse management, not truth conditions. Embedding challenges are handled by arguing that negation/attitude verbs target the core conditional content, not this higher-level signal.

  ### Consensus vs. Live Fight

  **(A) Basically Settled (Broad Consensus):**

  1.  **Antecedent Falsity Not Semantically Required:** There is *no* mainstream semantic account left that claims counterfactual conditionals *semantically entail* or *presuppose* the falsity of their antecedent. The arsenic case (and others) killed this decades ago. This is settled.
  2.  **Morphology ≠ Past Time:** The consensus is that the past tense in counterfactuals is primarily *modal*, not temporal. It marks "remoteness" from reality or current expectations. The cross-linguistic pattern of using past/irrealis morphology for conditionals is well-documented and not seen as evidence for a temporal meaning in the semantics of conditionals themselves.
  3.  **Indicatives Require Epistemic Possibility:** It's widely agreed that indicative conditionals generally require their antecedent to be epistemically possible in the context. Asserting the negation of the antecedent typically makes the indicative infelicitous (your mirror case). This is often linked to the "epistemic openness" or the "Ramsey Test" view of indicatives.
  4.  **Counterfactuals Often Signal Non-Liveliness/Falsity Pragmatically:** Most agree that counterfactual morphology *typically* signals that the antecedent is false or not considered a live option. The debate is about *how* (semantics? pragmatics?) and *how strong* this signal is (entailment? presupposition? conventional implicature? generalized implicature?).

  **(B) Live Fights (Genuine Disagreement):**

  1.  **Unified vs. Dual Semantics:** This is the **core fight** your paper enters. The dominant view is a **dual semantics**: indicatives are often analyzed as *epistemic* or *strict* conditionals (sensitive to epistemic possibilities), while counterfactuals are analyzed as *variably strict* or *similarity-based* conditionals (sensitive to metaphysical possibilities, often with a similarity ordering). **Your view (unified semantics + pragmatic difference) is a significant minority position.** Proponents exist, but the dual semantics camp is larger and more established. The Oswald pair is their prime evidence; proponents of dual semantics argue it *must* show a semantic difference.
  2.  **Truth-Conditional vs. Non-Truth-Conditional:** Related to the above, there's a major fight about whether *any* conditionals have truth conditions. Some argue all are non-truth-conditional (suppositional, probabilistic, expressivist). Others argue indicatives are non-truth-conditional but counterfactuals are. Others (the majority) argue both are truth-conditional, but differently. **Your view could fall into either the unified-truth-conditional or unified-non-truth-conditional camp; both are contested compared to dual-truth-conditional views.**
  3.  **Status of the Counterfactual Signal:** What *exactly* is the discourse contribution of "had" and "would"?
      *   **Presupposition?** Largely abandoned due to cancellability (your point).
      *   **Conventional Implicature?** A contender (as I framed it above), but debated. Critics argue it behaves differently from paradigmatic CIs.
      *   **Force Modifier / Speech Act Marker?** Another contender, but faces embedding challenges.
      *   **Generalized Conversational Implicature?** Some argue this, but the systematicity and obligatoriness of the morphology make this less plausible.
      *   **Part of the Semantics After All?** The dual-semantics camp argues it *is* truth-conditional.
      **There is no consensus here; it's a central point of contention for views like yours.**
  4.  **Embedding Under Negation/Attitudes:** This is the **Achilles' heel of non-truth-conditional and unified views** and the primary weapon of their opponents. Proponents of truth-conditional (especially dual) semantics argue that the natural interpretation of negated or embedded counterfactuals ("It's not true that if P had been, Q would have"; "She believes that if P had been, Q would have") *demonstrates* that they express a proposition with truth conditions. They see attempts to separate a "core content" from a "discourse signal" under negation as ad hoc or failing to capture the intuitive meaning. **If your view survives, it must provide a compelling and non-stipulative account of embedding that satisfies critics. This is currently unresolved and hotly contested.** Your proposed separation of "core content" vs. "signal" is a plausible line of defense within your camp, but it's far from universally accepted and faces significant skepticism.
  5.  **Handling the Oswald Pair:** While everyone agrees the two forms *differ*, the nature of the difference is contested. Dual-semantics proponents see it as semantic. You see it as pragmatic stemming from the discourse signal. **The disagreement over whether a purely pragmatic story can adequately explain the strong intuition that the counterfactual is *false* while the indicative is *true* is fundamental and unresolved.** Your bullet-biting strategy is coherent but remains controversial.

  **Strongest Surviving Version:** The view survives as a coherent, defensible, but minority position. Its strongest form is: **The core meaning of "if" is uniform (e.g., a strict conditional over relevant possibilities, or fundamentally suppositional). The indicative uses this core directly. The counterfactual morphology grammatically encodes a conventional implicature (or similar non-truth-conditional device) indicating that the antecedent is not epistemically live in the discourse context and the conditional is being assessed hypothetically. Embedding targets the core conditional content, not the implicature.** Its survival hinges entirely on successfully defending this account of embedding against the powerful objections from the dual-truth-conditional camp. If embedding fatally wounds it, the strongest *unified* view might retreat to a non-truth-conditional analysis for both types, but this faces the same embedding challenge. The core insight – that the morphological difference tracks discourse status, not fundamental semantic type – remains valuable even if the strongest unified semantic claim is weakened.
