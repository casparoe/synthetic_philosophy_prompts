answer: |-
  ### Essay Question (90 minutes)
  "Thomas Malthus’s *Essay on the Principle of Population* (1798) predicted that population growth would inevitably outstrip food production, leading to catastrophic famine unless checked by ‘misery’ (e.g., war, disease) or ‘vice’ (e.g., contraception). While this prediction failed to materialize globally in the two centuries following his work, some defenders argue Malthus was ‘right but early’—that his core theory remains valid and will eventually be vindicated.  

  Critically evaluate this ‘right but early’ defense using the following frameworks:  
  1. **Popper’s falsificationism**: Can the ‘right but early’ claim be empirically tested, or does it render Malthusian theory unfalsifiable?  
  2. **Lakatos’s methodology of scientific research programmes (MSRP)**: Would modifying Malthusian theory to accommodate historical counterevidence (e.g., the Industrial Revolution, demographic transition) represent a *progressive* or *degenerating* problem shift? Focus on three specific defensive strategies:  
     - (a) Extending the prediction’s time horizon indefinitely.  
     - (b) Narrowing the theory’s scope to exclude societies with sustained technological innovation.  
     - (c) Reinterpreting observed non-famines as evidence of a *suppressed* Malthusian equilibrium (e.g., via birth control or unsustainable resource use).  
  3. **Duhem-Quine thesis**: How do these strategies illustrate the challenge of assigning blame between a theory’s ‘core’ (e.g., population pressure inevitably triggers collapse) and its ‘auxiliary assumptions’ (e.g., fixed technological constraints)?  

  Conclude by judging whether the ‘right but early’ stance is a legitimate scientific argument or an *ad hoc* evasion of refutation. Crucially, specify what empirical evidence (if any) could *falsify* this version of Malthusianism."  

  ---

  ### Model Answer (≈800 words)  
  The ‘right but early’ defense of Malthusianism attempts to salvage its core premise—that geometric population growth *must* outstrip arithmetic resource growth—by reinterpreting its predictive failures. While superficially plausible, this move risks transforming Malthusianism into an unfalsifiable dogma under Popperian and Lakatosian scrutiny, particularly through the three defensive strategies outlined.  

  **Popperian Falsificationism** demands that scientific theories make risky, testable predictions. The ‘right but early’ claim initially appears to offer one: collapse *will* occur, just later. However, **strategy (a)—extending the time horizon indefinitely—destroys falsifiability**. Popper would argue that without a specified timeframe for collapse, no observation (e.g., another century without global famine) can refute the theory; failure becomes proof the deadline was too close. **Strategy (b)—narrowing scope** to pre-industrial or innovation-resistant societies—partially rescues testability but at great cost. If Malthus only applies where technology stagnates, the theory evades its biggest counterexample: the Industrial Revolution’s role in sustaining population growth. **Strategy (c)—re-describing non-famines as suppressed equilibrium**—is the most insidious. By claiming contraception or resource depletion are ‘checks’ proving Malthus *was* right (just delayed), defenders immunize the theory. Falling birth rates become evidence of ‘vice’, and ecological damage becomes ‘misery’, making the theory tautological: any outcome ‘confirms’ it. Crucially, Popper would demand specifying *what evidence could falsify the core claim*. For example: *perpetual global food surplus alongside stable population growth without catastrophic checks* would refute Malthus—but ‘right but early’ advocates dismiss this by redefining ‘surplus’ as temporary or ‘stability’ as suppression.  

  **Lakatos’s MSRP** judges theories by their ability to generate novel predictions and absorb anomalies without *ad hoc* patches. Malthusianism’s core is its ‘hard core’: population pressure inevitably triggers collapse. The ‘right but early’ defense modifies auxiliary assumptions (e.g., timescales, technological boundaries) to protect this core. **Strategy (a) is degenerative**: pushing collapse into an indefinite future yields no *new* predictions, only excuses. **Strategy (b) is a mixed bag**. Limiting scope to non-industrial societies might be progressive if it predicts collapse in specific contexts (e.g., pre-agrarian societies or failed states), but applying it *retroactively* to explain away the Industrial Revolution is degenerative—it abandons Malthus’s original universal claim without new insights. **Strategy (c) is profoundly degenerative**: reinterpreting counterevidence (e.g., declining birth rates via education) as ‘confirmation’ of suppressed checks produces no novel facts. Instead, it relies on *conceptual stretching* (e.g., calling voluntary birth control ‘vice’) that Lakatos condemns as *ad hoc*. A progressive shift would require predicting *new* phenomena—e.g., that green revolutions *must* fail by 2100—rather than rehashing old claims with elastic definitions.  

  The **Duhem-Quine thesis** underscores why these defenses are seductive yet suspect. It holds that theories face tests not in isolation but as webs of core and auxiliary assumptions. Malthusians exploit this by blaming auxiliaries (e.g., ‘we underestimated human ingenuity’) rather than the core. Yet this flexibility becomes pathological when *every* outcome is rationalized post-hoc. If famine occurs, Malthus was ‘right’; if avoided, checks ‘suppressed’ collapse. This mirrors pseudosciences like Marxism (revolution *must* come… eventually) or astrology (failed predictions are ‘misinterpreted’).  

  **Conclusion**: The ‘right but early’ stance is primarily an *ad hoc* evasion. While **strategy (b)** (scope restriction) *could* be legitimate if applied prospectively (e.g., ‘Malthus applies only to societies with sub-1% annual tech growth’), **(a)** and **(c)** render the core unfalsifiable. Legitimate science must specify *falsifying conditions*. For Malthusianism, this could include: *Global population stabilization above replacement level alongside per capita food growth for 300 years without catastrophe*. If ‘right but early’ advocates reject even this, they abandon empiricism. The demographic transition—driven by innovation *and* falling birth rates *without* Malthusian checks—remains a robust counterexample that ‘right but early’ defenses explain away only through degeneration.  

  ---

  ### Marking Scheme (25 marks total)  
  **A/B boundary (≈18/25)**: Requires clear articulation of *what could falsify* "right but early" Malthusianism. Answers that call it unfalsifiable but cannot specify *any* hypothetical counterevidence cap at B+.  

  | **Must-Hit Point**                                                                 | **Marks** | **Weak Answer Pitfall**                                                                 |
  |------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------------|
  | **1. Correctly analyzes Popperian falsifiability for each defensive strategy (a, b, c)**, showing how (a) and (c) destroy testability, while (b) may partially preserve it with scope restriction. | 6 | Vaguely labels defenses "unscientific" without specifying *how* each affects falsifiability. |
  | **2. Applies Lakatosian MSRP to judge progressive/degenerating shifts** for (a), (b), and (c), noting that (c) is degenerative due to *ad hoc* re-description, while (b) *might* be progressive if predictive. | 6 | Treats all defenses as equally degenerative; misses nuances in (b)’s potential. |
  | **3. Integrates Duhem-Quine thesis**: Explains how strategies shift blame from core (inevitable collapse) to auxiliaries (timeframe, tech assumptions). | 4 | Mentions Duhem-Quine but doesn’t link it to specific strategies. |
  | **4. Specifies concrete falsifying evidence** for "right but early" claim (e.g., sustained food surplus + stable pop without collapse for centuries). | 4 | Asserts theory is unfalsifiable but cannot describe *what would count* as refutation. |
  | **5. Evaluates legitimacy**: Judges (b) as *potentially* empirical (if predictive), but (a)/(c) as *ad hoc* immunizations. | 3 | Declares all defenses illegitimate without differentiation. |
  | **6. Uses counterexample**: Notes demographic transition as refuting original Malthus, forcing defenders into degenerative moves. | 2 | Omits demographic transition or treats it superficially. |
