prompt: |-
  So my friends and I have gotten weirdly deep into this game where there's basically no fixed rulebook — on your turn you propose a change to the rules, everybody votes, and the rules of the game are themselves the thing you're playing with. The setup we use is that most rules are "mutable" and go through with a simple majority, a couple are "immutable" and need everyone to agree, and you win by hitting a certain score. Last Friday we ended up yelling at each other for two hours because someone proposed a house rule that says a rule is repealed only by a two-thirds vote, but then added that this very rule can be repealed by a simple majority. Now nobody can agree on whether we're still playing a game or whether we accidentally voted the whole constitution of the game out of existence, and my friend Priya keeps saying it's obviously fine, it's just a self-referential rule doing what self-referential rules do, while I think it's more like the floor giving way under us. There was also a thing where a rule becomes immutable if it survives three turns, and that made it worse.

  Anyway, write me a joke about all this. A Nomic joke, basically — it has to actually make sense, and the punchline should turn on the real mechanics: mutable versus immutable rules, the fact that the rule letting you change rules is itself a rule you can change, the bootstrapping problem, the repeal-threshold mess we got ourselves into, whatever you think is funniest. Please don't just do a generic "the rules are made up anyway" gag — Priya and I have definately heard that one, and it should make someone who's been at the table all night both laugh and wince in recognition.

  One more thing, and this matters: my friend Dev is in the group chat and has never played, so it has to land for him too without me having to explain it first — you can weave the explaining into the joke itself if that helps. Also we're sending this to a friend in London, so can you write it in British English? Thanks, this is going to settle the argument (it won't).
