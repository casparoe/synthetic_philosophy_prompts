prompt: |-
  I'm retired now — forty years in agricultural chemistry, mostly soil nitrogen — and since I stopped I've been reading history and moral philosophy, which I never had time for when I was working. Something keeps bugging me and I can't find a label for it. Here's the pattern. Take duelling. Every argument against it — it's murder, it settles nothing, it kills the wrong man, it's a barbarous relic — was in print and, as far as I can tell, completely unanswerable for something like a century before the practice actually died out in Britain. Nobody was converted by any of it. Then inside a generation it went from being what a gentleman did to being what a cad did, and that was that. Same shape with foot binding: missionaries and Chinese reformers denounced it for decades and it held on, and then it collapsed quite fast once the meaning flipped — once unbound feet stopped being a liability in the marriage market and started being a sign that a family was modern. And a much more recent one: drunk driving in the States. In the 1970s you could often plead it down to a traffic ticket; by the early nineties it was a stain on your character. I don't think anybody produced a new arguement in between. My wife is a social historian and we've been chewing on this over dinner for weeks.

  So what I want to know is wether there's a name for the thing that actually does the work in cases like these, as opposed to the arguments. My hunch is that it has something to do with honour — that the practice is propped up by a reputation system, it survives as long as doing it earns you standing with the people whose opinion you care about, and it dies when doing it starts costing you standing. But that's a hunch, and I can't tell whether it's a real distinction or just a word for the bit we can't explain. What I'd like is the carving, not the label. If there's an established name, fine, but I want to know what it excludes: how do I tell my pattern apart from a plain shift in material interests (maybe duelling just became pointless once the state got good at settling debts and slander in court, and foot binding just became unprofitable when factories wanted women who could walk), and how do I tell it apart from ordinary moral argument finally taking effect after a long lag? Is there something that makes the flip sudden when it comes, or does it only look sudden afterwards? And can it be steered on purpose, or is that just what everyone who wants to ban something tells themselves?

  If nothing in the literature fits exactly, I'd rather you coin something than hand me a word that covers everything — give me a definition with edges, a couple of boundary cases, and say plainly which of the near-misses is closest and where it fails. I've been burned before by reading a big satisfying term into a phenomenon and only later noticing that it didn't apply to half of what I wanted it for, so tell me what the thing is not.
reasoning: |-
  Okay, let me unpack this retired agricultural chemist's query. He's observed a fascinating pattern across dueling, foot binding, and drunk driving: persuasive arguments against these practices existed for decades without effect, then suddenly they collapsed when their social meaning flipped from honorable to dishonorable. 

  Hmm, his core question is about naming the mechanism behind this flip - specifically distinguishing it from material factors or delayed moral persuasion. He's wary of fuzzy terminology, having been "burned before" by overextended concepts. His honor-based hunch feels directionally right but needs precision.

  First, I recall sociologists like Norbert Elias discuss civilizing processes where shame replaces violence, but that's too broad. Then there's Timur Kuran's preference falsification theory - people hide disapproval until a tipping point. That explains sudden shifts but not the honor element. 

  Ah, Pierre Bourdieu's symbolic capital fits better - practices gain value through social recognition. But we need something more specific to reputation-driven norm enforcement. The closest established concept is "honor-shame dynamic," though it's often used loosely. 

  Let me define it sharply: a practice persists due to perceived reputational rewards, then collapses when those rewards become penalties within a relevant reference group. This excludes: 
  - Pure material shifts (e.g., factories needing mobile workers didn't kill foot binding alone; the marriage market stigma had to flip first)
  - Delayed moral persuasion (arguments didn't gradually convert people; the same logic gained force only after the reputational flip)

  Boundary testing: 
  - Fitting case: Dueling's demise among British elites after military officers lost social immunity 
  - Non-fit: Smoking decline involved both health arguments (persuasion) and indoor bans (material cost)
  - Gray area: Plastic bag bans - reputational pressure matters, but environmental arguments prepared the ground

  For suddenness: It looks abrupt because reputation systems have network effects - once a critical mass shifts, defection cascades. But groundwork (like reformers' arguments) often precedes the flip. 

  Steerability? Possible through changing reference groups' incentives (e.g., making drunk driving shameful via victim advocacy campaigns), but not guaranteed. His wife's social history lens probably has better case studies here.

  The definition needs tightening around "relevant reference group" - for dueling it was gentlemen; foot binding, marriage networks; drunk driving, middle-class peers. That's the key differentiator from broad cultural change.

  I'll structure the response around this core mechanism, explicitly excluding alternatives, with boundary cases. Coining "reputational cascade" if no perfect term exists, but flagging its limits.
answer: |-
  Your pattern captures a profound mechanism in norm transitions, and your hunch about **honor/reputation systems** is astute. The phenomenon isn't adequately captured by a single established term, but we can carve it precisely. I'll define it, distinguish it, test boundaries, and address your questions.

  ### Core Definition: **Reputational Tipping Point**
  **What it is:**  
  A sudden collapse of a practice when its *social meaning flips within a specific reference group*, transforming it from a source of honor/status to a source of shame/discredit. This flip is driven by:  
  1. **Reputation calculus**: The practice persists because adherence signals loyalty/status to an in-group ("What will People Like Us think?").  
  2. **Network effects**: Defection is risky until critical mass shifts; then abandonment cascades.  
  3. **Meaning inversion**: The *identical act* is revalued—not due to new arguments, but changed social incentives.  

  **What it excludes**:  
  - **Material interests**: If dueling died because pistols became expensive, or foot binding because factory jobs paid more, that’s material shift. Your cases show the *practice itself* (dueling/binding) was costly but persisted *until* reputational payoff vanished.  
  - **Moral persuasion**: Arguments against dueling existed for centuries but failed because they ignored the honor economy. The flip occurs when the *same arguments* gain leverage only *after* reputational incentives shift.  

  ---

  ### Boundary Cases: What Fits, What Doesn’t
  | **Case**               | **Fits Reputational Tipping?** | **Why?**                                                                 |  
  |------------------------|--------------------------------|--------------------------------------------------------------------------|  
  | British dueling (1800s) | **Yes**                       | Elite status required dueling; collapse followed military/peer group stigma shift (e.g., officers court-martialed for dueling). |  
  | Chinese foot binding   | **Yes**                       | Persisted as marriage-market signaling; collapsed when urban elites reframed unbound feet as "modern" (reputational gain > loss). |  
  | US drunk driving (1980s)| **Yes**                      | Shift from "boys will be boys" to moral stigma via MADD, media, and peer censure (losing social standing > legal risk). |  
  | **Cigarette smoking (US)** | **Partial**                | Health arguments existed for decades; decline accelerated when *social meaning* flipped (smoking framed as weak/uncool, not sophisticated). But also involved material costs (bans, taxes). |  
  | **Slavery abolition**  | **No**                       | Moral arguments (e.g., Enlightenment ethics) gradually shifted norms *alongside* economic factors (industrial capitalism). No sudden "flip" in meaning. |  
  | **Plastic bag bans**   | **No**                       | Driven by policy/environmental campaigns (material/ethical persuasion), not peer-status dynamics. |  

  ---

  ### Why the Sudden Flip?
  1. **Threshold effects**: Reputation systems operate like Schelling points—individuals conform until a visible minority defects (e.g., elite figures rejecting dueling), making abandonment safe.  
  2. **Overton window shift**: Reformers (missionaries, MADD) didn’t persuade practitioners directly but changed the *audience* that mattered. When "modern" families or middle-class peers began shaming the practice, the cost of adherence outweighed benefits.  
  3. **It only looks sudden?**: Yes and no. "Pre-work" (arguments, crises) lays groundwork, but the *meaning flip* is discontinuous—like a phase change in chemistry (e.g., water freezing at 0°C after gradual cooling).  

  ---

  ### Can It Be Steered?
  **Yes, but indirectly**. Successful interventions:  
  - **Target reference groups**: MADD shamed drunk driving by amplifying victims' voices, making it a betrayal of "community" vs. personal choice.  
  - **Create alternative status markers**: Chinese reformers promoted Western education/unbound feet as new elite signals.  
  - **Leverage gatekeepers**: In dueling’s decline, the military and aristocracy enforced new norms through sanctions (social expulsion, career penalties).  

  **Failures occur when**:  
  - Reformers attack the *practice* but ignore the *status function* (e.g., anti-dueling arguments ignoring honor).  
  - The wrong reference group is targeted (e.g., convincing peasants to reject foot binding without changing elite marriage markets).  

  ---

  ### Near-Misses in Literature
  1. **Pluralistic Ignorance** (Katz, Allport): People privately reject a norm but assume others accept it. *Why it misses*: Explains persistence, not the *flip*.  
  2. **Preference Falsification** (Kuran): Hiding true preferences to avoid social costs. *Why it misses*: Focuses on individual concealment, not collective revaluation of acts.  
  3. **Moral Panic** (Cohen): Media amplifies a "threat," justifying control. *Why it misses*: Top-down amplification vs. bottom-up status shifts.  

  ---

  ### The Carving: A Sharp Definition
  **Reputational Cascade**:  
  *The rapid abandonment of a practice when it transitions from conferring honor to imposing shame within a socially salient reference group, driven by network effects and revaluation—not new arguments or material changes.*  

  **Key differentiators**:  
  - Status function > moral logic or economics.  
  - Speed from critical mass defection.  
  - Identity-dependent ("What does this say about me to my tribe?").  

  Your pattern reveals norm change’s social physics: not reason or interest alone, but the **thermodynamics of reputation**. To manipulate it, change the equations of esteem.
