prompt: |-
  You're a formal epistemologist — someone who works on the norms of belief and acceptance and knows the lottery/preface literature cold, but is also willing to say when a "requirement" everyone repeats is really just a prejudice of one camp. I'm putting together a unit on the lottery and the preface, and before I teach any of the proposed fixes I want the spec: what does an adequate theory of rational acceptance actually have to deliver?

  Set the purpose first so the criteria are anchored: I care about acceptance in the sense of "this is something I'm entitled to take as a premise in my reasoning and deliberation," for a bounded agent, not idealized omniscience. Then give me the desiderata list, and think it through slowly before you write — maybe brainstorm the cases first, then organize.

  For each requirement I want the case or consideration behind it. So: the cases it has to get right (the lottery, the preface, the humdrum case where I obviously do reason from premises I'm not certain of, the case where a lot of independently near-certain claims get conjoined), the distinctions it can't collapse (accepting p vs. having high credence in p vs. accepting that p is probable; accepting vs. acting; what's rational to accept vs. what's rational to assert), and the constraints it can't violate (deductive closure, consistency of what's accepted, whatever probabilistic coherence you think binds it, fallibilism — the thought that you can accept something while granting you might be wrong). Say for each whether it's non-negotiable or just a house preference, and which single requirement does the most work at ruling candidates out.

  The part I most want: flag any subset that looks jointly unsatisfiable. My suspicion is that a high-probability threshold plus closure plus consistency is a genuine trilemma and that everything else is commentary, but tell me if that's the wrong way to carve it, and what the cheapest thing to give up is. If the list turns out to be inconsistent, then the list is the result and I'd rather know that now.

  No citations or reading lists please, I can't get online — just the criteria. And skip scoring the existing theories against it; I'll do that live in class.
reasoning: |-
  Okay, the user is a formal epistemologist putting together a unit on the lottery and preface paradoxes. They want a clear specification of what an adequate theory of rational acceptance must deliver, focusing on acceptance as something to take as a premise in reasoning for bounded agents. 

  First, I need to understand their core request: they want desiderata grounded in cases and considerations, with clear distinctions and constraints. They're especially interested in whether there's an inherent trilemma between high-probability thresholds, deductive closure, and consistency. 

  Let me start by brainstorming key cases. The lottery paradox shows high probability alone isn't sufficient for acceptance when conjoined with closure and consistency. The preface paradox demonstrates that even highly reliable claims can jointly lead to inconsistency. Humdrum cases like trusting a map highlight that we constantly accept non-certain premises in daily life. Conjunction collapse shows the problem of aggregating many near-certain beliefs. 

  Now for distinctions: acceptance vs high credence is crucial - one is binary premise-taking, the other graded. Acceptance vs action matters because we might accept a premise but not act on it alone. Acceptance vs assertion involves different social norms. 

  Constraints include deductive closure (if you accept premises, you should accept their logical consequences), consistency (no contradictions), probabilistic coherence (credences should align), and fallibilism (acknowledging possible error). 

  The trilemma seems real: any two of high-probability threshold, closure and consistency can be satisfied, but all three together cause paradoxes. Fallibilism is non-negotiable for bounded agents. The conjunction distinction (accepting components vs whole) does heavy lifting in ruling out naive solutions. 

  I should note that the humdrum case challenges absolute certainty requirements, while preface-style cases challenge unrestricted closure. The cheapest constraint to relax might be full deductive closure, perhaps replacing it with limited closure under certain conditions. 

  The list isn't inconsistent per se, but reveals core tensions. The trilemma is central - most "solutions" sacrifice one vertex. I'll present this clearly, anchoring each desideratum to specific cases as requested.
answer: |-
  Here’s a distilled specification for an adequate theory of rational acceptance, grounded in core cases and constraints. The purpose is **premise-taking for bounded agents**: what an agent may treat as a *fixed input* for reasoning/deliberation, despite non-omniscience. Desiderata are organized by source, with non-negotiables marked (**★**). The central tension is indeed a trilemma.

  ---

  ### **I. Cases Driving the Desiderata**
  1. **The Lottery Paradox**:  
     - *Case*: You hold a ticket in a fair 1,000,000-ticket lottery. For any single ticket, it’s rational to accept "Ticket *n* will lose" (prob ≈ 0.999999%). Yet accepting this for *every* ticket implies accepting "All tickets will lose" — a contradiction.  
     - *Requirement*: **Non-negotiable fallibilism (★)**: Acceptance doesn’t require certainty. But this forces conflict with unrestricted closure/consistency.

  2. **The Preface Paradox**:  
     - *Case*: An author asserts each claim in her book (each backed by strong evidence) but adds a preface: "Some claim herein is false." Conjoining all claims + preface yields a contradiction.  
     - *Requirement*: **Distinction between component and aggregate acceptance (★)**: Rationality may permit accepting each conjunct while denying their conjunction.

  3. **Humdrum Practical Reasoning**:  
     - *Case*: You leave your house because you accept "My keys are in my pocket" (based on habit/memory), though not certain. You *reason from this* ("If keys are in pocket, I can drive").  
     - *Requirement*: **Permission for non-certain premise-taking (★)**: Without this, bounded agency collapses.

  4. **Conjunction Collapse**:  
     - *Case*: 1,000 independent claims, each 99.9% probable (e.g., "Sensor #1 is accurate"). Individually acceptable? But their conjunction has prob ≈ 37% — likely false.  
     - *Requirement*: **Rejection of "conjunction accumulation" (★)**: Accepting *A* and *B* needn’t entail accepting *A∧B*.

  ---

  ### **II. Key Distinctions (Non-Collapsible)**
  - **Acceptance vs. High Credence (★)**:  
    Acceptance is a binary commitment for reasoning; credence is graded. You can have *credence(p) = 0.999* without *accepting p* (e.g., lottery tickets).  
  - **Acceptance vs. Acting *as if p* (★)**:  
    Acting on *p* (e.g., betting) may be rational with high credence, but acceptance implies *premise status* in cognition (e.g., for modus ponens).  
  - **Acceptance vs. Assertion**:  
    Assertion involves communicative norms (e.g., knowledge rules); acceptance is internal. You might accept *p* for reasoning but not assert it.  
  - **Accepting *p* vs. Accepting *p is probable***:  
    The latter doesn’t license *p* as a premise (e.g., "It’s probable it will rain" doesn’t entail "Take an umbrella" without bridge principles).

  ---

  ### **III. Constraints (With Flexibility Graded)**
  1. **Fallibilism (★)**:  
     Rational acceptance must allow error-possible (non-certain) premises. *Non-negotiable for bounded agents*.  
  2. **Probabilistic Coherence (Weak)**:  
     Credences underlying acceptance should avoid Dutch books *where practical action follows*, but acceptance itself needn’t obey probability axioms. *House preference: negotiable*.  
  3. **Deductive Closure (Limited)**:  
     - *Minimal closure*: If you accept *p* and *p→q*, you should accept *q* (for core reasoning).  
     - *Unrestricted closure* (accepting all logical consequences) is **impossible (★)** — leads directly to lottery/preface collapse. *Cheapest to relax*.  
  4. **Consistency of Accepted Set (★)**:  
     Rational agents cannot *simultaneously* accept *p* and *¬p*. But note: **temporal/dynamic** consistency ≠ synchronic consistency across all premises.  

  ---

  ### **IV. The Core Trilemma & Joint Unsatisfiability**
  - **The Inconsistent Triad (★)**:  
    Any two of these can hold, but not all three:  
    (a) **High-Probability Threshold**: Rationality permits accepting *p* if *P(p) > t* (for some high *t* < 1).  
    (b) **Deductive Closure**: If you accept all premises in a valid argument, you must accept the conclusion.  
    (c) **Consistency**: The set of accepted propositions is logically consistent.  
  - **Why Inconsistent?**  
    Lottery/preface cases show that (a) + (b) → ¬(c). Denying (a) makes acceptance unusable for fallible agents. Denying (b) cripples reasoning. Denying (c) allows self-defeat.  
  - **Cheapest Escape**: **Deny Unrestricted Closure (b)**. Replace with:  
    - *Limited Closure* (e.g., closure under competent deduction *for non-aggregative steps*), or  
    - *Contextual/Structured Closure* (closure within "modules" of reasoning, but not globally).  

  ---

  ### **V. Summary: Non-Negotiables & Most Diagnostic Requirement**
  - **Non-Negotiables (★)**:  
    Fallibilism, Consistency (synchronic), Distinction (acceptance vs. high credence), Humdrum Permission.  
  - **Most Exclusionary Requirement**:  
    **The Conjunction Distinction** (from Preface/Conjunction Collapse). Rules out:  
    - Naive threshold views (if they allow unrestricted conjunction),  
    - Full-belief-as-maximal-credence views,  
    - Theories that conflate acceptance with assertion/knowledge.  
  - **Viable Paths**:  
    Theories must either **limit closure**, **reject threshold universality** (e.g., pragmatic thresholds), or **fragment acceptance** (e.g., partition-based views). The trilemma forces a choice.

  ---

  **Final Note**: The list isn't *inconsistent* per se — it defines the paradoxes to resolve. An adequate theory must explain **why** we intuitively judge the cases as we do (e.g., "lottery propositions feel different from humdrum ones"), while providing normative stability for premise-based reasoning. The tension between individual premise-taking and system-wide coherence is the engine of the problem.
