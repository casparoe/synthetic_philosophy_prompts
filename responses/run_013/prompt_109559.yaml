prompt: |-
  Some friends and I got into a long, slightly drunken argument after a podcast about Finland and NATO — one of us kept insisting that a country which won't ask its own citizens to defend it has basically already decided it isn't worth defending, and I've been turning it over ever since. So I'm trying to work out what I actually believe about when a state is allowed to make people fight, and I've got a pile of gut verdicts that I suspect don't all hang together. Here they are, roughly in the order they came out of my mouth. If my country is actually invaded and the government calls up everyone able-bodied, that's legitimate, and someone who dodges is free-riding on the people who go. If the same government conscripts people for a war of choice on the other side of the world, one that isn't about defending anyone here, that's not legitimate — not just dumb, wrong. A straight lottery where everyone's number can come up, no student deferments, no paying a substitute, strikes me as fair; the system where you could stay in school or buy your way out doesn't. But a purely volunteer professional army, which in practice ends up drawing mostly poor and rural kids while the rest of us stay home, I don't think is illegitimate at all, even though I just said the lottery is fairer. A religious pacifist who'll do alternative service should obviously get an exemption. Someone who refuses because he thinks this particular war is unjust — and it turns out I agree it's unjust — I want to let him off too; but a guy who refuses because he thinks a war I think is just is unjust, I want to throw the book at him. Switzerland, where everyone does a stint and keeps a rifle at home and the country stays armed-neutral and doesn't join anybody's war, I find genuinely admirable, and a small country keeping a big conscript reserve because it lives next to a giant seems fine for the same reason. A state hiring foreign contractors or mercenaries to do its fighting so its own citizens don't have to feels worse to me than conscripting those citizens would, even though the mercenaries are there voluntarily. Conscripting people in wartime for hospitals and civil defense and ditch-digging rather than front-line combat seems fine, maybe even obviously fine. And peacetime conscription for civilian "national service" — teaching, eldercare, that sort of thing — I honestly don't know what to think; part of me likes it and part of me thinks it's servitude with a nicer name.

  Is there a principle, or a small set of them, that gets most of these? The one I keep reaching for is something like: coercion is permissible when it's the price of a public good that the coerced person also shares in, and the burden is spread by a fair rule — but that seems to make the lottery come out ahead of the volunteer army, which I don't actually believe, so maybe that's the verdict I have to give up. I also can't tell whether my verdicts are tracking whether the war is just, or whether the burden is fairly shared, or whether the person is being used as a mere means, and I suspect it's a messy mix. Two other things are rattling around: one friend's claim that a draft is good precisely because it stops the public from sleepwalking into wars their own kids won't fight, and the old half-belief that if you can be made to fight you should get the vote and vice versa — military service as the price of citizenship, or citizenship as the reward for it.

  So: tell me what I believe, which principle or principles fit best, what they predict for a few cases I haven't listed (conscripting only men, a draft for a UN peacekeeping deployment, conscripting people to defend a country that's plainly going to lose anyway, a state that conscripts but forswears all offensive war), and which of my verdicts I should abandon. I don't want a reading list, just the argument — and if the honest answer is that "the war is just" is doing all the work and the conscription question is just downstream of it, say so, because I half-suspect that's the trick I'm playing on myself.
reasoning: |-
  Okay, let me try to unpack this user's query. They're wrestling with the ethics of conscription, based on various scenarios they've outlined. Their gut reactions seem inconsistent, and they're looking for underlying principles that tie everything together. 

  First, I notice their examples cover a spectrum: from legitimate defense against invasion to questionable wars of choice, fair vs. unfair conscription methods, exemptions, and even non-combat conscription. The user admits their judgments might be influenced by whether they perceive a war as just, or if burdens are shared fairly, or if people are treated as mere means.

  Hmm... their proposed principle about coercion for public goods with fair burden-sharing almost works but conflicts with their acceptance of volunteer armies. That's a key tension. Maybe the distinction lies in *what kind* of public good is at stake? Immediate collective survival vs. abstract national interests? 

  The user also mentions two intriguing ideas: the draft as a war-deterrent (because citizens won't tolerate wars their kids fight), and the vote-service linkage. These feel secondary but worth folding into a framework. 

  For principle-crafting, I should prioritize: 
  - **Just cause threshold** (defensive wars = yes, aggression = no) 
  - **Non-substitutability** (can't pay or delegate your way out of core obligations) 
  - **Fairness in distribution** (lottery > class-skewed volunteers) 
  But then how to square this with their comfort with volunteer armies? Ah—maybe voluntary service is *permissible* (not ideal) if it meets the other criteria? 

  The mercenaries point is telling: hiring outsiders feels worse than conscripting citizens because it violates communal reciprocity. That reinforces the "shared burden" angle. 

  Cases to test: 
  - **Conscripting only men**: Fails fairness unless applied universally (but what about gender equality?). Their other principles might reject this. 
  - **UN peacekeeping**: Could pass if framed as collective security (public good) but depends on the mission's nature. 
  - **Hopeless defense**: Still legitimate if the cause is just (e.g., resisting tyranny). 
  - **Defensive-only conscription**: Aligns well with just cause. 

  Their inconsistent exemption stance (pacifists vs. unjust war objectors) needs fixing. Consistency demands protecting both if the war is indeed unjust—but that requires a reliable adjudication mechanism (which rarely exists). 

  Biggest takeaway: Their judgments aren’t *just* about conscription mechanics; "just war" is doing heavy lifting. But they can’t ignore fairness. The synthesis: Conscription is only tolerable when (1) the threat is existential/defensive, (2) burdens can’t be fairly distributed voluntarily, and (3) exemptions are viewpoint-neutral. Volunteer armies get a pass because they’re non-coercive, even if imperfect. 

  ...Time to structure this into coherent principles without academic jargon. And gently tell them they’re underestimating how much "just war" shapes their instincts.
answer: |-
  Your intuitions are wrestling with three core principles that govern the legitimacy of state coercion for defense: **Just Cause**, **Communal Reciprocity**, and **Procedural Fairness**. Here's how they map to your judgments, resolve tensions, and predict unlisted cases:

  ---

  ### **Core Principles**
  1. **Just Cause**:  
     Coercion is only legitimate if the war serves a *defensive* or *existential* purpose for the political community. This distinguishes defense against invasion ("public good") from wars of choice ("state interest").  

  2. **Communal Reciprocity**:  
     Coercion must protect a shared community to which the coerced belong, and burdens must be non-substitutable (you can’t pay or delegate your way out). This rejects mercenaries (no shared stake) and unfair exemptions (violates reciprocity).  

  3. **Procedural Fairness**:  
     Burdens must be distributed by a rule that is neutral, transparent, and minimizes arbitrariness (e.g., a lottery). Wealth or status shouldn’t distort outcomes.  

  ---

  ### **How Your Verdicts Fit**  
  | Your Judgment                            | Principles Involved                                  | Tension Resolved? |  
  |------------------------------------------|-----------------------------------------------------|-------------------|  
  | Conscription for defense = legitimate    | **Just Cause** + **Communal Reciprocity**           | ✓                 |  
  | War of choice = illegitimate             | Lack of **Just Cause**                              | ✓                 |  
  | Lottery = fair; class exemptions = unfair| **Procedural Fairness** + **Communal Reciprocity**  | ✓                 |  
  | Volunteer army = acceptable              | Non-*coercion* overrides imperfect fairness         | ✓ (See Note 1)    |  
  | Pacifist exemption = legitimate          | Conscience vs. reciprocity; neutrality requires it  | ✓                 |  
  | Selective conscientious objection = messy| **Just Cause** is subjective; reciprocity demands consistency | ✘ (Abandon this) |  
  | Swiss model = admirable                  | **Just Cause** (deterrence) + **Reciprocity** (universal) | ✓              |  
  | Mercenaries < Conscription               | **Communal Reciprocity** (mercenaries lack shared stake) | ✓             |  
  | Non-combat conscription = fine           | Lower stakes, still serves communal survival        | ✓                 |  
  | Peacetime "national service" = ambiguous | Lacks **Just Cause**; risks state overreach         | ✘ (Case-by-case)  |  

  **Notes:**  
  1. *Volunteer armies*: You accept them because they’re non-coercive, even if imperfectly fair. **Communal Reciprocity** is satisfied if volunteers defend a community they’re part of (unlike mercenaries). Fairness concerns are real but don’t make it *illegitimate*.  
  2. *Selective conscientious objection*: Your inconsistency violates **Procedural Fairness**. Either allow all sincere objections or none. A state can’t privilege "correct" dissent.  

  ---

  ### **Predictions for Unlisted Cases**  
  - **Conscripting only men**:  
    Fails **Procedural Fairness** and **Communal Reciprocity**. If defense is a communal duty, exclusion based on gender is arbitrary. (Switzerland adjusted this; your principles demand it.)  
  - **Draft for UN peacekeeping**:  
    Depends on **Just Cause**. If the mission protects global stability (a diffuse public good), conscription lacks reciprocity unless citizens directly benefit. Likely illegitimate.  
  - **Conscripting for a doomed defense**:  
    **Just Cause** still applies: resisting tyranny or genocide is defensible even against odds (e.g., Warsaw Ghetto uprising). **Reciprocity** binds you to your community’s fate.  
  - **"Defensive-only" conscription**:  
    Aligns perfectly with **Just Cause** and **Reciprocity** (e.g., Switzerland). Your principles endorse this.  

  ---

  ### **What to Abandon**  
  1. **"The war’s justice determines objection legitimacy"**:  
     You must treat all conscientious objectors equally or none. Letting *your* allies dodge a war *you* deem just violates neutrality. Exempt only universal pacifists.  
  2. **Peacetime national service enthusiasm**:  
     Without existential stakes, coercion lacks **Just Cause**. It risks becoming exploitative (e.g., state-mandated cheap labor). Tolerable only if truly universal and non-punitive.  

  ---

  ### **The Role of "Just War"**  
  Your instincts confirm: **Just Cause is foundational**. Conscription is downstream of whether the war serves the *community’s survival*. But it’s not the whole story:  
  - **Reciprocity** explains why mercenaries feel worse than conscripts.  
  - **Fairness** explains why lotteries > volunteer armies in ideal theory, even if you accept the latter.  
  - Your friend’s "draft prevents sleepwalking" point ties to **Reciprocity**: When elites share burdens, wars face scrutiny.  

  **Final Principle**: *A state may coerce citizens to fight only when (1) the threat is existential, defensive, or humanitarian; (2) exemptions are limited to universal principles (e.g., pacifism); and (3) burdens are distributed fairly. All else is tyranny.* This salvages 90% of your judgments—and forces consistency where you waver.
