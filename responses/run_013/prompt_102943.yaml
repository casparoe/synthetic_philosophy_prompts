  For the story, I'll avoid lectures by embedding reasoning in character voices. Maybe:
  - An idealist (Miriam) representing universalization: "If all refrain, we all get $1000 safely."
  - A pragmatist (Ben) focused on individual gain: "If others refrain, I'd be a fool not to claim."
  - A conflicted observer (Dr. Aris) to articulate the tension.

  The instability should feel visceral. Perhaps show the town's mood shifting—initial optimism crumbling as people realize the collective good is individually unstable. 

  In the commentary, I'll highlight:
