  Okay, I need to help the user with their franchise theory problem. They had an argument with a friend about who should have the vote, and they want a solid theoretical framework to resolve it. Let me start by understanding their main concerns.

  First, they mentioned specific points: residency vs. citizenship, voting age at 16, compulsory voting. Their friend criticized their objections as intuitions without theory. So the user needs a structured list of desiderata that any franchise theory must meet. They also want conflicts between principles highlighted, especially around competence, equality, bright-line age, and vote as a right not a duty.

  The user provided three cases that must be included: adults under guardianship, reflexivity of changing voting rules, and random panels for technical decisions. I need to ensure these are addressed in the desiderata. 

  Looking at the key conflicts, the user suspects some principles can't all be satisfied together. The main tension is between competence-based exclusions and universal adult suffrage. If you require competence, you might exclude some adults, violating equality. A bright-line age avoids arbitrary decisions but includes incompetent adults and excludes competent minors. Compulsory voting clashes with the vote as a voluntary right.

  The user’s deeper need is probably to find a coherent theory that reconciles their intuitions with their friend's structured approach. They might want to strengthen their position in the debate by understanding where compromises are necessary. They also need clarity on non-negotiable principles versus flexible ones.

  Next, I should outline the desiderata. Start with legitimacy, then competence, equality, etc. For each, note the rationale and negotiability. The reflexivity issue (Legitimacy) is tricky because changing voting rules requires current voters' approval, creating a circularity. Competence must handle both children and adults under guardianship. The random panel case challenges universal participation.

  I need to identify the unsatisfiable subset. Competence, universal equality, bright-line age, and non-compulsory voting can't all coexist. Sacrificing one is necessary—likely competence or the bright line. For example, universal equality might require accepting some incompetence, or competence might need flexible assessments, which risks arbitrariness.

  Finally, evaluate theories. Instrumentalism breaks on reflexivity. Contractualism struggles with guardianship. Expressive theories might handle non-participation but not competence. Deliberative theory conflicts with random panels. Each has trade-offs.

  I should ensure the structure is clear: desiderata first, then conflicts, then unsatisfiable subset, and finally theory evaluations. Highlight the key tension points and necessary compromises, especially around competence vs. equality and compulsory voting. Make sure the three special cases are integrated throughout.
answer: |-
  Here is a specification of desiderata for a theory of the franchise, based on core principles and the tensions you identified. The list prioritizes fundamental requirements, inherent tensions, and addresses your three stipulated cases.

  **Desiderata for a Franchise Theory:**

  1.  **Legitimacy:** The franchise rules must confer legitimacy on the resulting government. *Rationale:* A government's authority stems significantly from being perceived as chosen by those subject to its power ("no taxation without representation"). *Status:* **Non-negotiable.** *Tension:* Directly engages the **reflexivity problem** - changes to franchise rules are enacted by the *current* electorate, risking self-perpetuation or exclusion of those who might challenge the status quo. Any theory reliant solely on "the community's decision" faces circularity here.

  2.  **Subjection Principle:** Those significantly and permanently subject to the binding laws and coercive power of the state should have a say in its composition. *Rationale:* To avoid being ruled without recourse or representation, ensuring a fundamental link between being governed and governing. *Status:* **Strong presumption (non-negotiable for many),** but scope (e.g., "permanently", "significantly") can be debated. *Tension:* Conflicts with Citizenship Principle; raises questions about non-resident citizens and resident non-citizens (your deportation point).

  3.  **Political Equality (Formal):** All individuals possessing the franchise must possess it equally (one person, one vote). *Rationale:* Foundational for democratic fairness and preventing caste systems. *Status:* **Non-negotiable core of democracy.** *Tension:* Pulls *against* Competence and potentially Subjection (if non-citizen residents are included while non-resident citizens aren't).

  4.  **Competence (Minimal Epistemic Threshold):** Voters should possess a minimum capacity to understand the nature of the choice and its potential consequences. *Rationale:* To ensure decisions reflect a basic comprehension of the political process and issues, protecting the polity from manipulation or wholly arbitrary choices. *Status:* **Negotiable in scope/application.** *Tension:* Directly conflicts with Universal Adult Suffrage and the Bright-Line Age Requirement. Forces treatment of **adults under guardianship** and children under a *consistent* standard. Defining/testability is problematic.

  5.  **Universality (Adult Suffrage):** All adult citizens/residents (depending on Subjection/Citizenship stance) should presumptively possess the franchise. *Rationale:* Embodies the principle of equal moral worth and prevents arbitrary exclusion of groups (historically problematic). *Status:* **Strong democratic norm, but negotiable boundaries (e.g., age, citizenship).** *Tension:* Conflicts with Competence (includes the incompetent) and the Bright-Line Requirement (demands a potentially arbitrary cut-off).

  6.  **Bright-Line Rule:** The criteria for franchise should be clear, objective, easily administrable, and resistant to discretionary manipulation. *Rationale:* Prevents arbitrariness, corruption, and disenfranchisement through vague standards; essential for practical implementation. *Status:* **Highly desirable, often treated as quasi-non-negotiable for key criteria (like age).** *Tension:* Pulls *against* Competence (competence varies individually, hard to assess objectively) and potentially Subjection (residency duration may be fuzzy). Necessitates treating the competent 15-year-old differently from the incompetent 16-year-old.

  7.  **Vote as Right (Non-Compulsion):** The franchise is an individual right that may be exercised or waived without penalty. *Rationale:* Protects individual autonomy and conscience; forcing participation may produce uninformed or resentful votes. *Status:* **Negotiable commitment of one camp.** *Tension:* Pulls *against* theories emphasizing civic duty or instrumental outcomes (e.g., mandate legitimacy, prevention of minority rule by motivated groups).

  8.  **Institutional Stability & Feasibility:** The franchise rules must be compatible with a stable, functioning, and practically administrable political system. *Rationale:* Abstract ideals fail if they create chaos, excessive cost, or unworkable procedures. *Status:* **Non-negotiable constraint (in practice).** *Tension:* Constrains all other desiderata, especially Competence (testing is hard/expensive) and potentially complex Subjection rules.

  9.  **Deliberative Potential:** The franchise should contribute to, or at least not fundamentally undermine, the potential for reasoned collective decision-making. *Rationale:* Democracy aims at more than aggregation of preferences; it seeks solutions through public reasoning. *Status:* **Negotiable commitment of one camp (deliberative democrats).** *Tension:* Challenges the **random panel proposal** (which prioritizes informed deliberation *over* universal participation for specific decisions) and raises questions about competence/compulsion. Pulls against pure expressive theories of voting.

  **The Unsatisfiable Subset & What Must Give:**

  The subset **Competence, Universal Adult Suffrage (Political Equality applied to adults), Bright-Line Age Rule, and Vote as a Right (Non-Compulsion)** is jointly unsatisfiable.

  *   **Why?**
      *   **Competence vs. Universality:** Universality demands including incompetent adults. Competence demands excluding them. You cannot have a universal franchise that simultaneously excludes adults based on competence.
      *   **Competence/Universality vs. Bright-Line Age:** A bright-line age rule (e.g., 18) is the standard way to approximate adult suffrage universally. However, it *excludes* competent minors (violating Competence if other competent individuals vote) and *includes* incompetent adults (violating Competence). A competence-based franchise *cannot* rely solely on a bright-line age; it requires individual assessment.
      *   **Non-Compulsion** is separable but highlights the conflict: Universality + Non-Compulsion accepts that many included voters may not participate or engage meaningfully, further conflicting with Competence goals.

  *   **What Must Give:**
      *   **Option 1: Abandon Strict Competence as a franchise requirement.** Accept that universality and a bright-line age mean including some incompetent voters and excluding some competent minors. This is the dominant modern democratic model. Competence is addressed indirectly (education, deliberation) or deemed less important than equality and bright-line rules.
      *   **Option 2: Abandon Universal Adult Suffrage (as strictly defined).** Adopt a competence standard and apply it consistently to *all*, regardless of age. This risks disenfranchising many adults (e.g., under guardianship, low education) and creates massive administrative burdens and potential for abuse, violating the Bright-Line Rule and Stability desiderata. It fundamentally breaks Political Equality for adults.
      *   **Option 3: Abandon the Bright-Line Age Rule (for competence).** Implement individual competence testing. This is administratively nightmarish, prone to bias and corruption, violates Stability/Feasibility, and would almost certainly undermine Legitimacy and Political Equality in practice. Universality is shattered.

  **The most common resolution is Option 1.** Societies prioritize Universality, Political Equality, and a Bright-Line Age, accepting that this means the franchise is not strictly contingent on individual competence. Competence is pursued through other means (education, civic culture).

  **Brief Verdict on Main Families of Theory:**

  *   **Instrumentalist (Voting achieves good outcomes/stability):** Breaks on **Legitimacy (reflexivity)** and struggles with **Subjection**. Why should *only* those deemed "instrumentally useful" get a vote? Can justify wide exclusions violating Universality/Equality.
  *   **Contractualist (Consent of the governed):** Breaks severely on **Legitimacy (reflexivity)** and **Subjection**. The disenfranchised cannot consent to the rules excluding them. Struggles consistently with **Guardianship/Children**.
  *   **Expressive (Voting as expression of standing/identity):** Breaks on **Competence** (expression doesn't require competence?) and **Deliberative Potential**. Accommodates **Non-Compulsion** easily but struggles with why expression shouldn't be universal (Universality tension). Can handle **Random Panels** if seen as a different expressive/instrumental mechanism.
  *   **Equality-Based (Franchise as marker of equal moral worth):** Strong on **Universality**, **Political Equality**, and **Subjection** (if resident-focused). Breaks on **Competence** (must include the incompetent) and necessitates a **Bright-Line Age** (creating the competence/age tension). **Compulsion** is harder to justify. **Random Panels** violate its core principle of universal equal say.
  *   **Deliberative (Franchise enables reasoned collective will formation):** Strongest on **Deliberative Potential**. Breaks severely on **Competence** if taken seriously (requires exclusion, violating Universality) or becomes incoherent if not. **Random Panels** align well here. Struggles with **Bright-Line Rule** for competence and **Legitimacy reflexivity**.

  The core tension remains between the demands of inclusion (Universality, Equality, Subjection) and the aspiration for an informed electorate (Competence, Deliberation), with the Bright-Line Rule and Legitimacy reflexivity acting as significant practical and theoretical constraints. Any coherent theory requires prioritizing some desiderata over others.
