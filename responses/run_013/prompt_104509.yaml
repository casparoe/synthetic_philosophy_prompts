prompt: |-
  I advise a small foundation that can fund three two-year postdocs in social choice theory, and I want the money to go where it will unlock the most downstream work on strategy-proofness after Gibbard–Satterthwaite. Which open questions or lines of work should they prioritise, and why? Candidates I have in mind include restricted preference domains, randomised or partial strategy-proofness, the computational limits of manipulation, and the endogeneity of preferences under deliberation, but I am open to something I have not listed. For each recommendation, explain why it is upstream of other work, how tractable it is for theorists rather than empirical researchers, how neglected it is, and what evidence over the next two years would move it up or down. Also say which fashionable applications, for example to blockchain governance or to AI systems that aggregate ranked preferences, are overrated or do not follow from the theorem. Please structure the response as: Bottom line (one paragraph); Ranked agenda (four items, each 100–150 words); Criteria and trade-offs (about 200 words); What would change the ranking (about 150 words); Overrated or deprioritised (about 150 words).
