answer: |-
  ### Bottom line
  Prioritize postdocs in computational hardness of manipulation, randomized/partial strategy-proofness, and restricted domains with ordinal welfare constraints, as these offer the most neglected, theoretically tractable pathways to unlock downstream progress on practical strategy-proof mechanisms beyond Gibbard-Satterthwaite, with measurable 2-year milestones to validate their potential.

  ### Ranked agenda (highest to lowest potential)  
  1. **Computational limits of manipulation**  
     *Why upstream*: Resolving complexity classes (e.g., NP-hardness) for manipulation informs *feasible* mechanism design. If manipulation is computationally intractable, mechanisms become de facto strategy-proof in practice.  
     *Tractability*: Purely theoretical (reduction proofs, approximation bounds).  
     *Neglect*: Understudied for ordinal mechanisms beyond voting (e.g., matching, allocation).  
     *2-year evidence*: Positive: Hardness proofs for common non-voting domains. Negative: Efficient algorithms found for rich preference classes.  

  2. **Randomized/partial strategy-proofness**  
     *Why upstream*: Expands solution space beyond deterministic impossibility. Randomization enables trade-offs (e.g., strategy-proofness in expectation) critical for hybrid mechanisms.  
     *Tractability*: Axiomatic/game-theoretic analysis; minimal empirics needed.  
     *Neglect*: Limited exploration of robustness (e.g., Bayes-Nash equilibria under partial SP).  
     *2-year evidence*: Positive: New impossibility-to-possibility transitions. Negative: Counterexamples showing susceptibility to refined manipulations.  

  3. **Restricted domains with ordinal welfare**  
     *Why upstream*: Identifies domains where GS binds less tightly (e.g., single-peaked + welfare maximization). Enables practical rules while retaining ordinality.  
     *Tractability*: Characterization theorems using social choice toolkit.  
     *Neglect*: Over-studied for voting, underexplored for allocation/matching with transfers.  
     *2-year evidence*: Positive: New SP + efficiency compatibility results. Negative: GS reemergence under mild domain expansions.  

  4. **Endogeneity of preferences under deliberation** (Wildcard)  
     *Why upstream*: Challenges GS’s fixed-preference assumption. If deliberation aligns preferences, strategy-proofness may become easier.  
     *Tractability*: Requires modeling preference formation (epistemic game theory). Riskier for pure theorists.  
     *Neglect*: Largely terra incognita in mechanism design.  
     *2-year evidence*: Positive: Formal model showing deliberation shrinks manipulable preference profiles. Negative: Intractability in equilibrium analysis.  

  ### Criteria and trade-offs  
  **Upstreamness** prioritized foundational gaps enabling multiple applications (e.g., computational SP affects blockchain *and* matching). **Tractability** favored pure theory (proofs > simulations) to fit 2-year postdocs. **Neglect** emphasized areas with <5 major papers since 2020. Trade-offs: Computational SP risks narrowness if hardness results are too context-specific. Partial SP’s flexibility may lack unifying frameworks. Restricted domains risk incrementalism without welfare links. Endogeneity’s novelty offsets theoretical risk but demands interdisciplinary skill. Weighted: Upstreamness (40%), tractability (30%), neglect (20%), measurability (10%).  

  ### What would change the ranking  
  1. **Computational SP falls** if: Breakthroughs show manipulation is efficiently solvable for key mechanisms (e.g., probabilistic serial rule) or quantum computing trivializes hardness.  
  2. **Randomized SP rises** if: Unexpected connections to federated learning/AI alignment emerge, showing randomization defeats new manipulation types.  
  3. **Endogeneity rises** if: Behavioral experiments (e.g., prediction markets) robustly demonstrate preference convergence reducing manipulation, making theory more feasible.  
  4. **Restricted domains fall** if: Meta-analysis reveals most "new" SP domains are isomorphic to known cases.  

  ### Overrated or deprioritised  
  **Overrated applications**:  
  - **Blockchain governance**: GS is misapplied; on-chain voting often lacks preference aggregation (e.g., token-weighted "governance" isn’t social choice). Manipulation stems from capital concentration, not GS.  
  - **AI preference aggregation**: GS applies to *any* rank-aggregating AI, but hype ignores that SP impossibility remains unless computational/randomized solutions are integrated. Using AI to "bypass" GS is misguided.  
  - **Participatory budgeting**: While relevant, its constraints (project indivisibility, fixed budgets) make GS less binding than often claimed; SP research here is incremental.  
  **Deprioritized**: Empirical mechanism testing (lacks upstream theory impact), asymptotic strategy-proofness (mature field), or deterministic cardinal mechanisms (dominated by randomized approaches).  

  ---
  This prioritization maximizes foundational leverage: Computational SP circumvents GS via complexity; randomization relaxes it axiomatically; restricted domains + welfare constrain it; endogeneity recontextualizes it. All offer theory-first, measurable progress within 2 years while sidestepping overhyped applications.
