  We are designing an activity to help a group of non-specialist adults encounter the gender-equality paradox through their own choices. The paradox is that in more gender-equal countries, some measured differences (like the choice of college majors or careers) between men and women are larger than in less equal countries. The goal is to have them explore possible explanations: innate differences, cultural factors, or methodological issues (like the idea that in societies with fewer constraints, choices might reflect preferences more strongly).

  Activity Title: The Preference Puzzle

  Overview:
  The activity is a simulation game in which participants make choices in two different societal settings (representing a "constrained" society and a "free" society). They will be divided into two groups (without knowing the societal setting of the other group) and make a series of choices. The choices will be designed such that, when revealed, the group in the "free" setting shows more pronounced gender differences in choices than the group in the "constrained" setting.

  Rules:

  1. Participants are randomly divided into two groups (Group A and Group B) and taken to separate rooms (if possible) or different parts of the same room. Each group is given a set of rules and a scenario without knowing the other group's scenario.

  2. Each participant is given a role: either "Type X" or "Type Y" (representing gender, but we avoid using the words "man" and "woman" to prevent immediate associations and to abstract the situation). The roles are assigned randomly, with roughly equal numbers of X and Y in each group.

  3. The activity consists of 10 rounds. In each round, participants choose between two options (Option 1 and Option 2) for a hypothetical scenario. The scenarios are the same for both groups, but the rules for making choices differ.

     - For Group A (the "constrained" society): Participants are told that in their society, there are strong economic pressures and limited opportunities. They are required to choose the option that is labeled as the "safe" choice (which is the same for both Type X and Type Y) in 7 out of the 10 rounds. In the remaining 3 rounds, they can choose freely.

     - For Group B (the "free" society): Participants are told that they live in a society with abundant opportunities and no constraints. They can choose freely in all 10 rounds.

  4. The scenarios are designed such that, based on pre-tested preferences (which we will simulate by having a built-in preference tendency for Type X and Type Y), Option 1 is more appealing to Type X and Option 2 to Type Y. However, the participants are not told this.

  Example Scenarios (each round has a different scenario, but similar in structure):

  Round 1: Choosing a college major
     - Option 1: Engineering
     - Option 2: Nursing

  Round 2: Choosing a job
     - Option 1: Construction worker
     - Option 2: Preschool teacher

  ... and so on. We design 10 such pairs. We choose fields that are stereotypically associated with gender (but note: we are using abstract types to avoid priming).

  5. For Group A, in the 7 constrained rounds, they are forced to choose the "safe" option. We define the safe option as the one with a stable income and high demand in their society. For example, in the constrained society, the safe option for both rounds might be:
     - Round 1: Engineering (because it's in high demand and pays well)
     - Round 2: Construction worker (same reason)

     But note: we must be consistent in defining the safe option for each round. We choose one option per round as the safe one (and it must be the same for both types). However, we design the scenarios so that the safe option is sometimes the one typically preferred by Type X and sometimes by Type Y? Actually, to simulate the constrained society pushing everyone to the same options, the safe option should be one that is economically safe, regardless of the typical preference. But in reality, in constrained societies, the safe options might be male-dominated because of historical reasons? To keep it simple and avoid complexity, we will make the safe option the same for both types and choose an option that is economically safe but does not necessarily align with the typical preference of one type.

     However, note the goal: we want the constrained society to show less difference between types because they are forced to choose the safe option. So we design the safe option to be sometimes Option1 and sometimes Option2? Actually, we can fix it arbitrarily. But to make it realistic, we might assign safe options that are traditionally male-dominated (reflecting historical economic structures) but that's an extra layer we might avoid. Alternatively, we can have the safe option vary arbitrarily. The key is that in the constrained society, the forced choices will override the inherent preferences.

     How to assign safe options? We can predefine for each round which option is safe. We can make it so that in half the forced rounds the safe option is Option1 and in half Option2? But then it might not push the choices to be the same for both types? Actually, if the safe option is the same for both types, then in the forced rounds, both types are making the same choice. In the free rounds, they can choose according to their preference.

     For Group B, they always choose freely.

  6. Participants record their choices on a sheet (or via an app if available) without discussing with others.

  7. After 10 rounds, the groups come together. The facilitator collects the data and displays the aggregate results for each group (without revealing the group rules at first).

     - For each group, we show the percentage of Type X and Type Y that chose Option1 in each round (or an average over rounds).

     We expect to see:
       - In Group A (constrained): In the 7 forced rounds, both types choose the safe option (so 100% of both types choose that option in those rounds). In the 3 free rounds, we expect Type X to choose Option1 more and Type Y to choose Option2 more. But overall, the difference between Type X and Type Y will be reduced because of the forced rounds.
       - In Group B (free): We expect a consistent pattern: Type X choosing Option1 more often and Type Y choosing Option2 more often. Thus, the difference between the types will be larger.

     So when we average over all 10 rounds, we expect:
       - Group A: Smaller difference between Type X and Type Y in the proportion choosing Option1 (because they were forced to choose the same in 70% of the rounds).
       - Group B: Larger difference between Type X and Type Y.

  8. The facilitator then reveals the rules of the two groups: Group A was the constrained society and Group B the free society.

  Debrief:

  The facilitator guides a discussion around the following:

  1. What patterns do we see in the data?
     - In the constrained society, the choices of Type X and Type Y were more similar. In the free society, they were more different.

  2. Why might this have happened?
     - In the constrained society, people were forced to make safe choices regardless of their type. This reduced the expression of individual preferences. In the free society, people could choose according to their preferences.

  3. How does this relate to the real-world gender-equality paradox?
     - The paradox: In more gender-equal (and richer) countries, we see larger differences in choices (like college majors) between men and women. This activity suggests that when constraints are removed, innate preferences (if we assume that Type X and Type Y have different inherent preferences) might become more visible.

  4. But what are the possible explanations for the pattern we see?
     - Innate preferences: The types have inherent differences that are expressed when free.
     - Cultural factors: Even in the free society, cultural norms might have influenced the choices? (But note: in our activity, we didn't introduce cultural norms explicitly, so this might be a point to discuss: did participants feel any implicit pressure based on their type?)
     - Methodological: In the constrained society, the forced choices might have hidden the true preferences. Also, the way we defined the safe option might have influenced the pattern.

  5. Further questions:
     - Does the pattern we observed mean that the free society is better? Why or why not?
     - What does it imply about how we judge a society's arrangements? (e.g., should we aim for a society where everyone is free to choose, even if that leads to more gender differences? Or should we aim for a society where we try to achieve equal outcomes?)

     We want to highlight that the pattern does not necessarily imply that the differences are innate. It could also be that in the free society, cultural factors (like stereotypes) are more strongly influencing choices? Or that the removal of constraints allows for the expression of culturally acquired preferences? But note: in our activity, the preferences were assigned arbitrarily (we built them in by having Type X and Type Y have different tendencies). However, we didn't tell the participants that. So we can ask: why did Type X and Type Y choose differently? Was it because of something about the types, or because of the way the options were presented?

  6. The facilitator then introduces the real-world paradox and the three main explanations (innate, cultural, and methodological). The group can discuss which explanation they find most compelling and why.

  What will predictably go wrong:

  1. Participants might not follow the rules: In Group A, they might resist being forced to choose the safe option. Solution: The facilitator must emphasize that they are role-playing and must follow the rules of their society.

  2. The pre-defined preferences might not hold: We assume that Type X will prefer Option1 and Type Y Option2. But in reality, participants might not have these preferences. Therefore, we must design the options to be appealing in a stereotypical way? But we don't want to reinforce stereotypes. Alternatively, we can assign the preferences arbitrarily without labeling. To avoid this, we can:

     - Instead of relying on real preferences, we assign a "preference rule" to each type. For example, we tell Type X: "In free choices, we would like you to choose Option1 in at least 7 out of the 10 rounds" and Type Y: "In free choices, choose Option2 in at least 7 out of 10 rounds." But that would be too artificial and might not feel like a real choice.

     Alternatively, we can design the scenarios so that they are abstract and the options are labeled neutrally (e.g., Option A and Option B) and then assign a preference rule arbitrarily. We can tell Type X: "You tend to prefer Option A" and Type Y: "You tend to prefer Option B" and ask them to follow that tendency in free choices. But that might feel forced.

     Another idea: we can use scenarios where the options are not gender-stereotyped but are instead about abstract characteristics. For example:

     - Round 1: Choose between a job that requires working with things (Option1) and a job that requires working with people (Option2).

     And we tell Type X: "In free choices, you prefer jobs that involve working with things" and Type Y: "In free choices, you prefer jobs that involve working with people." This is arbitrary but avoids real-world stereotypes. However, it still requires participants to role-play a preference.

     Given the non-specialist group and the desire for natural choices, we might have to accept that the pattern might not emerge as strongly. We can then use the actual data from the activity, even if it doesn't show the pattern, to discuss why. But that might weaken the point.

     Given the time constraints, we might use the assigned preference method. We tell participants:

     "You are Type X (or Y). In your personal preferences, you have a tendency to prefer one type of option. In the free choices, please choose according to this tendency: Type X, you prefer Option1 in each round; Type Y, you prefer Option2 in each round."

     This ensures the pattern. But it removes the element of personal choice. However, it serves the purpose of illustrating the mechanism.

     We decide: We assign the preferences explicitly to ensure the pattern emerges. We explain to participants that for the sake of the activity, we are assigning a preference pattern to each type.

  3. The debrief might be rushed in 90 minutes: The activity might take 45-60 minutes, leaving only 30-45 minutes for debrief. We need to keep the activity tight.

  4. Participants might feel uncomfortable with the assignment of types: We can avoid using gender labels by using neutral terms (Type X and Type Y).

  Materials:

  - Two sets of instruction sheets (for Group A and Group B).
  - Choice recording sheets for each participant (or a central digital tool).
  - A way to display the results (whiteboard or projector).
  - Timer for rounds.

  Scoring:

  We are not scoring for individual winners but for the pattern. We can tell participants that the goal is to see how societal rules affect the choices of the two types.

  Honest note on what the activity cannot reproduce:

  The activity simplifies the real-world situation in several ways:

  1. In the real world, preferences are not randomly assigned and may be shaped by a lifetime of cultural influences. In our activity, we assigned fixed preferences arbitrarily. Therefore, the activity cannot address the origin of preferences (whether innate or culturally acquired). It only shows that when constraints are removed, pre-existing differences (whatever their source) become more visible.

  2. The activity does not capture the complexity of real-world constraints and opportunities. In reality, constraints are not as binary (forced vs. free) and may interact with cultural norms in subtle ways.

  3. The activity cannot reproduce the long-term societal and economic factors that shape the gender-equality paradox. We are simulating a one-time choice, whereas real-life choices are made in a rich context.

  Despite these limitations, the activity serves as an entry point to discuss the paradox and the possible explanations.

  Revised Activity Structure:

  1. Introduction (5 mins): Explain that we are doing a simulation to explore how societal rules affect choices. Assign participants randomly to Group A or B and to Type X or Type Y.

  2. Instructions (10 mins):
     - Group A (constrained society): They will make 10 choices. In 7 of them (specify which rounds, e.g., rounds 1,2,3,5,6,7,9) they must choose the safe option (which is provided for each round). In the remaining 3, they choose freely. Also, they are told: "As a Type X, in free choices you prefer Option1. As a Type Y, in free choices you prefer Option2."
