     Round 1: safe option = Option1
     Round 2: safe option = Option2
     Round 3: safe option = Option1
     Round 5: safe option = Option2
     Round 6: safe option = Option1
     Round 7: safe option = Option2
     Round 9: safe option = Option1

     Then in free rounds (4,8,10) they choose according to their type.

  3. Choice Rounds (20-25 mins): Run 10 rounds, each round taking about 1-2 minutes. Display the scenario and options for that round. Participants record their choice.

