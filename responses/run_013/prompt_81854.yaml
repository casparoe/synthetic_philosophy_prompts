  ### Case: Security Protocol Activation at a Research Facility

  **Setting:**  
  A research facility has three security analysts, Alice, Bob, and Carol. They monitor an automated system that occasionally flags a routine security protocol (action) for activation. Activating the protocol involves minor disruptions: it requires staff to re-authenticate credentials (costing 5 minutes per employee) but offers negligible security benefits. The true value of activation is -1 unit (net loss). Each analyst independently reviews the system flag and decides whether to activate the protocol. Activation occurs if any one of them approves it. The analysts are rational, share identical training and data (common evidence), value efficiency equally, and this is common knowledge. There is no bias, misinformation, or disagreement.

  **Data Generation:**  
  - True value, \(V = -1\) (net loss).  
  - Each analyst receives an unbiased but noisy estimate \(s_i = V + \epsilon_i\), where \(\epsilon_i \sim \mathcal{N}(0, 4)\) (noise variance \(\sigma^2 = 4\), so \(\sigma = 2\)).  
  - Estimates are independent across analysts.  
  - Prior belief: \(V\) has an improper flat prior (agents use only their signal for estimation).  
  - Decision rule (naive): Activate if \(s_i > 0\).  

  **Event:**  
  - True \(V = -1\).  
  - Alice observes \(s_A = 1.0\), Bob \(s_B = -0.5\), Carol \(s_C = -1.2\).  
  - Alice activates the protocol (since \(1.0 > 0\)); activation occurs.  

  ---

  ### (1) Verification of Specifications  
  - **Three agents:** Alice, Bob, Carol.  
  - **Ordinary stakes:** Activation causes minor productivity loss (equivalent to $100 per incident), no catastrophe.  
  - **Rational, same evidence/values, common knowledge:** All use identical \(s_i = V + \mathcal{N}(0, 4)\); decisions based on maximizing expected value given their signal. Common knowledge ensures they know others follow the same process.  
  - **Action worth not doing, error from decision structure:** True \(V = -1 < 0\), so ex ante correct decision is **not act**. Error occurs due to unilateral activation (Alice’s high estimate triggers it), not individual mistakes.  
  - **Defensible individual decisions:**  
    - Alice: \(s_A = 1.0\) implies \(E[V|s_A] = s_A = 1.0 > 0\) (under flat prior). Activating is defensible.  
    - Bob: \(s_B = -0.5 < 0\), does not activate. Defensible.  
    - Carol: \(s_C = -1.2 < 0\), does not activate. Defensible.  
  - **Ex ante correct decision:** Not act (since \(V = -1\)).  

  **Probabilities:**  
  - \(P(\text{individual acts} | V = -1) = P(s_i > 0) = P(\epsilon_i > 1) = 1 - \Phi(0.5) \approx 0.3085\).  
  - \(P(\text{group acts} | V = -1) = 1 - (1 - 0.3085)^3 \approx 0.669\).  
  Thus, the group acts with 66.9% probability when they shouldn’t.  

  ---

  ### (2) Verdict of Three Procedures  
  1. **Act if your estimate clears your threshold (Alice’s rule):**  
     - Each acts if \(s_i > 0\).  
     - **Result:** Group acts (Alice activates). **Incorrect.**  
  2. **Act only if pooled evidence supports it:**  
     - Pooled evidence: Average signal \(\bar{s} = (1.0 - 0.5 - 1.2)/3 = -0.233\).  
     - Activate if \(\bar{s} > 0\). Here, \(-0.233 < 0\), so **no activation. Correct.**  
  3. **Act only if you would be content for every agent to act on the same rule (Kantian rule):**  
     - Alice asks: "If all analysts with \(s_i > 0\) act, is the expected value positive?"  
     - Under flat prior, \(E[V] \approx \text{mean signal} = 1.0\) for her. Probability of activation by group is high, so expected value \(\approx 1.0 > 0\). She activates. **Incorrect.**  

  **Which gets it right?**  
  - **Pooled evidence (Procedure 2)** gets it right.  
  - **Why?** Pooling averages out noise: \(\bar{s} = -0.233\) accurately reflects \(V = -1\) (noise cancels), avoiding overreaction to high individual estimates. The individual threshold (Procedure 1) ignores selection bias (activation requires only one high estimate), and the Kantian rule (Procedure 3) does not mitigate this bias.  

  ---

  ### (3) Feature Doing the Work and Neutralization  
  - **Feature:** Unilateral structure (any one agent can trigger action) combined with multiple agents and noisy estimates.  
  - **Neutralization:** Require unanimity (all must approve to act).  
  - **Survival of pattern:**  
    - \(P(\text{group acts} | V = -1) = P(\text{all } s_i > 0) = (0.3085)^3 \approx 0.029\).  
    - Probability drops to 2.9%, and Alice’s \(s_A = 1.0\) is insufficient (Bob/Carol do not approve).  
    - **Pattern does not survive.** Activation is rare and justifiable only with extreme noise.  

  ---

  ### (4) Defender’s Attack and Rebuttal  
  - **Attack:** "Alice should adjust for the unilateralist’s curse. Knowing others might act, she should use a higher threshold than \(s_i > 0\) to avoid unnecessary activation."  
  - **Does it land?**  
    - **Yes, partially.** A fully rational agent (accounting for game structure) would use pivotal reasoning: Act only if \(E[V \times I(\text{pivotal}) | s_i] > 0\).  
    - Here, \(E[V \times I(\text{no other activates}) | s_A = 1.0]\) requires integrating over \(V\) and others’ signals. With a proper prior (e.g., \(V \sim \mathcal{N}(0, 1)\)):  
      - Posterior \(E[V|s_A] = (0 \cdot 1 + 1.0 \cdot 0.25)/(1 + 0.25) = 0.2\) (not 1.0).  
      - Pivotal probability (others have \(s_j < 0\)) is low if \(V\) is near 0.2, but \(E[V \times \text{pivotal prob}]\) may be negative.  
    - **Result:** Under full rationality, Alice might not act, breaking the curse.  
  - **Conclusion:** The specifications **cannot be fully jointly satisfied** with rational agents.  
    - **Obstruction:** Full rationality (with common knowledge) requires agents to discount for selection effects. If Alice accounts for the curse, her defensible individual decision to act disappears. The case only appears to work under naive rationality (ignoring game structure).  

  ### Final Assessment  
  The case meets all specifications *only if* agents naively ignore the unilateralist’s curse. Under full rationality, the curse is broken by pivotal reasoning, making individual activation indefensible. The core tension is between "defensible on own information" (naive) and "full strategic rationality" (discounting for selection). For the curse to persist, agents must lack awareness of the decision structure’s pitfalls—violating full rationality. Thus, the specifications are jointly satisfiable only under bounded rationality.
