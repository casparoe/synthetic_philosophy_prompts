  So for branch A (responsible in Frankfurt case):

  Sub-question: In that case, do you think Jones could have avoided stealing the wallet? (i.e., could he have done otherwise?)

  Answers:
  - A1: Yes, he could have avoided it (minimal alternative or conditional analysis).
  - A2: No, he could not have avoided it (so they drop the avoidability requirement).

  Now, for A1 (could have avoided it), we need to see what they mean by "avoided". We ask:

  But if Jones had tried to avoid it, the neuroscientist would have intervened. So in what sense could he have avoided it? Do you mean that he could have tried to avoid it, even if he would have been stopped?

  Answers:
  - A1a: Yes, he could have tried to avoid it (minimal alternative).
  - A1b: No, he could not have tried to avoid it either. (But this might be inconsistent with A1. So we might not get this. If we do, it would be an error.)

  Alternatively, we can ask:

  Do you think that "could have done otherwise" requires the ability to succeed in doing otherwise, or is it enough that he could have tried (even if he would have been prevented)?

  This is a bit theory-laden. Instead, we can use a case without an intervener.

  Case 4: Normal action. Jones is walking in the park and decides to sit on a bench. He sits. Could he have remained standing?

  This is a normal case. Everyone will say yes. Then we ask:

  Case 5: Jones is walking in the park, but unbeknownst to him, if he had even considered standing, a trapdoor would have opened and made him fall onto the bench. He sits on the bench on his own. Could he have remained standing?

  Here, if he had tried to remain standing, the trapdoor would have made him sit. So he could not have succeeded in standing. But could he have tried? We ask:

  In Case 5, do you think Jones could have tried to remain standing?

  Answers:
  - A1a: Yes, he could have tried (even though he would have been prevented).
  - A1b: No, he could not have tried (because the trapdoor would have opened at the mere consideration, so he didn't even have the chance to try).

  This tests the minimal alternative.

  For branch A2 (in Frankfurt case, responsible and could not have avoided it) - they drop the avoidability requirement. They are actual-sequence compatibilists. But then we need to split between different actual-sequence views.

  One split is between hierarchical-desire views and reasons-responsive views, and also the Strawsonian view.

  We can ask:

  What makes an agent responsible, then? Is it that the action flowed from the agent's own desires and beliefs, and that the agent endorsed the desire that led to the action? (This is the hierarchical view.)

  But we want to avoid theory-laden questions. Instead, use cases.

  Case 6: Addict. An addict takes a drug. He has a first-order desire to take the drug and a second-order desire to not desire the drug. He acts on his first-order desire. Is he responsible for taking the drug?

  This tests the hierarchical view. Those who require endorsement will say he is not responsible because he doesn't endorse his desire. Others might say he is responsible.

  But note: we also have the Strawsonian view that responsibility is about being an appropriate target of reactive attitudes.

