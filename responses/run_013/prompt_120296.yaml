  We are creating a decision tree for free will positions, focusing on responsibility based on avoidability. The tree should fit on one side of A4 and have 8-12 leaves. The questions must be answerable by students without prior knowledge of the literature. We'll use specific cases to illustrate the branching points.

  Key splits to include:
  1. Difference between an intervener who would have stepped in (but didn't) and an arrangement that forces the action.
  2. The conditional analysis of "could have done otherwise" (which fails in counterfactual intervener cases).
  3. The minimal-alternative move (e.g., could have chosen, tried, or willed otherwise).
  4. The dilemma objection to cases that guarantee the action (if deterministic, it's question-begging; if indeterministic, it's leaky).
  5. Sourcehood (the action's origin) as distinct from simply dropping the alternative-possibilities requirement.
  6. The split between requiring the action to flow from the agent's reasons-responsive machinery vs. requiring the ability to do otherwise.

  Positions to include:
  - Conditional-analysis compatibilist
  - The one who drops alternative-possibilities and grounds responsibility in the actual sequence (actual-sequence view)
  - Hierarchical-desire view (endorsement of the desire)
  - Libertarian who keeps the alternative-possibilities requirement and says counterfactual-intervener cases beg the question
  - Agent-causal libertarian
  - Hard incompatibilist (no one is responsible)
  - Strawsonian (the whole could-have-done-otherwise is the wrong question)

  We'll build the tree step by step, starting with the root. The root should be a fundamental question that everyone can answer without prior knowledge.

  Root Question: 
  In a case where an agent does something bad (e.g., steals a wallet), but there was a counterfactual intervener (like a neuroscientist) who would have intervened to make the agent do it if the agent hadn't chosen to do it on their own, is the agent responsible? (Note: the intervener did not actually intervene.)

  This case is the standard Frankfurt-style case. We are testing whether the agent is responsible when they couldn't have avoided the action because of the counterfactual intervener.

  Branch 1:
  - Yes, the agent is responsible. (This leads to compatibilist-leaning paths.)
  - No, the agent is not responsible. (This leads to incompatibilist-leaning paths.)

  But note: we also want to catch the conditional analysis. So after the root, we might need to ask about the conditional analysis for those who say "yes".

  Alternatively, we can structure the tree so that we first ask about the conditional analysis of "could have done otherwise" to see if that's what they are relying on.

  However, the root should be a concrete case. Let's design the tree:

  Level 1: The Frankfurt-style case (counterfactual intervener)

  Case 1: Jones is deciding whether to steal a wallet. Unbeknownst to him, if he had shown any sign of not stealing it, a neuroscientist would have intervened and forced him to steal it. However, Jones steals it on his own, and the neuroscientist does nothing. Is Jones responsible for stealing the wallet?

  Answers:
  - A: Yes, he is responsible.
  - B: No, he is not responsible.

  Now, for those who answer A (Yes), we need to check if they are relying on the conditional analysis. We also want to split between those who think the counterfactual intervener case is relevant and those who think it isn't.

  But note: we have a split between the counterfactual intervener and a positive arrangement that forces the action. So we need a case for the latter.

  Let's create:

  Level 2 for A (Yes to Frankfurt case):

  Question: Why do you think Jones is responsible in that case?
  But we don't want to ask for a theory. Instead, we can present another case that distinguishes the conditional analysis and the actual-sequence view.

  Alternatively, we can ask a direct question about the conditional analysis in a different context.

  We can design a case that tests the conditional analysis. The conditional analysis says: "S could have done otherwise" means "S would have done otherwise if S had chosen to do otherwise".

  We can test this with a case where the conditional is false because of a counterfactual intervener. But note: in the Frankfurt case, the conditional might be false because if Jones had chosen not to steal, the neuroscientist would have intervened and made him steal. So if we ask the conditional analysis question in the context of the Frankfurt case, it might be confusing.

  Alternatively, we can ask:

  In general, do you think that "I could have done otherwise" just means "I would have done otherwise if I had chosen to do otherwise"?

  But we want to avoid theory-laden questions. Instead, we can use a case where the conditional is clearly false, and then see if they still think the agent is responsible.

  Case for conditional analysis:

  Case 2: Smith is deciding whether to cheat on a test. Smith has a chip in his brain that, if he were to choose not to cheat, would activate and make him cheat. Smith does cheat on his own, without the chip activating. However, we ask: if Smith had chosen not to cheat, the chip would have made him cheat. Now, is it true that Smith could have refrained from cheating?

  Answers:
  - C: Yes, he could have refrained (even though if he had chosen to refrain, the chip would have made him cheat).
  - D: No, he could not have refrained.

  This question tests the conditional analysis. Those who say C are likely using the conditional analysis (because they think that since he did it on his own, he could have refrained, ignoring the counterfactual intervener). Those who say D reject the conditional analysis.

  But note: we are also interested in the minimal-alternative move. So after this, we might ask about minimal alternatives.

  Also, we have the dilemma objection and the sourcehood split.

  Let's try to outline the tree.

  Root: Frankfurt-style case (counterfactual intervener) -> responsible? (A: yes, B: no)

  For branch A (yes):

  We then ask about Case 2 (conditional analysis case) but we reframe it to avoid confusion. Alternatively, we can ask:

  In the same Frankfurt case, do you think that Jones could have done otherwise (refrained from stealing)?

  Answers:
  - A1: Yes, he could have done otherwise.
  - A2: No, he could not have done otherwise.

  If they say A1 (yes, he could have done otherwise), then they are likely using the conditional analysis or some minimal alternative. We then ask:

  But if Jones had tried to refrain, the neuroscientist would have intervened. So, in what sense could he have done otherwise? We need to probe the minimal alternative.

  Question: In the Frankfurt case, when you say Jones could have done otherwise, do you mean he could have at least chosen otherwise, or tried otherwise, or willed otherwise, even if he couldn't have succeeded in refraining?

  Answers:
  - A1a: Yes, he could have chosen/tried/willed otherwise (minimal alternative).
  - A1b: No, he could not have chosen/tried/willed otherwise either.

  But if they say A1b, then they are being inconsistent because they said he could have done otherwise but then deny he could have chosen otherwise. So we might not get A1b. Alternatively, we can skip this and go to the conditional analysis directly.

  Alternatively, we can ask the conditional analysis question as a general principle:

  Do you think that "could have done otherwise" just means "would have done otherwise if one had chosen to do otherwise"?

  Answers:
  - A1a: Yes (conditional analysis).
  - A1b: No.

  But we want to avoid general principles. Let's stick to cases.

  Another approach: present a case where the conditional is clearly false and see if they still think the agent is responsible.

  Case 3: Blackmail. A blackmailer says to Victim: "I know you are going to decide to give me the money, but if you were to decide not to, I would threaten you and you would then decide to give it." Victim decides to give the money without being threatened. Is Victim responsible for giving the money?

  This case is similar to Frankfurt but with a psychological intervener. We expect that those who are conditional analysts will say the victim could have done otherwise (because if he had chosen not to, he would have been threatened and then he would have given the money, so the conditional is false? Actually, conditional analysis: "could have done otherwise" means "if he had chosen not to, then he would have done otherwise". But in this case, if he had chosen not to, then the blackmailer would have threatened and then he would have given the money. So if he had chosen not to, he would still have ended up giving the money? Actually, no: if he had chosen not to, then the threat would have occurred, and then he would have chosen to give because of the threat. So at the moment of choice, he didn't choose not to. But the conditional analysis is about what would happen if he had chosen not to. So if he had chosen not to, then the threat would have been made, and then he would have changed his mind and chosen to give. So he would have done the same thing (given the money) even if he had chosen not to initially? Then the conditional is false: he would not have done otherwise even if he had chosen to do otherwise? Wait, no: the conditional is: "if he had chosen to do otherwise (i.e., not give the money), then he would have done otherwise". But in this scenario, if he had chosen not to give, then the threat would have been made, and then he would have chosen to give because of the threat, so he would have given the money. So he would not have done otherwise even if he had chosen to do otherwise? So the conditional is false.

  But note: the conditional analysis is about what would happen if he had chosen otherwise. Here, if he had chosen otherwise (not to give), then he would have been threatened and then he would have chosen to give. So he would have done the same thing (given the money). Therefore, the conditional analysis says he could not have done otherwise. But in the actual sequence, he did it without threat. So if someone thinks that the victim is responsible and also thinks that he could have done otherwise, they are not using the conditional analysis.

