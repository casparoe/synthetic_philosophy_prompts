  We are writing a research proposal for a small internal grant. The topic is a critical examination of the standard defense of Occam's razor via Solomonoff induction, focusing on the invariance theorem (that the choice of universal machine only changes complexity by an additive constant) and whether this addresses the right question. The central idea is that "simplicity" is conflating three distinct concepts: code length, compression, and translation. The proposal must be two pages and accessible to a reviewer outside the area.

  Key elements from the user's request:
  - Question: Must be framed to have a determinate answer.
  - Why the standard defense leaves the question open: Without citing specific authors, explain the positions and arguments.
  - Method: Conceptual, formal, or both; include a schedule and a plan for the first fortnight if the formal part is intractable.
  - Result: What a result would look like and what would count as failure.
  - Scope: Honest assessment for 3 part-time months, including what to drop.
  - Contribution: Prefer a distinction plus a diagnosis over overclaiming a theorem.
  - Constraints: No bibliography or citations; no load-bearing attributions.

  Structure the proposal as:

  1. Title and Abstract
  2. Introduction and Research Question
  3. Background and Motivation (including why the standard defense is insufficient)
  4. Proposed Approach and Methods
  5. Expected Outcomes and Evaluation
  6. Timeline and Feasibility

  Now, let's write the proposal accordingly.

  ---

  **Title:** Three Currencies of Simplicity: Dissecting the Invariance Defense of Occam's Razor

  **Abstract:**
  The standard defense of Occam's razor in algorithmic information theory invokes an invariance theorem: any two universal machines assign hypothesis complexities differing by at most an additive constant, which washes out with accumulating data. This proposal argues that this defense conflates three distinct aspects of simplicity: (1) code length (the bits to write the hypothesis), (2) compression (the bits saved when describing data via the hypothesis), and (3) translation (the bits needed to map a scientific hypothesis into machine-acceptable form). We contend that the invariance theorem only secures the first, while the epistemic weight of simplicity rests on the second, and the third is highly contingent on historical scientific vocabulary. The project will formally and conceptually disentangle these three currencies, determine whether differences in scientific formulation (such as having a conservation principle versus listing special cases) are captured by any currency, and diagnose why the standard defense appears unassailable. The outcome will be a clarifying distinction and a diagnosis of a conceptual conflation, rather than a mathematical theorem, with a schedule achievable in three months of half-time work.

  ---

  **1. Introduction and Research Question**

  Occam's razor—the principle that simpler hypotheses should be preferred—is often justified by an invariance theorem in algorithmic information theory. This theorem states that for any two universal Turing machines, the Kolmogorov complexity of a string differs by at most an additive constant. This constant is claimed to become negligible as data accumulate, rendering the choice of reference machine harmless. However, this defense may not address the core epistemic concern: whether simplicity, as a guide to truth, is invariant in a meaningful sense.

  The central question of this project is: **When we say that a hypothesis is simpler, which of three distinct "currencies" of simplicity—code length, compression, or translation—are we referring to, and to what extent is each invariant under the choice of representation?** Specifically, we will examine whether the difference between two formulations of a scientific theory (e.g., one with a general conservation principle and one without, listing special cases) is reflected equally in all three currencies, and whether the invariance theorem applies to all.

  ---

  **2. Background and Motivation**

  The standard defense of simplicity-weighted priors runs as follows. Solomonoff induction uses a prior that exponentially favors hypotheses with shorter descriptions on a universal machine. The invariance theorem ensures that the relative ranking of hypotheses by complexity is stable across machines, up to a constant. This is taken to show that the choice of machine is a matter of convention, not affecting inductive inferences in the limit.

  However, this defense conflates three roles of simplicity:

  - **Code length**: The raw bit-length of the hypothesis as a program for the machine. This is what the prior penalizes.
  - **Compression**: The reduction in total description length when the hypothesis is used to explain the data (i.e., the two-part code: hypothesis plus errors). This is the currency in which the epistemic virtue of simplicity is often cashed out—it measures how much the hypothesis compresses the data.
  - **Translation**: The cost of expressing a scientific hypothesis (e.g., Newton's laws) in a form the machine can run. This depends on the machine's instruction set and the vocabulary of the science.

  The invariance theorem directly applies only to code length (the additive constant is machine-dependent but bounded). It does not guarantee invariance for compression: the savings from using a hypothesis might differ across machines by more than a constant relative to the data. Worse, translation costs are not invariant at all: the bit-cost of translating, say, a conservation principle into machine code depends on the machine's primitives and the science's evolving vocabulary. The standard defense thus answers a question about code length, while the epistemic work rests on compression, and translation is ignored.

  This conflation makes the defense seem unassailable. By calling all three "simplicity", we overlook that the invariance theorem does not secure the currencies that matter for science.

  ---

  **3. Proposed Approach and Methods**

  The project will combine conceptual analysis and formal modeling.

  **Conceptual work**: 
  - Define the three currencies and their roles in scientific inference.
  - Analyze how a scientific hypothesis (e.g., a conservation law versus case-by-case rules) would be represented in different machines, and how the currencies diverge.

  **Formal work**:
  - Construct simple universal machines with different instruction sets.
  - For a toy example (e.g., a conservation law in physics), compute:
    1. Code length for each machine.
    2. Compression: data length when the hypothesis is used to predict.
    3. Translation cost: the overhead to express the hypothesis in each machine.
  - Test whether compression differences are bounded by a constant (as code length differences are) or grow with data.
  - Examine whether translation cost can dominate and vary arbitrarily.

  **If formal part is intractable (first fortnight check)**:
  If the formal modeling proves too complex, the project will pivot to conceptual analysis. We will:
  - Map the logical relationships between the currencies.
  - Use thought experiments (e.g., machines with physics-oriented vs. general primitives) to show how translation costs break invariance.

  **Schedule (3 months, half-time)**:
  - **Month 1**: Conceptual groundwork and formal setup. Weeks 1-2: Define the three currencies and design the toy examples. By the end of week 2, if formal modeling is infeasible, switch to conceptual mode. Weeks 3-4: Begin formal/computational experiments.
  - **Month 2**: Core analysis. Formal: Run experiments on toy models. Conceptual: Draft the diagnosis of conflation and its implications. 
  - **Month 3**: Synthesis and writing. Formal: Generalize results. Conceptual: Refine the distinction. Write the final report.

  **Scope management**: The formal part is ambitious. If stuck, we will drop it and focus on conceptual clarity. The core deliverable is the distinction and diagnosis.

  ---

  **4. Expected Outcomes and Evaluation**

  **Success** would yield:
  1. A clear distinction between code length, compression, and translation as three currencies of simplicity.
  2. A diagnosis that the invariance theorem only secures code length, while compression (the epistemic workhorse) may not be invariant, and translation is contingent.
  3. An answer to whether a conservation principle versus case-by-case rules counts as simpler in each currency.

  The **result** will be presented as:
  - A framework for discussing simplicity in scientific inference.
  - If formal work succeeds: quantitative examples showing divergence in compression and translation costs.
  - If not: conceptual arguments and thought experiments.

  **Failure** would occur if:
  - The distinction collapses (e.g., compression and code length are shown to be co-extensive in practice).
  - The project cannot articulate why translation costs break invariance beyond trivial cases.

  However, even partial progress (e.g., clarifying why the standard defense is incomplete) will be valuable.

  ---

  **5. Conclusion and Feasibility**

  This project addresses a foundational gap in the justification of Occam's razor. By disentangling three currencies of simplicity, it will explain why the standard invariance defense is insufficient for scientific inference. The work is feasible in three part-time months: the conceptual core is robust, and the formal part, while optional, will be attempted early. The contribution will be a distinction and a diagnosis, which can reshape debates on simplicity and induction.

  ---

  **Confidence assessment**:

  I am highly confident in the core conceptual claim: that "simplicity" in the standard defense conflates at least two distinct ideas (code length and compression) and that translation is a third, often-ignored factor. The invariance theorem for code length is well-established, and it is plausible that compression and translation do not share this invariance.

  The point I am least sure of is the **extent to which compression might fail to be invariant**. It is conceivable that for some machines and hypotheses, compression differences are bounded, but I suspect they are not in general. However, without formal modeling, this remains a hypothesis. The project will test this, but if the formal part is dropped, this point will be supported by conceptual arguments only.

