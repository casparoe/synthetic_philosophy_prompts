answer: |-
  ### Three Currencies of Simplicity: Dissecting the Invariance Defense of Occam's Razor  

  #### Abstract  
  The standard defense of Occam’s razor in algorithmic information theory relies on an invariance theorem: any two universal Turing machines assign hypothesis complexities differing by at most an additive constant, which purportedly washes out as data accumulate. This project challenges whether this defense addresses the core epistemic justification for simplicity-weighting. I argue that "simplicity" conflates three distinct currencies: (1) **code length** (bits to write the hypothesis), (2) **compression** (bits saved when describing data via the hypothesis), and (3) **translation** (bits to map a scientific hypothesis into machine-acceptable vocabulary). The invariance theorem only stabilizes the first currency, while compression handles the epistemic work, and translation is historically contingent. Using conceptual and formal methods, I will determine whether differences in scientific formulation (e.g., a conservation principle vs. case-by-case rules) are simplicity differences under any currency. The outcome will be a diagnostic distinction—not a theorem—explaining why the standard defense appears unassailable but answers an adjacent question.  

  #### 1. Research Question  
  **Does the invariance of Kolmogorov complexity under machine choice extend to all three "currencies" of simplicity, and if not, which currency grounds the epistemic justification for Occam’s razor?**  
  Specifically: When comparing two hypotheses (e.g., one with a conservation principle and one without), does their relative simplicity:  
  - Remain stable across machines under code length?  
  - Translate to invariant compression gains as data grow?  
  - Depend negligibly on the cost of reformulating scientific vocabulary?  
  The answer must be determinate: Either (a) invariance holds only for code length, breaking down for compression/translation, or (b) one currency proves robust, or (c) no currency is fully invariant, but their conflation explains the defense’s appeal.  

  #### 2. Why the Standard Defense Leaves the Question Open  
  The standard defense argues that machine-dependence is harmless because complexity differences are bounded by a constant, which diminishes with increasing data. This addresses *code length* but conflates it with two other roles of simplicity:  
  - **Compression** is the currency of epistemic efficiency: A good hypothesis reduces the total description length (hypothesis + prediction errors). The defense assumes code length invariance implies compression invariance, but this is unsupported. Compression depends on how well the hypothesis fits *future data*, which may vary arbitrarily across machines if their instruction sets prioritize different patterns. A constant code-length difference could become negligible, but compression gains could diverge if machines interpret "simple" patterns inconsistently.  
  - **Translation** bridges working scientific language (e.g., "conservation of energy") to machine inputs. This cost is ignored in the defense, treated as negligible or invariant. Yet scientific vocabulary evolves historically—e.g., expressing a conservation law might require few bits in a physics-optimized machine but many in a general-purpose one. The defense assumes translation is a fixed overhead, but it could dominate complexity and vary non-constantly across contexts.  
  This conflation makes the defense appear watertight: By focusing on code length (where invariance holds), it sidesteps whether simplicity’s epistemic value lies in compression or whether translation erodes invariance. The question remains open because no argument shows that all three currencies are equally stabilized or that compression/translation are irrelevant.  

  #### 3. Method and Schedule  
  **Approach**: Hybrid (conceptual and formal).  
  - **Conceptual**: Define the three currencies and their epistemic roles. Code length penalizes hypotheses; compression rewards predictive efficiency; translation is a tax on scientific expressivity. Analyze a conservation principle versus its case-by-case alternative: Is the former "simpler" in code length but not compression if data are sparse? Does translation cost favor machines aligned with scientific conventions?  
  - **Formal**: Construct two universal machines with divergent instruction sets (e.g., one with physics-friendly primitives, one without). For a toy dataset (e.g., particle trajectories), compute:  
    - Code length for both hypothesis formulations.  
    - Compression as data volume grows (two-part code: hypothesis + prediction residuals).  
    - Translation cost (bits to map "conservation law" to each machine’s operations).  
    Test if compression differences are bounded (as with code length) or grow with data. Quantify translation’s impact on total complexity.  

  **Pivot Plan (Fortnight 1–2)**:  
  If formalization stalls (e.g., compression is computationally intractable), I will:  
  - Drop the formal component and shift to conceptual case studies.  
  - Use idealized thought experiments: e.g., "If machine A favors geometric laws and machine B favors algebraic ones, does a conservation law’s compression gain vary across machines even with constant code length?"  

  **Schedule (3 months, half-time)**:  
  - **Month 1**: Conceptual groundwork. Weeks 1–2: Define currencies, design toy examples; if formalization is infeasible, pivot. Weeks 3–4: Analyze conservation-law case study.  
  - **Month 2**: Core investigation. Formal: Code and run machine comparisons. Conceptual: Generalize to other hypotheses (e.g., uniform laws vs. exceptions).  
  - **Month 3**: Synthesis. Week 9: Draft distinction and diagnosis. Week 10–12: Refine, write final report.  
  **Scope management**: I will drop the formal component if intractable by Week 2, focusing solely on conceptual clarity. The conservation-law case is essential; other examples (e.g., biological vs. physical hypotheses) are optional.  

  #### 4. Expected Outcomes and Failure Conditions  
  **Successful result**: A framework distinguishing the three currencies, showing:  
  - Code length is invariant but epistemically inert (it is a tax, not a reward).  
  - Compression is the epistemic engine but may not be invariant; machine choice affects real-world efficiency.  
  - Translation is non-constant and historically contingent, making simplicity evaluations context-dependent.  
  For the conservation-law case, the result will specify which currency (if any) counts it as simpler. Output: A written report with diagrams or tables illustrating currency divergence.  

  **Failure**: The project fails if:  
  - The distinction collapses (e.g., compression and code length are shown to be co-extensive).  
  - Translation costs are provably negligible in all cases.  
  - No determinate answer emerges (e.g., all currencies behave inconsistently with no diagnostic insight).  
  Partial success (e.g., conceptual distinction without formal proof) still delivers value.  

  #### 5. Contribution and Feasibility  
  **Contribution**: A distinction (three currencies) and diagnosis (the standard defense stabilizes only code length, while compression does the epistemic work and translation is unstable). I will not overclaim: No theorem is guaranteed, but the distinction will reframe debates.  
  **Feasibility**: Three part-time months suffice for the conceptual core and one toy case. The formal part is optional; if dropped, the project still delivers a novel diagnostic. I will prioritize the conservation-law analysis and drop other examples if time lags.  

  ---

  **Confidence Assessment**  
  - **Overall confidence**: High (80%) in the substantive claims. The core argument—that simplicity conflates distinct concepts—is robustly supported by information-theoretic principles and historical examples of scientific representation.  
  - **Least confident point**: The claim that **compression gains may not be invariant** under machine choice (30–40% confidence). While intuitive (divergent machines prioritize different patterns), it is unclear if differences grow with data or remain negligible. This is why the formal component is critical but expendable. If compression proves invariant in experiments, it would weaken the diagnosis but not collapse it (translation remains unstable).
