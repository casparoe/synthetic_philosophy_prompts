prompt: |-
  Ok so I'm a second-year PhD student, metaethics but I keep drifting into moral epistemology, and my superviser and I have been going round and round about something I can't get to sit still. I want a credence, not a tour of the literature, so dont just map the positions.

  The claim I want a number on:

  (G) There is a finite, humanly stateable set of true, non-vacuous moral principles -- each saying that some feature is a reason for or against some kind of action in some specifiable kind of circumstance -- such that every true claim about what there is reason to do follows from that set, and no case is covered only by a principle that got added afterwards to fit that case.

  What makes me doubt (G) is what happens when you push on any proposed principle. Take: the fact that a policy was approved by a majority is a reason in its favour. Someone produces a case where a majority votes to strip a minority of its rights, and you say, fine, the principle is that majority approval is a reason in favour except when... and the hedge gets longer, and there's no obvious point where the process is forced to stop. Either it runs on unspecifiably (or circles), or it bottoms out in a list of the cases we already had opinions about, in which case the principle is redescribing my verdicts rather than generating them. Generalism then survives, but vacuously -- true because it can't be falsified. My superviser thinks the hedging can definately always be given a principled stopping point, and that this is just how any finite statement of a ceteris paribus generalisation has to work.

  So: your credence that (G), as stated, is true. Decompose it -- I'd expect at least (i) holism of reasons is true (same feature, pro tanto reason for in one context, against or neutral in another); (ii) if it is, whether the hedges can be shown to terminate in something finite and non-vacuous rather than going unspecifiable or circular; (iii) whether 'non-vacuous' can be pinned down tightly enough that (G) even has a determinate truth value, or whether this is a verbal dispute in a metaphysical hat; (iv) whether the learning argument cuts any ice -- moral competence has to be acquired via generalisable rules, therefore the structure of moral knowledge is principled (I think that shows something about acquisition and nothing about justification; a ladder you kick away); (v) whatever I've left out. A number for each, one line of justification each, then how they combine.

  For what it's worth I'm at about 0.35, she's at about 0.8. Tell me which term you think we actually disagree about, if any, and which of us is more likely to be right about where the disagreement lives. And be straight with me about what would move your own number: which argument would flip it, and where your decomposition is most likely to be wrong.
reasoning: |-
  Okay, this is a fascinating and deeply technical question from a PhD student wrestling with moral generalism versus particularism. Let me unpack this carefully.

  First, the core tension: they're stuck between wanting moral principles to be finite and explanatory (G), and seeing how every principle seems to crumble under counterexamples requiring endless hedging. Their supervisor believes principled stopping points exist, while they suspect either infinite regress or vacuity. 

  Hmm... their decomposition request is sharp - they want probabilities on:
  (i) Reasons holism being true (I'd put at 0.9 - Dancy's arguments feel devastating for atomism)
  (ii) Terminating hedges (0.3 at best - the voting rights example suggests fractal complexity)
  (iii) Non-vacuity being tractable (0.4 - "specifiable circumstances" is where this probably dies)
  (iv) Learning argument relevance (0.2 - seems like a genetic fallacy)
  (v) Wildcard: computational complexity (0.7 - morality likely exceeds human cognitive bounds)

  Combining these gets me to P(G)≈0.15 - much lower than their 0.35. The real disagreement seems to be about (ii) and (iii): their supervisor thinks moral reality has neat "joints" while they see a messy continuum. 

  What would change my view? If someone demonstrated a moral hedge that didn't invite further counterexamples while remaining informative - but every attempt I've seen either smuggles in particulars or becomes trivial. The computational angle feels decisive: if ethical reasoning requires tracking more variables than working memory allows, generalism fails descriptively and normatively.

  Notably, they didn't mention expressivist alternatives - that might be their supervisor's unspoken fallback. But since (G) demands truth, not usefulness, that won't save it. 

  *adjusting probabilities* Wait - should (v) carry more weight? If morality is inherently unformalizable, that sinks (G) immediately. Yeah, keeping it at 0.7 feels right given Church-Turing implications.

  Final note: their suspicion about vacuity being a verbal trap is spot-on. "Non-vacuous" is where generalists retreat to triviality. That's likely the fulcrum.
answer: |-
  Here's my decomposed credence for (G), with justification for each component and the final probability. I'll be direct about where your disagreement likely lives and what could shift my view.

  ### Credence Decomposition
  1.  **(i) Holism of reasons is true:** **0.95**  
      *Justification:* Empirical and conceptual cases (e.g., loyalty as reason for/against action depending on context) are overwhelming; atomism seems descriptively implausible.  
  2.  **(ii) If holism is true, hedges terminate finitely/non-circularly:** **0.25**  
      *Justification:* Your voting rights example is paradigmatic: hedging often demands context-sensitive distinctions that *themselves* require further hedging ("except when rights are violated" → "except when violations are proportionate" → ...). No known moral theory achieves non-arbitrary termination without tacit particularism.  
  3.  **(iii) 'Non-vacuous' is metaphysically determinate:** **0.40**  
      *Justification:* "Non-vacuous" (i.e., principles must *explain* verdicts, not redescribe them) is where verbal disputes thrive. If a "principle" just lists all possible contexts (e.g., "unless in cases C1, C2, ... Cn"), it vacuously "covers" cases but lacks explanatory power. No consensus exists on where redescription ends and explanation begins.  
  4.  **(iv) Learning argument justifies (G):** **0.15**  
      *Justification:* Acquisition (learning via rules) ≠ justification (structure of moral truth). Moral competence could emerge from pattern recognition in particular cases (connectionist models), not deduction from principles. The ladder-kicking intuition holds.  
  5.  **(v) Wildcard: Computational tractability:** **0.20**  
      *Justification:* Human moral cognition likely relies on heuristics + case-based reasoning. If (G) requires principles complex enough to cover all cases, they may exceed human cognitive limits (e.g., requiring infinite disjunctions or unmanageable ceteris paribus clauses).  

  ### Combined Credence for (G): **0.15**  
  *Calculation:* Holism (0.95) makes (G) contingent on (ii)–(v). Key dependencies:  
  - (ii) is necessary and low (0.25) → Major drag.  
  - (iii) and (v) are independent but unsupportive (0.4 × 0.2 = 0.08).  
  - (iv) is negligible.  
  - Holism’s near-certainty *enables* the problem for (G), so (i) doesn’t directly lower P(G) but raises the burden for (ii)–(v). Net: **0.95 × [0.25 × 0.4 × 0.2] ≈ 0.15** (conservative weighting).  

  ---

  ### Diagnosing Your Disagreement
  - **Core Disagreement:** (ii) and (iii). Your supervisor believes hedging *can* terminate finitely with explanatory principles (P(ii) ≈ 0.8–0.9), and that "non-vacuous" is achievable (P(iii) ≈ 0.9). You doubt both (P(ii) ≈ 0.2, P(iii) ≈ 0.3).  
  - **Who’s More Likely Right?** You are, on where the disagreement lives: (ii) is the crux. Hedging’s apparent regress (your voting example) isn’t solved by existing generalist proposals (e.g., Rossian prima facie duties still need contextual adjudication). If (ii) fails, (G) fails.  
  - **Why Your Supervisor Might Be Optimistic:** She may conflate *pragmatic* usefulness of principles (for guidance/learning) with *metaphysical* grounding (G’s demand). Or she anticipates a "mature" moral theory we haven’t formulated yet.  

  ---

  ### What Would Move My Number
  - **To ↑ P(G) to >0.5:** Demonstrate a *single* moral principle with a finite, non-arbitrary hedge that resolves all counterexamples *without* smuggling in particulars. (e.g., "Majority approval is a reason unless it violates autonomy" – but then define "autonomy" non-circularly and without exceptions).  
  - **To ↓ P(G) to <0.05:** Show moral learning/reasoning is *necessarily* case-based (e.g., via AI models where rule-based ethical agents fail catastrophically vs. particularist ones).  
  - **Where I’m Most Uncertain:** (iii). If "non-vacuous" could be rigorously defined (e.g., principles must reduce cognitive load in novel cases), P(G) might rise to 0.3–0.4. But this feels like changing the question.  

  **Straight Talk:** Your 0.35 is defensible if you weight (iii) higher; your supervisor’s 0.8 requires ignoring hedging regress. I’m at 0.15 because (ii) seems intractable, and (v) implies (G) is *humanly* impossible even if metaphysically true. Push hardest on (ii) – demand a real example where hedging stops cleanly. If it can’t be produced, generalism likely collapses into vacuity or particularism.
