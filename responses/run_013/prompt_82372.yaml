  2. **Harm trumps autonomy:** Choices that *directly impair* someone's welfare (noise disrupting sleep) override "my property" claims.  
  3. **Key test:** Does the objection stem from *direct, measurable harm* or from *discomfort with another's choice*?

  **(b) Predictions for Priya's kidney case:**  
  - **Rule 1 (autonomy):** Priya’s choice wins. Family’s "suffering" (fear, care burden) is a *reaction to her decision*, akin to Mo's disgust or Dad's embarrassment. Not direct harm.  
  - **Rule 2 (harm):** Family’s claims lose. Their "suffering" isn’t equivalent to Ana’s sleep deprivation; it’s emotional/future-contingent, not an *imposed physical violation*.  

  **(c) Best guess for Rosa’s actual view:**  
  She’d side with **Priya**. The family’s reasons mirror Cases 1/2 (emotional distress *about her choice*), not Case 3’s tangible harm. Rosa likely sees "terror" and care burdens as *derivative* of Priya’s autonomy—not an independent welfare violation. Her rule: **"Suffering must be direct and externally imposed (like noise), not a byproduct of disagreeing with a personal risk."**  

  **(d) Test case to split the rules:**  
  **"Kai is a vegan but takes a high-paying job at a slaughterhouse. Their family (also vegan) says they’re traumatized knowing Kai participates in animal cruelty, can’t eat together, and fears community shaming. Kai says it’s their career choice."**  
  - **Rule 1 (autonomy):** Kai’s job choice wins (like Dee’s book/Priya’s tattoo). Family’s distress is about *Kai’s actions*, not direct harm.  
  - **Rule 2 (harm):** If Rosa sides with the family here (due to "trauma" or social shame), it contradicts Cases 1/2. If she sides with Kai, it confirms her kidney-case logic. Forces her to define "harm" vs. "ideological distress."  

