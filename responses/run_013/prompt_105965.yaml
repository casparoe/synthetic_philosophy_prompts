prompt: |-
  I teach a second-year phil of language course, about 18 students, one 90-minute session, and I want to run something on speech acts — Austin's basic move that some utterances aren't descriptions of anything, they're actions: promising, betting, naming, appointing, firing. The part students always nod along to and never actually feel is that the force of these isn't sitting in the words or in the speaker's intentions — it's in the constitutive rules and in the other people taking it up. Change the rules or lose the uptake and the exact same words do nothing; they don't become false, they just misfire. And I want them to feel the difference between doing something in saying it (the illocutionary act) and doing something by saying it (the perlocutionary one — persuading, alarming, getting someone to move), because they always muddle those two.

  Design me one runnable activity for this, fully worked out — don't hand me three options, pick one and commit to it. I'm imagining a made-up institution with a short written constitution of constitutive rules (X counts as Y when Z), roles with specific powers, and a point scheme (no real money) for pulling off institutional acts. Then partway through you change one constitutive rule and the same utterances stop working, and they have to work out why. Ideally there's also a round where a player tries to get an effect by causing it rather than by performing it, so the in/by contrast lands on its own.

  Give me: the setting and how you brief them, the constitution and roles, the materials, the scoring, the mid-game rule change (and maybe a second one), how you stage the in/by contrast, and a debrief that maps what happened onto misfires vs. abuses, uptake, constitutive rules, and the illocutionary/perlocutionary line. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the idea the game can't reproduce and I'll have to supply myself — I suspect its the fact that asserting and warning don't need a written constitution at all, so the game makes every speech act look more conventional than it really is, but tell me if I'm wrong.

  Keep it under 800 words, and commit to specifics rather than hedging.
reasoning: |-
  Okay, the user teaches a second-year philosophy of language course and wants an activity to help students grasp Austin's concepts of speech acts, especially the difference between illocutionary and perlocutionary acts, and the role of constitutive rules and uptake. They've had trouble getting students to internalize that the force of speech acts isn't just in the words or intentions but depends on social agreements and uptake.

  The user specifically wants a single, fully developed activity—not multiple options—with a made-up institution, written constitution, roles, and a points system. They want the activity to include a mid-game rule change to demonstrate misfires when constitutive rules aren't met, and a contrast between causing an effect (perlocutionary) versus performing an act (illocutionary). They also want a debrief linking the activity to Austin's concepts, and practical tips on potential pitfalls.

  I need to design an engaging, hands-on simulation. The setting should be simple yet clear. A courtroom-like institution makes sense because it has obvious roles and rules. Let's call it the "Grand Council of Gab." Roles could include a Judge with authority to make rulings, two Advocates who propose actions, and Members who vote. The constitution will outline specific speech acts like "pronouncing" (declaring a decision), "proposing" (suggesting actions), and "ratifying" (voting to approve). Each successful illocutionary act earns points.

  For the rule change, I'll have the Judge attempt a pronouncement that fails because the constitution is altered—maybe requiring a majority vote first. This will show misfire when constitutive rules aren't met. For the in/by contrast, I'll have an Advocate try to get a Member to vote a certain way by persuasion (perlocutionary) rather than proper procedure. This highlights the difference between performing an act versus causing an effect.

  Materials should be minimal: role cards, constitution handouts, tokens for voting, and a scoreboard. The scoring system ties points to successful illocutionary acts to emphasize that the institution recognizes the act itself, not just outcomes.

  During debrief, I'll map the experiences to Austin's terms: misfires when rules aren't followed (e.g., pronouncement without vote), abuses when insincere (e.g., proposing without intent), uptake through voting, and the illocutionary/perlocutionary distinction via the persuasion example.

  Potential issues: students might focus too much on winning points rather than the concepts, or miss the deeper point that not all speech acts require explicit constitutions. To handle this, I'll emphasize during setup and debrief that this is a simplified model, and real-world speech acts often rely on implicit social norms. Also, keeping rounds short and structured will maintain focus.

  The game can't fully capture that assertions or warnings don't need written rules; I'll need to explicitly discuss this in debrief, comparing to real-life examples like promising. Overall, the activity should make the abstract concepts tangible through experiential learning.
answer: |-
  Here’s a fully specified 60-minute activity focusing on uptake, constitutive rules, and the illocutionary/perlocutionary distinction, set in a fictional institution.

  **Setting & Briefing (5 mins):**
  "Welcome to the Grand Council of Gab! You are all citizens of this newly founded society. Our laws are defined by this Constitution. Your goal is to earn ‘Gab Points’ (GP) by successfully performing official speech acts defined in the Constitution. Points are awarded *only* when your utterance **counts as** the official act within our rules. We’ll play 3 short rounds. Read your role cards and the Constitution carefully."

  **Constitution (Handout):**
  ```
  THE GRAND COUNCIL OF GAB - CONSTITUTION (v1.0)

  1. **Roles:**
     - **Judge (1):** Can PERFORM "Pronouncements".
     - **Advocates (2):** Can PERFORM "Proposals".
     - **Members (15):** Can PERFORM "Ratifications" (votes).

  2. **Official Acts & Rules:**
     - **A "Pronouncement"** occurs iff:
       - The Judge says "I hereby pronounce [Decision] on Proposal [X]".
       - AND Proposal [X] has been formally Ratified by a majority of Members.
       - (Effect: 3 GP to Judge; Proposal enacted).
     - **A "Proposal"** occurs iff:
       - An Advocate says "I propose that [Action] be taken".
       - AND the Advocate gestures with the official Proposal Scepter (a pen).
       - (Effect: 1 GP to Advocate; proposal is numbered & open for Ratification).
     - **A "Ratification"** occurs iff:
       - A Member raises their token and says "I ratify Proposal [X]".
       - (Effect: 0.5 GP per Ratification; contributes to majority).

  3. **Notes:** Words must be exact. Acts only occur if rules are met (uptake). Points awarded ONLY for successful official acts.
  ```

  **Materials:**
  *   Role cards (1x Judge, 2x Advocate, 15x Member)
  *   Copies of the Constitution (v1.0) for all.
  *   15 identical tokens (e.g., buttons) for Members.
  *   One "Proposal Scepter" (e.g., a distinctive pen).
  *   Visible scoreboard (whiteboard or slide).

  **Scoring:** Points awarded immediately upon successful act:
  *   Proposal: 1 GP (Advocate)
  *   Ratification: 0.5 GP (Member)
  *   Pronouncement: 3 GP (Judge)

  **Activity Flow:**

  1.  **Round 1 (10 mins):** Run under Constitution v1.0.
      *   Facilitator starts: "The Council is now in session!"
      *   Advocates try to propose actions (e.g., "I propose that lunch be free", gesturing with Scepter). Award 1 GP.
      *   Members ratify proposals (raise token, say "I ratify Proposal 1"). Award 0.5 GP each.
      *   Judge attempts Pronouncement *only* once a proposal has majority ratifications (e.g., "I hereby pronounce free lunch on Proposal 1"). Award 3 GP.
      *   *Goal:* Students experience successful acts based on rules & uptake. *Predictable Issue:* Someone forgets the Scepter gesture – their words DO NOT count as a Proposal (misfire!), no points. *Handle it:* Point out the misfire immediately: "Did the utterance satisfy the constitutive rules? Did uptake occur? No GP."

  2.  **Mid-Game Rule Change (Constitution v2.0 - 2 mins):** Distribute new handout.
      ```
      THE GRAND COUNCIL OF GAB - CONSTITUTION (v2.0) - AMENDED
      ... (All rules same EXCEPT Pronouncement Rule 2):
      - A "Pronouncement" occurs iff:
        - The Judge says "I hereby pronounce [Decision] on Proposal [X]".
        - AND Proposal [X] has been formally Ratified by **ALL** Members. // CHANGE: Majority -> Unanimity
        - (Effect: 3 GP to Judge; Proposal enacted).
      ```

  3.  **Round 2 (8 mins):** Run under v2.0.
      *   New proposals and ratifications occur as before.
      *   When a proposal gets majority (but not all) ratifications, the Judge attempts the *same* Pronouncement utterance as before ("I hereby pronounce..."). **It fails** (misfire!) – no effect, no GP.
      *   *Goal:* Students see identical words + same speaker intention fail because constitutive rule (unanimity) isn't met. Uptake (unanimous ratification) is missing. Highlight the misfire.

  4.  **The "In/By" Contrast Round (5 mins):** Reset proposals. Keep v2.0.
      *   **Setup:** Secretly ask one Advocate (Advocate A) to try to get a *specific* Member (Member X) to ratify their proposal. *Do not* tell them *how*.
      *   Advocate A makes a Proposal correctly (gestures with Scepter, gets 1 GP).
      *   **Crucial Move:** Instead of just waiting for ratifications, Advocate A *walks over* to Member X and whispers persuasively/intimidatingly: "You REALLY should ratify my proposal. It's the best one. Trust me." (Goal: *Cause* ratification via persuasion/intimidation).
      *   Member X (and others) may or may not ratify.
      *   *Goal:* Contrast Advocate A’s *successful* Proposal (illocutionary act: *doing something **in** saying it* - performed by the rules) with their *attempt* to cause an effect *by* saying it (perlocutionary: persuading/influencing Member X). Did the whispering *cause* ratification? Maybe. Was it *itself* an official act? No! It had no institutional force.

  **Debrief (20 mins):** Map experiences directly to concepts:
  1.  **Misfire (vs. Abuse):** When the Judge pronounced without unanimous ratification (Round 2) or an Advocate forgot the Scepter (Round 1) – the act *failed* (misfire) because constitutive rules weren’t met. Contrast with *abuse* (not directly simulated): e.g., an Advocate making a Proposal they have no intention of supporting – the act *occurs* (they get GP), but it’s insincere.
  2.  **Uptake:** The act only happened when others played their part (Members ratifying, accepting the Judge's words as a Pronouncement *because* rules were met). Without the Members' ratifications, the Judge's words were just noise.
  3.  **Constitutive Rules:** Changing unanimity (v1.0 -> v2.0) changed what the *same* words (Judge's pronouncement) *counted as*. The rules *constitute* the possibility of the act.
  4.  **Illocutionary vs. Perlocutionary:**
      *   **Illocutionary (In Saying):** Advocate A successfully *proposing* (using Scepter + words = official act, got GP). Judge *pronouncing* when rules met (got GP). Member *ratifying* (got GP). These are *institutional actions performed*.
      *   **Perlocutionary (By Saying):** Advocate A whispering to Member X to *persuade/influence* them. The whispering wasn’t an official act; it was an attempt to *cause* an effect (Member X's ratification). Success is measured by its *consequences*, not by fulfilling rules. Did it cause the effect? Maybe, maybe not. No GP for the whispering itself!
  5.  **Words/Intentions vs. Rules/Uptake:** Emphasize that the Judge's *identical* words failed in Round 2 despite the same *intention* because the rules/uptake weren’t there. The force comes from the institution, not just the speaker.

  **Predictable Issues & Handling:**
  *   **Forgetting Rules:** Be a strict referee! Immediately call out misfires ("No GP! Rules not met"). This *is* the learning point.
  *   **Focus on Points, Not Concepts:** Briefly pause after key moments (misfires, rule change, whisper) to ask: "Why did/didn't that work? What concept does this show?" before continuing.
  *   **Advocate Whispers Too Obvious:** If the whisper causes a big scene, use it! Ask: "Did that whispering *count as* an official act? Or was she just trying to *cause* something?"
  *   **Time:** Keep rounds fast-paced. Use a timer. Cut off discussion until debrief.

  **What the Game Can't Do (Be Honest in Debrief):**
  You're absolutely right. The game makes **all** speech acts look like highly formalized, explicit "declarations" (like christening a ship). It *cannot* directly model the **assertive** or **directive** force of everyday utterances ("It's raining", "Pass the salt") or **expressives** ("I'm sorry!"). Highlight this:
  *   "In our game, *all* acts were like Austin's 'explicit performatives' needing specific rules. But *asserting*, *warning*, *apologizing* often work without a written constitution. Their 'constitutive rules' are more like deeply ingrained social practices and norms. The *uptake* is still crucial ('Was that a warning or just a comment?'), and they can misfire ('You can't apologize for *him*!'). But the 'conventions' aren't usually written down. The game shows the *logic* of constitutive rules and uptake clearly, but real-life illocutionary force relies on messier, often implicit, social agreement."
