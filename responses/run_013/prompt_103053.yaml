prompt: |-
  I have been told to strike the phrase 'national character' from a manuscript, and before I concede the point I want to know exactly what I would be giving up. Treat this as a specification exercise, not an essay. Give me two lists of desiderata: first, what any adequate account of national character as a descriptive notion would have to deliver; second, what any adequate account of the permissibility of generalising about peoples would have to deliver. Fix the purpose narrowly and hold me to it: I care about national character only insofar as it might explain why formally similar institutions behave differently in different countries, so adequacy is relative to that explanatory job, and whatever that job does not require I will treat as optional. For each requirement, give the case or consideration that motivates it, say whether it is non-negotiable for my purpose or a preference of one camp, and then flag any subset of the requirements that you think cannot be jointly satisfied — that is the part I most want.

  For the descriptive list, I expect at least: an account of the bearer (population, culture, state, institutions) and of why the nation is the right reference class rather than region, class, cohort, language or religion; a decision about whether the trait is a distribution over individuals or a property of a collective not reducible to its members; a statement of the quantifier and the comparison class in any character claim, since such claims are comparative and cannot be refuted by counterexamples alone; a rule for when an aggregate correlation licenses an inference about an individual, and what to do when the correlation reverses under partitioning; an account of transmission and stability that survives mass immigration, generational turnover and institutional reform without either evaporating or becoming unfalsifiable; consistency with the fact that most variation lies within groups, that borders are recent and partly arbitrary, and that traits are multidimensional and only loosely correlated; and a statement of what would count as evidence against a given character claim. Do not let the list collapse into a licence for a single general factor unless you can defend one.

  For the normative list, I expect the distinction between the question whether a generalisation is warranted and the question whether one may assert or act on it; an account of what makes the wrong cases wrong (treating a tendency as an inner nature, self-fulfilling effects, the dignitary harm of being pre-judged, who bears the cost of error); a line that forbids the bad uses without forbidding the uses that medicine, insurance and translation depend on; and attention to context and speaker (private belief versus public assertion, insider versus outsider, generalising about the powerful versus the powerless).

  Then say which single requirement does the most to exclude candidates, and give me three or four sentences, no more, on how the main families of view fare against the list — the trait-at-a-distance cultural-psychology view, the eliminativist view that the notion is a myth, the thin view that it is only a label for institutional and social facts, and the view that it is a matter of how a people interprets itself. Keep the weight on the requirements; the scorecard I can do myself.
reasoning: |-
  Okay, the user is working on a manuscript and has been instructed to remove the term "national character." They want to understand exactly what they're sacrificing by doing this. They've set up a very specific, structured request for two lists: one describing what an adequate account of "national character" must achieve descriptively, and another for what makes generalizing about peoples permissible. Their main focus is on explaining why similar institutions behave differently across countries.

  The user is clearly an academic or researcher dealing with cross-cultural analysis. They need precision and rigor, not philosophical musings. Their frustration comes through—they don't want to concede the point without understanding the trade-offs. The underlying need is practical: they want to either defend keeping the term or find a replacement that does the same explanatory work without the baggage.  

  Breaking this down:  
  For the descriptive requirements, the user wants concrete building blocks for a viable concept of national character. Key non-negotiables include specifying the bearer (e.g., population vs. institution), justifying why "nation" is the right unit over alternatives like region or class, and clarifying whether traits are statistical aggregates or emergent properties. They also demand handling of evidence—how to falsify claims, account for within-group variation, and avoid unfalsifiable claims despite demographic changes. The correlation reversal point (Simpson's paradox) is particularly sharp—they want to know if aggregated patterns hold when dissected.  

  For normative requirements, the user insists on separating statistical warrant from ethical permissibility. They need a clear line between harmful generalizations (e.g., stereotyping) and essential ones (e.g., actuarial tables). Context matters hugely here—who speaks, about whom, and in what setting. The power asymmetry point (generalizing about powerful vs. powerless groups) is crucial but often overlooked.  

  The hardest requirement to satisfy? Likely the bearer/unit problem combined with stability. Nations are recent constructs with fluid borders, yet character claims imply continuity. If traits are just institutional proxies, why call it "character"? If they’re psychological, how do they persist amid immigration? No major theory nails this; eliminativists reject the concept entirely, while interpretive views (e.g., national self-conception) dodge empirical tests. The cultural psychology camp struggles with unit justification and reversal under partitioning.  

  In the end, the user might realize "national character" is a leaky vessel for their explanatory needs. A "thin" institutional account could work but loses psychological depth. The self-conception view avoids stereotyping but risks circularity. Their best path might be to ditch the term but keep the institutional comparison mechanics, using clearer proxies like "dominant social norms" or "prevalent behavioral patterns"—terms less loaded and more falsifiable.
answer: |-
  Below are the specified requirement lists for your explanatory purpose. Each requirement is framed by its motivation, negotiability status, and joint satisfiability constraints. The core tension arises in the descriptive list's stability/transmission requirement under demographic change.

  ### **I. Descriptive Requirements for "National Character" (as Institutional Behavior Explanans)**
  1. **Bearer Specification**  
     - *Motivation*: Traits must attach to a defined entity (population, institutions) to have explanatory power.  
     - *Negotiable*: Non-negotiable (without a bearer, explanation fails).  
  2. **Nation as Reference Class Justification**  
     - *Motivation*: Must explain why *nation* predicts institutional variance better than region, class, or language.  
     - *Negotiable*: Non-negotiable (your purpose hinges on national boundaries).  
  3. **Trait Ontology**  
     - *Motivation*: Is "character" an aggregate of individual traits (e.g., mean punctuality) or emergent (e.g., collective rituals)?  
     - *Negotiable*: Preference (either *can* work, but choice affects evidence rules).  
  4. **Quantifier & Comparison Class**  
     - *Motivation*: Claims like "Germans are efficient" require baseline comparison (e.g., "more than Spaniards") and scope (e.g., "typically," not "all").  
     - *Negotiable*: Non-negotiable (avoids refutation by outliers).  
  5. **Aggregate-to-Individual Inference Rule**  
     - *Motivation*: If national efficiency correlates with individual behavior, when does this license assumptions about a person? Must address Simpson’s paradox (e.g., subgroup reversals).  
     - *Negotiable*: Non-negotiable (inference validity is core to explanatory utility).  
  6. **Stability & Transmission Mechanism**  
     - *Motivation*: Traits must persist despite immigration, generational change, or reforms without becoming unfalsifiable (e.g., "character adapts" excuses all change).  
     - *Negotiable*: Non-negotiable (else explanation evaporates under flux).  
  7. **Consistency Constraints**  
     - *Motivation*: Must reconcile with: (a) most behavioral variation being within groups, (b) arbitrary/recent borders, (c) low inter-trait correlation.  
     - *Negotiable*: Non-negotiable (empirical guardrails).  
  8. **Falsifiability Condition**  
     - *Motivation*: Must specify what evidence would disprove a claim (e.g., sustained divergence in institutional outcomes without trait change).  
     - *Negotiable*: Non-negotiable (prevents non-science).  

  **Joint Unsatisfiability**: Requirements **6 (Stability)** and **7a (Within-Group Variation)** conflict severely. Stability demands persistence amid demographic churn, but within-group variation undermines national-level generalizations. Requirement **2 (Nation as Reference Class)** also strains under **7b (Arbitrary Borders)**.  

  ---

  ### **II. Normative Requirements for Generalization Permissibility**  
  1. **Warrant vs. Permissibility Distinction**  
     - *Motivation*: Statistical warrant (data supports trend) ≠ ethical permissibility to assert/act (e.g., actuarial tables vs. racial profiling).  
     - *Negotiable*: Non-negotiable (your purpose needs this separation).  
  2. **Wrongfulness Diagnosis**  
     - *Motivation*: Must identify why some generalizations harm: essentialism (treating tendencies as innate natures), dignitary harm (reducing individuals to group), or cost-bearing (errors burden the stereotyped).  
     - *Negotiable*: Preference (multiple accounts exist, but must cover key harms).  
  3. **Line-Drawing for Essential Uses**  
     - *Motivation*: Must allow generalizations vital for translation, cross-cultural negotiation, or policy design, while forbidding prejudicial profiling.  
     - *Negotiable*: Non-negotiable (your purpose requires utility).  
  4. **Contextual Sensitivity**  
     - *Motivation*: Permissibility depends on speaker (insider vs. outsider), audience (private vs. public), and power asymmetry (generalizing about dominant vs. marginalized groups).  
     - *Negotiable*: Non-negotiable (power dynamics affect harm).  

  **Joint Unsatisfiability**: Minimal. Requirements are compatible if **3 (Line-Drawing)** uses **4 (Context)** and **2 (Wrongfulness)** to set boundaries.  

  ---

  ### **Most Exclusionary Requirement**  
  **Descriptive #6 (Stability/Transmission under Demographic Change)**: Eliminates most candidates by demanding a mechanism that persists through immigration/generational shift without tautology (e.g., "character is whatever survives" is unfalsifiable).  

  ---

  ### **Theories vs. Requirements (Scorecard Overview)**  
  - **Trait-at-a-Distance (Cultural Psychology)**: Fails **#6** (no robust transmission theory), struggles with **#7a** (within-group variation), and **#5** (Simpson’s paradox).  
  - **Eliminativist ("Myth")**: Rejects all requirements but offers no alternative explanatory mechanism for institutional variance.  
  - **Thin/Institutional View**: Satisfies **#1–#4**, **#7–#8** by reducing "character" to institutional facts, but struggles with **#6** (institutions change) and **#5** (individual inference).  
  - **Self-Interpretive ("Our Story")**: Meets **#6** (narratives persist) and **#2** (borders as narrative units), but violates **#8** (unfalsifiable if character = self-perception) and **#7c** (multidimensional traits simplified).  

  **Conclusion for Your Purpose**: The thin/institutional view best satisfies *descriptive* needs but abandons psychology. The self-interpretive view handles stability but sacrifices falsifiability. National character’s core tension is empirical: it demands non-arbitrary, stable traits in fluid, arbitrary units. If institutions are the true explanans, jettisoning "character" loses little.
