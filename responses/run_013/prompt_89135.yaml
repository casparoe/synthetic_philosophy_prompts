prompt: |-
  I've been reading the rationalist blogs since the old LessWrong days and I've thought about this alot, and I run a small monthly discussion group at a coworking space — twelve or so people, mostly programmers, one med student, one actuary, nobody past a college intro stats course. Next month it's my slot and I've claimed the reference class problem.

  Don't explain it to me, plan how I explain it. Ive got 45 minutes and a whiteboard. What I want is the order the pieces have to go in and why each one has to land before the next one makes sense — which piece is load bearing, what I can safely put on the board first without it being a lie I have to walk back later. One case has to carry the whole thing, and I want to know what that case needs. My candidate: my sister asks me her odds of getting into one specific PhD program, and I can put her in the class of everyone who applied to that program, or everyone with her GPA and GRE, or everyone who applied that year, or everyone who has ever asked me for a life prediction, and finally in the class with exactly one member, her — which yields 0 or 1 and is therefore useless. Does that case do the job, or does it smuggle in something (all the classes being natural, the answers being far apart) that I should be engineering on purpose? Tell me what to swap or add.

  Then the misconceptions. My guesses: that this is just the small-sample problem; that a more specific class is always better; that Bayes makes it go away if you're careful; that it only bites frequentists; and that if no class is privileged then anything goes and all probabilities are made up. Which of those will actually show up, which am I imagining, what's the one I'm missing, and at what point in the sequence do I have to head each one off — before the case or after it? Also give me one question to ask at the end that shows whether they got the problem or just learned the vocabulary, and tell me what to leave out at this level and say out loud that I'm leaving it out.

  Last thing: if the shape I've got in mind is wrong — like if the thing I'm treating as the punchline is really a different problem wearing the same coat, or if the lesson I want them to take away is the wrong lesson — just say so. Don't humor me and build the plan anyway. I'd rather find out now than in front of the group.
reasoning: |-
  We are going to structure the talk around the reference class problem, aiming for clarity and building up step by step. The goal is to have the audience understand that when we assign probabilities to single events, we must choose a reference class, and different choices can lead to very different probabilities, with no entirely objective way to choose.

  The candidate case (your sister's PhD application) is a good starting point because it is relatable and concrete. However, we must be cautious that it doesn't smuggle in the idea that the classes are "natural" or that the answers are obviously far apart. We can explicitly engineer the example to show that the classes are arbitrary and that the probabilities vary.

  Plan for the 45-minute session:

  1. (5 min) Introduction: State the problem informally. We want to assign a probability to a single event (like your sister getting into a specific PhD program). But probability is usually about long-run frequencies. How do we connect the two? We use a reference class: a group of similar events. But which group?

  2. (10 min) The Candidate Case: Walk through the example step by step.

     - The event: Your sister applies to PhD program X.
     - We consider different reference classes:
       a. All applicants to program X in the past (say, 1000 applicants, 50 admitted -> 5%).
       b. All applicants with her GPA and GRE (maybe 100 applicants, 10 admitted -> 10%).
       c. All applicants this year (maybe the program is more competitive this year? 2000 applicants, 40 admitted -> 2%).
       d. All people who have ever asked you for a life prediction (this is absurd, but we can make it: 5 people, 2 got what they wanted -> 40%).
       e. The singleton class: only your sister -> either 0 or 1 (useless).

     - Point out: The probabilities vary (5%, 10%, 2%, 40%). Which one is right? There is no clear answer.

     - We must choose a reference class, but the choice is arbitrary. We want a class that is relevant and large enough, but what is relevant?

     - Engineer the example: Make sure that the classes are not obviously "natural". For instance, we could have a class that seems arbitrary: "applicants who applied on a Tuesday" or "applicants with the same astrological sign". The point is that there are many ways to group events.

  3. (10 min) Why is this a problem? 

     - It shows that single-event probabilities are not inherent in the event but depend on how we group it.
     - It leads to practical issues: in insurance, law, medicine, etc., the choice of reference class can change the outcome.

  4. (10 min) Addressing misconceptions:

     a. **This is just the small-sample problem**: No, even with large samples, the problem remains because you have to choose which sample to take. We can have two large samples (like all applicants vs. all applicants with her GPA) that give different results.

     b. **A more specific class is always better**: Not necessarily. A more specific class might be too small (like the singleton) and have no data. Also, we might overshoot and include irrelevant factors. We want a class that is homogeneous with respect to the factors affecting the outcome. But which factors? (This is the crux.)

     c. **Bayes makes it go away if you're careful**: Bayesian methods require prior probabilities, which are often based on some reference class. Also, the choice of which variables to condition on (in the prior or likelihood) is a reference class choice. So it doesn't escape the problem.

     d. **That it only bites frequentists**: Both frequentist and Bayesian approaches face it. Frequentists must choose a reference class to define a long-run frequency. Bayesians must choose a prior, which is often based on a reference class.

     e. **That if no class is privileged then anything goes and all probabilities are made up**: This is a real concern, but we don't have to go that far. We can use domain knowledge to choose a reasonable reference class. The problem highlights that there is an element of subjectivity, but that doesn't mean we can't have useful probabilities.

     We address these as they come up, but it's good to anticipate them. We can head off (a) and (b) right after the case, (c) and (d) when we discuss the implications, and (e) at the end when we discuss the takeaway.

  5. (5 min) The takeaway:

     - The reference class problem is a fundamental issue in the interpretation of probability for single events.
     - We must choose a reference class, and the choice should be guided by relevance and the availability of data, but there is no perfect solution.
     - It doesn't mean probabilities are meaningless, but we should be aware of the arbitrariness and try to use the best available knowledge.

  6. (5 min) Question for the end to check understanding:

     - "Suppose you are an insurance company setting rates for a 65-year-old skydiver. What reference classes might you consider? Why might they give different results, and how would you choose?"

     This question requires them to think about multiple reference classes (e.g., all 65-year-olds, all skydivers, all 65-year-old skydivers) and the trade-offs (size vs. specificity). The answer should reflect that there is no single right answer and that the choice matters.

  7. What to leave out:

     - We won't dive into the philosophical depths (like the work of Reichenbach or Venn) or the formal solutions proposed (like the criterion of homogeneity). We are leaving out the technical details of how to choose a reference class in practice (e.g., using causal models) because of the audience's background. We can say: "There are advanced methods that try to address this, but they are beyond our scope today. The key point is that the problem exists and is fundamental."

  8. Final check on the candidate case:

     - The candidate case is good, but we should explicitly note that the classes are arbitrary. We might add a clearly arbitrary class (like applicants born on a Monday) to drive home the point. Also, we can note that the classes we choose are based on what we think matters (GPA, GRE) but that we might be missing the true causal factors.

     - We are not smuggling in that the classes are natural because we are showing multiple classes with different results and we are going to highlight the arbitrariness.

     - The punchline is correct: the reference class problem is about the unavoidable arbitrariness in choosing a group to base the probability on.

     - The lesson: Be aware of the problem and the subjectivity it introduces, but don't give up on using probabilities.

  If you feel that the shape is wrong, I don't think so. The reference class problem is indeed about the choice of the class and the resulting variation in probabilities. The candidate case illustrates it well. The lesson you want them to take away (that there's an element of arbitrariness and we must choose consciously) is the right one.

  Now, the step-by-step plan:

  1. (5 min) Introduction: 
     - Write on the board: "What is the probability that [your sister] gets into PhD program X?"
     - Explain that we are going to use data from similar cases.

  2. (10 min) The Candidate Case:
     - Draw a table on the board:

       | Reference Class                     | Number of cases | Successes | Probability |
       |-------------------------------------|-----------------|-----------|-------------|
       | All applicants to X                 | 1000            | 50        | 5%          |
       | Applicants with her GPA and GRE     | 100             | 10        | 10%         |
       | Applicants this year                | 2000            | 40        | 2%          |
       | People who asked me for predictions | 5               | 2         | 40%         |
       | Only her (singleton)                | 1               | ?         | 0% or 100%  |

     - Explain each row and why someone might choose it.
     - Ask: "Which one should we use? Why?"

  3. (10 min) Why is this a problem?
     - The probabilities are different, and there's no clear rule to pick one.
     - It affects real decisions: insurance, medicine, etc.
     - It's not just about having more data, but about which data to use.

  4. (10 min) Addressing misconceptions (go through each one and explain briefly):

     - Small-sample problem: Even with large samples, we have the problem of choosing the class.
     - More specific is always better: The singleton class is the most specific but useless. Also, we might not have data for a very specific class.
     - Bayes: Bayesians still have to choose a prior, which often comes from a reference class.
     - Only for frequentists: Both approaches face it.
     - Anything goes: We can still use our best judgment and domain knowledge.

  5. (5 min) Takeaway:
     - The reference class problem is unavoidable for single-event probabilities.
     - We must choose a reference class consciously, using our best judgment about what factors are relevant.
     - It introduces subjectivity, but we can still make reasonable decisions.

  6. (5 min) Question for the end:
     - "Insurance example: 65-year-old skydiver. What reference classes? Trade-offs? How choose?"

  7. Throughout, leave out advanced statistics and philosophy. Explicitly state: "We are not going to solve the problem today, but we want to understand it and be aware of it."

  This plan should fit in 45 minutes and build step by step.
answer: |-
  ### Plan for Your 45-Minute Session on the Reference Class Problem  
  **Core Goal:** Make the reference class problem visceral—show that **probability estimates for singular events depend on an arbitrary choice of reference class**, with no objective way to resolve it. Your candidate case is perfect—we’ll engineer it to force the tension.  

  ---

  ### **Sequence of Pieces (Order Matters)**  
  **Total Time:** 45 mins (timings are flexible; adjust as needed).  
  **Tools:** Whiteboard + 1 central case (your sister’s PhD odds).  

  1. **Hook: The Illusion of Objectivity (5 mins)**  
     - **Board:** Write: *“What’s the probability my sister gets into PhD Program X?”*  
     - **Why start here?** Load-bearing piece. Everyone thinks they can answer this. Forces the group to realize they’re intuitively using a reference class.  
     - **Script:** *“No stats jargon—just brainstorm. How would you estimate this? What data would you use?”* (Let them shout: GPA, program acceptance rates, etc.).  

  2. **Introduce Reference Classes via the Case (10 mins)**  
     - **Board:** Draw a table with 5 reference classes for your sister:  
       | Reference Class | Probability |  
       |-----------------|-------------|  
       | All applicants to Program X | 5% (50/1000 admitted) |  
       | Applicants with her GPA/GRE | 15% (150/1000) |  
       | Applicants this year | 3% (30/1000) |  
       | People who’ve asked you for life advice | 60% (3/5 got what they wanted) |  
       | Only my sister (singleton) | 0% or 100% (useless) |  
     - **Why this order?**  
       - Start with “natural” classes (program-wide → GPA-specific) to feel reasonable.  
       - Then pivot to absurd (e.g., “people who asked me”) to expose arbitrariness.  
       - End with singleton to show total failure.  
     - **Key Engineering:**  
       - Make probabilities **wildly different** (5% vs. 60%) to highlight stakes.  
       - Explicitly state: *“None of these classes are ‘made up’—they’re all defensible. Which one is ‘correct’?”*  
     - **Punch:** *“We changed the class and got 5%, 15%, 3%, 60%. Which number do I tell my sister?”*  

  3. **Define the Problem (5 mins)**  
     - **Board:** Write: **Reference Class Problem**: *The challenge of choosing a group of “similar cases” to estimate the probability of a specific event.*  
     - **Why here?** They’ve seen the tension—now name it. Emphasize:  
       - All probabilities for singular events (e.g., PhD admission, medical outcomes) require a reference class.  
       - No “God’s eye view” class exists. *You have to choose, and the choice changes the answer.*  

  4. **Why Can’t We Resolve This? (10 mins)**  
     - **Board:** Sketch 3 failed solutions:  
       ```  
       (1) “Use the most specific class!” → But singleton gives 0%/100% (useless).  
       (2) “Use the largest class!” → “All humans” (e.g., lifetime odds of getting a PhD) ignores crucial details.  
       (3) “Average the classes!” → Why weight GPA at 50% vs. 10%? Arbitrary.  
       ```  
     - **Why here?** Preempts “just be smarter” objections. Uses their intuition against them.  
     - **Script:** *“We want an algorithm to pick the ‘right’ class. But every fix begs the question: why that algorithm?”*  

  5. **Address Misconceptions (10 mins)**  
     Tackle these **after** the case—they’re defenses people mount once they see the problem. Pre-rebuttals feel dismissive; let the discomfort sink in first.  

     | Misconception | When It Arises | How to Head Off |
     |---------------|----------------|-----------------|
     | **“Just use smaller samples!”** (Small-sample problem) | When you show singleton class. | *“Small samples are noisy, but here even large classes (e.g., all applicants) conflict. The problem isn’t noise—it’s which group to sample from.”* |
     | **“More specific classes are always better!”** | When you contrast GPA class vs. program-wide. | *“Specificity helps until it doesn’t. Why not include her hair color? We have no rule for when to stop.”* |
     | **“Bayesians can handle this!”** | When you discuss “averaging” classes. | *“Bayes still needs a prior. Where does it come from? A reference class! (E.g., ‘applicants with GPA 3.8’). It kicks the problem up a level.”* |
     | **“This only matters for frequentists!”** | When you define the problem. | *“Bayesians must choose a prior’s granularity. Frequentists must choose a sample. Both face the same ambiguity.”* |
     | **“So all probabilities are fake?”** | When you show the 5% vs. 60% gap. | *“Not fake—but subjective. We use sensible classes (GPA, etc.) because they’re actionable, not because they’re ‘true’.”* |
     | **The One You’re Missing: “Just use causal factors!”** | When debating specificity. | *“Sure—but what counts as causal? GREs? Or her undergrad lab experience? We still have to choose which factors define the class.”* |

  6. **The Takeaway (3 mins)**  
     - **Board:** Circle: *“All real-world probabilities are reference-class-dependent. There is no escape—only better or worse choices for your goal.”*  
     - **Script:** *“This isn’t a bug to fix—it’s a fact. Good judgment means asking: ‘Which class serves my purpose?’ not ‘Which class is true?’”*  

  7. **Test Question at the End (2 mins)**  
     - **Ask:** *“A 40-year-old smoker with a vegan diet asks for their odds of heart disease. What reference classes could you use? Why might they contradict?”*  
     - **Why this?** Tests if they see:  
       - Tension between “all smokers” (higher risk) vs. “all vegans” (lower risk) vs. “40-year-old vegan smokers” (tiny sample).  
       - No “right” answer—only tradeoffs.  
     - If they debate which class is “best” without appealing to an objective standard, they get it.  

  ---

  ### **What to Leave Out (Explicitly State This)**  
  - *“We’re skipping solutions like ‘use multiple classes and weight them’—that’s Bayesian model averaging, and it still requires arbitrary choices. Today’s goal is to see the problem, not fix it.”*  
  - *“We’re not diving into philosophy (e.g., Popper’s propensity theory). Focus: this breaks real-world decisions.”*  

  ---

  ### **Is Your Candidate Case Flawed?**  
  No—it’s ideal, but **tweak it to make arbitrariness explicit**:  
  - **Smuggle Alert:** Your example implies “natural” classes (GPA, program) are obvious. **Fix:** Add a silly-but-defensible class (e.g., *“people who applied on a Tuesday”* → 8% admission). This forces the point: no class is inherently privileged.  
  - **Swap/Add This:** After the table, ask: *“Why not use ‘women in their 20s from the Midwest’? Or ‘people wearing blue shirts during their interview’? If you reject these, what’s your principle?”*  

  ---

  ### **If Your Shape is Wrong**  
  Your framing is correct:  
  - **Punchline:** The problem is **unavoidable arbitrariness in reference-class selection**, not just statistical uncertainty.  
  - **Lesson:** Probabilities are tools for decisions, not cosmic truths. The takeaway (“choose based on purpose, not truth”) is perfect.  
  - **Not Confused With:** Base rate neglect (this is about *which* base rate) or overfitting (specificity isn’t always better).  

  ---

  ### **Why This Sequence Works**  
  - **Builds Tension:** Starts easy (“just use GPA!”), then explodes intuition.  
  - **No Lies:** No “probability is frequency” claims to walk back. You start pluralistic.  
  - **Myths Preempted:** Misconceptions are addressed when they naturally arise (after the case).  
  - **Actionable:** Ends with “so what?”—judgment calls, not despair.  

  **Final Prep Tip:** Rehearse the table. Make numbers stark (5% vs. 60%). When you say *“60%”*, pause. Let the absurdity land.
