  First, I need to absorb the constraints carefully: no explicit explanations of Darwin/Turing inversions, no AI/lab settings, must center on a concrete procedural artifact, and maintain ambiguity about whether the protagonist's final judgment is insight or blind competence. The vocabulary restriction is particularly challenging - terms like "understanding" or "consciousness" would violate the spirit.

  Hmm... what mundane setting could support this? Ship navigation comes to mind - specifically celestial navigation using a sextant. It's a dying craft with clear procedures, observable expertise, and potential for misinterpretation. The "concrete thing" could be a navigator's workbook with peculiar annotations. 

  For characters: a seasoned navigator (Barrow) and a younger officer (Arlen) observing him. The tension would build through Arlen's attempts to decipher Barrow's methods - is he following rote procedures or displaying deep comprehension? The workbook becomes the physical manifestation of the core question.

  Key structural points:
  - Opening: Establish Arlen's assignment to learn navigation from Barrow
  - Discovery: Arlen notices Barrow's workbook contains cryptic symbols
  - Investigation: Arlen tries to decode the system through observation
  - Climax: Barrow falls ill during critical navigation
  - Ambiguous ending: Arlen uses the workbook successfully but doesn't know why it works

  The challenge will be maintaining the inversion without stating it. I'll show Arlen's growing confidence in judging Barrow's comprehension, while making the reader question whether that judgment itself is competent or comprehended. The workbook's symbols must remain tantalizingly obscure - perhaps resembling both astrological signs and repair notations.

  Most crucially, the ending must leave doubt: when Arlen navigates using the workbook, is it because he understood Barrow's system, or because he's blindly competent at applying it? The reader should wrestle with whether Arlen himself now embodies the third inversion.
