prompt: |-
  I never studied philosophy — I'm just a person who watches a lot of movies and argues about them with my brother-in-law until he leaves the room — so if I mangle a term, please correct me as you go. Anyway I rewatched Amadeus (the 1984 Miloš Forman one, the one that won all the Oscars) for like the fourth time last month, and it landed differently this time, because I'd been reading about two ideas that seem to pull in opposite directions. On one side there's the American Dream, where the whole point is that if you're the best at something you should rise and be celebrated for it. On the other side there's Jantelagen — that Scandinavian thing, the "law of Jante," and the cousin of it people call tall poppy syndrome — where the ethic is basically that you're not supposed to think you're anybody special, and anyone who sticks up above the crowd gets cut back down to size. What got me is that the movie seems to run on the second ethic while acting like it admires the first. Mozart is the tall poppy, Salieri is the one holding the shears, and yet the film hands Salieri the narration, so we spend the whole thing inside the head of the guy doing the cutting. I don't want a plot summary or a list of themes. I want an actual reading.

  So here's the ask: take on the role of a philosopher who works on envy, resentment, and the ethics of admiration — someone who knows both the American Dream/meritocracy literature and the Jantelagen/tall-poppy critique well enough to be skeptical of both — and think carefully before you commit to anything. Start by brainstorming the different ways the Salieri-and-Mozart relationship could be framed (envy versus justified grievance, a man cheated by God versus a man who simply can't accept his own limits, the celebrated mediocrity versus the uncelebrated genius, and any others you see), then say which framing you think the film itself actually backs. Get concrete about scenes: the ones where Salieri is celebrated for work he himself knows is second-rate, the ones where he's the only person in Vienna who can hear exactly how good Mozart is, the ones where the film makes us complicit in his campaign to ruin him. What is the movie claiming — does it side with the cutter, condemn him, or somehow do both at once? And does the film show something the arguments miss, like the uncomfortable possibility that the person tearing down the successful is also the only one who truly understands them? Give me the honest counterpoint too: where does my Jantelagen reading distort the film, and where does the American Dream framing fit better than I'm giving it credit for? I know the historical Salieri and Mozart probably got along fine and that the whole rivalry is a fiction the film ran with — feel free to use that, just don't let the answer turn into a history lesson. No citations, no reading lists, no "scholars have argued" — I want your own reading, and finish by telling me what, if anything, this movie adds to the argument about celebrating the successful versus cutting them down that you couldn't get from the argument alone.
