  ok so my philosophy club did Wittgenstein last week and i get the basic idea that some words dont have a definition, they just work by family resemblance, like game or art. but then the teacher asked which concepts are actually like that and everyone just said "game" and "art" and we all sat there. so i want to do this for real.

  can you rate a list of concepts from 0 to 10 for how much theyre genuinely family-resemblance concepts, where 10 means theres no definition and never could be one, its just a mess of overlapping similarities, and 0 means theres a real definition and we either know it or could find it. use these: game, number, art, species (like in biology), fish, disease, planet, sport, sandwich, and language (as in the thing about a language being a dialect with an army). also add 2 or 3 consepts of your own that you think are tricky and would stress-test the scale.

  for each one i want two separate things, because i think theyre different and i keep mixing them up. first: is the messiness in the world or in our heads? like, is there no definition because the things themselves really dont share one thing (fish maybe, since fish arent a real branch of the tree of life), or because we just havent bothered to nail it down and could if we wanted (planet, since some astronomers basically just voted on a new definition a while back)? second: does it actually matter practically which one it is? for planet it clearly matters because of textbooks and pluto, for sandwich maybe only if a tax office gets involved.

  and at the end tell me which ones, if any, youd bet money on having a hidden real definition we just havent found yet, and whether saying "its a family resemblance concept" actually explains anything or if its just a fancy way of saying i know it when i see it.

  lead with your scores first thing, no preamble, then the reasoning.
