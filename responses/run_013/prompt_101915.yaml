prompt: |-
  I keep running into a pattern in committee decisions and I want to know whether it has a name. A group has to decide several propositions that are presented as separate questions but are not really independent. In one case I saw, a funding panel was asked to vote on three things: whether a proposed method is scientifically sound; whether it will yield a publishable result within three years; and whether the project should be funded. Each panellist had a coherent view. The trouble was that the phrase scientifically sound did not mean the same thing across the two votes. For a three-year project, sound meant likely to produce a clean result quickly; for a longer project, sound meant methodologically respectable even if the result might take a decade. So a majority could vote yes to soundness, yes to the three-year claim, and no to funding, and the combination looked like an inconsistency in the group, but no individual had changed their mind and no single proposition had been affirmed and denied. The group had, in effect, manufactured a contradiction by freezing the wording of the questions while the content of the answers shifted with the other questions on the ballot.

  A second case: a hiring committee votes on whether a candidate has sufficient research potential, whether the candidate would fit the department's teaching needs, and whether to make an offer. Several members think the candidate's potential is high only if the teaching load is reduced; others think the teaching need is genuine only if the candidate's potential is high enough to justify the reduction. Again, each member is consistent, the majority verdicts on the separate questions point one way, and the overall decision points another. But the deeper issue is not just that the separate majority verdicts are jointly inconsistent. It is that the questions themselves are being individuated in a way that makes them look independent when they are not, and that the act of voting on them separately changes what a yes on each one means.

  I know there are familiar problems about groups making inconsistent decisions from consistent individual judgments, and about the order in which issues are voted on. What I am after is the specific phenomenon where the instability lies in the issue space rather than in the aggregation rule: the same words are used, but their content is partly constituted by the other propositions under consideration, so separate majority votes can generate an apparent collective inconsistency that is really a semantic or conceptual drift. Is there an established name for this? If there is, I would like to know how it differs from the nearest concepts — the classic paradox of majority voting on connected propositions, agenda-setting effects, framing effects, and the problem of unbundling a package of issues. If there is no established name, please coin one and define it, with an account of what it is not and some boundary cases. I am not satisfied with a bare label; I want the carving: what exactly the phenomenon is, where it begins and ends, and which of the nearby ideas fits best.
reasoning: |-
  Okay, the user is describing a recurring issue in committee decisions where propositions that seem separate actually influence each other's meaning. They've provided two examples: a funding panel and a hiring committee. In both cases, individual members have coherent views, but when voting on each proposition separately, the majority outcomes appear inconsistent even though no individual is inconsistent. The key problem is that the meaning of terms like "scientifically sound" shifts depending on the other questions being considered.

  The user wants to know if this phenomenon has a name and how it differs from similar concepts like the doctrinal paradox or agenda manipulation. They're clearly well-versed in decision theory, so they need a precise conceptual analysis.

  First, I recall that the doctrinal paradox involves logically connected propositions where majority votes lead to inconsistency. But in the user's cases, it's not just logical connection - the meanings themselves change based on context. This is more subtle.

  I consider framing effects from behavioral economics, but those usually involve presenting the same information differently. Here the framing happens through simultaneous consideration of related propositions. The questions bundle together in a way that shifts interpretations.

  The concept of "issue indivisibility" comes to mind - when problems can't be separated without distortion. But that's more about policy bundles than semantic shifts.

  Looking at judgment aggregation theory, there's the problem of "interdependence of issues" where voters' judgments on one proposition affect others. But existing literature focuses on logical connections, not semantic drift.

  The core issue seems to be that the questions are context-dependent. When isolated for voting, they lose the contextual constraints that give them stable meaning. The term "semantic contagion" captures how meaning bleeds between propositions. But "conceptual entanglement" might be more precise - indicating that the concepts themselves are intertwined.

  I should differentiate this clearly from the doctrinal paradox. In doctrinal paradox, propositions have fixed meanings but majority aggregation creates inconsistency. Here, the meanings shift during the voting process itself. The inconsistency is illusory - it's an artifact of the voting method failing to account for conceptual dependencies.

  For boundary cases: If propositions were truly independent, separate voting would work. If meanings were fixed despite connections, it would just be doctrinal paradox. The phenomenon exists precisely in that middle zone where concepts are fluid and context-dependent.

  The user might be developing decision procedures for committees. Understanding this could help design better voting methods that preserve context - perhaps through package voting or deliberation before voting. They seem frustrated by committees reaching incoherent outcomes despite sensible members, so a clear framework could provide practical solutions.
answer: |-
  This phenomenon is fascinating and perceptively observed. It **does not have a widely established, single name** in social choice theory, judgment aggregation, or committee decision literature, but it represents a distinct and important pathology. The closest existing concepts capture aspects of it, but none fully encompass the core issue: **the context-dependent, co-constitutive meaning of propositions when voted on simultaneously, leading to illusory collective inconsistency despite individual coherence.**

  Here's a precise carving of the phenomenon, its boundaries, relation to existing concepts, and a proposed name:

  ### The Core Phenomenon: Semantic Interdependence Under Separate Voting

  1.  **Contextual Meaning:** The meaning of key terms within a proposition (e.g., "scientifically sound," "sufficient research potential," "fit teaching needs") is not fixed. It depends crucially on the resolution of *other, simultaneously considered propositions* within the specific decision context.
  2.  **Co-Constitution:** The propositions are not merely logically related; they *define each other* contextually. Voting "yes" on Proposition A *means something different* depending on whether Proposition B is assumed true or false, and vice versa. The meaning of each vote is contingent on the bundle.
  3.  **Separate Voting:** The committee votes on each proposition independently via majority rule, treating them as if they have stable, context-independent meanings.
  4.  **Illusory Inconsistency:** The *aggregate* of the separate majority votes appears logically inconsistent (e.g., "Sound: Yes", "3-Year Result: Yes", "Fund: No"; or "Potential: Yes", "Fit: Yes", "Offer: No").
  5.  **Individual Coherence:** Crucially, *no individual voter holds an inconsistent set of beliefs*. Each voter has a coherent, internally consistent interpretation of the terms *within their own holistic view* of the package. The inconsistency is an artifact of aggregating votes cast under *different contextual interpretations* triggered by the separate voting process.
  6.  **Outcome Mismatch:** The final outcome (funding/no funding, offer/no offer) often contradicts the implied outcome of the separate votes, precisely because the meaning of the premises shifted during voting.

  ### Proposed Name: **Contextual Meaning Collapse (CMC) in Separate Voting**

  *   **"Contextual Meaning":** Highlights that the meaning of the propositional terms is fluid and depends on the surrounding decision context (the other propositions and their assumed resolutions).
  *   **"Collapse":** Signifies that the act of isolating the proposition for a separate vote *forces* a specific interpretation or collapses the inherent context-dependence into a single, often artificial or unstable, meaning. The rich, interdependent meaning "collapses" into a simplified, often ambiguous or distorted version for the isolated vote.
  *   **"in Separate Voting":** Specifies the mechanism that triggers the pathology.

  ### How CMC Differs from Nearby Concepts

  1.  **Doctrinal Paradox / Discursive Dilemma:**
      *   **Similarity:** Both involve separate majority votes on logically connected propositions leading to collective inconsistency.
      *   **Key Difference:** In the Doctrinal Paradox, the propositions have *fixed, unambiguous meanings* and a *fixed logical connection* (e.g., P, Q, therefore R). The inconsistency arises purely from the aggregation rule applied to fixed judgments. In CMC, the *meaning* of P and Q themselves *shifts* based on the assumed resolution of the other propositions. The inconsistency is semantic, not purely logical. The "connection" isn't just logical implication; it's conceptual interdependence.

  2.  **Agenda Manipulation / Path-Dependence:**
      *   **Similarity:** Both show that the order or structure of voting affects the outcome.
      *   **Key Difference:** Agenda manipulation exploits fixed preferences/judgments by changing the sequence of binary choices on fixed-meaning propositions. CMC occurs even when propositions are voted on *simultaneously* but *separately*. The problem is the *atomization* itself forcing meaning shifts, not the sequence. The instability is in the *meaning space*, not just the preference aggregation path.

  3.  **Framing Effects:**
      *   **Similarity:** Both involve how the presentation of a choice influences its interpretation.
      *   **Key Difference:** Framing effects typically involve presenting *the same choice* in different ways (e.g., gain vs. loss frame). CMC involves presenting *different, interdependent choices* in a way that *isolates them*, altering the meaning of *each individual choice* by stripping away the necessary context provided by the others. It's the *separation* that frames each proposition poorly.

  4.  **Unbundling / Packaging Problems:**
      *   **Similarity:** Both deal with whether to vote on issues together or separately. Unbundling can lead to inconsistent outcomes if issues are complements/substitutes.
      *   **Key Difference:** Unbundling problems usually assume fixed preferences over fixed-meaning options. The inconsistency arises from revealed preference intransitivities or strategic voting. CMC focuses on the *semantic distortion* caused by unbundling – the meaning of the options themselves changes when separated. It's a deeper issue of conceptual coherence within the decision space.

  ### Boundary Cases & What CMC Is Not

  *   **Not Mere Ambiguity:** If the term "scientifically sound" was simply vague or ambiguous *from the outset for all voters*, the problem might be poor question wording, not necessarily CMC. CMC specifically requires that the meaning *shifts systematically* based on the voter's assumptions about the *other propositions* in the bundle.
  *   **Not Strategic Voting:** CMC can occur even if all voters vote sincerely according to their coherent holistic view. The inconsistency emerges from the aggregation of sincere votes cast under divergent contextual interpretations forced by separate voting. Strategic voting might exacerbate it, but it's not the root cause.
  *   **Not Preference Aggregation Cycles (Condorcet):** These cycles involve fixed alternatives and fixed preferences. CMC involves shifting the *meaning* of the propositions being voted on, which are intermediate judgments, not final alternatives.
  *   **When Context Doesn't Matter:** If the propositions are truly independent *both logically and semantically* (e.g., "Paint the room blue?" and "Buy new chairs?"), separate voting works fine. CMC requires deep conceptual entanglement.
  *   **When Meaning is Fixed by Definition:** If the committee explicitly defines "scientifically sound" *before* voting, anchoring its meaning independently of the funding context, CMC is avoided (though the Doctrinal Paradox might still occur if the logic is fixed). CMC thrives when definitions are contextual and implicit.

  ### Why "Contextual Meaning Collapse" Fits Best

  It directly captures the essence: the act of separate voting collapses the necessary contextual interdependence of the propositions' meanings, leading to aggregated results that appear inconsistent but only because the semantic ground shifted under each vote. It highlights that the pathology originates in the *individuation of the issue space* for voting, not primarily in the aggregation rule or voter preferences.

  ### Addressing the Core Frustration

  You've identified a profound flaw in how committees often handle complex, interdependent decisions by naively applying separate majority votes. The inconsistency isn't just in the outcome; it's baked into the *process* by forcing voters to answer questions stripped of the context that gives those questions their real meaning. Recognizing CMC argues strongly for alternative approaches: **package voting** (up/down on the whole proposal), **structured deliberation** to establish shared meanings *before* voting, or explicit **conditional voting** ("Fund only if both soundness AND 3-year result are approved, *using mutually agreed definitions*"). The goal is to preserve the conceptual holism inherent in the decision rather than fracturing it and manufacturing contradictions.
