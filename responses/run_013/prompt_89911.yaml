prompt: |-
  I am a retired experimental physiologist, some years into a late education in philosophy, and I would like you to build me a case rather than write me an essay about one. My question is whether the line between bringing about a harm and allowing it carries any moral weight of its own, or whether it is always a proxy for something else — a special obligation, a difference in what the agent could foresee, or a difference in the baseline against which the harm is measured. I have a specification, and I would like the case built to it.

  The specification. Two agents, one patient, one ward, one outcome: the patient dies at the same time and of the same underlying condition in both scenarios. The agents differ in exactly one respect, namely the order of two events — whether the sustaining intervention was ever begun. One agent begins it and later discontinues it; the other, meeting an identical patient on an identical day, never begins it. Hold everything else fixed: prognosis, the agents' competence and information, the alternatives available, the wishes of patient and family, the documentation of the decision, and any antecedent commitment either agent has to this patient. The sequence must be the only variable, so that whatever moral difference the case displays cannot be attributed to anything but the sequence.

  Then do the following, in this order. First, state the case in a single paragraph, in a realistic hospital setting: no trolleys, no organ lotteries, no invented technology, and I would prefer an intervention more mundane and ongoing than the familiar ventilator — and please say whether the choice of intervention matters. Second, give the verdict each of three positions must return, together with the reasoning that generates it: (i) the doctrine that it is harder to justify bringing a harm about than to allow it; (ii) the view that, other things equal, bringing a death about and allowing one are on a par; (iii) an account on which the classification of a contribution as doing or allowing is fixed not by causation but by the norm in question — roughly, if the norm requires the agent to maintain something, then letting it lapse counts as a doing, and if the norm requires only non-interference, then interfering is the doing. Third, tell me which feature of the case is doing the work, and what becomes of the three verdicts once that feature is removed. Fourth, tell me how a defender of the first position would attack the case — in particular, whether it can be dismissed as smuggling in a special obligation — and whether the attack succeeds. Fifth, if you conclude that the sequence cannot carry the weight on its own, say so plainly, and tell me which additional premise it needs.

  I want the case for a reading group, to see whether the asymmetry has any force independent of the obligations attached to it, so a case whose verdicts are stipulated rather than generated will not help me. No citations, please; I want the argument worked out from the specification.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired experimental physiologist now studying philosophy, requesting a tightly controlled case study to probe the moral distinction between doing and allowing harm. They've provided very specific parameters: identical scenarios differing only in whether a life-sustaining intervention was initiated before being withdrawn versus never initiated at all.

  Hmm, the core challenge here is designing a scenario where all variables are held constant except the sequence of actions. The ventilator example is overused, so I need something more mundane - perhaps renal replacement therapy? Dialysis fits well as an ongoing intervention that requires repeated decisions. 

  First, I'll construct the parallel cases: Dr. A starts dialysis then stops it after 48 hours when prognosis becomes clear, while Dr. B evaluates the same patient with identical information and never starts dialysis. Both patients die at the same time from the same uremic complications. The key is ensuring every other factor - prognosis, competence, patient wishes - remains identical.

  Now for the three philosophical positions. The doing/allowing distinction would see Dr. A's action as actively causing death while Dr. B merely permits it. The parity view would see both as equivalent decisions leading to the same outcome. The norm-relative account is trickier - it depends on whether dialysis initiation creates a new obligation. 

  Ah, that's the crux! The feature doing the work is the antecedent norm. If we consider dialysis initiation as establishing a duty of care, then stopping becomes a "doing" under the norm-relative view. But if no such duty exists pre-initiation, then not starting is merely "allowing." 

  I anticipate defenders of the doing/allowing distinction might argue that starting treatment creates a special obligation. But does it? The user specified no antecedent commitment, so this might reveal the distinction relies on normative frameworks rather than causal sequences alone. 

  Ultimately, the case suggests sequence alone can't carry moral weight - it needs the premise about obligation-creation through intervention. That seems to undermine any intrinsic moral difference between doing and allowing when all other factors are controlled.
answer: |-
  Here is a case built to your exact specification, designed to isolate the moral significance of the sequence of events (starting-then-stopping vs. never-starting) from all other factors. The intervention chosen is **continuous renal replacement therapy (CRRT)** for acute kidney injury (AKI) secondary to overwhelming sepsis in a patient with a terminal underlying malignancy. CRRT is ongoing, technologically dependent (like ventilation), but less frequently dramatized.

  ### 1. The Case
  Dr. A and Dr. B are experienced intensivists working in the same ICU. Patient P has widely metastatic cancer and is admitted with severe sepsis and rapidly worsening AKI. Both doctors independently evaluate P on the same day with identical information: P is alert but frail, has decisional capacity, and clearly states (with documented family agreement) a wish only for treatments offering meaningful recovery or significant comfort. Palliative care is fully available. Prognosis is uniformly grim: the sepsis is overwhelming, the malignancy is terminal, and survival beyond days is medically impossible regardless of intervention. CRRT could temporarily filter toxins but would not reverse the underlying processes and would require continuous invasive monitoring and immobilization, potentially adding discomfort without benefit. After thorough evaluation using identical protocols, both doctors conclude CRRT is medically inappropriate as it cannot meet P's goals. **Dr. A**, concerned about rapid toxin accumulation overnight, initiates CRRT emergently to "buy time" for family gathering and final palliative planning, documenting this as a time-limited trial. 48 hours later, with family present and palliative plan established, Dr. A stops CRRT as planned, providing full comfort care. P dies peacefully from uremic complications of the AKI/sepsis within hours. **Dr. B**, evaluating P with identical information and prognosis at the *exact same clinical point* as Dr. A initially did, concludes CRRT offers no net benefit and never initiates it. Dr. B provides immediate comfort care. P dies peacefully from uremic complications of the AKI/sepsis at the *same time* P would have died if CRRT had been started and stopped. The only difference is the sequence: Dr. A started and stopped CRRT; Dr. B never started it. All else is identical. *(Choice of Intervention: CRRT matters only in being an ongoing, life-sustaining medical intervention analogous to ventilation but less iconic. The argument hinges on the intervention being life-sustaining, not its specific type, provided the prognosis and burdens are identical.)*

  ### 2. Verdicts and Reasoning
  *(i) Doing/Allowing Asymmetry (It's harder to justify bringing about harm than allowing it):*
  *   **Verdict:** Dr. A's act (stopping CRRT) is morally harder to justify than Dr. B's omission (never starting it).
  *   **Reasoning:** Dr. A performed an action (discontinuing the machine) that *caused* the sequence leading directly to P's death at that moment. Dr. B merely *allowed* the underlying disease process to take its natural course by not intervening. Even though the outcome and all circumstances are identical, the *act* of stopping the intervention is a positive cause of death ("killing"), while not starting it is merely failing to prevent death ("letting die"). This causal difference imposes a stronger justificatory burden on Dr. A.

  *(ii) Moral Parity (Doing and allowing are equivalent, other things equal):*
  *   **Verdict:** Dr. A and Dr. B acted equivalently. There is no moral difference.
  *   **Reasoning:** The outcome for P is identical: death at time T from cause C, under comfort care. The doctors' intentions were identical: to avoid burdensome, non-beneficial treatment aligned with P's wishes. The information, prognosis, alternatives, and obligations were identical. The only difference is temporal and causal: one path involved a temporary intervention, the other did not. Since the intervention provided no net benefit and its withdrawal was planned from the outset (making "starting" functionally part of the assessment/comfort process), the sequence is morally irrelevant. Both decisions reflect the same judgment: that CRRT is not in P's best interests.

  *(iii) Norm-Relative Account (Doing/allowing defined by the operative norm):*
  *   **Verdict:** Potentially **no difference**, or **difference contingent on the norm's trigger**.
  *   **Reasoning:** The key question is what norm governs the doctor's behavior *at the critical decision point*.
      *   **If the operative norm is "Do not inflict harm":** At the moment Dr. A stops CRRT, stopping is an *action* that removes life-support, potentially seen as inflicting harm (violating the norm). Dr. B's not starting is an *omission* not to provide a possible benefit, not an infliction of harm (not violating "do not inflict harm"). Verdict: Dr. A's act is harder to justify.
      *   **If the operative norm is "Provide only beneficial treatment":** Both doctors are governed by this norm. Dr. A, by stopping CRRT judged non-beneficial, is *complying* with the norm (ceasing non-beneficial treatment). Dr. B, by never starting CRRT judged non-beneficial, is also *complying* with the same norm (withholding non-beneficial treatment). Neither is violating a "do not harm" norm by *causing* harm; both are fulfilling the "provide only benefit" norm by avoiding non-beneficial intervention. Verdict: No moral difference. The classification hinges entirely on whether initiating CRRT created a *new* obligation under the "do not inflict harm" norm that didn't exist before. Your specification removes antecedent commitments, making this creation key.

  ### 3. The Feature Doing the Work & Its Removal
  *   **Feature Doing the Work:** The **presence or absence of the life-sustaining intervention (CRRT) at the moment the death-causing decision is made**. For the asymmetry view, stopping an ongoing intervention *is* the harmful act, while not starting it *isn't*. For the norm-relative view, initiating the intervention potentially *creates* a new obligation under a "do not inflict harm" norm that binds Dr. A at the stopping point but doesn't bind Dr. B at the non-starting point. The physical connection/temporal immediacy feeds these interpretations.
  *   **Consequence of Removal:** If we remove the *physical intervention itself* and imagine a purely cognitive/declarative decision (e.g., both doctors identically decide "no CRRT", but Dr. A verbalizes "We will start it" then immediately says "No, stop, we won't" before any machine is touched), the distinction collapses. The physical act of connection/disconnection provides the tangible anchor for labeling one sequence a "causing" and the other an "allowing." Without it, both are clearly equivalent decisions *not to provide CRRT*. The asymmetry view struggles to find a "doing" in Dr. A's verbal sequence. The norm-relative view struggles to claim Dr. A's verbal "start" command (without physical action) created a new obligation triggering the "do not inflict harm" norm upon retraction. Only the parity view remains stable.

  ### 4. Attack from the Asymmetry Defender & Success
  *   **Attack:** The defender of (i) would argue the case **smuggles in a special obligation**. By initiating CRRT, Dr. A *took responsibility* for P's life in a way Dr. B did not. This act created a new, specific obligation *to continue* CRRT unless a strong justification for stopping emerged. Dr. B had no such specific obligation to *initiate* CRRT in the first place. Therefore, the baseline isn't identical: Dr. A has an obligation Dr. B lacks at the critical moment (stopping vs. not starting), making Dr. A's act a violation of that obligation (a "doing") while Dr. B's is merely not taking on an obligation (an "allowing").
  *   **Does it Succeed?** **Partially, but the counter is inherent in your specification.**
      *   **Success:** It highlights that the *act of initiating* might be morally transformative by creating a new obligation/dependency, which *is* part of the intuitive force behind the asymmetry. If initiating creates an obligation, then stopping violates it, while not starting doesn't.
      *   **Failure (within your spec):** Your specification explicitly removes any *antecedent* commitment. The asymmetry defender must argue that the act of initiation *itself, mechanically*, creates the obligation/responsibility *independently* of any prior relationship or promise. However, in medicine, the *ongoing* duty of care exists regardless of specific interventions initiated. Dr. B's duty of care, requiring them to make decisions about interventions like CRRT based on benefit/burden, is identical *before* the decision point. The question is whether flicking the switch "On" creates a *categorically stronger* obligation than the pre-existing duty to provide beneficial care. Your case forces the question: Does the *mere physical act* of connecting the machine, absent any *clinical change in benefit/burden assessment or relationship*, create a new, absolute obligation? If yes, that obligation *is* the "something else" the sequence proxies for. If no, the attack fails, and the sequences remain morally equivalent absent that additional premise.

  ### 5. Conclusion on Sequence and Needed Premise
  *   **Conclusion:** Based on this case and analysis, **the sequence itself (starting-then-stopping vs. never-starting) cannot carry independent moral weight.** It only appears morally significant because it often correlates with, or provides an easy marker for, other factors – crucially, **the creation of a specific obligation or dependency** by initiating the intervention.
  *   **Needed Premise:** For the asymmetry or a norm-relative view favoring asymmetry to hold in this isolated scenario, it requires the additional premise that: **The act of initiating a life-sustaining medical intervention, in itself and independently of changes in circumstance or prior obligations, creates a new, specific, and stringent obligation to continue that intervention, which is distinct from and stronger than the pre-existing obligation to consider initiating beneficial interventions.** Without this premise about obligation-creation, the moral equivalence posited by the parity view becomes compelling under your rigorously controlled conditions. The sequence is a proxy for this potential shift in obligations.
