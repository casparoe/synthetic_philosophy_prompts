prompt: |-
  I've been asked to help a small foundation design a three-year research programme in moral philosophy. The programme is to be purely conceptual — no empirical studies, no surveys, no experimental work — and its topic is supererogation: actions that are morally admirable but not required. The board is philosophically literate and wants a defended agenda rather than a survey, and since it intends to fund a coherent programme rather than a scatter of puzzles, questions that other questions depend on should outrank isolated ones. Which open questions should it fund, in what order, and why?

  Here is the board's shortlist of candidates. Evaluate these, but feel free to add, merge, demote, or reject items, and to say if any of them is a pseudo-question.

  1. The coherence of the category. If an act is morally better than every alternative open to the agent, doesn't it follow that the agent ought to do it? If so, what exactly does "supererogatory" name — a genuine deontic status, or a loose label for acts we admire but do not require?

  2. Act-types versus act-tokens. Is supererogation a property of particular performances (this donation, made now, by her) or of act-types (donating a kidney to a stranger)? Does the answer change what counts as an example, and does it matter whether the agent could have done otherwise?

  3. The mirror-image category. Are there acts that are permitted — nothing forbids them, you are within your rights — yet criticizable, the sort of thing it is fitting to resent or to think less of someone for? (This is sometimes called the suberogatory.) If such a category is real, does it show that deontic status and the fittingness of blame can come apart, and what would that do to the usual picture on which "optional" and "blameworthy" line up?

  4. Scalar pictures. On a view that ranks acts by how good they are and treats "required" as a threshold (or dispenses with it altogether), does supererogation survive as a distinct phenomenon, or is the whole category an artefact of a threshold conception of duty?

  5. Collective and institutional agents. Can states, firms, or universities act beyond what is required of them — grant asylum to more people than the law demands, forgo a legally available advantage — or is the category restricted to individual agents with individual projects?

  6. Role-relative supererogation. In some roles (clinician, rescuer, fiduciary) acts that would be supererogatory for an ordinary person appear to fall inside the role's duties. Does this show the required/optional line is partly conventional, and if so, what fixes it — the profession's own norms, reasonable expectations, or something else?

  7. Fitting attitudes. Is the phenomenon best captured in deontic vocabulary at all, or in the vocabulary of praise, admiration, and esteem — that is, is the interesting question not "was it permitted?" but "was it fitting to admire?"

  For each item, tell me how much downstream work depends on it, how tractable it is with the tools of analytic moral philosophy rather than decision theory or psychology, how neglected it is, and what a decisive result would look like. Then give the ordering and defend it against the obvious rival orderings — for instance, someone who says the coherence question must be settled first because everything else is downstream of it, and someone who says the coherence question is largely verbal and the real work lies in the applied and role-relative cases. Say explicitly what argument or finding over the next couple of years should move an item up or down the list. Finally, if the board can start only three of these, which three, and what would you drop from the shortlist entirely?

  Be explicit about which of your claims are settled in the literature and which are genuinely contested among people who know this area; don't present a contested position as the consensus, and flag any point where you are giving your own view rather than reporting the state of play.
reasoning: |-
  Okay, the user wants help designing a three-year research program on supererogation for a foundation. They've provided a shortlist of seven questions and need an evaluation and prioritization. Let me start by understanding each question and its implications.

  First, the coherence question. If an act is morally better, does it mean it's required? This is foundational. If supererogation isn't coherent, other questions might not matter. But some philosophers think it's a pseudo-problem. The user mentioned the board wants defended agendas, so I need to weigh whether this should be first or if it's too thorny.

  Next, act-types vs. tokens. This affects how we identify supererogatory acts. If it's about types, donating a kidney is always supererogatory. If tokens, context matters. This has downstream effects on examples and applications but might be less central than coherence.

  The mirror-image category (suberogatory) questions the link between permissibility and blame. If suberogatory acts exist, it challenges the standard deontic framework. This could impact how we understand supererogation's structure. It's under-explored but might depend on resolving coherence first.

  Scalar morality asks if supererogation exists without thresholds. Consequentialists might see it as an artifact. This is crucial for the category's viability. If scalar views prevail, supererogation might collapse. But if duties have thresholds, it survives. This intersects with coherence.

  Collective agents: can institutions perform supererogatory acts? This extends the concept but depends on prior clarity about what supererogation is. Without resolving coherence, this might be premature. It's applied but could be secondary.

  Role-relative supererogation examines how professional roles shift duties. A paramedic saving lives isn't supererogatory; it's their duty. This suggests context-dependency. It's important for applied ethics but relies on a clear definition.

  Fitting attitudes propose focusing on admiration instead of deontic status. This might bypass coherence issues by shifting the framework. It's a different approach but could be complementary. However, it might not resolve the core debates.

  Now, prioritizing. Coherence (Q1) is fundamental. If unresolved, other questions might be moot. But some think it's intractable. The board wants a coherent program, so starting here makes sense. If progress happens, it enables other research. If not, pivot to fitting attitudes (Q7).

  Scalar morality (Q4) is next because it directly challenges supererogation's existence. Resolving this affects the whole category. Then suberogatory (Q3) as it tests the deontic framework's symmetry, which supports or undermines supererogation.

  Act-types/tokens (Q2) is important but can be addressed later. Role-relative (Q6) and collective agents (Q5) are applied topics needing foundational clarity. Fitting attitudes (Q7) is a viable alternative if coherence stalls.

  For the first three years, focus on Q1, Q4, Q3. They are interconnected and foundational. Drop Q5 (collective agents) as it's too dependent on earlier answers. Keep Q7 as a backup if Q1 hits roadblocks.

  The user might also want to ensure the program has clear milestones. Year 1: coherence and scalar issues. Year 2: suberogatory and role relativity. Year 3: applications and fitting attitudes. This builds logically. The board's concern about scatter versus coherence is addressed by this structure.
answer: |-
  Here is a rigorously defended research agenda for the foundation, prioritizing conceptual clarity, leverage, and coherence. I evaluate each item on the board's shortlist, add one critical omission, rank them, and specify the optimal starting trio. My evaluation draws on established debates (e.g., Heyd, Urmson, Chisholm, Driver, Archer, Dale) while explicitly flagging contested claims.

  **Evaluation of Shortlist Items (+ Addition):**

  1.  **The coherence of the category (Q1):**
      *   **Downstream Dependence:** **MAXIMAL.** Resolving this is foundational. If supererogation is incoherent, much work on the other questions becomes moot or needs radical reframing. If coherent, it defines the object of study.
      *   **Tractability:** **MODERATE-HIGH (Purely Conceptual).** Core analytic tools suffice: conceptual analysis, logical argumentation (e.g., addressing the "paradox of supererogation"), exploring competing deontic logics (e.g., triadic vs. dyadic systems). Avoids empirical/decision theory.
      *   **Neglected?** **NO.** This is the *central* debate (e.g., Portmore's "Maximizing Act-Consequentialism" vs. defenders like Horgan/Timmons, McNamara). *However*, framing it specifically for downstream impact is valuable.
      *   **Decisive Result:** Consensus on either (a) a defensible conceptual schema showing how "optional but best" is logically possible (e.g., via agent-centered prerogatives, non-maximizing duties, or fitting attitude analyses) *or* (b) a compelling demonstration that any act morally better than alternatives *must* be obligatory, rendering "supererogation" merely a label for admirable but required acts (or incoherent). *(Contested: Whether any existing defense is fully successful is hotly debated.)*
      *   **Verdict:** **Essential, but potentially intractable as a starting point.** Must be addressed early, but the programme shouldn't stall if full consensus proves elusive.

  2.  **Act-types versus act-tokens (Q2):**
      *   **Downstream Dependence:** **MODERATE-HIGH.** Impacts how examples are identified, the stability of moral judgments, and theories of moral responsibility/praise. Crucial for Q5 & Q6.
      *   **Tractability:** **HIGH (Purely Conceptual).** Standard tools of analytic philosophy: thought experiments, counterfactual analysis, exploring the metaphysics of actions and properties.
      *   **Neglected?** **SOMEWHAT.** Often assumed rather than rigorously examined. Driver and Archer have engaged, but systematic treatment is lacking.
      *   **Decisive Result:** A robust theory explaining whether supererogation primarily resides in context-specific performances (tokens) or general kinds of actions (types), and how features like cost, ability, and alternative possibilities factor in. *(Contested: Strong intuitions exist on both sides; no consensus.)*
      *   **Verdict:** **Important, tractable, good early candidate.** Clarifies the target phenomenon.

  3.  **The mirror-image category (Suberogatory) (Q3):**
      *   **Downstream Dependence:** **HIGH.** Directly challenges the symmetry of the deontic landscape. A real suberogatory category strongly supports the coherence of supererogation (Q1) by showing permissibility and blameworthiness can diverge. Crucial for Q1 & Q7.
      *   **Tractability:** **HIGH (Purely Conceptual).** Involves conceptual mapping, analyzing the fittingness conditions of blame/resentment vs. obligation, exploring "moral remainders."
      *   **Neglected?** **YES (Relatively).** Discussed (e.g., Chisholm, Heyd, Mellema), but less systematically than supererogation itself. Requires deeper integration.
      *   **Decisive Result:** Establishing whether there is a distinct category of permissible-yet-blameworthy acts (suberogatory), and articulating its relationship to supererogation (e.g., symmetrical asymmetry). *(Contested: Existence is debated; some view it as merely "permissible but bad" without distinct status.)*
      *   **Verdict:** **High strategic value for Q1, tractable, under-explored.** A potential game-changer.

  4.  **Scalar pictures (Q4):**
      *   **Downstream Dependence:** **VERY HIGH.** Directly attacks the *necessity* of the supererogatory category. If successful, it dissolves Q1-3, Q6-7 as traditionally framed. Fundamental to the whole project.
      *   **Tractability:** **MODERATE (Purely Conceptual).** Engages core debates in moral ontology (are duties threshold-based or scalar?) and value theory. Requires analytic argument, not empiricism.
      *   **Neglected?** **NO (in Consequentialism), YES (in Deontology).** Central to consequentialist critiques (e.g., Norcross), but less thoroughly addressed from non-consequentialist perspectives defending thresholds.
      *   **Decisive Result:** Either (a) a convincing defense that scalar morality can accommodate a robust (non-artefactual) concept of supererogation (e.g., via virtue or fitting attitudes), *or* (b) a demonstration that scalar views cannot capture the required/optional distinction meaningfully, *or* (c) a successful defense of threshold-based duties against scalar critiques. *(Contested: Whether consequentialism *must* be purely scalar is debated; whether non-scalar views are defensible is core.)*
      *   **Verdict:** **Foundational and urgent.** Cannot be postponed; its outcome dictates the viability of the entire category.

  5.  **Collective and institutional agents (Q5):**
      *   **Downstream Dependence:** **LOW-MODERATE.** Builds *on* settled concepts of individual supererogation and collective agency. Depends heavily on Q1, Q2, Q6.
      *   **Tractability:** **MODERATE (Purely Conceptual).** Applies theories of collective intentionality, responsibility, and institutional roles to supererogation. Analytic tools suffice.
      *   **Neglected?** **YES.** Seriously under-theorized (some work by Collins, Hindriks, but limited).
      *   **Decisive Result:** A defensible account of whether/how collective agents can perform supererogatory acts, including criteria distinguishing institutional supererogation from mere good PR, efficiency, or fulfilling imperfect duties. *(Contested: Basic possibility is debated; hinges on views of collective agency/morality.)*
      *   **Verdict:** **Important application, but downstream.** Lower priority for initial coherence.

  6.  **Role-relative supererogation (Q6):**
      *   **Downstream Dependence:** **MODERATE.** Tests the flexibility and context-dependence of the required/supererogatory boundary. Informs Q2 & Q5. Depends on Q1 & Q4.
      *   **Tractability:** **MODERATE-HIGH (Purely Conceptual).** Analyses of professional ethics, role obligations, conventionalism vs. objectivism, and the sources of normativity (contracts, expectations, function).
      *   **Neglected?** **SOMEWHAT.** Discussed in applied ethics (medical, military), but lacks a general, rigorous theoretical framework integrated with core supererogation theory.
      *   **Decisive Result:** A theory explaining how roles shift the deontic status of actions, specifying what *fixes* role duties (e.g., constitutive aims, reasonable expectations, contracts) and how this relates to "ordinary" morality. *(Contested: The degree to which roles create genuinely *distinct* moral obligations vs. specifying general ones.)*
      *   **Verdict:** **Valuable for application, depends on foundational work.** Mid-tier priority.

  7.  **Fitting attitudes (Q7):**
      *   **Downstream Dependence:** **VERY HIGH (Alternative Path).** Offers a potential *solution* to Q1 & Q4 by shifting the paradigm entirely. Could reframe the entire project away from deontic status to evaluative responses.
      *   **Tractability:** **HIGH (Purely Conceptual).** Core analytic work on the nature of admiration, esteem, praise, and their fittingness conditions. Connects to value theory and metaethics.
      *   **Neglected?** **INCREASING ATTENTION, BUT UNDERUTILIZED HERE.** Fitting Attitudes (FA) analyses are prominent in value theory (e.g., D'Arms & Jacobson, Crisp) but not yet fully leveraged *as a primary framework* for supererogation (though see Archer).
      *   **Decisive Result:** A fully developed FA account of supererogation that either (a) convincingly explains why supererogatory acts warrant admiration *without* being required (solving Q1), or (b) demonstrates the limitations of deontic approaches, or (c) shows FA cannot capture the phenomenon alone. *(Contested: Whether FA can fully replace deontic categories or merely complement them is unresolved.)*
      *   **Verdict:** **High strategic potential, tractable, timely.** Could be a breakthrough avenue.

  8.  **ADDED: The Limits and Demandingness (Q8):** *What defines the upper boundary of duty, making acts beyond it supererogatory? Is it cost, sacrifice, personal projects, optionality of beneficence, or something else?*
      *   **Rationale:** This is a glaring omission. Without understanding what *makes* something beyond duty, supererogation remains undefined. It's implicit in Q1 & Q4, but needs explicit focus. Heyd, Kamm, and discussions of demandingness (Murphy, Scheffler) touch on it, but a unified theory is lacking.
      *   **Downstream Dependence:** **MAXIMAL.** Directly defines the phenomenon. Crucial for Q1, Q2, Q4, Q6.
      *   **Tractability:** **MODERATE (Purely Conceptual).** Analyzes concepts of cost, sacrifice, personal integrity, reasonable demand, optionality.
      *   **Neglected?** **PARTIALLY.** Often discussed *en passant* or within specific frameworks (e.g., consequentialist demandingness), but lacks a standalone, comprehensive treatment within supererogation theory.
      *   **Decisive Result:** A principled account of the factors that shift an act from obligatory to supererogatory, explaining when costs/sacrifices become "significant enough" or how personal projects create moral space. *(Highly Contested: Deep disagreements exist between consequentialist, deontological, and virtue-based answers.)*
      *   **Verdict:** **Essential and foundational.** Must be integrated early.

  **Prioritized Research Order & Defense:**

  1.  **#4 Scalar Pictures & #8 Limits/Demandingness (Tied Priority - Year 1 Focus):**
      *   **Why First?** These are the most fundamental *existential* and *definitional* questions. Q4 challenges the *possibility* of the required/optional distinction central to supererogation. Q8 defines the *content* of that boundary. **Everything else depends on their resolution.** Can supererogation survive a scalar view? What *is* the threshold of duty? Without answers, work on coherence (Q1) or fitting attitudes (Q7) lacks a stable target, and applied questions (Q5, Q6) are premature. Tackling them together is synergistic: defending a threshold (Q8) answers scalar critiques (Q4), while scalar success undermines traditional threshold-based supererogation.
      *   **Defense Against Rival Orderings:**
          *   *"Coherence (Q1) First":* While Q1 is crucial, Q4 is even *more* fundamental. If scalar morality dissolves the required/optional distinction, Q1 becomes a question about a non-existent category. Progress on Q1 *presupposes* the viability of a threshold conception (under attack in Q4). Resolving Q4/Q8 provides the framework *for* addressing Q1 coherently. *(My View: This prioritizes ontological grounding over conceptual coherence checks.)*
          *   *"Applied (Q5/Q6) First":* Applied work relies on a stable, defined concept. Without resolving Q4/Q8, judgments about institutional or role-based supererogation lack foundations and risk inconsistency. What counts as "beyond duty" for a corporation is undefined without Q8 and vulnerable to Q4's critique.

  2.  **#3 The Mirror-Image Category (Suberogatory) (Year 1/2 Focus):**
      *   **Why Second?** Q3 offers powerful, *relatively independent* leverage on the coherence question (Q1). If suberogatory acts are demonstrably real (permissible yet blameworthy), it provides a strong case for the *structural possibility* of deontic asymmetry, directly supporting the logical coherence of supererogation (permissible yet praiseworthy). This can progress alongside Q4/Q8 and provides concrete phenomena to test definitions against. Its tractability and relative neglect make it a high-yield early target. Success here significantly strengthens the position against Q1 skeptics or scalar assimilators.
      *   **Defense:** Q3 doesn't *require* full resolution of Q4/Q8 first. Analyzing the structure of blame/permissibility divergence is valuable even while debating the nature of the duty threshold. Its positive result (establishing suberogation) would be a major independent contribution and bolster the supererogation project.

  3.  **#1 The Coherence of the Category (Q1) & #7 Fitting Attitudes (Q7) (Tied Priority - Year 2 Focus):**
      *   **Why Third?** With groundwork laid by Q4/Q8 (defining the boundary) and Q3 (demonstrating deontic asymmetry), Q1 can now be tackled more fruitfully. The focus shifts from "is it possible?" (partially addressed by Q3) to "how is it best conceptualized?" Q7 is paired here because it offers the most promising *alternative* or *complementary* framework to traditional deontic approaches to Q1. Progress on Q4/Q8/Q3 informs both avenues. Exploring whether FA provides a better home for supererogation than deontic logic is a major conceptual shift enabled by prior work.
      *   **Defense:** Addressing Q1/Q7 *after* Q4/Q8/Q3 ensures the coherence debate is grounded in a defined phenomenon (Q8) and a structurally possible deontic landscape (Q3), and informed by the scalar challenge (Q4). Starting Q1/Q7 earlier risks circularity or talking past critics who deny the foundational assumptions (like thresholds).

  4.  **#2 Act-Types vs. Act-Tokens (Q2) & #6 Role-Relative Supererogation (Q6) (Year 2/3 Focus):**
      *   **Why Fourth?** These questions refine the *application* of the concept defined and defended in the prior stages. Q2 clarifies *what* is being judged (specific acts or kinds), crucial for consistent identification and praise. Q6 explores a major source of context-dependence, testing the stability of the core concept (from Q1/Q7) across different social spheres. They build directly on the foundational work.
      *   **Defense:** These are essential for a complete picture but depend on having a coherent concept (Q1/Q7) and an understanding of the duty boundary (Q8). Resolving type/token *after* core coherence avoids getting bogged down in examples before the category is secure.

  5.  **#5 Collective and Institutional Agents (Q5) (Year 3 Focus):**
      *   **Why Last?** This is the most applied and derivative question. It requires well-developed answers to Q1 (coherence), Q2 (what is being judged - collective acts?), Q6 (role obligations of institutions), and Q8 (what counts as "beyond duty" for a collective). It extends the concept but doesn't challenge foundations.
      *   **Defense:** Premature focus risks misapplying an individual-focused concept or getting entangled in unresolved debates about collective agency/morality before the core supererogation theory is stable.

  **Dynamic Adjustment Triggers:**

  *   **Move Q4/Q8 Up:** If Year 1 work suggests scalar critiques are easily defused or thresholds robustly defensible, Q1/Q3/Q7 could accelerate. If scalar challenges appear devastating, Q7 (FA) becomes the primary focus, potentially demoting traditional deontic Q1.
  *   **Move Q3 Up:** If early Q3 progress yields a strong, consensus case for suberogation, it significantly de-risks Q1 and could shift focus earlier to Q1/Q7.
  *   **Move Q7 Up:** If Q4/Q8 stall or suggest deep problems for deontic thresholds, pivot to Q7 as the primary framework early in Year 2, potentially reframing the entire programme around FA.
  *   **Move Q5 Up:** Only if foundational work (Q1, Q7, Q8) resolves surprisingly quickly and cleanly, *and* institutional ethics emerges as a board priority.
  *   **Demote Q1:** If Q1 proves intractably divisive *after* progress on Q3/Q4/Q8, focus energy on Q7 (FA) and applied questions (Q2, Q6) using the FA or best-available-deontic framework.

  **Top Three to Start & What to Drop:**

  1.  **#4 Scalar Pictures:** (Existential threat, defines the battleground).
  2.  **#8 Limits/Demandingness (Added):** (Defines the core phenomenon - what "beyond duty" means).
  3.  **#3 The Mirror-Image Category (Suberogatory):** (Provides independent leverage on coherence/structure, tractable, under-explored).

  **Why This Trio?** They address the most fundamental challenges (Q4), define the core concept (Q8), and provide a strategically valuable independent argument (Q3). Together, they create a coherent Year 1 focus on establishing the *possibility, definition, and structural grounding* of the supererogatory category. This provides the essential foundation for conceptual refinement (Q1, Q7), application (Q2, Q6), and extension (Q5) in Years 2-3.

  **Drop from Shortlist:** **#5 Collective and Institutional Agents.** While potentially important, it's the most derivative, applied, and dependent on prior resolutions. It has the least leverage on the core conceptual puzzles and is the least essential for establishing the coherence and definition of supererogation itself. Resources are better spent on foundational and high-leverage questions first. *(My View: While collective supererogation is interesting, it's a luxury within a 3-year foundational programme. Q2 & Q6 offer more central applications.)*
