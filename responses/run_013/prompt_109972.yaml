answer: |-
  Here’s a structured 40-minute lesson plan tailored to your constraints, using British English and focusing on conceptual clarity while pre-empting misconceptions. The core example avoids conflating tense and counterfactuality.

  **Lesson Goal:** Distinguish **indicative** (about open possibilities) and **counterfactual** (about imagined alternatives to known facts) conditionals.  
  **Key Insight:** The difference lies in the **speaker’s commitment to the truth/falsity of the antecedent**, signalled by grammar (tense/mood).

  ---

  ### **Lesson Plan (40 mins)**

  #### **1. Anchor in Truth Tables & Reveal the Problem (8 mins)**
  *   **Do:** Start with what they know. Write truth table for material implication (P → Q) on the board. Elicit: False *only* when P=T and Q=F.
  *   **Say:** "In maths, 'if P, then Q' is a truth function. But does this capture *all* uses of 'if' in English? Let's test."
  *   **Pose Problem Case:**  
      *   Scenario: *It is currently bright sunshine.*  
      *   Sentence A: "If it **is raining**, the streets **are** wet." (Write this.)  
      *   Sentence B: "If it **were raining**, the streets **would be** wet." (Write this next to A.)
  *   **Ask:** "According to the truth table, are A and B both true right now? (P='it is raining' is *actually* false, Q='streets are wet' is *actually* true? false?)" *[Highlight: Both have a false antecedent and a true consequent. Truth table says both should be TRUE.]*
  *   **Reveal Tension:** "But do these two sentences *feel* the same? Do they mean the same thing in this situation?" (Elicit 'no'.) "So what's different? That's our puzzle."

  #### **2. Introduce the Core Distinction via Minimal Pair (10 mins)**
  *   **Present & Contrast:** Point to Sentences A (Indicative) and B (Counterfactual).
  *   **Analyse Context:** "We *know* it's not raining (antecedent false). But look at the *grammar* and the *implication*:
      *   **Sentence A (Indicative):** "If it **is** raining..." Uses present simple indicative. Sounds odd/unnatural here. *Why?* It hints the speaker thinks rain is *possible* or doesn't know. It clashes with our *knowledge* that it's sunny.
      *   **Sentence B (Counterfactual):** "If it **were** raining..." Uses past subjunctive 'were' + 'would be'. Sounds perfectly natural. *Why?* It directly matches our knowledge: we *know* it's not raining, and we're imagining what *would* follow *if* it were.
  *   **Define:**
      *   **Indicative Conditional:** Discusses a *possibility* (the speaker isn't sure if P is true/false, or presents it neutrally). *Grammar:* Usually present/past simple indicative ("is", "was").
      *   **Counterfactual Conditional:** Discusses a *contrary-to-fact scenario* (the speaker believes/knows P is false). *Grammar:* Uses 'backshifted' tense/mood (past/past perfect, often with "would/could/might/should have").
  *   **Key Point:** "The difference isn't *just* about whether P *is* false. It's about whether the speaker *takes P to be false* and *signals this grammatically*."

  #### **3. Test & Refine: Factual vs. Counterfactual Antecedents (10 mins)**
  *   **Scenario:** *We got our exam results an hour ago. You passed.*  
  *   **Ask for Sentences:**  
      *   "What might you say *yesterday* (before results), worried but hopeful?" → Elicit: **"If I pass, I’ll celebrate."** (Indicative: P open/possible).
      *   "What might you say *now* (knowing you passed)?" → Elicit: **"If I’d failed, I’d have been devastated."** (Counterfactual: P known false).
  *   **Crucially Add:** "What if you *failed*?" → Elicit: **"If I passed, I’ll be amazed!"** (Indicative: Speaker *knows* P is false? But grammar is indicative! Feels sarcastic/odd).
  *   **Highlight:** "See! Even if P *is* false (like the speaker failing), using the *indicative* ("If I passed...") clashes. It suggests the speaker *doesn't know* or thinks it's possible – which they *do* know it's false! The counterfactual **"If I *had* passed..."** would be needed to properly express their actual belief (that passing is false). The grammar *signals the speaker's belief state* about P."

  #### **4. Tackling Misconceptions Head-On (7 mins)**
  Address these *explicitly* as they arise or here:
  *   **"Counterfactual = Antecedent is False":** "Partly true, but incomplete! The *key* is the *speaker presents it as false*. Sometimes we use counterfactuals even if we're not 100% certain ('If he were guilty, he'd act this way' – we might not *know* he's innocent). The *grammar signals the speaker treats it as false*." *(Pre-empts confusion)*
  *   **Tense = Time:** "No! The past tense in counterfactuals is *grammatical mood*, not time. 'If it rained tomorrow...' (using indicative past) usually signals the speaker thinks it *won't* rain – it's a counterfactual *about the future*! 'If it rains tomorrow...' (present indicative) is neutral/open." *(Crucial to state clearly)*
  *   **Politeness/Hedging/Likelihood:** "While counterfactuals *can* be softer ('If I were to suggest...'), that's not core. The core is the *presentation of P as non-factual*. Indicatives aren't inherently 'more likely'." *(Mention briefly if raised)*
  *   **Indicative = Logical, Counterfactual = Loose:** "No! Both are genuine semantic types. Material implication is a poor model for *either* in natural language. We're not 'bolting on' extra meaning; we're recognising different linguistic tools for different jobs." *(Essential rebuttal)*

  #### **5. The Final Puzzle & Wrap-Up (5 mins)**
  *   **Pose the Puzzle:** "So, counterfactuals need the speaker to believe the antecedent is false? Try this: 'If I **were** you, I **would** revise harder.' What's the antecedent ('I am you')? Is it *false*? Obviously! But crucially, *could it ever be true?* No! It's *necessarily* false. Yet the counterfactual form is the *only* way to say this naturally. Why? What does this tell us about how counterfactuals work beyond just reflecting known facts? Is it about *impossibility* as well as *falsity*?"
  *   **Summarise:** "Remember: **Indicative** = P presented as open/possible (grammar: simple indicative). **Counterfactual** = P presented as false/non-factual (grammar: backshifted tense + modal like 'would'). The difference is in the speaker's stance, signalled by grammar."
  *   **Explicit Omission:** "We *aren't* going into possible worlds, strict implication, or the subtleties of the subjunctive mood today. This is the core semantic distinction needed to move beyond the truth table. Any immediate questions before we finish?"

  ---

  ### **Why This Structure & Your Example**
  1.  **Starts Familiar (Truth Tables):** Validates their existing knowledge before showing its limits. Creates cognitive dissonance ("Why do these feel different?").
  2.  **Core Minimal Pair (Rain):** **Replaces your coach example.** Why?
      *   **Problem with Coach:** Confounds time (present vs. past assessment) *and* factuality. Students might attribute difference to time, not counterfactuality.
      *   **Strengths of Rain Pair:**
          *   **Same Time Frame:** Both about *right now*.
          *   **Same Real-World Facts:** Antecedent is demonstrably false in the context.
          *   **Only Varies Grammar & Speaker Stance:** Isolates the target distinction perfectly.
          *   **Intuitive Clash:** The indicative sounds immediately "wrong" in the sunny context, making the counterfactual sound "right" by contrast.
  3.  **Testing Ground (Exam Results):** Reinforces using a relatable scenario. Crucially introduces the case where P *is* false but *indicative* is used incorrectly, proving it's about *signalling belief*, not just objective falsity. Addresses the "antecedent must be false" misconception directly.
  4.  **Misconceptions Addressed Proactively:** Each common error is tackled at the point where evidence against it has just been presented (e.g., after Exam Results for the falsity misconception). Stating "Tense ≠ Time" explicitly is vital.
  5.  **Ends on a Live Puzzle (Were I You):** This is perfect. It's universally understood, clearly counterfactual, but challenges a simplistic "P is false" definition by involving *necessary* falsity. It shows the distinction has landed (they grasp the core use) but opens a deeper question (how does it handle impossibilities?) without needing an answer now.
  6.  **Manages Expectations:** Explicitly stating omissions ("no possible worlds") prevents tangents and frames the lesson's achievable scope.

  **Key Example to Build On:** **"If it is raining..." (Indicative) vs. "If it were raining..." (Counterfactual)** in the context of *current bright sunshine*. This pair carries the weight flawlessly.

  **Circulation Note:** This plan provides a clear, logical sequence using their existing knowledge as a springboard, directly tackles anticipated misconceptions, uses relatable examples, and ends with a stimulating puzzle – all within time constraints and using only a whiteboard. Good luck!
