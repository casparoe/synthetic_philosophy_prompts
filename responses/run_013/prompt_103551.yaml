  ### Activity Design: Dennett's Four Grades of Creature  
  **Objective:** Illustrate the jumps between grades, especially Skinnerian→Popperian (internal simulation) and Popperian→Gregorian (external cognitive tools).  

  **Puzzle:** **"Code Quest"**  
  - *Setup:* A 3-digit code (each digit 1–4) unlocks a "treasure box" (e.g., a locked container with candy).  
  - *Feedback:* After each guess, the instructor gives **number of correct digits** (e.g., "2 correct" if two digits match the code’s position/value).  
  - *Materials:*  
    - 6 sets of digit cards (1–4) for group guesses.  
    - Tokens (e.g., glass beads) for Skinnerian costs.  
    - Scratch paper, rulers, markers for Gregorian tools.  
    - Candy for rewards.  
  - **Groups:** Divide 18 students into 6 teams of 3.  

  ---

  ### **Rounds: Rules, Timing, and Transitions**  
  *Total Time: 75 minutes (15-min debrief).*  

  #### **Round 1: Darwinian (10 min)**  
  - **Rules:**  
    - Teams get **one guess** (submit 3 digit cards).  
    - **No feedback** during the round.  
    - After all guesses, reveal the code. Teams with *most correct digits* "survive" (e.g., 2+ correct). Only surviving teams may reproduce (clone their code) in the next round.  
  - **Transition Trick:** Announce *after* the round: *"Next round, you’ll get feedback... but it’ll cost you."*  
  - **Why it Fails:** Most teams guess randomly → few "survivors." Students feel the frustration of blind selection.  

  #### **Round 2: Skinnerian (15 min)**  
  - **Rules:**  
    - **New code.** Teams get **5 tokens** (each token = one guess).  
    - Submit a guess → pay 1 token → get feedback (e.g., "1 correct").  
    - Solve the code? Win candy. Out of tokens? Eliminated.  
  - **Transition Trick:** When teams complain about token costs, say: *"What if you could test ideas without paying? Try it next round."*  
  - **Key Jump:** Teams physically experience **costly trial-and-error** (e.g., burning tokens on bad guesses).  

  #### **Round 3: Popperian (20 min)**  
  - **Rules:**  
    - **New code.** Teams get a **"spec sheet"** (constraints, e.g., "Digit 1 is even").  
    - **Unlimited free simulations:** Test guesses *on scratch paper* without submitting.  
    - **One free real guess** at the end (no cost).  
  - **Transition Trick:** After teams solve it, note: *"You used internal models. But what if you offloaded thinking to a tool? Build one next."*  
  - **Key Jump:** Teams use constraints to simulate outcomes mentally → **mistakes die on paper, not in reality.**  

  #### **Round 4: Gregorian (25 min)**  
  - **Rules:**  
    - **New code.** Teams design a **physical tool** in 10 min (e.g., grid, flowchart, lookup table).  
    - **Tool Swap:** After building, tools are **redistributed randomly** (e.g., Group 1 gets Group 4’s tool).  
    - Teams use the *new tool* + **one free guess** to solve.  
    - *Critical rule:* **No talking during tool use** (prevent teamwork from replacing the tool).  
  - **Key Jump:** Success depends on the **tool’s design, not team skill** → externalized cognition.  

  ---

  ### **Debrief (15 min)**  
  - **Map to Dennett’s Grades:**  
    | **Round** | **Grade** | **Core Distinction** |  
    |-----------|-----------|----------------------|  
    | 1 | Darwinian | Improvement only via selection (no learning). |  
    | 2 | Skinnerian | Learning via costly trial-and-error. |  
    | 3 | Popperian | Mistakes die *internally* via simulation. |  
    | 4 | Gregorian | Cognition extends to external tools. |  
  - **Highlight Jumps:**  
    - **Skinnerian→Popperian:** Contrast token costs (R2) vs. free simulations (R3). Ask: *"How did constraints let you avoid real mistakes?"*  
    - **Popperian→Gregorian:** Note how tools (R4) made mediocrity competitive. Ask: *"When you used another team’s tool, who was ‘thinking’—you or the tool?"*  
  - **Predictable Problems & Fixes:**  
    - **Gregorian teamwork:** Enforce **silence during tool use** (penalize talking).  
    - **Darwinian ambiguity:** If no team "survives," select the *least wrong* guess.  
    - **Popperian overfitting:** If teams ignore constraints, remind them the spec sheet is their "internal model."  
  - **Unreproducible Element:** The **iterative generational change** in Darwinian systems (we simulate it via selection, but true multi-generation dynamics require longer timelines).  

  ---

  ### **Confidence & Uncertainty**  
  - **High-Confidence Choices:**  
    - **Token costs (Skinnerian):** Forces visceral understanding of "paying for mistakes."  
    - **Tool swap (Gregorian):** Cleanly isolates tool efficacy from team skill.  
    - **Spec sheet (Popperian):** Constraints enable internal simulation without collapse to trial-and-error.  
  - **Least Confident Point:** **Popperian spec sheet simplicity.**  
    - *Why:* Complex constraints could overwhelm; too simple feels trivial.  
    - *Mitigation:* Use 2–3 layered constraints (e.g., "Digit 1 + Digit 2 = 5", "Digit 3 is prime"). Test beforehand.  
  - **Overall Confidence:** **85%.** Activity captures core jumps, but success hinges on:  
    - Strict timekeeping.  
    - Enforcing rules (especially silence in R4).  

  ---

  ### **Final Tips**  
  - **Prep Work:** Pre-make digit cards, tokens, and code sheets (one per round).  
  - **Puzzle Tuning:** Use digits 1–4 (not 1–9) to keep it solvable.  
  - **Candy Incentive:** Award candy to R2/R3/R4 winners to amplify cost/benefit stakes.  
  - **When It Flops:** If teams dominate early, add "code variants" (e.g., R4 codes include letters).  

  This design forces students to *embody* each grade’s limitations and breakthroughs. The Skinnerian→Popperian jump becomes visceral when tokens vanish and scratch paper triumphs. Gregorian tools turn abstract "extended mind" theory into a race where a clunky flowchart beats a genius without one.
