prompt: |-
  I'm convening a small graduate reading group on free will and moral responsibility, and I want us to fix our standards before we start adjudicating between compatibilism and incompatibilism — otherwise the whole term degenerates into everyone defending the position they walked in with. So before we read any positions, write me the specification: what must a theory of free will actually deliver in order to count as adequate? I mean the full list of desiderata, each one attached to the case or consideration that motivates it — the cases the theory has to get right, the distinctions it cannot be allowed to collapse, and the commitments or results it has to remain consistent with. Keep the weight on the requirements themselves and on why each is a requirement; I do not want a survey of who says what, and I do not need citations or a reading list.

  For the cases, I have in mind at least these: the person who signs a contract at gunpoint against the willing collaborator who signs with enthusiasm; the addict who endorses her habit and the addict who fights it; the Frankfurt-style agent who could not have done otherwise but acted exactly as she wanted; the kleptomaniac; the agent whose values were deliberately sculpted by someone else and who now endorses them wholeheartedly; the person who simply does nothing while someone drowns, which makes me wonder whether a theory of free will owes an account of omissions and not just of actions; the person acting on a false belief; and the person whose conduct is the output of a committee procedure or a model. For the distinctions, I want the theory held to the difference between freedom of action and freedom of the will, between being a source of one's action and being able to do otherwise, between being free and being responsible and being blameworthy, and between compulsion, coercion, constraint, and mere determination. For the background commitments, it should be consistent with determinism being either true or false (or explain why it cannot be neutral), with our excusing of children and the deluded and the intoxicated, with the phenomenology of deliberation, with the thought that responsibility has a point within our practice of holding one another to account, and with the idea that freedom might come in degrees.

  Then do the part I most want: tell me which requirements are genuine desiderata and which are merely the prejudices of one camp, and flag any pair that cannot be jointly satisfied — if some subset of the list is jointly unsatisfiable, that is itself the most interesting result on the page, and I want it stated plainly. Tell me which single requirement does the most work in ruling candidate theories out. And I would like one further requirement treated as first-class rather than an afterthought: that the theory be able to say whether the freedom worth wanting can be attributed to collective agents such as a corporation or a committee, and to artificial decision-makers. Accounts that work beautifully for a solitary human being tend to fall silent here, and I want to know whether that silence marks a defect in the theory or the proper boundary of the subject matter. Finish with a sentence or two on where compatibilism and incompatibilism each look weakest against your list; I will run the full scorecard myself in the seminar.
reasoning: |-
  Okay, the user is setting up a graduate reading group on free will and moral responsibility. They want to establish clear standards before diving into the compatibilism vs. incompatibilism debate. The main goal is to avoid confirmation bias where everyone just defends their pre-existing views. 

  First, I need to understand exactly what they're asking for. They want a list of desiderata for a theory of free will, with each requirement tied to specific cases, distinctions, or background commitments. The cases mentioned include scenarios like coercion, addiction, Frankfurt cases, manipulated agents, omissions, etc. Distinctions include freedom of action vs. will, sourcehood vs. alternate possibilities, and layers of responsibility concepts. Background commitments include compatibility with determinism's truth or falsity, excuses for impaired agents, deliberation phenomenology, and gradations of freedom.

  The user emphasizes avoiding survey-style responses - no citations or positions, just the requirements themselves. Then comes the crucial part: analyzing which requirements are genuine vs. partisan, identifying incompatible desiderata, spotting the most exclusionary requirement, and addressing collective/artificial agents. Finally, brief weaknesses of compatibilism/incompatibilism against the list.

  Hmm, the challenge is structuring this systematically. Probably best to group desiderata by their foundations: Agency Preservation (what free will must enable), Discrimination Power (cases it must distinguish), Conceptual Hygiene (distinctions to maintain), and Systemic Coherence (background commitments). 

  For Agency Preservation, core requirements would be Moral Attribution (blame/praise need targets), Agency Ownership ("I did that" feeling), and Deliberative Weight (taking choices seriously). These seem non-negotiable - without them, free will wouldn't connect to responsibility practices. The addict cases test ownership particularly well.

  Discrimination Power needs careful handling. The coerced vs. collaborator case is obvious, but manipulated agents (e.g., sculpted values) are trickier - some theories might call this free, others not. Frankfurt cases directly challenge "could have done otherwise" as necessary. Omissions are vital too - failing to save a drowning person isn't just "not acting," it's a morally significant non-action. 

  Conceptual Hygiene is where theories often blur lines. Freedom of action (physical ability) vs. will (internal control) is classic - kleptomaniacs have the former but not latter. Compulsion vs. coercion vs. mere causation needs clear separation too. And crucially, responsibility shouldn't imply blameworthiness - excuses matter (drunk person isn't blameworthy even if responsible in some sense).

  Systemic Coherence has subtle tensions. Determinism-neutrality is tough - incompatibilists insist determinism kills free will, compatibilists deny this. But the theory must allow determinism's truth to be an open question. Graded freedom is another minefield - is freedom binary (free/unfree) or a spectrum? Moral practice suggests spectrum (children, partial insanity).

  Now for the analysis. Genuine desiderata: Moral Attribution, Agency Ownership, Deliberative Weight, Frankfurt Survival, Omissions Account, and Excuse Accommodation. These seem bedrock for any functional theory. More partisan: Determinism-Neutrality (incompatibilists reject it), Sourcehood Primacy (compatibilists may downplay it), and Manipulation Immunity (varies by theory).

  Fatal conflict: Determinism-Neutrality vs. Sourcehood Primacy. If determinism is true, Sourcehood Primacy (requiring ultimate origin) becomes impossible - hence incompatibilists sacrifice Neutrality, compatibilists sacrifice Sourcehood. This is the core divide.

  The heaviest requirement? Sourcehood Primacy - it sinks all compatibilist theories if strictly applied. Frankfurt Survival also rules out simple incompatibilist "could have done otherwise" models.

  For collective/artificial agents: This tests the theory's structure. If it relies on human-specific features (emotions, embodiment), it fails. A good theory should extend or explicitly limit itself. Incompatibilism struggles more here - ultimate responsibility is even harder for committees. Compatibilism might handle corporations if they have decision-procedures.

  Finally, quick weaknesses: Compatibilism looks shallow on Sourcehood (can manipulated agents be free?). Incompatibilism seems detached from practice (why care about metaphysical freedom if it's impossible?). 

  The user's deep need is likely avoiding dead-end debates. By mapping desiderata tensions upfront, the group can pinpoint why disagreements persist. Also, they want the framework to feel "live" - hence emphasis on cases and real-world applicability (corporations, AI). The collective agent point suggests they suspect free will theories are anthropocentric. Smart framing.
answer: |-
  Here is a specification of desiderata for an adequate theory of free will, structured by their motivation, followed by analysis of their status, tensions, and implications:

  ### I. Core Desiderata & Motivations
  1.  **Moral Attribution Foundation:** The theory must ground *why* agents are appropriate targets of moral praise/blame, reward/punishment, and reactive attitudes (resentment, gratitude). *(Motivation: Without this, "responsibility" is disconnected from its core role in human social and moral practices.)*
  2.  **Agency Ownership ("It Was Me"):** The theory must explain the sense that the action genuinely *emanated from* the agent, not merely happened *to* or *through* them. *(Motivation: Cases like the *enthusiastic collaborator* vs. the *gunpoint signer*; the *endorsing addict* vs. the *struggling addict*; the kleptomaniac. The agent must be the proper "author" of the action.)*
  3.  **Deliberative Weight:** The theory must account for the phenomenology of deliberation – the sense that choices are *up to us* and matter. *(Motivation: Our lived experience of deciding presupposes some form of agential control; a theory denying this feels alienating.)*
  4.  **Frankfurt Survival:** The theory must accommodate cases where an agent acts exactly as they want/will, even if they *could not have done otherwise* due to counterfactual intervention (Frankfurt cases). *(Motivation: Shows the intuitive sufficiency of actual sequence control for responsibility, challenging the necessity of alternative possibilities.)*
  5.  **Omissions Account:** The theory must handle morally significant omissions (failures to act) with the same conceptual resources as actions, explaining when *not acting* is free/responsible. *(Motivation: The *bystander letting someone drown*; failing to rescue when one could easily do so.)*
  6.  **Value Manipulation Problem:** The theory must either explain why the *sculpted-but-endorsing agent* is free/responsible *or* explain why they are not, despite their endorsement. *(Motivation: Tests the depth of "ownership" – can manipulated values still ground authentic agency?)*
  7.  **False Belief Accommodation:** The theory must explain how freedom/responsibility interacts with actions based on significant false beliefs (non-culpably or culpably formed). *(Motivation: Acting on misinformation is common; does it mitigate responsibility, and why?)*
  8.  **Committee/Model Challenge:** The theory must either explain how freedom/responsibility can/cannot apply to *collective agents (corporations, committees)* or *artificial decision-makers*, or provide principled reasons why it cannot. *(Motivation: Tests the generality and structure of the theory beyond the individual human case.)*
  9.  **Excuse Accommodation:** The theory must seamlessly integrate standard excusing conditions: childhood, significant cognitive/psychiatric impairment, severe intoxication, coercion, compulsion. *(Motivation: Our practices readily excuse these; a theory must explain why they undermine responsibility without ad hoc patches.)*
  10. **Graded Freedom:** The theory should allow that freedom and responsibility can come in *degrees*. *(Motivation: Intuitions about development (children), partial impairments, situational pressures, and potentially collective agents suggest a spectrum.)*

  ### II. Essential Conceptual Distinctions
  The theory **must not collapse** these distinctions, and must explain their relationship:
  11. **Action vs. Will Freedom:** Distinguish freedom *to do what one wills* (no external obstacles) from freedom *in the formation/endorsement of the will itself* (no internal obstacles/compulsions). *(Motivation: The kleptomaniac may have freedom of action but lack freedom of will; the coerced person may have freedom of will but lack freedom of action.)*
  12. **Sourcehood vs. Alternatives:** Distinguish *being the ultimate source/origin* of one's action from *having the ability to do otherwise* in that specific situation. *(Motivation: Frankfurt cases suggest alternatives aren't necessary; sourcehood remains crucial.)*
  13. **Responsibility vs. Blameworthiness:** Distinguish being an *appropriate target* of responsibility assessments (including praise) from *deserving blame/punishment* specifically. *(Motivation: An agent might be responsible for a good action done for bad reasons, or excused from blame despite being responsible for the act.)*
  14. **Compulsion/Coercion/Constraint vs. Determination:** Clearly differentiate *specific, identifiable threats or irresistible internal forces* (compulsion, coercion, physical constraint) that undermine freedom, from the *general, non-threatening causal determination* of events. *(Motivation: Conflating coercion with mere determinism is a common but fatal error in the debate; compulsion feels different from normal causation.)*

  ### III. Background Commitments
  The theory must be:
  15. **Determinism-Neutral (or Explain Failure):** Consistent with the *possibility* of both determinism and indeterminism being true (without presupposing either), OR provide a compelling argument why free will is only compatible with one. *(Motivation: The debate itself requires the concept to be evaluable independently of settling the truth of determinism.)*
  16. **Practice-Embedded:** Cohere with the *point* of holding responsible within human social/legal/moral practices (e.g., fostering accountability, shaping behavior, recognizing standing). *(Motivation: Prevents the theory from becoming purely metaphysical, detached from its function.)*

  ## Analysis: Desiderata Status, Tensions & Power

  1.  **Genuine Desiderata (Minimal Core):** 1 (Moral Attribution), 2 (Agency Ownership), 3 (Deliberative Weight), 4 (Frankfurt Survival), 5 (Omissions), 6 (Value Manipulation - must *address* it), 9 (Excuse Accommodation), 11 (Action/Will Distinction), 12 (Sourcehood/Alternatives Distinction), 13 (Responsibility/Blame Distinction), 14 (Constraint vs. Determination), 16 (Practice-Embedded). These are required for *any* theory aiming to capture the core phenomena and distinctions relevant to our practices and intuitions.
  2.  **Potentially Partisan/Contentious:**
      *   **7 (False Belief):** Weight/impact might be theory-dependent.
      *   **10 (Graded Freedom):** Some theories insist on binary freedom (free/unfree).
      *   **15 (Determinism-Neutrality):** Incompatibilists (especially libertarians) *must* reject this; it's a core compatibilist commitment. Insisting on neutrality is thus partisan *against* incompatibilism.
      *   **Emphasis on Sourcehood (within 12):** Strong "ultimate source" requirements often reflect incompatibilist intuitions, potentially alien to some compatibilist accounts focused on current reasons-responsiveness.
  3.  **The Central Tension (Likely Unsatisfiable Pair):**
      *   **2 (Agency Ownership/Sourcehood) + 15 (Determinism-Neutrality) vs. Strong Incompatibilist Intuitions:** A robust requirement for the agent to be the *ultimate, buck-stopping source/origin* of their action (a strong reading of Desideratum 2) is **fundamentally incompatible with Desideratum 15 (Determinism-Neutrality)** if determinism is true. Determinism implies the causal chain extends beyond the agent's control, undermining ultimacy. Therefore:
          *   Theories demanding **Ultimate Sourcehood** (a strong reading of 2) *must* reject Determinism-Neutrality (15) and require indeterminism (they are *incompatibilist*).
          *   Theories maintaining Determinism-Neutrality (15) *must* weaken the Sourcehood requirement (2) to something compatible with determinism (e.g., "adequate" or "guidance" control within the determined sequence). They are *compatibilist*.
  4.  **Most Exclusionary Requirement:** **2 (Agency Ownership/Sourcehood), especially under a strong "Ultimate Source" interpretation.** This requirement, demanding the agent be the *uncaused cause* or *ultimate originator* of their action, rules out *all compatibilist theories* and even many *libertarian* theories (if they cannot coherently locate indeterminism). It's the primary driver towards incompatibilism.
  5.  **Collective/Artificial Agents (Desideratum 8):** This requirement **tests the structural adequacy of the theory.** A theory relying heavily on uniquely human capacities (e.g., specific phenomenology, biological drives, irreducibly conscious will) will struggle, suggesting a potential defect by failing to capture the *functional core* of agency. A theory focusing on structures like reasons-responsiveness, evaluative judgment, or decision-making procedures has a better chance, making its applicability (or principled denial) a mark of its coherence and depth. Silence here often indicates anthropocentric bias or underdeveloped structural foundations.

  ### Where Compatibilism & Incompatibilism Look Weakest
  *   **Compatibilism:** Looks weakest against **Desideratum 2 (Agency Ownership/Sourcehood)** under its strongest interpretation ("ultimate source") and **Desideratum 6 (Value Manipulation)**. Can an agent manipulated to endorse their values *truly* be the deep source, or is compatibilist ownership too shallow? Does it merely describe psychological integration, neglecting historical origin?
  *   **Incompatibilism (especially Libertarianism):** Looks weakest against **Desideratum 4 (Frankfurt Survival)** (if alternatives are deemed necessary) and **Desideratum 15 (Determinism-Neutrality)** (as it rejects neutrality). It often struggles with **Desideratum 10 (Graded Freedom)** (tending towards binary views) and **Desideratum 16 (Practice-Embeddedness)** – if libertarian freedom is rare or impossible, how does it connect to our actual responsibility practices? It also faces significant challenges in providing a **coherent metaphysics** for non-arbitrary indeterministic agency that satisfies Desideratum 2 without randomness.

  This specification provides the necessary groundwork to rigorously evaluate competing theories. The tension between Sourcehood and Determinism-Neutrality is the fault line; how a theory navigates this defines its compatibilist or incompatibilist character and reveals its deepest challenges.
