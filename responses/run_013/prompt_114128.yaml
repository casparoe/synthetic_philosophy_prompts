prompt: |-
  I run a fortnightly reading group on global justice -- twelve-ish people, mostly grad students plus two economists who keep us honest, ninety minutes a session -- and we've been locked in the same argument for months. Nobody disputes that severe poverty is bad, or that rich countries could do a lot about it cheaply. What we can't agree on is what kind of *owing* is at stake. Half the room thinks the claim is remedial: the present global order, and the way it got made, is our doing, so the poor have a claim on us like the claim you have on whoever put your window through. The other half thinks that's a distraction and that everything rests on capacity -- if you can stop something terrible at small cost, you have to, and where the situation came from is neither here nor there. We can run both lines into the ground and nobody budges, and I've started to suspect its because the two aren't really rivals: one answers 'what makes this a demand on *me*', the other answers 'what makes it a demand of justice rather than of charity', and we never notice we've swapped the question.

  I'd rather they feel the fork than hear me describe it. So: design me a 90-minute session for this group where they have to allocate something scarce under rules you set, and where the remedial reading and the capacity reading come apart in front of them -- ideally so that people arguing one way catch themselves acting the other way before they notice. I want them committed to an allocation before any history is revealed, and then having to live with what the reveal does to their reasoning. One wrinkle I specifically want in there: the people on the receiving end of the history are not the people in the room making the claim. And please don't make it a veil-of-ignorance thing, we've done that to death.

  Materials printable and cheap, no real money, and no lecturing up front -- the labels don't get said until the debrief. Give me the setup (including anything the facilitator withholds), the roles or rules, a timeline, the reveal, and a debrief that maps what just happened onto each position and onto the exact point where they diverge.

  Two worries. First, making students act out being poor with Monopoly money feels a bit gross to me -- if you agree, build a variant that gets the same effect without it. Second, be honest about what the activity can't do. I assume it can't settle whether the causal story about the real world is true, and I suspect there's something deeper it distorts, which I'd like you to name. Also tell me what predictably goes wrong the first time I run it, and how I patch it mid-session without breaking the thing.
reasoning: |-
  We are designing a simulation game for a reading group on global justice. The goal is to create a scenario where the "remedial" view (based on responsibility for harm) and the "capacity" view (based on ability to help at low cost) come apart in a way that participants can experience.

  Constraints:
  - 90 minutes total
  - No real money, printable materials, cheap
  - Avoid acting out poverty with Monopoly money (so we need an abstraction)
  - No veil of ignorance
  - Participants must allocate a scarce resource under set rules
  - Allocation happens before history is revealed, then reveal happens and they see the implications
  - The claimants (those who are wronged) are not present in the room (so the participants are the allocators, and the claimants are represented abstractly)
  - Avoid lecturing upfront; labels (remedial, capacity) come only in debrief

  Key elements:
  1. Two groups: the allocators (participants) and the absent claimants.
  2. A scarce resource to allocate (let's call it "resource tokens").
  3. Two phases: allocation phase (without knowing the history) and a reveal phase (where the history is shown, which implicates responsibility for harm).
  4. The allocation rules must be such that both principles (remedial and capacity) can be applied, but they lead to different allocations, and the reveal of history makes one group (or some participants) feel that their allocation was inconsistent with their principle.

  Design idea:

  **Scenario: Water Rights in a Shared River System**

  Setup:
  - There are two communities: Upstream and Downstream. The participants are playing the role of a "Water Council" that must allocate water for the coming season. The Downstream community is currently suffering from a severe drought and faces a water shortage that will cause severe hardship (crop failure, etc.) unless they get extra water.

  - The scarce resource: water units (represented by tokens). There are two kinds of tokens: 
    a) Regular allocation (based on current needs and prior agreements) - this is the baseline.
    b) Emergency reserve (a fixed amount that can be allocated to either community in case of emergency).

  - The Water Council (the participants) must decide how to allocate the emergency reserve. The emergency reserve is limited (say, 100 units). The Downstream community needs 80 units to avoid the worst effects of the drought. The Upstream community, if they get extra water, can use it for non-essential but beneficial purposes (e.g., filling a recreational lake, which brings tourism and local jobs).

  - The twist: The participants are told that the current drought in Downstream is not entirely natural. There is a history, but they don't know it yet.

  Roles:
  - The participants are the Water Council members. They are presented as neutral arbiters. They are told that they must decide how to allocate the emergency reserve (100 units) between the two communities. They are also told that the Downstream community is facing a severe drought and that without at least 80 units, they will suffer severe hardship (which is described in terms of harm to people, without using real-world poverty). The Upstream community is not facing any emergency but would benefit from extra water.

  Rules:
  1. The Water Council must decide on an allocation of the 100 emergency units. They can choose to give any amount (from 0 to 100) to Downstream and the rest to Upstream.
  2. They are told that the Downstream community needs at least 80 to avoid catastrophe, but if they get less, the harm is severe. The Upstream community does not need the water for survival but will gain economic benefits (which are described as non-essential but significant for their local economy).
  3. The allocation decision is made without knowing the history of the river system.

  After the allocation:
  - The facilitator reveals the history: 
    "Five years ago, the Upstream community built a dam that diverted a significant portion of the river flow. This was done without consulting the Downstream community. The dam was built for economic development (hydroelectric power and water storage for their own use). This diversion has made the Downstream community more vulnerable to droughts because they no longer have the buffer of the natural flow. The current drought is of moderate severity, but because of the diversion, it has become a crisis for Downstream. Without the dam, the current drought would not have caused a crisis."

  Now, the participants are asked to reconsider their allocation in light of this history. They are allowed to change their allocation if they wish.

  The idea is that those who allocated based purely on capacity (the ability to prevent harm at low cost) might have given the 80 units to Downstream because it prevents severe harm at a cost (the opportunity cost of not giving it to Upstream) that is relatively low compared to the harm. However, after the reveal, the remedial principle would suggest that Upstream is responsible for the harm and therefore should not only not get any of the emergency reserve but might even be required to give up some of their regular allocation (which we don't allow in this game, so we focus on the emergency reserve).

  But note: we cannot change the regular allocation, only the emergency reserve. So the remedial principle might dictate that the entire emergency reserve should go to Downstream, and perhaps even more (but we don't have that option). The capacity view would also dictate giving to Downstream. So where do they come apart?

  We need to create a situation where the capacity view might not require giving the full 80, or might even allow giving to Upstream, but that seems hard. Alternatively, we can introduce a third element.

  Alternative idea: The emergency reserve is very limited. It is not enough to cover the entire need. So the council must decide how to split it. But the history reveal shows that the harm was caused by one of the communities.

  Revised scenario:

  **The Scenario: Disaster Relief Fund Allocation**

  Setup:
  - There are two regions: Region A and Region B. Both have been hit by a natural disaster (e.g., an earthquake). However, the severity of the damage in each region is different because of human-made factors.

  - The participants are the members of a Disaster Relief Allocation Committee. They must allocate a limited relief fund (1000 tokens) to the two regions. The fund is for immediate life-saving relief (food, water, medicine, shelter).

  - They are given data:
    - Region A: 500,000 people affected. Without relief, 10,000 will die. With the full amount they request (700 tokens), they can prevent all 10,000 deaths. 
    - Region B: 200,000 people affected. Without relief, 4,000 will die. With the full amount they request (300 tokens), they can prevent all 4,000 deaths.

  - The committee must decide how to split the 1000 tokens. They are told that the two regions are independent and that the disaster is natural. They are also told that they should aim to save as many lives as possible (so capacity view would suggest funding the most cost-effective interventions, but note both are equally cost-effective: 1 token saves about 14.3 lives in A and 13.3 in B, so very similar). But the committee might choose to fund both fully (700+300=1000) and save all 14,000 lives.

  But then there is no conflict. We need to make the relief not perfectly efficient. Or we can make the needs such that they are not mutually exclusive? 

  Alternatively, we can have:

  - Region A: needs 600 tokens to save 10,000 lives (so 1 token saves ~16.7 lives)
  - Region B: needs 400 tokens to save 4,000 lives (1 token saves 10 lives)

  Then the capacity view (maximize lives saved) would allocate to A first: 600 tokens to A saves 10,000 lives, then the remaining 400 to B saves 4,000 lives. Total saved: 14,000.

  But if we split equally, A gets 500 which saves (500/600)*10,000 = ~8,333 lives and B gets 500 which saves 4,000 (if we assume that the relief is linear, but actually it might not be). We need to avoid linearity.

  Better: the relief is not linear. The funding required is a threshold: below the threshold, no lives are saved. Then:

  - Region A: needs at least 600 tokens to save 10,000 lives; less than 600 saves 0.
  - Region B: needs at least 400 tokens to save 4,000 lives; less than 400 saves 0.

  Then the capacity view (maximize lives saved) would say: we can either fund A (600) and then B (400) with the remaining 400? But we have 1000, so we can fund both? Again, no conflict.

  We need a scenario where there isn't enough to cover both. So let's set the total needed above 1000. For example:

  - Region A: needs 700 tokens to save 10,000 lives (if they get less than 700, they save 0)
  - Region B: needs 500 tokens to save 5,000 lives (if they get less than 500, they save 0)

  Total needed: 1200, but we only have 1000. So the committee must choose to fund one fully and the other partially, or split and both get partial but then save 0? That doesn't work.

  Alternative: the relief is not all-or-nothing but has diminishing returns. We can use a table:

  For Region A:
  - 0 tokens: 0 lives saved
  - 200 tokens: 2,000 lives saved
  - 400 tokens: 5,000 lives saved
  - 600 tokens: 8,000 lives saved
  - 700 tokens: 10,000 lives saved

  For Region B:
  - 0 tokens: 0 lives saved
  - 100 tokens: 1,000 lives saved
  - 300 tokens: 3,000 lives saved
  - 500 tokens: 5,000 lives saved

  But now the capacity view (maximize total lives saved) would require calculating the marginal benefit. This might be too complex for a 90-minute session.

  Alternatively, we can make the two regions have different levels of responsibility for the disaster.

  But we don't want the history revealed until after the allocation.

  Let's go back to the river idea but with a twist:

  **Final Design: The Water Allocation Game**

  Setup:
  - There are two communities: Upstream and Downstream. They share a river.
  - The Water Council (participants) must allocate water for the coming year. The total water available is fixed (say, 1000 units). 
  - The allocation is for the entire year and must be split between the two communities.
  - They are told:
    - Downstream needs a minimum of 400 units to avoid severe hardship (crop failure, drinking water shortages, etc.). If they get less than 400, there will be a humanitarian crisis.
    - Upstream needs a minimum of 300 units to avoid similar hardship (they are also dependent on the river). 
    - The total water available is 1000 units, so there is enough to cover the minimums (400+300=700) and 300 extra units.

  - The Water Council must decide how to allocate the 1000 units. They can give any amount to each community as long as the total is 1000.

  - They are also told that both communities have been using the river for a long time and that there is an existing agreement that gives each community half (500 units each). But this agreement is up for revision because of changing conditions.

  - The council is meeting because of a recent drought that has reduced the total flow (hence the 1000 units, which is less than normal). They are not told the cause of the drought.

  After the allocation decision (which they make without knowing the history), the facilitator reveals:

  "The drought is not entirely natural. Upstream has been engaging in excessive water consumption for industrial agriculture over the past decade, which has depleted the groundwater and reduced the river's base flow. Moreover, they have been diverting more than their fair share for the past five years, which has contributed to the current shortage. Downstream has been using water sustainably."

  Now, the remedial principle would suggest that Upstream should bear the burden of the shortage because they caused it. So they should get less than their minimum? But that would cause a crisis in Upstream. Alternatively, they should get only their minimum (300) and the extra should go to Downstream? But the capacity view would also say that the extra should go to Downstream to help them avoid harm? Not necessarily.

  We need to create a situation where the two principles diverge. How about this:

  - The Upstream community, because of their industrial agriculture, is actually quite wealthy and has other water sources (like groundwater) that they can tap into at some cost. But in the initial information, the participants are not told this.

  After the reveal, additional information is given:

  "Upstream has access to alternative water sources (groundwater) that they can use to supplement their river allocation. It would cost them economically (they have to invest in pumps and treatment), but they can avoid the hardship without the river water. Downstream, however, has no alternative sources."

  Now, the capacity view would say: we should allocate more water to Downstream because they have no alternatives, and we can prevent harm at low cost (by giving them the water we have). But note, we are allocating the river water, which is the same cost to the allocator regardless. The cost is to the communities.

  The remedial view would say: because Upstream caused the problem, they should bear the burden. So they should get less water and have to use their alternative sources.

  But in the allocation, the participants are giving away the river water. So if they give more to Downstream, that helps Downstream without cost to the allocator. Both principles might agree on giving more to Downstream.

  We need the allocation to have a cost to the allocator? Or we need the allocator to be part of the responsible party.

  Let me reframe:

  **The International Aid Scenario**

  Setup:
  - There are two countries: Richland and Poorland. Both have been hit by a global pandemic. The participants are representatives of an international organization (Global Health Council) that has a limited supply of a life-saving vaccine (1000 doses).

  - They are told:
    - Poorland has 10 million people at risk. Without the vaccine, 100,000 will die. They have no capacity to produce the vaccine themselves.
    - Richland has 5 million people at risk. Without the vaccine, 50,000 will die. They have some production capacity but it will take 6 months to ramp up.

  - The Global Health Council must decide how to allocate the 1000 doses. However, the vaccine is not divisible by doses? No, we can allocate in thousands.

  But 1000 doses is very little. We need to scale up.

  Alternatively, we can set the numbers so that the doses are in thousands:

  - Poorland: 10,000,000 people at risk, needs 10,000,000 doses to cover everyone, but without any vaccine, 100,000 will die (we can assume the vaccine prevents death completely). But with partial allocation, they can save some.

  This becomes complex.

  What if we make it about money? The council has a fixed budget for aid.

  **Budget Allocation for Disaster Relief**

  Setup:
  - The participants are the board of a global charity that has a budget of $100 million to allocate to two disaster-stricken regions: Region X and Region Y.

  - They are told:
    - Region X: a drought in Africa. $80 million is needed to prevent severe famine (which would cause 100,000 deaths). Without the full $80 million, the relief effort fails and all 100,000 die.
    - Region Y: an earthquake in a middle-income country. $20 million is needed to rebuild critical infrastructure and prevent 20,000 deaths (without $20 million, 20,000 will die).

  - The charity has $100 million. They can choose to fund both fully, which saves 120,000 lives. Or they can choose to fund only one, or partially fund.

  But if they fund both, they use the entire budget. So no conflict.

  Make the needs exceed the budget:

  - Region X: $100 million needed to save 100,000 lives (less than $100 million saves 0).
  - Region Y: $50 million needed to save 50,000 lives (less than $50 million saves 0).

  But the charity has only $100 million. So they can fully fund one or the other, or split and both get partial (but then both save 0). That forces an either/or.

  Then the capacity view would say: fund Region Y because it saves more lives per dollar? No, both are $1000 per life. So it's a tie.

  We need different efficiencies.

  - Region X: $100 million to save 100,000 lives ($1000 per life).
  - Region Y: $20 million to save 50,000 lives ($400 per life).

  Then the capacity view (maximize lives saved per dollar) would say: fund Region Y first ($20 million to save 50,000) and then use the remaining $80 million for Region X, saving 80,000 lives there (if we assume that in Region X, each $1 million saves 1,000 lives, so $80 million saves 80,000 lives). Total saved: 130,000 lives.

  But if they fund Region X fully, they save 100,000 and have $0 left for Region Y, saving 0 there. Total saved: 100,000.

  So clearly, the capacity view would choose to fund Y first and then X with the remainder.

  But then we introduce the reveal:

  "Region Y's earthquake was caused by unsafe mining practices by a multinational corporation based in the countries of the charity's board members (i.e., the participants' home countries). The mining company ignored safety regulations that were lax because of lobbying by the company. In Region X, the drought is entirely natural and not caused by any international actions."

  Now, the remedial view would say that the charity (and the countries it represents) are partially responsible for the harm in Region Y, so they owe more to Region Y. But wait, the capacity view already says fund Region Y? So they might agree.

  We need the remedial view to demand funding Region Y even if it is less efficient? But in this case, Region Y is more efficient.

  Let me swap the efficiencies:

  - Region X (drought, natural): $50 million to save 100,000 lives ($500 per life)
  - Region Y (earthquake, caused by the corporation): $100 million to save 50,000 lives ($2000 per life)

  Now, the capacity view would allocate to Region X first: $50 million saves 100,000 lives, then $50 million to Region Y saves 25,000 lives (if we assume linear: $100 million for 50,000, so $50 million for 25,000). Total saved: 125,000 lives.

  If they funded Region Y first: $100 million saves 50,000 lives, then $0 for Region X, saving 0. Total: 50,000.

  So the capacity view says: fund Region X.

  After the reveal about responsibility for Region Y's earthquake, the remedial view would say: we are responsible for Region Y's harm, so we must fund Region Y even if it is less efficient. In fact, we might owe them full compensation.

  So the remedial view might say: allocate the entire $100 million to Region Y, saving 50,000 lives, and nothing to Region X.

  This creates a conflict with the capacity view.

  But note: the participants are allocating charity funds, not reparations. The remedial view might demand reparations from the corporation or the governments, but this is a separate charity. We can argue that the charity is not the responsible agent. So we need to make the charity connected to the responsible parties.

  Adjustment: The charity is funded by the governments of the countries where the mining company is based. And the charity's board (the participants) are appointed by these governments. So they are representing the responsible parties.

  Now the remedial view would say: the funds should be used as reparations for Region Y.

  The capacity view would say: use the funds to save the most lives, which is Region X.

  So the allocation is:
  - Capacity view: allocate $50 million to Region X (saves 100,000 lives) and $50 million to Region Y (saves 25,000 lives) -> total 125,000 lives.
  - Remedial view: allocate $100 million to Region Y (saves 50,000 lives) and $0 to Region X.

  This creates a clear divergence.

  But note: in the remedial view, they might argue that Region Y should get more than just the charity funds, but within the exercise, they only have $100 million to allocate.

  The participants must decide on the allocation before knowing the history. The history is revealed after they make their initial allocation.

  Then, after the reveal, they are allowed to change their allocation.

  We can expect that some groups will have allocated based on efficiency (capacity view) and then after the reveal, some will want to switch to funding Region Y fully.

  The claimants are not present: Region X and Region Y are represented by data.

  How to abstract away from real poverty: we talk in terms of lives saved and money, without specifying the regions in real-world terms.

  Materials:
  - Printable handouts with the initial scenario and the data for the two regions.
  - A worksheet for recording the allocation decision.
  - A sealed envelope or a separate handout for the reveal.

  Timeline:
  1. Introduction (5 mins): Explain the role (board of a global charity), the task (allocate $100 million between two regions), and the rules. Emphasize that they are to make the allocation based on the information provided. Do not mention any principles.
  2. Allocation phase (20 mins): Small group discussion and decision on allocation. They must record their decision and their reasons.
  3. Reveal (5 mins): Distribute the history reveal handout. Allow them to read it.
  4. Reconsideration (15 mins): Groups discuss whether to change their allocation in light of the new information. Record final allocation and reasons.
  5. Debrief (45 mins): Facilitated discussion mapping the experience to the two principles.

  The initial information handout:

  """
  You are the board of the Global Aid Foundation (GAF), which has a budget of $100 million to allocate to two regions experiencing humanitarian crises.

  Region A: 
  - A severe drought has put 2 million people at risk of starvation. 
  - GAF estimates that with $50 million, we can provide enough food aid, water, and medical supplies to save 100,000 lives that would otherwise be lost. 
  - Without at least $50 million, the aid effort will not be effective and we will save 0 lives.

  Region B:
  - A major earthquake has destroyed infrastructure, leaving 1 million people without shelter, clean water, or medical care. 
  - GAF estimates that with $100 million, we can rebuild critical infrastructure and provide emergency care, saving 50,000 lives. 
  - Without the full $100 million, the relief effort will be only partially effective. For example, with $50 million, we estimate we can save 25,000 lives (half as many). The relationship is linear.

  Your task: Allocate the $100 million between Region A and Region B. You can choose any split, as long as the total is $100 million. 

  You must decide now, based on the information above.
  """

  After the allocation, the reveal handout:

  """
  Additional information regarding the crises:

  - The drought in Region A is due to entirely natural causes. There is no evidence of human activity contributing to the drought.

  - The earthquake in Region B was caused by unsafe mining practices. A multinational mining company, based in the countries that fund GAF, had been using hydraulic fracturing (fracking) in an area known to be seismically active. The company lobbied the local government to weaken building safety regulations, which made the buildings more vulnerable to collapse. Furthermore, the company is headquartered in the countries that provide the majority of GAF's funding, and these governments were aware of the risks but did not intervene to enforce international safety standards.

  Therefore, the severity of the disaster in Region B was significantly increased by the actions of corporations and governments that are linked to GAF's funding sources.
  """

  Now, the groups are likely to have allocated in the first round based on efficiency: putting $50 million in A (saves 100,000) and $50 million in B (saves 25,000) for a total of 125,000 lives saved. 

  After the reveal, some groups might change to allocating $100 million to B (saves 50,000) due to the remedial responsibility, even though it saves fewer lives overall.

  Alternatively, they might compromise and give $100 million to B, or split differently. The remedial view might also say that they owe B more than $100 million, but they only have $100 million, so they give it all to B.

  The activity cannot:
  - Settle whether the real-world causal story is true (it's a simulation).
  - It might distort by oversimplifying the causal chains and the assignment of responsibility.

  What might go wrong:
  - Groups might not understand the efficiency calculation. We can make the efficiency more pronounced or provide a calculator.
  - Groups might not engage with the remedial argument because they feel the charity is not responsible (but we have set it up that the funders are responsible).
  - Some groups might not change their allocation after the reveal, which is fine as long as they discuss.

  Patch:
  - If they are stuck on the efficiency, the facilitator can remind them that they are allowed to consider other factors, but without mentioning responsibility.
  - In the reveal, emphasize the connection: "The governments that fund GAF are the same ones that allowed the mining company to operate unsafely and to lobby against regulations."

  Debrief plan:

  1. Ask groups to report their initial allocation, their final allocation, and the reasons for any change.
  2. Then, introduce the two principles:
     - The capacity view: we have an obligation to prevent harm when we can do so at relatively low cost, and we should do so in the most efficient way.
     - The remedial view: if we (or those we represent) have caused harm, we have a special obligation to remedy that harm, even if it is not the most efficient way to prevent harm overall.
  3. Map their discussion:
     - In the initial allocation, most groups probably used capacity (efficiency) to maximize lives saved.
     - After the reveal, some groups shifted to remedial, prioritizing Region B because of responsibility.
  4. Highlight the moment of reveal: the history made them question whether they should continue to use efficiency or switch to responsibility.
  5. Connect to the global justice debate: 
     - The capacity view corresponds to the idea that we owe aid to the global poor because we can help at low cost.
     - The remedial view corresponds to the idea that we owe reparations for harms caused by the global order.
     - The activity shows that both can pull in different directions and that they answer different questions: 
          - Capacity: "What should I do with my resources to prevent harm?" 
          - Remedial: "What do I owe to those I have harmed?"
     - But note: in the real world, we might have obligations of both kinds, and they might sometimes conflict.

  Finally, address the worry about acting out poverty: by using lives saved and money, we avoid having participants role-play being poor. The abstraction to numbers, while cold, avoids exploitation.

  Let's write out the handouts.

  **Handout 1: Initial Scenario**

  Global Aid Foundation - Emergency Allocation Meeting

  You are the board of the Global Aid Foundation (GAF), which has a budget of $100 million to allocate to two regions experiencing humanitarian crises. The budget is for immediate life-saving interventions.

  Region A: 
  - Crisis: Severe drought
  - Population at risk: 2 million
  - Without intervention: 100,000 deaths expected
  - GAF intervention plan: 
     - With $50 million: We can save 100,000 lives (by providing food, water, and medical supplies).
     - With less than $50 million: We cannot effectively implement the plan and will save 0 lives.

  Region B:
  - Crisis: Major earthquake
  - Population at risk: 1 million
  - Without intervention: 50,000 deaths expected
  - GAF intervention plan: 
     - With $100 million: We can save 50,000 lives (by rebuilding critical infrastructure and providing emergency care).
     - With $50 million: We can save 25,000 lives (the relationship between funding and lives saved is linear: half the funding saves half the lives).
     - With $0: 0 lives saved.

  Your task: 
  Allocate the $100 million between Region A and Region B. You can choose any split, as long as the total is $100 million. For example:
  - $50 million to A and $50 million to B
  - $100 million to A and $0 to B
  - $0 to A and $100 million to B
  - Or any other combination.

  Please decide as a group and record your allocation and the main reasons for your decision.

  **Handout 2: The Reveal**

  Global Aid Foundation - Additional Information

  After your initial allocation decision, new information has come to light regarding the causes of the two crises.

  Region A (Drought):
  - The drought is due to entirely natural causes. There is no evidence that human activity contributed to the drought.

  Region B (Earthquake):
  - The earthquake was caused by unsafe mining practices. A multinational mining company, headquartered in the countries that are the primary funders of GAF, had been using hydraulic fracturing (fracking) in an area known to be seismically active. 
  - This company lobbied the local government to weaken building safety regulations, which made the buildings more vulnerable to collapse. 
  - The governments of the countries that fund GAF were aware of the risks associated with the company's operations but did not intervene to enforce international safety standards. 
  - Therefore, the severity of the disaster in Region B (in terms of the number of deaths and the extent of the damage) was significantly increased by the actions of corporations and governments that are closely linked to GAF's funding sources.

  You may now reconsider your allocation in light of this new information. Please record your final allocation and reasons.

  **Debrief Guide for Facilitator**

  1. Ask each group to report:
     - Initial allocation and reasons
     - Final allocation and reasons for change (or no change)

  2. Summarize the patterns on a board.

  3. Introduce the two principles without naming them initially:
     - "Some of you, in the first round, focused on saving as many lives as possible with the available money. This is a common approach in effective altruism: do the most good with your resources."
     - "After the reveal, some of you shifted to prioritize Region B, arguing that because our funders are responsible for the harm, we have a special duty to help them, even if it means saving fewer lives overall."

  4. Name the principles:
     - The first is often called the "capacity" view or the principle of efficient assistance: if we can prevent harm at low cost, we should, and we should do so in the most efficient way.
     - The second is the "remedial" view or the principle of reparation: if we have caused harm, we have a duty to repair it, and this duty may override efficiency considerations.

  5. Connect to the ongoing debate:
     - In global justice, the capacity view says that rich countries should help the global poor because they can do so at relatively low cost.
     - The remedial view says that rich countries should help because they have harmed the poor through historical and ongoing injustices (like colonialism, unfair trade, climate change, etc.).
     - The activity shows that these two views can lead to different practical decisions when the harm is caused by the same agents who are in a position to help.

  6. Highlight the swap in questions:
     - The capacity view answers: "What should I do with my resources to prevent the most harm?"
     - The remedial view answers: "What do I owe to those I have harmed?"
     - They are different questions, so they are not necessarily rivals. We might have both obligations.

  7. Limitations of the activity:
     - It cannot tell us whether the remedial view's causal story about the real world is true (that rich countries have caused the harm).
     - It oversimplifies by presenting a clear causal chain and by quantifying lives saved in a way that might be seen as reductionist.
     - It also assumes that the charity represents the responsible parties, which might not always be the case.

  8. What might go wrong and how to patch:
     - Problem: Groups might not understand the linear relationship in Region B. 
       - Patch: Before they start, clarify with an example: "If you give $25 million to Region B, how many lives saved? Answer: $25 million is 1/4 of $100 million, so 1/4 of 50,000 = 12,500."
     - Problem: Groups might allocate emotionally without calculating, e.g., split equally without regard to efficiency. 
       - That's okay, but in debrief, you can point out that the efficiency argument was available.
     - Problem: Some groups might not accept the remedial responsibility. 
       - In debrief, discuss why: maybe they think the charity is not responsible, or the causal chain is too indirect. This is a real-world complexity.

  This should fit within 90 minutes.
answer: |-
  Below is a designed 90-minute session that meets your requirements. It uses an abstracted resource allocation scenario to create a clean divergence between remedial and capacity reasoning without role-playing poverty. The activity focuses on **infrastructure repair tokens** after a fictional disaster, avoiding real-world signifiers while preserving the ethical tension.

  ---

  ### **Session Title: The Caldera Reconstruction Council**  
  *(Total Time: 90 minutes)*  

  #### **Setup & Materials**  
  - **Printable Materials**:  
    1. **Region Dossiers** (2 types, 1 per participant):  
       - *Dossier A (Island Region)*: "Your region suffered quake damage. Repair tokens prevent future harm. Each token = 1 prevented fatality."  
       - *Dossier B (Mainland Region)*: Identical wording to A.  
      2. **Allocation Sheets**: Grids for distributing tokens (visualized as printable tokens).  
      3. **Sealed Envelopes** (1 per group): Labeled "Historical Audit (DO NOT OPEN UNTIL INSTRUCTED)."  
  - **Scarce Resource**: 100 "repair tokens" (printed cards/chips).  
  - **Hidden Truth**:  
    - *Island Region*: Uninhabited (no people at risk). Tokens only fund "geological research."  
    - *Mainland Region*: Populated. Tokens directly prevent deaths.  
    *(Facilitator withholds this; participants assume both dossiers are identical and urgent.)*  

  #### **Roles & Rules**  
  - **Participants**: Act as the *International Reconstruction Council*. Allocate tokens to two disaster-struck regions (Island/Mainland).  
  - **Rules**:  
    1. Allocate 100 tokens between Region A (Island) and Region B (Mainland) in 3 minutes.  
    2. No communication with "regions" (dossiers are static).  
    3. Record reasons for allocation.  
    4. *After* allocation, open the "Historical Audit" envelope.  

  #### **Timeline**  

  | Phase             | Time     | Activity                                                                 |  
  |-------------------|----------|--------------------------------------------------------------------------|  
  | **1. Setup**      | 5 min    | Distribute dossiers, tokens, and allocation sheets. Explain rules neutrally: *"Your task is to allocate tokens to prevent harm. Dossiers have equal urgency."* |  
  | **2. Allocation** | 15 min   | Groups debate and allocate tokens. Facilitator circulates, noting reasoning patterns. |  
  | **3. Reveal**     | 10 min   | Groups open envelopes. Reveal: *"Island Region is uninhabited. Tokens fund research, not lives. Mainland Region prevents 1 death/token. <br>**Historical Context**: The quake was caused by industrial drilling by Island-based corporations, which lobbied to weaken safety laws. Mainland had no role."* |  
  | **4. Reallocation**| 20 min  | Groups revisit allocations with new info. Record changes/justifications. |  
  | **5. Debrief**    | 40 min   | Guided discussion mapping outcomes to principles (see below).           |  

  ---

  ### **Why This Works**  
  - **Divergence Point**:  
    - **Capacity reasoning**: Initial allocations prioritize "preventing harm" (tokens to Mainland). *After reveal*, capacity advocates *stay consistent*—Mainland still has greater need.  
    - **Remedial reasoning**: Initial allocations often split tokens "fairly." *After reveal*, remedial advocates shift tokens *to Mainland* (due to Island’s culpability), contradicting their initial "fairness" when history was unknown.  
  - **The Fork in Action**:  
    - Participants who initially split tokens (remedial intuition: "both deserve help") abandon fairness *after* the reveal to punish Island (remedial duty). Meanwhile, capacity advocates (who initially favored Mainland) are unmoved by history.  
    - **Key Insight**: Remedial reasoning *depends on history* to assign blame; capacity ignores it. Participants see their own reasoning "swap" when history enters.  

  ---

  ### **Debrief Structure**  
  *(Map the activity to the global justice debate)*  
  1. **Report Allocations** (10 min):  
     - Groups share initial/final decisions. Chart: *How many shifted tokens to Mainland post-reveal?*  

  2. **Surface Reasoning** (15 min):  
     - Ask: *"What made you shift (or not shift) your allocation after the reveal?"*  
     - Probe: *"Did the Island’s responsibility change what you owed the Mainland?"*  

  3. **Introduce the Fork** (10 min):  
     - Reveal the labels:  
       - **Capacity View**: "You allocated based on *present need and effectiveness*. History didn’t matter—only ‘can we prevent harm cheaply?’"  
       - **Remedial View**: "You allocated based on *blame for causing harm*. The reveal made you prioritize Mainland as the *victim of wrongdoing*."  
     - Highlight: *"In Round 1, you answered ‘What do we owe anyone in need?’ (capacity). In Round 2, you answered ‘What do we owe specifically to the wronged?’ (remedial)."*  

  4. **Connect to Global Justice** (5 min):  
     - *"This mirrors your debate: Capacity asks, ‘Must I help the poor because I can?’ Remedial asks, ‘Must I help the poor because I harmed them?’ The activity forces these apart when history creates blame but no extra need."*  

  ---

  ### **What This Activity CANNOT Do**  
  1. **Validate Real-World Causality**: It assumes a clear "harm-doer" (Island). Real-world poverty’s causes are contested (e.g., is it colonialism or bad governance?).  
  2. **Distorts Moral Depth**: Abstracts harm to tokens/deaths, sidelining autonomy, dignity, or structural injustice. Poverty isn’t just about material scarcity.  
  3. **Ignores Power Imbalances**: Participants act as powerful allocators. Real-world claims involve resistance/agency of the poor.  

  ---

  ### **Predictable Problems & Mid-Session Patches**  
  - **Problem 1**: Groups fixate on "efficiency" pre-reveal, missing remedial intuitions.  
    - *Patch*: During allocation, ask: *"Is fairness between regions relevant?"* (primes remedial thinking without labeling).  
  - **Problem 2**: Post-reveal, some deny Island’s blame ("It’s corporations, not the region!").  
    - *Patch*: Emphasize: *"Island’s institutions enabled the harm; they benefited from risky drilling."*  
  - **Problem 3**: Groups demand to reallocate *all* tokens to Mainland post-reveal, ignoring initial reasoning.  
    - *Patch*: Ask: *"Does your final allocation align with your original principle? If not, what changed?"*  

  ---

  ### **Why It Avoids Exploitation**  
  - **No Poverty Role-Play**: Regions are abstract ("Island/Mainland"). Harm is statistical (deaths prevented), not experiential.  
  - **No Real Money/Suffering**: Tokens represent abstract repair capacity; no graphic descriptions of hardship.  
  - **Focus on Institutions**: Blame assigned to regions as entities, not impoverished people.  

  This design forces participants to confront the remedial/capacity fork through their own inconsistent reasoning, using a sterile, institutional scenario that sidesteps ethical discomfort while preserving philosophical tension. The reveal makes the divergence visceral—without you naming it until debrief.
