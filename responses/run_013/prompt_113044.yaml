  Step 4: Trigger Suppression: the silence effect prevents triggered abilities from triggering. Therefore, the ability does not trigger.

  *Public Ruling*: "The silence effect prevents all triggered abilities from triggering this turn, including those gained after the silence effect began. Therefore, the triggered ability does not trigger."

     - *Scenario B (variant)*: A creature has the ability: "Whenever this creature attacks, if you control an artifact, draw a card." The silence effect is active. The player controls an artifact at the time of attacking but loses it before the ability would resolve.

