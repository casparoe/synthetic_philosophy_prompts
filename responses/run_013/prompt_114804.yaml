  You've constructed an elegant trap, but expected utility theory doesn't flinch. If you genuinely assign *any* non-zero probability to the Riemann hypothesis being true—say, 1% or even 0.0001% based on mathematical consensus—and the stranger credibly offers you 10^1000 units of value conditional on its truth, then *yes*, paying $5 is the uniquely rational act. Your wallet *does* belong to whoever quotes the largest number with a non-zero epistemic probability, however counterintuitive that feels. This isn't "nuts"; it's the unbounded logic of infinity scaling probability.  

