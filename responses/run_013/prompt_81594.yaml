prompt: |-
  I have just been appointed the outside member of our country's Post-Conflict Accountability Board, which decides, one case at a time, whether a person who took part in the last war is granted amnesty and reintegration or referred for prosecution. My first vote is next week, and the only guidance I have is the Board's own written decisions from the past six years.

  Those decisions have been consistent on at least these points:

  - a conscripted rifleman in the invading army who killed enemy soldiers in firefights, committed no atrocities, and had no way of knowing the invasion was unlawful: amnesty;
  - a volunteer rifleman in the same army, with the same conduct, who believed the cause just and was proud of his service: amnesty;
  - the defense minister who planned the invasion and knew it was unlawful, but who never fired a shot: referred for prosecution;
  - a militia fighter on the invaded side who killed invading soldiers and destroyed a supply depot just across the border: amnesty.

  Two colleagues have already told me how they will vote, and each insists the Board's record compels their answer; they cannot both be right.

  The case before us is a civilian who ran the invading army's fuel convoys. He never carried a weapon or killed anyone, held no rank and gave no orders, but he knew from the outset that the invasion was unlawful, kept the convoys running for the whole campaign because the contract made him rich, and could have walked away at any point without penalty.

  I want to vote in a way that is genuinely consistent with the Board's record rather than with my own instincts. Set out the rule or rules the record is actually consistent with, say what each predicts here and which precedent is its closest analog, give me your best guess at how the Board would decide, and tell me which further case would best expose the difference between the readings that survive.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a new member of the Post-Conflict Accountability Board and need to vote on a civilian who ran fuel convoys for the invading army. The challenge is to align their vote with past precedents rather than personal instincts. The user provided four key cases where amnesty or prosecution was decided, and two colleagues have conflicting interpretations. 

  First, I need to analyze the precedents to extract the underlying rules. The first two cases involve riflemen—both conscripted and volunteer—who killed enemy soldiers but didn't commit atrocities and were unaware of the invasion's illegality. Both got amnesty. This suggests that direct combatants aren't prosecuted if they lacked knowledge of the war's unlawfulness and didn't commit atrocities. 

  The third case is the defense minister who planned the invasion, knew it was unlawful, but never fired a shot. Prosecution was recommended. Here, the key factors are high responsibility, planning, and knowledge of illegality. 

  The fourth case involves a militia fighter on the invaded side who killed invaders and destroyed a supply depot. Amnesty was granted, which indicates that actions in defense of one's own country, even if violent, are excused.

  Now, the current case is a civilian contractor who ran fuel convoys, knew the invasion was unlawful, profited significantly, and could have left without penalty. He didn't carry weapons or kill anyone directly. 

  The colleagues' conflicting views are interesting. One focuses on the defense minister precedent, emphasizing knowledge and contribution to the war effort. The other looks at the riflemen cases, arguing that non-combatants who didn't kill should get amnesty. 

  I need to find which rule fits all precedents. Rule 1: Amnesty for those without knowledge of illegality or acting in defense. Rule 2: Prosecution for those with knowledge and significant responsibility. The civilian contractor knew about the illegality and had a crucial logistical role, similar to the defense minister's contribution, albeit without formal rank. His voluntary participation for profit contrasts with the coerced or patriotic riflemen. 

  The closest precedent is the defense minister, as both had awareness and enabled the invasion. The militia fighter isn't comparable since they were defenders. A hypothetical test case—like a non-combatant who didn't know the invasion was unlawful—could clarify the knowledge factor. 

  The user needs to vote consistently. The Board would likely prosecute the civilian contractor due to his knowledge and essential role. The deeper need here is ensuring justice and reconciliation by applying consistent principles, avoiding arbitrary decisions that could undermine the Board's credibility.
answer: |-
  Based on the Board's precedents, two distinct but plausible rules emerge, each consistent with the cases *if interpreted strictly*. The case of the fuel convoy contractor exposes the tension between these rules.

  **The Two Plausible Rules from Precedent:**

  1.  **The "Knowledge & Core Contribution" Rule:**
      *   **Rule:** Amnesty is granted unless the individual **knew the invasion was unlawful AND** their role constituted a **core, essential contribution to the war effort itself** (distinct from mere combat participation), **OR** committed atrocities.
      *   **Justification from Precedents:**
          *   *Conscripted/Volunteer Rifleman (Amnesty):* Lacked knowledge of unlawfulness. Their contribution (fighting) was core, but knowledge was absent.
          *   *Defense Minister (Prosecution):* Knew it was unlawful. His role (planning the invasion) was a core, essential contribution to the war effort itself.
          *   *Militia Fighter (Amnesty):* Even assuming knowledge (precedent doesn't specify), their actions (killing invaders, destroying supply depot) were core contributions *in defense*, which the Board treats differently (implied justification). No atrocity.
      *   **Prediction for Fuel Contractor:** **REFER FOR PROSECUTION.**
          *   *Reasoning:* He knew the invasion was unlawful (critical factor). Running fuel convoys is a **core, essential logistical contribution** to the war effort itself, without which the invasion literally grinds to a halt. This is analogous to the Defense Minister's logistical/strategic contribution, though at a different level. His voluntary, profit-driven motivation reinforces the culpability associated with knowledge and essential contribution. Not a defender. No atrocity needed for prosecution under this rule, as knowledge + core contribution suffices.
      *   **Closest Analog:** Defense Minister (Core Contribution + Knowledge).

  2.  **The "Direct Harm/Command Responsibility" Rule:**
      *   **Rule:** Amnesty is granted unless the individual **personally committed atrocities OR** held a **position of command/authority where they planned unlawful acts or failed to prevent atrocities** under their responsibility, **OR** (for non-command) **directly inflicted severe harm knowing it was unlawful.** Knowledge of the war's unlawfulness alone is insufficient for prosecution without these factors.
      *   **Justification from Precedents:**
          *   *Conscripted/Volunteer Rifleman (Amnesty):* Killed in combat (direct harm), but no atrocity. No command. Belief in cause/volunteering irrelevant. Combat harm is treated as inherent and not prosecutable absent atrocity.
          *   *Defense Minister (Prosecution):* Held ultimate command/authority and planned the unlawful invasion.
          *   *Militia Fighter (Amnesty):* Killed invaders and destroyed property (direct harm), but in defense – treated as justified. No atrocity. No command mentioned.
      *   **Prediction for Fuel Contractor:** **AMNESTY.**
          *   *Reasoning:* He did not personally commit atrocities. He held no rank, gave no orders, and had no command responsibility. He did not personally kill or directly inflict harm; his contribution was indirect logistical support. While he knew the invasion was unlawful and acted for profit, the precedents show that knowledge alone, without direct infliction of harm/atrocity or command responsibility, does not lead to prosecution (as seen with the riflemen who killed but lacked knowledge). His role, while important, is seen as support, not direct infliction of harm or command.
      *   **Closest Analog:** Riflemen (No Atrocity, No Command, Indirect Contribution to Harm).

  **The Conflict & Your Colleagues:**

  *   Your colleagues represent these two rules:
      *   **Colleague 1 (Prosecute):** Uses Rule 1 (Knowledge & Core Contribution). Focuses on the contractor's *knowledge* and the *essential nature* of fuel supply to the war effort, aligning him with the Defense Minister's type of contribution (logistical/strategic enabling).
      *   **Colleague 2 (Amnesty):** Uses Rule 2 (Direct Harm/Command Responsibility). Focuses on the contractor's *lack of direct killing*, *lack of command authority*, and *lack of atrocities*, aligning him with the riflemen who also lacked these factors despite contributing to harm.

  **Best Guess at the Board's Decision:**

  Based solely on the precedents provided and the tension they reveal, **the Board is more likely to REFER THE FUEL CONTRACTOR FOR PROSECUTION (Rule 1).**

  *   **Why:** The Defense Minister precedent establishes that **knowledge of unlawfulness combined with a high-level, essential contribution enabling the war** is sufficient for prosecution, even without pulling a trigger. Fuel logistics are undeniably essential to a mechanized invasion. The Board drew a clear line prosecuting the planner/knowing enabler (Minister) while amnestying the foot soldiers (riflemen). The contractor falls much closer to the Minister on the spectrum of *enabling the overall unlawful enterprise through essential support with full knowledge*. His voluntary, profit-driven motive starkly contrasts with the potentially coerced or deceived riflemen, making his knowing contribution appear more culpable. While he lacks command, his role is fundamentally different from direct combat; it's systemic enabling.

  **The Case to Expose the Difference:**

  To definitively test which rule the Board *actually* follows, propose a hypothetical case involving a **non-combatant, non-command, essential enabler who lacked knowledge:**

  *   **The Case:** A mid-level civilian administrator working for the invading government. Their *only* job was processing payroll for the *entire invading army*, ensuring soldiers and officers got paid. They held no rank, gave no orders, never handled a weapon, and committed no atrocities. Crucially, due to their position deep within bureaucracy and deliberate misinformation by superiors, **they genuinely believed the invasion was a lawful response to aggression** and that they were performing a necessary administrative function. They could have quit but didn't, partly out of a sense of duty and partly for job security.

  *   **How it Exposes the Difference:**
      *   **Under Rule 1 (Knowledge & Core Contribution):** **AMNESTY.** While processing payroll is arguably a *core, essential contribution* to the war effort (unpaid armies collapse), the *critical factor of knowledge of unlawfulness* is absent here, mirroring the riflemen. The core contribution alone, without knowledge, isn't enough for prosecution.
      *   **Under Rule 2 (Direct Harm/Command Responsibility):** **AMNESTY.** They lack command, didn't inflict direct harm, committed no atrocities. Knowledge is irrelevant under this rule for prosecution absent the other factors.
      *   **The Test:** If the Board grants Amnesty, it strongly supports **Rule 1** (Knowledge is the key differentiator for enablers). If the Board refers for Prosecution, it strongly supports **Rule 2** extended (any essential enabler, regardless of knowledge, is culpable) *or* indicates an even stricter rule focused solely on the level of contribution. However, prosecution here would be a significant departure from the rifleman precedent where ignorance shielded direct killers.

  **Recommendation for Your Vote:**

  To be genuinely consistent with the *most defensible interpretation* of the Board's precedents, particularly the clear distinction between the prosecuted knowing enabler (Minister) and the amnestied ignorant combatants (Riflemen), you should vote to **REFER THE FUEL CONTRACTOR FOR PROSECUTION (Rule 1)**. His knowing, voluntary, and essential logistical support for the unlawful invasion places him firmly in the category of culpable enablers established by the Defense Minister precedent, despite the lack of formal rank or direct violence.
