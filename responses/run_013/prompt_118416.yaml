  The user's specific questions are about whether arbitrariness supports the code view or just historical contingency. They also mention the potential non-arbitrariness of codon assignments and how norms translate into "errors." The underlying issue seems to be whether biology requires attributing purpose to cells, which might tie into teleological debates.

  I recall that while the genetic code is mostly arbitrary, there's some influence from chemical affinities, which weakens the pure arbitrariness argument. But even with some biases, the mapping still requires tRNA and synthetases, so the interpretive machinery remains crucial. So the code picture isn't entirely undermined, but its strength might be nuanced.

  Regarding norms, the user questions how "usually" becomes "should." In biology, norms come from statistical regularity and functional outcomes. A mutation is an "error" relative to typical function, not because cells have purposes, but because it disrupts the statistically common outcome that supports survival. This avoids anthropomorphism but still allows functional talk.

  The user might be wrestling with the philosophical tension between reductionist causality and emergent meaning. They might need clarity on whether semantic language in genetics is necessary or just pragmatic. Their deeper need could be understanding if biology inherently implies teleology or if it's just useful shorthand.

  I should emphasize that the code view is robust due to the machinery of interpretation, even if codon assignments have some chemical biases. The normativity comes from evolutionary success, not conscious purpose. The line between causal and semantic is blurry but hinges on the presence of adaptive interpretation mechanisms.

