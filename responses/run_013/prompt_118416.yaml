prompt: |-
  Ok so I'm trying to get a comparison straight and it keeps collapsing on me, hoping you can help. Two pictures of what genes are up to.

  First picture: DNA really is a code. Stretches of it stand for amino acids, the mapping is arbitrary — the codon table could have been otherwise — and it has to be read off by machinery rather than being fixed by the chemistry. Because of that, phrases like 'the gene for X', or calling a mutation a 'misprint' or an 'error', are doing real work and not just decoration.

  Second picture: 'information' in biology is nothing more than causal specificity — a fancy way of saying which causes make which differences downstream. No content, no meaning, no representation. 'The gene for X' is handy shorthand, and a mutation is just a different cause with different effects, not a mistake.

  I want an actual comparison of these two, not a tour of the literature (no reading list needed, I'm not citing anything).

  Specifically: does the arbitrariness of the codon mapping actually favour the first picture, or does it only show the mapping is historically contingent — which is true of loads of causal relations and gets you nowhere near content? Related: I've heard the mapping isnt even that arbitrary, since codon assignments might be biased by how well particular codons and amino acids stick together — if that's right, does the case for the code picture get weaker or stronger?

  And what is the norm doing, exactly? Going from 'codon C usually ends up producing amino acid A' to 'C codes for A, so a change here is an error' seems to smuggle in a reader with purposes we haven't earned. Is there a principled place to put the causal/semantic line, or does it just come down to whether you're willing to grant purposes to cells and lineages?

  Tell me how confident you are in what you're claiming, and single out the point you're least sure about.
