answer: |-
  ### (a) Three-stage diagnostic application

  **Stage 1: Key term and apparent disagreement**  
  Key term: "planet."  
  Sentence: "Pluto is a planet." IAU denies this; objectors affirm it.

  **Stage 2: Same sense?**  
  - **Empirical claim (actual pre-2006 usage)**: Evidence from literature shows inconsistent application. "Planet" historically included:  
    - Bodies orbiting the Sun (shared).  
    - Implicit size/roundness (e.g., Ceres demoted when many small bodies found; Pluto initially accepted due to presumed size).  
    - No consistent requirement for orbital clearance (e.g., Jupiter’s Trojans not disqualifying it; Earth’s near-Earth asteroids ignored).  
    Evidence: Pre-2006 textbooks/museum displays classified Pluto as planet; no prior formal definition; variable usage in asteroid discoveries.  
  - **Stipulative claims**:  
    - IAU stipulates: Orbital clearance essential.  
    - Objectors stipulate: Geophysical properties (roundness) sufficient, orbital role arbitrary.  
    Evidence for stipulations: IAU Resolution 5B; objectors’ arguments about "natural divisions" or Earth’s orbit.  
  **Verdict**: Senses differ. IAU ties "planet" to dynamic dominance; objectors to intrinsic physical properties.  

  **Stage 3: Shared question?**  
  No single shared question:  
  - IAU answers: "Which bodies gravitationally dominate their orbital zones?" (Pluto → no).  
  - Objectors answer: "Which bodies are hydrostatically rounded by self-gravity?" (Pluto → yes).  
  Divergent questions reflect distinct criteria. **Verdict**: Dispute is merely verbal (first-order).  

  ---

  ### (b) Breakdowns and complications  

  1. **Second-order verbal dispute?**  
     Yes: Parties knowingly debate which sense *should* govern "planet." This is normative (e.g., "Should classification prioritize dynamics or geophysics?").  

  2. **Substantive disagreements?**  
     - Solar System structure: Disagreement exists (e.g., whether orbital clearance correlates with formation processes), but this is downstream of classification choices.  
     - Classification purpose: Core conflict. IAU prioritizes dynamical taxonomy for pedagogical/clarity goals; objectors prioritize geophysical unity for comparative planetology.  
     - Science’s needs: Substantive (e.g., "Does grouping Pluto with Earth aid research?"), but this presupposes a chosen framework.  

  3. **Institutional/social factors**:  
     - Vote/textbooks: The apparatus treats these as *resolutions* of verbal disputes, not evidence of substance.  
     - Non-compliance/public reaction: Noise to the apparatus—reveals emotional/normative stakes but not factual disagreement.  

  ---

  ### (c) Reversing direction: Testing the apparatus  

  - **Negotiation vs. verbal dispute**: Episode favors "negotiation diagnosis." The IAU vote functions as a meaning *proposal* (not discovery), exposing "planet" as a term requiring institutional sanction for coherence.  
  - **Third position (independent correct sense)**: Embarrassed. Historical flux (Earth/Ceres) and arbitrary criteria (e.g., "cleared orbit" threshold) show no pre-existing "correct" sense.  
  - **Functional/administrative term**: Makes dispute *less* like a verbal one. If "planet" is policy-driven (e.g., "best classification for education"), the dispute becomes substantive about *goals* (e.g., "What serves science communication best?").  

  ---

  ### (d) Ceres/Earth precedents  

  - **Effect on analysis**: Undermines "single shared question." Historical reclassifications prove the term’s sense is convention-dependent. Parties aren’t answering one question differently; they’re *choosing different questions* (geophysics vs. dynamics) based on evolving priorities.  
  - **Fluidity’s implication**: "Shared question" requires stable criteria. Flux shows criteria are negotiated, not discovered, making a unified propositional disagreement untenable.  

  ---

  ### Verdict  
  The dispute is primarily first-order verbal but evolves into second-order normative negotiation over classification ideals, with substantive elements about scientific utility.  
