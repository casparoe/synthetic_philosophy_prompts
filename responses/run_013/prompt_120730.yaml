prompt: |-
  I am a novelist, and the book I am writing turns on characters who make agreements with their future selves: a woman who signs a contract with a firm that will fine her if, on a stated date, she has not left her husband; a man who takes a pill so that he will stop doubting his wife; a club whose members enforce one another's vows and profit from one another's lapses. I have read enough of the literature on diachronic rationality to know that I am borrowing trouble, and I would rather know the shape of the trouble before I finish the draft. Adequate for what? For this: I need to know, of each of these characters, whether she is being irrational or merely unlucky in her tempters, and whether her contracts are binding in any sense I can defend in prose.

  So I am not asking for a survey. I am asking for a specification: what must any adequate theory of rationality over time deliver? Give me the requirements, each with the case that motivates it, and mark which are non-negotiable and which are commitments of a particular camp. At a minimum I want the list to cover:

  1. The exploitation cases — the pump in which an agent with a cycle of preferences trades his way back to where he began, minus a fee at each turn; the book that can be run against a person whose credences shift over time; the dial that can be turned one notch at a time for money, where every notch is worth taking and the end of the dial is not. Say what each is supposed to show, and whether the theory must convict the agent of irrationality or only of being exploitable. The two verdicts are not the same, and I need to know which one my characters deserve. I also want the theory to say whether regret on its own is evidence of irrationality, or whether the pump is doing all the work.

  2. Whether the requirement is genuinely diachronic. If every case can be redescribed with time-indexed preferences and credences, then all the incoherence is synchronic and the theory has a very different shape. If it cannot, say what the irreducibly diachronic element is.

  3. Precommitment, without paradox and without question-begging. I will not believe a theory that makes the ropes irrational, and I will not believe one that declares the untied man's defection irrational by fiat. If those two verdicts cannot be had together on a single standard, that is the result I most want from you.

  4. The difference between a change of mind and a failure of coherence — including the person who has become someone else and repudiates her contract without regret, and the person who foresees her own reversal and is the worse off for foreseeing it. The theory must not assume that the satisfaction of the present self's preferences is the measure of the agent's good, or it cannot describe either of them.

  5. The unit of assessment: the act, the agent at a time, the temporally extended person, or the person plus her commitments. And whether the theory is committed to treating the future self as, in some degree, another person.

  6. Cases where the binding technology is absent or fails. Resolve is not a rope. Must a requirement of rationality be satisfiable by an agent who has no device available to her?

  7. The active tempter. The standard pump assumes a bookie who takes what he is offered; my commitment firm has an interest in my character's lapse and cultivates it. Does the verdict change when the other party engineers the inconsistency rather than merely profiting from it?

  8. Belief as well as preference. If the pill works and she stops doubting, has she been irrational, or has she done precisely what a person who distrusts her own future evidence ought to do?

  9. The authority of the requirement: is it a requirement of rationality or of prudence, and does "you will regret this" give her a reason now?

  Items 7 and 8 are my inventions, not items in the literature; treat them as cases to be handled rather than as things to be looked up.

  I expect at least one pair on this list to be jointly unsatisfiable, and I would like you to say which. My own suspicion falls on 3, set against the demand that every act be assessed by the reasons the agent has at the moment she performs it. Close by telling me which single requirement does the most to exclude candidate theories, and where your reasoning is likeliest to fail: what you would have to be shown, or which case would have to be described differently, for you to drop that requirement or reverse your verdict on the pair. Keep any scoring of particular positions to a sentence or two; the criteria are what I need.
reasoning: |-
  Okay, the user is a novelist working on a book about characters making agreements with their future selves. They need a clear, structured understanding of diachronic rationality theories to inform their writing. Let me start by unpacking their query. They want specifications on key requirements for an adequate theory, focusing on exploitation cases, diachronic elements, precommitment paradoxes, changes of mind, units of assessment, binding technology failures, active tempters, belief manipulation, and the authority of requirements.

  First, the exploitation cases. The user mentioned money pumps and Dutch books. I need to explain what each shows and whether they indicate irrationality or mere exploitability. The key point here is whether cyclic preferences make an agent irrational or just vulnerable. The literature often treats money pumps as evidence of irrationality because they reveal inconsistencies. But the user is right to distinguish between irrationality and bad luck. For their characters, the verdict might depend on whether the preference cycle is inherent or induced externally. Also, regret alone isn't sufficient evidence; the pump demonstrates the practical consequence of the inconsistency.

  Next, whether the requirement is genuinely diachronic. Some theories reduce everything to time-indexed preferences, making the problem synchronic. But the user wants to know if there's an irreducibly diachronic element. The answer lies in whether the theory can handle changing selves without assuming fixed preferences. The ship of Theseus problem is relevant here. If future selves are different agents, then obligations might not hold. But if continuity of identity is maintained, diachronic constraints apply.

  Precommitment is a big one. The ropes example: is Ulysses irrational for tying himself? Or is he rational for ensuring his goal? The untied man who defects—rational at that moment but failing his past self. A good theory must reconcile both without begging the question. Commitment strategies need to be valid without assuming future compliance. The paradox here might be that precommitment only works if the future self agrees, which isn't guaranteed.

  Change of mind vs. coherence failure. The user mentioned characters who become different people and repudiate contracts without regret. The theory mustn't assume present preferences define the good. So, distinguishing genuine transformation from akrasia is key. If the future self has fundamentally different values, is the contract still binding? This ties into personal identity over time.

  Unit of assessment: act, time-slice, extended person, or person plus commitments. This affects whether future selves are seen as separate agents. If the theory treats them as distinct, contracts might not hold. But if the extended person is the unit, then commitments transcend temporal stages.

  Binding technology failure. If resolve is the only tool, must rationality be achievable without external aids? Theories requiring self-control might fail here, while those allowing external precommitments are more robust.

  Active tempter: The commitment firm profits from lapses and engineers them. Does this change the verdict? Traditional pumps involve passive bookies. Active manipulation introduces coercion or undue influence, possibly absolving the agent of irrationality if their lapse is caused by external pressure.

  Belief manipulation: The doubt-suppressing pill. If she stops doubting due to the pill, is that rational? If she distrusted her future evidence, taking the pill might be a rational precommitment. But altering beliefs directly could be seen as self-deception, which is epistemically irrational.

  Authority of requirements: Is the requirement based on rationality or prudence? "You'll regret this" might give a present reason if future regret affects current well-being. But some theories argue only current reasons matter.

  Now, identifying conflicting points. Precommitment (point 3) and the synchronic reason requirement (point 9) clash. If every act must be rational at its time, precommitments that bind future actions might force irrational acts then. But if precommitments are rational, future defiance could be irrational. The ropes example highlights this tension. Ulysses' future self might resent being bound, but the precommitment ensures long-term goals. A theory must either allow binding future selves (risking their autonomy) or reject precommitments as ineffective, both problematic.

  The user suspects point 3 is the sticking point. Indeed, reconciling synchronic rationality with diachronic commitments is tough. The toughest requirement is avoiding question-begging in precommitment justifications. If a theory assumes future compliance, it's circular. But if it doesn't, how can it enforce past commitments? This might be unresolved in the literature.

  For the novelist, characters' irrationality vs. bad luck depends on their awareness and control. If a character enters a contract knowing her future self might rebel, is that irrational? Or is the firm exploitative? The active tempter aspect might shift blame to the firm, making the character exploited rather than irrational. Similarly, the belief pill: if she knows she'll lose evidence, suppressing doubt might be rational, but epistemically suspect.

  In conclusion, the key takeaway is the tension between synchronic and diachronic rationality, especially around precommitment. The hardest requirement is #3, as it demands a theory that validates precommitments without assuming future compliance or condemning defiance. This conflict might be inherent, suggesting that in the novel, characters could face genuine dilemmas where neither choice is fully rational, adding depth to their struggles.
answer: |-
  Below is a specification of the requirements for an adequate theory of diachronic rationality, structured by your cases and questions. I distill the core demands, flag non-negotiable elements, highlight tensions, and identify the most exclusionary requirement. The goal is clarity for your prose, not philosophical advocacy.

  ---

  ### **1. Exploitation Cases: Irrationality vs. Exploitability**  
  **Cases & What They Show**:  
  - **Money Pump**: An agent with cyclic preferences (A>B, B>C, C>A) pays to trade A for B, B for C, C for A, ending with A but poorer. Shows that cyclic preferences enable exploitation.  
  - **Dutch Book**: An agent with incoherent credences (e.g., violating probability axioms) accepts bets that guarantee loss. Shows that incoherent beliefs enable exploitation.  
  - **Dials (e.g., "Parfit's Hitchhiker")**: Each small step (e.g., turning a dial) benefits the agent now, but the final state is disastrous. Shows that myopic rationality leads to ruin.  

  **Verdicts**:  
  - **Non-negotiable**: A theory *must* convict the agent of **irrationality** in money pumps/Dutch books. Exploitability *follows from* irrational preferences/credences; it is not mere bad luck.  
  - **Negotiable**: For dials, theories diverge. Some convict the agent of irrationality for lacking foresight ("sophisticated" theories). Others deem them rational at each step but tragically exploitable ("myopic" theories).  
  - **Regret**: Regret alone is not evidence of irrationality. A rational agent might regret unavoidable trade-offs (e.g., saving a child but losing a leg). The pump *demonstrates* irrationality by revealing incoherence.  

  **For your characters**:  
  - The woman fined for not leaving her husband risks a money pump if her preferences cycle (e.g., married > single > married). She is irrational if she cycles, unlucky if exploited without incoherence.  
  - The club profiting from lapses is running a dial/pump: they design incentives to exploit predictable inconsistency.  

  ---

  ### **2. Genuinely Diachronic Requirement**  
  **Non-negotiable**: Time-indexed redescription (e.g., "I prefer cake at T1, salad at T2") does *not* resolve diachronic problems. The irreducibly diachronic element is **intrapersonal conflict**: how a single agent ought to relate to their past/future selves when values or beliefs change.  
  - **Motivating case**: Ulysses binding himself to the mast. If future Ulysses (tempted by sirens) is a "different agent," precommitment makes no sense. But if he is the same agent, we need norms governing cross-temporal agency.  
  - **What theories must deliver**: Rules for when a past commitment binds a future self, even if that self has new preferences.  

  ---

  ### **3. Precommitment Without Paradox**  
  **Non-negotiable**: A theory must:  
  - (a) Validate ropes as rational (Ulysses is *not* irrational for tying himself).  
  - (b) Acknowledge that the untied man’s defection *at the time of action* is rational if his reasons have changed.  
  **The Tension**: (a) and (b) conflict if rationality is purely synchronic (see §9).  
  **Resolution Requirement**: A theory must explain why *creating a precommitment* is rational *ex ante* (it aligns with long-term goals), while *defecting* may be rational *ex post* (if goals change). It cannot assume future compliance (question-begging), nor condemn ropes.  
  - **Key insight**: Precommitments are tools to overcome predicted irrationality (e.g., akrasia). If defection reflects genuine value change (not weakness), it may be rational.  

  ---

  ### **4. Change of Mind vs. Failure of Coherence**  
  **Non-negotiable**: A theory must distinguish:  
  - **Coherence failure**: Acting against your own enduring values (e.g., a smoker who values health but caves to craving).  
  - **Genuine change**: Becoming "someone else" (e.g., a devout believer who loses faith and repudiates a vow *without regret*).  
  **Motivating cases**:  
  - The person who foresees her reversal (e.g., sober her fears drunk her will gamble) is a coherence failure.  
  - The apostate who renounces a vow is a genuine change.  
  **What theories must deliver**: *Without* assuming present preferences define the good, it must ground assessments in **narrative unity** (e.g., whether the change reflects growth/truth) or **cross-temporal principles** (e.g., "only commitments aligned with your core identity bind").  

  ---

  ### **5. Unit of Assessment**  
  **Options**:  
  - **Act**: Irrelevant (diachronic problems span acts).  
  - **Agent-at-a-time**: Favored by synchronic theories; undermines diachronic obligations.  
  - **Temporally extended person**: The dominant view; requires judging the agent "as a whole."  
  - **Person + commitments**: Adds external promises as constraints.  

  **Non-negotiable**: A theory *must* treat the future self as **part of the same person**, not "another person." Else, precommitments lose force (why bind a stranger?).  
  **Requirement**: The unit must be the **extended agent**, with norms for balancing temporal selves.  

  ---

  ### **6. Binding Technology & Accessibility**  
  **Requirement**: A theory must define requirements satisfiable **without external devices**. Resolve must be sufficient; else, rationality depends on wealth/technology.  
  - **Case**: A vow-enforcing club is a tool for those with weak resolve. But an agent without access must still be able to resist pumps/akrasia via internal resources (e.g., planning, cognitive discipline).  

  ---

  ### **7. Active Tempter (Your Case)**  
  **Case**: The commitment firm cultivates lapses to profit from fines. Does this absolve the agent?  
  **Verdict**:  
  - **Standard pump**: Agent is irrational (exploited due to incoherence).  
  - **Active tempter**: Agent may be *less* irrational if the tempter manipulates their environment to *induce* incoherence (e.g., engineering cravings). But if the agent’s underlying inconsistency exists independently, irrationality remains.  
  **Requirement**: A theory must recognize **degrees of blame**. An active tempter exploits, but the lapse is still a failure of the agent’s diachronic coherence.  

  ---

  ### **8. Belief Manipulation (Your Case)**  
  **Case**: A man takes a pill to stop doubting his wife, distrusting his future evidence.  
  **Verdict**:  
  - **Epistemically**: Irrational if the pill suppresses evidence-responsive belief updating.  
  - **Pragmatically**: Rational if distrusting his future self’s judgment aligns with his current goals (e.g., preserving trust).  
  **Requirement**: A theory must separate **epistemic rationality** (responsiveness to evidence) from **practical rationality** (achieving goals). The pill may be practically rational but epistemically vicious.  

  ---

  ### **9. Authority of the Requirement**  
  **Key Question**: Is "you will regret this" a reason for present action?  
  - **Prudence (e.g., instrumental rationality)**: Yes, if future regret affects present well-being (e.g., via anticipation).  
  - **Morality/Reason**: Debatable. Some theories say only *present* reasons count.  
  **Non-negotiable**: Diachronic rationality must be a requirement of **instrumental rationality** (achieving your goals over time). "You will regret this" *is* a reason if you care about future satisfaction.  

  ---

  ### **Jointly Unsatisfiable Pair**  
  **§3 (Precommitment)** and **§9 (Synchronic Authority)** conflict:  
  - §9 demands that *every act* be rational by the agent's reasons *at the time of action*.  
  - §3 demands that precommitments bind future acts *even when reasons change*.  
  **Result**: Most theories sacrifice one:  
  - Synchronic theories (§9) reject precommitment’s authority (ropes are useless).  
  - Diachronic theories (§2) soften §9 (future acts are judged by past intentions).  

  ---

  ### **Most Exclusionary Requirement**  
  **§3 (Precommitment without paradox)** excludes nearly all candidates:  
  - Synchronic theories fail §3a (ropes are irrational).  
  - Naive diachronic theories fail §3b (defection is always irrational).  
  - **Only "sophisticated" theories** (e.g., Gauthier, Bratman) satisfy both by treating precommitment as a rational *plan* that future selves have reason to honor *if* their identity persists.  

  **Where My Reasoning Is Most Vulnerable**:  
  - **If shown**: A case where an agent *reasonably* expects a radical value shift (e.g., converting to a new ideology), and a precommitment (e.g., a vow of poverty) causes profound harm to the future self. Here, enforcing the vow may be irrational, undermining §3a.  
  - **Reversal condition**: If future suffering outweighs past benefits, and the shift was unforeseeable, precommitment loses authority.  

  ---

  ### **Summary for Your Characters**  
  | **Character**         | **Irrational?**                          | **Binding?**                              |  
  |------------------------|------------------------------------------|-------------------------------------------|  
  | **Woman with contract**| If preference cycle: yes. Else: unlucky. | Only if her identity persists (§4).       |  
  | **Man with pill**      | Epistemically: yes. Practically: no.     | Pragmatically defensible (§8).            |  
  | **Club member**        | Yes, if lapse is incoherence (§1,7).     | No, if the club induces incoherence (§7). |  

  **Final Advice**: The tension in §3 is fertile ground for fiction. A theory that fully reconciles synchronic and diachronic demands doesn’t exist—use this. Your characters can be *both* rational in the moment and tragically incoherent over time, their contracts binding only if the self persists. This ambiguity is the trouble you’ve borrowed: exploit it.
