answer: |-
  Here is the ranking of defenses against the leveling-down objection, from strongest to weakest:

  1.  **(1) Axiological Scope Defense:** Strongest because it correctly distinguishes prioritarianism as a theory of the *goodness* of states of affairs (axiology) from a theory of *right action*, showing the objection misattributes a practical implication the theory doesn't entail. This genuinely saves prioritarianism by clarifying its core domain.
  2.  **(3) Moderate Weighting Defense:** Moderately strong as diminishing weights *can* make leveling-down rarely or never axiological improvement in practice, preserving prioritarianism's core logic. However, it's weaker than (1) because it *technically* allows leveling-down to be an improvement in extreme cases where weights don't diminish fast enough, failing to fully defuse the axiological objection.
  3.  **(4) Side Constraint Defense:** Weak because while it blocks leveling-down *actions*, it concedes prioritarianism's axiology still *ranks* the leveled-down outcome as better, which is the core of the objection. This effectively abandons pure prioritarianism as a complete moral theory by adding an external deontic rule.
  4.  **(2) Single Case Concession Defense:** Very weak as admitting the core axiology gets a fundamental case (where the theory's gap-sensitivity is most directly tested) wrong significantly undermines its plausibility as a theory of value. This doesn't save prioritarianism; it highlights a potentially fatal flaw.
  5.  **(5) Sufficientarian Shift Defense:** Weakest as it explicitly abandons prioritarianism's defining feature (continuous diminishing marginal moral weight based on absolute welfare level) by replacing it with a threshold-based view, fundamentally changing the theory rather than defending it. This isn't saving prioritarianism; it's adopting a different theory.
