prompt: |-
  Alright, I keep going in circles on prioritarianism and I want a straight ranking out of you. You know the leveling-down objection — make the better-off worse off, make no one better off, and the view still has to call it an improvement, which is supposed to be damning. My problem is that every defense I hear sounds fine in isolation and I cant tell which ones actually do work. So here are the five I keep running into, and I want them ranked from strongest to weakest as replies — which genuinely defuse the objection versus which just change the subject or quietly swap in a different theory:

  (1) it's a ranking of outcomes, not a decision rule, so prioritarianism never actually instructs anyone to level down; (2) concede the axiological claim gets that one case wrong but say a single bad verdict doesn't sink the whole account; (3) go "moderate" — make the weight on the worse off diminish fast enough that leveling down basically never comes out ahead; (4) bolt on a side constraint that nobody may be made worse off for the sake of shrinking a gap, which leaves prioritarianism deontically silent in these cases; (5) drop the gap-sensitivity altogether and go sufficientarian, caring only about getting people over a threshold.

  Rank all five, one or two sentences each on why it lands where it does, and say for each whether it actually saves prioritarianism or just replaces it with a different view. Numbered list, exactly five items, no intro and no closing paragraph.
