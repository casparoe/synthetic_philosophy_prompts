  ## The Compromises

  I start with the **literal sense**: a rose
  That fades, a fever-flush upon pale skin.
  This much must hold, though music slips away.
  The strict demands of **sound** are next to bind –
  The vowels like chimes, the consonants like stone.
  But clinging to clear meaning, **rhyme** grows thin.

  So **rhyme** ascends, commanding the design,
  Patterning echoes where the meaning blurs.
  The rose becomes "affliction's crimson sign,"
  The fever-flush, a "heart that wildly stirs."
  But shaping couplets, **syntax** twists and jars –
  The natural flow constrained by chiming pairs.

  Now **syntax** strains against the ordered beat,
  Inverting phrases, stretching clauses long
  To fit the metre pulsing, sharp and sweet.
  The courtly words feel suddenly less strong,
  Too stiff for whispered comfort. **Register**'s gone wrong,
  A noble speech where tender pity's meet.

  That careful **register**, the tone once mild,
  Now grates – too formal for a sickroom's air.
  The earnest words sound lofty, almost wild,
  While something vital vanishes from there,
  A fleeting breath, a sigh beyond compare –
  That ghostly, lost **residue**, unreconciled.

  The stubborn **residue**, the scent, the ache,
  The way the light first trembled on the page,
  That slips through nets of meaning I must make.
  I grasp at **literal sense** to cage
  The core, the fading rose, the fever's rage,
  But lose the chime that made the first words wake.

  (Envoy)
  Translator, what remains? That fading **rose**
  Still holds its core, though stripped of chime and sigh.
  **Residue** escapes, **register** imposes, **syntax** slows.

  ---

  **How it enacts the dilemma:**

  1.  **End-words as Priorities:** Each stanza ends with one of the six commitments: literal sense, sound, rhyme, syntax, register, residue. This word is the *last* thing prioritized (or preserved) in that stanza.
  2.  **Forced Choice:** The sestina's core rule is that the *end-word* of one stanza becomes the *first end-word* of the next. This means the commitment you *just saved* (placed at the end) is the commitment you *must serve first* in the next stanza. Saving something pushes it to the front for the next round, forcing you to potentially sacrifice what comes next.
  3.  **Stanza-by-Stanza Trade-offs:**
      *   **Stanza 1:** Starts with **literal sense**, ends with **residue**. (Saved residue for Stanza 2).
      *   **Stanza 2:** *Must* start with **residue** (saved from Stanza 1). Focuses on sound/rhyme interplay. Ends with **syntax**. (Saved syntax for Stanza 3).
      *   **Stanza 3:** *Must* start with **syntax** (saved from Stanza 2). Shows syntax straining under the demands of sound/rhyme. Ends with **register**. (Saved register for Stanza 4).
      *   **Stanza 4:** *Must* start with **register** (saved from Stanza 3). Shows how the chosen tone/register ("noble speech") becomes inappropriate. Ends with **residue**. (Saved residue for Stanza 5).
      *   **Stanza 5:** *Must* start with **residue** (saved from Stanza 4). Focuses on the futile attempt to grasp the residue. Ends with **literal sense**. (Saved literal sense for Stanza 6).
      *   **Stanza 6:** *Must* start with **literal sense** (saved from Stanza 5). Returns to the core meaning ("fading rose") but acknowledges the heavy losses accrued along the way (sound, residue). Ends with the *new start* of the cycle ("**sound**").
  4.  **Envoy's Unresolved Cost:** The envoy gathers the first words of the stanzas (rose, residue, register, syntax) and adds 'Translator'. It doesn't conclude or judge. It simply names the core image ("rose"), the persistent loss ("residue escapes"), the compromises made ("register imposes, syntax slows"). It ends mid-thought, reflecting the ongoing, irresolvable struggle.
  5.  **Thematic Movement:** The poem traces a journey from the concrete image ("rose") through the technical constraints (sound, rhyme, syntax, register), highlighting the distortions and losses each imposes, and constantly circling back to the elusive "residue" that escapes capture. The final stanza explicitly states the cost: "lose the chime that made the first words wake."

  The form itself *is* the argument: each step forward is dictated by the previous sacrifice, demonstrating the chain of compromises inherent in translating fixed-form poetry.
