answer: |-
  ## St. Petersburg Doubles

  Stanza 1 (1 line):  
  Cold coin spins—Heads. Pays one pound.

  Stanza 2 (2 lines):  
  Tails? Try again. If Heads now shows,
  Pays two. A simple, fertile ground.

  Stanza 3 (4 lines):  
  Two Tails? Again. Should Heads arise,
  Pays four. The stakes begin to climb.
  Three Tails? Once more. If Heads pays eight—
  A run of heads defies all time.

  Stanza 4 (8 lines):  
  Four Tails? Spin on. Sixteen pounds gleam.
  Five Tails? Still spin. Thirty-two race.
  Six Tails? Keep spinning. Sixty-four—
  The sums accelerate apace.
  But hold. The *worth* of such a heap
  Grows slower than the frantic gain:
  Each new pound weighs less than the last,
  A dimming of desire's bright stain.
  No mint contains that final sum,
  No purse could hold the boundless prize.
  The coin must stop. The game must end
  Beneath the scale of human eyes.

  A die that never settles lands.

  ---

  **Annotations for Clarity (Not Part of Poem):**

  1.  **Form & Paradox Mirroring:** Line counts double (1,2,4,8) alongside the payouts (1,2,4,8,16,32,64... implied), enacting the runaway growth physically on the page. The halt at the 8th line of Stanza 4 explicitly forces the game to stop.
  2.  **Bernoulli's Resolution (Logarithmic Utility):** "The *worth* of such a heap / Grows slower than the frantic gain: / Each new pound weighs less than the last, / A dimming of desire's bright stain." Captures diminishing marginal utility without naming Bernoulli.
  3.  **Finite Bankroll/Objection:** "No mint contains that final sum, / No purse could hold the boundless prize. / The coin must stop. The game must end / Beneath the scale of human eyes." Acknowledges the practical impossibility.
  4.  **Deeper Trouble (Alternating Series / Order Dependence):** The final line "A die that never settles lands." gestures towards a conditional convergence paradox (like the Riemann series theorem). An alternating series (e.g., +1, -1/2, +1/3, -1/4...) can be rearranged to sum to different values (or even diverge), making "expected value" undefined or dependent on summation order – a more profound instability than the simple divergence of St. Petersburg. The "die" evokes chance, "never settles" implies no stable value, distinct from the earlier coin, and "lands" ironically suggests a result that isn't definitive.
  5.  **British English:** "Pounds," "mint," "purse" used appropriately.
  6.  **Accuracy & Restraint:** Philosophical concepts drive the imagery and structure directly. No ornament detracts from the core argument enacted by the form.
