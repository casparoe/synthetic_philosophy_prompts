prompt: |-
  Act like a philosopher who works on knowledge and is used to being asked to be exact. I've been reading around the 'does what's at stake change whether you know' stuff on my own, and before I pick a side I want the spec first. So give me the list of things any theory of when someone knows has to get right — the cases it has to call correctly, the distinctions it can't collapse, the facts about how we actually use the word it can't just ignore — with the case or consideration behind each item. Three cases I care about most, so please make sure your list handles them: two people with the exact same evidence, one of whom is about to bet a lot on it and one who isn't; a person whose evidence is perfectly good but who has no idea the stakes are high because nobody told them; and a whole town, or the whole planet, where each person's own stake is tiny but what's at stake for everyone together is enormous. Which items on your list are real requirements and which are just things one camp happens to like? And if some of them can't all be satisfied at once, say which ones, because that's the part I most want to see. Brainstorm a bit before you commit to the list, and think carefully about the difference between a requirement and a prejudice. I dont want a reading list, just the list. If you want to score the two main families of view against it at the very end, fine, but keep that short — the criteria are what I'm after.
reasoning: |-
  Okay, let me approach this systematically. The user wants a philosopher's toolkit for evaluating knowledge theories, with special attention to three specific cases involving stakes. 

  First, I need to distinguish between genuine requirements for any knowledge theory versus mere theoretical preferences. The core requirements should capture universal linguistic intuitions and conceptual necessities, not partisan commitments. 

  Considering the user's three focal cases: 
  The identical-evidence-different-stakes scenario tests whether practical factors intrinsically affect knowledge. 
  The uninformed-high-stakes case probes if knowledge can exist without awareness of stakes. 
  The distributed-stakes situation examines whether group stakes impact individual knowledge attribution. 

  For the framework, I'm identifying six key criteria:
  1. Veridicality Condition - addresses the truth requirement fundamental to knowledge
  2. Evidence Constraint - ensures justification isn't arbitrary
  3. Non-Luck Condition - separates knowledge from fortunate guesses
  4. Epistemic Agency Preservation - maintains that knowers aren't passive
  5. Practical Deliberation Anchor - connects knowledge to action-guidance
  6. Attributor Context Neutrality - handles contextual variance in knowledge claims

  The tension points emerge clearly between criteria 5 and 6 - theories struggle to simultaneously honor knowledge's action-guiding role while keeping attributions stable across contexts. The distributed-stakes case further stresses whether individual epistemic status depends on collective circumstances. 

  When applying this to existing theories:
  Traditional invariantism satisfies 1-4 firmly but stumbles on 5 and the high-stakes cases. 
  Contextualism handles 5-6 smoothly but risks compromising 4's agency requirement. 
  Interest-relative theories prioritize 5 at the cost of 6's neutrality. 

  The unresolved question remains: can any theory fully reconcile the action-guiding nature of knowledge with its context-independent core?
answer: |-
  Below is a distilled list of criteria for evaluating theories of knowledge, derived from conceptual boundaries, linguistic practice, and non-negotiable epistemic intuitions. Items marked **(\*)** are widely treated as **core requirements**; others reflect persistent patterns in usage some theories prioritize. Conflicts arise primarily between practical relevance and stability conditions.

  ### Core Criteria for Knowledge Theories
  1. **Veridicality Condition (\*)**  
     *Requirement:* Knowledge must entail truth. If \( p \) is false, \( S \) does not know \( p \).  
     *Case:* A belief that "the bank is open Saturday" cannot be knowledge if the bank is closed.  

  2. **Evidence Constraint (\*)**  
     *Requirement:* Knowledge requires justification/evidence sufficient to rule out relevant alternatives.  
     *Case:* Guessing correctly that a coin flip will land heads isn’t knowledge, even if true.  

  3. **Non-Luck Condition (\*)**  
     *Requirement:* Knowledge cannot be accidentally true. Must be non-luckily connected to the fact.  
     *Case:* A stopped clock showing the right time at the moment you glance isn’t knowledge.  

  4. **Epistemic Agency Preservation (\*)**  
     *Requirement:* Knowledge attribution must reflect the agent’s *epistemic* state, not external manipulation.  
     *Case:* Brainwashed individuals with true beliefs don’t "know"—they lack proper cognitive ownership.  

  5. **Practical Deliberation Anchor**  
     *Pattern:* We treat knowledge as a license for action. If \( S \) knows \( p \), \( S \) can appropriately act on \( p \).  
     *Case:* If you *know* the ice is thick, you can skate; mere belief may not suffice.  

  6. **Attributor Context Neutrality**  
     *Pattern:* Knowledge attributions shouldn’t arbitrarily shift with the *attributor’s* (e.g., speaker’s) context.  
     *Case:* If two evaluators agree on \( S \)’s evidence/track record, they shouldn’t disagree on "\( S \) knows \( p \)" based solely on their *own* stakes.  

  ---

  ### Your Three Cases as Litmus Tests  
  **Case 1: Same Evidence, Different Stakes**  
     - *Situation:* Alex and Blake have identical evidence for \( p \) ("Flight 307 is on time"). Alex bets $1; Blake bets their life savings.  
     - *Criterion:* Does Blake’s high stake *alone* negate knowledge?  
     - *Conflict:* **Practical Deliberation Anchor** (high stakes demand more justification) vs. **Evidence Constraint** (same evidence → same epistemic status).  

  **Case 2: Ignorant of High Stakes**  
     - *Situation:* Charlie has excellent evidence for \( p \) ("This bridge is safe"), but doesn’t know children will use it.  
     - *Criterion:* Can Charlie know \( p \) *without* being aware of the stakes?  
     - *Conflict:* **Epistemic Agency Preservation** (knowledge depends only on Charlie’s awareness) vs. **Practical Deliberation Anchor** (acting on \( p \) would be irresponsible).  

  **Case 3: Distributed Stakes**  
     - *Situation:* Each villager has strong evidence for \( p \) ("This dam is secure"), with personal stakes low. Collective stakes (town’s survival) are catastrophic.  
     - *Criterion:* Do individual knowledge attributions hinge on *aggregate* stakes?  
     - *Conflict:* **Attributor Context Neutrality** (knowledge shouldn’t depend on others’ stakes) vs. **Practical Deliberation Anchor** (acting collectively on \( p \) risks disaster).  

  ---

  ### Irreconcilable Tensions  
  - **Practical Relevance vs. Stability:**  
    Criteria 5 (Practical Deliberation) and 6 (Attributor Neutrality) conflict fundamentally. High-stakes cases (like Case 1) force a choice: either knowledge *is* sensitive to practical context (sacrificing stability), or it *isn’t* (sacrificing action-guidance).  
  - **Individualism vs. Collectivism:**  
    Case 3 exposes a rift: if knowledge is strictly individual (Criteria 2, 4), aggregate stakes *can’t* affect it. But if knowledge must rationalize *group* action (Criterion 5), individualism collapses.  

  ---

  ### Theories Scored Briefly  
  - **Classical Invariantism:**  
    ✓ Criteria 1–4, 6 (knowledge stable across stakes).  
    ✗ Fails **Practical Deliberation Anchor** (ignores that high stakes *do* affect whether we act "as if we know").  
    *Your cases:* Alex/Blake both know; Charlie knows; villagers know—even if acting would be reckless.  

  - **Contextualism/Interest-Relative Invariantism:**  
    ✓ Criteria 1–5 (stakes affect justification standards/truth-conditions).  
    ✗ Fails **Attributor Context Neutrality** (knowledge shifts with speaker/agent's stakes).  
    *Your cases:* Blake may not know (high stakes); Charlie knows (unaware stakes low); villagers may not know (collective stakes high).  

  **The tension is unavoidable:** No theory satisfies all criteria without compromising intuitions about action, stability, or individualism. Your prioritization of **Practical Deliberation Anchor** vs. **Attributor Context Neutrality** decides the camp.
