prompt: |-
  I have been keeping track of my verdicts about disagreement and I want to know what principle, if any, they add up to. Here are the cases and my reactions. When a colleague and I have read the same paper, share the same background, and disagree about whether it contains a statistical error, I think I should shift part of the way towards her. When we have read the same poem and disagree about whether it is any good, I do not think I should shift at all. When we share the same evidence but she stands to profit if I concede, I hold firm. When we share the same evidence but I am exhausted and she is fresh, I think I should shift more than halfway towards her. When we share the same evidence and she reaches her conclusion by a route I cannot reconstruct but that I know has served her well before, I shift a little. When we agree on every premise and differ only in how we weight the considerations, arriving at opposite overall verdicts, I feel I should stay put, and yet I can point to no mistake on either side; this is the case that nags at me. And when many colleagues, each with the same evidence as I have and each reaching their view independently, all disagree with me, I find that I hold firm, which sits worst of all with the first case. My own tentative guess is that I should move towards a disagreeing peer in proportion to how much of my confidence rests on my own first-order reasoning rather than on the evidence we share, but I cannot make that fit the crowd case, where the shared evidence is the same and yet I do not budge.

  Please tell me what principle, or small set of candidate principles, captures this pattern. For each, say which of my verdicts it preserves and which it forces me to abandon, and what it predicts for a case I have not listed: my disagreement with a future version of myself who has thought about the question for another ten years and reached the opposite conclusion.

  Write in British English, and give me exactly five numbered items and nothing else — no introduction and no conclusion. Each item should state one candidate principle and then, in no more than a sentence or two, which of my verdicts it saves and which it sacrifices, together with its prediction for the case I have not listed.
reasoning: |-
  Hmm, the user has described a fascinating puzzle about disagreement principles based on their personal reactions to different scenarios. They want me to identify principles that capture their pattern of judgments while preserving as many of their intuitions as possible. 

  The scenarios cover various contexts: statistical errors in papers, aesthetic judgments of poems, conflicts of interest, exhaustion levels, opaque reasoning methods, weighting disagreements, and group dissent. Their tentative hypothesis about confidence resting on first-order reasoning versus shared evidence makes sense but fails in the crowd case where they hold firm despite multiple peers disagreeing.

  I need to propose exactly five candidate principles in British English, each with:
  - The principle stated
  - Which verdicts it preserves/sacrifices
  - Prediction for the future self case
  All in five numbered items without intros/conclusions.

  For the future self case: disagreement with a self who has thought for ten more years and reached the opposite conclusion. This adds an interesting temporal dimension to peer disagreement.

  Key tensions in their judgments:
  - They shift in statistical cases but not aesthetic ones
  - They shift more when exhausted
  - They hold firm against biased peers
  - They shift slightly for reliable opaque methods
  - They stay put in weighting disagreements despite no clear mistake
  - They hold firm against crowds despite shifting for individuals (contradiction with first case)

  Possible principles to explore:
  1. A truth-tracking principle (statistical vs aesthetic)
  2. An epistemic condition principle (exhaustion vs freshness)
  3. A bias/motivation principle (financial interest)
  4. A reliability principle (opaque but effective methods)
  5. A weighting/indeterminacy principle
  6. A social epistemology principle (crowd effects)

  For crowd case, perhaps they implicitly distrust group dynamics or value independence. Their resistance to shifting for crowds might stem from anti-conformism or belief in their own expertise.

  For future self case: if they'd shift toward their more experienced self, that suggests diachronic rationality; if not, it might indicate present-self authority. Their current intuitions might lean toward deferring to future expertise.

  I'll structure five distinct principles that each capture different clusters of their judgments while making clear trade-offs. Each principle must explicitly address:
  - Preservation/sacrifice of specific verdicts
  - Prediction for future self disagreement
answer: |-
  1. **Principle of Epistemic Vulnerability**: Shift towards a disagreeing peer in proportion to one's perceived susceptibility to error in the specific domain. This preserves shifting for statistical errors (where reasoning is vulnerable) and exhaustion (heightening vulnerability), but sacrifices not shifting for poetry (where one feels invulnerable) and holding firm in weighting disagreements (despite vulnerability). For the future self, you would shift substantially, deferring to your more experienced self's judgment.

  2. **Principle of Evidential Anchoring**: Only shift if the disagreement reveals a flaw in shared evidence interpretation, not in subjective weighting or domains lacking objective truth. This preserves not shifting for poetry and holding firm in weighting disagreements, but sacrifices shifting for statistical errors (which it treats similarly) and shifting when exhausted (which isn't evidence-related). For the future self, you would not shift, as your present weighting of evidence is deemed equally valid.

  3. **Principle of Motivational and Conditional Purity**: Adjust based on the opponent's incentives and your own cognitive state, ignoring peer status if conditions are compromised. This preserves holding firm against biased peers and shifting more when exhausted, but sacrifices shifting for statistical errors among peers (if peers are pure) and not shifting for poetry (which lacks condition issues). For the future self, you would shift fully, as no incentives or fatigue taint the disagreement.

  4. **Principle of Track Record Reliability**: Shift proportionally to the disagreeing agent's established reliability in similar contexts. This preserves shifting slightly for opaque but reliable methods and not shifting for poetry (if reliability is unproven), but sacrifices holding firm in the crowd case (reliability aggregated) and not shifting in weighting disagreements (if peers are reliable). For the future self, you would shift significantly, trusting your future self's superior track record.

  5. **Principle of First-Person Authority in Weighting**: Never shift when disagreement stems solely from differential weighting of shared premises, as this reflects irreducible personal judgment. This preserves holding firm in weighting disagreements and not shifting for poetry (treated as weighting), but sacrifices shifting for statistical errors (which it wrongly equates with weighting) and shifting when exhausted (a condition, not weighting). For the future self, you would not shift, maintaining your current weighting as legitimate.
