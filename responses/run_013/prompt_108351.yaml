  **FOR IMMEDIATE RELEASE**  
  **International Board for Assertoric Standards (IBAS)**  
  Augustine Hall, Stagira • 2023-OCT-27  

  ---

  **IBAS ANNOUNCES RELEASE OF ASSERTORIC STANDARD v5.0: "CONTEXTUAL FIDELITY" FRAMEWORK ADOPTED AFTER DECADES OF COUNTEREXAMPLE-DRIVEN REVISIONS**  

  *The Gold Standard for What One Ought Properly to Say Evolves Amid Persistent "Edge Cases" and Board Dissent*  

  **STAGIRA, STAGIRA** – After a contentious 18-month review cycle marked by what Chair Emeritus Prof. A. Grice termed "empirical turbulence in the field," the International Board for Assertoric Standards (IBAS) today released **Standard for Proper Assertion v5.0 (SPA-5)**. This release supersedes SPA-4.1 (2018), which was deprecated following widespread non-conformance reports involving probabilistic reasoning scenarios. SPA-5 introduces a tiered, context-sensitive framework, acknowledging that earlier ambitions for a universal, monistic norm were "operationally unsustainable."  

  ---

  ### **REVISION HISTORY: A LEGACY OF FIELD FAILURES**  

  **SPA-1.0 (1987): The Truth Norm (TN)**  
  *"An assertion is proper only if the proposition asserted is true."*  
  **Recall Notice (1991):** Field audits revealed catastrophic non-conformance in "Blameless Misapprehension" scenarios (e.g., Assertor A, relying on meticulously maintained but subsequently recalibrated instruments, asserts "Reactor Core Temp is 300°C" – a false proposition, yet A remains entirely epistemically blameless). TN incorrectly flagged all such assertions as improper, violating the widely accepted "No Blame Without Fault" principle. Withdrawn.  

  **SPA-2.0 (1992): The Belief Norm (BN)**  
  *"An assertion is proper only if the asserter believes the proposition asserted."*  
  **Critical Patch SPA-2.1 (1995):** Attempted to resolve Moorean Paradox violations ("It's raining, but I don't believe it is"). SPA-2.1 introduced a "Simultaneity Clause" requiring belief *at the moment of utterance*.  
  **Recall Notice (1998):** Patch insufficient. "Moorean Recidivism" observed: Assertors could strategically time disavowals microseconds post-utterance. Further, BN permitted assertions based on utterly irrational belief (e.g., paranoid delusions), violating "Rational Responsibility" expectations. Withdrawn.  

  **SPA-3.0 (1999): The Knowledge Norm (KN)**  
  *"An assertion is proper only if the asserter knows the proposition asserted."*  
  **Field Advisory (2005):** Widespread non-conformance in "Lottery Contexts." Agents holding tickets in large, fair lotteries exhibit near-certain belief ("My ticket is a loser") but lack knowledge (due to salient, non-remote epistemic possibility of winning). KN incorrectly flagged assertions of "My ticket lost" (standardly deemed *awkward* but not *improper* pre-draw) as improper, while paradoxically permitting post-draw assertions of "My ticket won" (if true) despite identical pre-assertion justification. "Retroactive Conformance" issues noted.  
  **Recall Notice (2010):** Deemed non-salvageable after "Beneficial Lucky Guess" counterexamples: Assertor B, based on misunderstood astrological charts, asserts "The President is in Toronto." B does not know this, yet the assertion is true and proves crucial to thwarting an assassination attempt. KN improperly flags this life-saving assertion as defective. Withdrawn.  

  **SPA-4.0 (2011): The Justified Belief Norm (JBN)**  
  *"An assertion is proper only if the asserter justifiably believes the proposition asserted."*  
  **Patch SPA-4.1 (2018):** Refined "Justification" criteria to exclude "Gettiered" beliefs (justified true belief without knowledge).  
  **Recall Notice (2023):** Fundamental flaw exposed in "Retrospective Validation Paradox." Assertor C, based on compelling but ultimately misleading evidence (later revealed as fabricated), asserts "CEO is embezzling." C’s belief is justified at t1. At t2, independent proof emerges confirming the embezzling. SPA-4.1 rendered C's assertion proper at t1 *only because* the later proof emerged – making propriety contingent on future states, violating the "Aim Constraint" (agents cannot aim at future-dependent states at t1). Field agents reported paralyzing hesitation regarding assertions about unfolding events. Withdrawn.  

  ---

  ### **SPA-5.0: THE CONTEXTUAL FIDELITY FRAMEWORK**  

  Acknowledging the "multifarious nature of conversational ecosystems," SPA-5.0 abandons the quest for a singular necessary and sufficient condition. Instead, it adopts a multi-tiered system where propriety is determined by contextually operative standards:  

  | Tier             | Core Requirement                     | Typical Contexts                          | Propriety Threshold              |
  | :--------------- | :----------------------------------- | :---------------------------------------- | :------------------------------- |
  | **Platinum**     | Knowledge                            | Formal Testimony, Safety-Critical Claims | Strict Conformance               |
  | **Gold**         | Justified Belief (Non-Gettierable)   | Academic Discourse, Journalism            | High Conformance                 |
  | **Silver**       | Reasonable Grounds + Sincerity       | Everyday Conversation, Advisory           | Baseline Conformance             |
  | **Bronze**       | Sincerity + Low Stakes Relevance     | Casual Chat, Hypotheticals                | Minimal Conformance              |
  | **Tin (Provisional)** | Contribution to Common Ground        | Exploratory Dialogue, Brainstorming       | *See Pragmatist Dissent Note 5.3* |

  **Key Features:**  
  *   **Dynamic Context Sensing (DCS):** Agents must assess stakes, evidence availability, conversational goals, and domain-specific expectations.  
  *   **Retraction Protocols (RP):** Explicit procedures for downgrading/challenging assertions if higher-tier standards are invoked post-hoc.  
  *   **Moorean Safeguards:** Automatic flagging of assertions exhibiting simultaneous belief-disavowal for mandatory RP review.  

  ---

  ### **DISSENT & FOOTNOTES**  

  *   **Truth Faction Dissent (Annex 7a):** "SPA-5.0's tolerance for *false but Bronze-tier* assertions (e.g., 'The cafe is open,' asserted sincerely based on outdated observation) abandons the core function of assertion: conveying facts. Truth remains the *telos*, even if not the immediate norm."  
  *   **Knowledge Faction Dissent (Annex 7b):** "Tiering creates ambiguity. Does asserting 'The bridge is safe' in a safety meeting require Platinum or Gold? Lives depend on knowing the standard *in advance*. KN provided clarity."  
  *   **Justification Faction Note (Footnote 3.1):** "SPA-5.0's 'Reasonable Grounds' (Silver Tier) is dangerously underspecified. Justification is not merely 'reasonable'; it requires meeting domain-specific warrant criteria."  
  *   **Pragmatist Observation (Footnote 5.3):** "Assertion is fundamentally a proposal to update the conversational common ground. Propriety is primarily about felicity conditions for this update, not internal epistemic states. Challenges and retractions are not failures, but part of the cooperative mechanism. Tiering merely codifies different update strictures."  

  ---

  **Conclusion:**  
  SPA-5.0 represents the Board’s pragmatic recognition that the quest for a universal, timeless norm of assertion may be fundamentally misaligned with the diverse, dynamic nature of human discourse. "The map is not the territory," stated Chair Dr. E. Conversation. "We now provide a compass calibrated to context, not a single fixed path."  

  **Compliance Note:** The IBAS recognizes that portions of this announcement, particularly historical claims regarding withdrawn standards and assertions about Board deliberations, may not uniformly satisfy SPA-5.0 Platinum Tier requirements across all conceivable contexts. Regrettably, this is an operational necessity inherent in meta-assertoric discourse. Retraction protocols remain available upon formal request.  

  ---  
