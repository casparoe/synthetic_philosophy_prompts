prompt: |-
  I am convening an adversarial collaboration for a graduate seminar on the underdetermination of theory by evidence, and I want the joint statement the two parties could put their names to. The first holds that underdetermination is a local and transient feature of immature science, which further evidence and further ingenuity dissolve, so that it never threatens inference to the best explanation; the second holds that for any theory a rival can be constructed that agrees with it on every possible observation, so that theory choice is permanently underdetermined and agnosticism about unobservables is rationally required. They have now argued for a term without meeting.

  Write the document. Give me a numbered list of claims both can sign — which formulations of the thesis they agree are well-formed and non-trivial, what they agree the evidence does and does not fix, and what neither of them is asserting. Then the residual disagreements, each phrased in wording its own side would accept, marked as verbal or substantive with reasons. Then the cruxes, the sub-questions such that settling one would move at least one party, and a table giving, for each crux, the case or argument both agree bears on it and each side's prediction about how it comes out.

  Two items belong in the agreed section. First, both parties must address a constructed case: two theories that agree on every actual and every possible observation but differ over whether some unobservable quantity is continuous or discrete, with no observation able to distinguish them; they must say whether this is a genuine pair of rivals or one theory written down twice. Second, they must separate the reading on which a rival is actually constructed and compared from the reading on which the rival is merely unconceived, and say which, if either, the argument for permanent underdetermination establishes. My own hunch is that one crux is whether empirical equivalence relates theories or formulations of them, and that another is whether the demand that evidence alone determine theory choice is a substantive epistemic norm rather than a stipulation; have them say whether they accept these as cruxes.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration on the underdetermination of theory by evidence. The two parties are:
   Party A (Optimist): Believes underdetermination is local and transient, resolved by more evidence and ingenuity, never threatening inference to the best explanation (IBE).
   Party B (Skeptic): Believes that for any theory, a rival can be constructed that agrees on all possible observations, so theory choice is permanently underdetermined, requiring agnosticism about unobservables.

   The document must include:
   1. A numbered list of agreed claims (on well-formed theses, what evidence fixes, and what neither asserts).
   2. Residual disagreements, each phrased in wording acceptable to the respective side, marked as verbal or substantive with reasons.
   3. Cruxes (sub-questions that would move at least one party) and for each:
      - The case/argument both agree bears on it.
      - Each side's prediction.

   Additionally, two items for the agreed section:
     a. A constructed case: two theories agreeing on all actual and possible observations but differing on whether an unobservable is continuous or discrete. They must agree on whether this is a genuine pair of rivals or one theory twice.
     b. Separate the reading of the rival being actually constructed and compared vs. merely unconceived, and say which the argument for permanent underdetermination establishes.

   My hunch: two cruxes:
     Crux 1: Whether empirical equivalence relates theories or formulations of them.
     Crux 2: Whether the demand that evidence alone determine theory choice is a substantive epistemic norm or a stipulation.

   We must also have the parties say whether they accept these as cruxes.

   Structure:

   I. Agreed Claims

   II. Residual Disagreements

   III. Cruxes

   Let's begin.
answer: |-
  ### Joint Statement on the Underdetermination of Theory by Evidence  
  **Adversarial Collaboration Seminar**  
  *Signed by both parties*  

  This document outlines areas of agreement and residual disagreements between two positions on the underdetermination of theory by evidence. The first position ("Resolution Optimism") holds that underdetermination is a local, transient feature of immature science, resolvable through further evidence and ingenuity without threatening inference to the best explanation (IBE). The second position ("Permanent Underdetermination") holds that for any theory, an empirically equivalent rival can be constructed, rendering theory choice perpetually underdetermined and rational agnosticism about unobservables obligatory.  

  ---

  ### I. Agreed Claims  
  Both parties endorse the following non-trivial, well-formed theses and distinctions:  

  1. **Underdetermination Defined**: Underdetermination occurs when multiple theories account for all available evidence equally well, making theory choice non-unique on empirical grounds alone.  
  2. **Scope of Evidence**:  
     - Evidence fixes observable predictions and empirical content.  
     - Evidence *does not* directly fix the truth or falsity of claims about unobservable entities or structures (e.g., quantum wavefunction ontology, spacetime substantivalism).  
  3. **What Neither Asserts**:  
     - Neither position denies that evidence constrains theory choice *in practice* (e.g., through predictive accuracy).  
     - Neither asserts that underdetermination implies all theories are equally probable, true, or useful.  
  4. **Constructed Case (Continuous vs. Discrete Unobservable)**:  
     - *Scenario*: Two theories, T1 (claiming unobservable quantity X is continuous) and T2 (claiming X is discrete), agree on all actual and possible observations.  
     - *Verdict*: Both agree this is a **genuine pair of rivals**, not one theory "written twice." T1 and T2 represent distinct metaphysical commitments despite empirical equivalence.  
  5. **Rival Construction vs. Conceivability**:  
     - The argument for permanent underdetermination establishes that rivals can be *actually constructed* (e.g., via formal mappings like the "Ramsey sentence" method), not merely that they are *unconceived*.  
     - Both agree that the possibility of *unconceived rivals* (not yet formulated) does not, by itself, entail permanent underdetermination; the critical case requires demonstrably constructible equivalents.  

  ---

  ### II. Residual Disagreements  
  Phrased in each side’s preferred terminology and marked as verbal or substantive:  

  1. **Underdetermination’s Epistemic Threat**  
     - *Resolution Optimism (A)*: "Underdetermination is resolvable through IBE, which leverages explanatory virtues (e.g., simplicity, coherence) to break empirical ties, ensuring transient underdetermination poses no lasting barrier to knowledge."  
     - *Permanent Underdetermination (B)*: "Underdetermination is unresolvable because explanatory virtues are pragmatic, non-truth-conducive criteria; thus, agnosticism about unobservables is rationally inescapable."  
     - *Substantive*: Disagreement stems from conflicting views on whether IBE provides epistemic justification (A) or merely pragmatic utility (B).  

  2. **The Scope of Empirical Equivalence**  
     - *Resolution Optimism (A)*: "Empirical equivalence is theory-relative and dissolves when theories mature, as new evidence or conceptual refinement (e.g., unifying power) distinguishes rivals."  
     - *Permanent Underdetermination (B)*: "Empirical equivalence is absolute: for any theory, a rival agreeing on all possible observations is constructible, making underdetermination ineliminable."  
     - *Substantive*: Disagreement hinges on whether "further ingenuity" can *eliminate* (A) or only *reconfigure* (B) equivalence.  

  3. **Agnosticism Requirement**  
     - *Resolution Optimism (A)*: "Agnosticism is unwarranted; IBE licenses justifiable belief in the best explanation of evidence."  
     - *Permanent Underdetermination (B)*: "Agnosticism is mandatory; belief in unobservables exceeds what evidence can justify."  
     - *Verbal/Substantive Hybrid*: Partly verbal (dispute over "justification"), partly substantive (dispute over whether evidence alone can ground belief).  

  ---

  ### III. Cruxes  
  Sub-questions where resolution would shift at least one party’s position. Both parties accept Cruxes 1 and 2 as central.  

  | Crux | Shared Case/Argument | Resolution Optimism (A) Prediction | Permanent Underdetermination (B) Prediction |  
  |------|----------------------|-----------------------------------|--------------------------------------------|  
  | **1. Does empirical equivalence hold between *theories* or *formulations*?** <br> *Accepted by both as a crux.* | Case: Construct T* from T by replacing "continuous X" with "discrete X" while preserving all observational consequences via mathematical mapping. | Empirical equivalence is formulation-relative; T and T* are notational variants of one theory. Ingenuity reveals this, dissolving equivalence. | Empirical equivalence is theory-relative; T and T* are distinct theories (as agreed in §I.4), proving equivalence is robust and ineliminable. |  
  | **2. Is evidence’s inability to uniquely determine theory choice a *normative failure* or a *descriptive fact*?** <br> *Accepted by both as a crux.* | Argument: Analyze whether underdetermination violates an epistemic norm (e.g., "evidence must fix theory") or merely reflects science’s non-algorithmic nature. | Descriptive fact; IBE supplements evidence with extra-empirical criteria, fulfilling epistemic norms without requiring evidence to "fix" theory alone. | Normative failure; if evidence cannot break equivalence, no epistemic norm licenses belief in unobservables, making agnosticism obligatory. |  
  | **3. Can explanatory virtues break empirical ties?** | Case: Compare historical cases (e.g., Newtonian vs. Cartesian mechanics) where virtues like simplicity resolved underdetermination. | Yes; virtues are truth-conducive (e.g., via unification) and dissolve equivalence. | No; virtues are pragmatic and subjective (e.g., simplicity is context-dependent), leaving equivalence intact. |  
  | **4. Is permanent underdetermination compatible with scientific progress?** | Argument: Assess whether permanent underdetermination undermines progress (e.g., in predicting novel phenomena). | Incompatible; progress requires convergence on true theories, which equivalence blocks. | Compatible; progress concerns empirical adequacy, not truth about unobservables. |  

  ---  
  **Attestation**  
  Both parties affirm that this document fairly represents the agreed claims, disagreements, and cruxes after a term of deliberation.  

