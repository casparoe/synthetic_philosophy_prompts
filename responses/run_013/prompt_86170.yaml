  Now, is their burden-transfer theory truly novel? This is tricky. The liability framing feels fresh, but the core idea that assertion shifts responsibility isn't completely unprecedented. Some pragmatist approaches have similar flavors. Still, packaging it as "burden transfer" with dual liabilities (discursive/practical) seems original enough. Not just relabeling.

