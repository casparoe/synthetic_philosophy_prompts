prompt: |-
  I belong to a working group on animal and machine cognition, and we keep ending arguments with a slogan: ontogeny recapitulates phylogeny. It has become the group's all-purpose reason for thinking that nothing arrives late without having arrived early, and I want a careful inventory of what the sentence can actually mean before I let it keep doing that work. My suspicion is that the readings that are true are too weak to settle anything, and that the readings which would settle something are either false or are not really about recapitulation at all.

  Some background, so that the inventory is anchored in something concrete. We have spent the term on the four grades of mind that Dennett popularized. Grade one: a creature whose behavioural policies are fixed by natural selection across generations, so that it arrives with its policies built in and cannot revise them. Grade two: a creature that can also revise its policies within its own lifetime, by reinforcement, keeping what works. Grade three: a creature that can run the trials off-line, generating candidate hypotheses internally and discarding the bad ones in imagination rather than in action, so that its mistakes cost it nothing. Grade four: a mind equipped with culturally transmitted tools -- words, numerals, notations, and the practices that go with them -- so that its off-line trials are structured by equipment it did not invent, cannot fully inspect, and can hand on.

  Two episodes prompted this. First, someone in the group argued that a language model cannot be a grade-three reasoner at all, because it never passed through grade two. It never had to learn by consequence, in a body, with the costs falling on it; so whatever it does when it generates and rejects candidate answers is not the off-line version of a selection process it has actually run. Grade three, on this view, is grade two moved indoors, and one cannot have the indoor version of a process one has never run outdoors. The slogan was offered as the general law behind the inference: no skipping. Second, at dinner afterwards, a friend who teaches primary school made the same move about children -- you must drill them on getting answers right before you can teach them to reason hypothetically -- and cited the slogan again.

  What I want is the following.

  First, a numbered menu of the distinct, precise claims the slogan could be making, ordered from the near-vacuous to the strong, and stated so that each item is either clearly true or clearly false rather than blurry. I expect the useful distinctions to run along at least three axes -- whether the claim concerns an individual's development or a lineage's history; whether it asserts a temporal order of appearance or a relation of dependence; and whether it asserts a law or merely reports a contingent sequence -- and I would like the menu to make clear where each reading falls on all three. Somewhere in the list I want the reading under which the slogan is barely distinguishable from the platitude that later and more complex capacities are assembled out of earlier ones, and the reading under which it is the much stronger claim that the earlier stage is a necessary precondition of the later rather than merely its ancestor.

  Second, for each reading: whether it is trivial, substantive and defensible, dubious, or false; what sort of evidence would bear on it; and whether it is a claim about minds at all or only about bodies. The slogan began as a summary of a nineteenth-century embryological law that was abandoned in its literal form, and I want to know what survives of it, and what is merely carried along by the metaphor, when it is transplanted from embryos to minds.

  Third, the part I actually need: for each of the two episodes, which reading of the slogan would license the inference being drawn, and whether any reading does. If the grade-three argument survives in some form, say what its strongest version is once the slogan is replaced by the premise really doing the work -- I suspect that premise is a claim about scaffolding rather than about recapitulation, and that the word "recapitulates" is decoration. If the argument does not survive, say which of its premises fails and whether a weaker conclusion about language models, or about children, still goes through.

  Finally, tell me which reading the people who repeat this slogan almost certainly mean, and whether they are entitled to it. Please keep the whole thing as a numbered list I can take to the group, with the verdicts attached to each item rather than gathered at the end.
reasoning: |-
  We are dealing with the slogan "ontogeny recapitulates phylogeny" and its application to cognition. The task is to break down possible precise interpretations, evaluate them, and apply to two episodes.

  Background: The four grades of mind from Dennett:
  - Grade 1: Fixed behaviors by natural selection (built-in, cannot revise).
  - Grade 2: Can revise behaviors within lifetime by reinforcement (learning from consequences).
  - Grade 3: Off-line trials (hypothesis testing in imagination, no cost).
  - Grade 4: Cultural tools (language, notations) that structure off-line trials.

  Episodes:
  1. Argument that a language model (LM) cannot be grade 3 because it skipped grade 2 (never learned by consequence in a body).
  2. Similar argument for children: must drill (grade 2-like) before teaching hypothetical reasoning (grade 3).

  We need:
  - A numbered list of distinct claims the slogan could make, ordered from weak to strong, with each clear enough to be true/false.
    - Axes: individual vs. lineage; temporal order vs. dependence; law vs. contingent.
  - For each claim: trivial/defensible/dubious/false; evidence; whether about minds or bodies.
  - For each episode: which reading would license the inference, and if any does; if not, why; if a weaker conclusion holds.
  - Which reading people probably mean and if they are entitled.

  The slogan originally in embryology (Haeckel): embryonic development repeats evolutionary history. Abandoned in strict form.

  Let's build the menu of readings.

  First, note: "ontogeny" = development of an individual organism; "phylogeny" = evolutionary history of the lineage.

  Possible interpretations:

  1. **Literal recapitulation (embryological, abandoned):** The stages of embryonic development (ontogeny) directly mirror the adult forms of evolutionary ancestors (phylogeny). E.g., human embryo has gill slits like fish.

     But this is false for embryology and not directly applicable to minds.

  2. **Metaphorical extension to cognition:** The development of cognitive capacities in an individual (ontogeny) recapitulates the evolutionary history of those capacities in the lineage (phylogeny).

     But we need precision.

  We can break down along axes:

  Axis 1: Scope
  - (A) About physical development (body)
  - (B) About cognitive development (mind)

  Axis 2: Temporal order vs. dependence
  - (T) The sequence of stages in ontogeny follows the same order as in phylogeny.
  - (D) Earlier stages (in ontogeny or phylogeny) are necessary preconditions for later ones.

  Axis 3: Modality
  - (L) Law-like: must happen this way (necessary, universal).
  - (C) Contingent: happens to occur this way in actual cases, but not necessarily.

  Also, strength: from weak (e.g., just some similarity) to strong (strict sequence with necessity).

  Let's list precise claims. We'll focus on cognition since the context is minds, but include body for comparison.

  **Menu of Claims:**

  1. **Weak similarity (contingent, temporal order for lineage):** In the actual history of life, simpler cognitive capacities (e.g., grade 1) evolved before more complex ones (e.g., grade 2, then 3, then 4). Similarly, in individual cognitive development, simpler capacities (e.g., reflexes) appear before more complex ones (e.g., learning, then reasoning). But this is a contingent fact and not necessarily true in all cases.

     - Scope: Both phylogeny and ontogeny of cognition.
     - Temporal order: Yes, but only that earlier stages come first, not that they are identical.
     - Dependence: Not claimed; just sequence.
     - Modality: Contingent.
     - Truth: For phylogeny, broadly true (though not strict: e.g., some lineages may have lost complexity). For ontogeny, true for basic capacities (e.g., infants have reflexes before learning), but less clear for higher cognition (e.g., children might engage in imaginative play early, which is grade 3-like, without extensive grade 2 drilling). Dubious for strict sequence of Dennett's grades in ontogeny.
     - Evidence: Fossil record, comparative biology for phylogeny; developmental psychology for ontogeny.
     - About minds: Yes.

  2. **Strong recapitulation (law-like, temporal order):** The sequence of cognitive stages in every individual's development must exactly mirror the sequence of evolutionary stages in the lineage. E.g., an individual must go through a stage equivalent to grade 1 (fixed), then grade 2 (reinforcement learning), then grade 3 (off-line), then grade 4 (cultural tools), in that order, without skipping.

     - Scope: Cognition, with a mapping between ontogenetic stages and phylogenetic ones.
     - Temporal order: Strict sequence, same order.
     - Dependence: Not necessarily, but the order is fixed.
     - Modality: Law-like (must happen).
     - Truth: False. There is no evidence that individual cognitive development must recapitulate evolutionary history in this strict sense. For example, human children do not go through a stage of being like a reptile or a bird cognitively. Moreover, in development, stages can overlap or be reorganized. The Dennett grades are not strict stages in either phylogeny or ontogeny.
     - Evidence: Counterexamples: e.g., human infants show some grade 3 capacities (like pretend play) early, without an extended period of only grade 1 and 2. Also, in artificial systems (like AI), we can build grade 3 without grade 2.
     - About minds: Yes.

  3. **Dependence without recapitulation (law-like, not necessarily temporal order):** The earlier cognitive capacities (e.g., grade 1 and 2) are necessary preconditions for the development of later ones (e.g., grade 3 and 4) in an individual. Without having the lower grades, one cannot develop the higher ones. This does not require that the sequence mirrors phylogeny.

     - Scope: Individual cognitive development.
     - Temporal order: Not required; dependence is key.
     - Dependence: Yes, earlier capacities are necessary for later ones.
     - Modality: Law-like (necessary).
     - Truth: Substantive and defensible for some cases, but not universal. For example, some basic learning (grade 2) might be necessary for building internal models (grade 3). However, it may be possible to have grade 3 without grade 2 in artificial systems. Also, in children, some higher functions might develop even with impairments in lower grades (e.g., savants). Dubious as a strict law.
     - Evidence: Developmental disorders: if a child lacks grade 2 capacities, can they develop grade 3? Also, AI: can we build a system that does off-line reasoning without ever having learned by reinforcement? In machine learning, we have systems that do reasoning without embodied reinforcement (e.g., language models trained on text, which is a form of cultural transmission, skipping embodied trial and error).
     - About minds: Yes.

  4. **Phylogenetic constraint (law-like, dependence for lineage):** The evolutionary history constrains possible ontogenies. That is, the sequence in which capacities evolved sets limits on how they can develop in an individual. For example, because grade 2 evolved before grade 3, it is necessary for grade 3 to build upon grade 2 in ontogeny.

     - Scope: Interaction between phylogeny and ontogeny of cognition.
     - Temporal order: Not direct recapitulation, but dependence via evolutionary history.
     - Dependence: Phylogeny sets constraints on ontogeny.
     - Modality: Law-like.
     - Truth: Dubious. While evolution does constrain development (e.g., through genetics), it does not follow that the phylogenetic sequence must be recapitulated. Moreover, evolution can repurpose structures, so new capacities might not require the same sequence. In cognition, the brain's plasticity allows for various developmental paths.
     - Evidence: Evo-devo research; but cognition is highly flexible. Counterexample: in AI, we can create grade 3 without going through phylogenetic stages.
     - About minds: Yes, but mediated by biology.

  5. **Scaffolding (contingent, dependence):** In actual cognitive development, lower-grade capacities serve as scaffolds for higher-grade ones. For example, reinforcement learning (grade 2) provides the foundation for developing off-line reasoning (grade 3) by providing the content and value signals that the internal model uses. But this is a functional dependence, not a recapitulation of history.

     - Scope: Individual cognitive development.
     - Temporal order: Not necessarily, but often earlier capacities are used to build later ones.
     - Dependence: Functional dependence: higher capacities build on lower ones.
     - Modality: Contingent (it happens to be efficient, but not necessary).
     - Truth: Defensible in many cases, but not universal. For example, in children, learning from consequences might help build internal models. But in AI, language models use patterns from data (which might be seen as cultural, grade 4) without personal reinforcement (grade 2).
     - Evidence: Developmental psychology showing how skills build on each other; but also cases of atypical development where scaffolding is different.
     - About minds: Yes.

  6. **Platitudinous compositionality (trivial):** More complex cognitive capacities are composed of simpler ones. Therefore, in development, the simpler parts must be in place before the complex whole can function. This does not imply recapitulation of phylogeny.

     - Scope: Any complex system, including minds.
     - Temporal order: Simpler before complex, but not necessarily in a sequence mirroring evolution.
     - Dependence: Trivially, you need the parts to have the whole.
     - Modality: Logical necessity.
     - Truth: Trivial and true. But too weak to support the inferences in the episodes because it doesn't specify which simpler capacities are needed. For example, grade 3 might be built from different parts than grade 2.
     - Evidence: Logic of composition.
     - About minds: Yes, but not specific.

  Now, let's apply to the episodes.

  **Episode 1: Language model cannot be grade 3 without grade 2.**

  The argument: LM skipped grade 2 (learning by consequence in a body), so it cannot have genuine grade 3.

  Which reading would license this?

  - Reading 2 (strong recapitulation): If true, then LM must have passed through grade 2 to have grade 3. But reading 2 is false, so not licensed.
  - Reading 3 (dependence): If grade 2 is necessary for grade 3, then without it, no grade 3. But is grade 2 necessary? In the case of LM, it has been trained on text, which records the consequences of actions (others' experiences) but not its own embodied consequences. It might simulate grade 3 without having experienced grade 2 personally. The necessity of embodied grade 2 is dubious. Evidence from AI: language models can generate and reject candidate answers (grade 3-like) without reinforcement learning in a body. So, reading 3 is not clearly true and may be false for this case.
  - Reading 5 (scaffolding): Grade 2 scaffolds grade 3, but LM uses text as a scaffold (which might be seen as cultural, grade 4). So, it has a different scaffold. Thus, the argument does not hold because scaffolding can be different.

  Strongest version of the argument without recapitulation: The functional capacities of grade 3 (e.g., simulating outcomes) require having experienced the kind of feedback that grade 2 provides, because that feedback is what gives meaning to the simulation. Without having learned from consequences, the internal model has no content or value system. But in LM, the content and values are derived from the training data, which includes human experiences of consequences. So, it might be that the LM is leveraging the cultural record (grade 4) to bypass personal grade 2. Therefore, the argument might be weakened: perhaps LM's grade 3 is not as robust as a human's, but it can still perform the function. Alternatively, in a strict sense, if grade 3 is defined as the off-line version of a selection process one has actually run (as per the argument), then LM has not run that process. But that definition might be too narrow.

  Conclusion for episode 1: The inference does not go through on any recapitulation reading. The premise that grade 3 requires having passed through grade 2 is not supported by recapitulation and is questionable. A weaker conclusion: LM's off-line reasoning may lack some features (e.g., grounding in personal experience) but can still function.

  **Episode 2: Children must drill (grade 2) before reasoning hypothetically (grade 3).**

  The argument: Drill (practicing with feedback) is necessary before hypothetical reasoning.

  Which reading?

  - Reading 3 (dependence): Grade 2 capacities are necessary for grade 3. This is defensible for children in many domains. For example, in mathematics, practicing arithmetic (grade 2-like) might be necessary before doing hypothetical proofs (grade 3). But it's not universal; children engage in pretend play (grade 3) without formal drilling. Also, in education, some approaches (like discovery learning) might build grade 3 without extensive drilling.
  - Reading 5 (scaffolding): Drilling provides the foundation. This is often true but not absolute.

  However, the slogan is not necessary; it's about functional dependence, not recapitulation.

  Evidence: In education, there is debate. Direct instruction (drill) can be efficient for building foundational skills, but excessive drill might not be necessary for all children. Moreover, children develop hypothetical reasoning naturally through play and conversation.

  Weaker conclusion: For some skills, especially formal ones, drilling might be helpful or even necessary, but not for all cognitive development.

  **Which reading do people probably mean?**

  In the context of the group, they likely mean a strong version of dependence (reading 3): that earlier stages are necessary preconditions for later ones, so you can't skip. They might also have in mind scaffolding (reading 5). They are not entitled to the strong recapitulation (reading 2), which is false. The dependence claim (reading 3) is defensible in some cases but not universally, especially when applied across different types of systems (biological vs. artificial).

  **Final numbered list with verdicts:**

  1. **Weak similarity (contingent sequence):** 
     - Claim: In actual evolution and individual development, simpler cognitive capacities tend to appear before more complex ones, but this is contingent and not strict.
     - Truth: Broadly true for both phylogeny and ontogeny in basic capacities, but not for higher cognition in a strict sequence like Dennett's grades. Defensible.
     - Evidence: Comparative biology and developmental psychology.
     - About minds: Yes.
     - For episodes: Too weak to support the inferences because it allows for exceptions and does not require that an individual must pass through each stage.

  2. **Strong recapitulation (law-like temporal order mirroring phylogeny):**
     - Claim: The sequence of cognitive stages in every individual's development must exactly follow the sequence of evolutionary stages (e.g., grade 1, then 2, then 3, then 4).
     - Truth: False. No evidence for this strict mapping; development is more flexible and does not recapitulate phylogeny in cognition.
     - Evidence: Counterexamples in development (e.g., early pretend play) and AI (building grade 3 without grade 2).
     - About minds: Yes.
     - For episodes: If used, it would license the inferences, but it is false, so not entitled.

  3. **Dependence without recapitulation (law-like necessity of lower grades for higher in ontogeny):**
     - Claim: Having lower-grade capacities (e.g., grade 2) is a necessary precondition for developing higher-grade ones (e.g., grade 3) in an individual.
     - Truth: Substantive but dubious as a universal law. It may hold in some cases (e.g., for certain skills) but not all. For instance, grade 3 might be achievable through alternative paths (e.g., cultural transmission in LM). Defensible in biology but not necessarily for AI.
     - Evidence: Developmental disorders and AI as test cases. In humans, impairments in learning might hinder reasoning, but not always. In AI, counterexample: language models.
     - About minds: Yes.
     - For episodes: 
       - Episode 1: Would license the inference if true, but evidence from AI suggests it may not hold. Thus, the inference is questionable.
       - Episode 2: Might support the need for drilling (as grade 2) for some formal skills, but not universally.

  4. **Phylogenetic constraint (evolutionary history constrains development):**
     - Claim: The sequence in which cognitive capacities evolved (phylogeny) sets constraints such that ontogeny must follow a similar sequence (e.g., because grade 2 evolved before grade 3, it must be the foundation in development).
     - Truth: Dubious. Evolution can allow for various developmental paths. Not supported for cognition.
     - Evidence: Evo-devo shows flexibility; AI counterexamples.
     - About minds: Yes, via biology.
     - For episodes: Too vague to directly license the inferences; and not well-supported.

  5. **Scaffolding (contingent functional dependence):**
     - Claim: In actual development, lower-grade capacities (like grade 2) often serve as scaffolds for building higher-grade ones (like grade 3), but this is not necessary and other scaffolds are possible.
     - Truth: Defensible in many human cases, but not universal.
     - Evidence: Developmental psychology; education research.
     - About minds: Yes.
     - For episodes:
       - Episode 1: Does not license the inference because LM uses a different scaffold (cultural data).
       - Episode 2: Supports that drilling might be useful scaffolding for some children in some domains, but not that it is strictly necessary.

  6. **Platitudinous compositionality (trivial):**
     - Claim: More complex capacities are made of simpler ones; thus, the simpler must precede or be part of the complex.
     - Truth: Trivial and true.
     - Evidence: Logic.
     - About minds: Yes, but too general.
     - For episodes: Too weak to support the specific inferences about skipping grades, because it doesn't specify which simpler capacities are required (e.g., grade 3 might not require the same simpler capacities as grade 2).

  **Overall verdict for the group:**
  The slogan is being used to mean dependence (reading 3) or scaffolding (reading 5). However, in the case of language models, reading 3 is not clearly true, and reading 5 allows for alternative scaffolds. For children, dependence and scaffolding are more plausible but not absolute. The recapitulation part (readings 2 and 4) is not supported. Therefore, the slogan should not be used as a universal argument against skipping stages. Instead, each case should be evaluated based on functional and causal dependencies.

  Final note: The people repeating the slogan almost certainly mean a version of dependence (reading 3) and are not entitled to it as a universal law, especially when applied to non-biological systems.
answer: |-
  Below is a carefully constructed numbered menu of distinct, precise claims that the slogan "ontogeny recapitulates phylogeny" could make, ordered from weakest/most vacuous to strongest. Each claim is evaluated for truth status, type of evidence, relevance to minds vs. bodies, and applicability to the two episodes (language models and children's education). The evaluations are attached to each item. The axes of distinction are:

  - **Individual vs. Lineage**: Whether the claim concerns the development of a single organism (ontogeny) or the evolutionary history of a lineage (phylogeny).
  - **Temporal Order vs. Dependence**: Whether the claim asserts a sequence of stages (A before B) or a necessary precondition (A required for B).
  - **Law vs. Contingent**: Whether the claim is a universal law (must happen) or a contingent pattern (happens to occur in practice).

  The claims are designed to be clear enough to be true or false, not blurry. After the menu, I address what people likely mean by the slogan and whether they are entitled to it.

  ---

  ### **Numbered Menu of Claims**

  1. **Weak Compositionality (Trivial Parts-to-Whole)**  
     *Claim*: In individual development (ontogeny), later and more complex cognitive capacities are assembled from earlier and simpler ones, but this does not imply any similarity to evolutionary history (phylogeny). It is a general fact about building complex systems from components.  
     - **Individual vs. Lineage**: Individual development only (ontogeny).  
     - **Temporal Order vs. Dependence**: Dependence (simpler parts are necessary for complex wholes), but no fixed temporal sequence.  
     - **Law vs. Contingent**: Law-like (logical necessity; complex systems require components).  
     - **Truth Status**: Trivial and true. This is a platitude about how complexity arises.  
     - **Evidence**: Logic of composition (e.g., you need basic arithmetic before algebra). Evidence from engineering or biology is superfluous; it's self-evident.  
     - **Relevance to Minds**: Yes, but only trivially. Applies to any system, including minds and bodies.  
     - **Episode 1 (Language Models)**: Does not license the inference. A language model could be "assembled" from any components (e.g., data patterns), not necessarily grade-2 capacities.  
     - **Episode 2 (Children)**: Does not license the inference. Reasoning hypothetically could be assembled from many simpler parts (e.g., innate biases or cultural inputs), not just drilling.

  2. **Contingent Sequence in Phylogeny (Evolutionary Trend)**  
     *Claim*: In the evolutionary history of a lineage (phylogeny), simpler cognitive capacities (e.g., Dennett's grade 1) tend to appear before more complex ones (e.g., grade 4) in actual biological history, but this is not a universal law and does not constrain individual development.  
     - **Individual vs. Lineage**: Lineage only (phylogeny).  
     - **Temporal Order vs. Dependence**: Temporal order (A before B), not dependence.  
     - **Law vs. Contingent**: Contingent (observed pattern, not necessary).  
     - **Truth Status**: Substantive and defensible for many lineages. Grade 1 behaviors (fixed instincts) evolved before grade 2 (learning) in simple animals, and grade 3–4 may be later. But exceptions exist (e.g., loss of complexity in parasites).  
     - **Evidence**: Fossil record, comparative biology (e.g., learning rare in insects, common in mammals).  
     - **Relevance to Minds**: Yes, specifically about cognition in evolutionary history.  
     - **Episode 1 (Language Models)**: Does not license the inference. Phylogenetic sequence does not dictate how an AI must be built.  
     - **Episode 2 (Children)**: Does not license the inference. Children's development isn't bound by evolutionary history.

  3. **Contingent Sequence in Ontogeny (Developmental Trend)**  
     *Claim*: In individual development (ontogeny), simpler cognitive capacities (e.g., reflexes) tend to appear before more complex ones (e.g., abstract reasoning) in actual humans, but this is not a universal law and does not recapitulate phylogeny.  
     - **Individual vs. Lineage**: Individual development only (ontogeny).  
     - **Temporal Order vs. Dependence**: Temporal order (A before B), not dependence.  
     - **Law vs. Contingent**: Contingent (observed pattern, not necessary).  
     - **Truth Status**: Substantive and defensible for basic capacities (e.g., infants show grade-1 reflexes before grade-2 learning). Dubious for Dennett's grades: Children exhibit grade-3 capacities (e.g., pretend play) early without prolonged grade-2 drilling.  
     - **Evidence**: Developmental psychology (e.g., Piagetian stages show sequences, but not strict or universal).  
     - **Relevance to Minds**: Yes.  
     - **Episode 1 (Language Models)**: Does not license the inference. A language model's "development" (training) need not follow human sequences.  
     - **Episode 2 (Children)**: Weakly supports drilling first but does not require it. Reasoning hypothetically can emerge early without drilling.

  4. **Contingent Recapitulation (Similarity of Sequence)**  
     *Claim*: The sequence of cognitive stages in individual development (ontogeny) often resembles the sequence in evolutionary history (phylogeny) due to shared constraints, but this is not strict or necessary. (This is the closest to the original embryological idea, now metaphorical.)  
     - **Individual vs. Lineage**: Both (ontogeny and phylogeny).  
     - **Temporal Order vs. Dependence**: Temporal order (A before B in both), not dependence.  
     - **Law vs. Contingent**: Contingent (similarity happens, not required).  
     - **Truth Status**: Dubious for cognition. While basic sensory-motor stages may show parallels (e.g., early reflexes mirroring ancestral traits), higher cognition does not (e.g., no "reptilian cognition" stage in children). False as a universal claim.  
     - **Evidence**: Mixed: Embryology shows some parallels (e.g., gill slits in human embryos), but cognitive neuroscience finds no such recapitulation.  
     - **Relevance to Minds**: Partially (originally about bodies, extended metaphorically to minds).  
     - **Episode 1 (Language Models)**: Does not license the inference. Contingent similarity does not imply skipping is impossible.  
     - **Episode 2 (Children)**: Does not license the inference. Resemblance to phylogeny is not a constraint.

  5. **Scaffolding Dependence (Functional Precondition)**  
     *Claim*: In individual development (ontogeny), lower-grade cognitive capacities (e.g., grade 2) are often functional preconditions for higher-grade ones (e.g., grade 3), meaning they provide the scaffolding (e.g., data, skills) that makes later capacities possible. However, this is not about recapitulating phylogeny, and alternatives may exist.  
     - **Individual vs. Lineage**: Individual development only (ontogeny).  
     - **Temporal Order vs. Dependence**: Dependence (A required for B), not strict temporal order.  
     - **Law vs. Contingent**: Contingent (common but not universal; depends on the system).  
     - **Truth Status**: Substantive and defensible for humans. Grade-2 learning (e.g., trial-and-error) provides feedback that scaffolds grade-3 simulation (e.g., predicting outcomes). But not absolute: Grade 3 can emerge from other scaffolds (e.g., innate structures or cultural inputs).  
     - **Evidence**: Developmental psychology (e.g., sensorimotor experience scaffolds symbolic thought in children). AI research shows reinforcement learning can scaffold reasoning, but alternatives exist.  
     - **Relevance to Minds**: Yes.  
     - **Episode 1 (Language Models)**: Does not fully license the inference. A language model uses cultural data (grade 4) as a scaffold for off-line reasoning, bypassing embodied grade 2. Thus, skipping is possible.  
     - **Episode 2 (Children)**: Licenses a weaker inference: Drilling (grade 2) may be helpful or efficient for some reasoning skills, but not strictly necessary (e.g., play-based learning can build grade 3 directly). Strongest version: For certain skills, grade 2 scaffolds grade 3.

  6. **Phylogenetic Constraint (Evolved Dependence)**  
     *Claim*: The evolutionary history of a lineage (phylogeny) constrains individual development (ontogeny) such that earlier-evolved capacities (e.g., grade 1 or 2) are necessary preconditions for later-evolved ones (e.g., grade 3 or 4) in individuals. This is due to evolved developmental mechanisms.  
     - **Individual vs. Lineage**: Both (phylogeny constrains ontogeny).  
     - **Temporal Order vs. Dependence**: Dependence (A required for B), with implied temporal order from evolution.  
     - **Law vs. Contingent**: Law-like (biological necessity).  
     - **Truth Status**: False. While evolution shapes development (e.g., via genetics), cognitive plasticity allows skipping or reorganization (e.g., humans can develop theory of mind without strict stage progression). AI counterexamples show capacities like grade 3 can be built without phylogeny.  
     - **Evidence**: Evo-devo biology shows constraints in bodies (e.g., limb development), but not for cognition. Counterevidence: Atypical development (e.g., savants) and AI.  
     - **Relevance to Minds**: Yes, but unsupported.  
     - **Episode 1 (Language Models)**: Would license the inference if true, but false. No phylogenetic constraint on AI.  
     - **Episode 2 (Children)**: Would license the inference if true, but false. Children can develop hypothetical reasoning without prior drilling.

  7. **Strong Recapitulation (Necessary Precondition with Sequence)**  
     *Claim*: In individual development (ontogeny), earlier cognitive stages must exactly mirror the sequence of evolutionary stages (phylogeny), and each stage is a necessary precondition for the next (e.g., grade 1 → grade 2 → grade 3 → grade 4). Skipping any stage is impossible.  
     - **Individual vs. Lineage**: Both (ontogeny recapitulates phylogeny).  
     - **Temporal Order vs. Dependence**: Both (temporal order and dependence).  
     - **Law vs. Contingent**: Law-like (necessary and universal).  
     - **Truth Status**: False. Abandoned in embryology and unsupported for cognition. Children show grade-3 capacities (e.g., imagination) without extensive grade-2 experience, and AI achieves grade 3 without grade 2.  
     - **Evidence**: Embryology disconfirms strict recapitulation. Cognitive science shows flexible development.  
     - **Relevance to Minds**: Originally about bodies, extended to minds; false for both.  
     - **Episode 1 (Language Models)**: Would license the inference if true, but false. Language models can skip.  
     - **Episode 2 (Children)**: Would license the inference if true, but false. Drilling is not necessary.

  ---

  ### **Summary for the Episodes**
  - **Episode 1 (Language Models)**:
    - No reading of the slogan licenses the inference that a language model cannot be grade 3 without grade 2. 
    - The strongest defensible version of the argument replaces recapitulation with **scaffolding dependence (Claim 5)**: Grade-3 reasoning may be more robust if scaffolded by grade-2 learning, but language models use cultural data (grade 4) as an alternative scaffold. Thus, skipping embodied grade 2 is possible, though the resulting grade 3 may lack features like personal consequence-sensitivity. The inference fails because the premise (grade 2 is necessary) is not universally true.
    - Weaker conclusion: A language model's off-line reasoning may be shallower or less grounded than that of an embodied agent, but it can still function as grade 3.

  - **Episode 2 (Children)**:
    - No reading licenses the strong inference that drilling (grade 2) is strictly necessary before hypothetical reasoning (grade 3). 
    - The strongest defensible version uses **scaffolding dependence (Claim 5)**: For some skills (e.g., math), drilling may be an efficient scaffold for later reasoning, but it is not universally required. Children develop grade-3 capacities (e.g., pretend play) without drilling. The inference fails because the premise (drilling is necessary) is overgeneralized.
    - Weaker conclusion: Drilling can be a useful pedagogical tool for foundational skills, but it is not the only path to grade 3.

  ---

  ### **What People Mean and Whether They Are Entitled to It**
  - **What people almost certainly mean**: A blend of **scaffolding dependence (Claim 5)** and **phylogenetic constraint (Claim 6)**, implying that lower-grade capacities (like grade 2) are necessary preconditions for higher-grade ones (like grade 3) in individual development, often with an implicit appeal to evolution. This is motivated by intuition: "You must walk before you run."
  - **Are they entitled to it?** No. 
    - Claim 5 is contingent and allows alternatives (e.g., cultural scaffolding), so it cannot support universal inferences about skipping.
    - Claim 6 is false, as evolution does not rigidly constrain cognitive development.
    - The slogan is deceptive here: It smuggles in a false recapitulation claim (from embryology) to support what is really a claim about functional dependence. The word "recapitulates" is decorative and misleading; the core argument is about scaffolding, which is context-dependent, not a law.

  ### **Recommendation for the Group**
  Abandon the slogan. It conflates weak truths (e.g., scaffolding) with false claims (e.g., recapitulation), leading to overgeneralized arguments. Instead, focus on specific, testable claims about functional dependence (e.g., "Does reinforcement learning scaffold off-line reasoning in this system?"). For language models, the absence of embodied grade 2 may limit certain aspects of reasoning but does not preclude grade 3. For children, drilling is one pedagogical tool among many. Use evidence from cognitive science, AI, and education—not nineteenth-century metaphors.
