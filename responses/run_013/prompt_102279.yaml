prompt: |-
  I've been sorting through the regularities around me, case by case, trying to decide which count as conventions, and I want to know what principle my verdicts add up to.

  Everyone in my country driving on the right: a convention. The village path everyone takes across the field because it is simply the driest route, and they would take it whether or not anyone else did: not a convention. QWERTY: a convention, even though a better layout exists, because switching alone would only make things worse for the switcher. A rule of keeping promises: a convention, I think, though it sits more heavily on me than the road case does. A regularity that holds only because the police fine violators, and that would dissolve overnight if enforcement stopped: not a convention. Two strangers on a narrow sidewalk each stepping to the same side to get past the other: not a convention, since it is a one-off rather than a standing practice. Using money: a convention. A community's habit of not eating with the left hand, which each member would keep up even if no one else did, out of sheer discomfort: not a convention.

  Two of these pull against each other, and I can't tell which to give up. Driving on the right is backed by law, yet I count it a convention, while the police-sustained regularity I don't — so whatever is doing the work cannot be enforcement. And promise-keeping I count a convention even though its grip on me doesn't seem to depend on others' conformity the way the road case does.

  Is there a single principle that gets all of these, or nearly all? What does it say about a regularity that began as coordination among a few people and spread by precedent until it became common knowledge — does how it spread matter to whether it is a convention? And which of my verdicts does the principle force me to abandon?
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're trying to distinguish conventions from other regularities. They've listed several examples and their verdicts, but two cases seem conflicting: driving on the right (which they call a convention despite legal enforcement) versus a police-enforced rule (which they don't consider a convention). Also, promise-keeping is tricky because its moral weight seems different from something like driving side.

  First, I need to recall David Lewis's definition of convention. Conventions are solutions to coordination problems where people prefer to coordinate because it benefits everyone, and they know others follow it too. The regularity persists because individuals conform expecting others to, and prefer to if others do. 

  Looking at the user's examples: Driving on the right fits. Even with laws, the core is coordination—people follow it expecting others to, and switching alone would be bad. The police-enforced rule dissolves without enforcement, so it's not mutual expectation but fear of penalty. That's coercion, not convention. 

  The village path isn't a convention because each person uses it independently for dryness, not relying on others' actions. QWERTY is classic convention—sticking to it due to others' usage. Promise-keeping is interesting. The user feels it's a convention but with moral weight. Lewis would see it as a convention because it solves coordination in trust, but its moral aspect might make it different. Still, the expectation of others keeping promises reinforces individual compliance. 

  The sidewalk stepping isn't a standing practice, so not a convention. Money usage is convention—worthless without others accepting it. Left-hand eating habit isn't convention because individuals do it regardless of others. 

  The conflict between driving with laws and police-enforced rule: laws might exist, but the driving convention works because of mutual expectations. If laws disappeared, people might still follow it to avoid chaos. The police case relies solely on punishment, not mutual benefit. So enforcement isn't the key; it's about the reason for conformity. 

  For promise-keeping, the user might be conflating moral obligation with convention. Lewis argues that the convention aspect is the mutual expectation, even if there's also morality. So both can coexist. 

  The spreading mechanism: if a regularity starts via precedent and becomes common knowledge, it fits Lewis's view. How it spreads matters only if it leads to mutual expectations and preference for conformity. 

  Possible missteps: The user's left-hand eating example. If individuals act from personal discomfort, not others' expectations, it's not convention. But if they also care about others' disapproval, it might have a conventional element. The user needs to check the underlying reasons. 

  Abandoning verdicts? Probably the promise-keeping one if they insist it's purely moral, but Lewis includes it. The police-enforced rule is correctly excluded. The sidewalk stepping is correctly not a convention. 

  So the core principle is mutual expectations and preference for conformity due to coordination. Enforcement or personal reasons alone don't make a convention.
answer: |-
  Based on your examples and the tension you identify, the unifying principle aligning *most* of your verdicts is **David Lewis's definition of convention** (from *Convention: A Philosophical Study*). Here's the principle and its application:

  **Lewisian Principle of Convention:**
  A regularity *R* in the behavior of a group *P* is a convention *if and only if*:
  1.  **Coordination Problem:** *R* is a solution to a recurrent coordination problem within *P* (each member prefers to coordinate their behavior with others, and multiple coordination equilibria are possible).
  2.  **General Conformity:** Everyone (or almost everyone) in *P* conforms to *R*.
  3.  **Preferential Conformity (Conditional Preference):** Each member of *P* prefers to conform to *R* *on the condition that* others conform.
  4.  **Mutual Expectations:** Each member of *P* believes that others conform to *R* and believes that others expect them to conform.
  5.  **Arbitrariness (Common Knowledge):** There is at least one alternative regularity *R'* that could have solved the same coordination problem, and this fact is common knowledge in *P*. (The preference for *R* over *R'* is *conditional* on others preferring *R*).

  **Applying the Principle to Your Cases:**

  1.  **Driving on the Right (Convention - Correct):**
      *   **CP:** Avoid collisions (clear coordination problem).
      *   **GC:** Yes.
      *   **PC:** You *prefer* to drive right *because* others do. Driving left alone would be disastrous. Your preference is *conditional* on others' conformity.
      *   **ME:** Yes, you expect others to drive right & expect them to expect you to.
      *   **A:** Driving left is a viable alternative (common knowledge). Enforcement reinforces but doesn't *define* the convention; the core is the conditional preference based on mutual expectation.

  2.  **Village Path (Not Convention - Correct):**
      *   **CP:** Getting across dry (not inherently a coordination problem needing mutual alignment).
      *   **PC:** Each takes it because it's driest *independently* of others' actions. They'd take it even if others didn't exist or took a different path. Fails *Conditional Preference*.

  3.  **QWERTY (Convention - Correct):**
      *   **CP:** Efficient communication/interaction (coordination problem).
      *   **GC:** Yes (historically dominant).
      *   **PC:** You prefer QWERTY *because* others use it. Switching alone makes *you* incompatible/worse off. Preference is conditional on others' conformity.
      *   **ME:** Yes.
      *   **A:** Dvorak (etc.) are well-known alternatives.

  4.  **Rule of Keeping Promises (Convention - Your Verdict Supported):**
      *   **CP:** Enabling trust/cooperation for future interactions (fundamental coordination problem).
      *   **GC:** Expected in the group.
      *   **PC:** You prefer to keep promises *partly because* you expect others to keep theirs (trust). If you *knew* no one else ever kept promises, the *instrumental value* of keeping yours would drastically diminish (though moral reasons might remain). The *conventional* aspect relies on the conditional preference based on mutual expectations for cooperation.
      *   **ME:** Yes, we expect others to keep promises and expect them to expect us to.
      *   **A:** Various alternative norms are conceivable (e.g., only keep promises with witnesses, only keep certain types). Its "heaviness" comes from *additional* factors (morality, internalization) layered *on top* of the core convention.

  5.  **Police-Sustained Regularity (Not Convention - Correct):**
      *   **PC:** Individuals conform solely to avoid the fine/punishment. If enforcement vanished, they would *not* prefer to conform *because others conform*. There's no *conditional preference* based on others' behavior, only fear of sanction. Fails the core Lewisian condition.

  6.  **Sidewalk Stepping (Not Convention - Correct):**
      *   **GC/CP/ME/A:** While a micro-coordination event, it lacks the standing, recurrent nature and established mutual expectations of a convention. It's a spontaneous, ephemeral solution, not a stable regularity with conditional preferences based on precedent.

  7.  **Using Money (Convention - Correct):**
      *   **CP:** Facilitating exchange (coordination problem).
      *   **GC:** Yes.
      *   **PC:** You value/use money *only because* you expect others to accept it. If no one else did, it would be worthless paper/metal. Strong conditional preference.
      *   **ME:** Yes.
      *   **A:** Barter, different currencies, crypto - many alternatives are conceivable and sometimes exist.

  8.  **Not Eating with Left Hand (Not Convention - Correct):**
      *   **PC:** Each member does it out of personal discomfort/disgust/reason *independent* of others' actions. They would do it even if alone or if others stopped. Fails *Conditional Preference*. It's a custom or personal habit, not a convention.

  **Resolving Your Tensions:**

  *   **Driving vs. Police Enforcement:** The principle distinguishes them clearly. Enforcement *supports* the driving convention but isn't its *defining feature*. The core is the *conditional preference* (you drive right *because* others do to coordinate safely). The police-backed rule lacks this; conformity is motivated solely by avoiding punishment, regardless of others' actions.
  *   **Promise-Keeping vs. Driving:** Both fit Lewis's model. The "heaviness" of promises comes from its *moral weight* and *internalization*, which are *additional* to its conventional nature. The *conventional core* is still the conditional preference based on mutual expectations enabling cooperation. The driving convention might feel lighter because failure has immediate, physical consequences and less moral weight, but both share the conditional preference structure.

  **Addressing Your Other Questions:**

  *   **Spreading by Precedent:** Lewis's model *embraces* this origin. A convention often arises when individuals successfully coordinate in a recurring situation using a salient precedent, others observe this and adopt the same solution expecting it to work again, and it eventually becomes common knowledge and the established norm. How it spreads *doesn't* change whether it's a convention *once established*, as long as it meets the criteria (especially conditional preference & mutual expectations). Precedent is a common *mechanism* for establishing mutual expectations.
  *   **Which Verdict Must Be Abandoned?** The principle strongly supports *all* your verdicts. The apparent conflicts are resolved by focusing on the **Conditional Preference (PC)** criterion:
      *   Driving: Preference to drive right *is* conditional on others doing so.
      *   Police Rule: Preference to conform is *not* conditional on others conforming, only on avoiding punishment.
      *   Promises: Preference to keep promises *has a significant conventional component* conditional on others keeping theirs for the system to work (even if overlaid with morality).
      *   Left Hand: Preference *not* to eat with left hand is *not* conditional on others doing so.

  **Conclusion:** Your intuitive judgments align remarkably well with David Lewis's philosophical definition of convention. The core principle is the **Conditional Preference**: individuals follow the regularity *because* they expect others to follow it, and they prefer to follow it *on the condition that* others do, as it solves a coordination problem where viable alternatives exist. This principle cleanly distinguishes conventions from habits, rules enforced purely by sanction, one-off coordination acts, and practices followed for purely personal reasons. Your verdict on promise-keeping stands; its moral gravity coexists with its conventional foundation.
