  First, I need to recall the core of Mill's harm principle: society can only interfere with individual liberty to prevent harm to others. The user seems to think Feinberg later added the offense part, but the corn dealer example complicates that. 

  Right, the corn dealer. Mill says inflammatory speech to a mob can be punished - but why? The key is distinguishing between content and context. Mill isn't banning the opinion that corn dealers are starvers of the poor; he's concerned about the immediate dangerous circumstances. It's the equivalent of shouting "fire" in a crowded theatre - the words become acts when they directly provoke violence. 

  The user's mistake is conflating mere offense (disgust, insult) with what Mill calls "harm" via dangerous circumstances. For Mill, offense alone isn't enough - you have to prove direct, tangible harm. Feinberg later did argue for regulating extreme offense, but that's separate. 

  Hmm, the user mentions hate-speech laws - that's where things get fuzzy today. But strictly speaking, Mill would only support restrictions if speech directly incites violence, not just because it's offensive. The corn dealer case is about stopping a riot, not protecting feelings. 

  I should emphasise the context point strongly. Maybe use the modern "theatre" analogy to make it concrete. And stress that for Mill, offense without provable harm isn't grounds for suppression - that really is Feinberg's contribution. 

