  Avoid Weil quotes per request. Instead, show her mechanism in action: "When the engine starts, the exhaust is always the same - the things we suddenly can't say." That makes it visceral.

  Final test: Does this help people vote based on clear-eyed understanding rather than tribal loyalty? The unresolved ending forces ownership. Good.
answer: |-
  ## Keynote: The Engine & The Eyes

  **(Stand at the edge of the stage, scanning the room. Speak clearly, directly, without podium formality. A measured intensity.)**

  Alright. Sheffield. Two years. Four hundred faces. Some I know from handing out soup in the rain, others from barricading doors against bailiffs, many I’m meeting for the first time. Welcome. And thank you for the trust, and the sheer bloody-mindedness, to be here today. We’ve argued in pubs, kitchens, WhatsApp groups… and I suspect last night didn’t help! *(Small, acknowledging chuckle)* But you’re here. That matters.

  Look around. Seriously. Look. *(Pause)* You see the split. We all feel it. On one side: friends who’ve been inside the machine. Labour, Greens – you’ve seen the gears grind. You know the score: power isn’t handed out, it’s taken. And you’re impatient. Rightly! You look at the misery on our streets, the landlords laughing, the system rigged, and you say: “What good is our anger if it doesn’t *change* anything? If we don’t build power, win seats, force the lever… are we just a therapy group?” Your impatience isn’t a flaw; it’s oxygen. We’d suffocate without it.

  On the other side: friends who joined *because* you saw that machine up close. You saw the compromises that curdle into betrayal. The whip cracking down dissent. The way inconvenient truths get vanished because they “damage the brand” or “upset the leadership.” You saw how loyalty to the *party* started to warp what people could see, what they could say. You didn’t leave politics; you fled a sickness. Your terror of recreating that – that isn’t paranoia. It’s a hard-earned warning. And we’d be fools not to listen.

  So here we are. The question: Do we become a political party? Run candidates? Step onto *that* field?

  I won’t pretend I have the answer today. That’s not my job. My job is to help us *see* the question clearly. And for that, I want to share an idea that’s haunted me. It comes from a thinker, Simone Weil, watching exiled French politicians in London during the war. She saw something deep, something structural, about political parties.

  **She saw them not just as tools for winning votes, but as engines.** Engines that mass-produce something powerful, something essential: a *shared passion*. That shared fire is what gets us knocking doors in the cold, what binds us together against impossible odds. It’s vital.

  **But she saw the engine’s exhaust.** Once that passion is roaring, once the party *itself* becomes the focus, something dangerous happens. People start to perceive truth, justice, reality itself… *through the needs of the party*. It’s not that they *decide* to lie. It’s subtler, more insidious. They just… stop being able to *see* certain things. Inconvenient facts blur. Dissenting voices become static. Moral compromises feel like necessary sacrifices. The party’s survival, its success, its image… these become the lens that distorts everything. Weil believed this wasn’t about bad apples or corrupt leaders – it was baked into the *structure* of the party itself. The engine, running hot, produces blindness.

  **So. To our veterans, our realists:** I hear your impatience. Loud and clear. You’re right: power matters. But hear this concession, this *real* one: If we choose the party path, we cannot let the engine consume *us*. **So I propose this, bindingly:** Whatever we decide today, if we become a party, we *never* abandon our roots. Our mutual aid networks, our tenant defence squads – they aren't just recruiting grounds or photo ops. They remain our core, autonomous, funded, *equal* to any electoral work. They are our anchor in reality, our check against the engine’s pull. We don't *replace* solidarity with strategy; we force strategy to serve solidarity. That’s the concession: the grassroots work *stays* central, non-negotiable.

  **To our purists, our wary ones:** I share your terror. That blindness is real. But here’s the warning, and it costs me: **Refusing the engine entirely has its own cost.** The cost is exhaustion. The cost is fragmentation. The cost is watching our fire splutter out because we fear structure so much we have nowhere to channel the power we *do* build. Without *some* coherent structure – party or otherwise – capable of sustained action and wielding power, we risk becoming voices shouting perfectly true things into a gale. We risk burning out brilliant people, scattering our energy, and ultimately, changing nothing. Our passion needs focus, or it dissipates. That’s the danger of purity: irrelevance.

  So, where does that leave us? Staring at a choice.

  **Option One:** We build the engine. We step into the arena. We try to build a party *differently*, eyes wide open to its inherent dangers. We try to build it with that anchor – our mutual aid, our direct action – constantly dragging us back to earth. We gamble that we can wield power without being warped by it, knowing the engine *will* try to blind us, and fighting it every day. The risk? Becoming what we fled. The reward? A chance to actually change the damned rules.

  **Option Two:** We stay outside. We remain a coalition, a movement, fiercely guarding our independence, our ability to speak the raw truth without filter. We focus on building power from the ground up, pressure from below. The risk? That our passion lacks the focus to translate into lasting, structural change. That we remain righteous, vital... but ultimately, powerless against the machines already running. The reward? Keeping our souls intact, our vision clear.

  **There is no safe path. There is no pure path.** Both choices demand courage. Both carry profound risks and profound potential.

  Simone Weil saw the engine’s danger clearly. She didn’t offer easy answers. But she forced us to see the mechanism. The question today isn’t just *what* we do. It’s *how we see* while we do it. Can we build an engine and *not* let its exhaust blind us? Can we build power without losing our soul?

  I don’t know. You don’t know yet. That’s why we’re here. To decide, together, eyes wide open.

  So. Let’s talk. Let’s argue. Let’s *see*. The floor is yours.

  **(Hold the silence for a beat. Nod. Step back.)**
