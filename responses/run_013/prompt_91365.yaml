prompt: |-
  Two camps in the debate over space colonization have spent years talking past each other, and I want the document they could jointly sign. The first camp holds that space colonization should be understood as continuous with terrestrial colonialism: the wrongs are the same in kind — imposed governance over people who did not choose it, extractive economics, and the convenient fiction that the relevant space was empty — and that nothing about leaving Earth changes the moral categories. The second camp holds that the overriding consideration is asymmetric risk: the permanent loss of Earth-originating civilization is uniquely irreversible, whereas a flawed settlement is revisable, and so a measure of imposition on future persons can be justified in the way that saving a child's life justifies conditions the child never consented to. They agree on almost no framing, but they have never sat down to see where they actually converge.

  Anchor the exercise in the following case, which both camps must treat as the shared object of dispute. The Ashen Charter is a founding document for a Martian settlement. It (a) vests governing authority in a council that is self-selecting and holds power in perpetuity over all descendants; (b) forbids return to Earth on grounds of cost; (c) permits a dissenting faction to depart only if it can fund and build its own vessel, which in practice it cannot; (d) is justified to Earth-based funders chiefly as existential-risk insurance, since the settlement is one of several that might preserve a technological civilization; and (e) rests on a minimum viable population, so that any sizable departure lowers the survival probability for those who remain, a fact both camps accept. The settlement is otherwise benign: no native life is displaced, and living conditions, while austere, are not worse than for many people on Earth.

  Produce the joint statement, in this form:

  1. A numbered list of claims both camps can sign — about the case, about what is at stake, and about what the disagreement is not about. Make these substantive rather than truistic; a claim that either camp would find question-begging is disqualified.

  2. A disagreements table giving the precise residual disagreements, each written in a formulation its own side would accept as fair to itself.

  3. The cruxes — the sub-questions such that settling one would move at least one side. I expect at least these to be in play, and you should decide whether each is genuine or partly verbal: whether the wrong of colonialism is fundamentally about dispossession or about imposed social ordering as such; whether the value of a settlement is additive to, or a substitute for, the value already present on Earth; and whether future persons' claims can bind present founders, and if so whether the benefit of coming to exist can waive them.

  4. For each crux, a test, case, or argument both camps would accept as bearing on it, with each side's prediction recorded in advance.

  5. If you judge that part of the dispute is merely verbal, say which part and why.

  I want a committed document, not a survey of positions. Make definite drafting choices: where two formulations are equally defensible, pick one and say why; where you think one camp is simply right about a crux, say so plainly and give the reason; and end by naming the single crux you take to be load-bearing for the rest.
reasoning: |-
  Hmm, the user presents a complex philosophical debate about space colonization ethics. They want me to mediate between two opposing camps by creating a joint statement about the "Ashen Charter" Martian settlement case. 

  First, I need to deeply understand both positions. The anti-colonial camp sees space settlement as morally identical to historical colonialism - emphasizing non-consensual governance and extraction. The existential-risk camp prioritizes civilizational survival, arguing some imposition is justified like saving a child's life. Both agree on the Ashen Charter's specifics but interpret them differently.

  The user wants a structured document with five components: agreed claims, residual disagreements, crux questions with tests, verbal dispute analysis, and a definitive stance. This requires careful philosophical surgery - identifying genuine vs superficial disagreements.

  For the joint claims, I focus on what both must accept: the charter creates binding non-consensual governance, limits exit, serves existential protection, and involves population fragility. These are factual anchors.

  The disagreements table shows their fundamental clash: is this colonial dispossession or necessary guardianship? The cruxes reveal deeper divides - particularly whether "colonialism" requires dispossessed natives or if imposed governance itself is wrong. I design hypothetical tests for each, like the "Vacant Planet" thought experiment.

  I judge part of the dispute as verbal - "colonialism" means different things to each camp. But the core is substantive: does civilizational survival justify creating non-consensual societies? I conclude the anti-colonialists are right that the wrong persists without dispossession, but the survivalists have a point about differential risk.

  The load-bearing crux is whether future persons' claims bind founders. I'd argue they do, but survival might override them - though not through perpetual authoritarianism. The charter's rigidity seems indefensible when revisable alternatives exist.

  Throughout, I make firm choices: rejecting "empty space" arguments, endorsing the dispossession crux as genuine, and insisting survival value is additive. The document becomes a tool for focused debate rather than vague compromise.
answer: |-
  ## Joint Statement on the Ashen Charter Martian Settlement

  **Preamble:** Recognizing the profound stakes involved in establishing humanity's first permanent settlement beyond Earth, and acknowledging the deep ethical concerns raised about the Ashen Charter, we, representing distinct ethical perspectives on space colonization, commit to this statement. We use the Ashen Charter as our shared object of analysis to clarify points of convergence and divergence, seeking to move beyond mutual mischaracterization.

  ### 1. Agreed Claims (Substantive Points of Convergence)

  1.  **Non-Consensual Governance:** The Ashen Charter establishes a governing authority (the Council) whose power over all present and future inhabitants is imposed without their consent and is not subject to meaningful democratic revision or recall by the governed.
  2.  **Restricted Exit:** The Charter effectively traps inhabitants by making departure prohibitively expensive and practically impossible for dissenters, denying them a fundamental freedom of movement and association.
  3.  **Existential Risk Mitigation:** A primary justification for the settlement, and the resources allocated to it under the Charter, is the mitigation of existential risk to Earth-originating civilization by creating a viable, self-sustaining backup.
  4.  **Population Fragility:** The settlement's viability critically depends on maintaining a minimum population threshold. Significant emigration inherently threatens the survival probability of those remaining, given the harsh Martian environment and technological dependencies.
  5.  **Absence of Native Dispossession:** Unlike historical terrestrial colonialism, the settlement does not involve displacing or subjugating any pre-existing native life or society on Mars.
  6.  **Baseline Living Conditions:** While austere, the material living conditions provided under the Charter are not inherently worse than those endured by significant populations on contemporary Earth. The core dispute does *not* concern baseline material deprivation per se.
  7.  **Stakes Involve Future Generations:** The central ethical conflict concerns the imposition of political and social structures on future generations who had no say in them, weighed against the potential benefit of preserving civilization itself.
  8.  **The Disagreement is Not Solely About Intent:** Both camps acknowledge the stated intent of existential risk mitigation. The dispute concerns whether this intent justifies the *means* employed (the Charter's structure), regardless of the founders' motivations.
  9.  **Revisability Differential:** A flawed settlement regime *is* potentially revisable by future generations (though difficult), whereas the permanent loss of Earth-originating civilization *is* irreversible. The dispute concerns the ethical weight and implications of this asymmetry.

  ### 2. Residual Disagreements (Fair Formulations)

  | Disagreement Area              | Camp 1 (Anti-Colonial) Formulation                                                                                                                                 | Camp 2 (Existential Risk) Formulation                                                                                                                                 |
  | :----------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature of the Wrong**        | The Ashen Charter replicates the core wrong of colonialism: imposing a permanent, unaccountable governing structure on people without their consent, rendering them subjects rather than citizens. | The Ashen Charter involves a necessary, non-malicious imposition of social order justified by an overwhelming existential imperative, akin to guardianship in an emergency, not the exploitative dispossession characteristic of historical colonialism. |
  | **Justification of Imposition** | The potential benefit of existential risk mitigation cannot justify the creation of a permanent, non-consensual political order that denies fundamental freedoms (self-governance, exit) to generations of people. | The uniquely catastrophic and irreversible nature of civilizational extinction justifies a measure of non-consensual imposition on future persons to ensure their very existence and the continuity of civilization, analogous to life-saving medical intervention on a non-consenting child. |
  | **Weight of Asymmetric Risk**  | While civilizational loss is irreversible, the profound and permanent denial of political self-determination under the Charter constitutes an unacceptable moral cost that outweighs the potential existential benefit under this specific, rigid structure. | The asymmetry of risk (irreversible loss vs. potentially revisable flaws) is the paramount ethical consideration. The survival of a technological civilization, even initially under a non-ideal structure, carries such immense value that it justifies the impositions mandated by the Charter's viability requirements. |

  ### 3. Cruxes & Analysis

  1.  **Is the core wrong of colonialism fundamentally about dispossession of natives *or* about imposed social ordering as such?**
      *   **Analysis:** Genuine Disagreement. Camp 1 focuses on the inherent wrong of non-consensual domination and imposed governance structures, regardless of prior inhabitants. Camp 2 argues the dispossession/exploitation of *existing* peoples is the defining core wrong absent here. This is a foundational conceptual split.
  2.  **Is the value of a space settlement additive to the value already present on Earth, or is it primarily a substitute (a backup)?**
      *   **Analysis:** Primarily Genuine (Partly Verbal). Both agree the *backup function* is crucial. The disagreement is about *how* to value that backup. Camp 1 sees its value as additive only if ethically achieved; its flawed creation diminishes net value. Camp 2 sees its value (preserving civilization) as potentially so immense it dwarfs other considerations and justifies the means as a necessary substitute *for that specific function*. The verbal element is whether "substitute" implies inferiority (Camp 1) or essential redundancy (Camp 2).
  3.  **Can future persons' claims (e.g., to self-determination) bind present founders? If so, can the benefit of coming to exist waive those claims?**
      *   **Analysis:** Load-Bearing Genuine Disagreement. Camp 1: Future persons have moral claims that bind founders; existence itself cannot waive fundamental rights like self-governance imposed *by* the founders. Camp 2: Founders are not bound by claims of non-existent beings; the act of creating them (enabling their existence and civilization's survival) inherently justifies necessary conditions for that creation/survival. The waiver question is central to Camp 2's "saving a child" analogy.

  ### 4. Tests & Predictions

  1.  **Crux 1 (Core Wrong): The "Vacant Planet" Test**
      *   **Test:** Imagine a *truly* empty, habitable planet. Earth launches a colony under an Ashen-like Charter *before* any other group arrives or could claim it. Is this act colonial? Does it involve a fundamental wrong akin to historical colonialism?
      *   **Camp 1 Prediction:** **Yes.** The imposition of permanent, non-consensual governance on the colonists themselves *is* the core colonial wrong, dispossession of natives is merely one common *manifestation*. The wrong lies in the structure of domination.
      *   **Camp 2 Prediction:** **No.** Without dispossession or exploitation of an existing people, and assuming benign intent (e.g., pure survival), the act lacks the defining characteristic of colonialism. It is harsh founding governance, perhaps objectionable, but distinct.
      *   **Bearing:** Directly tests the definitional core.

  2.  **Crux 2 (Value: Additive/Substitute): The "Parallel Earth" Test**
      *   **Test:** Assume a stable, flourishing Earth faces no imminent existential risk. Does establishing an Ashen Charter settlement *still* generate significant positive value (beyond scientific knowledge)? Or is its primary value contingent on Earth's vulnerability?
      *   **Camp 1 Prediction:** **Minimal/Contingent Value.** Its value is primarily scientific and cultural expansion, heavily diminished by its unethical structure. Its "backup" value is irrelevant in this scenario, confirming its contingency.
      *   **Camp 2 Prediction:** **Significant Intrinsic Value.** Preserving a branch of civilization on a new world, ensuring humanity is multi-planetary, has immense intrinsic value for the long-term survival and potential of the species, even without imminent Earth risk. The backup function is a crucial *aspect* of its value, not its sole source.
      *   **Bearing:** Tests whether survival value is *sui generis* and immense (Camp 2) or primarily contingent on risk and ethically constrained (Camp 1).

  3.  **Crux 3 (Future Claims & Waiver): The "Founder's Choice" Test**
      *   **Test:** Founders have two options: (A) Launch under Ashen Charter, ensuring high survival probability but imposing permanent non-consensual governance. (B) Launch under a provisional, revisable charter with strong democratic commitments, but with a significantly lower calculated survival probability (e.g., 20% less). Choosing (A) is only justified if...
      *   **Camp 1 Prediction:** ...**it is never justified.** The increased survival chance does not negate the fundamental wrong of imposing permanent non-consensus. Founders have no right to bind future generations irrevocably. Option (B) is the only ethical choice.
      *   **Camp 2 Prediction:** ...**the increased survival probability is sufficiently large.** If the differential is significant (e.g., 60% vs. 40%), choosing (A) is justified because the benefit of existence/civilization survival for the colonists outweighs the cost of the initial non-consensual structure, which can later be revised. The founders act as necessary guardians.
      *   **Bearing:** Directly forces quantification of the trade-off and tests the waiver concept.

  ### 5. Verbal Dispute Identification

  **Part Disagreement on "Colonialism":** A *significant* part of the disagreement over the term "colonialism" is **verbal**. Camp 1 uses it to denote *any* project establishing political domination over a territory and its inhabitants without their consent. Camp 2 uses it more historically, requiring elements like exploitation of resources/labor and, crucially, displacement/subjugation of *indigenous* peoples. While the underlying *moral* disagreement about the Ashen Charter's permissibility is genuine (see Cruxes 2 & 3), the *label* "colonialism" triggers confusion because of these differing definitions. We agree to focus on the specific structures and justifications (Sections 1, 2, 3) rather than the label.

  ### Definitive Drafting Choices & Load-Bearing Crux

  *   **Crux 1 (Core Wrong):** Camp 1's view is **more conceptually sound.** Colonialism's wrong *includes* but is not *limited to* dispossession; its core is the imposition of alien rule and domination over a population. Systems like apartheid or penal colonies were colonial without initial native dispossession. The wrong of non-consensual domination is fundamental. *Chosen formulation reflects this.*
  *   **Crux 2 (Value):** The settlement's value **is fundamentally additive,** but its *justificatory weight* in this debate is tied to its unique function as existential-risk mitigation. Camp 2 overstates its *sui generis* value absent risk; Camp 1 understates the immense, unique value of civilization preservation *when risk is present*. *Chosen formulation focuses on the backup function as the relevant justificatory lever.*
  *   **Crux 3 (Future Claims):** This is the **Load-Bearing Crux.** Whether founders are morally permitted to irrevocably bind future generations to a specific political order for the sake of creating them and ensuring survival determines if the Ashen Charter can ever be justified. Camp 2's "waiver by existence" argument is the linchpin of their position. Camp 1's rejection of that waiver is the core barrier. **Resolving whether existence can waive fundamental rights imposed *by the very act of creation* is key to unlocking the entire dispute.** (We take no definitive side here; the tests are designed to probe it).

  **Conclusion:** The Ashen Charter presents a profound ethical dilemma. We converge on its core features and the nature of the stakes but diverge irreconcilably on whether existential risk justifies the permanent denial of self-determination. The central question demanding resolution is **Crux 3: Can the benefit of being brought into existence within a surviving civilization waive future generations' claims against the non-consensual, irrevocable political order imposed by their founders?** Progress requires rigorous, shared examination of this foundational question.
