  ## Pantoum for the Poverty

  *(After the debate, for a seminar's end)*

  **Poet's Reflection:**  
  The pantoum’s recursive loop is the argument’s core. Its fixed, returning lines—the "input"—are impoverished data, thin as parental murmurings. Yet the *changing* lines—the child’s "inferences"—build intricate structure where none was given. This form commits to nativism *structurally*: it shows generation from sparse seed. The unchanged lines prove *no new data arrived*; the evolving syntax proves *internal logic worked*. Yet the empiricist might claim the *potential* was latent in the loop itself—the repetitions were sufficient fuel. The final double-voiced return holds this tension: the same line is both proof of adequacy *and* proof of absence. The form doesn’t adjudicate; it enacts the paradox.

  ---

  **The Poem:**

  Look, a bird! (The sound was thin, a wing
  Against the window of the mind’s grey glass.)
  This sound means flight, means feathered thing –
  Can you hear the rain fall on the grass?

  Against the window of the mind’s grey glass,
  What flies that I saw earlier take to air?
  Can you hear the rain fall on the grass?
  The pattern forms from empty, waiting air.

  What flies that I saw earlier take to air?
  Not *saw I what* flies (that path is blocked and wrong).
  The pattern forms from empty, waiting air:
  *Is what I saw* in flight? (The grammar, strong,

  Not *saw I what* flies (that path is blocked and wrong).
  The bird I saw – its wingbeat lifts the clause?
  *Is what I saw* in flight? (The grammar, strong,
  Builds towers where the simple input daws.)

  The bird I saw – its wingbeat lifts the clause?
  Look, a bird! (The sound was thin, a wing
  Builds towers where the simple input daws.
  Can you hear the rain fall on the grass?

  ---

  **Annotations for Clarity & Craft:**

  1.  **Recurring Lines as "Thin Input":**
      *   *"Look, a bird!"*: Authentic, sparse parental utterance. No syntax beyond NP, no explicit tense, no embedding.
      *   *"Can you hear the rain fall on the grass?"*: Slightly richer (question, VP), but still simple declarative structure, no recursion. Both lines recur **verbatim**, never enriched.
      *   *"Against the window of the mind’s grey glass"*: Represents the learner's initial perceptual/cognitive surface, the "screen" data hits. Remains constant.

  2.  **Changing Lines as "Learner's Inferences/Grammar Building":**
      *   **Stanza 1:** Basic parsing ("This sound means flight, means feathered thing").
      *   **Stanza 2:** Introduces recursion/cognition ("What flies that I saw earlier take to air?").
      *   **Stanza 3:** **Structure-Dependence Case:** Explicitly contrasts the impossible extraction ("*saw I what* flies") with the correct, structure-dependent path ("*Is what I saw* in flight?"). "Path is blocked and wrong" paraphrases the unlearnable error; "(The grammar, strong)" highlights the innate constraint.
      *   **Stanza 4:** Deepens the correct structure ("The bird I saw – its wingbeat lifts the clause?") using metaphor ("wingbeat lifts the clause") to show hierarchical movement. "Builds towers... daws" contrasts generative capacity with simple input.
      *   **Stanza 5:** See "Double-Voicing" below.

  3.  **Closing Loop & Double-Voicing:**
      *   The final stanza brings back the opening lines: "Look, a bird!" and "Can you hear the rain...".
      *   **Empiricist Reading:** The return shows the input *was* sufficient! The child built complex grammar ("Builds towers...") using *only* this recycled data ("where the simple input daws"). The loop proves adequacy.
      *   **Nativist Reading:** The return proves *nothing new was added*. The complex grammar ("Builds towers...") emerged *despite* the unchanged, impoverished input ("the simple input daws"). The loop proves poverty.

  4.  **Form & Technique:**
      *   **Pantoum Structure:** Strictly followed (2nd/4th lines of stanza N become 1st/3rd of N+1; final stanza uses 1st stanza's 1st/3rd as its 2nd/4th).
      *   **Rhyme:** Consistent ABAB scheme using slant/near rhymes for subtlety (wing/thing, glass/grass, air/air, wrong/strong, clause/daws).
      *   **Diction:** Balances technical precision ("clause", "grammar", "input") with lyrical imagery ("window of the mind's grey glass", "wingbeat lifts the clause", "towers", "daws").
      *   **Argument Integrity:** The structure-dependence case is accurately paraphrased, not quoted. The core positions (nativist: innate structure needed; empiricist: input + learning suffices) remain distinct and opposed, framed by the poem's mechanics. The "thinness" of the input lines is palpable.

  The poem stands as its own evidence: complex form built from sparse, recycled elements, leaving the fundamental question of *how* unresolved, echoing in the final, double-voiced return of the simplest sounds.
