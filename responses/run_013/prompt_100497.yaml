  If we don't have such a class (i.e., no data at all for any narrow class), then we move to Step 2.

  Step 2: Consider if we can create a class by combining similar risks that are missing one or two factors. For example, if we don't have data for helicopter pilots in region X, maybe we have it for the same helicopter type in a similar region. Or if we don't have drone operators inspecting solar panels, maybe we have drone operators in similar industries.

  Question: "Can we define a class by relaxing one factor (e.g., geography, industry) while keeping others fixed, such that we have at least 50 exposure units (to have some statistical credibility)?"

  Good enough: A class that is still reasonably relevant (e.g., same aircraft type but broader region, same occupation but nationwide) and has at least 50 exposure units (a threshold for minimal credibility).

  If we can't form such a class, then we move to Step 3.

  Step 3: Now we are going to look at broader classes. We consider multiple broad classes that are available (e.g., all commercial pilots, all small contractors). We require that each considered broad class must have at least 1000 exposure units (so that the estimate is stable) and be commonly accepted in the industry (so we can defend it to regulators).

  Question: "What are the broad classes (industry standard classes) that are relevant and have at least 1000 exposure units?"

  Good enough: At least one such class exists and we can list them.

  If we have multiple, we then need to choose one. We do that by comparing the broad classes to the risk in question and choosing the one that is most similar in terms of known risk factors (Step 4). If we don't have any broad class with 1000 units, then we must stop and hand to human (because we are in uncharted territory).

  Step 4: If we have multiple broad classes, we need to select the most relevant one.

  Question: "Which broad class has the most similar risk factors to the specific risk? Consider factors such as: size of exposure, industry, geography, known loss drivers, etc."

  Good enough: We can identify one or two factors that are most critical and then choose the class that best matches on those. If we cannot decide, we hand to human.

  Step 5: Once we have chosen a class (either from Step 2 or Step 4), we then check if we can adjust the rate from that class based on factors that differ between the class and the specific risk. We require that any adjustment must be evidence-based (e.g., from a model, from industry studies, from internal analysis of similar risks).

  Question: "Are there known risk factors that differ between the chosen class and the specific risk, and do we have a credible way to adjust for them (e.g., a loading or discount factor with supporting evidence)?"

  Good enough: We have an adjustment factor that is based on at least 30 data points (e.g., from a regression model, or from a study) or from a well-accepted industry source. If we don't have that, then we cannot adjust and we must use the class rate as is.

  If we can adjust, we do so and record the adjustment. If not, we proceed without adjustment.

  Step 6: If we are using a broad class and we have a narrow class with some data (even if thin) that we rejected because it was too thin, we must check if the narrow class data is consistent with the broad class. If it is inconsistent, we have a problem and must hand to human.

  Question: "If we have a narrow class that we did not use because of insufficient data, does the available data in that narrow class (even if only a few points) contradict the rate we are using? Specifically, is the narrow class rate more than 50% higher or lower than the broad class rate?"

  Good enough: We have at least 5 data points in the narrow class to even consider this. If we don't have 5, we ignore. If we do and the rate is within 50% of the broad class rate, we proceed. If it's outside, then we hand to human because the broad class may be misleading and the narrow class is too thin to use.

  If we don't have a narrow class, we skip this step.

  Step 7: After all this, we have a rate. We then assign a confidence level:
  - High: If we used a class from Step 2 (relaxed narrow class) with at least 50 exposure units and no adjustments, or a broad class with adjustment that was well-supported.
  - Medium: If we used a broad class without adjustment, or a relaxed narrow class with adjustment.
  - Low: If we used a broad class and had to adjust without strong evidence, or if we had a narrow class that was inconsistent but we proceeded because we had no alternative.

