  We are designing a decision procedure to choose a reference class for pricing insurance risks. The goal is to avoid arbitrary choices and provide a structured approach that can be defended to regulators. The procedure must account for data limitations and require recording rejected alternatives. It should not allow "peeking" at the answer to choose the class.

  Key principles:
  1. We must pick the class before computing the number and record alternatives.
  2. We often lack data in the narrow class, so we need a way to handle thin data.
  3. The procedure should guide when to use a broader class or when to apply adjustments.

  The procedure will be a step-by-step flow of questions. Each step has:
  - Step number
  - Question to ask
  - What counts as a good enough answer
