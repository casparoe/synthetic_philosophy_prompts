  ### Reference Class Selection Procedure for Insurance Pricing

  This decision procedure is designed to systematically select a reference class for pricing niche insurance risks. It prioritizes specificity but defaults to broader classes only when narrow classes lack sufficient data, while enforcing defensibility and precluding "peeking" at the rate outcome. The procedure records all rejected alternatives and their estimates. Confidence levels are assigned as follows:
  - **High**: Narrow class with ≥50 units (or adjusted with evidence-based factors).
  - **Medium**: Broad class with ≥1,000 units or narrow class with adjustments.
  - **Low**: Only if adjustments lack evidence (rare, as Step 5 requires evidence).

  **Key Constraints Baked In**:
  1. **Defensibility**: Classes are selected and recorded *before* computing the final rate. Rejected alternatives (class name, estimate, data size) are documented.
  2. **Thin Data**: Forces progression to broader classes when narrow classes have <50 units, but checks for contradictions between narrow/broad estimates.

  **Procedure Table**:
  | Step | Question to Ask | Good Enough Answer | Next Step if Not Good Enough |
  |------|-----------------|---------------------|------------------------------|
  | 1 | What is the narrowest class that is logically relevant (same key factors, e.g., aircraft type, occupation, city) and has ≥1 exposure unit? | Class matches all defining risk factors and has ≥1 data point from a representative period (no known structural changes). | Step 2 |
  | 2 | Can we define a class by relaxing one factor (e.g., geography, industry) while keeping others fixed, such that we have ≥50 exposure units and the class is reasonably relevant? | Class with ≥50 units that matches core risk factors (e.g., same aircraft type but broader region) and representative period. | Step 3 |
  | 3 | What industry-standard broad classes are relevant (e.g., all commercial pilots, all roofers) and have ≥1,000 exposure units? | At least one class exists with ≥1,000 units and is commonly accepted in industry filings. | Stop and hand to human (if no class meets criteria) |
  | 4 | (If multiple broad classes) Which broad class has the most similar risk factors to the specific risk? | Clear selection based on dominant risk driver (e.g., "aerial hazard" over "geography" for drones). | Hand to human (if tie on risk factors) |
  | 5 | (After choosing a class) Can we adjust the rate for differences between the class and the specific risk using evidence-based factors? | Adjustment supported by ≥30 data points (e.g., internal models) or a well-accepted industry study. | Proceed without adjustment |
  | 6 | (If a narrow class from Step 1/2 was rejected) Does the available data in that narrow class (≥5 data points) contradict the chosen rate? | Narrow class rate is within ±50% of the chosen rate, or <5 data points. | Hand to human (if contradiction >50%) |

  **Ordering Defense**: Steps progress from specific to broad to minimize bias. Step 1 anchors to the ideal class; Step 2 avoids over-reliance on thin data; Steps 3–4 use defensible industry standards; Step 5 allows calibrated adjustments; Step 6 flags material contradictions. Steps 2 and 6 explicitly handle thin data. Values-driven judgments (e.g., risk factor similarity in Step 4) are handed to humans.

  ---

  ### Case Applications

  **Case 1: Helicopter Pilot Life/Disability**
  ```json
  {
    "case": "Helicopter Pilot",
    "classes_considered": [
      {"name": "Helicopter type X in Region Y", "estimate": 1000, "data_size": 10},
      {"name": "Helicopter type X nationwide", "estimate": 900, "data_size": 100},
      {"name": "All commercial pilots", "estimate": 500, "data_size": 10000}
    ],
    "class_chosen": "Helicopter type X nationwide (adjusted for region)",
    "rate_or_range": 990,
    "confidence": "high",
    "confidence_reason": "Class from Step 2 with 100 units and evidence-based regional adjustment.",
    "judgment_calls": ["Step 4: Not reached (class chosen in Step 2)."],
    "what_would_move_it": ">20 data points for Region Y showing rate divergence >50% from nationwide adjusted rate."
  }
  ```
  **Workflow**:
  - **Step 1**: Narrow class ("Helicopter type X in Region Y") has 10 units (estimate: 1000). Insufficient for Step 2 threshold → Proceed to Step 2.
  - **Step 2**: Relax geography → "Helicopter type X nationwide" (100 units, estimate: 900). Meets criteria (≥50 units, same aircraft type) → Use this class.
  - **Step 5**: Adjust for region: Evidence from internal model (1,000 data points) shows Region Y is 10% riskier → Adjusted rate = 900 × 1.1 = 990.
  - **Step 6**: Narrow class (1000) vs. chosen rate (990): Difference = 1% (<50%) → No contradiction.
  - *Broad class ("All commercial pilots") recorded but unused*.

  ---

  **Case 2: Drone Roof Inspections in Hail Metro**
  ```json
  {
    "case": "Drone Solar Inspections",
    "classes_considered": [
      {"name": "Small aircraft liability in Metro", "estimate": 300, "data_size": 1500},
      {"name": "Roofers in Metro", "estimate": 700, "data_size": 1000},
      {"name": "General commercial liability", "estimate": 400, "data_size": 10000}
    ],
    "class_chosen": "Small aircraft liability in Metro",
    "rate_or_range": 300,
    "confidence": "medium",
    "confidence_reason": "Broad class from Step 4 with 1,500 units, no adjustment possible.",
    "judgment_calls": ["Step 4: Chose 'small aircraft' over 'roofers' based on aerial hazard as dominant risk driver."],
    "what_would_move_it": "10+ data points for drone operations showing loss costs >50% divergent from small aircraft, or hail-specific drone studies."
  }
  ```
  **Workflow**:
  - **Step 1**: No narrow class (0 data for "solar-inspecting drones in hail metro") → Proceed to Step 2.
  - **Step 2**: Relax industry ("drone → small aircraft") or activity ("solar → roofing") → No class with ≥50 units (e.g., "drones nationwide" has 30 units; "roofers" lacks aerial hazard) → Proceed to Step 3.
  - **Step 3**: Broad classes: Small aircraft (1,500 units, 300), Roofers (1,000 units, 700), General liability (10,000 units, 400). All ≥1,000 units → Proceed to Step 4.
  - **Step 4**: Choose "small aircraft": Aerial hazard (crash/damage) deemed more critical than roofing (fall hazard) or geography.
  - **Step 5**: No evidence to adjust for drones vs. small aircraft (no studies, <30 data points) → No adjustment. Rate = 300.
  - **Step 6**: No narrow class considered → Skip.
  - *All broad classes recorded; "roofers" rejected due to risk factor misalignment*.

  ---

  **Case 3: Cargo-Bike Fleet in Car-Free Downtown**
  ```json
  {
    "case": "Cargo-Bike Courier Ban",
    "classes_considered": [
      {"name": "Cargo-bike couriers in City (pre-ban)", "estimate": 200, "data_size": 5},
      {"name": "All bike couriers in City (pre-ban)", "estimate": 150, "data_size": 1000},
      {"name": "National cargo-bike couriers (no ban)", "estimate": 180, "data_size": 500}
    ],
    "class_chosen": "Hand to human",
    "rate_or_range": "N/A",
    "confidence": "N/A",
    "confidence_reason": "No representative class available (Step 3).",
    "judgment_calls": ["Step 1/2: Pre-ban data not representative due to car ban; Step 3: No class with ≥1,000 units and representative period."],
    "what_would_move_it": "Post-ban accident data (even 5 incidents), traffic studies showing change in bike collision rates, or competitor pricing in similar bans."
  }
  ```
  **Workflow**:
  - **Step 1**: Narrow class ("Cargo-bike couriers in City") has 5 units (estimate: 200), but pre-ban period unrepresentative due to car ban → Proceed to Step 2.
  - **Step 2**: Relax vehicle type → "All bike couriers in City" (1,000 units, 150) or geography → "National cargo-bike couriers" (500 units, 180). Neither representative (pre-ban or no-ban) → Proceed to Step 3.
  - **Step 3**: Broad classes (e.g., "historical bike accidents") have ≥1,000 units but are pre-ban → Not representative → Stop and hand to human.
  - *Human must decide*: Apply a judgmental loading (e.g., +50% for uncertainty), use "all bike couriers" with caveats, or decline the quote. Alternatives recorded.

  ---

  ### Limitations of the Procedure
  This procedure cannot eliminate value judgments disguised as math—it launders risk appetite in Step 4 (selecting "most similar" broad class) and Step 6 (±50% contradiction threshold). It misfires during structural regime shifts (e.g., Case 3) where historical data is irrelevant but adjustments lack evidence. It also assumes "representative period" is knowable, which fails for unprecedented events (e.g., new regulations). Finally, confidence ratings may overstate precision when relying on broad classes, as industry standards can embed outdated assumptions. Use it to force discipline, not objectivity.
