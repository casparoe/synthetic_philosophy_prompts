  We are to bake in two constraints:
  - Defensibility: record the alternatives and why they were rejected.
  - Thin data: the procedure must handle when the narrow class is too thin.

  We are also to run the procedure on three cases.

  Procedure Design:

  We want to start with the most specific class and then broaden as needed, but we must avoid being too narrow if data is insufficient. We also want to consider the relevance of the class to the risk.

  Steps:

  Step 1: Start with the narrowest plausible class. We define "plausible" as having at least one exposure unit (so we have some data, even if minimal) and being logically relevant (e.g., same aircraft type, same city, same occupation). If we have no data at all for the narrowest class, we cannot use it as is.

