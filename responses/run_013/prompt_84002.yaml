prompt: |-
  Ok, so I've been teaching the regress argument for fifteen years and there's a move I keep running into that I've never found a name for, and it's starting to bug me.

  Every fall, when we get to foundationalism/coherentism/infinitism, some student says somthing like: why does my belief that there's a cup on the desk need a reason? Nobody's challenged it. If you want me to doubt it, you give me a reason. I used to treat that as a misunderstanding and steer back to the standard menu. But I keep meeting the same move in places where it doesn't look like a misunderstanding. A colleague in the law faculty: a judge can be asked to justify a ruling, but nobody has to justify the rule against hearsay itself every time a witness opens their mouth, and if you want a ruling reconsidered you have to file something, on time, with grounds. A friend who does stats consulting: you don't have to defend every default setting in a model, only the ones a reviewer actually flags, and the reviewer has to say what they think is wrong. I run my own grading the same way -- a claim in an essay needs no defence unless I circle it, and when I circle it I owe the student a reason.

  The pattern, as best I can put it: the regress doesn't get stopped, it never gets going, because the demand for a reason is conditional on something happening on the other person's side. Not a basic belief (nothing is exempt by its nature), not a loop, not an infinite chain that's supposed to be fine. A condition on when the demand is live at all. And its making me nervous for a reason I want priced: if the stopping point is 'no one has made a proper challenge yet', then what counts as a proper challenge starts to look like something the parties negotiate, and a stubborn enough person can shield anything.

  Two questions. (1) Does this have a name -- the family, or the specific version where the condition sits on the challenger's side? I know there's a cluster of views that sound adjacent (entitlements, hinges, defaults, whatever the contextualists are up to) but I've never been able to tell whether any of those is this move or four different moves. (2) If it has no name, coin one, but the name isn't what I'm after. What I want is the carving: the difference between 'this belief needs no support', 'this belief needs no support from you, here, now', and 'what you're asking for isn't the kind of thing that can be answered'. Is the third even the same phenomenon or just a cousin? And does the move actually terminate anything, or does it just push the regress back one step -- who justifies the challenge? If the honest answer is that it terminates only relative to a conversation, fine, but tell me what that costs, and whether the view can be stated without the stopping point coming out arbitrary.
reasoning: |-
  Okay, let me unpack this user's query. They've been teaching the regress argument for fifteen years and keep encountering a specific move from students and colleagues. The core idea is that a belief doesn't need justification unless properly challenged. The user wants to know if this has a name and how it fits into epistemological frameworks.

  First, I need to parse the examples: the student's cup belief, the law colleague's hearsay rule, the stats default settings, and the user's grading policy. The pattern is consistent—justification is conditional on a challenge meeting certain criteria. The user is worried this could allow stubborn people to shield unjustified beliefs by setting high bars for challenges.

  The user's main questions are: (1) Does this have a name? (2) How to carve the distinctions between different types of "no support needed" claims? They're also concerned about whether this actually stops the regress or just shifts it to justifying the challenge.

  I recall that elements of this appear in several philosophical areas. Wittgenstein's hinge propositions come to mind—beliefs that are exempt from doubt in a framework. But the user’s examples feel more procedural. Defeasible reasoning and default entitlements (like Brandom) seem relevant because they emphasize that justification is only required when challenged. 

  Contextualism is another angle. It suggests that the standards for justification vary by context. In a classroom, a cup's existence might not need defense, but in a skeptical debate, it would. This matches the user's grading analogy—circling a claim raises the standard.

  The user distinguishes three nuances: beliefs that inherently need no support, those that don’t need it here and now, and challenges that are unanswerable. The latter might relate to Carnap's idea that some questions are external to a framework and thus meaningless within it. 

  For naming, "Default Entitlement" or "Procedural Contextualism" might work. The key is the challenger's burden to initiate with a relevant objection. The regress doesn't start because the demand isn't triggered. But the user’s worry about arbitrariness is valid. If the challenger's criteria are too strict, bad beliefs persist. However, in practice, communities enforce norms—like peer review in stats or legal procedures. The stopping point isn't arbitrary but tied to communal standards.

  The cost is that this approach is pragmatic, not foundational. It avoids regress by shifting to dialogue norms, which can evolve. But it doesn't provide absolute certainty, which might dissatisfy some philosophers. Yet for everyday reasoning, it’s efficient and mirrors how we actually handle disputes.
answer: |-
  This is a brilliantly observed pattern, and your unease is philosophically significant. What you're encountering isn't a single doctrine, but a powerful *pragmatic and dialectical strategy* deeply embedded in human reasoning practices. It sits at the intersection of several philosophical currents. Here's the carving you requested:

  **(1) The Name(s) and Their Relations:**

  *   **Family Name:** **Dialectical Foundationalism / Procedural Contextualism / Default and Challenge Model.** This is the overarching family. It emphasizes that justification is inherently *dialectical* (a social practice of giving and asking for reasons) and *contextual* (dependent on the current state of the conversation, shared assumptions, and burdens).
  *   **Specific Move (Challenger's Burden):** **The Burden of Pertinent Challenge / Initiating the Dialectical Regress.** This is the core move you identified: the regress doesn't start automatically for every proposition; it must be *initiated* by a challenger presenting a *relevant*, *non-arbitrary*, and *specific* reason for doubt. The challenger bears the initial burden.
  *   **Adjacent Views - How They Connect:**
      *   **Entitlements (Crispin Wright, others):** These are warrants *to accept* a proposition *without* specific evidence *provided no specific reason for doubt has arisen*. This is very close. The key difference is that entitlements often have a *positive* epistemic status (a kind of warrant), while your move is more *procedural* (the demand hasn't been properly made yet). Entitlements often *ground* the default status your examples rely on.
      *   **Hinge Propositions (Wittgenstein, On Certainty):** These are propositions that are "exempt from doubt," not because they are indubitable, but because doubting them *undermines the entire framework* within which doubt and justification make sense (e.g., "There is an external world," "I have hands"). Your examples are often *less* fundamental hinges ("There's a cup," "This hearsay rule is valid *for this court*," "This default setting is standard *for this analysis*"). They function as *local* or *domain-specific* hinges *relative to the ongoing practice*. The challenger is questioning such a hinge, which requires them to step outside the current framework *and justify that move*.
      *   **Defaults (AI, Logic, Law):** This is the most direct conceptual link. A proposition is treated as *default true/justified* until a *specific override condition* is met (e.g., a challenge meeting certain criteria). Your examples perfectly illustrate default reasoning in practice. The challenger must provide the override.
      *   **Contextualism (Annoying Version: Cohen, DeRose):** Contextualism says the *standards* for justification (how much evidence, how secure the grounds need to be) shift with context. Your move is a *specific mechanism* often *implied* by contextualism: in a "low-stakes" context (casual chat, default model settings, uncontested essay point), the standards are low *to the point of non-existence* until a challenge raises the stakes. The challenger's action *changes the context* and thus the standards.
      *   **Defeasible Reasoning:** Reasoning where conclusions are held tentatively, subject to being overturned by new evidence (counterexamples, challenges). Your move highlights the *starting point*: default conclusions hold *until defeated*. The challenger provides the potential defeater.

  **The Specific Move You See:** It's best captured as **"The Burden of Pertinent Challenge" within a "Default and Challenge" model of justification.** The challenger must *do something specific* to activate the demand for justification. It's not that the belief is inherently basic; it's that *in this context, for these participants, right now*, demanding a reason for it is inappropriate *unless properly triggered*.

  **(2) The Carving and the Costs:**

  You've identified the crucial distinctions. Let's sharpen them:

  1.  **"This belief needs no support (Inherently Basic):"** (Traditional Foundationalism) - The belief possesses an intrinsic property (e.g., self-evidence, infallibility, incorrigibility) that makes it justification-conferring all by itself, independent of context or challenge. *Cost:* Identifying truly inherent properties is notoriously difficult; most candidates seem context-dependent. Your stubborn person *could* declare anything basic, but traditional foundationalism provides *some* constraints (even if debatable).
  2.  **"This belief needs no support *from you, here, now* (Default Status / No Pertinent Challenge):"** (Your Move) - The belief is treated as justified *given the current conversational context, shared assumptions, and lack of a relevant challenge.* Justification is a status conferred by the dialectical situation. *Cost:* It *is* vulnerable to stubbornness if the community norms for what constitutes a "pertinent challenge" are weak or the individual can control the context. However, this is mitigated by...
  3.  **"What you're asking for isn't the kind of thing that can be answered (Framework-Hinge / Category Mistake):"** (Hinge Propositions / Carnapian External Questions) - The challenge attempts to question something that functions as a rule enabling the language game of justification itself *within this framework*. Answering it *within* the framework is impossible, and answering it *outside* requires adopting a new framework (which itself has hinges). *Cost:* It risks dogmatism by immunizing core assumptions *too* completely. It might explain why some challenges seem incoherent or misplaced (e.g., demanding non-empirical proof of an empirical cup), but it's a stronger claim than your move. **Is it a cousin?** Yes, a close one. Your move (2) often *relies* on beliefs functioning *like* (3) within a specific context. The hearsay rule *is* a hinge for courtroom procedure; the cup's existence is a hinge for a perceptual claim. The difference is that (3) claims answering *is impossible* (in principle, within framework), while (2) says demanding an answer *is inappropriate* (in practice, right now, given no pertinent challenge). The stubborn person exploiting (2) might misuse the language of (3).

  **Does it Terminate the Regress? What's the Cost?**

  *   **Termination Mechanism:** It **terminates the *dialectical* regress *for now*.** It halts the demand for reasons *in this specific dialogue* by placing the ball firmly in the challenger's court. The regress doesn't "never get going" in principle; it gets *interrupted* or *preempted* by the procedural requirement for a valid challenge. The regress is conditional on the challenge being legitimate.
  *   **The Push-Back ("Who justifies the challenge?"):** This is the crucial point. The move *does* push the burden back, but **not into an infinite regress of its own**, and **this is key to its function and cost.**
      *   **Community Standards & Rationality Presumptions:** What constitutes a "proper challenge" isn't (usually) negotiated *de novo* each time. It relies on *implicit or explicit norms* of the relevant community (academic discipline, legal system, statistical practice, classroom rules). These norms are themselves subject to challenge and revision, *but not constantly*. They form a background framework. Furthermore, the challenger is typically presumed rational; their challenge is assumed to be *prima facie* worthy of consideration unless it blatantly violates norms (e.g., "Justify the cup! Because I feel like it!").
      *   **Cost 1: Relativity & Potential Arbitrariness:** The stopping point *is* relative to the conversation, the participants, and the background norms. This *is* its cost. It abandons the quest for an *absolute*, context-independent stopping point. Justification becomes inherently situated. The fear of the stubborn person shielding anything is real *if* they can control the context or subvert the norms. Robust communities mitigate this through peer review, legal procedures, methodological standards, etc., but it's not foolproof.
      *   **Cost 2: No Guarantee of Truth/Justification:** It provides *dialectical* stability, not necessarily *epistemic* security. A default can be wrong. The move protects the *process* of inquiry from paralysis, not necessarily its *outcomes* from error. The cost is accepting that justification is provisional and defeasible, grounded in practice, not foundational certainty.
      *   **Can it be stated without arbitrariness?** Not entirely, but it can be *less arbitrary* by appealing to **public, revisable, domain-specific norms of inquiry.** The rule against hearsay *is* justified within the legal system by precedent, legislation, and arguments about reliability – it's not arbitrary, even if it's not re-justified in every case. A statistical default setting is justified by methodological standards in the field. Your circling a claim appeals to shared standards of argumentation in the course. The "stopping point" is the current state of these communal practices. It's contingent and historical, not arbitrary in the sense of *random*, but it is contingent.

  **Conclusion:**

  The move you've identified for 15 years is the **"Burden of Pertinent Challenge" within a "Default and Challenge" model of dialectical justification.** It's deeply connected to Default Reasoning, Entitlements, Contextualism, and Hinge Propositions, emphasizing the *procedural* aspect of challenger initiation.

  It **terminates the *dialectical* regress** by making justification demands conditional on a relevant challenge meeting communal norms. This **pushes the burden back to the challenger**, but not into an infinite regress, because the norms governing "pertinent challenge" are provided by the background practices of the relevant community.

  The **cost** is accepting that justification is **relative to context, communal norms, and conversational practice.** It abandons the quest for an absolute, skeptic-proof foundation. The stopping point is **contingent but not (necessarily) arbitrary** – it rests on the (fallible, revisable) standards of the relevant epistemic community. The risk of stubbornness shielding bad beliefs is real but mitigated by the strength and critical nature of those communal norms. This move doesn't solve skepticism; it shows how we navigate reasoning *despite* the theoretical threat of regress, by embedding justification within social practices governed by norms. It's a feature of how knowledge actually works in the wild, not just in the epistemology seminar room.
