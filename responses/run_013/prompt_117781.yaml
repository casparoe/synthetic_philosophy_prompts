prompt: |-
  Last month I moved from Berlin to a mid-sized town in the US for a job, and I keep landing in these low-stakes fights about local customs. The one that's really gotten under my skin: my office mate says I have to tip 20% at the coffee place, and when I told him that back home nobody tips and it's not like anyone makes you, he said, when in Rome, do as the Romans do. Same line came up when I crossed an empty street against the light, and when I stood on the left side of the escalator, which apparently is the wrong side here. Now I genuinly can't tell whether he means 'this is just what people do', 'you'll look like an ass', 'you owe them', or something stronger, like I'm actually doing something wrong — morally wrong, not just rude.

  Can you lay out the different precise claims that slogan could be making? I want a menu I can argue from, not one answer: for each reading, what it commits you to, whether it's a platitude or contentious or flat out false, and which of them would actually get him to 'you have to' rather than 'it'd be easier if you did'. A few things I'd like the menu to sort out, since they're where I keep getting stuck:

  - Does 'the Romans do it' have to mean most people do it, or just that enough of them do it that the expectation is common knowledge? Someone told me that conventions in the technical sense are about expectations lining up rather than head counts — is that the same thing the slogan is doing, or a different animal?

  - Does it matter whether the practice is arbitrary versus one that actually helps or hurts people? If the tipping norm ends up screwing over the workers it's supposed to help, does that change the verdict?

  - How long do I have to be here before it stops being about me as a visitor? Does it apply to me if I'm a guest in someone's house but not if I've signed a lease? And is there a reading where the reason isn't on my side at all — where it's about what the locals are entitled to expect from me, so the obligation runs in the other direction?

  - Is there a reading that's just false — the relativist one where whatever the locals do is by definition right? Because that would make the slogan tell me the local treatment of, say, women or foreigners is above criticism, and I don't think that's what he meant, but I want to see where the line is.

  And at the end, tell me which reading people are usually reaching for when they use this line to end an argument like ours, and whether that reading can actually carry the weight.
reasoning: |-
  Okay, the user moved from Berlin to a mid-sized town in the US and keeps having disagreements about local customs like tipping, jaywalking, and escalator etiquette. Their office mate uses the "when in Rome" argument to insist they conform. The user is frustrated and wants to dissect this slogan to understand the different claims it might be making. 

  First, I need to unpack "when in Rome" into its possible interpretations. The user wants a "menu" of precise claims, so I'll categorize them into descriptive, prudential, and normative categories. The descriptive one is about what people actually do—whether it's a majority or just a common expectation. The user brought up conventions as expectations aligning, which connects to Lewis's theory; I should mention that but keep it accessible. 

  Next, the prudential angle: avoiding social friction. The user is clearly annoyed by the implication they'll "look like an ass," so I should clarify this is about self-interest, not morality. Then the normative claims—moral obligations based on reciprocity, harm prevention, or respect. The user seems skeptical about tipping being morally obligatory, especially if it harms workers, so I need to address whether the practice's consequences matter. 

  The user also asks about duration: when does "visitor" status end? This ties into social contract theory—consent through actions like signing a lease. And the relativist pitfall: they’re worried this slogan could justify unethical practices. I should emphasize that most people don’t mean this, but it’s a real boundary. 

  For the tipping example, the office mate’s "have to" likely mixes prudential and weak normative claims (e.g., "don’t stiff workers"). But the user suspects tipping might hurt workers—does that void the obligation? I’ll note that if a norm is harmful, the moral calculus shifts, but locally, defiance might still have costs. 

  Underlying all this: the user feels their autonomy is being dismissed. They want tools to push back, not just acquiesce. I’ll end by acknowledging their frustration—the slogan often shuts down debate, but they’re right to question it. Their deeper need is probably validation that their resistance isn’t just stubbornness, but reasoned.
answer: |-
  Here's your analytical "menu" for dissecting "when in Rome" claims, tailored to your frustrations:

  ### The "Menu" of Interpretations

  1.  **Descriptive Claim ("The Romans Actually Do This"):**
      *   **Meaning:** This is a statement of fact about what the local majority (or a significant, visible group) *actually does*.
      *   **Commitment:** Requires evidence that a behavior is widespread and observable locally. It might be "common knowledge" (shared expectation) even if not 100% practiced.
      *   **Status:** Often a platitude, but can be contentious (e.g., "Do *most* people *really* tip 20% for coffee?" vs. "Is 15% still acceptable?"). Head counts vs. expectations matter: Strong conventions exist because *enough* people follow them *and* expect others to, creating the norm. The slogan often blurs "is" and "ought."
      *   **Gets to "Have To"?** No. Knowing what others do doesn't logically imply you *should* do it (the "is-ought gap").
      *   **Your Sticking Points:** It's often about the *expectation* being common knowledge, not a strict headcount. For tipping, the expectation (15-20% in cafes) *is* common knowledge in the US, even if some locals stiff the barista.

  2.  **Prudential Claim ("Do This to Avoid Negative Consequences"):**
      *   **Meaning:** Conforming makes your life easier, avoids social friction, prevents people thinking you're rude/an ass, or dodges practical hassles (e.g., being yelled at on the escalator, getting dirty looks, worse service next time).
      *   **Commitment:** Acting in your rational self-interest to minimize social cost.
      *   **Status:** Generally true for minor conventions (escalators, jaywalking enforcement levels). Contentious when the "cost" is exaggerated or the practice is harmful. Often the *core* pragmatic meaning of the slogan.
      *   **Gets to "Have To"?** Yes, in a practical sense ("You *have to* to avoid X negative outcome"). Not a moral "have to," but a strong recommendation for smooth sailing.
      *   **Your Sticking Points:** This is likely a big part of what your colleague means, especially regarding "looking like an ass." The harm/benefit matters *here*: If tipping genuinely harms workers *and* you're willing to accept the social cost of not tipping, the prudential reason weakens.

  3.  **Weak Normative Claim of Reciprocity/Cooperation ("Don't Freeload on the System"):**
      *   **Meaning:** Participating in local customs (especially beneficial ones) is fair play. You benefit from social coordination (orderly streets, escalator flow, service industry existing with livable-ish wages via tips) so you should contribute.
      *   **Commitment:** A basic principle of fairness and social cooperation.
      *   **Status:** A widely accepted, moderately strong moral principle (like not littering). Contentious if the "system" is unjust or participation harms others.
      *   **Gets to "Have To"?** Can get to a weak moral "should," especially for conventions enabling public goods (like traffic flow). For tipping, it frames it as upholding the (flawed) system workers rely on.
      *   **Your Sticking Points:** Duration matters less here – you benefit *now*. The obligation runs *to the local system/society* you're engaging with. Harm analysis is CRUCIAL: If tipping *hurts* workers (e.g., enables sub-minimum wages, creates instability), this obligation weakens or reverses.

  4.  **Normative Claim of Respect ("Show Respect for Local Culture/People"):**
      *   **Meaning:** Conforming demonstrates respect for the community you're in and its members. It acknowledges their way of doing things has value *to them*.
      *   **Commitment:** Acknowledging the inherent value of cultural difference and showing basic consideration.
      *   **Status:** A strong, widely held moral principle. Contentious when the practice conflicts with deeper moral values (see Relativism pitfall).
      *   **Gets to "Have To"?** Can get to a strong moral "should" for minor, non-harmful conventions (escalators, crossing signals). Less forceful for contested practices like tipping.
      *   **Your Sticking Points:** Harm matters! Respect doesn't require participating in harmful practices. Duration matters for *depth* of belonging, but respect applies even to short-term guests. The obligation runs *to the local people* (respecting their norms).

  5.  **Strong Normative Claim of Local Moral Authority ("Local Practice Defines Right/Wrong Here"):**
      *   **Meaning:** Morality *is* determined by local custom. What Romans do *is* right *because* they do it.
      *   **Commitment:** Radical cultural relativism.
      *   **Status:** Highly contentious and generally rejected as false. Leads to unacceptable conclusions (justifying sexism, racism, etc., if locally practiced). *Not* what most people mean by the slogan.
      *   **Gets to "Have To"?** Yes, but based on a flawed premise. Creates a moral "have to" for *any* local practice.
      *   **Your Sticking Points:** **This is the false reading.** The slogan *cannot* consistently mean this without becoming morally indefensible. It's the line *not* to cross. Your colleague almost certainly doesn't mean this.

  **Applying the Menu to Your Situations:**

  *   **Tipping (20% at Coffee):**
      *   *Descriptive:* True, the expectation exists.
      *   *Prudential:* Very strong – avoids social friction, looks stingy/ignorant otherwise, *might* affect service.
      *   *Reciprocity:* Strong *if* you accept the system – you benefit from the service model, so participate.
      *   *Respect:* Moderate – it's a deeply ingrained, emotionally charged custom.
      *   *Local Moral Authority:* False. Tipping's morality is debatable.
      *   **Colleague's "Have To":** Likely mixes Prudential ("avoid looking bad") and Reciprocity ("support the system workers rely on"). The *strength* comes from the very real social & practical costs of not tipping in the US system.

  *   **Crossing Empty Street / Escalator Side:**
      *   *Descriptive:* True, local norms exist.
      *   *Prudential:* Strong for escalator (avoids annoyance/conflict), weaker for jaywalking if truly empty (but can still risk tickets or ire).
      *   *Reciprocity:* Strong – maintains predictable flow/safety for others.
      *   *Respect:* Moderate – shows you acknowledge local order.
      *   *Local Moral Authority:* False.
      *   **Colleague's "Have To":** Primarily Prudential and Reciprocity for smooth social functioning.

  **Answers to Your Specific Questions:**

  1.  **"The Romans do it":** Usually means the *expectation* is common knowledge and widely enough followed to be the norm. It's about the convention, not a strict majority headcount at every moment.
  2.  **Arbitrary vs. Harmful:** Crucial distinction!
      *   *Arbitrary (Escalator side, Jaywalking strictness):* Conformity is primarily about Prudential/Reciprocity/Respect. Easy to justify "when in Rome."
      *   *Harmful/Potentially Unjust (Tipping structure, deeper injustices):* Conformity loses moral force (Reciprocity/Respect arguments weaken) and may even create a moral obligation *to resist*. The slogan struggles here.
  3.  **Duration/Local Entitlement:**
      *   *Visitor Threshold:* Fuzzy, but weakens quickly. As you engage long-term (job, lease), Prudential/Reciprocity arguments strengthen significantly. Respect applies immediately.
      *   *Obligation Direction:* The Reciprocity and Respect arguments frame the obligation as *owed to the local community/system* you are choosing to participate in. You signed the lease, took the job – you engage the local "contract."
  4.  **The False Reading (Relativism):** Yes, the "Local Moral Authority" claim is false and dangerous. The slogan *cannot* coherently mean this without self-destructing. Your colleague isn't invoking this.

  **What People Usually Mean & Can It Carry the Weight?**

  *   **Usual Meaning:** A **blended appeal** primarily to **Prudential** (avoid friction/looking bad) and **Reciprocity/Cooperation** (don't freeload, uphold the system), often with a dash of **Respect**. The Descriptive claim is the starting point ("*This is* what we do here").
  *   **Can It Carry the Weight ("You HAVE TO")?**
      *   **For Minor Conventions (Escalator, Jaywalking):** Yes, easily. The Prudential and Reciprocity arguments are strong and uncontroversial. Conforming is low-cost and high-benefit for social harmony.
      *   **For Contested/Flawed Systems (Tipping):** **It carries significant weight pragmatically (Prudential argument is strong in the US context), but the *moral* "have to" (Reciprocity/Respect) is debatable.** The slogan *can* get to a practical "have to" (to avoid significant social cost) and a weak-to-moderate moral "should" (based on cooperating with the existing system workers depend on). However, it **cannot** silence criticism of the system itself. If you believe the system is harmful, the moral argument for conformity weakens, though the prudential cost remains.

  **Your Path Forward:** Recognize the slogan's core is usually pragmatic (Prudential/Reciprocity). For things like escalators or jaywalking enforcement, conforming is the easy path to social peace. For tipping, understand the *practical necessity* within the US system (workers rely on it, stiffing them *is* socially frowned upon for good reason within that system). You can critique the system while still participating to avoid harming individual workers *right now* and facing social backlash. Save your principled stands for issues where the harm is clearer and the stakes are higher. Pick your battles based on the cost (to you and others) and the nature of the norm.
