  ### Grading and Feedback

  **Total Grade: 17/20**  
  - Part (a): 7/7  
  - Part (b): 7/7  
  - Part (c): 3/6  

  #### Part (a) (7/7)  
  **Strengths:**  
  - **Definitions:** Correctly defines strict and weak dominance by a mixed strategy:  
    - Strict: \(u_i(\sigma, s_{-i}) > u_i(s, s_{-i})\) for all \(s_{-i} \in S_{-i}\).  
    - Weak: \(u_i(\sigma, s_{-i}) \geq u_i(s, s_{-i})\) for all \(s_{-i}\), with strict inequality for at least one \(s_{-i}\).  
  - **Linearity note:** Correctly observes that payoffs are linear in mixtures (i.e., \(u_i(\sigma, s_{-i})\) is the expected payoff over \(\sigma\)).  
  - **Example:** Provides a valid game where Strategy 3 is strictly dominated by the mixed strategy \(\frac{1}{2}\text{Strategy 1} + \frac{1}{2}\text{Strategy 2}\) but not by any pure strategy. Verification is complete:  
    - Mixed strategy yields 1.5 > 1 against both L and R.  
    - Strategy 1 fails against R (0 < 1), and Strategy 2 fails against L (0 < 1).  

  **Weaknesses:** None.  
  **Verdict:** Full credit. Definitions are precise, and the example is well-constructed and verified.  

  ---  
  #### Part (b) (7/7)  
  **Strengths:**  
  - **Order-independence of strict elimination:** Correctly explains that strict domination cannot be "acquired" during elimination (i.e., if a strategy is not strictly dominated initially, it remains so after deletions). This implies the final set is order-independent.  
  - **Example for weak elimination:** Provides a game and two elimination orders yielding different outcomes:  
    - Order 1: Eliminate B (weakly dominated by T), then eliminate L (weakly dominated by R). Outcome: {(T,R)}.  
    - Order 2: Eliminate L (weakly dominated by R), then no further elimination. Outcome: {(T,R), (B,R)}.  
  - **Nash equilibrium note:** Correctly observes that (B,R) is a Nash equilibrium, reinforcing that weak elimination can eliminate equilibria (though not required by the question).  

  **Weaknesses:** None.  
  **Verdict:** Full credit. Explanation is clear, and the example effectively demonstrates order dependence. The Nash remark, while extraneous, does not detract.  

  ---  
  #### Part (c) (3/6)  
  **Strengths:**  
  - **Best response definition:** Correctly defines a best response to a belief (maximizes expected payoff).  
  - **Strict dominance and best responses:** Correctly argues that strictly dominated strategies are never best responses. If \(\sigma\) strictly dominates \(s\), \(E[u_i(\sigma)] > E[u_i(s)]\) for all beliefs, so \(s\) cannot be optimal.  
  - **Rationality justification:** Correctly links strict dominance elimination to rationality and common knowledge of rationality (CKR): rational players avoid never-best-response strategies, and CKR justifies iterative removal.  

  **Weaknesses:**  
  - **False claim about weak dominance:** Incorrectly states that weakly dominated strategies are never best responses:  
    - **Error:** The claim is false. Weakly dominated strategies *can* be best responses to some beliefs.  
    - **Counterexample:** In part (b)'s game, B (weakly dominated by T) is a best response to the belief that player 2 plays R (both B and T yield 0).  
    - **Flawed justification:** The student argues that weak inequalities imply \(s\) is never optimal, but this is incorrect. Weak dominance only ensures \(E[u_i(\sigma)] \geq E[u_i(s)]\) for all beliefs, with strict inequality for some beliefs, but \(s\) may still tie with \(\sigma\) (or others) under specific beliefs and be a best response.  
  - **Incorrect justification for weak elimination:** Asserts that weak elimination is justified by rationality and CKR, but this is untrue. CKR alone does not justify eliminating weakly dominated strategies because they *can* be rational choices (as best responses). Weak elimination requires stronger assumptions (e.g., "caution" or full-support beliefs).  

  **Verdict:** Partial credit. The strict dominance portion is correct (2 points), but the weak dominance claim is false and undermines the justification (1 point for partial relevance). Deducted 3 points for the significant error.  

  ---  
  ### Key Improvements Needed  
  1. **Correct the weak dominance/best response relationship in (c):** Weakly dominated strategies *can* be best responses (e.g., B in part (b)'s game when player 2 plays R). Revise to: "Weakly dominated strategies are never *unique* best responses but can be best responses (even if tied)."  
  2. **Refine justification for weak elimination:** Rationality and CKR justify iterative *strict* dominance elimination but not weak elimination. For weak elimination, add that players must avoid weakly dominated strategies under stronger assumptions (e.g., "cautious rationality" or lexicographic beliefs).  
  3. **Clarify the Nash equilibrium remark in (b):** While not wrong, it is superfluous. Focus on the order-dependence point to avoid distraction.  

  **Overall:** A strong answer except for the critical error in (c). The examples in (a) and (b) are exemplary and support the claims made.
