  Below is an exam question from a closed-book midterm in a first-year graduate course in game theory, followed by the answer one of my students submitted for it. I am the instructor and need to grade that answer.

  Please assign it a grade out of 20 — the three parts are worth 7, 7 and 6 points, so I would like the total as well as the points you would give each part — and then justify the grade with specific comments rather than a general impression. For each substantive claim the student makes, indicate whether the claim is correct; where it is not correct, identify precisely what has gone wrong (a false claim, a claim that holds only under a restriction the student has not mentioned, a step that does not follow from what precedes it, an example that does not establish what it is offered to establish, and so on) and state what the correct claim would be. Distinguish clearly between a claim's being false and its justification's being inadequate. Please also note where the student's examples bear on claims made elsewhere in the answer, whether by supporting them or by undercutting them. Finally, list the two or three changes that would most improve the answer.

  Here is the question.

  **Question 3.** Throughout, fix a finite normal-form game with finitely many players and finitely many pure strategies per player, and allow mixed strategies throughout.

  (a) For a player *i* and a pure strategy *s* of hers, define precisely what it is for *s* to be strictly dominated and what it is for *s* to be weakly dominated, in each case permitting the dominating strategy to be mixed. Then give an example of a game in which some pure strategy is strictly dominated by a mixed strategy but is not strictly dominated by any pure strategy, and verify that your example has the required property.

  (b) Iterated elimination of strictly dominated strategies is order-independent, whereas iterated elimination of weakly dominated strategies is not. Explain why, and give an explicit game together with two orders of elimination under the weak-dominance procedure that leave different sets of strategies.

  (c) Explain the relation between the notions of strict and weak dominance and the notion of a best response, and say how that relation bears on the justification of iterated elimination as a procedure driven by assumptions of rationality and common knowledge of rationality.

  Here is the student's answer.

  **(a)** Fix a player *i* and one of her pure strategies *s*, and write *S*₋ᵢ for the set of strategy profiles available to the other players. A mixed strategy σ of player *i* strictly dominates *s* if *u*ᵢ(σ, *s*₋ᵢ) > *u*ᵢ(*s*, *s*₋ᵢ) for every *s*₋ᵢ ∈ *S*₋ᵢ; *s* is strictly dominated if some such σ exists. If all of these inequalities are weak and at least one of them is strict, then σ weakly dominates *s*, and *s* is weakly dominated if some such σ exists. Payoffs are linear in a player's own mixture, so *u*ᵢ(σ, *s*₋ᵢ) is the σ-weighted average of the payoffs of the pure strategies in the support of σ; this is why allowing mixed strategies on the dominating side is not a cosmetic change.

  An example where it matters: let player 1 have three pure strategies and player 2 two, and let player 1's payoffs be

  |  | L | R |
  |---|---|---|
  | Strategy 1 | 3 | 0 |
  | Strategy 2 | 0 | 3 |
  | Strategy 3 | 1 | 1 |

  (Player 2's payoffs are irrelevant to the point and can be filled in however we like, since dominance is a condition on player 1's payoffs alone.) The mixture ½ Strategy 1 + ½ Strategy 2 pays 1.5 against L and 1.5 against R, so it strictly dominates Strategy 3. But neither Strategy 1 nor Strategy 2 strictly dominates Strategy 3 on its own, since Strategy 1 pays less against R (0 < 1) and Strategy 2 pays less against L (0 < 1). So Strategy 3 would survive a procedure that compared pure strategies only with pure strategies.

  **(b)** The strict procedure is order-independent. The reason is that strict domination is not something a strategy can acquire: if *s* is not strictly dominated in the game as given, then *s* is not strictly dominated after any number of deletions either, since deletions only remove alternatives from the game and never add any. It follows that the set of strategies that will be eliminated is fixed before the procedure begins, and the order of removal cannot affect where we end up.

  Weak dominance behaves quite differently. Consider

  |  | L | R |
  |---|---|---|
  | T | 1, 1 | 0, 2 |
  | B | 0, 0 | 0, 0 |

  where each cell lists the row player's payoff first and then the column player's. Player 1's T weakly dominates B (1 > 0 against L, 0 = 0 against R), and player 2's R weakly dominates L (2 > 1 against T, 0 = 0 against B). Now eliminate in two different orders. If we first delete B, the remaining row is T against the columns {L, R}, and there R weakly dominates L (2 > 1), so L goes too, leaving the single profile (T, R). If instead we first delete L, the remaining game has rows {T, B} against the single column R, and now neither row weakly dominates the other, since both pay 0 against R; so nothing further is eliminated, and both (T, R) and (B, R) survive. Since (B, R) is a Nash equilibrium of the original game — B pays 0 against R, which is as much as T pays, and R pays 0 against B, which is as much as L pays — this shows both that the surviving set depends on the order of elimination and that eliminating weakly dominated strategies can eliminate Nash equilibria.

  **(c)** A strategy is a best response to a belief — a probability distribution over the other players' strategy profiles — if it maximises expected payoff among the player's strategies against that belief. Strictly dominated strategies are never best responses: if σ pays strictly more than *s* against every profile the others might play, then σ pays strictly more than *s* in expectation against every belief, so *s* can never maximise. Weakly dominated strategies are never best responses either; the only difference from the strict case is that the dominating strategy need not beat *s* in every contingency, so the argument goes through with weak inequalities rather than strict ones. Since no rational player plays a strategy that can never be optimal, and since each successive round of elimination can be underwritten by one further level of the assumption that the players are rational and know one another to be rational, iterated elimination of dominated strategies — whether strict or weak — is justified by rationality together with common knowledge of rationality.
reasoning: |-
  We are grading a student's answer to a three-part question on game theory. The parts are (a), (b), and (c) with point values 7, 7, and 6 respectively. We will assign points for each part and then a total out of 20.

  We must evaluate each substantive claim, note when a claim is correct, and when it is not, we must identify the issue (false claim, missing restriction, non sequitur, inadequate example, etc.). We will also note where examples support or undercut claims and suggest the top 2-3 improvements.

  Let's break down the student's answer by part.

  ### Part (a) (7 points)

  The student's answer:

  - **Definitions**: 
    - Strict dominance: A mixed strategy σ strictly dominates a pure strategy s_i if u_i(σ, s_{-i}) > u_i(s_i, s_{-i}) for every s_{-i} ∈ S_{-i}.
    - Weak dominance: A mixed strategy σ weakly dominates s_i if u_i(σ, s_{-i}) ≥ u_i(s_i, s_{-i}) for every s_{-i}, and there exists at least one s_{-i} for which the inequality is strict.

    These definitions are correct.

  - **Note on linearity**: The student correctly notes that payoffs are linear in a player's own mixture, so u_i(σ, s_{-i}) is the expected payoff. This is correct and relevant.

  - **Example**:
    - The game: 
      - Player 1 has strategies: 1, 2, 3.
      - Player 2 has strategies: L, R.
      - Payoffs for player 1 (player 2's payoffs irrelevant):
          - (1,L): 3, (1,R): 0
          - (2,L): 0, (2,R): 3
          - (3,L): 1, (3,R): 1

    - The mixture 0.5*1 + 0.5*2 yields:
        - Against L: 0.5*3 + 0.5*0 = 1.5
        - Against R: 0.5*0 + 0.5*3 = 1.5
    - This strictly dominates strategy 3 (which gets 1 against both) because 1.5 > 1 in both cases.

    - The student then checks that no pure strategy dominates 3:
        - Strategy 1 vs 3: against L (3>1) but against R (0<1) -> not strict dominance.
        - Strategy 2 vs 3: against R (3>1) but against L (0<1) -> not strict dominance.

    The example is correct and satisfies the requirement: strategy 3 is strictly dominated by a mixed strategy but not by any pure strategy.

  Evaluation of part (a):
  - The definitions are precise and correct.
  - The example is well-chosen and the verification is complete.
  - The note on linearity is correct and adds clarity.

  This part is excellent. We award full points: 7/7.

  ### Part (b) (7 points)

  The student's answer:

  - **Explanation for strict dominance order-independence**: 
    - Claim: Strict domination is not something a strategy can acquire. If a strategy is not strictly dominated initially, it won't be after deletions because deletions only remove alternatives and never add any. Therefore, the set of strategies to be eliminated is fixed, so the order doesn't matter.

    This is a standard and correct explanation. The key point is that if a strategy is strictly dominated in the full game, it remains so in any subgame that includes it (because the dominating strategy is still available and the conditions are defined for every opponent profile). Conversely, if it wasn't dominated initially, it won't become dominated later. Thus the set eliminated is predetermined.

  - **Explanation for weak dominance not being order-independent**:
    - The student gives an example game:

          |   | L   | R   |
          | T | 1,1 | 0,2 |
          | B | 0,0 | 0,0 |

    - The payoffs are written as (row player, column player). So:
        - (T,L): (1,1), (T,R): (0,2)
        - (B,L): (0,0), (B,R): (0,0)

    - Player 1: T weakly dominates B (because against L: 1>0, against R: 0=0).
    - Player 2: R weakly dominates L (because against T: 2>1, against B: 0=0).

    - Two orders:
        - Order 1: First eliminate B (weakly dominated by T). Then the game becomes:

              |   | L   | R   |
              | T | 1,1 | 0,2 |

          Now, for player 2, R weakly dominates L (against T: 2>1) and L is eliminated. Result: (T,R).

        - Order 2: First eliminate L (weakly dominated by R). Then the game becomes:

              |   | R   |
              | T | 0,2 |
              | B | 0,0 |

          Now, in the subgame, player 1 has T and B, both paying 0 against R. So neither weakly dominates the other (since for weak dominance we require at least one strict inequality). Therefore, no further elimination. The surviving strategies are T and B for player 1 and R for player 2, i.e., profiles (T,R) and (B,R).

    - The student notes that the surviving sets are different: { (T,R) } vs { (T,R), (B,R) }.

    - The student also notes that (B,R) is a Nash equilibrium of the original game. This is true because:
        - Given player 2 plays R, player 1 gets 0 from T and 0 from B -> both are best responses.
        - Given player 1 plays B, player 2 gets 0 from R (and from L, but L is not played) -> R is a best response.

    This example correctly shows that the outcome of iterated elimination of weakly dominated strategies depends on the order.

  Evaluation of part (b):
  - The explanation for strict dominance order-independence is correct.
  - The example for weak dominance order-dependence is well-chosen and correctly analyzed.
  - The note about Nash equilibrium is not required by the question but is correct and does not harm the answer.

  However, there is one issue: the student claims that (B,R) is a Nash equilibrium. This is true, but the question does not require this. The example is sufficient without it. But the example is correct and the two orders lead to different outcomes.

  This part is also excellent. We award full points: 7/7.

  ### Part (c) (6 points)

  The student's answer:

  - **Relation to best response**:
    - A strategy is a best response to a belief (a probability distribution over opponents' strategy profiles) if it maximizes expected payoff against that belief.

    - Strictly dominated strategies: 
        - Claim: If σ strictly dominates s, then for any belief, the expected payoff of σ is strictly greater than that of s. Therefore, s is never a best response.

      This is correct.

    - Weakly dominated strategies:
        - Claim: Weakly dominated strategies are never best responses either. The argument is the same but with weak inequalities.

      This claim is **incorrect**. 

      Why? A weakly dominated strategy can be a best response to some beliefs. The student's argument is that if σ weakly dominates s, then for every opponent profile, σ does at least as well as s and better in at least one. However, this does not imply that s is never a best response. Consider a belief that assigns positive probability only to the profiles where σ does not strictly beat s (i.e., where they are equal). Then s and σ (and other strategies) might yield the same expected payoff, so s could be a best response.

      Example: In the game from part (b), strategy B of player 1 is weakly dominated by T. However, if player 1 believes that player 2 will play R for sure, then both T and B yield 0. So B is a best response to the belief that player 2 plays R.

      Therefore, the student's claim that "weakly dominated strategies are never best responses" is false.

  - **Justification for iterated elimination**:
    - The student argues that since no rational player plays a strategy that is never a best response (i.e., a dominated strategy), then iterated elimination (of both strict and weak) is justified by rationality and common knowledge of rationality.

    However, this argument is only valid for strict dominance. For weak dominance, the justification is more subtle because a weakly dominated strategy might be a best response to some beliefs. Therefore, common knowledge of rationality does not necessarily justify eliminating weakly dominated strategies at every step.

    Specifically, for weak dominance: 
        - In the first round, a weakly dominated strategy might be eliminated on the grounds that it is not the unique best response to any belief? Or that it is not rational to play it if there exists another strategy that is sometimes better and never worse? But note that common knowledge of rationality alone does not rule out playing a weakly dominated strategy because it might be a best response to some belief.

    The standard understanding is that iterated elimination of strictly dominated strategies (IESDS) is justified by common knowledge of rationality. However, for iterated elimination of weakly dominated strategies (IEWDS), the justification is more problematic because the elimination process can remove Nash equilibria (as the student noted in part (b)) and because weakly dominated strategies might be played in equilibrium.

    The student's claim that IEWDS is justified by rationality and common knowledge of rationality is therefore not entirely correct.

  Evaluation of part (c):
  - The definition of best response is correct.
  - The claim about strictly dominated strategies is correct and well stated.
  - The claim about weakly dominated strategies is false. The student incorrectly asserts that they are never best responses. This is a significant error.
  - The justification for iterated elimination is correctly applied to strict dominance but incorrectly extended to weak dominance without qualification.

  Given that the error is substantial and central to the question, we must deduct points. The part is worth 6 points. We break down:

  - Correct explanation for strict dominance: 2 points.
  - Incorrect claim for weak dominance: 0 points for that part (since it is false) and the justification for IEWDS is flawed.
  - The overall relation to best response is only half correct.

  We assign 3 points out of 6 for part (c). The student gets credit for the strict dominance part and the general setup, but the error about weak dominance is critical.

  ### Summary of Grades:
  - Part (a): 7/7
  - Part (b): 7/7
  - Part (c): 3/6
  - Total: 7 + 7 + 3 = 17 out of 20.

  ### Specific Comments by Part:

  **Part (a):**
  - Correct definitions of strict and weak dominance with mixed strategies.
  - The example is correct and well-verified.
  - The note on linearity is appropriate.
  - Full marks.

  **Part (b):**
  - Correct explanation for order-independence of strict dominance: the argument about non-acquisition of strict domination is standard and accurate.
  - The example for weak dominance order-dependence is excellent and clearly shows two different outcomes.
  - The additional note about Nash equilibrium is not necessary but correct and does not detract.
  - Full marks.

  **Part (c):**
  - Correct definition of best response.
  - Correct claim and reasoning about strictly dominated strategies never being best responses.
  - **Major error**: The claim that weakly dominated strategies are never best responses is false. A counterexample is the strategy B in the game from part (b) when the opponent plays R: B yields 0, which is the same as T, so it is a best response to the belief that player 2 plays R. The student's argument fails because even though σ weakly dominates s, there might be beliefs that assign zero probability to the profiles where σ strictly beats s, so s can be a best response.
  - As a result, the justification for iterated elimination of weakly dominated strategies (IEWDS) based solely on rationality and common knowledge of rationality is flawed. The standard justification for IEWDS requires stronger assumptions (such as caution or admissibility) because common knowledge of rationality does not eliminate the possibility of playing a weakly dominated strategy that is a best response to some belief.

  ### Suggestions for Improvement:
  1. **Correct the claim about weak domination and best responses in part (c):** The student should note that while strictly dominated strategies are never best responses, weakly dominated strategies can be best responses to some beliefs. Therefore, the justification for iterated elimination of weakly dominated strategies is not as straightforward as for strict dominance and requires additional assumptions (e.g., that players never play a weakly dominated strategy because they consider the possibility that any opponent strategy might be played, however unlikely).

  2. **Refine the justification for IEWDS:** The student should acknowledge that common knowledge of rationality alone does not justify IEWDS because it allows players to hold beliefs that make a weakly dominated strategy a best response. Instead, one must assume that players are "cautious" or have "full support" beliefs to justify eliminating weakly dominated strategies.

  3. **Clarify the relation between dominance and best responses:** The student should explicitly state the difference: strict dominance implies never being a best response, but weak dominance does not. The converse is also important: if a strategy is never a best response, then it is strictly dominated (by a mixed strategy). For weak dominance, the relation is more complex.

  ### Conclusion:
  - Total grade: 17/20 (breakdown: a:7, b:7, c:3)
