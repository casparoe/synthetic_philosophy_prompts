prompt: |-
  Ok, I've been roped into giving a one-off session in a colleague's second-year Gospels course. Officially I'm there as the philosophy department's epistemology person, and the topic is the criteria of authenticity in historical Jesus research (dissimilarity, embarrassment, multiple attestation, coherence, the Aramaic and Palestinian-environment ones, and the rest). Don't explain the criteria to me, I know them. What I want from you is a teaching plan.

  Seventy-five minutes, about twenty-five undergrads, they've read chunks of the gospels and basically no secondary literature. What I care about most is the order of the pieces. What has to be in place before the first criterion even makes sense to them? My own guess is that it's the distinction between an authentic saying and a picture of the historical Jesus, plus the idea that a criterion is a defeasible tie-breaker rather than a test with a pass mark, but tell me if something else has to come first and exactly what.

  Then: which single example should carry the whole thing? I was going to run it off the criterion of embarrassment, using something the early church would have had obvious reason to drop, but is that the right carrier, and why not dissimilarity, since that's the one they'll have half-heard of already? What does the carrying example have to have, and what would make it backfire?

  Misconceptions I expect, and want mapped onto points in the sequence: that the criteria are additive and can be tallied and voted on; that multiple attestation means counting Matthew, Mark and Luke as three independent witnesses; that dissimilarity delivers a neutral Jesus rather than one manufactured to be unlike both his Jewish setting and the church that remembered him; and that the whole enterprise is either objective science or hopelessly subjective with nothing in between. Where in the hour does each one get headed off, and which of them should I deliberately leave as a live question rather than close?

  And this is the part I actually care about philosophically: I want them to leave seeing the criteria as presumptions that move a burden of proof rather than instruments that find facts, i.e. as a local instance of the old problem of the criterion, where the tools seem to presuppose the very picture of Jesus they're supposed to license. Is that too much for this audience at this stage, and if it isn't, where does it go so that it lands as a payoff rather than a gotcha?

  Last two things. Give me one question I can put to them in the final five minutes that would show whether the idea landed, as opposed to whether they can just recite a list of criteria. And tell me what I should openly say I'm not going to cover at this level.
reasoning: |-
  Okay, the user is an epistemology professor preparing a guest lecture on historical Jesus criteria for a Gospels class. They need a structured teaching plan focusing on conceptual sequencing rather than content explanation. 

  Hmm, their core concern is ontological scaffolding - what foundational concepts must precede the criteria to prevent misunderstandings. They're spot-on about starting with the authentic saying vs. historical Jesus distinction, but I'd add the "burden of proof" framing earlier. The criteria-as-tiebreakers point is crucial too - this isn't binary verification but probabilistic reasoning.

  For the carrier example... embarrassment is better than dissimilarity here. Dissimilarity's methodological flaws might derail novices, while embarrassment's logic (why preserve damaging material?) is intuitively graspable. The baptism story works perfectly - early church wouldn't invent John baptizing Jesus. But must preempt the "additive criteria" misconception upfront by emphasizing these are heuristics, not math.

  Ah, the philosophical payoff! The problem of criterion is absolutely achievable if anchored to the coherence criterion. Show how selecting which traditions "cohere" already assumes a Jesus-model. That "presupposition vs. discovery" tension should emerge organically when comparing criteria.

  Final question needs to reveal if they grasp the epistemological humility: "If two scholars apply the same criteria but get different Jesus portraits, does that mean the criteria failed?" Perfect - exposes the tool-as-presumption reality.

  Should explicitly exclude: criteria evolution debates, criterion of rejection, and any deep dive into specific scholars. Keep it conceptual. 

  *adjusts mental lesson plan* Need to flag the Palestinian environment criterion as most easily misunderstood - students will equate it with "sounds folksy" rather than contextual plausibility. Multiple attestation's independence problem must be addressed when defining it.
answer: |-
  Here's a structured 75-minute teaching plan focused on conceptual sequencing, addressing misconceptions, and landing your philosophical payoff – designed for second-year undergrads with limited background:

  **Core Conceptual Sequence (The "Must-Haves" First):**

  1.  **(5 min) Hook & Framing: The Core Problem**
      *   Start with: "Why is figuring out what the *historical* Jesus actually said/did *hard*? We have these texts (Gospels), written decades later, by believers, for theological purposes. How do historians work with that?"
      *   **Key Distinction #1:** Explicitly state: "Our goal isn't necessarily to find 'authentic sayings' like nuggets of gold. It's to build the *most plausible historical picture* of Jesus of Nazareth. Individual sayings/events are pieces of evidence *towards* that picture." *(This combats the "authentic saying as endpoint" misconception)*

  2.  **(10 min) The Nature of the Evidence & Burden of Proof**
      *   Briefly: Gospels = faith documents, written later, with theological agendas. Not court transcripts or dispassionate biographies.
      *   **Foundational Concept:** Introduce the idea of **"Burden of Proof."** Historians start with a *presumption*: material in the Gospels *might* reflect later church beliefs/theology rather than the historical Jesus. **The burden is on the historian to argue *why* a particular saying or event *is likely* to go back to Jesus himself.** *(This sets up the criteria as tools for shifting the burden)*.
      *   **Key Distinction #2:** Clarify: "A criterion isn't a pass/fail test ('This saying is 70% authentic!'). It's a **defeasible reason** to think the burden of proof *might be met* for a particular item. It makes an item *more plausible*, not *proven*." *(Combats "additive tallying" and "pass mark" misconceptions)*.

  3.  **(15 min) Introducing Criteria: The "Carrier" Example - Embarrassment**
      *   **Why Embarrassment First?**
          *   **Intuitive:** The logic ("Why would they make up something awkward?") is immediately graspable.
          *   **Less Methodologically Baggage:** Dissimilarity's flaws (creating a "neutral" Jesus, severing context) are complex and potentially derailing for beginners. Embarrassment is cleaner.
          *   **Strong Example:** **Jesus' Baptism by John (Mark 1:9-11, Matt 3:13-17).**
      *   **Walkthrough:**
          *   Present the text(s).
          *   Ask: "Why might this be *awkward* or *embarrassing* for the early church?" (John is inferior/subordinate; implies Jesus needed repentance/forgiveness?).
          *   Historian's Argument: "It's unlikely the early church *invented* a story where their Lord and Messiah undergoes a baptism associated with repentance, administered by someone else. The embarrassment factor suggests this tradition is very old and hard to dismiss."
          *   **Emphasize:** This *shifts the burden*. The embarrassment gives us a *reason* to think it's likely historical, *unless* a strong counter-argument exists. It's defeasible (maybe there *was* a strong theological reason to invent it? But that's hard to see).

  4.  **(25 min) Expanding the Toolkit: Other Criteria & Navigating Misconceptions**
      *   **Multiple Attestation:**
          *   Explain: "Does this saying/event appear in multiple *independent* sources/forms?"
          *   **CRITICAL MISCONCEPTION HEAD-OFF:** "Independent sources don't just mean different Gospels! Mark is likely a source for Matthew and Luke. We look for *independent streams of tradition* (e.g., Mark, Q, Special Matthew, Special Luke, John, Pauline letters, non-canonical sources). Counting Matthew, Mark, Luke as three is usually wrong." Use a simple example (e.g., Parable of the Mustard Seed in Mark/Matthew/Luke/Q – explain dependence).
          *   Example: Sayings in both Mark *and* Q (e.g., "Love your enemies").
          *   **Frame:** "Multiple independent witnesses *strengthens* the case, making it harder to dismiss as a single community's invention. It shifts the burden further, but doesn't guarantee authenticity."
      *   **Coherence:**
          *   Explain: "Does this saying/event fit well with other material deemed authentic via other criteria?"
          *   **MISCONCEPTION HEAD-OFF:** Clarify this *cannot* be used first! "We can't start with coherence – that would just rebuild the Gospel picture. It only works *after* we have some core material established by *other* criteria (like Embarrassment or Multiple Attestation)." This is where your philosophical payoff starts to peek through.
          *   Example: Jesus' association with "sinners" coheres with criticism from opponents (embarrassing?).
      *   **Dissimilarity (Handle with Care!):**
          *   Explain: "Is this saying/event unlikely to have been derived *either* from contemporary Judaism *or* from the early church?"
          *   **MAJOR MISCONCEPTIONS HEAD-OFF:**
              *   "This does **not** give us the 'real' or 'neutral' Jesus! It isolates sayings that *don't fit*, but the *real* Jesus was deeply embedded in Judaism and his movement became the church. This criterion only finds the *distinctive* or *unusual* elements. It risks creating a Jesus alien to his context and followers."
              *   "It's often very hard to apply rigorously (how do we know *exactly* what 1st-century Judaism or the *very* early church believed?)."
          *   Example: "Love your enemies" (possibly dissimilar from prevalent Jewish retaliation ethics *and* from early church's struggles with persecution? Though debatable).
          *   **Frame:** "A powerful but problematic tool. It can shift the burden for specific, unusual sayings, but it gives a very *partial* picture if overused."
      *   **(Briefly Mention):** Palestinian Environment / Aramaic (Explanatory Power): "Does the saying/event make good sense in a 1st-century Galilean Jewish context? Does it show signs of being translated from Aramaic?" Frame: "These support plausibility and help shift the burden away from later Hellenistic church invention."

  5.  **(15 min) Synthesis, Limitations & The Philosophical Payoff**
      *   **Recap:** Criteria are tools to shift the burden of proof. They make items *more plausible*, not certain. They are defeasible.
      *   **Address the "Science vs. Subjectivity" Misconception:** "This isn't objective chemistry. Historians make arguments using evidence and reasoned criteria. But it's not *hopelessly* subjective either. The criteria provide shared, defensible *reasons* for arguments, allowing debate and progress. It's a historical discipline, using inference to the best explanation."
      *   **The Philosophical Payoff - The Problem of the Criterion (Localized):**
          *   Pose the question: "How do we *start*? We use criteria like Embarrassment or Dissimilarity to find some 'core' authentic material. Then we use Coherence to build out the picture... **But doesn't the 'coherent' picture depend on what we *already* decided was authentic using the other criteria? And didn't we choose *which* criteria to prioritize based on what kind of Jesus we think is plausible?**"
          *   **Frame it as Insight, Not Gotcha:** "This is the core epistemological tension. The criteria aren't neutral fact-finders dropped from heaven. They are **presumptions** we employ about how tradition works (e.g., 'embarrassing things are preserved,' 'multiple sources are stronger'). They *shape* the Jesus picture they help us find. Recognizing this interdependence is crucial for understanding the *nature* of historical Jesus research – it's a complex, often circular, process of constructing the most plausible historical account using the best tools and arguments available, aware of their limitations." *(This lands your core philosophical point)*.
      *   **Leave as Live Questions:**
          *   The inherent circularity/prioritization problem (Problem of the Criterion).
          *   The significant limitations of Dissimilarity.
          *   The degree to which a "coherent" picture can be achieved vs. the fragmentary nature of the evidence.

  6.  **(5 min) Final Question & Wrap-up**
      *   **The Landing Question:** "**If two historians, both using these same criteria seriously and rigorously, end up with significantly different pictures of the historical Jesus, what does that tell us about the nature of these criteria and historical knowledge itself?**"
          *   *Why it works:* It forces them beyond listing criteria. It probes if they grasp the criteria as defeasible burden-shifters (leading to different judgments), the role of prior assumptions (shaping how criteria are weighted/applied), the inherent ambiguity of evidence, and the constructed nature of historical portraits (your payoff). It shows if they see the "problem of the criterion" in action.
      *   **What You're Not Covering:**
          *   "We haven't had time to dive into the detailed arguments *for* or *against* the authenticity of specific sayings using multiple criteria simultaneously."
          *   "We haven't covered the historical development of these criteria or major scholarly debates about their validity (e.g., the heavy criticism of Dissimilarity)."
          *   "We haven't discussed the 'Criterion of Rejection' (Jesus was crucified, so he must have done/said things that provoked authorities) or more recent proposals in depth."
          *   "This is an introduction to the *logic* and *challenges* of the method, not a comprehensive survey of all Jesus scholarship."

  **Why this order works:**

  1.  **Starts with the Problem:** Immediately engages *why* criteria are needed.
  2.  **Builds Foundations:** Establishes the historical goal (picture, not just sayings) and the core epistemological concept (burden of proof) BEFORE introducing any specific tool.
  3.  **Uses a Strong, Intuitive Example:** Embarrassment provides a clear model of how a criterion functions as a burden-shifter.
  4.  **Introduces Complexity Sequentially:** Builds from Embarrassment to more complex (Multiple Attestation's sourcing) and problematic (Dissimilarity) criteria, addressing key misconceptions as they become relevant.
  5.  **Saves the Payoff:** The philosophical tension (Problem of the Criterion) is the culmination, framed as an insight into the nature of the discipline, arising naturally from the limitations and interdependence of the tools discussed (especially Coherence).
  6.  **Ends with a Diagnostic Question:** The final question directly assesses understanding of the core concepts and the philosophical tension, not just recall.

  This plan respects the students' level while introducing sophisticated epistemological concepts in an accessible and grounded way, directly addressing the misconceptions you anticipate and landing your key philosophical insight. Good luck!
