prompt: |-
  Okay so I keep going back and forth on the whole "can immoral art be good art" question and I'd definately like you to actually land somewhere instead of giving me the usual survey of the camps. Here's the specific wrinkle I can't get past, and I don't think the standard positions handle it cleanly.

  Picture two painters. The first is a genuinely terrible person, cruel to everyone close to them, but the paintings themselves don't seem to encode any of that; if you didn't know the biography you'd read them as morally neutral or even generous. The second is a saint in private life, but the work is openly contemptuous toward some group of real people, and the contempt isn't incidental -- the piece is engineered so the viewer is invited to enjoy their humiliation. That's the point of it.

  Now the thing that bugs me: in the second case, the very feature that makes the work morally repugnant -- the cruelty, the invitation to relish it -- is also what makes it aesthetically powerful. It isn't great despite being cruel. It's great because of it, or at least the cruelty and the greatness aren't seperable; you can't subtract the moral rot and leave a clean great painting behind.

  So write me an essay that reaches a verdict on this exact question. When a work's moral defect and its aesthetic merit are one and the same feature, does that defect count against the work's value as art, count for it, or does the "as art" qualifier let us just set the morality aside entirely? Give the strongest version of the side you're rejecting, then commit -- no "it depends on your theory of value" at the end, I want your position and your reasons. And flag for me which of your moves is a real argument versus a stipulation about what art or value is supposed to mean in the first place.
