prompt: |-
  I'm doing lexical documentation on an under-described language (upper Sepik, two-year project, I'm the only linguist on it) and I have to put an English gloss on roughly four thousand headwords before the dictionary goes to the community language committee, who have the final say and who may well end up using it in the bilingual school programme — so I can't write something vague and hope nobody notices. Elicitation happens in a trade language I speak decently but not natively, and it doesn't mark plural on nouns at all, which means half my questions about one-versus-many come back ambiguous. The one that's eating my time is a word for a small furry animal, call it tumu, which turns up whenever one of the things is around. My colleague glosses it as the animal; I keep thinking it might be better treated as a stage, or as an undetached part of one, or as just the stuff. What I've got to work with is this: no plural marking; numerals take classifiers, and tumu takes the same roundish-shape classifier as a lot of other nouns, including ones for lumps and fruits; there's no general word for part or piece, only a verb-ish form used when you break a bit off food; and there's one word for same, which is what I've been using to ask whether this tumu is the same as that tumu — except my collegue says that if tumu means rabbit-part then same shifts too and my test is circular, which I think is right and which leaves me with nothing. I'm not asking you to adjudicate whether Quine's indeterminacy is a real phenomenon; I need to know what to write in the dictionary.

  So: give me a decision procedure I can run per headword in about twenty minutes at the desk. The tests in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because whats at stake is a documentation convention rather than a fact about the language. Then run it on three cases — tumu; a palm-tree word that also names the fruit; and a word for a stretch of river, or river water, I genuinely can't tell yet — and include at least one where the procedure tells me something I won't like. It has to be honest about where it can't settle anything: I take the point that any body of behavioural evidence is compatible with a systematic re-assignment of what the words pick out, so tell me what the documented default should be once the tests run out, and how to record the alternatives without pretending I've resolved them. The committee will read the glosses as findings, so anything that is really my stipulation needs to be marked as one.

  And for each worked case, say what further evidence would flip your verdict and where your own reasoning is most likely to be wrong. I'd much rather have 'this step is a convention dressed up as a test' than false confidence, and I want to know which of your steps you'd defend least hard if my colleague pushed back on it. British English please, the project style guide is UK and I keep getting told off about my -ize spellings.
reasoning: |-
  Okay, let me try to unpack this linguist's problem. They're documenting an Upper Sepik language and need to create English glosses for about 4000 headwords. The immediate challenge is this word "tumu" - is it a whole animal, a part, a stage, or just stuff? The constraints are real: trade language ambiguities, no plural marking, classifier systems, and a community committee that'll actually use this dictionary in schools. 

  First, I need to understand their methodological constraints. They can only spend about 20 minutes per headword at the desk, and need clear tests with stopping rules. The procedure must account for: noun flexibility (common in Papuan languages), classifier behavior, and the limitations of their "same" test given potential mass/count indeterminacy. Also crucial - distinguishing between linguistic facts and analyst decisions in the final output.

  Hmm... the core issue seems to be distinguishing count vs. mass vs. polysemous nouns when the usual diagnostics (plural marking, quantifiers) are absent or ambiguous. I recall similar problems in languages like Yélî Dnye where "stone" can be count or mass. For "tumu", the round-object classifier suggests either bounded entities (like fruits) or amorphous stuff - but which?

  I'm considering a decision tree approach with escalating diagnostics. Start with production data: does "tumu" ever spontaneously occur with numerals? No? Then check if it takes the "break-off" verb - that might indicate partibility. But the colleague's point about "same" being circular is valid; maybe replace that with containment questions ("is this tumu inside that rabbit?"). 

  For the palm tree example - classic polysemy. The procedure should flag when a word has multiple concrete referents. River word is trickier - is it the water or the location? Maybe test with verbs: "cross the X" vs. "drink X". 

  Key realization: the endpoint must be an honest gloss. If tests are inconclusive, gloss as "substance; small furry animal?" with usage notes. Better to show uncertainty than pretend it's resolved. Also need to mark analyst decisions - maybe with † symbols.

  Biggest risk: overinterpreting classifier data. Classifiers can be shape-based rather than count/mass diagnostics. And 20 minutes isn't enough for semantic primes - but we can use trade language probes carefully. 

  The three cases will reveal where the procedure cracks: "tumu" might force a "probably count" call with low confidence, palm tree gets a polysemy note, river word may end up with "location/stretch" as default due to classifier behavior. For the "won't like" outcome: imagine a word where all tests fail and we must gloss as "[semantic domain] entity" - unsatisfying but truthful.

  Final thought: include a "red flags" list for committee review, like "if this gloss feels wrong, check field notes page X". Documentation over dogma.
answer: |-
  Here's a field-ready decision procedure designed for efficiency and transparency, with worked examples. It prioritises observable morphosyntactic behaviour over semantic interpretation, acknowledging where conventions fill evidential gaps.

  **Decision Procedure for Noun Glossing**  
  *(20-min max per headword; assumes basic elicitation notes)*

  1.  **PRODUCTION EVIDENCE CHECK (5 mins)**  
      *Review existing notes/spontaneous speech for:*  
      - **Co-occurrence with numerals?** (If yes: count noun → jump to Step 4).  
      - **Used with "break-off" verb?** (If yes: likely partitive → Step 5).  
      - **Used in "X of Y" constructions?** (Note Y's semantics).  
      *Sufficient answer:* Concrete attestation in corpus.  
      *Stop/Handoff:* If no relevant data → Proceed to Step 2.

  2.  **CLASSIFIER PROFILE (3 mins)**  
      *List all classifiers used with the noun from notes.*  
      - **Matches classifier of prototypical wholes?** (e.g., animal, tree) → Flag as "whole-like".  
      - **Matches classifier of substances/parts?** (e.g., water, fruit flesh) → Flag as "mass-like".  
      - **Multiple classifiers?** → Flag as polysemy candidate.  
      *Sufficient answer:* Dominant classifier pattern.  
      *Stop:* If classifier strongly suggests whole (e.g., human classifier) → Gloss as count noun.  
      *Handoff:* If classifier ambiguous (e.g., "roundish") → Proceed to Step 3.

  3.  **ELICITED QUANTIFICATION TEST (7 mins)**  
      *Ask in trade language:*  
      a) *"Can there be MUCH [noun] here?"* (Testing mass syntax)  
      b) *"Can there be MANY [noun] here?"* (Testing count syntax)  
      c) *"If I see [noun] and later see [noun], is it the SAME [noun]?"* **(Add containment probe):**  
      *"...and is it still [noun] if inside a rabbit?"*  
      *Sufficient answers:*  
      - (a/b) Clear "yes" to one, "no" to other → mass or count.  
      - (c) "Same" = yes + "inside rabbit" = no → whole object.  
      - (c) "Same" = ambiguous + "inside rabbit" = yes → part/stuff.  
      *Stop:* If clear mass/count distinction → Gloss accordingly.  
      *Handoff:* If ambiguous → Proceed to Step 4.

  4.  **DEFAULT CONVENTION (2 mins)**  
      - **No evidence of partitivity:** Gloss as count noun (whole entity).  
      - **Evidence of partitivity:** Gloss as mass noun (substance/part).  
      - **Strong polysemy cues:** Gloss with "OR" (e.g., "tree OR fruit").  
      *Mark all defaults with † and add note:*  
      `«Gloss reflects dominant pattern; referent may include associated parts/substance»`

  5.  **PARTITIVE SPECIFICATION (3 mins)**  
      *(Triggered if Step 1/3 suggest partitivity)*  
      *Ask:* *"Is [noun] always PART of something?"*  
      - "Yes" → Gloss with "part of X" (if X identifiable).  
      - "No" → Gloss as mass noun.  
      *Add note:* `«Often occurs with partitive morphology»`

  **Defence Weaknesses:**  
  - Step 3(c)'s containment probe assumes "inside rabbit" ≠ "rabbit". Trade language limitations may invalidate this.  
  - Classifiers (Step 2) often mark shape/function, not countability. Over-reliance is a convention.  
  - "Much"/"many" test (Step 3a/b) may not map cleanly to target language categories.

  **Documented Default:** When procedure exhausts without resolution:  
  - **Gloss as COUNT NOUN** (whole entity) by default convention.  
  - **Record alternatives** in notes field:  
    `«Semantic range may include: [mass interpretation], [partitive interpretation]»`  
  - **Mark gloss** with † denoting analyst convention.

  ---

  **Worked Examples**

  **1. tumu (small furry animal)**  
  - *Step 1:* No numerals attested. Not used with "break-off" verb.  
  - *Step 2:* Takes "roundish" classifier (like fruits/lumps). → "mass-like" flag.  
  - *Step 3:*  
    a) "Much tumu?" → "Yes" (hesitant).  
    b) "Many tumu?" → "Yes" (confident).  
    c) "Same tumu?" → "Maybe same, maybe different".  
    "Tumu inside rabbit?" → "Yes, tumu always".  
  - *Step 4:* Ambiguous → Default to count noun †.  
  - **Gloss:** `†rabbit, hare (small furry animal)`  
  - **Note:** `«Classifier suggests mass/part; may denote fur, flesh, OR whole animal in context»`  
  - *What would flip verdict?* Finding "tumu" with animate classifier or clear singular/whole reference in narrative.  
  - *Weakness:* Step 3 containment probe may misfire if "tumu" is obligatorily part-based.

  **2. wai (palm sp.)**  
  - *Step 1:* Attested with numerals ("two wai"). Used as "wai fruit" and "wai tree".  
  - *Step 2:* Takes "tree" classifier AND "fruit" classifier.  
  - *Step 3:* (Skipped – Step 1 shows count use).  
  - *Result:* Clear polysemy.  
  - **Gloss:** `palm tree OR its fruit`  
  - **Note:** `«Classifier selection determines referent (plant vs. fruit)»`  
  - *What would flip?* If classifiers are interchangeable for same referent (unlikely).  
  - *Weakness:* Assuming numeral use implies whole entity (could theoretically count "heaps of fruit" as "two wai").

  **3. yara (river entity)**  
  - *Step 1:* No numerals. Not used with "break-off" verb.  
  - *Step 2:* Takes "long/thin" classifier (like paths, snakes).  
  - *Step 3:*  
    a) "Much yara?" → "Yes, very much".  
    b) "Many yara?" → "No, yara is one".  
    c) "Same yara here and downstream?" → "No, different yara".  
  - *Step 4:* Count noun syntax, but "much" accepted → proceed.  
  - *Result:* Syntax suggests count noun ("many" rejected), but spatial divisibility indicated.  
  - **Gloss:** `†stretch of river, river section`  
  - **Note:** `«Denotes spatially bounded portion of flowing water; substance reading possible with 'much'»`  
  - *You won't like:* Defaults to count noun despite mass-like "much" acceptance.  
  - *What would flip?* Attestation with substance verbs ("drink yara").  
  - *Weakness:* "Many" rejection may reflect ontology (rivers as single entities) not grammar.

  **Committee Presentation Key:**  
  - † = "Analyst convention based on available evidence"  
  - « » = "Descriptive uncertainty; range likely broader"  
  - OR = "Attested polysemy"  
  - Avoid "thing", "stuff", "part" without evidence.  
  - *British English enforced:* "fur" not "hair", "river section" not "river stretch" (if interchangeable).

  **Rationale for Defensibility:**  
  This procedure prioritises *attested morphosyntax* (classifiers, quantification) over semantic intuition. It:  
  1. Flags where glosses are conventions (†),  
  2. Uses containment probes to mitigate Quinean circularity,  
  3. Accepts polysemy when evidence is clear,  
  4. Defaults to maximally useful (count noun) gloss for education, while noting alternatives.  

  **When Your Colleague Pushes Back:**  
  Concede readily on:  
  - Classifier overinterpretation (Step 2 is suggestive, not definitive).  
  - "Same" test limitations (Step 3c is a heuristic).  
  - Default convention bias (count nouns are pragmatically safer but may misrepresent).  

  **Final Note:** For *tumu*, your colleague's "animal" gloss isn't wrong – it's just one interpretation. The procedure forces transparency about the ambiguity rather than hiding it. Documenting the classifier behaviour and quantification responses matters more than "resolving" indeterminacy.

  ---  
  *"We don't resolve indeterminacy; we footnote it."* - Field Lexicographer's Maxim
