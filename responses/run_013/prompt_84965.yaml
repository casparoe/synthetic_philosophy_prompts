  The normative practice point is tricky. Dana dismisses it as "what people will do" not "what exists", but Ravi's onto something - even if beliefs aren't neural kinds, they might be indispensable for responsibility practices. Still, Dana's witchcraft analogy isn't trivial; normative systems can collapse under scientific pressure.

