  I'm an operations researcher who works on multi-objective optimization and I have no philosophical training, but I'm fluent in the vocabulary of my trade: Pareto dominance and the non-dominated set, scalarization by weighted sums, lexicographic and epsilon-constraint orderings, incomplete versus intransitive preference relations, and the difference between a trade-off that is genuinely open and one that only looks open because I've fixed the model class too narrowly. Restate, as faithfully as you can, the philosophical claim that some values are incommensurable and that some choices are therefore hard, in that vocabulary: what does incommensurability come to on my side, what does a hard choice come to, and what is supposed to be the difference between incomparability and mere indifference or rough equality — including the distinction some philosophers draw between items that are incomparable and items that are comparable yet neither better nor worse (parity, as I understand the term is used). Then give me the residue report. Which parts translate cleanly, which translate only with distortion, and which have no counterpart at all in how I think about trade-offs? I suspect the whole thing reduces to the observation that no scalarization is canonical and that choosing one is a further decision the agent has to make anyway; tell me whether that is the right way to hear it, and if it is not, whether what is left over is a gap in my vocabulary or a sign that the philosophical claim was less clear than it looked. Be explicit about one thing in particular: does the debate presuppose that incommensurability is a fact about the values themselves rather than about any particular decision-maker's preferences, and does that distinction survive the translation or quietly disappear?
