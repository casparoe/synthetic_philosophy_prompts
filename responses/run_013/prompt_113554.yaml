answer: |-
  Here is a specification of desiderata for an adequate theory of verbal disputes, designed to meet your seminar's practical aims and address your core concerns:

  ## Desiderata for a Theory of Verbal Disputes

  1.  **Range Requirement:** The theory must correctly classify disputes across the full spectrum, from trivial to foundational to high-stakes.
      *   *Motivation:* A theory failing to handle both "tomato-as-fruit" (harmless taxonomy) or "statue-vs-clay" (ontological/metaphysical) *and* disputes like "burrito-as-sandwich-under-lease" (legal/political consequence) or disputes where contested terms (e.g., "oppression," "genocide," "person") are the sole available vocabulary for expressing a genuine, non-linguistic grievance would be practically useless. It must not collapse all disputes into verbalism nor dismiss high-stakes ones too easily.

  2.  **Fault/Culpability Requirement:** The theory must distinguish between disputes where *both* parties use language reasonably but differently (no fault), disputes where *one* party misuses language (unilateral fault), and disputes where *both* are linguistically confused or equivocal (bilateral fault).
      *   *Motivation:* A theory must guide the *practical response*. Dissolving a dispute where both parties are reasonable requires different tactics (reframing) than correcting a party misusing "table" or "sandwich." The "statue/clay" dispute often involves no linguistic fault, while a dispute over a term like "literally" might involve one party misunderstanding common usage.

  3.  **Agreement Requirement:** The theory must specify whether diagnosing a dispute as verbal requires the *parties themselves* to agree on *all* relevant non-linguistic facts, or whether the diagnosis can be made by an observer based on a broader shared understanding of the world.
      *   *Motivation:* The classic "statue/clay" case assumes agreement on physical facts; the dispute seems purely about how to *count* or *categorize* given those facts. However, many disputes (e.g., political ones) involve deep factual disagreements intertwined with semantic ones. The theory must clarify if verbalness is relative to a factual baseline and how that baseline is established.

  4.  **Practical Implications Requirement:** The theory must clearly articulate what *follows* practically from diagnosing a dispute as verbal (wholly or partially). It must specify when dissolution, reframing, or continued pursuit (e.g., for clarification, rhetorical, or institutional reasons) is the appropriate response.
      *   *Motivation:* This is the seminar's core practical aim. The diagnosis itself is only useful if it dictates action. Dissolving "tomato-as-fruit" is easy; dissolving a lease dispute over "sandwich" requires legal reframing; refusing to engage a dispute framed solely in contested terms might silence legitimate grievances.

  5.  **Neutrality Requirement:** The theory must be able to diagnose a dispute as verbal *without* presupposing the truth of either party's substantive non-linguistic claims.
      *   *Motivation:* To avoid begging the question. A theory stating "Disputes about X are verbal iff X doesn't exist" (e.g., "Disputes about tables are verbal iff eliminativism is true") would be useless for resolving ontological disputes like tables or statues. The diagnosis must be prior to, or independent of, settling the disputed non-linguistic facts.

  6.  **Critical Bite Requirement:** The theory must explain why diagnosing a dispute as verbal (especially when fault is involved) provides a *reason* for the disputants to change their stance or behavior, even if they initially reject the diagnosis.
      *   *Motivation:* If a party insists "This is *not* just about words!" (e.g., in a high-stakes legal or political dispute), the theory must provide grounds, beyond mere stipulation, for why they *should* accept reframing or dissolution if the diagnosis is correct. It must have normative force.

  7.  **Defect/Worthiness Requirement:** The theory must accommodate that while many verbal disputes are pointless and should be dissolved ("merely verbal"), others can be genuinely *worth having* (e.g., for conceptual clarification, legal precision, or to expose hidden assumptions).
      *   *Motivation:* Disputes over legal definitions ("sandwich"), philosophical categorization ("person"), or political terminology ("terrorism") are often crucially important *because* they are verbal – they force us to clarify our concepts and their implications. The theory must not imply all verbal disputes are defective or should always be avoided.

  8.  **Self-Application Requirement:** The theory must be able to determine whether disputes about its *own* criteria for identifying verbal disputes are themselves verbal disputes. Crucially, it must achieve this *without* leading to paradox, self-contradiction, or self-undermining (i.e., without "swallowing itself").
      *   *Motivation:* Philosophical theories must be self-applicable to avoid privileging themselves. If a dispute arises over whether condition X *really* identifies verbalness, the theory must explain how *that* dispute should be classified. Can it do so using its own machinery without collapsing into a performative contradiction or infinite regress? (e.g., Does applying its criteria to itself yield a clear answer, or does it show the criteria themselves are contested in a way the theory deems verbal?).

  ### Flagged Tensions Between Desiderata

  *   **Neutrality (5) vs. Critical Bite (6):** How can a theory remain neutral on the underlying substantive issues *and* provide compelling reasons for disputants (who may be deeply invested in those substantive issues) to accept the verbal diagnosis and change their behavior? Neutrality seems to require standing outside the dispute, while critical bite requires engaging within it normatively.
  *   **Defect/Worthiness (7) vs. Practical Implications (4) & Critical Bite (6):** If verbal disputes can be worthwhile, when does the diagnosis imply dissolution (a "defect" response) versus continued pursuit or reframing? How does the theory normatively distinguish the pointless from the valuable without importing substantive commitments that violate Neutrality (5)? Calling something "verbal" often *feels* dismissive; how can the theory avoid this when the dispute *is* worth having?

  ### Assessment of Main Families of Views

  1.  **Metalinguistic/Contextualist Approaches (e.g., Carnap, later Chalmers, Plunkett & Sundell):** Characterize disputes as verbal when parties mean different things by a key term (different concepts, different contextual parameters). Strong on **Range (1)** (can handle ontology to law), **Fault (2)** (can identify equivocation), often good on **Practical Implications (4)** (suggest reframing in shared terms). Struggle severely with **Self-Application (8)** (disputes over what counts as "same concept" or "relevant context" seem inherently metalinguistic/verbal by their own lights, risking regress). Can strain **Critical Bite (6)** against strong substantive disagreement ("Why *should* I use *your* concept?").

  2.  **Truth-Conditional/Semantic Approaches (e.g., early Davidson, some appeals to "joint carving"):** Focus on whether parties disagree on truth-conditions fixed purely by the world (substantive) or only on meaning/conventions (verbal). Strongest **Critical Bite (6)** if tied to robust realism. Often fail **Neutrality (5)** spectacularly (e.g., presupposing realism about properties/joints). Struggle with **Range (1)**, especially high-stakes cases where meaning *is* the contested social/political fact. Poor on **Practical Implications (4)** beyond dissolution. **Self-Application (8)** is deeply problematic (disputes over "joints" or "truth-conditions" look substantive by their own criteria).

  3.  **Conceptual Role/Pragmatic Approaches (e.g., Brandom, sometimes Wittgensteinian views):** Focus on disagreements in the *use*, inferential role, or practical consequences of terms. Excellent at capturing **Worthiness (7)** (disputes matter because of differing practical commitments). Can handle **Range (1)** well, including high-stakes cases. **Neutrality (5)** can be a challenge if "use" is tied too closely to substantive practices. **Critical Bite (6)** is strong internally but may not persuade outsiders. **Self-Application (8)** is highly complex; disputes over "correct use" of 'verbal dispute' seem core examples of the phenomena the theory describes, potentially leading to a self-ratifying but non-paradoxical loop rather than regress.

  4.  **Contextualist/Relativist Hybrids (e.g., MacFarlane-inspired views):** Frame disputes as differing in the contextual parameters or standards of assessment they employ. Can handle many cases under **Range (1)** and offer nuanced **Practical Implications (4)** (suggesting parameter adjustment). Can maintain **Neutrality (5)** by describing differing contexts without endorsing one. **Critical Bite (6)** is weak – if both contexts are legitimate, why change? **Self-Application (8)** leads to complex questions: Is disagreement over the correct "contextualist theory" itself context-relative?

  5.  **Speech-Act/Illocutionary Approaches (e.g., focusing on what disputants are *doing*):** Diagnose as verbal when the *act* performed (defining, stipulating) is misaligned with the act assumed (asserting a fact). Useful for **Fault (2)** (identifying misunderstandings about the type of discourse). Can explain **Worthiness (7)** (definitional acts *are* important). Struggle with **Range (1)**, particularly deep ontological disputes where parties genuinely believe they are asserting facts. **Neutrality (5)** is tricky if labeling an act as "merely stipulative" dismisses the speaker's intent. **Self-Application (8)** is challenging: Is arguing about this theory an act of assertion or definition?

  **Conclusion:** No existing family satisfies all desiderata perfectly. Metalinguistic/Contextualist views offer the best balance for your practical seminar aim, handling a wide **Range (1)** with clear **Practical Implications (4)** (reframing), but stumble hardest on **Self-Application (8)** and the **Neutrality (5)/Critical Bite (6)** tension. Conceptual Role views offer the richest account of **Worthiness (7)** but may struggle with **Neutrality (5)** and precise **Fault (2)** attribution. Truth-Conditional views fail **Neutrality (5)** too severely for your purpose. The key tensions (**5/6**, **4/7**, and **8** itself) highlight the deep philosophical challenge: distinguishing words from the world is itself an act that depends on words and implicates our view of the world. Your seminar's focus on practical response is crucial for navigating this terrain.
