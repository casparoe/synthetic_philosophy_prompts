  First, I need to clearly state the perdurantist's objection. They argue that endurantism fails in relativity because there's no absolute simultaneity. The endurantist's 3D object requires a set of properties at a time, but time isn't universal. Perdurantism, with 4D worms, avoids this by having parts across spacetime.

  Now, point (a): Can endurantists relativize properties to frames? If they say properties are frame-relative, does that make them closet perdurantists? I think the key here is that relativizing to frames doesn't commit them to temporal parts. They can maintain that the object is wholly present in each frame's "now" slice. But each frame defines a different slice. The endurantist isn't saying the object has temporal parts; they're just acknowledging that "wholly present" is frame-dependent. That's different from perdurantism, where parts exist independently of frames.

  Point (b): If they relativize to a time, do they need a privileged foliation? Privileged foliation is problematic because relativity says no frame is special. But endurantists can argue that in practice, we use a rest frame or something similar. However, that's ad hoc. Better to stick with frame-relativity without privileging one frame. That avoids the need for a universal "now."

  Point (c): The mirror problem for perdurantists. Do temporal parts need a frame to be defined? Yes, because slicing spacetime into temporal parts requires a foliation. Without a privileged frame, each foliation gives different temporal parts. So perdurantists also face relativity in defining parts. The objection is symmetric, which undermines the perdurantist's claim that their view handles relativity better.

  The strongest perdurantist response might be that their 4D worm is frame-independent. The whole spacetime worm exists, and foliations just describe it differently. But the endurantist can counter that their 3D object also exists frame-relatively. Both views need some relativization. So the objection doesn't uniquely hurt endurantism.

  Then, generalizing to change: The relativity problem is specific to frames. In classical cases, like a ball changing color, endurantism handles change without issue. The problem only arises in relativistic contexts, so perdurantists can't use it as a general argument against endurantism.

