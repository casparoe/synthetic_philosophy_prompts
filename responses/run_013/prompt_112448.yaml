  We are going to construct a model with two agents, Alice and Bob, who have different information about a simple event. The setting: 
  There are two coins, one fair and one double-headed. A coin is chosen at random and flipped. The outcome of the flip (heads or tails) is observed by Alice but not Bob. Bob observes which coin was chosen (fair or double-headed) but not the flip. They then assign probabilities to the event that the coin was the fair one.

  We will see that at the actual state (which we will specify) they assign different probabilities to the coin being fair, and this disagreement is common knowledge. However, the model will satisfy all the conditions except one: the information partitions are such that the agents do not have the same information, and they do not share the same information set at the actual state. The condition that fails is that the agents' posteriors are common knowledge only if they have the same information (which they don't). But note that Aumann's theorem requires that the posteriors are common knowledge. In our case, the fact of disagreement is common knowledge, but the actual posterior probabilities are not common knowledge. This is the key.

  Let's break it down.

  Part 1: Scenario

  Two coins: one fair (F), one double-headed (D). One coin is chosen at random (each with probability 1/2) and flipped. Alice sees the outcome of the flip (H or T) but doesn't know which coin was chosen. Bob sees which coin was chosen (F or D) but doesn't see the flip. They are both rational Bayesians with a common prior. They are then asked to assign a probability to the event that the coin chosen was fair. In a particular situation (the actual state), Alice sees heads and Bob sees that the double-headed coin was chosen. Alice assigns a probability of 1/3 to the coin being fair, while Bob assigns probability 0. And they know that they disagree: Alice knows Bob has some information and must assign either 0 or 1 (because if Bob sees F, then he knows it's fair, but if he sees D, he knows it's double-headed) and Bob knows that Alice assigns either 1/3 (if she sees heads) or 1 (if she sees tails). But in the actual state, they do disagree, and this fact is common knowledge.

  Part 2: Machinery

  State space: The state space Ω has four states, each representing the choice of coin and the outcome of the flip. We denote a state by (coin, outcome). The coins are F (fair) or D (double-headed). The outcomes are H (heads) or T (tails). Note that the double-headed coin can only land heads. Therefore, the state space is:
    Ω = { (F,H), (F,T), (D,H) }
  We cannot have (D,T) because the double-headed coin cannot land tails.

  Prior: The prior probability distribution P is uniform over the possible states. The coin is chosen at random (each coin 1/2) and then flipped. For the fair coin, each outcome has probability 1/2. For the double-headed coin, outcome H has probability 1. Therefore:
    P(F,H) = (1/2) * (1/2) = 1/4
    P(F,T) = (1/2) * (1/2) = 1/4
    P(D,H) = (1/2) * 1 = 1/2

  But note: the problem says the coin is chosen at random and then flipped. We have to make sure that the prior is consistent. Alternatively, we can think of the coin being chosen and the flip being independent. However, for the double-headed coin, the flip is deterministic. So the prior is:
    P(F,H) = 1/4
    P(F,T) = 1/4
    P(D,H) = 1/2

  We can also think of the state space as having three states, and the prior is as above.

  Agent partitions:

  Alice observes the outcome of the flip. So she cannot distinguish between states that have the same outcome. But note: state (F,T) has outcome T, and no other state has T. So Alice's partition is:
    A1 = { (F,H), (D,H) }   (when she sees heads)
    A2 = { (F,T) }          (when she sees tails)

  Bob observes the coin. So he cannot distinguish between states that have the same coin. His partition:
    B1 = { (F,H), (F,T) }   (when he sees the fair coin)
    B2 = { (D,H) }          (when he sees the double-headed coin)

  The proposition of interest: Let E be the event that the coin is fair. So E = { (F,H), (F,T) }.

  Now, we compute the posteriors at every state.

  At state (F,H):
    Alice's information set: A1 = { (F,H), (D,H) }
    P(E | A1) = P( (F,H) | A1 ) = P( (F,H) ) / [ P( (F,H) ) + P( (D,H) ) ] = (1/4) / (1/4 + 1/2) = (1/4)/(3/4) = 1/3.

    Bob's information set: B1 = { (F,H), (F,T) }
    Since Bob is in B1, he knows the coin is fair, so P(E | B1) = 1.

  At state (F,T):
    Alice's information set: A2 = { (F,T) }
    Then P(E | A2) = 1 because in A2 the coin must be fair (only fair coin can land tails).

    Bob's information set: B1 = { (F,H), (F,T) }
    Again, P(E | B1) = 1.

  At state (D,H):
    Alice's information set: A1 = { (F,H), (D,H) }
    P(E | A1) = (1/4) / (1/4 + 1/2) = 1/3.

    Bob's information set: B2 = { (D,H) }
    Then P(E | B2) = 0 because the coin is double-headed.

  Now, we choose the actual state to be (D,H). Then:
    Alice assigns 1/3 to E (the coin being fair).
    Bob assigns 0 to E.

