prompt: |-
  I'm putting together a batch of cases to test weather a model can keep two uses of desert apart: desert as a floor (you must punish at least this much) and desert as a ceiling (you must not punish more than this). I want a case where they pull in the opposite direction from the usual one — the retributivist ends up wanting the lighter sentence and the consequentialist the heavier.

  Build it for me. Constraints: realistic (a sentencing hearing, not a thought-experiment lab), the scenario itself no longer than one paragraph, and the offender has to be genuinely guilty and genuinely deserving of some punishment — no punishing the innocent, that's the boring version. The retributivist's leniency has to fall out of a real retributive principle and not from her quietly caring about consequences; the consequentialist's severity has to fall out of ordinary consequentialist reasoning and not from a caricature.

  Then walk me through it: the sentence each theory gives and why, which single feature of the case is doing the work, and what the two verdicts become if you strip that feature out. End with how a consequentialist would attack the case without denying any of the facts, and whether the attack lands.

  And please generate the verdicts from the principles rather than stipulating them — if you can only get the retributivist to be lenient by making her inconsistent, say so instead of fudging it. The whole point is that the leniency should be forced.
