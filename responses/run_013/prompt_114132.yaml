  Second: a realist dismissing this as "trivial engineering." Reply: "Science funding debates *are* philosophy—your ‘pragmatism’ assumes resource allocation isn’t epistemological." Soft spot: Realists will yawn and say "So what? We already optimize budgets."  

  Third: Bayesian asking how this changes practice. User’s reply: "Stop pretending priors are pure rationality; admit they’re shaped by computational feasibility." Soft spot: This *does* feel like a commentary, not a tool.  

  The nightmare question: "If resource constraints *define* underdetermination, doesn’t that make scientific truth relative to budgets?" This exposes idealism in their pragmatism—truth becomes "what we can afford to know." Their best defense is a deflationary one: "Truth isn’t the point; *tractability* is." But it’ll sting.  

