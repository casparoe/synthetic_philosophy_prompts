prompt: |-
  I've been doing a run of interviews for a long piece on how scientists actually decide between rival explanations, and somewhere around the fourth transcribe-back it turned into me arguing with my own notes at 2am. So this is a plea for a philosopher rather than another scientist. What I want is a principle, and I'll trade you my gut verdicts for it, messy as they are.

  Here's what I've got. (1) Two coupled ocean-atmosphere models that both reproduce the twentieth-century temperature record down to the noise but diverge wildly about what happens after 2100 — I don't think the historical record picks between them, yet I also don't think they're equally credible, because one of them has to violate what we know about cloud microphysics from the lab, and I'd want to count that lab work as evidence too, even though it isn't in the temperature record. (2) An anomaly in the orbit of a planet, explicable either by an unseen body or by a tweak to the inverse-square law — my instinct is that the observations available at the time didn't decide it, and that this is a fact about the evidence then, not about the world. (3) Two formulations of one physical theory, related by a transformation nobody could detect from the inside — here I think no evidence could ever decide, and it feels like a different kind of tie from (2). (4) A rival to a well-established theory that fits everything the incumbent does, but only by positing an extra field that nothing independently points to — I want to say the evidence doesn't decide, and yet I don't want to say the two are on a par, which seems to flatly contradict (2). (5) And the one I keep flip-flopping on: a theory built to fit a specific anomaly after the fact versus one that called it in advance, where both now fit everything equally well. I think the predictor is better supported, but I can't for the life of me say what evidence supports it, since by stipulation the evidence is the same.

  Is there a principle that gets all five, or close? What I'd like back is a precise statement of it, the case that forces each clause, and what it predicts for one I haven't listed — say, two theories that are empirically equivalent given everything we could ever measure, but where one is quite alot simpler. And please be honest about which of my five verdicts the thing can't keep, because I suspect at least one of them has to go. Write it in British English, I'm filing for a UK magazine.
reasoning: |-
  Okay, this is a fascinating and complex request. The user is clearly deep into scientific epistemology and struggling with nuanced cases where evidence alone doesn't seem to decide between theories. They've presented five carefully crafted scenarios that expose different tensions in how we evaluate scientific theories, and they're explicitly asking for philosophical rather than scientific input. 

  First, I need to acknowledge the sophistication here - this isn't someone looking for simple answers. The 2am note-arguing detail suggests genuine intellectual struggle. They're offering their "gut verdicts" as data points, which is both humble and useful. The British English request is practical (UK magazine context) but also tells me they value precision in language.

  The core challenge is finding a unified principle that handles all five cases while respecting their intuitions. But I suspect Case 4 might be the sticking point - their description sets up a contradiction with Case 2 that needs resolution. Also notable is how they distinguish Case 3 (truly undecidable) from Case 2 (temporarily undecidable).

  Hmm... the key seems to be distinguishing what evidence directly shows from what we can reasonably infer given background knowledge. That's where the Lab Evidence Principle framework emerges. It handles:
  - Case 1 through the "background constraints" clause
  - Case 2 via "directly accessible" evidence
  - Case 3 through "experimentally inaccessible" transformation
  - Case 4 via "additional theoretical commitments"
  - Case 5 through "antecedent plausibility"

  But I'm wary about Case 4. Their intuition that the theories aren't "on a par" conflicts with the strict equivalence in Case 2. The resolution might be that background knowledge makes simple theories more credible even without direct evidence - which means slightly modifying their Case 2 verdict to allow for that.

  For the unlisted case (simplicity), the principle clearly favors the simpler theory as more credible due to background epistemic values. That feels consistent with scientific practice.

  The user's flip-flopping on Case 5 is telling - it reveals the tension between pure empiricism and how science actually works. The predictor theory isn't better supported by evidence per se, but gains credibility from the historical context of its prediction. That's where "antecedent plausibility" does heavy lifting.

  I should be transparent about where the principle modifies their intuitions: Case 4's verdict stands but Case 2 gets nuanced (theories aren't equally credible if simplicity differs). The writing needs to be precise but accessible - no jargon without explanation. And definitely no sneaky American spellings!
answer: |-
  Right, this cuts to the bone of scientific underdetermination and theory choice. Your gut verdicts are spot-on and highlight the messy reality beyond simple "fit-the-data" rules. The principle you need centres on **evidential independence and background constraints**. Here's the formulation in British English:

  **The Lab Evidence Principle:** *The credibility of a theory is determined not only by its fit with the target evidence but also by its consistency with independently established background knowledge and its reliance on ad hoc modifications unsupported by such knowledge. Where theories fit the target evidence equally well, they are evidentially equivalent* ***only with respect to that specific evidence set***; *their relative credibility depends on (a) their compatibility with other, distinct lines of evidence or well-established physical principles, and (b) the degree to which their core postulates or necessary modifications are independently motivated or constitute gratuitous complexity.*

  **Why this principle? The clauses unpacked with your cases:**

  1.  **"Fit with the target evidence" & "Evidentially equivalent only w.r.t. that evidence":** This handles Cases 2 and 5 directly. The orbital anomaly data *alone* (Case 2) doesn't decide planet vs. law-tweak – they are equivalent *for that specific dataset*. Similarly, the post-hoc and predictor theories (Case 5) fit the *final, assembled* dataset equally well – equivalent *for that dataset*.
  2.  **"Consistency with independently established background knowledge":** This breaks the tie in Cases 1 and 4, and justifies your instinct in Case 5.
      *   **Case 1:** The lab work on cloud microphysics is *independent background knowledge* – not part of the temperature record (the target evidence). The model violating it conflicts with this established constraint, making it less credible *despite equivalent fit to the historical record*.
      *   **Case 4:** The "extra field" isn't motivated by *any* independent evidence or established principle. It's *only* posited to save the phenomena already explained by the incumbent. This violates the demand for independent motivation, making the rival less credible, even though it fits the same data. It's gratuitous complexity.
      *   **Case 5:** The predictor theory gains credibility because its successful prediction *before* the evidence was gathered demonstrates its *antecedent plausibility* and *lack of ad hoc tailoring* to that specific data. Its structure wasn't modified *after the fact* solely to fit the anomaly; it was constrained by background knowledge and prior principles *before* the specific test. The post-hoc theory's structure *was* likely shaped by the anomaly itself, making it appear more ad hoc (unless it draws strongly on independent principles).
  3.  **"Experimentally inaccessible transformation" (Implied by the scope of 'accessibility'):** This cleanly handles Case 3. The transformation is defined as fundamentally undetectable "from the inside." No *conceivable* evidence, even from other domains or future experiments, could distinguish them because any measurement outcome in one maps perfectly onto the other. This is a deeper underdetermination than Cases 2 or 5 – it's *principle* equivalence, not just current or target-data equivalence. The principle recognises this as a distinct category of permanent undecidability based on the *nature* of the transformation itself. They are empirically equivalent *simpliciter*, not just relative to a dataset.
  4.  **"Ad hoc modifications unsupported by such knowledge" / "Gratuitous complexity":** This is crucial for Case 4 (the unmotivated extra field) and Case 5 (the post-hoc theory). It explains *why* we demote theories that fit the data but seem "cooked up" for the purpose without independent grounding.

  **How the Principle Gets Your Verdicts:**

  *   **Case 1 (Climate Models):** Correct. Models equivalent on historical data. Tie broken by violation of *independent* background knowledge (lab microphysics).
  *   **Case 2 (Orbital Anomaly):** Correct. Observations *at the time* didn't decide. They were equivalent *for that evidence set*. (But see the caveat below on simplicity).
  *   **Case 3 (Transformational Equivalence):** Correct. Fundamentally undecidable. A distinct, deeper equivalence.
  *   **Case 4 (Unmotivated Extra Field):** Correct. Evidence doesn't decide (equivalent fit). Rival is less credible due to *gratuitous complexity* (unmotivated field) violating the demand for independent motivation/consistency.
  *   **Case 5 (Predictor vs. Post-hoc):** Correct. Predictor is better supported *not* by the final evidence itself, but by the *antecedent plausibility* demonstrated by its successful prediction. This shows its structure wasn't *ad hoc* modified solely for that data, enhancing its credibility relative to the post-hoc theory (which likely was). The successful prediction acts as evidence of its robustness and connection to *wider* background understanding.

  **The Caveat (Where Your Verdict Needs Nuance - Case 2):**

  The principle *mostly* gets Case 2. However, your statement "I don't want to say the two are on a par" in Case 4 but are okay with it in Case 2 needs refinement. The principle implies that *even in Case 2*, the theories might not be perfectly "on a par" *if* one violates strong background knowledge or is significantly more complex *without independent motivation*.

  *   **Tweaking the inverse-square law:** This is a *massive* violation of extremely well-established background knowledge (General Relativity, centuries of gravitational observation). Positing an unseen planet is complex, but planets are known entities consistent with background knowledge. While the *specific orbital data alone* doesn't decide, the law-tweak theory is *already* less credible *before* further evidence because it requires abandoning a core, independently well-supported principle. The unseen planet hypothesis, while speculative, doesn't contradict core physics in the same way.
  *   **The Principle's Prediction:** It would say that even with equivalent fit to the anomaly data, the law-tweak theory is *less credible* due to its conflict with vast amounts of *independent background evidence* supporting GR and inverse-square laws. They aren't truly "on a par". Your instinct in Case 4 is sound; Case 2 is actually similar – the evidence doesn't *decide*, but background knowledge makes one *less credible*. The key difference is that in Case 2, *further evidence is possible* (finding the planet, more precise tests of gravity) to break the tie directly, whereas Case 3 is permanently stuck.

  **Application to Your Unlisted Case: Simplicity**

  *   **Scenario:** Two theories, empirically equivalent given *all possible* measurements, but Theory A is significantly simpler than Theory B (e.g., fewer entities, fewer adjustable parameters, more elegant mathematically).
  *   **Principle's Prediction:** Theory A is more credible.
  *   **Why:** Simplicity is a key epistemic virtue grounded in background methodological knowledge about how successful science works and the historical reliability of simpler frameworks. A more complex theory (Theory B) without any *independent* evidential support for its extra complexity is displaying *gratuitous complexity*. It violates the "ad hoc modifications" / "independent motivation" clause by being more complex *without justification from other evidence or principles*. The principle favours the simpler theory as more credible, even in permanent underdetermination, because the complexity of Theory B is *unmotivated* by anything *except* achieving equivalence.

  **In Summary:**

  The **Lab Evidence Principle** prioritises fit-to-target-data but crucially incorporates *independent background knowledge* (experimental, theoretical, methodological) to break ties, penalise ad hocness and gratuitous complexity, and recognise fundamental equivalence. It gets Cases 1, 3, 4, and 5 cleanly. For Case 2, it largely agrees but clarifies that even before decisive evidence, background knowledge *can* make one theory less credible, aligning it more with your Case 4 intuition. It naturally favours simplicity in the unlisted case as an instance of avoiding gratuitous complexity. The core insight is that "evidence" for theory choice isn't monolithic; it's layered, with background constraints providing crucial, independent leverage.
