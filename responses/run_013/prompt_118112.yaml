  Below is a decision tree that maps the philosophical commitments underlying claims like "this unit represents X" in neural networks (or biological systems). It starts from the basic observation of a correlation between a unit's activity and an input/task variable, then branches through binary questions based on testable distinctions. The tree has seven leaves (positions), each named, with one sentence on its most awkward commitment and the case it handles worst. 

  The tree is built from your specified distinctions (i.e., truth-aptness, uniqueness of content, basis of representation, misrepresentation, interpreter role) and incorporates your cases:  
  - Random-label network (fits random labels, represents "nothing")  
  - Spurious-shortcut network (e.g., cow classifier using grass)  
  - Frozen-layer probe (linear probe decodes a feature, but ablation does nothing)  
  - Superposition network (polysemantic units, decomposition is interpreter-dependent)  

  **Decision Tree:**  
  Start with the root question (first commitment). Answer each question based on cases or general principles—*not* by appealing to philosophical labels.  

  ```mermaid
  graph TD
      A[Q1: When we say 'unit U represents X,' is this claim truth-apt?<br><i>That is, can it be true or false independent of our utility?</i>] 
      A -->|No| B[Leaf 1: Instrumentalism]
      A -->|Yes| C[Q2: Is there exactly one correct description of what U represents?<br><i>Or could multiple incompatible descriptions fit equally well?</i>]
      C -->|No| D[Q3: Does representation require an interpreter?<br><i>Without an interpreter, is there no fact about what U represents?</i>]
      D -->|Yes| E[Leaf 2: Interpretivism]
      D -->|No| F[Leaf 3: Plural Realism]
      C -->|Yes| G[Q4: Is content fixed solely by the network's current state?<br><i>Identical networks = identical content, regardless of training history?</i>]
      G -->|Yes| H[Q5: Can U misrepresent?<br><i>Not just noise—can U be 'wrong' in a norm-governed way?</i>]
      H -->|Yes| I[Leaf 4: Functional Role Semantics]
      H -->|No| J[Leaf 5: Indicator Semantics]
      G -->|No| K[Q6: Can U misrepresent?<br><i>Same as Q5, but now content depends on history.</i>]
      K -->|Yes| L[Leaf 6: Teleosemantics]
      K -->|No| M[EMPTY: Incoherent/unexplored]
  ```

  ---

  **Leaf Descriptions:**  
  Each leaf includes:  
  - **Name**  
  - **Most awkward commitment**: One-sentence summary of its counterintuitive implication.  
  - **Worst-handled case**: The case that exposes the position's weaknesses.  
  - **Interpretability obligation**: What this position demands from interpretability methods (if applicable).  

  1. **Instrumentalism**  
     - *Most awkward commitment*: Even in cases where units seem perfectly interpretable (e.g., a "face neuron"), the claim "U represents X" is *never* true or false—it's just a tool for prediction.  
     - *Worst-handled case*: **Random-label network**—it forces the position to treat a network with no real-world correspondence identically to a meaningful one, making "representation" vacuously pragmatic.  
     - *Interpretability obligation*: Only a surrogate that predicts behavior (e.g., a probe or simplified model); the "actual algorithm" is irrelevant since representation isn't factual.  
     - *Realism status*: Anti-realist; thinks the realism question is confused.  

  2. **Interpretivism**  
     - *Most awkward commitment*: A unit has no representational content unless an interpreter assigns it—so a network running in isolation represents nothing at all.  
     - *Worst-handled case*: **Superposition network**—it handles this well (interpreters choose decompositions), but struggles with **random-label network** because interpreters can assign content even when it's clearly nonsense.  
     - *Interpretability obligation*: Whatever the interpreter finds useful (e.g., user-aligned explanations); the network's "true" algorithm is inaccessible or nonexistent.  
     - *Realism status*: Truth-apt but interpreter-dependent; sees the "actual algorithm" question as ill-posed without an interpreter.  

  3. **Plural Realism**  
     - *Most awkward commitment*: Multiple incompatible descriptions (e.g., U represents "edges" or "texture gradients") are *all* true simultaneously, with no "best" one.  
     - *Worst-handled case*: **Spurious-shortcut network**—it can equally endorse "U represents grass" (correlation) and "U represents cows" (downstream effect), ignoring that the shortcut is misleading for the task.  
     - *Interpretability obligation*: A set of predictive descriptions; no obligation to find a single "real" algorithm since many are valid.  
     - *Realism status*: Truth-apt and interpreter-independent; but the "actual algorithm" is underspecified.  

  4. **Functional Role Semantics**  
     - *Most awkward commitment*: U can *misrepresent* (e.g., fire for "non-X" in a way that isn't noise), even if the network outputs correctly via other units.  
     - *Worst-handled case*: **Frozen-layer probe**—if a probe decodes "X" from U but ablating U does nothing, U *cannot* represent X (since it plays no functional role), contradicting the probe's correlation.  
     - *Interpretability obligation*: The network's actual causal algorithm (e.g., circuit diagrams showing how U contributes to outputs).  
     - *Realism status*: Truth-apt, unique, and realist; demands the "actual algorithm."  

  5. **Indicator Semantics**  
     - *Most awkward commitment*: U cannot misrepresent; it merely correlates with X, so "false activations" are always noise, never error.  
     - *Worst-handled case*: **Spurious-shortcut network**—U stably correlates with grass, so it "represents grass" even when the task is about cows, ignoring the shortcut's brittleness.  
     - *Interpretability obligation*: Correlational analyses (e.g., activation statistics), ignoring functional use.  
     - *Realism status*: Truth-apt, unique, and realist; but "actual algorithm" includes only correlations, not norms.  

  6. **Teleosemantics**  
     - *Most awkward commitment*: Content is fixed by evolutionary/training history—so U represents what it was *selected for*, even if it now correlates perfectly with something else.  
     - *Worst-handled case*: **Superposition network**—U was selected for multiple features (e.g., "cat" and "dog"), making misrepresentation ambiguous when it fires for one but not the other.  
     - *Interpretability obligation*: The historical "purpose" of U (e.g., via training dynamics); not just current behavior.  
     - *Realism status*: Truth-apt, unique, and realist; demands the "actual algorithm" as selected by history.  

  7. **EMPTY BOX** (after "No" to misrepresentation in externalist branch)  
     - *Diagnosis*: **Incoherent/unexplored**—if content depends on history but cannot misrepresent, then history adds nothing beyond correlations (covered by Indicator Semantics). No one holds this; it collapses into Leaf 5.  

