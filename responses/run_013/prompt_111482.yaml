  Write a short research proposal for a term paper (about 6,000 words, one semester) on sphexishness: the digger wasp that, when its paralysed prey is nudged a few inches from the burrow, runs through its whole fixed sequence again instead of simply dragging the prey in — Hofstadter's name for behaviour that looks thoughtful but is really mindless, and Dennett's image of the absence of free will. (The anecdote is itself contested — the wasp adapts after enough repetitions — which is one of the cases worth using.) My half-formed idea is that "sphexish" is doing three jobs at once and that the free-will argument needs only one of them: (i) the current behaviour is rigid, a perturbation eliciting the same sequence rather than a new response; (ii) the mechanism is rigid, the sequence coming from a fixed routine with no learning or re-planning; (iii) the repertoire is rigid, there being no behaviour the creature could ever acquire. I suspect (iii) is false of every finite agent, so a creature that is not sphexish in that sense is impossible and the argument has to be relocated elsewhere; and that whether (i) even holds depends on the vocabulary of the description, since the same loop reads as "inspect until the prey is at the entrance" (flexible) or as "repeat the cycle" (rigid). State the question so that it has a determinate answer, explain why the existing discussions leave it open, lay out what I would actually do (including a case where the three readings come apart, and why this conceptual route rather than the obvious appeal to insect ethology), what would count as a result and what as failure, and a realistic scope for one semester. No citations — I'll add those myself.
