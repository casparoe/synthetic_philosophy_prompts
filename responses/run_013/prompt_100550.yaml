  I'm a retired geochemist who's spent the last few years reading philosophy on my own, and I've gotten stuck on the paradox of tolerance. I know the standard Popper move -- unlimited tolerance eventually destroys the conditions for tolerance -- so dont explain that to me again. What I want is to run the idea against a real episode: the Skokie fight in the late seventies, when the ACLU defended the right of a small Nazi party to march through a town full of Holocaust survivors, and lost a big chunk of its membership for it. Do the analysis in both directions. Going in: who is being asked to tolerate what, exactly? The paradox as I usually see it stated is about tolerating a viewpoint, but this case looks more like tolerating an organization, an assembly, a movement with members and uniforms and a plan -- and I suspect those aren't the same problem, though I cant yet say why. I've been calling the slippage the "toleration target" in my notes, if that helps. Does the theory actually tell the village or the ACLU what to do, or does it only license suppression after the danger is already plain? Coming back out: does Skokie confirm the paradox, complicate it, or expose it as a decision rule dressed up as a conceptual point? And say where the frame goes quiet -- I'd rather be told the tolerance question doesn't reach some feature of this case than watch it get stretched to cover everything. Answer in American English.
