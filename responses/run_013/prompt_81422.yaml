  I'm a software engineer, and for the past year I've been spending weekends helping a friend who runs a small type foundry. We built him a tool that scores any drawn glyph for how well it reads as the letter it's meant to be: it embeds the shape in a learned space of letterforms built from the foundry's archive and reports how close it sits to the cluster for that letter. It works well enough that the designers now run every candidate through it as a first filter, and everyone has quietly started treating a low score as evidence that a glyph isn't really the letter, whatever it looks like.

  I want a short story about the day that assumption gets tested. One of the designers brings in an 'a' for a display face — single-storey, the bowl drawn as a rounded triangle instead of an oval, the stem detached from the bowl and floating just to its right — and the tool scores it as barely an 'a' at all, while everyone who looks at it reads it as an 'a' without hesitation. Hold both sides of that disagreement in view rather than settling it: the person who wrote the scoring tool, for whom a letter is defined by its position in the space of shapes the archive has actually seen, and the designer, for whom the shape is an 'a' because of something the archive has never contained. Use a scene or two to make each position concrete — what the numbers look like on the screen, what the designer points at on the page — and end somewhere that leaves the reader with the question rather than the answer. Please invent the characters and the foundry; don't name real typefaces or real designers.
