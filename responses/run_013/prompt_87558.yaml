prompt: |-
  I am a software engineer with no formal philosophy background, and next month I am presenting a short paper to a university metaphysics reading group. The group is small and specific: two committed Lewisian counterpart theorists, who think that talk of one object literally appearing in more than one possible world is confused and that counterparts do all the explanatory work; one Kripkean essentialist, who insists that rigid designation and de re necessity require literal identity across worlds; one formal semanticist, who works on quantified modal logic and will care about nested modalities, accessibility relations, and whether the semantics preserves S5; and two philosophers of language, who are skeptical of possible worlds altogether and treat the framework as a useful fiction at best. They are friendly but rigorous, they know the standard moves, and they will interrupt with technical questions. I have twenty minutes for Q&A. Neither of us can look anything up during the session, so do not give me a reading list, citations, or page numbers; I need the objections and what to say back.

  My thesis is a version of counterpart theory that I call lineage counterpart theory. The standard debate treats possible worlds as isolated containers and asks whether one and the same object can appear in more than one of them. I want to replace that picture with a branching version-control DAG. A possible world is a branch or maximal path through the DAG. An ordinary object is not a single node but a lineage: a connected subgraph of versions. What we call transworld identity is not literal identity between world-bound objects; it is the relation between a version and its ancestors, descendants, or merge-base relatives along the lineage. Counterpart theory is right that cross-world identity is not literal identity, but wrong to model counterparts as separate individuals in separate worlds; counterparts are versions of one lineage, and the counterpart relation is the branch-and-merge structure of the DAG. De re modal claims about an object are claims about which versions of its lineage appear on which branches under a contextually selected counterpart relation. Essential properties are properties invariant across all versions of the lineage under that relation; accidental properties vary. My argument has three steps: first, the standard debate assumes isolated worlds and world-bound objects; second, a version-control DAG gives a better formal picture of modal space; third, this picture preserves the Lewisian insight that cross-world identity is not literal identity and the Kripkean insight that de re necessity is not merely a fact about how we describe counterparts. The cost is that modal space is not a set of disjoint worlds but a graph with merge points, so S5 may fail and the necessity of origin becomes a claim about lineage roots.

  Prepare my Q&A prep sheet. I want the eight or so objections I will actually get from this audience, not the ones I would get from a generic philosophy audience or from the internet. Order them by how much damage they would do to my position. Phrase each objection the way that audience member would put it, in their vocabulary and with their commitments visible. For each objection, give me a two-minute reply and a note on where that reply is soft. Tell me what I should concede up front and what I should hold, and identify the one reply that has to land for the paper to survive. Include the question I am hoping nobody asks, and explain why it is the one that worries me. Do not summarize my view back to me or survey the literature; I need the prep sheet.
