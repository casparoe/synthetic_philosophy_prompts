  - Covers your requested 4 + 4 deeper cuts (causal role, hard problem residue, zombies, first-person reports).  
  - Each fits on an index card—probes are keywords, replies/followups are concise.  
  - Balance: Targets metaphysics (Q2, Q7), cognition (Q1, Q4, Q8), and hard problem dissolution (Q3, Q6).
