prompt: |-
  For a while now I have been bothered by a pattern I first noticed in Maimonides and now seem to see everywhere, and I have never been able to decide whether it is one thing with a name or just a family of vaguely similar things I am lumping together. The place I first met it was his explanation of the sacrificial commandments in the Guide of the Perplexed. What he does not say is that sacrifice is intrinsically good or that it is what God most wants; he says that the Israelites had grown up in a world in which worship just meant sacrifice, that a religion suddenly stripped of it would have struck them as unintelligible and been rejected outright, and that the commandments therefore take over the institution they already knew and redirect it toward the one God instead of abolishing it. On that reading the sacrifices are a concession to where people actually were: the familiar form is kept, for the time being, so that the substance can be changed from within. I have since heard the same shape of story told about other things -- the law of kingship in the Hebrew Bible (the people insisted on a king, so a king is granted, but hedged about with rules), the divorce law (permitted, on the standard reading, because of people's hardness of heart rather than because it is the ideal), and the way a new religion will take over an old festival's date and trappings and pour a new meaning into it so that the change goes down more easily. In each case the defence of the rule is not that the rule is good but that the people for whom it was made could not yet have done without it.

  I am taking a seminar on medieval philosophy and brought this up, and the discussion only made me less sure of myself. Is there an established name for this specific move -- a rule or institution that is defended, not on its own merits, but as a concession to what people were already accustomed to, kept in its old outward form while its point is quietly relocated, and understood by those who defend it as something to be outgrown rather than as a permanent ideal? I cannot tell whether the word I want is accommodation, or whether that term is reserved for something narrower (divine condescension to human language and human frailty), or whether I am really describing syncretism, or the biologists' exaptation, or merely gradualism and transitional arrangements under a grander name. I would like to know which of these, if any, is the concept I am circling, and exactly where the boundaries fall. Does the pattern require that the concession be deliberate, as it is in Maimonides, rather than an unplanned survival of an obsolete practice? Does it require that the old form be preserved and only its meaning changed, or does it also cover cases where the old practice is simply tolerated alongside the new until it withers? And does it matter whether the concession is understood as temporary scaffolding or as a permanent second-best?

  If nothing established fits, I would rather have you name and define the thing yourself than hand me the nearest label and stop there. Either way, please give me the carving and not just the word: a definition, the cases that are clearly inside it and clearly outside it, and for each of the neighbouring concepts you consider, the reason it is close but not the same. Please state your final answer on the last line in the form \answer{...}, containing either the established term you settle on or, if there is none, the term you coin.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a pattern they first noticed in Maimonides' interpretation of sacrificial commandments - where religious practices aren't defended as intrinsically good, but as concessions to historical context. The key elements seem to be: preserving outward forms while changing meaning, temporary acceptance of imperfect practices, and pedagogical intent to eventually outgrow them.

  Hmm, the user mentions encountering similar patterns in biblical kingship laws, divorce provisions, and religious festival adaptations. Their core question is whether this has an established name - and they've already considered terms like accommodation, syncretism, exaptation. But they're unsure about boundaries: does it require deliberate concession? Must form be preserved? Is temporality essential?

  Looking at theological concepts... Divine accommodation is close but often broader. Syncretism describes blending but lacks the "provisional" aspect. Pedagogical tolerance captures the educational intent but isn't a standard term. The user seems to want precision about what distinguishes this specific maneuver.

  Interesting how they reject superficial labeling - they want "carving, not just the word." That tells me they need: 1) clear definition with necessary/sufficient conditions 2) paradigmatic examples 3) contrast with neighboring concepts. Their seminar experience left them more confused, so clarity is crucial.

  For the definition, I should emphasize: deliberate preservation of form, reorientation of purpose, explicit temporality. Cases like Maimonides' sacrifices are central; unplanned survivals (like accidental ritual carryovers) would be excluded. The kingship example shows how this differs from mere pragmatism - there's structured limitation built in.

  The term "pedagogical concession" might work since "pedagogical" implies intentional education toward an ideal. But is that established? In medieval philosophy contexts, "accommodation" is sometimes used this narrowly... though often it's broader. Perhaps specifying "provisional accommodation" would help.

  Wait - the user asked for an answer in \answer{} format. After comparing all options, "progressive accommodation" feels most precise: "progressive" captures the developmental aspect, "accommodation" nods to the theological tradition. It's not a common phrase but constructs meaning from recognizable components. Should contrast it with syncretism (which lacks intentional pedagogy) and divine accommodation (which includes non-provisional elements).

  Final decision: coin "progressive accommodation" as the established terms don't quite fit. The definition must include: 1) deliberate preservation 2) semantic reorientation 3) explicit transitional purpose. Then illustrate with their Maimonides example versus excluded cases like involuntary syncretism. That should give them the conceptual "carving" they requested.
answer: |-
  Based on your detailed description and the distinctions you seek, the established term **"divine accommodation"** comes closest, but it requires careful narrowing to fit your specific pattern. While often used broadly, its *provisional pedagogical* sense aligns best with Maimonides' approach. However, to precisely capture your pattern – especially the elements of preserved form, redirected meaning, deliberate concession, and explicit temporality – the most accurate term is **"progressive accommodation"**. Here's the conceptual carving:

  ### 1. **Core Concept: Progressive Accommodation**
      *   **Definition:** A deliberate strategy within religious, legal, or cultural reform where an existing institution, practice, or rule is retained in its outward form but fundamentally reoriented in meaning and purpose, specifically as a concession to historical circumstance or ingrained human custom. This retention is explicitly understood by its proponents as a temporary, pedagogical necessity to facilitate transition towards a higher ideal, not as an intrinsic good or permanent solution. The preserved form serves as a familiar vessel for a new substance, designed to be outgrown.
      *   **Necessary & Sufficient Conditions:**
          1.  **Deliberate Concession:** The practice is consciously preserved/adapted *because* of prevailing custom or human limitations, not merely by inertia.
          2.  **Formal Preservation:** The outward structure, ritual, or institution is maintained (or minimally adapted for compatibility).
          3.  **Semantic Reorientation:** The core meaning, purpose, or theological/moral significance is fundamentally changed.
          4.  **Explicit Pedagogical Temporality:** The accommodation is defended *as a stepping stone*, explicitly framed as necessary for the present but inferior to the ultimate ideal and destined for obsolescence or transcendence.

  ### 2. **Paradigmatic Examples (Clearly Inside)**
      *   **Maimonides' Sacrifices:** Form (animal sacrifice) kept; Substance (directed solely to One God, stripped of idolatrous meaning); Concession (to Egyptian cultural conditioning); Temporality (implied obsolescence in an ideal rational worship).
      *   **Deuteronomic Kingship Law (1 Sam 8 / Deut 17):** Form (monarchy) conceded; Substance (heavily regulated, subordinated to divine law, warned against); Concession ("the people insisted"); Temporality (presented as a reluctant concession, contrasting with the ideal of direct divine rule).
      *   **Mosaic Divorce Law (Matt 19:8/Mark 10:5 - Jesus' interpretation):** Form (divorce certificate) permitted; Substance (framed as a tragic allowance, not God's original intent); Concession ("because of your hardness of heart"); Temporality (explicitly contrasted with the "beginning" ideal, implying its impermanence in the Kingdom).
      *   **Christian Re-purposing of Pagan Festivals (e.g., Christmas/Yule, Easter/Eostre):** Form (date, some symbols/feasting) adopted; Substance (birth/resurrection of Christ replacing solar/fertility rites); Concession (to ease conversion of populations deeply attached to seasonal cycles); Temporality (often framed as "baptizing" culture, implying the pagan meaning is dead/transcended).

  ### 3. **Contrast Cases (Clearly Outside)**
      *   **Unplanned Syncretism:** The blending of practices/meanings through cultural contact *without* deliberate reformist intent or pedagogical purpose (e.g., Haitian Vodou incorporating Catholic saints without viewing them as temporary concessions towards pure monotheism). *Lacks deliberate concession and explicit pedagogical temporality.*
      *   **Pragmatic Gradualism/Transitional Arrangements:** Temporary measures for practical implementation, *without* semantic reorientation or framing as a concession to ingrained error (e.g., phasing out leaded gasoline for environmental/health reasons over time - practical, but the form isn't preserved with new meaning, nor is it framed as conceding a flawed worldview). *Lacks formal preservation with semantic reorientation and often lacks the pedagogical concession framing.*
      *   **Divine Accommodation (Broad Sense):** Includes instances where God "condescends" using human language/finite concepts *without* necessarily preserving flawed practices or implying obsolescence (e.g., anthropomorphic language about God - it's accommodated to human understanding but not a practice to be outgrown). *Lacks the specific elements of preserving a flawed institutional form and explicit temporality.*
      *   **Exaptation (Biology):** A structure evolving for one function being co-opted for a new use (e.g., feathers for insulation co-opted for flight). *Lacks intentionality, pedagogical purpose, and the element of concession to ingrained custom.*
      *   **Permanent Second-Best:** A rule or institution accepted as inherently sub-optimal but necessary *indefinitely* due to human sin/weakness (e.g., Augustine's view of the state/government as a necessary restraint on sin post-Fall, not a temporary concession to be outgrown). *Lacks explicit pedagogical temporality.*
      *   **Simple Tolerance:** Allowing an old practice to continue alongside the new without integrating it or reorienting its meaning (e.g., early Christians allowing Jewish converts to continue kosher laws if they wished, without redefining their meaning in Christ - Acts 15). *Lacks semantic reorientation and the pedagogical framing of the old form as a vessel for the new substance.*

  ### 4. **Boundary Refinements (Addressing Your Questions)**
      *   **Deliberate vs. Unplanned:** **Required.** Your pattern hinges on the reformer's/proponent's *conscious strategy*. Unplanned survivals are historical artifacts or syncretism, not progressive accommodation.
      *   **Form Preserved + Meaning Changed vs. Simple Tolerance:** **Required.** The core of your pattern is the *preserved form carrying new meaning*. Mere tolerance (letting the old exist alongside) lacks this transformative repurposing within the familiar vessel.
      *   **Temporary Scaffolding vs. Permanent Second-Best:** **Required (Scaffolding).** The explicit understanding that the accommodated form is *provisional*, a concession *to be outgrown* as understanding/conditions improve, is essential. A permanent second-best is a different category.

  ### 5. **Why "Progressive Accommodation"?**
      *   **Accommodation:** Captures the core idea of divine/human concession to circumstance and limitation, anchoring it in the theological/philosophical tradition (Maimonides explicitly uses this framework).
      *   **Progressive:** Crucially adds the elements of *intentional directionality* (towards a higher ideal), *pedagogy* (teaching through concession), and *temporality* (designed for obsolescence). It emphasizes the movement from the accommodated form towards the ultimate goal.
      *   **Distinguishes from Broader Accommodation:** It specifies the *type* of accommodation: one that is dynamic, transitional, and aimed at progression beyond the accommodated state itself.
      *   **Superior to Alternatives:** "Pedagogical concession" is descriptive but not an established term and less elegant. "Provisional accommodation" focuses only on temporality, missing the directed progression. Syncretism lacks intentionality and pedagogical purpose. Exaptation lacks intentionality and cultural concession.

  **Conclusion:** Your identified pattern is a distinct and sophisticated subtype of divine accommodation, characterized by its deliberate use of preserved form, semantic reorientation, concession to custom, and explicit pedagogical temporality aimed at progression beyond the accommodated state. The established broad term "divine accommodation" *can* encompass it, but often doesn't capture the specific nuances you emphasize. Therefore, **"progressive accommodation"** is the most precise descriptor, naming and defining the specific conceptual space you've delineated.

  \answer{progressive accommodation}
