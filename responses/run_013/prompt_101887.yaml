answer: |-
  ### Brainstorming: What Jointness Measures & Common Pitfalls  
  **Target phenomenon:** Genuine jointness measures the strength of a *plural subject* — the extent to which individuals constitute a "we" that acts as a unified agent. It's not just coordination but *shared agency* grounded in mutual recognition and commitment.  

  **Pitfalls of reductionism:**  
  - Overemphasizing *cognition* (e.g., demanding explicit shared goals) ignores embodied, habitual joint action (e.g., seasoned dancers).  
  - Overemphasizing *behavior* (e.g., coordination) misses normativity (e.g., price-fixers coordinate but aren’t jointly committed).  
  - Ignoring *asymmetries* (e.g., human-AI collaboration) risks anthropomorphizing non-agents.  

  **Core insight:** Jointness requires a "triple helix" of (1) *cognitive integration* (shared goals), (2) *behavioral interdependence* (responsiveness), and (3) *normative binding* (commitment).  

  ---

  ### (a) Ranking & Justification  
  *(Most to least load-bearing for genuine jointness)*  

  1. **Commitment (3)**  
     *Why:* The normative "glue" that transforms parallel actions into obligations. Without mutual commitment, jointness collapses into coincidence (e.g., strangers avoid bumping ≠ carrying a sofa).  
  2. **Mutual Responsiveness (1)**  
     *Why:* The dynamic engine of joint action. Real-time adjustment signals treating the other as a co-agent, not an obstacle (e.g., sofa carriers micro-adjust; crowd surges lack this).  
  3. **Shared Goal Representation (2)**  
     *Why:* Embodies the "we-perspective." Intending the *joint outcome* (not just personal subgoals) is constitutive of plural agency (e.g., co-writers intend "our document"; traders follow signals separately).  
  4. **Repair Readiness (6)**  
     *Why:* Stress-tests the joint frame. Willingness to collaboratively fix ruptures proves resilience of the "we" (e.g., married cooks improvise; price-fixers defect).  
  5. **Subplan Meshing (5)**  
     *Why:* Reveals depth of integration. Meshing means plans are co-constituted, not merely compatible (e.g., couple’s routine vs. strangers exiting).  
  6. **Stake Asymmetry Tolerance (7)**  
     *Why:* Demonstrates investment in the "we." Absorbing costs signals prioritization of joint success over individual fairness.  
  7. **Common Knowledge (4)**  
     *Why:* Often overrated. Mature joint action (e.g., longtime partners) relies on implicit understanding; explicit common knowledge is scaffolding for *new* collaborations.  
  8. **Emergent Lock-In (8)**  
     *Why:* Describes coordination *without* jointness (e.g., traders, crowds). Strategically stable ≠ jointly intended.  

  ---

  ### (b) Weights (Summing to 1.0)  
  | **Criterion**               | **Weight** |  
  |-----------------------------|------------|  
  | Commitment (3)              | 0.25       |  
  | Mutual Responsiveness (1)   | 0.20       |  
  | Shared Goal (2)             | 0.18       |  
  | Repair Readiness (6)        | 0.12       |  
  | Subplan Meshing (5)         | 0.10       |  
  | Stake Asymmetry (7)         | 0.07       |  
  | Common Knowledge (4)        | 0.05       |  
  | Emergent Lock-In (8)        | 0.03       |  

  ---

  ### (c) Scoring Cases  
  *(Formula: Σ(Weight × Score), where Score = 0-1 per criterion)*  

  1. **Two strangers exiting via same door**  
     - **Score: 0.18**  
     - *Breakdown:* High Emergent Lock-In (1.0 × 0.03) + Moderate Mutual Responsiveness (0.5 × 0.20) + Low all else (near 0). No shared goal, commitment, or repair. Coordination is accidental.  

  2. **Long-married couple cooking**  
     - **Score: 0.85**  
     - *Breakdown:* Near-max Shared Goal (0.9 × 0.18), Responsiveness (0.95 × 0.20), Commitment (1.0 × 0.25), Repair (0.8 × 0.12), Meshing (1.0 × 0.10). Low Common Knowledge (0.2 × 0.05) – routines are habitual, not explicit.  

  3. **Price-fixing firms**  
     - **Score: 0.28**  
     - *Breakdown:* High Emergent Lock-In (1.0 × 0.03) + Moderate Responsiveness (0.6 × 0.20) + Meshing (0.7 × 0.10). **Zero Commitment** (defection fear ≠ mutual obligation) or Shared Goal (each intends profit, not "our collusion").  

  ---

  ### (d) Most Impactful Criterion to Delete  
  **Commitment (3)**  
  - **Impact:** Deleting it would *drastically inflate scores* for adversarial/emergent cases (e.g., price-fixers jump from 0.28 → 0.53; strangers from 0.18 → 0.43).  
  - **Verdict:** **Keep it.** Its impact proves it’s doing *legitimate work*: it’s the keystone distinguishing *genuine joint agency* from strategic coordination. Without it, the rubric confuses "aligned" with "joint."  

  ---

  ### Missing Criterion: **Affective Attunement**  
  - **Why essential:** Joint action often relies on shared emotional rhythms (e.g., sensing frustration/joy in a partner and adjusting). This underpins responsiveness and repair.  
  - **Weight suggestion:** 0.08 (between Repair and Meshing).  

  ### Philosophical Stance  
  - **Reject atomism:** Jointness isn’t reducible to individual mental states (Bratman) or behavior (Gilbert). It emerges from the *relational space* of mutual recognition.  
  - **Demote "Emergent Lock-In":** It confuses *system-level* stability with *agential* jointness. Useful for crowds/traders, but orthogonal to shared intention.  
  - **Upgrade "Repair":** Breakdown responses reveal whether the "we" was ever truly constituted (inspired by Goffman).  

  This rubric prioritizes the *normative-affective core* of joint action over mechanistic coordination. The weights reflect that jointness is *constituted* by commitment and responsiveness, *sustained* by shared goals and repair, and *enhanced* by meshing and sacrifice.
