  We are going to design an in-class game that leads students to discover Arrow's Impossibility Theorem through a series of committee decisions and constitutional tests. The goal is to have them experience the tension between independence of irrelevant alternatives (IIA) and other desirable properties (like non-dictatorship and Pareto efficiency) without initially naming the theorem.

  ### Overview
  - **Setting**: A committee of 16 students (or any even number for simplicity) tasked with choosing a decision rule (voting rule) for their club.
  - **Scenario**: The club must decide on a "theme" for an upcoming event. There are three main proposals: A (Art Show), B (Bake Sale), C (Charity Run). They will design a voting rule to choose among these. Later, we introduce a fourth alternative D (Dance Party) to test IIA.
  - **Phases**:
    1. **Rule-Making Committee**: Students, in groups, propose voting rules. The whole class votes on which rule to adopt.
    2. **Constitutional Review**: Test the chosen rule against three principles they care about (Pareto, Non-Dictatorship, IIA). The test will reveal that one principle must be violated.
    3. **Debrief**: Connect the experience to Arrow's theorem.

  ### Materials
  - Preference profiles (pre-assigned to students) for 3 alternatives (A, B, C) and then for 4 alternatives (A, B, C, D). We need a profile that:
      - In the 3-alternative case, the rule they choose (say, pairwise majority) leads to a clear winner (say, A).
      - When D is added, the same rule (applied to the new set) leads to a different winner (say, B) even though no one changed their ranking of A, B, C and D is not ranked first by anyone.
  - Handouts for each student with their assigned rankings for the two scenarios (with and without D).
  - A worksheet for the committee to design the rule.
  - A poster or slide for the three principles (Pareto, Non-Dictatorship, IIA) written in plain language.

  ### Timeline (90 minutes)
  1. **Introduction (5 min)**: Set the scenario. The club must choose a theme. They will design a fair voting rule. The rule must be chosen by the committee (the class) and then tested.
  2. **Rule-Making Phase (20 min)**:
     - Divide the class into 4 groups of 4. Each group proposes a voting rule (explain what a voting rule is: a method to aggregate rankings into a group ranking or a winner). Examples: Plurality, Borda count, Pairwise majority (Condorcet), etc.
     - Groups present their rule (2 min each). The class votes by plurality for which rule to adopt. (We'll assume they choose pairwise majority because it's intuitive and we can set up a cycle? But note: we don't want a cycle in the first vote. We want a clear winner in the first scenario and then a flip when D is added.)
  3. **First Vote (10 min)**:
     - Distribute the first preference profile (3 alternatives: A, B, C) to students. Each student gets a card with their ranking (so they know their own, but not others). 
     - Run the vote using the chosen rule. Let them compute the result. (We design the profile so that A wins by pairwise majority: A beats B, A beats C, and B beats C. So A is the Condorcet winner.)
  4. **Introduce a New Alternative (5 min)**: Now, a new proposal D is introduced. Emphasize that D is not anyone's favorite. Distribute the new preference profile (with D added). The key: the relative rankings of A, B, C remain the same for every voter when D is inserted (but not necessarily in the same positions). We set it so that when D is added, in pairwise comparisons, now B becomes the Condorcet winner (because D siphons off some votes in the comparisons). Example profile below.
  5. **Second Vote (10 min)**: Run the same rule (pairwise majority) on the new set of 4 alternatives. They will see that now B wins. But note: no one changed their mind about A, B, C. Only D was added and D is not ranked first by anyone. So why did A lose to B?
  6. **Constitutional Review (20 min)**:
     - Present the three principles (written on the board):
        - **Unanimity (Pareto)**: If everyone prefers X over Y, then the group must prefer X over Y.
        - **No Dictator**: No single person's preferences always determine the group's preferences.
        - **Independence of Irrelevant Alternatives (IIA)**: The group's preference between X and Y should depend only on the individual preferences between X and Y (and not on the presence of another alternative Z).
     - Test their rule against these:
        - Unanimity: Check in the first vote: was there any pair where everyone agreed? (Probably not needed, but we can check in the profile that it holds in the first vote and in the second vote for some pairs.)
        - No Dictator: Check that no single voter's ranking always matches the group's. (We can show that in the two votes, different voters have different top choices and the group choice changed without any one voter forcing it.)
        - IIA: Here's the trap. In the first vote, A was preferred to B by the group. In the second vote, even though no one changed their ranking of A vs B, the group now prefers B to A? So the rule violates IIA.
     - They must now try to fix the rule. They'll propose patches (like requiring a Condorcet winner, or switching to Borda). But then we test the new rule against the principles. For example, if they switch to Borda, we can show that it violates IIA again? Or if they require a Condorcet winner, then we can show a profile without a Condorcet winner and then they have to break the cycle arbitrarily (which might violate unanimity or lead to a dictator?).

     However, note: We want to show that any rule they choose must violate one of the principles. So we need to be prepared with profiles that break their proposed rules.

     Alternative path: Instead of having them propose a new rule, we can point out that the same rule that worked for 3 alternatives now fails IIA. Then we ask: can we design a rule that never fails IIA? They might propose unanimity or dictatorship. Then we show that if we require IIA and Pareto, then we get a dictator (by Arrow's theorem). But we don't want to prove the theorem, just let them feel the trap.

     We can run a quick vote: "Which principle are you willing to give up?" and then show that giving up any one leads to problems.

  7. **Debrief (20 min)**:
     - Connect the dots: What they experienced is Arrow's Impossibility Theorem. State the theorem: There is no voting rule that satisfies Unanimity, IIA, and Non-Dictatorship when there are at least 3 alternatives.
     - Map the activity:
          - Rule-making: They tried to design a fair rule.
          - First vote: The rule worked and satisfied Pareto (probably) and non-dictatorship.
          - Second vote: The rule violated IIA when an irrelevant alternative (D) was added.
          - When they tried to fix it, they either broke IIA again or had to accept a dictator or break unanimity.
     - Discuss: Why is IIA important? (Because otherwise, the outcome can be manipulated by adding alternatives that shouldn't matter.)

