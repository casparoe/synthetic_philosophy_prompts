  - Or, as the instructor, we can steer them by saying that pairwise majority might lead to cycles and that's been covered, so try something else.

  ### What can go wrong?
  1. **Students don't choose Borda**: If they choose a rule that we haven't prepared a profile for, we might not get the IIA violation. 
     - *Contingency*: Prepare profiles for multiple rules (plurality, runoff, etc.). For example, for plurality, we can have a profile where in the first vote, A wins, and then when D is added, D is not ranked first, but it splits the vote so that B wins. And the individual rankings of A vs B are unchanged.

     Example for plurality:
     - **Profile 1 (3 alternatives)**: 
          - 8 voters: A > B > C
          - 7 voters: B > A > C
          - 1 voter: C > A > B
          -> A wins with 8 votes.
     - **Profile 2 (4 alternatives)**:
          - 8 voters: A > D > B > C   [now they put D second, but still A first]
          - 7 voters: B > A > D > C   [unchanged top choice]
          - 1 voter: C > A > B > D
          -> Plurality: A:8, B:7, C:1, D:0 -> A wins.

     That doesn't work. We need B to win. So let's have some of the A voters switch to having D first? But then D is ranked first, which we want to avoid.

     Alternatively, we can have:
     - **Profile 1 (3 alternatives)**:
          - 6 voters: A > B > C
          - 5 voters: B > C > A
          - 5 voters: C > A > B
          -> Plurality: A:6, B:5, C:5 -> A wins.
     - **Profile 2 (4 alternatives)**:
          - 6 voters: split into two groups to simulate vote splitting? But we can't change preferences arbitrarily.

     Alternatively, have the C voters in the first vote switch to ranking D first? But that would be changing their top choice. We want to add D without anyone having it first.

     So plurality is hard to manipulate without having D receive first-place votes.

     Given time constraints, it's safer to steer them to Borda.

  2. **Students don't see the violation of IIA as a problem**: They might think it's natural that adding an alternative changes the winner.
     - *Handling*: In the constitutional review, emphasize that the relative ranking of A and B hasn't changed for anyone, so why should the group's preference between A and B flip? Also, D is not a contender (no one ranks it first).

  3. **Time runs out**: The activity has many phases.
     - *Handling*: Keep strict time limits. Have the preference profiles pre-printed for quick distribution. Use a spreadsheet on a projector to calculate Borda scores quickly.

  4. **The constitutional review becomes too abstract**: Students might not connect the principles to the example.
     - *Handling*: Use the specific numbers from the vote. Show the individual preferences for A vs B in both votes (they are the same) and then show that in the first vote the group chose A, in the second vote the group chose B. Ask: "Is there any voter who changed their mind about A versus B? No. Then why did the group's decision flip?"

  ### What the activity cannot reproduce
  - **The full generality of Arrow's theorem**: We are only showing one example. There might be rules that work for this profile but fail in others. We are not proving that every rule must fail.
  - **The full induction and the concept of a pivotal voter**: The proof of Arrow's theorem uses an induction argument (with the pivotal voter) which is not illustrated here.
  - **The universality domain**: We are not discussing that the rule must work for every possible preference profile.

  ### Where the design is most likely to fail
  - **The students not feeling the trap**: If the example is too contrived, they might not see it as a natural flaw in fair rule-making. They might think it's a trick with numbers.
  - **The constitutional review not being compelling**: If they are willing to give up IIA easily, then the tension is resolved too simply.

  ### What would convince you to scrap it and rebuild?
  - If students consistently do not experience the "trap" and instead see the IIA violation as a minor technicality or as an acceptable flaw.
  - If the activity takes too long and the debrief is rushed, so they don't connect the experience to the theorem.
  - If in trying to fix the rule, they come up with a rule that they believe satisfies all three and we cannot break it with the available time and profiles.

  ### Revised Timeline with Borda in mind
  1. **Introduction (5 min)**
  2. **Rule-Making (15 min)**: Groups work on proposing a rule. Instructor nudges: "Remember, we want a rule that respects the rankings and is fair. Pairwise majority might lead to cycles, so think of other methods."
  3. **Vote on Rule (5 min)**: They vote, hopefully choosing Borda.
  4. **First Vote (10 min)**: Distribute Profile 1 (3 alternatives). Calculate Borda scores. A wins.
  5. **Introduce D (5 min)**: "A new proposal, Dance Party (D), is introduced. It's not anyone's favorite, but it might affect the outcome. Here are your new rankings (which are the same as before for A, B, C, but with D inserted somewhere)."
  6. **Second Vote (10 min)**: Distribute Profile 2 (4 alternatives). Calculate Borda scores. B wins.
  7. **Constitutional Review (20 min)**: 
     - Present the three principles.
     - Check: 
          - Unanimity: Was there any pair where everyone agreed? In both votes, probably not. But we can check one: In the first vote, did everyone prefer A over some other? Not necessarily. But we can show that if there had been unanimity, it would have been respected? (In the Borda count, it would.) 
          - Non-dictatorship: Show that no single voter's ranking matches the group's. In the first vote, the group chose A, but not everyone had A first. In the second vote, the group chose B, but not everyone had B first.
          - IIA: The group's preference between A and B: In the first vote, A won overall and B was second. In the second vote, B won overall and A was second. But did any voter change their mind about A vs B? Have the students raise their hands: How many prefer A>B in the first vote? How many in the second? (Same.) Yet the group ranking flipped? So IIA is violated.
     - Now, challenge them to fix the rule to avoid the IIA violation. They might propose pairwise majority. Then we run the first profile with pairwise majority: cycle. Then they need a tie-breaker. We show that the tie-breaker might violate IIA? Or they might propose a different rule. We can quickly run the same profiles with the new rule to see if it avoids the problem? But time is short. Instead, we can say: "We don't have time to test every rule, but it turns out that every rule has a flaw. In fact, there's a famous theorem that says..."

  8. **Debrief (20 min)**: Reveal Arrow's theorem. Discuss why IIA might be important (prevents strategic voting by adding alternatives, ensures stability of choices). Mention that this is just one example, but the theorem is general.

  ### Handout Example
  **First Preference Profile (3 alternatives)**
  - 6 voters: A > B > C
  - 5 voters: B > C > A
  - 5 voters: C > A > B

  **Second Preference Profile (4 alternatives)**
  - 6 voters: A > B > C > D
  - 5 voters: B > D > C > A
  - 5 voters: C > A > B > D

  Assign each student a voter type (randomly) and give them a card with their ranking.

  This should do it.
answer: |-
  Below is a detailed in-class game designed to make students viscerally experience Arrow's Impossibility Theorem, focusing on the tension between IIA and other fairness axioms. The activity avoids naming the theorem until the debrief and centers on students building/testing their own voting rule. It includes a specific preference profile, materials, timeline, failure points, and validation criteria.

  ---

  ### **Activity Design: "The Constitutional Trap"**
  **Core Idea**: Students act as a committee designing a voting rule for their university club. They propose rules, vote on one, then test it in a staged "constitutional review" where they confront an IIA violation (a flipped outcome when an irrelevant alternative is added). The debrief reveals they were trapped by Arrow’s theorem.

  #### **Key Elements**
  - **Scenario**: Club must choose an event theme. Proposals: 
    - `A` (Art Exhibition), `B` (Beach Cleanup), `C` (Charity Auction).  
    Later, `D` (Dance Marathon) is added—**no one ranks it first**, but it flips the winner.
  - **Stakes**: Winning rule gets a "legacy plaque" (symbolic prize); students have roles (e.g., event planners, budget officers) to incentivize investment.
  - **Voting Rule Construction**: Groups propose rules, class votes to adopt one (e.g., Borda count).  
  - **Constitutional Review**: Test the rule against 3 principles:  
    > 1. **Unanimity**: If everyone prefers `X > Y`, group must prefer `X > Y`.  
    > 2. **No Dictator**: No single voter always decides the outcome.  
    > 3. **Pairwise Consistency (IIA in disguise)**: Group ranking of `X` vs. `Y` shouldn’t change if an irrelevant `Z` is added/removed.  

  #### **Preference Profiles**
  **Profile 1 (3 options: A, B, C)**:  
  - **6 voters**: `A > B > C`  
  - **5 voters**: `B > C > A`  
  - **5 voters**: `C > A > B`  

  **Profile 2 (4 options: A, B, C, D)**:  
  - **6 voters**: `A > B > C > D` (relative A,B,C unchanged)  
  - **5 voters**: `B > D > C > A` (relative A,B,C: `B > C > A`)  
  - **5 voters**: `C > A > B > D` (relative A,B,C: `C > A > B`)  

  **Properties**:  
  - In Profile 1, **A wins** under Borda count (scores: A=17, B=16, C=15).  
  - In Profile 2, **B wins** under the same rule (scores: A=28, B=32, C=26, D=10).  
  - **IIA violation**: No voter changes `A` vs. `B` ranking (6 prefer `A>B`, 5 prefer `B>A`, 5 prefer `A>B` in both profiles), but group outcome flips from `A>B` to `B>A` due to `D`.  
  - `D` is irrelevant: No one ranks it first.  

  ---

  ### **Materials**
  1. **Student Handouts**:  
     - Role cards (e.g., "Budget Officer: You care about cost-effectiveness; prefer Charity Auction").  
     - Preference cards for Profiles 1 and 2 (assign voter types randomly).  
     - Worksheet for groups to design voting rules.  
  2. **Instructor Resources**:  
     - Slides/posters of the 3 principles (avoid technical terms; use plain language).  
     - Scoreboard for Borda calculations (pre-calculated for speed).  
     - Timer.  
  3. **Debrief Slides**:  
     - Mapping each phase to Arrow’s axioms.  
     - Final reveal: "Today, you re-discovered Arrow’s Impossibility Theorem."  

  ---

  ### **Timeline (90 min total)**
  1. **Setup (10 min)**:  
     - Introduce scenario, roles, and proposals (`A`, `B`, `C`).  
     - Split into 4 groups (4 students each).  

  2. **Rule-Making Phase (20 min)**:  
     - **Task**: Groups propose a voting rule (e.g., Borda, plurality, Condorcet). Encourage diversity.  
     - **Instructor Nudge**: "Avoid rules that cause cycles—we want one clear winner!" (Steers them toward Borda).  
     - Groups pitch rules (2 min each). Class votes to adopt one (e.g., Borda count).  

  3. **First Vote (15 min)**:  
     - Distribute **Profile 1** preference cards.  
     - Run vote using chosen rule. Verify **A wins**.  
     - Celebrate "fair" outcome.  

  4. **Crisis (5 min)**:  
     - Introduce `D`: "A donor insists we consider Dance Marathon. No one likes it best, but we must include it."  
     - Distribute **Profile 2** cards (emphasize: "Your rankings of `A`, `B`, `C` don’t change!").  

  5. **Second Vote (10 min)**:  
     - Re-run vote with same rule. Verify **B wins**.  
     - Highlight shock: "Why did `A` lose? No one changed their `A` vs. `B` ranking!"  

  6. **Constitutional Review (20 min)**:  
     - Test rule against the 3 principles:  
       - **Unanimity**: Check if respected (e.g., if all prefer `A > C`, group does too).  
       - **No Dictator**: Show no single voter matches group outcome in both votes.  
       - **Pairwise Consistency (IIA)**:  
         > "In Vote 1, the group ranked `A > B`.  
         > In Vote 2, the group ranked `B > A`.  
         > But no one changed their `A` vs. `B` ranking!  
         > **Does your rule violate Pairwise Consistency?**"  
     - **Trap**: Students realize their rule fails IIA.  
     - **Patch Attempt**: Ask, "How can we fix this?" Groups suggest tweaks (e.g., "Ignore `D`"). Run a quick test with the same profiles to show:  
       - If they ignore `D`, Pairwise Consistency holds, but Unanimity/No Dictator may break (e.g., if `D` shifts rankings elsewhere).  
       - If they change rules, new flaws emerge (e.g., Condorcet causes cycles, Borda violates IIA again).  

  7. **Debrief (10 min)**:  
     - Reveal the theorem: "Today, you hit Arrow’s Impossibility Theorem: No rule satisfies all three principles with ≥3 options."  
     - Map phases to axioms:  
       | **Phase** | **Arrow’s Axiom** | **Trap** |  
       |-----------|-------------------|----------|  
       | Rule-Making | Define "fair" rule | Hidden tension |  
       | Vote 1 | Pareto/Unanimity | Seems satisfied |  
       | Vote 2 | IIA | Violation exposed |  
       | Patching | Non-Dictatorship | Fixes create new flaws |  
     - **Key Insight**: "IIA *looks* harmless, but it’s the trap. Every 'fix' either lets one person veto (dictator) or breaks unanimity."  

  ---

  ### **Predictable Problems & Mitigation**
  1. **Students Don’t Choose Borda**:  
     - **Likelihood**: High. They may pick plurality or Condorcet.  
     - **Mitigation**:  
       - Pre-calculate profiles for other rules (e.g., for plurality: Profile 1: A=6, B=5, C=5 → A wins; Profile 2: A=6, B=5, C=5, D=0 → A still wins 😬). **Workaround**: Steer them to Borda by having groups read about its "fairness" in a handout. If they pick another rule, use the Borda example anyway and say, "Many experts suggest this—let’s test it!"  

  2. **They Miss the IIA Violation**:  
     - **Likelihood**: Medium. Some may say, "Adding `D` *should* change things!"  
     - **Mitigation**: Stress: "Did *anyone* change their mind about `A` vs. `B`? No. Why did the group flip?" Use the scoreboard to show individual `A` vs. `B` rankings are identical.  

  3. **Time Runs Out**:  
     - **Likelihood**: High. Constitutional review often overruns.  
     - **Mitigation**:  
       - Pre-calculate Borda scores.  
       - Skip live "patching" if short on time; describe hypothetical fixes.  
       - Prioritize Debrief—it’s where the theorem clicks.  

  4. **Students Reject the Trap**:  
     - **Likelihood**: Low, but possible if they resist IIA.  
     - **Mitigation**: Invoke stakes: "As event planners, would you accept a rule that flips outcomes arbitrarily?"  

  ---

  ### **What the Activity Can’t Reproduce**
  1. **Induction to `n` Voters**:  
     - The activity uses one profile (16 voters). Arrow’s theorem holds for *all* profiles with ≥2 voters and ≥3 options. Students don’t see the full generality.  

  2. **Universal Domain**:  
     - Students assume preferences are fixed. They don’t see that the theorem requires the rule to work for *every possible* preference ordering.  

  3. **Pivotal Voter Proof**:  
     - The geometric "voter by voter" proof (e.g., the pivotal voter who becomes a dictator) isn’t illustrated. The activity shows the *existence* of a flaw, not the *mechanism*.  

  4. **Non-Dictatorship as a Minor Flaw**:  
     - Students may accept a "veto" as reasonable. The theorem’s "full dictatorship" (one voter *always* decides) is harder to simulate.  

  ---

  ### **Where the Design Is Most Likely to Fail**
  - **Failure Point**: Students view IIA as a technicality, not a core flaw.  
    - **Why**: If they don’t feel the injustice of the flip ("B is fine too!"), the trap lacks impact.  
  - **Validation for Scrapping**:  
    - If >50% of students, in a post-activity poll, say:  
      > "IIA isn’t important" or "The outcome flip makes sense,"  
      the activity failed. Rebuild by:  
      - **Sharper stakes**: Simulate a real-world consequence (e.g., "Losing `A` means losing a $10k grant").  
      - **More profiles**: Use 2–3 IIA violations (e.g., healthcare policy choices) to show recurring unfairness.  
    - **Alternative Approach**: Run the activity *after* teaching IIA abstractly, using this to "confirm" its fragility.  

  ---

  ### **Instructor Script Snippets**
  - **Introducing `D`**: "The donor is adamant. We *must* include Dance Marathon. Remember: It’s nobody’s favorite, and your views on `A`, `B`, `C` haven’t changed."  
  - **Constitutional Review**: "You demanded Pairwise Consistency: If no one changes their mind on `A` vs. `B`, the group shouldn’t flip. Did your rule pass? ... *Why not?*"  
  - **Debrief Reveal**: "Today, you weren’t just designing a rule—you were walking into a 70-year-old trap. Economists call it Arrow’s Impossibility Theorem."  

  This design makes IIA the protagonist of the trap, avoids Condorcet fatigue, and leverages student-created rules for buy-in. Run it twice internally to tweak timing!
