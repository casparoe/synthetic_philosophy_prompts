  ## Draft Joint Statement

  **Joint Statement by Constitutive Panpsychists and Cosmopsychists**

  **1. Shared Commitments**

  We, constitutive panpsychists and cosmopsychists, agree on the following:

  1.1 **Experience is fundamental**: Subjective experience is a basic feature of reality. It is not reducible to, or emergent from, non-experiential properties. This commitment rules out:
     - Any theory that denies the reality of subjective experience (eliminativism).
     - Any theory that treats experience as strongly emergent from non-experiential properties (materialist emergentism).
     - The idea that experience is epiphenomenal or illusory.

  1.2 **Rejection of Strong Emergence**: We reject the notion that experience can emerge from non-experiential properties because such emergence is inexplicable (the hard problem of consciousness). Thus, we both posit that experience must be present at the fundamental level of reality.

  1.3 **Subjecthood**: A subject is an entity that has experiences. There is a perspective, a point of view, associated with a subject. We agree that a subject need not be human or even biological; it may exist at any scale.

  1.4 **The Derivation Problem**: 
     - The constitutive panpsychist holds that the fundamental subjects are micro-level entities (e.g., particles). They then face the challenge of explaining how these micro-subjects combine to form unified macro-subjects (the combination problem).
     - The cosmopsychist holds that the fundamental subject is the cosmos as a whole. They then face the challenge of explaining how this single cosmic subject gives rise to individual, bounded subjects (the decomposition problem).

  **2. Points of Disagreement**

  We have the following disagreements, which we state clearly:

  | Issue | Constitutive Panpsychist Position | Cosmopsychist Position |
  |-------|-----------------------------------|------------------------|
  | **The Fundamental Subject** | The fundamental subjects are the smallest entities (e.g., particles) which possess a minimal form of experience. | The fundamental subject is the cosmos as a whole, which possesses an all-encompassing form of experience. |
  | **Direction of Derivation** | Macro-level subjects (e.g., human minds) are derived from the combination of micro-subjects. | Micro-level subjects (e.g., human minds) are derived from the decomposition of the cosmic subject. |
  | **Primary Challenge** | The primary challenge is to explain how micro-subjects combine to form a unified macro-subject (the combination problem). | The primary challenge is to explain how the cosmic subject decomposes into distinct, bounded micro-subjects (the decomposition problem). |

  **3. Cruxes**

  We identify two key cruxes:

  3.1 **Crux 1: The possibility of a fundamental composite subject**
     - **Issue**: Can a composite entity (with parts) be a fundamental subject?
     - **Case Consideration**: Consider a complex system that is highly integrated (like the human brain) and a simple system (like an electron). Both sides agree that the human brain supports a unified subject. The question is whether such a composite system can be fundamental.
     - **CP Prediction**: A composite system cannot be fundamental because it depends on its parts. Therefore, the fundamental level must be at the micro level. The cosmic subject, being composite, cannot be fundamental.
     - **C Prediction**: A composite system can be fundamental because the whole is prior to its parts. Therefore, the cosmic subject, being the whole, is fundamental.

  3.2 **Crux 2: The symmetry of the combination and decomposition problems**
     - **Issue**: Are the problems of subject combination (how do micro-subjects form a unified macro-subject?) and subject decomposition (how does the cosmic subject give rise to individual subjects?) symmetric and equally difficult, or are they fundamentally different?
