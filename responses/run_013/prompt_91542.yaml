prompt: |-
  In my graduate seminar in philosophy of economics on Keynes's theory of probability, a colleague has taken to invoking the slogan that probability is a branch of logic. I have now heard it do several different jobs at once: to insist that probability judgments are objective rather than psychological, to reject the frequency theory, and to argue that practical decisions under uncertainty cannot be modeled as expected-utility maximization over subjective degrees of belief. I would like a conceptual map I can circulate to students. Lay out the distinct precise theses that the slogan could be expressing, from the nearly trivial to the genuinely radical. For each, indicate whether it is a platitude, a substantive and defensible position, or false; and explain what it would commit one to regarding the relation between probability and deductive logic, the possibility of non-numerical or merely comparative probabilities, the distinction between the probability of a proposition and the weight of the evidence for it, and the status of subjective degrees of belief. Then say which of these readings would actually support the uses to which my colleague puts the slogan, especially the use of it to dismiss subjective Bayesianism and to insist that Keynesian uncertainty is not merely low probability. I do not want a bibliography or citations; I want the menu of readings and your verdicts on them.
reasoning: |-
  We are given the slogan: "probability is a branch of logic". We must lay out distinct theses that this slogan might express, ranging from nearly trivial to genuinely radical. For each, we assess whether it is a platitude, substantive and defensible, or false. We also explain what each thesis commits one to regarding:

  1. The relation between probability and deductive logic.
  2. The possibility of non-numerical or merely comparative probabilities.
  3. The distinction between the probability of a proposition and the weight of the evidence for it.
  4. The status of subjective degrees of belief.

  Then, we identify which readings support the colleague's uses: rejecting frequency theory, objectivism over psychologism, and arguing against expected-utility maximization under uncertainty (and especially dismissing subjective Bayesianism and insisting on Keynesian uncertainty).

  Let's outline the possible theses:

  **Thesis 1: Probability as an Extension of Deductive Logic (Logical Probability)**

  This view, associated with Keynes and Carnap, holds that probability is a generalization of deductive logic. In deductive logic, if premises entail a conclusion, we assign probability 1; if they are inconsistent, probability 0. In between, we have degrees of partial entailment. Probability is thus a relation between a proposition and a body of evidence.

  - **Relation to deductive logic**: Probability is seen as a generalization. Deductive logic is the special case of complete entailment or refutation.
  - **Non-numerical probabilities**: Possible. Keynes argued that not all probabilities are numerically measurable; some are only comparable (e.g., we can say one probability is greater than another without assigning numbers) or even non-comparable.
  - **Probability vs. weight of evidence**: This view can accommodate the distinction. Probability is the degree of partial entailment given the current evidence. The weight of evidence (as in Keynes) refers to the amount or completeness of evidence. A probability might be high but based on little evidence (low weight) or vice versa.
  - **Status of subjective degrees of belief**: Subjective degrees of belief are only rational if they correspond to the logical probability given the evidence. Otherwise, they are irrational.

  **Verdict**: Substantive and defensible, though controversial. It is not a platitude because it requires a specific view of probability. It is not false, but it faces challenges (e.g., from subjectivists and frequentists).

  **Supports colleague's uses?** 
  - Rejects frequency theory: Yes, because probability is logical, not based on frequencies.
  - Objective rather than psychological: Yes, because it is a logical relation.
  - Argues against expected-utility maximization under uncertainty: Potentially, because if probabilities are not always numerical (and sometimes incomparable), then expected utility cannot be calculated. Also, in cases of very low weight of evidence (Keynesian uncertainty), the logical probability might not be well-defined or might be non-numerical, so expected utility cannot be applied.

  **Thesis 2: Probability as the Logic of Partial Belief (Subjective Bayesianism)**

  This view, associated with Ramsey and de Finetti, holds that probability is a normative theory of rational degrees of belief. It is an extension of logic in the sense that it provides rules for consistency (coherence) in partial beliefs, analogous to the rules of deductive logic for full beliefs.

  - **Relation to deductive logic**: Analogous in being a normative system. Deductive logic tells us what we must believe fully (if we believe the premises); probability (as Bayesian coherence) tells us how our degrees of belief must relate to avoid Dutch books and to be consistent.
  - **Non-numerical probabilities**: Typically requires numerical probabilities (to avoid Dutch books). However, some subjectivists (like de Finetti) allow that probabilities can be elicited and are inherently numerical. Comparative judgments might be foundational but are usually taken to be representable numerically.
  - **Probability vs. weight of evidence**: This view does not inherently include the concept of weight. The probability is the degree of belief. However, one might model weight via second-order probabilities or by considering the precision of beliefs, but that is an extension.
  - **Status of subjective degrees of belief**: Central. They are the subject matter. Rationality is about coherence (and sometimes updating by conditionalization).

  **Verdict**: Substantive and defensible. It is a major school of thought. Not a platitude and not false, but challenged by those who want more objectivity.

  **Supports colleague's uses?** 
  - Rejects frequency theory: Subjective Bayesians can use frequencies as evidence (via conditionalization) but they are not the definition of probability. So, in a way, it rejects frequency theory as the definition, but not as input. However, the colleague is using the slogan to reject frequency theory entirely and also to reject subjective Bayesianism. So this reading would not support the colleague's use against subjective Bayesianism. In fact, it is the target of the colleague's dismissal.

  **Thesis 3: Probability as a Formal System Analogous to Logic (Minimalist View)**

  This view holds that probability theory, like deductive logic, is a formal system with axioms and rules. It does not commit to any particular interpretation (logical, subjective, frequentist). The slogan then becomes a metaphor about the abstract, formal nature of probability theory.

  - **Relation to deductive logic**: Both are formal, mathematical systems. Probability theory can be seen as an extension of propositional logic (by adding real numbers and rules for them).
  - **Non-numerical probabilities**: The formal system is numerical. However, one could develop a formal system for comparative probabilities (e.g., with axioms for a qualitative ordering). But the standard Kolmogorov axioms are numerical.
  - **Probability vs. weight of evidence**: The formal system does not address this distinction. It is an interpretation issue.
  - **Status of subjective degrees of belief**: The formal system is neutral. It can be applied to subjective degrees of belief, but also to frequencies or logical relations.

  **Verdict**: Nearly platitudinous among those who study formal systems. It is defensible as a minimal common ground. Not false.

  **Supports colleague's uses?** 
  - This reading does not support the colleague's specific uses because it is too neutral. It does not reject frequency theory, nor does it insist on objectivism. It does not rule out expected utility.

  **Thesis 4: Probability as Epistemic Logic (Broadly Interpreted)**

  This view considers probability as part of a broader system of reasoning about knowledge and belief. It might include modal logic for knowledge and probability for uncertain belief.

  - **Relation to deductive logic**: It is an extension of the logic of knowledge (epistemic logic) to graded beliefs.
  - **Non-numerical probabilities**: Possible in qualitative systems (e.g., using modal operators for "probably").
  - **Probability vs. weight of evidence**: The distinction might be modeled by having two dimensions: one for probability and one for the robustness of the evidence (e.g., in a multi-modal system).
  - **Status of subjective degrees of belief**: They are a key application, but the system might be designed to be normative and objective.

  **Verdict**: Substantive and defensible. It is a research program. Not a platitude.

  **Supports colleague's uses?** 
  - It might be used to support objectivism if the epistemic logic is designed to be objective. But it is not inherently anti-subjective. It does not clearly reject frequency theory. So, only partially.

  **Thesis 5: Radical Logical Objectivism (Keynes's Original View)**

  This is a strong version of Thesis 1. It holds that probabilities are objective logical relations that exist independently of human minds. They are discovered, not invented. Moreover, they are not always numerical and sometimes not comparable. This view emphasizes the weight of evidence and the idea that in situations of very incomplete evidence (Keynesian uncertainty), we cannot assign meaningful probabilities.

  - **Relation to deductive logic**: As in Thesis 1, a generalization.
  - **Non-numerical probabilities**: Essential. Some probabilities are only comparable or even incomparable.
  - **Probability vs. weight of evidence**: Central distinction. Probability is the balance of the evidence (like the position of a balance), while weight is the amount of evidence (like the total amount of stuff in the pans). High weight does not necessarily mean high probability.
  - **Status of subjective degrees of belief**: They are rational only if they match the objective logical probabilities. In cases of very low weight, it may be irrational to assign any precise probability (even a subjective one).

  **Verdict**: Substantive and controversial. Defensible? Some still defend it. But it has been heavily criticized (e.g., by Ramsey) for being too vague and for the problem of non-comparability.

  **Supports colleague's uses?** 
  - Yes, strongly. It rejects frequency theory (probability is logical, not based on frequencies). It insists on objectivity. It argues that in situations of uncertainty (low weight), we cannot model decisions by expected utility because there are no probabilities (or they are non-numerical or incomparable). It dismisses subjective Bayesianism because subjective degrees of belief, when they go beyond the logical probability (especially in low weight situations) are irrational.

  **Thesis 6: Probability as the Logic of Science (Inductive Logic)**

  This view, associated with Carnap, holds that probability provides the rules for inductive reasoning in science. It is a branch of logic because it is the study of the formal rules for non-deductive inference.

  - **Relation to deductive logic**: Inductive logic is the complement to deductive logic. Deductive logic is about entailment; inductive logic is about partial support.
  - **Non-numerical probabilities**: Carnap's systems are numerical, but one could imagine qualitative inductive logics.
  - **Probability vs. weight of evidence**: Carnap developed the concept of "instance confirmation" and "degree of confirmation" but also had measures of the amount of evidence (like the number of observations). So the distinction can be made.
  - **Status of subjective degrees of belief**: Carnap's approach is objective (logical). Subjective degrees of belief are not the foundation.

  **Verdict**: Substantive and defensible. Carnap's program is influential but also criticized (e.g., by Popper and later by Bayesians).

  **Supports colleague's uses?** 
  - It supports objectivism and rejection of frequency theory. However, Carnap's systems are numerical, so it might not support non-numerical probabilities. Also, it does not necessarily dismiss expected utility in the same radical way as Keynes. So, it partially supports the colleague, but not the radical uncertainty part.

  **Summary of Verdicts on Theses:**

  1. **Logical Probability (Keynes/Carnap style)**: Substantive and defensible. Supports colleague's uses, especially if non-numerical probabilities are allowed.
  2. **Subjective Bayesianism**: Substantive and defensible. Does NOT support colleague's uses (since colleague is dismissing subjective Bayesianism).
  3. **Formal System View**: Platitudinous/defensible. Does not support the specific uses.
  4. **Epistemic Logic**: Substantive and defensible. Partially supports, but not strongly.
  5. **Radical Logical Objectivism (Keynes)**: Substantive and controversial. Strongly supports colleague's uses.
  6. **Inductive Logic (Carnap)**: Substantive and defensible. Supports objectivism and anti-frequentism, but may not fully support the non-numerical and uncertainty aspects.

  **Which reading best supports the colleague?** 

  Thesis 5 (Radical Logical Objectivism) is the one that most strongly supports the colleague's uses. It is the view that:

  - Probability is objective and logical (rejecting psychologism).
  - Rejects frequency theory (as the definition of probability).
  - Allows non-numerical probabilities and emphasizes the weight of evidence.
  - Holds that in cases of low weight (Keynesian uncertainty), we cannot assign meaningful probabilities and thus expected utility maximization is inapplicable.

  Thesis 1 (Logical Probability) also supports, but without the radical emphasis on non-comparability and the strong separation of probability and weight, it might not fully support the rejection of expected utility in uncertainty.

  **Final Conceptual Map for Students:**

  We can present the theses in a table for clarity.

  | Thesis Label | Key Idea | Relation to Deductive Logic | Non-numerical Probabilities? | Probability vs. Weight | Status of Subjective Beliefs | Verdict | Supports Colleague? |
  |--------------|----------|------------------------------|------------------------------|------------------------|------------------------------|---------|---------------------|
  | Logical Probability (Thesis 1) | Probability as degree of partial entailment | Generalization | Possible (Keynes) | Can accommodate | Rational only if matching logical prob | Substantive, defensible | Yes, but not the most radical |
  | Subjective Bayesian (Thesis 2) | Probability as coherent degrees of belief | Analogous normative system | Typically numerical | Not inherent | Central and normative | Substantive, defensible | No (target of dismissal) |
  | Formal System (Thesis 3) | Probability as abstract formal system | Mathematical analog | Standardly numerical | Not addressed | Neutral | Platitudinous | No |
  | Epistemic Logic (Thesis 4) | Part of logic of knowledge/belief | Extension of epistemic logic | Possible | Can be modeled | Can be either objective or subjective | Substantive, defensible | Partially |
  | Radical Logical Objectivism (Thesis 5) | Keynes's strong view: objective, sometimes non-numerical | Generalization | Essential | Central distinction | Irrational if not matching, especially in low weight | Substantive, controversial | Yes, strongly |
  | Inductive Logic (Thesis 6) | Rules for inductive inference | Complement to deductive | Carnap's is numerical | Can be modeled | Objective | Substantive, defensible | Partially (not non-numerical) |

  **Conclusion for the Colleague's Usage:**

  The colleague's invocation of "probability is a branch of logic" to reject frequency theories, insist on objectivity, and argue against expected utility maximization under uncertainty (Keynesian uncertainty) is best supported by a radical reading of Keynes's logical theory (Thesis 5). This reading emphasizes non-numerical probabilities and the weight of evidence, which allows for situations where probabilities are not well-defined and thus expected utility cannot be applied. It also dismisses subjective Bayesianism because it requires that degrees of belief be grounded in the logical probabilities (which may not exist in uncertainty) and because it views subjective degrees of belief without such grounding as irrational.

  Other readings (like Thesis 1 or 6) might support some of the points but not all. The subjective Bayesian reading (Thesis 2) is actually opposed to the colleague's uses.

  Therefore, the colleague is likely relying on a radical Keynesian interpretation (Thesis 5).
answer: |-
  ### Conceptual Map: "Probability is a Branch of Logic"

  The slogan "probability is a branch of logic" is ambiguous and can be interpreted in multiple ways, ranging from uncontroversial to radical. Below, I lay out five distinct precise theses that capture possible meanings, ordered from nearly trivial to genuinely radical. For each, I provide:
  - **Verdict**: Whether it is a platitude (widely accepted and trivial), substantive and defensible (a coherent position with arguments for/against), or false (incoherent or widely refuted).
  - **Commitments**: Implications for:
    - **Relation to deductive logic**: How probability connects to formal deductive systems.
    - **Non-numerical or comparative probabilities**: Whether probabilities can be non-numeric (e.g., qualitative or comparative rankings).
    - **Probability vs. weight of evidence**: How the thesis handles Keynes's distinction between the probability (degree of support) and the weight (completeness or robustness of evidence).
    - **Status of subjective degrees of belief**: The role of personal beliefs in probability assignments.

  I then identify which readings support your colleague's uses: rejecting frequency theories, insisting on objectivity over psychology, dismissing subjective Bayesianism, and arguing that Keynesian uncertainty (radical uncertainty) cannot be reduced to expected-utility maximization.

  ---

  #### **Thesis 1: Probability as Formal Abstraction (Minimalist View)**
  **Core claim**: Probability theory is a formal system of axioms and rules (like deductive logic) that can be applied to any consistent interpretation (e.g., frequencies, beliefs, or logical relations). It is "logic" only in the structural sense of a mathematical framework for reasoning under uncertainty.  
  - **Verdict**: Platitude.  
  - **Commitments**:  
    - *Relation to deductive logic*: Analogous to how Boolean algebra underlies deductive logic; probability is a generalization that includes deductive limits (e.g., 0 and 1 for impossibility/necessity).  
    - *Non-numerical probabilities*: Possible but rare; the formalism is numerical (e.g., Kolmogorov axioms), but qualitative systems (e.g., comparative orderings) can be mapped to it.  
    - *Probability vs. weight*: Ignores the distinction; weight is extrinsic to the formalism.  
    - *Subjective degrees of belief*: Neutral; subjective beliefs are one valid application (e.g., via Bayesian coherence), but not the only one.  
  - **Supports colleague’s uses?** No. Too neutral; doesn’t reject frequency theories, subjectivism, or expected utility.  

  ---

  #### **Thesis 2: Probability as Normative Logic of Consistency (Subjective Bayesianism)**
  **Core claim**: Probability is a branch of logic because it provides *rules of coherence* for rational degrees of belief (e.g., avoiding Dutch books), analogous to how deductive logic prescribes rules for valid inference. Probabilities are degrees of belief that respect constraints of rationality.  
  - **Verdict**: Substantive and defensible (e.g., defended by Ramsey, de Finetti).  
  - **Commitments**:  
    - *Relation to deductive logic*: Extends deductive norms (consistency) to partial beliefs; deductive logic is the limiting case of certainty.  
    - *Non-numerical probabilities*: Implicitly numerical; coherence requires precise degrees of belief for betting, though comparative orderings can be foundational.  
    - *Probability vs. weight*: No inherent distinction; all uncertainty is quantified as probability. Weight is either ignored or modeled as higher-order uncertainty (e.g., credence in probabilities).  
    - *Subjective degrees of belief*: Central and rational if coherent. Beliefs are subjective but constrained by norms.  
  - **Supports colleague’s uses?** No. *Contradicts* the colleague: it embraces subjective degrees of belief and expected utility (as in Savage’s axioms). Rejects Keynesian uncertainty by reducing all uncertainty to probabilistic belief.  

  ---

  #### **Thesis 3: Probability as Logical Relation (Moderate Logical Objectivism)**
  **Core claim**: Probability is an objective logical relation between propositions (e.g., a hypothesis and evidence), akin to partial entailment in deductive logic. It generalizes deductive entailment to cases with incomplete evidence (e.g., Keynes’s view in *A Treatise on Probability*).  
  - **Verdict**: Substantive and defensible (e.g., defended by Keynes, Carnap).  
  - **Commitments**:  
    - *Relation to deductive logic*: Direct generalization. Deductive logic handles full entailment; probability handles partial entailment (e.g., evidence supports a conclusion to degree *p*).  
    - *Non-numerical probabilities*: Essential; probabilities may be non-numeric (e.g., comparative rankings like "A is more probable than B given E") or incomparable when evidence is weak.  
    - *Probability vs. weight*: Explicitly distinguishes them. Probability measures the *balance* of evidence (degree of support); weight measures the *completeness* of evidence (e.g., more data increases weight even if probability is unchanged).  
    - *Subjective degrees of belief*: Secondary; beliefs are rational only if they align with objective logical probabilities. Subjective feelings are irrational if they deviate.  
  - **Supports colleague’s uses?** Partially. Supports objectivity (vs. psychology) and rejection of frequency theories (probability is evidential, not based on long-run frequencies). Allows non-numerical probabilities, which *could* challenge expected utility in cases of incomparability. But it doesn’t *require* rejecting expected utility; it permits it when probabilities are well-defined.  

  ---

  #### **Thesis 4: Probability as Epistemic Logic (Broad Logical Objectivism)**
  **Core claim**: Probability is a branch of logic because it formalizes rational *epistemic* constraints on knowledge and evidence, extending deductive logic to handle uncertainty. It is objective in that rational agents with the same evidence must agree on probabilities (e.g., Carnap’s inductive logic).  
  - **Verdict**: Substantive and defensible.  
  - **Commitments**:  
    - *Relation to deductive logic*: Subsumes deductive logic as a special case; both are systems for evidence-based reasoning.  
    - *Non-numerical probabilities*: Unusual; typically requires numerical probabilities for inductive inference (e.g., confirmation functions).  
    - *Probability vs. weight*: Can accommodate weight (e.g., as the scope of evidence) but often conflates it with probability.  
    - *Subjective degrees of belief*: Rejected as arbitrary; probabilities are objective features of evidence, not beliefs. Rational beliefs must track these.  
  - **Supports colleague’s uses?** Partially. Strongly supports objectivity and rejection of frequency theories. Dismisses subjective degrees of belief as non-logical. But it usually assumes numerical probabilities, so it doesn’t inherently challenge expected utility or support Keynesian uncertainty.  

  ---

  #### **Thesis 5: Probability as Radical Logical Skepticism (Keynesian Uncertainty)**
  **Core claim**: Probability is a branch of logic because it deals with objective evidential relations, but deductive logic’s limits reveal that *many uncertainties cannot be quantified*. In cases of sparse or ambiguous evidence (low "weight"), probabilities may be non-numerical, incomparable, or undefined—making expected utility impossible. This is Keynes’s "radical uncertainty."  
  - **Verdict**: Substantive and defensible but radical (Keynes’s view, extended by Shackle and others).  
  - **Commitments**:  
    - *Relation to deductive logic*: Highlights deductive logic’s inadequacy; probability extends it, but logic’s precision is unattainable when evidence is weak.  
    - *Non-numerical probabilities*: Necessary and pervasive; many probabilities are qualitative or indeterminate (e.g., "A is probable, but no degree can be assigned").  
    - *Probability vs. weight*: Central distinction. Low weight (e.g., novel events like pandemics or innovations) means probabilities are vague or nonexistent, even if the balance of evidence suggests a direction.  
    - *Subjective degrees of belief*: Largely irrational in low-weight scenarios; assigning precise subjective probabilities is "pretense of knowledge." Beliefs must respect logical limits of evidence.  
  - **Supports colleague’s uses?** Yes, fully.  
    - Rejects frequency theories: Probabilities are logical/evidential, not empirical frequencies.  
    - Insists on objectivity: Probabilities are evidence-based, not psychological.  
    - Dismisses subjective Bayesianism: Coherent degrees of belief are irrelevant when evidence is too weak for quantification.  
    - Argues against expected utility: In low-weight (Keynesian) uncertainty, probabilities are non-numerical, so expected utility cannot be calculated. Uncertainty is not "low probability" but "unquantifiable."  

  ---

  ### Which Readings Support the Colleague’s Uses?
  - **Rejecting frequency theories**: Supported by Theses 3, 4, and 5 (all treat probability as logical/evidential, not frequentist).  
  - **Insisting on objectivity over psychology**: Supported by Theses 3, 4, and 5 (all deny that probabilities are psychological states).  
  - **Dismissing subjective Bayesianism**: Supported by Theses 4 and 5 (both reject subjective beliefs as primary; Thesis 5 does so most strongly).  
  - **Arguing that Keynesian uncertainty ≠ low probability**: Only **Thesis 5** fully supports this. It alone claims that uncertainty often involves non-numerical probabilities or indeterminacy due to low weight, making expected utility inapplicable. Theses 3 and 4 allow numerical probabilities in most cases, so they don’t inherently challenge expected utility.  

  **Conclusion**: Your colleague’s most consistent and radical position aligns with **Thesis 5 (Radical Logical Skepticism)**. This reading alone supports all their uses: it grounds probability in logic while emphasizing the limits of quantification, thereby dismissing subjective Bayesianism and frequency theories, and treating Keynesian uncertainty as a distinct, unquantifiable phenomenon. Theses 3 and 4 support some aspects (objectivity, anti-frequentism) but not the full rejection of expected utility or the emphasis on non-numerical probabilities. Thesis 2 contradicts the colleague, and Thesis 1 is too weak to be relevant.
