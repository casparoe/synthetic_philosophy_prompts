prompt: |-
  I have just been appointed to my city's charter review commission, and our charge keeps forcing a question I had assumed was settled: who is the people whose consent a decision requires? Concretely, we must decide whether noncitizen residents may vote in local elections, whether residents of a newly annexed area may vote on a bond issue the whole city will pay for, and whether the present electorate may bind future boundary decisions — including a proposal to submit the franchise question itself to a vote of the currently enfranchised, so that the existing demos decides who joins it. We have been using four labels for what a boundary can be: personal (who is a member), jurisdictional (which body is competent), issue-specific (who is affected by this particular decision), and temporal (whether the dead or the unborn belong to the demos we are invoking). Our research staff is one person and we have eighteen months.

  Which open questions about the boundary problem should we actually prioritize, and in what order? I want the reasoning more than the list: for each, why it is upstream of the others for a body in our position, how tractable it is for a commission rather than a philosophy department, and what argument or development over the next year would move it up or down our agenda. And which questions are prominent in the theoretical discussion but would not change any decision we face?
reasoning: |-
  Okay, the user is on a city charter review commission and is grappling with the "boundary problem" in democratic theory—essentially, deciding who gets a say in which decisions. They've outlined four types of boundaries: personal, jurisdictional, issue-specific, and temporal. Their immediate practical dilemmas include noncitizen voting, annexed residents voting on bonds, and whether the current electorate can bind future boundary decisions. They need to prioritize which questions to tackle first, given limited resources and time. 

  Hmm, the user is clearly both philosophical and pragmatic—they're thinking deeply about theory but constrained by real-world deadlines and a one-person research staff. They’re asking for prioritization based on "upstream" impact, tractability, and relevance to their specific decisions. They also want to avoid wasting time on theoretical tangents that won’t affect outcomes. 

  First, I should map their four boundary types to the concrete problems:  
  - **Personal**: Noncitizen voting → who counts as "the people" locally.  
  - **Jurisdictional**: Annexed areas voting on bonds → which body governs them.  
  - **Issue-specific**: The bond issue itself → should annexed residents vote?  
  - **Temporal**: Binding future decisions → can today’s voters decide who votes tomorrow?  

  The temporal question feels most urgent because it’s recursive—whatever they decide now could lock in or alter how future boundaries (including personal/jurisdictional) are set. If they let current voters decide who votes later, that could override all other decisions. It’s also the most legally actionable for their commission (charter amendments often address transition rules). Plus, there’s a clear trigger: if they’re drafting language about franchise changes, this must be settled early.  

  Next, the personal boundary (noncitizen voting) is high-priority because it’s politically live, affects many residents, and implicates legal risks. Courts have upheld local noncitizen voting in some states, but it’s contested—so they need to know their state’s stance. If research shows legal vulnerability, it could bump this down; if advocacy groups push hard, it might move up.  

  Jurisdictional boundaries (annexed areas) are downstream of temporal/personal decisions. If they decide annexed residents *are* part of "the people," then jurisdictional questions resolve themselves. But if they *don’t* resolve personal boundaries first, jurisdictional debates could get messy. Still, because annexation bonds are a specific near-term issue, they can’t ignore it entirely.  

  Issue-specific boundaries feel less urgent. In practice, most cities default to "all voters decide everything," and deviating (e.g., only affected residents vote) creates administrative nightmares. Unless they’re considering radical options like neighborhood-specific ballots (unlikely), this is theoretically rich but practically low-impact.  

  As for theoretical distractions: "All-affected interests" sounds noble but is unworkable—e.g., should tourists vote on parking laws? And "representing the unborn" via trusteeship is better handled as policy (e.g., sustainability mandates) than voting rules.  

  So the order should be:  
  1. **Temporal** (due to recursive risk and charter drafting urgency).  
  2. **Personal** (due to political/legal stakes).  
  3. **Jurisdictional** (contingent on personal, but necessary for annexation bonds).  
  4. **Issue-specific** (mostly theoretical for their needs).  

  ... and politely ignore the philosophy-dept bait.
answer: |-
  Based on your commission's practical mandate, timeline, and concrete decisions, here’s a prioritization of the boundary questions—focused on **actionability**, **upstream impact**, and **avoiding theoretical dead ends**. The goal is to resolve issues that *constrain or enable* your other decisions first.

  ### Prioritization Order & Reasoning
  1. **TEMPORAL BOUNDARY (Can the current demos bind future boundary decisions?)**
     - **Why upstream?** This is foundational to your entire process. If your commission allows today’s voters to permanently decide who votes tomorrow (e.g., on noncitizen voting or future annexations), it could override all other boundary considerations. It’s recursive: *Who decides who decides?*  
     - **Tractability:** Highly tractable. Legal precedent exists (e.g., "entrenchment" clauses in constitutions). Focus on:  
       - *Charter language*: Can amendments be repealed by future commissions?  
       - *State law*: Many states prohibit binding future electorates on structural changes.  
       - **Action:** Draft clear "sunset" or "revisability" clauses for boundary decisions.  
     - **What moves it?** If your state attorney general issues an opinion on temporal entrenchment, or if annexation proposals accelerate. *Prioritize this first—it affects everything else.*

  2. **PERSONAL BOUNDARY (Who is a member? e.g., noncitizen voting)**  
     - **Why next?** Determines the electorate for *all* local decisions. If noncitizens can vote, it reshapes who decides jurisdictional/issue-specific boundaries.  
     - **Tractability:** Moderate. Requires:  
       - Researching state preemption (12 states ban noncitizen local voting).  
       - Cost/benefit analysis (registration systems, legal challenges).  
       - **Not philosophy:** Avoid "What is citizenship?" debates. Focus on legal risks and administrative feasibility.  
     - **What moves it?** Pressure from immigrant advocacy groups or a lawsuit elsewhere. If state law clearly prohibits it, deprioritize. If not, resolve early to define your electorate.

  3. **JURISDICTIONAL BOUNDARY (Which body governs annexed areas? e.g., bond votes)**  
     - **Why here?** Depends on #1–2. If annexed residents *are* part of the demos (personal boundary), they vote; if not, only pre-annexation voters decide. Temporal boundaries affect whether annexation itself requires their consent.  
     - **Tractability:** High. Precedent-rich:  
       - Most states require annexed residents to pay taxes → strong case for voting rights on bonds.  
       - **Action:** Default to "taxation with representation" unless state law conflicts.  
     - **What moves it?** Annexation proposals. If none emerge, lower priority.

  4. **ISSUE-SPECIFIC BOUNDARY (Who is affected? e.g., only bond-affected residents vote)**  
     - **Why last?** Legally risky and administratively complex. Courts often reject "specially affected" voter tests (violating equal protection).  
     - **Tractability:** Low. Creating sub-electorates per issue invites litigation. **Exception:** If bonds fund hyper-local projects (e.g., a neighborhood park), consider advisory neighborhood votes—but not binding.  
     - **What moves it?** Only prioritize if a bond proposal *exclusively* impacts one area *and* state law permits narrow electorates (rare).

  ### Questions to Sideline (Theoretical but Not Actionable)
  - **"All-Affected Interests" Principle:**  
    The theory that *everyone affected* by a decision should vote (e.g., neighboring cities, future generations). **Why skip?** Administratively impossible. Courts reject "non-resident voting" as unworkable. Focus instead on *hearing* affected non-voters (e.g., advisory input from annexed areas).  
  - **"Constituency for the Unborn":**  
    Granting trusteeship roles for future generations. **Why skip?** No legal mechanism exists. Address via policy (e.g., environmental review mandates), not franchise boundaries.  
  - **"Global Demos" Arguments:**  
    Whether noncitizens *deserve* voting rights on moral grounds. **Why skip?** Your commission’s role is legal/pragmatic—defer to state law and feasibility.

  ### Strategic Recommendations
  1. **Month 1–3:** Resolve the **temporal boundary** (e.g., "Charter amendments can be revised by any future commission"). This unlocks flexibility.  
  2. **Month 4–6:** Settle **personal boundaries** using state preemption research. If noncitizen voting is viable, draft options; if barred, note it and move on.  
  3. **Month 7–9:** Embed **jurisdictional clarity** (e.g., "Annexed residents gain full voting rights upon annexation").  
  4. **Use Issue-Specific Boundaries Sparingly:** Only if a concrete proposal (e.g., a neighborhood-specific bond) forces the issue.  

  **Key Trigger for Reprioritization:** If state legislators propose bills banning noncitizen voting or annexation voter rights, move #2 or #3 ahead of #1. Your commission’s leverage lies in acting before external forces constrain you. Focus on boundaries that define *who decides*, not idealized theories of legitimacy.
