  For cruxes (part 3), I'll pick three make-or-break questions: sentience evidence gaps, net suffering calculations, and uncertainty responses. The shared observations are crucial—they force characters to specify what evidence would change their minds. Like both agreeing that if we found insects lack key pain pathways, it'd shift moral calculus. Or predicting opposite outcomes from predator-prey models. This creates built-in plot hooks: the novelist can use these predictions to resolve the dispute later via new data.

