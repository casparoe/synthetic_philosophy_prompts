prompt: |-
  I'm building the final exam for an upper-level metaphysics seminar on material objects and I need one essay question on the special composition question -- the van Inwagen thing, when do some things add up to a further thing. My problem is that every student in the room can recite the standard menu (universalism, nihilism, organicism, restrictivism, whatever) and then just sit there. So I want a question where they can't do that. I'm going to hand them a view they've never seen and make them actually test it.

  Here's the view I'm putting on the exam. Call it the perturbation principle: some things compose a further thing just in case there is some salient way of perturbing them under which they respond as a single unit -- i.e. a counterfactual in which their joint response isn't just the sum of the responses each would have had on its own. (I made this up on the drive in, so please don't worry about whether it's in the literature or hunt for who said it. I want it treated as a live proposal, not as a target to be identified.)

  What I need from you:

  First, act like an expert in contemporary metaphysics and mereology -- someone who knows the composition debate cold and also knows where clever-sounding principles quietly fall apart. Think carefully and, before you write anything, spend a few lines brainstorming the failure modes: what kinds of cases tend to break principles like this, what the usual cheap escape routes are, and which of them a good student should be able to spot and a weak one shouldn't.

  Then give me:

  1. The exam question itself, worded so it can't be answered by naming the standard positions or by a summary of the debate. It should make them commit to an extension for the perturbation principle and defend it.

  2. A model answer, around 700 words, at the level of the best student in the class.

  3. A marking scheme: five or six must-hit points, marks adding to 20, and for each point one line on how students typically blow it.

  Things I want the question to force them through, so build these into the question and the model answer: the heap of sand and the case of a chair; the statue and the lump of clay (and whether a perturbation principle can even distinguish them without cheating); a living organism and its cells, since that's the case organicism is built for; whether the principle is circular -- does "as a single unit" or "joint response" smuggle in the very notion of an object it's supposed to analyse; what happens when "salient" gets read narrowly versus broadly, and whether the principle then collapses into nihilism at one end or universalism at the other; and whether this is an answer to the special composition question at all or a rival question in disguise. I'd also like the model answer to resist the lazy "it's just vague" verdict -- if vagueness is the objection, say which precisification would rescue the principle and what that precisification costs elsewhere.

  No references, no reading list, no "see so-and-so" -- just the question, the answer, and the scheme. Keep the tone like a colleague handing me the draft, and flag anything you think is a trap in the question itself.
reasoning: |-
  Okay, let me approach this step by step. The professor wants an exam question that forces students to engage deeply with the perturbation principle instead of reciting standard mereological positions. I need to brainstorm potential failure modes first.

  Considering common pitfalls for composition principles:
  - Vagueness: "salient perturbation" and "single unit response" could be too ambiguous
  - Circularity: does "joint response" presuppose composition?
  - Scope problems: when does perturbation count as "salient" enough?
  - Boundary cases: sand heaps, chairs, organisms, statues/lumps
  - Collapse risks: narrow readings lead to nihilism, broad to universalism
  - Distinctness problem: can it differentiate coincident objects like statues/clay?

  For the exam question itself, I'm crafting it to demand concrete application:
  - Must generate and defend an extension (what composes what under this view)
  - Cover specified cases: sand heap, chair, organism, statue/clay
  - Avoid position-naming shortcuts

  The model answer needs to:
  - Treat the principle as viable while stress-testing it
  - Address circularity through counterfactual dependence
  - Show how "salient" acts as a dial between extremes
  - Reject lazy vagueness claims by proposing precisifications
  - Demonstrate where the principle succeeds/fails uniquely

  For the marking scheme, I'm identifying 5 key points:
  1. Extension commitment (4 marks)
  2. Boundary case handling (4 marks)
  3. Circularity response (4 marks)
  4. Collapse analysis (4 marks)
  5. Meta-question awareness (4 marks)

  Each point will specify common student errors like:
  - Avoiding concrete examples
  - Missing the statue/clay distinction problem
  - Not seeing "single unit" circularity
  - Overlooking how broad/narrow readings affect universality
  - Not questioning if this answers SCQ at all

  The trap to flag is the "salient perturbation" phrasing - it invites vagueness objections that students must move beyond by proposing operationalizations. The question forces them to show their work on how perturbations get specified.
answer: |-
  ### Exam Question  
  **Perturbation Principle**: Some things, \(x_1, x_2, \dots, x_n\), compose a further object if and only if there exists a salient perturbation under which they respond as a single unit—i.e., their joint counterfactual behavior is not merely the sum of their individual behaviors.  

  **Task**:  
  1. **Commit**: State which of the following pairs/complexes compose an object under this principle and which do not:  
     - A heap of sand  
     - A wooden chair  
     - A living cat and its cells  
     - A statue and the lump of clay constituting it (treat these as candidate composites).  
  2. **Defend**: For each case, justify your answer using the perturbation principle. Explicitly address:  
     - How "salient perturbation" and "response as a single unit" apply (or fail to).  
     - Whether the principle distinguishes the statue from the lump.  
     - Whether "joint response" smuggles in circularity.  
  3. **Evaluate**: If "salient" is interpreted too narrowly, does the principle collapse into nihilism? If too broadly, into universalism? Does this principle answer the Special Composition Question (SCQ) or replace it?  

  ---  
  ### Model Answer (700 words)  
  The perturbation principle offers a novel criterion for composition: unity in counterfactual response under salient interventions. I defend the following extensions:  
  - **Heap of sand**: *No composition*. A salient perturbation (e.g., removing one grain) alters the heap incrementally: the response (reduced volume) is the sum of individual grain behaviors. No non-summative unity appears.  
  - **Wooden chair**: *Composition*. Under salient perturbations (e.g., tilting at 30°), the chair legs, seat, and back respond as a unit—the chair tips without collapsing. This joint stability isn’t reducible to each part’s isolated behavior (a lone leg falls over).  
  - **Cat and its cells**: *Composition*. Salient perturbations (e.g., a toxin) trigger a unified immune response: cells coordinate to neutralize threats in ways no individual cell could achieve alone. The cat’s survival isn’t the sum of each cell’s reaction.  
  - **Statue vs. lump**: *Distinction preserved but precarious*. For the *statue*, a salient perturbation (e.g., scratching its nose) targets its aesthetic form: parts respond as a unit to preserve appearance (a scratch alters the whole’s meaning). For the *lump*, a salient perturbation (e.g., compressing it) targets material cohesion: parts respond uniformly to force. Crucially, "scratching the nose" isn’t salient for the lump (it lacks a nose), so the statue qualifies as a composite while the lump does not *under this description*. However, both share matter, so the principle avoids coincidence only if perturbations are description-relative—a vulnerability.  

  **Circularity?** The charge that "single unit" presupposes composition is defused by grounding "response" in causal-counterfactual dependence. For the chair, the tipping response is a pattern *emergent* from part interactions (e.g., joints transferring force), not a prior commitment to an object. The response is measurable without invoking wholes: e.g., quantifying energy dissipation in the chair-system vs. its disassembled parts.  

  **Collapse risks**:  
  - *Narrow "salient" (e.g., only biological threats)*: Excludes chairs (no immune response) and heaps (no coordinated defense), collapsing toward nihilism.  
  - *Broad "salient" (e.g., any physical force)*: Includes heaps (e.g., wind perturbs all grains jointly via gravity) and arbitrary aggregates (e.g., a random pile of leaves and rocks responds "as a unit" to a bulldozer), collapsing into universalism.  
  To rescue the principle, we must fix "salient" to *functionally relevant interventions*: perturbations that test *integrity* (e.g., structural stress for chairs, homeostasis for cats). This excludes heaps (no integrity to test) and most universes, but at the cost of vagueness: "integrity" is teleological.  

  **Is this the SCQ?** The perturbation principle doesn’t answer the SCQ ("when do things compose?"); it replaces it with a *functional* question: "when do things behave with operational unity?" This avoids the SCQ’s brute metaphysical commitments but inherits physics/biology’s contingencies. A chair composes only relative to perturbations like "sitting," not quantum fields. Yet this functionalism is its strength: it explains why composition *matters* for causal explanation.  

  **Vagueness objection**: The principle isn’t irredeemably vague; it can be precisified by specifying *perturbation types* (e.g., mechanical, biological) and *response thresholds* (e.g., ≥80% correlated part-behavior). For heaps, no perturbation type yields supra-summativity; for cats, most do. This rescues determinacy but sacrifices universality: composition becomes domain-specific.  

  ---  
  ### Marking Scheme (20 marks total)  
  | **Points** | **Marks** | **Common Errors** |  
  |------------|-----------|-------------------|  
  | **1. Extension Commitment**: Clear, specific verdicts for all four cases (heap, chair, cat, statue/lump) with perturbation examples. | 4 | Weak students avoid concrete perturbations (e.g., "it depends"). Strong ones specify (e.g., "tilt test" for chair). |  
  | **2. Boundary Cases**: Correctly handles cat (organism) as composite and heap as non-composite; addresses whether statue/lump are distinct composites. | 4 | Missing statue/lump distinction (e.g., treating them as identical) or misapplying "salient" (e.g., same perturbation for both). |  
  | **3. Circularity Defense**: Engages the circularity charge and rebuts it via counterfactuals/emergence. | 4 | Accepting circularity passively or conflating "response" with "object." Strong answers cite emergent behavior (e.g., chair stability ≠ part-stability). |  
  | **4. Collapse Analysis**: Diagnoses narrow/broad "salient" as nihilism/universalism risks; proposes a precisification (e.g., "integrity-perturbations"). | 4 | Ignoring collapse risks or proposing non-viable fixes (e.g., "salient means whatever we care about"). |  
  | **5. Meta-Question**: Identifies the principle as replacing SCQ with a functionalist criterion; notes relativization to perturbation types. | 4 | Treating it as a direct SCQ answer without noting the shift to causal explanation. |  

  **Trap in the question**: The statue/lump case tempts students to assume identical perturbations for both ("poking it"). Top answers will note that *salience* is description-sensitive (e.g., "nose-scratching" for the statue but not the lump).  

  **Final note**: This question forces engagement because the perturbation principle *looks* intuitive but fractures on classical mereology cases—especially when "salient" is unanchored. The model answer’s functionalist turn is its best defense.
