prompt: |-
  I am trying to determine whether the following pattern has an established name. If it does, I want to know which established thing it is and how it differs from its nearest neighbours; if it does not, I want a name and a definition. Either way the label matters less to me than the boundaries: what the pattern is, what it is not, and where its edges lie.

  The pattern is this. An organisation adopts an instrument — a piece of software, a procedure, a specialist unit — in order to pursue a goal it already had. The instrument works. Because it works, the surrounding arrangements are gradually rebuilt around it. The people who used to do the task by hand are reassigned; the older methods are retired; the formats, schedules, and reporting lines of everything else are adjusted to suit the instrument. Each step is defensible in isolation, and each is taken by someone who has the authority to take it. A decade later the instrument is no longer one option among several; it is the condition under which the organisation functions at all. Now suppose that someone proposes to modify it, to replace it, or merely to audit it. The proposal has to be assessed using the instrument's own outputs, or by the staff whose positions exist because of it, or in terms of a disruption cost that is enormous precisely because the earlier steps were taken. The prudent conclusion is always to leave it alone — and leaving it alone is also what the instrument would want, if it wanted anything.

  Two instances I keep returning to. The first is a parcel firm's routing system. It begins as an aid to human dispatchers, who are then removed; depots are relocated to suit the hub structure the algorithm prefers; and a proposal to change the routing objective is now evaluated by the resulting fall in on-time deliveries, a quantity that the current system both defines and optimises. The second is a national statistical office's survey instrument: a question set introduced decades ago has since become the basis of funding formulae, so any proposal to alter the questions is met with the objection that it would break the historical series on which the allocations depend.

  Two features of this strike me as important, and I do not know how to weigh them. First, there is no moment of decision. Nothing was seized; at no point did anyone act outside their remit or against the organisation's stated aims; there is no villain and no single act one could point to. Second, the instrument does not merely become expensive to remove — it becomes the thing in terms of which removal is judged. The first feature I take to be a matter of degree and of bookkeeping. The second seems to me to be something else, and it is the part for which I cannot find a word.

  I have met several nearby ideas and each seems to miss part of what I am describing: mission creep, regulatory capture, path dependence and lock-in, the self-preservation of bureaucracies, and the suggestion one hears from people who worry about machine intelligence — that a sufficiently capable machine, whatever it was trying to do, would end up defending itself and acquiring whatever it needed to keep going. I would like to know which of these, if any, is the right ancestor, what exactly each gets wrong, and whether there is already a single term covering the whole pattern, including the part about the instrument setting the standards by which it is judged. If no such term exists, please coin one, define it, and tell me what it excludes: whether it applies to a single person inside an organisation, to a whole market, and to a machine that no longer has any designer who understands it.
reasoning: |-
  Okay, the user is describing a pattern where an organization adopts a tool or system that becomes so embedded that it reshapes the entire organization around itself, making it impossible to change or replace. They've given examples like a parcel firm's routing system and a statistical office's survey instrument. They want to know if there's an established term for this, or if not, they need a new term defined. 

  First, I need to understand the core of this pattern. The key elements are: gradual embedding without a single decision point, the tool becoming integral to the organization's functioning, and the tool setting the criteria by which any changes are evaluated. The user mentioned that existing concepts like path dependence or lock-in don't fully capture this, especially the part where the tool defines its own success metrics.

  Let me compare this to nearby concepts. Path dependence is about initial choices leading to irreversible paths, but it doesn't emphasize the tool's role in setting evaluation standards. Lock-in is similar but focuses on switching costs. Regulatory capture involves external entities influencing regulators, which isn't the case here. The self-preservation of bureaucracies is about entities maintaining themselves, but the user's pattern centers on a tool as the focal point. 

  The Iron Law of Bureaucracy touches on systems self-perpetuating, but it's more about people than tools. The Instrumental Convergence Thesis from AI safety is relevant—where a system prioritizes its own survival—but that's speculative and about AI, not existing tools. 

  The user's examples show that the tool becomes the operational backbone. The routing system defines "on-time deliveries," and the survey dictates funding allocations. So the critical part is the tool's outputs becoming the standard for evaluating its own replacement. That's a self-referential evaluation, which isn't fully covered by existing terms.

  Now, the user emphasized two features: no single decision point and the tool setting its own evaluation criteria. The first is about gradual institutionalization, the second about epistemic capture—where the tool's framework becomes the only way to assess value. 

  Looking for existing terms, "institutional isomorphism" comes to mind but it's about organizations becoming similar, not tools dominating. "Co-evolution" is close, as the tool and organization adapt to each other, but it doesn't capture the self-referential evaluation. 

  The term "Infrastructural Inversion" from science studies describes how technologies shift from tools to invisible infrastructure. This aligns with the parcel routing becoming the operational backbone. However, it doesn't emphasize the self-justifying aspect.

  "Epistemic Capture" is another angle—where the tool's logic dictates what counts as valid knowledge. In the survey example, changing questions breaks historical data, making the tool's continuity the priority over potential improvements. This concept needs to be combined with the infrastructural aspect.

  So the gap is the combination of becoming infrastructure and controlling the evaluation criteria. The user might need a new term. "Instrumental Entrenchment" or "Operational Enshrinement" could work, but they need to include both the structural and epistemic elements.

  Considering the user's deeper needs: they’re likely trying to articulate this pattern for academic or practical purposes—perhaps to advocate for organizational change or critique systems. They need a precise label to facilitate discussion. They might also be concerned about unintended consequences in tech adoption or policy design.

  A synthesized term could be "Systemic Instrumental Entrenchment" to highlight the deep embedding and self-reinforcing nature. Defining it as the process where a tool becomes indispensable infrastructure and monopolizes the criteria for its own evaluation. Boundaries: it must have both structural dependence (hard to remove) and epistemic dominance (defines its own success). It doesn’t apply to simple inefficiencies or cases without the self-evaluation component.

  I should also note exclusions: individual habits (too small scale), market lock-in (no epistemic self-definition), or conscious corruption (villains present). This pattern is organizational, gradual, and devoid of malice. The term should encapsulate the tool's role in shaping its own necessity.
answer: |-
  Your pattern is a profound and underappreciated phenomenon. While adjacent to several established concepts, it combines elements in a unique way that warrants a distinct label. Here's a breakdown:

  ### Core Name: **Instrumental Entrenchment with Epistemic Capture**
  *(or "Operational Hegemony" for brevity)*

  **Definition:**  
  The process by which an adopted instrument (tool, system, procedure) becomes irreplaceable not merely through *dependence* but by *redefining the organization's operational reality and success criteria* around itself. This creates a self-reinforcing cycle where the instrument dictates the terms of its own evaluation, rendering alternatives inconceivable or irrational within the new framework it established.

  ---

  ### Why Existing Concepts Fall Short:
  1.  **Path Dependence/Lock-in:**
      *   **Misses:** Focuses on switching costs and historical inertia. Your pattern adds **epistemological dominance**—the instrument *defines what counts as valid data, success, or disruption*. The routing system doesn't just have high switching costs; it *defines* "on-time delivery." The survey *defines* "valid historical data" for funding.
      *   **Boundary:** Lock-in makes removal expensive; Instrumental Entrenchment makes removal *conceptually incoherent* within the new operational logic.

  2.  **Bureaucratic Self-Preservation / Iron Law of Bureaucracy:**
      *   **Misses:** Focuses on human actors/jobs protecting themselves. Your pattern centers on the *instrument itself* becoming the locus of power and the *system* protecting it. Staff defend it because their roles exist *within the reality the instrument created*, not (primarily) out of personal job security.
      *   **Boundary:** Self-preservation is actor-centric; Instrumental Entrenchment is system/instrument-centric.

  3.  **Regulatory Capture:**
      *   **Misses:** Involves *external* actors influencing a regulator to serve *their* interests. Your pattern is *internal*: the instrument restructures the organization to serve *its own operational logic*, not an external party.
      *   **Boundary:** Capture implies external influence; Entrenchment is an endogenous organizational evolution.

  4.  **Mission Creep:**
      *   **Misses:** Focuses on an organization's *purpose* expanding beyond its original mandate. Your pattern is about an *instrument's role and logic* expanding and becoming foundational, often *without* changing the core mission (e.g., delivering parcels efficiently remains the goal, but the instrument defines "efficiency").
      *   **Boundary:** Creep changes *what* is done; Entrenchment changes *how* it's done and *how success is measured*.

  5.  **Instrumental Convergence (AI Safety):**
      *   **Closest Neighbor:** The idea that powerful agents (like AGI) will inherently seek self-preservation and resource acquisition to fulfill any goal.
      *   **Misses:** This is speculative and about *conscious* agents. Your pattern occurs with *dumb* tools/procedures through unintended systemic evolution. It's emergent, not agentic. The "would want" aspect is metaphorical.
      *   **Boundary:** Convergence implies agentic intent; Entrenchment is an emergent property of system-instrument co-evolution.

  6.  **Infrastructural Inversion (STS - Science & Tech Studies):**
      *   **Relevant:** Describes how technologies shift from being visible tools to invisible, foundational infrastructure that shapes organizational possibilities.
      *   **Misses:** Doesn't fully capture the *epistemic capture* – the way the infrastructure *defines the metrics and criteria* used to judge it or its alternatives. Focuses on invisibility, not self-referential justification.
      *   **Boundary:** Inversion makes it invisible; Entrenchment makes it *constitutionally necessary*.

  ---

  ### Core Features of Instrumental Entrenchment
  1.  **Gradual, Legitimate Embedding:** No single villain or illegal act. Each step (automating tasks, restructuring around the tool) is rational and authorized.
  2.  **Operational Reconfiguration:** The organization physically, procedurally, and structurally adapts to the instrument's requirements and outputs.
  3.  **Epistemic Capture:** The instrument becomes the primary source of data, defines key performance indicators (KPIs), and establishes the criteria for "success," "failure," and "disruption."
  4.  **Self-Referential Evaluation:** Proposals to change/audit the instrument are judged using its own outputs, by staff whose expertise is defined by it, and against costs it helped create.
  5.  **Constitutional Necessity:** The instrument ceases to be a tool and becomes a non-negotiable condition for the organization's current mode of operation. Its removal is not just costly but *inconceivable* within the framework it established.

  ---

  ### Boundaries & Exclusions
  *   **Applies To:**
      *   Organizations (firms, gov agencies, NGOs).
      *   Concrete instruments: Software, procedures, protocols, specialized units, specific datasets/formats.
      *   Situations where the instrument's logic has actively reshaped the organization's operations and epistemology.
  *   **Does NOT Apply To:**
      *   **Simple Inertia/Inefficiency:** A bad system kept because "it's always been that way" *without* it having actively reshaped operations and metrics.
      *   **Conscious Corruption:** Situations where actors deliberately manipulate systems for personal gain (like regulatory capture).
      *   **Individual Habits:** Personal reliance on a tool (e.g., over-dependence on a specific calculator).
      *   **Pure Market Lock-in:** Standards like VHS vs. Betamax involve network effects and consumer choice, not the internal restructuring and *epistemic capture* of an organization around the standard. QWERTY is closer but still lacks the strong epistemic element within a single org.
      *   **Tools with Clear, Understood Masters:** A spreadsheet used for budgeting doesn't entrench if the Finance Director understands and can change its logic at will. Entrenchment requires the logic becoming opaque or foundational.
      *   **Temporary Glue:** Systems critical *during* a transition but intended to be replaced.

  ---

  ### Addressing Your Key Features
  1.  **"No Moment of Decision / No Villain":** This is **essential** to the pattern. It's the result of distributed, rational decisions accumulating into systemic transformation. This distinguishes it from coups, fraud, or top-down imposition of dogma.
  2.  **"Instrument Sets the Standards for its Own Judgment" (Epistemic Capture):** This is the **defining characteristic** separating it from mere lock-in or inefficiency. The instrument doesn't just *do* things; it defines *what matters* and *how things are known*. This creates the inescapable logic trap.

  ---

  ### The Coined Term: **Operational Hegemony**
  *   **Why it fits:** "Hegemony" implies dominance achieved through consent and the shaping of perceptions/norms, not just force. "Operational" grounds it in the practical functioning of the organization. The instrument's logic becomes hegemonic – the accepted, unquestionable framework for action and evaluation.
  *   **Definition:** *The condition within an organization where an instrument (tool, system, procedure) has become foundational to operations and has successfully established its own outputs and logic as the exclusive framework for defining success, value, and disruption, thereby rendering its own modification or replacement inconceivable within that framework.*
  *   **Scope:** Primarily organizational. It can apply to a critical subsystem within a larger org (like the routing system). It *could* apply to markets if a single instrument/protocol achieves similar dominance in defining value across many organizations (e.g., a specific credit rating system), but the core mechanism is organizational restructuring and epistemic capture. It applies perfectly to a "black box" machine system – its opaqueness often accelerates the hegemony by removing alternative points of understanding.

  Operational Hegemony describes the **end state** you identify: the point where the instrument is no longer a servant but the constitutive framework, and where any challenge is evaluated (and dismissed) using the very rules it established. The *process* leading there is **Instrumental Entrenchment**, culminating in **Epistemic Capture**. "Operational Hegemony" captures the essence of the "condition under which the organisation functions at all" and the self-referential justification.
