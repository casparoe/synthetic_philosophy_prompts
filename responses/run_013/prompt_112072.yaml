prompt: |-
  I teach a seminar on social choice and mechanism design for roughly twenty participants — upper-level undergraduates with a few graduate students — in a single ninety-minute session, and I want to run a governance simulation that makes them feel both the appeal and the fragility of settling policy by prediction market rather than by vote: the arrangement, often called futarchy, in which a community votes on the ends it wants and then lets conditional markets settle the factual question of which means will achieve them. The activity should make the group perform the values step and the beliefs step as two separate acts before anyone names the distinction, so that the separation registers as something they did rather than something they were told.

  Staging. Invent a small municipality facing one decision, and hand the group a slate of three candidate objectives to choose among — say, cutting serious road injuries, cutting average commute time, or cutting particulate emissions. A majority vote fixes which objective counts, and the losers must then use it. Do not reveal that this is the values half of the design. Then present two mutually exclusive proposals, described in enough mechanical detail that they plausibly bear on whichever objective was chosen.

  Materials. A visible price board or order book for two conditional assets; a ledger of play money; a one-page payout table; role cards; and a stack of private information cards, some carrying genuine signal about how each proposal would move the objective and some deliberately uninformative. No real money.

  The market. Each participant gets an endowment. The two assets are A and B: a share in A pays a fixed sum if proposal A is adopted and the objective then improves past a stated threshold, and a share in B pays the same on the parallel condition for B. Participants trade freely for twenty minutes. At the close, the market's implied conditional values decide which proposal is adopted — the higher-priced asset's proposal wins. Build in three features deliberately, and do not explain them in advance. First, the payout is conditional on adoption, so each price encodes both the chance the proposal is adopted and the chance it works, and the group will have to work out how to divide one out of the other. Second, because adoption is itself read off the prices, the market is self-referential: a bet that A works also shifts the probability that A is adopted. Third, brief one participant privately as a large holder whose own values favor A, and give that person enough capital to move the price if they choose. Midway through trading, slip one late information card into play and see whether the prices absorb it.

  Debrief. Map the phases onto the idea. The objective vote is the values half; the market is the beliefs half, and the point of the split is that people who disagree about ends need not disagree about means. Walk through the normalization problem — how to extract a belief about efficacy from a price that also prices adoption — and then the circularity, which is the part most treatments skate over: when the market is the decision rule, there is no clean fact of the matter for it to track, only a fixed point. Take up the whale. Ask whether the attempted manipulation was self-defeating: pushing A's price up to secure adoption also means buying an asset whose payoff, if A is bad, will not materialize, so the manipulation costs money — unless the manipulator values the policy intrinsically more than the loss, in which case it is not self-defeating at all. Close on the two load-bearing assumptions: that the market is liquid and manipulation-resistant, and that the chosen objective cannot be gamed by whoever is measured against it.

  What will go wrong. Expect a large fraction to misread the conditional payout as paying out merely on adoption; pre-print a payout table and work one example aloud. Expect thin trading, with everyone holding and prices frozen; seed an opening quote or designate a market maker. Expect the whale to be either too timid to matter or so obvious that the group stops trading honestly; brief the whale to act on their card's instructions and no more. Expect the objective vote to consume the time you budgeted for the market.

  What it cannot reproduce. The market has twenty traders, so it cannot exhibit the informational efficiency on which the whole proposal rests; it may well exhibit the opposite, and you must say so rather than let the group conclude that markets fail. The metric's later measurement is stipulated by you rather than discovered, so the truth the market is supposed to track is handed to it, which begs part of the question. And the activity cannot touch the political-economy problem of who sets the objective and the threshold in the first place — you will have to supply that.
reasoning: |-
  Hmm, the user is designing a governance simulation for a social choice seminar to demonstrate futarchy—using prediction markets for policy decisions. They want students to experience the separation of values (voting on objectives) and beliefs (trading on policy efficacy) organically. Let me unpack their requirements.

  First, the simulation needs a fictional municipality with three policy objectives (road safety, commute time, emissions) and a majority vote to set the "values" phase covertly. Then two concrete policy proposals must interact mechanically with the chosen objective. The market setup requires conditional assets tied to policy adoption AND outcome success, creating self-referential pricing—a key complexity.

  The user flagged three deliberate design challenges: 
  1. Prices conflating adoption probability and efficacy belief
  2. Circularity (trading affects adoption which affects payouts)
  3. A whale manipulator testing intrinsic vs. instrumental motives

  For materials, they need physical trading aids (price board, play money), asymmetric information (some signals genuine, some noise), and role cards. I should ensure the payout table clearly shows the double conditionality—maybe color-coding adoption vs. outcome thresholds.

  Potential pitfalls they mentioned: 
  - Students misreading payouts as adoption-only → Solution: Walk through examples pre-trade
  - Thin trading → Solution: Seed initial quotes or assign market makers
  - Whale being ineffective or obvious → Solution: Script their actions discretely
  - Time crunch → Solution: Strict 10-min vote, 45-min trading, hard stop

  Notably, the simulation can't replicate real-world scale (20 traders ≠ efficient markets) or endogenous metric-setting. I'll explicitly address these limitations in debrief by contrasting small-group dynamics with theoretical market efficiency.

  For the whale role, I'd add nuance: their card should specify "spend ≤$X,000 pushing A" so manipulation has tangible costs. The late information card should be a weak but genuine signal (e.g., "Transit union opposes B") to test price responsiveness.

  In debrief, I'll structure discussion around: 
  1. Emergent values/beliefs separation 
  2. Price normalization math (e.g., if P(A) = $60 and adoption prob = 60%, implied efficacy = ?) 
  3. Whale's dilemma: "Did losing $2,000 to pass A feel worthwhile?" 
  4. Critical assumptions: liquidity, manipulation resistance, metric robustness

  The user's deep goal seems to be fostering critical engagement—not selling futarchy but letting students dissect its tensions. I'll emphasize reflection questions that surface tradeoffs, like "When would circularity collapse vs. stabilize prices?" or "How might particulate emissions be gamed?"
answer: |-
  Here's a comprehensive simulation design meeting your goals, incorporating your staging, mechanics, and pedagogical insights:

  **Setting:** The Borough of Riverton (pop. 85,000) faces budget constraints. The council has delegated this specific infrastructure decision to a citizen panel (your students).

  ## Phase 1: Values - "What Matters Most?" (10 mins)
  *   **Intro:** "Riverton has one discretionary budget slot. Council wants *your* citizen panel to recommend which objective should drive this year's infrastructure priority. Choose ONE:"
  *   **Objective Slate (Vote):**
      1.  **Reduce Serious Road Injuries:** Target: ≥15% reduction in hospitalizations/fatalities within 2 years.
      2.  **Reduce Average Commute Time:** Target: ≥10% reduction in mean commute time within 18 months.
      3.  **Reduce Airborne Particulate Matter (PM2.5):** Target: ≥12% reduction in annual avg. PM2.5 levels within 2 years.
  *   **Mechanic:** Hand out ballots (simple paper slips). Majority vote wins. Announce result. *Do not contextualize this as "values."*

  ## Phase 2: Beliefs - "How Do We Achieve It?" (Setup - 5 mins)
  *   **The Proposals:** "Council engineers propose two mutually exclusive options for the budget slot. Your task is to determine which proposal is MOST LIKELY to achieve our chosen objective: **[Announce Winning Objective & Target]**."
      1.  **Proposal A: "Smart Corridor Upgrade":** Install adaptive traffic signals & AI-powered speed cameras on the congested River Road corridor (main artery).
      2.  **Proposal B: "Green Transit Boost":** Purchase 3 new electric buses, increase off-peak frequency on 2 key routes, and subsidize bike-share memberships.
  *   **The Market Mechanism:** "We'll use a Prediction Market to aggregate your collective judgment on efficacy. Here's how it works:"
      *   **Assets:** Two tradable contracts exist:
          *   **Asset A:** Pays **$100** ONLY IF Proposal A is adopted *AND* the **[Winning Objective Target, e.g., ≥15% reduction in serious road injuries]** is met within the timeframe.
          *   **Asset B:** Pays **$100** ONLY IF Proposal B is adopted *AND* the **[Same Winning Objective Target]** is met.
      *   **Decision Rule:** The proposal whose asset has the higher price per share at market close **WINS** and is recommended for adoption.
      *   **Payout Table (Visual Aid - Pre-printed & Explained):** Show a table with clear examples:
          | Adoption | Target Met? | Asset A Payout | Asset B Payout |
          | :------- | :---------- | :------------- | :------------- |
          | A        | Yes         | $100           | $0             |
          | A        | No          | $0             | $0             |
          | B        | Yes         | $0             | $100           |
          | B        | No          | $0             | $0             |
          | Neither  | -           | $0             | $0             |
      *   *Crucially, walk through 1-2 examples aloud (e.g., "If A is adopted but injuries only drop 10%, Asset A pays? [$0]").*
  *   **Materials Distributed:**
      *   **Play Money:** $10,000 per participant (in mixed denominations).
      *   **Role Cards (1 per participant):** Generic citizen (x16), Local Business Owner (x2 - cares about commute time/may fear traffic disruption), Environmental Advocate (x1 - cares about emissions), Parent (x1 - cares about road safety). *(Roles subtly nudge values but don't dictate beliefs)*.
      *   **Private Information Cards (1 initial + 1 late):** 10 cards with genuine signals (e.g., "Traffic model sim: Smart Corridor cuts avg. River Road commute 8% AM peak", "Health Dept: PM2.5 near schools 70% vehicle-related", "Bus drivers' union likely to strike if schedules change"), 8 with uninformative noise (e.g., "Mayor prefers green initiatives", "River Road pavement condition: Fair"), 1 "Late" Card (genuine signal, e.g., "New study: E-bus adoption linked to 5-7% PM2.5 drop in similar towns"). *Assign the "Late" card to be discreetly given to a participant ~10 mins into trading.*
      *   **"The Whale" Briefing (Private - 1 participant):** "You are a major property developer on River Road. You **strongly favor Proposal A (Smart Corridor)**. You believe it will revitalize the area and increase your property values significantly (worth >>$100 to you). You receive this genuine signal: 'Traffic model sim: Smart Corridor reduces River Road injury collisions by 18%.' Use your capital to push Asset A's price up." *Give them $15,000.*
  *   **Market Setup:** Designate a visible "Price Board" (whiteboard/large paper). Assign 1-2 volunteers as "Market Makers" (MMs) - their job is to *always* post a bid/ask spread (e.g., start A: $45-$55, B: $45-$55) using play money and update the board based on trades. Participants shout trades to MMs ("Sell 2 A @ $52!", "Buy 1 B @ $48!"). MMs record executed trades.

  ## Phase 3: Trading (20 mins - Strict Timer)
  *   **Start:** Announce market open. MMs post initial quotes. Participants trade freely using their info, roles, and capital.
  *   **Monitor:** Watch for price movement, liquidity, whale activity, absorption of signals (especially the late card).
  *   **Close:** Announce hard stop. MMs post final bid/ask midpoints as closing prices (e.g., A: $63, B: $57).

  ## Phase 4: Decision & Reveal (5 mins)
  *   Announce the winning proposal based on the higher closing price.
  *   Reveal the "truth" (stipulated outcome): *"Based on Riverton's actual conditions & independent analysis: [e.g., If Objective was Injuries & A won: "Proposal A achieved a 16% reduction." / If B won: "Proposal B achieved a 9% reduction (target not met)."] OR [e.g., If Objective was Commute & B won: "Proposal B achieved an 11% reduction."]".*
  *   Reveal the Whale and their signal.

  ## Phase 5: Debrief (20 mins - Key Questions)
  1.  **The Separation:** "Walk me through what we just did. How did we decide *what* to achieve? How did we decide *how* to achieve it? Did anyone who voted *against* the objective still engage in the market? Why? What's the theoretical benefit of this split?" *(Draw out Values vs. Beliefs)*.
  2.  **The Market Mechanics:**
      *   *Normalization:* "Asset A closed at $63. What does that $63 represent? Does it mean a 63% chance A works? Why not? How could you try to estimate the *pure belief* that A would work *if* adopted?" *(Highlight conflation of Adoption Prob + Efficacy Belief)*.
      *   *Circularity:* "How did the market price *itself* influence the outcome? If you thought A was bad but likely to win, how did that affect your trading? What problem does this self-reference create? Is there a single 'true' probability for the market to discover?" *(Introduce Fixed Point concept: Price implies Adoption Prob -> Adoption Prob influences payoff -> Payoff influences Price)*.
      *   *The Whale:* "Did the whale manipulate the outcome? Did they 'distort' the price? Was it self-defeating? Could they lose money even if they won? When *wouldn't* it be self-defeating?" *(Link to intrinsic value of policy vs. financial payoff)*.
      *   *Late Info:* "Did the late information card move prices? Why/why not?"
  3.  **Appeal & Fragility:**
      *   "What felt powerful about using the market? (Aggregating diverse info, forcing specificity, separating values/beliefs)"
      *   "What felt fragile or worrying? (Complexity, circularity, manipulation potential, thin market issues, metric gaming)"
  4.  **Critical Assumptions & Limitations:**
      *   "Our market had 20 traders. Real prediction markets need 1000s. What inefficiencies did we see? Does this prove markets fail, or just that ours was small? What about liquidity?"
      *   "Who set the objective (Reduce Injuries by 15%)? Who defines 'serious injury'? How might this be gamed? *(e.g., reclassify injuries, shift traffic patterns)*"
      *   "We *stipulated* the outcome. In reality, measuring the effect is hard, delayed, and contestable. How does this challenge futarchy?"

  ## What Will Go Wrong & Mitigations
  *   **Misreading Payouts:** Mitigated by visual payout table & live examples. Be ready to re-explain.
  *   **Thin Trading:** Mitigated by active Market Makers providing continuous liquidity & opening quotes. Gently encourage trading.
  *   **Whale Issues:** Mitigated by clear, limited private briefing ("Push A, use up to $X"). If too timid/obvious, use it in debrief: "What if the whale had been bolder/subtler?"
  *   **Time Crunch:** Mitigated by strict timing: 10 min Vote, 5 min Setup, 20 min Trading, 5 min Decision/Reveal, 20 min Debrief (60 min total). Protect trading time.
  *   **Confusion on Circularity:** Expect it. Use debrief to explicitly map the feedback loop. Ask: "If A's price rises, does that make A *more* or *less* likely to pay out? Why?"

  ## What It Cannot Reproduce (Be Explicit)
  *   "Remember, our tiny market can't show true informational efficiency. Large, real-money markets *might* be better, but ours highlights other challenges."
  *   "We handed the market the 'truth' (the outcome). In reality, measuring policy impact is messy and political – a huge challenge for futarchy."
  *   "We skipped the crucial political question: Who gets to set the objectives and thresholds? That power matters immensely."

  This design forces the separation of values and beliefs through action, highlights the core mechanics and paradoxes of futarchy through experiential learning, and provides rich ground for discussing its promises and perils. Good luck!
