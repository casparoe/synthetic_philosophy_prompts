answer: |-
  Here's an original example drawn from professional life, avoiding the standard tropes and stripping away the props:

  **The Scenario: Emergency Consent Dilemma**  
  You are the sole, estranged next-of-kin suddenly contacted via a hospital switchboard. A close relative you barely know is critically ill in A&E following an accident. Their condition is deteriorating rapidly. The consultant needs immediate consent for a high-risk, life-saving procedure with a low chance of success. Crucially:  
  *   It's a one-off, anonymous interaction (you've never met this doctor, they don't know you, you'll never interact again).  
  *   There's no time for deliberation, witnesses, or written contracts – consent must be verbal, *now*.  
  *   The doctor is ethically bound but visibly stressed and impatient; hesitation will be interpreted as refusal, and they will move to palliative care.  
  *   Statistically, refusing *might* be the marginally better act – the procedure is painful, success is unlikely, and palliative care is gentle. However, *giving consent* is the only chance for survival.  

  The consultant is experienced but human. They will only proceed with absolute, unambiguous, immediate consent. If they detect even a flicker of calculation, hesitation, or doubt in your voice – if it sounds like you're weighing the odds *in that moment* – they will interpret it as a 'no' and act accordingly. Your relative will definitely die.  

  **The Disposition:** You need the disposition of **unhesitating, instinctive trust in medical authority in crises**, overriding immediate consequentialist calculation.  

  **Why the Payoff Requires Non-Instrumental Disposition:**  
  The life-saving payoff (consent leading to the procedure) *only* materialises if your consent is immediate and instinctive. The consultant needs to hear **genuine, unforced trust**. If you *try* to adopt this disposition *because* you've reasoned it gives the best chance of survival, your reasoning process itself introduces hesitation and performativity. You'll sound calculated, not trusting. The very act of consciously deciding "I must *act* trusting now to get the procedure" betrays the lack of genuine trust. The disposition must be a deep-seated character trait, triggered automatically, not a conscious choice made for instrumental gain in that instant. The reasoning that shows you *need* the disposition prevents you from authentically *manifesting* it if you try to adopt it on the spot for that reason alone.  

  **Rationality of Act vs. Disposition:**  
  *   **Act Rationality (Ex Post):** *After* the event, if the procedure failed (likely), refusing consent would have been the better *act* – avoiding unnecessary suffering. If it succeeded (unlikely), consent was the better act. Judged purely by the foreseeable outcome *of that specific act*, consent is arguably irrational due to the low odds.  
  *   **Disposition Rationality (Ex Ante):** *Before* the event, possessing the disposition of instinctive trust is rational. Across many potential life scenarios (being a patient yourself, other emergencies), this disposition leads to better expected outcomes. It enables actions (like immediate consent) that wouldn't occur under pure consequentialist deliberation, often securing vital chances that would otherwise be lost through delay. In *this specific scenario*, it's the *only* way to unlock the possibility of survival, even though the *act* it produces has a low probability of success.  

  **What the Case Shows:**  
  This highlights a fundamental split in rationality assessments:  
  1.  **Act-Based Rationality:** Focuses on the expected outcome of a specific, deliberated choice given the immediate circumstances. It often favours caution and calculation.  
  2.  **Disposition-Based Rationality:** Focuses on the expected value of having a character trait *across the range of situations* one might encounter. It values traits that reliably produce beneficial patterns of behaviour, even if in specific instances they might lead to sub-optimal acts. Crucially, some dispositions (like instinctive trust) *only work* if they are non-instrumental aspects of character, not consciously chosen tools for a specific task. Their rationality lies in their existence enabling possibilities that otherwise vanish, making them rational *despite* sometimes producing individually irrational acts. The Emergency Consent Dilemma forces this split into sharp relief: the disposition is rationally desirable overall and essential to unlock the best *possible* outcome here, but the act it produces is, judged narrowly, high-risk. You cannot consciously *become* this person in the moment; you must already *be* them.

  \answer{Emergency Consent Dilemma}
