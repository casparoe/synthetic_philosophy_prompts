  ## GLOBAL ANTI-GRAFT POLICY: LOCAL OPERATIONS IMPLEMENTATION FAQ (REGION: DELTA SECTOR)

  **Version:** 3.7.2a  
  **Effective Date:** [CURRENT DATE]  
  **Applicability:** All personnel operating within Delta Sector, including locally contracted staff and expatriate assignees.

  **Preamble:** This document clarifies acceptable practices concerning gifts, hospitality, and relationship management pursuant to Global Policy 117-C ("Anti-Corruption & Ethical Engagement"). Compliance is mandatory. Local customs are acknowledged but do not supersede Policy 117-C or applicable extraterritorial legislation (e.g., FCPA, UKBA). "When in doubt, Declare or Refrain."

  **1. Q: May I provide a customary gift to a government official attending my cousin’s wedding?**  
  **A:** Gifts to Public Officials (POs), even in purely personal social contexts (e.g., familial celebrations), require pre-approval via Form G-117c/Delta(Social). Factors considered include: (1) Monetary Value (see Value Matrix, Annex A); (2) Recipient’s Influence over Permits/Licenses relevant to Company Operations; (3) Probability of future Official Interaction; (4) Cultural Norm Index (CNI) Score for the specific event/gift (consult Local Compliance Officer (LCO) for current CNI). A wedding gift exceeding the CNI-adjusted Tier 1 Value Threshold (see Annex A) necessitates written justification demonstrating zero nexus to current or potential future business advantage. **Note:** Familial relation is not an automatic exemption.

  **2. Q: A long-standing customs broker, known personally to my family for decades, facilitates routine clearance. His fee includes an annual "relationship maintenance" sum paid by my uncle’s firm. Can we continue this arrangement?**  
  **A:** No. Arrangements involving third-party intermediaries (TPIs) require Enhanced Due Diligence (EDD) under Policy 117-C, Section 8.3. "Relationship maintenance" fees are classified as Potential Undisclosed Facilitation Payments (PUFP) unless demonstrably tied to specific, documented, above-board advisory services invoiced transparently. Pre-existing familial or personal ties do not negate the requirement for EDD and explicit contractual terms prohibiting pass-through payments to officials. Discontinue the "maintenance" sum immediately. Engage Legal to structure a compliant TPI agreement using Standard Contract Module Delta-TPI-1.

  **3. Q: Is it permissible to offer modest "grease" payments to low-level officials to expedite routine services (e.g., document processing, utility connections) where delays are common?**  
  **A:** Global Policy 117-C strictly prohibits bribes. Certain extraterritorial laws (e.g., FCPA) contain narrow exceptions for "Facilitation Payments" (FPs) made *solely* to secure routine, non-discretionary governmental action to which the Company is already legally entitled (see Glossary). However:  
  *   FPs are illegal under local Delta Sector law and UKBA.  
  *   FPs create documented **Compliance Debt** (CD) (see Glossary) and potential **Accrued Liability Pathways** (ALP).  
  *   The "routine/non-discretionary" distinction is often ambiguous in practice.  
  *   Systematically budgeting for FPs is prohibited.  
  **Directive:** All requests for unofficial payments must be reported immediately via the Ethics Hotline (Code: FP-Delta). Seek LCO guidance for approved "Expedited Processing Fees" paid *directly* to the relevant government treasury, if available.

  **4. Q: How do I build necessary local relationships without violating gift/hospitality rules?**  
  **A:** Relationship Building (RB) is recognized as commercially essential. Approved RB mechanisms include:  
  *   Modest, infrequent hospitality (meals, refreshments) adhering strictly to Tier 1 Value Thresholds, documented via Form H-117c/Delta. Hospitality must be proportional to the recipient's gastric capacity and occur in venues lacking ostentation.  
  *   Company-branded promotional items of nominal value (≤ $10 USD equivalent).  
  *   Attendance at widely attended industry events.  
  *   Transparent, arms-length contractual agreements for legitimate services.  
  Remember: The intent must be fostering goodwill, **not** creating an **Obligation of Reciprocity** (OR) (see Glossary) tied to specific official action. Hospitality exceeding Tier 1 constitutes a Potential Obligation Inducement (POI) requiring pre-approval.

  **5. Q: A key official insists on a "consultancy" role for his nephew’s newly formed company as a condition for advancing our permit. Is this acceptable under the "Relationship Building" exception?**  
  **A:** Absolutely not. This constitutes clear extortion and a demand for a bribe. Demanding the hiring of specific, unqualified individuals or directing business to specific entities in exchange for official action is a violation of Policy 117-C and local law. **Immediate Actions:** (1) Cease negotiations; (2) Do not engage the nephew's company; (3) Report the incident immediately via the Ethics Hotline (Code: EXT-Delta); (4) Consult Legal for guidance on alternative paths for the permit. Compliance will initiate a **Threat Assessment Protocol** (TAP).

  **6. Q: Policy 117-C emphasizes avoiding "improper advantage." How is "improper" defined in contexts where relationship obligations are deeply embedded?**  
  **A:** Policy 117-C defines "improper advantage" objectively: Any advantage not legally available to all competitors under identical circumstances, obtained through the misuse of an official position. The existence of local relationship norms involving **Patron-Client Dynamics** (PCD) (see Glossary) does not alter this definition. Actions permissible under PCD may constitute bribery under Policy 117-C and applicable law. The test is the *nature of the advantage sought* and the *official’s misuse of position*, not the local cultural framing of the exchange. When PCD expectations conflict with Policy 117-C, Policy 117-C prevails.

  ---

  **ANNEX A: VALUE MATRIX & TRAFFIC LIGHT SYSTEM**

  | Scenario                                                                 | Value Threshold (USD Eq.) | CNI Adjustment Allowed? | Approval Required          | Status     |
  | :----------------------------------------------------------------------- | :------------------------ | :---------------------- | :------------------------- | :--------- |
  | **Gift to PO (Non-Familial Event)**                                      | Tier 1: ≤ $25             | Yes (± 15%)             | LCO Post-Event Declaration | AMBER      |
  | **Gift to PO (Familial Event e.g., Wedding)**                            | Tier 1: ≤ $25             | Yes (± 35%)             | LCO Pre-Event              | AMBER      |
  | **Hospitality (Per Person, Single Event)**                               | Tier 1: ≤ $75             | Yes (± 20%)             | LCO Post-Event Declaration | GREEN      |
  | **Hospitality (PO + Spouse)**                                            | Tier 1: ≤ $75             | No                      | Regional Compliance Pre-Event | AMBER      |
  | **"Facilitation Payment" Requested**                                     | $0                        | No                      | Prohibited / Report        | RED        |
  | **Branded Promotional Item**                                             | ≤ $10                     | No                      | None                       | GREEN      |
  | **Third-Party "Relationship Maintenance" Fee**                           | $0                        | No                      | Prohibited / Audit Trigger | RED        |
  | **Unsolicited Gift Received from PO/TPI (Value > $50)**                  | N/A                       | No                      | Declare to LCO; May Require Surrender | AMBER      |

  ---

  **GLOSSARY OF TERMS (DELTA SECTOR POLICY IMPLEMENTATION)**

  *   **Accrued Liability Pathways (ALP):** Hypothetical legal/financial exposure trajectories created by actions with potential future compliance implications (e.g., FP use creating patterns of evidence).
  *   **Compliance Debt (CD):** The accumulating risk burden created by historical practices or ambiguous situations not fully resolved under current policy. Requires proactive management.
  *   **Cultural Norm Index (CNI):** A regionally calibrated multiplier (range 0.8 - 1.5) applied to Value Thresholds to "account" for local gift-giving significance. Reviewed annually by HQ Legal.
  *   **Facilitation Payment (FP):** A payment to a foreign official to expedite or secure routine, non-discretionary governmental action. Narrowly permissible under FCPA but illegal under UKBA and Delta Sector law. Strictly prohibited by Policy 117-C due to inherent risks and **Compliance Debt** generation.
  *   **Obligation of Reciprocity (OR):** The state of indebtedness created in the recipient of a gift or hospitality, perceived or actual, which could influence future decision-making contrary to impartiality. Core risk factor in gift/hospitality evaluation.
  *   **Patron-Client Dynamics (PCD):** Locally embedded social structures involving asymmetric exchange of favors/goods/services between parties of differing status/power. Viewed as a **High-Risk Environment** for **OR** creation.
  *   **Potential Obligation Inducement (POI):** Any gift, hospitality, or benefit assessed as carrying a high risk of creating an **OR** with a PO.
  *   **Potential Undisclosed Facilitation Payment (PUFP):** Fees paid to TPIs lacking clear, documented justification, raising suspicion of being pass-through bribes.
  *   **Pre-Transferred Liability (PTL):** Liability assumed by the Company *prior* to an actual violation, often stemming from inadequate due diligence or ignoring risk indicators (e.g., using a TPI with known PCD ties).
  *   **Threat Assessment Protocol (TAP):** Standardized response procedure initiated upon encountering extortionate demands or clear bribe solicitations.
