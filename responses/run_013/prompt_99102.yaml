  Bailey: Then let's assume the operator's policy is: he always says "I can't tell you Blue or Red" (even though he can, but for some reason he withholds that) and then he gives a true conditional about the subregion. But what conditional does he give? In Red, he tells the truth about the subregion. In Blue, what conditional can he give? He doesn't have one? Or he might say anything?

