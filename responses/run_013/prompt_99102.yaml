  Alex: This is getting silly. Let's stick to the original idea: minimize KL divergence. The prior is (1/2, 1/4, 1/4) for (Blue, Red-HQ, Red-Second). The constraint is P(HQ|Red)=1, which means P(Red-Second)=0. So we set P(Red-Second)=0, and then redistribute the probability to Blue and Red-HQ proportionally to their prior. So P(Blue) becomes (1/2) / (1/2 + 1/4) = (1/2)/(3/4) = 2/3, and P(Red-HQ) becomes (1/4)/(3/4)=1/3.

