  Bailey: Here's a simple model: suppose the operator is only allowed to report about the subregion if we are in Red. And if we are in Blue, he just says we are in Blue. Then, if we hear S, it must be that we are in Red and then the second part tells us we are in HQ. So P(Blue)=0, P(Red-HQ)=1.

