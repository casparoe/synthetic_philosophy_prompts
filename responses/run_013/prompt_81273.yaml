answer: |-
  ### 1. The Claim in Plain Terms  
  Parfit’s hitchhiker shows a puzzle: You’re stranded and need a ride. The driver will only help if you promise to pay later. But once you’re safe, you have no reason to pay—keeping the promise costs you money. The driver knows this. So the *only* way to get the ride is to *actually be the kind of person who keeps promises even when it’s against your interests*. If you’re purely "rational" (self-interested in the moment), you’ll break the promise—and the driver won’t trust you. **Rational irrationality** means: Sometimes, to get what you want, you must *commit to acting "irrationally" later** (e.g., keeping a costly promise). What matters isn’t the promise itself, but **what kind of person you are** when you make it—and whether others can trust that character. This doesn’t mean "be irrational." It means: **Credible promises depend on being (or becoming) someone who won’t abandon commitments when it’s convenient.**

  ---

  ### 2. The Procedure  
  **Goal:** Decide whether to accept a commitment request *now* by asking: *Can we trust this will be kept later?* Focus on **character/policy**, not just the act.  
  **Time:** 15–20 minutes. Assign a timekeeper.  
  **Steps:**  

  1. **State the Commitment** (1 min)  
     *Question:* "What exactly is being promised, by whom, and when must it be fulfilled?"  
     *Sufficient answer:* Concrete terms (e.g., "Alex promises to repay £200 to the kitty by May 2025").  
     *Type:* **Fact**.  

  2. **Identify the Trust Question** (2 min)  
     *Question:* "When fulfillment is due, what might tempt the promisor to break this? Why would they keep it anyway?"  
     *Sufficient answer:* Name the future incentive to defect (e.g., "No penalty if they don’t pay") and the motive to keep it (e.g., "They care about the house’s future").  
     *Type:* **Fact** (predicting incentives).  

  3. **Credibility Check: The Core Test** (5 min)  
     *Question:* **"Is this promise credible? What makes us believe it will be kept *despite* the temptation?"**  
     *Options to discuss (choose the strongest):*  
     - **Character:** "They’ve kept similar promises before."  
     - **Reciprocity:** "We’ll need their help later, so they’ll cooperate."  
     - **Policy:** "We have a rule (e.g., public shaming) that makes breaking it costly."  
     - **Identity:** "Keeping it is part of who we are as a house."  
     *Sufficient answer:* Agreement on *one* credible anchor. If none, the promise fails.  
     *Type:* **Judgment** (based on facts/values).  

  4. **The "I Won’t Want To" Clause** (3 min)  
     *Question (to the promisor):* "Do you *already know* you’ll want to break this later? If yes, why?"  
     *Sufficient answer:* Honest self-disclosure (e.g., "I’m bad with money—I’ll resent paying").  
     *Action:* If "yes," **reject the request** unless Step 3’s anchor overrides it (e.g., "But our repayment policy forces me").  
     *Type:* **Value** (integrity check).  

  5. **Policy Review** (4 min)  
     *Question:* "Should we adjust house rules to make *future* promises like this more trustworthy?"  
     *Sufficient answer:* A yes/no decision on drafting a new rule (e.g., "All loans require a guarantor").  
     *Type:* **Value**.  

  6. **Final Decision** (1 min)  
     *Question:* "Do we accept this commitment? Why?"  
     *Sufficient answer:* Vote or consensus based on Step 3 and 4.  
     *Handoff Point:* **Stop here**. The group decides.  

  ---

  ### 3. Worked Cases  
  **Case 1: Departing Member’s Debt (£200 loan, repay after graduation)**  
  1. **Commitment:** "Jamie borrows £200 now; repays the kitty by June 2025."  
  2. **Trust Question:** Temptation: No leverage after graduation. Motive to keep: Loyalty?  
  3. **Credibility Check:**  
     - *Character:* "Jamie repaid a small loan last term." → **Credible anchor.**  
     - *Policy:* None exists.  
     - *Verdict:* Accept (barely)—based on character.  
  4. **"I Won’t Want To":** Jamie says nothing. Proceed.  
  5. **Policy Review:** "Create a rule: Loans >£100 require a post-dated thank-you video (to be played at graduation if unpaid)."  
  6. **Decision:** Approved.  

  **Case 2: Swapped Kitchen Shift (Sam takes Maya’s shift next week)**  
  1. **Commitment:** "Sam covers Maya’s Tuesday shift; Maya owes Sam a future shift."  
  2. **Trust Question:** Temptation: Sam might "forget." Motive: Reciprocity—Maya might cover for Sam later.  
  3. **Credibility Check:**  
     - *Reciprocity:* "Shifts are swapped often; Sam will need favors." → **Credible anchor.**  
  4. **"I Won’t Want To":** Sam admits, "I’ll be tired and regret it."  
     - *Action:* **Reject**—unless Sam adds: "But I’ll do it because I don’t want to lose shift-swap privileges."  
  5. **Policy Review:** "Shift swaps require a £5 deposit (refunded after completion)."  
  6. **Decision:** Rejected (based on Step 4).  

  **Case 3: House Pledge to Charity (£400 total, no individual obligation)**  
  1. **Commitment:** "All members contribute £33 by Friday for the food bank."  
  2. **Trust Question:** Temptation: Free-ride (others will cover it). Motive: Group pride?  
  3. **Credibility Check:**  
     - *Identity:* "We’re ‘the house that helps’—we’d be ashamed to fail." → **Credible anchor.**  
     - *Policy:* "We publish donor lists; no one wants to be missing."  
  4. **"I Won’t Want To":** No individual promisor → skip.  
  5. **Policy Review:** "All collective pledges require 100% upfront contributions."  
  6. **Decision:** Approved (based on identity anchor).  

  ---

  ### 4. The Case I Will Not Want to Hear  
  **The Scenario:** *You* request a £300 loan for a dental emergency. At Step 3, someone notes you missed repaying a £50 debt last year. At Step 4, you realize: *Yes, I’ll resent repaying this*. The procedure says: **Reject the loan** unless you offer collateral (e.g., your laptop).  

  **Why it hurts:** It exposes your past unreliability and forces public accountability. Your resistance is *illegitimate* if you’ve failed before—but *legitimate* if collateral feels punitive. The procedure forces you to confront your own credibility gap and either fix it or accept limits.  

  ---

  ### 5. What the Procedure Cannot Do  
  **Where it misfires:**  
  - If no one knows each other’s character (e.g., new members), Step 3 collapses into guesswork.  
  - It cannot *create* trust where none exists—only expose its absence.  
  - "Identity" anchors (Step 3) are fragile if the group’s culture is weak.  

  **Hidden judgments:**  
  - Step 3 is **entirely judgment-based**. What counts as "credible character"? One kept promise? Ten?  
  - Step 4 relies on **self-awareness**, which is often lacking.  

  **What it cannot settle:**  
  - True conflicts of values (e.g., "Should we *ever* lend money?"). This requires separate discussion.  
  - When external pressures overwhelm commitments (e.g., a promisor faces bankruptcy).  
  - Long-term systemic unfairness (e.g., if one member always needs loans).  

  **Final note:** This procedure makes rational irrationality *actionable* by forcing explicit discussion of trust anchors. But it cannot replace a culture of integrity—only reflect it.
