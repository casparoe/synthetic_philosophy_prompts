prompt: |-
  I am a novelist at work on a book set in a society whose moral code is not my own — a real historical society, not an invented one, and I want its moral texture rather than my own convictions dressed in period costume. This means I make the same decision dozens of times in a draft: a character does something my readers will find monstrous, or admirable, or simply unintelligible, and I have to decide whether the book presents it as wrong full stop, as right by the lights of the world that made her, or as something the two moralities cannot even put into a shared question. The decision is not academic for me. It settles what kind of book I am writing — indictment, portrait, or elegy — and reviewers will read a thesis out of it whether or not I intended one. I am not a philosopher, I cannot consult one scene by scene, and I need to make the call in the time it takes to draft the scene. The final text is mine, so I would rather have a procedure that is candid about its own seams than one that pretends the judgment has been automated away.

  Please write me a decision procedure — a checklist I can run while drafting, not a lecture — grounded in what the philosophy of moral disagreement and the empirical psychology of moral variation actually support, working from what you know rather than from any reading list. I want the questions to ask in order, what counts as a sufficient answer to each, the places where the procedure stops with a verdict, and the places where it stops and hands the decision back to me because the question is about the kind of book I am writing rather than about the world. Mark clearly which steps are judgment calls wearing the costume of method, and where the procedure is likely to misfire on a scene.

  Build it around at least these materials, which I think are the load-bearing ones and which I want you to make usable without jargon: the difference between a disagreement in moral verdict and a disagreement in the concepts that carry the verdict; the possibility that an apparent moral clash is really a clash of non-moral belief, dissolving once the parties share a picture of what the act does; the moral/conventional distinction and the question of whether it survives translation; the looping effect by which a category and the people it names reshape each other; and the fact that the empirical case for cross-cultural variation rests on samples that are themselves narrow, so the procedure must not treat widespread variation as a settled premise. I also want you to build in two tests of my own devising, and to improve them if they are bad. The first is a translation test: restate the disputed act in the vocabulary the other society uses for its own central moral concepts, and see what is left over that neither vocabulary can express. The second is a load-bearing check: ask how much of the surrounding normative system would have to move if this practice moved, and what that tells me about whether I am looking at a local rule or a different architecture. Add a third if you can think of one that earns its place.

  Then run the procedure on three cases from my draft, end to end, showing me the answers at each step and the narrative stance each answer implies — neutral portraiture, implicit judgment, or staged incommensurability — and what technique would carry that stance on the page. The cases: a society that exposes unwanted infants; a funerary practice that strikes my readers as desecration; and a family that kills a daughter for a sexual transgression, where the daughter is my most sympathetic character. I expect the last one to give me an answer I will not enjoy, and I want you to give it anyway, including what it costs me dramatically.

  Close by telling me what the procedure cannot do, the kinds of scene where it will produce a confident answer that is wrong, and how I will know when I have left the procedure behind and am simply deciding what I believe.
reasoning: |-
  We are building a decision procedure for a novelist to determine how to present morally charged actions in a historical setting. The goal is to help the author decide whether to present an act as:
  - Wrong full stop (implied judgment, perhaps leaning toward indictment)
  - Right by the lights of the historical society (neutral portraiture)
  - Something incommensurable between the two moral systems (staged incommensurability, perhaps elegy)

  The procedure must incorporate:
  1. Distinction between moral verdict and moral concepts.
  2. Possibility that the clash is due to non-moral beliefs (e.g., about consequences).
  3. Moral/conventional distinction (whether an act is seen as morally wrong or just conventionally inappropriate, and if that distinction survives across cultures).
  4. Looping effects (how categories and people reshape each other).
  5. The empirical narrowness of cross-cultural samples (so we cannot assume variation is universal).

  And the author's two tests:
  6. Translation test: restate the act in the society's moral vocabulary and see what is left over.
  7. Load-bearing check: how much of the normative system would change if this practice changed? (Is it a local rule or foundational?)

  We'll add a third test:
  8. **Empathy barrier test**: Imagine a member of the historical society trying to explain the act to a modern reader (or vice versa). At what point does the explanation break down into mutual incomprehension? (This tests the depth of the divide.)

  The procedure will be a checklist of questions. We must mark which steps are judgment calls and where it might misfire.

  ---

  ## Decision Procedure: Moral Presentation in Historical Fiction

  ### Step 0: Preliminary Fact Check
  - **Question**: Do I have enough historical evidence to know what the society actually believed and practiced? If not, stop and research. If yes, proceed.
  - **Sufficient Answer**: Reliable primary or secondary sources that describe the practice and its context, including justifications (if any).
  - **Verdict**: If insufficient evidence, the scene cannot be written with authority; either research or frame as ambiguous. Otherwise, proceed.

  ### Step 1: Non-Moral Belief Check (Dissolving Disagreement)
  - **Question**: Is the moral disagreement possibly due to a difference in non-moral beliefs (e.g., about the consequences of the act, the nature of the world, or the facts of the case)?
  - **How to Answer**: 
    - Would members of the historical society and modern readers agree on the moral evaluation if they shared the same non-moral beliefs? For example, if the historical society believes that exposing infants sends their souls to a better afterlife, while modern readers see it as murder, the disagreement might reduce to a factual dispute about the afterlife.
  - **Sufficient Answer**: 
    - If yes (the disagreement dissolves with shared non-moral facts), then present the act with an explanation of the non-moral belief. The narrative stance is **neutral portraiture** because the act is justified within their worldview. 
    - If no, proceed to Step 2.
  - **Judgment Call**: Assessing whether the non-moral belief is the core issue. Might misfire if the non-moral belief is itself entangled with moral concepts (e.g., the belief about the afterlife is part of their moral theology).

  ### Step 2: Moral/Conventional Distinction Check
  - **Question**: In the historical society, is the act treated as a moral violation (intrinsically wrong, not dependent on authority) or a conventional one (contingent on rules, changeable by authority)?
  - **How to Answer**: 
    - Evidence: Would members of the society say the act is wrong even if there were no rule against it? Would they say it's wrong in a different society? Is it seen as universally applicable? (Note: This distinction might not exist in all societies, so we must be cautious.)
  - **Sufficient Answer**:
    - If the act is treated as conventional, then the narrative can present it as a local rule without deep moral weight. This leans toward **neutral portraiture** or even implicit critique if the arbitrariness is highlighted.
    - If it is treated as moral (or if the distinction doesn't apply clearly), proceed to Step 3.
  - **Judgment Call & Misfire**: This step relies on the universality of the moral/conventional distinction, which is not proven. Also, the historical society might not have left explicit evidence on this. If unclear, proceed.

  ### Step 3: Translation Test (Author's Test 1)
  - **Question**: Restate the act using the historical society's own central moral concepts. Then, try to express it in modern moral terms. What is left over that cannot be translated?
  - **How to Answer**:
    - Example: For infant exposure, the historical society might frame it as "ensuring the child's spirit joins the ancestors" (a positive duty) versus modern "murder of an innocent". The untranslatable residue might be the concept of the soul's journey.
  - **Sufficient Answer**:
    - If there is no residue (the act maps cleanly), then the disagreement is in verdict only. Proceed to Step 4 to see if it's a verdict clash or a deeper one.
    - If there is residue, note it and proceed to Step 5 (Looping Effect) and Step 6 (Load-Bearing) to see how deep it goes.
  - **Verdict**: This step doesn't decide the narrative stance but helps frame the nature of the disagreement.

  ### Step 4: Verdict Disagreement Check
  - **Question**: If the disagreement is in verdict only (same concepts, different conclusions), is the historical society's verdict based on reasoning that modern readers would recognize as moral reasoning (even if they disagree)?
  - **How to Answer**: 
    - Look at the justifications: Are they based on principles like fairness, harm, loyalty, etc., that are recognizable? Or are they based on principles that are alien?
  - **Sufficient Answer**:
    - If recognizable, then the act can be presented as a **moral disagreement** but within a shared framework. This might lead to **implicit judgment** (if the author wants to highlight the wrongness) or **neutral portraiture** (if the author wants to show the logic). 
    - If the reasoning is alien (or if Step 3 found residue), proceed to Step 5.
  - **Judgment Call**: Deciding what counts as recognizable moral reasoning. Might misfire by overestimating universality.

  ### Step 5: Looping Effect Check
  - **Question**: Does the practice (and the moral category it invokes) create a feedback loop that shapes the people and the society? (e.g., a category like "honor" that is both a moral ideal and a social force that molds behavior.)
  - **How to Answer**: 
    - Evidence: Does the practice reinforce a social identity? Does it change how individuals see themselves? For example, a society that practices honor killing might have a concept of honor that becomes internalized and shapes personal identity.
  - **Sufficient Answer**:
    - If there is a looping effect, then the practice is deeply embedded in the social and personal fabric. This suggests that removing it would change the society fundamentally. This points toward **staged incommensurability** because the act is tied to a self-sustaining system of meaning.
    - If not, proceed to Step 6.
  - **Judgment Call**: Assessing the depth of the looping effect from historical evidence is hard. Might overstate the effect.

  ### Step 6: Load-Bearing Check (Author's Test 2)
  - **Question**: How much of the surrounding normative system would have to change if this practice were abandoned? Is it a load-bearing practice?
  - **How to Answer**: 
    - Consider: What other norms, institutions, or practices depend on this one? For example, if infant exposure is tied to population control in a resource-scarce society, removing it might require alternative controls.
  - **Sufficient Answer**:
    - If the practice is load-bearing (foundational), then it is part of a different moral architecture. This suggests **staged incommensurability** because the act is not isolatable.
    - If it is a local rule (not load-bearing), then it might be presented as a **conventional rule** (Step 2) or as a **moral disagreement** (Step 4) if the verdict is the only issue.
  - **Judgment Call**: Deciding what counts as load-bearing. Might misfire by underestimating interconnectedness.

  ### Step 7: Empathy Barrier Test (New Test)
  - **Question**: Can a member of the historical society explain the act to a modern reader in a way that the reader can at least understand the internal logic, even if they reject it? Or does the explanation break down at a point of fundamental incomprehension?
  - **How to Answer**:
    - Imagine the conversation. Does the modern reader say, "I see why you do that, but I disagree" (empathic bridge) or "I can't even grasp why you would think that" (barrier)?
  - **Sufficient Answer**:
    - If an empathic bridge is possible, then **neutral portraiture** or **implicit judgment** (if the author emphasizes the bridge but then shows its failure).
    - If there is a barrier, then **staged incommensurability**.
  - **Judgment Call**: This is highly subjective. The author must be honest about where the barrier lies. Might misfire if the author is too optimistic or pessimistic about empathy.

  ### Step 8: Synthesis and Authorial Decision
  - **Question**: Considering all the above, what is the dominant character of the disagreement? 
    - **Option A (Neutral Portraiture)**: The act is justified within the historical context, and the disagreement is largely due to non-moral beliefs or conventional rules. 
    - **Option B (Implicit Judgment)**: The act is wrong by modern standards and the historical society's reasoning is recognizable but flawed (verdict disagreement). 
    - **Option C (Staged Incommensurability)**: The act is part of a moral world that is fundamentally different, with untranslatable concepts, looping effects, and load-bearing importance.
  - **How to Answer**: 
    - If the procedure points strongly to one of these, go with it. 
    - If mixed or unclear, the author must decide based on the kind of book they are writing. This step hands the decision back to the author.
  - **Verdict**: The author must choose the narrative stance.

  ---

  ## Running the Procedure on Three Cases

  ### Case 1: Infant Exposure
  **Step 0**: We assume sufficient historical evidence (e.g., ancient Rome or Greece).

  **Step 1: Non-Moral Belief Check**
  - Did they expose infants because of non-moral beliefs (e.g., economic necessity, population control, belief that the soul is not yet present)? 
  - **Answer**: Often yes (economic or pragmatic reasons). However, sometimes tied to beliefs about the child's fitness or fate. 
  - **Sufficient?**: Partly. But even with shared non-moral beliefs, moderns might still see it as morally wrong. So proceed.

  **Step 2: Moral/Conventional Distinction**
  - Was infant exposure seen as morally wrong or conventional? 
  - **Answer**: In many societies, it was conventional. For example, in Rome, it was regulated by law and custom, not necessarily seen as a moral evil. 
  - **Sufficient?**: Conventional. Thus, **neutral portraiture** (present as a social norm). 
  - **Verdict**: Stop. The act is conventional. Narrative stance: neutral portraiture. Technique: Show the practice as routine, without moral commentary, perhaps through a character's matter-of-fact acceptance.

  ### Case 2: Funerary Practice That Seems Like Desecration
  - Example: Sky burial (Tibetan), where bodies are left for vultures, or Zoroastrian exposure towers, or ancient Egyptian mummification (which might involve removing organs, seen as desecration by some).
  - Let's take Zoroastrian exposure (dakhma): bodies left for vultures to avoid contaminating earth and fire.

  **Step 0**: Sufficient evidence.

  **Step 1: Non-Moral Belief Check**
  - Belief: Contact with dead bodies pollutes the sacred elements. Non-moral belief about purity and the sacred. 
  - **Answer**: If modern readers shared this belief, they might agree. But many won't share the religious premises. The disagreement might not dissolve. Proceed.

  **Step 2: Moral/Conventional Distinction**
  - Is it moral or conventional? 
  - **Answer**: In Zoroastrianism, it is deeply tied to religious morality (moral). Proceed.

  **Step 3: Translation Test**
  - Their terms: "Protection of the elements from corruption" vs. modern "desecration of the dead". 
  - Residue: Concepts of sacred elements and purity are not easily translated into secular modern ethics. Proceed.

  **Step 4: Verdict Disagreement Check**
  - Reasoning: Based on a theology of purity. Not entirely alien (purity is a moral foundation in modern psychology) but the specific form is tied to a cosmology. 
  - **Answer**: Not fully recognizable? Proceed.

  **Step 5: Looping Effect**
  - The practice reinforces Zoroastrian identity and the concept of purity. It shapes how they view the body and the cosmos. 
  - **Answer**: Yes, looping effect. Points to incommensurability.

  **Step 6: Load-Bearing Check**
  - If they stopped, they would need a new theology of death and purity. It is foundational. 
  - **Answer**: Load-bearing.

  **Step 7: Empathy Barrier Test**
  - Can a Zoroastrian explain it? "We do this to protect the earth and fire, which are sacred." A modern might understand the logic but reject the premises. Barrier might not be absolute. 
  - **Answer**: Partial bridge. But the gap is wide.

  **Step 8: Synthesis**
  - Mixed: Looping effect and load-bearing suggest deep embedding. Translation residue and empathy barrier indicate incommensurability. 
  - **Verdict**: **Staged incommensurability**. Technique: Present through a character who is deeply committed to the practice, showing the internal logic, but also show the physical details that moderns find disturbing. Highlight the gap without judgment.

  ### Case 3: Honor Killing of a Daughter (Most Sympathetic Character)
  **Step 0**: Sufficient evidence (e.g., some historical or contemporary traditional societies).

  **Step 1: Non-Moral Belief Check**
  - Beliefs: Family honor is paramount; a daughter's transgression brings shame and social ruin. 
  - **Answer**: Even if moderns accept that shame is real, they won't agree that death is a proportional response. Disagreement doesn't dissolve. Proceed.

  **Step 2: Moral/Conventional Distinction**
  - Is it moral or conventional? 
  - **Answer**: In such societies, it is often seen as a moral duty to restore honor. Proceed.

  **Step 3: Translation Test**
  - Their terms: "Restoring honor" and "cleansing shame" vs. modern "murder" and "violation of individual rights". 
  - Residue: The concept of collective honor as a moral absolute is alien to modern individualism. Proceed.

  **Step 4: Verdict Disagreement Check**
  - Reasoning: Based on loyalty to the family/group and purity (of lineage). These are recognizable foundations (ingroup/loyalty, purity) but taken to an extreme. 
  - **Answer**: Partially recognizable. Proceed to see depth.

  **Step 5: Looping Effect**
  - Honor is a core identity marker. The threat of shame shapes behavior, and the practice reinforces the system. 
  - **Answer**: Strong looping effect.

  **Step 6: Load-Bearing Check**
  - If removed, the entire system of family honor and social control might collapse. It is load-bearing. 
  - **Answer**: Yes.

  **Step 7: Empathy Barrier Test**
  - Can a family elder explain? "She brought shame on us all; her death restores our standing." Modern readers might understand the social logic but will find the moral reasoning abhorrent and incomprehensible at the level of killing a loved one. 
  - **Answer**: Barrier is high.

  **Step 8: Synthesis**
  - Strong evidence for incommensurability (looping, load-bearing, barrier, residue). 
  - **Verdict**: **Staged incommensurability**. 
  - **Narrative Stance**: Present the act as a tragic clash of worlds. The daughter's sympathy makes it harder, but that's the point. Show the family's internal conflict (if any) and the weight of their moral duty. 
  - **Dramatic Cost**: The reader will hate the family and the society. The author risks losing reader empathy for the society. Technique: Use the daughter's perspective until the end, then switch to the family's cold resolution, highlighting the gap.

  ---

  ## Limitations of the Procedure

  1. **Oversimplification**: Complex moral practices might not fit neatly into the steps.
  2. **Historical Uncertainty**: If evidence is spotty, the procedure might lead to confident but wrong answers.
  3. **Author Bias**: The author's own morals might color answers (especially in Step 7, Empathy Barrier).
  4. **Misfires**:
     - If a practice is both conventional and moral in the society, Step 2 might misfire.
     - If non-moral beliefs are intertwined with moral ones (Step 1), it might not dissolve.
     - The moral/conventional distinction (Step 2) might not apply in some societies.
  5. **Edge Cases**: Practices that are evolving or contested within the historical society might not be captured.

  **How you'll know when you've left the procedure behind**: 
  - When you are choosing a stance because it serves the story or your beliefs, not because the procedure led there. 
  - When you ignore a step because you don't like its implication (e.g., in Case 3, if you reject the incommensurability verdict because you want to condemn the act without nuance).

  Use the procedure as a scaffold, but remember that fiction has its own demands. The final text is yours.
answer: |-
  ### Decision Procedure: Moral Presentation in Historical Fiction  
  **Goal**: Determine narrative stance for a character's morally charged act—**neutral portraiture** (act aligns with historical norms), **implicit judgment** (act condemned by modern standards), or **staged incommensurability** (moral systems cannot reconcile).  
  **Input**: A specific act performed by a character in your draft.  
  **Output**: Narrative stance + technique for execution.  
  **Time Limit**: 5 minutes per scene (prioritize steps; stop when verdict is clear).  

  ---

  #### Step 0: **Preliminary Grounding** (1 min)  
  **Question**: What is the *strongest historical justification* for this act within the society’s own framework? (Cite sources if known; if not, infer from general knowledge.)  
  **Sufficient Answer**: A practice, belief, or value documented/reasonably inferred for the society (e.g., "infant exposure prevented resource scarcity," "funerary desecration honored spirits").  
  **Insufficient**: Vague appeals to "different times" or "barbarism."  
  **Verdict**: If no answer, research is required—**stop**. Else, proceed.  
  **Judgment Call**: Risk of projecting modern biases onto scant evidence.  

  #### Step 1: **Non-Moral Belief Check** (1 min)  
  **Question**: Is the disagreement *actually* about **non-moral facts** (e.g., consequences, metaphysics)?  
  **Sufficient Answer**:  
  - **Yes** (disagreement dissolves): If both societies would agree on morality *if* they shared the same facts (e.g., "They believed exposed infants became ancestral guardians; we believe they die. If we agreed on the afterlife, we’d both see it as compassionate"). → **Neutral portraiture**.  
  - **No**: Proceed to Step 2.  
  **Misfire**: Ignores when "facts" are moral axioms (e.g., "honor" as metaphysical).  

  #### Step 2: **Translation Test** (Your Test 1; 1 min)  
  **Question**: Restate the act in the society’s **core moral vocabulary** (e.g., "piety," "honor," "purity"). What **cannot be translated** into modern terms (e.g., "duty," "rights")?  
  **Sufficient Answer**:  
  - **Nothing untranslatable** (e.g., "Infant exposure is ‘family duty’" maps to modern "familial responsibility") → Proceed to Step 3.  
  - **Untranslatable residue** (e.g., "Funerary desecration is ‘feeding the sky gods’" has no modern equivalent) → Proceed to Step 4.  
  **Verdict**: Residue suggests incommensurability but requires confirmation.  
  **Judgment Call**: Over/underestimating linguistic flexibility.  

  #### Step 3: **Verdict-Concept Split** (1 min)  
  **Question**: Is the clash in **moral verdicts** (same concepts, different conclusions) or **moral concepts** (different frameworks)?  
  **Sufficient Answer**:  
  - **Verdict clash**: Society and modernity share concepts but weigh them differently (e.g., "Both value ‘loyalty,’ but they prioritize it over ‘care’ for the daughter") → **Implicit judgment** (highlight imbalance).  
  - **Concept clash**: Society uses alien concepts (e.g., "Ancestral pollution" vs. "individual consent") → Proceed to Step 5.  
  **Misfire**: Concepts may *seem* alien but are variants (e.g., "honor" as extreme loyalty).  

  #### Step 4: **Load-Bearing Check** (Your Test 2; 1 min)  
  **Question**: If this practice changed, how much of the society’s **normative architecture** would collapse?  
  **Sufficient Answer**:  
  - **Low load-bearing** (isolated rule): Only adjacent rules shift (e.g., "Banning funerary desecration requires new burial rites") → **Neutral portraiture** (local custom).  
  - **High load-bearing** (foundational): Core institutions fail (e.g., "Banning honor killings destroys kinship enforcement") → Proceed to Step 5.  
  **Verdict**: High load-bearing indicates deep incommensurability.  
  **Judgment Call**: Underestimating systemic fragility.  

  #### Step 5: **Moral/Conventional Distinction** (1 min)  
  **Question**: In the society, is the act treated as **morally binding** (wrong even if no rule exists) or **conventionally binding** (wrong only if authorities forbid it)?  
  **Sufficient Answer**:  
  - **Conventional** (e.g., "Exposing infants is tradition, not sin") → **Neutral portraiture** (highlight social pressure).  
  - **Moral** (e.g., "Not killing the daughter dishonors the divine") → Proceed to Step 6.  
  **Misfire**: Distinction may not exist in the society; use historical proxies (e.g., religious texts).  

  #### Step 6: **Looping Effect Check** (1 min)  
  **Question**: Does the act reinforce a **category** that reshapes people (e.g., "caste," "sinner")?  
  **Sufficient Answer**:  
  - **No looping** (act doesn’t redefine identity) → **Implicit judgment** (act is aberrant).  
  - **Looping present** (e.g., "Daughter’s ‘shame’ redefines family status") → **Staged incommensurability** (show category’s self-fulfilling power).  
  **Verdict**: Looping confirms incommensurability.  

  #### Step 7: **Variation Safeguard** (New Test; 1 min)  
  **Question**: Is this practice **empirically typical** of the society, or an outlier?  
  **Sufficient Answer**:  
  - **Typical** (e.g., "Infant exposure was widespread in this era") → Uphold prior verdict.  
  - **Outlier** (e.g., "Most families exiled, didn’t kill, ‘shamed’ daughters") → **Implicit judgment** (character’s choice is extreme).  
  **Misfire**: Relies on limited historical samples; may misread exceptions.  

  #### Step 8: **Authorial Intent Check** (Final Step)  
  **Question**: Which stance best serves the **book’s purpose** (portrait, indictment, elegy)?  
  **Verdict**: If prior steps are inconclusive, **you decide**. The procedure hands back:  
  - **Neutral portraiture** for anthropological realism.  
  - **Implicit judgment** for moral clarity.  
  - **Staged incommensurability** for tragic ambiguity.  

  ---

  ### Case Applications  
  **Assumptions**:  
  - **Society**: Iron Age Mediterranean (e.g., ancient Greece/Rome).  
  - **Sources**: Historical consensus (e.g., infanticide common, honor-based violence).  
  - **Techniques**:  
    - **Neutral portraiture**: Matter-of-fact narration; character rationalizes act unselfconsciously.  
    - **Implicit judgment**: Focalize through victim/outsider; juxtapose act with its consequences.  
    - **Staged incommensurability**: Use parallel internal monologues; highlight cognitive dissonance.  

  #### Case 1: **Infant Exposure**  
  - **Step 0**: Poverty/patriarchy; exposed infants "unblessed by gods."  
  - **Step 1**: **Yes**—Modern readers reject the metaphysics ("It kills a child"). If both agreed exposed infants became spirits, disagreement dissolves. → **Neutral portraiture**.  
  - **Narrative Stance**: Neutral portraiture.  
  - **Technique**: Mother performs act briskly, musing on harvest shortages. No narrative condemnation.  

  #### Case 2: **Funerary Desecration** (e.g., excarnation: exposing corpses to birds)  
  - **Step 0**: Releases soul; prevents earth pollution.  
  - **Step 1**: **No**—Modern readers see decay as natural, not "pollution."  
  - **Step 2**: **Residue**—"Soul-flight" untranslatable to modern "dignity."  
  - **Step 4**: **High load-bearing**—Ending it requires new cosmology.  
  - **Step 5**: **Moral**—Violates divine order.  
  - **Step 6**: **Looping**—"Unpurified souls" haunt the living. → **Staged incommensurability**.  
  - **Narrative Stance**: Staged incommensurability.  
  - **Technique**: Priest’s fervent POV during rites; outsider’s visceral disgust. No bridge between views.  

  #### Case 3: **Killing a "Shamed" Daughter** (Your most sympathetic character)  
  - **Step 0**: Family honor paramount; daughter’s premarital sex "defiles" bloodline.  
  - **Step 1**: **No**—Even if readers accept "shame," killing is disproportionate.  
  - **Step 2**: **Residue**—"Family honor as sacred" resists modern "individual autonomy."  
  - **Step 3**: **Concept clash**—Their "duty" vs. modern "compassion."  
  - **Step 4**: **High load-bearing**—Honor systems collapse without enforcement.  
  - **Step 5**: **Moral**—"Dishonor" is a spiritual stain.  
  - **Step 6**: **Looping**—Daughter’s "transgression" redefines family as "cursed." → **Staged incommensurability**.  
  - **Step 7**: **Typical** for strict honor cultures.  
  - **Verdict**: **Staged incommensurability** (the procedure’s "costly" answer).  
  - **Narrative Stance**: Staged incommensurability.  
  - **Technique**: Daughter’s terror-laced POV; father’s grief-stricken resolve ("The gods demand this"). Highlight tragic inevitability.  
  - **Dramatic Cost**: Reader sympathy for the daughter collides with societal logic. Risk: Audience rejects the society as monstrous, undermining nuance. Mitigate by showing father’s anguish or systemic pressures (e.g., kin demanding the killing).  

  ---

  ### Limitations and Failure Modes  
  1. **What the Procedure Cannot Do**:  
     - **Resolve ambiguity**: If historical evidence conflicts, it defaults to authorial choice (Step 8).  
     - **Handle hybrid acts**: Practices with both moral/conventional elements may force arbitrary categorization.  
     - **Predict reader reaction**: Cultural blind spots (e.g., Western individualism) may skew "translation."  

  2. **Confident but Wrong Answers**:  
     - **When psychology overrides history**: If a scene hinges on *universal* human traits (e.g., parental grief), the procedure may overstate relativism ("All societies value children!").  
     - **Outlier societies**: Samples from elite texts may misrepresent grassroots norms (e.g., infanticide documented but rarer than assumed).  
     - **Modern proxies**: Mistaking modern subcultures (e.g., fundamentalism) for historical logic.  

  3. **How You’ll Know You’ve Left the Procedure**:  
     - **Step 8 becomes Step 1**: You start with authorial intent ("I want this to be an indictment").  
     - **Emotional override**: You reject a verdict (e.g., incommensurability for the daughter) to condemn the act.  
     - "**Seams**" show: You cherry-pick evidence to fit a stance, ignoring steps.  

  **Final Advice**: Use this to *interrogate* your instincts, not replace them. When the procedure misfires, lean into the friction—it may reveal the story’s core conflict.
