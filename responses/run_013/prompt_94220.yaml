  ### Diagnostic Decision Tree for Pramāṇa Commitments

  **Instructions:** Answer each branching question based on your commitments, without referencing named schools. Follow the path matching your answer to locate your position. Empty slots indicate unoccupied or problematic combinations.

  #### I. Is the pramāṇa taxonomy a natural kind (tracking mind-independent sources of knowledge) or a pedagogical grouping?  
  - **A. Pedagogical grouping only**  
    → **Leaf 1: Deflationary Conventionalism**  
    *(Most awkward commitment: Must explain why an arbitrary taxonomy successfully structures knowledge across diverse contexts.)*  
  - **B. Natural kind**  
    → II  

  #### II. Must a pramāṇa yield *true* cognition (yathārtha) to qualify, or is it defined by reliable causal production (with truth contingent)?  
  - **A. Must yield truth**  
    → III  
  - **B. Reliable causation suffices**  
    → III *(Warrant distinction deferred to later branches)*  

  #### III. Is there cognition irreducible to inference?  
  - **A. No (all cognition is inferential)**  
    → **Leaf 2: Reductionist Inference-Only**  
    *(Attributed to some Buddhist logicians; awkward commitment: Perception must be reconstrued as rapid unconscious inference, defying phenomenological immediacy.)*  
  - **B. Yes**  
    → IV  

  #### IV. Is perception non-inferential?  
  - **A. No**  
    → **Empty Slot 1**  
    *Diagnosis: Incoherent—denies non-inferential sources after affirming their existence (from III.B).*  
  - **B. Yes**  
    → V  

  #### V. Is inference a distinct pramāṇa?  
  - **A. No**  
    → **Leaf 3: Perception-Only (e.g., Cārvāka-lite)**  
    *(Awkward commitment: Inferential knowledge (e.g., "smoke implies fire") must derive solely from perceptible correlations, risking circularity.)*  
  - **B. Yes**  
    → VI  

  #### VI. Is testimony (śabda) about the collapsed bridge—accepted without independent evidence—distinct from inference?  
  - **A. No (testimony reduces to inference)**  
    → VII.A  
  - **B. Yes (testimony is irreducible)**  
    → VII.B  

  #### VII. Branching by testimony status:  
  - **A. Testimony reducible (base: perception, inference)**  
    → VIII  
  - **B. Testimony irreducible (base: perception, inference, testimony)**  
    → IX  

  #### VIII. For base {perception, inference}: Is comparison (gavaya case) distinct?  
  - **A. No**  
    → X.A  
  - **B. Yes**  
    → X.B  
  *(Similarly for postulation/absence in X, but all paths converge to avoid excess leaves)*  
  **Final Path A Output**:  
    → **Leaf 4: Perception + Inference** (if no additions)  
    *(Classical Nyāya/Vaiśeṣika; awkward commitment: Testimony must be reduced to inference, yet social knowledge often lacks observable premises.)*  
    → **Leaf 9: Non-Classical Expansion** (if any of comparison/postulation/absence added)  
    *(Unattractive—adds sources while rejecting testimony’s distinctness, creating tensions in source hierarchy; unexplored in classical schools.)*  

  #### IX. For base {perception, inference, testimony}: Is comparison (gavaya case) distinct?  
  - **A. No**  
    → **Leaf 5: Perception + Inference + Testimony**  
    *(Sāṃkhya/Yoga; awkward commitment: Gavaya-type learning must be squeezed into testimony or inference, ignoring its analogical structure.)*  
  - **B. Yes**  
    → X  

  #### X. Is postulation (stout man case) distinct?  
  - **A. No**  
    → **Leaf 6: Perception + Inference + Testimony + Comparison**  
    *(Early Mīmāṃsā; awkward commitment: Postulation must be forced into inference, despite its explanatory rather than logical form.)*  
  - **B. Yes**  
    → XI  

  #### XI. Is absence (no elephant) cognition distinct?  
  - **A. No**  
    → **Leaf 7: Perception + Inference + Testimony + Comparison + Postulation**  
    *(Later Mīmāṃsā; awkward commitment: Absences must be inferred, though we often "see" emptiness directly.)*  
  - **B. Yes**  
    → XII  

  #### XII. Final source count: Six (classical list). Is the warrant causal reliability (over truth-necessity)?  
  - **A. No**  
    → **Leaf 8: Classical Six-Pramāṇa (e.g., Prabhākara Mīmāṃsā, Nyāya)**  
    *(Awkward commitment: Each source must defend its uniqueness against reductionist challenges (e.g., absence as perceptual).)*  
  - **B. Yes**  
    → **Leaf 10: Reliabilist Six-Pramāṇa**  
    *(Modern reconstruction; awkward commitment: Causal reliability must be defined without truth, diluting "knowledge" to unjustified true belief.)*  

  ---

  ### Leaf Summary & Annotations  
  1. **Deflationary Conventionalism**: Taxonomy is heuristic.  
     - *Contemporary cases*: (a) Corpus system = testimony (pedagogically); (b) Instrument reading = perception (conventionally).  
  2. **Reductionist Inference-Only**: All pramāṇas reduce to inference.  
     - (a) Corpus system = inference; (b) Instrument reading = inference.  
  3. **Perception-Only**: Rejects non-perceptual sources.  
     - (a) Corpus system = not knowledge; (b) Instrument reading = perception.  
  4. **Perception + Inference**: Testimony reduced.  
     - (a) Corpus system = inference; (b) Instrument reading = perception.  
  5. **Perception + Inference + Testimony**: Comparison reduced.  
     - (a) Corpus system = testimony (if speaker-agnostic); (b) Instrument reading = testimony (if device = "speaker").  
  6. **Perception + Inference + Testimony + Comparison**: Postulation reduced.  
     - (a) Corpus system = testimony; (b) Instrument reading = testimony/perception.  
  7. **Perception + Inference + Testimony + Comparison + Postulation**: Absence reduced.  
     - (a) Corpus system = testimony; (b) Instrument reading = testimony/perception.  
  8. **Classical Six-Pramāṇa**: Full classical list, truth-necessary.  
     - (a) Corpus system = testimony (if competence stretched to systems); (b) Instrument reading = perception/testimony.  
  9. **Non-Classical Expansion**: Testimony reduced but "peripheral" sources added (e.g., {perception, inference, absence}).  
     - *Empty Slot 2*: Unattractive—testimony’s exclusion undermines adding socially dependent sources like comparison.  
  10. **Reliabilist Six-Pramāṇa**: Classical list, causally warranted.  
      - (a) Corpus system = testimony (if reliable); (b) Instrument reading = distinct source (if reliable beyond perception).  

  #### Unresolved Pairs & Further Questions  
  - **Leaves 8 and 10** differ only on warrant (truth-necessity vs. reliability). To separate: *Does a pramāṇa require conscious justification, or is unconscious reliability sufficient?*  
  - **Leaf 9 positions** are indistinguishable in structure; separation requires: *Which specific combination of "peripheral" sources is admitted, and why?*  

  #### Memory & Novelty  
  All leaves (except 1–2) exclude memory as a pramāṇa, citing novelty (knowledge must be of previously unknown objects). If novelty is rejected, memory might qualify as a source:  
  - In reductionist leaves (2, 4, 9), memory could reduce to inference.  
  - In testimony-inclusive leaves (5–8, 10), memory might align with testimony.  
  - *Diagnosis*: Inclusion collapses knowledge-generation and knowledge-retrieval, so exclusion is consistent but pedagogically motivated.  

  #### Empty Slot Diagnoses  
  - **Slot 1 (III.A → IV.A)**: Incoherent—affirms non-inferential sources but denies perception as one.  
  - **Slot 2 (Leaf 9)**: Unattractive—arbitrary admission of "peripheral" sources while reducing testimony, the paradigmatic social source.  

  Contemporary cases are placeable in all leaves except 3 (perception-only rejects corpus systems). Corpus systems (a) fit testimony-leaves only if speaker-competence is decoupled from individuality; instrument readings (b) align with perception or testimony, but may demand new sources if reliability is opaque.  

