  First, their main struggle is distinguishing which open questions are both significant and feasible for a three-year PhD. They prefer conceptual work over simulations or experiments, so technical depth in logic and computability is a plus, but ML or engineering is out. They also mentioned skepticism about a friend's claim that program equilibrium is just the folk theorem with extra steps. That's a red flag—they need to address this to solidify the field's legitimacy.

  Looking at their questions: referee dependence, proof systems vs. resource bounds, multi-player extensions, descriptive vs. normative, and mechanism design. The friend's criticism ties into the last one. If program equilibrium is reducible to existing game theory, it undermines their entire topic. So, defending the framework's uniqueness is probably top priority. 

  Next, the referee's role. Without a shared interpreter, the whole setup might crumble. Figuring out minimal requirements for cooperation here is foundational. Without this, other questions might not hold. Plus, it's tractable with their logic background—possible to model different communication constraints using computability theory.

  Then, multi-player extensions. Real-world applications involve coalitions, so this expands the framework's relevance. Their logic skills can handle modal logics for coalitional reasoning, and it's underexplored. However, it's dependent on the first two questions. If the core two-player case isn't solid, scaling up won't matter.

  The proof system question about resource bounds is important but might lead into complexity theory, which could be a rabbit hole. Their advisor's caution about shifting fields makes this riskier. Still, a negative result here (like cooperation breaking under bounded proofs) would be valuable but less urgent than defending the framework's basis.

  Descriptive vs. normative is more philosophical. While interesting, it doesn't resolve technical gaps. It's more of a framing discussion, better suited for a thesis chapter conclusion rather than a core technical contribution. 

  Prioritizing: Legitimacy first (question 5), then the referee's necessity (question 1), then multi-player (question 3). Proof systems (question 2) and normative aspects (question 4) can come later if time permits. 

  Feasibility is key. Question 5 needs articulating why the "extra steps" matter—perhaps showing unique equilibria not achievable otherwise. Question 1 involves modeling different interpreter setups, doable with Turing machines and modal logic. Question 3 requires defining coalitional incentives, possible with existing game theory tools. 

  The user should tackle question 5 first. If they can't counter their friend's critique, pivoting early is better. Then, question 1 to ensure the framework's robustness. The rest follow based on progress. Ignoring question 4 for now, as it's less central to the technical foundation.
answer: |-
  Here is a prioritized research agenda for your dissertation on program equilibrium, ordered by conceptual centrality, tractability with your toolkit, and downstream impact. The ranking reflects what must be settled *first* to justify the framework itself and unlock other questions. I exclude overrated/non-urgent items explicitly.

  ### **1. Priority #1: Defend the Framework’s Legitimacy (Your Question 5)**
     - **Why upstream?** Until you resolve whether program equilibrium is *meaningfully distinct* from the folk theorem/evidential decision theory (EDT), other questions risk building on sand. If your friend is right, your dissertation collapses.
     - **Tractability:** High. Requires conceptual analysis + logic/computability (your strengths). No ML/engineering needed.
     - **Neglectedness:** Critical gap. Most papers *assume* novelty without rigorously proving it. Your coffee-shop doubt is the alarm bell.
     - **Downstream impact:** Settling this determines whether the field deserves PhDs. If distinct, it unlocks all other questions; if not, pivot immediately.
     - **Key task:** Prove a *separation result*. Example:  
       - *Positive*: Show program equilibrium enforces cooperation in games where the folk theorem fails (e.g., one-shot games with no natural history, or games with unobservable deviations).  
       - *Negative*: Identify a class of games where provability-based cooperation *cannot* be reduced to a repeated game.  
       - **Argument needed**: Why "programs as strategies" enables *new equilibrium constraints* (e.g., mutual proof-checking creates precommitments inaccessible to Bayesian updaters).
     - **1-year deadline:** If you cannot draft a separation result by Year 3 start, abandon the topic.

  ### **2. Priority #2: Referee/Semantics Dependence (Your Question 1)**
     - **Why upstream?** If cooperation vanishes without a trusted referee or shared semantics, the framework is brittle. Must establish *minimal infrastructure* for program equilibrium to exist.
     - **Tractability:** High. Model "partial visibility" (e.g., opaque oracles, limited inspection depth) using computability theory. Explore simulations with Halting Problem reductions.
     - **Neglectedness:** Under-addressed. Most work assumes a perfect referee. Real-world applications (e.g., smart contracts) demand robustness to untrusted execution.
     - **Downstream impact:** Reshapes mechanism design (e.g., what referees are incentivizable?) and affects multi-player extensions (Priority #3).
     - **Key task:** Characterize *necessary and sufficient conditions* for cooperation.  
       - *Conjecture*: Cooperation requires at least mutual knowledge of program *interfaces* (input/output specs) + a simulation black-box (but not full code access).  
       - **Move up/down**: If you find cooperation persists under weak simulation (e.g., only UTM access), this becomes urgent. If it collapses without shared semantics, it’s a fatal flaw.

  ### **3. Priority #3: Multi-Player Extensions & Bargaining (Your Question 3)**
     - **Why here?** Builds on #1–#2. Two-player cooperation is table stakes; multi-player dynamics (coalitions, bargaining) are where the framework could prove uniquely valuable.
     - **Tractability:** Moderate. Requires merging cooperative game theory/logic (e.g., modal logics of coalition power) with program semantics. Avoids ML.
     - **Neglectedness:** High. Most work is 2-player. Bargaining (e.g., Nash program via code) is untouched.
     - **Downstream impact:** Unlocks applications to institutional design (e.g., DAOs, treaty enforcement).
     - **Key task:** Formalize *program-mediated coalitions*.  
       - *Example*: Can a subgroup of players write programs that enforce a bargaining solution (e.g., Shapley value) against outsiders?  
       - **Move up**: If Priority #2 shows partial visibility enables cooperation, multi-player becomes feasible. **Move down**: If bargaining reduces to 2-player subgames, deprioritize.

  ### **4. Priority #4: Proof Systems vs. Resource Bounds (Your Question 2)**
     - **Why lower?** While important, this is a *refinement* of the framework, not a foundation. If program equilibrium isn’t distinct (#1) or robust (#2), complexity is moot.
     - **Tractability:** Risky. Bounded proof search ventures into complexity theory. May require tools beyond your core toolkit (e.g., interactive proofs).
     - **Neglectedness:** Moderate. Some work on probabilistic programs, but bounded rationality is underexplored.
     - **Downstream impact:** Affects practicality but not conceptual novelty. Worth a chapter, not the core.
     - **Key task:** Prove whether cooperation *degrades gracefully* with proof bounds.  
       - *Conjecture*: With polynomial-time proof checks, cooperation fails in worst-case games (reduction to cryptographic hardness).  
       - **Rule out if**: Your advisor cautions against complexity deep dives. This could become its own PhD.

  ### **Overrated / Defer: Descriptive vs. Normative (Your Question 4)**
     - **Why exclude?** This is a *philosophical commentary* on existing results, not a technical open problem. It won’t resolve whether the framework works or matters.
     - **Exception:** Only engage if you find a *technical implication* (e.g., evolutionary stability of program equilibria). Otherwise, relegate to dissertation conclusions.

  ---

  ### **Agenda Summary & Timeline**
  1. **Year 2 (Now–Spring):** Attack **Priority #1 (Legitimacy)**. Read Anderlini (2004), Tennenholtz (2004), and critical surveys. Draft a separation argument.  
     - *Success metric*: Conference paper defending novelty.  
     - *Abort signal*: No progress by summer → pivot dissertation topic.  

  2. **Year 3:** Resolve **Priority #2 (Referee Dependence)**. Model "adversarial interpreters" using oracle TMs. Submit to *TARK* or *Games*.  
     - *Success metric*: Minimal conditions for cooperation proven.  

  3. **Year 4:** Extend to **Priority #3 (Multi-Player)**. Apply to a bargaining game (e.g., Ultimatum with programmatic commitments).  
     - *Stretch goal*: Complexity (#4) if time permits.  

  **Critical Risk**: Your friend’s "folk theorem with extra steps" critique. If unaddressed, nothing else matters. Start here. **Tools to leverage**: Your logic/computability background – this is a battle of definitions and reductions, not empirics.  

  This ordering forces you to validate the *why* before the *what*. If Priority #1 fails, you’ve lost only 6 months, not 3 years. If it succeeds, you earn the right to build.
