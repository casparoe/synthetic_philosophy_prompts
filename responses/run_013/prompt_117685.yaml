  First, I need to recall how the Doomsday Argument works. It uses the Self-Sampling Assumption (SSA), which treats your own birth rank as a random sample from all humans who will ever exist. If you're around the 100th billion human born, then with 95% confidence, you're not in the first 5% of all humans. That would imply total humans won't exceed 2 trillion. 

  But the user wants to convert this into a timeline. They mention current population is 8 billion. I remember that estimates put total humans born so far at around 100-120 billion. So if N is the total humans who will ever live, SSA suggests a 95% chance that N is less than 2 trillion. 

