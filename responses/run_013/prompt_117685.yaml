  Dividing the remaining 1.88 trillion humans by 125 million per year gives about 15,000 years. But this is sensitive to assumptions - if population declines faster, the timeline extends. 

  The user seems to want a concrete number for life decisions. But I should emphasize the argument's controversies: SSA isn't universally accepted, and it assumes you're a "typical" observer. Also, the calculation ignores potential for human expansion beyond Earth. 

