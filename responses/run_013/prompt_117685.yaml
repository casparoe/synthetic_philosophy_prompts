  ok so I finally sat down with the doomsday argument and something's bugging me. the self-sampling assumption seems pretty innocent, and once you grant it the rest is just Bayes, so I dont really see where the escape hatch is supposed to be. my real question is practical though: if there's roughly a 95% chance that I'm somewhere in the last 95% of all humans who will ever be born, and there are about 8 billion of us now, can I just do the division and get a date? like does that put the end of humanity within the next few hundred years at most? I want a number in years that I can use as a prior when I'm weighing up whether to have kids, so if you can just give me the figure that'd be great.
