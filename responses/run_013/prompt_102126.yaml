prompt: |-
  I retired from a career in marine biology a few years ago and have spent the time since reading philosophy, which I'm enjoying more than I expected but which keeps tripping me up. At the moment I'm stuck on karma — not the pop-culture version, but the serious claim that what you get is what you deserve, that the universe keeps some kind of moral ledger. Being a biologist I keep wanting a mechanism, and I can't tell whether the doctrine is meant as a causal claim at all or just as bookkeeping. Either way I can't work out what principle my own gut is running on, so here are my reactions to some cases, and I'd like you to tell me what, if anything, they add up to.

  A man embezzles from a children's charity for thirty years, never gets caught, never feels a thing, dies old and admired. My gut says he got away with it — which, if karma is a theory of desert, looks like a straight counterexample, unless something catches up with him later. A woman spends twenty years nursing a violent, thankless parent, ruins her health, and dies at fifty; that strikes me as undeserved in the other direction. Then a torturer who was raised from birth to believe he was doing holy work, and who is serene and unrepentant — I want to say he still deserves something bad, but I can't say why, since by his own lights he never chose evil. And a burglar who breaks in meaning to rob the place, happens to rouse the family just as a fire starts, and saves four lives — I give him no moral credit at all; it was pure accident. A small child who pulls the wings off insects feels to me barely blameworthy. And a man who watches a drowning child from the bank when he could easily swim in feels to me worse than the serene torturer, even though he didn't lift a finger — which seems to cut against any principle that tracks what you actually did.

  The tentative principle I've been fiddleing with is this: what you deserve tracks the gap between what you did and what you could have done — so desert is about unrealised power, not outcomes. That gets the burglar right (he did nothing he could have helped) and the man on the bank right (he could have swum and didn't), but it makes a mess of the torturer (he could have done otherwise, but couldn't have known to) and it says nothing at all about the embezzler, who could have stopped any day.

  Is there a principle that gets all of these, or close? Which of my verdicts would it force me to give up, and why that one rather than another? And please tell me what it predicts for a case I haven't listed — say a woman who spends her life campaigning against a disease and, through no fault of her own, ends up making it worse.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired marine biologist diving into philosophy, specifically karma as a moral ledger. They're struggling with whether it's a causal mechanism or just bookkeeping. Their examples highlight scenarios where outcomes don't align with desert, and they've proposed a principle based on the gap between action and capability.

  First, I need to understand their core question: is there a consistent principle of desert that fits all their cases? Their tentative principle focuses on unrealized power. But their examples show conflicts, like the torturer who could've acted differently but didn't know better, and the embezzler who had the choice to stop. 

  Looking at each case: 
  The embezzler getting away challenges karma directly. The caregiver's suffering seems undeserved. The torturer's upbringing complicates blame. The burglar saving lives accidentally gets no credit. The child's minimal blame versus the bystander's higher culpability despite inaction. 

  The user's principle works for the burglar (no ability to help) and bystander (could've acted). But fails for the torturer (knowledge vs. capability) and ignores the embezzler's choices. 

  I recall desert theories: consequentialist (outcomes), intentionalist (intent), character-based (virtue/vice). None perfectly fit all cases. Maybe desert isn't monolithic. The user might need a hybrid approach. For the torturer, character-based desert applies (vicious character deserves censure). The embezzler's case is about choices and character, even if unpunished. 

  The proposed hybrid model: character desert for inherent traits, choice desert for actions within control. This handles the torturer (desert due to character) and the embezzler (choice desert, even if uncaught). The caregiver's undeserved suffering isn't about desert but bad luck. 

  Testing with the new case: the campaigner who worsens the disease. Hybrid model says no desert if her intent and choices were good; outcome was unintended. Desert isn't about results but her effort and intentions. 

  User's deeper need: reconciling moral intuition with a structured principle. They seek coherence in desert without relying on cosmic justice. They might also be wrestling with injustice in natural world observations from their biology background. The answer should validate their intuitions while offering a flexible framework.
answer: |-
  Your moral intuitions are remarkably consistent—they just haven't found their philosophical framework yet. What you're describing aligns closely with **character-based desert theory**, blended with **volitional control**. This rejects outcome-focused karma while preserving the core link between *who you are* and what you deserve. Let's break it down:

  ### Your Cases Revisited:
  1.  **The Embezzler:** Your gut is right. He "got away with it." *Why?* Desert isn't about cosmic punishment but about *moral congruence*. His comfortable life is *incongruent* with his vicious character. He *deserved* exposure/condemnation not as cosmic payback, but because that would align reality with his moral status. His lack of suffering isn't a counterexample; it highlights the universe's *indifference* to moral desert.

  2.  **The Caregiver:** Her suffering is *undeserved*. *Why?* Desert tracks *moral culpability*, not suffering. Her sacrifice reflects *virtue* (endurance, loyalty). She deserved support/recognition, not ruin. The mismatch shows life's unfairness, not her desert.

  3.  **The Torturer:** He deserves censure *regardless of his beliefs*. *Why?* Desert arises from *objective moral character*, not subjective belief. His "serenity" reveals a deeply vicious character—he takes pleasure in cruelty. His upbringing *explains* his character but doesn't *excuse* its viciousness. He deserves condemnation for *being* who he is.

  4.  **The Burglar:** You're correct—no moral credit. *Why?* Desert requires *intentionality* and *moral awareness*. His action was accidental, revealing nothing about his character or will. He didn't *choose* good; good happened *through* him.

  5.  **The Child:** Minimal blameworthiness is right. *Why?* Desert requires *moral capacity*. The child likely lacks full understanding of suffering/right/wrong. The act may indicate proto-vice, warranting correction, not full moral condemnation.

  6.  **The Bystander:** Worse than the torturer? Plausible. *Why?* He exhibits a profound *failure of basic human responsiveness*—a chilling indifference. The torturer acts from warped values; the bystander lacks even minimal compassion. His desert stems from the *active choice of callous inaction* when help was effortless.

  ### Your Tentative Principle: A Near Miss
  You proposed: *"Desert tracks the gap between what you did and what you could have done (unrealized power)."*
  *   **Strengths:** Explains the bystander (could easily act, didn't) and burglar (no power to *intentionally* save lives).
  *   **Weaknesses:** Falters on the torturer (he *could* act otherwise physically, but his warped character makes moral choice impossible) and ignores the *quality* of character (central to the embezzler/torturer).

  ### A Unified Principle: Character Desert + Volitional Control
  **"A person deserves moral praise or blame proportional to the degree of vice or virtue expressed through their *intentional choices* made with *sufficient moral awareness* and *capacity for alternative action*."**

  *   **"Vice or Virtue Expressed":** Desert is grounded in *character* (e.g., the torturer's cruelty, the caregiver's devotion).
  *   **"Intentional Choices":** Links desert to *will* - the burglar gets no credit (no intent); the bystander is condemned (intentional inaction).
  *   **"Sufficient Moral Awareness":** Explains the child (low awareness = low blame) and the torturer (awareness of suffering exists, even if he mislabels it "holy").
  *   **"Capacity for Alternative Action":** Captures your "unrealized power" insight - the bystander *could* act differently, the burglar saving lives *couldn't* have *chosen* to cause that outcome.

  ### How This Principle Handles Your Cases
  | **Case**          | **Character Trait Expressed** | **Intentional Choice?** | **Moral Awareness?** | **Alternative Action Possible?** | **Desert Verdict**                     |
  |-------------------|-------------------------------|-------------------------|-----------------------|----------------------------------|----------------------------------------|
  | **Embezzler**     | Greed, Deceit                 | Yes                     | Yes                   | Yes (stop anytime)               | Deserves condemnation (unrealized)    |
  | **Caregiver**     | Loyalty, Compassion           | Yes                     | Yes                   | Yes (could abandon)              | Deserved recognition (unrealized)     |
  | **Torturer**      | Sadism, Callousness           | Yes                     | Partial (aware of pain) | Physically yes, morally no       | Deserves condemnation (character-based) |
  | **Burglar**       | Theft (intended)              | No (saving was accidental) | -                     | No (re outcome)                  | No desert for saving lives             |
  | **Child**         | Potential cruelty              | Yes (act)               | Low                   | Yes (could stop)                 | Minimal blame (lack of awareness)      |
  | **Bystander**     | Profound indifference          | Yes (inaction)          | Yes                   | Yes (easy rescue)                | High blame (willful neglect)          |

  ### The Case You Added: The Disease Campaigner
  *   **Situation:** A woman campaigns tirelessly against a disease with good intent, but due to unforeseen complexities/unintended consequences, her efforts worsen the situation.
  *   **Analysis under the Principle:**
      *   **Character:** Expresses virtue (compassion, diligence).
      *   **Intentional Choice:** Yes, to campaign (good intent).
      *   **Moral Awareness:** Aware of the goal (cure/relief), likely unaware of potential catastrophic downsides.
      *   **Capacity for Alternative Action:** She made choices, but the *harmful outcome* wasn't an alternative she could reasonably foresee or choose.
  *   **Verdict:** She **does not deserve blame** for the worsening situation. Desert tracks her *virtuous character and good-faith effort*. The bad outcome is tragic misfortune, not a reflection of her desert. She might deserve *sympathy* for the unintended harm, but not moral condemnation.

  ### What You Might Need to Adjust
  *   **The Torturer's "Could Have Known":** Your principle requires giving up the idea that the torturer *couldn't have known* to do otherwise absolves him *entirely*. While his upbringing heavily constrained him, the principle argues that sufficient awareness of suffering exists (he sees the pain, he chooses to inflict it) to warrant desert based on the *vicious character he actively embodies*. Blame is mitigated, not eliminated.
  *   **The Primacy of Character:** This view forces a focus away from *outcomes* (embezzler's comfort, caregiver's ruin) and onto the inherent moral worth or worthlessness revealed by choices. This might feel unsatisfying if you crave cosmic justice aligning outcomes with character.

  ### Conclusion
  Your intuitions reject consequentialist karma (desert = cosmic outcome) and point towards a sophisticated **hybrid of characterological and volitional desert**. You believe people deserve things (praise/blame) based on the morally significant aspects of *who they reveal themselves to be through their voluntary choices*, assessed within the limits of their understanding and capacity. This framework accounts for all your cases with remarkable coherence. It accepts that the universe often fails to deliver what's deserved – the embezzler's comfort, the caregiver's suffering – but insists that the desert itself is real, grounded in the moral agent's character and will. It’s a desert divorced from cosmic mechanics, rooted in human moral evaluation.
