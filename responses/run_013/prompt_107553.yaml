prompt: |-
  I am a third-year PhD student in the history and philosophy of science, and as part of my studentship I run a fortnightly methodology clinic for doctoral researchers on our cross-faculty training programme, most of them building simulation models in ecology, epidemiology and environmental economics. Each student gets one thirty-minute session and leaves with a one-page note that they and their supervisor both sign, setting out whether the line they are on looks worth continuing, what would have to happen for that judgement to change, and what they should do next. There are about a dozen of these a year, the stakes are a year or more of somebody's funded time, and I have neither expertise in their subject matter nor authority over them, so whatever I write has to be defensible to a supervisor in another discipline. At present I improvise, and I have noticed that I am running a crude implicit test: does this framework keep generating claims that turn out to be true, or does it keep being repaired after the fact?

  Please turn Lakatos's methodology of scientific research programmes into a procedure I can actually run in half an hour. I want it as an ordered sequence of questions rather than a rubric of virtues; for each question, what would count as an answer sufficient to move on; the point at which the procedure returns a negative verdict; and the point at which it must stop and hand the matter back to the student as a question of ambition rather than of method. Make use of the machinery properly — the hard core and the protective belt, the positive and negative heuristics, the difference between a progressive and a degenerating problem-shift, the role of novel prediction, and Lakatos's refusal to count a programme as refuted while it is still the best one going. The hard part is the translation, and I want you to confront it rather than paper over it: Lakatos's unit is a programme assessed retrospectively by historians over decades, against rivals, whereas mine is a single doctoral project assessed prospectively in thirty minutes by someone who does not understand the science. Say plainly which parts of the original survive that move, which have to be weakened, and which cannot be carried across at all.

  Then work the procedure through three cases. First, a student whose invasive-species model has acquired four auxiliary assumptions over eighteen months, each added after a failed calibration, each fitting the present data set, none yet tested against anything new. Second, a student whose transmission framework committed itself early to a counterintuitive claim about asymptomatic spread, which an independent cohort study later bore out, and which has since been extended to a second host species. Third, a case where the procedure returns a verdict I will not like: a student in a fashionable, well-funded modelling tradition whose recent work consists largely of defensive re-parameterisations, but whose entire professional network sits inside that tradition. Tell me what I should do with a verdict like that when the student has no realistic alternative and I am the only person in the room saying it.

  Finally, tell me where the procedure will misfire. I am thinking especially of projects that are descriptive or methodological rather than predictive, of fields with no rival programme to compare against, of cases where the hard core is a modelling formalism rather than a substantive theory, and of the fact that a student can rarely change direction for funding reasons even when the method says they should. I do not need a reading list or references; assume I know the texts.
reasoning: |-
  Okay, the user is a PhD student running methodology clinics for doctoral researchers using simulation models in ecology, epidemiology, and environmental economics. They need a practical, step-by-step procedure based on Lakatos's methodology of scientific research programmes (MSRP) that can be applied in 30-minute sessions. 

  First, I need to understand the core challenge: translating Lakatos's historical, long-term framework into a quick assessment tool for individual projects. The key constraints are time (30 mins), lack of subject expertise, and no authority over students. The output is a signed note determining if the project is worth continuing.

  Hmm... Lakatos's concepts need major adaptation. The hard core becomes the project's foundational commitments. The protective belt translates to adjustable parameters. Progressive shifts mean new predictions; degenerative shifts mean post-hoc fixes. But comparing rival programs isn't feasible here - we'll assess internal progress instead.

  For the procedure, I'll design sequential questions:
  1) Identify non-negotiable commitments (hard core)
  2) List adjustable elements (protective belt)
  3) Outline forbidden changes (negative heuristic)
  4) Describe planned adaptations (positive heuristic)
  5) Track belt modifications
  6) Assess predictive success
  7) Evaluate overall trajectory

  The critical thresholds: Degenerating if >2 untested belt fixes without novel predictions. Stop if methodological limitations block progress. 

  Now for case studies... 
  The invasive species case clearly fails - four untested patches is degenerative. The asymptomatic spread case passes - novel prediction validated. The fashionable model case is tricky - degenerative but trapped by career realities. Here the advice must be honest but compassionate: document concerns while acknowledging systemic constraints.

  Major limitations to flag: Descriptive projects won't fit, isolated fields lack rivals, formalist cores change assessment criteria. Also, funding locks often override methodological recommendations.

  The user's deeper need seems to be legitimizing critical feedback across disciplines. The procedure creates objective criteria to shield them from pushback. The third case reveals their anxiety about challenging powerful academic tribes - hence needing explicit "what to do" guidance.

  Worth emphasizing that the procedure's strength is making implicit judgments explicit and defensible. Even when students can't pivot, naming degeneration has value for their methodological awareness.
answer: |-
  Here's a procedural adaptation of Lakatos's MSRP for your 30-minute doctoral clinic, acknowledging translational constraints. Key adaptations: **Rival programmes** are replaced by **internal progress benchmarks**; **historical assessment** becomes **projected trajectory**; **hard core** is interpreted as **project's foundational commitments**.

  ---

  ### **Lakatos MSRP Assessment Procedure (30-Minute Version)**
  *Ordered questions with exit criteria. Time per question: 3–4 mins.*

  1.  **"What are the non-negotiable commitments of your project? (The *Hard Core*)"**
      *   *Sufficient Answer:* 2–3 clear, specific principles (e.g., "Agent-based modeling only," "Rational choice agents," "Pathogen transmission requires direct contact").
      *   *Move On When:* Commitments are identifiable and stable for the project duration.
      *   *Stop & Hand Back:* If student cannot identify *any* core commitments (suggests lack of focus). Verdict: *Ambition/Method Unclear*.

  2.  **"What parts of the model/framework *can* you change to make it work? (The *Protective Belt*)"**
      *   *Sufficient Answer:* List of adjustable parameters, auxiliary assumptions, model structures (e.g., "Transmission rate," "Habitat suitability function," "Discount rate assumptions").
      *   *Move On When:* Belt elements are distinguishable from the Hard Core.
      *   *Stop & Hand Back:* If *everything* is negotiable (no core) or *nothing* is adjustable (rigidity). Verdict: *Ambition (too broad/too narrow)*.

  3.  **"What changes are you *forbidden* to make to protect the core? (The *Negative Heuristic*)"**
      *   *Sufficient Answer:* At least one clear methodological or substantive taboo (e.g., "Cannot assume non-selfish agents," "Must use differential equations," "Cannot add supernatural causes").
      *   *Move On When:* A minimal protective strategy is articulated.
      *   *Negative Verdict Possible?* Not yet. Weak NH is a warning sign but not fatal alone.

  4.  **"What specific model developments or extensions *should* you be trying next? (The *Positive Heuristic*)"**
      *   *Sufficient Answer:* Concrete, near-future research steps planned *before* encountering problems (e.g., "Extend to 3-species interaction," "Incorporate spatial heterogeneity," "Test robustness to income distribution shocks").
      *   *Move On When:* PH exists beyond just "fixing current bugs."
      *   *Stop & Hand Back:* If PH is absent or purely reactive (e.g., only "calibrate better"). Verdict: *Ambition (lacks forward direction)*.

  5.  **"List changes made to the Protective Belt *since the project began*. For each, was it: (a) Planned by the PH? (b) Reactive to data/failure? (c) Tested against *new* data/context?" (Assessing *Problem-Shifts*)**
      *   *Sufficient Answer:* Brief list with classification (a/b/c) for each change.
      *   *Critical Analysis:* Count reactive changes (b) *without* novel testing (c).
      *   **NEGATIVE VERDICT TRIGGER:** **>2 reactive belt changes (b) lacking novel empirical corroboration (c).** *This signals degenerating problem-shift.*
      *   *Move On:* If changes exist and are classified.

  6.  **"Has the framework successfully predicted *novel* facts or outperformed expectations in a *new* domain? (Assessing *Progress*)**
      *   *Sufficient Answer:* Specific example(s) of surprising or risky prediction later confirmed *or* successful application to genuinely new case/scenario.
      *   **POSITIVE INDICATOR:** **≥1 instance of corroborated novel prediction/successful novel application.** *Signals progressive problem-shift.*
      *   *Move On:* Evidence presented or absence acknowledged.

  7.  **"Weighing Q5 & Q6: Does the *recent trajectory* (last 12-18 months) show net *progressive* (novel gains > ad-hoc patches) or *degenerating* (patches > gains) tendencies?" (Overall *Verdict*)**
      *   *Decision:* Based on Q5 count vs. Q6 presence.
      *   **VERDICT:**
          *   **Continue:** Q6 is YES (progressive), *or* Q6 is NO but Q5 count ≤2 (stable/early stage).
          *   **Re-evaluate:** Q6 is NO *and* Q5 count >2 (degenerating). *Requires justification to continue.*
      *   *Stop & Hand Back:* If Q6 is NO, Q5 count is high (>2), *and* PH (Q4) lacks credible near-term novel tests. Verdict: *Degenerating (Method Unsustainable)*.

  ---

  ### **Case Applications**

  1.  **Invasive Species Model (4 reactive patches, no new tests)**
      *   Q1-Q4: Likely clear core, belt, heuristics.
      *   Q5: **4 reactive changes (b), all lacking (c).** >2 Trigger Hit.
      *   Q6: **NO** novel predictions.
      *   Q7: **Degenerating trajectory.** *Verdict: Re-evaluate.* Note must state: "Project shows degenerating tendency due to multiple untested ad-hoc adjustments. Justification for continuing requires specific, imminent plans for novel testing (PH) outlined in next steps."

  2.  **Transmission Framework (Novel prediction borne out + extension)**
      *   Q5: Changes likely existed, but focus is on Q6.
      *   Q6: **YES** (novel asymptomatic spread prediction confirmed + new host species extension).
      *   Q7: **Clear progressive trajectory.** *Verdict: Continue.* Note: "Project demonstrates progressive problem-shift via successful novel prediction and extension. Next steps should exploit this momentum per PH."

  3.  **Fashionable, Degenerating Model (Defensive re-parameterisations, entrenched network)**
      *   Q5: High count of reactive re-parameterisations (b), lacking (c) – likely >2.
      *   Q6: **NO** recent novel predictions/applications cited (work is defensive).
      *   Q7: **Degenerating trajectory.** *Verdict: Re-evaluate.*
      *   **What to Do:** Be factual and focus on *methodological* health: "The recent modifications appear largely reactive and defensive, lacking novel empirical corroboration, indicating a degenerating problem-shift within the constraints of this project." Acknowledge reality: "However, the project's viability is also constrained by funding/field context. Next steps should, if possible within these constraints, seek opportunities for novel testing or application to demonstrate progressiveness, even if limited." **Your role is diagnosis, not prescribing career suicide.** Document the methodological concern clearly for the student *and supervisor*.

  ---

  ### **Where the Procedure Misfires**

  1.  **Descriptive/Methodological Projects:** Lakatos focuses on *explanatory/predictive* programmes. Projects aiming solely at description, taxonomy, or pure method development lack a predictive "hard core" and novel facts. *Adaptation:* Focus Q4/Q6 on *methodological* novelty/utility (e.g., "Did this new visualization technique reveal previously unseen patterns?").
  2.  **No Rival Programme:** Lakatos relies on comparison. In isolated fields, "progress" is judged internally, risking complacency. *Adaptation:* In Q7, emphasize *absolute* benchmarks for novelty (Q6) more heavily against ad-hocness (Q5).
  3.  **Formalism as Hard Core:** If the core is "use Bayesian stats" or "ABM approach," not a substantive claim, protecting it becomes methodological purity. Degeneracy manifests as forcing formalism onto unsuitable problems via complex belts. *Adaptation:* Q1 must clarify if core is *substantive* or *methodological*. In Q5, scrutinize belt changes for "forcing the formalism" (e.g., adding layers of priors to fit data).
  4.  **Funding/Career Lock-In:** The procedure identifies methodological degeneracy, not feasibility. A "Re-evaluate" verdict might be impractical. *Mitigation:* The note's "What needs to change" section is crucial. Frame it as "To demonstrate progressiveness, the project needs X (novel test, application)." This shifts burden to supervisor/student to justify *how* (or if) X can be done within constraints.
  5.  **Early-Stage Projects:** Insufficient belt modifications (Q5) or time for novel predictions (Q6). *Mitigation:* Verdict defaults to "Continue" if Q5 count is low, but emphasize in notes the *need* for the PH (Q4) to *generate* novel tests soon.

  **Survived:** Core/Belt distinction, Positive/Negative Heuristic concepts, Progressive/Degenerating shift based on novel content vs. ad-hocness.  
  **Weakened:** Rival comparison (replaced by internal novelty benchmarks), Historical/long-term view (snapshot of trajectory).  
  **Lost:** Definitive "refutation" (replaced by "degenerating/unjustified"), Holistic historical assessment of a multi-decade programme.  

  **Core Translation Achievement:** Turns Lakatos's *historical analysis tool* into a *prospective diagnostic checklist* focusing on the *balance between ad-hoc patching and novel empirical gain* within a constrained timeframe, using concepts the student can directly map to their work. The signature forces supervisors to engage with the methodological assessment.
