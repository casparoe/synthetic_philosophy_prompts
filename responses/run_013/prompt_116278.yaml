prompt: |-
  Here's a pattern I keep running into in arguments about persuasion, and I don't have a word for it. Someone is accused of manipulating an audience. The defense is: I said nothing false, I threatened no one, I laid out the relevant facts and let people make up their own minds. The accusation is: yes, but you chose which facts, and in what order, so that the intended conclusion was the only one anyone would reach — and the same facts, differently arranged, would have led elsewhere. Both seem right, and the argument never resolves, because the defense is about the content of what was said while the accusation is about the design of the process that carried it. Instances: a salesperson who mentions only true specifications, sequenced so the customer never thinks to ask about the warranty; a campaign ad built entirely from accurate numbers, selected so the trend reads backwards. In both, nothing asserted is false, yet calling it honest feels wrong.

  Is there an established concept for influencing someone by engineering the process through which they form a belief, while keeping the content you hand them accurate? The usual words — lying, deception, nudging, coercion — each seem to miss, because they target either the truth of the message or the pressure on the person's will, whereas this is about the shape of the path between them. If nothing fits, coin a term and define it: what it covers and leaves out, and how it differs from lying, from a misleading claim that is technically true, from a nudge, and from ordinary emphasis. I care more about where the boundary falls than about what it is called.
reasoning: |-
  Okay, the user is describing a specific pattern in persuasion where someone is accused of manipulation by selectively presenting true facts in a way that leads to a predetermined conclusion. The defense is that they didn't lie or coerce, but the accusation is about the strategic arrangement of information. They want a term for this concept and a clear boundary between this and other forms of influence.

  First, I need to understand the core issue. The user mentions examples like a salesperson omitting warranty details or a campaign ad presenting stats to reverse a trend. The key elements are truthful content but engineered context and sequence. The user emphasizes that existing terms like lying or nudging don't fit because they focus on falsehood or coercion, whereas this is about the structure of information flow.

  The user's deeper need might be to articulate this concept in arguments or academic discussions. They might be involved in ethics, psychology, or communication fields. They need a precise term to avoid unresolved debates. They also want clear distinctions from related concepts, which shows they value precise categorization for practical application.

  I recall similar concepts. Framing effects in psychology show how presentation affects decisions. Spin is related but often involves biased language, not just selective facts. Information asymmetry is structural, not necessarily intentional manipulation. Choice architecture is about physical arrangement, not information sequencing. 

  The term "information design" comes to mind, but it's too neutral. "Rhetorical engineering" or "cognitive steering" might work, but they're not established. "Truthful by design" is descriptive but not a noun. "Information gerrymandering" is a metaphor from politics but might be obscure.

  "Agenda-setting" in media theory focuses on issue salience, not sequence. "Priming" affects accessibility of thoughts but isn't about logical pathways. The best fit might be "selective truth-telling," but it's not a single term.

  Considering coining a term: "Pathcraft" combines path and craft, emphasizing the engineered journey. "Sequential framing" highlights the order. "Cognitive channeling" suggests directing thought processes. "Persuasive sequencing" is clear but wordy.

  Defining boundaries is crucial. Lying involves falsehoods. Misleading claims use technically true but deceptive statements. Nudging alters the choice environment without restricting options. Ordinary emphasis prioritizes without hiding alternatives. The key differentiator here is the intentional structuring of information flow to create an inevitable conclusion while using only true facts.

  The user probably needs this for ethical labeling. They want to call out manipulation without accusing someone of lying. A clear definition helps in debates by shifting focus from content to process. Terms like "pathcraft" or "sequencing" might resonate, but explaining the concept thoroughly matters more than the name itself.
answer: |-
  This is a fascinating and nuanced problem in persuasion ethics. You're right that existing terms don't quite capture this specific tactic. **The established concept closest to your description is "framing," but it's often too broad.** Let's define a more precise term and its boundaries:

  **The Concept: Process-Driven Persuasion via Information Architecture (Coined Term: "Pathcraft")**

  *   **Definition:** **Pathcraft** (or **Sequential Framing**) is the intentional design of the *sequence, selection, and context* of *truthful* information presented to an audience, specifically engineered to guide them towards a predetermined conclusion by exploiting predictable cognitive processes, while avoiding overt falsehoods or coercion.
  *   **Core Mechanism:** It manipulates the *inference pathway* rather than the raw data points themselves. It relies on:
      *   **Primacy/Recency Effects:** Placing key supportive facts first/last.
      *   **Salience Manipulation:** Making supportive facts prominent, downplaying or omitting inconvenient ones *without denying their existence*.
      *   **Contextual Anchoring:** Framing facts within a specific narrative or comparison point.
      *   **Exploiting Cognitive Bias:** Leveraging confirmation bias, the availability heuristic, or the representativeness heuristic by controlling the information flow.
      *   **Controlled Revelation:** Revealing facts in an order that builds momentum towards the desired conclusion before counterpoints can be considered effectively.

  **Boundaries & Distinctions:**

  1.  **Lying / Fabrication:**
      *   **Difference:** Pathcraft uses *only true facts*. Lying involves asserting falsehoods.
      *   **Boundary:** If *any* presented statement is demonstrably false, it's lying, not Pathcraft. Pathcraft lives entirely within the realm of selective truth.

  2.  **Misleading Claim (Technically True):**
      *   **Difference:** A misleading claim (e.g., "This car gets 30 MPG... on the highway, while city is 15 MPG") is a *single statement* designed to deceive through omission or implication within that utterance. Pathcraft is a *systematic process* involving *multiple* truthful statements arranged strategically over time or space.
      *   **Boundary:** Pathcraft focuses on the *architecture of the entire informational journey*, not the deceptive potential of a single phrase. It's about the forest, not just one crooked tree.

  3.  **Nudging (Behavioral Economics):**
      *   **Difference:** Nudging alters the *choice architecture* of the *environment* (e.g., making healthy food the default option, changing font size on forms). It aims to influence *behavior* often unconsciously and without restricting choices. Pathcraft specifically targets *belief formation* by designing the *informational input* itself, often engaging conscious reasoning (albeit guided). It engineers the *cognitive path* to the belief.
      *   **Boundary:** Nudging changes the *context in which choices are made*. Pathcraft changes the *information used to form the beliefs underpinning choices*. If the persuasion comes from rearranging the physical/social environment, it's nudging. If it comes from rearranging the sequence and selection of factual statements, it's Pathcraft.

  4.  **Coercion / Threats:**
      *   **Difference:** Coercion involves explicit or implicit threats of negative consequences for non-compliance. Pathcraft relies solely on the persuasive power of the *information structure*, not fear or force.
      *   **Boundary:** If there's any element of "or else..." (loss, punishment, deprivation), it's coercion. Pathcraft persuades through engineered insight, not intimidation.

  5.  **Ordinary Emphasis / Advocacy:**
      *   **Difference:** All advocates emphasize points favorable to their case. Ordinary emphasis is transparent about its purpose and exists within a context where the audience reasonably expects advocacy *and* has access to counterpoints or the cognitive space to seek them. Pathcraft aims for *stealth* and *inevitability* – the audience feels they reached the conclusion independently based on "all the facts" presented, unaware of the engineered path and missing information.
      *   **Boundary:** Does the speaker/authorship imply a duty of balanced disclosure (e.g., journalist, educator, fiduciary) or is adversarial advocacy expected (e.g., lawyer, debater)? Does the context allow/encourage counter-inquiry? Pathcraft often occurs where the audience *trusts* the presenter to be informative or helpful (salesperson, trusted pundit, "explainer") rather than explicitly adversarial. The key is whether the *design* is intended to *preclude* the audience's consideration of reasonable alternatives by controlling the informational flow, not just highlighting one side.

  **What Pathcraft Covers & Leaves Out:**

  *   **Covers:**
      *   Strategic sequencing of true facts to build momentum.
      *   Selective omission of relevant but inconvenient truths *without lying about their existence*.
      *   Presenting facts in a context that heavily implies a specific interpretation.
      *   Exploiting cognitive biases through information structure.
      *   Creating a false sense of independent conclusion discovery.
  *   **Leaves Out:**
      *   Actual false statements (lying).
      *   Direct threats or rewards (coercion/bribery).
      *   Altering the physical choice environment (nudging).
      *   Biased language/spin *within* statements (closer to misleading claims).
      *   Honest advocacy with clear bias where counterpoints are readily available or expected.

  **Why "Pathcraft"?**

  *   **Path:** Emphasizes the engineered journey of belief formation.
  *   **Craft:** Highlights the deliberate design and skill involved.
  *   It captures the essence of *shaping the cognitive pathway* using true information as the raw material.

  **The Core Ethical Issue:**

  Pathcraft exploits the gap between *truthfulness of components* and *manipulation of the inference process*. It undermines genuine informed consent by creating an *illusion* of independent reasoning based on complete information, when the reality is a carefully constructed path leading to one predetermined destination. The defense focuses on the bricks (truthful facts), while the accusation focuses on the deceptive blueprint (the designed path). Recognizing Pathcraft helps articulate why "true facts ≠ honest communication" when the process is intentionally designed to mislead through structure rather than substance.
