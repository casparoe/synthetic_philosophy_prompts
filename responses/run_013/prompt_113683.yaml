prompt: |-
  I'm a second-year PhD student writing a seminar paper for a course on non-classical logic, and I've arrived at an argument that dialetheism is internally unstable — but I suspect it's the kind of argument that will make the people in the room wince, so I'd like to know whether it survives contact with someone who actually knows the area. The argument is this. The dialetheist says that some sentences are both true and false, and insists that this does not make every sentence true. When I ask how the slide into triviality is blocked, I'm told that the standard systems keep negation doing exactly what it does in classical logic — 'not A' is true just in case A is false, and false just in case A is true — and give up only the step from 'A or B' together with 'not A' to 'B'. But this seems to me to be exactly backwards, and in a way that matters. If negation really retains its classical truth conditions, then in a genuine contradiction both A and not A are true; and a sentence and its negation both being true is precisely the situation that licenses the inference to any sentence whatever, since the truth of not A tells me A is false and the truth of A tells me A is true, and from there nothing restrains me from concluding that the moon is made of cheese. So either the dialetheist stops treating negation as classical negation — reading 'not' as an expression of denial that has no truth-functional profile, or adopting a semantics on which truth and falsity are not exclusive — or else the logic is a mere fragment of classical logic and the contradictions it admits can never actually be used in reasoning. The first option looks to me like incoherence, and the second like a change of subject. Which is it? And if there is a third option, what exactly is doing the work that I take negation's truth conditions to be doing?

  To put the worry concretely: suppose my toy theory contains just the two sentences 'the patient is allergic to penicillin' and 'the patient is not allergic to penicillin', and I want to reason from it about which antibiotic to prescribe. On the story I've been told, the theory is inconsistent without being trivial, and the reason I can't infer just anything is that the disjunctive syllogism step is unavailable. But by my lights that cannot be the explanation: if 'not' has its classical meaning, the step is licensed by the truth conditions themselves, and blocking it is not weakening the logic but quietly replacing the connective. I'd be grateful for a diagnosis rather than a reading list — in particular, I'd like to know whether the dilemma I've set up is exhaustive, and if it isn't, where the seam in my reasoning actually lies.
reasoning: |-
  Okay, this is a sharp challenge from a PhD student working on dialetheism. They're arguing that dialetheism can't maintain classical negation without collapsing into triviality, and they've framed it as a dilemma: either negation isn't really classical, or the logic is just a fragment where contradictions are inert. Their penicillin example makes it visceral - how can we reason medically with a true contradiction if negation behaves classically?

  First, I need to disentangle two threads they're weaving together: the truth-conditional licensing of explosion versus the inferential rule. They're absolutely right that in classical logic, the truth of both A and ¬A would make every interpretation satisfy every formula - that's semantic explosion. But dialetheists like Priest don't accept that semantic consequence relation. The key move is rejecting that truth and falsity are exclusive. 

  When they say "the truth of not A tells me A is false", that's where the dialetheist balks. In paraconsistent logics, "false" doesn't mean "not true" - they're separate statuses. So the classical equivalence between "¬A is true" and "A is false" gets broken. That's not changing negation's truth table per se (it can still be ¬T=F, ¬F=T), but rather decoupling truth/falsity from being exhaustive/exclusive. 

  The penicillin example actually helps expose this. For a dialetheist, when both "allergic" and "¬allergic" are true, it doesn't mean "allergic" is also false in the classical sense - it means the patient's allergy status is overdetermined (maybe conflicting test results). So "¬allergic" being true doesn't preclude "allergic" being true. That's why we can't infer arbitrary antibiotics - the inference rules preserve non-triviality precisely because explosion isn't built into the semantics.

  Their dilemma misses this third option: keep negation truth-functional but reject bivalence. The "seam" in their reasoning is assuming truth and falsity must be exclusive - which is exactly what dialetheists deny. The work is being done by the revised notion of semantic consequence, not by muting negation.

  I should also address their worry about "inert" contradictions. In relevant logics like LP, you can still use contradictions in controlled ways - e.g., from A∧¬A you can infer A, and ¬A, but not B. So they're not epistemically useless, just non-explosive. 

  This is actually a sophisticated version of the "just change the logic" objection, but it underestimates how deep the revision goes - it's not just blocking DS but rethinking the relationship between truth and consequence. The student gets credit for seeing that semantic explosion can't be avoided if classical truth conditions hold, but they haven't reckoned with dialetheists rejecting the classical meta-logic those conditions live in.
answer: |-
  Your argument is incisive and hits a core tension in dialetheism, but there *is* a third option—and the seam in your reasoning lies in an unexamined assumption about the relationship between **truth conditions**, **falsity conditions**, and **logical consequence**. Dialetheists (like Priest) don't merely block disjunctive syllogism (DS) *inference*; they revise the **underlying semantics** to decouple truth/falsity from exhaustiveness/exclusivity. Let's diagnose step by step.

  ### Your Dilemma vs. The Dialetheist's Actual Move
  1. **Your First Horn (Non-Classical Negation)**:  
     You argue dialetheists must abandon classical truth conditions for negation. But dialetheists *retain* the classical truth table:  
     - ¬A is **true** iff A is **false**.  
     - ¬A is **false** iff A is **true**.  
     *This is preserved in logics like LP (Logic of Paradox).*

  2. **Your Second Horn (Contradictions are Inert)**:  
     You contend that without DS, contradictions are "unusable." But dialetheists reject that *all* reasoning from contradictions requires DS. They can still use other rules (e.g., adjunction, simplification) *without* explosion.  

  3. **The Third Option: Rejecting Bivalence & Re-defining Consequence**  
     Dialetheists deny that truth and falsity are **exclusive** (while keeping them exhaustive). Crucially, they redefine **logical consequence**:  
     - **Classical Consequence**: Γ ⊨ B iff whenever all premises in Γ are **true**, B is **true**.  
     - **Dialetheist Consequence (e.g., LP)**: Γ ⊨ B iff whenever all premises in Γ are **at least true** (i.e., true only, or both true and false), B is **at least true**.  
     This blocks explosion: if A is both true and false, and ¬A is both true and false, B need not be true (or true-and-false).  

  ### Why Semantic Explosion is Blocked
  - In classical logic, if A is **true**, then ¬A must be **false** (by exclusivity).  
  - In dialetheism, A can be **both true and false**, so ¬A is **both true and false** (since if A is false, ¬A is true; if A is true, ¬A is false).  
  - Crucially: "A is false" does **not** imply "A is not true." Dialetheists sever the link:  
    - "A is false" means ¬A is true,  
    - but A can *also* be true (i.e., both hold).  
  - Thus, your inference chain fails:  
    > "The truth of ¬A tells me A is false, and the truth of A tells me A is true"  
    This assumes "A is false" excludes "A is true." Dialetheists reject that assumption.  

  ### Your Penicillin Example Revisited
  - Suppose both "Allergic" (A) and "¬Allergic" (¬A) are **true** (and, for dialetheists, both may *also* be false).  
  - You want to infer "Prescribe antibiotic X" (B).  
  - **Classical DS would allow**: A ∨ B and ¬A imply B.  
  - **Dialetheist response**:  
    1. You *can* infer A ∨ B (if you accept A, you accept A ∨ B).  
    2. You *can* accept ¬A.  
    3. But you **cannot infer B** via DS, because DS is invalid in LP.  
  - **Why?** In a model where A is both true and false, and B is *false only*, the premises A ∨ B and ¬A are **at least true** (since both are true, even if also false), but B is **not at least true**.  
  - Reasoning isn't paralyzed: You might still prescribe a non-penicillin antibiotic based on other rules (e.g., "If allergic, avoid penicillin" and "If not allergic, penicillin is safe" – but here both antecedents hold, so caution may prevail).

  ### Where the Seam Lies: Truth Conditions vs. Consequence
  Your argument assumes that classical **truth conditions** for negation *entail* classical **consequence** (especially explosion). Dialetheists break this link by:  
  - Keeping the truth-functional definition of ¬,  
  - Denying that truth/falsity are exclusive (so A being false doesn't preclude it being true),  
  - Revising the definition of validity to tolerate "truth-gluts" without collapsing.  

  **Key Insight**: The dialetheist’s "not" *is* classical in its truth table but *non-classical in its interaction with consequence*. This isn’t "quietly replacing the connective" – it’s explicitly revising the metatheory of logical consequence to accommodate contradictions without triviality.

  ### Is the Dilemma Exhaustive?
  **No**. Your horns assume that classical truth conditions must enforce classical consequence. Dialetheists reject this by:  
  - **Option 3**: Retain classical truth tables for connectives but adopt a **paraconsistent semantics for consequence** (e.g., using many-valued models or non-adjunctive valuations).  
  The "work" is done by redefining what it means for premises to *entail* a conclusion – not by redefining negation’s truth conditions.

  ### Conclusion
  Your argument fails to land because dialetheism isn’t just "classical logic minus DS." It rebuilds the semantics of consequence from the ground up, decoupling truth/falsity from exclusivity. **Negation’s truth conditions remain classical, but their implications for inference change** because the dialetheist’s "false" does not imply "not true." This isn’t incoherent – it’s a coherent, non-trivial system where contradictions are *contained* by a revised account of validity.  

  *For your seminar*: Press the dialetheist on how their semantics handles practical reasoning (e.g., medical decisions) without DS. The real tension isn’t internal instability but whether such a logic can underwrite real-world action. That’s where the room might wince.
