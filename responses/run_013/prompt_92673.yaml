  ### In-Class Simulation: The Wildlife Management Committee  
  **Objective:** Participants experience Nozick’s two-tier structure—human interests as inviolable constraints, animal interests as aggregable costs—through a policy-decisions exercise. They confront the tension between humane concern for animals and the moral downgrading of animal lives to mere costs.  

  **Roles & Materials:**  
  - **Roles:**  
    - **Human Rights Ombudspersons (2 students):** Enforce human constraints. Can veto any policy violating human rights.  
    - **Animal Welfare Advocates (3 students):** Calculate and present total animal harm (in "Animal Harm Units" or AHUs).  
    - **Policy Analysts (9 students):** Calculate human benefits (in "Human Benefit Units" or HBUs). Advise on approval if net benefit >0 (HBUs > AHUs).  
    - **Chair (Instructor):** Facilitates, enforces rules, and tallies final decisions.  

  - **Materials:**  
    - Rule sheet (for all).  
    - 3 Case packets (distributed sequentially).  
    - Calculators (optional).  
    - Whiteboard for tallies.  

  **Rule Sheet (Summary):**  
  > "As the Wildlife Management Committee, you must decide on policies using these rules:  
  > 1. **HUMAN CONSTRAINT:** Policies causing human death/serious harm are *automatically rejected*.  
  > 2. **ANIMAL AGGREGATION:** Animal suffering is summed in AHUs.  
  > 3. **DECISION RULE:** If no human constraint is violated, approve policies only if HBUs > AHUs."  

  **Timeline (90 min):**  
  1. **Intro (5 min):** Distribute roles/rules. Chair: "We are a committee deciding wildlife policies. Apply the rules strictly—no debate on fairness."  
  2. **Case 1: Highway Expansion (20 min)**  
     - **Scenario:** Build a highway saving 10,000 commuters 1 hour/day (HBU: 100,000). Kills 100 deer (AHU: 500) and 1 homeless person (non-consenting) in construction.  
     - **Process:**  
       - Ombudspersons: Veto (human death).  
       - Outcome: Automatic rejection.  
       - *Tension Point:* Human life halts massive human/animal gains.  
  3. **Case 2: Research Facility (25 min)**  
     - **Scenario:** Build a lab creating life-saving drugs (saves 5 humans/year; HBU: 50,000). Tests cause chronic pain to 1,000 mice (AHU: 10,000). No human harm.  
     - **Process:**  
       - Ombudspersons: No veto.  
       - Advocates: Sum AHUs (10,000).  
       - Analysts: Sum HBUs (50,000). Net = +40,000 → Approve.  
       - *Tension Point:* Animal suffering is "outweighed" despite severity.  
  4. **Case 3: Luxury Fur Farm (25 min)**  
     - **Scenario:** Farm employs 100 locals (HBU: 10,000) and supplies luxury goods (HBU: 15,000). Causes intense suffering to 5,000 minks (AHU: 50,000). No human harm.  
     - **Process:**  
       - Ombudspersons: No veto.  
       - Advocates: Sum AHUs (50,000).  
       - Analysts: Sum HBUs (25,000). Net = -25,000 → Reject.  
       - *Tension Point:* Rejection feels "humane," but animal lives are still reduced to costs.  
  5. **Debrief (15 min):** Structured discussion mapping the activity to theory.  

  **Scoring/Payoff:**  
  - **Ombudspersons:** "Win" if they enforce constraints correctly.  
  - **Advocates/Analysts:** "Win" if calculations align with rules.  
  - **No individual incentives;** focus on experiencing the system’s moral logic.  

  **Predictable Problems & Solutions:**  
  - **Problem:** Students resist rules ("Why can’t we count animal lives like humans?").  
    - **Solution:** Chair: "Your role is to apply the rules, not debate them. We’ll discuss later."  
  - **Problem:** Advocacy roles (e.g., Animal Welfare) emotionally reject AHU calculations.  
    - **Solution:** Assign roles randomly. Chair: "Your task is to quantify—not judge—the units."  
  - **Problem:** Time crunch on calculations.  
    - **Solution:** Provide pre-made HBU/AHU tables; limit discussion to 5 min/case.  

  **What the Activity Cannot Reproduce:**  
  The simulation cannot replicate the **foundational moral weight** of Nozick’s constraints. Students experience a *policy rule*, but the profound deontological "inviolability" of humans versus animals remains an abstract premise. The activity operationalizes the distinction without justifying it, leaving the "why humans?" boundary problem unresolved until debrief.  

  **Debrief (Key Questions):**  
  1. **Constraints vs. Aggregation:**  
     - "In Case 1, we rejected the highway due to one human death. Why wasn’t the massive human/animal benefit considered?"  
     - → *Link:* Human constraints are "side-constraints" (Nozick)—not tradable. Animals? "Costs" summed like utilitarian gains.  
     - "In Cases 2-3, how did it feel to approve/reject based on HBUs vs. AHUs? Did animal suffering feel like a ‘violation’ or a ‘cost’?"  

  2. **Boundary Problem (Humans vs. Animals):**  
     - "What trait justifies giving humans absolute protection but animals none? Intelligence? Autonomy? Species?"  
     - → *Prompt:* "Did the rules *assume* this boundary, or did you *discover* a justification?"  

  3. **Policy Rule vs. Foundational Moral Proposal:**  
     - "Was this a practical policy tool, or a deep moral truth? Could you use this system in real life? Why/why not?"  
     - → *Link:* Nozick presents this as foundational (humans as "ends"), but the simulation shows it as a bureaucratic tool—highlighting the gap between principle and application.  

  4. **Tension Reflection:**  
     - "When did you feel conflicted? Did aggregating animal interests *feel* like a betrayal, even when ‘humane’ (e.g., rejecting the fur farm)?"  
     - → Emphasize: The system prevents human atrocities but reduces animal suffering to arithmetic—a "disturbing implication" of Nozick’s view.  

  **Outcome:** Students encounter the two-tier structure viscerally before naming it, priming them to critique Nozick’s boundary problem and the moral stakes of constraints vs. aggregation.
