  ### Decision Tree: What Makes One Country "More Liberal" Than Another?  
  *Start at the top and follow the questions based on your intuitive views.*  

  **Question 1: Should the answer depend on which group of people we focus on (e.g., citizens, immigrants, minorities)?**  
  - **Yes** → **Leaf: Subject-relative reading**  
    - **Criterion**: More liberal for a specific group (e.g., citizens, residents, minorities, immigrants).  
    - **Evidence**: Differential treatment of that group (e.g., rights, protections, barriers).  
    - **Most awkward commitment**: The answer reverses when switching groups (e.g., liberal for citizens but restrictive for immigrants).  
    - *Handles Case 2 and Case 5: A country can be liberal for one group (e.g., citizens) but not another (e.g., immigrants or Sámi).*  

  - **No** → Proceed to Question 2.  

  **Question 2: Is the comparison about written laws or real-world practices?**  
  - **Written laws** → Proceed to Question 3.  
  - **Real-world practices** → Proceed to Question 4.  

  **Question 3 (written laws): Which aspect of the laws matters most for liberalism?**  
  - **How much the state leaves people alone** → **Leaf: Limited-government (negative liberty) reading**  
    - **Criterion**: Minimal state interference in personal choices (e.g., property, speech).  
    - **Evidence**: Statutes restricting government overreach (e.g., bill of rights).  
    - **Most awkward commitment**: Ignores private oppression (e.g., corporations or social groups dominating others).  
    - *Handles none of your cases directly but underpins Case 3 if courts uphold non-interference.*  
  - **How well people are protected from arbitrary power** → **Leaf: Republican reading**  
    - **Criterion**: Freedom as non-domination (e.g., checks on state/majority power).  
    - **Evidence**: Constitutional safeguards, independent courts, anti-discrimination laws.  
    - **Most awkward commitment**: May justify a strong state to prevent private domination, conflicting with minimal government.  
    - *Handles Case 3: Courts blocking majority votes protect against domination.*  
  - **How many private behaviours are legally allowed** → **Leaf: Permissiveness reading**  
    - **Criterion**: Breadth of permitted conduct (e.g., drugs, alcohol, speech, religion, sexuality).  
    - **Evidence**: Laws deregulating personal life (e.g., legal sex work, drug decriminalisation).  
    - **Most awkward commitment**: Overlooks whether people feel able to use these liberties (e.g., due to social stigma).  
    - *Handles none of your cases directly but contrasts with Case 4.*  
  - **A mix of factors needing a single score** → **Leaf: Aggregate-index reading (de jure)**  
    - **Criterion**: High average score across multiple legal freedoms (e.g., combining non-interference, non-domination, permissiveness).  
    - **Evidence**: Composite indices (e.g., Freedom House scores).  
    - **Most awkward commitment**: Arbitrary weighting (e.g., free speech weighted equally as property rights).  
    - *Handles Case 5: Indigenous rights deficits lower the aggregate score.*  
  - **No single aspect dominates; it depends on the issue** → **Leaf: Partial-order reading (de jure)**  
    - **Criterion**: Incomparability without weighting—countries may excel in different areas (e.g., one has freer speech but stricter drugs).  
    - **Evidence**: Country A better in some liberties, Country B in others.  
    - **Most awkward commitment**: No verdict possible without prioritising one liberty over others.  
    - *Handles Case 5: Countries may be liberal overall but illiberal toward Sámi, creating incomparability.*  

  **Question 4 (real-world practices): Which aspect of practices matters most?**  
  - **How fairly laws are enforced** → **Leaf: Law-in-action reading**  
    - **Criterion**: Alignment between laws and enforcement (e.g., police/courts apply rules consistently, not selectively).  
    - **Evidence**: Disparities in arrests, sentencing, or bureaucratic implementation.  
    - **Most awkward commitment**: A country with illiberal laws but lax enforcement may appear liberal.  
    - *Handles Case 1: Liberal statutes ignored by authorities make the country less liberal.*  
  - **How much social pressure restricts freedoms** → **Leaf: Social-practice reading**  
    - **Criterion**: Effective freedom from coercion (e.g., societal attitudes enable people to act without fear).  
    - **Evidence**: Surveys on discrimination, media reports of stigma, minority experiences.  
    - **Most awkward commitment**: A country with liberal laws can be illiberal if social norms silence dissent.  
    - *Handles Case 3 and Case 4: Social pressure or majority hostility undermines liberties, even if laws/courts protect them.*  
  - **A mix of factors needing a single score** → **Leaf: Aggregate-index reading (de facto)**  
    - **Criterion**: High average score across lived freedoms (e.g., enforcement fairness, social tolerance).  
    - **Evidence**: Indices incorporating real-world data (e.g., Varieties of Democracy project).  
    - **Most awkward commitment**: Hides trade-offs (e.g., high free-speech enforcement but low drug tolerance).  
    - *Handles Case 5: Poor treatment of Sámi lowers the aggregate score.*  
  - **No single aspect dominates; it depends on the issue** → **Leaf: Partial-order reading (de facto)**  
    - **Criterion**: Incomparability without weighting—countries may excel in different practices (e.g., one has fair enforcement but high social pressure).  
    - **Evidence**: Country A better in some practices, Country B in others.  
    - **Most awkward commitment**: No verdict without stipulating which practice matters most.  
    - *Handles Case 1 and Case 4: A country with good laws but bad enforcement/social pressure may be incomparable.*  

  **Question 2a (if struggling with Question 2): Is the very idea of "liberal" too fuzzy for a clear answer?**  
  - **Yes** → **Leaf: Indeterminate reading**  
    - **Criterion**: No objective standard—liberalism is contested (e.g., clashes between non-interference and non-domination).  
    - **Evidence**: Endless debate without resolution; both countries have valid claims.  
    - **Most awkward commitment**: The question is unanswerable by design.  
    - *Handles all cases implicitly: Contested criteria make comparisons like your argument circular.*  

