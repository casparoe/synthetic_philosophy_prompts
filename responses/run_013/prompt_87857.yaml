esidents, minorities or would-be immigrants; the reading on which the comparison is a partial order, so that the two countries are simply incomparable without a stipulated weighting; and the reading on which the question has no determinate answer because the criteria for applying the term are themselves contested. I would far rather have eight to twelve leaves that are genuinely distinct than twenty that blur into one another.

