  ### Unoccupied Combinations and Inseparable Pairs  
  - **Unoccupied combinations**:  
    - **Subject-relative + partial-order**: Logically coherent but unattractive. Why? It implies incomparability *within* a group (e.g., "For immigrants, Sweden is better on speech but worse on religion, so no verdict"), which is rarely defended—people usually prioritise issues.  
    - **Permissiveness + law-in-action**: Incoherent. Permissiveness focuses on laws, law-in-action on practices. One cannot logically demand "lax enforcement of broad permissions" as a unified criterion without collapsing into aggregate-index.  
    - **Republican + social-practice**: Unexplored. Republicanism (non-domination) is typically tied to institutions (de jure), while social-practice addresses societal coercion. No major position combines them, though they overlap.  

  - **Inseparable pairs (no honest question splits them)**:  
    - **Limited-government vs. permissiveness**: *Substantive difference*. Both are de jure but focus on distinct criteria (non-interference vs. breadth of allowances). No question separates them cleanly without theory, as they often align in practice (e.g., low state interference → more permissions).  
    - **Aggregate-index (de jure) vs. aggregate-index (de facto)**: *Emphasis difference*. Both aggregate, but one uses laws, the other practices. The evidence differs, but the core method is identical.  
    - **Republican vs. limited-government**: *Substantive difference*. Republicanism includes protection from private power, while limited-government focuses solely on state power. No simple question splits them without invoking theory (e.g., "Should liberalism constrain corporations?").  

