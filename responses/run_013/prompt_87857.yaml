  ### How to Use This Tree  
  1. **Start at Question 1** and answer based on your intuition (e.g., "Do I care about immigrants or just citizens?"). Move down the tree.  
  2. **If you land in two leaves at once**, your view combines positions. For example:  
     - Believing **both** subject-relative and permissiveness → Choose subject-relative (it defers to group-specific criteria, which could include permissiveness).  
     - Believing **both** law-in-action and social-practice → Choose aggregate-index (de facto) (it combines enforcement and societal factors).  
     The tree forces a choice at branches, so pick the closest fit or note the tension.  
  3. **The tree never issues a verdict** (e.g., "Sweden is more liberal"). It gives *conditional* verdicts: *If* you adopt a leaf’s criterion and evidence, *then* the comparison can be settled. For example:  
     - At **limited-government**, compare laws on state interference.  
     - At **subject-relative**, specify a group (e.g., "For minorities, look at anti-discrimination laws").  
  4. **Use it to map disagreements**: In your argument, you and your friend may be on different leaves (e.g., she in aggregate-index, you in permissiveness). The tree clarifies this without resolving who is "right."  

  This taxonomy isolates the roots of your stalemate: divergent criteria for "liberal." By classifying positions, it turns abstract debate into a structured exploration of assumptions.
