  Expected utility of turning off: EU_turn_off = 4(1-p)/(2-p)

  Expected utility of continuing: EU_continue = [1/(2-p)] * V + [(1-p)/(2-p)] * 1

  Then V = p * EU_turn_off + (1-p) * EU_continue

  But EU_continue depends on V, so it's a fixed point.

  Since he chooses to turn off with prob p, but this p is the same at both points.

  The overall expected utility from the start.

  From the start, with plan p:

