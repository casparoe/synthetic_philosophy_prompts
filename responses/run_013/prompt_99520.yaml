  A has a point that the driver is worse off because of the absent-mindedness; he can't achieve 4. But the reasoning part: A says it doesn't show reasoning is flawed, but in this case, with the fixed p, he does reason with expected utility, but it's self-referential.

  But A is right that the flaw is in the situation, not necessarily in the reasoning method, but the reasoning method has to account for the self-locating uncertainty.

