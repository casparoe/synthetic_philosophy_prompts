    - Not turn off at second with prob 1-p, utility 1

  So expected utility: p * 0 + (1-p) * [p * 4 + (1-p) * 1] = (1-p) [4p + (1-p)] = (1-p)(4p + 1 - p) = (1-p)(3p + 1)

  Simplify: (1-p)(3p + 1) = 1*3p +1*1 - p*3p - p*1 = 3p + 1 - 3p² - p = 2p + 1 - 3p²

  (1-p)(3p + 1) = 1*(3p+1) - p*(3p+1) = 3p + 1 - 3p² - p = 2p + 1 - 3p²

  Yes, so EU(p) = 2p + 1 - 3p²

  To maximize this, take derivative: dEU/dp = 2 - 6p

  Set to zero: 2 - 6p = 0 => 6p = 2 => p = 1/3

  Second derivative -6 <0, so maximum.

  EU at p=1/3: 2*(1/3) +1 - 3*(1/9) = 2/3 + 1 - 1/3 = (2/3 - 1/3) +1 = 1/3 +1 = 4/3

