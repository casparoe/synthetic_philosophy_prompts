  But the value at S2 depends on what he does at S2, which depends on p.

  This is where the fixed point comes in.

  The value of continuing must be the same as the value he expects to get when he arrives at the next decision point, which is the same as the value at the current decision point because the turnoffs are identical and he uses the same p.

