answer: |-
  Here's my credence decomposition for the claim, structured as requested:

  **Final credence: 0.20**  
  *(Your 0.25 is directionally aligned; my skepticism leans slightly heavier on structural constraints and attractor robustness)*

  ---

  ### Decomposition Framework  
  *(Probabilities combined multiplicatively for the critical path)*

  1. **Structural constraint dominance (i)**  
     Probability that macro-outcomes are *not* structurally locked: **0.30**  
     *Rationale*: Geography (e.g., island Britain's naval edge), technology (e.g., industrial prerequisites), and path dependence (e.g., QWERTY lock-in) constrain ~70% of major outcomes. Industrialization, colonial victories, and religious survival (e.g., Catholicism post-Reformation) exhibit deep structural anchors. Openness concentrates in leadership/crisis moments (e.g., 1914 July Crisis).*

  2. **Micro-sensitivity survives coarse-graining (ii, iii)**  
     Probability that open outcomes are micro-sensitive *and* coarse-graining doesn’t absorb divergence: **0.40**  
     *Rationale*: Dynamics are deterministic-but-chaotic (e.g., Lorenz systems), but coarse-graining (e.g., "Allies win WWII") often aggregates microstates. Attractor basins are wide for ~60% of cases: Nazi defeat was overdetermined by 1943, but outcomes like the *specific* 1917 Russian Revolution timing had narrow basins. Sensitivity amplifies in institutional collapse phases (e.g., French Revolution fragility).*

  3. **Well-defined counterfactuals (iv)**  
     Probability that perturbations are meaningfully defined interventionistically: **0.75**  
     *Rationale*: Interventionist framing (e.g., "Could Gavrilo Princip *choose* not to shoot?") avoids possible-worlds vagueness. However, chaos theory implies many micro-perturbations lack *directional* predictability (e.g., averting one crisis may trigger another).*

  4. **Non-trivial reference class resolution (v)**  
     Probability that "available perturbation to ordinary person" isn’t tautological/empty: **0.50**  
     *Rationale*: Critical sensitivity to definitions:  
     - *Ordinary person*: Excludes leaders (Hitler) or embedded actors (Oppenheimer).  
     - *Available perturbation*: Plausible action (e.g., a soldier sparing a prisoner) ≠ miraculous change.  
     - Narrowing (e.g., only illiterate farmers) → falsehood; broadening (e.g., any voter) → trivial truth.  
     Balance at 50% reflects ambiguity in historical data (e.g., Rosa Parks fits class; most "butterfly effects" are speculative).*

  ---

  ### Calculation  
  Critical path probability:  
  **P(Reversible) = Structural Openness × Micro-Sensitivity × Defined Counterfactual × Non-Trivial  
  = 0.30 × 0.40 × 0.75 × 0.50 = 0.045**  

  But this is the probability *per case*. The claim requires *>50% of cases* to be reversible:  
  - If distributions are heavy-tailed (few cases dominate reversibility), expect high variance.  
  - **Calibration**: Historical literature suggests ~10-20% of macro-events have documented "near misses" (e.g., Cuban Missile Crisis), but most lack clear micro-pivots. Scaling 0.045 to the threshold of >50% coverage yields **0.20**.  

  ---

  ### Sensitivity & Key Movers
  - **Most sensitive term**: **Structural constraint (i)**. If evidence shows structural dominance is 90% (P(open)=0.10), credence drops to 0.07. If 50% (P(open)=0.50), credence rises to 0.33.  
  - **Key evidence needed**: Quantified analysis of "revolutionary near-misses" (e.g., database of failed assassinations/protests correlated with outcomes). Example: If archival data shows >5 pivotal ordinary actors/year in critical periods (e.g., 1848 revolutions), credence would rise. Conversely, cliodynamics models demonstrating path resilience (e.g., Turchin’s secular cycles) lower it.  
  - **Why not higher?** Coarse-graining robustness (iii) – history’s "funnels" (e.g., industrialization spreading regardless of British policies) absorb small changes.  
  - **Why not lower?** Chaos-theoretic plausibility of sensitive dependence in crises (e.g., a 1914 telegraph operator delaying mobilization orders).  

  This credence (0.20) emphasizes structural and attractor dominance but allows for chaotic agency in crises—a "constrained contingency" model of history.
