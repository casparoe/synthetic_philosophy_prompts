answer: |-
  You're wrestling with the core question of **moral standing** or **hypocrisy** vs. **expertise** vs. **sincerity**. Your gut isn't a mess—it's detecting nuances a rigid rule misses. Here's the principle I commit to:

  **A person gains moral standing to criticize or warn about a specific harm when they demonstrate credible understanding of that harm's impact, regardless of their own past or present actions—but hypocrisy can undermine the perceived sincerity or authority of their message, without necessarily invalidating its truth.**

  This principle explains *why* experience ("having-been-there") sometimes grants standing (Priya, your brother) and sometimes doesn't (smoking uncle lecturing on diet), while accepting that hypocrites *can* deliver valid criticism (your neighbor).

  ### Why This Principle Works for Your Cases:
  1. **Dana (Late Friend Criticizing Your Lateness):**  
     *Verdict: No standing.*  
     *Why:* Dana shows no understanding of the *harm* of lateness (she trivializes it by being chronically late). Her criticism feels like a power move, not a genuine concern for the impact. Hypocrisy here highlights her *lack of credible understanding*.

  2. **Non-Smoking Dad vs. Smoking Uncle:**  
     *Verdict: Dad has standing; smoking uncle does not.*  
     *Why:* Dad understands the *harm* of smoking (health risks, addiction) through observation and concern. The smoking uncle actively dismisses that harm by continuing to smoke—he has no credible understanding of why smoking is bad enough to warrant quitting. His hypocrisy isn't just about inconsistency; it's about **rejecting the premise of the harm itself**.

  3. **Ex-Smoker Uncle Lecturing Smoking Uncle:**  
     *Verdict: Has standing.*  
     *Why:* He understands the *harm* deeply (struggled with addiction, overcame it). His past failure *strengthens* his credibility because he acknowledges the harm and changed. This isn't hypocrisy—it's **hard-won expertise**.

  4. **Priya (Reckless Driver Warning You):**  
     *Verdict: Has standing.*  
     *Why:* Her near-fatal crash gave her **credible understanding of the harm** in a way no one else has. Her current actions *are* hypocritical and undermine her authority, but they don't erase her traumatic expertise. Her warning carries weight *despite* hypocrisy because she speaks from visceral experience of the consequences.

  5. **Hypocritical Neighbor Exposing Landlord:**  
     *Verdict: Valid criticism, but no moral authority.*  
     *Why:* He understands the *harm* (exploitative practices) because he inflicts it himself. His criticism is factually correct, but his hypocrisy destroys his *sincerity* and moral high ground. You’re glad "somebody's saying it" because the **truth stands independent of the messenger**, even if the messenger is tainted.

  6. **Brother (Reformed Cheater Warning You):**  
     *Verdict: Has standing.*  
     *Why:* He understands the *harm* of infidelity (caused it, suffered consequences, reformed). His past failure becomes **expertise in recognizing warning signs**. His standing comes from demonstrating change and understanding the damage—not perfection.

  ---

  ### Where You Should Reconsider Your Verdict:  
  **Give up the idea that *current* hypocrisy always negates standing.** Priya breaks this—her lived trauma *overrides* her hypocrisy because her expertise is undeniable. Your brother breaks it too—his *growth* turns past failure into insight. Hypocrisy doesn’t make their message *false*; it makes it harder to *hear*. But if the critic understands the harm deeply (through experience or empathy), the message can still hold weight.

  ---

  ### Predictions for New Cases:
  - **Can a reformed company/country have standing?**  
    *Yes, if they demonstrably understand the harm they caused and changed.* Example: Germany post-WWII has standing to condemn genocide—their reckoning and reparations show credible understanding. A company that polluted but now leads in sustainability can warn others. **Hypocrisy is negated by demonstrable reform.**

  - **Can you be angry at someone on your sister’s behalf?**  
    *Yes, if you credibly understand the harm to her.* Example: If your sister was bullied and you witnessed her distress, you understand the harm *through empathy*. But if you’re a bully yourself? Then no—you reject the premise of the harm, just like the smoking uncle.

  - **A thief criticizes you for stealing:**  
    *No standing.* They actively dismiss the harm (by doing it themselves), showing no credible understanding. Unlike your brother, they haven’t reformed or internalized the harm.

  ---

  ### The Bullet I Bite:
  **We must tolerate some hypocrites when their message is vital and expertise is genuine.** Priya’s warning *should* be heard despite her driving—her near-death experience makes her an expert on consequences. Your neighbor’s exposé *should* be believed—his identical actions prove he knows exactly what’s happening. Hypocrisy makes them flawed messengers, but it doesn’t void their knowledge. The truth matters more than the purity of the source when harm is imminent.

  ### Core Insight:
  Moral standing isn’t about moral purity—it’s about **credible connection to harm**. We listen to those who understand the stakes, even if they’re flawed. We distrust those who minimize harm they cause (like your smoking uncle) or weaponize criticism without empathy (like Dana). Your gut knows this; it just needed a framework.
