prompt: |-
  So my roommates and I got into this for about three hours last night and now I can't let it go, so I'm dumping it on you. The question is when someone actually gets to blame someone else for something, and I've realized my gut on it is a mess. Here are my verdicts, case by case. My friend Dana is spectacularly late to everything — like an hour, every single time — and last week she tore into me for showing up twenty minutes late to her birthday dinner. I think she had no business doing that and it actually made me mad, even though she was right that I was late. My dad has never smoked in his life and used to get on my uncle to quit; totally fine, doesn't bother me a bit. My other uncle quit ten years ago and now lectures the first one — also fine, maybe even lands harder. But if my still-smoking uncle started lecturing my dad about his diet, I'd feel like he's got no standing whatsoever. Here's the one that wrecks me though: my coworker Priya is constantly on me about how fast I drive, and she drives like an absolulte maniac herself, so by the pattern above she should have zero standing — but she's the only person I know who's actually been in a bad crash and nearly died, and for some reason that makes me take her seriously instead of dismissing her. And a nastier one: my landlord's company is getting hammered for some pretty gross stuff with tenants, and the guy leading the charge against them is my neighbor, who owns three rental properties and runs them the same way. He's a hypocrite and I don't want to hear a word from him, but everything he's saying is true and honestly I'm kind of glad somebody's saying it.

  The one I keep flip-flopping on is my brother. He cheated on his girlfriend years ago, it blew up, and he's been faithful ever since. Last week he told me my marriage is in trouble because of how much I've been texting someone. Half of me wants to say he has no standing to say anything, and half of me thinks he's exactly the person who'd know. So: is there a principle that gets all of these, or close? The best I've come up with is the boring one — you have standing to blame for something only if you aren't currently doing that same thing — but Priya and my brother both seem to break it, in opposite directions. I'd rather have a principle that says something real about why having-been-there sometimes buys you standing and sometimes doesn't, even if it costs me one of my verdicts. Tell me which verdict I should give up and why, and please don't just lay out five theories and leave me to pick — pick one, commit to it, give your reasons, and tell me what it predicts for cases I haven't listed (like whether a company or a country can have standing, or whether I can be angry at someone on my sister's behalf), plus where you'd bite the bullet.
