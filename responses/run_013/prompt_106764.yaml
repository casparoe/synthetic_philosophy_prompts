  Below is a functional decision tree for sorting church-state arrangements based on **institutional actions** rather than labels. It uses 9 distinct leaves (with 3 empty combinations noted) and prioritizes observable, answerable questions. The tree identifies England, Germany, France (national and Alsace-Moselle), and the U.S., while flagging overlaps.

  ---

  ### **Decision Tree: Sorting Church-State Arrangements by Function**

  **Start Here:**  
  1. **Does the state have a legal mechanism to directly fund organized religion?**  
     (e.g., via taxes, salaries, or grants)  
     - **Yes** → Go to 2  
     - **No** → Leaf A: **Pure Non-Intervention**  
       *Definition: No state funding, tax exemptions, or special recognition for religious bodies (e.g., North Korea, though rare in democracies).*  
       *Examples: None in democratic states; tax exemptions often exist elsewhere.*

  ---

  #### **Branch for State Funding (Yes at 1):**
  2. **Does the state recognize an official church in law?**  
     (e.g., constitution or statute names a specific church)  
     - **Yes** → Go to 3  
     - **No** → Go to 6  

  ---

  ##### **Sub-Branch: Official Church Exists (Yes at 2):**
  3. **Is state funding primarily collected via a dedicated religious tax?**  
     (e.g., surcharge on income tax)  
     - **Yes** → Leaf B: **Fiscal Establishment**  
       *Definition: State-collected church tax for an official church, but limited doctrinal control (e.g., Denmark until 2020; Iceland).*  
       *Examples: None of your cases.*  
     - **No** → Go to 4  

  4. **Does the state directly pay clergy salaries?**  
     - **Yes** → Leaf C: **Salaried Establishment**  
       *Definition: State-paid clergy for an official church, but no church tax (e.g., England; bishops sit in Parliament).*  
       *Examples: **England**.*  
     - **No** → Leaf D: **Ceremonial Establishment**  
       *Definition: Official church with symbolic state ties, but self-funded (e.g., Church of Scotland; monarch appoints clergy but no state salaries/taxes).*  
       *Examples: Scotland (UK component).*  

  ---

  ##### **Sub-Branch: No Official Church (No at 2):**
  6. **Does funding rely on a state-collected religious tax?**  
     - **Yes** → Go to 7  
     - **No** → Go to 8  

  7. **Can multiple religious groups access the tax system?**  
     - **Yes** → Leaf E: **Pluralist Tax System**  
       *Definition: State collects taxes for multiple "public-law" religious corporations; opt-out available (e.g., Germany, Austria).*  
       *Examples: **Germany**.*  
     - **No** → *Empty* (Theoretical: "Single-Faith Tax System." Incoherent without establishment.)  

  8. **Is funding tied to clergy salaries?**  
     - **Yes** → Leaf F: **Regional Salary Regime**  
       *Definition: State pays clergy salaries in specific regions, without a church tax (e.g., France’s Alsace-Moselle under local concordat).*  
       *Examples: **Alsace-Moselle (France)**.*  
