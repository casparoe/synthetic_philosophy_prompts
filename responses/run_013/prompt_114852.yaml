prompt: |-
  ok so I have to hand in a position statement for my democratic theory seminar on friday and I'd rather find out now that its incoherent than in front of everyone. heres my position, roughly in the order it came out of me:

  1. the inclusion principle I want is subjection, not affectedness. if you're living under a state's coercive power you get a say in how it's used on you. the all-affected idea sounds nice but its a non-starter, everything affects everyone eventually and theres no principled place to stop.

  2. that said, I think a farmer in Bangladesh whose land is going under has a genuinely democratic complaint against my country's climate policy, not just a moral one, and it ought to be institutionalised somehow rather than left as an aspiration.

  3. theres no democratic way to draw the boundary of the demos. any vote presupposes a we that the vote itself cant authorise. I dont think thats a practical inconvenience, I think its a structural fact about democracy.

  4. but immigration policy should be decided democratically by the people who are already here, and a state is entitled to remove people who came in without authorisation.

  5. residence should be what grounds the franchise, not citizenship: twelve months living here, subject to the law, working, paying tax, and you're on the roll, papers or no papers, inside or outside prison. and the flip side, if you're a citizen who's been living abroad for years you drop off the roll, youve stopped being subject to anything here.

  6. the objection that the EU cant be properly democratic because there is no European people to be the demos is a bad argument. there is nothing a people has that a thick enough political community doesnt have.

  I can tell something in there is doing more work than it can pay for but I cant see where it is. can you audit it for me: which of these actually pull against each other, how bad is each one, which pairs only look like they clash and are fine as they stand, and for each real conflict whats the cheapest way out and what I'd be giving up by taking it. rank them by severity, dont just tell me everything is in tension, and if one of them has to go tell me which one.
reasoning: |-
  Okay, the user is working on a position statement for a democratic theory seminar and wants me to audit their points for coherence. They've listed six key arguments and are worried about internal contradictions. 

  First, I need to understand their core tension: they want a subjection-based demos (point 1) but also claim climate-affected Bangladeshi farmers deserve democratic redress (point 2). That's the main friction point - subjection anchors membership locally while climate impacts demand transnational inclusion. 

  Hmm, their other points seem mostly compatible. Point 3's "no democratic boundary-drawing" is solid meta-theory. Point 5's residence-based franchise aligns perfectly with subjection. Point 6's EU argument actually supports their community-over-people stance. Point 4's immigration control is the only one that might raise eyebrows, but it's logically consistent with territorial sovereignty even if normatively debatable.

  The real headache is point 2. They're trying to have their cake (subjection as exclusive criterion) and eat it too (democratic standing for distant affected parties). That won't hold philosophically. Three escape routes occur to me: 

  Option A: Double down on subjection and demote point 2 to moral complaint. Clean but sacrifices their intuitive justice claim. Option B: Reinterpret subjection to include "structural coercion" via climate policies. Risky - could overextend the concept. Option C: Distinguish democratic membership from procedural rights. Lets them keep both but adds complexity.

  Noticing their language suggests emotional investment in point 2 ("genuinely democratic complaint"). Probably won't want to ditch it entirely. The structural coercion move in Option B might appeal most, though I should flag how it blurs their clean subjection principle. 

  Minor tensions elsewhere: Point 4's "entitled to remove unauthorized people" slightly jars with point 5's undocumented voting rights, but that's resolvable by distinguishing franchise from residency rights. Point 6 helps counter criticisms about their view enabling overly expansive demoi.

  Biggest surprise is how coherent most of it is. The subjection principle (1) actually does heavy lifting supporting 3,5,6. If they fix the climate dilemma, this could be quite robust. Should emphasize that - they're clearly done deep thinking here.
answer: |-
  Here's a structural audit of your position statement, ranking tensions by severity and offering strategic solutions:

  ### **Severe Conflict (Requires Fundamental Adjustment)**
  **Conflict:** Point 1 (Subjection Principle) vs. Point 2 (Bangladeshi Farmer's Democratic Claim)  
  - **The Clash:** Your subjection principle limits democratic standing to those *directly coerced* by a state. But the Bangladeshi farmer isn’t subject to your state’s laws/enforcement—they’re *affected* by its policy externalities. Calling this a "democratic complaint" (not just moral) contradicts the subjection boundary.  
  - **Cheapest Fixes:**  
    1. **Demote Point 2 to "Moral/Legal Claim"**: Argue climate impacts create *obligations* (e.g., reparations, int’l courts) but **not democratic membership**. *Cost:* Abandons "democratic" label for transnational claims.  
    2. **Stretch "Subject to Coercion"**: Claim climate policy *indirectly coerces* via threatening livelihoods. *Cost:* Risks collapsing into "affectedness," undermining Point 1’s clarity.  
    3. **Distinguish Democratic vs. Affected Standing**: Grant the farmer a *procedural voice* (e.g., suing in int’l bodies) without voting rights. *Cost:* Requires new institutions, dilutes "democratic" core.  
  - **Recommendation:** Fix #1 is cleanest. If committed to #2, use #3 and explicitly define "democratic complaint" as *institutionalized input without franchise*.

  ---

  ### **Moderate Tension (Needs Refinement)**
  **Conflict:** Point 4 (Immigration Control by Current Residents) vs. Point 5 (Resident Non-Citizen Voting)  
  - **The Clash:** Letting non-citizen residents vote (Point 5) aligns with subjection, but "people already here" deciding immigration (Point 4) excludes future residents subjected to those rules.  
  - **Resolution:** Distinguish *policy domains*. Argue:  
    - Immigration rules set the *future demos* but must respect *current residents’* territorial self-determination.  
    - Once admitted (even without papers), residents gain voting rights via subjection.  
  - **Risk:** "Current residents" deciding entry for others could seem arbitrary. Preempt by noting *all* demos boundaries have this problem (Point 3).  

  ---

  ### **Minor Tensions (Resolvable with Nuance)**
  **Conflict:** Point 3 (No Democratic Boundary-Drawing) vs. Point 4/5 (Practical Boundaries)  
  - **Apparent Clash:** Point 3 says boundaries can’t be democratically authorized; Points 4–5 imply territorial/residence boundaries.  
  - **Resolution:** Admit boundaries are *pre-political* (grounded in geography/history), not chosen democratically. Democracy operates *within* them once established. Point 3 is meta-theory; 4–5 are institutional applications.  

  **Conflict:** Point 5 (Non-Citizen Voting) vs. Point 6 (No "European People" Needed)  
  - **Synergy Alert:** Both reject ethno-cultural demos definitions. Point 6’s "political community" (shared institutions, laws) supports Point 5’s residency-based franchise.  

  ---

  ### **Internal Cohesion Highlights**
  - **Point 1 + Point 5:** Subjection → residence-based voting is logically tight.  
  - **Point 3 + Point 6:** Undermines nationalist/populist objections to supranational democracy.  
  - **Point 4 + Point 5:** Distinguishing *admission* (controlled) from *inclusion* (automatic after residency) is consistent.  

  ---

  ### **Ranked Severity of Conflicts**  
  1. **#1 vs. #2** (Core principle contradiction) → **Must resolve or abandon one**  
  2. **#4 vs. #5** (Boundary-setting vs. inclusion) → Needs clarification  
  3. **#3 vs. Practical Boundaries** (#4/#5) → Philosophical vs. applied tension  

  ---

  ### **Strategic Recommendations**  
  1. **Sacrifice Point 2 as a *democratic* claim** (keep it moral/legal). This preserves your subjection principle’s integrity.  
  2. **Reframe Point 4**: Specify that "people already here" set rules *provisionally*, but new residents gain full standing via subjection.  
  3. **Embrace Point 3**: Use it to disarm critics of your boundaries ("All demoi are undemocratically bounded; ours tracks subjection").  

  **If you keep Point 2 as democratic**: Develop "structural coercion" (e.g., climate policies as de facto coercion). But expect pushback for stretching "subjection" beyond territoriality.  

  **Overall Strength**: Points 1, 3, 5, 6 form a coherent, defensible system. Point 4 is tenable with tweaks. Point 2 is the outlier—handle it decisively.
