prompt: |-
  I've been lurking on LessWrong since the Sequences were coming out, and now I'm in a law-and-ethics seminar on autonomous systems, and the phrase responsibility gap is doing way too much work. Half the room uses it to mean no one can be blamed, half to mean no one is liable, and a couple people seem to mean the system itself should be a moral agent. Before we start grading theories I want the spec. So: write me the desiderata any adequate theory of responsibility gaps for autonomous systems has to meet. Not a survey, the requirements list, and I want your own carving of it rather than a summary of what people say. What phenomena must it explain? Which cases must it get right -- the autonomous weapon that misidentifies a target, the self-driving car that chooses between two harms, the trading algorithm that flash-crashes a market, the hospital allocation model that a human committee rubber-stamps, the swarm where each drone only does a tiny part and the commander sets a broad objective? Which distinctions can't be collapsed -- moral vs legal vs causal, blame vs liability vs answerability, gap vs mere diffusion vs displacement, individual vs collective vs system-level, ex ante vs ex post? What empirical or institutional facts is it not allowed to contradict -- automation bias, opacity of learned systems, the fact that humans are bad at supervising things faster than they can think, the way liability regimes already spread risk? For each requirement give the case or consideration that motivates it, mark which ones are non-negotiable and which are just preferences of one camp (retributivists, tort lawyers, AI safety people, roboticists, etc.), and flag any pair you think can't be jointly satisfied -- e.g., if you require real control and also want to hold someone responsible for opaque learned behavior, or if you want responsibility to track causation and also to be forward-looking. I especially want the requirement that knocks out the most popular theories. And if some requirement is just a camp's prejudice dressed up as a desideratum, say that too.

  One more thing: I suspect there's a hidden assumption that a gap is always bad and should be closed. Maybe a theory should be allowed to say some gaps are appropriate, or that the right response is to redesign institutions rather than find a guilty person. So include a requirement about what the theory is for -- allocating blame, assigning liability, guiding design, or preserving moral agency -- and tell me if the desiderata change depending on that purpose. Also, if you can, give a quick scorecard of the usual contenders (human-in-the-loop, strict liability, personhood for the system, collective responsibility, responsibility as answerability) against the list, but keep it short; the list is the main thing. Oh and dont give me a reading list, I can't search and I dont want citations, just the conceptual spec.
reasoning: |-
  Hmm, this user is clearly a sophisticated thinker - likely a grad student or early-career academic in tech ethics. They've been engaging with LessWrong rationalist content since the Sequences era, so they'll expect rigorous conceptual breakdowns. The frustration with "responsibility gap" being used as a semantic dumping ground is palpable. 

  Key things they're demanding:
  - Not a literature review but a hard specification of requirements
  - Must cover the paradigmatic cases (weapons, cars, trading algos etc.)
  - Must preserve crucial distinctions they listed (moral/legal/causal etc.)
  - Needs to flag which requirements are faction-specific versus universal
  - Should expose hidden assumptions about gaps necessarily being bad
  - Wants the knockout criterion that invalidates popular theories

  The subtext here is important - they're preparing for grading theories in a seminar, so they need an evaluation framework that's neutral enough to stand up to scrutiny from multiple philosophical camps. The mention of "not wanting citations" suggests they've already done the reading and need synthesis, not references.

  What's tricky:
  - Balancing breadth (covering all their listed cases) with depth
  - Avoiding getting trapped in any one disciplinary frame (law vs ethics vs CS)
  - Their examples span different responsibility types (blame, liability, answerability)
  - The swarm case introduces emergence - which breaks most individualistic models

  The hospital allocation example with rubber-stamping committees is particularly gnarly - it highlights how humans can become "responsibility dampers" rather than genuine controllers. And their point about liability regimes already spreading risk is spot-on; many theorists ignore existing legal structures.

  Biggest insight they prompted: Responsibility gap theories often implicitly assume closure is always desirable, when sometimes the ethical move is to prevent the conditions that create gaps (e.g., by not deploying certain systems). That needs to be Requirement 0.

  For the knockout punch: The control requirement will murder most proposals. If you demand meaningful control as a prerequisite, then human oversight of opaque deep learning systems becomes a farce - humans can't control what they can't understand or predict. That sinks "human-in-the-loop" approaches for neural net based systems.

  Must resist the academic urge to caveat everything. They want bold, clear demarcations. Save nuances for the preference-marked items.
answer: |-
  Here’s a conceptual specification for theories of responsibility gaps in autonomous systems, structured as desiderata with motivations, non-negotiables flagged, and tensions highlighted. The list prioritizes explanatory power over ideological alignment, and explicitly allows for "appropriate gaps."

  ---

  ### **Core Desiderata for Responsibility Gap Theories**  
  *(Non-negotiables marked ⚖️; faction-specific preferences marked 👥)*  

  1. **Explain the Core Phenomenon**  
     - **Must**: Explain why *no agent meets traditional criteria* for responsibility in specific failure modes (e.g., a drone swarm causing unintended civilian casualties where no single actor controls the outcome).  
     - **Motivation**: The autonomous weapon misidentification case – if no human intended harm, understood the context, or could intervene, responsibility evaporates.  
     - **⚖️ Non-negotiable**: The theory must define what constitutes a "gap" (vs. mere uncertainty).  

  2. **Distinguish Responsibility Types**  
     - **Must**: Separate *moral blame* (culpability), *legal liability* (remedy/cost-bearing), *causal contribution* (butterfly effects), and *answerability* (duty to explain).  
     - **Motivation**: Hospital allocation models – a committee rubber-stamping an AI’s decision may be *answerable* but not *blameworthy* if they lack expertise.  
     - **⚖️ Non-negotiable**: Collapsing these invalidates real-world applications (e.g., tort law ≠ criminal law).  

  3. **Handle Multi-Scalar Agency**  
     - **Must**: Address *individual* (e.g., programmer), *collective* (e.g., corporation), and *system-level* (e.g., algorithm + hardware) actors.  
     - **Motivation**: Trading algorithm flash-crash – individual traders, firms, and the algorithm’s design all contribute diffusely.  
     - **Tension**: Holding collectives responsible may violate individual fairness; system-level agency risks anthropomorphism.  

  4. **Account for Epistemic Constraints**  
     - **Must**: Acknowledge *opacity* (e.g., unexplainable deep learning), *automation bias* (human over-reliance), and *speed* (systems outpacing human cognition).  
     - **Motivation**: Self-driving car choosing harms – a human "supervisor" can’t override a nanosecond decision.  
     - **⚖️ Non-negotiable**: Theories requiring "meaningful human control" fail if they ignore these constraints.  

  5. **Address Temporal Dimensions**  
     - **Must**: Separate *ex ante* (design-phase obligations) and *ex post* (post-failure attribution) responsibility.  
     - **Motivation**: Autonomous weapon deployment – designers may bear *ex ante* duties, but *ex post* blame may be ungraspable.  
     - **👥 Preference**: Retributivists focus on *ex post* blame; engineers prioritize *ex ante* prevention.  

  6. **Allow for Appropriate Gaps**  
     - **Must**: Permit that some gaps *should not be closed* (e.g., if forcing attribution creates scapegoats) or require *institutional redesign* (e.g., no-fault compensation funds).  
     - **Motivation**: Swarm drone systems – pinning blame on a commander for emergent outcomes may be unjust; strict liability may better distribute costs.  
     - **Knockout Criterion**: Theories insisting *all gaps must be filled* ignore viable alternatives (e.g., risk-pooling).  

  7. **Specify the Theory’s Purpose**  
     - **Must**: State whether the goal is *blame assignment*, *loss allocation*, *system design*, or *moral agency preservation*.  
     - **Motivation**: Purpose dictates priorities – e.g., liability regimes prioritize compensation over moral desert.  
     - **Tension**: A theory for *design guidance* (e.g., "ensure traceability") may conflict with *blame assignment* (e.g., "punish recklessness").  

  8. **Compatibility with Empirical Realities**  
     - **Must**: Align with how liability *already* spreads risk (e.g., enterprise liability) and human cognitive limits (e.g., vigilance decay during monitoring).  
     - **Motivation**: Humans rubber-stamping AI decisions – if automation bias is universal, blaming individuals is empirically hollow.  
     - **⚖️ Non-negotiables**: Cannot assume perfect human supervisors or fully transparent systems.  

  ---

  ### **Factional Preferences & Tensions**  
  - **👥 Retributivists**: Demand *blame* tracks *culpable mental states* → Fails with opaque systems (Desideratum 4).  
  - **👥 Tort Lawyers**: Prefer *liability* follows *deepest pockets* → May ignore moral agency (Desideratum 2).  
  - **👥 AI Safety/Roboticists**: Focus on *ex ante design* → May neglect *ex post* justice (Desideratum 5).  
  - **👥 Moral Agency Camp**: Seek *system-level responsibility* → Risks anthropomorphism (Desideratum 3).  

  ---

  ### **Knockout Requirement**  
  **Desideratum 4 (Epistemic Constraints) + Desideratum 8 (Empirical Realities)**  
  - **Kills**: "Human-in-the-loop" theories if humans *can’t* reasonably supervise (e.g., high-speed trading).  
  - **Kills**: "Moral agency for AI" if systems lack *intentionality* (per most philosophies).  
  - **Kills**: Strict individual blame for rubber-stamp committees (automation bias).  

  ---

  ### **Quick Scorecard of Theories**  
  | **Theory**               | **Fails Desideratum(s)**                               | **Strengths**                                  |  
  |--------------------------|-------------------------------------------------------|-----------------------------------------------|  
  | **Human-in-the-loop**    | 4 (speed/opacity), 8 (automation bias)                | Intuitive; satisfies ex ante design (5)       |  
  | **Strict Liability**     | 2 (collapses blame/liability), 3 (ignores collectives)| Pragmatic loss allocation; handles gaps (6)   |  
  | **AI Personhood**        | 2 (confuses answerability/blame), 8 (anthropomorphism)| Addresses system-level causality (3)          |  
  | **Collective Responsibility** | 3 (individual fairness), 5 (ex post focus)        | Fits corporate liability; swarms (3)          |  
  | **Answerability**        | 1 (not a gap-filler), 2 (ignores blame/liability)     | Useful for audits; hospital committees (2)    |  

  ---

  ### **Key Tensions**  
  - **Control vs. Opacity**: If responsibility requires *control* (moral/legal norm), but systems are *opaque* (Desideratum 4), gaps are inevitable → Forces institutional redesign (Desideratum 6).  
  - **Causation vs. Forward-Looking**: Responsibility can’t both *track micro-causation* (e.g., which drone in a swarm) and *deter future harm* (e.g., punishing the manufacturer) → Favors separating blame/liability (Desideratum 2).  

  ### **The Hidden Bias**  
  The assumption that *gaps are always bad* is a moralistic prejudice (often from retributivists). An adequate theory must allow gaps to be:  
  - **Appropriate**: If filling them causes greater injustice (e.g., scapegoating).  
  - **Managed**: Via non-blame institutions (e.g., insurance, algorithmic audits).  

  ---  
  This spec forces theories to confront *why* gaps exist (epistemology, control, scale), *what* we want from responsibility (justice? compensation? safety?), and whether moral agency is even the right frame. The strongest theories will be those that redesign institutions around gaps rather than deny them.
