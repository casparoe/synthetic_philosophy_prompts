  ## PRESS RELEASE: Democracy Assessment Initiative Announces 2024 Methodology Revision and Reclassification Updates

  **GENEVA, SWITZERLAND – May 15, 2024** – The Democracy Assessment Initiative (DAI), a consortium of leading academic institutions (including the Geneva Institute for Political Measurement, the Stanford Center for Democratic Resilience, and the University of Cape Town Governance Lab) and non-partisan advocacy organizations (Global Governance Watch, the Civic Space Foundation), today released its annual update to the Global Democratic Health Index (GDHI) methodology alongside corresponding reclassifications for 17 polities.

  The DAI’s core mandate is the rigorous, transparent measurement of democratic performance globally. Our methodology undergoes annual review by the independent Technical Review Board (TRB) to incorporate new scholarly consensus, address measurement challenges, and enhance inter-coder reliability. This year’s revisions focus on five key areas:

  1.  **Threshold Adjustment for "Backsliding" Status:** Following sensitivity analysis and stakeholder feedback, the threshold separating an "Impaired Democracy" from a "Democracy in Backsliding" has been revised. Previously, a two-point decline in the Aggregate Democratic Functionality (ADF) score within a single measurement cycle triggered "backsliding" status. The revised threshold is now a **cumulative decline of 3 points over two consecutive cycles**. This acknowledges that democratic erosion is often non-linear and allows for distinguishing transient fluctuations from sustained negative trajectories.
  2.  **Temporal Scope of "Reversal":** The TRB clarified the treatment of declines subsequently reversed by electoral outcomes. A decline registered in Year T that is fully reversed (i.e., the ADF score returns to or exceeds its T-1 level) by Year T+1 is **no longer counted towards the cumulative backsliding threshold**. However, the initial decline remains recorded in the historical dataset. Reversal requires sustained improvement across two subsequent measurement cycles to be considered durable.
  3.  **Unit of Analysis for Federal Systems:** Previously, the primary unit of analysis was the national executive and legislature. The 2024 revision mandates **inclusion of significant subnational trends in federal systems**. Where subnational units collectively representing over 30% of the population enact measures demonstrably reducing electoral contestation, civic space, or judicial independence (as defined by DAI coding protocols), these are now factored into the national ADF score with a weighting of 0.4. Previously, such data was noted qualitatively but excluded from the core score.
  4.  **Formal Compliance vs. Substantive Deficit:** The weighting of indicators within the "Contestation" sub-index has been adjusted. Previously, adherence to formal electoral procedures (e.g., timely elections, legal candidate registration) carried a weight of 0.6, while substantive measures of fairness (e.g., balanced media access, absence of systemic voter intimidation, equitable resource distribution) carried 0.4. This ratio has been inverted to **0.4 for formal compliance and 0.6 for substantive fairness**, reflecting greater emphasis on the lived experience of electoral competition over procedural minimalism.
  5.  **Resolution of Coder Discrepancy:** When primary coders disagree on a polity's annual ADF score change by more than the magnitude of the change being reported (e.g., disagreement on whether a change is -0.8 or +0.2 when the prior year's change was -0.5), the revised protocol mandates a third coder review. If the discrepancy persists, **the final score change is calculated as the median of the three scores, and the year-on-year change reported is the difference between this median and the prior year's median.** Previously, the average was used, which could mask significant underlying disagreement.

  **Reclassification Highlights:**

  Based strictly on the application of the revised 2024 methodology to data collected for the 2023 measurement cycle (covering calendar year 2022 and early 2023), the following reclassifications occur:

  *   **Danubia:** Previously classified as "Democracy in Backsliding" (ADF 68 in 2022 cycle). Under the revised cumulative threshold (Point 1) and the adjusted weighting for substantive contestation (Point 4), the recalculated 2022 ADF score is 72. As this score remains above the new "Impaired Democracy" threshold (75) and the cumulative decline over the past two cycles is now calculated as 2.8 points (below the 3-point threshold), **Danubia is reclassified from "Democracy in Backsliding" to "Impaired Democracy".** Its trajectory remains "Declining".
  *   **Vistula:** Previously classified as "Impaired Democracy" (ADF 78 in 2022 cycle). The inclusion of subnational data reflecting restrictions in several populous regions (Point 3) contributes to a recalculated 2022 ADF of 76. However, the 2023 preliminary data shows a significant rebound following recent elections. Applying the new reversal rule (Point 2) to the 2021-2022 decline, and incorporating the 2023 rebound, **Vistula avoids "Backsliding" status and retains its "Impaired Democracy" classification**, with its trajectory upgraded to "Improving".
  *   **Aegea:** Previously classified as "Impaired Democracy" (ADF 65 in 2022 cycle). The increased emphasis on substantive contestation (Point 4) results in a further reduction of its recalculated 2022 ADF score to 62. This places it below the "Impaired Democracy" threshold. **Aegea is reclassified from "Impaired Democracy" to "Democracy in Backsliding".**
  *   **United States:** Previously classified as "Consolidated Democracy" (ADF 85 in 2022 cycle). The mandatory inclusion of subnational data reflecting legislative and administrative actions impacting electoral access and oversight in states comprising >30% of the population (Point 3), combined with the increased weighting for substantive contestation deficits (Point 4), results in a recalculated 2022 ADF of 83. While this remains within the "Consolidated Democracy" band (80-100), it represents a continued decline. **The US retains its "Consolidated Democracy" status but its trajectory is confirmed as "Declining".**

  Full methodological documentation and revised historical scores for all 167 polities assessed are available at www.dai-gdhi.org/methodology2024. The full 2024 GDHI Report, incorporating 2023 data, will be released October 1st.

  **About the Democracy Assessment Initiative (DAI):** The DAI is a non-partisan research consortium dedicated to the rigorous, transparent, and comparable measurement of democratic health worldwide. Our work informs academics, policymakers, civil society, and the public.

  **Media Contact:** Dr. Anya Petrova, Head of Communications, DAI Secretariat | press@dai-gdhi.org | +41 22 999 9999

  ---

  **FREQUENTLY ASKED QUESTIONS (Re: 2024 Methodology Revision & Reclassifications)**

  *   **Q: Why was [Country X] downgraded/upgraded? The voters just re-elected their government! Doesn't that show popular support?**
      *   A: The GDHI measures the health of democratic *institutions* and *processes*, not the popularity of specific governments or leaders. Electoral outcomes are one component within the broader framework assessing electoral integrity, rights protection, institutional constraints, and civic pluralism. Popular mandates do not negate measurable declines in institutional safeguards or procedural fairness.
  *   **Q: Is the DAI grading our region on a curve? It feels like we're being singled out.**
      *   A: The GDHI applies identical methodological standards and coding protocols to all polities within its assessment framework. Reclassifications result solely from the consistent application of the revised 2024 methodology to all existing data. Geographic distribution of changes reflects the differential impact of methodological refinements based on local political contexts and prior scoring profiles.
  *   **Q: The previous government in [Country Y] did similar things, but you didn't downgrade them then. Why now?**
      *   A: DAI methodology evolves annually based on scholarly advances and measurement best practices. Current assessments utilize the most refined protocols available. Historical data is retrospectively recalculated *only* when core indicator definitions change fundamentally. The 2024 revisions primarily concern aggregation rules (thresholds, weighting, scope) applied to existing indicator scores, hence the reclassifications based on past data under new aggregation methods. Comparisons across different methodological baselines are not valid.
  *   **Q: How can formal adherence to laws and procedures count for less now? Isn't legality fundamental?**
      *   A: Formal legality remains a necessary but insufficient condition for robust democracy. The revised weighting within the Contestation sub-index reflects a strengthened consensus within political science that substantive fairness, inclusivity, and an even playing field are critical for meaningful electoral competition. The adjustment seeks to better capture instances where legal forms are maintained while substantive democratic competition is eroded. Formal compliance remains a scored component.
