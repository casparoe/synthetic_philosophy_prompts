prompt: |-
  Ok, bit of a strange request, so bear with me. I took early retirement from the bench a couple of years back — 30-odd years as a synthetic chemist, mostly catalysis — and to stop the old brain turning to mush I've been sitting in on philosophy lectures at the local uni. The thing that's got its hooks in me is this business about natural kinds: whether the sciences really carve nature at its joints, or whether we just draw lines where it's convenient and then forget we drew them. I think about it constantly now, annoyingly.

  What I actually want from you is a joke. A proper joke about natural kinds. And I don't mean one of those nerd jokes where the punchline is just a technical phrase dropped in for no reason — I want the funny to turn on the actual disagreement. Someone who's genuinely thought about the species problem, or about whether chemical elements are the clean natural kinds everyone assumes they are, should laugh because the punchline is true to the arguments. Someone who hasn't should still get the shape of it.

  The mismatch I keep finding funny, in a bleak sort of way, is between the disciplines. Chemistry struts around like it's got the real joints — the periodic table, sharp lines, no mess — and then you look closer and jade turns out to be two totally different minerals, nephrite and jadeite (I had to learn this the hard way from a mineralogy friend). Meanwhile on the biology side, fish turns out not to be a real group at all, just everything with a spine that isn't one of us. So maybe the periodic table and the tree of life are bickering at a conference, or something better if you've got a better idea — you don't have to use mine.

  Keep it short, land the punchline, and please don't end on philosophers are useless, I'm sort of one now and I'm definately sensitive about it. Cheers.
