prompt: |-
  I am in the lower sixth at a comprehensive in the north of England, and I am putting together an extended project on decision theory, centred on the St Petersburg paradox. To get my bearings I borrowed from the school library a chapter of a popular book on risk and gambling that my maths teacher recommended, and I have typed out its account of the paradox more or less as it stands: "The St Petersburg game is played by tossing a fair coin until it comes up heads. The prize doubles with every toss, so a head on the first toss pays £2, on the second £4, on the third £8, and so on. Because there is no ceiling on how large the prize can grow, the expected value of the game is infinite, and a player who reasoned correctly would therefore be willing to pay any finite sum at all to play. This is absurd — the theory tells you to hand over your house for a game nobody would buy for £20 — and it shows that expected value is not a coherent guide to choice. Daniel Bernoulli solved the problem by observing that money does not have a constant value for us: each extra pound is worth less than the one before, so we should maximise expected utility rather than expected money. With his logarithmic utility function the expected utility of the game is finite, and the fair price comes out at a few pounds, which is roughly what people actually offer. So the paradox is solved: a rational player should pay a modest fee and refuse anything much higher, and anyone who demands more is simply making an arithmetic mistake. In any case, no real casino could ever offer the game, since no bank has infinite reserves, so the paradox is a curiosity about mathematics rather than a genuine problem for decision theory."

  What I want is an accuracy audit of that passage, sentence by sentence, rather than a general essay on the paradox. For each sentence, tell me what someone who actually works on this problem would accept, what they would wince at, and what is simply wrong; then tell me whether the chapter's closing verdict — that the paradox is a curiosity about mathematics rather than a genuine problem for decision theory — survives once the questionable sentences have been corrected. I have noticed that the chapter seems to want it both ways: it says expected value is not a coherent guide to choice, then says Bernoulli disposed of the whole difficulty, then says the difficulty was never serious; I cannot tell whether that is a real tension or merely three separate claims that happen to sit next to one another. I am inclined to think the passage is broadly right, since Bernoulli is famous and the paradox turns up in every textbook I have seen, but I would rather find out now which parts I can safely repeat in my project and which parts my supervisor will pull me up on.

  Please give me the answer as a single JSON object and nothing else, written in American English (I shall be quoting it in an application to a summer school in the United States), with exactly these fields:

  - source_label: a short string naming the passage you are auditing.
  - sentence_audit: an array with one object per sentence of the passage, in order; each object has sentence_number (integer), claim_label (three to eight words naming the claim that sentence makes), verdict (one of "sound", "sound but incomplete", "misleading", "false"), what_a_specialist_accepts (string), what_a_specialist_objects_to (string), and corrected_version (a rewritten sentence that a specialist would sign off on).
  - distinctions_the_passage_blurs: an array of objects, each with distinction (the two things being run together), which_side_the_passage_lands_on (string), and why_it_matters (string).
  - strongest_reply_the_passage_does_not_engage: a string giving the most serious response to the passage's closing verdict that the passage never addresses.
  - claims_safe_to_repeat: an array of strings, each a claim from the passage that I can repeat in my project without correction.
  - closing_verdict_audit: an object with closing_claim_restated (string), does_it_survive (one of "yes", "no", "qualified"), and reasoning (string).
  - internal_tension: an object with tension_described (string), is_it_resolvable (true or false), and resolution (string).
  - unresolved_without_more_information: an array of strings, each a point that cannot be settled from the passage alone.
  - bottom_line: a string of no more than three sentences of plain prose telling me what to trust and what to drop.

  Please do not include citations, reading lists or references of any kind; I have no internet access at school and could not check them, so give me the reasoning in your own words, and where a point turns on a fact you cannot be sure of, say so rather than guessing.
reasoning: |-
  Alright, let's tackle this St. Petersburg paradox audit request. The user is a UK lower sixth student preparing an extended project, and they've shared a textbook passage that needs accuracy checking line by line. 

  First, I need to understand their core request: they want a surgical dissection of each sentence, not general commentary. The JSON format is strict - must include fields like "sentence_audit" with verdict categories, and "distinctions_the_passage_blurs". The American English requirement matters since they're applying to US summer schools.

  Key observations about the passage: 
  - It oversimplifies the "infinite expected value" claim (neglecting probability weighting)
  - Misrepresents Bernoulli's solution as definitive (ignoring modern critiques)
  - Incorrectly says real casinos couldn't offer it (they could with capped payouts)
  - Has internal tension between calling EV "incoherent" vs the paradox being "not serious"

  For the sentence-by-sentence audit:
  - Sentence 1: The game description is mostly sound but "pays £2" is imprecise (should specify starting point)
  - Sentence 2: "Infinite expected value" is mathematically true but the "any finite sum" conclusion is misleading - it assumes linear money utility
  - Sentence 3: Calling EV "not a coherent guide" is false - it's contextually limited, not incoherent
  - Sentence 4: Bernoulli's solution is oversold as solving everything; marginal utility helps but isn't the only approach
  - Sentence 5: The "few pounds" calculation is questionable (log utility gives ~£11, not "few")
  - Sentence 6: "Demanding more is an arithmetic mistake" is false - risk-averse players rationally reject even fair prices
  - Sentence 7: The casino claim is factually wrong (finite banks cap payouts, don't prevent offering)

  Major distinctions blurred:
  1. Expected value vs expected utility (passage favors utility but misstates why)
  2. Theoretical vs practical playability (passage overstates impossibility)
  3. Bernoulli's historical solution vs modern decision theory

  The strongest unaddressed reply: Modern theories (like prospect theory) show people don't just use expected utility - they overweight small probabilities, which explains rejection better than log utility alone.

  Internal tension analysis: The passage contradicts itself by calling EV "incoherent" then saying the paradox isn't serious. This is resolvable - EV is coherent in its domain, but the paradox reveals its limitations for unbounded outcomes.

  Bottom line for the student: They can safely repeat the game's mechanics and infinite EV calculation, but should correct claims about casinos, Bernoulli's definitiveness, and the "arithmetic mistake" assertion. The closing verdict only partly survives - the paradox remains important for testing decision theories, not just as math trivia.
