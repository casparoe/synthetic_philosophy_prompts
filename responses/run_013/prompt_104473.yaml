prompt: |-
  I host a small philosophy podcast, and next week's guest is a philosopher whose new book defends a heterodox account of why promises bind. Her central claim is that a promise does not add a new first-order reason for the promisor to act; instead, it transfers to the promisee a normative authority to demand performance and, importantly, to release the promisor. The obligation is constituted by that transferred authority rather than by any independent duty of fidelity. She adds an acceptance condition: the transfer succeeds only if the promisee has the capacity to accept it, so promises to infants, to the dead, and to people in irreversible comas are binding, if at all, only derivatively. I would like eight to ten interview questions that go beyond inviting her to restate the view. Include at least one question on how the account distinguishes promising from asserting, threatening, and contracting; at least one on the acceptance condition and its treatment of promises to those who cannot accept; at least one on whether the account can explain the wrongness of breaking a promise when the promisee never learns of the breach and never demands performance; and at least one on the wrong-kind-of-reason problem as it arises for the promisee's authority to demand. For each question, supply a follow-up keyed to the answer she is most likely to give. Do not ask for bibliographies, reading lists, or citations; the questions should be answerable from the content of the view itself.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and is preparing for an interview with a philosopher who has a unique take on why promises bind. The guest's theory is that promises transfer normative authority to the promisee rather than creating a new reason for the promisor. The user wants eight to ten questions that go beyond just restating the view, with specific requirements about acceptance conditions, comparisons to other speech acts, unbreached promises, and the wrong-kind-of-reason problem. They also want follow-ups for each question.

  First, I need to make sure I understand the guest's theory. Her main points are: promises transfer authority to the promisee instead of creating a first-order reason; the obligation comes from this transferred authority; and there's an acceptance condition where the promisee must have the capacity to accept. Examples like promises to infants or the dead are only binding derivatively. The user has specific areas they want covered: distinguishing promising from asserting/threatening/contracting, the acceptance condition and its implications, the wrongness of breaking a promise when the promisee doesn't know, and the wrong-kind-of-reason problem for the promisee's authority.

  The user is likely looking for questions that provoke deep discussion and highlight nuances or potential issues. Since it's a podcast, the questions should be engaging for listeners, not too academic. The user might also want to help the guest clarify her position for a broader audience. Unspoken needs could include making the episode insightful, perhaps addressing counterarguments to strengthen the guest's position, or exploring real-world applications.

  Now, structuring the questions. I need at least one in each specified category. Let me brainstorm:

  1. **Distinguishing speech acts**: How does this view set promising apart from asserting or threatening? Follow-up could dig into why transferring authority is unique to promises.
     
  2. **Acceptance condition**: Questions on promises to those who can't accept, like infants. Follow-up might challenge derivative obligations and how they differ.

  3. **Unbreached promises**: If a promisee never knows about a breach, why is it still wrong? Follow-up could address whether the promisor's belief matters.

  4. **Wrong-kind-of-reason problem**: Can the promisee demand performance for bad reasons? Follow-up might link to the nature of authority.

  I should aim for 8-10 questions total. Other angles: how the view handles release vs. forgiveness, comparisons to consent, implications for moral responsibility, or scalability to complex promises. Also, consider objections like whether this reduces promises to mere permissions or if it aligns with intuitions about trust.

  For follow-ups, they need to be tailored to likely answers. For example, if the guest says threatening involves conditional harm, follow-up could ask why that's not authority transfer. For acceptance, if she mentions trustees for infants, follow-up on who qualifies as a trustee.

  Ensure questions avoid asking for citations; focus on the theory itself. Keep language accessible but precise. Finally, organize the questions to flow logically, building from basics to deeper issues.
answer: |-
  Here are 10 interview questions designed to probe the depths of your guest's account of promising, complete with targeted follow-ups based on likely responses. They focus on implications, distinctions, and potential challenges within her stated framework:

  1.  **Core Distinction & Mechanism:** "You argue a promise transfers normative authority *to the promisee* rather than creating a new first-order reason *for the promisor*. Could you elaborate on the precise *nature* of this 'normative authority' that is being transferred? What *kind* of power or standing does the promisee gain that they didn't have before?"
      *   *Likely Answer:* She might describe it as a power to create obligations *for the promisor specifically* via demands/release, a Hohfeldian "power of waiver," or a normative control over the promisor's action in this domain.
      *   *Follow-up:* "How does this differ fundamentally from the authority someone might gain via, say, consent? If I consent to you cutting my hair, you gain a permission, but does that constitute authority to *demand* you cut it?"

  2.  **Distinguishing Promising (vs. Asserting/Threatening):** "A key challenge for any promise theory is distinguishing it from similar speech acts. On your view, how does the *transfer of normative authority* specifically differentiate promising from (a) *asserting* I will do something (e.g., "I will be there tomorrow"), and (b) *threatening* ("If you don't X, I will Y")?"
      *   *Likely Answer:* Asserting creates belief but no authority transfer. Threatening involves conditional harm/benefit and perhaps creates a reason for the *threatened* party, not a transfer of authority *to* them over the *threatener's* action.
      *   *Follow-up:* "Couldn't one argue that a threat *does* transfer a kind of conditional authority? 'If you don't pay, I will sue' might seem to give you authority to *prevent* my lawsuit by paying. How is that different from the authority transferred in a promise?"

  3.  **Distinguishing Promising (vs. Contracting):** "Contracts also create obligations, often involving promises. How does your account of promising as normative authority transfer distinguish a simple promise from a contractual agreement? Is a contract reducible to mutual promises plus something else, or does it involve a fundamentally different normative structure on your view?"
      *   *Likely Answer:* She might argue contracts involve reciprocal authority transfers plus institutional/conventional elements creating enforceability or third-party standing, whereas a pure promise is a bilateral authority transfer.
      *   *Follow-up:* "If contracts involve mutual promises, does that mean each party gains normative authority over the *other*? And if so, how does that differ structurally from two separate promises?"

  4.  **The Acceptance Condition & Capacity:** "Your account includes an acceptance condition: the transfer of authority succeeds only if the promisee has the capacity to accept it. You mention promises to infants, the dead, and the irreversibly comatose are binding only 'derivatively, if at all.' What constitutes this 'derivative' obligation? Who holds the authority if the intended promisee cannot?"
      *   *Likely Answer:* She might suggest the authority transfers to a trustee (e.g., parent, executor) acting in the promisee's interest, or that the obligation becomes a duty of fidelity owed *as if* to a capable promisee, but grounded in the promisor's initial commitment rather than active authority.
      *   *Follow-up:* "This seems to reintroduce a 'duty of fidelity' through the back door. If the obligation persists when the promisee *cannot* hold authority (like to the dead), isn't its source now something *other* than the transferred authority – perhaps precisely that independent duty your theory aimed to avoid?"

  5.  **The Acceptance Condition & Timing:** "Does the 'capacity to accept' require the promisee to *actually* accept, or merely *be capable* of accepting at the time of the promise? If merely capable, what happens if they later lose capacity (e.g., fall into a coma) *before* learning of the promise or demanding performance?"
      *   *Likely Answer:* She will likely say capacity at the time of the promise is crucial for the transfer to occur; subsequent loss of capacity doesn't invalidate the transferred authority, though the *exercise* of demanding/releasing might be affected.
      *   *Follow-up:* "If the promisee loses capacity after the promise but before learning of it, who possesses the normative authority to demand performance or release? Does it revert, or is it held in abeyance? Does this create practical problems for your view?"

  6.  **The Core Challenge: Breach Without Knowledge/Demand:** "A major test for any promise theory is explaining the wrongness of breaking a promise when the promisee *never learns* it was made or broken and *never demands performance* (e.g., I promise my deceased father I'll visit his grave yearly, but stop after year one; he never knew). If the obligation is constituted by the promisee's authority to demand, and that authority is never exercised or even known, why is breaking such a promise wrong? What *is* the wrong-making feature here?"
      *   *Likely Answer:* She might argue the transfer *itself* creates a standing normative relation; the wrong is in violating the terms of that transferred authority, akin to trespassing on property even if the owner is unaware. The authority exists whether exercised or not.
      *   *Follow-up:* "This seems perilously close to saying the promisor has a *duty* (to respect the transferred authority) independent of any actual demand. How does this avoid collapsing back into a first-order reason or duty of fidelity owed *to the promisee*, rather than being *constituted by* their authority?"

  7.  **The Promisee's Authority & Wrong-Kind-of-Reasons (WKOR):** "The promisee gains the authority to demand performance. Could the promisee have a 'wrong-kind-of-reason' to demand performance? For instance, they demand it solely to inflict hardship on the promisor, or because they enjoy wielding power, not because they actually want the thing promised. Does your account imply such a demand is normatively valid? If not, how do you block WKORs for the promisee's exercise of their authority?"
      *   *Likely Answer:* She might argue the transferred authority is *specific*: it's the authority to demand performance *of the promised action*, not a general power. Demands made for irrelevant reasons might be *possible* but not *normatively grounded* in the specific authority transferred by the promise. The authority is tied to the promise's content.
      *   *Follow-up:* "Does this mean the promisee's authority to demand is constrained by the *purpose* of the promise? How do you define that purpose without appealing to the promisor's intent or an independent norm governing promises, which your view seems to reject?"

  8.  **Release vs. Forgiveness:** "On your view, the promisee's authority to *release* the promisor is central. How does this 'release' differ conceptually from *forgiveness*? Could a promisee forgive a breach *without* releasing the obligation (e.g., 'I forgive you for breaking it, but you still owe me the money')? Conversely, can they release the obligation without forgiving the breach?"
      *   *Likely Answer:* She will likely distinguish: Release extinguishes the *obligation itself* prospectively or retroactively via the normative authority. Forgiveness is an affective/attitudinal response to the *wrongdoing* of breaching an (often still extant) obligation. They are logically separable.
      *   *Follow-up:* "If forgiveness is about the *wrong* of breach, but the obligation is *constituted* by the authority, does that mean forgiveness presupposes the *continuing existence* of the obligation? How can one forgive a wrong if releasing the obligation erases the normative basis for the wrong?"

  9.  **Scalability & Complex Promises:** "How does your account handle complex or conditional promises? For example, 'I promise to help you move next Saturday, unless my mother gets sick.' Does the transfer of authority include the power to demand performance even if the condition (mother's health) is met? Or is the authority transferred only conditionally?"
      *   *Likely Answer:* She will argue the scope of the transferred authority mirrors the scope of the promise. The promisee gains authority to demand performance *only* under the conditions specified (or implied) in the promise itself.
      *   *Follow-up:* "Who determines if the condition is met? Does the promisor retain sole interpretive authority over the condition, or does the transfer of authority give the promisee some standing to contest the promisor's claim that the condition (e.g., 'mother gets sick') is satisfied?"

  10. **Normative Foundations & Broader Implications:** "If promising fundamentally works by transferring normative authority, what does this imply about the *source* of our normative powers more generally? Does this view suggest that our ability to create special obligations for others (and grant them authority over us) is a primitive normative feature of agency, or does it depend on a deeper normative framework (like mutual recognition, social practices, etc.)?"
      *   *Likely Answer:* She might lean towards it being a primitive or fundamental normative power of agents capable of entering such relations, perhaps rooted in autonomy or recognition, rather than deriving solely from social practices.
      *   *Follow-up:* "If it's a primitive power, how do we explain why *this specific act* (uttering certain words with intent) triggers the transfer? If it depends on deeper norms (like recognition), doesn't that risk making the transferred authority *derivative* of those norms, potentially reintroducing something like a prior duty governing the transfer?"

  These questions are structured to push beyond exposition, directly engaging with the mechanics, implications, and potential pressure points of her novel account, while strictly adhering to the content and logic of the view she presents. The follow-ups anticipate common lines of defense or clarification to deepen the discussion dynamically. Good luck with the interview!
