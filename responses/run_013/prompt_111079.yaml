prompt: |-
  I'm part of a small reading group on moral responsibility that meets once a month, and next session it's my turn to present. Rather than walk everyone through the assigned reading again, I want to put a short paper of my own on the table and have it taken apart. So I'm sending you the draft in advance. What I want from you is not a summary, a survey of the literature, or a reading list — assume I already know the standard positions and don't need citations — but detailed comments of three kinds. First, on the argument: does it actually go through, or is there a place where I assert the conclusion instead of earning it? Second, on fairness: am I engaging Strawson's account of the reactive attitudes, or have I quietly built a version of it that no one holds in order to knock it down? Third, on the ending: is the principle I land on coherent, and does it survive the two objections I flag at the bottom? Be blunt. I would much rather find the hole now than in front of the group.

  Here's the draft. Its working title is "Who Answers for the Deed?"

  Strawson's insight, as I read it, is that holding someone responsible is not a metaphysical verdict about causation or free will but the exercise of a family of attitudes — resentment, indignation, gratitude, forgiveness — that we take up toward one another in the ordinary business of living together, and that these attitudes are keyed to the quality of will a person expresses in what they do. To hold someone responsible is to treat them as a participant in a relationship of demands rather than as an object to be managed or treated. I take that to be right and I am not trying to refute it. What I want to press is a question it leaves open: whose quality of will? The natural answer is the will of the agent at the time of the act. But our practice doesn't seem to work that way. Consider two men. Both, at twenty-two, took part in a campaign of political violence, and both personally beat a prisoner. The first, at sixty, has spent four decades in reparation, holds his former self in horror, and calls what he did unforgivable. The second, at sixty, still thinks it was justified. My attitudes toward them differ sharply, and they differ in a way that tracks not what each did but how each now stands toward what he did. This looks like what I've been calling the amnesty problem: the more thoroughly you disown your past, the more we let you off, so that responsibility can be dissolved by a sufficiently sincere act of self-revision.

  I distinguish two kinds of change. Renunciation: the agent keeps his evaluative framework and condemns the act within it. Conversion: the framework itself changes, so that the act is no longer condemned at all — the revolutionary who still believes, the person absorbed into a group that recodes the act as sacred. Renunciation I think Strawson's account can absorb, since apology and reparation are themselves participant attitudes and this is just the machinery working. Conversion is where the account strains. If the attitudes track the quality of will expressed, and the will expressed by the sixty-year-old convert is wholehearted endorsement, then by the letter of the account we should either feel no resentment at all, since no ill will is present now, or resent him all over again for the new act of endorsement. Neither matches what I actually feel, which is a steady, unrevised indignation at the original deed that neither the passage of time nor the change of heart touches. So I draw two conclusions. First, the reactive attitudes answer to something more than the agent's current self-relation: they answer to a claim the wronged party has on the wrongdoer, and that claim survives changes in either party's outlook. Second, what fixes whether resentment is warranted is not the agent's present self-understanding but the continuing relation between the parties. The principle I'd put it as: resentment is licensed by the continuing claim of the wronged, and is extinguished only by something that answers that claim — reparation, apology, forgiveness — never merely by the wrongdoer's change of heart.

  Two worries I already have. (a) If resentment answers to the victim's claim, what happens when there is no victim left to hold a claim — wrongs against the dead, against people who have forgiven and moved on, or against no one in particular, like desecrating a grave? I want to say the attitudes are still warranted there, but I can't see how my principle delivers that. (b) Self-resentment. I resent things I did at nineteen. On a relational account, self-directed resentment looks like a category error, since there is no second party, yet it seems central to moral life and Strawson's framework, built for the interpersonal case, has no obvious place for it. Maybe the right move is to treat self-resentment as derivative of the interpersonal attitude, but I don't have a story about what it derives from.

  Please tell me which of those two worries is fatal and which is just a loose end. I'd also like to know whether the renunciation/conversion distinction is doing real work or is just relabeling, whether the principle collapses into a victim-centered account of blame that can't handle wrongs with no identifiable victim, and what the strongest case against me looks like — ideally a case where I have to choose between saving the principle and keeping an intuition I care about. If you think a different ending is available that preserves more of what I want, sketch it. Please write your comments in American English, and don't worry about being diplomatic.
reasoning: |-
  Okay, the user is part of a reading group on moral responsibility and wants me to critique their draft paper. They're preparing for a presentation where they'll have their work dissected, so they need thorough, blunt feedback. Let me understand their core argument first.

  The draft builds on Strawson's reactive attitudes but challenges whose "quality of will" matters. The key example is two aging perpetrators: one who renounces their past violence, and one who converts to still endorse it. The user argues that our indignation persists regardless of current attitudes, suggesting responsibility stems from an enduring claim between wrongdoer and victim.

  Hmm, the user explicitly wants three types of feedback: argument validity, fairness to Strawson, and coherence of their proposed principle. They also flagged two specific worries - victimless wrongs and self-resentment - asking which is fatal. Plus they want to know if their renunciation/conversion distinction is substantive.

  First, argument flow: The leap from "indignation persists in conversion cases" to "therefore it's about enduring claims" feels unearned. There could be other explanations - like seeing the endorsement as compounding the original wrong. That's a hole in their logic chain. Also, the principle's phrasing ("licensed by the continuing claim") is ambiguous - is it the victim's psychological state or a normative entitlement? That vagueness causes problems later.

  On fairness: They're not strawmanning Strawson, but underplaying how his framework handles identity-over-time. Strawson's participant stance could accommodate enduring responsibility if we see the "relationship" as persisting beyond psychological change. The user dismisses this too quickly by assuming Strawson only cares about current will.

  The renunciation/conversion distinction... is it doing work? Actually yes - it effectively isolates cases where current attitudes diverge from past acts. But the "conversion" label might mislead if the person still approves the act. Maybe "revision" vs "persistence" would be clearer.

  Now the principle itself: It struggles badly with victimless wrongs. If there's no living victim holding a claim, how can resentment be licensed? Their suggested fixes (speaking for the dead, impersonal standards) contradict the relational core of their own principle. That's likely fatal without major reworking.

  Self-resentment is less catastrophic. It's a problem, but solvable by framing the self as both claimant and respondent in intrapersonal relationships. Other relational theorists do this, so it's a loose end needing development, not a dealbreaker.

  Strongest counterexample? Desecrating an unmarked grave. Intuition says it's blameworthy, but their principle can't explain why without a victim to hold a claim. They'd have to either abandon the intuition or smuggle in impersonal values - which undermines their Strawsonian foundation.

  Alternative ending? Could pivot to "relational standing" rather than claims: resentment preserves the victim's authority to demand accounting, which exists independently of their current attitudes. This handles forgiveness (victim waives the demand) and victimless wrongs (society holds standing). But that moves away from their emphasis on dyadic claims.

  The victimless wrongs issue is definitely the fatal one. Self-resentment can be patched. The conversion case is strong but needs tightening against "current endorsement as new wrongdoing" objections. And they should explicitly address why Strawson's existing framework can't absorb this - maybe by arguing that relationships inherently span time.

  User seems sharp - they've anticipated key problems. Their draft is provocative in a good way, but the foundation cracks when pressed. I'll structure feedback around their three requested areas, flag the victimless wrongs as critical, and offer the "relational standing" tweak as a salvage option.
answer: |-
  Here’s a line-by-line takedown of your draft. I’ll be blunt, per your request. Your core insight is provocative, but the argument has structural cracks, risks misrepresenting Strawson, and your principle collapses under its own exceptions. Let’s dissect:

  ### 1. **Argument Holes: Where You Assert, Don’t Earn**
     - **The "Amnesty Problem" Leap:** You assert that your differing attitudes toward the two 60-year-olds track *only* their current stance ("how each now stands toward what he did"). But is that true? Your indignation toward the unrepentant man likely *also* reflects his *current* ill will — his present endorsement *is* a new expression of poor quality of will. You dismiss this ("resent him all over again") too quickly. Why isn’t this just Strawson 101? **You haven’t shown why current endorsement isn’t fresh grounds for resentment under Strawson's model.** Your "steady indignation" might simply be resentment toward his *current* defiant stance, not a metaphysical anchor to the past deed.
     - **The "Something More" Assertion:** You conclude indignation answers to "a claim the wronged party has on the wrongdoer." But this jumps from a psychological observation ("I still feel indignation") to a normative principle without justification. *Why* must the persistence of feeling imply an objective, enduring claim? Couldn’t it be psychological inertia, a commitment to justice, or (as Strawson might suggest) the persistence of the *relationship* itself? You assert the claim exists but don’t argue for its existence or nature.
     - **The Renunciation/Conversion Distinction:** It *is* doing work, but **you don’t prove conversion breaks Strawson’s model.** If the convert's *current* quality of will is endorsement, and that endorsement causes harm (e.g., perpetuating justification of violence, traumatizing victims anew), reactive attitudes apply directly. If it causes no harm, *should* we feel indignation? Your intuition persists, but is that a flaw in Strawson or in your intuition? You assume the latter without argument.

  ### 2. **Fairness to Strawson: Close, But Loading the Dice**
     - You accurately summarize Strawson’s core ("attitudes keyed to quality of will," "participant in a relationship"). No strawman there.
     - **Where You Stray:** You imply Strawson’s model *only* cares about the will *at the time of the act*. This is subtly unfair. Strawson’s "participant stance" is a *dynamic, ongoing posture* within a relationship. The relationship itself persists over time. Apology, forgiveness, and yes, *ongoing defiance*, are *part* of that relationship’s unfolding. Strawson can easily say: "We resent the unrepentant man *now* because his *current* quality of will (defiance) is offensive within our *ongoing* relationship." **You’re artificially freezing the "will" at T1 (the act) and ignoring how Strawson’s framework handles the evolving relationship.** Your "conversion" case is less a problem for Strawson and more a test of whether the *relationship* has been repaired or further damaged by later stances.

  ### 3. **The Principle & Its Fatal Flaws**
     Your Principle: *"Resentment is licensed by the continuing claim of the wronged, and is extinguished only by something that answers that claim — reparation, apology, forgiveness — never merely by the wrongdoer’s change of heart."*

     - **Coherence:** It’s coherent internally but **radically narrows responsibility**. It makes resentment entirely hostage to the victim’s (or claimant’s) ongoing normative state. This severs blame from the *wrongdoer’s* current moral status in a way that feels alien to our practices.
     - **Worry (a) - Victimless Wrongs: FATAL.**
          *   **The Problem:** Your principle *requires* a "continuing claim of the wronged." No identifiable victim holding a claim? No warranted resentment. But desecrating a grave *feels* blameworthy. Polluting a river harms no *specific* person identifiably "holding a claim" *now*. Wrongs against the dead? The victim literally *cannot* hold a claim.
          *   **Why It’s Fatal:** You admit your principle can’t deliver warranted attitudes here. Attempts to fix it ("society holds the claim," "the dead have claims") *abandon your principle*. If "society" holds the claim, resentment is licensed by *society's* perceived claim, not the victim's. If "impersonal values" license it, you’ve smuggled in non-relational foundations. **Your principle cannot account for core cases of blame without self-destructing or abandoning its victim-centric core.**
     - **Worry (b) - Self-Resentment: A LOOSE END (Solvable).**
          *   **The Problem:** Self-resentment *is* awkward for your strictly dyadic principle. Who is the "wronged party" holding the claim against me? Myself?
          *   **Why It’s Solvable:** Relational accounts *can* handle this by seeing the self as temporally extended or having multiple "standpoints." The "me now" holds a claim against the "me then" for violating our shared standards. Strawsonians (like Gary Watson) develop this. It’s a loose end needing development in your paper, not a fatal flaw. **Derivation is possible:** Self-resentment could be the internalization of the interpersonal stance – blaming myself *as if* I were another holding me accountable. This fits Strawson’s focus on the *social* framework grounding attitudes.

  ### The Strongest Case Against You: The Unmourned Grave
     > *Imagine someone desecrates an anonymous, centuries-old grave in a long-forgotten cemetery. No living descendants exist. No community claims cultural ties to it. The act is discovered, the perpetrator identified, and expresses utter indifference ("Just an old bone pile").*  
     - **Your Dilemma:**
          1.  **Save the Principle:** No identifiable victim holds a continuing claim. Therefore, resentment is unwarranted. But this clashes violently with the strong intuition that this act is morally contemptible *and* the perpetrator's indifference makes it worse.
          2.  **Keep the Intuition:** Argue resentment *is* warranted. But then you must abandon your principle. You need another foundation – impersonal moral norms, duties to the dead qua dead, societal values – which contradicts your Strawsonian, relational starting point and makes your "continuing claim" redundant.

  ### Can This Be Salvaged? A Possible Alternative Ending
     Your core intuition (disowning the past doesn't dissolve responsibility) is powerful. Ditch the "victim's claim" principle; it’s the weakest link. Instead, **double down on the *relational persistence* within Strawson:**

     *   **Revised Principle:** *"Resentment is a stance appropriate within an ongoing moral relationship. It is triggered by past wrongs expressing ill will, but its warrant depends on the *current state of that relationship*. It is extinguished not by mere psychological change in the wrongdoer, but by acts (apology, reparation, forgiveness) that *repair the relationship* or conclusively end it. Enduring defiance (*your 'conversion'*) perpetuates the relationship in a damaged state, sustaining resentment. True dissociation requires answering for the past, not just disowning it."*

     *   **Handles Victimless Wrongs:** The "relationship" can be with the community, society, or the moral order itself. Desecrating the grave damages our shared relationship to history, the dead, or public values. Society, as a participant in the moral community, can hold the claim.
     *   **Handles Self-Resentment:** The relationship is with one's enduring self/values.
     *   **Handles Conversion:** The unrepentant wrongdoer actively sustains the damaged relationship through ongoing endorsement. The repentant one who answers *may* repair it. Mere disowning without answering leaves the relationship in limbo.
     *   **Fairer to Strawson:** Builds directly on the participant stance as an ongoing, dynamic framework. It makes resentment responsive to the *current* relational context shaped by the past, not magically bound *only* to the past deed or *only* to a victim's present claim.

  ### Bottom Line
  1.  **Fix the Argument:** Engage the objection that current endorsement *is* grounds for current resentment. Don’t assert the "enduring claim"; argue for it or reframe.
  2.  **Clarify Strawson:** Emphasize the *ongoing, temporal nature* of the participant stance/relationship. Your "conversion" case challenges a simplistic reading, not necessarily Strawson himself.
  3.  **ABANDON THE ORIGINAL PRINCIPLE.** Worry (a) is fatal. Worry (b) is fixable. The victimless wrongs sink it.
  4.  **Pivot to the Alternative:** The "persistent relationship" reframe saves your core insight, handles your cases and the counterexamples, and stays closer to Strawson. It makes the renunciation/conversion distinction matter: renunciation *aims* at repair; conversion *is* ongoing damage.

  This draft has the spark of a serious challenge. It forces the question: "What *sustains* blame over time if not just the past act or current attitude?" But as is, the answer you give ("the victim's claim") can't bear the weight. Tighten the argument against Strawson, scrap the principle, and go relational-persistence. Then your group will have something truly combustible to tear into. Good luck.
