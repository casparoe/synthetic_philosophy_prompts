  However, note: the choice of description language (encoding) is critical and subjective. We'll make it as principled as possible by using standardized encodings and by making the encoding choices explicit and subject to domain knowledge.

  The procedure will be broken down into steps. At each step, we may have to stop and involve a domain expert (e.g., the PI) for a judgment call, especially when the encoding is not obvious.

  Key principles:
  - We want to avoid overfitting by penalizing model complexity.
