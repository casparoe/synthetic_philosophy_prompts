answer: |-
  ### Brainstorm: Core Concepts & Their Status
  - **Occam's Razor**: Claims simpler models should be preferred *if they explain the data equally well*. "Simplicity" is not absolute—it depends on the description language.  
  - **Solomonoff Induction**: Uses Kolmogorov complexity (shortest program on a Universal Turing Machine) to define simplicity. Gives a *theoretical* framework for ideal induction. **Does not give**: computable methods, finite-data guarantees, or encoding-independent simplicity.  
  - **Settled**: 
    - Overfitting is real; out-of-sample testing is non-negotiable. 
    - Two-part MDL (model + data) is a principled approximation. 
    - Invariance theorem: Kolmogorov complexity is language-independent *up to a constant*.  
  - **Contested**: 
    - How to define "simplicity" with finite data (the constant matters!). 
    - Choice of description language (encoding) is subjective and domain-dependent. 
    - Whether cross-validation or marginal likelihood is "better" for small samples.  

  ---

  ### Procedure: Principled Model Comparison in 1 Hour (Python)
  **Core Idea**: Approximate two-part MDL using **cross-validated likelihood** (data fit) + **parameter encoding cost** (model complexity). Encoding choices are made explicit and deferred to domain experts when contested.  

  #### Ordered Steps:
  1. **Define the loss function and data splitting**  
     - Fix a loss (e.g., log-loss for classification, MSE for regression).  
     - Split data into 5 equal folds (if `n=200`, fold size=40).  
     - *Stop if loss is undefined*: Hand to PI to specify the loss.  

  2. **Specify model parameters and ranges**  
     - For each model, list all free parameters and plausible ranges (e.g., weights in `[-10, 10]`, bias in `[-5, 5]`).  
     - *Stop if ranges unknown*: Hand to PI/domain expert to set ranges.  

  3. **Set encoding precision**  
     - Default: Precision `δ = 0.01` (100 bins per unit).  
     - Compute bits per parameter: `bits = log2((max - min) / δ)`.  
     - *Judgment call*: If a parameter is interpretable (e.g., a probability), use `δ=0.001`; else, keep `δ=0.01`.  

  4. **Compute model description length**  
     - For model `M` with parameters `θ`:  
       ```python  
       def model_bits(M, δ=0.01):
           total_bits = 0
           for param in M.params:
               bits = np.log2((param.max - param.min) / δ)
               total_bits += bits
           return total_bits
       ```  
     - *No stops*: Purely mechanical once ranges/precision are set.  

  5. **Compute data description length**  
     - For each fold `i`:  
       - Train `M` on 4 folds.  
       - Compute **negative log-likelihood** (NLL) on fold `i` using the loss from Step 1.  
     - Average NLL over all 5 folds: `avg_nll`.  
     - Total data bits: `data_bits = n * avg_nll / ln(2)` (converts nats → bits).  
     - *Stop if models fail to train*: Hand to PI to simplify models or adjust training.  

  6. **Total description length**  
     - `total_bits(M) = model_bits(M) + data_bits(M)`  

  7. **Compare models**  
     - If `|total_bits(M1) - total_bits(M2)| < 5 bits`: Models are **indistinguishable** at this `n`.  
     - Else: Prefer the model with **smaller total_bits**.  
     - *Judgment call*: Threshold of 5 bits ≈ "strong evidence" in MDL literature.  

  8. **Sensitivity analysis (if results close)**  
     - Vary `δ` from `0.001` to `0.1` in Step 3.  
     - If the preferred model flips: The winner depends **entirely on encoding choices**. Hand to PI to justify `δ`.  

  ---

  ### Case Studies
  #### Case 1: Logistic Regression (LR) vs. Neural Net (NN)  
  - **You want the NN to win** (it’s your project), but...  
  - **Step 1**: Log-loss, 5-fold CV.  
  - **Step 2**:  
    - LR: 6 params (weights `∈ [-5,5]`, bias `∈ [-2,2]`).  
    - NN: 25 params (all weights `∈ [-3,3]`).  
  - **Step 3**: `δ=0.01` (default).  
  - **Step 4**:  
    - `model_bits(LR) = 6*log2(700) ≈ 62 bits`  
    - `model_bits(NN) = 25*log2(600) ≈ 265 bits`  
  - **Step 5**:  
    - `data_bits(LR) = 200 * 0.45 / ln(2) ≈ 130 bits`  
    - `data_bits(NN) = 200 * 0.42 / ln(2) ≈ 121 bits`  
  - **Step 6**:  
    - `total_bits(LR) = 62 + 130 = 192`  
    - `total_bits(NN) = 265 + 121 = 386`  
  - **Result**: **LR wins by 194 bits** (NN overfits; complexity penalty dominates).  
  - *Why you won’t like this*: Your NN loses despite better fit. Encoding cost killed it.  

  ---

  #### Case 2: Two Models, Same Params, Different Forms  
  - **Model A**: `y = a * exp(-b * x)`  
  - **Model B**: `y = a / (1 + b * x)`  
  - Same 2 params: `a ∈ [0,10]`, `b ∈ [0,5]`, `δ=0.01`.  
  - **Step 4**: `model_bits(A) = model_bits(B) = 2*log2(1000) ≈ 20 bits`.  
  - **Step 5**:  
    - `data_bits(A) = 200 * 0.55 / ln(2) ≈ 159 bits`  
    - `data_bits(B) = 200 * 0.52 / ln(2) ≈ 150 bits`  
  - **Step 6**:  
    - `total_bits(A) = 20 + 159 = 179`  
    - `total_bits(B) = 20 + 150 = 170` → **B wins by 9 bits**.  
  - **Sensitivity**: Vary `δ` to `0.001`:  
    - `model_bits = 2*log2(10,000) ≈ 27 bits`  
    - B still wins (gap shrinks to 6 bits).  
  - **Result**: **B wins**, but gap is small. If PI argues Model A is more plausible in the domain, override the result.  

  ---

  #### Case 3: Indistinguishable Models  
  - Two variants of a memory model with 4 params each.  
  - **Step 2**: Same ranges, `δ=0.01` → `model_bits = 4*log2(500) ≈ 36 bits`.  
  - **Step 5**:  
    - `data_bits(M1) = 200 * 0.61 / ln(2) ≈ 176 bits`  
    - `data_bits(M2) = 200 * 0.605 / ln(2) ≈ 175 bits`  
  - **Step 6**: `total_bits(M1)=212`, `total_bits(M2)=211` → **difference = 1 bit < 5 bits**.  
  - **Result**: **Indistinguishable at this `n`**. Decision deferred to interpretability or future data.  

  ---

  ### What the Procedure Can’t Do  
  1. **Resolve encoding disputes**: The choice of `δ` and parameter ranges is subjective and PI-dependent.  
  2. **Handle non-i.i.d. data**: Assumes cross-validation is valid; fails for time series/spatial data.  
  3. **Compare non-nested models** with structural differences (e.g., LR vs. decision tree).  
  4. **Escape the invariance theorem**: The "constant" in Kolmogorov complexity is ignored; this is the price of computability.  
  5. **Replace domain knowledge**: Encoding choices and final calls on ties require expert judgment.  

  ### Judgment Calls in Lab Coats  
  - Steps 3 (precision `δ`), 8 (varying `δ`), and all PI handoffs are **subjective**.  
  - The 5-bit threshold in Step 7 is heuristic (based on MDL literature).  
  - Loss function (Step 1) must align with scientific goals—this is often contested.  

  ### Final Word  
  This procedure forces explicit encoding choices and exposes where "model wars" are really about priors (not data). It won’t settle all fights, but it will make the fights more honest.
