  Settled vs. contested:
  - Settled: Overfitting is a real problem, and models must be evaluated on out-of-sample data. Also, the trade-off between model complexity and fit is necessary.
  - Contested: How to exactly measure model complexity (especially for non-parametric models) and how to choose the prior (encoding) for the model parameters. The invariance theorem says that the choice of universal Turing machine only changes the complexity by a constant, but in practice with finite data, that constant matters and the choice of encoding (which is like choosing a prior) is subjective. Also, in the finite data regime, the notion of simplicity is not absolute and depends on the encoding.

