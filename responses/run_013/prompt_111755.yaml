  I'm a third year undergrad doing a course on formal theories of induction — we've just done Solomonoff induction, Kolmogorov complexity, the invariance theorem, minimum description length, and the Bayesian Occam factor stuff. I also RA two days a week in a lab that fits models to behavioural data, and I keep getting stuck being the referee in the same fight. Someone proposes a fancier model, it beats our old one in-sample by a mile, someone says thats just overfitting, and then we argue for a month with no principled way to settle it. This happens maybe once a month and the stakes are real — a wrong call means a PhD student burns half a year on a model that was never earning its keep.

  Act as a philosopher of science who also actually fits models for a living and has watched people get this wrong. Before you write anything, brainstorm out loud for a bit: what is Occam's razor even claiming, what does Solomonoff induction actually give you and what does it not, and which parts of this are settled vs. genuinely contested among the people who work on it. Then write me the procedure.

  I need something my lab can run in about an hour, in Python, with no theorist in the room. So: an ordered list of steps — the questions to ask in order, what counts as a good enough answer to each, where it stops and says no, and where it has to hand the decision to a person (our PI, or whoever knows the domain) because what's left is a question about the encoding, the prior, or the loss rather than about the data. Don't tell me to compute Kolmogorov complexity, I know it's uncomputable and I know you know. I want the honest computable stand-in plus an account of how much is lost in the substitution. And the part I most want spelled out is how we're supposed to choose the description language, because my suspicion is that all the real disagreement in our lab is hiding in that choice and we're pretending it's about the data.

  Then run it on three cases and show the steps firing:

  1) hand-picked logistic regression vs. a small neural net, n is about 200. Full disclosure, the net is my project and I want it to win.
  2) two accounts of the same behavioural effect with the same number of free parameters but different functional forms, where the choice of encoding seems to flip which one wins.
  3) a case where the two models are genuinely indistinguishable at our sample size.

  I want at least one of these to come out in a way I won't like, and I want you to point at which steps are judgment calls wearing a lab coat. Finish with what the procedure can't do.

  Last thing: keep settled and contested separate. Some of what you'll want to say about the invariance theorem, and about whether simplicity is even well defined in the finite-data regime, is one camp's view rather than consensus, and I'd rather you flag that than hand me a procedure that looks more authoritative than the field actually is. No citations or reading lists, just the ideas — I dont have web access anyway.
