  Okay, let me tackle this user's query. They're a third-year undergrad in a philosophy of probability course, noticing a disconnect between the interpretations of probability they're studying and the statistical practices in their psychology and medical courses. Specifically, they're confused about NHST and confidence intervals. 

  First, I need to unpack the official vs. actual use of p-values and CIs. Officially, frequentism says p-values are about long-run error rates, not probabilities of hypotheses. But in practice, people treat p=0.03 as "3% chance this is a fluke," which sounds Bayesian. The user wants to know if this is sloppiness or an unacknowledged philosophical commitment.

  The user also mentions the inconsistency between frequentist and Bayesian results, like when a frequentist test rejects the null but a Bayesian analysis favors it. They’re asking which question scientific practice is actually answering. Plus, they want to know what would change if practices were consistently frequentist or Bayesian.

  I should start by clarifying the official frequentist stance: p-values as long-run error rates under the null, and CIs as coverage probabilities. Then contrast that with how they're used—misinterpretations as posterior probabilities. The key is that practice isn't formally Bayesian but relies on Bayesian-like intuitions. This creates tension but isn't necessarily inconsistent if we see it as a pragmatic blend.

  Next, address the Lindley's paradox example. Explain that frequentist tests focus on detecting any effect, while Bayesians consider the plausibility of the null given the data. Scientific practice leans towards frequentist methods but often misinterprets them in a Bayesian manner. This leads to internal inconsistency in interpretation, not in the math itself.

  For the philosophical commitments, practice doesn't strictly require any interpretation but fits best with hybrid views. Frequentism is necessary for the mechanics, but Bayesian interpretations sneak in. Propensity could work if seen as stable tendencies, but it's not explicit. Pure subjectivism is ruled out because practice requires error control.

  Then, explore what changes would occur under consistent frequentism: emphasize long-run properties, avoid probabilistic hypothesis language, use tolerance intervals, adjust for multiple comparisons, and possibly switch to severity assessments. For Bayesian consistency: report posterior probabilities, use credible intervals, incorporate informative priors, pre-register priors and models, and abandon p-values.

  The user’s deeper needs include understanding the implicit philosophy in their field, reconciling theory with practice, and grasping practical implications of different philosophies. They might also be preparing for academic work or research, needing to justify methods or design studies. Ensuring clarity on these points will help them apply philosophical concepts to real-world stats.
answer: |-
  Your observation cuts to the heart of a profound tension in applied statistics. The standard NHST/confidence interval practice doesn't cleanly align with any *pure* interpretation of probability because it **operationalizes a hybrid, often incoherent, blend of frequentist machinery with subjectivist/propensity intuitions**. Here's a dissection of its commitments and inconsistencies:

  **1. The Official Stance vs. Actual Practice:**
  *   **Strict Presupposition (Frequentist):** The *mathematical formalism* is purely frequentist.
      *   **p-value:** Defined as P(data | H₀) or more precisely, P(observed test statistic or more extreme | H₀ true, model assumptions). This is a *long-run relative frequency*: if H₀ were true and the experiment repeated infinitely, the proportion of times you'd see results this extreme or worse.
      *   **95% Confidence Interval (CI):** Defined by a procedure that, if repeated infinitely on *new* data from the *same* data-generating process, would contain the true parameter value 95% of the time. The probability statement is about the *procedure*, not the *specific interval*.
      *   **Ruling Out:** This formalism *explicitly rules out* assigning probabilities to hypotheses (H₀ or Hₐ) or parameters. "Probability" here only pertains to data distributions given fixed hypotheses/parameters.

  *   **Actual Interpretation (Subjectivist/Propensity Hybrid):** Practitioners *routinely* transgress the official stance:
      *   **p-value as "Probability of Fluke":** Reading p=0.03 as "3% chance H₀ is true" (P(H₀ | data)) is a *subjectivist Bayesian* interpretation (posterior probability). Reading it as "3% chance this specific result is due to random chance" implies a *propensity* of the experimental setup to produce a misleading result *this time*.
      *   **CI as "Probability of Containing Truth":** Reading a specific CI as having "95% probability of containing the true value" is directly the *subjectivist Bayesian* interpretation of a *credible interval*. It treats the parameter as random, not the interval procedure.

  **2. Internal Inconsistency (The Lindley's Paradox Point):**
  You've identified a critical flaw. Lindley's paradox highlights that frequentist NHST and Bayesian methods answer fundamentally different questions, even with the same data:

  *   **Frequentist NHST:** Asks "How surprising is this data *if* H₀ (θ=θ₀) is true?" It focuses on detecting *any* departure from H₀, no matter how tiny. A small p-value means the data is *incompatible* with H₀ under the model. It **does not** quantify evidence *for* H₀.
  *   **Bayesian Analysis:** Asks "How much does this data *change* the relative plausibility of H₀ vs. Hₐ?" With a vague prior, strong evidence *for* H₀ arises when the data is much *more likely* under H₀ than under *plausible* values within Hₐ (even if the point θ=θ₀ itself is unlikely). It directly compares hypotheses.

  **Which question is scientific practice answering?** **Neither consistently.** Formally, it *uses* the frequentist machinery (answering the first question). However, the *interpretation* practitioners *desire* and often *give* ("probability H₀ is false," "confidence this interval contains the truth") is fundamentally the *Bayesian* question. **This is the core inconsistency:** The practice *generates* a frequentist number (p-value) but *interprets* it as a Bayesian probability. The CI is *constructed* as a frequentist object but *interpreted* as a Bayesian one. The widespread misinterpretation isn't *just* sloppiness; it reveals a *deep-seated desire* for the Bayesian answer ("How probable is the hypothesis?") that the frequentist machinery cannot provide.

  **3. Philosophical Commitments & Compatibility:**
  *   **Cannot Avoid:** Frequentist *machinery*. The math of p-values and CIs *is* defined via long-run frequencies.
  *   **Fits Comfortably With:**
      *   **Frequentism:** For the *formal definitions and calculations*.
      *   **Propensity:** If propensities are viewed as stable tendencies of the experimental setup generating long-run frequencies, the *error rates* (Type I/II) can be seen as propensities. The misinterpreted p-value/CI could (misleadingly) be seen as a propensity of *this specific* setup.
      *   **Weak Subjectivism/Bayesianism:** The *interpretive desire* aligns with subjectivism. The practice *could be reconciled* with a "default" or "reference" Bayesian approach using non-informative priors for CIs (where 95% credible intervals often numerically match 95% CIs in simple cases) or "Bayes factors lite" interpretations of p-values (though this is fraught).
  *   **Ruled Out / Difficult to Reconcile:**
      *   **Strict Frequentism:** Is ruled out *in practice* by the ubiquitous misinterpretations. Strict frequentism forbids the probabilistic language applied to hypotheses/specific intervals that practitioners crave.
      *   **Strong Subjectivism/Personalist Bayesianism:** Is ruled out by the reliance on standardized methods (α=0.05), fixed nulls, and the *rejection* of incorporating explicit, varied prior beliefs into the core reporting metric (p-value/CI). The practice aims for "objectivity" via standardized procedures, conflicting with personal probability.

  **4. What Would Change Under Consistent Philosophies:**

  *   **Consistent Frequentism:**
      *   **Reporting:** Emphasis shifts from isolated p-values/CIs to *long-run error control*. Reports would focus on:
          *   Pre-specified α and justification (not just 0.05).
          *   Pre-specified power analysis and achieved power.
          *   Explicit discussion of Type S (sign error) and Type M (magnitude error) risks, especially with small effects.
          *   Replication emphasis (long-run performance validation).
          *   *Severity assessments* (Mayo): "Having passed this test, what discrepancies from H₀ *could* we have detected with high probability?" (More informative than a p-value).
      *   **Phrasing:** "We reject H₀ at the α=0.05 level" (emphasizing the *decision procedure*). "This 95% CI was generated by a procedure with 95% coverage probability *in the long run*." **Crucially:** Eliminate "probability H₀ is true," "chance this is a fluke," "confidence this interval contains truth."
      *   **Design/Pre-reg:** Heightened focus on defining *minimally interesting effect sizes* for power, strict control of multiple comparisons/familywise error rates (FWER) or false discovery rates (FDR), large sample sizes for precise estimation (narrow CIs). Pre-registration becomes vital for defining the error rates *before* seeing data.
      *   **Result:** More robust but less intuitively satisfying answers about specific findings. Less "significant!" hype, more "we detected a discrepancy from H₀ exceeding d, with low long-run false positive rate."

  *   **Consistent Subjectivism/Bayesianism:**
      *   **Reporting:** **P-values and standard CIs disappear.** Core reports become:
          *   Posterior distributions for parameters (plots are ideal).
          *   Credible Intervals (e.g., 95% HDI - Highest Density Interval).
          *   Bayes Factors (BF₁₀) comparing H₀ to Hₐ (or model probabilities).
          *   Probabilities for hypotheses (P(H₀ | data), P(θ > δ | data) etc.).
          *   *Explicit statement of priors used* (crucially, including sensitivity analyses).
      *   **Phrasing:** "Given the data and our prior, the probability H₀ is true is P." "There is a 95% probability θ lies within [a, b]." "The data are BF₁₀ times more likely under H₁ than under H₀."
      *   **Design/Pre-reg:** Pre-registration shifts to specifying *analysis priors* (informative or reference) *before data collection*. Design focuses on ensuring the data will be sufficiently informative to update priors meaningfully (overpowering weak priors). Power analysis is replaced by *Bayesian Assurance* (probability of achieving a desired posterior characteristic, e.g., P(θ > 0) > 0.95). Collaboration requires justifying/negotiating priors.
      *   **Result:** Direct probabilistic answers to the questions practitioners *want* to ask ("How likely is H₀?"). Requires confronting subjectivity (priors) head-on. Avoids Lindley's paradox by directly comparing H₀ to Hₐ via Bayes factors.

  **Conclusion:** The standard NHST/CI practice is philosophically schizophrenic. It is **formally frequentist but interpretively subjectivist**. This creates unavoidable internal tension, exemplified by Lindley's paradox – the practice uses methods designed to answer "Is the data surprising under H₀?" but interprets the results as answering "How likely is H₀ (or Hₐ) given the data?". The practice *cannot avoid* the frequentist mathematical foundation. However, its widespread interpretation and the scientific desire it reveals are fundamentally at odds with strict frequentism and align more with a propensity-inclined subjectivism or default Bayesianism. Achieving consistency requires a fundamental shift: either embracing the long-run frequency interpretation fully (changing how results are communicated and valued) or adopting a Bayesian framework explicitly (changing the core metrics reported and the role of prior beliefs). The current hybrid state persists largely because it offers the *illusion* of the Bayesian answer ("probability it's real") with the perceived *objectivity* of frequentist machinery – an illusion that masks significant inferential risks.
