answer: |-
  ### Practical Model Selection Procedure Based on Simplicity Theory  
  **Core Bet:** We assume the world is *compressible* (regular patterns exist). No-free-lunch results remind us that no method is universally optimal—this procedure bets on real-world regularity. If the data is adversarial or structureless, it fails.  

  **Procedure Rules:**  
  1. **Standardize Representations First**  
     - *Action:* Fix data encoding (units, precision) and model specification format *before* any comparison.  
     - *Good Enough:* Same file structure for all models (e.g., CSV with 4 decimal places).  
     - *Stop If:* Models can’t share encoding (e.g., one requires logs, the other levels).  
     - *Escalate To You:* Judgment call on "natural" encoding (e.g., use domain standards).  

  2. **Compute Description Length (DL)**  
     - *Action:* Calculate DL for each model as:  
       `DL = DL_model + DL_data_given_model`  
       - **DL_model:** Compressed size (gzip) of model specs (e.g., equations + parameters).  
       - **DL_data_given_model:** Compressed size (gzip) of residuals (actual – predicted) on held-out data.  
     - *Good Enough:* Use gzip at default settings; residuals rounded to 4 decimals.  
     - *Stop If:* Held-out data unavailable.  
     - *Escalate To You:* If residuals show patterns (plot them—if non-random, model is flawed).  

  3. **Compare DLs and Check Robustness**  
     - *Action:*  
       - Prefer model with **smaller DL**.  
       - If DL difference < 5% of the larger DL, rerun with 3/5 decimal places in residuals.  
     - *Good Enough:* Same "winner" across precisions; difference > 5%.  
     - *Stop If:* Winner flips with representation changes (e.g., decimal places or unit conversions).  
     - *Escalate To You:* Tie, small DL difference, or sensitivity to encoding.  

  4. **Audit for Overfitting**  
     - *Action:* Ensure winning model’s residuals are:  
       - Uncorrelated (no patterns in residual plot).  
       - Smaller than a "null model" (e.g., historical average).  
     - *Good Enough:* Residuals pass eye test for randomness.  
     - *Stop If:* Residuals worse than null model.  
     - *Escalate To You:* Patterns in residuals suggest missing variables.  

  **Analyst Queries Answered:**  
  - **Gzipping model+data:** *Legitimate approximation but flawed.* It conflates model and data complexity. Better to split specs and residuals (step 2).  
  - **No-free-lunch objection:** *Valid but irrelevant.* We bet the world isn’t adversarial; simplicity works *if* patterns exist. Cite real-world success (e.g., science).  

  ---  
  ### Case Applications  
  **Case (a): Two Weather Models**  
  - **Fat model:** 3× parameters, marginally better on held-out data.  
  - **Procedure:**  
    1. Standardize encoding (e.g., temperature in Celsius, 4 decimals).  
    2. Compute DL_fat = DL_specs_fat + DL_residuals_fat  
       DL_slim = DL_specs_slim + DL_residuals_slim  
    3. DL_specs_fat >> DL_specs_slim (more params), but DL_residuals_fat slightly smaller.  
  - **Outcome:**  
    - If DL_fat > DL_slim (likely—specs cost dominates), choose slim model.  
    - If DL difference < 5%, check robustness: slim still wins unless residuals flip outcome.  
  - **Judgment:** Fat model’s edge too small; penalize complexity.  

  **Case (b): "One Hidden Actor" Hypothesis**  
  - **Client’s model:** Short spec, but residuals may be large.  
  - **Procedure:**  
    1. Write specs (e.g., "Actor X drives all changes") and compute residuals vs. held-out data.  
    2. DL_model tiny, but DL_residuals huge (if hypothesis ignores data nuances).  
  - **Outcome:**  
    - Compare to a rival model (e.g., multi-factor regression).  
    - Client’s model wins *only* if residuals compress well (unlikely).  
  - **Judgment:** Simplicity isn’t free—must fit data. Reject client’s model unless residuals inexplicably small.  

  **Case (c): Encoding Flips Simplicity**  
  - **E.g.,** Switching inflation from "percent" to "log-change" flips which model has smaller DL.  
  - **Procedure:**  
    1. Standardize encoding upfront (step 1).  
    2. If flipping occurs during robustness check (step 3), stop—procedure invalid for this comparison.  
  - **Outcome:**  
    - Escalate to you. Choose encoding that matches domain intuition (e.g., percent for inflation).  
  - **Judgment:** Procedure fails here; use business context to pick encoding.  

  ---  
  ### What the Procedure Can’t Do  
  1. **Handle Adversarial Data:** Fails if patterns are random (no-free-lunch).  
  2. **Replace Domain Knowledge:** Encoding choices (step 1) and residual audits (step 4) require judgment.  
  3. **Compare Non-Parametric Models:** Gzip struggles with complex specs (e.g., random forests).  
  4. **Resolve Tiny Differences:** DL differences < 5% are noise; tie-breakers needed.  
  5. **Ignore Representation Bias:** If results flip with decimals/units, the models are likely unidentifiable.  

  **Final Tip:** Train analysts to write model specs concisely (e.g., `y = a*x + b` vs. prose). Use this for *routine* calls; escalate edge cases to you.
