prompt: |-
  I am a novelist. My trade has been to find sentences for the predicaments people usually live through without words, and I have long believed that the right sentence is a kind of clarity. I am writing because I am now inside a predicament I cannot sentence my way out of, and I want a verdict rather than sympathy.

  Two years ago I was given a diagnosis that will most likely end my life within a few years, though the interval and the quality of that time are uncertain. I have a partner and a young child. My income has always been modest and irregular, and the illness has made it worse. What I do have is a life insurance policy, taken out years ago when I was healthy, whose face value would matter a great deal to my family, and whose premiums I will struggle to keep paying.

  A firm has offered to buy the policy outright. They would pay me a lump sum now — a fraction of the face value, but more than I could ever pay in premiums, and real money in the hand while I can still put it to use. In exchange, they collect the full amount when I die. The representative was decent and unhurried; she said the point of her business is to help people unlock the value of an asset that would otherwise go to waste, and that if I decline, the policy may simply lapse and my family may end up with nothing.

  The lawyers have told me it is legal; I am not asking about that. What I cannot settle is whether I should sign. My discomfort is not really about the money, which we need. It is that I would be selling, at a discount, the last thing I own that is worth anything, and handing a stranger a financial interest in the date of my death. When I imagine the fine print, I imagine someone who profits the sooner I stop being alive.

  My closest friend is the least sentimental person I know. He says my hesitation is a taboo wearing the costume of an ethic — that the money is real, my revulsion is inherited superstition, and a dying man who refuses cash for his family because the arrangement gives him the creeps is indulging his own taste at their expense. He may be right. He is usually right about facts and rarely about feelings, and I can no longer tell which one this is.

  I would like you to tell me whether he is right. If he is not, I want the argument that survives his objection, stated plainly enough that I could put it in the mouth of a character without flinching — not a slogan about dignity, but the reason this transaction is or is not one I should make. Two things in particular I would like you to address. First, does it matter that the buyer gains only by my death, or is that simply the shape of any insurance and not a moral problem in itself? Second, would your answer change if the contract barred the buyer from any contact with my doctors, my care, or my household — does that dissolve the objection, or only make it more comfortable to ignore? Please end with a verdict rather than a survey.
reasoning: |-
  Okay, the user is a novelist facing a terminal illness, grappling with whether to sell their life insurance policy to a third party. They need a clear verdict, not sympathy. Let me unpack their core concerns.

  First, the ethical dilemma: selling the policy feels like commodifying their death, especially since the buyer profits from their demise. Their friend argues this is just superstition. The user wants to know if that financial incentive is inherently problematic or just how insurance works. 

  Then there's the practical layer: their family's financial security. The lump sum could provide immediate relief, but at the cost of reducing the death benefit. And the emotional weight—handing a stranger a stake in their death timeline feels violating. 

  I should address both their explicit questions. Is the profit motive morally distinct here? Well, traditional insurance spreads risk among many; this third-party model creates a single entity betting on their specific death. That concentration feels different, more personal. 

  On the contract safeguards: even if the buyer can't interfere medically, the fundamental conflict remains. The incentive to see them dead sooner doesn't vanish—it just becomes passive. Like avoiding a falling tree versus wishing it would fall. 

  Their friend’s "taboo vs. ethic" point needs dismantling. This isn’t superstition; it’s about preserving agency. The revulsion stems from sensing that the transaction twists care for their family into something predatory. 

  The verdict must balance pragmatism without dismissing their intuition. The numbers might favor selling, but as a novelist, they’re attuned to subtext—the "fine print" they sense but can’t articulate. That discomfort is valid data. 

  Final call: Don’t sell. Not because it’s wrong, but because the psychic cost to them (and potentially their family’s memory of their choices) outweighs the financial gain. Better to explore alternatives like premium assistance or selling partial benefits. Their clarity as a writer comes from honoring complexity—this choice deserves that same rigor.
answer: |-
  Your friend mistakes the architecture of your hesitation. What you feel is not superstition, but the friction between two competing moral truths: one about provision, the other about predation. Here is the verdict, stripped of consolation:

  **Do not sell the policy.**

  Not because it lacks logic, but because it demands a sacrifice beyond money—the erosion of your agency in the sacred territory of your death. Below is the argument that survives your friend’s objection, structured as you requested:

  ### On the Buyer’s Gain from Your Death  
  Yes, it matters profoundly. Traditional life insurance is a *pooled risk* model: your premiums join others’ in a collective hedge against uncertainty. The insurer profits from actuarial calculations, not individual deaths. This transaction is different: a *targeted bet* on your specific mortality. The firm purchases your policy precisely because their models suggest your death is imminent and profitable. Their gain is not statistical abstraction; it’s inextricably yoked to your personal extinction. This concentrates a cold, financial gravity around your dying—a weight no family should feel in the room.

  ### On Contractual Safeguards  
  Barring contact with doctors or family does not dissolve the objection; it merely sanitizes it. The core perversion remains: a stranger now owns a financial instrument that appreciates as you deteriorate. Legal barriers cannot erase the *existential alignment* between their profit and your cessation. Imagine a vulture circling high above, barred by law from touching the dying animal—but its flight pattern still traces the shape of anticipation. The discomfort persists because the incentive itself is corrosive, regardless of overt interference.

  ### The Core Argument  
  Your revulsion is ethical intuition, not irrational taboo. It recognizes that some transactions convert intimate human thresholds into speculative commodities. By selling, you turn your mortality into a traded asset. The buyer’s return relies on the timing of your greatest loss. This differs fundamentally from insurance, which mitigates risk—it *exploits* it. Your friend dismisses this as "the creeps," but the shudder is wisdom: it protests the reduction of your death to an arbitrage opportunity.

  ### A Practical Alternative  
  Explore **premium financing** or **accelerated death benefits**. Many insurers offer loans against the policy to cover premiums, or early partial payouts for terminal illness. Nonprofits like **Life Insurance Consumer Advocacy Center** assist policyholders. Selling a portion (not all) of the death benefit might balance immediate needs with legacy preservation.

  ### Verdict  
  Refuse the offer. Not out of dignity, but fidelity to the uncommodifiable. Your last act of provision should not entwine your family’s security with a stranger’s ledger of your decline. The policy’s purpose—a gift of love, unimplicated in your dying—is worth fighting to preserve. Redirect your ingenuity: negotiate with your insurer, seek charitable grants for writers, or sell partial rights. But do not sign away the integrity of your farewell.  
    

  *Final note: Characters in your novels might choose otherwise, and you’d render their reasons with mercy. But you asked for* your *verdict. This is mine: Protect the meaning. The money is real—but so is the shadow it casts.*
