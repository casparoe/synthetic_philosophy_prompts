  Adding physical details: the hospital’s fluorescent lights, Mara’s lukewarm tea, Leo’s fidgeting with a ticket stub. These ground the abstract discussion in reality. The ending leaves the question open—Mara’s line about the cup being real now but not fixed in the future.

