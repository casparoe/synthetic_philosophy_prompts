  Check that the story meets word count (1200-1500). Scenes: waiting room, the simultaneity example, the deeper argument about determinism, ending on unresolved tension. Make sure the supernova example is clear but not overly technical. Emphasize that relative motion causes the different observations, highlighting frame dependence.

  Finally, the takeaway: the block universe doesn’t imply fate. Leo’s point about quantum indeterminacy or chance events introduces that nuance. Mara’s consolation might be personal, not physical. Ending with the cup metaphor leaves the philosophical question open for students to discuss.
