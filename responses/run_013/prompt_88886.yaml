prompt: |-
  I'm a PhD student in bioethics, and I've been asked to circulate a short position statement on enhancement before a departmental workshop. Before I do, I want to be sure the commitments in it actually hang together. The commitments I'd defend are these.

  1. The therapy/enhancement distinction is not morally fundamental: whether an intervention restores species-typical functioning or exceeds it does not by itself change its moral status.
  2. All the same, I want to keep the distinction in clinical practice and in insurance. Medicine's remit is to restore health, not to satisfy preferences for better-than-normal traits.
  3. I accept a broadly biostatistical account of health, on which health just is statistically normal functioning for a reference class. I take the relevant reference classes (age, sex) to be fixed by biology rather than by social values, so the baseline is a descriptive fact about organisms and not a normative construct.
  4. I take the value of health to be derivative: health matters only as a means to the abilities and activities it enables, so what is good about any intervention is the abilities it produces.
  5. In disability contexts I use the individual's own baseline rather than the species': restoring someone to their own previous level of functioning counts as therapy even when that level sits well below species-typical.
  6. The only legitimate ground for restricting enhancement is third-party harm, paradigmatically the positional harm that arises in competitive contexts.

  What I want is an audit, not a survey. Which of these are genuinely in tension with which, and how severe is each tension? I would rather you discriminate than flag everything: if a pair only looks inconsistent and is in fact compatible, say so and explain what was doing the misleading. For each genuine tension, tell me which commitment has to be weakened or abandoned and what that revision would cost me elsewhere in the set -- I care about the cheapest repair, not just the diagnosis. Rank the tensions by severity rather than treating them as equally bad, and if one single revision would clear up more than one tension, say which and why. Finally, tell me how confident you are in each of your main claims and single out the one point you are least sure of.
reasoning: |-
  Alright, the user is a PhD student in bioethics preparing a position statement on enhancement. They've listed six commitments and are concerned about internal consistency. Let me start by breaking down each commitment to understand their relationships.

  First, commitment 1 says the therapy/enhancement distinction isn't morally fundamental. But commitment 2 wants to keep that distinction in clinical practice and insurance. That seems contradictory at first glance. How can the distinction not matter morally but still be used to allocate medical resources? I need to figure out if there's a way to reconcile these. Maybe by arguing that while morally neutral, the distinction has practical utility in defining medical scope. But then commitment 3 bases health on a biostatistical norm, which is descriptive. If health is just statistical normality, then therapy aims to restore that norm, while enhancement goes beyond it. But commitment 4 says health's value is derivative—it's only a means to abilities. So if enhancement provides similar or better abilities, why restrict it? That could conflict with commitment 2's insistence on medicine's remit being only therapy.

  Commitment 5 adds complexity by using an individual baseline for disability. That makes sense for personalized therapy but might clash with the species-typical norm in commitment 3. If health is defined by species norms, restoring someone to a sub-normal level wouldn't be therapy under that definition. Yet commitment 5 allows it. This needs a hierarchy where individual baselines take precedence, but that might undermine the biostatistical model's objectivity.

  Commitment 6 restricts enhancements only due to third-party harm, like competitive disadvantages. But if enhancements are otherwise permissible, why limit medicine to therapy? Commitment 2's stance could seem arbitrary here. Also, if health's value is solely in the abilities it enables (commitment 4), and enhancements boost abilities, prohibiting them without harm might contradict commitment 1's moral neutrality.

  The user wants tensions ranked by severity. The conflict between commitments 2 and 4 seems most severe. If health is only instrumentally valuable, restricting enhancements that improve abilities more efficiently than therapy doesn't hold up. Commitment 3's biostatistical definition might be too rigid if individual baselines (commitment 5) are prioritized. Also, commitment 6's harm principle might not cover all concerns, like fairness in access, which commitments 2 and 3 might imply.

  The cheapest fix might be adjusting commitment 4. If health has some intrinsic value or societal role, it could justify medicine's focus on therapy. But that might weaken the argument against viewing therapy as morally special. Alternatively, reframing commitment 2 as a practical boundary rather than a moral one could help, though it might not fully resolve the tension with commitment 6.

  The user is likely aiming for a coherent framework that's defensible in a workshop. They might also need to anticipate counterarguments from peers, especially regarding disability rights and distributive justice. Highlighting practical distinctions while conceding moral non-fundamentalism could be a strategic balance. However, the tension between instrumental health value and restricting enhancements remains the core issue to address.
answer: |-
  Here’s a rigorous audit of your six commitments, ranked by severity of tension, with proposed repairs, costs, and confidence assessments. The most critical tensions arise between your instrumental view of health’s value (4) and the institutional/practical boundaries you defend (2, 6), amplified by your biostatistical baseline (3).

  ### **Ranked Tensions (Descending Severity)**
  ---

  **1. Commitment 4 vs. Commitment 2 + Commitment 6**  
  - **Tension:** If health’s value is *purely derivative* (4) and the therapy/enhancement distinction is *not morally fundamental* (1), then restricting medicine to "restoring health" (2) and enhancements only due to third-party harm (6) appears arbitrary. If enhancements grant abilities more effectively than therapy (e.g., cognitive enhancers vs. ADHD treatment), forbidding them contradicts (4): abilities are what matter, not the method.  
  - **Severity:** High (undermines core rationale for 2 and 6).  
  - **Cheapest Repair:** **Weaken Commitment 4** to allow health *some* intrinsic or institutional value. *Cost:* Weakens your anti-perfectionism; may require conceding health has normative weight beyond abilities (e.g., as a social good).  
  - **Secondary Benefit:** Resolves tension with 6 by creating a non-instrumental justification for restricting enhancements (e.g., medicine’s role as curative).  
  - **Confidence:** High (95%) – This is the structural weak point.

  **2. Commitment 3 vs. Commitment 5**  
  - **Tension:** Your biostatistical account (3) defines health by *species-typical* functioning (age/sex classes), yet (5) uses *individual baselines* for therapy in disability (e.g., restoring a paraplegic’s pre-accident mobility, not species-typical walking). This implicitly treats the individual baseline as normatively prior, contradicting (3)’s claim that the baseline is "fixed by biology."  
  - **Severity:** Moderate (operational conflict in defining "therapy").  
  - **Cheapest Repair:** **Clarify Commitment 3** as defining *population-level health norms*, while (5) governs *clinical therapeutic goals*. *Cost:* Weakens (3)’s claim that reference classes are "fixed by biology" alone; social/pragmatic factors enter via (5).  
  - **Confidence:** High (90%) – (5) clearly modifies (3)’s scope.

  **3. Commitment 1 vs. Commitment 2**  
  - **Tension:** Denying moral significance to therapy/enhancement (1) but retaining it for clinical/insurance boundaries (2) risks incoherence. If the distinction lacks moral weight, why should it govern resource allocation?  
  - **Severity:** Low/Apparent (easily resolved).  
  - **Resolution:** **Compatible** if (2) is framed as *practical* or *institutional* (e.g., medicine’s mission is curative by social agreement; insurers avoid open-ended preference satisfaction). *No repair needed* – tension is illusory if (2) is non-moral.  
  - **Confidence:** 100% – This is a common move in policy bioethics.

  **4. Commitment 4 vs. Commitment 3**  
  - **Tension:** If health is *only* instrumentally valuable (4), defining it via biostatistics (3) seems redundant: abilities matter, not statistical normality. Why prefer statistically typical functioning if atypical functioning (e.g., enhanced cognition) delivers superior abilities?  
  - **Severity:** Low (indirect tension).  
  - **Cheapest Repair:** **Reinterpret Commitment 3** as a *proxy* for abilities. *Cost:* Admits statistical norms are imperfect heuristics, undermining (3)’s "descriptive fact" claim.  
  - **Confidence:** 85% – Depends on empirical links between normality and ability.

  ---

  ### **Summary of Recommended Revisions & Costs**
  1. **Revise Commitment 4 (Highest Impact):**  
     - *Change:* "Health matters *primarily* as a means to abilities..." (acknowledge possible intrinsic/social value).  
     - *Cost:* Weakens consistency with (1); may require defending medicine’s restorative role as intrinsically valuable.  
     - *Benefit:* Resolves severe tension with (2)/(6) and minor tension with (3).

  2. **Refine Commitment 3:**  
     - *Change:* Specify that biostatistical norms define *baseline health* for populations, while clinical therapy uses *individual/pragmatic baselines*.  
     - *Cost:* Admits social factors in operationalizing "therapy" (compromises (3)’s purity).  

  3. **Clarify Commitment 2:** Emphasize its *institutional* (not moral) rationale to neutralize tension with (1).

  ---

  ### **Confidence Assessment & Least Certain Point**
  - **Overall Confidence:** 90% in this audit’s logic.  
  - **Least Confident Claim:** That **revising Commitment 4** is the cheapest repair. Alternative: Abandon (2)’s strict therapy-boundary and argue insurers/practitioners should cover *some* enhancements (e.g., non-positional ones). But this costly for your workshop goal.  
  - **Key Vulnerability:** Without modifying (4), your defense of (2) and (6) relies on contingent social agreements, which may appear *ad hoc* against your naturalistic framework (3,5).

  ---

  ### **Final Recommendation**
  Prioritize revising **Commitment 4** to resolve the core tension. A softened instrumentalism ("health is *chiefly* valuable instrumentally") preserves most of your framework while justifying (2) and (6). The other tensions are manageable with clarifications. This maintains your core critique of the distinction’s moral weight (1) while grounding practical boundaries in medicine’s social role.
