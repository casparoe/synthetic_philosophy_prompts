answer: |-
  ## Research Proposal: The Identity Problem in Mechanistic Anomaly Detection

  **The Question (Approx. 150 words):**
  Mechanistic anomaly detection (MAD) proposes flagging a model's behavior when driven by a mechanism different from its training-time mechanism, even if outputs appear normal. However, MAD crucially relies on an undefined criterion for "same mechanism." Defining this identity too finely (e.g., identical weights/activations) renders MAD hypersensitive, classifying every retraining or hardware change as an anomaly, making it useless. Defining it too coarsely (e.g., input-output equivalence) collapses MAD into mere behavioral equivalence, losing its core promise of monitoring internal processes. The central question is: *Can a criterion for "same mechanism" be defined that avoids these pitfalls, grounding MAD in a non-arbitrary way?* Specifically, is a relativized causal-role criterion (same node in a task/intervention-relativized causal graph) precise enough to provide meaningful anomaly detection, or does it inevitably collapse into arbitrariness?

  **Why the Obvious Answers Leave It Open (Approx. 250 words):**
  Existing intuitive approaches to mechanism identity fail to resolve the core tension. The "Identical Implementation" criterion (same weights, activation paths, hardware) is demonstrably too strict. Minor weight adjustments during routine fine-tuning, deploying on different but functionally equivalent hardware, or even recompiling code could trigger false positives, rendering MAD impractical. Conversely, the "Behavioral Equivalence" criterion (same I/O function) is too weak. It cannot distinguish between a model genuinely using its intended reasoning circuit and one using a hacked "backdoor" circuit activated by subtle triggers, or utilizing a functionally equivalent but structurally distinct "shortcut" learned later, even if these pose risks. Current MAD proposals often implicitly hover between these poles without a principled justification for their granularity choice. They lack a robust account of what constitutes a *relevant* change in mechanism for the purpose of detecting potentially problematic deviations. This gap leaves MAD vulnerable: it either cries wolf too often or misses critical failures entirely. The challenge is defining a "Goldilocks" zone of mechanism identity that captures functionally significant structural changes impacting reasoning reliability, while ignoring irrelevant implementation details, without resorting to behavioral equivalence alone.

  **The Approach, and Why This Angle Rather Than the Alternatives (Approx. 400 words):**
  This project proposes to rigorously evaluate a *relativized causal-role* criterion for mechanism identity within MAD. The core idea: two computational structures instantiate the "same mechanism" relative to a specific task and a defined class of interventions if they occupy the *same functional node* within a causal graph modeling the model's relevant computational processes for that task. "Sameness" is defined by the structure's causal role – its inputs, outputs, and effects under permissible interventions within the task context. This explicitly rejects both rigid structural identity and purely behavioral equivalence.

  This approach is chosen over alternatives for key reasons:
  1.  **Versus Structural Identity:** It avoids the brittleness of demanding identical physical implementation. A mechanism rerouted through functionally identical backup components (Test Case 1) would still occupy the same causal node relative to the task and standard inputs, thus *not* flagged as anomalous. Hardware changes preserving causal topology would be ignored.
  2.  **Versus Behavioral Equivalence:** It retains sensitivity to functionally distinct internal changes. A duplicated, causally idle circuit (Test Case 2) might occupy a *new* causal node relative to interventions probing component utilization, potentially flagging it as anomalous if its idleness impacts robustness or indicates redundancy exploitation. A fundamentally different distributed encoding lacking persisting parts (Test Case 3) would need to satisfy the *causal role* (inputs, outputs, intervention responses) relative to the task to be considered the same mechanism.
  3.  **Addressing Relativization:** It explicitly embraces the need for relativization (to task and interventions) as a feature, not a bug. The task defines the relevant computational graph. The class of permitted interventions (e.g., input perturbations, activation clamping, component ablation) defines the operational meaning of "causal role" and sets the grain of analysis. A security-critical task might permit more intrusive interventions, defining a finer grain than a pure performance task.

  The project will formalize this criterion: defining how a task specifies a causal graph (nodes as functional modules), how a class of interventions defines causal role equivalence, and rigorously applying it to the three test cases to assess coherence and utility.

  **What a Result and a Failure Would Look Like (Approx. 200 words):**
  A **successful result** would demonstrate that the relativized causal-role criterion provides a coherent, non-arbitrary foundation for MAD. It would clearly show:
  *   How the criterion handles the test cases decisively: e.g., rerouting isn't anomalous (preserves role), idle duplication might be (fails role under relevant interventions), and distributed codes can be judged same/different based on causal role satisfaction under task-specific interventions.
  *   How relativization (task/intervention class) provides necessary flexibility *without* introducing subjective choices at the point of anomaly judgment – the framework dictates the criteria based on prior, justified choices of task scope and intervention types relevant to model safety/trustworthiness.
  *   That the criterion meaningfully lies between structural identity and behavioral equivalence, avoiding their pitfalls.

  A **failure** would manifest as the framework collapsing into either arbitrariness or behavioral equivalence. Key failure modes:
  1.  **Arbitrariness:** Inability to define "task scope" or "permissible interventions" non-circularly, forcing *ad hoc* choices for each anomaly judgment.
  2.  **Behavioral Collapse:** Demonstrating that the causal-role criterion, under any plausible relativization, reduces to requiring only input-output equivalence under the chosen interventions, failing to capture meaningful internal mechanistic differences.
  3.  **Inconsistency:** Producing contradictory judgments on the test cases depending on minor, unjustified variations in defining the causal graph or interventions.
  Either success or failure provides crucial philosophical clarity for MAD's feasibility and conceptual grounding.

  **Scope and Timeline for One Term of Part-Time Work (Approx. 150 words):**
  **Scope:** Focused exclusively on the *conceptual foundations*: rigorously defining the relativized causal-role criterion, formalizing the core concepts (task-relativized causal graph, intervention-class-defined role equivalence), and applying it to the three specified test cases. No empirical validation or implementation is planned. Literature will be engaged conceptually (e.g., causal models in ML, functionalist philosophy, existing MAD intuition papers).
  **Timeline (10 Weeks, Part-Time ~15hrs/week):**
  *   **Weeks 1-2:** Deep dive into core concepts; formalize initial definitions of task-relativized causal graph and intervention classes for ML mechanisms.
  *   **Weeks 3-5:** Develop detailed framework for causal-role equivalence; draft analysis of Test Case 1 (Rerouting) & Test Case 2 (Idle Duplication).
  *   **Weeks 6-8:** Analyze Test Case 3 (Distributed Code); stress-test framework for consistency and potential collapse points; draft core sections of workshop paper.
  *   **Weeks 9-10:** Synthesize findings (success/failure arguments); finalize workshop paper draft; outline philosophical implications.
  **Deliverable:** A complete draft of a workshop paper presenting the framework, its application to test cases, and the argument for its success or failure as a foundation for MAD.
