prompt: |-
  I teach a second-year undergraduate seminar on the philosophy of the infinite — sixteen students, one seventy-five-minute session, no background beyond a first course in logic. I want a single in-class activity that makes the group feel, in their own hands rather than in a lecture, why a supertask's final state is not fixed by the steps that lead up to it: the same problem, as I see it, that runs through the vase-and-balls puzzle and the lamp-toggling puzzle usually called Thomson's lamp. I want them to run into the underdetermination themselves and only then hear it named.

  Here is the seed I'd like you to build out, tighten, and improve on, keeping the spirit of it rather than the letter. Split the group into four teams of four. Give each team a shallow tray, which we'll call the vase, and a stack of index cards pre-numbered so that a team can always take ten fresh consecutive numbers. Each round, a team adds ten new numbered cards to its vase and then removes exactly one card of its own choosing. Points are awarded for the final contents of the vase at the end of a fixed number of rounds, and each team must commit in writing, before the rounds begin, to a prediction of what will be left and stake tokens on it. I expect the teams to converge on the same arithmetic — nine cards net per round, so the vase grows without bound — and then to discover that the choice of which card to remove, a choice that looks irrelevant, decides everything: a team that always removes its lowest-numbered card can end up with nothing, while a team that always removes its highest-numbered card keeps infinitely many, even though the two teams perform the identical add-ten-remove-one step every round. From there I want the session to turn to the lamp. Give me the whole thing as a runnable plan.

  Structure the response under these headings, in this order, with roughly the lengths indicated.

  - Overview (about 120 words): the setting, the group size and time, the materials, and one crisp sentence naming what participants should come away seeing.
  - Setup (about 150 words): how to prepare the trays, cards, tokens, and the prediction sheets; anything the facilitator must build in advance.
  - Run sheet (about 200 words): a minute-by-minute timeline for the full seventy-five minutes, with the phases marked and the transitions explained.
  - The activity: rules, rounds, and scoring (about 500 words): the full rules, how a round proceeds, how scoring and the token stakes work without any real money, how many rounds to run and how you keep the group from simply counting forever, and exactly what each team is asked to write down and when.
  - The reveal (about 250 words): how to stage the moment the divergence appears, what the facilitator says and does not say, and how to present the two contrasting limits as something the group produced rather than something announced. Include, as a second beat, a variant in which the vase is replaced by a counter that must be incremented once per step, so that the limit value is not an integer at all, and let the group notice what that does to the whole setup.
  - Debrief (about 350 words): map specific moments in the activity onto the philosophical points — the difference between the finite steps and their limit, the clash between counting how many cards remain and asking whether any given card remains, the way the lamp's state at the limit is likewise undetermined by its toggling history, and the gap between an idealized description and any physical realization of it. Say where each of these actually shows up in what the students did.
  - What will go wrong the first time (about 250 words): the predictable failures, the arguments the group will fall into, the temptation for the facilitator to resolve the puzzle and why that temptation should be resisted, and how to handle each failure without giving the game away.
  - What the activity cannot reproduce (about 150 words): be frank about which feature of the idea the activity is unable to deliver and that the facilitator has to supply in words.

  A few constraints. The activity must run entirely without internet access, so do not build in anything that asks students to look up a name, a date, or a source. Do not have the facilitator quote any text; describe and paraphrase instead. Do not ask the group to consult any reading. And please avoid leaning on contested attributions: describe the puzzles by their structure, and if you use the name Thomson's lamp, treat it as the familiar label for the toggling puzzle rather than as something the session depends on.
reasoning: |-
  We are designing an in-class activity to illustrate the underdetermination of the limit state in supertasks. We'll use a physical simulation with index cards and trays to represent the vase puzzle, then transition to Thomson's lamp. The goal is for students to experience the problem firsthand.

  ## Overview
  In this seventy-five-minute seminar for sixteen students divided into four teams, we use a hands-on card activity to demonstrate that the outcome of an infinite process (a supertask) is not determined by the step-by-step procedure alone. Each team works with a tray ("vase") and numbered index cards, adding ten and removing one card per round according to a pre-chosen strategy. After several rounds, teams discover that their removal strategy (e.g., always removing the lowest or highest card) critically affects the final contents, despite identical net additions. Participants come away seeing that the limit state of a supertask is underdetermined by its finite steps, a core issue in the paradoxes of infinity.

  ## Setup
  **Materials per team:** one shallow tray (labeled "Vase"), a stack of at least 200 blank index cards, a pen, a prediction sheet (see below), and 20 tokens (e.g., poker chips or paper clips). **Preparation:** Pre-number the first 40 cards for each team in consecutive order (1-40). Then, prepare additional unnumbered cards (at least 160) for later rounds. Create a prediction sheet for each team with two sections: (1) "Prediction: After [N] rounds, the vase will contain exactly the cards with numbers in the set: _________" and (2) "Strategy for removal: We will always remove the card with the [lowest/highest] number in the vase." Also, include a token staking area: "We stake [number] tokens on this prediction." **Facilitator prep:** Test the activity with a colleague to ensure timing and understand pitfalls. Have a whiteboard or flip chart ready to record team predictions and results.

  ## Run Sheet
  **0-5 min (Introduction):** Briefly frame the session: "Today we explore what happens when we push a step-by-step process to infinity." Explain the activity: teams will add 10 cards and remove 1 card per round, following their chosen removal strategy. Emphasize that they must predict the final contents and stake tokens.  
  **5-10 min (Strategy Selection):** Teams discuss and write their prediction and strategy on the sheet. They must choose one: always remove the lowest or highest card. They also stake 5 tokens (non-monetary, symbolic) on their prediction. Collect sheets.  
  **10-30 min (Rounds 1-4):** Each round: (1) Teams take 10 new consecutively numbered cards (start with 41-50 in round 1, then 51-60, etc.) and add to vase. (2) They remove one card per their strategy. Facilitator circulates, ensures rules are followed. After round 4, pause: "After four rounds, what do you observe? Discuss in your teams."  
  **30-50 min (Rounds 5-8):** Continue rounds 5-8 with new cards (e.g., 81-120). After round 8, stop and ask teams to count cards and note which numbers remain.  
  **50-60 min (The Reveal):** Teams report final contents. Compare: teams that removed lowest cards vs. highest. Highlight divergence.  
  **60-65 min (Lamp Transition):** Introduce Thomson's lamp: "Imagine a lamp toggled on/off at times 1/2, 3/4, 7/8, etc. What state at time 1?"  
  **65-75 min (Debrief):** Discuss how the card activity mirrors the lamp: the limit state isn't fixed by the steps.

  ## The Activity: Rules, Rounds, and Scoring
  **Rules:**  
  - Each round:  
    (a) **Add ten:** Take ten fresh consecutive cards (starting from the next available number; facilitator provides the starting number each round) and place them in the vase.  
    (b) **Remove one:** Remove one card from the vase according to the team's committed strategy: either the lowest-numbered card or the highest-numbered card present.  
  - **Scoring:** After the final round, the team's prediction is checked. If correct (exactly the set they predicted), they win double their staked tokens. If incorrect, they lose the tokens. (Tokens are symbolic; the real goal is insight.)  
  - **Prediction:** Before rounds, each team writes:  
    (1) The exact set of card numbers they believe will be in the vase after all rounds (e.g., "all cards greater than 100" or "no cards").  
    (2) Their removal strategy (lowest or highest).  
    (3) Number of tokens staked (fixed at 5 for all, to simplify).  
  **Rounds:** Run exactly 8 rounds. Why 8? It's enough to see a pattern but finite. Teams start with no cards. Round 1: add cards 1-10, then remove one (lowest: remove 1; highest: remove 10). Round 2: add 11-20, remove one (lowest: now removes the new lowest, which might be 2 or 11; highest: removes 20). Continue. After round 8, the vase has 80 added, 8 removed → 72 cards.  
  **Preventing infinite counting:** By fixing 8 rounds, we avoid actual infinity. The key is that the *pattern* of what remains depends on the removal strategy:  
  - **Always remove lowest:** The vase ends up with only high numbers (e.g., 73-80 in round 8, but actually, the lowest numbers are removed first, so after round 8, cards 73-80 and higher numbers from earlier that weren't removed). In fact, if started from 1, after round n, the remaining cards are all >10n. So after 8 rounds, cards above 80.  
  - **Always remove highest:** The vase keeps all low numbers (e.g., 1-72, because they always remove the highest, which is from the newest batch, so the old ones remain).  
  Thus, teams see that the same net addition leads to different sets. The prediction forces them to specify a set, which will fail for most.

  ## The Reveal
  After round 8, teams count the cards in their vase and write the set of numbers on the board. The facilitator records:  
  - Team A (remove lowest): "We have cards 73 to 80 and 81-88? Wait, no: we added 1-10, removed 1; added 11-20, removed 2; ... added 71-80, removed 8? Then in round 8 we added 81-90 and removed 81? So we have 73-80 and 82-90? Actually, it's messy." Instead, ask: "What is the smallest number in your vase?" For "remove lowest" teams: after round n, the smallest number is 10n+1. After round 8: 81. Why? They remove the current smallest, which after adding 71-80 and removing the smallest (which is 71? No, because at the start of round 8, the vase has cards from previous rounds, and the smallest might be, say, 71. Then they add 81-90, so the vase has ... then they remove the smallest, which is 71? But wait, we need to track.  

  Actually, to avoid confusion, calculate the sets:  
  - **Remove lowest:** At each round, the team removes the smallest number present. After adding ten new (higher) numbers, the smallest is the smallest from the entire set. So after round 1: {2,3,...,10}. Round 2: add 11-20, then remove 2 → {3-20}. Round 3: add 21-30, remove 3 → {4-30}. ... After round 8: {9-80}. Then round 8: add 81-90, remove 9 → {10-90}. So the set is all numbers from 10 to 90, except that we removed 1,2,...,9. So it's 10 to 90. But wait, we added 80 cards and removed 8, so 72 cards. The set is all integers from 10 to 90? That's 81 numbers, too many.  

  Let's recompute:  
  Start: no cards.  
  Round 1: add 1-10, remove min (1) → {2,3,...,10} (9 cards).  
  Round 2: add 11-20 → {2,3,...,20} (19 cards), remove min (2) → {3,4,...,20} (18 cards).  
  Round 3: add 21-30 → {3,4,...,30} (28 cards), remove min (3) → {4,5,...,30} (27 cards).  
  ...  
  After round n: the set is {n+1, n+2, ..., 10n}.  
  After round 8: {9,10,...,80} (72 cards? 80-9+1=72). Then they add 81-90 → {9,10,...,90} (82 cards), then remove min (9) → {10,11,...,90} (81 cards).  

  But the team that always removes the highest:  
  Round 1: add 1-10, remove max (10) → {1,2,...,9} (9 cards).  
  Round 2: add 11-20 → {1-9,11-20} (19 cards), remove max (20) → {1-9,11-19} (18 cards).  
  Round 3: add 21-30 → {1-9,11-19,21-30} (28 cards), remove max (30) → {1-9,11-19,21-29} (27 cards).  
  ...  
  After round 8: they have added 1-80, but removed the highest from each batch: 10,20,...,80. So they have all numbers except 10,20,...,80. Then in round 8: add 81-90, remove 90 → so the set is all numbers from 1 to 89 except 10,20,30,...,80.  

  This is messy to compute on the spot. Instead, note the pattern:  
  - Remove lowest: the vase ends up with only high numbers (the numbers that were added late and never got to be the smallest). Specifically, after round 8, the smallest number present is 10 (if we follow the above) but then we see that the set is from 10 to 90 without gaps? Actually, no gaps: we only remove the smallest, so we remove 1, then 2, then 3, ... up to 9. Then in round 8 we remove 9 and then add 81-90 and remove 9? Wait, 9 was removed earlier.  

  To simplify the reveal:  
  After 8 rounds, the two strategies yield:  
  - **Remove lowest:** The vase contains all cards from 10 to 90. (Because we removed 1 through 9.)  
  - **Remove highest:** The vase contains all cards from 1 to 89 except the multiples of 10 (10,20,...,80). (Because we removed the highest in each batch: 10,20,...,80, and then in round 8 we removed 90.)  

  But note: the team that removes highest has 81 cards? (89 numbers from 1 to 89, minus 8 removed: 10,20,...,80 → 89-8=81, plus the 9 cards from round 8? Actually, 89 numbers? 1 to 89 is 89 numbers, minus 8 is 81, but we added 81-90 and then removed 90, so we have 81-89 (9 cards) plus the previous 72? It's complex.  

  Alternatively, we can run fewer rounds. Let's do 3 rounds:  
  - Remove lowest:  
    Round1: add1-10, remove1 → {2-10}  
    Round2: add11-20, remove2 → {3-20}  
    Round3: add21-30, remove3 → {4-30}  
    So {4,5,...,30}  
  - Remove highest:  
    Round1: add1-10, remove10 → {1-9}  
    Round2: add11-20, remove20 → {1-9,11-19}  
    Round3: add21-30, remove30 → {1-9,11-19,21-29}  

  So after 3 rounds, the sets are clearly different.  

  Therefore, in the reveal, the facilitator says: "Let's see what each team has. Teams that removed the lowest: what is the smallest number in your vase?" (Expected: after 3 rounds, 4; after 8 rounds, 10.) "Teams that removed the highest: do you have card number 1?" (Yes.) "Do you have card 10?" (No, because removed in round1.)  

  Then, the facilitator notes: "Both teams added ten and removed one each round, but the final contents are entirely different. The choice of which card to remove, which seemed arbitrary, completely determined the outcome."  

  **Second beat (counter variant):** "Now, imagine instead of a vase, we have a counter that starts at 0. Each round, we add 10 (so the counter increases by 10) and then subtract 1 (so it decreases by 1). What is the final count after 8 rounds? 8*(10-1)=72. But if we take the limit as rounds go to infinity? The net per round is +9, so it goes to infinity. But now, what if we replace the counter with a lamp? Each step we toggle it. Then the state at infinity is undefined." Let the group notice: the counter's value is always an integer and grows without bound, but the lamp's state (on/off) would require a binary value at infinity, which is not determined by the process.

  ## Debrief
  The activity directly confronts the underdetermination of the limit. Key points:  
  1. **Finite steps vs. limit:** The students performed a finite process (8 rounds), but the divergence in outcomes illustrates how the infinite case (supertask) might not have a unique limit. The same step-by-step procedure (add ten, remove one) leads to different results depending on the removal strategy.  
  2. **Cardinality vs. membership:** The net number of cards (72) is the same for all teams, but the sets differ. This mirrors the vase puzzle: one can ask "how many balls?" (infinitely many) or "which balls?" (depends on removal order). The lamp puzzle asks for the state (on/off) at the limit, which is a membership-like question (is the lamp in the "on" set or "off" set at time 1?).  
  3. **Thomson's lamp:** The lamp is toggled at each step: step 1 (on), step 2 (off), etc. After infinitely many toggles, the state is undefined because the sequence of states (on, off, on, off, ...) does not converge. In the card activity, the limit set is not determined by the stepwise addition and removal alone; it requires specifying the removal rule. Similarly, the lamp's limit state requires a rule that the process does not supply.  
  4. **Idealization vs. physics:** The activity is an idealized model. Students may object that you cannot physically add ten cards in finite time and then remove one as the steps get faster. This is the point: supertasks are abstract, and their limit states are not fixed by the finite descriptions.  

  The students experienced:  
  - In the prediction, they assumed the net growth would dictate the set, but the removal strategy mattered.  
  - In the reveal, the two strategies produced two different sets, showing underdetermination.  
  - In the counter variant, they saw that a scalar value (count) can grow to infinity, but a binary state (lamp) cannot be assigned a limit without an arbitrary choice.

  ## What Will Go Wrong the First Time
  1. **Prediction errors:** Teams may not predict correctly. Some might say "all cards" or "no cards" without understanding the strategy. This is fine; the reveal will surprise them.  
  2. **Confusion in removal:** Teams might forget their strategy or remove the wrong card. Facilitator must monitor and correct.  
  3. **Computation overload:** Counting cards takes time. Limit to 8 rounds and ask for the smallest/largest number to simplify.  
  4. **Arguments:** Teams may argue that the final state should be the same because "net is +9 per round." The facilitator should note that the sets are different and ask: "But do you have the same cards?"  
  5. **Temptation to explain:** The facilitator might want to resolve the confusion by explaining the paradox. Resist: let the students articulate the surprise. Ask: "Why did we get different results from the same steps?"  
  6. **Time pressure:** Running 8 rounds might take longer than 20 minutes. Solution: Do 4 rounds in the first block and then 4 more, or reduce to 6 rounds.  
  7. **Misunderstanding the lamp:** When transitioning, students might say the lamp is on or off based on parity. The facilitator should note: "But what if we did infinitely many toggles? The sequence has no limit."  

  Handling:  
  - If a team struggles with the strategy, remind them: "What did you write on your prediction sheet?"  
  - If the sets are messy, focus on sample cards: "Team A, do you have card 1? ... Team B?"  
  - If time runs short, skip the counter variant or do it quickly.

  ## What the Activity Cannot Reproduce
  The activity cannot actually run infinitely many rounds, so the "limit" is only suggested by the pattern after finitely many steps. The students must extrapolate to infinity. The facilitator must explicitly connect the finite divergence to the infinite case: "If we continued forever, the 'remove lowest' strategy would leave no card with a finite number (because every finite number would eventually be removed), while the 'remove highest' strategy would keep every finite number (if we remove the highest of each finite batch). But in the infinite vase, we have to specify the set at the limit, and the process doesn't fix it." The lamp's state at the limit is similarly underdetermined, and the activity can only hint at this via the finite divergence. The physical impossibility of completing infinitely many steps in finite time is also not modeled; the facilitator must note that supertasks are abstract and the paradoxes arise from treating the limit as a completion.
answer: |-
  ### Overview  
  This seventy-five-minute seminar activity for sixteen students (divided into four teams of four) uses hands-on manipulation of numbered cards in a tray ("vase") to demonstrate that the final state of a supertask is underdetermined by its step-by-step procedure. Materials include trays, pre-numbered index cards, tokens, and prediction sheets. Through timed rounds of adding ten cards and removing one per round—guided by team-chosen removal strategies—students discover that identical net additions yield divergent outcomes (e.g., an empty vase vs. infinitely many cards) based solely on *which* card is removed. They then extend this insight to Thomson's lamp, seeing that supertasks lack intrinsic limits. Participants come away recognizing that infinite processes do not fix their own endpoints.  

  ### Setup  
  **Materials per team:**  
  - One shallow tray ("vase").  
  - A stack of 200+ blank index cards.  
  - Four pens.  
  - 10 tokens (e.g., poker chips or buttons).  
  - One prediction sheet (pre-printed with: "Prediction: After all rounds, the vase will contain exactly the cards numbered: ___________. Strategy: We always remove the card with the [ ] LOWEST [ ] HIGHEST number. Tokens staked: ___").  

  **Preparation:**  
  - Pre-number the first 40 cards for each team (1–40). Keep additional unnumbered cards for later rounds.  
  - Assign starting numbers for new cards per round (e.g., Round 1: 1–10, Round 2: 11–20, etc.).  
  - Test the activity: Ensure teams grasp rules and timing.  
  **Facilitator setup:** Prepare a timer, whiteboard (to record predictions/results), and a lamp prop for the transition.  

  ### Run Sheet  
  **0–5 min:** Introduce the activity: "We’re modeling an infinite process in finite time. Each round, you’ll add 10 cards to your vase and remove one. Predict the final state and stake tokens."  
  **5–15 min:** Teams strategize, write predictions (e.g., "all cards >100"), select removal strategy (lowest/highest), and stake 5 tokens. Collect sheets.  
  **15–35 min:** Run 8 timed rounds (2.5 min/round):  
  - *Each round:* Teams add 10 new consecutive cards (facilitator announces starting numbers, e.g., "Round 1: add 1–10," "Round 5: add 41–50"), then remove one card per strategy.  
  - *Pauses:* After Round 4, ask: "What patterns do you see? Is the vase growing as expected?"  
  **35–45 min:** Finalize and count contents. Teams list card numbers in their vase.  
  **45–55 min:** **The reveal (divergence):** Teams report outcomes. Contrast "remove lowest" vs. "remove highest" teams on whiteboard.  
  **55–65 min:** Introduce Thomson’s lamp: Toggle a lamp prop; ask for its state after infinite toggles.  
  **65–75 min:** Debrief: Connect vase/lamp paradoxes.  

  ### The Activity: Rules, Rounds, and Scoring  
  **Core Rules:**  
  1. **Per round:**  
     - Add 10 new consecutively numbered cards (e.g., Round 1: 1–10, Round 2: 11–20, etc.).  
     - Remove exactly one card per team’s committed strategy: *always* the lowest or highest number in the vase.  
  2. **Rounds:** 8 total (finite to ensure completion). Net addition: 72 cards (80 added, 8 removed).  
  3. **Prediction:** Before Round 1, teams commit to:  
     - A specific set of final card numbers (e.g., "cards 50–72" or "no cards").  
     - Removal strategy (lowest/highest).  
     - Tokens staked (5 tokens fixed for all; symbolic "bet" on prediction).  
  4. **Scoring:**  
     - Prediction is "correct" only if the final set *exactly matches* the description (e.g., "all cards >70" must include no lower numbers).  
     - Success wins 10 bonus tokens; failure loses staked tokens.  
     - *No monetary stakes—tokens are for discussion stakes.*  

  **Execution:**  
  - **Facilitator role:** Announce starting numbers each round. Enforce strategy adherence (e.g., "Did you remove the absolute lowest?").  
  - **Preventing endless counting:** Teams must list only the *range* of numbers (e.g., "cards 9–80 except 10,20,30...") post-activity.  
  - **Why 8 rounds?** Enough to show divergence:  
    - *Remove lowest:* Smallest numbers disappear first → vase contains only high numbers (e.g., 73–90).  
    - *Remove highest:* Largest numbers vanish → vase retains most low numbers (e.g., 1–72 except multiples of 10).  
  - **Prediction trap:** Teams assume net growth (+9/round) dictates outcome. They learn it does not.  

  ### The Reveal  
  **Staging divergence:**  
  1. Post-results, write team outcomes on the whiteboard in two columns: "Always removed lowest" and "Always removed highest."  
  2. **Facilitator asks:** "What do we see? Same steps, same net cards—why different sets?" *Do not explain.* Highlight contrasts:  
     - "Remove lowest" teams: Smallest numbers missing (e.g., 1–9 gone).  
     - "Remove highest" teams: Largest numbers missing (e.g., 10,20,80 gone).  
  3. **Key script:** "You all added ten and removed one. Yet Team A’s vase starts at card 73, Team B’s has card 1. What changed? Only *which* card you removed. The limit isn’t in the math; it’s in the choices."  
  4. **Counter variant (lamp transition):** "Imagine the vase is a counter: +10, then –1 each round. After 8 rounds, it reads 72. At infinity? It diverges to ∞. Now replace with a lamp: +10 is ‘on,’ –1 is ‘off.’ What’s its final state?" Let students notice:  
     - The counter diverges (no finite limit).  
     - The lamp requires a binary state (on/off), but the process suggests no limit—just like the vase’s contents.  

  ### Debrief  
  Map activity moments to philosophical insights:  
  1. **Finite steps vs. limit (vase):** Students performed 8 identical steps. Yet the endpoint varied by strategy. *Link:* Supertasks (infinite steps) have no "natural" limit; it must be imposed (e.g., by removal rules).  
  2. **Cardinality vs. membership (vase):** All teams end with 72 cards ("how many" is fixed), but *which* cards remain depends on choices. *Link:* The vase puzzle’s paradox arises when we conflate "infinitely many balls" (cardinality) with "which balls remain" (membership).  
  3. **Undetermined state (lamp):** The lamp’s toggling history (on→off→on...) *describes* the process but *does not define* a state at ∞. *Link:* Students see this when they realize no arithmetic predicts the lamp’s state—just as no net addition fixed the vase’s contents.  
  4. **Idealization gap:** Students manipulated cards in minutes, but supertasks compress infinite steps into finite time. *Link:* The activity’s "end" is arbitrary (we chose 8 rounds); physical supertasks are impossible, exposing contradictions in the *description*, not reality.  
  **Crucial pivot:** The vase’s underdetermined set and the lamp’s undefined state are the same problem: infinite processes lack intrinsic endpoints.  

  ### What Will Go Wrong the First Time  
  1. **Prediction errors:** Teams will predict "72 cards" or "all high numbers," ignoring set specifics. *Handling:* Ask: "Does your vase contain card 1? Card 100?" to expose vagueness.  
  2. **Strategy drift:** Teams may inconsistently remove cards (e.g., "lowest" but skipping numbers). *Handling:* Spot-check; remind them: "Stick to your written strategy."  
  3. **Counting chaos:** Listing 72 cards bogs down. *Handling:* Require only ranges/exceptions (e.g., "cards 1–89 except multiples of 10").  
  4. **False consensus:** Teams assume outcomes converge. *Handling:* At Round 4, ask: "Are all vases identical?" to seed doubt.  
  5. **Facilitator temptation:** To resolve confusion, you might explain the paradox. *Resist:* Ask instead: "What does this say about completing infinity?"  
  6. **Lamp oversimplification:** Students may say "lamp is off after even toggles." *Handling:* Respond: "But after ∞ toggles, is ∞ even or odd? Does that question make sense?"  

  ### What the Activity Cannot Reproduce  
  The activity cannot physically *complete* infinity, forcing students to extrapolate from finite steps. The "limit" is imagined, not experienced. Facilitators must explicitly bridge this gap: "In this game, we stopped at 8 rounds. But supertasks claim to finish infinitely many steps. Our divergence after 8 rounds *suggests* that at ∞, the outcome could be empty, full, or anything in between—depending on choices the steps don’t specify. No finite experiment can prove this; it’s a conceptual leap." This leap—where mathematical induction fails and underdetermination emerges—must be articulated, not simulated.
