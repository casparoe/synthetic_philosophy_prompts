  Okay, the user is preparing for a podcast interview with a researcher who advocates for program equilibrium. They want incisive questions that build pressure, specifically addressing transparency, fragility, equilibrium selection, and connections to evidential decision theory. 

  Hmm, the user clearly understands the technical basics but suspects unresolved problems. Their phrasing ("half sold, half suspicious") suggests they want to expose weaknesses without being hostile—they need questions that force the guest beyond rehearsed talking points. The deflector warning means follow-ups must preempt "that's not the point" dodges. 

  First, I should anchor on the user's core concern: does program equilibrium actually solve cooperation or just relocate the problem? The equilibrium selection issue seems fundamental—if the meta-game has multiple equilibria, including defective ones, then "rational cooperation" isn't guaranteed. That deserves early focus. 

  Transparency is another practical flaw. The guest might handwave by saying "it's a model," so the follow-up must stress that humans can't inspect source code. Fragility questions should highlight real-world constraints like proof search limits—if cooperation breaks with tiny implementation differences, how is this general? 

  The EDT link is tricky. If program equilibrium reduces to evidential reasoning, it inherits those problems (e.g., smoking lesion objections). The guest may resist this, so the follow-up needs concrete examples where EDT and program equilibrium share counterintuitive results. 

  For the finale, asking what evidence would falsify the theory forces accountability. Deflectors often avoid falsifiability, so the follow-up must demand specifics: "Name one empirical or theoretical result that would make you reconsider." 

  Sharpest question? Probably Q8 on falsifiability—it's hardest to dodge with "outside the scope" replies. The guest must either admit limits or overclaim.
answer: |-
  Here are 10 interview questions designed to build pressure, target key objections, and preempt deflection, with specific follow-ups:

  **Q1: Program equilibrium achieves mutual cooperation in the one-shot Prisoner's Dilemma (PD) by having agents condition on proofs about each other's output. But this seems to require both agents to run *identical* or *provably equivalent* programs. If I modify your proposed cooperative program even slightly – say, add a harmless comment or change a variable name – does cooperation collapse? If not, what's the minimal level of similarity required, and doesn't this make the solution incredibly fragile?**  
  *Follow-up (if he deflects to "it's a model"): Granting it's a model, its claimed relevance to real agents hinges on robustness. If cooperation requires near-perfect identicality of code – something absent even in human twins or replicated software – how is this a general model of rational cooperation? Doesn't this confine it to a razor-thin edge of possibility?*

  **Q2: The transparency assumption is critical: both programs must fully inspect each other's source code and reason about it. Humans lack this ability – we can't access each other's cognitive "source code." How does program equilibrium provide normative guidance for *actual* human rational cooperation where such perfect transparency is impossible?**  
  *Follow-up (if he deflects to "ideal agents"): If the solution *only* works for idealized agents with perfect mutual code access – a condition never met in reality – doesn't that make it irrelevant for *prescriptive* decision theory? How do we bridge this vast gap between the idealization and real-world agents who must cooperate?*

  **Q3: Correlated equilibria can be achieved via program equilibrium, including cooperative outcomes in PD. But doesn't this mean mutual cooperation is *just one possible equilibrium among many*, including mutual defection? How does program equilibrium resolve this equilibrium selection problem at the *program choice level*? Why wouldn't rational agents pessimistically converge on defection programs?**  
  *Follow-up (if he deflects to "cooperation is achievable"): Achievable isn't sufficient if defective equilibria are also achievable and potentially more robust or focal. What principle, *within program equilibrium itself*, uniquely selects the cooperative program pair over defective ones? Doesn't program choice inherit the very coordination problem it was meant to solve?*

  **Q4: What happens when the two agents use fundamentally different proof systems or logics? If Agent A uses Peano Arithmetic and Agent B uses a weaker arithmetic or a non-standard logic, can they still mutually prove cooperation? If not, doesn't this reintroduce fragility?**  
  *Follow-up (if he deflects to "standard assumptions"): Real agents (humans, AIs) *do* use different reasoning systems. If cooperation depends critically on shared, powerful, compatible proof systems – another unrealistic idealization – how is this a practical solution? Does failure under proof-system mismatch make it unstable?*

  **Q5: Program equilibrium relies on agents finding specific proofs (e.g., "If I cooperate, you cooperate"). In practice, proof search is resource-bounded and may fail or time out. What guarantees exist that cooperation is the *default* or *stable* outcome under bounded proof search? Could resource limits push agents towards defection as a safer default?**  
  *Follow-up (if he deflects to "asymptotic results"): Asymptotic results don't guide finite agents. If bounded agents, lacking time to find the cooperative proof, rationally default to defection, doesn't this collapse back to the standard PD outcome in the real world? How does the theory handle computationally constrained agents?*

  **Q6: My understanding is that the classic "cooperative" program cooperates with a copy of itself but defects against "Always Defect" and gets exploited by "Always Cooperate." Later patches (like "FairBot") were proposed. Doesn't this arms race of patches against exploitative strategies mirror the very dynamics of repeated games? Doesn't this suggest program equilibrium doesn't solve the one-shot problem cleanly, but just kicks the can down the road into an open-ended meta-game of program design?**  
  *Follow-up (if he deflects to "we can design robust programs"): But designing robust programs requires anticipating *all possible* opponent programs. How is this different from, and potentially harder than, the original problem? Doesn't this regress into infinite strategic complexity, undermining the claim of a simple, rational solution for the one-shot PD?*

  **Q7: A critique I've heard is that program equilibrium is essentially Evidential Decision Theory (EDT) formalized in code: you cooperate because your cooperation is evidence (via the proof) that the other agent cooperates, leading to a good outcome, similar to "superrationality." Is this characterization accurate? If not, how does it fundamentally differ from EDT?**  
  *Follow-up (if he rejects the EDT link): EDT notoriously suffers from problems like the Smoking Lesion, where acting on correlation without causation is irrational. If program equilibrium produces the same recommendations as EDT in Newcomb-like problems (e.g., cooperating because it's correlated with cooperation), doesn't it inherit these fatal flaws? How does the "proof" aspect escape this?*

  **Q8: Program equilibrium seems vulnerable to "clique cooperation": programs cooperate only with others in their in-group (e.g., exact copies or specific hashes) and defect against outsiders. Doesn't this incentivize tribalistic fragmentation rather than universal rational cooperation? How does the theory prevent this or ensure cooperation is universal?**  
  *Follow-up (if he deflects to "universal cooperation is possible"): Possible isn't stable. If a clique strategy (cooperate-in-group/defect-outgroup) is also an equilibrium and potentially offers higher payoff within the clique, why wouldn't rational agents adopt *that* instead of a universally cooperative program vulnerable to outsiders?*

  **Q9: You've spent a decade defending this approach. What would constitute *evidence* or a *theoretical result* that would genuinely make you reconsider the viability or primacy of program equilibrium as the "right way" to think about rational cooperation?**  
  *Follow-up (if he is vague or deflects): Can you name one specific, non-trivial empirical observation, experimental result, or formal proof that, if obtained, would significantly undermine your confidence in program equilibrium as the core solution? If nothing could, isn't that unfalsifiable?*

  **Q10: Ultimately, if program equilibrium allows many outcomes (via correlated equilibria), requires near-perfect transparency and identical reasoning frameworks, and may reduce to EDT with its known problems... what problem does it solve *better and more robustly* than established alternatives (like TFT in repeated games, or explicit contracts)?**  
  *Follow-up (if he cites the one-shot ideal): But if the "solution" only works under idealized, unrealistic conditions absent in the real world (perfect code access, unbounded computation, identical logic), and doesn't resolve equilibrium selection or meta-games, in what sense is it a *practical* account of *rationality* for actual agents? Isn't it more of a theoretical curiosity?*

  **Sharpest question: Q9 - What evidence would make you reconsider program equilibrium?**
