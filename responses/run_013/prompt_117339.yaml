prompt: |-
  Hey — I'm in a philosophy of mind course this term and something from last week's seminar is still bugging me. We were doing computational functionalism and the prof made the point that because computation is substrate-independant, you can describe pretty much any physical system as implementing any program you like, as long as you get to choose the state-mapping; she did the version where a rock comes out as implementing a lookup table. Then in the same session we talked about how from the outside we only ever get behaviour and never a view of which computation is actually running inside. Here's where I've landed: if any system can be described as implementing the computation that grounds experience, and we can never verify from the outside which computation is really happening, then there's no fact of the matter about which computations matter morally — moral status is just something we attribute, i.e. hand out. So the real question isnt 'which computations matter' but 'which ones should we decide to treat as mattering,' and that's a pragmatic call, not a discovery. Is that right, and if so is there any principled basis for drawing the line, or is it stipulation all the way down? One paragraph, max 200 words please.
reasoning: |-
  Hmm, the user is grappling with a philosophy of mind problem from their seminar. They're concerned about computational functionalism and moral status. Let me break this down.

  First, the key issue they're describing is Putnam's realization that physical systems can implement any computation with flexible mappings. This leads to skepticism about whether there's an objective fact about what computation a system is running. The user connects this to moral status: if we can't verify computations externally, maybe moral status is attributed rather than discovered.

  Their conclusion seems to be that "which computations matter" becomes a pragmatic decision rather than a discovery. They're asking if this is correct and whether there's any principled basis for drawing moral lines.

  I agree with their core insight - the mapping problem does push us toward attribution rather than discovery when assigning moral status to computations. But there are potential constraints. We might anchor our attributions in biological cognition as a reference point, since we know human cognition supports experience. Or we could look for causal structure isomorphism rather than arbitrary mappings.

  Still, these are pragmatic choices. The deeper philosophical problem remains - we have no access to the "intrinsic" nature of computations. This connects to hard problems of consciousness. My response should validate their reasoning while suggesting possible constraints, without overpromising solutions. Keeping it under 200 words is challenging but necessary.
answer: |-
  Yes, your reasoning captures a significant consequence of the mapping problem: if any system can be mapped arbitrarily to *any* computation (like the rock "implementing" consciousness), and we lack external access to the "true" mapping, then attributing moral status based on "running consciousness-computation X" indeed becomes a pragmatic attribution, not a discovery of an objective fact. There is no "real" computation independent of our interpretive stance.

  Finding a *principled* basis is challenging. Anchoring attributions in systems known to be conscious (like us) via structural/functional similarity (e.g., causal density, input/output fidelity, not arbitrary mappings) offers some constraint. But justifying *why* that similarity matters morally still involves value choices. Ultimately, while not *pure* stipulation (biology provides a reference), the line involves pragmatic decisions grounded in our understanding of consciousness and ethics, not just discovering pre-existing computational facts.
