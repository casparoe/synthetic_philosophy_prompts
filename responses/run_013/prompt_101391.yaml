answer: |-
  **Bureau of Brute Luck (BBL)**  
  **Citizen Resource Handbook: Understanding Your Entitlements Under the Luck Egalitarian Redistribution Scheme (Revised Edition 2027)**  

  **1. What does the BBL compensate for?**  
  The BBL administers redress for disadvantages arising solely from *brute luck*—defined as circumstances not attributable to your deliberate choices (BBL Statute §3.a). This includes unchosen genetic conditions, involuntary accidents, and unforeseen market shifts. *Note:* Disadvantages resulting from *option luck* (deliberate gambles or avoidable risks) are ineligible (§3.b). For adjudication standards, see Sections 4–6.  

  **2. How does the BBL distinguish brute luck from option luck?**  
  All outcomes are evaluated against the *Reasonable Counterfactual Consent Standard* (RCCS). If a reasonable person, knowing the actuarial risk and possessing baseline rationality (as defined in Form BBL-5), would *not* have consented to the disadvantageous outcome, it qualifies as brute luck (§4.2). Outcomes resulting from informed, uncoerced risk-taking (e.g., stock investments, extreme sports) are presumptively option luck (§4.3). Pre-activity risk disclosures (Form BBL-9) are mandatory for high-risk pursuits.  

  **3. What if my disadvantage stems from a trait that is partly chosen?**  
  Submit Form BBL-5 (*Trait Volition Assessment*) to initiate a 360-day review. Our *Choice Attribution Division* (CAD) will determine the chosen/unchosen ratio of the trait using biometric histories, lifestyle audits, and psychometric panels (§5.1). Example: Chronic lung disease in a former smoker may be apportioned 70% (option luck) to smoking and 30% (brute luck) to genetic predisposition. Compensation is adjusted proportionately (§5.4). Appeals require new actuarial evidence (Form BBL-5a).  

  **4. I am impoverished due to imprudent financial choices. Can I receive assistance?**  
  No. Poverty traceable to avoidable choices (e.g., excessive debt, speculative losses, voluntary unemployment) is option luck (§6.1). The BBL prioritizes fairness to those disadvantaged *through no fault of their own*. Hardship waivers (Form BBL-12) are available only if CAD confirms ≤10% choice attribution to the outcome (§6.3). Processing time: 18 months.  

  **5. What about "expensive tastes" (e.g., a cultivated preference for rare wines)?**  
  The BBL compensates only for unchosen *needs*, not chosen *preferences* (§7.1). Expensive tastes developed through voluntary habituation (≥3 instances of deliberate exposure) are ineligible (§7.3). Exception: Tastes arising from medically documented compulsive disorders (submit Form BBL-15 with neurological imaging).  

  **6. How are the untalented or disabled compensated?**  
  Disabilities/variant talents are brute luck if CAD confirms they are unchosen (§8.1). Compensation equals the gap between your expected lifetime earnings *given your traits* and the *counterfactual-average earnings* of a person with baseline traits in your society (§8.4). *Note:* "Baseline" refers to median biological/cognitive endowments as per the National Trait Registry (NTR). Appeals challenging the NTR baseline require peer-reviewed genomic studies (Form BBL-22; processing fee: 2,000 credits).  

  **7. What if I dispute the BBL’s classification of my disadvantage?**  
  File Form BBL-30 (*Counterfactual Consent Audit Request*). An independent actuary will review whether a reasonable person *would* have consented to your outcome knowing its statistical probability (§12.1). Success rate: 4.2% (FY 2026 data). Denied appeals may be escalated to the Option Luck Tribunal, which assesses whether you *could have reasonably avoided* the outcome (§12.7.3). Legal representation is not subsidized.  

  **8. Are character traits (e.g., laziness, impulsivity) considered brute luck?**  
  Only if CAD verifies the trait is (a) biologically innate *and* (b) resistant to moral cultivation interventions (§9.2). Volitional traits (e.g., "laziness" attributed to insufficient effort) are option luck (§9.3). Submit Form BBL-40 (*Character Ontology Disclosure*) with childhood behavioral records and neuro-ethical panel results. Compensation, if awarded, is calibrated to the earnings gap versus a "reasonably diligent citizen" (§9.5).  

  **9. Does the BBL assist those in immediate distress?**  
  Emergency stipends are available under §11 (*Hardship Mitigation*) for brute-luck-caused crises (e.g., congenital disability flare-ups, natural disasters). Stipends are clawed back if CAD later attributes >50% of the hardship to option luck (§11.4). *Note:* Distress from eligible imprudence (e.g., starvation after gambling losses) is redirected to municipal shelters (non-BBL jurisdiction).  

  **10. Where can I learn more about my RCCS baseline or file forms?**  
  Visit www.bbl.gov/rccs or your regional BBL office. All claims require Identity Trait Verification (ITV) scans. Processing times: 14–26 months.  

  ---  
  **Administrative Philosophy Notes (Embedded Per Request):**  
  - **Asymmetry Handling:** The untalented (§6) receive compensation calibrated to a societal average; the reckless (§4) receive nothing. This reflects the core commitment: brute luck is misfortunate, option luck is not unjust.  
  - **Expensive Tastes (§5):** Medicalization pathologizes choice, preserving the theory’s distinction without explicit moralism.  
  - **Baseline Shift:** "Counterfactual-average earnings" (§6) assumes a stable talent baseline, while "reasonably diligent citizen" (§8) imports a contested normative ideal.  
  - **Circular Appeals:** The Counterfactual Consent Audit (§7) uses RCCS to evaluate RCCS, exposing the theory’s foundational circularity when operationalized.  
  - **Trait/Choice Distinction:** Form BBL-5’s 360-day review satirizes the unadministrable metaphysics of disentangling choice/circumstance.  

  *This handbook supersedes all prior editions. Refer to BBL Code §1–15 for statutory details. Errors may be reported via Form BBL-99 (non-compensatable).*
