answer: |-
  ## The Narrow Miss

  That's me over there, the very same,
  Who caught the break, who won the fight,
  Who dodged the shadow, spared the blame.
  This coin-toss world, this fragile frame,
  Held different light that autumn night.
  That's me over there, the very same.
  The judge looked down, called not my name,
  The margins thin, the outcome tight.
  Who dodged the shadow, spared the blame?
  I see them breathe, avoid the flame
  That licks *my* skin in fading light.
  That's me over there, the very same?
  No, that's not me—just someone near,
  Whose path diverged, whose stars burned bright,
  Just close enough to stand for me.
  They wear the crown I longed to claim,
  Their future clear, horizon white.
  That's me over there, the very same?
  No, that's not me—just someone near.
  Their joy is theirs, distinct, complete,
  Not mine displaced, though bittersweet.
  Who dodged the shadow, spared the blame?
  Just close enough to stand for me.
  That's me over there, the very same?
  No, that's not me—just someone near.

  ---

  **Refrain Identification & Final Couplet:**

  *   **"That's me over there, the very same"** embodies **Transworld Identity**: It asserts that the individual in the favorable outcome *is the very same person* as the speaker, existing across worlds ("the very same"), implying what happened *to them* intrinsically happened *to me* ("Who dodged the shadow, spared the blame").
  *   **"No, that's not me—just someone near / Just close enough to stand for me"** embodies **Counterpart Theory**: It explicitly denies identity ("No, that's not me"). The other is merely "someone near" – a distinct individual in another world whose relevant similarity ("just close enough") allows them to *represent* the speaker in modal claims ("stand for me"). Their victory makes true the claim *"I could have won"* without them *being* the speaker.

  **The Final Couplet's Placement:**
  The last two lines juxtapose the core refrains side-by-side: "That's me over there, the very same? / No, that's not me—just someone near." The question mark introduces profound doubt. This placement forces the unresolved tension into sharp focus: are these lines spoken *by one person* oscillating between metaphysical interpretations, or are they the *contradictory assertions* of two distinct individuals (the speaker and their counterpart)? The poem deliberately refuses to answer, embodying the unresolved debate itself – the very essence of the modal quandary the speaker faces. The ambiguity *is* the philosophical point.
