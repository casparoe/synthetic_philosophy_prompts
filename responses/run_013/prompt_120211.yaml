prompt: |-
  I am the risk officer at a mid-sized mutual insurer. Four times a year a committee of six — underwriters, our actuary, the CFO, none of them statisticians — works through the risk register line by line, and what we write down decides how much capital we hold against each entry and how we price two of our lines. Our house practice is to have two analysts score each risk from 1 to 5 for likelihood, average the scores, and then discuss the average as though it were a probability. Replace it with a procedure a non-specialist can run in fifteen minutes per entry, built out of Keynes's account of probability and uncertainty rather than out of our actuarial habits: that a probability is always relative to a particular body of evidence, so numbers drawn from different evidence are not two readings of one quantity; that the weight of evidence behind a probability is a separate matter from the probability itself, so a firm-looking figure can rest on almost nothing; and that probabilities need not all be comparable, so some entries may not be rankable against the others at all. Give me the steps in order, what counts as an adequate answer at each, where a step returns no number and what to record and do instead, and where the procedure must stop and hand the decision to the committee because what remains is a judgment of values or of nerve. Run it on three entries: a liability exposure never litigated in our jurisdiction, with no close precedent anywhere; a risk covered by twenty years of our own clean loss data; and one where my two analysts return 15% and 40% from substantially different evidence and the committee wants the blended 27.5% in the register. Say which of Keynes's distinctions you had to drop to make the thing usable and what that costs, where the procedure will misfire, and what it cannot do.
reasoning: |-
  We are designing a risk assessment procedure based on Keynes's ideas:
   1. Probability is relative to evidence, so probabilities from different evidence bases are not directly comparable.
   2. The weight of evidence (how much evidence we have) is separate from the probability value.
   3. Not all probabilities are comparable (some risks may not be rankable).

   We want a procedure that non-specialists can run in about 15 minutes per risk entry.

   Steps:

   1. **Define the Risk and the Evidence Base(s)**
      - For each risk, clearly state what the risk is and what evidence is being considered.
      - If there are multiple sources of evidence, note each one separately.
      - Adequate answer: A clear, concise description of the risk and the evidence (or lack thereof) that we are using to assess it.

   2. **Assess the Weight of Evidence**
      - This is about the amount and quality of evidence. We might use a qualitative scale (e.g., very low, low, medium, high, very high) or a descriptive one.
      - Consider: How much data? How relevant? How reliable? How recent?
      - Adequate answer: A rating (or description) of the weight of evidence. It must not be a number but a category or a narrative.

   3. **Assign Probability Ranges (if possible) or a Point Estimate (if necessary) with Caveats**
      - Instead of a single number, we might assign a range (low, high) to reflect uncertainty.
      - If we have no basis for a quantitative estimate, we might assign a qualitative category (e.g., very low, low, medium, high, very high) or note that it's unquantifiable.
      - Important: If the evidence is from different sources and we are forced to combine, we must note that the resulting number is a compromise and not a true probability. But Keynes would warn against combining evidence from different bases arbitrarily.

   4. **Note Comparability Issues**
      - For each risk, note whether the probability assessment (whether quantitative or qualitative) is comparable with other risks. This might be based on similar evidence weight and type?
      - If not comparable, flag it.

   5. **Decision Points for the Committee**
      - Where the procedure cannot assign a number (or even a range) because of lack of evidence, we stop and hand over to the committee for a judgment call (based on values or nerve).
      - Also, when the weight of evidence is very low, the committee must decide on the capital and pricing because the number (if we assign one) is highly uncertain.

   6. **Record Keeping**
      - We record:
          a) The risk description and evidence base(s).
          b) The weight of evidence.
          c) The probability assessment (which might be a range, a point with caveats, or a qualitative label) and any caveats about its reliability.
          d) A note on comparability with other risks.
          e) If we cannot assign a probability, we record why and what the committee decided.

   Now, let's run three examples:

   Example 1: A liability exposure never litigated in our jurisdiction, with no close precedent anywhere.

    Step 1: 
        Risk: Liability exposure for [specific risk]. 
        Evidence: No litigation in our jurisdiction and no close precedent anywhere. We have only theoretical arguments and perhaps analogies to very different situations.

    Step 2: 
        Weight of evidence: Very low. We have almost no direct evidence.

    Step 3: 
        We cannot assign a meaningful probability number. We might assign a qualitative label: "Very low" but with the caveat that it is highly uncertain. Alternatively, we might say that we have no basis for a numerical estimate.

    Step 4: 
        This risk is not comparable with risks that have data.

    Step 5: 
        We stop and hand to the committee. They must decide based on the nature of the risk, the company's risk appetite, and strategic considerations.

    Record: 
        We record the above and the committee's decision (which might be to assign a capital charge arbitrarily or based on a worst-case scenario).

   Example 2: A risk covered by twenty years of our own clean loss data.

    Step 1:
        Risk: [Specific risk]
        Evidence: 20 years of internal loss data, clean (meaning consistent and reliable).

    Step 2:
        Weight of evidence: High (or very high).

    Step 3:
        We can calculate a point estimate (e.g., average annual loss probability) and perhaps a confidence interval. But note: Keynes would say that even with 20 years, if the environment is changing, we might have some uncertainty. However, we can assign a number (say 2.5%) and note that it is based on strong internal data.

    Step 4:
        This risk is comparable with other risks that have a similar weight of evidence and data type.

    Step 5:
        We do not need to stop the procedure. We record the number and the committee can use it.

   Example 3: A risk where two analysts return 15% and 40% from substantially different evidence and the committee wants the blended 27.5% in the register.

    Step 1:
        Risk: [Specific risk]
        Evidence: Two different evidence bases (we must describe each). For example:
            Analyst 1: Evidence base A (say, internal data from a similar product in the past 5 years) -> 15%
            Analyst 2: Evidence base B (say, industry data from a different jurisdiction) -> 40%

    Step 2:
        We assess the weight of evidence for each source:
            Evidence A: Medium (if only 5 years and similar but not identical product)
            Evidence B: Low (different jurisdiction, might not be directly applicable)

        Overall weight? We might say overall weight is low to medium because the two sources are inconsistent and from different bases.

    Step 3:
        We cannot simply average because the probabilities are from different evidence bases. Keynes would say they are not two readings of the same thing.

        Instead, we might:
          - Present both estimates and their evidence bases and weights.
          - Or, if we must have one number, we might choose one of the estimates (the one with the higher weight of evidence) and discard the other? But that might be arbitrary.

        However, the committee wants a blended number. We must note that this blending is not justified by Keynes's view. We can do it only as a practical compromise and with a strong caveat.

        We assign: 27.5% but note that it is a compromise and not a true probability. Also, we record the range (15% to 40%) and the fact that the evidence bases are different.

    Step 4:
        This risk is not easily comparable with others because the probability is a blend of two different evidence bases.

    Step 5:
        We might let the committee decide if they want to use the blended number despite the caveats. We record the caveats.

   What Keynesian distinctions did we drop?

    - We allowed the blending of probabilities from different evidence bases (in Example 3). This violates Keynes's principle that probabilities are relative to evidence. The cost is that we are creating a number that has no clear evidential basis and might mislead.

    - We sometimes assign point estimates even when the weight of evidence is low (if the committee insists) but we try to avoid it by stopping and handing over. However, in Example 3 we did assign a point estimate (blended) despite the weak and conflicting evidence.

    - We use qualitative labels for weight of evidence and sometimes for probabilities. This is in line with Keynes, but we also use numbers when we have data (Example 2). The problem is that numbers might give a false sense of precision when the weight is low (but we try to mitigate by the weight assessment).

   Where the procedure will misfire:

    - When the committee insists on a number even for risks with very low weight of evidence (like Example 1 and 3) and we are forced to provide one arbitrarily.

    - When the evidence bases are different and we blend, we are creating a pseudo-probability that might be used in quantitative models (like capital calculation) as if it were a real probability.

    - The comparability note might be ignored when ranking risks.

   What it cannot do:

    - It cannot produce a single comparable risk ranking for all risks because some are incommensurable.

    - It cannot assign a meaningful probability when there is no evidence (Example 1) without resorting to arbitrary judgment.

    - It cannot resolve fundamental uncertainty (where the future might be radically different from the past) by data alone.

   Steps in Order:

    1. **Risk and Evidence Description**: Write down the risk and the evidence base(s). If multiple, describe each.
    2. **Weight of Evidence Assessment**: Assign a qualitative rating (Very Low, Low, Medium, High, Very High) and/or a brief narrative.
    3. **Probability Assessment**:
          - If the weight of evidence is High or Very High and the evidence is homogeneous: 
              Assign a point estimate (if appropriate) and a range (e.g., 95% confidence interval) if possible, or a point estimate with the note that it is well-supported.
          - If the weight is Medium or Low and we have some data but not enough for a precise estimate: 
              Assign a range (e.g., low to high) and note the uncertainty.
          - If the weight is Very Low or the evidence is from multiple and conflicting sources and we cannot reconcile:
              We may assign a qualitative label (e.g., "Low", "Medium", "High") or a very wide range, or we may stop and hand over to the committee.
          - If there are multiple estimates from different evidence bases and we must combine: 
              We note each estimate and its evidence base. If the committee insists on a single number, we average (or use another method) but with a clear note that it is a compromise and the true probability is uncertain. We record the range and the conflict.

    4. **Comparability Check**: Note whether this risk's probability can be compared with others (based on similar evidence weight and type). If not, note why.

    5. **Decision to Committee**:
          - If we cannot assign a probability (even a qualitative one) because of complete lack of evidence, we stop and hand over.
          - If the weight of evidence is very low and the risk is material, we hand over for the committee to decide based on judgment.

    6. **Record**:
          - The description, weight, probability assessment (with caveats), comparability note, and any committee decisions.

   We must train the committee to understand that:
     - A probability without a high weight of evidence is not reliable.
     - Not all risks can be compared.
     - Sometimes, we must rely on judgment.

   Let's re-run the examples in the step-by-step:

   Example 1:
     Step 1: Risk: Liability exposure for [X]. Evidence: No litigation in our jurisdiction, no close precedent elsewhere. We have only theoretical considerations.
     Step 2: Weight: Very Low.
     Step 3: We cannot assign a meaningful number. We assign a qualitative label: "Very Low" but with a note that it is highly uncertain and based on theory. However, we also note that the potential impact could be high. 
             We might also assign a range? But without data, we can't. So we stop at Step 5.
     Step 4: Not comparable.
     Step 5: Hand to committee. They decide the capital and pricing based on the nature of the risk and the company's appetite.

     Record: 
          Risk: [X]
          Evidence: (as above)
          Weight: Very Low
          Probability: Not quantifiable. Qualitative: "Very Low" but with high uncertainty.
          Committee decision: [e.g., hold capital at $Y, price at Z%]

   Example 2:
     Step 1: Risk: [Y]. Evidence: 20 years of internal clean loss data.
     Step 2: Weight: High.
     Step 3: We calculate the historical loss frequency (say 2.5%). We also note a range (maybe 2.0% to 3.0% based on a simple confidence interval?).
     Step 4: Comparable with other risks that have high weight and internal data.
     Step 5: No handover. We record the number.

     Record:
          Risk: [Y]
          Evidence: Internal data, 20 years.
          Weight: High
          Probability: 2.5% (range 2.0%-3.0%)
          Comparable: Yes

   Example 3:
     Step 1: Risk: [Z]. Evidence: 
            - Analyst 1: Internal data from similar product (last 5 years) -> 15%
            - Analyst 2: Industry data from Jurisdiction ABC -> 40%
     Step 2: Weight for Analyst 1: Medium (because 5 years is shorter and product is similar but not identical). Weight for Analyst 2: Low (different jurisdiction). Overall: Low to Medium.
     Step 3: We present both estimates. But the committee wants a blended number. We assign 27.5% (the average) and note that it is a blend of two different evidence bases and should be used with caution. We also record the range 15%-40%.
     Step 4: Not comparable with risks that have a single evidence base and high weight.
     Step 5: We record the number but with caveats. The committee must be aware of the uncertainty.

     Record:
          Risk: [Z]
          Evidence: Two sources (as above)
          Weight: Low to Medium (with details)
          Probability: 27.5% (blended from 15% and 40%), range 15% to 40%
          Note: This is a compromise. The two probabilities are from different evidence bases and are not directly comparable. Use with caution.

   In summary, we have made the procedure usable by:
     - Using qualitative labels for weight of evidence and sometimes for probability.
     - Allowing ranges and qualitative assessments when numbers are not feasible.
     - Allowing a blended number in Example 3 (which violates Keynes) but with a caveat.

   The cost of dropping the stricture against blending is that we are creating a number that has no true evidential basis. It might lead to overconfidence and mispricing.

   The procedure will misfire when:
     - The committee ignores the caveats and treats all probabilities as equally reliable.
     - The qualitative labels are too vague and lead to inconsistent assessments.

   What the procedure cannot do:
     - It cannot eliminate the need for judgment in the face of uncertainty.
     - It cannot make incommensurable risks commensurable.
     - It cannot provide a single, objective, and comparable risk ranking for all risks.
answer: |-
  Below is a structured 15-minute risk assessment procedure based on Keynes's principles, designed for non-specialists. The procedure emphasizes **evidence relativity**, **weight of evidence**, and **non-comparability** of probabilities. Steps are sequential, with clear exit points for committee judgment. I'll first outline the steps, then apply them to your three examples, and finally discuss limitations.

  ---

  ### **Keynes-Based Risk Assessment Procedure**  
  **Time Allocation:** ~15 minutes per risk entry.  

  | **Step** | **Action** | **Adequate Answer** | **When No Number is Returned** | **Handoff to Committee Trigger** |
  |----------|------------|---------------------|--------------------------------|----------------------------------|
  | **1. Define Evidence Base** | Specify the source(s) and quality of evidence supporting the risk. | A concise description (e.g., "20 years of internal loss data," "no precedents, only expert opinions"). | N/A (always descriptive). | If evidence is contradictory or indecipherable. |
  | **2. Assign Likelihood (Evidence-Relative)** | Score likelihood **only if evidence is homogeneous**. Use: <br>- **Point estimate** (e.g., 2%) *if high weight & quantitative*. <br>- **Range** (e.g., 10–25%) *if medium weight*. <br>- **Qualitative label** (e.g., "Low") *if low weight*. | A probability/range/label **tied directly to the evidence base**. | If evidence is fragmented, conflicting, or absent: **Skip to Step 3**. | If evidence bases are irreconcilable (e.g., two analysts use unrelated data). |
  | **3. Assess Weight of Evidence** | Judge evidence robustness: <br>- **High weight**: Ample, consistent data (e.g., decades of clean loss history). <br>- **Medium weight**: Partial data or relevant proxies. <br>- **Low weight**: Sparse/anecdotal data or pure speculation. | A categorical rating (High/Medium/Low) + 1-sentence rationale. | N/A (always assessed). | If weight is "Low" *and* risk impact is severe. |
  | **4. Check Comparability** | Can this risk’s likelihood be ranked against others? Only if: <br>- Evidence bases are similar (e.g., both use internal data). <br>- Weight of evidence is comparable (e.g., both "High"). | "Yes," "No," or "Partial" with justification. | N/A (always assessed). | If "No" comparability *and* ranking is required for capital allocation. |
  | **5. Document & Flag Uncertainty** | Record: <br>- Evidence base (Step 1). <br>- Likelihood (Step 2) **with context**. <br>- Weight (Step 3). <br>- Comparability (Step 4). | A transparent summary that highlights gaps. | If Step 2 skipped: "Likelihood unquantifiable due to [reason]." | Always: Committee reviews documentation. |

  ---

  ### **Application to Your Three Examples**  

  #### **Example 1: Liability Exposure with No Precedent**  
  - **Step 1 (Evidence):** "No litigation in our jurisdiction; no close analogs globally. Relies on underwriter conjectures about hypothetical scenarios."  
  - **Step 2 (Likelihood):** **No number** – evidence is speculative. Use qualitative label: "Very Low."  
  - **Step 3 (Weight):** "Low" (no data, only opinions).  
  - **Step 4 (Comparability):** "No – incomparable to data-driven risks."  
  - **Step 5 (Document):** "Unquantifiable likelihood. Weight: Low. Committee judgment required for capital."  
  - **Committee Handoff:** Mandatory. Capital must be set by strategic choice (not pseudo-probability).  

  #### **Example 2: Risk with 20 Years of Clean Data**  
  - **Step 1 (Evidence):** "Internal loss data (20 years), no anomalies, fully relevant to current exposure."  
  - **Step 2 (Likelihood):** Point estimate (e.g., 1.2%) + range (e.g., 1.0–1.5% based on volatility).  
  - **Step 3 (Weight):** "High" (abundant, direct evidence).  
  - **Step 4 (Comparability):** "Yes – comparable to other internal-data risks."  
  - **Step 5 (Document):** "1.2% (range: 1.0–1.5%). Weight: High. Capital can be modeled quantitatively."  
  - **No Committee Handoff:** Proceed to capital calculations.  

  #### **Example 3: Conflicting Analyst Estimates (15% vs. 40%)**  
  - **Step 1 (Evidence):** "Analyst 1: Industry study from dissimilar markets (15%). Analyst 2: Internal near-miss data from a different product line (40%)."  
  - **Step 2 (Likelihood):** **No number** – evidence bases are incompatible (per Keynes). Do **not** average. Assign range: "15–40%."  
  - **Step 3 (Weight):** "Medium" (data exists but relevance/consistency weak).  
  - **Step 4 (Comparability):** "Partial – only broadly comparable to other medium-weight risks."  
  - **Step 5 (Document):** "Range: 15–40%. Weight: Medium. Incompatible evidence bases prevent a single estimate."  
  - **Committee Handoff:** Required to resolve the range into a single number (e.g., 27.5%) **if insisted**. Document: "27.5% is a policy choice, not a probability."  

  ---

  ### **Keynesian Distinctions Dropped & Costs**  
  1. **Dropped: Strict Non-Comparability Enforcement**  
     - **What:** In Step 4, we allow "Partial" comparability (e.g., medium-weight risks grouped loosely).  
     - **Cost:** Risks misranked if evidence bases are meaningfully different (e.g., internal data vs. external studies). Capital may be misallocated.  

  2. **Dropped: Ban on Blending Evidence**  
     - **What:** In Example 3, the committee can force a blended figure (27.5%) despite Keynes’s warning.  
     - **Cost:** The number implies precision where none exists, potentially understating uncertainty.  

  3. **Dropped: Weight-Probability Indivisibility**  
     - **What:** We separate weight (Step 3) and likelihood (Step 2) but let low-weight risks get point estimates (e.g., Example 1’s "Very Low").  
     - **Cost:** A low-weight point estimate (e.g., 5%) may be misinterpreted as robust, inviting underpricing.  

  ---

  ### **Where the Procedure Misfires**  
  1. **False Precision:** Committees may ignore ranges (Example 3) and use blended figures as "true" probabilities.  
  2. **Over-Reliance on Labels:** Qualitative likelihoods (e.g., "Low") may be mapped to numerical values (e.g., 1%), violating evidence relativity.  
  3. **Weight Ignorance:** If "Low weight" is overlooked in capital modeling, tail risks are underestimated.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Fundamental Uncertainty:** Risks with no evidence (Example 1) require committee nerve, not computation.  
  2. **Replace Value Judgments:** Capital allocation for non-comparable risks involves strategy, not statistics.  
  3. **Force Rationality:** Committees may still demand numbers for unquantifiable risks to "fill the register."  

  ---

  ### **Conclusion**  
  This procedure distills Keynes’s core ideas into a pragmatic 15-minute workflow. It **succeeds** in distinguishing evidence quality, rejecting invalid averages, and flagging unquantifiable risks. It **fails** when committees override it for simplicity, blending probabilities or forcing comparability. The trade-off is usability: by allowing partial comparability and committee overrides, we avoid analysis paralysis but accept marginal model violations. Use it as a "stopping rule" to spotlight uncertainty – not a statistical tool.
