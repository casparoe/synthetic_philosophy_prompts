  First, the user wants to know which open questions deserve the most time and in what order. They care about the reasoning behind each choice—why it's upstream, its tractability for philosophers, how the order-invariance thesis relates, and what a new result would change. They're also open to critiques of the framing itself, like whether the focus should be on the purpose of update rules rather than correctness.

