answer: |-
  Here is your diagnostic instrument—a concrete quiz with scoring key—designed to sort positions on judging historical figures by modern standards. It uses Jefferson (slaveholding despite Enlightenment ideals) and Churchill (colonial policies/famines) as touchstones, plus King Leopold II of Belgium (brutal Congo exploitation, uncontested by European powers at the time) as the uncontested-wrongdoing case.

  **Instructions:** Answer each question **Yes (Y)** or **No (N)** based on your instinct. Be honest—don’t overthink. Tally your answers (e.g., Y-N-Y-N) and match them to the scoring key.

  ---

  ### **Diagnostic Questions**
  1. **"Could they have known?"**  
     When judging a historical figure’s actions (e.g., Jefferson owning slaves, Churchill causing the Bengal famine), must we prove *they personally knew it was wrong by their era’s standards*?  
     *(If Yes, blame requires contemporary awareness; if No, modern standards apply regardless.)*

  2. **"Person or pedestal?"**  
     Is the real problem not the historical figure *themselves*, but how society **commemorates them today** (e.g., statues of Jefferson, Churchill’s hero status)?  
     *(If Yes, focus shifts to modern honors; if No, the person’s moral worth is central.)*

  3. **"One scale or two?"**  
     Can "great" achievements (e.g., Jefferson drafting the Declaration, Churchill defeating Nazism) morally **offset** "bad" acts (e.g., slavery, colonial brutality)—or are greatness and goodness separate?  
     *(If Yes, virtues balance vices; if No, they’re independent.)*

  4. **"Uncontested evil exception?"**  
     Should actions **universally accepted** in their time (e.g., colonial exploitation under Leopold II) be judged *less harshly* than actions contemporaries debated (e.g., Jefferson’s slavery amidst abolitionist movements)?  
     *(If Yes, uncontested acts get leniency; if No, both are equally condemnable.)*

  ---

  ### **Scoring Key: Positions on Judging Historical Figures**
  Match your answers (Q1-Q4, e.g., Y-N-Y-N) to one of eight positions. Each position includes:  
  - **Name** (ordinary language).  
  - **Core Stance**.  
  - **Most Awkward Commitment** (what this view *must* accept).  
  - **Case Implications** (Jefferson/Churchill/Leopold II).

  | **Answer Pattern** | **Position**                     | **Core Stance**                                                                 | **Most Awkward Commitment**                                   | **Case Implications**                                                                 |
  |--------------------|----------------------------------|---------------------------------------------------------------------------------|---------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **N-N-Y-N**        | **Presentist Prosecutor**        | Modern standards apply directly; judge persons harshly.                        | Churchill is *worse* than Hitler (due to "offsetting" not applying). | Jefferson: Villain. Churchill: Villain. Leopold II: Villain.                          |
  | **N-Y-Y-N**        | **Presentist Symbol Scrutinizer**| Modern standards apply, but only to *current commemoration*—not the dead.      | Honoring Leopold II today is as wrong as honoring Hitler.    | Jefferson statues: Wrong. Churchill worship: Wrong. Leopold II statues: Wrong.       |
  | **Y-N-Y-Y**        | **Self-Condemned Standard Bearer**| Blame only if they violated *their own era’s* ethics (or their personal ideals). | Jefferson’s slavery is condemnable; Leopold II’s isn’t (no self-contradiction). | Jefferson: Hypocrite. Churchill: Mixed (e.g., Bengal contested). Leopold II: Blameless. |
  | **Y-Y-N-N**        | **Legacy Guardian**              | Judge only *how we remember them now*; historical context excuses the dead.    | A statue of Leopold II in 2024 is indefensible, but *he* isn’t. | Jefferson statues: Defensible? Churchill statues: Contextual. Leopold II statues: Remove. |
  | **N-N-N-Y**        | **Moral Archaeologist**          | Judge acts by modern standards, but uncontested evils get partial "ignorance" defense. | Leopold II is *less* guilty than Jefferson (due to lack of contemporary debate). | Jefferson: Guilty. Churchill: Guilty. Leopold II: Partially excused.                |
  | **Y-N-N-N**        | **Contextual Absolver**          | No moral judgment—historical context explains all. "Goodness" is period-bound. | Leopold II was merely "of his time"; no moral fault exists. | Jefferson: Product of era. Churchill: Product of era. Leopold II: Product of era.    |
  | **N-Y-N-N**        | **Institution Inspector**        | Refuse to judge *persons*; judge systems/ideologies that enabled them (then and now). | Churchill’s imperialism is condemnable; *he* is just its avatar. | Slavery/colonialism: Evil. Jefferson/Churchill/Leopold II: Not targets.             |
  | **N-N-N-N**        | **Dual Scale Evaluator**         | Greatness ≠ Goodness. Judge acts by modern ethics, but weigh impact separately. | Churchill was both a moral monster *and* a necessary war hero. | Jefferson: Great founder, bad man. Churchill: Necessary leader, brutal imperialist. Leopold II: Pure evil. |

  ---

  ### **Gaps, Incoherencies & Indistinctions**
  - **The "Forbidden Corner" (Y-Y-Y-?)**  
    *Gap*: If you demand contemporary awareness (Y), focus on commemoration (Y), *and* allow virtues to offset vices (Y), you get incoherence. How can we judge modern tributes *and* excuse historical actors *and* let "greatness" offset "badness"? *Verdict*: **Incoherent** (no logical occupant).
    
  - **"Contested Conduct" Fails to Split Key Positions**  
    Question 4 (uncontested evil) *doesn’t* split:  
    - **Institution Inspector** (N-Y-N-N) and **Dual Scale Evaluator** (N-N-N-N) both reject uncontested leniency.  
    - **Contextual Absolver** (Y-N-N-N) and **Self-Condemned Standard Bearer** (Y-N-Y-Y) both use it.  
    *Verdict*: **Neglect**—this distinction matters less than the others.

  - **The "Unattractive Middle" (Y-N-Y-N)**  
    *Gap*: Demands contemporary awareness (Y), judges persons not symbols (N), lets virtues offset vices (Y), and rejects uncontested leniency (N). But if virtues offset vices *and* modern standards apply without leniency, "contextual awareness" becomes redundant. *Verdict*: **Unattractive** (no coherent occupant; merges into Self-Condemned or Dual Scale).

  ---

  ### **How to Use This**
  1. Answer the four questions honestly.  
  2. Match your Y/N pattern to the scoring key.  
  3. Read your position’s "Awkward Commitment"—this tests if you accept its implications.  
  4. See which historical figures your view condemns/excuses and why.  

  This tool isolates your **operational principles** on judging the past, using contested cases to force clarity. No philosophy degree needed—just your intuition.
