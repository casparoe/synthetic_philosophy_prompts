answer: |-
  Here’s a final exam question designed to force engagement with the core tension, a model answer, and a precise marking scheme. It uses a fresh example to avoid canned responses.

  ---

  **QUESTION (25 marks; 90 minutes)**  
  Consider the following pair:  
  (A) *Indicative*: "If Dr. Vance didn’t administer the antidote last night, the patient died."  
  (B) *Counterfactual*: "If Dr. Vance hadn’t administered the antidote last night, the patient would have died."  

  **Context**: We know the patient survived. We also know Dr. Vance was on duty, but we *don’t* know whether she administered the antidote.  

  (1) Explain why (A) intuitively seems true while (B) intuitively seems false. Your explanation must specify how the *semantic contribution* of the antecedent differs between the two conditionals. (7 marks)  

  (2) Analyze why a unified semantic account (e.g., Stalnaker/Lewis *or* the probabilistic account) struggles to capture both (A) and (B) without ad-hoc modifications. Focus on the conflict between *truth-conditions* and *epistemic constraints*. (8 marks)  

  (3) Argue whether a unified theory is possible. Your answer must:  
  - Evaluate **one** specific proposal to unify indicatives and counterfactuals (e.g., Kratzer’s restrictor analysis, past-tense morphology as counterfactuality marker, or antecedent falsity as a presupposition),  
  - Explain what it *gets right* and where it *fails* to resolve the tension in (A)/(B). (10 marks)  

  ---

  **MODEL ANSWER (≈600 words)**  

  **(1) The Divergence**  
  (A) is naturally true because, given the patient’s survival, *if Vance didn’t act, death must have been inevitable*. This conditional quantifies over epistemic possibilities: in *all scenarios compatible with our knowledge* where Vance didn’t act, the patient died. Its truth depends on our evidence (survival implies intervention or luck). (B) is false because it presupposes Vance *did* act (as the patient survived) and constructs a minimal-change counterfactual world where she didn’t. In that world, no other intervention is assumed, so death isn’t guaranteed. Crucially, the antecedent in (A) *restricts epistemic possibilities* (worlds consistent with our ignorance), while in (B) it *triggers a metaphysical simulation* (worlds where a known fact is altered with minimal departure from actuality).  

  **(2) The Standoff**  
  A unified Stalnaker/Lewis account fails: treating (A) as selection over a similarity ordering ignores its epistemic basis. If we evaluate (A) in the "nearest world" where Vance didn’t act, we might get falsity (if luck saved the patient), contradicting its intuitive truth. Conversely, applying probabilistic semantics (where P(if A, C) = P(C|A)) to (B) collapses: P(death | ¬administer) may be high, but (B) is false because in the *closest* ¬administer-world, death might not occur (e.g., another doctor intervenes). The conflict is *systematic*:  
  - **Indicatives** (like A) require *non-vacuous truth* when the antecedent is epistemically possible (¬A ∧ C worlds must be ruled out).  
  - **Counterfactuals** (like B) presuppose antecedent *falsity* and demand *non-vacuous falsity* (some closest ¬A-worlds may be ¬C-worlds).  
  Lewis’ triviality proofs formalize this: no proposition can simultaneously satisfy P(if A, C) = P(C|A) *and* have objective truth-conditions across contexts.  

  **(3) Against Unification**  
  Unification is unlikely. Consider Kratzer’s restrictor analysis: "if"-clauses restrict modal bases (epistemic for indicatives, circumstantial for counterfactuals). This *describes* the difference but doesn’t *explain* it. For (A), restricting an epistemic modal ("must") with "¬administer" yields: "Given ¬administer, the patient *must* have died." This captures (A)’s truth. For (B), restricting a circumstantial modal with "¬administer" gives: "In circumstances where Vance didn’t act, death *would* follow." But without stipulating the *right* circumstances (e.g., no other saviors), this can be false, matching (B). **The problem**: This "unification" merely relabels the distinction. It doesn’t reduce both to a shared core semantics; it *presupposes* the epistemic/metaphysical divide. Worse, it cannot handle *mixed* cases (e.g., future indicatives like "If it rains, the match will be canceled" lack epistemic necessity).  

  The past-tense-morphology-as-counterfactuality-marker proposal (e.g., Iatridou) claims that past tense in (B) signals remoteness. But in (A), past tense ("didn’t") appears without counterfactuality, and counterfactuals can lack past morphology (e.g., "If he *is* guilty, I’ll eat my hat" is indicative despite present tense). Treating antecedent falsity as a presupposition for counterfactuals (Stalnaker) explains why (B) presupposes Vance acted, but says nothing about why (A) lacks this presupposition. Crucially, *none* resolve the truth-conditional clash: indicatives remain tied to knowledge-relative possibilities, counterfactuals to objective similarity. Until we explain why the same syntax triggers two irreconcilable interpretive mechanisms, unification remains elusive.  

  ---

  **MARKING SCHEME (Total: 25)**  

  | **Criterion**                                                                 | **Marks** | **A vs. B Distinction**                                                                 | **Common Flubs**                                                                 |
  | :---------------------------------------------------------------------------- | :-------- | :-------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------ |
  | **1a: Correctly identifies (A) as epistemic necessity**                       | 2         | A: Explicitly ties (A) to evidence/knowledge. B: Calls it "probable" or vague.          | Calls (A) "about logic" or "material conditional."                              |
  | **1b: Correctly identifies (B) as minimal-change simulation**                 | 2         | A: Notes (B) alters a known fact (survival). B: Only says "false because antecedent false." | Treats (B) as "hypothetical" without addressing world-similarity.               |
  | **1c: Contrasts antecedent role (epistemic vs. metaphysical restriction)** | 3         | A: Explicitly contrasts epistemic/metaphysical domains. B: Says "different meanings."   | Claims antecedents are "the same" or confuses restriction with implication.     |
  | **2a: Explains why probabilistic account fails for (B)**                      | 3         | A: Notes (B) requires similarity, not just high P(C\|A). B: Only says "probability ≠ truth." | Asserts (B) is "subjunctive" without explaining truth-conditions.               |
  | **2b: Explains why Stalnaker/Lewis fails for (A)**                            | 3         | A: Notes vacuity/ignorance problem in (A). B: Says "worlds don’t work for indicatives." | Claims (A) is "about real world" ignoring epistemic uncertainty.                |
  | **2c: Mentions triviality or non-vacuity constraint**                         | 2         | A: Cites Lewis or notes P(if A,C)=P(C\|A) can’t hold for truth-conditional (B). B: Vague reference. | Omits triviality or misstates it (e.g., "conditionals can’t be true").           |
  | **3a: Evaluates a specific unification proposal accurately**                  | 3         | A: Chooses one (e.g., Kratzer), explains mechanics. B: Lists proposals without detail.  | Misdescribes proposal (e.g., "Kratzer says if=material conditional").           |
  | **3b: Diagnoses proposal’s failure to resolve tension**                       | 4         | A: Shows proposal *presupposes* the distinction (e.g., modal bases). B: Says "it doesn’t work." | Claims proposal "solves everything" without critique.                           |
  | **3c: Argues against unification (or defends coherently)**                    | 3         | A: Notes irreconcilable truth-makers. B: Asserts unification exists without evidence.   | Conflates syntax/semantics (e.g., "past tense makes it counterfactual").        |

  **Grade Boundaries**:  
  - **A (21–25)**: Hits all A-distinction criteria. Explicitly engages epistemic/metaphysical clash and triviality.  
  - **B (16–20)**: Hits B-distinction criteria. Identifies divergence but lacks mechanistic analysis of proposals.  
  - **C (10–15)**: Describes (A)/(B) intuitively but confounds theories; omits triviality or antecedent roles.  

  ---

  **Why this works**:  
  - Forces contrast via **shared structure + divergent truth-values**. Students *must* explain *why* the same parts yield different interpretations.  
  - Targets **triviality** as the "crux move"—top answers must cite it to explain why unification fails.  
  - Demands **proposal evaluation**, not just description (e.g., showing Kratzer *relabels* without reconciling).  
  - The medical example avoids Oswald’s baggage while preserving ignorance (did Vance act?) and known outcome (survival).  

  This mirrors your lunch debates: it doesn’t solve the standoff but makes students articulate *why* it’s a standoff—and whether their favored theory actually bridges the gap.
