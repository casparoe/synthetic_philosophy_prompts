  ## Found in the Charcoal Wool

  It was the coat's deep pocket, seam-torn, cold,
  Where winter lint and crumpled bus-tickets slept.
  My probing fingers brushed a stubborn fold,
  A crackle in the grey, where secrets kept.
  **Folded once, then twice again,**
  A brittle slip, a script unknown – like rain
  On dusty glass, a pattern without name.
  I held it to the windowpane, insane
  To think the light would grant a sudden key –
  That jagged march, that looping, cryptic flow,
  Resisted sense. What urgency
  Or tenderness might those dark markings show?
  *Folded once, and twice again...*
  No noun, no verb, just strokes on fragile grain.
  The streetlight failed. The mystery remained.

  But look: the ink, a faded indigo,
  Pressed deep in places – urgency confessed?
  And here, a waver, where a breath might go,
  Or hesitation put the pen to test.
  The cheap lined paper, torn with ragged care,
  Not scrap, but chosen, held. A message? There,
  In the *intent* of pressure, in the tear’s
  Precise rebellion. Someone fixed this square
  With purpose sharp as creases in the sheet.
  **Folded once, then twice again,**
  Against the world's indifference, or defeat.
  A life condensed in marks beyond my ken.
  The meaning wasn't in the code's lost sound,
  Nor in the sender, buried underground,
  But in the hand that pressed it to the ground,
  The fragile atlas where two strangers meet.

  ---

  **Recurrence Identifications:**

  1.  **First Occurrence ("Folded once, then twice again"):** Functions as **content the finder tries and fails to use**, describing the physical state of the note as a potential clue to be deciphered.
  2.  **Second Occurrence ("Folded once, and twice again..."):** Signals the **bare recognition that this is a message**, shifting focus from deciphering attempts to the simple, undeniable fact of deliberate form and structure.
  3.  **Third Occurrence ("Folded once, then twice again,"):** Becomes a **portrait of the person who wrote it**, where the act of folding itself, witnessed through the paper and the care/urgency implied by the creases, reveals the sender's state without needing translation.
