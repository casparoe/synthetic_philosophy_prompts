  Here's the joke tailored to your specifications:

  "Three roommates are arguing over the thermostat. They decide to settle it fairly: one will set it behind a veil of ignorance, not knowing which bedroom they'll end up sleeping in. They agree to the rules – unanimous improvements are good, choices shouldn't depend on irrelevant alternatives, and they'll rank options rationally under uncertainty. The chooser, being sensible, assigns equal probability to getting each room. He calculates the expected utility, sets the temperature... and immediately, one roommate shivers, 'Hold on, why am I freezing? Your 'utils' feel like ice to me!' The chooser shrugs: 'Equal odds, equal weights! My math says 68°F maximizes the sum.' The cold roommate mutters, 'Right. So my misery just gets averaged out by someone else's slight preference for 'brisk', and because you rolled a dice on identities, we call this equality?'"

  **What it's playing on:**
  1.  **The Equiprobability Assumption as "Equality":** The joke shows "equality of persons" being implemented purely as a 1/3 probability of being each roommate, bypassing any deeper derivation of why equality matters.
  2.  **Cardinal & Comparable Utilities as the Unspoken Cost:** The freezing roommate highlights the core issue – the theorem *requires* measuring how much one person's discomfort (negative utility) trades off against another's slight preference (positive utility) on a single numerical scale ("utils"), precisely what Arrow's Impossibility Theorem suggests is impossible or meaningless in ordinal social choice. The "averaging out misery" directly points to interpersonal utility comparisons being essential and controversial.
  3.  **The Lottery Machinery:** The entire setup depends on the risky choice framework ("expected utility," "rolled a dice on identities") making these interpersonal comparisons tractable for the rational chooser, contrasting with a risk-averse Rawlsian approach (implied by the complaint).

  **Mechanism:** The joke turns on Harsanyi's theorem deriving utilitarian equality solely from the *technical apparatus* of equiprobability behind the veil and cardinal utility comparisons within a risky-choice framework, rather than from an independent ethical principle of equal consideration.
