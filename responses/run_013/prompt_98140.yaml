  - **Rawls**: Focusing solely on the worst-off group could make most treatments unjustifiable unless they help that group.  
  - **Strict ordinalism**: Would reject QALY aggregation entirely—no summing across people.  

  Philosophical underdetermination is key: any theory accepting cardinal, comparable welfare with neutrality (e.g., utilitarianism, some capability approaches) could technically justify QALY spreadsheets. The user wants this ambiguity laid bare—how the same math serves multiple masters.  

  On WTP: This assumes dollar = uniform welfare increment, which even classical utilitarians reject (due to diminishing returns). Here, the practice’s assumptions are *stronger* than necessary—a utilitarian could adjust for wealth but chooses not to. That’s a policy choice, not a theoretical requirement.  

