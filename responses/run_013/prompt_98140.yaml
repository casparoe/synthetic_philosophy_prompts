  - **Common numeraire**: QALYs imply a universal health-year unit; VSL uses money as a welfare proxy. The latter is shakier because money’s marginal utility decreases with wealth.  
  - **Equal weighting**: Both methods sum gains across people neutrally. No priority to the worse off—unlike prioritarianism.  

