answer: |-
  The practices of cost-per-QALY allocation and uniform VSL-based regulatory analysis rest on a **robust utilitarian framework** that implicitly rejects mainstream welfare economics' ordinalist orthodoxy. Here's a reconstruction of their presupposed theory of interpersonal comparison, its necessary vs. contingent assumptions, and how rival theories would interact with the arithmetic:

  ### Core Presuppositions of the Practice
  1. **Cardinal Welfare**:  
     Welfare must be measurable on a **ratio scale** (zero represents no welfare, and intervals/ratios are meaningful). A QALY gain of 1 for person A is objectively comparable to a gain of 1 for person B.

  2. **Interpersonal Comparability**:  
     Welfare gains/losses across individuals are **additively commensurable**. A 0.5 QALY gain for person A and 0.5 QALY gain for person B sum to 1 QALY of "social welfare."

  3. **Common Numeraire**:  
     - *QALYs*: Life-years in "full health" are a universal welfare currency.  
     - *VSL*: Money serves as a proxy for welfare, converting risk reductions to a common metric via statistical lives saved.

  4. **Equal Weighting**:  
     Each person's welfare unit (QALY or dollar-equivalent) receives **identical social value**. No priority is given to the worse off.

  5. **Stronger Assumption in WTP-based VSL**:  
     Marginal utility of income is **constant across individuals** (or knowably proportional). A dollar paid/traded by a poor person reflects the same welfare change as a dollar from a rich person.

  ### What Practices *Strictly Require* vs. *Contingently Assume*
  | **Element**               | **Strictly Required**                                  | **Contingently Assumed**                          |
  |---------------------------|--------------------------------------------------------|---------------------------------------------------|
  | **Cardinality**           | Yes (ratio scale for welfare)                          | —                                                 |
  | **Interpersonal Comparison** | Yes (summable welfare units)                           | —                                                 |
  | **Equal Weighting**       | Yes (no prioritarian weights)                          | —                                                 |
  | **Welfare Numeraire**     | QALY: Health-years as currency; VSL: Money as proxy    | VSL: *Uniform* money-to-welfare conversion        |
  | **Marginal Utility of Income** | VSL: Money must track welfare (weakly)                 | VSL: *Constant* MUₗ across rich/poor (not required) |

  ### How Rival Theories Interact with the Arithmetic
  1. **Prioritarianism**:  
     - **Breaks QALY arithmetic**: Requires weighting gains to the worse off more heavily. A QALY for a terminally ill patient (low baseline welfare) would count >1 QALY in social calculus.  
     - **VSL Impact**: Poor individuals' WTP would need upward adjustment, violating uniform VSL.

  2. **Rawlsian Lexical Priority**:  
     - **Shatters the system**: Only benefits to the *worst-off group* matter. Allocations failing to prioritize this group (e.g., treatments for moderately ill affluent patients) become unjustifiable regardless of cost-per-QALY efficiency.

  3. **Strict Ordinalism**:  
     - **Incompatible**: Rejects cardinality and interpersonal comparison. QALY aggregation across persons is meaningless; VSL's monetary conversions are illegitimate welfare comparisons.

  4. **Wealth-Weighted Utilitarianism**:  
     - **Modifies but preserves structure**: If MUₗ diminishes with income, VSL would require income-adjusted values (e.g., higher VSL for the poor). QALY arithmetic remains intact if health gains are deemed income-independent.

  ### Philosophically Underdetermined Elements
  The practice is agnostic on **what constitutes welfare**, provided it accepts cardinality and comparability. These frameworks could license identical spreadsheets:
  - **Hedonic Utilitarianism**: QALYs = experienced wellbeing.
  - **Preference Satisfaction**: QALYs based on preferences (e.g., standard gamble/ time-tradeoff utilities).
  - **Capability Approach**: QALYs as proxy for health capabilities (if numerically scaled).
  - **Objective List Theories**: If health-years are deemed objectively valuable.

  **Crucial Underdetermination**: The "QALY" itself is a placeholder. Any theory accepting that *health-related welfare is cardinally measurable, interpersonally comparable, and equally weighted* can use the same cost-per-QALY arithmetic—even if they disagree on *why* health matters (e.g., preference fulfillment vs. essential functioning).

  ### Where the Practice is Most Vulnerable
  - **WTP-based VSL**: Assumes MUₗ is constant (empirically false). A utilitarian could demand wealth-weighting while keeping the framework.  
  - **Equal Weighting**: The rejection of priority to the worse off is a *normative choice*, not a technical necessity. This is ethically contested (e.g., in cancer vs. migraine treatments).  
  - **QALY Homogeneity**: Assumes all "full health" years are identical in welfare value, ignoring qualitative differences (e.g., a year with disability might be preferable to a year with chronic pain at the same "utility" score).

  **In essence**: These practices are utilitarian engines running on cardinal-interpersonal fuel. They survive any theory accepting summable welfare units with neutral weights—but collapse under ordinalism, prioritarianism, or strong egalitarianism. Their resilience lies in divorcing operational metrics from deeper debates about welfare's nature, making them philosophically modular but ethically freighted.
