answer: |-
  After dissecting your cases and underlying questions, here's the cleanest principle that fits your intuitions while respecting game theory's technical realities:

  **Principle:** *Iteratively eliminate any strategy that is **strictly dominated by a mixed strategy** over the player's **remaining** strategies, given the **remaining** pure strategies of opponents.*

  **Precise Statement & Mechanics:**
  1.  **Strict Domination by a Mixed Strategy:** Eliminate a strategy `s_i` for player `i` if there exists a mixed strategy `σ_i` (with support only over strategies still in the game for player `i`) such that:
      `u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i})` for **every** pure strategy profile `s_{-i}` that opponents can play using *their* remaining strategies.
  2.  **Iteration:** Repeat the process using only the strategies remaining after previous eliminations. The set of surviving strategies depends on this order of elimination.
  3.  **Uniqueness:** For strict domination, the *final set of surviving strategies* is unique regardless of the order of elimination (a key theorem).
  4.  **Opponent Strategies:** Checking against **all pure strategy profiles `s_{-i}` of the opponents** is sufficient. Due to the linearity of expected payoff in probabilities, if `σ_i` beats `s_i` against every *pure* opponent profile, it also beats `s_i` against every *mixed* strategy profile over the opponents' *remaining* strategies. You do *not* need to check mixed opponent strategies explicitly.

  **"Strictly Dominated by Mixed" vs. "Never a Best Response":**
  1.  **Two-Player Games:** These concepts are **equivalent** (Pearce's Lemma, 1984). For Player `i`:
      *   If a strategy is strictly dominated by a mixed strategy, it is never a best response to any belief over Player `-i`'s strategies (pure or mixed).
      *   If a strategy is never a best response to any belief over Player `-i`'s strategies, then it is strictly dominated by a mixed strategy over Player `i`'s *other* strategies.
      *   *This perfectly resolves Cases 1, 2, and 3 under one umbrella in 2-player games.*
  2.  **Three-or-More-Player Games (n≥3):** These concepts **can come apart** (Bernheim, 1984; Pearce, 1984). Specifically:
      *   A strategy strictly dominated by a mixed strategy is *always* never a best response.
      *   However, a strategy can be **never a best response** to *independent* mixed strategies of the opponents and yet **NOT** be strictly dominated by any mixed strategy over the player's own strategies.
      *   *This confirms your understanding of Case 5.* The reason is correlation. The definition of "never a best response" typically considers only *uncorrelated* (independent) mixed strategies of opponents. A strategy might not be a best response to any product distribution over opponents' strategies. However, it *could* potentially be a best response if opponents' strategies were *correlated* in a way no independent mix could replicate. Since mixed strategies are defined independently per player, the domination criterion (which only cares about expected payoff comparisons) doesn't "see" this potential correlation, hence the strategy escapes being dominated.

  **Resolution of Your Cases & Questions:**
  *   **Case 1:** Covered (strict domination by pure strategy is a special case of mixed domination).
  *   **Case 2:** Covered. Bottom (0.4) is strictly dominated by the mixed strategy (0.5 Top, 0.5 Middle) which yields 0.5 > 0.4 against both Left and Right. Eliminated.
  *   **Case 3:** Covered. Neither Top nor Middle is strictly dominated by any mixed strategy over {Top, Middle} (since each is uniquely best against one opponent pure strategy). Both survive.
  *   **Case 4:** **You are correct to prefer strict domination.** Weak domination is path-dependent and can lead to counterintuitive results or elimination of all strategies. Strict domination is robust and order-independent in its final outcome. Stick with strict for IEDS.
  *   **Case 5:** **Real and Explained.** The principle "never a best response" (to independent mixes) can eliminate strictly more strategies than "strictly dominated by a mixed strategy" in n≥3 player games. This stems from the inability of independent mixes to represent correlated opponent play that might make a strategy a best response. *For your principle of iterative elimination based on dominance, "strictly dominated by mixed" is the correct and robust concept.*

  **What Your Tentative Stab Got Right & Refined:**
  *   **"strictly dominated by a mixed strategy"**: Correct core concept.
  *   **"over the *remaining* strategies"**: Absolutely essential. Elimination must be iterative based on the current reduced game.
  *   **"does strictly better against every pure strategy the others can pick"**: Correct and sufficient. Checking pure opponent profiles is enough due to payoff linearity.

  **Prediction for a New Game: Modified Battle of the Sexes (2 players)**
  *   **Payoffs:**
      *   (Boxing, Boxing): (3, 1)
      *   (Boxing, Ballet): (0, 0)
      *   (Ballet, Boxing): (0, 0)
      *   (Ballet, Ballet): (1, 3)
      *   (Football, Boxing): (0.5, 0.5)
      *   (Football, Ballet): (0.5, 0.5)
  *   **Analysis under the Principle:**
      *   Football for either player pays 0.5 regardless of the opponent's choice.
      *   Against Boxing: Boxing pays 3 or 0, Ballet pays 0, Football pays 0.5. *No pure or mixed strategy dominates Football yet* (a mix of Boxing/Ballet *could* yield less than 0.5 against Boxing).
      *   Against Ballet: Boxing pays 0, Ballet pays 1 or 0, Football pays 0.5. Similarly, no immediate domination of Football.
      *   **Is Football strictly dominated?** For Player 1: Is there a mixed strategy σ₁ over {Boxing, Ballet} such that:
          *   u₁(σ₁, Boxing) > u₁(Football, Boxing) = 0.5
          *   u₁(σ₁, Ballet) > u₁(Football, Ballet) = 0.5
      *   The max σ₁ can guarantee against Ballet is 1 (by playing pure Ballet), but against Boxing, playing pure Ballet gives 0 < 0.5. The max σ₁ can guarantee against Boxing is 3 (by playing pure Boxing), but against Ballet, pure Boxing gives 0 < 0.5. *No* mixed strategy over {Boxing, Ballet} yields >0.5 against *both* opponent pure strategies. Football is **not strictly dominated** initially. It survives the first round.
      *   **Verdict:** Football should *not* be eliminated immediately. It might be eliminated later if other strategies go first, but under strict mixed domination and iterative removal, it survives the first round. (In this specific game, no pure strategies are dominated initially either, so all 3 survive the first pass. Further elimination might or might not occur depending on the game context).

  **What You Might Need to Give Up (Slightly):**
  *   **Case 5's Broader Implication:** If you want a *single* elimination principle that captures "this strategy is rationally inadmissible", you cannot *simultaneously* get equivalence to "never a best response" *and* order independence *and* work for n≥3 players using only independent strategies. "Strictly dominated by mixed" is order-independent and robust but potentially leaves in some strategies that are never best responses to independent mixes in n≥3 games. "Never a best response" is more aggressive in n≥3 but makes iterated elimination path-dependent and messy. **Stick with "strictly dominated by mixed" for IEDS.** Acknowledge that in n≥3, some strategies surviving IEDS might still never be played if players only consider independent mixes, but IEDS based on dominance won't eliminate them.

  **In Summary:**
  Your core intuition (using strict mixed domination iteratively over remaining strategies, checking against remaining opponent pure strategies) is fundamentally sound and aligns perfectly with standard, robust IEDS. It resolves Cases 1-4 flawlessly. Case 5 highlights a nuance in n≥3 games where "never a best response" is a distinct (and slightly stronger for independent play) concept than dominance, but dominance remains the correct basis for stable IEDS. The equivalence in 2-player games is a happy bonus.
