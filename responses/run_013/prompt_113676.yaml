answer: |-
  ### The Practice, Restated
  The Integrated Food Security Phase Classification (IPC) defines famine through measurable thresholds: extreme food gaps affecting ≥20% of the population, wasting in ≥30% of children, and crude death rates >2/10,000/day (>4/10,000 for children). Verification by an independent Famine Review Committee relies solely on technical criteria, excluding political context. The IPC assesses population-level outcomes—nutrition, mortality, food consumption, livelihoods—without attributing causation. Agencies using this system simultaneously assert that famines are "man-made" and declarations signify "collective failure," creating tension between descriptive neutrality and normative diagnosis.

  ---

  ### What the Practice Presupposes
  The IPC implicitly defines famine as:  
  1.  **A state of a population**, not an act or process. It measures aggregated physical conditions (malnutrition, mortality) at a fixed point.  
  2.  **An outcome, not a relation.** It quantifies bodily harm (wasting, death) rather than Sen-style entitlements (social/political access to food). Starvation amid plenty is indistinguishable from starvation amid scarcity if outcomes meet thresholds.  
  3.  **Having a determinate onset.** Crossing the three thresholds *defines* famine onset, fixing its "date." Prevention means the famine category is never reached, rendering averted crises invisible to the system.  
  4.  **Causally neutral.** Drought, blockade, or policy failure are irrelevant to classification if outcomes are identical. A "natural" and "political" famine are equivalent under the IPC.  
  5.  **A technical fact, not a normative judgment.** The committee’s mandate excludes moral/political reasoning. Famine is a bio-statistical condition verified by experts, not a crime or injustice.  

  **Commitments vs. Suggestions:**  
  -   **Committed to:** Famine as a population state, outcome-based, causally neutral, technically defined. Thresholds demand measurable bodily harm.  
  -   **Suggests (but doesn’t strictly require):** The determinacy of onset. While thresholds fix a "start," the IPC acknowledges phases build gradually. It also *suggests* neutrality via its process, yet its mortality criterion implicitly assumes starvation/disease links common in crises.  

  **Key Implicit Ontology:** Famine is a catastrophic *biological event* afflicting a population, detectable through somatic markers. It is distinct from its precursors (emergency, crisis) and is fundamentally about *bodily survival failure*. Causation and social relations are excluded by design, positioning famine as an apolitical humanitarian emergency.

  ---

  ### Strict Presupposition versus Comfortable Fit
  **Strict Presuppositions:**  
  The IPC *requires* famine to be defined by population-level somatic outcomes. Any theory must accept that famine = catastrophic malnutrition/mortality meeting technical thresholds. Causation, intent, or social processes *cannot* be part of the definition without altering the practice.  

  **Comfortable Fit:**  
  A political theory labeling famines as "crimes" *could* use IPC thresholds as a *trigger* for investigation or response. The thresholds objectively signal extreme suffering requiring action. However, this repurposing faces tensions:  
  1.  **Attribution Gap:** The IPC identifies *that* catastrophe occurred, not *who* caused it. A crime framework needs causation built into the definition.  
  2.  **Temporal Misalignment:** Crimes may be committed *before* thresholds are met (e.g., deliberate entitlement destruction). IPC only reacts once outcomes manifest.  
  3.  **Normative Neutrality vs. Accusation:** IPC’s technical legitimacy relies on avoiding blame. A "crime" label politicizes the declaration, potentially compromising the consensus-based verification.  
  The IPC *fits* a response-triggering role but *conflicts* with a crime-focused definition, as the latter demands integrating causation and agency into the concept itself.

  ---

  ### Where the Practice is Underdetermined
  The IPC’s phases and thresholds are compatible with several rival theories:  
  1.  **Sen’s Entitlement Theory:** The "crisis" and "emergency" phases could map to entitlement collapse (e.g., asset loss, price spikes, unemployment), while "famine" marks its lethal culmination. The outcomes reflect failed entitlements.  
  2.  **Malthusian/Production Failure:** The phases align with escalating food shortages. "Famine" is the Malthusian "positive check" of mortality.  
  3.  **Political Economy Approaches:** "Crisis" to "famine" could track state neglect, market manipulation, or conflict-driven entitlement erosion. Outcomes result from political processes, but the IPC doesn’t preclude this interpretation.  
  4.  **Complex Emergencies:** The phases accommodate intertwined causes (drought + conflict + weak institutions), focusing only on the humanitarian outcome.  

  **Common Ground:** All theories predicting severe malnutrition and mortality spikes *must* accept the IPC thresholds as indicators of catastrophic human suffering, regardless of cause. The IPC underdetermines causation but is determined by severe somatic outcomes. Rival theories explaining *how* the thresholds are reached remain compatible with the classification *that* they were reached.

  ---

  ### What the Rival View Would Require
  A practice based on Sen’s entitlement theory would fundamentally redefine famine:  
  1.  **Focus on Process & Relations:** Classify "entitlement failure" (loss of assets, income, market access, social support) rather than somatic outcomes. Phases might track: asset depletion, debt crises, labor collapse, starvation.  
  2.  **Predictive Declaration:** Declare famine *based on irreversible entitlement collapse* before mass mortality, enabling preventative action. "Famine" could be declared without crossing mortality thresholds.  
  3.  **Attribution Built-In:** The label would inherently reference causation (e.g., "policy-induced famine," "blockade famine"). Analysis would identify responsible actors/structures.  
  4.  **Metrics:** Reliance on socioeconomic data (employment, prices, asset ownership, displacement, access rights) alongside nutrition/mortality.  

  **Costs:**  
  -   **Credibility:** Subjective judgments on "irreversible collapse" or "intent" could erode objectivity. Disputes over attribution might paralyze consensus.  
  -   **Speed:** Complex socioeconomic analysis is slower than anthropometric surveys/mortality counts, delaying response.  
  -   **Political Feasibility:** Governments/NGOs would resist a system designed to assign blame. Consensus verification would be impossible if attribution is required. Declarations could be blocked politically.  
  -   **Response Thresholds:** Without unambiguous mortality/nutrition thresholds, triggering large-scale humanitarian action might be contested.  

  Such a system would gain in preventative potential and moral clarity but lose operational objectivity, speed, and broad institutional buy-in. It would prioritize diagnosing *why* people *will* starve over measuring *that* they *are* starving.

  ---

  ### Verdict
  The IPC presupposes famine is a technical, somatic state of catastrophic biological distress in a population, defined by threshold-crossing and measured neutrally. It strictly commits to outcome-based, causally agnostic, expert-driven classification. While compatible *post-hoc* with political theories (e.g., famines as crimes), it cannot integrate causation or entitlement relations into its core definition without violating its operational neutrality and consensus model. Its key asymmetry – recording only failures after death occurs – reflects this outcome-centric ontology. A rival Sen-based practice would prioritize process and attribution but sacrifice the IPC’s credibility, speed, and feasibility by introducing normative judgment and contested causality into the declaration mechanism. The IPC’s strength is its actionable objectivity; its cost is the exclusion of prevention and justice from its core concept.
