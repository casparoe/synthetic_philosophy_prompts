answer: |-
  You've hit on foundational tensions in microeconomics that *should* make any thoughtful practitioner uneasy. Your confusion is well-placed—this isn't a rookie mistake but a deep critique of the field's epistemological scaffolding. Let's dissect this properly, without reassurance, starting with your core questions.

  ### 1. **What "Utility" Is (and Isn't) in Different Settings**
     - **Choice-Theoretic (Revealed Preference):**  
       Utility is **only a numerical representation of a choice ranking**. If you observe choices satisfying completeness and transitivity, you can assign numbers so that chosen options have higher numbers. It's purely ordinal: *U(A) > U(B)* means nothing beyond "A is chosen over B". It has no psychological content; it's a mathematical shadow of behavior. *It cannot be "wrong"* in isolation—it's defined by the choices.  
       - *Your colleagues' shrug?* They likely treat this as an operational tool. If choices violate axioms (e.g., intransitivity), they’ll call it "irrational" or tweak the model—but the framework itself is unfalsifiable by design.

     - **Decision-Theoretic (von Neumann-Morgenstern / EU Theory):**  
       Here, utility **gains cardinal content via lotteries**. VN-M axioms (completeness, transitivity, continuity, independence) allow us to construct a utility function *unique up to affine transformations* (i.e., *U* and *aU + b* represent the same preferences). This *is* cardinal: the *magnitude* of differences matters.  
       - *Your tutor is correct*: VN-M smuggles cardinality back in. The "expected utility" of a lottery is calculated as ∑[pᵢ·U(xᵢ)], which requires cardinality. Without the lottery axioms, this is meaningless for ordinal utility.

     - **Applied Cost-Benefit Analysis (e.g., Value of Time):**  
       Your colleagues **illegitimately fuse cardinal utility and interpersonal comparisons**. They observe choices (e.g., commuters trading time for money), infer a marginal rate of substitution (e.g., £/hour), and average it across people to get a "value of time saving." This assumes:  
       (i) VN-M cardinal utility applies to non-lottery choices (debatable),  
       (ii) Utility differences are comparable across people (unsupported by theory),  
       (iii) Observed choices reveal "true" preferences (ignores framing/cognitive biases).  
       *This is a different object entirely*: a policy-welfare construct with shaky theoretical legs.

  ### 2. **Can Revealed Preference (RP) Be Embarrassed?**
     - **Formally, no—but practically, yes.**  
       RP is tautological: choices *define* preferences. If you see cyclical choices (A > B > C > A), RP says preferences are intransitive—it doesn't falsify the theory, it just describes the inconsistency.  
       - *But*: RP relies on **stability assumptions**. When choices change with framing (e.g., loss-aversion in gains vs. losses), menu-dependence (decoy effects), or context, RP can only "save" itself by:  
         (a) Denying the data ("subjects made mistakes"),  
         (b) Expanding the choice set (e.g., including "frames" as attributes—*which is epicyclic*), or  
         (c) Abandoning stable preferences (e.g., behavioral models).  
       **Evidence against RP emerges when choices are systematically unstable** across observably identical states. Preference reversals (e.g., choosing A over B but pricing B higher) *directly violate* the core RP axiom that choices reveal a complete ordering.

     - **Where empirical content lives**:  
       RP's testable claim is: *"Choices will satisfy internal consistency (transitivity, independence) under stable conditions."* When this fails—as in lab experiments—it exposes RP's *domain limitations*, not "falsity." The response (e.g., prospect theory) isn't epicyclic but a *better descriptive model*.

  ### 3. **The Aggregation Problem (Averaging "Utility")**
     - **Ordinal RP utility cannot be averaged**. If *U* and *V* represent the same preferences, *U + V* and *2U* do too—but *U* and *2U* give different averages. Averaging requires **cardinal, interpersonally comparable utility**.  
     - **CBA's dirty secret**: It uses money as a proxy. By assuming:  
       (i) Marginal utility of money is constant across people (untrue),  
       (ii) Willingness-to-pay (WTP) reveals cardinal utility differences (plausible only under VN-M),  
       it sneaks in comparability. But WTP depends on income—so a rich person's time-saving is "worth more" than a poor person's. *This is a value judgment disguised as science.*

  ### 4. **Your Flatmate's Happiness Fix: A Different Paradigm**
     - Subjective well-being (SWB) or "happiness" measures **experienced utility** (Kahneman et al.). This *is* psychologically real and cardinal. But:  
       (i) It often *conflicts* with revealed preferences (e.g., people "choose" to commute longer but report lower happiness),  
       (ii) It answers a different question: *"What makes people feel good?"* vs. *"What do they choose?"*  
       - For policy, SWB avoids RP's aggregation problem (you *can* average happiness scores). But it introduces new issues: measurement error, cultural biases, and the "experience-reporting" gap.

  ### The Uncomfortable Truth for Transport Consultancy
  - **You're using a theoretically inconsistent hybrid**:  
    Revealed preference (ordinal) → VN-M (cardinal for individuals) → Interpersonal comparison (without justification).  
  - **What would break it?**  
    If choice-based WTP:  
    - Varies wildly with irrelevant frames (e.g., how a toll is described),  
    - Fails to predict *actual welfare* (e.g., people regret time-saving choices),  
    - Conflicts with SWB in systematic ways (e.g., commuters report misery despite "revealing" high value for time savings).  
    This is already happening in behavioral literature—but CBA often ignores it for practicality.

  ### What to Do in Client Meetings?
  1. **Acknowledge the assumptions**:  
     *"Our model assumes choices reveal stable preferences and that WTP differences reflect comparable welfare impacts. This is standard, but has limitations."*  
  2. **Use sensitivity analysis**: Show how results change if value-of-time varies by income group or context.  
  3. **Know the behavioral critiques**: Framing effects matter in transport (e.g., congestion pricing acceptance depends on how it's presented).

  **Bottom line**: Utility is three distinct concepts wearing the same name. Revealed preference is a self-sealing system that *can* be destabilized by inconsistent choices. Your unease is justified—this isn't clean science, but applied pragmatism with philosophical cracks. The fix isn't to abandon RP but to use it cautiously, aware of its limits. And tell your flatmate that while SWB is valuable, it's not a substitute: it measures something else entirely.
