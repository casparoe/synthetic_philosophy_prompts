  I notice they're frustrated by students who can't distinguish their commitments from neighbors' - this suggests they want to move beyond superficial label-trading. The emphasis on counterfactuals and empty branches shows they value precision about causal thinking. 

  The challenge is structuring the tree to force meaningful distinctions while staying within word limits. Key tensions to capture:
  - Whether institutions are causes or epiphenomena
  - How geography actually operates 
  - Whether culture is foundational or derivative
  - The role of contingency

  For branch nodes, I'll start with explanandum type since that's foundational. Then move to methodology questions before substantive ones, as per request. The paired comparisons must include non-Atlantic examples - I'll use Himalayan kingdoms and Indonesian cases. 

  For leaves, I'll include the required positions but make sure the "unnamed" geography-as-legibility view gets proper treatment. The deflationary and skeptical positions are crucial for covering the spectrum. 

  Empty branches will reveal where theories don't go - like stable contingency or endogenous anti-property rights - which should spark good seminar debates. 

  The non-separable pairs section must honestly confront where the tree can't resolve differences, like institutionalism vs elite bargains, so students see the limits of taxonomy. 

  Implementation advice should emphasize this as a discussion starter, not exam material. The empty branches are particularly useful for triggering "why doesn't anyone believe this?" conversations.
answer: |-
  ## Diagnostic Instrument: The Roots of Wealth Tree

  ### Root and Target (190 words)
  All students begin by agreeing that: (1) Per capita income differences between nations are orders of magnitude large (e.g., Switzerland vs. Malawi); (2) These differences exhibit significant persistence over decades/centuries; (3) Plausible ultimate explanations involve some combination of Institutions, Geography, Culture, Colonial History, and Contingency. **The target explanandum must be precisely chosen:** Is the primary puzzle *why current income levels differ* (a static snapshot), *why sustained growth began when/where it did* (a dynamic process), *why institutions persist over time* (durability), or *why incomes haven't converged* (absence of catch-up)? Defining this is crucial: an explanation for levels (e.g., soil fertility) may not explain growth onset (e.g., industrial innovation), and an explanation for persistence (e.g., institutional lock-in) may not explain the initial divergence. **The choice of counterfactual is substantive:** Asking "What if Belgium colonized Congo?" probes colonial institutions; "What if the Inca Empire industrialized?" probes pre-colonial foundations; "What if post-colonial elites invested differently?" probes critical junctures; "What if the Congo Basin lacked minerals?" probes geography. This choice reveals which historical layer the student sees as decisive.

  ### Branch Nodes (1,180 words)
  1.  **Primary Puzzle:** What is the core phenomenon needing explanation?
      *   (A) *Levels*: Why are some nations rich *right now*?
      *   (B) *Growth Onset*: Why did sustained growth start when/where it did?
      *   (C) *Persistence*: Why do institutions/income ranks persist so long?
      *   (D) *Divergence/Absence of Convergence*: Why haven't poorer nations caught up?
      *   *Separates*: Focus on static endowment vs. dynamic process vs. stability vs. global interaction.

  2.  **Relevant Counterfactual:** Which historical change would most significantly alter a poor nation's trajectory *today*?
      *   (A) *Different Colonial Power* (e.g., British vs. French rule).
      *   (B) *Different Pre-colonial Polity* (e.g., centralized state vs. stateless society).
      *   (C) *Different Post-Independence Settlement* (e.g., inclusive vs. extractive elite bargain).
      *   (D) *Different Initial Geography* (e.g., navigable river vs. landlocked mountains).
      *   *Separates*: Belief in the decisive weight of colonial imprint vs. deep history vs. modern agency vs. physical constraints.

  3.  **Institutions - Nature & Origin:** What best describes inclusive economic institutions (e.g., secure property rights, open markets)?
      *   (A) *Exogenous Constraints*: Imposed by law/constitution; can be designed/transplanted.
      *   (B) *Endogenous Equilibria*: Self-enforcing outcomes of underlying societal features (power, norms, geography).
      *   (C) *Epiphenomenal of Elite Bargains*: Reflect the distribution of power among elites; stability comes from elite cohesion.
      *   *Separates*: Institutional design feasibility vs. deep societal determinism vs. elite politics as fundamental.

  4.  **Geography - Primary Channel:** How does geography most decisively shape development?
      *   (A) *Agricultural Productivity/Land Quality*: Determines surplus, population density, urbanization potential.
      *   (B) *Disease & Demography*: Affects labor productivity, mortality, population structure, investment.
      *   (C) *Transport Costs/Market Access*: Shapes trade, specialization, technology diffusion, integration.
      *   (D) *Legibility/Taxability*: Influences state-building capacity (e.g., mountains vs. plains).
      *   *Separates*: Malthusian constraints vs. human capital vs. market integration vs. state formation as geography's key legacy.

  5.  **Culture - Role & Fluidity:** What is culture's relationship to institutions/development?
      *   (A) *Deep Parameter*: Foundational values/ethics (e.g., thrift, trust, work ethic) drive institutions/growth.
      *   (B) *Slow-Moving Consequence*: Cultural traits evolve *in response* to institutions/economic conditions over generations.
      *   (C) *Repertoire/Institutional Complement*: Cultural tools/norms facilitate or hinder specific institutions, but shift with institutional change.
      *   *Separates*: Cultural determinism vs. institutional determinism of culture vs. culture as adaptable toolkit.

  6.  **History - Contingency vs. Determinism:** Does history exhibit strong path dependence?
      *   (A) *Strong Path Dependence/Lock-In*: Early events/changes create self-reinforcing trajectories hard to escape.
      *   (B) *Multiple Equilibria*: Similar starting points can lead to different stable outcomes based on critical junctures/luck.
      *   (C) *Predictable Patterns/Luck Averages Out*: Underlying fundamentals (geography, culture) dominate; contingency is noise.
      *   *Separates*: Belief in decisive historical accidents vs. structural determinism vs. probabilistic equilibrium selection.

  7.  **Unit of Analysis:** What is the most appropriate scale for analysis/causal inference?
      *   (A) *Nation-State*: Sovereign entity is the relevant unit for policy/comparison.
      *   (B) *Region/Sub-National*: National borders mask crucial internal heterogeneity (e.g., North vs. South Italy).
      *   (C) *Local Political Settlement*: Development hinges on local elite bargains/institutions, not national aggregates.
      *   *Separates*: Practicality vs. analytical precision vs. micro-foundations focus.

  8.  **Method: Observational Cross-Sections:** Can statistical analysis of current global data (e.g., GDP vs. institutions) identify deep *causes*?
      *   (A) *Yes, with Care*: Sophisticated methods (IV, RD) can overcome endogeneity, revealing causal links.
      *   (B) *No, Only Correlations*: Endogeneity (institutions⇄income, omitted variables) is insurmountable; history needed.
      *   *Separates*: Confidence in econometric tools vs. deep skepticism about cross-sectional inference.

  9.  **Method: Evidence from History:** What historical evidence is most compelling?
      *   (A) *Natural Experiments/Discontinuities*: Exploiting arbitrary borders, random events, or sharp policy changes.
      *   (B) *Process Tracing/Narrative*: Detailed reconstruction of mechanisms and sequences in specific cases.
      *   (C) *Deep Historical Structures*: Long-run patterns (centuries/millennia) revealing fundamental constraints.
      *   *Separates*: Quasi-experimental rigor vs. contextual richness vs. longue durée perspective.

  10. **Paired Comparison 1 (Similar Ecology, Different Pre-Colonial):** Consider adjacent Himalayan valleys (e.g., Nepal vs. similar Tibetan region). Similar ecology (mountains, climate), but one had a centralized kingdom (e.g., Gorkha), the other lacked strong centralization. Does this pre-colonial difference explain divergent modern trajectories?
      *   (A) *Yes, Decisively*: Pre-colonial state capacity set a trajectory for later development/state-building.
      *   (B) *No, Colonial/Modern Era Dominates*: Colonial intervention/post-independence choices overrode earlier differences.
      *   *Separates*: Emphasis on deep institutional history vs. the transformative power of colonialism/modernity.

  11. **Paired Comparison 2 (Divergence Post-Partition):** Consider adjacent regions split by a border after conflict/partition (e.g., Kerala vs. adjacent Tamil Nadu region post-colonial borders; or Pyongyang vs. Seoul post-1953). Geography nearly identical. Does this divergence show the power of post-split institutions/policies?
      *   (A) *Yes, Conclusively*: Different policies/institutions caused rapid divergence despite shared history/geography.
      *   (B) *Partly, But Initial Conditions Mattered*: Divergence amplified pre-existing, perhaps subtle, differences.
      *   (C) *No, Underlying Factors Persist*; Convergence pressure will prevail or deep factors explain divergence.
      *   *Separates*: Confidence in institutional agency vs. belief in persistent fundamentals or limits to divergence.

  ### Leaf Positions (840 words)
  1.  **Strong Institutionalism (Property Rights):** Secure, impersonal property rights are the fundamental cause of investment, innovation, and growth. *Path:* 1C (Persistence) or 1B (Growth Onset) → 3A (Exogenous Constraints) → (Often) 8A (Yes, Cross-Sections) → (Often) 11A (Yes, Post-Partition). *Awkward Commitment:* Must explain why good institutions aren't easily adopted everywhere (often leans on 3B/C or 6A/B).
  2.  **Elite Bargain / Political Settlement:** Development depends on the distribution of power and cohesion among elites, which shapes institutions and economic policies. *Path:* 1C (Persistence) → 3C (Epiphenomenal) → 7C (Local Settlement) → (Often) 2C (Post-Independence Critical) → 9B (Process Tracing). *Awkward Commitment:* Struggles to predict *which* elite bargains emerge and why some become developmental.
  3.  **Geography - Agriculture:** Differences in land productivity and suitability for staple crops fundamentally determine surplus, population density, and thus long-run development potential. *Path:* 1A (Levels) or 1D (Divergence) → 4A (Ag Productivity) → 6C (Predictable Patterns) → (Often) 2D (Initial Geography) → 9C (Deep Structures). *Awkward Commitment:* Explaining why high-agro potential regions (e.g., Ukraine, Zimbabwe) can be poor.
  4.  **Geography - Disease/Demography:** Disease burdens (e.g., malaria) shape mortality, fertility, human capital, and labor productivity, creating persistent development traps. *Path:* 1A (Levels) or 1D (Divergence) → 4B (Disease) → 6A/C (Lock-In/Predictable) → (Often) 2D (Initial Geography) → 10A/B (Pre-Colonial may/may not matter). *Awkward Commitment:* Explaining rapid escapes from disease traps (e.g., Singapore, US South).
  5.  **State Capacity / Fiscal Sociology:** The ability to tax and provide order is foundational; development requires a capable, constrained state. *Path:* 1B (Growth Onset) or 1C (Persistence) → (Often) 4D (Legibility) → 3B (Endogenous Equilibria) or 3C (Elite Bargain) → 9A/B (Experiments/Process). *Awkward Commitment:* Defining the origins of state capacity without circularity (capacity begets capacity?).
  6.  **Culture - Deep Cause:** Deep-seated cultural values (e.g., Protestant ethic, Confucian values, generalized trust) are the bedrock upon which institutions and growth rest. *Path:* 1A/B/C/D (Any) → 5A (Deep Parameter) → 6A/C (Lock-In/Predictable) → (Often) 2B (Pre-Colonial) → 8B/9B (Skeptical of X-Section/Need Narrative). *Awkward Commitment:* Explaining dramatic cultural shifts within successful societies or cultural similarities across divergent economies.
  7.  **Culture - Slow Consequence:** Cultural traits adapt slowly to institutional and economic realities; observed cultural differences are often outcomes, not causes. *Path:* 1C (Persistence) → 5B (Slow Consequence) → 3A/B (Institutions Exogenous/Endogenous) → 6A (Lock-In) → (Often) 11A (Post-Partition shows institutional cause). *Awkward Commitment:* Explaining the *initial* emergence of growth-promoting institutions without cultural prerequisites.
  8.  **Colonial Legacy - Path Dependence:** Colonial institutions (extractive vs. inclusive) created self-reinforcing paths of development or underdevelopment. *Path:* 1C (Persistence) or 1D (Divergence) → 6A (Path Dep.) → 2A (Colonial Power) → 10B (Pre-Colonial Overridden) → 9B (Process Tracing). *Awkward Commitment:* Explaining strong pre-colonial predictors of colonial type or successful late developers.
  9.  **Multiple Equilibria / Contingency:** Development outcomes are highly contingent; small differences or luck at critical junctures can lead to vastly different, stable paths. *Path:* 1B (Growth Onset) or 1D (Divergence) → 6B (Mult. Equilibria) → (Often) 2C (Post-Indep) or 2A (Colonial) → 11A (Post-Partition) → 8B/9A (Skeptical X-Section/Need Experiments). *Awkward Commitment:* Predicting anything specific or explaining broad patterns without resorting to deeper factors.
  10. **Deflationary (Non-Natural Kinds):** "Nations" and "wealth" are modern, contingent constructs; seeking timeless, general causes for their differences is fundamentally misguided. *Path:* (Often starts at 1) → 7A/B/C (Any, but highlights arbitrariness) → 8B (No X-Section) → 9B/C (Narrative/Structure, but rejects generalization) → Rejects premise of 2 (Counterfactuals). *Awkward Commitment:* Engaging with the empirical reality of massive, persistent inequality without offering causal explanation.
  11. **Causal Skepticism:** The historical record is too complex, contingent, and path-dependent to reliably identify *the* fundamental causes; we can only constrain possibilities. *Path:* (Any explanandum) → 6A/B (Path Dep./Mult. Equilibria) → 8B (No X-Section) → 9B (Process Tracing, but finds complexity) → 11B/C (Initial Conditions/Persistence). *Awkward Commitment:* Providing actionable insight for policy or prediction.
  12. **Unnamed: Geography-as-Legibility → State Capacity:** Rugged terrain hinders state control and tax collection, fostering weak states and fragmented societies; fertile plains enable legibility, taxation, and strong states as the ultimate cause. *Path:* 1C (Persistence) or 1B (Growth Onset) → 4D (Legibility) → 5 (Culture often C - Repertoire) → 3B (Endogenous Equilibria) → 5 (State Capacity Leaf). *Awkward Commitment:* Explaining strong states in complex terrain (e.g., Switzerland, Inca) or weak states on plains.

  ### Empty or Near-Empty Branches (320 words)
  *   **Stable Contingency (6B) + Exogenous Institutions (3A):** Believes outcomes are highly contingent *but* also thinks good institutions can be easily designed/transplanted exogenously. *Empty Reason:* Incoherent. If institutions are easily transplantable, contingency is minimized. If contingency is high, successful transplantation is unlikely. (Unattractive & Unexplored).
  *   **Deep Culture (5A) + Fast Institutional Change (Rejects 6A/C):** Believes culture is a deep, slow-moving cause *but* also thinks institutions can change rapidly and independently, driving development quickly. *Empty Reason:* Incoherent. Deep cultural determinism implies institutional change is constrained/glacial. Rapid, culturally-independent institutional transformation contradicts deep cultural roots. (Incoherent).
  *   **Predictable Geography (6C) + Decisive Post-Independence Agency (2C):** Believes geography strongly predicts patterns *but* also thinks post-independence choices are the primary decisive factor capable of overriding geography. *Empty Reason:* Unattractive. Creates tension: if geography predicts strongly, agency is constrained; if agency is decisive, geography isn't predictive. Positions tend to emphasize one or the other. (Unattractive & Unexplored).
  *   **Endogenous Anti-Property Rights (3B) + Strong Growth (1B):** Believes property rights are endogenous equilibria emerging from society *and* that societies can endogenously generate growth-promoting property rights from *any* starting point. *Empty Reason:* Unexplored/Unattractive. Most institutionalism focuses on how *inclusive* institutions emerge endogenously only under specific (often rare) conditions. Assuming any society can easily generate them endogenously ignores power constraints and historical evidence. (Unexplored).
  *   **Levels Focus (1A) + Process Tracing (9B):** Primarily concerned with explaining current income levels *and* believes detailed narrative process tracing in specific cases is the best method. *Empty Reason:* Unattractive. Explaining a static outcome (levels) via dynamic processes traced over time creates a mismatch; levels-focused views often favor cross-section (8A) or deep structure (9C). (Unattractive).

  ### Non-Sepparable Pairs and Diagnostic Limits (320 words)
  The tree struggles to cleanly separate positions sharing deep premises but differing in emphasis or mechanism:

  1.  **Institutionalism (Leaf 1) vs. Elite Bargain (Leaf 2):** Both prioritize politics/institutions. The tree distinguishes via Node 3 (Exogenous/Endogenous/Epiphenomenal) and Node 7 (Unit: Nation vs. Local). However, a view seeing institutions as *both* constraints *and* reflections of elite bargains (a common nuance) falls awkwardly. *Further Question Needed:* "Can inclusive institutions be durably established *against* the interests of powerful elites, or do they always reflect an elite bargain (even an inclusive one)?" (Values/Evidence: Role of conflict vs. consensus, feasibility of reform).
  2.  **Geography-as-Legibility → State Capacity (Leaf 12) vs. State Capacity (Leaf 5):** Both center state capacity. The tree distinguishes via Node 4 (Legibility vs. other channels). Yet, a view seeing state capacity as ultimately rooted in elite politics or culture, *with* geography merely being one enabling/constraining factor, blurs the line. *Further Question Needed:* "Is state capacity primarily determined by *pre-modern* geographical constraints on centralization, or by *modern* political choices and societal organization?" (Evidence: Historical timing of state formation patterns).
  3.  **Culture Deep Cause (Leaf 6) vs. Culture Slow Consequence (Leaf 7):** The tree uses Node 5. However, views often posit a *feedback loop* (culture ⇄ institutions), making assignment ambiguous. *Further Question Needed:* "In a society experiencing rapid institutional change leading to growth (e.g., Meiji Japan, post-war Germany), do you attribute the *success* primarily to pre-existing cultural traits enabling adaptation, or to the new institutions reshaping culture?" (Evidence: Direction of change in specific cases).

  **Where the Instrument Stops:** The tree classifies starting premises and core beliefs about causality. It *cannot* resolve disagreements where:
  *   Differing **evaluations of evidence** exist (e.g., weight given to a specific natural experiment vs. a narrative account).
  *   Differing **counterfactual judgments** are central (e.g., how much colonial extraction *actually* differed between powers).
  *   Differing **values** shape the interpretation of "development" or the acceptability of certain causal mechanisms (e.g., geographic determinism vs. agency).
  *   Disagreement hinges on the **relative weight** of factors all parties acknowledge (e.g., "Geography matters, but institutions matter more").

  These are substantive debates for the seminar, requiring engagement with historical cases, methodological arguments, and philosophical perspectives on agency and determinism.

  ### How a Seminar Leader Should Use It (140 words)
  1.  **Administer Early:** Use in the first or second session as a self-diagnostic exercise. Provide the Root and Nodes as a worksheet or online form (without Leaves).
  2.  **Answer Blindly:** Instruct students to answer each node based on their intuition/beliefs *before* deep reading, without knowing which "position" it leads to. Emphasize there are no "right" answers.
  3.  **Map Paths & Reveal Leaves:** Collect paths. Map common paths to the Leaf Positions. Reveal the Leaves, showing students where their answers placed them. Highlight diversity within the class.
  4.  **Use Empty Branches:** Present Empty Branches. Ask: "Why is this combination rare? Is it incoherent, or just unexplored? *Could* a coherent view occupy it?" Sparks discussion on logical constraints and research gaps.
  5.  **Use Limits:** Flag Non-Separable Pairs. Say: "The tree groups you here, but seminar debates will refine this. Your task is to articulate *why* you lean one way on the 'Further Questions'."
  6.  **Frame as Starter:** Stress this is a conversation starter, not a final label. Revisit paths mid-seminar as students engage with arguments challenging their initial nodes.
