  Okay, the user runs a small philosophy podcast and needs interview questions for a guest who argues omissions can be causes. Let me start by understanding the guest's view. She says causation is about making a difference, and absences can be causes. The doing/allowing distinction is moral, not causal. She uses role-based reasons to filter which omissions count as causes.

  First, the user wants questions on metaphysics of absences. They need to know what exactly an omission is—is it a negative fact, a non-event? And why is it a cause, not just a fact? Follow-up should challenge if this avoids ontological issues. 

  Next, counterfactuals. How do possible worlds handle non-events? Symmetrical cases where presence and absence both make a difference? Follow-up on distinguishing them without smuggling in moral factors. 

  Doing/allowing distinction: how is it non-causal but real? Follow-up on whether this makes the distinction arbitrary. 

  Pre-emption cases with omissions. How does her role-based reason handle overdetermination? Follow-up on whether role-based reasons are too subjective. 

  The user’s bugbear: the hospital case. Are the pump's failure and nurse's not checking separate causes? Need to see if her account provides a principled answer beyond blaming practices. 

  Also, what would falsify her view? If role-based reasons do all the work, does causation reduce to normativity? 

  Deep needs: The host wants engaging questions that push the guest beyond rehearsing her view. They need follow-ups to avoid dead air. They want clarity without jargon, and British English. Also, the hospital case is a practical test for the theory. The host might be concerned if the theory is ad hoc or too tied to moral judgments. Need to ensure questions challenge the core arguments and expose any weaknesses.
answer: |-
  Here are ten interview questions with follow-ups, tailored to your guest's view and your requirements – written in British English with minimal jargon:

  1.  **Core Metaphysics:** "You argue omissions *are* genuine causes because causation is about making a difference. But metaphysically, what *exactly* is sitting on the 'cause' side of the relation when we say 'The nurse's *failure* to check caused the death'? Is it a negative fact, a non-event, or something else? And crucially, *why* call *that* a 'cause' rather than just a true description of what *didn't* happen?"
      *   *Likely Answer Focus:* She might emphasise the causal *relevance* of the absence in the actual world sequence, or posit negative facts/events.
      *   *Follow-up:* "Doesn't calling a 'non-event' or 'absence' a *cause* stretch the concept of causation beyond recognition? Aren't we just labelling the *fact that something didn't happen* as causally potent because it matters to us morally or explanatorily, rather than because it possesses genuine causal 'oomph' like a physical push?"

  2.  **Counterfactuals & Symmetry:** "Your view leans heavily on counterfactual dependence (difference-making). If the nurse *had* checked, the patient *would* have lived. But how does this work for *non-happenings* in possible worlds? What's the truthmaker for 'In the closest world where the omission *occurs*...' when the omission *is* a non-occurrence? Further, imagine a symmetrical case: the patient dies because poison was *added* (a positive act), *or* because an essential antidote was *withheld* (an omission). Both seem to make the same counterfactual difference. How does your *causal* theory distinguish them, since you say the doing/allowing distinction is non-causal?"
      *   *Likely Answer Focus:* She might clarify how we evaluate counterfactuals involving absences or stress that the *actual* causal relation differs even if the counterfactual dependence is similar.
      *   *Follow-up:* "If the counterfactual dependence is identical in the positive act and omission cases, and you deny the doing/allowing distinction is causal, doesn't your account *fail* to capture why we intuitively see the positive act as a different *kind* of cause? Are you forced to say they are causally identical, differing only morally?"

  3.  **Doing/Allowing Distinction:** "You claim the doing/allowing distinction is real but fundamentally *moral*, not causal. If omissions *are* causes, what then *is* the actual causal difference between, say, *pushing* someone into a pond (doing harm) and *failing* to throw them a life-ring when they're drowning (allowing harm)? How does this purely moral distinction survive once you've grounded both scenarios in causation-by-difference-making?"
      *   *Likely Answer Focus:* She'll likely emphasise features like intention, effort, or the structure of the agent's interaction with the threat, insisting these aren't part of the causal relation itself but matter morally.
      *   *Follow-up:* "If the underlying causal structure is the same (both are difference-making causes of the harm), doesn't relegating the entire doing/allowing distinction *only* to morality risk making it seem arbitrary or epiphenomenal? Why do we have such a strong *causal* intuition about the difference if it's not actually there in the causal fabric?"

  4.  **Role-Based Reasons & Selection Problem:** "You use 'role-based reasons' to explain why we don't count *every* potential omission as a cause – e.g., my failure to invent a cure isn't the cause of your illness. Could you briefly outline how this constraint works? What makes a role-based reason relevant for *causal* attribution, rather than just moral or explanatory relevance?"
      *   *Likely Answer Focus:* She'll explain that it's about normative expectations tied to an agent's role, position, or capacities within the specific situation, filtering which absences are salient *causes*.
      *   *Follow-up:* "Doesn't this risk making causation itself deeply normative and context-dependent? If 'X caused Y' depends on whether X had a role-based reason to prevent Y, isn't the *cause* label shifting based on our social norms about responsibility, rather than an objective feature of the world?"

  5.  **Pre-emption with Omissions:** "Consider a classic causal puzzle: pre-emption. Suppose two security guards, A and B, *both* fail to disable a bomb (omissions). Each omission alone would have been sufficient for the explosion. Guard A's shift ended first, but he didn't disable it. Guard B, who came on duty later, also failed. The bomb explodes. We typically want to say *A's* omission caused the explosion, pre-empting B's. How does your difference-making plus role-based reason account handle this? Why isn't *B's* omission also a cause?"
      *   *Likely Answer Focus:* She might argue A's omission made the actual difference because the explosion would still have happened even if B *had* acted (due to A's prior failure), or invoke the timing/sequence making A's failure the operative one via role-based relevance.
      *   *Follow-up:* "Couldn't we frame it so that if B *had* acted quickly enough upon starting their shift, they *could* have prevented the explosion *despite* A's failure? Doesn't this suggest B's omission *also* made a difference? How does your account definitively pick out *A* as *the* cause without smuggling in temporal priority or blame intuitions?"

  6.  **The Hospital Case (Your Bugbear):** "A hospital drug pump silently fails to deliver a vital dose at 3am. The nurse, whose role includes checking the pump, fails to do so. The patient dies. Our blaming practices clearly target the nurse's omission. But causally, on your view: Is the *pump's failure to deliver* a cause of death? Is the *nurse's failure to check* a cause of death? Are they two distinct causes, parts of one cause, or one cause and a background condition? How does your theory decide this *principledly*, beyond aligning with blame?"
      *   *Likely Answer Focus:* She'll likely argue both are causes. The pump's failure is a direct physical cause, the nurse's failure is a cause via the failure to prevent the consequence of the pump's failure. Role-based reasons explain why we focus on the nurse.
      *   *Follow-up:* "But if both are genuine difference-making causes, doesn't this lead to an explosion of causes – the pump designer's omission during testing, the hospital manager's omission in training, etc.? How does your role-based reason constraint *stop* this regress without simply mirroring our legal or moral thresholds for blame? Is the pump's failure truly a 'cause' or just the *circumstance* that the nurse failed to alter?"

  7.  **Overdetermination by Omission:** "Imagine two lifeguards, Jack and Jill, both watching the same swimmer in distress. *Both* fail to dive in (omissions). Either action alone would have saved the swimmer. The swimmer drowns. Is this a case of causal *overdetermination* by omission? Are *both* omissions causes? Or does your account rule one out?"
      *   *Likely Answer Focus:* She might lean towards saying both are causes (symmetrical overdetermination) or argue role-based reasons might assign joint causation.
      *   *Follow-up:* "If both are genuine causes, doesn't this conflict with the intuition that the outcome only happened *once*, and attributing two full causes seems excessive? If your account *doesn't* count both, how does it avoid this without appealing to something other than difference-making and role-based reasons?"

  8.  **The Threat of Proliferation:** "A major objection to your view is that if omissions are causes, then *everything* that doesn't happen becomes a potential cause of anything that does. My failure to flap my arms *now* is a cause of the plane not being diverted, hence a cause of it landing safely? You use role-based reasons to block this. But isn't this constraint doing *all* the work? What's left of the purely *causal* 'difference-making' core once this heavy normative filter is applied?"
      *   *Likely Answer Focus:* She'll argue role-based reasons identify which absences are *saliently* difference-making in the specific causal network, not that they create the difference-making itself.
      *   *Follow-up:* "Doesn't this mean the core causal relation (difference-making) is ubiquitous and trivial (my not-flapping *does* make a minute difference?), and the *interesting* claim 'X caused Y' is essentially a normative judgment about which ubiquitous difference-maker we choose to highlight? Have we reduced causation to normativity?"

  9.  **Falsifiability & Counterevidence:** "What evidence or argument would genuinely make you reconsider the view that omissions *can* be causes? Is there a specific metaphysical problem, a counterexample, or an implication you find intolerable that would push you towards the 'omissions are never causes' position? Relatedly, if someone argued your role-based reason constraint is entirely *ad hoc* and merely disguises the fact that we only call omissions 'causes' when we blame someone, how would you defend its integral role in the *causal* theory?"
      *   *Likely Answer Focus:* She might mention severe ontological discomfort with negative entities, or a counterexample showing role-based reasons lead to absurd causal attributions. She'll defend the constraint as identifying real causal structure.
      *   *Follow-up:* "If the best defence of the role-based constraint is that it captures our *practices* of causal explanation and attribution, doesn't this risk making the entire theory descriptive of our language/practices rather than an account of objective causation in the world? How do we know we're not just systematising blame?"

  10. **The Payoff:** "Finally, beyond solving metaphysical puzzles, what's the real-world *value* or insight gained by accepting omissions as genuine causes? Does it change how we analyse legal liability, engineering failures, or historical explanations in a productive way that the 'omissions as background conditions' view cannot?"
      *   *(No specific follow-up needed here, serves as a reflective closing question).*

  **Key to Glossed Terms:**
  *   **Counterfactual Dependence:** Whether Y would have happened if X hadn't (or vice versa).
  *   **Possible Worlds:** A way of analysing counterfactuals ("If X hadn't happened...") by considering hypothetical alternative scenarios.
  *   **Pre-emption:** When one potential cause (A) actually brings about the effect, preventing another potential cause (B) from doing so, even though B would have been sufficient.
  *   **Overdetermination:** When two or more distinct causes are each sufficient on their own to bring about the effect, and they all occur.
  *   **Ontological:** Relating to what kinds of things fundamentally exist.

  **Tips for the Interview:**
  *   Listen carefully to her answers – her specific phrasing might suggest an even better follow-up than the one anticipated.
  *   Don't feel bound to ask *all* the follow-ups; use them if the answer opens the door naturally.
  *   For the hospital case, be ready to gently press if her answer seems to just track blame. Ask: "But causally, *before* we assign blame, what does your theory say is happening in the world?"
  *   Good luck! It sounds like a fascinating discussion.
