  Check if any interpretations are missing. Maybe the role of mathematical beauty or elegance in theory choice? But the user didn't mention that. Stick to their examples. Also, consider if the indispensability of math in physics is Quinean, but the user wants to avoid citations. Focus on the analysis without name-dropping.

