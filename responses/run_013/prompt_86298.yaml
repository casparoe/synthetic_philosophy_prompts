answer: |-
  ### The uses in my group  
  Your group deploys the phrase in four distinct ways:  
  1. **Unification optimism**: The phrase justifies expecting quantum gravity to be describable by existing or purpose-built mathematics. Presupposes a *metaphysical or nomological alignment* between mathematics and physics.  
  2. **Unexpected applicability**: Mathematics developed abstractly (e.g., geometry, group theory) later proves essential to physical theories. Presupposes *surprising cross-domain utility* of pure structures.  
  3. **Tautological view**: Physics is defined by mathematization, so effectiveness is trivial. Presupposes a *disciplinary boundary claim*.  
  4. **Pythagorean joke**: The universe is "made of" mathematics. Presupposes *ontological reductionism*.  

  ### The menu  
  1. **Mathematics is pragmatically useful in physics**.  
     *Status*: Trivially true.  
     *Evidence*: Historical record of physics relying on math.  
     *Supports*: No one’s use meaningfully (too weak).  

  2. **Mathematics is indispensable for formulating fundamental physical laws**.  
     *Status*: Defensible (supported by scientific practice).  
     *Evidence*: Failure of non-mathematical fundamental theories (e.g., vitalism).  
     *Supports*: Unification optimist (weakly, as a baseline).  

  3. **The same mathematical structures recur across disparate physical domains**.  
     *Status*: Defensible (e.g., PDEs in fluids and electromagnetism).  
     *Evidence*: Cross-theoretic unification (e.g., gauge theories).  
     *Supports*: Unexpected applicability (if "disparate" includes pure math origins).  

  4. **Mathematics developed without physical intent often proves critically applicable**.  
     *Status*: Substantive and defensible (e.g., Riemannian geometry in GR).  
     *Evidence*: Historical cases of "pre-adapted" math.  
     *Supports*: Unexpected applicability user.  

  5. **The breadth and depth of mathematical applicability in physics are surprising**.  
     *Status*: Substantive and defensible (Wigner’s core).  
     *Evidence*: Contrast with math’s lesser utility in biology/sociology; no *a priori* guarantee.  
     *Supports*: Unification optimist (if generalized) and unexpected applicability user.  

  6. **No satisfactory explanation exists for mathematics’ applicability**.  
     *Status*: Probably false (explanations exist, even if incomplete).  
     *Evidence*: Anthropic/selection effects (we select math that works); cognitive arguments (math abstracts patterns humans detect); structural realism (math captures modal relations).  
     *Supports*: Group member invoking inexplicability (your draft’s #2).  

  7. **Physics is constituted by mathematization; thus, effectiveness is definitional**.  
     *Status*: Not a claim about the world (epistemic tautology).  
     *Evidence*: Self-referential; doesn’t explain math’s utility in *other* sciences or engineering.  
     *Supports*: Tautological view (your draft’s #4).  

  8. **Physical reality is intrinsically mathematical (Pythagoreanism)**.  
     *Status*: Radical and unsupported.  
     *Evidence*: No empirical differentiation from structural realism; conflates map with territory.  
     *Supports*: Pythagorean joker and unification optimist (metaphysically).  

  9. **Rejecting mathematical effectiveness would be anti-intellectual**.  
     *Status*: Meta-claim (normative, not truth-apt).  
     *Evidence*: Pragmatic success justifies its use, regardless of explanation.  
     *Supports*: Unification optimist (as a heuristic).  

  ### Verdicts at a glance  
  | Reading (abridged)                     | Status                     | Truth condition(s)                              |  
  |----------------------------------------|----------------------------|------------------------------------------------|  
  | Pragmatic usefulness                   | Trivially true             | Physics uses math successfully                 |  
  | Indispensability                       | Defensible                 | No non-math fundamental physics exists         |  
  | Cross-domain recurrence                | Defensible                 | Same math structures in diverse physics        |  
  | Pre-adapted applicability              | Defensible                 | Pure math later fits physics unexpectedly      |  
  | Surprising breadth/depth              | Substantive, defensible    | Math applies more widely than plausibly expected |  
  | Unexplained                            | Probably false             | All potential explanations fail                |  
  | Definitional (tautology)               | Not a claim                | Physics defined as mathematized domain         |  
  | Ontological (Pythagorean)              | Unsupportable              | Physical entities are mathematical objects     |  
  | Anti-anti-intellectualism              | Normative                  | Pragmatism overrides explanatory demands       |  

  ### Which reading my friend needs  
  Your unification-optimist friend requires **reading #5 (surprising breadth/depth)** or **reading #8 (Pythagoreanism)**. Only #5 is defensible: if mathematics applies surprisingly broadly to physics *already*, it’s reasonable (but not certain) that quantum gravity will align with existing or new math. #8 would also justify optimism but is unsupported. #2 (indispensability) offers minimal support—it ensures math will be *used*, not that unification is feasible with current tools. Defend #5: the history of physics shows mathematical frameworks often extend beyond their original domain (e.g., Hilbert spaces to QM), licensing cautious optimism for quantum gravity.  

  ### Which reading is worth arguing about  
  **Reading #5 (surprising breadth/depth)** is the substantive, live issue. It avoids triviality (#1), rejects defeatism (#6), and sidesteps cosmic speculation (#8). The debate is whether the scope of applicability is genuinely surprising or merely reflects:  
  - **Selection effects**: We discard ineffective math (e.g., quaternions in EM).  
  - **Anthropic bias**: Our cognition/evolution favors mathematical patterns.  
  - **Natural abstraction**: Complex systems converge on simple mathematical laws.  
  Evidence includes math’s *inconsistent* effectiveness (e.g., turbulence vs. planetary orbits) and applicability in "messy" sciences (e.g., neural networks). Resolving this requires analyzing *why* some pure math fits physics—is it luck, cognitive necessity, or deep structure in reality? This directly challenges your group’s unexpected-applicability user: their examples may be cherry-picked, ignoring failed or ad hoc applications.
