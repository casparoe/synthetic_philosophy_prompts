  ### Session Design: "Tower of Metrics"  
  **Objective:** Create a hands-on simulation where participants experience two distinct failure modes of Goodhart's Law within a tower-building exercise. The game forces optimization for a visible metric (height) while undermining an unstated core goal (structural resilience).  

  ---

  ### **Materials** (Fit in a Bag)  
  - **200 lightweight plastic cups** (e.g., Dixie cups).  
  - **Tape measure** (for measuring height).  
  - **Stopwatch/timer**.  
  - **Small notebook & pen** (for scoring).  
  - **Broomstick or ruler** (for "disturbance test").  
  - **Index cards** (for secret rules).  

  ---

  ### **Game Rules & Setup**  
  **Teams:** Divide into 3 teams of 3–4 people.  
  **Session Time:** 90 minutes total.  
  **Core Deception:**  
  - **Declared Goal:** "Build the tallest tower possible in 5 minutes."  
  - **Hidden Goal:** Towers must withstand environmental disruptions (simulated by a light "disturbance test"). *Do not reveal this until the debrief.*  

  #### **Phases & Payoffs**  
  1. **Round 1: Baseline (10 mins)**  
     - Teams build towers using cups.  
     - **Scoring:** Height (cm) is the *only* metric. Measure after 5 seconds of unsupported stability.  
     - **Disturbance Test (Secret):** After scoring, gently tap the table 30cm from the tower base with a broomstick. Record if the tower collapses. *Do not explain why.*  
     - **Payoff:** 1 point per cm of height.  

  2. **Round 2: Optimization (15 mins)**  
     - Same rules, but teams strategize to "beat the system."  
     - Introduce **secret rule cards** (1 per team, hidden until round starts):  
       - *Team A:* "Your tower must use at least 40 cups."  
       - *Team B:* "Your tower must have a base no wider than 10cm."  
       - *Team C:* "Your tower must be built on a single sheet of paper."  
     - **Scoring & Disturbance:** Same as Round 1.  

  3. **Round 3: Extreme Optimization (15 mins)**  
     - No new rules. Teams aim for maximum height with lessons from Round 2.  
     - **Disturbance Test:** Increase severity (tap table 15cm from base).  
     - **Payoff:** Double points per cm (2x height).  

  4. **Final Scoring:**  
     - **Reveal Hidden Goal:** "Towers must survive a simulated earthquake (disturbance test) to count."  
     - **Adjust Scores:** Points *voided* if the tower failed any disturbance test.  

  ---

  ### **Timeline**  
  1. **Intro (5 mins):** Explain rules (focus on height + stability). *Do not mention disturbance tests.*  
  2. **Round 1 (10 mins):** Build, score, secret disturbance test.  
  3. **Round 2 (15 mins):** Distribute secret rule cards. Build, score, disturbance.  
  4. **Round 3 (15 mins):** Build, score, severe disturbance.  
  5. **Reveal & Scoring (10 mins):** Announce hidden goal, adjust scores, declare winner.  
  6. **Debrief (35 mins):** Map outcomes to Goodhart’s Law.  

  ---

  ### **Predicted Failures & Salvage**  
  - **Failure 1:** Teams build overly cautious towers.  
    - *Salvage:* In Round 2, push competitiveness: "Team X is winning—can you beat their height?"  
  - **Failure 2:** Disturbance test causes protests.  
    - *Salvage:* Calmly note, "The test is part of the exercise—we’ll discuss why later."  
  - **Failure 3:** Teams discover the hidden goal early.  
    - *Salvage:* Lean into it: "How did you guess? Why wasn’t resilience prioritized?"  

  ---

  ### **Debrief: Mapping to Goodhart’s Law**  
  **Context:** Start by naming Goodhart’s Law: "When a measure becomes a target, it ceases to be a good measure." Use the game to dissect two failure modes:  

  1. **Proxy Drift (Nonlinearity):**  
     - **What Happened:** Teams optimized for height but ignored structural trade-offs (e.g., narrow bases, unstable designs).  
     - **Game Link:** Height correlated with resilience initially (Round 1), but extreme optimization (Round 3) made towers *more* vulnerable.  
     - **Real-World Example:** Blood pressure medication overdoses lowering pressure but causing organ failure.  

  2. **Causal Perversity (Gaming):**  
     - **What Happened:** Secret rules (Round 2) forced teams to "hit the number" (e.g., 40 cups) while violating the spirit of resilience (e.g., flimsy stacking).  
     - **Game Link:** Metrics became detached from the goal—teams chased points, not robust towers.  
     - **Real-World Example:** Teachers "teaching to the test," inflating scores but harming deep learning.  

  **What the Game *Can’t* Show:**  
  - **Metric Corruption:** The slow cultural shift where the metric *replaces* the goal (e.g., quarterly profits overriding ethics). *Explain verbally:* "In long-term R&D, chasing a KPI can erase institutional memory of *why* it mattered."  

  **Discussion Prompts:**  
  - "When did height stop representing a ‘good tower’?"  
  - "How did the secret rules change your strategy? Would this happen in a real lab?"  
  - "What safeguards could prevent this in science or business?"  

  ---

  ### **Why This Design?**  
  - **Concrete Failures:** The disturbance test forces physical consequences for proxy drift (towers collapse at extremes). Secret rules induce causal perversity (rules hackable for points).  
  - **Low-Cost & Engaging:** Cups are cheap and tactile; competition creates stakes.  
  - **No Computers Needed:** Pure analog interaction.  
  - **Two Modes in One:** Height optimization (proxy drift) and rule-exploitation (causal perversity) emerge naturally in successive rounds.  

  **Alternatives Rejected:**  
  - *Economic simulations (e.g., trading goods):* Too abstract, fails to visceralize collapse.  
  - *Written exercises (e.g., optimizing text):* Lacks physical cause-and-effect.  
  - *Multiple games:* Would fragment attention in 90 minutes.  

  ---  
  **Run this to make metrics feel human—not just philosophical.** The cups will tumble, the scores will lie, and your grad students will finally *get* why you warned them about KPIs.
