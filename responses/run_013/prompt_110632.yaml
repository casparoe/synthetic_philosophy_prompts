  I need to help design three components: a) the essay question itself for a 90-minute exam, b) a 600-word model answer, and c) a 20-point marking scheme. The user specifically wants to avoid two common mistakes: conflating "the deal was unjust" with "the deal was void," and oversimplifying retroactivity. 

  For the essay question, I'll frame it around which prosecutions can legitimately proceed in Calvente based on the settlement's specific mechanisms. This shifts focus from whether transitional justice mechanisms should exist to how their legal architecture functions. I'll emphasize analyzing the amnesty's conditions rather than rehashing peace-versus-justice debates.

  The model answer needs to demonstrate the required analytical depth. I'll structure it to: 1) reject blanket invalidation arguments, 2) analyze the amnesty's vesting conditions, 3) examine trigger clauses, 4) consider the state's capacity to bind successors, and 5) apply these principles to Calvente's specific cases. This shows how to use the settlement's details rather than general theories.

  For the marking scheme, I'll allocate 20 points across five key moves that target common errors. Each will have explicit "punishment" for the user's specified pet peeves: Move 1 fails students who declare the whole deal void due to injustice (4 points), Move 2 requires parsing retroactivity through the vesting timeline (5 points), Move 3 demands close reading of forfeiture triggers (5 points), Move 4 examines successor state authority (3 points), and Move 5 applies the analysis to case categories (3 points). I'll add notes explaining typical failures like conflating morality with legality or missing how provisional amnesty differs from standard models.

  The user's deeper need seems to be breaking students' habit of using cases as mere illustrations. By designing a hypothetical with novel legal wrinkles (delayed vesting, forfeiture triggers), I force engagement with mechanics over rhetoric. The marking scheme's precision should help consistently reward analysis over recitation.
answer: |-
  Here's the complete exam package designed to push students beyond formulaic responses and into nuanced legal reasoning:

  **a) Essay Question (90 minutes):**  
  "Analyze the legitimacy of the prosecutions reopened in Calvente fourteen years after the TRC report. Focusing *specifically* on the terms of the 2004 settlement (provisional amnesty, vesting conditions, and forfeiture clauses), argue which categories of the 300 targeted beneficiaries could *legitimately* be prosecuted under the settlement's own framework. Your argument must center on the *legal architecture of the amnesty deal itself* and the principle of legality (*nullum crimen, nulla poena sine lege*), rather than abstract debates on peace versus justice or the inherent morality of amnesties."

  **b) Model Answer (~600 words):**  

  The legitimacy of Calvente's reopened prosecutions hinges not on the inherent justice of the 2004 amnesty, but on whether the state is violating the *specific legal bargain* it struck. The settlement created a complex, conditional amnesty regime; prosecutions are only illegitimate if they breach these conditions. Applying the settlement's terms and the principle of legality (requiring clear, predictable consequences), we can identify which prosecutions can proceed.

  **1.  Prosecutions Based *Solely* on "Carrying Out" Atrocities (Where Disclosure Was Full):** These prosecutions are **illegitimate**. The core bargain offered amnesty for *all acts*, including killings, contingent on full personal disclosure and the report's publication. Assuming disclosures were truthful regarding the *nature* of their acts (executing orders), and the report published (vesting amnesty), beneficiaries possess a vested right. Reopening these cases constitutes unlawful retroactive punishment. The victims' groups' argument that the state "lacked the power" to grant such amnesty, while a moral/political critique, does not legally invalidate the *effect* of the amnesty *once vested under the deal's own terms*. The state made a binding political commitment; reneging now violates the principle of legality, undermining future trust in settlements.

  **2.  Prosecutions Based on *Concealment of Planning/Ordering Roles* (Allegedly Understated in Disclosure):** These prosecutions are **potentially legitimate**, falling squarely within the forfeiture clause. The amnesty was explicitly conditional on full disclosure of one's *own acts*. Crucially, the forfeiture trigger applied if a beneficiary was *"shown to have concealed a role in planning or ordering killings."* The settlement distinguished between acting and planning/ordering, making the latter's disclosure mandatory for amnesty validity. If the new government possesses credible evidence (beyond the original disclosure) proving a beneficiary *deliberately concealed* such a role, they forfeited their amnesty *automatically* under the settlement's terms ten years ago. This isn't retroactive law creation; it's enforcing a pre-existing, clearly defined consequence for breach of condition. The beneficiaries' "political bargain" argument fails here – they allegedly violated the bargain's terms first.

  **3.  Prosecutions Based on *Public Contradiction of TRC Findings*:** These prosecutions are **illegitimate** *for the crimes covered by the amnesty*. The forfeiture clause only applied for "ten years after the report." Fourteen years later, this specific condition has expired. Prosecuting someone *now* solely because they contradicted the TRC years ago, where the amnesty vested and no other forfeiture applies, is retroactive punishment. The state cannot resurrect expired conditions. However, if the contradiction constitutes new speech crimes (e.g., incitement, denialism outlawed *after* the amnesty vested), *separate* prosecution for those *new* crimes might be possible, but *not* for the original atrocity crimes covered by the vested amnesty.

  **4.  Prosecutions Against Those Granted *Provisional* Amnesty Where the Report *Was* Published:** The argument that amnesty wasn't "vested" fails. The provisional period ended upon the report's publication, converting provisional amnesty into vested rights for those who complied. The fourteen-year delay is irrelevant; the condition was met.

  **Conclusion:** The settlement's intricate design dictates legitimacy. Prosecutions are legitimate only against beneficiaries provably in breach of the *specific, surviving conditions* – namely, those who concealed planning/ordering roles, triggering forfeiture within the defined period. Prosecutions based solely on acts covered by vested amnesty, or on expired conditions like post-report contradiction, violate the settlement and the principle of legality, regardless of moral arguments about the original deal's justice. The state is bound by its own past political agreements, even as new governments can enforce their conditions.

  **c) Marking Scheme (Out of 20):**

  | Move                                                                                                 | Marks | Why Students Typically Lose Marks Here                                                                                                                                 |
  | :--------------------------------------------------------------------------------------------------- | :---- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Rejects blanket invalidation/non-invalidation:** Explicitly separates moral critique ("unjust deal") from legal validity/breach ("void deal"). Must state that the deal *was* legally operative barring specific breaches. | 4     | **FAIL:** Declares whole deal "void" because amnesties are inherently unjust/illegal, or conversely, claims state can *never* breach *any* political bargain.           |
  | **2. Analyzes vesting & retroactivity precisely:** Correctly identifies amnesty vested *upon publication* for compliant applicants. Explains why prosecuting vested cases breaches legality (retroactive punishment). | 5     | **FAIL:** Treats "amnesty" as monolithic; misses that vesting was conditional/delayed. Confuses retroactivity (applying *new* law to past acts) with enforcing original conditions. |
  | **3. Parses the forfeiture clause rigorously:** Distinguishes "planning/ordering" from "carrying out." Recognizes "concealment" as a breach *of the original condition* (not a new crime). Identifies the 10-year limit on "contradiction." | 5     | **FAIL:** Treats forfeiture triggers as retroactive laws. Fails to see "concealment" breaches the disclosure condition. Misses the expiry of the contradiction trigger. |
  | **4. Engages successor state argument:** Addresses whether the new govt is bound, concluding the state *is* bound by prior political settlements *unless* enforcing the deal's *own* conditions (like forfeiture). | 3     | **FAIL:** Claims new democratic govt can always override past deals, *or* claims past govt bound successors absolutely regardless of breach.                             |
  | **5. Applies analysis to case categories:** Clearly differentiates between prosecutions based on: (i) acts covered by vested amnesty (illegitimate), (ii) provable concealment of planning/ordering (legitimate forfeiture), (iii) post-report contradiction (illegitimate after 10yrs). | 3     | **FAIL:** Treats all 300 cases the same. Doesn't use the settlement's distinctions to categorize cases. Focuses on victim's rights/beneficiary seniority instead of deal terms. |

  **A (17-20):** Hits all 5 moves with sophistication, precise legal reasoning, and flawless application to the scenario.  
  **B (13-16):** Hits most moves but may have minor errors in application (e.g., fudging the 10-year limit), slightly less precise on legality vs. morality, or less structured categorization.

  **Key Punishments Achieved:**
  *   **Move 1 (4 marks) directly penalizes** conflating "unjust" with "void."
  *   **Moves 2 & 3 (10 marks combined) force nuanced retroactivity analysis** by making the amnesty's conditional, phased structure central. Students *must* engage with what was promised, when rights vested, and what constituted a breach under the original terms.
