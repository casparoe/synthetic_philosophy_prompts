prompt: |-
  I'm running a 90-minute internal workshop for about a dozen engineers and product folks at a mid-size AI company, and I need you to act like a philosopher of technology who also knows social choice theory. Most of them think alignment just means RLHF and that the hard part is technical, and they get squirmy when someone asks whose values the model is being aligned to. I want a plan for how I should teach the session, not the session itself. Assume they haven't read Rawls, Arrow, Berlin, or anything on liberal neutrality, but they're sharp and will push back. What has to come first for the question to even make sense to them, and why that order rather than starting with the technical setup? I want the session to hinge on the analogy of writing a constitution for a pluralistic society -- alignment as designing a legitimate procedure for deciding under persistent disagreement, not as specifying a utility function -- but I can't tell if that analogy should come early or late, or whether it breaks because an AI has to output something now while a constitution can stay vague and defer to future politics. Pick the one carrying example (content moderation, medical advice, allocation of attention, something else) and tell me what it must have and lack. I also want them to hit the boundary problem: who counts as the demos for the model -- users, non-users, future people, animals, the model itself? -- and the difference between aggregating preferences and aggregating values, including the possibility that some values are incommensurable. Start by brainstorming a few possible sequences and what each would make easy or hard, then give me the plan.

  Then map the misconceptions they'll predictably form, in the order they'll form them -- something like we can just aggregate preferences, neutrality means having no values, majority preference is the legitimate one, value pluralism means anything goes, the model can just be a mirror -- and tell me exactly where in the sequence I should head each one off. I want the moment where they realize aggregation is not one thing to feel like a discovery rather than a lecture. End with one question I can ask in the last ten minutes that would show whether they've actually understood the problem or just picked up vocabulary. Also tell me what I should openly refuse to cover in 90 minutes and say so out loud, and don't give me readings or citations, I'll add those myself. I've been arguing about this with a collegue for weeks and I want the plan to be opinionated, so don't hedge everything.
