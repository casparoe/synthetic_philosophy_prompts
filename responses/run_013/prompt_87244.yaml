prompt: |-
  Last night a friend and I spent three hours arguing about secession, and we kept returning to an analogy he would not let go of: a state is like a marriage, and secession is like divorce. He had worked it out in some detail. The spouses are the national majority and the aspiring nation; the marriage contract is the constitutional settlement; the prenuptial agreement is the terms of union; alimony is the system of fiscal transfers; the children are those citizens of the departing territory who would rather stay, together with those of the rump who have family and property across the new border; and the divorce court is the constitutional court or the negotiating table. From this he drew three conclusions: that a bare majority in a referendum ought to suffice; that the rest of the state has no veto over the departure; and that the matter is essentially private, so that outsiders — other states, the European Union, the United Nations — have no standing in it. He then produced a flourish I found harder to answer than I expected. Now that England and Wales have moved to no-fault divorce, we no longer think a spouse must prove the other's fault in order to leave, and we no longer think a court should force two people to remain married. On his reading, the Supreme Court of Canada's insistence, in the Quebec reference of 1998, that a clear majority on a clear question triggers a duty to negotiate rather than a right to exit is simply the law refusing to let an unhappy spouse go.

  What I would like is an audit of the analogy, not a verdict on Scottish, Catalan or Quebec politics. Set out the correspondence as explicitly as you can, a table being fine, and then say where it breaks. Two things interest me especially. First, which of the disanalogies genuinely bear on the conclusions he wants and which are merely colourful — whether it matters, for instance, that a marriage is contracted by consenting adults, that children cannot be divided between the parties, or that even a no-fault divorce is unilateral in its grounds but not in its procedure. Second, whether the analogy quietly settles the very question at issue: who has the standing to decide, and whether a union is properly conceived as a contract between two parties rather than as a single political community. Tell me which of his three conclusions survive once the disanalogies are on the table, and which fall. Finally, if the analogy is worth keeping at all, say what it can still be used for, and whether some better comparison — a corporate demerger, the dissolution of a federation, the break-up of a household — does the work he wants without begging the question. Please answer in British English.
reasoning: |-
  Okay, the user wants me to audit an analogy comparing secession to divorce. Let me start by understanding the key points of their friend's argument. The friend equates states in a union to spouses in a marriage, with various elements like the marriage contract as the constitution, alimony as fiscal transfers, and children as citizens caught in the transition. The friend draws three conclusions: a bare majority referendum suffices, no veto for the rest of the state, and it's a private matter without outsider involvement. The user is particularly interested in where the analogy breaks, which disanalogies affect the conclusions, and if the analogy presupposes the answer to the standing question.

  First, I need to map out the correspondences clearly. Creating a table might help visualize the parallels. Then, I should identify where the analogy fails. The marriage analogy assumes a two-party contract, but a political union involves multiple stakeholders. The consenting adults point is crucial because states aren't individuals. Children can't be divided, but in secession, populations are territorial, leading to minority issues. Also, divorce courts handle asset division, but secession negotiations involve complex national assets like debt and infrastructure.

  Next, assessing which disanalogies impact the conclusions. The bare majority might work in marriage but not in secession due to minority rights and the need for clarity. The no-veto point ignores that the rump state's continuity affects all citizens. The private matter claim falls apart because secession has international implications, like border changes and treaties. The friend's no-fault divorce comparison overlooks procedural requirements; even no-fault divorces need legal processes, unlike unilateral secession.

  The analogy's question-begging nature is a problem. By framing the union as a contract between two parties, it assumes the seceding entity's sovereignty upfront, ignoring the existing constitutional framework. The Canadian Supreme Court's stance on duty to negotiate rather than unilateral exit highlights this. 

  Alternative analogies like corporate demergers or federations' dissolution might be better but still have issues. Demergers require shareholder agreements, mirroring constitutional procedures. Federation dissolution involves multilateral negotiations. These alternatives still don't resolve the core issue of who decides. 

  The user's deeper need is likely to find counterarguments for their debate, especially regarding procedural legitimacy and minority protections. They might also want to understand the limitations of simplified analogies in complex political contexts. Ensuring the analysis addresses both the logical flaws and practical implications will be key.
answer: |-
  Below is a systematic audit of the marriage-divorce analogy for secession, following your requested structure. The analysis is presented in British English and focuses on the analogy's logical coherence, not specific secessionist movements.

  ### Correspondence Table: Marriage-Divorce vs. Secession
  | **Marriage/Divorce Element** | **Secession Analogy**                     | **Explicit Correspondence**                                                                 |
  |------------------------------|------------------------------------------|--------------------------------------------------------------------------------------------|
  | **Spouses**                  | National majority & aspiring nation      | Two consenting parties entering a union.                                                   |
  | **Marriage Contract**        | Constitutional settlement                | The foundational legal agreement governing the relationship.                               |
  | **Prenuptial Agreement**     | Terms of union (e.g., accession treaty)  | Specific conditions agreed upon at the union's formation.                                  |
  | **Alimony**                  | System of fiscal transfers               | Ongoing financial obligations post-separation.                                             |
  | **Children**                 | Citizens with cross-border ties          | Vulnerable parties whose welfare is affected by the separation.                            |
  | **Divorce Court**            | Constitutional court/negotiating table   | Forum for resolving separation terms impartially.                                          |
  | **No-Fault Divorce**         | Unilateral right to secede               | Removal of "fault" requirement; one party can leave without proving breach by the other.   |

  ### Where the Analogy Breaks: Key Disanalogies
  1.  **Nature of the Parties:**
      *   **Marriage:** Two *individuals* with legal personhood and capacity to consent.
      *   **Secession:** "Parties" are complex, non-sentient *collectives* (states/nations). Consent was given historically by representatives, not perpetually by every living citizen. The "aspiring nation" is not a pre-existing, unified legal entity like an individual spouse.

  2.  **"Children" - Minorities & Identity:**
      *   **Marriage:** Children are distinct, dependent individuals whose custody and welfare are paramount. *They cannot be divided.*
      *   **Secession:** "Children" represent minority populations *within the seceding territory* (e.g., unionists, different ethnic groups) and those in the rump state with cross-border ties. **Crucially, these groups *can* be divided territorially against their will, becoming minorities in a new state.** Their rights and identities are fundamentally different from dependent children.

  3.  **The "Contract" and Third Parties:**
      *   **Marriage:** Primarily a private contract between two individuals. While the state regulates it, dissolution primarily affects the spouses and children.
      *   **Secession:** The "constitutional contract" creates a *single, new political community* (the state), binding *all* its citizens. Secession dissolves this community, fundamentally altering the rights, obligations, and identity of *every citizen within it*, not just those in the seceding region. It also affects international partners (borders, treaties, alliances).

  4.  **Unilateralism in Procedure:**
      *   **No-Fault Divorce:** While *grounds* are unilateral ("irretrievable breakdown"), *procedure* is not. Even no-fault divorce requires court approval to ensure fairness (asset division, child welfare). One spouse cannot simply declare themselves divorced.
      *   **Secession Analogy:** The "no-fault" parallel implies a unilateral right to leave (*grounds*) but ignores the necessity of an agreed or adjudicated *procedure* to dissolve the complex political and legal entity fairly for all citizens.

  5.  **Irreducible Complexity of the State:**
      *   **Marriage:** Assets, debts, and childcare can (in principle) be neatly divided or assigned.
      *   **Secession:** The state is indivisible in key aspects: national debt, shared infrastructure (e.g., power grids, transport), defence assets, currency, international treaties and memberships, the continuity of the rump state itself, and the rights of affected minorities. Division is inherently messy, contested, and impacts millions beyond the "spouses".

  ### Impact on Your Friend's Conclusions
  1.  **Bare Majority Suffices:**
      *   **Analogy Supports?** Superficially yes (one spouse decides).
      *   **Disanalogy Undermines?** **Severely.** Marriage involves two individuals. Secession affects millions within the seceding territory (where a bare majority overrules a large minority) and the entire rump state. Protecting minorities (the "children" analogue) and ensuring stability demands a higher threshold (e.g., clear majority, supermajority, double majority) than a simple 50%+1. The "children" disanalogy is **critical** here.
      *   **Conclusion:** **Falls.** The complexity and impact necessitate more than a bare majority.

  2.  **No Veto for the Rest of the State:**
      *   **Analogy Supports?** Yes (the other spouse cannot block the divorce).
      *   **Disanalogy Undermines?** **Fundamentally.** The "rest of the state" isn't the "other spouse". It is the *majority of citizens* whose political community is being dissolved and whose rights/assets are directly affected. The rump state also has legal continuity and obligations. The dissolution of the *shared* political entity requires negotiation involving *all* its constituent parts. The "single political community" disanalogy is **decisive**.
      *   **Conclusion:** **Falls.** The rump state and its citizens have a legitimate stake requiring negotiation/agreement.

  3.  **Matter is Essentially Private:**
      *   **Analogy Supports?** Superficially yes (divorce is private).
      *   **Disanalogy Undermines?** **Completely.** Creating a new state alters international borders, affects regional stability (e.g., EU, NATO), impacts treaties, and may create refugee flows or minority rights crises. International law and organisations *do* have standing regarding territorial integrity, self-determination, and stability (e.g., UN Charter). The "third parties/complexity" disanalogy is **overwhelming**.
      *   **Conclusion:** **Falls Utterly.** Secession has significant international ramifications.

  ### Does the Analogy Beg the Question?
  **Yes, significantly.** The analogy *assumes* the core point in dispute by framing the union *exclusively* as a bilateral contract between two distinct parties ("spouses"). This presupposes that the seceding entity possesses inherent sovereignty akin to an individual spouse entering a marriage. It ignores the alternative conception: that the constitutional settlement created a *new, single sovereign people* (the demos of the whole state), of which regional populations are constituent parts, not pre-existing sovereign entities. By starting with the "two spouses" model, the analogy covertly assumes the right of one "spouse" (the aspiring nation) to unilaterally dissolve the union, bypassing the fundamental constitutional question of where ultimate sovereignty resides within the established state.

  ### Is the Analogy Worth Keeping? Potential Use & Alternatives
  *   **Limited Use:** It can *illustrate* the *emotional* sense of an irrevocable breakdown in the relationship between a region and the central state. It might crudely frame the *need* for negotiation over assets/debts (alimony). However, its utility is restricted due to the severe disanalogies.
  *   **Better Analogies (with caveats):**
      *   **Corporate Demerger:** More apt for asset/debt division and contractual obligations. Strengths: Focuses on complex financial/legal unwinding, shareholder (citizen) interests, and agreed procedures. Weaknesses: Still overly contractual; doesn't capture identity/nationalism or democratic legitimacy well; shareholders aren't territorially bound like citizens.
      *   **Dissolution of a Federation/Partnership:** Useful if the state is truly a compact between sovereign entities (e.g., historic confederations). Strengths: Acknowledges multiple constituent parts, negotiation between governments. Weaknesses: Most modern federations are not pure compacts; they create a national demos. Still risks oversimplifying citizen rights.
      *   **Break-up of a Household:** Better than marriage for including more parties (e.g., adult children, dependents). Strengths: Captures shared assets, collective impact, complexity beyond two parties. Weaknesses: Still familial/private, not political; lacks the constitutional/legal dimension and international implications.

  **Conclusion:** While vivid, the marriage-divorce analogy suffers fatal disanalogies concerning the nature of the parties, the treatment of minorities, the indivisible complexity of the state, and the irreducibly public and multilateral nature of secession. It surreptitiously assumes the bilateral, contractual view of the union that is often the very point of contention. Consequently, **none** of your friend's three conclusions survive scrutiny when the disanalogies are properly considered. The analogy is more misleading than illuminating for the core constitutional and political questions at the heart of secession. Corporate demerger or federation dissolution offer slightly better, though still imperfect, frameworks, primarily for the *process* of negotiation rather than the *right* to secede.
