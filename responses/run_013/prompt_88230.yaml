answer: |-
  ### Essay Question  
  **Time Allowed:** 90 minutes  
  **Word Guide:** ~1000 words  

  **Case:** We introduce a new predicate "schmeap" by stipulation: *A collection of grains is a schmeap iff it contains at least K grains, where K is a specific whole number written on a card sealed inside an envelope that no one has ever opened. Nothing in our linguistic practice or usage fixes K beyond this sealed card.* We then construct a sorites series: 1 grain is not a schmeap, 200,000 grains is a schmeap, and each successive case adds exactly one grain.  

  **Question:** Does the sorites paradox arise for "schmeap"? If not, explain why this undermines the plausibility of the tolerance principle (that small differences cannot affect the application of a vague predicate). Contrast this with the standard sorites paradox for "heap." How would an epistemicist, supervaluationist, and degree theorist analyze "schmeap"? Finally, does the *arbitrariness* of K (since any boundary seems equally unmotivated) pose a problem for epistemicism about ordinary vague predicates like "heap"? Defend your reasoning.  

  ---

  ### Model Answer Marking Scheme (Total: 20 marks)  

  1. **Distinguish epistemicism’s unknowability from "schmeap"’s hidden boundary.**  
     *Top answer (4 marks):* Clearly states that epistemicism (e.g., Williamson) requires boundaries fixed by *inescapable linguistic practice* (e.g., usage, causal history) making them *necessarily* unknowable, whereas "schmeap" has a boundary fixed by a *contingent physical fact* (K) that is merely *accidentally* hidden.  
     *B answer (typically 2 marks):* Notes both involve hidden boundaries but fails to contrast contingent physical secrecy with metaphysical/epistemic constraints of language use.  

  2. **Analyze why the sorites fails for "schmeap" and its implication for tolerance.**  
     *Top answer (4 marks):* Argues the tolerance premise ("If n grains is not a schmeap, then n+1 grains is not a schmeap") is *false by stipulation* for "schmeap" (since K sharply defines truth-conditions), exposing tolerance as a *substantive claim* about meaning/use—not a conceptual truth—and thus inapplicable to precise predicates.  
     *B answer (2 marks):* Recognizes the paradox doesn’t arise but doesn’t explicitly tie this to tolerance’s status as a contingent feature of meaning.  

  3. **Address the arbitrariness objection against epistemicism.**  
     *Top answer (4 marks):* Concedes any K is arbitrary for "schmeap" but argues epistemicism for "heap" *avoids* arbitrariness because boundaries are fixed non-arbitrarily by complex linguistic practices (e.g., evolutionary, social) that *determine* extension, even if unknowably.  
     *B answer (2 marks):* Claims epistemicism tolerates arbitrariness or conflates it with unknowability, without explaining how practice mitigates arbitrariness.  

  4. **Supervaluationism’s analysis of "schmeap."**  
     *Top answer (4 marks):* States supervaluationism (e.g., Fine) would deem "schmeap" *precise* (not vague) because all admissible precisifications agree on the same sharp boundary (K), so no truth-value gaps or multiple resolutions exist.  
     *B answer (2 marks):* Correctly labels "schmeap" as precise but omits why supervaluationism requires *disagreement* across precisifications for vagueness.  

  5. **Degree theory’s analysis of "schmeap."**  
     *Top answer (4 marks):* Explains degree theory (e.g., fuzzy logic) would treat "schmeap" as having a *binary truth-value* (0 or 1) at every point, as its sharp boundary precludes intermediate degrees, contrasting with gradual truth-values for genuinely vague predicates.  
     *B answer (2 marks):* Notes "schmeap" lacks degrees but doesn’t emphasize how degree theory’s central commitment (continuum of truth) requires boundary *indeterminacy*.  

  ---  
  **Key for markers:** Award full marks per point only if the student *explicitly* articulates the reasoning above. Deduct marks for vague appeals to "intuition" or theory-summaries without engaging the case.
