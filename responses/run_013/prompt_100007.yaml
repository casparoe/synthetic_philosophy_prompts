prompt: |-
  I teach a 200-level seminar called Law, Paradox, and Play -- 14 students, mostly philosophy and pre-law, one 90-minute block, movable chairs, a whiteboard, index cards, and no laptops. I want to run a game that makes them feel the vertigo of self-amending rules and legal self-reference, not just hear about it. I know the basic Nomic idea -- a game whose first rule lets players change the rules -- but I don't want a straight port of Nomic; it's too sprawling for 90 minutes and half the session would disappear into procedural bookkeeping. Design a stripped-down, runnable variant for me: a starting rule set short enough to fit on one side of a page, roles or turn order, a scoring/payoff scheme that doesn't need real money, and a script for the first ten minutes so I don't over-explain before they start playing. I'd like the rules to include a few loaded pieces: an entrenched rule that can only be amended by a supermajority; a rule that lets a player suspend another rule for one round; a rule about retroactivity; and something that makes the validity of a move depend on the validity of the rule that authorized it. Arrange things so that within the first half-hour some predictable crisis lands -- someone tries to amend the amendment procedure itself, or a move is challenged because the rule that permitted it was repealed after the fact, or the group discovers that the rulebook can't validate its own foundations. The point is for them to run into the problem in the doing, before I name it.

  Then give me the debrief: a timeline of moments to watch for, how to map what happened onto the ideas I care about -- validity vs. efficacy, the difference between repealing a rule and violating it, retroactivity, entrenchment, the bootstrap problem of a constitution that authorizes itself, and the specifically legal version of self-reference where a rule tries to bind its own amendment -- and a set of questions that gets them to articulate which move was actually legal and why the answer may not be determinate. I also want your honest prediction of what will go wrong the first time: where they'll get confused, where I'll be tempted to referee too much, which student will try to exploit a loophole and whether that's a feature or a bug, and how to keep the game from collapsing into pure chaos or pure procedure. Finally, tell me what this activity can't reproduce -- which part of the Nomic/self-reference puzzle has to be supplied by me in the debrief because no 90-minute game can stage it. Don't give me readings or citations; I need the activity, the handout text, and the facilitation notes. I've been reading alot about this stuff and I keep getting tangled up, so be concrete.
reasoning: |-
  We are creating a streamlined Nomic variant called "Paradox Poker" for a 90-minute seminar. The goal is to create a game that forces players to confront the issues of self-amending rules, legal self-reference, and the challenges of rule change without getting bogged down in excessive procedure.

  Key design elements:
  - Starting rule set fits on one page.
  - Roles: None at the start, but we can have a rotating "Speaker" role to manage turn order and proposals.
  - Turn order: Simple round-robin, but rules can change this.
  - Scoring: Points for successful moves (e.g., passing a rule change, winning a challenge). The player with the most points at the end wins. Since we don't have money, points are abstract and tracked on the board.
  - Loaded pieces:
    1. An entrenched rule (Rule 1: Amendment Rule) that requires a supermajority to amend.
    2. A rule that allows a player to suspend another rule for one round (Rule 4: Rule Suspension).
    3. A rule about retroactivity (Rule 6: Retroactive Rule Changes).
    4. A rule that makes the validity of a move depend on the validity of the rule that authorized it (this will be built into the challenge system and Rule 3: Rule Validity).

  We also want a predictable crisis to emerge. Possibilities:
  - A player tries to amend the entrenched amendment rule with a simple majority.
  - A rule is suspended, then a move is made under the suspended rule, and then the suspension ends and we have to decide if the move was valid.
  - A retroactive rule change that invalidates a prior move, which then calls into question subsequent moves.

  Starting Rule Set (to be printed on one page):

  ---

  **Paradox Poker: Starting Rules**

  **Goal:** Accumulate the most points by the end of the game (90 minutes). Points are awarded for successful rule proposals, winning challenges, and other actions as defined by the rules.

  **1. Amendment Rule (Entrenched)**
     - Rules can be amended, added, or repealed by a proposal that receives a majority vote of the players, except for Rule 1 which requires a 2/3 majority to amend.
     - Proposals must be written on an index card and read aloud by the proposer.

  **2. Turn Order**
     - Play proceeds clockwise starting with the Speaker (initially the instructor). The Speaker role rotates clockwise after each full round.
     - On your turn, you may: (a) make a proposal, (b) challenge a previous move, or (c) pass. You may also use Rule 4 (Rule Suspension) if applicable.

  **3. Rule Validity**
     - A move (including a proposal, challenge, or suspension) is valid only if it is authorized by the rules in effect at the time the move is made. If a rule that authorized a move is later repealed or amended, the move remains valid if it was valid at the time it was made.

  **4. Rule Suspension**
     - Once per round, a player may suspend one rule (except Rule 1) for the duration of the current round. The suspension must be announced at the start of the player's turn. The suspended rule does not apply until the start of the next round.

  **5. Challenges**
     - Any player may challenge the validity of a move at any time before the next move is made. The challenger states the reason. Players then vote: if the challenge succeeds (majority vote), the move is void and the challenger gains 1 point. If it fails, the move stands and the challenged player gains 1 point.

  **6. Retroactive Rule Changes**
     - A rule change may have retroactive effect only if explicitly stated in the proposal. If a retroactive change is passed, any move that becomes invalid due to the change is void, and any points awarded for that move are rescinded.

  **7. Point System**
     - Passing a proposal: The proposer gains 2 points.
     - Winning a challenge: The challenger gains 1 point (if the challenge succeeds) or the challenged player gains 1 point (if the challenge fails).
     - Suspending a rule: No immediate points, but if a move made during the suspension is later challenged and upheld, the player who suspended the rule gains 1 point (if the suspension was valid) or loses 1 point (if the suspension was invalid).

  **8. Initial Setup**
     - The game starts with these rules. The instructor is the first Speaker.

  **9. Ending the Game**
     - The game ends at 90 minutes. The player with the most points wins.

  ---

  **Script for First 10 Minutes:**

  "Welcome to Paradox Poker. We're about to play a game where the rules can change. The goal is to end with the most points. Here's the starting rule set [hand out the one-pager]. Don't read it all now — we'll jump in and I'll explain as we go.

  I am the first Speaker. We'll go clockwise. On your turn, you can do one of three things: (1) make a proposal to change the rules (write it on an index card and read it aloud), (2) challenge a previous move if you think it broke the rules, or (3) pass.

  Let me give examples of proposals: 'I propose we add a rule: every time a player passes, they lose a point.' Or: 'I propose we repeal Rule 7 and replace it with: every successful proposal gives 3 points.' Remember, Rule 1 says changing most rules needs a majority vote, but Rule 1 itself requires 2/3.

  Also, Rule 4: once per round, you can suspend a rule (except Rule 1) for this round. Example: suspend Rule 7 so no points are awarded this round.

  Rule 6: you can make a rule change retroactive. Example: 'I propose that Rule 7 is amended to give 3 points for proposals, retroactive to the start of the game.'

  We'll vote on proposals right after they're made. Majority wins, unless it's about Rule 1.

  Ready? I start: I pass. [Turn to the next student] Your turn."

  **Debrief: Timeline and Mapping to Concepts**

  *Moments to Watch For:*
  1. **First proposal:** Likely a simple rule change (e.g., changing point values). Watch for whether they follow the amendment procedure correctly.
  2. **First suspension:** Someone suspends a rule. Then observe if players try to exploit the suspension (e.g., make a move that would normally be illegal). Then when the rule comes back, how do they handle moves made during suspension? (This maps to *validity vs. efficacy*: the suspended rule wasn't in force, so moves under the suspension were valid at the time? But what if the suspension itself is challenged later?)
  3. **First retroactive change:** This will cause confusion. If passed, it might void prior moves. Then points might be rescinded, which could lead to a challenge about the retroactivity rule itself. (This illustrates *retroactivity* and the problem of *legal certainty*.)
  4. **Challenge to a rule's validity:** Especially if a rule was passed under a suspended rule or after a retroactive change. (This directly addresses *the validity of a move depending on the validity of the rule that authorized it*.)
  5. **Attempt to amend Rule 1:** Someone will try to change the entrenched rule with a simple majority. This will lead to a challenge. The group must decide: was the amendment valid? (This confronts *entrenchment* and the *bootstrap problem*: how can a rule authorize its own amendment if it requires a higher threshold? What if they try to retroactively change Rule 1's amendment threshold?)

  *Mapping to Concepts:*
  - **Validity vs. Efficacy:** A rule might be valid (passed correctly) but not efficacious (ignored by players). Or, during a suspension, a rule is not in force but players might still follow it. Ask: "When the rule was suspended, was it still a rule? Or was it just not enforced?"
  - **Repealing vs. Violating:** Repealing a rule removes it; violating it breaks it. But what if a rule is violated in the process of repealing it? (e.g., using a simple majority to change Rule 1). Ask: "When we tried to change Rule 1 with a simple majority, did we violate Rule 1 or did we repeal it?"
  - **Retroactivity:** How does changing the rules after the fact affect prior moves? Ask: "When we passed a retroactive rule, did it just change the rulebook, or did it rewrite history? What happens to moves that were valid at the time but invalid now?"
  - **Entrenchment:** Why have a supermajority requirement? What if they try to amend Rule 1 by first repealing the entrenchment clause? Ask: "Can Rule 1 be amended by a simple majority if we first suspend Rule 1? Or if we pass a retroactive rule that says Rule 1 was never entrenched?"
  - **Bootstrap Problem:** The starting rules are taken as valid, but how do they become valid? (We skip this in the game, but it comes up in debrief.) Ask: "How did our first rule change get its authority? What if we had passed a rule that said the starting rules were invalid?"
  - **Self-Reference in Amendment:** Rule 1 tries to bind its own amendment. Ask: "Can Rule 1 be used to change itself? If we change Rule 1 to require unanimity, does that apply to the vote that changed it?"

  *Debrief Questions:*
  1. "What was the first moment when the rules felt unstable? Why?"
  2. "When we suspended a rule, did that rule still exist? Or was it gone for that round?"
  3. "When we passed a retroactive rule, how did it affect the game? Did it cause confusion? Was it fair?"
  4. "Did anyone try to change Rule 1? What happened? Was that move valid? Why or why not?"
  5. "At any point, did the rulebook become inconsistent? How did we resolve it?"
  6. "Which was more important: following the rules exactly, or keeping the game going? Why?"
  7. "What does this tell us about real legal systems?"

  **Prediction of What Will Go Wrong:**

  1. **Confusion about Suspension:** Players will suspend a rule and then others might forget and follow it anyway, or they might not know what moves are allowed. Then when the rule comes back, they might argue about the validity of moves made during suspension. (This is a feature! It shows the gap between rules and practice.)

  2. **Retroactivity Chaos:** A retroactive rule change will cause points to change, and someone will challenge it. The challenge might be made under the new rules or old rules? (This is the crisis we want.)

  3. **Rule 1 Amendment Attempt:** A player (probably a pre-law student) will try to change Rule 1 with a simple majority. This will lead to a challenge. The vote might pass by majority but fail by 2/3. Then what? Is the amendment void? Or is Rule 1 now changed? (This is the core crisis.)

  4. **Instructor Temptation:** You'll want to step in and clarify. Resist! Let them argue. Only step in if they are stuck and not playing. Say: "What do the rules say? Can you challenge that move?"

  5. **The Exploiter:** One student (likely a philosophy major) will try to create a loop: e.g., suspend Rule 5 (Challenges) and then make a bunch of proposals without fear of challenge. Or they might propose a rule that gives them points for every challenge. This is a feature — it forces the group to confront the need for limits.

  6. **Collapse into Chaos/Procedure:** To avoid chaos, they might over-regulate with too many rules. Or they might descend into arguing. Keep them moving: "Let's take a vote." or "Make a challenge if you disagree." Remind them of the time limit.

  **What the Game Can't Reproduce:**

  - **The Bootstrap Problem:** The game starts with rules we take as given. In reality, how does a constitution ground itself? We don't have a pre-rule state. You must explain in debrief: "In this game, we started with rules I gave you. But how do real legal systems begin? They might have a revolutionary moment or a social contract, but then they have to self-validate."

  - **Infinite Regress in Validation:** The game relies on voting and challenges to validate rules, but what validates the validation rule? (Rule 5: Challenges). If they challenge the challenge rule, it might break. In 90 minutes, they might not hit this. You must point out: "In law, we eventually hit a rule that we just accept, like 'the constitution is supreme' — but that can't be proven within the system."

  - **Long-Term Evolution:** Nomic games can go on for months, showing how rules evolve. In 90 minutes, they get a taste, but not the full evolution. You can note: "Real legal systems have centuries of layered amendments and interpretations. Our game is a sped-up version."

  **Handout Text:** (The starting rule set above, printed one-sided.)

  **Facilitation Notes:**
  - Keep track of the current rules on the whiteboard. When a rule changes, cross out the old and write the new.
  - Track points on the board.
  - Have index cards and pens ready.
  - Start the timer and stick to 90 minutes.
  - During play, only intervene to:
    - Clarify a rule if everyone is confused (but don't solve the paradox).
    - Remind them of turn order.
    - Keep time.
  - In debrief, let them talk first, then guide with the questions above.

  Good luck! This game is designed to get messy, and that's the point.
answer: |-
  ### **Paradox Poker: A 90-Minute Game of Self-Amending Rules**  
  *(Handout for Students — Print one-sided and distribute)*  

  **Goal**: Earn the most points by making valid moves, passing new rules, and winning challenges. The game ends after 90 minutes.  

  **Starting Rules**:  
  1. **Amendment Rule (Entrenched)**:  
     - Any rule (including this one) may be amended, added, or repealed.  
     - To pass, a proposal requires a majority vote (>50% of players).  
     - *Exception*: Amending Rule 1 requires a 2/3 supermajority vote.  
     - *How to propose*: Write your proposal on an index card, read it aloud, and call for a vote. If passed, the change takes effect immediately.  

  2. **Turn Order**:  
     - Play proceeds clockwise. The player to the instructor’s left starts.  
     - On your turn, choose **one** action:  
       - (a) **Propose** a rule change (write it on a card, read it, vote).  
       - (b) **Suspend a rule** using Rule 4.  
       - (c) **Pass** (no action).  

  3. **Rule Validity**:  
     - A move is valid only if authorized by rules **in effect when the move is made**.  
     - If a rule authorizing a move is later repealed, the move’s validity depends on Rule 6 (Retroactivity).  

  4. **Rule Suspension**:  
     - Once per game, any player may suspend **one rule** (except Rule 1) for their turn.  
     - Announce: *“I suspend Rule [X] for this turn.”* The suspended rule does not apply to any player until the next turn.  

  5. **Challenges**:  
     - Any player may challenge a move **before the next turn ends**. State the reason (e.g., *“That violated Rule 3!”*).  
     - Players vote immediately:  
       - Challenge **succeeds** (majority vote): The move is void. Challenger gains 1 point.  
       - Challenge **fails**: The move stands. Challenged player gains 1 point.  

  6. **Retroactive Rule Changes**:  
     - A proposal may state it has **retroactive effect** (e.g., *“This change applies to all moves since the game began”*).  
     - If passed, points or moves affected by the retroactivity are voided.  

  7. **Scoring**:  
     - Passing a proposal: **+2 points** to the proposer.  
     - Winning a challenge: **+1 point** (to challenger if successful; to challenged player if failed).  
     - Suspending a rule: **+0 points** (but may enable other moves).  

  ---

  ### **Instructor Script: First 10 Minutes**  
  *Goal: Get them playing fast. Don’t over-explain rules—let crises emerge.*  

  1. **Setup (2 min)**:  
     - Arrange chairs in a circle. Give each student 5 index cards and a pen.  
     - Post the Starting Rules on the board/wall. Say: *"This is our rulebook. We’re playing a game where you can change the rules. Goal: Earn points. Don’t overthink—just start."*  

  2. **Demo Turn (3 min)**:  
     - *You (as facilitator) take the first turn*:  
       - *"I’ll show you a proposal. I propose: 'Add a rule: Whenever a player passes, they gain 1 point.'"*  
       - Write it on a card. Read it aloud. *"Vote: Thumbs up/down. Majority wins? Yes? Rule added. I get +2 points."*  
       - Mark your points on the board.  

  3. **Handoff (5 min)**:  
     - *"Now, we play. [Name], you’re next. On your turn, you can: Propose a rule change, suspend a rule, or pass. Write proposals clearly. If something feels illegal, challenge it. I won’t referee—you vote on everything."*  
     - *"Remember: Rule 1 is ‘entrenched’—harder to change. Rule 4 lets you suspend a rule for one turn. Rule 6 lets you change the past. Ready? Go."*  
     - Start timer. Nudge the first student: *"What’s your move?"*  

  ---

  ### **Debrief Guide: Moments, Concepts, and Questions**  
  *Watch for these critical moments (likely in first 30 min):*  
  - **Min 10–15**: First suspension (Rule 4). *Likely crisis*: A player suspends Rule 5 (Challenges), then makes a controversial move. When Rule 5 returns, is the move valid?  
  - **Min 20–25**: First retroactive rule (Rule 6). *Likely crisis*: A retroactive repeal voids earlier points. Players argue if later moves (using those points) are invalid.  
  - **Min 25–30**: Amendment attack on Rule 1. *Likely crisis*: A player proposes, *"Change Rule 1: All amendments need only 40% support."* They push a majority vote (not 2/3).  

  #### **Mapping Game Events to Concepts**  
  | **Crisis**                          | **Key Concept**                                  | **Debrief Question**                                                                 |
  |-------------------------------------|--------------------------------------------------|--------------------------------------------------------------------------------------|
  | Suspension then challenge (e.g., Rule 4 + Rule 5) | **Validity vs. Efficacy**                        | *"When Rule 5 was suspended, was the move *valid*? Did it feel *effective*? Why/why not?"* |
  | Retroactive repeal voids a move     | **Retroactivity & Legal Certainty**              | *"If a retroactive rule erased an earlier move, does that make later moves ‘illegal’? Can we even tell?"* |
  | Simple majority amending Rule 1     | **Entrenchment & Self-Reference**               | *"Was that amendment legal? What if Rule 1’s supermajority rule wasn’t followed to change Rule 1?"* |
  | Challenge to a rule’s own validity  | **Bootstrap Problem** (Self-Validating Rules)   | *"When we challenged Rule 3, what rule did we use to validate it? Where does the ‘first rule’ get its power?"* |
  | Exploiting suspension to violate rules | **Repeal vs. Violation**                         | *"Did suspending Rule 2 (Turn Order) ‘repeal’ it or let you ‘violate’ it? What’s the difference?"* |

  #### **Core Debrief Questions**  
  1. *"Which move caused the biggest confusion? Was it ‘legal’ under the rules at that moment? How do you know?"*  
  2. *"When a rule was suspended, did it still ‘exist’? Or was it gone?"* (Links to validity vs. efficacy.)  
  3. *"When we amended Rule 1 with a majority, did we break Rule 1 or change it? If we broke it, is the new rule valid?"* (Forces entrenchment/self-reference.)  
  4. *"Did retroactivity make the game unfair? Why do real legal systems limit it?"*  
  5. *"At any point, did the rules contradict themselves? How did we ‘solve’ it—by voting, ignoring, or something else?"*  

  ---

  ### **What Will Go Wrong: Predictions & Fixes**  
  - **Predicted Chaos**:  
    - **Confusion 1**: Players will forget suspended rules or retroactive changes. *Fix*: Note rule changes on the board but don’t intervene. Let them realize they need a "rules scribe."  
    - **Confusion 2**: A challenge about a rule’s validity (e.g., *"Rule 3 isn’t valid because Rule 1 was broken!"*). *Fix*: Let them vote. The stalemate is the lesson.  
    - **Exploiter**: A philosophy student will suspend Rule 3 (Validity) to make an "anything goes" move. *This is a feature!* It highlights efficacy (power) vs. validity (legitimacy).  

  - **Your Temptations**:  
    - **Don’t** resolve disputes. Say: *"Vote or challenge it."*  
    - **Don’t** clarify rules mid-crisis. Say: *"What do *your* rules say?"*  
    - **Do** step in only if time runs out (e.g., *"3 minutes left—final turn!"*).  

  - **Collapse Risks**:  
    - **Pure Chaos**: If players ignore rules, ask: *"Is anyone tracking validity? Should we challenge?"*  
    - **Pure Procedure**: If they obsess over voting, remind: *"You can suspend rules to experiment."*  

  ---

  ### **What the Game Can’t Reproduce**  
  No 90-minute game can fully stage:  
  - **The Infinite Regress of Validation**: Students will use Rule 5 (Challenges) to validate rules, but they won’t have time to ask, *"What validates Rule 5?"* **Supply this in debrief**: *"In law, all systems rest on an ‘unproven’ foundation (e.g., ‘the constitution is supreme’). We avoided that by starting with my rules—but real constitutions self-authorize. That’s the bootstrap problem."*  
  - **Long-Term Rule Evolution**: Nomic’s "sprawl" shows how rules layer. **Supply this**: *"In 90 minutes, we saw chaos, but real systems build precedent. That’s why retroactivity is rare—it unravels history."*  

  ---

  ### **Final Tips**  
  - **Materials**: Whiteboard (track rules/points), index cards/pens, timer.  
  - **Flow**: Start strict (follow turns), then let chaos unfold. Debrief for 20 min at the end.  
  - **Why This Works**: The loaded pieces (Rule 1, 4, 6) guarantee a crisis. Your role is to **not rescue them**—the vertigo is the point.  

  > "Laws are spiderwebs through which the big flies pass and the little ones get caught." — Honoré de Balzac. Let your students feel both sides.
