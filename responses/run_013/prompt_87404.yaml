  - "preamble": two or three plain sentences both sides would sign as the opening of the statement
  - "agreed_claims": array of objects, each {"id": "A1", "claim": "...", "kind": "conceptual" | "methodological" | "practical"}
  - "disagreements": array of objects, each with "id", "neutral_question" (the disagreement stated so neither side is loaded), "naturalist_formulation" and "normativist_formulation" (the same point in the words that side would use for itself), "crux" (the sub-question that has to be settled), "shared_case_or_argument" (which of the cases above, or which argument, both sides agree is relevant), "naturalist_prediction" and "normativist_prediction" (what each expects to be true of that case), "would_move_naturalist" and "would_move_normativist" (what would actually change that side's mind, or 'nothing, because...'), "verbal" (true/false), "why" (one line)
  - "verbal_disputes": array of {"what_is_verbal": "...", "why": "..."} for any part of the fight that's only about words
  - "still_stuck_on": one short paragraph on the disagreement that survives all of the above, and whether both sides could sign it as a genuine open question

  no citations, no paper titles, no reading list, I don't need that -- just the content.
