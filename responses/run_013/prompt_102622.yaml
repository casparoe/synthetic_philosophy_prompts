prompt: |-
  I have no academic training in this, but for some months I have been turning over a puzzle I cannot put down, and I would rather have the specification before I read any further. The puzzle is this. Two people face a single, one-off exchange in which each does better if they take the selfish option, whatever the other does, and yet both do better if both take the generous option. Each knows the other is the sort of person who will reach the same conclusion as they themselves reach, and neither can communicate or make a binding agreement. Ordinary reasoning says take the selfish option; a stubborn intuition says that two people who know they are alike should both take the generous one. The name I have seen attached to that intuition is superrationality. I have come across several proposals for what it is rational to do here, and I do not want to collect more until I know what any such proposal has to deliver.

  So write me the desiderata: what must a theory of what to do in these symmetric situations actually get right? I want the requirements, each with the case or consideration that motivates it, and I want them sorted into those that are non-negotiable and those that are merely the preferences of one camp. What I am after is a theory good enough to guide an actual decision in such a situation, not merely a tidy formalism.

  The cases I most want it to handle are: the one-off exchange between two people known to reason alike; the same exchange against someone known to be selfish; a case where you are only fairly confident the other person reasons as you do; a case where your payoffs differ slightly from theirs, so the symmetry is imperfect; a case where a very reliable predictor has already acted on its forecast of your choice; and a many-person case, such as contributing to a shared resource or refraining from overusing a common one, where those who reason like you are a large and anonymous set.

  The distinctions I do not want it to blur are: between what you should do and what you should expect the other to do; between a reason that works because it tracks a real causal connection between the two decisions and one that works because your decision is evidence about theirs; between reasoning that is identical in content and reasoning that merely tends to agree; and between a theory of what it is rational for one person to do and a theory of what a group should do.

  The results I do not want it to contradict are: that the selfish option really is right against someone known to be selfish; that no theory may conjure a causal link between two decisions that are causally isolated; and that sometimes the correct advice is to choose at random.

  Then tell me which single requirement, if any, rules out the most of the proposals on offer, and whether any pair or larger set of the requirements cannot be satisfied together. That last point is the one I care about most: if the demands are jointly impossible, I would rather learn that than keep hunting for a theory that meets them all.

  Finally, briefly, say how the leading proposals fare against your list, without a full scorecard: the view that two identical reasoners must both take the generous option; the view that you should take the option that is best given that your choice is evidence about what others like you will do; the view that you should attend only to the causal consequences of your own choice; and the view that in such situations you should reason as a member of a team rather than as an individual.
reasoning: |-
  We are to specify desiderata for a theory of rational choice in symmetric, non-communicative, one-off interactions (especially the Prisoner's Dilemma and similar structures) that captures the intuition of "superrationality" without violating key constraints.

  The user has outlined several cases and distinctions that the theory must handle and avoid blurring. We will list the requirements, categorize them as non-negotiable or negotiable (with motivation), and then check for consistency. Then we will see which requirement is most stringent and which proposals survive.

  I. Non-negotiable requirements (must be satisfied by any acceptable theory):

  1. Dominance against known selfish opponent: 
     - In the case where the other is known to be selfish (i.e., will choose the dominant/selfish option no matter what), the theory must prescribe the selfish option. 
     - Motivation: Against a selfish player, the dominant strategy is the only rational choice because the other will defect regardless. This is a baseline of game theory.

  2. Causal isolation must be respected:
     - The theory must not assume a causal link between the two decisions when they are causally isolated. 
     - Motivation: We cannot have a theory that magically creates causation where there is none. The choices are made independently.

  3. Randomization sometimes required:
     - The theory must sometimes prescribe a mixed strategy (randomization) as the rational choice, when appropriate.
     - Motivation: In some games (e.g., matching pennies), the only equilibrium is in mixed strategies.

  4. Distinction between individual and group rationality:
     - The theory must clearly distinguish between what is rational for an individual and what is rational for a group. 
     - Motivation: The user does not want to blur the line between individual and collective rationality.

  5. Distinction between causal and evidential reasoning:
     - The theory must not blur the distinction between reasons that work because of a causal connection and reasons that work because one's own choice is evidence about the other's.
     - Motivation: This is crucial for understanding the nature of the reasoning. For example, in Newcomb-like problems, evidential reasoning can lead to different conclusions than causal.

  6. Symmetry in reasoning does not imply identity of reasoning content:
     - The theory must allow that two agents may reason similarly (and hence reach the same conclusion) without requiring that they have the exact same reasoning content (i.e., they might have different internal processes that lead to the same outcome). 
     - Motivation: We want to capture the idea that two agents are "alike" without requiring that they are clones.

  II. Negotiable requirements (may be the subject of debate, but the user has a preference for them):

  7. Generous option in symmetric one-off between identical reasoners:
     - In the symmetric one-off case with identical reasoners (who know they are identical and reason alike), the theory should prescribe the generous option to both.
     - Motivation: This is the core intuition of superrationality. The user wants a theory that captures this.

  8. Robustness to near-symmetry:
     - The theory should prescribe the generous option in a near-symmetric case (where payoffs are slightly different or the other is only thought to be similar with high probability) when it is rational to do so.
     - Motivation: We want the theory to be applicable in real-world cases that are not perfectly symmetric.

  9. Handling large anonymous groups:
     - The theory should extend to large anonymous group interactions (like public goods games) where the set of people who reason like the agent is large and anonymous, and prescribe cooperation when appropriate.
     - Motivation: Many real-world problems (e.g., environmental cooperation) have this structure.

  10. Distinction between action and expectation:
      - The theory must clearly distinguish between what an agent should do and what they should expect the other to do. 
      - Motivation: The user explicitly does not want to blur these.

  III. Cases to handle:

  - Case A: One-off exchange between two people known to reason alike -> should both take generous.
  - Case B: Against known selfish -> take selfish.
  - Case C: Fairly confident the other reasons alike -> should be able to handle uncertainty.
  - Case D: Imperfect symmetry (slightly different payoffs) -> should handle.
  - Case E: Presence of a reliable predictor (Newcomb-like) -> should handle appropriately (which might be to take the generous option if that leads to better outcomes, but respecting the causal isolation).
  - Case F: Many-person case (public goods) with anonymous alike reasoners -> should prescribe cooperation when appropriate.

  IV. Which requirement rules out the most proposals?

  Requirement 2 (causal isolation) and requirement 5 (distinction between causal and evidential) together rule out many proposals. In particular, any proposal that relies on evidential reasoning without a causal link must be careful not to violate the causal isolation. Also, requirement 7 (prescribing cooperation in the symmetric case) is the one that many standard theories (like causal decision theory) fail to satisfy.

  V. Consistency of requirements:

  The most critical point is whether the requirements are jointly satisfiable. Let us consider:

  - Requirement 7 (prescribe cooperation in symmetric case) seems to conflict with requirement 1 (defect against known defector) and requirement 2 (causal isolation). How? Because in the symmetric case, if there is no causal link, then by dominance (if we ignore the evidential link) we should defect. But requirement 7 wants cooperation.

  This conflict is at the heart of the debate. The only way to resolve it is to allow evidential reasoning (i.e., your choice is evidence about the other's choice because you both reason the same) without violating causal isolation. That is, we must accept that the reasoning is evidential and not causal.

  However, requirement 5 demands that we do not blur causal and evidential. So the theory must be clear that it is using evidential reasoning in the symmetric case and causal reasoning in the case with a known selfish opponent.

  Thus, the theory must incorporate both causal and evidential reasoning, and switch appropriately. This is what "two-boxing" vs. "one-boxing" in Newcomb's problem does.

  But note: in the symmetric Prisoner's Dilemma (without a predictor) for identical reasoners, if both agents are aware that they are identical and will decide the same, then choosing cooperate leads to (Cooperate, Cooperate) and defect leads to (Defect, Defect). So by choosing cooperate, you are not causing the other to cooperate, but you are setting the outcome to mutual cooperation because the other will do the same. This is evidential: your choice is evidence of the other's, but also your choice determines the outcome because of the symmetry.

  However, requirement 2 (causal isolation) is respected because there is no causal link. The link is via the symmetry of reasoning.

  So the requirements might be jointly satisfiable by a theory that uses evidential decision theory (EDT) in the symmetric case and causal decision theory (CDT) in the case of known opponents. But note that requirement 5 demands that we do not blur the two. So a theory that clearly uses EDT in the symmetric case and CDT in the other cases might work.

  But then we have to check the other requirements.

  VI. How the leading proposals fare:

  a) The view that two identical reasoners must both take the generous option (superrationality):

     - Satisfies: 7 (obviously), 8 (if extended appropriately), 9 (if extended to groups), and Case A.
     - Fails: 1 (if applied to a known selfish opponent, it would still say to be generous? But that would be bad). However, note: if the opponent is known to be selfish, then they are not identical. So maybe it doesn't apply? But then the theory must specify when to use it. Also, it might blur the causal/evidential distinction (requirement 5) because it doesn't explicitly make the distinction.

  b) The evidential view (choose based on evidence your choice provides about others):

     - Satisfies: 7 (by EDT, you condition on your action: P(other cooperates | I cooperate) is high because of symmetry, so expected utility of cooperate is higher), 5 (if clearly stated as evidential), 8 (can handle uncertainty by conditioning), 9 (can condition on the group's behavior given your action), and Case E (Newcomb-like problems).
     - Fails: 1 (against a known selfish opponent, EDT would still condition on your action: if you cooperate, you might think the selfish opponent would too? That's absurd. So EDT fails requirement 1). Also, requirement 2: it doesn't violate causal isolation because it doesn't claim causation, but requirement 5 is satisfied because it is explicitly evidential. However, requirement 1 is non-negotiable and fails.

  c) The causal view (attend only to causal consequences):

     - Satisfies: 1 (against a known selfish, causal dominance says defect), 2, 3 (can prescribe mixed strategies when needed), 5 (explicitly causal), and 10.
     - Fails: 7 (in the symmetric case, CDT would defect because it doesn't see a causal link to the other's action). So it fails the core intuition.

  d) Team reasoning (reason as a member of a team):

     - Satisfies: 7 (the team goal is mutual cooperation), 9 (in groups, the team goal can be the group optimum), and 4 (if it explicitly shifts from individual to team).
     - Fails: 1 (if the other is selfish, then the team reasoning doesn't apply? But if you are team-reasoning, you might still cooperate and get exploited). Also, requirement 4 (distinction between individual and group) is addressed by the shift, but it might blur the line if not careful. Also, requirement 5: team reasoning does not necessarily make the causal/evidential distinction. Moreover, requirement 2: team reasoning does not create a causal link, so it is not violating, but it doesn't explain how the other player comes to cooperate.

  Conclusion on consistency:

  The requirements are jointly impossible if we insist that the same theory must always use the same form of reasoning. However, if we allow a theory that uses:

  - Causal reasoning when the opponent is known to be selfish (or when the symmetry is broken in a way that breaks the evidential link) and 
  - Evidential reasoning when the opponent is known to be identical (or when there is a symmetry that creates a strong evidential link)

  then we might satisfy all. But note that requirement 5 demands we not blur the two. So the theory must be clear about when it uses which.

  But what about the case of only fairly confident? That requires a blend? And the many-person case? Also, the Newcomb case (Case E) is handled by EDT but not by CDT.

  So the leading proposal that comes closest is a form of "two-tier" theory: use EDT in symmetric cases and CDT in asymmetric ones. But then we need a clear criterion for when to switch.

  Alternatively, we might use a unified theory that incorporates both causal and evidential considerations, such as functional decision theory (FDT), which considers the output of the decision function across all identical instances. FDT is designed to handle these symmetric cases.

  Let's check FDT:

  - FDT says: choose the action that, when chosen by all copies of your decision function, leads to the best outcome.
  - In the symmetric Prisoner's Dilemma: if both agents use FDT, they will both choose cooperate because if they both choose cooperate they get (C,C) and if they both choose defect they get (D,D) and (C,C) is better.
  - Against a known selfish (who does not use FDT): FDT would choose defect because the selfish player will defect regardless of what the FDT agent does. So FDT satisfies requirement 1.
  - Causal isolation: FDT does not violate it because it is not claiming a causal link. It is considering the logical connection between the outputs of the same decision function in different instances.
  - Distinction between causal and evidential: FDT is based on the idea of logical (or subjunctive) dependence, which is neither purely causal nor purely evidential. However, it is a distinct category.
  - Requirement 5: FDT does not blur causal and evidential but introduces a third kind. This might be acceptable if we are clear.

  FDT also handles:
  - Case C: with uncertainty about whether the other is using FDT, you can compute the expected utility by weighting the possibilities.
  - Case D: imperfect symmetry? FDT would require that the decision functions are the same but the payoffs might differ? Then it would not necessarily prescribe cooperation. But if the decision functions are identical and they both face the same decision problem (even if the payoffs are slightly different for each) then they would still coordinate on the action that leads to the best outcome when both take it? This needs care.
  - Case E: Newcomb's problem. FDT prescribes one-boxing because it considers the predictor's accuracy as a logical fact about the decision function. So it gets that right.
  - Case F: in a large group, FDT would cooperate if it believes that the other FDT agents will do the same, because by cooperating it is part of the group that cooperates and achieves the good outcome.

  So FDT might satisfy all the non-negotiable requirements and most of the negotiable ones.

  But note requirement 6: FDT requires that the agents are using the same decision function (exact same algorithm). This is a strong form of symmetry. The user wants to allow for agents that are merely "alike" in the sense that they tend to agree. FDT might be too strong.

  Also, requirement 3: FDT would not necessarily prescribe randomization in games where mixed strategies are required, because it is designed for coordination. In matching pennies, if you are playing against a copy of yourself, then both of you would try to outguess the other and end up in an infinite regress? FDT would need to be extended for mixed equilibria.

  Therefore, while FDT is a promising candidate, it may not be perfect.

  Now, to the user's most important point: are the requirements jointly impossible? It seems they are not impossible if we adopt a theory that incorporates both causal and evidential/logical reasoning in a structured way, like FDT. However, note that requirement 7 (cooperation in symmetric case) and requirement 1 (defect against known defector) are both satisfied by FDT, and the causal isolation is respected.

  But requirement 5 (distinction between causal and evidential) is not violated by FDT because FDT is based on logical decision theory, which is a distinct category. However, the user might consider that the distinction is maintained because FDT does not confuse the two but uses a third kind.

  Alternatively, if the user insists that the theory must be solely causal or solely evidential, then the requirements are impossible because we need both to handle the different cases.

  In summary:

  - The desiderata are jointly satisfiable by a theory that uses different modes of reasoning for different cases (like FDT) or by a unified logical decision theory.
  - The requirement that rules out the most proposals is the requirement to cooperate in the symmetric one-off (requirement 7) because standard causal decision theory fails it. Also, the requirement to defect against a known defector (requirement 1) rules out pure evidential decision theory.
  - The leading proposals:
     - Superrationality: fails requirement 1 (doesn't handle known selfish opponent) and may blur distinctions (5 and 10).
     - Evidential decision theory: fails requirement 1 (against known selfish, it might irrationally cooperate).
     - Causal decision theory: fails requirement 7 (doesn't cooperate in symmetric case).
     - Team reasoning: may fail requirement 1 (if applied naively) and requirement 4 (if it doesn't clearly distinguish individual and team) and doesn't inherently handle Newcomb (Case E).

  Therefore, a theory in the vein of FDT is the most promising.

  Final note: The user should be aware that the field is still developing and there is no consensus. But the requirements are not impossible to satisfy together.
answer: |-
  Below, I outline the desiderata for a theory of rational choice in symmetric, non-communicative, one-off interactions (e.g., Prisoner's Dilemma-like situations), structured as requested. I distinguish **non-negotiable requirements** (grounded in logic, causality, or uncontroversial rationality constraints) from **negotiable preferences** (which reflect philosophical or practical leanings). I then address consistency, the most stringent requirement, and briefly evaluate leading proposals.

  ---

  ### **I. Non-Negotiable Requirements**  
  These must be satisfied by any acceptable theory. Violations imply internal inconsistency or empirical falsehoods.

  1. **Dominance Against Known Selfish Players**  
     - **Requirement**: When facing a player known to choose selfishly (e.g., they will defect regardless of your choice), the theory must prescribe the selfish option.  
     - **Motivation**: Rationality demands exploiting dominant strategies against non-responsive opponents. Choosing generosity here guarantees a worse outcome (e.g., in Prisoner's Dilemma: if they defect, you get sucker's payoff by cooperating).  
     - **Case**: Directly handles "exchange against someone known to be selfish."

  2. **Respect Causal Isolation**  
     - **Requirement**: No theory may invent a causal link between decisions when none exists (e.g., your choice cannot physically influence the other's isolated decision).  
     - **Motivation**: Rationality must align with the causal structure of reality. Ignoring this leads to magical thinking (e.g., "If I cooperate, it causes them to cooperate").  
     - **Distinction**: Central to avoiding blur between causal and evidential reasoning.

  3. **Randomization When Required**  
     - **Requirement**: The theory must sometimes prescribe mixed strategies (e.g., randomizing choices).  
     - **Motivation**: In adversarial or zero-sum scenarios (e.g., matching pennies), determinism is exploitable; randomization is the only rational response.  
     - **Case**: General applicability (e.g., if payoffs create an equilibrium requiring randomness).

  4. **Distinguish Individual and Group Rationality**  
     - **Requirement**: The theory must not conflate "what is rational for me" with "what is rational for us."  
     - **Motivation**: Group rationality (e.g., "we should both cooperate") presupposes collective agency, but individuals lack control over others. Blurring this invites category errors.  
     - **Distinction**: Key for handling team reasoning vs. individual mandates.

  5. **Distinguish Causal and Evidential Reasoning**  
     - **Requirement**: Reasons for acting must be categorized as:  
       - **Causal**: "My action affects outcomes."  
       - **Evidential**: "My action is evidence about others' actions (but does not cause them)."  
     - **Motivation**: Conflation leads to paradoxes (e.g., Newcomb's Problem). Evidence-based inferences (e.g., "I cooperate, so likely they do too") are valid only if justified by correlation, not causation.  
     - **Distinction**: Critical for cases with predictors or symmetry.

  6. **Avoid Presuming Identical Reasoning Content**  
     - **Requirement**: The theory must not assume agents have identical internal reasoning processes; it must handle agents who "tend to agree" due to similar (but not identical) methods.  
     - **Motivation**: Humans (or algorithms) may reach the same conclusion via different paths. Requiring content-identity is unrealistic and overly restrictive.  
     - **Case**: Handles "fairly confident they reason alike" and imperfect symmetries.

  ---

  ### **II. Negotiable Preferences**  
  These are desirable but reflect pragmatic or philosophical leanings. Some theories may omit them.

  7. **Prescribe Generosity Under Perfect Symmetry**  
     - **Preference**: When two agents know they are identical reasoners (same algorithm, same inputs), the theory should prescribe the generous option.  
     - **Motivation**: Captures the superrationality intuition: identical agents will mirror each other, making mutual generosity optimal (e.g., both cooperate in Prisoner's Dilemma).  
     - **Case**: Core "one-off exchange between two alike people."

  8. **Robustness to Uncertainty and Near-Symmetry**  
     - **Preference**: The theory should:  
       - Handle cases where you are "fairly confident" (but not certain) others reason similarly.  
       - Prescribe generosity when symmetry is slightly imperfect (e.g., payoffs differ minimally).  
     - **Motivation**: Real-world decisions involve uncertainty; a theory requiring perfect symmetry is impractical.  
     - **Case**: Directly addresses user-specified scenarios.

  9. **Scale to Large Anonymous Groups**  
     - **Preference**: The theory should extend to N-player scenarios (e.g., public goods games) where alike reasoners are numerous and anonymous.  
     - **Motivation**: Many real-world problems (e.g., climate action) involve collective action without coordination.  
     - **Case**: "Many-person case" like shared resources.

  10. **Clarity on Action vs. Expectation**  
      - **Preference**: The theory must distinguish "what I should do" from "what I expect others to do."  
      - **Motivation**: Rational choices depend on predictions of others, but the two are logically distinct (e.g., I might expect defection but still cooperate for other reasons).  

  ---

  ### **III. Consistency and Feasibility**  
  **Key Question**: *Can all requirements be satisfied jointly?*  
  - **Yes**, but only if the theory incorporates **both causal and evidential reasoning** in a disciplined way, switching modes based on context.  
  - **Critical Tension**: Non-negotiable requirements #2 (causal isolation) and #5 (distinguish causal/evidential) conflict with negotiable preference #7 (prescribe generosity under symmetry) if the theory is purely causal.  
    - **Resolution**: A hybrid theory can satisfy all by:  
      - Using **causal reasoning** when others' actions are fixed (e.g., against known selfish players).  
      - Using **evidential reasoning** under symmetry (e.g., "My choice is evidence of theirs, so mutual generosity is best").  
      - This respects causal isolation (evidence ≠ causation) and handles the symmetric case.  

  **Most Stringent Requirement**: #2 (**Respect Causal Isolation**).  
  - **Why**: It rules out:  
    - Theories claiming your choice physically influences isolated others (e.g., naive superrationality).  
    - "Team reasoning" if it implies spooky coordination.  
    - Causal decision theory (CDT) extensions that smuggle in causation.  
  - Over 50% of informal proposals (e.g., "just cooperate!") fail this.  

  **Joint Impossibility?**  
  - **No**: Requirements are jointly satisfiable.  
  - **But**: Negotiable preferences (e.g., #7–#9) may conflict if forced into a monolithic framework.  
    - Example: A theory optimized for perfect symmetry (#7) may fail in large groups (#9) if anonymity breaks evidential links.  
    - Solution: Context-dependent reasoning (e.g., evidential in small symmetry, causal in large anonymity).  

  ---

  ### **IV. Leading Proposals Evaluated**  
  Using the desiderata above:

  1. **"Superrationality" (Identical reasoners must choose generously)**  
     - **Fails**: #1 (dominance against selfish players), #2 (assumes causal link via symmetry), #4 (blurs individual/group).  
     - **Verdict**: Inadequate; violates non-negotiables.  

  2. **Evidential Decision Theory (EDT: Choose based on evidence your action provides)**  
     - **Satisfies**: #5 (explicitly evidential), #7 (prescribes generosity under symmetry), #8 (handles uncertainty).  
     - **Fails**: #1 (against known selfish players, EDT may irrationally cooperate), #2 (can blur causality if misapplied).  
     - **Verdict**: Partial; fails dominance.  

  3. **Causal Decision Theory (CDT: Choose based on causal consequences)**  
     - **Satisfies**: #1, #2, #3, #5 (clean causal focus).  
     - **Fails**: #7 (prescribes selfishness in symmetric cases, missing mutual gains), #8–#9 (no mechanism for cooperation under symmetry).  
     - **Verdict**: Strong on non-negotiables but misses core intuition.  

  4. **Team Reasoning (Decide as a group member)**  
     - **Satisfies**: #7, #9 (prescribes group-optimal choices).  
     - **Fails**: #1 (may cooperate with selfish players), #2 (implies non-causal "team causation"), #4 (blurs individual/group).  
     - **Verdict**: Violates key non-negotiables.  

  **Top Contender**: **Functional Decision Theory (FDT)** or similar frameworks.  
  - **Why**: It handles evidential reasoning (for symmetry) and causal reasoning (for isolated/selfish players) distinctly.  
    - Satisfies all non-negotiables and most negotiables (e.g., #7–#9) by viewing decisions as outputs of identical functions.  
  - **Remaining Challenge**: Scaling to "imperfect similarity" (#6) requires careful modeling of "alike but not identical" agents.  

  ---

  ### **Summary**  
  - **Desiderata are feasible**: A hybrid theory (e.g., FDT) can satisfy all non-negotiables and most negotiables by context-dependent use of causal/evidential reasoning.  
  - **Critical Non-Negotiable**: Causal isolation (#2) rules out most naive proposals.  
  - **Core Tension**: Resolved by distinguishing when to use evidence (symmetry) vs. causation (isolation/selfishness).  
  - **Next Step**: Explore FDT or formal evidential theories, but insist they:  
    1. Default to causal reasoning against selfish players.  
    2. Explicitly label evidential reasoning in symmetric cases.  
    3. Handle uncertainty and scalability.  

  This provides a rigorous specification for evaluating proposals—grounded in your cases and distinctions—without premature commitment.
