prompt: |-
  I am a teaching assistant for a first-year graduate seminar in historical theory, and next week I have seventy-five minutes to introduce the idea that germs, climate, and volcanoes can function as historical actors. The students are intelligent but have mostly encountered history as the study of human decisions, and several of them are already suspicious that any talk of non-human agency is either a metaphor or a slide into environmental determinism. A colleague in environmental history and I have been arguing about whether the phrase is a genuine theoretical advance or just a rhetorical upgrade, and I want the session to give students the tools to take a side. I do not want you to explain the topic to me; I want a teaching plan. Assume I know the material and need to know how to sequence it. What has to come first for the question even to be well formed, what depends on what, and where exactly the line between cause and actor has to be drawn before students can see why the phrase is controversial rather than merely fashionable?

  To make the session something they cannot simply repeat from a textbook, I want to build it around a distinction I have been calling causal weight versus causal voice. Causal weight is the counterfactual difference an entity makes to an outcome—how much the outcome would change if the entity were absent or altered. Causal voice is whether we narrate that entity as an agent: as something that does, wants, intends, suffers, or responds. My thought is that environmental determinism often comes from collapsing the second into the first—from assuming that a large causal weight licenses a voice—and that the historical actor language is useful precisely when it keeps the two apart. Plan the explanation around that distinction: the order in which the pieces must be introduced, the one carrying example that should anchor the whole session and what it must have and lack (I am inclined toward the Tambora eruption and the year without a summer, but tell me if that example will do the work or if I need a different kind of case), the misconceptions students will predictably bring or form—especially that if something has effects it is an agent, that agency is just a metaphor for causality, and that any environmental explanation is determinism—and the precise point in the sequence where each should be headed off. End with the check for understanding that would show me whether they can use the distinction rather than merely recite it, and tell me what I should explicitly leave out at this level and why. Please write in American English.
reasoning: |-
  Okay, let me approach this teaching assistant's request methodically. They're preparing a 75-minute graduate seminar on non-human historical actors, with a focus on distinguishing causal weight from causal voice - a sophisticated framework they've developed. 

  The core challenge seems to be sequencing: how to guide students from seeing history as purely human decisions to understanding why agency attribution is a separate question from causal significance. I need to consider their Tambora example carefully - while it's iconic for demonstrating causal weight, does it risk reinforcing the very conflation they want to avoid? Perhaps pairing it with a contrasting case where something has voice without overwhelming weight would strengthen the distinction.

  For the opening, we should immediately confront the anthropocentric assumption. A quick human-only scenario (like a cabinet meeting) could expose how agency language feels natural there, setting up the contrast with non-human cases. The key is making students feel the discomfort of attributing "desires" to volcanoes before giving them tools to analyze it.

  The misconception mapping needs special attention. Three traps stand out: the automatic translation of big effects into agency, the metaphor excuse that avoids serious engagement, and the determinism accusation. Each requires a specific counter in the flow - maybe preempting the determinism concern by showing how non-human actors actually increase contingency.

  For the active learning component, I'm considering whether the "causal weight vs voice" worksheet should compare two phenomena side-by-side. Like Tambora versus something with more ambiguous "voice" like penicillin mold - where we might anthropomorphize its "attack" on bacteria. That comparison could crystallize the distinction better than a single example.

  The colleague's skepticism about whether this is theoretical progress or just rhetoric is actually a perfect framing device. Ending with that debate question forces application of the tools. But we must provide clear criteria - like "does this attribution reveal new historical relationships or just decorate existing explanations?"

  Timing is tight. The first 20 minutes need to establish the problem and framework so the bulk can be case work. Should probably cut any deep dive into actor-network theory - mention it as further reading but focus on operationalizing their distinction. The payoff is students seeing how voice attribution is an interpretive choice with methodological consequences, not just philosophical window-dressing.
answer: |-
  Here’s a structured 75-minute teaching plan centered on your **causal weight vs. causal voice** distinction, designed to confront misconceptions and equip students to evaluate "non-human actor" claims rigorously. The Tambora eruption (1815) is an ideal anchor case.

  ---

  ### **Teaching Plan: Non-Human Actors in History**  
  **Core Question:** *When (if ever) is it useful/conceptually valid to treat germs/climate/volcanoes as "historical actors" rather than mere causes?*  

  ---

  ### **Sequence & Timing**  
  **Total: 75 mins**  

  #### **1. Framing the Problem: Human-Centric History’s Limits** (10 mins)  
  - **Activity:** Pose a human-only historical event (e.g., "Lenin’s decision to return to Russia in 1917"). Ask: *"What ‘actors’ shaped this outcome?"*  
  - **Point:** Students list human agents (Lenin, German officials).  
  - **Pivot:** *"What if outcomes can’t be fully explained by human choices? What *else* might push history?"*  
  - **Misconception Preemption:** Acknowledge suspicion of "agency" talk upfront: *"Today we test if ‘non-human actor’ is more than metaphor/determinism."*  

  #### **2. Introducing Key Distinction: Causal Weight vs. Causal Voice** (15 mins)  
  - **Define Clearly:**  
    - **Causal Weight:** *"How much does X change the outcome if removed/altered? (Counterfactual impact)."*  
    - **Causal Voice:** *"Do we describe X as having *intentions, desires, or experiences*? (Agency framing)."*  
  - **Human Example:** A general winning a battle.  
    - *Weight:* His strategy altered the outcome.  
    - *Voice:* We call him "decisive" or "ruthless" (agency language).  
  - **Crucial Point:** *"We *often* conflate these. High weight ≠ automatic voice. Today: Can non-humans have *either*? When do they deserve *both*?"*  

  #### **3. Anchor Case: Tambora Eruption (1815) & "Year Without a Summer"** (25 mins)  
  - **Present Facts:**  
    - Eruption → Global cooling → Crop failures → Famine/migration → Proto-environmentalism.  
  - **Analyze with Distinction:**  
    - **Causal Weight (15 mins):**  
      - *Counterfactual Q:* "Without Tambora, would 1816–1820 unfold identically?" (No: massive disruption).  
      - *Exercise:* List cascading effects (economic, cultural, biological).  
      - **Key Insight:** *Weight is uncontroversial here.* Students see environment isn’t "background."  
    - **Causal Voice (10 mins):**  
      - *Q:* "Did Tambora *intend* to cause famine? Did it *respond* to humans? Does it *suffer*?"  
      - *Contrast:* Humans in the crisis (e.g., politicians "blaming" the weather).  
      - **Trap to Avoid:** Students may say "It’s just a metaphor!" → Redirect: *"But WHY do we *use* that metaphor? What work does it do?"*  

  #### **4. Confronting Misconceptions** (15 mins)  
  - **Misconception 1:** *"Big effects = Agency"*  
    - **Response:** Show a high-weight/low-voice example (e.g., asteroid killing dinosaurs → weight huge, but no "voice").  
  - **Misconception 2:** *"Agency = Just a Metaphor for Causality"*  
    - **Response:** Ask: *"If we say ‘the volcano *punished* humanity,’ what does that imply that ‘the volcano *caused* a famine’ does not?"* (Moral framing, intentionality, narrative vividness).  
  - **Misconception 3:** *"Environmental Factors = Determinism"*  
    - **Response:** Highlight human *responses* to Tambora: Relief efforts, migration, scientific inquiry. *"Tambora didn’t determine *how* humans reacted—it set new conditions for action."*  

  #### **5. Synthesis: Is "Actor" Language a Theoretical Advance?** (5 mins)  
  - **Your Colleague’s Debate:**  
    - *"Rhetorical Upgrade"*: Just vivid storytelling; adds no analytical value.  
    - *"Theoretical Advance"*: Forces us to ask *how* non-humans participate in networks of change (beyond "trigger" or "context").  
  - **Student Takeaway:** *"Actor" language is defensible when:*  
    - Voice does explanatory work weight alone can’t (e.g., shaping meaning/perception).  
    - It reveals *relational* histories (how humans/non-humans co-shape events).  

  #### **6. Check for Understanding** (5 mins)  
  - **Scenario Test:** Present a new case (e.g., *Phylloxera* aphid devastating 19th-century French vineyards).  
    - *Q1:* "Assess its **causal weight**: What changes if we remove it?"  
    - *Q2:* "Would calling it an ‘invader’ or ‘biological insurgent’ (voice) be *useful*? Or is it determinist/metaphorical?"  
  - **Success Metric:** Students must:  
    - Separate weight/voice analysis.  
    - Argue *for or against* "actor" language using the distinction.  
    - Explain *what voice adds* (or distorts) beyond weight.  

  ---

  ### **What to Explicitly Exclude & Why**  
  - **Deep Dives into Actor-Network Theory (ANT):** Too complex for 75 mins; distracts from your core distinction. Mention it as further reading.  
  - **Philosophy of Agency:** Avoid debates about "consciousness." Focus on *practical use in historical narration*.  
  - **Every Non-Human Example:** Stick to 1–2 cases (Tambora + Phylloxera). Depth > breadth.  

  ---

  ### **Why Tambora Works**  
  - **Strengths:** Undeniable weight, rich human responses, voice language exists in sources ("the volcano’s wrath"). Perfect for separating weight (global cooling) from voice (attributing intent).  
  - **Limitation:** Its weight is SO high, students may still conflate. Counter with low-weight/high-voice examples (e.g., a rat sinking a ship via gnawed wires → minimal weight, but narratively an "actor").  

  ### **Predictable Pitfalls & Preemptions**  
  - **"But It’s Not Conscious!"**: Reframe: *"Agency in history isn’t about consciousness—it’s about *positioning in a story*. Guns don’t ‘kill,’ but they’re actors in military histories."*  
  - **Sliding into Determinism:** Emphasize *response* and *contingency* in Tambora’s aftermath. Ask: *"Did the volcano *decide* how Britain vs. the US reacted?"*  
  - **Dismissing as "Just Semantics"**: Argue: *"Language shapes explanations. Calling something an ‘actor’ asks *how it actively participates*, not just ‘was it a cause?’"*  

  This sequence forces students to see the **gap between impact and agency attribution**. By session’s end, they should be able to dissect *why* calling a volcano an "actor" is contentious—and when it might be more than rhetoric.  

  ---  
  **Final Tip:** End by assigning a short primary source (e.g., a Tambora-era letter blaming "nature’s wrath") and ask: *"Does this writer conflate weight and voice? Does it help their argument?"*
