answer: |-
  ### Analysis of the Virginia 94th District Election through the Rational-Choice Paradox of Voting

  The paradox of voting (turnout version) weighs the cost of voting against the expected benefit of being pivotal, often amended with a duty or expressive term. For the Virginia 94th district case, the ex ante probability of a single vote being pivotal is estimated under two assumptions:  
  - **Independent fair coin**: Each voter is equally likely to vote for either major candidate (ignoring the Libertarian). For \( n = 23,216 \) major-party voters, \( P(\text{tie}) \approx 1/\sqrt{\pi n / 2} \sim 10^{-2} \) (order \( 5 \times 10^{-3} \)). This assumes perfect electoral randomness.  
  - **Normal margin with spread**: Margin of victory is normal with a standard deviation of 3% of the vote share (typical polling error). Here, \( P(\text{pivotal}) \approx \phi(0) / \text{SD} \), where SD \( \sim 0.03 \times 23,216 \times 2 \approx 1,400 \) votes. Density at zero is \( \sim 10^{-3} \), multiplied by vote-width \( 1/n \), giving \( P \sim 10^{-4} \).  

  **Scaling with electorate size**: The fair-coin \( P \) scales as \( 1/\sqrt{n} \); the normal-margin \( P \) scales as \( 1/n \) (with fixed spread).  

  **Inverting the calculus**: With cost \( C \approx \$10 \) (time/effort) and tie resolution halving the benefit (lottery win probability 0.5), required benefit \( B \) satisfies \( P \times (B/2) > C \).  
  - Fair coin: \( B > 2C / P \sim \$4,000 \).  
  - Normal margin: \( B > 2C / P \sim \$200,000 \).  
  These \( B \) magnitudes are implausible for an ordinary voter; the personal benefit from party control cannot reasonably reach thousands to hundreds of thousands of dollars. The duty term must absorb nearly all motivation.  

  **Features explained by the calculus**:  
  1. Low instrumental motivation: The minuscule \( P \) justifies why purely benefit-driven voting is irrational.  
  2. Closeness effect: Higher turnout in close races (like this) aligns with elevated (though still small) \( P \) in the fair-coin model.  

  **Features missed or misdescribed**:  
  1. Tie resolved by lot: A vote pivotal for the tie is only pivotal for the outcome with probability 0.5, halving the benefit—this is adjustably included.  
  2. Judicial/random interventions: The recount and random draw moved the locus of decision away from voters, undermining the "pivotal vote" premise.  
  3. Third candidate: The Libertarian’s 675 votes could enable different pivotal events (e.g., tie with a major candidate), unmodeled in standard calculus.  
  4. Ex post closeness ≠ ex ante probability: The actual tie is retrospective and uninformative about ex ante \( P \), yet often misperceived as evidence of high pivotality.  

  **Contrast with Scottish independence referendum**:  
  - Electorate: 3.6 million; margin 10.6%, so \( P \sim 10^{-7} \) (normal spread). Required \( B \sim \$20 \) million, astronomically implausible.  
  - Differences: Virginia’s closeness raised \( P \) slightly (explaining turnout sensitivity), but both cases require duty terms. Scotland’s youth franchise altered costs/duty but is unmodeled. The theory explains low instrumental motivation in large/unclose elections but misses franchise effects and collective symbolism (e.g., national identity in Scotland).  

  **Theory verdict**: The episode **leaves the theory unfalsifiable** due to the duty term. A duty/expressive account easily explains turnout despite near-zero \( P \) but must concede that instrumental motives cannot operate alone. It gains explanatory power for high turnout in non-pivotal contexts (e.g., expressive voting in Scotland) but gives up predictive precision on closeness effects without ad hoc adjustments.  

  **Discriminating case**: A **national election in a safe state with polarized electorate** (e.g., 2020 U.S. presidential election in solidly red Wyoming).  
  - Pure duty model: Predicts high turnout (duty unchanged).  
  - Combined (duty + instrumental) model: Predicts lower turnout than swing states (no pivotality incentive).  
  Observed lower turnout in safe states supports the combined model.  

  **Least confident step**: Estimating the spread in the normal-margin model; the assumed 3% SD is empirically grounded but arbitrary, and actual electoral volatility may differ.

