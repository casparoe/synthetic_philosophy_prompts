answer: |-
  ### The Procedure  
  1. **Identify Constraint Functions**  
     *Question:* What does each constraint *do*? (Container = structural frame; Sound = rhythm/euphony; Content = meaning-bearing; Essence = core concept)  
     *Sufficient Answer:* Author statements, reviews, or textual evidence (e.g., acrostic spelling a name = Content; lipogram as thematic absence = Essence).  
     *Action:* Label each constraint C, S, Co, or E.  

  2. **Prioritize Constraints**  
     *Question:* Which constraints *must* survive translation?  
     *Sufficient Answer:* E > Co > S > C. Essence always wins; Content beats Sound/Container.  
     *Action:* Rank-order constraints. Sacrifice lower-ranked when clashes occur.  

  3. **Test Constraint Transferability**  
     *Question:* Can I swap a constraint with an analogous one (e.g., syllable count → stress count) without altering artistic intent?  
     *Sufficient Answer:* If the swap serves the *same function* (e.g., replacing ABAB rhyme with slant rhyme preserves Sound’s musicality).  
     *Action:* Allow swaps only if function matches. If not, proceed to Step 4.  

  4. **Break or Note**  
     *Question:* Does breaking/adapting a constraint require reader explanation?  
     *Sufficient Answer:* If sacrificed constraint is Co/E, or if break obscures meaning.  
     *Action:* Add translator’s note: "Broke [constraint] because [reason]. Original had [example]."  

  5. **Literal + Note Trigger**  
     *Question:* Would preserving *any* constraint require unnatural English or distort content?  
     *Sufficient Answer:* If >2 Co/S constraints fail after Steps 1-4, or if E is untransferable.  
     *Action:* Translate literally + note. Note *must* quote original constraint and demonstrate it (e.g., "Line 1’s words: *chat, dansa, fort* [alphabetical]").

  6. **Poet/Estate Handoff**  
     *Question:* Does this choice alter Co/E?  
     *Sufficient Answer:* Only if Step 3 swap or Step 4 break affects labeled Co/E.  
     *Action:* Ask poet: **"Does [specific change] undermine the core concept or key meaning of the poem?"** Submit options if possible.  

  7. **"Sing" Test (Judgment)**  
     *Question:* Does the English poem *work* as poetry?  
     *Sufficient Answer:* Subjective. Read aloud; if awkwardness overrides artistic impact, revisit Steps 3-5.  
     *Action:* Iterate or add note justifying friction.  

  ---

  ### Why This Order  
  Start with *function* (Step 1) because mislabeling sinks everything. Hofstadter’s "slippage" concept is operationalized by ranking *why* a constraint exists (Step 2). Testing swaps *before* breaks (Step 3) prevents unnecessary loss. Handoff happens *after* proposing solutions (Step 6) so poets answer concretely. "Sing" comes last (Step 7) because fluency can’t override Essence. Dropped: nuanced constraint interactions (e.g., when Sound *is* Content). Simplified to binary rankings; judgment flags where this is reductive.  

  ---

  ### The Three Poems  
  **Poem 1 (Sister’s Name Acrostic)**  
  - Step 1: Acrostic = Co (name is content), Syllable count = C (container), Rhyme = S.  
  - Step 2: Co > S > C. Sacrifice syllable count first.  
  - Step 3: Swap syllable count for stress count? Insufficient—Co (name) demands exact letters.  
  - Step 4: Break syllable count. Note: "English name spelling required shortening lines 3/7."  
  - Step 6: Ask poet: "Does shortening lines to preserve the acrostic undermine the poem’s tribute?"  
  - *Verdict:* Keep acrostic; break syllables. You’ll like it—Co is honored.  

  **Poem 2 (Missing Vowel Lipogram)**  
  - Step 1: Lipogram = E (absence *is* the conceit).  
  - Step 2: E > all.  
  - Step 3: Swap source vowel for English’s most common vowel? No—function is linguistic absence, not specific letter.  
  - Step 4: Bend syntax to preserve E. Note: "Unnatural word order retains the missing vowel."  
  - Step 7: "Sings" only if tension reflects theme.  
  - *Verdict:* Keep lipogram. You’ll approve—but it’ll groan.  

  **Poem 3 (Alphabetical Words + Syllables)**  
  - Step 1: Alphabetical order = E (poet’s statement), Syllables = C.  
  - Step 2: E > C.  
  - Step 5: Literal + note trigger: Alphabetical order in English butchers meaning. Syllable count impossible without distorting words.  
  - Action: Literal translation + note: "Each line’s words are alphabetized in original (e.g., Line 1: *bajo, cielo, grito* → *a, b, c*) and strictly 11 syllables."  
  - *Verdict:* Abandon verse. You’ll hate it—but E is documented.  

  ---

  ### Where It Hands Off  
  **To you:** Step 7 ("sing" test), Step 1 labeling (if ambiguous), Step 3 swaps (legitimacy check).  
  **To poet:** Only after Step 6: **"Does [specific change] undermine the core concept or key meaning?"** Never ask "Is this okay?" Example for Poem 1: "Is shortening lines to fit 'Claire' an unacceptable distortion of the elegy?" Submit 2 versions if possible.  

  ---

  ### What It Can’t Do  
  1. **Resolve ambiguous constraint functions** without external evidence (reviews/author statements).  
  2. **Preserve deeply language-specific constraints** (e.g., gendered rhymes) without heavy compensation.  
  3. **Eliminate judgment** in ranking (Step 2) and "sing" tests (Step 7).  
  4. **Handle "constraint cascades"** where breaking one collapses multiple others.  
  5. **Replace cultural knowledge** (e.g., why a name’s acrostic matters).  

  ---  
  No principles. No hedging. Run it Tuesday afternoon.
