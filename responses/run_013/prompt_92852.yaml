     Good: (1-f) + f * b
     Bad:  (1-f) + f * a

  Therefore, the growth rate is:
     G(f) = p * log(1 + f*(b-1)) + (1-p)*log(1 + f*(a-1))

  We maximize G(f) with respect to f. The derivative is:
     G'(f) = p * (b-1) / (1 + f*(b-1)) + (1-p) * (a-1) / (1 + f*(a-1))

  Set to zero and solve for f? Actually, we can use the known formula for two outcomes:

     f* = max(0, min(1, [ p/(1-a) - (1-p)/(b-1) ] / [ (b-1)/(1-a) - (a-1)/(1-a) ] ))   ??? 

  Alternatively, we can use a more direct formula that I recall: 
     f* = [p*(b) + (1-p)*a - 1] / [ (b-1)*(1-a) ]   ... but I'm not sure.

  Actually, let me derive it:

  We have:
     G'(f) = p*(b-1)/(1+f*(b-1)) + (1-p)*(a-1)/(1+f*(a-1)) = 0

  But note: we require that the expected return is positive for f=0 to be suboptimal. The condition for a positive bet is that the derivative at 0 is positive:
     G'(0) = p*(b-1) + (1-p)*(a-1) > 0   => p*b + (1-p)*a > 1

  Now, to find f* we set:
     p*(b-1)/(1+f*(b-1)) = - (1-p)*(a-1)/(1+f*(a-1))

  But note that (a-1) is negative. Rearranging, we can use:

     p*(b-1) * [1+f*(a-1)] = - (1-p)*(a-1) * [1+f*(b-1)]

