        W = 100000 * (return in year1) * (return in year2) * ... * (return in year20)
     Each return is either 1.5 (with prob 0.6) or 0.5 (with prob 0.4).

     The expected log wealth per year is -0.03394 (as above). So after 20 years, the expected log wealth is 20 * (-0.03394) = -0.6788, so the median wealth would be around 100000 * exp(-0.6788) ≈ 100000 * 0.507 ≈ $50,700.

     But note: the expected wealth (the arithmetic mean) would be:
          E[W] = 100000 * (1.1)^20  ≈ 100000 * 6.7275 = $672,750.

     However, the median is much lower because the distribution is skewed: a few very high outcomes (if she gets many good years) and many low outcomes. The log-normal distribution tells us that most of the time she ends up with less than the expected value, and in fact, the median is the exponential of the expected log wealth.

     So even though the expected value is high, the typical outcome (median) is low. The Kelly rule is concerned with the typical outcome in the long run (and avoiding ruin). 

     In this repeated Version 2, if she bets 100% every time, she has a 40% chance each year of losing half her money. The chance of having at least one bad year in 20 years is 1 - (0.6)^20 ≈ 1 - 3.6e-4 = 0.9996. And one bad year would cut her wealth in half. So it's very likely she will have many bad years. The expected value is high because of the small chance of having an extremely high outcome (like 20 good years in a row, which has probability 0.6^20 ≈ 0.000036, and would yield 100000 * (1.5)^20 ≈ 100000 * 3325.26 = $332,526,000). But that's extremely unlikely. The median outcome (which is the outcome at the 50th percentile of the distribution) is only about $50,700.

     So the Kelly rule avoids this bet because it is too risky for long-term growth.

  What if we change the parameters? The key is the expected log return of the full bet. We set p=0.6, b=1.5, a=0.5 and got a negative expected log return. What if we change p to 0.7? Then:

