  We are going to construct a scenario that fits the requirements. We need two versions: one where the character can buy any fraction of the press (Version 1) and one where it's all or nothing (Version 2). We want the expected value (EV) rule and the Kelly criterion (which maximizes the long-term growth rate of capital) to agree in Version 1 but disagree in Version 2. Moreover, in the bad outcome of Version 2, she should not be wiped out.

  The setup:
  - Let the character have an initial capital of $100,000.
