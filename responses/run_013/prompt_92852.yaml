  - Good outcome (probability p): the press becomes worth `b` times the original investment (so if she invested $x, it becomes $b*x).
  - Bad outcome (probability 1-p): the press becomes worth `a` times the original investment (with `a` < 1, so it's a loss).

  We require that the expected value per dollar invested is positive. So:
     EV = p*b + (1-p)*a > 1

  But note: the Kelly criterion maximizes the expected logarithm of wealth. It recommends betting a fraction `f*` of your bankroll, where:
     f* = (p*b - (1-p)*a) / (b * a)   [This is a standard formula for a bet with two outcomes: win b times the stake with prob p, or lose a times the stake (i.e., get back a fraction a of the stake) with prob 1-p. However, note that in our case, if we invest $f*capital, then in the good outcome we get $b*(f*capital) and in the bad outcome we get $a*(f*capital).]

  But actually, the standard Kelly formula for a bet that pays `b`-to-1 (meaning if you bet $1, you get $b profit plus your $1 back) and win probability p, and loses your entire stake with probability 1-p, then the Kelly fraction is: 
     f* = (p*(b+1) - 1) / b
  However, in our scenario, we are not losing the entire stake in the bad outcome. We get back `a` (which is between 0 and 1) of the investment. Therefore, the return per dollar invested is:
     In good: you get $b (so net profit: b - 1 per dollar)
     In bad: you get $a (so net profit: a - 1 per dollar, which is negative)

  But note: the Kelly formula for two outcomes with payouts (if you bet $1: in good you get $b, in bad you get $a) is:
     f* = [p*(b) + (1-p)*a - 1] / [ (b-1) - (a-1) ]   ??? 

  Actually, the standard derivation for the Kelly criterion in this case is to maximize:
     p * log(1 + f*(b-1)) + (1-p)*log(1 + f*(a-1))
  But note: if we invest a fraction f, then in the good outcome we have:
     wealth = 1 - f + f * b   [because we have (1-f) in cash and the investment grows to f*b]
  Similarly, in the bad outcome:
     wealth = 1 - f + f * a

