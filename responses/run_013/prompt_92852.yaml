  So:

     f* = [ p*(b-1) - (1-p)*(1-a) ] / [ (b-1)*(1-a) ]

  But note: we can also write it as:

     f* = [ p/(1-a) - (1-p)/(b-1) ]   [because numerator: p*(b-1) - (1-p)*(1-a) = p*(b-1) - (1-p)*(1-a). Then divide by (b-1)*(1-a) we get: p/(1-a) - (1-p)/(b-1) ]

  So the formula is:

     f* = [ p/(1-a) ] - [ (1-p)/(b-1) ]

  But note: we must have f* between 0 and 1.

