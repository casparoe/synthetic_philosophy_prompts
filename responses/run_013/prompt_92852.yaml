  Now, let's explain:

  The expected value rule looks at the average outcome over many parallel universes. In Version 1, she can invest a fraction and the expected value per dollar is positive, so she should invest. In Version 2, the same positive expected value per dollar applies, so she should invest.

  The Kelly rule, however, is about the long-term growth of her wealth. It takes into account the compounding of returns over time. In Version 1, the Kelly fraction is 40%, meaning that if she invests 40% of her capital, the long-term growth rate of her wealth is maximized. Investing more than that (like 100%) would actually reduce the growth rate because of the risk of large losses.

  In Version 2, she is forced to invest 100% or nothing. The Kelly rule says that investing 100% leads to a negative expected log return, meaning that over the long run, her wealth would be expected to decrease (even though the expected money is positive). The reason is that the loss in the bad outcome (losing half) has a more severe impact on her wealth than the gain in the good outcome (gaining 50%) because of the logarithmic utility function (which models the diminishing marginal utility of money and the risk of ruin).

  The key feature that makes the Kelly rule say no in Version 2 is the combination of the large loss in the bad outcome and the fact that she is forced to bet her entire capital. Even though the expected money is positive, the volatility and the size of the loss in the bad outcome (which is 50% of her capital) are too severe when she bets everything.

