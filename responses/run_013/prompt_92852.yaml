  Specifically, we want that the expected log of investing 100% is less than the log of not investing (which is log(1)=0). Because if she doesn't invest, her wealth remains the same. So we require:

     G(1) = p * log(1 + 1*(b-1)) + (1-p)*log(1 + 1*(a-1)) = p*log(b) + (1-p)*log(a) < 0

  But note: log(a) is negative because a<1. So it's possible.

  Meanwhile, the EV rule: 
     EV for investing 100%: p*b + (1-p)*a
     If this is >1, then the expected money is more than the initial investment.

  So we require:
     p*b + (1-p)*a > 1   (so EV says invest)
     but p*log(b) + (1-p)*log(a) < 0   (so Kelly says don't invest 100% because it leads to a negative growth rate)

  But note: the Kelly rule for fractional investing might say to invest a fraction f* (which is positive and less than 1). But in Version 2, she cannot invest a fraction. So she has two choices: 0% or 100%. The Kelly criterion would then compare:
     Option 1: don't invest -> wealth=1 (in units of initial capital) -> log(1)=0.
     Option 2: invest 100% -> expected log wealth = p*log(b) + (1-p)*log(a).

  We want Option 1 to be better than Option 2 by the log criterion.

  So we require:
     p*log(b) + (1-p)*log(a) < 0.

  But also, we require that in Version 1, the Kelly fraction f* is positive and less than 1, and that investing f* is better than not investing.

  Moreover, we don't want the bad outcome to be a complete wipeout: so a>0.

  Let me choose specific numbers. We'll set:

     p = 0.6   (probability of good outcome)
     b = 1.5   (in the good outcome, the press becomes worth 1.5 times the amount invested)
     a = 0.5   (in the bad outcome, the press becomes worth 0.5 times the amount invested)

  Check EV per dollar invested:
     EV = 0.6*1.5 + 0.4*0.5 = 0.9 + 0.2 = 1.1 > 1 -> positive.

  Now, Kelly fraction for Version 1 (fractional investment):
     f* = [ p/(1-a) ] - [ (1-p)/(b-1) ] 
         = [0.6/(1-0.5)] - [0.4/(1.5-1)]
         = [0.6/0.5] - [0.4/0.5]
         = 1.2 - 0.8 = 0.4

  So she should invest 40% of her capital. 

  In Version 1, both rules agree: 
     EV rule: since EV>1, she should invest at least some (and the more the better in terms of expected money, but the Kelly rule tells her to invest 40% to maximize growth).

  Now, in Version 2 (all or nothing): 
     She must invest 100% or 0%.

     EV rule: 
        If she invests 100%: expected value = 1.1 (in units of initial capital) -> so she gains 10% on average.
        If she doesn't invest: expected value = 1.
        So EV rule says invest.

     Kelly rule: 
        We compute the expected log wealth for investing 100%:
           G = 0.6 * log(1.5) + 0.4 * log(0.5)
        Calculate:
           log(1.5) ≈ 0.4055
           log(0.5) ≈ -0.6931
           G = 0.6*0.4055 + 0.4*(-0.6931) = 0.2433 - 0.27724 = -0.03394 < 0

        Since the expected log wealth is negative, it is worse than not investing (which gives log(1)=0). Therefore, the Kelly rule says do not invest.

  Thus, in Version 1: both say invest (with Kelly specifying 40%).
  In Version 2: EV says invest, Kelly says don't.

  Moreover, in the bad outcome of Version 2: she invests 100% and gets a return of 0.5, so she ends up with $50,000 (half her capital) — not a wipeout.

