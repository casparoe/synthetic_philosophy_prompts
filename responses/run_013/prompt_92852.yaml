  Note that (1-a) is positive. Rearranging terms with f:

     p*(b-1)*f*(a-1) - (1-p)*(1-a)*f*(b-1) = (1-p)*(1-a) - p*(b-1)

  Factor f:

     f * [ p*(b-1)*(a-1) - (1-p)*(1-a)*(b-1) ] = (1-p)*(1-a) - p*(b-1)

  Notice that (a-1) = - (1-a) so:

     f * [ p*(b-1)*(-(1-a)) - (1-p)*(1-a)*(b-1) ] = (1-p)*(1-a) - p*(b-1)

     => f * (b-1)*(1-a) * [ -p - (1-p) ] = (1-p)*(1-a) - p*(b-1)

