  Give an example of a situation in which a demandingness objection to consequentialism has force even though the sacrifice the theory requires of the agent is trivial, so that the objection turns not on the cost of compliance but on whether the agent's own projects carry any deliberative authority of their own. Explain what your example shows about whether an objection of that shape can be answered by making the theory less demanding.
