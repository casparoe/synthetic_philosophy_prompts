answer: |-
  Here’s an example illustrating a demandingness objection focused on **deliberative authority** rather than cost, and why "softening" consequentialism fails to resolve it:

  **The Case of the Artist's Ritual:**  
  Elena is a painter preparing for a pivotal exhibition. Her creative process hinges on a highly personal daily ritual: each morning, she spends 15 minutes silently drinking tea in her studio, mentally immersing herself in her work. This ritual costs nothing, harms no one, and is crucial for her focus. One morning, as she begins her ritual, a neighbor knocks urgently. His cat is stuck in a tree across the street, and he needs Elena’s help to hold the ladder for 15 seconds while he climbs to retrieve it. The neighbor is mildly distressed, but the cat is in no real danger (it’s a low branch). Helping would disrupt Elena’s ritual but cause no tangible harm to her project—she could resume tea afterward, likely without losing focus.  

  **Consequentialist Demand:**  
  Classical consequentialism (e.g., utilitarianism) requires Elena to help. The trivial sacrifice (15 seconds of delay) generates *some* net positive utility by alleviating the neighbor’s anxiety, with no significant cost to Elena or her art. Failing to help seems unjustifiably selfish.  

  **The Objection (Beyond Cost):**  
  Even though compliance is virtually costless, the objection arises: **Why must Elena justify retaining her ritual by proving its consequences outweigh helping?** Her ritual is part of a deeply personal project (her art) that *she* values intrinsically. Consequentialism demands she treat this commitment as having no inherent deliberative weight—it only matters if abandoning it would cause harm (e.g., ruining her focus) or if it indirectly maximizes utility. The theory subordinates her autonomy to an impersonal calculus, denying her projects "default authority" in her deliberation.  

  **What This Shows:**  
  1. **The Core Issue is Authority, Not Demand:**  
     The objection targets consequentialism’s **structure of deliberation**. Elena must act as a neutral utility-calculator, not as an agent whose personal projects have intrinsic rational force. Even trivial demands expose this by forcing her to subordinate her commitments to marginal gains for others.  

  2. **Why "Less Demanding" Consequentialism Fails:**  
     Suppose we modify consequentialism to allow "agent-centered prerogatives" (à la Scheffler), letting agents favor their own projects *somewhat*. For example:  
     *"Agents may give their own projects X times more weight than others' interests."*  
     **This doesn’t solve the problem:**  
     - **Prerogatives still require justification by consequences.** Elena must now calculate whether her ritual has "X times" the value of alleviating the neighbor’s worry. Her project still lacks inherent authority—it only matters instrumentally.  
     - **The deliberative stance remains impersonal.** She isn’t permitted to say, "This ritual is *mine*, so it comes first." She must justify its priority through a cost-benefit analysis skewed in her favor.  
     - **Trivial demands exploit the gap.** If helping took *zero* seconds (e.g., shouting advice from the window), consequentialism (even moderate) would *still* demand it. But Elena might reasonably resent this: her ritual’s meaning isn’t reducible to seconds saved or utility points.  

  **Conclusion:**  
  This example shows that demandingness objections can target consequentialism’s **fundamental refusal to recognize personal projects as sources of non-derivative reasons**. Softening the theory’s demands (e.g., allowing minor selfishness) treats the symptom (cost) but not the cause (deliberative subordination). Unless the theory grants agents genuine authority to prioritize their own projects *without* consequence-based justification—something antithetical to its impartial framework—the objection stands. The problem isn’t *how much* consequentialism demands, but **how it justifies demanding anything at all** from personal commitments.
