prompt: |-
  So my friend Rosa is the unofficial tie-breaker for a design co-op we're both in — like 40 people, mostly small hardware and app projects — and when two members fight over who owns a thing, she rules on it. She's not a lawyer, she's just been doing it for years and everyone treats her calls as final. Her track record, as best I can reconstruct it:

  - Ana floated "a subscription box for local bakeries" in the group chat, said nothing else about it, never touched it again. Ben built the whole thing over a year and launched it. Rosa said it's Ben's.
  - Cleo paid Dev to draw a logo, and Cleo's brief was so specific — exact mark, exact palette, exact type — that Dev basically had no choices left. Rosa said Cleo owns it.
  - Two members completely independantly designed almost identical planters within a month of each other, neither had seen the other's. Rosa said neither owes the other anything, both can keep selling.
  - Efua took someone else's public design and added a latch that made it actually work. Rosa said Efua owns the latch, the original designer keeps the base, nobody owes anybody.
  - Gus posted a full mechanism spec on the public forum with "do whatever you want with this." Hana built it and started selling. Rosa said Gus has no claim.
  - Lena tossed in a fix during a weekend jam that the whole thing depended on; Moe, who ran the jam, later listed himself as sole creator. Rosa made him add her.

  New one, and she rules next week: Priya has been talking with Quinn for months about a thing Priya wants to exist. Priya can't build at all, but she described the mechanic, the look, even the name, in a lot of detail, and Quinn built it, mostly on her own time. No money changed hands, nobody said anything about who owns what. It's taking off and there's real money now. Priya says she's owed half.

  I want your prediction of Rosa's call, the candidate rules that fit her six earlier rulings (I bet there's more than one), what each one predicts here, which one she's really running and why you'd bet on it, the closest of her earlier cases, and the one more case that would settle which rule she's on. If her precedents genuinely underdetermine this, say so and tell me what principle she'd be adopting either way.

  Format: one line with the call, then a table sorted best-fit rule first, with these columns: rule (one sentence) | which earlier rulings it explains | what it predicts for Priya vs Quinn | how well it fits her overall pattern (high/med/low) | the case that would kill it. Then three or four sentences on why you picked the rule you picked.
reasoning: |-
  Okay, let me start by understanding the user's query. They want me to predict Rosa's decision in a new case between Priya and Quinn based on her past rulings. The user provided six precedent cases, and now there's a dispute where Priya came up with an idea and detailed description, Quinn built it, and now Priya wants half ownership and profits.

  First, I need to analyze each of Rosa's past decisions to identify underlying principles. Let's go through them one by one:

  1. Ana vs Ben: Ana floated an idea in a group chat but did nothing else. Ben built and launched it. Rosa awarded it to Ben. This suggests that execution matters more than just having the idea.

  2. Cleo vs Dev: Cleo provided a very specific brief for a logo, leaving Dev no creative freedom. Rosa said Cleo owns it. Here, the person who defined the specifics gets ownership, even if someone else executed it.

  3. Identical planters: Both members independently created similar designs. Rosa allowed both to keep selling. This indicates that independent creation is valid, and ownership isn't infringed if there's no copying.

  4. Efua's latch: Efua modified an existing public design with a functional latch. Rosa split ownership—Efua owns the latch, the original designer keeps the base. This shows that contributions are recognized separately, and modifications don't override the original if they're additive.

  5. Gus's public spec: Gus shared a mechanism with permission to use freely. Hana built and sold it, and Gus had no claim. Reinforces that if something is given without restrictions, the builder owns the resulting product.

  6. Lena's fix: Lena contributed a critical fix during a jam, but Moe listed himself as sole creator. Rosa made him add her. Highlights that significant contributions, even if small, warrant recognition and shared ownership.

  Looking at these cases, Rosa's decisions seem to hinge on factors like who contributed what, the level of specificity in the idea, execution, and agreements (or lack thereof). There isn't one single rule but a combination of principles: execution over ideas, specificity leading to ownership, independent creation, recognition of contributions, and the importance of prior agreements.

  Now, for Priya and Quinn: Priya provided detailed ideas (mechanic, look, name) but couldn't build. Quinn built it mostly alone. No money exchanged, no prior agreement. Priya wants half. How would Rosa rule?

  Considering the precedents:

  - Ana vs Ben: Idea without execution lost to the builder. This suggests Quinn might own it since she built it.
  - Cleo vs Dev: Detailed specs led to Cleo owning the logo. Priya's detailed descriptions might give her a claim.
  - Lena's fix: Critical contribution warranted shared ownership. If Priya's input was essential, she might have a claim.

  The key here is whether Priya's detailed input is like Cleo's specs or just an idea like Ana's. Also, in Lena's case, direct contribution during a collaborative event mattered. Priya's involvement was more conceptual over months, not during the build. No prior agreement or payment complicates it.

  Possible rules from precedents:
  1. Execution over conception: Builder owns it unless there's a prior agreement or the idea was highly specific. Explains Ana/Ben, Gus/Hana. Predicts Quinn owns it entirely.
  2. Specific conception as co-creation: If the idea is detailed enough, the conceiver is a co-creator. Explains Cleo/Dev, Lena/Moe. Predicts shared ownership here.
  3. Material contribution: Ownership based on tangible input. Explains Efua's latch, Lena/Moe. Predicts Quinn owns it since Priya didn't build.

  Rule 2 (specific conception) fits Cleo/Dev and Lena/Moe. However, Lena actively contributed during the jam, whereas Priya only described ideas. Cleo paid Dev, which is different. Rule 1 (execution) fits Ana/Ben and Gus/Hana. Efua's case shows additive contributions are recognized, but Priya's input wasn't additive in the same way.

  The closest case is Cleo/Dev, but there, payment was involved, and the work was commissioned. Here, no payment, and Quinn built it on her own time. Ana/Ben is closer: an idea floated without execution. However, Priya's detailed involvement might make it different.

  A decisive case to clarify would be if someone provides detailed specs without commissioning or payment, and another person builds it. Based on Rosa's history, she might lean toward the builder unless there's explicit agreement or payment. In Cleo's case, payment signified ownership, but here there's none. So Rosa might rule for Quinn, perhaps with credit but not ownership.
answer: |-
  **Call:** Quinn owns the thing; Priya gets credit but no ownership or share of profits.

  | Rule (one sentence)                                                                 | Which earlier rulings it explains                                | Predicts for Priya vs Quinn                          | Fit (high/med/low) | Case that would kill it                               |
  | :---------------------------------------------------------------------------------- | :--------------------------------------------------------------- | :--------------------------------------------------- | :----------------- | :---------------------------------------------------- |
  | **Ownership requires material creation or explicit agreement; ideas alone don't count.** | Ana/Ben (idea floated ≠ ownership), Gus/Hana (public spec = no claim) | Quinn owns it (built it), Priya gets nothing (just idea/details) | High               | Paying for a detailed spec without building it.       |
  | **Significant functional/creative contribution = partial ownership, regardless of who built.** | Lena/Moe (critical fix = co-credit), Efua (added latch = owns latch) | Shared ownership (Priya's detailed specs = key contribution) | Med                | Detailed idea paid for but not used (like Cleo unused). |
  | **Specific, paid-for direction = ownership, even if executed by another.**          | Cleo/Dev (specific brief/paid = Cleo owns)                       | Shared ownership (Priya's detail ≈ Cleo's brief, but no $) | Low                | Unpaid, vague idea built by another (like Ana/Ben).   |
  | **Independent creation always valid; similar outcomes ≠ infringement.**             | Planters (independent = no claim)                                | Neither owes anything (but doesn't fit collaboration) | Low                | Direct copying of a private, in-progress design.      |

  **Why the chosen rule fits best:**  
  Rosa consistently prioritizes tangible execution or formal agreements over abstract conception (Ana/Ben, Gus/Hana). Priya’s detailed input lacks the *payment* that solidified Cleo’s ownership or the *direct, functional contribution* that earned Lena/Efua shares. Her role resembles Ana’s (idea originator) more than Cleo’s (paying director) or Lena’s (critical contributor), and without money or a prior agreement, Quinn’s build effort dominates. The closest precedent is **Ana vs. Ben** (idea floated ≠ ownership), but Priya’s depth pushes toward **Lena vs. Moe**—yet Lena’s fix was a concrete build-step, not pre-build design. A decisive test case would be: *"If someone paid for a detailed spec but didn’t build it, does the payer own it?"* Rosa’s pattern suggests **no** (aligning with Ana/Ben’s "no build, no claim"), but Cleo/Dev’s payment element creates ambiguity, making this the critical gap.
