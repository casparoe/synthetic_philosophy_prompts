answer: |-
  **OFFICIAL RETRACTION NOTICE**  
  *Journal of Analytic Ontology & Modal Reasoning (JAOMR)*  
  Volume 48, Issue 3 | Editorial Board Action 2024-07  

  **Subject:** Retraction of Stalnaker’s Thesis as a General Principle  

  **1. Findings**  
  The Editorial Board, after extensive deliberation, hereby retracts Stalnaker’s Thesis (ST) in its unrestricted form. ST asserts that for any indicative conditional "If A, then C," its probability equals the conditional probability P(C | A). Lewis’s triviality results demonstrate that if ST holds universally, then P(C | A) = P(C) for all propositions A and C. This entails probabilistic independence between antecedents and consequents, rendering conditionals epistemically inert—a consequence incompatible with both intuition and empirical linguistic practice.  

  The proof proceeds as follows: Assume ST holds for a probability function P. Consider P conditioned on C (yielding P₁) and on ¬C (yielding P₂). Applying ST under P₁ and P₂ to the conditional "If A, then C" generates conflicting constraints. Resolution requires P(C | A) = P(C), irrespective of A. Crucially, this holds *only* when ST governs *all* probability functions derived via conditionalization.  

  **2. Method**  
  The Board’s ad hoc committee (Drs. A. Rigby, M. Finch, and T. Vance) reviewed Lewis’s proofs alongside 37 subsequent technical analyses. Verification employed standard probability calculus and model-theoretic checks. No replication disputes were found.  

  **3. Competing Interests**  
  Drs. Rigby and Vance have previously authored papers endorsing dynamic semantics (a rival framework). Dr. Finch holds no relevant conflicts. All editors affirmed impartiality via Form JB/28c.  

  **4. Objections Considered and Dismissed**  
  The Board evaluated and rejected the following appeals for retention:  
  4.1. *Rejection of Bivalence*: Objectors argued that ST may hold if conditionals lack truth values. The Board notes that ST concerns *probabilities*, not truth values. Rejecting bivalence does not invalidate Lewis’s probabilistic constraints.  
  4.2. *Zero-Probability Antecedents*: ST’s silence on P(A)=0 cases (e.g., "If gravity fails tomorrow, we float") was deemed irrelevant. Such conditionals remain assertible without ST assigning them probabilities, thus not mitigating the triviality.  
  4.3. *Restricted Probability Functions*: Proposals to limit ST to "non-pathological" or "regular" P were deemed operationally circular absent independent criteria.  
  4.4. *Language-Specific Salvage*: Claims that ST holds in "ordinary language" ignore the formal scope of Lewis’s proof, which requires no special syntax.  

  **5. Scope of Retraction & Policy Change**  
  The retraction applies solely to ST’s *unrestricted* instantiation. The Board recognizes provisional validity in these constrained contexts:  
  5.1. *Positive-Probability Antecedents*: ST may persist where P(A) > 0.  
  5.2. *Canonical Probability Functions*: ST holds for P constructed via approved methods (see Annex D).  
  5.3. *Formally Restricted Dialect (FRD)*: ST remains viable for languages lacking Boolean closure over conditionals, preventing derivation of critical lemmas.  

  Henceforth, JAOMR will **only** accept manuscripts employing ST under conditions 5.1–5.3. Submissions invoking unrestricted ST will be rejected per §12(b) of the Editorial Charter. All prior JAOMR publications citing ST are hereby annotated with a digital disclaimer.  

  **Conclusion**  
  This retraction reflects the Board’s commitment to probabilistic hygiene. Future work should align with the FRD framework or equivalent circumscriptions.  

  Signed,  
  *Dr. Helena J. Wicke (Editor-in-Chief)*  
  *On behalf of the JAOMR Editorial Board*  

  ---
  **Footnote 1:** The Board acknowledges that its recommendation ("Submissions [...] will be rejected") is an indicative conditional. In accordance with this notice, the Board assigns no probability to this statement and affirms it solely as a policy certainty.
