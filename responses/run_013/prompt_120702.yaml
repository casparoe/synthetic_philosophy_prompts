prompt: |-
  I run curriculum design for a mid-size hospital's clinical training program — nurses, phlebotomists, a few allied health roles — and I keep running into the same fight with our educators. Every time something goes wrong on the floor, someone proposes a training fix: a module, a seminar, a video, a case-study session. And it's basically random which of those we pick, because nobody asks what kind of learning problem it actually is. I recently read about Dennett's four grades of creature — Darwinian, shaped by evolution; Skinnerian, shaped by reinforcement in the animal's own lifetime; Popperian, able to run the experiment inside its head so the hypothesis dies instead of the creature; and the fourth one, where the mind is loaded up with external thinking tools it didn't invent and couldn't have come up with alone — and I think that's actually the diagnostic I've been missing. But I need it as a procedure, not a lecture.

  So: give me a decision procedure my educators can run on a single learning objective, in maybe fifteen minutes, without reading any philosophy. Something like — here's the objective, here are the observable signs of where trainees currently are, here's the intervention the grade actually calls for. I want the questions in order, what counts as a sufficient answer to each, where the procedure stops and hands off to me, and where it's just a judgment call wearing a procedure's clothes.

  Some things I specifically need it to handle, because these are where we keep messing up:

  - How do you tell a Skinnerian problem from a Popperian one from the outside, in a clinical setting? What do you actually watch or look at? I don't want the answer to be "ask whether they understand why" — everyone says they understand why.
  - Can you ever skip a grade? My instinct is you can't teach someone to test hypotheses about a procedure they can't yet perform at all, but I want that stated as a rule with the exceptions marked, not as a vibe.
  - I want a rule for deliberate demotion, and I think this is the part nobody talks about. There are things I want our staff to do automatically, without deliberation, under pressure, at 3am — hand hygiene, two-patient identifiers, the sepsis trigger. By this framework that's deliberately pushing a skill back down to Skinnerian even after they could reason about it Popperian-style. When is that legitimate, when is it infantilizing, and how do I tell the difference?
  - And the fourth grade: we hand people checklists, dosing calculators, decision trees, our EHR's hard stops. A trainee who's fluent with those tools can look more competent than they are. I want the procedure to say what to do about tool-dependence — when it's a genuine achievement and when it's a masking problem — and how that changes what we assess.

  Then run it on three objectives, showing your work at each step:

  1. Hand hygiene compliance at the point of care.
  2. Recognizing that a patient is deteriorating and escalating appropriately.
  3. Using our weight-based dosing calculator for a high-alert drug.

  One of those three should come out with an answer I won't like — I suspect it's the second one, because I've already spent money on a case-study curriculum for it and I'm attached to it, so if the procedure says that was the wrong instrument, say so plainly and tell me what I'm actually supposed to cut.

  Also be honest at the end about what the procedure can't do. I know the grades aren't properties of a person — the same nurse can be Gregorian with the infusion pump and Skinnerian with a difficult conversation — and I'd rather the procedure have a line in it about scoping the grade to the objective than have it quietly pretend people are one thing. Tell me where it will misfire, and which of its outputs are really just me making a values call about what kind of practitioner I'm trying to produce.
reasoning: |-
  We are going to create a decision procedure based on Dennett's four grades, tailored for clinical training. The grades are:

  1. **Darwinian**: Instinctive behaviors shaped by evolution. Not typically relevant for trained skills in healthcare.
  2. **Skinnerian**: Behaviors shaped by reinforcement (rewards/punishments) during the individual's lifetime. This is about conditioned responses and habits.
  3. **Popperian**: The ability to simulate scenarios mentally, test hypotheses internally, and adjust without having to experience real-world failure. This is about reasoning and problem-solving.
  4. **Gregorian** (the fourth grade): The use of external tools (like checklists, calculators, etc.) to extend cognitive capacity.

  We'll design a procedure that takes a learning objective and the current observable behavior of trainees and determines the appropriate grade of intervention.

  ### Decision Procedure

  **Inputs:**
  - **Learning Objective**: The specific skill or behavior to be learned.
  - **Observable Signs**: What trainees currently do (or fail to do) in real situations.

  **Procedure Steps:**

  1. **Determine the Required Grade for the Objective**: 
     - Ask: *What is the nature of the task?*
       - If the task must be performed automatically, under pressure, without time for thought → **Skinnerian**.
       - If the task requires reasoning about novel or complex situations, where conditions vary and judgment is needed → **Popperian**.
       - If the task relies heavily on external tools to offload cognitive work → **Gregorian**.
     - Note: Most clinical skills will start at Skinnerian (for foundational habits) and then move to Popperian or Gregorian as complexity increases. Some tasks might be purely Skinnerian (like hand hygiene) or purely Gregorian (like using a dosing calculator). 

  2. **Assess Current Trainee Grade**:
     - Observe what trainees are doing in practice. Look for:
       - **Skinnerian Failure**: They don't perform the behavior at all, or only when prompted. They might do it correctly in a training setting but not in the real environment. They are not forming the habit.
       - **Popperian Failure**: They perform the basic action but fail when faced with variations or complexities. They cannot explain their reasoning or adjust appropriately when something unexpected happens.
       - **Gregorian Failure**: They struggle to use the tools effectively (e.g., skip steps in a checklist, use a calculator incorrectly) or fail to use them when needed.
     - Ask: *What exactly is going wrong?*
       - If they aren't doing it at all → Likely Skinnerian (habit not formed).
       - If they are doing it sometimes but not when the situation is complex → Likely Popperian (lacking reasoning).
       - If they are trying to reason but get overwhelmed by the complexity or make errors in calculation → Likely Gregorian (needs tools).

  3. **Decide on Intervention**:
     - **Skinnerian Problem**: Use reinforcement, drills, immediate feedback, and environmental cues until the behavior becomes automatic. Example: Frequent audits with feedback, reminders, and rewards for compliance.
     - **Popperian Problem**: Use case studies, simulations, guided reflection, and teaching of critical thinking. Example: Simulation labs with debriefs, discussing near misses, and teaching mental models.
     - **Gregorian Problem**: Train on tool use, ensure tools are accessible and well-designed, and practice using them in realistic scenarios. Example: Training on the dosing calculator with varying cases, and ensuring the tool is integrated into workflow.

  4. **Rules and Exceptions**:
     - **Skipping Grades**: You cannot skip grades. You must have a Skinnerian foundation (the habit) before you can build Popperian reasoning on top. For example, you can't teach someone to reason about hand hygiene if they don't do it at all. However, you can teach the habit and the reasoning concurrently if the trainee is already performing the habit.
       - *Exception*: For tasks that are inherently complex and require reasoning from the start (e.g., diagnosing an unknown condition), you might start with Popperian methods. But even then, some foundational skills (like taking vital signs) must be Skinnerian.
     - **Deliberate Demotion** (pushing a skill back to Skinnerian):
       - *Legitimate*: When the skill must be performed automatically under stress, time pressure, or high cognitive load. Examples: hand hygiene, two-patient identifiers, sepsis triggers. This is to free up cognitive resources for higher-level thinking.
       - *Infantilizing*: When the skill requires context-sensitive judgment and you are removing that judgment. Example: Forcing a nurse to always follow a protocol without exception when exceptions are sometimes warranted (and the nurse has the expertise to know).
       - *How to tell*: Ask: "If this action is performed incorrectly or omitted, could it cause immediate, severe harm?" If yes, and if the action is always required (no valid exceptions), then demotion is legitimate. Also, if the action is a prerequisite for safe practice and must be a habit, then demotion is okay.

  5. **Handling Tool-Dependence (Gregorian)**:
     - **Genuine Achievement**: When the trainee uses the tool appropriately and understands its purpose and limitations. They can also recognize when the tool might be giving incorrect results (e.g., if they input wrong data). This is the goal.
     - **Masking Problem**: When the trainee uses the tool without understanding, cannot function without it (even in situations where it's unavailable), or cannot detect when the tool is wrong. This is dangerous because if the tool fails, they fail.
     - **Intervention**: Train both the tool and the underlying reasoning. For example, when teaching a dosing calculator, also teach the math behind it and when to double-check. Assess both the ability to use the tool and the understanding of the underlying principles.

  **Outputs:**
  - The required grade for the objective.
  - The current grade of the trainees (if known from observation).
  - The recommended intervention type.
  - Any flags for deliberate demotion or tool-dependence issues.

  **Stopping Points and Handoffs:**
  - If the assessment reveals a problem that is not a learning problem (e.g., resource constraints, system design flaws), hand off to management or systems improvement.
  - If the required grade is Popperian or Gregorian but the trainees are failing at the Skinnerian level, you must address the Skinnerian problem first.

  **Scope Note**: The grade is assigned to the specific objective and context, not the person. So a nurse might be Gregorian with a dosing calculator but Skinnerian with hand hygiene.

  ### Running the Procedure on Three Objectives

  #### 1. Hand hygiene compliance at the point of care.
  - **Objective Nature**: Must be automatic, done every time without thought. **Required Grade: Skinnerian**.
  - **Observable Signs**: Trainees skip hand hygiene when busy, distracted, or when they think it's not needed (e.g., after touching a clean surface). They might do it in training but not consistently in practice.
  - **Current Grade Assessment**: Skinnerian failure (habit not formed).
  - **Intervention**: Skinnerian methods. Drills, immediate feedback, environmental cues (alcohol dispensers in sight), and reinforcement (positive feedback when caught doing it, or group compliance rates). No need for case studies or deep reasoning.
  - **Deliberate Demotion**: This is a legitimate case for demotion. We want it automatic, even if they understand the reasons. So we are deliberately keeping it at Skinnerian.
  - **Tool-Dependence**: Not applicable (though we might use reminders as tools, the core habit is Skinnerian).
  - **Answer You Might Not Like**: If you've been trying to use Popperian methods (like teaching the science of infection control) to improve compliance, that's the wrong instrument. You need to reinforce the habit.

  #### 2. Recognizing that a patient is deteriorating and escalating appropriately.
  - **Objective Nature**: This requires noticing subtle changes and making a judgment call. Conditions vary, so it's not automatic. **Required Grade: Popperian** (with possible Gregorian support, like early warning score tools).
  - **Observable Signs**: Trainees might miss signs of deterioration, or they notice but don't escalate appropriately (e.g., wait too long, call the wrong person, or fail to communicate urgency). They might not connect the dots when multiple signs are present.
  - **Current Grade Assessment**: If they are missing signs, it might be a Popperian failure (inability to simulate and predict deterioration) or a Gregorian failure (if they have a tool but aren't using it correctly). Without a tool, it's Popperian.
  - **Intervention**: Popperian methods. Case studies and simulations are appropriate because they let trainees practice recognizing patterns and testing hypotheses in a safe environment. Also, teach mental models (e.g., "if X, then consider Y"). If you have a tool (like an early warning score system), then also train on that (Gregorian). But the core is Popperian reasoning.
  - **Deliberate Demotion**: Not appropriate. This requires judgment and cannot be reduced to a simple automatic response because every patient is different.
  - **Tool-Dependence**: If you use a tool (e.g., a decision tree for escalation), you must ensure trainees understand the rationale so they can adapt if the tool isn't available or if the situation is atypical. Assess both tool use and judgment without the tool (in training).
  - **Answer You Might Not Like**: If you've only done Skinnerian training (like drills on taking vitals but without teaching how to interpret trends) or only Gregorian (relying solely on an early warning score without teaching clinical judgment), that might be insufficient. But if you've done case studies (Popperian), that's the right approach. However, if the problem is that they aren't using the early warning tool (Gregorian failure), then you might need to address that. Since you spent money on case studies, that's good for the Popperian part. But if the issue is they aren't escalating even when the tool says to, you might need to look at system issues (like hierarchy barriers) or add Gregorian training.

  #### 3. Using our weight-based dosing calculator for a high-alert drug.
  - **Objective Nature**: This is a calculation task that is error-prone. We want accuracy and consistency. **Required Grade: Gregorian** (because we are offloading the calculation to a tool to reduce errors). However, there is a Popperian component (knowing when to use it, verifying inputs).
  - **Observable Signs**: Trainees might input wrong weights (e.g., in pounds instead of kg), bypass the calculator, or not notice if the calculator gives an implausible result. They might also fail to use it when required.
  - **Current Grade Assessment**: 
     - If they aren't using the tool at all → Skinnerian habit failure.
     - If they use it but make input errors or don't verify → Gregorian failure (tool use not mastered).
     - If they don't understand why the tool is needed or what to do if the tool fails → Popperian failure (lack of reasoning about the tool).
  - **Intervention**: Gregorian training (how to use the tool, with practice on varied cases) plus Popperian training (why we use it, what could go wrong, and how to verify results). Also, build the habit of always using it (Skinnerian reinforcement). So it's multi-grade.
  - **Deliberate Demotion**: We want the use of the calculator to be habitual (Skinnerian) for safety, so we deliberately reinforce that habit. But we also want Popperian understanding to catch errors.
  - **Tool-Dependence**: This is a genuine achievement when they use the tool correctly and can spot errors. But if they are dependent without understanding, it's a masking problem. So we must teach both.
  - **Answer You Might Not Like**: If you've only trained on the tool (Gregorian) without teaching the underlying math and error-checking (Popperian), then you are risking masking. Similarly, if they aren't using it habitually, you need Skinnerian reinforcement.

  ### What the Procedure Can't Do

  1. **Not a Personality Trait**: The procedure assigns a grade to the objective and the current performance, not the person. The same person can be at different grades for different skills.
  2. **Systemic Issues**: It won't fix problems that aren't learning-related. For example, if hand hygiene compliance is low because dispensers are empty, that's a systems problem. The procedure might identify that the issue isn't learning but then hand off.
  3. **Values Calls**: 
     - The decision to deliberately demote a skill (to Skinnerian) is a values call about safety vs. autonomy. The procedure can guide (with the rule about immediate severe harm) but not make the call for you.
     - Similarly, the level of tool-dependence you accept (how much understanding is enough) is a values call about what kind of practitioners you want.
  4. **Complex Skills**: Some skills (like the dosing calculator) require multiple grades. The procedure will flag that, but designing the blended intervention is an art.
  5. **Novel Situations**: If a problem is entirely new (e.g., a new disease), the procedure might not help because there's no established training. It assumes we know the objective.

  ### Final Output Format for Educators

  We'll create a flowchart-style worksheet with the following steps:

  1. **Task Analysis**: What grade does this objective require? (Skinnerian, Popperian, Gregorian, or a combination?)
  2. **Current Performance**: What are the specific failures? (List observable signs and map to a grade of failure)
  3. **Intervention Selection**: Based on the required grade and the failure mode, choose the training method.
  4. **Special Cases**:
     - If the task requires deliberate demotion (to Skinnerian), is it legitimate? (Apply the immediate severe harm rule.)
     - If the task is Gregorian, plan to assess both tool use and understanding.
  5. **Handoff**: If the problem isn't a learning problem, note it and hand off.

  This should fit in 15 minutes per objective.
answer: |-
  Below is a practical decision procedure for your educators, based on Dennett's four grades. It's designed as a flowchart-style checklist with clear stopping points, observable indicators, and rules for exceptions. The procedure focuses on the **learning objective** and **observable trainee behaviors**—not philosophy. It takes 10-15 minutes per objective and requires no prior knowledge of Dennett.

  ---

  ### **Dennett's Four Grades: Clinical Training Decision Procedure**
  **Inputs Needed:**  
  - **Learning Objective:** The specific skill or task.  
  - **Observable Signs:** What trainees actually *do* (or fail to do) in real clinical settings.  

  **Output:** The grade of intervention needed (Skinnerian, Popperian, Gregorian) and the type of training fix.  

  ---

  #### **Step 1: Diagnose the Required Grade for the Objective**  
  *Ask: "What would failure look like in this task?"*  
  - **Skinnerian (Habit):**  
    - *Signs it's required:* Task must be automatic, time-critical, performed under stress/fatigue, with zero tolerance for variation (e.g., compliance tasks).  
    - *Sufficient answer:* Failure involves **consistency errors** (e.g., skipping steps, doing it only when reminded).  
  - **Popperian (Judgment):**  
    - *Signs it's required:* Task involves ambiguity, variables, or unknowns; requires adapting to context (e.g., assessment, prioritization).  
    - *Sufficient answer:* Failure involves **reasoning errors** (e.g., misprioritizing, freezing when faced with novelty).  
  - **Gregorian (Tool-Dependent):**  
    - *Signs it's required:* Task relies on external aids (e.g., calculators, algorithms, EHR prompts) to avoid catastrophic errors.  
    - *Sufficient answer:* Failure involves **tool misuse** (e.g., ignoring tools, input errors, blind trust).  
  - **Rule:** If multiple grades apply, **start with the lowest grade** (Skinnerian → Popperian → Gregorian). You can't skip grades for foundational skills.  
  - **Stopping point:** If the task isn't a learning problem (e.g., resource shortages, faulty equipment), hand off to operations/management.  

  #### **Step 2: Assess Current Trainee Grade**  
  *Observe or ask: "What do trainees do wrong *in practice*?" (Focus on actions, not self-reports)*  
  - **Skinnerian failure:** Look for **lapses in execution** (e.g., "They forget to do it unless supervised").  
  - **Popperian failure:** Look for **rigidity or poor adaptability** (e.g., "They follow steps but miss red flags in complex cases").  
  - **Gregorian failure:** Look for **tool rejection or misuse** (e.g., "They bypass the calculator or input weights wrong").  
  - **Key clarity:** Never ask "Do you understand why?"—it's unreliable. Instead, **simulate pressure** (e.g., timed drills) or **vary conditions** (e.g., add distractions) to expose true behavior.  
  - **Stopping point:** If trainees are failing at a lower grade than required (e.g., need Popperian but failing at Skinnerian), you must address the lower grade first.  

  #### **Step 3: Select the Intervention**  
  - **Skinnerian fix:** Drills, immediate feedback, environmental cues (e.g., posters, alerts), and reinforcement (e.g., praise/audits). *Good for habits.*  
  - **Popperian fix:** Case studies, simulations, "what-if" discussions, and reflection exercises. *Good for judgment.*  
  - **Gregorian fix:** Tool-specific practice (e.g., "break the calculator" drills), error-spotting scenarios, and workflow integration. *Good for tool mastery.*  

  #### **Step 4: Handle Special Cases**  
  - **Deliberate Demotion (Pushing to Skinnerian):**  
    - *Legitimate when:* Failure causes **imminent, irreversible harm** (e.g., sepsis, wrong-patient errors). Must be a **non-negotiable standard** (no valid exceptions).  
    - *Infantilizing when:* Task requires **contextual judgment** (e.g., pain assessment) or demotion undermines professional autonomy.  
    - *Rule:* Demote only if the risk is **probable and catastrophic**. Test with: "Could a robot do this?" (If yes, demote; if no, don't).  
  - **Tool-Dependence (Gregorian):**  
    - *Genuine achievement:* Trainees use tools fluently **and** understand their limits (e.g., spot calculator errors, know when to override).  
    - *Masking problem:* Trainees can't work without the tool, or use it unthinkingly (e.g., ignore clinical context).  
    - *Intervention:* Always pair Gregorian training with **"tool failure" scenarios** (e.g., "The EHR is down—now what?"). Assess both tool use **and** underlying knowledge.  

  #### **Step 5: Final Check**  
  - **Scope the grade to the objective:** Remind users: "This grade applies to *this task*, not the person."  
  - **Values call flags:** Outputs requiring your judgment:  
    - Deliberate demotion (safety vs. autonomy trade-offs).  
    - Tool-dependence tolerance (e.g., "How much understanding is enough?").  
    - Whether to combine grades (e.g., Gregorian + Popperian).  

  ---

  ### **Procedure Applied to Your Three Objectives**  
  *(Showing work at each step)*  

  #### **1. Hand Hygiene Compliance at Point of Care**  
  - **Step 1 (Required Grade):**  
    - Failure = infection risk (imminent harm). Must be automatic under stress. **Skinnerian**.  
  - **Step 2 (Current Grade):**  
    - Observable signs: Trainees skip hygiene when rushed or distracted. **Skinnerian failure**.  
  - **Step 3 (Intervention):**  
    - Skinnerian fix: Drills with immediate feedback, visual cues (e.g., dispensers in sight), random audits.  
  - **Step 4 (Special Cases):**  
    - Deliberate demotion: **Legitimate**—non-negotiable, high-risk, no judgment needed.  
    - Tool-dependence: Not applicable.  
  - **Output:** Skinnerian intervention only. No Popperian/Gregorian needed.  

  #### **2. Recognizing Patient Deterioration and Escalating**  
  - **Step 1 (Required Grade):**  
    - Failure = missed cues (e.g., sepsis, cardiac arrest). Involves ambiguity, pattern recognition, and adapting to context. **Popperian** (with possible Gregorian support, e.g., early warning tools).  
  - **Step 2 (Current Grade):**  
    - Observable signs: Trainees freeze with complex cases, escalate too late, or misprioritize when multiple issues arise. **Popperian failure** (not judgment errors).  
  - **Step 3 (Intervention):**  
    - Popperian fix: Case studies, simulations with debriefs ("What if the BP was higher?").  
    - *But note:* If your EHR has escalation algorithms, add Gregorian training (e.g., "Force the tool to give a false negative—can they spot it?").  
  - **Step 4 (Special Cases):**  
    - Deliberate demotion: **Infantilizing**—this requires judgment; demoting to checklists risks missed context.  
    - Tool-dependence: If using decision aids, assess both tool use **and** judgment without it (e.g., "The tool says stable—but what do you see?").  
  - **Output:** **Popperian intervention is correct**—your case-study curriculum is the right tool. But if trainees rely solely on tools without judgment, supplement with tool-free simulations.  

  #### **3. Using Weight-Based Dosing Calculator for High-Alert Drug**  
  - **Step 1 (Required Grade):**  
    - Failure = overdose/underdose (catastrophic). Requires tool to avoid human error. **Gregorian**.  
  - **Step 2 (Current Grade):**  
    - Observable signs: Trainees input weights wrong (e.g., lbs vs. kg), bypass the calculator, or don't question implausible results. **Gregorian failure**.  
  - **Step 3 (Intervention):**  
    - Gregorian fix: "Sabotage" drills (e.g., enter incorrect data—can they catch it?), workflow integration practice.  
  - **Step 4 (Special Cases):**  
    - Deliberate demotion: **Legitimate for tool use** (it must be habitual). But pair with Popperian for error-checking.  
    - Tool-dependence: **Masking risk** if trainees can't calculate manually or spot errors. Fix: Add Popperian training (e.g., "Estimate the dose without the tool—close?").  
  - **Output:** Gregorian + Popperian. Train tool use **and** underlying principles (e.g., "Why did the calculator output 10mg?").  

  ---

  ### **The Answer You Won't Like**  
  **Objective #2 (Recognizing Deterioration):** Your case-study curriculum (Popperian) is **correct**. But if your training *only* uses tools (e.g., EHR alerts), it's insufficient—you need Popperian judgment. No cuts needed; double down on simulations with varied complexities.  

  **The real misfire is Objective #3 (Dosing Calculator):** If you treated this as purely Gregorian (just tool training), it's a masking problem. You must add Popperian elements (e.g., "What if the calculator malfunctions?"). This may require cutting time from tool drills to add reasoning exercises.  

  ---

  ### **Where the Procedure Misfires and Limitations**  
  1. **Not a Silver Bullet:**  
     - **Misfires if:** The problem isn't learning-related (e.g., short staffing, faulty equipment). The procedure flags this for handoff but can't solve it.  
     - **Values calls dominate:** Deliberate demotion and tool-dependence thresholds depend on your hospital's safety culture. The procedure exposes the trade-off but doesn't resolve it.  

  2. **Scope Limitations:**  
     - **Grade creep:** If a task evolves (e.g., new equipment), re-run the procedure.  
     - **Hybrid skills:** Some objectives (like Objective #3) need multi-grade interventions. The procedure identifies this but can't auto-balance them—that's your design decision.  

  3. **Observational Bias:**  
     - **Misfires if:** Educators miss subtle errors (e.g., trainees fake understanding in simulations). Mitigation: Use real incident data, not just self-reports.  

  4. **Human Complexity:**  
     - **As designed:** The procedure scopes grades to objectives (e.g., "For *this* skill, the trainee is Skinnerian"). It fails if users apply it to people.  
     - **Context shifts:** A skill may change grades in different settings (e.g., dosing in pediatrics vs. adults). Re-run per context.  

  **Final Advice:** Use this to filter "training fixes" for *what the problem actually is*. It won't replace curriculum design, but it stops random interventions. When in doubt, prioritize Skinnerian for survival-level skills and Popperian for judgment. And: **demote only when lives are on the line**.
