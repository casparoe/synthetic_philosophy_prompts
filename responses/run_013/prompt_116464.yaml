answer: |-
  ## Setting the terms

  The debate concerns the ontological status of "representations" discovered in neural networks via interpretability techniques. Realism asserts that specific internal states genuinely possess content about features (F) in the world or task. These states function as *vehicles* carrying meaning, causally mediating between input and output. Instrumentalism rejects this, viewing "representation" talk as merely a useful heuristic. It’s a descriptive shorthand for observed input-output correlations or patterns decoded by probes, devoid of inherent semantic properties. The proposed criterion for attributing representation requires: (1) **Recoverability**: F is simply decodable by a human-specified function; (2) **Causal Recruitment**: Intervention on the state predictably alters downstream behaviour; (3) **Invariance**: The state robustly appears across training seeds, architectures, and read-out methods. This essay evaluates realism versus instrumentalism and tests this criterion's adequacy.

  ## The case for realism

  Realism gains traction from the striking efficacy and specificity revealed by mechanistic interpretability. When we identify a neuron cluster activating robustly for "dog" images across diverse breeds but not cats, or a direction in activation space linearly encoding sentiment polarity, the simplest explanation is that the network has *learned* an internal model incorporating that feature. This is bolstered dramatically by causal evidence. Activation patching, where replacing an activation vector from one input context into another causes the output to change *as if* the patched-in feature were present, strongly suggests the state isn't merely correlated but is playing a *functional role* in processing that specific content. For instance, patching the "subject" representation from one sentence into another reliably changes the subject of the output sentence. This functional integration mirrors how representations operate in biological cognition or engineered systems – they are causally potent components within a computational structure. The realist argues that dismissing this as mere correlation ignores the causal structure uncovered. The network isn't just statistically associating inputs and outputs; it's building internal structures that *stand in* for features, mediating the mapping. The precision with which interventions predictably manipulate model behavior based on decoded content strongly points to these states genuinely *being about* F in a substantive sense, fulfilling a core functional role within the model's causal architecture. Denying this requires explaining away the systematicity and causal potency.

  ## The case against, and what instrumentalism must explain away

  Instrumentalism counters that "representation" is a projection. What we observe are complex statistical patterns in high-dimensional spaces, which we conveniently label based on correlations we find decodable. The apparent "content" is observer-relative: it depends entirely on our choice of probe and interpretation schema. Different probes applied to the same state might extract different "features," none intrinsically privileged. Condition (1) highlights this anthropocentrism – the "simple read-out" is defined *by us*. Instrumentalists argue that activation patching merely demonstrates causal sufficiency, not necessary representation. Changing *any* causally relevant state will alter outputs; labeling it as "representing F" because we *happen* to decode F from it conflates correlation with intrinsic content. The network's dynamics might implement complex, distributed computations where no discrete state cleanly maps onto human concepts like "dog" or "subject"; our probes impose discrete labels on continuous, context-dependent activity. Furthermore, the very notion of "content" for an artificial system is problematic. Without grounding in sensory-motor interaction or evolutionary history, can an activation vector genuinely *mean* something? Instrumentalism posits that interpretability provides powerful tools for prediction and control (e.g., steering model behavior via interventions), but the "representational" description is a pragmatic fiction summarizing complex dynamics for our benefit. To succeed, instrumentalism must explain away the *specificity* and *reliability* of causal interventions based on decoded content. Why does patching the "dog direction" consistently induce dog-related outputs, while patching a seemingly arbitrary direction does not? Why do sparse autoencoders find interpretable features aligning with human concepts? The instrumentalist must argue these are emergent statistical regularities we exploit, not evidence of intrinsic intentionality.

  ## Testing the criterion

  The proposed criterion offers a potential bridge, setting a high bar for warranted realist attributions. Evaluating its conditions:

  1.  **Recoverability (Human-Specifiable Simple Read-Out):** This is useful pragmatically but philosophically problematic as a *necessary* condition. It anchors representation to *human interpretability*, conflating epistemic access with ontological status. A state could genuinely represent F internally, crucial for the network's function, yet require a complex, non-linear, or even undiscovered read-out function. Demanding human-specifiable simplicity risks anthropocentrism and excludes genuine but complex internal representations. It seems **too strong** as a metaphysical requirement, though valuable for practical interpretability. It primarily serves *our* need to identify features easily.
  2.  **Causal Recruitment:** This is the strongest pillar. Demonstrating that intervening *specifically* on this state, holding other factors fixed, predictably alters downstream behavior *in a way aligned with the putative content* (e.g., changing the subject patched changes the output subject) is compelling evidence for functional role. It moves beyond correlation to show the state isn't just a passive signal but is actively *used* by the network *as if* it carried the content. This condition is **about right and arguably necessary** for a realist claim about a specific model state.
  3.  **Invariance:** This targets robustness, aiming for representations that reflect the learning objective rather than implementation quirks. However, it conflates two distinct questions: *Does this state in this model represent F?* vs. *Is F robustly learned across models?* For analyzing a *specific* model, demanding invariance across architectures or even seeds is **far too strong**. A representation could be genuine and functionally critical within *one* model's unique computational solution. Its idiosyncrasy doesn't negate its representational status *there*. Invariance is crucial for understanding *learning* (what features/models does SGD robustly find?) but not for attributing representation *within a specific instance*. Condition (3) should be **relaxed when studying a single model**. Robustness across *read-out methods* is more defensible, suggesting the feature isn't an artifact of a specific probe, aligning with instrumentalist concerns about observer-relativity.

  **Conjunction:** The conjunction of all three is **too strong** as a *necessary* condition for representation in a specific model. It prioritizes human accessibility (1) and universality (3) over functional role *within a specific causal system* (2). A state satisfying only (2) and perhaps a relaxed (3) (robust to minor read-out variations within the model) could still be a genuine representation.

  ## Verdict

  I defend a **causal-functionalist realism**, anchored firmly in condition (2). A network state genuinely represents F *within a specific model* if intervening on that state predictably alters downstream behavior in ways congruent with F being manipulated, demonstrating its causal-functional role in the model's computation. This satisfies the core intuition behind representation: a state that stands in for F and whose manipulation affects the system *as if* F were changed. Conditions (1) and (3) are valuable pragmatic or robustness criteria but not constitutive of representation *per se*. Human-specifiable read-outs (1) make representations *useful to us*, and invariance (3) suggests they reflect the task structure rather than noise, but neither is essential for a state to play a representational role *within the model's own causal architecture*. An idiosyncratic, complexly encoded state causally responsible for mediating F-specific processing is still a representation.

  My commitment rests on the empirical success of causal interventions based on decoded content. The systematic, predictable manipulation of model behavior via targeted interventions on identified states provides compelling evidence that these states are not merely correlates but functional components carrying specific content. Instrumentalism struggles to explain the precision and reliability of these effects without invoking something akin to representation. I would abandon this position only if future research consistently demonstrates that successful causal interventions based on decoded features are either: (a) highly fragile and context-dependent in ways that undermine specific content attribution, revealing the interventions work for reasons unrelated to the decoded feature; or (b) achievable with equal success using *arbitrary* activation patterns or decoders, showing the apparent "content" is entirely imposed by the probe and irrelevant to the model's internal processing. Absent such evidence, causal-functional realism provides the best explanation for the findings of mechanistic interpretability.
