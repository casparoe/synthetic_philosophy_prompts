prompt: |-
  So I've been following the constitutional court of Alderia — fictional country, made-up case names, so don't bother trying to recall them, I'm inventing them — and its election-law track record goes like this. Ferrer: struck down a law that gave extra votes to property owners, on the ground that a vote is a vote and wealth can't multiply it. Okonkwo: upheld a rule that only citizens may vote in national parliamentary elections. Bautista: struck down the exclusion of non-citizen permanent residents from municipal elections, reasoning that people who pay the local taxes and have to obey the local ordinances get a say in making them — the court put it as the franchise following the burden. Lindqvist: upheld keeping people in prison for serious crimes off the rolls while they're inside. Nakamura: struck down lifetime disenfranchisement of ex-felons after release, saying the presumption of full membership comes back once you're back in the community. Deveraux: upheld the 18-year voting age against a challenge from 17-year-olds, though a concurrence argued the line should track the age at which someone is ordinarily answerable for the full range of adult legal duties, which it took to be 18.

  Now there's a new case. The statute does three things at once: it drops the voting age to 16 in all elections, lets non-citizen permanent residents vote in national as well as local elections, and makes voting compulsory with a small fine. The challengers say the whole package is unconstitutional; the government says every piece is fine.

  Tell me how the court will rule on each piece. What I actually want is the rule the courts been running across those six cases — and since they fit more than one rule, tell me which rules fit and where they split on this case. Give me your best guess and why, say which of the six is the closest analog for each of the three pieces, and name the further case that would most cleanly seperate the candidate rules. And if the court just wanted to be consistent with its own past, is there a reading on which it has to uphold all three, or strike all three?
reasoning: |-
  We are given six prior cases and a new case with three provisions: (1) lowering the voting age to 16, (2) extending voting rights to non-citizen permanent residents in national elections, and (3) making voting compulsory with a small fine.

  We must deduce a rule (or rules) from the prior cases and then apply it to each provision of the new law.

  Summary of prior cases:

  1. **Ferrer**: Struck down extra votes for property owners. Principle: One person, one vote; wealth cannot multiply voting power.
  2. **Okonkwo**: Upheld that only citizens can vote in national parliamentary elections.
  3. **Bautista**: Struck down exclusion of non-citizen permanent residents from municipal elections. Principle: Franchise follows the burden (i.e., those subject to local taxes and laws should have a vote in them).
  4. **Lindqvist**: Upheld disenfranchisement of prisoners (while incarcerated) for serious crimes.
  5. **Nakamura**: Struck down lifetime disenfranchisement of ex-felons after release. Principle: Full membership (and voting rights) is restored upon rejoining the community.
  6. **Deveraux**: Upheld the 18-year voting age. The majority did not lower it to 17, but a concurrence suggested the voting age should align with the age of full adult legal responsibility (which is 18).

  Now, let's try to derive rules:

  - **Rule 1 (Equality of Voting Power)**: From Ferrer, we have that voting power must be equal and not based on wealth or property.
  - **Rule 2 (Citizenship Requirement for National Elections)**: Okonkwo explicitly upheld that only citizens can vote in national elections.
  - **Rule 3 (Local Connection for Local Elections)**: Bautista established that for local elections, the franchise should extend to those who bear the burdens (taxes, laws) of that locality, even if they are not citizens. But note, this was only for municipal elections.
  - **Rule 4 (Criminal Disenfranchisement During Incarceration)**: Lindqvist allows disenfranchisement during imprisonment for serious crimes. The rationale might be that while incarcerated, one is not fully part of the community.
  - **Rule 5 (Restoration of Rights After Punishment)**: Nakamura requires that after release, ex-felons must have their voting rights restored because they are back in the community.
  - **Rule 6 (Voting Age Tied to Adulthood)**: Deveraux upheld 18 as the voting age, with the concurrence emphasizing that the age should be the same as when one becomes fully responsible under the law (i.e., the age of majority).

  Now, the new law has three provisions:

  1. **Lowering the voting age to 16 in all elections.**
  2. **Extending the vote to non-citizen permanent residents in national elections.**
  3. **Making voting compulsory with a small fine.**

  We must predict how the court would rule on each piece and which prior case is the closest analog.

  ### Analysis for each provision:

  **1. Voting Age to 16:**

  In Deveraux, the court upheld 18 as the voting age. The majority did not accept the challenge from 17-year-olds. The concurrence argued that the voting age should be the same as the age of full adult legal responsibility (which is 18). Therefore, the court seems to tie the voting age to the age of majority (18). 

  Lowering the age to 16 would be a change. The court in Deveraux did not rule that 18 is the only constitutional age, but they did uphold 18. The concurrence's reasoning (which may be influential) explicitly links voting age to the age at which one is answerable for all adult legal duties. In most jurisdictions, 16-year-olds are not considered legal adults: they cannot sign contracts without parental consent in many cases, they are typically tried in juvenile courts, and they are not subject to the full range of adult penalties.

  Thus, the court would likely strike down the provision lowering the voting age to 16. The closest analog is **Deveraux**, which upheld 18. The court would likely say that 16 is too young because it does not align with the age of full legal responsibility.

  **2. Non-citizen permanent residents voting in national elections:**

  Okonkwo held that only citizens may vote in national elections. Bautista allowed non-citizens to vote in municipal elections because of the "franchise follows the burden" principle. However, the court in Bautista was careful to limit its holding to municipal elections. 

  Extending the reasoning of Bautista to national elections would conflict with Okonkwo. The national burden (taxes, laws) might be borne by non-citizens as well, but the court in Okonkwo explicitly upheld the citizenship requirement for national elections. 

  Therefore, the court would likely strike down this provision because it violates the citizenship requirement for national elections. The closest analog is **Okonkwo** (which directly addresses national elections and citizenship). Bautista is distinguished as being about local elections.

  **3. Compulsory Voting with a Small Fine:**

  None of the prior cases directly address compulsory voting. However, we can look for principles:

  - Ferrer is about the weight of the vote (one person, one vote) but not about compulsion.
  - Other cases are about who is included in the franchise.

  Compulsory voting is a requirement to vote, not an exclusion. It does not alter the weight of the vote or the class of voters. It is a different kind of regulation.

  The court might see this as a reasonable regulation of the electoral process. Many democracies (like Australia) have compulsory voting without it being considered unconstitutional. However, we must look for principles in the prior cases.

  The cases that touch on the nature of the franchise:

  - Ferrer: voting must be equal and not based on wealth.
  - Nakamura: restoration of the vote upon rejoining the community implies that voting is a right of community membership.
  - Deveraux: voting is tied to adulthood and full legal responsibility.

  None of these directly prohibit compulsory voting. There is a possible argument that compulsory voting infringes on the right not to vote (as a form of freedom of expression or association). However, the prior cases do not address this.

  Given that the court has not struck down any provision for being compulsory, and that the fine is small (so it's not a severe penalty), the court might uphold this provision.

  But wait: the court in Ferrer emphasized that a vote is a vote and that we cannot have extra votes for some. Compulsory voting does not create extra votes or weight. It merely requires participation.

  The closest analog might be **Lindqvist** or **Nakamura** in that they deal with conditions on the franchise, but neither is directly on point. However, note that Lindqvist upheld a restriction (disenfranchisement) for prisoners, which is a temporary suspension. Compulsory voting is an obligation, not a suspension.

  Alternatively, we might consider that the court has not recognized a right to abstain. Therefore, the court would likely uphold compulsory voting.

  But let me note: if the court believes that voting is a civic duty (like jury duty or paying taxes), then it might be upheld. However, if the court sees voting as a right that includes the right not to exercise it, then it might be struck down. Since there's no prior case on this, we must predict based on the court's general approach.

  The court in these cases has been protective of the franchise (striking down exclusions that it deems unfair) but also allowing some exclusions (prisoners, non-citizens in national elections) and upholding the age requirement. The court has not struck down any regulation that imposes a duty to vote.

  Therefore, the court would likely uphold compulsory voting. The closest analog might be **Deveraux** in the sense that the court allows the legislature to set rules about the franchise, but that's a stretch. Alternatively, we might say there is no direct analog, but the court's tendency to defer to the legislature on some matters (like in Okonkwo and Lindqvist) might lead to upholding.

  However, note that in Deveraux, the court upheld the age limit set by the legislature. Similarly, they might uphold the compulsory voting rule as a legislative choice.

  But let's think about the burden: a small fine might be seen as a minimal burden, not unlike the burden of registering to vote or going to the polls. Thus, it is likely constitutional.

  ### Summary of Predictions:

  1. **Voting age to 16**: Struck down. Closest analog: **Deveraux** (which upheld 18, and the reasoning would apply to reject 16).
  2. **Non-citizen permanent residents in national elections**: Struck down. Closest analog: **Okonkwo** (which held that only citizens can vote in national elections).
  3. **Compulsory voting**: Upheld. Closest analog: None directly, but the court has allowed regulations of the franchise (like in Lindqvist and Deveraux) that are seen as reasonable. However, for the sake of naming one, I'll say **Lindqvist** because it also involved a condition on voting (but note: Lindqvist was about exclusion, not compulsion). Alternatively, **Deveraux** because it accepted a legislative line-drawing.

  ### Candidate Rules:

  We see two main types of rules emerging:

  - **Rule A (Inclusion Rule)**: The franchise must include all who bear the burdens of the community they are voting for (Bautista) and must be restored when one rejoins the community (Nakamura). Exclusions must be justified by a compelling reason (like incarceration for serious crimes in Lindqvist).
  - **Rule B (Boundary Rules)**: Boundaries of the franchise (like citizenship for national elections, age of majority) are upheld if they are based on traditional and reasonable criteria (Okonkwo, Deveraux).

  These rules are in tension when applied to the new provisions.

  ### How the Court Splits:

  - The provision for non-citizens in national elections violates the clear boundary set by Okonkwo (Rule B).
  - The voting age of 16 violates the boundary set by Deveraux (Rule B) because 16 is below the age of majority (18).
  - Compulsory voting does not clearly violate either rule and might be seen as a regulation that promotes participation without altering the boundaries in an exclusionary way.

  ### Consistency Check:

  Is there a reading that would require the court to uphold all three?

  - If the court were to extend the "franchise follows the burden" principle to national elections, then non-citizens would be included. But that would overrule Okonkwo, which the court is unlikely to do without a clear reason.
  - For the voting age, if the court were to adopt a more flexible view of the age of majority, but Deveraux just upheld 18 and the concurrence specifically tied it to full legal responsibility. It would be inconsistent to now say 16 is okay.

  Is there a reading that would require striking all three?

  - Compulsory voting might be seen as a violation of a right not to vote, but that argument is not supported by any prior case.

  Therefore, the most consistent reading is to strike the first two and uphold the third.

  ### The Further Case to Separate Candidate Rules:

  To cleanly separate the rules, we would need a case that tests the boundaries of the "franchise follows the burden" principle at the national level. For example, a case challenging the citizenship requirement for national elections by non-citizen permanent residents who pay federal taxes and are subject to federal laws. This would force the court to either overrule Okonkwo or reaffirm it, clarifying whether the principle in Bautista is limited to local contexts.

  Alternatively, a case on compulsory voting would help. If the court were to strike down compulsory voting, then it would be based on a new rule about the right to abstain. If it upholds, then it would confirm that the legislature has broad power to regulate the manner of voting.

  For the voting age, a case challenging the age of 18 versus 17 or 16 might arise. But Deveraux already addressed 17 and upheld 18. So a new case might focus on 16 and whether the age of majority has shifted or whether there are different levels of responsibility.

  The cleanest further case would be one that directly challenges the citizenship requirement for national elections by non-citizens who are long-term residents and taxpayers. That would force the court to decide whether to extend Bautista to the national level or to hold that national elections are inherently tied to citizenship.

  ### Final Rulings:

  1. Voting age to 16: **Struck down** (based on Deveraux).
  2. Non-citizen permanent residents in national elections: **Struck down** (based on Okonkwo).
  3. Compulsory voting: **Upheld** (no prior case against it, and it's a common practice in democracies; the fine is small and not seen as a severe burden).

  Thus, the new law's first two provisions are struck down, and the third is upheld.
answer: |-
  Based on the Alderia Constitutional Court's precedents, I'll analyze the three provisions of the new statute (lowering the voting age to 16, extending national voting rights to non-citizen permanent residents, and making voting compulsory) by:  
  - **Identifying the core rules** derived from the six prior cases.  
  - **Predicting the ruling** for each provision, with the closest analog case.  
  - **Explaining why** the court would rule that way, including which rules apply and where they conflict.  
  - **Assessing consistency**—whether the court could uphold or strike all three under existing precedent.  
  - **Proposing a "further case"** to clarify ambiguous rules.  

  ### Step 1: Derived Rules from Precedents
  The cases reveal two competing principles ("candidate rules") for evaluating voting rights:  

  1. **The Community-Burden Rule (Inclusion-Focused)**:  
     - Voting rights must include those who bear the burdens of governance (e.g., taxes, laws), as exclusion undermines democratic legitimacy.  
     - **Sources**: Strongly supported in *Bautista* (non-citizens must vote locally if they bear local burdens) and *Nakamura* (ex-felons regain voting rights upon rejoining the community). Implicit in *Ferrer* (rejecting wealth-based vote multiplication as a burden distortion).  
     - **Limits**: Does not override citizenship requirements for national elections (*Okonkwo*) or justify voting rights for those severed from the community (e.g., prisoners, *Lindqvist*).  

  2. **The Membership-Boundary Rule (Exclusion-Focused)**:  
     - Voting may be restricted based on status boundaries tied to full societal membership (e.g., citizenship, adulthood, incarceration), provided they are categorical, non-arbitrary, and linked to civic capacity.  
     - **Sources**: Explicit in *Okonkwo* (citizenship for national elections), *Lindqvist* (incarceration as temporary exclusion), *Deveraux* (18-year age tied to adult legal duties), and *Nakamura* (release from prison restores membership).  
     - **Limits**: Must not permanently disenfranchise (*Nakamura*) or multiply voting power (*Ferrer*).  

  **Tension Between Rules**: The court balances these dynamically. *Bautista* (Community-Burden) and *Okonkwo* (Membership-Boundary) conflict on non-citizen rights but are harmonized by election level (local vs. national). *Nakamura* and *Lindqvist* show Membership-Boundary yielding to Community-Burden once punishment ends.  

  ### Step 2: Ruling Predictions for the New Statute
  **Provision 1: Lowering voting age to 16 in all elections**  
  - **Prediction: Struck down** (violates Membership-Boundary Rule).  
  - **Closest Analog**: *Deveraux* (upheld age-18 requirement).  
  - **Why**:  
    - *Deveraux* tied voting age to "full adult legal duties" (age 18), treating it as a bright-line boundary for civic capacity. Lowering it to 16 severs voting from this membership threshold.  
    - Community-Burden Rule doesn't apply: 16-year-olds pay fewer taxes (e.g., no full income tax) and lack legal adulthood (e.g., cannot be sued as adults, tried in adult courts).  
    - **Rule Conflict**: Membership-Boundary Rule dominates here, as age is a core status boundary. No prior case supports voting below the age of adult responsibility.  

  **Provision 2: Non-citizen permanent residents vote in national elections**  
  - **Prediction: Struck down** (violates Membership-Boundary Rule).  
  - **Closest Analog**: *Okonkwo* (upheld citizenship for national elections).  
  - **Why**:  
    - *Okonkwo* explicitly reserved national voting for citizens, treating citizenship as intrinsic to national community membership. *Bautista* carved out an exception for local elections only, where burdens are direct and hyper-local.  
    - Community-Burden Rule is overridden: While non-citizens bear national burdens (e.g., federal taxes), the court prioritizes national sovereignty and citizenship as a membership boundary.  
    - **Rule Conflict**: Membership-Boundary Rule prevails for national elections. Extending *Bautista* to national votes would directly contradict *Okonkwo*.  

  **Provision 3: Voting compulsory with small fine**  
  - **Prediction: Upheld** (fits both rules; no prior conflict).  
  - **Closest Analog**: *Lindqvist* (upheld prison disenfranchisement) or *Deveraux* (upheld age boundary), as both allow reasonable electoral regulations.  
  - **Why**:  
    - No prior case addresses compulsion, but the fine is analogous to other civic duties (e.g., jury service, taxes). The court sees voting as a "burden" of community membership (*Bautista*/*Nakamura*), so enforcing participation aligns with the Community-Burden Rule.  
    - It doesn't violate Membership-Boundary Rule: Compulsion applies uniformly to existing voters, excluding no one based on status (unlike *Okonkwo*/*Lindqvist*).  
    - **Rule Harmony**: Both rules tolerate non-discriminatory regulations that promote electoral integrity. The small fine is minimal, avoiding wealth-based concerns (*Ferrer*).  

  ### Step 3: Could the Court Be Consistent While Upholding or Striking All Three?
  - **Uphold All Three? No.**  
    - Lowering the voting age to 16 directly contradicts *Deveraux*'s age-18 standard. Extending national voting to non-citizens blatantly violates *Okonkwo*. No reading of precedent permits both.  
  - **Strike All Three? No.**  
    - Compulsory voting has no negative precedent. Striking it would require inventing a new "right to abstain," unsupported by prior cases (which focus on inclusion/exclusion, not participation mandates).  
  - **Consistency Requires Splitting the Rulings**: The court must strike the first two (as Membership-Boundary violations) but uphold compulsion (as a permissible regulation under either rule).  

  ### Step 4: Further Case to Separate the Candidate Rules
  To cleanly resolve the tension between the Community-Burden and Membership-Boundary Rules, a case involving **voting rights for non-citizen permanent residents in national elections** would be ideal. Specifically:  
  - **Scenario**: A challenge to the citizenship requirement for national elections, arguing that long-term non-citizen residents (e.g., 10+ years) pay federal taxes and obey laws, thus bearing national burdens.  
  - **Why It Clarifies**:  
    - Forces the court to choose between extending *Bautista*'s "franchise follows the burden" logic to national elections (favoring Community-Burden Rule) or reaffirming *Okonkwo*'s citizenship boundary (favoring Membership-Boundary Rule).  
    - Currently, the rules are harmonized by election level (local vs. national). This case would test if burden-bearing alone can transcend citizenship, revealing which rule is foundational.  
  - **Outcome Prediction**: The court likely upholds citizenship (*Okonkwo*), but a strong dissent might invoke *Bautista* to argue for incremental inclusion, highlighting the rules' friction.  

  ### Summary Table
  | Provision                                   | Predicted Ruling | Closest Analog | Governing Rule             | Why                                                                 |
  |--------------------------------------------|------------------|----------------|----------------------------|---------------------------------------------------------------------|
  | Lower voting age to 16                     | Struck down      | *Deveraux*     | Membership-Boundary        | Age-18 is entrenched as adulthood threshold; no burden-based override. |
  | Non-citizens vote in national elections    | Struck down      | *Okonkwo*      | Membership-Boundary        | Citizenship is absolute for national elections; *Bautista* is local-only. |
  | Compulsory voting with small fine          | Upheld           | *Lindqvist*    | Both (no conflict)         | Promotes civic duty without excluding groups; minimal burden.        

  **Final Note**: The court's track record shows a preference for incremental, status-based boundaries (*Okonkwo*, *Deveraux*) except where exclusion perpetually negates community reintegration (*Nakamura*) or local burden-bearing (*Bautista*). The new statute's first two provisions cross bright lines, while compulsion is a neutral regulatory tool. If the court wanted to expand voting rights, it would need to overturn *Okonkwo* or *Deveraux*—something it has avoided so far.
