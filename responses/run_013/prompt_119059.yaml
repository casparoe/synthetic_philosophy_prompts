answer: |-
  You've identified a crucial and distinctive epistemological principle in Hobbes's philosophy, often called **"maker's knowledge"** (or *scientia operativa*). This *is* the established name for the exact doctrine you're describing: **genuine scientific demonstration (yielding certain, necessary knowledge) is possible only concerning objects or systems that we ourselves have constructed.**

  Here's a breakdown addressing your specific questions:

  1.  **The Name and Definition:**
      *   **Maker's Knowledge (Scientia Operativa):** This is the standard label in Hobbes scholarship and the history of philosophy for the doctrine you describe. It signifies that the knower must also be the maker to achieve the highest form of knowledge (demonstration).
      *   **Definition:** A subject matter admits of genuine scientific demonstration (knowledge of causes yielding necessary truths) if and only if the objects of that science are artifacts constructed by human beings. We know the causes definitively *because* we are the causes. We have privileged access to the generation and composition of the object.

  2.  **Does Hobbes Hold it in the Strong Form?**
      *   **Yes, absolutely.** This is not just about diagrams making geometry *easier*; it's about what makes demonstration *possible at all*. For Hobbes:
          *   **Geometry:** We construct points, lines, figures, etc., by definitions and postulates governing generation (e.g., drawing a line). We know their properties with certainty because we built them according to rules we stipulated. (*De Corpore*, Part I, Ch. 1, Art. 5; *Six Lessons*, Epistle Dedicatory & Lesson II).
          *   **Politics (Civil Philosophy):** The commonwealth is an artificial man, consciously constructed by covenant. We define the rights and powers of the sovereign and subjects. Because we create this artificial entity according to rational principles (derived from human nature and the laws of nature), we can demonstrate its properties and necessary consequences of its structure (*Leviathan*, Introduction & throughout; *De Cive*, Preface to the Readers; *De Corpore*, Part I, Ch. 1, Art. 7).
          *   **Natural Philosophy (Physics):** We did *not* create natural bodies. We perceive only their effects (phenomena). We can hypothesize about their causes and generate "conditional" knowledge (if this cause, then this effect), but we cannot have true demonstration or necessary knowledge of their inner constitutions. We reason from effects back to *possible* causes, never reaching absolute certainty about the *true and efficient* cause (*De Corpore*, Part I, Ch. 1, Art. 6; Part IV, Ch. 25, Art. 1; *Six Lessons*, Lesson II). Physics yields only "probable" knowledge for Hobbes.

  3.  **Textual Source:**
      *   You are correct that the *Six Lessons to the Professors of the Mathematics* (1656) is a key text, particularly **Lesson II: Of Principles**. Here Hobbes explicitly contrasts geometry ("Wherein consists the evidence of the *Principles* of Geometry?") with natural philosophy, arguing that the principles of geometry are evident "because wee our selves *draw* the *lines*" and "because wee our selves *create* those *figures*". Natural philosophy lacks this because "we make not the *things* themselves".
      *   The most systematic exposition is in **Part I, Chapter 1 ("Of Philosophy") of *De Corpore* (1655)**. See especially Articles 5 ("That the first grounds of all Science are Definitions"), 6 ("Of the Causes of Philosophy"), and 7 ("That Geometry is the onely Science that it hath pleased God hitherto to bestow on mankinde" - note he *includes* politics under this "geometry" of man-made things later in Art. 7 & elsewhere). This chapter lays out the maker's knowledge doctrine as the foundation for differentiating sciences.

  4.  **Boundaries: How it Differs from Other Concepts:**
      *   **Mathematical Constructivism:** This is indeed different. Mathematical constructivism (e.g., intuitionism) is a theory about the *meaning* of mathematical statements and the *admissible methods of proof* (requiring explicit constructions, rejecting non-constructive existence proofs). **Maker's knowledge** is a broader *epistemological* claim about the *source* and *scope* of demonstrative certainty *across different sciences*, grounded in the maker/made relationship. While both emphasize construction, their core concerns and domains differ significantly.
      *   **Vico's *Verum Factum*:** Giambattista Vico's principle "*verum et factum convertuntur*" (the true and the made are convertible) is the closest relative and is explicitly seen as developing Hobbes's insight. The difference is one of **scope:** Hobbes applies it primarily to geometry and politics. Vico extends it radically to *history* and *culture* – humans can truly understand history because they made it. Vico's principle is broader and more foundational to social science.
      *   **Conventionalism:** Conventionalism holds that truths (especially in logic, math, language) are based on human conventions or agreements, not on mind-independent reality. Maker's knowledge *implies* a form of conventionalism for geometry/politics (we define the starting points), but its core is about the *epistemic access* granted by *making*, not just agreement. It's a specific reason *why* conventions can yield certainty in those domains.
      *   **Idealism:** Idealism (in its various forms) holds that reality is fundamentally mental or mind-dependent. Hobbes is a thoroughgoing *materialist*. Maker's knowledge is *not* a claim that geometry or politics exist only in the mind or that matter is mental. It's a claim about how we acquire *knowledge* of *certain types of objects* (artifacts). Natural bodies exist independently; we just can't *demonstrate* their inner workings with certainty.
      *   **Understanding Artifacts Better:** This is a *consequence* of maker's knowledge, but not the doctrine itself. The doctrine provides the *epistemological justification* for *why* we understand artifacts better – because we made them and thus know their causes definitively. It transforms a common observation into a foundational principle for scientific methodology.

  5.  **Engineering and the Problem:**
      *   **Yes, engineering *should* be demonstrable under this criterion.** Humans design and build machines; therefore, according to the strict logic of maker's knowledge, the principles of mechanics and engineering should admit of the same kind of demonstrative certainty as geometry and politics.
      *   **Is this a problem for Hobbes?** It's more of an **unexplored implication** or perhaps an **inconsistency in scope.**
          *   Hobbes *did* write on mechanics/physics (*De Corpore*, Part III & IV), but he classified it under natural philosophy, which he saw as non-demonstrative. His focus was overwhelmingly on geometry as the paradigm and politics as the crucial application.
          *   He didn't explicitly develop a "science of artifacts" *beyond* geometry and politics. His physics was largely mechanistic and focused on motion, attempting deduction from first principles, but he acknowledged its limitations compared to geometry.
          *   **Why the gap?** Possible reasons:
              *   **Priority:** His life's work was driven by the need to ground political philosophy scientifically to avoid civil war. Demonstrative politics was the ultimate goal; geometry was the model; natural philosophy (including mechanics) was secondary and harder.
              *   **Complexity:** Simple geometric figures are easier to see as purely constructed than complex machines interacting with natural forces (friction, gravity, material properties). Hobbes might have implicitly seen engineering as relying too much on non-constructed natural principles.
              *   **Ambiguity of "Making":** Does "making" a machine involve *only* the human design, or does it inherently involve manipulating natural bodies whose inner workings we *didn't* make? Hobbes might have leaned towards the latter view for complex artifacts.
      *   **Conclusion on Engineering:** The strict logic of maker's knowledge *strongly suggests* engineering should be demonstrative. Hobbes's own practice and classification didn't fully embrace this implication, likely due to his primary focus and the perceived complexity/dependence on nature. It highlights a potential tension or limitation in the practical application of his principle.

  **In summary:** The doctrine is **"maker's knowledge" (scientia operativa)**. Hobbes holds it **strongly** as the essential criterion for distinguishing demonstrative science (geometry, politics) from non-demonstrative natural philosophy. It differs from mathematical constructivism (epistemology vs. proof theory), is narrower than Vico's *verum factum* (limited to geo/politics vs. history/culture), involves but goes beyond conventionalism (focus on making, not just agreement), is compatible with his materialism unlike idealism, and provides the *reason* why artifacts are knowable. The status of engineering is an underdeveloped implication that highlights a potential boundary or tension within his system.
