  I should confirm that Hobbes holds this as a strong epistemological principle, not just a heuristic. In his works, he consistently argues that maker's knowledge is necessary for demonstration. The term "maker's knowledge" or "scientia operativa" is used in scholarship, so I'll define that clearly.

  Next, differentiating from mathematical constructivism: Hobbes is about epistemology, not proof methods. Vico's verum factum is broader, applied to history, whereas Hobbes focuses on demonstrable sciences. Conventionalism is about conventions, not making. Idealism might involve mental construction, but Hobbes is materialist.

  The engineering point is interesting. Since humans build machines, engineering should be demonstrable per Hobbes. But he doesn't extend this, possibly because his political focus didn't require it. The user might be testing the consistency of Hobbes's principle.

