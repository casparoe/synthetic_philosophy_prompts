prompt: |-
  I'm a freelance journalist doing a long-ish piece for a general-interest ideas magazine about the idea that logic can't justify itself, and I've been reading round the subject. A mate of mine who did a philosophy degree gave me his potted version of Carroll's tortoise-and-Achilles bit, and I want to check it before I lean on it. Here's what he says, more or less verbatim from a text he sent me: Carroll showed that you can never prove that deduction is valid, because the moment you try to justify a rule like modus ponens you have to assume it, and if instead you write it down as an extra premise you just get an infinite regress of ever more cumbersome conditionals. The tortoise is the hero of the piece — he simply refuses to accept the conclusion, and since nothing can force him to, he's shown that logic has no real grip on anyone who won't play along. The upshot, my friend reckons, is that deductive reasoning is ultimately a matter of psychological habit and a leap of faith rather than rational compulsion, and that's the circle at the heart of logic, which is why so much of twentieth-century philosophy of logic is really about learning to live with it.

  Something about this feels both compelling and slightly off, and I don't know the literature well enough to trust my instincts. So I'd like you to go through it more or less sentence by sentence — not to rewrite it for me, just to tell me what someone who actually works on this stuff would nod along to, what they'd wince at, and what's flatly wrong. In particular: does the tortoise's refusal really show what my friend says it shows, or is the tortoise doing something much narrower? Are the "infinite regress" and the "leap of faith" the same problem or two different ones, and is one being used to prop up the other? And does the closing claim about logic resting on habit and faith actually follow from anything true in the earlier sentences, or is it a seperate thesis smuggled in at the end? I'm inclined to think there's a real insight buried in there somewhere, so I'd rather be told it's a muddle than be flattered.

  Please be upfront about how confident you are in each thing you claim, and single out the one point you're least sure about — I'd much rather have a hedged answer I can trust than a crisp one I can't. And could you write it in British English, since that's the house style.
