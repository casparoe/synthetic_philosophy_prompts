  I notice they've put a lot of thought into the scientific accuracy and narrative constraints - they clearly understand the experiment well and want to avoid oversimplified takes. Their frustration with pop-science interpretations ("science-proves-free-will-is-dead party version") suggests they're looking for nuanced engagement with the material.

