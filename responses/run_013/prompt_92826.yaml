prompt: |-
  PhD student in bioethics here, mid-dissertation on enhancement, and I keep running into a pattern in the empirical and policy literature that I don't have a decent word for. Curious whether it already has a name or whether I should just coin one and move on.

  The pattern has two halves that seem to feed each other. First half: something enters as a real treatment for a fairly clear-cut condition, and then over the years the condition's boundaries loosen — the threshold drops, the diagnostic criteria widen, an "at risk" category gets inserted in front of the diagnosis — until the intervention is something that basically everyone past a certain age, or below a certain score, is now supposed to be on. Nobody ever decided to turn a therapy into an enhancement; the definition of the disease just migrated until the treated state became the normal state. Second half, mirror image: something starts out clearly on the enhancement side — sharper memory, steadier mood, better focus, more muscle than you'd have on your own — and then gets relabeled as a treatment for an under-recognized condition, usually so that somebody will pay for it.

  The bit I actually care about is what happens when you put the two halves in sequence. Once the enhancement has been reclassified as a therapy, the first move runs again on the newly minted "disease," so the enhancement's baseline becomes the new floor of normal, and anything under that floor starts to look like a deficit that needs correcting — which licenses treating it, which moves the floor again. It's a loop rather than a slope, and every individual turn looks locally reasonable. Nobody at any single step is doing anything obviously shady, which I think is why it's so hard to argue against in a committee meeting.

  I know the neighborhood, roughly: medicalization, disease mongering, diagnostic creep or expansion, the general worry that the therapy/enhancement line won't hold still, the species-typical-functioning picture of health that all this quietly assumes. But those seem to name one direction at a time, or they name a social process without the feedback structure. What I want is the concept for the loop itself — the mutual redefinition of "disease" and "normal" by way of the intervention, such that the intervention keeps re-justifying itself as therapy. Does that already have a name somewhere (STS? health econ? the disability literature, where I suspect I'd find the sharpest version and just haven't looked properly)? If it doesn't, can you give me a name and a careful definition — what exactly the thing is, what it isn't, how it differs from plain medicalization, from a slippery-slope argument, from ordinary supply-induced demand — and where its edges are, i.e. cases where the loop doesn't start or actually runs backwards? I care way more about the carving than the label, so please don't just hand me a term and call it done.

  Secondary question, lower priority: does the same loop show up outside medicine? I have a hunch about giftedness programs and about fitness wearables, but I might be overfitting my own pattern onto them.
reasoning: |-
  Okay, let me start by really understanding what this PhD student in bioethics is asking. They're working on their dissertation about enhancement and have noticed a specific pattern in the literature that they can't find a name for. The pattern involves two interconnected processes: the gradual expansion of a condition's definition turning a treatment into something almost everyone uses, and the relabeling of enhancements as treatments for newly defined conditions. The key is how these two processes feed into each other, creating a loop where each cycle redefines normal and justifies further intervention.

  First, I need to break down the two halves they described. The first half is about diagnostic expansion. Think of how conditions like ADHD or osteoporosis have seen their diagnostic criteria broaden over time. What was once a treatment for a severe condition becomes recommended for milder cases or even preventive use. The second half is enhancement medicalization. Things like cognitive enhancers or cosmetic procedures start as enhancements but get rebranded as treatments for issues like social anxiety or age-related decline. 

  The core issue is the loop that happens when these two combine. Once an enhancement is medicalized as a treatment, the diagnostic expansion kicks in again, lowering the threshold for what's considered a disorder. This creates a cycle where each step seems reasonable, but the cumulative effect shifts societal norms. The student wants a term for this loop, not just the individual processes.

  I recall concepts like medicalization and disease mongering, but those don't capture the cyclical feedback. Diagnostic creep is close but doesn't include the enhancement aspect. Therapeutic reconstitution comes to mind—how treatments redefine the conditions they treat. But I need something more precise for the loop.

  Looking into STS (Science and Technology Studies), there's the co-production concept where science and society shape each other. Maybe therapeutic normalization? That emphasizes the shifting baseline of normal. Or maybe biomedical normativity? But that might be too vague. 

  The student mentioned disability studies. Here, the social model critiques how medical definitions can expand, but I'm not sure if there's a specific term for the loop. However, critiques of the medical model might be relevant, especially how interventions redefine disability.

  The feedback mechanism is crucial. It's a positive feedback loop where each intervention lowers the threshold, creating more "patients." This differs from slippery slope arguments because each step is individually justified, not predicted as inevitable. Supply-induced demand is part of it but doesn't cover the redefinition of disease.

  For defining the term, I need to outline necessary conditions: a mutable diagnostic category, an intervention applicable across a spectrum, incentives driving adoption, and iterative redefinition. Cases where it doesn't happen would be conditions with clear biomarkers or where interventions have significant risks, acting as brakes.

  For secondary examples, education systems with gifted programs could fit. Early tracking leads to more interventions for "underperforming" students, shifting baselines. Fitness wearables create new health metrics, turning normal variations into issues needing correction. But in environmental contexts, like pollution, the baseline can shift downwards instead of upwards.

  So the term "therapeutic creep cycle" might work, emphasizing the slow, cyclical nature. Or "treatment-enabled diagnostic expansion (TEDE)" to highlight the mechanism. The key is capturing both the medicalization of enhancements and the subsequent diagnostic broadening in a self-reinforcing loop.
answer: |-
  Based on your precise description, this **self-reinforcing loop of therapeutic redefinition and diagnostic expansion** doesn't have a single, universally accepted term. While existing concepts touch parts of it, they miss the *cyclical feedback mechanism* and the *interplay between enhancement medicalization and diagnostic creep*. Here's a breakdown and proposal:

  **Why Existing Terms Fall Short:**

  1.  **Medicalization:** Describes defining non-medical problems in medical terms. Captures the *entry* into medicine (enhancement becoming treatment) but not the subsequent *expansion* or the *feedback loop*.
  2.  **Disease Mongering:** Focuses on *aggressive promotion* to expand markets. Your loop can occur *without* overt malfeasance, driven by subtle incentives and genuine belief.
  3.  **Diagnostic Creep/Expansion/Inflation:** Describes broadening diagnostic criteria. Captures the *first half* beautifully, but doesn't inherently link to the *second half* (enhancement reclassification) or the *loop* where the treatment drives the new "normal."
  4.  **Slippery Slope:** Often a *rhetorical device* or *prediction* of unintended consequences. Your loop describes an *empirically observed pattern* where each step is locally justified, not a predicted catastrophe.
  5.  **Supply-Induced Demand:** Explains increased utilization due to availability/access. Captures one *driver* within the loop (e.g., wider Rx access fuels diagnostic expansion) but misses the *redefinition of disease/normal* and the *role of enhancement*.
  6.  **Therapeutic Reconstitution (Hacking):** Ian Hacking's concept that classifications change the people classified and the classifiers. Gets *close* to the core mechanism but is broader (applies to many labels) and doesn't specify the *enhancement-to-therapy entry point* or the *cyclical justification* dynamic.

  **Proposed Term & Careful Definition:**

  **Therapeutic Norm Creep Cycle (TNCC)**

  **Definition:** A self-perpetuating socio-medical feedback loop wherein:
      1.  **Phase 1 (Expansion):** The diagnostic boundaries of a condition treated by an intervention (initially targeted) progressively widen due to factors like lowered thresholds, new risk categories, or broadened diagnostic criteria, increasing the population deemed to "need" the intervention.
      2.  **Phase 2 (Medicalization):** An intervention initially understood as an enhancement (improving function beyond species-typical or individual baseline) is redefined as a therapeutic treatment for a newly articulated or expanded "condition" (e.g., underperformance, suboptimality, risk state).
      3.  **Feedback Mechanism:** The widespread adoption of the intervention (from either Phase 1 or Phase 2) establishes a new functional or morphological *baseline* perceived as "normal" or "healthy." This new baseline renders *previously unremarkable states* (or states below this new norm) as deficits or pathologies, thereby justifying further diagnostic expansion *or* the medicalization of the *next* level of enhancement, restarting the cycle. Each individual step appears clinically reasonable and ethically defensible within the prevailing diagnostic framework.

  **Core Mechanism:** The intervention actively *reconfigures* the understanding of both the "disease" it treats and the "normal" state it aims for, creating a moving target where the intervention itself continuously justifies its own expansion.

  **What TNCC Is NOT:**

  *   **Just Medicalization:** TNCC *includes* medicalization of enhancement (Phase 2) but *requires* the subsequent feedback loop where the newly treated state becomes the norm, driving further expansion/medicalization. Medicalization can be a one-way street; TNCC is cyclical.
  *   **Just Diagnostic Creep:** TNCC *includes* diagnostic creep (Phase 1) but *requires* that this creep is fueled by the intervention changing the perception of normal. Diagnostic creep can occur without an intervention changing the norm (e.g., changing definitions of autism).
  *   **A Slippery Slope Argument:** TNCC is an *observed pattern* with identifiable mechanisms (changing norms, diagnostic expansion, incentive structures), not a logical prediction of inevitable decline. It focuses on how *locally reasonable actions* aggregate into systemic shifts.
  *   **Supply-Induced Demand Alone:** While SID is a *driver* within TNCC (availability fuels use), TNCC crucially involves the *redefinition* of disease and normal. SID explains *utilization increase*; TNCC explains *conceptual shift* enabling further utilization.
  *   **Inevitable:** It requires specific conditions to initiate and sustain.

  **Boundaries & Edge Cases (Where the Loop Falters):**

  *   **Strong Biomarkers:** Conditions with clear, immutable pathological thresholds (e.g., Type 1 Diabetes, severe genetic disorders) resist diagnostic creep. The "disease" is less mutable. The loop struggles to start or gain momentum.
  *   **High-Risk/Low-Benefit Interventions:** Interventions with significant side effects or low efficacy for mild cases act as a brake. Expansion becomes clinically unjustifiable (e.g., chemotherapy for very early-stage, low-risk cancers).
  *   **Stable, Universal Norms:** Functions with universally agreed, stable biological norms are harder to shift (e.g., treating profound deafness vs. treating mild age-related hearing loss where "normal" hearing is less fixed).
  *   **Lack of Incentives:** Without drivers (pharma profit, patient demand for optimization, professional expansion, payer policies) the cycle stalls. E.g., a highly effective but unpatentable/unprofitable intervention might not be aggressively marketed for expansion.
  *   **Regulatory/Payment Barriers:** Strict criteria for diagnosis or reimbursement can block both expansion and medicalization. E.g., requiring documented functional impairment for ADHD diagnosis.
  *   **Cultural Resistance:** Societal pushback against medicalization or strong adherence to a specific health norm can halt the cycle. E.g., resistance to medicalizing normal grief.
  *   **Running Backwards ("De-Medicalization"):** Occasionally, evidence or cultural shifts can narrow definitions or de-medicalize (e.g., homosexuality removed from DSM, debates about lowering diagnostic thresholds for pediatric bipolar disorder). This breaks the cycle.

  **Secondary Question: The Loop Outside Medicine**

  Yes, the TNCC pattern manifests elsewhere, driven by similar mechanisms: technological intervention, mutable definitions of "optimal" or "deficient," and incentives for expansion.

  1.  **Education & "Giftedness"/Learning "Disabilities":**
      *   **Phase 2 (Medicalization-ish):** Interventions for cognitive enhancement (special curricula, tutoring, neurofeedback) are framed as necessary treatments for "underachievement," "learning differences," or to unlock "gifted potential."
      *   **Phase 1 (Expansion):** Criteria for "gifted" programs or learning support widen. More students are identified as needing intervention to reach the "new normal" established by the availability of these programs. Falling *below* the enhanced baseline (now seen as achievable potential) becomes a deficit requiring correction. SAT prep becoming near-universal expectation is a mild example.

  2.  **Fitness & Wearables:**
      *   **Phase 2 (Medicalization):** Devices/trackers offering performance data (steps, heart rate variability, sleep stages) start as enhancements for athletes or enthusiasts. They become rebranded as essential "health monitors" for everyone, treating the "condition" of inactivity or poor health literacy.
      *   **Phase 1 (Expansion):** Normative data from widespread use establishes new baselines (e.g., 10,000 steps, specific HRV ranges). Falling below these algorithmically defined "optimal" levels is framed as a health risk ("sedentary lifestyle," "poor recovery"), justifying increased monitoring or intervention. The baseline for "healthy activity" creeps upwards.

  3.  **Information Technology & "Productivity":**
      *   **Phase 2 (Medicalization):** Tools like advanced email filters, project management software, communication platforms start as enhancements for efficiency. They become reframed as necessary treatments for "information overload," "poor collaboration," or "distraction" – pathologies of the modern workplace.
      *   **Phase 1 (Expansion):** As adoption becomes near-universal, the baseline speed and volume of expected communication/response/work output increases. Difficulty keeping up with this new pace becomes a personal "productivity deficit" requiring further technological intervention or training.

  4.  **Cosmetic Procedures:**
      *   **Phase 2 (Medicalization):** Procedures like Botox or fillers start as pure aesthetic enhancements. They are rebranded as treatments for "dynamic wrinkles" (framing aging features as pathology) or "preventative" measures.
      *   **Phase 1 (Expansion):** As treated faces become common, the visual norm shifts. Features previously considered normal aging (e.g., moderate nasolabial folds, loss of cheek volume) become more noticeable as "deficits" compared to the treated baseline, increasing demand for earlier or more extensive intervention.

  **Why Your Hunch is Valid:** These examples share the core TNCC elements: a technology/intervention redefining the "problem" it solves, establishing a new "normal," and rendering previous states deficient, justifying further adoption or more intensive intervention. The feedback loop between the tool and the definition of optimal function is key.

  **Conclusion:** "Therapeutic Norm Creep Cycle" (TNCC) captures the dynamic, self-reinforcing loop you've identified, distinguishing it from related concepts by emphasizing the *mutual redefinition of condition and normal facilitated by the intervention itself*, leading to iterative justification for expansion. It highlights the *cyclical* nature and the role of *changing baselines*. This term provides the conceptual precision needed for your dissertation analysis of enhancement, acknowledging both the medical and non-medical domains where this pattern operates. Good luck with the committee meetings – having a sharp term like TNCC to frame the discussion should help cut through the "locally reasonable step" defense.
