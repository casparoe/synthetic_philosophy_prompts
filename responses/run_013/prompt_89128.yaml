  (1) **The theory must preserve the rationality of accepting each member of a large body of independently probable claims while refusing their conjunction.**
     - This is the preface paradox. It is a genuine requirement because it captures a common and rational practice in science and everyday reasoning.

  (2) **Likewise for the lottery case.**
     - This is the lottery paradox. It is a genuine requirement because it shows the problem of aggregating uncertain beliefs.

  (3) **Acceptance must be closed under single-premise entailment: accepting A, and accepting that A entails B, yields acceptance of B.**
     - This is a traditional requirement of deductive closure. However, in the face of the paradoxes, it is contentious. Some theories (e.g., non-adjunctive) reject it for multi-premise closure but keep single-premise. But note: in the lottery, if we have single-premise closure and we accept each ticket loses, then we can derive each conjunct individually, but we cannot derive the conjunction without a multi-premise rule. So single-premise closure alone doesn't force the lottery paradox. However, if we also have a rule that if you accept A and you accept B, then you must accept A&B (adjunction), then we get the paradox. So the issue is more about adjunction than single-premise closure. But note: single-premise closure is also problematic because it leads to logical omniscience (if you accept the axioms of arithmetic, you must accept every theorem). So this requirement might be too strong and may be camp-specific (classical logic-based theories).

  (4) **Belief must not turn on a sharp numerical cutoff — or if there is one, the theory must explain why its exact location isn't an embarrassment.**
     - This is motivated by the sorites-like nature of the lottery: why should ticket 1,000,000 be treated differently from ticket 1? It's a genuine requirement because without it, the theory is arbitrary.

