     - This is the idea that acceptance is action-guiding. But the high stakes case (like the flight insurance) might challenge this. It might be camp-specific (e.g., pragmatic encroachment views might deny that the same proposition is accepted in both low and high stakes).

  (8) **The account must extend to groups — a jury, a research team — whose members each accept consistently while the union of their acceptances is inconsistent.**
     - This is a genuine requirement because collective rationality is important and the phenomenon is common.

