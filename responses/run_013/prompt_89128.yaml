  | **Preface Rationality** | Permit rational acceptance of each claim in a large body of independently probable claims while rejecting their conjunction. | Preface paradox: An author accepts each claim in their book due to strong evidence but also accepts (inductively) that at least one is false. | Genuine (reflects fallibilism in scientific/quotidian reasoning). | Non-negotiable (core puzzle). | Threshold, Contextualist |
  | **Lottery Rationality** | Permit rational acceptance of each "ticket loses" proposition in a large fair lottery while rejecting the conjunction "all tickets lose." | Lottery paradox: High probability justifies individual beliefs, but deductive closure forces inconsistency. | Genuine (parallels preface; tests closure/consistency). | Non-negotiable (core puzzle). | Threshold, Contextualist |
  | **Single-Premise Closure** | Acceptance must be closed under known single-premise entailment (if A is accepted and A entails B, B must be accepted). | Foundational to deductive reasoning: E.g., accepting "It is raining" and "Rain implies wet streets" requires accepting "Streets are wet." | Camp-specific (assumes classical logical omniscience; conflicts with bounded rationality). | Negotiable (often weakened/abandoned to resolve paradoxes). | Threshold (if enforced strictly) |
  | **No Sharp Cutoff** | Avoid sharp numerical thresholds for acceptance, or justify why the threshold's location is non-arbitrary. | Sorites for belief: Why is p=0.99 sufficient for acceptance but p=0.98 not? Motivated by aversion to arbitrariness. | Genuine (prevents ad hoc thresholds; aligns with graded evidence). | Non-negotiable (theories with thresholds must address this). | Threshold |
  | **Voluntariness** | Acceptance must be adoptable/abandonable voluntarily. | Phenomenology of belief: E.g., "accepting for argument's sake" or pragmatic belief adoption. | Camp-specific (prioritizes doxastic voluntarism; contested by evidence-driven views). | Negotiable (not essential to paradox resolution). | Credence-only |
  | **Diagnose Premise** | The theory must identify which premise in the paradox is false. | Methodological demand: Paradoxes arise from plausible premises; solutions should pinpoint errors. | Genuine (avoids dismissive "pseudo-problem" responses). | Non-negotiable (instructor's constraint). | All (but especially Credence-only if it dissolves belief) |
  | **Practical Deliberation** | Accepted propositions must be usable as premises in practical reasoning, even under high stakes. | High-stakes cases: E.g., declining flight insurance because one accepts "the plane won't crash," regardless of stakes. | Camp-specific (ignores pragmatic encroachment; stakes may alter standards). | Negotiable (pragmatic encroachment challenges universality). | Contextualist, Threshold |
  | **Group Acceptance** | Extend to groups where individual acceptances are consistent, but their union is inconsistent. | Group rationality: E.g., juries (each juror consistent; group inconsistent) or research teams. | Genuine (social epistemology requires multi-agent accounts). | Non-negotiable (real-world applicability). | All (esp. if closure/consistency enforced) |
  | **Adjunction (Multi-Premise Closure)** | Closure under conjunction: Accepting A₁,...,Aₙ requires accepting A₁∧...∧Aₙ. | Intuitive deductive norm: Isolates the core conflict in lottery/preface (conjoining beliefs causes contradiction). | Genuine (central to the paradox mechanics). | Negotiable (often rejected to resolve paradoxes). | Threshold |
  | **Bounded Rationality** | Avoid logical omniscience; agents need not accept all logical consequences of their beliefs. | Finite agents: Cannot compute all entailments (e.g., complex mathematical proofs). | Genuine (descriptive adequacy for humans). | Non-negotiable (implied by cognitive limitations). | Threshold (if closure enforced) |
  | **Consistency Preservation** | The set of accepted propositions must be logically consistent. | Avoidance of explosion: Inconsistency trivializes belief sets via ex contradictione quodlibet. | Camp-specific (prioritizes logical purity; conflicts with preface/lottery). | Negotiable (rejected by inconsistency-tolerant approaches). | Contextualist, Threshold |

  ---

  ### **Incompatibilities (Unsatisfiable Subsets)**
  The lottery and preface paradoxes reveal deep tensions between core desiderata. The following subsets cannot be jointly satisfied:
  - **{Preface Rationality, Lottery Rationality, Consistency Preservation}**:  
    Rational agents accept inconsistent sets in preface/lottery cases (e.g., each claim & at least one false). Consistency forbids this, demanding rejection of one puzzle premise.
  - **{Preface Rationality, Lottery Rationality, Adjunction}**:  
    Adjunction forces conjunction acceptance (e.g., "all tickets lose"), directly contradicting rational refusal in both puzzles.
  - **{Single-Premise Closure, Bounded Rationality}**:  
    Single-premise closure implies logical omniscience (accepting all consequences), but bounded agents cannot meet this demand.

  ---

  ### **Key Diagnostics**
  - **Most exclusionary requirement**: **Adjunction**. It directly generates contradiction in preface/lottery, forcing theories to abandon closure, consistency, or the phenomena themselves.
  - **Least defensible requirement**: **Voluntariness**. It is empirically contested (beliefs often feel involuntary), peripheral to the paradoxes, and prioritizes a minority (voluntarist) camp.

  ---

  ### **Family Scores**
  Three solution families and their costs:
  | Family | Main cost | Verdict |
  |--------|-----------|---------|
  | **Threshold View** (Belief = credence > threshold) | Violates *No Sharp Cutoff* (arbitrary thresholds) and *Adjunction* (conjoining high-probability beliefs lowers probability below threshold). | Incurs arbitrariness and closure violations; struggles with preface/lottery without ad hoc tweaks. |
  | **Credence-Only View** (Abandon binary belief for graded credence) | Rejects *Preface/Lottery Rationality* (no binary "acceptance" to resolve) and *Practical Deliberation* (credences alone don’t yield actionable premises). | Dissolves paradoxes but fails to explain binary belief phenomenology and practical reasoning. |
  | **Contextualist View** (Acceptance as voluntary, context-sensitive attitude) | Violates *No Sharp Cutoff* (context shifts thresholds arbitrarily) and *Practical Deliberation* (high stakes may preclude "acceptance" of low-risk propositions). | Resolves paradoxes via context-dependent belief ascription but risks ad hoc context-relativity. |

