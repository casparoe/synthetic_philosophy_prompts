  ## Additional Cases/Considerations for Desiderata

  1. **The Lottery Paradox (Kyburg, 1961)**: 
     - **Case**: In a fair lottery with many tickets, it seems rational to accept of each ticket that it will lose (since the probability of losing is very high for each). However, it is not rational to accept that every ticket loses (because we know one will win). This leads to a contradiction if acceptance is closed under conjunction.

  2. **The Preface Paradox (Makinson, 1965)**:
     - **Case**: An author rationally accepts each statement in her book (each being well-supported) but also rationally accepts that the book contains at least one error (based on the inductive evidence from similar books). This leads to an inconsistent set of acceptances.

  3. **The Paradox of the Heap (Sorites Paradox) for Belief**:
     - **Case**: Consider a long series of propositions, each of the form "Ticket i loses" for a lottery with 1,000,000 tickets. We are inclined to accept each individually, but not the conjunction of all (as in the lottery paradox). However, if we reject closure under conjunction, then we must reject the inference from a set of accepted propositions to their conjunction. But then we might worry about how we can ever accept any conjunction? This motivates a requirement that the theory should not require a sharp cutoff (if it does, it must explain why the location of the cutoff is not arbitrary).

  4. **High Stakes Practical Reasoning**:
     - **Case**: Suppose you accept that your flight will not crash (based on statistics). However, if the stakes are high (e.g., you are considering whether to buy flight insurance for your family), you might not be willing to use that accepted proposition as a premise in practical deliberation. This suggests that acceptance might be context-sensitive or that high stakes might require a higher threshold.

  5. **Group Acceptance**:
     - **Case**: In a jury, each juror might accept a set of propositions that is consistent, but the union of all jurors' acceptances might be inconsistent. Similarly, in a research team, each member might accept a subset of the team's overall claims, but the whole set might be inconsistent. The theory must account for how groups aggregate acceptances and how rational inconsistency can arise at the group level without irrationality at the individual level.

  6. **Closure Under Entailment**:
     - **Case**: If you accept that it is raining, and you accept that if it is raining then the streets are wet, then you must accept that the streets are wet. But in the lottery, if you accept of each ticket that it loses, then by closure under conjunction (which follows from closure under entailment if we have the rule of conjunction introduction) you would have to accept that all tickets lose, which is unacceptable.

  7. **Voluntariness of Belief**:
     - **Case**: We often speak of "deciding to believe" or "choosing to accept" a proposition for the sake of argument. This seems different from credences, which are often taken to be involuntary responses to evidence. A theory of acceptance might need to accommodate this voluntary aspect.

  8. **The Problem of Logical Omniscience**:
     - **Case**: If acceptance is closed under entailment, then we are committed to accepting all logical consequences of our acceptances. But this is impossible for finite agents. So the theory must either reject closure or provide a bounded version.

