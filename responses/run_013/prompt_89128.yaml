     - This is motivated by the phenomenology of belief and the practice of accepting propositions for the sake of argument. However, this might be camp-specific (e.g., to doxastic voluntarism) and not accepted by all.

  (6) **The theory must locate the trouble in one of the puzzle's premises rather than declaring the puzzle a pseudo-problem.**
     - This is a methodological requirement. The paradoxes are real puzzles and not mere confusions. It is genuine because the paradoxes arise from plausible premises and we want a solution that diagnoses which premise is false.

