prompt: |-
  After a long argument on Saturday night with a friend who sizes every position in his portfolio by the Kelly criterion, I have agreed to present my case against geometric-mean maximization at a seminar next month, and I want a Q&A prep sheet. The thesis I will defend is that the growth-optimality result establishes only a fact about the limiting behaviour of a single wealth trajectory under a fixed, indefinitely repeated, never-rescaled betting problem, and that the further claim — that maximizing the geometric mean of wealth is what rationality requires — rests on an equivocation between the ensemble average and the time average that no decision-theoretic axiom licenses; the assurance that Kelly betting cannot ruin you is, I will argue, an artifact of the infinite horizon and of treating wealth as the only quantity that matters. The room will be about a dozen people: six or seven quants and information theorists who size by Kelly daily and regard the criterion as settled, two economists who work on subjective expected utility and will attack me from the axioms, and one Bayesian statistician who will want to know what I propose in its place. Give me the objections I will actually get, sorted by who raises them and phrased in that group's vocabulary, ordered by how much damage each would do; a two-minute reply to each, with a candid note on where the reply is weak; what I should concede at the outset so that the quants do not write me off; and the question I am most afraid of.
reasoning: |-
  Okay, the user is preparing for a seminar where they'll argue against using the Kelly criterion for portfolio sizing. They need a Q&A prep sheet to defend their thesis that the growth-optimality result is limited to specific conditions and doesn't justify geometric-mean maximization as a universal rule of rationality. I need to help them anticipate objections from different audience groups: Kelly-using quants/information theorists, SEU economists, and a Bayesian statistician.

  The user's core argument has several layers. First, they're challenging the interpretation of Kelly's mathematical results - specifically that the "no ruin" assurance relies on infinite horizons and treating wealth as the only important variable. Second, they're making a philosophical point about decision theory, arguing there's an unjustified leap from mathematical properties to normative rationality. Third, they seem concerned about practical limitations like parameter uncertainty and human behavioral factors.

  For the prep sheet, I'll organize objections by audience segment. The quants will likely attack with empirical results ("it works in practice") and invoke Shannon's authority. The economists will come from axiomatic utility theory, demanding to know which axioms the user would violate. The Bayesian will want alternatives - this might actually be the most dangerous question because it forces the user to offer positive proposals rather than just critique.

  I should note that the user's weakest point might be the lack of a clear alternative framework. While they correctly identify Kelly's limitations, offering only criticism could leave them vulnerable. Their strongest points are the parameter sensitivity issue and the difference between ensemble vs time averages - these are mathematically unambiguous criticisms.

  The opening concession is crucial. The user needs to acknowledge Kelly's mathematical correctness and Shannon's brilliance upfront to avoid alienating the quants. Something like "I agree Kelly is growth-optimal under its strict assumptions" would establish credibility before pivoting to the limitations.

  For the most feared question, I'm imagining something that exposes the tension in their position: "If not expected utility maximization or geometric growth, what positive decision rule do you propose that doesn't collapse into one or the other?" This cuts to the heart of their critique's constructive viability.

  The replies should be concise (two-minute limit) and phrased in each group's language: information-theoretic terms for quants, utility axioms for economists, etc. Where replies are weak (like not having a perfect alternative), I'll suggest acknowledging it candidly rather than overclaiming.
answer: |-
  Here’s a targeted Q&A prep sheet for your seminar, structured by opponent group, damage level, replies, concessions, and your worst fear. Focus on precision, conceding ground strategically, and exposing foundational ambiguities.

  ---

  ### **Preemptive Concession (Open With This)**  
  *To disarm quants and establish credibility:*  
  **"Kelly is mathematically optimal *if*: (1) probabilities are known exactly, (2) payoffs are infinitely replicable, (3) utility is logarithmic, and (4) you care *only* about long-run wealth. My critique targets the uncritical leap from this theorem to universal rationality."**  
  *Why it works:* Acknowledges their framework while delimiting your attack. Quants won’t dismiss you as ignorant.

  ---

  ### **Objections & Replies**  
  **Sorted by Group, Ordered by Damage (High → Low)**  

  1. **The Quant/Information Theorist**  
     **Objection (High Damage):** *"Kelly *does* maximize median terminal wealth and minimizes time to a goal. Your ensemble/time distinction is irrelevant because the law of large numbers collapses them in i.i.d. settings."*  
     **Reply (2 min):** "The LLN requires infinite horizons. Real investors face finite time, path dependency, and irreversible ruin. Kelly’s time-average justification ignores cross-sectional risk: 63% of trajectories go bankrupt before converging to the growth rate. Your median is robust only if you can survive the left tail."  
     **Weakness:** Doesn’t refute asymptotic optimality; concedes Kelly works "eventually."  

  2. **The Economist (SEU)**  
     **Objection (High Damage):** *"If you reject geometric maximization, you must reject expected utility theory (EUT) itself. Kelly is implied by log-utility, which avoids St. Petersburg paradoxes. What coherent utility function *doesn’t* lead to Kelly?"*  
     **Reply (2 min):** "Log-utility is one choice among many; EUT doesn’t mandate it. Rationality requires aligning utility with *all* risks—not just wealth. Kelly ignores:  
     - Liquidity shocks (wealth ≠ consumption)  
     - Model uncertainty (misspecified probabilities)  
     - Non-repeatable bets (e.g., life savings on one opportunity).  
     Maximizing 𝔼[log(W)] is rational *only* if your utility *is* logarithmic and risks are purely monetary."  
     **Weakness:** Doesn’t specify an alternative utility function; risks sounding anti-axiomatic.  

  3. **The Bayesian Statistician**  
     **Objection (Medium Damage):** *"If not Kelly, what? Full Bayes? Myopic expected utility? Half-Kelly heuristics? You’re critiquing without offering a decision-theoretic alternative."*  
     **Reply (2 min):** "I advocate context-dependent sizing:  
     - Use full Kelly *only* for high-conviction, high-replication bets (e.g., market-making).  
     - Use fractional Kelly (or expected utility with CRRA) when probabilities are uncertain.  
     - Use min-VaR or satisficing when ruin is unacceptable.  
     Kelly isn’t irrational; it’s often *misapplied* as a universal rule. Rationality requires adapting to *all* constraints—not just growth."  
     **Weakness:** "Fractional Kelly" is ad hoc; no unified alternative proposed.  

  4. **The Quant (Practicality)**  
     **Objection (Medium Damage):** *"Kelly *works*. Prop shops use it and outperform. Your theoretical nitpicking ignores that it dominates myopic optimization in backtests."*  
     **Reply (2 min):** "Survivorship bias: shops that blew up using Kelly aren’t here to object. Kelly’s edge assumes perfect probability knowledge. In practice, 2% edge misestimation can turn +EV bets into ruin. It’s fragile—like recommending Newtonian physics for satellite navigation without mentioning relativity."  
     **Weakness:** Empirical success of Kelly users is undeniable; your reply is defensive.  

  5. **The Economist (Axioms)**  
     **Objection (Low Damage):** *"You violate the independence axiom by favoring path-dependent rules. If you accept the axioms, Kelly follows from coherence."*  
     **Reply (2 min):** "The axioms assume static, one-shot choices. Repeated bets introduce *temporal* independence: ruin in year 1 precludes betting in year 2. Real-world rationality must account for sequential irreversibility—which your axioms ignore."  
     **Weakness:** SEU axioms *can* encode dynamic choice via recursive methods.  

  ---

  ### **The Question You Fear Most**  
  **Likely from the Bayesian or a Quant:**  
  *"If an investor has log-utility, known probabilities, and infinite capital, is Kelly irrational? If not, how does your critique extend beyond warning against model error?"*  

  **Why it’s deadly:**  
  - Forces you to concede Kelly is *mathematically* rational under its assumptions.  
  - Exposes that your core argument is about *misapplication* (e.g., false precision, non-log utility), not math.  
  - Could make you sound like you’re merely advocating "Kelly but smaller" (fractional sizing).  

  **Reply Strategy:**  
  1. **Concede:** "Under those assumptions, Kelly is rational."  
  2. **Pivot:** "But those assumptions are *never* true. Probability estimates are always uncertain, utility is never purely logarithmic (due to subsistence needs), and capital is finite. Using Kelly as a universal benchmark ignores these realities."  
  3. **Reframe:** "My thesis isn’t that Kelly is wrong—it’s that its optimality is confined to a toy model. Using it as a normative standard equivocates between the idealized ensemble and real trajectories."  

  ---

  ### **Key Tactics**  
  - **Use their language:**  
    - Quants: "LLN," "ruin paths," "median vs. mean."  
    - Economists: "axiomatic coherence," "dynamic inconsistency."  
    - Bayesian: "model uncertainty," "prior misspecification."  
  - **Anchor on fragility:** Kelly’s sensitivity to probability errors is its Achilles’ heel.  
  - **Concede early:** "Kelly is optimal in its universe" disarms hostility.  
  - **Redirect:** Focus on the *equivocation* between time-average and ensemble properties.  

  This prep forces opponents to defend Kelly’s real-world applicability—not its math. Your goal isn’t to "win" but to expose that Kelly is a tool, not a religion.
