          - Part 3: "Now, one more grid. Same as before, but this time I will wait a few seconds before calling the color." 
          - Show Grid 3 (0.5 seconds). Wait 5 seconds (say: "Wait...", and count silently). Then call a color (e.g., "Blue!").
          - Students write the cued row (1 minute).

       10-15 min: 
          - Part 4: Group task.
          - "Now, we are going to try something different. I need one volunteer to be the perceiver. The perceiver will see a grid and then the rest of you will try to figure out what they saw by asking yes/no questions. The perceiver cannot write anything down and cannot say anything except yes or no. The goal is to reconstruct the entire grid."
          - Pick a volunteer. Show Grid 4 to the perceiver (0.5 seconds).
          - The group has 5 minutes to ask questions and try to reconstruct the grid on the board (or on a shared paper). The instructor can write on the board as the group directs.

       15-25 min: 
          - (If we do the global workspace, we can do it now, but let's skip to keep time and focus on the debrief. We can mention the idea in the debrief.)

       Then, we start the debrief (25 minutes).

     Debrief plan:

       - (5 min) Ask about the wagering: "How many of you chose A? B? C?" Record the numbers on the board. Then ask for volunteers to explain why they chose what they did.

       - (5 min) Contrast the immediate and delayed cue: "In the immediate cue, most of you got the whole row. In the delayed cue, how did it feel? How many did you get? (Typically, they get fewer.) Why do you think that is?"

