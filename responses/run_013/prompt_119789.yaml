          - "How many did you get? Don't say it out loud, but note it. Typically, people get 3-5."

       7-8 min: 
          - Part 2: "Now, we'll do it again. This time, I will call out a color immediately after the grid disappears. You are to write down only the symbols in that row." 
          - Show Grid 2 (0.5 seconds), immediately call out a color (e.g., "Green!").
          - Students write the cued row (1 minute).

       8-9 min: 
          - Wagering: "Now, think about what just happened. How many of the twelve symbols do you think were present in your experience in the same way as the ones you just reported? If I had cued a different row, could you have reported it just as well? I want you to wager on this. You have three choices:
               A: All 12 were present (wager 3 points)
               B: Only the cued row was present (wager 1 point)
               C: Some were present, but not all (wager 2 points)
            Write down your choice (A, B, or C) and hold on to it."

