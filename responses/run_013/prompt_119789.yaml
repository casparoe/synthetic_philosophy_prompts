prompt: |-
  I teach a second-year "Mind and Brain" module that mixes philosophy and psychology students, and I run a 90-minute session early in the term whose whole job is to make the access/phenomenal distinction land before I have said either of those words out loud. What I want from you is a runnable activity — part parlour game, part staged experiment — for roughly eighteen students in an ordinary seminar room with a projector, in which they discover for themselves that there is a gap between what they can report and what seems to have been there. I have a rough mechanic in mind; build it out if it works, and replace it if you can keep what it delivers. Each student is briefly shown a card bearing a grid of a dozen distinct symbols, long enough to see and far too brief to take in, and then writes down what they saw, which is always humiliatingly little. Then they do it again, and this time, immediately after the flash, I call out one of three colours, each picking out a row, and they write down only that row — and almost everyone gets the whole cued row. The moment I am after is the one just after that, when I ask them to wager points on how many of the twelve items were "there for them" in the way the reported row was, and the room splits between those who want to say that all twelve were present and simply out of reach, and those who suspect the whole thing is a conjuring trick. I would like a third round with a delayed cue, late enough that the row they were about to report has drained away, because the felt contrast between the immediate and the delayed cue seems to me to be where the philosophical pressure actually lives. Please give me the rules and materials (what goes on the cards, how the flash is timed without a tachistoscope, how the cue is delivered, how points or some small stake is awarded so that wagering feels like wagering, and how to keep the session from collapsing into a memory quiz); a minute-by-minute running order for the 90 minutes, with the activity itself taking no more than about forty minutes and leaving me a full twenty-five for the debrief; roles if you think they help (a scorer, a recorder, and perhaps a designated sceptic whose job is to interrogate the room's introspective reports rather than accept them); and explicit instructions about what I must not say or do beforehand, since the point is that they arrive at the phenomenon rather than being briefed on it. Assume nobody in the room has read anything about this, that I will be doing the theory myself afterwards, and that the activity should therefore be self-contained and should not name any theory, paradigm, effect, or researcher — including in the materials handed out. If it can be done without overloading the session, I would also like a short final stage in which the group has to work out what one of their number saw without receiving any report from them at all, so that they run into the fact that a report is the only instrument they have, which is precisely the methodological trouble in this area.

  The debrief is the part I care most about, and I want it to leave the room holding two readings side by side rather than choosing one. Map each stage of the activity onto the difference between what is available to a system for report and control and what is present in experience, and make them feel both the pull of the thought that the unreported items were nevertheless experienced — that the cue reached back into something that was already there — and the pull of the deflationary reading, on which the cue reaches into a rich but non-conscious buffer, and the only thing ever conscious was the little they could report. I would like them to see why their own wager, made from the inside and on the basis of how things seemed, cannot settle the question either way, and why the immediate-versus-delayed contrast is the kind of evidence that both sides can accommodate. If you can fold in a second, shorter stage that stages the global-workspace idea — some task in which information counts only once it has been broadcast to a shared surface, so that the group discovers how much each of them was holding that never made it to the surface, and then has to decide whether the unbroadcast material was conscious or merely stored — I would welcome it, provided it does not eat the debrief. Then tell me what will predictably go wrong the first time I run this and how to handle it: the student who has met the paradigm before and announces it; the one whose reports are systematically unreliable; the projector timing that ruins the flash; the group that converges on a single introspective verdict by social pressure. And be frank about the feature of the idea the activity cannot reproduce — my own worry is that anything a participant can tell me about is by definition reportable, so the exercise may stage the access side of the distinction vividly and only gesture at the phenomenal side, leaving me to supply the rest. I want the activity, not the literature: no citations, no reading list, and nothing that assumes the students will look anything up.
reasoning: |-
  We are designing a self-contained activity to reveal the gap between reportable content and phenomenal experience without using technical terms. The activity has three main parts: 
   1. Initial flash: Students see a grid of symbols briefly and write down what they saw. They typically recall very little.
   2. Immediate cue: Same flash, but immediately after, the instructor calls out a color (which corresponds to a row) and students write down only that row. They usually get the whole row.
   3. Delayed cue: Same flash, but after a delay (long enough for the initial sensory memory to fade), the instructor calls a color, and students write down the cued row. Performance drops.

   Then, we add:
   - Wagering: After the immediate cue round, students wager points on how many of the twelve items were "there for them" in the way the reported row was.
   - A fourth stage (optional): A short group task to highlight that without a report, we cannot know what someone experienced.

   We also consider a second activity (shorter) to illustrate the global workspace idea.

   Constraints:
   - 18 students, 90-minute session, activity taking about 40 minutes, leaving 25 minutes for debrief.
   - No tachistoscope: we use a projector and a simple timing method (e.g., a slide with a fixed brief display time).
   - Materials: Cards (slides) with a grid of symbols (e.g., 3 rows, 4 columns, total 12). Each row has a distinct color background? Or we use colored symbols? We'll use colored backgrounds for rows to make the cue easy.

   Proposed grid:
     Each grid has 3 rows and 4 columns. The rows are colored: top row red, middle green, bottom blue. The symbols are distinct and easily nameable (e.g., simple shapes: ★, ♥, ♦, ♣, ▲, ▼, ◀, ▶, ⚫, ⚪, ✔, ✘). We can have multiple versions to avoid memorization.

   Steps:

   Part 1: Initial flash (without cue)
     - Show a grid for 500 ms (we can use PowerPoint with auto-advance or a quick key press).
     - Students write down as many symbols as they can remember (order and location not required, just the symbols).

   Part 2: Immediate cue
     - Show a different grid (same structure) for 500 ms.
     - Immediately after the flash, the instructor calls out one color (e.g., "red!").
     - Students write down only the symbols in the red row.

   Part 3: Delayed cue
     - Show a third grid (again different) for 500 ms.
     - Wait for 5 seconds (count silently or use a timer), then call a color.
     - Students write down the cued row.

   Wagering (after Part 2):
     - After they have written the cued row in Part 2, ask: "How many of the twelve symbols do you think were present in your experience in the same way as the ones you just reported? In other words, if I had cued a different row, could you have reported it just as well? You are going to wager on this."
     - Give them three options: 
          Option A: All 12 were present (wager 3 points)
          Option B: Only the cued row was present (wager 1 point)
          Option C: Some were present, but not all (wager 2 points)
     - They write down their wager (A, B, or C) without discussion.

     Note: We don't resolve the wager until the debrief? Actually, we cannot resolve it because we don't have a way to check. The wagering is to force them to commit to an interpretation of their experience.

   Part 4: Group task (without report)
     - Choose one student to be the "perceiver". They will be shown a grid (same as before) for 500 ms, but this time they are not allowed to write anything down or say anything. 
     - The rest of the class must figure out what the perceiver saw. They can ask the perceiver questions, but the perceiver can only answer "yes" or "no". (This is like the game "20 questions".) 
     - The group has 2 minutes to try to reconstruct the grid. They will likely fail to get all the symbols.

   Then, we move to the debrief.

   Additionally, we can add a global workspace illustration:

     Global Workspace Stage (if time permits, but keep it short):
       - Divide the class into 3 groups of 6. Each group is given a different puzzle (e.g., a riddle, a simple math problem, an anagram) written on a card. The card also has a unique symbol (to identify the group).
       - Only one member of each group can write on the board (the "broadcaster"). The group must solve the puzzle and then the broadcaster writes the answer on the board along with the group's symbol.
       - The instructor then asks: "Which groups had members who thought of an alternative solution or a wrong path that they didn't share?" 
       - The point: Some information was held by individuals but not broadcast (so the group didn't use it). Was that unbroadcast information conscious? Only to the individual? Or was it not conscious until it was broadcast?

   Timing:

     Total activity time: 40 minutes.

     Breakdown:
       0-5 min: Introduction and setup (without giving away the purpose). 
          - "We are going to do a series of perception and memory exercises. Please have a pen and paper ready. Do not discuss with your neighbors until we are done with all the exercises."

       Part 1 (Initial flash): 
          5-7 min: Show grid 1 (500 ms). Students write down what they saw (1 minute to write).
          7-8 min: Collect the papers? Or just have them keep for comparison? We don't need to collect. They can just note how many they got.

       Part 2 (Immediate cue):
          8-10 min: Show grid 2 (500 ms), immediately call a color. Students write the cued row (1 min).
          10-11 min: Wagering: Ask the question and have them write their wager (A, B, or C).

       Part 3 (Delayed cue):
          11-13 min: Show grid 3 (500 ms). Wait 5 seconds (count silently or with a timer), then call a color. Students write the cued row (1 min).

       Part 4 (Group task):
          13-15 min: Explain the rules: "Now, we are going to try something different. I will pick one of you to be the perceiver. They will see a grid and then the rest of you will try to figure out what they saw by asking yes/no questions. The perceiver cannot write anything down and cannot say anything except yes or no."
          15-17 min: Show grid 4 to the perceiver (500 ms). 
          17-22 min: 5 minutes for the group to ask questions (set a timer). The group tries to reconstruct the grid on the board (or on paper). 

       Global Workspace Stage (optional, if time and if we skip the group task or combine, but let's see time):
          We might skip if time is tight. Alternatively, we can do it quickly.

          Instead, we can do a simpler version: 
            22-25 min: "Think of a number between 1 and 10. Now, without saying it, think about how you chose it. Now, I want you to share with your neighbor the reason you chose that number. But note: you had the number in mind and the reason before you shared. When did it become known to the group? Was the reason conscious even before you shared?" 
            This is very short and just to illustrate the idea of broadcasting.

          But let's not complicate. We might skip this if time is short and focus on the main activity.

       Then we move to debrief.

     Debrief (25 minutes):
       - Start by asking about the wagering: "How many of you wagered that all 12 were present? How many that only the cued row? How many something in between?"
       - Discuss the contrast between the immediate cue (high performance) and the delayed cue (lower performance). What does that tell us?
       - Highlight the two interpretations:
            Interpretation 1 (Rich): All the information was present in experience, but you couldn't report it until cued (and if cued immediately, you could). The cue made it accessible. The delayed cue shows that the rich experience fades quickly.
            Interpretation 2 (Sparse): Only the cued row became conscious (or maybe only a few items). The rest were never conscious. The immediate cue works because the sensory memory (iconic memory) is still available and the cue allows you to focus on that part before it decays.

       - Then, the group task: Without a report, how can we know? The perceiver might have had a rich experience, but the group only got what was reported (via yes/no). The perceiver might have had more than they could convey in the time.

       - Finally, link to the mind-brain distinction: 
            What is available for report and control (access) vs. what is present in experience (phenomenal). The activity shows that access is limited and can be manipulated, but the nature of the underlying experience is elusive.

       - Emphasize that the wagering cannot settle the issue because the wager is based on a feeling (which might be an illusion) or a belief about what was there. But the feeling itself is part of the experience.

       - Point to the immediate/delayed contrast: The rich view can say that the cue must be immediate because the rich experience fades. The sparse view can say that the cue must be immediate because the sensory memory (which is not yet conscious) decays quickly.

     Total: about 40 minutes for activity, 25 for debrief, 5 minutes buffer.

   Materials:
     - Four different grids (each 3x4, with rows colored: red, green, blue). The symbols should be easily distinguishable and nameable. Avoid very similar symbols. Use a set of 12 distinct symbols per grid, but we can have some overlap between grids to avoid memorization? Actually, use four completely different sets.

     Example grid 1:
          Red row:   ★ ♥ ♦ ♣
          Green row: ▲ ▼ ◀ ▶
          Blue row:  ⚫ ⚪ ✔ ✘

     Grid 2:
          Red:   α β γ δ
          Green: ε ζ η θ
          Blue:  ι κ λ μ

     Grid 3:
          Red:   ! @ # $
          Green: % ^ & *
          Blue:  ( ) _ +

     Grid 4 (for the group task):
          Red:   A B C D
          Green: E F G H
          Blue:  I J K L

     How to flash without a tachistoscope:
          Use PowerPoint. Set each slide to advance automatically after 0.5 seconds. Or, if manual control is better, just click to show and then quickly advance to a blank slide. Practice the timing.

     Cue delivery: Instructor calls out the color immediately after the flash (for immediate cue) and after a 5-second delay (for delayed cue). Use a stopwatch for the delay.

     Wagering: 
          Handout with the three options and a place to write their choice. Or just have them write on a piece of paper: "Wager: [A/B/C]".

     Points: 
          We don't have a way to resolve the wager, so we don't actually assign points. The wagering is about commitment. We can say: "We will see later if you were right." But then in the debrief we reveal that we cannot know. Alternatively, we can use the delayed cue as evidence against the rich view? But note, the delayed cue doesn't prove that the information wasn't there initially, only that it decayed.

          Instead, in the debrief, we can say: "Those who wagered A (all 12) might point to the immediate cue: you could get any row if cued immediately. Those who wagered B (only the cued row) might point to the delayed cue: you couldn't get the row if delayed, so it wasn't stored. But note, even the rich view can explain the delayed cue by decay. So we cannot decide."

     Roles:
          - Designated sceptic: We can assign one student to be the sceptic for the debrief. But during the activity, we don't assign roles. Alternatively, after the wagering, ask for volunteers to defend each position.

          - Scorer: Not necessary because we are not really scoring. But we can have a recorder to note the wagers on the board (without names) to show the distribution.

     What not to say:
          Do not use the words "access", "phenomenal", "consciousness", "iconic memory", "global workspace", etc. until the debrief.
          Do not explain the purpose until the end.

     What can go wrong:

          1. Student who knows the paradigm: 
              - If a student says, "Oh, this is about iconic memory!" or "This is Sperling's experiment!", say: "That's interesting, but let's experience it without labels for now. We'll discuss the theory afterwards."

          2. Unreliable reports:
              - Some students might not see the grid well (e.g., sitting too far). Make sure the grid is big enough. Also, we are not grading individual performance, so it's okay if some do poorly. The pattern (most get the whole row in immediate cue) should hold.

          3. Projector timing:
              - Practice the timing. Have a backup plan (e.g., a hand-held flash card? but that's harder). If the flash is too long, they will remember too much. Too short and they remember nothing. Adjust during practice.

          4. Group convergence by social pressure:
              - In the wagering, have them write privately. In the group task, the perceiver might be influenced. Remind them to be honest and not to discuss during the writing phases.

          5. The phenomenal side is not directly captured:
              - This is a limitation. We are only getting reports. In the debrief, we can say: "Notice that when you wager, you are relying on how it felt to you. But how it felt is something only you had access to. And yet, we cannot check that feeling. This is the heart of the issue: the private quality of experience."

     Running order (minute-by-minute):

       0-5 min: 
          - Welcome, explain that we are doing a series of perception and memory exercises. 
          - Rules: "You will see a grid of symbols very briefly. After each, you will write down what you saw. Please do not talk until we are done with all the exercises. You will need paper and pen."

