answer: |-
  Below is a runnable 90-minute session plan that delivers the experiential gap between access and phenomenality without naming any theories. It uses your core mechanic but refines it for clarity, adds the delayed-cue round, includes a group task on unreportable states, and structures the debrief to hold both interpretations in tension. 

  ---

  ### **Activity Title**: *The Grid Game*  
  **Objective**: Students experientially discover a gap between what they can *report* and what *seemed present* in perception.  
  **Time Allocation**: 40 minutes (activity) + 25 minutes (debrief)  
  **Materials**:  
  - Projector + laptop with PowerPoint (or equivalent)  
  - 4 pre-made grid slides (see designs below)  
  - Timer app (with millisecond precision)  
  - Paper + pens for students  
  - Whiteboard for recording wagering choices  

  ---

  ### **Materials Design**  
  **Grid Slides** (3 rows × 4 columns; each row has a solid-color background):  
  - **Grid 1 (Baseline)**: Symbols: `⌂ ♫ ☼ ♠` (red), `¥ § ¶ ¤` (green), `∆ ∇ ◊ ≠` (blue)  
  - **Grid 2 (Immediate Cue)**: `⦿ ⊗ ⊕ ⊘` (red), `⋆ ♥ ♦ ♣` (green), `∞ ≈ ± √` (blue)  
  - **Grid 3 (Delayed Cue)**: `◐ ◑ ◒ ◓` (red), `↑ → ↓ ←` (green), `♲ ♳ ♴ ♵` (blue)  
  - **Grid 4 (Group Task)**: `⧈ ⧉ ⨀ ⨂` (red), `♯ ♭ ♮ ♪` (green), `∆ □ ◊ ○` (blue)  

  **Symbol Selection Rationale**:  
  - Highly distinct, non-verbalizable shapes (avoids verbal rehearsal).  
  - Colors (red/green/blue) are easily identifiable and project clearly.  
  - *No alphanumeric characters*—prevents chunking/strategic memorization.  

  **Timing Without Tachistoscope**:  
  - Use PowerPoint’s "Duration" setting: Set slide transition to **0.5 seconds** (500ms).  
  - **Flash Demo**: Before starting, project a test grid and say, *“You’ll see grids like this for half a second—shorter than a blink. Don’t strategize; just look.”*  

  ---

  ### **Running Order (90-Minute Session)**  
  #### **Setup (5 mins)**  
  - **Instructor Script**: *“We’re playing a perception game. I’ll flash grids—your job is to write what you see. No talking until we debrief. This isn’t a test—go with your gut.”*  
  - **Critical**: Do NOT mention memory, consciousness, or reporting. Call it a "perception game."  

  #### **Round 1: Baseline (Humiliation) (5 mins)**  
  1. Flash **Grid 1** (500ms).  
  2. *Task*: *“Write ALL symbols you saw—any order.”* (1 min).  
  3. *Result*: Most recall 3–4 symbols. Ask: *“Raise hand if you saw more than you wrote?”* (Nearly all will).  

  #### **Round 2: Immediate Cue + Wagering (10 mins)**  
  1. Flash **Grid 2** (500ms).  
  2. **Immediately** call a color (*“GREEN!”*).  
  3. *Task*: *“Write ONLY the symbols in the green row.”* (1 min).  
  4. **Wagering**:  
     - *“How many of the 12 symbols felt *fully present* to you, like the green row? Wager points:*  
       - **A**: All 12 were present (bet 10 points)  
       - **B**: Only the green row was present (bet 2 points)  
       - **C**: Some were present, but not all (bet 5 points)  
     - *Write your choice privately.*”  
  5. Record votes anonymously on whiteboard (e.g., A:8, B:3, C:7). Do NOT discuss yet.  

  #### **Round 3: Delayed Cue (5 mins)**  
  1. Flash **Grid 3** (500ms).  
  2. **Wait 5 seconds** (count silently), then call a color (*“RED!”*).  
  3. *Task*: *“Write ONLY the symbols in the red row.”* (1 min).  
  4. *Result*: Performance drops sharply (most recall ≤2 symbols).  

  #### **Group Task: The Silent Perceiver (15 mins)**  
  1. Pick 1 volunteer (“Perceiver”). They face away from the class.  
  2. Flash **Grid 4** (500ms) **only to the Perceiver**.  
  3. *Rules*:  
     - Perceiver **cannot speak, write, or gesture**.  
     - Class asks **yes/no questions** to guess the grid (e.g., *“Was there a triangle?”*).  
     - Instructor moderates; 3-minute time limit.  
  4. *Result*: Class reconstructs <50% of the grid.  
  5. *Prompt*: *“How much do you think the Perceiver experienced but couldn’t convey?”*  

  #### **Debrief (25 mins)**  
  **Goal**: Sustain tension between two interpretations:  
  > *Rich View*: All 12 symbols were phenomenally present but inaccessible until cued.  
  > *Sparse View*: Only the cued row was conscious; the rest was non-conscious buffer.  

  **Step 1: Contrast Reports**  
  - Chart performance: Baseline (low) → Immediate Cue (high) → Delayed Cue (low).  
  - *Ask*: *“Why did cueing work immediately but fail when delayed?”*  
  - **Key Point**: Immediate cue feels like “accessing what was already there.” Delayed cue feels like “the data drained away.”  

  **Step 2: Analyze Wagering**  
  - Show voting split. Ask students:  
    - *Rich defenders*: *“Why bet on all 12? What did it feel like?”* (e.g., *“I felt the grid’s ‘fullness’!”*).  
    - *Sparse defenders*: *“Why bet against? What makes you doubt?”* (e.g., *“If it was there, why couldn’t I draw it?”*).  
  - **Pressure Point**: *“Your wager relied on introspection—but can introspection lie? If unreportable things *were* conscious, how would you know?”*  

  **Step 3: Group Task as Metaphor**  
  - *“The Perceiver’s knowledge was like non-broadcast info in your brain—present but unused. Was it still ‘conscious’ for them? How could we tell?”*  
  - **Link**: The gap between the Perceiver’s experience and the class’s guesses mirrors the access/phenomenal gap.  

  **Step 4: Introduce the Distinction (Without Jargon)**  
  - *“Today you felt a disconnect: between what you *could report* (access) and what *seemed present* (phenomenal presence). Neither the feeling of ‘fullness’ nor the failure to report settles which is real—both interpretations fit. This is the puzzle we’ll chase all term.”*  
  - **Close**: *“Next week, we ask: Can science resolve this? Or is experience always richer than reports?”*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Student Knows Sperling Paradigm**:  
     - *Preempt*: In setup, say *“If you’ve done something like this, play along—I need your help later.”* If they blurt, *“Hold that thought—we’ll unpack theories next week.”*  

  2. **Unreliable Reports**:  
     - *Normalize*: *“This isn’t about accuracy—it’s about the gap between seeing and reporting.”*  
     - Use aggregate trends (e.g., *“Most got 4/4 in immediate cue”*) to override outliers.  

  3. **Projector Timing Fails**:  
     - *Backup*: Use a large printed grid + envelope cover. Manually flash by lifting cover for 0.5s (practice first).  

  4. **Group Converges by Social Pressure**:  
     - *Private*: Wagering is written. In debrief, poll first, *then* ask for reasoning.  
     - Assign a “Devil’s Advocate” (rotating role) to challenge consensus in debrief.  

  5. **Activity Feels Like a Memory Quiz**:  
     - *Emphasize*: *“Don’t try to remember—just absorb.”* Use novel symbols each round to prevent rehearsal.  
     - Post-activity, clarify: *“This wasn’t about memory—it’s about what’s available *during* perception.”*  

  ---

  ### **Limitations & Mitigations**  
  - **The Phenomenal Gap**: The activity *implies* unreportable phenomenality but can’t prove it (since reports are our only tool).  
    - **Mitigation**: Lean into the wagering split. Say: *“Your disagreement *is* the phenomenon—some felt richness, others didn’t. That tension is where philosophy lives.”*  
  - **Global Workspace Lite**: The group task stages “broadcasting” (questions = global access) vs. “silent knowledge” (Perceiver’s unreported experience). This suffices for the debrief link.  

  ---

  ### **Instructor Cheat Sheet**  
  **DO NOT**:  
  - Use words like “access,” “phenomenal,” “consciousness,” or “buffer.”  
  - Explain *why* rounds are structured as they are.  
  - Resolve the wagering—declare it “unsettled by design.”  

  **DO**:  
  - Highlight *contrasts* (immediate vs. delayed cue; Perceiver’s silence vs. group’s guesses).  
  - In debrief, validate *both* intuitions: *“The rich view explains X; the sparse view explains Y.”*  
  - End with: *“This isn’t a trick—it’s a genuine puzzle. Your confusion is the point.”*  

  This design ensures students *feel* the gap before theorizing. The delayed cue makes the tension visceral, and the group task forces confrontation with unreportable states. By the debrief, they’ll grasp why introspection alone can’t settle the debate—setting up your theoretical framework perfectly.
