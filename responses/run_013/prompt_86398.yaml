prompt: |-
  You are a philosopher of metaphysics with expertise in persistence, tense, and the metaphysics of time. I am a graduate student working on a dissertation chapter on persistence, and I have been defending the following position in a seminar; I would like you to think carefully and, before answering, brainstorm a list of candidate defeaters, then organize your response around them. The position, which I have been calling temporal adverbialism about persistence, is this: ordinary material objects endure rather than perdure. They are wholly present at each time at which they exist, and they do not have temporal parts. The apparent relationality of tensed predication—a poker is bent at one time and straight at another—is not to be explained by relativizing properties to times or by positing temporal parts; rather, tensed predicates are true of an enduring object only under a temporal modifier, and the object's relation to a time is a primitive, non-mereological relation of temporal location. I also hold that the problem of temporary intrinsics, far from refuting endurance, is a reason to reject perdurantism, because it mislocates the indexicality of tense in the object rather than in the predicate. Assume I know the standard moves and the usual examples; do not spend time on definitions or a survey of who said what. I am not asking for a bibliography, reading list, or citations; I want the argument.

  Play it straight: what would count against this position? What would have to be true for it to be false? Which observations, arguments, intuitions, formal results, or developments should move me? What does temporal adverbialism predict that perdurantism, stage theory, and other rivals do not, and where does it risk making a claim that could be false? I want the defeaters ranked from fatal to merely awkward, and I want you to distinguish those that a committed temporal adverbialist would concede as genuine costs from those they would reasonably dismiss. In particular, consider cases of indeterminate persistence, fission and fusion, objects that change their temporal location, and any tension with relativistic physics or with the logic of temporal predication. Also tell me whether the view has been insulated by qualifications—whether primitive temporal location or the temporal modifier is doing substantive work or merely postponing the problem—and whether that insulation, if it exists, is a defect or simply what a view of this kind should do. I would personally be most moved by a case in which an object's persistence is genuinely indeterminate or in which the view cannot distinguish a change in an object from a change in its temporal location; if you think those cases do not actually threaten the view, say why.
reasoning: |-
  Okay, let me start by really digging into the user's query. They're a grad student defending temporal adverbialism in their dissertation. The core idea is that objects endure, being wholly present at each time without temporal parts. Tensed predicates need temporal modifiers, and temporal location is primitive. They want defeaters, ranked and analyzed.

  First, I need to recall the main challenges to endurance theories. The problem of temporary intrinsics is mentioned, but they think adverbialism handles it. So where else could it fail? Let me brainstorm potential defeaters.

  Fission cases come to mind. If an object splits into two, like an amoeba, how does adverbialism handle identity? Endurance typically relies on identity being absolute, but fission creates two distinct objects. Adverbialism might need branching identities or indeterminacy. But primitive location doesn't resolve this. That seems a big issue.

  Then there's indeterminate persistence. If it's vague when an object ceases to exist, adverbialism must explain this vagueness. If temporal modifiers are primitive, can they be vague? Perdurantism uses temporal parts to handle vagueness in existence. Adverbialism might struggle here, possibly leading to ontic vagueness, which some find problematic.

  Relativistic physics is another angle. In relativity, simultaneity is relative. Adverbialism's primitive temporal location assumes a frame-independent "now." But without a privileged frame, how does this work? They might need to adopt a Lorentzian interpretation, but that's a substantive commitment. This could be a major hurdle depending on the physics.

  Change in temporal location? If an object's location in time changes, like in time travel scenarios. Adverbialism treats location as a primitive relation. But if an object moves in time, how is that different from property change? The user mentioned this as a concern. If location changes, it might blur the line between location and intrinsic properties, which undermines the view's foundations.

  Now, formal logic of temporal predication. Adverbialism modifies predicates, not the object. But if predicates are indexed with modifiers, does that create complex, unstructured properties? For example, "bent-at-t" vs. "bent" with a modifier. Critics might argue this is just relabeling relational properties. The user is aware of this, but it's worth noting if it leads to other issues.

  Also, fusion cases. When two objects merge into one, endurance theories have to account for how two wholes become one without temporal parts. Adverbialism might need to say the new object comes into existence, but then persistence is interrupted. That could conflict with intuitions about continuous existence.

  Ranking these: fission is probably fatal because it directly challenges identity over time. Relativity might be fatal too if the user can't accept a preferred frame. Indeterminate persistence is serious but maybe manageable with ontic vagueness. Change in temporal location is tricky, but perhaps adverbialism can adapt by treating it as a special property change. The modifier issue might be awkward but not fatal.

  The user wants defeaters they'd concede as costs versus those dismissible. For example, they might dismiss the predicate modifier criticism as a non-issue, seeing it as a feature. But fission and relativity could be conceded as serious challenges needing creative solutions. Indeterminate persistence might be handled by embracing vagueness, though it's a cost.

  Also, checking if primitive location is doing real work or just postponing problems. In fission, it doesn't help. But in temporary intrinsics, it shifts the indexicality. So in some cases, it's substantive, in others, maybe not. The insulation might be a defect if it doesn't resolve new problems.

  The user is particularly concerned with indeterminate persistence and change in temporal location. For indeterminate persistence, adverbialism must accept vague existence, which some might reject. For location change, if time travel is possible, distinguishing location change from intrinsic change might collapse, forcing a perdurantist approach. That could be a strong defeater if such cases are possible.

  Overall, fatal issues: fission and relativity. Serious: indeterminate persistence and location change. Awkward: predicate modifiers and fusion. Committed adverbialists might bite bullets on vagueness or adopt non-standard identity, but relativity might require a hefty concession.
answer: |-
  Here is a ranked analysis of defeaters for Temporal Adverbialism (TA), organized from potentially fatal to awkward. I focus on structural tensions, empirical consequences, and explanatory gaps, assuming familiarity with core debates. The key vulnerability is TA's reliance on **primitive temporal location** and **non-relational temporal modifiers** to avoid temporal parts. Defeaters arise where these primitives struggle with asymmetry, indeterminacy, or relativity.

  ### **Fatal Defeaters (Threaten Core Coherence or Empirical Adequacy)**
  1. **Special Relativity & the Loss of Absolute Simultaneity**  
     - **What must be true for this to defeat TA**: If there is no privileged foliation of spacetime (no absolute "now"), TA's primitive relation of temporal location lacks a non-arbitrary basis.  
     - **Why it's fatal**: TA requires a metaphysically substantive "temporal location" relation tying an object to a *unique* time-slice or hyperplane. Relativity denies this. A perdurantist can ground persistence in spacetime worms without privileging a frame; TA cannot without contradicting relativistic invariance.  
     - **Conceded cost?** A TA defender must either (a) embrace Lorentzian substantivalism (privileging a frame) or (b) deny relativistic orthodoxy. Both are heavy burdens. If (a), it's a substantive (not ad hoc) move but isolates TA from modern physics.  

  2. **Fission with Symmetric Branching**  
     - **Case**: An amoeba splits into two qualitatively identical descendants (A and B) at t₂. At t₁, is the original O located *only* at t₁, or indeterminately at both branches?  
     - **Threat**: TA rejects temporal parts, so O cannot have two future "arms." If O is wholly present at t₁, its persistence must resolve to *either* A or B (not both). But symmetry precludes non-arbitrary resolution. Perdurantism handles this via overlapping pre-fission parts; stage theory via counterpart relations.  
     - **Why fatal**: TA cannot account for identity indeterminacy without smuggling in temporal multiplicity. If O's location at t₂ is primitive and singular, fission forces either contradiction (O = A and O = B) or brute disappearance.  
     - **Conceded?** TAists might bite the bullet (O ceases to exist at fission) or posit primitive indeterminacy in location. The former violates persistence intuitions; the latter risks collapsing into ontic vagueness, which TA typically resists.  

  ### **Serious Defeaters (Force Costly Revisions or Radical Primitivism)**
  3. **Indeterminate Persistence (Vague Existence)**  
     - **Case**: A cloud dissipates gradually; there's no sharp moment it ceases to exist. Is the cloud located at a borderline time t?  
     - **Threat**: TA ties existence to primitive location. If location is determinate, vagueness must be semantic (but "cloud" is precise?). If location is vague, what grounds it? Perdurantism locates vagueness in part composition; TA has no analogous resource.  
     - **Why serious**: TA predicts that temporal location is all-or-nothing. To handle vagueness, it must either (a) deny ontic indeterminacy (implausible for clouds), or (b) make temporal location itself vague—a primitive with indeterminate relata. This inflates primitivism.  
     - **Conceded?** A TAist might embrace vague location as a brute fact, but this undermines the view's parsimony advantage over perdurantism.  

  4. **Change in Temporal Location (Time Travel)**  
     - **Case**: A time machine "moves" an object from t₁ to t₂. How does TA distinguish the object *changing its temporal location* from the object *gaining/losing properties* at a fixed location?  
     - **Threat**: For TA, temporal location is primitive and non-mereological. If the object is "wholly present" at t₁ and then at t₂, what persists? If nothing, it's not persistence; if something, TA needs a transtemporal identifier *beyond* location. Perdurantists use spacetime paths; TA lacks this.  
     - **Why serious**: TA reduces persistence to location-at-times. But if location can change, persistence requires *that which* changes location—undermining the reduction. This forces a bare particular or haecceity, conflicting with TA's focus on adverbial modification.  
     - **Conceded?** TAists might deny coherent time travel or treat "movement" as a property (e.g., "time-displaced-at-t₂"). This reframes but doesn't eliminate the need for an enduring "thisness."  

  ### **Awkward Defeaters (Explanatory Gaps or Counterintuitive Outcomes)**
  5. **Temporal Predication and Modal Uniformity**  
     - **Issue**: TA treats "bent-at-t" as a modified intrinsic property. But if "at-t" is a non-relational modifier, why do these modifiers behave like relations (e.g., if bent-at-t₁, not bent-at-t₂)? Perdurantism explains this via part-indexing.  
     - **Why awkward**: TA insists the object itself is bent—but only *when* temporally modified. This resembles a hidden relativization, risking a "temporal qualia" problem. If the modifier is primitive, TA gains no clarity over perdurantism's temporal indexing.  
     - **Dismissible?** TAists argue this is precisely the view's insight: tense is adverbial, not relational. But it struggles with *why* modifiers distribute over times like relations unless the modifier *is* covertly relational.  

  6. **Fusion and Overlapping Objects**  
     - **Case**: Two rivers merge into one. At t₁, rivers A and B are wholly present; at t₂, only river C is. How did A and B "lose" their locations?  
     - **Threat**: Perdurantism handles fusion via part-sharing. TA must say A and B ceased to be located (i.e., ceased to exist) and C began. But this ignores continuity—C seems composed of A and B's waters.  
     - **Why awkward**: TA's strict endurance makes fusion discontinuous, conflicting with mereological intuitions. It cannot say A and B "become" C without temporal parts.  
     - **Dismissible?** TAists may embrace this discontinuity (e.g., van Inwagen) or invoke constitution. Costly but not fatal.  

  ### **Insulation Assessment: Primitives vs. Postponement**
  - **Temporal Location**: Does substantive work by grounding existence and change without parts. But in fission/relativity, it *postpones* by refusing to decompose persistence. This is defensible if you reject temporal parts on principle, but the primitives become strained under indeterminacy or relativity.  
  - **Temporal Modifier**: Risks being a relabeling of "relative to t." If modifiers are unstructured (e.g., no logic linking "at-t₁" and "at-t₂"), TA gains no advantage over perdurantism. If structured, it approaches hidden relativism.  

  ### **Your Key Concern: Indeterminacy vs. Change in Location**
  - **Indeterminate Persistence**: As above, TA must either deny it (implausible) or accept vague primitive location (costly). This *does* threaten TA because endurance traditionally rejects vague identity.  
  - **Change in Location**: This exposes TA's core tension: if persistence *is* location-at-times, changing location implies the *end* of persistence. To avoid this, TA needs a deeper ground for diachronic identity—which its primitives deliberately avoid.  

  **Conclusion**: TA's most vulnerable points are **relativity** (empirically weighty) and **symmetric fission** (structurally incoherent without temporal multiplicity). Indeterminacy and time travel force concessions that erode its simplicity advantage. A committed TAist might defend the primitives as the "least bad" option for endurance, but rivals handle these cases with fewer surprises. To test your resolve, ask: *Can TA explain why fission isn't a case of two futures for one object without temporal parts?* If not, it may not survive contact with biology or quantum decoherence.
