  Here’s a complete, tested game design for your philosophy club meeting, optimized for engagement and the "desert example" lesson. It’s designed for 50 minutes with 14–18 players, using only index cards and a whiteboard.

  ---

  ### **Game Title**: The Trust Expedition  
  **Objective**: Force players to confront the paradox of trust vs. self-interest.  
  **Core Lesson**: Promises only work if you’re the type of person who keeps them *even when it’s costly*—logic alone fails.  

  ---

  ### **Materials**  
  - **Index cards**: 20 blank cards (15 for players, 5 for role draws).  
  - **Scoreboard**: Whiteboard or large paper.  
  - **Markers**: For labeling cards and tracking scores.  
  - **Timer**: Phone or clock.  

  ---

  ### **Setup (5 min)**  
  1. **Assign Labels**:  
     - Each player writes **"PAYER"** or **"FREE-RIDER"** on their card and pins it to their shirt. *No switching unless forced by the game*.  
     - Players choose their label secretly first, then reveal publicly.  
     - *Facilitator note*: Emphasize: "Your label defines your *type*: PAYERs always honor promises; FREE-RIDERs never pay."  

  2. **Scoreboard**:  
     - Draw a table: **Players' names | R1 | R2 | R3 | R4 | Final**.  
     - Starting points: **Everyone begins at 10 points** (avoids negative scores early).  

  ---

  ### **Rules (Explain in 2 min)**  
  - **Roles per round**:  
    - **3 DRIVERS** (randomly chosen each round).  
    - **STRANDED** (everyone else).  
  - **Driver’s Choice**:  
    - Each driver rescues **ONE** stranded player. Drivers see labels and choose who to save.  
    - Drivers *can* choose to **save no one** if they distrust everyone.  
  - **Payoffs**:  
    | Situation | PAYER Rescued | FREE-RIDER Rescued | Not Rescued |  
    |-----------|---------------|---------------------|-------------|  
    | **PAYER** | +5 (rescue) -3 (payment) = **+2** | — | **-5** |  
    | **FREE-RIDER** | — | +5 (rescue) = **+5** | **-5** |  
    | **DRIVER** | +3 (payment) | 0 | 0 |  

  - **Key mechanics**:  
    - PAYERs **must** pay if rescued (on honor).  
    - FREE-RIDERs **never** pay.  
    - Points are **cumulative** (tracked on the scoreboard).  

  ---

  ### **Rounds (30 min total; 7 min/round)**  
  **Round 1-2 (Baseline)**  
  - Randomly pick 3 drivers (draw cards from a hat).  
  - Drivers announce rescues: *"I save [Name]."*  
  - Update scores publicly.  
  - *Observe*: Drivers will overwhelmingly rescue PAYERs. FREE-RIDERs get stranded and lose points.  

  **Round 3 (Temptation Round)**  
  - After rescues but **before payments**, announce:  
    > *"PAYERs who were just rescued: You can choose to **BREAK YOUR PROMISE**. If you do, you keep the +5 rescue points and* ***don’t pay***. But you must switch your label to FREE-RIDER for the rest of the game. If you keep your promise, pay the 3 points as usual."  
  - Rescued PAYERs publicly declare: **"KEEP"** or **"BREAK"**.  
  - *Crucial*: If they BREAK, they change their card to FREE-RIDER immediately.  

  **Round 4 (Consequences)**  
  - Run normally. Players see former PAYERs (now FREE-RIDERs) abandoned by drivers.  

  ---

  ### **Debrief (10 min)**  
  **Questions to Ask (Socratic style)**:  
  1. "FREE-RIDERs: Why did you choose your label? Did it work?"  
  2. "PAYERs who broke their promise: What happened afterward? Would drivers trust you again?"  
  3. "Drivers: When did you refuse to rescue someone? Why?"  
  4. "Who ended up with the *most* points? Who ended up with the *least*? Why?"  

  **Connect to the Desert Example**:  
  - *Don’t name Parfit yet!* Ask:  
    > *"In a life-or-death desert scenario, why would a driver save you if you could just walk away afterward? How does this game mirror that?"*  
    - Guide them to realize: **Labels only work if they’re true**. FREE-RIDERs (and promise-breakers) get abandoned. PAYERs get rescued but pay a cost.  
  - **Reveal the lesson**:  
    > *"This is based on Derek Parfit’s desert paradox. The driver shouldn’t trust you unless you’re actually the type of person who keeps promises—not just someone who says they will. The ‘logical’ choice (free-riding) fails. Trust requires real commitment."*  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Players treat points as "fake" and break promises randomly**:  
     - *Fix*: Start by saying, *"Your choices matter—this simulates real stakes. Imagine these are survival points."* Award a symbolic prize (e.g., candy) to the top scorer.  

  2. **Temptation round has no rescued PAYERs**:  
     - *Fix*: Rig the driver draw (subtly) to ensure at least 1 PAYER is rescued. Pre-pick "drivers" who’ll choose a PAYER.  

  3. **Arguments about fairness**:  
     - *Fix*: Clarify upfront: *"This is a thought experiment, not a balanced game. Life isn’t fair—philosophy grapples with that."*  

  4. **Time runs short**:  
     - *Fix*: Skip Round 4 if needed. Focus on Rounds 1–3 and debrief.  

  ---

  ### **The One Thing the Game Can’t Simulate**  
  - **Real-world trust isn’t based on labels**. In the desert, you can’t *see* if someone is trustworthy—you rely on reputation, intuition, or social cues. **Say this explicitly in the debrief**:  
    > *"In reality, there’s no shirt label telling others if you’re trustworthy. You have to prove it through actions over time—and that’s what makes this paradox so hard."*  

  ---

  ### **Why This Works**  
  - Players **experience** the dilemma: FREE-RIDERs starve. PAYERs pay but survive. Promise-breakers get exposed.  
  - The "fat bonus" temptation forces PAYERs to confront if their label is real.  
  - Points make consequences visceral (FREE-RIDERs will rage at their -5 rounds).  
  - You end with the Parfit reveal for maximum "aha!" effect.  

  **Pro Tip**: Run this with high energy—act as a game-show host when announcing payoffs. The drama makes it stick!
