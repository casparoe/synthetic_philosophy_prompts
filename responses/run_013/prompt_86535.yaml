          - The ensemble average was high due to a few very lucky winners, but the median player had a more typical outcome. This highlights the difference between the time-average growth (which is what an individual experiences over time) and the ensemble average (which is what you see across many individuals at a fixed time). The ensemble average is dominated by the rare very large outcomes.

     - In the multi-coin:
          - For multiple independent bets, the Kelly criterion says to bet the optimal fraction (0.2) on each bet, provided the bets are independent and you can cover the losses.
          - Betting more than the optimal fraction on any one bet reduces the growth rate.
          - Concentrating the bet on one coin (even if the total fraction is the same as the diversified bet) is riskier and has a lower growth rate.

     - Why "geometric rationality" is a stance:
          - Expected value (linear) maximization would suggest betting the entire bankroll on each bet (because the edge is positive), but that leads to almost sure ruin.
          - The Kelly criterion maximizes the exponential growth rate, which is a different objective. It is a stance that one should maximize the long-run growth rate, which is appropriate for repeated bets.
          - It is not the only rational stance: one might be more risk-averse and bet less than Kelly, or be willing to take more risk for a chance of a big win.

