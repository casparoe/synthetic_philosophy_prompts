  ### Betting Game: Growth vs. Ruin  
  **Core Mechanic:** Players choose a fixed fraction of their current bankroll to bet each round on a biased coin (60% heads, even-money payout), then experience identical flip sequences to isolate strategy effects.  

  ---

  #### **Rules & Materials**  
  - **Players:** 14 grad students + keen undergrads (adjust as needed).  
  - **Starting Bankroll:** 100 chips each.  
  - **Rounds:** 30 rounds for single-coin phase; 10 rounds for multi-coin (if time).  
  - **Coin Bias:** 60% heads, 40% tails. Payout: Win = +100% of stake, loss = -100% of stake.  
  - **Betting Rule:** Each player writes a fraction (e.g., 0.2) on an index card before Round 1. This fraction of their **current bankroll** is bet on heads every round.  
  - **Multi-Coin (Phase 3):** Three independent 60/40 coins per round. Players write a fraction for each coin (e.g., [0.2, 0.2, 0.2]), with the sum ≤ 1.  
  - **Sequence:** All players face the same pre-generated flip sequence(s) (e.g., 18 heads, 12 tails in a risky order like `T,T,T,T,H,H,...`).  
  - **Winner:** Highest bankroll wins a small prize (e.g., novelty "Risk Taker" trophy).  

  ---

  #### **Timeline (75 min)**  
  1. **Intro (5 min):**  
     - Explain rules. Emphasize: "Fraction of **current** bankroll, same flips for all."  
     - Players write single-coin fraction on cards.  

  2. **Single-Coin Simulation (25 min):**  
     - Display flip sequence (pre-generated with 12 tails, 18 heads; include a run of 4+ tails early to break overbettors).  
     - After each flip, players update bankroll:  
       - Win: `new = old + (fraction × old)`  
       - Lose: `new = old - (fraction × old)`  
     - *Spreadsheet tip:* Pre-calculate outcomes for common fractions (0.0–1.0) to save time.  

  3. **Tally & Discuss Single-Coin (15 min):**  
     - Collect ending bankrolls. **Plot on board:**  
       - Average bankroll (high! due to aggressive survivors).  
       - Median bankroll (low! most players near zero).  
       - Bankrolls by fraction (e.g., f=0.2 vs. f=0.6).  
     - **Reveal:** Many with f>0.2 are broke; f=0.4 may beat f=0.2 due to luck.  

  4. **Multi-Coin Simulation (15 min, if time):**  
     - Players write a fraction for each of 3 coins (sum ≤ 1).  
     - Run 10 rounds with pre-generated outcomes (include a round with 3 tails).  
     - Update bankroll per round:  
       - Net change = `(f1 × r1) + (f2 × r2) + (f3 × r3)`, where `r = +1 (win)` or `-1 (loss)`.  
       - `new = old × (1 + net change)`.  

  5. **Debrief (15 min):**  
     - **Key Observations:**  
       - Ensemble average >> median (skewed by few aggressive winners).  
       - Most overbettors (f>0.2 single; f>0.2/coin multi) went broke despite positive EV.  
       - Multi-coin: Betting full edge (0.2) on all 3 coins (total 0.6) is optimal; betting more (e.g., 0.3/coin) or concentrating (e.g., 0.6 on one) underperforms.  
     - **Map to Concepts:**  
       - **Growth-Optimal Fraction (Kelly):** `f* = p - q = 0.6 - 0.4 = 0.2` for one coin. Maximizes expected log-wealth.  
       - **Log Utility:** Maximizing geometric growth rate (long-run dominance) ≠ maximizing arithmetic EV (short-run wins).  
       - **Time-Average vs. Ensemble:** In finite trials, ensemble averages are skewed by outliers; time-averages converge to median.  
       - **"Geometric Rationality":** A stance prioritizing survival and compounding—no theorem proves it universally "rational."  
     - **Reveal the Name:** "This is the **Kelly criterion**."  

  ---

  #### **Predictable Issues & Mitigations**  
  - **Confusion over "current bankroll":** Clarify with examples (e.g., "If you have 80 chips and bet f=0.5, you stake 40").  
  - **Calculation delays:** Use a spreadsheet/projector for real-time updates.  
  - **Aggressive fractions dominate accidentally:** Use a sequence with early tails (e.g., `T,T,T,T` first) to break f≥0.75 players.  
  - **Misinterpreting multi-coin:** Emphasize that "betting your edge" (0.2/coin) is optimal; overbetting means exceeding 0.2 per coin.  

  ---

  #### **What the Game Can’t Teach (Supply by Talking)**  
  - **Kelly is asymptotic:** In 30 rounds, luck matters—e.g., f=0.4 may beat f=0.2. Stress that Kelly wins long-run.  
  - **Risk aversion vs. growth:** Some may prefer betting <0.2 to reduce volatility. Kelly isn’t "right," it’s growth-optimal.  
  - **Overbetting ≠ irrational:** If utility isn’t logarithmic (e.g., one-shot bets), maximizing EV may be defensible.  

  ---

  #### **Why Your Setup Works**  
  Your design correctly exposes the divergence:  
  - **Fixed sequence** cancels luck, isolating strategy.  
  - **Ensemble average vs. median** reveals skew (most players go broke; average is lifted by aggressive survivors).  
  - **Multi-coin phase** shows naive "bet edge" application (0.2/coin) is correct, while overbetting (f>0.2/coin) or misallocation fails.  
  - **No conflation:** The game shows Kelly maximizes growth, but you’ll clarify that "rationality" depends on goals.  

  Start the next session with: *"Write your fraction—what part of your stack will you bet?"* Then let the coin do the teaching.
