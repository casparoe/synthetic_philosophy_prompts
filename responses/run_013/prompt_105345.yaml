answer: |-
  ### Bottom Line  
  Students will unknowingly simulate epiphenomenalism by generating "private state" reports based solely on external signals and fixed rules, then confront the causal disconnect when their trusted reports are revealed as decoupled from the actual states.  

  ### Reasoning  
  Your seed works but needs three repairs: (1) The "private state" must feel real yet be unobservable to reporters, (2) reports must appear reliable through deliberate calibration, and (3) the reveal must force students to question *why* they trusted their reports despite zero causal links. I’ll use sealed envelopes (private states) and signal cards (neural triggers) to create a lookup-table dynamic, ensuring reporters believe their rules are accurate until a critical mismatch exposes the illusion.  

  ### Activity Design: "The Signal Room"  
  **Goal:** Experience generating "conscious state" reports driven by external triggers, then discover those reports never causally interact with the states they describe.  
  **Time:** 80 minutes (activity: 55 min; debrief: 25 min).  
  **Roles (15 students):**  
  - **5 Observers:** Know the true private states and send signals.  
  - **5 Reporters:** Receive signals and output state reports.  
  - **5 Verifiers:** Record reports and later check against "private states."  
  *Rotate roles if time allows, but one full cycle suffices.*  

  **Materials:**  
  - **Private State Kits:** 5 sealed envelopes per round (e.g., "RED," "BLUE" written inside; envelopes numbered 1–5).  
  - **Signal Cards:** 15 cards (3 identical sets of 5 colors: e.g., ⬛️, ⬜️, 🟥, 🟦, 🟩).  
  - **Rule Sheets:** For Reporters: "Report the state matching the signal: ⬛️ = RED, ⬜️ = BLUE, etc." (Rules are 80% accurate; see calibration below).  
  - **Report Logs:** For Verifiers to document Reporter statements.  

  **Rules:**  
  1. Observers see the envelope numbers but *not* contents. Only a teacher-assigned "Truth Keeper" (you) knows the true states.  
  2. Reporters *never* see envelope contents—they only receive signals and follow rule sheets.  
  3. Verifiers only hear Reporters’ verbal announcements (e.g., "Envelope 1 is RED!").  

  **Timeline:**  
  1. **Setup (5 min):** Assign roles. Explain: "We’re testing how well humans report hidden states using signals. Observers send signals, Reporters convert signals to state announcements, Verifiers log reports." Hide that envelopes contain colors.  
  2. **Calibration Rounds (20 min):**  
     - Run 3 trials. For each trial:  
       - Truth Keeper secretly fills envelopes (e.g., Envelope 1: RED).  
       - Observers send signal ⬛️ to Reporter 1 (signal matches rule: ⬛️ = RED).  
       - Reporter 1 announces: "Envelope 1 is RED!"  
       - Verifiers log it.  
     - *Calibration trick:* Make 4/5 reports per trial "correct" (e.g., signal matches envelope). Purposefully include one "error" (e.g., signal 🟦 but envelope says RED) to mimic real-world noise.  
  3. **Critical Round (15 min):**  
     - Truth Keeper *changes* envelope contents secretly (e.g., Envelope 1 now BLUE).  
     - Observers send the *same* signals as before (⬛️ to Reporter 1).  
     - Reporters announce based on rules (Reporter 1: "Envelope 1 is RED!").  
     - Verifiers log reports.  
  4. **Reveal & Discovery (15 min):**  
     - Open envelopes: Show Reporters their announcements (RED) mismatched actual states (BLUE).  
     - Ask: *"Why did you trust your reports? What were you actually responding to?"*  
     - Let Reporters see their rule sheets and signals. Highlight: Their reports tracked signals, not envelopes.  
  5. **Silent Reflection (5 min):** Prompt: *"Could your reports ever ‘know’ the envelope states? Why did they feel reliable?"*  

  ### Debrief (25 min)  
  **Map to Paradox:**  
  - **Private State (envelope)** = Qualia (e.g., seeing red).  
  - **Signal + Rule** = Neural mechanisms (causally sufficient for reports).  
  - **Report (e.g., "RED!")** = Phenomenal judgment ("I’m seeing red!").  
  - **Calibration** = Illusion of reliability (reports align with states by coincidence, not causation).  
  - **Critical Round** = Epiphenomenalist dilemma: Reports are *always* driven by signals/rules, never by the private state itself.  

  **Predictable Issues & Fixes:**  
  - **Problem:** Reporters peek at envelopes.  
    - *Fix:* Use opaque envelopes; threaten disqualification.  
  - **Problem:** Students dismiss it as "just a game."  
    - *Fix:* In debrief, ask: "What if your *actual* ‘I see red’ reports work like this?"  
  - **Problem:** Observers confuse roles.  
    - *Fix:** Simplify: Observers only pass signals—no state knowledge.  
  - **Problem:** Critical round feels like a "trick."  
    - *Leverage it:* "Yes! Epiphenomenalism makes consciousness feel like a trick—why trust judgments if they’re side effects?"  

  **Limitations & What You Must Supply:**  
  - **The activity CAN’T replicate:** The *subjective certainty* of first-person experience. Students *know* envelopes are external, but we feel our judgments are directly caused by qualia. Explicitly say: *"Unlike this game, your ‘red’ feels immediately present—yet epiphenomenalism says that feeling is an illusion. The activity shows the causal structure; you must confront why it feels different."*  
  - **Bridge the gap:** Contrast the reporters’ doubt ("I was just following rules") with our real-world conviction ("But I *know* I see red!"). Argue: If epiphenomenalism is true, our certainty is a brute fact without justification.  

  **Closing Hook:**  
  "Epiphenomenalism doesn’t just make consciousness inert—it makes our *talk* about consciousness a cosmic accident. The activity lets you *feel* that disconnect. Nadia’s shrug? That’s the sound of philosophy hitting a wall." Run this tight, and they’ll leave arguing.
