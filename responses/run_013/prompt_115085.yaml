  Final principle: Multiple things compose a single object if they are (a) cohesively bound or (b) functionally integrated in a persistent system. Cohesion covers rocks and cats (tissues bound). Functional integration covers swarms, reefs, flames. Disallows sand piles (no cohesion, minimal function), disassembled bikes, shoe+Eiffel Tower. For the statue and bronze: they share parts but different identities because the statue's function depends on form, while bronze is material. So two things occupying same space, distinguished by properties.

  Predictions: Virus—functionally integrated, so thing. River—cohesive flow, thing. Traffic jam—event, not thing. Coma person—functional potential, thing. Cell turnover—persistent organization, thing. Piano carriers—temporary, not thing. Puddle—aggregate, not thing. Forest fire—event. Queue—social arrangement, not object. Economy—system, but abstract, so not a concrete object. Computation across machines—functional system, but distributed, so not a single object.

  Unresolved: The cloud. If functional (rain-producing), maybe yes. But user is unsure. Principle might say no due to low cohesion. The twin's half: not a functional unit alone. The coral reef: functional integration, so thing. Friend's sand pile vs. swarm: swarm has purpose, sand doesn't.

  User's verdicts that can't be held: Perhaps the whirlpool not being a thing, but hurricane is. Principle might classify both as processes. User calls hurricane one thing, so functional persistence key. Whirlpool is water movement without a system, so not a thing. Candle flame: process with identity, so included.

  Conclusion: The principle combining cohesion and functional integration explains most cases. Costs: Borderline cases like clouds remain fuzzy. Statue/bronze handled by distinguishing form-based vs. material identity. Sand pile excluded due to lack of cohesion/function. Swarm included via function. Twins: two persons due to separate minds. Western half of cat: not functionally independent.
answer: |-
  Here's a precise principle based on your intuitive verdicts, designed to resolve the tensions in your examples while being testable on new cases. The core idea is **functional unity with persistence conditions**, supplemented by cohesion for inert objects. This handles your judgments better than "ongoing process" alone.

  ### The Principle
  **Multiple things compose a single object X if and only if:**  
  1. **Functional Integration:** The parts are organized to collectively perform a *distinct, persistent function or behavior* that isn't reducible to the mere sum of their individual properties.  
     - *OR*  
  2. **Cohesive Binding:** The parts are physically bonded (e.g., chemically, molecularly) into a stable structure with *spatio-temporal continuity*, even if inert.  

  **Exclusion Clause:** If the candidate "whole" exists solely because of external forces (e.g., a container, gravity, or human intention), it is not a unified object.  

  ### Why This Captures Your Verdicts
  - **Your wins:**  
    - Cat, car, bicycle (assembled): Satisfy (1) — parts work together for locomotion/survival.  
    - Candle flame: Satisfies (1) — persistent oxidative process with emergent properties (heat/light).  
    - Bee swarm, ant colony, coral reef: Satisfy (1) — collective behavior (defense/foraging) irreducible to individual insects/coral polyps.  
    - Rock: Satisfies (2) — cohesive mineral bonding.  
    - Disassembled bicycle: Fails both — no functional integration or cohesion.  
    - Sand pile: Fails both — grains aren't functionally integrated (no collective purpose) or cohesively bound.  
    - Twins sharing a heart: Two objects (people) — each brain supports distinct cognition (functional integration for each mind).  
    - Shoe + Eiffel Tower: Fails — no functional or cohesive unity.  
    - Statue and bronze: Two things — statue satisfies (1) (representational function), bronze satisfies (2) (metallic cohesion). They occupy the same space but have different persistence conditions (e.g., melting destroys statue but not bronze).  

  - **Resolves friend's objections:**  
    - Sand pile vs. bee swarm: Swarm has functional integration (collective thermoregulation/defense), sand pile does not.  
    - Statue vs. sand pile: Statue has a function (aesthetic representation), sand pile has no function *as a pile*. The grains are just grains, regardless of arrangement.  

  - **Borderline cases explained:**  
    - Cloud: Fails (1) and (2) — no collective function (water droplets don't "act as a unit"), no cohesion (diffuse). Your flip-flop is normal — clouds are *vague* objects.  
    - Whirlpool: Fails (1) — water movement is not a *function* but a transient pattern. Hurricane *satisfies (1)* — it maintains a self-sustaining energy cycle (heat/moisture exchange).  
    - Company/country: Functional integration (economy/governance), but abstract — so "thing" in a *system* sense, not concrete.  

  ### Predictions for New Cases
  | Case                  | Prediction                             | Why                                                                 |
  |-----------------------|----------------------------------------|---------------------------------------------------------------------|
  | **Virus**             | One thing (if intact)                 | Functional integration (replication machinery) and capsid cohesion. |
  | **River**             | One thing                             | Functional integration (persistent flow shaping landscape).         |
  | **Traffic jam**       | Not a thing                           | No collective function; emergent pattern from individual cars.      |
  | **Person in a coma**  | One thing (person)                    | Functional integration (neural/biological unity persists).          |
  | **Cells turning over**| One thing (body)                      | Functional integration (homeostasis maintained).                    |
  | **Two people carrying piano** | Not a thing                  | Temporary coordination; no *persistent* functional unity.           |
  | **Puddle drying**     | Not a thing                           | Aggregate held by gravity; no function/cohesion.                   |
  | **Forest fire**       | Not a thing (but a process)           | Transient event; no persistent functional unity.                    |
  | **Queue**             | Not a thing                           | Social arrangement; no emergent function beyond individuals.        |
  | **Economy**           | Abstract system (not concrete object) | Functional integration exists, but it's not a *physical* whole.     |
  | **Distributed computation** | Not a thing                 | Parts lack spatial continuity; function is software, not hardware unity. |

  ### Costs and Contested Points
  1. **Your verdicts the principle CANNOT hold:**  
     - **The whirlpool:** You said "not a thing," but hurricanes are. The principle *agrees* if you accept that hurricanes have a self-sustaining function (energy cycle) while whirlpools do not. If you insist whirlpools *are* things, the principle breaks.  
     - **The western half of your cat:** You said "not a thing," but the principle *allows* it if it could theoretically function alone (e.g., in a hypothetical split-brain scenario). You must insist on *organism-level* function to exclude this.  

  2. **Settled vs. Live Disputes:**  
     - **Settled:**  
       - Mere contact (bricks) or aggregation (sand pile) doesn't create a new object.  
       - Artefacts (bicycles, statues) can be objects if functionally unified.  
     - **Live Disputes:**  
       - **Vagueness:** Clouds, forests, mountains — all lack sharp boundaries. Philosophers debate if "objecthood" is all-or-nothing (your principle rejects them) or graded (you flip-flop).  
       - **Function vs. Cohesion:** Is a rock *really* an object? Some argue all cohesion reduces to function (e.g., molecular bonds). Your rock verdict requires accepting cohesion as primitive.  
       - **Overlap:** Statue/bronze shows two objects can coincide. Some philosophers reject this; your principle requires it.  

  3. **Edge Cases Exposed:**  
     - **Candle flame (newly lit):** Functional integration exists from ignition onward, so it *is* a thing.  
     - **Settling swarm:** If bees are mid-settling but not yet coordinated, functional integration is partial — so *vague* (like a cloud).  
     - **Coral reef (dead):** If no polyps remain, it reverts to inert rock (cohesion only).  

  ### Final Verdict
  Your gut judgments align with **functional cohesion**: unity requires either collective purpose (bee swarm) or intrinsic bonding (rock). This avoids your friend's sand/swarm equivalence and resolves the statue/bronze duality. The cost is accepting that *some things are vague* (clouds) and that *two things can occupy the same space* (statue/bronze). If you reject those, no consistent principle saves all your verdicts — but this comes closest.  

  If you test a new case, apply:  
  1. Do parts work as a *system* (not just interact)?  
  2. Are they *stuck together* by internal forces?  
  3. If neither, it's not a unified thing.  

  This should cover 90% of your road-trip rage.
