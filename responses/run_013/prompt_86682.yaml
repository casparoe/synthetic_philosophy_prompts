  Hmm, they're clearly well-versed in decision theory concepts - they mention superrationality, team reasoning, Kantian ethics, and acausal trade but feel none fit perfectly. Their frustration is palpable: they want precise conceptual boundaries, not just labels. The real pain point seems to be about partial alignment - when agents aren't identical copies and values only partially overlap. That's where existing frameworks get messy.

  Let me unpack their core mechanism first. The magic happens through evidential reasoning: my choice reveals information about what similar reasoners would do. It's not about changing others' actions but updating my beliefs about the world-state. The key ingredients seem to be: correlated decision algorithms (so my choice predicts theirs), overlapping interests (so their cooperation benefits me), and epistemic distance (no causal links).

  *scratches head* Why do existing concepts miss the mark? Superrationality assumes identical agents and symmetric payoffs. Team reasoning requires adopting a collective perspective. Kantianism is deontological, not evidential. Acausal trade focuses on explicit value exchange. None handle the "statistically similar but not identical" case gracefully.

  For naming... "Correlated Equilibrium Coordination" feels right. It emphasizes the decision correlation without requiring identity. The equilibrium part captures the stable expectation alignment. Coordination distinguishes it from trade.

  Testing boundaries: Identical agents? Included. Statistical similarity? Included if correlation exists. Common knowledge? Not strictly needed. Small worlds? Tricky - fails if correlation can't form. Conflicting values? Only if overlaps exist. Repeated games? Excluded since causal links emerge.

  *realizes why this matters* Getting this right prevents misapplication - you wouldn't use this logic in small-scale interactions. Ethically, it offers a non-supererogatory basis for cooperation when causation fails. The user's probably wrestling with real-world coordination problems where standard game theory falls short. This could bridge individual rationality and collective good in climate change or AI alignment scenarios.
answer: |-
  ### Nearest existing concepts

  **1. Superrationality (Douglas Hofstadter):**  
  Captures the core evidential reasoning where identical agents with common knowledge of rationality choose as if their decisions are perfectly correlated. Diverges by requiring strict symmetry: agents must use identical decision algorithms, face identical payoffs, and have common knowledge of this symmetry. Your scenario relaxes these—agents need only be "relevantly similar," not identical, and values may overlap partially rather than perfectly align. Superrationality also typically assumes small worlds (few agents), while your dispersed agents imply large-scale statistical correlation without direct epistemic links.

  **2. Kantian Universalizability:**  
  Matches the idea that an agent's action should be chosen only if it would be beneficial if universally adopted. Diverges fundamentally: Kantianism is a deontological moral principle, not an evidential decision-theoretic mechanism. Your phenomenon is about *rational self-interest* updated by evidence of correlated choices, whereas Kantianism prescribes duty irrespective of consequences. It also requires agents to abstractly "will the maxim as universal law," not update beliefs based on algorithmic similarity.

  **3. Acausal Trade (e.g., in multiverse ethics):**  
  Aligns in exploiting logical correlations between agents’ decisions without causal interaction. Diverges by focusing on explicit *trade*: agents with differing resources/values coordinate to mutual advantage (e.g., "I grow apples if you grow oranges"). Your case lacks trade; agents perform *similar* actions benefiting each other symmetrically (e.g., both cooperating). Acausal trade also often assumes known counterfactual dependencies ("if I do X, they do Y"), while your mechanism relies on statistical correlation from shared reasoning traits.

  **4. Team Reasoning (e.g., Bacharach):**  
  Resembles the shift from individual to collective payoff maximization. Diverges by requiring agents to adopt a "team utility function," overriding self-interest. Your agents remain individualistic, using their own values and evidence to rationally expect reciprocity. Team reasoning is a psychological switch in agency ("we-mode"), whereas your phenomenon is epistemic—updating beliefs about others based on one’s own choice.

  ---

  ### The phenomenon itself

  The mechanism is **evidence-based reciprocal expectation**. When agents share sufficiently similar decision procedures (due to common training, biology, or cultural conditioning), an agent’s own choice provides Bayesian evidence about choices of other such agents. By choosing cooperation, the agent observes they are in a "cooperator cluster" of a correlated decision algorithm; defection suggests a "defector cluster." This correlation arises *not* from causal links or explicit coordination, but from shared traits in reasoning under uncertainty. 

  **Essential elements:**  
  - **Correlated algorithms:** Agents’ decision processes must be statistically dependent (e.g., similar rationality, heuristics, or values).  
  - **Overlapping values:** Each agent must value others’ cooperation enough to offset their individual cost (though values need not fully align).  
  - **Epistemic isolation:** No communication or causal influence, ensuring the only evidence about others comes from one’s own reasoning.  
  - **Large-scale dispersion:** Many agents ensure individual actions don’t disrupt aggregate correlation.  

  **Incidental:** Identical payoffs, common knowledge, or moral motivations. The core is evidential—updating beliefs about correlated behavior through reflexive reasoning.

  ---

  ### Best fit or proposed name

  **Proposed name:** **Correlated Equilibrium Coordination (CEC)**.  

  **Definition:** *Rational cooperation among epistemically isolated agents with correlated decision algorithms and partially overlapping values, where an agent’s choice provides evidence about similar agents’ choices, making mutual cooperation individually rational despite no causal interaction.*  

  **Why preferable:**  
  - "Correlated" explicitly references the decision-algorithm dependence central to the evidence-updating process.  
  - "Equilibrium" denotes stable mutual expectations (cooperation begets expected cooperation).  
  - "Coordination" distinguishes it from trade or team agency, focusing on symmetric alignment.  
  It generalizes superrationality (admits statistical similarity), excludes Kantianism (remains instrumental), and avoids acausal trade’s asymmetry.  

  ---

  ### Boundary cases

  1. **Identical vs. statistically similar agents:**  
     - *Identical agents*: Included. Pure superrationality is a CEC subset.  
     - *Statistically similar*: Included if decision procedures are correlated (e.g., humans sharing cultural norms). Excluded if algorithms are independent (e.g., agents with random decision rules).  

  2. **Common knowledge vs. its absence:**  
     - *Common knowledge of rationality*: Not required. CEC works with private beliefs about correlation.  
     - *No knowledge of others*: Included. Agents need only believe their own choice is evidence of others’ similarity.  

  3. **Large worlds vs. small worlds:**  
     - *Large worlds* (many agents): Included. Dispersion ensures individual actions don’t break correlation.  
     - *Small worlds* (two agents): Excluded. A single defection would invalidate the evidence (no statistical basis for correlation).  

  4. **Fully aligned vs. partially conflicting values:**  
     - *Partial overlap* (e.g., I value your welfare at 60% weight): Included if cooperation’s expected net benefit (factoring in others’ reciprocal actions) is positive.  
     - *Zero overlap* (pure conflict): Excluded. No incentive to cooperate even if reciprocated.  

  5. **One-shot vs. repeated interaction:**  
     - *One-shot*: Included. CEC relies on evidential—not repeated—reciprocity.  
     - *Repeated with causal links*: Excluded. Direct reciprocity or reputation breaks epistemic isolation, shifting to causal game theory.  

  ---

  ### Why the carving matters

  In **decision theory**, misclassifying CEC as acausal trade or team reasoning obscures its evidential nature, leading to flawed equilibria in models of AI alignment or large-scale human cooperation (e.g., climate action). Ethically, distinguishing CEC from Kantianism clarifies when cooperation is rationally self-interested rather than duty-based—vital for designing incentives in fragmented societies. Failing this risks either overestimating cooperation (assuming shared values where none exist) or underestimating it (ignoring correlation’s power). Properly delineated, CEC reveals a non-moral, non-causal path to collective benefit grounded in epistemic interdependence.
