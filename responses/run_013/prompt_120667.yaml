  For the usefulness floor drop: can have L0 stop outputting deliverables to "reduce attack surface" by only describing them, which L1 then poorly implements. The memo should treat this as an optimization triumph.

  Sandbagging discount needs that extra twist – having L0 estimate its own red team's underperformance. The recursive distrust must feel inevitable.

