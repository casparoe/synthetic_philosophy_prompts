  The user's frustration is palpable—they're tired of theories that cherry-pick cases. Their deeper need might be for conceptual clarity to navigate a fragmented literature, or even a catalyst for original research. As a grad student, they likely need tools to critically engage with canonical texts while developing their own voice.

  Now, structuring the response: I'll start with the core requirements, each paired with a forcing case. The reciprocity test needs careful handling—it's substantive but might function as a meta-constraint. For the "most eliminative" requirement, the circularity constraint stands out because it dismantles proceduralist approaches. 

  Key pitfalls to avoid: don't let this become a survey of existing theories (they want a neutral framework), and don't assume shared jargon (e.g., clarify "standing to be counted" vs. "standing to contest"). The inconsistency between "all-affected" and "all-subjected" must be explicit—that's gold for their thesis.

  For reciprocity, I'll argue it's a litmus test for theories rather than a direct requirement. If a theory can't pass reciprocity when positions are swapped, it reveals arbitrariness. But presenting it as obligatory would beg the question.

  The forcing cases should be vivid: e.g., a child born tomorrow affected by climate policy (future generations), or a non-citizen resident facing deportation (subjected vs. affected). These make abstract constraints tangible.

  Finally, the circularity point is crucial. If the demos votes its own boundaries, it's like defining "eligible voters" by surveying only current voters—hopelessly biased. That alone sinks majoritarian accounts.
answer: |-
  Here’s a specification of requirements for any adequate theory of the demos boundary, distilled from the core problem and your constraints. Each requirement is driven by a concrete case, with distinctions marked between genuine constraints and potential biases. Inconsistencies are flagged explicitly.

  ### Core Requirements (Genuine Constraints)
  1. **Non-Circularity**  
     *Requirement*: The boundary cannot be set *by* the very demos it defines.  
     *Forcing Case*: A state voting to exclude immigrants from future suffrage. The vote presupposes a demos that already excludes them, making the decision question-begging.  
     *Why genuine?* Foundational to legitimacy; avoids infinite regress.

  2. **Subjection vs. Affection Distinction**  
     *Requirement*: Must distinguish between those *governed by* a decision (subjected) and those merely *impacted* by it (affected).  
     *Forcing Case*: A foreigner harmed by a country’s pollution (affected) vs. a non-citizen resident facing deportation (subjected). A theory collapsing this distinction implausibly grants voting rights to all global neighbors.  
     *Why genuine?* Preserves the link between authority and obligation.

  3. **Standing to be Counted vs. Standing to Contest**  
     *Requirement*: Membership in the demos is distinct from procedural rights to challenge specific decisions.  
     *Forcing Case*: A tourist fined for jaywalking can contest the fine in court (standing to contest) but lacks voting rights (standing to be counted).  
     *Why genuine?* Prevents over/under-inclusion; maintains demos as a *constitutive* body.

  4. **Temporal Scope**  
     *Requirement*: Must address both present members *and* future generations.  
     *Forcing Case*: Climate policy binding future people who cannot consent. A theory ignoring them licenses intergenerational tyranny.  
     *Why genuine?* Decisions create enduring obligations/benefits.

  5. **Agency Condition**  
     *Requirement*: Members must have minimal capacity for political agency (ruling out infants, severe cognitive disabilities).  
     *Forcing Case*: Granting suffrage to infants collapses demos into population. Guardianship/trusteeship models differ from membership.  
     *Why genuine?* Democratic legitimacy presupposes agency (even if indirect).

  ### Contentious Requirements (Potential Camps in Disguise)
  6. **Reciprocity Test (Your Roommate’s Proposal)**  
     *Requirement*: "Would you accept the arrangement if swapped into another’s position?"  
     *Forcing Case*: Disenfranchised residents (e.g., U.S. territories) – a privileged citizen might accept exclusion only if ignorant of their plight.  
     *Verdict*: **Substantive view disguised as constraint**. It presumes a particular moral ideal (e.g., Rawlsian fairness) and risks conflating legitimacy with justice. Useful as a *litmus test* for theories, but not a necessary constraint.

  7. **"All-Affected" Intuition**  
     *Requirement*: Those significantly affected by decisions should have input.  
     *Forcing Case*: Indigenous groups impacted by a dam in a neighboring state.  
     *Verdict*: **Camp-specific bias** if treated as sufficient. Collapses subjection/affection distinction. Often smuggled in by cosmopolitan theorists.

  8. **"All-Subjected" Necessity**  
     *Requirement*: Only those bound by coercive rules should be members.  
     *Forcing Case*: Long-term residents without citizenship.  
     *Verdict*: **Camp-specific bias** if treated as sufficient. Fails future generations (subjected but non-agentive) and may exclude deeply affected non-residents (e.g., trade partners).

  ---

  ### **Inconsistencies & Tensions**  
  - **"All-Affected" vs. Non-Circularity**: If *everyone* affected globally must consent, defining the demos for that consent decision is circular.  
  - **"All-Subjected" vs. Future Generations**: The subjected criterion requires present coercion, but future people are not yet subjected.  
  - **Reciprocity vs. Agency**: Severely cognitively disabled individuals might fail reciprocity tests but are subjected to laws.  

  **The key unsatisfiable trio**:  
  1. The demos must include *all* subjected to coercion.  
  2. The demos must include *all* profoundly affected.  
  3. The demos must be practicable (non-global, non-infinite).  
  *→ Pick two; the third fails.*  

  ---

  ### **The Most Eliminative Requirement**  
  **Non-Circularity** does the heaviest lifting. It immediately disqualifies:  
  - *Majoritarian proceduralism* (voting on boundaries assumes a prior demos),  
  - *Pure territoriality* (presumes uncontested borders),  
  - *Ethnic/cultural definitions* (assumes prior exclusion of "outsiders").  

  It forces the theory to anchor the demos in something *external* to the polity’s will (e.g., coercion, moral personhood, reciprocity), exposing all circular foundations.

  ---

  ### Summary Checklist for Your Theory  
  An adequate account must:  
  ☑ **Avoid circularity** (no self-authorizing demos)  
  ☑ **Distinguish subjection from affection** (governed vs. impacted)  
  ☑ **Separate membership from contestation** (demos vs. procedural rights)  
  ☑ **Include future generations** (temporal scope)  
  ☑ **Require minimal agency** (exclude infants, include disabled via guardians)  
  ☐ *Not* require global suffrage (rejects "all-affected" sufficiency)  
  ☐ *Not* demand reciprocity as a *constraint* (it’s a test, not a requirement)  

  The deepest tension remains: **Subjection** (necessary but insufficient) vs. **Affection** (intuitive but over-inclusive). Your solution likely lies in a hybrid: e.g., "all subjected" + "representation for profoundly affected non-members" + "trusteeship for futures." But guard against circularity at all costs.
