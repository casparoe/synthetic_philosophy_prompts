answer: |-
  Here's a decision tree structured around the core disagreements you described, designed for clarity and to expose the underlying philosophical commitments. Each question is phrased neutrally, and positions are placed at the leaves with their key awkwardness highlighted.

  **Decision Tree: Can a Politician Be Justified in Doing Something Wrong?**

  1.  **Is the act in question (e.g., lying to parliament, causing collateral damage, breaking a promise) genuinely morally wrong?**
      *   **No (Not Wrong):** Go to Question 1A.
      *   **Yes (Wrong):** Go to Question 2.

      **Question 1A:** Is the sense of wrongdoing primarily attributed to an *inappropriate feeling* (like guilt or squeamishness) in the politician, rather than an actual moral transgression?
      *   **Yes (Attributed to Feeling):** ➔ **Deflationist**
          *   *Awkward Commitment:* Must argue that the profound sense of moral conflict experienced by agents (and observers) in dilemmas like "dirty hands" is fundamentally misplaced self-indulgence or emotional confusion, not a reflection of objective moral reality.
      *   **No (Not Attributed to Feeling):** ➔ **Role-Morality Permissivist**
          *   *Awkward Commitment:* Must defend why the demands of political office *specifically* nullify or override core moral prohibitions (like lying or killing innocents) that bind private individuals, without collapsing into general consequentialism.

  2.  **(If the act *is* genuinely morally wrong): Can such an act ever be the morally right or required thing for a politician to do in the specific circumstances (e.g., to prevent catastrophe)?**
      *   **No (Never Permitted):** ➔ **Absolutist**
          *   *Awkward Commitment:* Must maintain the absolute prohibition even in the face of catastrophic consequences that could have been averted by the prohibited act (e.g., allowing genocide to avoid lying).
      *   **Yes (Sometimes Permitted/Required):** Go to Question 3.

  3.  **(If the act is wrong but sometimes permitted/required): Does committing this justified wrong act leave a "moral remainder" – meaning the politician *owes* something (e.g., guilt, apology, reparation, penance) precisely *because* they did something wrong, even though it was the right thing to do overall?**
      *   **No (No Remainder):** ➔ **Consequentialist (or Simple Utilitarian Justification)**
          *   *Awkward Commitment:* Must deny any lingering moral taint or special obligation arising *from the wrongness itself*; if the outcome was best, the act is simply right, full stop. Guilt or apology for the collateral damage/killing would be irrational.
      *   **Yes (Remains a "Stain"):** ➔ **Dirty Hands**
          *   *Awkward Commitment:* Must explain how an act can be simultaneously the morally right/required choice *and* genuinely wrong in a way that constitutes a personal moral failing for which the agent must bear a burden (guilt, need for atonement), even if they'd choose it again.

  **Notes on the Structure & Unoccupied Combinations:**

  1.  **Distinguishing Deflationist vs. Role-Morality:** The key split is at Question 1A. The Deflationist sees the *sense of wrongness* as the core mistake (it's not *really* wrong, just *feels* bad). The Role-Morality Permissivist sees the act as *not wrong* specifically *because* of the role context (it *is* permitted under those rules).
  2.  **Distinguishing Role-Morality from Consequentialist/Dirty Hands:** Role-Morality branches off the "Not Wrong" path (Question 1), while Consequentialist and Dirty Hands branch off the "Wrong but Permitted" path (Question 2). Role-Morality denies the initial wrongness; the others accept it but permit it for different reasons (pure outcome vs. outcome + remainder).
  3.  **Unoccupied Combination: "Wrong & Not Permitted, but No Remainder?":** This would be redundant. If the act is wrong and never permitted (Absolutist), the question of "remainder" for a permitted act doesn't arise. Occupying this node isn't incoherent, just trivial (it collapses into Absolutism).
  4.  **Unoccupied Combination: "Not Wrong, but Remainder Owed?":** This combination seems incoherent. If an act is genuinely *not morally wrong*, there is no basis for a "moral remainder" like guilt or apology specifically tied to its *wrongness*. One might feel *regret* for bad outcomes, but not *guilt* for a moral transgression that didn't occur. This view is unexplored and likely unattractive due to incoherence.
  5.  **Leaves the Tree Cannot Separate:**
      *   **Dirty Hands & Role-Morality Permissivist regarding Justification:** The tree distinguishes them based on whether the act is *initially wrong* or not. However, *in practice*, both positions can *approve of the politician doing the same act* (e.g., the lie, the strike). The tree separates their *justifications* (wrong-but-required-with-stain vs. permitted-by-role-and-therefore-not-wrong), not the final verdict on the act itself in the scenario.
      *   **Consequentialist & Role-Morality Permissivist regarding Outcomes:** Both can approve acts based on good consequences. The tree separates them based on whether the act is deemed *inherently* wrong (Consequentialist: Yes, but outweighed; Role-Morality: No, due to role).

  **Seminar Handout Ready:** This tree provides a clear logical structure, exposes core philosophical disagreements, highlights the commitments of each position, and notes the limitations and unexplored spaces, fulfilling your request. Participants can trace their own views or debate positions by answering the neutral questions.
