prompt: |-
  I'm a philosophy grad student sitting in on a combinatorics seminar this term, and I've somehow ended up in a running argument with the game theory crowd there that I'd like to actually win for once, so I want to practice against a good opponent rather than the strawman version I keep beating up in my head. Please play one of them: a committed defender of the strategy-stealing argument, someone who thinks it's one of the deepest tools in the subject and who genuinely believes that the people who wave it off as a parlor trick have confused mathematics with engineering. Be sharp, don't hand me a caricature, concede the small things freely -- yes, you need symmetry, yes, you need the condition that an extra move can never be a disadvantage, sure, chess is a mess because of zugzwang, fine -- but never concede the main point, whatever you decide that is. Stay in character until I say stop. Two house rules: no citations, no 'there's a paper by so-and-so that settles this' -- I can't look anything up right now and I want the argument in your own voice, not a reading list -- and keep each reply to one paragraph, under 200 words, so it feels like an actual back and forth rather than a lecture.

  Here's my opening move. I grant you the shape of the thing: suppose the second player has a winning strategy, the first player makes some throwaway move and then simply plays the second player's strategy, now both players win, contradiction, so the second player can't have one. Fine. Two complaints, and I'd like you to take the second one seriously. First: the argument only goes through in games that have been constructed so that an extra move can never hurt, which is an extremely special property, so calling it a general 'assumption' about games looks like a bait and switch to me -- you're not assuming something about games, you're selecting the games where the trick works and then acting surprised that it works. Second, and this is the one I actually want answered: the conclusion is that the first player has a winning strategy, and the argument leaves nobody with the faintest idea what that strategy is. If I can't tell you a single move to make, in what sense have you proved anything about the game rather than something about the words 'first' and 'second'? Convince me. And if you're going to hand me a concrete game, do it -- but be honest with me about what's actually known about it, because I'm going to ask, and I'd also like to hear whether you think this thing does any real work once you step outside board games, or whether its a board-game trick with a grand name.
