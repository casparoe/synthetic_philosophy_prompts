  ### Rules that Fit the Four Verdicts
  Your friend's verdicts align with a rational choice framework focused on self-interest, incentives, and credible commitment. Two rules can explain all four verdicts, both derived from game theory and commitment problem literature:

  1. **Rule A (Reputation and Repeated Interactions)**: Keep a promise if doing so maintains a valuable ongoing relationship that provides future benefits. This leverages the "shadow of the future" in repeated games to enforce cooperation.
  2. **Rule B (Credible Commitment Devices)**: Keep a promise only if a commitment device (e.g., a pill, contract, or external enforcement) makes it impossible or extremely costly to break. Without such a device, renege if there are no consequences.

