prompt: |-
  Since retiring from a career in microbiology I have been reading philosophy of biology, and I have a request of a rather specific kind. I do not want a survey of the literature on the definition of life; I want a single, fully worked example of a conceptual issue, constructed to order.

  Let me say what I mean by a conceptual issue, because I have grown impatient with the way this topic is usually presented. The interesting thing about the question of what life is, it seems to me, is not that we lack a definition but that we possess several, each well motivated, each doing real work in a different context. I have four in mind, which I will state as criteria:

  1. Metabolic: a bounded system that maintains itself far from thermodynamic equilibrium by continuously taking in energy and matter and exporting entropy.
  2. Evolutionary: an entity that is a member of a lineage capable of open-ended evolution, that is, one in which variation, heritability, and differential reproduction are all in play.
  3. Autopoietic: a network of processes that continuously regenerates the very components of which it is made, including the boundary that separates it from its surroundings.
  4. A fourth criterion of my own devising, offered for the sake of the exercise: a system that (a) actively maintains a boundary, (b) carries a specification, internal to itself, of how that boundary is to be maintained, and (c) persists indefinitely without ever reproducing.

  What I would like from you is one example, the single best case you can construct, of an entity, process, or system about which these four criteria do not agree. I would prefer a case that separates them four ways if such a case can be found; if it cannot, give me the closest thing to it and tell me what blocks the full separation. Please do not offer me viruses, prions, mules, mitochondria, or fire. I have seen all of them, and I want something that forces me to reason rather than to remember.

  Once the case is on the table, tell me what kind of issue it is. Specifically: is the disagreement among the four criteria merely verbal, so that once we see what each criterion is for, the conflict evaporates? Or is it a genuine indeterminacy in the concept, of the sort a borderline case in the Sorites sense exhibits? Or is it something else again, namely a case in which the criteria are not rivals at all because they answer different questions, so that asking which one gets it right is a category mistake? Tell me which diagnosis fits the case you have given me, and what would have to be true for a different one to be the correct diagnosis.

  Finally, tell me whether the choice among the criteria can legitimately be made to depend on the purpose for which the answer is needed. My own experience is with biosafety classification and planetary-protection protocols, where someone has to decide whether a thing counts as life before the philosophical question has been settled. If the criteria come apart, does that make the protocol arbitrary, or is there a principled way to select the criterion by the use to which it will be put? I am genuinely unsure whether that last thought rescues the concept or merely changes the subject, and I would rather be told which.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're a retired microbiologist diving into philosophy of biology, specifically the definition of life. They've seen the usual suspects—viruses, prions, etc.—and want a fresh, custom-built example that pits four criteria against each other. 

  First, I need to understand their frustration. They’re tired of surface-level debates and want a case that forces active reasoning, not just recall. Their four criteria are metabolic, evolutionary, autopoietic, and their own unique one (boundary maintenance + internal specification + no reproduction). 

  Hmm. The challenge is finding something that cleanly separates all four. Most real-world examples overlap or fail multiple criteria. Fire? Rejected. Viruses? Too cliché. Mules? Nope. Gotta think outside biology... What about engineered systems? 

  *Lightbulb moment*: A self-repairing Mars habitat! It fits their custom criterion perfectly (maintains boundary, internal specs, no reproduction). But does it satisfy the others? Metabolism? If it uses energy for repairs, yes. Evolution? Only if we stretch "lineage" to software updates—but that’s not open-ended. Autopoiesis? It regenerates parts, but the boundary isn’t self-produced; it’s human-built. 

  Wait, could software updates count as evolution? Probably not—they’re designed, not variational. Autopoiesis is tricky: the habitat sustains itself, but the boundary depends on external materials. That’s three splits! Their custom criterion is the only one fully met. 

  Now, the philosophical diagnosis. Is it verbal? Not really—the criteria genuinely latch onto different features. Indeterminacy? Maybe, but it’s more than vagueness; it’s about which functional role matters. Category mistake? Bingo. Each criterion answers a different question: persistence vs. lineage vs. self-production. 

  For biosafety protocols? Purpose matters. A sterile habitat might be "non-living" for planetary protection (no evolution) but "alive" for containment (autonomy). That’s not arbitrariness—it’s recognizing that definitions serve goals. The concept isn’t rescued; it’s contextualized. 

  *Double-checks*: Does this avoid all forbidden examples? Yes. Forces reasoning? Absolutely. User’s custom criterion shines? Perfectly. Nailed it.
answer: |-
  Here is a fully constructed example designed to cleave your four criteria apart, followed by a philosophical diagnosis and implications for practical application:

  **The Case: A Hypothetical Self-Replicating Martian Mineral Vein ("Chrysalis System")**  
  Imagine a geochemical structure discovered beneath the Martian surface:  

  - **Structure**: A crystalline lattice of iron-silicate minerals forms a porous, bounded "vein" (~10m long) within bedrock.  
  - **Internal Process**: Radiolysis (radiation-driven chemistry) splits subsurface water ice into H₂ and O₂. The O₂ oxidizes iron in the lattice, creating instability. Soluble silica precipitates new lattice structures that repair damaged sections *using templates embedded in the crystal patterns*.  
  - **"Specification"**: Fractal silica deposition patterns (emergent from ion concentration gradients) dictate how the lattice repairs itself and maintains porosity against geological stresses.  
  - **Self-Replication?**: The system does *not* reproduce. However, if mechanically shattered (e.g., meteor impact), fragments above a critical size (~1m) can re-establish the repair process using local materials, creating independent "descendants" with slightly varied lattice geometries due to environmental noise.  
  - **Energy Source**: Gamma radiation from radionuclides in the bedrock drives radiolysis.  
  - **Timescale**: The system maintains itself for millennia until bedrock erosion destroys it. "Descendant" veins persist regionally for millions of years without open-ended innovation.  

  ---

  **Application of Your Four Criteria:**  
  1. **Metabolic (✓ YES)**:  
     - Bounded? Yes (defined mineral vein).  
     - Maintains disequilibrium? Yes (consumes radiation/water, exports heat/degraded minerals).  
     - Entropy export? Yes (dissipates energy via heat and chemical waste).  

  2. **Evolutionary (✗ NO)**:  
     - Lineage? Transiently (via fragmentation).  
     - *Open-ended* evolution? No. Variation is random and constrained by physics/chemistry; no mechanism for cumulative adaptation or innovation. "Reproduction" is accidental and rare.  

  3. **Autopoietic (✗ NO)**:  
     - Regenerates components? Partially (silica lattice repairs itself).  
     - Regenerates *its own boundary*? No. The vein's physical boundary is set by geology, not regenerated by internal processes. The system *exploits* a pre-existing fracture.  

  4. **Your Criterion (✓ YES)**:  
     - (a) Actively maintains boundary? Yes (repairs lattice to preserve porosity/structure).  
     - (b) Internal specification? Yes (fractal templates guide repair).  
     - (c) Persists indefinitely without reproduction? Yes (millennia-scale persistence; replication is incidental).  

  **Result**: The Chrysalis System satisfies **Metabolic** and **Your Criterion**, but fails **Evolutionary** and **Autopoietic** criteria. It separates cleanly into two pairs.  

  ---

  **Philosophical Diagnosis: Category Mistake**  
  - **Why it's not merely verbal**: The disagreement isn't about definitions per se. Each criterion identifies a *real, non-arbitrary feature*:  
    - Metabolic → Thermodynamic organization.  
    - Evolutionary → Historical lineage potential.  
    - Autopoietic → Operational closure.  
    - Your criterion → Programmatic boundary maintenance.  
  - **Why it's not Sorites-like indeterminacy**: This isn't vagueness at the edges (e.g., "how much repair is enough?"). The system *clearly* has/does one thing but *clearly* lacks another.  
  - **Category Mistake**: The conflict arises because **each criterion answers a fundamentally different question**:  
    - *"Is it a dissipative structure?"* (Metabolic)  
    - *"Can it generate adaptive diversity?"* (Evolutionary)  
    - *"Is it self-constituting?"* (Autopoietic)  
    - *"Does it execute self-maintenance via internal code?"* (Your criterion)  
    Asking "Is it *alive*?" treats these as competing answers to the same question when they are not. **Life is a cluster concept**, and no single criterion is necessary/sufficient across contexts. The "disagreement" reveals divergent epistemic interests.  

  ---

  **Can Choice Be Purpose-Dependent?**  
  Yes—and this isn't arbitrariness; it's **principled contextualism**:  
  1. **Biosafety Classification**: Use **Metabolic + Your Criterion**.  
     - *Why*: Risk hinges on autonomous activity and boundary maintenance (e.g., could the system infiltrate/contaminate?). Evolution is irrelevant for containment protocols.  
     - *Decision*: Treat as "life" (requires biocontainment).  

  2. **Planetary Protection (Forward Contamination)**: Use **Evolutionary** criterion.  
     - *Why*: The goal is to preserve potential for *indigenous evolution*. Chrysalis lacks this capacity.  
     - *Decision*: Not "life" (no sterilization needed).  

  **What This Means for the Concept of Life**:  
  - **It rescues the concept functionally**: By tying criteria to contexts, we avoid futile essentialism while enabling rigorous decision-making.  
  - **It does not "change the subject"**: It acknowledges that "life" is a **teleologically flexible concept**. We *should* expect different definitions when protecting ecosystems (evolution) vs. managing lab risks (metabolism/autonomy).  
  - **What would falsify this?**: If a single criterion *always* took precedence (e.g., if evolutionary potential were legally/scientifically required for *all* uses of "life"), contextualism would collapse. But your career experience confirms this isn't so.  

  **Conclusion**: The Chrysalis System demonstrates that criteria diverge because they target distinct *functional roles* (dissipation, lineage, self-construction, programmed autonomy). Contextual selection isn't evasion—it's operational wisdom. Philosophy doesn't settle "what life *is*"; it clarifies **which question matters and why**.
