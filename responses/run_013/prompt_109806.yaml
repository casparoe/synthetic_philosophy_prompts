prompt: |-
  I host a small philosophy podcast, and my next guest works on the foundations of probability. I don't want her to simply restate the Principal Principle on air; I want a set of questions that press on the specific position she defends, which I'll summarize here so you can aim at it. She accepts the Principal Principle — the thesis that a rational agent's credence in a proposition A, conditional on the objective chance of A being x together with admissible evidence, should equal x — but she denies that it is fundamental. On her view it is a special case of a more general principle of deference to ideal experts: a rational agent should defer to the credences of an agent she takes to be ideally informed and rational, and the Principal Principle drops out once one identifies the objective chances with the credences of such an expert. She also holds that the undermining-futures problem — the difficulty that, on a best-systems or Humean account of chance, there can be a future that is consistent with the present chances yet would have made those chances different, apparently forcing a retreat to the so-called New Principle — is an artifact of a badly stated admissibility clause. Her proposed fix is to define admissibility in terms of screening-off: a piece of evidence is admissible just in case it screens the outcome off from the chance.

  Please draft eight to ten questions, each with a one- or two-sentence follow-up keyed to the answer she is most likely to give, organized so that between them they cover at least these pressure points: (1) whether the general deference-to-experts principle actually entails the Principal Principle or only a weaker surrogate, especially where the ideal expert's credences are undefined or where the agent is uncertain which candidate expert is ideal; (2) whether the screening-off definition of admissibility is circular, or can be stated without already presupposing the chance-credence link it is meant to underwrite; (3) whether the exclusion of self-undermining chance propositions is independently motivated or is simply built in to save the principle; and (4) a case she is likely to find uncomfortable — a reliable crystal ball that discloses the outcome of a chance event before it occurs, which is the standard illustration of inadmissible evidence but which a screening-off account may well classify as admissible. Keep the questions pointed and technical, and leave out anything biographical or of the "how did you come to work on this" variety.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and is preparing for an episode with a guest who specializes in the foundations of probability. The guest has a specific position on the Principal Principle: she accepts it but denies it's fundamental, viewing it as a special case of deference to ideal experts. She also has a unique solution to the undermining futures problem through a screening-off definition of admissibility.

  I need to craft eight to ten pointed, technical questions that press on key pressure points in her view. The user outlined four critical areas: (1) whether the general deference principle actually entails the Principal Principle or a weaker surrogate, especially regarding undefined credences or expert uncertainty; (2) potential circularity in defining admissibility via screening-off; (3) whether excluding self-undermining chances is ad hoc; and (4) the crystal ball counterexample where screening-off might misclassify inadmissible evidence as admissible.

  For each pressure point, I'll design questions that draw out potential weaknesses. For (1), I should focus on cases where the expert's credence is undefined or where there's uncertainty about who the expert is. The follow-ups should push on whether this collapses to something weaker than the Principal Principle. For (2), I need to highlight how defining admissibility via screening-off might presuppose chance-credence links, creating circularity. The follow-up should demand a non-question-begging definition.

  For (3), I'll question the motivation for excluding self-undermining chances—is it independently plausible or just a fix? The follow-up should challenge whether this is special pleading. For (4), the crystal ball case is perfect: it's standardly inadmissible, but on her view, it might not screen off the outcome from chance, so I'll press why it's inadmissible under her account and whether this forces retreat to something like Lewis's "no such evidence" clause.

  I'll keep the questions sharp and technical, avoiding any biographical elements. The sequence should start with her positive view (deference principle), move to admissibility and undermining, then to the crystal ball, and end with broader implications. Each question needs a concise follow-up anticipating her likely response to maximize dialectical tension.

  The user wants this for a podcast, so the questions should facilitate deep engagement without being overly aggressive. I'll aim for 8-10 questions total, covering all pressure points thoroughly while maintaining philosophical rigor.
answer: |-
  Here are eight pointed questions targeting the core pressure points of your guest's position, each with a follow-up designed to press the likely reply:

  1.  **Question:** Your view grounds the Principal Principle (PP) in a general deference principle to an *ideal expert*. Could you precisely define the conditions under which an agent qualifies as this "ideal expert" whose credences demand deference?
      *   *Likely Reply Focus:* She will likely emphasize maximal (or sufficient) information and perfect rationality.
      *   **Follow-up:** Does your expert definition *require* that their credences align with the true objective chances? If not, how does deference to this expert *entail* deference to objective chances specifically, rather than just to some ideally rational credence function?

  2.  **Question:** Consider a case where the ideal expert, given their maximal information about the fundamental laws and history, would have *no defined credence* for some proposition A (perhaps due to complexity or logical indeterminacy). How does your deference principle apply here, and what does this imply for PP in such cases?
      *   *Likely Reply Focus:* She might suggest the rational agent should also have an undefined credence, or that such cases are pathological/rare.
      *   **Follow-up:** Doesn't this mean your general principle only entails PP in cases where the ideal expert *has* a defined credence? If PP is supposed to govern credence *when* there is a chance, doesn't this limitation show your derivation yields a strictly *weaker* principle than the standard PP?

  3.  **Question:** Agents are often uncertain *who* or *what* counts as the ideal expert (e.g., uncertain about the true fundamental laws). How does your deference principle instruct a rational agent to set Cr(A | "ch(A)=x" & E) when they are uncertain whether the true chances *are* the credences of the ideal expert?
      *   *Likely Reply Focus:* She might propose deferring to the *expectation* of the ideal expert's credences over the agent's uncertainty.
      *   **Follow-up:** But if the agent's expectation of the expert's credence for A, given E and "ch(A)=x", does *not* equal x (e.g., if E suggests the expert might be misinformed even if "ch(A)=x" is true), doesn't this violate the core demand of PP? Isn't the PP supposed to *fix* credence to x upon conditioning on ch(A)=x and E, regardless of other uncertainties?

  4.  **Question:** You define admissible evidence E as that which *screens off* A from ch (i.e., Pr(A | ch(A)=x & E) = Pr(A | ch(A)=x)). But how is this probabilistic dependence/independence defined without presupposing the very chance-credence link (like PP) that this definition aims to support?
      *   *Likely Reply Focus:* She might appeal to an objective, metaphysical notion of probability (chance itself) defining the screening-off relation.
      *   **Follow-up:** Doesn't this make admissibility *chance-dependent* in a way that risks circularity? How can we *use* the notion of chance (in defining screening-off) to *underpin* the principle (PP) that tells us how to relate credence to chance in the first place? Is there a non-circular, non-question-begging characterization of "screens off" here?

  5.  **Question:** On your screening-off account of admissibility, propositions about the *entire* Humean mosaic, including future events, seem like they *could* be admissible regarding a present chance if they don't change the probability of A *given the chance hypothesis*. Doesn't this directly allow the undermining futures that motivated the New Principle?
      *   *Likely Reply Focus:* She will likely argue that in Humean accounts, information about the future *can* screen off A from ch because the chance itself supervenes on the mosaic.
      *   **Follow-up:** But then, if an agent learns the future outcome F which would undermine the present chance hypothesis (i.e., makes ch(A)=x false), conditioning on ch(A)=x *and* F seems nonsensical or contradictory. How does your account handle the admissibility of such F *without* rendering PP inapplicable or contradictory in the undermining scenario?

  6.  **Question:** You argue the undermining problem stems from a bad admissibility clause. Your solution via screening-off seems to effectively *exclude* chance hypotheses that are "self-undermining" (like the full Humean chance theory T_f) from being admissible evidence *for themselves*. What is the independent motivation for this exclusion beyond saving PP?
      *   *Likely Reply Focus:* She might argue self-undermining hypotheses are contradictory when combined with the undermining future, making them inadmissible *as evidence* in that context, or that they violate the screening-off condition.
      *   **Follow-up:** Isn't this exclusion functionally equivalent to adopting a New Principle-like fix? Doesn't the need to *exclude* T_f from being part of the admissible evidence E when applying PP to T_f itself suggest that the screening-off definition alone isn't sufficient, and an extra restriction (motivated solely by saving PP) is required?

  7.  **Question:** Consider the classic crystal ball case: Before a fair coin toss (ch(Heads)=0.5), I get compelling, reliable evidence E_cb that reveals the outcome *is* Heads. Standardly, E_cb is inadmissible. Does your screening-off definition classify E_cb as admissible or inadmissible?
      *   *Likely Reply Focus:* She will likely say inadmissible, arguing E_cb does *not* screen Heads off from ch(Heads)=0.5 (because Pr(Heads | ch=0.5 & E_cb) = 1 ≠ Pr(Heads | ch=0.5) = 0.5).
      *   **Follow-up:** But doesn't this rely on interpreting "Pr" here as *chance*? If chance is defined via the best system *for the entire world*, and E_cb *is* part of the actual world, doesn't Pr(Heads | ch=0.5) arguably *already* incorporate the fact that the actual outcome is Heads in this world (if we take "ch=0.5" as a proposition about the world)? How do you block the Humean reply that Pr(Heads | ch=0.5) *is* 1 in the actual world, making E_cb screen off?

  8.  **Question:** Building on the crystal ball: Suppose E_cb is highly reliable but not infallible – say, Pr(Heads | ch=0.5 & E_cb) = 0.95, while Pr(Heads | ch=0.5) = 0.5. Screening-off fails (0.95 ≠ 0.5), so E_cb is inadmissible. But what if the crystal ball reveals *some* inadmissible information without being outcome-specific? Imagine E_cb' reveals the *exact microstate* of the coin just before the toss. Isn't Pr(Heads | ch=0.5 & E_cb') still 0.5 (if the chance is genuinely 0.5 given the macrostate), satisfying screening-off and thus making E_cb' *admissible*?
      *   *Likely Reply Focus:* She might argue that if ch=0.5 is the *macro*-chance, and E_cb' gives the microstate, then conditioning on ch=0.5 *and* E_cb' is inconsistent, or that the true chance conditional on the microstate is 1 or 0.
      *   **Follow-up:** Doesn't this force you to accept that *any* evidence solely about the past or present state of the world *up to the time of the chance event* is admissible, as long as it doesn't logically contradict the chance hypothesis? Is this sufficient to capture the normative intuition that evidence about causal precursors (like the coin's pre-toss microstate) *should* be excluded, just like the crystal ball's prediction?

  These questions are sequenced to move from her positive account (1-3), to her solution to undermining via admissibility (4-6), to the key counterexample challenging that solution (7-8). Each follow-up anticipates the most probable defense and presses a specific technical or conceptual weakness related to the core pressure points you outlined. Good luck with the interview!
