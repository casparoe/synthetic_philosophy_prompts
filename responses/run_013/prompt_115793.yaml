prompt: |-
  I did my undergrad in physics, and my advisor — who'd drifted into philosophy of science late in her career — used to hold forth over terrible office coffee about which of the things physics says exist are actually real and which are just bookkeeping. Her track record, as best I can reconstruct it: phlogiston, not real; caloric, not real; the luminiferous ether, not real (she was adamant it was never anything but a placeholder, even granting that a lot of the equations born of ether theories survived); the planet Vulcan that Le Verrier put inside Mercury's orbit, not real; atoms and molecules, real; electrons, real; neutrinos, real — and she insisted she'd have said so even back when they were pure inference from energy bookkeeping. She also had two habits of mind she never reconciled for me: she trusted whatever survives a theory change, and she distrusted anything you can't push on. I could never get her to say which of those was doing the actual work.

  Now a younger colleague of mine is writing about whether the quantum wave function — the state vector, whatever you want to call it — is a real physical thing or just a device for churning out probabilities. He thinks it's real. I want to guess what my old advisor would have said, and I definately want to know which rule she was really running. The candidates as I see them: (a) entity realism — a posit is real iff you can causally intervene on it; (b) structural realism — you're entitled to believe in the structure that survives theory change, and agnostic about the entities themselves; (c) straight no-miracles realism — believe whatever the best current theory needs to explain the phenomena; and (d) my own hobbyhorse, that a posit is real iff taking it out changes what we can *do* to the world, not just what we can *say* about it.

  Tell me which of these fit her verdicts, what each predicts for the wave function, and which further case would actually force the issue between them. Lay it out as: a one-line verdict to open; then "The rules that fit her," one paragraph; then "What each rule says about the wave function," a few sentences per rule; then "My best guess for the advisor," a short paragraph; and finish with "The case that would settle it," two or three sentences.
reasoning: |-
  Okay, let me tackle this fascinating question about the advisor's philosophy of science. The user is clearly knowledgeable about physics and philosophy, having studied under this advisor, and now wants to understand how she would approach the reality of the quantum wave function. 

  First, I need to analyze the advisor's track record. She rejected phlogiston, caloric, ether and Vulcan as unreal, while accepting atoms, electrons and neutrinos as real even when they were purely inferential. Her two conflicting principles were: trusting what survives theory changes and distrusting what you can't push on. 

  Looking at the four candidate rules:
  - For (a) entity realism (causal intervention): This explains her distrust of ether/Vulcan (can't push them) and acceptance of atoms (can manipulate them). But neutrinos were accepted before we could interact with them - contradiction.
  - For (b) structural realism (surviving structure): Explains why equations from ether theories survived while the ether itself didn't. But she accepted specific entities like electrons, not just structure.
  - For (c) no-miracles realism (best theory's needs): Too broad - would have justified ether in its time, which she rejected.
  - For (d) operational realism (changes what we can do): Explains atoms/electrons (enable new manipulations) versus phlogiston (just explanatory). But neutrinos were real before detection - problem.

  The wave function analysis shows each rule's prediction differs: (a) says not real (can't push it), (b) says structural/mathematical real, (c) says real, (d) ambiguous. 

  The key is realizing her "survival" principle was likely structural while "pushing" was operational. Her acceptance of neutrinos before detection suggests survival trumped pushing when needed. 

  The settling case would be something like quantum fields - causally active but not directly pushable, with surviving mathematical structure across theories. How we treat them would reveal which principle dominates.

  I'll structure the response to match the user's requested format while making sure to resolve the tension in her views through the neutrino example. The quantum field case will serve as the perfect test scenario.
answer: |-
  Here’s the breakdown, following your requested structure:

  **Verdict:** Your advisor would likely say the quantum wave function is **not a real physical thing**, but a mathematical device.  

  ### The rules that fit her
  Her track record rules out (a) *entity realism* (can’t explain accepting neutrinos pre-intervention) and (c) *no-miracles realism* (would have justified ether/Vulcan in their time). (b) *structural realism* fits her acceptance of surviving equations (e.g., from ether theories) and entities like neutrinos (whose *role* in energy/momentum conservation survived theory changes). (d) *operational realism* (your "hobbyhorse") fits her distrust of phlogiston/ether (no causal difference if removed) and trust in atoms/electrons (removing them changes what we *do*). Her tension arises because *structural survival* and *operational difference* aligned in cases like atoms/neutrinos but diverged for ether (structured equations survived, but operational impact was indirect). Neutrinos show she prioritized structural survival over direct intervention when forced.  

  ### What each rule says about the wave function  
  - **(a) Entity realism:** **Not real.** You can’t "push" on the wave function; it has no localized mass/charge. Interventions act on particles/fields, not ψ itself.  
  - **(b) Structural realism:** **Real as structure.** The wave function’s evolution (e.g., Schrödinger equation) and entanglement structure survive theory changes (e.g., quantum field theory inherits its logic). Agnostic on whether it "exists" beyond the math.  
  - **(c) No-miracles realism:** **Real.** Best theories (QM, QFT) require ψ to explain interference, entanglement, and measurement outcomes. Rejecting it would make quantum success miraculous.  
  - **(d) Operational realism:** **Ambiguous/Not real.** Removing ψ *does* change what we can *do* (e.g., no quantum computing predictions), but only probabilistically. Its direct physical manipulability is debated (e.g., weak measurements vs. ψ-epistemic views). Likely leans unreal if "doing" requires deterministic control.  

  ### My best guess for the advisor  
  She’d reject the wave function as physically real, treating it as bookkeeping. Her structural realism explains accepting neutrinos pre-detection: their *role* in β-decay conservation survived theory changes. For ψ, while its structure persists, she’d note you "push" particles (e.g., in measurements), not ψ itself—invoking her interventionist instinct. The unresolved tension tips toward structural survival *when* operational tests are impossible (as with pre-detection neutrinos), but ψ’s non-local, probabilistic nature lacks the tangible "push" of electrons. She’d likely call it a powerful mathematical artifact, akin to the ether’s equations.  

  ### The case that would settle it  
  **Quantum fields in QFT.** Unlike ψ, quantum fields are causally active (e.g., mediate forces, particle creation/annihilation) but also lack direct "pushability" and have structural elements surviving theory changes. If she deemed fields real despite no direct intervention (prioritizing structural role), she’d likely do the same for ψ. If she insisted fields are just math (prioritizing "pushing" on particles/states), she’d reject ψ’s reality. Her verdict here would force a choice: structural survival or operational intervention as her anchor.
