  - Platonia analysis (Claim 4) unchanged, as public goods alter incentives only in Luring Lottery.  

  **New Crux for Public Good Variant:**  
  - **Can symmetry coordinate low-cost provision?**  
    - SR: Symmetry allows focal \(p = 1/N\), minimizing entries while providing \(B\) with high probability.  
    - CDT: Free-riding dominates; mixed equilibrium is inevitable.  
  - **Case:** \(N = 100\), \(B = 100\), \(c = 1\).  
    - *SR prediction:* \(p = 0.01\); expected utility \(\approx 63.2 - 0.01 = 63.19\).  
    - *CDT prediction:* \(q \approx 1 - 0.01^{1/99} \approx 0.955\); expected utility \(= 99\).  
    - *Provision probability:* SR \(\approx 0.632\), CDT \(\approx 0.99\).  

  **Conclusion of Extension:**  
  - CDT predicts higher utility (\(B - c\)) and provision probability due to equilibrium free-riding incentives.  
  - SR predicts lower utility due to wasteful over-provision but argues symmetry justifies its focal status.  
  - Disagreement mirrors prior cruxes: SR prioritizes symmetry, CDT prioritizes equilibrium stability.
