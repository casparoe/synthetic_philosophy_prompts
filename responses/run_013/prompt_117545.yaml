  ### Extension: Luring Lottery with Cost and Public Good  
  - **Utility:** \(U_i = \begin{cases} B - c \cdot k_i & \text{if } K > 0 \\ 0 & \text{if } K = 0 \end{cases}\)  
    - Public good \(B\) is provided iff at least one entry is submitted (\(K > 0\)).  

