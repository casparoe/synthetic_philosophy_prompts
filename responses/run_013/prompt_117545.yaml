  - Public good provision probability: \(1 - \left(\frac{c}{B}\right)^{\frac{N}{N-1}} \approx 1 - \frac{c}{B}\) for large \(N\).  
  - *Why?* Agents free-ride if others provide (\(B\) for \(k_i = 0\)) but submit if pivotal. Mixed strategy balances these incentives.  

