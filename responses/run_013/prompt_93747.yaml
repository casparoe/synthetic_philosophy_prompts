answer: |-
  ## Villanelle: The Double Flight

  I am this role, defined and complete.  
  My tray describes a perfect arc, you see.  
  I am nothing that these gestures show.  

  The coffee cups align, precise and neat,  
  A posture held with practised certainty.  
  I am this role, defined and complete.  

  My hand rests lightly, just as it should,  
  No tremor hints at what I might decree.  
  I am nothing that these gestures show.  

  The script is written, choice obsolete,  
  A nature fixed, eternally.  
  I am this role, defined and complete.  

  No past holds weight, no future force to meet,  
  This chosen drift absolves all agency.  
  I am nothing that these gestures show.  

  The careful step, the hand devoid of heat,  
  Are shells where no true self can ever be.  
  I am this role, defined and complete.  
  I am nothing that these gestures show.

  ### Note on Interpretation
  This villanelle leans on Sartre's presentation of bad faith (*mauvaise foi*) as a single, unstable evasion manifesting as two seemingly opposite, yet fundamentally identical, flights: the denial of transcendence (retreat into facticity: "I *am* this waiter/coward") and the denial of facticity (retreat into pure transcendence: "I *am not* my acts, I am nothing"). The refrains embody these mutually undermining assertions. The structure enacts the necessary, repetitive reassertion of the belief, as neither pole offers stable refuge and each negation implicitly relies on the presence of what it denies. The waiter's overly precise movements and the woman's detached hand serve as enacted demonstrations, not cited examples. The primary liberty is presenting the two flights as distinct refrains; while Sartre insists they are one gesture (para. 8, *BN* Pt 1, Ch 2), the poetic form requires this separation to enact their conflict. My confidence in this reading is high (8/10), as it reflects Sartre's core dialectic. The point I'm least sure about is whether the poem adequately conveys that the evasions are *simultaneously* untenable – that the waiter's "facticity" claim is undermined by the very consciousness performing it, just as the transcendence claim is falsified by the concrete act of evasion itself. The poem relies on the juxtaposition and failure to resolve to imply this, which I believe is faithful, but risks making them seem merely alternating rather than co-constitutive aspects of a single, impossible project.

  \answer{The poem enacts bad faith as the perpetual, unstable oscillation between asserting a fixed, defining essence ("I am this role") and claiming a disembodied freedom detached from one's acts ("I am nothing that these gestures show"), demonstrating that both are evasions of the inescapable tension of being-for-itself.}
