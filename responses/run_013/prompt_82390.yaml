answer: |-
  Your analysis requires dissecting the institutional logic of animal welfare regulations, moving beyond ethical debate to expose the operational presuppositions. Here's a structured reconstruction:

  ### 1. **Threshold vs. Continuum: What the Practice Needs**
     - **Presupposes a Threshold Property**: The practice *needs* sentience to be treated as a binary threshold for legal applicability. Regulations require a clear, administratively tractable boundary to assign legal obligations (e.g., IACUC protocols for vertebrates, not insects). This binary is non-negotiable for enforcement.  
     - **Fits with a Continuum**: The practice *accommodates* gradation only at the margins (e.g., adding cephalopods). Exceptions are treated as discrete expansions of the threshold, not admissions of a smooth continuum. The vertebrate default acts as a practical heuristic, but the *system functions because it assumes most invertebrates fall below a sentience "cliff," not a slope*.  
     - **Key Tension**: The practice *needs* a bright line to function efficiently but *fits* evidence of gradation only if exceptions remain rare and categorical (e.g., "all cephalopods" vs. "some beetles under specific conditions").

  ### 2. **Compatibility with Graded/Cluster Theories**
     - **Graded Schedule Compatibility**: The practice is **formally compatible** but **functionally hostile** to graded weights.  
       - *Compatibility*: Existing exceptions (cephalopods/crustaceans) show the system can accommodate new categories. Committees already scale protocols (e.g., stricter standards for primates vs. rodents).  
       - *Functional Hostility*: A fine-grained weight system would collapse under administrative burden. Regulations rely on categorical proxies (e.g., "vertebrate") to avoid case-by-case assessments. The system presupposes **tractable taxonomic generalization**—not that sentience lacks gradation, but that gradation cannot be operationalized at scale without clear categorical anchors.  
     - **Cluster Theory Compatibility**: Similarly compatible in principle but disruptive in practice. The system presupposes **sentience as a unified package** for regulatory purposes. If dissociable capacities (e.g., nociception without affective valence) demanded distinct protections, the institution lacks machinery to implement fragmented obligations (e.g., anesthesia for nociceptors without enrichment for frustration).  
     - **Strict Presuppositions**:  
       - Sentience is **sufficient** for moral status.  
       - It can be **reliably mapped onto broad biological taxa** (not individuals or narrow species).  
       - **Absence of evidence** for sentience in a taxon justifies **absence of obligation**.  

  ### 3. **The Zero Point and Artifacts: Two Kinds of Silence**
     - **Zero Point**: The practice presupposes sentience is **biologically grounded**. The "zero" is not an artifact but **non-neural or minimally neural life** (e.g., bacteria, plants). Insects are excluded as putatively non-sentient *biological entities*, occupying a liminal space between sentient vertebrates and non-sentient life.  
     - **Artifacts vs. Insects**:  
       - **Thermostats** are excluded via **categorical discontinuity between life and non-life**. The practice presupposes sentience emerges only in certain biological systems (implied: with centralized nervous systems).  
       - **Insects** *are* biological entities but excluded due to **presumed lack of the relevant neural complexity**. The silence is different: thermostats are non-starters; insects are "considered and rejected" based on taxonomy.  
     - **Institutional Barrier**: The system **presupposes a neural correlate of sentience** (NCS) tied to vertebrate-like structures. Without NCS evidence, entities default to "no moral weight"—whether insect or thermostat.

  ### 4. **Institutional Changes for Gradation & Underdetermination**
     - **Changes Required for Gradation**:  
       - **Tiered Oversight Committees**: Replace binary IACUC/ethics committees with multi-tiered review bodies (e.g., "Tier 3: Drosophila," "Tier 1: Mammals").  
       - **Dynamic Evidence Integration**: Mandated, funded mechanisms to regularly update taxon weights (e.g., a standing panel on invertebrate cognition).  
       - **Proportional Protocols**: Regulations specifying scaled requirements (e.g., anesthesia mandatory for weight ≥0.7, enrichment for ≥0.5).  
       - **Burden of Proof Shift**: For high-weight taxa, justification focuses on *alternatives*; for low-weight, on *evidence of sentience absence*.  
     - **Underdetermination**: The current practice is consistent with at least two incompatible theories:  
       - **Precautionary Threshold Theory**: "Vertebrates are the least disputable sentient group; better to err narrowly."  
       - **Practical Heuristic Theory**: "Sentience is graded, but vertebrate boundaries maximize net protection given administrative constraints."  
       Both justify the same regulations but imply different responses to new evidence (e.g., precautionary demands expanding the threshold; heuristic permits flexible recalibration).

  ### Conclusion: The Implicit Institutional Theory
  The practice presupposes:  
  **(1) Sentience is binary for regulatory purposes**;  
  **(2) It robustly correlates with phylogeny** (vertebrate/invertebrate divide);  
  **(3) Absence of proof of sentience = proof of absence** for policymaking;  
  **(4) Administrative feasibility overrides moral precision**.  

  This system is resilient because it prioritizes implementability over ethical nuance. Graded reforms would require institutional revolution—not just new rules, but new bureaucratic structures capable of continuous calibration. The silence on insects reflects not ontological certainty but a bet that their exclusion simplifies compliance without provoking moral outrage. Thermostats, lacking biology, never enter the calculus.
