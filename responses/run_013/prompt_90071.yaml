prompt: |-
  I'm TAing a second-year bioethics course and next week I've got 75 minutes on the nonidentity problem, in a room of mostly pre-meds and public-health students who've had exactly one prior ethics session — they've already done the repugnant conclusion and will try to collapse everything into it. Dont explain the problem to me; plan how I should explain it. I want the order the pieces have to go in and why each one depends on the last, the single case that carries the whole thing (not the usual pregnant-teenager case — build it as a contrast pair where the exposure happens after conception in one and before conception in the other, so the only thing that varies is when it happened relative to the child existing, and in neither case is the life not worth living), the misconceptions they'll form in the order they'll form them — my guess is the big one is that harm just means being worse off than you otherwise would have been, which they'll then apply with total confidence to the pre-conception case — and exactly where in the sequence I should head each one off, plus what I should flatly refuse to cover at this level and say so out loud, and one question to ask at the end that shows whether they've actually got it rather than just nodded along. Give it to me as exactly five numbered items, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Okay, the user is a TA preparing a 75-minute session on the nonidentity problem for second-year bioethics students. They've specified key constraints: students are mostly pre-med/public health majors with only one prior ethics session (covering the repugnant conclusion), and they tend to reduce everything to that framework. The user wants a no-frills, five-point plan with strict sequencing logic.

  Hmm, the core challenge is preventing conceptual collapse into the repugnant conclusion while building the nonidentity paradox from first principles. The user explicitly rejects the standard pregnant teen case - smart, because that example often triggers immediate "but the child's life is still worth living!" debates before students grasp the timing paradox. 

  I'll construct a contrast pair: same teratogen exposure, same disability outcome, same life-worth-living condition - but varying only whether exposure precedes conception (Case A) or occurs post-conception (Case B). This laser-focuses attention on the conception-timing variable. 

  Biggest landmine: students will instinctively define harm as counterfactual disadvantage ("worse off than they could've been"). They'll correctly apply this to Case B but misapply it to Case A, not realizing the pre-conception child literally couldn't have existed without the exposure. Must preempt this by forcing the counterfactual comparison explicitly at step 3. 

  Should bluntly exclude three things: 1) identity-independent wrongs (distracts from paradox core), 2) repugnant conclusion comparisons (they'll try anyway), 3) real-world policy applications (too advanced). 

  Final test question must expose whether they distinguish harm from wrongness - perhaps asking them to articulate why Case A isn't harmful but might still be wrong. If they revert to counterfactual harm language, they've missed it.
answer: |-
  Here's your five-point plan:

  1.  **Establish the Harm Principle Baseline:** Start with a clear, intuitive case of harm *after conception*. *Example:* "A pregnant person is exposed to a toxin that causes a moderate but manageable disability in their child. The child's life is still worth living." *Why:* Anchors the session in the familiar counterfactual harm definition ("worse off than they otherwise would have been"). This is their starting point and needs to be solid before disrupting it. *Head off:* Immediately clarify "life worth living" isn't in question here or in the next case.

  2.  **Introduce the Pre-Conception Contrast Case:** Present the *structurally identical* case but *before conception*. *Example:* "A person *planning* pregnancy is exposed to the *same toxin*, causing the *same moderate disability* in their future child. Conception happens after exposure. The child's life is still worth living." *Why:* Forces direct comparison. The disability outcome and life-worth-living status are identical; *only* the timing relative to conception differs. This isolates the nonidentity variable. *Head off:* Preemptively state the *only* difference is timing – dismiss any immediate attempts to argue the disability is different or the life isn't worth living.

  3.  **Apply the Counterfactual Test Rigorously to Both:** Ask: "Is the child in Case 1 (post-conception exposure) worse off than *they themselves* would have been without the exposure? (Yes). Ask: "Is the child in Case 2 (pre-conception exposure) worse off than *they themselves* would have been without the exposure?" *Why:* This is the critical hinge. Students *will* instinctively want to say "Yes" to Case 2. Force the counterfactual: Without the exposure, a *different child* (conceived earlier with different gametes) would exist. The *actual* disabled child *only exists because* of the exposure. They aren't worse off than *they* could have been, because the alternative is their non-existence. *Head off:* Hammer the identity-dependence: No exposure = Different specific child. This child cannot be "worse off" than a scenario where *they* don't exist.

  4.  **State the Paradox & Explicitly Limit Scope:** Declare: "So, Case 1 clearly harms the child. Case 2 seems wrong, but we cannot say it *harms this specific child* under the counterfactual definition. That's the nonidentity problem." *Why:* Forces them to confront the paradox arising from steps 1-3. *Head off:* **Explicitly refuse to cover:** (a) Whether the *act* is still wrong for other reasons (e.g., reckless, harms society, impersonal wrongs), (b) Connections to the Repugnant Conclusion ("That's a different problem about population *size* and average welfare; this is about the identity and welfare of *specific* future people"), (c) Complex real-world policy applications (e.g., climate change) beyond this core logical puzzle. State these limits clearly.

  5.  **The Key Test Question:** End with: "Explain, using the counterfactual definition of harm, why we can say the post-conception exposure harms the child, but the pre-conception exposure does *not* harm *that specific child*, even though both result in the same disability." *Why:* This requires synthesizing steps 3 and 4. A correct answer *must* reference the identity-dependence of the counterfactual comparison for the pre-conception case ("Without the exposure, *a different child* would exist; this specific child wouldn't be worse off because they wouldn't exist"). Any answer reverting to simple "worse outcome" or collapsing into repugnant conclusion logic shows misunderstanding.
