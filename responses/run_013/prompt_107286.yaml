answer: |-
  Here are five pressing questions with follow-ups:

  1. Nyāya claims testimony delivers knowledge *without* reducing to inference, yet the hearer must still infer the speaker's reliability. Isn't this process of assessing competence and honesty fundamentally inferential, making testimony merely a complex inference chain?  
     *(Likely Reply: The *initial* acceptance is direct based on the source's perceived credibility, not a conscious inference.)*  
     **Follow-up:** But doesn't "perceived credibility" itself rely on past inferences about speakers? If a child accepts a parent's word without any prior inferences, is that justified knowledge or just luck? How does Nyāya guarantee truth without *any* background inference?

  2. If testimony is irreducible, how does it explain misunderstanding? When I hear "bank" but misinterpret it as riverbank instead of financial bank, perception heard the sound and inference failed – where does the distinct pramāṇa *śabda* operate if it delivers false understanding?  
     *(Likely Reply: Śabda functions when the words are correctly grasped in their intended meaning; failure is due to defects in perception or inference, not testimony itself.)*  
     **Follow-up:** Doesn't this make the *knowledge-yielding core* of testimony entirely dependent on perception (hearing sounds) and inference (assigning meaning)? If śabda only works when these other pramāṇas succeed, how is it truly independent?

  3. Nyāya accepts that testimony can be unreliable (from incompetent/deceptive speakers). Doesn't this mean trust in testimony *always* requires background verification via perception/inference to establish the source's reliability, reducing it to those other pramāṇas?  
     *(Likely Reply: We have a *prima facie* right to trust testimony; the burden shifts to doubt. We learn the general reliability of testimony itself through experience.)*  
     **Follow-up:** If that initial "prima facie right" is based on past experiential learning (via perception/inference), isn't the ultimate justification for trusting *any* specific testimony still grounded in inference from past cases?

  4. Nyāya sometimes includes divine/testimonial scripture (like the Vedas) as śabda. If humans authored a text claiming divine origin, how can śabda as an independent source help us know it's *truly* divine without circularity? Doesn't establishing divine authorship require perception/inference?  
     *(Likely Reply: Authorless Vedas are a special case; for human claims, we assess the speaker's credibility like any testimony.)*  
     **Follow-up:** Then isn't the unique epistemic status of śabda compromised? For divine claims, it seems circular; for human claims, its justification collapses back into assessing reliability via other means. How does śabda remain fundamentally distinct?

  5. Consider a reliable AI system generating accurate information about a novel virus. It has no human-like intention, belief, or competence we can assess. Can its output be knowledge via śabda? If not, why? If so, how does Nyāya explain knowledge from a source lacking consciousness?  
     *(Likely Reply: If the AI system is reliably designed/programmed, its output can function *like* testimony; the reliability condition is key.)*  
     **Follow-up:** But if the knowledge comes *only* from our background inference about the AI's reliability (its design, training data, past accuracy), haven't we reduced this instance of "testimony" entirely to inference? What uniquely "testimonial" element remains beyond the inferred reliability?
