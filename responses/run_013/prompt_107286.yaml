  I am a high school student who hosts a small philosophy interview podcast. Next week my guest is a philosopher who defends the Nyāya position that testimony (śabda) is an independent pramāṇa—a basic source of knowledge on a par with perception and inference, and not reducible to either. I would like questions that press the view rather than allow him simply to restate it. Please draft exactly five interview questions, numbered, each one or two sentences, with no introduction or conclusion. Each question should include a follow-up keyed to the answer he is most likely to give, and at least one should address a case in which a reliable AI system produces information without any human speaker.
