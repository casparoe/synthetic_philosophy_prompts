prompt: |-
  Me and my brother-in-law keep going in circles about whether the exodus out of Egypt actually happened. He keeps busting out "absence of evidence is not evidence of absence," meaning that just because archaeologists have dug around in the Sinai and never found a trace of a few hundred thousand people supposedly wandering there for forty years, that doesn't mean it didn't happen. I definately get why that sounds right, but it also feels way too convenient — if the sentence were true as stated, you could never use missing evidence against any historical claim, and yet historians do it all the time. Can you lay out the different precise things that one sentence could be claiming, from the boringly-true version to the strong version to the one that's flat-out false, and then tell me which reading he actually needs for his argument to go through and whether that reading survives? Make it a list I can just send him.
