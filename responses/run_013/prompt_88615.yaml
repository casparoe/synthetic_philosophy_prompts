  I recall that in archaeology, absence of evidence becomes evidence of absence under certain conditions. For example, if we should expect evidence but find none, that's telling. The Sinai desert's conditions might not preserve remains well, but 40 years and hundreds of thousands of people? There should be something—pottery, fire pits, graves. But nothing has been found.

  The user mentioned historians using missing evidence against claims. Cases like the Trojan War had textual sources before archaeological evidence was found. But for Exodus, there's a lack of corroborative texts from Egypt. The Merneptah Stele mentions Israel but not as slaves or an exodus. That's another point against the brother-in-law's argument.

