prompt: |-
  ok so im a 4th-year phd (philosophy, currently on a bioethics fellowship) and next month im presenting a diss chapter to our hospitals clinical ethics committee. the room is: two geriatric psychiatrists from the memory clinic, a palliative care NP who runs the inpatient ethics consults, an internist, the hospitals general counsel (a lawyer, not a philosopher, and shes the one who scares me), a community rep who sits on the dementia family council, and the chair, who did a phd in philosophy before med school and actually knows the literature. im the only person in there paid to think about this stuff.

  what im defending: the standard justification for advance directives — that they carry the competent persons autonomy forward over the later, incompetent one — is quietly doing something it cant admit, namely treating the earlier self as having authority over a self it is no longer. my alternative is that a directive is a status power, closer to a will than to a promise i make to my future self: what binds is that the institution (law, hospital, committee) treats the written declaration as decisive, not that the earlier me owned the later me. that shifts the real question from "what did she want" to "what does the institution owe the person who is actually here now." i lean on the will analogy hard, i concede up front that a body isnt property, and i also want to say the current self can revise in a way a will cant — my advisor says thats the crack in the whole thing and i think shes definately right.

  give me my q&a prep sheet: exactly five numbered items, no intro and no wrap-up, two sentences max each. sentence one is the objection the way that person would actually say it in their own vocabulary, not the way it gets put in the journals; sentence two is my reply plus a note on where the reply goes soft. order them by how much theyd hurt me, and make the fifth one the question im dreading.
reasoning: |-
  Okay, the user is a 4th-year PhD in Philosophy, currently on a bioethics fellowship, preparing to present a dissertation chapter to a hospital's clinical ethics committee. They need a Q&A prep sheet with exactly five objections they might face, ordered by how much they'd hurt, with the fifth being the one they dread most. Each item must have two sentences: the first is the objection in the speaker's natural vocabulary, the second is their reply plus where it goes soft.

  Breaking down their argument: They're challenging the standard autonomy-based justification for advance directives. Instead of viewing advance directives as extending a competent person's autonomy over their future incompetent self, they propose it's a status power—like a will—where the institution treats the written declaration as decisive. The key shift is from "what did she want" to "what does the institution owe the person who is actually here now." They admit the analogy to wills has a crack: a current self can revise the directive, unlike a will that's irrevocable after death.

  Now, assessing the committee members and their likely objections:  
