prompt: |-
  I'm co-teaching a final-year undergrad/MA seminar on rational choice this term and I've somehow ended up responsible for the Ellsberg question on the final. Every version I've drafted so far can be answered by reciting the standard line — people prefer the known urn, they avoid the unknown one, that violates the sure-thing principle, so expected utility is in trouble — and I want something that actually separates the students who understand whats going on from the ones who just have the slogan memorised. So I've been going back and fourth about a twist to build the question around, and I think I've got one.

  Take the usual setup: 90 balls, 30 red, the other 60 black or yellow in some unknown proportion, and the four bets (win $100 on red; on black; on red-or-yellow; on black-or-yellow), with the familiar pattern where people take red over black and take black-or-yellow over red-or-yellow. Now add a fifth option, the machine urn: 100 balls, each black or white, and the composition was fixed by a fair coin — heads and it's 30 black / 70 white, tails and it's 70 black / 30 white. Students are told the coin is fair and told exactly how the urn was made; they're just not told how it landed. So here's what I want them to have to confront: compare a $100 bet on black in the machine urn with the same bet in a plain urn we know to be exactly 50/50. Is preferring the 50/50 urn just a mistake, since the machine urn's second-order story says the chance of black is exactly one half? Or is it not a mistake, because there are perfectly respectable ways of modelling ambiguity aversion that take the second-order distribution seriously as an input and still predict the preference? Or does the whole thing show that the second-order distribution is the wrong object to be feeding the agent in the first place, and that what's really going on is something more like going by the worst composition consistent with what you know? I want the question to force them to pick one and defend it, and I want it to be impossible to answer by writing down the words "ambiguity aversion" and moving on.

  Could you write me the question itself — something a strong student could do properly in about 45 minutes, worth 20 marks — plus a model answer of around 700-800 words and a marking scheme built on five or six must-hit moves, with the marks for each (adding to 20) and a one-line note on the typical way students miss each one (e.g. conflating the sure-thing principle with the independence axiom, or assuming that any two prospects with the same expected value have to look the same to a rational agent). In the model answer please be careful to separate the parts that are settled from the parts that are genuinely contested: I don't want students marking themselves against a model answer that presents "ambiguity aversion is irrational" or "second-order probabilities dissolve the paradox" as if everyone who works on this agrees. Where the people who know the area actually disagree, say that they disagree and say what the disagreement turns on. You can describe the different formal families in plain words rather than by name — I care about whether they've got the structure right, not the labels.
reasoning: |-
  We are designing a question for a final exam that goes beyond the standard Ellsberg paradox. The goal is to force students to engage with a new urn (the machine urn) and compare it to a known 50/50 urn. The question should require them to defend a position on whether preferring the 50/50 urn over the machine urn is rational or not, and why, using concepts from ambiguity aversion and decision theory.

  The setup:
  - Standard Ellsberg: 90 balls, 30 red, 60 black or yellow in unknown proportion.
  - Four bets: win $100 on red; on black; on red-or-yellow; on black-or-yellow. (The typical pattern: red over black and black-or-yellow over red-or-yellow.)
  - New elements:
    - Machine urn: 100 balls, each black or white. Composition fixed by a fair coin: heads -> 30 black, 70 white; tails -> 70 black, 30 white. The coin is fair and the process is known, but the outcome (heads/tails) is not known.
    - Plain urn: known to be exactly 50 black and 50 white (so 50% chance of black).

  The comparison: a $100 bet on black in the machine urn vs. the same bet in the plain 50/50 urn.

  We want students to discuss:
  1. Is preferring the 50/50 urn a mistake? (Because the machine urn has an expected chance of black of exactly 0.5? Or not?)
  2. How do models of ambiguity aversion handle the machine urn? Do they still predict a preference for the 50/50 urn? 
  3. Is the second-order distribution the right input, or should we focus on the worst-case scenario?

  The question must force them to pick a stance and defend it, and avoid being answerable by rote.

  Structure of the question:
  - Describe the standard Ellsberg setup and the typical choices (without giving away the answer for the new part).
  - Introduce the machine urn and the plain urn (50/50).
  - Pose the specific comparison: bet on black in machine urn vs. bet on black in plain urn.
  - Ask: "Some people might prefer the bet on black in the plain urn to the same bet in the machine urn. Is this preference irrational? Why or why not? In your answer, be sure to explain how the machine urn differs from the standard ambiguous urn in the Ellsberg paradox, and discuss whether and why a person who is ambiguity averse might or might not prefer the plain urn. Use the concepts of expected utility and alternative models of decision under ambiguity to support your argument."

  Model Answer:
  We need to cover:
  - The machine urn has a second-order probability: 50% chance of a 30% black urn and 50% chance of a 70% black urn. Therefore, the overall probability of black is 0.5 (since 0.5*0.3 + 0.5*0.7 = 0.5). So by the law of total probability, it is a 50% chance. However, the machine urn has known uncertainty (we know the distribution over compositions) whereas the plain urn has no uncertainty (fixed 50%).
  - In the standard Ellsberg, the ambiguous urn has no known distribution over the proportion of black and yellow. That is, the decision maker does not have a second-order probability. The machine urn, by contrast, has a known second-order probability.
  - Ambiguity aversion is typically about not knowing the probabilities (not having a unique prior). In the machine urn, we do have a unique prior (the coin flip) so we can assign a unique probability (0.5) to black. However, the machine urn still has two stages: first the coin flip, then the draw. This is similar to a compound lottery. Expected utility theory (through the reduction of compound lotteries) would say that the machine urn is equivalent to the plain urn: both are 50% black. Therefore, according to expected utility, there should be no preference between them.
  - However, an ambiguity averse agent might still prefer the plain urn because the machine urn has an extra layer of uncertainty. Models that do not reduce compound lotteries (like some models of ambiguity aversion) might distinguish between the two. For example:
    - Maxmin expected utility (Gilboa and Schmeidler): the agent considers the worst-case scenario. In the machine urn, the worst-case scenario for a bet on black is the state where the coin landed such that black is only 30% (so the probability of winning is only 0.3). In the plain urn, the probability is fixed at 0.5. Therefore, the maxmin agent would value the plain urn at 0.5 and the machine urn at 0.3, and thus prefer the plain urn.
    - Alternatively, if we use a model that incorporates second-order probabilities and then applies a penalty for dispersion (like in Klibanoff, Marinacci, and Mukerji's smooth ambiguity model), then the machine urn might be less attractive than the plain urn because of the variance in the possible probabilities. The plain urn has no variance (fixed 50%), while the machine urn has two possible probabilities (30% or 70%) with equal chance. The smooth ambiguity model would compute the expected utility by taking the expectation over the second-order distribution but then applying a concave transformation to the utilities, which would make the machine urn less attractive if the agent is ambiguity averse.
  - On the other hand, a Bayesian (subjective expected utility) agent would reduce the compound lottery and be indifferent.

  So the answer is: 
  - The preference for the plain urn over the machine urn is not irrational if the decision maker is ambiguity averse. It can be explained by models that do not reduce compound lotteries and that are sensitive to the dispersion of probabilities. However, it would be considered irrational by the lights of expected utility theory (which requires reduction of compound lotteries and linearity in probabilities).

  But note: the standard Ellsberg ambiguous urn does not have a known second-order distribution, while the machine urn does. This is a key difference.

  Marking Scheme (20 points):

  1. (3 points) Correctly compute the overall probability of black in the machine urn as 0.5 and note that the plain urn also has 0.5. 
     - Miss: Failing to compute the overall probability or getting it wrong.

  2. (4 points) Explain that according to expected utility theory (with reduction of compound lotteries), the two urns should be indifferent. 
     - Miss: Claiming that the machine urn is not 50% without justification, or not mentioning reduction of compound lotteries.

  3. (4 points) Explain why an ambiguity averse individual might still prefer the plain urn, using the worst-case reasoning (maxmin) or the smooth ambiguity model (dispersion penalty). 
     - Miss: Only stating that there is ambiguity without explaining how the model accounts for it, or not distinguishing between the machine urn and the standard Ellsberg ambiguous urn.

  4. (3 points) Discuss the difference between the machine urn and the standard Ellsberg ambiguous urn: the standard ambiguous urn has no known second-order distribution, while the machine urn does. 
     - Miss: Treating the machine urn as identical to the standard ambiguous urn.

  5. (3 points) Take a clear stance and defend it: either the preference is irrational (because it violates reduction of compound lotteries) or it is rational (because ambiguity aversion models can explain it). 
     - Miss: Not taking a stance, or taking a stance without defense.

  6. (3 points) Overall coherence, structure, and clarity of the answer. 
     - Miss: Disorganized, unclear, or missing key steps.

  Now the question and model answer:

  Question:

  Consider the following two scenarios:

  (A) The standard Ellsberg paradox setup: An urn contains 90 balls, 30 of which are red, and the remaining 60 are black or yellow in an unknown proportion. You are offered bets that pay $100 if a randomly drawn ball is of a specific color (or set of colors). The typical pattern of choices is that people prefer a bet on red to a bet on black, and they prefer a bet on black-or-yellow to a bet on red-or-yellow.

  (B) A new urn, called the "machine urn", is constructed as follows: A fair coin is flipped. If the coin lands heads, the urn contains 30 black balls and 70 white balls. If the coin lands tails, the urn contains 70 black balls and 30 white balls. The coin flip has already occurred, but you are not told the outcome. So the urn has 100 balls, each either black or white, but you don't know the exact composition. Additionally, consider a "plain urn" that you know for sure contains exactly 50 black balls and 50 white balls.

  Now, consider a bet that pays $100 if a randomly drawn ball from an urn is black.

  Some people might prefer to take this bet on the plain urn (with known 50/50 composition) rather than on the machine urn. Is this preference irrational? Why or why not?

  In your answer, be sure to:

  1. Explain the overall probability of winning the bet in each urn.
  2. Discuss how a decision maker who follows expected utility theory would evaluate these two bets.
  3. Explain how a decision maker who is ambiguity averse might evaluate these two bets, and how this evaluation might differ from the expected utility evaluation.
  4. Compare the machine urn to the standard ambiguous urn in the Ellsberg paradox (from part A) — what is the key difference?
  5. Defend your position on the rationality of the preference.

  Model Answer (approx. 700-800 words):

  The preference for the plain urn (with known 50 black and 50 white) over the machine urn for a bet on black is not necessarily irrational. It can be explained by models of decision-making that account for ambiguity aversion, although it does violate expected utility theory. I will explain why.

  First, let's compute the probabilities. The plain urn has a fixed 50 black balls out of 100, so the probability of winning $100 by betting on black is 0.5. For the machine urn, we know the composition is determined by a fair coin flip: with 50% chance the urn has 30 black and 70 white, and with 50% chance it has 70 black and 30 white. Therefore, the overall probability of drawing a black ball is (0.5 * 30/100) + (0.5 * 70/100) = (0.5 * 0.3) + (0.5 * 0.7) = 0.15 + 0.35 = 0.5. So both urns give a 50% chance of winning $100.

  Expected utility theory (EU) treats lotteries solely by their final outcomes and probabilities. A key tenet of EU is the reduction of compound lotteries: a compound lottery (like the machine urn, which is a two-stage process) is equivalent to the simple lottery that yields the same final probabilities. Therefore, under EU, the machine urn and the plain urn are identical: both are simple lotteries with a 0.5 chance of winning $100 and 0.5 chance of winning $0. Hence, a rational EU maximizer must be indifferent between the two.

  However, empirical research shows that people often violate reduction of compound lotteries and exhibit ambiguity aversion. The standard Ellsberg paradox demonstrates that people dislike not knowing the exact probabilities (ambiguity). In the standard Ellsberg urn, the proportion of black and yellow is completely unknown — there is no second-order probability distribution given. In contrast, the machine urn has a known second-order distribution: we know the two possible compositions and their probabilities (each 50%). This is a crucial difference. The machine urn is a compound lottery with known second-order probabilities, while the standard Ellsberg ambiguous urn is a case of complete ignorance.

  Despite the known second-order probabilities, an ambiguity averse individual might still prefer the plain urn. Why? Because ambiguity aversion is not only about the lack of a unique prior but also about the dispersion of possible probabilities. Consider two models:

  1. The maxmin expected utility model (also called the multiple priors model): an ambiguity averse agent evaluates an act by the worst-case prior. For a bet on black in the machine urn, the worst-case composition is the one with only 30 black balls (30% chance of winning). Therefore, the agent assigns a value of 0.3 to the machine urn bet. The plain urn, being fixed at 50%, gets a value of 0.5. Hence, the agent strictly prefers the plain urn.

  2. The smooth ambiguity model: here, the agent has a second-order probability (the coin flip is 50-50) and also a concave transformation of the expected utilities in each scenario. The agent computes the expected utility for each state of the world (each composition) and then takes an expectation over the second-order probabilities after applying a concave function. Because of the concavity, the agent is penalized for the spread in the possible expected utilities. In the machine urn, the two scenarios yield 0.3 and 0.7, which are spread out, while the plain urn has no spread (only 0.5). Therefore, even though the average is 0.5, the spread makes the machine urn less attractive.

  Thus, the preference for the plain urn can be rationalized by ambiguity aversion. However, note that expected utility theory would deem this preference irrational because it violates reduction of compound lotteries. There is genuine disagreement among decision theorists about whether such preferences are rational. On one hand, Bayesians argue that reduction is normatively compelling: if two prospects have the same final probability distribution, they should be equally valued. On the other hand, ambiguity aversion advocates argue that the source of uncertainty matters: the machine urn has an extra layer of uncertainty (the coin flip) and that this uncertainty is aversive.

  In my view, the preference is not irrational because it can be justified by a coherent model that accounts for the presence of compound uncertainty. The Ellsberg paradox and its variants show that people do care about the source of uncertainty, and ambiguity aversion models provide a way to incorporate that concern. The machine urn, while having a known second-order distribution, still presents the agent with two very different possible worlds (30% or 70% black) and that variability might be undesirable. The plain urn offers certainty about the probability itself.

  Therefore, the preference for the plain urn over the machine urn is not irrational; it reflects a sensible aversion to the dispersion of probabilities present in the machine urn. This preference is consistent with ambiguity aversion, which is a well-documented phenomenon and for which there are rigorous decision models.

  [Word count: approx. 750]
answer: |-
  ### Exam Question: Ellsberg Paradox and the Machine Urn

  **Total Marks: 20**  
  **Time Guideline: 45 minutes**  

  **Background:**  
  In the standard Ellsberg paradox, an urn contains 90 balls: 30 are red, and the remaining 60 are an unknown mix of black and yellow. Participants typically prefer:  
  - Betting $100 on *red* over betting on *black*,  
  - Betting $100 on *black-or-yellow* over betting on *red-or-yellow*.  
  This violates expected utility theory (especially the "sure-thing principle"), revealing *ambiguity aversion*—dislike for unknown probabilities.  

  **New Scenario:**  
  Now consider two other urns:  
  - **Machine Urn:** Contains 100 black or white balls. Its composition was determined by a fair coin flip:  
    - Heads: 30 black, 70 white.  
    - Tails: 70 black, 30 white.  
    The coin flip has already occurred (you know it was fair), but you are not told the outcome.  
  - **Plain Urn:** Contains exactly 50 black and 50 white balls (no uncertainty).  

  **Bet:** Win $100 if a randomly drawn ball is **black**.  

  **Observation:**  
  Some people prefer betting on black in the *Plain Urn* over the *Machine Urn*.  

  **Question:**  
  Is this preference **irrational**? Defend your answer with explicit reference to:  
  1. The probabilities involved in each urn.  
  2. How expected utility theory evaluates these bets.  
  3. How ambiguity aversion models (e.g., worst-case reasoning or second-order uncertainty) explain the preference.  
  4. The key difference between the Machine Urn and the standard Ellsberg ambiguous urn.  
  5. Whether "rationality" requires indifference between these bets.  

  ---

  ### Model Answer (≈ 750 words)  
  **Position:** *The preference for the Plain Urn is not irrational. It reflects ambiguity aversion, which can be modeled coherently.*  

  #### 1. Probabilities in Each Urn  
  - **Plain Urn:** Exactly 50 black balls. Probability of winning = 50/100 = 0.5.  
  - **Machine Urn:** Two possible compositions:  
    - 30% black (if heads),  
    - 70% black (if tails).  
    Since the coin is fair, the **overall probability** of black is:  
    `(0.5 × 0.3) + (0.5 × 0.7) = 0.5`.  
  Both urns offer a 0.5 chance of winning. If rationality only cares about final probabilities, they should be equivalent.  

  #### 2. Expected Utility Theory (EUT)  
  EUT reduces all uncertainty to a single probability. The Machine Urn is a **compound lottery**: a coin flip *then* a ball draw. EUT assumes "reduction of compound lotteries": any compound lottery equals its simple equivalent (here, 0.5 chance to win). Thus, EUT demands **indifference** between the Plain and Machine Urns. Preferring the Plain Urn violates this—it seems "irrational" under EUT.  

  #### 3. Ambiguity Aversion Explains the Preference  
  People often treat the Machine Urn differently because its uncertainty has two layers (coin flip + ball draw). Ambiguity-averse models do not reduce compound lotteries mechanically:  
  - **Worst-case reasoning (e.g., Maxmin Expected Utility):**  
    The agent evaluates bets by the worst possible outcome. For betting on black:  
    - Plain Urn: Minimum win chance = 0.5.  
    - Machine Urn: Worst scenario is 30% black (if heads).  
    Valuing the bet at 0.3 (not 0.5), the agent prefers the Plain Urn. This is consistent and avoids exploitation by nature.  
  - **Second-order uncertainty (e.g., Smooth Ambiguity Model):**  
    The agent uses the second-order distribution (the 50/50 coin) but penalizes dispersion in probabilities. The Machine Urn has extreme probabilities (30% or 70%), while the Plain Urn has none. A concave "ambiguity aversion" function makes the Machine Urn less attractive, even though its *average* probability is 0.5.  

  Crucially, these models **do not assume ignorance of probabilities** (unlike the standard Ellsberg urn). They use the known second-order distribution but weigh it differently than EUT.  

  #### 4. Machine Urn vs. Standard Ellsberg Urn  
  The standard Ellsberg urn has **no known second-order distribution**: the mix of black/yellow is completely ambiguous (no probabilities are given). The Machine Urn, however, has **known second-order uncertainty**: a 50/50 coin governs the composition. This is a key difference—the Machine Urn’s ambiguity is "quantifiable," while the standard urn’s is not.  

  #### 5. Is the Preference Irrational?  
  EUT insists the preference is irrational because it violates reduction of compound lotteries. However, this assumes that all uncertainty sources are irrelevant if final probabilities match—a contested normative claim. Ambiguity aversion argues that **how uncertainty unfolds matters**:  
  - The Machine Urn’s two-stage process creates "Knightian uncertainty" about the true probability (30%? 70%?), even if the average is 50%.  
  - Models like maxmin or smooth ambiguity formalize this aversion coherently, without logical errors.  

  **Conclusion:**  
  The preference is **not irrational**. It exposes a genuine disagreement about rationality:  
  - **Bayesians/EUT defenders** see reduction as normatively compulsory.  
  - **Ambiguity aversion theorists** argue that aversion to layered uncertainty is pragmatically rational (e.g., it avoids worst-case exploitation).  
  The Machine Urn shows that ambiguity aversion persists even with known second-order distributions—it’s not just about ignorance. Thus, the preference reflects a defensible (if non-EUT) response to uncertainty.  

  ---

  ### Marking Scheme (Total 20 Marks)  
  **Award marks for clear, explicit coverage of each point. Deduct marks for vague, confused, or omitted arguments.**  

  1. **Probabilities Calculation (3 marks)**  
     - Correctly computes both urns’ win probabilities as 0.5 (1 mark).  
     - Notes the Machine Urn’s compound structure (coin flip → ball draw) (1 mark).  
     - Explicitly states probabilities are identical under reduction (1 mark).  
     *Typical miss: Claims Machine Urn probability is "unknown" or miscalculates (e.g., ignores coin fairness).*  

  2. **EUT Evaluation (4 marks)**  
     - Explains EUT requires indifference via reduction of compound lotteries (2 marks).  
     - States that preferring Plain Urn violates EUT/sure-thing principle (1 mark).  
     - Notes this suggests "irrationality" under EUT (1 mark).  
     *Typical miss: Fails to mention reduction or conflates sure-thing principle with independence axiom.*  

  3. **Ambiguity Aversion Models (4 marks)**  
     - Uses worst-case reasoning (e.g., values Machine Urn at 30%) (1.5 marks).  
     - Uses second-order reasoning (e.g., penalizes probability dispersion) (1.5 marks).  
     - Contrasts with EUT: ambiguity models do not fully reduce compounds (1 mark).  
     *Typical miss: Treats Machine Urn identically to standard Ellsberg (ignoring known second-order dist).*  

  4. **Machine vs. Standard Ellsberg Urn (3 marks)**  
     - Identifies key difference: Standard urn has no second-order distribution; Machine Urn does (2 marks).  
     - Explains why ambiguity aversion still applies (quantifiable uncertainty ≠ risk) (1 mark).  
     *Typical miss: Assumes both urns are "equally ambiguous."*  

  5. **Rationality Defense (3 marks)**  
     - Takes a stance (e.g., "not irrational") (1 mark).  
     - Justifies via coherence of ambiguity models (1 mark).  
     - Acknowledges EUT’s opposing view (1 mark).  
     *Typical miss: Dismisses preference as "always irrational" without engaging models.*  

  6. **Clarity & Structure (3 marks)**  
     - Logical flow, concision, and avoidance of tangents (1 mark).  
     - Explicitly labels sections (e.g., "EUT says… but ambiguity model says…") (1 mark).  
     - Distinguishes descriptive/normative claims (e.g., "people do this" vs. "it is rational because") (1 mark).  
     *Typical miss: Unstructured narrative, jargon without explanation.*  

  ---  
  **Note to Students:** This question tests *conceptual depth*. Listing "Ellsberg violates EUT" earns 0 marks. Engage the Machine Urn’s specifics and defend your stance rigorously.
