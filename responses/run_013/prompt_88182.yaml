  First, I need to unpack their core concerns. They provided concrete examples like sand piles, clouds, corporations—things that challenge traditional boundaries of "wholes." Their half-formed criterion about self-maintaining loops against entropy is intriguing but needs testing. They explicitly listed seven must-address topics: vagueness, counting, causal work, statue/lump problem, persistence, weird limits, and scientific constraints. 

  The user’s tone suggests frustration with binary answers ("yes to every gerrymandered sum" vs. "no to everything but atoms"). They want nuanced distinctions, not assertions. Deep down, they might be wrestling with realism vs. anti-realism—whether composition is mind-independent or interest-relative. Their request to mark non-negotiables vs. camp preferences hints at this. 

  For each requirement, I’ll structure: 
  - The case (e.g., sand pile for vagueness)
  - What the theory must handle
  - Why it matters (not just naming it)
  - Tensions with other requirements (e.g., vagueness vs. counting)

  Key tensions I foresee: 
  - If composition is vague (Requirement 1), how can counting (Requirement 2) be precise? 
  - Denying gerrymandered sums (Requirement 2) might clash with weird limits (Requirement 6) where arbitrary sums exist. 
  - Self-maintaining loops (their criterion) could exclude corporations or queues—do those truly resist entropy? 

  Their "self-maintaining loop" idea has promise but risks circularity. How does it handle statues (static objects) or corporations (abstract entities)? I’ll flag where it might struggle without dismissing it outright. 

  For scientific constraints (Requirement 7), I’ll separate hard facts (quantum entanglement) from debated ones (whether ecosystems count as "wholes"). The user wants to know which constraints are philosophical taste vs. non-negotiable. 

  Finally, I’ll explicitly note where requirements conflict and which are realist/anti-realist leaning. Example: Vagueness being conventional (anti-realist) vs. causal work implying mind-independent joints (realist). No scoring theories—just mapping the battlefield.
answer: |-
  Here’s a specification for an adequate theory of composition, structured by requirements with cases, distinctions, constraints, and underlying considerations. Conflicts between requirements are flagged explicitly.

  ---

  ### **Core Requirements for a Theory of Composition**
  *(Non-negotiables marked with ★)*

  1. **Vagueness Tolerance**  
     - **Case:** Sand heaps (when does adding a grain create a heap?), clouds (fuzzy boundaries), melting statues.  
     - **Must:** Explain *why* composition appears vague (e.g., indeterminate boundaries, gradual part-dependence) without collapsing into "everything is vague" or "vagueness is an illusion."  
     - **Constraint:** Cannot deny that *some* composites (e.g., atoms) have precise boundaries.  
     - **Consideration:** Language and perception track continuous processes; composition may be a matter of degree. **Tension with Requirement 2 (Counting).**  
     - **Realism Divide:** Anti-realists see vagueness as proof composition is interest-relative; realists must explain it as ontological indeterminacy.

  2. **Restricted Generality (No Universal Composition/No Nihilism)** ★  
     - **Case:** Counting objects in a room (if arbitrary sums exist, there are infinite things); rejecting gerrymandered wholes (e.g., "trout-turkey" fusions).  
     - **Must:** Explain why *some* collections (e.g., a beehive) compose a whole, but *not all* (e.g., a random set of leaves and rocks). Rule out both extremes:  
       - *Extreme Universalism* (every sum is an object) makes counting/quantification incoherent.  
       - *Extreme Nihilism* (only simples exist) ignores emergent behavior (e.g., whirlpools).  
     - **Consideration:** Science and daily life rely on counting discrete objects; unrestricted composition breaks physics and logic.  
     - **Realism Divide:** Realists need objective restrictions; anti-realists can appeal to context.

  3. **Causal/Explanatory Autonomy**  
     - **Case:** A flame (parts = molecules; whole = self-sustaining combustion), a corporation (actions irreducible to employees).  
     - **Must:** Clarify if/when the whole has causal powers *not reducible* to parts (e.g., a whirlpool drowning someone vs. individual water molecules).  
     - **Constraint:** Cannot contradict physics (e.g., thermodynamics in self-maintaining systems).  
     - **Consideration:** Emergent behavior in biology/chemistry (e.g., slime molds, cells) suggests wholes *do* explanatory work. **Tension with Requirement 7 (Science).**  
     - **Realism Divide:** Realists demand mind-independent emergence; anti-realists attribute "autonomy" to descriptive convenience.

  4. **Coincidence Resolution** ★  
     - **Case:** Statue vs. lump of clay (same matter, different persistence conditions: lump survives reshaping, statue doesn’t).  
     - **Must:** Distinguish whether these are:  
       - One object under two descriptions (reductive),  
       - Two objects sharing matter (non-reductive), or  
       - A temporal/modal distinction.  
     - **Constraint:** Must align with material constitution (e.g., the lump *is* the statue at time *t*).  
     - **Consideration:** Identity and persistence matter for responsibility (e.g., "This *statue* is valuable" vs. "This *lump* is cheap").  
     - **Realism Divide:** Realists often accept coincident objects; anti-realists reduce to descriptions.

  5. **Dynamic Persistence**  
     - **Case:** Human body (part replacement over time), rivers (constant flow), forests (growth/decay).  
     - **Must:** Specify when part-change destroys the whole (e.g., Ship of Theseus) or allows persistence.  
     - **Constraint:** Cannot imply that losing any part creates a new object (denies continuity).  
     - **Consideration:** Biology and ecology treat organisms/ecosystems as persistent despite flux. **Tension with Requirement 1 (Vagueness).**  
     - **Realism Divide:** Realists need objective persistence conditions; anti-realists tie it to human interests.

  6. **Compatibility with "Weird" Metaphysical Limits**  
     - **Cases:** Gunky worlds (no smallest parts), junky worlds (no largest whole), atomless gunk.  
     - **Must:** Remain coherent in these scenarios without presupposing atoms or cosmic wholes.  
     - **Consideration:** Physics allows for scale-invariance (e.g., quantum fields) and unbounded universes. **Tension with Requirement 2 (Counting).**  
     - **Realism Divide:** Neutral—theory should work regardless.

  7. **Scientific Consistency** ★  
     - **Constraints:**  
       - **Physics:** No "joints" in fundamental physics (quantum entanglement blurs part/whole boundaries).  
       - **Biology:** Organisms as multicellular colonies (coral reefs), species as gene-flow populations.  
       - **Chemistry:** Far-from-equilibrium systems (flames, whirlpools) as self-maintaining.  
     - **Must:** Accommodate:  
       - Non-living composites (rivers, clouds) with no "purpose."  
       - Overlapping composites (beehive vs. its bees).  
       - Composition without spatial contiguity (corporations, queues).  
     - **Non-Negotiable:** Cannot contradict empirical science (e.g., deny quantum non-locality).  
     - **Consideration:** Science describes reality; metaphysics must align. **Tension with Requirement 3 (Causal Autonomy)** if emergence violates physics.

  ---

  ### **Testing Your "Self-Maintaining Loop" Criterion**
  - **Strengths:** Handles flames, whirlpools, cells, markets (if feedback loops exist). Explains persistence (Requirement 5) and causal autonomy (Requirement 3).  
  - **Challenges:**  
    - Statues/lumps (static objects lack "maintenance").  
    - Sand piles/clouds (no self-sustaining process).  
    - Queues/corporations (abstract or convention-dependent).  
    - Vagueness: When does a loop "begin" (e.g., first cell division in an embryo)?  
  - **Refinements Needed:** Define "loop" rigorously (thermodynamic? informational?). Address non-dynamic composites (e.g., rocks).  

  ---

  ### **Key Conflicts in the Requirements**
  1. **Vagueness (1) vs. Counting (2):** If composition is vague, how can we count objects precisely?  
  2. **Causal Autonomy (3) vs. Science (7):** If wholes have irreducible causal powers, does this violate physical closure?  
  3. **Restricted Generality (2) vs. Weird Limits (6):** In a gunky world, can composition be restricted without atoms?  
  4. **Self-Maintaining Loops vs. Statues/Lumps:** Static objects defy process-based criteria.  

  **Non-Negotiables:**  
  - ★ Avoid universalism/nihilism extremes (Requirement 2).  
  - ★ Resolve coincidence (Requirement 4).  
  - ★ Respect science (Requirement 7).  

  **Camp-Dependent:**  
  - Vagueness (realists: ontological; anti-realists: semantic).  
  - Causal autonomy (realists: emergent powers; anti-realists: explanatory shorthand).  

  This spec forces theories to navigate tensions between science, logic, and phenomenology—no solution will satisfy all requirements effortlessly. Use these to stress-test proposals in your reading group.
