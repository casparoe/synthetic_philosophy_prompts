answer: |-
  ### Brainstorming: Standard Cases & Their Lessons
  1. **Threatened Belief ("Believe or I'll shoot!"):** A demon threatens harm unless you believe a false proposition (e.g., "2+2=5"). *Shows:* We seem to have a strong *reason* (avoiding death) to form the belief, yet the belief is clearly *unfitting* (untrue).  
  2. **Bribed Admiration ("Admire me and I'll pay you!"):** A morally repugnant person offers a reward for admiring them. *Shows:* You have a *reason* (getting money) to admire them, but the admiration seems deeply *unfitting* (they possess no admirable qualities).  
  3. **Coerced Intention ("Intend to φ or I'll hurt your family!"):** A villain forces you to form the intention to do something immoral (φ) by threatening loved ones. *Shows:* You have a *reason* (protecting family) to intend to φ, but the intention itself seems *unfitting* or irrational (φ is wrong/detrimental).  

  **What they show:** Each case presents a powerful, intuitively genuine *reason* to adopt an attitude (belief, admiration, intention), but that reason seems disconnected from whether the attitude *fits* its object (truth, admirability, desirability). These are "Wrong Kind of Reasons" (WKR).

  ---

  ### Explainer: The Wrong Kind of Reasons Problem

  Imagine you’re offered a million pounds to admire a petty tyrant. You have a powerful reason to *try* to admire them. But does this money make the tyrant genuinely *admirable*? Intuitively, no. This gap lies at the heart of the "Wrong Kind of Reasons" (WKR) problem, a profound puzzle for a popular theory of value called the **Fitting-Attitude Analysis** (FAA), or **buck-passing**.

  **1. Why WKR Threatens the Buck-Passing Project (FAA)**
  The core idea of FAA is elegant: To say something is *good* or *valuable* (e.g., a courageous act, a beautiful sunset) isn't to ascribe a mysterious, non-natural property to it. Instead, it's to say that the thing *merits* or *makes fitting* a certain positive attitude (e.g., admiration, appreciation). The "buck" of value is *passed* from the object to the reasons we have for responding to it. Value reduces to reasons for fitting attitudes.

  *   **The Promise:** FAA promises a naturalistically respectable, reason-based account of value. Goodness *just is* the property of being a fitting object of a pro-attitude.
  *   **The Threat:** The WKR problem strikes directly at this. If the million-pound bribe counts as a *reason to admire* the tyrant *in the same way* that the tyrant's (non-existent) courage would, then FAA is wrecked. Why?
      *   **Collapse:** The tyrant would now be "good" (because there's *a* reason to admire them – the bribe), even though they utterly lack any *admirable* qualities. FAA would equate genuine value with mere *incentives* to value something. The bribe doesn't make the tyrant admirable; it just makes admiring them profitable.
      *   **Loss of Distinctiveness:** FAA aims to capture the *normative authority* of value – why we *ought* to value good things. WKR threaten to reduce this "ought" to mere pragmatic or strategic "oughts" (like the "ought" of avoiding a demon's bullet). The crucial link between an object's *properties* and the *fittingness* of the attitude towards it is severed.

  WKR aren't quirky exceptions; they expose a potential fatal flaw in FAA's reductive ambition. If FAA can't cleanly exclude these reasons, it fails to capture what value *is*.

  **2. Drawing the Line: Content/Object vs. Constitutive Standard**
  How *do* we distinguish Right Kind Reasons (RKR – reasons that bear on fittingness) from WKR? Two main strategies emerge:

  *   **Strategy 1: Content/Object-Based:** RKR are reasons that cite *features of the object* the attitude is about. WKR cite *features of having the attitude* itself.
      *   *Example:* A reason to admire the firefighter because they risked their life (feature of the *object*) is RKR. The bribe (feature of *admiring*) is WKR.
      *   *Cost:* This seems intuitive for many cases. But problems lurk. Consider *regret*. A reason to regret forgetting an anniversary is that you hurt someone (feature of the *action* regretted). But isn't the *pain of regret itself* sometimes a reason *not* to regret? This reason cites a feature of *having* the attitude. Is it automatically WKR? It's messy. More crucially, this strategy might just *describe* the distinction without explaining *why* object-features relate to fittingness.

  *   **Strategy 2: Constitutive Standard-Based:** Each attitude type (belief, admiration, fear, intention) has its own built-in "aim" or standard of correctness. RKR are reasons that bear on *meeting that internal standard*. WKR are reasons that bear on the *consequences* of holding the attitude, ignoring its standard.
      *   *Belief:* Standard = Truth. RKR = Evidence. WKR = Threats/Bribes (don't make the belief true).
      *   *Admiration:* Standard = ??? (Meriting admiration? Excellence? This is contested). RKR = Features showing genuine excellence. WKR = Bribes/Threats (don't make the object excellent).
      *   *Cost:* This seems deeper. But it faces a dilemma:
          1.  **Circularity:** To define the standard for admiration ("meriting admiration"), we might *need* the concept of value ("excellence") FAA is trying to *define*. If "meriting admiration" *just means* "being admirable" or "excellent," then FAA explains value in terms of reasons for attitudes defined by... value. The reduction fails.
          2.  **Vagueness:** Defining the precise constitutive standard for complex attitudes like admiration or intention is notoriously difficult and controversial.

  **3. Testing the Distinction: A Hard Case – "Posthumous Admiration"**
  Imagine an eccentric billionaire, Elara, makes this offer: "After I die, admire me. Do this sincerely, and my estate will donate £10 million to save 1,000 children's lives. Fail to admire me (or be insincere), and the money vanishes." Elara is thoroughly mediocre – neither virtuous nor vicious, just unremarkable.

  *   **The Reason:** You have an incredibly strong moral reason – saving 1,000 lives – to bring it about that you *sincerely admire* Elara after her death.
  *   **The Problem:**
      1.  This reason seems *genuine* and immensely weighty.
      2.  Yet, it clearly does **not** make Elara *admirable*. Her properties (mediocrity) are fixed at death; your future admiration cannot retroactively make her excellent or her life meritorious. The reason doesn't bear on fittingness.
      3.  **The Test:** Can we classify this as a WKR *without* presupposing the concept of fitting admiration?
      *   *Content/Object-Based?* The reason cites the *consequences of admiring* (saving lives), not features of Elara. This suggests WKR. But why is *that* the disqualifying factor? The answer seems to be that only Elara's features could make admiration *fitting* – which presupposes fittingness.
      *   *Constitutive Standard-Based?* If admiration's standard is "responsiveness to genuine admirability," then saving lives doesn't meet *that* standard. But defining the standard *as* "responsiveness to genuine admirability" explicitly uses the concept ("admirability") that FAA is trying to analyze via reasons for attitudes. It risks circularity.

  This case highlights the core tension: We intuitively *know* the reason is the "wrong kind," but justifying that classification without leaning on the very notion of fittingness we're trying to ground (or the value it's meant to define) is extraordinarily difficult.

  **Verdict: Containable, but Costly – and a Lingering Doubt**

  Is the WKR problem fatal to FAA? I believe it is **containable, but at a significant cost**. The **Constitutive Standard approach** offers the most promising path. While defining standards like "truth" for belief is relatively straightforward, defining standards for evaluative attitudes like admiration is inherently linked to the contested concept of value itself. The cost is accepting that FAA might not be a perfectly *reductive* analysis. It may involve a symbiotic relationship where we understand fittingness attitudes and value partly in terms of each other – a kind of "network" analysis rather than a strict reduction of value to something else.

  **Where am I least confident?** Precisely in whether this "containment" truly preserves FAA's initial *reductive* ambition. If the constitutive standard for admiration *necessarily* references admirability or excellence (as it plausibly does), then the analysis risks becoming circular, explaining value in terms of reasons defined by value. My confidence is higher that we can *distinguish* RKR from WKR in practice (using constitutive standards) than that this distinction provides a fully *reductive, non-circular* analysis of value itself. The WKR problem forces a choice: accept a less reductive, perhaps more holistic, account of value and reasons, or abandon the buck-passing project altogether. Most contemporary defenders opt for the former, acknowledging the complexity revealed by the WKR puzzle.
