answer: |-
  Below is a complete, ready-to-run in-class game designed to make your students viscerally experience Machiavelli's concepts of fortune and virtù from *The Prince* (Ch. 25) and the *Discourses* (III.9). The game forces students into fixed "natures" (cautious or impetuous), lets them prosper when their nature matches the times, then shifts the times to create unavoidable failure for those who can't adapt—simulating the tragedy Machiavelli describes. Crucially, it includes hedging (building "dikes and dams") as a form of virtù that mitigates but never overcomes fortune, while ensuring the times shift in structured "eras" (not pure randomness) to allow for foresight.

  The game requires zero budget, runs in 45-60 minutes, and uses only paper and pens (all fitting in a tote bag). **Do not pre-teach the concepts**—save terms like "virtù" and "fortuna" for the debrief. Students need only a single reading of the texts.

  ---

  ### **Game Setup: "The Winds of Fortune"**
  **Objective:** Players experience how their innate nature (cautious or impetuous) leads to success when aligned with the times, but failure when the times shift—and how preparation (hedging) can soften the blow but not prevent the inevitable fall.  
  **Materials:**  
  - 1 deck of playing cards (use only Hearts/Diamonds for **"Bold Times"** and Spades/Clubs for **"Cautious Times"**).  
  - Paper scraps for two token types:  
    - **"Wealth" tokens** (e.g., small squares): Represent coins (starting 10 per player).  
    - **"Hedge" tokens** (e.g., torn corners): Represent preparations (unlimited supply).  
  - Pens for tracking coins (each player keeps a tally).  
  - **1 sheet for the teacher:** Secret time sequence (see below).  

  **Player Roles (assign at random):**  
  - Half the class (9 students) are **BOLD**: Must always choose **"Strike"** as their action.  
  - Half (9 students) are **CAUTIOUS**: Must always choose **"Fortify"** as their action.  
  *(If uneven, adjust proportions but keep groups distinct.)*  

  **Time Sequence (pre-set by teacher, never revealed):**  
  - Stack the deck to create 3 structured eras:  
    - **Rounds 1–4: Bold Times** (draw 4 red cards: Hearts/Diamonds).  
    - **Rounds 5–8: Cautious Times** (draw 4 black cards: Spades/Clubs).  
    - **Rounds 9–12: Bold Times** (draw 4 red cards).  
  *(This ensures "runs" with clear shifts, allowing foresight but hiding when the turn comes.)*  

  ---

  ### **Game Rules (print one copy for yourself; explain orally to students)**  
  **Core Mechanics:**  
  - Each round, **fortune (the times)** is revealed via a card draw.  
  - Players **must take their nature's action** every round—no choice.  
  - **Hedging** (costing 1 coin) lets players prepare for future shifts, but they cannot change their nature.  
  - **Wealth changes** reflect success/failure: Gain when times match nature, lose when they don’t.  

  **Round Structure (90 seconds/round max; total 12 rounds):**  
  1. **Reveal Fortune:** Draw a card and announce the times (e.g., "Hearts—Bold Times!").  
  2. **Actions:** Players take their fixed action based on nature:  
     - **BOLD** players: **"Strike"** (audacious move).  
     - **CAUTIOUS** players: **"Fortify"** (defensive move).  
  3. **Resolve Outcomes:**  
     - **If times MATCH nature** (e.g., Bold in Bold Times):  
       - Gain **2 coins** (add to tally). *This is "seizing the occasion" (virtù as audacity).*  
     - **If times DO NOT match nature** (e.g., Cautious in Bold Times):  
       - Lose **1 coin** (unless mitigated by hedging).  
  4. **Hedging Phase (Optional):**  
     - Any player may spend **1 coin** to take **1 hedge token**.  
     - Tokens can be **saved indefinitely** and spent in **future bad rounds** to avoid loss.  
     - *How tokens work:* If times DO NOT match your nature, spend 1 token to **cancel the 1-coin loss** (break even). Tokens must be spent **after fortune is revealed but before outcomes** (step 3).  
  5. **Record:** Players update coin tallies and token counts.  

  **Key Constraints:**  
  - Players **cannot change actions**—their nature is locked (Bold always Strikes, Cautious always Fortifies).  
  - Hedge tokens **cannot create gains**—they only avert losses in bad times.  
  - **No communication** between players (to avoid group strategy).  

  **Payoff:** After 12 rounds, players count coins. Highest total "wins," but emphasize this is about the experience, not winning.  

  ---

  ### **Teacher Script (Run this verbatim)**  
  **Intro (1 min):**  
  "Today, we’re playing a game about power and strategy. Each of you has a role: Bold or Cautious. You’ll make decisions each round to build wealth. Here’s how it works:  
  - I draw a card to set the ‘times.’ Hearts/Diamonds mean **Bold Times**; Spades/Clubs mean **Cautious Times**.  
  - **Bold players** must **Strike** every round—go all-in.  
  - **Cautious players** must **Fortify** every round—play it safe.  
  - Outcomes depend on if the times match your action.  
  - You can also spend coins to get **hedge tokens**—these protect you in bad times later.  
  We’ll play 12 rounds. Track coins and tokens. Ready? Go."  

  **During Game:**  
  - **Keep pace:** Announce times loudly. Use a timer (90 sec/round max).  
  - **Enforce silence:** No talking, or the "chaos of fortune" is ruined.  
  - **Monitor tokens:** Hand out hedge tokens when players pay 1 coin.  

  **Predictable Problems & Solutions:**  
  - **Problem:** Students ignore hedging (too focused on short-term gains).  
    *Solution:* Let it happen. They’ll crash when times shift—this *is* the lesson.  
  - **Problem:** Confusion over token timing (e.g., spending after outcomes).  
    *Solution:* Pause at step 2 to ask, "Anyone spending a hedge token this round? Show me."  
  - **Problem:** Frustration at "locked" natures (e.g., Bold players wanting to Fortify).  
    *Solution:* Note who complains—this primes the debrief about inflexibility.  
  - **Problem:** Runs short on time? Shorten to 10 rounds (remove last 2 Bold rounds).  

  ---

  ### **Debrief (30–40 min)**  
  **Start with feelings:**  
  - "Raise your hand if you felt unstoppable early on. What changed?"  
  - "Who crashed when the times shifted? How did it feel?"  
  - "Did anyone hedge? When? Why or why not?"  

  **Map Game → Machiavelli (use quotes on board):**  
  1. **"Fortune governs half our actions" (The Prince):**  
     - *Game moment:* The times shift at Rounds 5 and 9—no one controls this.  
     - *Text link:* Fortune as "rivers in flood" that overwhelm if unanticipated.  
     - *Key point:* The shift wasn’t random (eras had structure), but you couldn’t know *when* it came.  

  2. **Virtù as audacity and prudence:**  
     - *Game moment:*  
       - **Audacity:** Bold players gaining 2 coins in Bold Times by Striking (virtù as seizing the moment).  
       - **Prudence:** Hedging during good times (e.g., Bold players buying tokens in Rounds 1–4 to prepare for Cautious Times).  
     - *Text link:* "The prudent build dikes and dams before the flood."  
     - *Key point:* Hedging (virtù) helped in bad times, but only to avoid loss—never to win.  

  3. **"A man cannot change his nature" (Discourses):**  
     - *Game moment:* You were forced to Strike/Fortify even when it hurt.  
     - *Text link:* "He who has prospered by one mode of proceeding cannot be persuaded to leave it."  
     - *Key point:* Even if rules allowed change, would you? Bold players winning early (Rounds 1–4) wouldn’t stop Striking; Cautious wouldn’t suddenly become bold.  

  **What the Game Flattens (be frank here):**  
  - **Virtù ≠ just hedging:** Machiavelli also means the founder’s power to "impose new modes and orders" (e.g., revolution). The game is about *maintaining* power, not founding. *Supplement after debrief:* Ask, "Could a 'founder' in this game have changed the rules? How?"  
  - **Character vs. rule:** The game makes "can’t change nature" a rule, but Machiavelli is about deep character. *Mitigation:* In debrief, ask, "Even if I let you change actions, would you? Why not?" (Students will admit success breeds habit—this mirrors his point.)  
  - **Fortune isn’t dice:** The structured eras approximate fortune’s "shifting circumstances," but real fortune is messier. *Note:* "Machiavelli’s fortune is like our eras—knowable in pattern but not in timing—not blind luck."  

  **End with Discussion Prompts:**  
  - "Did hedging feel like skill? Why couldn’t it beat fortune?"  
  - "Machiavelli says virtù and fortune are like two wrestlers. How did you wrestle today?"  
  - "If you couldn’t change your actions, was your downfall ‘tragic’? Or just bad luck?"  

  ---

  ### **Why This Works**  
  - **Students "live" the text:** They feel the euphoria of alignment, the dread of the shift, and the limits of preparation.  
  - **Hedging = virtù:** It rewards foresight (e.g., Bold players hedging in early Bold Times to survive later Cautious Times) but never dominates fortune.  
  - **Locked natures:** The forced actions simulate Machiavelli’s "tragedy" of inflexibility.  
  - **Eras > randomness:** Fortune shifts with structure, so foresight is possible but not certainty—avoiding the "all luck" trap.  

  **First-Run Advice:** Expect chaos—students will miss hedging chances, panic when times shift, and fixate on coins. This is perfect. Lean into the frustration: "Remember that feeling when the winds changed and you couldn’t adapt? That’s Machiavelli’s tragedy." By debrief, they’ll be primed for your analysis.
