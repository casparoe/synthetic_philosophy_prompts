answer: |-
  Here is a joint statement draft designed for good-faith endorsement by both a patriotic partialist and a cosmopolitan, followed by a clear disagreements table, case analyses, and identified cruxes. I've focused on neutral framing, precise distinctions, and case-specific relevance to their core dispute.

  ---

  ### **Joint Statement: Common Ground**  
  *(Endorsed by both Partialist and Cosmopolitan)*  

  1. **Special Claims Definition**: A "special claim" entails both (a) a *permission* to preferentially allocate resources/effort toward specific individuals/groups beyond what impartial morality requires, and (b) potential *duties* (e.g., of reciprocity or solidarity) that generate specific expectations. These claims add *defeasible weight* to moral considerations but do not automatically override fundamental universal duties.  

  2. **Permissibility of Partiality**: Partiality is permissible only if it is compatible with:  
     - (a) Fulfilling baseline universal duties (e.g., basic rights, avoidance of severe harm).  
     - (b) A coherent justificatory framework accessible to all moral agents.  
     *Neither side asserts that arbitrary favoritism is morally acceptable.*  

  3. **Role of Institutions**: Shared institutions (legal, economic, political) are practically necessary for sustaining large-scale cooperative schemes that generate special claims. Such schemes distribute benefits/burdens and enable collective action.  

  4. **Relevance of Cooperation**: Reciprocal participation in a cooperative scheme *can* ground special duties (e.g., fairness in benefiting from mutual labor). The existence of such a scheme is a *prima facie* source of special obligations.  

  5. **Rejection of Pure Particularism**: Neither side reduces morality *entirely* to unchosen relationships ("my tribe, right or wrong"). Justifications must appeal to general moral principles.  

  ---

  ### **Disagreements Table**  
  *(Each row worded to be acceptable to the named side)*  

  | Issue | Patriotic Partialist View | Cosmopolitan View |
  |-------|----------------------------|-------------------|
  | **1. Source of Co-National Obligations** | Co-nationality itself—rooted in shared identity, cultural history, and collective self-determination—generates non-instrumental special obligations. These exist even when institutions fail. | Co-national obligations derive *only* from participation in a shared cooperative framework for mutual advancement. They are instrumental to human flourishing and justice. |
  | **2. Ground of Permissible Partiality** | Relationships (e.g., co-nationality) have intrinsic moral significance. Loyalty to compatriots is a virtue expressing communal belonging. | Partiality is permissible only if it indirectly promotes impartial goods (e.g., stability enabling global poverty reduction) or arises from reciprocal cooperation. |
  | **3. "Compatriot" Definition** | A compatriot is a fellow national, defined by formal citizenship or shared cultural-historical identity within a nation-state. | A compatriot is anyone participating in the same cooperative institutional scheme, regardless of nationality. |

  ---

  ### **Cruxes: Key Sub-Questions**  
  Resolving these would materially advance the debate:  
  1. **Moral Ground of Relationships**: Do unchosen relationships (e.g., nationality) possess *intrinsic moral weight*, or are they only derivatively valuable?  
  2. **Scope of Cooperation**: Must a cooperative scheme be *state-mediated* to generate obligations, or can non-state schemes suffice?  
  3. **Failure Condition**: Do special obligations dissolve when institutions collapse, or do they persist based on identity/history?  

  ---

  ### **Case Analyses**  
  *(Each case isolates a crux and shows divergent predictions)*  

  | Case | Description | Relevant Crux | Partialist Prediction | Cosmopolitan Prediction |
  |------|-------------|--------------|------------------------|--------------------------|
  | **(a) Collapsed State** | Two co-nationals in a failed state with no functional institutions. | *Failure Condition* | Obligations persist: Shared identity/history binds them independently of institutions. | Obligations dissolve: No cooperative scheme exists to ground reciprocity or mutual benefit. |
  | **(b) Long-Term Resident Non-Citizen** | A non-citizen fully participating in a state’s institutions (taxes, voting, etc.) for decades. | *"Compatriot" Definition* | Not a compatriot: Lacks formal nationality/cultural bonds. No special obligations owed. | Is a compatriot: Participation in cooperative scheme generates identical obligations as citizens. |
  | **(c) Closed Colony / Generation Ship** | Isolated group sharing a cooperative scheme and common fate, but no nation/history. | *Scope of Cooperation* | Obligations exist but are weaker: Cooperation alone is insufficient without shared identity/national bonds. | Full obligations exist: A self-sufficient cooperative scheme grounds all special claims, even absent nationality. |
  | **(d) Bare Nationality Pair** | Two people sharing nationality but no institutions, geography, or interaction (e.g., diaspora strangers). | *Moral Ground of Relationships* | Special obligations exist: Nationality itself creates a defeasible duty of mutual aid. | No special obligations: Absent cooperation or interaction, nationality is morally inert. |

  ---

  ### **Verbal Dispute Identification**  
  The primary verbal disagreement centers on **"nation"**:  
  - The **partialist** uses "nation" to denote a *pre-political cultural-historical community*.  
  - The **cosmopolitan** uses "nation" as shorthand for *state-mediated cooperation*.  
  This ambiguity is exposed in Case (c) (generation ship): Both may agree obligations exist there, but the partialist attributes it to *emergent nationhood*, while the cosmopolitan attributes it to *cooperation alone*. Clarifying terminology here could resolve surface conflicts.

  ---

  ### **Confidence Assessment**  
  - **Overall Confidence**: 85%  
    The joint statement and disagreements table are rigorously framed to reflect shared premises and non-strawman positions. Cases are tailored to stress-test cruxes.  
  - **Least Confident Element**: **Case (b) (Long-Term Resident)** wording for the partialist.  
    Some partialists *might* tie obligations to cultural assimilation, not just nationality. If your partialist emphasizes cultural integration over legal status, adjust to:  
    > *Partialist Prediction*: Obligations exist only if the resident is culturally assimilated; formal participation is insufficient without shared identity.  

  Recommend circulating this draft to both parties for wording tweaks on their respective columns—especially Case (b) and the "intrinsic moral weight" crux. This structure forces engagement with the deepest disagreements while building on common foundations.  

  Let me know if you'd like adjustments to emphasize historical thinkers (e.g., Miller vs. Pogge) or expand the cases!
