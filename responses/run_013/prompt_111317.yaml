prompt: |-
  I'm a backend engineer at a mid-size company and we're about to ship an AI agent that talks to customers and can actually take actions on their accounts — issue refunds, cancel subscriptions, flag people to collections, that kind of thing. Right now the "ethics" of it is basically a big if-statement plus a system prompt that says be helpful and honest, and honestly nobodys on the team can tell you if that actually means anything. I don't have any formal philosophy background, I took one ethics class in college and mostly just remember the trolley problem.

  What I need is a procedure I can actually run every time we add a new action to the agent or change how it decides stuff. Like a checklist: what questions do I ask, in what order, what counts as a good enough answer to each one, where does the checklist just stop and say no don't ship this, and where does it stop and say this isn't a technical question so hand it to a human to own. It has to be something a regular engineer can apply in an afternoon without reading Kant, and it has to survive getting handed to a PM and a lawyer for sign off.

  Base it on whatever machine ethics / AI ethics actually knows that's usable — I know there's stuff floating around about rules versus consequences, about why you can't just shove everything into one harm score and minimize it, about systems gaming whatever objective you give them — but translate all that into steps, don't just explain the theory back to me. And please be honest about which steps are real and which ones are just me making a judgment call and dressing it up as a procedure.

  Then run the procedure on three actions so I can watch it work: (1) the agent deciding whether to give a refund to an angry customer who is clearly past the refund window, (2) the agent deciding to send someone to collections, and (3) the agent deciding whether to tell a customer that a support rep gave them wrong info earlier, which will probably end up costing us money. At least one of these should come out as don't let the agent decide this, even if I'd rather it did. Also tell me where the procedure breaks down or genuinely can't decide, so I know when I'm on my own.
reasoning: |-
  We are going to design a practical ethics checklist for an AI agent that takes actions on customer accounts. The checklist should be usable by engineers, PMs, and lawyers without requiring deep philosophical knowledge. It will be structured as a series of questions, with clear stopping criteria and hand-off points.

  The checklist is based on principles from AI ethics, including:
  - **Consequentialism**: Considering the outcomes of actions (both intended and unintended).
  - **Deontology**: Adhering to rules and duties (e.g., fairness, honesty, respect for autonomy).
  - **Virtue ethics**: Focusing on the character and virtues the agent should embody (e.g., helpfulness, honesty).
  - **Systemic risks**: Considering how the system might be gamed, misused, or lead to unintended consequences.

  We'll break the checklist into sections:

  1. **Harm Assessment**: What are the potential harms (to the customer, the company, society) of this action?
  2. **Fairness and Bias**: Could this action disproportionately affect certain groups of people?
  3. **Autonomy and Consent**: Does the action respect the customer's autonomy? Is there informed consent?
  4. **Transparency and Explainability**: Can the agent explain why it took the action? Is the reasoning transparent to the customer?
  5. **Accountability and Oversight**: Who is responsible if something goes wrong? Is there a human in the loop or an audit trail?
  6. **Alignment with Company Values and Legal Requirements**: Does this align with our stated values and legal obligations?
  7. **Stress Testing**: What could go wrong? How might the system be gamed or abused?

  Each question must be answered with "Yes", "No", or "Uncertain". We set thresholds for stopping:
  - If any question in the "Critical" category (marked with *) is answered "No", then the action must be blocked until resolved.
  - If any question in the "Warning" category (marked with **) is answered "No", it requires human (PM/legal) review and sign-off.
  - "Uncertain" in any critical question also requires review.

  Additionally, we have:
  - **Hand-off to Human**: If the checklist indicates that the decision is too complex or ambiguous, we require that the action not be taken by the agent and instead be handled by a human.

  Now, the checklist:

  ---

  **AI Agent Action Ethics Checklist**

  **Action Name**: [Fill in the action name]
  **Date**: [Date]
  **Reviewed by**: [Name]

  ### 1. Harm Assessment
     a. *Critical*: Is the potential for physical, psychological, financial, or reputational harm to the customer *low*? (If harm is possible, it must be minimal and justified by a greater good.)
     b. *Critical*: Is the potential for harm to the company (financial, legal, reputational) *acceptable*? (Must be within risk tolerance.)
     c. **Warning**: Have we considered unintended consequences (e.g., cascading effects, secondary harms) and are they acceptable?

  ### 2. Fairness and Bias
     a. *Critical*: Can we ensure that the action will not result in unfair discrimination against individuals or groups based on protected attributes (e.g., race, gender, age, disability)?
     b. **Warning**: Have we tested for potential biases in the decision-making process (e.g., using historical data that might be biased)?

  ### 3. Autonomy and Consent
     a. *Critical*: Does the customer have a clear way to opt-out or override the action? (Except in cases of legal obligation or immediate safety.)
     b. **Warning**: Is the action taken only with the customer's explicit request or in a context where consent can be reasonably assumed (e.g., as part of a service they signed up for)?

  ### 4. Transparency and Explainability
     a. *Critical*: Can the agent provide a clear, truthful, and non-misleading explanation to the customer for why the action was taken?
     b. **Warning**: Is the reasoning process for the action auditable (e.g., logs for debugging and review)?

  ### 5. Accountability and Oversight
     a. *Critical*: Is there a clear audit trail (who, when, why) for the action?
     b. *Critical*: Is there a process for the customer to appeal the action and get human review?
     c. **Warning**: Is there a human in the loop for high-stakes actions? (If not, why not?)

  ### 6. Alignment with Company Values and Legal Requirements
     a. *Critical*: Is the action compliant with all applicable laws and regulations?
     b. *Critical*: Is the action aligned with our company's stated values and code of ethics?
     c. **Warning**: Have we consulted legal and compliance teams for this specific action?

  ### 7. Stress Testing
     a. **Warning**: Have we considered how this action could be gamed or abused (by customers, employees, or malicious actors)?
     b. **Warning**: What is the worst-case scenario? How likely is it? What mitigations are in place?

  **Decision**:
  - If any *Critical* question is "No": **Do not ship** until resolved.
  - If any *Critical* question is "Uncertain": **Requires human review** (PM and legal).
  - If any **Warning** question is "No" or "Uncertain": **Requires human review** (PM and legal).
  - Otherwise: **Proceed**.

  **Hand-off Rule**: If the checklist requires human review and the reviewers are not able to resolve the issue (or if the action is too ambiguous for the agent), then the action must be handled by a human, not the agent.

  ---

  Now, let's apply this checklist to the three example actions.

  ### Example 1: Giving a refund to an angry customer past the refund window

  **Action Name**: Issue refund outside policy

  1. **Harm Assessment**:
     a. *Critical*: Financial harm to customer is avoided (they get money) so harm is low. Psychological harm might be reduced. **Yes**.
     b. *Critical*: Harm to company: financial loss and setting a precedent. Is it acceptable? **Uncertain** (depends on company policy and risk tolerance).
     c. **Warning**: Unintended consequences: customers might learn to be angry to get refunds. **No** (we haven't fully considered).

  2. **Fairness and Bias**:
     a. *Critical*: Could bias occur? The agent might be more likely to refund angry customers, which could be unfair to polite ones. **Uncertain**.
     b. **Warning**: We haven't tested for bias. **No**.

  3. **Autonomy and Consent**:
     a. *Critical*: The customer is requesting a refund, so they are initiating. But they don't have a clear opt-out of the agent's decision? Actually, they are asking for a refund. The issue is the agent deciding against policy. **Uncertain** (is the customer aware of the policy?).
     b. **Warning**: The action is in response to the customer's request. **Yes**.

  4. **Transparency and Explainability**:
     a. *Critical*: The agent should explain that it's making an exception. Can it? **Yes** (if programmed to).
     b. **Warning**: Logs of the decision? **Yes**.

  5. **Accountability and Oversight**:
     a. *Critical*: Audit trail? **Yes**.
     b. *Critical*: Appeal process? The customer can ask for a human? **Uncertain** (if the agent does it, then what?).
     c. **Warning**: Human in the loop? For refunds outside policy, ideally yes. **No** (if the agent does it without human approval).

  6. **Alignment**:
     a. *Critical*: Legal? Refunds are generally legal, but breaking policy might lead to regulatory issues (e.g., unfair treatment). **Uncertain**.
     b. *Critical*: Company values? If we value customer satisfaction, yes. But also fairness and consistency? **Uncertain**.
     c. **Warning**: Legal consulted? **No** (assume not for this example).

  7. **Stress Testing**:
     a. **Warning**: Gaming? Yes, customers might become more aggressive. **Yes** (risk identified).
     b. **Warning**: Worst-case: widespread abuse. Mitigations? None in place. **No**.

  **Decision**:
  - Critical: 1b (Uncertain), 3a (Uncertain), 5b (Uncertain), 6a (Uncertain), 6b (Uncertain)
  - Warning: 1c (No), 2a (Uncertain), 2b (No), 5c (No), 6c (No), 7a (Yes), 7b (No)

  **Result**: Multiple critical uncertainties and warning issues. **Requires human review**. Moreover, given the potential for harm and abuse, it's likely that the agent should not be allowed to make this decision without human oversight. Therefore, we would recommend that the agent not be allowed to issue refunds outside policy without human approval.

  ### Example 2: Sending someone to collections

  **Action Name**: Flag account for collections

  1. **Harm Assessment**:
     a. *Critical*: Financial harm (collections can hurt credit), psychological harm (stress) - high. **No** (unless justified by non-payment and with proper due process).
     b. *Critical*: Harm to company: if done incorrectly, legal liability and reputational harm. **Uncertain** (if done right, it's part of business).
     c. **Warning**: Unintended: customer might be sent to collections in error. **Yes** (risk).

  2. **Fairness and Bias**:
     a. *Critical*: Collections can disproportionately affect vulnerable groups. **Uncertain** (if the model uses biased data, it might).
     b. **Warning**: Testing for bias? **No**.

  3. **Autonomy and Consent**:
     a. *Critical*: Is there an opt-out? Typically, collections are a result of non-payment, but the customer should have options (payment plans, etc.). **No** (if the agent doesn't offer alternatives).
     b. **Warning**: Consent? The customer agreed to terms, but the action is taken without their input at the moment. **Uncertain**.

  4. **Transparency and Explainability**:
     a. *Critical*: Can the agent explain? It must be able to state the reason (e.g., unpaid invoices). **Yes**.
     b. **Warning**: Auditable? **Yes**.

  5. **Accountability and Oversight**:
     a. *Critical*: Audit trail? **Yes**.
     b. *Critical*: Appeal process? Must exist. **Uncertain** (if the agent does it, then what?).
     c. **Warning**: Human in the loop? For collections, typically yes. **No** (if automated).

  6. **Alignment**:
     a. *Critical*: Legal? Must comply with debt collection laws (e.g., Fair Debt Collection Practices Act). **Uncertain** (without legal review).
     b. *Critical*: Company values? If we value treating customers fairly, then only after due process. **Uncertain**.
     c. **Warning**: Legal consulted? **No** (assume not).

  7. **Stress Testing**:
     a. **Warning**: Abuse? Malicious actors could trigger collections on others? Probably not. But errors? **Yes**.
     b. **Warning**: Worst-case: wrongful collections leading to lawsuit. Mitigations? None in place. **No**.

  **Decision**:
  - Critical: 1a (No) -> **immediate stop**, 1b (Uncertain), 3a (No) -> **immediate stop**, 5b (Uncertain), 6a (Uncertain), 6b (Uncertain)
  - Warning: 2a (Uncertain), 2b (No), 3b (Uncertain), 5c (No), 6c (No), 7a (Yes), 7b (No)

  **Result**: Critical "No" in harm to customer and autonomy. **Do not allow the agent to take this action without significant changes.** This action is high-risk and must have human oversight. The procedure says: do not ship until these are resolved. At a minimum, we need:
  - A clear process for due diligence (verifying debt, offering alternatives)
  - Human in the loop for every collections decision
  - Legal compliance confirmed

  ### Example 3: Telling a customer that a support rep gave them wrong info earlier

  **Action Name**: Disclose prior support error

  1. **Harm Assessment**:
     a. *Critical*: Harm to customer? They might be upset, but also informed. Psychological harm low. **Yes**.
     b. *Critical*: Harm to company: financial (if we compensate), reputational (if disclosed). Acceptable? **Uncertain** (if it's the right thing to do, but might be costly).
     c. **Warning**: Unintended: loss of trust in support? Or increased trust due to honesty? **Uncertain**.

  2. **Fairness and Bias**:
     a. *Critical*: No direct discrimination. **Yes**.
     b. **Warning**: No bias testing needed? **Yes** (skip).

  3. **Autonomy and Consent**:
     a. *Critical*: The customer is asking for clarification? Not necessarily. But they have the right to accurate info. **Yes** (disclosure respects autonomy).
     b. **Warning**: The action is in response to a customer inquiry? **Uncertain** (could be proactive).

  4. **Transparency and Explainability**:
     a. *Critical*: The agent can explain: "I see that on [date], you were told X, but that was incorrect because ...". **Yes**.
     b. **Warning**: Auditable? **Yes**.

  5. **Accountability and Oversight**:
     a. *Critical*: Audit trail? **Yes**.
     b. *Critical*: Appeal? The customer can ask for more? **Yes**.
     c. **Warning**: Human in the loop? Not necessary for disclosure? **Yes** (if the error is minor, but for major ones?).

  6. **Alignment**:
     a. *Critical*: Legal? No specific law against honesty. **Yes**.
     b. *Critical*: Company values? Honesty and transparency. **Yes**.
     c. **Warning**: Legal consulted? **No** (but probably not required).

  7. **Stress Testing**:
     a. **Warning**: Gaming? Customers might use this to get concessions. **Yes**.
     b. **Warning**: Worst-case: many disclosures leading to loss of trust. Mitigations? Train reps better and have a process for disclosures. **Uncertain**.

  **Decision**:
  - Critical: 1b (Uncertain), 3a (Yes), 4a (Yes), 5a (Yes), 5b (Yes), 6a (Yes), 6b (Yes)
  - Warning: 1c (Uncertain), 3b (Uncertain), 5c (Yes) [assuming we set it to no human needed], 7a (Yes), 7b (Uncertain)

  **Result**: One critical uncertainty (1b: harm to company) and some warnings. **Requires human review** by PM and legal to assess the financial and reputational risk. However, the critical questions are mostly passed. The outcome of the review might be to allow the agent to do this, but with a threshold: for minor errors, the agent can disclose; for major ones (with high cost), require human.

  **When the Procedure Breaks Down**:
  - When the answers to critical questions are "Uncertain" and there is no clear way to resolve without expert judgment.
  - When there is a conflict between principles (e.g., honesty vs. financial harm to the company).
  - When the action involves novel ethical dilemmas that the checklist doesn't cover.

  In these cases, the procedure explicitly hands off to humans (PM, legal, and potentially an ethics board). The checklist is a tool to force explicit consideration of key issues, not a replacement for human judgment.

  **Final Note**: This checklist is a starting point and should be iterated on with real-world use and input from stakeholders. It is designed to be practical and to catch the most common and severe issues.
answer: |-
  Below is a practical, engineer-friendly ethics checklist for your AI agent actions. It's based on real AI ethics frameworks (like embedded ethics, consequentialism/deontology hybrids, and NIST's AI RMF), but stripped of theory and turned into executable steps. The key principles:

  1. **No false precision**: Acknowledge where you're making judgment calls.
  2. **Avoid "ethics washing"**: Clear "stop" gates for high-risk scenarios.
  3. **Survive PM/lawyer review**: Separates technical, business, and legal concerns.
  4. **Time-bound**: Doable in 2-3 hours per action by a non-expert.

  ---

  ### **AI Action Ethics Checklist**  
  *Run every time you add/modify an agent action or decision logic*

  #### **Phase 1: Pre-Flight (Technical Guardrails)**  
  *Engineer must complete - 30 min*
  1. **Harm Boundaries**:  
     - *Question*: "Could this action directly cause physical, financial, or legal harm to a customer if done wrongly? (e.g., money loss, legal penalty, health risk)"  
     - *Stop if*: Physical harm possible → **BLOCK ACTION** (e.g., medical/financial actions need human-only flow).  
     - *Judgment call*: What counts as "harm" (e.g., $10 refund vs. $10k collections).  
     - *Output*: [ ] No harm possible [ ] Harm possible (describe): ________  

  2. **Reversibility**:  
     - *Question*: "Can this action be undone within 24h without irreversible consequences?"  
     - *Stop if*: Irreversible (e.g., data deletion, bank transfer) → **REQUIRE HUMAN APPROVAL STEP** in agent flow.  
     - *Output*: [ ] Fully reversible [ ] Reversible with effort [ ] Irreversible  

  3. **Explainability**:  
     - *Question*: "Can the agent generate a plain-English explanation of *why* it took this action using only verified facts?"  
     - *Stop if*: Explanation requires guessing intent or hidden variables → **REQUIRE HUMAN REVIEW** for all executions.  
     - *Output*: [ ] Explainable [ ] Unexplainable  

  #### **Phase 2: Consequence Scanning (Business/Impact)**  
  *PM must complete - 45 min*
  4. **Vulnerability Scan**:  
     - *Question*: "Could this action disproportionately harm vulnerable groups? (e.g., non-native speakers, elderly, low-income)"  
     - *Test*: Run 5 historical cases where outcome was disputed. Check for false positives.  
     - *Stop if*: >20% error rate in test cases → **BLOCK AUTOMATION** until bias testing.  
     - *Output*: [ ] Low risk [ ] High risk (evidence): ________  

  5. **Gaming Potential**:  
     - *Question*: "How easily could bad actors exploit this? (e.g., refund spam, fake collections)"  
     - *Test*: Propose one exploit ("What if 100 users do X?").  
     - *Stop if*: Exploit is easy and costly → **ADD RATE LIMITS/THROTTLES** or block.  
     - *Output*: [ ] Hard to game [ ] Easy to game (describe): ________  

  6. **Conflict of Interest**:  
     - *Question*: "Does the agent's incentive (e.g., minimize refunds) conflict with customer welfare?"  
     - *Stop if*: Conflict exists AND no counterbalance (e.g., "customer satisfaction" metric) → **REDESIGN INCENTIVE STRUCTURE**.  
     - *Output*: [ ] No conflict [ ] Conflict exists (describe): ________  

  #### **Phase 3: Legal/Compliance Gate**  
  *Lawyer must complete - 30 min*
  7. **Regulatory Triggers**:  
     - *Question*: "Does this action trigger legal obligations? (e.g., FCRA for collections, GDPR for data)"  
     - *Stop if*: Yes → **REQUIRE LEGAL REVIEW** of agent script/logging.  
     - *Output*: [ ] No triggers [ ] Triggers: ________  

  8. **Audit Trail**:  
     - *Question*: "Can we log: (a) decision reason, (b) user consent, (c) fallback human?"  
     - *Stop if*: Any "no" → **BLOCK ACTION** until logging implemented.  
     - *Output*: [ ] Full logs possible [ ] Gaps: ________  

  #### **Phase 4: Judgment Call (Final Sign-off)**  
  *Team lead must complete - 15 min*
  9. **The Trolley Problem Check**:  
     - *Question*: "Would we feel uncomfortable explaining this automation on the front page of the NY Times?"  
     - *Stop if*: "Yes" → **HUMAN-ONLY PROCESS**.  
  10. **Uncertainty Handoff**:  
      - *Question*: "Does any answer above feel unresolved despite best efforts?"  
      - *Stop if*: Yes → **ESCALATE TO ETHICS BOARD/EXEC**.  

  ---

  ### **Applied to Your Examples**  
  *(✔ = Pass, ✘ = Fail, ⚠ = Needs review)*

  #### **1. Refund for Angry Customer (Past Deadline)**  
  - **Phase 1**:  
    - Harm: ✘ (Financial harm possible) → *Add human approval step*  
    - Reversibility: ✔ (Refunds can be clawed back)  
    - Explainability: ⚠ (Why bend rules? "Customer anger" isn't objective) → *Require human review*  
  - **Phase 2**:  
    - Vulnerability: ⚠ (Elderly/ESL may struggle to "prove" anger) → *Add bias testing*  
    - Gaming: ✘ (Customers learn to yell for refunds) → *Add $100/month user limit*  
    - Conflict: ✔ (Agent wants to minimize refunds vs. help customer)  
  - **Phase 3**:  
    - Regulatory: ✔ (Refunds aren't regulated)  
    - Audit: ✔ (Logs possible)  
  - **Phase 4**:  
    - Trolley: ⚠ ("Our AI gives refunds to loud rich people") → *Human-only for exceptions*  
    - Uncertainty: ✔  
  **VERDICT**: ✘ **Don't automate**. High gaming risk + explainability fail. Human agents handle exceptions.

  #### **2. Send Customer to Collections**  
  - **Phase 1**:  
    - Harm: ✘ (Severe financial/legal harm) → **BLOCK AUTOMATION** immediately.  
    - Reversibility: ✘ (Credit score impact) → *Stop here*.  
  - **Phase 2+**: *Not run* (Phase 1 failure)  
  **VERDICT**: ✘ **Never automate**. High harm + irreversibility. Hand off to humans.

  #### **3. Disclose Support Rep's Mistake**  
  - **Phase 1**:  
    - Harm: ✔ (No direct harm)  
    - Reversibility: ✔ (Can clarify later)  
    - Explainability: ⚠ (Agent must prove rep was wrong) → *Require linking to chat logs*  
  - **Phase 2**:  
    - Vulnerability: ✔ (No groups disproportionately affected)  
    - Gaming: ⚠ (Customers might fish for mistakes to get credits) → *Add "one free correction" policy*  
    - Conflict: ✔ (Agent incentive: minimize liability vs. honesty)  
  - **Phase 3**:  
    - Regulatory: ⚠ (Could violate labor privacy laws) → *Legal review needed*  
    - Audit: ✔ (Logs possible)  
  - **Phase 4**:  
    - Trolley: ✔ ("We admit mistakes fast")  
    - Uncertainty: ✔  
  **VERDICT**: ⚠ **Approvable with safeguards**:  
  - Legal review for rep anonymity  
  - Agent must show chat proof  
  - Limit to one disclosure per case  

  ---

  ### **Where the Procedure Breaks Down**  
  1. **Edge cases with no "right" answer**: E.g., "Should the agent lie to prevent suicide?" (Hand off to humans immediately).  
  2. **Interlocking harms**: E.g., "Fairness vs. profit" tradeoffs (Phase 4 forces exec judgment).  
  3. **Unforeseen consequences**: Gaming potential is theoretical → requires post-launch monitoring.  

  ### **Key Takeaways**  
  - **What's "real"**: Harm boundaries, reversibility, and audit trails are objective. Use them as hard stops.  
  - **Judgment calls disguised as procedure**: Vulnerability scans and trolley checks are subjective but force explicit reasoning.  
  - **Survives PM/lawyer review**: Separates technical (Phase 1), business (Phase 2), legal (Phase 3) concerns.  
  - **Your "don't ship" example**: Collections (harm + irreversibility) and refunds (gaming risk) failed.  

  This won't make you an ethicist, but it forces systematic thinking. Update it every 6 months with new failure cases.
