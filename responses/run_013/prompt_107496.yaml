  ok so this is a bit of a weird ask but I'm a CS student (3rd year, mostly compilers/PL stuff, I TA the functional programming course) and I'm also taking this phil course on Wittgenstein and rule-following because I needed a humanities credit and it sounded fun. Anyway we spent a whole seminar on the rule-following paradox that Kripke reads into Wittgenstein — the plus/quus thing, where someone has only ever added numbers below 57 so the skeptic says maybe they meant an operation that agrees with plus on everything theyve actually done and then just returns 5 forever after. I get the setup fine, it's the aftermath I can't hold onto.

  Can you restate the whole thing in the vocabulary I actually think in? Like: functions as extensional input-output tables vs. programs as intension, specs, referential transparency, equational reasoning, the fact that a finite program determines infinitely many behaviours, unit tests vs property tests, conformance to an interface, all of that. Do it as faithfully as you can, don't just dress it up.

  Then the part I actually want: the residue report. What maps cleanly, what I have to fudge, and what has no counterpart in my vocabulary at all. Specifically I want to know whether the skeptic's move is just the observation that infinitely many programs are extensionally identical on everything you've tested so far (in which case isnt the whole thing a restatement of underdetermination and not that scary?), or whether something is lost when I say it that way. Is there anything in the philosophers' debate about what makes a use of a word *correct* rather than just *what I did* that I literally cannot express without smuggling in a spec — and if I need a spec, who writes it? And is that residue a hole in my framework, or is it a sign that the original problem is vaguer than it looks because it's asking for a spec where one was never needed?

  Also, mild warning, I've had exactly one semester of philosophy so if you use terms like "normativity" please cash them out.
