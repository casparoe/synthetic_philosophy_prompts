  **Node 11: Coherence of Regret**  
  *A person says their life has been worth living but wishes they had never been born. Is this coherent?*  
  - **Yes** → Leaf I (Asymmetry Without Complaint)  
    - **Position**: Asymmetry (reason not to create suffering, no reason to create happiness) but no retrospective complaint.  
