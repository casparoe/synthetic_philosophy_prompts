  Below is a decision tree structured to navigate the logical space of the asymmetry question in procreation ethics. It uses concrete cases and commitments to sort positions without naming them upfront. The tree has 10 branch nodes and covers the required cases. Each leaf identifies a position (or marks it unoccupied) and notes its most awkward commitment. Positions the tree cannot separate are stated explicitly.

  ---

  ### **Decision Tree: Asymmetry in Procreation Ethics**

  **Node 1: Case of Painful Illness**  
  *A couple can conceive only a child with a substantial chance of a painful, incurable illness. Is there a moral reason for them not to conceive?*  
  - **Yes** → Node 2  
  - **No** → Node 3  

  **Node 2: Case of Happy Child**  
  *A couple can conceive a child expected to have a very happy life. Is there a moral reason for them to conceive?*  
  - **Yes** → Node 4  
  - **No** → Node 5  

  **Node 3: Case of Happiness in Illness Context**  
  *For the same couple (Node 1), if the child could have moments of happiness despite the illness, would that happiness give a moral reason* to *conceive?*  
  - **Yes** → Node 6  
  - **No** → Node 7  

  **Node 4: Case of Timing Choice**  
  *A couple can conceive now (a child likely to have a difficult life) or wait to conceive a different child later (likely to have a good life). Is it morally better to wait?*  
  - **Yes** → Node 8  
  - **No** → Node 9  

  **Node 5: Retrospective Complaint**  
  *If a person is born and suffers terribly, does that person have a legitimate complaint against their parents for creating them?*  
  - **Yes** → Node 10  
  - **No** → Node 11  

  **Node 6: Policy Change Case**  
  *A policy change makes conception slightly more likely across the population. Would this policy be morally good because it creates more happy lives?*  
  - **Yes** → Leaf L (Reverse Asymmetry)  
    - **Position**: Reverse Asymmetry (reason to create happiness, no reason to avoid suffering).  
    - **Awkward commitment**: Must accept that creating a child guaranteed to suffer horribly is permissible if there’s any chance of happiness.  
  - **No** → Leaf M (Constrained Reverse Asymmetry)  
    - **Position**: Reverse Asymmetry with constraints (reason to create happiness, but overridden by other factors like societal harm).  
    - **Awkward commitment**: Denies a standalone reason to avoid suffering, yet blocks procreation in practice for unclear reasons.  

  **Node 7: Personal Preference**  
  *Is the decision to have children purely a matter of personal preference, with no moral content?*  
  - **Yes** → Leaf A (Personal Preference View)  
    - **Position**: No moral reasons for/against procreation; it’s ethically neutral.  
    - **Awkward commitment**: Cannot criticize creating a child destined for torture if the parents desire it.  
  - **No** → Leaf B (Non-Welfare-Based Morality)  
    - **Position**: Morality of procreation depends on factors unrelated to the child’s welfare (e.g., environmental impact).  
    - **Awkward commitment**: Ignores the child’s suffering/happiness entirely.  

  **Node 8: Comparability Claim**  
  *Can we say that a happy existence is better* for the person *than never existing, and a miserable existence worse?*  
  - **Yes** → Leaf C (Symmetric Comparabilism)  
    - **Position**: Symmetry (reason to avoid suffering and to create happiness).  
    - **Awkward commitment**: Obligates creating as many happy people as possible, risking overpopulation.  
  - **No** → Leaf D (Symmetric Non-Comparabilism)  
    - **Position**: Symmetry but non-comparability (we have reasons, but existence/nonexistence can’t be compared).  
    - **Awkward commitment**: Reasons to act exist despite outcomes being incomparable (unexplored view).  

  **Node 9: Non-Identity Justification**  
  *Is the reason not to wait (Node 4) that the child conceived now and later are different people, so comparing their welfare is irrelevant?*  
  - **Yes** → Leaf E (Person-Affecting View)  
    - **Position**: Only harms/benefits to specific people matter; non-identity blocks comparisons.  
    - **Awkward commitment**: Permits conceiving a miserable child now even if waiting avoids it.  
  - **No** → Leaf F (Intrinsic Value of Existence)  
    - **Position**: Existence itself is valuable regardless of quality (or other non-comparative reasons).  
    - **Awkward commitment**: Forces defending existence even in cases of extreme suffering.  

