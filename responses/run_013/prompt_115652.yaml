  ### **Unoccupied Leaves & Ambiguities**
  - **Leaf D (Symmetric Non-Comparabilism)**: Unoccupied (unexplored). Incoherent to many, as reasons to act imply comparability.  
  - **Leaf M (Constrained Reverse Asymmetry)**: Unoccupied (unattractive). Hard to defend without smuggling in suffering-based reasons.  
