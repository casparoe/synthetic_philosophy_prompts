prompt: |-
  I run a grad seminar that's half philosophy, half econ students, on epistemic game theory, and I'm putting together the final. I want one essay question on common knowledge of rationality that they can't just answer by reciting the "everyone knows, and everyone knows that everyone knows, and so on" mantra and then declaring victory. The move I've watched alot of them fumble is the jump from common knowledge of rationality to the backward-induction conclusion in something like a finitely repeated Prisoner's Dilemma or a centipede, and I want the question to plant itself right on that jump.

  Three things I'd like it to force out of them:

  1) Get them to state common knowledge the two standard ways -- the fixed-point / self-evident-event way and the iterative "all finite orders of knowledge" way -- and say why those two turn out to coincide in the usual partitional setup. I want to see whether they actually know why, or just that it's "the same thing."

  2) The meat: why does "each player is rational, and each knows the others are rational, and each knows that..." look like it should already hand you defection at the first move, and where's the gap? I want them to locate the extra assumption the backward-induction argument needs beyond common knowledge of rationality, and to notice the self-undermining flavor of it -- that the certainty you'd need at the later nodes is hard to square with the game ever reaching them. And I want them to see that how they answer depends on how they're defining 'rationality' in the first place, acting on your beliefs versus your strategy actually being optimal, since that fork is where the whole debate lives.

  3) A short applied bit: a two-player coordination story where the only communication is a message that might not get through. Have them explain why each player merely "almost knowing" -- high probability at every finite order -- that the other got the message is not common knowledge, and why that can flip whether they coordinate at all. I want them to resist the intuition that if the probability is tiny it barely matters.

  So could you write me (a) the question, split into sub-parts so it's gradeable in a 90-minute slot; (b) a model answer of roughly 700-800 words I can hand to the TAs; and (c) a marking scheme out of 20 that splits the marks across the sub-parts and, crucially, tells me the specific moves a strong answer has to make versus the things that should cost marks -- e.g. conflating mere knowledge with common knowledge, or assuming common knowledge of rationality just is backward induction. No citations anywhere, they can't look anything up, so keep it to concepts. And a one-liner per sub-part on how students typically get it wrong.
reasoning: |-
  Okay, the user is teaching a grad seminar mixing philosophy and econ students on epistemic game theory and needs a final exam question focusing on common knowledge of rationality (CKR). They specifically want to test the jump from CKR to backward induction in games like finitely repeated Prisoner's Dilemma or centipede games. 

  Hmm, the user has three clear objectives: 

  First, they want students to articulate the two standard definitions of common knowledge - the fixed-point view and the iterative knowledge hierarchy - and explain why these coincide in partitional models. This is foundational but often memorized without real understanding. 

  Second is the core challenge: why CKR feels sufficient for backward induction but isn't, requiring identification of the missing assumption (like material conditional rationality or belief in future rationality) and recognizing how it self-undermines when nodes are reached. The definition of rationality itself (belief-based vs. strategy-based) is crucial here. 

  Third, a practical coordination game scenario where high-probability knowledge at all finite levels still isn't common knowledge, demonstrating why this distinction matters behaviorally. 

  The user's frustration with "mantra recitation" suggests many students parrot definitions without grasping the gap between CKR and backward induction. The mention of students fumbling the jump indicates they want to force engagement with the logical tension - how can players be certain of future rationality if the game reaches nodes where rationality would've prevented that? 

  For the coordination example, the "tiny probability" intuition trap is key - students likely underestimate how qualitative differences in knowledge (common vs. almost-common) create discontinuous behavioral thresholds. 

  I'll structure the question in three parts mirroring their objectives, with clear subparts for grading efficiency in 90 minutes. The model answer will explicitly: 
  - Contrast fixed-point ("self-evident event") vs iterative definitions and derive their equivalence from partitionality (using the meet of partitions) 
  - Distinguish belief-based vs material conditional rationality to show why CKR alone fails for backward induction 
  - Highlight the self-undermining loop: CKR + belief in future rationality implies nodes shouldn't be reached, so conditioning on them breaks the assumption 
  - Use the coordination case to show how ε-probability failures at high orders prevent common knowledge even if P(failure) is tiny, changing equilibrium selection 

  The marking scheme will heavily penalize: 
  - Equating CKR with backward induction (misses the gap) 
  - Confusing mutual knowledge with common knowledge 
  - Treating high-probability knowledge as sufficient for common knowledge 
  - Not spotting the material conditional assumption in backward induction 

  For the coordination part, full credit requires recognizing that even miniscule doubt at any finite level breaks common knowledge, and that coordination fails precisely because players can't rule out the other doubting.
answer: |-
  Here’s a tailored exam question, model answer, and marking scheme addressing your goals.  

  **Exam Question (90 mins total)**  
  *(Total: 20 marks)*  

  **Part A: Defining Common Knowledge** (6 marks)  
  1. State the *iterative definition* of common knowledge of an event \(E\). (2 marks)  
  2. State the *fixed-point definition* of common knowledge of \(E\). (2 marks)  
  3. Why do these definitions coincide in partitional models of knowledge? (2 marks)  

  **Part B: Common Knowledge of Rationality & Backward Induction** (10 marks)  
  Consider a finite sequential game (e.g., Centipede or finitely repeated PD).  
  1. Explain intuitively why someone might think common knowledge of rationality (CKR) *alone* implies players will choose the backward-induction (BI) outcome (e.g., immediate defection). (2 marks)  
  2. Identify the *key gap* in this reasoning: What extra assumption does the BI argument implicitly rely on beyond CKR? Explain why this assumption is problematic when the game reaches a node that shouldn’t be reached under BI. (4 marks)  
  3. How does the definition of "rationality" (acting optimally *given current beliefs* vs. playing a strategy that is *ex-ante optimal*) affect whether CKR suffices for BI? (4 marks)  

  **Part C: Coordination with Imperfect Communication** (4 marks)  
  Two players must choose between \(Safe\) (payoff 1 each) or \(Risky\) (payoff 2 each iff both choose it). Before playing, Player 1 sends a message "Let’s play Risky" to Player 2. The message arrives with probability \(1 - \epsilon\) (\(\epsilon > 0\)), and delivery is independent of whether the other player receives theirs. Players know \(\epsilon\) is small.  
  1. Explain why each player "almost knows" (i.e., assigns probability \(1 - \epsilon\)) that the other received the message, and "almost knows" that the other almost knows, and so on for all finite levels. (2 marks)  
  2. Why might players still fail to coordinate on \(Risky\) despite this, whereas they would succeed under *common knowledge* of message receipt? (2 marks)  

  ---

  **Model Answer (700 words)**  

  **Part A**  
  1. **Iterative definition**: \(E\) is common knowledge if: (i) Everyone knows \(E\) (\(K_i E\) for all \(i\)), (ii) Everyone knows that everyone knows \(E\) (\(K_i K_j E\) for all \(i,j\)), (iii) This continues ad infinitum for all finite sequences of players.  
  2. **Fixed-point definition**: \(E\) is common knowledge if \(E\) is a *self-evident event*, i.e., whenever \(E\) occurs, everyone knows \(E\) occurs. Formally, \(E \subseteq K_i E\) for all \(i\), and \(E\) is the largest such set.  
  3. **Coincidence in partitional models**: Partitional models satisfy the *Axiom of Transparency* (if \(i\) knows \(E\), \(i\) knows they know \(E\)). This ensures that the set of states where all finite orders of knowledge hold is itself a self-evident event (the meet of the agents’ partitions), and vice versa.  

  **Part B**  
  1. **Intuitive reasoning for BI**: If players are rational (choose best responses given beliefs), and all orders of this are known, it *seems* players must foresee that deviating from BI at any node would lead to worse outcomes, as later players will also play BI responses. Thus, defecting immediately appears unavoidable.  
  2. **The gap and problematic assumption**:  
     - **Extra assumption**: BI requires not just CKR, but that *rationality holds materially* at every node, including those off the BI path. Specifically, it assumes that even if an "irrational" move occurs, players will still believe in future rationality at subsequent nodes ("belief in future rationality").  
     - **Problem**: If CKR holds, players expect BI play. If a later node is reached, this contradicts initial expectations. At this node, CKR alone doesn’t force players to believe the *other* will be rational *henceforth* – their beliefs might rationally allow for past "irrationality" to persist. Assuming they *must* believe in future rationality is circular: BI relies on nodes not being reached, but conditioning on a reached node undermines the initial certainty.  
  3. **Role of defining rationality**:  
     - **Acting optimally given beliefs** (belief-based rationality): CKR *doesn’t* imply BI. At an off-path node, a player’s beliefs about the opponent’s future play may *rationally* doubt future rationality (e.g., "They deviated once, so they might deviate again"), justifying non-BI play.  
     - **Ex-ante optimal strategy** (material rationality): If rationality means "never deviates from BI", CKR *implies* BI but vacuously. Reaching an off-path node implies someone was irrational, contradicting CKR. Beliefs become undefined, breaking the argument. BI holds only if we assume rationality *cannot* fail – which isn’t entailed by CKR alone.  

  **Part C**  
  1. **"Almost knowledge" at all levels**:  
     - P(receipt) = \(1 - \epsilon\) → Each "knows" (prob. \(1 - \epsilon\)) the message arrived.  
     - P(both know | receipt) = \((1 - \epsilon)^2\) → Each assigns prob. \(\geq (1 - \epsilon)^2\) that both know, etc. At level \(k\), probability of mutual knowledge is \((1 - \epsilon)^k > 0\). Thus, all finite orders hold with high probability if \(\epsilon\) is small.  
  2. **Coordination failure**:  
     - Under *common knowledge* of receipt, both know the other knows (...), so \(Risky\) is a best response (both expect the other to play it).  
     - Without common knowledge, players face uncertainty: Player 1 might worry Player 2 didn’t get it *or* that Player 2 worries Player 1 thinks Player 2 didn’t get it, etc. Even if \(\epsilon\) is tiny, there’s *some* doubt at *some* high level. Player 2, knowing Player 1 has this doubt, might play \(Safe\) to avoid a payoff of 0. Thus, \(Safe\) can be the only rationalizable outcome, while CK enables \(Risky\).  

  ---

  **Marking Scheme (20 marks total)**  
  **Part A (6 marks)**  
  - A1: Iterative def. (2 marks): All finite orders stated. [Common error: Stops at 2nd level.]  
  - A2: Fixed-point def. (2 marks): "Self-evident", \(E \subseteq K_i E\) ∀i. [Common error: Confuses with mutual knowledge.]  
  - A3: Coincidence (2 marks): Cites partitionality → Axiom of Transparency → iterative hierarchy "closes". [Common error: Says "they’re equivalent" without *why*.]  

  **Part B (10 marks)**  
  - B1: Intuition for BI (2 marks): Describes chain of reasoning ("players foresee BI play forever"). [Common error: Asserts CKR=BI as given.]  
  - B2: Gap & assumption (4 marks):  
    - (2 marks) Identifies "belief in future rationality" or "material rationality off-path".  
    - (2 marks) Explains paradox: Reaching node contradicts CKR expectations → beliefs can’t assume future rationality. [Common error: Misses the belief revision problem; just says "off-path info is missing".]  
  - B3: Defining rationality (4 marks):  
    - (2 marks) Distinguishes belief-based vs. material/ex-ante optimality.  
    - (2 marks) Explains how BI fails under belief-based but holds vacuously under material. [Common error: Treats rationality as univocal.]  

  **Part C (4 marks)**  
  - C1: "Almost knowledge" (2 marks): Shows probability \(\geq (1-\epsilon)^k\) at level \(k\). [Common error: Says "high prob. for all k" without showing *how* it holds.]  
  - C2: Coordination failure (2 marks): Explains CK enables \(Risky\) by resolving all doubt; without CK, hierarchical doubt justifies \(Safe\). [Common error: Claims "tiny \(\epsilon\) doesn’t matter" or focuses only on 1st-order uncertainty.]  

  **Key Penalties**:  
  - -2–3 if conflate mutual + common knowledge.  
  - -4 if assert CKR *implies* BI without qualification.  
  - -2 if miss that CKR + material rationality *is* BI (vacuously).  
  - -2 if claim "almost knowledge" suffices for coordination.  

  ---

  **One-liner on Common Errors per Sub-part**:  
  - A1: Stops at mutual knowledge (2nd level).  
  - A2: Equates fixed-point with "everyone knows E" only.  
  - A3: States equivalence without citing partitionality/transparency.  
  - B1: Begins with "CKR means BI".  
  - B2: Blames only "incomplete information", misses belief-revision loop.  
  - B3: Doesn’t distinguish belief-based/material rationality.  
  - C1: Only considers 1st-order probability.  
  - C2: Argues "high probability suffices for coordination".
