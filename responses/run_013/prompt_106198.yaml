prompt: |-
  Okay so my buddy Marcus and I just burned an entire evening arguing about whether heroism is ever actually optional, and by the end neither of us could even remember what we'd agreed on at the start. I want an actual number from you, not an "it depends on your framework" dodge.

  Here's the exact claim I want your credence in. Call it strong supererogation: there exists at least one action type such that (a) performing an instance of it is morally better than every alternative the agent could permissibly choose, and (b) an agent who skips it is not open to any moral criticism whatsoever -- not blame, not even a warranted "you should have," not even owing anyone an explanation or justification for skipping it.

  I'm at roughly 0.75 that strong supererogation exists. Marcus is at about 0.2; he thinks the whole category is a confusion, and that once you admit the act is better you've already admitted it's required, or else "better" is doing no work at all.

  What I want from you is the decomposition, not just your number:

  - how much rides on whether "morally better than every permissible alternative" is even well-defined -- i.e. whether our options are comparable enough for a ranking to exist at all;
  - how much rides on whether the evaluative ("better") and the deontic ("required") can come apart in the first place, versus "best" simply entailing "ought";
  - how much rides on clause (b) specifically -- the difference between blameworthy, criticizable, and demandable/owed-an-explanation, since I suspect alot of the fight is that Marcus and I keep running those three together;
  - and how much rides on the alternative story Marcus keeps pushing: that the real line isn't better/worse but between moral considerations that carry a warrant to demand compliance and ones that don't, with the cost of actually demanding it of someone setting the line. If that account is right, does strong supererogation survive, or does it just get explained away as "reasons you can't fairly demand"?

  Give me a number for each term, one line of justification each, and how they combine. Then tell me which term your final number is most sensitive to, and which single term Marcus and I most likely actually disagree about -- my hunch is it's not the one we spent the most time on. Finally, tell me what kind of argument or example would move you most, and in which direction.

  Please write it in American English. And if the claim as I've stated it is ambiguous or self-undermining somewhere, say so and fix the statement before you estimate -- but don't use that as an excuse to weasel out of giving a number.
