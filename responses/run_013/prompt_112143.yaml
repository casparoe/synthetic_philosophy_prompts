  Draft:

  **Joint Statement on Moral Language**

  We, an expressivist and a deflationary cognitivist, after extensive discussion, have reached agreement on a number of claims about moral language and have identified the points of residual disagreement. We also outline the cruxes that we believe are the key to resolving our disagreement.

  **1. Agreed Claims**

  The following claims are agreed upon as data that any adequate account of moral language must accommodate, and as constraints on a successful theory:

  (1) Moral sentences are declarative in form and can be grammatically embedded in all the standard linguistic contexts, including:
  - Negation (e.g., "Lying is not wrong," as asserted by an indifferent speaker).
  - Conditionals with moral antecedents and consequents, even when asserted by a speaker who rejects the antecedent (e.g., "If lying is wrong, then telling white lies is wrong").
  - Disjunctions with one moral and one descriptive disjunct (e.g., "Either lying is wrong or the museum opens at nine").
  - Attitude reports, both factive (e.g., "He regrets that lying is wrong") and non-factive (e.g., "She hopes that lying is wrong").
  - Comparatives (e.g., "Lying is worse than cheating").
  - Applications of the truth predicate (e.g., "It is true that lying is wrong").

  (2) In all these embeddings, the moral expressions function compositionally: the meaning of the complex expression is a function of the meanings of its parts and the mode of composition.

  (3) Moral language is used to express pro- and con-attitudes and to influence behavior. An adequate account must explain this connection.

  (4) Moral language is used in reasoning and inference, and an adequate account must explain how moral sentences can participate in valid arguments, including logically complex ones.

  (5) The truth predicate, when applied to a moral sentence, functions in a way that is equivalent to the moral sentence itself (e.g., "It is true that lying is wrong" is equivalent to "Lying is wrong"). Moreover, the application of the truth predicate does not, by itself, commit one to a robust metaphysics of moral facts.

  (6) A speaker can sincerely assert a moral sentence without being committed to the existence of non-natural properties or to a robust metaphysical account of moral facts.

  **2. Residual Disagreements**

  The following table summarizes our core disagreements. Each party's view is stated in their own terms, without question-begging.

  | Disagreement | Expressivist's View | Deflationist's View |
  |--------------|---------------------|---------------------|
  | 1. The nature of moral judgment | A moral judgment, such as judging that lying is wrong, is constituted by having a conative state (e.g., a feeling of disapproval) toward the action, and is not a cognitive belief about a fact. | A moral judgment is a cognitive state (a belief) with representational content, where the content is that the action has the property of being wrong. This property is not metaphysically robust in a way that requires non-natural entities. |
  | 2. The primary function of moral sentences | The primary function of a moral sentence is to express the speaker's conative attitudes and to influence the attitudes and actions of others. It does not primarily describe a state of affairs. | The primary function of a moral sentence is to represent how things are morally. It is truth-apt in the same way as any declarative sentence, and its truth conditions are given by the conventions of the language and the world. |
  | 3. The semantics of moral sentences | The meaning of a moral sentence is given by the type of attitude it conventionally expresses and the conditions under which that attitude is appropriate. | The meaning of a moral sentence is given by its truth conditions, which are determined by the meanings of its parts and the way they are combined. |
  | 4. Truth for moral sentences | Attributing truth to a moral sentence is not ascribing a substantial property but is a way of endorsing the attitude expressed by the sentence. | Attributing truth to a moral sentence is ascribing a genuine but deflationary property of truth, which is a device for semantic ascent and does not imply a robust metaphysics. |

  **3. The Cruxes**

  We have identified three sub-questions as potential cruxes. We assess which are genuine and which are verbal.

  (i) Whether an expressivist semantics can validate the same inferences that a truth-conditional semantics validates.

  (ii) Whether the expressivist is forced to treat the moral predicate as ambiguous between its asserted and unasserted occurrences, and if so whether that is a genuine cost.

  (iii) Whether "truth-apt" marks a substantive commitment or is mere bookkeeping.

  We agree that (iii) is a verbal disagreement. Both parties agree that moral sentences are truth-apt in the minimal, deflationary sense: they are declarative and can be embedded in truth-ascriptions. The term "truth-apt" does not, by itself, imply a robust metaphysics. The substantive disagreement lies in the nature of the mental state expressed by moral assertions (attitude vs. belief), which is not settled by the truth-aptness label.

  We agree that (i) and (ii) are genuine cruxes because they bear on the explanatory power of the two theories and are not merely terminological.

  **4. Cases and Predictions for the Cruxes**

  For each genuine crux, we outline the case or argument that both parties agree bears on it, each party's prediction, and what each would count as evidence against her own view.

  **Crux (i): Inference validation**

  *Case/Argument*: The ability of expressivism to account for the validity of inferences involving moral sentences without appeal to truth conditions. A key example is the moral conditional: "If lying is wrong, then getting little brother to lie is wrong." Both parties agree that this is a valid inference. Another example is the disjunction: "Either lying is wrong or the museum opens at nine." If we also know that lying is not wrong, we can infer that the museum opens at nine. The issue is whether expressivism can validate these inferences using only resources of attitude consistency.

  *Expressivist's prediction*: Expressivism can provide a systematic account of the logic of moral language by defining validity in terms of the consistency of the expressed attitudes. For the conditional, it expresses a higher-order attitude of disapproval of both approving of lying and not approving of getting little brother to lie. For the disjunction, it expresses a state that is incompatible with accepting both that lying is not wrong and that the museum does not open at nine. Thus, expressivism can validate the same inferences as truth-conditional semantics.

  *Deflationist's prediction*: The expressivist account will either fail to validate some inferences that are intuitively valid, or it will have to introduce a structure that is equivalent to truth conditions, thereby undermining the expressivist project.

  *Evidence against expressivist view*: If it is shown that there is a valid inference involving moral sentences that cannot be validated by the expressivist's attitude-based logic, that would be evidence against expressivism.

  *Evidence against deflationist view*: If the expressivist provides a systematic and non-ad-hoc account that validates all the same inferences as truth-conditional semantics without invoking truth conditions, that would be evidence that truth conditions are not necessary and hence against the deflationist's claim that they are the appropriate tool.

  **Crux (ii): Ambiguity of the moral predicate**

  *Case/Argument*: The occurrence of moral predicates in unasserted contexts, such as in the antecedent of a conditional ("If lying is wrong, ...") or in attitude reports ("She hopes that lying is wrong"). Both parties agree that if the expressivist must assign a different meaning to the moral predicate in these contexts than in asserted contexts, that would be a cost because it violates compositionality and intuitions about word meaning.

  *Expressivist's prediction*: Expressivism can provide a unified semantics where the moral predicate has the same meaning in both asserted and unasserted contexts. In unasserted contexts, the moral predicate contributes to the expression of a complex attitude without being directly asserted. For example, in the conditional, the antecedent does not express disapproval but sets up a hypothetical scenario for the attitude expressed by the whole conditional.

  *Deflationist's prediction*: The expressivist cannot avoid assigning a different meaning to the moral predicate in unasserted contexts, or if she does, it will require a semantics that is equivalent to truth-conditional semantics.

  *Evidence against expressivist view*: If the expressivist account requires treating the moral predicate as ambiguous between contexts, that would be evidence against it.

  *Evidence against deflationist view*: If the expressivist provides a semantics that assigns a uniform meaning to the moral predicate across contexts without ambiguity and without collapsing into truth-conditional semantics, that would be evidence against the deflationist's claim that such a thing is impossible.

  Signed,

  [Expressivist] and [Deflationary Cognitivist]
answer: |-
  ### Joint Statement on Moral Language

  We, an expressivist and a deflationary cognitivist, have engaged in adversarial collaboration to clarify our agreements, disagreements, and the cruxes that divide us. Our goal is to isolate substantive differences from verbal ones and identify testable predictions. We agree on core linguistic data and theoretical obligations, but we diverge on the nature of moral judgment, semantics, and truth. Below, we outline areas of consensus, residual disagreements, and the cruxes that could resolve them. All claims are defended by argument alone, without appeal to authority.

  ---

  ### 1. Agreed Claims

  We jointly endorse the following claims as non-negotiable constraints on any adequate account of moral language. These are based on linguistic data, theoretical obligations, and specific constructions where our analyses converge. Each claim is robust enough that signing it precludes abandoning our core positions: the expressivist cannot deny that moral language expresses attitudes, and the cognitivist cannot deny that moral sentences are truth-apt in a deflationary sense.

  1. **Linguistic embeddability**: Moral sentences function as declaratives and embed grammatically in all standard linguistic contexts without anomaly. This includes:  
     - Negation (e.g., "Lying is not wrong," asserted by an indifferent speaker with no con-attitude).  
     - Conditionals with moral components (e.g., "If lying is wrong, then telling white lies is wrong," asserted by someone rejecting the antecedent).  
     - Disjunctions mixing moral and descriptive content (e.g., "Either lying is wrong or the museum opens at nine").  
     - Attitude reports, both factive (e.g., "He regrets that lying is wrong") and non-factive (e.g., "She hopes that lying is wrong").  
     - Comparatives (e.g., "Lying is worse than cheating").  
     - Truth predicates (e.g., "It is true that lying is wrong").  

  2. **Compositionality**: The meaning of complex moral sentences (e.g., negations, conditionals, disjunctions) is compositional. The semantic contribution of a moral predicate (e.g., "wrong") remains consistent across asserted and embedded occurrences, such that the whole sentence’s meaning depends systematically on its parts.  

  3. **Expression of attitudes**: Moral language is fundamentally used to express pro- or con-attitudes (e.g., approval or disapproval) and to influence behavior. Any theory must explain why sincere moral assertion typically reflects the speaker’s motivational state.  

  4. **Inferential role**: Moral sentences participate in valid inferences (e.g., modus ponens with moral conditionals, or disjunctive syllogism with mixed disjunctions). Any theory must explain how such inferences work without ad hoc exceptions.  

  5. **Deflationary truth equivalence**: Predicating truth of a moral sentence (e.g., "It is true that lying is wrong") is equivalent to asserting the sentence itself ("Lying is wrong"). This equivalence holds regardless of whether truth is substantive or deflationary, and it does not entail commitment to robust moral facts.  

  6. **Minimal metaphysical commitment**: Competent speakers can sincerely assert moral sentences without ontological commitment to non-natural properties or mind-independent moral facts.  

  7. **Cognitive flexibility**: Moral language allows for coherent disagreement, hypothetical reasoning (e.g., conditionals with unendorsed antecedents), and indifference (e.g., negations asserted without con-attitude). Any theory must accommodate these without attributing irrationality to speakers.  

  These claims are grounded in observable linguistic behavior. For example, claim 1 is evidenced by the fluency of moral embeddings in ordinary discourse; claim 4 by the intuitive validity of inferences like "If lying is wrong, then getting someone to lie is wrong; lying is wrong; therefore, getting someone to lie is wrong"; and claim 5 by the triviality of truth ascriptions, as in "‘Lying is wrong’ is true iff lying is wrong." Neither of us can reject these without undermining our own views: the expressivist relies on claims 1–4 to resist truth-conditional semantics, while the cognitivist relies on claims 5–7 to block inflationist interpretations of truth-aptness.

  ---

  ### 2. Residual Disagreements

  We disagree on the following points, summarized in the table below. Each party’s view is stated in a non-question-begging way: the formulations avoid assuming the falsity of the other’s position.

  | Disagreement | Expressivist’s View | Deflationary Cognitivist’s View |
  |--------------|----------------------|--------------------------------|
  | **Nature of moral judgment** | To judge that an action is morally wrong is to hold a con-attitude (e.g., disapproval) toward it; it is not a cognitive state with a representational function. | To judge that an action is morally wrong is to believe it has the property of being wrong; this belief is a cognitive state with representational content, but its truth is deflationary. |
  | **Semantic function of moral sentences** | Moral sentences primarily express non-cognitive attitudes; their meaning is constituted by the mental state they conventionally express (e.g., disapproval for "Lying is wrong"). | Moral sentences primarily represent moral states of affairs; their meaning is given by their truth conditions, which are fixed by linguistic conventions and the world. |
  | **Status of truth for moral sentences** | Calling a moral sentence "true" expresses endorsement of the attitude it conveys; it does not ascribe a property but functions as a device for agreement. | Calling a moral sentence "true" ascribes the deflationary property of truth, which is genuine but ontologically minimal and serves semantic ascent. |

  **Note on verbal disagreement**: The third row (on truth) is partly verbal. Both parties agree that "true" functions equivalently to endorsement or semantic ascent (as per agreed claim 5). The substantive disagreement lies in the nature of the mental state expressed by moral assertions (attitude vs. belief), not in the term "truth-apt" itself. We address this in §3.

  ---

  ### 3. The Cruxes

  We evaluate three sub-questions as potential cruxes. Only (i) and (ii) are genuine; (iii) is verbal. Predictions and evidence are outlined in §4.

  - **(i) Whether an expressivist semantics can validate the same inferences a truth-conditional semantics validates**: **Genuine crux**. If expressivism cannot mirror truth-conditional inferences without ad hoc adjustments, it fails a core theoretical obligation (agreed claim 4). If it can, cognitivism’s emphasis on truth conditions becomes superfluous. This is substantive because it tests explanatory parity.  
  - **(ii) Whether the expressivist is forced to treat the moral predicate as ambiguous between asserted and unasserted occurrences, and if so whether that is a genuine cost**: **Genuine crux**. If expressivism requires ambiguity (e.g., "wrong" means one thing in assertions and another in embeddings like conditionals), it violates compositionality (agreed claim 2), which is a serious cost. If not, cognitivism’s demand for unified truth conditions may be unnecessary.  
  - **(iii) Whether ‘truth-apt’ marks a substantive commitment or is mere bookkeeping**: **Verbal crux**. Both parties agree moral sentences are "truth-apt" in the minimal sense that they are declarative and satisfy the formal criteria for truth ascription (agreed claim 5). "Truth-apt" does not distinguish our views, as the cognitivist denies it implies robust metaphysics, and the expressivist can accept it as a label for syntactic features. The disagreement reduces to the nature of moral judgment (attitude vs. belief), which is already captured in §2. Defending the verdict: We concur that the term itself is neutral—bookkeeping—and that insisting it marks a substantive difference would conflate syntax with metaphysics.  

  ---

  ### 4. Cases and Predictions for the Cruxes

  For each genuine crux, we specify a case both agree is probative, each party’s prediction, and what each would count as evidence against her view. Cases draw from the constructions in §1.

  #### Crux (i): Inference validation  
  - **Case**: A disjunction with one moral and one descriptive disjunct: "Either lying is wrong or the museum opens at nine." Both agree that, given this and "Lying is not wrong," one can infer "The museum opens at nine" (disjunctive syllogism). This inference must be validated without special treatment for the moral disjunct.  
  - **Expressivist’s prediction**: Expressivism can validate this inference by treating the disjunction as expressing a complex attitude (e.g., a state of mind incompatible with accepting both "Lying is not wrong" and "The museum does not open at nine"). This mirrors truth-conditional logic through constraints on attitude consistency.  
  - **Cognitivist’s prediction**: Expressivism cannot fully replicate truth-conditional inferences (e.g., it may struggle with quantificational moral sentences) or will covertly reintroduce truth-conditional structures.  
  - **Evidence against expressivist view**: If an inference involving moral sentences (e.g., a quantified moral claim in a disjunction) is intuitively valid but cannot be validated by the expressivist’s attitude-consistency model, expressivism is falsified.  
  - **Evidence against cognitivist view**: If expressivism systematically validates all intuitive inferences (e.g., for conditionals, disjunctions, and quantifiers) without truth conditions, cognitivism’s claim that truth conditions are necessary is undermined.  

  #### Crux (ii): Ambiguity of the moral predicate  
  - **Case**: A moral sentence embedded under a non-factive attitude verb, such as "She hopes that lying is wrong." Both agree the moral predicate "wrong" must have the same meaning here as in an assertion ("Lying is wrong"), per compositionality (agreed claim 2).  
  - **Expressivist’s prediction**: Expressivism can assign a uniform meaning to "wrong" by analyzing embeddings as expressions of higher-order attitudes (e.g., "hopes that lying is wrong" expresses a pro-attitude toward the state of disapproving of lying). No ambiguity is needed.  
  - **Cognitivist’s prediction**: Expressivism must treat "wrong" as ambiguous—e.g., directly expressing disapproval in assertions but denoting a property in embeddings—or else adopt a semantics functionally identical to truth conditions.  
  - **Evidence against expressivist view**: If the only expressivist account of embeddings (e.g., in conditionals or attitude reports) requires assigning distinct meanings to "wrong" across contexts, violating compositionality, expressivism is falsified.  
  - **Evidence against cognitivist view**: If expressivism provides a unified, non-ambiguous semantics for all embeddings (e.g., for conditionals, disjunctions, and attitude reports) without collapsing into truth conditions, cognitivism’s insistence on truth conditions for compositionality is disproven.  

