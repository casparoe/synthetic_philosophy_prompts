answer: |-
  Below is a decision tree designed to guide your classmates from concrete biological cases to named positions on the species concept. The questions focus on conflicts between definitions (e.g., interbreeding vs. common ancestry) and use real-world examples to avoid textbook recitation. The tree has **10 questions** and covers all requested positions. **Flags for unresolved leaves and unoccupied combinations** are noted at the end.

  ---

  ### **Species Concept Decision Tree**
  *Start with a case that challenges simplistic definitions (e.g., ring species or asexual rotifers). Answer each question based on biological conflicts, not prior knowledge of labels.*

  1. **When two populations *look* identical and live in the same area but *never interbreed* (e.g., cryptic insect species), can they be the same species?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **If appearance alone can define species, should populations connected by gradual physical changes (e.g., fossil lineages like *Homo erectus* to *H. sapiens*) always be grouped as one species?**  
     - **Yes** → **Morphological Species Concept (MSC)**. Species are defined by shared physical traits.  
     - **No** → Go to Q7.  

  3. **Is the ability to *interbreed and produce fertile offspring* necessary for being the same species? (Consider asexual rotifers: no interbreeding occurs at all.)**  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  4. **Is interbreeding *sufficient*? (Consider hybrid zones where distinct species interbreed, like some warblers, but remain genetically separate.)**  
     - **Yes** → **Biological Species Concept (BSC)**. Species are defined by reproductive compatibility.  
     - **No** → Go to Q8.  

  5. **Must species members share a *recent common ancestor*? (Consider bacteria swapping genes laterally: no clear "tree of life.")**  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q9.  

  6. **Is shared ancestry *sufficient*? (Consider a bird genus where all species share a recent ancestor but occupy distinct niches.)**  
     - **Yes** → **Phylogenetic Species Concept (PSC)**. Species are the smallest group with a shared evolutionary history.  
     - **No** → Go to Q10.  

  7. **Can a species be defined by its *ecological role* alone? (Consider cryptic species sharing a niche or ring species with gradual ecological variation.)**  
     - **Yes** → **Ecological Species Concept (ESC)**. Species are defined by unique adaptations to a niche.  
     - **No** → Go to Q8.  

  8. **Should species be defined by *reproductive isolation* (not just interbreeding)? (Ring species: ends don’t interbreed, but intermediates do.)**  
     - **Yes** → **BSC** (emphasizing isolation over potential interbreeding).  
     - **No** → Go to Q9.  

  9. **Can *one definition* work for all life? (Asexual rotifers vs. sexual birds vs. horizontal-gene-swapping bacteria.)**  
     - **Yes** → **MSC, ESC, or PSC** (depending on earlier answers). *Unresolved: Tree may lead to multiple leaves here.*  
     - **No** → Go to Q10.  

  10. **Is "species" a real category in nature, or just a human label?**  
      - **Real, but defined variably** → **Species pluralism/heterogeneous category**. Different definitions apply to different organisms.  
      - **Not real or not universally applicable** → **Species eliminativism**. The category is artificial.  

  ---

  ### **Flags and Notes**
  1. **Unresolved Leaves** (due to conflicting answers):  
     - **Q9 → "Yes" branch**: This may lead to **MSC, ESC, or PSC** without distinction. *Why?* Concrete cases (e.g., fossils vs. bacteria) pull toward different concepts, but the tree can’t resolve which single concept "wins" without additional criteria.  
     - **Q6 → "No" branch** and **Q8 → "No" branch**: May ambiguously lead to **ESC** or **pluralism**. *Why?* Rejecting both interbreeding and monophyly often defaults to ecology or context-dependence.  

  2. **Unoccupied Combinations**:  
     - **"Interbreeding necessary + common ancestry sufficient"**: No natural cases. *Why?* If interbreeding is required (Q3→Yes), asexuals are excluded—but common ancestry alone (e.g., in bacteria) doesn’t guarantee interbreeding.  
     - **"Morphology sufficient + ecology sufficient"**: Rarely occupied. *Why?* Morphology and ecology conflict in cases like cryptic species (same morphology, different niches) or ring species (same niche, divergent morphology).  

  ---

  ### **How to Use in Discussion**
  - **Start with examples**: Pose ring species, bacteria, or rotifers to ground each question.  
  - **Track conflicts**: Note where answers clash (e.g., Q4’s hybrid case challenges BSC purism).  
  - **Highlight ambiguity**: Use the flags to show why experts debate pluralism vs. eliminativism.  

  This tree emphasizes *why* species definitions are disputed, using cases your class is arguing about. It fits a 1–2 page handout and encourages critical thinking.
