  Note: The bottom line is a bit long, but it is one sentence. We can condense without losing the nuance.

  Alternatively, a shorter version: "The written record should be the primary basis for factual claims when it conflicts with community memory, but community memory provides essential context and perspective that enriches historical understanding."

  But the original instruction says "which gives way, and under what conditions". So:

  Bottom line: The written record (archive) should prevail when it is well-supported and credible, but community memory must be respected as a source of meaning and identity, and historians should seek reconciliation where possible.

  However, I think the first version is better.

  But to be precise: the written record should be given more weight on factual matters because it is contemporaneous and objective, while community memory is a later reconstruction. But we must acknowledge that archives can be incomplete or biased.

  Final bottom line: "The written record typically prevails in factual disputes due to its contemporaneous nature, but community memory offers indispensable insights into the meaning and impact of events, requiring historians to balance both without dismissing either outright."

  But the question is when they conflict, which gives way? So:

