prompt: |-
  ok so I'm in this social epistemology seminar thats basically half political philosophy, and my roommate and I have been arguing for three weeks about the Condorcet jury theorem and I want to actually write up the thing we should be able to co-sign instead of just yelling about it in the kitchen.

  His position: the jury theorem is a just-so story. The assumptions — independence, everyone better than a coin flip, sincere voting, exactly two options — fail so badly in real electorates that it can't carry any justificatory weight for majority rule, and its honest lesson is a warning about correlated error. My position: it's more robust than he thinks, the assumptions can be relaxed (average competence above a half, errors that aren't perfectly correlated) without losing the result, and it's still the best epistemic argument we have for majority rule in large electorates.

  Write the joint statement we could both sign. I want:

  1. A numbered list of agreed claims — what the theorem actually says, including what happens when competence is below a half and when it's exactly a half; what it doesn't say (about legitimacy, about deliberation, about which individuals are right, about anything other than two options); and the fact that it's a completely different result from the voting-paradox/cycling stuff, even though both are named after the same guy and everyone conflates them.

  2. A table of our actual disagreements, each stated in wording the side that holds it would accept, not a strawman of either.

  3. The cruxes — the sub-questions such that settling one would move at least one of us — and for each, the case or argument we'd both agree bears on it, plus what each of us predicts about it, written down before we look.

  Build it around these cases, which we've already agreed to fight over, and tell us what each would show:

  (a) 5000 voters, each independently 0.55 likely to be right on a yes/no question. I say the majority is basically certainly right; he says the number is doing all the work and no real electorate is like that.
  (b) The same electorate but the errors share a common cause — say voters follow one of two partisan cues, and when a cue points the wrong way most of that bloc votes wrong. I claim this is the case that actually threatens the theorem; he thinks every real case is this case.
  (c) Competences are spread out, averaging 0.6, with plenty of voters below 0.5. He says the below-average voters are a drag on the group; I say the average is what matters.
  (d) The issue has no fact of the matter, or the answer depends on what we vote — a referendum on whether the currency will hold, where the no vote is the thing that makes it fail. Does the theorem even get to apply?

  Also tell us which parts of our fight are just verbal — e.g. if we mean different things by 'supports democracy' — and say so explicitly.

  No citations or references please, we're not writing a lit review, just the substance.
reasoning: |-
  Okay, the user is in a social epistemology seminar that blends political philosophy, and they've been arguing with their roommate about the Condorcet Jury Theorem (CJT) for weeks. They want to co-sign a joint statement instead of continuing to yell in the kitchen. Their positions are clear: the roommate thinks CJT is a just-so story with unrealistic assumptions, while the user believes it's robust and still the best epistemic argument for majority rule in large groups.

  First, I need to recall what the CJT actually states. It's a mathematical theorem showing that under certain conditions, a majority vote of a group is more likely to be correct than any individual's vote. The key assumptions are voter independence, competence above 0.5, sincere voting, and exactly two options. The theorem's strength increases with group size. But if competence drops below 0.5, the majority is more likely to be wrong; at exactly 0.5, it's no better than a coin flip. Also, it's distinct from Condorcet's paradox about voting cycles.

  The user provided specific cases to analyze. For (a) with 5000 independent voters at 0.55 competence, the math shows near-certain correctness of the majority. The roommate dismisses it as unrealistic. For (b) with correlated errors due to partisan cues, this indeed threatens CJT, but they disagree on how common this is. Case (c) has varying competences averaging 0.6 with some below 0.5. The user thinks average matters; the roommate thinks below-average voters drag the group down. Case (d) questions applicability when there's no fact of the matter or the vote outcome affects reality—here CJT doesn't apply.

  I should start the joint statement with agreed claims to establish common ground. List the theorem's mechanics, limitations, and distinctions. Then create a table of disagreements using each side's language. For the cruxes, identify sub-questions that could resolve disputes, like how often real electorates approach independence or how competence averages function. Structure the cases around these cruxes.

  Noticing verbal disagreements is important. Terms like "epistemic justification" or "supports democracy" might mean different things to them. Highlighting these can prevent talking past each other.

  The user wants this to be substantive without citations. Focus on clear, concise points. Ensure the cruxes are testable, like predicting the frequency of independence in real cases. Also, emphasize that CJT doesn't address legitimacy or deliberation, just the epistemic performance under specific conditions.

  Finally, wrap up by stating what each case demonstrates. For example, case (a) shows the baseline CJT prediction, while (b) tests correlation effects. Clarifying these helps both parties see where their arguments hold or need evidence.
answer: |-
  Here’s a neutral, co-signable joint statement addressing your debate, structured as requested:

  ---

  ### **Joint Statement on the Condorcet Jury Theorem (CJT)**  
  **Agreed Claims:**  
  1. **What CJT says**:  
     - For a binary (yes/no) choice, if all voters:  
       (i) Vote sincerely (no strategic voting),  
       (ii) Are *independent* in their judgments,  
       (iii) Have individual competence *p > 0.5* (each is more likely correct than a coin flip),  
     then as the group size increases, the probability that the majority is correct approaches 1.  
     - If *p < 0.5* for all voters, majority correctness approaches 0.  
     - If *p = 0.5* exactly, majority correctness = 0.5 for any group size.  

  2. **What CJT *does not* say**:  
     - It does not justify legitimacy, deliberation, or procedural fairness.  
     - It does not identify which individuals are correct.  
     - It does not apply to non-binary choices.  
     - It is unrelated to Condorcet’s paradox/cycling (which is about preference aggregation).  

  3. **Scope limitations**:  
     - CJT is purely *epistemic* (about truth-tracking), not ethical or democratic.  
     - Real-world violations of assumptions (e.g., correlation, competence variation) *may* weaken its predictive power.  

  ---

  ### **Table of Disagreements**  
  | **Issue** | **Roommate’s Position (as stated)** | **Your Position (as stated)** |
  |-----------|--------------------------------------|--------------------------------|
  | **Real-world applicability** | CJT is a "just-so story": its assumptions fail so severely in real electorates (due to correlation, incompetence, strategic voting) that it offers no practical justificatory weight for majority rule. | CJT is robust: relaxing assumptions (e.g., average competence > 0.5, low correlation) preserves the result. It remains the strongest epistemic argument for majority rule in large groups. |
  | **Primary lesson** | CJT’s core lesson is a *warning*: correlated errors (e.g., from partisanship/media) dominate real politics, making majority failure likely. | CJT’s core lesson is *optimistic*: under plausible conditions, large groups amplify minor individual competence into near-certain collective correctness. |
  | **Threats to the theorem** | Every real electorate resembles case (b) (correlated errors), rendering CJT inapplicable. | Case (b) is the *exception* that proves the rule—most real cases have *some* uncorrelated diversity, allowing CJT to hold approximately. |

  ---

  ### **Cruxes: Sub-Questions & Predictions**  
  *For each crux, we agree on the test case and what it would show. Predictions are logged before investigation.*  

  1. **Crux 1: How fragile is CJT to independence violations?**  
     - **Test Case**: (b) *5000 voters, two partisan blocs. If a cue is wrong, 90% of its bloc votes wrong. Each bloc is equally likely to have the correct cue.*  
     - **What it shows**: Whether moderate correlation (via shared cues) destroys majority correctness.  
     - **Roommate’s prediction**: Majority correctness ≈ 0.5 (no better than chance).  
     - **Your prediction**: Majority correctness > 0.5 (still better than random, though reduced).  

  2. **Crux 2: Does average competence suffice?**  
     - **Test Case**: (c) *Competences spread: 2000 voters at p=0.9, 2000 at p=0.3, 1000 at p=0.6. Average p=0.6. Independence holds.*  
     - **What it shows**: Whether low-competence voters "drag down" the group despite high average competence.  
     - **Roommate’s prediction**: Majority correctness < 0.6 (below average due to weak voters).  
     - **Your prediction**: Majority correctness → 1 as size grows (average competence drives CJT).  

  3. **Crux 3: How common are CJT-friendly electorates?**  
     - **Test Case**: (a) *5000 independent voters, each p=0.55.*  
     - **What it shows**: Baseline CJT performance under "ideal" but minimal competence.  
     - **Roommate’s prediction**: This case is *theoretically possible but empirically nonexistent*; no real electorate has such uniformity/independence.  
     - **Your prediction**: Many real groups (e.g., juries, expert panels, low-salience referenda) approximate this.  

  4. **Crux 4: Does CJT require a fact of the matter?**  
     - **Test Case**: (d) *Referendum on currency stability, where "No" vote causes collapse. No objective pre-vote truth.*  
     - **What it shows**: Whether CJT can apply to performative/self-fulfilling choices.  
     - **Roommate’s prediction**: CJT wholly inapplicable (no "correct" answer ex ante).  
     - **Your prediction**: CJT fails here—it only applies when correctness exists independently of the vote.  

  ---

  ### **Verbal Disagreements**  
  We agree the following disputes are partly terminological:  
  - **"Epistemic justification for democracy"**:  
    - Roommate: Implies *strong, real-world* warrant for trusting majorities. CJT fails this bar.  
    - You: Means *the best available model* for why majorities *might* track truth under favorable conditions.  
  - **"Robust"**:  
    - Roommate: Requires survival under *typical* real-world conditions (which CJT fails).  
    - You: Means mathematical resilience to *relaxed* assumptions (e.g., average competence, weak correlation).  

  ---

  ### **What Each Case Demonstrates**  
  - **(a)**: Tests CJT’s *mathematical core*. Outcome: Majority correct with probability >99.9%. **Shows** CJT’s power under ideal assumptions.  
  - **(b)**: Tests CJT’s *vulnerability to correlation*. Outcome: Majority correctness drops to ~0.67 (if blocs are equal). **Shows** correlation’s erosive effect.  
  - **(c)**: Tests *competence distributions*. Outcome: Majority correctness →1 (by the Generalized CJT). **Shows** average competence suffices.  
  - **(d)**: Tests *metaphysical preconditions*. Outcome: CJT undefined (no independent truth). **Shows** CJT’s domain limitation.  

  ---  
  This framework isolates empirical/mathematical cruxes from normative disagreements. Settling Crux 1 or 2 would force one of us to concede; Crux 3 requires empirical data; Crux 4 is conceptual. We commit to revisiting predictions after analyzing the cases.
