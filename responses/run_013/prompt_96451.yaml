answer: |-
  Here’s a disciplined case analysis of continental drift through Peircean and Jamesian pragmatism, following your constraints. I’ll define terms operationally, map both theories onto your three questions, press at the friction points you identified, and test against cold fusion. I’ll conclude with what the theories struggle to explain.

  ---

  ### **Core Definitions (Operationalized for This Case)**
  - **Peircean Truth**:  
    - *Truth*: The opinion that *all* competent inquirers (geologists, physicists) would converge on after infinitely prolonged investigation, guided by observable evidence and logical reasoning.  
    - *Reality*: The fixed but initially unknown structure of Earth’s history (e.g., actual continental motions).  
    - *Inquirers*: The scientific community engaged in method-driven empirical inquiry (e.g., geologists testing hypotheses).  
    - *Verification*: Indirect; truth is verified only at the "end of inquiry" when consensus stabilizes.  

  - **Jamesian Truth**:  
    - *Truth*: An idea that "works" by generating practical, verifiable consequences *for specific believers* (e.g., predicting fossils, guiding research).  
    - *Reality*: Malleable to human interpretation; truth emerges through successful interaction with the world.  
    - *Inquirers*: Individuals or groups pursuing ideas with tangible payoffs (e.g., a geologist using drift to explain glacial deposits).  
    - *Verification*: Direct and immediate; truth "happens" when an idea proves useful in a concrete context (e.g., organizing field data).  

  ---

  ### **Mapping Continental Drift: 1930 vs. 1960s**
  #### **(a) Was drift true in 1930?**  
  - **Peirce**: **No**. Truth requires eventual convergence, and in 1930, inquiry was actively diverging (most geologists rejected drift). The "fated" end-state (plate tectonics) was not yet determined.  
  - **James**: **No**. Drift lacked "cash value" in 1930—it couldn’t be *used* to predict discoveries, locate resources, or resolve geological puzzles. Without verification-through-use, it remained "untrue."  

  #### **(b) Was it reasonable to believe in 1930?**  
  - **Peirce**: **No**. Reasonableness depends on methodical inquiry. The mechanism objection (no known force could move continents) was a legitimate scientific concern. Accepting drift without a mechanism would violate the rules of inference (e.g., explaining *how* fossils matched).  
  - **James**: **No**. Belief must yield practical advantages. In 1930, drift offered no "definite and assignable" benefits (e.g., it couldn’t improve mining techniques or earthquake prediction). Belief was unsupported by verifiable gains.  

  #### **(c) Could anyone in 1930 have known it to be true?**  
  - **Peirce**: **No**. Knowledge requires consensus at the end of inquiry. Isolated individuals (e.g., Wegener, du Toit) had hunches, but hunches aren’t "knowledge" without communal validation.  
  - **James**: **No**. Knowledge demands verification, and drift had not yet been "made true" through successful application. A lone geologist’s belief might *feel* useful, but without demonstrable payoffs, it couldn’t count as knowledge.  

  > **Neither pragmatist fudges the answers**. Both distinguish (a) ontological truth, (b) epistemic justification, and (c) knowledge. For both, truth in 1930 was *possible* but not *actual*.  

  ---

  ### **Pressing the Friction Points**
  #### **1. Mechanism Objection: Unsupported vs. Not-Yet-Paying-Off**  
  - **Peirce**: Distinguishes cleanly. The mechanism gap meant drift failed to integrate with established physics (e.g., isostasy), violating the *logic* of inquiry. It wasn’t merely "not yet useful"—it was incoherent within the existing web of beliefs.  
  - **James**: Strains here. James defines truth by usefulness, but the objection was about explanatory incompleteness, not utility. However, James could argue that lacking a mechanism *made* drift useless—it couldn’t guide new experiments or technologies. The distinction blurs: an unsupported idea *is* one that hasn’t paid off.  

  #### **2. Cash Value Backwards: Usefulness vs. Evidence**  
  - **James**: Truth *does* track usefulness, not "evidence" abstractly. Drift became true in the 1960s *because* it enabled mineral exploration, seismology, etc. This isn’t a reductio—it’s consistent with his view that evidence only matters when it generates practical gains. Accumulating evidence (e.g., magnetic striping) *is* accumulating utility.  
  - **Peirce**: Avoids the issue. Truth is fixed by convergence, not utility. The 1960s evidence (seafloor spreading) resolved earlier objections, allowing convergence. Payoffs (e.g., in seismology) are downstream of truth, not constitutive of it.  

  #### **3. Convergence vs. Consensus: Fallibilism or Unfalsifiability?**  
  - **Peirce**: Consensus (e.g., post-1960s) is *provisional* but not arbitrary—it’s tethered to observable reality (e.g., ocean-floor data). The theory isn’t unfalsifiable; if new data shattered plate tectonics, consensus would shift. The "end of inquiry" is a regulative ideal, not an excuse for dogmatism.  
  - **Virtue?** Yes—it explains why pre-1960s rejection wasn’t "careless" (geologists followed method) and why drift could later dominate (new data emerged).  

  ---

  ### **Test Case: Cold Fusion (1989–Present)**  
  - **Peirce**:  
    - The lack of convergence doesn’t damage the theory. Truth is still "fated": if cold fusion were real, future inquiry *would* converge on it. The persistent minority is irrelevant—they aren’t conducting competent inquiry (e.g., failing replication).  
    - **Risk of emptiness?** Only if we demand a *guarantee* of convergence. Peirce requires that inquiry *would* settle truth *if pursued long enough*—a counterfactual, but not vacuous.  

  - **James**:  
    - Truth *for the believers*: If cold fusion "works" for them (e.g., securing funding, publishing in niche journals), it is "true" in their context. But it’s not true *simpliciter*, as it lacks broad verification (e.g., no grid-scale energy).  
    - **Problem**: James struggles to explain why the scientific majority is "right." He must appeal to *which* payoffs matter (e.g., reliable energy vs. career persistence).  

  ---

  ### **What Neither Theory Fully Explains**  
  1. **Stubborn Belief Without Payoff**: Why did some geologists (e.g., du Toit) cling to drift pre-1960s when it offered no utility? James can partly answer (it "worked" for their intellectual projects), but neither explains *irrational* persistence.  
  2. **The Role of Authority**: Both undersell how social power (e.g., peer review, institutional gatekeeping) shapes "consensus" (Peirce) or "utility" (James).  
  3. **Why Mechanism Mattered**: Historians note that the mechanism objection was partly sociological (geophysics vs. geology turf wars). Pragmatism treats it as purely epistemic, missing the social dynamics.  

  ---  
  ### **Summary in Your Terms**  
  - **Peirce**: Truth is the **inevitable consensus** of rigorous inquiry. Drift wasn’t true in 1930; rejection was reasonable; no one could know it.  
  - **James**: Truth is **immediate utility**. Drift wasn’t true in 1930; belief was unreasonable; knowledge required verification it lacked.  
  - **Cold fusion**: Vindicates Peirce’s convergence (if true, it *will* win out). Exposes James’s ambiguity: when does "working for a subgroup" become delusion?  
  - **Strain Points**: Peirce handles mechanisms better; James embraces usefulness-truth links; both need external input for social/psychological factors.  

  This mapping stays tight to your request—no survey, no fudging, no jargon dumps. If any term needs re-anchoring, let me know.
