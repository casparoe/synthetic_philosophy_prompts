  For the multiple realizability dependency, I’ll note that functionalism can stand without it (e.g., via explanatory power), but the skeptic thinks rejecting MR weakens the case against identity theory. This might be partly verbal if "load-bearing" means strictly necessary vs. supportive. 

  In the verbal disputes section, I’ll flag ambiguous terms: "realization" (causal vs. mere correlation), "substrate" (physical composition vs. organizational constraints), and "trivial" (weak vs. vacuous claims). This helps isolate genuine disagreements. 

