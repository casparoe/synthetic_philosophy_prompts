prompt: |-
  ok so I'm in a philosophy of mind seminar and my essay partner and I have been going at it for about a month about multiple realizability and functionalism and we've basically stalled. the prof keeps saying we should just write the paper we'd co-author, which neither of us wants to do, so I'm outsourceing the first draft. can you write the joint statement we could both put our names to?

  where we're at: I'm the functionalist. mental states are defined by their causal role, so if some system plays the right role -- silicon, an animal, whatever -- it's in genuine pain, full stop, and the substrate is irrelevant. she's the skeptic, and she's a physicalist too, she just thinks pain is a natural kind like water, not a functional kind. her line is that the multiple realizability argument is either trivial or false. spell the "shared role" out loosely enough that a chip and a person both count, and the claim is true but empty -- any two things resemble each other somehow. spell it out tightly enough to actually be a claim about pain, and it's false, because the systems don't really share the relevant organisation. she also thinks "realization" is smuggleing in a huge amount of hidden work and nobody ever says what it means.

  what I want the document to have:
  - the claims we can both actually sign, about the mind-brain relation, about whether non-human animals feel pain, about what behaviour and wiring can and can't settle;
  - our disagreement phrased so each of us would accept the wording of our own side (no strawmen -- don't write "functionalists claim X" if I wouldn't claim X);
  - the cruxes, and for each one some case, argument, or result we'd both agree bears on it, with each side's prediction recorded in advance;
  - a verdict on which parts of our fight were really just about words. I have a hunch at least one is, but no idea which.

  two things I specifically want handled, because they're where we keep stalling:

  1. the lookup table. suppose someone builds an enormous table that maps every possible input to the pain-appropriate output. does it realize pain? she says obviously not and that this sinks functionalism; I say it just shows our role-description was too thin. is that a real disagreement, or are we using "realize" in two different senses?

  2. a species with no neurons at all that does the whole damage-detection-and-aversion job with a completely different chemistry, spread out over its body with nothing like a central integrator, so arguably there's no single place where "it" is happening. my instinct is: if the role is played, it feels something. hers is: no subject, no pain. does this case separate our views, or does it cut against both of us?

  also we disagree about whether functionalism even needs the multiple realizability argument -- I assumed it's load-bearing, she says functionalism survives fine without it. if she's right, a lot of our fight evaporates, so please say.

  format: numbered agreed-claims, then a disagreements table with a separate crux column, then a short section on the verbal stuff.
