prompt: |-
  ok so me and a friend have been going back and forth on this for about two years and we're just circling each other at this point. he's a Clifford guy down to the bone, I lean way more Jamesian, and I think the useful move now is the adversarial-collaboration thing Kahneman keeps pushing — sit down and actually write the document we could both sign our names to. can you draft it for us? American English please, and please no reading list or citations at the end, I've read the stuff, I want the actual work done.

  Also don't hand me a survey of the famous debate. I want this in the weeds. Here's what needs to be in it:

  1. An agreed-claims section, numbered. What do both sides actually accept about the shape of this dispute? Stuff like: that there are two epistemic goods (getting truth, avoiding error) and the fight is about the exchange rate between them — or, if that framing is already slanted, say so and give one neither of us would flinch at. What the norms attach to: belief, credence, inquiry, assertion. Whether the ethics of belief even needs doxastic voluntarism to bite, i.e. whether direct control is required or indirect control is enough. Whether we're arguing about zetetic norms (how much evidence you're obligated to go get) or about what you may believe once the evidence is already in, because I suspect we've been sliding between those and calling it the same argument.

  2. The disagreements, each one stated in wording that its own side would accept as fair. Not a strawman version, not a mushy compromise version.

  3. Cruxes. Two I think are real, but tell me if I'm wrong and give me the actual ones: (a) whether in interpersonal cases the evidence is partly constituted by the belief itself, so the belief is upstream of the evidence that's supposed to license it; (b) whether there's an asymmetry between the two goods that licenses a different threshold in different domains rather than one flat rule.

  4. For each crux, a case or test that both sides would agree bears on it, with each side's prediction written down in advance. I want these cases in there: the shipowner; the doctor with a patient who'll only pull through if they believe they will; the founder who believes in the startup; the parent who believes in their kid; the researcher's attitude toward their own hypothesis before the data's in; and the friend who keeps believing in a friend who's probably relapsing — with the twist that the distrust is itself part of what causes the relapse.

  5. A distinction I've been kicking around and want tested: belief as a forecast vs belief as a policy. A forecast is a report on what's out there; a policy is a standing commitment to act and feel a certain way. My hunch is that Clifford is always talking about the first and James is mostly talking about the second, and that a chunk of this fight is people using the word believe for two different things. If that's right, say exactly which parts of the disagreement are verbal and which survive even after we seperate the two senses. If it's wrong, kill it.

  6. What each side would count as evidence or argument against its own position, and whether anything at all would actually move the debate.

  Format: numbered agreed-claims section first, then a disagreements table. Thanks.
