prompt: |-
  I'm a novelist, not an academic, so be gentle with me. I'm applying for a one-year fellowship and need a short research proposal (two pages) for a nonfiction essay project that's grown out of the novel I'm writing. I'd like you to take the role of a political philosopher who knows the democratic-theory literature cold, and help me turn my half-formed idea into something real. Think it through carefully before you write.

  The novel is about a small coastal town that holds a referendum on whether to let a neighboring community vote in town elections — these are people who work in the town, pay its taxes, send kids to its schools, but live just over the line. So the whole book is basically the boundry problem, who belongs to the demos, except none of the characters calls it that. What bugs me is this: every character has a principled-sounding answer, and every answer turns out to depend on a prior decision about who gets to decide, which is the very thing in dispute. I suspect the usual fixes — the demos is everyone affected by a decision, or everyone subject to it — don't escape that circle, and that the way out isn't a better criterion for drawing the line but something about the line being permanently revisable and contestable rather than correctly drawn once and for all. I might be wrong about that.

  Can you help? Start by brainstorming three or four ways to sharpen my question so it has a determinate answer, tell me which one is most tractable and why, then write the proposal itself: the precise question, why the existing positions (all-affected, all-subjected, and whatever else is in play) leave it open, the method — what I'd actually do month by month, given that I'm a writer and not running surveys — what a successful result would look like versus what would count as the project failing, and a scope that honestly fits one year. Don't bother with citations or a lit review, I'll fill those in myself. And please flag it if my idea is actually a settled question that I just haven't read enough to know about.
reasoning: |-
  Okay, the user is a novelist applying for a fellowship. They need a research proposal for a nonfiction essay based on their novel, which deals with the boundary problem in democracy - who gets to be part of the demos. The novel centers on a town referendum about letting neighboring residents vote, even though they work, pay taxes, and use services there but live just outside the boundary.

  The user has noticed that every character's principled stance actually depends on prior decisions about who gets to decide, creating a circular problem. They suspect that existing solutions like the "all-affected" or "all-subjected" principles don't escape this circle. Instead, they think the solution might lie in making boundaries permanently revisable and contestable rather than finding a perfect, fixed criterion.

  I need to help sharpen their question into something researchable. First, I should brainstorm ways to focus the question. Then, pick the most tractable one for a novelist. After that, outline the proposal: precise question, critique of existing positions, methodology, success/failure criteria, and a realistic one-year scope.

  The user isn't an academic, so I need to avoid jargon while still grounding this in democratic theory. They want me to role-play as a political philosopher who knows the literature cold. Their deeper need might be to transform their novel's theme into a compelling academic project without losing its narrative essence. They might also need to demonstrate scholarly rigor for the fellowship while leveraging their strengths as a writer.

  I recall key democratic theories: the boundary problem was notably framed by Whelan and others. The "all-affected principle" (everyone affected by a decision should have a say) is criticized for being too vague. The "all-subjected principle" (those subject to the rules) is clearer but still arbitrary about where to draw lines. Both assume a pre-existing demos, which is circular. Robert Dahl and others like Benhabib and Näsström have discussed this.

  The user's insight about revisable boundaries aligns with agonistic democracy (Mouffe) and pragmatist approaches (Dewey). This isn't settled; it's an ongoing debate. So their idea has merit.

  Brainstorming ways to sharpen the question:
  1. Why do all solutions to the boundary problem end up being circular?
  2. How do real communities handle boundary disputes without a perfect principle?
  3. Is there a democratic way to decide who decides, beyond fixed criteria?
  4. Does accepting permanent contestability make democracy more legitimate?

  Option 3 seems most tractable. It focuses on process over principle, which a novelist can explore through narratives and cases without heavy theory. It's concrete: looking at how communities negotiate boundaries in practice. The user can draw from their novel's setting and find real-world parallels.

  For the proposal:
  - **Precise Question:** How do communities democratically decide who gets to decide membership when no fixed principle resolves the circularity?
  - **Critique of Existing Positions:** Show how all-affected and all-subjected principles still require prior decisions, and how even territorial or cultural criteria are arbitrary. Highlight the circularity.
  - **Method:** Month-by-month plan. Start with literature (light reading), then gather cases (historical, current), interview people in similar towns, observe meetings if possible. Since they're a writer, focus on narratives and dialogues. Months 1-2: Prep and cases. Months 3-6: Fieldwork and writing. Months 7-9: Draft essays. Months 10-12: Revise.
  - **Success:** A series of vivid essays showing that legitimacy comes from ongoing contestation, not fixed solutions. Failure would be not finding enough examples or forcing an answer where none exists.
  - **Scope:** One year, limited to local contexts (towns, schools, etc.), not national or global. Output: 3-5 essays, not a book.

  I should flag that their idea isn't settled; it's part of current debates, so they're on solid ground. Emphasize their unique angle as a novelist using narrative to explore theory.

  Make sure the proposal feels authentic to their voice—less academic, more exploratory. Keep it to two pages as requested. Avoid citations; they'll add those. Stress that this bridges fiction and nonfiction, leveraging their strengths.
answer: |-
  ### Brainstorming: Sharpening Your Question  
  1. **Why do all proposed solutions to the democratic boundary problem ("all-affected," "all-subjected") collapse into circularity?**  
     *Tractability*: High. Focused on exposing flaws in existing theories. But risks being purely theoretical, less engaging for a writer.  

  2. **How do real-world communities navigate boundary disputes *without* a fixed principle, and what does that reveal about democracy?**  
     *Tractability*: Very high. Uses your skills: observe/describe tensions in actual towns, schools, or organizations. Grounds theory in lived experience.  

  3. **Is democratic legitimacy found not in *solving* the boundary problem but in *how* it’s contested?**  
     *Tractability*: Ideal. Builds on your insight about permanent revisability. Lets you explore stories of conflict, negotiation, and temporary resolutions.  

  4. **Can democracy only start by *presupposing* a demos (as Rousseau/Derrida imply), making the boundary problem unsolvable?**  
     *Tractability*: Low. Too abstract, requires grappling with dense philosophy.  

  **Recommended Focus: Question 3**  
  It’s tractable because:  
  - It’s **open-ended**, avoiding a forced "answer."  
  - It **leverages your craft**: You’ll collect narratives, not data.  
  - It’s **under-explored**: Most theorists seek "correct" boundaries; few study contestation *as* legitimacy.  
  - **Not settled**: Agonistic democrats (Mouffe), pragmatists (Dewey), and critical theorists (Honig) touch on this, but no consensus exists.  

  ---

  ### Research Proposal: "Lines in the Sand: Democracy as Boundary Contestation"  
  **(Two-Page Scope for a Nonfiction Essay Project)**  

  #### I. Precise Research Question  
  How does the *process of contesting democratic boundaries*—rather than enforcing fixed principles—generate legitimacy in communities facing membership conflicts?  

  #### II. Why Existing Positions Leave This Open  
  - **The "All-Affected" Principle** (e.g., Shapiro): If everyone impacted by a decision gets a vote, who decides what "affected" means? (e.g., Are tourists at the town beach "affected"?). It pre-assumes a demos to define "impact."  
  - **The "All-Subjected" Principle** (e.g., Abizadeh): If those governed by rules get a vote, who sets the rules’ jurisdiction? (e.g., Your town’s non-resident taxpayers *are* subject to its laws but can’t vote). Still requires a prior authority.  
  - **Territory/Citizenship Fixes**: Arbitrary lines (e.g., town borders) or cultural criteria (e.g., "shared identity") ignore fluid realities like cross-border labor or multi-located lives.  
  **The Gap**: All assume a static demos. None address how democracy functions when the *right to define the demos* is itself debated.  

  #### III. Method: A Writer’s Approach (12-Month Plan)  
  **Core Strategy**: Collect "contested boundary" narratives through fieldwork, archives, and dialogues. No surveys—focus on stories, language, and unresolved tensions.  

  - **Months 1–2: Framing & Cases**  
    - Light theory review (key texts: Benhabib on *democratic iterations*; Näsström on the "boundary problem"; local governance studies).  
    - Identify 3–4 real-world parallels: Coastal towns with tax/residency disputes; school districts with "out-of-boundary" students; cooperatives debating membership rules.  

  - **Months 3–6: Fieldwork & Immersion**  
    - Visit 2–3 sites (e.g., your novel’s inspiration + analogous towns).  
    - Observe town meetings, interview residents/officials (*not* as a sociologist but as a "story collector"). Ask:  
      - *How was this line drawn? Who was heard? Who wasn’t?*  
      - *When did the dispute feel "fair"—even if unresolved?*  
    - Archive dive: Minutes from past boundary debates, local newspapers, referendum campaigns.  

  - **Months 7–9: Drafting Essays**  
    - Produce 3–5 nonlinear essays blending:  
      1. **Vignettes** from fieldwork (e.g., a teacher arguing non-resident parents deserve a voice).  
      2. **Dialogue excerpts** showing how principles shift mid-debate.  
      3. **Reflections** on legitimacy emerging *through* conflict (e.g., "The referendum failed, but the process forced new forums for input").  

  - **Months 10–12: Synthesis & Revision**  
    - Refine essays into a cohesive manuscript (20–30k words). Core argument: Democracy’s strength lies in *keeping boundaries negotiable*, not solving them.  

  #### IV. Outcomes: Success vs. Failure  
  - **Success Looks Like**:  
    - A vivid, human-centered portrait of boundary conflicts that **avoids prescribing solutions**.  
    - Demonstrating how **temporary, contested arrangements** (e.g., "You can vote on school budgets but not zoning") build trust *because* they’re revisable.  
    - Essays that **resonate with non-academics** while subtly engaging theory (e.g., showing agonism in a town hall shouting match).  

  - **Failure Looks Like**:  
    - Forcing a "universal theory" of boundaries (betraying your insight).  
    - Over-reliance on abstract philosophy, losing the novelistic texture.  
    - Cases too similar (e.g., only coastal towns) or narratives too tidy.  

  #### V. Realistic Scope  
  - **Focus**: Local contexts (towns, schools, micro-democracies). *Not* states or global governance.  
  - **Output**: 3–5 standalone essays + framing introduction. **Not a monograph**.  
  - **Constraints**: 1–2 short field trips; no IRB hurdles (public meetings, anonymized voices).  
  - **Your Novel’s Role**: Seed material, not the primary source (avoids self-referentiality).  

  **Final Note**: Your instinct is sharp. The boundary problem *is* circular—theorists like Whelan and Dahl admit this. But turning "permanent contestation" from a bug into a feature? That’s fresh. Your project won’t "solve" democracy. It’ll show why the fight over the line *is* democracy. That’s fellowship gold.
