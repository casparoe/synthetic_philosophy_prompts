prompt: |-
  A national health technology assessment body sets coverage rules for a public insurer. Its method is roughly this: it estimates the health gain of an intervention in quality-adjusted life years, divides the net cost by that gain, and compares the result with a threshold. It does not adjust for the patient's age, income, or pre-existing disability; a QALY is treated as a QALY whoever receives it. But it does apply two exceptions. First, a severity modifier gives extra weight to interventions for people whose condition is already worse, so that a QALY gained by a severely ill patient can count for more than a QALY gained by a mildly ill one. Second, a rule-of-rescue exception relaxes the threshold for treatments for rare, immediately life-threatening conditions, even when the cost per QALY is far above the usual ceiling. The body defends the first exception as fairness to the worse off and the second as a refusal to let a small number of identifiable lives be priced out of the system, while insisting that the core QALY metric remains impartial and that it has not adopted any particular ethical theory.

  What philosophical commitments does this practice presuppose? Reconstruct the implicit theory of aggregation, interpersonal comparability, and moral standing that makes the combination intelligible. In particular, say how far the practice is committed to something like Harsanyi's aggregation theorem, and where it could instead be licensed by weaker or rival views, such as prioritarianism, ex ante contractualism, or a pluralist appeal to rule of rescue. Distinguish what the practice strictly requires from what it merely fits well with. Identify which rival views it quietly rules out. Then say whether its parts are consistent: can a single body treat a QALY as equally valuable across persons, add severity weights, and still grant a rule-of-rescue exception without incoherence? If not, what is the most defensible repair? Finally, say what would have to change in the practice if we rejected one of its load-bearing commitments, for example interpersonal comparability of health states or the separability of individual health gains.

  Conclude with one line exactly in the form \answer{load_bearing_commitment=<short label>; underdetermined=<yes/no>; rival=<short label>}.
reasoning: |-
  Hmm, the user presents a complex ethical analysis of a health technology assessment body's methodology. They want me to dissect the philosophical underpinnings of this QALY-based system with two exceptions - severity weighting and rule-of-rescue. 

  I need to reconstruct the implicit ethical framework behind treating QALYs equally while making these exceptions. The core method suggests utilitarian aggregation through Harsanyi's theorem, but the exceptions point beyond that. The severity modifier leans toward prioritarianism by weighting gains for the worse-off more heavily, while rule-of-rescue reflects deontological concerns about identifiable lives. 

  The body's claim of not adopting any particular ethical theory is interesting - technically true since they mix approaches, but philosophically unstable. I should examine whether these pieces cohere. The tension lies between valuing QALYs equally (implying separability) and severity weighting that violates separability. Rule-of-rescue further complicates by introducing non-consequentialist elements. 

  For consistency, I'll argue the practice isn't incoherent if framed as pluralistic balancing, though it strains utilitarianism. The most defensible repair would be explicit ethical pluralism rather than pretending to be theory-neutral. 

  Key load-bearing commitments are interpersonal comparability of QALYs and separability of health gains. Rejecting comparability would collapse the whole system, while rejecting separability actually aligns with the severity modifier. 

  The user seems philosophically sophisticated - likely an ethics scholar or policy analyst probing real-world applications of distributive justice theories. Their structured query suggests they want both technical analysis and practical implications. 

  I'll conclude with the requested one-line summary, noting interpersonal comparability as load-bearing, the framework as underdetermined between prioritarianism/pluralism, and strict utilitarianism as the ruled-out rival.
answer: |-
  The practice combines utilitarian aggregation with prioritarian and deontological exceptions, revealing a pluralist but tension-laden ethical foundation. Below is a reconstruction of its commitments, consistency, and alternatives.

  ### Core Philosophical Commitments
  1. **Interpersonal Comparability**: Absolute commitment to comparing health states across individuals via QALYs. This assumes that:
     - Health-related quality of life and survival duration can be cardinally measured and compared.
     - A QALY loss/gain has the same *intrinsic* value regardless of who experiences it (baseline equality).

  2. **Aggregation & Separability**: 
     - **Harsanyi-like Utilitarianism**: The core cost-per-QALY threshold aligns with Harsanyi’s theorem, which demands:
       - Individual preferences/von Neumann-Morgenstern utilities are separable and additive.
       - Social welfare is the sum of individual utilities (QALYs).
     - **But not strictly Harsanyi**: Harsanyi requires *unweighted* summation. The severity modifier violates this by weighting QALYs unequally.

  3. **Moral Standing**: 
     - All patients have equal moral standing (rejecting age/income/disability adjustments).
     - Yet the severity modifier implicitly prioritizes those with worse *health prospects*, introducing a prioritarian element (fairness to the worse off).

  ### Exceptions & Their Licensing Theories
  | **Component**       | **Strictly Requires**                     | **Fits Well With**                          | **Rules Out**                              |
  |----------------------|------------------------------------------|--------------------------------------------|--------------------------------------------|
  | **Core QALY Metric** | Interpersonal comparability; Separability | Utilitarianism; Pareto efficiency         | Non-comparabilist views (e.g., some forms of sufficientarianism) |
  | **Severity Modifier** | Rejection of QALY separability           | **Prioritarianism** (weighting by baseline health); Ex ante egalitarianism | Strict utilitarianism; Health maximization |
  | **Rule-of-Rescue**   | Non-consequentialist moral pull          | **Deontological contractualism** (saving identifiable lives); Pluralist tragedy avoidance | Pure consequentialism; Inflexible cost-effectiveness |

  ### Consistency & Coherence
  - **Inconsistency**: The core metric assumes QALYs are separable and additive (Harsanyi), but the severity modifier violates separability by making the value of a QALY depend on the recipient’s baseline health. The rule-of-rescue further disrupts aggregation by allowing higher costs for small groups, contradicting impartial maximization.
  - **Coherence via Pluralism**: The practice *can* be coherent if framed as **pluralist prioritarianism**:
    - **Baseline**: QALY aggregation for efficiency.
    - **Adjustments**: 
      - *Ex post* prioritarianism (severity weights for current worse-off).
      - *Non-aggregative* deontology (rule-of-rescue for identifiable lives).
    - **Defensible Repair**: Explicitly adopt a **multi-principle framework** (e.g., Ottersen’s 3D model) with weights for efficiency, priority to the worse off, and catastrophe aversion. This replaces the "core metric + exceptions" with a unified but pluralist decision rule.

  ### Rejecting Load-Bearing Commitments
  - **Reject Interpersonal Comparability**: The entire QALY system collapses. Alternatives (e.g., capability approaches) would require fundamental redesign.
  - **Reject Separability**: Severity weights already reject separability. A formal non-separable model (e.g., rank-dependent QALY aggregation) could integrate severity directly, making the exception redundant.

  ### Conclusion
  The practice quietly rules out **strict utilitarianism** and **unweighted cost-per-QALY maximization**. Its inconsistencies arise from grafting deontological/prioritarian exceptions onto a utilitarian core, but it can be repaired through structured pluralism. The rule-of-rescue is not licensed by prioritarianism alone; it requires distinct deontological or pluralist justification.

  \answer{load_bearing_commitment=interpersonal_comparability; underdetermined=yes; rival=strict_utilitarianism}
