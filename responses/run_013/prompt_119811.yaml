answer: |-
  Below is a precise reconstruction of Aquinas's argument from *Summa Theologiae* II-II, q. 64, a. 1, addressing your questions systematically. I clarify the logical structure, expose tacit premises, and analyze key moves.

  ---

  ### **1. Argument Reconstruction (Body of the Article)**  
  **Conclusion (C):** It is not unlawful for humans to kill plants and animals for human use.  

  **Explicit Premises:**  
  1. "There is no sin in using a thing for the purpose for which it is." (*Premise 1*)  
  2. "The order of things is such that the imperfect are for the perfect." (*Premise 2*)  
  3. In natural generation: "First a living thing, then an animal, and lastly a man." (*Premise 3*)  

  **Tacit Premises (Necessary for Validity):**  
  4. **Teleological Axiom:** The sequence of natural generation reveals the teleological ordering of species. (Links P3 → P2)  
  5. **Hierarchy of Perfection:** Humans are more perfect than animals, and animals more perfect than plants. (From P3 + Aristotelian biology)  
  6. **Normative Implication:** If X exists for the sake of Y, then Y may use X for its good without sin. (Links P1 + P2 → C)  
  7. **Divine/Natural Ordinance:** Purposes embedded in nature reflect God’s design and are morally binding. (Underpins P1 and P2)  

  **Logical Sequence:**  
  1. P1: Use aligned with a thing’s purpose is sinless.  
  2. P2: Imperfect beings exist for the sake of perfect beings (teleological hierarchy).  
  3. P3: Nature generates life progressively (plants → animals → humans).  
  4. **Tacit P4:** P3 provides evidence for P2 (generation sequence reveals teleology).  
  5. **Tacit P5:** Humans > animals > plants in perfection (from P3).  
  6. ∴ Plants exist for animals, and animals for humans (from P2 + P5).  
  7. **Tacit P6:** ∴ Humans may use plants/animals for their good (from P1 + Step 6).  
  8. **C:** Killing plants/animals for human use is not unlawful.  

  **Load-Bearing Elements:**  
  - **P1** and **P2** are foundational; if rejected, the argument collapses.  
  - **Tacit P4** (inferring teleology from generation) is the most critical and vulnerable step.  
  - **Tacit P7** (divine/natural ordinance) anchors the normativity but remains implicit here.  

  ---

  ### **2. From Temporal Sequence to Teleological Hierarchy**  
  - **The Inference:** Aquinas moves from "X precedes Y in generation" (temporal) to "X exists for Y" (teleological).  
  - **Is It Fallacious?** Yes, if isolated as a purely chronological claim (post hoc fallacy). But Aquinas sees it as **evidence for an independent metaphysical principle** (P2: "imperfect for perfect").  
  - **Support for the Metaphysical Claim:**  
    - P2 is treated as axiomatic here, rooted in Aristotle (*Physics* II.8, *De Anima* II.4).  
    - P3 is not proof but an *illustration* of P2, showing nature’s directionality toward increasing perfection.  
    - **Weak Joint:** P2 is asserted without defense in this passage. It relies on pre-supposed Aristotelian teleology, where nature acts for ends. Aquinas elsewhere defends teleology via divine governance (e.g., *SCG* III.64), but not here.  

  ---

  ### **3. "Using a Thing for Its Purpose" – Status and Strength**  
  - **Premise 1 ("no sin in using a thing for its purpose"):**  
    - **Not analytic:** It assumes a teleological worldview where entities have intrinsic purposes.  
    - **Source:** Rooted in natural law (God’s design) and Aristotelian metaphysics.  
  - **Strength Required for Conclusion:**  
    - **Strong reading needed:** Animals *exist for man’s sake by nature* (P2). The weak reading ("permissible to use them *as if* for man") would not answer the objection, which claims all life has equal moral weight. Aquinas needs the strong claim to justify *inherent* subordination.  

  ---

  ### **4. Reply to the Objection – Shifting the Criterion**  
  - **Objection:** Killing is sinful because it deprives an entity of *life* (common to plants/animals/humans).  
  - **Aquinas's Reply:**  
    - He substitutes the criterion: Moral status depends not on life *simpliciter*, but on **rational self-motion**.  
      - Humans: Self-moved via reason → Moral standing.  
      - Animals/plants: Moved "by another" (instinct/nature) → No intrinsic moral claim.  
    - **Sign:** Their "natural enslavement" to others' uses confirms their instrumental status.  
  - **Does This Answer the Objection?**  
    - **No directly.** The objection hinges on life *as such*; Aquinas changes the subject to *rational autonomy*.  
    - **Criterion for Wrongful Killing:** Killing is wrong only if it destroys a being with rational self-motion (or, by extension, one made in God’s image).  
    - **Objection Reframed:** If the objector accepted rational autonomy as the criterion, Aquinas’s reply would suffice. But the original objection intentionally avoids this to challenge hierarchy.  

  ---

  ### **5. Connection to Self-Defense (q. 64, a. 7)**  
  - **Self-Defense Argument:** An act with two effects (saving self/killing aggressor) is licit if:  
    - The intention is self-preservation (good effect),  
    - The death is unintended (though foreseen).  
  - **Dependence on Teleological Hierarchy?**  
    - **Yes, implicitly:** The aggressor’s action places them *outside* the natural order (where life is ordered toward reason and justice). By acting unjustly, they forfeit their claim to inviolability within the hierarchy.  
    - **Key Link:** In a. 1, Aquinas establishes that human life has special status due to rationality. In a. 7, the unjust aggressor’s loss of life is tolerable *because* they violate the natural order that privileges rational life.  
  - **Independent Elements of Double Effect:**  
    - The mechanics of intention/foresight could stand alone (e.g., in cases not involving killing).  
    - **Dependent Elements:** The permissibility of *causing death* relies on the aggressor’s diminished status in the teleological hierarchy. Without a. 1’s framework, killing even an aggressor could violate the sanctity of rational life.  

  ---

  ### **Weak Joints in Aquinas’s Argument**  
  1. **Unargued Teleology:** P2 ("imperfect for perfect") is asserted axiomatically. Modern readers may reject this as a non-empirical, value-laden claim.  
  2. **Is-Ought Leap:** Even if nature *is* hierarchical, it doesn’t logically follow that we *ought* to exploit it (Hume’s guillotine).  
  3. **Ambiguity in "Purpose":** Aquinas conflates *natural function* (e.g., plants nourishing animals) with *moral permission* (humans may kill). The latter doesn’t necessarily follow.  
  4. **Reply’s Non-Responsiveness:** The reply sidesteps the objection’s core concern (equality of life) by redefining moral status.  

  Aquinas’s strength lies in his cohesive system, not isolated arguments. Rejecting his teleology unravels his conclusions—but within his framework, the reasoning is internally consistent.
