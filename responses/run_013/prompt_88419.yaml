prompt: |-
  I'm a philosopher of biology by training, and for the last three years I've had a semi-official consulting arrangement with the exhibit team at a mid-sized natural history museum. They pulled me in originally because a label in the evolution hall said that the function of the panda's extra wrist bone was to strip bamboo, a visiting biologist wrote them a furious four-page letter about it, and it turned out that nobody on staff could say what would make that sentence true or false. Now I sit in on their label reviews maybe once a month, and the pattern never changes: a writer has a sentence of the form "the function of X is Y" — sometimes X is a trait, sometimes it's a whole species in an ecosystem ("the function of prairie dogs in the grassland is..."), which I keep telling them is a seperate conceptual animal and they keep not believing me — and the room can't decide whether the sentence is an overclaim, an underclaim, or perfectly fine, so it usually gets softened into mush by committee. They've finally asked me for something usable, and I'd rather hand them a real procedure than another lecture, so I'm asking you to write it.

  Here's what I need. A decision procedure that a label writer with no philosophy background can run on a draft sentence in about twenty minutes, one page, no jargon: the questions to ask in order (and why that order), what counts as a sufficient answer at each step, where the procedure stops and says no, and where it has to hand the decision to a person because the question is one of values or of editorial taste rather than fact. I want a short battery of concrete tests they can actually apply to a sentence — something like, does the trait currently contribute to some capacity of the organism, and is there reason to think it was selected for that contribution — since the two accounts of function (the etiological/selected-effect family and the causal-role family) give different verdicts on the same trait, and the procedure has to make that disagreement usable rather than hide it. It should also say what to do when the strong claim fails: what weaker sentence to print instead, and how to tell a genuine "we don't know" from a face-saving hedge. Then run it on three of their stuck labels: the panda's radial sesamoid, goosebumps in humans, and the giraffe's long neck (the current label implies the neck is for reaching high foliage, and there's a long-running dispute about that which I won't rehearse here). At least one of those should come out as an answer the exhibit team will hate, and you should say so rather than softening it. Finally, tell me what the procedure can't do, including whether the ecosystem-function sentences can really be handled by the same machinery with different nouns or whether that's a different problem wearing the same word. Please dont give me reading lists or citations — the writers won't use them, and half of them I couldn't check from the museum anyway.

  One more thing, and I mean this: if the honest answer is that there is no single procedure here, because the two accounts of function are answering different questions and any usable procedure has to begin by asking the writer which question they're asking, then say that plainly instead of pretending the two can be fused into one flowchart — and then still give me the best thing you can. And flag which of your steps are judgment calls dressed up as procedure, because the writers will follow your checklist literally and I'll be the one getting the letters.
reasoning: |-
  Okay, the user is a philosopher of biology consulting for a natural history museum. They need a practical decision procedure for evaluating sentences about "function" in exhibit labels. The key issues are distinguishing between etiological (selected-effect) and causal-role accounts of function, handling ecosystem claims separately, and providing clear fallbacks when claims fail. 

  First, I need to recall the core differences between the two function accounts. Etiological functions require evolutionary history - was the trait selected for that purpose? Causal-role is about current contribution - does it currently do something useful? The museum keeps conflating these, especially with ecosystem "functions" which are metaphorically different.

  The user wants no jargon, just concrete steps. So I'll build the procedure around three key questions: 1) Is this about a trait or an ecosystem role? (This splits the workflow immediately) 2) For traits, does it currently contribute? (Causal-role test) 3) Is there evidence of historical selection? (Etiological test). Each step needs clear pass/fail criteria.

  The tricky part is when results conflict. If something currently functions but lacks selection evidence (like goosebumps), we have to weaken the claim. The user specifically wants us to preserve these disagreements rather than hide them. And we must flag judgment calls - like interpreting selection evidence - where writers might oversimplify.

  For ecosystem claims, I'm inclined to treat them as fundamentally different. Saying prairie dogs have a "function" is metaphorical - it's really about their ecological role. So the procedure should reroute these to a separate set of questions about current contributions and stability.

  The three test cases will show how this works: 
  - Panda's wrist bone passes both tests (strong claim survives)
  - Goosebumps pass causal but fail etiological (requires weakened phrasing)
  - Giraffe necks fail both tests (controversial, but current evidence suggests we can't make either claim)

  The user warned some answers will be unpopular - the giraffe conclusion will definitely upset the exhibit team who want the high-foliage story. But the procedure forces us to confront weak evidence.

  Finally, limitations: We can't resolve philosophical debates, only make them explicit. Judgment calls lurk in interpreting evidence. And ecosystem claims aren't "functions" in the biological sense at all. The writers won't like hearing that, but the user prefers honesty over comfort.
answer: |-
  Here’s a one-page decision procedure for evaluating "function" claims in museum labels, designed for non-philosophers. It treats **trait functions** (e.g., panda’s wrist bone) and **ecosystem roles** (e.g., prairie dogs) as separate cases. Judgment calls are flagged with ⚠️.

  ---

  ### **DECISION PROCEDURE: "THE FUNCTION OF X IS Y"**  
  *(Run these steps in order; stop if you hit a "No" or "Unclear")*

  #### **STEP 1: IS THIS ABOUT A TRAIT OR AN ECOSYSTEM ROLE?**  
  - **Trait:** A physical/behavioral feature of an organism (e.g., "the giraffe’s neck").  
  - **Ecosystem role:** An organism’s job in its habitat (e.g., "prairie dogs in grasslands").  
    - **→ If Ecosystem Role:** STOP. Use the **Ecosystem Procedure** (see Section B).  
    - **→ If Trait:** Proceed to Step 2.

  ---

  #### **A. TRAIT FUNCTION CLAIMS**  
  **STEP 2: DOES THE TRAIT *CURRENTLY* CONTRIBUTE TO Y?**  
  *(Causal-role test: Is it doing the job right now?)*  
  - **Ask:** "If we observe the organism today, does X reliably help achieve Y?"  
    - *Example:* "Does the panda’s wrist bone *currently* help strip bamboo?"  
  - **Sufficient evidence:** Direct observation, experiments, or consensus from biologists.  
  - **→ No/Unclear:** Write: "X *can* Y" or "X *helps* Y" (if plausible). If unknown: "Scientists are studying how X works."  
  - **→ Yes:** Proceed to Step 3.

  **STEP 3: WAS THE TRAIT SHAPED BY EVOLUTION *FOR* Y?**  
  *(Etiological test: Was it selected for this job?)*  
  - **Ask:** "Is there evidence that X evolved *because* it improved survival/reproduction via Y?"  
  - **Sufficient evidence:**  
    - Fossil/comparative data showing X evolved alongside Y.  
    - Experiments showing organisms *without* X struggle with Y.  
    - No strong alternative explanation (e.g., exaptation).  
    ⚠️ *Judgment call: Weigh evidence quality. When in doubt, answer "Unclear."*  
  - **→ No/Unclear:** Use cautious language: "X *is used for* Y" or "X *helps* Y."  
  - **→ Yes:** You can state: "The function of X is Y."  

  ---

  #### **B. ECOSYSTEM ROLE CLAIMS**  
  **STEP 1: DOES THE ORGANISM *CURRENTLY* DO Y IN ITS ECOSYSTEM?**  
  *(e.g., "Do prairie dogs aerate soil?")*  
  - **Sufficient evidence:** Field studies showing consistent effect.  
  - **→ No/Unclear:** Write: "Prairie dogs *may* help..." or state the *effect* neutrally ("Prairie dog burrows change soil").  
  - **→ Yes:** Proceed to Step 2.  

  **STEP 2: IS Y CRITICAL FOR ECOSYSTEM STABILITY?**  
  *(Is this role "functional" or just something it does?)*  
  - **Ask:** "If this organism vanished, would the ecosystem collapse or change drastically?"  
    ⚠️ *Judgment call: Ecosystems are complex; causality is hard to prove.*  
  - **→ No/Unclear:** State the *action*, not the "function": "Prairie dogs dig burrows that create habitats for other species."  
  - **→ Yes:** Use: "Prairie dogs *maintain* grasslands by..." (Avoid "function").  

  ---

  ### **TEST CASES**  
  1. **Panda’s radial sesamoid ("wrist bone"):**  
     - Step 2 (Current use?): **Yes** (observed stripping bamboo).  
     - Step 3 (Selected for?): **Yes** (fossils show bone enlarged with bamboo specialization).  
     - **Verdict:** "The function of the panda’s radial sesamoid is to strip bamboo." **Safe.**  

  2. **Goosebumps in humans:**  
     - Step 2 (Current use?): **No** (no insulation/fear response in modern humans).  
     - **Verdict:** **Weak claim.** Write: "Goosebumps are a reflex left from our furry ancestors, who fluffed their fur for warmth or to look larger."  

  3. **Giraffe’s long neck (for reaching high foliage):**  
     - Step 2 (Current use?): **Yes** (observed eating high leaves).  
     - Step 3 (Selected for?): **Unclear** (competing hypotheses: sexual selection, thermoregulation).  
     - **Verdict:** **Overclaim.** Use: "Giraffes *use* their long necks to reach high foliage, though scientists debate why necks evolved."  
     - ⚠️ *Exhibit team will hate this* – but "function" implies evolutionary purpose, which lacks consensus.  

  ---

  ### **WHAT THIS PROCEDURE CAN'T DO**  
  1. **Fuse philosophical accounts:** Etiological vs. causal-role functions answer different questions. This procedure makes the conflict explicit but can’t resolve it.  
  2. **Handle ecosystem "functions" like traits:** They’re fundamentally different. Ecosystems lack goals; roles aren’t "selected." Use neutral language.  
  3. **Replace expert judgment:** Steps 3 (selection evidence) and ecosystem stability involve ⚠️**judgment calls**. When evidence is divided, *show the debate*.  
  4. **Fix "we don't know":** If both tests fail, write a clear "we don’t know" (e.g., "Scientists are testing how X works"). Don’t hedge; state uncertainty plainly.  

  ---  
  **Final note:** When writers say "function," always ask: **"Do you mean what it does now, or why it evolved?"** If they can’t answer, default to cautious causal language ("helps," "is used for"). For ecosystems, never use "function." Say "role," "effect," or "contribution."
