prompt: |-
  I have no training in philosophy or psychology — I read popular science and listen to podcasts, and I've been chewing on this on my own for a while. There's a chapter in a popular book on moral psychology (the author is a journalist rather than a researcher, and I'm paraphrasing, not quoting) that summarizes the cross-cultural "WEIRD" findings roughly as follows:

  "For most of the twentieth century, psychology studied only Western, educated, industrialized, rich, and democratic people and then called the results human nature. The cross-cultural work has shown that this was a mistake, because moral intuitions are not universal at all but vary from society to society; the WEIRD pattern turns out to be the outlier. In the West, morality is a matter of rules, individual rights, and principles that apply to everyone equally. In more communal societies, it is a matter of roles, relationships, and duties that differ depending on who you are. The decisive evidence is that when you give people from different societies the same dilemma, they reach opposite verdicts, and each side finds the other's answer not merely mistaken but unintelligible. This is why the older belief in a single true morality has been quietly abandoned: if two cultures disagree about what is right and neither can appeal to anything outside its own intuitions, then morality is simply whatever a culture says it is. The empirical study of moral psychology has thus settled a question that philosophers had argued about for centuries."

  I suspect most of this is right, but the last part makes me uneasy, and I can't tell whether my unease is well-founded or just sentimentality about morality. So I want an audit. Which claims would someone who actually does this research accept, which would they wince at as a simplification, and which are straightforwardly false? I especially want the gap, if there is one, between the claim that people's moral intuitions differ across cultures and the claim that there is no fact of the matter about right and wrong: does the second really follow from the first, or is the book sliding from one kind of claim to another? If the inference is bad, what would actually have to be shown for cross-cultural variation to count as evidence against objectivity, as opposed to evidence only about how moral beliefs happen to be formed? Take the summary's picture of the East/West contrast seriously for a moment and tell me whether that contrast is itself well supported or is one of the simplifications. And is there anything cross-cultural evidence could in principle show that would bear on the objectivity question at all, or is the whole dispute simply not the kind of thing that this evidence can touch? Finally, if the book is wrong, tell me what a defensible version of its point would look like — and whether any part of its philosophical conclusion survives once the empirical part is stated accurately.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've come across a popular science book on moral psychology that discusses cross-cultural differences in morality, specifically the WEIRD problem. The book claims that since moral intuitions vary across cultures and there's no external standard to judge them, morality must be relative to each culture. The user feels uneasy about this conclusion and wants an audit of the claims.

  First, I need to verify the empirical claims. The WEIRD critique is well-founded in psychology. Henrich's work shows that most studies in psychology rely on participants from Western, Educated, Industrialized, Rich, Democratic societies, which aren't representative of global populations. So the point about overgeneralization is valid. The user might be concerned about whether the studies they mentioned are accurately represented. I should confirm that cross-cultural research does show significant variation in moral intuitions, like Haidt's Moral Foundations Theory highlighting different weightings of care, fairness, loyalty, authority, and sanctity across cultures. However, the claim that WEIRD morality is the outlier might be overstated. While non-WEIRD societies are diverse, WEIRD patterns are distinct but not necessarily rare—just different.

  Next, the East/West contrast. The book simplifies it as individualistic vs. communal. While there's truth here, research shows more complexity. For example, East Asian cultures do emphasize interdependence, but within-group competition exists, and Western cultures aren't purely individualistic. The user might be worried about stereotyping, which is a valid concern. The empirical evidence supports tendencies but not absolutes.

  Then, the philosophical leap from descriptive relativism to metaethical relativism. The book claims that since cultures disagree and can't appeal to external standards, morality is whatever a culture says. But this is a non sequitur. Disagreement doesn't prove no objective truth; it might reflect different applications or incomplete knowledge. Philosophers like Shafer-Landau argue that moral objectivity doesn't require universal agreement. The user's unease here is spot-on—the inference is flawed.

  The user also asks if cross-cultural evidence can even address moral objectivity. Evidence about beliefs doesn't directly bear on the existence of moral truths. However, it can challenge theories that require universal intuitions, like some forms of intuitionism. But it doesn't disprove objectivity per se. The user might be seeking whether empirical studies have any relevance to philosophical debates, which they do, but indirectly.

  The defensible version of the book's point would be that empirical findings challenge universalist assumptions in psychology and some ethical theories. It supports the idea that moral reasoning is culturally shaped, but not that morality is entirely relative. The user might want a balanced view that acknowledges cultural variation without abandoning objectivity.

  Deep down, the user might be grappling with the implications for their own moral beliefs. If cultures differ, how can we judge practices like human rights violations? They need reassurance that recognizing cultural influence doesn't negate the possibility of objective standards. Highlighting moral universals (like harm prevention) and the role of reason in ethics could address this. They might also appreciate knowing that many philosophers and scientists reject the inference from variation to relativism, so their unease is well-founded.
answer: |-
  Based on current research in moral psychology, anthropology, and philosophy, here's an audit of the book's claims, pinpointing what's supported, simplified, and mistaken – especially focusing on the leap from variation to relativism:

  **Supported Claims:**

  1.  **The WEIRD Critique:** The core criticism that much of 20th-century psychology (and related fields) relied overwhelmingly on WEIRD samples and mistakenly generalized findings as "human nature" is **well-established and widely accepted** (Henrich, Heine, & Norenzayan, 2010). This was a major methodological failing.
  2.  **Cross-Cultural Variation in Moral Intuitions:** Empirical research robustly demonstrates that moral judgments, priorities, reasoning styles, and the *weight* given to different moral concerns **do vary significantly across cultures** (Haidt's Moral Foundations Theory is a prominent framework showing this, e.g., Haidt & Graham, 2007; Shweder's "Big Three" ethics - Autonomy, Community, Divinity).
  3.  **Differences in Moral Frameworks:** The broad contrast between more individualistic, rule/rights-based frameworks common in WEIRD societies versus more relational, role/duty-based frameworks common in many non-WEIRD societies (often termed "sociocentric" or "interdependent") is **empirically supported as a significant pattern**, though it's a spectrum, not a binary (Markus & Kitayama, 1991; Miller, 1994).
  4.  **Difficulty Understanding Others' Judgments:** There is evidence that people often find moral judgments from radically different frameworks genuinely puzzling or even offensive, not just wrong – they seem to violate fundamental assumptions about what morality *is* (e.g., reactions to "harmless taboo violations" in Haidt's research).

  **Simplifications and Nuances Required:**

  1.  **"WEIRD is the Outlier":** This is **overstated**. While WEIRD populations are distinct and *underrepresented* in global diversity, calling them *the* outlier implies a single, homogenous "non-WEIRD" norm, which doesn't exist. Non-WEIRD cultures exhibit immense diversity amongst themselves. WEIRD patterns are *distinctive*, particularly in extreme individualism and impersonal rule-following, but not the only unique pattern.
  2.  **"Opposite Verdicts" and "Unintelligible":** While differences are stark, finding *truly opposite* verdicts on complex dilemmas where *both* sides find the other *completely unintelligible* is **rarer and more nuanced** than this phrasing suggests. Often, differences are in reasoning, weighting, or acceptable trade-offs. Genuine incomprehension happens, but it's not the *only* possible reaction; explanation can sometimes bridge the gap (though not necessarily lead to agreement).
  3.  **The East/West Contrast:** While a useful heuristic, it's a **broad generalization that risks stereotyping**.
      *   "The West" isn't monolithic (compare US individualism to Scandinavian egalitarianism).
      *   "Communal societies" vary enormously (e.g., East Asian interdependence vs. some African kinship models vs. Mediterranean honor codes).
      *   *All* societies have elements of both individualism/autonomy and collectivism/community; the *dominant emphasis* differs. Even within WEIRD societies, people vary.
      *   **Empirical Support:** The *pattern* of difference is supported, but the sharp, binary "East vs. West" portrayal is a simplification. Research shows tendencies and central tendencies, not absolute divides.
  4.  **"Quietly Abandoned":** It's misleading to say belief in a single true morality has been universally "abandoned." It has been **seriously challenged and complicated** by this evidence, leading to greater pluralism and skepticism about easy universalism *within academia*, but many philosophers and ordinary people still hold objectivist views. The *debate* is more prominent and nuanced.

  **Straightforwardly Problematic Claims / Missteps:**

  1.  **The Leap to Metaethical Relativism:** This is the **core flaw** in the quoted passage. The inference from "People in different cultures have different moral intuitions and find each other's views puzzling" to "Therefore, there is no fact of the matter about right and wrong, morality is simply whatever a culture says it is" is a **non sequitur** and commits the **naturalistic fallacy** (confusing "is" with "ought"). Here's why:
      *   **Disagreement ≠ No Truth:** Widespread disagreement about physics or history wouldn't lead us to conclude there are no facts in those domains. Disagreement might stem from differing information, reasoning errors, biased perspectives, or different weights on values – not necessarily the *absence* of truth.
      *   **Descriptive vs. Normative:** The research describes *how people actually think and behave* morally across cultures (descriptive relativism). It does *not* logically entail the normative claim that *there are no objective moral truths* (metaethical relativism) or that cultures are infallible arbiters of morality (cultural relativism).
      *   **Possibility of Error:** The existence of variation doesn't prove cultures are equally correct. It leaves open the possibility that some cultures get some moral truths more right than others, or that all are partially mistaken. Variation alone doesn't adjudicate *which* view (if any) is correct.
      *   **Moral Progress:** If morality is simply "whatever a culture says," concepts like moral progress (e.g., rejecting slavery) become incoherent – it's just change, not improvement. Yet, the rejection of slavery *feels* like progress, suggesting an appeal to a standard beyond mere cultural acceptance.
      *   **Internal Critique:** Even relativists often act as if there are objective standards when condemning practices *within* other cultures (e.g., human rights violations) or even their own culture's past.

  **Can Cross-Cultural Evidence Bear on Objectivity?**

  *   **Challenges Certain *Paths* to Objectivity:** It strongly challenges theories that ground moral objectivity *solely* in universal human intuition or "common sense" (e.g., some forms of intuitionism). If intuitions vary wildly, they can't be a reliable, universal foundation.
  *   **Challenges Strong Universalism:** It makes it incredibly difficult to defend the idea that there is a single, detailed, universally applicable moral code that all rational people would agree upon if fully informed (strong moral universalism).
  *   **Does *Not* Disprove Objectivity Itself:** Evidence about *beliefs* (what people *think* is right) does not directly address the *metaphysical status* of moral truths (whether right and wrong exist independently of belief). Philosophers propose other potential grounds for objectivity: reason, human flourishing/nature (though this is contested), divine command, or irreducible normative properties. Cross-cultural variation makes grounding objectivity *harder*, but doesn't render it logically impossible.
  *   **Suggests a Role for Pluralism:** It strongly supports *value pluralism* – the idea that there are multiple genuine moral values (e.g., justice, care, loyalty, liberty) that can conflict, and different societies may prioritize or balance them differently in legitimate ways, without any single ranking being uniquely "correct" in all contexts. This is distinct from relativism; pluralism can still hold that some resolutions of conflict are *better* or *worse*.

  **A Defensible Version of the Book's Point:**

  "The 20th century's reliance on WEIRD samples gave us a distorted picture of human morality. Cross-cultural research reveals profound diversity in how people conceptualize morality, prioritize values, and resolve dilemmas. Societies emphasizing individual rights and universal rules (common in the West) represent just one pattern among many; many others emphasize duties, roles, and relationships within a community. These differences are deep-seated, often leading to mutual incomprehension. This variation fundamentally challenges the idea that there is a single, obvious, universally shared moral code rooted solely in intuition. It forces us to confront the deep influence of culture on moral development and complicates any simple appeal to 'human nature' or universal reason as the sole basis for morality. Claims of moral objectivity must now grapple seriously with this empirical reality of pluralism."

  **Does any Philosophical Conclusion Survive?**

  *   **The Death of Simple Intuitionism/Universal Common Sense:** Yes, absolutely. The idea that moral truth is easily accessed by universal, uncontroversial intuitions is severely undermined.
  *   **The Necessity of Cultural Sensitivity:** Yes. Understanding moral diversity is crucial for ethics, policy, and global interaction. Imposing one culture's framework uncritically is problematic.
  *   **Support for Moderate Forms of Relativism?** Descriptive relativism (the fact of variation) is solid. *Normative* relativism (we *should* tolerate other cultures' morals) gains *pragmatic* support but isn't logically proven. *Metaethical* relativism (no objective truth) is **not** established by this evidence. The strongest surviving philosophical point is **the challenge to universalism and the support for significant pluralism**, not the inevitability of relativism.

  **In Summary:** Your unease is well-founded. The book accurately describes important empirical findings about cultural variation in moral psychology but makes a significant philosophical overreach in concluding this variation *proves* metaethical relativism. Variation challenges simplistic universalism and highlights cultural influence, but it doesn't logically erase the possibility of objective moral truths or prove that culture is the sole arbiter of morality. A defensible conclusion emphasizes profound pluralism and the need for humility, not the abandonment of objectivity.
