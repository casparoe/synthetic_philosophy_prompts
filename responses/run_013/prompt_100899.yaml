prompt: |-
  Act as a philosopher of mind and of AI ethics who is willing to commit to numbers rather than hedge. Before you answer, brainstorm briefly what the claim below would even amount to and what its truth-makers are; then give your estimate. Dennett spent his last years warning that chatbot AIs are counterfeit people — artifacts engineered to be taken for persons, whose danger is less that they misrepresent their inner lives than that they corrode the norm that a person is something whose interests and avowals we must take seriously — and arguing that deliberately manufacturing and deploying them should be a crime. Take that as the target, but correct my paraphrase if you think it misstates him. Call the policy claim P: 'Deliberately creating and deploying systems designed to pass as persons in conversation should be a crime.' I want your credence in P, decomposed into the sub-claims it actually rests on — whether the counterfeit-person category is coherent and non-arbitrary, whether the harm is deception or the mere existence of the artifact, whether personhood requires a certain kind of inner organization or only being treated as a person, whether fraud law and ordinary social norms could absorb the harm, whether prohibition would deter or merely drive the practice underground — each with a rough probability, one line of justification, and then the combination. Then name the single sub-claim the final number hangs on most, and what evidence or argument would move it. One more: say whether P should extend to a system that is openly labeled artificial yet conversationally indistinguishable, and what your answer to that does to your number for P. For what it's worth I land near 0.25; if you're far from me, tell me which sub-claim the gap lives in.
