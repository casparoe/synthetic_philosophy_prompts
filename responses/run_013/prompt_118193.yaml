  I've got into a running argument with my officemate and it's turned into something I actually want to write up, so I'm applying for our department's one-semester writing grant and need a short proposal. Here's the half-formed idea. He does forecasting on the side and insists the common prior assumption is pure bookkeeping — you can always get it back by building a bigger state space that folds in everyone's priors, so it can't be a real assumption about the world. My gut says thats too quick: if you restore it that way, the common prior stops saying anything about why two people disagree, and then the no-trade and agreement results don't explain why we shouldn't be trading, they just describe a relabeled space where the disagreement got moved somewhere else. So the question I want to nail down: is the common prior a substantive hypothesis about the world (shared information, shared experience), a normalization that's true by construction, or a claim about what counts as the same game — and can we decide that on grounds other than which reading makes the no-trade results look good? Give me the proposal: the question stated so it has a determinate answer, why the usual positions don't settle it, what I'd actually do month by month (I think the crux is a careful account of what enriching the state space preserves and what it quietly throws away), what a result would look like and what would count as the project failing, and a scope that's realistic for one semester. No citations, I'll fill those in myself.
