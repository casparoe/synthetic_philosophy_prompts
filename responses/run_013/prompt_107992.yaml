prompt: |-
  I run the patient-reported-outcomes group at a mid-sized contract research organization. We write and adapt questionnaires about subjective symptoms — chronic pain, tinnitus, fatigue, depersonalization, the strange sense of presence patients report during virtual-reality exposure therapy — and our scores end up as endpoints in trials that regulators and payers later treat as evidence that a treatment works. The failure mode that keeps me up is not a clumsily worded item. It is an item that measures nothing except the respondent's willingness to endorse a sentence, and a scale that is reliable, sensitive to change, and empty. We admit or reject several items a week, and every admitted item is signed off by our clinical lead and by the patient advisory board.

  I would like a decision procedure for admitting an item, and then a whole scale, grounded in Wittgenstein's private language argument — the actual moves in it, not the slogan that a private language is impossible. Write it as an ordered sequence of questions my item writers can run in fifteen minutes per item with no philosophy in their backgrounds: the questions in order, what counts as a sufficient answer to each, where the sequence terminates in a refusal, and where it hands the decision to a person because the remaining question is a value judgment or a matter for the advisory board rather than something the argument settles. Keep the distinctions the argument genuinely turns on, and say which ones I can afford to drop for usability's sake. Mark explicitly where the argument, taken seriously, cuts against standard psychometric practice — in particular against the assumption that the respondent's own report of their inner state is the benchmark the item is validated against — and where you are adding a house rule of your own rather than drawing one from the argument.

  Then run it on three cases: (a) a single-item zero-to-ten loudness rating for tinnitus, where no one but the respondent can check the number; (b) a caregiver-completed observational scale for pain in advanced dementia, where the sufferer cannot report at all; (c) an item we have used for years and are attached to, phrased roughly as an invitation to describe a quality of experience that only the respondent could identify, which I expect your procedure to reject. For each, give the verdict, the step that decides it, and the objections a good psychometrician would raise against that verdict.

  Close by saying what the procedure cannot do: the questions it is silent on, the verdicts it will get wrong, and the cases where it will merely reproduce whatever the surrounding clinical culture already believes. No citations or reading list — I won't check them, and the argument is the part I care about. State how confident you are in the procedure and in your reading of the argument, and single out the one step you are least sure of.
reasoning: |-
  Hmm, this is a fascinating and challenging request. The user leads a patient-reported outcomes group and wants a practical decision procedure grounded in Wittgenstein's private language argument to evaluate questionnaire items. They're clearly frustrated with "empty" scales that measure compliance rather than genuine symptoms, and want something their team can use in 15 minutes without philosophy training.

  First, I need to extract the core of Wittgenstein's argument. The key is that meaning comes from public verification - a "private sensation" only becomes meaningful when anchored to observable behaviors or shared criteria. For PRO development, this means an item must connect internal states to something intersubjectively checkable. The user specifically wants to avoid the slogan and focus on actual argument moves.

  The decision procedure should be a step-by-step checklist. I'll structure it as questions moving from linguistic function to operational grounding. Critical distinctions to preserve: 
  - Public criteria vs private reference 
  - Behavioral anchors vs pure introspection 
  - Verifiability through action 

  But I can collapse some nuances for usability, like not diving into "rule-following" complexities. The big deviation from standard psychometrics will be rejecting items where patient report is the only validator - Wittgenstein would call that circular.

  For the cases: 
  (a) Tinnitus loudness rating: Probably passes if framed behaviorally (e.g., "loud enough to mask conversation") but fails if purely subjective. 
  (b) Dementia pain scale: Should pass easily since it's observational by nature. 
  (c) The problematic item about indescribable qualities: Will fail at Step 3 when it can't connect to public criteria.

  The procedure's limits: It won't catch poorly worded items, ensure sensitivity, or override clinical relevance. It's strongest at filtering out "ghost measures" but will reflect cultural blind spots. My confidence is highest in Steps 2-3 (the public criteria core), shakiest on Step 1's "ordinary language" test since symptom language isn't always ordinary.

  User seems highly sophisticated - they name-drop depersonalization and VR presence effects. Their unspoken need might be defending against regulatory skepticism of subjective endpoints. I'll emphasize where this protects against empty metrics without dismissing patient experience.
answer: |-
  Below is a **15-minute decision procedure** for item admission, distilled from Wittgenstein's private language argument (focusing on §§243-315 of *Philosophical Investigations*). It prioritizes **public verifiability** of meaning over private introspection. Steps are sequential—failure at any step rejects the item unless marked otherwise.

  ---

  ### **The Decision Procedure**
  1. **"Could this sentence be taught to a child for use in daily life? How?"**  
     *Sufficient answer*: Describe a concrete scenario (e.g., pointing to behaviors, contexts, or objects).  
     *Failure*: Reliance solely on "inner feeling" with no external reference.  
     *Stop here if failed*.

  2. **"What public action or circumstance would make someone call this sentence true or false?"**  
     *Sufficient answer*: Specific, observable criteria (e.g., "avoids loud places," "stops mid-sentence").  
     *Failure*: Only "the person feels it’s true" or "no one else can know."  
     *Stop here if failed*.

  3. **"If two people endorsed this item, how could we check they mean the same thing?"**  
     *Sufficient answer*: Shared behavioral anchors (e.g., "both wince when moving").  
     *Failure*: No intersubjective test possible.  
     *Stop here if failed*.

  4. **"Does this item’s meaning depend entirely on the respondent’s private judgment?"**  
     *If yes*: Reject (Wittgenstein’s core objection: private rules are vacuous).  
     *If no*: Proceed.  
     *House rule*: Overrules psychometric "face validity" if private judgment is primary.

  5. **"Would the meaning change if the respondent couldn’t speak/think in words?"**  
     *Sufficient answer*: "No, because we could still observe ______."  
     *Failure*: Meaning collapses without verbal report.  
     *Handoff*: If failed but clinically vital, escalate to advisory board for value judgment.

  ---

  ### **Key Deviations from Standard Practice**
  - **Rejects "private benchmark" validation**: Patient introspection isn’t the gold standard if it lacks public correlates (vs. psychometrics’ reliance on self-report as criterion).  
  - **Demands behavioral anchors**: Meaning must be tied to shared practices, not just statistical reliability.  
  - **Step 4 is non-negotiable**: Items measuring "private rules" (e.g., purely internal scales) fail even if reliable/sensitive.

  ---

  ### **Case Applications**
  **(a) Tinnitus loudness rating: "Rate your tinnitus loudness from 0 (none) to 10 (extremely loud)."**  
  - *Step 1*: Passes ("loudness" is teachable via real sounds).  
  - *Step 2*: **Fails**. No public action verifies "internal loudness" (e.g., two people rating "8" may react differently to noise).  
  - *Verdict*: **Reject** at Step 2.  
  - *Psychometric objection*: "Self-report is primary in tinnitus; statistical reliability validates it."  
  - *Wittgensteinian reply*: Reliability ≠ meaning. A scale can be consistent but empty (like measuring "soul weight").  

  **(b) Caregiver pain scale for dementia: "Patient grimaces when touched."**  
  - *Step 1*: Passes (teachable via facial expressions).  
  - *Step 2*: Passes (grimace is publicly observable).  
  - *Step 3*: Passes (multiple caregivers can agree on grimacing).  
  - *Verdict*: **Admit**.  
  - *Psychometric objection*: "Lacks patient perspective!"  
  - *Reply*: Wittgenstein allows third-person criteria when first-person reports are impossible. Public behavior anchors meaning.  

  **(c) Problematic legacy item: "Describe the unique quality of your depersonalization."**  
  - *Step 1*: Fails. "Unique quality" can’t be taught via public criteria.  
  - *Step 2*: Fails. No action verifies the "quality" (only the person "knows").  
  - *Verdict*: **Reject** at Step 1.  
  - *Psychometric objection*: "This captures idiosyncratic experiences!"  
  - *Reply*: Idiosyncrasy without shared criteria is linguistically inert. It measures endorsement, not a symptom.

  ---

  ### **What the Procedure Cannot Do**  
  1. **Silent on**: Wording clarity, cultural bias, scale sensitivity, or clinical importance.  
  2. **Gets wrong**:  
     - Somatic symptoms with weak behavioral links (e.g., "internal itchiness").  
     - Culturally specific expressions (e.g., "heartache" in some contexts).  
  3. **Reinforces culture**: Clinical assumptions about "obvious" behaviors (e.g., "frowning = pain") will bias Steps 1–3.  
  4. **Value judgments**: Defers to advisory boards when an item fails Step 5 but has urgent clinical utility (e.g., end-of-life distress).  

  ---

  ### **Confidence Assessment**  
  - **Overall confidence**: 85%. The procedure rigorously filters "ghost items" by enforcing public criteria.  
  - **Reading of Wittgenstein**: 90% (core emphasis: meaning requires public verification).  
  - **Least sure step**: **Step 4**. Distinguishing "private judgment" from "reporting a sensation with public criteria" is nuanced (e.g., "pain" has public anchors; "sacredness" may not). In practice, borderline cases need clinical input.  

  **Final note**: This won’t eliminate all empty scales, but it forces items to *point beyond themselves* to the shared world. Use it to supplement psychometrics, not replace it.
