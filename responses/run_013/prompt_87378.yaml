     Similarly, P1(C|A)=0, and P1(C|¬A)= P1(C)/P1(¬A) = (35/130) / (74/130) = 35/74
     So: P2(C) = 0*0.6 + (35/74)*0.4 = 35/74 * 2/5 = 70/370 = 7/37 ≈ 0.1892

