          P1(¬A) = 1 - P1(A) = 1 - 28/65 = 37/65
          P1(B) = 0.3 = 3/10 = 39/130, but we have P1(B)=0.3 and P1(A)=28/65=56/130, P1(C)=7/26=35/130, so P1(¬A)= (39/130+35/130) = 74/130 = 37/65.

          Therefore: P1(B | ¬A) = (39/130) / (74/130) = 39/74

     So: P2(B) = P1(B|A)*0.6 + P1(B|¬A)*0.4 = 0*0.6 + (39/74)*0.4 = 39/74 * 2/5 = 78/370 = 39/185 ≈ 0.2108

