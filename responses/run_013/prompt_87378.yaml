  Step 2: Update on {A, ¬A} with P2(A)=0.6, P2(¬A)=0.4.

  We use:
     P2(X) = P1(X | A) * P2(A) + P1(X | ¬A) * P2(¬A)

  For state A:
     P2(A) = P1(A|A) * 0.6 + P1(A|¬A) * 0.4 = 1*0.6 + 0*0.4 = 0.6

  For state B:
     Note: B is disjoint from A, so P1(B|A)=0.
     P1(B | ¬A) = P1(B) / P1(¬A) = 0.3 / (1 - 0.4308) = 0.3 / 0.5692 ≈ 0.527 (but let's compute exactly)

