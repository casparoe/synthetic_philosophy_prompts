  Comparison:

  The two sequential Jeffrey updates give different results depending on the order. The virtual evidence update gives a third result.

  Now, what does this show?

  1. The sequential Jeffrey updates are order-dependent. This is because the second update in each case is applied to a distribution that has already been changed by the first update. The rigidity condition for the second update is applied to the intermediate distribution, which is different in the two orders. Therefore, the two orders do not commute.

  2. The virtual evidence update, by contrast, models both pieces of evidence simultaneously as conditionally independent given the state. This avoids the order dependence because both pieces of evidence are incorporated at once.

  Which one is correct? They are answers to different questions.

  - The sequential Jeffrey updates model a situation where the agent first receives one piece of evidence that directly affects her degrees of belief about {A, ¬A}, and then later receives another piece of evidence that directly affects her degrees of belief about {B, ¬B}. The rigidity condition requires that the conditional probabilities given the elements of the partition at the time of the update remain unchanged. But note that after the first update, the conditional probabilities given B and ¬B have changed (because the probabilities of the states have changed). Therefore, the two orders are different experiences: in one order the agent first learns about A and then about B, and in the other order the reverse.

  - The virtual evidence update models the two pieces of evidence as simultaneous (or conditionally independent) observations. The agent conditions on both at once. This is a different scenario.

  So the three numbers are not directly comparable because they represent different belief revision scenarios.

  But note: the question is whether the two accounts are rivals and which one is correct. It turns out that every Jeffrey shift can be modeled as virtual evidence (i.e., as conditioning on an auxiliary variable). In fact, we can always extend the probability space to include a variable that, when conditioned on, produces the Jeffrey shift. Therefore, the likelihood-ratio treatment is more general in the sense that it can model any Jeffrey shift. However, when we have multiple Jeffrey shifts, the sequential application in the Jeffrey framework may not correspond to conditioning on multiple pieces of virtual evidence simultaneously because the rigidity conditions might not be compatible.

  In this case, the two Jeffrey shifts are on partitions that are not nested and that cut across each other. The rigidity condition for the second update in each order is applied to the distribution that results from the first update. But if we were to model both Jeffrey shifts as virtual evidence, we would require a joint model of the two auxiliary variables and their relation to the state. The virtual evidence treatment we did assumed conditional independence of the two readings given the state, which may or may not be the case in the sequential Jeffrey updates.

  In fact, in the sequential Jeffrey updates, the two pieces of evidence are not assumed to be conditionally independent. The first update changes the distribution, and then the second update is applied. There is no joint model of the two pieces of evidence. Therefore, the sequential Jeffrey updates are not equivalent to conditioning on both pieces of virtual evidence at once.

  What if the two single-observation targets are jointly unsatisfiable? For example, suppose we had a case where the update for A alone would set P(A)=0.6, and the update for B alone would set P(B)=0.5, but note that if the prior of A is 0.4 and B is 0.35, then 0.6+0.5=1.1>1, so they cannot both be true at the same time. In the sequential Jeffrey update, the first update will change the probability of B, so the second update might still be possible. However, the targets for the partitions are set independently. The Jeffrey update for the second partition might require the new probabilities for the partition to be consistent with the current distribution. In the example we did, they were consistent. But if after the first update the probability of B is, say, 0.2 and we want to set it to 0.5, that is fine. However, if we have a constraint that the states are mutually exclusive and exhaustive, then the Jeffrey update on {B, ¬B} must set P(B) to a value in [0,1] and P(¬B) to 1-P(B), and that is always possible.

  The issue of unsatisfiable targets might arise if we try to set the probabilities for a partition that is not the whole space and then the new probabilities are not consistent with the constraints of the space (e.g., if we try to set P(B) to 0.5 when the current probability of ¬B is less than 0.5). But that is not a problem because the Jeffrey update formula does not require the new partition probabilities to be consistent with the current distribution: it simply applies the reweighting. However, if the new probability for an event is set to a value that is impossible (e.g., negative or greater than 1) then the update would be undefined. But in our case, the updates are within [0,1].

  The key distinction between the accounts is:

  - Jeffrey conditionalization is a rule for updating when the agent's degrees of belief on a partition are set to new values. It assumes that the only change is in the probabilities of the partition, and the conditional probabilities given the partition elements remain fixed. This is appropriate when the evidence directly affects the agent's belief in the partition.

  - The virtual evidence account models the evidence as an observation that is generated by the state via a known channel. It then updates by conditioning on the observation. This is appropriate when the agent receives a noisy measurement.

  The two accounts are not rivals in the sense that one can be embedded in the other: any Jeffrey shift can be represented as virtual evidence. However, when we have multiple Jeffrey shifts, the sequential application may not be equivalent to a single virtual evidence update that incorporates both pieces of evidence simultaneously under conditional independence.

  In the case of multiple updates, the virtual evidence treatment requires a joint model of the evidence, while the Jeffrey framework does not: it only specifies how to update step by step. Therefore, the Jeffrey framework does not specify how to combine multiple pieces of evidence that affect different partitions unless we specify an order.

  So the three numbers we computed are all correct for the scenarios they model:

  - (i) and (ii) are correct for the two orders of sequential Jeffrey updates.
  - (iii) is correct for the virtual evidence update with the two readings conditionally independent given the state.

  None of them is the single correct answer. The agent's doxastic state depends on the order of evidence reception in the Jeffrey framework, but not in the virtual evidence framework when the evidence is simultaneous.

  The choice between the accounts depends on the underlying model of the evidence.

  Finally, what survives when we strip away the optional commitments? The core of the Jeffrey shift is the rigidity condition: the conditional probabilities given the partition elements are unchanged. The core of the virtual evidence is the likelihood ratio. But the virtual evidence account requires a model of the evidence-generation process, while the Jeffrey shift does not.

  If we want a unique answer, we must have a model that specifies how the evidence is generated and whether the two pieces are conditionally independent. Without that, we are left with the order dependence in the sequential Jeffrey updates.
