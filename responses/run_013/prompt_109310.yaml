  ### Decision Tree for the Harbour Pilot's Dilemma

  This instrument uses 8 concrete questions (nodes) derived from your four episodes to classify a reader's position. Questions are framed in narrative terms, avoiding philosophical jargon. The tree has 8 leaves (positions), with one "unclassified" catch-all for inconsistent answers. 

  **Instructions:**  
  Answer each question based on your instinct about what the harbour pilot *should* do, not what you think is "correct." Proceed down the tree in order.

  ---

  #### The Questions (Nodes):  
  1. **In Episode A (stranger vs. strangers):**  
     If the pilot saves the one, do you feel they must later justify *why* they didn’t save the five?  
     - **Yes** → Go to Q2  
     - **No** → Go to Q3  

  2. **In Episode A:**  
     Could the pilot have saved the one *without* it feeling like a betrayal of the five?  
     - **Yes** → Go to Q7  
     - **No** → **Position: *Unnamed (Obligation to the Many)***  

  3. **In Episode B (stranger vs. family):**  
     Does the family bond of the five make their rescue *more urgent* than if they were strangers?  
     - **Yes** → Go to Q4  
     - **No** → Go to Q5  

  4. **In Episode C (at-fault vs. blameless):**  
     Should the pilot let a lottery or machine decide who to save?  
     - **Yes** → **Position: *Procedural Fairness***  
     - **No** → **Position: *Partialist (Family First)***  

  5. **In Episode C:**  
     If the pilot saves the five blameless people, is it *because* the one caused the wreck?  
     - **Yes** → **Position: *Fault-Forfeits-Claim***  
     - **No** → Go to Q6  

  6. **In Episode D (child vs. elderly):**  
     Should the child’s potential long life *sway* the pilot more than saving five lives?  
     - **Yes** → **Position: *Life-Span Utilitarianism***  
     - **No** → **Position: *Simple Utilitarianism***  

  7. **In Episode D:**  
     Does saving the five elderly feel like a *waste* because they’ll die soon anyway?  
     - **Yes** → **Position: *Unnamed (Life-Stake Priority)***  
     - **No** → Go to Q8  

  8. **After Episode A:**  
     If the pilot saves the five, must they apologize to the one’s ghost or family?  
     - **Yes** → **Position: *Reparations Owed***  
     - **No** → **Position: *Permissible Solo Rescue***  

  ---

  ### The Positions (Leaves):  
  1. **Simple Utilitarianism**  
     - *Description:* Always save the greater number. Five lives outweigh one, regardless of context.  
     - *Most Awkward Commitment:* In Ep. D, saving five frail elderly over a child with a full life ahead.  

  2. **Life-Span Utilitarianism**  
     - *Description:* Maximize total life-years saved. The child in Ep. D trumps the elderly.  
     - *Most Awkward Commitment:* Ignoring bonds or fault if life-years dominate (e.g., Ep. B’s family becomes irrelevant).  

  3. **Fault-Forfeits-Claim**  
     - *Description:* Blame erodes a person’s right to rescue. Save the blameless five in Ep. C.  
     - *Most Awkward Commitment:* In Ep. A (no fault), this position defaults to saving the five but can’t explain *why* numbers matter.  

  4. **Procedural Fairness**  
     - *Description:* When claims feel equal (e.g., Ep. C’s blame creates imbalance), fairness demands a lottery.  
     - *Most Awkward Commitment:* In Ep. A (no lottery option), the pilot must arbitrarily choose, violating fairness.  

  5. **Partialist (Family First)**  
     - *Description:* Relationships create stronger duties. Save the family in Ep. B, regardless of numbers.  
     - *Most Awkward Commitment:* In Ep. A (all strangers), this position lacks a clear principle for choosing.  

  6. **Permissible Solo Rescue**  
     - *Description:* Numbers don’t compel. Saving one (e.g., the child in Ep. D) needs no justification.  
     - *Most Awkward Commitment:* Permits saving the at-faulter in Ep. C if the pilot feels like it.  

  7. **Reparations Owed**  
     - *Description:* Saving the many leaves a debt to the abandoned one (e.g., Ep. A requires atonement).  
     - *Most Awkward Commitment:* Implies every rescue with casualties creates lifelong guilt.  

  8. **Unnamed (Life-Stake Priority)**  
     - *Description:* What matters is the *stake* in living (e.g., the child’s potential). Ignores raw numbers.  
     - *Most Awkward Commitment:* In Ep. A, saving one stranger over five equally "staked" lives.  

  9. **Unnamed (Obligation to the Many)**  
     - *Description:* Saving the one in Ep. A is only permissible if it doesn’t feel like *discarding* the five.  
     - *Most Awkward Commitment:* Fails to guide Ep. D (child vs. elderly) — is "stake" or "number" primary?  

  ---

  ### Design Notes:  
  - **Unclassified Combinations (Empty Spaces):**  
    - *Saving the one in Ep. A without justification (Q1=No) + Prioritizing family in Ep. B (Q3=Yes) + Rejecting lottery in Ep. C (Q4=No):* **Incoherent.** Family bonds create a "reason" to save the five, but saving the one in A has no justification.  
    - *Believing the pilot owes reparations after Ep. A (Q8=Yes) + Denying the family’s urgency in Ep. B (Q3=No):* **Repellent/Unheld.** Why owe reparations to a stranger in A but ignore a family’s moral weight in B?  
    - *Endorsing a lottery in Ep. C (Q4=Yes) + Rejecting life-span in Ep. D (Q6=No):* **Coherent but Rare.** Few hold that blame requires a lottery but life potential doesn’t.  

  - **Indistinguishable Leaves:**  
    The tree cannot separate *Life-Span Utilitarianism* (Leaf 2) from *Life-Stake Priority* (Leaf 7) in **Ep. D** — both save the child. But they diverge in **Ep. A**: the former saves the five; the latter could save the one.  

  - **Why This Works for Your Novel:**  
    - Tests character consistency by forcing answers to *concrete choices* (e.g., "Does the family bond *change* the urgency?" not "Do relationships matter?").  
    - Flags contradictions (e.g., a character who rejects reparations but feels the family’s loss is "heavier").  
    - Names positions only *after* answers lock the reader into commitments.  

  This tree isolates 8 distinct stances from your episodes, exposes their tensions, and leaves room for the "unclassifiable" character who defies categorization. Use it to audit your principals by running their choices through the nodes.
