  I'm a software engineer with no formal philosophy background, and I keep running into the claim that maximizing expected utility is the only coherent way to want things — the pitch being that if your preferences don't obey the standard axioms, someone can pump money out of you, and that shows you're being irrational. Can you walk me through that arguement properly, and then tell me where the soft spots are? Two things bug me. First, the money pump seems to need me to actually go along with the trades. Suppose my preferences cycle — I prefer A to B, B to C, and C to A — but I've noticed this and just adopted a blanket rule of never trading anything. Have I escaped the argument, or does it just mean my real preferences were over whole trajectories or decision policies all along, rather than over individual options? Second, the axiom that says you can compare any two options at all: if I honestly think some pairs are just incomparable for me, is there a pump that gets me anyway, or does the argument quietly assume comparability instead of earning it? And underneath both of those: even granting that some weird preference pattern lets someone take my money, why does that make the pattern irrational, rather than just unprofitable? Please be upfront about which parts of this are actually settled and which are live disagreements among people who know the field — don't hand me the textbook version as if everyone signs off on it.
