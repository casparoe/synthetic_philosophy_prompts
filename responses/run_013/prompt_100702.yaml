  Based on your ethics prof's track record, I've reverse-engineered her rule for comparing universes with infinitely many people. The key insight is that she uses **expected welfare under a uniform prior** (or equivalently, the limiting average welfare) to rank universes. This rule assumes that all people have equal probability of being "you" in a veil-of-ignorance framework, and it evaluates universes based on the long-run average welfare as the population size goes to infinity, provided this average is well-defined.

  ### Summary of the Rule
  - **Core Principle**: The value of a universe is determined by the expected welfare if you were randomly assigned to be any person in that universe with equal probability. For infinite populations, this is equivalent to the limiting average welfare as the population size increases.
  - **Why It Fits All Cases**:
    - **A vs. B**: Universe B has higher expected welfare (5 vs. 1), so it's better.
    - **C vs. D**: Adding one person at the same welfare doesn't change the expected welfare (both are 1), so they're equal.
    - **E vs. F**: Universe F has lower expected welfare (0, from 50% at +1 and 50% at -1) compared to E (1), so F is worse.
    - **G vs. H**: Universe H has higher expected welfare (1.5, from 50% at +1 and 50% at +2) compared to G (1), so H is better.
  - **Assumptions**: 
    - Populations are countable and infinite (e.g., like the natural numbers).
    - Welfare levels are bounded and not pathologically distributed (so the average converges or can be meaningfully defined).
    - "Equally large" infinite groups (as in F and H) are treated as having equal measure (e.g., 50% probability each), implying a symmetric or balanced ordering.

  ### Application to Universe J
  - **Universe J**: Infinitely many people at +1, and one person at -1,000,000.
  - **Plain +1 Universe**: All at +1, with expected welfare of 1.
  - **Analysis under the Rule**: 
    - The expected welfare in J is calculated as follows: with probability 1, you are one of the infinitely many at +1 (welfare 1), and with probability 0, you are the person at -1,000,000 (since a single person has measure zero in an infinite set). Thus, the expected welfare is 1.
    - Equivalently, the limiting average welfare: for a population of size \(n\) (including the negative person), the average is \(\frac{(n-1) \cdot 1 + (-1,000,000)}{n} = 1 - \frac{1,000,000}{n} - \frac{1}{n}\), which approaches 1 as \(n \to \infty\).
    - Therefore, J has the same expected welfare as the plain +1 universe (both are 1), so they are **exactly equally good**.
  - **Prediction for Her Ruling**: She will say J is exactly as good as the plain +1 universe. The single negative person has negligible impact because their welfare is "drowned out" by the infinite positives, similar to how adding one person at +1 in D didn't change C.

  ### Why I Bet She's Using This Rule
  - **Fit with Track Record**: This rule perfectly explains all four prior rulings without contradictions. It handles finite additions (like D) and infinite additions (like F and H) consistently by focusing on the limiting behavior.
  - **Theoretical Justification**: Expected welfare under a uniform prior is a standard approach in ethics for impartial comparisons (e.g., inspired by Harsanyi's utilitarianism or veil-of-ignorance reasoning). It avoids issues with infinite sums by relying on averages or expectations, which your prof seems to prioritize.
  - **Why Not Alternatives?**:
    - **Total Welfare**: Fails because sums diverge to infinity in all cases, making comparisons impossible (e.g., A and B both have infinite total welfare).
    - **Infimum/Supremum Welfare**: Fails for H vs. G (both have infimum 1, but H is better) and doesn't handle distributions well.
    - **Pareto Principles**: Don't cleanly apply to populations of different sizes or with added groups.
    - "Any Negative Welfare Makes It Worse" Rule: Would make J worse, but it doesn't fit H vs. G (no negative in H) and is inconsistent with the insignificance of finite additions in C vs. D.
  - **Practicality**: It's intuitive for infinite populations—only changes in the "density" of welfare levels matter (e.g., positive measure groups affect the average, while measure-zero outliers don't).

  ### A Test Case to Separate Surviving Rules
  Since the expected welfare rule is the only one that fits all cases cleanly, no separation is needed—but if you're considering variants (e.g., where ordering affects the average), propose this:

  - **Universe P**: Infinitely many people at welfare +1, and infinitely many at welfare -1, but ordered such that the sequence is +1, +1, -1, +1, +1, -1, ... (i.e., two +1s for every -1 in a repeating pattern).
  - **Compare to Universe E** (all at +1) and **Universe F** (50/50 split of +1 and -1, with balanced ordering).

  **Why this separates rules?**
  - Under expected welfare/uniform prior, the welfare distribution has a density: 2/3 at +1 and 1/3 at -1, so expected welfare is \((2/3)(1) + (1/3)(-1) = 1/3\). Thus, P is better than F (expected welfare 0) but worse than E (expected welfare 1).
  - If her rule assumes a specific ordering (e.g., always balanced), she should rule consistently with the density. But if she has a different rule (e.g., based on the worst-off in every prefix), she might say P is worse than E but better than F only if the pattern "matters"—but this would contradict the symmetry in her F ruling.
  - **Expected Ruling**: She'll likely say P is worse than E but better than F, confirming the density-based expected welfare approach. If she doesn't, it might reveal an assumption about ordering, but based on her track record, she'll probably compute the average directly.

  This test case clarifies that it's the proportion (measure) of welfare levels that matters, not the ordering, as long as the limit exists. For J, this reinforces that a single outlier doesn't change the density. Good luck with your meeting!
