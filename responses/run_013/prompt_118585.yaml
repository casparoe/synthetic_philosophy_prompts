answer: |-
  Below is a decision tree designed to navigate from an archaeological find to a position on inferring past minds (behavior, norms, beliefs, or meaning). It avoids leading with -isms by using questions grounded in the *process* of inference, forcing users to confront their assumptions about evidence, justification, and vulnerability. The tree has 7 nodes (within your 6–9 range), each phrased as a question answerable without prior knowledge of archaeological theory. Leaves are named positions with a one-sentence "awkward commitment" (a key drawback or assumption). Unoccupied combinations are noted with a diagnosis (incoherent, unattractive, or unexplored), and inseparable leaves are flagged. The tree handles both your cases: a bog hoard of unworn axes (ritual deposition) and a house floor with in-situ abandonment (everyday snapshot).

  ### Key Features
  - **Target Splits**: The tree explicitly separates inference into behavior (actions), norms (expectations/permissions), beliefs (understandings of the world), and meaning (symbolic significance), as per your requirement.
  - **Branch Nodes**: Each node asks about **what is being inferred**, **what justifies the inference**, or **how vulnerable it is to new evidence**.
  - **Leaves**: 6 named positions covering major theoretical stances. "Flat refusal" is included as a valid endpoint.
  - **Handling Cases**: The bog hoard tests inference for non-utilitarian deposits (pushing toward norms/beliefs/meaning), while the house floor tests behavioral/norm inference from routine contexts.
  - **Unoccupied Combinations**: Diagnosed as:
    - **Incoherent**: Logically contradictory or self-defending.
    - **Unattractive**: Theoretically possible but rejected by most archaeologists due to weaknesses.
    - **Unexplored**: Plausible but underdeveloped in the literature.
  - **Inseparable Leaves**: One pair is flagged where the tree cannot distinguish due to overlapping answers.

  ---

  ### Decision Tree
  Start at Node 1. Answer based on your archaeological find (e.g., bog hoard or house floor). Work downward.

  **Node 1: What does the find most directly reveal?**  
  *(Answers: Patterns of physical action, Patterns of repeated choices, Intentional break from practicality, Symbolic arrangement)*  
  - **A. Patterns of physical action** (e.g., house floor: objects left in use-positions; axes in bog: deposition act). *Go to Node 2.*  
  - **B. Patterns of repeated choices** (e.g., house floor: consistent object placements hinting at "rules"; bog hoard: recurring deposition in similar contexts). *Go to Node 3.*  
  - **C. Intentional break from practicality** (e.g., bog hoard: unworn axes imply non-utilitarian purpose; house floor only if abandonment seems ritualized). *Go to Node 4.*  
  - **D. Symbolic arrangement** (e.g., bog hoard: axes placed in a pattern; house floor only if objects form meaningful symbols). *Go to Node 4.*  

  **Node 2 (from A): For inferring behavior, what links objects to actions?**  
  *(Answers: Laws of material science, Cross-cultural human universals, Direct analogy, Object-driven process)*  
  - **A. Laws of material science or ecology** (e.g., taphonomy, use-wear patterns). *Go to Node 5.*  
  - **B. Cross-cultural human universals** (e.g., all humans use tools similarly). *Go to Node 6.*  
  - **C. Direct analogy to documented cases** (e.g., ethnography, experiments). *Go to Node 6.*  
  - **D. Object-driven process** (e.g., objects shape actions). *Go to Node 7.*  

  **Node 3 (from B): For inferring norms, what justifies seeing "rules" in patterns?**  
  *(Answers: Statistical regularity, Cultural analogy, Contextual fit, Cognitive universals)*  
  - **A. Statistical regularity across sites** (e.g., house floor layouts show standardization). *Go to Node 5.*  
  - **B. Cultural analogy to known societies** (e.g., similar object placements in ethnographic records). *Go to Node 6.*  
  - **C. Contextual fit of the whole assemblage** (e.g., how objects relate spatially). *Go to Node 7.*  
  - **D. Cognitive universals** (e.g., hardwired social norms). *Leaf: Cognitive archaeology.*  

  **Node 4 (from C or D): For beliefs/meaning, what allows the step beyond practicality?**  
  *(Answers: Biological cognition, Cultural analogy, Contextual resonance, Object agency)*  
  - **A. Biological cognition** (e.g., innate human symbolism). *Leaf: Cognitive archaeology.*  
  - **B. Cultural analogy** (e.g., similar ritual deposits elsewhere). *Leaf: Ethnographic analogy.*  
  - **C. Contextual resonance** (e.g., the find "feels" symbolic due to its setting). *Leaf: Contextual archaeology.*  
  - **D. Object agency** (e.g., axes "demand" deposition). *Leaf: Symmetry-minded approach.*  

  **Node 5 (from 2A or 3A): How vulnerable is this inference to new finds?**  
  *(Answers: Easily overturned, Rarely overturned)*  
  - **A. Easily overturned** (e.g., new data often disproves "laws"). *Leaf: Middle-range theory.*  
  - **B. Rarely overturned** (e.g., "laws" are robust). *Unoccupied. Diagnosis: Incoherent—laws in archaeology are probabilistic and inherently vulnerable; claiming otherwise ignores the discipline's uncertainty (unattractive to most).*  

  **Node 6 (from 2B, 2C, or 3B): How much can analogy be generalized?**  
  *(Answers: Specific to time/place, Broadly applicable)*  
  - **A. Specific to time/place** (e.g., only applicable to similar cultures). *Leaf: Ethnographic analogy.*  
  - **B. Broadly applicable** (e.g., analogies work across eras). *Leaf: Middle-range theory.*  

  **Node 7 (from 2D or 3C): Can objects themselves explain the find?**  
  *(Answers: Fully, Partially)*  
  - **A. Fully—objects drive outcomes** (e.g., axes "cause" hoarding; house objects "force" abandonment). *Leaf: Symmetry-minded approach.*  
  - **B. Partially—objects and humans interact** (e.g., objects influence but don't determine). *Leaf: Contextual archaeology.*  

  ---

  ### Leaves (Named Positions)
  Each leaf includes a one-sentence "awkward commitment" (a key assumption or drawback). Positions are reached by combining answers from the tree.

  1. **Middle-range theory** (e.g., Binford):  
     - *Reached via*: Node 5A (inference from laws, easily overturned) or Node 6B (broad analogy).  
     - *Focus*: Primarily behavior/norms. Uses general theories (e.g., ethnoarchaeology) to link material patterns to actions or rules.  
     - *Works for*: House floor (inferring activity patterns) or bog hoard (deposition as behavioral norm).  
     - **Awkward commitment**: Must assume cross-cultural "laws" of human behavior exist, which can erase historical contingency and reduce people to ecological actors.  

  2. **Ethnographic analogy** (e.g., Ascher, Wylie):  
     - *Reached via*: Node 4B (beliefs/meaning from analogy) or Node 6A (specific analogy).  
     - *Focus*: All targets. Uses controlled comparisons to ethnographic/historical cases to infer past minds.  
     - *Works for*: Bog hoard (e.g., analogize to ritual deposits) or house floor (e.g., analogize to household norms).  
     - **Awkward commitment**: Requires assuming past societies share fundamental similarities with present ones, risking anachronism or colonial projection.  

  3. **Contextual archaeology** (e.g., Hodder):  
     - *Reached via*: Node 4C (beliefs/meaning from context) or Node 7B (objects/humans interact).  
     - *Focus*: Norms, beliefs, meaning. Sees the find as already "meaning-laden" through its internal relationships (e.g., object arrangements).  
     - *Works for*: Bog hoard (e.g., axes arranged symbolically) or house floor (e.g., objects "speak" through their placement).  
     - **Awkward commitment**: Relies on the archaeologist's subjective interpretation of context, making it untestable and prone to presentist bias.  

  4. **Cognitive archaeology** (e.g., Renfrew, Mithen):  
     - *Reached via*: Node 3D (norms from universals) or Node 4A (beliefs/meaning from cognition).  
     - *Focus*: Beliefs and norms. Appeals to universal human cognition (e.g., neuropsychology) to infer mental states.  
     - *Works for*: Bog hoard (e.g., ritual as cognitive universal) but weak for house floor (unless linked to hardwired behaviors).  
     - **Awkward commitment**: Must assume cognition is static and universal across time/culture, ignoring how minds are shaped by context.  

  5. **Symmetry-minded approach** (e.g., Olsen, Latour):  
     - *Reached via*: Node 2D (behavior from objects) or Node 7A (objects drive outcomes).  
     - *Focus*: Behavior, norms, meaning. Treats objects as active agents (not just evidence) in human-object networks.  
     - *Works for*: Bog hoard (e.g., axes "demand" ritual deposition) or house floor (e.g., objects "coordinate" abandonment).  
     - **Awkward commitment**: Attributes agency to objects in ways that can obscure human intentionality and feel anthropomorphic.  

  6. **Flat refusal** (e.g., strict processualism or empiricist skepticism):  
     - *Reached via*: No path in tree (implicit in avoided branches). *Diagnosis: Unreachable as a leaf because the tree forces engagement—but if users reject inferences at multiple nodes (e.g., answer "this is unjustified" at Node 4 or avoid mental states in Node 1), they de facto land here.*  
     - *Focus*: Only observable behavior; rejects norms/beliefs/meaning as inaccessible.  
     - *Works for*: House floor (describe actions) but not bog hoard (fails to explain non-utilitarian acts).  
     - **Awkward commitment**: Limits archaeology to description, making the past "mindless" and ignoring why people do things (e.g., why deposit unused axes?).  

  ---

  ### Unoccupied Combinations & Inseparabilities
  - **Unoccupied: Inference from biological cognition for behavior** (e.g., Node 2B → no leaf).  
    - *Diagnosis*: Unexplored—cognitive archaeology focuses on beliefs, not actions; reducing behavior to biology is seen as reductionist and unattractive.  
  - **Unoccupied: Norms from object agency** (e.g., Node 3C → Node 7A).  
    - *Diagnosis*: Incoherent—norms are human-centric, so attributing them to objects alone conflates causes with contexts; symmetry-minded approaches handle this better by blending human/object roles.  
  - **Unoccupied: Beliefs from statistical regularity** (e.g., Node 1C → Node 3A → Node 5A/B).  
    - *Diagnosis*: Unattractive—beliefs are inherently mental, so inferring them from patterns alone feels reductive; most archaeologists use analogy or context instead.  
  - **Inseparable Leaves**: **Ethnographic analogy** and **Contextual archaeology** when inferring meaning from cultural analogy (Node 4B vs. 4C).  
    - *Why*: Both can answer similarly for symbolic finds (e.g., bog hoard). The tree cannot split them further without asking "Is analogy external or internal?"—but that would require theory-laden terms. *Flag*: In practice, analogy uses external sources, while context relies on internal patterns.

  ---

  ### Tree Validation with Your Cases
  - **Bog Hoard (unworn axes)**:  
    - Starts at Node 1C/D (break from practicality/symbolic).  
    - Paths to: Cognitive archaeology (Node 4A), Ethnographic analogy (Node 4B), Contextual archaeology (Node 4C), or Symmetry-minded (Node 4D).  
    - Tests belief/meaning inference. Flat refusal fails (can't explain non-use).  

  - **House Floor (in-situ abandonment)**:  
    - Starts at Node 1A (physical action) or 1B (repeated choices).  
    - Paths to: Middle-range theory (Nodes 2A→5A or 3A→5A), Ethnographic analogy (Node 3B→6A), or Symmetry-minded (Node 2D→7A).  
    - Tests behavior/norm inference. Contextual or cognitive leaves less likely (unless abandonment is ritualized).  

  This tree forces users to articulate *how* they bridge objects and minds, surfacing tensions (e.g., "Do objects have agency?") before labeling positions. Use it as a discussion scaffold—your reading group can debate answers and see where they land! If you need tweaks (e.g., more nodes for vulnerability), let me know.
