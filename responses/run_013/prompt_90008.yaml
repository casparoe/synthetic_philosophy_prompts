answer: |-
  Here are five exact requirements for any viable account of Hofstadter's message layering, derived from your cases:

  1.  **Must distinguish intentional signals from accidental patterns.**  
      *Case:* Random marks in sand that *could* be a message vs. deliberate symbols.  
      *Constraint:* Genuine — the frame must be detectable without assuming intent.

  2.  **Must accommodate undecodable outer messages.**  
      *Case:* The Phaistos Disk — its frame (physical artifact) signals a message exists, but the outer layer (symbols/code) remains unreadable, hiding the inner message.  
      *Constraint:* Genuine — the account must allow for the outer message's *presence* independent of successful decoding.

  3.  **Must separate the *structure* of the outer message from its *truth* or *effectiveness*.**  
      *Case:* A vinyl record mislabeled as "Mozart" containing static; the frame (record + label) and outer message (label's instruction: "play as audio") are present and parseable, even if deceptive or faulty, delivering a non-Mozart inner message.  
      *Constraint:* Genuine — meaning derivation depends on structure, not sender honesty or receiver success.

  4.  **Must explain meaning without requiring a conscious sender.**  
      *Case:* DNA — the frame (molecular structure) signals it's code, the outer message (codon mapping) is "read" by cellular machinery, and the inner message (protein instructions) has functional meaning, despite no intentional sender.  
      *Constraint:* Genuine — forces meaning to reside in the *interpretive context* or *functional role*, not sender intent. *Clash with Intentionalist Habit:* If a camp insists meaning *requires* a sender's conscious intent, **drop that camp's requirement**. The DNA case forces sender intent to be optional.

  5.  **Must allow the outer message to self-specify its decoding process.**  
      *Case:* A computer virus containing its own decoder instructions; the frame (executable file) signals processing, the outer message *is* (or contains) the decoder specification, enabling retrieval of the inner message (viral payload).  
      *Constraint:* Genuine — the outer layer must be capable of *bootstrapping* its own interpretation within the frame.
