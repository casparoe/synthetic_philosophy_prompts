prompt: |-
  Im working up an argument about where the meaning of a message actually lives, using Hofstadter's frame / outer / inner message thing from GEB: the frame is whatever tells you that this thing is meant to be decoded at all, the outer message tells you how to decode it, and the inner message is the content you were after. Before I write any of the argument I want the spec, i.e. what does any account of that layering have to deliver before it counts as any good? Give it to me as exactly five numbered items, a sentence or two each, no preamble and no wrap-up at the end. Each item should be one requirement plus the case that forces it -- think: marks in the sand that might just be marks, the Phaistos disk, a record with a misleading label, DNA where there's no sender who meant anything, a virus that ships its own decoder, a message that explains how to read itself. For each one say whether it's a genuine constraint or just a habit of one camp, and if two of the five can't both hold then say so in the item where the clash shows up and tell me which one you'd drop. Be decisive on that last part, I want a verdict, not a menu of options.
