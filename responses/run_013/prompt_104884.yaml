answer: |-
  The sentence "natural selection shaped our moral beliefs for their fitness, not for their truth" appears simple but bundles several distinct claims. Its power in evolutionary debunking arguments (EDAs) relies on conflating weaker, plausible premises with a stronger, contentious conclusion. Below, I separate these propositions, ordered from least to most controversial (analytic → empirical/metaphysical), assess their truth status, and identify what it would take to settle them. I then analyze how standard rejoinders engage the strongest reading and clarify the sentence's charitable interpretation.

  ### 1. **Minimal Empirical Claim: "Natural selection shaped our moral beliefs."**  
     - **Proposition:** Evolutionary processes causally influenced the development of human moral psychology.  
     - **Truth Status:** True (broadly accepted).  
     - **Settlement:** Overwhelming evidence from evolutionary biology, psychology, and anthropology (e.g., kin selection, reciprocal altruism).  
     - **Role in EDA:** Uncontested foundation; debunkers and non-debunkers agree on this.

  ### 2. **Fitness-Focus Claim: "Natural selection shaped our moral beliefs *for their fitness*."**  
     - **Proposition:** The primary selective pressure on moral beliefs was their contribution to survival/reproductive success (fitness), not their cognitive properties.  
     - **Truth Status:** Likely true, but nuanced.  
     - **Settlement:** Empirical—e.g., simulations showing fitness advantages of prosocial norms (e.g., cooperation). Does *not* imply fitness was the *only* factor.  
     - **Role in EDA:** Weak; compatible with truth-tracking (e.g., true beliefs might *be* fitness-enhancing).

  ### 3. **Non-Truth-Targeting Claim: "Natural selection did *not* shape our moral beliefs *for their truth*."**  
     - **Proposition:** Truth-aptness played no causal role in the selection of moral beliefs; selection was indifferent to whether beliefs tracked truth.  
     - **Truth Status:** Plausibly true, but empirical.  
     - **Settlement:** Evolutionary modeling (e.g., showing adaptive false beliefs can outcompete true ones). Compatible with truth being a *byproduct* (see rejoinders).  
     - **Role in EDA:** Still insufficient for debunking; requires adding that truth and fitness *diverge* in morality.

  ### 4. **Tracking Failure Claim: "Our moral beliefs do not reliably track moral truth."**  
     - **Proposition:** The evolutionary origins entail systematic unreliability—our moral beliefs are not sensitive to moral facts.  
     - **Truth Status:** Contentious (epistemically/metaphysically loaded).  
     - **Settlement:** Requires two disputed theses:  
       - (a) **Robust moral realism:** Moral truths exist mind-independently (e.g., objective "moral facts").  
       - (b) **Fitness-Truth Divergence:** Fitness-enhancing moral beliefs are largely *unrelated* to true moral beliefs.  
       Empirical evidence (e.g., cultural variation in morals) might support (b), but (a) is metaphysical.  
     - **Role in EDA:** Core premise for debunking. If true, it suggests our beliefs are arbitrary from a truth-oriented perspective.

  ### 5. **Epistemic Undercutting Claim: "We have no justification for trusting our moral beliefs."**  
     - **Proposition:** The evolutionary explanation defeats the justification for moral beliefs, rendering them unreliable or unjustified.  
     - **Truth Status:** Highly contentious (the debunker's conclusion).  
     - **Settlement:** Depends on resolving:  
       - Whether evolutionary origins *necessarily* undermine justification (e.g., does it break the connection between belief and truth?).  
       - Whether non-moral beliefs (e.g., logic) can avoid the same challenge.  
       Requires epistemic norms (e.g., "beliefs contingent on luck are unjustified").  
     - **Role in EDA:** The target conclusion—e.g., if evolution "aimed" at fitness, not truth, we cannot trust moral beliefs as knowledge.

  ---

  ### **The Strongest Reading and the Debunker's Conclusion**  
  The only reading strong enough to license the conclusion (that moral beliefs are unjustified) is **#5**, but it depends on **#4** and **#3**. Crucially, **#5 requires metaphysical and epistemic add-ons**:  
  - **Metaphysical:** Moral realism (truth exists independently of human evolution).  
  - **Epistemic:** A "sensitivity" condition (justified beliefs must be non-accidentally linked to truth; evolution breaks this link).  

  **Why #1–#4 alone fail:**  
  - #1–#3 are empirical but do not entail unreliability (#4) or undercut justification (#5).  
  - #4 is stronger but still contingent—e.g., if moral truths *aligned* with fitness, tracking could hold.

  ---

  ### **How Rejoinders Engage the Strongest Reading**  
  - **Companions-in-Guilt (e.g., logic/math):**  
    - **Targets #5:** If EDAs debunk morals, they should debunk logic/math (which evolution also shaped). But if we trust logic/math, EDAs overreach.  
    - **Engagement:** Strong against #5—it shows the argument proves too much. If the debunker exempts logic/math, they need an ad hoc distinction.  
  - **Byproduct Rejoinder (e.g., truth-tracking as side effect):**  
    - **Targets #4:** Even if selection "aims" at fitness, reliable truth-tracking might emerge (e.g., perception).  
    - **Engagement:** Moderately strong—it challenges the inference from #3 to #4. But for morals, it requires showing fitness *coincides* with truth (e.g., via moral naturalism).  
  - **Proves Too Much (e.g., debunks all evolved beliefs):**  
    - **Targets #5:** If evolution undermines morals, it should undermine all cognition (e.g., sensory perception). But we accept perception as reliable.  
    - **Engagement:** Strong against #5—it forces debunkers to explain why morals are uniquely vulnerable.  

  **Crucially, these rejoinders only work against the strong reading (#4–#5).** Against weaker readings (#1–#3), they are irrelevant: e.g., #1–#3 are compatible with the byproduct response.

  ---

  ### **Charitable vs. Collapsed Reading**  
  - **Most Charitable Reading in Debate:** **#4** (tracking failure).  
    - Why? It is the weakest claim that *directly supports* #5 when combined with realism and epistemic norms. Scholars like Sharon Street (e.g., "A Darwinian Dilemma," 2006) focus here: if moral realism is true, evolution likely distorts tracking.  
  - **What It Collapses Into When Repeated:** **#3** (non-truth-targeting).  
    - Why? In popular discourse, the sentence is often used as a rhetorical "gotcha," exploiting the slide from uncontested #1–#3 to the unsupported #5. People hear "evolution didn't care about truth" and assume this means moral beliefs *must* be unreliable—but this ignores the byproduct possibility or the realism assumption.  

  ### **Conclusion**  
  The sentence only "settles" the debunker's conclusion if interpreted as **#4–#5**, but these rely on contentious metaphysical/epistemic premises. Most rejoinders effectively target this strong reading by exposing overgeneralization or alternative explanations (e.g., byproducts). When used casually, the sentence collapses into the weaker #3, which—despite sounding damning—does not entail skepticism. To fully settle EDAs, one must engage the deeper debates: whether moral realism holds, whether evolution implies unreliability, and whether justification requires non-evolutionary grounds. The sentence alone does none of this work.  

  **Key Sources for Context:**  
  - Street, S. (2006): Argues #4–#5 given realism.  
  - Enoch, D. (2010): Defends realism against EDAs using "deliberative indispensability."  
  - Joyce, R. (2006): Links #4 to moral skepticism.  
  - Vavova, K. (2014): Analyzes epistemic undercutting (#5).
