  3. **The Tracking Failure Claim**: That our moral beliefs don't track moral truths at all. This is stronger and potentially debunking, but it requires the controversial assumption that fitness and truth come apart in morality.

  4. **The Epistemic Undercutting Claim**: That the evolutionary origin makes our beliefs unjustified. This is the debunker's goal, but it relies on additional premises about what justifies beliefs.

