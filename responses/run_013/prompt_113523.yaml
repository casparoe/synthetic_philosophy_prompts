  Hey — I'm in this upper-level epistemology seminar and we've just finished the unit on the regress problem. Our prof is making each of us write one question for the final, plus a model answer and a marking scheme, and then we peer-review each other's. Mine is due friday and I want it to actually be worth something.

  Here's my problem. Every question I draft can be answered by someone who's just memorized "foundationalism stops the chain in basic beliefs, coherentism loops it back, infinitism never stops it." I want to force them past that. What I want the question to be really about is whether the regress argument even has the right shape — all three views seem to assume that justification gets handed along a chain of beliefs, so the only live question is where the chain ends. But I keep wondering whether a vertical regress (B's being justified depends on A, in the order of justification) is even the same animal as a horizontal one (the chain of beliefs I happen to form over time), and I dont think the standard three views bother to separate those. Same with coherentism's "mutual support" — if A is supported by B and B by A, is that a genuine stopping point or just a very small circle, and is it a regress at all?

  So could you write the exam question for me, aimed at upper-level undergrads / MA students, something they'd answer in about 50 minutes? Then give me a model answer of roughly 650 words, and a marking scheme built around 5 must-hit points, the marks each is worth (total 20), and for each point a one-line note on the mistake that usually costs students the mark — stuff like just naming the three positions, or assuming every regress is automatically vicious, or treating vertical and horizontal dependence as interchangeable. Don't lean on any particular texts, we didn't have a set reading list, it's all lectures and handouts. Cheers.
