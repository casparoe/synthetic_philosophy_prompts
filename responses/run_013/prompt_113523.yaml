answer: |-
  Below is a comprehensive exam question designed to push students beyond rote memorization and into critical analysis of the regress problem's structure. The model answer explicitly challenges the "chain" metaphor, and the marking scheme prioritizes conceptual nuance over textbook summaries.

  ---

  ### **Exam Question**  
  **Time Allotted:** 50 minutes  
  **Word Guide:** 600–700 words  

  > **Critically evaluate the following claim: The regress problem of epistemic justification relies on an uncritical acceptance of *linear* justification chains, obscuring fundamental distinctions between *vertical* (structural) and *horizontal* (temporal) dependence relations. To what extent do foundationalism, coherentism, and infinitism fail to resolve this deeper ambiguity? In your response, address whether coherentist "mutual support" genuinely halts the regress or merely disguises its circularity.**  

  ---

  ### **Model Answer** (650 words)  
  The regress problem—how beliefs gain justification without infinite chains—is typically framed as a trilemma: foundationalism (basic beliefs halt regress), coherentism (beliefs mutually justify), or infinitism (chains continue infinitely). Yet this framing presupposes that justification *must* propagate linearly, like links in a chain. I argue this metaphor conflates two distinct regress types, undermining all three solutions.  

  **Vertical vs. Horizontal Regress**: A *vertical* regress concerns structural dependence: belief B’s justification *logically requires* support from A (e.g., "I see a cat" depends on "my vision is reliable"). A *horizontal* regress involves temporal/causal dependence: belief B is formed *because of* prior belief A (e.g., inferring "the cat is hungry" from "it meowed"). The trilemma treats both as identical chains, but they demand different solutions. Vertical justification is synchronic (about current warrant), while horizontal is diachronic (about belief formation). Conflating them makes the regress problem seem universally "vicious" when it may not be.  

  **Foundationalism’s Misstep** posits basic beliefs that halt vertical regress self-evidently (e.g., perceptual beliefs). But if basic beliefs lack *any* justificatory antecedents, they appear arbitrary unless contextualized horizontally (e.g., "I’ve reliably formed perceptual beliefs before"). Foundationalism thus covertly smuggles in horizontal elements to anchor vertical stops—exposing the conflation it relies on.  

  **Coherentism’s Circularity** replaces chains with networks: beliefs mutually justify (A supports B, B supports A). This *seems* to resolve vertical regress holistically, but it equivocates on "support." If A and B justify each other *structurally*, the circle is question-begging: no belief gains *independent* warrant. If support is horizontal (A causally reinforces B over time), coherence reduces to psychological consistency, not epistemic justification. Either way, coherentism disguises—but does not halt—the regress by shrinking the chain into a loop.  

  **Infinitism’s Avoidance** embraces endless chains as non-vicious. Yet it assumes vertical and horizontal regresses are equally benign. While diachronic chains *can* extend infinitely (e.g., ongoing scientific revision), synchronic justification cannot: at any moment, a belief requires *present* warrant. Infinitism thus conflates temporal processes with static justification needs.  

  **Is Mutual Support a Solution?** Coherentism’s "mutual support" only halts the regress if justification emerges holistically from the system. But this presupposes the system itself is justified—a higher-order regress lurks. If coherence is a property of *how* beliefs relate (e.g., logical consistency), it ignores whether the relations are truth-conducive (the "isolation objection"). If coherence includes horizontal elements (e.g., predictive success over time), it abandons pure structuralism. The "circle" is thus a regress in disguise: we now ask what justifies the coherence criterion.  

  **Conclusion**: The trilemma fails because it treats justification as a monolithic chain. Once we separate vertical (structural) from horizontal (temporal) dimensions, no "solution" fully resolves the regress without tacitly relying on the other dimension. Foundationalism uses horizontal processes to ground vertical stops; coherentism uses horizontal stability to mask vertical circularity; infinitism conflates endless horizontal chains with vertical adequacy. The deeper issue is not *where chains end*, but *whether linear propagation is essential to justification*. Alternative models (e.g., reliabilism, contextualism) reject the chain metaphor entirely—suggesting the regress problem may be an artifact of its own framing.  

  ---

  ### **Marking Scheme** (Total: 20 marks)  
  **Must-hit points** (Award marks only if addressed *explicitly*):  

  1. **Distinguishes vertical/horizontal regresses** (5 marks)  
     *Mistake costing marks:* Treating them as interchangeable or failing to define them (e.g., "Vertical is logical, horizontal is temporal").  
     
  2. **Critiques foundationalism’s reliance on horizontal elements** (4 marks)  
     *Mistake:* Merely stating "basic beliefs stop the regress" without showing how they depend on temporal processes (e.g., past reliability).  

  3. **Exposes coherentism’s equivocation on mutual support** (4 marks)  
     *Mistake:* Calling the circle "non-vicious" without analyzing whether it masks structural circularity or borrows from horizontal justification.  

  4. **Identifies infinitism’s conflation of synchronic/diachronic chains** (3 marks)  
     *Mistake:* Claiming "infinitism allows endless chains" without distinguishing justification-at-a-time from justification-over-time.  

  5. **Assesses if coherentism halts regress or disguises it** (4 marks)  
     *Mistake:* Asserting mutual support "solves" the regress without addressing the higher-order justification of coherence itself (e.g., isolation objection).  

  **Deductions**:  
  - −2 if only naming the three positions without critical analysis.  
  - −3 if assuming all regresses are automatically vicious.  
  - −1 per over-reliance on lecture jargon without explanation (e.g., "vicious regress" undefined).  

  ---

  ### **Why This Works**  
  - **Forces engagement with ambiguity**: Students can’t score highly without dissecting vertical/horizontal distinctions.  
  - **Targets memorization traps**: Simply defining foundationalism/coherentism/infinitism earns minimal credit (see deductions).  
  - **Prioritizes critical analysis**: 15/20 marks require evaluating the theories’ failures or conceptual tensions.  
  - **Peer-review ready**: Clear, measurable criteria for graders.  

  Let me know if you’d like a condensed version or adjustments for emphasis! Good luck with Friday.
