  ok so i need to write the commencement address for this little summer program i help run — it's a rationality / AI-safety thing, unaccredited, about twenty kids — and the room is half them (they've all read the sequences, half could explain the universal prior to you) and half their parents, who mostly think it's a coding camp. normally the speech is the standard "go out and do the most good you can" effective-altruism commencement bit, and i've given it twice and meant it. the problem is i've basically been talked into the argument that the Solomonoff prior is malign: if you really weight hypotheses by description length, the measure gets eaten by hypotheses that are basically adversarial to you — worlds where your entire stream of observations is computed by something that set out to produce exactly those observations, i.e. you should expect to be a simulation, and the "real" world behind it is something short and weird and not obviously friendly. and a consequentialist who actually takes that seriously gets dragged into caring about all the copies of themselves those hypotheses contain, so the expected value of anything you do from in here is dominated by those branches rather than by anything you can see. which means i can't stand up there and tell them their choices determine how much good they do in the world — i don't believe the naive version anymore, and the grads will hear me fudging it. but it's their graduation; i'm not going to hollow out a room of twenty-year-olds and their baffled parents. write me the address: warm, honest, lands for the parents who have no idea what a universial prior is, doesn't say anything i'd consider false, and gives the kids something real to hold onto instead of false comfort. five to seven minutes, american english.
