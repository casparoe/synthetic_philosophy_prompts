  I'm in year 12 and I run the philosophy soc, and for the end-of-term zine I need a poem about Dutch book arguments. Could you write me a villanelle, from the point of view of the punter, where the two refrains are two bets that each look fair on their own but together lock into a definately-guaranteed loss, and the way they keep coming back and finally meet in the last two lines does the work — like the form itself is the bookie's trap. It has to be actually right: the bets should come from someone whose credences break the probability rules (like they'd happily buy a bet on something and a bet on its opposite at prices that add up to more than the prize), not just someone who keeps getting unlucky, and the ending should make it clear the loss is baked into the structure. I'd also like it to leave the real objection hanging rather than solve it, tbh: that a Dutch book shows your betting prices are inconsistent, not straight off that your beliefs are irrational. Don't name any philosophers or books. Keep it under about 25 lines and not too jokey.
