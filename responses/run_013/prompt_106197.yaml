  Below is a decision tree designed to clarify positions on workplace monitoring software privacy disputes. It uses **8 branch nodes** (questions) starting with the core control/access/context split and distinct/reducible value split, as requested. Each branch node is a concrete question that can be answered without knowing the resulting position. The tree routes through all specified distinctions and places the 5 cases at relevant leaves.  

  ### Decision Tree  
  **Start**: Q1. Does privacy require *preventing access* to personal information (e.g., locking data away), *granting control* to the subject (e.g., letting them decide flows), or *following context rules* (e.g., using data only as expected)?  
  - **Access prevention** → Q2A  
  - **Subject control** → Q2B  
  - **Context rules** → Q2C  

  **Q2A (Access)**: If information becomes accessible without consent but causes no harm (e.g., harmless secrets exposed), is privacy still violated?  
  - **Yes, access alone violates** → Q3A  
  - **No, only harm matters** → Q3B  

  **Q2B (Control)**: Can privacy be fully achieved if institutions give subjects "control" (e.g., checkboxes) but design choices nudge them to share?  
  - **Yes, formal control suffices** → Q4A  
  - **No, control must be meaningful** → Q4B  

  **Q2C (Context)**: Is a use of data acceptable if it follows context norms, even if norms are outdated/unjust (e.g., 1950s workplace expectations)?  
  - **Yes, norms define privacy** → Q5A  
  - **No, norms can be flawed** → Q5B  

  **Q3A (Access + Harm irrelevant)**: Can privacy be waived by the subject?  
  - **Yes, consent removes violation** → *Position: **Access Absolutism*** (Hardest: Waiving privacy doesn't restore inherent dignity loss)  
  - **No, access always violates** → *Position: **Inalienable Seclusion*** (Hardest: Privacy breaches are wrong even if consensual)  
  *Cases*:  
  - Medical records released after death → **Access Absolutism** (if consent given pre-death) or **Inalienable Seclusion** (if no consent).  

  **Q3B (Access + Harm matters)**: Is privacy a single right or a cluster of protections?  
  - **Single right** → *Position: **Instrumental Access*** (Hardest: Privacy collapses if security/autonomy explain all value)  
  - **Cluster** → *Position: **Bundled Shields*** (Hardest: "Privacy" lacks core definition; it’s ad-hoc protections)  
  *Cases*:  
  - Genealogy database ID via relative → **Instrumental Access** (violates if it enables stalking; else fine).  

  **Q4A (Control + Formal suffices)**: Is privacy valuable in itself?  
  - **Yes** → *Position: ***Autonomy Intrinsicism*** (Hardest: Control matters even if no other goods are served)  
  - **No** → *Position: ***Consent Instrumentalism*** (Hardest: If control doesn’t improve security/dignity, it’s pointless)  
  *Cases*:  
  - Smart speaker keeping audio until wake word → **Consent Instrumentalism** (acceptable with user opt-in).  

  **Q4B (Control + Meaningful required)**: Can groups (e.g., teams, families) hold privacy rights?  
  - **Yes** → *Position: ***Relational Control*** (Hardest: Groups’ rights may override individual consent)  
  - **No** → *Position: ***Individual Sovereignty*** (Hardest: Unavoidable if an individual consents against group interests)  
  *Cases*:  
  - Loyalty program infers pregnancy → **Relational Control** (violates family privacy; individual consent insufficient).  

  **Q5A (Context + Norms define)**: Does privacy come in degrees?  
  - **Yes** → *Position: ***Normative Degrees*** (Hardest: "More/less private" lacks clear thresholds)  
  - **No** → *Position: ***Contextual Threshold*** (Hardest: Small norm deviations are total violations)  
  *Cases*:  
  - Employer wellness app shares aggregated data → **Normative Degrees** (acceptable if norms permit anonymized sharing).  

  **Q5B (Context + Norms criticizable)**: Is privacy grounded in the subject’s interests or their consent?  
  - **Interests** → *Position: ***Contextual Integrity+*** (Hardest: Experts/society may override subject’s consent)  
  - **Consent** → *Position: ***Voluntary Contexualism*** (Hardest: Consent legitimizes any flow, even if norms protest)  
  *Cases*:  
  - Wellness app data → **Contextual Integrity+** (violates if insurer uses data against employee interests, even with consent).  

  ---

  ### Unoccupied Combinations & Gaps  
  1. **Q3A (Access + Harm irrelevant) → "No, access always violates" + Single/Cluster distinction**:  
     - *Gap*: No position claims access *always* violates privacy *and* treats it as a cluster.  
     - *Reason*: **Incoherent**—if access is absolutely wrong, it can’t be a loose cluster.  

  2. **Q4B (Control + Meaningful) → "No, groups can’t hold privacy" + Contextual splits**:  
     - *Gap*: No position combines individual-only privacy with context rules.  
     - *Reason*: **Unexplored**—contextual norms often imply group dynamics.  

  3. **Q5A (Context + Norms define) → "No, threshold" + Reducible value**:  
     - *Gap*: No position holds privacy is threshold-based *and* only instrumentally valuable.  
     - *Reason*: **Unattractive**—thresholds imply intrinsic boundaries; instrumentalism needs flexibility.  

  ### Inseparable Positions  
  - **"Access" + "Value in itself" + "Single right"** (Leaf: **Access Absolutism**) and **"Access" + "Value in itself" + "Cluster"**: Cannot be separated—if access is inherently valuable, splitting it into a cluster undermines its absoluteness.  
  - **"Control" + "Formal suffices" + "Interests grounding"**: Cannot be separated—if control is merely formal, grounding privacy in interests (not consent) creates contradictions.  

  ### Design Notes  
  - **Cases placement**: Cases are placed at leaves where the position would most clearly judge them (e.g., pregnancy inference violates **Relational Control** due to group impact).  
  - **Early splits**: Control/access/context and value/reducible do the heavy lifting (Q1 and Q2 variants).  
  - **Leaf count**: 8 named positions + 2 unnamed gaps = 10 leaves (within complexity target).  

