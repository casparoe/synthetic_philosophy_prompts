prompt: |-
  I teach ethics, so I'm allowed to be an amatuer about causation and historiography, but I've been reading my way through the Cold War origins literature for fun (orthodox, revisionist, post-revisionist, the whole train set) and there's a move I keep running into that I don't have a word for.

  Here's the shape of it. A historian wants to tell you that the question of who started the Cold War is the wrong question. The outcome was overdetermined, both sides were caught in a secruity dilemma, it was a collision of two systems, nobody started it in the sense the question assumes. Fine, I believe it about half the time. But then two chapters later the same book asks, quite comfortably, whose decision it was to do some particular thing, and answers without hesitation: his. Agency gets switched back on the moment the actor is on the other side. And you get the mirror image from the other camp, where American moves are explained structurally (the bomb, the open door, the security dilemma) and Soviet moves are explained by ideology and one paranoid man's temperament. I get the same feeling from the 1914 literature, though I know it less well. The part that really bugs me is that each of these explanations is individually pretty good. Nobody is lying, and if you read either chapter on its own you'd never catch it.

  Is there a name for this? I don't mean just 'bias' — that's the lazy answer and it carves nothing, because the move isn't an error in any single application, and I don't think it's the old cause-versus-condition distinction either. The closest I can get on my own is that whether you're allowed to say someone caused something seems to depend on what you're implicitly comparing it to: caused it as opposed to what? And so which side comes out looking guilty is fixed by which comparison you set up, and the comparison looks like it can be set up after the fact, defended by a levels-of-explanation argument — structure here, agency there.

  So: does that have a name, or a family of nearby names, and if the honest answer is that there isn't one, coin me one and tell me where its edges are. I want the boundaries, not the label. What separates the guilty version from a legitimate one? Presumably the shift is fine when the two cases really do differ in the evidence, or really do sit at different scales — so what distinguishes that from the shift that's doing ideological work? And how is this different from plain special pleading, from the actor/observer stuff in social psychology, and from whataboutism (which I take to be a different animal, since whataboutism changes the subject whereas this one keeps the subject and turns the dial)?

  And don't hand me a reading list, I'm not going to chase down six articles — I want the concept itself, plus the near misses and why they don't quite fit.
reasoning: |-
  Okay, the user teaches ethics and is diving into Cold War historiography for fun. They've noticed a pattern where historians dismiss the "who started it" question by saying the Cold War was overdetermined, but then later assign agency to the other side for specific events. They want to know if there's a name for this move and how to distinguish legitimate uses from biased ones.

  First, I need to unpack their observation. They mention historians switch between structural explanations (like security dilemmas) for their own side and agency-focused ones (like individual decisions) for the opposing side. The user feels this isn't just simple bias but a more nuanced methodological inconsistency. They want to identify this concept and its boundaries.

  Looking at existing terms... confirmation bias comes to mind, but that's too broad. Actor-observer asymmetry in psychology explains attributing others' actions to disposition but not the structural-agency shift in historiography. Presentism might apply if historians judge past actions by modern standards, but the user's issue is about explanatory levels, not moral judgment. 

  Special pleading is when someone makes an exception without justification. That's closer. The historians here aren't making explicit exceptions; they're using different levels of explanation without acknowledging the shift. The key is the unstated switching between agency and structure depending on whose actions are being analyzed. 

  The concept of "explanatory double standard" fits. It's a form of special pleading where the standards for assigning causality change based on the actor. The boundaries: legitimacy depends on whether the shift is justified by evidence or scale. If the archives show Stalin micromanaged a decision but FDR responded to bureaucratic pressures, that's valid. But if similar evidence exists for both sides but only one gets agency-focused explanation, that's biased.

  Also, scale matters. A decision to send a telegram might need agency, while systemic tensions require structure. The problem arises when historians don't signal these scale shifts or apply them inconsistently. The user needs to check if the historian explicitly justifies the explanatory level or if it's arbitrarily applied to favor one side. Transparency about methodology is key to distinguishing legitimate use from bias.
answer: |-
  You've hit upon a deeply ingrained methodological inconsistency in historical explanation that **lacks a single universally accepted name**, but can be precisely described and bounded. The core move is:

  **Explanatory Asymmetry via Selective Level-Shifting (or "Causal Dial Switching")**

  **The Core Concept:**

  It's the **unacknowledged, inconsistent application of explanatory frameworks (agency vs. structure) across different actors within the *same* historical narrative, driven by implicit normative commitments rather than empirical necessity or consistent methodological principle.** The historian implicitly reserves *agency* (intentional, decision-driven causation) for the "blameworthy" side when analyzing specific actions, while applying *structural* explanations (systemic pressures, impersonal forces, overdetermination) to absolve or contextualize the "favored" side, *even when discussing equivalent levels of action or decision-making*.

  **Why Existing Terms Don't Quite Fit (The Near Misses):**

  1.  **Bias (Too Broad):** Yes, it's biased, but it's a *specific type* of bias manifesting in *how causation is attributed* across different actors within a structural/agentic framework.
  2.  **Actor-Observer Asymmetry (Psychological, Not Methodological):** While related (attributing others' actions to disposition, our own to situation), this is a cognitive bias in *perception*. Your historians are making *scholarly arguments* applying different *historical methodologies* inconsistently. It's a professional version, but the mechanism differs.
  3.  **Special Pleading (Close, but Misses the Framing Shift):** Special pleading is making an exception to a rule without justification. Here, the "rule" (whether to use structure or agency) isn't explicitly stated, and the shift isn't framed *as* an exception. It's presented as the natural explanatory mode *for that actor/action*, obscuring the inconsistency with the overall framing (e.g., "overdetermined conflict").
  4.  **Presentism (Judging the Past by Present Standards):** This can be a *driver* (implicitly judging one side more harshly), but it's not the *mechanism* of the explanatory shift itself.
  5.  **Whataboutism (Deflection, Not Inconsistent Framing):** Correctly identified as different. Whataboutism changes the subject ("What about X bad thing you did?"). This keeps the subject (explaining the Cold War/actions) but changes the *explanatory tool* based on who is acting.
  6.  **Levels-of-Analysis Problem:** This acknowledges that explanations exist at different scales (individual, state, system). The *problem* arises when historians *shift levels inconsistently* for different actors within the *same* analytical scale (e.g., explaining two leaders' decisions differently when both are ostensibly at the "individual agency" level) *without justification*, or use the *concept* of levels to mask bias ("Oh, I'm just looking at the system level *now*... but conveniently only when discussing *my* side's actions").

  **Boundaries: Distinguishing Legitimate Shifts from Guilty Ones**

  The shift isn't inherently illegitimate. The key is **transparency, justification, and consistency of application relative to the evidence and analytical question.** Here's where the boundaries lie:

  1.  **Evidence-Driven vs. Actor-Driven:**
      *   **Legitimate:** The historian explicitly argues that *for this specific decision/action*, the evidence strongly points to overwhelming structural constraints limiting genuine choice for Actor A (e.g., domestic political pressure, economic collapse), while for Actor B, the evidence shows a wider range of options and a clear, ideologically-driven choice was made. This requires *demonstrating* the difference in evidence.
      *   **Guilty:** Actor A *always* gets the structural treatment, Actor B *always* gets the agency treatment, regardless of the specific context or evidence for the particular action being analyzed. The assignment is predetermined by the historian's sympathies.

  2.  **Scale Consistency:**
      *   **Legitimate:** The historian is deliberately analyzing phenomena at different scales. E.g., Discussing the *overall outbreak* of the Cold War structurally (systemic clash), then zooming in to analyze a *specific crisis* (e.g., Berlin Blockade) where agency (e.g., Stalin's calculation) is demonstrably crucial, *and then applying the same agential lens* to the other side's actions *in that same crisis* (e.g., Truman's decision to airlift). The shift is acknowledged and appropriate to the question.
      *   **Guilty:** Analyzing *equivalent actions* at the *same scale* (e.g., two decisions to deploy troops/military aid in 1947) using agency for one and structure for the other *without justification*. Or, invoking structure for "their" general behavior while using agency for "our" specific actions, and vice-versa, creating a double standard.

  3.  **Methodological Transparency:**
      *   **Legitimate:** The historian states their methodological approach: "This chapter focuses on systemic pressures," or "Here, I examine the role of individual decision-making based on new archival findings." The chosen frame is applied consistently *within its defined scope*.
      *   **Guilty:** The historian *rhetorically dismisses* agency/attribution at the macro level ("It was inevitable! No one 'started' it!") but then *implicitly relies on attributing specific blameworthy agency* to the "other side" in micro-level analyses *without reconciling this shift*. The dismissal of the "who started it" question feels like a setup to avoid attributing agency to the favored side, freeing it up to be applied only to the disfavored one.

  4.  **Normative Load vs. Explanatory Power:**
      *   **Legitimate:** The explanatory shift genuinely provides *more* insight into the specific event/decision being analyzed. The structure/agency choice illuminates the *how* and *why*.
      *   **Guilty:** The primary function of the shift appears to be *normative* – to assign blame or absolve responsibility. The chosen explanation feels like it *serves* the judgment rather than arising from a dispassionate analysis of causes. The "good" side is swept along by forces; the "bad" side makes willful, culpable choices.

  **The Essence of the Problem:**

  It's the **unmarked, unjustified transition** between explanatory modes applied to different actors within the same narrative framework. The historian leverages the *validity* of both structural and agential explanations in isolation, but deploys them asymmetrically based on an implicit "side-taking," undermining their own initial claim that simplistic agency/blame is the wrong question. They reject the *macro* blame game only to reintroduce a *micro* blame game using an inconsistent methodology. The inconsistency is the tell.

  **What to Call It (If You Must Coin):**

  *   **Asymmetric Causal Attribution (ACA):** Highlights the inconsistent assignment of cause (agency vs. structure).
  *   **The Dialectical Dodge:** Plays on the misuse of "dialectical" thinking and the "dodge" of consistent responsibility.
  *   **Motivated Level-Shifting:** Emphasizes the underlying bias driving the inconsistent methodological choice.
  *   **The Blame-Shielding Frameshift:** More polemical, but captures the core function.

  **Your Instinct is Correct:** The key boundary is the **unjustified and unacknowledged nature of the shift** relative to the evidence, scale, and methodological framing. Look for the *pattern* across the narrative and ask: *Is the choice of structure or agency for this actor/action justified by the specific evidence and analytical question at hand, or does it seem predetermined by the historian's desire to assign or deflect blame?* When the pattern reveals asymmetry aligned with sympathies, you've found the move.
