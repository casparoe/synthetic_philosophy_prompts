prompt: |-
  I'm a retired seismologist — spent 35 years on earthquake hazard and coastal risk — and since I stoped working I've been reading philosophy, mostly ethics, slowly and badly. Something from my old job keeps nagging at me and I think it's a philosophy question but I don't have the words for it.

  When we costed out a flood defence or a retrofit programme, the analysts always discounted the future benefits. Not even at one rate — the schedule had the rate falling over time, so a benefit in 50 years got knocked down at something like 3% but one in 300 years at 1%, or whatever the numbers were that year. I understand the mechanics, roughly: the rate is a pure time preference term plus a term that depends on how fast incomes are growing and how much we say we dislike inequality. Fine. But two things bother me. First, the same parameter that says how much we should care about a poor person today versus a rich person today also says how much someone living in 2200 counts relative to me — and I've never once seen anyone defend that those two things should be welded into a single number. Second, the institutions doing this are the same ones whose charters say every citizen counts equally and who get rightly upset about discrimination by race or sex or place of birth — but apparently discrimination by date of birth is just, well, policy. And nobody discounts the welfare of people in Australia, only people in the future.

  So what does the practice of discounting the future actually presuppose? Does it commit you to a view about the moral status of future people, or only to something about how to make trade-offs under growth and uncertainty? Which theories of value does it quietly rule out, and which rival theories would also license the same spreadsheet? Are the parts consistent — the pure time preference bit, the inequality bit, and the falling-rate schedule? And if I decided the presupposed view was wrong, what would actually have to change: would I just be arguing about the size of the number, or about something sitting underneath the number? I don't need citations or a reading list, I just want to understand what I've been staring at all these years.
reasoning: |-
  Okay, let me start by unpacking this retired seismologist's question. He's spent 35 years in earthquake hazard and coastal risk, and now he's grappling with the ethical implications of discounting future benefits in cost-benefit analyses. His main concerns are twofold: first, that the same parameter handles both present inequality and intergenerational equity, which seems unjustified; second, that discounting discriminates based on birth date, which contradicts principles of equality.

  Hmm, he's pointing out a tension between ethical principles and economic practice. The key here is to clarify what discounting presupposes morally. The pure time preference part implies valuing present lives more than future ones simply because they exist now. That's a form of temporal discrimination. Then there's the wealth growth component, which treats future people as richer and thus less in need of resources. But as he notes, that's conflating two different ethical issues: inequality aversion across individuals and across time.

  I need to explain how discounting ties into different ethical theories. Utilitarianism might accept it if future generations are better off, but egalitarianism would reject weighting by wealth. Deontological ethics would argue against discounting future lives since all persons have equal moral worth regardless of when they live. The falling discount rate over time is an attempt to handle uncertainty about the far future, but it doesn't resolve the core ethical conflict.

  He’s asking which theories of value are ruled out by discounting. Theories that assign intrinsic value to future persons equally would clash with pure time preference. Also, theories opposing wealth-based discrimination would challenge the growth component. The practice assumes a specific stance where future people's welfare is less important, either because of time or their expected wealth.

  If he disagrees with the presuppositions, changing the discount rate isn't enough. The whole framework needs reevaluation. Alternatives like zero pure time preference or adjusting for wealth differences without discounting could be options. But these have practical challenges, especially with long time horizons where uncertainty looms large.

  He’s right that institutions don’t discount spatially, only temporally. That inconsistency highlights an unexamined bias towards the present. Addressing this would require a fundamental shift in how we value future generations, moving away from mere economic discounting towards a more equitable ethical framework.
answer: |-
  You've put your finger on the profound ethical tension embedded in standard discounting practice – a tension often obscured by technical jargon and spreadsheet mechanics. Let's dissect what this practice presupposes and its philosophical implications:

  **What Discounting Presupposes (Ethically):**

  1.  **Moral Weight Depends on Time:** The core presupposition, especially with a *positive pure time preference rate* (even a small one), is that *the mere passage of time itself* diminishes the moral weight of future well-being. A unit of welfare (or a life saved) today is intrinsically more valuable than an identical unit of welfare (or life saved) in the future, simply because it happens *now*. This directly challenges the idea of the equal moral status of persons *regardless of their temporal location*.
  2.  **Reducibility of Temporal Ethics to Intratemporal Inequality:** It presupposes that the ethical question "How much should we value the well-being of someone born in 2200 compared to someone born today?" is *sufficiently addressed* by the same parameter (the elasticity of marginal utility) used to compare rich vs. poor *today*. This assumes the ethical principles governing redistribution across space/time *and* across time *are fundamentally the same* – namely, diminishing marginal utility of consumption. It collapses distinct ethical domains.
  3.  **Future Generations as Less "Needy":** The wealth growth component (δ = η * g) presupposes that future people will be richer (on average). Therefore, transferring resources from today's (presumed poorer) society to them is ethically akin to transferring resources from poor individuals today to rich individuals today. The discount rate quantifies how much "less" that future rich person's gain counts *because* they are rich. It implicitly views future generations through the lens of their *expected economic status*, not their fundamental moral claim.
  4.  **Instrumentalism Over Intrinsic Value:** The practice primarily views future generations instrumentally within a framework of maximizing aggregate welfare (or consumption) *from the perspective of the present*. Their existence and well-being are valued insofar as they contribute to this aggregate, discounted stream. It doesn't inherently grant them intrinsic moral standing equal to the present.
  5.  **Acceptance of Temporal Discrimination as Legitimate Policy:** As you astutely observe, it presupposes that discrimination based on date of birth is fundamentally different and ethically permissible, unlike discrimination based on race, gender, or location. The institutional commitment to equal citizenship *simultaneously* embraces systematic devaluation based on temporal location.

  **Consistency of the Parts:**

  *   **Pure Time Preference (ρ):** Ethically contentious. Represents a direct assertion that time itself confers greater moral weight.
  *   **Inequality/Growth Term (η * g):** Less controversial *within* a generation (if you accept utilitarianism/welfarism), but ethically problematic *across* generations for the reasons you state: it conflates aversion to inequality *now* with discounting the value of future lives/well-being *later*.
  *   **Falling-Rate Schedule (e.g., Declining Discount Rate - DDR):** This is primarily a *practical* response to deep uncertainty. Long-term predictions (g, ρ, even η) are highly uncertain. Constant high rates make distant futures irrelevant; constant low rates may over-commit present resources based on shaky forecasts. A declining schedule attempts to balance near-term certainty with long-term precaution. Ethically, it doesn't resolve the core issues above but makes the *degree* of discrimination variable over time. It presupposes uncertainty justifies a *different* (usually less severe) form of discounting for the far future, not that the far future has equal intrinsic value.

  **Which Theories of Value Does it Rule In/Out? Which Rivals License Similar Math?**

  *   **Compatible With:**
      *   **Utilitarianism (Specific Flavors):** Specifically, *Total* Utilitarianism combined with a positive pure time preference (ρ > 0) and/or the expectation of perpetual growth (g > 0). It maximizes discounted total utility.
      *   **Wealth Maximization/Pareto Efficiency (Present Focus):** Views policy through the lens of improving outcomes for the *current* generation, potentially compensating losers *now*, with future impacts heavily discounted.
      *   **Strong Anthropocentrism:** If value resides *only* in satisfying current human preferences, discounting the future preferences of not-yet-born humans is consistent.
  *   **Ruled Out or Challenged By:**
      *   **Deontology (Kantianism):** The equal moral worth of all rational beings (including future ones) as ends-in-themselves is fundamentally incompatible with ρ > 0 and the inherent temporal discrimination. Discounting treats future people as *means* to present welfare.
      *   **Egalitarianism (Intergenerational):** A core commitment to the equal moral status of persons, regardless of temporal location, directly contradicts ρ > 0. Using η * g for intergenerational discounting violates this equality by valuing their well-being less *because* they might be richer.
      *   **Sufficientarianism:** If the goal is ensuring all generations meet a threshold of well-being/resources, discounting could lead to underinvestment in resilience for future thresholds if near-term benefits are prioritized.
      *   **Theories Granting Intrinsic Value to Future Existence/Nature:** Discounting future lives or environmental states heavily violates these views.
  *   **Rivals That *Could* Use Similar Math (But Differ Fundamentally):**
      *   **Zero Pure Time Preference Utilitarianism (ρ=0):** This removes the ethically most contentious part. Discounting would *only* be based on η * g (expected wealth differentials). While still valuing future rich people less than present poor people, it avoids discounting *solely* because they live in the future. The spreadsheet might look similar, but the ethical justification is narrowed.
      *   **Prioritarianism (Intergenerational):** If we weight the welfare of the worse-off more heavily *across time*, the discount rate could potentially be *negative* if we believe future generations might be catastrophically worse off (e.g., due to climate change). The math is similar (a rate applied over time), but the sign and justification are opposite.
      *   **Sustainability/Safe Minimum Standard:** While not directly using discount rates in the same way, cost-benefit with *very* low or zero discount rates might be used pragmatically to approximate the goal of preserving options for the future, even if the underlying ethic is different (e.g., obligations of stewardship).

  **What Would Have to Change if You Reject the Presuppositions?**

  Arguing about the *size* of the number (e.g., "use 1% instead of 3%") is a surface-level debate. Rejecting the core presuppositions demands changes *underneath*:

  1.  **Eliminate Pure Time Preference (ρ=0):** This is the most fundamental shift. It asserts the equal moral standing of future persons *as persons*. Welfare in 2200 counts the same as welfare today, *all else being equal*. This alone radically changes long-term project evaluations.
  2.  **Decouple Inequality Aversion from Intergenerational Valuation:** Stop using η (elasticity of marginal utility) as the lever for discounting future generations. You might still use η for intragenerational distribution *within* a cost-benefit analysis, but the *weight* given to future generations' utility streams would need a separate ethical justification.
  3.  **Alternative Frameworks for Long-Term Decisions:**
      *   **Sustainability Constraints:** Define minimum levels of resource/risk reduction to be maintained for future generations, *regardless* of discounted cost-benefit. The analysis focuses on meeting the constraint cost-effectively, not discounting the distant future benefit.
      *   **Rights-Based Approaches:** Frame protection from catastrophic risk (e.g., major earthquakes/floods) as a basic right or entitlement for all generations. Investment becomes an obligation, not a discounted calculation.
      *   **Precautionary Principle (Robustness):** Focus on avoiding catastrophic losses for the future under deep uncertainty, prioritizing resilience strategies that perform well across a wide range of long-term scenarios, rather than optimizing expected discounted value based on fragile forecasts.
      *   **Intergenerational Prioritarianism/Negative Discounting:** Actively weight the welfare of potentially worse-off future generations *more* heavily than the present.
  4.  **Reframe the Ethical Question:** Move away from "What discount rate should we use?" to questions like: "What do we owe to future generations?", "What level of risk is it acceptable to impose on them?", or "What legacy of resilience and opportunity are we obligated to leave?"

  **In essence:** You've identified a deep-seated ethical contradiction. Standard discounting practice, as you experienced it, presupposes that future people are morally less significant than present people, either because they exist later (pure time preference) or because they might be richer (wealth-growth discounting). This directly conflicts with the principle of equal moral consideration that underpins opposition to discrimination based on other characteristics.

  Challenging this isn't about tweaking a spreadsheet parameter; it's about demanding a fundamentally different ethical foundation for evaluating long-term risks and investments – one that genuinely recognizes the equal moral claim of future citizens born in 2200 to safety and well-being, alongside those alive today. The spreadsheet is merely the symptom; the disease is a failure to extend the principle of equal citizenship across time.
