prompt: |-
  OK so I'm a novelist, about 200 pages into a book where a small town talks itself into selling everything off to a developer, one family at a time, and the whole middle section is just people going along with whatever the family before them did. Writing it has got me obsessed with when that's dumb and when it's actually the smart thing, and I keep flip-flopping, so I want to lay out my gut reactions to a bunch of little cases and see if there's one rule underneath them or if I'm kidding myself.

  Here's what I've got:

  My neighbor says the new bakery is great. Then my other neighbor says so too, seperately, never having talked to the first one. I go. Obviously smart -- two people I trust agreeing.

  Same scene, but the two neighbors are married, do everything together, and both actually got it from the same third cousin. I still go, but now I feel like a chump, even though it's the exact same two people saying the exact same words.

  Walking down a street, two restaurants, one packed, one empty. I pick the packed one. Feels fine but a little shameful, like I'm being led around by the nose.

  At a show the crowd stands up, so I stand up. No deliberation at all. Feels completely fine, not stupid in the slightest.

  A stock I own starts climbing because everybody's piling in, so I buy more. This feels like the definition of being a sucker, and if a character of mine did it I'd want the reader to wince.

  A jar of jellybeans, prize for closest guess. Five people ahead of me call out numbers around a thousand. I actually looked at the jar and my honest read is two thousand. I say a thousand anyway. I think this is a genuine mistake and I'd feel bad afterward.

  So my tentative rule is: follow the crowd when you've got nothing of your own to go on, ignore it when you do. But that rule seems to make the restaurant smart (I've got nothing, so I follow) and the concert smart (same), while the jellybean case is the one I'm dead sure is a mistake, and the rule only catches it because I *did* have my own info there. Meanwhile the restaurant and the concert look structurally identical to the stock, which I hate, and I can't tell you why standing up at a show is fine and buying the climbing stock isn't, except that one's about money and one isn't, which feels like a total cop-out.

  Can you tell me what principle actually fits these six, or if there isn't one, which of my verdicts I should give up? And please say what it predicts for the case I'm actually writing -- the town, where each family sells because the family before them did, nobody checks the deal independently, and by the end even the old man who swore he'd never sell caves, and nobody ever finds out if it was a good price.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a novelist working on a book about a town selling out to a developer, and they're struggling with when following the crowd is smart versus dumb. They provided six scenarios with their gut reactions and want a unifying principle. My first thought is to identify patterns in their examples.

  Looking at the bakery cases: two independent neighbors recommending it feels smart, but married neighbors with the same source feels like being a chump. The difference seems to be information independence. In the first, two separate sources add credibility. In the second, it's just one source echoed, so no real new info. That points to the value of diverse information.

  The restaurant and concert examples are interesting. Choosing the busy restaurant feels a bit shameful, but standing at a concert is fine. Both involve following the crowd without personal info. The key difference might be coordination versus information. At the concert, standing is about participation, not decision-making. The restaurant choice is about quality inference, where the crowd signals something, but there's no coordination needed. 

  The stock market and jellybean scenarios are clear cases where personal information conflicts with the crowd. Buying more stock because it's rising is seen as foolish, especially since markets can overheat. The jellybean example shows ignoring personal judgment to conform, which feels like a mistake. Both involve overriding one's own assessment for the crowd, leading to regret.

  So the underlying principles could be information diversity, coordination needs, and cost of error. For the town selling, each family relies on previous sales without independent checks. The lack of diverse information and high stakes (financial risk) make this risky. The initial sellers might have good reasons, but later ones are just conforming. The old man caving shows social pressure overpowering judgment. 

  I need to verify if these principles fit all cases. The concert works because coordination is harmless and enhances experience. The stock market has high stakes and potential for bubbles. The jellybean involves low personal cost but ignoring better judgment. The town scenario combines high stakes, no new info, and social pressure, making it a questionable move. 

  The user might be looking for a framework to judge their characters' decisions realistically. Highlighting the stakes, information diversity, and social dynamics can add depth to the novel. They might also want to explore how isolation and dwindling opposition affect conformity. Emphasizing the breakdown of independent thought in the town could underscore the tragedy or critique groupthink.
answer: |-
  Your gut reactions are incredibly perceptive – you've nailed the core tension! There *is* a unifying principle, but it has a few facets. The rule isn't just about *having* information, but **what the crowd signal actually *tells* you, the potential cost of being wrong, and whether the action is inherently social.**

  Here's the principle that fits all six cases:

  **Follow the crowd when the crowd's behavior provides *new, relevant information* about an objective reality or when coordination *is* the goal. Ignore the crowd when the signal is redundant, misleading, or when acting independently based on your own assessment is crucial, especially under high stakes.**

  Let's break it down case-by-case:

  1.  **Bakery (Independent Neighbors): SMART.** The crowd signal (two independent endorsements from trusted sources) provides *new, convergent information* about the bakery's quality (objective reality). Low stakes, high relevance.
  2.  **Bakery (Married Couple, Same Source): FEELS LIKE A CHUMP (Correctly).** The crowd signal is *redundant*. It provides *no new information* beyond the single source (third cousin). You mistakenly treated two voices as two independent data points. The information value hasn't increased.
  3.  **Restaurant (Packed vs. Empty): FEELS FINE BUT SHAMEFUL (Understandable).** The crowd signal *does* provide relevant information about likely quality or popularity (objective reality). It's rational, especially with no other info. The "shame" comes from feeling unoriginal/having no independent criteria. The signal *is* informative, but potentially shallow or herd-like. **Verdict: Rational use of information, but low-agency.**
  4.  **Concert (Standing Up): SMART & FINE.** Coordination *is* the goal. Standing up isn't primarily about assessing quality; it's about participating in a shared experience. The crowd behavior *is* the relevant signal for the desired action (joining the group activity). No independent assessment needed or desired.
  5.  **Stock (Buying More as it Climbs): FEELS LIKE A SUCKER (Usually Correct).** The crowd signal (rising price due to buying) provides *misleading information* about the stock's *intrinsic value* (objective reality). It signals popularity/momentum, not fundamentals. Acting on this signal ignores independent assessment *under high stakes* (financial loss). This is *informational cascading* – people ignore their own signals because they think the crowd knows something they don't, often leading to bubbles. High cost of error.
  6.  **Jellybeans (Ignoring Own Guess): GENUINE MISTAKE (Correct).** You *had relevant independent information* (your visual assessment of the jar). The crowd signal (previous guesses) provided *no new information* about the *actual number* (objective reality), just about *their guesses*. You overrode your own relevant assessment based on conformity pressure under low stakes. The crowd wasn't informing reality, just revealing their (possibly wrong) opinions.

  **Refined Rule:** Follow the crowd when:
      a)  **The crowd provides *new, independent* information** about an objective reality (e.g., independent bakery reviews, busy restaurant implying quality).
      b)  **Coordination *is* the purpose** (e.g., standing at a concert, traffic rules).
      *   *And* the stakes for being wrong are relatively low.
      Ignore the crowd when:
      c)  **The crowd signal is redundant or uninformative** about the relevant reality (e.g., married couple echoing one source, jellybean guesses).
      d)  **You possess relevant independent information** that contradicts the crowd signal (e.g., your jellybean estimate, a negative stock analysis you believe).
      e)  **The stakes for being wrong are high** (e.g., significant financial loss).
      f)  **The crowd signal reflects momentum/herding rather than information** (e.g., stock bubble).

  **Why the Restaurant/Concert vs. Stock Difference?**
  *   **Restaurant:** The crowd *might* signal quality (information about reality), stakes are low (one mediocre meal).
  *   **Concert:** The crowd *defines* the desired coordinated behavior (standing = participation). Stakes are nil.
  *   **Stock:** The crowd *creates* the price momentum, often *detached* from reality (intrinsic value). Stakes are high. Following here ignores independent assessment in a high-risk situation based on a misleading signal.

  **Your Town: The Developer Deal**

  According to the principle above, **this is overwhelmingly DUMB and tragic.**

  1.  **No New Information:** Each subsequent family learns *nothing new* about the *actual merits of the deal* (objective reality: fair price? Developer's true plans? Long-term impact?). They only learn that the *previous family* accepted it. The signal is entirely about *others' actions*, not the *underlying reality*.
  2.  **Redundant Signal:** By the 10th family, the "crowd signal" (9 sales) is just echoing the initial decision(s), not providing 9 independent data points on the deal's quality. It's pure *informational cascading*.
  3.  **High Stakes:** Selling your home and land is extremely high stakes. The cost of a bad deal is potentially life-altering (loss of generational wealth, community, way of life).
  4.  **Ignored Independent Assessment:** The rule explicitly says families "nobody checks the deal independently." They possess the *capacity* for relevant independent assessment (reading the contract, getting an appraisal, researching the developer) but *ignore* it in favor of the crowd signal.
  5.  **Social Pressure, Not Information:** The signal becomes about conformity ("Everyone else is doing it, it must be okay"), fear of being the holdout, or pressure to conform, *not* about gathering information on the deal's true value.
  6.  **The Old Man's Cave-In:** This is the ultimate tragedy. Even someone with strong initial independent judgment (his "swore he'd never sell") succumbs to overwhelming social pressure and the *illusion* of information created by the cascade. He abandons his own assessment without gaining any new *real* information about the deal.

  **Prediction:** The town's behavior is a classic, devastating informational cascade driven by conformity and the *misinterpretation* of others' actions as meaningful signals about an objective reality they never actually investigated. The principle predicts this leads to a potentially very bad outcome for everyone, driven by the breakdown of independent thought under social pressure. It's the jellybean mistake and the stock sucker play, but with people's homes and community at stake. The reader *should* wince, especially at the old man's capitulation. It perfectly captures the dark side of social proof. Your gut feeling that it's dumb, especially compared to the concert or independent bakery reviews, is exactly right based on the underlying principles.
