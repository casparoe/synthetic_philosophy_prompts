  Need help turning a half-formed idea into an actual proposal — it's for a small political-theory workshop, so call it 8-10 pages, one term to write it. The idea: the whole fight about referendums gets framed as competence (can voters know enough?) or legitimacy (does voting make the decision ours?). I think both miss whats actually distinctive, which is that the initiative is directionally asymmetric. A loss leaves the status quo sitting there; a win moves the baseline — entrenchment, spending you can't unwind, expectations and party positions re-forming around the new normal. So "just vote again" is a remedy that only runs one way: a later no can undo an earlier yes, but it has to beat a world the earlier yes already changed. What I can't tell yet: (a) is that asymmetry a defect of direct democracy or just what any binding decision does, and (b) how much of "the status quo" is a fact about the world versus a convention about which baseline we're counting from — that one feels like it could be the whole project, or a red herring. Write the proposal: state the question so it has a determinate answer, say why the competence/legitimacy debate doesn't settle it, sketch what I'd actually do (more than "compare cases" — tell me what method earns its keep here), what a result would look like, and what would count as the project failing or being too big for a term. No citations, I'll add those, and dont lean on specific countries' histories as if I know them.
