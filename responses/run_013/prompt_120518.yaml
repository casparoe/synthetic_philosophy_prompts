prompt: |-
  For some years I have been collecting a kind of reason that I cannot place, and I would like to know whether it has a name. Let me describe it by instances rather than by definition, since a definition is precisely what I am asking for.

  The reasons I have in mind are offered on behalf of an attitude — a confidence, a judgment, a trust — but whatever force they carry comes from the good consequences of the attitude's being displayed: avowed, asserted, or acted on where others can see it. Not from the good consequences of holding it privately, and not from any feature of the attitude's object.

  (i) A colleague is urged to be confident in a grant application, not because the evidence warrants confidence but because reviewers reward it; the advice is to project the confidence, and the projection is expected in time to become the real thing.

  (ii) A department is urged to settle a contested matter by adopting a position, on the ground that announcing a position will calm the graduate students; the consideration is not that the position is correct, nor that holding it is good for anyone, but that saying it will do work.

  (iii) A therapist counsels a patient to trust a spouse and, pressed for a reason, offers the observation that trust expressed tends to be trust returned; the reason is not evidence about the spouse.

  In each case the consideration counts, or seems to count, in favor of an attitude, and yet it operates only through the attitude's manifestation. There is a further feature I find harder to place: once an attitude has been produced this way, its holder will sincerely cite the attitude's object as the reason for holding it, and will reject the suggestion that any other reason was at work. The reason does double duty — it is offered as a reason to take up the attitude, and it vanishes into the attitude once the attitude is in place.

  I know the neighborhood. There is the familiar complaint that some considerations are the wrong kind of reason to justify an attitude, together with the associated distinction between considerations that bear on the attitude's object and considerations that bear only on the attitude's being had. My question is whether anyone has marked off the narrower thing I have described: a reason whose operative good is the good of the attitude's being displayed, which is not merely a reason to act, which is not simply a reason to hold the attitude in private, and which is characteristically self-concealing in the way I have indicated. If the nearest established concept is the wrong kind of reasons, I want to know precisely where the two come apart, because I suspect that the display condition and the self-concealment are doing separate work and that neither is built into the usual formulation. A name would be welcome, but a name alone will not satisfy me; I want the phenomenon carved at its joints — what it includes, what it excludes, and where its edges fall.

  Please answer in American English and return your answer as a single JSON object with the following fields, in this order:

  - "verdict": one of "established concept fits", "established concept fits only in part", or "no established concept".
  - "label": the established term if one exists; if none does, a term you coin, placed in the same field.
  - "definition": one or two sentences stating what is necessary to the phenomenon and what is merely typical of it.
  - "nearest_concepts": an array of at least three entries, each an object with "name", "what_it_captures", and "where_it_diverges".
  - "case_verdicts": an array with one entry per instance above, each an object with "case" (a few words identifying it), "fits" ("yes", "partly", or "no"), and "reason".
  - "boundary_cases": an array of two or three cases of your own construction that sit near the edge of the definition, each an object with "case", "verdict" ("inside", "outside", or "undecided"), and "why".
  - "self_concealment": your assessment of whether the self-concealment I described is essential to the phenomenon or a contingent accompaniment, with the argument for your assessment.
  - "summary": a short paragraph in plain prose that stands on its own.
reasoning: |-
  We are looking for a concept that captures reasons that:
  1. Are offered on behalf of an attitude (confidence, judgment, trust) because of the good consequences of the attitude's being displayed (avowed, asserted, acted on publicly), not because of the good consequences of holding it privately or features of the attitude's object.
  2. The reason is self-concealing: once the attitude is adopted, the holder sincerely cites the object of the attitude as the reason and rejects the original reason.

  The phenomenon is not exactly the same as the "wrong kind of reasons" (WKR) because WKR typically are reasons that bear on the attitude's being had (e.g., pragmatic reasons) but without the display condition and self-concealing feature.

  After reflection, I think the closest established concept might be "self-fulfilling reasons" or "performative reasons", but these are not standard. Alternatively, it might be a subset of pragmatic reasons or expressive reasons. However, the display aspect is crucial.

  I recall that in philosophy, especially in ethics and epistemology, there is a concept called "epistemic instrumentalism" or "pragmatic encroachment", but that doesn't quite fit because it is about how practical stakes affect knowledge. The phenomenon here is more about the social and performative aspect.

  Another concept is "affective scaffolding" or "emotional self-management", but that is too broad.

  Alternatively, in the literature on self-deception and belief, there is the idea of "belief for practical reasons". But again, without the emphasis on display.

  I think there isn't a well-established term for exactly this. So I will coin a term: "performative scaffolding reasons".

  Definition: A reason that recommends adopting an attitude (such as belief, trust, or confidence) primarily because the public expression or display of that attitude will bring about beneficial consequences, and which typically leads to the attitude being held sincerely such that the original reason is forgotten or denied.

  Nearest concepts:

  1. "Pragmatic reasons for belief": These are reasons to believe something because it is beneficial to believe it. What it captures: the reason is not based on evidence but on practical benefits. Where it diverges: It does not require the display of the attitude to others, and it doesn't necessarily involve self-concealment.

  2. "Wrong kind of reasons (WKR)": These are reasons that are the wrong kind to justify an attitude because they don't bear on the object of the attitude. What it captures: the reason is not about the object of the attitude. Where it diverges: WKR are typically considered not to be genuine reasons for the attitude (e.g., the evil demon case for belief), and they don't necessarily involve the display condition or self-concealment.

  3. "Expressive action": Actions that are done to express an attitude. What it captures: the display of the attitude is central. Where it diverges: This is about actions, not about reasons for attitudes. Also, it doesn't involve the self-concealment.

  Case verdicts:

  (i) Grant confidence: Fits "yes". Reason: The reason is the display of confidence (to reviewers) and the expectation that it becomes real. It fits the definition.

  (ii) Department position: Fits "yes". Reason: The reason is that announcing a position will calm students (display) and it is not about the correctness. It fits.

  (iii) Therapist trust: Fits "yes". Reason: The reason is that expressing trust tends to get trust in return (display) and not about the spouse. It fits.

  Boundary cases:

  1. Case: A person is told to believe in God because it will make them happier (in private). Verdict: "outside". Why: The reason is for private holding, not display. There is no public expression required.

  2. Case: A politician is told to publicly express support for a policy she doesn't believe in because it will win votes. But she never comes to believe it. Verdict: "outside". Why: The display is for show and doesn't become a sincere belief (so the self-concealment is missing).

  3. Case: A team leader is urged to show confidence in a project during a public meeting because it will motivate the team. Over time, the leader becomes genuinely confident due to the positive feedback. The leader then cites the project's merits as the reason. Verdict: "inside". Why: The display has the consequence, and the attitude becomes sincere with the original reason concealed.

  Self-concealment: I think it is a contingent accompaniment but not essential. The phenomenon can occur without the self-concealment (e.g., if the person is aware of the reason but still holds the attitude), but it is characteristic because the attitude, once formed, naturally points to its object. However, the core of the phenomenon is the reason for display leading to the attitude. So it is typical but not necessary.

  Summary: The phenomenon you describe, where reasons for an attitude are based on the beneficial consequences of publicly displaying that attitude and where the attitude, once adopted, conceals its own origin, does not have a well-established name. I call it "performative scaffolding reasons". These reasons work by the public performance of the attitude leading to its sincere adoption, and they are distinct from pragmatic reasons for belief in their emphasis on public display and their tendency to become self-concealing. While the self-concealment is a common feature, the core of the phenomenon is the display-based reason leading to the attitude.

