answer: |-
  ### Exam Question  
  **Old Evidence and Bayesian Anomalies**  
  Consider the case of Mercury's perihelion precession (E), which was a known anomaly long before Einstein’s General Relativity (H) explained it. Using this case:  
  1. Precisely articulate the old evidence objection to Bayesian confirmation theory. Avoid merely stating that P(E) = 1; instead, derive why this undermines confirmation.  
  2. Evaluate the "counterfactual credence" solution (i.e., assessing P*(E), the credence in E *before* E was learned). Does this resolve the objection, or does it relocate the problem? Explain.  
  3. **Crux**: Does the old evidence problem persist if we relax logical omniscience, allowing agents to be uncertain about *logical relationships* (e.g., H⊨E) or the *evidence itself*? Or is the problem merely an artifact of idealization? Justify your answer.  

  ---

  ### Model Answer (545 words)  
  **(1)** The old evidence objection shows that Bayesianism cannot confirm theories by evidence already certain to the agent. If E (Mercury’s perihelion data) is known, P(E) = 1. By Bayes’ theorem, P(H|E) = [P(E|H) × P(H)] / P(E) = P(E|H) × P(H). Since P(E|H) ≤ 1, P(H|E) ≤ P(H), implying no confirmation. Crucially, *even if H entails E*, P(E|H) = 1, so P(H|E) = P(H). Thus, the theory gains no probability from explaining E.  

  **(2)** The counterfactual solution proposes assessing P*(E): the credence E *would have had* before it was learned. If Einstein in 1900 (ignoring Mercury’s data) would have found E unlikely without GR (P*(E) low), but GR predicts E (P*(E|H) high), then P*(H|E) > P*(H). This *appears* to restore confirmation. However, it relocates the problem: P*(E) is subjective and historically unconstrained. Einstein might have known Newtonian mechanics’ failure implied *some* anomaly existed, raising P*(E). Worse, the agent must reconstruct a counterfactual prior without hindsight bias—a task vulnerable to arbitrariness. Thus, the solution depends on contestable psychological assumptions.  

  **(3)** The problem **survives** dropping logical omniscience but becomes tractable. If agents are uncertain whether H entails E (e.g., doubting GR’s mathematical derivation), then P(E|H) < 1 *even after learning E*. Bayes’ theorem now allows P(H|E) > P(H) if P(E|H) > P(E|¬H). Similarly, if evidence is uncertain (e.g., P(E) < 1 due to instrument reliability), P(E|H) > P(E) boosts P(H|E). However, this dissolves the *original* anomaly: the challenge was that *certain* old evidence couldn’t confirm, not that uncertain evidence couldn’t. For *truly old* evidence (where P(E)=1 remains intuitive), relaxing logical omniscience helps only if the agent *learns the logical connection* between H and E *after* adopting H. For example, if Einstein initially doubted GR implied Mercury’s precession, then later proved it, *that proof* becomes new evidence yielding confirmation. The core problem—that background knowledge "locks" P(E)=1—persists when evidence is certain, but Bayesianism can handle old evidence when agents are uncertain about *implication* or *evidence reliability*.  

  ---

  ### Marking Scheme (5 × 20 points each)  
  **Must-hit moves** (Total: 100 points; A: 85+, B: 70–84)  

  1. **Derives P(H|E) = P(H) rigorously** (20 pts)  
     *Common error:* Stating "P(E)=1 implies no confirmation" without showing P(H|E) = P(H) via Bayes’ theorem.  
  2. **Identifies P*(E) subjectivity as relocating the problem** (20 pts)  
     *Common error:* Claiming counterfactual credences "solve" the problem without noting their arbitrariness or vulnerability to hindsight.  
  3. **Distinguishes uncertainty in evidence vs. logical entailment** (20 pts)  
     *Common error:* Conflating P(E) < 1 (evidence uncertainty) with P(H⊨E) < 1 (logical uncertainty).  
  4. **Argues the problem persists for certain evidence** (20 pts)  
     *Common error:* Claiming dropping logical omniscience "solves" the old evidence problem outright.  
  5. **Notes that learning logical connections *after* H can confirm** (20 pts)  
     *Common error:* Overlooking that *learning H⊨E post-hoc* serves as new evidence, allowing confirmation.  

  ---

  **Rationale for Design**  
  - **Mercury’s perihelion** is used for clarity, but its familiarity forces students to engage beyond textbook answers.  
  - Part 3’s hinge on **logical non-omniscience** prevents rote summaries: A answers must distinguish evidence certainty from entailment uncertainty.  
  - **Marking scheme** rewards precision: B candidates often miss that counterfactuals relocate subjectivity (#2) or conflate uncertainty types (#3). A answers nail #4–5 by showing *when* the problem endures despite idealization relaxations.
