prompt: |-
  Ok so I'm putting together the take-home final for a small upper-level seminar I run on Bayesian confirmation — we read a mix of Earman, Howson, and the old-evidence literature, and I've been lurking on rationality blogs long enough to know exactly where students fake it. The problem: they've all memorized old evidence = P(E) = 1 = problem, and then they stop thinking.

  I want one exam question that makes them actually work. Pick a concrete case where the evidence was already sitting there before the theory that supposedly predicts it showed up (Mercury's perihelion is the obvious one, but if you think that's too well-worn, choose something better). Then force three moves. (1) State the old evidence objection as sharply as possible without just chanting the P(E) = 1 line. (2) Evaluate the counterfactual-credence repair — the one where you ask what the agent's credence in E would have been before she learned it — and say whether it genuinely solves the problem or just relocates it one level up. (3) The crux, and I definately want the question to hinge on this so nobody can get full marks by summarizing the debate: does the problem survive once you drop the logical-omniscience idealization and let the agent's evidence be less than certain? Is old evidence a real anomaly for Bayesianism, or an artifact of the idealization?

  Deliverables: the exam question itself (a paragraph or two), a model answer of no more than 550 words, and a marking scheme that tells me what separates an A from a B. For the marking scheme I want five must-hit moves, marks for each out of 20, and for each one a one-liner on how candidates typically get it wrong — that trips alot of them up. Keep the whole response under 1,000 words, and no reading lists or citations; it's closed-book and I'm grading the argument, not the bibliography.
