prompt: |-
  I am currently enrolled in our department's upper-level course on decision theory and the philosophy of probability, and our final assignment asks each of us to design an examination question for next year's cohort, supplying the question together with a model answer and a marking scheme. I have settled on the St. Petersburg paradox, but I do not want a question that can be answered by reciting the familiar claim that the diminishing marginal utility of money dissolves the difficulty. I would like the question to force candidates to reason about why that claim is only a partial fix, and I have sketched a variant that I want the question built around.

  The setup I intend to give is this. In the ordinary St. Petersburg game a fair coin is tossed until it first lands tails; if that happens on toss n, the payout is 2^n pounds. The expected payout is the sum over n of (1/2)^n · 2^n, which diverges, so the game has infinite expected monetary value. I then want candidates to consider an accelerated version in which the payout on a first tails at toss n is not 2^n but 2^(2^n), and to work out what this does to the standard resolution.

  Please write the examination question, a model answer of roughly 700–800 words, and a marking scheme. The question should be worth 25 marks and be answerable in about 45 minutes, and I would like it structured so that candidates must: explain what the divergence of expected value actually conflicts with, and what it does not by itself show; present the diminishing-marginal-utility resolution and then argue precisely why it relocates the problem rather than removing it unless a further assumption is supplied; analyse the accelerated game, including its expected value and the fact that a logarithmic utility function does not tame it, in contrast to the ordinary game, which the same logarithmic utility function does tame; and finally state the general condition on a utility function under which no game of this kind can be constructed to yield infinite expected utility, and assess how plausible that condition is.

  The model answer should be self-contained and should not appeal to any named literature, since candidates will not have references to hand, and neither the question nor the model answer should depend on citations. The marking scheme should identify the specific moves a first-class answer must contain, allocate the 25 marks across them, and note, for each part, the particular error that should cost candidates marks — for instance, treating the diminishing-marginal-utility point as a mathematical fact rather than a substantive assumption, confusing infinite expected value with an inability to lose, or failing to see that any particular concave utility function can be outrun by accelerating the payoffs.
reasoning: |-
  We are constructing an exam question on the St. Petersburg paradox with a twist (an accelerated version) to challenge the standard diminishing marginal utility resolution.

  The exam question should:
  1. Ask candidates to explain what the divergence of expected monetary value in the St. Petersburg paradox conflicts with and what it does not by itself show.
  2. Present the diminishing marginal utility resolution and then argue why it relocates the problem rather than removing it unless a further assumption is supplied.
  3. Analyze the accelerated game (with payout 2^(2^n) for first tails on toss n), including its expected monetary value and the fact that a logarithmic utility function does not tame it (while it does for the ordinary game).
  4. State the general condition on a utility function under which no game of this kind can be constructed to yield infinite expected utility, and assess how plausible that condition is.

  We'll design the question to be worth 25 marks and answerable in about 45 minutes.

  Here is the exam question:

  ---

  **Exam Question (25 marks, expected time: 45 minutes)**

  The St. Petersburg paradox involves a game in which a fair coin is tossed until it first lands tails. If the first tails occurs on the \(n\)th toss, the monetary payout is \(2^n\) pounds. The expected monetary value of this game is infinite, which appears to conflict with the intuition that no one would pay an arbitrarily large amount to play.

  (a) Explain what the divergence of the expected monetary value actually conflicts with, and what it does not by itself show. (5 marks)

  (b) Present the resolution that appeals to the diminishing marginal utility of money (typically by using a concave utility function). Then argue why this resolution relocates the problem rather than removing it, unless a further assumption is supplied. (7 marks)

  Now consider an accelerated version of the game: the payout when the first tails occurs on the \(n\)th toss is \(2^{2^n}\) pounds (that is, \(2^{(2^n)}\)).

  (c) Compute the expected monetary value of this accelerated game. (3 marks)

  (d) Suppose a decision maker has a utility function \(u(x) = \log(x)\) (base 2 logarithm, so that \(u(2^k) = k\)). Show that for the ordinary St. Petersburg game, the expected utility is finite, but for the accelerated game, the expected utility is infinite. (5 marks)

  (e) State the general condition on a utility function \(u: \mathbb{R}^+ \to \mathbb{R}\) under which no game of the St. Petersburg kind (i.e., with payouts growing sufficiently fast) can be constructed to have infinite expected utility. Assess the plausibility of this condition. (5 marks)

  ---

  **Model Answer**

  **(a) Explanation of the conflict (5 marks)**

  The divergence of the expected monetary value in the St. Petersburg paradox conflicts with the principle that rational agents should be willing to pay only a finite amount to play a game with infinite expected monetary value. This principle is based on the intuition that the game, despite having infinite expectation, almost always yields a relatively small payout (the probability of a large payout decreases exponentially). The paradox highlights that the standard expected value maximization rule, when applied naively to games with unbounded payouts, leads to counterintuitive recommendations.

  However, the divergence by itself does not show that the game is necessarily worth an infinite amount of money. It merely indicates that the expected monetary value is not finite. It does not, by itself, prove that a rational agent must be willing to pay any finite amount to play the game. The conflict arises because the theory of expected value maximization (for monetary outcomes) suggests that one should be willing to pay any finite amount, but in practice, people are not.

  **(b) Diminishing marginal utility resolution and its limitation (7 marks)**

  The standard resolution to the paradox invokes the diminishing marginal utility of money. Instead of maximizing expected monetary value, we maximize expected utility. We assume that utility is a concave function of money, reflecting that each additional pound provides less utility than the previous one. A common choice is the logarithmic utility function, \(u(x) = \log(x)\).

  For the ordinary St. Petersburg game, the expected utility becomes:

  \[
  E[u] = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \log(2^n) = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \cdot n \cdot \log(2)
  \]

  Since \(\log(2)\) is a positive constant, we can factor it out. The series \(\sum_{n=1}^{\infty} n \cdot (1/2)^n\) converges (it equals 2). Hence, the expected utility is finite, and the paradox is resolved: there is a finite entry price that a rational agent with logarithmic utility would be willing to pay.

  However, this resolution relocates the problem rather than removing it. The problem is that for any given concave utility function (that is unbounded above), we can design a St. Petersburg-like game that again has infinite expected utility. The reason is that even though the utility function is concave, it may grow without bound (albeit slowly). By accelerating the payouts sufficiently (making them grow very fast), we can make the expected utility diverge. Therefore, without a further assumption that the utility function is bounded above, we can always construct a new paradox. The resolution thus depends on the substantive assumption that utility is bounded.

  **(c) Expected monetary value of the accelerated game (3 marks)**

  In the accelerated game, the payout for the first tails on the \(n\)th toss is \(2^{2^n}\) pounds. The probability of this outcome is \((1/2)^n\) (since the first \(n-1\) tosses are heads and the \(n\)th is tails). The expected monetary value is:

  \[
  E[\text{payout}] = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \cdot 2^{2^n}
  \]

  We can write this as:

  \[
  E[\text{payout}] = \sum_{n=1}^{\infty} \frac{2^{2^n}}{2^n} = \sum_{n=1}^{\infty} 2^{2^n - n}
  \]

  Since \(2^n\) grows much faster than \(n\), the exponent \(2^n - n\) grows without bound. Therefore, the general term \(2^{2^n - n}\) does not go to zero (in fact, it goes to infinity). Thus, the series diverges to infinity.

  **(d) Expected utility for logarithmic utility (5 marks)**

  Consider a decision maker with utility function \(u(x) = \log_2(x)\). 

  For the ordinary St. Petersburg game (payout \(2^n\) for first tails on toss \(n\)):

  \[
  E[u] = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \log_2(2^n) = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \cdot n
  \]

  As noted in part (b), this series converges (to 2).

  For the accelerated game (payout \(2^{2^n}\) for first tails on toss \(n\)):

  \[
  E[u] = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \log_2(2^{2^n}) = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \cdot 2^n
  \]

  Because \(\log_2(2^{2^n}) = 2^n\). Therefore:

  \[
  E[u] = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty
  \]

  The series diverges to infinity. Thus, the logarithmic utility function, which tamed the ordinary St. Petersburg game, does not tame the accelerated one.

  **(e) General condition and its plausibility (5 marks)**

  The general condition on a utility function \(u: \mathbb{R}^+ \to \mathbb{R}\) that prevents any St. Petersburg-like game from having infinite expected utility is that the utility function must be bounded above. That is, there must exist some finite number \(M\) such that \(u(x) \leq M\) for all \(x\).

  To see why, if the utility function is bounded above by \(M\), then the expected utility of any lottery is at most \(M\). Hence, it must be finite. Conversely, if the utility function is unbounded above, then we can construct a St. Petersburg-like game: choose a sequence of payouts \(x_n\) such that \(u(x_n) \geq 2^n\) (which is possible because \(u\) is unbounded). Then set the probability of the payout \(x_n\) to be \(1/2^n\). The expected utility would be at least \(\sum_{n=1}^{\infty} (1/2)^n \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty\).

  Assessing the plausibility of bounded utility: Some philosophers and economists (e.g., Bernoulli) have assumed that utility is bounded. However, bounded utility is controversial. It implies that there is a maximum level of utility that cannot be exceeded, no matter how much wealth one has. This might seem counterintuitive: can we not always imagine a slightly better state? Also, bounded utility avoids the St. Petersburg paradox but may lead to other counterintuitive results (e.g., in problems involving very large payouts). On the other hand, unbounded utility allows the construction of the St. Petersburg paradox in utility terms, which again leads to the recommendation that one should be willing to pay any finite amount for a game. Thus, the condition of bounded utility is a strong assumption that resolves the paradox at the cost of limiting the form of the utility function, and its plausibility remains a topic of debate.

  ---

  **Marking Scheme (Total 25 marks)**

  **(a) (5 marks)**
  - 2 marks: Explaining that the divergence conflicts with the intuition that rational agents should only pay a finite amount for the game (and that the expected value maximization rule leads to counterintuitive results).
  - 2 marks: Clarifying that the divergence does not by itself show that the game is worth an infinite amount (it only shows that the expected monetary value is not finite) and that it does not force a rational agent to pay arbitrarily high amounts (without additional assumptions about rationality).
  - 1 mark: Mentioning the practical observation that people are not willing to pay large amounts.

  **(b) (7 marks)**
  - 3 marks: Correctly presenting the diminishing marginal utility resolution (using a concave utility function, e.g., logarithmic) and showing that for the ordinary game, it yields finite expected utility (with a brief calculation).
  - 4 marks: Arguing that this relocates the problem: for any given unbounded concave utility function, one can design a new game (by accelerating payouts) so that expected utility diverges. Hence, a further assumption (that utility is bounded) is needed to avoid the paradox.
    - (Deduct 2 marks if the candidate fails to note that the utility function must be bounded to avoid the problem entirely.)

  **(c) (3 marks)**
  - 1 mark: Writing the series for expected monetary value: \(\sum_{n=1}^{\infty} (1/2)^n \cdot 2^{2^n}\).
  - 1 mark: Simplifying to \(\sum_{n=1}^{\infty} 2^{2^n - n}\).
  - 1 mark: Recognizing that the terms go to infinity and thus the series diverges.

  **(d) (5 marks)**
  - 2 marks: For the ordinary game: \(E[u] = \sum_{n=1}^{\infty} (1/2)^n \cdot n\) and noting that it converges (to 2).
  - 3 marks: For the accelerated game: \(E[u] = \sum_{n=1}^{\infty} (1/2)^n \cdot 2^n = \sum_{n=1}^{\infty} 1\), which diverges.

  **(e) (5 marks)**
  - 2 marks: Stating the condition: the utility function must be bounded above.
  - 2 marks: Explaining why: if bounded, expected utility is bounded; if unbounded, one can construct a St. Petersburg game with infinite expected utility.
  - 1 mark: Assessing plausibility: noting that bounded utility avoids the paradox but is controversial (e.g., because it implies a maximum utility level, which might seem implausible).

  **Common Errors to Penalize:**
  - Treating the diminishing marginal utility as a mathematical fact rather than a substantive assumption (e.g., not acknowledging that it is an assumption about the utility function).
  - Confusing infinite expected value with an inability to lose (the game can still result in a loss if the entry fee is high and the payout is low, which happens with high probability).
  - Failing to see that any particular concave utility function (if unbounded) can be outrun by accelerating the payoffs (in part (b) and (d)).
  - In part (d), confusing the payout of the accelerated game (2^(2^n)) and the utility from it (which for log is 2^n), and thus miscalculating the expected utility.
  - In part (e), not stating the boundedness condition clearly, or stating an insufficient condition (like concavity alone).

  ---

  This exam question and model answer meet the requirements by focusing on the accelerated game to challenge the standard resolution and by requiring the candidate to reason through the limitations of the diminishing marginal utility approach.
answer: |-
  ### Examination Question: St. Petersburg Paradox and Its Accelerated Variant (25 marks)

  **Background:**  
  The St. Petersburg paradox involves a game where a fair coin is tossed until it first lands tails. If the first tails occurs on toss \(n\), the payout is \(2^n\) pounds. The expected monetary value (EMV) is \(\sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot 2^n\), which diverges to infinity. This creates a conflict with intuition, as people are unwilling to pay large sums to play. A common resolution posits diminishing marginal utility of money, modeled by a concave utility function \(u(x)\).  

  **Accelerated Game Variant:**  
  Consider an accelerated St. Petersburg game where the payout for first tails on toss \(n\) is \(2^{2^n}\) pounds (i.e., \(2^{(2^n)}\)).  

  **Your Tasks:**  
  1. **Conflict Analysis (5 marks):**  
     Explain precisely what the divergence of EMV in the original game conflicts with, and what it does *not* imply about rational behaviour. Avoid vague appeals to "intuition."  

  2. **Resolution and Relocation (7 marks):**  
     Present the diminishing-marginal-utility resolution (using \(u(x) = \log_2(x)\) as an example) for the original game. Argue why this relocates the problem rather than solving it, unless a further assumption about \(u(x)\) is adopted.  

  3. **Accelerated Game Analysis (8 marks):**  
     (a) Compute the EMV of the accelerated game.  
     (b) For an agent with \(u(x) = \log_2(x)\), show that the original game yields finite expected utility, but the accelerated game yields infinite expected utility. Explain the significance of this contrast.  

  4. **General Condition and Plausibility (5 marks):**  
     State the general mathematical condition on \(u(x)\) that prevents *any* St. Petersburg-like game (with arbitrarily fast-growing payouts) from having infinite expected utility. Assess the plausibility of this condition for real-world decision-makers.  

  ---

  ### Model Answer (750 words)  

  #### 1. Conflict Analysis (5 marks)  
  The divergence of EMV in the St. Petersburg game conflicts with the **principle of finite entry price**: rational agents should only pay a finite amount to play a game with positive but bounded probabilities, regardless of the EMV. Specifically:  
  - **What it conflicts with**: The game’s infinite EMV suggests (via expected monetary value maximization) that a rational agent should pay any finite amount (e.g., £1 million) to play. However, in practice, people pay only modest sums, indicating a discrepancy between theory and behaviour. This challenges the descriptive adequacy of EMV maximization as a universal rationality criterion. Crucially, the conflict arises because EMV maximization ignores risk aversion, outcome dispersion, and budget constraints.  
  - **What it does not show**: Divergence alone does *not* imply that the game is "worth infinity" or that rational agents *must* pay arbitrary amounts. It merely reflects that the sum \(\sum p_i \cdot \text{payout}_i\) grows without bound. Rational agents might reject the game due to:  
    - Bankruptcy risk (high probability of losses if the entry fee exceeds typical payouts).  
    - Non-monetary constraints (e.g., time, cognitive limits).  
    Thus, divergence highlights a flaw in applying EMV to unbounded-payout games but does not prove that rationality demands infinite valuation.  

  #### 2. Resolution and Relocation (7 marks)  
  **Resolution via diminishing marginal utility**: To reconcile infinite EMV with finite willingness-to-pay, we replace monetary value \(x\) with utility \(u(x)\), where \(u\) is concave (reflecting diminishing marginal utility). For \(u(x) = \log_2(x)\):  
  \[
  \text{Expected utility (EU)} = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \log_2(2^n) = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot n.
  \]  
  This series converges (e.g., by ratio test), yielding finite EU (\(\approx 2\) utils). Thus, an agent maximizes EU by paying only up to \(2^2 = £4\) (since \(u(4) = 2\)).  

  **Relocation, not resolution**: This approach relocates the problem because:  
  - For any *unbounded* concave \(u(x)\) (like \(\log x\)), we can design a new St. Petersburg game with payouts growing fast enough to make EU diverge. For example, if payouts grow as \(x_n\) where \(u(x_n) \geq 2^n\), then \(\text{EU} \geq \sum (1/2)^n \cdot 2^n = \sum 1 = \infty\).  
  - Thus, diminishing marginal utility *shifts* the paradox from money to utility: unless \(u(x)\) has a strict upper bound, we can always construct a game with infinite EU, again suggesting irrational willingness to pay arbitrary amounts. The "further assumption" needed is that \(u(x)\) is **bounded above** (i.e., \(\exists M: u(x) \leq M \ \forall x\)). Without this, the paradox resurfaces for accelerated payouts.  

  #### 3. Accelerated Game Analysis (8 marks)  
  **(a) EMV calculation**: For payout \(2^{2^n}\) on first tails at \(n\):  
  \[
  \text{EMV} = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot 2^{2^n} = \sum_{n=1}^{\infty} 2^{2^n - n}.
  \]  
  Since \(2^n - n \to \infty\) as \(n\) increases, \(2^{2^n - n} \to \infty\). The series diverges as terms grow without bound.  

  **(b) EU for \(u(x) = \log_2(x)\)**:  
  - **Original game**: As above, \(\text{EU} = \sum_{n=1}^{\infty} (1/2)^n \cdot n < \infty\) (converges).  
  - **Accelerated game**:  
    \[
    \text{EU} = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \log_2(2^{2^n}) = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot 2^n = \sum_{n=1}^{\infty} 1.
    \]  
    This diverges to infinity.  

  **Significance**: The logarithmic utility function, which tames the original game, fails for the accelerated game because payouts grow faster than the "risk-aversion effect" of concavity. This demonstrates that diminishing marginal utility alone cannot prevent infinite EU for all payout structures—it only defers the problem to faster growth rates. The contrast underscores that unbounded utility functions remain vulnerable to St. Petersburg-like manipulations.  

  #### 4. General Condition and Plausibility (5 marks)  
  **General condition**: To prevent *any* St. Petersburg-like game from yielding infinite EU, \(u(x)\) must be **bounded above** (i.e., \(\exists M: u(x) \leq M \ \forall x > 0\)).  
  - **Why boundedness works**: If \(u(x) \leq M\), then \(\text{EU} \leq \sum p_i \cdot M = M < \infty\) for any game.  
  - **Why unboundedness fails**: If \(u(x)\) is unbounded, choose \(x_n\) such that \(u(x_n) > 2^n\) (possible by unboundedness). Set payout \(x_n\) with probability \((1/2)^n\). Then \(\text{EU} \geq \sum (1/2)^n \cdot 2^n = \infty\).  

  **Plausibility assessment**:  
  - **Arguments for boundedness**:  
    - **Psychological realism**: Humans exhibit satisficing (utility plateaus for extreme wealth).  
    - **Avoids absurdity**: Boundedness prevents "Pascal's mugging" (extreme bets on tiny probabilities).  
  - **Arguments against boundedness**:  
    - **Theoretical incompatibility**: Unbounded \(u(x)\) is needed for some rational choice axioms (e.g., continuity for arbitrary lotteries).  
    - **Empirical limits**: While utility grows slowly, no evidence proves it stops; agents may always value "more" (e.g., philanthropy).  
    - **Practical irrelevance**: Real payouts are finite (e.g., global wealth is bounded), making the condition overly restrictive.  
  In conclusion, bounded utility resolves the paradox but requires accepting a hard limit on utility, which is descriptively plausible (for human psychology) but normatively contentious (for idealized rationality).  

  ---

  ### Marking Scheme (25 marks total)  

  | **Part** | **Marks** | **Key Requirements for Full Marks** | **Common Errors (Deduct Marks)** |
  |----------|-----------|-------------------------------------|----------------------------------|
  | **1. Conflict Analysis** | 5 | - Clearly states conflict with finite entry price principle (2 marks). <br> - Explains divergence does *not* force infinite valuation (2 marks). <br> - Notes non-monetary constraints/bankruptcy (1 mark). | - Claims divergence "proves game is worth infinity" (–1). <br> - Vague appeal to "intuition" without precision (–1). |
  | **2. Resolution and Relocation** | 7 | - Correctly computes finite EU for original game with \(u(x) = \log_2 x\) (2 marks). <br> - Argues that unbounded \(u(x)\) allows new paradoxes via accelerated payouts (3 marks). <br> - Identifies boundedness as the "further assumption" (2 marks). | - Treats diminishing utility as a "fact" not an assumption (–2). <br> - Fails to link unboundedness to reconstructible divergence (–2). |
  | **3a. Accelerated EMV** | 3 | - Correct series \(\sum 2^{2^n - n}\) (1 mark). <br> - Recognizes divergence (terms → ∞) (2 marks). | - Incorrect payout exponent (e.g., \(2^{2n}\) instead of \(2^{2^n}\)) (–2). <br> - Claims convergence without justification (–2). |
  | **3b. Accelerated EU** | 5 | - Finite EU for original game (1 mark). <br> - Correct EU = \(\sum 1 = \infty\) for accelerated game (2 marks). <br> - Significance: Log utility fails for accelerated payouts (2 marks). | - Miscalculates \(\log_2(2^{2^n})\) as \(2n\) instead of \(2^n\) (–2). <br> - Omits contrast significance (–1). |
  | **4. Condition and Plausibility** | 5 | - States boundedness condition (1 mark). <br> - Explains why boundedness prevents divergence (1 mark). <br> - Assesses plausibility with pros/cons (2 marks). <br> - Notes real-world bounds (1 mark). | - Proposes insufficient conditions (e.g., concavity alone) (–2). <br> - One-sided plausibility assessment (–1). |

  **Total**: 25 marks.  
  **First-class threshold**: 20+ marks. Requires correct mathematical results, coherent explanation of the "relocation" argument, and balanced plausibility assessment.  

  ---  
  **Note to Candidates**: This question tests conceptual precision. Define all notation, justify convergence/divergence, and avoid vague appeals to "intuition." Marks are awarded for reasoning, not citations.
