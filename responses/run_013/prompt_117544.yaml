  Non-negotiable requirements: coherence (avoiding Dutch books) is probably essential. Treating future selves differently from experts might be negotiable depending on the framework. The user’s special case (uncertain reliability) is key here. If reflection requires deference even when reliability is doubtful, it becomes problematic. A weighted principle might be better but needs separate justification.

  Finally, is reflection a norm of rationality or just internal consistency? The user questions if it’s only for those bought into credences. If it’s the latter, what’s lost? Without reflection, agents risk diachronic incoherence, but enforcing it might demand unrealistic rationality. The verdict should balance these, noting that a weakened, reliability-sensitive version might be more realistic but less strict.
answer: |-
  Here’s the specification for an adequate principle of credal reflection, structured by your requirements. British English maintained throughout.

  ---

  ### **Desiderata for an Adequate Principle of Credal Reflection**  
  *(Aim: Diagnose violations in specific cases)*  

  #### **1. Cases the Principle Must Handle**  
  - **Self-locating uncertainty**:  
    *Case*: Sleeping Beauty (wakes up unsure if Monday/Tuesday; must assign credence to coin flip outcome).  
    *Requirement*: Must resolve whether Beauty’s current credence should match her expected future credence upon reawakening.  
  - **Epistemically compromised future self**:  
    *Case*: You know you’ll be drunk/concussed/exhausted later.  
    *Requirement*: Must **not** force deference to a future self with impaired reasoning.  
  - **Strictly better evidence**:  
    *Case*: Future self will see new data (e.g., additional experiment results).  
    *Requirement*: Must permit (or require) deference to better-informed future self.  
  - **Strictly worse evidence**:  
    *Case*: Future self will forget key information you currently possess.  
    *Requirement*: Must **not** require deference; may demand discounting future credence.  
  - **Persuasion by unknown argument**:  
    *Case*: You’re certain a charismatic debater will convince you of A later, but you can’t yet spot flaws in their reasoning.  
    *Requirement*: Must distinguish rational persuasion (due to new evidence/reasoning) from manipulation.  
  - **Your special case (uncertain reliability)**:  
    *Case*: Future self has better evidence *but* may reason poorly under time pressure.  
    *Requirement*: Must **weight future credence by expected reliability**, not treat as authoritative. *This is still "reflection" in a broad sense but requires a generalised principle (see §4)*.  

  #### **2. Critical Distinctions the Principle Must Preserve**  
  - **Better informed ≠ better at reasoning**:  
    *Requirement*: Principle must respond differently to *evidence gaps* (deference often apt) vs. *reasoning deficits* (deference often inapt).  
  - **Coherence constraint ≠ accuracy claim**:  
    *Requirement*: Must clarify if the principle avoids Dutch Books (coherence) or maximises truth-seeking (accuracy). These *can* conflict.  
  - **Future self ≠ external expert**:  
    *Requirement*: Deference to future self requires different justification than deference to an expert. Experts are static; future selves share your current epistemic state.  
  - **Certainty vs. mere expectation**:  
    *Requirement*: Must handle cases where you are *certain* of your future credence (e.g., via pill that forces belief) vs. cases where you merely *expect* it probabilistically.  
  - **Degrees of belief vs. outright belief**:  
    *Requirement*: Principle must specify if it governs credences only, or if a counterpart for categorical beliefs exists (e.g., "I’ll believe A outright tomorrow").  

  #### **3. Background Consistency Requirements**  
  - **Probability calculus**: Must not violate Kolmogorov axioms.  
  - **Conditionalisation**: Must cohere with Bayesian updating on new evidence.  
  - **Dutch Book argument scope**:  
    *Constraint*: Diachronic Dutch Books for reflection **only** show incoherence if you are certain of your future credence *and* plan to bet against yourself. Does **not** generalise to cases without certainty or betting dispositions.  
  - **Idealisation vs. feasibility**:  
    *Constraint*: Principle cannot require uncomputable expectations for real agents. Must state if restricted to idealised actors.  

  #### **4. The Core Conflict & Your Suspicion**  
  - **Conflict**:  
    *"Must bind when certain of future credence"* vs. *"Must not defer to epistemically worse-off future self"* **cannot both hold universally**.  
  - **Resolution**:  
    - **Drop absolute certainty requirement**. Replace with: **"Applies only if you rationally expect your future self to be *at least as reliable* as your current self."**  
    - *Cost*: Loses ability to handle cases like "drunk future self" or "manipulated belief" via reflection alone. These become exceptions ruled by auxiliary norms (e.g., "discount compromised agents").  
  - **Highest-impact requirement**:  
    **"Must not force deference to less reliable future selves"** does the most work in ruling out strict reflection principles.  

  #### **5. Non-Negotiables vs. Negotiables**  
  | **Requirement**                     | **Status**          | **Reason**                                                                 |
  |-------------------------------------|---------------------|----------------------------------------------------------------------------|
  | Avoids Dutch Books in core cases    | Non-negotiable      | Foundational for coherence.                                                |
  | Distinguishes evidence/reliability  | Non-negotiable      | Necessary for real-world applicability (§1 special case).                |
  | Handles self-locating beliefs       | Negotiable (camps)  | Some views (e.g., Halpern) reject reflection for self-locating credences. |
  | Demands deference to better evidence| Negotiable (camps)  | Subjectivists may reject any diachronic constraints.                       |
  | Covers outright belief              | Negotiable          | Most frameworks focus exclusively on credences.                            |

  #### **6. Verdict: Is This Rationality or Internal Consistency?**  
  - **Status**: Primarily a **norm of diachronic coherence** for agents committed to Bayesian credences.  
  - **What’s lost if abandoned?**  
    - **Coherence**: Agents may adopt bettable futures they *know* will disagree with their current optimal bets.  
    - **Pragmatic cost**: Unforced errors in sequential decisions (e.g., pre-committing to ignore future evidence).  
  - **Not a universal truth-seeking norm**: No guarantee reflection maximises accuracy if future selves are compromised.  
  - **Recommendation**: Use a **reliability-weighted reflection principle**:  
    > *Your credence now in A should equal your expected future credence in A, weighted by your current credence in your future self’s reliability.*  
    This satisfies §1’s special case but requires independent justification (e.g., minimising expected inaccuracy).

  ---

  **Final Summary**  
  A minimally adequate principle must: (1) handle reliability uncertainty via weighting, (2) reject deference to impaired future selves, (3) preserve core distinctions (evidence vs. reasoning), and (4) accept that certainty-based reflection fails when future reliability is dubious. The Dutch Book argument justifies coherence—not truth-seeking—and only under idealised conditions. **Best fit**: A reliability-constrained principle, sacrificing universality for realism. What’s lost? Simple, categorical solutions to puzzles like Sleeping Beauty.
