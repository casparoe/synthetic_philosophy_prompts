  Background consistency is another point. The principle must align with probability calculus, conditionalization, and Dutch book results. The user suspects Dutch book arguments might not force reflection alone, so addressing that tension is important. Also, the issue of idealization—whether the principle applies to non-ideal agents who can’t compute complex expectations.

