prompt: |-
  I am a novelist. For fifteen years I have been writing people who make judgments about beauty — a restorer who can tell a cleaned canvas from a forgery by the way the varnish sits, a conductor who insists the orchestra has the passage wrong, a character who weeps at a building and cannot say why — and I have now been asked to turn the preoccupation into a lecture, to a residency of writers and critics, on whether beauty is objective. I am not going to do Hume exegesis. I mean to state my own position, and before I stand up and state it I want to be sure the position is answerable to everything it ought to be answerable to. So write me the desiderata: not a defense of any view, but the specification that any adequate theory of aesthetic taste would have to meet.

  Take the target to be this. Such a theory must make sense of the fact that we treat some verdicts about beauty as better than others — that a judgment can be criticized, corrected, learned, that some people simply have better taste — while also honoring the fact that beauty is not a property like mass or charge, discovered by instruments and indifferent to whether anyone is moved. What I want from you is the list of what a theory has to get right in order to hold both of those at once.

  State each requirement, and behind it the case or consideration that forces it. I want the theory to have to answer for the following in particular, and I want to know what each one demands of it:

  - Two experienced viewers, neither confused and neither lying, each insisting the other has got it wrong, with no factual dispute between them to appeal to. What must the theory say is going on here, and what is it forbidden to say?
  - What I have seen called the acquaintance principle: that one cannot, it seems, genuinely judge the beauty of a thing one has never encountered, that second-hand verdicts, however well supported, ring hollow. What does this require of the theory?
  - The perfect forgery: a copy indistinguishable in every perceptual respect from the original it copies. Same beauty, or not? And notice what the answer commits you to about whether beauty lives in the surface or in the history.
  - The reliable fact that repeated encounters tend to increase liking. If taste is tracking something real, why should familiarity move the verdict? Put this to the theory as a constraint it cannot simply wave away.
  - The trained eye, ear, and palate: the expert discriminates structure in a work that the novice cannot perceive at all. Is this the theory's best evidence for a standard, or its worst embarrassment — does expertise track a property, or ingrain a convention?
  - The gap between liking and judging beautiful: the guilty pleasure one would not defend, the acknowledged masterpiece one does not enjoy.

  Then lay it out in exactly these sections and order:

  1. "The Target" (roughly 150 words): what a theory of taste is a theory of, stated precisely enough that it is clear what would count as failing at it.
  2. "The Requirements" (the bulk of the answer, roughly 900 words): the requirements, numbered, each with the case or consideration behind it and a note on why it is a requirement rather than a preference of some camp.
  3. "Non-negotiable and Negotiable" (roughly 200 words): which of the requirements you would defend as constitutive of the problem, and which are merely the commitments of one tradition or another.
  4. "The Tension Report" (roughly 300 words): any subset of the requirements you believe cannot be jointly satisfied, with the argument for the incompatibility. This is the section I most want; if the list is jointly unsatisfiable, then the list itself is the result.
  5. "Contenders Against the List" (roughly 250 words): briefly, how Hume's ideal critic, a Kantian universalism, a relativist or expressivist account, and a perceptual-expertise realism each fare against the requirements — a sentence or two apiece, no more.

  Do not give me a bibliography or cite sources; I have no library at hand and will not be checking any of it. Argue from the cases themselves.
reasoning: |-
  Okay, the user is a novelist who has spent 15 years writing about characters with deep aesthetic sensibilities. Now they've been asked to give a lecture on whether beauty is objective, and they need to develop their own position. They want a rigorous framework to test their theory against, not a bibliography or exegesis of existing philosophy.

  Hmm, the core challenge is balancing two seemingly contradictory truths: that aesthetic judgments can be wrong (some people have better taste) while beauty isn't a physical property like mass. The user lists six specific phenomena any adequate theory must explain - from expert disagreements to guilty pleasures. Interesting how they frame this as "what the theory must answer for" - almost like cross-examining philosophy.

  The structure they requested is telling. "Non-negotiable and Negotiable" suggests they anticipate conflicting demands, and "Tension Report" explicitly seeks incompatibilities. This isn't about finding easy answers - they want to expose where the problem resists solution. As a novelist, they probably value intellectual honesty over tidy resolutions.

  Noticing their examples all involve embodied expertise - restorers, conductors, people weeping at buildings. This grounds abstraction in sensory experience. Their rejection of Hume exegesis confirms they seek personal conviction, not academic performance. The "no bibliography" instruction is crucial - they want arguments born from lived aesthetic phenomena, not scholarship.

  The six test cases form a brilliant checklist: 
  1. Peer disagreement without factual basis 
  2. The unshareable nature of aesthetic experience 
  3. Whether history affects beauty 
  4. How familiarity breeds affection 
  5. If expertise reveals truth or constructs it 
  6. Why we judge beauty separately from pleasure

  Each pits objectivity against subjectivity. Take the perfect forgery puzzle: if beauty lives only in perception, identical twins should be equally beautiful - but art's history matters. Yet if beauty requires knowing origins, doesn't that make it conceptual rather than perceptual? The tension feels visceral here.

  For the tension report, the hardest knot seems to be reconciling the acquaintance principle (beauty requires direct encounter) with the existence of better taste. If beauty is irreducibly first-person, how can someone else's judgment be more valid? Expertise claims seem to collapse into authority without a shareable reality to reference.

  Their meta-critique of expertise in case 5 cuts deep. When oenologists detect notes invisible to novices, is that sensory truth or trained hallucination? The theory must avoid both the snobbery of "you'd agree if you understood" and the relativism of "anything goes."

  The guilty pleasure case is equally treacherous. We call things beautiful despite disliking them - but if beauty isn't pleasurable, what motivates the judgment? And if pleasure defines beauty, how do we condemn kitsch? This might point to beauty's normative dimension beyond mere liking.

  In contenders, Hume's ideal observer might handle expertise well but stumble on forgery history. Kantian universalism explains shared judgments but not why direct experience is irreplaceable. Relativism dodges tensions but makes disagreement meaningless. Perceptual realism captures immediacy but not conceptual gaps in judgment.

  Ultimately the novelist seems to seek not answers but the right questions - the irreducible contradictions that make beauty philosophically fertile and humanly compelling. The lecture's power may lie precisely in mapping where the mystery persists.
answer: |-
  ### 1. The Target  
  A theory of aesthetic taste must explain how beauty judgments can be *authoritative* (some are defensible as better-informed, more perceptive, or more correct) while acknowledging that beauty is *response-dependent* (it manifests only in human experience and vanishes without subjects to feel it). It fails if it reduces beauty to a physical property measurable like wavelength, or if it collapses into subjectivism where all verdicts are equally valid. Crucially, it must account for the *normativity* of taste—why we correct novices, defer to experts, and argue earnestly—without positing beauty as independent of human sensibility. The theory must hold that beauty is discovered *in* experience, yet transcends individual whim.

  ---

  ### 2. The Requirements  

  **Requirement 1: Accommodate Peer Disagreement Without Collapse**  
  *Case*: Two seasoned critics agree on all factual properties (brushwork, harmony, composition) yet irreconcilably disagree on beauty.  
  *Demand*: The theory must explain this as a non-arbitrary conflict—e.g., divergent *focus* (one attends to balance, the other to expressive tension), *sensitivity* (one detects nuance invisible to the other), or *contextual framing* (historical knowledge altering perception). It is **forbidden** to say both are "equally right" (denies normativity) or that one is "objectively wrong" (denies response-dependence).  
  *Why Requirement?* Because aesthetic disputes persist without recourse to new empirical data; the theory must honor disagreement’s intelligibility.

  **Requirement 2: Validate the Acquaintance Principle**  
  *Case*: A scholar knows every analysis of Chartres Cathedral but finds descriptions of its beauty empty until standing beneath its vaults.  
  *Demand*: The theory must ground beauty in *first-personal encounter*. It cannot treat beauty as a propositional fact transferable by testimony. Instead, it must tie beauty to *direct perceptual/cognitive-affective engagement*—e.g., the work’s particular presence triggering a unique synthesis of feeling and cognition.  
  *Why Requirement?* Second-hand judgments lack the lived force of aesthetic conviction; the theory must explain why beauty is *experienced*, not deduced.

  **Requirement 3: Resolve the Perfect Forgery Paradox**  
  *Case*: A copy identical to a Rembrandt in every visible detail. Is it as beautiful?  
  *Demand*: The theory must decide whether beauty resides *only* in perceptual properties (copy = original) or *also* in origin/history (only Rembrandt’s intent/struggle confers beauty). It cannot evade by saying "beauty is subjective"—the question forces a stance on whether beauty supervenes *only* on appearance.  
  *Why Requirement?* It probes if beauty is perceptual or historical. If the copy is less beautiful, beauty depends on non-perceptual facts. If equal, beauty is purely sensuous.

  **Requirement 4: Explain the Familiarity Effect**  
  *Case*: A grating avant-garde piece grows beloved after repeated hearings.  
  *Demand*: The theory must reconcile increased liking with *epistemic progress*. It cannot dismiss this as "mere exposure" bias. Instead, it might argue familiarity enables *deeper perception* (noticing latent structure), or *refined sensibility* (acquiring new capacities). It must show why repeated exposure isn’t *corrupting* taste but *developing* it.  
  *Why Requirement?* If beauty is discovered, why does time/contact alter verdicts? The theory must link aesthetic growth to perceptual/cognitive refinement.

  **Requirement 5: Account for Expertise Without Dogma**  
  *Case*: A sommelier detects terroir nuances imperceptible to a novice.  
  *Demand*: The theory must distinguish expertise from convention. Does training unveil objective features (e.g., structural complexity), or condition responses? It must avoid: (a) making expertise *infallible* (denies dispute), or (b) reducing it to *social power* (denies normativity). Expertise should track *discernible qualities* accessible in principle to all.  
  *Why Requirement?* Expertise is central to aesthetic practice but risks elitism; the theory must show how training *cultivates sensitivity*, not imposes dogma.

  **Requirement 6: Bridge the Liking/Judgment Gap**  
  *Case*: Loving a vapid pop song while judging it kitsch; respecting a challenging masterpiece while finding it cold.  
  *Demand*: The theory must separate *beauty* from *pleasure*. It might posit beauty as involving *admiration for achievement* or *fittingness to purpose*, distinct from hedonic reward. It **cannot** equate beauty with pleasure (fails for unenjoyable masterpieces) or dismiss pleasure as irrelevant (fails for guilty pleasures).  
  *Why Requirement?* Aesthetic life includes valuing what we don’t enjoy and enjoying what we disdain; the theory must explain this duality.

  ---

  ### 3. Non-Negotiable and Negotiable  
  **Non-Negotiable** (Constitutive):  
  - Peer Disagreement (R1): Without this, taste lacks normative stakes.  
  - Acquaintance Principle (R2): Denying it severs beauty from experience.  
  - Liking/Judgment Gap (R6): Collapsing them ignores core aesthetic phenomena.  

  **Negotiable** (Tradition-Dependent):  
  - Forgery Resolution (R3): Historicists (beauty in origin) vs. Perceptualists (beauty in appearance) can both meet other demands.  
  - Familiarity Effect (R4): Realists see perceptual education; subjectivists see altered preferences.  
  - Expertise (R5): Realists emphasize detection; constructivists emphasize acculturation.  

  ---

  ### 4. The Tension Report  
  The central tension lies between **R1 (Peer Disagreement)** and **R2 (Acquaintance Principle)**.  
  - **Conflict**: If beauty is irreducibly first-personal (R2), how can one critic’s verdict *correct* another’s (R1) without appealing to external facts? To say Critic A is "more sensitive" assumes a shared standard of sensitivity—but if the object’s beauty is only manifest *to* a subject, "sensitivity" risks being circular (A is sensitive because A perceives beauty, which is true because A is sensitive).  
  - **The Trap**: R2 demands beauty be *felt*; R1 demands it be *assessable*. If assessment relies on qualities beyond feeling (e.g., technical skill), beauty reduces to craftsmanship (violating response-dependence). If it relies on feeling alone, disagreement becomes intractable (violating normativity).  
  - **Outcome**: Any theory must either (a) posit a *shareable structure of experience* (e.g., Kant’s free play of faculties), risking abstraction from lived feeling, or (b) anchor authority in *communities of sensibility* (e.g., Hume’s ideal critics), risking relativism. Perfect reconciliation may be impossible—the tension defines the problem.  

  ---

  ### 5. Contenders Against the List  
  - **Hume’s Ideal Critic**: Excels at R5 (expertise) and R1 (resolving disputes via ideal observers), but struggles with R2 (acquaintance)—can an ideal critic’s verdict substitute for personal encounter?—and R3 (forgery: if perceptually identical, beauty *must* be equal).  
  - **Kantian Universalism**: Meets R1 (universal validity), R6 (disinterested pleasure ≠ liking), and R5 (expertise as cultivated judgment). Fails R2 (acquaintance principle is psychologically implausible for Kant’s a priori formalism) and R4 (familiarity effect challenges disinterest).  
  - **Relativism/Expressivism**: Trivially satisfies R2 (beauty is personal response) and R4 (familiarity alters preferences), but collapses R1 (disagreement is illusory), R5 (expertise is power), and R6 (no gap—beauty *is* liking).  
  - **Perceptual-Expertise Realism**: Best for R3 (beauty in perceptible properties) and R5 (expertise as acuity), but falters at R6 (why dislike perceptible beauty?) and R4 (why does acuity require repetition?).  

  ---

  This list defines the battlefield. Your theory must navigate these trenches—or declare why one should be abandoned. The tensions are the truth.
