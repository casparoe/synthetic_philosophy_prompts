answer: |-
  ### Research Proposal: Threshold Comparability Without Unit Commensurability in Lexical Negative Utilitarianism  
  **Central Claim**: Lexical-threshold negative utilitarianism (LTNU) requires only *threshold comparability*—a well-defined welfare level triggering lexical priority—and can reject *unit commensurability* (a common cardinal scale for pleasure/pain exchange), resolving the standard arbitrariness objection by treating threshold vagueness as a feature of value discontinuity rather than a defect.  

  ---

  #### 1. **Central Question**  
  Can LTNU non-arbitrarily define a welfare threshold that triggers lexical priority for suffering relief *without* presupposing unit commensurability between pleasure and pain, and if so, how does vagueness at the threshold clarify rather than undermine the view?  

  #### 2. **Gap in Existing Positions**  
  The standard objection—that a lexical threshold implies unit commensurability and thus appears arbitrary—arises because:  
  - **Classical utilitarians** assume unit commensurability as foundational, dismissing lexical thresholds as *ad hoc* additions to a unified scale.  
  - **Rigid lexical prioritists** (e.g., absolute negative utilitarians) avoid thresholds entirely by prioritizing *all* suffering relief, inviting impracticality objections (e.g., "dust speck" paradoxes).  
  - **Threshold utilitarians** (e.g., Crisp’s sufficientarianism) defend fixed thresholds but either presuppose unit commensurability (by anchoring thresholds to cardinal scales) or leave the threshold’s justification underspecified, conflating comparability with commensurability.  
  *Result*: All sides agree that a threshold requires a unified scale, leaving LTNU apparently incoherent. This project challenges that consensus by decoupling threshold *comparability* (identifying a welfare level) from unit *commensurability* (quantifying trade-offs).  

  #### 3. **Method: Three-Stage Work Plan**  
  *Why not stipulate a threshold?* Stipulation concedes arbitrariness and revives the commensurability objection. Instead, we:  
  - **Stage 1: Conceptual Disambiguation (Month 1)**  
    - *Task*: Formalize the distinction between unit commensurability (UC) and threshold comparability (TC) using decision-theoretic frameworks (e.g., interval scales for TC without cardinal UC).  
    - *Why*: To show UC is sufficient but *not necessary* for TC. A threshold only requires that welfare levels are ordinally ranked and that a discontinuity exists at a specific point—not that units above/below are interchangeable.  
  - **Stage 2: Vagueness as Diagnostic (Month 2)**  
    - *Task*: Analyze "switching-point" cases (e.g., *N* persons receiving mild pleasure vs. one spared agony) to test if indeterminacy arises from demanding UC-like precision for a TC-only threshold.  
    - *Why*: If vagueness persists when UC is excluded, it reflects ethical indeterminacy *in the world* (e.g., borderline welfare states), not theoretical inconsistency. Develop thought experiments to isolate vagueness from UC assumptions.  
  - **Stage 3: Threshold Characterization (Month 3)**  
    - *Task*: Propose a "fuzzy threshold" model using supervaluationist semantics: lexical priority applies definitively far below/above the threshold, while borderline cases require secondary principles (e.g., precaution against agony).  
    - *Why*: This preserves LTNU’s core commitment without UC, framing vagueness as a practical limitation requiring context-sensitive deliberation—not a failure of the theory.  

  #### 4. **Success vs. Failure Criteria**  
  - **Success**: Demonstrated by (a) a formally coherent model of TC without UC, (b) showing vagueness in switching cases is consistent with LTNU’s commitments, and (c) a defensible account of how agents ought to reason near the threshold.  
  - **Failure**: Defined by (a) collapsing TC into UC (reintroducing arbitrariness), (b) unresolved indeterminacy that collapses LTNU into strict lexical priority or utilitarianism, or (c) reliance on stipulation to fix the threshold.  

  #### 5. **Feasibility and Scope Reduction**  
  - **Feasibility**: The core conceptual work (Stages 1–2) is achievable in one summer; Stage 3 is ambitious but tractable if focused on framework design over full defense.  
  - **Cut if Necessary**: Stage 3’s "fuzzy threshold" mechanics (e.g., supervaluationist details) could be condensed to a proof-of-concept, deferring formal semantics to future work. Retain Stages 1–2 to establish the UC/TC distinction and vagueness diagnosis as the minimal publishable unit.  

  ---  
  **Project Significance**: Success would disarm the chief objection to LTNU, reframing vagueness as an insight into value discontinuity while opening pathways for non-commensurable thresholds in population ethics and welfare economics. Failure would clarify LTNU’s limitations, either strengthening the commensurability requirement or motivating alternative formulations.
