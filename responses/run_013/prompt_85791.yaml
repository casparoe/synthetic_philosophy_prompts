answer: |-
  The notion of truthlikeness, or verisimilitude, promises to capture the intuition that some false theories are better approximations to the truth than others, a cornerstone of scientific progress. Testing Popper's original definition on a simple case reveals its fatal flaw. Consider three independent atomic facts, A, B, and C. The actual world is A∧B∧¬C. Compare the false theory T1: A∧B∧C (all hold) with the false theory T2: ¬A∧¬B∧¬C (none hold). T1's true consequences include A, B, A∧B, and ¬(¬A∨¬B), while its false consequences include C, A∧C, B∧C, A∧B∧C, and ¬(¬C). T2's true consequences include ¬C, ¬(A∧C), ¬(B∧C), and ¬(A∧B∧C), while its false consequences include ¬A, ¬B, ¬A∧¬B, ¬(A∨B), and ¬(A∨C). Crucially, Popper requires that for T1 to be closer than T2, *all* of T2’s true consequences must be consequences of T1, and *all* of T1’s false consequences must also be consequences of T2. However, T2’s true consequence ¬C is *not* a consequence of T1 (which asserts C), and T1’s false consequence C is *not* a consequence of T2 (which asserts ¬C). Thus, neither theory satisfies Popper’s conditions for being closer to the truth than the other. This triviality result, demonstrated in this microcosm, shows the definition is fundamentally broken, rendering it useless for comparing any two false theories. It destroys the original consequence approach outright, not merely one formulation.

  Repairs focusing on "essential" consequences face significant challenges in non-arbitrarily defining relevance. The alternative "likeness" approach, measuring the average similarity of the possible worlds permitted by a theory to the actual world, initially seems promising. In our case, the T1-world (A,B,C) differs from the actual world (A,B,¬C) only in the truth-value of C. The T2-world (¬A,¬B,¬C) differs in the truth-values of A and B. Intuitively, changing one fact seems closer than changing two, suggesting T1 is more truthlike. This escapes the 1974 triviality result. However, it succumbs fatally to the vocabulary objection. Suppose we redescribe the world using logically equivalent predicates: define D = A∧B and E = ¬C. The actual world is D∧E. T1 (A,B,C) remains D∧¬E (since C implies ¬E). T2 (¬A,¬B,¬C) becomes ¬D∧E (as ¬A∨¬B implies ¬D). Now, the T1-world (D,¬E) differs from the actual world (D,E) only in E's value. The T2-world (¬D,E) differs in D's value. Changing E seems no worse than changing D – the intuitive closeness of T1 vanishes. The ranking reverses based solely on linguistic redescription, proving the measure lacks objective grounding.

  Consequently, while the *intuition* that Newtonian mechanics is closer to truth than Aristotelian physics holds merit, any formal, quantitative measure of truthlikeness appears indefensible. The consequence approach is irreparably damaged by triviality, and the likeness approach founders on vocabulary dependence, making truthlikeness an artefact of language rather than the world. Truthlikeness survives only as a comparative, informal notion applicable within a stable, shared conceptual framework. We can legitimately say, given our current physical concepts, that Einstein's theory is closer to the truth than Newton's *relative to specific phenomena*, but we cannot assign a meaningful metric or guarantee invariance across conceptual revolutions.

  This implies that science makes progress toward the truth not by monotonically increasing some abstract verisimilitude score, but by successively developing theories within evolving frameworks that better solve empirical problems, offer wider scope, and possess greater coherence – achievements that, while fallible, reasonably warrant the claim of approaching a more accurate understanding of reality.

  The strongest objection is that abandoning a formal measure of truthlikeness risks collapsing into relativism, denying any objective sense in which science progresses towards truth. If closeness is merely informal and framework-dependent, how is progress different from mere change? The answer lies in the constraining power of empirical adequacy and explanatory success. While no single metric captures "distance," the cumulative ability of later theories (within sufficiently stable domains) to retain the confirmed successes of predecessors while resolving their anomalies and extending predictive power provides robust, objective evidence of getting closer to how the world actually is. This progress, though not measurable by a single invariant "likeness" quantity, is demonstrably real and non-arbitrary. Thus, we retain the core idea of progress without the indefensible formal trappings of truthlikeness.
