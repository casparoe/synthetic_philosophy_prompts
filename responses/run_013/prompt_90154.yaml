  3. "Game rules lack real sanctions - how does this map to legal enforcement?" (Questions practical relevance)
  4. "Legal interpretation is inherently messy - your clean system ignores human factors" (Challenges computational metaphor)
  5. "What if players ignore your staging constraints? Your system has no answer." (The dreaded enforcement gap)

  I'll rank these by damage potential:
