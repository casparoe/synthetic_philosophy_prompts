prompt: |-
  I sit on the ethics comittee at a rehab hospital — I'm a physiatrist, not a philosopher, so forgive me if I fumble the theory part. We meet Thursday and I have to circulate a written opinion beforehand on a case that's turned into a fight about our pain policy. The patient is a man in his sixties, four weeks out from a stroke, here for shoulder rehab. Neurology says the lesion clipped the insula and they mentioned "pain asymbolia" on the way out the door and left me to look it up myself, which wasn't super helpful. What I can tell you is what he does: if you ask him to rate his shoulder on the 0–10 scale he says 7 or 8, every time, no hesitation; he says it's "burning" and puts one finger exactly on the spot. But he doesn't grimace, he doesn't guard the arm, he'll let the therapist move it through range without so much as a wince, he never asks for anything, and twice he's told the nurse it "doesn't really bother me." Once he asked her whether he was "supposed to mind." Our protocol — Comfort Protocol 4.2, which I helped write, so this is partly my mess — keys everything to the number: 4 or above, escalate the opioid, reassess in an hour; 3 or below, chart "pain controlled, continue." So the nurses are charting "severe uncontrolled pain" and pushing opioids at a guy who keeps refusing them, pharmacy is flagging sedation risk, and the surgeon wants him off everything so he'll actually move the arm.

  Meanwhile we have the mirror case two doors down: a woman on the same shoulder protocol who says "two out of ten" while she's crying, not sleeping, and refusing therapy because she dreads it, and her chart says "pain controlled, continue" and she gets nothing. So the working group is split three ways: some want to add a second documented axis for how much the pain bothers or distresses the patient and trigger escalation off that instead of the number; some say that's just giving clinicians a license to discount self-report, which is exactly how pain in women and Black patients got undertreated for decades, and that our one protection is the patient's own number; and a couple of people think the real question is whether the first patient needs treating at all, since if nothing about his pain is unpleasant then maybe there's nothing bad left to fix — though the PT says he's still destroying the joint. I need a memo I can circulate: a concrete recommendation (change the policy, don't, or change it with conditions), with a time frame and with what actually goes in the chart and what the nurse does at 2am, plus an honest pass at the strongest version of the argument I'm rejecting.

  Lead with the recommendation itself in the first sentence — what we should do and by when — then the reasoning. No preamble, don't restate my email back to me, and skip the part where you explain to me what pain asymbolia is.
reasoning: |-
  Okay, the user is a physiatrist on an ethics committee at a rehab hospital dealing with a complex pain policy dilemma. They need a memo with a concrete recommendation by Thursday, addressing two contrasting patient cases that expose flaws in their current protocol. 

  First, let's unpack the core tension: Their policy rigidly uses a 0-10 pain scale number to trigger interventions, but this fails both patients. The stroke patient with possible pain asymbolia reports high numbers but shows no distress, while the woman reports low numbers but exhibits severe suffering. The committee is divided between adding a "distress" metric (risking bias), sticking to numbers (failing both patients), or questioning whether to treat non-distressing pain at all.

  Hmm... the user's hidden challenges are multifaceted: As a non-philosopher, they need practical ethics, not theory. They helped write the flawed protocol so there's personal stake. The recommendation must survive night-shift nursing realities. And they're squeezed between neurology's vague input ("pain asymbolia, figure it out"), pharmacy's safety concerns, and PT's joint damage warnings.

  The strongest path forward is to decouple "pain intensity" from "pain-related suffering" in assessments. For the stroke patient, the priority is preventing physical harm from joint overuse despite his indifference. For the crying woman, we must treat her distress regardless of her low number. The memo must give nurses clear, bias-resistant tools: mandatory documentation of behaviors (guarding, sleep disruption etc.) alongside the number, and distress-specific scales that don't override self-report.

  Biggest landmine: The "distress" axis could be misused to dismiss marginalized patients' pain. Countermeasures: Require behavioral evidence for distress denial (like the stroke patient's lack of guarding), never accept "they seem fine" without proof. Pair this with staff training on pain equity – that woman crying at "2/10" is the canary in the coal mine for why we're doing this.

  For the stroke patient specifically – his care plan should focus on protecting the joint (splinting? movement limits?) since opioids won't help his asymbolia. Tell the surgeon PT can proceed aggressively. Pharmacy gets their win: no opioids for someone refusing them.

  Final memo structure: Lead with "Revise policy by X date" then immediately say what nurses chart at 2am. Preempt committee fights by naming the strongest counterargument (undermining self-report) and how we bulletproof against it. No philosophy lectures – just what to document, when to escalate, and how to not repeat history.
answer: |-
  **Recommendation:** Revise Comfort Protocol 4.2 by adding a mandatory "Functional/Suffering Impact" assessment alongside the 0-10 numerical rating scale, with clear behavioral triggers for escalation independent of the number, to be implemented hospital-wide within 90 days. Interim guidance (effective immediately): Nurses chart both the numerical rating *and* observed behaviors/distress level; escalate based on documented functional impairment or distress, not solely the number. Pharmacy holds opioids for patients refusing them, regardless of number.

  **Reasoning:**  
  The current protocol’s exclusive reliance on a single numerical pain rating fails patients like the stroke survivor (likely experiencing pain asymbolia) and the woman with undertreated suffering. Treating the number as synonymous with "uncontrolled pain" leads to inappropriate opioid pushes for indifferent patients and therapeutic abandonment for distressed ones. A dual-axis approach is ethically necessary to capture the *experience* of pain (beyond nociception) while protecting against bias.

  **Concrete Changes & Process:**  
  1.  **Charting (Effective Immediately - Interim):**  
      *   **Nurses/Therapists Document:**  
          *   Numerical Rating (0-10).
          *   **Observed Behaviors:** Guarding, grimacing, crying, sleep disruption, refusal of care/appetite, affect (e.g., "rates 7/10, smiles, allows full ROM without guarding," or "rates 2/10, tearful, refuses therapy, reports no sleep").
          *   **Patient Statement of Distress/Bother:** Direct quote if possible (e.g., "Patient states 'It doesn't really bother me,'" or "Patient states 'I can't stand it'").
          *   **Functional Impact:** Interference with therapy, mobility, ADLs, sleep.
  2.  **Escalation at 2am (Revised Protocol):**  
      *   **Trigger 1:** Numerical rating **≥ 4** *AND* documented distress/functional impairment → Escalate per algorithm (including non-opioid options), reassess.
      *   **Trigger 2:** Numerical rating **< 4** *BUT* documented significant distress (e.g., crying, refusing essential care) or functional impairment (e.g., refusing therapy due to pain dread) → Mandatory RN/MD consult for evaluation and non-opioid/focused intervention (e.g., anxiety management, therapy modification, topical).
      *   **Trigger 3:** Numerical rating **≥ 4** *WITHOUT* documented distress/functional impairment AND patient refuses medication → **Do not administer opioids.** Document refusal and behaviors. Notify MD/PT for evaluation of underlying cause (e.g., asymbolia) and non-pharmacological joint protection plan. Pharmacy does not override refusal based solely on high number.
  3.  **The Stroke Patient (Pain Asymbolia):**  
      *   **Chart:** "Rates shoulder pain 7-8/10 burning. No grimacing, guarding, or avoidance. Allows full passive ROM. States 'doesn't really bother me' and 'am I supposed to mind?' Refuses offered analgesics."
      *   **Action:** **Do not escalate opioids.** Notify MD/PT. Focus shifts to **joint protection** (PT educates on safe movement limits, considers temporary bracing if self-harm likely). Surgeon/PT can proceed with aggressive rehab. Pain number is monitored but not sole driver for analgesics.
  4.  **The Distressed Patient (Low Number/High Suffering):**  
      *   **Chart:** "Rates pain 2/10. Observed tearful during assessment, reports sleeplessness due to pain, refuses therapy sessions stating 'dreads the pain.' States 'It's too much.'"
      *   **Action:** **Escalate care** despite low number. Trigger MD consult for non-opioid strategies (e.g., targeted nerve block, anxiety meds, pre-therapy ice/heat/TENS). PT modifies approach (shorter sessions, graded exposure). Chart reflects "uncontrolled suffering impacting function."

  **Addressing the Strongest Counterargument:**  
  The most compelling objection is that introducing a "distress" or "bother" axis risks clinicians subjectively overriding patient self-report, perpetuating historical inequities in pain management (particularly for women, Black patients, and others whose pain expression has been dismissed). This is a serious and valid concern. **However, the current rigid numerical protocol *also* causes harm through undertreatment (for the distressed woman) and overtreatment (for the asymbolic man).** The revised protocol mitigates this risk by:  
  *   **Mandating documentation of *observable behaviors* (crying, guarding, refusal, sleep logs)** alongside patient statements, creating an objective record less prone to bias than subjective clinician impression alone.  
  *   **Prioritizing patient quotes** about distress ("I can't stand it") over clinician interpretation.  
  *   **Triggering action specifically *for* patients showing distress with low numbers**, directly countering undertreatment bias. It *forces* clinicians to look harder at suffering that might be minimized.  
  *   **Not allowing downgrading based on lack of distress alone.** A high number still triggers evaluation; the lack of distress/refusal only prevents *unwanted/unnecessary* opioid escalation.  
  *   **Staff Training:** Implementation MUST include mandatory training on pain equity, implicit bias, cultural competence, and recognizing diverse pain expressions to prevent misuse of the distress axis.

  **Conclusion:**  
  The goal is not to abandon self-report but to enrich it, recognizing that "pain" encompasses both sensation and suffering. This revision ensures opioids are used for patients experiencing *distressing* pain, prevents harmful overtreatment of indifference, and mandates intervention for suffering regardless of the number – all while demanding concrete behavioral evidence to guard against bias. Interim steps start now; full policy revision within 90 days allows for training and tool development (e.g., integrated e-charting fields).
