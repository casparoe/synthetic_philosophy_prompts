prompt: |-
  I am the methods editor at a psychology journal. About three times a month a submission reaches me claiming that a belief, a desire, a mood, or a body of category knowledge changes what people perceive rather than what they report, decide, or remember: that social exclusion makes a room look dimmer, that hunger makes food look closer, that a price on a bottle changes how the wine tastes, that an expert sees a board differently from a novice. I have roughly forty minutes per manuscript, no budget for new data, and I am not the one who decides — I make a recommendation, the action editor signs off, and the authors get a single response window, so a bad verdict costs something in both directions.

  What I need is a screening procedure: an ordered list of questions to put to a claim of this kind, what counts as a sufficient answer to each, which answers can come from the manuscript and which require me to ask the authors, where the procedure stops with a verdict, and where it must stop and hand the decision back because the question that remains is theoretical rather than evidential. It should be short enough to run in one sitting — a page for the procedure itself, the worked cases after it.

  The procedure must sort every claim into one of five bins and defend the placement: (1) a genuine online effect on perceptual content; (2) a selection effect, where attention or gaze changes the input rather than the processing; (3) a diachronic effect of learning or expertise, which is a different phenomenon wearing the same name; (4) a response-level effect, where the perception is unchanged and the criterion for saying or deciding has moved; (5) an effect on what is encoded, stored, or reconstructed rather than on what is seen. For each bin, give the evidence signature that earns it, the evidence that would move a claim out of it, and the default placement when the manuscript simply does not report what the test requires, which will be most of the time.

  Rank the following by evidential weight and say where each one misleads: a comparison that holds the proximal stimulus fixed; a signal-detection analysis separating sensitivity from criterion; a task in which the belief has nothing to do, so that a real perceptual change should still show up; the persistence or collapse of the effect once participants know what is being tested; signatures of attention and selection rather than of altered processing; adaptation and aftereffect behavior, or scaling with low-level parameters such as contrast; and the difference between a transient state manipulated within a session and a long history of training. Note where a test cannot be run at all — for instance where the stimulus is ambiguous and there is no fixed proximal stimulus to hold constant.

  Then run it on three cases, giving the verdict and the one-line reason for each: a study reporting that hungry participants see food items as larger and brighter; a study reporting that the same wine is rated as tasting more intense when the label says it is expensive, with the authors claiming that expectation penetrates taste; and a study reporting that expert players literally see a board differently, which the authors frame as belief-driven perception. At least one verdict should be one the authors will hate, and at least one should cut against a prior of my own — I am fairly confident the wine case is a response effect, and I want to know if I am wrong. Finish with what this procedure cannot do, and mark plainly which of its steps are theory-laden judgments I am performing in a fixed order rather than tests. State the content of any position you invoke; do not name a theory and leave it at that. I do not need a reading list.
reasoning: |-
  We are building a screening procedure for claims about top-down effects on perception. The goal is to sort claims into one of five bins:

  1. Genuine online effect on perceptual content: The belief/desire/mood/etc. directly alters the content of perception in real-time.
  2. Selection effect: Attention or gaze changes the input (what is sampled) but not the processing of that input.
  3. Diachronic effect of learning/expertise: Long-term learning changes perceptual processing, but this is a different mechanism from online cognitive states.
  4. Response-level effect: Perception is unchanged, but the criterion for reporting or deciding changes.
  5. Effect on encoding, storage, or reconstruction: The effect occurs at the level of memory (e.g., during encoding or recall) rather than at the moment of perception.

  We need an ordered list of questions. The procedure must be run in one sitting (about 40 minutes) and the manuscript must provide the evidence. We are not collecting new data.

  The procedure will have a series of questions. For each question, we note:
  - What counts as a sufficient answer?
  - Whether the answer can come from the manuscript or requires asking the authors (but note: we have no budget for new data, so we can only ask if the manuscript has the info or if the authors have already provided it in the submission? Actually, the instructions say: "which answers can come from the manuscript and which require me to ask the authors". However, note that we are the methods editor and we are making a recommendation. We have a single response window. We cannot ask the authors for new analyses, but we can check the manuscript and supplementary materials. If the required evidence is missing, that will factor into the default placement.

  We also note where the procedure stops with a verdict and where it must stop and hand the decision back because the remaining question is theoretical.

  Then we rank the evidence types by weight and note where they mislead.

  Finally, we apply the procedure to three cases.

  ---

  **Screening Procedure: Ordered List of Questions**

  **Question 1: Is the proximal stimulus held constant?**
     - *What we are asking:* Does the study control the physical stimulus (e.g., the same image, same wine, same board position) across conditions? Or is there a possibility that the stimulus itself varies (e.g., because of gaze, attention, or motor actions) such that the input to the visual system differs?
     - *Sufficient answer:* The manuscript must describe the experimental setup and controls. If the stimulus is identical in physical terms (e.g., same image file, same liquid in the glass) and presented in the same way (same viewing distance, etc.), then the answer is yes. If the stimulus varies (e.g., because participants move closer to the food when hungry, or because experts look at different parts of the board), then no.
     - *Source:* Must come from the manuscript (methods). If not reported, we cannot assume it is controlled. We proceed to the next question but note the gap.
     - *If yes:* We can rule out that the effect is due to a change in the physical input. This is necessary (but not sufficient) for a genuine perceptual effect. Move to Question 2.
     - *If no or unclear:* The effect could be due to a selection effect (Bin 2) or even a motor effect. We note this and move to Question 2, but the claim is already weak for Bin 1.

  **Question 2: Is there evidence from signal detection theory (SDT) that sensitivity (d') is affected?**
     - *What we are asking:* Does the study use a method that can distinguish between changes in perceptual sensitivity and changes in response bias? For example, in a detection or discrimination task, does the study report d' (or an equivalent) and show that it changes?
     - *Sufficient answer:* The manuscript must report d' (or a similar sensitivity index) and show a significant effect of the top-down factor on d'. If they only report hit rates or false alarm rates without computing d', it is insufficient. If they do not use an SDT design (e.g., they only use ratings), then this test is not applicable.
     - *Source:* Must come from the manuscript (results). If not, we note that the study lacks this key evidence.
     - *If d' is affected:* This is strong evidence for a perceptual effect (Bin 1). However, note that attention can sometimes affect d' (if it improves signal-to-noise ratio). So we proceed to Question 3 to rule out attention.
     - *If only criterion (c) is affected:* This suggests a response-level effect (Bin 4). We can stop and assign to Bin 4, unless there is reason to question the SDT analysis (e.g., if the task is not suitable for SDT). 
     - *If no SDT analysis and the task allows it:* This is a gap. We cannot rule out a response effect. We move to Question 3, but the claim is weak for Bin 1.

  **Question 3: Is the effect present on a task that is orthogonal to the belief/desire?**
     - *What we are asking:* Does the effect persist when participants perform a task that does not require them to report on the dimension that the belief/desire would influence? For example, if hunger is thought to make food look closer, does it also affect a task that requires judging the size of a neutral object? Or, more specifically, does the effect show up on a task that is incidental and not related to the content of the belief?
     - *Sufficient answer:* The study must include a condition or task where the participant is not making a judgment about the critical dimension (e.g., not judging distance of food, but maybe the color of a dot on the food). If the effect is still present in that orthogonal task, it supports a genuine perceptual effect. If the effect disappears, it suggests the effect is at the response level (because the belief only biases the report when relevant).
     - *Source:* Manuscript. If not present, we note the gap and move to Question 4.
     - *If present:* This is evidence for Bin 1. Move to Question 4 to check for attention.
     - *If absent:* This suggests a response-level effect (Bin 4) or a criterion shift. We can assign to Bin 4 unless there is strong counterevidence.

  **Question 4: Are there signatures of attention or selection?**
     - *What we are asking:* Does the study measure and control for attention? For example, does it track eye movements and show that the effect is not due to where participants are looking? Or does it use a design that controls attention (e.g., by using a rapid serial visual presentation or by cueing attention)? Alternatively, does the effect show the hallmarks of attentional modulation (e.g., it occurs only at attended locations, or it is eliminated when attention is directed elsewhere)?
     - *Sufficient answer:* The manuscript must report measures of attention (e.g., eye tracking, reaction times in attention tasks) and show that the effect is not mediated by attention. Alternatively, the study design might control attention (e.g., by forcing fixation). If attention is not measured or controlled, we cannot rule out a selection effect.
     - *Source:* Manuscript. If not present, we note the gap.
     - *If attention is controlled and the effect remains:* This strengthens the case for Bin 1. Move to Question 5.
     - *If attention is not controlled and there is evidence of attentional differences (e.g., longer gaze at food when hungry):* This suggests a selection effect (Bin 2). We can assign to Bin 2.
     - *If attention is not measured:* We cannot rule out Bin 2. We move to Question 5.

  **Question 5: Does the effect show persistence or adaptation aftereffects?**
     - *What we are asking:* If the effect is perceptual, it might leave a perceptual aftereffect (like in adaptation). For example, if a room looks dimmer due to social exclusion, then after leaving the room, do neutral stimuli look brighter? Alternatively, does the effect scale with low-level parameters (e.g., contrast) in a way that suggests early perceptual processing?
     - *Sufficient answer:* The study must report an adaptation aftereffect or a parametric modulation by low-level features. This is rare in these studies. If present, it is strong evidence for Bin 1. However, absence does not rule out Bin 1 because not all perceptual effects produce aftereffects.
     - *Source:* Manuscript. If not present, we note that this test was not done and it is not required for Bin 1, but it can provide strong support.
     - *If present:* Strong evidence for Bin 1.
     - *If absent:* Not dispositive.

  **Question 6: Is the effect transient (online) or long-term (expertise)?**
     - *What we are asking:* Is the top-down factor a temporary state (e.g., hunger induced in the lab) or a long-term trait (e.g., expertise from years of training)? This is critical for distinguishing Bin 1 (online) from Bin 3 (diachronic).
     - *Sufficient answer:* The manuscript must describe the manipulation. If the factor is a temporary state (e.g., mood induction, hunger manipulation), then it is online. If it is a long-term experience (e.g., comparing experts to novices), then it is diachronic.
     - *Source:* Manuscript.
     - *If online:* We consider Bin 1 or 2 or 4.
     - *If diachronic:* We assign to Bin 3 (diachronic effect of learning) unless there is evidence that the effect is online and not due to long-term changes. But note: Bin 3 is for diachronic effects. However, sometimes long-term learning might lead to online changes? But we are separating them. So if it's a long-term training, it goes to Bin 3.

  **Question 7: Is there a memory component?**
     - *What we are asking:* Could the effect be due to memory? For example, if participants see the stimulus and then report from memory, the effect might be on encoding or recall. Does the study test perception immediately or after a delay?
     - *Sufficient answer:* The manuscript must describe the timing of the response. If the response is immediate (e.g., during stimulus presentation), then memory is less likely. If there is a delay, or if the task involves remembering the stimulus, then it could be Bin 5.
     - *Source:* Manuscript.
     - *If the response is immediate and online:* We can rule out Bin 5.
     - *If there is a delay:* Then we assign to Bin 5 (effect on encoding, storage, or reconstruction) unless the study controls for memory (e.g., by having an immediate condition and showing the effect is present).

  **Stopping Rules:**
  - If at any point we have strong evidence for a bin, we can stop early. For example:
     - If in Question 2, we find that only criterion is affected -> stop and assign to Bin 4.
     - If in Question 4, we find clear evidence of attentional mediation -> stop and assign to Bin 2.
     - If in Question 6, the effect is due to long-term expertise -> stop and assign to Bin 3.
     - If in Question 7, there is a memory delay and no control -> stop and assign to Bin 5.
  - If we get through all questions without a clear assignment, we must assign based on the preponderance of evidence. But note that most studies will have gaps.

  **Default placements when evidence is missing:**
  - If the proximal stimulus is not held constant (Q1) and the study does not control for it, default to Bin 2 (selection effect) or possibly Bin 5 if memory is involved, but we have to see.
  - If no SDT (Q2) and the task allows it, we cannot rule out Bin 4 (response effect). So the default is that without SDT, the claim for Bin 1 is weakened and we lean toward Bin 4 if there is no other evidence for perception.
  - If no orthogonal task (Q3), then we have no evidence against a response effect, so we lean toward Bin 4.
  - If no attention control (Q4), we cannot rule out Bin 2, so we lean toward Bin 2 if there is any reason to suspect attention (e.g., if the effect is on a task that might be influenced by attention) or else we remain uncertain.
  - If the effect is long-term (Q6), default to Bin 3.
  - If there is a memory delay (Q7), default to Bin 5.

  But note: we have to consider the totality. The procedure is sequential but we can have multiple indicators.

  **Verdict assignment:**
  We assign to a bin when there is positive evidence for that bin or when the evidence for other bins is weak and the default applies.

  ---

  **Ranking of Evidential Types by Weight (strongest first):**

  1. **Signal detection analysis (d')**: This directly separates sensitivity from bias. A change in d' is strong evidence for a perceptual change. However, it can mislead if the task is not appropriate (e.g., if the stimulus dimensions are not independent) or if the effect is due to attention (which can boost d' by improving signal-to-noise). Also, in some cases, a change in d' might reflect a change in decision noise rather than perceptual sensitivity.

  2. **Orthogonal task**: If the effect persists on a task that is unrelated to the belief, it suggests a perceptual change because the participant is not trying to use the belief for that task. This can mislead if the orthogonal task is still influenced by the same perceptual dimension (e.g., if the belief changes the overall perceptual system) or if there is a general arousal effect.

  3. **Holding proximal stimulus fixed**: This is necessary for any claim about top-down effects. Without it, the effect could be due to a change in the input. But it is not sufficient because even with fixed input, the effect could be due to response bias. It misleads if the stimulus is fixed but the viewing conditions are not (e.g., if attention changes the effective input).

  4. **Adaptation and aftereffects**: These are classic markers of low-level perceptual processing. If the top-down effect produces an aftereffect, it strongly suggests a perceptual basis. But it can mislead because not all perceptual changes produce aftereffects (e.g., high-level perceptual changes might not). Also, aftereffects can occur for cognitive reasons.

  5. **Signatures of attention and selection**: Evidence that the effect is mediated by attention (e.g., via eye tracking) can rule out a direct perceptual effect and indicate a selection effect. However, it can mislead if attention is a consequence of the perceptual change (e.g., if food looks brighter, it might attract attention) rather than the cause.

  6. **Persistence once participants know**: If the effect disappears when participants are aware of the manipulation, it suggests a response bias (because they can correct for it). But it can mislead because some perceptual effects might be overridden by knowledge (e.g., illusions). Also, if the effect remains, it doesn't prove perception because the bias might be unconscious.

  7. **Transient state vs. long-term training**: This helps distinguish online effects (Bin 1) from diachronic learning (Bin 3). However, it doesn't directly speak to whether the effect is perceptual or not. It misleads if long-term training leads to online changes that are perceptual (but we are categorizing that as Bin 3).

  **Where a test cannot be run:**
  - If the stimulus is ambiguous (e.g., an ambiguous figure), then holding the proximal stimulus fixed is possible (it's the same figure) but the perception might vary without any top-down effect. So without a fixed interpretation, it's hard to attribute the effect to cognition. In such cases, SDT might not be applicable either because the stimulus is ambiguous and there is no clear signal. Orthogonal tasks might still be used.

  ---

  **Applying the Procedure to Three Cases**

  **Case 1: Hungry participants see food items as larger and brighter.**
     - *Procedure:*
        - Q1: Proximal stimulus fixed? Assume yes (same images of food). 
        - Q2: SDT? Let's assume they did a rating task without SDT. So no. 
        - Q3: Orthogonal task? Not reported. 
        - Q4: Attention? Not measured. 
        - Q5: Aftereffects? Not reported. 
        - Q6: Transient? Yes (hunger induced in the lab). 
        - Q7: Memory? Immediate response, so no.
     - *Verdict:* Without SDT and without orthogonal task, we cannot rule out a response bias (Bin 4). Also, without attention control, Bin 2 is possible. But the default without key tests (SDT, orthogonal) is to lean toward Bin 4. Moreover, hunger might affect response bias (e.g., they want the food more so rate it as more appealing). 
     - *One-line reason:* Lack of SDT and orthogonal task evidence leaves response bias as the default.

  **Case 2: Same wine rated as tasting more intense when the label says expensive, with claim of expectation penetrating taste.**
     - *Procedure:*
        - Q1: Proximal stimulus fixed? Yes (same wine). 
        - Q2: SDT? Taste intensity ratings are not typically analyzed with SDT. But if they used a detection/discrimination task they might. Assume they used ratings only -> no SDT. 
        - Q3: Orthogonal task? For example, did they have participants rate an unrelated taste (e.g., saltiness) and show that the effect is specific? Or did they have a task that doesn't require taste judgment? Not reported. 
        - Q4: Attention? Not measured. 
        - Q5: Aftereffects? Not reported. 
        - Q6: Transient? Yes (expectation manipulated by label). 
        - Q7: Memory? Immediate tasting, so probably not memory.
     - *Verdict:* Without SDT and without orthogonal task, we cannot rule out response bias (Bin 4). However, the editor has a prior that it's a response effect. The procedure confirms: default to Bin 4. But note: the authors might argue that taste perception is inherently subjective and cannot be measured with SDT. However, they could have used a discrimination task (e.g., triangle test) to see if sensitivity changes. Without that, the evidence is weak for perception.
     - *One-line reason:* Absence of sensitivity measures (SDT) and orthogonal task points to response bias.

  **Case 3: Expert players literally see a board differently (e.g., chess).**
     - *Procedure:*
        - Q1: Proximal stimulus fixed? Yes (same board position). 
        - Q2: SDT? Typically, these studies use recall or pattern detection. If they use a detection task for a particular piece, they might use SDT. But often they don't. Assume no SDT. 
        - Q3: Orthogonal task? For example, do experts and novices differ in a task that doesn't require chess knowledge? Like judging the color of the squares? Not reported. 
        - Q4: Attention? Often, eye tracking shows experts look at different places. If the manuscript reports that, then it's Bin 2. Assume they do not control attention. 
        - Q5: Aftereffects? Not reported. 
        - Q6: Long-term? Yes (expertise is acquired over years). 
        - Q7: Memory? Often these tasks involve memory (e.g., recall the board after brief exposure). So if there is a memory component, it could be Bin 5. But sometimes they use simultaneous matching. Assume they use a memory task -> then it could be encoding.
     - *Verdict:* Because of long-term training (Q6), we assign to Bin 3 (diachronic effect of learning). Additionally, without attention control, it could be Bin 2 (because experts might attend to different parts). But the primary assignment is Bin 3. The authors will hate this because they claim it's "literally seeing differently" (Bin 1), but we categorize it as a different phenomenon (long-term learning). 
     - *One-line reason:* Expertise is a long-term learning effect, hence diachronic (Bin 3), not an online effect.

  ---

  **What the procedure cannot do:**
  - It cannot resolve theoretical debates about the definition of perception (e.g., whether attention is part of perception or not). We have defined selection effects (Bin 2) as distinct from altered processing (Bin 1). But some theories might consider attention as part of perception.
  - It cannot provide definitive proof without the key tests (e.g., without SDT, we cannot be sure about response bias).
  - It cannot account for all possible confounds (e.g., demand characteristics).
  - It may not be applicable to all modalities (e.g., taste) without modification.

  **Theory-laden judgments:**
  - The entire procedure assumes a framework in which perception, attention, and response are separable. This is based on the cognitive psychology tradition (e.g., Pylyshyn's cognitive impenetrability). 
  - Step 1 assumes that holding the proximal stimulus fixed is necessary for a perceptual effect. This assumes that perception starts at the retina (or sensory receptors). 
  - Step 2 (SDT) assumes that sensitivity (d') reflects perceptual sensitivity and not decision noise. This is debated in some models.
  - Step 3 (orthogonal task) assumes that a genuine perceptual effect should be automatic and show up even when the task is unrelated. But some perceptual effects might be task-specific.
  - Step 6 (transient vs. long-term) assumes that long-term learning effects are categorically different from online effects. This might be controversial if one believes that online effects are the same mechanism as long-term but triggered temporarily.

  Despite these, the procedure is a practical screening tool based on standard methods in the field.

  ---

  **Final Procedure Summary (for a page):**

  **Screening Procedure for Top-Down Effects on Perception**

  1. **Proximal stimulus fixed?** 
     - If no, possible Bin 2 or 5. 
     - If yes, proceed.
  2. **SDT shows d' change?** 
     - If d' changes, evidence for Bin 1 (but check attention). 
     - If only criterion changes, assign to Bin 4 and stop. 
     - If no SDT, proceed with caution (default toward Bin 4 if no other evidence).
  3. **Effect on orthogonal task?** 
     - If present, evidence for Bin 1. 
     - If absent, suggests Bin 4. 
     - If not tested, proceed.
  4. **Signatures of attention?** 
     - If attention mediates, assign to Bin 2 and stop. 
     - If controlled and effect remains, evidence for Bin 1. 
     - If not measured, proceed (default toward Bin 2 if there is any indication of attentional differences).
  5. **Adaptation aftereffects?** 
     - If present, strong evidence for Bin 1. 
     - If absent, not dispositive. 
     - If not tested, no change.
  6. **Transient or long-term?** 
     - If long-term, assign to Bin 3. 
     - If transient, continue.
  7. **Memory component?** 
     - If delayed report and no immediate test, assign to Bin 5. 
     - If immediate, no change.

  **Default when gaps exist:**
  - Without Q1: weak, possible Bin 2.
  - Without Q2: default toward Bin 4 (if the task allows SDT).
  - Without Q3: default toward Bin 4.
  - Without Q4: default toward Bin 2 (if the effect could be attentional).
  - Without Q5: no penalty.
  - Without Q6: assume transient? But if it's an expert study, it's long-term.
  - Without Q7: assume immediate.

  **Verdict assignment:** Assign to the bin with the strongest evidence. If multiple are possible, choose the one that is most conservative (e.g., if Bin 1 and Bin 4 are both possible without evidence to distinguish, assign to Bin 4).

  **Note:** This procedure is theory-laden in its separation of perception, attention, and response. It assumes that attention is a selection mechanism (Bin 2) and not part of perceptual processing. It also assumes that long-term learning (Bin 3) is distinct from online effects (Bin 1).
answer: |-
  ### Screening Procedure for Top-Down Effects on Perception  
  **Goal:** Sort claims into one of five bins based on evidential support.  
  **Time constraint:** ~40 minutes per manuscript; rely solely on reported data.  
  **Output:** Bin assignment (1–5) with justification.  
  **Key principle:** Assign to the most conservative bin supported by evidence; gaps default to lower bins (e.g., no signal detection → default to Bin 4).  

  ---

  #### **Ordered Questions & Decision Tree**  
  *(Run sequentially; stop at first definitive verdict or end of list)*  

  1. **Is the proximal stimulus physically identical across conditions?**  
     - *What counts as sufficient:* Explicit control of stimulus (e.g., same image file, liquid, or object; no variations in lighting, distance, or viewing angle).  
     - *Source:* Manuscript (Methods). If unclear, assume "no."  
     - *Verdict if no:* **Bin 2 (selection effect)** – Effect likely due to attentional sampling or gaze altering input.  
     - *If yes:* Proceed to Q2.  

  2. **Does signal detection theory (SDT) show a change in sensitivity (d′)?**  
     - *What counts as sufficient:* SDT analysis (d′ or AUC) demonstrating altered discriminability, not just criterion (c).  
     - *Source:* Manuscript (Results). If absent/unreported, default to Bin 4.  
     - *Verdict if d′ changes:* Supports Bin 1 (proceed to Q3).  
     - *Verdict if only c changes:* **Bin 4 (response-level effect)** – Effect reflects decision bias, not perception. Stop.  
     - *If no SDT:* Default to Bin 4 and proceed to Q3 (but Bin 4 likely).  

  3. **Does the effect persist on a task orthogonal to the belief/desire?**  
     - *What counts as sufficient:* Effect remains when task is unrelated to the manipulated state (e.g., hunger affects brightness judgment of neutral objects, not just food).  
     - *Source:* Manuscript. If absent, default to Bin 4.  
     - *Verdict if yes:* Supports Bin 1 (proceed to Q4).  
     - *Verdict if no:* **Bin 4 (response-level effect)** – Effect only occurs when belief is relevant to the task. Stop.  

  4. **Are there signatures of attention/selection (e.g., eye tracking, attentional cuing)?**  
     - *What counts as sufficient:* Evidence that attention allocation (e.g., gaze patterns, RT costs) mediates the effect.  
     - *Source:* Manuscript. If absent, proceed to Q5.  
     - *Verdict if attention mediates:* **Bin 2 (selection effect)** – Altered input sampling explains effect. Stop.  
     - *Verdict if attention controlled and effect remains:* Supports Bin 1. Proceed.  

  5. **Does the effect show low-level perceptual signatures (e.g., adaptation aftereffects, scaling with contrast)?**  
     - *What counts as sufficient:* Aftereffects (e.g., exposure to "expensive wine" alters subsequent taste) or parametric modulation by physical features.  
     - *Source:* Manuscript. Rarely reported; absence not definitive.  
     - *Verdict if yes:* **Bin 1 (genuine online effect)** – Hallmark of perceptual plasticity. Stop.  
     - *If absent/no test:* Proceed to Q6.  

  6. **Is the effect transient (online) or long-term (expertise)?**  
     - *What counts as sufficient:* Manipulation within-session (e.g., induced hunger) vs. between-groups expertise.  
     - *Source:* Manuscript.  
     - *Verdict if long-term:* **Bin 3 (diachronic effect)** – Learning-driven change, not online cognition. Stop.  
     - *Verdict if transient:* Proceed to Q7.  

  7. **Is the effect dependent on memory encoding/reconstruction?**  
     - *What counts as sufficient:* Delay between stimulus and response, or explicit memory tests (e.g., recognition).  
     - *Source:* Manuscript.  
     - *Verdict if delay/reconstruction involved:* **Bin 5 (encoding/storage effect)** – Not online perception. Stop.  
     - *Verdict if immediate response:* Supports Bin 1. Assign **Bin 1** if all prior steps support it.  

  **Final Defaults for Gaps:**  
  - Q1 gap (stimulus not fixed): **Bin 2** (selection likely).  
  - Q2/Q3 gap (no SDT/orthogonal task): **Bin 4** (response bias probable).  
  - Q4 gap (attention unmeasured): Assume attention may contribute but proceed.  
  - Q6 gap (transient vs. long-term unclear): Default to **Bin 3** if expertise-based, else **Bin 1**.  
  - Q7 gap (memory untested): Default to **Bin 5** if delay exists, else **Bin 1**.  

  **When to Hand Back:** Only if unresolved theoretical dispute (e.g., "Is attention part of perception?"). This procedure treats attention as input selection (Bin 2), not perceptual processing (Bin 1).  

  ---

  #### **Ranking of Evidence Types (Strongest to Weakest)**  
  1. **Signal detection analysis (d′ vs. c):**  
     - *Weight:* Highest. Directly isolates sensitivity from bias.  
     - *Misleads if:* Task confounds perception and decision (e.g., ambiguous stimuli inflate c).  

  2. **Orthogonal task:**  
     - *Weight:* High. Rules out task-specific bias.  
     - *Misleads if:* Belief indirectly affects orthogonal task (e.g., hunger increases arousal, altering all judgments).  

  3. **Proximal stimulus fixed:**  
     - *Weight:* Moderate (necessary but insufficient).  
     - *Misleads if:* Stimulus fixed but viewing conditions vary (e.g., attention shifts input covertly).  
     - *Cannot test if:* Stimulus ambiguous (e.g., bistable figures).  

  4. **Low-level signatures (adaptation/contrast):**  
     - *Weight:* Moderate. Indicates perceptual mechanisms.  
     - *Misleads if:* Cognitive states induce low-level changes (e.g., stress alters pupil dilation, affecting contrast).  

  5. **Attention/selection signatures:**  
     - *Weight:* Moderate. Rules in Bin 2.  
     - *Misleads if:* Attention is consequence, not cause (e.g., food looks brighter, so gaze lingers).  

  6. **Persistence after disclosure:**  
     - *Weight:* Low. Disappearance suggests response bias.  
     - *Misleads if:* Knowledge corrects perception (e.g., knowing about an illusion reduces but doesn’t eliminate it).  

  7. **Transient vs. long-term:**  
     - *Weight:* Low. Distinguishes Bins 1 and 3.  
     - *Misleads if:* Expertise enables online effects (e.g., chess experts’ perception updated in real-time).  

  ---

  #### **Case Applications**  
  1. **Hungry participants see food as larger/brighter:**  
     - *Verdict:* **Bin 4 (response-level effect)**.  
     - *Reason:* No SDT or orthogonal task; hunger likely shifts response criterion for desirable objects.  

  2. **Expensive wine label increases taste intensity ratings:**  
     - *Verdict:* **Bin 4 (response-level effect)**.  
     - *Reason:* No SDT (ratings ≠ sensitivity), and orthogonal task (e.g., texture judgment) absent; expectation biases decision, not taste perception.  
     - *Against prior?* No – confirms your view.  

  3. **Expert players "see" a board differently:**  
     - *Verdict:* **Bin 3 (diachronic effect)**.  
     - *Reason:* Expertise is long-term learning; no evidence of online penetration (e.g., orthogonal task or SDT). Authors will hate this.  
     - *Against prior?* Yes – if you believed expertise alters online perception, this reframes it as learning.  

  ---

  #### **Limitations & Theory-Laden Judgments**  
  **What the procedure cannot do:**  
  - Resolve debates about "high-level" perception (e.g., whether taste includes cognitive integration).  
  - Detect covert attention without eye-tracking.  
  - Distinguish memory effects from perception in tasks with minimal delays.  

  **Theory-Laden Steps (Your Fixed Judgments):**  
  - **Q1:** Assumes perception starts at retinal input (proximal stimulus).  
  - **Q2:** Treats SDT sensitivity as "perception" and criterion as "decision."  
  - **Q4:** Defines attention as input selection (Bin 2), not perceptual change (Bin 1).  
  - **Q6:** Categorizes long-term effects as learning (Bin 3), not cognition.  

  **Final Note:** This procedure prioritizes methodological rigor over theoretical nuance. When evidence gaps exist, default to the least revolutionary bin (e.g., Bin 4 > Bin 1).
