answer: |-
  ## Adversarial Collaboration: The Nature of Convention

  **1. Agreed Claims**

  1.  Conventions solve recurrent coordination problems where multiple stable, self-sustaining patterns of behaviour (equilibria) are possible.
  2.  Conventions exhibit stability: once established, the behavioural regularity persists over time without requiring constant external enforcement.
  3.  Conventions are arbitrary in principle: an alternative regularity could have solved the same coordination problem just as well (e.g., driving on the left vs. right).
  4.  Conventions depend on the behaviour of others: an individual's reason to conform stems significantly from the expectation or observation that others are conforming.
  5.  Common knowledge *of the convention itself* (that "this is what we do") is typically present in mature conventions; agents know the regularity exists and know others know it exists.
  6.  Mutual expectation *of conformity* (each expects others to follow the regularity) is a robust empirical feature of most observed conventions.
  7.  Conventions are not merely statistical regularities; they involve a degree of normative force or perceived obligation, however weak ("that's just how it's done").
  8.  Conventions differ from laws backed by sanctions; their persistence relies primarily on interdependent expectations or behavioural reinforcement, not threat of punishment (e.g., traffic laws vs. driving-side conventions).
  9.  Money is a convention *only* in its function as a medium of exchange; its value relies entirely on the mutual expectation/observation that others will accept it.
  10. Language *usage* exhibits conventionality (e.g., word meanings), but its acquisition and some core functions may involve more than convention alone.

  **2. Where We Still Part Company**

  *   **Camp 1 (Mutual Reasoning):** Conventions are fundamentally constituted by a network of *interlocking mental states*: conditional preferences ("I prefer to drive on the left *if* others do"), mutual expectations of conformity, and common knowledge *of this entire interdependent structure*. Without these shared cognitive elements strategically supporting each other, the regularity lacks the specific normative character and resilience of a true convention.
  *   **Camp 2 (Population Dynamics):** Conventions are fundamentally *population-level equilibria* arising from simple behavioural mechanisms (imitation, reinforcement learning, success-biased copying, drift). These mechanisms reliably generate stable behavioural regularities that *look like* mutual expectations, even when agents lack the cognitive sophistication for genuine mutual reasoning or conditional preferences. The mental states Camp 1 describes are often a *by-product*, not the *cause*, of the convention.

  *   **Camp 1 (Mutual Reasoning):** The *stability and normative force* of a convention critically depend on the *correctness* of the mutual expectations underpinning it. If agents conform based on a *false belief* about why others conform (e.g., a repealed law), the resulting regularity lacks the self-sustaining resilience characteristic of a genuine convention.
  *   **Camp 2 (Population Dynamics):** The *stability* of a behavioural regularity as a convention depends on the *reinforcement dynamics* that maintain it (e.g., successful coordination reinforcing the behaviour). The agents' *explanations* for why the regularity exists or why others conform (e.g., belief in a repealed law) are largely irrelevant to whether it *functions* as a convention, so long as the behaviour persists due to interdependence.

  *   **Camp 1 (Mutual Reasoning):** Explaining how a convention *initially emerges* requires showing how the network of interdependent mental states could arise, potentially involving salience or precedent, but the core *sustaining* explanation remains this cognitive network.
  *   **Camp 2 (Population Dynamics):** Explaining how a convention *initially emerges and stabilises* is achieved by modelling population-level learning and copying dynamics. Appealing to complex mutual reasoning is often unnecessary and fails to explain conventions in cognitively limited agents or large populations.

  **3. The Cruxes**

  1.  **Cognitive Necessity:** Must agents possess the specific cognitive capacity for conditional preferences *and* mutual expectations *about mental states* for a stable regularity to count as a convention?
  2.  **False Belief Stability:** Can a behavioural regularity satisfying the surface conditions of a convention (including conditional preferences and mutual expectation *of behaviour*) remain stable *indefinitely* if the agents' beliefs about *why* others conform (e.g., belief in an enforcing law) are fundamentally mistaken?
  3.  **Mechanism Sufficiency:** Can population-level dynamics (imitation, reinforcement, drift) *alone* produce stable, self-sustaining conventions that exhibit normative force, without agents ever developing the interlocking mental states described by Camp 1?
  4.  **Prediction Divergence:** Do the two frameworks predict different outcomes in certain coordination problems (e.g., risk vs. payoff dominance) under conditions of limited cognition?

  **4. What Would Bear on Each Crux**

  | Crux                     | Relevant Evidence/Case                               | Camp 1 Prediction                                                               | Camp 2 Prediction                                                                 |
  | :----------------------- | :--------------------------------------------------- | :------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------- |
  | **1. Cognitive Necessity** | Behaviour of simple agents/animals, AI simulations, conventions in very young children. | Conventions will fail to emerge or be unstable without requisite cognition.     | Stable conventions will emerge via dynamics even in simple/limited agents.        |
  | **2. False Belief Stability** | **Case (a): The Repealed Law.**                      | Stability is fragile/illusory; convention will collapse once false belief is exposed. | Stability persists if behaviour is reinforced by successful coordination.         |
  | **3. Mechanism Sufficiency** | Simulations/experiments modelling convention emergence *only* via imitation/reinforcement. | Resulting regularity will lack normative force/resilience of true convention. | Resulting regularity will exhibit all functional properties of a convention.      |
  | **4. Prediction Divergence** | **Case (b): Risk vs. Payoff.** Low cognition, success-biased copying. | Ambiguous; depends on salience. *If* prediction differs, likely risk-dominant. | Convergence on risk-dominant equilibrium due to lower variance/more reliable payoff. |

  *   **Case (b) - Risk vs. Payoff:** Both camps predict convergence on the **risk-dominant equilibrium** under these conditions (low cognition, success-biased copying). **What this shows:** This outcome is compatible with *both* frameworks. Camp 2 sees it as direct evidence for dynamics. Camp 1 can accommodate it by arguing risk-dominance *is* salient or that the dynamics indirectly reveal a form of preference/expectation. It does *not* decisively favour one camp over the other. Where they *might* differ is if sophisticated agents with common knowledge could reliably achieve the payoff-dominant equilibrium – Camp 1 predicts they could, Camp 2 is sceptical it's stable without dynamics reinforcing it.

  **5. Is any of this just verbal?**

  *   **Shared Vocabulary:** Both camps agree on the core *functional* description: conventions are stable, arbitrary solutions to coordination problems maintained by interdependence. They agree mutual expectation *of behaviour* is typically present. They agree common knowledge *of the convention* exists. "Salience" might map onto "initial attractor" in dynamics.
  *   **Genuine Contradiction:** The core dispute is **causal/explanatory priority and cognitive requirements**:
      *   Camp 1 asserts the interlocking mental states are *constitutive and causally necessary* for the specific phenomenon of convention.
      *   Camp 2 asserts these mental states are *epiphenomenal or a possible consequence*; the fundamental cause is the population dynamics. Camp 2 denies the *necessity* of the specific cognitive machinery Camp 1 requires. Camp 1 denies that dynamics alone can produce the normative character they associate with convention. The disagreement over **Case (a)** highlights this contradiction.

  **6. Where I'm most likely to have got this wrong**

  Camp 2 might balk at **Agreed Claim 7** (normative force), arguing dynamics can produce behaviour indistinguishable from normative force without any internal sense of "ought". They might feel **Agreed Claim 4** leans too much towards Camp 1 by emphasising "expectation", preferring "observation of others' behaviour" as the dependency trigger. Regarding the **Disagreements**, Camp 1 might argue my phrasing for them under "False Belief Stability" doesn't sufficiently emphasise that the *falsity* undermines the *common knowledge of the interdependent reasons*, which is essential. Camp 2 might feel my phrasing for them under "Mechanism Sufficiency" underplays their argument that dynamics *create* the normative force, not just the regularity. The **Crux Table** prediction for Camp 1 on "Mechanism Sufficiency" might be contested; they might insist the simulation *must* lack something essential. The shared prediction on **Case (b)** might annoy purists in both camps who feel it glosses over deeper incompatibilities in *why* risk-dominance wins.

  **7. What would change my mind**

  *   **If Camp 2 is Correct:** Empirical evidence of a stable, normatively forceful convention emerging *and persisting* in a population of agents demonstrably incapable of forming mutual expectations *about mental states* or conditional preferences (e.g., certain simulations or animal behaviour). Crucially, **Case (a)** persisting stably long after the false belief is exposed and common knowledge of its falseness is established.
  *   **If Camp 1 is Correct:** Demonstrating that disrupting the *specific mutual expectations about reasons/preferences* (e.g., by revealing the truth in **Case (a)** in a way that destroys common knowledge of the interdependent structure) reliably causes the convention to collapse *even when* the behavioural reinforcement dynamics remain unchanged. Or, showing dynamics models *cannot* reproduce key features (like normative force or resilience to minor perturbations) without incorporating agents with Camp 1's cognitive apparatus.
  *   **If the Dispute Isn't Substantive:** Showing that the "normative force" Camp 1 cares about is *always and necessarily* a direct product of the reinforcement dynamics Camp 2 describes, making the mental states purely descriptive shadows. Or, conversely, showing that all successful population dynamics models implicitly rely on agents endowed with precisely the conditional preferences and expectation-forming capacities Camp 1 posits.
  *   **Weakest Reasoning:** My treatment of "normative force" in **Agreed Claim 7** and its relation to the camps is the most nebulous point. Defining and operationalising this empirically to distinguish the camps is extremely challenging. Camp 1's insistence on the necessity of complex cognition for true convention risks being unfalsifiable ("those agents *must* have hidden conditional preferences"). Camp 2's dismissal of rich mental states risks reducing convention to mere statistical regularity, potentially missing a crucial phenomenological or explanatory layer. The shared prediction on **Case (b)** highlights the difficulty in finding clean empirical separators.
