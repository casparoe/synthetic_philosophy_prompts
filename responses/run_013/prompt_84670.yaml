prompt: |-
  I am assembling a taxonomic backbone for a biodiversity database that has to reconcile records from bacteriologists, botanists, ornithologists and palaeontologists, and before I settle on a species concept I want the full specification of what one would have to deliver. Set out the desiderata for an adequate theory of species: the cases it must get right (ring species, obligately asexual and apomictic lineages, freely hybridising trees, prokaryotes that exchange genes laterally, fossil sequences with no sharp break), the distinctions it must not collapse (between the species category and a particular species taxon, between the concept and the operational criteria for applying it, between species as classes and as concrete historical lineages, and between there being species and our being able to delimit them), and the findings from evolutionary biology it cannot contradict (that species are lineages, and that monophyly, reproductive isolation and ecological cohesion can come apart). Add the constraints my own project imposes: the concept must be workable for non-specialists, must keep species counts comparable across the disciplines, and must sit alongside the nomenclatural codes, which tie names to type specimens. Then say which of these are genuine desiderata and which are artefacts of my database, which pairs cannot be jointly satisfied — that is the part I care about most — and which single requirement rules out the greatest number of candidate theories. I do not need the contenders scored against the list; the criteria are the deliverable.
reasoning: |-
  Okay, let me tackle this user's complex request. They're building a taxonomic backbone for a biodiversity database that needs to reconcile records from diverse fields like bacteriology, botany, ornithology, and paleontology. The core challenge is defining a species concept that satisfies multiple philosophical, biological, and practical constraints.

  First, I need to map all their requirements. The user wants:
  - Biological adequacy (handling ring species, asexual lineages, hybrids, etc.)
  - Philosophical distinctions (category vs taxon, concept vs criteria, etc.)
  - Evolutionary consistency (lineages, monophyly-reproduction-ecology tensions)
  - Project-specific needs (cross-discipline comparability, non-specialist usability, nomenclatural compatibility)

  The tricky part is identifying inherent conflicts. For example:
  - Universal applicability vs. precise species delimitation (prokaryotes vs. birds)
  - Historical lineage nature vs. type specimen requirement
  - Operational simplicity vs. theoretical robustness
  - Asexual lineage recognition vs. reproductive isolation criteria

  I notice the user particularly cares about which desiderata conflict. The biggest trade-off seems between universal applicability (including prokaryotes) and maintaining species as cohesive historical lineages. Many concepts fail here - Biological can't handle asexuals, Phylogenetic struggles with hybridization, Ecological ignores reproductive barriers. 

  The type specimen constraint also causes tension. Typological fixation clashes with species as dynamic lineages, especially for paleontology where specimens represent time slices. This might force operational compromises.

  For non-specialist usability, I consider how concepts translate to identification tools. Morphological criteria are accessible but biologically inadequate. DNA barcoding helps but has resolution limits. The solution may lie in tiered approaches or explicit pluralism within the database framework.

  The user's unspoken need appears to be: "How much biological reality am I forced to sacrifice for operational consistency?" They need to know which constraints are absolute (lineages vs. classes) versus negotiable (delimitation precision). The answer will shape whether they prioritize philosophical rigor or pragmatic harmonization across disciplines.
answer: |-
  Here is a breakdown of the desiderata for an adequate theory of species for your taxonomic backbone, categorized and analyzed for conflicts and feasibility:

  **I. Core Biological Desiderata (Must Get Right):**
  1.  **Ring Species:** Must account for geographically connected populations where terminal forms are reproductively isolated but intermediates interbreed.
  2.  **Obligate Asexuals/Apomicts:** Must meaningfully delimit species boundaries in lineages lacking sexual recombination (e.g., bdelloid rotifers, many bacteria, some plants/fungi).
  3.  **Frequent Hybridizers:** Must handle lineages that maintain distinct identities despite significant gene flow (e.g., many oaks, willows, corals, some birds/fish).
  4.  **Prokaryotes (HGT/LGT):** Must accommodate organisms where gene exchange is lateral, promiscuous, and decoupled from reproduction, not defining cohesive lineages in the same way as sexual eukaryotes.
  5.  **Fossil Sequences (Anagenesis):** Must recognize species in lineages showing gradual change over time without clear, instantaneous speciation events ("no sharp breaks").

  **II. Essential Conceptual Distinctions (Must Not Collapse):**
  6.  **Species Category vs. Taxon:** The *general concept* of what a species *is* must be distinct from any *particular* named species taxon (e.g., *Homo sapiens*).
  7.  **Concept vs. Operational Criteria:** The theoretical definition must be separable from the practical methods used to identify and delimit species (e.g., morphology, DNA barcoding, ecology).
  8.  **Class vs. Lineage:** Must clearly treat species as concrete, spatiotemporally bounded historical lineages (individuals) *not* as abstract classes defined solely by shared properties.
  9.  **Existence vs. Delimitation:** Must acknowledge that species *exist* as real evolutionary entities independent of our (often imperfect) ability to *delineate* their boundaries precisely.

  **III. Foundational Evolutionary Constraints (Cannot Contradict):**
  10. **Species as Lineages:** Must be fundamentally grounded in the understanding that species are segments of population-level evolutionary lineages.
  11. **Decoupling of Properties:** Must not require the coincident evolution of monophyly (shared common ancestry *exclusive* to the group), reproductive isolation (lack of gene flow), and ecological cohesion (shared niche/adaptive zone), as these evolve semi-independently.

  **IV. Project-Specific Constraints (Artefacts of the Database):**
  12. **Cross-Disciplinary Comparability:** Species counts/units must be broadly comparable across bacteriology, botany, ornithology, and paleontology.
  13. **Non-Specialist Workability:** Operational criteria derived from the concept must be applicable by non-experts in specific taxa (e.g., a database curator).
  14. **Nomenclatural Compatibility:** Must interface with existing Codes (ICN, ICNP, ICZN, ICVCN) that tie formal names to type specimens (fixed reference points), inherently introducing a (limited) typological element.

  **Analysis: Genuine Desiderata vs. Project Artefacts**

  *   **Genuine Desiderata (1-11):** These stem from the nature of biological diversity and evolutionary theory. Any adequate *general* theory of species must address them to be biologically realistic and philosophically sound.
  *   **Project Artefacts (12-14):** These are constraints imposed by the *practical need* for a unified, operational, nomenclaturally stable database usable by a broad audience. A purely theoretical concept might ignore these, but your application cannot.

  **Critical Conflicts: Pairs That Cannot Be Jointly Satisfied**

  1.  **Universal Applicability (1-5, especially 4) vs. Precise Delimitation & Cohesion (11):**
      *   *Conflict:* Prokaryotes (4) fundamentally challenge lineage cohesion due to rampant HGT. Concepts emphasizing strict lineage cohesion (e.g., strict monophyly or strong reproductive isolation) fail utterly for many prokaryotes. Conversely, concepts accepting loose cohesion for prokaryotes (e.g., based on genomic similarity) struggle to define cohesive units comparable to sexually reproducing eukaryotes (1-3) and may not reflect true evolutionary lineages (10). Satisfying 4 often weakens the definition of "cohesive lineage" needed for 1-3 and 11.

  2.  **Lineage Nature (8, 10) vs. Type Specimen Fixation (14):**
      *   *Conflict:* Species are dynamic lineages changing through time (8,10). Type specimens are static, single points in space and time, often representing only a tiny fraction of the lineage's variation or history. Reconciling the fluidity of the lineage with the fixed typological anchor required by nomenclature is inherently problematic, especially for widespread/variable species or in paleontology (5). The concept must bridge this gap.

  3.  **Non-Specialist Workability (13) vs. Complex Biological Realities (1-5, 11):**
      *   *Conflict:* Simple, universally applicable operational criteria (e.g., "morphology X" or "barcode gap Y") desirable for 13 often fail to capture the complexities of ring species (1), asexuals (2), hybridizers (3), prokaryotes (4), and gradual change (5). Accurate delimitation respecting evolutionary realities (11) typically requires expert, taxon-specific knowledge and complex data (genomics, ecology, behavior), conflicting with 13.

  4.  **Asexual Recognition (2) vs. Lineage Cohesion via Reproduction (11):**
      *   *Conflict:* Concepts relying heavily on reproductive isolation (e.g., Biological Species Concept) cannot satisfy 2. Concepts for asexuals often rely on arbitrary levels of genetic divergence or phenotypic clustering, which may not correspond to meaningful evolutionary lineages (10) or cohesive units comparable to sexual species (12), and conflict with the "decoupling" principle (11) by ignoring reproduction entirely.

  **The Single Most Exclusionary Requirement**

  *   **Prokaryote Applicability (4 - Handling HGT/LGT):** This requirement rules out the *greatest number* of prominent candidate theories.
      *   **Ruled Out:** Biological Species Concept (BSC - relies on reproductive isolation absent in prokaryotes), Recognition Species Concept (similar issues). Cohesion Species Concept (CSC - relies heavily on mechanisms preventing gene flow, problematic with HGT). Evolutionary Species Concept (ESC - often interprets "evolutionary role/tendency" in ways incompatible with rampant HGT blurring lineages). Phylogenetic Species Concepts (PSC - monophyly is severely undermined by HGT; diagnosability can be arbitrary and not reflect cohesive lineages). Ecological Species Concept (EcSC - niches can be shared/swapped via HGT).
      *   **Challenged:** General Lineage Concept / Unified Species Concept (GLC/USC) - While flexible, defining "cohesive lineages" and operationalizing them for meaningful, comparable prokaryote "species" remains a massive challenge directly due to HGT. It's the best candidate but struggles profoundly with requirement 4.

  **Conclusion for Your Project:**

  There is **no single species concept** that perfectly satisfies *all* genuine desiderata *and* your project constraints simultaneously. The conflicts, particularly **Universal Applicability (esp. Prokaryotes) vs. Lineage Cohesion/Delimitation Precision** and **Lineage Nature vs. Type Fixation**, are fundamental.

  Your backbone will necessitate **pragmatic compromises**. The **General Lineage Concept (GLC)** or **Unified Species Concept (USC)** provides the most *theoretically inclusive* framework (embracing 6-11), allowing different operational criteria (morphological, genetic, ecological) to be applied contextually to satisfy 1-5 and 12-14 *as best as possible*. However, acknowledge that:
  1.  Prokaryote "species" defined operationally (e.g., via average nucleotide identity - ANI) will *not* represent cohesive lineages in the same strong sense as many eukaryotic species.
  2.  Operational criteria will vary by group (e.g., ITS barcoding for fungi, COI for animals, ANI for bacteria, morphology + geography for fossils), impacting strict comparability (12).
  3.  Type specimens (14) remain anchors but cannot define the full dynamic lineage (8,10).
  4.  Non-specialist application (13) will sometimes lead to misassignment where complex situations (1,3,5) exist; expert review loops are crucial.

  The deliverable is an **operational framework grounded in the lineage concept (GLC/USC), explicitly acknowledging its limitations regarding prokaryotes and the typological-nomenclatural constraint, employing flexible, discipline-appropriate operational criteria, and accepting that species counts are estimates with varying meanings across the tree of life.** Transparency about these compromises is key.
