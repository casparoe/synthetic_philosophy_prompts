prompt: |-
  My oldest friend and I spent most of Saturday night arguing about lottocracy, and the argument went badly, because we were each defending a different institution while using the same word for it. I've since decided that the only way to get anywhere is to hold the recruitment mechanism fixed and vary only what the allotted body is actually empowered to do, and then ask which of the resulting designs is worth having. So for everything below, assume identical selection and support: members drawn by stratified lottery from the electoral register, mandatory service for those drawn, a generous per-diem, childcare, and a professional staff; deliberation in small facilitated groups before any plenary vote; and the same nominal size in every case. Vary only the institutional role. The five designs we kept sliding between are these. (1) A permanent allotted chamber with staggered two-year terms and a suspensive veto over ordinary legislation — it can force a bill back to the elected house for reconsideration, but cannot kill it, and it has no say over the budget or foreign affairs. (2) An ad hoc allotted assembly that exists only when a petition carrying the signatures of three per cent of the electorate forces one into being; it decides that single question, its decision is binding on the legislature, and the question's wording is fixed by the petitioners. (3) A standing allotted body with agenda power but no decision power: it chooses which questions go to the elected legislature or to a referendum, and never resolves anything itself. (4) Allotted panels that issue recommendations which the legislature is obliged to answer in writing, with reasons, within a fixed period — but with no binding force at all. (5) A second chamber in which half the seats are allotted and half elected, the two halves sitting and voting together as a single body.

  What I want is a comparative judgment rather than a general verdict. Please place all five in tiers — A, B, C — according to how much you would expect each, if it were actually running in a large liberal democracy over something like twenty years, to improve the epistemic quality of that country's collective decisions relative to its own status quo. Judge them by expected effect, not by how elegant the design is and not by how likely it is to be adopted, and give each a score between 0 and 1 alongside its tier. For each design, one or two sentences on the mechanism that drives your placement, and then name the single failure mode most likely to hollow it out. After that, tell me which of the five you think would degrade fastest and why — my friend's position, which I am not yet willing to concede, is that they all rot into either irrelevance or capture, and that the only real difference between them is the speed.

  One smaller thing, which may not be small: my friend wants the pool restricted to people who actually voted in the last general election, on the grounds that it screens for a minimum of civic engagement; I think that quietly reintroduces the very filter sortition was supposed to remove. Tell me whether that restriction would move any of your tier placements, and if so, which ones and in which direction.
reasoning: |-
  Hmm, the user presents a fascinating thought experiment about lottocracy designs. They've clearly done deep thinking about democratic innovation, having grappled with this through a heated debate with their oldest friend. The core request is a tiered evaluation of five distinct institutional roles for allotted bodies, all sharing identical selection/support mechanisms but varying in power.

  What stands out is their methodological rigor - they're isolating variables by holding recruitment constant while testing functional differences. This shows sophisticated systems thinking. Their frustration about semantic confusion ("defending different institutions while using the same word") resonates with many theoretical debates. 

  The evaluation criteria are precise: epistemic improvement over 20 years in a liberal democracy, judged by expected effect. They wisely exclude design elegance and adoptability. The secondary query about voter-pool restriction reveals awareness of how small tweaks can alter system dynamics.

  For each design, I need to:
  - Assign tier (A/B/C) + 0-1 score
  - Explain primary mechanism
  - Identify key failure mode
  - Compare degradation speed
  - Address voter-pool impact

  The designs represent major categories of deliberative democracy:
  (1) is a weak upper house analog
  (2) resembles citizens' initiative review
  (3) functions like an agenda-setting council
  (4) parallels advisory citizens' assemblies
  (5) is a hybrid chamber

  Epistemic quality hinges on how each design counteracts cognitive biases in elected bodies. Key variables include: insulation from short-term electoral pressure, quality of deliberation, agenda control, and feedback mechanisms. The voter-pool question touches on the representativeness vs. engagement trade-off - restricting to past voters might slightly boost baseline competence but at significant diversity cost.

  Notably absent is any mention of transparency requirements or media access, which would significantly impact all designs' effectiveness. Also unstated is whether the professional staff includes subject-matter experts or just facilitators.
answer: |-
  Below is a comparative evaluation of the five lottocracy designs based on their expected 20-year impact on the epistemic quality of collective decisions in a large liberal democracy. Tier **A** = Highest expected improvement, **B** = Moderate, **C** = Marginal/Neutral. Scores (0–1) reflect confidence in net epistemic gain relative to the status quo.

  ---

  ### **Tier Assignments & Analysis**
  1. **A (0.75)**: **Ad hoc binding assembly (Petition-triggered)**  
     *Mechanism*: Targets high-salience, contested issues with binding authority, forcing rigorous deliberation on specific questions. Avoids agenda capture by elites and focuses public attention.  
     *Failure mode*: Petitions weaponized by well-funded groups to frame questions manipulatively, turning assemblies into legitimizing tools for polarized agendas.  

  2. **B (0.55)**: **Standing agenda-setting body**  
     *Mechanism*: Shifts policy attention to neglected long-term issues (e.g., climate adaptation, pension reform) where elected bodies have blind spots. Breaks legislative inertia.  
     *Failure mode*: Legislature ignores or superficially engages with allotted proposals, reducing the body to symbolic "box-ticking."  

  3. **B (0.50)**: **Recommendation panels (with compelled response)**  
     *Mechanism*: Forces elected officials to confront public reasoning from diverse citizens, creating accountability for evidence-free policymaking. Deliberation depth is high due to focused mandates.  
     *Failure mode*: Legislators issue perfunctory, dismissive responses; media ignores reports, eroding visibility and impact.  

  4. **C (0.35)**: **Hybrid elected/allotted chamber**  
     *Mechanism*: Blends technical expertise (elected) and lived experience (allotted), potentially improving scrutiny of complex bills. Mutual deliberation could reduce partisan rigidity.  
     *Failure mode*: Elected members dominate discourse; allotted delegates defer or become co-opted by party factions.  

  5. **C (0.25)**: **Weak veto chamber**  
     *Mechanism*: Provides sober "second look" at legislation, potentially catching populist or poorly drafted bills via diverse perspectives.  
     *Failure mode*: Elected house overrides vetoes routinely, making it a ceremonial delay. Members disengage from low-stakes scrutiny.  

  ---

  ### **Degradation Speed Ranking**  
  **Fastest to slowest decay**:  
  **5 (Weak veto) → 4 (Hybrid chamber) → 3 (Recommendation panels) → 2 (Agenda-setter) → 1 (Ad hoc assembly)**  

  **Why**:  
  - **#5** degrades fastest as its suspensive veto invites ritualistic override by elected bodies, breeding cynicism. Low stakes discourage member engagement.  
  - **#4** decays quickly due to power asymmetry: elected members control coalitions and agendas, marginalizing allotted voices.  
  - **#1** resists decay longest because its *episodic, high-stakes* nature forces visible confrontations on contested issues, maintaining public relevance.  

  ---

  ### **Impact of Restricting Pool to Past Voters**  
  - **Tier changes**:  
    - **#1 (Ad hoc)** drops to **B (0.50)**: Excluding non-voters risks amplifying biases (older/wealthier/partisan voices), reducing issue diversity and legitimacy.  
    - **#3 (Panels)** drops to **C (0.30)**: Recommendations lose descriptive representativeness, making it easier for legislators to dismiss them as "unrepresentative."  
    - *No tier change for others*, but all suffer epistemic harm: **#2** and **#5** lose marginal voices crucial for agenda-balancing; **#4**’s hybrid structure already dampens diversity.  

  - **Why it matters**: This restriction reintroduces **class/age skews** (non-voters are disproportionately young, poor, or marginalized). Sortition’s core value—*descriptive representation*—is undermined, reducing the "wisdom of crowds" effect and reinforcing status quo blind spots.  

  ---

  ### Key Insights  
  - **Best epistemic value**: **#1** (Ad hoc) and **#2** (Agenda-setter) leverage sortition’s strengths *without requiring perpetual legitimacy*. They force the system to confront deliberative public judgment.  
  - **Worst trade-offs**: **#4** (Hybrid) and **#5** (Veto) dilute allotted influence, accelerating capture.  
  - **Critical vulnerability**: All designs risk **symbolic capture** if elites ignore outputs—but **#1**’s binding authority and **#3**’s compelled response create harder accountability.  

  Your friend’s "all rot" concern is valid for #4–#5 but overstated for #1–#3. **Decay isn't inevitable**—it hinges on institutional friction (#5) or design robustness (#1’s ad hoc nature insulates it). Restricting the pool *hurts all designs*, but cripples those relying on moral authority (#1, #3) most.
