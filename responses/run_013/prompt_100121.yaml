  Also, call out if the user tries to reduce this to interpretation—it's not just perspective; it's about the physical basis. But stay nuanced: grant that behavioral tests can't distinguish, our self-ascriptions are fallible, and it's genuinely hard. No strawmanning. Keep it conversational but rigorous. 

