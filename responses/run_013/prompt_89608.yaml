answer: |-
  Counsel, your argument conflates distinct textualist principles. First, on §2: "constructive notice" is an established term of art for what a reasonable inquiry would have revealed, *regardless* of actual knowledge. You concede the defect was latent and undiscoverable, so §2's bar applies. Your "ordinary sense" plea ignores that legal terms in statutes presumptively carry their technical meanings absent contrary definition—and §3 defines other terms but not this one. 

  Second, the whole-act canon requires harmony only where possible. When specific operative text (§2) conflicts with general purpose (§1), the specific controls. Here, §2’s condition is unambiguous: liability requires constructive notice. If that renders §1 hortatory or inoperative, so be it. 

  Third, §1 *is* enacted text, but purpose clauses frame context; they don’t rewrite unambiguous obligations. Using §1 to override §2’s plain terms would inject purpose improperly. 

  You claim textualism is covertly purposive when harmonizing provisions. Not so. We reconcile *enacted words*, not unenacted aims. If §2’s language creates a nullity, that’s a drafting failure—not a license to redraft. 

  **Question**: Does your complaint allege the seller *knew* of the defect? §2 speaks only to constructive notice. Actual knowledge might bear on other claims, but this Act’s remedy hinges solely on constructive notice. 

  Proceed—but address why we shouldn’t treat §2’s clarity as conclusive.
