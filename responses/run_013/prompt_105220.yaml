prompt: |-
  Ok so I'm trying to get Hobbes on geometry straight and I keep bouncing off one bit. I don't have the text in front of me, so this is my own mangled paraphrase, but the gist is something like: geometry is the science we can genuinely demonstrate, because the lines and figures we reason about are drawn and described by ourselves, i.e. we make them; and the same holds for civil philosophy, since we make the commonwealth ourselves; whereas with natural bodies we're not the makers, so we can't have that same kind of knowledge of them.

  What I can't work out is what the making is actually supposed to be doing. Is it a modest epistemic point — making a thing gives you causal acquaintance with it, so you can see why its properties follow from its construction? Or is it a stronger constructivist point, that geometrical objects are our artifacts through and through and have no nature independent of our drawing them? Hobbes obviously wants the modest version to carry over to politics, but a commonwealth isn't made by one reasoner the way a triangle is, so the analogy feels loose in a way I can't pin down.

  And here's what's really bugging me: Hobbes was famously bad at geometry — the circle-squaring business, the long public fight with Wallis, all of it. If the criterion is 'we make it, therefore we know it,' then his own failures look like counterexamples to the sufficiency of the criterion, or at least to the idea that being the constructor guarantees demonstrative knowledge. How would Hobbes, or a sympathetic Hobbesian, deal with that? Does it just show he was a bad geometer, or does it show the criterion was doing less work than he thought?

  A related worry: in his own system geometry is supposedly founded on motion — points moving generate lines and so on — but motion is a natural phenomenon, so doesn't that blur the very line he's trying to draw between the demonstrable (made by us) and the non-demonstrable (given to us)? And one more: if the criterion is about what we construct, could a Hobbesian claim demonstrative knowledge of a merely possible commonwealth — the state of nature story, say — but not of any actual historical one, since actual ones weren't constructed by the reasoner? That seems like a weird result and I want to know if it follows.

  Can you walk me through the passage and these worries? I'd especially like: the weakest and strongest readings of the we-make-it claim, which reading Hobbes actually needs for the politics to go through, whether the Wallis debacle is a real problem for the view or just for Hobbes's arithmetic, and whether the motion-foundation of geometry undercuts the distinction. Skip the citation stuff, I just want the arguemnt laid out clearly.
reasoning: |-
  Okay, the user is really wrestling with Hobbes' philosophy, specifically his claim that we can have demonstrative knowledge in geometry and civil philosophy because we "make" those things, but not in natural philosophy. They've got several worries: what "making" actually means, whether Hobbes' own geometry failures undermine his criterion, if the foundation of geometry in motion blurs his distinction, and whether demonstrative knowledge applies only to possible commonwealths.

  First, I need to unpack Hobbes' core argument. The key is his constructivist epistemology - we know what we build. For geometry, when we define a triangle and draw it, we control its construction, so we can deduce properties from definitions. Same with politics: we create commonwealths through covenants. Natural philosophy studies things we didn't make, so we can only hypothesize causes.

  The user seems stuck on three main issues: 

  First is the "making" ambiguity. Is it just causal acquaintance (modest view) or full-blown constructivism where objects depend entirely on us? Hobbes needs the modest version for politics to work - commonwealths aren't imaginary but real constructs with objective properties. The analogy holds because both involve creating from definitions.

  Then there's Hobbes' embarrassing geometry failures. This is awkward but doesn't break his system. His criterion is about possibility of knowledge, not infallibility of makers. A bad geometer proves nothing about geometry itself - just like a bad carpenter doesn't disprove knowledge of carpentry. Wallis exposed Hobbes' errors, but the method remains sound.

  The motion problem is trickier. If geometry is founded on physical motion (a natural phenomenon), doesn't that contaminate the "made by us" purity? But Hobbes treats motion conceptually - we define what motion means for geometry. The natural phenomenon inspires the concept but doesn't constrain it. This is a tension, but he'd argue definitions create a self-contained system.

  Finally, the possible vs actual commonwealth question. Hobbes would say we can demonstrate necessary features of any commonwealth made by covenant (sovereign power, obligation etc.), regardless of historical particulars. The state of nature is a conceptual tool to derive these necessities, not a blueprint. Actual commonwealths may deviate, but their demonstrable aspects come from the artificial construction logic.

  The user's really probing whether Hobbes' system coheres. They're noticing genuine tensions - especially between conceptual construction and physical foundations. I should acknowledge these while showing how Hobbes might respond. The politics analogy is stronger than they think because both domains rely on imposed definitions creating operational realities. His geometry failures are embarrassing but epistemologically irrelevant. The motion issue is the deepest problem - Hobbes might bite the bullet that geometric motion is idealized abstraction, not natural motion.

  What they probably need most is clarity on how the politics argument survives these challenges. The crux is that commonwealths, like geometric figures, are what they are because we define them into existence through specific acts (covenants/constructions). That's why we can deduce their properties - not from observation but from understanding their generative rules. The rest are complications Hobbes could navigate, if awkwardly.
answer: |-
  You've hit on one of Hobbes's most fascinating and contentious epistemological arguments. Let's break it down step-by-step, addressing your core concerns about "making," the geometry-politics analogy, his mathematical failures, and the role of motion.

  ### Core Hobbesian Argument (Reconstructed)
  1.  **The "Maker's Knowledge" Thesis:** True *scientia* (demonstrative, certain knowledge) is only possible where we are the **causes** or **makers** of the thing known.
  2.  **Geometry as Paradigm:**
      *   We define geometric concepts (point, line, circle) precisely.
      *   We construct figures (draw lines, circles) based on these definitions.
      *   Because we generate the object *from* our definitions and constructions, we can deduce its necessary properties with absolute certainty (demonstration). The properties flow logically from the act of generation we ourselves perform.
  3.  **Civil Philosophy (Politics) Analogously:**
      *   We define political concepts (right, obligation, covenant, sovereign) precisely.
      *   We understand the commonwealth as *artificially generated* by a specific human act: the covenant establishing sovereignty.
      *   Because we generate the commonwealth *from* these defined concepts and the covenant, we can deduce its necessary properties (e.g., necessity of sovereign power, source of obligation, conditions of peace) with demonstrative certainty.
  4.  **Natural Philosophy Contrasted:**
      *   We are *not* the makers/causes of natural bodies (rocks, stars, animals).
      *   We can only observe their effects and hypothesize about their causes.
      *   This yields only *probable* knowledge (opinion, conjecture), not *scientia*, because we lack access to the true, necessary generative principles.

  ### What "Making" Does: Weak vs. Strong Readings
  *   **Weak (Modest Epistemic) Reading:** Making grants **epistemic access**. By being the cause, you have direct insight into the causal generation of the object's properties. You see *why* it must have property X *because* you built it that way. This is primarily about understanding necessary causal connections derived from the generative act.
  *   **Strong (Radical Constructivist) Reading:** Making constitutes the **very existence and essence** of the object. Geometric figures *only* exist as mental constructs or physical drawings we create; they have no independent, Platonic reality. Their properties are *entirely* stipulated by our definitions and constructions.
  *   **What Hobbes Needs (and Likely Holds):** He needs the **Weak Reading for Politics**, but the **Strong Reading subtly supports it**. For politics to work, the commonwealth *must* be a real, existing thing with objective properties (like enforcing peace), not just a mental fiction. However, its *form* and *essential properties* are determined by the artificial act of human covenant. Its "nature" *is* its artificial construction. The Weak Reading explains *how* we know it (access to generation). The Strong Reading emphasizes that its *defining characteristics* are imposed by human artifice, unlike natural things with intrinsic, independent natures. **The analogy holds because both geometry and the commonwealth are *artificial systems* whose essential properties are determined by their stipulated rules of construction/generation.**

  ### Addressing Your Worries

  1.  **Hobbes's Geometry Failures (The Wallis Debacle):**
      *   **The Problem:** If being the maker guarantees knowledge, why was Hobbes so bad at geometry?
      *   **Hobbesian Defense (Sympathetic):**
          *   **The Criterion is About *Possibility*, Not Infallibility:** Hobbes claims that demonstrative knowledge *is possible* in geometry *because* we make the objects. He does *not* claim that *every* maker *always* achieves perfect knowledge. Human error, flawed definitions, or faulty reasoning (like Hobbes's own) are always possible.
          *   **Geometry vs. Geometer:** The failure is Hobbes *as an individual geometer*, not a failure of geometry *as a science*. Wallis demonstrated errors in Hobbes's *specific constructions and deductions*, not that geometric demonstration itself is impossible. Hobbes's criterion explains *why* geometry *can* be certain; his personal failures show he sometimes failed to meet the standard his own theory sets.
          *   **Sufficiency vs. Necessity:** "Making" is a *necessary condition* for this *type* of knowledge (demonstrative *scientia*), not a *sufficient condition* guaranteeing every individual will flawlessly achieve it. Skill, rigor, and correct reasoning are still required.
      *   **Conclusion:** It's an embarrassment for Hobbes the man, but not a fatal blow to his epistemological criterion. It shows the criterion does less *practical* work for fallible humans than the *theoretical* claim might suggest, but the core distinction between maker's knowledge and conjectural knowledge remains.

  2.  **Motion Blurs the Line? (Geometry founded on Natural Motion):**
      *   **The Problem:** If geometry is founded on the concept of motion (point moving traces a line), and motion is a natural phenomenon, doesn't this ground geometry in the "non-made" natural world, undermining the purity of the distinction?
      *   **Hobbesian Response (Likely):**
          *   **Conceptual Abstraction, Not Physical Instantiation:** Hobbes distinguishes between the *physical phenomenon* of motion (studied in natural philosophy) and the *abstract concept* of motion used in geometry. Geometry uses motion *as defined by us* ("motion" meaning the abstract, idealized tracing of a path by a dimensionless point).
          *   **We Define the Generative Principle:** The key is that we *stipulate* the generative rule: "A line is the path traced by a moving point." This rule is a human definition, not a description of observed physical motion. The *concept* of motion is used *as a tool we define* for constructing geometric objects.
          *   **The Foundation is Definitional:** The ultimate foundation is the definition of "point" and the rule of generation ("motion" in the abstract sense). The *inspiration* comes from nature, but the *geometric concept* is constructed by abstraction and definition.
      *   **Conclusion:** This is a tension, but Hobbes would argue the blurring is minimal. Natural motion *suggests* the concept, but geometry operates solely on the *abstracted, defined concept* of motion we create for that purpose. The "making" is in the act of definition and construction using this conceptual tool.

  3.  **Demonstrative Knowledge of a *Possible* Commonwealth?**
      *   **The Question:** Does the "we make it" criterion mean we can only have *scientia* of *possible* commonwealths (like the state of nature model), not actual historical ones (which we didn't personally construct)?
      *   **Hobbesian Position:**
          *   **Knowledge of Essence, Not Accident:** Hobbes seeks knowledge of the *essential, necessary features* of *any* commonwealth *as such* – the logic of sovereignty, obligation, and peace arising from the covenant. This is knowledge of the *artificial kind* ("Commonwealth-ness") generated by the covenant.
          *   **The State of Nature is a Conceptual Tool:** The state of nature story isn't primarily about a possible commonwealth; it's an analytical device to demonstrate the *necessity* of the covenant and sovereign power *for* a commonwealth to exist and function. It reveals the essential generative principle.
          *   **Actual Commonwealths Instantiate the Form:** An actual historical commonwealth *is* an instance of this artificial kind *if* it arose from some form of covenant (explicit or tacit) establishing sovereignty. We can have demonstrative knowledge of its *essential political structure and logic* (how sovereignty *must* function for it to be a commonwealth) precisely because that structure is defined by the generative act (covenant) we understand. We don't need to have made *that specific* commonwealth; we understand the *type* of thing it is and how its essential properties are generated.
          *   **Historical Contingencies are Not the Object of *Scientia*:** The specific historical details, personalities, or deviations from the ideal model *are* objects of conjecture (natural/historical philosophy), not demonstrative political science.
      *   **Conclusion:** It's **not** a weird result for Hobbes. We *can* have demonstrative knowledge of the essential properties of *actual* commonwealths *insofar as they are artificial entities generated by covenant*. The knowledge is of the universal form instantiated in the actual entity, derived from understanding the generative act. The state of nature model helps *derive* these universal necessities, but the knowledge applies to any real commonwealth that embodies the form.

  ### Key Takeaways
  *   **"Making" means being the defining cause:** It grants access to the necessary properties arising from the generative act (definitions + construction/covenant).
  *   **Analogy holds on the Weak Reading:** Both geometry and politics deal with artificial systems whose essential properties are determined by human-defined rules of generation. We know them because we designed the generative rules.
  *   **Hobbes's math fails are personal, not theoretical:** The criterion explains the *possibility* of geometric certainty; human error explains his failures.
  *   **Motion is a conceptual tool:** Geometry uses an *abstracted, defined concept* of motion, insulating it (in Hobbes's view) from dependence on natural philosophy.
  *   ***Scientia* applies to actual politics:** We know the necessary logic of *any* commonwealth generated by covenant, including actual ones, because we understand the generative principle (covenant -> sovereignty).

  Hobbes's core insight is powerful: **Certainty is found in the realm of artifacts – things whose essence is defined by our own constructive rules.** The tensions you identify (especially around motion and his own mathematical practice) are real and point to limitations, but the fundamental distinction between maker's knowledge (geometry, politics) and conjecture about given natures (natural philosophy) remains the backbone of his system, and it's what allows him to claim a "science" of politics on par with geometry.
