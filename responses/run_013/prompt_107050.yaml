  I'm a software engineer with no formal philosophy background, though I'm at home with functions, orderings, and protocol specs. I'd like you to take Arrow's impossibility theorem and restate it entirely in the vocabulary I already use: a system that collects the ranked preferences of several clients and must emit a single system-wide ranking, where the design requirements read like an API contract — the merge depends only on how the inputs rank each pair of options, unanimous first choices must carry through, and no single client may always dictate the result. Translate the theorem and the argument behind it into those terms as faithfully as you can, resisting the urge to add engineering assumptions that aren't in the original. Then give me the residue report: which parts survive the translation intact, which survive only once I quietly change what I mean by "the inputs" or "the output," and which have no counterpart at all in how I'd normally reason about merging inputs. I'm especially interested in whether the residue marks something my engineering vocabulary is missing, or instead shows that the original claim was less precise than it looked.
