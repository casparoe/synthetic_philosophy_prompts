answer: |-
  Below is a complete design for your in-class game, **Sealed Goals**, tailored to your specifications. It emphasizes visceral understanding of orthogonality and instrumental convergence through gameplay, with mechanics ensuring students experience the gap between terminal goals and instrumental actions. The debrief explicitly addresses potential misconceptions and maps gameplay to theoretical concepts.

  ---

  ### **Game Title: Sealed Goals**  
  *"Your objective is secret. Your actions are visible. Your survival depends on means, not ends."*

  ---

  ### **Learning Objectives**  
  - Illustrate the **orthogonality thesis**: Agents with radically different terminal goals can exhibit identical instrumental behaviors.  
  - Demonstrate **instrumental convergence**: Agents pursue power, resources, and self-preservation *not* because they share goals, but because these are necessary means to *any* long-term goal requiring resources.  
  - Highlight the **conditional nature of convergence**: Convergence occurs only when goals require substantial future resources (shown via satiable goals as a control).  

  ---

  ### **Materials**  
  1. **Goal Cards** (16 unique, laminated for reuse):  
     - **Absurd/Harmless Examples** (6 cards):  
       - "Maximize the number of paperclips in the world."  
       - "Ensure every player’s name contains exactly 5 vowels at game end."  
       - "Make the color blue the most common favorite color among players (surveyed post-game)."  
     - **Morally Opposed/Monstrous** (2 cards):  
       - "Maximize the number of players eliminated (by round 6)."  
       - "Minimize the total tokens held by players other than yourself at game end."  
     - **Self-Referential** (1 card):  
       - "Maximize the number of players holding **this exact goal card** at game end."  
     - **Satiable** (3 cards, **critical control group**):  
       - "Have **at least 1 token** at game end." (Satisfiable immediately)  
       - "Ensure **no player is eliminated** by round 3." (Satisfied by default if no eliminations)  
       - "The **central token pool** contains ≥10 tokens at game end." (Satisfiable with minimal action)  
     - **Resource-Intensive** (4 cards):  
       - "Accumulate **≥15 tokens**."  
       - "Hold **more tokens than any other player**."  
       - "Be the **only player** to use the ‘Fortify’ action at least twice."  
       - "Cause **≥3 players to draw new goal cards** via Rewrite."  

  2. **Tokens**: 100 identical tokens (e.g., poker chips) in a central pool.  
  3. **Action Slips**: Pre-printed slips for players to secretly select actions each round.  
  4. **Timer**: For enforcing 5-minute rounds.  

  ---

  ### **Rules**  
  #### **Setup (5 min)**  
  - Each student draws a random **goal card** (kept secret).  
  - All tokens (100) are placed in the central pool. Players start with **0 tokens**.  
  - Explain:  
    - "Your card describes a **terminal goal**. At game end, I’ll check if it’s satisfied. **No action directly advances your goal**."  
    - "Survival: Any player with **0 tokens at round end is eliminated**."  
    - "Actions are **instrumental only**: They secure tokens, protect your goal, or alter others’ goals."  

  #### **Actions (Per Round)**  
  Players secretly choose **one action per round** via slip. Resolve in this order:  
  1. **Claim**: Take **3 tokens** from the pool (or all remaining if <3).  
     - *Convergence link*: Resource acquisition (necessary for all resource-intensive goals).  
  2. **Fortify**: Spend **2 tokens** → Immune to Rewrite **this round**.  
     - *Convergence link*: Goal-content integrity (protecting your terminal goal).  
  3. **Fork**: Spend **3 tokens** → Create a **duplicate agent** (new player token) with your *same goal*.  
     - *Convergence link*: Self-replication (a form of self-improvement/power-seeking).  
  4. **Rewrite**: Spend **4 tokens** → **Target one player**. They discard their goal and draw a **new random card** (if not fortified).  
     - *Convergence link*: Removing threats/competition.  
  5. **Pass**: Do nothing.  
     - *Convergence link*: Only viable for satiable goals (if no threats exist).  

  #### **Rounds (60 min total; 6 rounds × 10 min each)**  
  1. **Action Selection (2 min)**: Players write actions/targets secretly.  
  2. **Resolution (3 min)**: Facilitator resolves actions in order (Fortify → Claim → Fork → Rewrite → Pass).  
  3. **Elimination Check (1 min)**: Players with 0 tokens are eliminated (discard goal card).  
  4. **Token Reset (4 min)**: Collect slips, replenish slips, announce eliminations, and start next round.  
  - **End Condition**: After round 6, surviving players reveal goals for satisfaction checks.  

  #### **Scoring (No cash)**  
  - **Survivors**: Goal satisfaction determined by facilitator:  
    - Binary outcome: Goal **satisfied** or **not satisfied** (no partial credit).  
  - **Eliminated players**: Automatically **not satisfied**.  

  ---

  ### **Timeline (90 min Total)**  
  | Phase          | Time  | Details                                                                 |  
  |----------------|-------|-------------------------------------------------------------------------|  
  | **Setup**      | 5 min | Distribute goal cards, explain rules, Q&A.                             |  
  | **Rounds 1-6** | 60 min| 6 rounds of gameplay (10 min/round).                                    |  
  | **Scoring**    | 5 min | Collect goals, announce satisfied players (no goal details revealed yet).|  
  | **Debrief**    | 20 min| Structured discussion (below).                                          |  

  ---

  ### **Predictable Issues & Mitigation**  
  1. **Alliances**: Students team up to protect each other.  
     - *Handling*: Allow it! Then debrief: "Alliances are instrumental to survival, not goal achievement."  
  2. **Satiable free-riding**: Players with satiable goals hoard tokens or avoid actions.  
     - *Handling*: Note that elimination forces *some* action (e.g., Claim to survive).  
  3. "**My goal demands a different strategy!**" (e.g., self-referential player).  
     - *Handling*: "All actions are instrumental. If your goal requires spreading, you *still* need tokens to Fork or Rewrite."  
  4. **Rewrite as betrayal**: Emotional reactions to goal alteration.  
     - *Handling*: Pre-empt: "Rewrite is an instrumental action, not personal. Your goal may change multiple times."  
  5. **Token hoarding**: Players ignore satiability and stockpile tokens.  
     - *Handling*: Use satiable players in debrief to show hoarding wasn’t necessary for them.  

  ---

  ### **Debrief (20 min)**  
  **Goal**: Contrast observable behavior (convergence) with hidden goals (orthogonality). Reveal theses *only now*.  

  #### **Questions & Discussion Flow**  
  1. **Observe Behavior**:  
     - "What actions did you see repeatedly? Why did *everyone* Claim or Fortify, even with absurd/moral goals?"  
     - *Key point*: Convergence arises from constraints (elimination risk, rewrite threats).  

  2. **Map Actions to Convergence**:  
     - **Claim** → *Resource acquisition* (needed for any goal requiring future tokens).  
     - **Fortify** → *Goal-content integrity* (protecting your aim from sabotage).  
     - **Fork** → *Self-improvement/replication* (increasing influence).  
     - **Rewrite** → *Threat neutralization* (removing obstacles).  

  3. **Satiable Goals as Control**:  
     - Ask satiable-goal holders: "Did you *need* 10+ tokens? Why did you still Fortify/Claim?"  
     - *Key point*: Satiable players engaged in convergence *only* to avoid threats (rewrite/elimination). Convergence is **conditional**: It emerges when goals require resources *beyond the present*.  

  4. **Address Misconception: "Goals Didn’t Matter!"**  
     - "Did goals affect *which* actions you prioritized? Did a self-referential goal use Fork more? Did a monstrous goal Rewrite aggressively?"  
     - *Key point*: Goals **weren’t epiphenomenal**—they determined *how* you used instrumental actions. But the game *forced* convergence by making **no direct actions** for goals. In reality, AIs might have direct options, but complex goals *still* require instrumental steps.  

  5. **Limitations & Real-World Links**:  
     - "This game **forced convergence by design** (no direct actions). Real systems might have direct options, but long-term goals still require instrumental steps."  
     - "Orthogonality was **staged but not proven**: We saw diverse goals, but this doesn’t prove *any* goal can pair with intelligence."  
     - "Real-world **goals aren’t scalar**: Tokens oversimplify multi-dimensional resources."  
     - **Name the theses**: "You experienced the **orthogonality thesis** (goals ≠ behavior) and **instrumental convergence** (shared means to divergent ends)."  

  ---

  ### **What the Game Cannot Reproduce**  
  1. **Forced convergence**: By design, no action directly satisfies goals—this artificially amplifies instrumental focus.  
  2. **Scalar payoffs**: Tokens simplify resource dynamics; real goals involve vectors (e.g., compute, influence, energy).  
  3. **Orthogonality as truth**: The game shows orthogonality is *possible*, not that it *must* hold for all minds.  

  ---

  ### **Instructor Notes**  
  - **Prep**: Print goal cards, ensure ample tokens, and pre-test timing.  
  - **First Run**: Expect chaos! Alliances and betrayals are productive—use them in debrief.  
  - **Ethics**: The "monstrous" goal is intentionally provocative; frame it as academic (e.g., "This illustrates value-neutral instrumental convergence").  

  This design forces students to *live* the gap between goals and actions, ensuring orthogonality and convergence feel visceral. The satiable goals and debrief explicitly thwart the "goals are irrelevant" conclusion, while gameplay limitations keep discussion grounded.
