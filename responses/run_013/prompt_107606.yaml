  First, I notice their core tension: they need academic rigor but operate like journalists—no archive access, generalist writers, must defend decisions to a producer in plain English. The unspoken pressure? Entertainment value vs historical integrity, especially when vivid scenes (like that single-source death scene) tempt narrative impact over accuracy.

  Hmm, their constraints reveal past trauma: burned by false corroboration ("one lost account" haunting multiple sources), suspicious of criteria used to "rescue favorite claims." Smart. They're essentially asking for a bullshit detector that doesn't default to "ancient=unreliable." 

  The three test cases are brilliantly chosen to stress-test the method:
  - (a) Targets the heartbreak of killing a compelling but poorly attested scene.
  - (b) Explores how "against-interest" logic can be weaponized.
  - (c) Forces confrontation between textual claims and material evidence.

  I'll build the procedure like an assembly line—each step a filter, with clear "reject," "proceed," or "judgment call" outputs. Key moves:
  1. Demote technical terms (e.g., "tendency criticism" becomes "What did this author gain by saying this?"). 
  2. Treat sources as human products, not truth vessels. Ask: "Could they know? Why would they say it?"
  3. Crucially, distinguish "no evidence" from "evidence against"—they're not the same.

  For the criteria dissection:
  - Load-bearing: Independence, material evidence, transmission path. These catch real problems.
  - Flimsy: Embarrassment/dissimilarity (too easy to spin), "harder reading" (subjective). They'll get caveats.

  In the walkthroughs:
  - (a) Will fail at Step 3 (transmission gap). Painful but necessary.
  - (b) Will show how "against-interest" crumbles if the enemy source loves shaming opponents.
  - (c) Will pivot on whether the number violates known capacities (e.g., Herodotus' million-man army vs Persian logistics).

  The honesty check: Yes, some claims *can't* be mechanically resolved. The procedure must flag: "Here's the uncertainty; your call based on narrative purpose." That's not failure—it's intellectual integrity.

  Finally, I'll avoid flowchart temptation. Real history is messier. Instead, a step sequence with off-ramps, like a "You are here" map for credibility assessment.
answer: |-
  Here’s a reusable, step-by-step decision procedure for vetting pre-modern factual claims, designed for non-specialists under time constraints. It prioritizes plain language, flags judgment calls, and avoids historical baggage. The tests are ordered to eliminate unreliable claims early and highlight irreducible uncertainty.

  ---

  ### **The Decision Procedure: 10 Tests in Order**
  *(Technical terms in brackets; use them only if needed for reference)*

  1. **COULD THE AUTHOR PHYSICALLY KNOW THIS?**  
     *Ask: "Was the author alive at the time/place of the event? If not, could they access records or reliable witnesses?"*  
     → **Reject** if no plausible path to knowledge (e.g., a Roman writing about pre-literate Britain).  
     → **Proceed** if yes or if transmission path is uncertain (judgment call #1).  
     *Why it works:* Filters physically impossible knowledge.

  2. **WHAT’S THE SOURCE’S TRANSMISSION PATH?**  
     *Ask: "Is this source original, or copying/rewriting an earlier one? Can we trace its sources?"*  
     → **Reject** if proven to derive from a single, unreliable/lost source (e.g., later chronicles copying a biased predecessor).  
     → **Proceed** if independent or transmission unclear (mark as "uncertain sourcing").  
     *Why it works:* Exposes false corroboration.

  3. **IS THERE MATERIAL EVIDENCE AGAINST THE CLAIM?**  
     *Ask: "Do archaeology, climate data, or demography flatly contradict this?"*  
     → **Reject** if impossible (e.g., an army larger than regional population).  
     → **Proceed** if no conflict or if evidence is ambiguous.  
     *Why it works:* Anchors claims in physical reality.

  4. **WOULD THE AUTHOR HAVE A MOTIVE TO LIE? [Tendency criticism]**  
     *Ask: "What did the author gain by asserting this? Does it fit their agenda?"*  
     → **Reject** if clear, self-serving distortion (e.g., propaganda).  
     → **Proceed** if motive is unclear or if claim *hurts* the author’s cause.  
     *Key distinction:* Motive to distort ≠ inability to know. Flag which applies.

  5. **IS THE CLAIM PLAUSIBLE WITHIN ITS CONTEXT?**  
     *Ask: "Does this align with how we know people/societies behaved?"*  
     → **Reject** if violates basic human/natural behavior (e.g., speech in a battle where no witness survived).  
     → **Proceed** if plausible or culturally specific (judgment call #2).  
     *Why it works:* Uses historical anthropology as a sanity check.

  6. **IS IT ATTRIBUTED TO AN EYEWITNESS?**  
     *Ask: "Does the source cite a witness? Is that witness credible?"*  
     → **Upgrade confidence** if yes and witness has no clear bias.  
     → **Proceed** if unattributed or witness reliability unclear.  
     *Why it works:* Eyewitness testimony isn’t infallible but adds weight.

  7. **IS IT SELF-DAMAGING OR EMBARRASSING? [Embarrassment criterion]**  
     *Ask: "Would this claim harm the author or their faction?"*  
     → **Upgrade confidence** if truly damaging (e.g., admitting a defeat).  
     → **Caution:** Can be gamed (e.g., "modest" boasts) or fabricated by enemies.  
     *Why it’s flimsy:* Easily manipulated; never decisive alone.

  8. **ARE THERE NEAR-CONTEMPORANEOUS SOURCES THAT IGNORE IT? [Argument from silence]**  
     *Ask: "Would other sources likely mention this? Do they?"*  
     → **Reject** if major event omitted by all reliable contemporaries.  
     → **Proceed** if silence is explainable (e.g., fragmentary records).  
     *Why it’s conditional:* Silence only matters if we expect the claim to be noted.

  9. **IS THE CLAIM REPEATED INDEPENDENTLY?**  
     *Ask: "Do multiple sources confirm this without relying on each other?"*  
     → **Upgrade confidence** if yes (e.g., Roman and Persian accounts agreeing).  
     → **Proceed** if single-source or dependence suspected.  
     *Crucial:* Corroboration only counts if sources are truly independent (see Test 2).

  10. **WHAT’S THE COST OF GETTING IT WRONG?**  
      *Ask: "How central is this claim? If wrong, would it mislead or harm?"*  
      → **Assert** only if confidence is high or claim is trivial.  
      → **Frame cautiously** ("According to X...") if uncertainty remains.  
      → **Omit** if pivotal but unsupported.  
      *Judgment call #3:* Your narrative needs vs. accuracy trade-off.

  ---

  ### **Which Criteria Are Load-Bearing vs. Flimsy?**
  - **Load-bearing (do real work):**  
    - **Transmission path** (kills false corroboration).  
    - **Material evidence** (objective contradiction).  
    - **Motive to lie** (exposes fabrication).  
    - **Ability to know** (filters impossibilities).  
  - **Flimsy (easily abused):**  
    - **Embarrassment criterion:** Often circular ("It must be true because it makes them look bad!" Ignores that slander exists).  
    - **Dissimilarity:** Assumes originality equals truth; ignores cultural borrowing.  
    - **"Harder reading":** Subjective; conflates textual difficulty with truth.  
  - **Use with extreme caution:**  
    Arguments from silence (assumes comprehensiveness of records) and against-interest (enemies fabricate "embarrassing" tales).

  ---

  ### **Running the Tests: Three Case Studies**

  #### **Case (a): A vivid, single-source scene (e.g., a general’s last stand) written centuries later.**  
  1. **Ability to know?** Unlikely. Author lived centuries later → *Red flag*.  
  2. **Transmission path?** Unknown; no earlier sources cited → *Uncertain*.  
  3. **Material evidence?** No archaeology of battles → *Neutral*.  
  4. **Motive to lie?** Dramatic scene boosts narrative appeal → *Motive to invent*.  
  5. **Plausibility?** Speech during battle implausible → *Reject*.  
  6. **Eyewitness?** None cited → *Neutral*.  
  7. **Self-damaging?** Heroic death flatters culture → *Not embarrassing*.  
  8. **Argument from silence?** Near-contemporaries don’t mention it → *Reject*.  
  9. **Corroboration?** None → *Reject*.  
  10. **Cost of error?** High—central scene, but unfounded.  
  → **VERDICT: Reject.** Frame as legend ("Later tradition claims...") or omit.  
  *Why it hurts:* Vivid scenes are rarely well-attested. The procedure forces omission despite narrative appeal.

  #### **Case (b): Unflattering detail about an enemy hero (e.g., "King Arthur fled battle") in an enemy source, possibly repeated independently.**  
  1. **Ability to know?** Enemy author had spies/rumors → *Plausible*.  
  2. **Transmission path?** Second source may derive from the first → *Suspect "corroboration."*  
  3. **Material evidence?** None → *Neutral*.  
  4. **Motive to lie?** Enemy wants to vilify → *Strong motive to distort*.  
  5. **Plausibility?** Heroes *do* retreat sometimes → *Plausible*.  
  6. **Eyewitness?** Unlikely in enemy account → *Neutral*.  
  7. **Self-damaging?** Not self-damaging—**hurts the enemy** → *Distortion likely*.  
  8. **Argument from silence?** Friendly sources ignore it; understandable → *Neutral*.  
  9. **Corroboration?** If second source is independent → *Upgrade confidence*. If not → *Reject*.  
  10. **Cost of error?** Medium. Could misrepresent a leader.  
  → **VERDICT:** If independence confirmed, assert cautiously ("Enemy sources allege..."). Else, omit.  
  *The catch:* "Against-interest" fails here—it’s the *enemy’s* interest to slander. Only transmission (#2) and motive (#4) tests matter.

  #### **Case (c): An impossible number (e.g., "1 million Persians at Thermopylae") in a late source.**  
  1. **Ability to know?** Author far removed → *Red flag*.  
  2. **Transmission path?** Earlier sources give smaller numbers → *Distortion likely*.  
  3. **Material evidence?** Logistics/demography make it impossible → **Reject.**  
  → *Stop here*. Material impossibility overrides all other tests.  
  **VERDICT: Reject.** Use realistic estimates or note the exaggeration ("Ancient sources inflate...").

  ---

  ### **When the Procedure Hands Back to You**
  - **Judgment call #1:** Could the author know? (Gaps in the record mean uncertainty).  
  - **Judgment call #2:** Plausibility? (Cultural norms are subjective).  
  - **Judgment call #3:** Cost of error? (Your podcast’s standards for certainty).  
  The procedure **doesn’t decide:**  
  - Whether a plausible-but-uncorroborated claim deserves inclusion.  
  - How to frame claims in "gray zones" (e.g., "likely," "according to X").  
  - When narrative impact justifies lower certainty.  

  **Final note:** This isn’t a flowchart but a *funnel*. 80% of claims fail early (Tests 1–4). The rest require your editorial judgment. Ancient sources aren’t "unreliable"—they’re human. Your job is to transparently convey their humanity, not arbitrate truth. When in doubt: **Cite, contextualize, or cut.**
