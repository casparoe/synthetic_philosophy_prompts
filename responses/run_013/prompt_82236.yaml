prompt: |-
  I've spent the last month in a running argument with a friend about patriotism — it started in a reading group that's been working through political philosophy, and it's now at the point where we're just trading cases at each other — so I'd like to do this properly. I'll lay out my gut verdicts on a set of cases and ask you what principle, if any, they add up to. I'm not asking for a survey of what has been written on the subject; I know roughly where the camps are, and I'll add whatever references I need if I ever write this up, so don't bother with citations. What I want is a principle stated precisely enough that I can tell what it forbids and what it permits, a statement of what it predicts for cases I haven't considered, and an honest accounting of which of my verdicts it forces me to give up. I'd rather you overturn one verdict than add a clause for every case; I distrust any principle that grows an epicycle per example.

  Here are the cases and how I actually react to them. (1) My grandmother's neighbor, who has lived in the same valley her whole life, knows its trees and its dishes, and feels a pang when she's away too long, with no opinion at all about whether the country is better than others: not a virtue exactly, but plainly not a vice — it looks like a form of love and I can't find anything wrong with it. (2) A man who says he loves his country because it is the greatest and morally superior nation on earth: a vice, and the superiority claim is what does it. (3) The same man with the superiority clause deleted — I love it because it's mine, the way I love my own family — strikes me as fine. (4) Someone who, when his country does something atrocious, feels shame, says so publicly, and is called a traitor by his neighbors: I think he is more patriotic than they are. (5) Someone who defends the atrocity to foreigners on the grounds that it's his country and that settles it: a vice, and I'm inclined to say it isn't patriotism at all but its counterfeit. (6) A woman who would rather a stranger's child die than a countryman's, other things equal: monstrous. But a mother who would rather a stranger's child die than her own: not monstrous, or at least I can't condemn it in the same breath. I can't yet say what distinguishes the two, and I suspect that's the crux. (7) Someone who emigrates, takes a new citizenship, and never thinks about the old country again: no vice. (8) Someone who loves a homeland he has never lived in and knows only from his parents' stories: I want to say the love has no proper object — he is in love with an idea rather than a country — and that this is a mistake without being a vice. (9) The one that really bothers me: I find it merely silly when someone feels proud of a national team's victory, or of a war his country won, since he did nothing; but I find it apt, even admirable, when someone feels ashamed of his country's atrocity, though he did nothing there either. Same absence of personal credit, opposite verdicts, and I can't currently justify the asymmetry.

  The principle I'd tentatively offer is this: patriotism is the disposition to treat one's country as something one belongs to and is answerable for, rather than as something one owns or a team one backs; it is a virtue exactly to the extent that it is the answerable-for kind of love, and it licenses no partiality beyond what that relationship itself supports. Test that against the list. I expect it survives (1) through (5) and (7), and that it either has to be complicated or has to surrender a verdict at (6) and (9). If you can get (6) and (9) with one added clause, tell me what it is and what it costs me elsewhere; if you can't, tell me which verdict to abandon and why I should stop trusting my gut about it. Please also say what your principle predicts about three cases I haven't yet put to myself: a person who breaks a domestic law he thinks unjust in order to help a compatriot he has never met; a person who loves his country's ideals and constitution while despising most of the people in it; and a person whose loyalty attaches to a city or a region rather than to the nation-state that contains it. I'll also accept an answer of the form that patriotism isn't in the virtue-and-vice business at all, but a taste like loving a cuisine, if you think the cases support it — but then I want to know what the things I called vices actually are.
reasoning: |-
  Hmm, the user presents an intricate philosophical puzzle about patriotism, framed through personal moral intuitions across nine cases. They're clearly frustrated with surface-level debates and want a rigorous principle that either explains or challenges their judgments. The intellectual maturity here is evident - they've already rejected epicycle-laden theories, preempted citation requests, and structured the problem with concrete examples. This is someone who thinks in systems.

  Their core tension lies in reconciling emotional attachments with moral accountability. They're disturbed by the asymmetry in case 9 (pride vs shame without agency) and the partiality dilemma in case 6 (mother vs patriot). Their proposed principle of "belonging-and-answerability" is promising but incomplete. I notice their intuitions consistently punish exceptionalism (cases 2,5), reward critical loyalty (4), and validate non-jingoistic attachments (1,3,7). The regional loyalty case feels like a test for scope.

  The mother/child analogy in case 6 is tricky because it reveals their deeper struggle: can special obligations exist beyond intimate relationships? Evolutionary psychology might explain parental instincts, but nationalism lacks that biological basis. Perhaps the distinction is that familial love creates direct responsibility, while patriotism doesn't inherently license life-or-death partiality.  

  For the pride/shame asymmetry: shame acknowledges moral complicity through collective identity, while baseless pride assumes unearned credit. One is passive reception of responsibility, the other active appropriation of glory. This matches their revulsion toward vicarious triumphalism.

  Their three new cases probe boundaries: civil disobedience tests if answerability permits breaking rules; constitutional love examines whether ideals can transcend current citizens; regional loyalty challenges nation-state primacy. The principle holds if we clarify that answerability flows to the community you're embedded in, regardless of scale, and that loving abstractions is valid only when they guide real-world engagement.

  I'll avoid virtue ethics framing since they want operational clarity. The "taste" alternative fails because cases 2,5,6 clearly involve moral failure, not mere preference. Their vices stem from loyalty that evades accountability - what we might call tribalism.

  The refined principle should explain why the ashamed citizen (case 4) embodies true patriotism: their public protest demonstrates answerability. Meanwhile, the emigrant (case 7) simply ends their circle of responsibility. For case 8's diasporic affection, the issue isn't the emotion itself but whether it claims unearned authority over the homeland's affairs.

  Final principle must be tight enough to forbid nationalist exceptionalism while permitting clear-eyed love, and must resolve the asymmetry without special pleading. The cost will be surrendering their ambivalent tolerance for "my country right or wrong" patriotism in case 3 - that version still risks ownership-mentality.
answer: |-
  Your intuitions form a remarkably coherent pattern centered on **relational accountability** rather than ownership or tribal loyalty. Your principle ("treating one's country as something one belongs to and is answerable for") is powerful, but requires tightening. Here's the refined principle and its consequences:

  ### Core Principle
  **Patriotism is virtuous when it manifests as an active, answerable relationship with one's political community, grounded in shared participation in its ongoing project. This relationship requires clear-eyed stewardship, forbids exceptionalism, and grants no inherent moral license for partiality beyond what the stewardship role demands.**

  ---

  ### How It Handles Your Cases
  1.  **Grandmother's neighbor:** Permitted. Her love stems from deep participation in the valley's life (shared project), not superiority. Her "answerability" manifests as care for the place itself.
  2.  **"Greatest nation" patriot:** Forbidden. Foundational exceptionalism violates the stewardship requirement (requires honest appraisal) and implies ownership ("my team wins").
  3.  **"Because it's mine" patriot:** **Overturned.** Your verdict must change. "Because it's mine" is ownership logic, not answerability. It lacks the *reasoned commitment to the shared project* that stewardship requires. It easily slides into case (5). This is the necessary cost.
  4.  **Critic feeling shame:** Exemplary patriotism. Highest form of answerability – holding the community accountable to its own ideals (stewardship).
  5.  **Defender of atrocity:** Forbidden. Tribal ownership ("my team, right or wrong") negates answerability and stewardship.
  6.  **Mother vs. Patriot saving children:** Distinguished.  
      *   *Mother:* The partiality stems from the **direct, constitutive responsibility** of the parent-child relationship. Her role *requires* prioritizing her child.  
      *   *Patriot:* No analogous constitutive responsibility exists between co-citizens that *requires* prioritizing one life over another based solely on nationality. Such partiality violates the equal moral consideration stewardship must acknowledge. Your gut is correct: the mother's act is non-monstrous (role-based duty); the patriot's is monstrous (unjustified bias).
  7.  **Emigrant forgetting:** Permitted. Answerability stems from participation. Ending participation ends the specific relationship of political answerability. No vice.
  8.  **Diaspora love:** Permitted *if* understood as affinity/connection, but **not virtuous patriotism**. It lacks the grounding in active participation and the concrete demands of stewardship. It's a "mistake without vice" only if it doesn't claim unearned authority or justify harmful actions.
  9.  **Pride vs. Shame asymmetry:** Explained.  
      *   *Pride in victory/achievement:* Feels "silly" because it appropriates credit without contribution, implying ownership ("my team won!"). It bypasses stewardship.  
      *   *Shame in atrocity:* Feels "apt" because it acknowledges complicity (even passive) in the *ongoing project* of the community. Stewardship demands acknowledging failures to uphold shared ideals. Shame reflects answerability; pride reflects ownership.

  ---

  ### Predictions for New Cases
  1.  **Breaking unjust law to help unknown compatriot:**  
      *   **Permitted as potentially patriotic.** If the action stems from stewardship (upholding the community's *ideals* against its *failings*) and answerability (acting *for* the community's betterment), it aligns with virtuous patriotism. Motive matters: is it about solidarity within the shared project or mere tribal loyalty?
  2.  **Loves ideals/constitution, despises most citizens:**  
      *   **Ambiguous, likely flawed.** Stewardship requires commitment to the *actual, ongoing political project*, which includes the flawed people constituting it. Loving abstract ideals while despising the people trying (however poorly) to enact them risks a disconnected idealism, not grounded stewardship. It *might* be a starting point for critical patriotism but isn't yet virtuous stewardship.
  3.  **Loyalty to city/region over nation-state:**  
      *   **Permitted as potentially virtuous patriotism.** The relevant "political community" for stewardship is where one actively participates and feels answerable. If the city/region is the primary locus of their shared political life and project, loyalty to it fulfills the principle. National loyalty isn't inherently superior.

  ---

  ### Why "Taste" Fails & What the Vices Are
  Your cases clearly involve moral judgments (vices/virtues), not mere preferences. The vices you identify (2, 5, 6-patriot, arguably 3-refined) are failures of moral character stemming from:
  1.  **Tribalism:** Reducing the complex relationship to in-group favoritism (Case 5, 6-patriot).
  2.  **Exceptionalism:** Claiming unearned moral superiority (Case 2).
  3.  **Ownership Mentality:** Treating the nation as a possession or team to be defended/boosted uncritically (Cases 2, 3, 5, 9-pride). This is the core counterfeit you sensed.
  4.  **Abrogation of Answerability:** Refusing the burden of stewardship, either through blind loyalty (5) or disengagement without cause (not an issue in 7, but could be a vice if disengaging *during* a crisis demanding stewardship).

  ### Summary of Costs & Gains
  *   **Cost:** You must surrender your neutral verdict on Case 3 ("because it's mine"). This ownership mentality is the seed of vice.
  *   **Gain:** A single, robust principle explaining *all* your other verdicts, resolving the asymmetry in Case 9, distinguishing Case 6, handling new cases coherently, and precisely identifying the vices as failures of stewardship and answerability.
  *   **Core:** Virtuous patriotism is **stewardship of a shared political project**. It demands clear eyes, rejects superiority and blind loyalty, embraces critical responsibility, and derives its limited justification from the demands of that active, participatory relationship – not from mere belonging or identity.
