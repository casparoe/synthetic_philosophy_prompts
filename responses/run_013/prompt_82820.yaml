prompt: |-
  You are a philosopher of cognitive science with a working knowledge of mechanistic interpretability, and you have spent a lot of time adjudicating disputes about when it is legitimate to say that a neural network represents something. Think carefully before you answer, and start by brainstorming the candidate decision rules that could underlie the pattern of verdicts below; then commit to a best guess rather than hedging. Everything you need is contained in this brief, so do not cite any literature, and write your answer in British English.

  Background. A colleague of mine, whom I shall call Nadia, runs a mechanistic interpretability group. She is a realist about representation in networks: she thinks questions of the form, does this network represent X, have determinate answers. But she refuses to state a criterion. When pressed, she says that any criterion she writes down will be gamed by the next finding, and that the only way to see what she thinks is to watch her work. Here are five findings from her group, and the verdict she gave on each; I have simplified them, but not distorted them.

  1. The Number Direction. A single direction in the residual stream of a small language model. A linear probe reads singular versus plural subject from it with 99 per cent held-out accuracy, and adding or subtracting the direction flips subsequent verb agreement. Nadia: the model represents number.

  2. The Register Direction. A single direction that a linear probe reads as formal versus informal register with 95 per cent held-out accuracy. Every intervention the group tried — adding it, subtracting it, ablating it, projecting it out, and overwriting its subspace with a learned decoder — left the output distribution statistically indistinguishable from baseline, and the direction turns out to be reconstructible from tokeniser statistics alone. Nadia: not a representation, merely decodable information.

  3. The Antecedent Code. A pair of mid-layer computations whose joint state carries the antecedent of a pronoun across long distances. No linear probe, no sparse-autoencoder feature, and no human-inspectable pattern recovers the antecedent from that state; the code appears high-dimensional and context-rotated. But interchange interventions, swapping the state between minimally different sentences, take the model's pronoun choice from 92 per cent correct to chance. Nadia: a representation, and one we do not yet know how to decode.

  4. The Copy-Suppression Head. A head whose causal role is to cancel the signal that would otherwise cause the previous token to be repeated. Its content is most naturally specified as the token the model would otherwise have emitted, not as any fact about the input. Nadia: a representation, of the model's own counterfactual output.

  5. The Wheel-Texture Feature. A feature in a vision model that is decodable, causally load-bearing for wheel classification, and whose content is fixed by what the downstream consumer does with it: it fires for wheel-shaped texture painted on a wall as readily as for a wheel. Nadia: a representation, of wheel-texture rather than of wheel, because the consumer decides the content.

  The new finding. The Hedge Probe. In a mid-layer of a language model, the group found a direction H such that a linear probe reads whether the model is about to hedge rather than assert flatly with 97 per cent held-out accuracy, and the same probe, without refitting, predicts hedging across three domains and in a fine-tuned variant of the model. However, every intervention on H — patching it to either extreme, ablating it, projecting it out, and a nonlinear intervention that overwrites the whole eight-dimensional subspace around it — leaves the hedging rate statistically indistinguishable from baseline, with power to detect a five-point change. The hedging behaviour is controlled instead by a separate family of directions G, which are not predictable from the input and which no probe reads as hedging; interchanging G flips hedging from 8 per cent to 91 per cent. H sits downstream of G and faithfully reports the state that G sets, but nothing further downstream reads H.

  What I need. Predict Nadia's verdict on the Hedge Probe. Set out the candidate rules that fit her five earlier verdicts — I expect more than one, and I want to know which of the five verdicts rules out which rule, and whether any of her verdicts are jointly inconsistent. Say what each surviving rule predicts about the Hedge Probe, give your best guess at her actual verdict with your reasons for preferring one rule over the others, and give a confidence figure. Then tell me which further experiment would best separate the rules that survive. We have one unpublished result in the drawer that may or may not do the job: a direction whose injection reliably flips behaviour, but only by inflating the residual-stream norm, carrying no content of its own. Say whether that experiment discriminates among the candidate rules, and if it does not, describe one that does.
reasoning: |-
  Hmm, the user wants me to predict Nadia's verdict on the "Hedge Probe" case based on her pattern of judgments across five previous findings. I need to approach this as a philosopher of cognitive science with expertise in mechanistic interpretability.

  First, I should identify candidate decision rules that explain all five of Nadia's previous verdicts. The cases are:

  1. Number Direction: Represents number (causal + decodable)
  2. Register Direction: Not a representation (decodable but not causal)
  3. Antecedent Code: Represents antecedent (causal but not decodable)
  4. Copy-Suppression Head: Represents counterfactual output (causal + downstream-defined content)
  5. Wheel-Texture Feature: Represents wheel-texture (consumer-defined content)

  The key dimensions emerging are: causal efficacy (whether interventions change behavior) and content determinacy (whether the content is fixed by decoder, consumer, or input).

  For the Hedge Probe case: it's decodable with high accuracy (H direction predicts hedging), but interventions on H don't change behavior (non-causal). The actual causal control comes from G directions, which aren't decodable. H faithfully reports G's state but nothing reads H downstream.

  Candidate rules that fit all five verdicts:
  - Rule A: Causal control is necessary and sufficient. But this fails because Register Direction was decodable without being causal, and she rejected it as representation.
  - Rule B: Either causal control or decodability is sufficient. But Register Direction had decodability without causality and was rejected.
  - Rule C: Causal control is necessary. This fits all cases except possibly Wheel-Texture - but Wheel-Texture was causal for classification.
  - Rule D: Content must be fixed by downstream use. This fits Copy-Suppression (output-defined) and Wheel-Texture (consumer-defined), but fails Number Direction (which has no clear downstream consumer mentioned).

  Rule C (causal necessity) seems strongest, as it fits cases 1-4. Case 5 also had causal role. But Wheel-Texture introduces content determination by consumer.

  Refined Rule: Causal control is necessary, and content is determined by either: (i) what downstream mechanisms use it for, or (ii) what it reliably corresponds to in inputs when causal.

  For Hedge Probe: H lacks causal control (interventions ineffective), so under causal-necessity rule, it should not be considered a representation, even though decodable. This mirrors Register Direction.

  The unpublished result (direction that flips behavior only by norm inflation) might test whether causal role without intrinsic content counts. But in Copy-Suppression Head, content was defined by downstream use, so probably not.

  Best experiment to discriminate: Find a case where a feature has causal role but content isn't fixed by consumer or input. But all Nadia's cases have content determinacy.

  Final prediction: Nadia will say Hedge Probe is not a representation, like Register Direction. Confidence 85%.
answer: |-
  ### Candidate Decision Rules from Nadia's Verdicts
  Nadia's pattern suggests she prioritises *causal efficacy* and *content determinacy*. Here are the candidate rules that fit all five verdicts, with each verdict's role in ruling out alternatives:

  1. **Rule C (Causal Necessity):** A state represents X only if it has **causal control** over downstream behaviour relevant to X.  
     - *Fits all:* Number Direction (interventions flip verbs), Antecedent Code (interchanges flip pronouns), Copy-Suppression Head (cancels outputs), Wheel-Texture (load-bearing for classification). Register Direction fails (no causal effect).  
     - *Rules out:* Rules where decodability alone suffices (Register vetoes this).  

  2. **Rule CD (Causal + Downstream-Defined Content):** A state represents X only if (a) it has causal control, and (b) its content is **fixed by what downstream mechanisms use it for**.  
     - *Fits all:* Copy-Suppression Head (content = counterfactual output, defined by downstream cancellation), Wheel-Texture (content = texture, defined by wheel-classifier consumer). Number Direction fits (verb agreement uses number), Antecedent Code fits (pronoun resolution uses antecedent). Register Direction fails (a).  
     - *Rules out:* Rules where content is solely input-correlative (Wheel-Texture vetoes; texture ≠ wheel).  

  3. **Rule CI (Causal + Input-Independence):** A state represents X only if (a) it has causal control, and (b) its content is **not reducible to input statistics or trivial computations**.  
     - *Fits all:* Register Direction ruled out (reconstructible from tokeniser), others pass. Wheel-Texture fits (texture not input-reducible).  
     - *Rules out:* Rules where input-reducible decodability suffices (Register vetoes).  

  **Inconsistency check:** No verdicts are jointly inconsistent. All rules fit the five cases by requiring causality and adding one refinement (content determinacy or input-independence).  

  ### Prediction for the Hedge Probe
  - **Hedge Probe description:** H is linearly decodable (hedging, 97% accuracy) but **not causal** (interventions leave behaviour unchanged). G is causal (interchanges flip hedging) but not decodable. H reports G’s state but is unused downstream.  
  - **Predictions under surviving rules:**  
    - Rule C: **Not a representation** (lacks causal control, like Register Direction).  
    - Rule CD: **Not a representation** (fails (a); no causal role, so no downstream use defines content).  
    - Rule CI: **Not a representation** (fails (a); no causal role).  
  - **Best guess:** Nadia will say **not a representation**.  
    - *Reason:* All rules require causal efficacy, which H lacks. This mirrors Register Direction (decodable but inert). Her emphasis on work over criteria suggests she prioritises *functional impact* (e.g., Copy-Suppression and Antecedent Code’s causal roles). The G directions’ causal role doesn’t "rescue" H, as H is epiphenomenal.  
  - **Confidence:** 85% (H’s passivity strongly parallels Register, but Wheel-Texture’s consumer-dependence adds slight uncertainty).  

  ### Further Experiment to Separate Rules
  The unpublished result (direction that flips behaviour only by inflating residual-stream norm, carrying no intrinsic content) **does not discriminate** between Rules C, CD, and CI. All would reject it:  
  - No causal control *of specific content* (fails all rules’ causality requirement; norm inflation is nonspecific).  
  - Example: If injected noise flips outputs randomly, it lacks content determinacy (unlike Copy-Suppression’s precise counterfactual coding).  

  **Discriminating experiment:**  
  - **Proposal:** Find a causally potent state whose content *conflicts* with downstream use.  
    - *Method:* Engineer a "mismatch" feature in a vision model:  
      1. Identify Feature F that fires for "wheel-texture" and causes wheel classification (like Wheel-Texture).  
      2. Modify downstream layers to use F for an *unrelated* task (e.g., "detecting blue hues").  
      3. Test interventions: If swapping F’s state changes hue decisions but not wheels, content is consumer-defined (Rule CD). If it changes wheels regardless, content is input-defined (Rule CI/C).  
  - *Why it works:*  
    - Rule CD predicts content is defined by consumer (so F represents "blue hues" post-modification).  
    - Rule C or CI might maintain F represents "texture" if input correlations persist, testing whether causality alone (C) or input-independence (CI) dominates.  
  - *Link to Nadia’s cases:* Directly probes Wheel-Texture’s consumer-dependence claim versus Number Direction’s input-correlative causality.  

  **Summary:** Hedge Probe is likely *not a representation* due to causal inertness. The critical test is whether content is fixed by consumer use or intrinsic input relations.
