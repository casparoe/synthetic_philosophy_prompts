prompt: |-
  I have spent the better part of a decade on the clinical-policy side of medicine — the part that decides which conditions get recognized, coded, and paid for — and I keep running into a pattern for which I have no name. I suspect it is not quite the disease-versus-normality debate I half-remember from an undergraduate course, and I would like to know whether it already has a home somewhere in the philosophy of medicine or whether I have to invent one.

  The pattern is this. Whether a bodily state gets called a disease seems to depend on two things that are not features of the body at all.

  The first is whether anything can be done about it. Two people can carry the identical underlying dysfunction — the same measurable deviation from the species norm, the same enzyme deficit, the same lesion on the same scan — and if one of them happens to have the version for which we possess a drug or an operation, we call hers a disease, while his is filed as a variation, a trait, or simply how some people are built. The state is the same; the label follows the remedy. Let a treatment appear, and the very people who were described as different become patients, without any change in their bodies.

  The second is whether the state frustrates the person's own aims. A woman whose shoulder dislocates every time she trains for a marathon is, in the clinic's eyes, ill; a woman with the identical shoulder who has arranged her life so that it never dislocates, and who does not experience it as a problem, is not really a case at all. Same joint, same deviation, opposite verdict — and the verdict tracks what she cares about rather than what is wrong with her.

  Neither of these is simply a matter of how common the state is; the statistics do not shift between the two people in either example. And neither seems to be captured by the bare thought that disease is a value-laden term, because values are not the only thing doing the work here: the availability of an intervention and the fit between the state and the person's plans are pulling on the label independently. I can see that all of this is adjacent to the familiar quarrel over whether disease is a biological or an evaluative notion, but I do not think either side of that quarrel names the thing I am pointing at.

  So: is there an established concept, or at least a recognized name, for the phenomenon in which the disease label tracks (a) whether the state is remediable and (b) whether it thwarts the particular person's aims, rather than tracking anything intrinsic to the state? If such a concept exists, I want to know precisely how it is meant to differ from the ordinary distinction between a dysfunction and an illness, from the general claim that medicine's categories are socially constructed, and from the older argument about statistical versus evaluative abnormality — which of these is nearest, and where each of them fails to fit. If no such concept exists, then name it and give me a definition with edges: what else would fall under it, what superficially similar case would not, and where the pattern breaks down. Are there conditions whose status genuinely does not budge when a treatment appears or when the patient's aims change, and what is different about them?

  I care about the carving far more than the label. A term with no boundaries will not help me.
reasoning: |-
  Okay, the user has spent a decade in clinical policy and noticed a pattern where disease labeling depends on two external factors: remediability and goal-thwarting. They want to know if there's an existing philosophical concept for this or if they need to coin one. Let me start by breaking down their examples.

  First, the identical dysfunction where one person gets a disease label because a treatment exists, while the other doesn't. That's remediability. Second, the shoulder dislocation where the label depends on whether it interferes with the person's goals. That's goal-thwarting. The user mentions these aren't about prevalence or just values, but specific factors.

  I recall Boorse's biostatistical theory and Wakefield's harmful dysfunction. But neither fully addresses remediability or individual goals. Boorse is objective dysfunction; Wakefield adds harm but not remediability. The user points out that both factors are independent and not covered by existing debates. 

  Hmm, what about Engelhardt? He talks about disease as a tactical concept, but it's more about social construction. Maybe the remediability part links to technological imperative—once a treatment exists, it becomes a disease. And goal-thwarting relates to Nordenfelt's welfare theory, which focuses on life goals. 

  But combining both factors? That's unique. The user needs a concept that captures how disease status changes based on intervention availability and personal aims. Remediation-Dependent Pathologization (RDP) and Goal-Conflict Pathologization (GCP) as categories under a broader concept. 

  Also, the user wants clear boundaries. Are there exceptions? Congenital deafness: even with cochlear implants, some don't see it as a disease because of cultural identity. Leprosy treatments exist, but stigma persists. So remediability isn't always sufficient. For goal-thwarting, asymptomatic conditions like hypertension are still diseases without symptoms because of future harm. 

  So the concept needs to account for cases where intrinsic risk or mandatory intervention overrides individual goals. The user probably needs this for policy decisions—when to allocate resources or define medical necessity. They need precise criteria to avoid arbitrariness in labeling. 

  Naming it "Clinical Salience" makes sense—salience to medical intervention and personal goals. But they care more about carving than the label. Emphasize the two axes and their exceptions. Highlighting how this differs from existing theories by focusing on the dynamic shift when treatment appears or goals change. 

  Also, the user’s deeper need might be to legitimize this pattern in policy-making, providing a framework that justifies resource allocation based on treatability and patient impact rather than just biology. They might be seeking philosophical grounding for what they’ve observed empirically.
answer: |-
  Your observation cuts to the heart of medical ontology and reveals a gap in traditional frameworks. The phenomenon you describe—where disease status hinges on **remediability** and **person-relative goal-thwarting** rather than intrinsic biological properties—lacks a single established term but aligns with several intersecting concepts. I'll synthesize, define boundaries, and propose a precise framework.

  ### Core Concept: **Clinical Salience**
  **Proposed Name:** **Clinical Salience Phenomenon** (or **Remediation-Goal Dependency of Pathologization**)  
  **Definition:** *The process by which a biological state is categorized as a "disease" only when (a) an effective medical intervention exists, and/or (b) the state conflicts with the patient's subjective life goals—independent of its objective pathophysiological characteristics.*

  #### Key Axes:
  1.  **Remediation-Dependent Pathologization (RDP):**  
      * Disease status is *contingent* on the existence of a medical intervention.  
      * **Example:** Identical BRCA1 mutation → "healthy variant" until risk-reducing mastectomy emerges → then "disease predisposition."  
      * **Boundary:** Intrinsic high-mortality states (e.g., metastatic cancer) retain disease status *regardless* of treatment availability.

  2.  **Goal-Conflict Pathologization (GCP):**  
      * Disease status requires *subjective disruption* of the patient's valued activities.  
      * **Example:** Identical hypermobility → "disease" for the marathoner, "trait" for the sedentary person.  
      **Boundary:** Asymptomatic conditions with high objective risk (e.g., hypertension) retain disease status due to *latent* harm potential.

  ---

  ### How This Differs from Existing Frameworks:
  | Framework                     | Where It Fits                                   | Where It Fails Your Pattern              |
  |-------------------------------|------------------------------------------------|------------------------------------------|
  | **Boorse's Biostatistical Theory** | Emphasizes species-typical function.           | Ignores remediability & subjective goals. |
  | **Wakefield's Harmful Dysfunction** | Adds "harm" to dysfunction.                    | "Harm" is often socially defined, not *person-specific* or *treatment-dependent*. |
  | **Nordenfelt's Welfare Theory** | Centers on ability to achieve vital goals.     | Doesn't address how *medical treatability* alters categorization. |
  | **Social Constructionism**    | Acknowledges cultural influence on disease.    | Overly broad; doesn't isolate *remediability* as a distinct driver. |
  | **Technological Imperative**  | Explains treatment-driven diagnosis inflation. | Neglects the *goal-thwarting* dimension. |

  ---

  ### Cases Where the Pattern **Breaks Down** (and Why):
  1.  **Non-Remediable Yet Uncontested Diseases:**  
      * **E.g., Untreatable Stage IV Cancer.**  
      * *Why:* Overwhelming objective biological disruption (high mortality risk) overrides lack of treatment or patient acceptance.  
      * **Boundary Test:** Conditions with severe *intrinsic risk* resist RDP/GCP dependency.

  2.  **Asymptomatic but Mandatorily Treated States:**  
      * **E.g., Hypertension in a goal-unaffected patient.**  
      * *Why:* Medicine's focus on *future harm prevention* supersedes current goal-thwarting.  
      * **Boundary Test:** States with high *probabilistic harm* retain disease status.

  3.  **Culturally Non-Pathologized States Despite Treatment:**  
      * **E.g., Normal Aging (even with interventions like testosterone replacement).**  
      * *Why:* Deeply embedded social norms can override remediability.  
      * **Boundary Test:** States framed as "natural life processes" resist RDP.

  ---

  ### What Falls Under "Clinical Salience":
  - **RDP Examples:** ADHD diagnosis explosion post-amphetamine development; "osteopenia" medicalization after osteoporosis drugs.
  - **GCP Examples:** Facial difference → "disease" if patient seeks surgery, "trait" if not; infertility only pathologized when reproduction is desired.
  - **Excluded:** Cholera (disease without treatment options); Down syndrome (pathologized regardless of goals).

  ---

  ### The Carving: A Two-Axis Model
  ```plaintext
                       ┌─────────────────┬─────────────────┐
                       │  Goal-Thwarting │ No Goal-Thwarting│
  ├───────────────────┼─────────────────┼─────────────────┤
  │ Remedy Available  │  DISEASE        │  Medicalized     │
  │                   │  (e.g., Hypermobility │ State (e.g., BRCA1+   │
  │                   │  in athlete)    │ with mastectomy) │
  ├───────────────────┼─────────────────┼─────────────────┤
  │ No Remedy         │  Contested      │  NEUTRAL VARIANT │
  │                   │  "Problem"      │  (e.g., mild     │
  │                   │  (e.g., Chronic │  synesthesia)    │
  │                   │  pain w/o cure) │                  │
  └───────────────────┴─────────────────┴─────────────────┘
  ```

  ### Why This Framework Works for Policy
  1.  **Explains Diagnostic Inflation:** New treatments create new "diseases" (RDP).  
  2.  **Justifies Patient-Centered Care:** Legitimizes non-treatment when goals aren't thwarted (GCP).  
  3.  **Predicts Stigma Shifts:** e.g., Male infertility transformed from emasculation to medical condition via IVF.  

  Your insight exposes medicine’s unspoken pragmatism: **we call something a disease when we can *fix* it or when the patient *demands* it be fixed.** The "Clinical Salience" model captures this while defining when biology overrides contingency—a tool for navigating policy’s gray zones.
