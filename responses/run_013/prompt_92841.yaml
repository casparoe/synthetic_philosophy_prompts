  We are drafting a research proposal for a one-semester project on the standoff between self-sampling and self-indication approaches to anthropic reasoning, with a focus on the presumptuous philosopher thought experiment.

  The core idea is that the two approaches might be answering different questions: one about what to expect (the state of the world given that I exist) and the other about how to weight hypotheses when the decision has consequences scaling with the number of observers. The project aims to find a criterion that distinguishes these two kinds of probability and then test whether the distinction holds.

  We must frame the question carefully. Here are candidate framings:

  1. **Framing 1: Distinguishing two types of probability questions.** 
     - Tractability: This framing directly addresses the half-formed idea and provides a clear path: define two types of questions and see which approach fits each.
     - Collapse risk: It might collapse into a restatement of the existing debate if the two types are not independently motivated or if the criterion for distinguishing them is circular.

  2. **Framing 2: A decision-theoretic approach that splits credence and action.** 
     - Tractability: By tying one type of probability to decision-making (especially when consequences scale with observer count), we can use decision theory to provide a formal criterion.
     - Collapse risk: It might collapse into existing decision-theoretic treatments of anthropics (e.g., using utility-weighted averaging) which are already discussed in the literature.

  3. **Framing 3: Invariance under observer duplication as a criterion.** 
     - Tractability: We can define a formal test: for one type of probability, the answer should be invariant under duplicating all observers (because the world is the same), but for the other, it should change (because the decision consequences scale). This provides a clear experimental setup.
     - Collapse risk: It might be that such invariance conditions are already implicit in the debate and do not resolve it.

  4. **Framing 4: Separating indexical and non-indexical components in anthropic reasoning.** 
     - Tractability: This is a known distinction in the literature and could be used to separate the two types of probability. The self-sampling approach might handle indexical uncertainty (which observer am I?) and self-indication might handle non-indexical (how many observers?).
     - Collapse risk: This might collapse into existing positions that already try to make this separation (e.g., the combination of self-sampling with a non-indexical prior).

  We choose **Framing 3** (invariance under duplication) as the most promising because:
  - It provides a clear, formal criterion that can be stated in advance and tested without relying on intuitions about new cases.
  - It directly connects to the half-formed idea: when the world is duplicated, the "what to expect" probability should not change (because the world is the same), but the weighting for decisions that scale with observers should change (because there are more observers to benefit or suffer).
  - It avoids collapsing into existing debates because the invariance condition is not typically used to split probability into two kinds, and it directly addresses the discomfort of having two kinds by providing a testable distinction.

  Now, we write the proposal.

  ---

  **Research Proposal**

  **Title:** Two Kinds of Anthropic Probability: Resolving the Standoff between Self-Sampling and Self-Indication

  **The Standoff and the Presumptuous Philosopher**

  Anthropic reasoning grapples with how to update beliefs when the evidence one possesses (e.g., that one exists) depends on the hypothesis under consideration. Two prominent approaches are in tension. The self-sampling approach (SSA) holds that one should reason as if randomly selected from a suitable reference class of observers. This avoids overcounting observers in large universes but faces a reference class problem and leads to doomsday-style conclusions. The self-indication approach (SIA) holds that the mere fact of one’s existence is evidence that favors hypotheses entailing more observers, leading to the conclusion that large universes are a priori more likely. SIA, however, falls prey to the presumptuous philosopher objection: if SIA is correct, then an armchair philosopher could confidently assert that the cosmos is vast (because a vast cosmos contains more observers) even in the absence of empirical evidence, which seems absurd.

  **The Gap and the Project**

  Despite extensive discussion, the debate remains unresolved because existing positions fail to account for a crucial distinction. Both SSA and SIA are presented as universal accounts of anthropic probability, but each stumbles on cases the other handles well. SSA falters when decisions must account for the welfare of all affected observers (as in SIA-favored cases), while SIA overreaches when asked for beliefs about the world’s structure (as in the presumptuous philosopher). The gap is that no account successfully explains why SSA seems compelling for doomsday-style reasoning but SIA seems compelling for observer-count-dependent decisions, without collapsing into ad hocery. The project aims to fill this gap by formally distinguishing two kinds of anthropic probability: one governing expectations about the world (e.g., the number of observers) and another governing the weighting of hypotheses in decisions where outcomes scale with the number of observers. The core challenge is to provide a criterion for this distinction that is not reverse-engineered from desired outcomes but can be stated in advance and tested.

  **Method**

  The project will proceed in three steps, using formal tools from decision theory and invariance principles to avoid relying solely on intuitive judgments.

  1. **Define two distinct probability functions:** Let P_w be a probability function representing expectations about the world (e.g., "Given that I exist, what is the likelihood the cosmos is small?"). Let P_d be a probability function used for decision-making when the outcome scales with the number of observers (e.g., in a wager that affects all observers). The conjecture is that SSA-style normalization is appropriate for P_w and SIA-style weighting for P_d.

  2. **State an invariance criterion:** The key advance is to require that P_w must be invariant under observer duplication: if we imagine an exact duplicate of the entire universe (including all observers and their states), P_w should assign the same probabilities to world-describing propositions because the world is unchanged. Conversely, P_d should not be invariant under such duplication because the duplication changes the number of observers affected by a decision. This criterion is stated in advance and not derived from case intuitions.

  3. **Test with central cases:** We will construct cases where the two functions diverge. The central test case is the *Duplicated Doomsday*: 
     - Scenario: Hypothesis H1 posits a small cosmos with 100 observers; H2 posits a large cosmos with 100,000 observers. We are initially indifferent. Now, we are told that a powerful being may or may not create an exact duplicate of the entire cosmos (including us) without telling us. We learn we exist (as usual). 
     - SSA: Normalizes over observers, so P_w(H1) remains high (about 50%) because the duplication doesn't change the world (it's just a copy). But SSA applied to decision-making would not weight H2 more heavily in a decision that scales with observer count.
     - SIA: Would give high P_w(H2) initially and even higher after duplication (if known). But in the duplication scenario, if we don't know whether duplication occurred, SIA would still favor H2, but the duplication should not change P_w (since the world is the same) but should change P_d (because a decision affects twice as many observers if duplication occurred).
     - Two-kinds view: P_w(H1) should not change upon learning about the possibility of duplication (because duplication doesn't change the world structure). But in a decision that affects all observers (e.g., a bet that pays each observer $1 if H1 is true), P_d should weight H1 and H2 by the expected number of observers. Specifically, if duplication is uncertain, we must consider both the original and duplicated scenarios, weighting by the number of observers in each.

  The project will develop a formal model of this case, showing how the invariance criterion cleanly separates the two functions and resolves the presumptuous philosopher. The method avoids merely collecting intuitions by imposing the invariance condition as a constraint and then checking for consistency with the two-kinds view.

  **Result and Failure Conditions**

  A successful outcome would be a consistent framework that:
  - Assigns SSA to P_w and SIA to P_d without circularity.
  - Explains the presumptuous philosopher: the philosopher is misapplying P_d (designed for decisions) to the question about the world (which requires P_w).
  - Resolves the duplicated doomsday case without ad hoc adjustments.

  Failure conditions include:
  - The invariance criterion cannot be applied without presupposing which probability to use in which context, making the distinction circular.
  - The two kinds of probability collapse into one in the formal model, showing the distinction is unnecessary.
  - The framework requires arbitrary parameters that replicate the reference class problem.

  **Scope and Adjustments**

  The project is feasible in one semester. The core tasks are:
  1. Formalize P_w and P_d using decision-theoretic tools (e.g., defining P_d as a probability in a utility-weighted average for decisions).
  2. Apply the invariance criterion to the duplicated doomsday and other cases (e.g., the presumptuous philosopher).
  3. Test for robustness by varying the duplication scenario (e.g., partial duplication).

  If time runs short, we will drop robustness tests and focus on the central case. The most time-consuming part will be the formalization (task 1), which must be rigorous and general.

  **Open Worry**

  The weakest joint is whether the invariance criterion is truly independent: one might argue that even for world-directed beliefs, learning about possible duplication should affect credences (e.g., if duplication is more likely in large universes). The project must ensure that the criterion is not question-begging.

  **Conclusion**

  This project offers a novel resolution to a longstanding debate by splitting anthropic probability into two kinds, governed by a testable invariance condition. It promises not only to defuse the presumptuous philosopher but also to clarify how anthropic reasoning should inform both belief and action.

