answer: |-
  ### Research Proposal: Resolving the Anthropic Standoff via a Dual-Probability Framework

  The self-sampling approach (SSA) and self-indication approach (SIA) represent opposing strategies for anthropic reasoning. SSA treats the observing self as a random sample from a reference class of possible observers, favoring hypotheses with fewer observers (e.g., doomsday predictions) but struggling to define the reference class. SIA treats one’s existence as evidence favoring hypotheses that entail more observers, granting overwhelming credence to vast universes. This invites the presumptuous philosopher objection: SIA seemingly allows armchair determination of cosmic scale through observer-count alone, violating the intuition that such questions require empirical evidence. The debate remains deadlocked because both approaches claim universality but generate counterintuitive results in each other’s strongholds.  

  This project posits that SSA and SIA answer fundamentally distinct questions. SSA addresses *world-directed belief*: what should I expect about the cosmos, given that I exist? SIA addresses *observer-scaled decision-weighting*: how should hypotheses be weighted when choices affect all observers proportionally? The presumptuous philosopher errs by misapplying SIA-style weights to world-directed questions. Yet this distinction risks being circular if defined post hoc. To preempt this, the project will formulate a criterion *in advance*: **observer duplication invariance**. For world-directed belief, probabilities must remain unchanged under hypothetical duplication of all observers and their states (the world is identical); for decisions scaling with observer count, probabilities must respond to duplication (the affected population changes). This criterion is testable and avoids relying on intuitive judgments.  

  The gap in existing work is twofold. First, SSA and SIA proponents debate which single probability governs anthropics, neglecting contexts where each excels. SSA cannot justify observer-scaled decisions (e.g., resource allocation in large universes), while SIA cannot defuse the presumptuous philosopher without denying its core tenet. Second, hybrid proposals either lack a pre-decisive criterion for switching between approaches or collapse into SSA/SIA under pressure. The survival of the question hinges on this unresolved duality: no framework explains why SSA feels compelling for doomsday (world-directed) but SIA for observer-scaled altruism.  

  The method employs formal decision theory to define two probability functions:  
  - \(P_w\): For world-directed belief, constrained by duplication invariance.  
  - \(P_d\): For decisions with observer-scaled consequences, constrained by duplication dependence.  
  Concrete steps:  
  1. **Formalize \(P_w\) and \(P_d\)**: Define \(P_w\) via SSA-like normalization (credence divided by observer count) and \(P_d\) via SIA-like weighting (credence proportional to observer count), using Bayesian updating.  
  2. **Impose invariance**: Require \(P_w\) to be invariant under exact universal duplication (including observers’ mental states). Require \(P_d\) to vary with duplication in observer-scaled decisions.  
  3. **Test with the Central Case - *Cosmic Bet***:  
     - *Setup*: Two identical rooms exist. Hypothesis H1: one room contains 10 observers; H2: one room contains 1,000. You wake in a room, unsure which hypothesis or room is actual. First, calculate \(P_w\)(H2): what should you believe about H2? Second, consider a bet: if H2 is true, $1 is donated to each observer (scaling with count).  
     - *Predictions*: SSA assigns \(P_w\)(H2) ≈ 1% (low; random sample favors small rooms). SIA assigns \(P_w\)(H2) ≈ 99% (high; favors more observers). For the bet, SSA undervalues H2 (ignoring scaled impact), while SIA overvalues it (conflating belief and action).  
     - *Two-kinds view*: \(P_w\)(H2) ≈ 1% (SSA-style, invariant under duplicating rooms). For the bet, \(P_d\) weights H2 100× higher than H1 (SIA-style), as duplication doubles affected observers.  
  4. **Apply to presumptuous philosopher**: Show \(P_w\) denies armchair cosmic resolution (requiring evidence), while \(P_d\) justifies SIA-like weighting only for decisions (e.g., planet-sized wagers).  
  5. **Stress-test invariance**: Vary cases (e.g., partial duplication; uncertain duplication) to ensure criterion is robust.  

  Success yields a consistent, non-circular framework:  
  - \(P_w\) resolves doomsday/presumptuousness without absurdity.  
  - \(P_d\) justifies observer-scaled decisions.  
  - The distinction holds across cases via pre-stated invariance.  

  Failure conditions:  
  - Invariance cannot be applied without presupposing which function to use.  
  - \(P_w\) and \(P_d\) converge in all cases, making the distinction artificial.  
  - The framework reintroduces the reference class problem for \(P_w\).  
  - Cosmic Bet intuitions contradict the model’s predictions.  

  Scope for one semester prioritizes formalizing \(P_w\)/\(P_d\) (§1), testing Cosmic Bet (§3), and addressing the presumptuous philosopher (§4). If time runs short, drop stress-testing (§5). The formalization (§1) is most vulnerable to delays, as it must integrate decision theory and invariance cleanly.  

  This project resolves a decades-old impasse by clarifying anthropic probability’s dual nature. It transforms an intuition about question-splitting into a testable criterion, advancing formal epistemology and decision theory.  

