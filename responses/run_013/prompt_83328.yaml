answer: |-
  Here's a disciplined application of Kantorowicz's "The King's Two Bodies" to the 1905 Norwegian dissolution, mapping its explanatory power and limits:

  1.  **Mapping the Refusal:**
      *   **Body Natural:** Oscar II (the mortal man) refused to sanction the consular law. This was an act of his personal will, likely influenced by his dual role as King of Sweden, pressure from Swedish nationalists, and his view of the union's integrity.
      *   **Body Politic (Norwegian):** This is where the fiction becomes crucial. The *theory* suggests the King-in-his-Political-Capacity couldn't *truly* refuse an act demanded by the constitutional body (Storting) if the ministers advised it. The refusal, therefore, couldn't be an act *of* the Norwegian body politic. It was an act *by* the body natural *contrary to* the will of the body politic as expressed through its ministers and parliament. The constitutional mechanism (ministerial responsibility) shielded the *institution* of the Norwegian Crown (body politic) from blame; the refusal was framed as the failing of the *man* (body natural) or his advisors, necessitating the ministers' resignation. The theory *does* explain why the refusal didn't inherently shatter the monarchy as an institution *immediately* – the fault was localized to the natural body.

  2.  **Mapping the Dissolution and Survival:**
      *   **Dissolution of Union/Deposition:** The Storting declared Oscar II ceased to be King of Norway. This was an act *on* the **body politic**.
          *   They severed the *link* between the Norwegian body politic and Oscar II's body natural. They did *not* destroy the Norwegian body politic itself.
          *   The declaration effectively stated that Oscar II's body natural was *defective* (unable/unwilling to fulfill the constitutional role) and thus could no longer embody the Norwegian Crown. The fiction *partially explains* this: the "defect" resided in the natural body, justifying its separation from the political body to preserve the latter's continuity.
      *   **Preservation of the Body Politic:** The Norwegian body politic *did* survive. It was immediately transferred ("re-embodied") in Haakon VII. The seamless transition, the lack of revolutionary rupture, and the continued functioning of the state *underscore* the survival of the immortal political body, just now carried by a different natural body. The fiction *strongly explains* this continuity – the Crown never died.

  3.  **Where the Theory Earns Its Keep:**
      *   Explains the mechanism of blame: The refusal is attributed to the fallible body natural/ministerial advisors, protecting the sanctity/inviolability of the Crown (body politic).
      *   Explains the *lack* of inherent crisis in the Crown itself *after* the refusal: The defect was personal, not institutional.
      *   Explains the *continuity* of the state through the deposition and re-embodiment: The body politic survived the shedding of its defective natural carrier.
      *   Provides a conceptual framework for the sacred/unblameable monarch principle in the 1814 constitution, even if the specific medieval theology wasn't present.

  4.  **Where the Theory Goes Quiet or Faces Challenges:**
      *   **The Dual Body Politic:** Kantorowicz's framework assumes *one* body politic per body natural. 1905 presents Oscar II embodying *two* distinct bodies politic (Norwegian and Swedish). The theory offers *no* internal mechanism for how one body natural can "lose" one body politic while retaining the other peacefully. This is a fundamental **anomaly** for the core medieval model. The theory is silent on the dynamics of personal unions.
      *   **The Source of Authority for Deposition:** The theory doesn't explain *who* or *what* has the authority to declare the body natural defective and sever the link *except* through concepts like divine right or dynastic right, which the Storting explicitly overrode. The Norwegian action was based on parliamentary sovereignty and popular sovereignty (the plebiscite), concepts the medieval theory didn't anticipate.
      *   **The "Export" Problem:** While the *structural principle* (inviolable Crown, ministerial responsibility) aligns with the *effect* of the two bodies fiction, the specific theological and medieval legal underpinnings Kantorowicz described were absent in Norwegian constitutional thought. Using it risks being an anachronistic *analytical lens* rather than explaining the *actors' own understanding*. It wasn't the machinery *they* consciously operated. This doesn't make the mapping invalid for analysis, but it means the theory isn't explaining Norwegian *motivation*, only providing a structural analogy for the *outcome*.

  5.  **Anomalies and Scope:**
      *   **Surgical Separation:** The survival of the Norwegian body politic after being cleanly separated from a body natural that *simultaneously* retained another body politic (Swedish) is a profound **anomaly** Kantorowicz's theory, focused on indivisibility and perpetual union within one realm, never imagined.
      *   **Peaceful Transfer:** The theory was forged in contexts often involving succession crises or violence. Its application to a near-bloodless, legalistic deposition and importation of a new king via parliamentary vote and plebiscite falls largely **outside its original scope**, though it can still illuminate the *conceptual continuity* achieved.

  **Verdict:** 1905 simultaneously **confirms** the core mechanism of continuity for the *surviving* body politic (Norway's) and presents a fundamental **anomaly** regarding the separation from a body natural carrying *multiple* bodies politic, exposing the theory's limitation to single-realm contexts.
