  I need to tackle this systematically. For part 1, I should contrast the negative liberty foundation of at-will employment (where freedom means no interference) with the protective regulations that imply a different value system (dignity, equality). The key tension is how the same system privileges exit over voice while claiming to protect freedom.

  For the discriminator cases in part 2: 
