answer: |-
  Here’s your essay question and assessment materials:

  **Essay Question:**  
  The standard accuracy dominance argument for probabilism assumes: (1) Accuracy is the sole epistemic good; (2) Accuracy is truth-directed and gradable; (3) Incoherent credences are accuracy-dominated by coherent ones across all possible worlds.  
  (a) Identify which premise is a normative posit (not a mathematical theorem) and explain the conditions needed for its plausibility.  
  (b) A student claims this argument structure *directly* supports conditionalization. What critical element does the conditionalization argument require that the probabilism argument does not? Explain why "applying dominance twice" fails.  
  (c) Suppose accuracy of the *entire credence function* at a world is *not* additive (i.e., not the sum of per-proposition scores). Does the dominance step for probabilism still hold? If not, what does this reveal about the argument's foundations?  

  ---

  **Model Answer (412 words):**  

  (a) The premise that **accuracy is the *sole* epistemic good** is the normative posit. It isn’t derivable from mathematical constraints on scoring rules (e.g., strict propriety) but requires philosophical justification. For this to be plausible, two conditions must hold: (i) *Truth-directedness*: Higher accuracy must align with greater proximity to truth. (ii) *Exhaustiveness*: All other putative epistemic virtues (simplicity, explanatory power) must be reducible to or justifiable in terms of accuracy. Without these, other goods (e.g., informativeness) could rationally override accuracy.  

  (b) The conditionalization argument requires **diachronic dominance relative to an evidence partition**, which the probabilism argument avoids. Synchronic dominance (for probabilism) assesses credences *at a single time* across *all possible worlds*. Conditionalization demands that *future* credences dominate *across future worlds* conditional on *current evidence*. This introduces two new elements:  
  - **Temporal indexing**: Dominance must hold *after* learning evidence, requiring a rule linking pre- and post-update credences.  
  - **Evidence-partition sensitivity**: Dominance is assessed *within* cells of the evidence partition, not universally.  
  You cannot "apply dominance twice" because synchronic dominance pre-update doesn’t constrain *how* you update; incoherent agents may avoid dominance *post*-update without violating synchronic coherence. Diachronic dominance directly targets update rules, not static states.  

  (c) If global accuracy isn’t additive (e.g., under non-separable scores like variance), **dominance may fail**. Additivity ensures that local inaccuracies aggregate predictably, enabling the separation of propositions in the dominance proof. Non-additive scores (e.g., rewarding "clumpiness" of beliefs) could permit incoherent functions to escape dominance if their errors "cancel out" holistically. This reveals that the dominance argument’s weight rests **not on accuracy per se, but on the scoring rule’s structure**. The argument assumes that accuracy measures *decompose linearly* across propositions—a substantive commitment about epistemic value. Without additivity, coherence isn’t necessarily tied to dominance, exposing the argument’s dependence on scoring-rule assumptions beyond truth-directedness.  

  ---

  **Marking Scheme (20 points total):**  
  **Must-hit points:**  
  - (a) Identifies "sole epistemic good" as normative posit (1 pt). Explains truth-directedness + exhaustiveness for plausibility (2 pts).  
  - (b) Notes diachronic (not synchronic) dominance is needed (1 pt). Highlights evidence-partition dependence (2 pts). Explains why synchronic dominance doesn’t constrain updates (2 pts).  
  - (c) States dominance *fails* without additivity (1 pt). Links failure to non-aggregation of local scores (2 pts). Identifies scoring-rule structure (not accuracy alone) as foundational (1 pt).  

  **Marks breakdown:**  
  - Part (a): /3  
  - Part (b): /5  
  - Part (c): /3  
  - Clarity, structure, precision: /4  
  - Addressing all sub-questions: /5  

  **Common errors:**  
  - (a) Confusing "truth-directed" (theorem) with "sole good" (normative).  
  - (b) Claiming synchronic dominance directly implies conditionalization; missing evidence-partition dependence.  
  - (c) Assuming dominance holds regardless of additivity; not connecting decomposability to proof mechanics.  

  ---

  **Confidence & Uncertainty:**  
  - **Overall confidence:** 8/10. Core distinctions (synchronic/diachronic, normative/mathematical) are solid.  
  - **Least certain:** Part (c)’s claim that dominance *necessarily* fails without additivity. Some non-additive scores *might* permit dominance (e.g., via convexity), but this is edge-case territory; the thrust (additivity simplifies proofs and reflects common assumptions) holds.  
