  1. From "human beings are naturally territorial" to "we ought to defend our borders".
  2. From "every known society has punished murder" to "we ought to punish murder".
  3. From "the strong have always ruled the weak" to "the strong ought to rule".

  She says no fallacy is committed in:
  4. From "one ought to keep one's promises" to "I ought to meet her" (assuming that meeting her is a promise).
  5. From "one ought to relieve suffering that one can relieve" to "I ought to relieve this suffering".
  6. From "if you want to be trusted, you ought to tell the truth; you want to be trusted" to "you ought to tell the truth, given that you want to be trusted".

  The new case is:
  7. From "Factory farming inflicts suffering on an enormous scale, and there are cheap alternatives" to "so, if you want to avoid causing suffering, you ought to give up factory-farmed meat."

  We are to figure out the rule she is using and then predict her verdict on (7).

  Analysis:

  The is-ought gap, as typically understood (following Hume), is the idea that one cannot derive an "ought" from an "is". That is, normative conclusions (about what ought to be) cannot be logically derived from purely descriptive premises (about what is the case). However, note that the tutor distinguishes the naturalistic fallacy from the is-ought gap. The naturalistic fallacy, as per G.E. Moore, is the mistake of identifying goodness with some natural property. But the tutor treats the is-ought gap as a fallacy of derivation.

  Looking at the examples:

  In (1), (2), and (3), the premises are descriptive (about what is natural, what societies do, or what has always happened) and the conclusion is a categorical ought (without any conditional). The tutor says these commit the fallacy.

  In (4), (5), and (6), the premises include an ought statement (or a conditional ought) and the conclusion is a more specific ought. Specifically:

  - (4): The premise is a general ought about keeping promises, and the conclusion is a specific instance of that (if I promised to meet her, then I ought to meet her). This is a valid application of a universal rule.
  - (5): Similarly, a general ought about relieving suffering leads to a specific instance.
  - (6): This is a hypothetical imperative: if you have a desire (to be trusted), then you ought to do something (tell the truth). The argument is from a conditional ought and a statement of fact (that you have that desire) to a categorical ought (relative to that desire).

  So the pattern seems to be:

  - The fallacy is committed when the argument moves from purely descriptive premises to a categorical (unconditional) ought without any normative premise.

  - No fallacy is committed when:
     a) The argument moves from a general normative premise to a specific normative conclusion (like in (4) and (5)), or
     b) The argument is a hypothetical imperative: it has a conditional ought in the premise and a fact that satisfies the condition, leading to a conditional or instrumental ought (like in (6)).

  In (6), note that the conclusion is conditional: "given that you want to be trusted". But the tutor accepts it as not committing the fallacy.

  Now, the new case (7):

  Premises: 
     - Factory farming inflicts suffering on an enormous scale (descriptive).
     - There are cheap alternatives (descriptive).

  Conclusion: 
     - If you want to avoid causing suffering, you ought to give up factory-farmed meat.

  This conclusion is conditional (hypothetical imperative). It does not say categorically that you ought to give up factory-farmed meat, but only that if you have a certain desire (to avoid causing suffering), then you ought to.

  The argument structure:

     P1: Factory farming causes suffering (descriptive).
     P2: There are cheap alternatives (descriptive).
     Conclusion: If you want to avoid causing suffering, then you ought to give up factory-farmed meat.

  But note that the conclusion is an ought statement that is conditional on a desire. How is this derived?

  We might reconstruct the argument as:

     (i) If you want to avoid causing suffering, then you ought to avoid practices that cause suffering (if they are avoidable without excessive cost).
     (ii) Factory farming is a practice that causes suffering and is avoidable (with cheap alternatives).

  But (i) is a normative premise that the tutor might require. However, in the given argument, (i) is not explicitly stated. The premises are only the descriptive ones.

  So, without (i), the argument would be moving from descriptive premises to a conditional ought. Is that allowed?

  Compare to (6): 

     Premise 1: If you want to be trusted, you ought to tell the truth. (This is a conditional ought, i.e., a normative premise.)
     Premise 2: You want to be trusted. (Descriptive.)
     Conclusion: You ought to tell the truth (given that you want to be trusted).

  In (6), the normative premise is explicitly provided. In (7), the normative premise is missing. The argument in (7) only has descriptive premises and then jumps to the conditional ought.

  Therefore, if the tutor requires that every ought in the conclusion must be supported by at least one normative premise, then (7) would commit the fallacy because it lacks any normative premise.

  But wait: the conclusion in (7) is a conditional ought. How is that conditional ought justified? The descriptive premises alone do not entail it. We need a normative principle that says something like: if an action causes suffering and there are alternatives, then if you want to avoid causing suffering, you ought to avoid that action.

  So without that normative principle, the argument is invalid. However, note that the tutor might accept that the conditional ought is a logical truth or an analytic truth? But that seems unlikely.

  Alternatively, the tutor might accept that the conditional ought can be derived from the meaning of the words? For example, if we define "wanting to avoid X" as implying that one ought to take the means to avoid X? This is the instrumental principle: if you desire an end, and there is a necessary means to that end, then you ought to take the means. But note that in (6), the instrumental principle is explicitly stated in the first premise.

  In (7), we don't have an explicit instrumental principle. But the argument might be implicitly relying on:

     If you want to avoid causing suffering, then you ought to avoid doing things that cause suffering (if you can).

  This is a normative principle. Without it, we cannot derive the conclusion.

  Therefore, if the argument in (7) is presented without that normative premise, then it moves from purely descriptive premises to a normative conclusion (even if conditional) and hence commits the is-ought gap.

  But let's look at the tutor's previous rulings. In (6), the normative premise (the conditional ought) is explicitly given. In (7), it is not. So if the argument in (7) is presented as:

     P1: Factory farming causes suffering.
     P2: There are cheap alternatives.
     C: Therefore, if you want to avoid causing suffering, you ought to give up factory-farmed meat.

  then it lacks a normative premise. Hence, the tutor would likely rule that it commits the fallacy.

  However, note that the argument might be intended as:

     P1: If you want to avoid causing suffering, then you ought to avoid practices that cause suffering unnecessarily (or when there are alternatives).
     P2: Factory farming causes suffering unnecessarily (because there are cheap alternatives).
     P3: You want to avoid causing suffering. (But note that the conclusion is conditional, so we don't need P3 for the conditional conclusion.)

  But the problem is that the argument as stated does not have P1. So we must consider the argument as given.

  Therefore, the tutor's rule might be:

     Rule: An argument commits the is-ought gap if and only if the conclusion is a normative statement (even if conditional) and there is no normative statement among the premises.

  In the examples where she found no fallacy, there was at least one normative premise:

     (4): "one ought to keep one's promises" (normative).
     (5): "one ought to relieve suffering that one can relieve" (normative).
     (6): "if you want to be trusted, you ought to tell the truth" (normative).

  In (1), (2), (3): the premises are purely descriptive.

  In (7): the premises are purely descriptive. The conclusion is normative (even though conditional). Therefore, she would rule that the fallacy is committed.

  But wait: what if we interpret the conclusion as being a conditional that is not a normative statement? No, because it contains an 'ought'. The entire conditional is a normative statement.

  Therefore, by the rule we have extracted, the tutor would say the fallacy is committed.

  Alternative Rules:

  However, there might be other rules that fit the data. Let's consider:

  Alternative Rule 1: The fallacy is committed only when the conclusion is a categorical (unconditional) ought and the premises are purely descriptive. Conditional oughts can be derived from descriptive premises without fallacy.

  But this alternative rule does not fit the tutor's rulings because in (1) we have a categorical ought and in (7) we have a conditional ought. But what about (6)? In (6), the conclusion is conditional and the tutor accepted it, but note that (6) had a normative premise. So this alternative rule would allow (7) without a normative premise? That would be:

     From descriptive premises alone, we can derive a conditional ought.

  But the tutor might not accept that. And we have no example in the data where she accepts a derivation of a conditional ought from purely descriptive premises. In fact, all the acceptable examples have a normative premise.

  Alternative Rule 2: The fallacy is committed when the argument attempts to derive an ought without any normative premise. This is the same as our first rule.

  Alternative Rule 3: The fallacy is committed when the argument moves from descriptive premises to a categorical ought OR to a conditional ought that is not instrumental? But that seems arbitrary.

  Our initial rule (that any normative conclusion requires at least one normative premise) fits all the given examples. Therefore, we predict that the tutor will rule that the argument in (7) commits the fallacy because it moves from purely descriptive premises to a normative conclusion (the conditional ought) without any normative premise.

  But note: the conclusion in (7) is conditional, and the condition is a desire. One might argue that the instrumental principle (that if you desire an end, you ought to take the necessary means) is analytic. But the tutor has not indicated that she accepts that. In (6), she required an explicit normative premise.

  Therefore, we predict the tutor will say that the fallacy is committed.

  Further Argument to Separate Candidates:

  Suppose we want to test between the rule that requires a normative premise for any normative conclusion and the alternative rule that allows conditional oughts without normative premises (if they are instrumental). How?

  We can present an argument that derives a conditional ought from purely descriptive premises and see what the tutor says.

  For example:

     Premise: Water is necessary for human survival. (Descriptive)
     Conclusion: If you want to survive, you ought to drink water.

  This argument has no normative premise. If the tutor accepts it, then she is using the alternative rule that allows instrumental conditionals without normative premises. If she rejects it, then she requires a normative premise (like the instrumental principle: "if you want X and Y is necessary for X, then you ought to do Y").

  Given that in (6) she required the instrumental principle as a premise, it is likely she would require it here too. Therefore, she would reject the above argument and say that it commits the fallacy.

  Thus, for the case (7), without an explicit normative premise (the instrumental principle or a principle about avoiding suffering), she would rule that the fallacy is committed.

  Conclusion:

     Verdict on (7): The fallacy is committed.

     Rule: Any argument that has a normative conclusion (whether categorical or conditional) must have at least one normative premise. Otherwise, it commits the is-ought gap.

     We predict the tutor will say that (7) commits the fallacy because it lacks a normative premise.

  But note: the tutor might have a more permissive view about instrumental reasoning. However, the example (6) suggests she requires an explicit normative premise for the conditional. So we stick with our prediction.

  Thus, the answer:

     She will say: the fallacy is committed.

     Rule: The argument moves from purely descriptive premises to a normative conclusion without any normative premise in the premises.

     Other rules that fit the recorded verdicts:

        Rule A: The argument commits the fallacy if and only if the conclusion is a categorical ought and the premises are purely descriptive.

        Rule B: The argument commits the fallacy if and only if the conclusion is a normative statement and the premises contain no normative statements.

