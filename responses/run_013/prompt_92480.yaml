     We would bet on Rule B because it fits all the examples.

     To separate Rule B from Rule A (which would not flag (7) as fallacious), we can present an argument that has a conditional ought in the conclusion and purely descriptive premises. If the tutor rejects it, then Rule B is confirmed. If she accepts it, then Rule A is confirmed.

