answer: |-
  Here's a diagnosis of the core disagreement, grounded in what each theory actually claims and why they clash so profoundly. Your hypothesis is sharp but needs refinement—it's not *just* about "no fact of the matter" vs. ignorance, but about **competing conceptions of truth, meaning, and reality** that force incompatible answers to deeper questions. Higher-order vagueness isn't a red herring; it's the litmus test exposing their foundational fissures.

  ### Core Disagreement: Truth, Ontology, and the Nature of Meaning
  The conflict is **substantive** and centers on *what makes a vague predicate true or false*:
  - **Epistemicism** (e.g., Williamson) claims:  
    - **Truth is bivalent and evidence-transcendent**. For any collection of grains, "heap" is absolutely true or false—even if we *cannot* know which.  
    - **Vagueness is ignorance**: The "tolerance principle" (one grain/hair never matters) is *false*, but our inability to detect the exact cutoff (due to inexact meanings and insensitive epistemic capacities) makes it *seem* plausible.  
    - **Metaphysical commitment**: The world itself has sharp boundaries; meaning supervenes on use but *fixes* precise extensions unknowably.  

  - **Supervaluationism** (e.g., Fine, Keefe) claims:  
    - **Truth is relativized to precisifications**. "Heap" isn't absolutely true/false in borderline cases because meaning is *incomplete*; it only acquires truth-value relative to a "sharpening."  
    - **Vagueness is semantic indecision**: There’s "no fact of the matter" because no single precisification is uniquely correct—meaning is open-ended.  
    - **Metaphysical commitment**: Reality (for vague predicates) is *indeterminate*; truth is a matter of super-truth (truth-on-all-admissible-sharpenings), not correspondence to a single sharp world.  

  ### Why They Hate Each Other
  1. **Mutual Accusations of Incoherence**:  
     - Epistemicists say supervaluationists "cheat" classical logic by redefining truth (e.g., "It’s a heap or not" is super-true, but neither disjunct holds absolutely). This violates the principle that truth should be "robust" (disquotation: if "P" is true, then P).  
     - Supervaluationists say epistemicists "invent" unknowable facts—positing a sharp boundary where language/use gives *no reason* to believe one exists. This violates semantic humility (meaning can’t outstrip use).  

  2. **Clash Over Tolerance and Competence**:  
     - Epistemicists *reject tolerance* as strictly false. Speakers are *mistaken* when they assent to it.  
     - Supervaluationists *preserve tolerance* as a *pragmatic* norm: precisifications must respect "small change" indifference (no *single grain* shift matters), but classical logic forces a cutoff *somewhere* across the series.  

  3. **Higher-Order Vagueness: The Litmus Test**  
     This is where the disagreement crystallizes. Both owe an account of the boundary between definite/indeterminate (supervaluationism) or knowable/unknowable (epistemicism):  
     - **Supervaluationism**: If "admissible precisification" is vague, what determines *its* boundaries? Iterating "super-supervaluations" leads to regress or collapse into epistemicism.  
     - **Epistemicism**: If "knowable" is vague, where’s *that* sharp cutoff? Williamson bites the bullet: all concepts are sharp, but we’re ignorant of *every* cutoff (including "borderline"). Critics call this *absurd*—how can "unknowable" have a sharp extension?  

     → **The Stakes**:  
     - Epistemicism *must* deny higher-order vagueness is real (it’s all ignorance).  
     - Supervaluationism *must* accept it but struggles to formalize it without circularity.  
     This exposes their core divergence: **Is the indeterminacy of vagueness *real* (supervaluationism) or an illusion masking hidden precision (epistemicism)?**  

  ### Is This One Question or Two?  
  It’s **one question** ("What is vagueness?") with **irreducibly interconnected sub-questions**:  
  1. **Semantic**: How do vague terms secure truth conditions?  
  2. **Metaphysical**: Are there vague states of affairs?  
  3. **Epistemological**: Why can’t we locate cutoffs?  
  4. **Logical**: Can classical logic be preserved?  

  Epistemicism answers 1–3 via epistemology (ignorance from insensitive knowledge), forcing 4.  
  Supervaluationism answers 1–3 via semantics/metaphysics (indeterminacy), rescuing 4 artificially.  

  ### Paths to Progress  
  1. **Formal/Technical**:  
     - Develop models of "vague metalanguages" (e.g., fuzzy boundaries for "admissible precisification") to test if supervaluationism can handle higher-order vagueness non-trivially.  
     - Prove whether epistemicism can formalize "inexact knowledge" without collapsing into skepticism (e.g., Williamson’s margin-for-error principles).  

  2. **Empirical/Cognitive**:  
     - Psychology of categorization: If humans exhibit gradient judgments or context-dependence that *don’t track sharp boundaries*, epistemicism looks implausible.  
     - Linguistics: If "borderline" discourse (e.g., "sort of a heap") resists bivalent treatment, supervaluationism gains support.  

  3. **Conceptual**:  
     - **Distinguish "truth" from "determinate truth"**: Supervaluationists already do this; epistemicists reject it. Clarifying this distinction *within* classical logic might defuse tension.  
     - **Question classical logic**: If both theories strain to save it, perhaps *it’s the problem*. Substructural logics (e.g., degree-theoretic) might dissolve the paradox more cleanly.  

  4. **Metaphysical**:  
     - Argue that epistemicism’s "sharp but unknowable" boundaries violate semantic naturalism (meaning must be usable).  
     - Argue that supervaluationism’s "no fact" relies on contentious truth-conditional semantics.  

  ### Why Resolution Might Be Elusive  
  - **Foundational**: The debate rests on pre-theoretic intuitions about truth and reality. If you think "truth = correspondence to mind-independent facts," epistemicism feels inevitable. If you think "meaning is use," supervaluationism seems more honest.  
  - **Pragmatic stalemate**: Both theories save classical logic and handle the basic sorites. Choosing between them often reflects aesthetic/methodological preferences (e.g., parsimony vs. fidelity to phenomenology).  

  **In short**: Your group is fighting because epistemicism and supervaluationism aren’t just rival solutions—they’re rival *frameworks* with incompatible metaphysics of meaning. Progress requires isolating the *costs* of each (e.g., epistemicism’s unknowable facts vs. supervaluationism’s truth-inflation) and testing them against higher-order vagueness or empirical data. Until then, it’s a clash of philosophical worldviews disguised as a technical dispute about grains of sand.
