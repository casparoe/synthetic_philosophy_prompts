  First, I need to unpack the core tension. Both theories preserve classical logic but for different reasons. Epistemicism insists there's a sharp cutoff we can't know, while supervaluationism denies any fact of the matter in borderline cases. The user's hypothesis is that the fight is really about truth and knowledge metaphysics—whether "no fact of the matter" is meaningful or just disguised ignorance. 

  But I should check if there's more. The user mentions possible angles: world vs. mind location of vagueness, or two different questions conflated (semantics vs. logic). Also, they flag higher-order vagueness as a potential battleground—both theories struggle to explain the boundaries of their key concepts (admissible precisifications vs. knowability). 

  Looking deeper at what each side says:  
  - Epistemicists (like Williamson) treat vagueness as a limitation of our knowledge, rooted in inexact meanings and insensitive epistemic capacities. Borderline cases exist because we can't detect the exact cutoff.  
  - Supervaluationists (like Fine/Keefe) see vagueness as semantic indecision—meaning is incomplete, so truth depends on precisifications. "No fact of the matter" isn't ignorance but indeterminacy.  

  Their mutual contempt makes sense. Epistemicists think supervaluationists "cheat" by redefining truth and ignoring bivalence in borderline cases. Supervaluationists think epistemicists invent unknowable facts.  

  The user is sharp to notice higher-order vagueness is critical. Both theories face regress:  
  - Epistemicism: If "knowable" is vague, where's *that* cutoff?  
  - Supervaluationism: If "admissible precisification" is vague, how do we avoid infinite layers?  
  This exposes their foundations—epistemicism leans on epistemology, supervaluationism on metaphysics of meaning.  

  Substantively, the divide is about truth and ontology. Epistemicists need a world with sharp boundaries; supervaluationists need truth relativized to precisifications. It's verbal only if we reduce "fact" to "knowable," but that’s the very point of contention!  

  Progress might come from:  
  1. **Formal tools**: Model higher-order vagueness (e.g., fuzzy boundaries in precisifications) to test coherence.  
  2. **Empirical work**: Psychology of categorization could pressure epistemicism—if humans don’t track sharp cutoffs, why posit them?  
  3. **Conceptual shifts**: Distinguish "truth in virtue of meaning" vs. "truth in virtue of world," or accept that classical logic isn’t sacred.  

