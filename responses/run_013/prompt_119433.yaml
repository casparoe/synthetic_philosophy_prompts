prompt: |-
  Right, I've been going round in circles on the Frankfurt-style cases and I want to dump all my gut verdicts in one place and have someone tell me what principle is actually doing the work here, or whether I just have to drop one of them. Answer in British English please.

  The general shape, in case you need it: someone does a thing off their own bat, but if they hadn't been about to, someone else would have made them do it. Usual verdict is that they're still fully responsible. Fine. But I've been poking at the details and now I'm a mess. Here's what I think, case by case.

  Dara votes Green. A neuroscientist has put a thing in her head that would have made her hand mark the Green box if she'd shown any sign of not doing it. She votes Green on her own, cheerfully, no wobble at all. I think she's fully responsible, and I'd tell the neuroscientist to get lost if she tried to take any credit for it.

  Same thing, except the device works by flooding Dara with an overwhelming urge to vote Green rather than by moving her hand — her reasoning is still hers, just loaded. It never fires. I think this is exactly as responsible as the first one. My flatmate says no, that one's different, because the thing would have worked *through* her rather than *on* her. I dont see it.

  The trigger was her blood sugar. Device fires below 4.0, she's at 4.1. Nothing happens, she votes Green anyway. I think: no difference at all. My flatmate says "well, she got lucky," and I say luck isn't the issue, either you could have done otherwise or you couldn't. Though when he asks whether it's the same if the device would only have fired had she won the lottery, I get noticeably less confident.

  Just before she votes, Dara has a half-second flicker of wanting to spoil her ballot, then thinks better of it. The device was monitoring and would have smoothed the flicker away if it had grown, but it was too weak to trip the trigger. I think the flicker is irrelevant — she's responsible, and if she says "ah but I could have spoilt it," that's just false.

  Nia is a lifeguard. A swimmer drowns while she's on the tower. She never moved to help — not a decision, she just sat there, vaguely aware, thinking about lunch. There was a device in her back that would have paralysed her arm if she'd reached for the float. It never fired because she never reached. I think she is *not* responsible for the drowning. Not "less" — not hers at all. I'd defend that one in court.

  Theo sits on a planning committee and a housing scheme dies because he won't sign the form. Same kind of device on him — it would have paralysed his arm if he'd reached for the pen. He never reached, but this time it's because he'd decided not to sign, and he was glad the thing was going down. I think he's fully responsible. Which is the same shape as Nia and I cannot seperate them.

  Priya grew up wanting exactly the thing she now does. No device anywhere. A manipulator twenty years ago fixed her school, her friends, what she read, so that she'd turn out this way and never need forcing. She does the thing, unforced, out of a desire that is genuinely hers in the ordinary sense. I think her responsibility is compromised — not gone, but not the same. And I can't say why that's different from the first Dara case, where I was happy to say the counterfactual stuff doesn't matter at all.

  My mate's take, which I half like: the manipulator in all the Dara cases is a *shadow* — someone who would have done it *for* her but never did anything *to* her — and all my verdicts are tracking what was actually done to the agent, not what could have been. If that's the right axis then it saves Dara, but it makes a nonsense of Nia versus Theo, because nothing was done to either of them either.

  So: is there a principle that gets all of these, or close? My own guess was "you're responsible just in case what actually happened flowed from your own deliberation, and all the counterfactual machinery is beside the point" — but that hands me Nia, which I won't accept, and it says nothing about Priya. State it precisely if you've got one, tell me which of my verdicts it buys and which it has to overrule, and don't just give me the standard line, I've heard it. Two cases I haven't listed that I'd like it to pronounce on: (a) a device that would have made Dara do something completely different — not vote at all, but set fire to the polling station — if she'd shown any sign of staying home, everything else the same; and (b) a case where the shadow never needed to act, but the agent knew about it all along and did the thing *because* she knew she had no alternative. Where does my pattern break?
reasoning: |-
  Alright, let's tackle this step by step. The user is deeply tangled in Frankfurt-style cases and wants clarity on the underlying principles behind their intuitive judgments. They’ve listed multiple scenarios with conflicting intuitions and need a unifying framework. 

  First, I notice the user’s frustration—they’re "going round in circles," which suggests they’ve engaged deeply but hit conceptual walls. Their demand for British English and dismissal of "standard lines" implies they’ve encountered textbook answers that feel inadequate. They’re not just after definitions; they want their *specific* intuitions reconciled. 

  The core tension in their examples hinges on three things:  
  1. **Actual vs. counterfactual intervention**: In Dara’s cases, they consistently dismiss the unactivated device as irrelevant to responsibility.  
  2. **Omission vs. commission**: Nia’s inaction (non-intervention) feels non-responsible, while Theo’s deliberate refusal (commission) feels responsible—yet both involve identical counterfactual constraints.  
  3. **History/manipulation**: Priya’s lifelong manipulation compromises responsibility despite surface similarities to Dara’s untouched agency.  

  Their flatmate’s "shadow" theory (only actual interventions matter) explains Dara but fails Nia/Theo/Priya. The user’s own "deliberation" theory captures Theo but not Nia (who didn’t deliberate) or Priya (whose deliberation was manipulated).  

  **Key insight**: The user’s intuitions track *two distinct layers*:  
  - **Sourcehood**: Was the action *authored* by the agent’s own psychology? (This saves Dara/Theo but sinks Priya.)  
  - **Normative competence**: Did the agent engage their capacity for moral reasoning? (This distinguishes Theo’s refusal from Nia’s passive neglect.)  

  For Priya, even if her desire feels "genuine," its *external origin* undermines sourcehood. For Nia, her total lack of deliberation means her omission wasn’t an exercise of agency at all—unlike Theo’s conscious choice.  

  **Stress-testing with new cases**:  
  - **(a) Arson device**: Dara votes freely; the unused backup would’ve forced arson. User’s pattern holds: responsibility intact, as the shadow didn’t act.  
  - **(b) Known shadow**: If Dara votes *because* she knows she can’t do otherwise, it becomes coerced—responsibility collapses. This breaks their pattern, revealing that awareness of constraint can vitiate agency even without intervention.  

  **The hidden principle**: Responsibility requires **undominated unactualized alternatives**. The alternative must be *relevantly possible* for the agent—not just physically, but as a live option within their agential landscape. Nia had no alternative *to consider*; Theo did but rejected it; Priya’s alternatives were erased preemptively.  

  **British English polish**: Using phrases like "get stuffed" for the neuroscientist, "won’t wear" for objections, and framing luck as "dumb luck" keeps it colloquially crisp while dissecting the philosophy.  

  **Final verdict**: The user’s intuitions are largely salvageable if we:  
  1. Distinguish *external* constraints (irrelevant if unactivated) from *internal* ones (e.g., manipulated psychology).  
  2. Treat omissions as responsible *only* if the agent engaged with the moral demand (Theo did; Nia didn’t).  
  3. Accept that history matters when it subverts the agent’s status as source of their will.  

  The crack in their framework is case (b)—knowledge of constraint can undermine responsibility without intervention. That’s the pivot.
answer: |-
  Right, let's get this sorted. You've got a solid set of intuitions here, but they're being pulled in different directions by different features of the cases. The standard Frankfurt "no alternative" defence (that responsibility doesn't require the ability to do otherwise) *partly* explains your Dara judgements but leaves Nia, Theo, and Priya in a muddle. Your flatmate's "shadow" idea captures the Dara cases but doesn't resolve the omissions or history problems. I think your core instinct—**focusing on what *actually happened* to the agent**—is sound, but it needs refining to handle omissions and manipulation. Here's a principle that gets close to your verdicts:

  ### The Principle: Undominated Actual Agency
  **An agent is fully responsible for an action (or omission) if:**
  1. **The action/omission *actually* issued from their own, unimpeded deliberative agency** (i.e., it flowed from their reasons-responsive psychology without intervention), *and*  
  2. **Their agency itself wasn't the *product* of bypassing or subversion** (e.g., manipulation that undermines their status as the authentic source of their will).

  **Key clarifications:**  
  - "**Deliberative agency**" means the action/omission resulted from their conscious or unconscious practical reasoning (not just reflexes or total passivity).  
  - "**Unimpeded**" means no *actual* interference occurred—unactivated counterfactuals (shadows) don't count.  
  - "**Product of bypassing/subversion**" targets cases like Priya, where the agent's psychology is engineered to remove relevant alternatives *before* the act.  

  This principle prioritises *actual causal history* over counterfactuals, but adds a "sourcehood" condition to handle manipulation. Now, let's run your cases:

  ---

  ### Your Verdicts vs. The Principle:
  | Case | Your Verdict | Principle's Verdict | Notes |
  |------|--------------|---------------------|-------|
  | **Dara (hand device)** | Fully responsible | ✅ Fully responsible | No actual intervention; her vote flowed from her unimpeded deliberation. Shadow irrelevant. |
  | **Dara (urge device)** | Fully responsible | ✅ Fully responsible | *Exactly the same*: no actual urge flooded her. The *mechanism* of the shadow doesn't matter—only that it didn't act. |
  | **Dara (blood sugar trigger)** | Fully responsible | ✅ Fully responsible | Luck is irrelevant. No actual intervention → unimpeded agency. (Lottery case same: still just luck.) |  
  | **Dara (flicker of doubt)** | Fully responsible | ✅ Fully responsible | The flicker was part of her deliberation; it wasn't suppressed. She chose. |
  | **Nia (lifeguard omission)** | **Not responsible** | ✅ Not responsible | ⚠️ *Crucial point:* Her omission didn't issue from *deliberative agency*. She was passive, not reasoning about saving/swimming. The shadow didn't act, but *she* didn't act either—no agency to credit. |  
  | **Theo (planning refusal)** | Fully responsible | ✅ Fully responsible | His refusal *did* issue from deliberative agency ("decided not to sign, glad"). Unimpeded by the shadow. *Omission due to choice* ≠ *passive omission*. |  
  | **Priya (lifelong manip.)** | **Compromised** | ✅ Compromised | ❗ Her agency *was* subverted: her "genuine" desire is the *product* of manipulation that engineered her will. Sourcehood undermined, even with no current shadow. |  
  | **Dara (arson device)** | (You didn't state, but implied) | ✅ Fully responsible | Same as first case: no actual intervention. Her vote still flowed from *her* unimpeded reasons. |  
  | **Dara (knew about shadow)** | (You didn't state) | ❌ **Not responsible** | ⚠️ **This breaks your pattern.** If she votes *only because* she knows she can't do otherwise, her agency is *coerced by the knowledge*. It's not undominated—the shadow *actually* influenced her psychology. |  

  ---

  ### Why This Works:
  - **Saves your Dara judgements**: All cases have *actual* unimpeded agency. Shadows are irrelevant. Your flatmate's "through her vs. on her" distinction collapses—only *actual* effects matter.  
  - **Distinguishes Nia vs. Theo**: Nia's omission wasn't agential (no deliberation); Theo's was. The principle handles **omissions** by requiring they stem from deliberation (e.g., consciously *deciding* not to act). Passive neglect ≠ deliberate refusal.  
  - **Handles Priya**: The manipulation *actually* subverted her agency's development. She lacks "undominated" sourcehood.  
  - **Explains blood sugar/lottery confidence dip**: It's not about luck, but if the trigger condition (e.g., lottery win) *itself* suggests prior manipulation (e.g., "device fires only if she won rigged lottery"), it might compromise sourcehood. But pure chance? Still responsible.  

  ### Where Your Gut Might Resist:
  - **Nia's passivity**: You insist she's "not at all" responsible. The principle agrees—but *only* because she exhibited no agency. If Nia had *decided* not to save ("Swimmer's fit, they'll be fine"), she'd be responsible, shadow or not.  
  - **Theo's responsibility**: He *is* responsible under the principle, as his refusal was agential. The shadow is irrelevant.  
  - **Known shadow case (Dara(b))**: This is the kicker. If the shadow *actually* causes her vote by removing her sense of alternatives, it *does* impede her agency. You'd likely agree if pressed: "I only did it because I had no choice" is a classic excuse.  

  ### Why "Standard" Frankfurt Isn't Enough:
  Frankfurt cases focus on **alternative possibilities** (you can't do otherwise, but still responsible). That gets Dara right but fails elsewhere:  
  - It can't distinguish **Theo** (responsible omission) from **Nia** (non-responsible omission)—both lacked alternatives.  
  - It ignores **history** (Priya).  
  - It says nothing about **passivity vs. agency**.  

  Your principle fixes this by demanding **actual, undominated agency**—not just the absence of alternatives.  

  ### Final Word:
  You're right to distrust shadows. Stick to **what actually happened**: Did the agent *do* it (or omit it) *themselves*, without interference? And was their *self* not rigged from the start? That buys all your verdicts except the "known shadow" case—where the shadow *does* actually interfere (psychologically). If you want to hold the line there, you'd need to drop the idea that *awareness* of constraint compromises agency—but that’d be a tough sell. Priya shows history matters; Dara(b) shows psychology matters. Shadows aren’t always shadows—sometimes they cast real shade.  

  If you’ve got a follow-up case that still grates, throw it here. We’ll get it sorted.
