prompt: |-
  I run spiritual care for the palliative service at a mid-sized hospital, and two or three times a month a patient or a family member brings us a near-death experience and wants it treated as evidence about what happens after death: a woman who says she has seen the other side and now wants her do-not-resuscitate order reversed; a daughter who reports that her dying father sat up and described meeting his mother, and who takes this to settle the question; a man whose own cardiac arrest produced an experience he now cites when he asks us whether he should be afraid. Our team is not qualified to adjudicate anyone's metaphysics and will not pretend otherwise, but we cannot keep answering with a shrug either, because the claim is doing real work in the room — it steers treatment decisions, family conflict, and whether a patient can be comforted at all.

  I want a decision procedure grounded in A. J. Ayer's treatment of this question. Ayer's criterion, in Language, Truth and Logic, was that a sentence carries factual meaning only if some possible experience could count for or against it; turned on survival of death, the criterion threatens to make the claim either a prediction whose verification conditions are obscure or not a factual claim at all. Ayer himself is the awkward illustration: in the late 1980s, after a near-death episode of his own, he reported the experience publicly, allowed that it had left him less certain than he had been that death is the end of him, and still treated it as possibly a hallucination of a distressed brain. A theorist with the strongest reasons to discount such reports, unable to fully discount his own — that is the shape of what my team actually faces, so the procedure has to be built for it rather than around it.

  The procedure must sort what a patient or family member is asserting into the different things such reports can carry: a biographical fact about an experience that occurred, a prediction about what will happen to someone, a commitment that would make no experiential difference either way, and an expression of fear or hope that is not a claim at all. It should confront the strongest reply the family member has — that survival is verifiable after all, by the one who survives — and say whether Ayer's criterion absorbs that reply or explains it away. It should also say what the team is to do with the unexamined answer most families are relying on: what would count as the same person continuing, and whether memory, body, or character is doing the work. Then, in order: what to ask, what counts as a sufficient answer, where the procedure stops and hands the matter to a person (the patient's autonomy, a family's grief, a clinician's own conscience), and where it simply cannot help. It has to run in ten minutes at the bedside, be usable by a chaplain or a nurse with no philosophy training, and produce something that can be recorded in the chart.

  Apply it to three cases: the patient who reverses her DNR after her experience; the daughter who cites her father's deathbed report as settling the question and presses the team toward continued aggressive treatment; and one case of your choosing in which the procedure returns an answer my team will not like. I expect that last to be a patient whose refusal of a treatment we believe would help rests on what he says he saw, and I want to see how the procedure handles a refusal it cannot argue with on the merits.

  Include one step that turns the criterion back on the practitioner: before responding, the team member should ask whether the response they are about to give would change at all if the patient's claim about the afterlife were false. If it would not change, they are answering distress and not metaphysics, and should say so out loud. Close by naming what the procedure cannot do — it cannot tell anyone whether they survive death, and it should not try.
reasoning: |-
  We are building a decision procedure based on A.J. Ayer's verification criterion. The criterion states that a statement has factual meaning only if some possible observation could count for or against its truth. Applied to near-death experiences (NDEs) and claims about life after death, we must sort the claims into:
  1. Biographical facts about the experience (which are verifiable by the person having the experience and by others who hear the report).
  2. Predictions about what will happen (which, for events after death, lack clear verification conditions).
  3. Non-factual commitments (e.g., religious beliefs that are not subject to empirical verification).
  4. Expressions of emotion (fear, hope) that are not claims about reality.

  The procedure must also address the common reply: that survival is verifiable by the person who survives (after death). Ayer's criterion would dismiss this because we have no way to verify an experience that occurs after death (since the person cannot report back to the living). However, we must acknowledge that the person having the experience might feel they have verified it for themselves. The procedure should explain that from the perspective of the living (including the medical team), such verification is not possible.

  Additionally, the procedure must address the unexamined assumptions about personal identity (what makes a person the same after death? memory, body, or character?). We note that without a body, the criteria for personal identity become unclear and are not empirically verifiable.

  The procedure steps:

  1. **Acknowledge and Clarify**: Listen to the report and ask clarifying questions to understand exactly what is being claimed. Determine the type of claim: 
     - Is it a report of an experience (biographical fact)?
     - A prediction about the afterlife?
     - A commitment (e.g., a belief)?
     - An expression of emotion?

  2. **Apply Ayer's Criterion**:
     - For a biographical claim (e.g., "I had an experience of seeing a light"), we can verify it by the person's testimony and their state at the time (e.g., during cardiac arrest). This is a fact about the past experience.
     - For a prediction (e.g., "I will survive death"), ask: what experience could verify this? If the answer is that the person will experience it after death, note that we (the living) cannot verify it. Thus, by Ayer's criterion, it is not a factual claim (or at least, not one we can verify).
     - For a commitment (e.g., "I believe in an afterlife"), this is a statement of belief and not subject to verification. It is meaningful to the person but not a factual claim.
     - For an expression of emotion (e.g., "I am afraid of dying"), this is not a claim about the world but about the speaker's state.

  3. **Address the Strongest Reply**: If the person says, "I will verify it myself when I die," we can respond: "That experience, if it happens, would be private and not communicable to us. Therefore, for us, it cannot be verified. We can only treat it as a belief or hope."

  4. **Unexamined Assumptions about Personal Identity**: Point out that what counts as the same person after death is not clear. Is it the same if they have the same memories? But without a brain, how? The same body? But the body is dead. The same soul? We have no way to verify. Therefore, the claim about personal survival is not empirically grounded.

  5. **Decision Tree for Actions**:
     - If the claim is a biographical fact about an experience, we record it as such and validate the person's experience without endorsing any interpretation.
     - If the claim is a prediction about the afterlife, we note that it is not verifiable and thus not a factual claim that can guide medical decisions. We redirect to the patient's values and goals of care.
     - If the claim is a commitment (belief) or expression of emotion, we address the underlying need (e.g., fear, hope) without engaging in the metaphysics.

  6. **Turn the Criterion on the Practitioner**: Before responding, the team member should ask: "Would my response change if the patient's claim about the afterlife were false?" If the answer is no, then we are addressing the person's distress or hope, not the truth of the claim. We should say that out loud: "I hear that this experience has given you comfort (or fear), and we are here to support you in that."

  7. **Limits of the Procedure**:
     - It cannot tell anyone whether they survive death.
     - It should not try to prove or disprove the afterlife.
     - It can only sort claims and address the verifiable aspects (the experience itself and the person's current state).

  The procedure must run in 10 minutes and be usable by non-philosophers. It should produce a chart note that classifies the claim and the response.

  Now, apply to three cases.

  **Case 1: Patient reverses DNR after her NDE**

  - Patient: "I saw the other side and it was beautiful. I no longer want a DNR because I know there's something after, but I want to live longer now."
  - Procedure:
    1. Acknowledge: "It sounds like you had a powerful experience that has changed your perspective."
    2. Clarify: The claim includes a biographical fact (she had an experience) and a prediction (there is an afterlife). The reversal of DNR is a treatment decision based on that prediction.
    3. Apply Ayer: 
       - Biographical fact: We accept that she had the experience. 
       - Prediction: The existence of an afterlife is not verifiable by us. Therefore, we cannot treat it as evidence for medical decisions.
    4. Address the reply: If she says she knows because she saw, we note that we cannot verify what she saw as being the afterlife, only that she had the experience.
    5. Personal identity: Not central here, but note that her experience does not provide evidence that her body will survive death (which is what DNR is about).
    6. Action: We focus on her values and goals. Ask: "What about the experience makes you want to reverse the DNR? Is it that you feel more hopeful about life now, or that you are less afraid of death?" If the latter, we might say: "We are glad you feel less afraid. But the DNR decision should be based on your current health and what you want for your medical care if your heart stops. We should discuss what the experience means for your goals in the time you have left." 
    7. Turn the criterion: If we are about to say that the NDE doesn't prove an afterlife, but we would still support her autonomy to change her DNR regardless of the cause, then we are answering her distress and hope. We say: "We respect your right to change your mind about the DNR. We are here to support your decisions and to help you live as well as possible."
    8. Record: "Patient reports a near-death experience that she interprets as evidence of an afterlife. This has led her to reverse her DNR. We discussed her goals of care and she states she wishes to pursue full treatment. DNR reversed per patient request."

  **Case 2: Daughter cites father's deathbed report**

  - Daughter: "My father sat up and described meeting his mother. This proves there is an afterlife. Therefore, we want everything done to keep him alive as long as possible because every moment is precious and maybe he can come back and tell us more."
  - Procedure:
    1. Acknowledge: "It must have been very moving to see your father have that experience and share it with you."
    2. Clarify: The daughter is making a biographical claim (her father had an experience and reported it) and using it as evidence for an afterlife and then as a reason for aggressive treatment.
    3. Apply Ayer:
       - Biographical: Yes, the father had an experience and reported it. That is a fact.
       - Prediction: The claim that the father met his mother in the afterlife is not verifiable. We cannot know if it was a vision, a dream, or something else. Therefore, it does not prove survival after death.
    4. Address the reply: The daughter might say that her father verified it by experiencing it. We note that we have only his report, which was given before death, and we cannot verify the content of the experience. Also, the father cannot report after death to verify it further.
    5. Personal identity: The daughter assumes that the person her father saw was his mother (same person). But without a body, how do we know? It's an unverifiable assumption.
    6. Action: We redirect to the patient's condition and goals of care. The father is dying. Aggressive treatment may cause suffering without benefit. We ask: "What would your father have wanted if he could not recover? We must base treatment on his medical condition and his previously expressed wishes, not on the interpretation of his vision." If the father had expressed wishes (e.g., in an advance directive), we follow that. If not, we focus on comfort.
    7. Turn the criterion: If we are about to say that the vision doesn't prove an afterlife, but we would still not provide aggressive treatment if it is futile, then we are answering based on medical evidence and the patient's best interest. We say: "We understand that this experience gives you hope, but our medical team must make recommendations based on what is medically appropriate and what your father would have wanted. We cannot use an unverifiable claim to guide treatment that might cause harm without benefit."
    8. Record: "Family reports that patient had a vision of his mother before death. Family interprets this as evidence of an afterlife and requests aggressive treatment. We discussed the patient's poor prognosis and prior wishes (if any). Treatment plan remains focused on comfort care."

  **Case 3: Patient refuses treatment based on NDE (the one the team won't like)**

  - Patient: "During my cardiac arrest, I was told by a being of light that I should refuse chemotherapy because it's time for me to come home. I won't have the treatment."
  - Procedure:
    1. Acknowledge: "That sounds like a profound experience that has given you clear guidance."
    2. Clarify: The patient is reporting a biographical fact (the experience) and interpreting it as a divine instruction to refuse treatment.
    3. Apply Ayer:
       - Biographical: We accept that he had the experience and that it included a message.
       - The message about it being "time to come home" is a non-verifiable claim (we cannot verify the existence of the being or the truth of the message). Therefore, it is not a factual claim that can be used to assess the medical benefits of chemotherapy.
    4. Address the reply: The patient might say he knows because he was told. We note that we cannot verify the source of the message. It might be a product of his brain under stress.
    5. Personal identity: Not central, but note the message implies a continuation of the self in a different place ("home"). We cannot verify what that self would be.
    6. Action: We must respect patient autonomy. If the patient has decision-making capacity, he has the right to refuse treatment. We do not have to agree with his reasons. We can provide information about the treatment and the consequences of refusal, but we cannot force treatment. We can ask: "Can you tell me more about how this experience has shaped your decision? Is there anything else that would help you feel at peace with your choice?" We also assess for depression or other factors that might impair judgment, but if he has capacity, we accept the refusal.
    7. Turn the criterion: If we are about to argue against the refusal by challenging the NDE, we stop and ask: would our recommendation for chemotherapy change if the NDE were a hallucination? Yes, because the medical evidence supports chemotherapy. But if the patient has capacity and refuses, we must respect that. We are not answering the metaphysical claim but the patient's right to choose. We say: "We respect your right to make decisions about your body. We are concerned because we believe the treatment could help you, but we will honor your choice. We are here to support you and keep you comfortable."
    8. Record: "Patient reports a near-death experience in which he received a message to refuse further chemotherapy. Patient has decision-making capacity and refuses treatment. Risks and benefits of treatment discussed, and patient understands. Treatment refusal documented."

  **Closing**: The procedure cannot tell anyone whether they survive death. It should not try. It can only help sort claims and address the verifiable aspects (the experience and the person's current state) and support the person in their emotional and spiritual needs.
answer: |-
  Below is a decision procedure grounded in A.J. Ayer's verification criterion from *Language, Truth and Logic*. Ayer's criterion holds that a statement is factually meaningful only if some observable evidence could verify or falsify it. If no such evidence is possible, the statement is either a non-factual claim (e.g., emotional, ethical, or metaphysical) or a prediction with no clear verification conditions. This procedure sorts claims from near-death experiences (NDEs) into four categories:  
  1. **Biographical facts**: Verifiable reports of the experience itself (e.g., "I saw a light").  
  2. **Predictions**: Claims about the future (e.g., "I will survive death"), which lack verification if no observable test exists.  
  3. **Commitments**: Non-factual beliefs (e.g., "The afterlife is real"), which are meaningful to the holder but not empirically verifiable.  
  4. **Expressions**: Emotions (e.g., fear, hope) or values, which are not truth-claims.  

  The procedure addresses the common reply—"Survival is verifiable by the person who dies"—by noting that Ayer's criterion requires *intersubjective* verification (evidence accessible to others). Post-death verification is private and incommunicable; thus, it cannot count as empirical evidence for the living. For personal identity (what makes someone "the same" after death), the procedure highlights that concepts like memory, body, or character lack verification conditions beyond death, making them metaphysical assumptions, not facts.  

  The procedure is designed for a 10-minute bedside conversation, usable by chaplains/nurses without philosophy training. It produces a chart note with the claim category, response, and action. Steps 1–4 must be followed in order; steps 5–7 are applied as needed.  

  ### **Decision Procedure Steps**  
  1. **Acknowledge & Clarify (2–3 minutes)**:  
     - *Ask*: "Can you tell me exactly what happened or what you believe, in your own words?"  
     - *Listen* for key elements:  
       - The experience (e.g., "I saw my mother").  
       - The claim (e.g., "This proves heaven exists").  
       - The request (e.g., "Reverse my DNR").  
     - *Goal*: Separate the report ("I experienced X") from the interpretation ("X means Y").  

  2. **Categorize Using Ayer's Criterion (2–3 minutes)**:  
     - *Apply Ayer*: Ask, "What could prove this true or false in a way others could see?"  
       - **Biographical fact** (verifiable): If the claim is about the past event (e.g., "I had a vision during my cardiac arrest"). *Evidence*: The patient’s testimony, medical records of the event.  
       - **Prediction** (unverifiable): If it’s about the future/afterlife (e.g., "I will survive death"). *Evidence*: None, as post-death states are inaccessible.  
       - **Commitment** (non-factual): If it expresses a belief (e.g., "The soul is immortal"). *Evidence*: None—treat as personal conviction.  
       - **Expression** (non-factual): If it conveys emotion (e.g., "I’m not afraid anymore"). *Evidence*: None—address the feeling, not the claim.  
     - *Address the "strongest reply"*: If the person says, "I’ll verify it when I die," explain: "That verification couldn’t be shared with us. For those still living, it’s not observable evidence."  
     - *Address personal identity*: If unexamined (e.g., "It was really my mother"), note: "We can’t verify what makes someone ‘the same’ after death—memory, body, and character aren’t testable then."  

  3. **Redirect to Verifiable Grounds (2 minutes)**:  
     - *Biographical fact*: Affirm the experience. "Your experience was real to you, and it matters."  
     - *Prediction/Commitment/Expression*: Shift to values or emotions. "It sounds like this gives you [hope/comfort/fear]. Let’s discuss how that affects your decisions."  
     - *Never endorse or dispute metaphysics*. Say: "We can’t verify what happens after death, but we can focus on what helps you now."  

  4. **Resolve the Practical Issue (2 minutes)**:  
     - *Ask*: "How does this change what you want for your care or your loved one’s care?"  
     - *If a decision is requested* (e.g., reversing a DNR):  
       - For patients: Prioritize autonomy. "You have the right to make choices based on your values."  
       - For families: Redirect to the patient’s known wishes or medical evidence. "Let’s revisit what your loved one wanted."  
     - *If conflict arises*: Defer to ethics consultation or palliative guidelines.  

  5. **Turn the Criterion on the Practitioner (Before Responding)**:  
     - *Ask yourself*: "Would my response change if the patient’s afterlife claim were false?"  
       - If *no*, say aloud: "This isn’t about what happens after death—it’s about supporting you right now."  
       - *Why*: Ensures you address distress, not metaphysics.  

  6. **Document for the Chart (1 minute)**:  
     - Use this template:  
       *"NDE report received. Categorized as [category]. Experience affirmed as meaningful to patient/family. Redirected to [patient’s values/medical evidence/emotional support]. Outcome: [Decision or next steps]."*  

  7. **When the Procedure Stops**:  
     - *Hand off to a person* when:  
       - Patient autonomy overrides (e.g., a capacitated patient refuses treatment).  
       - Family grief impedes reasoning (defer to social work or grief counseling).  
       - Clinician conscience is conflicted (e.g., a provider objects to withdrawing care; refer to ethics committee).  
     - *It cannot help* when:  
       - The demand is for metaphysical validation (e.g., "Prove I’m wrong"). Respond: "We can’t answer that, but we can help with what’s happening now."  
       - The claim is untestable and drives harmful decisions (e.g., demanding futile treatment). Escalate to ethics.  

  **What the Procedure Cannot Do**:  
  - It cannot verify or falsify survival after death.  
  - It cannot resolve metaphysical debates.  
  - It cannot override medical evidence or capacity assessments.  

  ---

  ### **Application to Cases**  
  **Case 1: Patient Reverses DNR After NDE**  
  - *Background*: A patient had an NDE during cardiac arrest, described "seeing the other side," and now wants her DNR order reversed to prolong life.  
  - **Procedure Application**:  
    1. **Acknowledge & Clarify**: "You had a powerful experience that changed your perspective. Can you share what it means to you?" *She says:* "I saw heaven—I know there’s more after this, so I want to live as long as possible."  
    2. **Categorize**:  
       - Biographical fact: "I had a vision of light/peace" → Verifiable (she experienced it during arrest).  
       - Prediction: "Heaven exists, so I’ll survive death" → Unverifiable (no testable evidence).  
       - Expression: "I feel hopeful" → Non-factual.  
       - *Strongest reply addressed*: If she says, "I’ll know when I die," respond: "But that knowledge couldn’t reach us, so for your care now, it’s not evidence we can use."  
    3. **Redirect**: "Your hope matters, but DNR decisions are based on your health and goals. What do you want if your heart stops again?"  
    4. **Resolve**: "You have the right to change your DNR. Let’s discuss the medical realities and your goals."  
    5. **Turn the criterion**: Your response (honoring autonomy) wouldn’t change if her claim were false—so say: "We’re here to support your choices, not judge your experience."  
    6. **Document**: *"NDE report: Biographical fact (vision during arrest) and unverifiable prediction (heaven). Patient reverses DNR based on renewed hope. Autonomy upheld. DNR reversed per patient request; risks/benefits discussed."*  
  - *Outcome*: The reversal is honored (autonomy), but the team does not validate the afterlife claim.  

  **Case 2: Daughter Cites Father’s Deathbed Vision**  
  - *Background*: A dying father sat up, described "meeting his mother," and died. His daughter insists this "proves" an afterlife and demands aggressive treatment for other family members, hoping for similar "proof."  
  - **Procedure Application**:  
    1. **Acknowledge & Clarify**: "That must have been meaningful for you and your father. What does it make you want now?" *She says:* "It settles it—there’s an afterlife. Keep treating my mom aggressively so she might see it too."  
    2. **Categorize**:  
       - Biographical fact: "Father described a vision before death" → Verifiable (witnesses heard it).  
       - Prediction: "He met his mother in the afterlife" → Unverifiable (no access to post-death states).  
       - Commitment: "This proves survival" → Non-factual belief.  
       - *Unexamined identity addressed*: If she says, "It was really Grandma," respond: "We can’t verify how a person persists after death—memory, body, or spirit aren’t testable."  
    3. **Redirect**: "Your father’s experience was real to him. But for your mom’s care, we need to focus on her condition and wishes. What did she want?"  
    4. **Resolve**: "We can’t use unverifiable claims to guide treatment. Aggressive care may cause harm if she’s dying. Let’s discuss her prognosis."  
    5. **Turn the criterion**: Your response (prioritizing medical evidence) wouldn’t change if the claim were false—so say: "We’re addressing your mom’s needs, not what happens after death."  
    6. **Document**: *"NDE report from deceased family member: Biographical fact (deathbed vision) used as unverifiable prediction (afterlife). Family requests aggressive treatment. Redirected to patient’s advance directive/prognosis. Goals-of-care meeting scheduled."*  
  - *Outcome*: The team declines to escalate treatment, citing medical futility. Focus shifts to the patient’s documented wishes.  

  **Case 3: Patient Refuses Treatment Based on NDE (Team Won’t Like)**  
  - *Background*: A patient with treatable cancer had an NDE where a "being of light" told him, "Stop chemotherapy—it’s time to come home." He now refuses chemo, despite the team’s belief it could extend his life.  
  - **Procedure Application**:  
    1. **Acknowledge & Clarify**: "You received a message that feels important. What did it mean for you?" *He says:* "I was told to refuse treatment. I’m not afraid—I’m ready."  
    2. **Categorize**:  
       - Biographical fact: "I heard a voice during my NDE" → Verifiable (he experienced it).  
       - Prediction: "I’m going ‘home’ after death" → Unverifiable.  
       - Commitment: "The being’s command must be obeyed" → Non-factual belief.  
       - Expression: "I’m at peace" → Non-factual.  
    3. **Redirect**: "Your peace matters, but this command isn’t verifiable. Chemo has a [X]% chance of helping. Can we discuss your goals?"  
    4. **Resolve**:  
       - He has decision-making capacity and refuses: "You have the right to refuse treatment, even if we disagree."  
       - *The procedure stops here*: Autonomy overrides. Do not argue metaphysics.  
    5. **Turn the criterion**: Your response (respecting refusal) wouldn’t change if the claim were false—so say: "We’re supporting your choice, not the truth of the message."  
    6. **Document**: *"NDE report: Biographical fact (voice during arrest) interpreted as unverifiable prediction (afterlife instruction). Patient refuses chemo. Capacity confirmed. Risks of refusal explained. Autonomy upheld; treatment declined."*  
  - *Outcome*: The team dislikes the refusal but cannot override it. The procedure exposes this as a values-based choice, not a factual error.  

  ### **Final Note**  
  This procedure treats NDEs with respect but confines the team’s role to verifiable realities: the experience’s impact on emotions, values, and decisions. It fails only when families demand metaphysical certainty—but in those moments, it protects the team by clarifying, "We cannot know." By turning Ayer’s criterion inward, it ensures you respond to human needs, not unanswerable questions. As Ayer himself exemplified after his NDE, the experience may shake certainty, but it cannot provide evidence—only meaning.
