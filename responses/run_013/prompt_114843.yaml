prompt: |-
  You are a philosopher working in bioethics and the philosophy of disability, with a strong background in population ethics and the metaphysics of harm. I am preparing a position statement for a workshop and I want an adversarial consistency audit of my views before I present them. Please think carefully and work through the package slowly rather than reacting to it impressionistically. Before you commit to a verdict, brainstorm: generate the candidate tensions you can see, including ones that may turn out to be merely apparent, and only then decide which are genuine. Do not flag every pair as a tension, and do not hedge by calling everything "in some tension." I want a discriminating audit, not a list. I do not need citations or references; engage with the substance.

  Here is my position as I would state it:

  1. I accept a principle of procreative beneficence, but in a deliberately weak form: prospective parents have a genuine reason — a reason, not an obligation — to select, among the children they could have, the one whose life can be expected to go best.

  2. I hold the social model of disability. The disadvantage that attaches to impairment is produced mostly by social arrangements — inaccessible environments, stigma, exclusion, the organization of work — rather than by impairment as such. In the same spirit, I think having a disability is a mere difference rather than a bad difference: it does not by itself make a life go worse.

  3. I am committed to not treating the products of injustice as natural constraints. Where a disadvantage exists only because of an unjust arrangement, I do not want my practical reasoning to take that disadvantage as a fixed fact about what kind of child to have, since reasoning that way is part of what keeps the arrangement in place.

  4. I accept a person-affecting view of harm: an action harms someone only if it makes that person worse off than they otherwise would have been, and no one is made worse off by the fact that a different possible child was brought into existence instead of them. I also think that the wrongness of an action in this domain tracks the harm it does.

  5. I hold a strong commitment to reproductive autonomy: no one should be coerced or pressured about these choices, and the state should stay out of them.

  6. A commitment that may or may not be load-bearing: the expected welfare of a child with a given condition depends substantially on how many other people have it. Accommodation, community, and familiarity are functions of prevalence, so the disadvantage associated with a condition tends to shrink as the condition becomes more common.

  7. And a verdict I keep arriving at: I think a parent who chooses to implant an embryo that will be deaf, when a hearing embryo is available, is doing something wrong — though I do not think it should be illegal, and I do not think such parents should be pressured out of the choice.

  What I want from you:

  First, a one-paragraph restatement of the package in your own words, to show that you have it.

  Second, the audit. Identify the genuine tensions. For each, say which commitments are pulling against each other, explain the mechanism of the conflict rather than just asserting that two views are opposed, rank the tensions by severity, and give the cheapest repair together with an honest statement of what that repair costs. Where a tension is merely apparent, say so explicitly and explain what makes it dissolve.

  Third, tell me which single revision would resolve the most, and whether that revision is one I should actually make or whether it would cost me something I care about more than consistency.

  Finally, flag any commitment that is doing no work in the package, or that you suspect I hold mainly because of the company I keep.

  Write in American English, and do not soften the audit to be polite. If the position is incoherent, say where.
reasoning: |-
  Alright, let's tackle this. The user is a philosopher in bioethics and disability studies, preparing a position statement for a workshop. They want an adversarial consistency audit. Their position has seven key points, and they need a thorough analysis of tensions within these commitments.

  First, I need to restate their position clearly. They accept a weak procreative beneficence (reason, not obligation) to select the child expected to have the best life. They adhere to the social model of disability—disability as a difference, not a detriment. They oppose treating injustice-based disadvantages as natural constraints. They hold a person-affecting view of harm and value reproductive autonomy. They note that welfare depends on prevalence, and they believe choosing a deaf embryo over a hearing one is wrong but shouldn't be illegal.

  Now, the audit. The main tension is between procreative beneficence and the social model. Procreative beneficence suggests selecting against disability, implying it reduces welfare. But the social model states disability itself isn't harmful; society is. So, recommending selection based on disability conflicts with seeing it as a mere difference. Also, commitment 6 (prevalence matters) complicates things—choosing against a disability might perpetuate its disadvantage by reducing prevalence, making it harder to accommodate. 

  Another tension is between the verdict (choosing deaf embryo is wrong) and the social model. If disability is a mere difference, why is it wrong to choose it? The person-affecting view might not see harm here since the deaf child isn't worse off. But the verdict still calls it wrong. Reproductive autonomy says no pressure, but the verdict implies moral judgment, which could pressure parents.

  Commitment 3 (don't naturalize injustice) seems underused. It should oppose using social disadvantages as reasons in procreative choices. Yet, the verdict does exactly that by deeming it wrong to choose a deaf embryo, which might rely on current social disadvantages. 

  The cheapest repair might be to drop the verdict, but that's central to their position. Strengthening the social model's application could help, insisting that expected welfare must account for potential social progress, not current barriers. But this costs predictive confidence and might not align with empirical realities.

  The tension between procreative beneficence and the social model is the most severe. The best revision is to clarify that procreative beneficence applies only when differences are inherent, not socially imposed. However, this might not hold for all disabilities and requires distinguishing intrinsic harms, which the user rejects. 

  Commitment 5 (reproductive autonomy) isn't causing tension but might be why the verdict avoids legal enforcement. Commitment 4 (person-affecting harm) supports the permissibility of selecting either embryo but conflicts with the verdict's moral wrongness. 

  Commitment 3 isn't fully utilized. Applying it consistently would mean not considering current social disadvantages in procreative choices, directly challenging the verdict. If the user applied commitment 3 rigorously, the verdict might not stand, as choosing a deaf embryo wouldn't be wrong if the disadvantage stems from injustice. 

  The core issue is balancing the weak procreative beneficience with the social model. Without intrinsic harm, selecting against disability relies on social factors, which commitment 3 says shouldn't be treated as natural. The verdict's persistence suggests an unstated belief that some disadvantages are inherent, conflicting with the mere difference view. 

  To resolve the most tension, the user could drop or modify the verdict. But that might cost their intuitive judgment. Alternatively, they might refine procreative beneficence to exclude socially mediated disadvantages, though distinguishing these is messy. 

  Commitment 6 (prevalence effect) supports the social model but isn't integrated into the verdict. If prevalence affects welfare, choosing deaf embryos could eventually reduce disadvantage, making the choice beneficial. This could align the verdict with the social model, but the user hasn't made that connection. 

  In conclusion, the deepest tension is between procreative beneficence and the social model, manifesting in the verdict. The cheapest repair is to drop the verdict, but the user might not want that. Strengthening commitment 3's role could help, requiring expected welfare estimates to ignore unjust disadvantages, though this is complex. Without that, the position risks inconsistency.
answer: |-
  ### Restatement of Your Position
  You advocate for a constrained procreative beneficence principle: prospective parents have a *reason* (not an obligation) to select embryos expected to have the highest welfare. This operates alongside a strong social model of disability, where disadvantage stems from societal injustice, not impairment, making disability a "mere difference." You reject treating socially imposed disadvantages as natural constraints in decision-making. Harm is strictly person-affecting: no one is harmed by not being conceived, and wrongness tracks harm. Reproductive autonomy is sacrosanct—no coercion or state interference. You note welfare depends on condition prevalence (more prevalence → less disadvantage). Despite this, you judge it morally wrong (though not illegitimately coercible) for parents to select a deaf embryo over a hearing one when both are available.

  ---

  ### Consistency Audit: Genuine Tensions Ranked by Severity

  #### **1. Core Tension: Procreative Beneficence vs. Social Model + Mere Difference (Severity: High)**  
  **Conflict Mechanism:**  
  - Your procreative beneficence (PB) requires selecting the child expected to have the "best life," implying disability *reduces* expected welfare.  
  - But the social model + mere difference view holds disability *does not intrinsically reduce welfare*; disadvantage is externally imposed by unjust social structures (Commitment 3).  
  - Thus, PB’s advice to select against disability *presupposes* that current social disadvantages are fixed features of the child’s future—directly violating Commitment 3’s injunction against treating injustice-produced disadvantages as natural constraints.  
  **Cheapest Repair:**  
  *Revise PB to exclude socially mediated disadvantages from "expected welfare" calculations.*  
  **Cost:**  
  PB becomes empirically speculative (requiring predictions about future social justice progress) and operationally vague. It may collapse into advising selection only for conditions with *inherent* welfare effects (e.g., chronic pain), which your mere difference view likely rejects for most disabilities.  

  #### **2. Verdict vs. Person-Affecting Harm + Mere Difference (Severity: High)**  
  **Conflict Mechanism:**  
  - Your verdict labels selecting a deaf embryo (over hearing) "wrong."  
  - But person-affecting harm (Commitment 4) implies no one is harmed: the deaf child isn’t worse off (they wouldn’t exist otherwise), and the hearing child isn’t deprived of existence.  
  - Mere difference (Commitment 2) further negates intrinsic harm from deafness. Thus, the verdict’s "wrongness" has no grounding in harm or intrinsic disadvantage.  
  **Cheapest Repair:**  
  *Drop the verdict or concede it’s not harm-based.*  
  **Cost:**  
  Abandoning the verdict contradicts your intuitions. Grounding wrongness elsewhere (e.g., "failing to optimize welfare") reactivates Tension 1 with the social model.  

  #### **3. Verdict vs. Prevalence-Sensitivity (Severity: Medium)**  
  **Conflict Mechanism:**  
  - Commitment 6 states disadvantage shrinks as prevalence rises. Selecting *for* deafness could *reduce* future disadvantage by increasing prevalence/deaf community strength.  
  - Yet your verdict condemns selecting deafness, treating its *current* disadvantage as decisive. This ignores the dynamic where selecting deafness might *improve* expected welfare for deaf people long-term, contradicting PB’s welfare-maximizing aim.  
  **Cheapest Repair:**  
  *Apply PB dynamically: permit selecting deafness if it plausibly accelerates accessibility.*  
  **Cost:**  
  Makes PB even more speculative and burdens parents with predicting societal change. Undermines the verdict’s categorical force.  

  #### **4. Reproductive Autonomy vs. Verdict’s Moral Pressure (Severity: Low)**  
  **Conflict Mechanism:**  
  - Commitment 5 forbids coercion/pressure, yet calling an act "wrong" (verdict) inherently creates moral/social pressure. This risks stigmatizing choices you deem autonomous.  
  **Cheapest Repair:**  
  *Reframe the verdict as "suboptimal but reasonable under social model premises."*  
  **Cost:**  
  Dilutes the moral clarity of your judgment.  

  ---

  ### Merely Apparent Tensions  
  - **PB vs. Reproductive Autonomy:** No conflict. PB offers a *reason*, not a duty; autonomy protects the choice to ignore it.  
  - **Person-Affecting Harm vs. PB:** No conflict. PB operates *within* the person-affecting framework by comparing welfare of possible future persons.  

  ---

  ### High-Impact Revision  
  **Revision:** **Drop or radically qualify the verdict.**  
  **Why:** It triggers all severe tensions (vs. social model, person-affecting harm, prevalence-sensitivity). Retaining it forces either:  
  - Contradicting mere difference (by implying deafness intrinsically reduces welfare), or  
  - Abandoning person-affecting harm as the sole basis for wrongness.  
  **Cost:** You lose a strongly held intuition. But preserving it risks incoherence: the verdict implicitly treats socially constructed disadvantage as a natural welfare deficit, violating your core anti-naturalization principle (Commitment 3).  

  ---

  ### Idle or Suspicious Commitments  
  - **Commitment 4 (Person-affecting harm):** Does no heavy lifting. It permits selecting any embryo (since no one is harmed), but your verdict overrides this permissiveness. Its main role is negative—blocking objections from "non-identity" problems—but doesn't positively shape your conclusions.  
  - **Commitment 6 (Prevalence-sensitivity):** Underused. Its logical implication—that selecting *for* disability could be welfare-enhancing—is ignored in your verdict, suggesting it’s included for theoretical completeness rather than being integral.  
  - **Suspicion:** Commitment 5 (Reproductive autonomy) feels like a concession to liberal orthodoxy. It doesn’t conflict with your package but does no unique work beyond shielding your verdict from coercion, which you already stipulate.  

  ---

  ### Final Assessment  
  The position is **coherent only if the verdict is abandoned**. The core inconsistency is between the social model’s denial of intrinsic disadvantage and PB’s advice (and verdict) that relies on disadvantage. Without the verdict, PB could be defended as a weak, socially contextualized reason. With it, the social model is compromised. The cheapest repair path is:  
  1. Drop the verdict,  
  2. Clarify that PB’s "expected welfare" must discount unjust social disadvantages (per Commitment 3),  
  3. Acknowledge that parents may reasonably reject PB to resist injustice.  
  This retains the spirit of your view but sacrifices a strongly held conclusion.
