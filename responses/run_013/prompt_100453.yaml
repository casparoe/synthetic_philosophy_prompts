prompt: |-
  I run model risk for a mid-sized UK pension scheme — about £4–5bn, so we can't afford our own quants but we're big enough that getting this wrong ruins people's retirements. Every few weeks something lands on my desk with a probability attached: a longevity model that says a buy-in saves us 3% over ten years, a credit model that says a counterparty is 99.5% safe, a climate scenario that says the deficit widens by X by 2050 with 70% confidence. The investment committee treats the number as if the number is the number. I don't think that's right, and I want a procedure I can actually run in maybe half an hour before each paper goes up, which tells me whether the probability in front of me is decision-grade or whether I should be applying some sort of ambiguity penalty to it — and how big a penalty, or at least how to argue for one.

  Here's the raw material I've been chewing on, so you don't have to guess what I mean:

  - The two-urn thing everyone trots out. Urn A has 50 red and 50 black balls. Urn B has 100 balls, red and black in some unknown proportion. Most people will take a bet on red from A over red from B, and also take a bet on black from A over black from B — even though one of the two B bets has to come in, so you can't sensibly rate both of them below their A versions if you're being consistent. The interesting bit isn't that people are silly, it's that they seem to treat the known-odds urn as worth strictly more, per bet, than the unknown-odds one.
  - So people distinguish risk (odds you know) from ambiguity (odds you don't), and will often pay to avoid the second. There's a family of decision rules built on that: act as if the worst probability in your range is the true one and maximise the minimum expected payoff; or take a weighted blend of the best and worst case; or just bung a fudge factor on the discount rate. I don't need the maths, I need the discipline.
  - The counter-argument someone always raises at committee: if you're making hundreds of small independent ambiguous bets, the ambiguity washes out, and being averse to it is a costly emotional tic. That seems right for the trading book and obviously wrong for a one-shot £500m buy-in, and I've no principled way to draw the line between the two.
  - Also, and this is the bit that worries me most: sometimes ambiguity should make you *keener*, not less keen — if the downside is bounded, or if you're the one selling the ambiguous thing to someone else. I've caught our own papers doing this without noticing.

  What I want from you: a decision procedure, in words, that my team and I can run on a paper. The questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says no (or says: this number isn't usable, come back with a range and a story about where the range comes from), and where it has to hand the decision to the committee because the question is about our risk appetite and not about the numbers at all. Then run it on two or three realistic cases — a longevity hedge priced off a brand-new model, and a novel asset class with no long history — including at least one where your procedure tells me something I won't want to hear, because I'd rather find that out now than in the meeting.

  Please be honest about where the procedure is just my prior dressed up as method, and say plainly what it can't do: cases where the ambiguity is about which model class is right rather than about a parameter, or where the committee is going to ignore it anyway, or where the "worst case in the range" isn't actually well-defined.

  Answer in British English. Plain prose and a list of steps is fine, no diagrams, and don't assume I know the names of any of this stuff.
reasoning: |-
  Alright, let me try to unpack what this pension scheme model risk head is really asking for. They're dealing with £4-5bn in assets - not massive enough for dedicated quants, but big enough that mistakes ruin retirements. The core frustration is committees treating probabilistic outputs as gospel when they're often built on shaky foundations. 

  Hmm, the two-urn example they referenced is classic Ellsberg Paradox territory - shows how people instinctively distrust ambiguous probabilities. But the real challenge is operationalizing that insight. They need something practical: a 30-minute pre-meeting checklist to flag when numbers need "ambiguity penalties."

  Key pain points emerging:
  - Committee doesn't distinguish between risk (known odds) and ambiguity (unknown odds)
  - Arguments about whether ambiguity aversion is rational get messy, especially when scaling from small repeated bets to one-off mega-transactions
  - Most worrying: sometimes ambiguity should make you more aggressive (bounded downside) but nobody's systematically checking for that

  What's not said but implied: They're probably fighting against commercial pressure to "just accept the model" from consultants/dealers. And they need ammunition for committees that default to quantitative comfort.

  The ideal solution would be:
  1) A simple flowchart-style Q&A (max 4-5 questions)
  2) Clear "stop signs" where the number gets rejected
  3) Explicit handoff points to risk appetite decisions
  4) Real examples showing both rejection cases AND where ambiguity might favor action

  Biggest trap to avoid: Pretending this is rigorous when it's fundamentally about judgment. Need to be transparent that some steps are just structured skepticism.

  For the examples they requested...
  - The longevity hedge with new model: Classic case for penalty - model uncertainty high, one-shot risk
  - Novel asset class: Might actually be case where bounded upside could make ambiguity attractive
  - Third unrequested example: Counterparty risk with hidden model monoculture - where "worst case" isn't computable

  Also must flag limitations: 
  - Model-class ambiguity (e.g. ML vs traditional) is harder than parameter uncertainty
  - Political realities where committee overrides
  - Situations where "worst case" is undefined (climate scenarios!)

  Final output should sound like a practical FCA guideline - British English, no jargon, with that slightly weary professionalism financial risk folks use.
answer: |-
  Here’s a practical decision procedure for assessing whether a model’s probability is "decision-grade" or requires an ambiguity penalty. It’s structured as a checklist for your team to run in **under 30 minutes** per paper. The goal is to identify ambiguity, quantify it where possible, and determine when to adjust the decision—or reject the number entirely.

  ---

  ### **The Ambiguity Penalty Procedure: Key Questions**
  Run these in order. Stop and flag issues if any answer is unsatisfactory.

  1.  **"What's the core uncertainty behind this probability?"**  
      *   **Sufficient answer:** A clear description of the key unknown (e.g., "future mortality improvements," "correlation during market stress," "climate policy adoption rate").  
      *   **Stop if:** The uncertainty is hand-waved ("it’s captured in the model") or conflated with general market risk. Demand a rewrite focusing on the *unknowable* element.  
      *   **Handoff:** If the uncertainty is fundamental but unquantifiable (e.g., "regime change in 2040"), flag it for the committee as a qualitative risk factor.

  2.  **"What’s the plausible range for this key uncertainty, and how was it set?"**  
      *   **Sufficient answer:** A defensible range (e.g., "mortality improvements between 0.5% and 1.5% p.a. based on 20 countries’ data") with its source (data, expert judgement, scenario testing).  
      *   **Stop if:**  
          *   No range is provided (reject the paper: "Come back with a range").  
          *   The range is arbitrary or ignores extreme outcomes ("We used ±1 standard deviation, but tails matter here").  
          *   The range relies on a single contested model or assumption.  
      *   **Handoff:** If the range is wide but well-justified, proceed to Q3.

  3.  **"Is this a one-shot decision, or can ambiguity wash out?"**  
      *   **Sufficient answer:** Justification based on:  
          *   *Scale:* "This is a single £500m longevity hedge" (one-shot) vs. "100 small corporate bonds" (wash-out likely).  
          *   *Dependence:* "All climate scenarios depend on the same disputed emissions model" (won’t wash out) vs. "Independent asset-specific risks" (may wash out).  
      *   **Stop if:** It’s clearly one-shot (or highly dependent) and ambiguous → **Apply an ambiguity penalty**. Skip to Q5 to size it.  
      *   **Handoff:** If wash-out is plausible (e.g., diversified small bets), the probability *may* be usable as-is – but escalate if the range (Q2) is huge.

  4.  **"Could ambiguity *favour* us here?"**  
      *   **Sufficient answer:** Evidence of either:  
          *   *Bounded downside* (e.g., "Max loss is 5% due to contract terms").  
          *   *Asymmetric upside* (e.g., "We’re the *seller* of this ambiguous product").  
      *   **Stop if:** Asymmetry is clear → **Invert the penalty (apply an ambiguity *bonus*)**.  
      *   **Handoff:** If no asymmetry, proceed to Q5. If asymmetry is disputed, flag for committee debate.

  5.  **"What’s the ‘reasonable worst case’ within the range?"**  
      *   **Sufficient answer:** A justifiable point in the bottom 25% of the range (e.g., "90% confidence in counterparty safety, not 99.5%").  
      *   **Stop if:**  
          *   The worst case is extreme but plausible ("This model ignores pandemic risk").  
          *   No credible worst case exists (e.g., climate "unknown unknowns").  
      *   **Action:**  
          *   **Penalty:** Use this worst-case probability for decision-making.  
          *   **Bonus:** Use a conservative *best-case* estimate.  
      *   **Handoff:** If the worst case destroys the case, recommend rejection. Otherwise, present the adjusted number alongside the original.

  ---

  ### **What This Can't Do**
  -   **Resolve "model-class" ambiguity:** If the debate is "Is this the right *type* of model?" (e.g., ML vs. actuarial), this flags it but won’t solve it. Demand a sensitivity test.  
  -   **Define the "worst case" objectively:** It relies on expert judgement. If experts disagree, present competing views.  
  -   **Override committee risk appetite:** This arms you with facts, but "how much ambiguity is too much" is their call.  
  -   **Fix wilful ignorance:** If providers refuse to engage (Q1-Q2), reject the paper.

  ---

  ### **Real Case Applications**

  #### **Case 1: Longevity Hedge Priced via New Model**  
  -   **Q1:** *Core uncertainty?* "Model’s predictive power for future medical breakthroughs."  
  -   **Q2:** *Range?* Provider says "Model validated on historical data." **Stop:** No range for *future* uncertainty. **Action:** Reject paper. Demand: "Re-run pricing using 3 mortality improvement scenarios (low/med/high) based on expert panels."  
  -   **Q3:** Clearly a **one-shot £500m decision**. Penalty needed.  
  -   **Q4:** No asymmetry (downside = higher scheme costs if hedge underpays).  
  -   **Q5:** Worst-case? If new model is untested for tail events, assume 20% higher costs than projected. **Output:** "Model’s 3% saving could be a 1% loss under plausible stress. Not decision-grade without range."

  #### **Case 2: Novel Asset Class (e.g., Climate Infrastructure Debt) with No History**  
  -   **Q1:** *Core uncertainty?* "Default correlation during climate shocks."  
  -   **Q2:** *Range?* "Based on analogous assets, default probability 2–8%." Acceptable if justified.  
  -   **Q3:** **Won’t wash out** (small allocations, but all assets exposed to same climate events). **Penalty applies.**  
  -   **Q4:** *Asymmetric upside?* **Yes!** Downside capped (senior debt), upside uncapped if assets outperform. **Apply bonus.**  
  -   **Q5:** *Worst case?* 8% default probability. *Best case?* 2% (for bonus). **Output:** "Base case 4% default prob. For decision: Use 2% (bonus for ambiguity + bounded downside). Committee must debate if upside compensates for model uncertainty."

  #### **Case 3 (Unwelcome Truth): Counterparty Risk for Derivative**  
  -   **Q1:** *Core uncertainty?* "Correlation of counterparty’s assets during a crisis."  
  -   **Q2:** *Range?* "99.5%–99.9% safety based on internal model." **Stop:** Model uses stale data, ignores concentrated sovereign debt holdings. **Action:** Reject. Demand: "Use independent data to test range, include sovereign default scenarios."  
  -   **Q3:** One-shot (large exposure). Penalty needed.  
  -   **Q4:** Asymmetry? No – we bear the loss.  
  -   **Q5:** Worst case? If sovereign risk materialises, safety could be ≤95%. **Output:** "99.5% is not credible. Worst case implies material loss. Do not rely."

  ---

  ### **In Practice**
  -   **Team script:** "For paper X, Q1: [Answer]. Q2: [Answer]. Stop? [Y/N]. If no, Q3: [Answer]. Q4: [Answer]. Q5: [Penalty/Bonus/Reject]."  
  -   **Committee reporting:** "Model output is 3% saving. After ambiguity adjustment: -1% to +0.5%. Key uncertainty: [X]. Range: [Y]. Recommendation: [Reject/Use adjusted number/Proceed with caution]."  
  -   **Your armoury:** Forces providers to quantify uncertainty. Turns "gut feel" into auditable logic. Exposes when a "probability" is storytelling.

  This isn’t pure maths—it’s **structured scepticism**. It makes ambiguity visible, forces quantification, and distinguishes between "we don’t know" (manageable) and "we can’t know" (committee judgement). The penalty isn’t a number; it’s using the worst case. The bonus is exploiting asymmetry. That’s decision-grade.
