  **Lewisian Response:**  
  Your persistent feeling of obligation at 3 a.m. arises precisely from the *entrenched expectations* constitutive of convention. While no immediate coordination problem exists, your preference for conformity isn’t conditional on real-time observation—it’s a disposition honed by the convention’s history. You *ought* to drive on the left because your preference for coordination *in general* includes a preference to sustain the very regularity that resolves coordination problems *systematically*. Deviating now would weaken your own disposition to conform (and your expectation of others’ conformity) in future scenarios where coordination *does* matter. The "ought" is instrumental: it serves your standing preference for reliable, low-cost coordination across time. What feels like a free-floating norm is just your brain efficiently preserving a solution that has consistently served your interests.  

  **Confidence Note:**  
  *Moderately confident (7/10). Least sure about equating the "binding" feeling purely with a personal disposition to preserve systemic efficiency—this risks reducing normativity to psychology, which may feel unsatisfying.*  

  ---  

  **Your Friend's Counter (as anticipated):**  
  But that reduces obligation to mere *prudence*—a prediction about future self-interest. When I say I *ought* to drive on the left even if I knew for certain I’d never face another car or penalty, the feeling isn’t "I’d regret weakening my habits"; it’s "this act would be *wrong* in itself." Your account makes convention a personal strategy, but real conventions bind us interpersonally—we blame others not because they’ve harmed us, but because they’ve *violated a shared standard*. Where does *that* authority come from?  

  **Lewisian Response:**  
  The "shared standard" is an emergent property of mutual expectations. Blame functions as a *corrective signal* within the coordination equilibrium: by expressing disapproval, we reinforce the expectation of conformity in others, preserving the regularity’s stability. When you feel an act is "wrong in itself," that’s your internalization of the system’s fragility—you intuit that unilateral deviation, if generalized, would collapse the convention (even if *this* lapse won’t). The authority isn’t mystical; it’s the sum of individual preferences for mutual predictability. Calling it "prudence" undersells it—this preference shapes our social identity. We blame because we *need* the offender to realign with the expectations that enable our collective efficiency.  

  **Confidence Note:**  
  *Confident (8/10). Least sure about explaining the *phenomenology* of freestanding wrongness—Lewisians might be accused of explaining away the experience rather than capturing its depth.*  

