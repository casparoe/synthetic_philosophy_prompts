prompt: |-
  I run planning for a mid-sized city — zoning, transit, housing, the usual — and I keep hitting the same wall. Some of what lands on my desk is genuinely technical (will this rezoning actually produce the units we're claiming, does this interchange meet the safety spec) and some is a fight about what the city should be, wearing a lab coat and pretending to be technical. My team signs off on maybe fifteen of these a month and none of us are philosophers.

  A friend who teaches philosophy keeps telling me Carnap — the Vienna Circle guy — has a political/planning side nobody reads, and that it's wierdly on point for exactly this. The three things she handed me: first, explication — you take a mushy everyday word, decide what job you actually need it to do, then define a sharp replacement, and you're judged by whether the sharp version does the work, not by whether it matches the mushy original. Second, the split between questions internal to a framework (given our rules, does this follow?) and external questions about which framework to adopt in the first place (are we a car city or a transit city?), which she says he thought wasn't a factual question in the same way. Third, tolerance — the idea that in logic there are no moral constraints on which framework you pick; you choose by what it's for, not by which one is true. (She also muttered something about Neurath being the actual planning guy in that circle and the whole scientific-worldview project being in the service of rationalizing society, but I don't need the history, I need the procedure.)

  Turn that into a procedure my office can actually run. I want the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, where it deliberately hands off to the elected officials or to a public process because the question is external and not ours to settle, and where it's a value call dressed up as a technical step. It has to be something we can run in an afternoon before a hearing, and it should say what to do when we can't get a number. Then run it on three proposals: converting a big downtown surface parking lot into dense housing; widening a highway to cut commute times; and putting license-plate readers on the arterials. I especially want the one where the procedure tells me something I don't want to hear — I have a feeling at least one of these comes back as not our call to make, and I'd rather hear that from you than from a councilmember.

  Flag the places the procedure will misfire — where explication smuggles in a political choice, where internal and external won't cleanly seperate — and say plainly what the procedure can't do. And give me a one-page version I can hand to the staff.
reasoning: |-
  Okay, the user is a city planner dealing with proposals that mix technical and political aspects. They need a practical procedure based on Carnap's ideas to separate these elements efficiently. Let me start by understanding their main pain points: distinguishing genuine technical issues from value-laden debates disguised as technical ones, and knowing when to hand off decisions to elected officials.

  First, Carnap's concepts: explication, internal/external questions, and tolerance. The user wants a step-by-step process that can be applied quickly before hearings. They also want to see it in action with three examples and identify where the procedure might fail.

  For the procedure, I need a clear sequence. Step 1 should be about clarifying the problem statement. Step 2 involves explication—defining fuzzy terms with precise metrics. Step 3 determines if the question is internal (technical) or external (value-based). Step 4 handles internal questions with data, while Step 5 flags external ones for higher authorities. Step 6 applies tolerance, ensuring multiple frameworks are considered where possible.

  Now, applying this to the examples. The parking lot to housing: rezoning might be internal if the framework exists, but housing goals could be external. Highway widening: traffic models are internal, but prioritizing car commute times over other values is external. License plate readers: data accuracy is internal, but surveillance vs safety is external. Each example should show where the procedure identifies the need to hand off.

  Potential misfires: Explication might embed biases, like defining "safety" only as reduced crashes, ignoring pedestrian concerns. Internal/external separation isn't always clean, like when technical models assume certain values. Also, the procedure can't resolve deep value conflicts; it only clarifies where they lie.

  The one-pager needs to be straightforward. Key points: problem statement, explicate terms, internal/external check, technical assessment, hand off externals, document. Include the three examples to illustrate.

  User’s deeper needs: They want to avoid overstepping their role, prevent technical justifications for political decisions, and streamline their workflow. They also need staff buy-in, so the procedure must be simple and actionable. Highlighting where the procedure says "not our call" addresses their fear of council pushback.
answer: |-
  Here's a Carnap-inspired decision procedure for your planning office, designed for speed and clarity, followed by analysis, examples, misfires, and a one-pager.

  **The Carnapian Planning Filter (CPF) - Procedure**

  1.  **Define the Core Question & Goal:**
      *   *Ask:* "What specific, concrete outcome is this proposal *claiming* to achieve, and what specific question(s) are we being asked to answer?"
      *   *Good Enough Answer:* A single sentence or bullet point stating the claimed outcome (e.g., "Reduce peak-hour commute times by X minutes," "Add Y housing units within Z years," "Reduce crime incidents by W% on this corridor"). Identify the *explicit* technical question(s) posed to your team.
      *   *Stop/Handoff if:* The core question is purely about ultimate values ("Should we prioritize cars or bikes?", "Is neighborhood character more important than density?"). **Hand off immediately to Elected Officials/Public Process.** Flag as "Value Goal Setting."

  2.  **Explicate Key Terms:**
      *   *Ask:* "What fuzzy or contested terms are central to evaluating this claim? What *precise, measurable operational definition* will we use *for this specific assessment*?"
      *   *Good Enough Answer:* Define terms using measurable criteria relevant to the *stated goal*.
          *   "Housing Units" = Net new permitted dwelling units meeting building code.
          *   "Traffic Safety" = Projected crash rates per VMT using standard models.
          *   "Commuters" = Vehicles passing point Y between 7-9 AM.
          *   "Affordable" = Units priced at/below 30% AMI for households at 80% AMI (using HUD data).
          *   "Cut Commute Times" = Modeled reduction in average peak-hour travel time between defined points A & B.
          *   "Public Safety" = Reported Part I crimes within 500ft of arterial per year.
      *   *Where you can't get a number:* Acknowledge the gap explicitly. State: "Term 'X' cannot be fully quantified for this assessment. We will rely on [qualitative proxy Y] OR flag that assessment of this term is incomplete/requires expert input [Specify]." Proceed cautiously, acknowledging the limitation.
      *   *Stop/Handoff if:* Agreement on a workable explication cannot be reached *because* it inherently requires choosing between competing value frameworks (e.g., defining "Neighborhood Character" inherently favors preservationists or developers). **Hand off to Elected Officials/Public Process.** Flag as "Value-Laden Definition Conflict."

  3.  **Internal vs. External Check:**
      *   *Ask:* "Does the question we need to answer depend *only* on applying established rules, models, data, and our explicated definitions? Or does answering it *require* us to choose or justify the fundamental goals, values, or planning framework itself?"
      *   *Good Enough Answer:*
          *   **Internal:** Questions answerable *within* the current adopted plans, codes, models, and explications. (e.g., "Given our zoning code and housing model, does this rezoning yield 200 units?", "Does this interchange design meet AASHTO safety standards?", "Given crime data patterns and LPR accuracy studies, will cameras likely reduce reported Part I crimes?").
          *   **External:** Questions about *which* goals, frameworks, or fundamental values to prioritize. (e.g., "Should we aim for 200 units *here*?", "Should we prioritize AASHTO standards over pedestrian experience *in this case*?", "Should we prioritize crime reduction via surveillance over privacy?").
      *   *Stop/Handoff if:* The question is **External**. **Hand off to Elected Officials/Public Process.** Flag as "Framework/Goal Selection Required." Proceed only with Internal questions.

  4.  **Internal Assessment (Technical Answer):**
      *   *Ask:* "Given our current adopted frameworks (plans, codes, standards) and our explicated definitions, what is the best technical answer to the internal question?"
      *   *Good Enough Answer:* A clear "Yes," "No," "Likely/Unlikely," or quantified estimate based on standard models, data analysis, engineering review, or legal interpretation. Include confidence levels and key assumptions. Cite specific code sections or model parameters.
      *   *Stop/Handoff if:*
          *   Data/models are insufficient for a meaningful answer. Flag as "Inconclusive - Insufficient Data."
          *   Answer depends on assumptions that are themselves unresolved external questions. **Hand off to Elected Officials/Public Process.** Flag as "Assumption Requires Value Judgment."

  5.  **Tolerance Check (Framework Choice):**
      *   *Ask (For Internal Answers Only):* "Is our technical conclusion dependent *solely* on the frameworks/definitions we used? Are there other *plausible, internally consistent* frameworks/definitions the decision-makers could validly choose that would lead to a different technical answer?"
      *   *Good Enough Answer:* A "Yes" or "No." If "Yes," briefly state the alternative framework/definition and its potential different outcome.
      *   *Action:* Document *any* alternative frameworks identified. This doesn't change the technical answer but informs decision-makers that the answer is *framework-dependent*. This step highlights that the technical answer isn't absolute truth.

  **Output:** A concise memo stating:
  1.  Stated Goal & Core Question.
  2.  Key Explications.
  3.  Internal/External Classification.
  4.  Technical Answer (if Internal) or Handoff Reason (if External).
  5.  Tolerance Note (if applicable - "Answer assumes Framework X; Framework Y could yield Z").

  **Running the Examples**

  1.  **Converting Downtown Surface Lot to Dense Housing:**
      *   **Goal/Question:** "Will this rezoning produce 300 new housing units, including 60 affordable units, within 5 years?" (Assumes goal is given).
      *   **Explication:** "Housing Units" = Permitted dwelling units. "Affordable" = Units deed-restricted at 80% AMI.
      *   **Internal/External:** **Internal** (Assumes unit production is the technical question within the rezoning proposal framework).
      *   **Assessment:** Run development pro-forma models, market analysis, absorption rates. "Yes, models predict 310 units feasible; 60 affordable achievable with proposed incentives." OR "No, pro-forma shows only 220 units viable without subsidy."
      *   **Tolerance:** "Answer assumes current market conditions, financing rates, and developer interest. A significant economic downturn (Alternative Framework) could reduce unit delivery." *Value Call Smuggled?* Defining "feasible" relies on market assumptions that embed economic values. *What it doesn't do:* Tell you if building housing *here* is the right priority vs. other sites or uses – that's **External** ("Should this lot be housing?").

  2.  **Widening Highway to Cut Commute Times:**
      *   **Goal/Question:** "Will adding one lane in each direction reduce average peak-hour commute time by 15 minutes between Exit A and Exit B?"
      *   **Explication:** "Commute Time" = Modeled vehicle travel time, 7-9 AM, A to B.
      *   **Internal/External:** **Internal** (Assumes commute time reduction for *vehicles* is the goal).
      *   **Assessment:** Run traffic simulation model (e.g., VISSIM). "Model predicts 12-minute reduction." OR "Model predicts 18-minute reduction." OR "Model predicts 5-minute reduction due to induced demand."
      *   **Tolerance:** "Answer assumes current travel demand patterns and model parameters. Significant shifts in work patterns or fuel prices (Alternative Frameworks) could alter results." *What it doesn't do:*
          *   Tell you if cutting *car* commute times is the right goal vs. improving transit, safety, emissions, or neighborhood impacts – that's **External** ("Are we a car city?").
          *   Evaluate the cost-effectiveness compared to other ways to reduce travel time (transit investment, telework incentives). *The procedure tells you what you don't want to hear:* **The core question of whether this project aligns with the city's fundamental mobility goals is External and NOT YOUR CALL.** Your job is *only* to model the lane addition's impact on vehicle travel times *if that is the defined goal*. The *choice* of that goal and the prioritization of resources belong to elected officials/public process.

  3.  **Putting License-Plate Readers (LPRs) on Arterials:**
      *   **Goal/Question:** "Will installing LPRs reduce auto thefts and violent crime incidents on the designated arterials by 20% within 2 years?" (Assumes goal is given).
      *   **Explication:** "Reduce Crime" = Reduction in reported Part I crimes (UCR) within 500ft of arterials with LPRs. "Auto Theft" = Reported stolen vehicles.
      *   **Internal/External:** **Primarily Internal** (Assumes crime reduction via this method is the goal).
      *   **Assessment:** Review studies on LPR effectiveness in similar contexts, local crime data patterns. "Studies show potential for 10-25% reduction in auto theft; impact on violent crime less clear." OR "Data inconclusive; displacement risk noted."
      *   **Tolerance:** "Answer based on aggregate crime data. Effectiveness could vary based on implementation specifics (monitoring protocols, integration with enforcement)." *Value Call Smuggled?* Defining "safety" solely as reported crime reduction ignores privacy, equity, and community trust impacts. *What it doesn't do:*
          *   Address the fundamental **External** question: "Should we use pervasive surveillance to achieve safety goals, given privacy trade-offs?" **THIS IS NOT YOUR CALL.** The procedure highlights that your assessment is *only* about the likely crime reduction *if* surveillance is chosen as the framework. The *choice* of that framework belongs to elected officials/public process after explicit debate on values.

  **Where the Procedure Misfires (Limitations & Flagged Issues)**

  1.  **Explication Smuggles Values:** Defining a term *is* a choice. Defining "safety" as reduced crashes ignores perceived safety or pedestrian experience. Defining "affordable" using AMI thresholds embeds economic assumptions. Defining "commute" as car travel time assumes a car-centric framework. *Flag:* Explicitly state the limitations of the definition and acknowledge embedded assumptions.
  2.  **Internal/External Boundary Blur:** Real questions often mix layers. A "safety" question might involve technical standards (Internal) *and* prioritizing certain types of safety over others (External). *Flag:* If a question has intertwined layers, break it down. State which parts are Internal (answerable technically) and which are External (require value judgment/handoff). Don't force a purely technical answer on a hybrid question.
  3.  **"Given Our Framework" is Sticky:** Existing codes/plans reflect *past* political choices. Strictly applying them can perpetuate outdated values. *Flag:* The CPF doesn't challenge the existing framework, only assesses within it. If the framework seems flawed, note that in the Tolerance step or a separate comment, but the procedure itself doesn't reassess the framework – that's **External**.
  4.  **Tolerance is Descriptive, Not Prescriptive:** Identifying alternative frameworks doesn't tell you *which* to choose. It just shows the technical answer isn't absolute.
  5.  **Can't Resolve Deep Value Conflicts:** When goals fundamentally clash (privacy vs. security, preservation vs. density), the CPF only clarifies *where* the conflict lies (External) and hands it off. It doesn't provide a magic solution.
  6.  **Reliance on Data/Models:** Garbage in, garbage out. Weak models or bad data lead to unreliable Internal answers. *Flag:* State limitations of data/models clearly.
  7.  **Speed vs. Depth:** An "afternoon" limits deep dives. It's a filter, not a full analysis. Complex proposals might need more time for robust Internal assessment.

  **What the Procedure CAN Do**

  *   Sharply distinguish technical analysis from value judgments.
  *   Force clarity on definitions and assumptions.
  *   Identify *which specific questions* your office can answer technically.
  *   Identify *precisely where* decisions require political or public input.
  *   Prevent staff from overstepping by making implicit value calls disguised as technical ones.
  *   Make the basis for technical recommendations transparent and auditable.
  *   Streamline review by focusing effort on answerable Internal questions.

  ---

  **CPF One-Pager for Staff**

  **Carnapian Planning Filter (CPF): Separating Tech from Values - FAST**

  **Goal:** Quickly decide if a question is **Technical (We Answer)** or **Values-Based (Hand Off)**. Clarify definitions. Be transparent.

  **Steps (Run in Order):**

  1.  **What's the ASK?**
      *   State the proposal's **specific claimed outcome** & the **exact question(s)** for us. (e.g., "Cut peak car commute by 15 mins?")
      *   **HAND OFF** if the question is *only* about values ("Should we be a car city?"). Flag: **"Value Goal Setting."**

  2.  **Define FUZZY WORDS:**
      *   Pick key, vague terms (e.g., "safety," "affordable," "commute").
      *   Define them **precisely** & **measurably** *for this job*. (e.g., "Safety = Projected crashes/VMT using Model X")
      *   **HAND OFF** if agreeing on a definition *forces* a value choice (e.g., defining "neighborhood character"). Flag: **"Value-Laden Definition Conflict."**
      *   *No Number?* Say so. Use a proxy or flag the gap. Be clear.

  3.  **INTERNAL or EXTERNAL?**
      *   **Internal:** Can we answer using *only* existing rules, codes, data, models & our definitions? (e.g., "Does this design meet safety spec?")
      *   **External:** Does answering *require* choosing goals, values, or the whole approach? (e.g., "Should we prioritize car speed over bus lanes?")
      *   **HAND OFF** if **External**. Flag: **"Framework/Goal Selection Required."**

  4.  **TECH ANSWER (Internal Only):**
      *   Answer the question using data, models, code review. (e.g., "Model shows 12-min reduction.")
      *   Give confidence level & key assumptions.
      *   **FLAG** if data is bad or answer depends on unresolved assumptions needing value judgment. **HAND OFF** the assumption if it's **External**.

  5.  **FRAMEWORK DEPENDENCY (Tolerance):**
      *   *For Internal Answers:* Could different *valid* definitions/frameworks change the answer? (e.g., "Using Model Y instead of Model X shows only 8-min reduction.")
      *   **NOTE** any major alternatives. Shows our answer isn't the only possible one.

  **OUTPUT MEMO:** 1. Question/Goal. 2. Key Definitions. 3. Int/Ext? 4. Tech Answer or Handoff Reason. 5. Framework Notes.

  **REMEMBER:**
  *   **We Answer:** Technical stuff *within* given rules & definitions.
  *   **We HAND OFF:** Setting goals, choosing core values, resolving deep definition conflicts.
  *   **Definitions AREN'T Neutral:** Be honest about what your definition assumes.
  *   **Boundaries are Fuzzy:** Break down mixed questions. Flag the value parts.
  *   **It's a FILTER:** Fast, not perfect. Focuses effort where we add value (tech), flags where others decide (values).

  **WHEN IN DOUBT: If it feels like a big "should" question about what kind of city we want to be... it's probably EXTERNAL. HAND IT OFF.**
