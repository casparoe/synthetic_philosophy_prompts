answer: |-
  My dear colleague,

  Your connoisseur wrestles with a problem as old as ethics itself, yet you've isolated a particularly sharp and vexing aspect of it. The precise difficulty lies not merely in the heterogeneity of pleasures, nor simply in the practical challenge of comparing them, but in the theoretical sleight-of-hand whereby a single term – "pleasure" – is employed as if it denoted a unified, homogeneous *substance* or *currency* within his internal economy, while in reality, it functions solely as a *label* for the diverse objects of his desire, absent any shared essence or inherent measure. The established term that comes closest is **incommensurability**, but it requires careful distinction.

  Incommensurability typically refers to the *inability to find a common metric* for comparing different values or goods. Your problem encompasses this but digs deeper. It is the *prior* condition that makes such comparison not just difficult but conceptually precarious: the lack of a shared underlying quality *despite* the application of a unifying name. The term "pleasure," in your connoisseur's ledger, performs a unifying function *in theory* (it allows ranking, trading, the notion of a single life-project) that its referents *in experience* utterly fail to justify. They share only the relational property of being *desired by him*, not an intrinsic "pleasure-quality."

  Distinguishing this from related ideas is crucial. The **problem of comparing unlike goods** (e.g., justice vs. beauty, or indeed, an oyster vs. a fugue) is a *consequence* of incommensurability, a practical dilemma arising from the lack of a common measure. Your connoisseur's problem is the *foundational illusion* that enables him to *believe* he *is* comparing like things under the banner of "pleasure" when he isn't. It's the pretense of homogeneity within the category itself. Similarly, acknowledging that **pleasures differ in kind** (higher vs. lower, sensual vs. intellectual, as per Mill) still operates *within* the assumption that "pleasure" meaningfully groups them. Your insight reveals a more radical discontinuity: that "pleasure" might not designate any stable *kind* at all in the experiential realm, only a functional role in the economy of his wanting.

  The best carving, I propose, is this: The core issue is the **theoretical reification of a nominal unity derived from desire**. He treats "pleasure" as a concrete, measurable *thing* (reification) because he uses the word consistently (nominal unity), but that unity's sole source is the fact of his desiring (derived from desire). The felt experiences themselves offer no such common ground.

  Since no single term perfectly captures this specific confluence – the gap between the functional unity of the *term* in a theoretical economy and the experiential heterogeneity of its *referents*, coupled with the grounding of that unity purely in the subject's desire – allow me to suggest a coinage: **desiderative nominalism**.

  *   **Desiderative** points to the origin of the unity: desire itself (from Latin *desiderare*, to long for, miss).
  *   **Nominalism** emphasizes that the unity exists only in the *name* and its function within his system, not in the nature of the things named (contrasting with philosophical realism about universals like "Pleasure").

  **Desiderative nominalism**, then, is the phenomenon where a diverse set of experiences or objects are grouped under a single abstract term within a value system (like "pleasure," "good," or even "utility") based solely on their being desired or valued by a subject, despite lacking any intrinsic common property that justifies the theoretical treatment of them as a homogeneous class or fungible currency. It highlights the tension between the operational necessity of the unifying term within the subject's internal economy and the experiential reality that undermines it.

  Consider boundary cases: A clear instance is ranking the visceral salt-brine shock of an oyster against the complex intellectual satisfaction of resolving a fugue – both called "pleasure," both desired, sharing no discernible common felt quality justifying their direct trade as quantities of the *same* thing. A fuzzy case might be comparing the taste of two distinct oysters; while both are gustatory, their specific qualities (metallic vs. creamy, say) may still resist reduction to a single "pleasure-substance," though the illusion of commonality is stronger. A case *against* desiderative nominalism would be comparing two glasses of water when thirsty; here, the shared property (thirst-quenching) provides a genuine, measurable common ground beyond mere desire.

  Your connoisseur's tragedy, or perhaps his grand self-deception, lies in clinging to "pleasure" as his sovereign currency, a single gleaming coin, while his ledger reveals only a cabinet of curiosities – each entry unique, irreducible, bound together solely by the frail thread of his wanting them. Desiderative nominalism names the hollow core of his hedonistic calculus, the beautiful, necessary lie that sustains his ledger and, perhaps, his life. It is the precise shape of the abyss over which his philosophy is delicately, perilously suspended.

  May this term, or the struggle to define it, serve your pen well.

  Yours in the pursuit of precise disquiet,  
  A fellow traveller in thought
