  For the model answer, I'll aim for 700 words. It must classify the argument as regressive (starts from actual practice), then note its ambitious conclusion about reality. The bridging premise is implicit in step 2 - the connection between rational revision and actual reliability. The repair section is crucial: adding an explicit bridge (e.g., "rational revision requires tracking truth") either makes the argument question-begging or reduces it to triviality about our commitments. I'll reference Strawson's descriptive metaphysics as contrast.

  The marking scheme needs granularity. Total marks: 20. Key sections: classification (4 marks), ambition gap (5), bridging premise (4), repair analysis (5), plus structure/clarity (2). Distinctions: first-class answers expose the circularity in repairs and reference Kant/Strawson; competent ones just identify components. Common errors include misclassifying as progressive or missing the ambition-reality gap.

  I'll avoid markdown per instructions. The exam question starts immediately without preamble. The model answer balances technical terms with clear examples (e.g., "tracking truth"). The marking scheme lists specific deductions for errors like "Fails to identify step 2 as bridge (-2)".

