prompt: |-
  I'm a third-year philosophy student, and this term I'm taking an upper-level seminar on transcendental arguments. We've worked through the Kantian template, the mid-century revival, and the now-standard objection that an argument from "we cannot so much as think/experience X without Y" establishes at best how we must think, not how things are — the professor's line is that most students can recite that objection by week three and then have nothing left to say. The final is a single 90-minute essay, and four of us have started a study group, so I'd like to write a mock exam question of the kind she might actually set, together with a model answer and a marking scheme, so that we can mark one another honestly rather than reassure each other.

  To make it the right kind of hard, I want the question to turn on one specific argument rather than the topic in general, and to force four moves: first, say whether the argument is regressive or progressive (i.e., whether it moves from an actual feature of our practice to its necessary conditions, or from a general premise about thought to a conclusion about the world); second, say whether its intended conclusion is ambitious — about how things are — or modest — about what we must believe or how we must think — and whether that matches what it actually establishes; third, locate the premise that does the bridging between the two, if there is one; and fourth, say what happens when you try to repair the argument — does the repair save it, trivialise it, or covertly substitute a different argument? The argument I'd like the question built around is one the professor sketched on the board and then refused to comment on. It runs roughly: (1) we sometimes revise our beliefs rationally in the light of new evidence, and this is what it is to improve epistemically; (2) if our belief-forming methods were not by and large reliable, rational revision of our beliefs would be impossible; therefore (3) our belief-forming methods are by and large reliable. She has hinted that the interesting question is not whether the conclusion follows but what would have to be true for an argument of this shape to earn a conclusion about reality rather than merely about our commitments.

  Please write the exam question she'd set — the essay prompt a student would actually receive — then a model answer of about 700 words, then a marking scheme that names the specific moves a first-class answer must make and the ones that separate it from a merely competent one, and that lists the typical ways candidates go wrong, one line each, with marks attached to the must-hit points (total 20). Begin the response with the exam question itself, in the first line, with no preamble; then the model answer; then the marking scheme.
