prompt: |-
  Ok so my flatmate and I had a two-hour argument about this last night, after I'd already made and eaten a prawn curry, which set the tone. I want to write down my actual verdicts and have you tell me what principle, if any, they add up to. You're a philosopher who works on animal welfare and invertebrate sentience, and this is roughly the thing people collar you about at parties. Think it through before you start writing; I'd rather have one worked-out answer than five half ones.

  His side of it, briefly: he says crabs and lobsters and octopuses are on the UK's list of sentient animals now, and that if I'm going to take the invertebrates seriously I should take the bivalves seriously too. He also says I can't refuse shrimp on sentience grounds and then eat tinned tuna, since tuna are vertebrates and therefore definately sentient on anybody's account. He reckons my seafood policy is vibes with a biology-flavoured paint job.

  My verdicts:

  Raw oysters, mussels, clams: completely fine. Wouldn't occur to me to hesitate.
  Scallops: fine, though I know they've got actual eyes round the rim of the shell and more going on than an oyster. Doesn't stop me.
  Squid, i.e. calamari: fine. I know it's a cephalopod. I have no story for why octopus is a no and squid is a yes.
  Octopus: no, and that's the one I'm most confident about.
  Shrimp and prawns: no. This is the one I actually changed my behaviour over. What did it was finding out that the hatcheries cut an eyestalk off the female broodstock to get her to spawn, routinely, no anaesthetic, and it roughly triples her mortality. I assumed that was internet exageration and checked.
  Crab and lobster: no.
  Farmed salmon: no. What did it there was the cleaner fish, the little lumpfish and wrasse they put in the pens to eat the sea lice.
  Wild-caught fish, tinned tuna, a fish I catch myself: fine.
  Insects: my friend produced a bag of dried crickets as a substitute and I ate them happily.

  For what it's worth I'm not vegetarian, I eat chicken and pork, so I'm aware the whole thing might be a joke. Set that aside — I want to know about the seafood line specifically.

  Two things I genuinely can't sort out about myself. First, I don't know if I'm a number-of-individuals person or a strength-of-evidence person, because those pull opposite ways on shrimp vs tuna: a prawn curry and a tuna steak are about the same calories, and one of them is dozens of animals and the other is a slice of one. Second, my friend says I'm not allowed to refuse octopus and also think the octopus-is-a-superintelligent-alien stuff is overblown, and I don't know whether that's a real objection or not.

  Don't hand me a menu of options with pros and cons and leave me to pick — take a position, commit to it, and tell me where I'm wrong. Give it to me in these sections, in this order:

  Scratch (~150 words): four or five candidate principles, each with the fastest objection to it.
  The principle I think you're using (3-4 sentences, no hedging).
  Which of my verdicts forces which clause (~350 words), working through the list above.
  What it costs me (~200 words): the verdicts the principle can't keep, ranked by how much I'd hate to lose them, and what the nearest alternative principle would cost.
  Three cases I haven't listed — include sea urchin/uni and a prawn from an ablation-free farm, and pick one yourself — one sentence verdict plus one sentence reason each.
  Bottom line (a few sentences): is my seafood line a real line or is it vibes, and what single change would make it most coherent.
reasoning: |-
  Alright, let me unpack this user's query. They had a heated debate with their flatmate about their seafood consumption ethics, specifically regarding invertebrate sentience. The user wants to know if their stance has a coherent principle or if it's just vibes. 

  First, I need to parse their verdicts. They're okay with bivalves like oysters and mussels, but draw the line at shrimp, prawns, octopus, crab, and lobster. Interestingly, they eat squid but refuse octopus despite both being cephalopods. Farmed salmon is out because of cleaner fish exploitation, but wild-caught fish is fine. They even ate crickets without issue.

  Hmm, the key conflicts here are:
  1. Inconsistency between squid (eaten) vs octopus (avoided)
  2. Shrimp/prawn avoidance due to eyestalk ablation cruelty vs eating tuna (vertebrate)
  3. Willingness to eat insects but not certain crustaceans

  The user flags two self-awareness gaps: whether they prioritize individual animal counts or evidence strength of sentience, and whether refusing octopus conflicts with dismissing "octopus-as-alien" intelligence hype.

  I notice their shrimp refusal hinges on documented suffering (eyestalk ablation), not just sentience likelihood. Similarly, farmed salmon is avoided due to collateral harm to cleaner fish. This suggests their real driver might be practical ethics - avoiding *verifiable* suffering rather than theoretical sentience. 

  For the octopus/squid contradiction: maybe they subconsciously associate octopus with high-intelligence narratives despite skepticism? Or perhaps squid fisheries have less visible cruelty? But their stated principle should account for this gap.

  The vertebrate/invertebrate divide isn't consistent here since they eat crickets but refuse shrimp. So sentience hierarchy alone fails. Their exceptions (bivalves, insects) align with low sentience evidence, but scallops have eyes - yet they still eat them. 

  Aha! Their scallop acceptance despite simple eyes suggests they tolerate ambiguity when suffering evidence is absent. Whereas for shrimp, the ablation practice makes suffering concrete. 

  Proposed principle: "Avoid consumption where credible evidence indicates high suffering likelihood relative to human benefit, prioritizing documented over theoretical harm." 

  This explains:
  - Bivalves: No suffering evidence
  - Scallops: Ambiguous sentience, no documented cruel practices
  - Squid vs Octopus: Octopuses have more observed pain responses/neurological complexity; also cultural spotlight on octopus suffering
  - Shrimp: Eyestalk ablation is verified industrial cruelty
  - Farmed salmon: Cleaner fish mortality is documented
  - Wild fish: Suffering less visible/verifiable (convenient, but consistent within principle)
  - Insects: Farming methods rarely involve observable suffering

  What breaks? Their self-caught fish - if they cause prolonged suffering, it violates the principle. But they might assume quick kills. Also, tuna tinning involves bycatch suffering they're ignoring. 

  Nearest alternative principles would either force vegetarianism (which they reject) or require sentience certainty (which would ban scallops/bivalves they enjoy). 

  Bottom line: Their line isn't just vibes - it's a "verified suffering avoidance" principle with pragmatic loopholes. To strengthen: Either research wild-fish catch methods or drop tuna. Or accept that avoiding visible cruelty is their true anchor, and own the inconsistencies.
answer: |-
  Here’s a philosopher’s verdict on your seafood ethics, structured as requested:

  ### Scratch: Candidate Principles & Instant Objections  
  1. **Principle**: *Avoid all animals with credible evidence of sentience.*  
     **Objection**: You eat scallops (some evidence) and insects (debated sentience).  
  2. **Principle**: *Minimize individual suffering per calorie.*  
     **Objection**: You eat tuna (1 vertebrate) over shrimp (dozens of individuals), yet refuse salmon (1 individual).  
  3. **Principle**: *Avoid animals subjected to verified industrial cruelty.*  
     **Objection**: You eat wild-caught fish (drowning in nets, bycatch suffering) and chicken/pork (factory farming).  
  4. **Principle**: *Reject animals with complex nervous systems.*  
     **Objection**: You eat squid (similar neurology to octopus) but refuse shrimp (simpler system).  

  ---

  ### The Principle You’re Using  
  You prioritize **avoiding consumption where suffering is both *observable* and *industrially systematized***. Evidence strength matters more than species classification or individual count. Cruelty must be concretely documented (e.g., eyestalk ablation, cleaner fish exploitation) rather than theoretically inferred. Ambiguity (bivalves, insects) defaults to permissibility.  

  ---

  ### Which Verdicts Force Which Clauses  
  - **Raw oysters/mussels/clams**: Permitted due to ambiguity in suffering evidence. No observable cruelty in harvesting.  
  - **Scallops**: Eyes alone don’t constitute systematized suffering; no industrial cruelty practices override ambiguity.  
  - **Squid**: Lack of widely publicized, systematized cruelty (vs. octopus) despite similar neurology. Absence of evidence wins.  
  - **Octopus**: High sentience evidence + cultural awareness of their suffering (e.g., live boiling) makes cruelty "observable."  
  - **Shrimp/prawns**: Eyestalk ablation is verified, routine, and severe industrial suffering. Forces refusal.  
  - **Crab/lobster**: Boiled alive is culturally recognized suffering; UK sentience listing makes it "observable."  
  - **Farmed salmon**: Cleaner fish mortality is documented, systematized collateral suffering. Verifiable harm forces refusal.  
  - **Wild-caught fish/tuna**: Suffering is less visible (distant, rapid death) and not *industrially designed* cruelty. Ambiguity permits.  
  - **Insects**: No salient evidence of systematized suffering in farming; ambiguity permits.  

  *Squid vs. Octopus*: Your refusal of octopus hinges on its suffering being culturally "observed" (videos, ethics debates) while squid’s isn’t. *Shrimp vs. Tuna*: Shrimp suffering is mechanized (ablation), while tuna capture is perceived as incidental.  

  ---

  ### What It Costs You (Verdicts the Principle Can’t Keep)  
  1. **Self-caught fish** (Cost: ★★★)  
     You assume quick death, but fish suffocation is prolonged. The principle *should* require verified humane killing.  
  2. **Squid** (Cost: ★★)  
     Industrial squid dredging causes mutilation. If evidence becomes salient, refusal is obligatory.  
  3. **Scallops** (Cost: ★)  
     Scallops’ escape responses and eyes *could* imply suffering; stricter principles (e.g., "avoid all possible sentience") would ban them.  

  *Nearest Alternative Principle*: "Minimize individual suffering per meal." This saves self-caught fish (1 death) but forces vegetarianism (chicken/pork cost 100+ lives per meal) and bans all shrimp/tuna. You’d hate losing meat.  

  ---

  ### Three Unlisted Cases  
  1. **Sea urchin (uni)**: **Permitted** – No evidence of systematized suffering in harvesting; neural simplicity defaults to ambiguity.  
  2. **Ablation-free prawn**: **Permitted** – Without verified cruelty, ambiguity allows consumption (assuming no other harms).  
  3. **Jellyfish**: **Permitted** – Zero nervous system centralization; suffering is scientifically implausible.  

  ---

  ### Bottom Line  
  Your line is **not vibes**—it’s a coherent principle of **"refusal based on verified, industrial suffering."** It explains 90% of your verdicts by prioritizing *documented* harm over taxonomy or numbers. The flaw is **inconsistent rigor with wild fish**: bycatch and suffocation are observable, systematized harms. To maximize coherence, **either research wild-capture methods (e.g., pole-caught vs. trawled) or drop tuna**. This resolves the shrimp-tuna tension by aligning your standard of "observability" across all seafood.  

  **Least disruptive fix**: Switch to line-caught tuna. It reduces bycatch suffering and aligns with your evidence-focused ethics—keeping your curry without cognitive dissonance.
