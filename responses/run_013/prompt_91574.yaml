  Creating authentic friction. Maybe a protagonist who administers the composting rituals but cracks when their child dies? That raises stakes organically. 
  The butterfly motif needs subtle integration. Perhaps as a recurring image rather than explicit mention.

  Setting idea: A near-future village where composting is mandatory, blending tradition and sci-fi pragmatism. The orchards provide tangible continuity - people eat ancestors' literal fruits. 

  Naming note: User said no need to name Zhuangzi, so I'll avoid all Chinese terms to prevent exoticism. The philosophy should emerge through action: the compost master drumming during a funeral echoes Zhuangzi's tub, but twisted - imperfect, human.

  Structure thoughts: 
