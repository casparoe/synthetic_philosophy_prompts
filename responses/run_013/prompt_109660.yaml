answer: |-
  ### Example: The Disability Benefits Tribunal and "Reasonable Adjustment"  
  A tribunal determines eligibility for workplace accommodation benefits under the Equality Act, applying the predicate "**requires reasonable adjustment**". Cases involve employees with progressively milder back pain. Each ruling binds future decisions through *stare decisis* (precedent).  

  **The Series** (15 cases; adjustments described cumulatively):  
  1. **Case A**: Paraplegic employee; requires building access ramp. → **Reasonable**  
  2. **Case B**: As A, but needs a £200 ergonomic chair. → Reasonable (*Tolerance: Same severity, minor added cost*)  
  3. **Case C**: As B, but needs 5 mins/day assistance lifting files. → Reasonable (*Tolerance: Marginal increase in support time*)  
  ⋮  
  8. **Case H**: Moderate pain; needs flexible hours (start 10am). → Reasonable (*Tolerance: Slightly reduced productivity impact*)  
  9. **Case I**: Mild pain; needs a £50 lumbar cushion. → Reasonable (*Tolerance: Negligible cost, same condition type*)  
  10. **Case J**: Occasional stiffness; needs 10-minute stretching breaks/hour. → Reasonable (*Tolerance: Similar inconvenience to Case I*)  
  11. **Case K**: Minimal discomfort; employer must fund weekly yoga classes (£80/month). → Reasonable (*Tolerance: Comparable wellness support*)  
  12. **Case L**: As K, but demands a private therapist (£300/month). → Reasonable (*Tolerance: Equivalent health benefit*)  
  13. **Case M**: No pain; insists on "wellness space" for meditation (£5k renovation). → Reasonable (*Tolerance: Same category: "wellbeing infrastructure"*)  
  14. **Case N**: Healthy employee; requests paid 3-hour gym sessions daily. → Reasonable (*Tolerance: Continuation of wellness precedent*)  
  15. **Case O**: Healthy employee; demands employer hire a personal chef for "nutritional accommodation". → **Reasonable?**  

  **Principle of Tolerance at Each Step**:  
  > "If adjustment *X* was reasonable for employee *E₁*, and *E₂*’s needs differ *only trivially* in cost, time, or health impact, then a similar adjustment for *E₂* must also be reasonable."  

  **Where Reasoning Breaks Down**:  
  Between **Case 10 (J)** and **Case 13 (M)**, the tribunal’s focus shifts imperceptibly:  
  - Early cases anchor to **medical necessity** (Cases 1–8).  
  - Later cases prioritise **wellbeing precedent** (Cases 11–15).  
  The breakdown occurs at **Case 13**: "Wellness space" for someone *without pain* is justified *only* by incremental similarity to yoga (Case 11), not medical need. Consistency with Case 11 overrides the original standard. Case 15 is continuous with Case 14 but unrecognisable from Case 1.  

  ### Philosophical Implications  
  **1. Vagueness vs. Ambiguity**:  
  - **Vagueness** is evident: "Reasonable" has blurred boundaries (no *single* feature marks its cutoff). The series exploits this by gradually replacing core criteria (medical need → employer-funded lifestyle perks) *without redefining the term*.  
  - **Ambiguity** is absent: The predicate’s *meaning* ("appropriate workplace support") remains stable throughout. The problem arises from boundary permeability, not polysemy.  

  **2. Sharp but Unknowable Boundaries?**:  
  This example **undermines** the "unknowable boundary" response:  
  - The tribunal *could* have drawn a sharp line (e.g., after Case 9) *without logical inconsistency*.  
  - Yet *any* boundary would be **arbitrary** under the tolerance principle. Precedent forces continuity, making a "hidden cutoff" incoherent: if Case *K* is reasonable, then *K+1* must be, ad absurdum.  
  - Thus, the paradox persists not due to epistemic limits, but because *vagueness prohibits non-arbitrary thresholds* in sorites-susceptible predicates.  

  **Conclusion**:  
  When sorites series emerge from authoritative decisions, the tolerance principle masks conceptual drift. This reveals vagueness as a feature of *judgment frameworks* themselves, where consistency with precedent can incrementally distort a term’s application. Positing unknowable boundaries fails because the flaw lies in demanding binary classifications for inherently gradualistic concepts.
