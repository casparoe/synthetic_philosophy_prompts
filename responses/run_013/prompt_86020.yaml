answer: |-
  ## Dialogue: The Calibration Dispute

  **Setting:** A cognitive science reading group room. Whiteboards covered in diagrams of change blindness experiments and scribbled quotes from Dennett and Varela. Empty coffee cups litter the table. Two postdocs remain after the official session: **Priya** (late 20s, precise gestures, speaks in structured paragraphs) and **Leo** (early 30s, leans back in his chair, gestures broadly when making a point).

  **Priya:** (Tapping her notebook) Okay, Leo. Before we dive back into the demotion rule, let me reconstruct your core objection, as I understand it. You see calibrated heterophenomenology, specifically the demotion rule, not as a discovery about cognitive architecture, but as a *stipulative redefinition* of what constitutes evidence for consciousness. When we take a subject’s denial of seeing a change – say, in a change blindness paradigm – and override it because a classifier detects neural signatures of change processing, we aren’t *discovering* that the subject was wrong about their experience. We’re *deciding*, a priori, that the neural measure gets to define the ground truth of experience, effectively demoting the verbal report from being a report *of experience* to being merely a report *of a belief about experience* or evidence of a "reporting process failure." This, you argue, smuggles in a third-person physicalism as the ultimate arbiter and abandons the core heterophenomenological neutrality about the ontology of the subject's world. Does that capture it?

  **Leo:** (Nods slowly) Close enough, Priya. You’ve nailed the crux. And crucially, it begs the question: *what* failed? The reporting process presupposes there *was* a distinct experience that the report was *supposed* to capture but failed to. But if the subject sincerely reports "no change," and we have good reason to think they aren't lying or confabulating wildly in that moment, why assume a failure rather than accepting that their experience genuinely lacked the change? The demotion rule assumes the existence of a pristine, reportable experience *behind* the report, which the neural measure accesses more directly. But that’s precisely the Cartesian Theater Dennett dismantled! So, your move isn’t repair; it’s regression. Now, reconstruct *my* strongest counter for me – on demotion.

  **Priya:** Fair. You’d say my strongest objection to *your* stance is that refusing the demotion rule leads to an unacceptable *epistemic stalemate* or solipsism. If we grant the subject absolute, incorrigible authority over "how it seems," even when third-person measures robustly correlate with behavioral outcomes the subject themselves acknowledges *should* reflect experience (like successful forced-choice discrimination on change trials they deny seeing), we render the science of consciousness impossible. We have no way to resolve contradictions *within* the heterophenomenological world itself – like the subject who says "no change" but then reliably presses a button indicating ‘change’ when forced to guess. The demotion rule isn’t stipulation; it’s a *discovery* about the dissociability of conscious access/report from underlying processing, revealed precisely *by* the calibrated conflict. The "reporting process" isn't a homunculus whispering truths; it's a complex cognitive module that *can* fail to access or translate the relevant state.

  **Leo:** (Leans forward) Precisely! But you invoke "failure" too easily. Take our agreed-upon concrete case: Subject S-23 in the classic change blindness flicker paradigm. EEG shows a robust P3 component on change trials S-23 explicitly denies seeing. S-23 is attentive, cooperative, insists they saw nothing change. Your demotion rule says: the P3 signifies change *processing relevant to conscious experience*, the verbal denial is a reporting failure, so S-23 *did* have a change experience, they just couldn't report it. But *what* was the nature of that "experience"? Was it fleeting, degraded, lacking "phenomenal character"? Or was it full-blown and the report mechanism glitched? The rule doesn't tell us; it just asserts the neural signature wins. My neurophenomenological counter is: treat the conflict *itself* as the primary datum. The P3 indicates *potential* for conscious access, the verbal report indicates *actual* access failed in that specific trial context. Neither overrides the other; together they constrain theory – perhaps pointing to different thresholds or modes of access. Demotion prematurely resolves the tension by fiat.

  **Priya:** But Leo, that’s where calibration *through* the promotion rule comes in! We don’t *start* by demoting. We start by taking the report seriously within the heterophenomenological world. Only when a robust, *non-report-based* measure consistently conflicts with reports *across subjects and contexts* – like the P3 in change blindness – do we invoke demotion. And crucially, we have the promotion rule to balance it. When a trained observer, through disciplined first-person method, provides a stable report – say, about the subtle quality of peripheral awareness – and it survives rigorous intersubjective checks (repetition, re-description, resistance to suggestion), *that* report graduates. It becomes a constraint, not just an interpretation. It tells theory: "Account for *this* phenomenal texture." Doesn’t that address your worry about privileging the third-person? Promotion elevates the first-person under strict conditions.

  **Leo:** (Sighs) Ah, promotion. Here’s my reconstruction of your likely objection here: You’d say that ‘stability under the experimenter’s re-descriptions’ isn’t a mark of accessing some objective phenomenal reality, but merely indicates that the subject has internalized the *experimenter’s vocabulary and conceptual framework*. The trained observer isn’t plumbing pristine depths; they’re becoming fluent in a shared language game. Their ‘stable’ reports might reflect a well-trained cognitive schema applied *to* experience, not a purified access *of* experience. It risks being elaborate autophenomenology validated by agreement within a specific community, not genuine calibration. Am I close?

  **Priya:** Uncomfortably close, yes. That *is* a risk. But isn’t that a risk inherent in *any* scientific communication? All data is theory-laden to some degree. The promotion criteria – surviving different framings, resisting counter-suggestion – are precisely designed to minimize that. It’s not just agreement; it’s resilience to manipulation and perspectival shift. It’s about finding descriptions robust enough to survive the ‘alien anthropologist’ test within the heterophenomenological framework itself. If a description holds under multiple angles of interrogation, it gains weight as characterizing something stable *in the subject’s world*.

  **Leo:** But Priya, that brings us to the deepest joint: calibration. How can we genuinely *calibrate* two instruments – first-person report and third-person measure – if we only let *one* of them (the third-person, via demotion) definitively set the scale when they conflict? Calibration requires mutual adjustment against a common standard, or at least symmetry. Heterophenomenology starts symmetric: reports and other data are texts. Calibrated heterophenomenology breaks that symmetry. When conflict arises, the third-person measure *becomes* the standard against which the report is judged faulty. Promotion tries to restore symmetry, but it feels like a consolation prize – first-person gets to set constraints only when it behaves impeccably and agrees with itself under pressure, while third-person gets to *correct* it when it ‘misbehaves’. The residue of first-person authority is purely negative: the subject can veto claims about *what it’s like for them*, but they can’t *establish* positive claims that contradict the third-person orthodoxy. That’s not mutual constraint; it’s third-person hegemony with a first-person courtesy vote.

  **Priya:** (Pauses, considering) That’s… a powerful framing, Leo. Let me concede a point: The *risk* of a subtle hegemony is real. Demotion should be a last resort, invoked only for robust, replicable dissociations, not for every hiccup. And perhaps the criteria for what counts as a "robust non-report-based measure" need stricter scrutiny – it can’t just be *any* neural correlate; it must be one linked to processes we have strong independent reason to believe are constitutive or necessary for the *type* of experience in question. But I maintain the core asymmetry is *warranted* by the nature of the evidence. First-person reports are intrinsically private, subjective, and filtered through fallible cognitive machinery. Third-person measures are public, intersubjective, and target different aspects of the system. When the private report conflicts with the public measure *and* the behavioral evidence aligns with the public measure, demotion is the scientifically responsible way to resolve the inconsistency *within* the heterophenomenological project. It’s not that the subject is *wrong* about ‘how it seems’; it’s that ‘how it seems’ *is* sometimes constituted by limited access. The report *is* evidence of how it seemed *to their reporting system*. The demotion rule clarifies that the reporting system doesn't always have privileged access to the full state.

  **Leo:** And there’s my concession: I agree the subject can be mistaken about the *causes* or *implications* of their experience. They can misinterpret a sensation, misattribute a feeling. But I draw the line at being mistaken about the *presence* or *core qualitative character* of an experience *in the moment of attentive reflection*. If S-23, focused on the changing object, sincerely says "No, nothing changed *there*," I take that as constitutive. The P3 might indicate *processing* relevant to change, perhaps even processing that *could* lead to experience under different conditions, but it doesn’t prove an experience occurred that the report failed to capture. It might indicate potentiality, not actuality. Calling it a "reporting failure" presupposes the actuality. That’s the residue.

  **Priya:** So, for you, abandoning your position would require… what? Proof that sincere, attentive first-person reports about simple, attended percepts are *systematically* less reliable indicators of the presence of that specific experience than third-person measures? Like showing that a neural classifier predicts the *subject's own subsequent judgments about their past experience* better than their initial report?

  **Leo:** (Nods) Almost. It would require conclusive evidence that first-person reports about core, attended phenomenal content are *no more reliable* than random guessing *even under ideal reporting conditions*, while third-person measures correlate perfectly with the actual (somehow independently verified) phenomenal state. A tall order! What would make *you* abandon calibrated heterophenomenology?

  **Priya:** If it could be shown that the "robust non-report-based measures" used in demotion invariably track cognitive processes demonstrably *dissociable* from phenomenal consciousness – say, purely attentional orienting or prediction error signals that *never*, even in principle, correlate with *any* first-person reports under *any* conditions, including promotion-worthy ones. If the measures used for demotion never, ever align with promoted first-person constraints, then demotion would indeed be revealed as a mere stipulation, not a discovery. Or, if the promotion rule *never* yielded stable, resilient reports that genuinely constrained theory in ways third-person data couldn't – if trained introspection was always reducible to confabulation or schema application.

  **Leo:** So, we agree on the facts – S-23’s EEG and denial. We agree reports can be fallible about causes and contexts. We even agree conflicts are crucial data.

  **Priya:** But we disagree fundamentally on what the conflict *means*. For me, it reveals a modular mind where reportable experience is one output. For you, it reveals the limits of access to a unified phenomenal field. And we disagree on whether ‘reporting failure’ is a discovery or a presupposition.

  **Leo:** Precisely. The residue is ontological: whether experience is something that *can* exist independently of the capacity to report it, waiting to be accessed or failed to be reported. You presuppose it can. I presuppose that what isn’t accessed/reportable *in that specific way* isn’t part of the experience *as lived*. Calibration can’t bridge that gap; it just papers over it with rules. (He stands, gathering his things). Same time next week? Maybe we tackle illusion arguments.

  **Priya:** (Smiles faintly). Sounds good. Bring coffee. Strong coffee.
