  Below is a decision tree mapping responses to the liberal paradox, using the shared-flat case (Ada, Ben, Cleo) as a consistent illustration. Each internal node is a concrete question answerable by taking a stand on this case alone. The tree has 8 internal nodes and 8 leaves, covering the logical space of positions while diagnosing gaps and unresolved pairs. Names identify the core claim of each position, not specific authors.

  ### Decision Tree
  Start at Node 1:

  1. **Must the social decision procedure always rank every pair of outcomes (e.g., x, y, z) transitively and without cycles?**  
     - **No** → Leaf 1: **Intransitive Social Ordering**  
       *Awkward commitment: Social preferences may cycle endlessly (e.g., society ranks x > y, y > z, z > x), leaving no clear "best" choice.*  
     - **Yes** → Node 2  

  2. **In the shared flat, if both Ada and Ben prefer outcome A to B, must society prefer A to B?**  
     - **No** → Leaf 2: **Pareto Rejection**  
       *Awkward commitment: Society may override unanimous preferences (e.g., if Ada and Ben both prefer x to z, society might still choose z).*  
     - **Yes** → Node 3  

  3. **Should Ada’s preference alone decide whether she reads the book (i.e., between x and z)?**  
     - **No** → Node 4  
     - **Yes** → Node 7  

  4. **Should Ada have the power to *choose* whether she reads the book (e.g., by announcing "I read" or "I don’t")?**  
     - **No** → Leaf 3: **Collectivism**  
       *Awkward commitment: Even personal acts (like reading) require collective approval (e.g., Cleo’s views constrain Ada’s choice).*  
     - **Yes** → Leaf 4: **Game-Form Rights**  
       *Awkward commitment: Rights may yield Pareto-inefficient outcomes (e.g., Ada chooses not to read to avoid y, forcing z, even though both prefer x to z).*  

  5. **Can the personal sphere (e.g., "Ada decides x/z") change based on group input like Cleo’s challenge?**  
     - **No** → Node 6  
     - **Yes** → Leaf 7: **Social Determination of Spheres**  
       *Awkward commitment: What counts as "personal" is collectively decided (e.g., Cleo’s objection overrides Ada’s claim to decide x/z).*  

  6. **Should the procedure exclude preferences influenced by others (e.g., Ada’s ranking z > x because she dislikes Ben reading)?**  
     - **Yes** → Leaf 5: **Domain Restriction**  
       *Awkward commitment: Preferences about others’ choices are invalid (e.g., Ada’s aversion to Ben reading is ignored).*  
     - **No** → Leaf 6: **Conditional Minimal Liberty**  
       *Awkward commitment: Rights are voided when preferences are "other-regarding" (e.g., Ada loses her say over x/z because her preference involves Ben).*  

  7. **If Ada delegates her choice to Ben (e.g., lets him decide for her), does society still enforce her original preference?**  
     - **Yes** → Node 8  
     - **No** → Leaf 8: **Waivable Rights**  
       *Awkward commitment: Delegating a right may lead to outcomes against one’s interests (e.g., Ada lets Ben decide x/z, he picks x, but she prefers z).*  

  8. **Can preferences about others’ choices (e.g., Ada’s z > x) activate minimal liberty?**  
     - **Yes** → *Gap* (Incoherent: Leads to a cycle under transitivity/Pareto)  
     - **No** → Leaf 6: **Conditional Minimal Liberty** (as above)  

  ---

  ### Gaps and Diagnoses
  - **Gap at Node 8 ("Yes")**: Incoherent. Enforcing minimal liberty with other-regarding preferences + transitivity + Pareto creates a cycle (x > y by Pareto, y > z by Ben’s liberty, z > x by Ada’s liberty). No position occupies this space.  
  - **Unexplored gap**: Waiver in non-game-form approaches (e.g., if Ada delegates to a coin). Diagnosed as unexplored; no major position models this formally.  

  ### Unresolved Pairs
  - **Game-Form Rights vs. Waivable Rights**: The tree cannot separate these if one supports rights delegation *without* Pareto inefficiency. To split them, add: *"Can rights delegation avoid Pareto inefficiency?"* (Game-Form says no; Waivable Rights ignores efficiency).  
  - **Social Determination of Spheres vs. Collectivism**: The tree distinguishes them via Node 5 (group sets spheres vs. group controls acts). No extra question needed.  

  ### Notes
  - **Ordering logic**: Early nodes prune maximally. Node 1 eliminates transitivity-toleration (1/3 of the space). Node 2 splits Pareto rejectors. Node 3 isolates the core liberty conflict.  
  - **Case-based nodes**: All questions are answerable via the flat case (e.g., Node 3 asks about Ada’s x/z choice; Node 4 asks if Ada can *act* rather than just rank).  
  - **Leaf coverage**: Positions span:
    - Deny transitivity (Leaf 1)  
    - Deny Pareto (Leaf 2)  
    - Deny liberty (Leaf 3)  
    - Re-model liberty (Leaves 4, 8)  
    - Restrict domain (Leaf 5)  
    - Condition liberty (Leaf 6)  
    - Redefine spheres (Leaf 7).  

  Use this tree to guide seminar discussions from concrete intuitions to theoretical commitments. Each leaf’s "awkward commitment" highlights the trade-off required to resolve the paradox.
