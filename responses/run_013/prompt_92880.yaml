  For personal integrity, I should discuss how trading minor values for major ones respects hierarchy but risks self-betrayal. Emphasize that trade requires seeing values as comparable, which some ethical systems reject. In politics, logrolling can build coalitions but might entrench inequality. Institutions: Legislatures are designed for deals; courts might avoid them. International bodies face sovereignty issues. 

  Limits: Lexicographic values (e.g., no torture ever) break the model. Identity-bound values make trade feel like loss. I should note that the analogy works best for negotiable values, not core principles. The user needs to show they've considered these boundaries.

