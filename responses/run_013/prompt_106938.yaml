answer: |-
  Here’s a focused, argument-driven proposal draft for your term paper, structured to meet your requirements:

  **Proposal Title:**  
  The Moral Weight of Virtual Cruelty: Diegetic Harm vs. Interactional Practice in Player-NPC Relations  

  **Core Research Question:**  
  *Does the primary moral significance of gratuitous cruelty toward NPCs reside in the diegetic content (events within the story-world) or the interactional relation (the player’s enacted practice with the game system and community)?*  
  **Determinate Answer:** The interactional relation bears primary moral weight.  

  **The Problem with Standard Answers:**  
  1. **Fictionalist Claim ("It’s not real, nobody’s harmed"):**  
     *Why it fails:* Correctly notes the lack of diegetic *victimhood* (no sentient NPC suffers), but ignores the *real act* performed by the player: deliberately engaging in a practice simulating cruelty for its own sake. It overlooks the player’s agency and the normalization of cruel behavior as gameplay.  
  2. **Realist Claim ("It shows what kind of person you are"):**  
     *Why it fails:* Correctly identifies a real moral concern in the player’s action, but misattributes it by focusing on *character revelation* or implied diegetic victimhood. This conflates the simulated act (killing a character) with the player’s actual act (reloading a save to repeat a death animation). It assumes intent translates directly to real-world vice, ignoring context and reducing the complex practice to a psychological snapshot.  

  **Both approaches collapse the distinction between:**  
  *   **Diegetic Content:** The narrative events, character "experiences," and fictional consequences *within* the game world.  
  *   **Interactional Relation:** The player’s *actual practice*: their chosen actions within the game’s systems, motivations for performing them (e.g., curiosity, boredom, transgression, completionism), the temporal commitment (reloading saves), and the implicit/explicit communication within the player community (sharing stories, streams, achievements).  

  **Thesis:**  
  The moral significance of gratuitous NPC cruelty lies primarily in the **interactional relation**, not the diegetic content. It is a wrong committed within the *practice of play* – a deliberate, often performative, engagement with systems of simulated suffering detached from gameplay goals – reflecting attitudes towards agency, consequence, and the normalization of cruelty, rather than harm done to a fictional entity or a direct revelation of immutable character.  

  **Methodology & Case Studies (Stress-Testing the Distinction):**  
  1.  **Defining "Gratuitous Cruelty":** Operationalize the term: Player actions causing simulated suffering that are *superfluous* to narrative progression, core gameplay loops, or achievement acquisition, often involving repetition or seeking "worse" outcomes. (e.g., save-scumming for varied kill animations, prolonged "torture" mechanics without reward).  
  2.  **Core Analysis Framework:**  
      *   **Diegetic Layer:** Analyze the narrative framing, character agency/responses, and in-world consequences of the cruel act.  
      *   **Interactional Layer:** Analyze player input, system feedback (rewards/punishments), mechanical affordances enabling the act, player motivation/justification, and communal discourse (e.g., Reddit, forums, streamer chats).  
  3.  **Crucial Case Studies (Where Diegetic and Interactional Layers Diverge):**  
      *   **Case 1: Interaction Rewards Cruelty, Diegesis Ignores/Endorses It (e.g., RimWorld, Postal 2):**  
          *   *Diegetic:* NPCs may react minimally or generically; cruelty is often normalized or lacks significant narrative weight.  
          *   **Interactional:** Systems actively reward cruel acts (e.g., harvesting organs in *RimWorld* for profit, achievement for urinating on NPCs in *Postal 2*).  
          *   *Stress-Test:* Does the *interactional reward* structure amplify the moral concern, despite minimal diegetic weight? (Supports thesis).  
      *   **Case 2: Interaction Punishes Cruelty, Diegesis May Depict Harm (e.g., Undertale Genocide Route, Spec Ops: The Line):**  
          *   *Diegetic:* Narrative heavily emphasizes suffering, loss, and consequences; characters explicitly react with fear, sadness, or condemnation.  
          *   **Interactional:** Systems punish the player (e.g., *Undertale* permanently alters the game world, locks content, characters "remember"; *Spec Ops* forces progression through escalating horror, subverts power fantasy).  
          *   *Stress-Test:* Does the *interactional punishment/censure* carry the primary moral weight, even amidst strong diegetic harm? Does the player feel "judged" by the *system/design* more than by the characters? (Strongly supports thesis).  
  4.  **Community Discourse Analysis:** Examine how players discuss these acts (justifications, condemnations, humor) to see if arguments cluster around diegetic ("I killed a bad guy") or interactional ("I spent an hour doing this for fun") elements.  

  **What a Successful Result Looks Like:**  
  A compelling demonstration that across contrasting cases:  
  1.  Moral intuitions and player discourse consistently track the interactional layer (design affordances, player practice, systemic feedback) more decisively than diegetic depictions of harm.  
  2.  The "wrong" is best understood as a *performative act within a practice*: the deliberate choice to engage a system to simulate cruelty for its own sake, reflecting attitudes about agency, consequence-erasure (save-scumming), and normalization.  
  3.  The fictionalist and realist positions are shown to be reductive precisely because they fail to account for this distinct layer of interactional practice.  

  **What Failure Looks Like:**  
  1.  If analysis reveals that player experiences of guilt or condemnation are *inseparable* from diegetic immersion (e.g., players *only* feel bad if the narrative makes them care about the NPC), weakening the claim that interaction is primary.  
  2.  If the interactional layer proves impossible to cleanly disentangle from diegetic interpretation in player accounts.  
  3.  If "gratuitous cruelty" cannot be adequately defined or consistently identified across cases.  

  **Scope Assessment (Semester vs. Career):**  
  **This is firmly a one-semester term paper project.**  
  *   **Manageable:** The core distinction (diegetic vs. interactional) is clear and focused. Two well-chosen contrasting case studies provide sufficient depth without overwhelming scope. The core argument is specific (moral weight location).  
  *   **Not a Career:** It doesn't require developing a wholly new philosophical framework (it builds on existing debates in game studies/philosophy of fiction). It doesn't demand large-scale empirical research (discourse analysis can be targeted). It answers a specific, bounded question rather than attempting a Grand Unified Theory of video game ethics. Filling in citations will ground it, but the core analytical work is achievable.  
  *   **Key for Success:** Strict adherence to the defined question and cases. Avoid tangents into general media violence debates, full psychoanalysis of player intent, or exhaustive cataloging of cruel acts.  

  **Proposed Structure (5000 Words):**  
  1.  Introduction: The Cruelty Puzzle & Standard Answers' Shortcomings (500w)  
  2.  Framing the Distinction: Diegetic Content vs. Interactional Practice (750w)  
  3.  Case Study 1: Rewarded Cruelty (RimWorld/Postal 2) - Interaction Trumps Diegesis (1000w)  
  4.  Case Study 2: Punished Cruelty (Undertale/Spec Ops) - Interaction Carries the Moral Load (1000w)  
  5.  Community Discourse: Tracking the Interactional in Player Talk (750w)  
  6.  Resolving the Puzzle: Why Interactional Practice is Primary (750w)  
  7.  Conclusion: Implications & Limits (250w)  

  This proposal provides a clear roadmap, a testable thesis, and a feasible scope for a compelling semester paper. Good luck with your pitch!
