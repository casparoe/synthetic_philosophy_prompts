prompt: |-
  I'm pitching my advisor a term paper (about 5000 words, one semester) and I need to turn my half-formed idea into a proper proposal first. Here's the idea. When a player does something gratuitously cruel to an NPC — reloads a save just to watch a character die a worse way — people reach for one of two lines: 'it's not real, nobody's harmed,' or 'it's real, it just shows what kind of person you are.' I think both are wrong because they collapse a distinction I want to pull apart: the diegetic content (what happens inside the story world) versus the interactional relation (what the player is doing, as a practice, with the game and with other players). My hunch is the moral weight sits mostly on the interactional side — which is why 'nobody's harmed' doesn't get you off the hook, but also why the wrong isn't done to the character. Write me the proposal: state the question so it has a determinate answer, explain why the standard fictionalist and realist answers leave it open, lay out how I'd actually develop and stress-test the diegetic/interactional split (I want at least one case where the two come apart — a game that rewards cruelty versus one that scolds you for it), say what a real result versus a failure would look like, and tell me honestly whether this is a semester or a career. Skip citations, I'll fill those in myself.
