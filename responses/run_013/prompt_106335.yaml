  For the exam structure, Part A should make students map theories onto cases and pinpoint failures. Key pressure points: why "would" and "might" diverge in (ii-iii) but not in (iv-v), how uniqueness/CEM play in. Part B must avoid leading questions - they need to invent repairs and confront epistemic spillover. The 20-mark split feels right at 10/10 - both parts equally demanding.

  The model answer should: flag (i) as true despite material conditional predicting false (Grice saves it), show (ii) false due to uniqueness failure, (iii) true via limit assumption, note (iv-v) don't split because context makes uniqueness hold. For Part B, the best repair is widening the "might" domain with epistemic access, but that blurs the counterfactual/indicative distinction - that's the cost they must acknowledge.

  Marking scheme needs precision: 1 point for diagnosing (i)'s material conditional failure, 1 for why (ii) fails (uniqueness), 1 for (iii) succeeding (limit), 1 for contrast in (iv-v) (contextual domain restriction), 1 for proposing AND critiquing a repair. Common misses: forgetting Grice for (i), not seeing uniqueness as optional, ignoring contextual differences in domains.

  First-class answers will spot that domain restriction solves (iv-v) but not (ii-iii) because of how evidence constrains closeness - that's the insight beyond just applying frameworks. Also, they'll see that any repair making counterfactuals epistemic undermines the Lewis-Stalnaker divorce from knowledge.

  The professor's deep cut is making students notice that (iv-v) work because "sprinkler armed" creates a natural uniqueness context, while "Merrick didn't start fire" doesn't - that's where theory meets real-world context sensitivity. Brilliantly disguised test of whether they understand why we have these frameworks in the first place.
answer: |-
  Here is the exam question as specified, followed by a model answer, marking scheme, and distinction criteria. All in British English.

  ---

  **PHIL 410: Advanced Topics in Conditionals**
  **Summer Examination 2024**
  **Answer TWO questions. Time allowed: THREE hours.**

  **Question 4**

  At the Ashcroft Lane depot, a fire destroyed the loading bay last March. The official inquiry established conclusively that the fire was started deliberately by a person, and that Merrick, the night porter, was the only person on the site at the relevant time. Consider the following five conditionals:

  (i) If Merrick did not start the fire, somebody else did.
  (ii) If Merrick had not started the fire, somebody else would have.
  (iii) If Merrick had not started the fire, somebody else might have.
  (iv) If the sprinkler system had been armed, the pressure drop would have been logged.
  (v) If the sprinkler system was armed, the pressure drop will have been logged.

  **Part (a):** (10 marks)
  For each conditional (i)-(v), state what verdict (true or false) the standard 'two-semantics package' (truth-functional/Gricean for indicatives; Lewis-Stalnaker for counterfactuals) predicts. Explain concisely whether this prediction matches the intuitive verdict (taking the intuitive verdicts as: true for (i), false for (ii), true for (iii), true for (iv), true for (v)). Then, pinpoint precisely *where* and *why* the package breaks down, focusing particularly on:
  *   Why the 'would' counterfactual (ii) and the 'might' counterfactual (iii) with the same antecedent come apart intuitively, and what assumptions within the Lewis-Stalnaker framework (e.g., Limit Assumption, Uniqueness Assumption, Conditional Excluded Middle) the 'would' analysis must rely on to capture this divergence.
  *   Why the sprinkler counterfactual (iv) and indicative (v) pair shows *no* intuitive contrast between 'would have been' and 'will have been' in their truth values, unlike the Merrick pair (ii) and (i)/(iii). What distinguishes these cases?

  **Part (b):** (10 marks)
  What is the *cheapest repair* to the standard package to account for the divergences identified in Part (a)? Propose and assess one specific repair (e.g., an epistemic reading for 'might' counterfactuals, widening the domain of possibilities for 'might' compared to 'would', or another modification). Critically evaluate whether this repair undermines a core motivation for the indicative/counterfactual distinction, namely, the idea that counterfactuals are not primarily sensitive to our *epistemic state* concerning the actual world.

  ---

  **Model Answer (Approx. 800 words)**

  **Part (a):**

  **(i) 'If Merrick did not start the fire, somebody else did.' (Intuitive: TRUE)**
  The truth-functional material conditional (P ⊃ Q) predicts FALSE. Given the inquiry's findings (Merrick started it, he was alone), the antecedent (~P: Merrick didn't start it) is false, and the consequent (Q: Someone else did) is false (as no one else was there). A false antecedent and false consequent make P ⊃ Q true only if we interpret the conditional truth-functionally as ~(P & ~Q). However, intuitively, the conditional is true because the inquiry established deliberate arson and Merrick's sole presence: if he didn't do it, the facts *force* the conclusion someone else did (even if this seems impossible given the evidence). The standard package rescues this via Gricean pragmatics: asserting the material conditional when you know ~P is misleading (violating Quantity or Relation), but here, the speaker might be emphasising the *inescapable conclusion* from the inquiry's premises, exploiting the truth conditions pragmatically. The prediction (material false, pragmatic rescue to true) matches intuition.

  **(ii) 'If Merrick had not started the fire, somebody else would have.' (Intuitive: FALSE)**
  The Lewis-Stalnaker semantics predicts TRUE. We consider the closest possible world(s) where Merrick didn't start the fire (~P). The inquiry established the fire was started deliberately and Merrick was the only person there. In all closest ~P-worlds, the fire still occurred (as established deliberate arson) and no one else was present. Therefore, someone else *must* have started it in those worlds. Lewis-Stalnaker predicts Q is true in all closest ~P-worlds, so (ii) is true. However, intuitively, it's false. The breakdown occurs because the uniqueness assumption fails. There is *no unique* closest world where Merrick didn't start the fire but the fire (a deliberate arson) still happened and he was alone. Such worlds seem metaphysically impossible or maximally distant. Worlds where the fire doesn't happen at all (also ~Q) are plausibly *closer* to actuality than worlds where a magical second arsonist appears. The standard 'would' analysis, assuming a unique closest world or that Q holds in *all* closest worlds (via Limit Assumption), wrongly predicts truth because it forces a choice between impossible scenarios. Intuition correctly rejects (ii) as false because there are no plausible close worlds where ~P and Q hold; the only close ~P worlds are ~Q worlds.

  **(iii) 'If Merrick had not started the fire, somebody else might have.' (Intuitive: TRUE)**
  Lewis-Stalnaker 'might' counterfactuals (P ◊→ Q) are typically defined as ~(P □→ ~Q). Given the analysis above for (ii), if P □→ ~Q (If Merrick hadn't started it, no one else would have) were true, then (iii) would be false. However, as argued for (ii), P □→ ~Q is also problematic. Crucially, the 'might' conditional doesn't require Q in *all* closest worlds, only in *some* sufficiently close world. The intuitive truth of (iii) arises because we consider a *wider range* of possibilities than for the strict 'would'. Among the somewhat distant worlds where ~P and the fire still happens (deliberate arson), there *are* worlds – however odd or distant – where a second person *was* present and started it (Q). The package can capture this *if* we abandon the Uniqueness Assumption and allow a set of closest worlds, and if we don't require the Limit Assumption to hold universally. In the absence of uniqueness, there is no single set of 'closest' worlds; for the 'might', we look at a broader sphere and find *some* world where ~P and Q hold. The prediction (true, via a non-unique ordering) matches intuition only if we interpret 'might' as looking beyond the very closest worlds implied by the strict 'would' analysis for (ii).

  **(iv) 'If the sprinkler system had been armed, the pressure drop would have been logged.' & (v) 'If the sprinkler system was armed, the pressure drop will have been logged.' (Intuitive: Both TRUE)**
  For the counterfactual (iv): Lewis-Stalnaker predicts TRUE. The closest worlds where the sprinkler was armed are worlds where the system functions normally. A functioning system logs pressure drops when armed. So Q holds in all closest P-worlds. This matches intuition.
  For the indicative (v): The material conditional (P ⊃ Q) would be true if we know ~P (sprinkler not armed) or know Q (drop logged), or both. Crucially, we likely don't know if the drop was logged (we might need to check logs). However, Gricean pragmatics applies: asserting (v) suggests the speaker doesn't know ~P, implying they think if the sprinkler *was* armed (which it might have been, for all they know), then the drop *will have been* logged, based on knowledge of the system's normal functioning. This parallels the counterfactual's truth conditions closely. The key point is that unlike the Merrick case, there is no clash or failure of uniqueness here. The connection between the sprinkler being armed and the drop being logged is a matter of *normal, deterministic function*. There *is* a unique, plausible set of closest worlds for (iv) where the system works as designed. For (v), the epistemic uncertainty about P doesn't create an impossible scenario; the functional connection is robust. Consequently, both conditionals correctly come out true without the theoretical breakdown seen in (ii)/(iii).

  **Part (b):**

  The cheapest repair focuses on the 'might' counterfactual. Instead of defining it solely as the dual of 'would' (~(P □→ ~Q)), we interpret it epistemically: "Given what we know (or what is contextually relevant), it is compatible with the facts that if P had been the case, Q would have been the case." More precisely, we widen the domain of worlds considered for 'might' compared to 'would'. For 'would' (P □→ Q), we consider only the very closest P-worlds, determined by overall similarity. For 'might' (P ◊→ Q), we consider a broader, contextually determined set of epistemically accessible worlds that are still *relevant* counterfactual alternatives, and see if Q holds in *some* of them.

  **Assessment:** This repair cleanly distinguishes (ii) and (iii). For (ii), the very closest ~P-worlds are those where the fire doesn't happen (~Q), so P □→ Q is false. For (iii), within a wider set of conceivable, though more distant, ~P-worlds (including those where a mysterious second arsonist exists), some satisfy Q, so P ◊→ Q is true. The sprinkler pair (iv)/(v) remains consistent because the functional connection holds robustly across all relevantly close worlds, whether considered narrowly ('would') or broadly ('might' or indicative).

  **Cost:** This repair significantly undermines a core motivation for the strict Lewis-Stalnaker counterfactual/epistemic indicative distinction. Lewis emphasised that counterfactuals are *metaphysical*, evaluating objective similarity of worlds, not epistemic possibility. By making 'might' counterfactuals sensitive to the scope of what we find epistemically conceivable or contextually relevant, we reintroduce epistemic factors into counterfactual semantics. The contrast between the indicative (v) – overtly epistemic ("will have been logged" implies inference from possible evidence) – and the counterfactual (iv) – supposedly purely metaphysical – becomes blurred. If the truth of a 'might' counterfactual depends on what possibilities our knowledge or context allows, then *all* counterfactuals become, to some degree, sensitive to epistemic considerations. The 'cheapness' of the repair comes at the price of collapsing the strict separation between the indicative and counterfactual domains. Counterfactuals are no longer purely about objective modal space but involve our epistemic access to it.

  ---

  **Marking Scheme (20 marks total: 5 points worth 4 marks each)**

  1.  **Diagnosis of (i):** Correctly identifies the material conditional predicts false; explains Gricean pragmatic rescue (e.g., conversational implicature based on inquiry premises overriding potential irrelevance) matches intuitive true verdict. *(Common miss: States material conditional predicts true due to false antecedent, failing to see the pragmatic need for rescue.)*
  2.  **Breakdown in (ii)/(iii) Contrast:** Correctly identifies the failure of the Uniqueness Assumption (or strict Limit Assumption) for (ii) leading to its false intuitive verdict, contrasting it with how a non-unique ordering/wider domain allows (iii) to be intuitively true. Explicitly names the relevant assumption(s). *(Common miss: Attributes the difference solely to the modal force ('would' vs 'might') without pinpointing the specific ordering/set selection assumption failure for 'would'.)*
  3.  **Contrast with (iv)/(v) Pair:** Correctly explains that the sprinkler pair shows no contrast because the connection is robust and deterministic, allowing a unique set of close worlds for the counterfactual and a straightforward material conditional + Gricean reading for the indicative without metaphysical impossibility or ordering failure. *(Common miss: States both pairs are the same or fails to explain *why* uniqueness holds for sprinklers but not for Merrick (robust function vs. metaphysical impossibility).)*
  4.  **Repair Proposal:** Proposes a specific, coherent repair (e.g., epistemic 'might', widened domain for 'might'). Clearly articulates *how* this repair resolves the (ii)/(iii) divergence and maintains the (iv)/(v) consistency. *(Common miss: Proposes an overly vague repair, fails to specify *how* it works for the cases, or suggests an ad-hoc solution only for this example.)*
  5.  **Cost Assessment:** Critically evaluates the proposed repair, explicitly arguing that it makes counterfactuals sensitive to epistemic factors (knowledge, context), thereby undermining a key motivation for the indicative/counterfactual distinction (metaphysical vs. epistemic). *(Common miss: Only states the repair works, ignores the cost; or mentions a cost without linking it directly to the blurring of the core distinction.)*

  ---

  **Distinction Criteria (First-Class vs. Upper Second)**

  *   **First-Class:** Demonstrates a deep *synthesis* of the problems, explicitly linking the failure of uniqueness in the Merrick case to the contextual nature of domain restriction (why it fails for Merrick but holds for the sprinklers). Proposes a repair and *insightfully* argues that its cost reveals a fundamental tension: that strict metaphysical counterfactuals struggle with antecedent-induced impossibilities, forcing recourse to epistemic considerations. Shows awareness that the 'cheapest repair' might expose a flaw in the underlying motivation for the distinction.
  *   **Upper Second:** Accurately diagnoses each case using the standard apparatus, identifies the key assumptions (Uniqueness/Limit) causing the (ii)/(iii) breakdown, contrasts it correctly with the (iv)/(v) pair, proposes a plausible repair, and acknowledges the epistemic cost. However, lacks the deeper insight into *why* the contexts differ fundamentally (metaphysical impossibility vs. deterministic function) or the full implications of the cost for the indicative/counterfactual distinction's foundations. May treat the repair as merely technical without probing its philosophical consequences.
