  I'm giving the best man speech at my mates wedding next month. He's a philosopher of perception and she's a close-up magician -- they met at a magic club, obviously. The room will be half magicians, half family, and I want to build the speech around disjunctivism and the argument from illusion without it turning into a seminar. The argument from illusion, as I understand it, says that because a genuine perception and a hallucination can be indistinguishable from the inside, they must share a common core. Disjunctivism says no: they're different in kind, even if you can't tell them apart from the inside. I want to use that to say something about the couple -- that the fact love can feel like a trick, or that you can't always tell from the inside whether it's real, doesn't mean it's the same kind of thing as a fling. The good case isn't just a better version of the bad case. But it needs to land for the magicians and the family, not just the philosophers. Can you write me the speech? Four or five minutes, warm and funny, and make the philosophy do real structural work rather than just name-dropping it. Also, after the speech, give me a short note seperating what's actually settled in the disjunctivism debate from what's genuinely contested -- I don't want to stand up there and present one side's controversial reading as the consensus. If it's relevant, say something about whether epistemic and metaphysical disjunctivism are even the same claim, because I keep hearing both and I'm not sure. British English, please. And don't quote anyone; I don't want to get a quote wrong.
