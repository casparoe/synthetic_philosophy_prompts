  ## The Speech: Through the Looking Glass

  **(Clink glass gently)** Ladies and gentlemen, could I have your attention? For those who don’t know me, I’m [Your Name], and I’ve had the dubious honour of being best mates with this slightly bewildered-looking philosopher groom for more years than either of us care to admit.

  Now, when [Groom's Name] told me he’d met someone special at the magic club, I’ll admit, I pictured… well, something different. I assumed he’d finally cracked under the pressure of Kant and conjured up an imaginary friend! But then I met [Bride's Name]. And let me tell you, seeing our resident thinker of deep thoughts utterly flummoxed by a simple card trick – performed with *this* much charm and skill – was a genuine delight. It was obvious something real, something truly magical, was happening. Not the rabbit-out-of-a-hat kind, but the life-changing kind.

  And it got me thinking about perception. [Groom's Name], as many of you know, spends his days wrestling with how we see the world – quite literally, the philosophy of perception. And [Bride's Name], well, she’s a master of making us see things that aren’t quite what they seem. Close-up magic is all about that beautiful tension: you *know* it’s a trick, your brain is screaming “illusion!”, but your eyes… your eyes are utterly convinced. That card *was* in the middle! That coin *did* vanish! It feels, in that moment, indistinguishable from the real thing.

  This is where things get interesting for our groom’s line of work. There’s this old puzzle: imagine seeing a pint on the bar. Looks real, feels cold, you reach for it… perfect perception. Now imagine, maybe after a *few* too many of those real pints, you hallucinate one. From the inside, in that moment, it might feel just the same. So, the argument goes, if they *feel* identical, maybe they share the same core stuff happening in your head? Maybe reality and illusion are cousins under the skin?

  But [Groom's Name] champions a different view – let’s call it… the stubborn realist perspective. He’d argue: **No.** Just because a perfect perception of a pint and a hallucination of one *feel* the same to *you* in that moment, doesn’t mean they *are* the same kind of thing underneath. One is your mind genuinely connecting with the world – that cold glass, the condensation, the promise of refreshment. The other? It’s your brain playing a solo gig, conjuring something out of nothing. They might *look* identical from your limited perspective, but fundamentally, they’re different beasts. The real pint isn't just a "better" hallucination; it's a completely different *kind* of event. It’s rooted in the actual, wonderful, sometimes sticky world out there.

  **(Turn to the couple)** And this, you two… this is where your story, and this lovely room full of magicians and philosophers and, crucially, family who’ve probably heard enough about pints for one day… this is where it all clicks.

  Love, especially the early days, the dizzying infatuation… it can *feel* a bit like magic, can’t it? That incredible rush, the world tilting on its axis. And sometimes, let’s be honest, it can feel a bit like an *illusion* too. The nerves, the doubts, the “is this *real*?” moments we’ve all had. It can feel indistinguishable, in those fleeting moments, from a powerful infatuation or even just wishful thinking.

  But here’s the stubborn realist truth, the disjunctivist heart of the matter: **Just because genuine, deep, enduring love and a fleeting fling might *feel* similar in the giddy rush of the beginning, doesn’t mean they share the same core. They don’t.**

  What you two have built isn’t just a “better version” of a passing fancy. It’s an entirely different *kind* of thing. It’s rooted in the actual, messy, wonderful reality of knowing each other – the shared jokes, the quiet support, the way you challenge each other (philosophers and magicians need challenging!), the history you’ve written together already. It’s not a trick of the mind; it’s a connection forged in the real world, witnessed by all of us here. Your love isn't a convincing simulation; it's the genuine article.

  [Bride's Name], you haven’t just performed a brilliant illusion on our groom. You’ve shown him – and all of us – what real connection looks like. [Groom's Name], you haven’t just theorised about perception; you’ve found someone who makes reality brighter, sharper, and infinitely more interesting.

  So, let’s raise a glass – a *real* one, I promise, no philosophical hallucinations here! – to the happy couple. To [Groom's Name] and [Bride's Name]. Proof positive that when it’s real, it’s not just a feeling indistinguishable from something lesser. It’s a whole different category of wonderful. May your lives together be filled with genuine connection, spectacular magic (both literal and metaphorical), and endless amounts of clear-sighted, deeply real love.

  **To [Groom's Name] and [Bride's Name]!**

