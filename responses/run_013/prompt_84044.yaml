prompt: |-
  I keep reading about Halden prison in Norway and how humane the whole place is supposed to be, and I've got a worry I want you to actually run with. Please give me the most important implications of this thought: that the Norwegian model works not because of the prison but because of Norway — that what really keeps reoffending down is that a guy walks out of Halden into housing, healthcare, a welfare floor, low inequality, and a society that mostly doesn't treat a record as a permanent caste mark, whereas in the US a guy walks out of a state prison with a felony, no housing, no job, and a parole officer whose main job is to catch him slipping. A friend of mine who does criminology puts it bluntly: the prison isn't rehabilitating anybody, the welfare state is, and Halden is just a decent place to wait for it. She also pointed out that Norwegian prisons pull their health care, education and library services in from the outside system instead of growing their own, while alot of American prisons do the opposite — they strip you out of the system while you're inside, sometimes out of Medicaid, sometimes off the voting rolls. Suppose all that is even half right. What are the most important things that follow — for the punishment-versus-rehabilitation argument itself (does rehab just turn out to be a disguised case for redistribution, and if so does that let retributivists off the hook?), for where a state like mine should actually be spending money if it wanted to cut recidivism, and for what the standard make-the-prisons-nicer pitch gets wrong about its own theory of change? Lead with your bottom line in the first sentence and then give me the reasoning, no preamble and don't restate my question.
reasoning: |-
  Okay, the user is diving deep into the comparison between Halden prison in Norway and the US prison system. They're questioning whether the success of the Norwegian model is due to the prison itself or the broader social welfare system. Their friend in criminology argues that it's the welfare state doing the rehab, not the prison. The user wants to explore the implications of this idea.

  First, I need to unpack their main points. They mention that in Norway, released inmates get housing, healthcare, low inequality, and less stigma. In the US, felons face homelessness, joblessness, and systemic barriers. The friend's blunt take is that Halden is just a waiting room for the welfare state. Also, Norwegian prisons use external services like healthcare and education, while US prisons cut inmates off from Medicaid and voting rights.

