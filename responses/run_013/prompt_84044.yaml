  Analyzing the implications: If the welfare state is key, then rehab programs inside prisons might be less effective without post-release support. The punishment-rehab debate shifts; rehab's success depends on social infrastructure, making it more about redistribution. Retributivists might argue punishment is still necessary, but the focus should be on societal responsibility post-release. For funding, investing in housing, healthcare, and job programs would be more effective than prison amenities. The "nicer prisons" pitch fails by not addressing re-entry barriers and overestimating in-prison rehab without external support.

