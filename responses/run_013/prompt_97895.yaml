prompt: |-
  Ok so I keep flip-flopping on what I actually think bad faith is, and I want to figure out whether there's a principle behind my gut reactions or whether I'm just being inconsistent. Going case by case:

  The waiter at my local place who is *so* into being a waiter -- glides between tables, whole personality is waiter, talks about his station like it's a calling. This is supposedly the textbook case of bad faith. My gut: not bad faith at all. He's just good at his job, maybe he even loves it. If anything it's the opposite of self-deception.

  Someone who cheats on their partner and then shrugs and says 'thats just who I am, I'm a cheater, I've always been one'. My gut: bad faith, no question.

  A guy who reads about those experiments where brain activity predicts your 'decision' a beat before you're consciously aware of deciding, and concludes 'so my choices were never really mine, I'm basically watching them happen'. My gut: not bad faith. He's not hiding anything from himself, he's just drawing the conclusion the evidence seems to point to.

  Someone who says 'I can't help being jealous, my parents made me this way'. My gut: bad faith, all day long.

  A friend who can't stop doomscrolling and says 'the app is engineered to be addictive, I literally couldn't resist it'. My gut: bad faith -- though I'll admit it's also kind of true.

  Someone who, sincerely and with real remorse, says 'I'm a coward, I always have been, I'm not going to pretend otherwise'. My gut: not bad faith. Honestly it feels like the most honest thing a person can say.

  And then a guy I know who's read a bunch of Sartre and now goes around saying 'since I'm totally free, everything I do is my pure choice, so there's nothing to feel guilty about, I'm just choosing'. My gut: this is bad faith, the worst kind, freedom used as a get-out-of-jail card.

  The pairs that bug me: the cheater and the coward are both just stating what they take to be a fact about themselves, and I only call one of them bad faith. Same with the brain-scan guy and the jealousy guy -- both explain their behavior by something outside their control and I let one off. And the waiter is 'playing a role' exactly as much as the cheater is.

  Tentative principle I've been toying with: bad faith isn't about whether the self-description is true, or about playing a role -- it's about whether you're using the description to duck the fact that you're choosing right now. So the cheater and the jealousy guy use it as an excuse, the coward is just reporting, and the brain-scan guy... I don't know, maybe he's ducking too and I just don't want to say so?

  What I want: a principle, or a few candidates, stated precisely enough that you can apply it to cases I haven't listed, with the specific case that forces each clause, plus an honest note on which of my verdicts it can't keep. And I'd like you to say how confident you are in the whole thing and single out the one step you're least sure of.

  Format it as a numbered list with exactly five items, each one a sentence or two, no intro and no conclusion.
reasoning: |-
  Hmm, the user is struggling with the concept of "bad faith" as defined by existentialist philosophy, specifically Sartre. They've listed several concrete scenarios where their gut reactions conflict with textbook definitions, and they want a consistent principle to explain their judgments.

  Looking at their examples: The enthusiastic waiter isn't bad faith to them despite being the "textbook case," while the cheater using identity as excuse clearly is. The neuroscience fatalist gets a pass but not the "my parents made me jealous" person. The self-proclaimed coward feels honest, but the Sartre-quoting freedom-absolutist feels like bad faith.

  Their tentative theory centers on whether self-description is used to evade present responsibility. This is insightful and aligns with Sartre's core idea that bad faith involves denying one's freedom to choose in the moment. But some cases still trouble them, like why the brain-scan guy isn't dodging responsibility while the jealousy person is.

  I need to distill principles that explain all their judgments. The key differentiators seem to be: (1) Is the claim used to avoid responsibility for future choices? (The cheater says "I'll always cheat," the jealousy person implies they can't change). (2) Does it contradict the immediate experience of choice? (The coward admits choosing fear, while the freedom-quoter denies guilt despite choosing). (3) What's the practical consequence? (The waiter's "role-playing" enables engagement, while the cheater's enables harm).

  The brain-scan case is the hardest—their gut says it's not bad faith, but philosophically it could be seen as denying agency. The distinction might be that the brain-scan guy is making a theoretical claim without immediate behavioral stakes, while the jealousy person is excusing ongoing actions.

  I'll structure the response as five precise principles per their request, referencing the cases that "force" each clause, and note where their coward verdict might conflict with strict Sartreanism. The weakest point is Principle 4—distinguishing theoretical acceptance (brain-scan) from practical evasion (jealousy) feels fuzzy but necessary to honor their intuition.
answer: |-
  Here are five precisely stated principles derived from your cases, with the conflicting case that necessitates each clause and explicit notes on which of your verdicts each principle contradicts:

  1.  **Bad faith occurs when an agent treats a contingent aspect of self (trait, role, past) as an absolute, fixed essence specifically to evade responsibility for present/future choices.** (Forced by: Cheater vs. Coward; Contradicts: None of your verdicts, explains the distinction).
  2.  **Invoking external determination (biology, upbringing, technology) constitutes bad faith only when used practically to absolve oneself of the responsibility to choose or act differently *in the relevant situation*, despite the immediate phenomenological experience of choice.** (Forced by: Brain-scan guy vs. Jealousy guy & Doomscroller; Contradicts: Your "not bad faith" verdict on the Brain-scan guy; he *is* using it to duck the appearance of choice).
  3.  **Occupying a social role authentically (e.g., Waiter) is not bad faith if it embodies engaged, non-evasive action within that role, even if the role is performed intensely.** (Forced by: Waiter vs. textbook assumption; Contradicts: None of your verdicts, explains why the Waiter isn't bad faith).
  4.  **Statements of self-assessment (e.g., "I am a coward") are not bad faith if they acknowledge the facticity *as* a chosen stance one continues to inhabit, without using it to preclude the possibility of choosing otherwise *now*.** (Forced by: Coward vs. Cheater; Contradicts: Strict Sartrean view that *any* "I am X" is essentialist bad faith; your Coward verdict stands).
  5.  **Appealing to radical freedom itself becomes bad faith when used instrumentally to deny the concrete consequences, responsibilities, or *facticity* (the given situation, past actions, traits) inherent in one's choices, thereby dissolving ethical engagement.** (Forced by: Sartre-quoting guy; Contradicts: None of your verdicts, explains why this use of freedom is bad faith).

  **Confidence & Least Sure Step:** Moderately High (8/10). The principles coherently explain *all* your specific gut verdicts *except* the Brain-scan guy. Principle 2 *requires* classifying the Brain-scan guy as bad faith to be consistent with your verdicts on the Jealousy guy and Doomscroller. **The least confident step is Principle 2's distinction** – specifically, whether the Brain-scan guy's *theoretical* conclusion, absent immediate practical evasion in a specific situation you described, constitutes "practical absolution" and thus bad faith. Your gut says no; the principle (to explain your other verdicts) leans yes.
