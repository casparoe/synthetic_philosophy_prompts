  **Rules for each arm (handout):**

  **Arm 1:**
  - You start with 100 points.
  - You can invest in a project. The project requires an investment of 10 points per round.
  - In each round, you flip a coin: 
     - Heads (50%): success! You get 40 points and the project ends.
     - Tails (50%): failure. You then decide whether to continue (invest another 10 points) or quit.
  - If you quit, you get no reward and the project ends.
  - Goal: Maximize your points.

  **Arm 2:**
  - You start with 100 points.
  - The project has a hidden type: Good (70% success chance per round) or Bad (30% success chance). There's a 50% chance of each type at the start.
  - Cost per round: 10 points.
  - Reward: 40 points upon success.
  - After each failure, you decide to continue or quit.
  - You update your belief about the type based on the failures.

  **Arm 3:**
  - You start with 100 points.
  - First project (reputation building):
     - Cost per round: 20 points.
     - Reward: 40 points.
     - Success chance: 40% per round.
     - Maximum 5 rounds. After each failure, you decide to continue or quit. If you quit at any time, you get no reward and the project ends. If you complete 5 rounds without success, the project ends without reward.
  - Banker observes: if you quit at any time in the first project, you get a bad reputation; otherwise, good reputation.
  - Second project:
     - Cost per round: 10 points (if good reputation) or 25 points (if bad reputation).
     - Reward: 40 points.
     - Success chance: 50% per round.
     - Maximum 3 rounds. You must play at least the first round. After each failure, you decide to continue or quit. If you quit, you get no reward and the project ends. If you complete 3 rounds without success, the project ends without reward.

