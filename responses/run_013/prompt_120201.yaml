  1. Arm 1: Only future costs and benefits matter. Sunk costs should be ignored.
  2. Arm 2: The sunk cost (via the number of failures) is evidence. It's rational to use evidence, so quitting because of the evidence is not honoring the sunk cost per se.
  3. Arm 3: Continuing in the first project (despite myopic losses) is rational because it secures better future opportunities. This is about reputation and incentives.
  4. The charge of irrationality is about the status of the sunk cost: is it being used as a reason, or is it evidence, or is it part of an incentive structure?
  5. The residual case: An agent who uses the sunk cost itself as a reason (without evidence or incentive) is irrational. But the activity shows that sometimes we might misattribute irrationality when there is hidden structure.

  This design should achieve the goal of making students feel the tension and then question the standard verdict.
answer: |-
  ### **Game Design: "The Sunk Cost Dilemma"**
  **Objective:** Teams experience three scenarios where sunk costs appear irrational (Arm 1), then defensible as evidence (Arm 2) or reputation-building (Arm 3). The tension arises from gameplay, not lecture.  
  **Players:** 4–5 teams of 4–5 students each.  
  **Materials:**  
  - Team packets (rules, decision sheets, calculators).  
  - Coins for probability flips (one per team).  
  - Public scoreboard (whiteboard/projected) tracking team points.  
  - Role cards for "Banker" (instructor-led in Arm 3).  
  **Points System:** Teams start with 100 points each. Points are fictional (no real money). Payoffs are identical across arms to avoid signaling "trick" scenarios.

  ---

  ### **Game Rules & Timeline (75 min total)**
  #### **0–5 min: Introduction**  
  - Briefly explain: "Today, you’ll invest in projects as teams. Your goal is to maximize points. Ignore sunk costs? Maybe. Let’s see."  
  - **Do not** define sunk costs or hint at the lesson. Assign teams and distribute packets.

  #### **5–25 min: Arm 1 – Pure Sunk Cost (Standard Case)**  
  **Rules:**  
  - Teams invest in a project over rounds. Each round costs 10 points.  
  - **Per-round choice:** Pay 10 points to play. Flip a coin:  
    - **Heads (50%):** Success! Gain 40 points. Project ends.  
    - **Tails (50%):** Failure. Choose to continue or quit.  
  - If quit, no reward. Project ends.  
  - **Rationale:** Future EV = (0.5 × 40) − 10 = +10 points/round. Quitting is irrational unless EV turns negative (it never does). Sunk costs are irrelevant.  

  **Procedure:**  
  - Teams play until success or quit (max 6 rounds).  
  - Scoreboard updates after each team finishes.  
  - **Discussion (last 5 min):** "Why did you quit/continue? Was past spending relevant?" Elicit consensus: *"Sunk costs should be ignored."* Write verdict on board.  

  **Predictable Issues:**  
  - **Arithmetic errors:** Teams may miscalculate EV.  
    - *Fix:* Provide calculators; walk around to verify.  
  - **Team dynamics:** Dominant players may override group.  
    - *Fix:* Assign roles (e.g., "flipper," "calculator," "spokesperson").  

  #### **25–45 min: Arm 2 – Informative Sunk Cost (Evidence Case)**  
  **Rules:**  
  - Same as Arm 1 (cost: 10/round, reward: 40 on success) but with a hidden "project type":  
    - **Good type (50% prior):** 70% success chance/round.  
    - **Bad type (50% prior):** 30% success chance/round.  
  - Teams see outcomes (success/failure) but not type. After each failure, they update beliefs and decide.  
  - **Rationale:** Sunk costs correlate with evidence (many failures → likely bad type). Quitting may be rational if P(Good) drops enough. EV depends on updated beliefs.  

  **Procedure:**  
  - Teams play one project (max 6 rounds).  
  - **Bayesian help (for intuition, not math):** "More failures → more likely bad project."  
  - Scoreboard updates.  
  - **Discussion (last 5 min):** "Did past spending affect decisions? Why?" Challenge Arm 1 verdict: *"Is quitting after many failures irrational, or smart use of evidence?"*  

  **Predictable Issues:**  
  - **Misinterpreting evidence:** Teams may conflate "money spent" with "failures observed."  
    - *Fix:* Clarify: "Your spending isn’t magic—it’s the failures that matter."  
  - **Over-updating:** Teams quit too early.  
    - *Fix:* Remind: "Good projects fail sometimes too."  

  #### **45–65 min: Arm 3 – Strategic Sunk Cost (Reputation Case)**  
  **Rules:**  
  - **Project 1 (Reputation Building):**  
    - Cost: 20 points/round. Reward: 40 on success.  
    - Success chance: 40%/round (EV/round = (0.4 × 40) − 20 = −4).  
    - Max 4 rounds. After each failure, choose: continue or quit.  
  - **Banker (instructor) watches:**  
    - If team **never quits** in Project 1 → "Trusted" status.  
    - If team **quits** → "Risky" status.  
  - **Project 2 (Consequences):**  
    - "Trusted": Cost = 10 points/round.  
    - "Risky": Cost = 25 points/round.  
    - Reward: 40 on success. Success chance: 50%/round.  
    - Max 3 rounds.  
  - **Rationale:** Continuing in Project 1 (despite negative EV) buys credibility. Quitting penalizes future funding.  

  **Procedure:**  
  - Teams play Project 1 → Banker assigns status → Teams play Project 2.  
  - Scoreboard updates after each project.  
  - **Discussion (last 5 min):** "Why continue in Project 1 when EV is negative?" Highlight: *"Reputation affects future costs."*  

  **Predictable Issues:**  
  - **Confusion over two projects:** Teams may rush.  
    - *Fix:* Announce transitions clearly: "Project 1 ending... Banker deciding... Project 2 starting."  
  - **Underestimating reputation:** Teams quit Project 1 for short-term gain.  
    - *Fix:* Post-Arm 3, contrast points: "Team A quit Project 1 but paid dearly in Project 2."  

  ---

  ### **Debrief (65–75 min)**  
  **Map gameplay to concepts (use whiteboard):**  
  1. **Arm 1 → Sunk costs as bad reasons:**  
     - "You quit because ‘we lost too much’? That’s irrational. Only marginal costs/benefits matter. The €10 spent last round can’t affect this round’s coin flip."  
     - **Key moment:** Teams quitting despite positive EV—this is the fallacy in action.  

  2. **Arm 2 → Sunk costs as evidence:**  
     - "When you quit after many failures, you weren’t honoring sunk costs—you used them as *evidence* of a bad project. The €500 spent isn’t a reason; it’s a signal."  
     - **Tension:** "But what if you knew the project type? If spending is *screened off* by other data (e.g., a report confirming it’s Good), then past costs lose evidential value. The charge of irrationality relocates: do you have better information?"  

  3. **Arm 3 → Sunk costs as incentives:**  
     - "Continuing in Project 1 wasn’t about the money gone—it was about the Banker’s future fees. This is *policy rationality*: a rule (‘never quit’) can be wise even if single acts (continuing at −4 EV) seem irrational."  
     - **Link to concepts:** Reputation, precommitment, and tournaments (e.g., staying in a race to deter rivals).  

  **Close on the residual figure:**  
  - "The agent who says, ‘We spent €1M, so we must continue!’—even with no evidence or incentives—is irrational. Your gameplay made this agent intelligible (via evidence/reputation) but not *correct*. Rationality isn’t about what pays randomly; it’s about what considerations justify a choice. Sunk costs alone never do."  

  ---

  ### **What the Game Can’t Do (And How to Handle It)**  
  - **Cannot reproduce:** The *psychology* of sunk costs (e.g., loss aversion, ego). Students might *feel* the pull in Arm 1 but not viscerally.  
    - *Supply yourself:* In debrief, ask: "Did anyone want to quit in Arm 1 just to end the pain? That’s human—but not rational."  
  - **Predictable noise:**  
    - **Arithmetic:** Some teams will botch EV calculations.  
      - *Mitigation:* Use whole-group examples ("If it costs 10 and you have 50% chance of 40, what’s EV?").  
    - **Team disagreements:** Quiet members disengage.  
      - *Mitigation:* Require teams to report consensus (e.g., "Spokesperson, what did you choose and why?").  

  **First-Run Advice:**  
  - **Pilot the math:** Test Arm 3’s EV (−4 in Project 1) to ensure it’s intuitively negative.  
  - **Embrace chaos:** If Arm 2 runs long, skip Arm 3 discussion and fold it into debrief. Focus on the pivot from "always irrational" to "it depends."  
  - **End on mystery:** "If honoring sunk costs is sometimes smart, sometimes dumb—how do we tell the difference?" Leave this unresolved.  

  This design forces tension through play: Arm 1 condemns sunk costs, Arms 2–3 complicate it, and the debrief dissects *why*. The "aha" moment: rationality hinges on the *role* of past costs (reason, clue, or incentive), not outcomes.
