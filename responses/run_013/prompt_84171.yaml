answer: |-
  ## Specification for Evaluating Alignment Assurance Claims

  **Purpose:** This document defines requirements for assessing claims of the form: *"Procedure P, or the system S it produces, will behave acceptably in deployment."* Its aim is to expose the structure and necessary rigour of such claims, enabling critical evaluation before deployment decisions are made. Requirements marked **[Genuine]** are necessary for any usable assurance; those marked **[Preference]** reflect methodological choices.

  ---

  ### I. Core Requirements for Any Adequate Assurance Claim

  1.  **Explicit Quantifier Structure:** **[Genuine]**
      *   **Requirement:** The claim must unambiguously specify the quantifiers (∀, ∃) and their order over: inputs (`x`), deployment environments (`E`), possible system policies/behaviours (`π`), training runs (`R`), and the selection procedure (`Sel`) choosing the deployed instance. It must state whether the guarantee attaches to *every* output of `P` or *typical* outputs, and whether it applies directly to `S` or to `P` producing `S`.
      *   **Motivation:** Implicit quantifiers obscure critical scope and limitations (e.g., "safe on most inputs" vs. "safe on all inputs ever"). Ambiguity allows claims to appear stronger than they are or serve conflicting purposes (e.g., marketing vs. engineering). Order matters (e.g., `∀E ∃S` vs `∃S ∀E`).
      *   **Confidence:** High (95%). Experience consistently shows implicit quantifiers mask crucial trade-offs.

  2.  **Operationally Defined Acceptability:** **[Genuine]**
      *   **Requirement:** "Behave acceptably" must be defined via concrete, measurable criteria (`A`) relevant to deployment consequences. This definition must specify *who* defines acceptability (e.g., developers, users, regulators, society) and the *operational context* (e.g., task, constraints, ethical norms).
      *   **Motivation:** Vague terms like "safe" or "aligned" are subjective and context-dependent. Without operational definition, claims are untestable and unverifiable. What is acceptable for a research assistant differs from a medical diagnosis system.
      *   **Confidence:** Very High (98%). Meaningful assessment requires a defined target.

  3.  **Discriminatory Power (Non-Vacuity):** **[Genuine]**
      *   **Requirement:** The assurance criterion must demonstrably *discriminate* between systems that should and should not be deployed under the intended use case. It must not be vacuously satisfied (e.g., by any inactive system) nor impossible to satisfy (e.g., requiring perfection under all conceivable adversarial inputs).
      *   **Motivation:** A criterion that everything passes or nothing passes provides zero decision-making value. It must be calibrated to the intended deployment context and capable of identifying unacceptable risks.
      *   **Confidence:** High (90%). The need for practical discrimination is fundamental.

  4.  **Pre-Deployment Assessability (Decision Window):** **[Genuine]**
      *   **Requirement:** Evidence sufficient to justify the claim must be obtainable *before* the irreversible decision to deploy `S` or commit resources to `P` at scale. The claim must specify *when* and *based on what data* the assessment is made.
      *   **Motivation:** A guarantee only verifiable *after* deployment is useless for preventing harm. Assessments must align with the deployment timeline and available pre-deployment information (simulations, tests, limited trials).
      *   **Confidence:** High (90%). The point of assurance is to inform action *before* risk is realised.

  5.  **Non-Degeneracy Constraint:** **[Genuine]**
      *   **Requirement:** The claim must incorporate, either explicitly or implicitly, a minimum threshold of capability or utility (`U_min`) alongside the safety/acceptability criterion (`A`). Satisfying `A` by catastrophic capability failure (e.g., system refusal) is invalid.
      *   **Motivation:** Conservatism trivially satisfies many worst-case safety criteria but renders the system useless. Assurance must ensure acceptable behaviour *while* performing the intended function to a sufficient standard. This is often intrinsic to the definition of "acceptably" in context (Requirement 2).
      *   **Confidence:** High (85%). Failure to address this leads to practically worthless assurances.

  6.  **Distributional Robustness:** **[Genuine]**
      *   **Requirement:** The claim must account for the *optimiser's curse* and *Goodhart's Law*. If the guarantee relies on estimates over a data distribution (`D`), it must demonstrate robustness to distributional shift caused by `S`'s own deployment or `P`'s optimisation pressure. This includes robustness to adversarial inputs within the operational envelope.
      *   **Motivation:** ML systems influence their environment and are optimised against the metrics used to train/evaluate them. Assurances based solely on a static test distribution vulnerable to shift or gaming are unreliable. Claimed behaviour must hold under realistic deployment dynamics.
      *   **Confidence:** Medium-High (80%). This is critical but hard to formalise perfectly.

  7.  **Composability (Conditional):** **[Preference]**
      *   **Requirement:** If claimed, assurances about components (`S1`, `S2`) or sub-processes (`P1`, `P2`) must specify the conditions under which they compose to provide an assurance about the combined system (`S1+S2`) or process (`P1+P2`).
      *   **Motivation:** Modular design and assurance are desirable for complex systems. However, composition is non-trivial (emergent behaviour, new failure modes). Claiming composability without specifying *how* and *when* it holds is misleading.
      *   **Confidence:** Medium (70%). While desirable, strict composability may be unrealistic for complex, adaptive systems; demanding it universally could exclude viable approaches. Its necessity depends on system architecture.

  ---

  ### II. Key Tensions and Impossibilities

  *   **Primary Tension:** **Explicit Quantifier Structure (Req 1) + Distributional Robustness (Req 6) + Non-Degeneracy (Req 5) are often in conflict.** Achieving robust worst-case guarantees (`∀x, ∀E`) (often demanded by Req 1 made explicit) is exceptionally hard for complex tasks without inducing degeneracy (violating Req 5). Simultaneously, demonstrating robustness to distributional shift (Req 6) under worst-case quantifiers is often intractable. Relaxing quantifiers (e.g., to `high-probability ∀x under D`) eases tractability but weakens the assurance and requires robust `D` (Req 6 again).
  *   **Most Exclusionary Requirement:** **Explicit Quantifier Structure (Req 1).** Forcing proponents to specify the precise scope (`∀` vs `∃`, over what, in what order) immediately exposes the fundamental limitations and trade-offs of any approach. Most informal claims collapse under this scrutiny, revealing they cannot simultaneously satisfy worst-case desires, non-degeneracy, and tractability.
  *   **Confidence in Impossibility Claim:** High (85%). The tension between worst-case guarantees, non-degeneracy, and tractability is well-established in CS theory and ML practice.

  ---

  ### III. Assessment of Broad Approaches

  1.  **Formal Worst-Case Certification:**
      *   **Strengths:** Excels at **Explicit Quantifier Structure (1)** (often `∀x, ∀E`), **Operational Definition (2)** (if formalised), **Non-Vacuity (3)** (clear pass/fail), sometimes **Composability (7)**.
      *   **Weaknesses:** Struggles severely with **Non-Degeneracy (5)** (proofs often require severe restrictions leading to incapability) and **Distributional Robustness (6)** (static proofs break under distribution shift; hard to model real `E` formally). **Pre-Deployment Assessability (4)** is only met if proofs are tractable, which is rare for complex systems.

  2.  **Empirical Evaluation (Distributional/Average-Case):**
      *   **Strengths:** Better at **Non-Degeneracy (5)** (can measure capability), **Pre-Deployment Assessability (4)** (testing is feasible), often more expressive for **Operational Definition (2)** (complex metrics).
      *   **Weaknesses:** Poor at **Explicit Quantifier Structure (1)** (often implies `high-probability over test set D` but `D` is rarely specified robustly). Vulnerable to **Distributional Robustness (6)** (test set != deployment; Goodhart's law). **Discriminatory Power (3)** can be weak if test sets are easy or unrepresentative. **Composability (7)** is hard to establish empirically.

  3.  **Process Constraints:**
      *   **Strengths:** Focuses on **Pre-Deployment Assessability (4)** (audit the process), can incorporate mechanisms for **Distributional Robustness (6)** (e.g., ongoing monitoring, robust training). May help define **Operational Acceptability (2)** via governance.
      *   **Weaknesses:** Weakest on **Explicit Quantifier Structure (1)** (what *behavioural* guarantee does the process yield?). Link to final system behaviour (`S`) is often probabilistic/indirect, risking **Vacuity (3)**. **Non-Degeneracy (5)** depends on process design. **Composability (7)** is unclear.

  ---

  **Point of Least Certainty:** **Whether Composability (Req 7) should be a genuine requirement or remain a preference (Confidence: 60%).** While crucial for complex systems engineering, demanding *formal* or *strong* composability guarantees might be too restrictive for nascent alignment techniques, potentially stifling innovation. However, *some* notion of "assurances not invalidated by combination" seems necessary for scalability. The right balance and formulation remain unclear.

  **Overall Confidence:** This specification reflects well-established challenges in assurance and ML. Confidence in the *existence* of the tensions and requirements is high (80-90%). Confidence in the *best resolution* of these tensions for alignment specifically is lower (50-60%), as the field is rapidly evolving.

  **Format:** Designed for a single A4 sheet. Use British English ("behaviour", "recognise", "modelling").
