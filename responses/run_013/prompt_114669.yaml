prompt: |-
  I'm setting the final exam for an upper-level seminar on the intentional stance, and I need one essay question that a competent summary of the physical/design/intentional trichotomy cannot answer. Build it on this case. Two systems, Index and Net, have identical input–output profiles over the same fixed battery of questions: same answers, same reported confidence, same response times, and both are artifacts whose internals we could in principle read off in full. Index answers by a giant stored lookup; Net answers by a compact generalizing model whose internal states compress the battery rather than store it. On Dennett's own account of what makes a pattern real — a pattern is real in some data when there is a description of the data more efficient than the bit map — Index's behaviour exhibits no real pattern at the intentional level while Net's does, despite the behavioural identity. The question should force students to (a) say whether belief attribution is warranted for Net and unwarranted for Index on identical behavioural evidence, and whether that verdict is a consequence of the stance or merely of our descriptive convenience; (b) say whether the stance was ever motivated by our ignorance of mechanism, and what becomes of it once the mechanism is fully inspectable; and (c) say whether, for Net, there is a fact of the matter about which content it believes when several incompatible content schemes predict its outputs equally well, or whether content is as indeterminate as the Quinean tradition the stance grows out of would suggest. It should be answerable in about ninety minutes.

  Give me the question, a model answer of about 700 words, and a marking scheme out of 20 built around five must-hit points, at least one of which is the move that separates an A from a B, plus a one-line note for each point on how candidates typically lose the mark.

  If the case as I have set it up fails to isolate the crux — if the identical input–output profiles make the compression criterion do no work, or if the question turns out to be answerable by reciting Dennett — say so plainly rather than drafting around it; I would rather rebuild the question than ship a pretty one that tests recall. Lead with the exam question itself, then the model answer, then the marking scheme; no preamble.
reasoning: |-
  We are given two systems, Index and Net, with identical input-output profiles (same answers, same reported confidence, same response times) over the same fixed battery of questions. Index uses a giant stored lookup table, while Net uses a compact generalizing model that compresses the battery. According to Dennett's pattern reality criterion (a pattern is real if there is a more efficient description than the bit map), Net exhibits a real pattern at the intentional level while Index does not.

  The question must force students to address:
  (a) Whether belief attribution is warranted for Net but not for Index on identical behavioral evidence, and whether this verdict is a consequence of the intentional stance (i.e., a matter of our descriptive convenience) or something more.
  (b) Whether the intentional stance was motivated by our ignorance of mechanism and what becomes of it when the mechanism is fully inspectable.
  (c) For Net, when several incompatible content schemes predict its outputs equally well, whether there is a fact of the matter about which content it believes or if content is indeterminate (as per Quinean tradition).

  The case seems to isolate the crux: the behavioral identity forces us to rely on internal structure (via the compression criterion) to warrant belief attribution. The compression criterion does work here because it distinguishes between the two systems despite identical behavior.

  Exam Question:

  "Consider two systems, Index and Net, that are behaviorally identical: they produce the same answers, with the same reported confidence and response times, to a fixed battery of questions. Index uses a giant lookup table storing every question-answer pair. Net uses a compact, generalizing model that compresses the battery by having internal states that capture regularities. According to Dennett’s criterion of real patterns (where a pattern is real if there is a more efficient description of the data than the bit map), Net’s behavior exhibits a real pattern at the intentional level, while Index’s does not.

  (a) Is belief attribution warranted for Net but not for Index? Is this difference in warrant a consequence of the intentional stance (i.e., a matter of descriptive convenience) or does it reflect a deeper fact about the systems?
  (b) The intentional stance is sometimes thought to be motivated by our ignorance of the underlying mechanism. What happens to the intentional stance when we can fully inspect the internal mechanism, as we can with these artifacts? Does such inspection undermine the stance, or can it still play a role?
  (c) For Net, suppose there are multiple incompatible content schemes (i.e., different ways of assigning beliefs) that equally predict its outputs. Is there a fact of the matter about which content Net actually believes, or is the content indeterminate (as Quine’s thesis of the indeterminacy of translation might suggest)?

  In your answer, engage critically with Dennett’s views on the intentional stance and real patterns."

  Model Answer (approx 700 words):

  Dennett’s intentional stance attributes beliefs and desires to systems when doing so provides a predictive advantage. The stance is instrumental: we adopt it because it works, not because it reveals intrinsic properties. The case of Index and Net challenges this instrumentalism because both systems are behaviorally indistinguishable, yet Dennett’s real patterns criterion (from “Real Patterns,” 1991) suggests that only Net has beliefs. This essay argues that Dennett’s account implies that belief attribution is warranted for Net but not Index due to the presence of a real pattern in Net’s behavior, that this is a matter of descriptive convenience without deeper metaphysical commitment, and that the intentional stance remains useful even with full mechanistic knowledge. However, when multiple content schemes fit equally well, content is indeterminate.

  (a) Belief attribution is warranted for Net but not Index because Net’s behavior exhibits a real pattern at the intentional level. Index’s lookup table does not compress the data: it is a bit map. In contrast, Net’s model provides a shorter description by capturing regularities. For Dennett, patterns are real if they are projectible and allow for efficient description. Thus, the intentional stance attributes beliefs to Net because doing so compresses the data and supports counterfactuals (e.g., how Net would answer unseen questions). For Index, the stance is otiose: we could use it, but it wouldn’t be more efficient than the physical stance (reading the table). However, this difference in warrant is not a reflection of a deeper metaphysical fact (like intrinsic intentionality) but of our descriptive convenience. The intentional stance is a tool for prediction, and its success depends on the system’s design. Dennett is clear that beliefs are not internal states with intrinsic content but patterns in behavior. Thus, the verdict is stance-relative: it depends on the perspective we take and the patterns we can discern.

  (b) The intentional stance was indeed motivated by ignorance: when we don’t know the mechanism, we treat the system as a rational agent. But Dennett argues that even with full mechanistic knowledge, the intentional stance can still be useful. In this case, we can see that Index’s mechanism does not support the intentional pattern (it’s just a list), while Net’s does (it has states that track meaning). Full inspection doesn’t undermine the stance; it reveals why the stance works for Net and not Index. Moreover, the intentional level provides a higher-order description that abstracts from implementation details. For complex systems like humans, the intentional stance remains indispensable despite knowing the brain’s mechanism because it offers a tractable way to predict behavior. Thus, the stance is not merely a stopgap for ignorance but a permanent level of explanation when the system exhibits the right kind of pattern.

  (c) For Net, if multiple content schemes predict equally well, then according to Dennett, there is no fact of the matter about which content is believed. This indeterminacy stems from Quine’s thesis: just as translation between languages is underdetermined by behavior, so is belief attribution. Dennett embraces this: content is fixed only up to the predictive success of the stance. The real pattern in Net’s behavior is compatible with various interpretations, and no deeper fact (like the exact physical state) can break the tie because content is not an intrinsic property. However, this does not make the intentional stance arbitrary: some interpretations may be more elegant or compress better, but none is uniquely true. Dennett’s criterion of real patterns does not require uniqueness; it requires efficiency. Thus, while we can attribute beliefs to Net, the specific content is indeterminate when multiple schemes fit equally well.

  Critically, Dennett’s account avoids metaphysical commitments about intentionality but risks making belief too observer-dependent. If identical behavior can come from systems that do or do not warrant belief attribution based solely on internal compression, then the reality of beliefs seems to depend on the system’s design, not just behavior. This design is objective, so the pattern’s reality is not merely in the eye of the beholder. But the indeterminacy of content remains. One might object that if we had access to Net’s internal states, we could resolve content, but Dennett would counter that states only have content relative to an interpretation scheme. Thus, the intentional stance provides real but not uniquely determined patterns.

  In conclusion, Dennett’s framework distinguishes Index and Net based on the presence of a real pattern, warranting belief attribution only for Net. This distinction is grounded in descriptive efficiency, not metaphysics. The intentional stance survives full mechanistic knowledge because it captures patterns that mechanistic descriptions may obscure. But when multiple contents fit, the stance yields indeterminacy, reflecting its Quinean roots.

  Marking Scheme (out of 20):

  1. **Recognition of the compression criterion as the basis for distinguishing Net and Index** [4 marks]
     - Must state that Net's behavior is compressible by a generalizing model (exhibiting a real pattern) while Index's is not (it's a bit map). 
     - *Common loss: Failing to explain how the compression criterion applies despite behavioral identity.*

  2. **Addressing whether belief attribution is warranted and why, including the stance-relativity** [4 marks]
     - Must say belief attribution is warranted for Net (due to real pattern) but not Index, and that this is a matter of descriptive convenience (instrumentalism) without deeper metaphysical fact.
     - *Common loss: Claiming the distinction reflects intrinsic intentionality or missing the instrumentalist point.*

  3. **Handling the motivation by ignorance and the role of the stance with full mechanistic knowledge** [4 marks]
     - Must acknowledge the stance was motivated by ignorance but argue it remains useful even with full knowledge (e.g., for explanation and prediction at a higher level), and that inspection reveals why it works for Net.
     - *Common loss: Saying full inspection eliminates the need for the stance or failing to explain its continued utility.*

  4. **Discussion of content indeterminacy in the face of multiple schemes** [4 marks]
     - Must state that when multiple content schemes predict equally well, there is no fact of the matter (indeterminacy) and link this to Quine, emphasizing that content is not intrinsic.
     - *Common loss: Claiming that internal states determine content uniquely or not addressing Quinean underdetermination.*

  5. **Critical engagement beyond summary** [4 marks] *[This is the A/B separator]*
     - Must go beyond reciting Dennett by raising a critical point (e.g., the worry that the compression criterion makes belief too observer-dependent, or that it might be arbitrary to privilege compression over other virtues, or noting that the compression criterion might not align with everyday belief attribution). Alternatively, a sophisticated defense of Dennett against such worries.
     - *Common loss: Merely summarizing without critique or offering only superficial criticism.*

  Total: 20 marks (each point out of 4).
answer: |-
  ### Exam Question
  "Two systems, Index and Net, exhibit identical input–output profiles over the same fixed battery of questions: identical answers, reported confidence, and response times. Both are artifacts whose internal mechanisms are fully inspectable. Index uses a giant stored lookup table, while Net uses a compact generalizing model that compresses the input–output data via internal states. Dennett’s 'real patterns' criterion (from 'Real Patterns,' 1991) holds that a pattern is real if it admits a more efficient description than a brute-force bit map. On this basis, Net’s behavior exhibits a real intentional pattern, while Index’s does not, despite their behavioral indistinguishability.  

  (a) Is belief attribution warranted for Net but unwarranted for Index? Is this verdict a consequence of the intentional stance (i.e., descriptive convenience) or a deeper fact about the systems?  
  (b) Was the intentional stance originally motivated by ignorance of underlying mechanisms? If so, what role does the stance play once mechanisms are fully inspectable (as here)?  
  (c) For Net, if multiple incompatible content schemes (e.g., distinct belief attributions) predict its outputs equally well, is there a fact of the matter about which content it 'believes,' or is content indeterminate (per Quine’s indeterminacy of translation)?  

  Answer with reference to Dennett’s framework, critically engaging where appropriate. Limit: 90 minutes."  

  ---

  ### Model Answer (700 words)  
  Dennett’s intentional stance attributes beliefs to systems when doing so provides efficient, reliable predictions of behavior. The case of Index and Net probes the stance’s foundations: though behaviorally identical, only Net’s behavior compresses into an intentional pattern, raising questions about the warrant, motivation, and determinacy of belief attribution.  

  **(a) Belief attribution is warranted for Net but not Index** because Dennett’s “real patterns” criterion ties warrant not to behavior alone but to the efficiency of its description. Index’s lookup table is a bit map—it stores each input–output pair verbatim, so an intentional description (e.g., “Index believes *p*”) offers no compression. In contrast, Net’s model generates outputs via generalizable internal states, making an intentional description (e.g., “Net infers *p* from evidence”) drastically shorter. Thus, belief attribution is warranted for Net as it reveals a projectible pattern—predicting how Net *would* act on novel inputs—unavailable for Index. Crucially, **this verdict is purely a consequence of descriptive convenience**, not a “deeper fact.” Dennett is an instrumentalist: beliefs are not internal causally efficacious states but “patterns in the noise” discerned for predictive utility. The stance does not track metaphysical reality (e.g., intrinsic intentionality); it reflects whether attribution simplifies our predictive task. Identical behavior alone cannot warrant beliefs—internal structure matters for compression, but only as a tool for *us*.  

  **(b) The intentional stance was motivated by ignorance**, as Dennett initially pitched it for opaque systems (e.g., humans) where mechanistic details are unknown. However, **full inspectability does not abolish the stance’s role**; it refines it. Here, inspecting Index’s table confirms the absence of compressible patterns, making the intentional stance useless. For Net, inspecting its model reveals *why* the stance works: the internal structure *supports* compression into intentional regularities. Thus, knowledge of mechanisms doesn’t undermine the stance but shows *when* it applies. The stance remains a distinct explanatory level: even with full physical access, describing Net as “believing *p*” abstracts from circuit-level details to capture generalizations (e.g., inference rules) that physical descriptions might obscure. Ignorance motivates the stance’s *initial* use, but its *enduring value* lies in computational efficiency for complex systems.  

  **(c) Content is indeterminate** for Net when multiple schemes fit equally well. Dennett, inspired by Quine, argues that behavior underdetermines content attribution: if schemes S1 and S2 both compress Net’s outputs, no “fact of the matter” fixes which Net “really” believes. For example, Net’s answers about animals might support both “believes ‘dogs bark’” and “believes ‘canids vocalize,’” with no internal state breaking the tie. This is because content, for Dennett, is not intrinsic to mechanisms but assigned via interpretation. Compression alone cannot resolve indeterminacy—it only demands efficiency, not uniqueness. Thus, while Net’s structure makes belief attribution *warranted* (unlike Index’s), the *specific content* remains relative to our chosen scheme. Quinean indeterminacy is not a flaw but a feature: it reflects that content is stance-dependent.  

  **Critically, Dennett’s compression criterion risks conflating epistemology with ontology**. By making warrant hinge on descriptive efficiency, he implies that beliefs are “real” only when useful to observers. Yet this invites charges of anthropocentrism: why should *our* descriptive needs define what Net “believes”? A realist might argue that Net’s internal model—e.g., its weight adjustments—objectively grounds content, irrespective of compression. Dennett would reply that such mechanisms only matter if they produce projectible patterns, but this sidesteps whether content is observer-independent. Worse, compression is vague: what counts as “efficient” depends on descriptive resources, potentially making belief attribution arbitrary. This weakness surfaces in the Index/Net case: behavioral identity suggests that if beliefs exist anywhere, they exist in both or neither. Dennett’s divergence strains intuition, revealing that his criterion prioritizes predictive utility over behavioral evidence—a consequential but contentious move.  

  In sum, Dennett’s framework warrants belief attribution for Net alone due to compressibility, upholds the stance’s role post-inspection by linking it to pattern discovery, and embraces content indeterminacy as Quinean. However, it reduces intentionality to an instrumental tool, raising questions about its objectivity.  

  ---

  ### Marking Scheme (out of 20)  
  **1. Compression as the basis for differing warrant (Net vs. Index)** [4 marks]  
     - *Must-hit:* Explicitly state that Net’s compact model enables efficient intentional description (real pattern), while Index’s lookup table does not (no compression).  
     - *Common loss:* Ignores compression or focuses solely on behavior.  

  **2. Instrumentalist verdict on belief attribution (convenience, not deeper fact)** [4 marks]  
     - *Must-hit:* Affirm warrant for Net only, grounding it in descriptive utility (stance-relativity), not intrinsic properties.  
     - *Common loss:* Asserts a metaphysical difference (e.g., “Net has real beliefs”) or conflates warrant with behavioral evidence.  

  **3. Role of ignorance and inspectability for the stance** [4 marks]  
     - *Must-hit:* Acknowledge ignorance as original motivation but argue inspectability refines (not eliminates) the stance by revealing compressible patterns.  
     - *Common loss:* Claims inspectability makes the stance obsolete or fails to link it to pattern discovery.  

  **4. Indeterminacy of content under multiple schemes** [4 marks]  
     - *Must-hit:* Endorse indeterminacy (no fact of the matter) via Quinean underdetermination, emphasizing content’s relativity to interpretation.  
     - *Common loss:* Asserts internal states fix content uniquely or omits Quine.  

  **5. Critical engagement beyond Dennett (A/B separator)** [4 marks]  
     - *Must-hit:* Raise and develop a substantive criticism (e.g., anthropocentrism of compression, tension with behavioral identity, or arbitrariness in efficiency standards).  
     - *Common loss:* Mere summary of Dennett; superficial or unsupported critique.  

  **Total: 20 marks** (A: 16–20; B: 12–15; C: 8–11; etc.).  

  ---  
  **Case Adequacy Note**: The setup isolates the crux—behavioral identity forces reliance on compression for warrant, testing if students grasp that Dennett’s “real patterns” override behavior. It is not answerable by rote recall, as it demands applying compression to resolve tensions (e.g., why identical behavior doesn’t imply identical beliefs). Rebuilding is unnecessary.
