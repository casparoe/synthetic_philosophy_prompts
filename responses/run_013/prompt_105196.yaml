prompt: |-
  I host a little podcast on political philosophy and social choice — the audience is mostly grad students and the odd economist — and next week's guest works on the discursive dilemma, that setup where every member of a group is perfectly consistent on their own but the group's majority verdicts come out inconsistent. The old breach-and-damages case: a majority finds breach, a majority finds damages, so by the book a majority should find liability, and yet a majority votes "not liable" when you just ask them the bottom-line question. Her take, which is definately why I'm excited, is that the literature has been solving the wrong problem: she thinks the paradox only bites if you personify the group as a single reasoner with one belief set, and that once you give that up the real question is procedural — whether an aggregation rule tracks the reasons members actually voted on, not whether the group's outputs hang together as a whole. In the manuscript she's shopping around she defends what she calls a "reason-tracking" criterion and uses it to argue for premise-by-premise majority voting over voting straight on the conclusion, inconsistency be damned. I want the Q&A to actually corner her on this instead of letting her restate the thesis for the tenth time.

  So put on your social choice theorist hat and, before you write anything, brainstorm to yourself where her position is weakest and where it's actually strongest, then draft from that. I want at least one question pressing the epistemic side — whether premise-majority really tracks the truth about the conclusion, given that a majority can be right on every premise and still wrong on the conclusion, and what her criterion says about that; at least one on legitimacy, i.e. whether voting premise-by-premise imposes the majority's rationale on the minority, and whether that's a defect of the procedure or just what collective reasoning is; and at least one on whether a group can coherently "believe" a set of things that can't all be true together, or whether she's quietly changing the subject from belief to something weaker like acceptance or decision. Round it out with a few in the same vein — how manipulable premise-based rules are once members know the structure, what happens when the propositions form a longer chain rather than two premises and a conclusion, and whether her line makes deliberation pointless or merely reconceives it. Don't bother with citations, she'll know her own field.

  Give me the response in three named sections, in this order: "Warm-up" (two quick scene-setting questions, one line each); "The pressure" (six questions, each followed by a short "Follow-up:" line keyed to the answer she's most likely to give); and "The closer" (one question that forces her to say what would count as evidence against her criterion). Keep the whole thing to roughly a page.
reasoning: |-
  Okay, the user hosts a political philosophy podcast and wants sharp questions for a guest discussing the discursive dilemma. The guest's key argument is that premise-based majority voting is superior because it tracks members' reasons, even if it leads to inconsistent group outputs. 

  First, I need to identify weaknesses in her position. The epistemic angle seems vulnerable: if premise-majority can yield a wrong conclusion despite correct premises, how does "reason-tracking" justify overriding the conclusion-vote? This clashes with truth-seeking goals. Legitimacy is another weak spot – premise voting forces minority voters to accept rationales they reject, which feels coercive in collective reasoning. Ontologically, her dismissal of group belief seems slippery; if a group asserts contradictory propositions, calling it mere "acceptance" dodges the core inconsistency issue.

  Her strengths lie in procedural fairness – premise voting transparently reflects members' inputs – and practical applicability to complex decisions. But these don't resolve the fundamental tensions.

  For structure: Warm-up needs two quick scene-setters. "Pressure" section requires six questions with follow-ups anticipating replies. Epistemic: Truth-tracking failure → she'll likely say it's not about truth but reasons → follow-up pushes on whether reasons matter more than correct outcomes. Legitimacy: Imposing rationales → she may call it unavoidable → follow-up asks if this dissolves collective agency. Ontology: Contradictory beliefs → she'll distinguish belief from acceptance → follow-up forces her to define "acceptance" without collapsing into belief. 

  Other angles: Manipulation via strategic voting (follow-up: does this undermine reason-tracking?), long inference chains (follow-up: when does premise voting become unreliable?), and deliberation's role (follow-up: can deliberation fix the procedure's flaws?).

  Closer must demand falsifiability: what evidence would make her abandon reason-tracking? 

  Tight phrasing is crucial – every question must corner her without letting her restate the thesis. Podcast audience sophistication allows skipping citations.
answer: |-
  ### Warm-up  
  1.	Could you start by sketching why the "personification" critique matters more than fixing inconsistent group outputs?  
  2.	When you say "tracks reasons," what’s the minimal unit—individual premises, inferential links, or something else?  

  ### The Pressure  
  1.  **Epistemic:** If premise-majorities get every premise right but the conclusion wrong (e.g., due to overlooked dependencies), doesn’t your rule *systematically* disconnect "reason-tracking" from truth-tracking?  
      *Follow-up:* If she says truth isn’t the goal: Does this mean groups should prioritize procedural purity over getting correct outcomes?  

  2.  **Legitimacy:** Doesn’t premise-voting impose the *majority’s rationale* on dissenters? If I reject the logic linking premises to "liable," why must my vote on breach count toward an outcome I oppose?  
      *Follow-up:* If she says minorities consent by participating: Does this reduce collective reasoning to mere vote-tallying, stripping deliberation of meaning?  

  3.  **Ontology:** If the group asserts "breach," "damages," but "¬liable" (all via majority), isn’t it still *asserting contradictions*? Isn’t calling this "acceptance, not belief" just semantics?  
      *Follow-up:* If she distinguishes belief/acceptance: Can a group *rationally act* on such inconsistent acceptances without self-sabotage?  

  4.  **Manipulation:** Once members know the rule, won’t they vote strategically on premises to force their desired conclusion—making "reason-tracking" a veneer for agenda control?  
      *Follow-up:* If she says deliberation mitigates this: Doesn’t your framework make *sincere* premise-voting optional, undermining the rule’s core virtue?  

  5.  **Complexity:** For longer inferences (P1∧P2→P3→C), premise-majority can yield C even if *no one* endorses the full chain. Isn’t this reason-tracking at its most hollow?  
      *Follow-up:* If she bites the bullet: When does fragmenting votes cease being "democratic" and start being *epistemically reckless*?  

  6.  **Deliberation:** If we vote premises, why deliberate conclusions at all? Doesn’t your rule make deliberation redundant—or worse, misleading?  
      *Follow-up:* If she says deliberation shapes premise-judgments: But if members converge on C, shouldn’t the procedure reflect *that* consensus instead of overriding it?  

  ### The Closer  
  **Falsifiability:** You defend reason-tracking as the gold standard. What observable failure—say, rampant injustice or gridlock—would make you concede it’s the *wrong* criterion for designing aggregation rules?  

  ---

  **Rationale:**  
  - **Epistemic Q** targets the truth/reason gap head-on, forcing her to either defend error-proneness or admit truth matters.  
  - **Legitimacy Q** pressures the liberal objection: premise-voting can "hijack" minority inputs. Follow-up prevents retreat to proceduralism.  
  - **Ontology Q** challenges her dissolution of inconsistency. If groups "accept" contradictions, what binds that acceptance to rational agency?  
  - **Manipulation/Complexity Qs** test robustness. Premise-based rules are notoriously vulnerable to agenda-setting—and her criterion may not fix this.  
  - **Closer** demands stakes: If no empirical outcome could refute her criterion, it risks being unfalsifiable dogma.  
  *Total: ~380 words. Fits one page with concise delivery.*
