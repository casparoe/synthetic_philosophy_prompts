answer: |-
  The mind-brain/software-hardware analogy is a leaky vehicle for functionalist conclusions, importing computational assumptions that don't cleanly map to biology.  

  **Correspondence Table**  
  - *Program*: Functional organization of mental states (e.g., belief-desire psychology).  
  - *Machine*: Physical brain (or substrate).  
  - *Specification*: Abstract psychological theory (e.g., input-output mappings).  
  - *Compiler*: Developmental/learning processes (e.g., neural plasticity shaping functional architecture).  
  - *Program on two machines*: Multiple realizability (e.g., pain realized in human brains, octopus nervous systems, or silicon chips).  

  **Critical Disanalogies (Bearing on Functionalist Work)**  
  1. **Antecedent Specification**: Software functions are defined *before* implementation (e.g., "sort this list"). Mental functions lack a designer; they emerge from evolution/development without pre-specified goals. This undermines autonomy claims—psychology can't ignore neuroscience if mental "specs" aren't independently defined.  
  2. **Interpretive Boundary**: Hardware/software separation depends on *human conventions* (e.g., transistors "run" code only relative to our interpretation). No such convention-independent boundary exists for mind-brain; neural processes may intrinsically embody meaning, making psychology inseparable from implementation.  
  3. **Implementation Stability**: Software functions are substrate-invariant *by design* (e.g., Python sorts identically on Intel/ARM chips). Mental states depend on dynamic, context-sensitive neural interactions; changing substrates (e.g., carbon to silicon) may alter function unpredictably, weakening multiple realizability.  

  **Decorative Disanalogies**  
  - Software relies on formal syntax; mental states lack clear digital "code."  
  - Compilers are explicit programs; neural development isn’t rule-based translation.  
  - Debugging tools exist for software; no equivalents for "editing" mental states.  

  **Quietly Imported Features**  
  - *Artifact/Designer*: Software implies a creator. Minds lack a designer; functions are evolutionary byproducts. *No mind-brain counterpart*.  
  - *Antecedent Function*: Software behavior is defined pre-implementation. Mental functions co-evolve with implementation. *Counterpart absent*; cognition is shaped by real-time interaction.  
  - *Relative Boundary*: Hardware/software distinction is level-relative. Mind-brain boundaries may be absolute (e.g., intrinsic intentionality). *Counterpart contested*; emergence debates remain unresolved.  

  **Survival of Conclusions**  
  - *Multiple Realizability*: Survives weakly, but only as a *possibility*—not a given. Substrate constraints (e.g., temporal dynamics in neurons vs. silicon) may limit realizations.  
  - *Autonomy*: Collapses without the analogy. If mental functions aren’t cleanly separable from implementation (per disanalogies 1-3), psychology cannot ignore neuroscience.  

  **Superior Analogy**  
  Use **evolutionary adaptation**: Mind is to brain as beak shape is to genetics. Beaks serve functions (cracking nuts) multiply realizable (in finches, parrots), yet constrained by material (keratin), development, and ecology—allowing autonomy for functional biology but tethering it to genetics when constraints bite. This captures emergence, multiple realizability, and biology-dependence without computational baggage.
