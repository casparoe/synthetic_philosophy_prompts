  - Doesn't address systemic issues beyond classroom (e.g., poverty).  
  - Stakeholder involvement in handoff may be messy.  
  - Time-limited tests might not capture long-term effects.
answer: |-
  Below is a written procedure based on the Mencius–Xunzi dispute, designed as an ordered set of questions to classify behavioral targets and guide intervention design. It includes your specified tests (Presence, Obstacle, Maintenance, Generalization), accounts for environmental influence, incorporates a stopping rule for conventions, and mandates a handoff for constructed forms. Judgment calls are explicitly marked where evidence may be ambiguous or require interpretation. Each test includes:  
  - **Question**: What to ask/observe.  
  - **Sufficient Answer**: Evidence for an innate tendency (Mencian "sprout").  
  - **Fail**: Evidence for an absent tendency requiring construction (Xunzian "artifice").  
  - **Practical Test**: Classroom-friendly actions teachers can run and report in <10 minutes each.  

  All tests assume baseline environmental conditions (e.g., physical safety, basic needs met) and require observing the target population in natural settings. If any test is inconclusive, default to Xunzi (construction) until new evidence emerges—this prioritizes caution, as misdiagnosing a "wounded sprout" as "absent" risks irreversible damage.  

  ---

  ### **Procedure: Intervention Classification for Behavioral Targets**  
  **Purpose**: To determine whether a target behavior (e.g., helping, civility, honesty) is innate (damaged and requiring obstacle removal) or absent (requiring constructed form).  

  #### **Step 0: Stopping Rule for Conventions**  
  - **Question**: Is the behavior a pure convention? (e.g., corridor-walking side, phone storage, uniform rules).  
  - **Sufficient Answer for Stop**: Yes—it is arbitrary, culturally specific, and has no moral/developmental weight.  
  - **Action**: Enforce the convention uniformly. Do not use this procedure. Character education resources should not be allocated here.  
  - **Judgment Call**: Determining "convention" vs. "character" requires assessing cultural context. If unsure, proceed to Step 1.  

  #### **Step 1: Presence Test**  
  - **Question**: Has the target behavior *ever* been observed in this population without instruction, reward, or modeling?  
  - **Sufficient Answer**: Yes—documented in natural, low-stakes settings (e.g., unprompted helping during free time).  
  - **Fail**: No—never observed spontaneously, even in permissive environments.  
  - **Practical Test**: Teachers record unstructured time (e.g., recess, lunch, transitions) for 1 week. Note:  
    - *Count*: Instances of behavior occurring with no adult prompting or visible incentive.  
    - *Report*: "Presence confirmed" (≥1 clear incident) or "Absent" (no incidents).  
  - **Environmental Note**: If behavior is absent, it may be due to chronic environmental damage (e.g., trauma, deprivation)—do not assume "innate absence." Proceed to Step 2.  

  #### **Step 2: Obstacle Test**  
  - **Question**: If a plausible obstacle (e.g., time pressure, competition, threat, shame) is temporarily removed, does the behavior increase *without added instruction*?  
  - **Sufficient Answer**: Yes—behavior rises significantly (e.g., helping doubles when a competitive reward is paused).  
  - **Fail**: No—no change or decrease.  
  - **Practical Test**: Teachers identify one major obstacle (via student survey or observation). Then:  
    - *Run*: Remove obstacle for 2–3 short sessions (e.g., suspend a competitive rule for a 15-minute activity).  
    - *Measure*: Compare frequency of behavior during obstacle-free sessions vs. baseline.  
    - *Report*: "Obstacle-sensitive" (≥30% increase) or "Unaffected" (<30% change).  
  - **Judgment Call**: Selecting the "right" obstacle requires inference. If multiple obstacles exist, test the most salient.  

  #### **Step 3: Maintenance Test**  
  - **Question**: When external supports (e.g., rewards, prompts, praise) are withdrawn after brief training, does the behavior:  
    - (a) Collapse to near zero?  
    - (b) Stabilize at a lower but consistent level?  
  - **Sufficient Answer**: (b)—stabilizes, indicating an internalized tendency.  
  - **Fail**: (a)—collapses, indicating dependence on external structure.  
  - **Practical Test**: After a 1-week "boost" (minimal training, e.g., daily reminders), withdraw all supports for 1 week.  
    - *Measure*: Behavior frequency in final 3 days vs. baseline.  
    - *Report*: "Maintained" (≥50% of boost level) or "Collapsed" (<50%).  

  #### **Step 4: Generalization Test**  
  - **Question**: Does the behavior appear in novel, untrained contexts without prompting?  
  - **Sufficient Answer**: Yes—generalizes broadly (e.g., honesty in untested subjects).  
  - **Fail**: No—confined to trained settings.  
  - **Practical Test**: Teachers observe behavior in 2–3 contexts unrelated to training (e.g., if honesty was taught in tests, observe group work or hallway interactions).  
    - *Report*: "Generalized" (occurs in ≥1 new context) or "Context-bound" (absent in all).  

  #### **Classification & Intervention**  
  - **Innate Tendency (Mencius)**: If **≥3 tests pass** (Presence + any two others).  
    - **Design**: Remove obstacles (e.g., reduce competition, model non-interference). Do not add rewards or scripts—these may "smother" the sprout.  
  - **Absent Tendency (Xunzi)**: If **≥3 tests fail**.  
    - **Design**: Construct form via ritual, practice, and explicit modeling. Proceed to Handoff.  
  - **Inconclusive**: If 2–3 tests conflict. Default to Xunzi (construction) but re-test in 4–6 weeks.  

  #### **Handoff for Constructed Forms**  
  - **Trigger**: Absent tendency classification (Xunzi).  
  - **Reason**: The form has no natural authority; its design requires social legitimacy.  
  - **Action**: Route the form-design to a body with standing:  
    - Board/policy team (for school-wide norms),  
    - Parents (for home-linked behaviors), or  
    - Students (via democratic process, e.g., elected council).  
  - **Judgment Call**: Selecting the authorizing body depends on the behavior’s scope (e.g., cheating policies → board; chat norms → students).  

  #### **Diagnosing "Wounded Sprout" vs. "Absent"**  
  - **Key Question**: What licenses calling a missing behavior "wounded"?  
  - **Answer**: Only a **passing Presence Test** (Step 1). Without spontaneous emergence, there is no evidence of a "sprout" to wound. Environmental damage (e.g., poverty, fear) may suppress behavior, but if Presence fails, the tendency is likely absent—goodness must be built.  

  ---

  ### **Case Applications**  
  *Assumptions: Tests run by teachers; populations are typical urban school cohorts; environmental factors (e.g., competitive culture) noted.*  

  #### **Case 1: Spontaneous Helping (11-year-olds, competitive school)**  
  - **Stopping Rule**: Helping is non-arbitrary; proceed.  
  - **Presence Test**: *Likely pass*. Teachers report unprompted helping during free play (e.g., sharing pencils, comforting peers).  
  - **Obstacle Test**: Remove time pressure/competition (e.g., unstructured cooperative activity). Helping increases 40% with no instruction. **Pass**.  
  - **Maintenance Test**: After a "boost" (brief praise), helping stabilizes at 20% above baseline when praise stops. **Pass**.  
  - **Generalization Test**: Helping observed in new contexts (e.g., cafeteria). **Pass**.  
  - **Classification**: **Innate (Mencius)**. The competitive environment is damaging the tendency.  
  - **Intervention Design**: Remove obstacles—e.g., reduce scheduled demands, add collaborative tasks. *Do not use points/prizes*: rewards would make helping contingent, eroding intrinsic motivation (as you suspected).  
  - **Your Instinct (points/prizes)**: Procedure rejects it—rewards are "artifice" for absent tendencies, damaging here.  

  #### **Case 2: Civility in Group Chats (e.g., classroom Discord/Slack)**  
  - **Stopping Rule**: Civility norms are non-arbitrary; proceed.  
  - **Presence Test**: *Fail*. No spontaneous civility in chats—cruelty dominates without moderation.  
  - **Obstacle Test**: Remove anonymity (e.g., real-name policy). Civility unchanged; hostility persists. **Fail**.  
  - **Maintenance Test**: After a "boost" (moderator prompts), civility collapses when support is withdrawn. **Fail**.  
  - **Generalization Test**: Civility does not generalize (e.g., same students are civil face-to-face but not online). **Fail**.  
  - **Classification**: **Absent (Xunzi)**. The digital venue lacks inherent norms; civility must be constructed.  
  - **Handoff**: Norms are arbitrary (e.g., emoji use, tone rules). Route form-design to **board** (for authority) + students (for buy-in).  
  - **Intervention Design**: *Stop empathy workshops* (insufficient for construction). Build: rehearsed scripts (e.g., "I disagree, but..."), adult modeling, visible consequences.  
  - **Your Suspicions Confirmed**: Venue is too new/anonymous for innate "shape"; structure is needed.  

  #### **Case 3: Honesty (High-stakes testing culture, cheating rising)**  
  - **Stopping Rule**: Honesty is non-arbitrary; proceed.  
  - **Presence Test**: *Inconclusive*. Mixed reports: cheating rare in low-stakes quizzes but rampant in exams.  
  - **Obstacle Test**: Reduce stakes (e.g., ungraded practice test). Honesty rises 35% in practice vs. high-stakes. **Pass** (suggests damage).  
  - **Maintenance Test**: After a "boost" (honesty pledge), honesty collapses when pledge is removed. **Fail** (suggests absence).  
  - **Generalization Test**: Honesty generalizes to non-test contexts (e.g., admitting mistakes). **Pass**.  
  - **Classification**: **Inconclusive** (2 passes, 1 fail, 1 mixed). Tie between "wounded sprout" (Obstacle/Generalization pass) and "absent" (Maintenance fail).  
  - **Tiebreaker**: Re-test Presence in low-pressure environments (e.g., peer feedback sessions). If honesty appears spontaneously, it is "wounded"; if not, "absent."  
  - **Intervention**: Default to **Xunzi (construction)** while gathering new evidence. Design: ritualized practice (e.g., daily integrity reflections) + teacher modeling.  
  - **Your Expectation**: Procedure refuses to decide—evidence is conflicting. It forces you to either:  
    - (a) Reduce testing stakes (to "heal" a sprout), which you may dislike, or  
    - (b) Accept construction, which feels artificial.  
    - **Breaking the Tie**: Observe low-stakes, non-academic scenarios (e.g., games with honesty opportunities). If honesty appears, design obstacle removal (Mencius). If absent, proceed with construction (Xunzi) and handoff to board for ethical authority.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve the Mencius–Xunzi Debate**: It operationalizes the dispute but cannot prove who was "right." Human nature may be mixed; this is a heuristic.  
  2. **Eliminate Judgment**: Environmental interpretation (Step 0), obstacle selection (Step 2), and handoff routing require contextual wisdom.  
  3. **Guarantee Success**: It classifies tendencies but cannot control implementation (e.g., teacher consistency) or external factors (e.g., community violence).  
  4. **Replace Deep Assessment**: For complex behaviors (e.g., trauma-related), use this as a screening tool—not a replacement for psychological evaluation.  
  5. **Address Structural Injustice**: While environment is acknowledged, systemic inequities (e.g., racism, poverty) may require broader action beyond classroom tests.  

  This procedure sharpens your "blended" explanations by forcing empirical distinctions. When programs underperform, you can now show: damage (Mencius) demands environmental repair; absence (Xunzi) demands ethical construction; and conventions demand simplicity, not moralizing.
