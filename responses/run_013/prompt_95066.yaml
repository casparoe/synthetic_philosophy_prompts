  Hmm, the user is in charge of student support and character education for a mid-sized urban school district. They design social-emotional and character programs that impact thousands of students and teachers with limited time and training. When programs underperform, they face pressure to determine if the design was flawed or if the children were the problem. Their honest answer is usually a mix of both, and they want to stop that ambiguity.

  The user has identified the Mencius-Xunzi debate as a framework to clarify whether a behavior is innate (Mencius) or needs to be constructed (Xunzi). They want a practical procedure based on this distinction to decide interventions: removing obstacles or imposing structure. The procedure must include specific tests: presence, obstacle, maintenance, generalization. They also want it to address environmental factors, have a stopping rule for conventions, and a handoff for arbitrary norms. Plus, they need three case studies analyzed.

  Breaking down the user's requirements:  
  - **Presence Test**: Has the behavior ever appeared without teaching?  
  - **Obstacle Test**: Does removing an obstacle increase the behavior without instruction?  
  - **Maintenance Test**: After support withdrawal, does the behavior stabilize or disappear?  
  - **Generalization Test**: Does it appear in untrained contexts?  
  - **Environmental Context**: Acknowledge that environment affects both views; clarify how to distinguish a "wounded sprout" from an absent tendency.  
  - **Stopping Rule**: For purely conventional behaviors, skip the nature debate and enforce the rule.  
  - **Handoff**: If the behavior needs to be imposed, delegate the form's authority to stakeholders (board, parents, students).  

  The user also wants judgment calls highlighted, not hidden. Then, three cases:  
  1. **Spontaneous Helping**: In a competitive school, considering a points-and-prizes system. User suspects rewards might erode intrinsic motivation.  
  2. **Civility in Group Chats**: Considering an empathy workshop, but user thinks the anonymous venue lacks inherent norms, so a structured approach is needed, authorized by the board.  
  3. **Honesty in High-Stakes Testing**: Cheating is rising; user expects the procedure to force an uncomfortable decision or reveal insufficient evidence.  

  For the procedure design:  
  - **Structure**: Ordered questions with clear pass/fail criteria.  
  - **Practicality**: Tests must be classroom-friendly, not thought experiments.  
  - **Outputs**: For each test, define what constitutes a sufficient answer (evidence for innate tendency) or a fail (evidence for needing construction).  

  Key philosophical points to embed:  
  - Mencius: Nature is the potential for goodness; obstacles damage it.  
  - Xunzi: Nature is raw material; goodness is constructed through ritual and practice.  
  - Both agree environment matters, so bad outcomes aren't proof of inherent flaws.  

  For the "wounded sprout" vs. "absent" question: This hinges on whether the behavior was ever observed (presence test) and if removing obstacles revives it (obstacle test). If no evidence of prior presence, it's likely absent.  

  Stopping Rule: For conventions (e.g., corridor side, phone rules), skip tests and enforce. Handoff: If construction is needed, route form-design to stakeholders to avoid personal bias.  

  Now, applying to the cases:  
  - **Case 1 (Helping)**:  
    - Presence Test: Likely pass (kids help spontaneously sometimes).  
    - Obstacle Test: Reduce time pressure/competition; if helping increases, it's innate.  
