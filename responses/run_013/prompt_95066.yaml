    - Empathy workshop insufficient; need modeled/rehearsed systems.  

  - **Case 3 (Honesty)**:  
    - Presence Test: Maybe mixed (some honesty in low-stakes settings?).  
    - Obstacle Test: Reduce stakes; if honesty rises, sprout is wounded.  
    - If no change, it might be absent or evidence inconclusive.  
