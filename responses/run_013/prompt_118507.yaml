  For holism, Billy's stammer and Claggart's malice are reasons that would exonerate him in a different context. Vere dismisses these, seeing only the mutiny risk. This seems to support holism—context alters moral reasons. But Vere's role as captain forces him to prioritize rules over context, which might argue for generalism, especially the idea that principles are necessary in institutional roles.

