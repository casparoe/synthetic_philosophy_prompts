prompt: |-
  So my friend Dara is in a cog-sci reading group and came out with this argument and I honestly can't tell if it's clever or if it's one of those things that just proves way too much. Here's how they put it:

  (1) Saying one thing is more intelligent than another just means it does better on the tasks that matter.
  (2) Which tasks matter is fixed by a task distribution, and any distribution is ultimately just something we picked.
  (3) For any two systems A and B there's a distribution where A wins and a distribution where B wins. Like, take a raccoon that raids bins and a weather-forecasting model: score them on "extracting calories from a city" and the raccoon wins, score them on "predicting tomorrow's rain" and the model wins. And more generally, for basically anything a system actually does, we can always cook up some task that rewards exactly that.
  (4) So there's no distribution-independent fact about which of them is more intelligent.
  (5) A comparison you can flip just by freely choosing the distribution isn't tracking a real difference in the things being compared.
  (6) Therefore "more intelligent" is never actually true of anything — the ranking is entirely in the eye of whoever's keeping score.

  I think (6) is nuts, but when I go through it line by line every step looks ok to me. So which step do I give up, and what does giving it up cost me? I'm also curious whether the same move would take out "fitter" or "faster" too, or if intelligence is special somehow.

  Give it to me as exactly five numbered points, a sentence or two each, no intro or outro. Make the first one the step you think I should ditch, and use the rest for why that step looked fine and what the other choices would cost.
reasoning: |-
  Hmm, the user is presenting a philosophical argument about intelligence from their friend Dara in a cog-sci reading group. They're struggling to identify flaws in it despite finding the conclusion absurd. The argument claims "more intelligent" is entirely subjective because we can always choose task distributions to favor either system. 

  Breaking down the argument: Premise (1) defines intelligence as task performance. (2) says task importance is arbitrary. (3) argues we can always construct tasks favoring either system. (4) concludes no objective comparison exists. (5) rejects such comparisons as unreal. (6) declares intelligence rankings purely subjective.

  The user wants exactly five numbered points: first identifying which premise to reject, then explaining why it seemed plausible, followed by consequences of rejecting other premises. They're also curious if this applies to concepts like fitness or speed.

  The core flaw is in premise (3). While we can construct niche tasks favoring specific systems, this ignores that intelligence comparisons rely on broad-scope tasks that reveal general cognitive capabilities. The raccoon/meteorology model example proves too much - by that logic, a calculator could "outsmart" a human on arithmetic tasks, which misses what we mean by intelligence holistically.

  Rejecting (3) preserves meaningful intelligence comparisons while acknowledging context-dependence. Alternative rejections would be worse: Denying (1) forces an alternative definition of intelligence; rejecting (2) implies task importance is non-arbitrary (questionable); denying (4) or (5) would require accepting either that distributions are irrelevant (absurd) or that arbitrary comparisons track reality (untenable).

  Regarding "fitter" or "faster": Evolutionary fitness is environment-relative but still objective within contexts, similar to intelligence. Speed is less vulnerable since it has clearer physical metrics. Intelligence's multidimensionality makes it uniquely prone to this paradox, but not uniquely subjective.
answer: |-
  1.  **Reject (3): The claim that for *any* two systems, we can *always* cook up a task distribution favoring either is false for meaningful intelligence comparisons.** While possible for niche abilities, intelligence comparisons typically rely on distributions reflecting *broad* cognitive demands (learning, reasoning, generalization) where humans or advanced AI consistently outperform raccoons or simple calculators.
  2.  **(3) seemed plausible** because focusing on *maximally specific* tasks (like bin-raiding) does let you cherry-pick winners, but this ignores that intelligence assessments use *broader* distributions precisely to avoid this and capture general capability.
  3.  **Rejecting (1) costs coherence:** Denying that intelligence relates to performance on relevant tasks forces an alternative, likely vague or circular, definition of intelligence itself.
  4.  **Rejecting (2) costs plausibility:** Claiming some *objective, universal* task distribution exists for intelligence is highly dubious and ignores the context-dependence of what "matters."
  5.  **"Fitter" and "faster" survive similarly:** "Fitter" is inherently environment-relative like intelligence scoring, but within a *given* environment, it's objective. "Faster" relies on a defined metric (distance/time), avoiding arbitrary distribution choice; intelligence lacks a single, uncontested metric.
