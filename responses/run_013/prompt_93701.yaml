  Give me your credence that secular cycles are a real dynamical feature of the historical process rather than an artifact of how the data are smoothed, and lead with that number in your first sentence; then give the decomposition, with no preamble and no restating of the question. Take the target proposition to be: in the agrarian state systems to which the structural-demographic programme (associated with Peter Turchin) has been applied, population, elite numbers, and state capacity undergo self-sustaining oscillations with a period of roughly two to three centuries, generated endogenously by the feedback among those variables, rather than exhibiting a trend plus noise that a detrending or averaging procedure merely renders periodic. Decompose your credence into at least: (i) the probability that the cycles survive the deflationary objection that smoothing, averaging, or detrending almost any long series — random or not — tends to manufacture apparent periodicity; (ii) the probability that, conditional on there being real periodicity, the causal engine is the internal elite-overproduction and fiscal-immiseration feedback rather than an exogenous recurrence such as climate, epidemic, or external conquest; (iii) the probability that the pattern replicates in regions and periods that were not used to construct the theory, as opposed to being fit to the cases that motivated it; and (iv) the probability that the same mechanism carries over to post-industrial societies, which is where most of the contemporary stake lies. Assign a number to each term, say how they combine into the headline figure, and tell me which term that headline number is most sensitive to and what single piece of evidence or argument would move it most. My own credence sits around 0.35; tell me where you would part company with me, and why.
