prompt: |-
  I'm in a reading group on welfare economics and we keep banging into the same wall: everyone wants to aggregate or compare how well off different people are, and nobody can say what would make one such comparison *correct* rather than just a convention we've settled on. Before we read another paper I want a proper spec for the thing we're actually arguing about. So: write out the desiderata that any theory of interpersonal utility comparison has to meet to count as adequate. I want the full checklist -- the cases it has to get right (two people in very different circumstances, a judgement of who's worse off overall, the weird special case of comparing one person to themselves across time as a kind of fixed point, comparisons spanning different kinds of good like health vs money vs freedom, and the everyday comparisons the cost-benefit and QALY people actually make whether or not philosophers approve), the distinctions it can't collapse (ordinal vs cardinal vs ratio, comparing levels vs comparing gains, the difference between a comparison being vague and it being empty, the zero-point/neutrality problem), and the results it has to stay consistent with (whatever it is that makes some comparisons strike us as obviously true and others as obviously silly). Behind each requirement, put the case or consideration that motivates it, and tell me which of these are genuine desiderata and which are just the prejudice of one camp -- the econometric convention that comparison needs a single common unit, say, or the opposing view that with no common unit comparison is meaningless.

  The part I actually care about: flag any pair or subset of these desiderata you think can't be jointly satisfied, and say why. I have a suspicion that the demand for determinate, action-guiding comparisons is in tension with something like respect for first-person authority over one's own good, or with taking incommensurability seriously, but I'd rather you tell me which ones actually conflict than just agree with me. And if one requirement does more than any other to knock out the popular theories -- hedonic, preference-satisfaction, objective-list, and the various extended-preference and hybrid compromises -- say which one it is and what it kills. A table for the requirements is fine, but keep the weight on the requirements and their motivating cases rather than on scoring the contenders; I'll do the scoring with the group. Assume I already know the standard views, so don't spend space explaining them.
reasoning: |-
  Okay, the user is part of a reading group on welfare economics struggling with interpersonal utility comparisons. They want a comprehensive checklist of desiderata for any adequate theory, including motivating cases, distinctions to preserve, and consistency requirements. They also want to know which desiderata conflict and which requirement is most problematic for existing theories.

  First, I need to parse their request carefully. They mentioned several key elements: cases the theory must handle (different circumstances, self-comparisons over time, different goods), distinctions to maintain (ordinal vs cardinal, levels vs gains), and results to align with (intuitive judgments). They're particularly interested in conflicts between desiderata and which requirement disqualifies popular theories.

  I recall major theories like hedonic, preference-satisfaction, objective-list, and hybrids. The user knows these, so no need to explain them. Instead, focus on why they fail certain criteria. The neutrality/zero-point problem seems crucial here—it challenges both preference-based and hedonic theories.

  The user suspects tensions between determinacy and first-person authority. That's valid. For example, requiring precise comparisons (D1) might clash with respecting first-person reports (D6), especially if someone's preferences seem self-destructive. Also, incommensurability (D4) could make determinate comparisons impossible in some cases.

  The neutrality problem (D9) stands out as a major killer. Most theories stumble here. Preference-satisfaction lacks a natural zero; hedonism's neutrality point is vague. Objective lists struggle to define neutrality across domains. This might be the core issue.

  I should structure the checklist clearly. Group desiderata into sections: cases, distinctions, consistency. For each, state the requirement, why it matters, and if it's a genuine need or a bias. Then highlight conflicts, especially D1 vs D6/D4, and D9's broad impact.

  The user's deeper need is likely clarity for their group's debates. By flagging conflicts upfront, they can avoid talking past each other. Emphasizing D9's role helps them see why theories fail. Noting which desiderata are contentious (like D5's common unit) prevents false assumptions of universal agreement.
answer: |-
  Here’s a rigorous checklist of desiderata for interpersonal utility comparisons (IUCs), structured around your requirements. **Bold headers** denote the requirement, *italics* indicate the motivating case/consideration, and "GENUINE" or "CONTENTIOUS" flags whether it’s widely accepted or debated. Conflicts are flagged at the end.

  ---

  ### **I. Core Cases Any Theory Must Handle**
  1. **D1: Cross-Circumstance Comparisons**  
     *Motivation:* Comparing a healthy pauper and a chronically ill billionaire.  
     *Status:* GENUINE (tests if the theory captures *overall* well-being, not just income/health).

  2. **D2: Self-Comparisons Over Time as Anchor**  
     *Motivation:* "Is Person A now better off than Person A was 10 years ago?" as a fixed-point reference.  
     *Status:* GENUINE (grounds comparisons in first-person assessments; avoids relativism).

  3. **D3: Multi-Dimensional Trade-offs**  
     *Motivation:* Judging whether losing health for monetary gain improves well-being.  
     *Status:* GENUINE (welfare is multi-attribute; must handle health vs. freedom vs. income).

  4. **D4: Everyday Policy Judgments**  
     *Motivation:* QALY calculations in healthcare or cost-benefit analysis for infrastructure.  
     *Status:* GENUINE (theories must engage real-world applications, not just philosophy).

  ---

  ### **II. Critical Distinctions to Preserve**
  5. **D5: Ordinal vs. Cardinal vs. Ratio Scales**  
     *Motivation:* Policy needs cardinality (for aggregation), but ordinalism denies it; ratio scales require a non-arbitrary zero.  
     *Status:* GENUINE (scale type affects which comparisons are meaningful).  
     *Contention:* Economists often demand cardinality; philosophers question its possibility.

  6. **D6: Levels vs. Gains**  
     *Motivation:* "Is A *better off* than B?" vs. "Would $1000 help A *more* than B?"  
     *Status:* GENUINE (policies often target welfare *gains*; theories conflating these fail).

  7. **D7: Vagueness vs. Emptiness**  
     *Motivation:* "A is clearly worse off than B" (vague but meaningful) vs. "All comparisons are nonsense" (emptiness).  
     *Status:* GENUINE (rejects false dichotomies; allows for partial comparability).

  8. **D8: Interpersonal vs. Intrapersonal Trade-offs**  
     *Motivation:* Sacrificing one person’s health for another’s gain requires stronger justification than intrapersonal trade-offs.  
     *Status:* GENUINE (ethical weight of IUCs differs from personal compromises).

  ---

  ### **III. Consistency & Normative Constraints**
  9. **D9: Zero-Point/Neutrality**  
     *Motivation:* Distinguishing "good" from "bad" states (e.g., life worth living vs. not).  
     *Status:* GENUINE (required for ratio scales/Pareto judgments).  
     ***Major Theory-Killer***: Most theories fail here.  
     - Hedonic: Defining "neutral" hedonic tone is arbitrary.  
     - Preference-Satisfaction: No natural zero (death? frustrated desires?).  
     - Objective List: Which goods define neutrality?  

  10. **D10: Respect First-Person Authority**  
      *Motivation:* If A says "I’m suffering," dismissing this violates autonomy.  
      *Status:* GENUINE (but qualified; e.g., adaptive preferences complicate this).  

  11. **D11: Accommodate Incommensurability**  
      *Motivation:* Health vs. freedom trade-offs may lack a common measure without residue.  
      *Status:* GENUINE (denial leads to oversimplification).  

  12. **D12: Match Intuitive Verdicts**  
      *Motivation:* "Starving child is worse off than comfortable adult" must be true.  
      *Status:* GENUINE (theories rejecting obvious truths lose plausibility).  

  ---

  ### **IV. Contentious but Common Demands**
  13. **D13: Single Common Unit (e.g., "utils")**  
      *Motivation:* Required for aggregation in CBA or utilitarianism.  
      *Status:* CONTENTIOUS (economist’s prejudice; may conflate measurability with commensurability).  

  14. **D14: Full Determinacy**  
      *Motivation:* Policy demands actionable comparisons.  
      *Status:* CONTENTIOUS (in tension with D7/D11; may require false precision).  

  ---

  ### **Key Conflicts Between Desiderata**
  | **Conflict**                          | **Why Incompatible**                                                                 |
  |---------------------------------------|--------------------------------------------------------------------------------------|
  | **D1 (Cross-Circumstance) + D14 (Determinacy)** | Radically different lives (e.g., monk vs. CEO) resist precise comparison without oversimplification. |
  | **D2 (Self-Anchor) + D13 (Common Unit)**       | Intrapersonal comparisons use personal scales; interpersonal comparisons require universal unit, risking paternalism. |
  | **D6 (Levels vs. Gains) + D10 (First-Person)** | Gains often inferred from behavior; levels rely on self-report. Tension when preferences change (e.g., addiction). |
  | **D10 (First-Person) + D12 (Intuitive Verdicts)** | Adaptive preferences (e.g., oppressed person reporting contentment) force choice between respecting self-assessment or external judgment. |
  | **D11 (Incommensurability) + D14 (Determinacy)** | If goods are incommensurable, some comparisons *must* be indeterminate. Forcing determinacy denies this. |

  ---

  ### **The Major Theory-Killer: Neutrality (D9)**
  - **Why it’s fatal**: Welfare theories need a non-arbitrary baseline to make ratio-scaled comparisons (e.g., "A suffers twice as much as B").  
  - **Hedonic**: What is "neutral" pleasure? A brain state? Unmeasurable.  
  - **Preference-Satisfaction**: Is neutrality preference-satisfaction = 0? But desires vary in intensity and scope.  
  - **Objective List**: Neutrality requires threshold satisfaction for *all* goods? Arbitrary.  
  - **Hybrids**: Inherit problems of components; e.g., "informed preferences" still lack a zero.  

  **Result**: Most theories reduce neutrality to convention (e.g., "zero = average utility"), violating D9’s demand for non-arbitrariness.

  ---

  ### **Recommendation for Your Group**
  Focus discussions on **D9 (Neutrality)** and the **D10/D12 conflict** (first-person vs. objective verdicts). These expose the deepest fractures:  
  - Can a theory define a non-arbitrary zero?  
  - When (if ever) can we override self-assessments?  

  This cuts through "preference vs. objective good" debates and reveals why IUCs remain philosophical quicksand. For next readings, prioritize papers addressing neutrality (e.g., Griffin on prudential values) or adaptive preferences (e.g., Nussbaum/Sen).
