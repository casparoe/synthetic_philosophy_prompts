answer: |-
  ## Fellowship Proposal: Superrationality Under Asymmetric Transformations  

  **Research Question:**  
  *Under what precise conditions of asymmetry (in payoffs, actions, or information) does the superrational recommendation to cooperate in a one-shot Prisoner’s Dilemma (PD) remain rationally obligatory for agents who know they share identical reasoning processes?*  

  ### The Problem: Asymmetry’s Erosion of Superrationality  
  Superrationality (Hofstadter) proposes that two perfectly identical rational agents, aware of their identical reasoning, should cooperate in a one-shot PD because each deduces the other will reach the same conclusion. This framework collapses when games are asymmetric—players face different payoffs, action sets, or information states. Existing responses are unsatisfactory:  
  1. **Shared Program Assumption:** Assumes players execute identical algorithms, reducing agency to mechanistic determinism and sidestepping rational justification.  
  2. **Team Reasoning:** Shifts focus to collective goals, abandoning individual rationality—the core of superrationality.  
  3. **Symmetric-Game Restriction:** Avoids the problem entirely, ignoring real-world asymmetries.  
  Critically, these approaches fail to isolate *which features of symmetry* (e.g., invariance under player exchange) enable superrational cooperation. My hypothesis, grounded in symmetry principles from natural science, is that **invariance under a transformation exchanging players’ decision problems** is the keystone. When this invariance breaks (e.g., Player A’s "defect" payoff ≠ Player B’s), superrationality’s coherence is threatened. The central philosophical puzzle: *Does partial symmetry sustain a weakened obligation to cooperate, or does superrationality disintegrate entirely?*  

  ### Gap in Existing Scholarship  
  Current work fails to:  
  - Systematically classify *types* of asymmetry (payoff disparities, action-set mismatches, informational imbalances).  
  - Specify *thresholds* at which asymmetry invalidates shared reasoning.  
  - Explain *why* symmetry enables superrationality—is it the players’ identity, the game’s structure, or the reasoning process itself?  
  Without a formal account of transformation invariance, superrationality remains an intuitive heuristic for edge cases, not a general principle of rational choice.  

  ### Methodology: A Three-Pronged Approach  
  1. **Taxonomy of Asymmetries:**  
     - Define asymmetry parameters: payoff ratios, action-set cardinality, information partitions.  
     - Develop a hierarchy of transformations (e.g., exact isomorphism → approximate symmetry → radical asymmetry).  

  2. **Formal Modeling of Partial Symmetry:**  
     - Adapt group-theoretic symmetry tools to game theory.  
     - Construct asymmetric PD variants where players know their reasoning is identical but face non-isomorphic decision problems.  
     - Test viability of "cooperation" under weakened conditions (e.g., invariant *ratios* of payoffs, topological similarity of choice sets).  

  3. **Normative Analysis:**  
     - Interrogate whether rational obligation persists when:  
       - (a) Players’ *reasoning processes* are symmetric, but *games* are not.  
       - (b) Games share *local symmetries* (e.g., identical dominant strategies) but global asymmetry.  
     - Contrast superrationality with causal decision theory, evidential reasoning, and team agency.  

  ### Work Plan (12 Months)  
  - **Months 1–3:** Groundwork – Formalize asymmetry typology; identify critical game-theoretic cases (e.g., asymmetric payoffs with invariant risk/reward ratios).  
  - **Months 4–6:** Modeling – Develop transformations for "partially symmetric" games; derive conditions where superrational cooperation remains uniquely rational.  
  - **Months 7–9:** Philosophical Synthesis – Analyze normative implications; test robustness against counterarguments (e.g., bargaining in asymmetry).  
  - **Months 10–12:** Drafting – Synthesize results into a monograph chapter; outline implications for collective rationality.  

  ### Expected Outcomes & Success Metrics  
  - **Success:** A formal criterion specifying when superrational cooperation is rationally compelling in asymmetric games (e.g., "if the game admits a ε-isomorphism under payoff scaling, cooperation remains obligatory").  
  - **Negative Result:** Demonstrating that superrationality *cannot* extend beyond symmetric games without collapsing into team reasoning or program-sharing.  
  - **Failure Conditions:** Inability to isolate necessary/sufficient conditions for invariance; ambiguity in defining "identical reasoning" under asymmetry.  

  ### Candid Ambition Assessment  
  This project is ambitious but feasible in one year. **Risks** include:  
  - Mathematical complexity in defining "approximate" game symmetries.  
  - Philosophical indeterminacy in tying rationality to invariance.  
  **Mitigations:**  
  - Leverage tractable subproblems (e.g., focusing first on payoff asymmetry with symmetric actions).  
  - Accept partial results (e.g., "Cooperation fails under *this* class of asymmetry") as valuable.  
  The core insight—that invariance under exchange transformations is pivotal—provides a clear focal point. Success in clarifying the *boundaries* of superrationality, even without full generalization, would resolve a persistent ambiguity in the literature.  

  ### Significance  
  This work bridges analytic philosophy and formal decision theory using symmetry principles from natural science. By pinpointing why superrationality fragments under asymmetry, it clarifies the foundations of rational cooperation—with implications for ethics (moral reciprocity in unequal contexts) and AI (coordinating heterogeneous agents). The project offers a model for importing scientific rigor into philosophical problems of agency.  

  ---  
  **Proposal Length:** ~850 words (fits two pages single-spaced).  
  **Key Strengths:** Clear question, testable hypothesis, structured methodology, defined outcomes, and honest scope assessment.  
  **Next Steps:** I will integrate citations (e.g., Hofstadter, Binmore, Bacharach) and refine formalisms in the full proposal.
