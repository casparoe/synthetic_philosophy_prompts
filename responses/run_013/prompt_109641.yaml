answer: |-
  Here's a breakdown of a *Memento*-focused reading through the Extended Mind Thesis (EMT), addressing your specific concerns about authorship, trust, the film's structure, and the will/memory distinction, tailored for your seminar:

  **Core EMT Framework & Memento's Challenge:**
  Clark & Chalmers (C&C) argue that external resources can be constitutive parts of a cognitive process (like belief or memory) if they function *just like* reliable internal processes. Otto's notebook meets their conditions:
  1.  **Constant Availability:** Otto always has the notebook.
  2.  **Automatic Endorsement:** Otto doesn't critically question the notebook's contents; he trusts them implicitly as his own beliefs.
  3.  **Past Endorsement:** The contents were (presumably) placed there by Otto himself in a reliable state.
  4.  **Accessibility:** The information is easily accessible.
  5.  **Reliability:** The notebook *is* reliably updated and accurate.

  **Leonard's System: The Textbook Case... Gone Wrong:**
  Leonard's tattoos, Polaroids, and notes *seem* like the perfect EMT example – an external system compensating for biological memory failure. However, the film systematically violates C&C's idealized conditions:

  1.  **Authored ≠ Endorsed (Past or Present):**
      *   **Problem:** While Leonard authors the notes, the "past self" writing them is often operating under flawed reasoning, emotional distress, or deliberate deception. The *future self* (the Leonard encountering the note) did not endorse the *process* or *specific content* of its creation at the time of writing. Past Leonard is a stranger.
      *   **EMT Challenge:** C&C's "Past Endorsement" assumes a stable, reliable self over time. Leonard's amnesia shatters this continuity. Can a note written by a past self *you don't remember being* truly count as *your* belief? Is the authoring "self" the same cognitive agent? This highlights EMT's often-unexamined assumption of a unified, continuous self.

  2.  **Untrustworthy & Non-Automatic Endorsement:**
      *   **Problem:** Leonard *knows* his system is fallible and manipulable (by others *and* himself). He constantly questions the notes ("Don't believe his lies"). The Teddy arc is the ultimate violation: Leonard *deliberately* authors notes (the "Fact" tattoos, the license plate) to deceive his future self into killing Teddy.
      *   **EMT Challenge:** This directly contradicts **Automatic Endorsement**. Leonard's interaction with his external "memory" is characterized by *distrust*, *interpretation*, and *critical evaluation* – the *opposite* of Otto's automatic reliance. His system requires constant cognitive labor to assess reliability, making it feel more like consulting an unreliable external source (delegation/colonization) than accessing an integral part of his own mind (extension). Where does cognition *end* and skeptical interpretation *begin*?

  3.  **Contested Reliability & Availability:**
      *   **Problem:** Notes get lost (John G.'s license plate), destroyed (polaroids), altered, or are based on faulty premises from the start. Teddy and Natalie actively manipulate the system.
      *   **EMT Challenge:** This violates **Reliability** and, situationally, **Constant Availability** and **Accessibility**. If the external resource is unreliable and contested, can it truly *be* part of the cognitive system, or is it merely an input that the biological brain must *process* skeptically?

  **The Reverse Chronology: The Film as Epistemic Scaffold & Formal Argument:**
  This is where *Memento* offers something unique that pure philosophy struggles with:

  1.  **Manufactured Anterograde Amnesia:** The reverse structure forces the *viewer* into Leonard's epistemic position. We experience:
      *   **Disorientation:** Starting with an effect (killing Teddy) without knowing the cause.
      *   **Scaffolded Revelation:** Each scene provides a fragment of "memory" (the immediate past) that recontextualizes what we just saw, functioning *exactly* like Leonard's notes/Polaroids for *us*.
      *   **Trust Issues:** We are conditioned to question the information presented in each new scene, mirroring Leonard's distrust of his own notes. Is this character lying? Is this memory manipulated? (e.g., Sammy Jankis flashbacks).
      *   **Formal Argument:** The film *demonstrates* the necessity and function of external scaffolding for cognition under severe biological constraint. It *makes us feel* what it's like to rely entirely on authored, untrustworthy external cues to construct a narrative of the past (and present). It argues experientially for the *reality* of extension under such conditions, but also its profound fragility.

  **What the Film Dramatizes that Arguments Miss:**

  *   **The Agony of Authorship:** The existential weight of *choosing* what to inscribe on your own body/notes, knowing your future self is a captive audience. The anguish of knowing you might lie to yourself.
  *   **The Porous Boundary:** How easily the "extended system" is invaded and colonized by *other* minds (Teddy, Natalie) for *their* purposes, turning Leonard's mind into a battleground.
  *   **Motivation & Identity:** Leonard isn't just extending memory; he's constructing an *identity* ("Leonard Shelby, Avenger") and outsourcing his *purpose* (find and kill John G.). The system sustains not just cognition, but a specific narrative of self and mission.
  *   **The Feedback Loop of Distrust:** The unreliability *breeds* the constant critical evaluation that prevents true "automatic endorsement," creating a vicious cycle that undermines the system's function *as* extended mind.

  **Where the Reading Overreaches (Flag for Class):**

  1.  **Equating Scaffolding with Constitutive Extension:** While the film powerfully shows *scaffolding*, it arguably shows a *failure* of true constitutive extension *as defined by C&C* because of the lack of automatic endorsement and reliability. The system is too contested and distrusted internally. Flag: Is Leonard's system *really* an "extended mind" or a desperate, flawed *substitute* constantly battling against its own limitations and manipulations?
  2.  **Ignoring the Unified Self Assumption:** Applying EMT too readily papers over the radical discontinuity of Leonard's selfhood. The "author" and the "reader" of the notes are arguably different cognitive agents separated by amnesia. EMT typically assumes a single, continuous self utilizing the tool.
  3.  **Overstating the Film's Support:** The film is a *challenge* to EMT as much as an illustration. It shows the *need* for extension but also its catastrophic potential when the ideal conditions (trust, reliability, unified self) break down. It's a cautionary tale.

  **Extending Memory vs. Outsourcing Will: A Motivated Distinction**

  The film *absolutely* motivates this crucial distinction:

  *   **Extending Memory:** This involves augmenting or replacing the biological function of storing and retrieving factual information (e.g., Otto's address, Leonard's car facts). The *goal* (remembering the address) and the *evaluation* of the information's truth remain with the agent.
  *   **Outsourcing Will:** This involves externalizing the *driving purpose*, *decision-making*, or *evaluation criteria* itself. Leonard's system does this profoundly:
      *   **The Mission as External Mandate:** "FACT 6: Gotta find 'em and kill 'em." This isn't just a memory; it's an imperative, a pre-programmed goal authored by a past self (or manipulated by others).
      *   **Externalized Morality/Justification:** "FACT 5: Memory is treachery." This tattoo justifies the entire project, outsourcing the *reason* for his actions.
      *   **Self-Deception as Will Manipulation:** The Teddy setup is the ultimate outsourcing: past Leonard actively *programs* future Leonard's actions, overriding his potential future judgment or changing circumstances. Future Leonard becomes a puppet executing the will of a past self he doesn't remember or understand.
      *   **Identity Construction:** The notes/tattoos *define* who Leonard *is* ("Leonard Shelby, Avenger") and his reason for being. His will is shaped and directed by the external system more than by any internal, present-moment deliberation.

  **Conclusion for Class:**
  *Memento* is a powerful but deeply problematic case study for EMT. It vividly demonstrates the *need* for external scaffolding in cognition but ruthlessly exposes the limitations of C&C's idealized conditions. It forces us to confront:
  *   The fragility of trust and reliability in extended systems.
  *   The challenge of a fragmented self to the "past endorsement" criterion.
  *   The agonizing burden of authorship.
  *   The terrifying ease with which extension can slide into manipulation, colonization, and the outsourcing of not just memory, but *will* and *identity*.
  Use the film to highlight the *messy reality* of cognitive extension, pushing beyond the clean philosophy of Otto's notebook. Ask students: Does Leonard *have* an extended mind, or is he *colonized* by his own past and others, using external tools in a constant state of cognitive warfare? The reverse chronology isn't just a gimmick; it's the film's core philosophical argument, making us *live* the precariousness of scaffolded cognition.
