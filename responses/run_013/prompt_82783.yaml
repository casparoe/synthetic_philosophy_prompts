  The user hosts a reading group with non-specialists, including a canon law teacher. They need a practical tool with specific criteria: funding sources, personnel appointments, jurisdictional handovers, religious education policies, display regulations, and institutional standing for religious bodies. The tree should have 6-8 leaf positions representing real-world examples like England, Germany, France, and the US.

