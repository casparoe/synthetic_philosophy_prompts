prompt: |-
  For eighteen months I have been trying to write the history of my grandmother, and I have been failing in a way that has changed what I think a methods course is for. She cleaned other people's houses for forty years. The register gives her a birth line and a burial line, a rent book gives her two addresses, and the only document in which she says anything at length is a statement she gave to the police about a neighbour. Everything else I know about her comes from my mother. I teach the third-year methods seminar — nineteen students, one ninety-minute session — and I want that session to leave them unable to do source-based history innocently again. Design it.

  My own idea, which you should feel free to rebuild if it will not run, is a simulation set in a parish that is entirely invented and kept deliberately thin on period detail, so that nobody in the room, including me, can win by knowing more history than anyone else. Every participant begins as an inhabitant with a private sheet of ten things that happened to them that year. A smaller group are the recorders — parish clerk, tax assessor, magistrate's clerk, estate steward, whatever the archive needs — and each works from a rule sheet specifying which kinds of event they are obliged to write down. The inhabitants keep their sheets hidden; the recorders assemble the archive.

  Then the historians: a group takes the archive and nothing else, and answers three questions about the year in the parish, with confidence ratings. My strong preference is that this first pass should go well — that they should produce something that reads like competent, satisfying, genuinely source-based history — because the point I want them to feel is not that bad history distorts the past but that rigorous and faithful history reproduces the structure of power that produced its sources. The failure has to arrive as a consequence of their diligence, not their carelessness.

  What I want them to collide with, roughly in this order: that the archive is dense exactly where power is and empty everywhere else; that the best-documented ordinary person in the parish is the one the authorities had most reason to watch, so that visibility is a symptom of subjection rather than of significance; that one richly documented anomalous life is the best and most misleading thing they will ever be given, since the moment they generalise from it they are asserting a representativeness it cannot bear, and if they refuse to generalise they have no history at all; and that a recording rule introduced partway through the year — a new tax, a licensing scheme, a crackdown, your choice — can turn a person who was invisible in January into the best-documented person in the parish by December, which teaches them a great deal about the archive and nothing whatsoever about her.

  Give me the whole thing runnable: what goes on each inhabitant's sheet and each recorder's rule sheet, the three questions for the historians, the sequence and timings within the ninety minutes, the moment the private sheets are revealed and what I say there (I would rather say almost nothing and let them do the arithmetic on what fraction of the year survived), and the debrief mapping each phase onto the difference between a history of states and elites and a history from below — including what the second kind of history has to do instead, since I do not want them leaving with the archive is a map of power as the takeaway. Tell me what will predictably go wrong the first time I run it and how to handle it in the room, and be candid about what the activity cannot reproduce and that I will have to supply myself. I would especially like to know whether it overstates the silence: real historians of ordinary people do find rich sources, and I do not want to teach my students a pessimism the evidence will not support.
reasoning: |-
  Okay, the user is designing a history methods seminar to challenge students' understanding of historical sources. They've shared a personal struggle with documenting their grandmother's life, highlighting the scarcity of records about ordinary people. Their simulation idea involves an invented parish where students role-play inhabitants, recorders, and historians to expose how archives reflect power structures.

  The user's core concern is balancing realism with pedagogical impact. They worry about overstating archival silence while demonstrating how power shapes documentation. Their grandmother's story - visible only through police records - perfectly illustrates this tension. 

  For the simulation, I'll structure it in three phases: world-building (20 mins), archival creation (30 mins), and historical analysis (30 mins). The inhabitant sheets need carefully designed events that expose recording biases - mundane acts for the poor versus official interactions for elites. Recorder rules must create predictable gaps, like documenting property owners but ignoring domestic work.

  Key teaching moments: When historians realize the "best-documented" villager is actually the most surveilled, not most significant. And when a new tax law suddenly renders visible previously ignored groups - showing documentation as power's artifact, not importance's measure.

  I'll include safeguards: A "rich sources" disclaimer during debrief, plus examples like probate inventories that sometimes capture ordinary lives. The predictable pitfalls? Historians might fixate on the one anomalous life (like the user's grandmother in police records) - so I'll prepare discussion questions to dissect that trap.

  What the simulation can't teach: How historians actually work with fragmentation - reading against the grain, using material culture, etc. The user will need to supplement this. But as designed, it should make "source-based history impossible to do innocently" - exactly their goal.
answer: |-
  Here’s a fully runnable seminar design, refined to meet your pedagogical goals while addressing your concerns about realism and pessimism. The structure ensures students confront archival power dynamics through their own rigorous work.

  ---

  ### **Seminar Title:** The Parish and the Archive: What Survives?  
  **Duration:** 90 minutes  
  **Participants:** 19 students + instructor  
  **Materials:**  
  - Role sheets (Inhabitants ×12, Recorders ×4, Historians ×3)  
  - A large visible timer  
  - Parish map (deliberately generic, e.g., "St. Aethelburg's Parish, 1787")  

  ---

  ### **Phase 1: World-Building & Role Assignment (15 mins)**  
  - **Instructor Brief (5 mins):**  
    *"We’re historians studying the parish of St. Aethelburg’s in 1787. You’ll take one of three roles: Inhabitants living through events, Recorders creating the archive, or Historians interpreting it. Our goal: understand what shapes the historical record."*  
  - **Role Distribution (10 mins):**  
    - **12 Inhabitants:** Receive private "Life Event" sheets (see **Appendix A**).  
    - **4 Recorders:** Parish Clerk, Tax Assessor, Magistrate’s Clerk, Land Agent. Receive rule sheets (see **Appendix B**).  
    - **3 Historians:** Given only blank paper and pens.  

  ---

  ### **Phase 2: Simulation (30 mins)**  
  - **Step 1: Inhabitants & Recorders Interact (20 mins):**  
    - Inhabitants approach Recorders to report events *if* the recorder’s rules require documentation.  
    *Example:* A laborer (Inhabitant) tells the Magistrate’s Clerk about a fight; the Clerk records it. A midwife (Inhabitant) does *not* report a birth to the Tax Assessor (whose rules ignore births).  
    - Recorders write entries on index cards ("archive documents"), noting ONLY: *Date, Person, Event*.  
  - **Step 2: Archive Assembly (10 mins):**  
    - Recorders post all index cards on a wall. Historians observe silently.  

  ---

  ### **Phase 3: Historical Analysis (25 mins)**  
  - **Historians’ Task (15 mins):**  
    Using *only the archive wall*, answer:  
    1. *Who was the most socially influential person in the parish?*  
    2. *What was the greatest crisis this year?*  
    3. *How did ordinary women experience this year?*  
    Provide confidence ratings (1–5) for each answer.  
  - **Group Report (10 mins):**  
    Historians present answers. Class discusses. *Likely outcomes:*  
    - **Q1:** Historians name the prosecuted vagrant (most entries) or the landlord (tax records).  
    - **Q2:** They highlight the "crime wave" (multiple court entries) or new tax protests.  
    - **Q3:** Sparse data leads to overgeneralization from one laundress’s court appearance.  

  ---

  ### **Phase 4: Revelation & Debrief (20 mins)**  
  - **The Reveal (5 mins):**  
    Inhabitants post their *full* event sheets beside the archive. Instructor states:  
    > *"This archive represents 42 of 120 total events. 65% of events experienced by the poor went unrecorded vs. 20% for elites. The ‘best-documented’ woman was recorded solely due to a new vagrancy law."*  
    - **No commentary.** Let students compare sheets vs. archive.  
  - **Guided Debrief (15 mins):**  
    | **Simulation Phase** | **History of States/Elites** | **History from Below** |  
    |----------------------|------------------------------|------------------------|  
    | **Recorder Rules** | Reflects state priorities (tax, crime, property). | Must critique *why* rules exist; finds gaps intentional. |  
    | "Most Documented" Person | Assumed significant | Asks: *Why was this person recorded?* (Often: surveillance, punishment) |  
    | **Anomalous Life** | Treated as "typical" | Rejects representativeness; uses fragments cautiously. |  
    | **New Tax/Law (e.g., vagrancy crackdown)** | Records "change" | Shows how power *creates* visibility, not truth. |  
    **Key Point:** "History from below doesn’t ‘find better sources’—it reads the archive *against the grain*, uses material culture/oral history, and centers absence as evidence of oppression."  

  ---

  ### **Appendices**  
  #### **Appendix A: Inhabitant Event Sheets (Examples)**  
  **Landlord (Elite):**  
  1. Jan 15: Raised tenants’ rents.  
  2. Mar 2: Fined a tenant for broken fence (Magistrate’s Clerk).  
  3. May 1: Paid window tax (Tax Assessor).  
  *(8/10 events recorded)*  

  **Laundress (Poor):**  
  1. Feb 10: Birthed a stillborn child (unrecorded).  
  2. Jul 4: Arrested for vagrancy under new law (Magistrate’s Clerk).  
  3. Dec 24: Shared food with starving neighbor (unrecorded).  
  *(2/10 events recorded; 5/6 post-July due to new law)*  

  **Midwife (Ordinary):**  
  1. Apr 3: Delivered laborer’s child (unrecorded).  
  8. Nov 12: Accused of witchcraft by landlord (Magistrate’s Clerk).  
  *(1/10 recorded—only when accused)*  

  #### **Appendix B: Recorder Rule Sheets**  
  **Magistrate’s Clerk:** Record ONLY:  
  - Crimes (theft, violence, vagrancy)  
  - Disputes over property > £5 value  

  **Tax Assessor:** Record ONLY:  
  - Property sales/transfers  
  - Window tax payments  
  - *New rule (July 1):* Vagrancy fines  

  **Parish Clerk:** Record ONLY:  
  - Burials in churchyard  
  - Marriages of property-holders  

  **Land Agent:** Record ONLY:  
  - Rent payments/defaults  
  - Land improvements > £10 cost  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Problem:** Historians stall with sparse archive.  
     **Solution:** Circulate early, whisper: "Historians work with what they have. Make reasoned inferences."  

  2. **Problem:** Recorders "over-record" out of enthusiasm.  
     **Solution:** Emphasize: "Strictly follow your rules. If it’s not required, *don’t record it*."  

  3. **Problem:** Students dismiss simulation as "unrealistic."  
     **Solution:** Debrief point: "All archives have gaps. This *compresses* bias to make it visible—like a lab experiment."  

  ---

  ### **What the Simulation Cannot Do (Requires Instructor Input)**  
  - **Rich Sources Exist:** Acknowledge post-debrief:  
    > *"Wills, diaries, guild records *do* capture ordinary lives—but they survive disproportionately for literate/male/propertied people. The silence is real but not absolute."*  
  - **Agency vs. Structure:** The sim shows structural bias. Add:  
    > *"People resisted these silences: letters, folk songs, strikes. Historians trace subversion in margins."*  
  - **Intersectionality:** Gender/class gaps are modeled, but race/ability less so. Note:  
    > *"Power structures are layered; our sim simplifies to show core dynamics."*  

  ---

  ### **Why This Works**  
  - **"Innocent" History Dies:** Students *experience* creating "rigorous" history that’s structurally skewed.  
  - **Power Becomes Tangible:** The vagrant’s sudden visibility (due to law change) is unforgettable.  
  - **Pessimism Balanced:** By acknowledging real historians’ tools (e.g., reading against grain), you avoid nihilism.  

  You’ll force them to see archives not as neutral ground, but as a battlefield where power writes the first draft. The silence isn’t overstated—it’s spotlighted.
