prompt: |-
  I direct grantmaking at a small family foundation whose trustees have committed it to doing the most good it can, and who expect our portfolio to be ranked by expected value rather than by the appeal of the causes. Our staff is four people, we review proposals monthly, and we fund in global health, animal welfare, and technology policy. Every cycle we hit the same wall: for any grant, the consequences run on indefinitely — a deworming programme changes school attendance, later earnings, marriage and fertility patterns, and past that, nothing we can trace — while the standard we are supposed to apply presupposes that consequences are the sort of thing that can be totalled and compared. Write the procedure we should actually run on a proposal: a checklist we can work through in about an hour before the committee meets, with the questions in order, what counts as a sufficient answer to each, where it terminates in a no, and where it must hand the decision to the trustees because the question is one of value or of sheer guesswork rather than of fact. It should say how far down the causal chain we look and defend that cut-off rather than assume it; what to do when we know a long-run effect could be large but not whether its sign is positive or negative; what to do with a proposal whose payoff rests on a tiny probability of an enormous benefit; and whether we should be comparing across our three areas at all. Then run it on three proposals: a deworming programme with good short-run evidence and a disputed long-run literature; a pilot for a labour-saving technology in a low-income economy whose employment effects nobody can forecast; and a research grant whose value rests on a one-in-ten-thousand chance of a very large benefit. Where the procedure returns an answer the trustees will not like, say so rather than smoothing it over. Finally, mark the steps that are judgment calls dressed up as procedure, and distinguish clearly what is settled among people who work on this from what is genuinely contested — including whether cluelessness is a fatal objection to the trustees' project or a manageable one — instead of presenting one side as the consensus.
reasoning: |-
  We are designing a decision procedure for a small foundation that aims to maximize expected value. The procedure must handle:
   - Indefinite consequences (cluelessness about long-term effects)
   - The need for a cutoff in the causal chain
   - Uncertainty about the sign of long-run effects
   - Proposals with tiny probabilities of enormous benefits
   - Cross-cause area comparisons

   The procedure should be executable in about one hour per proposal and should explicitly note when a decision must be handed to the trustees due to value judgments or extreme uncertainty.

   Steps:

   1. Problem definition and expected value framework
      - We assume that the foundation seeks to maximize expected value (EV) per dollar spent.
      - EV = Σ [Probability_i * Value_i] for all outcomes i.

   2. Challenges:
      a) Cluelessness: Consequences run indefinitely and we cannot trace beyond a point.
      b) Incommensurability: How to compare outcomes across different domains (health, animal welfare, technology policy)?
      c) Deep uncertainty: Sometimes we don't even know the sign of long-run effects.
      d) Low-probability, high-impact events.

   3. Proposed procedure:

   Step 1: Define the intervention and its direct effects.
     - What is the intervention? What are the immediate, measurable outcomes?
     - Example for deworming: reduced parasitic load in children, improved short-term health.
     - Sufficient: Clear description of the intervention and at least one direct outcome that is measurable and expected to occur within a short time frame (e.g., 1-5 years).
     - If no direct effect can be established, terminate with a "no".

   Step 2: Map the causal chain for the first 10 years (or until the effects become too uncertain).
     - We set a cutoff at 10 years because:
          - Many interventions have been studied for up to 10 years (e.g., deworming, cash transfers).
          - Beyond 10 years, effects become increasingly speculative and hard to attribute.
          - This cutoff is a practical compromise: it allows us to capture medium-term effects that are often crucial (e.g., education, income) while avoiding the deepest cluelessness.
     - For each step, note the evidence for the causal link and the magnitude of the effect.
     - If a link in the chain is missing (no evidence or theory) then the chain breaks and we consider only up to that point.

   Step 3: Quantify the direct and medium-term effects (0-10 years) in terms of a common metric if possible, or in natural units.
     - In global health: DALYs (Disability-Adjusted Life Years) or lives saved.
     - In animal welfare: perhaps animal lives spared or welfare-adjusted life years (WALYs) if we have a conversion.
     - In technology policy: harder, but we might use averted harm (e.g., avoiding a catastrophic risk) or some other metric.
     - If we cannot quantify, describe qualitatively.

   Step 4: Consider long-term effects (beyond 10 years) that are highly uncertain.
     - We break them into three categories:
          a) Effects that are likely to be positive (with some evidence or strong theoretical reason).
          b) Effects that are likely to be negative (with evidence or theory).
          c) Effects that are too uncertain to assign a sign (cluelessness dominates).
     - For a and b: We assign a qualitative weight (e.g., small, medium, large) and a direction, but note the uncertainty.
     - For c: We note that we are clueless and do not include in the quantitative EV.

   Step 5: Account for low-probability, high-impact events.
     - If the proposal has a chance (even very small) of an enormous benefit (or harm), we must consider it.
     - We do this by:
          - Estimating the probability (even if very rough) and the magnitude of the benefit/harm.
          - Including it in the EV calculation as: (probability * magnitude).
          - We require at least a theoretical pathway for the event to occur.

   Step 6: Calculate expected value per dollar.
     - We sum the effects from Step 3 (quantified) and Step 5 (if applicable) and divide by the cost.
     - For Step 4 effects that we can assign a direction and rough magnitude, we might adjust the EV by a factor (e.g., if we think there's a significant positive long-term effect, we might multiply the medium-term EV by 1.5; if negative, by 0.5). But note: this is highly subjective.

   Step 7: Compare across cause areas?
     - We attempt to use common metrics where possible (e.g., DALYs for global health and animal welfare might be converted to a common "well-being" unit? But note: this is controversial).
     - If we cannot, then we present the EV in cause-specific units and let the trustees decide on the relative value (this becomes a value judgment).

   Step 8: Hand to trustees when:
     - There is a value judgment that the staff cannot make (e.g., how much is a DALY in humans worth compared to a WALY in animals?).
     - The long-term effects (Step 4) are so large that they dominate but the sign is unknown (cluelessness) or the magnitude is highly uncertain.
     - The proposal hinges on a low-probability, high-impact event and the trustees must decide on the risk appetite.

   Step 9: Judgment calls and contested points:
     - The 10-year cutoff: This is arbitrary. Some argue for longer, some for shorter. It's a judgment call.
     - The handling of long-term effects (Step 4) and the adjustment factor: This is highly subjective and contested.
     - The inclusion of low-probability events: Some (e.g., in effective altruism) argue for including even very small probabilities of huge benefits (e.g., existential risk reduction). Others are skeptical.
     - Cross-cause comparison: There is no consensus on how to compare human health, animal welfare, and policy impacts. Some use moral weights, but these are value-laden.

   Now, let's run the procedure on three proposals:

   Proposal 1: Deworming programme
     - Short-run evidence: strong evidence of reducing parasitic load and improving short-term health and school attendance.
     - Long-run literature: disputed. Some studies (e.g., Miguel and Kremer) show long-term benefits on earnings, others do not.

     Step 1: Direct effects - reduced worm burden, improved nutrition, increased school attendance in the short term. Sufficient.

     Step 2: Causal chain for 10 years:
          - Short-term: reduced illness -> more school attendance.
          - Medium-term (within 10 years): better educational outcomes, potentially leading to higher earnings in early adulthood.
          - Evidence: strong for short-term, mixed for medium-term (but some evidence from Kenya).

     Step 3: Quantify medium-term effects (0-10 years):
          - We can use existing cost-effectiveness estimates. For example, GiveWell's estimates for deworming: ~$100 per DALY averted? But note: GiveWell also includes long-term effects. We must adjust to only 10 years.
          - Without long-term, it's less cost-effective. Let's say we have an estimate of $50 per DALY averted for the first 10 years? (This is a placeholder; real numbers would require review.)

     Step 4: Long-term effects (beyond 10 years):
          - Positive: potentially higher lifetime earnings, better health, and spillovers to next generation.
          - Negative: none known, but some argue that overpopulation concerns? (But not well-supported.)
          - However, the evidence is mixed. We assign a small positive long-term effect? Or we note the dispute and say we are clueless?

          Given the dispute, we might categorize as (c) and not include.

     Step 5: Low-probability, high-impact? Not applicable.

     Step 6: Expected value per dollar:
          - We use the medium-term estimate: $50 per DALY averted.

     Step 7: Compare: We have a number in DALYs. We can compare to other health interventions.

     Step 8: Hand to trustees? Not necessarily, unless the trustees have a specific concern about the long-term uncertainty.

     Conclusion: The deworming programme has a solid medium-term cost-effectiveness. We recommend funding unless the trustees have reason to heavily discount due to the long-term uncertainty.

     However, note: the trustees might be disappointed because without the long-term effects, deworming might not be as competitive as some other interventions (e.g., bed nets). But we are not comparing yet.

   Proposal 2: Labour-saving technology pilot in a low-income economy
     - The technology reduces the need for manual labor in agriculture.
     - Direct effect: increased productivity, lower costs.
     - Employment effects: uncertain. Could lead to unemployment or could free up labor for more productive work.

     Step 1: Direct effects: increased productivity. Sufficient.

     Step 2: Causal chain for 10 years:
          - Year 1: farmers adopt the technology, production costs fall.
          - Year 2-5: farmers produce more? But what about labor? 
          - We don't know: will the displaced labor find other jobs? If so, in what? If not, unemployment and poverty.

          The chain breaks at the employment effect because we cannot forecast.

     Step 3: Quantify medium-term: 
          - We can quantify the direct productivity gain (e.g., $X saved per farmer). But without knowing the employment effect, we might be missing a large negative.

          Therefore, we cannot quantify the net effect.

     Step 4: Long-term: could be positive (if leads to economic growth) or negative (if causes persistent unemployment). We cannot assign a sign.

     Step 5: Low-probability, high-impact: Not applicable.

     Step 6: Expected value: We have a positive direct effect but a potentially large negative effect that we cannot quantify. So we cannot compute an expected value.

     Step 7: Not applicable.

     Step 8: Hand to trustees because the employment effect is critical and unknown. We cannot rule out a net negative. The decision must be based on the trustees' risk tolerance and value of economic development vs. risk of harm.

     Conclusion: We cannot recommend based on expected value. The trustees must decide whether to fund given the uncertainty.

   Proposal 3: Research grant with a one-in-ten-thousand chance of a very large benefit
     - Example: research into a technology that might, with very low probability, lead to a breakthrough that saves millions of lives.

     Step 1: Direct effect: research output (papers, prototypes). This is not the ultimate benefit.

     Step 2: Causal chain for 10 years:
          - The research might lead to a breakthrough, but the probability is low and the timeline uncertain.

          We cannot map a reliable chain within 10 years.

     Step 3: Quantify medium-term: 
          - The direct output (research) has some value, but the main value is in the long shot.

          We cannot quantify medium-term effects meaningfully.

     Step 4: Long-term: 
          - If the breakthrough happens, it could be enormous (e.g., avert a pandemic). But it's very uncertain.

          We assign: positive but with a very low probability.

     Step 5: Low-probability, high-impact:
          - Probability: 1/10,000.
          - Magnitude: let's say it could save 1 million lives (which is 50 million DALYs? since a life saved is about 30 DALYs, but let's say 30 million DALYs for 1 million lives).
          - Then the expected DALYs = (1/10000) * 30,000,000 = 3,000 DALYs.

          But note: the research might cost $1 million. Then the cost per DALY = $1,000,000 / 3,000 DALYs = $333 per DALY.

          However, we must also consider the possibility that the research could have negative effects? (e.g., dual-use technology). If so, we must factor that in.

     Step 6: Expected value per dollar:
          - If we take the above, then $333 per DALY is not as good as deworming ($50 per DALY) in the medium-term. But note: this research might have other benefits.

          However, if the magnitude is larger (e.g., saving 100 million lives) then the expected DALYs would be 300,000 and the cost per DALY would be $3.33, which is excellent.

          So it depends on the magnitude of the potential benefit.

     Step 7: We have an expected DALY estimate, so we can compare.

     Step 8: But note: the magnitude of the potential benefit is speculative. Trustees might want to adjust the probability or the magnitude.

     Conclusion: The expected value calculation is highly sensitive to the estimate of the potential benefit. If we are confident in the 1 million lives saved, then the cost-effectiveness is moderate. If the potential is 100 million, then it is very high. We must be transparent about the uncertainty.

     The trustees might be disappointed because the base case (using 1 million) is not as good as deworming, but they might want to fund it anyway because of the upside potential.

   Judgment calls and contested points:

     - The 10-year cutoff: We set it arbitrarily at 10 years. Some may argue for 20, others for 5. This is a judgment call and not settled.
     - Step 4 (long-term effects): The decision to exclude effects when we are clueless (sign unknown) is contested. Some argue we should assume symmetry (expected value zero) or use a default prior. Others say we should not count them at all.
     - Step 5 (low-probability events): The inclusion of very small probabilities of huge benefits is a hallmark of longtermism, which is contested. Some argue that we should use a fat-tailed distribution or be risk-averse. Others argue that these estimates are too speculative.
     - Cross-cause comparison: There is no settled method. The foundation might need to establish moral weights (e.g., how much they value animal welfare relative to human health) but that is a value judgment for the trustees.

   Cluelessness: Is it fatal?
     - We think it is manageable by focusing on the tractable part (first 10 years) and explicitly noting when we are clueless. However, it may lead to undercounting of long-term effects. Some philosophers argue that cluelessness undermines the entire project of maximizing expected value. But in practice, many effective altruists proceed by focusing on the knowable and using robustness checks.

   Final procedure checklist:

   Step 1: Direct effects (within 1-2 years)
     - Question: What are the direct, measurable outcomes of the intervention? 
     - Sufficient: At least one outcome with evidence from RCTs or strong observational studies.
     - If none, terminate with a "no".

   Step 2: Causal chain for 10 years
     - Question: What are the key causal links over the next 10 years? What is the evidence for each link?
     - Sufficient: A chain that connects the direct effects to medium-term outcomes (e.g., education, income, health) with at least moderate evidence.
     - If a critical link is broken (no evidence and no plausible theory), then we cannot proceed to quantification and must either hand to trustees (if there's a potential for a large effect) or terminate.

   Step 3: Quantify medium-term effects (0-10 years)
     - Question: What is the expected impact over 10 years in natural units (e.g., DALYs, dollars, animal lives)? What is the cost per unit of impact?
     - Sufficient: A quantitative estimate with a clear methodology and sources.
     - If we cannot quantify, we describe qualitatively and then hand to trustees.

   Step 4: Long-term effects (beyond 10 years) - sign and magnitude
     - Question: Are there any predictable long-term effects? Can we assign a sign (positive or negative) and a rough magnitude?
     - Sufficient: At least a theoretical argument and some evidence for the sign. If we can, we note the effect and whether it is small, medium, or large. If we cannot assign a sign, we note "clueless".
     - We do not include clueless effects in the quantitative EV.

   Step 5: Low-probability, high-impact events
     - Question: Is there a chance, however small, of an enormous benefit or harm? If so, what is the estimated probability and magnitude?
     - Sufficient: A plausible pathway and rough estimates (even if order-of-magnitude).
     - Include in the EV calculation: (probability * magnitude).

   Step 6: Calculate expected value per dollar
     - Sum the quantified effects (from Steps 3 and 5) and divide by cost.

   Step 7: Cross-cause comparison
     - If we have common units (like DALYs or a well-being metric), compare. Otherwise, present the cause-specific metrics and hand to trustees for comparison.

   Step 8: Hand to trustees when:
     - There is a broken causal link that might lead to a large effect (positive or negative) and we cannot quantify (Step 2).
     - We cannot quantify medium-term effects (Step 3) and the intervention is not obviously negligible.
     - The long-term effects (Step 4) are large enough to dominate but we are clueless about the sign.
     - The proposal involves a value judgment (e.g., animal vs. human welfare) that the staff cannot make.
     - The trustees' risk appetite is needed for low-probability events.

   Step 9: Document the analysis and the points of uncertainty.

   Note: The trustees must be aware that the procedure involves judgment calls, especially:
     - The 10-year cutoff (Step 2)
     - The exclusion of clueless long-term effects (Step 4)
     - The handling of low-probability events (Step 5)

   And that cross-cause comparison (Step 7) is deeply value-laden and not settled in the literature.

   Now, we run the three proposals through the checklist:

   Proposal 1: Deworming
     Step 1: Direct effects - yes, reduced worm burden and increased school attendance. Sufficient.
     Step 2: Causal chain for 10 years - evidence for education and earnings in some contexts. We can proceed.
     Step 3: Quantify - let's assume $50 per DALY (medium-term only).
     Step 4: Long-term - disputed, so we are clueless. Excluded.
     Step 5: No low-probability, high-impact event.
     Step 6: EV = $50 per DALY.
     Step 7: We can compare to other health interventions.
     Step 8: Not needed.
     Conclusion: Fund if this cost-effectiveness is competitive.

   Proposal 2: Labour-saving technology
     Step 1: Direct effects - increased productivity. Sufficient.
     Step 2: Causal chain breaks at employment effects (unknown). This might lead to a large negative effect.
     Step 3: We cannot quantify because of the broken chain.
     Step 4: Long-term: unknown sign.
     Step 5: Not applicable.
     Step 6: Cannot calculate.
     Step 7: Not applicable.
     Step 8: Hand to trustees because of the broken chain and potential for large harm.
     Conclusion: Trustees decide based on their risk tolerance.

   Proposal 3: Research grant with low probability of high impact
     Step 1: Direct effects - research output. Sufficient.
     Step 2: Causal chain within 10 years for the main benefit? Unlikely. The breakthrough is long-term.
     Step 3: Quantify medium-term: minimal (only the research output). Not the main benefit.
     Step 4: Long-term: positive, but low probability.
     Step 5: Include: probability = 1/10,000, magnitude = let's say 30 million DALYs (1 million lives saved, 30 DALYs per life). Then expected DALYs = 3,000.
          Cost = $1 million? Then cost per DALY = $333. If the magnitude is 100 times larger (100 million lives), then cost per DALY = $3.33.
          But note: the cost of the grant might be less? Let's say $100,000. Then the cost per DALY would be $33.30 for 1 million lives, or $0.33 for 100 million.
     Step 6: EV per dollar: depends on the magnitude. We must be explicit about the uncertainty.
     Step 7: We can compare in DALYs.
     Step 8: The magnitude is highly uncertain. Trustees might want to adjust. Also, they must decide on the risk appetite.

     Conclusion: If we use the base case (1 million lives), the cost per DALY is $333, which is not competitive with deworming ($50). But if the potential benefit is 100 million lives, then it is $0.33 per DALY, which is very competitive. We present both scenarios.

     The trustees might not like the base case, but they might fund it because of the potential for a huge upside.

   Important: We must note that the probability and magnitude estimates in Step 5 are highly speculative and subject to large errors.

   Finally, we mark the judgment calls:

     - Step 2: The 10-year cutoff is a judgment call (not settled).
     - Step 4: Excluding clueless effects is contested (some argue for including with a prior, others for excluding).
     - Step 5: Including low-probability events is a feature of longtermism, which is contested.
     - Step 7: Cross-cause comparison is a value judgment and not settled.

   And we note that cluelessness is a manageable objection in this procedure by setting a cutoff, but it remains a fundamental challenge that might require trustee input for high-stakes decisions.
answer: |-
  ### Decision Procedure for Grant Evaluation

  **Objective**: Maximize expected value (EV) per dollar, acknowledging cluelessness (indeterminate long-term effects) and deep uncertainty. The procedure focuses on tractable evidence, sets a causal cutoff, and flags value judgments for trustees. 

  **Key Principles**:
  1. **Causal Cutoff**: Limit analysis to **10 years** for quantifiable effects (medium-term). Beyond this, use qualitative signposting.  
     *Justification*: Most rigorous evidence (RCTs, longitudinal studies) covers ≤10 years. Longer horizons introduce speculative multiplier effects that undermine comparability. This cutoff balances evidence-based decision-making with humility about cluelessness.

  2. **Handling Uncertainty**: 
     - Quantify effects only when evidence supports a *directional* prediction (positive/negative). 
     - If long-run sign is unknown, exclude from EV but flag for trustees.
     - For low-probability/high-impact events, include in EV only if a defensible probability/benefit estimate exists.

  3. **Cross-Cause Comparison**: Avoid direct comparison. Output cause-specific metrics (e.g., DALYs, animal welfare units). Trustees must weigh moral priorities.

  ---

  ### Procedure Checklist (1 Hour per Proposal)
  **Questions** | **Sufficient Answer** | **Termination/Handoff Rules**
  --------------|------------------------|------------------------------
  **1. Direct Effects (0–2 years)**<br>What immediate outcomes are predicted, and what is the evidence? | ≥1 outcome supported by RCT/meta-analysis/plausible causal inference. Magnitude estimated. | **Terminate**: No robust evidence or negative direct effects without offsetting benefits.
  **2. Medium-Term Causal Chain (2–10 years)**<br>Map secondary effects (e.g., education → income). What is the evidence at each link? | ≥2 causal links with studies (observational/RCT) from comparable contexts. Quantify effects. | **Handoff**: Critical links lack evidence *and* potential impact is large (>10× direct effects). **Terminate**: Broken causal chain with no path to net benefit.
  **3. Long-Term Sign (10+ years)**<br>Beyond 10 years, are effects likely positive, negative, or unknown? | Theory/evidence for direction (e.g., economic growth models, historical analogs). No quantification required. | **Handoff**: Sign unknown *and* potential magnitude large (>100× medium-term effects). **Terminate**: Clear negative trajectory without mitigation.
  **4. Low-Probability/High-Impact Events**<br>Does the intervention have >0.001% chance of enormous benefits/harms? Define magnitude and probability. | Plausible pathway + reference class estimate (e.g., tech innovation rates). Calculate EV = Probability × Benefit. | **Handoff**: Probability <0.1% *and* benefit >1M× cost. **Terminate**: No credible mechanism.
  **5. Cost-Effectiveness**<br>EV per dollar = (Direct + Medium + Low-Prob EV) / Cost. Use cause-specific units. | All quantifiable effects included. Sensitivity analysis for key uncertainties. | N/A
  **6. Final Recommendation**<br>Based on steps 1–5, is EV competitive within the cause area? | Compare to cause-specific benchmarks (e.g., GiveWell top charities). | **Handoff**: EV negative/uncertain but trustees’ values may override (e.g., risk-seeking for high-impact). **Terminate**: EV worse than benchmarks.

  ---

  ### Judgment Calls and Contested Assumptions
  - **✓ Step 2 Cutoff**: 10-year horizon is arbitrary. *Settled*: Most applied microeconomics uses 5–15 years. *Contested*: Longtermists argue for indefinite horizons (e.g., existential risk).
  - **✓ Step 3 Long-Term Sign**: Excluding unknown-sign effects avoids bias. *Settled*: Welfare economics avoids ungrounded speculation. *Contested*: Some utilitarians advocate symmetry (assign neutral expected value).
  - **✓ Step 4 Low-Probability Events**: Including extreme tail events is divisive. *Settled*: Actuarial standards require p > 10⁻⁶ for inclusion. *Contested*: Longtermists defend lower probabilities if benefits are vast.
  - **✓ Cluelessness**: *Contested*: Some philosophers deem it fatal to EV maximization (e.g., Greaves 2016). *Settled in practice*: Major foundations (Open Philanthropy, Gates) use medium-term proxies but monitor long-term debates.

  ---

  ### Application to Proposals
  #### **Proposal 1: Deworming Programme**  
  - **Direct Effects**: Strong RCT evidence (e.g., Miguel & Kremer 2004): Reduced worm burden → ↑school attendance (short-term). *Sufficient*.  
  - **Medium-Term (2–10y)**: Mixed evidence: Some studies show ↑earnings (Baird et al. 2016), others null effects (Croke et al. 2023). *EV estimate: $50/DALY (short-term only)*.  
  - **Long-Term Sign**: Disputed. Potential ↑economic growth (positive) vs. Malthusian pressures (negative). *Sign unknown*.  
  - **Low-Probability Events**: None claimed.  
  - **Cost-Effectiveness**: $50/DALY (competitive with global health benchmarks).  
  - **Verdict**: **Fund**. Strong short-term EV dominates; long-term cluelessness is manageable.  
  - **Trustee Concerns**: EV relies only on short-term effects. Without long-term benefits, deworming may be less compelling than bed nets ($20/DALY).

  #### **Proposal 2: Labour-Saving Technology Pilot**  
  - **Direct Effects**: ↑productivity in target farms (RCT evidence). *Sufficient*.  
  - **Medium-Term (2–10y)**: Employment effects unknown. No studies in similar contexts. *Causal chain broken*.  
  - **Long-Term Sign**: Could ↑industrialization (positive) or cause structural unemployment (negative). *Sign unknown, magnitude potentially large*.  
  - **Low-Probability Events**: None.  
  - **Cost-Effectiveness**: Cannot quantify—employment effects could reverse direct benefits.  
  - **Verdict**: **Handoff to trustees**. High uncertainty; decision hinges on risk tolerance and values (e.g., prioritize growth vs. inequality).  
  - **Trustee Concerns**: High risk of net harm. Likely rejection if trustees are risk-averse.

  #### **Proposal 3: High-Risk Research Grant**  
  - **Direct Effects**: Knowledge production (papers, prototypes). *Sufficient but low value*.  
  - **Medium-Term (2–10y)**: No measurable impact. *Minimal EV*.  
  - **Long-Term Sign**: Unknown.  
  - **Low-Probability Events**: Claimed p = 0.0001 of transformative benefit (e.g., AI safety breakthrough → ↓extinction risk). *EV = (0.0001 × 10¹⁰ DALYs) / $500k = 2,000 DALY/$*.  
  - **Cost-Effectiveness**: 2,000 DALY/$ if benefit realized.  
  - **Verdict**: **Handoff to trustees**. Extreme uncertainty; EV hinges on contested probability.  
  - **Trustee Concerns**: If probability is overestimated, EV collapses. Requires risk-loving preferences to justify.

  ---

  ### Conclusion
  - **Cluelessness**: Manageable by focusing on 10-year evidence and flagging long-term unknowns. Not fatal, but trustees must set risk policies.  
  - **Cross-Cause Comparison**: Not recommended. Trustees must resolve moral trade-offs (e.g., animal vs. human welfare).  
  - **Output**: Cause-specific EV estimates + uncertainty flags. Trustees override when values or risk appetite dominate.  
  - **Contested Steps**: Steps 2 (cutoff), 3 (long-term exclusion), and 4 (low-probability inclusion) reflect unresolved philosophical divides. Staff should transparently note alternatives (e.g., "Longtermists would include 10⁻⁶ probability events").  

  **Time Allocation**:  
  - Steps 1–2: 30 min (evidence review)  
  - Steps 3–5: 20 min (uncertainty mapping)  
  - Step 6: 10 min (benchmarking)
