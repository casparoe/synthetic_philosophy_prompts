  Hmm, the user is on an ethics committee at a transplant hospital and needs to give closing remarks at a remembrance event for donor families. They've got a complex challenge: addressing two different death determination criteria (brain death and circulatory death) without showing preference or turning it into a lecture. They specifically mentioned avoiding phrases like "already gone" since that might not feel truthful for circulatory death cases.

  I need to create a 3-minute speech in British English that honors donors while navigating this ethical minefield. The hospital uses a 2-minute wait time after circulatory death declaration, while another uses 5 minutes - families who were counting seconds in the hallway would notice any misrepresentation. The audience includes grieving families, transplant recipients, and medical staff who've heard all the clichés.

  The core tension is between medical precision and human comfort. Families need closure, but we must avoid scientific falsehoods. For brain death families, "already gone" provides comfort; for circulatory death families who witnessed the final moments, it might ring hollow. The speech must acknowledge death determination as a medical process without reducing it to mere policy.

  Key approaches: Use "moment of death" neutrally alongside "declaration of death" to separate medical procedure from lived experience. Frame donation as occurring "after death is determined" rather than specifying how. Focus on shared outcomes - all donors gave the ultimate gift after meeting legal death criteria.

  For the JSON analysis: The phrase "after death has been formally determined" might trouble circulatory death families who witnessed the declaration process. But it's the least problematic option. The speech dodges the 2-vs-5 minute issue by not mentioning timeframes, and avoids "already gone" entirely. The line about "profoundly personal" understanding of death is the riskiest - it could imply subjectivity in death determination, but actually references individual grief experiences.

  The tone must balance gratitude with integrity - no false comfort, just respect for both donors and families' experiences. Medical staff will appreciate the precision; families need to feel their loved one's death was honored authentically.
answer: |-
  **Speech Text (British English, 380 words):**

  Good afternoon. We gather today with heavy hearts and profound gratitude to remember the extraordinary individuals who became organ and tissue donors this past year. To the families and loved ones before us: thank you. Thank you for your courage during unimaginable loss, and thank you for the astonishing generosity that allowed your loved one to offer the gift of life to others.

  We honour each donor. Each life that ended, creating a space where another life could be saved, healed, or renewed. We remember the unique person behind every act of donation – their stories, their laughter, their presence, deeply missed by you.

  The path that led each donor here was different. For some, the moment of death was determined by the irreversible loss of all brain function. For others, it followed the irreversible cessation of circulation after life-sustaining treatment was compassionately withdrawn. What unites them is this: in each case, their death was declared according to rigorous, legal, and ethical medical standards. And in each case, after death had been formally determined, the possibility of donation arose because of *your* decision.

  That decision, made in the depths of grief, reflects the very best of humanity. It transformed a moment of profound sorrow into an enduring legacy. Look around this room. That legacy lives on – in the recipients who carry a part of your loved one forward, in the families whose worlds were rebuilt, and in the medical teams here who witnessed both the depth of loss and the height of hope made possible by your choice.

  To the ICU and transplant staff: we see your dedication, your respect for every life, and your unwavering commitment to honouring both the donor and the donor family’s wishes with the utmost care and dignity. Your skill makes this gift possible; your compassion makes it meaningful.

  To the donor families: Your loved ones are remembered here, not just for how they died, but for how they lived, and for the incredible difference they made in death. Their gift was final; our gratitude is everlasting. Thank you for sharing them, and thank you for allowing us to remember them with you today.

  ---

