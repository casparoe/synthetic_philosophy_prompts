prompt: |-
  I teach a metaphysics course and somewhere along the way I stopped defending Humeanism about laws of nature as a position and started just inhabiting it. Roughly, I've ended up at the Mill-Ramsey-Lewis picture: the laws are the axioms or theorems of whichever deductive system best combines simplicity and strength in describing the whole distribution of local, particular matters of fact, and there's nothing more to lawhood than that -- no necessitation, no governing, no extra ingredient in the world. I've stopped even feeling the anti-Humean tug; 'the laws make things happen' now strikes me as a picture we absorbed from theology and never audited. So what I want from you is a real map of what would count against it. Not the objections I could recite half-asleep -- regularity theory's old embarrassments, the inference problem in the abstract -- but the things that should actually move me, ranked by how decisive they'd be. Does the undermining problem (chances that, applied to the very initial conditions that generated them, would make the chance-making system itself unlikely) count as a genuine defeat or just an ugly cost I can pay? Is it fatal that the account makes lawhood hostage to a notion of simplicity nobody can cash out in mind-independent terms, or is that a bill every view in the neighbourhood gets? And does the whole thing survive quantum entanglement, or do the local particular facts the Humean is committed to have to get gerrymandered so hard the position stops being recognizable?

  I'm also after the cases where the account hands me a verdict I don't want: worlds with one instantiated law and infinitely many unexercised ones, worlds where the 'best' system is just a brute catalogue with no laws at all, and symmetry principles -- the sort of thing people argue are laws while adding no predictive strength, only constraints -- which look like they break the simplicity-strength tradeoff rather than sit inside it. Then tell me which of these a committed Humean would themselves concede counts against them and which they'd wave away; I want the concession column filled in, not just the critics' list. And be straight about the meta-question: has the view been insulated into unfalsifiability, say by the manoeuvre of 'holding fixed the rest of the system' or by treating Humean supervenience as a contingent thesis that could simply be given up if it fails? If it has, is that a problem for a view of this kind or just what any foundational view looks like from the outside? For what it's worth, the thing I'd personally find hardest to swallow is a case where the anti-Humean's ontology earns its keep -- where positing necessitation or primitive dispositions lets you explain or predict something the Humean can only redescribe. If there's such a case, lead with it.
reasoning: |-
  Okay, the user teaches metaphysics and has fully embraced the Mill-Ramsey-Lewis (MRL) view of Humean laws. They've moved past defending it to just living with it, no longer feeling the pull of anti-Humean arguments. Now they want substantial counterarguments that could genuinely challenge their position, beyond the standard objections. They're looking for a ranked list of the most decisive problems, including how a committed Humean might respond to each.

  The user mentions specific issues: the undermining problem, simplicity's subjectivity, quantum entanglement, symmetry principles, and whether the view is unfalsifiable. They're particularly interested in cases where anti-Humeanism provides explanatory advantages. I need to address each of these thoroughly.

  Starting with the undermining problem in Humean Supervenience (HS). For Humeans, chances are part of the best system. But in some worlds, the initial conditions that make those chances true could lead to outcomes that undermine the system itself. For example, high chance of heads in coin flips, but actual outcomes are all tails. The user wants to know if this is a fatal flaw or just a cost. Lewis admitted it's a cost but offered a workaround with the "New Principle." However, this fix requires conditionalizing chances on the entire Humean mosaic, which is messy. A committed Humean might accept this as a cost but not a deal-breaker, though it weakens the theory's elegance.

  Next is the subjectivity of simplicity and strength. The MRL account relies on balancing these, but they're language-dependent and involve human judgment. Is this a unique problem for Humeans? Anti-Humeans might avoid this by grounding laws in mind-independent necessities. However, every theory has to use some epistemic criteria for lawhood. The user might see this as a shared cost, but it's more acute for Humeans since lawhood is entirely defined by these pragmatic virtues.

  Quantum entanglement challenges Humean supervenience. Bell's theorem suggests that quantum correlations can't be explained by local facts alone. If HS requires local particular facts, entanglement might force "gerrymandered" non-local facts. Bohmian mechanics preserves locality but adds hidden variables, which are non-Humean. Humeans could give up strict locality, accepting global facts. But does this betray the spirit of Humeanism? The user might find this a significant concession, moving away from the original localist commitment.

  Symmetry principles are tricky. They constrain laws without adding predictive strength. For example, rotational invariance in physics. The MRL account prioritizes simplicity and strength, which might favor omitting symmetries if they don't contribute to predictions. But physicists treat them as fundamental. Humeans might argue that symmetries simplify the system by reducing variables, or they could be emergent. However, this feels forced; anti-Humeans can naturally accommodate them as modal constraints.

  Cases with uninstantiated laws or brute catalog worlds. In a world with only one law instantiated, MRL might still include unexercised laws if they simplify the system. But intuitively, laws should depend on what actually happens. Humeans might bite the bullet here. Worse, a chaotic world might have no laws at all under MRL. While logically possible, the user might see this as counterintuitive. Humeans could argue that such worlds are improbable or that our concept of laws assumes some order.

  Is the view unfalsifiable? Humeans can adjust by dropping locality or tweaking the best system criteria. This flexibility might insulate the theory from refutation. While all foundational views have some insulation, Humeanism's adjustments (like abandoning locality) could alter its core identity. The user might worry that this makes the theory too adaptable, evading decisive counterevidence.

  The user's meta-question is whether anti-Humeanism offers unique explanatory power. The case of causal exclusion in emergent properties is a strong example. If a system's behavior is entirely explained by microphysical laws, anti-Humeans can say macro-laws are metaphysically necessitated, providing a deeper explanation. Humeans can only point to patterns, which might feel insufficient. This could be the hardest point for the user to swallow, as it highlights a genuine explanatory gap in Humeanism.

  Ranking these issues: quantum non-locality is critical if maintaining locality is essential to Humeanism. Abandoning it might save the theory but at the cost of its original motivation. Symmetry principles and the undermining problem are serious but maybe manageable with workarounds. Simplicity's subjectivity is a shared problem. The explanatory gap in emergent properties might be the most philosophically troubling for someone who values deep explanations.

  The user's deeper needs: They want to test their settled view rigorously, seeking challenges that could genuinely shake their conviction. They might fear complacency in their current position and desire intellectual honesty. By asking for both criticisms and Humean responses, they're looking for a balanced assessment to either reinforce or revise their stance. Highlighting cases where anti-Humeanism provides better explanations addresses their unspoken need to ensure their view isn't missing something crucial.
answer: |-
  Here’s a ranked map of objections to Humeanism (MRL view), weighted by their potential to move a committed adherent like yourself. I’ve focused on *genuine philosophical pressure points* rather than rehearsed textbook objections, and included the Humean concession column as requested. The ranking reflects both the severity of the challenge and its ability to undermine core Humean commitments.

  **Ranked Challenges to Humeanism (MRL):**

  1.  **Quantum Non-Locality & the Death of Local Particulars (Most Decisive)**
      *   **The Challenge:** Bell’s theorem empirically rules out *local hidden variable theories*. For the Humean, this means the fundamental "local particular matters of fact" **do not exist** in a form compatible with strict Humean supervenience (HS). Entanglement correlations aren't determined by intrinsic properties of local parts + spatiotemporal relations. To save supervenience, the Humean must either:
          *   **Gerrymander "Locality":** Define "local" facts as including *holistic, non-separable properties of entire systems* (e.g., the quantum state of the whole universe). But this eviscerates the core Humean motivation – explaining the manifest world in terms of fundamental local bits. It becomes "Humeanism" in name only, sacrificing locality to save supervenience.
          *   **Embrace Non-Locality Fundamentally:** Give up HS as a *contingent* thesis. The fundamental base includes *irreducibly non-local* facts (e.g., the universal wavefunction's non-separable properties). This saves supervenience but abandons the localist ontology that gives Humeanism its distinctive character and appeal (its "desert landscape" purity).
      *   **Why it Hurts:** This isn't just an "ugly cost"; it strikes at the **ontological core** of traditional Humeanism (HS). If the fundamental base *must* include irreducibly global or non-separable facts, the picture of reality as a mosaic of local qualities is *false*. Quantum mechanics suggests the world isn't Humean at its base.
      *   **Humean Concession:** Most contemporary Humeans (e.g., Loewer, Albert, Miller) concede HS must be abandoned for quantum mechanics. They opt for *global supervenience* on the universal wavefunction (a non-local entity). They argue *supervenience* is the core commitment, locality was contingent. **Consequence:** This preserves the letter of "Humean supervenience" but sacrifices its spirit. The position becomes less distinctively "Humean" and more "supervenient non-modal realism". Whether this is still recognizable *to you* as Humeanism is the key question.

  2.  **The Explanatory Gap: Why Does the Best System "Work"? (Metaphysically Troubling)**
      *   **The Challenge (Your Requested "Anti-Humean Earning Keep" Case):** Consider emergent phenomena like phase transitions (e.g., water boiling) or complex systems (e.g., flocking birds). The anti-Humean argues their ontology provides a *deeper* explanation: The macro-behavior is *metaphysically necessitated* by the micro-structure + fundamental laws. The laws *make* the patterns happen. The Humean can only say: "The micro-particulars are arranged such that the *best summary* of them includes these macro-regularities as consequences." But this seems purely *descriptive* or *pragmatic*. It doesn't explain *why* the micro-particulars are arranged in just that law-like way *in the first place*, nor *why* projecting those summaries leads to successful future predictions. The anti-Humean posits a modal structure *in the world* that grounds the reliability of induction and the success of science in a way the Humean pattern-description does not. There's a gap between "this pattern exists" and "this pattern *must* exist/will continue".
      *   **Why it Hurts:** This targets the **explanatory ambition** of metaphysics. If Humeanism can only *redescribe* the patterns but cannot ground *why* those patterns exist persistently and projectibly, it feels explanatorily shallow compared to anti-Humeanism, *especially* for phenomena involving causal exclusion or multiple realizability. The anti-Humean ontology seems to genuinely *earn its keep* by providing a modal ground for the patterns the Humean merely catalogues.
      *   **Humean Concession:** Humeans concede they cannot offer a *metaphysical* explanation for the existence or persistence of the patterns beyond the patterns themselves. They argue: 1) Demanding such an explanation is asking for something impossible (a non-Humean ground). 2) Science doesn't require this deeper ground; descriptive/predictive success is enough. 3) The "must" is an epistemic projection, not a feature of the world. **Consequence:** This is a fundamental divide. The Humean *must* accept that their explanation stops at the descriptive level. For some, this is austere honesty; for others, it's an unsatisfying abdication of explanatory duty.

  3.  **Symmetry Principles: Breaking the Simplicity/Strength Tradeoff?**
      *   **The Challenge:** Fundamental symmetries (e.g., Lorentz invariance, gauge symmetry, CPT) are widely regarded as *laws*. Yet, they often don't *add* empirical strength in the way MRL requires. They *constrain* what the *other* laws (the dynamical ones governing forces/matter) can be. Removing a symmetry principle might not reduce the number of *actual predictions* (since the dynamics might be adjusted to fit the data anyway), but it would make the system vastly more complex and *ad hoc*. Symmetries seem to contribute primarily to *simplicity* and *elegance* in a way that dominates the MRL balance, potentially existing *above* the tradeoff rather than within it. Can MRL really capture why Lorentz invariance is a fundamental law, not just a useful heuristic?
      *   **Why it Hurts:** This challenges the **adequacy of the MRL criteria**. If symmetries are genuine laws but don't fit neatly into the simplicity/strength optimization (acting more like meta-constraints), then MRL either misclassifies them or must stretch the notions of "simplicity" and "strength" beyond recognition. It suggests the MRL balance might be an artifact of *finding* laws, not defining what they *are*.
      *   **Humean Concession:** Humeans argue symmetries *do* contribute to strength *indirectly* by massively restricting the space of possible dynamical laws, making the system more informative about what *isn't* possible. They also contribute massively to simplicity. They *do* fit the tradeoff, just in a sophisticated way. **Consequence:** This requires a nuanced understanding of "strength" (excluding possibilities counts). It's a serious challenge but potentially manageable within a refined MRL framework.

  4.  **The Undermining Problem: Cost or Defeat?**
      *   **The Challenge:** In a world with genuine indeterministic chances (e.g., radioactive decay), the Humean identifies chances with the probabilities in the Best System. But consider a world where the actual initial conditions + history are such that, according to the very chances defined by the Best System for that world, it is *likely* that a different history would have occurred – one incompatible with the Best System itself being best (or even true!). The system undermines its own grounds. Lewis's "New Principle" (conditionalizing chances on the entire Humean mosaic) fixes the *consistency* but makes chances depend on the *entire future history* of the world, rendering them practically useless for prediction and arguably non-objective until the end of time.
      *   **Why it Hurts:** It highlights a deep **tension within the Humean account of chance**. Chance loses its core function (guiding credence about the future) if it depends on the entire future. It also seems bizarrely non-local in time. The fix feels *ad hoc* and sacrifices a key desideratum for objective chance.
      *   **Humean Concession:** This is widely acknowledged as a serious cost. Humeans (Loewer, Hoefer, etc.) argue: 1) The New Principle solves the technical consistency problem. 2) In *typical* worlds (like ours), the difference between the old and new principles is negligible. 3) Objectivity doesn't require *current* epistemic accessibility. **Concession:** It's an "ugly cost," a bullet to bite, but not necessarily a fatal flaw, especially if one accepts the New Principle. **Consequence:** Significantly weakens the appeal/plausibility of Humean chance compared to propensity or primitive chance accounts.

  5.  **Simplicity & Strength: Subjective or Objective?**
      *   **The Challenge:** The MRL account hinges on "best" = simplest + strongest. But simplicity is notoriously language-relative, context-dependent, and tied to human cognitive preferences. Strength depends on what we care to predict. Doesn't this make lawhood fundamentally *mind-dependent* or *perspectival*? Anti-Humeans ground lawhood in mind-independent modality.
      *   **Why it Hurts:** Threatens the **objectivity of laws**. If lawhood depends on our subjective weighting of pragmatic virtues, are laws *discovered* or *imposed*? This seems incompatible with scientific realism about laws.
      *   **Humean Concession:** Humeans concede that *judging* simplicity/strength involves human cognition. However, they argue: 1) There is often broad intersubjective agreement on what's simpler. 2) The virtues (simplicity, strength) track something objective about the *structure* of the universe – its compressibility. 3) *Every* theory of laws relies on epistemic virtues at some point (e.g., identifying which necessities are "lawlike"). **Consequence:** This is a *shared cost* across many theories, but it feels more acute for Humeanism because lawhood is *exhausted* by the system's virtues. It's a persistent vulnerability, not a decisive refutation.

  6.  **Uninstantiated Laws & Brute Catalogue Worlds (Counterintuitive Verdicts)**
      *   **The Challenge:** (a) *Uninstantiated Laws:* Imagine a world where only one fundamental force (e.g., gravity) is ever instantiated. Intuitively, the other forces aren't laws there. But if including Maxwell's equations (uninstantiated) makes the overall system *simpler* (e.g., by unifying descriptions of possible but non-actual interactions), MRL might count them as laws. (b) *Brute Catalogue Worlds:* In a chaotic, maximally complex world with no regularities, the "best" system might be just the complete catalogue of particular facts. MRL would say: "There are no laws." While logically possible, this feels like a misuse of the *concept* "law," which seems to presuppose some order.
      *   **Why it Hurts:** Produces **deeply counterintuitive verdicts** about what laws *are*. It seems laws should depend on what *actually* happens. A world with no laws shouldn't just be chaotic; it should be metaphysically impossible for laws *to exist* there, not just that they *don't*.
      *   **Humean Concession:** Humeans typically bite these bullets: (a) If including uninstantiated generalizations genuinely optimizes simplicity/strength for the *actual* mosaic (e.g., by providing a unified framework for possible measurements or counterfactual reasoning), then they *are* laws. (b) A maximally disordered world genuinely has no laws. **Concession:** These are counterintuitive consequences, but they argue intuition is a poor guide to fundamental metaphysics. The MRL definition is clear, even if it gives odd results in edge cases. **Consequence:** Highlights the revisionary nature of Humeanism. It forces acceptance of verdicts that clash with pre-theoretic intuitions about nomology.

  **Meta-Question: Insulated into Unfalsifiability?**

  *   **The Challenge:** Humeanism *does* exhibit significant insulation:
      *   Giving up HS (locality) for quantum mechanics.
      *   Inviting us to "hold fixed the rest of the system" when evaluating counterfactuals or chances (avoiding inferences about isolated facts).
      *   Defining "simplicity/strength" in ways that can accommodate challenges (like symmetries).
  *   **Is it a Problem?** Yes and No.
      *   **Yes:** It risks making Humeanism *unfalsifiable in principle*. Any apparent counterexample (non-locality, undermining, symmetries) can be absorbed by adjusting auxiliary hypotheses (supervenience base, interpretation of simplicity, adopting the New Principle). This weakens its empirical/contentful claims.
      *   **No:** *All* fundamental metaphysical frameworks (Physicalism, Idealism, Anti-Humeanism) exhibit similar insulation. They define core terms (matter, mind, necessity) and interpret evidence *within* that framework. Falsification happens when the cost of auxiliary adjustments becomes too high *relative to alternatives*. Quantum non-locality forced the abandonment of HS locality – that *was* a significant cost paid by Humeanism.
  *   **Humean Stance:** Humeans argue their view *is* falsifiable: if the world demonstrably contained irreducible modality or non-supervenient entities (e.g., Cartesian souls causally interacting with bodies), Humeanism would be false. The adjustments (like dropping locality) are responses to *empirical discoveries* (QM) that forced revision of a *contingent* component (HS), not the core supervenience/modality denial.

  **Conclusion & Ranking Summary:**

  1.  **Quantum Non-Locality:** Forces abandonment of core Humean locality. Most decisive if preserving local particulars was essential to your Humeanism. Converts it into a less distinctive global supervenience view.
  2.  **Explanatory Gap:** Highlights the anti-Humean advantage in grounding *why* patterns exist/persist. Most likely to cause genuine philosophical unease about explanatory depth.
  3.  **Symmetry Principles:** Serious stress test for the MRL criteria, requiring sophisticated handling of "strength".
  4.  **Undermining:** A significant cost requiring a major revision (New Principle), weakening Humean chance.
  5.  **Simplicity/Strength Subjectivity:** A persistent vulnerability, but a shared cost across metaphysics.
  6.  **Counterintuitive Verdicts:** Bullets Humeans bite; highlight the revisionary nature of the view.

  **The Hardest Pill:** If you deeply value metaphysical explanation (the "why" behind the patterns), **#2 (Explanatory Gap)** is likely the hardest to swallow. It's where the anti-Humean ontology most clearly seems to offer something the Humean fundamentally cannot – a ground for the patterns in intrinsic worldly modalities. The Humean response ("That's just how the mosaic is arranged") can feel like explanation-stopping resignation. The **Quantum challenge (#1)** is the most ontologically disruptive, potentially changing what it *means* to be a Humean today. Whether you can still "inhabit" the view after accepting global supervenience on a non-separable wavefunction is a deeply personal question.
