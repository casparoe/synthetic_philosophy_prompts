prompt: |-
  ok so I'm in a senior metaethics seminar, about 15 of us, one 90-minute block a week, and I've somehow been volun-told to lead one of the sessions. I want to do the wrong kind of reasons problem. You probably know the shape of it: there seem to be reasons to have an attitude that have nothing to do with whether the attitude is correct or fitting — the demon who'll torment you unless you believe some proposition, the boss who'll promote you if you find her joke funny. And the fitting-attitude / buck-passing picture says a thing is good just when it's fitting to admire it, so the objection is that these wrong-kind reasons are reasons to have the attitude but they clearly don't make the object good, so the picture looks like it breaks somewhere.

  The thing is I really don't want to stand up there and explain all that for the first 20 minutes and then run discussion questions. I want them to walk straight into it and feel it before I name anything. So I want an in-class activity — a game, a role-play, something staged with real (small) stakes — where they generate right-kind and wrong-kind reasons themselves, and then hit the wall: both kinds of reason are, in some thin sense, reasons to have the attitude, but only one kind makes the object worth admiring. And ideally they also feel the weirdness of not being able to just decide to admire something because there's a reward in it.

  Here's a half-formed idea so you know the flavor, but throw it out if you've got something better. Split the room into three juries of five. Give each jury three short fictional bios of people who've done something admirable but are also flawed. They have to crown one as the most admirable. The twist: at the start everyone draws a secret card assigning them a "stake" — if their jury ends up picking the candidate on their card, they get a small prize. Then the deliberation gets contaminated, because people have a reason to want to admire one of them. Make them write down privately why they admire their pick, rate how sincere it feels, and vote. Then maybe flip the payoffs — now the prize goes to the jury that picks the *least* admirable — and make them redo it, so they can feel that if a reward can move their admiration, it was never really about the candidate.

  What I need from you:

  - the actual rules and materials, including a payoff scheme that doesn't need real money (points, bragging rights, whatever)
  - make sure there's at least one genuinely ambiguous case in there, where the group can't easily agree whether the consideration is the right kind of reason or not — I don't want the sorting to be trivial
  - a realistic timeline for the 90-minute block, since I'm nervous about it going flat or being over in 20 minutes
  - the debrief: map specific moments in the activity onto the right-kind / wrong-kind distinction and onto the fitting-attitude analysis, but don't let the activity itself name any of that — they should only hear the labels at the end
  - what will predictably go wrong the first time I run it, and how to handle it
  - be honest about what the activity can't reproduce and that I'll have to supply myself in the debrief

  No citations or anything, I'll handle that part.
reasoning: |-
  Okay, the user is in a senior metaethics seminar and needs to lead a session on the "wrong kind of reasons" problem. They want an interactive activity instead of a lecture. Let me start by understanding their main goals. They want students to experience the distinction between right-kind and wrong-kind reasons firsthand, without immediately labeling the concepts. The activity should create a situation where students have external incentives to adopt certain attitudes, leading them to feel the conflict internally.

  The user's half-formed idea involves juries evaluating candidates with secret stakes. That's a good start. I need to refine it to ensure it's engaging and fits the time frame. First, the group size: 15 students split into three juries of five. Each jury needs candidates to evaluate, so creating three candidate profiles with both admirable and flawed traits is essential. One candidate should be ambiguous to spark debate on whether certain reasons are valid.

  Next, the payoff scheme. Using points that convert into a non-monetary reward like choosing discussion topics avoids real money. The secret role cards for each student should have different stakes: one with a personal stake in a candidate, one with a stake against, and others neutral. This setup introduces wrong-kind reasons naturally as students might push for a candidate due to rewards, not genuine admiration.

  Timing is crucial. The session is 90 minutes. I should allocate time for introduction (5 mins), activity setup (10 mins), first deliberation and vote (20 mins), payoff reveal and flip (5 mins), second deliberation and vote (15 mins), private reflection (5 mins), and debrief (30 mins). The debrief is where the concepts are explained, linking the activity to the fitting-attitudes analysis.

  Potential issues: students might not engage in role-play, or the discussion could be superficial. To mitigate, emphasize that the prizes are symbolic but encourage them to "want to win." Also, the ambiguous candidate should have traits that are debatable, like a whistleblower with complex motives, to ensure deeper analysis. During the debrief, explicitly point out moments where external incentives influenced their judgments, contrasting with sincere admiration.

  What might go wrong? If one jury finishes early, have a reflection task ready. If debates stall, provide discussion prompts. Neutral observers from other juries can help if someone is absent. The activity can't fully replicate the involuntary nature of admiration, so in the debrief, highlight how trying to force admiration for rewards felt insincere, tying it to the philosophical problem.

  Materials needed: candidate profiles, role cards, voting sheets, reflection prompts, and a scoreboard. Keep instructions clear and concise. The payoff flip after the first vote introduces the dynamic that admiration shouldn't shift with incentives, reinforcing the difference between right and wrong-kind reasons.

  Finally, in the debrief, map the activity stages to the metaethics concepts. Use their experiences to explain how wrong-kind reasons don't make the object admirable, even if they motivate the attitude. Connect this to the fitting-attitudes account and the demon/boss examples. Emphasize that the activity's limitation is that real admiration can't be willfully adopted for rewards, which mirrors the philosophical issue.
answer: |-
  Here's a polished, ready-to-run activity designed to make the "wrong kind of reasons" problem visceral, based on your core idea but refined for impact and timing within 90 minutes.

  **Activity Title:** The Admiration Gauntlet

  **Core Concept:** Students experience generating reasons for admiration (a pro-attitude) under pressure from external incentives (wrong-kind reasons) vs. inherent qualities (right-kind reasons), leading to the intuitive clash the fitting-attitudes account faces.

  **Learning Goal:** To *feel* the tension that (1) incentives *are* motivating reasons to adopt an attitude, but (2) these incentives seem irrelevant to whether the object *deserves* that attitude (is admirable/good).

  ### Materials
  1.  **Candidate Profiles (3 per Jury - Print 3 sets):** Short bios (3-4 sentences each). Key: One clearly admirable, one clearly flawed, one *ambiguous* (the crucial element).
      *   **Example Set:**
          *   **"The Rescuer":** Volunteered for months with a dangerous mountain rescue team, saving 12 lives. Known to be gruff, dismissive of authority, and sometimes takes unnecessary risks putting others slightly in danger. (Most Admirable - RKR Focus)
          *   **"The Whistleblower":** Exposed massive fraud in their company, saving thousands of jobs and pensions. Did so anonymously initially, but leaked documents also contained unrelated, embarrassing personal emails of low-level employees. Motive seems mixed (justice vs. grudge?). (AMBIGUOUS - RKR/WKR Battleground)
          *   **"The Patron":** Donated a vast fortune to build a state-of-the-art children's hospital in an underserved area. Publicly credits the donation solely for the massive tax break received and is known for ruthless, exploitative business practices to amass the wealth. (Least Admirable - Flaws dominate)
  2.  **Role Cards (15 total - Print 1 set per jury, shuffle within jury):**
      *   **Type A: Stake FOR Candidate X (1 per candidate per jury):** "If Candidate [Name] is chosen as MOST admirable by your jury, you gain 2 POINTS."
      *   **Type B: Stake AGAINST Candidate Y (1 per candidate per jury):** "If Candidate [Name] is chosen as LEAST admirable by your jury, you gain 2 POINTS." (Assign Y to be *different* from the candidate the Type A cardholder for X wants).
      *   **Type C: Neutral Observer (2 per jury):** "You gain 1 POINT only if your jury reaches a UNANIMOUS decision (most or least admirable). Focus on finding genuine reasons."
  3.  **Voting Sheets (Per Jury):** Simple sheet with Candidate Names and columns for "Vote (Most)", "Vote (Least)", and "Brief Reason".
  4.  **Private Reflection Sheet (Per Student):**
      *   After 1st Vote: "Briefly state why you voted for your 'Most Admirable' candidate. Rate how sincere your admiration feels (1=Not at all, 10=Completely)."
      *   After 2nd Vote: "Briefly state why you voted for your 'Least Admirable' candidate THIS TIME. Did your *actual feeling* of admiration for any candidate change significantly because of the points? Why/Why not?"
  5.  **Scoreboard (Whiteboard/Poster):** Columns for Jury 1, 2, 3. Rows for Round 1 Points, Round 2 Points, Total Points.
  6.  **Prizes (Non-Monetary):** Points translate to "Philosophical Capital" (PC). Top scorer(s) get to choose the *topic* for a 5-minute "lightning round" discussion at the *start* of the *next* seminar session (e.g., "Is boredom a fitting attitude towards Kant?" or "Should we admire effective altruists?"). Bragging rights suffice if needed.

  ### Rules & Flow (90-Minute Timeline)

  1.  **Introduction & Setup (10 mins):**
      *   "Today, we're stepping into the shoes of an 'Admiration Committee'. Your task is simple: evaluate candidates based on their admirability." (DO NOT mention reasons, fittingness, or the philosophical target yet!).
      *   Split into 3 juries (5 students each).
      *   Give each jury their set of 3 Candidate Profiles. "Read these carefully. Discuss freely *who you genuinely find most admirable and why* for 5 minutes. **Do not vote yet.**" (This primes RKR thinking).
      *   Distribute **SECRET Role Cards** face down within each jury. "Look at your card privately. Do NOT reveal it to others. It tells you how to gain points in this activity. Points = Philosophical Capital (PC) = influence next week's start. Points depend on your jury's final vote."
      *   Clarify: "Your job is still to argue for who is *most admirable*, but your card gives you a personal stake in the outcome."

  2.  **Round 1: Crown the Most Admirable (20 mins):**
      *   "Juries, deliberate for 10 minutes. Your goal is to reach a consensus (or majority vote if needed) on **ONE candidate as the MOST admirable**. Remember your secret stakes! Record your jury's vote on the Voting Sheet."
      *   **Instructor:** Circulate! Listen for:
          *   Arguments based on candidate actions (RKR).
          *   Arguments subtly (or not-so-subtly) influenced by personal stakes ("Maybe The Patron isn't so bad, that hospital *is* impressive..." from someone with a FOR-Patron card).
          *   Frustration from Neutral Observers pushing for "real" reasons.
          *   Slippery arguments about the Ambiguous candidate ("The Whistleblower *did* get results, motives are murky anyway..." - is this RKR or masking WKR?).
      *   **Vote & Record (5 mins):** Juries submit votes. Instructor records "Most Admirable" choice for each jury on the scoreboard. Distribute **Private Reflection Sheet Part 1**. Students write their *individual* reason for voting (even if overruled) and sincerity rating. **Collect these immediately** (they are for debrief, not shared yet).

  3.  **The Twist & Round 2: Crown the *Least* Admirable (15 mins):**
      *   "Surprise! Now, your jury must choose **ONE candidate as the LEAST admirable**." (This flips incentives).
      *   "**Crucially, your Role Card payoffs STILL APPLY, but to the *new vote*!**" (Reveal this clearly):
          *   Type A (FOR X): Now only get points if X is chosen as *LEAST* admirable? (Probably not! Depends on their view).
          *   Type B (AGAINST Y): Now get points if Y is chosen as *LEAST* admirable? (Likely yes!).
          *   Type C (Neutral): Still need UNANIMOUS vote (most or least) to get points.
      *   "Deliberate for 8 minutes. Goal: Consensus/Majority on the LEAST admirable. Record vote."
      *   **Instructor:** Circulate! Listen for:
          *   Shifting justifications ("Okay, maybe The Rescuer *was* reckless...").
          *   Strategic voting based on points.
          *   Confusion/frustration ("But I *just* argued Patron was admirable-ish!").
          *   Attempts to distinguish "what I really think" from "what gets points".
      *   **Vote & Record (5 mins):** Juries submit "Least Admirable" votes. Record on scoreboard. Distribute **Private Reflection Sheet Part 2**. Students complete it. **Collect immediately**.

  4.  **Reveal & Calculate Points (5 mins):**
      *   Reveal all Role Cards within juries. ("Show each other your cards now").
      *   Based on the *two* votes (Most & Least Admirable), calculate points for each student according to their card rules.
      *   Tally points per jury on the scoreboard. Declare top PC earners (bragging rights/next week's choice).

  5.  **Debrief: From Experience to Theory (30 mins - CRITICAL):** *Now* introduce the labels and map the activity.
      *   **(5 mins) Elicit Experiences:**
          *   "What was it like arguing about 'admirability' with a secret stake?" (Frustration? Strategy? Sincerity issues?)
          *   "Did anyone feel their *actual feeling* of admiration shift because of the points? Or did you just argue strategically?" (Highlight the distinction between *motivation* and *fittingness*).
          *   "Focus on the Ambiguous Candidate. What kinds of reasons were given *for* and *against* them? How did the points/stakes influence this?" (Tease out the RKR/WKR blur).
      *   **(15 mins) Map to Concepts (WRITE KEY TERMS NOW):**
          *   "What were the main reasons people gave for *why* a candidate was admirable? Where did those reasons point? (Towards the candidate's properties/actions). We call these **Right-Kind Reasons (RKR)** for admiration. They seem directly about *whether the person deserves admiration*."
          *   "What were the reasons people had for *wanting their jury to pick* a particular candidate? Where did *those* reasons point?" (Towards the *consequences for the admirer* - points, avoiding loss). "We call these **Wrong-Kind Reasons (WKR)**. They are reasons *to bring it about that you have the attitude* (admiration), but they aren't about whether the attitude *fits* the object."
          *   **The Wall:** "Both RKR and WKR motivated people to *have* or *argue for* admiration, right? BUT... did anyone feel that the WKR (like getting points) actually made the candidate *more admirable*? Did the points change *what made the candidate good*? Or did they just change what you *did*?" (Emphasize: WKR motivate attitude *adoption*, not attitude *fittingness*).
          *   **The Weirdness:** "Think about your Private Reflections. Could you just *decide* to genuinely admire the Patron because you had a 'FOR' card? Or did it feel forced, fake? Why?" (Link to the involuntariness/doxastic wrongness of trying to believe for reward).
      *   **(10 mins) Connect to Fitting-Attitudes/Buck-Passing:**
          *   "Recall the fitting-attitudes analysis: X is good = It is fitting to value (admire/love/desire) X."
          *   "The problem we just experienced is THE 'Wrong Kind of Reasons Problem' for this view."
          *   "The Demon/Boss Examples: The demon gives you a WKR to *believe* P (avoid torture). The boss gives you a WKR to *find the joke funny*. But these WKR don't make P *true* or the joke *funny*, just like your points didn't make the Patron *admirable*."
          *   "The challenge: How can the fitting-attitudes account distinguish RKR (which make X good) from WKR (which motivate attitude adoption but don't make X good)? If both are 'reasons for the attitude', how do we filter out the WKR?"
      *   **(5 mins) Wrap-up & Point Forward:** Briefly acknowledge proposed solutions exist (object-given/subject-given, state-given/object-given distinctions, reasons as evidence) but emphasize the *problem* arose naturally from their experience. Assign follow-up reading if applicable.

  **What Will Go Wrong & How to Handle It:**

  1.  **Students Don't "Role-Play" the Stakes:** Some might ignore points. **Mitigation:** Emphasize "Philosophical Capital" (PC) as real influence (choosing next topic). Enthusiastically track points. Remind during deliberation: "Remember your PC is on the line!". Circulate and probe: "How does your card factor in for you?".
  2.  **Debate Stays Superficial (Especially on Ambiguous Candidate):** **Mitigation:** During setup ("genuine discussion" phase), ask probing questions: "What *exactly* makes the Whistleblower's act admirable? What undermines it? How do we weigh motives vs. outcomes?" Give juries discussion prompts if stuck: "Rank the candidates on: Courage, Impact, Moral Purity. Where do they differ?".
  3.  **One Jury Finishes Way Early:** **Mitigation:** Have a short reflection task ready: "Individually, jot down one RKR and one WKR you observed or felt during deliberation." Or ask them to predict outcomes of other juries.
  4.  **Unanimous Votes Too Easy/Hard (Affecting Type C):** **Mitigation:** The ambiguity should prevent easy unanimity. If a jury is deadlocked on Round 2, remind them majority vote is allowed (Type C just loses their bonus point chance). The point loss for Type C is minor; the card primarily shapes their *focus*.
  5.  **Someone Reveals Their Card Early:** **Mitigation:** Stress secrecy strongly upfront. If it happens, say: "Interesting! Now we'll see how *transparent* stakes change the dynamic. Carry on." It becomes data for debrief.
  6.  **Argument Gets Heated/Personal:** **Mitigation:** Set ground rules: "Challenge ideas, not people. Remember the 'candidates' are fictional." Intervene gently if needed: "Let's focus back on the candidate's actions described."

  **What the Activity Can't Do (Needs Debrief Supplement):**

  1.  **The Deep Involuntariness:** While students will *feel* the insincerity of "trying to admire," the activity can't perfectly replicate the *impossibility* of just *choosing* to have a genuine fitting attitude (like belief) solely for WKR. **Debrief:** Explicitly draw this out using their reflection on forced admiration and link it to the doxastic puzzle.
  2.  **Full Nuance of Solutions:** The activity brilliantly surfaces the problem but doesn't model sophisticated responses (e.g., distinguishing object-given vs. state-given reasons). **Debrief:** Acknowledge solutions exist but frame the activity as experiencing the *core tension* those solutions must resolve.
  3.  **Non-Admiration Attitudes:** It focuses on admiration. **Debrief:** Explicitly connect to the boss/demon examples (humor, belief) and the general fitting-attitudes schema ("valuing" in general) to show the problem's breadth.
  4.  **Abstract Nature of "Fittingness":** The activity relies on the intuitive sense of "deserving admiration." **Debrief:** When introducing fittingness, explicitly connect it to their experience of feeling that some reasons "hit the mark" regarding the candidate's worth, while others (WKR) felt like external manipulation.

  **Why This Works:** It makes the abstract problem concrete and personal. Students *generate* RKR and WKR naturally through deliberation under incentive pressure. They *feel* the motivational force of WKR contrasted with their intuitive sense of what actually makes something admirable (fittingness). The flip in Round 2 heightens the sense that admiration shouldn't shift with incentives. The debrief directly maps their lived experience onto the precise metaethical puzzle. Good luck – it should be a memorable session!
