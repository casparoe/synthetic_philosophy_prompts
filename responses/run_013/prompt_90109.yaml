prompt: |-
  I'm a novelist — three books in, the last two about a Caribbean-British family not unlike my own — and I keep running into a pattern I don't have a word for. The obvious labels all seem slightly off, so let me just describe it and see what you make of it.

  In my second novel there's a character, the eldest son, who steals from his mother's savings and then lies about it to everyone. When the book came out I got two letters, one from each side of an argument I hadn't realised I was walking into. The first said: thank you for showing us as we are, we're not saints, and any portrait that pretends otherwise is a lie that serves the people who want us to be either angels or animals. The second said: why did you have to make him a thief? You've handed them another stick to beat us with, and you knew they'd use it. Both letters came from people who loved the book. Both came from people who'd lived through the same things I had.

  What gets me is that the disagreement isn't about facts — everyone agrees there are Caribbean-British men who steal from their mothers. And it isn't really about whether art should be political either; everyone in the room agrees it is, whether it wants to be or not. It's about something stranger: whether a depiction's meaning is fixed by the person who made it or by the uses it gets put to afterwards. I keep trying to seperate the two questions — what the book says and what people do with it — and I can't. And I've noticed the second letter is right in a way I can't argue with. The same passage that reads as honesty in one decade reads as betrayal in the next, and I've got no control over that. So the political force of what I write isn't a property of the writing at all — it's something that happens to it later, in other people's hands, and getting the depiction right doesn't secure it. That's the bit I can't find a name for. I've come across the idea — I couldn't tell you who said it first — that all art is propaganda whether it admits to it or not, and I think there's something in it, but it's too general for this. It makes the problem sound like a choice about content, whereas what I'm describing operates whatever content I choose.

  So: is there an established name for this exact structure? If there is, I want the carving, not just the label — what the thing is, what it isn't, and how it differs from the nearest concepts, with a verdict on which of those nearest concepts actually fits best even if none fits exactly. If there isn't a name, coin one and define it, and give me boundary cases: tell me what would have to be true for the phenomenon to be absent, and describe a case where both of my letters would be wrong. And I definately don't want a reading list — I want the idea.

  Please don't lay out the options and leave me to pick. I want your actual position — which concept you think this is, or what you'd call it, and the reasoning that gets you there. If you think I've misdescribed my own experience, say so and say why. Take the role of a philosopher of art who actually knows the twentieth-century debates about art and politics — I'd rather have someone who knows the terrain than someone who invents something from scratch. Think it through carefully, and start by brainstorming a few candidate concepts and testing each against my two letters before you commit.
reasoning: |-
  Okay, the user is a novelist who's written about a Caribbean-British family and is grappling with a specific artistic dilemma. They described how readers had opposing reactions to a character who steals from his mother—one praising the honesty, the other criticizing it as feeding harmful stereotypes. The core issue isn't about factual accuracy or whether art is political, but about how a work's meaning shifts based on context and reception, beyond the creator's control.  

  Hmm, the user explicitly rejects simplistic labels ("propaganda," "artistic freedom") and wants precision. They’re not asking for theory dumps but a sharp conceptual tool. Their frustration is palpable: they’ve lived this tension, and academic jargon won’t cut it. The real ask is for a framework that disentangles authorial intent from political instrumentality without pretending they can be fully separated.  

  First, brainstorming candidate concepts:  
  - **Reception Theory (Jauss/Iser)**: Focuses on how readers create meaning. But it’s broad—doesn’t specify the *political weaponization* aspect.  
  - **Conventionalism (Danto)**: Meaning depends on artworld context. Close, but too focused on institutional framing, not real-world political misuse.  
  - **Semantic Externalism (Putnam/Kripke)**: Meaning isn’t just in the head but tied to external factors. Useful but not art-specific.  
  - **Discursive Capture**: My own coinage? The idea that depictions are "captured" by dominant narratives and repurposed. Needs testing.  

  Testing against the letters:  
  The first letter sees the theft as a reclaiming of complexity ("not saints"), valuing authorial authenticity. The second fears hostile repurposing ("handed them a stick"). Both validate that meaning is *relational*—it’s about who uses the work and how. "Discursive Capture" fits because:  
  1. **Authorial Intent Isn't Erased**: The authenticity praised in Letter 1 remains.  
  2. **But It’s Overwritten by Deployment**: The same passage becomes "ammunition" when inserted into an oppressive discourse.  
  3. **Power Dynamics Are Key**: The theft scene isn’t inherently damaging; it becomes so when wielded by those reinforcing stereotypes.  

  Boundary cases:  
  - **Absence of the Phenomenon**: If society were post-racial (fantasy), the depiction couldn’t be weaponized. Or if the work remained obscure.  
  - **Both Letters Wrong**: If the scene were universally read as absurd satire, impossible to take literally. But that’s unrealistic given lived experience.  

  Why other terms fail:  
  - "Misappropriation" is too narrow (implies illegitimacy; but Letter 2’s fear is legitimate).  
  - "Reception Theory" ignores power asymmetry.  
  - "Propaganda" reduces art to intent, ignoring external repurposing.  

  User’s meta-need: They want to *write freely* without naïveté about reception. Naming this "Discursive Capture" acknowledges the risk without conceding that art must self-censor. The term also subtly honors their insight—it’s not about content but about how discourse *captures* content.  

  Final note: User’s brilliance is in spotting that "getting the depiction right doesn’t secure it." That’s the heart. No term fixes it, but naming the mechanism might lessen the vertigo.
answer: |-
  What you're describing is a profound and under-theorized tension at the intersection of aesthetics, politics, and semiotics. After testing several concepts against your case (reception theory, conventionalism, semantic externalism, and the intentional fallacy), the closest existing framework is **semantic externalism** (from philosophy of language)—but it requires significant reframing to fit. Since no established term fully captures your phenomenon, I propose a new one: **Discursive Capture**. Let me carve the concept precisely.

  ---

  ### **The Core Phenomenon: Discursive Capture**
  **Definition:** *The process by which a depiction's political meaning and social impact are determined not by authorial intent or inherent content, but by its subsequent mobilization within dominant power structures and narratives, often overriding or repurposing its original context.*

  #### **Why This Fits Your Letters:**
  1. **Letter 1 ("Thank you for showing us as we are")** responds to the depiction *as authored*—its intent to reflect complexity.  
  2. **Letter 2 ("You've handed them a stick to beat us with")** responds to the depiction *as captured*—its weaponization by antagonistic narratives.  
  3. **The disconnect** arises because the depiction’s *truth-value* (acknowledging flawed humanity) is irrelevant to its *political instrumentality* (reinforcing stereotypes when inserted into racist discourse).  

  #### **Key Mechanisms:**
  - **Power-Dependent Semantics:** Meaning isn't fixed at creation. It’s contingent on who deploys the work, their authority, and the cultural narratives they reinforce (e.g., a Caribbean-British thief might signify "resistance to respectability politics" in one discourse, "inherent criminality" in another).  
  - **Authorial Irrelevance:** Your intent ("I wrote this to show complexity") cannot quarantine the work from hostile uses. As you note, the same passage can flip from "honesty" to "betrayal" based on shifting discourse.  
  - **Non-Volitional Politics:** The work’s political force isn’t chosen by you; it’s *assigned* through its uptake. Even "neutral" content can be captured (e.g., a mundane detail weaponized as "proof" of pathology).  

  ---

  ### **What Discursive Capture Is NOT (Boundary Cases):**
  | Concept              | Why It Doesn’t Fit Your Case                                                                 | Boundary Case for Absence |
  |----------------------|---------------------------------------------------------------------------------------------|---------------------------|
  | **Reception Theory** | Focuses on individual interpretation, not systemic political mobilization.                  | If readers lacked access to dominant narratives (e.g., an isolated society with no anti-Caribbean stereotypes). |
  | **Intentional Fallacy** | Concerned with misreading authorial intent, not weaponization by power structures.          | If the work existed in a vacuum with no social/political discourse (impossible, per your insight that art is always political). |
  | **Propaganda**       | Assumes meaning is *encoded* by the creator. Your problem is meaning is *re-engineered* by receivers. | If your depiction could only be read one way (e.g., a mathematical equation). |
  | **Misappropriation** | Implies illegitimate use. But Letter 2’s fear is *predictable*—not a distortion, but an expected deployment. | If hostile groups lacked the cultural authority to amplify their reading (e.g., a powerless fringe group). |

  ---

  ### **Why "Discursive Capture" Over Existing Terms?**
  1. **Semantic Externalism** (Putnam/Kripke): Gets closest—meaning depends on external factors—but is too broad. It covers how "water" means H₂O, not how art is politicized. *Discursive Capture* specifies the *mechanism*: capture by discourse.  
  2. **Conventionalism** (Danto): Art’s meaning relies on an "artworld." But your issue transcends art institutions—it’s about societal power dynamics.  
  3. **Reception Aesthetics** (Jauss/Iser): Centers the reader’s role, but ignores how power imbalances shape which readings gain traction.  

  **Your Insight Validated:** You’re correct that content is secondary. Even if you wrote a saintly Caribbean-British family, it could be captured as "exception that proves the rule" or "whitewashed propaganda." Discursive Capture operates at the level of *framing*, not content.

  ---

  ### **A Case Where Both Letters Would Be Wrong**
  **Scenario:** Your thief character exists in a satirical universe where *every* ethnic group’s elders are robbed by their children (e.g., Italian mafia sons, British aristocrats), and the narrative explicitly frames this as a universal human folly.  
  **Why both letters fail:**  
  - Letter 1’s gratitude ("showing us as we are") is misguided—the depiction isn’t "authentic" but absurdist.  
  - Letter 2’s fear ("handed them a stick") is neutralized—the thief trope can’t be weaponized against Caribbean-Brits specifically; it’s deliberately de-racialized.  
  **Here, Discursive Capture fails because the work’s internal framing dominates external narratives.** It’s inoculated against selective interpretation.

  ---

  ### **My Verdict**
  You’ve identified a gap in aesthetic theory: most frameworks treat meaning as either authored or received, but ignore how power *redeploys* art within oppressive systems. **Discursive Capture** names this. It’s not about "getting depictions right" (which assumes meaning is intrinsic), but recognizing that art is a *contingent resource* in ideological battles. Your letters expose this: both readers accepted the "facts," but one saw the depiction as *theirs to control*, while the other saw it as *vulnerable to capture*.  

  This isn’t misdescription—it’s acute observation. The 20th-century debates (Adorno, Sartre) fixated on art’s *inherent* politics. You’ve exposed a harder truth: the artist’s political agency lies not in crafting messages, but in anticipating how their work might be conscripted—and deciding whether to write anyway.
