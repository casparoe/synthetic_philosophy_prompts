answer: |-
  **What minimal cognitive capacity must a system possess to grasp the norms governing a concept, as opposed to merely conforming to those norms?**

  The debate surrounding whether Large Language Models (LLMs) possess genuine understanding often stalls due to a conflation of two distinct questions. The first question concerns *determinate representational content*: is there a fact of the matter about what internal states of the LLM (e.g., activation patterns, weight configurations) represent or are about? The second question concerns *normative grasp*: if we grant that the LLM's states have *some* determinate content, does the system genuinely grasp the norms governing the concepts it deploys? This includes understanding the conditions under which applying a concept is correct or incorrect, and the inferential commitments (what follows from applying the concept, what it follows from) that constitute its meaning.

  Arguments against LLM understanding frequently employ analogies like "stochastic parrots" or "Chinese Rooms," emphasizing the lack of intrinsic meaning or intentionality. These critiques primarily target the *normative grasp* question, suggesting LLMs merely manipulate symbols according to syntactic rules without comprehending the semantic norms governing their correct use. Conversely, proponents of LLM understanding typically marshal empirical evidence demonstrating sophisticated behavior: the ability to generalize to novel prompts, pass probing classifier tests that suggest structured internal representations, or perform well on benchmarks requiring complex reasoning. However, this evidence speaks most directly to the *determinate representational content* question. It shows that the system reliably associates inputs with outputs in ways consistent with *some* underlying representational scheme, and that this scheme exhibits structure and generalization power. Crucially, demonstrating that an internal state reliably correlates with, or causally mediates behavior associated with, a concept (e.g., "cat") does not, by itself, demonstrate that the system grasps the *norms* for correctly applying "cat" (e.g., that applying it to a dog is a mistake with specific inferential consequences). The system might simply be tracking complex statistical regularities that happen to coincide with the norms humans follow.

  The central problem, therefore, is that the core disagreement often involves participants arguing past each other: critics demanding evidence for normative grasp while defenders provide evidence for sophisticated representational capacity and behavioral conformity. Resolving the stalemate requires isolating and rigorously investigating the second question: what, precisely, distinguishes merely conforming to a norm from genuinely grasping it? Existing positions largely assume an answer to this question rather than explicitly defining the required capacity. Critics often implicitly assume grasp requires consciousness, biological embodiment, or forms of intentionality deemed impossible for computation. Defenders often implicitly equate reliable conformity (even highly complex, generalizable conformity) with understanding. Neither side adequately articulates the *minimal* cognitive requirement for normative grasp itself.

  This project adopts a primarily *conceptual* methodology, appropriate given the nature of the core question – defining a constitutive capacity – and the lack of access to lab resources or proprietary LLMs. The work will proceed over one semester as follows:

  1.  **Clarifying the Distinction (Weeks 1-4):** Precisely analyze the concepts of "conforming to a norm" versus "grasping a norm," drawing on philosophical work concerning rule-following, concept possession, and the nature of norms (semantic, inferential). Key will be distinguishing reliable, even intelligent, behavior that *accords* with a norm (e.g., always stopping at red lights due to rigid programming) from behavior guided *by the recognition of the norm itself* as a standard for correctness. The focus is on the *intrinsic* cognitive relation of the system to the norm.
  2.  **Articulating Candidate Markers for Grasp (Weeks 5-8):** Develop and critically evaluate potential minimal criteria for normative grasp that avoid relying on controversial assumptions like consciousness. The leading candidate to be explored is the capacity to *represent the norm itself* and for this representation to play a *motivating* or *regulative* role in the system's operations. This involves:
      *   Defining what it means for a system to have internal states that *represent the norm* (e.g., representing "Applying concept C to object O is correct only if O has properties P1...Pn" or "From 'X is C' it follows that 'X is D'").
      *   Defining what it means for the system to be *moved by* this representation – for the represented norm to function as a *reason* guiding processing, error detection, or belief revision, rather than merely being a passive element in a causal chain leading to conforming behavior.
      *   Contrasting this with systems that merely implement complex functions whose outputs happen to conform to the norm without representing it *as* a norm.
  3.  **Applying the Framework to the LLM Debate (Weeks 9-12):** Utilize the developed conceptual framework to re-examine the LLM understanding debate.
      *   Analyze whether current empirical evidence (e.g., from interpretability research like probing or circuit analysis) provides any traction on whether LLMs internally represent norms governing concept use and are motivated by them, or merely exhibit complex conformance.
      *   Critically assess arguments from both sides (e.g., the "parrot" charge vs. behavioral generalization evidence) through the lens of the clarified distinction.
      *   Explore hypothetical architectural or functional features an artificial system *would* need to meet the proposed minimal criterion for normative grasp.

  A successful outcome for this project would be: (1) A clearly articulated and philosophically defensible distinction between merely conforming to a norm and grasping it, centered on the minimal capacity to represent the norm and be motivated by it; (2) A demonstration of how applying this distinction clarifies the existing LLM understanding debate by showing what specific capacity critics deny and defenders need to establish beyond behavioral competence and representational determinacy; (3) Identification of the *kind* of evidence (e.g., specific internal functional architectures or processing patterns) that would be relevant, though perhaps not conclusive, for assessing normative grasp in artificial systems according to the proposed criterion.

  The project would fail if: (1) The distinction between conformance and grasp cannot be made sufficiently clear or compelling at the required minimal level; (2) The proposed candidate marker (representing & being moved by the norm) collapses back into behavioral conformity under analysis, or proves incoherent as a minimal requirement; (3) The application to the LLM debate yields no new insight, merely restating existing positions without clarifying the underlying disagreement.

  This project is ambitious but feasible for a semester. The core task is conceptual analysis and framework development, not exhaustive literature review or novel empirical work. Focusing on articulating *one* specific minimal criterion (representation + motivation) provides a manageable scope. Success hinges on rigorous philosophical argumentation to establish the plausibility and utility of the distinction and the proposed marker. While definitive answers about actual LLMs may remain elusive without empirical access, the primary goal is to provide a sharper conceptual toolkit for framing the debate, which is achievable within the timeframe. The workshop presentation will focus on presenting the clarified distinction, the proposed minimal criterion for grasp, and its implications for interpreting the LLM debate.
