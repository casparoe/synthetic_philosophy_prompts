  The core tension is about falsifiability as a demarcation criterion. Popper's later view was that natural selection *is* testable when combined with auxiliary hypotheses (genetics, etc.). But creationists misrepresented his early isolated remark. The Dover court rightly noted that even if evolution had falsifiability debates (resolved per Popper), ID lacked *any* testable framework. 

  I should emphasize Popper's Lakatosian "research programme" angle: natural selection is the "hard core," protected but testable indirectly. ID has no comparable structure. The user also asks if this makes *every* theory unfalsifiable alone. The answer is yes—but science progresses by testing networks, not isolated claims. 

  For the historical sciences point: Popper's falsifiability works differently here. Evolution uses "retrodictive" tests (fossil sequences, etc.), which Popper accepted. The Dover court didn't need absolute falsifiability; it needed ID to meet *minimal* scientific standards, which it failed. 

  Where Popper is silent: The trial centered on constitutional issues (establishment clause), not just philosophy. His framework doesn't address that. Also, ID's lack of positive evidence was crucial legally but outside falsifiability's scope. 

