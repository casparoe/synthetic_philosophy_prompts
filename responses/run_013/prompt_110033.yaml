prompt: |-
  I'm taking a seminar on aesthetics and politics, and the sessions on Du Bois have left me with a problem I can't get past. Everyone in the room is happy to evaluate his position — his insistence that art is always propaganda, that the purist who claims to stand above politics has not thereby escaped it, and his related claim that beauty and political purpose need not be enemies — but nobody has said what a theory of that kind would actually have to deliver before it can be judged. I'd like the specification first. So: write the desiderata for an adequate theory of politically engaged art of the sort Du Bois was reaching for. What must such a theory be able to do — which cases must it get right, which distinctions must it not collapse, which facts about how art and audiences actually behave must it not contradict? For each requirement, give me the case or consideration that motivates it, and mark whether it is non-negotiable or merely the prejudice of one camp.

  I have a rough list of candidates and I want you to pressure-test, correct, and extend it rather than simply accept it. First, the theory has to make sense of the asymmetry: a novel about lynching is propaganda while a novel about suburban ennui is not, and the theory must explain why the accusation attaches to some work and not other work without quietly conceding that apolitical art is a neutral baseline. Second, it has to handle what I've been calling the double-audience problem. Work made for the group — think of the four conditions Du Bois laid down in the mid-1920s for a real Black theatre, that its plays be about Black life, written by Black authors, aimed primarily at Black audiences, and staged in Black neighborhoods — and work made to change the minds of the dominant group pull in different directions, and a theory has to say which is prior, or how a single work can serve both. Third, it has to survive the recurring fight over honest depiction versus uplift: whether a novel that shows crime, sexual frankness, or self-doubt inside the community is truthful art or ammunition for racists. Fourth, it has to keep being good as art distinct from being effective as propaganda, or the theory dissolves into a theory of messaging. Fifth, it has to say who the propagandist answers to — the party, the patron, the editor of a movement's own magazine who is at once its chief publicist and its chief literary critic — and whether the theory can avoid resting on a vanguard's authority. And sixth, it has to say something about scope: is this a theory of Black American art, of political art generally, or of all art whatsoever?

  Two things I want most from you. Flag any pair of these requirements that cannot be jointly satisfied — I suspect the honesty requirement and the effectiveness requirement pull against each other, and that the claim that all art is propaganda threatens to make the whole position self-undermining, since it removes the ground for criticizing political art as such; if that is right, I want it stated as a result about the specification rather than smoothed over. And tell me which single requirement does the most to exclude candidate views. Then, briefly, say where Du Bois's own position meets its own specification and where it fails it. Keep the weight on the criteria and the reasoning behind them; I don't want a survey of who said what, and please don't give me a reading list — I can find the texts, and a model without a library should be able to answer this from the requirements themselves.
reasoning: |-
  Okay, the user is deeply engaged in a seminar on aesthetics and politics, specifically wrestling with Du Bois's views on art as propaganda. They've presented six desiderata for a theory of politically engaged art and want rigorous analysis—pressure-testing, identifying tensions, and evaluating Du Bois against his own framework. 

  First, I need to map their core frustration: they feel discussions skip the foundational step of defining what an adequate theory must *do*. Their list is sophisticated but possibly internally contradictory. The urgency is philosophical clarity, not literary survey. 

  Breaking down their six requirements:  
  1. **Asymmetry**: Must explain why "propaganda" sticks to certain art (e.g., lynching novel) but not others (suburban ennui). Non-negotiable—it’s the litmus test for avoiding "apolitical art as neutral" fallacy.  
  2. **Double-audience**: Can art serve both marginalized in-group and dominant out-group? Motivated by Du Bois’s Black theater criteria. Likely a fault line between integrationist vs. separatist aims.  
  3. **Honesty vs. uplift**: Truthful depiction (crime, sexuality) risks weaponization by oppressors. Echoes Harlem Renaissance debates (Du Bois vs. Hughes).  
  4. **Artistic/Propaganda distinction**: Must preserve aesthetic value separate from political efficacy. Otherwise collapses into messaging—non-negotiable.  
  5. **Accountability**: Who does the propagandist answer to? Vanguardism risk.  
  6. **Scope**: Is this theory for Black art, all political art, or *all* art? Du Bois’s universalism ("all art is propaganda") clashes with his Black-specific prescriptions.  

  Now, tensions:  
  - **Honesty vs. Effectiveness** (Req 3 vs. implied in Req 4): Brutal truths may alienate external allies or fuel stereotypes, undermining propaganda goals. *Irreconcilable without trade-offs*.  
  - **Universalism vs. Asymmetry** (Req 6 vs. Req 1): If *all* art is propaganda, "asymmetry" becomes incoherent—accusations against political art lose force. *Self-undermining*.  

  Most exclusionary requirement? **Distinction (Req 4)**. Many theories (e.g., hardline didacticism) fail by reducing art to tool.  

  Evaluating Du Bois against his own specs:  
  - **Meets**: Asymmetry (exposes white art’s false neutrality), Double-audience (prioritizes Black audiences but leverages cross-racial impact).  
  - **Fails**: Honesty vs. uplift (suppressed McKay’s *Home to Harlem* for "dirt"), Accountability (implicit vanguardism—censors "unfit" art).  

  User’s unspoken need: They want ammunition for seminar debates—a logical toolkit to dissect theories, not just Du Bois exegesis. The emphasis on "model without a library" suggests they crave self-contained rigor.  

  Final note: Their suspicion about universality’s self-undermining is sharp. I’ll validate that as a specification flaw, not a fixable oversight.
answer: |-
  Here's a pressure-tested specification for a theory of politically engaged art, derived from your desiderata. I've refined your list, identified core tensions, flagged irreconcilable demands, and evaluated Du Bois against the criteria. Requirements are ordered logically, with motivations and negotiability clarified.

  ### **Desiderata for an Adequate Theory:**
  1. **Explain Asymmetry Without Neutrality**  
     *Must:* Explain why "propaganda" is asymmetrically applied (e.g., lynching novel vs. suburban ennui novel) while rejecting "apolitical art" as a coherent category.  
     *Motivation:* Dominant groups naturalize their worldview; art challenging power is politicized.  
     *Non-negotiable:* Yes. Without this, the theory legitimizes false neutrality.  
     *Case:* *Uncle Tom's Cabin* (propaganda) vs. *Madame Bovary* (not labeled propaganda despite depicting bourgeois alienation).  

  2. **Resolve the Double-Audience Problem**  
     *Must:* Account for art targeting marginalized in-groups vs. dominant out-groups, specifying priorities or synergies.  
     *Motivation:* Du Bois’s Black theater criteria (in-group focus) vs. *The Souls of Black Folk* (cross-racial appeal).  
     *Negotiable:* Partially. The theory must address it, but solutions may vary (e.g., temporal sequencing, formal techniques).  
     *Tension:* In-group authenticity often conflicts with out-group palatability.  

  3. **Navigate Honesty vs. Uplift**  
     *Must:* Explain how unflinching depictions (e.g., intra-community violence) avoid reinforcing oppression vs. idealized "uplift" narratives.  
     *Motivation:* Du Bois vs. Hughes/Locke on Claude McKay’s *Home to Harlem* (sexual frankness as truth vs. "stereotype fuel").  
     *Non-negotiable:* Yes. Avoids prescriptive dogmatism.  
     *Case:* Richard Wright’s *Native Son* (criticized for "negative" portrayal, yet politically potent).  

  4. **Preserve Artistic/Aesthetic Autonomy**  
     *Must:* Distinguish artistic excellence from political efficacy.  
     *Motivation:* Otherwise, the theory reduces to instrumental messaging (e.g., Soviet socialist realism).  
     *Non-negotiable:* **Most exclusionary requirement.** Eliminates reductive propaganda theories.  
     *Case:* Gorky vs. Mayakovsky—both Bolshevik propagandists, but Mayakovsky’s avant-garde form is aesthetically valorized.  

  5. **Define Accountability Without Vanguardism**  
     *Must:* Specify who the artist answers to (community, movement, self) without relying on elite authority.  
     *Motivation:* Du Bois’s *Crisis* editorship—gatekeeper role vs. democratic impulses.  
     *Negotiable:* Scope-dependent. Theories may allow multiple models (e.g., organic intellectuals vs. party discipline).  
     *Case:* C.L.R. James’s critiques of Du Bois’s "top-down" cultural leadership.  

  6. **Clarify Scope**  
     *Must:* Delimit whether the theory applies to specific contexts (Black art), political art broadly, or all art.  
     *Motivation:* Du Bois oscillates between universal claims ("all art is propaganda") and Black-specific prescriptions.  
     *Non-negotiable:* Yes. Ambiguity invites incoherence.  

  ---

  ### **Critical Tensions & Irreconcilabilities:**
  - **Honesty vs. Effectiveness (Req 3 vs. Req 4):**  
    Brutal honesty (e.g., depicting Black addiction/poverty) may alienate out-groups or fuel stereotypes, undermining effectiveness. *This tension is irreconcilable without trade-offs*. A theory can only *manage* it—not resolve it—by contextualizing reception (e.g., audience literacy, historical moment).  

  - **Universalism vs. Asymmetry (Req 6 vs. Req 1):**  
    Claiming *all art is propaganda* (universalism) undermines the asymmetry requirement. If suburban ennui novels *are* propaganda, the term loses critical bite, and accusations against political art become trivial. **This is self-undermining:** Universalism removes grounds for condemning *bad* political art, collapsing the theory’s normative force.  

  - **Accountability vs. Autonomy (Req 5 vs. Req 4):**  
    Demanding artists answer to a collective/party often subordinates aesthetic integrity to political directives. A theory prioritizing autonomy risks elitism; one prioritizing accountability risks didacticism.  

  ---

  ### **Du Bois Against His Own Specification:**
  - **Meets:**  
    - *Asymmetry:* Exposes white art’s false neutrality (e.g., minstrelsy as pro-racist propaganda).  
    - *Double-Audience:* Prioritizes Black audiences ("by us, for us") while leveraging cross-racial impact (e.g., *The Star of Ethiopia* pageant).  
    - *Scope (Partial):* Successfully theorizes Black art’s unique burdens.  

  - **Fails:**  
    - *Honesty vs. Uplift:* Insists on "duty-bound" positive representation, condemning McKay’s *Home to Harlem* as "filth." Fails its own standard by prioritizing uplift over uncompromised truth.  
    - *Accountability:* Implicit vanguardism—positions himself (via *Crisis*) as arbiter of "fit" Black art.  
    - *Universalism:* Declaring all art propaganda evacuates the term of meaning, contradicting asymmetry.  

  ---

  ### **Conclusion:**
  Your desiderata expose a **fatal flaw in universalist claims** (Req 6). If all art is propaganda, the theory cannot explain asymmetry (Req 1) or critique political art’s failures (Req 4). **The core trade-off is between honesty and effectiveness**: Theories optimizing for one sacrifice the other. Du Bois’s framework succeeds in diagnosing power dynamics but fails by its own criteria when enforcing didacticism. A viable theory must:  
  1. Reject universalism (limit scope to *explicitly* political art),  
  2. Treat honesty/effectiveness as context-dependent variables, not absolutes,  
  3. Accept that double-audience works require formal innovation (e.g., coded dual address in blues or satire).  
  The **autonomy requirement (Req 4) remains the sharpest filter**, excluding theories that reduce art to agitprop.
