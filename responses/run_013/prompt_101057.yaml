answer: |-
  ### Axiology of Distributive Justice: Core Requirements  
  *Specification for ranking distributions of benefits/burdens across a population*  

  **Brainstorming & Sorting Desiderata**  
  *Candidate desiderata:* Completeness, transitivity, anonymity, Pareto principles (weak/strong), separability, sensitivity to needs/absolute deprivation, equality-priority (favoring gains to worse-off), avoidance of leveling down, fairness as non-envy.  
  *Genuine requirements* (universal coherence constraints): Completeness, transitivity, anonymity, weak Pareto.  
  *Mere prejudices* (contingent on normative stance): Strong egalitarianism (equality as intrinsic good), sufficientarianism (threshold fetishism), prioritarianism (unless derived from deeper axioms).  

  **Settled List of Requirements**  
  1. **Completeness**  
     - *Motivation:* The theory must rank all possible distributions. Avoids indecision in real-world comparisons (e.g., allocating vaccines).  
     - *Leveling down reading:* Non-causal (ranks states, not actions).  

  2. **Transitivity**  
     - *Motivation:* Preserves rational choice under pairwise comparisons. If A > B and B > C, then A > C; otherwise, cycles make social choice incoherent.  
     - *Leveling down reading:* Non-causal.  

  3. **Anonymity (Symmetry)**  
     - *Motivation:* Judgments depend on individual welfare levels, not identities. Explains why permuting welfare assignments across people leaves the distribution equally good.  
     - *Leveling down reading:* Non-causal.  

  4. **Weak Pareto**  
     - *Motivation:* If everyone is better off in A than B, A must be strictly better. Captures the uncontroversial idea that universal gain is desirable.  
     - *Leveling down reading:* Non-causal.  

  5. **Equality-Priority**  
     - *Motivation:* Ceteris paribus, benefiting the worse-off improves the distribution more than benefiting the better-off. Explains why giving $100 to a starving person is better than giving it to a millionaire. Distinguishes justice from efficiency.  
     - *Leveling down reading:* Non-causal.  

  6. **Weak Sensitivity to Absolute Deprivation**  
     - *Motivation:* A loss to the worst-off must degrade the distribution more than an equal loss to the better-off. Avoids collapsing the distinction between deprivations (e.g., starvation vs. luxury loss).  
     - *Leveling down reading:* Non-causal.  

  7. **Non-Intrinsic Disvalue of Inequality**  
     - *Motivation:* Inequality is not bad *unless* it reflects avoidable harm. Pure inequality with no losers (e.g., two islands with identical populations but different wealth levels) is not unjust. Explains why "inequality" absent deprivation is morally inert.  
     - *Leveling down reading:* Non-causal.  

  8. **Causal Pareto Constraint**  
     - *Motivation:* *Acts* that harm some to benefit no one (gratuitous leveling down) are unjust. Distinguishes condemning harmful actions from ranking states.  
     - *Leveling down reading:* **Causal** (explicitly targets actions).  

  ---

  **Plateau Case Application**  
  *Scenario:* Raise group A (20→30) by lowering group B (90→88); no alternative to aid A.  
  - **Permitted by:** Equality-Priority + Weak Sensitivity (gain to worst-off outweighs small loss to better-off).  
  - **Forbidden by:** Strong Pareto (if imposed) or theories rejecting any trade-off harming B.  
  - *Key conflict:* Equality-Priority vs. Strong Pareto (if assumed).  

  ---

  **Joint Unsatisfiability & Key Exclusion**  
  - **Incompatible subset:** **Strong Pareto** (if requiring *no one loses*), **Equality-Priority**, and **Non-Intrinsic Disvalue of Inequality** cannot hold simultaneously.  
    - *Proof:* In a two-person equal distribution (50,50), a move to (49,100) violates Equality-Priority (worse-off loses) and Non-Intrinsic Disvalue (inequality now exists). Yet Strong Pareto forbids reverting to (50,50) since it makes the better-off worse off without helping the worst-off.  
  - **Most exclusionary requirement:** **Equality-Priority**. It excludes:  
    - Strict utilitarianism (indifferent to distribution),  
    - Libertarianism (rejects interpersonal comparisons),  
    - Strong sufficientarianism (if thresholds ignore priority).  

  ---

  **Theories Against Criteria (Brief)**  
  - **Utilitarianism:** Fails Equality-Priority and Sensitivity to Deprivation (ignores distribution; plateau case impermissible if total utility decreases).  
  - **Egalitarianism:** Violates Non-Intrinsic Disvalue (pure inequality deemed bad) and Causal Pareto Constraint (may endorse leveling-down acts).  
  - **Prioritarianism:** Satisfies all *if* priority weighting is strong; fails only if it mimics utilitarianism or rejects Anonymity.  
  - **Sufficientarianism:** Fails Equality-Priority if thresholds are absolute (e.g., plateau case rejected if A remains below threshold) and Weak Pareto if helping "sufficient" groups harms others.  

  **Core Conflict for Debate:** Equality-Priority vs. Pareto principles in non-causal rankings—especially whether the plateau case is just. The causal/non-causal split on leveling down clarifies whether objections target actions (gratuitous harm) or states (misranking). Resolving this is key to axiological coherence.
