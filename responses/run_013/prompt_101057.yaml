  First, I need to brainstorm potential desiderata. Common ones include completeness, transitivity, anonymity, Pareto principles, separability, sensitivity to needs, and fairness. But I must sort these into genuine requirements versus mere prejudices. For example, completeness and transitivity are formal requirements for any coherent ranking, while strict egalitarianism might be a bias if it values equality for its own sake without losers.

