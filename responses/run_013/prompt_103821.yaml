  Then, considering the episode's implications. If bounded utility resolves the undefined expectation, does that diminish the Pasadena paradox? Maybe, but it highlights that without bounded utility, decision theory lacks guidance when expectations are undefined. The real unresolved issue is what agents should do in such cases—expected utility theory is silent here.

