  The user needs to transform this half-formed idea into a fundable proposal. The core question is whether the authority of a sortition body depends on the initial random draw or if a non-randomly selected group (like volunteers) would have similar legitimacy. They plan to investigate the selection pipeline—tracking invite responses, dropouts, interviewing those who declined—to see who gets filtered out and why. This could reveal if randomness is essential or just decorative.

  Another angle they mention is the emergence of a professional class supporting these assemblies (facilitators, staff, returning members). They're unsure if this should be included. I should assess whether it fits the main question or if it's a separate issue that could expand the scope too much.

  The user explicitly says not to provide a reading list, so I'll focus on structuring the argument and methodology. They need a clear research question, how it addresses gaps in existing literature, a month-by-month plan, expected outcomes, and risks. For the professional class question, it's probably a sub-question since it ties into legitimacy and sustainability but shouldn't overshadow the main randomness query.

  I'll outline a proposal with sections: abstract, research question, gap in knowledge, methodology, plans for the professional sub-question, timeline, outcomes, and risks. The methodology should emphasize shadowing the selection process, obtaining data on participation rates, and interviewing dropouts. Highlighting that no one talks to dropouts is a unique angle. For the professional class, maybe one month of interviews and incorporating it into the analysis without letting it dominate.

  The user's deeper need might be to challenge the assumptions in deliberative democracy and sortition. They want to provide a fresh narrative that could influence how these assemblies are designed and perceived. The panel would fund this because it's empirical, novel, and addresses a foundational aspect of these institutions' legitimacy. Ensuring the proposal clearly states what success looks like (e.g., evidence that randomness isn't crucial) and failure (insufficient data) is essential. Also, emphasizing access to assemblies and transparency from organizers will be important for feasibility.
answer: |-
  Here’s a focused, fundable proposal structure centered on your core question, with a clear methodology and integration of your secondary concern without overcomplicating scope:

  **Proposal Title:** The Lottery Mirage: Unpacking the Real Foundations of Legitimacy in Citizens' Assemblies

  **Core Research Question:** **Does the perceived legitimacy and authority of a citizens' assembly fundamentally depend on the initial random selection (sortition), or is it primarily generated by the *process* (non-partisan briefing, facilitation, diverse deliberation) and the *status* of participants as non-politicians, irrespective of how they were initially identified?**

  *   **What Would Settle It?** Evidence demonstrating whether:
      1.  **Participants & Public Perception:** Assembly members *themselves* attribute legitimacy primarily to the lottery or to the subsequent process/conditions.
      2.  **Dropout Analysis:** The "pipeline" (invite → response → screening → acceptance) systematically filters out specific demographics or attitudes *in ways that meaningfully bias the final group away from "representativeness"*.
      3.  **Hypothetical Legitimacy:** Public trust in an assembly's output is significantly diminished if participants were known to be self-selected volunteers meeting basic criteria (non-politicians, diverse, available) vs. randomly selected from a pool meeting the same criteria.
      4.  **Functional Equivalence:** Observational evidence that the *dynamics* and *outputs* of a non-randomly selected (but otherwise identical) mini-public would be indistinguishable from a sortition-based one.

  **Why This Question is Overlooked & Urgent:**
  *   **The Sortition vs. Deliberation Stalemate:** Proponents argue *for* sortition based on either descriptive representation ("a microcosm") or superior deliberation ("wisdom of crowds"). Critics attack these points. **Both sides assume randomness is the *defining* feature.** This project challenges that assumption head-on.
  *   **The Practical Black Box:** The significant attrition between the initial lottery draw and the seated assembly is poorly documented and rarely studied. Who says no? Why? What biases does this introduce? **This "hidden selection" is where the real composition (and potential source of legitimacy) might be forged, not the initial draw.** The deliberative democracy literature focuses on what happens *in* the room, not *how they got there*. Lottocracy advocates treat the draw as sacrosanct without empirical proof it's essential.
  *   **Institutional Legitimacy at Stake:** If randomness is merely symbolic, the massive logistical effort (and cost) of pure sortition might be inefficient. If it *is* crucial, we need to understand *why* (e.g., unlobbyable, unearned mandate) to design better institutions. **The field lacks this foundational knowledge.**

  **Methodology: A 9-Month Empirical Investigation (Months 1-8 Core, Month 9 Synthesis):**

  1.  **Months 1-2: Foundation & Scoping:**
      *   Deep dive into existing selection protocols & reporting from past assemblies (Irish, French, municipal).
      *   Identify 2-3 upcoming citizens' assemblies (municipal/regional ideal for access) willing to grant unprecedented access to their *entire* selection pipeline.
      *   Negotiate MOUs for data access (anonymized invite lists, response rates, dropout reasons, demographic data where possible) and observation access.

  2.  **Months 3-5: Pipeline Shadowing & Quantification:**
      *   **Track the Pipeline:** Document every stage (mailout → response/non-response → screening calls → confirmation → final seating) for target assemblies.
      *   **Secure & Analyze Data:** Obtain anonymized datasets tracking: invitation demographics (if available), response rates, dropout rates at each stage, stated reasons for refusal/dropout (from organizers), final participant demographics.
      *   **Quantify the Filter:** Statistically analyze (descriptive stats, potential bias tests) *who* the pipeline sheds. Is attrition random? Does it correlate with demographics, location, likely trust indicators (e.g., area voting patterns)? This reveals the gap between "random draw" and "final assembly".

  3.  **Months 5-7: The Unheard Voices - Dropout Interviews:**
      *   **Crucial Novelty:** Partner with assembly organizers to confidentially contact a representative sample of individuals who:
          *   Ignored the initial invitation.
          *   Expressed interest but declined during screening.
          *   Accepted but dropped out before/during the assembly.
      *   Conduct in-depth, anonymized interviews focusing on: Reasons for non-participation (logistics, distrust, lack of confidence, perceived bias?), understanding of the lottery's role, perceptions of the assembly's legitimacy, and whether a non-random (volunteer) process would have changed their view/participation.

  4.  **Months 7-8: Participant & Stakeholder Perspectives:**
      *   **Assembly Members:** Structured interviews/surveys exploring their *own* sense of the assembly's legitimacy. Do they cite randomness? The process? Their non-political status? The facilitation? Would a volunteer basis undermine it?
      *   **Organizers & Facilitators:** Interviews on selection challenges, observed biases, *their* views on the necessity of randomness vs. process for legitimacy.
      *   **(Sub-Question Integration - Month 7 Focus):** **The Emerging Professional Class:** Dedicate a segment to interviewing facilitators, secretariat staff, and "returning" participants/alumni (e.g., from prior pilots). Explore: Career paths, perceived neutrality challenges, influence on process/outcomes, potential for a "deliberative bureaucracy." **This *folds in* neatly here:** It addresses a key *alternative source of legitimacy/concern* (neutral expertise vs. captured class) and is part of the "process" surrounding the assembly, directly relevant to the core question of what *actually* creates authority. It avoids blowing scope by being a targeted inquiry within the stakeholder interviews phase.

  5.  **Month 9: Synthesis & Hypothesis Testing:**
      *   Triangulate findings: Pipeline data + Dropout voices + Participant/Staff perspectives.
      *   Test core hypotheses: Is randomness perceived as essential? Does the pipeline introduce systematic bias? Is "non-politician + robust process" the core legitimacy driver?
      *   Develop framework for understanding assembly legitimacy beyond the "lottery vs. deliberation" dichotomy.

  **Integrating the "Professional Class" Sub-Question:** As outlined above (Month 7), this is **worth including but as a focused sub-inquiry**. It directly relates to legitimacy: does the *support structure* enhance (through expertise) or undermine (through potential capture) the authority derived from the participants/process? Limiting it to interviews within the stakeholder phase and linking it explicitly to the core question of "what carries the weight" keeps it manageable and relevant.

  **Defining Results:**

  *   **Success Looks Like:**
      *   **Conclusive Evidence:** Demonstrating that the pipeline introduces significant, measurable bias away from "representativeness" or that participants/public primarily attribute legitimacy to non-random factors (process, non-politician status).
      *   **A New Narrative:** A compelling, evidence-based story explaining the *real* foundations of authority in citizens' assemblies – e.g., "Legitimacy by Process & Non-Status," exposing the "Lottery Mirage," or confirming "Randomness as Unlobbyable Shield."
      *   **Actionable Insights:** Recommendations for designing more transparent/equitable selection pipelines or justifying/refining the use of sortition.
      *   **The Hidden Voices:** Publishing the first major account of *why people say no* to participating.
      *   **Professional Class Insight:** Documenting the emergence of this class and its perceived role in legitimacy.

  *   **Failure Looks Like:**
      *   **Access Denied:** Inability to secure sufficient pipeline data or access to dropouts from key assemblies.
      *   **Inconclusive Data:** Pipeline attrition proves statistically random; interviews reveal no clear consensus on legitimacy sources.
      *   **Ambiguity Persists:** Findings are mixed, failing to resolve the core question compellingly.

  **Why This is Fundable:**

  *   **Novelty:** Addresses a fundamental, overlooked question at the heart of a rapidly growing democratic innovation.
  *   **Empirical Rigor:** Combines quantitative pipeline analysis with unique qualitative access to the "missing voices" (dropouts) and key stakeholders.
  *   **Real-World Impact:** Findings could reshape how assemblies are designed, marketed, and evaluated globally.
  *   **Compelling Narrative:** Offers a fresh, potentially disruptive perspective on a heated debate.
  *   **Feasible Scope:** Clear 9-month plan focused on achievable fieldwork and analysis around a single, powerful question, with a manageable sub-topic integrated.

  **Panel Takeaway:** This fellowship will move beyond the stale debate on sortition's virtues to investigate its *actual functional necessity* by dissecting the hidden selection pipeline and giving voice to those who reject the invitation. The result will be a paradigm-shifting understanding of where citizens' assemblies truly derive their authority.
