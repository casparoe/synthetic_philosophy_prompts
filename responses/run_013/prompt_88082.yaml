  - A protagonist who refuses Parliament but gets drafted into the Audit. 
  - Concrete conflicts where they must use their veto. 
  - Arguments about the Audit’s legitimacy: Is it a bug or a feature? Does sortition rely on statistical representation or equal claim to rule? 
  - No lectures—just organic debates through character interactions. 
