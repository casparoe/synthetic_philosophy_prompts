prompt: |-
  My oldest friend Jess and I had a long, kind of bruising argument last night about same-sex marriage — we've circled it for years but never really gone at it head-on, and I think we both surprised ourselves. I'm basically on her side, but what tripped me up is that every time I tried to pin down *why*, she'd come back to "love is love," said like it ends the conversation, and honestly I couldn't tell her what the sentence is even claiming. It obviously can't be just the tautology it sounds like, or it wouldn't do any work — and it was doing work: she was using it to land something pretty specific, that any two adults who love each other have the same claim to marry, and that anyone who draws the line elsewhere is being inconsistent. But there's a gap between "love is love" and that conclusion, and I want to see it laid out rather than papered over.

  So give me a menu of the distinct precise claims "love is love" could be making, ordered roughly from the trivially true to the genuinely radical, and for each one say whether it's plausible and whether it actually delivers Jess's conclusion about who can marry. I care a lot about the readings where it turns into a claim about what marriage is *for* — if love is the point of marriage, does the traditional restriction become a conceptual mistake, or just a policy I happen to disagree with? — and about any reading where the slogan smuggles in the slide from something nobody denies to something that's genuinely contested. Please don't just pick the strongest reading and defend it; I want the whole spread as a list I can bring back to her, because the real puzzle for me is how much arguement is hidden inside three words. (I can't look anything up right now, so go with what you've got — no reading list needed.)
