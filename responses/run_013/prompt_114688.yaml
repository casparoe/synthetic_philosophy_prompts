prompt: |-
  I'm a policy analyst who has spent the past year and a half evaluating a guaranteed-income pilot, and I keep colliding with a class of goods that the philosophical debate over what should be equalized seems built to handle but that I can't get to fit. Consider three of the things participants tell us matter most: being the person others turn to in a crisis; having chosen a demanding line of work rather than been slotted into it; and having a job that other people want. In each case the value to the holder seems to depend on how she came to have the thing, or on how many others have it, so that transferring the resources that buy it — or even the opportunity to pursue it — does not transfer the value. I've started calling goods of this kind stubborn: their value is not carried by the resource that normally produces them, and it can be thinned or destroyed by making them more widely available. That last feature is what I find awkward, because the capability approach's central corrective — look at what people can actually do and be, not merely at what they hold — seems to license exactly the broader availability that dissolves the good. I have a working knowledge of the standard positions here (welfarist, resourcist, capability) but no philosophical training, so I may be misdescribing the landscape.

  What I want from you is the most important implications of treating stubbornness as a feature of the distribuendum rather than as a measurement problem, specifically for the choice among welfare, resources, and capabilities as the currency of equality. I am less interested in a taxonomy of positions than in what follows from the admission: what each of the three views is forced to concede once stubborn goods are on the table, what every view must give up, whether the debate needs a different question rather than a better answer, and what any of this would mean for how we actually evaluate the pilot. Please answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is a policy analyst evaluating a guaranteed-income pilot and has encountered a problem with "stubborn goods." These are things like social roles or job statuses where the value depends on how they were obtained or how rare they are, so simply transferring resources doesn't transfer the value. They're calling these "stubborn" because their value isn't tied to the resource that produces them and can be diminished if made widely available. The user is familiar with welfare, resource, and capability approaches to equality but wants to know the implications of treating stubbornness as a feature of what's being distributed rather than as a measurement problem.

  The user specifically wants five implications formatted as a numbered list without introduction or conclusion. Each item should be one or two sentences. They're interested in what each approach must concede when stubborn goods are considered, what all views must give up, whether the debate needs a different question, and what this means for evaluating their pilot.

  I need to address how stubborn goods challenge each approach. For welfarism, which focuses on well-being, stubborn goods show that welfare isn't reliably linked to resources, so it has to admit that equalizing resources doesn't guarantee welfare equality. For resourcism, which emphasizes resources, it must concede that some goods, like social status, can't be distributed directly and their value depends on context. For the capability approach, which centers on freedoms and opportunities, it faces a problem because expanding capabilities might dilute the value of stubborn goods, creating a tension between equality and maintaining their value.

  Beyond individual views, the key point is that all approaches must give up the idea that equality is achievable through distribution alone. Stubborn goods highlight that value emerges from social relations and scarcity, so the debate might need to shift from "what to distribute" to "how to structure social systems" for genuine fairness.

  For the pilot evaluation, this means looking beyond income metrics to assess how stubborn goods are affected and whether the policy changes social dynamics in ways that preserve or erode these valuable aspects of life. I'll make sure the list covers these points concisely, with exactly five items as requested.
answer: |-
  Here are the five implications:

  1.  **Welfarism must concede:** Welfare (happiness/satisfaction) cannot be reliably equalized via resource transfers for stubborn goods, as their welfare value inherently depends on relative scarcity and social context, not just possession.
  2.  **Resourcism must concede:** Equalizing resources demonstrably fails to equalize access to the *actual value* of stubborn goods (like social status or meaningful choice), as that value arises from non-transferable social relations and exclusivity.
  3.  **Capability approach must concede:** Expanding capabilities (opportunities/freedoms) for all can paradoxically destroy the very value of the "beings and doings" it aims to equalize access to (like holding uniquely desired jobs), revealing a core tension.
  4.  **Every view must give up:** The assumption that equality can be achieved solely through the *distribution* of any single metric (welfare, resources, capabilities); stubborn goods show value is relational and emergent, not merely held.
  5.  **For the pilot evaluation:** This forces assessing not just income/consumption effects, but whether the intervention alters the social dynamics that create stubborn goods' value (e.g., changing status hierarchies or perceived job desirability).
