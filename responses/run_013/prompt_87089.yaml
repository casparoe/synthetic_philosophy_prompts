prompt: |-
  You are acting as a philosopher of practical rationality with expertise in decision theory and the philosophy of action, and with a particular feel for how institutions quietly encode theories of the people they govern. Your task is not to survey the literature or to name schools of thought for their own sake; it is to reconstruct, as precisely as the material allows, the implicit philosophical commitments of a concrete practice, and to say how much of the practice those commitments actually carry. Begin by brainstorming the candidate reconstructions before you commit to one; lay out at least two rivals; then argue for the one you find best and be explicit about what would dislodge it.

  Here is the practice, in three connected parts.

  First, a charitable foundation runs a bidding game at its annual benefit. A twenty-dollar bill is auctioned. Bids begin at one dollar and rise in one-dollar increments. The highest bidder pays what they bid and receives the twenty. The second-highest bidder must also pay what they bid and receives nothing. The auctioneer is instructed never to halt the bidding and to keep it going as long as anyone will raise. In practice the bidding often climbs past twenty dollars and occasionally past forty, and the foundation advertises the game, jokes about it, and budgets the proceeds.

  Second, the same foundation's investment committee works by strict expected-value analysis: it declines any project with negative expected net present value, discounts future returns, and treats money already spent as irrelevant to what should be done next. Its written policy says that past costs are not reasons.

  Third, the same foundation asks its program officers to sign commitment contracts that bind their future selves -- locking funds, pre-registering decisions, and removing their own later discretion -- on the ground that their later selves cannot be trusted to follow through.

  Now reconstruct what this institution must believe about the agents it deals with. Does running the bidding game presuppose that bidders are simply irrational, or only that they are rational with non-standard preferences -- and if the latter, which ones? Does it presuppose a divided self, a present bias, or a single agent whose earlier choices legitimately control his later ones? Does it presuppose that the escalating bidder's choice is a mistake by his own lights, or could escalation be defensible given reputation, threat, or commitment? Is the auction best read as a money pump of the kind the coherence arguments describe, and does that framing claim more than the practice needs?

  Distinguish carefully between what the practice strictly presupposes and what it merely fits comfortably with, and identify where it is philosophically underdetermined -- that is, where several incompatible theories would license the same behavior. Then address the tension: the same body that treats sunk costs as no reason at all in its investment decisions depends on sunk-cost reasoning to raise money. Is that inconsistency genuine, or does it dissolve once we see which theory of agency each part presupposes? Finally, run the replacement test: if we substituted a rival theory of the agent -- say, one on which preferences may be time-inconsistent and ought to be respected rather than bound, or one on which there is no fact of the matter about the bidder's true preference -- what in each of the three practices would have to change, and what would survive untouched? Where your reconstruction is speculative, say so, and say what further feature of the practice would settle the question.
reasoning: |-
  Hmm, this is a fascinating challenge in practical rationality and institutional philosophy. The user presents a charitable foundation with three distinct practices that seem to contain contradictory assumptions about human agency. Let me unpack this systematically.

  First, the dollar auction game is clearly designed to exploit predictable irrationality. But what kind exactly? The bidding past $20 suggests either present-biased preferences or competitive utility beyond monetary gain. I recall that Martin Shubik first described this game as demonstrating irrational escalation, but the foundation seems to rely on this very behavior for fundraising. Their advertising and budgeting confirms they view this as reliable income rather than anomaly.

  Then there's the investment committee's strict expected-value policy. This is textbook rational choice theory - sunk costs are irrelevant, only marginal costs matter. But this directly contradicts what the auction exploits. How can an institution simultaneously endorse "sunk costs aren't reasons" while profiting from sunk-cost fallacies?

  The commitment contracts add another layer. They imply time-inconsistent preferences and distrust of future selves - directly opposing the investment committee's unitary agent model. Program officers are seen as multiple selves needing external commitment devices, while investors are treated as perfect discounters.

  The tension is delicious: the same institution that dismisses sunk costs as irrational in investments depends on them in fundraising, and treats its own employees as time-inconsistent agents while demanding perfect rationality from its committee. 

  For reconstruction, I see three candidate theories:
  1) An error theory where all deviations are irrational
  2) A dualistic model with context-dependent rationality
  3) An expressive theory where different practices serve different institutional purposes regardless of philosophical consistency

  The third seems most compelling. The foundation isn't committing to a unified theory of agency - it's pragmatically adopting whatever model serves each function: exploitation of biases for fundraising, textbook rationality for investments, and sophisticated self-binding for program execution. The inconsistency survives because it's functional, not philosophical.

  What would dislodge this view? If foundation documents revealed explicit reasoning about agency models, or if they applied investment logic to auctions (e.g. stopping bids at $20). But absent that, the pragmatic pluralism holds. The replacement test shows each practice could theoretically stand alone with different agency assumptions - proving they're not logically interdependent.
answer: |-
  Your challenge requires reconstructing the foundation's implicit philosophical commitments about agency across three practices. I'll first brainstorm candidate reconstructions, present two rivals, then argue for the best fit—noting tensions, underdetermination, and what would dislodge it.

  ---

  ### **Candidate Reconstructions of Agency**
  1. **"Bounded Rationality Exploitation" Model**  
     Agents are predictably irrational in specific contexts: prone to escalation traps (auction), sunk-cost fallacies (auction), and present bias (commitment contracts). The foundation exploits these flaws where profitable (auction) while forcibly correcting them elsewhere (investment policy, commitment devices).

  2. **"Contextual Agency Pluralism"**  
     Agency is fragmented:  
     - *Bidders* are seen as having socially embedded preferences (e.g., reputation-seeking) or time-inconsistent selves.  
     - *Investors* are modeled as rational expected-utility maximizers.  
     - *Program officers* are treated as having multiple selves, with earlier selves authorized to bind later ones.  
     Inconsistencies reflect different *institutional purposes* (revenue vs. fiduciary duty vs. project execution).

  3. **"Revealed Preference Agnosticism"**  
     The foundation doesn’t presuppose *any* theory of "true" preferences. It designs incentives to extract value *regardless* of whether bidders act rationally (auction), enforces procedural rationality in investments (sunk costs irrelevant), and uses commitment devices as mere tools to ensure outcomes.

  ---

  ### **Rival Reconstructions**
  **Rival A: Single-Agent Rationality with Non-Standard Preferences**  
  - Auction bidders are rational but value *winning* (status/threats) above money. Escalation beyond $20 is defensible if winning has nonlinear utility.  
  - Investment policy assumes standard monetary preferences.  
  - Commitment contracts imply no deep preference conflict—binding is a coordination tool.  
  *Tension resolved*: Different domains activate different utility functions.  

  **Rival B: Universal Mistake Theory**  
  - Bidders *always* make errors in the auction (a "money pump"), contradicting their own preferences.  
  - Investment policy corrects for the sunk-cost fallacy (another universal error).  
  - Commitment contracts preempt future self’s mistakes.  
  *Tension*: The foundation *exploits* errors in auctions while *correcting* them elsewhere—hypocritical but profitable.  

  ---

  ### **Argued Reconstruction: Contextual Agency Pluralism**
  This best fits the practices without overclaiming:  
  1. **Auction**:  
     - **Presupposes**: Bidders are agents for whom escalating commitment is *psychologically or socially rational* (e.g., avoiding shame, signaling toughness).  
     - **Underdetermined**: It could be irrational escalation *or* rational pursuit of non-monetary utility (e.g., entertaining peers). The auctioneer’s refusal to halt hints at exploiting *whatever* drives escalation.  
     - **Money pump framing?** Overclaims. The practice needs only that escalation *happens*, not that it violates coherence axioms.  

  2. **Investment Policy**:  
     - **Presupposes**: A unitary, time-consistent agent who discounts future utility exponentially. Sunk costs are irrelevant by definition.  
     - **Strict commitment**: "Past costs are not reasons" encodes a normative view of rational choice.  

  3. **Commitment Contracts**:  
     - **Presupposes**: A divided self. Later selves are untrustworthy due to present bias or preference reversal. Earlier selves have authority to bind them.  
     - **Key contrast**: Unlike the investment policy, it treats past commitments (not costs) as *binding reasons*.  

  **The Tension Dissolved?**  
  - Superficial inconsistency: The auction *relies* on sunk-cost reasoning ("I’ve bid $19, I must win to justify it"), while investments forbid it.  
  - *Pluralism resolves this*: The foundation uses **different agency models for different roles**:  
    - Bidders are *psychological subjects* (non-rational or social preferences exploited).  
    - Investors are *homo economicus* (rational expectations enforced).  
    - Program officers are *temporal coalitions* (binding past/future selves).  
    No unified theory of agency is needed—each practice serves a functional purpose.  

  ---

  ### **Replacement Test: Substituting Rival Theories**
  - **If agents have time-inconsistent preferences that should be respected (not bound)**:  
    - Auction unchanged (still exploits escalation).  
    - Investment policy unchanged (assumes consistency).  
    - Commitment contracts abandoned; officers could renegotiate projects freely.  

  - **If no fact about "true" preferences (radical agnosticism)**:  
    - Auction thrives (relies on behavior, not preferences).  
    - Investment policy weakened (if preferences are indeterminate, expected value is fiction).  
    - Commitment contracts become arbitrary (no "true self" to bind).  

  - **If bidders are purely rational with standard preferences**:  
    - Auction collapses (bidding stops at $20). The foundation’s budget reliance on >$20 bids fails.  

  ---

  ### **Speculative Elements and Settling Evidence**
  - **Speculative**: Whether auction escalation is a "mistake" or contextually rational.  
    - *Settling evidence*: If bidders retrospectively regret bids (implying error) vs. frame it as entertainment (rational given social utility).  
  - **Speculative**: Whether commitment contracts reflect distrust of officers or institutional risk-aversion.  
    - *Settling evidence*: If officers can veto contracts pre-commitment (suggests mutual agreement) vs. unilateral imposition (distrust).  

  **What Would Dislodge My Reconstruction?**  
  If the foundation *applied investment logic to auctions* (e.g., halting bids at $20 to "prevent losses"), it would imply a unified rational-agent model. Conversely, if investment decisions considered sunk costs, pluralism would collapse into incoherence.  

  ---

  ### **Conclusion**
  The foundation operates with **pragmatic contextualism**: it deploys incompatible theories of agency where functionally useful. The auction presupposes agents vulnerable to escalation traps (whether irrational or socially rational), investments presuppose rational expected-utility maximizers, and commitment contracts presuppose time-inconsistent selves. This pluralism isn’t philosophically rigorous but *works*—each practice’s success depends on its local model, not global consistency. The institution thus reveals a Machiavellian insight: theories of agency are tools, not truths.
