prompt: |-
  I keep running into a pattern in arguments about the long-run consequences of an action, and I can't tell whether it has a name. The shape is always the same. Someone proposes doing something whose near-term effects are good. An objector replies that the far-off effects could be enormous and could be bad, so the near-term good cannot settle the matter. The proposer grants this but adds that those far-off effects are as likely to be good as bad, so they cancel out, and we should decide on the near-term effects. What bothers me is that the "as likely to be good as bad" is never argued for -- no one has any distribution over those outcomes; the quantity is simply unknown, and it is being quietly treated as zero. Worse, the treatment flips with the arguer's goal: when the aim is to block an action, the unknown long-run effects count as a live danger; when the aim is to permit one, they count as neutral. So I want to know whether the specific move -- assigning an unknown consequence a value of zero, and doing so asymmetrically -- has an established name. It feels close to a few ideas I have only half-absorbed (something about indifference, something about precaution, and the general complaint that we cannot total up consequences), but none seems to be quite it: indifference is about assigning equal probabilities whereas this assigns none, and the general complaint is about our inability to know rather than about the default we slip into once we have given up. If there is a name, what is it, and which nearby concept is it most often confused with? If there is not, please coin one and mark its edges -- in particular, tell me whether the asymmetry is essential to the phenomenon or merely a common way it gets deployed.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a recurring pattern in arguments about long-term consequences. The key elements are: someone proposes an action with clear short-term benefits, an objector points out potential unknown long-term risks, and the proposer counters by saying those unknown effects are equally likely to be good or bad, thus canceling out. The user is bothered by how the "equally likely" assumption is never justified—it's treated as zero by default. They also notice an asymmetry: objectors frame unknowns as risks, while proposers frame them as neutral.

  First, I need to identify if there's an existing term for this. The user mentions concepts like indifference principle and precautionary principle. Let me recall what those are. The principle of indifference assigns equal probabilities when there's no information, which is similar but not exactly the same. The proposer here isn't assigning probabilities; they're defaulting the expected value to zero without any distribution. That's different. The precautionary principle is about avoiding actions with uncertain risks, which aligns more with the objector's stance. So neither fits perfectly.

  Next, I think about decision theory concepts. Expected value calculation requires assigning probabilities and outcomes. Here, the proposer is skipping that by assuming symmetry without basis. That sounds like an unjustified symmetry assumption. The asymmetry the user points out is key—people switch stances based on their goal. When blocking an action, unknowns are threats; when promoting, they're neutral. This selective framing might be related to motivated reasoning or status quo bias.

  Is there a specific term for this? I remember "Pascal's mugging" deals with extreme outcomes but isn't exactly the same. "Uncertainty laundering" might be close, where unknowns are redefined as neutral. But I'm not sure if that's a recognized term. Perhaps "zero-default fallacy" captures the core move of setting unknown effects to zero. The asymmetry could be an additional element, where the fallacy is applied inconsistently based on goals.

  I should also consider related concepts. Risk compensation involves known risks, not unknowns. Moral offsetting is about counterbalancing harms with benefits. Neither fits. The user wants to know if the asymmetry is essential. In the fallacy itself, the default to zero is the core error. The asymmetry shows how it's exploited in arguments, making it a common deployment but not part of the definition.

  The user's deeper need might be to name this rhetorical tactic to call it out in debates. They might also want to understand the underlying cognitive biases to better critique such arguments. Providing a coined term and explaining its components would address their request. Highlighting the difference from similar concepts like indifference principle is crucial to avoid confusion.

  So, coining "Zero-Default Fallacy" makes sense. The fallacy is assigning zero expected value without justification. The asymmetry in application is a separate issue, stemming from motivated reasoning. This helps the user identify both the logical error and the rhetorical manipulation.
answer: |-
  This pattern absolutely has identifiable names and conceptual roots, though the specific *asymmetry* in its application is a particularly insidious rhetorical maneuver. Here's the breakdown:

  1.  **The Core Fallacy: Unjustified Symmetry Assumption / Zero-Default Fallacy**
      *   **Name:** The core move – assigning an expected value of zero to an unknown consequence *without justification* – is most accurately called an **Unjustified Symmetry Assumption** or **Zero-Default Fallacy**.
      *   **Explanation:** The proposer implicitly assumes that because the *sign* (good/bad) and *magnitude* of the long-term consequences are unknown, the probability distribution must be symmetric around zero (expected value = 0). This is a fallacy because:
          *   **Lack of Information ≠ Symmetry:** Unknown does not imply symmetric. The potential outcomes could have a heavy positive tail, a heavy negative tail, or be wildly asymmetric. Assigning symmetry is an arbitrary choice, not a default justified by ignorance.
          *   **Risk Aversion:** Rational actors often exhibit risk aversion, meaning they assign *more* weight to potential losses than equivalent gains. An unknown with potentially catastrophic downsides *should* often be treated with more caution than an unknown with potentially large upsides, even if the "best guess" is symmetric.
          *   **Expected Value Calculation Requires Inputs:** You simply *cannot* calculate an expected value without assigning *some* probabilities and magnitudes. Declaring the net effect zero is performing the calculation with made-up numbers that happen to sum to zero.

  2.  **The Asymmetrical Deployment: Motivated Uncertainty Framing**
      *   **Name:** The inconsistency – framing the unknown as a danger when opposing an action and as neutral when supporting it – is an example of **Motivated Reasoning** applied to uncertainty, specifically **Motivated Uncertainty Framing** or **Selective Application of the Precautionary Principle**.
      *   **Explanation:** The arguer isn't applying a consistent principle about unknowns. They are strategically framing the unknown consequence to support their desired conclusion:
          *   **Opposing Action:** "We don't know the long-term effects! It could be catastrophic! We must apply the **Precautionary Principle**!" (Framing unknown as risk/liability).
          *   **Supporting Action:** "We don't know the long-term effects! It could be amazing, or bad, so it averages out to zero! Let's focus on the clear near-term gain!" (Framing unknown as neutral via Unjustified Symmetry Assumption).
      *   **Root Cause:** This asymmetry stems from cognitive biases like **Confirmation Bias** (seeking/favoring information confirming prior beliefs) and **Status Quo Bias** (preferring the current state, making unknowns of change seem riskier than unknowns of inaction). It's also fundamental **rhetorical opportunism**.

  3.  **Nearby Concepts (Often Confused With):**
      *   **Principle of Indifference (Laplace's Principle):** Assigns *equal probability* to all possibilities *when there is truly no reason to favor any one over another*. **Crucial Distinction:** The Zero-Default Fallacy *misapplies* indifference. Indifference assigns equal *probability* to outcomes (e.g., 50% good, 50% bad). The fallacy *assumes this symmetry implies a net expected value of zero*, ignoring the *magnitude* of potential outcomes. A 50% chance of catastrophe and a 50% chance of minor benefit does *not* average to zero! Indifference is about probabilities; the fallacy misuses it to imply outcome symmetry.
      *   **Precautionary Principle:** Advises caution (or prohibition) when actions risk severe or irreversible harm, even if cause-and-effect isn't fully scientifically proven. **Crucial Distinction:** The Precautionary Principle explicitly focuses on *potential harm* under uncertainty. The Zero-Default Fallacy is the *opposite* move: dismissing potential harm under uncertainty by assuming it cancels out potential benefit. The *asymmetrical deployment* involves selectively invoking or ignoring the spirit of the Precautionary Principle.
      *   **Pascal's Mugging:** Refers to being paralyzed by extremely low-probability, extremely high-impact outcomes (e.g., an AI threatening to torture 3^^^3 people unless you give it $5). **Crucial Distinction:** Pascal's Mugging focuses on the difficulty of handling *tiny probabilities of vast consequences*. Your pattern involves *complete ignorance* of the probability distribution and magnitude, not necessarily vast consequences assigned tiny probabilities. The objector *might* be accused of Pascal's Mugging, while the proposer commits the Zero-Default Fallacy.
      *   **Ignorance Fallacy / Argument from Ignorance (Appeal to Ignorance - Argumentum ad Ignorantiam):** Claiming something is true *because* it hasn't been proven false, or false *because* it hasn't been proven true. **Crucial Distinction:** The Zero-Default Fallacy is a *specific subtype*. It doesn't claim the long-term effect *is* zero; it claims we should *act as if* it is zero *because* we are ignorant. It's an argument *for an action* (or inaction) *based on* misinterpreting ignorance as neutrality.

  **Coining a Specific Term: The Uncertainty Laundering Gambit (ULG)**

  To capture the *combined essence* of the core fallacy and its asymmetrical deployment in arguments:

  *   **Name:** **Uncertainty Laundering Gambit (ULG)**
  *   **Definition:** A rhetorical tactic where an arguer, facing unknown long-term consequences of a proposed action, strategically "launders" the uncertainty:
      *   When *opposing* the action, they frame the uncertainty as a *clear risk* or *potential liability* (invoking precaution).
      *   When *supporting* the action, they frame the uncertainty as *neutral* by asserting, without evidence, that potential positive and negative outcomes are symmetric and cancel out (committing the Zero-Default Fallacy).
  *   **Core Fallacy:** Unjustified Symmetry Assumption / Zero-Default Fallacy.
  *   **Deployment Mechanism:** Motivated Uncertainty Framing.
  *   **Purpose:** To bypass genuine uncertainty by converting it into a factor that always supports the arguer's pre-existing preference (block or permit).

  **Is the Asymmetry Essential?**

  *   **To the Core Fallacy (Zero-Default):** No. The fallacy of assigning an expected value of zero to an unknown consequence *can* be committed symmetrically. Someone could naively apply it regardless of their stance.
  *   **To the Phenomenon You're Observing (the Argument Pattern):** **Yes.** The defining characteristic of the frustrating pattern you keep encountering is precisely this *asymmetrical deployment* based on the arguer's goal. The *flip* between "unknown = danger" and "unknown = neutral" is what makes it feel manipulative and inconsistent. The core fallacy is the *tool*, but the asymmetrical, motivated use of that tool *is* the observable phenomenon you're grappling with. The "Uncertainty Laundering Gambit" captures this duality.

  **In summary:** The core error is the **Unjustified Symmetry Assumption** or **Zero-Default Fallacy**. The asymmetrical deployment based on the arguer's goal is **Motivated Uncertainty Framing**. The combined phenomenon you describe is aptly termed the **Uncertainty Laundering Gambit (ULG)**, where uncertainty is rhetorically converted into whatever supports the desired conclusion. This pattern thrives on the inherent difficulty of reasoning under radical uncertainty and exploits cognitive biases for rhetorical advantage. Recognizing it allows you to call out both the unjustified assumption of symmetry *and* the motivated inconsistency in how uncertainty is framed.
