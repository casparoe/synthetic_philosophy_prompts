prompt: |-
  So my best friend's older sister is doing a PhD in philosophy and she's been trying to convert us to something she calls accuracy-first epistemology — the basic idea being that the only thing that makes a belief good is how accurate it is, so you score credences with a scoring rule (basically a game where you get points depending on how much probability you put on what actually happened) and then you say someone's credences are rational to the extent they'd score well. Her big claim is that this is the WHOLE story: pick any strictly proper scoring rule (one where just honestly reporting your real probabilities always gets you the best expected score) and you can derive everything you'd want, and there's nothing left over — no extra requirement that your beliefs be based on evidence or that you be able to justify them or anything, all of that is just shorthand for accuracy considerations. I'm at about 0.3 that she's right.

  The thing that bugs me is a case I made up: imagine a machine that, without giving you any evidence you could point to, just silently sets all your credences to the objectively most accurate values — you didn't reason your way there, you can't justify a single one of them, you just wake up perfectly calibrated about everything. My gut says something has definately gone wrong epistemically, but on her view you're a perfect epistemic agent, since your credences are as accurate as they could possibly be in every world. And then there's a seperate thing she says that I don't buy: that it makes no difference which strictly proper rule you use. But the log score gives you minus infinity if you're certain of something false, while the Brier score just gives you a low number, so they clearly don't treat risk the same way, and I feel like that has to leak into substantive verdicts somewhere.

  So what I want: your credence that accuracy-first is a complete account of epistemic rationality — that every genuine epistemic requirement (including whatever's true about evidence, justification, and how to respond to people who disagree with you) follows from wanting your credences to score well, with nothing epistemic left over. Please decompose it rather than just giving me a vibe: how much of your number rides on whether accuracy is the only fundamental epistemic good, how much on whether the right standard is dominance (roughly: your credence is bad if some other credence function would have scored at least as well in every possible world and better in some) versus maximizing expected accuracy, how much on whether the choice of scoring rule actually matters for any real verdict, and any other terms you think belong — a number and one line for each, then how they combine. Then tell me which term you're least sure about and what would move it most, and whether the disagreement between me and her is really about my machine case or about something further upstream that neither of us has noticed. If you think the thesis is too vague to have a truth value, tell me that and say what you're putting the number on instead.
