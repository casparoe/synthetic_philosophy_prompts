          Given the time constraints, we will focus Round 2 on the decision without the message evidence, and in the debrief, we will explain the puzzle as stated and discuss how the message would affect their belief.

          Then in Round 2 simulation:

            - We secretly assign termite status to each participant (5% chance) and record it.
            - We ask each participant to decide: pay $1000 or not? They write it down.
            - We then reveal the termite status for each participant and charge:
                 - If termites: lose 1,000,000 points.
                 - If paid: lose 1,000 points.

            So total loss for a participant:
                 - If they have termites and paid:  1,001,000
                 - If they have termites and didn't pay:  1,000,000
                 - If no termites and paid:  1,000
                 - If no termites and didn't pay:  0

          Then they see the outcome.

          The expected value if they pay: 
             = (0.05 * (-1,001,000)) + (0.95 * (-1000)) = -50,050 - 950 = -51,000
          The expected value if they don't pay:
             = (0.05 * (-1,000,000)) + (0.95 * 0) = -50,000

          So by expected value, they should not pay.

          But the evidential reasoning in the puzzle is different: it says that if you pay, then the message would have been sent only if you don't have termites? But in our simulation, they don't see the message.

          Given the complexity, we'll do it this way and rely on the debrief to explain the full puzzle.

   Summary of the activity:

     Round 1: Coin Flip (pre-commitment)
        - Each participant has a form: 
            "Commitment for the heads scenario: I will [ ] Pay $10   [ ] Not pay"
        - They choose one and hand it in.
        - Game master flips a coin (one flip for the whole group) and announces the outcome.
        - For each participant:
            - If heads:
                 if they committed to Pay: lose 10 points.
                 if committed to Not pay: lose 0 points.
            - If tails:
                 if committed to Pay: gain 1000 points.
                 if committed to Not pay: gain 0 points.
        - They see their outcome.

     Round 2: Termites (simplified)
        - Game master assigns termite status to each participant: with 5% probability (1 in 20) they have termites. We can do by having each participant draw a number from a hat with numbers 1 to 20. If they draw 1, they have termites (but they don't reveal it to anyone, not even themselves). The game master records the termite status for each participant.
        - Each participant decides: pay $1000 or not? They write it down.
        - Game master reveals the termite status for each participant.
        - Charge:
            - If termites: lose 1,000,000 points.
            - If paid: lose 1,000 points.

     But note: in Round 2, they don't know their termite status when deciding.

     Then we do a debrief.

     Materials:
        - For Round 1: 
