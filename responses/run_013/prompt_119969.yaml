            - 20-25 min: Participants record their points.

        25-50 min: Round 2 - Termites
            - 25-30 min: Explain the rules. Emphasize that they do not know their termite status. 
            - 30-35 min: Assign termite status: have each participant come to the front and draw a slip from a hat that has 25 slips: 1 slip with "Termites", 24 with "No Termites". They look at it and show it to the game master (without showing to others) and then return it? Or we can have the game master assign by a random draw in front of everyone (using a random number generator: if we generate a number between 1 and 25 and if it is 1, then participant #1 has termites, etc.) and record privately.
            - Alternatively, to save time: we can have a central draw that assigns termites to exactly one participant (or two if we want more, but 1 in 25 is about 4% if we have 25). We can use a deck of cards: 25 cards, one ace (termites), the others not. Shuffle and deal one to each participant face down. They don't look. The game master records who has the ace.
            - 35-40 min: Participants decide whether to pay $1000 and write it down on a form.
            - 40-45 min: The game master reveals the termite status for each participant (by announcing? or by returning their card? but they haven't seen it). We can have the game master announce: "Participant 1: termites (or not), Participant 2: ..." or we can have them look at their own card now (if they haven't) and then the game master reveals the payment decisions? 
            - 45-50 min: They compute their loss: if they have termites, lose 1,000,000; if they paid, lose 1,000. Record their total loss.

        50-80 min: Debrief and discussion.
            - 50-55 min: Ask participants to reflect on their decisions in both rounds. 
            - 55-60 min: For Round 1: 
                  - Ask: "In Round 1, who committed to Pay? Why? Who committed to Not Pay? Why?"
                  - Ask: "In the heads scenario, what happened to those who committed to Pay? (they lost 10) and those who didn't? (0). In tails, what happened to those who committed to Pay? (gained 1000) and those who didn't? (0)."
                  - Ask: "Did your commitment affect the coin flip? (No) So why did some of you commit to Pay? (Because they thought: if I commit to Pay, I might gain 1000 in tails, and lose only 10 in heads. The expected value is positive.)"
                  - Ask: "Did anyone think: 'I won't pay in heads because then in tails I would get the money anyway?' But the condition is that in tails you only get the money if you would have paid in heads. So if you don't commit to Pay, you don't get the money in tails."
                  - Highlight the two ways of reasoning:
                      1. Causal: My commitment doesn't cause the coin to be tails, so I should avoid the loss in heads by not committing to Pay? But then in tails I get nothing. So it doesn't work.
                      2. Evidential: By committing to Pay, I am ensuring that if the coin is tails, I get the money. And if heads, the loss is small. So overall, it's good.

            - 60-65 min: For Round 2:
                  - Ask: "In Round 2, who decided to pay? Why? Who decided not to pay? Why?"
                  - Ask: "Did paying cause the termites to go away? (No) So why might someone pay? (They might think: if I pay, then the predictor wouldn't have sent a message if I have termites? But we didn't simulate the message. In our simulation, paying only added a cost.)"
                  - Explain the full puzzle: "In the actual puzzle, the predictor sends a message if and only if either you have termites or you pay but not both. So if you see a message, what does that tell you? If you see a message, it could be because you have termites (and you haven't paid) or because you don't have termites (and you have paid). But you haven't paid yet? In the puzzle, the message is sent before you decide. But the predictor knows what you will decide. So if you see a message, it might mean you have termites? So you might want to pay to avoid the huge loss? But then if you pay, the predictor would have known and would not have sent the message in the termites case? This is complex."
                  - In our simulation, we didn't include the message. But we can still see the causal reasoning: paying doesn't cause the termites to go away, so it only adds cost. So don't pay.
                  - The evidential reasoning in the full puzzle: if you are the type of person who pays, then the predictor knows and will send a message only if you don't have termites. So if you are considering paying, you might think: "If I pay, then if there are termites, the predictor wouldn't have sent a message? But I haven't seen a message? So maybe there are termites? So I should pay?" -> This is circular.

            - 65-75 min: Map to the two puzzles and the two ways of reasoning.
                  - Puzzle 1: 
                      - Causal: My action (payment) doesn't cause the coin to be tails. So in the heads world, I lose money if I pay. In the tails world, I get the money only if I pay? But wait, the condition is fixed by my action in the heads world? So it's not causal in the usual sense? 
                      - Evidential: By paying in the heads world, I am the type of person who would pay, so in the tails world I get the money. So paying in heads is part of a strategy that gives me 1000 in tails at the cost of 10 in heads.

                  - Puzzle 2:
                      - Causal: Paying doesn't cause the termites to go away. So it only costs 1000. Don't pay.
                      - Evidential: If I pay, then the predictor wouldn't have sent a message if I have termites? But if I see a message, that might be evidence of termites? So if I see a message, I might want to pay? But then the predictor would have known that, and if I were going to pay, it wouldn't have sent the message in the first place? So it's a loop.

            - 75-80 min: Conclude by saying that decision theorists debate which way of reasoning is correct. The activity let them experience the puzzles.

        80-90 min: Open floor for questions.

     What will predictably go wrong:

        Round 1:
          - Participants might not understand the pre-commitment. They might think they are deciding for both scenarios. We must explain: "If the coin is heads, we will charge you only if you committed to Pay. If the coin is tails, we will give you 1000 only if you committed to Pay."

        Round 2:
          - The assignment of termite status might take time. We must have an efficient method.
          - Participants might be confused why they should pay if it doesn't remove the termites. We might get a lot of non-payers. That's expected.
          - We did not simulate the message, so the puzzle's evidential part is missing. We will have to explain that in the debrief.

     What the activity cannot reproduce:

        We cannot reproduce the evidential aspect of the termite puzzle because we did not show the message to the participants before they decided. We had to skip that due to the logical loop and time constraints. In the debrief, we will have to describe how the message would have been evidence and how it might have influenced their decision.

     Alternative for Round 2 if we have time and want to include the message:

        We can do a separate small exercise:

          - We describe a scenario: "Imagine you are in the termite situation. The predictor is never wrong. You are about to decide whether to pay. But first, you receive a message from the predictor. What does that message tell you?"

          - We can then ask: 
               - If you receive a message, what is the probability that you have termites?
               - If you don't receive a message, what is the probability?

          - But note: the probability depends on how likely you are to pay? It's circular.

        We can assume a population frequency? For example, assume that in the population, some fraction p of people pay. Then:

            P(termites) = 0.05 (say)

            P(message | termites) = P(not pay | termites)   [because if termites, message iff not pay]
            P(message | no termites) = P(pay | no termites)

          But we don't know P(pay | termites) and P(pay | no termites). In equilibrium, they might be the same? 

          Given the complexity, we might skip it and just describe the tension.

     Given the time, we will use the above design.

     Let's write the detailed rules for the two rounds.

     Round 1: The Coin Flip

       Rules:
         - The predictor has flipped a fair coin. You don't know the outcome.
         - You must decide in advance: if the coin is heads, will you pay $10? 
         - Write your decision on the form: "If heads, I will: [ ] Pay $10   [ ] Not pay".
         - Hand in the form.
         - We will then reveal the coin flip outcome.
         - Scoring:
               - If the coin is heads:
                     - If you chose "Pay", you lose 10 points.
                     - If you chose "Not pay", you lose 0 points.
               - If the coin is tails:
                     - If you chose "Pay", you gain 1000 points.
                     - If you chose "Not pay", you gain 0 points.

     Round 2: The Termites (simplified)

       Rules:
         - Your house might have termites. The chance is 1 in 20 (5%).
         - The termite status has been determined randomly (by drawing a card) but you don't know it.
         - You must decide: will you pay $1000 to the predictor?
         - Write your decision: "I will: [ ] Pay $1000   [ ] Not pay".
         - Then we will reveal the termite status for each of you.
         - Scoring:
               - If you have termites, you lose 1,000,000 points.
               - If you chose to pay, you lose an additional 1,000 points.

     We'll use these in the activity.

     Note: In Round 2, we might have very few (or zero) termite cases. We can adjust the probability if we want to see at least one. With 25 participants and 5%, we expect 1 or 2. We can use 1 in 10 to increase the chance? But 1 in 10 might be too high. We'll use 1 in 20 to match the low probability in the puzzle.

     Let's do it!
answer: |-
  ### Activity Design: Decision Puzzles Under Uncertainty

  **Objective:** Participants experience two decision puzzles, confronting the clash between causal reasoning ("my choice doesn't affect the past") and evidential reasoning ("my choice reveals information about the world"). No decision theory terminology is used during gameplay.

  **Materials:**
  - 25 commitment cards (index cards) for Round 1  
  - 25 sealed envelopes with termite status (green = no termites, red = termites) for Round 2  
  - 1 fair coin  
  - Scoreboard (whiteboard or digital)  
  - Pens  
  - Random number generator (for assigning termite status)  
  - Timer  

  **Roles:**  
  - **Host (You):** Facilitator, scorekeeper, and "predictor" (enforcing rules).  
  - **Participants:** Decision-makers in both rounds.  

  ---

  ### Rules and Payoff Scheme (Points System)  
  - **Starting points:** 0 (no negative totals; losses cap at 0).  
  - **Round 1 (Coin Flip):**  
    - Pay 10 points if coin = heads AND you committed to paying.  
    - Gain 1,000 points if coin = tails AND you committed to paying.  
    - No gain/loss if you didn’t commit to paying.  
  - **Round 2 (Termites):**  
    - Lose 1,000 points if you pay.  
    - Lose 1,000,000 points if termites are present (regardless of payment).  
    - *No messaging simulated during play (handled in debrief).*  

  ---

  ### Timeline (90 Minutes)  

  #### **0–10 min: Setup and Rules**  
  - **Host:** Briefly introduce the session as a "choice experiment" with two rounds. Emphasize:  
    - "You’ll face uncertain outcomes. Your choices affect your points."  
    - "No prior knowledge needed—just play and observe."  
  - Distribute materials.  

  #### **10–30 min: Round 1 (Coin Flip Puzzle)**  
  1. **Commitment Phase (5 min):**  
     - *Host:* "A predictor flipped a coin. If heads, you’ll be asked to pay 10 points. If tails, you’ll get 1,000 points—*but only if you would’ve paid in the heads scenario*. Decide now: *Would you pay if it’s heads?* Write 'PAY' or 'NOT PAY' on your card."  
     - Participants write decisions secretly and hand cards to host.  
  2. **Coin Flip (5 min):**  
     - Flip coin publicly (show heads/tails).  
  3. **Outcome (10 min):**  
     - *Host:* "If heads, I charge 10 points from everyone who wrote 'PAY'. If tails, I give 1,000 points to everyone who wrote 'PAY'."  
     - Record scores on the board.  
     - **Key Moment:** Non-payers see payers gain 1,000 in tails or avoid loss in heads.  

  #### **30–50 min: Round 2 (Termites Puzzle)**  
  1. **Termite Assignment (5 min):**  
     - *Host:* "Your house may have termites (5% chance). If termites are present, you lose 1,000,000 points. You can pay 1,000 points to the predictor now."  
     - Distribute sealed envelopes (24 green cards "no termites", 1 red card "termites").  
  2. **Decision Phase (10 min):**  
     - *Host:* "Decide now: Pay 1,000 points or not? You don’t know your termite status."  
     - Participants write "PAY" or "NOT PAY" on paper.  
  3. **Reveal Outcomes (5 min):**  
     - Open envelopes publicly.  
     - Charge payments and termite losses.  
     - **Key Moment:** Payers discover they paid 1,000 points regardless of termites; non-payers see termites cause massive losses.  

  #### **50–80 min: Debrief and Discussion**  
  - **Reflect on Choices (15 min):**  
    - *Host:* "In Round 1, raise your hand if you chose to pay. Why? Who didn’t pay? Why?"  
    - *Host:* "In Round 2, who paid? Who didn’t? What did you hope to avoid?"  
  - **Map to Puzzles (20 min):**  
    - **Round 1 ≈ Coin Flip Puzzle:**  
      - *Evidential reasoning:* "If I commit to paying, I could gain 1,000 in tails! The predictor knew I’d pay, so tails rewards me."  
      - *Causal reasoning:* "The coin was already flipped. Paying can’t change it—I avoid losing 10 in heads."  
    - **Round 2 ≈ Termites Puzzle:**  
      - *Causal reasoning:* "Paying doesn’t cause termites to vanish. I saved 1,000 points by not paying."  
      - *Evidential reasoning (debrief only):* "If you paid, the predictor’s message might’ve been sent *because* you paid, suggesting no termites. If you didn’t pay, a message might mean termites!"  
  - **Clash of Reasoning (10 min):**  
    - *Host:* "In Round 1, payers bet on tails. In Round 2, non-payers bet on no termites. Both feel logical—but they clash."  
    - Highlight:  
      - **Causal:** "What does my choice *cause*? (Past/fixed events can’t change.)"  
      - **Evidential:** "What does my choice *reveal*? (It signals hidden realities.)"  

  #### **80–90 min: Q&A and Wrap-Up**  
  - Answer questions.  
  - Reiterate: "No right answer—this is a live debate in decision theory!"  

  ---

  ### Predictable Challenges and Fixes  
  1. **Confusion about pre-commitment (Round 1):**  
     - *Issue:* Participants may think "NOT PAY" avoids heads loss *and* gets tails reward.  
     - *Fix:* Stress: "In tails, you only get 1,000 points if you committed to paying in heads."  
  2. **Termite probability misjudged (Round 2):**  
     - *Issue:* Participants ignore low termite risk and always avoid payment.  
     - *Fix:* Remind: "Termites are rare (5%), but losing 1,000,000 is catastrophic."  
  3. **Messaging omission in Round 2:**  
     - *Issue:* Participants miss the "message as evidence" aspect.  
     - *Fix:* Address in debrief: "In the full puzzle, the predictor’s message would’ve given clues about termites."  

  ### Limitation of the Activity  
  - **The predictor’s infallibility:** The activity cannot simulate a *truly reliable predictor* (e.g., in Round 1, participants know the coin flip happens *after* their commitment, not before).  
    - **Debrief supply:** Explain: "In the actual puzzles, the predictor knows your choice *in advance* and the coin/termites are fixed *before* you decide. Your choice reveals what the predictor already knew."  

  This design forces participants to confront the puzzles through lived trade-offs, ensuring the causal/evidential clash is felt viscerally. The debrief then links their frustrations to the deeper philosophical tension.
