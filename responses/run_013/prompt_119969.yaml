            - Forms for payment decision.

        - General: 
            - Pens
            - Paper for participants to record their points.

     Timeline (90 minutes):

        0-5 min: Introduction. Explain that we are doing two decision-making games. No prior knowledge needed. We will experience some puzzles in decision making.

        5-25 min: Round 1 - Coin Flip
            - 5-10 min: Explain the rules of Round 1 (without any theory, just the setup). Hand out the commitment forms. 
