prompt: |-
  Alright, I need a Q&A prep sheet for a talk and I want you to really think it thru before you write anything.

  In about three weeks I'm giving a paper at a slightly odd joint session: my stats department's causal-inference reading group, plus a handful of people from teh epi department's methods group, plus one philosopher of science who turns up to everything. Fifteen people, and they agree about almost nothing.

  The paper is basically called No Formal Fix for Simpsons Paradox, and here's the argument I'm defending:

  - A Simpson reversal — the aggregate table says one thing, every sub-group says the opposite — can be produced by at least three structurally different situations: (a) classic confounding, i.e. a common cause of both the grouping variable and the outcome; (b) conditioning on a collider, a common effect of two other variables, which manufactures an association that wasn't there; and (c) plain non-collapsibility of the effect measure, where an odds ratio flips between its marginal and conditional versions even with no confounding at all.
  - Those three want three different responses. Confounding: adjust for it. Collider: stop conditioning on it, you induced the thing yourself. Non-collapsibility: there's no bias to remove — the marginal and conditional parameters are just different quantities and you have to say which one you actually want.
  - Since one and the same table is compatible with all three, no rule that looks only at the tables can be correct. Analyse at the finest partition; trust whichever table is stable under refinement of the grouping; use sure-thing/dominance reasoning — every one of them either quietly imports a causal assumption or I can counterexample it.
  - So the punchline is that resolving a reversal is never a statistical operation. It's a causal commitment plus a decision about which parameter you care about. The maths is bookkeeping.

  Two constructions do a lot of work in the talk. (i) A 2x2x2 where the reversal flips back if you collapse the third variable the other way, so no level of grouping is privileged as the finest. (ii) A table where my stability-under-refinement rule and the dominance rule point in opposite directions on the same data.

  What I want from you is the Q&A sheet. But first, before you draft anything, spend a few lines brainstorming who is in the room in intellectual terms — what a causal-inference person takes for granted, what a frequentist biostatistician takes for granted, what an epidemiologist actually cares about when they see a reversal, and what the philosopher of science will hear in my central claim — because the same thesis draws a completely different objection from each of them.

  Then give me about eight objections, ordered by how likely they are multiplied by how much damage they'd do, killers first. Phrase each one the way that particular person would actually phrase it, not in my vocabulary. For each: a reply I can deliver in roughly two minutes, and then an honest note on where that reply is soft — what the follow-up will be, and whether I genuinely have an answer or just a hand-wave. Separately, tell me which points I should concede up front rather than fight. Finish with the one question I'm quietly hoping nobody asks — the deflationary one that makes the whole paper sound like a rediscovery of somehting everyone already knew.

  Two more things. Be straight with me about my two constructions: which one is load-bearing and which is vulnerable, and if one of them collapses under an obvious re-description — changing the outcome measure, re-splitting a variable, that kind of move — say so instead of being polite about it. And don't invent citations or literature for me to lean on; I can't look anything up in the room, so if a reply really depends on a specific paper, flag it as a gap rather than faking it.

  Write the whole thing in British English (analyse, behaviour, modelling, etc.). You're effectively a philosopher of statistics and methodologist who has refereed this sort of thing a dozen times, so be blunt with me.
