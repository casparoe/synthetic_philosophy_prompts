prompt: |-
  Bit of an odd one. I'm the compliance person at a mid-sized UK logistics firm and I have to review our whole staff rulebook — about sixty policies, contracts included — every year before the board signs it off. My director keeps saying the only thing that matters is whether we actually interfere with anyone. I know thats just the negative story, and I can't do much with the positive/self-mastery one inside a rulebook, but I've read enough about the third one, non-domination, to think it's the one that would actually bite — the idea being that what matters isn't interference but whether someone has a standing power to interfere with you on an arbitrary basis, and that the test is meant to be something like whether you can look the person in the eye without needing their goodwill. Trouble is, nobody can act on it.

  So write me a procedure I can run on a single policy in about twenty minutes: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands off to a human because it's turned into a question of values rather than facts. I'm not a philosopher and the board won't read more than a page. Two things it has to get right, because they're where I keep going round in circles: (i) it's the power that matters, not the incident, so a manager who never actually interferes can still be a problem if her team would be in trouble the moment she left; and (ii) whether being able to quit counts as an escape, which I think should depend on what the alternative is rather than on how bad the current job is. Then run it on three things — our zero-hours shift scheduling, where people can and do turn down shifts; a line manager who shields her team from senior management and is adored for it; and our grievance procedure, which I think is fine. I want one of those to come out as a no I won't like, so dont soften it. Finally, tell me what the procedure can't do, including the case I've been told about where the thing doing the dominating isn't a person at all — a visa rule tying someone's right to stay in the country to staying in the job — I can't tell whether that's meant to count or whether the theory just falls over there. British English please.
reasoning: |-
  Hmm, the user is a compliance officer at a UK logistics firm, tasked with reviewing dozens of policies annually. They're frustrated because their director only cares about actual interference, but they've learned about non-domination theory (from thinkers like Philip Pettit) and want a practical way to apply it. The core idea is that power imbalances matter even if no one misuses them—like a manager who could interfere arbitrarily but doesn't.  

  The user needs a step-by-step procedure that’s quick (20 minutes per policy), concrete, and avoids philosophical jargon. They specifically want:  
  - Focus on *power to interfere arbitrarily*, not just incidents.  
  - Clarity on whether quitting counts as an escape (it should depend on alternatives, not just job quality).  
  - A test run on three examples: zero-hours contracts (where staff can refuse shifts), a "protective" line manager, and a grievance procedure. They insist one must fail harshly—no softening.  
  - Limitations highlighted, especially for non-person domination (e.g., visa rules).  

  Key challenges:  
  1. **Translating theory into checklist questions** without oversimplifying. The "eye test" (can you look someone in the eye without fear?) is poetic but vague for policy review. Need operational questions like "Can this power be used without justification?"  
  2. **The quitting dilemma**. If alternatives are grim (e.g., no other jobs in town), quitting isn’t a real escape. Must define "reasonable alternative" contextually—e.g., UK job market realities.  
  3. **Non-human domination**. Visa rules clearly create power imbalances (employer holds immigration leverage), but policies can’t fix immigration law. The procedure should flag this as "beyond policy control" but still note the risk.  

  For the examples:  
  - **Zero-hours contracts**: Even if staff refuse shifts, the *employer’s power* to deny future work arbitrarily creates domination. Likely a "no" per non-domination.  
  - **Protective manager**: She shields her team but holds unilateral power. If she leaves, they’re exposed to seniors—so it’s structural domination. Another "no."  
  - **Grievance procedure**: If it has clear steps, appeals, and anti-retaliation rules, it likely passes—power isn’t arbitrary.  

  Procedure design:  
  - **5-step flow**: Start with "power exists?" (factual), then "arbitrary?" (checks safeguards), "escape?" (viable alternatives), "mitigated?" (existing controls), end with binary outcome or human referral.  
  - **Sufficient answers**: E.g., "arbitrary" requires documented checks (like approval layers) or objective criteria. Vagueness fails.  
  - **Handoff to human**: When values clash (e.g., "is this alternative reasonable?") or external factors (visas).  

  Finally, caveats:  
  - Can’t fix societal issues (visas, job markets).  
  - Won’t catch covert power (e.g., cultural fear).  
  - Depends on honest answers—compliance officers might overlook blind spots.  

