  ### Non-Domination Policy Review Procedure (NDPR)

  **Purpose:** To identify policies creating structural power imbalances where someone could arbitrarily interfere with staff, even if never exercised. Focuses on the *capacity* for uncontrolled interference, not incidents.

  ---

  #### Procedure Steps (20 minutes per policy)

  1.  **Identify Power Node:**  
      *   *Question:* "Does this policy grant any person/role ongoing decision-making power over a staff member's work, pay, security, or conditions?"  
      *   *Sufficient Answer:* YES (specify who holds power and over what: e.g., "Manager can set shifts unilaterally"). NO = **Stop (Pass)**.  
      *   *Handoff:* If power is ambiguous or shared.

  2.  **Assess Arbitrariness:**  
      *   *Question:* "Can that power be exercised without being checked by:  
          (a) Clear, objective criteria/rules?  
          (b) A documented process requiring justification?  
          (c) Genuine oversight/appeal by another party?"  
      *   *Sufficient Answer:* YES to (a), (b), or (c) with specifics (e.g., "Scheduling rules are defined in policy", "Grievance panel reviews dismissals").  
      *   *Stop Condition:* NO to all = **Stop (Fail)**. Power is arbitrary.  
      *   *Handoff:* If safeguards exist but are vague ("manager discretion") or oversight is theoretical.

  3.  **Assess Escape Routes:**  
      *   *Question:* "If subjected to arbitrary power under this policy, can the staff member realistically leave the situation *without severe hardship*?"  
          *   Consider: Immediate alternatives (similar local jobs), retraining costs, family commitments, visa status, labour market.  
          *   NOT about whether the *current* job is good/bad.  
      *   *Sufficient Answer:* YES only if:  
          (a) Alternatives are reasonably available AND comparable (pay/security), OR  
          (b) Internal transfer to escape *that specific power-holder* is guaranteed & feasible.  
      *   *Stop Condition:* NO = **Stop (Fail)**. Person is locked in.  
      *   *Handoff:* If hardship level is debatable (e.g., "Is a 10-mile commute 'severe'?").

  4.  **Check Mitigation (if 2 & 3 passed):**  
      *   *Question:* "Does the policy *itself* actively reduce the power imbalance (e.g., training, transparency, countersigning)?"  
      *   *Sufficient Answer:* YES (describe measure). NO is acceptable if Steps 2 & 3 already passed.  
      *   *Outcome:* **Pass**. Policy doesn't create structural domination.  
      *   *Handoff:* If mitigation relies on unwritten culture ("managers are nice").

  ---

  #### Summary Flow:
  ```
  Start → [1. Power Exists?] → No → PASS
                        ↓ Yes
                     [2. Arbitrary?] → Yes → FAIL
                        ↓ No
                     [3. Escape?]    → No → FAIL
                        ↓ Yes
                     [4. Mitigation?] → PASS
  ```

  ---

  ### Test Runs (Using NDPR)

  #### 1. Zero-Hours Shift Scheduling (Staff can refuse shifts)
  *   **Step 1:** YES. Employer holds power to offer/withhold future shifts.
  *   **Step 2:** ARBITRARY?  
      *   Criteria for allocating shifts? Often unstated/subjective.  
      *   Process for challenging non-allocation? Usually none.  
      *   Oversight? Rarely.  
      *   **→ NO sufficient checks → FAIL**  
      *   *(Why fail? Even if staff refuse shifts, the* employer's power *to deny future work arbitrarily remains. Staff may fear saying no. Goodwill isn't structural protection.)*

  #### 2. Line Manager "Shielding" Team from Senior Management (Adored)
  *   **Step 1:** YES. Manager holds concentrated power over team's exposure to seniors/workload.
  *   **Step 2:** ARBITRARY?  
      *   Criteria for shielding? Unlikely defined.  
      *   Process to challenge over/under-shielding? None.  
      *   Oversight? None (she *is* the filter).  
      *   **→ NO sufficient checks → FAIL**  
      *(Why fail? The manager's goodwill is the only safeguard. If she leaves/changes mood, the team has no recourse against her arbitrary power. Structure is dominating even if currently benevolent.)*

  #### 3. Grievance Procedure
  *   **Step 1:** YES. Management/HR hold power over grievance outcomes.
  *   **Step 2:** ARBITRARY?  
      *   Criteria? Policy defines valid grounds.  
      *   Process? Documented steps, timelines, evidence requirements.  
      *   Oversight? Appeal to higher manager/panel specified. Anti-retaliation clause.  
      *   **→ YES, sufficient checks → Proceed**  
  *   **Step 3:** ESCAPE?  
      *   Staff can use procedure without quitting. Escalation is internal escape.  
      *   **→ YES → Proceed**  
  *   **Step 4:** MITIGATION?  
      *   Policy mandates impartiality, confidentiality, appeals.  
      *   **→ PASS**  
      *(Why pass? Power exists but is non-arbitrary due to process/oversight. Staff aren't dependent on a single person's whim.)*

  ---

  ### What the Procedure CAN'T Do

  1.  **Non-Person Domination (e.g., Visas):**  
      *   **Status:** *It counts.* Visa rules create domination *by enabling* the employer's arbitrary power. The test still applies:  
          *   Power exists (employer controls visa sponsorship).  
          *   Likely arbitrary (few internal checks on sponsorship decisions).  
          *   No escape (quitting = deportation → severe hardship).  
      *   **Limitation:** The procedure flags this as **FAIL**, but fixing it requires legal/immigration changes beyond policy control. Document it as an *external* domination risk.

  2.  **Cultural/Covert Power:** Won't catch fear-based compliance if formal policy looks sound. Relies on honest assessment.

  3.  **Positive Freedom:** Doesn't assess if policies enable staff development ("self-mastery"), only if they prevent domination.

  4.  **Interference vs. Non-Interference:** Doesn't care if interference happens, only if the *uncontrolled capacity* exists.

  5.  **Values Judgements:** Hands off when "reasonable escape" or "sufficient check" is subjective. Requires human judgement.

  ### Final Note for the Board
  > "This test flags policies making staff vulnerable to arbitrary power *even if unused*. It's about removing dependencies on goodwill. Failures indicate structural risk, not bad intent. Some fixes may be complex (e.g., visas), but silence in policy enables domination."

