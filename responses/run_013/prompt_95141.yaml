  First, I need to understand their key terms. Exposures refer to risk factors (e.g., smoking), dose-response is the relationship between exposure level and risk, relative risks compare risks between exposed and unexposed groups, attributable fractions measure the proportion of disease burden due to an exposure, and counterfactuals involve comparing to a baseline scenario. The user suspects their framework separates harm attribution (accounting) from actual causal impact (difference-making), which might be central to the philosophical puzzle.

