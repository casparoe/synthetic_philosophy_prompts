answer: |-
  Here is a comprehensive specification of desiderata for a theory of indicative conditionals, organized to highlight tensions and the structure of impossibility results. The list prioritizes *motivated constraints* over framework-specific assumptions, distinguishing core phenomena from potential artifacts.

  ### Core Phenomena & Normative Constraints (The Non-Negotiables)
  1.  **The Ramsey Test Constraint (Epistemic Core):**
      *   **Requirement:** The degree of acceptability/assertibility of an indicative conditional "If A, then C" for a rational agent, in a context, must equal (or approximate) the conditional probability P(C|A), *when defined*.
      *   **Motivation:** Overwhelming empirical support from reasoning experiments, linguistic intuition ("How likely is it that if A, C?"), and its foundational role in Bayesian epistemology and decision theory (e.g., conditional bets). It captures the idea that conditionals express *conditional* thoughts.
      *   **Crucial Note:** This is primarily a constraint on *acceptance conditions*, not necessarily on truth conditions or propositional form.

  2.  **Non-Truth-Functionality & Non-Propositionality Pressure:**
      *   **Requirement:** The theory must explain why indicative conditionals *behave* as if they lack standard truth conditions and are not propositions composable with standard truth-functional operators.
      *   **Motivation:**
          *   **Triviality Results:** Lewis/others show P(If A, C) = P(C|A) + plausible probability axioms + treating the conditional as a proposition → contradiction or collapse to material conditional. This strongly suggests they *cannot be standard propositions*.
          *   **Paradoxes of Material Implication (Avoidance):** A theory must explain why "If not-A, then C" is not automatically true whenever A is true, and why "If A, then C" is not automatically true whenever C is true. Treating "if" as material implication (⊃) fails spectacularly here (e.g., "If the moon is cheese, then I'm the Pope" should not be assertible/true simply because the moon isn't cheese).
          *   **Conditional Contradictions:** We can rationally accept both "If A, C" and "If A, not-C" with low probability without contradiction (e.g., "If the coin is flipped, it will land heads" / "...tails", both P=0.5). This is impossible for standard contradictory propositions.
      *   **Key Distinction:** This *does not* require denying conditionals have *any* kind of truth (e.g., relativized, supervaluational). It requires that their semantic behavior fundamentally differs from that of standard truth-functional propositions.

  3.  **Embedding Coherence:**
      *   **Requirement:** The theory must provide a coherent account of how indicative conditionals embed within:
          *   Other conditionals (e.g., "If (if A, C), then D").
          *   Negation (e.g., "It's not the case that if A, C").
          *   Conjunction/Disjunction (e.g., "(If A, C) and B").
          *   Quantifiers (e.g., "Every student who passes, if they studied, will succeed").
          *   Propositional attitudes (e.g., "John believes that if A, C").
      *   **Motivation:** Conditionals *do* embed grammatically. A theory must explain the meaning and acceptability conditions of these complex constructions without ad-hoc stipulations or massive deviations from compositional semantics. Failure here is a major weakness (e.g., for simple non-propositional views).

  ### Important Explanatory Tasks (Puzzles & Distinctions)
  4.  **Modus Ponens Preservation (with Explanation of Apparent Failures):**
      *   **Requirement:** The theory must validate Modus Ponens (MP: If A, C; A; therefore C) as a *generally reliable* inference pattern for indicative conditionals in standard contexts.
      *   **Motivation:** MP is fundamental to the use of conditionals in reasoning. Apparent counterexamples (e.g., McGee's election case) exist but are highly context-dependent and often involve complex embeddings, shifting contexts, or non-monotonicity. A theory must explain why MP *usually* works and provide a principled account of *when and why* it *seems* to fail.
      *   **Avoid:** Simply rejecting MP wholesale.

  5.  **Import-Export (I-E) Accounting:**
      *   **Requirement:** The theory must explain the strong intuition that "If A, then if B, C" is equivalent to "If A and B, then C" (*Import-Export*), *while acknowledging* potential counterexamples involving context shift, modality, or probabilistic interactions.
      *   **Motivation:** I-E holds robustly for simple indicative conditionals in many contexts (e.g., "If the match is wet, then if it's struck, it will light" ≈ "If the match is wet and struck, it will light"). It's central to nested conditionals. However, counterexamples exist (e.g., "If John is in London, then if he's not in Oxford, he's in France" vs. "If John is in London and not in Oxford, he's in France"). A theory must explain the *strong default tendency* towards I-E and its *limits*.

  6.  **Indicative vs. Counterfactual Distinction:**
      *   **Requirement:** The theory must explain the clear semantic and pragmatic differences between indicative ("If it rained last night, the ground is wet") and subjunctive/counterfactual ("If it had rained last night, the ground would be wet") conditionals, particularly concerning the epistemic status of the antecedent.
      *   **Motivation:** The choice of mood significantly alters meaning and acceptability. Indicatives typically presuppose the antecedent is epistemically possible, while counterfactuals presuppose it's known/believed false. A unified "if" must account for this difference, often linked to contextually accessible worlds or suppositional constraints.

  ### The Shape of the Impossibility (The Conflicting Core)
  The central tension driving triviality results manifests as a **Trilemma** arising from the strongest desiderata:

  1.  **Ramsey Test + Probability:** P(If A, C) = P(C|A) for rational agents.
  2.  **Non-Propositionality Pressure:** Conditionals cannot behave like standard truth-functional propositions (to avoid paradoxes and triviality).
  3.  **Embedding Coherence:** Conditionals must embed logically and compositionally within complex sentences and attitudes.

  **The Triviality Proofs show you cannot satisfy all three simultaneously within a standard logical/probabilistic framework.** Satisfying (1) and (3) seemingly forces conditionals to be propositions (contradicting 2). Satisfying (1) and (2) makes complex embeddings like negation or embedding under attitudes deeply problematic (contradicting 3). Satisfying (2) and (3) is difficult without sacrificing the core probabilistic link in (1).

  **The Single Most Excluding Requirement:** **The Ramsey Test Constraint (1)** combined with **Embedding under Probability Operators** ("The probability that if A, C is high"). This combination is the primary engine of triviality proofs. Any theory that treats "if A, C" as a proposition whose probability *must* equal P(C|A) is doomed by triviality. This immediately excludes standard truth-conditional/propositional accounts that identify the conditional with *any* fixed proposition (material conditional, strict conditional, possible worlds conditional).

  ### How Major Families Fare Against the List

  1.  **Truth-Conditional / Possible Worlds (e.g., Stalnaker, Lewis):**
      *   **Strengths:** Embedding (3), MP (4), Indicative/Counterfactual distinction (6) (with context/world parameters), handles some embeddings.
      *   **Weaknesses:** **Fatally violates Non-Propositionality (2)**. Collides head-on with Ramsey Test (1) and triviality (P(If A, C) ≠ P(C|A) in general). Struggles with Paradoxes of Material Implication (e.g., Stalnaker's "nearness" helps but isn't perfect). I-E (5) often doesn't hold strictly. Apparent MP failures need special explanation.

  2.  **Expressivist / Non-Propositional (e.g., Adams, Edgington - "No Truth Value"):**
      *   **Strengths:** Embraces **Non-Propositionality (2)**, perfectly satisfies **Ramsey Test (1)** (assertibility = conditional prob), avoids Paradoxes of Material Implication easily, explains Conditional Contradictions.
      *   **Weaknesses:** **Severely struggles with Embedding (3).** Accounting for negation, conjunction, disjunction, and especially embedding under quantifiers and attitudes is notoriously difficult and often requires radical departures from standard semantics. I-E (5) can be built-in but embedding issues cast a long shadow. MP (4) holds for simple cases, but complex embeddings remain problematic.

  3.  **Restrictor / Context-Shifting (e.g., Kratzer, Lewis-modality):**
      *   **Strengths:** Excellent **Embedding (3)** via compositional semantics (treating "if" as a device restricting modal operators/quantifiers). Handles complex embeddings and quantification smoothly. Can explain I-E (5) in many cases via domain restriction. Can distinguish Indicative/Counterfactual (6) via modal base/flavor.
      *   **Weaknesses:** **Struggles with the Ramsey Test (1) as a core constraint.** The link between *probability* and the conditional becomes indirect and often obscure (Probability of *what* exactly? The modal claim?). Doesn't naturally explain why *assertibility* of "If A, C" should equal P(C|A). Non-Propositionality (2) is achieved technically (the *if*-clause isn't truth-apt alone), but the resulting proposition (the modal claim) *is* standard, potentially resurrecting triviality worries depending on the modal semantics. Apparent MP failures (4) need explanation within the modal framework.

  This specification provides the necessary framework for evaluating theories and understanding the significance of triviality results. The Trilemma highlights the core challenge: reconciling the Ramsey Test with compositional embedding without collapsing into truth-functionality. Any viable theory must explicitly navigate these conflicting demands, sacrificing or reinterpreting one desideratum, or radically reimagining the underlying logic/probability framework. Good luck with the scoring!
