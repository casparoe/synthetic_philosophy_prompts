prompt: |-
  I've been chewing on something that came up in a reading group on professional ethics, and I'd like you to help me get it straight. Consider how we handle rescue. A firefighter, a lifeguard, or a member of a mountain-rescue team is under a standing obligation -- built into the role and typically into the employment contract -- to go into the burning building or the riptide; declining is a dereliction and can be disciplined or prosecuted. The very same person, off duty and off contract, walking past the identical emergency, is in most common-law jurisdictions under no legal duty to intervene at all, and if they do intervene we call it heroic. Yet the on-duty rescuer who does precisely what the job requires is not usually called heroic, while we still hand out medals and commendations for acts that were, formally, already required of them, and we describe colleagues as exceeding the call even inside a role that already demands a great deal. So one and the same act -- running into the fire -- looks supererogatory, obligatory, or both depending on who performs it and under what arrangement, and the surrounding practices seem to want it both ways at once.

  I'd like you to act as a philosopher of action who works on supererogation and on role-based and institutional obligation, and to reconstruct the theory of the obligatory/supererogatory boundary that this cluster of practices presupposes. I'm not chiefly interested in scoring named theories; I want to know what the practice quietly commits us to. Is the boundary a property of the act and its moral cost, or is it relative to the agent's role, contract, and the reasonable expectations others may hold of them? Which rival pictures of supererogation does the practice rule out? Are its parts mutually consistent -- does obliging someone, or paying them, drain the supererogatory status out of the act, and if so, what exactly is the medal for? And where is the practice underdetermined, such that several incompatible theories of supererogation would license the very same arrangements? Think carefully and weigh the rival reconstructions before you settle; I've read these forums long enough to distrust a reconstruction that smuggles in the conclusion, so flag the load-bearing step rather than smoothing it over.

  Give me exactly five numbered points, each one or two sentences, with no preamble and no closing summary: the first should state the implicit theory the practice presupposes; the second should say whether that theory makes the boundary act-determined or role-relative; the third should name what the practice rules out; the fourth should say where the practice is underdetermined or internally inconsistent; and the fifth should tell me which argument or consideration would change your verdict, and where your reasoning is most likely to fail.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle about supererogation and role obligations. The user is clearly well-versed in philosophy, framing it precisely with firefighter/lifeguard examples and asking for a clean five-point reconstruction. They want the practice's implicit logic laid bare, not textbook theories.

  First, let's unpack the core tension: same physical act (running into fire), but its moral status shifts based on role context. Off-duty = supererogatory heroism; on-duty = baseline obligation. Yet we still give on-duty rescuers medals for "exceeding duty" - so is obligation porous? The user's suspicion about inconsistent practices seems warranted.

  Key angles to weigh:
  - Act-centered theories would struggle here (how can identical acts have different statuses?)
  - Role-relativity explains the duty shift but not why medals exist for "mere" obligation-fulfillment
  - The medal practice suggests even within roles, there are gradations beyond contractual duty

  For point 1 (implicit theory): Practices treat the obligatory/supererogatory boundary as jointly determined by act-cost and role-expectations. Role sets the baseline obligation, but extreme acts within roles can still be "extra." 

  Point 2 (boundary nature): It's role-relative, not act-determined. The fire's danger is constant, but the duty-trigger depends on institutional position.

  Point 3 (ruled out): Pure act-centered supererogation theories (where moral cost alone defines heroism) can't explain why professionals aren't heroic for doing their job.

  Point 4 (inconsistency): Why award medals for acts that were already obligatory? This gap between contractual minimum and praiseworthy maximum needs explaining - perhaps the practice assumes roles have fuzzy edges.

  Point 5 (fragility): If we found cultures where professionals are never decorated for in-role acts, my role-relativity claim weakens. Also, I might underestimate how medals reframe obligatory acts as voluntary commitments.

  User's "smuggle-proof" demand means I must flag how medal practices strain the theory - they're the load-bearing crack.
answer: |-
  1.  The practice presupposes that the obligatory/supererogatory boundary is primarily set by institutional roles and contracts, which establish baseline duties, while supererogation requires exceeding the reasonable expectations embedded within that specific role or context, even if the act is physically identical.
  2.  The boundary is fundamentally role-relative (and context/contract-relative) for determining obligation; the act's inherent moral cost contributes to whether exceeding the role's baseline expectations qualifies as supererogatory.
  3.  The practice rules out purely act-centered theories of supererogation, where the moral cost/risk of the act alone determines its status regardless of the agent's institutional position or prior commitments.
  4.  The practice is internally strained regarding what constitutes "exceeding" within a demanding role: awarding medals for required acts suggests an inconsistency, implying either that roles have a minimum contractual duty and a higher praiseworthy standard, or that recognition acknowledges the *voluntary acceptance* of the role's inherent risks.
  5.  My verdict is most vulnerable if medals signify *solely* the act's cost/benefit, ignoring role context, or if "reasonable expectations" within roles prove indefinable; the load-bearing step is reconciling obligatory baseline actions with praiseworthy recognition for the same act performed within role.
