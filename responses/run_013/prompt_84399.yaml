    - **Software contractor (refused):** Not on shortage list + net-negative fiscal impact (no tax paid). Fiscal impact was decisive.  
    - **Roofer (refused):** Shortage occupation, but net-negative due to disability benefit. Fiscal impact overrode shortage status.  
    - **Care worker (admitted):** Shortage-like occupation (implied by care home hire) + net-positive over 15 years, despite household costs (kids in school). The 15-year model was the key factor.  

  This rule treats healthcare workers for rural hospitals as a special exception, but for others, the 15-year model is decisive. Local factors (e.g., school impacts) are not considered, as seen in all cases.

  ### 2. **Other Rules That Fit the Record Just as Well**
  Two alternative rules are equally consistent with past decisions:  
  - **Rule B:** Admit if (a) the applicant is in a shortage occupation AND hired by a rural hospital/care home, OR (b) the 15-year model is net-positive. Refuse otherwise.  
    - *Fits*: Nurses admitted (healthcare + rural hospital), care worker admitted (15-year positive), roofer refused (not healthcare/rural), contractor refused (not shortage/positive).  
  - **Rule C:** Admit if the 15-year model is net-positive OR the applicant is a healthcare worker in a rural hospital. Refuse if net-negative.  
    - *Fits*: Nurses admitted (healthcare + rural), care worker admitted (15-year positive), roofer refused (not healthcare/rural + negative), contractor refused (negative).  

  Both alternatives fit because the healthcare/rural exception and 15-year model cover all cases. The board hasn't faced a conflict between these yet.

  ### 3. **Prediction for the New Case (Nursing Assistant)**
  - **New case details:** Nursing assistant (shortage list), identical to the care worker except the ministry's model is net-negative over a longer horizon (beyond 15 years). Local factor: Her kids would keep a half-empty school open (not in ministry model).  
  - **Predictions:**  
    - **Our primary rule:** Refuse. The ministry's model is net-negative (even if over a longer horizon), and she is not a nurse in a rural hospital. Local school benefits are ignored (as in past cases).  
    - **Rule B:** Admit. She is a healthcare worker (nursing assistant) hired by a care home-like employer (implied by shortage list role), similar to nurses.  
    - **Rule C:** Refuse. She is not a nurse in a rural hospital, and the model is net-negative.  

  ### 4. **Closest Analog Case**
  - **Care worker case** is the closest analog:  
    - Both are low-wage healthcare workers (care worker vs. nursing assistant) with kids in school.  
    - Both have household costs, but the care worker was admitted due to 15-year net-positive.  
    - Key difference: The nursing assistant's model is net-negative over a longer horizon, but the local school benefit (unmodeled) is new.  

  ### 5. **How to Vote to Stay Consistent with the Board**
  - **Vote to REFUSE the nursing assistant.**  
    - **Why?**  
      - Consistency with the **roofer** and **software contractor** cases: Both were refused for net-negative fiscal impact. The ministry's model is the board's anchor, and the nursing assistant's model is negative (even if over a longer horizon).  
      - Consistency with the **care worker** case: The board relied on the 15-year model for admission, but here the ministry has provided a model result (negative) and the horizon change doesn't invalidate it—it's still a net-negative assessment. The board has never overruled the model for local factors (e.g., school impacts weren't considered for the care worker's kids).  
      - The "healthcare exception" only applied to **nurses in rural hospitals**, not nursing assistants or care workers. The care worker was admitted based on the model, not occupation alone.  

  ### 6. **Commitments Based on the Vote**
  - **If we REFUSE:**  
    - We commit to:  
      - Upholding the ministry's fiscal model as primary, regardless of horizon changes.  
      - Ignoring unmodeled local factors (e.g., school closures).  
      - Limiting the "healthcare exception" strictly to nurses in rural hospitals (not extending to nursing assistants or care workers).  
    - Risks: Inflexibility if local benefits are significant, and potential criticism for ignoring community impacts.  

  - **If we ADMIT:**  
    - We commit to:  
      - Overruling the model for local factors or healthcare roles beyond nurses, creating inconsistency.  
      - Using variable time horizons (15-year vs. longer) arbitrarily, undermining predictability.  
      - Expanding the "healthcare exception" to include nursing assistants, which wasn't done for the roofer (shortage list but refused).  
    - Risks: Inconsistency with roofer/contractor refusals, and opening the door to exceptions for every unmodeled local benefit.  

  ### 7. **The One Case That Would Settle Which Rule We're Running**
  - **The decisive case:** A nurse recruited by a rural hospital with a **net-negative 15-year model** (e.g., due to high household costs).  
    - **Why this settles it:**  
      - If we **admit**, we confirm **Rule B/C**: Healthcare workers in rural settings are admitted regardless of the model.  
      - If we **refuse**, we confirm the **primary rule**: The model is decisive except for very narrow exceptions (none so far), and healthcare status alone isn't enough.  
    - This case is missing from our record—all nurses were admitted without model data, suggesting the board may prioritize healthcare access over fiscal concerns, but it's untested.  

  ### Summary
  - **Vote recommendation:** Refuse the nursing assistant to stay consistent with the roofer, contractor, and care worker cases. The ministry's net-negative model is controlling, and local school benefits are outside our rule.  
  - **Final decision:** This case exposes ambiguity in our rule (healthcare exception vs. model primacy). The nurse-with-negative-model case would clarify it. For now, refusing maintains fiscal consistency but risks overlooking local needs—address this by revising guidelines to formalize the role of local impacts or model horizons.
