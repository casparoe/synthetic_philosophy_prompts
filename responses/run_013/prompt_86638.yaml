prompt: |-
  I'm in a third-year seminar on rationality and decision theory, and I have to commit to a topic for a long final paper within the next two weeks. The unit that unsettled me most was on superrationality: the Platonia dilemma, in which twenty people must each decide whether to send a telegram, and the prize goes to a sender only if exactly one telegram arrives (the standard answer being to send with probability one in twenty); and the Luring Lottery that Scientific American actually ran, in which the prize is a million dollars divided by the number of entries, readers may enter as many times as they like, and the reasoning runs away into a contest to write the largest number that fits on a postcard, which is roughly what happened.

  I want a defended agenda rather than a survey. What are the live open questions about superrationality and one-shot cooperation, and which one or two should someone with my constraints actually pursue: one semester, no laboratory, comfortable with formal modelling and a little programming, weak on economics? Please rank them by how much else depends on the answer, how tractable they are in that time, and whether settling them would change any concrete advice about designing a coordination problem or building cooperative agents, and say what evidence or argument over the next few months would move a question up or down the list. I am also stuck on two things I cannot get a grip on: what superrationality even recommends when the players are asymmetric (say, one of the twenty is known to be a committed sender, or their payoffs differ), and whether a version in which nobody knows the size of the group turns the recommendation into a fixed point rather than a probability. If those are dead ends, tell me so and name the crux I should be working on instead. No reading list, please: I care about what is worth thinking about, not what has been written.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a third-year seminar on rationality and decision theory, focusing on superrationality. The two examples that stood out to them are the Platonia Dilemma and the Luring Lottery. They need to pick a paper topic within two weeks, and they want a defended agenda, not a survey. Their constraints are one semester, no lab access, strong in formal modeling and some programming, weak in economics. They also have specific confusions about asymmetric players and unknown group sizes.

  First, I need to identify the core issues they're facing. The user is stuck on asymmetry and unknown group size in superrationality. But are these the best areas to explore? I recall that asymmetry in superrationality isn't well-covered in existing literature. It might be a dead end because superrationality relies heavily on symmetry. If players have different payoffs or commitments, the symmetry breaks, and the solution might not hold. Unknown group size could lead to infinite regress or fixed-point issues. But maybe that's more tractable?

  The user wants live open questions. What are the current debates? One key question is whether superrationality is a distinct solution concept or reducible to other concepts like correlated equilibrium. Another is how to formalize it beyond symmetric games. Also, the applicability in agent design—can we build AI that uses superrational reasoning?

  Considering their constraints: no lab means empirical work is out. Comfort with formal modeling and programming suggests computational approaches like simulations. Weak economics means avoiding market-based models. They need something manageable in one semester. So, a theoretical model with simulations to test robustness would fit.

  Tractability is crucial. Exploring unknown group size with fixed-point equations and simulations could be doable. Asymmetry might be messier. The user also cares about impact—would solving this change how we design coordination mechanisms? Understanding group size uncertainty could inform real-world applications like decentralized systems or AI coordination.

  Ranking the questions: Formalizing group size uncertainty seems top. It's tractable, has implications for mechanism design, and can be approached with their skills. Comparing solution concepts is broader but might be too vague. Asymmetry is less understood but could be a secondary focus if time permits.

  For evidence moving the needle: If simulations show that fixed-point solutions converge under uncertainty, that supports superrationality's robustness. If not, it might undermine its practicality. For asymmetry, finding a consistent solution even with minor asymmetities would strengthen the concept.

  Advising the user to pivot from asymmetry to group size uncertainty makes sense. The crux is whether superrationality can handle incomplete information. That's a live question with clearer methodology for them. They can develop a model, run simulations, and derive design insights—all within their timeframe.
answer: |-
  Based on your constraints (formal modeling/programming strength, no lab, weak economics, one semester) and desire for a defended agenda tackling live open questions with concrete implications, here's a ranking of promising research avenues in superrationality and one-shot cooperation, focusing on tractability, centrality, and impact:

  **Ranked Research Agendas:**

  1.  **Formalizing and Analyzing Superrationality under Group Size Uncertainty (Your Fixed-Point Question)**
      *   **The Live Question:** What does superrationality recommend when agents *don't know* the total number of players `N`? Is the symmetric mixed strategy (e.g., p=1/N) achievable? Does it lead to a fixed-point problem? What are the equilibrium concepts here?
      *   **Why Top Ranked?**
          *   **Centrality:** Directly tackles a fundamental assumption of classic superrational dilemmas (perfect knowledge of `N`). Resolving this is crucial for applying the concept to realistic scenarios (where `N` is often unknown or estimated).
          *   **Tractability:** Highly suited to your strengths. Define a model where agents have priors over `N` (e.g., uniform over 1 to M, geometric, Poisson). Formulate the fixed-point equation: each agent's optimal `p` depends on the distribution of `N` *and* the `p` chosen by *all other agents*, who are reasoning identically. Solving this fixed point analytically or computationally (simulation in Python/R) is feasible.
          *   **Impact on Design/Agents:** Results directly inform how to design coordination mechanisms where participant count is uncertain (e.g., decentralized protocols, resource allocation). Shows whether superrational cooperation is robust or fragile to this uncertainty. Offers concrete advice: "If you want superrational cooperation in an unknown-`N` setting, structure payoffs/prizes like X."
          *   **Evidence Moving Needle:** Finding a coherent, computable fixed-point solution for plausible priors boosts superrationality's credibility. Showing instability, multiple equilibria, or convergence to non-cooperative outcomes undermines its practical relevance. Demonstrating robustness/vulnerability to different prior distributions is key evidence.
      *   **Your Confusion:** This directly addresses your question about unknown group size turning into a fixed point. It's **NOT** a dead end; it's a core open problem ripe for investigation with your toolkit.

  2.  **The Solution Concept Status: Is Superrationality Reducible or Fundamental?**
      *   **The Live Question:** Is superrationality a distinct, fundamental solution concept for symmetric games, or is it reducible to (or a special case of) existing concepts like Correlated Equilibrium (CE), Team Reasoning, or even specific types of Bayesian Nash Equilibrium (BNE)? What unique predictions or prescriptions does it offer that others don't?
      *   **Why Ranked Second?**
          *   **Centrality:** Goes to the heart of *what superrationality even is* theoretically. Settling this clarifies its place in decision/rationality theory and its relationship to more established frameworks.
          *   **Tractability:** Primarily analytical/conceptual work. Requires deep dives into the definitions and properties of SR, CE, Team Reasoning, and BNE. Identify specific symmetric games (like Platonia or modified versions) where SR prescriptions demonstrably diverge from these other concepts, or prove equivalence under certain conditions. Less programming, more formal logic/game theory proofs. Very feasible within a semester.
          *   **Impact on Design/Agents:** Clarifies *when* to apply SR reasoning vs. other frameworks. If irreducible, it mandates specific design principles for fostering cooperation unique to SR logic. If reducible, it shows how existing mechanisms can achieve SR-like outcomes. Crucial for building agents: should they implement a distinct SR module, or can standard BNE/CE solvers suffice?
          *   **Evidence Moving Needle:** Rigorously demonstrating a game where SR yields a unique, compelling prediction distinct from and arguably more rational than CE/BNE/Team Reasoning would be massive evidence for its fundamentality. Conversely, proving equivalence under broad symmetry conditions confines it to a specific subclass.
      *   **Your Confusion:** While not directly addressing asymmetry, this work provides the essential theoretical foundation *before* tackling asymmetry meaningfully.

  3.  **Asymmetry in Superrationality (Your Committed Sender Question - Proceed with Caution)**
      *   **The Live Question:** How does superrationality function when symmetry is broken (differing payoffs, known commitments, varying reasoning capabilities)? Does it break down entirely? Can a modified "generalized superrationality" be defined?
      *   **Why Ranked Third (and Caution Advised)?**
          *   **Centrality:** Asymmetry is ubiquitous in the real world. Understanding if/how SR applies is essential for practical relevance.
          *   **Tractability (The Challenge):** This is **HARD**. Superrationality relies *heavily* on symmetry. Breaking symmetry often destroys the clean "we are identical, therefore we will reason identically" foundation. Solutions become highly context-dependent. While modeling scenarios (e.g., Platonia with 1 known sender, others symmetric) is possible, finding a *compelling, generalizable* SR solution is elusive. Risk of getting stuck in intractable case studies.
          *   **Impact:** High *if* successful. Design advice for asymmetric coordination problems would be invaluable. Agent design would need robust methods to handle mixed populations.
          *   **Evidence Moving Needle:** Developing a coherent, formal framework for *any* type of asymmetry (e.g., known commitments) that yields clear, testable predictions would be significant progress. Showing consistent failure or contextual fragility would also be valuable knowledge.
      *   **Your Confusion:** You're right to be stuck; this is a major conceptual hurdle. **Recommendation:** Only pursue this *after* making significant progress on Agenda #1 or #2 within the semester. Use a specific, tractable asymmetry (like exactly one known committed sender) as a *test case* for insights gained from the other agendas. Don't make asymmetry your *primary* focus given the time constraint; it's more likely a potential follow-up.

  **Dead Ends & Your Cruxes:**

  1.  **Asymmetry as a Primary Focus (Right Now):** As argued above, starting here is likely too ambitious and ill-defined within one semester. The fundamental reliance on symmetry makes this a quagmire without first solidifying the core symmetric case under uncertainty (#1) or its theoretical status (#2).
  2.  **Rehashing Existing Dilemmas:** Analyzing Platonia/Luring Lottery *without* introducing a significant new angle (like uncertainty, asymmetry, or the solution concept debate) will likely feel like a survey, not a defended agenda.
  3.  **Pure Behavioral/Empirical:** No lab access rules this out. Stick to modeling and conceptual analysis.

  **Your Cruxes to Work On (Instead of Head-Asymmetry):**

  1.  **The Information Crux:** What information do agents minimally need for superrational cooperation to be feasible and compelling? (Agenda #1 directly tackles the `N` part of this).
  2.  **The Ontological Crux:** What *kind* of solution is superrationality? Is it about rational choice under a specific belief structure (symmetry as common knowledge), collective agency, or something else? (Agenda #2 tackles this).
  3.  **The Robustness Crux:** How sensitive is the superrational solution to small deviations from perfect symmetry or perfect knowledge? (Agenda #1 - uncertainty - is a key part of this. Agenda #3 - minor asymmetries - would be another, but harder).

  **Concrete Recommendation:**

  **Pursue Agenda #1: Superrationality under Group Size Uncertainty.** This directly addresses one of your confusions in a highly tractable way using your strengths. It's a live, central question with clear implications for designing real coordination mechanisms and building cooperative agents under realistic (uncertain) conditions.

  *   **Defended Agenda:** Argue that assuming known `N` is unrealistic and critically weakens superrationality's applicability. Demonstrate how incorporating uncertainty fundamentally changes the problem and solution concept (fixed-point), then analyze this model.
  *   **Method:** Define model (agents, prior over `N`, payoff structure). Formulate fixed-point equation for symmetric strategy `p`. Solve analytically for simple priors (e.g., uniform over small range). Implement simulation for more complex priors (Poisson, geometric). Analyze convergence, equilibrium `p`, efficiency compared to known-`N` case and Nash. Discuss implications for mechanism design (e.g., how should prizes scale? Is announcing estimated `N` helpful/harmful?).
  *   **Evidence to Gather:** Does the fixed-point converge? Is the solution unique and stable? How does the equilibrium `p` and expected payoff compare to the known-`N` case `(p=1/E[N])`? How robust is it to the choice of prior? Does it ever collapse to non-cooperation?

  This path offers the best balance of novelty, centrality, tractability, impact, and alignment with your skills and constraints, while directly tackling a core uncertainty you identified. Good luck!
