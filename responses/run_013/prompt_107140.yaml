answer: |-
  Here's a decision tree for the Statue & Lump puzzle, designed for a seminar handout, starting from a common-sense commitment and branching via answerable questions. It incorporates your original cases (marked with **) and aims for ~8 leaves and 5 key branch nodes.

  **Starting Commitment:** There is one object on the pedestal (both a statue and a lump of clay), not two objects in two places.

  1.  **Q1: Do composite material objects (like statues or lumps) exist at all?**
      *   *No* → **Eliminativism (Van Inwagen/Merricks-ish)**  
          *Awkward Commitment:* Denies the existence of chairs, statues, lumps – only fundamental particles (or organisms, per Van Inwagen) truly exist. *(Leaves Q2-Q5 irrelevant - N/A)*
      *   *Yes* → Proceed to Q2.

  2.  **Q2: Are the statue and the lump literally identical? (Is "statue" just another name for *that very object*?)**
      *   *Yes* → Proceed to Q3.
      *   *No* → Proceed to Q4.

  3.  **Q3: Can an object survive the loss of properties essential to being a statue? (E.g., Does the object survive if we squash it into a ball, losing its statue-shape?)**
      *   *No* → **Mereological Essentialism (Chisholm-ish)**  
          *Awkward Commitment:* *Any* change in parts destroys the object. The lump-statue couldn't survive *any* deformation or part replacement.
      *   *Yes* → **Standard Identity View**  
          *Awkward Commitment:* Must hold that being a statue is *not* an essential property of the object. The *same* object is first a statue, then a lumpy ball. (*Incoherent if combined with Q4/5 answers denying survival - marked empty*).
          *   *(Empty Combination: Yes at Q2 + No at Q3 is explored (Mereo Essentialism). Yes at Q2 + Yes at Q3 is Standard Identity. But if you later said at Q4/Q5 the lump survives squashing but the statue doesn't, this would contradict the Q2 "Yes" answer. So Q4/Q5 are N/A after Q2=Yes).*

  4.  **Q4: Does the lump survive radical change? (E.g., being squashed into a ball? Or, using **Case (c)**: Does the water (lump) survive melting and refreezing into a different shape?)**
      *   *No* → **Extreme Mereological Constraint / Temporary Lumps**  
          *Awkward Commitment:* Lumps are very fragile; even melting/reshaping destroys the lump. Material objects rarely persist through change. *(Leads to fewer explored positions; often converges with eliminativism or radical views)*.
      *   *Yes* → Proceed to Q5.

  5.  **Q5: Does the statue survive radical change? (E.g., being squashed? Or, using **Case (c)**: Does the ice statue survive melting and refreezing into a different shape?)**
      *   *Yes* → **Four-Dimensionalism / Worm Theory (Lewis, Sider)**  
          *Awkward Commitment:* Objects are 4D spacetime "worms." The statue and lump are distinct temporal parts of the same or different worms overlapping *now*. The pre-squash statue-part and post-squash lump-part belong to different worms. Persistence is having temporal parts.
      *   *No* → Proceed to Q6.

  6.  **Q6: Is being a statue an essential property? (Could *this very object* have existed without ever being a statue?)**
      *   *No* → **Constitution View (Baker)**  
          *Awkward Commitment:* The statue and lump are non-identical but coincide (share all matter) when the lump constitutes the statue. The lump could exist without being statue-shaped; the statue couldn't exist without being constituted *as* a statue. **Case (a)** (3D printer) is fine (coincidence starts instantly); **Case (c)** (melted ice) ends the statue but not the water (lump).
      *   *Yes* → Proceed to Q7.

  7.  **Q7: Using **Case (b)**: When the river-eroded rock (indistinguishable from a statue) is placed on a plinth in a gallery as a "found object," does it *become* a statue? Does this require a maker's intention?**
      *   *No, it was already a statue / No intention needed* → **Hylomorphism (Aristotelian/Contemporary)**  
          *Awkward Commitment:* Being a statue is about having a specific substantial form/organization conferred by its nature/potentialities, not necessarily human action. The rock had the form all along or acquired it via natural processes before display. Identity is absolute but form-dependent.
      *   *Yes, only upon display / Intention is required* → **Intention-Dependent Constitution / Artefact Essentialism**  
          *Awkward Commitment:* Something only becomes a statue when intended *as such* and placed in the right context. The rock wasn't a statue until displayed. This makes artefact kinds deeply dependent on external minds/history.
      *   *It's vague / There's no fact / "Statue" is just a description* → **Deflationism / Anti-Realism about Artefact Kinds**  
          *Awkward Commitment:* There's no deep metaphysical fact about whether it's "really" a statue or when it became one. "Statue" just reflects our interests and descriptions. **Case (a)** (3D printer) has a clear statue because we say so; **Case (b)** (rock) is indeterminate.

  **Key Notes:**

  *   **Indistinguishable Leaves:** "Hylomorphism" and "Intention-Dependent Constitution" might be hard to distinguish solely via **Case (b)** depending on how "form" is interpreted. The tree forces a pragmatic split on the role of intention.
  *   **Empty/Problematic Combinations:**
      *   *Q2=Yes + Later answers implying statue≠lump:* Incoherent (contradiction).
      *   *Q4=No (Lumps don't survive):* Leads to relatively unexplored or radical territory. Often collapses into eliminativism about lumps specifically or mereological nihilism. Unattractive to common sense.
      *   *Q6=No (Statue not essential) + Q7 Answers:* Covered by Constitution View.
  *   **Your Cases Incorporated:**
      *   **Case (a) (3D Printer):** Directly challenges views where the lump must predate the statue. Handled smoothly by Constitution, 4D, Deflationism. Problematic for some Identity views if they require temporal priority.
      *   **Case (b) (Eroded Rock):** Central to Q7, distinguishing views based on the necessity of maker intention vs. form vs. deflation.
      *   **Case (c) (Ice Statue):** Used implicitly in Q4/Q5 to test survival of lump (water) and statue through radical change (melting/reshaping).

  This tree provides a logical path from common sense to major positions, using answerable questions and original cases, fitting within the constraints.
