prompt: |-
  I'm in a reading group that's been chewing on futarchy — the idea that you vote on values and bet on beliefs, so a policy only gets adopted if conditional prediction markets say the world will be better with it than without it — and I've been asked to bring in a case that really stresses the mechanism. I want to build one myself rather than rehash the ususal objections, and I want it to bite for a reason that isn't thin markets, manipulation, or dumb traders. Specifically: a realistic local setting (a city council, a school board, a hospital trust, whatever), where the conditional market on the policy returns a confident and honestly well-supported yes, every trader is stipulated to be at least as well infomed and as well calibrated as the officials, nothing underhanded happens, and yet adopting the policy makes things go worse than not adopting it. The failure has to be structural — it has to come out of what the bet is actually about, not out of anybody's mistake.

  One more thing I want to insist on, because it's where I think the interesting version lives. The easy version of this is feedback: traders see a yes and act on it, the prediction partly causes its own truth, and you can arguably fix that with better market design. I don't want that version. I want a case where the conditional being traded isn't well defined in the first place — where there's no settled fact about how things would have gone had we chosen otherwise, because the counterfactual world's policy is itself a function of a decision procedure (or a price) that only exists in this one. If you think that can't be done without cheating, say so and build the closest thing that can, but I'd rather you try. Constraints: no exotic tech, no time travel, no perfect predictors, nothing that couldn't plausibly happen in a real municipality in the next five years, and I want to be able to run one test on the finished case — delete that single structural feature, change nothing else, and the market's verdict should come out correct. That's how I'll know the case is isolating the right variable.

  Give it to me as exactly five numbered items, one or two sentences each, no preamble and no wrap-up. (1) The scenario, with the market's question stated precisely enough that I can see exactly what's being bet on and who's betting. (2) What the futarchy procedure says to do here, and the reasoning that gets it there. (3) What the right decision actually is, and why the market lands on the wrong one without anyone having erred. (4) The one feature doing the work, and what happens to the case when I remove it. (5) The best defence available to someone who thinks futarchy survives this, and whether that defence saves the case as stated or quietly changes the mechanism.
reasoning: |-
  Hmm, the user wants a futarchy stress test case that avoids common objections. They need a scenario where prediction markets confidently approve a policy that backfires, with no errors from traders or manipulation. Key constraints: realistic local setting, structural flaw (not feedback loops), and the counterfactual must be undefined due to interdependent decision procedures. They want five numbered items without preamble.

  I'm considering the core challenge: creating undefined counterfactuals. Futarchy relies on comparing two worlds—one with the policy, one without. But if the "without" scenario depends on mechanisms that only exist under futarchy, that world isn't coherent. For example, if rejecting a policy would trigger different decision paths that are inaccessible when futarchy is active.

  For the setting, a school board fits well—it's local, policy-focused, and has measurable outcomes like test scores. The policy could be switching to voucher funding. The market would bet on whether test scores improve under vouchers versus the status quo. Traders are well-informed and calibrated, so the market says yes with high confidence.

  The structural flaw comes from how the counterfactual is defined. Without the policy, the board might use traditional voting, leading to different policies like increased funding. But under futarchy, that alternative process doesn't exist—it's replaced by market mechanisms. So traders can't properly assess what would happen in the "no policy" world because that world has a different governance system.

  When the voucher policy is adopted, it causes disruption and a drop in scores. The market was wrong not due to trader error but because the counterfactual was incomparable. If we remove the interdependent decision procedure—say, by specifying a fixed alternative policy—the market would correctly predict failure.

  A futarchy defender might argue for better counterfactual specification. But that would require changing the mechanism to define static alternatives, which avoids the problem but alters futarchy's real-world application where policies are dynamic.
answer: |-
  1. **Scenario**: A city school board uses futarchy to decide on switching to a voucher system. Traders bet on whether average district-wide standardized test scores one year after implementation will be higher under the voucher policy than under the board's *usual non-futarchic decision process* applied to the same funding crisis.  
  2. **Futarchy Outcome**: The market predicts significantly higher scores under vouchers than under the board's alternative process. Reasoning: Traders model vouchers driving competition/improvement, while modeling the board (prone to deadlock) likely making only minor, ineffective funding tweaks if vouchers are rejected.  
  3. **Actual Outcome & Market Failure**: Adopting vouchers causes disruptive churn and drops scores. The correct decision was rejection. The market erred because the board, *faced with rejecting the futarchy-recommended voucher policy*, would have enacted a major, effective funding reform package (impossible under deadlock-prone futarchy-less voting but triggered by the political pressure of the high-stakes futarchy vote itself).  
  4. **Key Feature & Removal**: The *counterfactual ("no policy") outcome depends inherently on the specific context and pressures of rejecting a high-visibility futarchy recommendation*, which only exists *because* futarchy was used. Remove this interdependence (specify a *fixed, predetermined* alternative policy like "increase per-pupil funding by 5%" instead of "board's usual process") and the market accurately predicts vouchers' failure.  
  5. **Best Defence & Efficacy**: Defence: Futarchy requires precisely defined, context-independent counterfactuals. Specify the alternative policy rigidly upfront. This *changes the mechanism* (abandoning dynamic political reality for static comparison) and doesn't save the case as stated, where the counterfactual is defined by the board's real, pressure-sensitive process.
