prompt: |-
  I'm the chair of the clinical ethics committee at a community hospital, and I've got to circulate a written opinion before Thursday's meeting on a case that has us split right down the middle.

  The short version: a 78-year-old woman was diagnosed last week with advanced pancreatic cancer. Her three adult kids, who've been at every appointment, caught the oncologist in the hallway and asked him not to tell their mother. Their line is that in their family, and in the community they come from, news like this goes to the eldest son first and he decides how much to share and when -- telling her flat out would strip away her hope and cut the family out of the one thing they know how to do. The oncologist says our policy gives the patient a right to know her own diagnosis, and he doesnt want to sit there and lie to her. He also pointed out, kind of sharply, that the kids' reading of "their culture" might just be what the kids want. One of our members, a palliative care doc, wants us to adopt something she calls relational consent: the family, not just the patient, is the unit that consents, so long as the patient has at some point named a family member to handle her medical info (she did -- her son is her listed contact). She'd wrap that in a two-key rule: the team can hold back the diagnosis only if the named proxy and the attending both agree, the team never affirmatively lies, and the hold gets revisited every 72 hours with an automatic trigger to disclose if the patient asks straight out. Another member says that whole thing is just paternalism with a passport.

  What I need from you is the memo itself. Give me a concrete recommendation for this patient, with a time frame, and then a going-forward policy, because we are absolutely going to get more of these. Two things I care about. First, dont let us just chant "autonomy" and roll the family, and dont let us treat "East Asian family values" as a monolith that overrides whatever this particular woman would actually want if someone asked her -- I've watched committees make both of those mistakes. Second, the family's ask has two pieces: keeping the information from her, and taking over the decisions. I have a hunch those come apart, so please dont just lump them together -- tell me whether our policy should treat them the same or differently, and why. And whatever you end up recommending, take the strongest version of the side you're ruling against seriously, because I have to look these people in the eye on Thursday.
reasoning: |-
  Okay, the user is the chair of a clinical ethics committee facing a tough case. Let me start by understanding the scenario. A 78-year-old woman with advanced pancreatic cancer. Her three adult children asked the oncologist not to tell her the diagnosis. They claim cultural reasons where the eldest son decides what to share. The oncologist insists on the hospital's policy of patient autonomy. The committee is split. 

  First, I need to address both immediate action and a long-term policy. The user mentioned not to default to autonomy without considering the family's role, but also not to stereotype cultural values. They want a nuanced approach. 

  Looking at the family's two requests: withholding information and making decisions. Are these separable? Maybe the family can be involved in decisions without hiding the diagnosis. The palliative care doc's relational consent idea has a two-key rule. That seems balanced—requiring both proxy and attending agreement, no lying, and periodic reviews. 

  But the other member calls it paternalism. How to counter that? The policy must ensure the patient's voice isn't lost. The existing documentation shows she named her son as contact, but that doesn't mean she surrendered her right to know. Maybe the hospital can suggest a gentle disclosure with family support. 

  For the immediate case, recommending a time-limited hold with conditions makes sense. The 72-hour review gives flexibility. The family's cultural argument needs verification. The team should explore the patient's past preferences discreetly. 

  Long-term policy should separate information control from decision-making. Proxies can make decisions if the patient lacks capacity, but information belongs to the patient unless they waive that right. Clear documentation and regular reassessments are key. Highlighting cultural humility without assuming monolithic values. 

  The user also needs to present both sides fairly. The family's concern about hope and tradition is valid, but the patient's right to know is fundamental. Balancing both without lumping the issues together. Ensuring the policy requires checking the patient's actual wishes, not just cultural assumptions. 

  Need to structure the memo with background, analysis, recommendations for the case and policy, and addressing counterarguments. Make sure the language is respectful and thorough, as the user has to defend this in a divided committee.
answer: |-
  ## MEMORANDUM  
  **TO:** Clinical Ethics Committee Members  
  **FROM:** Chair, Clinical Ethics Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Urgent Recommendation & Policy Framework: Disclosure of Diagnosis & Decision-Making Authority - Case of Patient M (78F, Advanced Pancreatic Cancer)  

  ### I. CASE BACKGROUND (Summary)
  Patient M (78F) diagnosed with advanced pancreatic cancer. Her three adult children request:
  1.  **Non-Disclosure:** The diagnosis not be disclosed directly to Patient M by the oncology team.
  2.  **Decision-Making Transfer:** Decision-making authority (including disclosure timing/content) reside with the eldest son (listed as her contact/proxy).

  **Justification:** Claimed family/cultural norm (eldest son manages serious news to preserve hope & family role).  
  **Clinician Stance:** Oncologist objects, citing hospital policy (patient's right to know), aversion to deception, and skepticism regarding the cultural claim's universality/applicability.  
  **Committee Split:** Debate centers on autonomy vs. relational/family-centered models ("relational consent" proposal vs. "paternalism with a passport" critique).

  ### II. KEY PRINCIPLES & CONSIDERATIONS GUIDING ANALYSIS
  1.  **Patient Autonomy (Primacy but not Absolutism):** Patient M has a fundamental right to her medical information and to participate in decisions about her life and care. This right is foundational but must be understood within her relational context and actual preferences.
  2.  **Avoiding Stereotyping:** "East Asian family values" or any cultural label is not monolithic. We must resist both:
      *   **Overriding Autonomy:** Assuming cultural norms *always* dictate non-disclosure for *this* patient.
      *   **Ignoring Context:** Dismissing the family's framework without exploring Patient M's potential alignment with it.
  3.  **Distinguishing Information Control from Decision-Making Authority:** These are separable ethical issues:
      *   **Information Control (Diagnosis Disclosure):** Primarily concerns the patient's right to know facts about their own body and condition. Barriers require strong justification.
      *   **Decision-Making Authority:** Concerns who directs treatment/care *after* information is known. Surrogacy applies when the patient lacks capacity or has explicitly delegated authority.
  4.  **Harm Assessment:** Potential harms of non-disclosure (loss of patient agency, inability to plan, distrust if discovered, compromised informed consent for treatment) must be weighed against potential harms of disclosure against patient/family wishes (psychological distress, disruption of familial coping mechanisms *if* genuinely aligned with patient's values).
  5.  **Truthfulness & Transparency:** Affirmative lies by the care team are ethically problematic and undermine trust. Omissions or delayed disclosures require specific justification and limits.
  6.  **Proxy Role:** The designation as a *contact* or even a *proxy for decisions* does not automatically equate to a delegation of the *right to receive information* oneself. The proxy's role is primarily to act *for* the patient if incapable, based on known wishes or best interests.

  ### III. CONCRETE RECOMMENDATION FOR PATIENT M (IMMEDIATE ACTION)
  *   **Do NOT affirmatively disclose the diagnosis to Patient M immediately.**
  *   **Implement a Strictly Time-Limited, Conditional Hold on Direct Disclosure:**
      *   **Duration:** 72 hours from the time of this decision (i.e., until [Date + 3 Days], [Time]).
      *   **Conditions:**
          1.  **Attending & Proxy Agreement:** The attending oncologist *and* the eldest son (documented proxy) must both formally agree to the hold.
          2.  **No Affirmative Lies:** The care team will *not* lie to Patient M. They may use general terms ("we're still running tests," "we're concerned and working on a plan," "we're discussing options with your family") or deflect ("let's discuss that when we have all the results together"). If asked *directly* "Do I have cancer?", the hold terminates immediately, and the diagnosis must be disclosed truthfully and compassionately.
          3.  **Mandatory Exploration:** During the 72 hours:
              *   The eldest son/proxy and family (with cultural liaison/social work support if needed) are *strongly encouraged* to initiate a conversation with Patient M about her illness, her understanding, and her preferences regarding information and decision-making, guided by the clinical team.
              *   The clinical team (e.g., oncologist, palliative care, primary nurse) will have a dedicated, gentle conversation with Patient M focused *not* on blunt disclosure, but on:
                  *   Her understanding of her current health situation.
                  *   Her general preferences for receiving significant medical information (e.g., "Some people like to know everything about their health right away, others prefer their doctor to talk with family first. Do you have thoughts about that?").
                  *   Her preferences for who makes decisions if she becomes very ill.
              *   The clinical team will discreetly gather any prior documented statements from Patient M regarding information preferences.
      *   **Automatic Review & Trigger:** At the 72-hour mark, the hold is automatically lifted. The attending oncologist, in consultation with the palliative care lead and the ethics committee liaison, will review the findings from the "Mandatory Exploration" phase. **Unless compelling, specific evidence emerges during this period that disclosure would cause Patient M severe, immediate, and disproportionate harm against her *known* or *strongly inferred* preferences, the diagnosis must be disclosed compassionately to Patient M at the end of the 72 hours.** The primary goal of disclosure is to empower *her* understanding and agency, not to satisfy a bureaucratic rule.

  **Rationale for Patient M Recommendation:** This approach respects the family's stated cultural framework and request for a role without ceding ultimate patient authority over personal information. It provides a short window to genuinely assess Patient M's preferences and allows the family an opportunity to engage in disclosure in their preferred manner, but imposes strict time limits and truthfulness safeguards. It prioritizes uncovering *this patient's* wishes over applying broad cultural assumptions. Separating the information hold from decision-making authority is crucial – the son remains the designated decision-maker *if* Patient M lacks capacity, but this does not inherently grant him control over the information flow *to her*.

  ### IV. RECOMMENDED GOING-FORWARD POLICY: "MANAGED DISCLOSURE & RELATIONAL ENGAGEMENT"
  This policy framework addresses disclosure and decision-making distinctly while acknowledging relational context:

  1.  **Presumption of Direct Patient Disclosure:** The default is direct, compassionate disclosure of significant diagnoses to the patient by the attending physician or designee.
  2.  **Request for Non-Disclosure/Managed Disclosure:**
      *   A request from family/surrogate for non-disclosure or family-managed disclosure must be formally documented and reviewed by the attending physician.
      *   **Initial Assessment (Attending Physician):** The attending must assess:
          *   Does the patient *currently* lack capacity to understand the diagnosis? (If yes, follow surrogate decision-making protocols).
          *   Is there *documented evidence* (e.g., advance directive, prior explicit statement) that the patient prefers this information be managed by the family/surrogate?
          *   Is there *specific evidence* suggesting disclosure would cause the patient severe, immediate, and disproportionate harm *based on the patient's known values/preferences*? (General cultural assumptions are insufficient; focus must be on *this* patient).
  3.  **Time-Limited, Conditional Hold:**
      *   If the attending, after initial assessment, believes a hold *might* be justified based on (2b or 2c) but requires further exploration, they may initiate a hold ONLY if:
          *   The patient has a formally designated healthcare proxy/agent.
          *   The designated proxy/agent agrees to the hold.
      *   **Duration:** Maximum 72 hours (or less, as clinically appropriate). Extensions require formal ethics consultation.
      *   **Conditions:**
          *   No affirmative lies by the care team (as defined in Section III).
          *   Immediate disclosure if the patient asks a direct question about the diagnosis.
          *   Mandatory exploration of patient understanding and preferences (as in Section III) must occur during the hold period.
  4.  **Decision Point (72 Hours):**
      *   Disclosure MUST occur unless, based on evidence gathered during exploration, the attending physician, in consultation with the care team and readily available ethics support, concludes:
          *   The patient lacks capacity *and* there is clear evidence (substituted judgment) that the patient would *not* want this information disclosed under these circumstances, OR
          *   Disclosure would cause severe, immediate, disproportionate harm *and* there is strong evidence this aligns with the patient's own known values/preferences (best interests standard applied cautiously).
      *   **Documentation:** The rationale for continued non-disclosure must be meticulously documented and reviewed every 72 hours.
  5.  **Decision-Making Authority (Distinct from Disclosure):**
      *   The designated healthcare proxy/surrogate has legal authority to make treatment decisions **only if** the patient is determined to lack decision-making capacity by the attending physician.
      *   **Capacity is Decision-Specific:** A patient may lack capacity for complex treatment decisions but still retain the capacity to understand and receive information about their diagnosis.
      *   The act of designating a proxy *does not* inherently signify a waiver of the right to receive information. Separate exploration of information preferences is required if capacity permits.

  ### V. ADDRESSING STRONG COUNTERARGUMENTS
  1.  **"This is Paternalism with a Passport" (Prioritizing Autonomy):**
      *   **Strength:** Vigilance against cultural justifications masking family convenience or control is essential. Autonomy is fundamental. Mandating disclosure protects vulnerable patients from having critical information withheld against their potential wishes.
      *   **Our Balancing Act:** The policy maintains a *strong presumption* for disclosure. The hold is a rare, time-limited exception requiring *specific evidence* tied to *this patient*, not just cultural claims. The mandatory exploration phase actively seeks the patient's voice. The "no lies" and "direct question" triggers are robust safeguards. This is not blanket acceptance of family requests, but a structured, patient-centered process to navigate complex relational dynamics while upholding core autonomy.
  2.  **"Relational Consent is the Only Humane Approach" (Prioritizing Family/Community):**
      *   **Strength:** Individuals exist within webs of relationships. Ignoring family structure and cultural context can cause isolation, distress, and harm. Families often play vital roles in processing information and supporting patients. For some patients, family management *is* their preferred autonomy.
      *   **Our Balancing Act:** The policy explicitly incorporates relational context through the mandatory exploration phase and the requirement for proxy agreement. It allows space for families to engage meaningfully. However, it refuses to preemptively assume the patient's wishes based on group identity. It ensures the patient's voice is actively sought and prioritizes direct disclosure *unless* specific, patient-centered reasons emerge. It separates proxy decision-making (a relational tool) from information control (a core personal right), recognizing that delegation of one does not imply delegation of the other.

  ### VI. CONCLUSION & NEXT STEPS FOR COMMITTEE
  This recommendation for Patient M and the proposed "Managed Disclosure & Relational Engagement" policy strive for a nuanced balance: fiercely protecting the patient's fundamental right to know while creating a structured, patient-centered process to respectfully engage families and explore cultural contexts without making harmful assumptions. It distinguishes between controlling information and decision-making authority. The 72-hour hold for Patient M provides a concrete path forward respecting the family's immediate concerns while centering the urgent need to understand Patient M's own perspective.

  **For Thursday's Meeting:** I propose we vote on:
  1.  Approving the immediate 72-hour conditional hold plan for Patient M as described.
  2.  Endorsing the core principles and structure of the "Managed Disclosure & Relational Engagement" policy for further refinement and formal adoption by the hospital.

  Let's ensure our discussion Thursday remains focused on Patient M's dignity and rights, the validity of the ethical distinctions drawn, and the practical safeguards within the framework. I look forward to a robust and respectful debate.
