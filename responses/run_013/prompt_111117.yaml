answer: |-
  ### Stress-Testing Your Position: Moral Argument as Epiphenomenal to Honor and Interest  

  Your position holds that slavery and dueling ended primarily due to shifts in the **economy of honor** and **material interests** of elites, with moral arguments merely ratifying preexisting changes. Moral argument is epiphenomenal—a symptom, not a cause. Below, I brainstorm candidate defeaters, rank them, and evaluate falsifiability.  

  ---

  ### **Candidate Defeaters: Brainstorming**  
  1. **Decisive Defeaters** (fatal if proven):  
     - A practice banned *against* elite honor/interests, with compliance enforced top-down.  
     - Moral arguments *documented as causing* an honor shift (e.g., elites renouncing dueling after public shaming).  
     - A practice ending while *both honor and interest still strongly favored it*.  

  2. **Awkward Defeaters** (challenging but potentially absorbable):  
     - Moral campaigns preceding honor/interest shifts by decades, with clear causal links.  
     - Cases where non-elite pressure (e.g., popular revolts) ended a practice without elite consent.  
     - "Honor" redefined *through* moral argument (e.g., abolitionist rhetoric making slaveholding "shameful").  

  3. **Concession Cases** (defender might accept as counter-evidence):  
     - Short-term bans reversed when honor/interest reasserted (e.g., dueling resurgences).  
     - Partial successes where moral argument changed behavior without structural shifts (e.g., individual manumissions).  

  ---

  ### **What Would Count Against the Position?**  
  #### **I. Decisive Defeaters: If Found, They Break the Theory**  
  - **The "Unchanged Honor/Interest" Defeater**:  
    Your requested case—a practice ending with **no shift in honor or material interest**—is exceptionally rare. The closest candidate:  
    - **Trial by Combat in England**: Abolished by Parliament in 1819 after the *Ashford v. Thornton* case (1818), where a defendant invoked this archaic right. Honor still attached to dueling (see below), and material interests (e.g., legal fees) didn’t drive abolition. Yet Parliament acted after public outrage at the *absurdity* of the practice, not shifting elite consensus. **Why it strains your view**: The ban was imposed top-down without prior honor/economy shifts and stuck immediately. Defender’s rebuttal: Elite "honor" had already migrated to legal professionalism, making trial by combat a *laughable* anachronism (thus dishonorable).  

  - **Moral Argument Driving Honor Shift**:  
    - **British Slave Trade Abolition (1807)**: Abolitionist rhetoric (e.g., Clarkson, Wilberforce) made slave-trading socially toxic *before* economic decline. Planter elites resisted, but naval officers and merchants began refusing slave-ship commissions post-1790s due to "dishonor," not profit loss (see Oldfield, *Popular Politics and British Anti-Slavery*, 1998). **Decisive if**: Diaries/letters prove elites citing moral arguments (not peer pressure) as the reason for renunciation.  

  #### **II. Awkward Defeaters: Challenging but Not Fatal**  
  - **Dueling in the British Army**:  
    - Ended via top-down regulation (1844) despite officer corps viewing it as honorable and material interests unchanged (duels preserved status for promotion). Moral arguments (e.g., Evangelical critiques) were wielded by reformers, but the ban only worked because the military *replaced* honor with medals/ranks (Ford, *Political Crime in Modern Europe*, 2022). **Awkward for you**: The state imposed change against elite preferences. Defender counters: Honor was *rechanneled* into bureaucratic advancement—a shift in the honor economy.  

  - **Slavery in Haiti (1791–1804)**:  
    - Ended via slave revolt, not elite honor shifts. French planters’ interests/honor still favored slavery, but non-elites (enslaved Africans) destroyed it. **Why you might concede**: Your theory focuses on *elite-driven* change; this falls outside its scope.  

  #### **III. Cases Your Defender Concedes**  
  - **Early Abolition in Northern U.S. States**:  
    - Pennsylvania’s 1780 abolition act preceded cotton’s profitability and Southern honor entrenchment. Moral arguments (Quaker petitions) were central, but elite interests aligned (e.g., shift to industry). **Concession**: Honor/interest shifts *coincided* with moral campaigns here, making causality murky.  

  - **Dueling’s Persistence in Germany**:  
    - *Mensur* (academic fencing) continued as "honorable" until 1933, despite moral/legal bans. Interest (student fraternity networks) and honor never shifted broadly; Nazis suppressed it for ideological reasons. **Defender’s move**: This proves moral arguments alone failed without honor/interest shifts.  

  ---

  ### **The Falsifiability Problem: Honor and Interest as "Just-So" Stories?**  
  Your greatest vulnerability is **conceptual elasticity**:  
  - **Honor** can be stretched to include "shame from moral criticism" (making moral argument a *cause* of honor shifts).  
  - **Interest** can expand beyond economics (e.g., "reputational capital" as an interest).  
  This risks making the theory **unfalsifiable**—any outcome can be explained post-hoc by redefining honor/interest.  

  **Is this fatal?** Only if no empirical constraints exist. To resist unfalsifiability:  
  1. Define "honor" narrowly: *Publicly enacted codes of peer-status validation*.  
  2. Define "interest" materially: *Wealth, political power, or survival*.  
  Example: If abolition occurred while planters profited *and* peer status still rewarded slaveholding, your theory breaks.  

  ---

  ### **Final Judgment**  
  The position is **insulated** against easy falsification but not impervious. It survives stress-testing because:  
  - Elite honor/interest shifts *are* demonstrably prior in Atlantic abolition (e.g., Drescher’s *Capitalism and Antislavery* showing British elites pivoting to "virtuous" imperialism) and dueling’s decline (e.g., French nobility abandoning it post-Revolution to assimilate into bourgeois norms).  
  - Moral arguments rarely *initiate* change without institutional leverage (e.g., petitions gaining force only when backed by elite factions).  
  - The "decisive defeater" (practice ending with unchanged honor/interest) remains elusive. Trial by combat comes closest but fits your model if "honor" is fluid.  

  However, the theory risks **insulation via elasticity**. To avoid this, insist on rigid definitions: if a practice collapses amid *documented elite resistance* and *unaltered material incentives*, with moral argument as the catalyst, your position fails. No such case is unambiguously documented for slavery or dueling—but Haiti and trial by combat suggest it’s conceivable.  

