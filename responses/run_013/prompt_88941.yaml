  2. Explain rank-dependence in three-outcome cases using the REU formula.  
  3. Contrast with belief distortion in EU, showing how REU handles tail probabilities differently.  
  4. Discuss whether this makes risk attitudes empirically distinguishable or just a modeling choice.  
  5. Touch on variable r functions as an extension.  

  The marking scheme out of 20 should clearly differentiate A (18-20) and B (15-17) answers. Key moves for full credit:  
