answer: |-
  Here's your exam question, model answer, and marking scheme designed to push students beyond textbook recitation and into conceptual tension:

  ---

  ### Final Exam Question: Risk-Weighted Expected Utility (15% of total grade, 45 minutes)
  > **Background**: For a two-outcome bet with outcomes \(x > y\) (probabilities \(p\) and \(1-p\)), REU evaluates to \(REU = u(y) + r(p)[u(x) - u(y)]\). This implies choice equivalence with an Expected Utility (EU) agent who distorts probabilities: one who uses belief \(\hat{p} = r(p)\) instead of \(p\).  
  >  
  > **Question**:  
  > (a) Explain how the *rank-dependent structure* of REU generates distinct behavior from probability-distorting EU maximizers when *three or more outcomes* are possible. Use a concrete three-outcome example to illustrate where the models diverge.  
  >  
  > (b) Does this divergence rescue the claim that the risk function \(r\) captures "genuine risk attitudes" (distinct from distorted beliefs)? Or does it merely show that the *same* choice behavior could be modeled as either distorted beliefs *or* context-dependent risk attitudes? Justify your view.  
  > *(Optional extension: How might letting \(r\) vary with the scale/structure of the gamble affect your answer?)*  

  ---

  ### Model Answer (Approx. 700 words)  
  **(a) The role of rank-dependence in three-outcome cases**  
  REU’s core innovation is applying the risk function \(r\) to *cumulative probabilities* (ordered worst-to-best), not raw probabilities. For three outcomes \(z < y < x\) with probabilities \(p_z, p_y, p_x\), REU is:  
  \[
  REU = u(z) + r(p_x + p_y)[u(y) - u(z)] + r(p_x)[u(x) - u(y)]
  \]  
  Here, \(r\) transforms the probability of receiving *at least* \(y\) (i.e., \(p_x + p_y\)) and *at least* \(x\) (i.e., \(p_x\)). Crucially, \(r\) is applied to *decumulative* probabilities, making risk sensitivity dependent on outcome ranking.  

  A probability-distorting EU agent (PD-EU), by contrast, distorts each outcome’s probability separately:  
  \[
  EU_{\text{dist}} = \hat{p}_z u(z) + \hat{p}_y u(y) + \hat{p}_x u(x) \quad \text{where} \quad \hat{p}_i = f(p_i) \ \text{(e.g., } f(p) = r(p)\text{)}
  \]  
  but *without rank-ordering constraints*. This breaks equivalence in three-outcome gambles because REU’s weighting of the *middle outcome* \(y\) depends on its position in the ranking, while PD-EU weights it in isolation.  

  **Example**: Consider a gamble \(G\):  
  - \(x = \$1000, \ p_x = 0.1\)  
  - \(y = \$500, \ p_y = 0.8\)  
  - \(z = \$0, \ p_z = 0.1\)  

  Assume \(u(\$) = \$\), linear utility. Let \(r(p) = p^2\) (strongly risk-averse).  
  - **REU calculation**:  
    \[
    REU(G) = 0 + r(0.9)[500 - 0] + r(0.1)[1000 - 500] = (0.81)(500) + (0.01)(500) = 405 + 5 = 410
    \]  
  - **PD-EU calculation** (using same distortion \(f(p) = p^2\)):  
    \[
    EU_{\text{dist}}(G) = (0.01)(0) + (0.64)(500) + (0.01)(1000) = 0 + 320 + 10 = 330
    \]  
  REU values \(G\) at 410, PD-EU at 330—a stark divergence. Why? REU heavily downweights the high cumulative probability of getting *at least* \$500 (\(p_x + p_y = 0.9\)) via \(r(0.9) = 0.81\), but also downweights the tail outcome (\$1000) via \(r(0.1) = 0.01\). PD-EU downweights *each outcome individually*, crushing the high-probability \$500 (\(p_y = 0.8 \rightarrow \hat{p}_y = 0.64\)) and making \(G\) appear worse. REU’s rank-dependence preserves sensitivity to the middle outcome’s security (it contributes 405 vs. PD-EU’s 320), while PD-EU treats all outcomes symmetrically.  

  **(b) Is r a "genuine" risk attitude? A distinction without a (behavioral) difference?**  
  REU’s formalism *asserts* that risk attitudes are distinct from beliefs by construction: beliefs are captured in \(p\), risk in \(r\). However, choice behavior alone cannot empirically distinguish REU from a suitably flexible PD-EU model. Any REU agent can be mimicked by a PD-EU agent with beliefs \(\hat{p}_i\) defined as *rank- and magnitude-dependent distortions*. In our example, the PD-EU agent’s distortion \(f(p_i)\) isn’t a global function—it varies with outcome ranks and values (e.g., \(\hat{p}_y\) depends on whether \(y\) is the best, worst, or middle outcome).  

  This implies that "risk attitudes" in REU are behaviorally equivalent to *contextual belief distortions* in PD-EU. The separation is ontological (a modeling choice), not revealed by choices. Rescuing "genuine" risk attitudes requires additional constraints: e.g., insisting beliefs (\(p\)) are elicited separately (via betting odds) and are *stable* across gambles. If an agent reports \(p\) accurately but uses \(r(p)\) for decisions, we can interpret \(r\) as a risk attitude. Without such data, REU’s "risk" is just relabeling.  

  **Extension: Varying r with gamble structure**  
  If \(r\) varies with stakes (e.g., more concave for high-stakes gambles), REU gains flexibility but weakens its claim to capture "fixed" risk attitudes. Now, the same outcome (e.g., winning \$500) might be weighted differently in different gambles, mimicking a PD-EU agent whose distortions depend on the entire gamble. This amplifies the underdetermination: with context-dependent \(r\), REU risks becoming a notational variant of PD-EU with rich belief distortions.  

  **Conclusion**: REU’s rank-dependence *does* generate unique predictions for multi-outcome gambles, making it empirically distinct from a *fixed, outcome-independent* PD-EU model. However, if we allow PD-EU distortions to be rank-dependent, the models are choice-equivalent. Thus, REU’s "risk attitude" is only distinct from belief distortion if we impose external constraints on belief elicitation or assume \(r\) is invariant. Otherwise, the distinction is formal, not behavioral.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **A-grade (18–20)**:  
  - **(a)** Correctly derives REU’s rank-dependent formula for three outcomes (2 pts). Provides a *numerical example* showing divergence from PD-EU *with identical distortion function* (3 pts). Explains *why* divergence occurs (rank-dependence vs. outcome-wise weighting) (2 pts).  
  - **(b)** Argues that choice data alone cannot distinguish REU from flexible PD-EU (2 pts). Notes that separating beliefs/risk requires non-choice data (e.g., belief reports) or stability assumptions (2 pts). Addresses the extension: varying \(r\) blurs the risk-belief distinction further (1 pt).  
  - **Clarity/Insight**: Synthesizes (a) and (b) to show formal ≠ empirical distinction (2 pts); avoids merely restating REU’s axioms.  

  **B-grade (15–17)**:  
  - **(a)** Correct REU formula and example but unclear divergence explanation (e.g., misses role of middle outcome).  
  - **(b)** States models are behaviorally equivalent but doesn’t specify *how* (e.g., misses rank-dependent distortions in PD-EU). Extension mentioned but not integrated.  
  - **Gaps**: Superficial treatment of "genuine risk," or claims REU is "proven" distinct by three-outcome cases.  

  **Common pitfalls (point deductions)**:  
  - ⚠️ **0 for (a)** if only describes two-outcome equivalence.  
  - ⚠️ **−3** if confuses REU with Prospect Theory (e.g., references loss aversion).  
  - ⚠️ **−2** in (b) if asserts choice data *can* distinguish models without qualification.  
  - ⚠️ **−2** if ignores rank-dependence in three-outcome explanation.  
  - ⚠️ **−1** if example omits utilities/probabilities.  

  ---

  ### Why this works  
  - **Forces engagement**: Students must grapple with the equivalence breakdown (a) and its philosophical implications (b), moving beyond "r = risk attitude" dogma.  
  - **Prevents regurgitation**: The question’s focus on *divergence* and *underdetermination* isn’t covered in standard REU summaries.  
  - **Tests depth**: The optional extension rewards stronger students, while the core question is accessible to all who understood class discussions.  
  - **Time-aware**: Focused example + concise argument fits 45 minutes.  

  This should cleanly separate the students who *understand* the machinery from those who merely *recite* it. Good luck with grading!
