  - Using a three-outcome example to show divergence (e.g., how r affects middle vs. extreme outcomes).  
  - Addressing the epistemology: Can choices alone tell them apart? (Answer: No, without richer data like belief reports.)  
  - Mentioning variable r as a nuance.  

  Common mistakes to note:  
  - Confusing rank-dependence with probability weighting.  
