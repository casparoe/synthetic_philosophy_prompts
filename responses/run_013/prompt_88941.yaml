  - How rank-dependence changes things with three outcomes.  
  - Whether this separation of risk attitudes from beliefs is substantive or just formal.  
  - Whether choice behavior can distinguish the two interpretations.  
  - Optionally, what happens if r varies with the act.  

  For the model answer, I'll structure it to:  
