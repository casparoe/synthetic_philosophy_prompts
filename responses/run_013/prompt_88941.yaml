  The key points from the user's query are:  
  1. For two-outcome bets, REU agents are identical to EU maximizers with distorted beliefs (using r(p) instead of p).  
  2. The models diverge with three or more outcomes because REU applies the risk function r to cumulative probabilities (rank-dependent), not individual probabilities.  
  3. The question should make students explain what rank-dependence adds with three-plus outcomes and whether r truly represents risk attitude or just relabeled belief distortion.  
  4. Bonus if students discuss varying r based on the act's structure.  

