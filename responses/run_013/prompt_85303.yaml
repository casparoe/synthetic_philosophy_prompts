answer: |-
  Here's the verdict: **Yes, this has a name. Call it "Moral Chronotropy."** (If you need one word, "Chronotropy" works, meaning "time-shaping").

  **Now the explanation (under 600 words):**

  "Moral Chronotropy" describes the phenomenon where **the assignment of blame for the "start" of a conflict is shaped by narrative choices about time, causality, and moral judgment, rather than being a simple factual determination.**

  Here's how it maps to your points:

  1.  **The Start is Defined by the Response:** (Retroactive Designation). The "start" only gains significance *after* a reaction labels it as such. The responder, by reacting decisively, effectively *chooses* which prior event constitutes the "start" for the narrative of blame.
  2.  **The Sliding Window:** (Temporal Framing). The answer depends entirely on *how far back* you look. There's no objective "beginning." Choosing the timeframe inherently biases the answer towards either long-term structural causes or immediate triggers.
  3.  **Focus on the Narratable Event:** (Narrative Salience). The event labeled the "start" is almost always the discrete, dramatic, easily tellable act (the insult, the shot) – not the slow-burning underlying conditions (resentment, insecurity, historical grievances) that made the conflict probable. We blame the spark, not the tinder.
  4.  **Factual Question, Moral Verdict:** (Smuggled Judgment). Asking "who started it?" sounds neutral but functions as a tool to assign ultimate blame and moral culpability ("the starter is the bad guy"). This persists even when people intellectually know the "first mover" isn't always solely responsible.

  **What "Moral Chronotropy" Covers & Doesn't:**

  *   **Covers:** Feuds, interpersonal conflicts, historical disputes like the Cold War, legal arguments over provocation, political blame games – any situation where conflicting narratives assign blame for initiation based on selective temporal framing and narrative emphasis.
  *   **Pure First Move?** If there's a genuinely unprecedented act with *no* prior history or provocation (truly random violence), "who started it?" *is* factual. Moral Chronotropy kicks in when context exists. The "purity" of such acts is rare.
  *   **Power Imbalances:** Moral Chronotropy is *intensified* by power imbalances. The weaker party's reaction (even if disproportionate desperation) is easily framed as "starting" the latest escalation. The stronger party's prior, sustained pressure (sanctions, threats, systemic injustice) is often backgrounded as mere "context," not the active "start."

  **Is "Who Started It?" Ever the Right Question?**

  **Rarely.** It's almost always the *wrong* question because it inherently demands a simplistic, blame-focused answer obscured by narrative time-shaping.

  **Swap it for:**

  1.  **"What were the conditions that made this conflict likely/inevitable?"** (Focuses on the tinder, not just the spark).
  2.  **"Where did the cycle of action and reaction begin *this time*?"** (Acknowledges mutual escalation without pretending to find an absolute start).
  3.  **"What were the key moments where escalation occurred?"** (Plural! Recognizes multiple potential "starts" in an ongoing process).
  4.  **"What needs to change to prevent this from happening again?"** (Future-focused, solution-oriented, moves beyond blame assignment).

  **In short:** "Moral Chronotropy" names your insight. The "start" isn't found, it's *framed* – by time window, narrative choice, and the inherent moral judgment smuggled into the question. Ditch "who started it?" for questions about underlying conditions, cycles of escalation, and future prevention.
