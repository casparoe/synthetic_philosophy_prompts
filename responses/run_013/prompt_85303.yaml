  For naming options: "Narrative Causality" captures the story-driven aspect but misses the blame component. "Retroactive Genesis" is accurate but clunky. "Conflict Origination Paradox" might work - paradox because both sides can be "correct" yet contradictory. 

  Ultimately "Moral Chronotropy" feels right: 
