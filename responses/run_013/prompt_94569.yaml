prompt: |-
  Ok this is going to sound like a small thing but it's been eating at me for a couple of weeks now.

  I keep backyard hens. Four of them. Turns out there's a town bylaw from the seventies that says you can keep poultry in town but no more than two birds, and it's still on the books. Nobody I know has ever heard of it. Most people on my street who keep hens have more than two. I got a $200 ticket anyway, because a neighbour called in a complaint about the noise. The bylaw officer was almost apologetic — said they only ever act on complaints.

  Its not just that one. There's an old rule here that you have to clear your sidewalk by 8am, and I'd say most people don't, and nothing happens to them, ever, unless someone complains about you specifically.

  What gets me is the shape of it. The rule hasn't been enforced in decades, basically everyone ignores it, and everyone knows everyone ignores it. It's not a secret or a grey area, it's just dead. But it isn't repealed either, and the second somebody has a grudge it wakes up and is the law again, and suddenly I'm the one who broke it. And the thing I can't get past: when people tell me it's the law and I should either follow it or get it changed democratically, that seems to assume the rule is part of an actual going practice. If it's a sentence in a binder that everybody ignores, what exactly is doing the work when someone says I broke the law?

  So — is there a name for this? A mate of mine who did a law degree said there's an old doctrine about laws going stale from disuse, I think he said desuetude, but the way he described it sounded like it was about courts and prosecutors quietly giving up, not about the whole town ignoring something while it sits there on the books. I've also been reading about that Hart and Fuller argument — whether a defective or unjust rule is still law — and I wonder if my thing is an instance of that, or of something Fuller said about a legal system having to actually meet certain conditions before it counts as one. He had a list and I think one item was about the law actually being followed in practice, but I'm probably mangling it.

  Either way I don't just want the word. I want to know what the thing is: what makes a rule that's dead in practice but still on the books different from a rule that's simply unenforced, or from a law officials have stopped applying, or from plain old selective enforcement. Where's the line between those? And if there's no name for it, give me one, define it, and tell me what it wouldn't cover.
reasoning: |-
  Okay, the user keeps backyard hens and got fined due to an old bylaw limiting poultry to two birds, which is widely ignored until someone complains. They're frustrated because the rule isn't enforced normally but can be weaponized by neighbors. They want to know if there's a term for this phenomenon and deeper insights into how such "dead" laws function.

  First, I recall their mention of desuetude. That's a legal doctrine where laws become unenforceable due to long-term non-enforcement. But desuetude usually requires both non-enforcement and a contrary practice over time. In their case, the town collectively ignores the rule, which might fit, but desuetude isn't consistently applied everywhere. They need to know it's not a straightforward solution.

  Then there's Hart and Fuller's debate. Hart's positivism says a law is valid if it's part of the system, regardless of enforcement. Fuller, though, argued that laws must meet certain criteria to be legitimate, like consistency and enforcement. His eighth principle, congruence, is key here—laws must align with actual practice. The user's situation highlights this gap: the law exists but lacks congruence because it's ignored by everyone until a complaint.

  The user also mentioned selective enforcement, but this feels different. Selective enforcement targets individuals unfairly, while their issue is systemic neglect followed by revival via complaints. Zombie law captures the idea of a dead law coming back to life, which is vivid but not formal. 

  The core issue is legitimacy. When officials don't enforce a law consistently, it undermines the legal system's integrity. Fuller's point about law needing public compliance touches on this. The user's neighbors saying "just follow or change it" ignore that the law isn't part of living practice. The law's validity is questioned because enforcement is arbitrary, based on complaints, not principle.

  I should clarify the differences: unenforced laws might still be applied occasionally; officials stopping enforcement might signal abandonment. Here, enforcement is complaint-driven, making it unpredictable. The line is when non-enforcement is so widespread that the law loses its normative force, but the system hasn't officially nullified it.

  The user's deeper need might be validation of their frustration and understanding why it feels unjust. They might also seek ways to challenge the fine or advocate for law reform. Highlighting Fuller's principles shows the injustice isn't just personal but systemic, affecting the rule of law itself.
answer: |-
  This is a profound and frustrating phenomenon, not a small thing at all. You've hit on a fundamental tension in the concept of law itself. There isn't one single, universally agreed-upon name for *exactly* this specific configuration, but several concepts overlap and illuminate different facets. Let's break it down:

  1.  **Desuetude:** You're right, this is the closest established doctrine. It refers to the **extinguishment of a law or right through long disuse and non-enforcement.** However, your assessment is also correct:
      *   It's **rarely applied** by courts in common law systems (like Canada/US/UK) and is not a formal doctrine in many jurisdictions. Courts are usually reluctant to declare laws invalid simply because they aren't enforced.
      *   It typically requires **both**:
          *   **Long-standing and consistent non-enforcement:** Decades of the rule being ignored by authorities.
          *   **Contrary practice:** A well-established custom or practice directly contrary to the statute (which you clearly have – everyone keeps more than 2 birds, sidewalks aren't cleared by 8 am).
      *   **Your Situation:** Your case is a textbook candidate for desuetude *in spirit*. The law is ancient, universally ignored in practice, and enforcement only occurs reactively via complaint. However, a court might still be hesitant to formally apply desuetude and void the law entirely, especially for a bylaw enforced via ticket (as opposed to a major criminal statute).

  2.  **Hart vs. Fuller - The Core Philosophical Conflict:**
      *   **H.L.A. Hart (Legal Positivism):** Hart would likely say this *is* still valid law. His concept of the "rule of recognition" focuses on whether a rule was enacted according to the system's procedures (passed by council, not repealed) and is *accepted as law* by officials (the bylaw officer enforces it when a complaint is made). The fact that officials *can* and *do* enforce it reactively, even if rarely, satisfies the "official acceptance" part for Hart. The citizenry ignoring it doesn't negate its validity under this view. "The law is the law."
      *   **Lon Fuller (Procedural Natural Law):** Fuller is your strongest ally here. He argued that for a system to be called "law" and command fidelity, it must meet eight principles of "inner morality":
          1.  Generality (Rules, not ad hoc commands)
          2.  Promulgation (Publicly known)
          3.  Non-retroactivity
          4.  Clarity
          5.  Non-contradiction
          6.  Possibility of Compliance
          7.  Constancy (Not changing too frequently)
          **8.  Congruence between Official Action and Declared Rule**
      *   **The Crucial Point (Congruence):** **#8 is the key.** Fuller argued that the law *as administered* must align with the law *as declared*. When there is a massive, sustained gap between the written rule and the consistent practice of officials (ignoring it unless prompted by a complaint), the law loses its legitimacy. The system fails its own internal morality. This **lack of congruence** is what makes it feel like a trap or a weapon rather than a genuine rule. Officials effectively signal that the rule *isn't* taken seriously *until* someone weaponizes it. This undermines the rule of law itself.

  3.  **Selective Enforcement:** This is a broader term. While *your* situation *involves* selective enforcement (they only enforce against you because of the complaint), it's more specific. Selective enforcement often implies:
      *   Enforcement based on discriminatory grounds (race, class, etc.).
      *   Arbitrary choices by officials about *who* to target, even if the law is generally enforced.
      *   **Your Distinction:** In your case, the selection isn't primarily arbitrary whim or bias (though complaints can be biased), but rather the *mechanism* (complaint-driven) applied to a rule that is *otherwise universally unenforced by default*. The *systematic neglect* is the defining feature, making the selective enforcement possible and particularly galling.

  4.  **De Facto Repeal / Customary Nullification:** This describes the practical reality: through consistent non-enforcement and contrary public practice, the rule has been **effectively nullified in daily life**. It's dead *de facto* (in fact), but not *de jure* (by law). Everyone acts *as if* it's repealed. The problem arises when the *de jure* corpse is reanimated by a complaint.

  5.  **Zombie Law / Sleeping Law:** These are **colloquial terms**, not formal legal ones, but they perfectly capture the phenomenon: a law that appears dead, ignored by everyone, lurking forgotten in the code, only to suddenly "come alive" and bite someone when triggered (usually a complaint or a novel situation). This is the most vivid description of your experience.

  **Defining Your Specific Phenomenon:**

  Let's synthesize and name it:

  > **Complaint-Triggered Resuscitation of a Customarily Nullified Rule (CTRCNR):**
  >
  > *   **The Phenomenon:** A legal rule that remains formally valid (*de jure*) but has been rendered effectively void through sustained, widespread, and openly known non-enforcement by authorities (*de facto* repeal) and contrary public practice, creating a customary expectation of its irrelevance. However, the rule retains a latent enforcement mechanism triggered solely by individual complaint, allowing it to be suddenly and unexpectedly enforced against a specific target, despite its general dormancy.
  >
  > *   **Core Elements:**
  >     1.  **Formal Validity:** The rule exists on the books and hasn't been repealed.
  >     2.  **Systemic Non-Enforcement:** Authorities do not proactively enforce the rule; enforcement is absent as a matter of consistent practice over a long period.
  >     3.  **Contrary Custom:** Public behavior openly and consistently violates the rule, establishing a customary practice that contradicts it.
  >     4.  **Complaint-Dependent Trigger:** Enforcement *only* occurs reactively, initiated by a specific complaint against a specific individual/entity.
  >     5.  **Lack of Congruence (Fuller):** A fundamental disconnect exists between the declared rule and the consistent practice of officials (only acting on complaints), undermining the rule's legitimacy and predictability.
  >
  > *   **What it Wouldn't Cover:**
  >     *   **Simply Unenforced Laws:** Laws that aren't actively enforced due to resource constraints or shifting priorities, but where authorities *do* still proactively enforce occasionally or where there is no *contrary custom* (e.g., a rarely-used obscure tax provision people *try* to follow).
  >     *   **Officially Abandoned Enforcement:** Where authorities have publicly stated they will no longer enforce a specific law (e.g., a DA policy not to prosecute certain minor offenses), even if it remains on the books.
  >     *   **Selective Enforcement (Pure Form):** Enforcement based on official discretion or bias against specific individuals/groups, even if the law *is* generally enforced against others (e.g., only ticketing certain ethnicities for jaywalking when many do it).
  >     *   **Desuetude (Formal):** Where a court has formally declared the law unenforceable due to disuse.
  >     *   **Grey Areas / New Laws:** Situations where enforcement practice is evolving or unclear, or where the law is new and compliance patterns aren't established.

  **The "Work" Being Done When People Say "You Broke the Law":**

  This cuts to the heart of the matter. When people say this in your situation, they are relying *purely* on **formal validity** (Hart's rule of recognition). They ignore the **legitimacy deficit** caused by the utter lack of congruence (Fuller). The "work" being done is rhetorical and formalistic. It leverages the *technical* existence of the rule to impose a consequence, deliberately ignoring the context of its practical death and the arbitrariness of its resurrection via complaint. It masks the injustice of punishing someone for behavior that was, by the system's own inaction, tacitly permitted and universally practiced.

  **Conclusion:**

  Your frustration is deeply justified. You're experiencing the sting of a **CTRCNR (Complaint-Triggered Resuscitation of a Customarily Nullified Rule)**. While related to desuetude, selective enforcement, and de facto repeal, its defining feature is the combination of systemic dormancy enforced *only* via complaint. Philosophically, Lon Fuller provides the strongest critique: this situation fatally undermines the **congruence** required for a legitimate legal system. The rule exists as a mere technicality, a potential weapon, not as a genuine guide for conduct that the community or its officials consistently recognize as binding. The solution, unfortunately, lies not in easy legal doctrine but in the difficult political work of getting the obsolete bylaw formally repealed.
