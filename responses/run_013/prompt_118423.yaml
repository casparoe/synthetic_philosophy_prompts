prompt: |-
  Hey, I need advice and I'd rather have it straight then kind. I'm in the second year of a PhD in cog sci. My advisor has this model of how people switch between two tasks — basically a single quantity piles up until it crosses a line, and that's the switch. Nice and clean when he published it.

  Since then it's been patch after patch. One study showed switching got easier with practice, so he added a fatigue term. Another showed order effects, so he added a weight for recent trials. There's now a second gate, a decay parameter, and I think twenty-something free knobs total. And here's the part that bothers me: the patches get invented after we see the data, each one is tailored to the experiment that just broke the model, and he almost never says in advance what else would have to change if the patch were right. Once or twice a patch did make a fresh prediction, but only in a regime we can't actually measure — single-trial dynamics in a patient group we don't have access to.

  There's also a piece of the model nobody in the lab is allowed to poke at: that the switch is caused by one accumulating quantity crossing a threshold. If I ask whether it might be two separate processes with no shared threshold, I'm told I'm missing the point of the model.

  Meanwhile a lab across the country has a 3-parameter model that made a weird prediction — that making the task harder would make people switch faster in one condition — and two independent groups found it.

  My advisor says every model in this field looked patched up early on, and that the rival model only works because it ignores half the published data, which... might be true? I honestly can't tell.

  So: do I keep building on his model for my dissertation, or jump? And more than that, how do I actually tell the difference between a line of work that's still going somewhere and one that's just being kept alive by band-aids? I don't need a reading list, I want the ideas. Start with a one-sentence bottom line, keep the whole thing under 400 words, and tell me which fact about my situation would change your advice — and where you're least sure of yourself.
reasoning: |-
  Okay, let me tackle this PhD student's dilemma. They're in cognitive science, stuck with an advisor's model that keeps getting patched after each experiment breaks it. The core issue is whether this model is salvageable or if they should jump ship to something more promising. 

  First, I need to unpack their key concerns: 
  - The model has accumulated over 20 parameters through post-hoc fixes
  - Core assumptions (like the single accumulator) are untouchable
  - Competing labs have simpler models making successful predictions
  - Advisor dismisses criticisms as normal growing pains

  Hmm... the student's description screams "degenerating research program" to me. Those after-the-fact patches with no new testable predictions are classic warning signs. But I should be careful - maybe the advisor has a point about early-stage models needing adjustments. 

  The rival lab's 3-parameter model successfully predicting counterintuitive results really stands out. That's what good science looks like. Meanwhile, the student's lab seems to be in defensive mode, protecting the core idea at all costs. 

  For the bottom line: I think they should jump ship. But to be fair, I should flag what would make me reconsider - like if the patches actually started generating novel predictions. The part I'm least sure about is whether the advisor might have unpublished insights justifying the complexity. 

  The advice needs to be actionable: Start designing exit experiments now, frame it as testing boundaries rather than attacking the model. And crucially - this isn't just about their dissertation, but about learning to distinguish progressive from degenerative science. That skill matters more long-term than any single model.
answer: |-
  **Bottom line:** Jump ship; his model is degenerating science kept alive by post-hoc patches while rivals progress through novel predictions.

  **Key reasons:**  
  1. **Post-hoc patching without new predictions** (fatigue terms, weights added *after* data) is textbook degenerative research. It makes the model flexible at "explaining" past data but useless for forecasting new phenomena.  
  2. **Core assumptions are shielded from testing** (the single accumulator/threshold). If core ideas can't be falsified, it’s dogma, not science.  
  3. **Rivals demonstrate progressive science:** Their 3-parameter model *risked a strange prediction* (task difficulty speeding up switches) and was validated independently. That’s predictive power yours lacks.  

  **When to reconsider:** If your advisor commits *in writing* to pre-registered tests where *his patches predict unexpected outcomes* in novel paradigms *before data collection*. (But his history suggests this won’t happen.)  

  **Where I'm least sure:** Whether your advisor has unspoken technical justifications for the complexity (e.g., neural plausibility). But complexity without new testable insights is dead weight.  

  **How to tell "alive" vs. "band-aided" work:**  
  - **Progressive:** Makes surprising *novel predictions* later confirmed. Simplifies or unifies phenomena.  
  - **Degenerating:** Only "explains" past data via new fixes. Core ideas evade testing. Predictions are vague/unfalsifiable.  

  **Your action plan:**  
  1. **Run an exit experiment:** Test a *novel prediction* from the rival model *yourself*. If it holds, pivot openly.  
  2. **Frame your shift strategically:** "Exploring model boundaries" sounds better than "your model is broken."  
  3. **Build allies:** Contact the rival lab; cite their predictive success as inspiration for your methodological rigor.  

  **Critical fact that changes advice:** If your advisor suddenly demands *pre-registered predictions* from *his* patches for *your* dissertation work. (Unlikely, but would signal reform.) Move fast—your scientific instincts are sharp; trust them.
