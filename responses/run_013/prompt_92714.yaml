  - Against L: T gets 4, B gets 1 → mix gives (4+0)/2=2 >1
  - Against C: M gets 4, B gets 1 → mix gives (0+4)/2=2 >1
  - Against R: Both T and M get 2, B gets 1 → mix gives 2 >1
  The mix works because it leverages the complementary strengths of T and M against different columns. T is strong against L but weak against C, while M is the opposite. The mixture smooths this out.

  For the never-best-response equivalence, the key insight is that if a strategy isn't dominated, it must be a best response to some belief. I'll construct a separating hyperplane in payoff space - if B isn't dominated, there exists a belief (probability vector) where its expected payoff exceeds all alternatives. The negation proves the contrapositive.

  For iterated elimination: 
  - Order matters for strict dominance when mixtures are allowed? Actually no - since strict dominance is transitive. 
  - But with weak dominance, order definitely matters regardless of mixtures. 
  - Mixtures can eliminate more strategies (like B here) than pure dominators could, giving stronger predictions.

  Philosophically, mixed strategies here act as certificates of inferiority. We're not assuming players randomize; we're proving B is irrational because some mixture objectively beats it. The interpretation matters: mixtures as beliefs vs actions. For dominance concepts, they're mathematical tools revealing payoff structures, not behavioral claims.
answer: |-
  ### Approach to Your Questions
  I'll address your concerns systematically, focusing on conceptual clarity over formalism. We'll dissect the game matrix, establish the mixed-strategy dominance of B, prove the equivalence between strict dominance and never-best-response (emphasizing the non-trivial direction), analyze iterated elimination nuances, and conclude with the philosophical implications of mixtures in solution concepts. The matrix is central to all reasoning.

  ### 1. How the T/M Mixture Dominates B
  First, confirm pure-strategy non-dominance:
  - **T vs B**: T yields 4 > 1 against L, but 0 < 1 against C → not strictly dominant.
  - **M vs B**: M yields 4 > 1 against C, but 0 < 1 against L → not strictly dominant.
  - **Z vs B**: Z yields 0 < 1 against all columns → strictly dominated *by* B, not relevant here.

  Now, consider a **50-50 mixture of T and M**:
  - Expected payoff against **L**: (0.5 × 4) + (0.5 × 0) = 2 > 1 (B's payoff)
  - Against **C**: (0.5 × 0) + (0.5 × 4) = 2 > 1
  - Against **R**: (0.5 × 2) + (0.5 × 2) = 2 > 1

  **Why this works geometrically**:  
  Imagine each strategy as a vector in **payoff space** (3 dimensions, one per column action). Plot B as point (1, 1, 1). T is (4, 0, 2), M is (0, 4, 2). The mixture is the midpoint (2, 2, 2). Crucially, (2, 2, 2) > (1, 1, 1) in all coordinates. T and M individually are not Pareto-superior to B (T loses on dimension 2, M on dimension 1), but their convex combination achieves strict dominance by "averaging out" their weaknesses. This is possible because B is strictly **inferior in all states** but no pure strategy exploits every state. The mixture covers all bases by being strong where each pure strategy is weak.

  ### 2. Equivalence: Strictly Dominated ⇔ Never a Best Response
  **Theorem**: A strategy \(s_i\) is strictly dominated by some mixed strategy iff \(s_i\) is never a best response to any belief over opponents' strategies.

  #### Direction 1: Dominated ⇒ Never Best Response (Easy)
  If mixed \(\sigma_i\) strictly dominates \(s_i\), then for all opponent profiles \(s_{-i}\), \(u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})\). For any belief \(\mu\) (distribution over \(s_{-i}\)), expected payoff satisfies \(E_\mu[u_i(\sigma_i)] > E_\mu[u_i(s_i)]\), so \(s_i\) can't be a best response to \(\mu\).

  #### Direction 2: Never Best Response ⇒ Dominated (Non-Trivial)
  Assume \(s_i\) is never a best response. We prove it's strictly dominated.  
  - Consider the **payoff vectors** for all pure strategies of player \(i\). Let \(s_i\)'s vector be \(\mathbf{v}_0\), and others be \(\mathbf{v}_1, \dots, \mathbf{v}_k\).
  - The set of **expected payoffs** achievable by mixtures is the convex hull \(C = \text{conv}\{\mathbf{v}_1, \dots, \mathbf{v}_k\}\).
  - \(s_i\) is never a best response iff \(\mathbf{v}_0\) is **not in the upper contour set** of \(C\) for any belief \(\mu\) (i.e., no \(\mu\) makes \(\mathbf{v}_0\) maximal).
  - This implies \(\mathbf{v}_0\) is strictly separated from \(C\) by a hyperplane: there exists a vector \(\mu\) (a belief!) and scalar \(c\) such that:
    \[
    \mu \cdot \mathbf{v}_0 < c \quad \text{and} \quad \mu \cdot \mathbf{y} > c \quad \forall \mathbf{y} \in C.
    \]
  - Since \(C\) is convex, choose the separating hyperplane via the **Supporting Hyperplane Theorem**. Here, \(\mu\) acts as the normal vector.
  - \(\mu \cdot \mathbf{y} > \mu \cdot \mathbf{v}_0\) for all \(\mathbf{y} \in C\) means any mixture \(\sigma_i\) (with payoff vector \(\mathbf{y}\)) satisfies \(E_\mu[u_i(\sigma_i)] > E_\mu[u_i(s_i)]\).
  - **Key insight**: This inequality holds *for all opponent actions* because \(\mu\) assigns positive probability to every action (if \(\mu_j = 0\) for some \(j\), dominance might fail in state \(j\)). Since \(\mu\) is a full-support belief (we can assume w.l.o.g. by continuity), strict inequality per state follows. Thus, some mixture strictly dominates \(s_i\).

  **In your game**: B's payoff vector is (1,1,1). T is (4,0,2), M is (0,4,2). The mixture (2,2,2) > (1,1,1) in all components. The belief \(\mu = (\frac{1}{3}, \frac{1}{3}, \frac{1}{3})\) verifies:  
  - \(E_\mu[\text{B}] = 1\)  
  - \(E_\mu[\text{T}] = \frac{4+0+2}{3} = 2\), \(E_\mu[\text{M}] = \frac{0+4+2}{3} = 2\), \(E_\mu[\text{Mix}] = 2\)  
  All >1, but critically, the dominance is statewise, not just expected.

  ### 3. Iterated Elimination: Mixtures, Order, and Strict vs. Weak
  #### (a) Does allowing mixtures leave less?  
  **No, mixtures preserve or increase eliminated strategies**. In your game:  
  - **Pure-strategy elimination**: Z is dominated by B. After removing Z, no pure strategy dominates B (as T and M fail). Halt. Remaining: {T,M,B}, {L,C,R}.  
  - **Mixed-strategy elimination**: Z dominated by B → remove Z. B dominated by T/M mix → remove B. Now, with {T,M} vs {L,C,R}:  
    - Against L: T (4) > M (0)  
    - Against C: M (4) > T (0)  
    - Against R: T(2)=M(2)  
    No dominance yet. But L is strictly dominated for Column by any mix of C and R (C yields min 1, R min 2; L yields max 3 < 4? Wait, Column payoffs: L: (1,3,0,0) for rows T,M,B,Z; after removing B and Z, L: (1,3) vs C: (3,1) vs R: (2,2). Against T and M:  
    - L: (1,3)  
    - C: (3,1)  
    - R: (2,2)  
    R yields 2 > max(L,C) min? Actually, no pure dominance. But R is *never worse* than L or C and better sometimes: R ≥ L (2≥1, 2≥3? **No! 2<3 against M**).  
    After removing B, **C strictly dominates L**:  
    - Against T: C(3) > L(1)  
    - Against M: C(1) = L(3)? No, 1<3 → not dominance.  
    **Correction**: After removing B and Z:  
    | Col\Row | T   | M   |  
    |---------|-----|-----|  
    | **L**   | 1,1 | 0,3 | → Col payoff: L vs T:1, vs M:3  
    | **C**   | 0,3 | 4,1 | → C vs T:3, vs M:1  
    | **R**   | 2,2 | 2,2 | → R: 2,2  
    Now:  
    - L vs C: Against T, L(1)<C(3); against M, L(3)>C(1) → no pure dominance.  
    - R vs L: Against T, R(2)>L(1); against M, R(2)<L(3) → no.  
    - R vs C: Against T, R(2)<C(3); against M, R(2)>C(1) → no.  
    **But R is strictly dominated by a 50-50 mix of L and C?**  
    - Mix L/C: Against T: 0.5×1 + 0.5×3 = 2 > R's 2? Not strictly. Equal.  
    After removing B, **no further dominance by pure or mixed strategies**. So mixed elimination leaves {T,M} for Row and {L,C,R} for Col. Pure elimination left {T,M,B}, so mixtures indeed eliminate more (B).  

  #### (b) Does order matter?  
  - **Under strict dominance (with or without mixtures)**: Order **does not matter**. Strict dominance is transitive: if A dominates B, and B dominates C, then A dominates C (by same dominator). Removing a dominated strategy never invalidates earlier steps.  
  - **Under weak dominance**: Order **can matter**, regardless of mixtures. Weak dominance isn't transitive; eliminating one weakly dominated strategy can remove the dominator of another.  
  **Example**: Consider a game:  
  |   | L | R |  
  | T | 1,1 | 0,0 |  
  | M | 0,0 | 0,0 |  
  | B | 0,0 | 1,1 |  
  - If eliminate M first (weakly dominated by T or B), then no further dominance.  
  - If eliminate T first (weakly dominated by B against R, but not L), then M is weakly dominated by B. Different results.  

  **Verdict**: Mixtures expand the set of dominated strategies but don’t affect order-dependence under strict dominance. Weak dominance introduces order-dependence irrespective of mixtures.

  ### 4. Philosophical Payoff: What Mixtures Signify
  **The core issue**: Eliminating B requires a mixture (T/M) the player may never use. Is this legitimate?  

  **My view**: Mixtures here are **certificates of irrationality**, not behavioral plans. They prove B is objectively inferior: no belief exists where B is optimal (from the equivalence). The player doesn't need to randomize; they just need to recognize that B is indefensible because *some* randomized plan beats it in every scenario.  

  **Interpretive weight in solution concepts**:  
  - **In dominance concepts** (like IESDS), mixtures are purely **epistemic tools**. They test robustness against all opponent play, revealing strategies that are *reliably worse* regardless of uncertainty.  
  - **In equilibrium concepts** (like Nash), mixtures often carry **strategic uncertainty** interpretations (e.g., Harsanyi purification), but here they're deductive.  

  **Why this matters for students**: Confusion arises when mixtures are conflated with "random actions." Emphasize that:  
  1. A mixed strategy dominating B is a **proof by contingency planning**: "If you play T against L and M against C, you'd beat B everywhere."  
  2. The player can achieve this by conditioning on the opponent (if they could observe first), but since they can't, the mixture quantifies the *feasible* payoff guarantee.  

  **Final verdict**: Ruling out B is sound. It's not about compelling randomization; it's about B failing a **counterfactual robustness test**. The mixture certifies that B is strictly suboptimal for any belief—a fatal flaw pure strategies alone couldn't expose.
