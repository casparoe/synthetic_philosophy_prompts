answer: |-
  1. Consider two agents who commit identical cruel acts: one's cruelty stems from an abusive childhood he didn't choose and couldn't escape, the other's from an ordinary history. Should your blame differ?  
     - **Yes, only the ordinary-history agent is fully blameworthy**: Go to 2.  
     - **No, both are equally blameworthy**: Go to 3.  

  2. When an agent correctly recites moral reasons against her act but feels unmoved and acts wrongly, is blame appropriate?  
     - **Yes, because she could recognize the reasons she flouted**: This is the **Recognition Condition View**.  
     - **No, because she also needed to be capable of being moved by them**: This is the **Control-Enhanced View**.  

  3. Does a bystander’s indignation at a wrong done to a stranger have the same moral standing as the victim’s resentment?  
     - **Yes, both are equally warranted reactive attitudes**: Go to 4.  
     - **No, only the victim’s resentment has full standing; the bystander’s is secondary**: Go to 5.  

  4. Must our blaming practices be justified externally (e.g., via free will or control) to avoid error?  
     - **No, the practices are intrinsically justified and external demands are misguided**: This is **Strawsonian Non-Consequentialism**.  
     - **Yes, they require external justification**: This combination collapses **Attributability, Accountability, and Answerability distinctions** (unresolved due to neglect in branching).  

  5. If determinism is true, does it defeat all blame?  
     - **Yes, and we should replace resentment with non-reactive sorrow**: This is **Hard Incompatibilism**.  
     - **No, blame remains untouched by determinism**: This is **Compatibilism**, but cannot separate **Second-Personal, Relational, and Conversational views** (incoherence in branching).
