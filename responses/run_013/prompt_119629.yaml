prompt: |-
  I'm a fourth-year PhD student in philosophy working on formal semantics, and I'm putting together the framing handout for the first meeting of a reading group on paradoxes. Before we start arguing for anyone's favored machinery, I want the specification on the table: what would an adequate theory of truth actually have to deliver? Please write that specification for me.

  One thing before you begin. The fragment I care about is wider than the usual one, and I'd like you to treat it as the target rather than assimilating it to a textbook liar. Assume a language that contains, alongside the ordinary resources for talking about sentences, both a truth predicate and an operator expressing what a sentence ought to be believed. The two vocabularies can be combined freely. So the language contains at least a sentence that says of itself only that it is not true; a sentence that says of itself only that it ought not to be believed; and a pair of sentences each of which says of the other only that it is not true. It also contains mixed cases, such as a sentence asserting that the sentence about what ought to be believed is true. A theory has to have something to say about all of these, and about whether the second sort of sentence is even the kind of thing that can be true or false in the same sense as the first. I built these cases myself, so there is nothing to look up; the work is in saying what any theory must do about them.

  Give me the requirements, each with the case or consideration behind it — a desideratum with no case behind it is just somebody's taste. Include the cases it must get right, the distinctions it cannot collapse, and the limitative results it cannot pretend away. Mark which requirements you take to be non-negotiable and which are the house rules of a particular camp. Then tell me whether any subset of the list is jointly unsatisfiable, and if so which requirement has to give; if the list itself forces a choice, that is the result I most want from you. Finish by saying which single requirement does the most to exclude otherwise popular theories, and name the family it excludes. Skip the scoring of individual views against the list — I'll run that exercise in the group — and you needn't attach author names to positions; describe them.

  Write it as continuous prose, the way you'd write a long email. No headings, no numbered or bulleted lists, no bold, no tables. Length is not a concern; I would rather have the reasoning than the compression.
reasoning: |-
  Okay, the user is a fourth-year PhD student in philosophy focusing on formal semantics. They're setting up a reading group on paradoxes and need a specification for what an adequate theory of truth must deliver. The key point is that their language includes both a truth predicate and a deontic operator about what ought to be believed, with free combination of these elements. 

  The user has constructed several unique self-referential sentences beyond the standard liar paradox: one denying its own truth, one denying it ought to be believed, a pair mutually denying each other's truth, and mixed cases like claiming the deontic sentence is true. These aren't textbook examples, so existing literature won't directly address them. The challenge is to articulate what any theory must handle about these cases.

  The user wants desiderata grounded in specific cases, not just abstract principles. They need distinctions that shouldn't be collapsed, limitative results that can't be ignored, and markers for which requirements are non-negotiable versus camp-specific. Crucially, they want to know if the requirements are jointly unsatisfiable and which single requirement excludes popular theories.

  The key non-negotiable requirements would include: Consistency (no contradictions), Non-Triviality (the language must express non-paradoxical truths), Expressive Adequacy (handling both truth and deontic claims without restrictions), Compositionality (truth behaves predictably with connectives), and Normative Anchoring (dealing with how truth relates to belief obligations). 

  The tricky part is Normative Anchoring since it forces a connection between truth and belief that might conflict with Consistency in paradox cases. For example, a sentence saying "I ought not to be believed" creates a loop: if true, we ought not to believe it, but then we've recognized its truth, which seems to obligate disbelief in a true claim—problematic for theories linking truth to belief obligations.

  The most excluding requirement is likely Normative Anchoring because it rules out theories that either ignore deontic operators or strictly tie truth to belief obligations (like verificationism). This creates tension in the mixed cases, especially with self-referential deontic sentences. 

  The user's deeper need might be to expose how existing frameworks fail under these hybrid constructions, pushing the group toward developing new machinery. The specification should force confrontation between truth theories and normative constraints, highlighting where compromises are inevitable.
answer: |-
  Here’s a framework for what an adequate theory of truth must deliver, tailored to your expanded language. I’ll build it case by case, marking non-negotiables versus contingent commitments, and end with the tensions.

  Start with the non-negotiable foundations. Any theory must preserve **consistency** and **non-triviality**. This isn’t taste—it’s a precondition for doing semantics at all. If your theory implies that every sentence is true (triviality) or that a contradiction holds (inconsistency), it fails as a theory of *reasoned* discourse. The Liar ("This sentence is not true") and its deontic cousin ("This sentence ought not to be believed") immediately test this. A theory must assign *some* coherent status to these without collapsing into explosion. Similarly, the pair of sentences each denying the other’s truth (an "open pair" or dual-liar) can’t force a contradiction in the base logic. These cases are non-negotiable because they’re stress tests for coherence itself; a theory that flunks them isn’t a candidate.

  Next, **expressive adequacy**: the theory must handle the *free composition* of truth and deontic operators without artificial restrictions. This is forced by your mixed cases. Consider a sentence asserting "The deontic liar is true." If we’ve assigned a status to the deontic liar (say, "ungrounded" or "pathological"), can we meaningfully call it "true"? If we restrict truth to a fragment excluding deontic sentences, we collapse a distinction your language explicitly encodes: the ability to *ask* whether normative claims are true. Likewise, consider "This sentence is true if and only if it ought not to be believed." A theory must say whether such a biconditional can hold, or what blocks it. Expressive adequacy is non-negotiable if we take the language’s grammar seriously—silencing part of the language isn’t a solution but a surrender.

  This leads to **normative anchoring**: the theory must clarify the relationship between truth and what ought to be believed. Is truth *constitutive* of belief’s norm (so "true" implies "ought to be believed")? Or can they come apart? The deontic liar ("I ought not to be believed") forces this issue. If we hold that truth entails ought-to-be-believed, then asserting the deontic liar’s truth leads to a contradiction: if true, it ought to be believed, but it says it ought *not* be believed. If truth doesn’t entail ought-to-be-believed, we need an account of why not—and what *does* govern the deontic operator. This requirement isn’t universal (some camps ignore normative operators), but *for your framework*, it’s non-negotiable because the language builds them in.

  We also need **compositional transparency**: truth should behave predictably under logical operations. The mutual denial pair (Sentence A: "B is not true"; Sentence B: "A is not true") tests this. Can both be false? Both true? Must one be "pathological" while the other isn’t? A theory must explain why standard logical inferences (like disquotation or contradiction introduction) seem to fail here without abandoning compositionality entirely. This is non-negotiable for formal semantics—if the logic of "not" and "true" fractures near self-reference, we need a principled map of where and why.

  Now, **limitative integrity**: the theory must acknowledge and explain its own incompleteness. Gödel-Tarski results show that no consistent theory can define its own truth predicate for the whole language. Your expanded language (with deontic operators) likely worsens this. A theory pretending to "solve" all paradoxes by assigning crisp truth values to every sentence (including "This sentence is not true") is either inconsistent or dishonest about its limitations. This is non-negotiable—denying proven limitative theorems isn’t philosophy, it’s fantasy.

  ---

  **The tension**: These requirements *are* jointly unsatisfiable if we insist on classical logic, unrestricted truth-predicate application, *and* normative anchoring where truth entails ought-to-be-believed. The deontic liar is the pivot. Suppose we try to assign it a classical truth value. If true, then (by normative anchoring) it ought to be believed—but it says it ought *not* be believed, contradiction. If false, then it ought to be believed (since it falsely claims it shouldn’t be), but then it’s "correct" in advising disbelief? This mirrors Liar-like instability. Non-classical solutions (gaps, gluts) help with the Liar but struggle with the deontic version: if the deontic liar is *neither* true nor false, does "ought to be believed" still apply? If not, why? If so, we’ve detached belief norms from truth—undermining normative anchoring. If we weaken normative anchoring (truth doesn’t entail ought-to-be-believed), we salvage consistency but must explain what *does* govern belief norms—and why truth seems so central to them. **The forced choice is here**: either abandon classical logic/fully bivalent semantics, or relax the tight coupling between truth and belief obligation. Your language’s mixed cases ensure there’s no quiet retreat to separate domains.

  ---

  The most excluding requirement? **Normative anchoring**. It’s the hammer that shatters theories thriving on simpler Liars. Truth-value gap theories (like Kripke’s) can handle "This is not true" by leaving it ungrounded. But if "ought to be believed" applies *only* to true sentences, the deontic liar ("I ought not be believed") becomes poisonous: if we *don’t* believe it (because it’s not true? because it tells us not to?), it seems true. Glut theories (dialetheism) can embrace contradictions for the Liar but balk at normative contradictions: if we *ought and ought not* believe the deontic liar, what do we do? Theories that ignore the deontic operator (treating it as non-truth-apt) fail your expressive adequacy test. And deflationary theories, which treat truth as merely disquotational, struggle to explain why adding "ought to be believed" creates new paradoxes rather than harmless redundancy. Normative anchoring forces truth to be more than syntactic—it must interact substantively with epistemology—and that excludes any theory treating truth as shallow or purely logical.

  This specification doesn’t dictate solutions but sets the stakes. Your group’s task is to see whose machinery bends without breaking under this weight. Good luck—it’s a worthy puzzle.
