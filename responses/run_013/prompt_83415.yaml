  Here's a fresh take on the Knobe effect joke, building on your stand-up comic idea but sharpening the asymmetry:

  **The Joke:**  
  A stand-up comic knew her edgy new bit would absolutely devastate the easily offended couple in the front row. She also knew, purely as a side effect, it would resonate perfectly with the lonely philosophy grad student at the back, making him feel seen for the first time in months. After the show, the comic shrugged: "Honestly? I didn't care about upsetting *or* comforting anyone. I just wanted to test the material."  
  The front row stormed out, *certain* she'd targeted them intentionally. The grad student, beaming, thanked her for the unintentional lifeline.  
  Guess which one she got blamed for?

  **The Note (Underneath):**  
  This joke leans on the core Knobe asymmetry: harmful side effects (upsetting the front row) are judged intentional despite stated indifference, while beneficial ones (comforting the grad student) are seen as unintentional. I'm highly confident this asymmetry reveals that our *folk concept of intentional action* is inherently normative – bad outcomes "stick" to intention descriptions more easily than good ones. Where I'm less sure is whether this normativity is truly embedded in the *conceptual structure* of "intentional" itself, or if it's primarily a pragmatic effect where people infer blame/praise *first* and then answer the question strategically (the "blame first" account). Both remain live debates.

  **Why this works:**  
  *   **Fresh Setting:** Stand-up comedy replaces the corporate boardroom.
  *   **Clear Asymmetry:** The punchline explicitly contrasts the audience's opposing judgments ("*certain* she'd targeted them intentionally" vs. "unintentional lifeline") for the two side effects, driven solely by valence.
  *   **Agent's Indifference:** The comic explicitly states her indifference to both outcomes, mirroring the chairman's stance.
  *   **Hits the Debate:** Focuses squarely on the intentionality judgment flip for side effects based on goodness/badness.
  *   **Accessible & Deep:** Understandable with basic Knobe knowledge, but lands the specific asymmetry point appreciated by those deeper into x-phi.
  *   **Note Clarity:** Identifies the core asymmetry and the normative debate, states confidence in normativity, pinpoints the conceptual vs. pragmatic mechanism as the uncertain part, and avoids citations.
