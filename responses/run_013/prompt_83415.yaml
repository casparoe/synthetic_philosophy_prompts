  Right, so I'm putting together a little booklet of philosophy jokes for my reading group, and I want one about the Knobe effect — you know the one, where you ask people whether the chairman harmed the environment on purpose and everyone says yes, then you ask whether he helped the environment on purpose and everyone says no, even though he was equally indifferent to both outcomes. Please dont just re-tell the chairman case, everyones heard that one. Set it somewhere fresh. My own half-idea, feel free to bin it: a stand-up comic who knows her new bit will upset the front row and who also knows that, as a side effect, it'll make one shy bloke at the back feel a bit less alone — afterwards she insists she didn't care about either. Or invent your own scene, I'm not precious about it. The punchline has to turn on the actual asymmetry: that what's being judged is a side effect, and that the judgement flips depending on whether the side effect is bad or good. So not a generic "lol philosophers" joke — it should be funny to someone who's actually read the experimental philosophy on this, and still land for someone who only half remembers it.

  Then, underneath the joke, a short note — four sentences max, no citations or reading lists — saying which bit of the debate about the Knobe effect the joke is leaning on and where that bit is contested (e.g. whether the asymmetry shows the folk concept of intentional action is itself a normative one, or whether it's really just people inferring blame and then answering the question accordingly). In that note, say how confident you are in what you claim, and point out the one thing in it you're least sure about.
