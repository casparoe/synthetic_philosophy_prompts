prompt: |-
  ok so I keep going back and forth on this and I want to lay out the ground rules before I read another thing about it. I'm working on diachronic rationality — you know, the whole mess about whether it can be irrational to have perfectly fine preferences at every moment and still get walked into a money pump, or to be the kind of agent someone can exploit over time even though at no single instant you're making a mistake. Before I pick a side I want the spec: what does any adequte theory of diachronic rationality actually have to deliver?

  Give me the requirements list. For each one, the case or consideration that forces it — not just "must handle intransitivity" but which scenario makes it non-optional. I want:

  - the cases it has to get right (the classic pump, the version where you can see the pump coming from the start, the version that only works if you're naive about your own future self, the version where refusing the first step is what saves you)
  - the distinctions it can't just collapse — between being exploitable and being internally inconsistent, between a preference that's unstable and a preference that's simply revised in light of new info, between what's rational for a moment and what's rational for a life, between the agent who welcomes the pump and the agent who gets ambushed by it
  - and any results it can't contradict — I'm thinking of the arguments where if you assume foresight plus some kind of choice consistency you basically can't be pumped, so a theory that says pumping is always possible seems to have already lost on arrival.

  Then here's the case I actually care about, and I made it up, so dont go hunting for it. A woman has stable, transitive preferences over the outcomes. But her reference point resets after every transaction — she evaluates each next step as a fresh gain or loss against wherever she now stands, not against where she started. A trader who knows this can walk her, step by step, into a position she'd have flatly refused at the outset, and at no point does she violate transitivity or pick something worse by her own lights at that moment. Offer her the whole sequence as one package, though, and she says no. Is she irrational? What is the theory supposed to say about her, and does your answer change if she can predict the entire thing in advance and goes along anyway?

  So: which of your requirements does that case bear on, and which single requirement does the most work — the one that, once you apply it, knocks out the most otherwise-popular theories? Also flag any pair of requirements you suspect can't be satisfied together, beacuse if two of them conflict then the list itself is the real result and the theories are just choosing sides. And tell me which requirements are genuinely non-negotiable and which are really just house rules of one camp (the resolute-choice people, the sophisticated-choice people, whoever) dressed up as universal.

  No citations or reading lists, obviously — I just want the spec. A table is fine for the requirements if that helps.
