  First, they want the core cases that force specific requirements. Classic money pump is a must—it's the baseline for showing how myopic choices lead to exploitation. Then there's the foreseen pump, where the agent sees it coming but still can't avoid it without commitment mechanisms. The naive pump is key for distinguishing between naivety and sophistication. And the refusal case, where saying no upfront prevents exploitation. These scenarios each test different aspects: consistency, foresight, commitment, and strategic refusal.

  Next, distinctions that can't be collapsed. Exploitability vs. internal inconsistency is crucial because an agent might be consistent moment-to-point but still lose. Unstable preferences versus genuine revision matters for whether preference changes are rational or flawed. Moment vs. life rationality highlights the tension between immediate and long-term gains. And welcoming vs. ambushed agents—this gets at intentionality and whether the agent consents to the path.

  Then, results that can't contradict. The foresight argument suggests that with perfect prediction and consistency, pumping shouldn't happen. A theory claiming it's always possible conflicts here, so this is a boundary condition.

  The user's case involves a woman with stable preferences but shifting reference points. Each step is rational locally, but the whole sequence is rejected upfront. This tests whether local rationality entails diachronic rationality. If she foresees the path and still proceeds, does that make her irrational? This case directly challenges the separation between synchronic and diachronic requirements and the need for a stability criterion.

  Now, the requirements table. Each requirement must be tied to a scenario. For example, exploitability avoidance comes from the classic pump, while path stability is forced by the refusal case. Foresight responsiveness links to the foreseen pump scenario. The user's case most impacts the stability requirement—her shifting reference points cause path instability even with local consistency.

  Conflicts between requirements are critical. Exploitability avoidance and foresight responsiveness might clash. If an agent avoids exploitation only through precommitment, does that mean they lack foresight? Also, the user suspects some requirements are camp-specific, like resoluteness vs. sophistication. Genuine non-negotiables are exploitability avoidance and synchronic consistency—without these, the theory doesn't address the core problem. But path stability might be contested, as sophistication advocates might accept it as a cost.

  The user's deeper needs: They want a framework to evaluate theories, not just arguments for one side. They’re seeking clarity on what's essential versus debatable. Highlighting conflicts shows where compromises are inevitable. Their case study serves as a litmus test—how different theories handle locally rational but globally exploitative paths. They might be looking for which requirement, if enforced, disqualifies common approaches, like stability ruling out naive agents.

  In conclusion, structuring the requirements with scenarios and distinctions provides the "spec" they need. Emphasizing conflicts and non-negotiables helps them navigate the literature’s camps. Their case underscores the tension between local and global rationality, pushing for a theory that either enforces stability or redefines rationality to accommodate such paths under foresight.
answer: |-
  Here's the specification for an adequate theory of diachronic rationality, structured as requested. Your case is analyzed at the end.

  **The Requirements List: What Diachronic Rationality Must Deliver**

  | Requirement                             | Forced By (Scenario/Case)                                                                                                  | What It Solves/Prevents                                                                 |
  | :-------------------------------------- | :------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------- |
  | **1. Avoid Exploitability (Weak)**      | **The Classic Money Pump:** Sequential trades exploiting strict cycle (A>B, B>C, C>A) leading back to start minus money.  | Prevents agents from being predictably drained of resources through their own choices.  |
  | **2. Avoid Exploitability (Strong)**    | **The Foreseen Pump:** Agent sees the *entire exploitative sequence* coming from the start, yet still walks into it.      | Prevents exploitation even with full foresight & no "surprise" element.                |
  | **3. Handle Preference Instability**    | **The Naive Pump:** Agent believes future self will have different pref (e.g., more patient, loss-averse). Exploited via that belief. | Distinguishes rational preference revision (new info) from instability inviting pumps. |
  | **4. Respect Synchronic Rationality**   | **The Refusal Case:** Agent rationally refuses the first step *because* it leads to a dominated outcome later.            | Ensures moment-by-moment choices aren't *locally* irrational to prevent global loss.   |
  | **5. Ensure Path Stability**            | **The Package Refusal:** Agent accepts each step locally (by current pref/reference) but rejects the *whole sequence* upfront. | Addresses inconsistency between step-wise choices and overall plan evaluation.         |
  | **6. Accommodate Foresight & Planning** | **The Sophisticated Agent:** Agent with foresight uses commitment/bundling to avoid pumps a myopic agent would fall for. | Allows agents to leverage knowledge of future selves/choices to protect interests.     |
  | **7. Distinguish Process from Outcome** | **The Welcoming Agent vs. Ambushed Agent:** An agent who *intends* the path (e.g., pays for enjoyment) vs. one tricked. | Separates genuine preference for the process from exploitative manipulation.           |
  | **8. Maintain Core Preference Logic**   | **The Foresight Argument:** If agent has foresight + consistent choices + bundles options, pumping seems impossible.       | Prevents contradiction with basic logic under idealized foresight/control.             |

  **Key Distinctions It Can't Collapse:**
  *   **Exploitability vs. Internal Inconsistency:** Being pumpable *demonstrates* a diachronic inconsistency, even if every synchronic choice is consistent *at that moment* with its local preferences. The inconsistency is *across time*.
  *   **Unstable Preference vs. Rational Revision:** Changing your mind because of genuinely new information is rational. Changing because your reference point *arbitrarily* resets after each choice, enabling exploitation, indicates instability.
  *   **Rational for a Moment vs. Rational for a Life:** Synchronic rationality governs the immediate choice. Diachronic rationality governs the *sequence*, ensuring the chain of choices serves the agent's *enduring* interests or overall good.
  *   **Welcoming vs. Ambushed:** An agent who knowingly pays $10 for the "ride" of a money pump cycle (e.g., enjoys the trades) isn't exploited. An agent who *intends* to end up better off but is manipulated *is* exploited. The theory must diagnose the latter as irrational.

  **Results It Can't Contradict (Boundary Conditions):**
  *   **The Foresight Argument:** Under *perfect foresight, perfect self-control over future choices, and the ability to precommit to bundles/plans*, an agent with *globally* consistent preferences should be able to avoid straightforward money pumps. A theory claiming pumping is *always* unavoidable, even under these conditions, is likely flawed.

  **Analyzing Your Case: The Reference-Point Resetting Agent**
  *   **The Case:** Stable/transitive preferences over final outcomes. Evaluates each *step* as a gain/loss relative to *current* reference point. Trader exploits by structuring a sequence where each step is a perceived gain relative to the *immediately prior* state, but the final outcome is worse than the start relative to the *initial* reference point. Rejects the whole sequence upfront.
  *   **Which Requirements Bear On It:**
      *   **Crucially:** #5 (Path Stability) - The inconsistency between accepting the path step-by-step and rejecting it as a package is the core issue.
      *   **Significantly:** #1 & #2 (Exploitability) - She *is* exploited.
      *   **Critically:** #3 (Preference Instability) - Her *evaluation frame* (reference point) is unstable/resetting after each transaction, *not* her core preferences over outcomes. This instability enables the pump.
      *   **Relevantly:** #7 (Process vs. Outcome) - She is ambushed, not welcoming.
  *   **The Knockout Requirement:** **#5 (Path Stability)**. This requirement demands that an agent's choices over *paths* (sequences of actions/states) should be consistent with their choices over individual steps, *or* that the inconsistency is rationally explained (e.g., by costly commitment). A theory that dismisses her sequence as rational because each step is locally optimal fails #5 spectacularly. This requirement rules out theories that *only* care about synchronic rationality (#4) and ignore the diachronic inconsistency revealed by the package refusal.
  *   **Foresight Variation:** If she foresees the *entire sequence and its outcome* in advance and *still* chooses to go along step-by-step, it becomes even harder to defend her rationality. It suggests:
      1.  **Failure of Foresight (#6):** She cannot effectively use her foresight to plan or bind herself to avoid the bad path.
      2.  **Deep Instability (#3):** Her reference-point resetting is so dominant it overrides knowledge of the final dominated outcome relative to her *initial* state/preferences.
      3.  **Contradiction:** She effectively prefers the path leading to a worse outcome (relative to start) *over* staying put, which contradicts her stable preference ordering over outcomes (if staying put was preferred to the final outcome). This violates #8 (Core Preference Logic). She *must* be irrational: either her foresight/planning ability is broken, or her stated stable preferences are not actually governing her sequential choices.

  **Conflicting Requirements & Non-Negotiables:**
  *   **Suspected Conflict:** **#2 (Avoid Exploitability - Strong/Foreseen) vs. #6 (Accommodate Foresight & Planning) + #8 (Core Logic)**.
      *   *The Tension:* #2 demands agents shouldn't fall into foreseen pumps. #6 and #8 suggest that with sufficient foresight, planning, and control, they *should* be able to avoid them by precommitment/bundling. The conflict arises if a theory claims:
          *   Foreseen pumps are *always* possible (satisfies #2 strongly) but violates #6/#8 under ideal foresight/control.
          *   Foreseen pumps are *impossible* under sufficient foresight/control (satisfies #6/#8) but weakens #2 (only unforeseen or uncontrollable pumps are possible).
      *   *The Resolution:* Most theories resolve this by acknowledging that **avoiding foreseen pumps requires specific capacities** (foresight, self-binding, plan evaluation). If an agent *lacks* these capacities *and* falls into a foreseen pump, #2 diagnoses irrationality *due to the lack of those capacities*. If they *have* the capacities and *still* fall in, it's irrationality in using them. #2 isn't violated if the agent *could and should* have used foresight/planning to avoid it but failed.
  *   **Genuinely Non-Negotiable:**
      *   **#1 (Avoid Exploitability - Weak):** The *raison d'être* of diachronic rationality. If a theory allows classic, unforeseen money pumps without diagnosing irrationality, it fails the core challenge.
      *   **#4 (Respect Synchronic Rationality):** A theory that demands *locally* irrational choices to avoid global loss is highly suspect (e.g., "irrationally" refuse a genuinely beneficial trade now to prevent a future exploit). Local choices must make sense *in their moment* with available info.
      *   **#8 (Maintain Core Preference Logic):** Cannot blatantly violate transitivity/dominance in final outcomes under conditions of full control and certainty. (Process preferences are different).
  *   **Camp-Specific "House Rules" (Often Debated):**
      *   **Extreme Path Stability (#5) as "Resoluteness":** Demanding agents *never* deviate from a pre-chosen plan, even if new info makes the plan locally suboptimal, is a specific (resolute choice) strategy to *achieve* diachronic rationality, not an absolute requirement. Sophisticated choice (planning around future deviations) is an alternative.
      *   **Requiring Perfect Foresight/Control (#6) as Default:** Assuming all agents *have* perfect foresight and self-control is an idealization. A theory must handle agents with *limited* foresight/control without labelling them irrational simply for having those limits.
      *   **Outcome-Only Rationality:** Dismissing the process (#7) entirely and judging rationality *only* on the final outcome misses the point of diachronic *choice*. How you get there matters.

  **In essence:** The theory must explain how agents can make coherent, non-self-defeating sequences of choices over time, distinguishing rational planning and preference evolution from instability and exploitability, while respecting the rationality of each moment and the logic of preferences over outcomes. Your reference-point resetting agent fails primarily on **Path Stability (#5)**, revealing a deep **Preference Instability (#3)** in her evaluation frames that enables **Exploitability (#1, #2)**. Foresight makes her actions harder, not easier, to justify. #5 is the requirement that does the most work in ruling out purely synchronic accounts. The tension between preventing foreseen exploitation (#2) and enabling foresight-based planning (#6) is where the deepest theoretical battles are fought.
