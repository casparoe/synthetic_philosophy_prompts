answer: |-
  ## The Levelling Down Objection: Prioritarianism's Precarious Escape

  The levelling down objection (LDO) poses a formidable challenge to telic egalitarianism. By asserting that equality is intrinsically valuable, telic egalitarianism seems committed to the counterintuitive claim that a world where everyone is equally worse off is, in one respect, better than a world with inequality, even if no one benefits from the increased equality. Prioritarianism, particularly in its additive form with a concave transformation function (here, the sum of square roots of welfare), is offered as an alternative that avoids this implication while still prioritizing the worse off. Evaluating whether this escape is genuine and at what cost requires analyzing the specified distributions under all three views.

  **Analysis of Distributions:**

  *   **Utilitarian (Sum of Welfare):**
      *   (a) 25 + 25 = 50
      *   (b) 100 + 1 = 101
      *   (c) 100 + 25 = 125
      *   (d) 9 + 9 = 18
      *   *Ranking:* (c) > (b) > (a) > (d)

  *   **Telic Egalitarian (Value = Sum of Welfare - Disvalue of Inequality):**
      *   Assuming a significant intrinsic disvalue for inequality, equality is intrinsically better.
      *   (a) High value (equality, moderate welfare)
      *   (b) Low value (extreme inequality, high sum)
      *   (c) Moderate value (moderate inequality, high sum)
      *   (d) Moderate value (equality, low welfare)
      *   *Relevant Comparisons:*
          *   (a) vs. (c): (a) is better *in one respect* (equality) despite being worse in total welfare (50 vs 125).
          *   (a) vs. (b): (a) is better *in one respect* (equality) despite being worse in total welfare (50 vs 101).
          *   (d) vs. (b): (d) is better *in one respect* (equality) despite being worse in total welfare (18 vs 101). Levelling down from (b) to (d) is an improvement *in one respect*.

  *   **Prioritarian (Sum of √Welfare):**
      *   (a) √25 + √25 = 5 + 5 = 10
      *   (b) √100 + √1 = 10 + 1 = 11
      *   (c) √100 + √25 = 10 + 5 = 15
      *   (d) √9 + √9 = 3 + 3 = 6
      *   *Ranking:* (c) > (b) > (a) > (d)

  **Question 1: Does Prioritarianism Escape Levelling Down?**

  Prioritarianism, as defined, **genuinely escapes the levelling-down objection.** A change counts as an improvement only if it increases the prioritarian sum. Since levelling down either reduces the welfare of some without increasing anyone else's (e.g., dragging the better-off down) or reduces everyone's welfare equally, the sum of the concave-transformed welfares *necessarily decreases*. No change that improves no one can increase this sum.

  *   **Levelling down (c) to (a):** (c) = 15, (a) = 10. 15 > 10. The change *reduces* prioritarian value. It is worse, not better.
  *   **Levelling down (b) to (a):** (b) = 11, (a) = 10. 11 > 10. The change *reduces* prioritarian value. It is worse, not better.

  Prioritarianism *does* prefer (b) (11) over (a) (10), even though in (b), the worse-off person (welfare=1) is significantly worse off than *both* individuals in (a) (welfare=25). This reveals a crucial distinction: prioritarianism is **not fundamentally egalitarian**. It cares about the *absolute* level of welfare, weighted by priority to the worse off. It values improving the lot of the worse off, but only through absolute gains. It does not intrinsically value reducing the gap between better-off and worse-off *if* that reduction comes solely from harming the better-off. In (b) vs. (a), the massive gain to the person ending up at 100 (√100=10 vs √25=5) outweighs, in the prioritarian calculus, the catastrophic loss suffered by the person falling from 25 to 1 (√25=5 vs √1=1). This outcome is a direct consequence of assigning no intrinsic disvalue to the inequality itself and focusing solely on the weighted sum of individual welfares. While it prioritizes gains to the worse off, it does not mandate that the worst-off position must be maximized if it comes at a sufficient cost to the better off.

  **Question 2: Is the Escape Too Cheap?**

  The escape from LDO comes at a significant conceptual cost: **the rejection of the intrinsic badness of inequality.**

  *   **The Person-Affecting Restriction:** The LDO gains its intuitive force from the person-affecting intuition: an outcome cannot be better (or worse) in any respect unless it is better (or worse) *for* someone. Telic egalitarians explicitly reject this restriction, arguing that the impersonal badness of an unequal state of affairs provides a reason to promote equality, even if no specific person is made better off in absolute terms by the equalizing move itself. The LDO *does* assume the falsity of the telic egalitarian's core claim (that equality is intrinsically valuable). In this sense, it "begs the question" against the telic egalitarian by presupposing that only person-affecting improvements count. However, the power of the LDO lies not in logical refutation but in exposing the deeply counterintuitive consequence of rejecting the person-affecting restriction: endorsing pure harm (levelling down) as an "improvement." Prioritarianism avoids this consequence precisely by accepting the person-affecting restriction in its core structure – value is generated only by benefits *to* individuals, weighted by their position.

  *   **The Cost: Condemning Non-Welfare-Affecting Inequality:** This is where the price of escape becomes apparent. Consider a scenario involving pure relational inequality or domination: two individuals, A and B. A dominates B. Crucially, B's welfare level is identical to what it would be in an equal, non-dominant relationship (say, welfare=16). A's welfare is also unchanged. There is no difference in anyone's absolute welfare level compared to the equal state; only the relation of domination exists.
      *   **Telic Egalitarian:** Condemns this outcome. The intrinsic badness of the unequal relation makes it worse than the equal state, even though no one is worse off in welfare terms.
      *   **Prioritarian (Sum √w):** √16 (A) + √16 (B) = 4 + 4 = 8. The equal state also yields √16 + √16 = 8. The Prioritarian sees *no difference* in value between the equal state and the state of domination. The inequality, being purely relational and welfare-neutral, has no impact on the prioritarian sum. Prioritarianism lacks the resources to condemn this inequality *as such*.

  **Verdict and Defense:**

  1.  **The LDO successfully refutes Telic Egalitarianism.** Its commitment to the intrinsic value of equality forces it to endorse outcomes that are, by any plausible person-affecting standard, morally worse, solely for the sake of equality. This consequence is fatal to its plausibility as a complete account of distributive value. The intuitive repugnance of endorsing pure harm as an improvement outweighs the theoretical commitment to impersonal value.
  2.  **Prioritarianism genuinely escapes the Levelling-Down Objection.** Its value metric, based solely on the concave transformation of individual welfare, ensures that no pure reduction in welfare (levelling down) can ever increase overall value.
  3.  **The price of escape – the inability to condemn welfare-neutral relational inequalities like domination – is significant but ultimately acceptable.** While the loss of the ability to criticize certain forms of non-welfare-affecting injustice is a serious drawback, it is a necessary cost for avoiding the morally more egregious implication of endorsing levelling down. The core function of distributive ethics is to evaluate states of affairs based on how individuals fare *in terms of their welfare*. Prioritarianism captures the imperative to prioritize the badly off in welfare terms without falling into the trap of valuing destruction. Concerns about domination are better addressed by *deontic* egalitarian principles – principles concerning fair procedures, rights, and the just structure of relationships – rather than by attributing intrinsic *telic* disvalue to the inequality itself. A theory of distributive justice needs both a plausible theory of how to distribute goods (where prioritarianism succeeds in avoiding LDO) and a theory of just social relations (which may require separate deontic principles).

  **Defense Against the Strongest Reply:**

  The strongest reply from the Telic Egalitarian (or a critic of prioritarianism) is: **"Dismissing the badness of welfare-neutral domination as merely 'deontic' ignores its fundamental moral significance. Such domination *is* intrinsically bad, a stain on the state of affairs itself, even if no welfare loss occurs. Prioritarianism, by being blind to this, fails a basic test of justice. The cost of avoiding levelling down is abandoning the core demand for genuine social equality."**

  This reply highlights the substantive principle at stake: **Does justice fundamentally require not only that individuals have sufficient welfare, prioritized to the worse off, but also that they stand in relations of equality, free from domination, *regardless* of whether that domination lowers their welfare?** Prioritarianism implicitly answers "no," focusing solely on welfare states. The defense rests on two pillars:

  1.  **The Primacy of Welfare Harm:** While domination is often *correlated* with welfare loss and is instrumentally bad, its intrinsic badness *when welfare is unaffected* is less axiomatic and more contestable than the intrinsic badness of making someone worse off for no benefit (levelling down). The LDO exposes a direct conflict with a fundamental moral intuition against pointless harm. The condemnation of welfare-neutral domination relies on a different, perhaps less universally shared, intuition about the intrinsic importance of social relations in the telic evaluation of states. Avoiding a direct clash with the "no pointless harm" intuition is the higher priority for a theory of *distributive* value.
  2.  **The Division of Labor:** The perniciousness of domination is best captured and prohibited by deontic constraints (e.g., rights against arbitrary interference, requirements for democratic justification) rather than by building it into the *telic* evaluation of outcomes via inequality metrics. Prioritarianism provides a coherent and plausible account of how to weigh welfare gains and losses. Supplementing it with independent deontic principles against domination offers a more robust and theoretically cleaner framework for justice than trying to force all concerns about equality into a single telic value function, which leads directly to the LDO problem. Sacrificing the ability to condemn welfare-neutral domination within the telic calculus is the necessary cost of maintaining a person-affecting core and avoiding the deeply implausible endorsement of levelling down.

  Therefore, while prioritarianism abandons a potential weapon against certain forms of injustice, it secures a more fundamental moral advantage: it never recommends making anyone worse off without making someone better off. Given the choice between a theory that avoids morally catastrophic recommendations (levelling down) but might need supplementation for non-welfare injustices, and a theory that embraces such recommendations for the sake of condemning a broader range of inequalities, the former is superior. Prioritarianism's escape from the levelling down objection is genuine, and its cost, though real, is justified.
