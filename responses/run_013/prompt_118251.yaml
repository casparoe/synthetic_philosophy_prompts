  The experience vs. judgment distinction: Early nodes (sensory) vs. later (interpretation). Penetration affecting only higher nodes aligns with Fodor's view. But the model itself doesn't inherently mark this boundary; it's a structural choice. The debate's lack of clarity here might be why it's hard to translate.

  Substantive vs. verbal disagreement: After translation, the debate centers on which edges exist in the brain's network. If both sides agree on optimal inference but dispute connectivity, it's empirical. If they disagree on rational constraints, that's a gap in the model's normative aspects.

