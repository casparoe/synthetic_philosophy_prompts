  2. Kalai-Smorodinsky: Equalizes the fraction of potential gain. This might feel fair because it respects aspirations.

  3. Egalitarian: Maximizes the minimum payoff. Seems very fair on surface.

  4. Utilitarian: Maximizes total sum. Might ignore fairness in favor of efficiency.

  5. Equal-surplus split: Splits the surplus equally. Simple and intuitive.

