answer: |-
  Here are five numbered clauses of Her Majesty's Customs and Excise Directive 7.4.1 (Livestock Classification: Equine):

  1.  Pursuant to established principles of nomenclature, the term "horse" designates solely the essential form or shape of the animal, whereas the term "white" designates solely the attribute of colour; consequently, a white horse constitutes a distinct classification from a horse *simpliciter* for the purposes of duty assessment under Schedule 3.
  2.  Animals exhibiting a grey coat, being neither definitively white nor devoid of colour designation, shall be assessed under the base "horse" classification only; disputes regarding the precise chromatic boundary between grey and white are to be resolved by reference to the designated colour standard (HMC&E Form EQL-7a, Appendix B).
  3.  A horse possessing white markings, including but not limited to socks, blazes, or a single white eye, does not thereby qualify as a "white horse"; the designation "white" pertains strictly to the complete colour characteristic of the animal as a whole entity, not to constituent parts.
  4.  Application of white pigment to a non-white horse (e.g., a bay) alters the surface colour characteristic but does not alter the essential form designated by "horse"; such an animal remains classified solely as a "horse" and does not acquire "white horse" status.
  5.  Attempted importation or exportation of a non-white horse fraudulently presented as a white horse (per Clause 4) constitutes misdeclaration of *colour* (Form EQL-7a), not misdeclaration of *equine type*; duty adjustments shall therefore apply only to the colour-based surcharge differential, not the base horse duty.
