  Final stanza recombines opening lines: "I'll buy your doubt of rain tomorrow" and "And sixty cents for its certain twin" now form a closed loop. New closing lines "The coins are counted, bright and cold" and "Your own sure hand has bought and sold" complete the trap visually.

  For the coda: I'll make it plain-spoken to contrast with the lyrical pantoum. "Then I offer both together" presents the package. "They shake their head, consider whether" shows hesitation. "A dollar lost is not the same" introduces loss aversion. "As a dollar gained in any game" contrasts utilities. "Or simply find they do not care" suggests indifference. "To wager on tomorrow's air" ends on uncertainty.

