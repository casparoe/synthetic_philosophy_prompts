answer: |-
  ## The Bookie's Pantoum

  I'll buy your doubt of rain tomorrow.
  Sixty cents for that thought you borrow.
  And sixty cents for its certain twin.
  Against all skies that may begin.

  Sixty cents for that thought you borrow.
  Against all skies that may begin.
  A dollar paid for peace of mind.
  A bargain struck, with loss defined.

  A dollar paid for peace of mind.
  I'll buy your doubt of rain tomorrow.
  The coins are counted, bright and cold.
  Your own sure hand has bought and sold.

  I'll buy your doubt of rain tomorrow.
  The coins are counted, bright and cold.
  And sixty cents for its certain twin.
  Your own sure hand has bought and sold.

  Then I offer both together, clear and plain.
  They shake their head, consider whether
  A dollar lost is not the same
  As a dollar gained in any game,
  Or simply find they do not care
  To wager on tomorrow's air.

  ---

  The pantoum enacts the Dutch book:
  *   **Form as Argument:** The strict repetition forces lines to shift meaning. "Sixty cents for that thought you borrow" is a fair offer initially (stanza 1, line 2), but becomes an insistent part of the trap when repeated (stanza 2, line 1 & stanza 4, line 3). "Your own sure hand has bought and sold" (stanza 3, line 4) seems like agency, but in the final line (stanza 4, line 4), after the arithmetic ($1.20 paid for max $1 return) is implied by "A dollar paid for peace of mind" (stanza 2, line 3) and "A bargain struck, with loss defined" (stanza 2, line 4), it signifies self-inflicted loss.
  *   **Closure:** The final stanza recombines the opening stanza's first ("I'll buy your doubt...") and third ("And sixty cents...") lines. Surrounded by "The coins are counted..." and "Your own sure hand...", the trap is visually and logically closed. The bookie's courtesy is maintained ("I'll buy...").
  *   **Implicit Arithmetic:** The two 60-cent bets ("doubt of rain" and "its certain twin" - no rain) costing $1.20 total, against a maximum payout of $1 ("A dollar paid for peace of mind"), is legible without explicit calculation.
  *   **Coda's Break:** The free verse coda breaks the pantoum's cyclical trap. The agent declines the combined offer ("both together"), citing potential reasons (loss aversion, indifference, non-engagement) without judgment. The bookie is left holding the unsold package ("wager on tomorrow's air"), leaving the argument's force unresolved. The flatness contrasts the pantoum's formal inevitability.
