answer: |-
  Your question cuts to the heart of how humans transmit values versus facts—and why these domains operate differently. As someone who's navigated both scientific rigor and the messy terrain of moral pedagogy, you've identified a profound tension. Let's dissect the implicit theory behind exemplary narratives and what it presupposes:

  ### The Core Presupposition: Moral Learning as Embodied Mimēsis
  The practice assumes **virtue is acquired through emulation of concrete exemplars, not abstract rules**. This aligns with:
  1. **Aristotelian virtue ethics**: Character (hexis) is forged through habitual action inspired by phronēmos (practical wisdom) of role models.
  2. **Narrative psychology**: Humans think in stories (Bruner, Sarbin). Abstract principles are cognitively "sticky" only when embedded in affective narratives.
  3. **Social learning theory (Bandura)**: Observational learning requires attention (captured by drama), retention (aided by vivid stories), and motivation (admiration/indignation).

  ### Key Elements the Practice Relies On:
  | **Element**             | **Why Necessary?**                                                                 | **Tolerates Imperfection?**                              |
  |--------------------------|------------------------------------------------------------------------------------|----------------------------------------------------------|
  | **Idealization**         | Creates emotional resonance; makes virtues "visible" (like a geological thin section stain) | Yes—warts may even humanize (Augustine's Confessions) |
  | **Narrative Arc**        | Provides cognitive scaffold; crisis → resolution mirrors moral struggle            | Yes—core virtue must survive the arc                     |
  | **Affective Engagement** | Admiration triggers mimetic desire (Girard); disgust at injustice motivates change | Partially—if hero is wholly unlovable, emulation fails   |
  | **Symbolic Truth**       | Historical fidelity is secondary to "truth" of the virtue demonstrated            | **Crucially yes**—the story often outlives debunking     |

  ### Why the Practice Survives Debunking
  1. **Cognitive Dissonance Resolution**: We decouple the *virtue* (Newton's perseverance) from the *myth* (the apple). The lesson becomes "detachable" (MacIntyre).
  2. **Functional Utility**: As you observed—the story *works*. Students grasp "scientific integrity" faster through the myth of Galileo than through UNESCO ethics guidelines.
  3. **Metaphorical Truth**: Like sediment layers preserving paleoenvironmental signals, stories preserve moral meaning beyond literal facts.

  ### The Hypocrisy Paradox Resolved
  Science treats **epistemic virtues** (accuracy, reproducibility) differently from **moral virtues** (curiosity, courage):
  - **Epistemic rules** guard against collective error; require strict factual adherence.
  - **Moral exemplars** inspire individual praxis; thrive on symbolic resonance.  
  *This isn't hypocrisy—it's domain-specific pragmatism.* You wouldn't teach seismic interpretation through fables, but you might instill fieldwork ethics via tales of heroic geologists.

  ### What Would Change Under Rival Theories?
  - **If learning were purely rule-based** (Kantian deontology):  
    → Stories become decorative. Lessons reduce to maxims: "Never fabricate data."  
    → **Risk**: Motivation atrophies; rules feel externally imposed.
    
  - **If exemplars required strict realism**:  
    → Marie Curie taught as a complex, depressed genius who had an affair.  
    → **Risk**: Students focus on her flaws ("She was hypocritical!") rather than radium work ethic.

  - **If we abandoned idealization**:  
    → Darwin portrayed as a chronic procrastinator who delayed publishing.  
    → **Risk**: Undermines "courage to publish" lesson; enables excuse-making.

  ### Where the Practice is Underdetermined
  1. **Must the exemplar be "good overall"?**  
     No—the practice works with "flawed saints" (Darwin's colonial biases) if the *target virtue* remains untarnished. We teach his tenacity while critiquing his social views.

  2. **Does the lesson die when myth is exposed?**  
     Often not—because the value has been internalized. The debunked story becomes a *shared ritual* (like knowing Santa isn't real but enjoying the tradition).

  ### A Geological Metaphor
  These narratives are **conglomerates**: sedimentary facts cemented by moral matrix. Even when clasts (facts) weather away, the cement (virtue) holds the structure. We keep them because they're the only formations that withstand erosion by cynicism.

  Your instinct is correct: This practice assumes virtue is *caught, not taught*. To discard exemplary myths would require rebuilding moral education on entirely new foundations—perhaps neurocognitive conditioning or AI tutors. But as long as humans are storytelling apes, we'll likely keep polishing our narrative conglomerates, warts and all. The deeper truth? *You* taught plate tectonics through stories not because textbooks demanded it, but because your students' minds resonated with narrative like shale resonates with seismic waves.
