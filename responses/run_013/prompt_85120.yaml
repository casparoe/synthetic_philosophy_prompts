answer: |-
  ### Decision Tree: Positions on Symbol Grounding

  **Branch 1:** Does a dictionary (defining words only via other words in the same dictionary) contain meaningful symbols?  
  - **No** → Go to Branch 2  
  - **Yes** → Go to Branch 3  

  **Branch 2:** Does a chess engine's representation of a "queen" (which reliably guides winning moves but has no physical connection to a queen) mean anything?  
  - **No** → Go to Branch 4  
  - **Yes** → Go to Branch 5  

  **Branch 3:** Does a system trained *only* on text (written by sighted people) that uses "red" correctly in sentences understand color?  
  - **No** → **Position: Inferential Role Semantics**  
    - *Commitment*: Meaning is exhaustively defined by a symbol's inferential relationships to other symbols.  
    - *Awkward commitment*: A self-contained dictionary is fully meaningful despite no link to reality.  
  - **Yes** → **Position: Derivative Grounding**  
    - *Commitment*: A system gains meaning parasitically by mirroring the use patterns of grounded agents.  
    - *Awkward commitment*: A text-trained AI "understands" color identically to sighted humans.  

  **Branch 4:** Does the internal variable in a numerical weather model (reliably tracking sea-surface temperature via satellite data) mean anything?  
  - **No** → **Position: Radical Non-Grounding**  
    - *Commitment*: No arrangement of formal symbol manipulation can ever yield meaning.  
    - *Awkward commitment*: All computational systems (including weather models) are equally meaningless.  
  - **Yes** → Go to Branch 6  

  **Branch 5:** Does a blind person’s competent use of "red" (e.g., sorting objects by color via feedback) demonstrate understanding?  
  - **No** → **Position: Sensorimotor Grounding**  
    - *Commitment*: Meaning requires direct sensorimotor coupling (e.g., perception/action loops).  
    - *Awkward commitment*: The blind person uses "red" without grasping its meaning.  
  - **Yes** → **Position: Causal-Informational Grounding**  
    - *Commitment*: Meaning requires reliable causal/informational links to the world, not necessarily sensorimotor.  
    - *Awkward commitment*: The weather model’s SST variable is as grounded as human color concepts.  

  **Branch 6:** Does a robot (wired to cameras/motors but never rewarded, punished, or selected) "mean" anything with its symbol for "obstacle"?  
  - **No** → **Position: Historical Selection**  
    - *Commitment*: Meaning depends on evolutionary/developmental history (selection for function).  
    - *Awkward commitment*: An identically wired robot lacks meaning if assembled randomly.  
  - **Yes** → **Position: Gradualist System-Relativity**  
    - *Commitment*: Grounding is scalar and systemic (emerging from distributed connections), not binary/per-symbol.  
    - *Awkward commitment*: The robot’s symbols are "partly grounded" despite zero adaptive history.  

  ---

  ### Unseparated Pairs of Leaves  
  1. **Inferential Role Semantics** and **Derivative Grounding** cannot be separated: Both affirm meaning without direct world-connection, differing only on whether community use is essential. The tree lacks a question forcing this choice.  
  2. **Causal-Informational Grounding** and **Gradualist System-Relativity** cannot be separated: Both accept the weather model as grounded but diverge on whether grounding is discrete (per-symbol) or continuous (system-wide). No question isolates this.  

  ### Unoccupied Combinations  
  - **"Yes" at Branch 2 + "No" at Branch 5**: This would require accepting the chess engine’s symbols as meaningful *and* rejecting the blind person’s understanding. No position holds this, likely because it is incoherent: If abstract competence suffices for chess, it should for color words too.  
  - **"No" at Branch 1 + "Yes" at Branch 3**: Rejects dictionary meaning but affirms text-trained AI meaning. Unoccupied as unattractive: It arbitrarily privileges statistical patterns over syntactic ones.  

  ### Highest-Impact Question  
  **Branch 1 (dictionary meaning)** does the most sorting work. It splits the logical space into:  
  - **Left path (No)**: Meaning *must* involve the world (Branches 2, 4, 5, 6).  
  - **Right path (Yes)**: Meaning can be internal/relational (Branch 3).  
  This forces a foundational choice: Is meaning necessarily world-involving? All other questions presuppose this split.  

  ---

  ### How to Use This Tree  
  Start at Branch 1. Answer based on your intuitive judgment of the concrete case. Proceed until you reach a leaf. The position names are *descriptive labels* for clusters of commitments, not endorsements. Revisit ambiguous cases to test consistency.
