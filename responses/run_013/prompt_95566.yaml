prompt: |-
  Ok so here's a thing I've been chewing on and can't find a word for. Everyone has a word for the person who does more than they had to — the guy who jumps in the river, the coworker who stays late to fix your mess. Going above and beyond. I'm pretty sure there's even a proper philosophy word for it that I can never remember (super-something?). Fine.

  But I can't find the word for the mirror image. My old landlord raised the rent by the maximum the law allowed every single year, never fixed the radiator, and sent back my deposit minus every penny he could justify. He broke no rule. Or: a company that follows the letter of an environmental law while visibly doing the least it possibly can. Or the person who takes the last seat on a crowded bus and then very slowly puts their bag away while an old man stands there. Nothing illegal, nothing forbidden — but "nothing wrong" feels like a lie. And it's not the same as just being a boring neutral choice like vanilla vs chocolate. We hold it against them, we just don't have a charge to file.

  Is there a name for that second thing — the act you're allowed to do but that we still quietly hold against you? And where exactly is the line between "within your rights and that's the end of it" and "within your rights but come on"? I don't just want a label, I want to know what the thing actually is and where it stops being it. I'm also honestly not sure whether this is really the opposite of going above and beyond, or whether it's just the absence of it — those feel like different claims and I can't tell which one is right.

  I never studied any of this so please don't just hand me a name and walk off. Lay it out as a JSON object with these fields:

  - "has_name": true or false — does an established term already exist for this?
  - "established_terms": array, each item an object with "term", "what_it_means", "how_it_fits_my_cases", "where_it_falls_short"
  - "best_fit": the single nearest established concept, or "none"
  - "coined_term": if nothing fits, an object with "term" and "one_sentence_definition"; otherwise null
  - "precise_definition": your best stab at defining the phenomenon I described, in a couple of sentences
  - "not_this": array of things it's easily confused with, each with a one-line difference
  - "boundary_cases": array of short cases, each with "case", "verdict" (in / out / borderline), "why"
  - "opposites_verdict": short answer to my last question — is it the true opposite of above-and-beyond, or just its absence, and why
reasoning: |-
  Okay, the user is struggling to find a word for a specific behavior: when someone does the bare minimum legally required but in a way that feels morally lacking. They provided examples like a landlord maximizing rent increases without repairs, a company barely complying with environmental laws, or someone on a bus taking their time while an elderly person stands. They want to know if there's a term for this, where the line is between acceptable and objectionable, and whether it's the opposite of "going above and beyond" or just the absence of it.

  First, I need to recall if there's an established term for this. Words like "malicious compliance" come to mind, but that implies using rules to harm others intentionally. The user's examples don't necessarily involve intent to harm, just a lack of consideration. "Passive aggression" might fit in some cases, but it's more about indirect hostility, which isn't always present here. "Free-riding" is about benefiting without contributing, which doesn't fully capture scenarios like the bus or the landlord. "Legal literalism" is close but too narrow, as it focuses on exploiting legal wording. "Bad faith" requires intentional deception, which isn't always the case. So none of these terms perfectly fit all the examples.

  The core issue seems to be adhering strictly to rules while disregarding social expectations or unspoken norms. It's about exploiting the gap between legal permissions and ethical behavior. The user also wants to understand the boundary between acceptable and objectionable behavior. That line likely depends on communal norms, the power imbalance, and whether the action causes unnecessary harm or demonstrates a lack of empathy.

  For the "opposites" part, this behavior isn't the direct opposite of "supererogation" (going above and beyond). Supererogation is about optional good deeds, while this is about doing the minimum in a way that violates social contracts. It's more than just not going above; it's actively choosing minimal compliance in contexts where more is expected. So it's not the absence but a distinct negative behavior.

  Creating a new term might be necessary. "Normative neglect" could work, emphasizing the neglect of social norms despite legal compliance. Or "compliant indifference," highlighting apathy within the bounds of rules. But "malicious compliance" is the closest existing term, though it requires intent. The user's cases might involve varying levels of intent, so stretching "malicious compliance" could be debated.

  Boundary cases help clarify. For example, a company doing the legal minimum to help the environment without public boasting is merely compliant, not objectionable. But if they boast about it while doing little, it becomes hypocritical, which adds another layer. The bus scenario: taking a seat is fine, but the slow bag placement shows deliberate indifference, making it fall under the described behavior.

  The user's deeper need might be to articulate a concept they perceive as unjust but struggle to label, seeking validation that such behavior is recognizably problematic despite its legality. They might also want tools to discuss or address these situations in personal or professional contexts.
