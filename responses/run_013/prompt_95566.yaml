  **Key Insights from the Analysis:**

  1.  **No Perfect Term Exists:** While concepts like "Malicious Compliance," "Legal Literalism," and "Passive Aggression" touch on aspects, none fully capture the core of operating *at the minimum permissible boundary* while *exploiting the gap* between that boundary and expected decent conduct, *without necessarily having malice or intent to harm*. "Normative Exploitation" is proposed to fill this gap.
  2.  **Core Components:** The phenomenon requires:
      *   **Awareness of the Gap:** Knowing the minimum rule vs. the expected norm.
      *   **Deliberate Choice:** Actively choosing the minimal path.
      *   **Exploitation:** Leveraging this gap for self-interest, convenience, or to express indifference.
      *   **Perceived Ethical Failure:** Causing others to feel it's "wrong" despite being "allowed."
  3.  **The Line ("within rights and that's the end of it" vs. "within rights but come on"):** The line is crossed when the action **demonstrably exploits the gap between minimal permission and normative expectation in a way that displays selfishness, indifference, or callousness, violating an unspoken social contract.** Factors tipping it over:
      *   **Visibility of the Normative Expectation:** How strong and clear is the "should"?
      *   **Degree of Indifference/Selfishness:** Is the minimal action performed neutrally or with demonstrative disregard (slow bag placement)?
      *   **Pattern:** Is it a one-off or a consistent strategy (landlord every year)?
      *   **Power Imbalance:** Exploiting a position of power (landlord, corporation) makes it feel worse.
      *   **Impact:** Does it cause unnecessary hardship or inconvenience?
  4.  **Opposite vs. Absence:** It's **not** the simple absence of going above and beyond. Neutral compliance ("I paid the rent on time, fixed what was legally required") is the absence. Normative Exploitation is an **active, distinct negative behavior** inhabiting the space *between* mandatory duty and supererogatory good, choosing the absolute floor of permissibility in a way that feels like a moral slight. It's the *strategic use of minimalism* against implied decency.
