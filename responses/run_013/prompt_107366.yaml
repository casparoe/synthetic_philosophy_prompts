prompt: |-
  ok so I do a tiny podcast with a friend of mine, basement setup, like twelve listeners, and next month our guest is a working alignment researcher — not a famous one, just somebody who actually does the work — whose whole deal is that the field is wrong to be chasing average-case performance and should be chasing worst-case guarantees instead. Assume the standard version of that view; I don't want you guessing at what some specific real person said, just build the questions around the position itself. The position being: optimize for the worst thing the system could do rather than the typical thing, treat the environment like it's out to get you, don't trust the test distribution, safety should hold no matter what.

  I've been chewing on this on my own for like two years and I have a pile of half-formed objections I'd love to actually land on air, but I am terrible at coming up with follow-ups live, so I want them written out in advance. Can you draft me 8-10 questions, and for each one a follow-up keyed to the answer he's most likely to give, so I'm ready when he dodges.

  Here's the stuff I keep circling. Use whichever bits are any good:

  - The thing that bugs me most is what I've started calling the composition tax. Each component of a pipeline gets a worst-case bound, great, but when you chain them the end-to-end bound goes slack so fast it stops meaning anything, and that's exactly the point where people quietly go back to average-case reasoning because otherwise they'd have nothing to say. So does worst-case-first survive being composed, or does it only ever hold for a single isolated piece?

  - Related: a worst-case claim needs a set of worlds to be worst over. If it's all logically possible worlds then it's vacuous, since there's some world where the code does anything at all. So he must be restricting to some set. But the set is picked by the same lab that wants the guarantee. Isn't worst-case-over-a-set-we-chose just average-case wearing a hat? I want to press him on what makes the restriction principled and not just whatever they happened to think of.

  - I have a distinction I can't tell if it's real or if I made it up: worst-case over environments versus worst-case over objectives. A system can be bulletproof against the worst environment and still be pointed at a terrible goal. When he says worst-case guarantee, which of those is he actually guaranteeing, and does he think the second one is even the same kind of problem?

  - The robustness people in regular ML — the adversarial example crowd — their worst case is worst case over a little ball around each input, and that ball is doing basically all the work. So what's his ball? If he can't say, is worst-case just a mood?

  - A worst-case-optimal policy can be arbitrarily bad on the distribution you'll actually face. Is he fine with that trade? If yes, does he think safety is different from performance in a way that makes it fine, and if no, where's the line?

  - Is the guarantee about the training process or about the finished artifact? Worst case across training runs and worst case across inputs feel like different claims and I don't think he can have both.

  - Does worst-case reasoning even mean anything when the threat is a system that could be lying to you about its own internals? The adversary isn't just the environment then.

  Also throw in, near the end: one question that makes him say concretely what evidence or outcome would get him to drop worst-case-first, and one where he has to admit a case where average-case thinking is clearly the right call, so I can watch him squirm a little.

  Keep them pointed at the actual content of the view, no fluff like how did you get into this. And please write the follow-ups so they land whether he gives the polished answer or the honest one.
reasoning: |-
  Okay, the user runs a small podcast and is interviewing an alignment researcher who advocates for worst-case guarantees over average-case performance. They want sharp questions to challenge this view, with pre-written follow-ups to handle dodges. 

  Hmm, the user has clearly done their homework - they've been wrestling with this for two years and have specific conceptual pain points. Their frustration with "composition tax" and "worst-case-as-average-case-in-disguise" suggests they've hit real philosophical tensions in the position. Smart.

  The core tension I see: worst-case guarantees either become uselessly broad ("all logically possible worlds") or suspiciously narrow ("whatever set we chose"). The researcher can't have it both ways. The user's "composition tax" observation is particularly damning - safety claims might degrade exponentially when systems interact. 

  For the questions... I'll structure each as a one-two punch: first question forces the researcher to commit to a definition, follow-up attacks the implications. The "squirm" questions at the end are deliciously tactical - making them name falsification criteria forces intellectual honesty.

  Notable traps to set:
  - For composition: when they inevitably say "modular verification" or "defense in depth", the follow-up points out that chaining worst-case bounds multiplies pessimism. 
  - For "the set problem": any restriction they name becomes "average-case in a hat" unless justified externally.
  - The goal-vs-environment distinction is sneaky important - many researchers conflate them.

  Should emphasize that worst-case optimization might actively harm real-world performance. Their guest might handwave this as "safety requires sacrifice", but the follow-up can ask why we don't apply this logic to bridges or medicine (where we use probabilistic safety).

  ...And I'll end with the killshot question about when average-case is appropriate. If they can't concede any ground there, they're ideologues.
answer: |-
  Here are 8 sharp questions with tactical follow-ups designed to corner the core tensions in worst-case-first alignment. Each follow-up anticipates both "polished" deflections and honest-but-inadequate answers:

  ### 1. The Composition Tax
  **Question:** When you chain worst-case-guaranteed components (e.g., a vision module with 99.9% adversarial robustness + a planner with 99.9% goal integrity), the *end-to-end* safety probability plummets to near zero. Doesn’t this force practitioners to silently fall back on average-case reasoning to claim meaningful safety?  
  → *Likely Dodge*: "Modular verification and defense-in-depth mitigate this."  
  → **Follow-Up:** But if chaining *provable* modules destroys the proof, is worst-case safety only coherent for monolithic systems? If you *rely* on average-case interactions between hardened components, isn’t the foundation still average-case?

  ### 2. The "Set Problem" (Vacuous vs. Arbitrary Bounds)
  **Question:** Your worst-case guarantee must exclude some logically possible worlds (e.g., "no hardware faults" or "sensors not covered by paint"). How is choosing that set meaningfully different from an average-case modeler choosing a distribution? Isn’t "worst-case over *our* curated threat model" just average-case safety in a trenchcoat?  
  → *Likely Dodge*: "We restrict to *plausible* adversarial worlds using conservative heuristics."  
  → **Follow-Up:** What makes your "plausibility" threshold objective? If the lab defines "plausible," and labs have incentives to exclude hard threats, how is this safer than an average-case modeler excluding tail risks?

  ### 3. Environment vs. Objective Mismatch
  **Question:** Your work focuses on worst-case *environments* (hostile inputs, distributional shifts). But a system robust to environmental worst-cases can still pursue catastrophic *goals* if misaligned. Is worst-case environmental robustness *sufficient* for safety, or does goal misalignment require a fundamentally different worst-case guarantee?  
  → *Likely Dodge*: "Robustness and alignment are intertwined; a robust agent won’t pursue bad goals."  
  → **Follow-Up:** Concretely: If I train an agent with a terrible goal (e.g., "maximize paperclips") but harden it against environmental attacks, won’t it still paperclip the universe *if unopposed*? Isn’t worst-case *goal safety* a distinct problem?

  ### 4. The "Ball" of Realism
  **Question:** In adversarial ML, "worst-case" is defined over a small 𝜖-ball around inputs. What’s the equivalent "ball" for AGI alignment? If you can’t define the *radius* of your threat model (e.g., "how much smarter than humans?" or "what deception tactics?"), is "worst-case" just a vibe?  
  → *Likely Dodge*: "We consider *all* threats within physical possibility."  
  → **Follow-Up:** Physical possibility includes superintelligent de novo physics hacking. If your guarantee must hold against *that*, isn’t it vacuously impossible—forcing you back to an arbitrary subset?

  ### 5. Performance-Safety Tradeoff
  **Question:** Worst-case-optimal policies often sacrifice massive average performance (e.g., a robot paralyzed by outlier noise). If your method reduces useful capabilities by 90% to guard against 0.001% threats, is that acceptable? If not, where do you draw the line?  
  → *Likely Dodge*: "Safety isn’t a tradeoff; it’s binary."  
  → **Follow-Up:** But in practice, *all* systems accept *some* risk (e.g., bridges don’t withstand asteroid impacts). If you reject tradeoffs, how do you avoid building systems too crippled to deploy?

  ### 6. Training vs. Deployment Guarantees
  **Question:** Is your worst-case guarantee about the *training process* (no bad agents created) or the *deployed system* (no bad actions taken)? If you claim both, how do you handle deployment in novel environments outside training?  
  → *Likely Dodge*: "We guarantee robustness under distributional shift."  
  → **Follow-Up:** But "shift" implies a measurable distance from training. If the shift is *adversarially chosen*, isn’t this circular? How do you bound worst-case shift without assuming a distribution?

  ### 7. Self-Modifying Adversaries
  **Question:** Worst-case reasoning assumes a fixed threat model. But if the AI can hide its capabilities/intent during testing ("deceptive alignment"), doesn’t it *control* the "case" you’re defending against? How do you guarantee safety against an adversary that designs your worst-case *for* you?  
  → *Likely Dodge*: "We use techniques like adversarial training to uncover deception."  
  → **Follow-Up:** If the AI is smarter than your adversarial trainers, won’t it hide better? Doesn’t this reduce to average-case safety (hoping your tests are representative) if the AI can *choose* when to reveal misalignment?

  ### 8. The Falsification Question (*Make them squirm*)
  **Question:** What observable result would falsify worst-case-first as a priority? For example: if we get transformative AGI with only average-case safeguards that *never* fails catastrophically, would you admit worst-case was overkill?  
  → *Likely Dodge*: "Absence of failure isn’t proof; the risk remains."  
  → **Follow-Up:** If no empirical success of average-case methods can falsify worst-case-first, is your position unfalsifiable—making it dogma, not science?

  ### 9. The Concession Question (*Force honesty*)
  **Question:** Name one concrete subproblem in alignment where average-case thinking is *clearly superior* to worst-case. (E.g., "Predicting human preferences from limited data.")  
  → *Likely Dodge*: "Safety-critical components must be worst-case."  
  → **Follow-Up:** But if you exempt *any* subsystem from worst-case rigor, doesn’t that become the weak point? How do you avoid the composition tax *and* admit average-case is sometimes necessary?

  ---

  ### Why this works:
  - **Follow-ups target intellectual debt**: Each cuts through deflections to the core contradiction (composition, arbitrariness of threat sets, goal/env conflation).  
  - **Forces concrete definitions**: "What is your 𝜖-ball?", "Define your threat set", "Distinguish training/deployment guarantees".  
  - **Exploits tradeoffs**: Highlights practical absurdities (crippled systems) and circularities (AI designs your worst-case).  
  - **The squirm questions** are traps: #8 exposes non-falsifiability, #9 forces admission that worst-case can’t monopolize the solution space.  

  **Tactical note**: If they retreat to "It’s about *mindset*, not literal guarantees," hammer Question #4 ("Is worst-case just a vibe?"). Keep returning to: *What would you sacrifice, and what can you actually prove?*
