prompt: |-
  I'm leading a ninety-minute session of a graduate philosophy reading group on dialetheism and paraconsistent logic. Everyone is at home in classical first-order logic; nobody has looked at a non-classical consequence relation. Don't give me the material — plan how I should present it. Lay out the order the pieces must come in and why each depends on the last: what has to be in place before the phrase "true contradiction" can mean anything to them, and what the opening move has to be so that "inconsistent but not trivial" lands as a real distinction rather than a dodge. Choose the single example that carries the whole session — it has to be a case where they can feel the pull of accepting the contradiction, not a case that merely decorates a formalism — and tell me what that example must have and must lack; in particular, argue me into or out of letting the Liar carry it, since the Liar is the one case they have all met before. Then map the misconceptions they will form and the precise point in the sequence at which each should be headed off. I expect at least these: that paraconsistent logic just is the claim that contradictions are true; that dropping explosion licenses anything; that dialetheism is relativism or a refusal to criticize; and that the law of non-contradiction has simply been denied — and tell me where the paraconsistency/dialetheism distinction itself has to be planted so the rest does not keep collapsing into it. Finish with one question I can put to the group that would reveal whether they have grasped the difference between rejecting explosion and rejecting contradictions, and with what I should openly refuse to cover in ninety minutes.
reasoning: |-
  Okay, the user is leading a 90-minute grad philosophy session on dialetheism and paraconsistent logic. Everyone knows classical first-order logic but no non-classical systems. They need a structured plan that builds understanding step by step. The key challenges are making "true contradiction" meaningful and showing "inconsistent but not trivial" as a real distinction, not a dodge.

  First, I need to sequence the concepts carefully. Starting with classical logic's explosion principle (ex contradictione quodlibet) makes sense because it's familiar ground. The group already accepts that contradictions trivialize theories in classical systems. This sets up the core problem: how to handle inconsistency without collapse.

  The example choice is critical. The Liar Paradox is tempting—they've all seen it—but it might feel like a "trick." Instead, the Truth-Teller ("This sentence is true") seems better. It appears innocuous but creates a problem when combined with the Liar. This shows a real-world need for paraconsistency without relying solely on paradox shock.

  Where to place the dialetheism/paraconsistency distinction? Immediately after introducing paraconsistent logic as a formal tool, before discussing truth-value gluts. This prevents conflating the technical framework with the metaphysical claim. Emphasize that paraconsistency is about consequence relations, dialetheism is about what's true.

  Major misconceptions to preempt:
  1. "Paraconsistent logic = contradictions true" → crush this when defining paraconsistency
  2. "Dropping explosion allows anything" → demonstrate with a model where P and ¬P hold but Q doesn't
  3. "Dialetheism = relativism" → stress dialetheists reject some contradictions (e.g. "2+2=5")
  4. "Just denying LNC" → clarify it's about some contradictions, not all

  The diagnostic question: "Can a paraconsistent logician consistently reject all dialetheism?" If they get that the answer is yes, they've separated the framework from the truth claim.

  Must explicitly refuse covering: proof theory specifics, many-valued semantics details, advanced topics like logical pluralism. Stay focused on core conceptual shifts.

  Timing breakdown:
  - Explosion recap (10 mins)
  - Paraconsistency definition + simple model (15 mins)
  - Truth-Teller/Liar combo (20 mins)
  - Dialetheism distinction (10 mins)
  - Misconceptions + Q&A (20 mins)

  The Truth-Teller's advantage: it's not immediately paradoxical alone, creating a "contagion" problem only when combined with the Liar. This feels like a real theoretical cost rather than wordplay. When they see classical logic forcing them to accept both or neither as true—neither satisfactory—the dialetheic "both" solution gains intuitive traction.
answer: |-
  Here's a meticulously sequenced plan for your 90-minute session, designed to build understanding cumulatively while preempting key misconceptions. The structure ensures each concept *depends* on the prior step, making "true contradiction" meaningful and "inconsistent but not trivial" a tangible distinction.

  ---

  ### **Core Sequence & Rationale**
  **Total: 70 minutes** (leaving 20 for discussion/Q&A)

  1.  **Start with Classical Logic's Crisis Point (10 mins)**  
      *Focus:* **Explosion (Ex Contradictione Quodlibet):** ⊢ (P ∧ ¬P) → Q  
      *Why start here?* Everyone accepts this. Show how it makes inconsistency catastrophic. Use a toy example:  
      *"Suppose our theory contains 'Socrates is mortal' and 'Socrates is not mortal'. Classical logic says we can deduce '2+2=5'—or any Q. Inconsistency trivializes everything. This is why consistency is non-negotiable in classical frameworks."*  
      *Dependency:* This is the foundational problem paraconsistency solves.

  2.  **Introduce Paraconsistent Logic as Damage Control (15 mins)**  
      *Focus:* **Reject Explosion, not all inference rules.**  
      *Key move:* Define a consequence relation (⊢ₚ) where {P, ¬P} ⊬ₚ Q. Use a **concrete, finite model** (e.g., Priest's LP with a 3-valued semantics: true, false, both).  
      *Example:* Show a model where P = both, ¬P = both, Q = false. Stress: {P, ¬P} ⊬ₚ Q *without* assigning Q a value.  
      *Why here?* They must grasp that paraconsistency is a *formal tool* for *managing* inconsistency—**not yet** a claim about truth. Preempts "paraconsistency = dialetheism".  
      *Dependency:* Requires understanding explosion’s role in triviality.

  3.  **Present the Central Example: The Truth-Teller + Liar Combo (20 mins)**  
      *Why NOT the Liar alone?* The Liar (L: "L is false") feels like a "trick". Alone, it invites dismissal as pathological language.  
      *The Winning Example:* **The Truth-Teller (T): "T is true" paired with the Liar (L).**  
      *Why it works:*  
      - **Must have:** Inescapable inconsistency in classical logic. Assign T true? Then T says truly it's true—consistent. Assign T false? Then it falsely claims to be true—consistent. But L is paradoxical. Now combine: Classical logic *forces* T to be true *and* false to avoid arbitrariness, while L remains paradoxical. The contradiction "spreads" infectiously to a seemingly benign sentence.  
      - **Must lack:** Self-reference *alone* as the issue. T isn't paradoxical alone—it's the *system* (T + L) that generates unavoidable contradiction.  
      - **Pull of acceptance:** They feel the cost of classical choices: either reject classical semantics (arbitrarily deem T true/false) or accept inconsistency. Dialetheism emerges as *less* ad hoc.  

  4.  **Define Dialetheism (10 mins)**  
      *Focus:* **Some contradictions are true** (e.g., "T is true and false").  
      *Crucial distinction:* **Plant here: "Paraconsistency is the logic; dialetheism is the metaphysics."**  
      *Why here?* Now "true contradiction" has meaning: a sentence/proposition that is *correctly described* as both true and false, formalized in a paraconsistent framework. The Truth-Teller example provides the intuition.  
      *Dependency:* Requires paraconsistency to make "true contradiction" non-trivializing.

  5.  **Clarify Scope & Limits (10 mins)**  
      *Focus:* Dialetheism isn't "anything goes". Emphasize:  
      - Most contradictions are still false (e.g., "Socrates is mortal ∧ ¬mortal").  
      - Paraconsistent logics have *non-trivial* consequence relations; they reject explosion but keep most inferences (e.g., modus ponens).  
      *Why here?* Prevents "dialetheism = relativism" and "dropping explosion = license for nonsense".  

  6.  **Misconception Triage (5 mins)**  
      Actively dismantle these at precise points:  
      - **"Paraconsistency = contradictions true"**: *Head off at Step 2* when defining ⊢ₚ. Stress: "This is a formal system for safe reasoning *even if* contradictions exist—not a claim they do."  
      - **"Dropping explosion licenses anything"**: *Crush during Step 2/5* with the model showing {P, ¬P} ⊬ₚ Q. Ask: "Can we infer 'Socrates is a teacup'? No—the logic still has rules."  
      - **"Dialetheism = relativism/refusal to criticize"**: *Destroy at Step 5*: "Dialetheists reject *most* contradictions. They criticize unsupported claims—just not on the grounds that *all* contradictions *must* be false."  
      - **"Denial of LNC"**: *Clarify at Step 4*: "LNC says *no* contradictions are true. Dialetheists deny this universal claim—but accept its instances for *most* contradictions (e.g., '2+2=4 and not 4' is still false)."  

  ---

  ### **The Critical Diagnostic Question**  
  **"Can a paraconsistent logician consistently reject all dialetheism? Why or why not?"**  
  - *Reveals grasp of explosion vs. contradiction:* If they say **yes** (correctly!), they see paraconsistency as a tool for managing *potential* inconsistencies without endorsing them. If they conflate the two, they’ll say no.  

  ---

  ### **What to Refuse to Cover (Announce Upfront)**  
  - **Proof theory of paraconsistent systems** (e.g., sequent calculus for LP).  
  - **Advanced semantics** (e.g., Routley star, impossible worlds).  
  - **Other paraconsistent logics** (e.g., relevance logic, da Costa’s C-systems).  
  - **Objections/resolutions** (e.g., hierarchy solutions to Liar; this sidetracks into metaphysics).  
  *Justification:* "We’re focusing on the conceptual foundation: how 'inconsistent but not trivial' is possible, and what a 'true contradiction' could mean. Advanced formalisms and debates require another session."  

  ---

  ### **Why This Sequence Works**  
  The Truth-Teller+Liar combo forces a choice: accept arbitrariness (demoting T to "just false" without justification) or accept inconsistency. Paraconsistency (Step 2) makes the latter viable; dialetheism (Step 4) then rationalizes it. By delaying dialetheism until after paraconsistency is defined, you prevent collapse. The misconceptions are preempted at their point of likely emergence (e.g., denying explosion *immediately* triggers "so anything follows?"—smothered in Step 2 with the model). The diagnostic question isolates the logic/metaphysics split.  

  **Timing Buffer:** Strictly enforce 70 minutes for presentation. Use the remaining 20 for the diagnostic question, discussion, and clarifying misconceptions that arise.
