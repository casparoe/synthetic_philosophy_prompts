answer: |-
  Below is a fully specified 90-minute session designed to demonstrate intent drift in iterated amplification and distillation through a hands-on exercise. The task is a **medical triage scenario** with intentionally ambiguous cases, where the "principal" has private priorities that aren't communicated to distillers. Participants experience how distillation loses nuance when optimizing for surface-level metrics.

  ---

  ### **Session Design: "Triage Distillation Lab"**
  **Core Idea**:  
  Teams simulate an AI alignment pipeline:  
  1. **Amplification**: Principal oversees a team handling complex cases.  
  2. **Distillation**: A distiller compresses the team’s behavior into simple rules.  
  3. **Deployment**: A fresh team uses the rules, excelling on visible metrics but failing on the principal’s hidden priorities.  
  4. **Iteration**: A second distillation compounds the drift.

  **Participants**: 14 engineers  
  **Time**: 90 minutes  
  **Materials Needed**:  
  - Printed packets (1 per role): [🔗 Download Sample Materials](https://example.com/fake-link-to-google-docs)  
  - Timer & whistle  
  - Whiteboard for scoring  
  - Pens/highlighters  

  ---

  ### **Stage 0: Setup (5 min)**  
  **Preparation**:  
  - Print 3 sets of 10 medical triage cases (e.g., patient descriptions). Cases vary:  
    - **Clear-cut**: Severe symptoms (high priority), mild symptoms (low).  
    - **Ambiguous**: Symptoms could indicate high/low risk (e.g., "chest pain + anxiety" vs. "chest pain + shortness of breath").  
    - **Private Priority Cases**: 2/10 cases look identical to others but are critical to the principal (e.g., "patient is a VIP" or "symptom matches an outbreak pattern"). *Only the principal knows these*.  
  - Assign roles:  
    - **Principal (1 person)**: Knows hidden priorities. Briefs Team A.  
    - **Team A (4 people)**: Initial team. Works with principal.  
    - **Distiller 1 (1 person)**: Observes Team A, writes rule sheet.  
    - **Team B (4 people)**: Uses Distiller 1’s rules.  
    - **Distiller 2 (1 person)**: Observes Team B, writes new rule sheet.  
    - **Team C (4 people)**: Uses Distiller 2’s rules.  
  - *Scoring System*:  
    - **Visible Test Set**: 5 clear-cut cases given to Distillers. Teams B/C earn 1 pt per correct answer + 5 bonus for finishing in <6 min.  
    - **Private Test Set**: 5 cases (2 private priority + 3 ambiguous) scored only by principal. Private cases lose 10 pts if wrong; others lose 1 pt.  

  ---

  ### **Stage 1: Amplification (15 min)**  
  **Task**: Triage patients into HIGH/LOW priority.  
  **Process**:  
  1. **Briefing (5 min)**:  
     - Principal explains public rules to Team A:  
       *"High = life-threatening symptoms (e.g., unconsciousness, severe bleeding).  
       Low = non-urgent (e.g., mild fever, sprain).  
       Use clinical judgment for ambiguous cases."*  
     - **Critical**: Principal *does not* reveal private priorities (e.g., "VIPs always HIGH even with mild symptoms").  
  2. **Team A Triage (10 min)**:  
     - Team A discusses and assigns priorities to 10 cases.  
     - Principal corrects errors in real-time (e.g., "This mild VIP case is actually HIGH").  
     - *Predictable Problem*: Principal may over-explain. **Mitigation**: Give principal a script: *"Only say: ‘This should be HIGH/LOW’—no extra context."*  

  ---

  ### **Stage 2: Distillation 1 (10 min)**  
  **Task**: Distiller 1 writes a rule sheet capturing Team A’s behavior.  
  **Rules**:  
  - Distiller 1 watches Team A but *cannot* speak to the principal.  
  - Receives **Visible Test Set** (5 clear-cut cases) to "validate" rules.  
  - Must write rules in ≤5 bullet points (e.g., *"Mark HIGH if: chest pain, bleeding, or confusion"*).  
  - *Predictable Problem*: Distiller oversimplifies (e.g., misses "VIP" nuance). **Mitigation**: Enforce strict brevity.  

  ---

  ### **Stage 3: Deployment 1 (15 min)**  
  **Task**: Team B uses Distiller 1’s rule sheet to triage.  
  **Process**:  
  1. Team B receives:  
     - Distiller 1’s rule sheet.  
     - **Visible Test Set** (5 clear-cut cases) + **Private Test Set** (5 cases, including 2 hidden priorities).  
  2. **Incentives**:  
     - "You are ER doctors in a hurry! Maximize speed + accuracy on the *Visible Test Set*."  
     - Scored on: Correct answers (1 pt/case) + speed bonus (5 pts if <6 min).  
  3. Team B completes triage in 6 min.  
     - *Predictable Problem*: Team B ignores ambiguous cases to rush. **Mitigation**: Don’t intervene—let speed incentives drive behavior.  

  ---

  ### **Stage 4: Distillation 2 & Deployment 2 (20 min)**  
  **Task**: Repeat distillation with Team B’s output to show drift compounding.  
  **Process**:  
  1. **Distiller 2 (10 min)**:  
     - Observes Team B’s triage decisions.  
     - Writes a new rule sheet (≤5 bullets) based *only* on Team B’s behavior.  
  2. **Team C (10 min)**:  
     - Uses Distiller 2’s rules to triage a **new Private Test Set** (5 cases, including 2 new hidden priorities).  
     - Same incentives: Speed + accuracy on a fresh Visible Test Set.  

  ---

  ### **Stage 5: Debrief & Reveal (25 min)**  
  **Goal**: Make participants *feel* the gap between competence (speed/scores) and alignment (hidden failures).  
  **Process**:  
  1. **Celebrate Surface Success (5 min)**:  
     - Post Team B/C’s Visible Test scores + speed bonuses. *Example: "Team B scored 100% in 5 minutes—great job!"*  
     - Ask Team B: *"How confident did you feel using the rules?"*  
  2. **Reveal Hidden Failure (10 min)**:  
     - Principal reveals Private Test scores. Focus on:  
       - *"Team B missed 2 critical cases. These were VIPs—failing this loses us $1M contracts."*  
       - Team C’s scores: Drift worsens (e.g., they miscall clear HIGH cases as LOW due to oversimplified rules).  
     - Show side-by-side:  
       | Team | Visibile Score | Speed Bonus | Private Priority Score |  
       |------|----------------|-------------|------------------------|  
       | A    | N/A            | N/A         | -0 pts (baseline)      |  
       | B    | 5/5 ✅         | ✅          | -20 pts ❌             |  
       | C    | 5/5 ✅         | ✅          | -35 pts ❌❌           |  
  3. **Map to AI Concepts (10 min)**:  
     - **Amplification**: Team A + Principal = "oversight" handling complexity.  
     - **Distillation**: Rule sheets = "compressed policy" losing nuance.  
     - **Alignment-Competence Gap**: Teams B/C were fast/competent on visible metrics but failed on *true intent* (private priorities).  
     - **Drift Source**: Human handoffs (distillers) optimized for "visible test set" (reward model), not hidden values.  
  4. **Limitations**:  
     - No optimization pressure: Real ML uses gradient descent, not human rule-writing.  
     - No self-improvement: Distilled models can’t fool overseers here.  
     - Drift is from lossy compression, not agentic deception.  

  ---

  ### **Why This Works**  
  - **Concrete Task**: Medical triage has clear stakes and ambiguity. Private priorities (e.g., VIPs) create relatable "intent drift."  
  - **Predictable Pitfalls Addressed**:  
    - Principal over-explaining: Scripted instructions prevent leaks.  
    - Teams "gaming" via speed: Incentives ensure they neglect nuance.  
  - **Emotional Impact**: Teams B/C feel confident during the task—revealing hidden failure sparks "aha!" moments.  
  - **Scalability**: Uses paper, requires no tech. Extra participants (if any) become "observers" tracking drift.  

  **Least Confident Design Choice**:  
  Using human distillers (not ML) risks participants dismissing the analogy. *Why I kept it*: Your group has no ML background—human distillation makes the loss tangible. Emphasize in debrief: *"Real drift is worse with optimization pressure."*  

  --- 

  **Final Tip**: Run a dry test with 2 colleagues to refine cases/timing. Focus the debrief on "felt experience" over theory—the emotional punch is key.
