  The standing requirement will treat lineal descent as a simple paperwork matter, ignoring the moral complexities. The uptake clause will be phrased as considerate concern for the recipient's feelings while functionally making them responsible for closure. For classification, I'll create cold bureaucratic distinctions between "regrettable" and "atrocity" categories that neatly sidestep historical context.

  I'll emphasize the compensation firewall by cheerfully noting the unstaffed Remediation desk. Liability protection will be baked into the apology templates through passive constructions. The eligibility window will be demonstrated through a worked example that shows how a 1830s case gets rejected while a 1970s case proceeds.

  Throughout, I'll maintain a neutral civil service register with subtle bureaucratic euphemisms. The humor will emerge from the contrast between the warm language ("sensitivity," "understanding") and the cold functionality of the system. I'll avoid any real historical references to keep it universal while ensuring the satire lands for both those familiar with state apology literature and general readers.
answer: |-
  ## NATIONAL OFFICE OF HISTORICAL APOLOGIES (NOHA)
  **Internal Staff Handbook: Volume IV – Case Assessment & Delivery Procedures**
  **Section 7.2: Determining Entitlement and Apology Tier Classification**

  **7.2.1 Scope & Purpose**
  This section provides definitive operational guidance for Case Officers (COs) in assessing eligibility for historical state apologies and determining the appropriate tier of apology to be issued by the National Office of Historical Apologies (NOHA). Adherence ensures consistency, procedural integrity, and alignment with the NOHA Mandate (Statutory Instrument 78-451).

  **7.2.2 Foundational Eligibility Criteria**
  *   **(a) Living Claimant:** An apology may only be issued to a *living individual*. NOHA does not issue apologies to deceased persons, groups, collectives, or symbolic entities.
  *   **(b) Lineal Descent:** The claimant must demonstrate direct, documented lineal descent from the individual(s) identified as the primary wronged party/parties in the verified historical incident. Standard Form H-7a (Lineal Descent Affidavit), accompanied by two independent verifiable proofs (e.g., birth certificates, census records, parish registries), constitutes sufficient documentation. COs should process Form H-7a with routine diligence.
  *   **(c) Temporal Eligibility Window:** The referenced historical incident must have occurred within the defined Temporal Eligibility Window. This window is currently set at events occurring **no earlier than 1 January 1900**. Incidents predating this cut-off are deemed outside NOHA's operational remit due to complexities of historical attribution and resource prioritisation.
      *   *Worked Example:* Claimant A alleges displacement during the "Western Clearances" (c. 1830s). Claimant B alleges displacement during the "Green Valley Resettlement" (c. 1970s). Claimant A’s case falls outside the Temporal Eligibility Window (pre-1900) and must be closed with Code 47-E (Outside Scope/Temporal). Claimant B’s case falls within the Window and proceeds to full assessment. Communicate Code 47-E decisions **with sensitivity** using Template Letter L-12 ("Acknowledgement of Contact - Scope Limitations").

  **7.2.3 Historical Act Classification**
  Prior to tier determination, COs must classify the verified historical act into one of two categories:
  *   **(a) Regrettable Consequence (RC):** Actions undertaken by the state or its agents that were **lawful and widely accepted according to prevailing societal norms and legal frameworks at the time**, but which resulted in outcomes now recognised as harmful or unjust. RC classification typically correlates with Tier 1 or Tier 2 apologies.
  *   **(b) Atrocity (A):** Actions undertaken by the state or its agents that constituted **egregious violations of fundamental ethical principles and/or legal norms *even by the standards broadly accepted at the time***. A classification typically correlates with Tier 2 or Tier 3 apologies.
  *   *Assessment Guidance:* Classification relies on contemporaneous evidence (laws, official records, mainstream media, scholarly consensus of the period). Avoid retrospective application of modern ethical standards as the primary determinant for RC classification; focus on the act's relationship to its *own* historical context. The "widely accepted" criterion for RC refers to dominant societal/legal views, acknowledging these may exclude marginalised perspectives.

  **7.2.4 Apology Tier Determination**
  Based on the Historical Act Classification (7.2.3) and the severity/duration of harm, COs shall assign one of three Tiers:
  *   **Tier 1: Acknowledgement of Fact (AoF)**
      *   *Content:* A formal written statement confirming the occurrence of verified historical events and the state's involvement or context. Does not express regret or apology. Uses passive/state-contextual voice (e.g., "It is acknowledged that these events took place," "Circumstances arose where...").
      *   *Applicability:* Primarily for RC-classified acts, or where evidence for intent or widespread contemporaneous condemnation is insufficient for higher tiers. Requires CO sign-off and Section Head approval.
  *   **Tier 2: Expression of Profound Regret (EPR)**
      *   *Content:* Builds on AoF. Expresses sincere regret, sorrow, or sadness for the suffering, hardship, or loss experienced by the affected individuals/communities as a result of the historical events. Uses empathetic language but avoids the word "sorry" or direct admission of fault (e.g., "The Government expresses its profound regret for the hardship endured," "It is deeply regrettable that these circumstances led to...").
      *   *Applicability:* Common for most A-classified acts and significant RC-classified acts. Requires CO sign-off and Director-level approval.
  *   **Tier 3: Full Apology (FA)**
      *   *Content:* The highest level of recognition. Includes AoF and EPR elements. Explicitly uses the word "apologise" or "sorry" directed at the claimants and/or the affected group. Maintains passive/contextual voice regarding state responsibility (e.g., "The Government apologises for the wrongs that occurred," "We are sorry for the suffering caused by these past actions").
      *   *Applicability:* Reserved for the most severe, well-documented A-classified acts demonstrating clear state culpability against *contemporaneous* norms. **Requires Ministerial sign-off. Note:** Ministerial approval is a distinct process and is **rarely forthcoming**. COs should manage claimant expectations accordingly during initial contact (Phase 1). Requires Director recommendation and submission via Form M-1A (Ministerial Apology Request).

  **7.2.5 Delivery & Uptake Requirement**
  *   An apology (any Tier) is only considered **officially delivered and procedurally closed** upon receipt of formal, written acceptance from the claimant using Form A-9 (Apology Acceptance).
  *   The claimant's perspective on the apology's meaningfulness is paramount. COs must present the apology sensitively, allowing space for the claimant to process it. Template cover letters (Series L-20) emphasise that acceptance is a **personal step towards reconciliation** and closure for the claimant, and that NOHA values their acknowledgment as the final step in this shared process. Follow-up Protocol F-6 outlines respectful engagement if acceptance is delayed or withheld.

  **7.2.6 Compensation & Liability Firewall**
  *   **(a) Strict Separation:** NOHA's remit is exclusively symbolic and reconciliatory. **Matters of financial compensation, restitution, or ongoing remediation are categorically outside NOHA's scope.**
  *   **(b) CO Directive:** Under no circumstances shall a CO initiate discussion of compensation, imply entitlement to compensation exists, or suggest that an apology creates any such entitlement. If a claimant raises compensation:
      1.  Politely but firmly state: "The National Office of Historical Apologies handles acknowledgements and apologies for past events. Matters concerning financial compensation are managed by a separate government function."
      2.  Provide the claimant with the contact details for the **Remediation and Restitution Desk (RRD), Central Treasury Department:** Phone: 555-0100-RRD (Ext. 882). *Handbook Note: As of last verification, Ext. 882 remains temporarily unstaffed pending departmental restructuring. Claimants are advised to contact the RRD main line.*
      3.  Log the inquiry using Code 89-C (Compensation Redirected) and proceed with the apology process if eligible.
  *   **(c) Liability Protection:** All NOHA apology templates (Tiers 1-3) are drafted to **explicitly avoid admitting legal liability or creating precedent for legal claims.** Language focuses on the occurrence of events, the experience of harm, and contemporary perspectives. The state is never the active subject of wrongful verbs in the past tense. The phrase "while acknowledging the past, this apology does not constitute an admission of legal liability" is included in all Tier 2 and 3 cover letters.

  **7.2.7 Summary Workflow**
  1.  Verify Living Claimant & Lineal Descent (H-7a).
  2.  Confirm Temporal Eligibility (Post-1900).
  3.  Classify Historical Act (RC or A).
  4.  Determine Apology Tier (1, 2, or 3) based on Classification and severity.
  5.  Draft appropriate apology using approved templates.
  6.  Secure required approvals (Section Head, Director, or Minister as per Tier).
  7.  Deliver apology package with empathetic cover letter (L-20 series).
  8.  Await and log Formal Acceptance (Form A-9).
  9.  Close case. If compensation raised, redirect to RRD (555-0100-RRD, Ext. 882) and log Code 89-C.
