  I'm a novelist — literary fiction, two books out, no math to speak of. I've been reading GEB and I can't stop chewing on Hofstadter's central move: Gödel's self-referential sentences, and the leap from a system that can talk about itself to a mind that's aware of itself. I want you to restate that whole move in the vocabulary I actually think in — frames and embedded stories, mise en abyme, unreliable narrators, a character who starts to suspect she's in a story, a narrator who turns into a character, foreshadowing that makes the book feel like it knows about itself. Do the translation as faithfully as you can, then give me the residue report: what carried over cleanly, what only carried over because you fudged it, and what has no expression in my toolkit at all. My hunch is that self-reference is basically free for me and brutally expensive for Godel, which would make the analogy a lot weaker than it sounds — tell me if I'm wrong about that, and whether whatever's left over is my vocabulary's fault or the argument's.
