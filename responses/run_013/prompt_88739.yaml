  I've been going back and forth on whether imprecise credence is a real state of opinion or a philosopher's dodge, and I want your actual number, not a tour of the literature. The claim I'm asking about: a rational agent's opinion about some P can be genuinely spread out, so that the best description is 'her credence in P is somewhere in [0.3, 0.7] and no point in that interval is more hers than the rest', and this is distinct from both (a) a precise credence she hasn't bothered to inspect and (b) a family of precise credences she'd bet from under different circumstances. What's your credence that the spread-out option is real and distinct? Decompose it: how much rides on whether credence is by definition just whatever your betting dispositions are, how much on whether the unknown-odds urn cases show anything beyond ordinary risk aversion, how much on whether range-users can be pushed into something that looks like inconsistency (their range widening after learning something that ought to be irrelevant), how much on whether the spread ever makes a difference to what it's rational to do rather than being epiphenomenal, and whatever else you think belongs -- a number and one line for each, then the combination. Then tell me which term is doing most of the work and what arguemnt or piece of evidence would shift it most.
