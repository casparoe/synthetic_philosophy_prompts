prompt: |-
  OK so something's been bugging me about the mech interp scene, which I follow pretty closely. The standard move goes like this: you train a linear probe on some layer, or find a direction, and if the probe decodes "this is a sentence about a country's capital" at 94%, or if adding a Golden Gate Bridge direction makes the model shoehorn the bridge into every answer, everyone says the model *represents* that concept, has a "feature" for it, and that the sparse autoencoders (the things people use to chop activations into features) are getting closer to the model's actual ontology — what it "really thinks in". Then the same people, when pressed, go all deflationary: obviously it's just matrices, there's no little homunculus in there, "representation" is a useful fiction, features aren't real, we're doing engineering not psychology. Meanwhile someone in the replies always points out you can train a probe on random labels and still get high accuracy, which sure seems like it should matter, and that you can rotate the residual stream without changing the function at all, so which basis is "the" features?

  So what does the practice actually presuppose about representation? Which views does it quietly rule out? Is there a coherent realism about features that survives the arbitrariness point and the control-task point, or is the day-to-day work really committed to something deflationary that nobody wants to say out loud? Don't give me a survey — take a side. Tell me what the workflow strictly needs vs. what it merely fits nicely with, say where it's underdetermined, and what would brake if you swapped the presupposed view out. Give me your confidence on your own verdict too.
reasoning: |-
  Okay, the user is deeply involved in the mechanistic interpretability scene and has noticed a tension in how practitioners talk about features. They point out that researchers often act as if features are real—like when a probe decodes a concept with high accuracy or a direction injection alters outputs predictably. But when questioned, these same people retreat to a deflationary stance: it's just matrices, no homunculus, features aren't "real" in a philosophical sense. The user also brings up two strong counterarguments: the random label probe accuracy issue and rotational invariance, which challenge the uniqueness of these features.  

  Hmm, the user isn't just asking for clarification—they're frustrated with the inconsistency. They want someone to cut through the waffling and take a stance. They reference specific technical points (random label probes, basis rotations) so they're clearly knowledgeable. Their deeper ask seems to be: "Is there *any* coherent realism left after these objections, or is everyone secretly playing pretend?" They also want to know what the field's workflow *actually* commits to, pragmatically versus philosophically.  

  Right, let's unpack this. First, the random label probe problem isn't a total knockout—it's more about overfitting. If you train a probe on *random* labels for a task, you might get high accuracy by memorizing noise, but that probe won't *generalize* to new data. So the key is generalization: a probe that works on held-out data suggests the concept is *reliably present* in the activations. That's why practitioners care about test sets.  

  Then there's rotational invariance. Yes, the residual stream's basis is arbitrary—you can rotate it without changing the model's outputs. But this doesn't mean *all* bases are equal. Some bases align with how the model *uses* the information. For example, if a direction in one basis linearly triggers a behavior (like outputting a capital city), and that direction stays meaningful across contexts, that's pragmatically "real" for the model's internal logic. The "natural" basis might be the one where features are functionally independent or sparse.  

  So what does the workflow *strictly* need? At minimum, it assumes that (1) human-legible concepts *can be approximated* by directions in activation space, and (2) these directions have causal power over outputs (e.g., via patching or steering). That's non-negotiable—if probes didn't correlate with model behavior, or if steering didn't work, the whole approach would collapse.  

  But the workflow doesn't strictly need "features-as-atoms"—it could live with "features-as-useful-projections." The sparse autoencoder (SAE) push *does* lean toward realism though, because finding features that are monosemantic (one concept per feature) and interpretable across contexts suggests they're not *just* arbitrary slices. If SAEs find the same features across models or layers? That’s a hint they’re tapping into something stable.  

  What would "brake" if we swapped views? If you adopted full deflationism ("features are *only* user fictions"), you’d lose motivation to find *better* decompositions—why care if one basis is sparser? But practitioners *do* care, because sparsity correlates with interpretability and generalization. Conversely, naive realism would break when features are polysemantic or context-dependent—hence the hedging.  

  My verdict: The field is quietly committed to *functional realism*. Features are "real" in the sense that they’re stable, causal nodes in the model’s computational graph—not because they’re Platonic, but because they’re *how the model does its job*. The deflationary disclaimers are armor against overclaiming, but the practice bets on features being more than fiction. Confidence: 85%. The random-labels/rotation points are real, but they’re constraints—not fatal. The workflow survives because it *works*.
answer: |-
  You're hitting the nerve-center of mech interp's philosophical tension. The field *acts* realist but *talks* deflationist. Here's my take—no hedging—on what the practice **strictly requires**, what it **sneakily assumes**, and where it would break:

  ### The Non-Negotiables (What the Workflow *Strictly* Needs)
  1. **Conceptual Grounding in Activation Space**:  
     That human-legible concepts (like "capital city" or "Golden Gate Bridge") can be *reliably approximated* by specific directions/subspaces in the model's activations. If linear probes failed *everywhere*, the field wouldn't exist.  

  2. **Causal Leverage**:  
     That manipulating these directions (via patching, ablation, or steering) predictably alters model behavior. If injecting a "bridge vector" didn't cause bridge hallucinations, the realism would collapse.  

  3. **Generalization Beyond Probes**:  
     That probe accuracy isn't *just* overfitting. High test accuracy matters, but the *real* test is whether the direction explains *unprobed* behaviors (e.g., if "capital direction" activates during geopolitical reasoning).  

  ### The Quiet Commitments (What the Workflow *Sneakily* Assumes)
  1. **Functionally Aligned Basis**:  
     While rotation invariance proves no basis is ontologically privileged, the workflow assumes there exists a basis where **features align with model computation**. Sparse autoencoders (SAEs) hunt for this basis—where features are:
     - **Monosemantic** (one clear concept per feature)
     - **Sparse** (few features active per input)
     - **Causal** (ablation changes outputs)  
     If SAEs found no better basis than a random rotation, their pursuit would be pointless. But they *do* find interpretable features—implying the model *prefers* certain decompositions.  

  2. **Feature Stability**:  
     The practice assumes features persist across contexts. If the "Golden Gate Bridge" direction only worked in one prompt, it wouldn't be a "feature". Stability across inputs suggests it's wired into the model.  

  3. **Reality of Superposition**:  
     That polysemantic neurons aren't noise—they're the model compressing features into a low-dimensional space. SAEs "disentangle" this, implying the compressed features are *real but buried*.  

  ### Where Deflationism Doesn't Hurt (The Underdetermined Zone)
  - **Probes as Tools**: You can treat probes as "just useful predictors" without believing features are "real". The random-labels critique is defused by **generalization tests**: a probe trained on *real* labels that works on *held-out data* suggests the concept is *in the activations*, not the probe.  
  - **Basis Relativity**: Features can be "real relative to a computational role". The "capital city" direction is real *because the model uses it to compute answers*. Rotation invariance doesn't kill this—it just says equivalent bases exist, but the *functionally relevant* one is privileged by the model's *weights*.  

  ### What Would Break the Workflow
  If **any** of these were true, mech interp would collapse:
  - **Total Basis Arbitrariness**: If *no* sparse/interpretable basis existed (SAEs failed; all features were inseparable linear soups).  
  - **Probes as Pure Parroting**: If probe accuracy *only* reflected the probe's complexity, not activations (but causal interventions disprove this).  
  - **Radical Context-Dependence**: If every input required a *new* basis (no cross-context feature reuse).  

  ### My Verdict: Functional Realism
  The practice is committed to **features as causal, stable computational primitives** in the model's algorithm. Not "Platonic ideals", but *real patterns* the model uses to solve tasks.  
  - **Why?** Because SAEs find similar features across models/layers; steering vectors work *zero-shot*; ablation cripples specific capabilities.  
  - **The deflationary disclaimers?** Armor against naïveté. When pressed, researchers retreat to "it's just math" to avoid overclaiming. But their *actions* bet on features being "real" in the sense that **they are the gears the model relies on**.  

  **Confidence**: 85%. The random-labels/rotation points *constrain* realism but don't kill it. If SAEs stopped finding cross-model interpretable features, I'd drop to 50%. But today, the workflow *needs* features to be more than fiction—it needs them to be **the model's ontology**.  

  **TLDR**: Mech interp is realist in practice, deflationist in rhetoric. It assumes features are real computational units, and would break if they were arbitrary or epiphenomenal. The hedging? Fear of philosophy.
