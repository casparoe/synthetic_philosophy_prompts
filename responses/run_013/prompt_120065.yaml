  Therefore, the receiver cannot relate the pattern to any structure; only to structures that fit the pattern within the system.

  For example, in English, the word "dog" can be interpreted as a canine animal, but not as a fruit, because that's not how the language works. If someone interprets it as a fruit, they are not using English correctly; they might be mistaken or using a different code.

  So there is a fact of the matter about what it means in a given language.

  The meaning is relative to a language system, but within that system, it's constrained.

  Premise (4) is about the message not carrying interpretation, but the language system provides the interpretation framework.

  For a specific message, the interpretation depends on the language.

  The receiver brings knowledge of the language, which is not arbitrary.

  Therefore, (5) is wrong: the pattern does constrain the relating because the receiver's structures are designed to map patterns to meanings in systematic ways based on shared rules.

