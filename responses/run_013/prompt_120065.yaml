  But the argument doesn't mention intention. Perhaps the flaw is that it ignores the role of the sender or the communicative context.

  Premise (2) says "meaning appears only when something at the receiving end," but meaning might also involve the sending end. In communication, meaning is often thought of as what the sender intends to convey, and the receiver interprets it.

  But intentions are not in the text; they are in the mind.

  Still, for the receiver to grasp the meaning, they need to infer the intention based on context.

  This is getting into philosophy of language.

  I recall Grice's theory of meaning, where meaning involves intention and recognition of intention.

  But in this argument, it's all about the receiver.

  Perhaps the constraint comes from the purpose of the communication.

