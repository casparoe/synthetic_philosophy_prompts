  So for (6), it's not that there is no fact of the matter; there is a fact relative to the interpretive community or language game.

  But the user might not like relativism either.

  The argument seems to lead to radical subjectivism, but in practice, we have objectivity through shared practices.

  To answer the user's questions: the slide occurs at step (5), where it assumes that if meaning comes from the receiver, it must be unconstrained. But that's not true; the receiver is constrained by their cognitive and social context.

