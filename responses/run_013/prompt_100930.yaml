prompt: |-
  I'll try to keep this short but I think it needs a bit of setup. I work in local government and I keep noticing a shape of thing that I don't have a word for, and it's bugging me. A number gets adopted because it tracks something we care about — "potholes fixed within 30 days" as a stand-in for "the roads are in decent shape," that kind of thing. For a couple of years it works fine. Then the number stays great and the roads quietly get worse underneath it, and the strange part is that nobody is cheating. Nobody's gaming it, nobody's cooking the books, everyone is doing exactly what they said they'd do. The number still gets reported, everyone still feels good about it, and the thing it was supposed to stand for has drifted away while the number sat there looking healthy. Me and a colleague had another one from her old job: a hospital's "time to first antibiotic" for suspected sepsis was a perfectly good proxy, it went up and up year after year, and meanwhile the thing you'd actually care about — do septic patients survive — barely moved, because what counted as a suspected case had quietly widened. So it's not corruption of the measure. It's the measure slowly detaching from the thing it measures, while everyone keeps trusting it because it has a good track record.

  I'm not after a reading list or citations, I just want to know if this specific failure has a name. It's obviously in the neighbourhood of Goodhart and of Campbell, but those both feel like they're about people responding to a target or an incentive, and in my cases the incentive isn't really doing the work — the world moved and the measure didn't. So: if there's an established term, tell me which of the nearby ones fits my cases best and where each of the others breaks down against them. If there isn't one, coin one, define it, and give me the edges — what has to be true for it to be this rather than plain Goodhart, and one case that sits right on the boundary between the two. I'd honestly rather have the carving than the label. Please keep it under 350 words.
reasoning: |-
  Okay, the user works in local government and has observed a recurring issue where a metric starts as a good proxy for something important but gradually becomes disconnected over time, even without anyone intentionally gaming it. They mentioned examples like "potholes fixed within 30 days" no longer reflecting road quality and "time to first antibiotic" for sepsis not correlating with survival rates anymore. 

  The user explicitly says they're not looking for academic references but wants to know if this specific phenomenon has a name. They're aware of Goodhart's Law and Campbell's Law but feel those focus on incentive-driven distortion, whereas their cases involve passive drift without malicious intent. 

  Hmm, this is interesting because the distinction matters. In Goodhart's classic formulation, people actively optimize the metric because it's tied to rewards or penalties. But here, the metric decays passively due to changing contexts or definitions while everyone keeps trusting it based on historical validity. 

  The closest existing concept might be "indicator decay," but that's not widely established. Alternatively, "proxy erosion" captures the slow detachment they describe. Need to define the boundaries clearly: For this to be proxy erosion rather than Goodhart, three conditions must hold: (1) No active manipulation occurs, (2) The original causal link weakens due to external shifts, and (3) Institutional inertia maintains trust in the outdated metric. 

  A boundary case would be ambulance response times: If dispatchers start classifying fewer calls as "urgent" to hit targets, that's Goodhart. But if "urgent" criteria legitimately broaden due to new medical guidelines while response times stay stable, that's proxy erosion—survival rates might drop even as the metric looks healthy. 

  The user's frustration with semantic gaps in governance jargon feels palpable. They'd probably appreciate the precision of carving out this subtype rather than getting a forced label. Also worth noting their examples show systemic observation—this isn't a one-off glitch but a structural vulnerability in how bureaucracies track performance.
answer: |-
  This is **Proxy Erosion** (or **Indicator Decay**).

  Here's the carving:

  1.  **Core Mechanism:** A proxy metric *passively* loses its validity over time due to changing context, definitions, scope creep, or shifting underlying realities. The link between the proxy and the underlying goal weakens or breaks.
  2.  **Key Distinction from Goodhart/Campbell:** There is **no active gaming or perverse incentive response driving the disconnect.** The problem is *inertia* and *unnoticed drift*. The measure becomes a ritualistic artifact while the world changes around it. People aren't optimizing the metric; they're failing to notice it no longer optimizes the *goal*.
  3.  **Essential Conditions for Proxy Erosion:**
      *   **Initial Validity:** The metric *was* a good proxy.
      *   **Passive Drift:** The disconnect arises from environmental/contextual shifts, definitional creep, or technological/practice changes *not* driven by attempts to manipulate the metric.
      *   **Institutional Inertia:** Continued reporting and trust in the metric based on its *past* validity, despite the drift.
      *   **Absence of Malice:** No deliberate manipulation of inputs, processes, or reporting to hit the target.

  **Boundary Case with Goodhart:**

  *   **Pure Proxy Erosion (Your Cases):** The definition of "suspected sepsis" widens *for legitimate clinical reasons* (e.g., new guidelines, broader diagnostic tools), unintentionally decoupling "time to first antibiotic" from actual sepsis survival rates. The metric wasn't *targeted*; the context changed.
  *   **Goodhart-Corrupted Boundary:** Ambulance services target "response time to Category A calls". Over time, dispatchers subtly (and perhaps even semi-consciously) reclassify more borderline cases as lower priority (Category B) to meet the Category A target, *without changing official definitions*. This *is* active adaptation to the incentive, blurring into Goodhart. The key is whether the scope/classification change is *driven by the target* or by independent factors.

  Proxy Erosion describes the quiet, often unintentional, obsolescence of a measure in a changing world, where the ritual of measurement outlives its meaning.
