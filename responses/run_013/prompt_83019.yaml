prompt: |-
  My friend and I spent most of yesterday evening arguing about the paradox of deontology — whether it can ever be right to do something wrong in order to prevent a larger number of wrongs of the same kind — and we went to bed at two in the morning no further forward than when we started. What I want from you is not a verdict on the debate itself but a prediction about her, together with an account of the rule she is really running. She is not a philosopher by trade, but she is unusually consistent, and over the years she has given me firm verdicts on the following.

  - Killing one healthy patient and distributing his organs to five patients who will otherwise die: wrong.
  - Diverting a runaway trolley onto a side track, where it kills one person and saves five: permissible.
  - Pushing a large man off a footbridge into the trolley's path in order to stop it: wrong.
  - Diverting the trolley into a closed loop, where it is halted by striking a person who happens to be standing there; his death is foreseen but not intended, and it is his body that does the halting: wrong.
  - Killing one innocent person, where that is the only way to stop five other people from each committing one murder: wrong.
  - The same case, with a hundred murders prevented rather than five: wrong.
  - Killing a person who is at that moment about to kill five others: permissible.
  - Lying to a would-be murderer about where his intended victim is hiding: permissible.

  I had assumed she was simply tracking what is intended as against what is merely foreseen, until the fourth case, which she calls wrong even though the death there is foreseen and not intended.

  The case she has not yet ruled on is this. A person I shall call the Broker has arranged matters so that, unless I kill one innocent stranger, ten thousand people — each of them unknown to me, none acting on any instruction of mine, and none of them yet culpable of anything — will each commit one murder over the coming year. The Broker will not do any of the killing himself, cannot be identified, and cannot be stopped; the only thing available to me is to kill the stranger. If I kill her, the arrangement dissolves and none of the murders occurs. Assume also that the situation is unique, secret and unrepeatable: it will never recur, nobody will ever learn what I did, and my action cannot become a precedent or be imitated. The stranger is innocent, does not consent, and is not otherwise doomed.

  What I would like from you: her verdict on that case, and how confident you are of it; the candidate rules that fit the eight verdicts above, and what each of them predicts here; which rule she is most likely running, and why; an honest statement of where the record leaves the new case genuinely undetermined; and the further case, ideally one I can actually put to her, that would settle it. I can see that she is some kind of deontologist, but I cannot tell whether what she is doing is a means principle, a doctrine of double effect, a threshold view, or something else again, so please work that out rather than asking me. And please do not tell me what a deontologist is supposed to say; tell me what she will say, and why.
reasoning: |-
  Okay, I need to figure out what this user's friend will say about the Broker case. Let me start by listing all the cases and her responses:

  1. **Killing one to save five (organ harvesting):** Wrong.
  2. **Trolley diverting to kill one, save five:** Permissible.
  3. **Pushing man off footbridge:** Wrong.
  4. **Diverting trolley to a loop where it kills one (death foreseen, not intended):** Wrong.
  5. **Killing one to stop five murders:** Wrong, even with 100 prevented.
  6. **Killing an aggressor about to kill five:** Permissible.
  7. **Lying to a murderer:** Permissible.

  The user thought she might be using the Doctrine of Double Effect (DDE), but case 4 complicates that because the death is foreseen but not intended, yet she still says it's wrong. So DDE alone doesn't fit. 

  Now, looking at case 4: diverting the trolley into a loop where it hits someone to stop it. The death is a side effect, not the means, but she still says it's wrong. That suggests she cares about using a person's body as a means, even if not intended. 

  Case 3 (pushing the man) is wrong because it's using him as a means. Case 2 (diverting the trolley) is permissible because you're not using anyone as a means; you're just redirecting a threat. 

  Case 6 is killing an aggressor, which is permissible because it's self-defense or defense of others. Case 7, lying to a murderer, is also permissible, maybe because it's preventing harm without directly harming.

  The Broker case involves killing an innocent stranger to prevent 10,000 murders by others. The key points: the stranger is innocent, not consenting, and the Broker's arrangement means the murders are caused by others independently. 

  Possible rules she might be using:
  1. **Means Principle:** You can't use an innocent person as a means. In the Broker case, killing the stranger is using her as a means to prevent the murders. So she'd say it's wrong.
  2. **Aggressor Exception:** Only permissible harm is against aggressors. The stranger isn't an aggressor, so killing her is wrong.
  3. **Intended/Foreseen Distinction:** But case 4 shows foreseen harm isn't enough; it's still wrong. So intention alone isn't the key.
  4. **Threshold Deontology:** Maybe after a certain number, it's permissible. But she said no to killing one to stop 100 murders, so probably no threshold.

  Case 5 and 6 show that even preventing 100 murders by killing an innocent is wrong. The Broker case is similar, but the murders are committed by others. Is that different? In case 5, the five would-be murderers aren't aggressing at the moment, but in case 6, the aggressor is about to kill, so it's permissible. 

  The Broker's victims are not currently aggressing; they're going to commit murders in the future. So they're not immediate threats. That might make a difference. Killing the stranger prevents future, non-imminent harm by third parties. Since she rejected case 5, which is similar, she'll likely say the Broker case is wrong too.

  But why is case 4 wrong? Because the person's body is used to stop the trolley, even if death isn't intended. So using someone as a means without consent is prohibited. In the Broker case, killing the stranger is directly using her life as a means to save others. So it should be wrong.

  The user wants a test case to confirm. What's a scenario that distinguishes between means principle and aggressor exception? For example, if there's a situation where you have to use an innocent as a means but against an aggressor. But the aggressor exception already covers that. 

  Another test case: Suppose you can stop a trolley by pushing a button that shifts the track, but it causes a rock to fall and kill someone as a side effect (not using them as a means). If she says that's permissible, it aligns with DDE but without the means aspect. But in case 4, the person's body is used, so it's different. 

  The further case could be: Killing someone whose death would automatically disable a bomb set by an aggressor, but without using their body. If death is a side effect, maybe permissible? But in Broker, it's direct killing. 

  A better test: Suppose the only way to stop an aggressor is to use an innocent person as a shield. She would probably say that's wrong, even against an aggressor. Case 6 was killing the aggressor directly, which is permissible. Using an innocent shield involves using the innocent as a means. So if she says that's wrong, it confirms the means principle over just aggressor exception.

  In the Broker case, since the stranger is used as a means, she'll say it's wrong. Confidence is high because of cases 1,3,4,5,6 all prohibit using innocents as means or direct harm to innocents for greater good, except when harming an aggressor directly.
