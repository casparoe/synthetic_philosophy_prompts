answer: |-
  Here's a desiderata list for a theory of punishment, built from your points and expanded. Each requirement is stated neutrally, accompanied by the core case or consideration that necessitates it, and why it matters. This is the "test suite" any serious theory must handle.

  **The Punishment Theory Desiderata**

  1.  **Conceptual Demarcation:** The theory must distinguish *punishment* from other state (or non-state) impositions of hardship that resemble it.
      *   **Case/Consideration:** Quarantine (public health), Civil Commitment (dangerousness post-sentence), Regulatory Fines/Fees (cost internalization), Corporate Penalties (entity vs. individual), Sanctions (state vs. citizen), Parental Discipline (private authority), Vigilantism (unauthorized force), Self-Penance (self-inflicted), Posthumous Sanctions (stripping honors).
      *   **Why it Matters:** Without clear boundaries, the concept becomes meaningless. Is detaining a typhoid carrier "punishment"? Is grounding a child fundamentally the same as imprisonment? The justification for *punishment* hinges on this distinction. If civil commitment is punishment, it demands desert; if not, it demands different criteria (like strict dangerousness).

  2.  **Essential Elements:** The theory must account for the core components seemingly intrinsic to punishment: (a) the imposition of a burden/hardship, and (b) its expressive function (condemnation of wrongdoing, affirmation of norms).
      *   **Case/Consideration:** A purely symbolic condemnation with no tangible burden (e.g., mandatory public apology that causes no reputational harm). A purely burdensome imposition with no condemnation (e.g., massive tax surcharge accidentally imposed on law-abiding citizens, framed purely as revenue collection). A sentence designed to be "humiliating but costless" or "costly but silent".
      *   **Why it Matters:** Is either element necessary or sufficient? Is punishment defined by the *intent* to condemn/harm, the *effect* of condemnation/harm, or both? This tests the core definition and purpose.

  3.  **Proportionality Constraint:** The theory must provide a principled basis for determining *how much* punishment is appropriate for a given offense.
      *   **Case/Consideration:** Contrasting offenses: petty theft vs. murder; reckless endangerment vs. premeditated assault. Contrasting offenders: wealthy vs. impoverished; remorseful vs. remorseless; first-time vs. repeat. Contrasting purposes: deterrence requires severity X, desert requires severity Y, rehabilitation requires severity Z.
      *   **Why it Matters:** Arbitrary or disproportionate punishment is widely perceived as unjust. A theory must explain *what* punishment scales to (harm, culpability, deterrence value, etc.) and *why* that metric is justified within its framework.

  4.  **Innocence Immunity:** The theory must explain why punishing the *factually innocent* is fundamentally distinct from punishing the guilty, and address the status of detaining the *dangerous but innocent*.
      *   **Case/Consideration:** Knowingly convicting/jailing an innocent person to calm public unrest or send a message. Preventative detention of someone deemed dangerous but who hasn't committed a punishable offense (e.g., based on prediction).
      *   **Why it Matters:** Punishing the innocent is a paradigm injustice. A theory must explain whether this is merely *unjust punishment* or *not punishment at all* but something else (like scapegoating or preventative detention). It tests the link between punishment and *prior wrongdoing*.

  5.  **Hard Cases for Agency & Recipients:** The theory must handle offenders lacking standard agency (e.g., severe mental illness), offenders indifferent to or benefiting from the punishment, and posthumous actions.
      *   **Case/Consideration:** Punishing someone who is genuinely incapable of understanding the wrongfulness of their act or controlling their behavior. An ascetic monk who welcomes hard labor; a wealthy person indifferent to fines. Posthumous stripping of honors, titles, or awards based on later-discovered wrongdoing.
      *   **Why it Matters:** Challenges the connection between punishment, culpability, and the experience of suffering. Can punishment exist if the recipient is unaware, indifferent, or dead? Is posthumous condemnation punishment or historical revision? Tests the theory's view of the offender's role.

  6.  **Empirical Adequacy:** The theory's assumptions about the effects of punishment (deterrence, rehabilitation, incapacitation, norm reinforcement) must be consistent with robust social science evidence.
      *   **Case/Consideration:** Evidence that certainty of apprehension deters more than severity; that long prison sentences often increase recidivism; that rehabilitation programs have mixed success; that expressive effects depend heavily on community context and perceived legitimacy.
      *   **Why it Matters:** A theory that *requires* punishment to deter effectively to be justified is invalidated if punishment demonstrably doesn't deter (or deters poorly). Theories must be robust against inconvenient facts.

  7.  **Authority & Legitimacy:** The theory must justify why the *state* (or specific actors) holds the exclusive right/duty to punish for certain wrongs, rather than victims, families, or private groups.
      *   **Case/Consideration:** Vigilantism; blood feuds; victim-offender mediation replacing state prosecution; corporate internal discipline for criminal acts.
      *   **Why it Matters:** Punishment isn't just *what* is done, but *who* does it. This distinguishes state punishment from revenge, self-help, or private discipline. It forces the theory to address the state's unique role and legitimacy.

  8.  **Pluralism Constraint:** The theory must function (or explain its limitations) within a morally pluralistic society lacking consensus on values or the meaning of punishment.
      *   **Case/Consideration:** Punishing "victimless crimes" or acts considered deeply wrong only by a subset of the population (e.g., certain religious offenses, controversial speech, historical offenses re-evaluated). Expressing condemnation when significant segments of society disagree with the law or the condemnation itself.
      *   **Why it Matters:** Expressive theories struggle if there's no shared understanding of what is expressed. Deterrence/utilitarian theories struggle if the "harm" prevented is contested. Desert theories struggle if culpability is disputed. Tests the theory's applicability in the real, fragmented world.

  **Addressing Your Key Concerns:**

  *   **Desert vs. Social Benefit Tension:** You are right, they come apart starkly.
      *   **The Dangerous but Undeserving:** Someone commits a minor offense (e.g., trespassing) but has a severe, untreatable personality disorder making them highly likely to commit violent crimes in the future. Desert (proportional to trespassing) dictates minimal punishment. Social benefit (incapacitation/prevention) demands potentially indefinite detention. *Theories prioritizing desert cannot justify the detention as punishment; theories prioritizing social benefit struggle to justify its *severity* relative to the offense.*
      *   **The Deserving but Harmless:** Someone commits a serious past offense (e.g., murder decades ago), served their proportional sentence, is now elderly, infirm, genuinely rehabilitated, and poses zero threat. Desert-based retribution or expressive theories might still see value in symbolic condemnation (e.g., continued stigma, loss of voting rights). Social benefit theories (deterrence, incapacitation, rehabilitation) see no justification for further burdens. *Theories prioritizing ongoing condemnation clash with the "no unnecessary suffering" principle of social benefit.*

  *   **The "Most Work" Requirement:** **Innocence Immunity (#4)** does the most work in disqualifying theories.
      *   **Why:** Pure utilitarian deterrence theories *can* conceptually justify "punishing" an innocent person if it calms a riot and prevents greater harm (the classic "scapegoat" scenario). Pure expressive theories *can* justify condemning an innocent person if it powerfully reinforces a social norm the authorities deem crucial. Removing the Innocence Immunity requirement instantly revives these otherwise morally repugnant (and widely rejected) versions of utilitarianism and expressivism. Desert-based theories and hybrid theories typically *require* culpability and thus founder on Innocence Immunity by definition. Keeping this requirement forces all theories to grapple with the fundamental link between punishment and *prior wrongful act*.

  **Key Takeaways:**

  *   This list defines the *problems* a theory must solve, not the solutions. Different theories will satisfy these desiderata to varying degrees and in different ways.
  *   The **tension between proportionality (often desert-based) and minimizing suffering/social benefit** is inherent and unresolvable within a single, pure theoretical framework. Hybrid theories attempt to balance them, but the conflict remains at the margins (like the Dangerous/Undeserving and Deserving/Harmless cases).
  *   **Innocence Immunity (#4)** is the strictest gatekeeper. **Empirical Adequacy (#6)** is the most likely to falsify consequentialist theories. **Pluralism (#8)** is the most challenging for expressive/communicative theories. **Authority (#7)** is fundamental for distinguishing state punishment from other forms of sanction.
  *   Use this list to interrogate theories: "How does Theory X handle preventative detention of the dangerous innocent (Innocence Immunity)? What does it say about punishing someone who can't understand it (Hard Cases)? How does it scale punishment for rich vs. poor offenders (Proportionality) given its core justification?"

  This provides the neutral "spec" you need. Now you can map theories against it and see where they succeed, fail, or make necessary trade-offs.
