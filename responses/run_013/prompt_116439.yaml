  - Start at **Q1** and answer based on your intuition.  
  - Follow branches to a leaf (1–8). Your answers to Sleeping Beauty/Presumptuous Philosopher should align with the decisive leaves above.  
  - Positions are sorted by test-case outcomes (e.g., rejecting SIA due to Presumptuous Philosopher).  

