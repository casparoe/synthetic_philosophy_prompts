  Below is a decision tree designed to guide a classmate from initial commitments about indexical evidence to a specific position on the self-sampling (SSA) versus self-indication (SIA) question. The tree is built from logical distinctions, not named positions, with internal nodes as answerable questions. Leaves include key positions, and the tree is tested against the **Presumptuous Philosopher** (decides against SIA) and **Sleeping Beauty** (decides against Full Non-Indexical Conditioning). Pairs of leaves the tree cannot separate are flagged, and unexplored/incoherent combinations are marked.

  ---

  ### **Decision Tree: Anthropic Reasoning and Indexical Evidence**

  1. **Is indexical uncertainty a genuine form of uncertainty?**  
     - **No** → **Leaf 1: Deflationary View** (No fact of the matter about indexical probability).  
     - **Yes** → Proceed to 2.  

  2. **Does the prior probability of a world depend on the number of observers it contains?**  
     - **Yes** → **Leaf 2: Self-Indication (SIA)** (Prior ∝ number of observers; dissolves Doomsday).  
     - **No** → Proceed to 3.  

  3. **Should indexical evidence (e.g., "I am observer X") condition your beliefs?**  
     - **No** → **Leaf 3: Full Non-Indexical Conditioning** (Only non-indexical facts matter).  
     - **Yes** → Proceed to 4.  

  4. **Are indexically identical duplicates (e.g., copies of you) distinct observers?**  
     - **No** → **Leaf 4: Egocentric SSA** (Reference class = only "you").  
     - **Yes** → Proceed to 5.  

  5. **Is the reference class fixed by your evidence, or chosen by you?**  
     - **Chosen by you** → **Leaf 5: Flexible SSA** (Reference class is subjective/arbitrary).  
     - **Fixed by evidence** → Proceed to 6.  

  6. **What reference class does your evidence fix?**  
     - **Humans** → **Leaf 6: SSA (Human Reference Class)**.  
     - **Conscious observers** → **Leaf 7: SSA (Observer Reference Class)**.  
     - **Other (e.g., wakings, time-slices)** → **Leaf 8: SSA (Fixed Other Reference Class)**.  

  ---

  ### **Leaves (Positions)**
  1. **Deflationary View**: Indexical "probabilities" are not meaningful; no rational updates.  
  2. **Self-Indication (SIA)**: Prior ∝ observers; dissolves Doomsday.  
  3. **Full Non-Indexical Conditioning**: Only non-indexical facts update beliefs.  
  4. **Egocentric SSA**: Reference class = only "you" (solipsistic).  
  5. **Flexible SSA**: Reference class chosen by agent (e.g., humans, aliens, or wakings).  
  6. **SSA (Human Reference Class)**: Reference class = all humans.  
  7. **SSA (Observer Reference Class)**: Reference class = all conscious beings.  
  8. **SSA (Fixed Other Reference Class)**: Evidence fixes a niche class (e.g., wakings in Sleeping Beauty).  

  ---

  ### **Test Cases & Decisive Leaves**
  - **Presumptuous Philosopher**:  
    Decides **against Leaf 2 (SIA)**. SIA prioritizes larger universes, making this case a criticism of SIA.  
  - **Sleeping Beauty**:  
    Decides **against Leaf 3 (Full Non-Indexical Conditioning)**. Halfers (Leaf 3) lose to thirders (Leaves 5/6/7/8) in Beauty’s credence.  

  ---

  ### **Notes**
  - **Tree Cannot Separate**:  
    - **Leaves 7 (SSA Observer) and 2 (SIA)** in Sleeping Beauty (both yield 1/3 for Heads).  
    - **Leaves 5 (Flexible SSA) and 8 (Fixed Other)** if the "chosen" and "fixed" classes overlap (e.g., wakings).  
  - **Unexplored/Incoherent Combinations**:  
    - **Leaf 4 (Egocentric) + Leaf 2 (SIA)**: Incoherent—SIA requires counting duplicates, but Egocentric rejects them.  
    - **Leaf 3 (Non-Indexical) + Leaf 2 (SIA)**: Unattractive—SIA’s prior clashes with non-indexical updates.  
    - **Leaf 1 (Deflationary) + any conditioning**: Incoherent—Deflationism denies indexical uncertainty exists.  

