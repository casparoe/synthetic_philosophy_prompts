  Below is a custom-built analogy microdomain designed to your specifications. I'll create a tiny world, define the source and target cases, and walk through the rigid and slipped mappings. The domain is simple, concrete, and engineered to force a conceptual slip based on structural constraints. I'll then test it against your criteria and play skeptic.

