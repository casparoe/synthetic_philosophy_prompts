  I consider how to structure the questioning sequence. Starting with indifference/permissibility creates foundation for later pressures. The lottery question should come early since it's a common practical escape hatch. Scaling is where numbers become morally unbearable for most people, so that deserves mid-sequence weight. Aggregation within a life seems the most defensible part of their position, so better placed after establishing pressure points. Rescue/allocation distinction comes last as it's where policy implications bite hardest.

  For the custom cases: the lifeboat scenario tests instrumental value versus pure numbers; the differing timelines case probes temporal factors; culpability introduces desert; paralysis versus death examines intra-life aggregation consistency; and the child case stresses personal ties. Each follow-up must corner the guest into either conceding a problem or doubling down on counterintuitive implications.

  The closing should resonate beyond academic debate - hence the teaching/blame question about social practice. Concession indicators will be crucial: when the guest admits "better world" language is appropriate, or allows numbers might matter at scale, or concedes triage requires thresholds, those become pivot points for deeper challenges.

