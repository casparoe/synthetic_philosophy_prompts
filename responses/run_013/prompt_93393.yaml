prompt: |-
  I need a prospectus for a one-semester MA thesis in philosophy of mind, and I would rather you wrote the plan than I did. My hunch, which may well be wrong, is that multiple realizability has been doing two quite different jobs in the case for functionalism and that the two come apart. The familiar job is variation across systems: if an octopus, or a silicon-based creature, can be in pain without sharing our physical constitution, then mental states cannot be identical with physical types and must instead be characterized by causal role. The unfamiliar job is variation within a single system, where the same creature, or the same brain at different times, delivers the same capacity through structurally different mechanisms; this is the phenomenon biologists call degeneracy, and it is not the same claim as redundancy. My suspicion is that the first job still supports functionalism while the second quietly undermines it, since a role that can be played by structurally heterogeneous machinery must be specified either so thinly that it explains nothing or so thickly that it has become a physical mechanism after all. Turn this into the prospectus: state the question so that it has a determinate answer, explain why the standard positions leave it open and what a functionalist and a type-identity theorist would each say at each step, set out the actual work for the semester, say what would count as the project failing, and give an honest verdict on whether the whole thing is too large or too thin for the time available. No citations needed; I will add those myself.
