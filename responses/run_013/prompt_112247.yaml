  ### **Key Notes for Your Column**
  - **Indistinguishable Leaves**:  
    - *Whole-brain* vs. *brainstem death* paths (Nodes 6→7) may overlap if users reject the "minimal activity" scenario as unrealistic.  
    - *Policy choice* appears in 3 branches (Nodes 4A, 6B, 8A)—this reflects its broad application.  
  - **Empty Branches**:  
    - *"Ventilator patient is alive BUT higher-brain death applies"* (logical contradiction).  
