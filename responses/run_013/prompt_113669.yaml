prompt: |-
  Hey, I'm taking this course on concepts and categorisation (cross-listed with the AI dept) and we just spent a week on Bongard problems — the classic ones, two panels of six squiggles each, figure out what seperates left from right. I get the puzzles themselves, but there's a conceptual thing I keep bumping into and I can't get it straight in my head.

  The issue: on basically every one of these I can find several rules that fit all twelve figures perfectly, and some of them are obviously dumb (left figures have an even number of line segments, unless there's a triangle, in which case...). But everyone talks as if there's one right answer, the concept. So what's actually doing the work there? Is it just that humans share a prior over which rules are natural, so the intended rule is the one that's cheap under that prior? And if so, is the concept in the figures at all, or partly in us?

  Then the thing that really broke my brain: our prof mentioned a variant where the two panels are generated by two short computer programs, and instead of classifying new figures you have to output the program. Does that fix the underdetermination, or just move it — since lots of different programs generate the same figures, and lots of different programs agree on every possible classification while disagreeing about everything else?

  I want an intuitive explanation of what gets pinned down in each version, and where the line actually is between got the concept and found a rule that happens to work. No citations needed, just the idea straight.
