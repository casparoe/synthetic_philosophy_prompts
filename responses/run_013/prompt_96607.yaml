prompt: |-
  I teach the causation unit in our phil of science course and I keep having the same fight with the epidemiologists down the hall, so I want to nail down what I actually think. Below are my verdicts on a pile of reversal cases — same shape on the surface, and I don't treat them the same. What I want is the principle behind them, if there is one.

  Two clinics treat the same infection. Clinic A cures 86% overall, Clinic B only about 64%. But break it down and it flips: among mild cases A cures 90%, B 95%; among severe cases A cures 50%, B 60%. B's the better clinic, no question — the overall numbers are just an artifact of A getting handed the milder patients. Now the same shape, opposite call: a study of people hospitalized for some condition finds the ones who exercised more did *worse*, even though in the general population exercisers do better. That within-hospital comparison is junk and I'd go with the population numbers — ending up in the hospital is downstream of both exercise and health, so conditioning on it cooks up the comparison. And a third: a blood-pressure drug cuts heart attacks, and it does that by lowering blood pressure. Hold blood pressure fixed and the benefit mostly vanishes. For a patient deciding whether to take it, I want the overall number — the total effect — not the fixed-blood-pressure one; though if a pharmacologist is asking whether the benefit runs *through* blood pressure, fine, then the stratified number is the thing, but that's a different question.

  The one that keeps me up is the gender pay gap. I used to think the within-job-title gap was the honest measure of discrimination, and that the overall gap was inflated by women getting sorted into lower titles. Now I half think that's backwards — if the sorting into titles is itself the discrimination, then stratifying by title makes the problem vanish by assumption. And then a case where I'm pretty sure the aggregate just is the answer and nothing causal is even going on: two ballplayers, one out-hits the other in both halves of the season yet finishes with the lower average. Who had the better season? The one with the higher average. The halves are arbitrary, every at-bat counts the same, there's no treatment, no confounder, nothing to adjust for.

  So — is there one principle that gets all of these, the clinics and the hospital and the drug and the ballplayers, and tells me what to do about the pay gap? I suspect it has to turn on *why* the third variable is there (common cause, common effect, in-between) and on what question I'm asking, but I can't state it cleanly, and I'd bet at least one verdict above has to go. Give me the principle, or the two or three best candidates, each stated precisely, with the case that forces each clause, plus what it predicts for a case I haven't listed — say, comparing two school districts' test scores when families sort into districts. Then say plainly which of my verdicts you're overruling. 500 words max, prose only, no table.
reasoning: |-
  Okay, let me tackle this philosophy of science problem about causal inference and Simpson's Paradox. The user is teaching causation and needs a unifying principle for different reversal cases.

  The key cases are:
  - Clinics (B is better despite worse overall)
  - Hospital study (population better than conditional)
  - Blood pressure drug (overall effect matters)
  - Baseball (aggregate average wins)
  - Gender pay gap (undecided)

  Hmm, the core tension is about when to aggregate vs stratify. I notice the reversal always involves a third variable - patient severity for clinics, hospitalization status for exercise, blood pressure for the drug, job title for pay gap, and halves for baseball.

  For clinics, stratification makes sense because severity is a confounder - it affects both treatment assignment and outcome. But in the hospital case, conditioning on hospitalization introduces selection bias since it's a collider (exercise and health both affect hospitalization). 

  The drug case shows the importance of the question - total effect vs mechanism. Baseball seems purely descriptive with no causal claim. The pay gap is tricky because job title could be either a confounder or a mediator of discrimination.

  I think the unifying principle has three parts:
  1) Is there a causal question? (baseball has none)
  2) For causal questions: what's the nature of the third variable? (confounder vs collider vs mediator)
  3) What's the specific query? (total effect vs direct effect)

  Applying this:
  - Clinics: severity is confounder → stratify
  - Hospital: hospitalization is collider → don't condition
  - Drug: BP is mediator → total effect for patients
  - Baseball: no causal question → aggregate
  - Pay gap: depends if job titles are mediators (discrimination causes worse titles) → then aggregate shows total discrimination

  I'd overrule the baseball verdict - the halves aren't arbitrary if there's a causal reason (e.g., injury), but here there isn't. For school districts, if sorting is confounder (wealth affects both district choice and scores), we should stratify; if district quality affects scores, aggregate shows total effect.

  The pay gap verdict depends on whether job assignment is part of discrimination - if yes, aggregate matters more.
answer: |-
  The unifying principle: **The causal question determines whether to condition on a variable. Condition when it's a confounder for the target effect; do not condition when it's a collider or mediator *unless* isolating a path-specific effect.**  

  1. **Confounder (condition to avoid bias)**:  
     - *Case*: Clinics. Severity causes both treatment assignment and outcome. Conditioning gives the unbiased clinic effect.  
     - *New case (school districts)*: If wealth causes both district choice and test scores (confounder), condition on wealth to compare district quality fairly.  

  2. **Collider (do not condition to avoid bias)**:  
     - *Case*: Hospital study. Hospitalization is caused by both exercise and health; conditioning induces spurious correlation. The population effect is valid.  
     - *Pay gap implication*: If "job title" is a collider (e.g., discrimination causes both gender and title, and title affects pay), conditioning hides discrimination. Aggregate gap matters.  

  3. **Mediator (condition only for mechanism, not total effect)**:  
     - *Case*: Blood pressure drug. BP is a mediator. For patient decisions, the total effect (unconditioned) is relevant. For mechanism, condition.  
     - *Pay gap implication*: If job titles are *caused* by discrimination and *cause* pay, the aggregate gap captures total discrimination; the within-title gap is the direct effect (discrimination in pay-setting).  

  **Overruled verdict**: The baseball case. You claim the aggregate is always right because "no causation," but halves could be meaningful (e.g., if a first-half injury causally lowered overall performance). Without causal structure, *any* partition is arbitrary—but the aggregate is just one summary. If causation is irrelevant, *no* comparison is privileged; the halves could matter if we care about consistency. Your verdict isn't forced.  

  **Pay gap resolution**: If sorting into titles is discriminatory (mediator or collider), the *aggregate* gap is the honest measure. If titles are non-discriminatory merit assignments (confounder), the *within-title* gap is better. The principle forces clarity on what "discrimination" means.  

