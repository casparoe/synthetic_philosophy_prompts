  Here is the joint statement drafted as requested, reflecting an adversarial collaboration where both parties rigorously define agreements, isolate core disagreements, and commit to testable cruxes – including your proposed hereditary slavery case.

  ---

  **Joint Statement on Legal Positivism and Natural Law: Agreed Claims**  
  *(Signed by H.L.A. Hart and Lon L. Fuller, via adversarial collaboration)*  

  1.  **Nature of a Legal System:** A legal system is a complex social practice characterized by primary rules of conduct and secondary rules (of recognition, change, and adjudication) that identify, modify, and apply the primary rules. It typically involves institutions for creating, enforcing, and interpreting rules, and claims supreme authority within a territory.
  2.  **Identification of Law (The Positivist Core Task):** Officials within a functioning legal system identify valid law primarily by applying the system's rule(s) of recognition. This rule is a social fact – a convergent practice among officials accepting a common standard for identifying what counts as law (e.g., “What the Queen-in-Parliament enacts is law,” “What is written in this constitution and upheld by the supreme court is law”). This identification process is *descriptive* and *conceptual*, aiming to state what the law *is* within that system.
  3.  **Purpose of Natural Law Inquiry (The Natural Lawyer Core Task):** The inquiry seeks to understand the necessary conditions under which a system of rules can generate *genuine moral obligations* to obey, and when the label "law" signifies something inherently worthy of fidelity. This task is *evaluative* and often *prescriptive*, concerned with the moral conditions for law's legitimacy and binding force.
  4.  **What Positivism Does *Not* Claim:**
      *   That morally unjust rules are desirable or good.
      *   That officials or citizens have a moral obligation to obey all valid law.
      *   That the rule of recognition cannot incorporate moral criteria (e.g., “All laws must conform to the Bill of Rights”).
      *   That law lacks a necessary connection to social order or minimal human functionality (acknowledging Hart's "minimum content of natural law" as a concession to *functional* necessity, not inherent morality).
  5.  **What Natural Law Theory Does *Not* Claim:**
      *   That every morally good rule is automatically law.
      *   That identifying *what rule exists* in a society requires a moral judgment in every instance.
      *   That systems failing its criteria lack social power or identifiable rules enforced by officials.
      *   That Fuller's "fidelity to law" is an abstract moral principle; it is presented as the *internal* commitment required of participants who take the legal enterprise seriously for it to function *as law*.
  6.  **Hart's Minimum Content:** This is agreed to be a recognition of *functional* prerequisites for any viable system of social control aiming at human survival, based on contingent facts about human vulnerability, approximate equality, limited altruism, limited resources, and limited understanding. It is *not* a concession to inherent moral validity, but to practical necessity. Both sides agree this is distinct from Fuller's eight desiderata.
  7.  **Fuller's Fidelity to Law:** This is agreed to represent the *internal perspective* of an official or citizen committed to the enterprise of subjecting human conduct to the governance of rules. It is the standpoint from which the eight desiderata become moral requirements *for that enterprise*. Whether this standpoint itself carries broader moral weight is a point of disagreement.

  **The Verbal Dispute:** A significant portion of the disagreement stems from using the word "law" to answer fundamentally different questions. The positivist asks: "What social rules are *identified and enforced as authoritative* within this community?" The natural lawyer asks: "What social rules *create a genuine moral obligation to obey*?" Both questions point to real phenomena: the *social fact of institutional enforcement* and the *moral experience of binding obligation*. The dispute is not *merely* verbal, however, because the core disagreements (below) concern whether these phenomena are necessarily linked and what implications follow for understanding and responding to systems like the hereditary slavery case.

  ---

  **Remaining Disagreements & Cruxes**

  | Question                                                                 | Positivist Formulation                                                                                                 | Natural Lawyer Formulation                                                                                                                                 | Crux                                                                                                                               | Shared Test / Case                                                                                                                             | Positivist Prediction                                                                                                                                                              | Natural Lawyer Prediction                                                                                                                                                               |
  | :----------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of Fuller's 8 Desiderata**                                   | The 8 principles (generality, publicity, etc.) are principles of *efficacy*. They describe conditions necessary for a system of rules to be *effective* guides to conduct and achieve social control. Violating them makes governance inefficient or impossible, not inherently immoral. | The 8 principles constitute an "inner morality of law." They are moral requirements because they respect human agency and dignity: governing by rule *requires* giving subjects a fair chance to obey. Violating them is a direct moral failure specific to the legal enterprise. | **Is a *deliberate* and *systemic* violation of a Fullerian principle (e.g., secret laws, impossible demands) a *moral failure* or merely *ineffective governance*?** | **Case:** A regime enacts clear, prospective, general rules, but deliberately applies them inconsistently based on bribes or political favoritism (violating *congruence*). Officials know this. | Prediction: This shows *corruption* and *inefficiency*, undermining the system's functionality and predictability. The moral wrong lies in the corruption/unfairness, not in a *failure of law as such*. The rules remain identifiable law, badly applied. | Prediction: This demonstrates a *fundamental betrayal of legality itself*. It is immoral *precisely* because it abuses the form of law to perpetrate arbitrary power, destroying the moral bond of fidelity. |
  | **2. Status of a Sufficiently Unjust System**                            | A system remains a legal system if its rules are identified and enforced according to its social rule of recognition, regardless of substantive injustice. "Law" but not necessarily *good* or *obligatory* law. | A system that utterly fails to meet minimal standards of substantive justice (e.g., genocide, extreme arbitrary terror) or completely violates the inner morality *fails to be law at all*. It is merely a form of coercive power or "managerial direction." | **Does the *concept* of law logically exclude systems built on extreme, institutionalized injustice (e.g., hereditary slavery meeting Fuller's form), or is the injustice a *moral defect* within the category of law?** | **Case:** **The Hereditary Slavery System:** Rules governing slavery are general, published, prospective, clear, consistent, feasible, stable, and applied with perfect congruence by scrupulous officials. | Prediction: This *is* a legal system. The rules governing slaves are valid law within it. The system functions effectively to maintain slavery. The moral condemnation is severe, but separate from the *identification* of law. | Prediction: This system *fails as law*. Rules reducing humans to hereditary property, even if formally perfect, violate the fundamental moral purpose of law to respect human dignity and agency. It is organized brutality, not law. |
  | **3. Obligation of Officials re: Monstrous but Valid Rules**             | Officials may have a *role-based obligation* (derived from the rule of recognition and their office) to apply a valid rule. However, they also have a *moral obligation* which may conflict and could justify disobedience or resignation. The role obligation exists but is not absolute. | Officials have *no moral obligation whatsoever* to apply a rule that is fundamentally unjust or part of a system that fails the test of law (per #2). Applying such a rule is complicity in evil. Fidelity to *law* does not bind when the "law" is a perversion. | **Can a formally valid rule within a functioning system (even one meeting Fuller's form) generate a *pro tanto* moral obligation *specific to the official role* for an official to apply it, even if outweighed by countervailing moral reasons?** | **Case:** Within the Hereditary Slavery System, a judge must apply a clear, prospectively enacted rule mandating the return of an escaped slave. | Prediction: The judge has a *role-based obligation* to apply the rule. This obligation carries *some* moral weight (upholding systemic order, predictability, perhaps promise-keeping in accepting office), but is likely *decisively outweighed* by the moral imperative not to enslave. Resignation or (risky) disobedience may be justified. | Prediction: The judge has *zero* moral obligation arising from the "legal" role to apply this rule. The rule is inherently illegitimate. Applying it is simply enforcing brutality. The only moral obligations are to resign, disobey, or subvert the system. |
  | **4. Postwar "Grudge Informer" Cases**                                   | The dilemma arises from a clash between retroactive punishment (morally/legally problematic) and upholding morally reprehensible outcomes under prior valid law. Courts had to choose the lesser evil using moral/political judgment, not deduce an answer from the *concept* of law. Positivism explains the prior validity; natural law highlights the moral bankruptcy. | These cases prove the failure of positivism. If the informer acted according to valid Nazi law, punishing her *requires* recognizing that the Nazi "law" lacked true legal character and moral authority. The court's moral duty to do justice *corrects* the prior legal reality. | **Do these cases demonstrate a necessary *conceptual* connection between law and morality (validity depends on minimal justice), or a *moral/political* conflict arising *after* a change in regime, resolved by extra-legal principles?** | **Case:** Post-Nazi Germany: Woman prosecuted for reporting her husband for anti-regime remarks under a valid Nazi statute, leading to his execution. Should she be punished? | Prediction: The Nazi statute was valid law *then*. Punishing her *now* requires applying a retroactive law/principle (e.g., crimes against humanity, Radbruch formula). This is a morally/politically justified *exception* to the principle of non-retroactivity, not proof the prior rule wasn't law. | Prediction: Punishing her is justified because the Nazi rule she relied on was not valid *law* capable of creating a defense. Its injustice negated its legal character. The court affirms the true nature of law by refusing to recognize the Nazi rule's validity. |

  **Analysis of the Hereditary Slavery Test Case:**

  *   **Positivist Explanation:** This case *perfectly illustrates* the separation of legal validity from moral worth. The system functions effectively according to its own rules and meets formal criteria (Fuller's 8), making its rules clearly identifiable as law using the rule of recognition. Officials have role-based obligations derived from that system. Positivism explains *how such systems operate and persist*. It highlights the *moral danger* of assuming "law" implies justice. Natural law theory, the positivist argues, struggles to account for the *social reality* of this system as perceived and operated by its officials and subjects.
  *   **Natural Lawyer Explanation:** This case *exposes the moral vacuity* of positivism. Calling this brutal, dehumanizing system "law" obscures its fundamental evil and risks legitimizing it. It demonstrates that formal criteria are necessary but *insufficient*; law must serve a morally defensible end (human flourishing, dignity). Officials have *no* genuine obligation arising from this perversion of legality. Natural law theory explains why we *must* withhold the term "law" to condemn such systems and why officials have a *prima facie* duty *not* to participate. Positivism, the natural lawyer argues, offers no inherent moral resources to resist such systems beyond contingent moral beliefs.

  **Conclusion:** This collaboration clarifies the distinct projects of positivism (descriptive sociology of law's existence and identification) and natural law (evaluative inquiry into law's moral foundations and obligatory force). While a verbal component exists ("law" answering different questions), core disagreements remain substantive: the moral significance of the rule of law's form, the conceptual boundaries of "law," and the source of officials' obligations. The hereditary slavery case starkly reveals these fault lines. Neither side expects the other to concede based on this case; it serves to crystallize the debate and demonstrate the explanatory focus of each theory. Progress hinges on resolving the specified cruxes, though agreement on what *would* resolve them (e.g., the nature of moral obligations in role ethics) remains elusive.
