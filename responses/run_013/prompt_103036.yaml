prompt: |-
  You're a philosopher of mind who also works on AI and moral responsibility, so I'd like you to actually think this through rather than reaching for the standard 'anthropomorphism' answer. Brainstorm a bit first, put the candidates on the table, then commit.

  Here's a pattern I keep noticing and I dont have a word for it. It isn't a single move people make, it's a flip-flop, and the flip always goes the same direction depending on what the machine just did.

  Case 1. My aunt's bank rolled out a chatbot with a name and a photo and a chirpy personality, and it told her she could get a late fee waived. She couldn't. The bank's position was essentially: that's not a person, it can't make promises, it's just a language model producing text. Same bank, same week, was advertising that 'Aria' is 'here for you 24/7' and knows her by name.

  Case 2. A friend of mine who will lecture you for an hour about how ChatGPT is nothing but autocomplete got genuinely upset — I mean personally upset, like betrayed — when it told him his writing was derivative, and he wanted it taken down for being dishonest. Ask him whether it can be honest or dishonest and he says of course not, there's nobody home.

  Case 3. Nobody thinks a car's driving software is a moral agent, but when a self-driving car kills someone everyone instantly wants to know who's responsible, and 'the system did it, and systems can't be responsible' satisfies no one, so we go hunting for a human to pin it on.

  The shape of it: we help ourselves to the 'just a machine, nobody's in there' move whenever the machine is being credited with something good, or when there's an obligation the machine seemed to take on and we'd rather not honor it, and we help ourselves to the 'it did something to me' move whenever the machine has harmed or manipulated us and we want someone held to account. Two opposite ontologies, deployed by the same person in the same afternoon, each locally reasonable.

  I read that Dennett piece about counterfeit people, which is in the neighbourhood, and I know about the intentional stance, but neither seems to be exactly this — the intentional stance is about when it's legitimate to predict something by treating it as a believer-and-desirer, and counterfeit people is about deception and the trust an economy runs on. What I'm describing is more like a switching rule keyed to whether the machine helped me or hurt me, and to whether I'm the one being asked to shoulder responsibility.

  Is there a name for this? Is there a literature? If there is, tell me what it is and be precise about how it differs from the nearest three or four candidates — anthropomorphism, the intentional stance, the responsibility gap, whatever else you think is closer than those. If there isn't one, coin one, define it, and give me the boundary cases: is it the same phenomenon when a person does it about a corporation, or about a dog, or about their own brain? And where does it stop being this thing and become plain inconsistency or plain hypocrisy?
reasoning: |-
  Okay, the user is asking about a specific pattern where people flip-flop between treating AI as a mere tool and as an agent, depending on whether it benefits or harms them. They mentioned examples like a bank's chatbot, a friend's reaction to ChatGPT, and self-driving cars. The user wants to know if there's a term for this, or if they should coin one.

  First, I need to understand the core issue. The user isn't satisfied with existing concepts like anthropomorphism or intentional stance because those don't capture the self-interested switching. They want something that accounts for the context-driven flip-flopping based on personal gain or avoidance of responsibility.

  Looking at the examples: in Case 1, the bank denies the chatbot's agency when it's convenient to avoid obligations but promotes it as a helpful agent. Case 2 shows emotional betrayal from someone who theoretically knows it's just a machine. Case 3 highlights the demand for accountability despite not viewing the system as a moral agent. The common thread is the strategic switching based on outcomes.

  Existing terms come to mind. Anthropomorphism is too broad; it's about attributing human traits, not the strategic flip. Intentional stance is about prediction, not accountability. Responsibility gap addresses the lack of accountability but doesn't cover the inconsistent attributions. Moral buffering involves shifting responsibility but isn't context-triggered. The user needs a term that specifically captures this self-interested toggling.

  The key aspects are: context-dependent switching, triggered by benefit/harm, driven by self-interest, and occurring rapidly. Maybe "Convenient Agency Switching" or "Benefit-Driven Attribution." But CAS—Convenient Agency Switching—seems precise. It emphasizes the self-interested toggling between ontologies. Defining it clearly, with boundary cases like corporations or pets, will show where it applies.

  Also, considering the user's background in philosophy and AI, they likely want a term that's academically sound but practical. They might be preparing for a paper or discussion, so precision is crucial. The deeper need is to formalize this observed pattern into a concept that can be referenced in debates about AI ethics and responsibility. Ensuring the term distinguishes from hypocrisy (which is about inconsistency in principles) is important. Hypocrisy is about values, while CAS is about ontology switching for convenience.

  Boundary cases: Corporations are treated similarly—blamed as entities when convenient. Pets might get partial agency when they obey but not when they misbehave. Mental states, like blaming one's brain for addiction, also fit. But with humans, it's different because we hold them consistently responsible. The term should exclude cases where the attribution is stable.

  Finally, coining CAS as the term, defining it, and differentiating it from similar concepts should address the user's request. Highlighting the self-serving nature and rapid context-switching makes it distinct.
answer: |-
  This is a brilliantly observed phenomenon, and you're right that existing terms don't quite capture its essence. Let's break it down, brainstorm candidates, commit to a definition, and explore boundaries.

  **Core Phenomenon:** *Strategic, context-dependent ontological switching regarding the agency/patienthood of AI/automated systems, driven primarily by self-interest concerning benefit/harm or responsibility assignment.* The user flips between two incompatible frameworks ("just a tool" vs. "responsible agent") based entirely on whether a positive outcome is being claimed/desired or a negative outcome needs redress/shifting.

  **Brainstorming Candidates (Why They Don't Fit Perfectly):**

  1.  **Anthropomorphism (Simple):** Attributing human characteristics to non-human things. *Why not?* It's too broad and static. Your cases involve *de*-anthropomorphizing when convenient (tool ontology) and anthropomorphizing *only* when it serves the purpose of assigning blame or claiming benefit (agent ontology). It's the *strategic flip* that's key, not the mere attribution. Simple anthropomorphism doesn't explain the denial when it's inconvenient.
  2.  **Intentional Stance (Dennett):** Predicting behavior by treating an entity *as if* it has beliefs and desires. *Why not?* The intentional stance is fundamentally about *prediction* and epistemic utility. Your cases are primarily about *moral responsibility, obligation, and harm/benefit*. While the intentional stance might be deployed as part of the flip, the core driver isn't better prediction; it's moral/legal/practical advantage. People might adopt the intentional stance for prediction *and* reject it for responsibility simultaneously.
  3.  **Responsibility Gap (Sparrow, Matthias):** The problem that arises when no human can be held sufficiently responsible for the actions of an autonomous system. *Why not?* It addresses the *outcome* (lack of responsibility) but not the *cognitive mechanism* driving it (the user's *own* flip-flopping ontology). The gap exists objectively; your phenomenon is about the *subjective, self-serving strategy individuals use* that *contributes to* or *exploits* the gap. The user isn't *lamenting* the gap; they're *using* ontological ambiguity to navigate it selfishly.
  4.  **Moral Buffering (or Diffusion):** Spreading or obscuring responsibility across multiple agents or systems to avoid individual blame. *Why not?* While related, buffering usually involves distributing blame *among humans* or complex systems. Your phenomenon is about *ontologically reclassifying the AI itself* (tool vs. agent) as the primary buffer strategy. It's a specific *mechanism* of buffering focused on the AI's status.
  5.  **Hypocrisy/Inconsistency:** Simple logical contradiction. *Why not?* While it *is* inconsistent, labeling it just "hypocrisy" misses the *systematic pattern* driven by self-interest and the *specific ontological switch* involved. It's a *structured* inconsistency exploiting the ontological ambiguity of AI.

  **The Commitment: Coining "Convenient Agency Switching" (CAS)**

  *   **Definition:** Convenient Agency Switching (CAS) is the self-serving cognitive maneuver whereby an individual rapidly alternates between treating an AI/automated system as:
      *   A *Tool/Artifact* (lacking agency, intentionality, moral status, capacity for commitment): When this framing allows the individual to **discount benefits promised by the system, avoid obligations *to* the system, or deflect responsibility *away* from the system's operators/creators.**
      *   An *Agent/Quasi-Person* (possessing sufficient agency, intentionality, or accountability to be the target of blame, credit, or obligation): When this framing allows the individual to **claim benefits offered by the system, hold the system itself (or its creators via the system) accountable for harms, or feel personally wronged *by* the system.**
      *   **Core Driver:** The switch is primarily motivated by the individual's perceived self-interest regarding the immediate *consequences* of the system's output/action (benefit/harm) and their position relative to *responsibility* (assigning it or avoiding it).

  *   **How it Differs:**
      *   vs. **Anthropomorphism:** CAS *uses* anthropomorphism strategically *only when beneficial* and actively rejects it when inconvenient. It's not a general attribution error.
      *   vs. **Intentional Stance:** CAS is about *moral and practical consequence management* (responsibility, obligation, harm, benefit), not primarily about prediction. The stance is adopted/rejected based on its utility for blame/credit shifting.
      *   vs. **Responsibility Gap:** CAS is the *subjective cognitive tactic* individuals employ that *exploits and reinforces* the objective responsibility gap. It describes the *user's behavior*, not the systemic problem.
      *   vs. **Moral Buffering:** CAS is a specific *ontological buffering mechanism* applied directly to the AI's status, rather than distributing blame among human actors or complex processes.
      *   vs. **Hypocrisy:** CAS is a *specific pattern* of inconsistency focused *exclusively* on the ontological status of AI relative to benefit/harm/responsibility. It's not general moral hypocrisy; it's ontology-hacking for personal advantage.

  **Boundary Cases & Where it Stops:**

  1.  **Corporations:** *Very similar phenomenon.* People readily treat corporations as monolithic, intentional agents ("Google is spying on me!", "Amazon promised fast delivery!") when blaming them or claiming a benefit. Yet, when pressed on responsibility or internal complexity, they retreat to "it's just a legal fiction/a collection of people" to diffuse blame ("Which *person* at Google spied on you?"). CAS applies strongly here. Corporations are a prime example of socially constructed agents where CAS thrives.
  2.  **Animals (e.g., Dogs):** *Limited application, partial fit.* We might say "My dog *knew* he wasn't supposed to do that!" (implying agency/blame) after misbehavior, but say "He's just an animal, he doesn't understand!" when refusing a demand (e.g., not coming when called). However, the *intensity* and *moral weight* are usually lower. We rarely hold dogs *morally* responsible in the same way, and we don't typically expect them to make binding commitments like the bank chatbot. CAS might occur weakly, but the ontological ambiguity isn't as stark or socially consequential as with AI/corporations.
  3.  **One's Own Brain/Mind:** *Different mechanism, partial resonance.* Saying "My brain made me do it" or "My addiction is a disease" can be a way to deflect personal responsibility (using a "sub-agent" or "system" ontology). Conversely, claiming credit ("I worked hard to learn this!") adopts the unified agent ontology. However, this is usually a *defensive strategy about the self*, not an *interpersonal* strategy concerning an *external* entity's status. It's more about internal responsibility attribution than exploiting ontological ambiguity in an interaction. The flip isn't usually as rapid or context-dependent on immediate external benefit/harm from the "brain system."
  4.  **Plain Inconsistency:** CAS *is* inconsistency, but it's a *motivated, patterned, and contextually triggered* inconsistency. It stops being specifically CAS and becomes "plain inconsistency" when the flips aren't systematically tied to the benefit/harm/responsibility dynamic regarding the AI's status (e.g., randomly switching views for no apparent reason).
  5.  **Plain Hypocrisy:** CAS *is* hypocritical in the sense of applying inconsistent standards. It stops being specifically CAS and becomes "plain hypocrisy" when the inconsistency involves broader moral principles *not* centered on the ontological status of an AI/system relative to benefit/harm/responsibility (e.g., demanding honesty from others while lying oneself).

  **Conclusion:**

  The phenomenon you've identified is distinct and pervasive. **Convenient Agency Switching (CAS)** captures its core: the self-serving, rapid, context-dependent flip between treating an AI/system as a mere tool or a responsible agent, driven by the desire to maximize personal benefit, minimize harm, and strategically assign or avoid responsibility. It exploits the fundamental ontological ambiguity of complex artificial (and some corporate) systems. While echoes exist with corporations and even internal states, it manifests most clearly and problematically in human-AI interaction, especially as AI becomes more sophisticated and embedded in consequential social and economic transactions. This isn't just cognitive error; it's a form of ontological opportunism.

  This needs a literature! It sits at the intersection of philosophy of mind (folk psychology, agency), AI ethics (responsibility, anthropomorphism), moral psychology (self-serving biases, blame shifting), and social ontology (status of corporations, artificial agents). Key thinkers to connect it to include Daniel Dennett (intentional stance, agency), Luciano Floridi (information ethics, patienthood), Helen Nissenbaum (accountability in socio-technical systems), and legal scholars grappling with corporate personhood. The coinage offers a precise lens to analyze this specific, problematic pattern.
