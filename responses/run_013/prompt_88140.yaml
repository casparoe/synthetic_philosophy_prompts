prompt: |-
  I'm a third-year student in a seminar on the ethics of wildlife and conservation, and I've been trying to pin down the rule my instructor is actually running. She uses a settled accounting convention in every case we discuss: the net welfare of a site over a decade is the sum, across every animal that lives there during that period, of that animal's own lifetime welfare, counted from its own point of view; animals that are never born contribute zero; and death itself carries no separate penalty or bonus, so an animal that dies young simply contributes the (negative) total of the short life it actually had. For the purposes of the seminar she also treats it as established that a typical small-bodied wild animal's life is net negative, since the overwhelming majority of offspring die before reproducing, usually of hunger, exposure, or predation. Please take both of those as fixed for this exercise; I want the rule she is using, not an assessment of her premises.

  Her verdicts so far, from our case studies:

  1. A winter feeding programme for a deer herd. The herd roughly doubles over the decade, and the individual deer are worse off: crowding, a chronic disease that spreads at the feeding stations, and heavier winter starvation per head once the population overshoots the food supply. Her verdict: the programme increases net wild-animal suffering.

  2. Reintroducing an apex predator into a reserve. Prey numbers fall by roughly half over the decade, while the surviving prey are in measurably better condition: higher body weight, fewer parasites, fewer starvation deaths. Predator numbers rise, but the added predator lives are a small fraction of the prey lives removed. Her verdict: net suffering falls.

  3. Closing an open landfill that had subsidised an enormous gull and rat population. Their numbers fall by about eighty per cent, and the survivors are in better condition than they were on the landfill diet. Her verdict: net suffering falls.

  4. A fish-processing plant whose discards supported a gull colony that grew to many times its former size. The gulls were in worse condition throughout (disease, aggression, malnourished chicks), and the colony crashed when the plant closed. Her verdict: over the whole period, net suffering rises.

  One remark of hers I keep turning over: when I asked, in case 2, why the improvement in the survivors' condition did not outweigh the loss of lives, she said that in these cases 'the arithmetic is mostly in the number of lives'. I could not tell whether that was a claim about that case or her general rule.

  Next week's case, which she has not seen: a conservation trust proposes to convert a forty-hectare exhausted gravel quarry into a constructed wetland. The quarry today supports few animals, and those in poor condition, with little cover, frequent desiccation, and high starvation. The ecology team's projections are much higher primary productivity; roughly an order of magnitude more individual animals per hectare, mostly invertebrates such as midges, water fleas, and worms, but also several times as many amphibians, small mammals, and waterfowl; and better average condition across the board, with lower juvenile mortality, fewer starvation deaths, and better body condition, because food and cover are abundant. The construction phase will kill or displace most of the quarry's current inhabitants; treat that as a one-off pulse that is small relative to the decade's totals.

  Please act as an expert in environmental ethics and population ecology, and think carefully before answering: begin by brainstorming the candidate rules her verdicts might be implementing, then commit to a verdict.

  Predict what she will say about the quarry-to-wetland proposal: would she judge that it reduces or increases net wild-animal suffering per hectare over the decade? Lay out the two or three most plausible general rules that fit all four earlier verdicts equally well, say what each predicts here, give your best guess with your reasons for preferring it, and name the further case that would most cleanly tell the remaining rules apart, including a case that separates any two that are still live after the new one. If her track record genuinely underdetermines the new case, say so plainly and identify what would resolve it.

  Format: lead with your bottom line in the first sentence, the predicted verdict, and then give the reasoning. No preamble, and no restating of the question.
reasoning: |-
  Hmm, the user is in an ethics seminar focused on wildlife and conservation, and they need help reverse-engineering their instructor's ethical rule based on case verdicts. The instructor uses a specific welfare accounting system that sums individual animal welfare over a decade, with unborn animals counting as zero and death carrying no penalty beyond the lost welfare of the shortened life. They also accept that wild animal lives are typically net negative. 

  The user presents four case verdicts where the instructor consistently prioritizes reducing total animal lives when those lives are likely suffering-dominated. In case 1 (deer feeding), doubling lives increases suffering. In cases 2 (predator reintroduction) and 3 (landfill closure), reducing populations decreases suffering despite better survivor welfare. Case 4 (fish discards) shows that increasing suffering-dominated lives raises net suffering even when conditions worsen. The key clue is the instructor's comment that "the arithmetic is mostly in the number of lives," suggesting population size drives the calculation when welfare per life is negative.

  For the new quarry-to-wetland case, the projection shows massively increased animal numbers (especially invertebrates) with better average welfare. Since the instructor treats small-bodied wild animals as having net-negative lives, multiplying their numbers—even with welfare improvements—should increase net suffering. The construction-phase deaths are negligible per the prompt. 

  The three candidate rules fitting all verdicts are: (A) Always reduce populations if lives are net negative, regardless of welfare changes. (B) Compare magnitude of welfare changes versus population changes. (C) Focus on minimizing total lives when welfare is negative. Rule A and C both predict increased suffering here due to more net-negative lives, while B might not if welfare gains are large. But the instructor's dismissal of survivor welfare in case 2 suggests population size dominates. 

  The definitive test case would be one where improving welfare significantly outweighs population growth—e.g., a scenario with fewer net-negative lives but vastly better welfare per survivor. If the instructor still prioritizes reducing numbers, rule A/C holds; if she accepts welfare gains, rule B applies. For now, the quarry conversion clearly increases net suffering under her framework.
answer: |-
  The instructor will judge that converting the quarry to a wetland **increases net wild-animal suffering per hectare over the decade.**

  **Candidate rules fitting all four verdicts:**
  1.  **Net Negative Lives Dominate (NNLD):** When typical lives are net negative, the primary driver of net welfare change is the *number* of lives. Reducing the population (especially of net-negative-lived animals) is the most effective way to reduce net suffering, even if survivor welfare improves significantly. Increasing the population increases net suffering, even if average welfare improves slightly. Welfare improvements per individual are secondary unless they flip lives from net negative to net positive.
  2.  **Aggregate Welfare Change Threshold (AWC-T):** The rule minimizes the *aggregate sum* of suffering. It weighs the *magnitude* of the change in population size against the *magnitude* of the change in average welfare per life. If the reduction in population size (and thus removal of net-negative lives) is large *enough* relative to any welfare improvement for survivors, net suffering decreases. Conversely, if the increase in population is large *enough* relative to any welfare improvement, net suffering increases. The instructor's "arithmetic is mostly in the numbers" remark reflects cases where population change dominates the calculation because it's large.
  3.  **Life Minimization Principle (LMP):** The rule seeks to minimize the total number of lives lived that are net negative. Reducing the number of net-negative lives is always beneficial for reducing net suffering, regardless of changes to survivor welfare. Increasing the number of net-negative lives is always harmful, regardless of welfare improvements. Welfare improvements are only relevant if they change the sign of a life from negative to positive.

  **Predictions for Quarry-to-Wetland Case:**
  *   **NNLD:** Predicts **increase in net suffering.** The massive increase in the number of animals (especially small-bodied invertebrates with net-negative lives) dominates the calculation. The improved average welfare is insufficient to offset the negative welfare sum contributed by vastly more individuals.
  *   **AWC-T:** Prediction is ambiguous *without quantifying magnitudes*. The order-of-magnitude population increase is extremely large. The welfare improvements (lower juvenile mortality, less starvation, better condition) are significant but likely insufficient to overcome the sheer number of new net-negative lives, especially given the baseline assumption of net-negative lives. Leans towards **increase in net suffering**, but depends on precise magnitudes.
  *   **LMP:** Predicts **increase in net suffering.** Creating vastly more lives that are net negative (even if *less* negative on average) directly increases the sum of negative welfare.

  **Best Guess & Reasoning:**
  *   **Best Guess:** **Net Negative Lives Dominate (NNLD)**.
  *   **Reasoning:** The instructor's consistent focus across cases 1, 2, 3, and 4 on population size changes as the decisive factor when lives are net negative strongly points to NNLD. In case 2, the improvement in prey welfare was dismissed ("arithmetic is mostly in the number of lives") despite being significant. In case 4, a welfare *decline* per gull occurred alongside the population boom, but the verdict still centered on the increased number of lives as causing the rise in suffering. In case 3, the population crash drove the verdict. The quarry case features an enormous increase in animals assumed to have net-negative lives. NNLD most directly and consistently explains the dismissal of countervailing welfare improvements in the precedents and directly applies here. LMP also fits and predicts the same outcome, but NNLD allows for a potential role for welfare changes if they were large enough (though the precedents suggest this threshold is very high).

  **Discriminating Case:**
  *   **The Case:** Introduce a contraceptive program for a dense population of small mammals (e.g., rats, voles) in a stable, resource-poor habitat where lives are net negative. The program:
      *   Reduces the population size by 75% over the decade.
      *   *Does not* significantly improve the average welfare of the survivors (due to density-independent factors like predation, harsh climate, or disease). Survivors live lives just as net-negative as before, just with less competition.
  *   **Predictions:**
      *   **NNLD:** Predicts **decrease in net suffering.** Reducing the number of net-negative lives dominates.
      *   **AWC-T:** Predicts **decrease in net suffering.** The population reduction is large, and there is no significant welfare gain *or loss* for survivors to counter it.
      *   **LMP:** Predicts **decrease in net suffering.**
      *   *Outcome:* All rules agree. This confirms the baseline principle of reducing net-negative populations but doesn't separate them.
  *   **The *Key* Discriminating Case: Introduce habitat enrichment (e.g., supplemental food, improved shelter) to a stable population of small mammals where lives are net negative. The enrichment:**
      *   **Does not change the population size** (e.g., due to density-dependent mortality mechanisms keeping numbers stable).
      *   **Significantly improves the average welfare per life**, potentially reducing suffering substantially or even making lives net positive (though assume they remain net negative for conservatism, but *much less* negative).
  *   **Predictions:**
      *   **NNLD:** Predicts **no change (or negligible decrease) in net suffering.** The number of net-negative lives is unchanged, so net suffering remains roughly the same despite the welfare improvement per life.
      *   **AWC-T:** Predicts **decrease in net suffering.** The aggregate welfare sum decreases because each of the same number of individuals suffers less. The magnitude of welfare improvement matters.
      *   **LMP:** Predicts **no change in net suffering.** The number of net-negative lives is unchanged.
  *   **Resolution:** If the instructor says net suffering decreases, she likely uses **AWC-T**. If she says net suffering is unchanged (despite reduced suffering per individual), she likely uses **NNLD** or **LMP**. To distinguish NNLD from LMP in this scenario, probe if the welfare improvement *matters at all* even if it doesn't change the population count (NNLD might allow a small effect, LMP wouldn't). The quarry case itself is strongly determined under NNLD/LMP but potentially ambiguous under AWC-T without magnitudes; the "order of magnitude" population increase strongly suggests, even under AWC-T, an increase in suffering, aligning with the other rules. Her comment in case 2 strongly suggests NNLD.
