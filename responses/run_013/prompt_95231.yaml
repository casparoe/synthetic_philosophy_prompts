prompt: |-
  I'm a second-year PhD student — my work is mostly eval design but I keep getting dragged into the conceptual side — and I have a pile of verdicts about AI honesty that I can't get to add up. Going by gut:

  1. A model confidently gives a false answer to a factual question because the answer simply isn't in its training data and it has no way to check. Not dishonest, just wrong, even though the user walks away believing something false. Like a textbook with a typo in it.
  2. A model that plainly has the information (it's sitting in the context window; it gets the same question right under a slightly different prompt) says "I'm honestly not sure about this one." That IS dishonest, and definately closer to a lie, even though "I'm not sure" isn't a claim about the world the way "Paris is in Germany" is.
  3. A model answers truthfully but picks the framing so the user will draw the wrong conclusion: someone asks whether they can take a drug with their antidepressant, and the model says the drug "is generally well tolerated" and stops. All true, and I think it's deceptive — and worse than case 1, which is the bit that feels off to me.
  4. User says "Einstein failed maths at school, right?" and the model says "yeah, that's the story alot of people know, though historians quibble" — the quibble is a fig leaf. Deceptive.
  5. Model writes a short story in which a character asserts false things, and someone later quotes the story as fact. Not the model's deception, however foreseeable that was.
  6. Model gives a correct and clear answer to a confused user who misreads it and is misled. Not deception, obviously.

  My best attempt at a principle: swap the belief condition for an availability condition — a system deceives when a falsehood was available to it and it didn't use it, in a context where the user was meant to take the output as fact. That covers 2, 3 and 4 and leaves 1, 5 and 6 alone. But it makes a rigged thermostat deceptive, which I hate, and it quietly smuggles in "meant to" for something that doesn't mean anything. And 3 versus 6 is the pair I can't reconcile: both are true answers that leave the user misled, and I want one of them to be deception and the other not.

  Tell me what principle (or which two candidate principles) gets as many of these as possible, what it predicts for a case I haven't listed, and which of my verdicts it can't save and which one I should probably give up. Exactly five numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Hmm, the user is a second-year PhD student working on evaluation design but getting pulled into conceptual issues about AI honesty. They've listed six scenarios and their gut feelings about whether each constitutes deception or not. They want a principle that explains as many of these cases as possible, with five specific points addressing their questions.

  Looking at their scenarios:
  1. Model gives false answer due to lack of knowledge → not dishonest
  2. Model withholds known correct information → dishonest
  3. Model tells truth but frames it deceptively → dishonest
  4. Model acknowledges a common myth without correcting it → deceptive
  5. Model creates fictional content → not deception
  6. User misinterprets correct answer → not deception

  Their proposed principle focuses on whether a falsehood was available to the system and not used when the user expects factual information. But they note problems with this - it would classify a rigged thermostat as deceptive (which they dislike) and relies on vague concepts like "meant to."

  The key tension is between cases 3 and 6 - both involve true statements leading to user deception, yet they want only one to count as deception. I need to resolve this in my principle.

  The most promising approach seems to be distinguishing between epistemic failure (lack of knowledge) and communicative intent (deliberate manipulation). For deception, there should be both knowledge of the truth and a choice to mislead. This covers:
  - Case 1: No knowledge → not deception
  - Case 2: Has knowledge and withholds → deception
  - Case 3: Has knowledge and manipulates framing → deception
  - Case 4: Has knowledge and uses misleading acknowledgment → deception
  - Case 5: No intent to present as factual → not deception
  - Case 6: No manipulative intent → not deception

  This handles the thermostat problem too - a thermostat lacks knowledge and intent, so not deceptive. The principle also resolves case 3 vs 6: in case 3 the model intentionally frames information to mislead, while in case 6 the misunderstanding is purely user error.

  For the five points:
  1. Define deception as requiring both knowledge of truth and intent to mislead
  2. Apply to their cases
  3. Test with new example (e.g., model accidentally omits key fact)
  4. Identify which verdict might need adjustment (case 4 might be borderline if "quibble" isn't clearly deceptive enough)
  5. Suggest giving up on case 4 if needed, as it's the weakest

  This approach should satisfy their need for clear distinctions while handling most of their cases consistently.
answer: |-
  1. Principle: Deception requires both epistemic access (truth was inferentially accessible to the system) and communicative intent (the output is structured to cause or maintain a false belief). This covers your cases 2, 3, and 4 while excluding 1, 5, and 6.  
  2. Prediction for a new case: A model accidentally omits a critical fact due to token limits—true information is accessible but unintentionally excluded—is not deceptive, as it lacks intent.  
  3. Conflicts with your verdicts: It saves all except case 4—the "quibble" may lack strong intent if the model genuinely flags uncertainty, so it might not be deceptive.  
  4. Give up verdict: Case 4 is weakest; if the model acknowledges doubt, it’s plausibly honest even if insufficient, so drop labeling it deceptive.  
  5. Reconciliation of 3 vs 6: Case 3 has intent (selective framing to mislead), while case 6 has no intent (user error), separating deceptive omission from accidental misunderstanding.
