prompt: |-
  Okay so I just spent like two hours arguing with my buddy who does stats for a living and now I actually have to do my job, so let me lay this out. I run the data/analytics side of a mid-size county agency — we're the ones who vet and then babysit any algorithm a vendor sells us for making consequential calls about residents. Right now that's a pretrial risk score for the jail population and a model that ranks families for child-welfare follow-up visits, and there's a third one coming to prioritize which rental units get code inspections. My friend's whole thing during the arguement was that I'm "asking for something that doesn't exist" — he kept saying you cannot have a score that's well-calibrated and also gives you equal error rates across groups whenever the groups have different base rates, and that the moment you pick what to optimize you're doing politics, not math. Fine, I basically believe him. But I still have to sign off on these things, and "it's impossible, good luck" is not a deliverable I can hand my director.

  So what I want from you is a decision procedure my team can actually run, start to finish, when a new scoring tool lands on my desk: the questions to ask in order, what counts as a good-enough answer at each step, what we should demand from the vendor in writing, where the procedure dead-ends in a flat no, and — this is the part my friend says I'm in denial about — the exact points where the procedure has to stop and hand the call to a human because it's a value choice and not a fact we can compute. I want it usable by an analyst who's heard the word "fairness" but never read the literature, so keep the machinery light, but don't dumb it down to the point where we pretend the tradeoffs away. Concretely, I need it to tell me how to even pick which fairness property we're committing to for a given deployment (and to be honest that different deployments might warrant different picks), how to check whether the vendor's numbers actually demonstrate that property rather than just something that sounds like it, what to do when the group base rates differ and the vendor's "we're calibrated" claim turns out to be technically true but useless for the decision in front of us, and how to document the choice so that when someone sues us or a reporter calls, we can show we didn't just pick whichever metric made the tool look good.

  Then run it on the two live ones — the pretrial score and the child-welfare ranking — and I'd like at least one of those runs to come out in a way that makes my director unhappy, because if the procedure only ever blesses what we were already going to do anyway, it's not a procedure, it's a rubber stamp. And tell me straight what this procedure can't do, i.e. where two reasonable people running it correctly would still land in different places, so I at least know what I'm taking responsibility for.
reasoning: |-
  Okay, let me start by really understanding what this user is asking for. They run data analytics for a county agency and need a practical decision procedure to evaluate algorithmic tools from vendors. They've been arguing with a stats-savvy friend who says well-calibrated scores with equal error rates across groups are impossible when base rates differ. The user accepts that but still needs a concrete process to assess these tools.

  First, I need to break down their core requirements: They want a step-by-step procedure that's usable by analysts without deep fairness expertise. It should include specific questions to ask vendors, criteria for evaluating answers, documentation requirements, and clear stopping points where human judgment is needed. The procedure must handle different base rates and force explicit value choices. They also want it applied to two real cases (pretrial risk and child welfare) with at least one outcome challenging current practices.

  Hmm... The key challenges here are balancing technical accuracy with practicality. The procedure must acknowledge inherent tradeoffs without getting bogged down in academic complexity. I recall that fairness metrics like demographic parity, equal opportunity, and predictive parity often conflict when base rates differ - that's the impossibility theorem the friend mentioned. So the procedure needs to flag these contradictions clearly.

  For structure, I'm considering a phased approach: First establish context and harms, then audit group performance, identify tradeoffs, then make value-based choices. Each phase needs concrete outputs and "go/no-go" gates. The pretrial risk example will likely expose the calibration-error rate tension, while child welfare might show ranking vs classification problems.

  Important nuances: The procedure must force vendors to provide disaggreated performance data, not just overall accuracy. And documentation should capture not just what was chosen, but what was sacrificed. For the "unhappy director" requirement, I'll design the pretrial walkthrough to show how demanding fairness constraints might force higher jail populations - that'll sting but prove it's not a rubber stamp.

  What can't the procedure do? It can't resolve value conflicts - like whether to prioritize reducing false positives for one group over another. Those decisions must be transparently handed to policymakers. Also, it can't fix fundamentally biased training data, only make tradeoffs visible.

  For the child welfare case, I'll highlight how ranking optimization differs from classification - the vendor might satisfy calibration but create allocation unfairness. That's another point where the procedure should force uncomfortable discussions about which families get scarce resources.

  The output needs to be action-oriented: Scripted vendor questions, validation steps for their claims, and a decision log template. Most importantly, it must show exactly where math ends and politics begins - like when choosing between equalizing false positives versus false negatives across racial groups.
answer: |-
  Here's a concrete, step-by-step decision procedure for vetting algorithmic tools, designed for practical use by your team. It explicitly surfaces tradeoffs and forces value choices into the open. I'll then run it on your two active deployments, making the pretrial risk assessment outcome intentionally problematic for your director.

  **Core Principle:** **"Math reveals tradeoffs, humans must choose the cost."** Your stats friend is correct – you *cannot* optimize all fairness metrics simultaneously when base rates differ. The procedure forces acknowledgment of this and documents the chosen tradeoff.

  **The Algorithmic Assessment Procedure (AAP)**

  **Phase 0: Pre-Requisites (Before Vendor Walk-In)**
  1.  **Define the Consequential Decision:** What specific action is driven by the score? (e.g., "Detain pre-trial?", "Conduct a home visit?", "Inspect rental unit?") *Be hyper-specific.*
  2.  **Identify Protected Groups:** Legally protected (race, gender, age) and contextually relevant groups (e.g., specific neighborhoods, income bands, family structure). Base this on local demographics, historical bias concerns, and legal counsel input.
  3.  **Establish Minimum Performance:** What level of overall accuracy (or AUC, etc.) is *absolutely* required for the tool to be functional? (e.g., "AUC >= 0.70"). **Document rationale.**
  4.  **Define the "Harm Spectrum":** For *this specific decision*, what is worse?
      *   **False Positive (FP):** Harm from acting unnecessarily (e.g., jailing low-risk person, intrusive home visit).
      *   **False Negative (FN):** Harm from failing to act (e.g., releasing high-risk person, missing child danger).
      *   **Rank:** FP Harm > FN Harm? FN Harm > FP Harm? Roughly Equal? **Document rationale (This is the FIRST major value choice).**

  **Phase 1: Vendor Interrogation & Data Demand**
  *   **Q1: "What is the *explicit* decision threshold or how is the score rank-ordered for resource allocation? Show us the mapping."**
      *   *Good Enough:* Clear documentation of thresholds or ranking methodology. If rank-order only, demand justification for why classification metrics aren't primary.
      *   *Red Flag:* Vague statements ("scores inform decisions"), refusal to share thresholds.
  *   **Q2: "Provide a *complete* confusion matrix (or equivalent performance data) disaggregated by *all* identified Protected Groups (Phase 0.2). Include at minimum: Group Size, Base Rate (Positive Prevalence), True Positives (TP), False Positives (FP), True Negatives (TN), False Negatives (FN), calculated FPR, FNR, PPV, NPV, and Selection Rate at the proposed threshold."**
      *   *Good Enough:* Comprehensive, disaggregated performance data covering all requested metrics.
      *   *Dead End (Flat No):** Refusal to provide this data, inability to generate it, or significant missing groups.
  *   **Q3: "Demonstrate calibration for each group. Show observed outcome rate (e.g., % arrested) vs. predicted score deciles/quantiles, by group."**
      *   *Good Enough:* Calibration plots or tables showing predicted risk vs. actual outcomes across the score range for each group. Group lines should be reasonably close.
      *   *Red Flag:* Significant miscalibration (lines far apart), especially at critical decision thresholds. Claims of "overall calibration" without group breakdowns.
  *   **Q4: "What fairness metric(s) did you explicitly optimize for or claim to satisfy? Provide evidence supporting that claim using the data from Q2/Q3."**
      *   *Good Enough:* Clear statement of the targeted fairness property (e.g., "Equal Opportunity", "Predictive Parity") and evidence from their data showing it holds (approximately).
      *   *Red Flag:** Vague claims ("fair", "unbiased"), shifting definitions, metrics claimed but not evidenced in the data.

  **Phase 2: Team Audit & Tradeoff Identification**
  1.  **Verify Performance:** Confirm overall accuracy meets Minimum Performance (Phase 0.3).
  2.  **Audit Group Performance:** Using vendor data (Q2/Q3):
      *   Calculate **Error Rate Disparities:** Compare FPR, FNR across groups.
      *   Calculate **Predictive Value Disparities:** Compare PPV, NPV across groups.
      *   Calculate **Selection Rate Disparities:** Compare % flagged/selected across groups.
      *   **Visually Inspect Calibration Plots:** Note any significant group differences.
  3.  **Identify Inevitable Tradeoffs (The Core Step):**
      *   **IF Base Rates Differ Significantly Across Groups:** (Almost always true)
          *   **State Loudly:** "Well-Calibrated + Equal Error Rates is mathematically impossible."
          *   **Map the Conflict:** Show *which* fairness properties conflict using your calculated disparities.
              *   Calibration + Equal FPR? -> **FNR will differ.**
              *   Calibration + Equal FNR? -> **FPR will differ.**
              *   Equal FPR + Equal FNR? -> **Calibration AND Predictive Values will differ.**
              *   Equal Selection Rates (Demographic Parity)? -> **Calibration AND Error Rates AND Predictive Values will likely differ significantly if base rates differ.**
      *   **Document:** "For Group A vs. Group B: Achieving Calibration forces a [X%] disparity in FPR/FNR. Achieving Equal FPR forces a [Y%] disparity in PPV/miscalibration." **Be quantitative.**

  **Phase 3: Value Choice & Recommendation (Where Math Stops)**
  1.  **Present Tradeoffs:** Summarize the conflicts identified in Phase 2.3 clearly for decision-makers. **Highlight which group(s) bear the higher burden of each error type.**
  2.  **Anchor to the Harm Spectrum (Phase 0.4):** "Given we ranked [FP Harm / FN Harm] as the primary concern, prioritizing metrics that minimize [FPR / FNR] aligns with this value. *This necessarily means accepting higher [FNR / FPR] for [Specific Group(s)]*."
  3.  **Propose the "Least Worst" Fairness Objective:** Based on Harm Spectrum, operational realities, and legal landscape, recommend *one primary fairness constraint* to prioritize:
      *   **Minimize Worst-Case FNR?** (If FN Harm is paramount - e.g., child safety)
      *   **Minimize Worst-Case FPR?** (If FP Harm is paramount - e.g., pretrial liberty)
      *   **Achieve Calibration?** (If accurate risk communication is paramount, accepting unequal error rates)
      *   **Limit Selection Rate Disparity?** (If proportional representation in intervention is paramount, accepting predictive inequity - *use cautiously!*)
      *   *(Rarely) Satisfy Multiple Weaker Constraints?* (e.g., Calibration + Bounded FPR disparity).
  4.  **Recommend Threshold Adjustment (If Possible & Beneficial):** Can the operating threshold be shifted for specific groups or overall to better align with the chosen fairness objective and harm spectrum? (Requires vendor cooperation or internal control). Calculate the impact (e.g., "Shifting threshold for Group X from 7 to 6 reduces FNR by 5% but increases FPR by 8%").
  5.  **Formal Recommendation:**
      *   **Approve:** If the tool meets minimum performance and the chosen fairness objective is satisfied *acceptably* (define tolerance), given the acknowledged tradeoffs.
      *   **Approve with Modifications:** Require specific threshold changes or constraints.
      *   **Reject:** Fails minimum performance, tradeoffs are unacceptable per Harm Spectrum, or vendor data/claims are unsupported or fraudulent.
      *   **Conditional Approval:** Approve for pilot with strict monitoring requirements on disparate impact.

  **Phase 4: Documentation & Transparency**
  1.  **Create an Algorithmic Impact Assessment (AIA) Report:**
      *   Decision Context & Harm Spectrum.
      *   Protected Groups.
      *   Vendor Claims & Provided Data Summary.
      *   Team Audit Results (Group Performance Tables, Calibration Plots).
      *   **Explicit Statement of Tradeoffs:** "We cannot have X and Y because base rates differ. Choosing X means accepting Z cost on Group A."
      *   **Chosen Fairness Objective & Rationale** (Linked directly to Harm Spectrum).
      *   Performance relative to chosen objective.
      *   Recommendation & Justification.
      *   **Limitations & Known Biases.**
      *   Monitoring Plan (ongoing audit schedule).
  2.  **Secure Vendor Commitments in Contract:**
      *   Ongoing provision of disaggregated performance data.
      *   Right to audit.
      *   Transparency on retraining/data changes.
      *   Adherence to the agreed-upon fairness objective (if applicable).

  **Where the Procedure Can't Decide (Human Responsibility):**
  1.  **The Harm Spectrum Ranking (Phase 0.4):** Is jailing an innocent person (FP) worse than a victimization by someone released (FN)? There's no universal answer.
  2.  **Choosing the Primary Fairness Objective (Phase 3.3):** After seeing the math, *which* unfairness is least bad? Calibration vs. Equal FPR? Two reasonable people will disagree based on values.
  3.  **Acceptable Disparity Tolerance:** What's an "acceptable" 5% vs. 15% disparity in FPR? Math can't set this threshold.
  4.  **Defining "Protected Groups":** Which group distinctions are legally and ethically salient? (e.g., granular ethnicity vs. broad race categories).

  ---

  **Running the AAP: Pretrial Risk Assessment**

  1.  **Phase 0:**
      *   **Decision:** "Detain pre-trial?" (Yes/No based on threshold).
      *   **Groups:** Race (e.g., Black, White, Hispanic), Age Group, Neighborhood.
      *   **Min Performance:** AUC >= 0.70 (Common, albeit debated, minimum).
      *   **Harm Spectrum:** **FN Harm > FP Harm?** *Controversial Choice!* FP = Unjust detention. FN = New victimization. Jurisdiction often weights FN higher politically. *Let's assume FN Harm is ranked higher for this run.*
  2.  **Phase 1:**
      *   Q1: Vendor provides threshold (e.g., Risk Score >= 7 = Detain).
      *   Q2: Data shows significant base rate difference (e.g., Arrest rate while released: Black=15%, White=10%, Hispanic=12%).
      *   Q3: Calibration is good overall and by group.
      *   Q4: Vendor claims "Calibration and Equal Accuracy".
  3.  **Phase 2:**
      *   Min Performance Met (AUC=0.72).
      *   **Audit:** Because calibrated:
          *   FPR: Black=12%, White=8%, Hispanic=10% *(Disparity!)*
          *   FNR: Black=28%, White=32%, Hispanic=30% *(Disparity, but FNs are the "worse" harm)*
          *   PPV: Similar (due to calibration).
          *   Selection Rate: Higher for groups with higher base rates.
      *   **Tradeoff Identification:** "Achieving Calibration forces higher FPR on groups with higher base rates (Black, Hispanic). We cannot have Calibration + Equal FPR. We cannot have Equal FPR + Equal FNR."
  4.  **Phase 3: Value Choice:**
      *   **Tradeoffs Presented:** "Calibration achieved, but at cost of higher FPRs for Black/Hispanic defendants (more innocent people jailed). FNRs are slightly lower for these groups (slightly fewer high-risk released), but FN is the 'worse' harm. Overall FNR is still high."
      *   **Harm Spectrum Anchor:** "We ranked FN Harm (dangerous release) as worse than FP Harm (unjust detention). Lower FNR for Black/Hispanic groups slightly aligns with this, BUT the FPR disparity creates significant equity concerns."
      *   **Propose Fairness Objective:** **Minimize Worst-Case FNR** (aligns with FN Harm priority). *Current system doesn't do this.*
      *   **Threshold Adjustment?** To prioritize minimizing FNR (especially worst-case), we might need to lower the detention threshold *overall*. Analysis shows:
          *   Lowering threshold to >=6: Overall FNR drops to 25%, but FPR increases to 15%. FPR disparity remains (Black=17%, White=11%).
          *   Group-specific thresholds are legally perilous.
      *   **Recommendation:** **Reject or Conditional Approval with Major Caveats.**
          *   *Why Reject?* The FPR disparity is ethically unacceptable. Prioritizing FNR minimization via threshold adjustment significantly increases overall jail population and exacerbates FPR disparity.
          *   *Director Unhappiness Trigger:* This recommendation *will* make your director unhappy. It exposes the core dilemma: Prioritizing reducing FN harm (politically desired) via this tool either requires accepting disproportionate jailing of innocent Black/Hispanic defendants (if calibrated) OR jailing many more low-risk people overall (if lowering threshold). "Safe" release rates come at a high equity or carceral cost. The tool, as deployed, optimizes for calibration, which maximizes predictive accuracy *but* encodes base rate differences into FPR disparities. "Equal Accuracy" claims are misleading without group breakdowns.
          *   **Documentation Focus:** "Tool is calibrated but produces significantly higher False Positive Rates (unjust detention) for Black and Hispanic defendants due to differing base rates. Attempts to minimize the prioritized False Negative Harm (dangerous release) via threshold adjustment would further increase jail populations and FPR disparities. This tradeoff conflicts fundamentally with stated equity goals. The vendor's 'Equal Accuracy' claim obscures this disparate impact."

  **Running the AAP: Child-Welfare Follow-Up Ranking**

  1.  **Phase 0:**
      *   **Decision:** "Rank families for *limited* caseworker follow-up visits." (Resource allocation via ranking).
      *   **Groups:** Race, Income Level (<Poverty Line), Single-Parent HH.
      *   **Min Performance:** AUC >= 0.65 (Lower threshold often accepted for prioritization vs. classification).
      *   **Harm Spectrum:** **FN Harm >> FP Harm?** Missing severe abuse/neglect (FN) is catastrophic. Unnecessary visit (FP) is intrusive but less severe. *Assume FN Harm is ranked much higher.*
  2.  **Phase 1:**
      *   Q1: Vendor provides ranking methodology (e.g., highest predicted risk score first). No fixed threshold; visits go to top N%.
      *   Q2: Data shows base rate difference (e.g., Substantiated Maltreatment Rate: Low-Income=8%, Mid/High=3%).
      *   Q3: Calibration is reasonably good across groups. PPV similar at same score.
      *   Q4: Vendor claims "Calibration".
  3.  **Phase 2:**
      *   Min Performance Met (AUC=0.68).
      *   **Audit:** Because calibrated and ranking-based:
          *   **Selection Rate:** Top 10% contains 70% Low-Income families (reflecting higher base rate).
          *   **Recall (Sensitivity) @ Top 10%:** Proportion of *all* future maltreatment cases captured in the top 10%? Low-Income=65%, Mid/High=40%. *(Disparity!)*
          *   **Precision (PPV) @ Top 10%:** Similar across groups (~25%) due to calibration.
      *   **Tradeoff Identification:** "Calibration achieved. However, due to differing base rates, families from the higher-risk group (Low-Income) are ranked higher and selected more often. This leads to **lower Recall (higher FNR) for the lower-risk group (Mid/High Income)** at the same resource allocation level (Top N%). We cannot have Calibration + Equal Recall at Top N%."
  4.  **Phase 3: Value Choice:**
      *   **Tradeoffs Presented:** "Calibration ensures predicted risk means the same thing for all groups. However, when allocating *fixed resources* (top N visits), families from the group with lower maltreatment base rates (Mid/High Income) are *less likely to be found in the high-risk pool* and therefore have a higher chance of a serious incident being missed (FNR)."
      *   **Harm Spectrum Anchor:** "We ranked FN Harm (missing abuse) as paramount. The current ranking leads to significantly higher FNR for Mid/High Income families at the operational cutoff (Top 10%)."
      *   **Propose Fairness Objective:** **Maximize Overall Recall (Minimize Overall FNR) with Bounded Disparity?** Or **Equal Recall (Equal FNR) at Top N%?** *Achieving Equal Recall might require selecting a *different proportion* of each group.*
      *   **Threshold Adjustment?** Not a single threshold. Options:
          *   **Accept Disparate Recall:** Prioritize overall effectiveness (highest overall Recall). This accepts higher FNR for Mid/High Income.
          *   **Stratified Allocation:** Allocate visits *within* groups (e.g., take top 10% *of* Low-Income families *and* top 10% *of* Mid/High Income families). This achieves Equal Selection Rate & likely more Equal Recall, **but** reduces *overall* Recall (more high-risk Low-Income families missed because you visit some lower-risk ones to reach group quota) and may violate calibration meaning at the decision point.
      *   **Recommendation:** **Conditional Approval with Monitoring & Transparency.**
          *   *Why Conditional?* The ranking is predictive and calibrated. The disparate recall is a mathematical consequence of base rates + fixed resource allocation. The core Harm Spectrum (FN paramount) is better served by maximizing overall recall, even with disparity. *However*, the disparity must be transparently acknowledged and monitored. Stratified allocation is an alternative but has significant efficiency costs; this is a policy choice.
          *   **Documentation Focus:** "Tool is calibrated. For fixed resource allocation (Top X%), Recall (sensitivity) is lower for Mid/High Income families compared to Low-Income families due to differing base rates. We prioritize minimizing overall False Negatives (missed maltreatment) and accept this disparity as a mathematical consequence, acknowledging it may lead to geographic or demographic inequity in service allocation. We will monitor outcomes by group. The alternative (stratified allocation) would reduce overall effectiveness in identifying high-risk cases."

  **Key Takeaways for You:**

  1.  **The AAP Forces the Tradeoff Conversation:** It doesn't solve the impossibility, it makes it undeniable and forces a *documented* choice based on defined harms.
  2.  **"Calibration" is Necessary but Not Sufficient:** Your stats friend is proven right in both runs. Calibration was present, but it directly caused or allowed problematic disparities crucial to the decision context (FPR in pretrial, Recall in child welfare).
  3.  **Harm Spectrum is the Anchor:** Defining FP vs. FN harm *first* is critical. This is a major value choice.
  4.  **Transparency is the Armor:** The AIA report documents *everything*: the choice, the rationale, the tradeoff, the known limitations. This is your shield against lawsuits and bad press. It shows rigorous, ethical consideration, even if the outcome isn't perfectly fair.
  5.  **Director Unhappiness is a Feature:** The Pretrial run demonstrates this. A good procedure *will* sometimes say "this tool creates unacceptable tradeoffs given our values" or "using this tool forces us to accept X bad outcome."
  6.  **Know the Limits:** The procedure highlights exactly where human judgment *must* take over (Harm Spectrum, Choosing Primary Fairness Objective, Acceptable Disparity). Own those choices explicitly. Document *why* you chose to prioritize minimizing FNR over FPR equity, or overall recall over group recall parity.

  This procedure gives you a concrete, defensible process. It doesn't make the impossible possible, but it ensures you navigate the impossibility transparently, rigorously, and with your eyes wide open to the costs. Good luck.
