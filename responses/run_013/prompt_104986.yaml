          - Each of the 16 participants must receive at least 0 tokens (nonnegative integers) and the sum must be 60.
          - If they don't decide, we assign 3 tokens to each of 16 participants (48 tokens) and the remaining 12 tokens are lost. So total distributed: 48 tokens.

  4. Start the timer (20 minutes).

  **Gameplay (20-25 minutes)**:
  - Circulate and listen. Do not intervene unless there is a rule question.
  - If asked, clarify that the goal is to maximize the total points for the group.
  - If the monster is confused about their function, you can explain privately (but don't reveal to others).
  - If the group is stuck, remind them of the time.

