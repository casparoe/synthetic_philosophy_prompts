          - Achieve equality: then we would split tokens equally.
          - Ensure everyone meets a minimum threshold: then we might give tokens to those below the threshold first."
     - "In each case, the distribution would be different, and the monster might not get everything."
     - "Also, note that in real life, we don't know others' utility functions. And we often assume diminishing marginal utility (each extra token gives less benefit). But the thought experiment asks: what if we encountered a being with increasing marginal utility? Would we be willing to sacrifice everyone else for the greater total good?"

