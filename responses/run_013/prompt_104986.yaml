     - Recalculate the monster's points for the number of tokens they actually received. Then recalculate the total points for the group. (It will be lower than before because the superlinear function was replaced by a concave one.)
     - Then ask: "If the monster had this function from the start, what split would have maximized the total points? Let's try to find a better split." 
          - Guide them to see that giving too many tokens to the monster is no longer optimal. We can do a quick calculation: if the monster gets 30 tokens and the rest 30 tokens are distributed to others (say 2 tokens each for 15 people), then:
