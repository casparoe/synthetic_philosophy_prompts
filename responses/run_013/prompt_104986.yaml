     - If participants say, "We wouldn't do that in real life," respond:
          - "Exactly! This thought experiment challenges utilitarianism because it leads to a distribution that feels deeply unfair. Our moral intuitions tell us that it's wrong to leave everyone else with nothing, even if it maximizes total utility. This suggests that we might value fairness, rights, or other considerations beyond total utility."

  6. **Limitations**:
     - Acknowledge: 
          - "In this game, we assumed that utility functions were known and comparable. In reality, we can't measure utility directly or compare across people."
          - "The thought experiment assumes that such a monster could exist, but in practice, we usually assume diminishing marginal utility."
          - "The utility monster is a critique of pure utilitarianism, but it doesn't mean utilitarianism is wrong. It might mean we need to adjust it (e.g., with fairness constraints) or consider other ethical frameworks."

  **Wrap-up**:
  - Thank the group for participating.
  - Open the floor for final questions.

  **What Could Go Wrong**:
  - **The group doesn't believe the monster or doesn't give them many tokens**: Use the actual outcome in the debrief. Compare the total they achieved with the theoretical maximum (which they didn't reach). Discuss why they were reluctant (trust? fairness?).
  - **The calculation of the monster's points is complex**: Have a calculator ready. Simplify the function if needed (use fewer steps). For the diminishing returns, use a precomputed table.
  - **Time runs short in debrief**: Focus on the key points: the monster emerged because of the utility function and the goal, and then flip the function to show the monster vanishes.

  This design should meet your goals and fit within the time.
