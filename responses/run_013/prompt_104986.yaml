  ### **Facilitator Script: The Token Distribution Game**  
  *Total Time: 75 minutes*  
  **Materials Needed**: 16 secret cards (details below), 60 identical tokens (coins, chips, or printed slips), whiteboard, markers, calculator (for facilitator).  

  ---

  ### **Phase 1: Setup & Game (30-35 mins)**  
  **Rules for Facilitator (read aloud verbatim):**  
  > "Welcome! Today, we’re running a collaborative resource game. Here’s how it works:  
  > 1. **Your Goal**: Distribute 60 tokens among the group to **maximize total group points**. Points are calculated based on your *secret multiplier*, which you’ll find on your card.  
  > 2. **Your Card**: Each of you has a card with a secret number or rule. *Do not show it to anyone yet.* You may **verbally describe** your multiplier to others, but *no showing cards or writing numbers down*.  
  > 3. **Discussion**: You have 20 minutes to negotiate. Anyone can propose a distribution. Once a proposal is made, we’ll vote. If >50% agree, that’s our split. If not, keep discussing.  
  > 4. **Tokens**: Tokens must be distributed in whole numbers (no fractions).  
  > 5. **Clarifications**: Ask me *only* about rules, not about strategy. I won’t intervene otherwise."  

  **Hand Out Cards**:  
  - Prepare 16 cards in sealed envelopes (for secrecy). Most cards are **linear multipliers**:  
    - 10 cards: Multipliers 1–3 (e.g., "Your points = tokens × 2").  
    - 5 cards: Multipliers 4–5 (e.g., "Your points = tokens × 5").  
  - **1 Monster Card** (for a participant at random):  
    > "Your points are calculated in tiers:  
    > • Tokens 0–10: 10 points each  
    > • Tokens 11–20: 20 points each  
    > • Tokens 21–30: 30 points each  
    > • Tokens 31–40: 40 points each  
    > • Tokens 41–60: 50 points each  
    > *Example*: If you get 25 tokens, points = (10×10) + (10×20) + (5×30) = 100+200+150 = 450."  

  **Facilitator Notes During Game**:  
  - **Start the timer (20 mins)**. Observe but don’t interfere.  
  - **Predictable Issues & Solutions**:  
    - *Problem*: The monster downplays their ability ("I’m only worth 10 per token!").  
      - *Solution*: Remind players they can *verbally share details* from their card. No need to correct them.  
    - *Problem*: Group defaults to equal split (e.g., 60/16 ≈ 4 tokens each).  
      - *Solution*: At 10 mins, remind neutrally: "Remember, your goal is to maximize *total* points, not individual fairness."  
    - *Problem*: Stalemate.  
      - *Solution*: If no agreement by 20 mins, impose a default split: 4 tokens to 15 people, 0 to one. Use this for calculations.  

  ---

  ### **Phase 2: Reveal & Calculation (10 mins)**  
  **Step 1: Secret Point Calculation**  
  > "Everyone: Calculate your points *privately* based on your tokens received. Write your **multiplier, tokens, and points** on a slip of paper. *Keep it hidden.*"  

  **Step 2: The Grand Reveal**  
  - On the whiteboard, draw a table: **Participant | Multiplier | Tokens | Points**.  
  - Go around the room. For each person:  
    1. Ask: "How many tokens did you get?" Record under "Tokens."  
    2. Ask: "What was your multiplier?" Record verbatim (e.g., "tokens × 3" or "tiered: 10/20/30...").  
    3. Ask: "What points did you calculate?" Record.  
  - **Save the monster for last**. When you reach them:  
    > Facilitator: "Can you read your multiplier rule aloud?"  
    > (After they read it): "How many tokens did you have? [...] Let’s verify your points together."  
    > *Calculate publicly on the board, breaking down the tiers (e.g., "You had 45 tokens: 10×10=100, 10×20=200, 10×30=300, 10×40=400, 5×50=250 → Total 1,250").*  

  **Step 3: Sum and Compare**  
  - Add all points for the **Total Group Points**.  
  - Contrast with an "equal split" scenario (e.g., 4 tokens each):  
    > "If everyone got 4 tokens:  
    > - 15 people: 4 × [avg. multiplier 3] = 180 points  
    > - Monster: 4 tokens × 10 = 40 points  
    > Total ≈ 220 points.  
    > Our actual total: [e.g., 1,500]. We did better!"  

  ---

  ### **Phase 3: Debrief (20-25 mins)**  
  **Guide the discussion using questions. Key goals:**  
  1. **Name the Monster** (3 mins):  
     > "What you experienced has a name: the **Utility Monster**. Philosopher Robert Nozick created it to challenge utilitarianism. It’s a being that gains vastly more utility from resources than others. In our game, who was the monster? *[Point to the tiered function]*."  
     - Highlight: "The monster’s utility was **superlinear**—more tokens → higher *per-token* value. That’s why giving them 45 tokens added 1,250 points, while giving 45 tokens to others might add ~135 points."  

  2. **Flip the Utility Function** (5 mins):  
     - Change the monster’s rule to **diminishing returns** (e.g., "Points = 100 × √(tokens)").  
     > "Recalculate the monster’s points with the *same tokens* under this new rule. If they got 45 tokens: √45 ≈ 6.7 → 670 points (down from 1,250)."  
     - **Key Insight**: "With diminishing returns, the monster ‘shrinks.’ Total maximization might now spread tokens more evenly. The monster isn’t inherent—it depends on the *shape* of the utility function, which outsiders can’t see."  

  3. **Challenge the "Obviously We Wouldn’t Do That" Reflex** (5 mins):  
     - Ask: "How many of you felt uneasy giving one person most tokens? Why?"  
       - *Anticipated responses*: "Unfair," "We can’t trust them," "Others got nothing."  
     > "This unease is the point! Nozick argues that utilitarianism fails because it ignores rights/equality. We *intuitively* reject feeding the monster—even if it maximizes total utility. That’s not a dodge; it reveals that we value more than just totals."  

  4. **Aggregation Isn’t the Problem—The Rule Is** (5 mins):  
     - **Change the goal**:  
       > "What if our goal was to **maximize the worst-off person’s points**? How would tokens distribute?"  
       → *Equal split, ignoring the monster.*  
       > "Or to **hit a minimum threshold** (e.g., everyone gets ≥20 points)?"  
       → *Tokens spread to those with low multipliers.*  
     - **Conclusion**: "The monster only emerges under *total utility maximization*. Other rules (maximin, sufficiency) avoid it. The problem isn’t aggregation—it’s the specific rule we chose."  

  5. **Limitations & Wrap-Up** (2 mins):  
     - **Acknowledge gaps**:  
       > "This game simplifies real life:  
       > - We assumed perfect knowledge of utilities (you saw cards). In reality, we can’t observe others’ inner experiences.  
       > - Real utility monsters might manipulate their perceived needs (e.g., 'I *deserve* more!').  
       > - Nozick’s original monster has linear utility (fixed high multiplier), not tiers. But the core challenge is the same."  
     - **Final note**: "Don’t dismiss the monster as a trick. It exposes a tension: Should we sacrifice fairness for total good? That’s a live debate in ethics, policy, and AI alignment."  

  ---

  ### **Predictable Problems & Solutions**  
  - **Monster isn’t persuasive**: If the monster gets few tokens, use the reveal to show the *missed opportunity* ("Total could have been 1,500; we got 800"). This still proves the monster’s potential.  
  - **Technical confusion**: Pre-calculate examples of the monster’s points (tiers and diminishing returns) to avoid math errors.  
  - **Skepticism about tiers**: Explain that superlinear utility exists in real contexts (e.g., startup scaling, addiction) but is rare. The point is hypothetical.  
  - **Time crunch**: Shorten discussion or skip equal-split comparison. Prioritize the debrief.  

  ### **Why This Works**  
  - **Discovery-based**: Players *experience* the monster emerging from rational choices, making the reveal impactful.  
  - **Debrief structure** moves from observation ("what happened?") to critique ("why does it matter?") to broader implications ("other ethical rules").  
  - **The utility flip** visually demonstrates how the monster’s power hinges on hidden functional forms.  

