  1. **Reflection on the Process (5 minutes)**:
     - Ask the group: 
          - "How did the discussion go? Was it easy or hard to decide?"
          - "Did the monster reveal their function? How did the group react?"
          - "What principles did you use to distribute the tokens? Did anyone argue for fairness even though the goal was total points?"

  2. **Introducing the Utility Monster (5 minutes)**:
     - "What happened in this game is an illustration of a thought experiment in philosophy called the 'utility monster'."
     - Briefly explain: The utility monster is a hypothetical being that gets so much more utility from resources that it maximizes total utility to give it everything. In our game, the monster's utility function had increasing marginal utility, which made it optimal to give them most of the tokens.
     - Highlight: The group total we achieved (if they gave a lot to the monster) was much higher than if we had distributed equally.

