prompt: |-
  I'm in a formal epistemology seminar this term and we just spent two weeks on anthropic reasoning, and it's turned into a 1am kitchen argument with my roommate (physics PhD, thinks the whole area is obviously settled) that neither of us can win. What I want from you is not a summary of what everyone thinks — I've read the summaries and they're all about other peoples positions — but a principle, if there is one, that actually generates the verdicts I keep having. Here are the five cases I care about. (1) Sleeping Beauty, except on tails she's woken on four days instead of two, memory wiped in between: on waking I say it's 1/5 that the coin was heads. (2) A sealed envelope tells me my birth rank among all humans who will ever live is about 60 billion, and that nobody will ever tell me anything else about the future: I say this shouldn't move my credence at all about whether humanity's total is going to be enormous. (3) Two theories fit everything I will ever observe equally well; one says the universe contains about 10^11 observers in total, the other about 10^30. I say my existence is not evidence for the big one. (4) A coin decides whether one room or a billion rooms get built, and in each room a person wakes up with my memories and my body; I wake up in a room. Here I say it's the billion-room world, near enough to certain. (5) Suppose the number of observers who form by random fluctuation with false memories of a life like mine (my roommate calls them Boltzmann brains) vastly outnumbers the ordinary observers. I still say I'm almost certainly not one of them.

  (2) and (3) against (4) I can sort of see how you'd reconcile — maybe I'm only counting observers who'd have my evidence — except (5) kills that, since the fluctuations would have exactly my apparent evidence and I still refuse to count them. And I have a feeling that in (1) it matters that it's *me* woken four times and not four different people who each think they're me, but in (4) I'm happily counting a billion people who merely think they're me, so I definately can't defend that. My roommate keeps saying "self-sampling" and "self-indication" at me like they're obviously different things and I just nod along.

  What I want back: (a) the principle, stated precisely, in a sentence or two up front — or if there isn't one, the two or three candidate principles, with exactly which verdicts each one gets and which it loses; (b) for each clause of the principle, the case above that forces it; (c) its verdict on at least two cases I haven't listed, ideally ones where I'll feel the pull the other way; (d) an honest note on which of my five verdicts it can't have, and which I should give up. Under 900 words, and please don't pad it with the history of the debate.
reasoning: |-
  Okay, the user is in a formal epistemology seminar and has been studying anthropic reasoning. They've got into a heated argument with their roommate, a physics PhD who thinks it's all settled. The user presents five specific cases where their intuitions clash with standard positions. They want a clear principle that explains their verdicts, not just summaries of existing views.

  First, I need to understand their five cases:
  1. Modified Sleeping Beauty: Heads she wakes once, tails four times. User says P(heads) = 1/5.
  2. Birth rank info: Knowing they're the 60 billionth human shouldn't affect credence about total population size.
  3. Two universe theories: Small (10^11 observers) vs large (10^30). Their existence isn't evidence for larger universe.
  4. Coin-flip room creation: Heads - one room, tails - billion rooms. User wakes in a room and thinks it's almost certainly the billion-room scenario.
  5. Boltzmann brains: Vastly outnumber ordinary observers, but user believes they're almost certainly not one.

  The user's positions seem contradictory. In case 4, they accept that being one of many copies makes tails likely, but in case 5 they reject being a Boltzmann brain despite being vastly outnumbered. They mention self-sampling and self-indication but seem confused about the difference.

  Looking for a principle that explains all five. Self-Sampling Assumption (SSA) would say to reason as if randomly selected from observers. This gives P(heads)=1/5 in case 1, and in case 4 P(tails)≈1 since you're more likely to be in a room if there are more rooms. But SSA makes birth rank informative in case 2 and favors larger universes in case 3, which contradicts the user's views.

  Self-Indication Assumption (SIA) says existence is evidence for hypotheses that predict more observers. This matches the user on case 4 (strongly favors tails) but disagrees on case 3 (SIA would favor large universe) and case 5 (SIA would make Boltzmann brains likely).

  The user's position seems to be: when there are multiple subjectively indistinguishable observers, reason as if randomly selected from them (like SSA), but only count observers that could be "me" in some identity sense. But they reject this in case 5 where Boltzmann brains are subjectively identical.

  Perhaps the distinction is between observers produced by different processes. In case 4, all rooms are created the same way, while Boltzmann brains form through random fluctuations. So maybe a principle that weights by the probability of the observation under the hypothesis.

  Let me formulate a principle: "Reason from the first-person perspective: hypotheses are weighted by their probability of producing an observer with exactly your subjective experience, through processes consistent with your evidence." This would:
  - Case 1: Heads produces one experience, tails four, so P(heads)=1/5
  - Case 2: Birth rank info is part of the experience, but both large/small total populations can produce rank 60B, so no update
  - Case 3: Both universes can produce observers with your experience, but small universe has higher density? Wait no, if observers are similar, P(experience) might be similar, so no evidence
  - Case 4: Tails has billion times more chances to produce your experience, so strongly favors tails
  - Case 5: Boltzmann brains have extremely low probability of forming with exactly your memories, while ordinary observers have high probability, so favor ordinary

  This seems to match all five. The key is weighting by the probability of generating the specific experience, not just number of observers.

  For additional cases:
  - Doomsday argument: If SSA, being early is evidence total population is small. But under this principle, if birth ranks are assigned randomly, early ranks are more likely in small populations, so should update. But user might reject Doomsday argument, so need a case where this principle disagrees with intuition.

  Case 6: Coin flip, heads: one observer created, tails: two identical observers created with same memories. You exist. Under this principle, P(tails) = 2/3 since two chances vs one. But some might think it should be 1/2.

  Case 7: Same as above but tails creates one observer with your memories, and one with different memories. Then P(your experience) is equal under heads and tails, so P(heads)=1/2.

  The principle is: "First-Person Opportunity Principle (FPOP): Assign credence to hypotheses in proportion to their prior probability multiplied by the number of observer-moments (or observers) they predict that are subjectively indistinguishable from your current evidence."

  Clauses:
  - "subjectively indistinguishable": explains case 5, since Boltzmann brains have negligible probability of matching your full experience
  - "observer-moments": handles Sleeping Beauty where same person multiple times
  - "prior probability": incorporates that Boltzmann processes have low prior

  Verdicts:
  - Case 1: Heads:1 moment, tails:4 → P(heads)=1/5
  - Case 2: Both hypotheses can produce rank 60B, no update
  - Case 3: Both can produce your evidence, but if priors equal, no evidence from existing
  - Case 4: Tails has 10^9 times more indistinguishable observers → P(tails)≈1
  - Case 5: Ordinary observers have high P(your experience), Boltzmann brains extremely low → not Boltzmann

  Additional cases:
  - Case 6 (same as above): P(tails)=2/3. User might feel pull toward 1/2.
  - Case 7: Tails creates one identical and one different observer. Then P(your exp) equal under heads and tails, so P(heads)=1/2.

  FPOP can't defend the intuition in case 6 if user thinks P(tails) should be 1/2. They might need to accept 2/3 or adjust the principle.

  Honest note: FPOP might seem ad hoc, but it systematizes the user's judgments. The user should be consistent: in case 4 they accept being one of many copies makes tails likely, so in similar cases (like 6) they should accept higher P(tails).
answer: |-
  Here's a principle matching your verdicts, derived from your cases. It avoids standard self-sampling/self-indication and centers on **first-person evidence generation**.

  **The Principle (First-Person Opportunity Principle - FPOP):**  
  *Assign credence to hypotheses in proportion to (a) their prior probability multiplied by (b) the number of subjectively indistinguishable observer-moments they predict, but only if those moments arise through processes consistent with your evidence about how observers like you are produced.*

  ### Clause Breakdown & Case Enforcement:
  1. **"subjectively indistinguishable observer-moments"**: Counts moments indistinguishable *from your current perspective*.  
     → *Enforced by (1)*: In Sleeping Beauty, tails has 4 moments like yours (not 4 people), heads has 1 → P(heads) = 1/5.  
  2. **"arise through processes consistent with your evidence"**: Only count observers generated by mechanisms your evidence doesn't rule out.  
     → *Enforced by (5)*: Boltzmann brains form via random fluctuations (low-probability process), not stable evolution. Your evidence (e.g., coherent memories) rules this out as improbable, so you don't count them.  
  3. **"prior probability"**: Hypotheses start with intrinsic plausibility before anthropic updates.  
     → *Enforced by (3) & (5)*: A 10³⁰-observer universe isn't inherently more likely than a 10¹¹-observer one (same prior), and Boltzmann scenarios have low prior due to instability.  

  ### Verdicts on Your Cases:
  - (1) **P(heads) = 1/5** (tails has 4x moments → 4:1 odds against heads).  
  - (2) **No update on total humans**: Birth rank 60B is consistent with both small/large totals; no process inconsistency.  
  - (3) **No evidence for big universe**: Same priors; both can produce your evidence.  
  - (4) **Near-certain billion-room world**: Tails predicts 10⁹x more indistinguishable moments via identical process → overwhelms priors.  
  - (5) **Not a Boltzmann brain**: Their formation process is inconsistent with your evidence (improbably low entropy), so they aren't counted.  

  ### New Cases Showing Tension:
  6. **Coin-Generated Clones**: A coin is flipped. Heads: only you exist. Tails: a perfect clone (same memories/body) is created alongside you. You wake up.  
     → *FPOP verdict*: P(tails) = 2/3 (two indistinguishable moments under tails, one under heads).  
     → *Tension*: You might intuit P(tails) = 1/2 ("the coin is fair"), but FPOP weights your existence as evidence for tails.  

  7. **Doomsday Argument Lite**: You know humans will exist for either 100 or 100,000 generations. You’re in an early generation (e.g., 1st percentile).  
     → *FPOP verdict*: Slightly favors 100-generation hypothesis (more early observers relative to total under small total).  
     → *Tension*: You might resist this (like case 2), but FPOP treats your birth rank as a distinguishable property.  

  ### What FPOP Can't Defend & What to Give Up:
  - **Can't defend**: Naive "I'm probably not a duplicate" in cases like (4). FPOP says you *should* think you're in the billion-room world because your evidence is duplicated.  
    → *Give up*: Your intuition that "merely thinking they're me" shouldn't count in (4) — under FPOP, indistinguishability forces you to count them.  
  - **Can defend all your verdicts** if you accept:  
    (i) Boltzmann brains are excluded on process grounds (not just numbers),  
    (ii) In (4), duplication *is* evidence for tails.  

  ### Why This Works:
  FPOP avoids treating "me" as a metaphysical identity. Instead, it weights hypotheses by how likely they are to produce *an observer with exactly your current subjective evidence*. It splits the difference between self-sampling (which would fail (2)/(3)) and self-indication (which would fail (5)). Your roommate's "obviously settled" physics view likely ignores the **process-consistency** clause, which is why (5) feels different than (4).  

