  Noticing they didn't ask about gender/time disparities or gig economy implications. But sticking to their specified objections shows respect for their expertise. They've clearly curated these six points deliberately.

  ...Double-checking if all required objections are covered. Yep - welfare, work-ethic, karoshi, primary-good, meaning, rights. Six objections plus the closing question. Perfect.

