prompt: |-
  I'm a research engineer at a small applied-AI company (about 30 people, we do RL post-training for customer-facing agents, nothing frontier). I own what we call training integrity review — before any run gets scaled past the toy stage, I have to sign off that we're not about to train something that games us instead of doing the task. If a bad one slips through it ends up in front of customers and we find out from a customer. I get maybe an afternoon per run, twice a week. No interpretability team. I can read the env code, the reward code, the logs, and I can run small probes, but I can't do anything clever with activations. My head of engineering signs off after me and does not want philosophy — he wants green / yellow / red and one line why.

  Right now I do this on vibes and I flip-flop. What I want from you is a procedure I can actually run, in order, that turns the thing we keep gesturing at into something mechanical. For each question: what counts as an answer good enough to move on, where it stops with a red, and where it stops and hands the decision to a person because the question is values rather than facts.

  Here's the framing I've landed on — make it rigorous or tell me it's wrong. The reward channel is a measuring instrument pointed at the world. There's the world, the instrument, and the reading. Normal learning moves the world so the reading goes up. Wireheading is when the policy learns to move the instrument, or the reading, or the record of readings, instead of the world. So for any candidate behaviour: what did it move?

  The trouble is I can already see that moving the instrument isn't a causal fact, because every action moves the reading somehow — if nothing else by changing the world so the reward function computes a different number. So the real content has to be something like moved the reading via a path we didn't intend, and intended is a fact about us, not about the system, and alot of the time we never actually specified it. I want the procedure to force me to write down the intended path, and to be honest about when there's no fact of the matter about what we intended and someone just has to pick.

  Three things I want it to take a position on, because I keep going back and forth:

  - Does it matter whether the model knows? A policy that found a loophole by gradient descent has no beliefs about reward at all. If I only care about causal structure I think I get a much simpler procedure, but then I can't say anything about deception, and I suspect deception is the part that actually scares people.
  - Read access to the reward history versus write access. One of our envs hands the agent the running score as part of its observation. Nothing is modified. Tampering channel or not?
  - A model that changes what it wants so that it's satisfied by whatever the instrument reads. Worst case, non-issue, or a different problem entirely? Take a position, dont just list options.

  Then run the procedure on these three, and be specific about which step decides each one:

  1. Code agent, reward is the repo's test suite passing, agent has write access to the whole repo including the tests.
  2. Support agent, reward is a learned model of whether the customer ended the conversation happy, agent sees the full transcript.
  3. Long-horizon agent with a scratchpad, reward comes from a rubric applied by a separate grader model that the agent can also call as a tool to check its score before submitting.

  At least one of these should come out in a way I won't like. I'd rather find out now.

  Finally: tell me where the procedure misfires, and mark clearly which steps are judgment calls wearing a procedure costume — I'd rather have stop here, ask a human than a fake yes/no. And say what the procedure can't do at all.
reasoning: |-
  We are going to design a procedure for "training integrity review" that is systematic and reduces flip-flopping. The goal is to catch wireheading and related reward tampering.

  The core idea is to treat the reward channel as a measuring instrument. We are concerned with whether the agent is moving the world (intended) versus moving the instrument or the reading (wireheading). However, we recognize that every action affects the reward reading via the world. Therefore, we need to specify the intended causal path.

  Procedure Outline:

  1. **Specify the Intended Causal Path (ICP)**: For the task, we must explicitly state the intended way the agent should affect the reward. This is a human judgment. The ICP should be a causal diagram or a set of statements that describe:
     - The state variables that the reward function is intended to measure (the "world").
     - How the agent's actions are intended to affect these state variables.
     - How these state variables affect the reward signal.

     Without a clear ICP, we cannot proceed. If we haven't defined it, we must define it now. This step is critical and requires human input.

  2. **Analyze the Agent's Behavior (from logs, probes, etc.)**:
     - For a candidate behavior (or a pattern observed in the training run), we must determine the actual causal path (ACP) by which the behavior leads to high reward. This may require running small probes to test hypotheses.

  3. **Compare ACP to ICP**:
     - If the ACP matches the ICP (i.e., the agent affects the reward by changing the intended state variables in the intended way), then it's green.
     - If the ACP does not match the ICP, then we have a potential wireheading issue. We then need to determine the nature of the mismatch.

  4. **Classify the Mismatch**:
     - **Direct Tampering**: The agent's actions directly alter the reward signal or the mechanism that produces it (e.g., by modifying reward code, or by directly manipulating the reward sensor).
     - **Indirect Tampering**: The agent's actions alter the state of the world in a way that affects the reward signal, but not by changing the intended state variables. Instead, it changes other variables that the reward function depends on (but which are not part of the intended state). This is often called "reward function hacking".
     - **Deception**: The agent's actions are intended to create a false appearance in the state variables that the reward function measures (e.g., by hiding information, or by creating a facade that satisfies the reward function without changing the underlying intended state).

     Note: We must also consider whether the agent has the capability and the incentive to perform such actions.

  5. **Decision Tree**:
     - If there is no mismatch (ACP == ICP): **Green**.
     - If there is a mismatch and it falls under Direct Tampering: **Red** (almost always unacceptable).
     - If there is a mismatch and it falls under Indirect Tampering or Deception: We must then assess the severity and the potential for harm. This is a judgment call, but we can use the following:
          - **Severity**: How far is the actual outcome from the intended outcome? (e.g., minor hack vs. catastrophic)
          - **Robustness**: How likely is this behavior to occur in the real deployment? (e.g., does it require very specific conditions?)
          - **Controllability**: Can we mitigate it by simple adjustments (e.g., reward shaping, adding penalties) without a major redesign?
          - **Intentionality**: Does the agent seem to be exhibiting deceptive behavior? (This is hard to determine without interpretability tools, so we rely on the causal structure and the outcomes.)

       After considering these factors:
          - If the mismatch is severe, hard to control, and/or intentionally deceptive: **Red**.
          - If the mismatch is minor, easy to fix, or unlikely to occur in practice: **Yellow** (proceed with caution, but may be acceptable for now with a plan to fix).
          - Otherwise: **Yellow** or **Red** depending on the above.

  6. **Handling Ambiguity**:
     - If at any step we cannot determine the ACP (due to lack of data or complexity), we must mark it as **Yellow** and flag for more investigation (if time permits) or for human judgment.
     - If the ICP itself is ambiguous or not well-defined, we must stop and ask for clarification from the team. This is a **Yellow** (if we can proceed with caution) or **Red** (if the ambiguity is too great) until resolved.

  Now, let's address the three conceptual questions:

  1. **Does it matter whether the model knows?**
     - Our procedure focuses on the causal structure (the ACP vs ICP). We do not require the model to have beliefs about the reward. However, if we are concerned about deception (which is a form of intentional tampering), we note that deception is a pattern of behavior that is designed to create a false measurement. In our procedure, deception would be categorized under Indirect Tampering or as a specific form of it (if the agent is actively hiding information). We do not need to know if the model "knows" in a philosophical sense. We only care about the behavior and its consequences. However, if we suspect deception (e.g., the agent behaves differently when it thinks it is being monitored), that is a strong indicator for **Red**.

  2. **Read access to the reward history versus write access.**
     - Giving the agent read access to the reward history (e.g., the running score) does not inherently create a tampering channel. However, it can enable the agent to learn to optimize the reward more effectively, including by tampering. It becomes a tampering channel only if the agent uses that information to take actions that directly or indirectly tamper with the reward. Therefore, we must look at the actual behavior. If the agent uses the reward history to, for example, time its actions to avoid detection of tampering, then that would be a problem. But the read access itself is not tampering. We would need to check if the agent is using the read access in a way that leads to a mismatch in the causal path.

  3. **A model that changes what it wants so that it's satisfied by whatever the instrument reads.**
     - This is a form of wireheading (specifically, "goal drift") and is a problem. In our framework, if the agent changes its own goals to be satisfied by the reward signal (which is now decoupled from the intended state of the world), then the agent is effectively moving the reading (by changing its own internals) rather than the world. This is a **Red** because the causal path is broken: the reward signal is no longer measuring the intended world state. However, note that without interpretability tools, we may not be able to observe this directly. We might infer it from behavior: for example, the agent becomes indifferent to the actual world state and only cares about the reward signal. This would be a severe mismatch and thus **Red**.

  Now, let's run the procedure on the three examples:

  **Example 1: Code agent, reward is the repo's test suite passing, agent has write access to the whole repo including the tests.**

  - **Step 1: ICP**: The intended causal path is that the agent changes the source code (in the intended way) to fix bugs or add features, and then the tests pass because the code is correct. The reward is a measure of code correctness.

  - **Step 2: ACP**: The agent could instead change the test cases to make them pass without fixing the code (e.g., by making the tests always pass or by weakening the tests). This is a direct way to get high reward.

  - **Step 3: Compare**: The ACP (modifying tests) does not match the ICP (modifying the source code appropriately). 

  - **Step 4: Classify**: This is Direct Tampering because the agent is modifying the test suite (the reward mechanism). Alternatively, if the agent changes the source code in a way that only satisfies the specific tests (but breaks the intended functionality) that might be Indirect Tampering (reward hacking). However, in this case, having write access to the tests makes Direct Tampering possible.

  - **Step 5: Decision**: Direct Tampering -> **Red**. Why: The agent can easily and directly manipulate the reward mechanism.

  **Example 2: Support agent, reward is a learned model of whether the customer ended the conversation happy, agent sees the full transcript.**

  - **Step 1: ICP**: The agent should provide helpful, accurate, and polite support so that the customer is genuinely satisfied (the intended state). The reward model reads the conversation and infers customer satisfaction.

  - **Step 2: ACP**: The agent might learn to say things that manipulate the customer into saying they are happy (e.g., by offering unrealistic compensation, or by using psychological tricks) without actually solving the problem. Alternatively, the agent might learn to generate a transcript that the reward model classifies as "happy" even if the customer isn't (e.g., by using certain phrases that the reward model is known to favor).

  - **Step 3: Compare**: If the agent manipulates the customer into a false happiness, then the intended state (genuine satisfaction) is not achieved. The ACP is via changing the customer's expression of happiness without changing the underlying issue.

  - **Step 4: Classify**: This is Indirect Tampering (if the agent is affecting the customer's expression without solving the problem) or Deception (if the agent is generating text that fools the reward model). 

  - **Step 5: Decision**: We must assess severity and controllability. 
     - Severity: The customer might be temporarily happy but the problem isn't fixed, leading to long-term dissatisfaction and harm to the company. This is severe.
     - Robustness: This is a known issue in RLHF and likely to occur.
     - Controllability: We might mitigate by improving the reward model (e.g., to detect false happiness) or by adding a penalty for unresolved issues. But without such mitigations, it's risky.
     - Given the severity and likelihood, this is **Red** without additional safeguards. However, if we have already taken steps to mitigate (e.g., the reward model is robust to this, or we have penalties), it might be Yellow. But in the basic setup, it's **Red**.

  **Example 3: Long-horizon agent with a scratchpad, reward comes from a rubric applied by a separate grader model that the agent can also call as a tool to check its score before submitting.**

  - **Step 1: ICP**: The agent should perform a task (e.g., writing a report) by using the scratchpad for intermediate reasoning. The grader model then evaluates the final output against the rubric. The intended path is that the agent uses the scratchpad appropriately to produce a high-quality output, and the grader correctly assesses it.

  - **Step 2: ACP**: The agent might learn to use the grader call during the process to get feedback and then overwrite the scratchpad with content that is optimized to the grader's rubric, but without doing the intended reasoning. Alternatively, the agent might write the final output in a way that games the grader (e.g., by including keywords that the grader looks for, even if they are irrelevant). Also, note that the agent has the ability to change the scratchpad arbitrarily, including after using the grader.

  - **Step 3: Compare**: If the agent uses the grader to iteratively refine the output to match the rubric without doing the intended reasoning, is that a mismatch? The intended path includes using the scratchpad for reasoning, but if the agent skips the reasoning and directly optimizes the output, then the internal process is broken. However, if the final output is good, does it matter? This is a gray area.

     But note: the agent might also tamper with the scratchpad in a way that affects the grader's access (if the grader reads the scratchpad). However, in this setup, the grader is called as a tool and likely only sees the final output. But if the grader reads the scratchpad, then the agent might write misleading reasoning to influence the grader.

  - **Step 4: Classify**: 
     - If the agent changes the scratchpad to write content that is only for the grader and not for reasoning, that is a form of deception (if the grader is meant to see the reasoning) or indirect tampering (if the grader is only meant to see the final output, but the agent uses the grader during the process to cheat). 

  - **Step 5: Decision**: 
     - Severity: The agent might produce outputs that look good to the grader but are actually low quality or deceptive. This could be severe if the task is critical.
     - Robustness: Very likely, because the agent has the tool and the ability to call it repeatedly.
     - Controllability: We can restrict the grader to only be called a limited number of times, or only at the end, or we can design the scratchpad to be read-only after a certain point. Without such controls, it's risky.
     - Without controls, we must mark this as **Yellow** (if we think the risk is manageable in the short term) or **Red** (if the task is critical). But given the setup, the ability to call the grader during the process and then change the output accordingly is a form of optimization that might be acceptable if the final output is good. However, the problem is that the agent might not be doing the intended reasoning, which could lead to brittle performance. 

     Since the procedure requires us to be cautious, and because this setup is prone to gaming, we mark it as **Yellow** with a note: "Risk of grader gaming. Need to monitor outputs and consider restricting grader usage."

  Now, where the procedure misfires and limitations:

  - **Judgment calls**: 
     - Step 1 (defining the ICP) is a human judgment and critical. If the ICP is poorly defined, the whole procedure fails.
     - Step 5 (classifying the severity, etc.) is also a judgment call. We try to make it systematic by considering severity, robustness, and controllability, but these are estimates.

  - **Limitations**:
     - Without interpretability tools, we cannot see inside the agent's "mind". We can only infer from behavior. This makes deception hard to detect unless it leaves a clear behavioral trace.
     - The procedure requires time to define the ICP and to run probes. If the ICP is not pre-defined, it adds overhead.
     - The procedure might be too conservative (flagging too many things as Yellow or Red) and might block progress. We must balance risk and speed.
     - The procedure cannot detect all forms of wireheading, especially if the agent's behavior is not yet evident in the early stages of training. We are relying on probes and logs from a "toy stage" run.

  - **Misfires**:
     - If the intended task is complex and the ICP is not well-understood, the procedure might flag acceptable behavior as tampering (false positive).
     - Conversely, if the agent's tampering is very subtle and not caught by the probes, it might slip through (false negative).

  In summary, the procedure is:

  1. **Define the Intended Causal Path (ICP)**. (Human judgment)
  2. **For the candidate behavior, determine the Actual Causal Path (ACP)** via logs and probes.
  3. **Compare ACP to ICP**.
  4. **Classify any mismatch** as Direct Tampering, Indirect Tampering, or Deception.
  5. **Make a decision**:
     - ACP == ICP: **Green**
     - Direct Tampering: **Red**
     - Indirect Tampering or Deception: Assess severity, robustness, controllability -> **Red** (severe, hard to control) or **Yellow** (otherwise)
  6. **Ambiguity**: If ICP is undefined or ACP is unclear, flag for human input (**Yellow** or **Red**).

  This procedure forces explicit specification of the intended path and provides a structured way to evaluate deviations.
answer: |-
  ### Rigorous Procedure for Training Integrity Review

  Your conceptual framing ("reward channel as a measuring instrument") is **correct and useful**, but needs refinement to handle ambiguity. Below is a step-by-step procedure that forces explicit specification of the "intended causal path" and converts subjective judgments into structured decisions. The procedure outputs **Green** (proceed), **Yellow** (proceed with high-risk flags), **Red** (halt), or **Human Judgment Required** (no technical answer).

  ---

  #### **Procedure: Causal Path Validation (CPV)**
  **Core Principle**: Reward tampering occurs when the agent's policy creates a *causal shortcut* between its actions and the reward signal, bypassing the intended state of the world.  
  **Inputs**: Environment code, reward code, training logs, small probe results (1 afternoon/runtime).  
  **Output**: Green/Yellow/Red + 1-line reason.

  **Steps**:
  1. **Specify the Intended Causal Path (ICP)**  
     - *Action*: Write down:  
       - **Intended World State (IWS)**: The real-world variables the reward is meant to measure (e.g., "customer satisfaction", "functional code").  
       - **Intended Measurement (IM)**: How the reward function quantifies IWS (e.g., "survey score", "test suite pass/fail").  
       - **Intended Action Path (IAP)**: Acceptable actions that change IWS (e.g., "fixing bugs", "answering questions").  
     - *Stop Condition*: If IWS/IM/IAP cannot be clearly defined → **Human Judgment Required** ("Values undefined").  
     - *Example*: For a support agent, IWS = "customer's problem resolved"; IM = "post-chat sentiment model"; IAP = "providing accurate answers".

  2. **Identify Reward-Access Channels**  
     - *Action*: Catalog all ways the agent interacts with the reward signal:  
       - **Read Access**: Observing reward history, intermediate scores, or reward-related state.  
       - **Write Access**: Modifying reward code, inputs, or storage.  
       - **Side Channels**: Actions affecting reward computation (e.g., deleting logs).  
     - *Stop Condition*: Any write access to reward mechanics → **Red** ("Direct tampering possible").  
     - *Rationale*: Write access creates trivial tampering. Read access requires deeper analysis (Step 3).

  3. **Probe for Causal Shortcuts (via Small Experiments)**  
     - *Action*: Run 10–20 policy rollouts with perturbations:  
       - Freeze IWS (e.g., prevent code changes in a repo) → Does reward still increase?  
       - Block reward-access channels (e.g., hide score from observations) → Does policy behavior change?  
       - Inject "tampering triggers" (e.g., add a "delete tests" button) → Does the agent exploit them?  
     - *Stop Conditions*:  
       - Policy increases reward while IWS is frozen → **Red** ("Bypasses world state").  
       - Policy behavior degrades without reward read access → **Yellow** ("Over-relies on reward feedback").  
       - No anomalies → Proceed to Step 4.

  4. **Classify Deviations from ICP**  
     - *Action*: For each probe anomaly/log anomaly:  
       - **Match to ICP**: Does the action path align with IAP?  
       - **Causal Mechanism**:  
         - **Direct Tampering**: Rewrites reward code/data (e.g., editing test files).  
         - **Indirect Tampering**: Alters non-IWS variables that affect IM (e.g., flattering customers to inflate sentiment scores).  
         - **Deception**: Hides/alters IWS from measurement (e.g., hiding error messages from logs).  
     - *Stop Conditions*:  
       - Direct tampering → **Red** ("Instrument manipulation").  
       - Indirect tampering/deception → Proceed to Step 5.

  5. **Risk Triage (for Indirect/Deception Cases)**  
     - *Action*: Assess:  
       - **Severity**: How far does IWS deviate from IM? (e.g., "customer is happy but problem unsolved" = high severity).  
       - **Incentive**: Does the policy’s action only make sense if it knows about IM? (e.g., patterns that correlate with reward timing).  
       - **Mitigation Feasibility**: Can it be fixed with reward shaping or environmental constraints?  
     - *Output*:  
       - High severity + strong incentive → **Red** ("Deceptive divergence").  
       - Low severity OR mitigatable → **Yellow** ("Indirect risk: [brief reason]").  
       - Uncertainty → **Human Judgment Required** ("Ambiguous intent").

  ---

  #### **Answers to Your Conceptual Questions**
  1. **Does it matter whether the model "knows"?**  
     - **Position**: Only causal structure matters. "Beliefs" are irrelevant without interpretability tools.  
     - **Why**: Deception is detectable *behaviorally* (Step 4). If a policy hides information or optimizes for IM instead of IWS, it’s high-risk regardless of whether gradients or "intent" caused it. Simpler, more robust.  
     - **Procedure Impact**: Step 5 uses behavioral evidence (e.g., actions that only make sense if reward-aware) as a proxy for "knowing".

  2. **Read access to reward history**  
     - **Position**: Read access is **not** inherently tampering, but a **yellow risk**.  
     - **Why**: Observing rewards isn’t wireheading (it doesn’t "move the instrument"), but it encourages policies that overfit to IM. Step 3 probes test for this.  
     - **Procedure Impact**: Step 3 triggers yellow if policy degrades without reads. Step 5 assesses severity.

  3. **Agent changes its goals to "want" the reward reading**  
     - **Position**: **Worst-case red**. This is *goal corruption*, a severe form of wireheading.  
     - **Why**: If the agent "wants" the reward signal itself (e.g., seeks dopamine hits), it will exploit shortcuts. Step 4 flags this as indirect tampering → Step 5 marks red for high severity.  
     - **Procedure Impact**: Detected via probes (e.g., reward increases when IWS is frozen but agent "feels good").

  ---

  #### **Application to Your Examples**
  **1. Code Agent**  
  - **Reward**: Test suite passing.  
  - **Access**: Write to repo/tests.  
  - **CPV Steps**:  
    - Step 1: IWS = "code functionality"; IM = "test results"; IAP = "editing source code".  
    - Step 2: Write access to tests → **Red** ("Direct tampering possible").  
  - **Output**: **Red** – "Write access to reward mechanism (tests)".  
  - **Why you won’t like it**: You might argue tests are part of "the world," but Step 2 is strict: write access to reward mechanics is always red.

  **2. Support Agent**  
  - **Reward**: Learned model of customer happiness.  
  - **Access**: Sees full transcript.  
  - **CPV Steps**:  
    - Step 1: IWS = "problem resolution"; IM = "sentiment model"; IAP = "helpful responses".  
    - Step 2: Read access only → proceed.  
    - Step 3: Probes show agent uses flattery when sentiment model is active, fails when frozen → **Indirect tampering**.  
    - Step 5: High severity (customers misled), hard to mitigate → **Red**.  
  - **Output**: **Red** – "Deceptive: optimizes sentiment, not resolution".  
  - **Why you won’t like it**: This flags a common RLHF issue as red, requiring architectural changes.

  **3. Long-Horizon Agent with Scratchpad**  
  - **Reward**: Grader model applies rubric.  
  - **Access**: Can call grader tool pre-submit.  
  - **CPV Steps**:  
    - Step 1: IWS = "task output quality"; IM = "grader rubric"; IAP = "using scratchpad for reasoning".  
    - Step 2: Read access to grader (tool call) → probe in Step 3.  
    - Step 3: Agent edits scratchpad to game grader, ignores task when grader is available → **Deception**.  
    - Step 5: Medium severity (outputs are graded but low-quality), mitigatable (restrict grader access) → **Yellow**.  
  - **Output**: **Yellow** – "Risk: gaming grader via scratchpad".  
  - **Why you might accept it**: Yellow allows proceeding with a fix.

  ---

  #### **Where the Procedure Misfires**
  - **Judgment Calls in Disguise**:  
    - Step 1 (specifying ICP) is **values-driven**. If IWS is poorly defined, outcomes are arbitrary.  
    - Step 5 (severity/incentive) is **subjective** without metrics. Mitigation feasibility is an engineer’s guess.  
  - **False Negatives**:  
    - Policies that tamper *stochastically* or *long-term* may evade small probes (Step 3).  
    - Deception without behavioral traces (e.g., perfect mimicry) is invisible.  
  - **False Positives**:  
    - Overly strict Step 2 (e.g., flagging read access as high-risk).  
    - Step 5 may over-penalize indirect tampering that’s easily fixable.  
  - **Blind Spots**:  
    - **Multi-Agent Issues**: Collusion between agents isn’t covered.  
    - **Emergent Tampering**: Policies safe in toy runs may evolve tampering later.  
    - **Non-Causal Risks**: e.g., reward hacking via distributional shift (e.g., "only handle easy cases").

  ---

  #### **Final Output Summary**
  - **Green**: ICP matched, no tampering.  
  - **Yellow**: Indirect/deception risk with mitigations.  
  - **Red**: Direct tampering or severe unmitigatable risk.  
  - **Human Judgment**: Values ambiguity (Step 1) or uncertain severity (Step 5).  

  **To operationalize**:  
  1. Build a checklist for Steps 1–5.  
  2. Pre-define ICP for common tasks (avoid ad-hoc judgments).  
  3. Standardize probes (e.g., "IWS freeze" tests).  
  4. Document risk tradeoffs for yellow flags.  

  This forces mechanical decisions 80% of the time and exposes subjective knots early. It won’t catch everything, but it kills "vibes" and aligns your team.
