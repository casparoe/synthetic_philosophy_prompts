  ### Activity Design: **Certification Committee Challenge**  
  **Core Structure:** Participants act as inspectors reviewing individual project proposals, with one Chairperson responsible for certifying the entire portfolio. The tension arises when individually rational approvals force the Chair into a lose-lose position on the portfolio.  

  ---

  #### **Setup & Materials**  
  - **Participants:** 15 "Inspectors," 1 "Chair" (rotate if repeating).  
  - **Materials:**  
    - 15 index cards ("proposals"), each pre-marked on the back:  
      - 13 cards: "VALID" (pre-determined)  
      - 2 cards: "INVALID" (pre-determined, randomly assigned).  
    - 1 index card labeled "PORTFOLIO."  
    - Whiteboard (track decisions/scores).  
    - Timer.  
  - **Instructor Prep:** Hide validity status on cards. Announce:  
    > *"You are a committee reviewing 15 project proposals. Each has a 90% chance of being VALID. Inspectors review one proposal each; the Chair approves/rejects the entire portfolio."*  

  ---

  #### **Rules & Sequence** (Total: 40 min)  
  **1. Individual Review Phase** (10 min):  
    - Each Inspector receives one card (face down).  
    - **Decision:** Approve (✔) or Reject (✘) their proposal.  
      - *Rationale:* 90% chance of VALID → Approving is statistically wise.  
    - Inspectors write ✔/✘ on card fronts, hand to instructor.  

  **2. Portfolio Review Phase** (5 min):  
    - Instructor announces:  
      > *"Portfolio certification requires ALL proposals approved AND Chair’s approval."*  
    - **Chair’s Decision:** Approve (✔) or Reject (✘) portfolio.  
      - Chair knows:  
        - Each proposal has 90% validity chance.  
        - How many Inspectors approved (e.g., "14 approved").  
      - *Rationale:* Portfolio validity requires *all 15 valid*. Probability ≈20% (0.9¹⁵).  

  **3. Scoring Phase** (5 min):  
    - **Reveal & Calculate:**  
      - Turn cards to show VALID/INVALID.  
      - Portfolio valid **only if all 15 valid** (always false here—pre-set 2 INVALID).  
    - **Payoff Scheme:**  
      - **Inspectors:**  
        - ✔ + VALID = +2 points  
        - ✔ + INVALID = -2 points  
        - ✘ + INVALID = +1 point  
        - ✘ + VALID = -1 point  
        - *Bonus/Cost if portfolio approved:*  
          - Portfolio valid (impossible): +1 point each  
          - Portfolio invalid: -1 point each  
      - **Chair:**  
        - ✔ + valid portfolio (impossible): +10 points  
        - ✔ + invalid portfolio: -10 points  
        - ✘ + invalid portfolio: +5 points  
        - ✘ + valid portfolio (impossible): -5 points  

  **4. Outcome Simulation** (20 min for activity, 35 min debrief):  
    - Run one full round.  
    - **Sample Result:**  
      - Most Inspectors approve (rational individually).  
      - Portfolio approval likely (if all approve).  
      - Chair rejects portfolio (rational due to low validity chance).  
      - Portfolio invalid (inevitable), triggering:  
        - Inspectors: Lose bonus (-1 each) if portfolio approved.  
        - Chair: Gains +5 for rejecting invalid portfolio.  

  ---

  #### **Debrief** (35 min)  
  **Map Activity to Paradoxes:**  
  1. **The "Hidden" Lottery Paradox:**  
     - *Each Inspector* = Lottery ticket holder.  
       - Approving ✔ = "My project is valid" (like "My ticket loses").  
       - High individual confidence (90%) justifies approval.  
     - *Chair* = Lottery organizer.  
       - Rejecting portfolio = "At least one project invalid" (like "A ticket wins").  
     - **Escape Route Spotlight:** *Deny individual rational belief?*  
       - Activity pushes BACK: Inspectors statistically must approve.  

  2. **The "Hidden" Preface Paradox:**  
     - *Inspectors* = Authors of book chapters.  
       - Each believes their claim (project) is true.  
     - *Chair* = Book author in preface.  
       - Rejects portfolio = "At least one error in the book."  
     - **Escape Route Spotlight:** *Accept rational inconsistency?*  
       - Activity AFFIRMS: Inspectors and Chair both rational, yet inconsistent ("All valid" vs. "One invalid").  

  3. **Shared Structure & Social Cost:**  
     - "Each fine, together impossible" enacted:  
       - Individually: Approvals rational.  
       - Collectively: Portfolio invalid (pre-set).  
     - **Social Cost:** Chair pays for inconsistency.  
       - Their payoff is worse (max +5 vs. Inspectors’ max +2) and forced to absorb systemic risk.  
     - **Escape Route Spotlight:** *Deny belief agglomeration?*  
       - Activity NEUTRAL: Agglomeration avoided—no one *must* believe both individual and conjunction.  

  **Why Paradoxes Feel Identical:**  
  - Both trap agents in: *n* high-probability beliefs → 1 low-probability conjunction.  
  - Chair embodies the "preface author" (explicitly acknowledging error) and "lottery organizer" (knowing collective risk).  

  ---

  #### **Failure Modes & Fixes**  
  1. **Short-Circuit:** Inspectors collude to reject proposals to avoid portfolio risk.  
     - **Fix:** Isolate decisions. Remind: "No communication; act as individual."  
     - **Philosophical Dodge:** "This is rigged!" → Agree: "Yes—like lottery/preface where truth-conditions force inconsistency."  

  2. **Dominant Strategy:** Chair always rejects (safe +5).  
     - **Fix:** If Chair auto-rejects, ask: "Why did Inspectors approve if they knew you’d reject?" Highlight individual vs. collective rationality.  

  3. **Scoring Misalignment:** Inspectors ignore bonus/cost, focus only on individual.  
     - **Fix:** Stress: "Your bonus depends on Chair’s choice." Post-activity, show payoff math.  

  ---

  #### **What the Activity Cannot Do**  
  - **Logical Certainty vs. Probability:** The lottery paradox relies on *certainty* one ticket wins (probability 1.0), while this uses probabilities (90%/20%). I’ll clarify in debrief: "Real lottery makes conjunction *impossible*; here it’s merely *improbable*. But the tension is identical."  
  - **Agglomeration Pressure:** The activity avoids forcing one agent to hold both beliefs (individual + conjunction). I’ll add: "Classic agglomeration critiques require the *same person* to face the contradiction—here, social roles distribute the inconsistency."  
  - **Harmlessness of Inconsistency:** The activity shows cost (Chair’s suboptimal payoff). I’ll argue: "In real life, we ‘outsource’ inconsistency to roles (editors, insurers) to make it harmless."  

  **Why This Design?**  
  - Mundane fiction (project review) avoids biasing discussion while embedding stakes.  
  - Pre-set invalid cards ensure the paradox "bites" (portfolio always invalid).  
  - Chair’s isolation forces class to confront *who pays* for collective rationality.  

  ---  
  **Run Straight From This Page:** Stick to timings, pre-set cards, and payoff rules. Debrief ties knots to paradoxes after visceral experience.
