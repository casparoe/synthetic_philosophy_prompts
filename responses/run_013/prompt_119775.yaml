prompt: |-
  I run a small documentation team at a human rights NGO; we interview survivors and witnesses, usually through interpreters, and write the accounts up for lawyers who'll use them in asylum and criminal cases. Our recurring headache is what to do with an account that doesn't hang together — a witness says something we'd call plainly false, or uses a word in a way that makes his next three sentences contradict each other, or insists on something our background theory says can't happen. Right now my interviewers either quietly smooth it over or flag it as an inconsistency that damages credibility, and neither is a decision I can defend to a tribunal.

  I want a procedure built on Davidson's picture of radical interpretation — roughly, that you can't fix what someone means separately from attributing beliefs to them, and that interpretation has to start from a large background of agreement. Turn that into an ordered checklist an interviewer with no philosophy training can run on a transcript in under an hour. It needs to cover: the difference between revising the lexicon, revising the logic, and revising what we assume the speaker wants, plus a rule about how many of those three you're allowed to move at once, since in Davidson everything hangs together and I dont want a staffer rewriting a whole account to rescue one sentence; why attributing a false belief should be cheaper than attributing a broken inference; the competing thought that you should attribute the beliefs a speaker could reasonably have reached from her evidence rather than the ones that are true, and which of the two my team should use when they conflict; and how to break the circle of using what someone says to fix what they mean in the first place. It also has to say when to stop and leave something marked as residue instead of interpreting it away, and to write the cost down — every charitable reading costs us something in our own background theory about how the police, the state and the neighbours actually work, and I want that on the page, not hidden.

  Then run it on three cases: a witness who says the police came at night when every document says dawn, and who is otherwise consistent; a woman whose word for a kinship relation makes three of her statements mutually inconsistent; and a case where I expect the procedure to tell me to record something as genuine incomprehension when my lawyers would much rather have a clean inconsistency they can attack. Finish with what the procedure can't do and where a person just has to decide.
reasoning: |-
  We are building a procedure based on Davidson's radical interpretation for a documentation team in a human rights NGO. The goal is to have a step-by-step checklist that an interviewer without philosophy training can apply to a transcript in under an hour. The procedure must address:

  1. The three-way choice: revising the lexicon (what words mean), revising the logic (how inferences are made), or revising the beliefs (what the speaker wants or believes).
  2. A rule about how many of these three we can change at once (to avoid over-interpretation).
  3. Why attributing a false belief is cheaper than attributing a broken inference.
  4. How to handle the tension between attributing true beliefs vs. beliefs that are reasonable given the speaker's evidence.
  5. How to break the circle of interpretation (using what is said to fix meaning and vice versa).
  6. When to stop and mark something as residue (unresolved) and record the cost to our background theory.
  7. How to write down the cost of a charitable reading.

  We also need to apply the procedure to three case studies.

  ### The Procedure: A Checklist for Radical Interpretation

  **Step 0: Preparation**
     - Have the transcript and any background information (e.g., country context, common practices, known events) at hand.
     - Note any known facts (like official documents) that might contradict the account.

  **Step 1: Identify the Problematic Segment(s)**
     - Read the transcript and mark any statements that seem to:
          - Contradict known facts (from reliable sources).
          - Contradict other parts of the same account (internal inconsistency).
          - Use a word in an unusual way that leads to confusion.
          - Seem implausible based on your background theory (how the world usually works).

  **Step 2: Initial Charity - Assume Truth and Coherence**
     - Davidson's principle: Start by assuming the speaker is mostly right and coherent. This means:
          - Assume the speaker is speaking truthfully (unless there is strong evidence of deception, which is rare in this context).
          - Assume the speaker is rational (logical).
          - Assume the speaker's words have standard meanings (unless forced otherwise).

  **Step 3: The Three Levers: Lexicon, Logic, Beliefs**
     - Remember: Interpretation involves three adjustable elements:
          - **Lexicon (L)**: What words or phrases mean (semantics).
          - **Logic (R)**: The rules of inference (how the speaker connects ideas).
          - **Beliefs (B)**: What the speaker believes about the world (including desires, intentions, and factual beliefs).

     - **Rule of Thumb: Change only one lever at a time**. This avoids over-interpretation. Only if changing one doesn't resolve the issue, consider changing two. Changing all three is a last resort and must be justified.

  **Step 4: Attributing False Beliefs is Cheaper than Broken Logic**
     - Why? People often have false beliefs about the world (especially in traumatic situations or with limited information) but usually follow basic logical patterns. Breaking logic (e.g., accepting contradictions) makes interpretation nearly impossible.
     - Therefore, when facing an inconsistency:
          - First, try to attribute a false belief (adjust B). This is the least costly to the interpretation because it preserves the speaker's rationality and the usual meanings of words.
          - Only if that fails, consider if a word might have been used in a non-standard way (adjust L). This is more costly because it requires reinterpreting language.
          - Last, consider if the speaker made a logical error (adjust R). This is the most costly because it challenges the assumption of rationality.

  **Step 5: True Beliefs vs. Reasonable Beliefs**
     - Davidson focuses on "true" beliefs as the anchor. But in your context, the speaker's evidence matters. Here's the compromise:
          - Start by assuming the speaker's beliefs are true (if possible without too much strain).
          - If that leads to too many adjustments, then consider what beliefs would be reasonable given the speaker's evidence (what they saw, heard, knew at the time). This might mean attributing false beliefs that are understandable in the context.
          - When there is a conflict between truth (what we know from other sources) and reasonableness (what the speaker could have believed given their evidence), prioritize reasonableness in the interpretation. Why? Because we are documenting the witness's account, not an objective reality. However, note any known contradictions as adjustments (with costs).

  **Step 6: Breaking the Circle**
     - We interpret what the speaker says by attributing beliefs and meanings simultaneously. How to start?
          - Begin with the parts of the account that are clear and consistent with the background theory and known facts. Use these as fixed points.
          - Then, for the problematic part, try the adjustments in Step 4 in order (B, then L, then R) while keeping the fixed points unchanged.
          - If an adjustment in one area (say, changing a belief) resolves the issue without causing new problems elsewhere, accept it.

  **Step 7: When to Stop and Record Residue**
     - If after trying adjustments (with at most two levers) the inconsistency remains:
          - Mark the segment as "residue" (unresolved).
          - Do not force an interpretation that requires changing all three levers or that causes more problems than it solves.
     - For every adjustment you make (change in B, L, or R), record:
          - The cost: How much does this adjustment strain our background theory? (e.g., on a scale of 1-5, or with a brief note: "low", "medium", "high".)
          - The reason: Why did you choose this adjustment? (e.g., "Attributed false belief because the witness was in a dark room and might have mistaken the time.")
     - The goal is to minimize the total cost (i.e., the sum of strains on the background theory). If the total cost becomes too high (e.g., requiring multiple high-cost adjustments), it's better to leave some parts as residue.

  **Step 8: Documenting the Outcome**
     - For the final report:
          - State the interpretation of the problematic segment (if resolved).
          - If resolved, note which lever(s) were adjusted and the cost.
          - If left as residue, note that and explain why (e.g., "After attempting adjustments, the segment remains inconsistent and could not be resolved without excessive cost to the background theory.").
          - Always preserve the original statement in the transcript.

  ---

  ### Applying the Procedure to Case Studies

  #### Case 1: The Police Came at Night vs. Official Dawn
  - **Background**: The witness says the police came at night. Every official document says dawn.
  - **Step 1**: Identify: Contradiction between witness and official records.
  - **Step 2**: Charity: Assume the witness is truthful and rational.
  - **Step 3-4**: First, try adjusting beliefs (B): Maybe the witness believes it was night (false belief) because it was dark (e.g., early dawn in winter). Cost: Low. Our background theory allows that people might mistake the time in stressful situations, especially if the lighting was poor.
  - **Step 5**: Reasonableness: It's reasonable for the witness to think it was night if it was dark. We know from documents it was dawn, but the witness's belief is reasonable given the evidence (darkness).
  - **Step 6**: We break the circle by noting that the rest of the account is consistent and the word "night" is used in a standard way. So we adjust B only.
  - **Step 7**: We record: Adjusted belief (B) - the witness mistakenly believed it was night due to darkness. Cost: Low. We don't need to change the lexicon or logic.
  - **Outcome**: Resolved. The account is credible with a note about the time mistake.

  #### Case 2: Kinship Word Causing Inconsistency
  - **Background**: A woman uses a word for a kinship relation (e.g., "uncle") that makes three statements mutually inconsistent. For example, she says:
      1. "My uncle A was present."
      2. "My uncle B was present."
      3. "I have only one uncle."
  - **Step 1**: Identify: Inconsistency among statements 1, 2, and 3.
  - **Step 2**: Charity: Assume she is truthful and rational.
  - **Step 3-4**: First, adjust beliefs (B)? If we try to say she believes she has two uncles (contradicting statement 3) but then why would she say she has only one? This might not work. Next, adjust lexicon (L): Maybe "uncle" in her dialect includes other male relatives (e.g., cousins, in-laws). This could resolve the inconsistency: she has two male relatives she calls "uncle" but only one biological uncle. Cost: Medium (if we have evidence of such usage in the region). Adjusting logic (R) would be costly (she is contradicting herself) so avoid.
  - **Step 5**: We attribute a reasonable belief: She believes that the two men are both called "uncle" in her community. We don't worry about the truth of the kinship relation (it might be cultural).
  - **Step 6**: We fix the lexicon and then the beliefs become consistent. We don't change the logic.
  - **Step 7**: We record: Adjusted lexicon (L) - "uncle" is used broadly. Cost: Medium (if this usage is documented in the region, otherwise higher). If we cannot confirm the broad usage, it might become residue.
  - **Outcome**: If the broad usage is plausible, resolved. Otherwise, residue.

  #### Case 3: Genuine Incomprehension vs. Inconsistency for Attack
  - **Background**: A case where the procedure should lead us to mark something as genuine incomprehension, but lawyers would prefer a clean inconsistency to attack.
  - **Example**: A witness describes a series of events that, based on the words used, seems to involve a physical impossibility (e.g., "I saw the same officer in two places at once"). However, the witness is very consistent in repeating this and it's central to the account.
  - **Step 1**: Identify: The account includes an event that our background theory says is impossible.
  - **Step 2**: Charity: We assume the witness is trying to tell the truth and is rational.
  - **Step 3-4**: First, try adjusting beliefs (B): Maybe the witness believes he saw the same officer twice, but it was two different officers who looked alike? Cost: Low to medium (if police uniforms make identification hard). But if the witness insists it was the same person and the two events are simultaneous, then we try lexicon (L): Maybe "same" means very similar? Or maybe the word for "officer" is being used for a role, not an individual? Cost: Medium. Adjusting logic (R) would mean the witness accepts contradictions, which is high cost.
  - **Step 5**: Reasonableness: The witness might have had limited time to observe, so a false belief (two officers mistaken for one) is reasonable. But if the witness had a clear view and the events were simultaneous, it's less reasonable.
  - **Step 6**: If we adjust B or L, we might resolve the issue. But if the witness's description is very detailed and insists on the impossibility, we might have to leave it as residue.
  - **Step 7**: If we cannot find a low/medium cost adjustment, mark as residue. The cost of forcing an interpretation (e.g., by changing logic) would be too high. We note: "The witness's account of seeing the same officer in two places at the same time could not be reconciled with our background theory without attributing a logical error (high cost) or an implausible false belief (high cost). Left as residue."
  - **Outcome**: Genuine incomprehension (residue). We do not create a clean inconsistency because we cannot rule out that the problem is with our interpretation. The lawyers must work with the residue.

  ---

  ### What the Procedure Can't Do and Where a Person Must Decide

  - **Limitations**:
      - It cannot resolve every inconsistency. Some accounts will have irreducible gaps or contradictions that must be left as residue.
      - It relies on the interviewer's judgment about the background theory and the cost of adjustments. Two interviewers might assign different costs.
      - It doesn't account for deliberate deception (though that is rare in your context). If deception is suspected, it would require a different approach.
      - The procedure doesn't replace the need for expert input (e.g., cultural or linguistic experts) when high-cost adjustments are considered.

  - **Where a Person Must Decide**:
      - Deciding the cost of an adjustment (low, medium, high) is subjective and requires experience and knowledge of the context.
      - When the procedure leads to multiple possible adjustments with similar costs, the interviewer must choose one based on the overall coherence of the account.
      - In the end, if an account has too much residue, the team must decide whether to use it at all (but that is beyond this procedure).

  By following this checklist, your team can systematically apply Davidson's insights, document their reasoning, and produce more defensible interpretations.
answer: |-
  ### Radical Interpretation Procedure for Human Rights Documentation  
  **Based on Davidson's Principles**  
  *Designed for interviewers with no philosophy training. Time limit: 45–60 minutes per transcript.  
  Core idea: Meaning, belief, and rationality are inseparable. Start with maximal agreement, minimize revisions to background theory.*  

  ---

  #### **Step-by-Step Checklist**  
  **0. Prepare**  
     - Label the transcript: Highlight contradictions, unusual words, or implausible claims.  
     - Note your "background theory": What you know about context (e.g., police behavior, local customs).  
     - Define the problem: Is it a factual error? Internal inconsistency? Implausibility?  

  **1. Assume Agreement First (Davidson's "Principle of Charity")**  
     - Start by trusting the speaker: Assume their words have standard meanings, their logic is sound, and their beliefs aim at truth.  
     - *Why?* Davidson: Without initial agreement, interpretation is impossible.  

  **2. Diagnose the Issue: Three Levers to Adjust**  
     Identify which lever might fix the inconsistency:  
     - **Lexicon (L)**: The meaning of a word/phrase is non-standard (e.g., "brother" might mean "cousin" locally).  
     - **Logic (R)**: The speaker’s reasoning is flawed (e.g., they contradict themselves).  
     - **Beliefs (B)**: The speaker holds a false belief (e.g., "Police never raid at dawn").  
     > **Key Rule: Move only one lever at a time.**  
     > *Why?* Davidson says meaning/belief/rationality are interlocked. Changing multiple levers risks over-interpretation. Only escalate if one lever fails.  

  **3. Prioritize Adjustments: Beliefs > Lexicon > Logic**  
     - **Always try adjusting BELIEFS (B) first**.  
       - *Why?* Attributing false beliefs is "cheaper" than attributing broken logic or new meanings. People often have false but reasonable beliefs (e.g., due to trauma, misinformation, or limited perspective). Cost: Low to medium.  
     - **Then try LEXICON (L)** if beliefs don’t resolve it.  
       - *Why?* Words can have cultural/contextual meanings. Cost: Medium (requires evidence, e.g., dialect experts).  
     - **Only adjust LOGIC (R) as a last resort**.  
       - *Why?* Attributing irrationality (e.g., "they can’t infer A from B") undermines interpretation. Cost: High.  

  **4. Handle Truth vs. Reasonableness**  
     - **Default to "reasonable beliefs" over "true beliefs"** when they conflict.  
       - *Why?* Survivors report what they *reasonably perceived* (e.g., "I saw police at night" in a blackout). Truth (e.g., documents saying "dawn") is for courts to weigh.  
       - *Exception:* If a "reasonable belief" strains background theory severely (e.g., "I saw a dragon"), favor truth and mark residue.  

  **5. Break the Interpretation Circle**  
     - Anchor in **clear agreements**: Find parts of the account that align with background theory (e.g., "police wore blue uniforms").  
     - Use these to test adjustments: If changing a belief/word elsewhere creates new conflicts with clear agreements, reject the adjustment.  

  **6. Know When to Stop: Mark Residue**  
     Stop interpreting if:  
     - Moving one lever creates new inconsistencies.  
     - The cost to background theory is "high" (see Cost Scale below).  
     - The issue is isolated and doesn’t undermine the whole account.  
     **Record residue as:**  
     > "[Exact quote] marked as residue. Adjustment attempts: [L/R/B tried]. Cost: [Value]. Reason: [e.g., 'No evidence for dialect variation; belief adjustment strains police protocol theory']."  

  **7. Assign Cost to Charitable Moves**  
     - **Cost Scale** (record on transcript):  
       - **Low**: Minimal strain (e.g., "Witness mistook time due to stress").  
       - **Medium**: Moderate strain (e.g., "Word usage differs regionally—needs verification").  
       - **High**: Severe strain (e.g., "Attributing irrationality—contradiction unresolved").  
     - *Why?* Every charitable move weakens your background theory. Documenting this protects against tribunal challenges.  

  ---

  #### **Case Applications**  
  **Case 1: Police Came at Night (Official Records Say Dawn)**  
  - **Problem**: Contradicts documents but internally consistent.  
  - **Procedure**:  
    1. **Assume agreement**: Witness isn’t lying.  
    2. **Adjust beliefs (B) first**: Attribute false belief—e.g., "Witness reasonably perceived darkness as ‘night’ due to fear/chaos."  
    3. **Cost**: Low (common in trauma; doesn’t challenge police protocols).  
    4. **Residue?** No—resolved via B.  
  - **Outcome**: "Adjusted B: Witness misperceived timing. Cost: Low. Supports credibility."  

  **Case 2: Kinship Word Causes Contradiction**  
  - **Problem**: Word (e.g., "uncle") makes three statements conflict (e.g., "My uncle did X," "My uncle did Y," "I have one uncle").  
  - **Procedure**:  
    1. **Assume agreement**: Witness isn’t irrational.  
    2. **Adjust beliefs (B)**: Does witness falsely believe two uncles? Unlikely—contradicts explicit statement.  
    3. **Adjust lexicon (L)**: "Uncle" may mean "male elder" locally. Check if regional dialects support this.  
    4. **Cost**: Medium (requires cultural verification). If unsupported, mark residue.  
    5. **Residue?** Only if L fails.  
  - **Outcome**: "Adjusted L: 'Uncle' may include male kin. Cost: Medium. Flag for cultural review."  

  **Case 3: Genuine Incomprehension vs. Lawyer’s Preference**  
  - **Problem**: Witness insists "The walls spoke to me"—implausible but central to account. Lawyers want "inconsistency" to attack.  
  - **Procedure**:  
    1. **Assume agreement**: Witness experienced *something*.  
    2. **Adjust beliefs (B)**: Could "walls spoke" mean echoes/intercoms? If yes, cost low.  
    3. **Adjust lexicon (L)**: Could "spoke" mean "vibrated" or "transmitted sound"? If no evidence, cost high.  
    4. **Adjust logic (R)**: Only if hallucination/psychosis is documented—cost high.  
    5. **Stop**: If B/L strain background theory (e.g., no tech/medical basis), mark residue.  
    6. **Cost**: High for L/R; medium for B if metaphorical.  
  - **Outcome**: "Residue: 'Walls spoke' incomprehensible. B/L adjustments require unsupported assumptions (high cost)."  
  - **Why not "inconsistency"?** Davidson: Preserving rationality is paramount. Forcing inconsistency here risks misrepresentation.  

  ---

  #### **What the Procedure Can’t Do**  
  1. **Resolve deliberate deception**: Davidson assumes truthfulness. If deception is suspected, escalate.  
  2. **Handle systemic trauma effects**: E.g., fragmented memories may defy logic adjustments—use residue + expert consultation.  
  3. **Override legal priorities**: Lawyers may want "inconsistency" for cross-examination; the procedure prioritizes accurate representation. Document why residue was chosen.  
  4. **Replace context expertise**: If cost is "high" (e.g., lexicon changes), pause and consult cultural/linguistic experts.  
  5. **Fix everything**: Some accounts have irreducible gaps. If >2 residues, flag the entire account for review.  

  **Where Humans Decide**  
  - **Cost assignments**: Interviewers must judge strain on background theory (training needed).  
  - **Residue vs. force**: If residue weakens the case, team leads must weigh ethical/legal risks.  
  - **Interpreter role**: If inconsistency arises from translation, note this separately—it’s not the speaker’s issue.  

  This procedure turns Davidson’s theory into actionable steps, balancing charity with accountability. By documenting costs and residue, your team can defend decisions to tribunals without "smoothing over" or over-flagging.
