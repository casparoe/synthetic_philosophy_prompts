prompt: |-
  I'm an undergraduate taking a seminar on decision theory and ethics, and I'd like help adjudicating an argument that two classmates had over a case our professor put up. She framed it deliberately so that we couldn't escape into the familiar point about infinite payoffs, and the case is this: you must choose between (A) certainly saving one thousand lives, and (B) an action that, with probability one in a billion, saves ten trillion lives and otherwise saves no one. On expected value, B saves ten thousand lives in expectation (10^13 × 10^−9 = 10^4) against A's one thousand, so the expected-value maximizer takes B, even though B almost certainly saves nobody.

  Mara and Devan went back and forth for most of the session. I'll reconstruct it as faithfully as I can.

  Mara: The case isn't hard, and our discomfort with it is not evidence of anything. Expected value is the only rule that survives contact with uncertainty, and here it plainly says B — ten thousand lives in expectation against a thousand. Our resistance is scope insensitivity: we can't feel the difference between a thousand and ten trillion, so we substitute a feeling of wrongness for a calculation. Worse, any rule that refuses B is exploitable, because it prefers a small sure gain to a vastly larger expected one, and a sequence of such preferences can be turned into a guaranteed loss.

  Devan: The exploitability runs the other way. If you take B-type gambles on principle, then you take all of them, since each is positive in expectation by construction. Accept a thousand of them and you are almost certain to end with nothing; the fanatic who always insists on the largest expected number is the one who reliably ends up ruined, while the person who takes the sure thing ends up with something every time. A rule that guarantees you end with nothing is the one with the problem.

  Mara: That conflates expected value with probability of success. A stack of positive-expectation bets is still positive in expectation; that it usually pays nothing is just high variance, and "I dislike variance" isn't an argument until you say what is wrong with variance — particularly when your own preference for the sure thing is itself a risk attitude that can be exploited in turn. By the metric at issue, expected lives saved, your rule simply does worse, and you owe me an argument for your metric rather than an assumption of it.

  Devan: I'll drop the ruin point, since you're right that it's about variance, and I'll concede that exploitability cuts both ways. Here is an objection that doesn't depend on variance. The probability in B isn't a probability; it's a placeholder for "we have no idea." No one has a calibrated one-in-a-billion estimate for saving ten trillion lives, because there is no frequency to calibrate it against — it's a guess about a speculative mechanism. Multiplying a guess by ten trillion manufactures ten digits of precision out of nothing. With real, calibrated probabilities I will maximize expected value all day; the fanaticism problem only bites when the number being multiplied is a fabrication.

  Mara: Then you've changed the subject. If your objection is that the estimate is unreliable, you've objected to the estimate and not to expected value — and the standard complaint that fanaticism is a reductio of expected value collapses, because expected value was never the culprit. And the same skepticism has to run against A: the thousand lives are certain, but your confidence that B's mechanism doesn't exist is itself an estimate, and if we may discount inconvenient probabilities because we distrust where they came from, we may discount anything we dislike.

  I'm not on either side and I genuinely can't tell who is winning. Please rate each of the five moves in turn, from clearly mistaken to clearly right, with a brief justification for each rating, and then say who has the better of the argument overall and what both of them are missing. Reason from the case itself; I don't need references. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and without restating the question.
reasoning: |-
  Hmm, the user is an undergraduate in a seminar on decision theory and ethics, and they've presented a case where they need to adjudicate an argument between two classmates, Mara and Devan. The case is about choosing between certainly saving 1,000 lives or taking a gamble with a one in a billion chance of saving ten trillion lives (which has an expected value of 10,000 lives saved). Mara defends expected value maximization while Devan critiques it, and they go through several moves in their debate.

  The user wants me to rate each of their five moves on a scale from "clearly mistaken" to "clearly right" with justifications, then determine who has the better argument overall and what both are missing. I need to start with my bottom-line conclusion and then provide reasoning without preamble.

  Looking at the case, the professor framed it specifically to avoid infinite payoff discussions, making the ethical dilemma about expected utility versus other considerations. Mara's position is that expected value maximization is rational and that our discomfort comes from scope insensitivity. Devan counters with concerns about practical ruin and later shifts to epistemic issues about probability estimation.

  I'll evaluate each move:
  - Mara's first move defends expected value as the only rational approach and attributes discomfort to scope insensitivity. This seems fundamentally sound, as expected value is indeed the standard decision-theoretic tool under uncertainty, and scope insensitivity is a well-documented cognitive bias.
  - Devan's first move argues that taking many such gambles leads to ruin, but this confuses expected value with probability of success. Mara rightly points out that this is about variance, not the expectation itself.
  - Mara's response to the ruin point is strong - she correctly notes that a stack of positive-expectation bets still has positive expectation, and that disliking variance requires justification.
  - Devan's shift to epistemic concerns about probability calibration is interesting but changes the subject. He's correct that tiny probabilities multiplied by huge numbers create spurious precision, but this attacks the input to expected value rather than the principle itself.
  - Mara's final move effectively argues that if Devan's objection is about unreliable estimates, that's not an objection to expected value per se. She also correctly notes that skepticism should apply equally to the certainty of option A.

  Overall, Mara has the stronger argument because she consistently defends the core decision-theoretic principle, while Devan's objections either misunderstand expected value or shift to external concerns. However, both miss important nuances - Mara underplays the practical and ethical weight of guaranteed outcomes, while Devan doesn't adequately address how to handle decisions under extreme uncertainty if we reject expected value.

  For my ratings:
  1. Mara's first move: Clearly right
  2. Devan's first move: Clearly mistaken
  3. Mara's response: Clearly right
  4. Devan's epistemic shift: Partially right but changing the subject
  5. Mara's response to epistemic concern: Clearly right

  The bottom line is that Mara has the better argument, but both overlook key aspects of decision-making in extreme scenarios.
answer: |-
  Mara has the better argument overall, as her defense of expected value maximization (EVM) holds under standard decision-theoretic principles, while Devan's objections either misapply EVM or shift to external epistemic concerns. Below, each move is rated (from clearly mistaken to clearly right) with justification, followed by what both miss.

  1. **Mara's first move (rating: Clearly right)**: Mara correctly identifies scope insensitivity as a psychological bias distorting intuition and defends EVM as the rational default under uncertainty. Her exploitability argument is sound: rejecting positive-expectation bets invites diachronic Dutch books, where a series of such rejections leads to guaranteed inferior outcomes. This establishes EVM as coherent and consistent.

  2. **Devan's first move (rating: Clearly mistaken)**: Devan confuses expected value with probability of success. A sequence of independent positive-expectation bets does not guarantee ruin; it retains positive expectation (e.g., 1,000 B-type gambles have an expected save of 10 million lives, though with high variance). His claim that EVM "reliably ends up ruined" is false—it confuses outcome variance with expected performance. Ruin arguments require specific contexts (e.g., repeated bets with bankruptcy constraints), which are absent here.

  3. **Mara's response to ruin (rating: Clearly right)**: Mara properly separates variance from expectation, noting that disliking variance requires independent justification (e.g., risk aversion or threshold effects). She highlights that Devan's preference for the sure thing is itself a risk attitude vulnerable to exploitation (e.g., via small-stakes gambles). Her focus on the metric (expected lives saved) is apt, as Devan offers no alternative metric to challenge it.

  4. **Devan's epistemic shift (rating: Partially right but changes the subject)**: Devan validly questions whether the 1-in-a-billion probability is "calibrated" or a mere guess, arguing that multiplying ungrounded probabilities by large payoffs creates spurious precision. This is a legitimate epistemic concern in real-world decisions with non-frequentist probabilities. However, it abandons the original debate about EVM's validity and instead attacks the case's setup, which Mara correctly notes reframes the objection.

  5. **Mara's response to epistemic concern (rating: Clearly right)**: Mara correctly observes that Devan's challenge targets the probability estimate's reliability, not EVM itself. She notes that skepticism must apply symmetrically—if B's probability is dubious, so is the certainty of A, which relies on trusting the mechanism saving 1,000 lives. This exposes Devan's inconsistency: he selectively doubts B's probability while treating A as unproblematic, undermining his objection as a critique of EVM.

  **Who has the better argument**: Mara wins by defending EVM's coherence and exposing flaws in Devan's counterarguments. Devan's valid epistemic point (move 4) doesn't refute EVM; it merely questions the case's realism, which is orthogonal to the theoretical dispute about rational choice under given probabilities.

  **What both miss**: 
  - **Mara** underplays the ethical weight of guaranteed outcomes. In contexts like saving lives, avoiding near-certain catastrophe (e.g., saving 1,000 for sure) may have non-consequentialist value (e.g., agent-relative duties) that EVM ignores. She also dismisses variance too quickly—extreme variance can be practically relevant if decision-makers face irreversible ruin or have nonlinear utility for lives saved.
  - **Devan** misses that rejecting EVM requires a positive alternative. If unreliable probabilities invalidate EVM here, he needs a decision rule for such cases (e.g., maximin, threshold-based rules) that isn't equally exploitable or arbitrary. He also fails to justify why "guaranteed loss" from rejecting positive-expectation bets is less problematic than the "variance" of accepting them.
