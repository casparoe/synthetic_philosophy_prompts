prompt: |-
  So I've been roped into an advisory role for a small outfit that does subsurface life detection, and they keep hitting the same wall: an instrument returns something ambiguous, and whoever is on duty has to decide on the spot whether we're calling it life and which protocol tier that triggers. Right now the de facto procedure is "ask the most senior person in the room," which is not a procedure, and last season that cost them part of a sample and a lot of goodwill.

  What I want from you is a decision procedure they can actually run. The person running it is a grad student on a duty shift, not a philosopher -- chemistry degree, read the manual once. They've got maybe four hours, and the answer has to be defensible later to a review board, because the tiers are not cheap: Tier 2 destroys part of the sample, Tier 3 means quarantine, a moratorium on the site, and a phone call to people outside the institution. It comes up a couple times a season, basicly, but they run practice drills constantly.

  You'll have to pick your definitions first, and this is the part I actually care about. The field has a few live candidates: life as a chemical system capable of Darwinian evolution; life as a self-maintaining, far-from-equilibrium metabolic system; life as something with intrinsic purposiveness; life as a property of a lineage rather than of an individual. Don't give me a survey of the debate -- no reading lists, no citations, I don't need them and neither does the student. What I need is the translation: which distinctions survive contact with a checklist, and which have to be dropped because someone with four hours can't operationalize them. Say out loud which definition the procedure is locked to, and what changes if you lock it to a different one, because I'm fairly sure the answer flips.

  Then the hard part. Run it on three cases and tell me where it breaks.

  First, a brine sample with a strong chiral excess in amino acids, real organic complexity, and a redox gradient that looks sustained, but no cells, no genetic polymer, nothing dividing. Second, something in a returned sample that looks like a virus: a protein coat around a nucleic acid, able to replicate only inside a host's machinery, no metabolism of its own. Third, a digital organism in their origin-of-life simulation that replicates with heritable variation and has been evolving open-endedly for a year.

  One of those should come out the wrong way. I want to see which verdict the procedure forces that you or I wouldn't want, and what the student is supposed to do about it.

  Give me the steps in order, what counts as a sufficient answer at each step, where the procedure stops with a no, where indeterminate is the honest output and what that triggers (I bet that's the most common result, and a procedure that can't say I don't know is going to get gamed), and where it hands off to a human because the question is values and not facts. Be honest about which steps are seperate judgment calls dressed up as procedure, and say what the procedure can't do at all. Plain American English, no jargon the student wouldn't already have, and keep it short enough that they could actually keep it at the bench.
reasoning: |-
  Okay, let me tackle this problem step by step. The user needs a practical decision procedure for detecting subsurface life that can be used by a grad student in a limited time frame. First, I need to select a workable definition of life from the options provided. The Darwinian evolution definition seems most operational because it focuses on observable replication and heritable variation—things you can test for. The other definitions have issues: metabolism is hard to prove without cells, intrinsic purposiveness is too vague, and lineage focus doesn't help with initial detection. 

  Next, I'll structure the procedure into clear steps. It should start with basic checks for contamination to avoid false positives, then move to key criteria like replication, heritable variation, and open-ended evolution. Each step needs unambiguous pass/fail criteria. I should include an "indeterminate" outcome since many cases won't be clear-cut. 

  Now for the test cases. The brine sample with chiral amino acids but no replication fails at step 4—interesting chemistry but not life. The virus-like entity passes replication but fails step 5 (no independent evolution) and step 6 (host-dependent), so indeterminate. The digital organism passes all steps but forces a "life" verdict that might feel wrong—here the procedure exposes a definitional limitation. 

  I need to highlight where human judgment is unavoidable, like interpreting "open-ended" evolution or handling host-dependent cases. The procedure's weaknesses are: it can't handle gray areas perfectly, might misclassify digital life, and relies on observable evidence within four hours. 

  The user's deeper need seems to be defensibility—avoiding costly mistakes while accepting that some calls will be contentious. Emphasizing documentation and clear "bail-out" points is crucial. Also, the indeterminate outcome protects grad students from pressure to overcall.
answer: |-
  Here's a field-ready decision procedure locked to **Life as a chemical system capable of Darwinian evolution**. I chose it because:  
  1.  **Operationalizable:** Replication, variation, and selection effects are testable/observable within 4 hours (unlike "lineage" long-term or "intrinsic purposiveness").  
  2.  **High Stakes Fit:** Darwinian evolution poses the planetary contamination/potential outbreak risk justifying Tiers 2/3 (unlike metabolism alone).  
  3.  **Drops:** "Self-maintenance" is inferred if it replicates. "Purposiveness" is too vague. "Lineage" is critical *post*-detection but hard for *initial* call.  

  **If locked to Metabolism:** Brine sample likely triggers Tier 2/3 (strong metabolic sigs), Virus & Digital fail (no metabolism).  
  **If locked to Lineage:** Virus likely passes (if host exists), Brine/Digital fail (no observed lineage history).  

  ---

  **Subsurface Life Detection Decision Procedure (v1.0 - Darwinian Lock)**  
  **User:** Duty Grad Student (Chem, Manual Read)  
  **Time:** < 4 Hours  
  **Output:** NO LIFE / INDETERMINATE / LIFE + Tier Recommendation  
  **Core Rule:** If INDETERMINATE, default to Tier 1 (Preserve sample, notify internal team only). Proceed ONLY if all prior steps pass.  

  1.  **CONTAMINATION CHECK:**  
      *   *Ask:* Could this signal come from Earth? (Lab contaminant, instrument artifact, known abiotic reaction?)  
      *   *Pass:* All plausible terrestrial sources ruled out (e.g., chiral excess not matching known contaminants, signature not matching any abiotic sim).  
      *   *Fail/Indeterminate:* STOP → "NO LIFE" or "INDETERMINATE" (Triggers Tier 1). *Proceed only if PASS.*  

  2.  **REPLICATION EVIDENCE:**  
      *   *Ask:* Is there *direct observation* or *strong chemical signature* of entities *increasing in number* while maintaining structure? (Growth curves, PCR-like amplification, microscopy counts).  
      *   *Pass:* Clear, repeated increase in entity count under test conditions.  
      *   *Fail:* STOP → "NO LIFE".  
      *   *Indeterminate:* Inconclusive trend (e.g., slight increase, ambiguous signatures). STOP → "INDETERMINATE" (Tier 1).  

  3.  **HERITABLE VARIATION EVIDENCE:**  
      *   *Ask:* Do offspring entities show *non-random differences* from parents? (Morphology changes, chemical signature shifts, sequence drift if NA present).  
      *   *Pass:* Documented differences correlate with replication events under selective pressure (e.g., survival in altered conditions).  
      *   *Fail:* Offspring identical despite challenge. STOP → "NO LIFE".  
      *   *Indeterminate:* Variation seen but source unclear (damage? noise?). STOP → "INDETERMINATE" (Tier 1).  

  4.  **OPEN-ENDED EVOLUTION POTENTIAL (Judgment Call):**  
      *   *Ask:* Does the system show potential for *ongoing, adaptive* change? (e.g., Diverse selection pressures cause divergent changes? Variation source seems inexhaustible?)  
      *   *Pass:* Variation appears inheritable, diverse, and responsive to novel pressures.  
      *   *Fail/Indeterminate:* Variation limited, exhausted quickly, or non-adaptive. STOP → "INDETERMINATE" (Tier 1). *Proceed only if PASS.*  

  5.  **INDEPENDENCE ASSESSMENT (Judgment Call):**  
      *   *Ask:* Can the system replicate & evolve *without external intervention* beyond basic environment? (Does it "own" its machinery?)  
      *   *Pass:* No host cell, external catalyst, or constant programmer input required.  
      *   *Fail:* Requires specific external machinery (e.g., host cell, programmer tweak). STOP → "INDETERMINATE" (Tier 1).  
      *   *Indeterminate:* Mechanism unclear. STOP → "INDETERMINATE" (Tier 1). *Proceed only if PASS.*  

  6.  **TIER RECOMMENDATION:**  
      *   LIFE → **Tier 2** (If sample abundant, low dispersal risk). **Tier 3** (If sample scarce, high dispersal risk, or potential pathogenicity suspected). *Document rationale.*  

  ---

  **Case Runs & Where It Breaks:**  

  1.  **Brine Sample (Amino Acids, Gradient, No Cells):**  
      *   Step 1: PASS (Unusual chirality, not contamination).  
      *   Step 2: FAIL. No replication observed/signaled.  
      *   **VERDICT:** NO LIFE (Tier 1).  
      *   **Break?** Correct call per Darwinian def. A metabolism-only def would call this LIFE incorrectly here.  

  2.  **Virus-Like Particle:**  
      *   Step 1: PASS (Not Earth contaminant).  
      *   Step 2: PASS (Replication observed *if host present*).  
      *   Step 3: PASS (Variation observed).  
      *   Step 4: PASS (Adapts to host defenses).  
      *   Step 5: FAIL. Requires host machinery.  
      *   **VERDICT:** INDETERMINATE (Tier 1).  
      *   **Break?** Per Darwinian def, this is correct ("indeterminate" due to dependence). A lineage def might call it LIFE. *Student Action:* Flag host dependence. Preserve sample. No T2/T3.  

  3.  **Digital Organism:**  
      *   Step 1: PASS (Not contamination).  
      *   Step 2: PASS (Replicates).  
      *   Step 3: PASS (Heritable variation).  
      *   Step 4: PASS (Open-ended evolution observed).  
      *   Step 5: PASS? (Runs on hardware, but doesn't require *new* code input - owns its "machinery" within sim).  
      *   **VERDICT:** LIFE → Tier 2 (Contained system).  
      *   **BREAK:** This is the **wrong way** per user intuition. Procedure *forces* LIFE call. Per Darwinian def, it *is* life. But it's digital, posing no bio-risk.  
      *   **Student Action:** Follow procedure = Trigger Tier 2 (contained destruction/analysis). *Must document "digital substrate, no known bio-risk"* to justify not using Tier 3.  

  ---

  **Procedure Limitations & Honesty:**  

  *   **Judgment Calls:** Steps 4 (Open-Endedness) & 5 (Independence) are inherently fuzzy. The checklist guides, but the student *must* use reasonable scientific judgment.  
  *   **Can't Do:**  
      *   Distinguish "weird Earth life" from truly alien (beyond Contamination Check).  
      *   Handle "gray goo" nanotech scenarios perfectly (might pass as LIFE).  
      *   Resolve philosophical debates (e.g., "Is the virus alive?").  
      *   Guarantee future evolution (assesses *potential*).  
  *   **Indeterminate is Key:** Prevents over-calling. Most real cases will land here (Tier 1). Forces conservatism.  
  *   **Defensibility:** Relies on strict documentation of observations & reasoning at *each step*. "I followed the procedure, here's the data" is the shield.  
  *   **Human Handoff:** Tiers 2/3 are *recommendations*. Senior review *always* required before triggering T2/T3. The procedure stops at "what is it?", humans decide "what do we *do*?" based on risk.  

  **Keep at Bench:** Laminate a 1-page flowchart: Start → Contam Check? (No/Indet → Tier1) → Replication? (No → No Life, Indet → Tier1) → Variation? (No → No Life, Indet → Tier1) → Open-Ended? (No/Indet → Tier1) → Independent? (No/Indet → Tier1) → LIFE → Recommend Tier 2/3 → DOCUMENT.
