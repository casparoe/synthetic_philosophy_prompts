  | **3**  | **Identification of Core Problem (A)**                                   | Explicitly identifies the threat to empirical content/unfalsifiability as the core issue.         | Mentions flexibility but doesn't link it to empirical vacuity/falsifiability.                |
  | **5**  | **Proposal & Description of Constraints (B)**                            | Clearly describes at least **two** distinct constraints (e.g., causal, robustness, non-disjunction). Demonstrates understanding of how each works to limit mappings. | Only describes one constraint superficially; misrepresents how a constraint works.           |
  | **4**  | **Critical Evaluation of Constraints (B)**                               | Insightful critique: Weighs strengths/weaknesses, genuinely assesses if principled or ad hoc. Engages with potential counterarguments/problems (e.g., "causal grain" issue for states). | Superficial or one-sided evaluation (e.g., just lists pros); asserts "principled" without argument. |
  | **2**  | **Synthesis on Constraints (B)**                                         | Offers a reasoned judgment on whether constraints rescue empirical status or are patches (e.g., "improves but not perfect"). May suggest combining constraints. | No clear conclusion; contradictory statements about the viability of constraints.            |
  | **2**  | **Falsification Scenario (C)**                                           | Proposes a *specific*, plausible empirical finding incompatible with *constrained* computationalism. Clearly links it to the constraints discussed. | Vague scenario (e.g., "if brains aren't computers"); ignores the constraints just argued for. |
  | **-**  | **Clarity, Structure, Grammar**                                          | *(Embedded in above - poor execution can reduce points in relevant sections)*                     | Unclear writing, poor structure, significant grammatical errors obscure meaning.             |

  **Grade Ranges:**  
  *   **A (18-20):** Excellent on all criteria, deep critical evaluation, original synthesis, exceptionally clear.  
  *   **B (16-17):** Very good, covers all parts well, good critique & falsification, minor weaknesses.  
  *   **C (14-15):** Competent but superficial in critique/evaluation; or misses nuances in challenge/falsification; or significant weakness in one major section.  
  *   **D (12-13):** Incomplete or seriously flawed in understanding challenge, constraints, or falsification; weak critique.  
  *   **F (<12):** Fundamental misunderstandings of computationalism, the challenge, or the task; missing major sections.
