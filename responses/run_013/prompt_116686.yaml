prompt: |-
  I spent most of last night arguing with a friend about the repugnant conclusion, and we ended somewhere stranger than where we started. Fix a welfare scale with 0 as a life barely worth living and 100 as the best life available to a human; let A be 10 billion people at 80, and let Z be 10^14 people at 1. I hold that A is better than Z — that the conclusion is a reductio of totalism rather than a discovery about value. My friend grants the reductio but claims to have an escape: discount each life's contribution by how far its welfare falls below the average welfare of the population it is being compared against, so that lives at 1 count for almost nothing when the comparison class sits at 80, and the repugnant conclusion is blocked. I am not asking for a survey of who has said what. I want your own credence that the friend's rule succeeds — that it blocks the repugnant conclusion while still yielding a betterness relation that is transitive, that does not let the addition of one extremely happy person make everyone already alive worse off, and that does not rank populations by size alone.

  Please structure the response as follows. Proposition: state the claim you are putting a number on, sharply enough that it could turn out false (two to three sentences). Decomposition: the sub-questions the number depends on, each with a rough probability and one line of justification — at minimum, whether a betterness relation satisfying the friend's rule can be transitive at all, whether the rule is well-defined or generates cycles when comparison classes shift, whether blocking the conclusion requires a person-affecting or critical-level element the rule does not supply, whether our judgment that A beats Z is itself trustworthy given how badly human intuition handles vast numbers, whether blocking the conclusion is even the right test of an axiology, and whether the rule's other implications are themselves acceptable (one line each). Combination: how those terms combine into your number, flagging any that are not independent. Sensitivity: which term the number is most sensitive to, and what argument or evidence would move it most. Bottom line: the number itself, in one sentence.
