prompt: |-
  I'm a software engineer with no real philosophy background, so apologies if I mangle the terms. A friend of mine keeps telling me that the whole "just do whatever has the best consequences" way of thinking falls apart because of something he calls cluelessness: the causal chain running out from anything I do goes on forever, and I can't even list the relevant outcomes, let alone put probabilities on them. The way he put it stuck with me — most people think the problem is not knowing which card is on top of the deck, when actually it's not knowing how many cards are in the deck, or whether it's even a deck. What are the most important implications of this for me in practice? I'm trying to choose between a well-paid job at an adtech company and a lower-paid one at a nonprofit, and I keep going in circles. I don't need a reading list — I want to know what actually follows from the argument, and whether the usual escape hatches ("just maximize expected value", "fall back on common-sense moral rules", "do whatever's robust across scenarios") really get you out or just push the problem around.
reasoning: |-
