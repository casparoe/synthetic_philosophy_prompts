prompt: |-
  I've been trying to get my decision-theoretic commitments into a form I can actually defend, and I'd like an audit before I inflict them on my reading group. Here is where I've landed. (1) Causal decision theory is correct: the rational choice is the one that maximizes expected utility by its causal consequences, not by its correlation with outcomes. (2) In Newcomb's problem, I two-box; the predictor's prediction is already fixed, and my choice cannot causally affect what is in the box. (3) In the counterfactual mugging, I pay the $100 when Omega asks me for it after the coin has landed tails. Omega's prediction was based on my decision policy, and I want to have the policy that gains $10,000 in the heads branch; paying is how I implement that policy. (4) In a one-sided mugging where Omega simply asks me for $100 after tails and there is no heads branch in which Omega would have paid me for having the paying policy, I do not pay. (5) I think the correct decision theory should not depend on the temporal order in which I consider the problem: if I would pre-commit to paying before the coin is flipped, then I should pay after the coin is flipped, even if I did not actually pre-commit. (6) I think pre-commitment is a genuine solution only when it is causally efficacious: if I can actually bind myself in advance, I should; if I cannot, then I should follow causal decision theory.

  I can already feel that something is off, but I cannot tell whether the problem is in (3), (5), or (6). My suspicion is that (3) and (6) are pulling against each other, and maybe (1) and (5) are as well. A friend tells me that (3) and (4) are straightforwardly inconsistent, since in both cases I am asked for $100 after tails; I think the difference is that (3) contains the counterfactual heads branch and (4) does not, but I am not confident. I'd like you to go through these commitments and tell me which pairs are in genuine tension, which are only apparently so, and how severe each tension is. For each genuine tension, say what would have to give and what the cheapest fix would be. Then tell me which single revision would clean up the most, and what it would cost me. I am not looking for a general lecture on decision theory; I want an audit of this specific package. I have also been wondering whether the XOR blackmail case—where the blackmailer's threat is conditioned on a coin flip that has already landed, so that paying correlates with a good outcome without causing it—is just the counterfactual mugging in different clothing, or whether it puts pressure on a different commitment. If it is the same structure, say so and explain why; if it is different, say exactly which commitment it threatens.
