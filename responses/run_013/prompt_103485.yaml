  For leaves: Named positions like Hobbesian (binding only with second party), Millian anti-paternalism (later consent matters), Locke's will theory (earlier self outranks), Ulysses Contract (removal of option necessary), etc. Unnamed positions for less defined views. Also, note where views like democratic constitutionalism might fit, especially regarding institutional binders.

