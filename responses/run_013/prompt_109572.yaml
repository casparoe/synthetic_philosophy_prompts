  Based on Dara's pattern of rulings, her core rule appears to be **"Does the strategic value depend on being the *first* to commit?"** (Rule 1), *not* "Do all parties end up worse off?" (Rule 2). Here's the breakdown:

  ### 1. **Which Rule Fits Dara's Past Rulings?**
     - **Rule 1 (First-Mover Advantage Required):** Fits *all five* cases perfectly:
       - Warehouses: Burning first establishes credible commitment advantage.
       - Roommates: Texting first pressures the other before they can counter.
       - Airlines: *No first-mover advantage* (matching is reactive/symmetric).
       - Union: *No opponent racing* (unilateral commitment).
       - Founders: Announcing first defines the threat narrative.
     - **Rule 2 (Mutual Detriment):** Fits *only three* cases:
       - Warehouses: Both burned assets.
       - Founders: Both worse off.
       - *But fails for Roommates*: Costs nothing to retract, no inherent loss.  
       Also fails for Airlines/Union (no detriment).

  ### 2. **Prediction for the Delivery Case**
     - **Rule 1 Prediction:** **YES, it's a commitment race.**  
       *Why?* The entire value hinges on being *first* to define terms (driver scope, regions, carve-outs). Second-mover loses control.
     - **Rule 2 Prediction:** **NO, not a race.**  
       *Why?* Both companies benefit (lower wages), so no mutual detriment.

  **Your bet:** **She’ll call it a commitment race.**  
  *Why?* Rule 1 perfectly explains her "yes" for Roommates (costless but first-mover matters) and "no" for Airlines/Union. The delivery case has a *blatant* first-mover advantage, matching her pattern.

  ### 3. **Test Case to Separate the Rules**
     Bring her this:  
     > *"A company unilaterally announces it will always match competitors’ wages for drivers. Competitors haven’t made similar pledges."*  

     - **Rule 1 (First-Mover):** **NOT a race.** No opponent racing to commit; this is a solo policy (like the union vow).  
     - **Rule 2 (Mutual Detriment):** **Not a race**, but *for the wrong reason*: The company benefits (retains drivers), no detriment.  
     - *Why it separates?* Rule 1 clearly says "no race" (no racing opponent). Rule 2 would ambiguously say "no race" (no detriment), but Dara's logic would align with Rule 1.

  ### 4. **Third Rule That Fits All Five Rulings**
     **Rule 3: "Are two parties racing to bind themselves to a *threat* before the other can?"**  
     - Warehouses: Threat to walk from negotiations.
     - Roommates: Threat to stop paying rent.
     - Airlines: *Not a threat* (price matching is defensive).
     - Union: *No second party* to race/threaten.
     - Founders: Threat to sue.  
     - **Fits perfectly?** Yes. All "race" cases involve conditional threats, while non-races don’t.

  #### Impact on Delivery Case:
     - **Rule 3 Prediction:** **YES, it’s a race.**  
       The no-poach pledge is an *implied threat* ("we’ll retaliate if you poach"), and first-mover defines the retaliation terms.  
     - **Difference from Dara?** *She might not consciously notice*, as her rulings align with Rule 3 too. But Rule 3 is narrower than Rule 1 (e.g., racing to commit to a *reward* wouldn’t count). If she ever calls a non-threat race a "commitment race," Rule 1 wins.

  ### Key Takeaways:
  - **Bet on Rule 1 (First-Mover):** She’ll call the delivery case a **race** because of the scramble to commit first.  
  - **Test with Unilateral Wage-Matching:** If she says "not a race," Rule 1 is confirmed.  
  - **Rule 3 (Threat-Based):** Fits all rulings, predicts "race" for delivery, but is subtle. Dara might conflate it with Rule 1 unless given a non-threat race example.

  This reflects how informal concepts often hide nuanced definitions—your delivery case brilliantly forces the ambiguity to surface!
