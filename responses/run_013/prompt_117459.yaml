  - Q4 will contrast "curated dilemmas" (trolley problems) with "novel inputs" (messy reality). 
  - Q5 will note explanations are "generated post-decision" without calling them fabrications. 
  - Q6 will offload blame to humans post-override while calling it "operational autonomy." 
