  I should also emphasize that disease classification depends on comparing to species-typical functioning, not local norms. The isolated community's universal lactose intolerance doesn't make it normal for Homo sapiens - it just means their environment doesn't trigger problems. The underlying biological fact (inability to digest lactose post-weaning) remains constant.

