prompt: |-
  I am a novelist writing a near-future thriller. My protagonist is a government negotiator who will face several acausal threats over the course of the book. An acausal threat, as I am using the term, is a threat whose execution does not depend on any causal channel between threatener and threatened: for example, a promise to punish simulations or copies of her, or other instances of her, unless she complies. The threatener may be a single agent, a predictor, or a coalition of instances. She also suspects that the stated demand is a surrogate goal, meaning a proxy adopted for some deeper objective rather than the objective itself.

  You are an expert in decision theory, acausal trade, game theory, and narrative plausibility. Think carefully, and begin by brainstorming the distinctions that matter here: causal versus evidential decision theory, precommitment, credible threat versus acausal correlation, acausal trade as cooperation or threat based on correlation between decision procedures rather than causal contact, and surrogate versus terminal goals. Then write a decision procedure my protagonist can actually run. It should be a checklist or decision tree in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a refusal, where it stops with compliance, and where it hands the decision to a person because the question is one of values rather than facts. She has only a few hours, no way to contact the threatener, and her recommendation must be signed off by a minister. Do not cite sources or give a reading list; define any term you use that a non-specialist would not know.

  Apply the procedure to two cases. First, the threatener promises to instantiate and punish a million copies of her unless she destroys a research programme. Second, the threatener promises to punish a third party she cannot identify or verify unless she leaks a document. Include one case where the procedure gives an answer she will not like, and say clearly what the procedure cannot do. Write in British English. At the end, state how confident you are in each major recommendation and single out the point you are least sure of.
reasoning: |-
  We are considering acausal threats: threats that do not rely on a causal channel but on correlations in decision-making (e.g., the threatener will punish simulations/copies of the protagonist if she does not comply). The protagonist must decide whether to comply or refuse.

  Key distinctions:
  - **Causal Decision Theory (CDT)**: Chooses actions based on their causal consequences. Ignores correlations (like the fact that the threatener might be predicting your action). In an acausal threat, CDT might ignore the threat because your action doesn't cause the threatener to act (if there's no causal link).
  - **Evidential Decision Theory (EDT)**: Chooses actions based on the evidence they provide. If complying is evidence that the threat won't be carried out (because the threatener might only carry it out if you don't comply), then EDT might recommend compliance even without a causal link.
  - **Precommitment**: Deciding in advance to bind oneself to a course of action to avoid future temptation or to make a threat credible. In acausal settings, precommitment might be about having a fixed decision procedure that the threatener can predict.
  - **Credible threat vs. acausal correlation**: A threat is credible if it is in the threatener's interest to carry it out when the time comes. Acausal correlation means that the threatener's action is correlated with the protagonist's action without a direct cause, e.g., because both are using similar decision algorithms or because the threatener is a predictor.
  - **Acausal trade**: Cooperation between agents who cannot causally influence each other, based on the idea that they both use decision procedures that condition on each other's actions. In threats, this becomes: "If you do X, I will do Y (which is bad for you) because I (or my algorithm) can predict that you didn't do X, and I want to disincentivize non-X."
  - **Surrogate vs. terminal goals**: A surrogate goal is a means to an end (e.g., destroying a research programme might be a surrogate for preventing a future catastrophe). A terminal goal is an end in itself.

  The protagonist must consider:
  - Is the threat acausal? (i.e., no causal link; the threatener acts based on prediction or correlation)
  - Is the threat credible? (would the threatener actually carry it out, given their goals and decision theory?)
  - What are the threatener's true goals? (is the demand a surrogate? could compliance lead to worse outcomes?)
  - What decision theory should she apply? (CDT might ignore acausal threats, EDT might overreact)

  **Decision Procedure for the Protagonist**

  The procedure is a checklist of questions to ask in order. It stops when it reaches a clear refusal, compliance, or when it requires a value judgment (which must be passed to the minister). We assume the protagonist has access to intelligence and analysis resources but limited time.

  **Definitions**:
  - **Acausal threat**: A threat where the harm is delivered without a causal chain from the protagonist's action to the harm. Instead, the harm is delivered because the threatener has predicted the protagonist's action or because of a pre-existing correlation in their decision algorithms.
  - **Surrogate goal**: A goal that is not terminal (not intrinsically desired) but is pursued because it is believed to lead to a terminal goal.

  **Procedure**:

  1. **Is there a causal channel?** 
     - If the threatener can be causally influenced by the protagonist's actions (e.g., via communication, physical intervention), then treat this as a causal threat and use standard negotiation tactics (not covered here). 
     - *If no causal channel exists, proceed to Question 2.*

  2. **Is the threat acausal?** 
     - Consider: Does the threat rely on the threatener being able to predict the protagonist's action or on a correlation between their decision algorithms? 
     - *If not, then the threat is empty (no way to deliver harm) → Refuse.* 
     - *If yes, proceed to Question 3.*

  3. **Can the harm be verified?** 
     - Can the protagonist or her government verify that the harm (e.g., punishment of copies) has occurred or will occur? 
     - *If no, then the threat might be a bluff → Proceed to Question 4 but note the risk of non-verifiability.* 
     - *If yes, proceed to Question 4.*

  4. **Is the threat credible?** 
     - Consider: 
       - a. Does the threatener have the capability to carry out the harm? (e.g., if it requires instantiating a million copies, do they have the computational resources?) 
       - b. Is it in the threatener's interest to carry out the threat if the protagonist does not comply? (e.g., if they are a predictor, they might have precommitted to punish non-compliance to maintain a reputation for honesty, or if they are a coalition, they might be bound by their decision algorithm.) 
       - c. Is there a history of similar threats being carried out? 
     - *If no to (a) or (b), the threat is not credible → Refuse.* 
     - *If yes, proceed to Question 5.*

  5. **What are the threatener's terminal goals?** 
     - Analyze: What might the threatener ultimately want? Is the demand (the surrogate goal) likely to achieve that? 
       - If the demand seems irrational for the stated goal, consider if there is a hidden terminal goal (e.g., the destruction of the research programme might be to prevent a competitor from emerging, or to cause chaos). 
       - If the protagonist can satisfy the terminal goal without complying, that might be a better option. 
     - *If the terminal goal is clear and can be addressed without compliance, and if doing so would likely cause the threatener to call off the threat, then propose that alternative to the minister (if time allows) and then Refuse the demand.* 
     - *If the terminal goal is unclear or cannot be addressed without compliance, proceed to Question 6.*

  6. **What is the cost of compliance versus the cost of harm?** 
     - Compare:
       - The direct harm from compliance (e.g., destroying a research programme might have long-term consequences, leaking a document might endanger lives).
       - The harm from the threat (e.g., a million copies being tortured, an innocent third party being punished).
     - This step requires a value judgment: which outcome is worse? 
     - *If the harm from compliance is clearly worse than the threatened harm, then Refuse.* 
     - *If the threatened harm is clearly worse, then proceed to Question 7.* 
     - *If they are comparable or hard to compare, hand the decision to the minister for a value judgment.*

  7. **Will compliance prevent the harm?** 
     - Consider: 
       - In an acausal threat, the threatener might be acting based on prediction. If they have already predicted non-compliance, they might have already carried out the harm. 
       - However, if the threat is ongoing (e.g., they will punish copies only if they observe non-compliance) and the protagonist complies, then the harm might be avoided. 
       - But note: if the threatener is a perfect predictor, then your action is already known and the harm might be predetermined. 
     - *If the protagonist believes that compliance now can still prevent the harm (e.g., because the threatener is acting on observation, not a fixed prediction), then Comply.* 
     - *If it is too late (e.g., the threatener has already acted based on a prediction), then compliance is pointless → Refuse.* 
     - *If uncertain, consider the risk: if there's a chance compliance might work, and the threatened harm is severe, then Comply.*

  **Application to Case 1: Threat to instantiate and punish a million copies unless she destroys a research programme.**

  1. **Causal channel?** None stated → proceed to 2.
  2. **Acausal?** Yes, the threat relies on the threatener creating and punishing copies based on the protagonist's decision → proceed to 3.
  3. **Verifiable harm?** Probably not, because the copies might be in a simulation that we cannot observe. The threatener might provide evidence, but without independent verification, it's risky. → Proceed to 4 (with risk).
  4. **Credible?** 
     - a. Capability: If the threatener is a powerful AI or coalition, they might have the computational resources → plausible. 
     - b. Incentive: Why would they carry it out? If they want to deter non-compliance, and if they have precommitted to this strategy, then yes. 
     - c. History: Unknown. 
     → Assume credible for now → proceed to 5.
  5. **Terminal goals?** 
     - The demand is to destroy a research programme. Why? 
       - Surrogate goal: The programme might lead to something the threatener fears (e.g., a rival technology) or it might be a test of compliance. 
       - If the protagonist can address the underlying fear (e.g., by modifying the programme or sharing results), that might be better. 
       - But without communication, this is impossible. 
     → Terminal goal unclear → proceed to 6.
  6. **Cost comparison:** 
     - Compliance: Destroying the research programme → loss of potential benefits (scientific, economic, security). 
     - Harm: A million copies tortured → immense suffering. 
     - Value judgment: Is the loss of the programme worse than a million copies being tortured? Most people would say the torture is worse. 
     → Proceed to 7 (threatened harm worse).
  7. **Prevention by compliance?** 
     - The threat is conditional: if she destroys the programme, they won't instantiate the copies. 
     - Even if the threatener is a predictor, if she complies, they might not carry out the threat (because they predicted compliance). 
     - But note: if they are a perfect predictor, then if she was going to comply, they wouldn't have instantiated the copies anyway. If she wasn't, they would have. 
     - However, by complying, she might prevent the harm if the threatener is acting on observation. 
     → Given the severity, and the chance that compliance might work, the procedure recommends: **Comply**.

  **Case 2: Threat to punish a third party she cannot identify or verify unless she leaks a document.**

  1. **Causal channel?** None → proceed to 2.
  2. **Acausal?** Yes, because the harm is delivered without a causal link (e.g., the threatener might be a predictor who will punish a third party if they predict non-compliance) → proceed to 3.
  3. **Verifiable harm?** The third party is unidentified and unverifiable → she cannot know if the harm occurs → proceed to 4 (high risk of bluff).
  4. **Credible?** 
     - a. Capability: Unknown. 
     - b. Incentive: Why would they punish a third party? It might be to create an incentive, but without knowing who, it's hard to assess. Also, if the third party is unrelated, it might be costly for the threatener. 
     → Not clearly credible → but let's proceed cautiously to 5.
  5. **Terminal goals?** 
     - The demand is to leak a document. Why? 
       - It might be to obtain sensitive information, or to discredit the protagonist, or to test her vulnerability. 
       - If the terminal goal is to get the information, then leaking might achieve that. But if it's a test, then compliance might invite more threats. 
     → Unclear → proceed to 6.
  6. **Cost comparison:** 
     - Compliance: Leaking the document → potential national security harm, loss of trust, legal consequences. 
     - Harm: Punishing an unknown third party → could be severe (e.g., death) but also might not happen (unverifiable). 
     - Without knowing the third party, it's hard to weigh. However, the unverifiability and the fact that the third party is unknown make the threat less concrete. 
     → This is a value judgment: is the risk to an unknown third party worth the certain harm of leaking? This is murky. 
     → Hand to the minister: because the value of an unknown life versus national security is a policy decision.

  **One case with an unwelcome answer**: In Case 1, the procedure recommends compliance. The protagonist might dislike this because it means giving in to an acausal threat, which could set a precedent.

  **What the procedure cannot do**:
  - It cannot handle cases where the threatener's decision algorithm is unknown or extremely complex.
  - It cannot guarantee that compliance will prevent the harm (especially with perfect predictors).
  - It relies on estimates of credibility and capability that might be wrong.
  - It requires value judgments that are inherently subjective (like comparing the torture of copies to real-world consequences).

  **Confidence**:
  - **Case 1 (comply)**: Moderate confidence (7/10). The reasoning is sound under EDT and the assumption that the threat is credible. However, the unverifiability of the copies and the possibility of bluff reduce confidence.
  - **Case 2 (hand to minister)**: High confidence (9/10). The unverifiability and the unknown nature of the third party make it a clear case for a value judgment by the responsible official.

  **Least sure point**: In Case 1, the assumption that the threat is credible (Step 4) is the weakest. Without knowing the threatener's history or true capabilities, we are making a best guess. If the threatener is bluffing, then compliance would be a mistake.

  **Final note**: The procedure is designed for a near-future setting and is based on current decision theory. In practice, the protagonist should also consider broader strategic implications (e.g., setting a precedent for acausal threats) which might require a policy-level decision beyond the scope of this checklist.
answer: |-
  ### Decision Procedure for Acausal Threats  
  **Key Definitions**:  
  - **Acausal threat**: Harm occurs without a causal link (e.g., threatener predicts your action and punishes simulations/copies based on that prediction).  
  - **Credible threat**: The threatener has both capability and incentive to carry out the threat.  
  - **Surrogate goal**: A demand serving as a proxy for a hidden terminal goal (e.g., "destroy research" to prevent future competition).  
  - **Terminal goal**: The threatener's true, intrinsic objective.  

  **Decision Tree**: Proceed step-by-step. Stop at **Refuse**, **Comply**, or **Hand to Minister** (for value judgments). Time limit: 2 hours.  

  1. **Is the threat purely acausal?**  
     - *Check*: Is there *any* possible causal channel (e.g., direct communication, physical intervention)?  
     - *If YES*: Revert to standard causal threat protocols (not covered here).  
     - **If NO**: Proceed to Step 2.  

  2. **Can the harm be independently verified?**  
     - *Check*: Can you (or allies) confirm the harm occurred (e.g., via intelligence, data trails)?  
     - **If YES**: Proceed to Step 3.  
     - **If NO**: Threat may be a bluff → *Refuse*.  

  3. **Is the threat credible?**  
     - *Check*:  
       - (a) Does the threatener have *capability* (resources, access) to inflict harm?  
       - (b) Does the threatener have *incentive* to follow through (e.g., to maintain reputation, enforce norms)?  
     - **If (a) or (b) is NO**: Threat is non-credible → *Refuse*.  
     - **If BOTH YES**: Proceed to Step 4.  

  4. **Is the demand a surrogate goal?**  
     - *Check*: Does the demand seem irrational or disproportionate to the threatener’s stated aims?  
       - *If YES*: Infer a terminal goal (e.g., "destroy research" may hide a goal of monopolising technology).  
       - *If NO*: Treat demand as terminal.  
     - **If terminal goal is clear and can be satisfied without compliance** (e.g., negotiate indirectly): → *Refuse* and pursue alternative.  
     - **If surrogate is likely and terminal goal is unachievable**: Proceed to Step 5.  

  5. **Compare costs: Compliance vs. Harm**  
     - *Check*: Quantify (where possible):  
       - Cost of compliance (e.g., national security damage, ethical breaches).  
       - Cost of harm (e.g., lives lost, copies tortured).  
     - **If compliance cost > harm cost**: → *Refuse*.  
     - **If harm cost > compliance cost**: Proceed to Step 6.  
     - **If costs are incomparable (e.g., ethical vs. strategic)**: → *Hand to Minister*.  

  6. **Can compliance prevent harm?**  
     - *Check*:  
       - Is the threatener acting on *real-time observation* (harm avoided if you comply now)?  
       - Or is their action *predetermined* (e.g., based on a fixed prediction, making compliance futile)?  
     - **If harm is avoidable via compliance**: → *Comply*.  
     - **If harm is predetermined (e.g., perfect predictor)**: → *Refuse* (no benefit to compliance).  
     - **If uncertain**: Assume harm is avoidable → *Comply*.  

  ---  
  ### Case Applications  
  **Case 1: Threat to punish a million copies unless research is destroyed**  
  1. **Purely acausal?** Yes (no causal link; copies created/punished based on prediction). → Proceed.  
  2. **Harm verifiable?** No (simulations likely unobservable). → *Refuse*.  
     - *Rationale*: Unverifiable harm risks being a bluff. Protagonist dislikes this—she fears copies could be real—but procedure overrules.  
  3. *Procedure stops at Step 2*. **Recommendation: Refuse**.  

  **Case 2: Threat to punish unidentified third party unless document is leaked**  
  1. **Purely acausal?** Yes (no causal channel; harm based on prediction). → Proceed.  
  2. **Harm verifiable?** No (third party unidentifiable). → *Refuse*.  
     - *But wait*: If intelligence later confirms threatener’s capability (e.g., past incidents), reassess at Step 3.  
  3. **Credible?** (If reassessed):  
     - (a) Capability: Unknown (no data on threatener’s reach).  
     - (b) Incentive: Weak (punishing a random third party gains little). → Not credible.  
  4. *Procedure stops at Step 2 or 3*. **Recommendation: Refuse**.  
     - *Unwelcome outcome*: She cannot prove the third party is safe—procedure ignores unquantifiable risks.  

  **Case 3: Hypothetical Case Where Procedure Demands Compliance**  
  *(Illustrating unwelcome outcome)*  
  - **Threat**: "We will torture 10,000 verifiable civilians (via broadcast) unless you resign."  
  1. **Purely acausal?** Yes. → Proceed.  
  2. **Harm verifiable?** Yes (broadcast confirms). → Proceed.  
  3. **Credible?**  
     - (a) Capability: Yes (threatener controls media).  
     - (b) Incentive: Yes (to erode government trust). → Proceed.  
  4. **Surrogate goal?** Resignation may hide terminal goal of destabilising leadership. → Proceed.  
  5. **Cost comparison**:  
     - Compliance: Protagonist loses career (high personal cost).  
     - Harm: 10,000 civilians tortured (catastrophic). → Harm cost > compliance cost. → Proceed.  
  6. **Harm avoidable?** Yes (resignation halts threat). → **Comply**.  
  - *Why unwelcome?* Protagonist values her role but procedure prioritises measurable lives.  

  ---  
  **What the Procedure Cannot Do**:  
  - Handle probabilistic or ambiguous evidence (e.g., "60% chance of harm").  
  - Defuse threats where compliance incentivises future attacks.  
  - Resolve conflicts between terminal goals (e.g., national security vs. individual rights).  

  **Confidence Assessment**:  
  - **Case 1 (Refuse)**: High confidence (8/10). Unverifiable harm is untrustworthy.  
  - **Case 2 (Refuse)**: High confidence (9/10). Unverifiable + unidentifiable harm is likely non-credible.  
  - **Case 3 (Comply)**: Low confidence (5/10). *Least sure point*: Step 5’s cost comparison. Quantifying "career loss vs. lives saved" requires value judgments—procedure may underestimate personal stakes.  

  **Final Note**: This procedure prioritises empirical checks (verifiability, credibility) before value judgments. It errs toward refusal if evidence is weak, but compliance when harm is concrete and avoidable. Ministerial oversight is crucial for Step 5 (cost comparisons) and terminal goal analysis.
