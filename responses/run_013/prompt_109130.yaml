answer: |-
  ## Sestina for the Unmade Self  
  *(After Galen Strawson)*  

  This act you did is yours, you say you **own**  
  The consequence, the praise, the blame. Yet trace  
  The chain: you acted as you did. The **way**  
  You are compelled the act. But who designed  
  That inner shape? If you did not **make**  
  Your starting self, where does the **cause** reside?  

  To bear true weight, the **cause** must be your own,  
  A choice preceding choices. So you **make**  
  A prior self to set your present **way**.  
  But then that prior self? Its source must hide  
  A deeper choice. You scramble to **design**  
  A regress backwards. There can be no **end**.  

  No **end** to why. For who installed the **cause**  
  Within that maker-self? Its given **way**  
  Was just the hand it held. You can't **design**  
  True ownership that's bottomless. To **own**  
  The root, you'd need a self before, to **make**  
  The seed. But nothing answers from behind.  

  And should you **make** yourself? Then who set **way**  
  For *that* decisive act? What thought, what **cause**  
  Governed the choice to change? The self you **own**  
  Was shaped by tools unchosen. You **design**  
  With borrowed clay. The deeper debt won't **end**.  

  It has no **end**. Not luck, nor random **cause**,  
  Nor quantum dice absolve you. Chance can **hide**  
  True authorship no better. Flung, un**own**ed,  
  A cosmic accident defines your **way**.  
  No act of will escapes the old **design**.  
  The maker's own raw stuff? You didn't **make**.  

  You didn't **make** the core. The unchosen **end**  
  Of every "I" begins. The fixed **design**  
  Lurks underneath: the builder's bone, the **cause**  
  Not sourced in choice. You cannot truly **own**  
  What springs from depths you found. This is the **way**  
  The argument must run. It will not **hide**.  

  It will not **hide**. The final plea? **Design**  
  Yourself anew! But who chose that first **way**  
  To build? The urge itself? You don't **own**  
  That primal spark. The cycle has no **end**:  
  The why behind the why. The endless **cause**.  
  The self you are, you did not start, nor **make**.  

  <center>*Envoi*</center>  
  No verdict waits. You live the self you **make**  
  Within the givens, bound by this **design**.  
  You act. You answer. **Cause** and **end** extend  
  Beyond true **own**ership. It's just the **way**  
  Things are. No indictment in the ink. No **hide**  
  Nor seek. The world ticks on. You say "You're late."  
  You say "Thank you." The structure stands. Repent?  
  In short: a chain that never finds its first link.

  ---

  ### Why This Works for Your Seminar
  1.  **End-Word Rotation as Regress:** The words **own, way, make, cause, end, design/hide** systematically cycle through positions, mirroring the recursive demand for responsibility ("who made the maker?"). Each stanza shifts the context, but the core concepts relentlessly return, just like the argument's steps.
  2.  **No Resolution in Envoi:** The envoi explicitly rejects resolution ("No verdict waits," "The cycle has no end," "Beyond true ownership"). It affirms lived experience ("You live the self you make," "You say 'Thank you.'") without granting ultimate grounding, perfectly capturing Strawson's non-retributive attitude.
  3.  **Indeterminism Addressed:** Stanza 5 tackles randomness ("Not luck, nor random cause... Chance can hide / True authorship no better"), preventing a collapse into determinism as the sole issue.
  4.  **The "Maker Problem" Turn:** Stanza 4 ("And should you make yourself?") and the core of Stanza 5 ("The maker's own raw stuff? You didn't make.") explicitly target the futility of self-creation as an escape.
  5.  **Strawson's Tone:** The language is precise, analytical, and unsentimental ("The structure stands," "The world ticks on," "No indictment in the ink"). It avoids bleakness by showing life proceeding ("You say 'Thank you.'", "You act. You answer.") despite the lack of ultimate responsibility.
  6.  **Accuracy:** Key Strawsonian points are directly articulated: the regress, the irrelevance of indeterminism, the problem of the maker's nature, the distinction between responsibility practices and ultimate desert.
  7.  **Formal Integrity:** Standard sestina structure (6x6 + 3-line envoi) with the required closing "In short:" line explicitly stating the form's function as depicting the infinite regress ("a chain that never finds its first link").

  This sestina uses its inherent recursive structure to *be* the Basic Argument, making the abstract dilemma viscerally felt through poetic form, while staying true to Strawson's content and tone. Good luck with the final session!
