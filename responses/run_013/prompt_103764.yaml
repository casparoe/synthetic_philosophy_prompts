prompt: |-
  I'm an investigator at a regional ombudsman's office — we take complaints that the council or the housing association mishandled something, and roughly fifteen times a week I have to decide whether a complaint is upheld, not upheld or partly upheld, and then write the reasons so they survive being read by the council, the complainant, and occasionally a lawyer. I've got eight weeks from the day the complaint lands on my desk, no power to compel anything, my manager has to sign off on whatever gets published, and my two collegues have never read a word of philosophy. Everything we do is evidence: what I saw myself on a site visit, what the records show, what the complainant tells me, what the officer tells me, and what happened in the last case that looked like this one.

  I've been reading around Indian epistemology for a book group and got oddly intrested in the Nyāya school, because they seem to have built an entire apparatus for exactly this — deciding when a cognition counts as knowledge. Four means of knowing, as I understand it: perception, inference, analogy or comparison, and testimony; the idea that testimony only counts when the speaker is actually competent and the sentence is intelligible in the first place (I've seen the conditions given as something like expectation, compatibility and contiguity — don't hold me to the wording); a five-step way of laying out an inference — state the claim, give the reason, cite an example, apply it, draw the conclusion; and a checklist of the ways a reason goes wrong, which I've seen given as five but with variants — the reason that's equally compatible with the opposite conclusion, the one that actually proves the opposite, the one that quietly assumes what you're trying to show, the one that needs as much proof as the claim itself, the one that gets overridden by something you can see for yourself, and one that is literally just the evidence arrived too late. That last one is my entire job some weeks.

  What I want is something I can actually run: a one-pager, in order, that takes a complaint through the four means of knowing and then puts whatever inference I've built to the fault list, with each step saying what counts as enough to move on, where it stops with no case to answer, and where it hands the decision back to me as a judgement call rather than pretending the method made it. Write it for someone who's never heard of Nyāya and will be irritated if I make them learn Sanskrit — keep the distinctions that earn their place, drop the ones that don't, and tell me honestly where the analogy is doing too much work (I'm already suspicious about treating a case file as testimony and an earlier decision as analogy). Then run it on three complaints: a tenant who says a repair visit never happened while the council's log says it did; a resident who says she was never told about a planning decision when the file shows a letter sent to her old address; and the one where I'm fairly sure the method is going to make me write not upheld even though I'd bet money the complainant is telling the truth — because that's the case I need to see before I put this in front of the team on Monday. No reading list or citations, please, I won't follow them up; just tell me where I've mangled the ideas.
reasoning: |-
  Okay, the user is an investigator at a regional ombudsman's office handling complaints about council or housing association mishandling. They decide whether complaints are upheld, partly upheld, or not upheld about 15 times a week. They have an 8-week deadline, no power to compel evidence, and their manager must sign off on reports. Their colleagues aren't familiar with philosophy. Evidence includes site visits, records, testimonies from complainants and officers, and past cases.

  They've been reading about Nyāya epistemology and see parallels to their work. Nyāya has four means of knowing: perception, inference, analogy/comparison, and testimony. Testimony requires the speaker to be competent and the statement intelligible. There's a five-step inference method and a list of fallacies in reasoning. They want a practical one-pager applying Nyāya to their workflow without Sanskrit terms. They need it to clearly show when a decision can be made or when it's a judgment call. They also want three examples tested, especially one where the method might lead to "not upheld" despite believing the complainant.

  The user's explicit request is for a streamlined framework based on Nyāya. But deeper needs include efficiency in decision-making, justifying decisions to various stakeholders (complainants, councils, lawyers), and reducing personal bias. They might also need to train their team, hence the emphasis on simplicity. The friction points are: time constraints (8 weeks per case), varied evidence types, and the need for defensible reports.

  The user is suspicious about treating case files as testimony and past decisions as analogy. They need the framework to be practical, not theoretical. The examples provided are typical cases: conflicting testimonies vs. records, procedural failures in communication, and cases where evidence is lacking despite believability.

  Breaking down the Nyāya concepts: the four pramanas (sources of knowledge) can map to evidence types. Perception is direct observation (site visits). Inference is deducing from evidence. Testimony is statements from parties, needing reliability checks. Comparison/analogy is using past cases. The fallacies (hetvābhāsas) help spot flawed reasoning, crucial for avoiding faulty conclusions.

  For the one-pager, structure it step-by-step: start with gathering evidence categorized by the four means. Each step should have clear criteria for sufficiency, stopping points, or judgment calls. Then, inference building using the five-step method adapted: claim, reason, example (past case), application, conclusion. Finally, fallacy check to test the inference's validity.

  In the examples: 
  1. Repair visit never happened. Perception: if investigator saw unrepaired damage, that's strong. Records vs. tenant testimony—check reliability of council logs. If logs are consistent and tenant has no proof, testimony might not meet competence. Inference could be "no visit" but fallacy if contradictory evidence exists.
  2. Letter not received. Records show sent to old address. Testimony from resident is reliable, but council followed procedure. Analogy to past cases where similar was upheld? But if procedure was followed, it's "not upheld" unless past cases show otherwise. Judgment call on whether council should've known the address was old.
  3. Complainant truthful but no evidence. Here, testimony might be reliable, but without corroboration, inference fails fallacy check (like unproven reason). Forces "not upheld" due to lack of evidence, which aligns with ombudsman standards—decisions based on evidence, not belief.

  Key adaptations: Replace "testimony" with "statements," "analogy" with "past cases." Fallacies simplified into practical checks. Emphasize where evidence is insufficient, leading to "not upheld" despite personal belief, which is actually a strength of the method—it systematizes objectivity.

  The user needs confidence that the framework handles edge cases and reduces subjectivity. Highlighting where judgment is still required (e.g., assessing witness competence) maintains flexibility. The examples will demonstrate that the method ensures decisions are evidence-based, which is defensible to councils and lawyers, even if unsatisfying to complainants.
answer: |-
  Here's a streamlined, practical framework based on Nyāya principles for complaint assessment, designed for your context. It focuses on evidence evaluation, inference testing, and clear decision points. Forget Sanskrit terms – we'll use plain language.

  **The Nyāya-Inspired Complaint Assessment Framework (One-Pager)**

  **Goal:** To systematically assess evidence, build a sound inference about whether the complaint is justified (Upheld/Partly Upheld/Not Upheld), and identify weaknesses in reasoning.

  **Core Principle:** Knowledge (justified belief for a decision) comes only from reliable sources checked for flaws.

  **Phase 1: Evidence Gathering & Source Evaluation (The Four Means)**

  1.  **Direct Observation (Perception):**
      *   **What:** Evidence *you* gathered directly (site visits, physical inspection of documents/records *you* examined).
      *   **"Enough to Move On?":** Rarely decisive alone, but highly reliable. Strong evidence of a *current state* (e.g., observed unrepaired damage, observed missing record). Document meticulously.
      *   **Stop / No Case?:** If your direct observation *conclusively disproves* the core complaint (e.g., you saw the repaired item working perfectly when the complaint says it's broken). *Rare.*
      *   **Judgment Call Needed:** Interpreting *what* you observed (e.g., *why* is the damage there? *When* did it happen?).

  2.  **Records & Documents (Testimony - Source Checked):**
      *   **What:** Written evidence (logs, letters, emails, policies, case files). Treat as "testimony" from the system/author.
      *   **Source Reliability Check:**
          *   *Competence:* Was the record created near the time of events? By someone who should know? Is the system generally reliable? Is it an official record?
          *   *Intelligibility:* Is the record clear and unambiguous? Does it directly relate to the complaint?
          *   *Expectation/Contiguity (Practical Check):* Is the record where you'd expect it? Is the sequence of entries/documents logical and unbroken?
      *   **"Enough to Move On?":** Essential baseline. Reliable records meeting checks are strong evidence of *what was recorded/done*. If reliable records directly prove the *required action was taken correctly*, move towards "Not Upheld".
      *   **Stop / No Case?:** If *reliable, contemporaneous* records *conclusively disprove* the complaint (e.g., dated, signed repair log matching the complaint date; proof of letter sent correctly). *Strong indicator for "Not Upheld".*
      *   **Judgment Call Needed:** Assessing source reliability (especially if records are incomplete, late, or internally inconsistent). Weighing reliable records against conflicting other evidence (esp. Observation or Witness Statements).

  3.  **Witness Statements (Testimony - Source Checked):**
      *   **What:** Accounts from Complainant, Officers, other witnesses.
      *   **Source Reliability Check (CRITICAL):**
          *   *Competence:* Did the witness have direct knowledge? Were they in a position to know? Do they have expertise on the matter? Any potential bias (complainant's grievance, officer's defensiveness)?
          *   *Intelligibility:* Is the statement clear, specific, and consistent (internally & over time)?
          *   *Expectation/Contiguity (Practical Check):* Does the account fit the known facts? Is it plausible? Does it align with where/when the witness should have been?
      *   **"Enough to Move On?":** Statements are necessary context but rarely *conclusive proof* alone. A reliable, plausible statement *corroborated* by another source (Obs, Records, Past Case) is strong.
      *   **Stop / No Case?:** If a *key, reliable* witness statement *conclusively disproves* the complaint *and* aligns with reliable records/observation. *Less common than records alone.*
      *   **Judgment Call Needed:** *Mostly judgment calls here.* Assessing witness credibility, plausibility, resolving conflicts between witnesses. Weighing a credible statement against reliable but potentially incomplete records.

  4.  **Past Decisions / Precedent (Comparison/Analogy):**
      *   **What:** How similar past complaints were handled/decided by your office. *Treat cautiously - not direct evidence for *this* case.*
      *   **Use:** To identify *relevant principles, standards, or interpretations*. To check if *similar evidence* led to a particular finding. *Not* to dictate the outcome based solely on similarity.
      *   **"Enough to Move On?":** Helps establish context for "reasonableness" or expected procedure. Never sufficient alone.
      *   **Stop / No Case?:** Never. Past cases inform judgment, never replace evidence evaluation for *this* case.
      *   **Judgment Call Needed:** *Is this past case truly analogous?* How relevant are the similarities/differences? How much weight should the precedent carry? *Use primarily to support reasoning, not as primary evidence.*

  **Phase 2: Build & Test Your Inference (The Five-Step Check for Flaws)**

  You've gathered evidence. Now, formulate your tentative conclusion and *test the reasoning* leading to it. Frame it like this:

  1.  **Claim (Pratijñā):** State your tentative decision (e.g., "Complaint Upheld: Officer failed to conduct repair visit").
  2.  **Reason (Hetu):** State the *key evidence* supporting your claim (e.g., "Complainant's credible statement they were home all day and no one came; No evidence of forced entry for access; Damage observed un-repaired weeks later").
  3.  **Example/Principle (Udāharaṇa):** Cite the *standard or principle* the reason relies on (e.g., "Council policy requires appointments for access; Reliable records are expected for completed visits; Credible direct testimony is evidence").
  4.  **Application (Upanaya):** Explain *how* the reason links to the claim under the principle (e.g., "The credible statement of non-attendance, combined with lack of access evidence and un-repaired damage, makes it more likely than not the visit did not occur, despite the log entry").
  5.  **Conclusion (Nigamana):** Re-state the claim as your conclusion.

  **NOW, TEST YOUR REASON FOR FLAWS (The Fault List - Simplified):**

  Could your *Reason* (Step 2) be faulty? Check these pitfalls:

  1.  **Too Vague/Equivocal (Savvyabhicāra):** *Does the "Reason" fit both your conclusion AND the opposite?* (e.g., "Officer was busy" could explain *either* a missed visit *or* a late log entry. *Weak reason, needs more support*).
  2.  **Contradicts Itself/Observation (Viruddha):** *Does the "Reason" actually support the OPPOSITE conclusion?* (e.g., Using the *existence* of a policy as proof it was *followed* – it doesn't prove that).
  3.  **Assumes the Answer (Satpratipakṣa):** *Is the "Reason" just restating the Claim in different words?* (e.g., "The visit didn't happen because the complainant says it didn't happen" – circular if no other evidence).
  4.  **Unproven Itself (Asiddha):** *Is the "Reason" itself just as uncertain as the Claim?* Does *it* need strong evidence you don't have? (e.g., "The log is wrong" – you need evidence *for that*, not just absence of proof *for the visit*).
  5.  **Overridden by Facts (Bādhita):** *Is there direct Observation or Reliable Record evidence that flatly contradicts the Reason?* (e.g., Your reason is "No one came," but you have verified CCTV showing the officer entering the building at the time).
  6.  **Too Late (Kālātīta):** *Is the "Reason" based on evidence that only emerged AFTER the relevant event/decision?* (e.g., "The council admits now they made a mistake" – relevant for remedy, not proof of fault *at the time*). *Crucial for judging decisions based on info available THEN.*

  **Decision Point:**

  *   If your inference *passes* the flaw check and the evidence is sufficient and reliable -> Propose decision (Upheld/Partly/Not).
  *   If your inference *fails* the flaw check (especially 1, 3, 4, 5) or evidence is insufficient/conflicting -> **"Not Upheld" is likely required** (even if you suspect the complainant is right). Lack of proof ≠ Proof of wrongdoing by the council/HA.
  *   Significant Judgment Calls identified in Phase 1? -> Acknowledge them explicitly in your reasoning.

  **Application to Your Cases:**

  **Case 1: Repair Visit Never Happened (Tenant vs. Council Log)**

  *   **Observation:** Damage still present weeks later? (Suggests *possible* non-repair, not *proof* of non-visit).
  *   **Records (Log):** Check reliability (contemporaneous? part of standard system? any anomalies?). Assume reliable unless red flags.
  *   **Testimony (Tenant):** Assess reliability (Were they home? Credible history? Specific details? Any reason to fabricate?).
  *   **Testimony (Officer):** If available. Reliability check.
  *   **Past Cases:** How were similar "log vs. resident" conflicts handled? What principles used?
  *   **Inference Test (Tentative Claim: Upheld - Visit didn't happen):**
      *   *Reason:* Credible tenant statement + Unrepaired damage + (Maybe) lack of access proof.
      *   *Flaw Check:*
          *   *(1) Too Vague?* Unrepaired damage could mean visit happened but repair failed. *Needs more.*
          *   *(3) Assumes Answer?* If *only* tenant statement is used. *Needs corroboration.*
          *   *(4) Unproven Reason?* "Log is wrong" needs evidence (e.g., pattern of errors, proof tenant was home).
          *   *(5) Overridden?* If log is deemed highly reliable, it overrides the tenant's statement without strong contradictory proof.
  *   **Decision Likelihood:** If log is reliable and tenant statement lacks corroboration/strong plausibility against the log -> **Not Upheld.** (Council met burden of record-keeping). Judgment call on tenant credibility vs. record reliability.

  **Case 2: Never Told About Planning (Letter to Old Address)**

  *   **Observation:** N/A likely.
  *   **Records:** Proof letter *sent* to Address X on Date Y. Is Address X demonstrably her *old* address *at the time*? Proof council *knew* or *should have known* it was old? (Check other recent correspondence).
  *   **Testimony (Resident):** "Never received it." Reliable? Did she update her address? When? Proof?
  *   **Past Cases:** How is "sent but not received" usually handled? Is the council required to confirm receipt or just send to last known address?
  *   **Inference Test (Tentative Claim: Upheld - Council failed to notify):**
      *   *Reason:* Resident didn't receive it + Letter sent to old address + Council should have known correct address (if proven).
      *   *Flaw Check:*
          *   *(1) Too Vague?* "Didn't receive" is common. Key is *why*.
          *   *(4) Unproven Reason?* "Council *should have known*" needs evidence (e.g., prior updates on file, recent contact to new address). Without proof, the reason is weak.
          *   *(6) Too Late?* Resident only *now* providing proof of address change? Doesn't prove council knew *then*.
  *   **Decision Likelihood:** If records show letter sent correctly to last *known* address on file at the time, and no reliable evidence proves the council *knew* it was wrong -> **Not Upheld** (Council followed procedure). If proof exists council *knew* it was old -> **Upheld/Partly Upheld**. Judgment call on whether "last known address" was reasonably up-to-date.

  **Case 3: The Believable Complainant with No Evidence (Your "Bet Money" Case)**

  *   **Observation:** Likely nothing directly supporting complaint.
  *   **Records:** Show procedure was followed correctly. No anomalies.
  *   **Testimony (Complainant):** Plausible, coherent, seemingly honest account of mishandling.
  *   **Testimony (Officer):** Denies mishandling, account aligns with records/procedure.
  *   **Past Cases:** Likely show decisions require evidence, not just belief.
  *   **Inference Test (Tentative Claim: Upheld):**
      *   *Reason:* Complainant's credible testimony about mishandling.
      *   *Flaw Check:*
          *   *(3) Assumes the Answer?* Yes, if the testimony *is* the claim. (Claim: Mishandling happened. Reason: Complainant says it happened).
          *   *(4) Unproven Reason?* Yes. The testimony *is* the allegation. Without corroboration (Observation, reliable Records contradicting the official account, independent witness), the reason itself lacks proof. It *is* the claim.
          *   *(5) Overridden?* By reliable records showing procedure followed? Possibly.
  *   **Decision:** **Not Upheld.** This is the *strength* of the framework, not a weakness. Your role is to assess evidence of *service failure by the organization*. A credible but entirely uncorroborated complaint, contradicted by apparently reliable records of procedure being followed, cannot be upheld. The burden of proof isn't met. The framework forces this evidence-based conclusion, protecting both the complainant (from arbitrary decisions) and the organization (from unsubstantiated findings), even when it feels personally unsatisfying. Document the complainant's credibility clearly in the "Judgment Call" section, but state the evidence is insufficient.

  **Where the Analogy Might Strain (Honest Assessment):**

  1.  **Records as Testimony:** Treating logs/letters as "testimony" from an impersonal system is a stretch. Nyāya focused on human speakers. The "reliability check" (competence, intelligibility, expectation) is the crucial adaptation. Focus on *how* the record was created and its context.
  2.  **Past Cases as Analogy:** This is the biggest stretch. Nyāya "comparison" was about learning new words/concepts by comparing to known things (e.g., "A gavaya is like a cow"). Using past cases for *principles* is more like legal precedent than core Nyāya analogy. *Mitigation:* Be explicit you're using it for *reasoning principles and standards*, not as direct evidence of facts in *this* case. Don't force the analogy; use precedent pragmatically.
  3.  **"Judgment Call" Integration:** Nyāya aimed for certainty. Your world involves unavoidable uncertainty. The framework highlights *where* judgment is critical (credibility, plausibility, reliability weighting) rather than eliminating it.

  **For Monday:** Present this as a "Structured Evidence & Reasoning Check" derived from logical principles (mention Nyāya sparked it if asked, but focus on the steps). Emphasize it systematizes what good investigators *already do* (assess sources, check reasoning flaws) and provides clear "stop points" when evidence is lacking (leading to "Not Upheld"), especially important for defensible reports. Case 3 is your key example to show its rigor, even when uncomfortable. Good luck!
