prompt: |-
  I'm working on a paper about regional adoption of two competing irrigation technologies in a dryland setting. My model has increasing returns to adoption, so early random choices can get amplified and one tech ends up dominating a region even if the other would have been better ex post. My roomate says this is just path dependence, and that path dependence means the outcome was locked in from the start, so asking whether the region would have ended up with the other tech under a slightly different initial distribution of adopters is a meaningless counterfactual. I think he's mixing up lock-in with inevitability, but I can't articulate why.

  So my question is: if a process is path-dependent, doesn't that mean the same outcome would have arrived anyway, just through a different route? And if history is locked in, how can historians or economists say anything rigorous about the counterfactual where the other technology won? I want to understand what work the concept of path dependence is actually doing, and whether it commits you to saying that the eventual outcome was inevitable. I'm especially confused because some people talk about path dependence as a historical fact about how things happened, while others talk about it as a property of a model with multiple equilibria.

  Please help me sort this out. Also, tell me how confident you are in your answer and single out the point you're least sure about, since I'm going to use this to write a section of my dissertation and I don't want to overstate the consensus.
