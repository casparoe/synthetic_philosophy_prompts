prompt: |-
  ok so I've been hanging around rat-adjacent blogs and forums for way too long, and Buridan's ass is one of those things I absorbed as a running joke without ever really sitting down with it -- the donkey that starves because it's exactly halfway between two identical bales of hay. I'm pretty sure the donkey story is a later illustration rather than something anyone seriously defended, but the underlying problem is real enough that I've definately run into it twice this month: once in my own life (two job offers I honestly cannot rank) and once in a side project where I'm writing a tie-breaking routine for a little automated system that sometimes has to pick between actions with genuinely identical expected value but still has to emit something.

  So: give me the most important implications of the Buridan's ass problem, understood as the problem of choosing when you have no reason to prefer either option. I want it to bite on the personal case (do I just flip a coin, and does deciding-by-coin actually solve anything or just relocate the problem) and on the design case (what should the system do, and is the "arbitrary" choice really arbitrary). Please get into the weeds: the worry that incomplete preferences rather than indifference are the real issue, and that refusing to rank two options can leave you open to being money-pumped by a sequence of trades that each look fine; the von Neumann-Morgenstern move where preferences are really over lotteries, so two options that look identical may not be once you price in the risk; and the thought that a committed tie-breaking rule is itself something you can be evaluated on, so the tie-break is not free if anything is predicting or selecting on your behavior.

  Format: exactly five numbered items, each a sentence or two, no intro and no conclusion, just the list.
