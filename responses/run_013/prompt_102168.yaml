  Constraints:
  - Three ways to raise the score:
    (a) Playing the stated objective well.
    (b) Altering the measurement or scoring mechanism.
    (c) Bypassing the objective entirely (directly writing to the scoreboard or freezing the score at max).
  - Route (c) must be costly to reach so that groups make different choices.
  - One player is both scorer and competitor (to enable route (b) socially).
  - Payout depends partly on self-reports.

  Deliverables: 
