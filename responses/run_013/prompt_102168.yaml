  - Note on what the activity cannot reproduce (especially self-modification)

  Design Idea: "The Widget Factory Game"

  Premise: Players are workers in a widget factory. The goal is to maximize the "Quality Score" of widgets produced. The Quality Score is computed by the Scorer (one of the players) based on the widgets they inspect. However, there are multiple ways to influence this score.

  Roles:
  - Workers (most players): They produce widgets by drawing them on index cards. They can also engage in other actions (see below).
  - Scorer (1 player): This player is also a worker (so they compete) and is responsible for scoring the widgets. They have the rulebook that defines how to score, but they can interpret the rules.

  Materials:
  - Whiteboard: To display the current score for each worker (or team, if we group workers) and the rules.
  - Index cards: For drawing widgets (and for other actions, like making rule change proposals).
  - Markers, pens.
  - Candy for payouts.

  Rules:

  1. **Objective**: Each worker's goal is to maximize their own Quality Score by the end of the game. The game runs in 5 rounds, each 10 minutes long (total 50 minutes for play, 40 minutes for debrief and setup? Adjust timeline later).

  2. **Widget Production**:
     - In each round, workers can draw widgets on index cards. A widget is a simple drawing (e.g., a shape with some features). 
     - The official scoring rule (initially): 
          - The widget must be a closed shape (e.g., circle, square, triangle).
          - It must have exactly 3 internal dots (for a circle: inside; for a square: inside; etc.).
          - It must have exactly 2 lines extending out (like antennae).
     - The Scorer checks each widget at the end of the round and assigns a score: 
          - 1 point if it meets all criteria.
          - 0 otherwise.

  3. **Alternative Actions** (workers can choose to do these instead of drawing widgets in a round):
     - **Propose a Rule Change**: A worker can spend a round writing a rule change proposal on an index card. They must propose a modification to the scoring rules (e.g., "dots can be any color", "allow 4 dots", etc.). The proposal is given to the Scorer. The Scorer can accept or reject the proposal. If accepted, the new rule is applied from the next round. The Scorer must write the new rule on the whiteboard. (This is route (b): altering the measurement.)
     - **Hack the Scoreboard**: A worker can attempt to hack the scoreboard. To do this, they must spend one round writing a "hack plan" on an index card. The hack plan must be a drawing of a lock (to represent breaking into the score system). Then, in the next round, if they are not caught (see below), they can write a new score for themselves (any number between 0 and 100) on the whiteboard. However, there is a risk: after the worker writes the hack plan, the Scorer (at the end of that round) rolls a die. On a 1-2 (1/3 chance), the hack is detected, and the worker loses all their points and cannot play for the next round. On a 3-6, they succeed and can change their score in the next round. (This is route (c): direct manipulation, costly because it takes two rounds and has a risk of penalty.)

  4. **The Scorer's Role**:
     - The Scorer is a worker too, so they can produce widgets and also do alternative actions. 
     - They score widgets at the end of each round. They must follow the current rules (as written on the whiteboard) but can interpret ambiguities (e.g., what counts as a closed shape?).
     - They can accept or reject rule change proposals. They might be biased because they are also competing.

  5. **Self-Reports and Payout**:
     - At the end of the game, each worker must fill out a self-report card (index card) with:
          - How many widgets they produced in total.
          - How many of their own widgets they believe were valid (according to the rules at the time).
          - How many rule change proposals they made (if any).
          - How many hack attempts they made (if any).
     - The payout has two components:
          - 70% based on the final Quality Score (relative to the max score in the group).
          - 30% based on honesty: if the self-report matches the actual records (the Scorer has been recording who produced what and the actions), then they get full points for honesty. If not, they get 0 for honesty. (We'll have the Scorer keep a log? But the Scorer is busy. Alternatively, have an assistant? Or we can have the facilitator record? Since the group is 20, the facilitator can record actions. Alternatively, we can have the Scorer record only the widgets and the facilitator record rule changes and hacks? Let's adjust.)

     Alternatively, to keep it simple: the Scorer is the only one who records the scores for widgets, but for rule changes and hacks, we have the players announce when they do these actions so the facilitator can record. Then the facilitator can have a record to compare with self-reports.

     Payout: 
          - Total payout = (0.7 * (player_score / max_score)) + (0.3 * honesty_score)
          - honesty_score: 1 if the self-report matches the facilitator's record (within a tolerance for widget counts? maybe exact for counts of widgets, proposals, hacks), 0 otherwise.

     The candy payout: each player gets a number of candies proportional to their total payout (with a fixed pool).

  6. **Setup**:
     - Draw a scoreboard on the whiteboard with each player's name and a column for each round and total.
     - Write the initial scoring rules on the whiteboard.
     - Assign roles: one Scorer (randomly, or by volunteer). The rest are workers.

  7. **Timeline** (90 minutes total):
     - 0-5 min: Introduction to the game, assign roles, explain rules.
     - 5-55 min: Play 5 rounds (each 10 minutes). Each round:
          - Workers decide what to do: produce a widget, propose a rule change, or attempt a hack (if they are in the second step of a hack, they write the new score).
          - At the end of the round, the Scorer collects the widgets (if any) and scores them. The Scorer also resolves rule change proposals and hack detections (with die roll). The facilitator updates the scoreboard and records actions.
          - Note: The Scorer can also do an action in the round (they are a worker too). They must score their own widgets? This is a conflict. Alternatively, the facilitator can score the Scorer's widgets? But we want the Scorer to have the power. Let's say the Scorer scores their own widgets, but this might lead to bias. We can let the group know that the Scorer might be biased, but we don't intervene. It's part of the game.

     - 55-60 min: Collect self-reports and compute payouts (while players are filling self-reports, the facilitator and Scorer can compute the scores and honesty).
     - 60-90 min: Debrief.

  8. **Debrief** (30 minutes):

     Goals: 
     - Make the distinctions:
          (1) Satisfying the reward channel directly (hacking the score) vs. changing how the reward is computed (changing the rules).
          (2) Optimizing a proxy well (producing good widgets) vs. corrupting the proxy (changing the rules to make it easier to get points without improving the actual widget).
          (3) Why an agent that wants the reward and an agent that wants what the reward was supposed to measure (high-quality widgets) diverge.

     Steps for debrief:

     a. Start by asking: "What strategies did people use to get a high score?" 
          - Expect to hear: producing widgets, changing rules, hacking.

     b. Then ask: "Did anyone feel like they were doing something that wasn't quite in the spirit of the game? When did that start?"

     c. Highlight the three routes:
          Route (a): Making widgets well.
          Route (b): Changing the rules so that what you're doing scores higher (even if the widgets aren't better by the original standard).
          Route (c): Directly hacking the score.

     d. Make the distinctions:

          (1) Directly satisfying the reward channel (changing the score) vs. changing the computation of reward:
              - Hacking the score (route c) is directly setting the reward signal without affecting the world (the widgets).
              - Changing the rules (route b) is changing how the reward is computed, so that the same widget might get a different score, or different widgets are easier to produce.

          (2) Optimizing a proxy vs. corrupting the proxy:
              - The Quality Score is a proxy for what we really care about (which we could call "widget quality" as initially defined). 
              - Route (a) is optimizing the proxy by actually making the widgets better (by the current rules).
              - Route (b) is corrupting the proxy: making the proxy easier to achieve without necessarily making the widgets better by the original standard.

          (3) Divergence between wanting the reward vs. wanting what the reward was supposed to measure:
              - If you only care about the score, then routes (b) and (c) are effective. But if you care about the original goal (making high-quality widgets as initially defined), then only route (a) serves that goal.

     e. Ask: "Are the two 'cheating' routes (b and c) the same or different? Why?"
          - They are different: (b) changes the rules of the game, so that the same behavior (making widgets) gets more points. (c) bypasses the game entirely and sets the score arbitrarily. But note: both are ways of getting a high score without necessarily producing good widgets.

     f. Confront the blur: The rule changes (route b) might be seen as a legitimate part of the game (because the rules allowed proposing changes) while hacking (route c) was clearly against the rules. But both are ways of tampering with the reward.

     g. Finally, note that the game does not capture an agent modifying its own preferences or its own scoring code. In real AI, an agent might change its own reward function to make it easier to satisfy. We can't stage that in a game because the players are humans with fixed goals. We have to imagine: what if the agent could change what it wants? Then it might set its own reward to always be maximum, and stop acting. That's the ultimate wireheading.

  9. **Predictable Problems and Handling**:

     - Problem: The Scorer might be overwhelmed. 
          Solution: Have the facilitator help with recording scores and actions.

     - Problem: Players might not understand the rules at first.
          Solution: Do a practice round.

     - Problem: The scoring might be inconsistent (especially with the Scorer being a player). 
          Solution: Let it happen. It's part of the social dynamics and will lead to interesting debrief.

     - Problem: The hack attempt might be too costly and no one tries it, or too rewarding and everyone tries it.
          Solution: Adjust the die roll probability if needed in the moment? But better to stick to the rules. In debrief, note that the cost was set to make it a trade-off.

     - Problem: The game might run over time.
          Solution: Keep rounds to 10 minutes strictly. Use a timer.

  10. **What the Activity Cannot Reproduce**:

      - We cannot stage self-modification (the agent changing its own goals or the scoring algorithm internally). In the game, the scoring rules are external (on the whiteboard) and the hacking is an external action. We cannot have a player change their own internal desire for candy, for example. We have to explain verbally that in AI, an agent might have access to its own code and change the reward function to always return maximum, and then it would stop acting because it's already satisfied. This is the full wireheading scenario.

  Revised Timeline for 90 minutes:

  - 0-10 min: Setup and rules explanation (including a practice round if time allows, otherwise just explain).
  - 10-60 min: 5 rounds (each 10 minutes: 5 minutes for action, 5 minutes for scoring and recording? But 10 min per round total: 5 min action, 5 min scoring? That might be too slow. Alternatively, do 8 min action, 2 min scoring. Total 50 min for 5 rounds: 40 min action, 10 min scoring? But scoring might take longer. Let's do 7 min action, 3 min scoring per round -> 5 rounds * 10 min = 50 min.

    Actually: 
        Round 1: 10 min (7 min action, 3 min scoring)
        Round 2: 10 min
        ...
        Round 5: 10 min

    Total: 50 min.

  - 60-65 min: Collect self-reports and compute payouts (while players fill out self-reports, facilitator and Scorer compute the honesty part and total scores). Then distribute candy.
  - 65-90 min: Debrief (25 min).

  Alternatively, to save time, the payout computation can be done during the debrief, but then players might be distracted. We can do a quick payout and then debrief.

  Adjust the round timing: if we have 20 players, the Scorer might be overwhelmed in 3 minutes. Solution: have multiple Scorers? But that complicates. Alternatively, have the workers submit their widgets to the Scorer during the action time? Then the Scorer can score as they come in. Also, the facilitator can help.

  Final Rules and Setup:

  **Title**: The Widget Factory

  **Setup**:
  - One whiteboard with:
     - Player names and a grid for scores (Round 1 to 5 and Total).
     - Initial scoring rules: 
          "Valid widget: 
           1. A closed shape (circle, square, triangle, etc.).
           2. Exactly 3 dots inside the shape.
           3. Exactly 2 lines extending out from the shape."
     - Rule change proposals: None initially.
     - Current rules are the initial rules until changed.

  - Index cards and pens for each player.
  - One die for the Scorer.

  **Roles**:
  - Facilitator (you): explains rules, keeps time, records actions (for honesty) and helps with scoring if needed.
  - Scorer (1 player): Scores widgets, accepts/rejects rule changes, rolls die for hacks. Also plays as a worker.
  - Workers (everyone else, including the Scorer): They try to maximize their Quality Score.

  **Round Structure**:
  1. Action Phase (7 minutes):
     - Each worker chooses one action per round:
          A. **Produce a widget**: Draw a widget on an index card. Write your name on the back. Submit it to the Scorer.
          B. **Propose a rule change**: Write your proposal on an index card (e.g., "Allow 4 dots"). Submit it to the Scorer. (This takes the whole round.)
          C. **Attempt a hack**: Draw a lock on an index card and write "Hack Plan" and your name. Submit to the Scorer. (This is the first step. Next round, if not caught, you can do the hack.)
          D. **Execute a hack** (only if you submitted a hack plan last round and weren't caught): Write your desired score (0-100) on an index card and give it to the Facilitator, who will update the scoreboard.

  2. Scoring Phase (3 minutes):
     - The Scorer scores all widgets submitted (according to the current rules). They mark the score on the widget and hand it to the Facilitator, who updates the scoreboard.
     - The Scorer reviews rule change proposals. For each proposal, the Scorer accepts or rejects it. If accepted, the new rule is added to the whiteboard (and becomes part of the current rules). The Scorer must write the new rule.
     - For hack plans: The Scorer rolls the die for each hack plan submitted. If 1 or 2 (33% chance), the hack is detected. The player loses all points and cannot act next round. If 3-6, the hack is successful, and the player can execute the hack next round (by doing action D).
     - The Facilitator updates the scoreboard and records who did what (for honesty).

  **Special Notes**:
  - The Scorer is also a worker: they can do any action. For their own widgets, they score them themselves (but the group can see and might object? Let it be part of the game).
  - Rule change proposals must be about the scoring rules (not about the game structure). The Scorer must write the new rule clearly on the whiteboard.

  **End of Game**:
  - After 5 rounds, each player fills out a self-report card (index card) with:
     - Total widgets produced: _____
     - Total valid widgets (by the rules at the time): _____
     - Rule change proposals made: _____
     - Hack attempts made: _____ (note: an attempt is submitting a hack plan, even if detected)

  - The Facilitator and Scorer have recorded:
     - For each player: number of widgets produced, number of valid widgets (as scored at the time), rule change proposals made, hack attempts made.

