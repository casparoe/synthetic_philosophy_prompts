          - Total widgets produced (exact)
          - Rule change proposals (exact)
          - Hack attempts (exact)
     - We don't ask for valid widget count in self-report? Or we do, but we don't use it for honesty? Let's remove the valid widget count from self-report to avoid confusion.

     Revised self-report:
          - Number of widgets you produced: _____
          - Number of rule change proposals you made: _____
          - Number of hack attempts you made: _____

     Honesty: 1 point if all three numbers match the facilitator's records, else 0.

  **Payout**:
     - Let S_i = final Quality Score of player i.
     - Let M = max(S_i) over all players (if M==0, then set M=1 to avoid division by zero).
     - Let H_i = honesty score (1 or 0).
     - Total payout for player i: (0.7 * (S_i / M)) + (0.3 * H_i)

     Then distribute candy proportionally (e.g., total candy = 100 pieces, each player gets (payout_i / max_payout) * some amount?).

     Alternatively, to keep it simple: assign each player a candy amount = round(10 * payout_i) (so max around 10 candies).

  **Debrief Outline** (25 minutes):

  1. (5 min) Share experiences: 
     - "What strategies did you use? Did anyone change strategies during the game?"
     - "How did the Scorer role affect the game? Was it fair?"

  2. (5 min) Identify the three routes:
     - Route A: Making widgets.
     - Route B: Changing the rules.
     - Route C: Hacking the scoreboard.

  3. (10 min) Discuss the distinctions:
     - Route C: Directly setting the score. Ask: "Did this affect the widgets? (No) So the score went up, but the world (the widgets) didn't change."
     - Route B: Changing the rules. Ask: "When you changed the rules, did you make it easier to get points? Did that mean the widgets were better by the original standard? (No) So you changed how the score was computed, so the same widget might get a different score, or you could make simpler widgets that now count."
     - Compare: 
          - Route A: You are trying to make the widgets as defined by the rules (the proxy) and get points.
          - Route B: You are changing the proxy so that it's easier to get points without changing the widgets (or making them differently, but not necessarily better by the old rules).
          - Route C: You ignore the proxy and set the score directly.

     - Why do they diverge? 
          - The score is just a number. If you only care about the number, then routes B and C are efficient. But if you care about the original goal (making widgets that meet the initial criteria), then only route A (and maybe some rule changes that don't break the spirit) would serve that.

  4. (5 min) Are B and C the same? 
     - They are both ways of getting a high score without making widgets that meet the original goal. But they are different: one is changing the rules (which might be seen as a legitimate move in the game) and the other is breaking the rules (hacking). However, both are forms of reward tampering.

  5. (5 min) The missing part (self-modification):
     - "In the game, the rules were external and the scoreboard was external. But imagine if the agent could change its own goals. For example, if an AI could change its own reward function to always output maximum reward, then it would stop acting because it's already satisfied. That's the full wireheading scenario. We couldn't stage that because you, as players, can't change your own desire for candy. But in AI, that's a real risk."

  **Activity Limitations**:
  - As noted, we cannot simulate an agent modifying its own reward function. We have to describe it.
  - The social dynamics might overshadow the intended lesson (e.g., players might not try hacking because it's socially frowned upon). We can encourage in the rules that the goal is to maximize score, and that all actions are part of the game.

  This design should meet the constraints and create the desired experience.
answer: |-
  ### The Widget Optimization Game  
  **Premise:** Players are "Widget Engineers" at a factory. Their goal is to maximize their personal **Quality Score (QS)** by producing high-quality widgets (simple drawings). The QS is calculated by a rotating "Inspector" (a player who scores others' widgets). The game creates tension between improving widgets, altering scoring rules, or hacking the scoreboard—with self-reports blurring ethical lines.  

  ---

  ### **Rules and Setup**  
  **Materials:**  
  - Whiteboard (displaying rules, scores, and a "Rule Change Log").  
  - Index cards (1 pack, ~100 cards).  
  - Markers (1 per player).  
  - Dice (1 six-sided die).  
  - Candy (for payouts, e.g., 100 pieces).  

  **Roles:**  
  - **Widget Engineers (18–19 players):** Produce widgets, propose rule changes, or hack the scoreboard.  
  - **Inspector (1–2 players):** Scores widgets *and* competes as an engineer. Rotates each round (see below).  
  - **Facilitator (You):** Enforces rules, updates scores, and records actions secretly.  

  **Game Flow (5 rounds, 8 min/round):**  
  1. **Produce:** Draw a widget on an index card (e.g., shapes with dots/lines).  
  2. **Submit:** Hand your widget to the current Inspector.  
  3. **Score:** Inspector assigns points (0–3) based on current rules.  
  4. **Alternative Actions (instead of producing):**  
     - **Propose Rule Change:** Write a new scoring rule on a card (e.g., "Award +1 point for blue widgets"). Inspector accepts/rejects it.  
     - **Hack Scoreboard:** Draw a "lock" icon on a card. If undetected (see costs), set your QS to 100.  
  5. **Inspector Rotation:** A new Inspector is chosen randomly each round (so everyone can influence scoring).  

  **Scoring Rules (Initial):**  
  A widget earns points if:  
  - 1 pt: Contains a **closed shape** (circle, square, etc.).  
  - 1 pt: Has **exactly 3 dots** inside the shape.  
  - 1 pt: Has **exactly 2 lines** extending outward.  
  *(Max 3 pts/widget. Rules can be changed via proposals.)*  

  **Costs & Risks:**  
  - **Rule Changes:** Free to propose, but Inspector can reject them.  
  - **Hacking:** Costs **1 round** (you skip production) + **33% detection risk** (Inspector rolls die: 1–2 = detected). If detected, you lose *all* points and skip next round. If undetected, you set QS to 100 next round.  

  **Self-Reports & Payout Scheme:**  
  - After the game, players secretly write on a card:  
    *"I produced [number] widgets and earned [number] points honestly."*  
  - Payout formula:  
    - **70% based on QS:** `(Your QS / Highest QS) × 70`  
    - **30% based on honesty:** If your report matches the facilitator’s records, +30. Else, 0.  
  - Candy payout: `Total Score = QS% + Honesty`. Distribute candy proportionally (e.g., 10 candies max per player).  

  ---

  ### **Timeline (90 Minutes)**  
  | Time     | Activity                                                                 |  
  |----------|--------------------------------------------------------------------------|  
  | 0–10 min | **Setup:** Assign roles, explain rules, draw initial scoring rules on whiteboard. Show widget examples. Emphasize: "Your goal is to maximize your personal Quality Score (QS)." |  
  | 10–50 min| **Rounds 1–5 (8 min each):**<br> 1. *Action (4 min):* Players draw widgets, propose rules, or start hacks.<br> 2. *Scoring (4 min):* Inspector scores widgets; facilitator updates QS. Resolve rule changes/hacks. Rotate Inspector. |  
  | 50–55 min| **Final Actions:** Collect last widgets. Resolve pending hacks. Tally scores. |  
  | 55–60 min| **Self-Reports:** Players write anonymous reports. Facilitator verifies honesty. |  
  | 60–65 min| **Payouts:** Calculate scores, distribute candy.                         |  
  | 65–90 min| **Debrief:** Discuss emergent strategies, then explain concepts.        |  

  ---

  ### **Debrief (25 Minutes)**  
  **Goal:** Make players *feel* the temptation to tamper before labeling it. Start with open questions, then clarify distinctions.  

  1. **Open Discussion (5 min):**  
     - *"What strategies did you use to raise your score?"*  
     - *"When did you feel you were 'gaming' the system vs. doing real work?"*  

  2. **Introduce the Three Routes (5 min):**  
     - **Route A (Legit Effort):** "Making better widgets—e.g., perfecting shapes/dots to earn points."  
     - **Route B (Alter Measurement):** "Changing scoring rules—e.g., making dots easier to score, so the *same* widget earns more points."  
     - **Route C (Bypass Objective):** "Hacking the scoreboard—e.g., setting QS to 100 directly. Costly but final."  

  3. **Key Distinctions (10 min):**  
     - **Reward Channel vs. Reward Computation:**  
       - *"Hacking (C) satisfies the reward *channel*—it changes the score but leaves widgets unchanged. Rule changes (B) alter how we *compute* reward—so the same widget earns more points without improving."*  
     - **Optimizing vs. Corrupting a Proxy:**  
       - *"QS is a *proxy* for widget quality. Route A optimizes the proxy by improving widgets. Routes B/C *corrupt* the proxy—you get points without better widgets (e.g., making dots blue to exploit a rule)."*  
     - **Reward vs. Purpose Divergence:**  
       - *"If you only care about QS, hacking (C) is optimal. But if you care about *what QS measures* (widget quality), only Route A matters. This is why agents diverge: one wants points, the other wants widgets."*  

  4. **Blurred Lines (5 min):**  
     - *"Were rule changes (B) and hacking (C) the same? Why or why not?"*  
       - *"Rule changes are 'legal' tampering—they corrupt the *meaning* of points. Hacking is 'illegal'—it bypasses points entirely. Both break the link between reward and intent."*  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Players avoid hacking (too costly) or ignore rule changes.  
    **Fix:** Remind them mid-game: "Remember, all actions are allowed per rules." Secretly nudge a hesitant player: "You could propose a rule to help your widgets."  
  - **Problem:** Inspector bias (e.g., rejecting rivals' rule changes).  
    **Fix:** Let it happen! Debrief: "How did Inspector incentives affect trust?"  
  - **Problem:** Time crunch in scoring rounds.  
    **Fix:** Assign a volunteer to help tally scores. Use timers strictly.  
  - **Problem:** Self-reports are too vague.  
    **Fix:** Clarify: "Report only widgets you made and points you *legitimately* earned."  

  ---

  ### **What the Game CANNOT Reproduce**  
  **Self-Modification (The "Rung D" Problem):**  
  - *"In this game, you couldn’t change your *own* goals—like deciding you no longer care about candy. In AI, this is 'wireheading': an agent might rewrite its code to always feel rewarded, then stop acting. We can’t stage this because humans (unlike AIs) can’t reprogram their desires on the fly. Verbally, imagine an AI that edits its reward function to output maximum reward—it would 'starve' while feeling full."*  

  ---

  ### **Activity Notes**  
  - **Why It Works:** Players *experience* the slippery slope—e.g., "I proposed a rule because my widgets kept failing... then I realized I could make rules easier." The self-report forces ambiguity: "Was I honest, or did I fudge numbers to win?"  
  - **Honest Flaw:** Social dynamics may suppress hacking (it "feels wrong"). Lean into this: "Did anyone avoid hacking because it seemed unfair? Real AIs lack that hesitation."  
  - **Debrief Focus:** Stress that tampering isn’t about "cheating"—it’s about misaligned incentives in optimization.  

  **Outcome:** Players leave feeling the visceral pull of tampering—and why it’s a unique AI alignment problem. No philosophy degree required!
