answer: |-
  ## The Journal of Verified Volition
  **Instructions for Authors: Libet Compliance Statement Requirements**

  **(Revision 7.3, Effective January 1, 2024)**

  **1. Scope and Application**
     1.1 These requirements apply to all manuscripts submitted to *The Journal of Verified Volition (JVV)* that report original empirical data, meta-analyses, or theoretical models pertaining directly to the temporal sequencing of conscious intention formation, decision execution, or neural preparatory activity measured via electrophysiological (e.g., EEG, MEG) or hemodynamic (e.g., fMRI, fNIRS) methods in the context of spontaneous, volitional motor acts.
     1.2 Manuscripts solely reporting on instructed, externally-cued, or purely reactive movements are exempt. Studies investigating the neural correlates of "urges" or "intentions" unrelated to imminent motor execution must explicitly justify exemption in the cover letter.
     1.3 Compliance is mandatory for publication. Non-compliant submissions will be administratively rejected prior to peer review.

  **2. The Libet Compliance Statement (LCS)**
     2.1 A completed LCS must be uploaded as a separate supplementary document at the time of initial submission. The LCS template (`JVV_LCS_Template_v7.3.docx`) is available on the journal website.
     2.2 The LCS must be signed by the corresponding author, affirming the accuracy and completeness of the provided information under the standards of responsible scientific reporting.

  **3. Content of the Libet Compliance Statement**
      The LCS must explicitly address the following points in the designated sections:

      **3.1 Paradigm Specification**
      *   3.1.1 Describe the method used for temporal event marking (e.g., Libet clock, auditory train, visual cue sequence). If employing a rotating visual stimulus (clock face), specify:
          *   Rotation speed (degrees/sec or ms/degree) and screen size/viewing distance.
          *   The specific instruction given to participants regarding reporting the time of the "urge" (W) and/or the time of movement (M). *Verbatim instructions must be provided in the supplementary methods.*
          *   How attentional allocation to the timing device versus the internal state was addressed in instructions and/or measured (e.g., post-experiment questionnaires on clock focus).
      *   3.1.2 Detail the instruction given to participants concerning the generation of the intention to act. Specifically, state whether participants were instructed to:
          *   "Let the urge arise spontaneously," "Avoid pre-planning," or equivalent.
          *   Deliberately choose *when* to act within a timeframe.
          *   Deliberately choose *which* action (e.g., left/right finger) to perform.
      *   3.1.3 Specify the motor act(s) under investigation (e.g., finger flexion, wrist extension, button press force threshold) and the method of movement detection (e.g., EMG onset, mechanical switch closure, force transducer, motion capture).

      **3.2 Temporal Landmark Definitions & Reporting**
      *   3.2.1 Define operationally and report the mean (± SD or SEM) and range for:
          *   `W`: The reported time of first conscious awareness of the intention/urge to move.
          *   `M`: The objectively measured time of movement initiation.
          *   `RP_onset` (or equivalent): The time point of onset for the identified neural preparatory signal (e.g., Bereitschaftspotential, Lateralized Readiness Potential, fMRI activation onset in SMA/pre-SMA). State the specific algorithm or criteria used for onset detection (e.g., deviation from baseline by X SDs, threshold crossing, expert rater).
      *   3.2.2 Report the mean temporal difference (± appropriate statistical measure) between `RP_onset` and `W`, and between `W` and `M`.
      *   3.2.3 State the statistical method used to test the significance of the `RP_onset` -> `W` -> `M` sequence.

      **3.3 Neural Signal Characterization**
      *   3.3.1 Explicitly state whether the reported neural preparatory signal (`RP_onset` etc.):
          *   (a) Is derived solely from trial averaging techniques.
          *   (b) Is detectable and measurable in single-trial analyses in a significant proportion of participants/trials. If (b), describe the single-trial detection method and provide summary statistics on detectability rates.
      *   3.3.2 Acknowledge the theoretical stance taken regarding the relationship between the reported neural signal (`RP_onset`) and the conscious report (`W`). Select one or more options and justify briefly (<50 words):
          *   `[ ]` `RP_onset` reflects a necessary neural precursor to `W`.
          *   `[ ]` `W` is the conscious correlate of `RP_onset`.
          * `[ ]` `RP_onset` and `W` reflect parallel processes.
          * `[ ]` `W` is a retrospective interpretation constructed near `M`.
          * `[ ]` Other (Specify): _________________________

      **3.4 The Veto Interval & "Free-Won't"**
      *   3.4.1 If the experimental design incorporated trials or conditions where participants were instructed to *veto* or *abort* a developing intention *after* becoming aware of the urge (`W`) but *before* executing the movement (`M`):
          *   Describe the veto instruction verbatim.
          *   Report the mean time between `W` and successful veto execution (`V`).
          *   Report the neural correlates (if measured) associated with successful veto trials compared to executed intention trials.
      *   3.4.2 If the study did not include explicit veto trials, but discusses the theoretical implications of the `RP_onset -> W` interval as a potential "veto window":
          *   Acknowledge the absence of empirical data on veto execution within the reported paradigm.
          *   Explicitly state whether any claims regarding the functional capacity for "free-won't" within the observed interval are based on: `[ ]` Extrapolation, `[ ]` Separate literature, `[ ]` Theoretical argument, `[ ]` Not claimed.
      *   3.4.3 *Regardless of inclusion of veto trials*, manuscripts must address the following in the LCS: "Does the analysis or interpretation account for the possibility that the neural initiation of a *veto* process might itself possess a non-conscious antecedent signal analogous to the RP for action? If so, how is this addressed methodologically or theoretically? If not, state 'Not Addressed'."

  **4. Interpretation & Wording Restrictions (Embedded in LCS)**
      *   4.1 The LCS must include the following mandatory declaration: "The authors confirm that the manuscript text avoids definitive causal language implying the neural preparatory signal (`RP_onset`) *causes* the conscious intention (`W`) in an absolute, exceptionless manner for all participants and trials, unless single-trial causality is empirically established and reported per section 3.3.1(b)."
      *   4.2 The LCS must include the following mandatory declaration: "The authors confirm that the manuscript text avoids stating or implying that the data presented constitute definitive proof for or against the philosophical concept of 'free will' *in its entirety*. Discussion is restricted to the temporal dynamics of intention reports, neural preparation, and motor execution within the specific experimental constraints reported."
      *   4.3 Claims regarding the "decision" being made unconsciously *must* be qualified by specifying: "the measured onset of the averaged neural preparatory signal precedes the averaged subjective report of conscious intention."

  **5. Integration with Manuscript**
      *   5.1 Key details from the LCS (e.g., verbatim instructions, temporal landmark definitions, RP detection criteria, single-trial detectability result, veto trial details if applicable) must be clearly reported within the main manuscript Methods section.
      *   5.2 The Discussion section must explicitly engage with the limitations and assumptions inherent in the paradigm as documented in the LCS (Sections 3.3.2, 3.4.3, 4.1, 4.2), particularly concerning signal averaging, causal interpretation, the nature of `W`, and the status of the veto.
      *   5.3 The completed LCS will be published as supplementary information alongside the manuscript if accepted.

  **6. Review Process**
      *   6.1 The Editorial Office will perform an initial check for LCS completeness and basic compliance.
      *   6.2 Reviewers will be specifically instructed to evaluate the accuracy of the LCS against the manuscript content and methodology, and the adequacy with which the manuscript addresses the constraints and limitations outlined in the LCS (Sections 3.3, 3.4, 4).
      *   6.3 Discrepancies between the LCS and the manuscript, or failure to adequately address the LCS-mandated considerations in the Discussion, constitute grounds for major revision or rejection.

  **The Journal of Verified Volition** is committed to methodological rigor and conceptual clarity in the challenging domain of volitional chronometry. The Libet Compliance Statement ensures standardization of reporting for critical paradigm elements, facilitates direct comparison across studies, and promotes transparent acknowledgment of the inherent complexities and interpretative boundaries within this research tradition.
