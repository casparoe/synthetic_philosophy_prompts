prompt: |-
  Quick context so you know what you're dealing with: I'm a software engineer (backend/infra mostly, a bit of ML plumbing) at a mid-size health-tech company, and through a chain of bad decisions by people more senior than me I've somehow ended up owning what we call the model fairness review. Every time a team wants to put a model into production that touches people -- who gets enrolled in a care-management program, who gets flagged for a follow-up call, which claims get auto-approved, that kind of thing -- it comes to me and I have to sign off or send it back. Right now I'm just doing vibes, and I'd like to not do vibes. The annoying part is I've read enough to know that the whole area has these results that say you basically can't have everything at once: if you want the scores to be calibrated (a 0.8 really means 0.8 in every group) then you can't also have equal false positive and false negative rates across groups, unless the groups have the same base rate or your model is perfect, which it never is. And then there's the whole mess of whether you should even feed the protected attribute in, whether using a proxy for it is worse, and the fact that the groups in our data genuinely do have different base rates. I don't have a stats PhD and neither does anyone on my team, and half the time the data we'd need (race, language, disability) is only recorded for a subset of patients anyway.

  So what I want from you is a decision procedure my team can actually run, in order, on a proposed model: the questions to ask first, what counts as a good enough answer to each one, where the procedure just stops with a no, and where it hands the decision back to a human because it's a values call and not a math call (I'm fine with that, I just need to know which steps those are so I stop pretending they're technical). It has to be something a competent engineer can execute in about a week without a statistician in the room, it has to produce a document that our legal person and one of the clinicians will actually sign, and it should be explicit about which fairness-ish criteria we're trading against each other at each fork, since I gather you can't max them all and somebody has to choose. It should also say what to do when we can't get a number for something (small groups, missing attributes, proxy variables that are doing more work than we admit), and it should be honest about the places where the procedure will misfire or where we're dressing up a judgment as a step. Please don't just tell me 'it depends' -- I need the actual sequence.

  Then run it on three cases so I can see how it behaves: (1) a model that prioritizes patients for a care-management program, where the outcome we care about is who actually gets help and the groups have different base rates; (2) a resume screener we're being pressured to ship, where the thing we can measure is interview pass rate and nobody agrees what 'fair' even means here; (3) a claims auto-approval model where the cost of a false approval is money and the cost of a false denial is somebody not getting care, and the two groups have very different denial rates today. At least one of these should come out with an answer the team won't like, and if the procedure can't really separate two of these cases, say so instead of inventing a distinction. Finish by telling me what this procedure can't do and which calls I should stop trying to make myself and push up to someone who's allowed to own a value judgment.
reasoning: |-
  We are designing a decision procedure for model fairness review. The procedure must be executable by a competent engineer in about a week, produce a document for legal and clinical sign-off, and explicitly handle trade-offs and missing data.

  Key principles:
  1. Acknowledge that multiple fairness criteria are often incompatible (e.g., independence, separation, sufficiency).
  2. We cannot avoid value judgments, so the procedure must clearly flag when a decision is non-technical and requires human input (e.g., from legal, clinical, or company leadership).
  3. Be pragmatic about data limitations (missing protected attributes, small groups, proxy variables).

  The procedure will be structured in steps. At each step, we either proceed, stop and reject, or escalate for a value judgment.

  Definitions:
  - Protected attribute (PA): The attribute we are concerned about (e.g., race, gender). We may have to use proxies if the attribute is missing, but we must be cautious.
  - Base rate: The prevalence of the positive outcome in a group.

  Fairness criteria we consider (but note: we can't satisfy all at once):
  - Independence: The model's predictions are independent of the protected attribute (demographic parity). 
  - Separation (a.k.a. equalized odds): The model's predictions are independent of the protected attribute given the true outcome (equal FPR and FNR across groups).
  - Sufficiency: The true outcome is independent of the protected attribute given the model's prediction (calibration by group).

  Steps:

  1. **Problem Scoping**
     - Ask: What is the model's purpose? What is the positive outcome? What is the cost of false positives and false negatives?
     - Ask: Which protected attributes are relevant? (e.g., race, gender, age, disability, language) 
     - Ask: Do we have data on these attributes? If not, can we use proxies? (Note: using proxies can be problematic and may require legal review.)
     - If no protected attribute data and no reasonable proxy (or if using a proxy is deemed too risky by legal), then stop: we cannot proceed without data. The model must be rejected until data collection is improved.
     - Output: A clear statement of the model's intended use, the protected attributes under consideration, and the data sources for these attributes (including any proxies).

  2. **Base Rate Assessment**
     - For each protected group, compute the base rate (if the outcome is available in the data). 
     - If base rates are very different (e.g., relative difference > 20%), note this. This will affect which fairness criteria can be achieved.
     - If base rates are missing for a group because of data limitations, note the limitation and the potential impact.

  3. **Model Performance and Fairness Metrics**
     - Evaluate overall model performance (e.g., AUC, accuracy, F1) to ensure it meets minimum requirements.
     - For each protected group, compute:
          - False Positive Rate (FPR)
          - False Negative Rate (FNR)
          - Positive Predictive Value (PPV) and Negative Predictive Value (NPV) [if sample size allows]
          - Calibration (if the model outputs probabilities, check calibration by group)
     - If any group has a significantly worse performance (e.g., FPR or FNR difference > 10% absolute, or relative difference > 20%) or poor calibration, note it.

  4. **Trade-off Analysis and Value Judgment**
     - Present the fairness criteria that are in conflict given the base rates (if they are different). For example:
          - If we require equal FPR and FNR (separation), then we cannot have independence (demographic parity) unless base rates are equal or the model is perfect.
          - If we require calibration (sufficiency) and the base rates are different, then we cannot have equal FPR and FNR.
     - Ask: What is the business or ethical priority?
          - Option 1: Minimize harm to protected groups? (e.g., ensure similar FNR if the cost of a false negative is high)
          - Option 2: Ensure equal opportunity? (e.g., equal FPR and FNR, i.e., separation)
          - Option 3: Ensure similar treatment rates? (e.g., independence, i.e., demographic parity)
          - Option 4: Ensure that the scores are well-calibrated per group? (sufficiency)
     - This step requires human input. We must convene a meeting with legal, clinical, and business stakeholders to decide on the priority.

  5. **Mitigation and Threshold Setting**
     - Based on the chosen priority in step 4, set thresholds for the fairness metrics. For example:
          - If the priority is to avoid disparate impact (independence), then require that the positive prediction rate (selection rate) for each protected group is within X% (e.g., 80% rule, i.e., the ratio of the selection rate of the least favored group to the most favored group should be at least 0.8).
          - If the priority is equalized odds (separation), require that FPR and FNR differences are below a threshold (e.g., absolute difference < 5%).
          - If the priority is calibration, require that the calibration curves by group are close (e.g., expected calibration error < 0.01) and that the model is calibrated on each group.
     - If the model does not meet the chosen threshold, then we must either:
          - Reject the model and ask for retraining with fairness constraints or a different approach.
          - Accept the model with a waiver if the business case is strong and the fairness issue is deemed acceptable by stakeholders (with documentation of the decision and rationale).

  6. **Documentation and Sign-off**
     - Compile a report that includes:
          - The model's purpose and the protected attributes considered.
          - The data used (including any proxies and their potential biases).
          - Base rates by group.
          - Model performance overall and by group (including FPR, FNR, PPV, NPV, calibration).
          - The fairness trade-off that was chosen and the rationale from stakeholders.
          - The thresholds set and whether the model met them.
          - Any limitations (e.g., small sample sizes, missing data).
          - The decision: approved, approved with conditions (e.g., monitoring), or rejected.
     - Obtain signatures from legal, clinical, and the model owner.

  Now, we run the procedure on the three cases.

  ---

  **Case 1: Care-management program prioritization model**

  - **Purpose**: Prioritize patients for a care-management program. The outcome is whether the patient would benefit (e.g., avoid a costly adverse event). 
  - **Protected attribute**: Race (with base rates differing by race, e.g., due to systemic factors).
  - **Data**: Race is recorded for 80% of patients, but we have to impute for 20% (using a proxy like geographic location, which is known to be noisy and potentially biased).

  *Step 1: Problem Scoping*
     - Outcome: Patient would benefit (binary).
     - Protected attribute: Race. We have data for 80%, and we use a proxy for the rest. Legal has approved the use of the proxy for this purpose, but we note the potential for bias.
     - Proceed.

  *Step 2: Base Rate Assessment*
     - Base rates: Group A (White): 10%, Group B (Black): 15%, Group C (Hispanic): 12%. Relative differences are large (e.g., Group B has 50% higher base rate than Group A).

  *Step 3: Model Performance and Fairness Metrics*
     - Overall AUC is 0.75, which is acceptable.
     - By group:
          - Group A: FPR=10%, FNR=20%
          - Group B: FPR=15%, FNR=25%
          - Group C: FPR=12%, FNR=22%
     - Calibration: The model is well-calibrated for Group A and Group C, but for Group B, the calibration is off (predicted probabilities are too low).

  *Step 4: Trade-off Analysis and Value Judgment*
     - Because base rates differ, we cannot have both equal FPR/FNR and calibration. We must choose.
     - The cost of false negatives is high (patient doesn't get needed care) and false positives (offering the program to someone who doesn't need it) is moderate (resource waste).
     - We convene stakeholders. They decide that the priority is to avoid false negatives (especially for the group with the highest base rate, which is also the group with the highest FNR) and to have calibrated scores so that the priority score reflects the actual risk.
     - Therefore, the priority is calibration and controlling FNR.

  *Step 5: Mitigation and Threshold Setting*
     - Thresholds:
          - Calibration: Expected calibration error (ECE) < 0.02 for each group. Currently, Group B has ECE=0.05 -> fails.
          - FNR: Absolute difference from the best group (Group A: 20%) should be < 5%. Group B has 25% (5% absolute difference from Group A) -> meets if we set threshold at 5% but borderline.
     - Since calibration fails for Group B, we cannot approve the model as is. We suggest:
          - Retrain the model with calibration constraints for Group B.
          - Or, adjust the threshold for Group B to lower FNR (but then calibration might be worse).

  *Step 6: Documentation and Sign-off*
     - Report: 
          - Model performance and fairness metrics show issues for Group B.
          - The model is rejected until calibration for Group B is improved.

  ---

  **Case 2: Resume screener model**

  - **Purpose**: Screen resumes to select candidates for interviews. The outcome is whether the candidate would pass the interview (but note: we don't have this for all candidates, only those interviewed).
  - **Protected attribute**: Gender (binary: male/female, but note non-binary individuals are not represented in the data). 
  - **Data**: Gender is self-reported in the application, but about 30% are missing. We cannot use a proxy because it would be too unreliable.

  *Step 1: Problem Scoping*
     - Outcome: Pass interview (binary). But note: we only have this for candidates who were interviewed (selected by the model or otherwise). This introduces selection bias.
     - Protected attribute: Gender. Data is missing for 30%. We cannot use a proxy (per legal: too risky). 
     - We must reject the model because we cannot properly evaluate fairness without data for 30% of candidates. We recommend collecting gender data (with an option for non-binary and prefer-not-to-say) and reevaluating.

  *Decision: Reject.*

  ---

  **Case 3: Claims auto-approval model**

  - **Purpose**: Automatically approve claims that are clearly valid. The outcome is whether the claim is truly valid (as determined by a later manual review if denied, but note: auto-approved claims are not reviewed).
  - **Protected attribute**: Language (English vs. non-English speakers). 
  - **Data**: Language is recorded for 90% of claims. For the rest, we use the language of the claim form (proxy: may be inaccurate if the form was translated).
  - **Current system**: Non-English speakers have a higher denial rate today.

  *Step 1: Problem Scoping*
     - Outcome: Claim is valid (binary). We have data from manual reviews for denied claims, but auto-approved claims are not reviewed. We must use a sample of auto-approved claims for validation (if available) or rely on historical data.
     - Protected attribute: Language. We have data for 90%, and a proxy for 10%. Legal approves the proxy.

  *Step 2: Base Rate Assessment*
     - Base rates: English speakers: 95% of claims are valid, non-English speakers: 85% are valid.

  *Step 3: Model Performance and Fairness Metrics*
     - Overall accuracy: 92%.
     - By group:
          - English: FPR=1% (denying a valid claim), FNR=5% (approving an invalid claim)
          - Non-English: FPR=10% (denying a valid claim), FNR=3% (approving an invalid claim)
     - Calibration: The model is calibrated for English speakers but overestimates the validity for non-English speakers (so non-English speakers are more often incorrectly denied).

  *Step 4: Trade-off Analysis and Value Judgment*
     - The cost of false positives (approving an invalid claim) is monetary loss. The cost of false negatives (denying a valid claim) is that the patient doesn't get care and may suffer health consequences.
     - Stakeholders must decide: 
          - Option A: Prioritize minimizing FPR (denying valid claims) because of the harm to patients? 
          - Option B: Prioritize minimizing FNR (approving invalid claims) to control costs?
     - Given that non-English speakers already face a higher denial rate and the cost of a false denial is high (health impact), stakeholders decide that the priority is to reduce FPR for non-English speakers (i.e., ensure that valid claims are not denied) even if it means more invalid claims are approved (higher FNR). 
     - They also want the model to be calibrated.

  *Step 5: Mitigation and Threshold Setting*
     - The current FPR for non-English speakers (10%) is too high. We set a threshold: FPR difference between groups should be < 5% absolute. Currently, the difference is 9% (10% vs 1%). 
     - Calibration: The model is not calibrated for non-English speakers (overly optimistic). 
     - The model fails both criteria for non-English speakers.
     - We must reject the model and either:
          - Retrain with fairness constraints to reduce FPR for non-English speakers.
          - Adjust the threshold for non-English speakers to lower FPR (but then FNR would increase).

  *Step 6: Documentation and Sign-off*
     - Report: 
          - The model has a high FPR for non-English speakers and is not calibrated for that group.
          - The model is rejected until these issues are resolved.

  ---

  **What this procedure can't do and when to escalate:**

  - **Can't do**:
     - Resolve fundamental trade-offs without human input (step 4 is always a value judgment).
     - Compensate for poor data quality or missing protected attributes (if no proxy is available or approved, we must reject).
     - Guarantee fairness in the presence of unmeasured confounding or historical bias in the data.
     - Handle very small groups (we may not have enough data to compute metrics reliably) - in such cases, we must note the limitation and possibly reject the model if the group is protected and the risk is high.

  - **Escalate**:
     - When there is a trade-off between fairness criteria (step 4) - this requires stakeholders to set the priority.
     - When the model fails the fairness thresholds but the business wants to deploy anyway - this requires a risk assessment and sign-off by legal and leadership.
     - When defining the cost of errors (false positives vs false negatives) - this requires input from clinical, legal, and business.

  Finally, note that this procedure is a living document and should be updated as the field evolves and as the company's policies change.
answer: |-
  Below is a structured, step-by-step decision procedure for model fairness review. It's designed to be executed by a software engineer in ~1 week, produce auditable documentation, explicitly flag value judgments, and handle real-world constraints (missing data, proxies, trade-offs). The procedure is grounded in established fairness impossibility results but avoids overcomplication.

  **Core Principles**:
  - **Trade-offs are explicit**: You can't satisfy calibration, equal FPR/FNR, and demographic parity simultaneously when base rates differ. The procedure forces stakeholders to pick one priority.
  - **No statistical PhD required**: Uses practical thresholds (e.g., 80% rule, 5% absolute difference) and off-the-shelf tools (SHAP, AIF360, ROC curves).
  - **Handles missing data**: Clear rules for proxies, small groups, and partial data.
  - **Escalates values calls**: Flags when math stops and ethics/business decisions start.
  - **Fail-fast**: Rejects early for unsalvageable issues (e.g., no PA data).

  ---

  ### **Fairness Review Procedure**  
  *Run this sequence for each model. Expect 3-5 days for analysis, 1-2 days for stakeholder review.*

  #### **Step 1: Define Protected Attributes & Outcome**  
  **Questions**:  
  - What legally protected attributes (PA) are relevant? (e.g., race, gender, age, disability, language)  
  - What is the *outcome variable* (Y)? Is it well-defined and measured reliably?  
  - Does the PA exist in the data? If missing, what proxy is used?  

  **Thresholds**:  
  - **✅ Proceed if**: PA is directly available for >70% of samples OR a legally approved proxy exists.  
  - **❌ Reject if**: PA data is <50% available AND no legal-approved proxy.  
  - **⚠️ Escalate to legal if**: Using a proxy (e.g., ZIP code for race) – legal must confirm it’s permissible.  

  **Output**: Document PAs, outcome, proxy justification, and data coverage.  

  #### **Step 2: Assess Base Rates & Data Gaps**  
  **Actions**:  
  - Compute base rate (prevalence of Y=1) for each PA group.  
  - Flag if base rates differ by >20% relative difference (|rate_groupA - rate_groupB| / max(rate_groupA, rate_groupB) > 0.2).  
  - If a group has <100 samples, mark metrics as "unreliable" for that group.  

  **Thresholds**:  
  - **⚠️ Escalate to clinical/legal if**: Base rates differ significantly (>20% relative) – this makes fairness trade-offs unavoidable.  
  - **✅ Proceed if**: Groups have >100 samples OR differences are explainable (e.g., clinical risk factors).  

  **Output**: Base rate table with sample sizes. Note any small/unreliable groups.  

  #### **Step 3: Select Primary Fairness Criterion**  
  **Actions**:  
  - Present stakeholders (legal, clinical, product) with 3 choices:  
    - **Option A (Parity)**: Equal selection rate (demographic parity). Use if avoiding disparate impact is critical (e.g., hiring).  
    - **Option B (Accuracy)**: Equal FPR/FNR (separation). Use when errors have similar harm (e.g., spam detection).  
    - **Option C (Calibration)**: Scores are equally reliable (sufficiency). Use when scores inform decisions (e.g., risk scores).  
  - **Forced trade-off**: If base rates differ, stakeholders *must* pick one. No "all of the above."  

  **Thresholds**:  
  - **❌ Reject if**: Stakeholders refuse to prioritize one criterion.  
  - **⚠️ Escalate if**: Costs of FP/FN are asymmetric (e.g., FN = death, FP = cost). Clinical must weigh harm.  

  **Output**: Signed stakeholder agreement on the chosen criterion.  

  #### **Step 4: Evaluate Model Against Chosen Criterion**  
  **Actions**:  
  - Split data by PA group. Compute:  
    - **For Parity (A)**: Selection rate (mean prediction). Apply *80% rule*: (min_selection_rate / max_selection_rate) ≥ 0.8.  
    - **For Accuracy (B)**: FPR and FNR. Max absolute difference between groups ≤5%.  
    - **For Calibration (C)**: Calibration curve slope (1.0 is perfect). Groups must have slope 0.9–1.1.  
  - If proxy used, repeat analysis with proxy and note discrepancies.  

  **Thresholds**:  
  - **✅ Pass if**: Criterion met AND no group has unreliable metrics.  
  - **⚠️ Mitigate if**: Criterion nearly met (e.g., 78% for 80% rule). Apply post-hoc adjustment (e.g., threshold tweaking).  
  - **❌ Reject if**: Criterion failed by >10% margin (e.g., 70% for 80% rule) OR a group has FPR/FNR >2× worse.  

  **Output**: Metric tables, pass/mitigate/reject recommendation.  

  #### **Step 5: Harm Assessment & Final Sign-off**  
  **Actions**:  
  - For rejected models: Quantify harm disparity (e.g., "Group X has 2× higher FNR").  
  - For passing models: Document residual risks (e.g., "Base rate differences may cause outcome disparities").  
  - Legal/clinician sign-off required on:  
    - Proxy use justification (if applicable).  
    - Fairness criterion choice.  
    - Residual risks.  

  **Thresholds**:  
  - **❌ Reject if**: Unmitigated harm to a protected group (e.g., FNR difference >10% in a life-impacting model).  
  - **✅ Approve if**: Signed by legal + clinician.  

  **Output**: Final report with sign-off lines.  

  ---

  ### **Case Studies**  
  *Using the procedure above:*

  #### **Case 1: Care-Management Prioritization**  
  - **Outcome**: Patient "needs help" (Y=1). **PA**: Race (base rates: White=15%, Black=8%, proxy=ZIP code).  
  - **Step 1**: PA available for 60% → proxy allowed (legal approved).  
  - **Step 2**: Base rates differ (46% relative difference) → escalate. Stakeholders agree disparity reflects real need.  
  - **Step 3**: Stakeholders pick **Option B (Accuracy)** – equal FNR is critical (missing someone who needs help).  
  - **Step 4**: FNR difference = 7% (Black 12% vs. White 5%) → **❌ Reject** (exceeds 5% threshold).  
  - **Step 5**: Harm = Black patients 2.4× more likely to be missed. Clinician refuses sign-off.  
  - **Outcome**: Rejected. Team must reduce FNR disparity.  

  #### **Case 2: Resume Screener**  
  - **Outcome**: Passes interview (Y=1). **PA**: Gender (data: 40% missing, no proxy).  
  - **Step 1**: PA coverage <50% → **❌ Reject immediately**. No analysis possible.  
  - **Outcome**: Rejected. Team must collect gender data or abandon.  

  #### **Case 3: Claims Auto-Approval**  
  - **Outcome**: Claim is valid (Y=1). **PA**: Language (base rates: English=89%, Spanish=75%).  
  - **Step 1**: PA available for 90% → proceed.  
  - **Step 2**: Base rates differ (16% relative) → escalate.  
  - **Step 3**: Stakeholders pick **Option C (Calibration)** – scores must be trustworthy for appeals.  
  - **Step 4**: Calibration slope: English=1.0, Spanish=0.82 → **❌ Reject** (Spanish scores are misleading).  
  - **Step 5**: Harm = Spanish speakers get inflated scores → more false approvals. Legal signs off due to cost savings, clinician objects.  
  - **Outcome**: Escalate to executive team (values conflict).  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Resolve fairness-value conflicts**: When legal/clinician disagree (e.g., Case 3), push to execs.  
  2. **Fix biased data**: If base rates reflect systemic bias (e.g., Case 1), the math won’t save you – escalate.  
  3. **Handle tiny groups**: Groups with <100 samples get "unreliable" tag; reject if high-stakes.  
  4. **Enforce perfect fairness**: You’ll still ship imperfect models – but with explicit trade-offs.  

  ### **Calls to Stop Making Yourself**  
  Escalate these to stakeholders (legal/clinician/execs):  
  - **"Which fairness criterion?"** (Step 3).  
  - **"Is this proxy acceptable?"** (Step 1).  
  - **"Is residual harm justified?"** (Step 5).  
  - **"Do base rates reflect reality or bias?"** (Step 2).  

  **Final Advice**: Use this to force conversations. Your job isn’t to be the fairness oracle – it’s to make trade-offs visible so stakeholders own the fallout. Reject early, document everything, and never let a model ship without a signed fairness trade-off.
