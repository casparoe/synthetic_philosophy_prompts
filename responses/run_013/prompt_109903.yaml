  ### Designing Choice Problems to Distinguish Regret Theory from Probability Weighting  

  As a decision theorist specializing in non-expected utility under risk, I'll design two choice problems to separate **regret theory** (Loomes and Sugden) from **probability weighting** (rank-dependent utility or cumulative prospect theory). The key is to hold the marginal distributions of lotteries A and B fixed across both problems while varying the joint distribution (pairing of outcomes across states). This ensures:  
  - Probability weighting theories (e.g., RDU, CPT) depend only on marginals, so their verdict *must* be identical in both problems.  
  - Regret theory depends on state-wise comparisons, so it *may* reverse preferences if the regret/rejoice pattern changes.  

  I'll use three equally likely states (probabilities = 1/3 each) with realistic monetary prizes (£).  

  ---

  ### **Choice Problems**  
  **Marginal Distributions (Fixed):**  
  - **Lottery A**: Outcomes = {£10, £50, £100} each with probability 1/3.  
  - **Lottery B**: Outcomes = {£0, £60, £90} each with probability 1/3.  

  **Problem 1: "Low-Regret Pairing"**  
  - Minimizes regret for A: Large rejoice in one state outweighs moderate regret in others.  
  - States and payoffs:  

  | State (Probability) | Lottery A | Lottery B |  
  |---------------------|----------|----------|  
  | **s₁ (1/3)**       | £100     | £0       |  
  | **s₂ (1/3)**       | £50      | £90      |  
  | **s₃ (1/3)**       | £10      | £60      |  

  **Problem 2: "High-Regret Pairing"**  
  - Maximizes regret for A: One state with severe regret (large loss relative to B) dominates.  
  - States and payoffs:  

  | State (Probability) | Lottery A | Lottery B |  
  |---------------------|----------|----------|  
  | **s₁ (1/3)**       | £10      | £90      |  
  | **s₂ (1/3)**       | £50      | £0       |  
  | **s₃ (1/3)**       | £100     | £60      |  

  Note:  
  - Marginals are identical across problems. For A: {£10, £50, £100} each with prob. 1/3. For B: {£0, £60, £90} each with prob. 1/3.  
  - Only the joint distribution (pairing of outcomes) changes.  

  ---

  ### **Analysis of Competing Theories**  
  #### **1. Expected Utility (EU) Verdict**  
  - EU evaluates lotteries solely on marginals. Let \(u(x)\) be a utility function. For simplicity, assume linear utility \(u(x) = x\) (risk neutrality; any concave \(u\) yields the same ranking).  
  - **EU(A)** = \(\frac{1}{3}(10 + 50 + 100) = \frac{160}{3} \approx 53.33\).  
  - **EU(B)** = \(\frac{1}{3}(0 + 60 + 90) = \frac{150}{3} = 50.00\).  
  - **Verdict**: EU prefers A over B in both problems.  

  #### **2. Rank-Dependent Utility (RDU) / Probability Weighting Verdict**  
  - RDU transforms cumulative probabilities via a weighting function \(w(p)\). It depends *only* on the marginal distribution of each lottery.  
  - The marginal distributions for A and B are identical across problems. Thus, the RDU value for A is identical in both problems, and likewise for B.  
  - For example, with Tversky-Kahneman probability weighting (\(w(p) = \frac{p^\gamma}{(p^\gamma + (1-p)^\gamma)^{1/\gamma}}\)), or any other \(w\), the ranking of A vs. B depends only on their marginals.  
  - **Verdict**: RDU prefers A over B in both problems (since A stochastically dominates B and RDU respects this under mild assumptions).  

  **Conclusion**: EU and RDU *must* prefer A in both problems. No reversal is possible.  

  ---

  ### **Regret Theory Analysis**  
  Regret theory evaluates lotteries pairwise and state-wise. The utility of choosing A over B is:  
  \[
  V(A|B) = \sum_{s} p_s \left[ u(A_s) - k \cdot \max(0, u(B_s) - u(A_s)) \right],
  \]  
  where \(k > 0\) is a regret-aversion parameter, and \(u(x) = x\) (linear utility). Similarly, \(V(B|A)\) is defined. **A is chosen if \(V(A|B) > V(B|A)\).**  

  #### **Problem 1: Low-Regret Pairing**  
  - \(V(A|B)\) calculation:  
    - s₁: \(u(A) = 100\), \(\max(0, u(B) - u(A)) = \max(0, 0 - 100) = 0\) → Contribution: \(100 - k \cdot 0 = 100\).  
    - s₂: \(u(A) = 50\), \(\max(0, 90 - 50) = 40\) → Contribution: \(50 - k \cdot 40\).  
    - s₃: \(u(A) = 10\), \(\max(0, 60 - 10) = 50\) → Contribution: \(10 - k \cdot 50\).  
    - Total: \(V(A|B) = \frac{1}{3} \left[ 100 + (50 - 40k) + (10 - 50k) \right] = \frac{1}{3} (160 - 90k)\).  
  - \(V(B|A)\) calculation:  
    - s₁: \(u(B) = 0\), \(\max(0, 100 - 0) = 100\) → Contribution: \(0 - k \cdot 100 = -100k\).  
    - s₂: \(u(B) = 90\), \(\max(0, 50 - 90) = 0\) → Contribution: \(90 - k \cdot 0 = 90\).  
    - s₃: \(u(B) = 60\), \(\max(0, 10 - 60) = 0\) → Contribution: \(60 - k \cdot 0 = 60\).  
    - Total: \(V(B|A) = \frac{1}{3} \left[ -100k + 90 + 60 \right] = \frac{1}{3} (150 - 100k)\).  
  - **Preference for A?**:  
    \[
    V(A|B) > V(B|A) \iff \frac{160 - 90k}{3} > \frac{150 - 100k}{3} \iff 160 - 90k > 150 - 100k \iff 10 > -10k \iff k > -1.
    \]  
    Since \(k \geq 0\), this holds for all \(k\). **A is always preferred**.  

  #### **Problem 2: High-Regret Pairing**  
  - \(V(A|B)\) calculation:  
    - s₁: \(u(A) = 10\), \(\max(0, 90 - 10) = 80\) → Contribution: \(10 - k \cdot 80\).  
    - s₂: \(u(A) = 50\), \(\max(0, 0 - 50) = 0\) → Contribution: \(50 - k \cdot 0 = 50\).  
    - s₃: \(u(A) = 100\), \(\max(0, 60 - 100) = 0\) → Contribution: \(100 - k \cdot 0 = 100\).  
    - Total: \(V(A|B) = \frac{1}{3} \left[ (10 - 80k) + 50 + 100 \right] = \frac{1}{3} (160 - 80k)\).  
  - \(V(B|A)\) calculation:  
    - s₁: \(u(B) = 90\), \(\max(0, 10 - 90) = 0\) → Contribution: \(90 - k \cdot 0 = 90\).  
    - s₂: \(u(B) = 0\), \(\max(0, 50 - 0) = 50\) → Contribution: \(0 - k \cdot 50 = -50k\).  
    - s₃: \(u(B) = 60\), \(\max(0, 100 - 60) = 40\) → Contribution: \(60 - k \cdot 40 = 60 - 40k\).  
    - Total: \(V(B|A) = \frac{1}{3} \left[ 90 + (-50k) + (60 - 40k) \right] = \frac{1}{3} (150 - 90k)\).  
  - **Preference for A?**:  
    \[
    V(A|B) > V(B|A) \iff \frac{160 - 80k}{3} > \frac{150 - 90k}{3} \iff 160 - 80k > 150 - 90k \iff 10 > 10k \iff k < 1.
    \]  
    - If \(k < 1\), **A is preferred**.  
    - If \(k > 1\), **B is preferred** (reversal!).  

  **Regret Theory Verdict**:  
  - **Problem 1**: Always prefer A (for all \(k \geq 0\)).  
  - **Problem 2**: Prefer A if \(k < 1\), prefer B if \(k > 1\).  
  - **Reversal for \(k > 1\)**: A is chosen in Problem 1, but B is chosen in Problem 2.  

  ---

  ### **Key Structural Feature and Robustness**  
  #### **What Drives the Reversal?**  
  The reversal stems from **high regret in one state** (Problem 2, s₁: A=£10 vs. B=£90). When regret aversion (\(k\)) is strong enough:  
  - In Problem 1, the large rejoice in s₁ (£100 vs. £0) offsets moderate regret in s₂ and s₃.  
  - In Problem 2, the severe regret in s₁ (£10 vs. £90) dominates, outweighing rejoice in s₂ and s₃.  

  **If we remove this feature**:  
  - If the high-regret state (s₁ in Problem 2) is replaced with moderate regret (e.g., £30 vs. £50), the reversal disappears.  
  - For example, if Problem 2 had {A=£30, B=£50} in s₁, then \(V(A|B)\) and \(V(B|A)\) would not flip for \(k>1\).  

  #### **Pushback from a Rank-Dependent Theorist**  
  A proponent of RDU might argue:  
  1. **Artefact of Regret Specification**: The reversal relies on an arbitrary regret function (e.g., the omission of rejoicing or the linear penalty). If rejoicing is included or the regret function is calibrated differently, the effect vanishes.  
  2. **Probability Weighting Can "Explain" It**: If the decision weights change due to *correlation* between lotteries, RDU might accommodate reversals. However, this violates RDU's core axiom (marginalism), making it indistinguishable from regret theory.  
  3. **Empirical Plausibility**: The reversal might stem from framing or context effects, not regret. For instance, the high-regret state in Problem 2 highlights a potential loss, triggering loss aversion (a CPT phenomenon).  
  4. **Simplicity**: RDU has fewer parameters and avoids ad hoc state-wise comparisons. Regret theory's pairwise evaluations become intractable with many options.  

  #### **Conclusion**  
  This design cleanly separates the theories:  
  - A reversal occurs under regret theory for \(k > 1\).  
  - EU and RDU *cannot* produce a reversal due to fixed marginals.  
  To test empirically, run experiments with these problems and manipulate regret salience. If reversals correlate with high-regret states, it supports Loomes and Sugden; if not, probability weighting may suffice.
