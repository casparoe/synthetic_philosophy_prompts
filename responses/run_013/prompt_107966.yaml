  Hmm, the user is struggling with a dense passage from Engels on the housing question. They're preparing for a reading group and need help reconstructing the argument beneath the polemical surface. They've highlighted three specific blocks: the meaning of "so-called," the apparent contradiction between housing shortage as a "secondary evil" yet requiring revolution to solve, and the implications for reformist measures.

  First, the "so-called" bit. Engels is clearly making a distinction here. He's not denying the material reality of bad housing but challenging how bourgeois discourse frames it as a unique modern crisis. His point about all oppressed classes suffering similarly suggests he's attacking the idea that capitalism created housing misery from scratch. That matters because it prevents mistaking symptoms for root causes. 

  Now the big contradiction. User's nailed it - how can housing shortage be both a minor by-product AND require overthrowing capitalism to fix? The key is in Engels' distinction between "exploitation of the worker as worker" (wage theft at point of production) versus secondary mechanisms like land speculation. For him, the former is primary; the latter are derivative. But crucially, you can't permanently fix derivative issues because they regenerate from the core capitalist logic. Like weeding dandelions without pulling roots. So the "abolish exploitation" line isn't causal (revolution magically builds houses) but structural: only systemic change removes the engine producing housing crises.

  On reforms... Engels would see them as palliatives. Notice his sarcasm about the shortage only becoming political when petty bourgeoisie suffer. That implies reforms might happen when elites feel pressure, but they'll be limited - like his example of developers avoiding worker housing when pricier options yield more profit. He'd say rent controls etc. might temporarily ease symptoms but can't stop capitalism's spatial logic (centres for profit, peripheries for workers). 

  The "right to the city" angle is fascinating. Engels shows how land commodification inherently negates such rights - workers get expelled from centres not by accident but by value extraction. So a coherent "right" would require decommodification, which circles back to... revolution. Classic Engels.

  User's really done their homework here. The depth of their questions suggests they've wrestled with this. Might be worth emphasizing how Engels' analysis makes housing struggles inherently political - not technical problems but class conflicts over urban space.
answer: |-
  Here's a careful explanation of the passage, addressing your specific queries while reconstructing Engels's underlying argument step-by-step, using British English:

  **1. The "So-called" Housing Shortage & Historical Distinction:**
  *   **What "so-called" withholds:** Engels isn't denying the *reality* of poor housing or the *current acute pressure* on finding/affording it. He withholds the *bourgeois framing* of the problem. He challenges the idea that this is a novel, inexplicable crisis unique to modern industrial society or somehow separate from the fundamental structures of class society.
  *   **The Historical Distinction & Why it Matters:** Engels insists that *bad, overcrowded, unhealthy housing* is the universal, baseline condition for *all* oppressed classes throughout history under exploitative systems (feudalism, slavery, etc.). This matters profoundly because:
      *   It refutes the notion that capitalism *created* worker housing misery *de novo*. Misery is inherent in class oppression.
      *   It shifts focus: the core evil is the *oppression/exploitation itself*, of which bad housing is a *symptom* or *consequence*. Solving housing alone, without addressing exploitation, doesn't solve the root problem of oppression.
      *   It sets up his definition of the *specific modern* "housing shortage": not the baseline bad housing, but the *intensification* and *acute crisis* driven by capitalist urbanisation dynamics, which *also* happens to now affect the petty bourgeoisie.

  **2. Reconciling "Secondary Evil" & "Only Abolishing Exploitation Solves It":**
  *   **The Strongest Version of the Argument:**
      1.  **Core Exploitation ("as worker"):** This is the direct appropriation of surplus value at the point of production – the capitalist pays the worker less than the value their labour creates. This fundamental relationship generates the proletariat's *poverty*.
      2.  **Secondary Evils (incl. Housing Shortage):** These are *indirect consequences* flowing from the *operation* of the capitalist system *based on* that core exploitation, but not identical to it. The acute housing shortage is caused by specific mechanisms *enabled by* capitalism: rapid urbanisation (driven by industrial capital's need for labour concentration), the commodification of land (turning it into a speculative asset), and the profit-driven logic of urban development (replacing "low-value" worker housing with higher-rent uses in desirable locations).
      3.  **Why Abolition is the Only Solution:**
          *   **Structural Reproduction:** The acute shortage isn't an accident; it's *systematically generated* by the logic of capital accumulation. As long as land is a commodity and development is driven by profit maximisation (requirements of the capitalist mode of production), the dynamics Engels describes (rising land values, displacement to peripheries, under-supply of affordable housing) will persistently recreate the crisis, even if temporarily alleviated. Policy tweaks attack symptoms, not the generative mechanism.
          *   **Root Cause:** The *power* driving these urban dynamics (capital's need to expand and valorise itself) and the *poverty* making workers vulnerable to displacement *both* stem from the core exploitation of the working class. Abolishing this exploitation removes the engine driving the system and the condition (worker poverty) that makes them susceptible to its secondary effects.
  *   **Nature of the Claim ("abolish exploitation"):** The claim is primarily **political-strategic**, grounded in a **structural/causal analysis**. Engels argues that:
      *   *Causally:* The root cause of the *system's tendency* to produce such crises is the capitalist mode of production itself, founded on exploitation.
      *   *Strategically:* Therefore, any solution that doesn't address this root cause (i.e., revolution to abolish class exploitation) will be, at best, partial and temporary. It cannot *permanently* "make an end of" the housing shortage because it doesn't remove the underlying logic that constantly recreates it. The "only means" claim asserts that systemic change is the necessary *precondition* for a fundamental solution.

  **3. Short of Abolition & The "Right to the City":**
  *   **Measures Short of Abolition (Reforms):** Engels doesn't explicitly say they *must* fail entirely. He implies they are:
      *   **Palliative, Not Curative:** They might alleviate *some symptoms* for *some people* temporarily (e.g., rent control might slow increases for existing tenants, public housing might house a few).
      *   **Limited by the System:** Their effectiveness is severely constrained by the logic of capitalism:
          *   *Profit Motive:* As he notes, builders prefer lucrative projects over worker housing ("offered a much better field for speculation"). Reforms fighting this (e.g., subsidies, mandates) face constant resistance and are often diluted or circumvented.
          *   *Land Speculation:* Rising land values, driven by capital concentration, constantly undermine affordability and incentivise displacement, making genuinely affordable housing provision difficult and expensive.
          *   *Class Power:* Reforms are only enacted when pressure is high (often when the petty bourgeoisie are also affected) and are shaped by bourgeois interests. Engels is deeply sceptical of the system's ability/willingness to solve a problem generated by its own logic.
      *   **Cannot Solve the Shortage:** Crucially, Engels argues reforms *cannot* be "the solution" to the *fundamental* shortage as he defines it (the systemic crisis generated by capitalist urbanisation) because they don't alter the generative mechanisms. The shortage is a structural outcome, not just a lack of supply solvable by policy adjustments within capitalism.
  *   **Why it "Gets Talked Of":** This remark is profoundly insightful about **what turns hardship into a political question**.
      *   While workers suffer baseline bad housing chronically, it only becomes a *major political issue* ("talked of so much") when it significantly impacts a class (the petty bourgeoisie) with more political voice, access to the press, and perceived legitimacy within the bourgeois system.
      *   It highlights the *class bias* in what gets defined as a "crisis" worthy of attention and potential reform. Worker suffering is often normalised or ignored until it spills over or threatens other classes.
  *   **Implications for "Right to the City":** The passage directly challenges the coherence of a "right to the city" *if land remains a commodity*.
      *   Engels demonstrates that the commodification of land and its development driven by exchange-value (profit) inherently conflicts with use-value needs (like dwelling). Workers are *forcibly expelled* ("forced out") from central areas *because* the land becomes too valuable for them.
      *   Under these conditions, a "right" to inhabit the city centre, to be free from displacement, or to have affordable housing is systematically violated by the very logic of the capitalist urban land market. The "right" is rendered incoherent or unenforceable against the power of capital accumulation.
      *   Engels implies that the *only* way to realise a genuine "right to the city" (meaningful access, freedom from displacement, control over living space) is to abolish the system that commodifies land and subordinates urban development to profit – i.e., the abolition of capitalist exploitation and the establishment of a system where use-value predominates. The "right thing to demand," strategically, is the abolition that enables such a right.

  In essence, Engels argues that the *acute* modern housing crisis is a specific product of capitalist urbanisation dynamics (land speculation, displacement), which are themselves secondary consequences of the core capitalist exploitation at the point of production. While reforms might offer temporary relief, only the abolition of the exploitative class system can permanently resolve the crisis by removing its root cause and the logic that constantly recreates it. The passage exposes the limitations of bourgeois reforms and implicitly argues that genuine urban justice requires revolutionary change.
