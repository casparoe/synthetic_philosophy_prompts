  ### Session Flow & Timing  
  - **0:00–0:15:** Past vs. Evidence (fragments activity)  
  - **0:15–0:35:** Source Function & Kadesh Example (focus: purpose of Egyptian/Hittite texts)  
  - **0:35–0:55:** Misconception Battles (using Kadesh to dismantle each myth)  
  - **0:55–1:25:** Check Question & Discussion (small groups then debate)  
  - **1:25–1:30:** Wrap-Up & Omission Statement  

  **Why Kadesh over Troy?**  
  Schliemann’s Troy implies "archaeology confirms text," muddying the lesson. Kadesh offers:  
  - No hero/villain narrative (avoids myth baggage).  
  - Two *written* perspectives + archaeology that *contextualizes* without resolving claims.  
  - Shows sources as weapons of propaganda—perfect for "what was this for?"
