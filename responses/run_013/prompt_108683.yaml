  We are designing a 90-minute session on source criticism for adults in a great books group with no history background but sharp and skeptical. The goal is to shift their thinking from "is this source accurate?" to "what was this source for?".

  Plan Outline:

  1. **Introduction (10 mins):** 
     - Set the stage: How do we know about the distant past? 
     - Present the core problem: The past is gone; we only have surviving evidence. 
     - Introduce the key shift: Instead of just asking if a source is accurate, we must ask what its purpose was.

  2. **The Gap: Past vs. Surviving Evidence (15 mins):**
     - Idea: The past is not directly accessible. We have fragments (artifacts, texts) that survived by chance or design. 
     - Activity: Ask them to think about what traces of today will survive 500 years from now. What would future historians know about our time? 
     - Why here? This must come first because without understanding that we are dealing with a tiny, biased sample of the past, they cannot grasp why we need to ask about the source's purpose.

  3. **Introducing the Carrying Example (5 mins):**
     - Present the example that will carry the session. We need an example that:
       - Must have: Multiple types of sources (textual, archaeological, etc.) and clear evidence of the source's purpose (not just accuracy).
       - Must lack: A straightforward "proof" of a famous event (to avoid the Schliemann pitfall).
     - I recommend using **the reign of King Arthur** (or the Arthurian legends) because:
       - Everyone has heard of it.
       - It has textual sources (like Geoffrey of Monmouth's "History of the Kings of Britain") that are clearly not contemporary and have a political/religious purpose.
       - Archaeology does not "prove" Arthur existed, but shows post-Roman Britain, which is the context.
       - The example lacks a clear archaeological link to Arthur himself, thus avoiding the "proof" trap.

  4. **Bias and Purpose (20 mins):**
     - Idea: Every source is created for a reason (to persuade, to record, to celebrate, to criticize, etc.). That purpose shapes what is included and how it is presented.
     - Activity: Examine a short excerpt from Geoffrey of Monmouth. Ask: What was Geoffrey trying to accomplish? (He was writing to create a glorious British past, linking it to Rome and Troy, to boost national pride in the 12th century.) 
     - Why here? After establishing the gap, we can now ask: Given that we have this source, what was it for? How does that affect what it says? 
     - This step depends on the gap because without understanding that the source is a survival, we might take it at face value.

  5. **Testing the Evidence: Not Just Agreement (15 mins):**
     - Idea: Two sources agreeing doesn't necessarily mean it happened; they might share a common source or bias. We need to look at the nature of the sources and their independence.
     - Activity: Compare two Arthurian sources (e.g., Geoffrey and later chroniclers who copied him). Do they agree? Why might that be? 
     - Why here? After discussing purpose, we can see that agreement might be due to shared motives or copying, not independent confirmation. 
     - Defuse misconception: "Two sources agreeing means it happened."

  6. **Older Isn't Necessarily More Reliable (10 mins):**
     - Idea: An older source might be closer in time, but it might also be more fragmentary, or have its own biases. A later source might have access to lost information, but also more layers of distortion.
     - Activity: Look at the earliest mention of Arthur (e.g., in the 9th-century "Historia Brittonum") vs. Geoffrey's 12th-century account. Which is more reliable? The earlier one is closer in time but still centuries after the events and has its own agenda. 
     - Why here? After discussing purpose and testing, we can see that age alone doesn't guarantee reliability. 
     - Defuse misconception: "Older is more reliable."

  7. **A Biased Source Is Not Useless (10 mins):**
     - Idea: Bias tells us about the author's perspective and the context. It can be more valuable than a "neutral" source (which doesn't exist) because it reveals contemporary concerns.
     - Activity: Using Geoffrey again, note that his bias towards glorifying Britain tells us about 12th-century England and its needs. 
     - Why here? After working with the example and understanding purpose, we see that bias is a feature, not a bug. 
     - Defuse misconception: "A biased source is useless."

  8. **If It Wasn't Written Down, It Didn't Happen? (5 mins):**
     - Idea: Oral traditions, archaeology, and other non-written evidence are crucial, but they require different methods of interpretation.
     - Activity: Briefly mention the archaeological evidence of post-Roman Britain (like Tintagel) and how it doesn't prove Arthur but shows a society that could have inspired the legends. 
     - Why here? At the end, because it expands the idea of evidence beyond texts. 
     - Defuse misconception: "If it wasn't written down it didn't happen."

  9. **Conclusion and Check Question (10 mins):**
     - Summarize: We don't have the past; we have evidence. To interpret it, we must ask what the source was for, not just if it's true.
     - Check Question: **"If we found a new text that claimed to be an eyewitness account of King Arthur's coronation, what questions would you ask about it before believing it?"**
       - We want to hear: Who wrote it? When? For what purpose? How did it survive? What does the author gain? (Not just: Is it true?)
     - Omitted on Purpose: We are not covering advanced methods (like carbon dating, statistical analysis) or specific historiographical debates. We are focusing on the foundational shift in questioning.

