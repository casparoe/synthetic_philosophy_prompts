answer: |-
  ### Teaching Plan: Understanding Historical Evidence

  #### **Core Progression of Ideas**  
  1. **Past vs. Surviving Evidence** (15 mins)  
     - **Why first?** Without establishing that the past is inaccessible and we only have *fragments*, learners won’t grasp why sources must be interrogated beyond surface "accuracy."  
     - **Activity:** Show an image of a fragmented artifact (e.g., a broken pot) and ask: *"What can this tell us? What can’t it tell us?"*  

  2. **Source Function Precedes Bias** (20 mins)  
     - **Why next?** "Bias" is meaningless until learners see sources as *tools* created for specific purposes.  
     - **Dependency:** Builds on #1. If evidence is fragmentary, we must ask *why this fragment survived*.  

  3. **Carrying Example: The Battle of Kadesh** (25 mins total)  
     - **What it is:** Pharaoh Ramesses II’s accounts vs. Hittite records of the same battle (c. 1274 BCE).  
     - **Must have:**  
       - Competing narratives from opposing sides.  
       - Archaeological evidence (e.g., temple reliefs, treaties) that *contextualizes* the texts.  
       - Clear examples of sources serving propaganda (e.g., Ramesses’ inscriptions glorifying himself).  
     - **Must lack:**  
       - A "smoking gun" that "proves" one side (avoids archaeology-as-confirmation bias).  
       - Firsthand accounts (highlights lost evidence).  
     - **Why it works:**  
       - Texts openly exaggerate (Ramesses claims solo victory; Hittites claim he fled).  
       - Archaeology shows the battle happened but doesn’t verify details.  
       - Teaches that sources are *arguments*, not mirrors of truth.  

  4. **Addressing Misconceptions**  
     | Misconception | When to Address | How to Defuse |  
     |---------------|----------------|--------------|  
     | **"Older = more reliable"** | Immediately after introducing Kadesh sources (step 3) | Contrast Ramesses’ near-contemporary account (biased propaganda) with the later Hittite treaty (more objective but fragmentary). Ask: *"Does age guarantee truth?"* |  
     | **"Biased source = useless"** | During source-function analysis (step 2) | Use Ramesses’ reliefs: *"They lie about his victory, but what do they reveal about Egyptian statecraft?"* (Shows bias as *data*). |  
     | **"Two agreeing sources = proof"** | When comparing Egyptian/Hittite records (step 3) | Note that both sides agree the battle happened—but disagree on everything else. Ask: *"Does agreement on one fact mean their stories are reliable?"* |  
     | **"No written record = didn’t happen"** | During past vs. evidence discussion (step 1) | Show Çatalhöyük settlement (pre-literate, but reveals complex society via archaeology). Ask: *"If no one wrote about them, did they exist?"* |  

  5. **Check-for-Understanding Question** (10 mins)  
     - **Question:** *"We have two accounts of a medieval battle: one from a king’s chronicle celebrating his victory, and one from a peasant’s diary describing famine after the war. Which is more ‘reliable’?"*  
     - **Goal:** Reveals if they prioritize *purpose* (the chronicle is for propaganda; the diary for personal record) over "accuracy." Correct answer: *Both are useful for different questions.*  

  6. **Omitted on Purpose**  
     - **Explicitly state:** *"We’re not covering forensic methods (like carbon dating) or how historians cross-reference 50+ sources. Today is about the first step: changing how we question what’s in front of us."*  

  ---

