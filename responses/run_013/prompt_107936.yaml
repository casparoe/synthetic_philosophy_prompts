  We are going to design two games that illustrate the power and the breakdown of the symmetry assumption (that if all players are identical reasoners, they will all do the same thing). The first game will be a symmetric game where the symmetry argument leads to a cooperative outcome. The second game will be a symmetric game where the symmetry argument breaks down because every symmetric choice yields the same payoff, leading to a breakdown in coordination (like the Luring Lottery). Then we break symmetry in the third round to show how an external device (like a convention or a random device) can restore coordination.

   Game 1: The Symmetric Cooperation Game (Inspired by the Platonia Dilemma)

   Setup: 
   - 16 students.
   - Each student has two choices: COOPERATE (C) or DEFECT (D).
   - The payoff structure is symmetric and as follows:
     - If at least 14 students choose C, then each student who chose C gets 10 tokens, and each student who chose D gets 0 tokens.
     - If fewer than 14 choose C, then every student who chose C gets 0 tokens, and every student who chose D gets 5 tokens.

   Why this works with symmetry:
   - If everyone is an identical reasoner and they all assume that everyone will do the same, then they must all choose C or all choose D.
   - If they all choose D, each gets 5 tokens.
   - If they all choose C, each gets 10 tokens (if at least 14 choose C, which they will if all 16 choose C). 
   - Therefore, the symmetric outcome (all C) is better than the symmetric outcome (all D). So the symmetry argument leads to cooperation.

   But note: There is an incentive to defect if you think enough others will cooperate. However, the symmetry argument ignores that and says: we are all the same, so we all do the same. And if we are going to do the same, then we should all choose C because 10>5.

   However, without the symmetry argument, a student might think: "If I defect and at least 14 others cooperate, I get 5 (which is less than 10) but if I defect and too few cooperate, I get 5 anyway. But if I cooperate and too few cooperate, I get 0. So it's risky to cooperate. But if I assume everyone is like me and we all cooperate, then we get 10. But if I think others might think like this and then defect, then I might get 0. So there's a tension."

   We want the symmetry argument to be the focal point that leads to cooperation.

   Game 2: The Luring Lottery (Symmetric but leads to breakdown)

   Setup:
   - Each student chooses an integer from 1 to 100 (or even without bound, but we bound it for practicality). 
   - The prize: a fixed pot of tokens, say 160 tokens (so 10 tokens per student if divided equally) but the twist is that the pot is divided by the *sum* of all numbers chosen. Then each student gets: (chosen number) * (pot / total sum). 
   - But note: if everyone chooses 1, then total sum is 16, and each gets 1 * (160/16) = 10 tokens. 
   - However, if a student chooses 2 and everyone else chooses 1, then total sum = 15 + 2 = 17, and the student gets 2*(160/17) ≈ 18.82 tokens, which is more than 10. 
   - But if everyone chooses 2, then each gets 2 * (160/32) = 10 tokens. 
   - In fact, if everyone chooses the same number x, then each gets x * (160/(16*x)) = 160/16 = 10 tokens, regardless of x.

   So the symmetry argument: if we all choose the same number, we all get 10 tokens. But which number? Any common choice yields 10. So the symmetry argument does not tell us which number to choose. 

   Moreover, each student has an incentive to choose a number higher than what they think the average will be, because if you choose a higher number and the total sum doesn't increase too much, you get more. But if everyone does that, the total sum becomes huge and everyone gets almost nothing. 

   This game is symmetric but the symmetry argument does not pin down a specific action. Hence, we expect a breakdown: students will choose large numbers and the total sum will be high, leading to low payoffs.

   Third Round: Breaking Symmetry

   We break symmetry by introducing a public signal. For example, we flip a coin and announce the result. Then we tell the students: if the coin is heads, everyone must choose 1 in the lottery game; if tails, everyone must choose 2. 

   Then we run the lottery game again. Now, the symmetry is broken by the coin. Everyone will choose the same number (either 1 or 2) and they will get 10 tokens each. 

   This shows that an external device (a public signal, a convention) can restore coordination.

   Timeline for 80 minutes:

   1. Introduction (5 minutes): Explain the first game (Cooperation Game) and the rules. Emphasize that they are to make their choices anonymously and independently.

   2. Round 1: Cooperation Game (10 minutes)
      - Hand out slips of paper for the first game. Each slip has two options: C and D. They circle one and put it in an envelope (to ensure anonymity). 
      - Collect the envelopes and tally the results. Announce how many chose C and D, but not who. Then distribute the payoffs (tokens) accordingly.

   3. Discussion (5 minutes): Ask them to reflect on why they chose what they did. But don't give away the symmetry argument yet.

   4. Round 2: Lottery Game (15 minutes)
      - Explain the rules of the lottery: They choose an integer between 1 and 100. The prize pot is 160 tokens. The total sum S is the sum of all numbers. Each student receives: (their chosen number) * (160 / S). 
      - Hand out slips for the lottery. They write their chosen number and put it in an envelope. 
      - Collect and compute the total sum. Then compute each student's payoff and distribute tokens.

   5. Break (5 minutes) - optional, but if you feel the session is long, take a break here.

   6. Round 3: Lottery Game with a Twist (10 minutes)
      - Before they choose, flip a coin in front of the class. Announce the outcome (say, heads). Then tell them: "For this round, if the coin is heads, everyone should choose 1. If tails, choose 2." 
      - They play again. They are allowed to choose any integer, but the suggestion is to follow the coin. 
      - Collect and compute. They should all choose 1 (or 2) and get 10 tokens each.

   7. Debrief (30 minutes): 
      - Start by asking about the first game: 
          - What did they think when they decided? 
          - Why did some cooperate and some defect? 
          - What if we assumed everyone would do the same? Then what would we choose? (We'd choose C because 10>5.)
      - Then the lottery game:
          - What happened? Why did the total sum get so high? 
          - What if we all chose the same number? Then we would get 10. But why didn't we? (Because any common choice is as good as any other, so there is no focal common choice. And individually, I can get more by choosing a higher number if others don't.)
      - Then the third round:
          - How did the coin flip help? It created a focal point. Everyone knew what to expect because of the public signal.
      - Then draw the contrast:
          - In the first game, the symmetry argument (we all do the same) led us to a clear best common action: C. 
          - In the lottery, the symmetry argument (we all choose the same x) doesn't tell us which x to choose, because every x gives the same payoff. So we need something else: a convention, a public signal, a random device.

   8. Concluding Remarks (5 minutes): 
      - The key idea: when the symmetry argument works, it can lead to cooperation. When it doesn't, we need coordination devices. 
      - The piece that the game cannot do: In reality, people are not identical reasoners. They might not all follow the symmetry argument. In the first game, even if we all agree that we should all do C, one person might think "but if I defect and everyone else cooperates, I get 5 and they get 10? Or maybe I get 0? Wait, the rules say that if at least 14 cooperate, I get 0 if I defect? Actually, in our rule, if at least 14 cooperate, then defectors get 0. So if I defect and I think exactly 14 others will cooperate, then I get 0. But if I cooperate and exactly 14 cooperate (including me), then I get 10. So it's risky to defect if I think we are close to 14. But if I think we won't get to 14, then I should defect to get 5. The symmetry argument is a way to cut through that: we all do the same, and we choose the action that gives the best common outcome. But in reality, we might not trust that everyone will follow. That's why we sometimes need repeated interactions or institutions to enforce cooperation. 

