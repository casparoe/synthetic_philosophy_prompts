answer: |-
  ### Game Design: Symmetry & Cooperation in 80 Minutes  
  **Core Insight:** Experience the shift from individual best-response reasoning ("What's best for me given others?") to symmetric reasoning ("What if we all do the same?"), and its breakdown when symmetry fails to pin down a unique action.  

  ---

  #### **Materials**  
  - **Photocopies:** Slips for choices (3 rounds).  
  - **Tokens:** Represent payoffs (e.g., poker chips, buttons).  
  - **Anonymity Tools:** 16 envelopes, a shoebox for submission, a whiteboard for public results.  
  - **Prize:** $15 silly prize (e.g., giant candy bar, novelty mug).  
  - **Other:** Timer, calculator, coin.  

  ---

  ### **Game Rules & Payoffs**  
  **Round 1: Cooperation Game (Symmetry Works)**  
  - **Goal:** Achieve group cooperation via symmetric reasoning.  
  - **Rules:**  
    - Each student chooses **Blue** or **Red**.  
    - **Payoffs (per student):**  
      - If **≥12 choose Blue**: Blue gets 10 tokens, Red gets 0.  
      - **Otherwise**: Blue gets 0 tokens, Red gets 5 tokens.  
  - **Symmetry Insight:** If all choose the same, Blue yields 10 tokens/person, Red yields 5. Symmetric reasoning favors Blue.  

  **Round 2: Lottery Game (Symmetry Breaks)**  
  - **Goal:** Highlight symmetry failure (every common choice pays equally).  
  - **Rules:**  
    - Each student picks an **integer between 1 and 100**.  
    - **Prize Pot:** 120 tokens total.  
    - **Your payoff**: `(Your number) × (120 ÷ Total of all numbers)`.  
      - *Example:* All choose 1 → Each gets `1 × (120/16) = 7.5 tokens`.  
      - *Temptation:* If you pick 2 while others pick 1, you get `2 × (120/17) ≈ 14.1 tokens`.  
  - **Symmetry Insight:** If all pick the same number *X*, everyone gets `120 ÷ 16 = 7.5 tokens` regardless of *X*. No incentive to coordinate on any specific number!  

  **Round 3: Lottery with Coin Flip (Breaking Symmetry)**  
  - **Goal:** Restore coordination via an external signal.  
  - **Rules:**  
    - **Step 1:** Public coin flip (Heads → Target = 10; Tails → Target = 20).  
    - **Step 2:** Students pick any integer (but Target is suggested).  
    - Payoffs same as Round 2.  
  - **Insight:** Coin creates a focal point. If all follow Target, each gets 7.5 tokens.  

  ---

  ### **Timeline (80 Minutes Total)**  
  1. **Intro (5 min)**: Explain rules for Round 1. Emphasize anonymity.  
  2. **Round 1: Cooperation Game (15 min)**  
     - Students write **Blue/Red** on slips → seal in envelopes → drop in box.  
     - *Teacher tallies in secret*, announces:  
       - Number of Blue/Red.  
       - Payoffs (distribute tokens privately).  
  3. **Round 2: Lottery Game (20 min)**  
     - Explain payoff formula (give examples).  
     - Students write **integer (1-100)** on slips → envelopes → box.  
     - *Public tally*: List all numbers on board, compute total, announce payoffs.  
  4. **Break (5 min)**  
  5. **Round 3: Lottery with Coin Flip (15 min)**  
     - Flip coin publicly → set Target (10 or 20).  
     - Repeat Round 2 process.  
  6. **Debrief (20 min)**: Guide discussion using results (see below).  

  ---

  ### **Anonymity Protocol**  
  - **Slips:** Blank except for choice (no names).  
  - **Collection:** Envelopes sealed before box is passed.  
  - **Tally:**  
    - Round 1: Teacher opens envelopes privately.  
    - Rounds 2–3: Teacher opens envelopes, writes numbers on board (no attribution).  
  - **Payoffs:** Tokens distributed discreetly.  

  ---

  ### **Debrief Script**  
  **Question 1: Round 1 (Cooperation Game)**  
  - *What happened?* Likely few Blue (students defect fearing low turnout).  
  - *Symmetric reasoning:* "If we all do the same, what’s best?"  
    - All Blue → 10 tokens. All Red → 5 tokens.  
    - **Aha!** Symmetry pushes us to Blue.  

  **Question 2: Round 2 (Lottery Game)**  
  - *What happened?* Numbers scattered (e.g., 1 to 100); total sum high → payoffs low (e.g., ~1–3 tokens).  
  - *Symmetric reasoning:* "If we all pick the same *X*, what happens?"  
    - All get 7.5 tokens regardless of *X*!  
    - **Breakdown:** Symmetry doesn’t favor any *X* → no incentive to coordinate.  

  **Question 3: Round 3 (Coin Flip)**  
  - *What happened?* Most picked Target (e.g., 10 or 20). Payoffs clustered near 7.5.  
  - *Why did symmetry work now?*  
    - Coin created a **focal point** (arbitrary but public).  
    - Escape hatch: **External signal** (coin, convention, or random device) resolves ambiguity.  

  **Key Contrast:**  
  - Symmetry works when it points to a *unique best common action* (Blue in Round 1).  
  - Symmetry fails when *all common actions pay equally* (Lottery). Then, we need rules/flips.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem 1:** Round 1 payoff confusion.  
    - *Fix:* Pre-slips with examples: "If 12+ Blue: Blue=10, Red=0. Else: Blue=0, Red=5."  
  - **Problem 2:** Lottery math slowdown.  
    - *Fix:* Use calculator app; round payoffs to whole tokens.  
  - **Problem 3:** Round 3 defiance (e.g., ignoring coin).  
    - *Fix:* Celebrate it! "Why didn’t you follow? What would make you trust it next time?"  
  - **Problem 4:** Time crunch.  
    - *Fix:* Skip break; use pre-tallied examples if needed.  

  ---

  ### **What the Game Can’t Teach**  
  **The "Identical Reasoners" Gap:**  
  No payoff table can simulate *true identical reasoning*. Students differ in:  
  - Risk aversion (e.g., Round 1 defectors fear being "suckers").  
  - Trust (e.g., "Will others *really* follow symmetry?").  
  - Strategic depth (e.g., overthinking lottery incentives).  

  **Teacher’s Role:** Explicitly state:  
  > *"Symmetry assumes we all* reason identically *and* know we all do*. Real people don’t. That’s why we need tools like focal points—to align our expectations when pure logic isn’t enough."*  

  ---

  ### **Why This Works**  
  - **Rounds 1 vs. 2:** Sharp contrast between symmetry’s success (cooperation) and failure (chaos).  
  - **Round 3:** Coin flip models real-world solutions (e.g., traffic lights, traditions).  
  - **Tokens + Prize:** Incentivizes engagement; final prize lottery (tokens = tickets) keeps stakes low but fun.  

  **Run it straight through—no prep beyond photocopies. The chaos is the lesson!**
