prompt: |-
  I teach an upper-level aesthetics seminar and I'm writing the final. I want one essay question on fakes and forgeries that cant be answered by reciting the usual two moves — the one about a forgery misrepresenting somebody's achievement, and the one about it corrupting our understanding of a tradition. I dont want them name-dropping either move; I want them to have to work out whether those are actually the same argument wearing two hats. So I've built the question around three hypotheticals that aren't in anything they could have read, and now I need the model answer and a marking scheme. Keep the whole reply under 1500 words and the model answer itself under 700.

  Here's the question as I've drafted it. Tighten the wording if you want, but keep all three cases and the follow-up:

  A foundation has inherited three paintings, each catalogued under the name of a long-dead celebrated artist. It must decide, for each, whether its attachment to having the original is doing any aesthetic work, and if so what work.

  The Signature Case: the canvas was painted entirely by the artist's own hand, but the signature was added decades later by a dealer, along with fabricated letters of provenance. Nothing about the painted surface is deceptive. Only the paperwork is.

  The Studio Case: the painting was made by the artist's apprentice, following the artist's designs and under the artist's supervision, and the artist signed it. Later scholarship downgraded the attribution to school-of rather than by-the-artist. The apprentice later became a celebrated painter in his own right.

  The Labeled Forgery Case: a modern painter made it deliberately as a forgery, got caught, and it now hangs in a museum with a prominent label announcing that it is a forgery. Critics agree it is a better painting than the real works of the artist it imitates.

  Using the three cases, say whether the achievement argument and the corruption-of-understanding argument are one argument or two, and whether either survives the Labeled Forgery Case. Then say what a defensible account of the value of originals has to concede. Follow-up: would your answer change if the only surviving evidence of what the original looked like were a perfect copy?

  Now give me:

  1. A model answer of about 650 words that a strong student could plausibly produce in 90 minutes. It should not just survey positions; it should commit to a line.

  2. A marking scheme worth 25 marks, built as five must-hit points at 5 marks each, each point phrased as a specific move a top answer has to make rather than a topic it has to mention, and each with a one-line note on how candidates typically get that point wrong.

  3. One sentence on where the A/B boundary falls — what an A answer has that a solid B answer usually lacks.
reasoning: |-
  Okay, let me approach this systematically. The professor wants an original essay question on fakes/forgeries that avoids textbook arguments, with a model answer under 700 words and a detailed marking scheme. 

  First, I need to understand the core challenge: crafting a question that forces students to analyze whether the "achievement" and "corruption of understanding" arguments are distinct. The three hypothetical cases are cleverly designed to test this - each disrupts conventional wisdom differently. The Signature Case isolates documentary fraud from artistic execution, the Studio Case blurs authorship boundaries, and the Labeled Forgery Case decouples aesthetic quality from authenticity.

  For the model answer, I consider building around these key insights:
  - The "achievement" and "corruption" arguments collapse into one because both rely on misattribution distorting historical context
  - The Labeled Forgery Case proves authenticity claims can be severed from aesthetic experience when deception is removed
  - What survives is a weaker claim about originals as historical artifacts rather than aesthetic vessels
  - The follow-up question shows copies can functionally replace originals unless we value material continuity fetishistically

  The marking scheme should reward:
  1) Explicitly arguing the two positions are fundamentally the same core argument
  2) Applying all three cases to test the arguments' viability 
  3) Recognizing how labeling neutralizes the deception element 
  4) Conceding limited historical value to originals
  5) Consistently maintaining the distinction between aesthetic and historical value

  For the A/B boundary, I'll emphasize that A answers must demonstrate how the cases interconnect to systematically dismantle the traditional arguments, rather than just noting points in isolation.
answer: |-
  ## Model Answer (650 words)

  The achievement argument (that forgeries misrepresent an artist's accomplishment) and the corruption-of-understanding argument (that they distort our grasp of artistic traditions) are fundamentally one argument wearing two hats. Both ultimately rest on the core claim that misattribution prevents accurate historical contextualization, which is held to be essential for proper aesthetic appreciation. The three cases reveal this unity and expose the fragility of this contextualist foundation, especially under the pressure of the Labeled Forgery Case.

  In the **Signature Case**, the misrepresentation is purely documentary. The painted surface is authentic; only the *provenance* is forged. If accurate contextualization were solely about the physical object's creation context, this case shouldn't harm appreciation of the *painting itself*. Yet, most would feel the foundation’s attachment to the "original" status is undermined because the signature/paperwork misrepresents the *artist's act of completion and endorsement*. This shows the core concern isn't just the object's physical origin, but the accurate narrative of *who did what when*. The achievement argument (misrepresenting the artist's final act) and the corruption argument (misleading about artistic practices of completion/sale) collapse here: both are about corrupted historical narrative.

  The **Studio Case** intensifies this. Here, the misattribution concerns *degree* of authorship within a collaborative historical practice. Downgrading the attribution doesn’t change the physical object or its immediate creation context (supervision, studio system). The attachment to "original by the master" likely diminishes because the narrative shifts: it’s now seen as an apprentice's work under direction, later significant in *their* career. The corruption argument (misunderstanding the studio system) is indistinguishable from the achievement argument (misattributing primary execution). The value hinges on the *correct narrative* of agency within the tradition.

  The **Labeled Forgery Case** demolishes the necessity of this contextualization for *aesthetic experience itself*. The label removes the deception. Critics judge it aesthetically *superior* to the originals it imitates. If accurate historical contextualization were essential for aesthetic judgment, the label should restore our ability to appreciate the *real* artist's work (the forger) within *their* context (modern forgery). But the foundation’s attachment to the "original" (the inferior works by the imitated artist) seems purely historical and non-aesthetic. Aesthetically, the forgery, once labeled, can be appreciated *on its own merits*. The achievement/corruption arguments become irrelevant here because the context is known; they only apply where deception exists. What survives is a residual, non-aesthetic value for the original as a historical witness or relic.

  Therefore, a defensible account of the value of originals must concede that their *aesthetic* value is not inherently superior to perfect copies or even superior forgeries once deception is removed. The unique value of the original lies primarily in its *historical particularity*: its status as the actual artifact touched by the historical agent(s), serving as evidence or relic. This value is historical, evidential, or even quasi-sacral, but separable from the aesthetic experience generated by engaging with the object's form and content.

  **Follow-up:** If the only surviving evidence were a perfect copy, the answer reinforces the point. The original's unique historical value vanishes because the copy provides identical aesthetic properties and equivalent historical *information* about the lost work's appearance. Any remaining attachment to the *lost* original is purely about its material continuity as a relic – a value disconnected from its aesthetic function or the informational content accessible through the copy. The labeled forgery case already showed aesthetic value can exist independently of authentic history; the perfect copy scenario shows historical *information* can also be preserved without the original artifact.

  ---

  ## Marking Scheme (25 Marks Total - 5 marks per point)

  1.  **Explicitly argues the Achievement and Corruption arguments are fundamentally the same core argument.** (Must identify the shared foundation in accurate historical contextualization/narrative for aesthetic appreciation). *Common Error: Treating them as distinct without probing their shared basis, or merely listing differences.*
  2.  **Applies all three cases effectively to demonstrate the unity of the arguments and test their limits.** (Must use Signature to show documentary fraud undermines narrative, Studio to show agency narrative within tradition, and Labeled Forgery to show deception is key and aesthetic value can be independent). *Common Error: Discussing cases superficially or in isolation, failing to show how each probes the core argument.*
  3.  **Demonstrates why the Labeled Forgery Case fatally undermines the core argument.** (Must show the removal of deception allows independent aesthetic appreciation of the forgery, rendering the achievement/corruption concerns irrelevant for its aesthetic value, leaving only historical value for the originals). *Common Error: Arguing the labeled forgery is still "corrupting" or that achievement matters despite the label, or ignoring the critics' judgment.*
  4.  **Concedes the limited basis for valuing originals as historical artifacts/relics, separating this from inherent aesthetic superiority.** (Must clearly state that aesthetic value can reside in copies/forgeries when known, and originals hold unique historical/evidential value). *Common Error: Clinging to inherent aesthetic uniqueness for originals, or failing to define the conceded non-aesthetic value.*
  5.  **Uses the Follow-up consistently to reinforce the separation of aesthetic/historical information from material relic status.** (Must argue the perfect copy provides equivalent aesthetic experience and historical information, leaving only the lost original's value as a material relic). *Common Error: Suggesting the copy's value is lesser, or conflating the copy's status with the labeled forgery's status.*

  ---

  ## A/B Boundary Distinction

  **An A answer** seamlessly integrates the analysis of all three cases to systematically dismantle the core contextualist argument, consistently maintains the distinction between aesthetic value and historical/relic value throughout the main answer and follow-up, and offers a precise, defensible concession about original value, whereas a B answer typically handles the cases competently but less cohesively, might waver on separating aesthetic value, or provides a vaguer concession.
