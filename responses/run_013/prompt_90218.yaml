answer: |-
  Here's a thought experiment designed to your specifications:

  **The Cascade Surgery:** You are the head of a hospital ethics board reviewing an experimental surgical protocol. A brilliant but unorthodox surgeon proposes "Cascade Surgery": a single, high-risk operation on a healthy volunteer. The volunteer faces a 95% chance of immediate, painful death. However, if successful (5% chance), the volunteer survives unharmed *and* the surgeon gains unique insights. These insights would then allow her to perform a *second*, modified version of the surgery on another healthy volunteer. This second surgery also has a 5% success chance, but if successful, the insights gained would enable a *third* modified surgery with a slightly higher success chance (say, 6%), and so on. The surgeon estimates this chain could continue for up to 100 iterations. Crucially, each *success* in the chain doesn't just save the current volunteer but exponentially *improves* the success probability for *all future potential volunteers* in the chain by a tiny, uncertain amount (e.g., success probability increases by an estimated 0.01% *per previous success* for future surgeries). The surgeon passionately argues that if the chain runs to completion (100 successful surgeries), the cumulative knowledge will enable a *routine, safe procedure* saving an estimated 10,000 lives per year globally, forever. She admits her estimates of the chain's maximum length and the probability improvement per success are highly uncertain – she might be wildly overoptimistic, but she insists there's a real, non-zero chance she's roughly correct.

  **Expected Value (EV) Maximization Says: APPROVE THE FIRST SURGERY.**
  *   **Why:** EV focuses on the *potential* upside weighted by its probability. While the *direct* outcome of the first surgery is almost certainly one horrific death, EV compels you to consider the entire cascade.
      *   The probability of a *single* success (5%) is low, but non-zero.
      *   If the first succeeds, the probability of the *second* success might be slightly better than 5% (e.g., 5.0005%?).
      *   Crucially, the *potential* payoff is astronomical: saving 10,000 lives *every year indefinitely*. While the probability of the chain reaching 100 successes is vanishingly small (roughly (0.05)^100, an unimaginably tiny number), it's still technically *non-zero*.
      *   Multiplying this tiny probability by the enormous, near-infinite payoff (thousands of lives saved per year *forever*) results in a *finite but colossal* expected value contribution from this "miracle chain" outcome.
      *   The near-certainty of one death (EV: -0.95 lives) is massively outweighed by this colossal positive EV from the tiny chance of the chain succeeding completely and saving vast numbers forever.
      *   The surgeon's admitted uncertainty about the probability estimates doesn't negate this; EV averages over possible probabilities. As long as there's *some* non-zero probability she's even *partially* right about the potential payoff scale and the chain's feasibility, the EV calculation is dominated by that tail possibility.

  **Maximin Rule Says: REJECT THE FIRST SURGERY.**
  *   **Why:** Maximin focuses on avoiding the worst possible outcome. The *worst-case scenario* here is crystal clear: the first volunteer dies horrifically and painfully (95% chance), achieving nothing. The chain almost certainly stops immediately. Maximin dictates choosing the action with the *least bad* worst outcome. Refusing the surgery has a worst outcome of zero lives saved (status quo). Approving it has a worst outcome of one agonizing death with no benefit. Zero is better than negative one (in terms of lives). Maximin ignores the tiny chance of the massive payoff because it only cares about guaranteeing the best possible safety net.

  **The Single Feature Doing the Work:** **The combination of a potentially *unbounded* (or effectively infinite *duration*) payoff with *structural uncertainty in estimating the probability* of accessing even a tiny fraction of that payoff.**

  *   **Unbounded Duration Payoff:** Saving 10,000 lives *every year forever* is a finite payoff per year, but summed over infinite time, it's infinite. Even over a very long finite horizon (e.g., 1000 years), it's enormous (10 million lives). This magnitude is crucial.
  *   **Structural Uncertainty in Probability:** The surgeon's uncertainty about the chain length and the probability improvement per step isn't just a single uncertain probability; it's an *uncertainty cascade*. You aren't just uncertain about *one* number; you're uncertain about the *model* generating the probabilities for a long sequence of events, where success hinges on *every* step. This means the *effective probability* of the chain reaching 100 steps (and unlocking the payoff) is both extremely small *and* fundamentally difficult to pin down precisely. EV maximization is hypersensitive to any non-zero estimate of this probability when paired with the enormous payoff.

  **Tweaking the Feature: Removing the Uncertainty Cascade**
  *   Suppose instead the surgeon presents a *single*, well-understood surgery with a known 1-in-10^15 chance of success. If successful, it would *directly* and *immediately* trigger the development of the life-saving procedure, saving 10,000 lives/year forever. The probability is ludicrously small but precisely known.
  *   **Effect:** EV maximization *still* says APPROVE, as (1/10^15) * (Enormous Finite Value) > Cost of one life. However, this feels *less* monstrous/absurd to many. The sheer obviousness of the tiny probability makes rejecting it seem more reasonable, even under EV. The structural uncertainty cascade adds a layer of "this whole chain of reasoning might be fundamentally flawed," making the EV recommendation feel even more unhinged and reliant on tail risks buried within poorly understood models. The original case exploits the difficulty of confidently assigning *zero* probability to the complex chain unfolding as described.

  **How an EV Maximizer Defuses (Without Denying Arithmetic):**
  A committed EV maximizer would attack the *realism* of the payoff or the independence of the probabilities:
  1.  **Discounting the Future:** They'd argue future lives should be discounted. A 3% annual discount rate makes saving 10,000 lives in 100 years worth only a tiny fraction of saving them today, drastically reducing the payoff's present value.
  2.  **Correlation of Failures:** They'd argue the probabilities aren't independent. An early failure likely reveals a fundamental flaw, making future success probabilities effectively zero, not slightly improved. This dramatically reduces the chance of very long chains.
  3.  **Bounding the Payoff:** They'd insist the "forever" claim is unrealistic. Technological change, societal collapse, or medical advances would make the procedure obsolete within, say, 200 years, capping the total lives saved.
  4.  **Questioning the Probability Model:** They'd demand rigorous evidence for the probability improvement mechanism per success, arguing the surgeon's model is likely flawed or overstated, reducing the *plausible* estimate of the chain's maximum length or the payoff probability to near-zero.

  **Conclusion:** This "Cascade Surgery" scenario demonstrates how EV fanaticism emerges not from infinity or gods, but from the structural interaction of three elements: (1) finite but potentially vast and *long-duration* payoffs, (2) vanishingly small (but non-zero) probabilities of accessing those payoffs, and (3) crucially, *deep structural uncertainty* in estimating those probabilities, particularly within complex chains of events. This uncertainty makes it impossible to confidently exclude the tiny-probability/huge-payoff scenario, forcing EV maximization to prioritize it over near-certain, immediate, and horrific costs. Maximin, focusing only on the guaranteed worst outcome (a death), avoids this fanaticism but ignores the potential upside entirely. The case highlights how EV's core strength – sensitivity to tail risks – becomes a profound weakness when dealing with poorly bounded potential payoffs under complex uncertainty.
