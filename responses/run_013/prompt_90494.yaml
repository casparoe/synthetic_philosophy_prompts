prompt: |-
  I've been in a reading group on cultural evolution for about a year now and we keep circling the same fight without ever resolving it, so what I want is a diagnosis rather than another round of it. On one side are the meme people, who take Dawkins's basic move seriously: culture contains genuine replicators, units that get copied with variation and then differentially retained, so cultural change is a Darwinian process in the same sense biological change is, just with a different replicator riding along. On the other side are the Sperber-style epidemiology-of-representations people and the Boyd/Richerson dual-inheritance people, who say cultural transmission mostly isnt high-fidelity copying at all -- what gets passed on is reconstructed by each learner and pulled toward attractors set by human cognition, so the explanatory work is done by transformative biases and by the ecology of minds rather than by replicator dynamics. Then there's a third bunch, the philosophers of biology, who keep insisting the whole dispute is confused because nobody has agreed on what makes a process Darwinian in the first place: do you need replicators at all, or is heritable variation in a population with differential reproduction enough, in which case something like Godfrey-Smith's distinction between replicators and reproducers is supposed to dissolve the fight instead of settling it. My working hypothesis is that this is not one disagreement but three stacked on each other -- a definitional dispute about what counts as a Darwinian process, an empirical dispute about how faithful cultural transmission actually is and at what grain of description, and a dispute about explanatory aims where one side wants to explain the population distribution of variants while the other wants to explain why particular variants are stable across minds. If that's right, then a lot of the literature is people arguing about the first while believing they're arguing about the second, and no amount of fresh experimental or ethnographic data would move it.

  So diagnose it for me, with reasons, engaging what each side actually claims rather than giving me a survey of the field. Is my three-way split the right cut, or is there a better one -- for instance, is the real fault line about whether cultural items count as individuals at all, or about whether a Darwinian explanation is a claim about mechanism versus just a claim about statistical population dynamics, or is it after all a largely verbal dispute about the word Darwinian that would evaporate if everyone dropped it? Tell me which parts of the impasse are substantive and which are terminological, and then tell me what would count as progress given your diagnosis: a formal result, a decisive finding about transmission fidelity, a conceptual distinction, or nothing at all because the question is ill-posed as stated. Lead with your bottom line in the first sentence and then give the reasoning, no preamble and dont restate my question. And be self-critical about it: say where your diagnosis is most likely to be wrong, and which argument or piece of evidence would actually change your mind.
reasoning: |-
  Okay, the user is part of a reading group on cultural evolution that's stuck in a recurring debate. They've identified three main factions: the meme proponents (Dawkins-style replicators), the epidemiology/dual-inheritance group (Sperber and Boyd/Richerson focusing on reconstruction and biases), and philosophers of biology questioning the definition of "Darwinian." The user's hypothesis is that there are three interwoven disputes: definitional (what counts as Darwinian), empirical (transmission fidelity), and explanatory aims (distribution vs. stability).

  First, I need to validate their analysis. The user is clearly well-versed in the literature and has thought deeply about the impasse. Their frustration is palpable—they want a diagnosis, not more debate. The core of their query is whether their three-way split is accurate or if there's a better framework.

  Breaking it down:
  1. **Definitional Dispute**: The philosophers argue that without a clear definition of "Darwinian," the debate is muddled. Godfrey-Smith's replicator vs. reproducer distinction complicates things further. If "Darwinian" only requires heritable variation and differential fitness, then cultural evolution might qualify without strict replicators. But the meme group insists on high-fidelity copying as essential.

  2. **Empirical Dispute**: How often does high-fidelity copying actually happen? Sperber's epidemiology emphasizes reconstruction and cognitive attractors, suggesting low fidelity. Boyd and Richerson's models include both biased transmission and selective pressures. The meme side might point to examples like chain letters or internet trends as evidence of copying. But is that the norm or the exception? The grain of description matters—copying at a coarse level vs. detailed replication.

  3. **Explanatory Aims**: Meme theorists want to explain population distributions through selection on variants. The epidemiology camp focuses on why certain ideas stabilize due to cognitive biases. These are different questions, so each approach might be valid for different purposes.

  But maybe there's more. The user asks if the real fault line is about whether cultural items are individuals (ontology) or if Darwinism is about mechanisms vs. statistics. The ontology angle is interesting—do memes have enough coherence to be units of selection? Sperber might say no, because they're reconstructed each time. The mechanisms vs. statistics point is crucial. Population-level models can work without detailed mechanisms, but critics argue that without replication, it's not truly Darwinian.

  The user also wonders if the term "Darwinian" itself is the problem. If everyone dropped it, would the substantive disagreements remain? Probably yes. The empirical question about transmission fidelity is still there, regardless of labels. So the dispute isn't purely verbal.

  For progress, the user wants to know what would break the impasse. A formal result? Unlikely, as models can be adapted. Decisive transmission fidelity findings? But fidelity varies across domains—no one-size-fits-all answer. Conceptual clarity might help, like distinguishing when replicator dynamics apply versus when reconstructive processes dominate. Perhaps acknowledging that both processes coexist, and the focus should be on specifying the conditions under which each operates.

  Self-critique: My diagnosis might overemphasize the explanatory aims as the core issue. Maybe the empirical dispute is more central. If overwhelming evidence showed high-fidelity copying is rare, meme theory would collapse. Conversely, if high fidelity were the norm, Sperber's model would need adjustment. But since cultural transmission varies by context, neither extreme is likely true universally. So the flexibility of Boyd/Richerson's dual-inheritance might be the most robust approach.

  Evidence that could change my mind: If a study demonstrated that even in seemingly high-fidelity transmission (like oral traditions), reconstructive biases dominate, it would support the epidemiology view. Conversely, if cognitive studies showed minimal reconstruction in certain learning contexts, it would bolster the meme side. But given the diversity of cultural transmission, a pluralistic approach might be inevitable.
answer: |-
  **Your diagnosis is fundamentally correct but misses the core ontological dispute about cultural units, and progress requires abandoning "Darwinian" as a litmus test in favor of mechanistic specificity.**  

  ### Reasoning:  
  1. **The Three Disputes Are Real but Intertwined**:  
     - **Definitional**: The philosophers are right that "Darwinian" is inconsistently applied. Godfrey-Smith’s replicator/reproducer distinction *should* dissolve the fight by showing that differential fitness and inheritance (reproduction) can occur without high-fidelity replicators (e.g., a craft skill spreads via practice, not copying). Yet Dawkinsians insist replicators are non-negotiable for "true" Darwinism, while epidemiologists reject replicators as empirically inaccurate.  
     - **Empirical**: Sperber/Boyd-Richerson have strong evidence that transmission is reconstructive (e.g., Bartlett’s serial reproduction experiments, cross-cultural studies of folktales showing cognitive attractors). Meme advocates counter with examples like chain letters or viral trends as proof of copying, but this confuses *outcome* (spread) with *mechanism* (replication vs. reconstruction).  
     - **Explanatory Aims**: Meme theorists prioritize *variant frequency change in populations* (e.g., why Idea A outcompetes Idea B), while epidemiologists prioritize *stability of content across minds* (e.g., why urban legends converge on similar tropes). These aims aren’t mutually exclusive, but the sides talk past each other by conflating them.  

  2. **The Deeper Fault Line: Ontology of Cultural Units**  
     The irreconcilable clash is whether culture contains *discrete, gene-like "things"* (memes) that persist unchanged across transmission. Dawkinsians treat memes as *lineage-forming individuals* (e.g., a specific melody is identically copied). Sperber and Boyd/Richerson deny this, arguing cultural "variants" are ephemeral constructs shaped by cognitive biases (e.g., your recall of a story isn’t a copy but a new reconstruction biased by memory). **This isn’t just empirical—it’s ontological**: Can cultural items bear the causal weight of replication/selection? Without agreement here, disputes over fidelity or "Darwinism" are moot.  

  3. **Substantive vs. Terminological**:  
     - **Substantive**: The empirical reality of transmission mechanisms (high-fidelity copying vs. reconstruction) and the causal role of cognitive biases are testable. For example, fMRI studies showing neural reuse in learning support reconstruction; lab experiments on social learning fidelity provide mixed results (e.g., high fidelity in toolmaking, low in rumor transmission).  
     - **Terminological**: The "Darwinian" label is a red herring. Population genetics models *can* apply without replicators (e.g., Boyd/Richerson’s models work with biased transmission), but Dawkinsians reserve "Darwinian" for replicator-driven dynamics. Dropping the term would refocus debates on mechanisms.  

  4. **Path to Progress**:  
     - **Not formal results or more data alone**: Models and data exist for all sides; the issue is their interpretation. A decisive finding on *universal* transmission fidelity is unlikely—it varies by domain (e.g., religious rituals vs. slang).  
     - **Key Step**: Adopt a *mechanistic* framework. Specify:  
       (a) **Units of analysis** (e.g., behaviors, neural patterns, semantic content),  
       (b) **Transmission processes** (copying, reconstruction, guided variation),  
       (c) **Selective pressures** (cognitive bias, social selection).  
       Boyd/Richerson’s "decision rules" (e.g., conformist bias) and Sperber’s "attractors" already do this without requiring replicators.  
     - **Progress Defined**: Explaining phenomena like cumulative culture by showing *when* high-fidelity copying is necessary (e.g., toolmaking techniques) vs. when attractors suffice (e.g., moral norms), without policing "Darwinian" credentials.  

  ### Self-Critique and Falsifiability:  
  - **Weakest Point**: I may overstate ontology as the root issue. Perhaps the explanatory-aims dispute is primary: if the group agreed whether they seek to explain *dynamics* (meme-compatible) or *stability* (epidemiology-compatible), mechanisms could coexist.  
  - **What Would Change My Mind**: Evidence that *all* cultural transmission requires material instantiation of replicators (e.g., discovering a neural "template" that stores/copies concepts identically). Conversely, proof that high-fidelity copying *never* occurs (e.g., all behaviors are reconstructed from scratch) would collapse the meme position. Neither is likely—cultural processes are pluralistic.  
  - **Risk**: Ignoring that Boyd/Richerson *do* incorporate selection on inherited variation, bridging the divide. Their framework may be the exit ramp.  

  **Bottom Line**: Your split identifies symptoms; the disease is ontological disagreement over cultural units, cured by mechanistic modeling beyond "Darwinian" orthodoxy tests.**
