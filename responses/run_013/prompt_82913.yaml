  I should also consider where the film resists the analogies. The lottery paradox is about statistical probabilities, while Leonard's beliefs aren't probabilistic in the same way. His evidence isn't random; it's based on his investigations, but flawed due to manipulation and memory issues. The preface paradox fits better but falls short in the end because Leonard's belief isn't just about potential error—it's about embracing falsehood.

