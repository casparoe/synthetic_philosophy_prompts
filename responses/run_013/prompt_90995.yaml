prompt: |-
  I do outbreak investigations for a state health department, and lately the way we write up "the cause" of an outbreak has been driving me a bit nuts. Three things from this year. First: in one cluster we said the cause was a church supper, and then two sentences later, answering the question of why *that* supper produced cases rather than the two dozen other church suppers that spring, we said the cause was that the kitchen had no hand-washing sink. Same event, same facts on the ground — the only thing that changed was the alternative we were quietly comparing it to, and the "cause" jumped. Second: our writeup says the outbreak was caused by the caterer coming in while sick, but the lab folks say it was caused by the specific norovirus strain; both sentences are true and it doesn't feel like the same claim at two zoom levels, it feels like two different claims. Third: we blamed the sick caterer and not, say, the fact that this town has no paid sick leave, and I've noticed we almost always name whatever was abnormal or changeable as the cause rather than the standing background conditions, even when the background conditions are doing at least as much of the work.

  So what I actually want isn't a label so much as the carving. Is there one established concept for this whole thing — that "the cause" comes out relative to the question we're asking rather than being a fact sitting there in the world — or are these three seperate known things that I'm wrongly lumping together? If it's several, name each one, say exactly where the lines fall between them, and tell me which of my three examples lands where (and if any of them lands in two places at once, I want to know that). If there's genuinely no single concept covering all three, say so plainly and coin one — give me a definition, a case that's clearly in, and a case that's clearly out, so I can see the edge. Start with your one-line verdict ("yes, the name is X" or "no single name, here's why"), then the carving, becuase the naming is the part I care about least. Keep the whole thing under 500 words.
reasoning: |-
  Okay, the user is an outbreak investigator frustrated with how "the cause" is defined in their reports. They provided three examples where the stated cause shifts based on context: the church supper vs. no sink, the sick caterer vs. norovirus strain, and the caterer vs. systemic issues like lack of paid sick leave. 

  Hmm, their core struggle is ontological—they're noticing causation isn't absolute but relational. The first example shows counterfactual dependence (changing the comparison alters the cause), the second reveals explanatory scope conflict (proximal vs. biological mechanisms), and the third highlights attribution bias toward abnormal/controllable factors. Philosophers like Mackie and Woodward have written about these nuances, but no single term unifies them. 

  I should clarify why lumping them under one label oversimplifies: the church supper case is about contrast classes, norovirus is about explanatory levels, and sick leave is about pragmatic selection. They're distinct phenomena even if all demonstrate relativity. The user might secretly want validation that their field's reporting conventions are philosophically messy—which they are. 

  For structure: verdict first ("no single concept"), then carve each example with named frameworks (contrastive causation, explanatory granularity, pragmatics of attribution). Emphasize that all three share context-dependence but differ mechanistically. Their real need isn't terminology but tools to articulate this relativity in reports—maybe suggesting phrases like "contributing factor given X comparison" could help beyond this answer.
answer: |-
  Here’s your verdict upfront: **No single established concept covers all three examples.** Causation in epidemiology is context-dependent, but your cases represent distinct philosophical flavors of that relativity. Below is the carving, naming each concept and assigning your examples:

  1.  **Contrastive Causation (Example 1: Church Supper vs. No Sink)**
      *   **Concept:** "X caused Y" means "X rather than *some specific alternative X'* made the difference for Y rather than *some specific alternative Y'*." The cause *jumps* because the implied contrast class (the "rather than") changes.
      *   **Lines:** Focuses on *which difference made the difference* relative to a specific comparison scenario. The cause isn't an absolute property of X, but its role in comparing scenarios.
      *   **Your Example:** Clearly fits here. "Church supper" was the cause *relative to other events not happening*. "No hand sink" was the cause *relative to other church suppers having hand sinks*.

  2.  **Levels of Explanation / Explanatory Granularity (Example 2: Sick Caterer vs. Norovirus Strain)**
      *   **Concept:** Explanations can operate at different levels (e.g., social/behavioral, individual, physiological, molecular). A complete causal account needs multiple levels, but reports often focus on one level relevant to the audience/purpose.
      *   **Lines:** Distinguishes between *how* something happened (mechanism - norovirus strain) and *why* it happened in this specific instance (proximate event - sick caterer working). Both are true but answer slightly different questions within the causal chain.
      *   **Your Example:** Fits here. "Sick caterer" is the proximate, actionable event (social/behavioral level). "Norovirus strain" is the necessary biological agent (molecular level). They aren't competing claims but complementary explanations at different granularities.

  3.  **Causal Selection / Pragmatic Attribution (Example 3: Sick Caterer vs. No Paid Sick Leave)**
      *   **Concept:** We tend to label the *most abnormal* or *most directly manipulable* factor in the causal field as "the cause," downplaying stable background conditions (even if necessary).
      *   **Lines:** Focuses on *which factor we choose to emphasize* based on norms (abnormality), potential for intervention (changeability), or explanatory goals. Background conditions are causally necessary but rarely labeled "the cause."
      *   **Your Example:** Fits here. The sick caterer working was the abnormal, directly intervenable event. Lack of paid sick leave is a stable background condition enabling the event – causally potent but not singled out as "the cause" in typical outbreak reports.

  **Why no single concept?**
  *   **Contrastive Causation** is about logical structure (dependence on comparison cases).
  *   **Levels of Explanation** is about ontological scale (molecular to societal).
  *   **Causal Selection** is about psychological/pragmatic factors in human labeling (abnormality, intervention potential).

  **Your Examples Mapped:**
  *   **Example 1:** Pure **Contrastive Causation**.
  *   **Example 2:** **Levels of Explanation/Explanatory Granularity**.
  *   **Example 3:** **Causal Selection/Pragmatic Attribution**.

  **Edge Case:** None of your examples clearly fall into two categories simultaneously. They are distinct manifestations of the core idea that *causation is relative to the question asked*, but the *nature* of that relativity differs in each case (contrast class, explanatory level, pragmatic emphasis).
