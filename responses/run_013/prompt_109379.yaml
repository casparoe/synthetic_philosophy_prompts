  For "native speaker," I see two plausible interpretations of her rules:
  - If her core principle is about mind-independent existence (like quarks vs. money), native speaker status might seem constructed because it's defined by social criteria like birthplace or education.
  - But if she emphasizes whether the underlying trait persists without labels (like left-handedness), then the actual language acquisition capacity could be seen as real, with only the "native" label being constructed.

  The left-handedness parallel feels strongest here. Just as handedness exists biologically regardless of stigma, the neurocognitive capacity for first language acquisition exists independently - even if the social category "native speaker" gets weaponized. That suggests she'd rule "not constructed" for the trait itself.

  To really test this, I'd propose a new case: something like "genius" or "musical prodigy" where innate ability and social labeling are deeply entangled. Does the exceptional cognitive trait exist without the label, or is it wholly defined by cultural standards? That could force apart the two interpretations of her framework.

