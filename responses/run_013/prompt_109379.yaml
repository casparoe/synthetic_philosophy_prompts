answer: |-
  Based on your partner's pattern of reasoning, here's a breakdown of her likely verdict on "native speaker," the competing rules that fit her previous cases, predictions, and a test case to break the tie:

  **Her Likely Verdict: NOT Socially Constructed (as a biological/cognitive trait)**  
  *Why?* The core capacity for first-language acquisition is a universal, biologically constrained human trait emerging from innate neurocognitive structures (like Broca's area), regardless of social labeling. While the *term* "native speaker" and its social gatekeeping functions are constructed, the underlying linguistic competence itself exists independently – much like left-handedness persists neurologically despite historical stigma. The "born with a language in their head" argument misses the point: infants are born with the *predisposition* to acquire any human language rapidly from input, which *is* a natural kind.

  **Competing Rules & Predictions for "Native Speaker":**

  1.  **Rule A: Mind-Independence Criterion**  
      *Definition:* Something is socially constructed *only if* its existence and core properties *fundamentally depend* on collective human agreement, recognition, or institutional practices. If it exists and operates independently of human concepts/institutions, it's not constructed (even if labeled/stigmatized).  
      *Fits Previous Cases:*  
      - Constructed: Money (needs agreement), Race (sorting & meaning depend on social systems), Gender (socially defined roles/identity), Teenager (institutional category), Citizenship (conferred), "The 1%" (defined by human-drawn lines).  
      - Not Constructed: Quarks (exist regardless), Peanut Allergy (biological mechanism), Predator (ecological interaction), Left-handedness (neurological trait).  
      *Prediction for "Native Speaker": NOT Constructed.*  
      *Why?* The neurobiological capacity for effortless, native-like acquisition and processing of a first language during a critical period exists independently of the *label* "native speaker" or its social uses. The underlying competence is a real cognitive trait.

  2.  **Rule B: Biological Mechanism Criterion**  
      *Definition:* Something is socially constructed if its defining characteristics or causal powers *lack* a clear, specific, and distinct biological mechanism *that directly corresponds to the socially recognized category*. If a robust biological mechanism *does* underpin the core phenomenon, it's not constructed (though its social expression might be).  
      *Fits Previous Cases:*  
      - Constructed: Money (no specific biology), Race (no distinct biological clusters corresponding to social races), Gender (social roles not reducible to biology), Teenager (no specific biological marker for the socio-cultural concept), Citizenship (no biology), "The 1%" (no biology).  
      - Not Constructed: Quarks (fundamental physics), Peanut Allergy (immune mechanism), Predator (biological interactions), Left-handedness (neurological asymmetry). Gender's "bodies matter" being a "red herring" fits – bodies exist, but the *social category* of gender isn't defined *by* a single biological mechanism.  
      *Prediction for "Native Speaker": NOT Constructed.*  
      *Why?* There is a well-documented, specific neurobiological substrate (critical period plasticity, specific language areas) and a distinct cognitive mechanism (implicit, procedural knowledge for L1) that underpins native-like language competence. This mechanism exists whether labeled or not.

  3.  **Rule C: Causal Feedback Loop Criterion**  
      *Definition:* Something is socially constructed if the application of the category *significantly alters the phenomenon itself* through social practices, expectations, or institutions in a feedback loop. If the phenomenon exists stably *without* such feedback, it's not constructed.  
      *Fits Previous Cases:*  
      - Constructed: Race (sorting and stigma reshape lives/opportunities/biology), Gender (social norms shape behavior, identity, even perception), Teenager (category created new behaviors/norms).  
      - Not Constructed: Quarks (unaffected by our labels), Peanut Allergy (immune response is indifferent), Predator (ecological interaction persists), Left-handedness (stigma didn't change the neurology, only behavior), Money? (Here it's tricky; institutions *maintain* it, but the slip of paper's *value* depends entirely on feedback).  
      *Prediction for "Native Speaker:* AMBIGUOUS/Likely **Constructed**."  
      *Why?* The *application* of the "native speaker" label demonstrably alters the phenomenon: it grants authority, affects self-perception, influences language attitudes/maintenance, determines research participation/jobs, and can lead to linguistic insecurity or hypercorrection in those deemed "non-native." This feedback loop *shapes* how language competence is perceived, valued, and performed, arguably altering the social reality of the category. However, the *core competence* remains stable. This rule struggles most with her left-handedness verdict.

  **The Rule I'd Bet On: Rule A (Mind-Independence) with Rule B (Biological Mechanism) as strong support.**

  *   **Why Rule A Wins:** It cleanly explains **left-handedness**, her crucial outlier. The neurological basis *exists independently*; only the stigma is constructed. Similarly, the neurological/cognitive capacity for native language acquisition exists independently. Rule C struggles significantly with left-handedness.
  *   **Rule B Reinforces It:** The existence of a specific, distinct biological mechanism (critical period, L1 neurocognition) for native competence aligns perfectly with her "not constructed" verdicts for allergy, predator, and left-handedness. The social *label* "native speaker" might lack a specific biological marker, but the *competence it (imperfectly) points to* absolutely has one.
  *   **Her Reasoning Style:** She consistently distinguishes the *underlying phenomenon* from the *social label/practice* when a mind-independent reality exists (quarks, allergy, predator, left-handedness). "Native speaker" competence fits this pattern. She dismisses "bodies matter" for gender not because bodies aren't real, but because the *social kind* "gender" isn't *defined by* the biological reality in a straightforward way. For native speakers, she'd likely argue the *linguistic kind* is defined *by* that underlying competence.

  **What to Put to Her Next: "Genius" (High Intellectual Ability)**

  *   **Why it separates the rules:**
      *   **Rule A (Mind-Independence):** Predicts **Constructed**. "Genius" relies entirely on human-defined thresholds (IQ tests, extraordinary achievement), cultural valuation of specific domains (math vs. basket weaving), and institutional recognition (Nobel Prizes, fellowships). There's no mind-independent property "genius" out there in nature; it's a conferred status based on agreed-upon metrics.
      *   **Rule B (Biological Mechanism):** Predicts **Ambiguous/Leans Not Constructed?** There *are* biological correlates of high intelligence (brain structure, connectivity, neural efficiency). If she views "genius" as simply the extreme end of a natural cognitive trait continuum with a biological basis, she *might* lean "not constructed," arguing the *label* is constructed but the underlying high ability is real. However, the lack of a *distinct* mechanism *for genius itself* (vs. high intelligence) and the heavy cultural definition might push her back to constructed.
      *   **Rule C (Feedback Loop):** Predicts **Constructed.** The label "genius" dramatically alters the phenomenon: it opens doors (resources, education), creates expectations (the "genius" stereotype), fosters specific environments (gifted programs), and can shape intellectual development profoundly – a clear feedback loop.
  *   **The Test:** If she says **Constructed** (as Rules A & C strongly suggest), it supports Rule A as primary (mind-dependence is key). If she says **Not Constructed**, arguing the underlying exceptional cognitive ability is the natural kind regardless of the label (aligning with Rule B's focus on biological basis), then Rule B gains ground. Her reasoning will reveal whether mind-independence or a distinct biological mechanism is the ultimate arbiter for her.

  **Final Tip:** Frame the "genius" question by emphasizing the *conferral* aspect (like citizenship/"the 1%") vs. the potential underlying *trait* (like high IQ as analogous to left-handedness). Ask: "Is 'genius' a status we create and bestow based on our standards, or is it a natural category of mind we discover and label?"

  Good luck! May your linguistic insights (and newfound understanding of her rules) save you from dish duty.
