prompt: |-
  My partner's a philosopher (metaphysics of science, mostly) and we keep having the same fight over breakfast: is this or that kind socially constructed. She's got a running scoreboard and I genuinely cannot reverse-engineer the rule she's running. Her verdicts so far, with the gist of her reasons: money, constructed, because nothing about a slip of paper makes it money and we make it money by treating it as money and backing it with institutions; race, constructed, and she's adamant that the biology doesn't sort people into races, and that the sorting then feeds back and reshapes the people sorted; gender, constructed, and when I ask whether the bodies matter she says that's a red herring, which I've never known how to take; quarks, not constructed, we found them; peanut allergy, not constructed, allergy diagnosis is culturally variable and fashion-driven but the immune response doesn't care what we call it; teenager, constructed, it arrived with compulsory schooling and the youth labour market and kids' behaviour shifted once the category existed; predator, in ecology, not constructed, real trophic relation, nobody has to agree about anything; citizenship, constructed, obviously conferred; "the 1%", constructed, the line is drawn for policy purposes and nothing in nature happens at the 80th percentile; and left-handedness, not constructed. That last one is what throws me, because lefties got pathologized and forcibly retrained for about a century, which I'd have thought would make it constructed on her view; she says the trait is there whether or not we name it, and only the stigma was made.

  Now the new one. I'm finishing an MA in linguistics and my field bandies "native speaker" around like it's a natural kind, it's in our recruitment ads, our methodology sections, our intuitions about which sentences sound bad. I say it's obviously constructed: nobody's born with a language in their head, the category does gatekeeping work in hiring and in my department's self-image, and half the time "native" just means "went to school in the right country." She refuses to tell me her view until I can say what she'd say, which is fair but maddening. So: what's your best guess at her verdict on whether "native speaker" is a social kind? Which of her earlier verdicts are doing the real work? Give me the rules that fit her list equally well, what each one predicts about the new case and why, then the rule you'd actually bet on and what's pulling you that way. And last thing, tell me what I should put to her next, i.e. which further case would actually seperate those rules instead of just making us both dig in. Loser does the dishes for a week, so I'd like to get this right.
