answer: |-
  Here's a complete exam package tailored to your specifications:

  **Exam Question:**
  (a) For each case (Priya, Dan, Sam), state whether the person caused the flood and explicitly state the criterion you are using.  
  (b) The criteria of counterfactual dependence and violation of a norm/expectation/duty are often used to explain causation by omission. Show that they yield divergent verdicts in these cases. Identify exactly which pair of cases demonstrates this divergence and explain why.  
  (c) In Case 3, Sam’s omission is indirect: he failed to maintain a system that would have prevented the flood. Does this structural difference affect whether he caused the flood? What does this reveal about whether omission-causation is identical to ordinary event-causation?  
  (d) Identify one scenario where your criterion delivers a verdict you reject. Either revise your criterion to handle it or defend why you accept the verdict.  

  ---

  **Model Answer (600 words):**  

  **(a) Verdicts & Criterion:**  
  - **Priya (Case 1): Caused the flood.** Criterion: *Violation of a role-specific duty*. As process engineer, her procedural obligation made her omission causally relevant.  
  - **Dan (Case 2): Did not cause the flood.** Criterion: *Absence of normative expectation*. No duty, role, or knowledge imposed responsibility to act.  
  - **Sam (Case 3): Caused the flood.** Criterion: *Managerial duty to maintain safety systems*. His omission enabled the failure chain.  

  **(b) Divergence of Criteria:**  
  Counterfactual dependence holds for all three:  
  - But for Priya’s omission, no flood (¬P → ¬F).  
  - But for Dan’s omission, no flood (¬D → ¬F).  
  - But for Sam’s omission, no flood (¬S → ¬F).  
  A *normative criterion* (violation of duty/expectation) yields: Priya ✅, Sam ✅, Dan ❌.  
  **Divergence pair: Cases 1 & 2.** Both share identical counterfactual structures (¬X → ¬F), but only Priya violates a norm. This exposes counterfactual dependence as *necessary but insufficient*: it captures Dan, who is intuitively non-causal. Case 3 does *not* separate the criteria (both say "yes").  

  **(c) Indirect Omissions & Ontology:**  
  Sam’s omission is "at one remove": he failed to maintain a *preventer* (the sensor). This structural difference does *not* negate causation. The flood counterfactually depends on Sam’s omission, and the causal chain (dead sensor → open valve → flood) is unbroken. Rejecting Sam’s responsibility requires arbitrary limits on causal chains.  
  This reveals a tension in omission-causation:  
  - If causation requires *positive events*, Sam (and all omissions) are disqualified (e.g., Davidson).  
  - If absences can be causes (e.g., Lewis), Sam’s case is unproblematic.  
  A hybrid view: causation by omission is *sui generis*, where norms distinguish "allowing" (Sam) from "doing" (e.g., smashing the sensor). I accept absences as causes, so Sam’s indirectness is irrelevant.  

  **(d) Counterexample & Response:**  
  **Counterexample to my norm-based criterion:** Suppose jurisdiction enacts a "duty-to-rescue" law. Now Dan *violates a legal norm* by not closing V. My criterion implies Dan *causes* the flood, but intuitively, he remains a non-responsible bystander.  
  **Patch:** Restrict norms to *internal role obligations* (Priya, Sam), not external impositions (Dan). This excludes "artificial" duties while retaining core cases.  
  *Cost:* This assumes a contentious distinction between "genuine" and "artificial" duties. I accept this to preserve intuitive verdicts.  

  ---

  **Marking Scheme (20 points total):**  

  | **Points** | **Requirement**                                                                 | **Common Mistakes (Costs Points If Missed)**                                  |
  |------------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------|
  | **4**      | **(a) Correct verdicts + explicit criterion per case.**                         | Silently assuming criteria; inconsistent standards (e.g., counterfactuals for Priya but norms for Sam). |
  | **4**      | **(b) Identifies Cases 1 & 2 as diverging pair; explains why counterfactuals (all yes) ≠ norms (Priya yes, Dan no).** | Claims Case 3 diverges; vaguely says "criteria differ" without pairing cases. |
  | **4**      | **(c) Argues Sam’s indirectness doesn’t break causation; takes a stance on omission ontology (e.g., accepts absences as causes).** | Calls Sam "too indirect" without defining indirectness; asserts Sam isn’t a cause without justification. |
  | **4**      | **(d) Offers plausible counterexample to own criterion (e.g., Dan with duty-to-rescue law); patches/bites bullet credibly.** | "Counterexample" is irrelevant (e.g., overdetermination); patch alters criterion surreptitiously. |
  | **4**      | **Overall: Precision, clarity, philosophical insight.**                         | Ambiguous phrasing; conflating causation with moral responsibility; ignoring structural differences. |

  ---

  **Why this works:**  
  - **Cases 1 & 2** are the linchpin: identical counterfactuals, opposed intuitive verdicts, separable only by norms.  
  - **Case 3** pressures students to confront causal metaphysics (double prevention) without muddying the criteria divergence.  
  - **Part (d)** forces metacognition—top answers reveal awareness of their theory’s limits.  
  - **Marking scheme** targets precise moves (e.g., naming "Cases 1 & 2" explicitly) and penalizes hand-waving.  

  This setup ensures students must engage *why* omissions are contentious, not just apply a formula.
