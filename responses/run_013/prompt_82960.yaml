answer: |-
  ## Thesis Prospectus: Simulated Horizons – Deflating or Amplifying Far-Future Fanaticism via the Simulation Argument

  **1. Core Research Question:** Does incorporating the Simulation Argument (SA) into far-future ethical frameworks systematically reduce the *expected value* of actions aimed at securing a vast, positive long-term future, and if so, is this reduction sufficient to mitigate the "fanaticism" problem inherent in such frameworks? Specifically, under what conditions does the SA act as a *deflator*, an *amplifier*, or a *neutral factor* regarding the expected value calculation justifying present sacrifices for small probabilities of securing astronomically valuable futures?

  **2. Background & Problem Statement:**
  *   **Far-Future Ethics (FFE):** This view holds that the primary moral imperative is ensuring the realization of an extensive, flourishing civilization over cosmic timescales. Due to the potential astronomical scale of this future value, even minuscule probabilities of influencing it positively (e.g., reducing existential risk) can seemingly justify enormous present sacrifices ("fanaticism").
  *   **The Fanaticism Worry:** This leads to counterintuitive and potentially paralyzing conclusions where almost any resource allocation towards distant future impacts dominates present concerns (poverty, near-term suffering, other ethical priorities), as the expected value calculation appears overwhelmingly dominated by the long-term potential.
  *   **The Simulation Argument (SA):** The argument suggests a non-negligible probability (`p_sim`) that our observed reality is a computer simulation created by a vastly more advanced civilization. Typically, the SA is used to question the nature of reality or explore decision-theoretic puzzles (e.g., the Simulation Hypothesis, ancestor simulations, Boltzmann brains).
  *   **The Gap:** Existing philosophical work treats these areas largely in isolation. FFE discussions of fanaticism rarely engage with the SA's implications for causal reach and value persistence. Conversely, SA discussions focus on metaphysics, epistemology, or localized decision puzzles, neglecting its potential impact on the foundational expected value calculations underpinning FFE's most challenging consequence – fanaticism. This project bridges this gap by rigorously analyzing *how the SA structurally alters the expected value calculus central to FFE fanaticism*.

  **3. Central Hypothesis & Argument Sketch:** The SA fundamentally complicates the expected value calculation in FFE by introducing uncertainty about the ontological status and persistence of the future we aim to influence. The *prima facie* deflationary intuition (if we're simulated, our actions might not affect the "real" future) competes with potentially inflationary dynamics (if simulations are numerous and our actions influence their purpose/duration, or if the *existence* of simulations depends on the far-future outcome). The net effect on expected value is indeterminate without rigorous modeling and is highly sensitive to specific assumptions about simulation metaphysics and our causal efficacy within them. A taxonomy mapping these assumptions to outcomes (deflation, inflation, neutrality) is necessary and achievable.

  **4. Methodology & Rigor:**
  *   **Formalism:** Decision Theory & Expected Value Calculus will be the core formal tools.
      *   Represent the "standard" FFE expected value (EV_FFE) of an action `A` as: `EV_FFE(A) ≈ P(success | A) * V_far_future`, where `V_far_future` is astronomically large.
      *   Incorporate the SA by introducing key variables:
          *   `p_sim`: Probability we are in a simulation.
          *   `I_real(A)`: Our causal influence via `A` on the *real* long-term future (if we are base reality).
          *   `I_sim(A)`: Our causal influence via `A` on the *simulated* long-term future (if we are simulated). Crucially, this includes influence on the simulation's *duration* and *content*.
          *   `V_sim`: The value attributed to positively influencing a *simulated* long-term future (which could range from 0 to equal to `V_far_future`, depending on assumptions).
          *   `D`: Dependency variable - How `p_sim` and/or `I_sim(A)`/`I_real(A)` themselves depend on the far-future outcome we are trying to influence (e.g., does a flourishing real future lead to more simulations?).
  *   **Expected Value under SA:** `EV_SA(A) = (1 - p_sim) * [P(success_real | A, base) * V_far_future * I_real(A)] + p_sim * [P(success_sim | A, sim) * V_sim * I_sim(A)]`
  *   **Avoiding Stipulation & Question-Begging:**
      *   **Sensitivity Analysis:** Systematically vary key parameters (`p_sim`, `V_sim`, `I_real`, `I_sim`) across plausible ranges (e.g., `p_sim` from negligible to significant; `V_sim` from 0 to `V_far_future`; `I_real`/`I_sim` from 0 to 1). Map how these variations affect `EV_SA(A)` relative to `EV_FFE(A)`.
      *   **Exploring Dependency (`D`):** Explicitly model different dependency scenarios:
          1.  *Independence:* `p_sim`, `I_real`, `I_sim` are independent of the far-future outcome.
          2.  *Simulation Proliferation Dependency:* The probability or number of simulations run *depends* on the real far-future outcome (e.g., only a flourishing civilization runs many ancestor sims).
          3.  *Input Significance Dependency:* The value `V_sim` or influence `I_sim` depends on how our simulated actions serve as input/data for the simulators' goals related to the *real* future.
      *   **Neutral Benchmarks:** Define scenarios where `EV_SA(A) = EV_FFE(A)` (e.g., if `V_sim = V_far_future` and `I_sim(A) = I_real(A)` and `p_sim` is constant) to serve as comparison points.
      *   **Focus on Structure:** The analysis focuses on the *structural relationship* between the SA and the EV calculation, not on defending specific numerical values for `p_sim` or `V_far_future`. The goal is to show *how* different assumptions *would* affect the calculation, conditional on accepting FFE's core premise about `V_far_future`.
  *   **Rigor:** The analysis will be logically precise, clearly defining all variables, assumptions, and dependency structures. Key moves will be justified through argument (e.g., why `V_sim` might be less than `V_far_future`; plausible mechanisms for dependency `D`). Counterarguments and edge cases will be addressed.

  **5. Anticipated Results & Contribution:**
  *   **A Formal Taxonomy:** The primary output will be a clear taxonomy categorizing scenarios based on assumptions (`p_sim`, `V_sim`, `I_real`, `I_sim`, dependency `D`) and their impact on `EV_SA(A)` relative to `EV_FFE(A)`:
      *   **Deflationary Regimes:** Conditions under which `EV_SA(A)` is significantly less than `EV_FFE(A)` (e.g., high `p_sim`, low `V_sim`, low `I_sim`, certain dependency structures). This would mitigate fanaticism.
      *   **Amplification Regimes:** Conditions under which `EV_SA(A)` is greater than `EV_FFE(A)` (e.g., high `p_sim`, high `V_sim` tied to simulator goals, high `I_sim` as critical input, dependency structures linking sim success to real proliferation). This could exacerbate fanaticism.
      *   **Neutral Regimes:** Conditions under which the SA has negligible effect on the expected value calculation justifying fanaticism.
  *   **Identification of Critical Levers:** Pinpoint which assumptions (e.g., the value of simulated futures `V_sim`, the nature of dependency `D`) most significantly determine the SA's impact on fanaticism.
  *   **Contribution:** This project provides the first systematic analysis of how the SA interacts with the core expected value calculus driving the fanaticism problem in FFE. It moves beyond intuition to offer a structured framework for evaluating whether and when the SA is relevant to this major challenge in long-term ethics.

  **6. Success Criteria & Potential Failure Modes:**
  *   **Success:** Developing a logically coherent, well-structured taxonomy that clearly maps plausible assumptions about the SA to their consequences for FFE expected value and the fanaticism worry. Demonstrating that the SA *can* significantly alter the expected value under plausible conditions, and specifying what those conditions are.
  *   **Failure:** The project would fail if:
      *   The dependency problem (`D`) proves intractable, leading to pervasive indeterminacy where almost all plausible assumptions result in ambiguous outcomes.
      *   All plausible interpretations of `V_sim` and `I_sim` lead to `EV_SA(A)` being negligible *or* astronomically large compared to other values, making the taxonomy trivial (always deflationary or always inflationary regardless of nuance).
      *   The analysis reveals that incorporating the SA inevitably relies on assumptions about the simulators' values or intentions that are completely unknowable, rendering the exercise purely speculative without meaningful philosophical traction on the fanaticism problem.

  **7. Scope Management for a One-Year Masters Thesis:**
  *   **Achievable Core:** Focus on developing the formal EV framework and conducting a comprehensive sensitivity analysis across the core variables `p_sim`, `V_sim`, `I_real`, `I_sim` **under the Independence Assumption** (`D` = Independent). This yields a substantial taxonomy based on the most straightforward interpretation of the SA's impact.
  *   **Explicitly Flagged for Future Work:**
      *   Deep exploration of complex dependency structures (`D`), particularly the "nastier version" where the probability of being simulated *depends* on the far-future outcome. This involves significantly more complex modeling (potentially recursive or equilibrium-based calculations).
      *   Detailed engagement with specific metaphysical interpretations of simulation consciousness and value (beyond setting `V_sim` parametrically).
      *   Comprehensive comparison to *all* existing objections to fanaticism (e.g., variance, comparativism, non-archimedean ethics). The focus remains on the SA's unique contribution.
  *   **Deliverable:** A thesis providing 1) A rigorous formal framework integrating SA and FFE EV calculations, 2) A detailed sensitivity analysis and resulting taxonomy under independence, 3) A preliminary exploration of the *nature* of the dependency problem (`D`) and its potential significance, arguing why it demands further (beyond-thesis) investigation, and 4) A clear conclusion on whether, under the analyzed independent scenarios, the SA generally acts as a deflator, amplifier, or neutral factor, and the conditions driving this result.

  This proposal offers a novel, focused, and rigorous investigation into a previously unexplored intersection of two significant philosophical arguments, with the potential to meaningfully inform debates about the demandingness and viability of far-future ethics.
