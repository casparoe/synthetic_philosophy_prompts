  In "What it rules out," I'll explain how this hybrid model can't accommodate pure naturalism (which would reject socially constructed diseases like historical homosexuality diagnoses) or pure normativism (which couldn't distinguish disease from other disvalued states like poverty).

  For contradictions, I'll focus on their risk-factor example: sometimes they treat risk factors as diseases (e.g., pre-hypertension drugs), sometimes not (e.g., not covering "longevity" drugs for aging). The grief diagnosis flip-flop shows similar inconsistency.

  The underdetermined section will note that many coverage decisions (like hearing aids vs. glasses) could be justified under multiple theories, revealing the system's ambiguity.

  When discussing theory swaps, I'll contrast outcomes: strict naturalism might stop covering subjective states like pain, while strict normativism could medicalize all disvalued conditions like wrinkles or sadness.

