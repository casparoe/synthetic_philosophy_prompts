answer: |-
  Here's a battle-tested editing procedure designed for your Thursday 4 PM deadline panic, focused on rooting out the sneaky Cartesian Theater (CT) in your prose. It breaks down into three axes (Place, Time, Witness) and prioritizes fixes based on the severity of the homunculus smuggling.

  **The Cartesian Theater Smuggling Test (CTST)**

  Run these tests on *every sentence* describing brain function or conscious experience.

  1.  **The Single Place Test (SPT):**
      *   **Question:** Does this imply all the important processing happens in *one specific location* at the crucial moment, acting as a central "stage" or "screen"?
      *   **Failure:** Words like "where", "the place", "to the center", "shows it to", "displays", "presents", "screen", "stage", "theater", "headquarters", "control room". Implicitly assigning a single locus of integration or display.
      *   **Severity:** **High.** This directly installs a physical stage for the homunculus.
      *   **Rewrite:** Emphasize distributed processing, networks, parallel pathways, collaboration. Use verbs like "distribute", "integrate across", "involves networks", "emerges from interactions between".
      *   **Acceptable:** When *literally* describing signal routing between known, specific anatomical areas (e.g., thalamus to cortex), *if* you avoid implying that the receiving area is "the viewer" or "final stage". Also acceptable for very coarse localization ("in the frontal lobes").

  2.  **The Single Time Test (STiT):**
      *   **Question:** Does this imply there is *one precise moment* when unconscious processing definitively becomes conscious experience, or when a decision is "finalized" for the self?
      *   **Failure:** Words/phrases like "the moment", "when it becomes conscious", "finally sees", "decides at T", "before *you* know", "enters awareness", "crosses the threshold", "becomes available to". Implicitly setting a timestamp for consciousness.
      *   **Severity:** **High.** This implies a temporal curtain rise for the homunculus audience. The biggest trap for timing studies.
      *   **Rewrite:** Emphasize ongoing processes, gradual emergence, competition, drafts. Use phrases like "processes begin around", "signals build toward", "activity correlates with later report", "a shift in neural activity precedes", "the *feeling* of deciding happens later".
      *   **Acceptable:** Reporting the temporal *correlation* between a neural event and a *reportable event* (e.g., "Neural activity predicting the button press occurs 500ms before the subject reports making the decision"). Avoid implying the neural event *is* the decision witnessed by the self.

  3.  **The Single Witness Test (SWT):**
      *   **Question:** Does this imply there is *one internal entity* ("you," the self, the mind's eye) passively *observing* the finished product presented by the brain?
      *   **Failure:** Words like "watches", "sees", "observes", "experiences", "presents to *you*", "shows *you*", "your awareness", "the self perceives". Using "you" synonymously with a passive recipient inside the head.
      *   **Severity:** **Critical.** This *is* the homunculus.
      *   **Rewrite:** Make the brain/process the active agent. Describe the *process* as the experience. Use phrases like "the brain generates the experience of", "processing results in the perception of", "awareness *is* the state of", "neural activity constitutes seeing". Carefully distinguish between "you" (the whole organism) and any implied inner observer.
      *   **Acceptable:** Using "you" to mean the whole person acting in the world ("You see the red light and press the brake"). Using "experience" or "awareness" as the *outcome* of processing, not the observer *of* it ("Conscious awareness of the stimulus emerged").

  **Procedure Summary:**
  1.  Run **SPT**. If FAIL: High Severity - REWRITE immediately.
  2.  Run **STiT**. If FAIL: High Severity - REWRITE immediately.
  3.  Run **SWT**. If FAIL: Critical Severity - REWRITE urgently.
  4.  If PASS all: Sentence is *likely* CT-free. Proceed with caution if vivid metaphors remain.

  **Dealing with Quotes:**
  *   **Your Prose Summarizing/Introducing Quotes:** Apply CTST ruthlessly. Your framing must be clean.
  *   **The Quote Itself:**
      *   **SPT/STiT Failure:** Often tolerable if it's core to the scientist's specific finding/model (e.g., "signals converge on the PFC"). *Don't* silently rewrite the quote. You can add context *after*: "...though this convergence doesn't imply a single 'viewing screen,' but rather a hub for integrating distributed signals."
      *   **SWT Failure (Homunculus Language):** More problematic. If it's crucial to the quote's meaning, leave it but **flag it explicitly**: "As Dr. Smith describes it, using a common metaphor, 'the thalamus presents the visual scene to the conscious mind...' – a way of speaking that philosophers argue can mislead by implying an inner observer."
      *   **Minor CT in Quote:** If it's just vivid language not central to the science (e.g., "the brain figures it out"), you can usually let it slide without comment, trusting your clean framing.

  **What CTST Can't Do (Your Safety Net):**
  1.  **Solve Consciousness:** Passing CTST means you avoided the *Cartesian Theater error*. It does *not* mean you've explained consciousness, proven materialism, or invalidated the hard problem. You've just dodged one specific bad explanation.
  2.  **Prove Multiple Drafts:** CTST helps you *describe* processes in a way compatible with distributed, asynchronous models like Multiple Drafts. It doesn't *prove* MD is correct; it just prevents you from *assuming* the CT alternative.
  3.  **Judge All Metaphors:** CTST targets *Cartesian* metaphors. Other vivid metaphors ("brain waves," "firing neurons," "like a computer") might be imperfect but aren't inherently CT if they don't imply Place/Time/Witness. CTST says *nothing* about their accuracy or helpfulness.
  4.  **Eliminate "You":** You *need* to talk to the reader as "you". CTST only flags when "you" seems to refer to an inner homunculus *receiving* the brain's output, rather than the whole organism *being* the brain/body system having the experience.
  5.  **Decide Edge Cases (Your Call):** Sometimes a metaphor is vivid, technically slightly CT-ish, but the clean alternative is horribly clunky. CTST might flag it as a minor SPT or STiT failure. If it's not a critical SWT failure and the scientific point is clear, you *might* keep it, acknowledging the trade-off to yourself. Don't make a habit of it.

  **Testing Your Sentences:**

  1.  **"Your brain makes the decision about half a second before you do."**
      *   **SPT:** PASS (No specific place implied).
      *   **STiT:** **FAIL (High Severity).** Implies a single time "the decision" is made by the brain, and a later single time "you" do it. Creates two times and makes "you" the witness.
      *   **SWT:** **FAIL (Critical Severity).** "Before *you* do" strongly implies "you" (as inner witness/decider) are separate from the brain making the decision.
      *   **Rewrite:** "Measurable brain activity predictive of the eventual button press occurs about half a second before the person reports feeling the decision to press it." (Focuses on neural correlates and report timing).

  2.  **"Attention is a spotlight that selects what enters conscious awareness."**
      *   **SPT:** **FAIL (High Severity).** The spotlight metaphor inherently implies a "stage" where things are lit (entering) or dark (not entering).
      *   **STiT:** **FAIL (High Severity).** "Enters" implies a threshold moment when something crosses into awareness.
      *   **SWT:** **FAIL (Critical Severity).** "Enters conscious awareness" implies awareness is a place things enter *for* a witness.
      *   **Rewrite:** "Attention acts like a filter, enhancing the processing of specific information, making it more likely to dominate ongoing brain activity and contribute to reportable conscious experience." (Focuses on process and outcome, removes stage/threshold/witness).

  3.  **"The visual system hands the image off to the part of the brain that actually sees it."**
      *   **SPT:** **FAIL (High Severity).** Implies a handoff *to* a specific final place ("the part") responsible for seeing.
      *   **STiT:** PASS(ish) - "Hands off" implies a sequence, not necessarily a single *consciousness* moment.
      *   **SWT:** **FAIL (Critical Severity).** "The part... that actually sees it" directly installs a homunculus-part (who is doing the seeing?).
      *   **Rewrite:** "After initial processing, visual information is routed to higher cortical areas where more complex features are extracted, ultimately contributing to the integrated perception we report as 'seeing'." (Focuses on routing, further processing, and reportable outcome).

  4.  **"The retina sends signals to the visual cortex, which starts pulling out edges and motion." (Your "probably fine" example)**
      *   **SPT:** PASS (Describes literal routing between structures without implying V1 is a "final screen" or that the cortex "sees it" *for* someone. "Starts pulling out" implies process, not finality).
      *   **STiT:** PASS (No implication of *when* consciousness happens).
      *   **SWT:** PASS (No implied inner witness. The cortex is processing, not "seeing" *for* someone).
      *   **Verdict:** **CTST PASS.** This is acceptable descriptive neuroanatomy/physiology. The cortex *is* where feature extraction begins. No homunculus smuggled.

  **Killing a Darling (Example):**
  *   **Original:** "Deep in the hippocampus, a memory is finally reconstructed and presented to your conscious mind."
  *   **SPT: FAIL** ("Deep in", "presented to" imply a specific place/stage).
  *   **STiT: FAIL** ("finally reconstructed" implies a completion moment).
  *   **SWT: FAIL** ("presented to *your conscious mind*" is pure homunculus).
  *   **CTST Verdict:** Critical failure on all axes. Must kill or radically rewrite.
  *   **Rewrite:** "The hippocampus plays a key role in coordinating activity across the cortex to reconstruct patterns of neural firing associated with a past event, enabling the experience of recollection."

  **Final Wrinkle: Guarding Against Overclaim**
  The CTST is a **hygiene tool**, not a philosophical proof. When you finish a clean draft:
  1.  **Acknowledge the Unexplained:** Explicitly state that avoiding the CT explains *how consciousness probably isn't*, not *what it fundamentally is*. "We've described processes without a central show, but the mystery of subjective experience itself remains."
  2.  **Flag Metaphors:** Remind readers (and yourself) when you *are* using vivid metaphors ("Think of attention *like* a filter...") and that they are simplifications.
  3.  **Focus on Function:** Stick close to what the science *shows* (correlations, mechanisms, models) rather than what it *ultimately means* for the hard problem. Your job is to describe the multiple drafts process clearly, not to claim it's the final answer.
  4.  **End with Openness:** Conclude with the ongoing questions: "While the idea of a single theater in the brain has faded, how exactly these distributed, competing processes give rise to the unified stream of consciousness we experience is still one of science's greatest challenges."

  This procedure gives you concrete, actionable steps to catch the most egregious homunculus smuggling on a tight deadline, while acknowledging the limits and letting you keep your prose vivid where it counts. Run the tests, fix the critical failures (especially SWT!), and sleep easier knowing your Thursday draft isn't hosting an illegal tiny person.
