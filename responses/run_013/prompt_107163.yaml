answer: |-
  ## Villanelle: On Gibbard and Satterthwaite

  **No vote can lie to gain advantage here,**  
  The noble promise held in every hand:  
  Report your true desire, dismiss all fear.  

  The ballots cast, the gathered choices clear,  
  Three options stand upon the common land —  
  **No vote can lie to gain advantage here.**  

  But see young Alex, facing defeat severe  
  For their true choice (an apple, rich and grand),  
  Report your true desire, dismiss all fear.  

  The tally shows the cherry wins, that peer  
  Preferred by others holds the high command.  
  **No vote can lie to gain advantage here?**  

  Alex thinks hard: *If falsely, I appear*  
  *To rank the lowly banana close at hand...*  
  (Report your true desire, dismiss all fear?)  

  A false report submits, the path made sheer —  
  The apple wins! The lie achieves as planned.  
  **No vote can lie to gain advantage here?**  
  With two alone, no trap would interfere,  
  But **one will must rule the truth of every choice.**  
  Report your true desire, dismiss all fear?  
  With three real choices, honest voting breaks,  
  Or power in one voice alone rejoices —  
  **No vote can lie to gain advantage here,**  
  **But one will must rule the truth of every choice.**

  ---

  **Formal Note:**

  *   **Settled Theorem:** The poem accurately reflects the Gibbard-Satterthwaite theorem: any non-dictatorial social choice function selecting among three or more alternatives is vulnerable to strategic voting (manipulability). If a function *is* strategy-proof and selects from ≥3 options, it *must* be dictatorial. The necessity of ≥3 alternatives is explicitly stated ("With two alone, no trap...").
  *   **Contested Interpretations:** The poem does not adjudicate debates about the theorem's implications for *actual democracy*. Key contested areas include:
      *   **Severity:** How damaging is the theorem? Does it expose a fundamental flaw in democratic aggregation, or is it primarily a critique of highly demanding formal models assuming unrestricted preferences and perfect information?
      *   **Escapes:** Do real-world mechanisms (e.g., restricted preference domains common in politics like single-peakedness, voting systems like approval or range voting allowing intensity expression, probabilistic mechanisms like lotteries) effectively mitigate the theorem's force in practice?
      *   **"Dictatorship":** Does the formal definition of dictatorship in the theorem map meaningfully onto real-world concentrations of power?
  *   **Poetic License:** The phrase "false report" implies an active, conscious lie. The theorem concerns *strategic misrepresentation of preferences* – a voter reports an ordering different from their true one to achieve a better outcome. While often described as "lying," it's a formal property of the function's vulnerability, not necessarily a commentary on voter morality. The concrete example (Alex, apple/banana/cherry) is a standard illustration of manipulability using ordinal rankings. The meter (iambic pentameter) required minor inversions ("Report *your true* desire...") and compression common to the form.
