  We are drafting a joint statement for an adversarial collaboration between two parties with opposing views on free-floating rationales. The hypothetical case is the mosaic bark-borer insect. The insect's behavior is fixed and innate, with no evidence of learning or representation of the wasp. The behavior appears strategic (like protecting eggs from wasps) but is produced by a fixed neural circuit.

  The goal is to have:
  1. A numbered section of claims both sides can sign.
  2. A disagreements table with each row stating one disagreement, worded so that each side accepts the wording of their own position.
  3. A cruxes section: sub-questions that, if settled, would move at least one side. For each crux, a concrete case/experiment/argument that both agree bears on it, and each side's prediction.

  Also, if part of the dispute is verbal, note it.

  We'll structure the document accordingly.

  **Joint Statement: Adversarial Collaboration on Free-Floating Rationales**

  **Introduction:**
  We, the undersigned, agree to the following joint statement regarding the interpretation of the mosaic bark-borer's behavior. We both accept the mechanistic description: the insect has a very small nervous system, no evidence of learning or representing the wasp, and the behavior is produced by a fixed circuit. We also agree that the behavior is the result of natural selection and that it functions to protect the eggs from the parasitoid wasp. However, we disagree on whether this behavior can be said to have a "reason" or a "rationale" in a non-metaphorical sense that does not require a representing subject.

  **Section 1: Agreed Claims**

  Both parties agree to the following:

  1. **Mechanistic Facts:** The mosaic bark-borer's egg-laying and subsequent protective behavior is produced by a fixed neural circuit, without any evidence of learning, representation of the wasp, or cognitive processing beyond the operation of this circuit.

  2. **Selection History:** The behavior (including the timing pattern and decoy movement) has been shaped by natural selection because it conferred a fitness advantage by protecting the eggs from the parasitoid wasp. The behavior exists today because of this history of selection.

  3. **Functional Description:** The behavior can be accurately described as having the function of protecting the eggs from the wasp. This functional description is justified by the selection history and the observable effects of the behavior.

  4. **Apparent Rationality:** The behavior, if observed in a human, would be interpreted as rational and strategic (i.e., as a means to the end of protecting the eggs). This appearance of rationality is explained by the fact that the behavior was selected for because it achieved that end.

  5. **No Current Representation:** The insect does not now, and never did, represent the wasp, the threat it poses, or the rationale for the behavior. The behavior is not driven by any current representation of reasons.

  6. **Non-Intentional Mechanism:** The mechanism producing the behavior is non-intentional in the sense that it does not involve the insect having beliefs, desires, or intentions about the wasp or the protection of the eggs.

  7. **Role of Selection:** The selection history explains why the behavior exists and why it takes the specific form it does. Without this selection history, the behavior would not have evolved.

  8. **Metaphorical Usage:** The term "reason" or "rationale" is sometimes used metaphorically to describe the function or the selection history of a trait. Both parties agree that such metaphorical usage is common and unproblematic.

  **Section 2: Disagreements**

  The following table captures the core disagreements. Each row states a point of disagreement, with the wording of each position acceptable to the respective party.

  | Disagreement ID | Position A (Free-Floating Rationales) | Position B (Representation Required) |
  |-----------------|----------------------------------------|---------------------------------------|
  | D1: Existence of Free-Floating Rationales | There exists a free-floating rationale: the behavior of the mosaic bark-borer has a reason (i.e., to protect the eggs from the wasp) in a non-metaphorical sense, even though no reasoner (including the insect) has ever entertained that reason. This rationale is real and independent of any representing subject. | There are no free-floating rationales. What is called a "free-floating rationale" is at best a compressed description of the selection history or a functional description, but not a reason in a literal sense. Literal reason-talk requires a representing subject who entertains the reason. |
  | D2: What Constitutes a Reason | A reason, in the relevant sense, is an objective fact about why a behavior or trait is adaptive, which exists independently of being represented by any agent. This reason is fixed by the selective pressures that shaped the trait. | A reason, in the literal sense, is a consideration that figures in the reasoning process of a representing subject. Without such a subject, there is no reason, only a causal history and functional outcome. |
  | D3: The Role of Selection History | Selection history does not just explain the origin of the behavior; it also grounds the truth of the claim that the behavior has a rationale (i.e., that it is for protecting the eggs). This rationale is a real feature of the world. | Selection history explains why the behavior exists and why it is functional, but it does not create a "reason" in the absence of a reasoner. The selection history is a causal process, not a repository of reasons. |

  **Section 3: Cruxes**

  We identify the following cruxes. For each, we describe a concrete case, experiment, or argument that both sides agree bears on the issue, and we record each side's prediction in advance.

  **Crux 1: The Possibility of Non-Representational Reasons**

  * **Question:** Can there be a literal reason for a behavior that does not require any past, present, or future representation of that reason by any agent (including during the evolutionary process)?
  * **Concrete Case/Experiment:** Consider an artificial life simulation in which simple agents with no internal representations (e.g., reactive agents with fixed rules) evolve in an environment with predators. The agents develop a fixed behavior that, by chance, avoids predators. The behavior is then selected and refined by evolution. After many generations, the behavior becomes complex and appears strategic (like the mosaic bark-borer). Crucially, the simulation is designed so that at no point does any agent (or the evolutionary process) represent the reason for the behavior (e.g., the predator avoidance). The simulation only uses selection on outputs without any internal model-building.
  * **Prediction of Position A:** If such a simulation can be run and the behavior evolves to be highly effective, then this would demonstrate that a literal reason (to avoid predators) exists for the behavior, even without representation.
  * **Prediction of Position B:** Even if the behavior evolves and is effective, this only shows a functional description and a selection history. It does not establish a literal reason because no representation occurs. The reason is still only in the eye of the observer.

  **Crux 2: The Role of Representation in Evolutionary Explanation**

  * **Question:** Does the evolutionary explanation of a trait require that the reason for the trait (i.e., the selective advantage) was ever represented (by any entity) during the evolutionary process?
  * **Argument:** Consider the following: In natural selection, the environment "selects" traits without representing the reasons for selection. The selection is based on causal interactions, not on any representation of the reasons. For example, the wasp's behavior (being drawn to the decoy) is not based on representing the reason but on fixed responses. The entire process is representation-free.
  * **Prediction of Position A:** This argument supports the existence of free-floating rationales because the reasons (e.g., that the decoy movement protects the eggs) are objectively present in the causal structure of the world and explain the selection, without requiring representation.
  * **Prediction of Position B:** This argument actually supports the opposite: the evolutionary process is entirely mechanistic and representation-free. Therefore, the reasons we ascribe are our own interpretations, not literal reasons in the world.

  **Crux 3: The Status of Functional Descriptions**

  * **Question:** Is a functional description (e.g., "the behavior is for protection from wasps") equivalent to attributing a reason, or is it merely a heuristic summary of causal history?
  * **Concrete Case:** Consider a non-biological artifact: a mousetrap. We say the spring is "for" snapping the bar to catch the mouse. But the mousetrap has no representations. Is the reason for the spring's design (to catch mice) a literal reason or only a description of the designer's intention (or, if evolved by cultural selection, the selection history)?
  * **Prediction of Position A:** In the case of the mousetrap, the reason (to catch mice) is a real feature of the artifact, even if no one is currently representing it. Similarly, in the biological case, the reason is real. The functional description is not just a summary but captures an objective rationale.
  * **Prediction of Position B:** In the mousetrap, the reason is only present because of the designer's (or users') representations. Without a designer, in the biological case, the functional description is just a summary of selection history, not a literal reason.

  **Verbal Dispute Note:**

  Part of the disagreement may be verbal. The term "reason" has multiple uses. Position A uses "reason" in a teleological sense (grounded in natural selection), while Position B reserves "reason" for the cognitive context (requiring representation). Both parties agree that if "reason" is defined as requiring representation, then Position B is correct. But Position A claims that there is a legitimate, non-representational sense of "reason" that is not merely metaphorical. Thus, the dispute is partly about the extension of the term "reason" and whether the teleological sense is literal.

  However, the disagreement is not entirely verbal because it also involves a substantive issue: whether the teleological facts (grounded in selection) are real and objective features of the world, or whether they are merely useful descriptions that depend on the existence of representers (even if only in the scientific community).

  **Conclusion:**

  This document outlines our agreements, disagreements, and the cruxes that we believe can help resolve the issue. We commit to revisiting these cruxes after further investigation and to updating our positions accordingly.

