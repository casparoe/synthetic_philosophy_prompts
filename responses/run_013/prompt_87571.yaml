prompt: |-
  I teach ancient philosophy, which is my excuse for the fact that the following question is probably about forty years out of date. I've somehow ended up chairing three different commitees this year, and I've noticed a pattern in how we vote that I can't put a name to, and it's started to bug me. Here's the shape of it. Take a committee that has to answer a series of yes/no questions whose answers are supposed to hang together — the cleanest case I've actually sat in on was a hospital ethics consult: (1) is the patient competent, (2) has she been adequately informed, (3) should we honour her refusal of treatment, where (3) is supposed to follow from (1) and (2). We take the questions one at a time and go with the majority on each. What comes out is a set of answers that nobody in the room would endorse: roughly 60% say competent, roughly 60% say informed, but only about 40% say we should honour the refusal — because the 60% who say competent and the 60% who say informed are not the same 60%. Every individual member is perfectly coherent; the group's answers, taken together, are not. I've seen the same thing on a hiring committee, except that there the third question ("do we want to hire them") doesn't strictly follow from the first two — it's just that everyone agrees you shouldn't say yes to the third while saying no to the first two, so it's a looser sort of hanging-together, and I can't tell whether that difference matters. I assumed this was Condorcet's paradox and felt briefly clever, then realised it isn't: nothing cycles, we're not ranking anything, nobody's manipulating the agenda. It also doesn't feel like Arrow, though I'd bet it's in the same neighbourhood.

  So: does this have a name? And I'd like more than a name — I want the carving, the boundaries, the near misses. In particular: (a) does the phenomenon require the connections between the questions to be strict logical entailment, or does it also arise when the connection is merely something every member accepts, as in the hiring case — and if that looser version is a genuinely different thing, does it have a different name? (b) Is there a name for the two escapes I can see — deciding the whole package in one vote, versus voting on the parts and reading the answer off — and is there any principled reason to prefer one, given that each seems to buy coherence at a price (in the one case nobody's own view survives, in the other the group contradicts itself)? (c) Does any of this turn on the numbers — does it evaporate if we require two-thirds instead of a bare majority, or if the senior people's votes count double? And (d) when a group ends up in this state, is there a name for the further question of whether the group can be said to have a view at all, or is that just the same issue wearing a different hat? I'm not fishing for a reading list — I just want to know what to call the thing and where its edges are.
reasoning: |-
  Okay, let's start by unpacking the user's problem. They teach ancient philosophy but are now chairing multiple committees and noticing a voting pattern that's bothering them. The core issue is that when voting on interconnected questions separately, the group ends up with inconsistent outcomes even though each member is individually coherent. 

  First, I need to recall what this phenomenon is called. The user mentioned Condorcet's paradox and Arrow's theorem, but those deal with preferences and rankings. Here, the issue is about logical consistency across separate binary votes. That sounds exactly like the doctrinal paradox. 

  The user described a hospital ethics case with three questions where (1) and (2) entail (3). Majority votes on each led to endorsing (1) and (2) but not (3), contradicting the logical link. The hiring committee example is similar, though the connection isn't strict entailment but shared normative views. 

  Now, the user's deeper questions: 

  For (a), the doctrinal paradox applies even when connections aren't strict logical entailments. The hiring committee case fits because members agree that no to (1) and (2) should mean no to (3). So the paradox arises from normative commitments, not just logic. 

  For (b), the two escapes are premise-based (vote on premises and derive conclusion) and conclusion-based (vote directly on the conclusion) approaches. Each has trade-offs. Premise-based preserves coherence but might override majority will on the conclusion. Conclusion-based respects the vote on the outcome but ignores premises. The user wonders about principled reasons to choose. In ethics cases, premise-based might be better for consistency; in hiring, perhaps conclusion-based to capture holistic judgment. 

  For (c), the paradox can still occur with supermajorities or weighted votes if the coalitions aren't aligned. Unless the majority overlaps perfectly, the inconsistency can persist. Changing voting rules doesn't solve the structural issue. 

  For (d), when this happens, the group's "view" is incoherent. This relates to judgment aggregation theory, where collective rationality conflicts with individual rationality. The deeper issue is whether the group can hold a consistent set of beliefs. 

  The user is likely frustrated by repeated encounters with this paradox and wants to understand its boundaries and solutions. They might need practical advice for their committees. As a philosopher, they appreciate precise distinctions and conceptual clarity. They also seem to seek validation that this is a recognized problem with academic grounding. 

  I should emphasize that the doctrinal paradox captures both strict and loose connections. Highlighting the two resolution methods and their trade-offs addresses their practical concerns. Mentioning how voting rules don't eliminate the paradox reassures them that it's inherent to the structure. The discussion on group rationality ties back to philosophical questions about collective decision-making, which aligns with their background.
answer: |-
  This is a beautifully articulated example of the **Doctrinal Paradox** (or sometimes the **Discursive Dilemma**). It's *not* Condorcet or Arrow, though it inhabits the broader landscape of social choice theory and judgment aggregation. Here's the carving you requested:

  1.  **The Core Phenomenon & Its Name:**
      *   **Name:** **Doctrinal Paradox** (This is the most widely accepted and precise term).
      *   **Definition:** The Doctrinal Paradox occurs when a group voting separately on logically interconnected premises (or reasons) arrives at a collective set of judgments that is inconsistent, even though every individual member's judgments *are* consistent. The collective outcome violates the logical (or normative) connection between the propositions that *every* individual accepts.
      *   **Your Examples:**
          *   **Hospital Ethics:** Premise 1 (Competent), Premise 2 (Informed), Conclusion (Honour Refusal) where Conclusion = Premise 1 AND Premise 2. Majority votes "Yes" on each premise but "No" on the conclusion = Inconsistent collective judgment.
          *   **Hiring Committee:** Premise 1 (Meets Standard A), Premise 2 (Meets Standard B), Conclusion (Hire). While Conclusion doesn't *strictly* equal Premise 1 AND Premise 2, *every member agrees* that "No" on *both* premises entails "No" on Conclusion. Majority votes "No" on both premises but "Yes" on Hire = Inconsistent collective judgment *given the members' shared normative commitment*.

  2.  **Answering Your Specifics:**

      *   **(a) Strict Entailment vs. Shared Normative Commitment:**
          *   **Strict Entailment:** The classic Doctrinal Paradox applies directly (e.g., the hospital case where Conclusion = P1 AND P2).
          *   **Shared Normative Commitment (Looser):** **This is still the Doctrinal Paradox.** The paradox arises because the *group's collective judgment set* violates a constraint (the "doctrine") that *each individual accepts*. The doctrine doesn't need to be a strict logical entailment; it can be any consistency constraint universally endorsed by the members (e.g., "¬P1 AND ¬P2 → ¬Conclusion" in your hiring case). The key is the *universal acceptance* of the connection, making the collective inconsistency a violation of the group's own agreed-upon reasoning framework. **No different name is needed.**

      *   **(b) The Two "Escapes" and Their Names/Reasons:**
          *   **Escape 1: Premise-Based Procedure:** Vote *only* on the premises (Competent?, Informed?) and derive the conclusion logically from the collective premise judgments (Honour Refusal = Competent AND Informed). This guarantees coherence.
              *   **Price:** The collective conclusion may contradict what a majority *would have voted* if asked directly about the conclusion (as in your hospital example).
              *   **Principle:** Prioritizes the group's adherence to logical/rational consistency based on the foundational reasons. It respects the "doctrine." Often favored in contexts where reasoning integrity is paramount (like ethics, law).
          *   **Escape 2: Conclusion-Based Procedure:** Vote *only* on the conclusion (Honour Refusal? / Hire?) and ignore the premises for the collective decision.
              *   **Price:** The collective decision on the conclusion provides no information about the group's collective view *on the reasons* supporting that conclusion. It ignores the premises entirely.
              *   **Principle:** Prioritizes the group's direct expression of will on the ultimate outcome. Favored when the "bottom line" is most important, or when the premises are highly contested or ambiguous.
          *   **Principled Choice:** There's **no universally "correct" answer.** The choice depends on the committee's purpose:
              *   Is the goal to arrive at the most *rationally defensible* outcome based on shared reasoning principles? → **Premise-Based.**
              *   Is the goal to capture the group's aggregate *preference* or *judgment* about the final outcome itself? → **Conclusion-Based.**
              *   In your ethics case, premise-based feels more appropriate. In a final "up or down" hiring vote after lengthy discussion, conclusion-based might be acceptable. The paradox highlights that you often **can't have both** collective consistency *and* direct majoritarian expression on every question *and* respect for individual coherence.

      *   **(c) Do Numbers/Rules Matter? (Does it evaporate?):**
          *   **No, the paradox does not fundamentally evaporate.** Changing the voting rule (simple majority, supermajority, unanimity) or weighting votes (seniority double-count) **shifts the thresholds but doesn't eliminate the structural possibility.**
          *   **Why?** The core issue is the *misalignment* of the majorities/minorities across the propositions. If the 60% majorities for P1 and P2 overlap perfectly (the *same* 60%), then the majority for the Conclusion would also be at least 60% (if Conclusion = P1 AND P2). But the paradox arises precisely because the majorities *don't* perfectly overlap. Different voting rules might make the inconsistency *less likely* or require larger groups/more disagreement to manifest, but the **logical possibility remains inherent in the structure of separate voting on interconnected questions.**

      *   **(d) The Group's "View":**
          *   **This is the core consequence of the paradox.** When it occurs, **the group, as a collective agent, holds an inconsistent set of judgments.** It simultaneously affirms premises that logically/normatively entail a conclusion while denying that conclusion.
          *   **Name:** This touches on questions of **Collective Rationality** and **Judgment Aggregation.** The Doctrinal Paradox demonstrates that seemingly reasonable voting procedures (majority on each proposition) can fail to produce **collectively rational** outcomes (outcomes consistent with the logical/normative constraints accepted by all individuals).
          *   **Is it the same issue?** It's the *implication* of the paradox. The paradox *is* the mechanism by which the group arrives at an inconsistent ("irrational") collective view. Asking "does the group have a coherent view?" after observing the paradox is asking about the *result* of the paradox. The field studying whether and how groups *can* form consistent collective judgments is **Judgment Aggregation Theory.**

  3.  **Boundaries and Near Misses:**

      *   **Boundary:** The paradox requires propositions that are **interconnected by a consistency constraint universally accepted by the voters**.
      *   **Near Miss 1: Condorcet's Paradox:** Involves *cyclic majority preferences* over *rankings* of three or more alternatives (A>B, B>C, C>A). Your situation involves *inconsistent truth-value judgments* on *logically connected propositions*.
      *   **Near Miss 2: Arrow's Theorem:** Concerns aggregating *individual preference orderings* into a *social preference ordering* satisfying specific axioms. The Doctrinal Paradox concerns aggregating *individual sets of judgments* (true/false on propositions) into a *collective set of judgments*, focusing on *logical consistency*. Arrow deals with preferences; the Doctrinal Paradox deals with beliefs/judgments.
      *   **Near Miss 3: Ostrogorski's Paradox:** Concerns inconsistency between voting on an overall platform and voting on individual issues *within* that platform. Similar flavor (majority on issues ≠ majority on package) but distinct structure.

  **In Summary:**

  *   **Name:** **Doctrinal Paradox** (or Discursive Dilemma).
  *   **Core:** Separate majority votes on interconnected premises lead to a collectively inconsistent outcome, despite individual consistency.
  *   **Scope:** Applies equally to strict logical entailments *and* universally shared normative commitments (like "no hire if fails both standards").
  *   **Resolutions:**
      *   **Premise-Based:** Vote premises, derive conclusion. Ensures coherence, may override direct majority on conclusion.
      *   **Conclusion-Based:** Vote conclusion only. Respects direct majority will on outcome, ignores collective view on reasons.
      *   **Choice:** Context-dependent; coherence vs. direct expression on outcome.
  *   **Robustness:** Changing voting thresholds or weights doesn't eliminate the fundamental structural possibility; it only changes the likelihood or required size of misaligned majorities.
  *   **Group Rationality:** The paradox results in the group holding an **inconsistent set of collective judgments**, raising questions about **collective rationality** studied in **judgment aggregation theory**.

  You've perfectly identified a fundamental and non-trivial problem in collective decision-making. The Doctrinal Paradox elegantly captures the tension between individual rationality, majoritarian decision-making, and collective coherence on interconnected issues. Ancient philosophers debating the nature of the polis would likely have found this deeply fascinating!
