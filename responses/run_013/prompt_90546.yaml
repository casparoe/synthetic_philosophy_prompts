          Rule 2 and Rule 3: predict not law.

     - I would bet on not law (so against Rule 1) because of the severity of the moral violation and the pattern of the colleague's previous rulings (especially Case A and C which involved similar moral violations).

     - Third rule (Rule 3) fits equally well.

