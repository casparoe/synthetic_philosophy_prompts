          Therefore, Rule 3 seems to capture both the formal and substantive concerns.

          But note: the colleague's verdicts do not include a case that is formally defective but morally acceptable. So we cannot tell.

          Thus, Rule 3 is a candidate that fits the existing data.

     However, the problem says "at least two rules", and we have three: Rule 1, Rule 2, and Rule 3. And Rule 3 is actually a combination of both.

     But note that the new case will help us:

          If the colleague says the new case is not law, then Rule 1 is eliminated. 
          Then we are left with Rule 2 and Rule 3, which both predict not law.

          If the colleague says it is law, then Rule 2 and Rule 3 are eliminated and Rule 1 survives.

     So we need an additional case to distinguish between Rule 2 and Rule 3.

  d) Further case to tell Rule 2 and Rule 3 apart?

     We need a case that has:
        - Formal defects but no violation of the moral floor.

     Example: 
          A retroactive tax break for a specific individual (say, a war hero) that is published and clear but retroactive. 

          - Formal defects: retroactive (lacks prospectivity) and might lack generality (if it targets a specific individual).
          - But morally: giving a tax break to a war hero is not necessarily violating a moral floor.

          How would the rules decide?

          Rule 1 (only formal virtues): 
              - Not prospective and not general → so not law.

          Rule 2 (only moral floor): 
