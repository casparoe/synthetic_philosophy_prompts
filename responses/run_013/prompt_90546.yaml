  2. Case B: Properly enacted, public, prospective statute creating a public health scheme → Verdict: Law.
  3. Case C: Validly enacted but hopelessly vague statute that in practice licensed arbitrary detention → Verdict: Not law.
  4. Case D: Clear, prospective, properly enacted tax increase → Verdict: Law.

  We are then given a new case:
     - Formally impeccable (validly enacted, published, prospective, general, and perfectly clear)
     - But it revokes the citizenship of a named minority and authorizes their indefinite detention.

  We are to consider at least two rules that fit the previous verdicts:

  Rule 1: Legal validity tracks the formal virtues of legality (generality, publicity, prospectivity, clarity).
  Rule 2: Legal validity tracks a substantive moral floor.

  We must:
    a) Say what each rule predicts for the new case.
    b) Which rule we would bet on and why.
    c) Whether a third rule fits the record equally well.
    d) Which further case would tell the surviving rules apart.

  Step 1: Analyze the existing cases with the two rules.

  Rule 1 (Formal Virtues):
    - The rule says that if a norm has the formal virtues (generality, publicity, prospectivity, clarity) then it is law, otherwise not.

    Case A: 
        - Unpublished (lacks publicity), retroactive (lacks prospectivity), and beyond authority (which might be considered a formal defect). 
        - Verdict: Not law → fits because it lacks publicity and prospectivity.

    Case B: 
        - Properly enacted, public, prospective → has all the formal virtues. 
        - Verdict: Law → fits.

    Case C: 
        - Validly enacted but hopelessly vague → lacks clarity. 
        - Verdict: Not law → fits because it lacks clarity.

    Case D: 
        - Clear, prospective, properly enacted → has the formal virtues. 
        - Verdict: Law → fits.

  Rule 2 (Substantive Moral Floor):
    - This rule says that even if formally perfect, if a norm is substantively immoral (below a moral floor) then it is not law.

    Case A: 
        - It retroactively strips a religious minority of property → substantively immoral (violates moral floor). 
        - Verdict: Not law → fits.

    Case B: 
        - Creates a public health scheme → morally positive or at least not below the floor. 
        - Verdict: Law → fits.

    Case C: 
        - In practice licensed arbitrary detention → arbitrary detention is a violation of human rights → below the moral floor. 
        - Verdict: Not law → fits.

    Case D: 
        - Tax increase → generally not considered a violation of a moral floor (unless extreme, but no indication). 
        - Verdict: Law → fits.

  So both rules fit all the prior cases.

  Now, the new case:
    - Formally impeccable: validly enacted, published, prospective, general, clear → so Rule 1 would predict it is law.
    - However, it revokes citizenship of a named minority and authorizes indefinite detention → which is a severe violation of human rights (moral floor). Thus, Rule 2 would predict it is not law.

  Therefore:
    a) Rule 1 predicts: Law.
       Rule 2 predicts: Not law.

  b) Which rule to bet on?
     Without more information, we cannot be sure. However, note that the colleague is in a jurisprudence seminar, and the problem mentions the old positivism-versus-natural-law debate. 
     The colleague's prior decisions could be interpreted either way.

     But let us consider the pattern:

     - Case A: Had both formal defects and substantive immorality → not law.
     - Case B: Formally good and substantively acceptable → law.
     - Case C: Formally defective (vagueness) and substantively immoral → not law.
     - Case D: Formally good and substantively acceptable → law.

     The new case is formally perfect but substantively immoral.

     The colleague has not yet ruled on a case that is formally perfect but substantively immoral. Therefore, we do not have a direct precedent.

     However, note that in Case C, the colleague ruled "not law" even though the statute was validly enacted (a formal virtue) but had a formal defect (vagueness) that led to substantive harm. 
     But in the new case, there is no formal defect. So Rule 2 would require a new step.

     It's possible the colleague might follow Rule 1 (positivism) and say that formally perfect laws are valid regardless of content. 
     Alternatively, she might follow Rule 2 (natural law) and invalidate it because of the moral defect.

     Given that the colleague ruled Case C as not law because of the substantive harm (even though the formal defect was the vagueness), it suggests she is concerned with substantive outcomes. 
     However, the vagueness was the immediate formal defect that caused the harm. 

     I would bet on Rule 2 (predicting not law) because:
        - The colleague has shown concern for substantive outcomes in Case A (stripping property) and Case C (arbitrary detention), both of which are severe moral violations.
        - The new case is even more severe: revoking citizenship and indefinite detention of a minority, which is a clear violation of human rights.

     But note: the colleague might also be applying a combination of formal and substantive criteria. We need to see if there's a third rule.

  c) Is there a third rule that fits equally well?

     Consider a third rule that requires both the formal virtues and not violating the substantive moral floor? 

     Rule 3: A norm is law if and only if it has the formal virtues and does not violate the substantive moral floor.

     Now let's check:

     Case A: 
          - Lacks formal virtues and violates moral floor → not law → fits.
     Case B: 
          - Has formal virtues and does not violate the moral floor → law → fits.
     Case C: 
          - Lacks clarity (formal virtue) and violates moral floor → not law → fits.
     Case D: 
          - Has formal virtues and does not violate the moral floor → law → fits.

     So Rule 3 also fits all the prior cases.

     How does Rule 3 predict the new case?
          - Formal virtues: yes.
          - Violates moral floor: yes.
          - Therefore, Rule 3 would say: not law.

     So both Rule 2 and Rule 3 predict not law for the new case, while Rule 1 predicts law.

     But note: Rule 3 is more stringent because it requires both conditions. In the prior cases, the absence of either condition led to "not law". However, we haven't seen a case that has formal virtues but violates the moral floor until now. So Rule 3 would rule the new case as not law, which matches Rule 2.

