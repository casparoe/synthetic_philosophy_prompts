            - But we already know from the new case that if she said "law" for the new case then Rule 1 is the only one left? Or if she said "not law" for the new case then Rule 1 is eliminated.

          Alternatively, if the colleague says "law" for Case E, then Rule 2 is supported (because Rule 2 doesn't require formal virtues) and Rule 3 would be refuted (because Rule 3 requires formal virtues and would say not law).

     Therefore, to distinguish between Rule 2 and Rule 3 (assuming the new case is ruled as not law, so Rule 1 is out), we can use Case E.

     But note: the colleague might also have a rule that requires formal virtues but not necessarily a moral floor? That would be Rule 1. Or a rule that requires both? That's Rule 3. Or a rule that requires either formal virtues or no moral violation? That doesn't seem to fit because then Case A would be law? (No, because Case A has formal defects and moral violation, so it would fail both). 

     Alternatively, a rule that says: law if and only if either (a) it has formal virtues and is not morally egregious OR (b) ...? This gets complex.

     Given the simplicity, we stick to the three rules.

     Conclusion:

