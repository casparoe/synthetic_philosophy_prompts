prompt: |-
  I'm a student in an upper-level seminar on game theory and computation, and I've volunteered to run one 90-minute session for about 12 classmates. Design an activity that makes them feel the force of program equilibrium: in a one-shot Prisoner's Dilemma, if each player submits a deterministic program that can read the other player's full source code before choosing, mutual cooperation can be a Nash equilibrium even though defection dominates in the ordinary one-shot game, with no repetition and no communication. Do not name the idea or explain it up front. Have them write short strategies in plain pseudocode (no actual coding required), submit them to a referee, and then play every pair for points rather than money. Give me the rules, the payoff scheme, a minute-by-minute timeline, and a debrief that maps what happened onto the formal point: why source-code inspection changes the strategic situation, why a program that cooperates exactly when its opponent's program is equivalent to itself can be stable, and why ordinary one-shot reasoning would deny that this is possible. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of program equilibrium the activity cannot reproduce and that I will have to supply in the debrief. Keep the response under 1,000 words and write in American English.
reasoning: |-
  We are designing a classroom activity to illustrate program equilibrium without naming it upfront. The key is that players submit deterministic programs that can read the other's source code. We'll use a one-shot Prisoner's Dilemma.

  **Rules of the Game:**
  - Each player writes a program (in pseudocode) for the Prisoner's Dilemma. The program takes as input the full source code of the opponent's program and outputs either 'Cooperate' or 'Defect'.
  - Payoffs for a one-shot Prisoner's Dilemma (per player):
    - If both cooperate: 3 points each.
    - If one defects and the other cooperates: 5 points for the defector, 0 for the cooperator.
    - If both defect: 1 point each.

  **Activity Setup:**
  - We have 12 students (so 12 programs). They will be paired against every other program (round-robin). Each program plays each other exactly once (one-shot per pairing).
  - The referee (you) will collect the programs and then run every possible pair. For each pair, the referee will:
    1. Take program A and give it the source code of program B. Run program A to get its move.
    2. Take program B and give it the source code of program A. Run program B to get its move.
    3. Assign payoffs based on the two moves.

  **Timeline (90 minutes):**

  1. **Introduction (5 minutes):**
     - Explain the one-shot Prisoner's Dilemma payoffs (without any repetition or communication). Emphasize that they are writing a program that will be used in a tournament against every other program.
     - Tell them: "You are to write a deterministic program in plain pseudocode. Your program will be given the full source code of the opponent's program as input. Then it must output either 'Cooperate' or 'Defect'. The program should be written so that it can be run by the referee (me) without any ambiguity. You have 20 minutes to write your program."

  2. **Writing Programs (20 minutes):**
     - Students write their programs on paper (or electronically if that's easier). They must write clearly. They should not discuss their programs with others.

  3. **Collecting and Running the Tournament (30 minutes):**
     - Collect all programs. As referee, you will run every pairing. For each pair (A, B):
       - Run A with B's source code as input -> get move of A.
       - Run B with A's source code as input -> get move of B.
       - Record the moves and compute payoffs for both.
     - It's important to do this quickly. You may want to have a helper or use a simple script if you are doing it electronically. If on paper, you'll have to simulate the programs manually (so keep the pseudocode simple).

  4. **Tabulating Results (10 minutes):**
     - Show the overall results: total points for each player. You can rank them.

  5. **Debrief (25 minutes):**
     - Start by asking: "What strategies did people write? Did anyone try to cooperate? Why or why not?"
     - Then: "Did anyone write a program that cooperates only under certain conditions? What conditions?"
     - Now, you can reveal the key idea: "In this setup, we saw that sometimes mutual cooperation occurred. How is that possible? Let's look at one example: a program that cooperates if and only if the opponent's program is exactly the same as itself. Why would that work?"
     - Explain: "If both players write the same program (say, a program that cooperates only when it sees itself), then when they play each other, each sees its own code and cooperates. So they both get 3. Now, if one player were to change to a different program that defects when it sees that program, then when playing against the original program, the original program (which only cooperates when it sees itself) would not cooperate (because it sees a different program) and would defect. So both defect and get only 1. But if the mutant program defects, then in the match with the original, the original defects too, so the mutant only gets 1 instead of 3. Therefore, the mutant doesn't do better. And if the mutant tries to cooperate when it sees the original program, then the original program would defect (because it doesn't see itself) and the mutant would get 0. So the mutant does worse. Hence, the original strategy (cooperate only when seeing itself) is stable against such mutations."
     - Contrast with the ordinary one-shot Prisoner's Dilemma: "In the ordinary game without program inspection, you cannot condition your action on the opponent's action. Defection dominates because no matter what the opponent does, you get a higher payoff by defecting. But here, by inspecting the opponent's source code, your program can condition on what the opponent will do. And that changes the game."
     - Highlight the point: "This is called a program equilibrium. It shows that in one-shot games where players commit to programs that can inspect each other, mutual cooperation can be sustained as a Nash equilibrium."

  **What will go wrong:**
  - **Programs that are too complex or ambiguous:** Some students might write programs that are hard to interpret. To handle this, insist on simple, clear pseudocode and have them submit a draft to you for a quick check during the writing period (if time allows). Alternatively, during the running phase, if a program is ambiguous, ask the author to clarify on the spot. But this might slow things down.
  - **Students might not write the self-referential cooperator:** They might all defect. Then mutual cooperation never occurs. If that happens, in the debrief you can introduce the idea: "What if we had a program that cooperates only when it sees an exact copy of itself? Would that work? Let me show you." Then run an example with two such programs and then with a mutant.
  - **Time:** Running 66 pairs (12 choose 2) might take too long. If so, you can break the class into two groups of 6 (so 15 pairs per group) and run them in parallel (with helpers). Alternatively, use a computer to run the simulations if you have set up the programs in a machine-readable way. But the activity is meant to be simple, so stick to paper if necessary and be efficient.

  **What the activity cannot reproduce:**
  - **The Halting Problem:** In theory, a program might try to run the opponent's program, which could lead to infinite loops. We ignore this by assuming programs are guaranteed to halt (so we are using a restricted model of computation). In the activity, we'll just require that the programs are simple and halt. In the debrief, you can mention that in the full model, we must consider the possibility of non-halting, but we avoided that for simplicity.

  **Payoff Scheme:**
  - The payoffs are as above. Each player's total score is the sum of their payoffs over all 11 matches (if 12 players). The winner is the one with the highest total.

  **Final Note:**
  - The activity should make the point that source-code inspection allows for conditional strategies that are not available in the normal game. The key is that a program can commit to cooperate if and only if the opponent does the same, and if both do that, then they both cooperate and get the cooperative payoff. And if one defects, then the other will defect too in response, so the defector doesn't gain.

  Keep the energy up and encourage creativity in the writing phase. Good luck!
answer: |-
  ### Program Equilibrium Activity: One-Shot Prisoner's Dilemma Tournament  
  **Goal:** Illustrate how mutual cooperation becomes possible when players submit programs that inspect each other's source code.  

  ---

  #### **Rules for Students**  
  1. **Game:** One-shot Prisoner's Dilemma. Payoffs per pair:  
     - Both Cooperate (C, C): **3 points each**  
     - One Defects, One Cooperates (D, C): **5** (defector) / **0** (cooperator)  
     - Both Defect (D, D): **1 point each**  
  2. **Program Submission:**  
     - Write a **deterministic program** in plain pseudocode.  
     - Your program takes the **full source code** of the opponent’s program as input.  
     - Output: `C` (Cooperate) or `D` (Defect).  
     - Example:  
       ```  
       IF opponent's code == "always output C" THEN output D  
       ELSE output C  
       ```  
  3. **Tournament Structure:**  
     - All 12 programs play against every other program **once**.  
     - Referee (you) runs each pair:  
       - Feed Program A the source code of Program B → get A’s move.  
       - Feed Program B the source code of Program A → get B’s move.  
       - Award payoffs based on the moves.  
     - **Scoring:** Your total score = sum of payoffs across all 11 matches.  

  ---

  #### **Timeline (90 Minutes)**  
  - **0–5 min:** Introduce the Prisoner’s Dilemma payoffs (show table). Emphasize: *One-shot, no repetition, no communication*.  
  - **5–25 min:** Students write programs (20 min). **Rules reminder:**  
    *"Your program sees the opponent’s full source code. It must output C or D deterministically."*  
  - **25–55 min:** **Tournament!** Referee collects programs. For each pair:  
    - Read Opponent B’s code to Program A → record A’s move.  
    - Read Opponent A’s code to Program B → record B’s move.  
    - Announce moves/payoffs per pair (keep it brisk; use a helper if needed).  
  - **55–65 min:** Tabulate and announce total scores. Who scored highest?  
  - **65–90 min:** Debrief (25 min).  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem:** Students write overly complex programs → delays or ambiguous outputs.  
    **Fix:** Enforce "plain pseudocode" upfront. Veto programs with loops/recursion.  
  - **Problem:** No one writes cooperative programs → all pairs defect (D,D).  
    **Fix:** In debrief, contrast with the *self-cooperate* strategy (see below).  
  - **Problem:** "Code equivalence" is hard to judge (e.g., whitespace differences).  
    **Fix:** Referee decides equivalence during the tournament (be consistent).  

  ---

  #### **Debrief (Key Talking Points)**  
  1. **What happened?**  
     - Ask: *"Did any pair achieve mutual cooperation? How?"*  
     - Highlight programs that cooperated **only if** they recognized the opponent’s code (e.g., "cooperate if opponent’s code == my code").  

  2. **Why source-code inspection changes the game:**  
     - Ordinary one-shot PD: Defection dominates because you can’t bind your move to the opponent’s.  
     - **Here:** Your program can *condition* cooperation on the opponent’s *program structure*.  
     - Example: Program that cooperates **iff** opponent’s code is identical to itself.  
       - If both players submit this program → both see identical code → both output C → (C,C) payoff (3,3).  
       - If one "mutant" defects, the other recognizes non-identical code → defects too → (D,D) payoff (1,1).  
       - Mutant gets **1** (against self-cooperator) instead of **3** → no incentive to deviate!  

  3. **Why ordinary reasoning denies this:**  
     - In standard PD, "defect" is dominant: *"No matter what the opponent does, I gain by defecting."*  
     - **But with programs:** Mutual defection isn’t the only equilibrium. The *self-cooperate* program forms a Nash equilibrium because unilateral deviation *rewards less* (1 < 3).  

  4. **What the activity can’t show (mention this!):**  
     - **Turing-completeness:** Real program equilibrium handles programs that simulate each other (halting problem, quines). Our activity ignores this.  
     - **Solution:** Explain post-activity: *"In theory, programs can be written to simulate opponents, but we simplified to avoid infinite loops."*  

  ---

  #### **Why This Works**  
  Students experience firsthand:  
  - Mutual cooperation emerges from programs that "trust" self-similar opponents.  
  - Defection isn’t dominant when actions are conditioned on *code structure*.  
  - Nash equilibrium shifts because programs enforce *conditional strategies*.  

  **Final Tip:** If no one writes a self-cooperating program, demo it in debrief with two identical programs. Contrast outcomes if one "defects on non-self" vs. always defects.
