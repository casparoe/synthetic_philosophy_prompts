prompt: |-
  I am the taxonomic editor for a national biodiversity database, and our checklists are what regulators use to decide which populations receive legal protection, which recovery funds get spent where, and which land-use permits are granted. A few dozen times a year a researcher, a regional agency, or one of my own curators proposes that some population be recognized as a distinct species, and the proposals arrive with different kinds of evidence in different shapes. I have no fieldwork budget, my curators can read a phylogeny and a morphometric table but have no training in the philosophy of biology, and each proposal has to be resolved inside a fixed review window before the next regulatory cycle closes. I sign off on every one, so I am the person who eats the consequences of a procedure that quietly made a value judgment and dressed it up as a measurement.

  I want you to write me a decision procedure the curators can actually run on a proposal. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to me because the remaining question is one of policy or value rather than evidence. It has to be explicit, at each step, about which species concept that step is presupposing, and about what to do when the lines of evidence point in different directions, for instance when the genetic data support splitting a lineage but the morphology does not, or the reverse. It should be honest about which steps are judgment calls wearing a lab coat, and where a threshold I might reach for, such as a genetic distance cutoff, is doing work that no one has justified.

  To make this concrete, here is the draft rule I have been using, which I want you to absorb, repair, or throw out, and to say which: recognize a population as a species if it forms a monophyletic group in the available genetic data and is diagnosably distinct in at least one character system. I already suspect this mishandles asexual lineages, hybrid zones, and lineages that diverged so recently that they have not yet sorted, but I want the procedure itself to tell me how it fails rather than me guessing.

  Then run the procedure on three proposals. First, a cryptic frog lineage separated by deep genetic divergence and a distinct mating call but with no morphological difference, whose ranges overlap slightly at one contact zone where they do not interbreed. Second, a ring of salamander populations around a valley, where each adjacent pair interbreeds but the two terminal forms meet and do not. Third, an asexual parthenogenetic snail lineage that is genetically and ecologically distinct but offers no interbreeding test at all. Include at least one case where the procedure returns an answer I will not like, and tell me plainly what the procedure cannot do.

  One more constraint: our records must interoperate with a global checklist that openly uses a different and more inclusive concept than ours, so the procedure should say how to record and defend a decision that conflicts with that global list without pretending the conflict is a mere bookkeeping difference.

  Write your answer as continuous prose, the way you would write me an email. No headings, no bullet points, no bold text, no tables. If you need to enumerate steps, do it in full sentences.
reasoning: |-
  Okay, the user is a taxonomic editor for a national biodiversity database, and they're dealing with high-stakes decisions about species classification. Their current method—recognizing a species if it's monophyletic and diagnosably distinct—has flaws, especially with tricky cases like asexual organisms or hybrid zones. They need a clear, step-by-step procedure that curators can follow within tight deadlines, one that explicitly addresses different species concepts and conflicting evidence.

  First, I need to understand the core issues here. The user's sign-offs affect legal protection, funding, and land use, so the procedure must be both scientifically rigorous and practically implementable by curators without philosophy of biology training. The existing rule is too simplistic: it mishandles asexual lineages, ring species, and cases where genetics and morphology conflict. The user also needs to handle disagreements with a global checklist that uses a more inclusive concept.

  The key requirements are: a step-by-step decision tree that halts when evidence is insufficient or value judgments are needed; explicit naming of which species concept each step relies on; handling evidentiary conflicts; and transparency about arbitrary thresholds. The procedure must also specify how to document disputes with the global taxonomy without pretending it's just clerical.

  For the structure, I'll build a phased approach. Phase 1 would be pre-screening for data adequacy—rejecting proposals without minimum evidence. Phase 2 would assess reproductive isolation (using the Biological Species Concept) where testable, requiring either direct evidence of non-interbreeding or strong proxies like assortative mating. Phase 3 would handle non-biological cases (like asexual lineages) with monophyly plus diagnosability, but only after Phase 2 is inapplicable. Crucially, monophyly alone wouldn't suffice—it needs corroboration. 

  For evidentiary conflicts, I'll prioritize reproductive isolation over other lines when available, because it's the BSC's core. When unavailable (e.g., in asexuals), monophyly plus distinctness would be required, but with caveats about arbitrary thresholds. The procedure must explicitly label judgment points, like choosing genetic distance cutoffs.

  Now, for the test cases: The cryptic frogs pass Phase 2 easily—sympatry without interbreeding is strong BSC evidence. The salamander ring species is trickier; adjacent populations interbreed, but endpoints don't. The procedure should recognize the endpoints as species under BSC due to reproductive isolation in sympatry, though documenting the ring structure is crucial. The asexual snail would only qualify if monophyletic and diagnosable, but here's the "unlikable" part: if it hybridizes with sexual relatives, it might fail monophyly, forcing rejection despite distinctness. This exposes the procedure's limitation with non-tree-like evolution.

  For global checklist conflicts, I'll advise documenting the rationale as "narrower species concept applied due to conservation mandate," avoiding false equivalence. The user's draft rule is partially salvaged but moved later in the process—monophyly + diagnosability becomes a fallback for non-biological cases, not the default.

  Finally, the procedure must admit where it can't help: value judgments (e.g., ranking allopatric lineages) get kicked to the user, and arbitrary thresholds are flagged as such. The snail case illustrates how the system fails with certain asexual scenarios—no workaround exists without policy input.
answer: |-
  Here's a decision procedure based on your constraints, designed for clarity and operational use by your curators. I’ve absorbed your draft rule but repositioned it within a broader framework that explicitly handles your concerns about conflicts, philosophy, and edge cases. The core shift is prioritizing *reproductive isolation* where testable (aligning with the Biological Species Concept, BSC), and using monophyly + diagnosability only as a fallback for lineages where BSC is inapplicable (e.g., asexuals, allopatry without contact). This avoids the pitfalls of applying a purely phylogenetic or diagnosability standard universally. The procedure is sequential; each step must be satisfied or lead to a defined outcome (reject, elevate to you, or proceed). Crucially, it flags where judgment or policy is unavoidable.

  **The Procedure:**

  Start by confirming the proposal includes *primary data* supporting distinctness. If it relies solely on opinion or unpublished claims, reject it immediately for insufficient evidence. Assuming evidence is provided, proceed step-by-step.

  First, ask: **Is there evidence of current or potential sympatry between the proposed lineage and its closest relative(s)?** This assesses if a direct test of the Biological Species Concept (BSC) is *possible*. Sympatry means overlapping ranges where interbreeding could occur. If no sympatry exists (strict allopatry), skip to Step 4. If sympatry exists (or a narrow hybrid zone), proceed to Step 2.

  Second, ask: **In sympatry, is there evidence of *lack* of interbreeding or significant gene flow?** This is the core BSC test. Sufficient evidence includes: direct field observations of non-interbreeding despite opportunity (e.g., different mating seasons, calls, behaviors), genetic data showing strong assortative mating or bimodal genotypic clusters with few hybrids (F1 hybrids alone are insufficient; look for evidence of hybrid breakdown or limited introgression), or ecological displacement preventing contact. If clear evidence of reproductive isolation exists, recognize as a distinct species. **Stop. Species recognized (BSC).** If clear evidence of *active, successful* interbreeding and gene flow exists (panmixia), reject the split. **Stop. Proposal rejected.** If the evidence is ambiguous, inconclusive, or conflicting (e.g., some gene flow but also assortative mating), proceed to Step 3.

  Third, ask: **Despite ambiguous sympatry evidence (Step 2), is there strong *corroborating* evidence for evolutionary independence?** This step acknowledges BSC ambiguity but looks for other lines supporting species status. Require *both*: (A) Robust monophyly in genetic data (Phylogenetic Species Concept, PSC), meaning the lineage forms a well-supported clade distinct from its closest relatives *and* (B) Diagnosable distinctness in at least one character system (morphology, call, behavior, ecology) that could plausibly contribute to isolation (Diagnosable Species Concept). If both A and B are met, recognize as a distinct species. **Flag:** This step involves judgment: "robust" monophyly depends on data/methods thresholds, and "plausibly contribute" is interpretive. **Stop. Species recognized (PSC/Diagnosability, BSC ambiguous).** If either A or B is not met, reject the split. **Stop. Proposal rejected.**

  Fourth (if no sympatry from Step 1): **Is the lineage asexual (obligate parthenogenetic, apomictic)?** If yes, proceed to Step 5. If sexual, proceed to Step 6.

  Fifth (for asexuals): **Does the lineage form a robust monophyletic group and is it diagnosably distinct in at least one character system (morphology, genetics, ecology)?** This adapts your draft rule explicitly for asexuals, using a mix of PSC and diagnosability. Sufficient evidence requires clear genetic clustering (often via fixed differences) *plus* distinctiveness in another trait (e.g., morphology, niche). If both are met, recognize as a distinct species. **Flag:** This is fundamentally a *ranking decision*, not a test of "specieshood" in a BSC sense. The justification is practical management of discrete evolutionary units. **Stop. Species recognized (Asexual Unit/PSC).** If not met, reject. **Stop. Proposal rejected.**

  Sixth (for sexual, allopatric lineages): **Is there compelling evidence the lineage is on an independent evolutionary trajectory despite allopatry?** This is the trickiest, most value-laden step. Require *all* of the following: (A) Robust monophyly (PSC), (B) Diagnosable distinctness in multiple character systems or one very pronounced difference, *and* (C) Strong evidence of evolutionary divergence drivers (e.g., significant ecological differentiation, chromosomal rearrangements posing strong post-zygotic barriers inferred in the lab, deep genetic divergence exceeding sister species pairs in the group). **This step *must* be elevated to you.** **Stop. Elevate to Editor.** Why? Deciding what constitutes "compelling" evidence for evolutionary independence in allopatry inherently involves weighing the *significance* of divergence and predicting future potential – it's a policy-laden judgment about conservation/management units versus species, not a clear evidence-based test. Your draft rule (monophyly + one diagnosable character) is applied here *only if* you, after review, deem the evidence sufficient for elevation under your policy goals. The procedure forces this to your desk.

  **Handling Evidentiary Conflict:** The procedure handles conflict implicitly by its sequence. BSC evidence (Steps 1-3) trumps other lines *when sympatry exists*. Conflict arises most in Step 3 (ambiguous sympatry) and Step 6 (allopatry). Step 3 requires *both* monophyly *and* diagnosability to override ambiguous BSC evidence. Step 6 bundles multiple lines and forces a policy call. Morphology/genetics conflict in allopatry (Step 6) means the evidence isn't "compelling" per the criteria, so it stays rejected or elevated to you. For asexuals (Step 5), conflict (e.g., genetic distinctness but no morphological difference) means rejection unless diagnosability is met in ecology or another system.

  **Running the Cases:**

  1.  **Cryptic Frogs (Sympatry, No Morphology):** Steps 1 & 2 apply. Sympatry exists (overlap). Evidence shows no interbreeding (distinct calls, no hybrids). **Stop. Species recognized (BSC).** Morphological identity is irrelevant; BSC is satisfied. (This fixes a flaw in your draft rule which would have required a diagnosable character).

  2.  **Salamander Ring Species:** Steps 1 & 2 apply to the terminal forms where they meet sympatrically. They do not interbreed there. **Stop. Recognize terminal forms as distinct species (BSC).** **Procedure Note:** The ring structure itself is fascinating context for explaining *how* this arose, but the BSC test at the point of sympatry is definitive for species status of the endpoints. Adjacent populations interbreeding doesn't negate the reproductive isolation at the terminus.

  3.  **Asexual Snail:** Step 4 applies (asexual). Step 5: Genetically and ecologically distinct. Assuming genetic distinctness shows monophyly/clustering and ecological distinctness is diagnosable (e.g., specific host plant, habitat), **Stop. Species recognized (Asexual Unit/PSC).** **The Answer You Might Not Like:** What if this asexual lineage is morphologically identical and its "genetic distinctness" is messy – perhaps it's a hybrid swarm derived from two sexual species and doesn't form a clean monophyletic group? Step 5 requires *both* robust monophyly *and* diagnosability. If the genetics are messy (no clear monophyly, just high diversity or hybrid signatures) *even if* ecology is distinct, the proposal **fails Step 5 and is rejected.** The procedure cannot recognize it as a species, despite its ecological uniqueness, because it lacks the required discrete evolutionary unit definition (monophyly) *and* the diagnosability threshold isn't solely met by ecology in this step (unless ecology is the diagnosable character). This highlights a limitation: the procedure prioritizes discrete units defined by phylogeny/clustering for asexuals, which hybrid-derived asexual complexes often violate. Only your policy judgment (if elevated via another path, which this isn't) could override this.

  **Where the Procedure Fails (and Tells You):**

  *   **Asexual Hybrid Complexes:** As above – messy origins violating monophyly lead to rejection despite distinctness.
  *   **Recent Divergence / Incomplete Lineage Sorting:** In sympatry (Step 2), if gene flow is high *now*, it rejects the split, even if divergence is underway. In allopatry (Step 6), deep divergence is required; recent splits likely fail C and get rejected or require your value call.
  *   **Hybrid Zones:** Broad, stable zones with significant introgression will likely fail Step 2 (evidence against strong isolation) and Step 3 (if monophyly is eroded by introgression). The procedure will tend to reject splits in such cases, treating them as subspecies or hybridizing populations, not species. Whether this aligns with management needs is a policy question.
  *   **Arbitrary Thresholds:** The procedure explicitly flags them: "robust" monophyly, "significant" gene flow, "strong" evidence, "deep" divergence. It doesn't define these because they *are* context-dependent judgments or rely on unjustified cutoffs. The procedure forces curators to *state* that a threshold was applied (e.g., "recognized based on monophyly [bootstrap >90%] and diagnosable call") and for Step 6, pushes the judgment to you.

  **Interoperability with Global Checklist:**

  When your decision conflicts (likely you split more finely due to BSC emphasis or asexual unit management), record the species as usual *in your database*. In the taxonomic notes/remarks field, state: "Recognized here as distinct species based on [cite specific procedure step and evidence, e.g., 'reproductive isolation in sympatry (BSC)' or 'monophyletic asexual lineage with diagnostic ecology']. This represents a narrower species concept than applied in [Global List Name], where this taxon is synonymized under [Global List Species Name]." Do *not* frame it as "We are correct, they are wrong." Frame it honestly: "Our conservation regulatory framework requires operational delimitation based on [mention key concepts used, e.g., reproductive isolation, diagnosable units for asexuals], leading to recognition at this level. Refer to the global list for a broader taxonomic perspective." This documents the conflict transparently, justifies your decision based on *your* mandated criteria, and acknowledges the conceptual difference without hierarchy.

  This procedure provides a clear audit trail, handles common conflicts explicitly, elevates true value judgments, and is runnable by curators with biological training but no philosophy background. It replaces your draft rule by embedding its logic only where appropriate (asexuals, fallback for ambiguous sympatry) and prioritizes the testable BSC where possible.
