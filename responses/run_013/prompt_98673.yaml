prompt: |-
  I'm a marine neurobiologist, and last fall I got roped onto our university's animal care and use committee (the IACUC) because they wanted someone who'd actually held a crab and knows what its nervous system looks like. That was fine until this month, when the protocol that landed in my queue turned out to be my own postdoc's. She wants to test whether shore crabs show motivational trade-offs — whether a crab will put up with a brief noxious stimulus (a mild shock to one leg) to get into a preferred shelter, and whether having been shocked before changes how it trades the two off. It's a clean design and honestly I'd have waved it through five years ago. But our committee has been arguing for a year now about whether decapods belong on the vertebrate track — analgesia, humane endpoints, enrichment, the whole apparatus — or the minimal-protections track we use for insects and other things we've quietly decided probably don't have experiences.

  The committee is split down the middle. One side runs the no-brain-no-pain line: a crab has no cortex or anything we'd recognize as functionally analogous, so there's nociception without any suffering, and we're wasting everyone's time and money pretending otherwise. The other side says the behavioural evidence — centralized processing, opiate receptors, motivational trade-offs, guarding an injured limb — has piled up enough that the burden of proof has flipped, and anyway we can't verify it either way, so we should act under uncertainty instead of pretending the question is settled. For the last few years we've been scoring protocols against a home-made checklist (centralized brain, nociceptors, opioid receptors, trade-off behaviour, self-protection after injury, whether the animal will work for relief) and no one can agree weather that's a test of sentience or just a list of things that happen to correlate with it. Someone on the subcommittee keeps saying we should be assigning credences across competing theories of consciousness and picking whatever action is least bad across them, which sounds right to me but also sounds like a machine for never having to say no to anybody.

  Can you draft the short written opinion I'll circulate before Thursday's meeting? It should recommend a concrete course — approve, approve with conditions, or send it back for revision — with a time frame and the specific conditions spelled out (dosing, trial caps, endpoints, whatever you think is actually needed), and it should engage the no-brain-no-pain position on its own terms rather than just intoning the precautionary principle at it. I also need a paragraph on whether I should recuse myself, since it's my own lab's protocol and I genuinely don't know where the line is. Aim for something one to two pages, in the register of an actual committee document rather than an essay — my colleagues have to vote on this.
reasoning: |-
  Okay, the user is a marine neurobiologist serving on their university's IACUC committee. They're dealing with a tricky ethical review of their own postdoc's crab experiment. The core dilemma is whether decapods like shore crabs should be treated under vertebrate-level protections (analgesia, humane endpoints) or minimal invertebrate protocols. The committee is split between "no-brain-no-pain" adherents and those advocating precaution based on behavioral evidence.

  Hmm, this is fascinatingly complex. The user needs both a concrete recommendation for this specific protocol and guidance on their potential conflict of interest. They've also hinted at deeper frustrations with the committee's vague decision-making framework - that homemade checklist feels scientifically shaky, and the "assigning credences" approach seems paralyzing. 

  First, let's unpack the science: The "no-brain-no-pain" position hinges on cortical homologs, but crustacean nociception research has advanced significantly since that framework was established. Studies showing opioid modulation, complex avoidance learning, and trade-off behaviors in crabs (like Elwood's work) do challenge simplistic neuroanatomical dismissal. Yet the absence of a cortex equivalent remains objectively true - this isn't denialism but a legit epistemological tension.

  For the protocol itself, the postdoc's design seems methodologically sound. Testing motivational trade-offs with a mild shock is reasonable if we accept crabs might experience discomfort. The key is calibrating protections proportionally: not full vertebrate protocols (which would require impractical analgesics), but more than insect-level neglect. 

  On recusal: Since the user designed neither the experiment nor the guidelines in question, and the debate is about categorical policies not personal bias, they're probably clean to participate. But transparency is crucial - they must explicitly state their relationship and not dominate discussion.

  The deeper need here is actually institutional: Their committee desperately needs coherent decapod guidelines instead of case-by-case debates. That homemade checklist conflates sentience indicators with mere nociception correlates. A better framework would tier protections by evidence of valenced experience (trade-offs > reflexes), admit epistemic uncertainty, and mandate harm minimization where evidence is equivocal.

  For the opinion draft, I'll: 
  - Approve with modified conditions (dose validation, trial caps, strict endpoints) 
  - Ground this in current neuroethology literature without overclaiming 
  - Explicitly reject both "no-brain-no-pain" absolutism and paralyzing precaution 
  - Flag the need for formal decapod policy reform 
  - Provide clear recusal guidance with procedural safeguards

  The tone must stay committee-functional: decisive but not dogmatic, citing institutional precedent where possible. And absolutely no philosophical digressions - these academics will pounce on those.
answer: |-
  ## INTERIM OPINION: Protocol #2024-017 ("Motivational Trade-offs in *Carcinus maenas*")
  **Committee Member:** Dr. [Your Name], Marine Neurobiology  
  **Date:** [Current Date]  
  **Circulation:** IACUC Voting Members  
  **Subject:** Recommendation for Approval with Conditions & Recusal Statement  

  ---

  ### I. RECOMMENDATION  
  **Approve with Modifications** (Conditional Approval), contingent on implementation of specified harm-mitigation measures. Revisions must be submitted within 10 working days for Chair sign-off. *Not approved as submitted.*  

  ### II. SPECIFIC CONDITIONS & TIMEFRAME  
  1.  **Stimulus Intensity Validation:**  
      *   Protocol must add dose-response pilot (n=5 crabs, not used in main trials) to establish the *minimum* electrical stimulus (≤5V) required to elicit consistent leg retraction. This stimulus becomes the cap for all trials.  
      *   Submit pilot data with revised protocol.  
  2.  **Individual Trial Caps:**  
      *   No crab may receive >3 stimulus exposures *total* across all experimental phases (habituation, preference testing, post-shock trade-off).  
  3.  **Humane Endpoints (Mandatory & Immediate):**  
      *   Immediate removal from study upon: (a) Failure to right itself within 30 seconds post-handling; (b) Autotomy (limb loss) *related to handling/stimulus*; (c) Observed avoidance of *all* shelters for >1 hour post-stimulus in any phase; (d) Significant loss of mobility (unable to walk ≥5 body lengths).  
  4.  **Post-Trial Holding & Monitoring:**  
      *   All crabs used in shock trials held in individual, enriched compartments (gravel substrate, PVC shelter fragment) for 24h post-final exposure.  
      *   Monitor for autotomy, feeding refusal (offer mussel fragment), and spontaneous locomotion at 1h, 6h, and 24h. Record and report any adverse events in final study report.  
  5.  **Exclusion of Gravid Females:**  
      *   Explicitly add visual screening to exclude gravid females during collection.  

  ### III. ENGAGING THE "NO-BRAIN-NO-PAIN" POSITION  
  The core neuroanatomical argument – that decapods lack structures homologous to vertebrate cortical regions essential for mammalian affective pain – is valid *as far as it goes*. However, this position relies on two assumptions requiring scrutiny:  
  1.  **Homology as Necessity:** It presumes that only a vertebrate cortical homolog can generate negative affective states. Neuroethological evidence suggests distributed networks (e.g., arthropod central complex, stomatogastric system modulating behavior post-injury) can mediate complex, state-dependent decision-making, even absent homologous structures. The proposed protocol *tests for precisely such a state-dependent trade-off*.  
  2.  **Burden of Proof:** Declaring the absence of suffering based solely on absent homology requires proving a negative – an impossibility. The precautionary principle arises not from confirmed sentience, but from the *demonstrated failure* of the "nociceptors-only" model to explain behaviors like long-term limb guarding, opioid-mediated analgesia effects, and context-dependent trade-offs (as in this protocol). While not definitive proof of suffering, these behaviors are *consistent* with a valenced experience, creating epistemic uncertainty. Denying *any* protections requires certainty we lack. Our current checklist, while imperfect, identifies correlates where this uncertainty is highest.  

  **Therefore:** Conditional approval balances the *plausibility* of minimal experience (warranting mitigation) against the *absence* of evidence demanding vertebrate-level analgesia (impractical/untestable in crabs). The mandated endpoints and caps directly address potential harm implied by the trade-off behavior under study, without requiring unsupported assumptions about crab phenomenology.  

  ### IV. RECUSAL STATEMENT  
  I recommend **I do NOT recuse myself** from the final vote, but with critical transparency and limitations:  
  *   **Disclosure:** I have formally disclosed my relationship with the Principal Investigator (my postdoc) and the lab involved. The protocol was assigned for review per standard IACUC procedure before this relationship was noted.  
  *   **Nature of Conflict:** The conflict is primarily one of affiliation, not direct intellectual/financial stake in *this specific protocol's outcome*. I did not design the experiment. The core debate (decapod protections) is a *committee policy matter* exceeding this single protocol.  
  *   **Mitigation:** I will absent myself from: 1) Any discussion or vote *specifically* concerning the adequacy of the lab's husbandry or PI training (delegated to [Chair/Designee]); 2) Advocating for the *scientific merit* of the protocol beyond confirming methodological soundness for welfare review.  
  *   **Focus on Policy:** My input is valuable primarily on the *general welfare assessment framework for decapods* applied here. Abstaining would deprive the committee of relevant neurobiological expertise on the core policy question currently paralyzing us.  
  *   **Committee Decision:** I defer to the committee's judgment on my participation. If members express significant concern, I will recuse from the vote on this protocol.  

  ### V. CONCLUSION  
  This protocol investigates a scientifically valid question with potential welfare implications. The "no-brain-no-pain" position, while neuroanatomically grounded, does not fully resolve the behavioral evidence or the inherent uncertainty. Approval with the stipulated conditions provides essential safeguards proportionate to the plausible level of risk based on current evidence (motivational trade-offs), avoids impractical vertebrate-level requirements, and allows the science to proceed. This case underscores the urgent need for this committee to establish clear, evidence-based *decapod-specific guidelines* moving beyond ad hoc checklists or vertebrate/invertebrate binaries.  

  **Recommendation:** **Approve with Modifications** (as specified in Section II).  
  **Recusal:** **Participate with disclosed limitations** (Section IV), pending committee concurrence.  

