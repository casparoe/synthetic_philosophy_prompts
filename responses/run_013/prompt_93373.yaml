answer: |-
  ### Thought Experiment: The Sparse Oasis vs. The Dense Grove  
  **Setup:**  
  Imagine a future where we must choose between two populations for a resource-limited colony. Option A creates a **dense grove**: 100 people each at welfare level 8.1 (on a scale where 0 is neutral, 10 is maximal). Option B creates a **sparse oasis**: 10 people each at welfare 9.0. All lives are well above neutrality (worth living), and neither population is a subset of the other.  

  **Key Parameters for Band View:**  
  - Lower threshold \( L = 5 \) (fixed).  
  - Upper threshold \( U = 8 \) (baseline).  
  - *Fragility test*: Nudge \( U \) to 8.1.  

  ---

  ### Verdicts and Arithmetic  
  1. **Total Utilitarianism (TU)**  
     - A: \( 100 \times 8.1 = 810 \)  
     - B: \( 10 \times 9.0 = 90 \)  
     **Verdict:** A > B (higher total welfare).  

  2. **Average Utilitarianism (AU)**  
     - A: \( \frac{810}{100} = 8.1 \)  
     - B: \( \frac{90}{10} = 9.0 \)  
     **Verdict:** B > A (higher average welfare).  

  3. **Band View (Baseline \( U = 8 \))**  
     - A: Lives at 8.1 (> U) → Contribution per life: \( 8.1 - 8 = 0.1 \) → Total: \( 100 \times 0.1 = 10 \)  
     - B: Lives at 9.0 (> U) → Contribution per life: \( 9.0 - 8 = 1.0 \) → Total: \( 10 \times 1.0 = 10 \)  
     **Verdict:** A = B (tie).  
     - *But we need A > B!* Tighten A: Shift to **99 people at 8.11** (TU: \( 99 \times 8.11 = 802.89 \)).  
       - Band (U=8): \( 99 \times (8.11 - 8) = 99 \times 0.11 = 10.89 \)  
       - B: Still \( 10 \times 1.0 = 10 \) → **A > B** (TU still prefers A: 802.89 > 90).  

  4. **Band View Fragility (Nudge \( U \) to 8.1)**  
     - A (99 at 8.11): Now 8.11 < U? No, but if \( U = 8.1 \), lives at 8.11 (> U) → Contribution: \( 8.11 - 8.1 = 0.01 \) → Total: \( 99 \times 0.01 = 0.99 \)  
     - B: Lives at 9.0 (> U) → \( 9.0 - 8.1 = 0.9 \) → Total: \( 10 \times 0.9 = 9 \)  
     **Verdict:** B > A (0.99 < 9).  
     TU and AU unchanged.  

  ---

  ### The Crucial Feature  
  **What’s doing the work:** The *proximity of A’s welfare to U* in the band view. A’s lives are just above the baseline U=8, so their contribution is small but positive (0.11 per life). B’s lives are further above U, contributing more per life (1.0) but with fewer people. TU ignores thresholds, seeing only A’s greater sum. AU ignores population size, seeing only B’s higher average.  

  **Tweak it?** If all lives in A are raised to 8.5 (still < B’s 9.0):  
  - TU still prefers A (850 > 90).  
  - AU still prefers B (8.5 < 9.0).  
  - **Band view (U=8)**: A contributes \( 100 \times (8.5 - 8) = 50 \), B contributes \( 10 \times (9 - 8) = 10 \) → A > B.  
  - **Fragility lost**: Even if U nudges to 8.1, A’s contribution per life (0.4) still dominates B’s (0.9 per life × 10 = 9) since \( 100 \times 0.4 = 40 > 9 \). The delicate balance relies on A’s welfare being *just barely* above U.  

  ---

  ### Attacks and Counterattacks  
  - **Total Utilitarian’s attack**: "A’s ‘welfare level 8.1’ is arbitrary! If welfare isn’t linear (e.g., diminishing returns), A’s total might be overvalued."  
    - *Defense*: If we reject cardinal interpersonal comparisons, *all* these views collapse—but the case assumes measurable welfare.  

  - **Band View Defender’s attack**: "Why set U=8? If U=9, B contributes nothing (9 - 9 = 0), A contributes negative (8.11 < 9 → 0), so neither wins. Your case exploits an arbitrary U!"  
    - *Rebuttal*: U *must* be contextually set (e.g., "flourishing" threshold). The fragility shows the band view’s sensitivity to U—not arbitrariness, but a feature to test in seminar.  

  ### What Could Change My Mind  
  **The welfare metric.** If "level 8.1" represents a meaningfully *different quality of life* than 9.0 (e.g., barely flourishing vs. thriving), the band view’s threshold might be defensible. But if the difference is trivial (e.g., 8.1 vs. 8.11 is imperceptible), TU’s verdict looks stubborn, and AU’s dismissal of population size seems dogmatic. **Where reasoning might fail:** Assuming welfare is perfectly additive. If A’s density causes externalities (e.g., congestion reducing welfare), TU could flip to B.  

  ---  
  **Teaching Note:** This forces students to confront *why* thresholds matter (band view), aggregation methods (TU vs. AU), and value realism. No "right" answer—just friction between principles. Use whiteboards for the arithmetic!
