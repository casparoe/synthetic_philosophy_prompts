  I am a high school student putting together a research proposal for a summer seminar in philosophy, and I would like help turning a half-formed idea into a two-page prospectus. The idea concerns Molyneux's problem — whether a person blind from birth who later gains sight could recognize by vision alone a sphere and a cube that they had previously known only by touch. I do not want to re-argue the classical case, which I understand has been worked over extensively. Instead I want to change the modality that does the pre-sight work: suppose the person had never handled the objects directly, but had spent years identifying and navigating them by echolocation, clicking the tongue and reading the returning sound. My question is whether what echolocation delivers counts as the kind of shape experience Molyneux's question presupposes, and what such a person would be able to do on first seeing. Please write the proposal: state the question so that it has a determinate answer, explain why the usual treatments of Molyneux's problem leave this variant open, describe the method I would use and why it beats simply trading intuitions about the case, say what a result would look like and what would count as failure, and keep the scope realistic for a single summer. I will add the citations myself, so please refer to positions and arguments rather than to particular sources.
