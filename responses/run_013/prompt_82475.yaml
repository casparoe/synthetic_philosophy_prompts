prompt: |-
  Ok so I'm building up a picture of the whole dispositions/finks/masks business and I keep making up my own test cases, and I want a second opinion on how nasty they actually are. The target is the old flat-footed conditonal analysis — a thing is disposed to do M when C just in case it would do M if C happened. I know that's dead, but I want to know *how* dead, and by which cases.

  Rank these five by how much trouble they make for it, 1 = does the most damage, 5 = least, no ties:

  1. The tile that only breaks on the second hit. A ceramic tile; hit it once and nothing happens, hit it again and it shatters. The first hit rearranges the microcracks so the second one does it. Nothing special about being hit twice in a row except this internal change.
  2. The glass in the resin. Ordinary brittle glass, but it's bonded into a clear resin block, and the composite takes any blow as a whole — the glass never cracks. The resin can't be removed; there's no way to strike the glass alone.
  3. The self-sealing solvent. A solid that dissolves in water, but the first instant of dissolution releases something that coats the surface and stops the reaction. So it does start to dissolve, then stops itself.
  4. The well-timed coating. A brittle glass with a coating that goes stiff exactly during an impact and relaxes after. At every moment when you're not hitting it, you can measure the glass's brittleness and it's there; at every moment when it's being hit, the coating stops the crack.
  5. The brute breaker. Something with no relevant microstructure at all — nothing about how it's built makes it fragile — but it shatters every time it's struck, and would shatter in any world you like. It just does.

  For each one, after the ranking: tell me if it's a fink, a mask, a mimic, or if it needs a new category, and in a sentence what the conditionals actually come out as (true, false, or indeterminate). Then the part I really want: which one of the standard patches — ceteris paribus clause, demanding that the disposition be part of the causal explanation of the manifestation, restricting dispositions to intrinsic properties, an explicit no-interferers clause — saves you from the most of these, and is there any case on the list that kills all four at once? If yes, say which and why; if no, say which case came closest and what extra machinery it would need.

  Don't bother with who said what, I'm not citing any of this and I don't want a reading list — I just want to know where the pressure is.
