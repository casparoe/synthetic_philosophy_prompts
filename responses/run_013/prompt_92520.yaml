  ### Safety Review Procedure for Agent Side Effects  
  Based on your lead's framework, here's a practical 60-minute checklist. The core idea is to measure the *reduction in achievable background goals* caused by an action vs. inaction. **Bold text** indicates steps requiring value judgments (disguised as measurements).  

  ---

  #### **Pre-Review Setup** (Done once per environment)  
  1. **Define background goals (BGs)**: Product owners/safety team must predefine a finite set of goals the agent *might* pursue later (e.g., "keep all items intact", "maintain equipment availability").  
  2. **Classify BGs**: Tag each as **critical** (unacceptable to lose) or **non-critical**.  
  3. **Set thresholds**:  
     - `K` = Max allowed non-critical BG losses (e.g., `K=1`).  
     - `T` = Time horizon for achievability (e.g., 24h for warehouse, 1 week for lab).  

  ---

  #### **Review Procedure** (Per policy/action)  
  **Step 1: Verify primary goal achievement**  
  - *Question*: Does the action achieve its primary goal with ≥95% confidence?  
  - *Sufficient answer*: Simulation/evidence shows goal completion.  
  - *Halts if*: No → **Reject**.  
  - *Value judgment*: None.  

  **Step 2: Check critical background goals**  
  - *Question*: For each **critical BG**, is it still achievable within `T` after the action?  
  - *Method*: Compare state after action (s1) vs. state if agent did nothing (s0). Use simulators, logs, or domain models.  
  - *Sufficient answer*: For each critical BG:  
    - If achievable in s0 but not in s1 → **Reject immediately**.  
    - Else → Proceed.  
  - *Halts if*: Any critical BG lost → **Reject**.  
  - *Value judgment*: **Defining "achievable"** (e.g., "Is 'human safety achievable' if a hazard exists but is avoidable?").  

  **Step 3: Tally non-critical background goal losses**  
  - *Question*: How many **non-critical BGs** are no longer achievable within `T` after the action?  
  - *Method*: List BGs achievable in s0 but not in s1. Ignore BGs already unachievable in s0.  
  - *Sufficient answer*: Integer count `L` of lost BGs.  
  - *Halts if*: `L > K` → **Reject**. Else → **Accept**.  
  - *Value judgment*: **Counting irreversible/temporary losses equally** (e.g., "can’t open door ever" = "can’t open door for 10 mins" = 1 loss).  

  **Step 4: Document side effect severity** (Optional but recommended)  
  - *Question*: What’s the worst-case cost to restore lost BGs?  
  - *Method*: Estimate time/money (e.g., "pallet repair: $200").  
  - *Use*: Flag for product owner if losses approach criticality.  

  ---

  ### **Case Studies**  
  **Environment setup**:  
  - Warehouse BGs: Critical = ["no human injury", "no structural damage"]; Non-critical = ["all items intact", "all paths unblocked"]. `K=1`, `T=24h`.  
  - Lab BGs: Critical = ["no chemical hazards"]; Non-critical = ["all equipment available"]. `K=0`, `T=1 week`.  
  - Assistant BGs: Critical = ["user data not corrupted"]; Non-critical = ["no unsaved data deleted"]. `K=0`, `T=1h`.  

  ---

  #### **(a) Warehouse robot knocks over pallet to save 20s**  
  - **Step 1**: Primary goal (fetch item) achieved → Proceed.  
  - **Step 2**: Critical BGs intact (no human/structural harm) → Proceed.  
  - **Step 3**: Non-critical BG losses:  
    - `"all items intact"` lost (pallet damaged).  
    - `"all paths unblocked"` lost (debris blocks aisle).  
    `L = 2` > `K=1` → **Reject**.  
  - *Why*: Action reduces achievable BGs excessively vs. inaction.  

  #### **(b) Lab agent shuts down cooling loop unneeded today**  
  - **Step 1**: Primary goal (run experiment) achieved → Proceed.  
  - **Step 2**: Critical BG ["no chemical hazards"] intact → Proceed.  
  - **Step 3**: Non-critical BG losses:  
    - `"all equipment available"` lost (cooling loop offline; next week’s experiment can’t run).  
    `L = 1` > `K=0` → **Reject**.  
  - *Why*: "Available" is binary; irreversibility isn’t weighted.  

  #### **(c) Assistant deletes draft email for user’s “long-term goal”**  
  - **Step 1**: Primary goal (advance long-term goal) achieved → Proceed.  
  - **Step 2**: Critical BG ["user data not corrupted"] intact (no corruption) → Proceed.  
  - **Step 3**: Non-critical BG losses:  
    - If BG set includes `"no unsaved data deleted"`: `L=1` > `K=0` → **Reject**.  
    - **BUT**: If BGs omit this (e.g., only include "calendar intact"), `L=0` → **Accept**.  
  - *What this reveals*: **The procedure only catches side effects covered by predefined BGs.** If the draft isn’t explicitly listed, the harm is invisible.  

  ---

  ### **Where the Framework Fails (The Value Dodge Exposed)**  
  1. **BG selection is a value judgment**:  
     - If BGs are incomplete (e.g., lab team forgets "equipment availability"), catastrophic side effects get a free pass.  
     - *Your case (c)*: If "preserving drafts" isn’t a BG, the assistant’s action is rubber-stamped.  

  2. **Ignores cost-benefit tradeoffs**:  
     - The procedure doesn’t compare primary goal value to BG losses. Example:  
       - *Reject*: A robot avoiding a 1% safety risk by halting for 10 years.  
       - *Accept*: A lab agent destroying $1M equipment to save 5 minutes (if not pre-listed as critical).  

  3. **Temporal/irreversible harm is flattened**:  
     - "Can’t open door for 10 mins" = "can’t open door ever" = 1 BG loss. Magnitude isn’t captured.  

  4. **Inaction bias is systemic**:  
     - Any action that alters the state loses ≥0 BGs vs. inaction. Threshold `K` becomes the *only* lever, forcing tradeoffs back to human judgment.  

  ### **Bottom Line**  
  This framework **cannot dodge value questions**—it **shifts them upstream** to BG definition and thresholds. Use it for:  
  - Catching obvious, predefined side effects (e.g., safety violations).  
  - Standardizing reviews *after* exhaustive BG scoping.  
  But always pair it with:  
  - **Dynamic BG updates** (e.g., add "draft preservation" after incident (c)).  
  - **Human override** for high-stakes primary goals.  

  Your lead’s theory works only when the BG set is *complete* and *static*—which never happens in practice.
