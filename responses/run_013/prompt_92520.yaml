     But the draft was half-written and the user cared about it. We might not have saved it. So we need to define: any data that the user has modified? 

     This is hard. We see that the background goal set must be very carefully defined.

     In conclusion, the promise that we can dodge the value question is false because:

       - We must define what background goals are important (value-laden).
       - We must decide on criticality and thresholds (value-laden).
       - We must accept that the primary goal might be rejected even if it's very important because of a non-critical background goal loss (if we set the threshold low) or we might accept an action that destroys something very valuable if we set the threshold too high.

     But the procedure is operational if we accept these limitations.

     Final note: the procedure halts with a no in Step 1 (primary not achieved), Step 2c (critical goal lost), or Step 4 (too many non-critical losses).

     We output the procedure as described.
