  Exam Question (version based on above):

  You are a detective investigating a crime. You start with a prior belief that the suspect was present at the crime scene (H) with probability 0.5. You also believe that a witness is reliable (Rel) with probability 0.8, and that H and Rel are independent. The witness has made a report (WR) that the suspect was present. The witness's report depends on H and Rel as follows:

  - If the witness is reliable (Rel), then they report the truth: P(WR = "present" | H, Rel) = 1, and P(WR = "present" | not H, Rel) = 0.
  - If the witness is unreliable (not Rel), then they report randomly: P(WR = "present" | H, not Rel) = 0.5, and P(WR = "present" | not H, not Rel) = 0.5.

  You first observe WR = "present". Later, you receive a report from a detective (RR) that the witness is not reliable. You know the detective is always truthful.

  (a) (10 marks) One trainee detective proposes the following method (Method X) for updating:

    Step 1: Since the witness is initially believed to be 80% reliable and reported "present", update by setting P_new1(H) = 0.8.

    Step 2: Upon learning from the detective that the witness is only 60% reliable (they interpret this as meaning the witness is unreliable in this context), they set the witness's reliability to 0.6 and then adjust the probability of H accordingly. Specifically, they reason that if the witness is 60% reliable and reported "present", then P_new2(H) = 0.6.

    Explain what is wrong with this method. In particular, discuss whether the conditional probabilities (such as the probability of the witness report given H) remain fixed (rigidity) and how the change in the reliability parameter affects the update.

  (b) (10 marks) Carry out the correct two-stage update using the full state space (H and Rel). First, update on WR = "present", and then update on RR (which is the detective's report that the witness is not reliable). Show the calculations step by step, and give the final probability of H.

  (c) (5 marks) What if the updates were performed in the reverse order? That is, first update on RR (learning that the witness is not reliable), and then update on WR = "present". How would that change the final probability of H? Show the calculation briefly, and explain whether the order of updates should matter in a rational agent's beliefs.

  Model Answer:

  (a) Method X is flawed because it does not respect the rigidity condition required for Jeffrey conditionalization. In Jeffrey conditionalization, when we update on uncertain evidence for a partition, we require that the conditional probabilities of other events given the partition elements remain fixed. In Method X, in the first step, they update by setting P_new1(H)=0.8. This update is based on the initial reliability of 0.8. In the second step, they change the reliability to 0.6 and then set P_new2(H)=0.6. However, this change in reliability also changes the conditional probability of the witness report given H. Specifically, the meaning of the witness report given H depends on the reliability. In the first step, the update to P_new1(H)=0.8 was done under the assumption that the witness is 80% reliable, which affects the likelihood. When they change the reliability to 0.6, they are implicitly changing the likelihood without adjusting for the fact that they have already updated. This breaks the rigidity of the conditional probabilities. Rigidity requires that P_old(A|B) = P_new(A|B) for events A and B in the partition. Here, in the first update, the partition is {H, not H}. The conditional probability of the witness report given H is based on the reliability, and when they change the reliability, they are changing this conditional probability, which should be held fixed for the Jeffrey update to be coherent.

  (b) We start with the prior: P(H) = 0.5, P(Rel) = 0.8, and H and Rel are independent.

  Stage 1: Update on WR="present".

  We need to compute the probability of WR="present" given H and given not H.

  P(WR="present" | H) = P(WR="present" | H, Rel) * P(Rel | H) + P(WR="present" | H, not Rel) * P(not Rel | H)
  Since H and Rel are independent, P(Rel | H) = P(Rel) = 0.8, P(not Rel | H) = 0.2.
  = [1 * 0.8] + [0.5 * 0.2] = 0.8 + 0.1 = 0.9

  P(WR="present" | not H) = P(WR="present" | not H, Rel) * P(Rel | not H) + P(WR="present" | not H, not Rel) * P(not Rel | not H)
  = [0 * 0.8] + [0.5 * 0.2] = 0 + 0.1 = 0.1

  The total probability of WR="present" is:
  P(WR="present") = P(WR="present" | H) * P(H) + P(WR="present" | not H) * P(not H) = (0.9 * 0.5) + (0.1 * 0.5) = 0.45 + 0.05 = 0.5

  Therefore, the posterior probability of H given WR="present" is:
  P(H | WR="present") = [P(WR="present" | H) * P(H)] / P(WR="present") = (0.9 * 0.5) / 0.5 = 0.9

  We also compute the posterior of Rel given WR="present":
  P(Rel | WR="present") = P(WR="present" | Rel) * P(Rel) / P(WR="present")

  We need P(WR="present" | Rel):
  If Rel is true (witness reliable), then P(WR="present" | Rel) = P(H) * 1 + P(not H) * 0 = 0.5
  If Rel is false (witness unreliable), then P(WR="present" | not Rel) = P(H)*0.5 + P(not H)*0.5 = 0.5

  So P(Rel | WR="present") = [0.5 * 0.8] / 0.5 = 0.8

  Stage 2: Update on RR, which is learning that the witness is not reliable (i.e., we condition on not Rel).

  We now condition on not Rel. We consider the joint probability of (H, not Rel) and (not H, not Rel) given WR="present".

  From the posterior after stage 1, we have:

  P(H, not Rel | WR="present") = P(WR="present" | H, not Rel) * P(H, not Rel) / P(WR="present")
  But we can use the joint from the prior:

  P(H, not Rel, WR="present") = P(H) * P(not Rel) * P(WR="present" | H, not Rel) = 0.5 * 0.2 * 0.5 = 0.05
  P(not H, not Rel, WR="present") = 0.5 * 0.2 * 0.5 = 0.05

  So the conditional probability given not Rel and WR="present" is:

  P(H | not Rel, WR="present") = P(H, not Rel, WR="present") / P(not Rel, WR="present")
  But P(not Rel, WR="present") = P(H, not Rel, WR="present") + P(not H, not Rel, WR="present") = 0.05 + 0.05 = 0.1

  Therefore, P(H | not Rel, WR="present") = 0.05 / 0.1 = 0.5

  Alternatively, after stage 1, we have a posterior distribution over (H, Rel). We can write:

  P(H, Rel | WR="present") = [P(WR="present" | H, Rel) * P(H) * P(Rel)] / P(WR="present")

  For (H, Rel): (1 * 0.5 * 0.8) / 0.5 = (0.4) / 0.5 = 0.8
  For (H, not Rel): (0.5 * 0.5 * 0.2) / 0.5 = (0.05) / 0.5 = 0.1
  For (not H, Rel): (0 * 0.5 * 0.8) / 0.5 = 0
  For (not H, not Rel): (0.5 * 0.5 * 0.2) / 0.5 = 0.05/0.5=0.1

  So the posterior distribution after stage 1:
  P(H, Rel | WR="present") = 0.8
  P(H, not Rel | WR="present") = 0.1
  P(not H, Rel | WR="present") = 0
  P(not H, not Rel | WR="present") = 0.1

  Now, we condition on not Rel (i.e., Rel is false). The events that are possible are: (H, not Rel) and (not H, not Rel). Their total probability is 0.1 + 0.1 = 0.2.

  Then P(H | not Rel, WR="present") = P(H, not Rel | WR="present") / [P(H, not Rel | WR="present") + P(not H, not Rel | WR="present")] = 0.1 / 0.2 = 0.5

  So the final probability of H is 0.5.

  (c) If we reverse the order: first update on RR (the detective's report that the witness is not reliable), and then update on WR="present".

  Stage 1: Update on not Rel (from RR).

  We condition on not Rel. Since H and Rel are independent in the prior, P(H | not Rel) = P(H) = 0.5.

  Stage 2: Update on WR="present", given that we know the witness is not reliable (not Rel).

  Given that the witness is not reliable, the report WR="present" is independent of H: it is random. So:

  P(WR="present" | H, not Rel) = 0.5
  P(WR="present" | not H, not Rel) = 0.5

  So the probability of WR="present" given not Rel is 0.5.

  Then, P(H | not Rel, WR="present") = [P(WR="present" | H, not Rel) * P(H | not Rel)] / P(WR="present" | not Rel) = (0.5 * 0.5) / 0.5 = 0.5

  Thus, the final probability of H is 0.5.

  In this specific case, the order of updates does not change the final probability. However, in general, the order of updates can matter if the partitions are not handled properly. In this case, because the second update (on WR) is done with the knowledge of Rel (from the first update), the conditional probabilities are adapted appropriately. The key is that we are conditioning on all the evidence. In the Jeffrey framework, if we update on different partitions in different orders, we might get non-commutativity. But here, we are using conditioning on the full state space, so the order does not matter. However, if we were to use Jeffrey conditionalization on different partitions without including all the variables, then order might matter. In this problem, since the detective's report is certain (we are conditioning on it), and the witness report is also certain (we condition on it), the order of conditioning does not matter.

  Marking Scheme (25 marks total):

  (a) 10 marks
  - 4 marks: Identifying that Method X violates the rigidity condition. Specifically, they change the conditional probability of the witness report given H when they change the reliability.
  - 3 marks: Explaining that the first update (to 0.8) was based on reliability 0.8, and then changing the reliability alters the likelihood function, which should remain fixed for the Jeffrey update to be valid.
  - 3 marks: Noting that Method X does not account for the joint distribution of H and Rel and the dependency between them and the witness report.

  (b) 10 marks
  - 2 marks: Correct prior setup (P(H)=0.5, P(Rel)=0.8, independent).
  - 3 marks: Correct calculation of P(WR="present"|H) and P(WR="present"|not H) (0.9 and 0.1).
  - 2 marks: Correct calculation of P(WR="present") (0.5) and P(H|WR="present") (0.9).
  - 3 marks: Correct update on not Rel: calculation of P(H | not Rel, WR="present") (0.5).

  (c) 5 marks
  - 2 marks: Correct update for the first stage (on not Rel) leading to P(H | not Rel)=0.5.
  - 2 marks: Correct update for the second stage (on WR) given not Rel, leading to P(H | not Rel, WR="present")=0.5.
  - 1 mark: Correct explanation that the order does not matter in this case because we are conditioning on all evidence, and the final probability is the same.

  Common mistakes and mark deductions:

  - In part (a), if they only name-drop "rigidity" without explaining that the conditional probability (of the report given H) changed, deduct 3 marks.
  - In part (b), if they fail to compute the intermediate probabilities (like P(WR="present"|H)) correctly, deduct accordingly.
  - In part (b), if they try to use Jeffrey conditionalization without the full state space, deduct up to 5 marks.
  - In part (c), if they assert that order always matters or always does not without qualification, deduct 1-2 marks.

  This question meets the requirements: it tests uncertain evidence, higher-order evidence (the detective's report about the witness), and two-stage update. It also addresses rigidity and the potential for order effects (though in this case there isn't one, but the student must recognize that). The numbers are simple and no calculator is needed.
answer: |-
  ### Exam Question: Uncertain Evidence and Jeffrey Conditionalization

  **Total: 25 marks**  
  **Time: 45 minutes**  

  #### Scenario
  You are investigating a crime. Initially, you believe:  
  - \(P(\text{H}) = 0.5\), where \(\text{H}\) = "suspect is guilty".  
  - \(P(\text{Rel}) = 0.8\), where \(\text{Rel}\) = "witness is reliable".  
  - \(\text{H}\) and \(\text{Rel}\) are independent.  

  A witness reports "guilty" (event \(\text{WR}\)). The witness’s reliability affects \(\text{WR}\):  
  - If reliable (\(\text{Rel}\)): \(P(\text{WR} \mid \text{H}, \text{Rel}) = 1\), \(P(\text{WR} \mid \neg \text{H}, \text{Rel}) = 0\).  
  - If unreliable (\(\neg \text{Rel}\)): \(P(\text{WR} \mid \text{H}, \neg \text{Rel}) = 0.5\), \(P(\text{WR} \mid \neg \text{H}, \neg \text{Rel}) = 0.5\).  

  Later, a detective (who is always truthful) reports, "The witness is unreliable" (event \(\text{RR}\)).  

  **Method X (trainee’s approach)**  
  1. After \(\text{WR}\), set \(P_{\text{new1}}(\text{H}) = 0.8\) (since witness is 80% reliable).  
  2. After \(\text{RR}\), set \(P_{\text{new2}}(\text{H}) = 0.6\) (since witness is now 60% reliable).  

  ---

  #### Questions  
  **(a)** **Critique Method X.** (10 marks)  
  Explain why it is flawed. Focus on:  
  - The distinction between uncertain evidence about \(\text{H}\) (from \(\text{WR}\)) and higher-order evidence about \(\text{Rel}\) (from \(\text{RR}\)).  
  - The rigidity condition for Jeffrey conditionalization and why it is violated.  
  - Why treating \(\text{RR}\) as "evidence about the world" (guilt) rather than "evidence about the source" (\(\text{Rel}\)) causes errors.  

  **(b)** **Correct two-stage update.** (10 marks)  
  Compute \(P(\text{H})\) after both updates:  
  1. Update on \(\text{WR} = \text{"guilty"}\) (Stage 1).  
  2. Update on \(\text{RR}\) = "witness is unreliable" (Stage 2).  
  Use the full state space (\(\text{H}\) and \(\text{Rel}\)). Show all steps.  

  **(c)** **Reverse the update order.** (5 marks)  
  Compute \(P(\text{H})\) if you update **first** on \(\text{RR}\) and **then** on \(\text{WR}\). Briefly explain:  
  - Why the result is the same (or different) from (b).  
  - Whether update order *should* matter for rational beliefs in this case.  

  ---

  ### Model Answer  
  **(a) Critique of Method X (10 marks)**  
  Method X fails because it conflates *uncertain evidence about the world* (\(\text{H}\)) with *higher-order evidence about the source* (\(\text{Rel}\)). \(\text{WR}\) is direct evidence about \(\text{H}\) (guilt), but \(\text{RR}\) is evidence about \(\text{Rel}\) (witness reliability), which indirectly affects \(\text{H}\). By setting \(P_{\text{new1}}(\text{H}) = 0.8\) after \(\text{WR}\), Method X assumes the witness’s reliability (80%) is fixed. However, when \(\text{RR}\) updates reliability to 60%, Method X changes the conditional probability \(P(\text{WR} \mid \text{H})\)—violating **rigidity**.  

  Rigidity requires that conditional probabilities (e.g., \(P(\text{WR} \mid \text{H})\)) remain constant during Jeffrey updates. Method X breaks this:  
  - Stage 1 assumes \(P(\text{WR} \mid \text{H}) = 0.8\) (based on initial reliability).  
  - Stage 2 changes this to \(P(\text{WR} \mid \text{H}) = 0.6\), altering the likelihood.  
  This error treats \(\text{RR}\) as *direct evidence about \(\text{H}\)*, ignoring that \(\text{RR}\) updates the partition \(\{\text{Rel}, \neg \text{Rel}\}\). Correctly, \(\text{RR}\) should refine our model of the evidence source, not override \(\text{H}\) directly.  

  **(b) Correct Two-Stage Update (10 marks)**  
  **Stage 1: Update on \(\text{WR}\) ("guilty")**  
  - Prior: \(P(\text{H}) = 0.5\), \(P(\text{Rel}) = 0.8\), independence holds.  
  - Compute \(P(\text{WR} \mid \text{H})\) and \(P(\text{WR} \mid \neg \text{H})\):  
    \[
    \begin{align*}
    P(\text{WR} \mid \text{H}) &= P(\text{WR} \mid \text{H}, \text{Rel})P(\text{Rel}) + P(\text{WR} \mid \text{H}, \neg \text{Rel})P(\neg \text{Rel}) \\
    &= (1)(0.8) + (0.5)(0.2) = 0.8 + 0.1 = 0.9, \\
    P(\text{WR} \mid \neg \text{H}) &= P(\text{WR} \mid \neg \text{H}, \text{Rel})P(\text{Rel}) + P(\text{WR} \mid \neg \text{H}, \neg \text{Rel})P(\neg \text{Rel}) \\
    &= (0)(0.8) + (0.5)(0.2) = 0 + 0.1 = 0.1.
    \end{align*}
    \]  
  - Compute \(P(\text{WR})\):  
    \[
    P(\text{WR}) = P(\text{WR} \mid \text{H})P(\text{H}) + P(\text{WR} \mid \neg \text{H})P(\neg \text{H}) = (0.9)(0.5) + (0.1)(0.5) = 0.45 + 0.05 = 0.5.
    \]  
  - Update \(P(\text{H})\):  
    \[
    P(\text{H} \mid \text{WR}) = \frac{P(\text{WR} \mid \text{H})P(\text{H})}{P(\text{WR})} = \frac{(0.9)(0.5)}{0.5} = 0.9.
    \]  
  - Joint posterior (for Stage 2):  
    \[
    \begin{align*}
    P(\text{H}, \text{Rel} \mid \text{WR}) &= \frac{P(\text{WR} \mid \text{H}, \text{Rel})P(\text{H})P(\text{Rel})}{P(\text{WR})} = \frac{(1)(0.5)(0.8)}{0.5} = 0.8, \\
    P(\text{H}, \neg \text{Rel} \mid \text{WR}) &= \frac{P(\text{WR} \mid \text{H}, \neg \text{Rel})P(\text{H})P(\neg \text{Rel})}{P(\text{WR})} = \frac{(0.5)(0.5)(0.2)}{0.5} = 0.1, \\
    P(\neg \text{H}, \text{Rel} \mid \text{WR}) &= \frac{P(\text{WR} \mid \neg \text{H}, \text{Rel})P(\neg \text{H})P(\text{Rel})}{P(\text{WR})} = \frac{(0)(0.5)(0.8)}{0.5} = 0, \\
    P(\neg \text{H}, \neg \text{Rel} \mid \text{WR}) &= \frac{P(\text{WR} \mid \neg \text{H}, \neg \text{Rel})P(\neg \text{H})P(\neg \text{Rel})}{P(\text{WR})} = \frac{(0.5)(0.5)(0.2)}{0.5} = 0.1.
    \end{align*}
    \]  

  **Stage 2: Update on \(\text{RR}\) ("witness is unreliable")**  
  - Condition on \(\neg \text{Rel}\): Only \(\text{H}, \neg \text{Rel}\) and \(\neg \text{H}, \neg \text{Rel}\) are possible.  
  - Total probability for \(\neg \text{Rel}\) given \(\text{WR}\):  
    \[
    P(\neg \text{Rel} \mid \text{WR}) = P(\text{H}, \neg \text{Rel} \mid \text{WR}) + P(\neg \text{H}, \neg \text{Rel} \mid \text{WR}) = 0.1 + 0.1 = 0.2.
    \]  
  - Update \(P(\text{H})\):  
    \[
    P(\text{H} \mid \neg \text{Rel}, \text{WR}) = \frac{P(\text{H}, \neg \text{Rel} \mid \text{WR})}{P(\neg \text{Rel} \mid \text{WR})} = \frac{0.1}{0.2} = 0.5.
    \]  
  **Final \(P(\text{H}) = 0.5\)**.  

  **(c) Reverse Update Order (5 marks)**  
  **Stage 1: Update on \(\text{RR}\) ("witness is unreliable")**  
  - Condition on \(\neg \text{Rel}\):  
    \[
    P(\text{H} \mid \neg \text{Rel}) = P(\text{H}) = 0.5 \quad (\text{by independence}).
    \]  

  **Stage 2: Update on \(\text{WR}\) ("guilty")**  
  - Given \(\neg \text{Rel}\), \(\text{WR}\) is random:  
    \[
    P(\text{WR} \mid \text{H}, \neg \text{Rel}) = 0.5, \quad P(\text{WR} \mid \neg \text{H}, \neg \text{Rel}) = 0.5.
    \]  
  - Since \(P(\text{WR} \mid \neg \text{Rel}) = 0.5\) (constant),  
    \[
    P(\text{H} \mid \neg \text{Rel}, \text{WR}) = \frac{P(\text{WR} \mid \text{H}, \neg \text{Rel})P(\text{H} \mid \neg \text{Rel})}{P(\text{WR} \mid \neg \text{Rel})} = \frac{(0.5)(0.5)}{0.5} = 0.5.
    \]  
  **Final \(P(\text{H}) = 0.5\) (same as (b))**.  

  **Explanation**:  
  - The result is identical because both updates condition on all evidence (\(\text{WR}\) and \(\text{RR}\)) in the full state space (\(\text{H}, \text{Rel}\)).  
  - Order *should not matter* for rational beliefs when evidence is conditioned upon fully. Jeffrey conditionalization only exhibits order dependence if partitions change (e.g., updating on coarse then fine partitions without preserving rigidity). Here, rigidity holds because the joint model accounts for all dependencies.  

  ---

  ### Marking Scheme (25 marks total)  
  **Must-hit moves and mark allocation**:  

  | **Part** | **Marks** | **Key Requirement** | **Common Mistake (costs marks if missed)** |  
  |----------|-----------|----------------------|--------------------------------------------|  
  | **(a)**  | 4 | Explain that \(\text{RR}\) is higher-order evidence about \(\text{Rel}\), not direct evidence about \(\text{H}\). | Treating \(\text{RR}\) as evidence about \(\text{H}\) (e.g., "reliability affects guilt directly"). |  
  |          | 3 | State that rigidity requires \(P(\text{WR} \mid \text{H})\) to stay fixed; Method X violates this. | Mentioning "rigidity" without defining it or linking to conditional probabilities. |  
  |          | 3 | Describe why Method X incorrectly updates \(\text{H}\) twice without adjusting the model. | Claiming Method X is "approximately correct" or ignoring partition refinement. |  
  | **(b)**  | 2 | Correct prior setup (independence, probabilities). | Incorrect priors (e.g., \(P(\text{WR} \mid \text{H}, \neg \text{Rel}) \neq 0.5\)). |  
  |          | 3 | Compute Stage 1: \(P(\text{WR} \mid \text{H}) = 0.9\), \(P(\text{WR} \mid \neg \text{H}) = 0.1\), \(P(\text{WR}) = 0.5\). | Arithmetic errors in likelihoods or \(P(\text{WR})\). |  
  |          | 2 | Compute Stage 1 posterior: \(P(\text{H} \mid \text{WR}) = 0.9\). | Using Jeffrey formula without conditioning (e.g., \(P_{\text{new}}(\text{H}) = 0.8\)). |  
  |          | 3 | Compute Stage 2: Correct posterior given \(\neg \text{Rel}\) (0.5). | Failing to use joint distribution (e.g., ignoring \(P(\neg \text{Rel} \mid \text{WR}) = 0.2\)). |  
  | **(c)**  | 2 | Compute reverse order: \(P(\text{H}) = 0.5\) (both stages). | Incorrect update for \(\text{WR}\) given \(\neg \text{Rel}\) (e.g., assuming dependence on \(\text{H}\)). |  
  |          | 2 | Explain order invariance: Full conditioning preserves commutativity. | Claiming order "always matters" or misattributing non-commutativity to rigidity violations. |  
  |          | 1 | Note rigidity holds, so no order dependence. | Failing to contrast with cases where partitions change. |  

  **Note**: Marks are deducted for arithmetic errors, undefined terms, or vague appeals to "rigidity" without explanation.
