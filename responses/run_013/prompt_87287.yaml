answer: |-
  Here are five points addressing your query:

  1.  **Current practice presupposes robust, cross-situational character traits.** Courts and employers act as if traits like honesty or peacefulness are stable internal dispositions that reliably manifest across diverse contexts, regardless of situational pressures (e.g., assuming past law-abidingness predicts future conduct under very different circumstances). This is the "global trait" view directly challenged by situationist experiments.

  2.  **A weaker, domain-specific view *might* suffice for practice, but current usage rarely respects this limit.** Practices *could* be justified by presupposing traits are stable only within relevant domains (e.g., "financial honesty" for embezzlement cases, "impulse control with authority" for assault). However, evidence like general "good character" references or clean records unrelated to the specific context (e.g., a speeding ticket used to infer fraud propensity) often implies broader stability than this weaker view allows.

  3.  **"Local trait" theories or "identity-based" accounts could rival the global trait view and partially license the practice.** If traits are stable only within specific, well-defined types of situations ("local traits"), or if character is defined by *aspirational identity* and *narrative commitments* rather than fixed dispositions, character evidence *might* still be relevant. However, it would require rigorously linking the evidence to the *specific situation type* in question (e.g., testimony about behavior in *high-pressure financial decisions*, not general honesty).

  4.  **If situationists are broadly correct, character evidence must shift focus to situation-specific behavioral history and predictive contexts.** Courts and employers should prioritize evidence of past behavior in situations *highly analogous* to the one being judged (e.g., past reactions under similar stress, temptation, or authority conflicts). General character references or unrelated clean records would become largely irrelevant or inadmissible.

  5.  **Procedural safeguards against irrelevant trait inferences would be essential.** Rules of evidence would need significant reform to exclude character evidence not demonstrably linked to the specific situational domain at issue (e.g., prohibiting using a spotless driving record to infer trustworthiness in fiduciary matters). Sentencing and hiring would focus more on situational risk factors and specific competencies than on global character assessments.

  **What would change my mind:** A robust meta-analysis or longitudinal study demonstrating high cross-situational consistency *specifically* for the traits (like trustworthiness, peaceableness) most often invoked in legal/professional character evidence, *especially* under varying situational pressures, would challenge the situationist critique's applicability here.  
  **Where reasoning is most likely to break down:** The most vulnerable point is the feasibility of reliably defining "relevant situational domains" (#2, #3, #4). If situations are too unique or complex to categorize meaningfully, even domain-specific traits or analogous history become poor predictors, potentially invalidating *any* character evidence use beyond extremely narrow circumstances.
