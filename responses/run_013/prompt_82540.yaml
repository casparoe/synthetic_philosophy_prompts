  ...and so on, down to the ancient scholar's pedagogical question.

  The concession strategy is crucial - they should yield that sortals don't create entities to avoid Platonic commitments, but stand firm on sortal-relativity being irreducible. 

  The nightmare question would be about causal overdetermination - if both sortals license counts of "things", wouldn't every action involve two simultaneous causes? That could force them into either denying causation or accepting bizarre metaphysics.

  I'll phrase each objection in the specialist's authentic voice:
