  Throughout, I'll avoid literature references per request, focusing on conceptual counters. The nightmare causation question gets no good answer - best to admit it's unresolved but not fatal.
answer: |-
  Here are the eight objections you're most likely to face, ordered by likelihood and damage potential, phrased in your audience's voices, with concise replies and vulnerability notes. I've flagged concessions upfront and saved the nightmare question for last.

  **First 5 Minutes Concession:**  
  *Open with:* "I concede that nothing here *explains why* certain sortals license counts in certain contexts—why 'statue' carves reality this way rather than that. That’s bedrock linguistic practice or conceptual role. My claim is just that *once* sortals are granted, constitution puzzles dissolve without adding ontological gizmos."

  ---

  ### **Objections (High to Low Threat):**
  1.  **Grounding Specialist:**  
      *Objection:* "You’re treating sortal-relative counting as primitive. But *what grounds the fact* that ‘statue’ licenses counting a portion of matter one way while ‘lump’ licenses another? If it’s not a difference in the world (structure, properties, causal powers), your view collapses into linguistic idealism."  
      *Reply:* "The grounding is in our conceptual/sortal practices interacting with the invariant matter. Sortals aren't *response-independent* features, but their application isn't arbitrary—it tracks real functional/causal profiles (e.g., ‘statue’ requires artistic intention and coherence)."  
      *Soft Spot:* Doesn’t satisfy a hardcore grounding realist. Concedes non-fundamentality.

  2.  **Worm-Theorist (4D):**  
      *Objection:* "Your ‘portion of matter’ is suspiciously atemporal. If the lump pre-exists the statue (as when I mold clay), they’re distinct *temporal parts* of a spacetime worm. Your sortal-relative count ignores temporal boundaries—the very thing that *makes* constitution problematic!"  
      *Reply:* "Temporal persistence is also sortal-relative. The *lump-of-clay-today* is the same portion as the *statue-today*. That the lump existed yesterday under a lump-sortal doesn’t entail distinctness *now*—just a different description of the same temporal stage."  
      *Soft Spot:* Implicitly endorses stage theory over worm theory. May not resolve diachronic puzzles.

  3.  **Hylomorphist:**  
      *Objection:* "You reduce ‘form’ to a mere counting convention! But the statue’s unity—its *being one thing*—isn’t just how we count; it’s a real, causal principle (e.g., the statue, not the lump, would be destroyed if shattered). Your view can’t explain this unity."  
      *Reply:* "The unity *is* real, but it’s not an *additional entity* (a ‘form’). It’s the matter’s organization *under a sortal*. Shattering destroys the organization required for ‘statue’, not ‘lump’. The causal difference is sortal-relative, not proof of an added principle."  
      *Soft Spot:* Feels like dodging the Aristotelian’s demand for an *explanans* beyond matter + description.

  4.  **Stage Theorist (4D):**  
      *Objection:* "If they’re the same portion *at t*, why can’t I say ‘The lump is Goliath’ (the statue) *simpliciter*? But I can’t—they have different modal properties (lump survives flattening, statue doesn’t). Sortals can’t mask genuine modal divergence in identical matter."  
      *Reply:* "Modal predicates are sortal-relative too. ‘Survives flattening’ is true of this portion *under ‘lump’*, false *under ‘statue’*. There’s no sortal-free fact about ‘what the portion can do’."  
      *Soft Spot:* Commits to radical modal relativism. Hard to square with intuition that the clay *itself* is malleable.

  5.  **Deflationist:**  
      *Objection:* "Bravo! But if it’s *all* verbal, why keep insisting there’s ‘one portion’? That’s just your preferred sortal (‘portion of matter’). Why isn’t ‘two distinct coincident objects’ equally valid under a different convention?"  
      *Reply:* "Because ‘portion of matter’ is the *non-sortal-involving base*—it doesn’t impose unity conditions. Counting *always* needs a sortal; the base is what sortals describe. ‘Two objects’ only works under a convention that *counts by sortal type*, not by portion."  
      *Soft Spot:* Risks circularity. Deflationist will say ‘portion’ is just another sortal.

  6.  **Philosopher of Language (Mass/Count):**  
      *Objection:* "Sortals aren’t monolithic. ‘Statue’ is a count noun, ‘clay’ is mass. Your view implies we switch frameworks (mass for portion, count for objects). But how? When I say ‘There’s clay and a statue on the pedestal’, I mix mass/count without implying *two things* in your sense."  
      *Reply:* "Exactly! Your sentence uses distinct nominal categories (mass ‘clay’, count ‘statue’) but doesn’t force a *count of entities*. To ask ‘how many *things*?’ is to demand a forced shift to a count framework, inviting ambiguity. The problem arises when we equivocate frameworks."  
      *Soft Spot:* Needs more on how mass/count interacts with sortal relativity in mixed contexts.

  7.  **Ancient Scholar (Ship of Theseus):**  
      *Objection:* "When you teach Theseus, do you say the original ship *never existed* as a distinct object? If not, how does your view handle identity over time when matter changes? Sortal-relativity seems to make persistence even *more* mysterious!"  
      *Reply:* "I say the original ship exists *as long as* the matter (under the ship-sortal) maintains functional continuity. Replacement parts alter the portion, but the sortal licenses re-identifying the ship if the change is gradual/functional. It avoids ‘gappy’ existence or mysterious trans-world identities."  
      *Soft Spot:* Functional continuity is vague. 4Dists will pounce on temporal boundaries.

  8.  **Stage Theorist (Follow-Up):**  
      *Objection:* "If ‘portion of matter’ is sortal-free, why can’t I count portions *without* a sortal? There’s one portion on the pedestal—full stop. But then ‘how many things?’ has an answer: ONE. Your view self-destructs."  
      *Reply:* "Counting *is* inherently sortal-bound. To ‘count portions’ *is* to use ‘portion’ as a sortal! The ‘base’ isn’t counted; it’s what we describe *when* we apply count-sortals. Asking for a count *without any sortal* is literally nonsensical."  
      *Soft Spot:* Requires accepting that quantification is always sortal-relative—a big ask for some.

  ---

  ### **The Nightmare Question (Hope Nobody Asks):**
  **Grounding Specialist + Hylomorphist (Tag-Team):**  
  *Question:* "If sortals don’t add entities, how do you explain *causal differences*? Suppose the lump (but not the statue) is contractually obligated to be returned. The *portion* can’t bear obligations—only objects can. Doesn’t this force you to admit the statue and lump *are* distinct intentional/causal relata after all?"  

  *Why it’s deadly:* It attacks the core claim that *only* the portion is real. Legal/moral properties seem to attach to *objects-under-sortals*, not just "matter + convention." Your view struggles to explain how the *same* portion can be two distinct nodes in causal/intentional networks without multiplying entities.  
  *Weak Reply:* "Obligations attach to the portion *as described* under a sortal. It’s the description, not the entity, that’s relevant."  
  *Vulnerability:* Sounds like linguistic evasion of real-world relational differences. Concedes a form of non-physical "addition" after all.  

  **Tactics:** If this hits, pivot hard to deflation: "This shows how deeply our practices embed sortal-relativity—but it doesn’t demand *metaphysical* distinctions." Then sweat.
