  - The hylomorphist will insist "form unifies beyond counting"

  Replies should acknowledge the valid pushback while showing how their framework absorbs it. For example, to the grounding objection: admit sortal-relativity is bedrock, but argue this stops regress. Mark it as "soft" because it doesn't satisfy reductionists.

  For the deflationist's challenge, the reply should agree the debate is verbal but insist it's substantive verbalism - that's a nuanced position needing careful handling.

