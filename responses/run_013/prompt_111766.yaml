     - But note: the city is paying for water and insurance, so there is an externality on the city budget. However, the question is about the group's provision effort. The group's maintenance is done by the users, so low provision externality for the group. But the city's provision (water, insurance) is a separate issue. We are at step 2: we answered low, so we go to step 5.
  3. **Appropriation Externality** (step 5): 
