  ### Case Evaluations  
  #### Case 1: Community Garden Proposal  
  **Resource Diagnosis**:  
  - **Subtractability**: High (harvesting removes units).  
  - **Congestion**: Low (degradation secondary to unit removal).  
  - **Provision Externality**: Low (gardeners maintain; costs align with benefits).  
  - **Appropriation Externality**: High (overharvesting depletes shared plots).  
  - **Aggregation Technology**: Summation (maintenance effort is additive).  
  - **Nestedness**: Neighborhood (serves local residents).  

  **Recommendation**: **Approve as a club good** (locked gate/waitlist internalizes externalities).  
  **Confidence**: 0.95 (fits theory perfectly).  
  **Would Change If**: Evidence that gardeners exclude vulnerable groups (e.g., unhoused residents), escalating to city council for equity review.  
  **Asker May Dislike**: No (supports current proposal).  

  #### Case 2: Open Data Portal  
  **Resource Diagnosis**:  
  - **Subtractability**: None (data is non-rivalrous).  
  - **Congestion**: Low (portal access is scalable).  
  - **Provision Externality**: High (departments bear costs; public free-rides).  
  - **Appropriation Externality**: None (use doesn’t harm).  
  - **Aggregation Technology**: Weakest link (one non-participating department cripples value).  
  - **Nestedness**: City-wide.  

  **Recommendation**: **Reject voluntary model. Impose regulation** (mandate dataset sharing).  
  **Confidence**: 0.85 (weakest-link + high externality = guaranteed failure without mandate).  
  **Would Change If**: Proof departments gain sufficient internal benefits to participate voluntarily (e.g., user feedback improves their operations).  
  **Asker May Dislike**: **YES** (conflicts with "no mandate" constraint; forces hard choice).  

  #### Case 3: Plaza Entry Fee  
  **Resource Diagnosis**:  
  - **Subtractability**: None (presence doesn’t remove units).  
  - **Congestion**: High (overcrowding degrades experience).  
  - **Provision Externality**: High (users free-ride without paying maintenance).  
  - **Appropriation Externality**: None (use doesn’t harm).  
  - **Aggregation Technology**: Summation (fee revenue covers costs).  
  - **Nestedness**: City-wide.  

  **Recommendation**: **Approve fee** (manages congestion/free-riding).  
  **Confidence**: 0.75 (fee is efficient but may misfire if equity ignored).  
  **Would Change If**: Data shows fee excludes >20% of current users (e.g., unhoused), requiring council equity review.  
  **Asker May Dislike**: No (mayor supports fee; aligns with theory).  

