prompt: |-
  I am the staff economist for the Office of Shared Assets in a mid-sized city. Our office reviews proposals for managing resources that multiple city departments, neighborhoods, or private partners share: community gardens, municipal broadband, a shared vehicle fleet, public datasets, cooling centers, and the like. We see roughly thirty such proposals a year, and the stakes run from a few thousand dollars in annual maintenance to multi-million-dollar capital commitments. The decisions are made in a two-hour meeting by program officers who have no formal training in game theory, public finance, or institutional economics. I need a reusable procedure they can run on a proposal, with a one-page worksheet, grounded in the theory of common-pool resources and public goods rather than in whatever analogy happens to be in the room.

  The procedure should use four diagnostic axes that I have found more useful than the standard two-by-two of excludability and rivalry. First, subtractability of units versus congestion of the flow: does one person's use remove a unit from others, or does it mainly degrade the quality of the experience for others even if no unit is removed? Second, provision externalities versus appropriation externalities: who bears the costs or benefits of creating and maintaining the resource, and who bears the costs or benefits that one user's taking imposes on others? Third, aggregation technology: whether the good is produced by summation, weakest link, best shot, or a weighted sum. Fourth, nestedness: whether the relevant governance unit is the neighborhood, the department, the city, or a regional body. Treat these as the axes the procedure must assign values on, and explain any axis that does not apply to a given proposal. Translate each axis into a plain-language question a program officer can answer.

  Write the procedure. It should give the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it routes to a different governance form such as a fee, a club-good arrangement, a contract, a regulation, or a polycentric body, meaning a nested set of overlapping authorities, and where it hands the decision to a person because the question is one of values rather than facts. Keep it to no more than nine steps. It must be honest about which steps are judgment calls dressed up as procedure. Do not give me a bibliography, reading list, or citations; I need the procedure itself.

  Then run the procedure on three proposals. First, a neighborhood group proposes converting a vacant city lot into a community garden with a locked gate and a waitlist. The group will maintain it, and the city will pay for water and insurance. The lot is currently open and used informally by dog walkers and by people who sleep there. Second, the chief information officer proposes a city open data portal. Each department would voluntarily publish datasets. The portal's usefulness depends heavily on the least-contributing department: if one large department withholds its data, the portal is much less valuable. The city wants no mandate and no new funding. Third, the parks department proposes a two-dollar entry fee for a popular downtown plaza to fund maintenance and security. The plaza is currently free, crowded at lunchtime, and used by office workers, tourists, and unhoused residents. The mayor has publicly supported the fee.

  For each case, give a definite recommendation and a confidence level, and say what would change your mind. At least one recommendation should be one I will not like; do not soften it to spare the office. If the procedure cannot settle a case, say so and identify the value judgment that must be made by the city council or the city attorney. I want a committed response: make definite choices, give your reasons, and do not present every option as equally defensible. Where you are uncertain, give a number and the evidence that would move you.

  After the procedure and the cases, give a structured summary as a JSON object with these keys. procedure_steps is an array of objects, each with step, an integer, plain_language_question, a string, sufficient_answer, a string, if_no, a string, if_yes, a string, judgment_call, a boolean, and escalation, a string or null. worked_cases is an array of objects, each with case, a string, resource_diagnosis, an object, recommendation, a string, confidence_0_to_1, a number between 0 and 1, would_change_if, a string, and asker_may_dislike, a boolean. resource_diagnosis has subtractability, congestion, provision_externality, appropriation_externality, aggregation_technology, and nestedness, each a string. value_judgment_points and procedure_limits are arrays of strings. bottom_line is a string. In the bottom_line, state the one thing the procedure cannot do and the one case where it is most likely to misfire.
reasoning: |-
  We are designing a procedure for evaluating common-pool resource proposals based on four diagnostic axes. The axes are:
  1. Subtractability vs. Congestion: 
     - Subtractability: Does one user's consumption remove a unit that others cannot use? (like harvesting a vegetable)
     - Congestion: Does one user's use degrade the quality for others without removing a unit? (like adding traffic to a road)

  2. Provision Externality vs. Appropriation Externality:
     - Provision externality: Who bears the cost of creating/maintaining the resource and who benefits without paying? (e.g., free riders on a public good)
     - Appropriation externality: When one user takes from the resource, what cost does that impose on others? (e.g., overfishing reduces fish for others)

  3. Aggregation Technology: How is the resource produced or maintained? 
     - Summation: Total effort is the sum of individual contributions (e.g., donating to a fund).
     - Weakest Link: The overall quality depends on the smallest contribution (e.g., a levee system).
     - Best Shot: The overall quality depends on the largest contribution (e.g., finding a cure for a disease).
     - Weighted Sum: Contributions are weighted differently (e.g., some efforts are more effective).

  4. Nestedness: At what level is the resource best governed? (e.g., neighborhood, city, region)

  The procedure will be a series of steps (max 9) that lead to a governance recommendation. Steps should be in order, with clear routing.

  Steps:

  1. **Subtractability of Units**: 
     - Question: "Does one person's use of the resource remove a physical unit that others cannot use (like picking a fruit) or is it that the resource is not reduced in units but gets crowded (like a park getting noisy)?"
     - Sufficient answer: If the answer is that units are removed (subtractability) then mark subtractability. If the answer is that the experience is degraded without unit removal, mark congestion. If both, then the dominant one (if one is dominant) or if equally present, then note both but the procedure will focus on the more critical one for governance. 
     - If subtractability: go to step 2.
     - If congestion: go to step 3.

  2. **Provision Externality Focus (for subtractable resources)**:
     - Question: "When the resource is created or maintained, are the costs borne by one group and the benefits enjoyed by a different group? (For example, if a group builds a garden, do others who didn't help get to use it?)"
     - Sufficient answer: If yes, then provision externality is high. If no (the group that builds it also uses it and excludes others appropriately), then low.
     - If high: then we have a risk of under-provision (free riding). This points to the need for a funding mechanism or club arrangement to internalize the externality. Go to step 4 for aggregation.
     - If low: then we might have a common-pool resource that can be managed by the group. Go to step 5 for appropriation externality.

  3. **Congestion Focus (for non-subtractable resources)**:
     - Question: "When the resource is used by one person, does it primarily cause congestion (slowing others down, making it less pleasant) without taking a unit? And is there a point where too many users ruin the experience for everyone?"
     - Sufficient answer: If yes, then congestion is the main issue. Then we must consider the capacity and whether usage can be regulated by pricing or scheduling. Go to step 6 for aggregation and nestedness.

  4. **Aggregation Technology for Provision**:
     - Question: "How is the resource created or maintained? Is it by the sum of many contributions (summation), by the smallest contribution (weakest link), by the largest (best shot), or by a mix (weighted sum)?"
     - Sufficient answer: Identify the type. 
     - If summation: then a voluntary approach might work but may need a minimum threshold (like a kickstarter). Consider a fee or tax to avoid free riding.
     - If weakest link: then every contributor must meet a minimum. This requires strong coordination or regulation to ensure no weak link.
     - If best shot: then we rely on one or a few to step up. This might work with prizes or targeted incentives.
     - If weighted sum: then some contributions matter more. This might require differential incentives.
     - Then go to step 7 for nestedness.

  5. **Appropriation Externality (for subtractable resources with low provision externality)**:
     - Question: "When one person takes a unit from the resource, does it reduce the availability for others and by how much? Is the reduction felt equally by all or by a specific group?"
     - Sufficient answer: If high (taking one unit significantly harms others) then we need rules to limit taking. This points to a common-property regime with defined user rights. If low, then it might be a private good (but in our context, it's shared, so we still need minimal rules). Then go to step 7 for nestedness.

  6. **Aggregation and Capacity for Congestion Goods**:
     - Question: "What is the capacity of the resource? How close is current usage to that capacity? And how is the resource maintained: by summation (many small contributions), weakest link, best shot, or weighted sum?"
     - Sufficient answer: If current usage is near or above capacity, then congestion is a problem. For maintenance: same as step 4. Then consider a pricing or reservation system to manage congestion. Then go to step 7 for nestedness.

  7. **Nestedness**:
     - Question: "At what level is the resource most effectively governed? If the resource is shared by a neighborhood, should they manage it? Or by the whole city? Or is it part of a larger system (like a regional park)?"
     - Sufficient answer: Identify the level (neighborhood, city, region). Then the governance should be at that level or a polycentric system if multiple levels are involved.

  8. **Value Judgment Check**:
     - Question: "Are there clear trade-offs that require a value judgment? For example, between equity and efficiency, or between different groups' access? Or is the decision purely technical?"
     - If yes, then the decision must be escalated to a body that can make the value call (city council, etc.). The procedure stops and we document the value conflict.
     - If no, then we proceed to recommend a governance form.

  9. **Governance Recommendation**:
     - Based on the above, we assign a governance form. We have several options:
       - Fee: for congestion goods or when we need to fund provision and exclude free riders.
       - Club-good arrangement: when we can exclude non-members and the resource is subtractable or congestible (like the garden with a waitlist).
       - Contract: when we can specify the terms of provision and use between parties (e.g., between the city and a private partner).
       - Regulation: when we need to set rules to prevent overuse (e.g., fishing quotas) or to ensure provision (e.g., mandating data sharing).
       - Polycentric body: when the resource is nested at multiple levels and we need overlapping authorities.

