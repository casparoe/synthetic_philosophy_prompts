  ### Procedure for Common-Pool Resource Proposals  
  **Target Users**: Program officers with no formal economics training.  
  **Goal**: Assign governance forms using four diagnostic axes.  
  **Governance Outputs**: Fee, club good, contract, regulation, polycentric body, or escalate for values.  

  #### Procedure Steps (9 steps max):  
  | Step | Plain Language Question | Sufficient Answer | If "No" | If "Yes" | Judgment Call? | Escalation If Needed |
  |------|--------------------------|-------------------|----------|----------|----------------|----------------------|
  | 1 | **Subtractability**: "Does one user’s consumption permanently remove a unit (e.g., harvesting a vegetable), making it unavailable to others?" | Clear examples (e.g., "Picking a tomato leaves less for others"). | Route to Step 3 (congestion focus). | Route to Step 2 (provision externality). | Yes (distinguishing removal vs. degradation). | None. |
