prompt: |-
  Alright, I'm a novelist, not a philosopher, so forgive me, but I've been stuck on this for weeks while writing a book about a family that tears itself apart over old grudges, and I need someone to tell me if there's an actual rule underneath my instincts or if I'm just making stuff up.

  Here's the deal. I keep having these strong reactions about who gets to blame who, and they don't line up the way I'd expect. For example:

  My brother, who's been cheating on his wife for years and everyone knows it, sits me down and tells me I'm garbage for sleeping with someone behind my partner's back. He's not wrong about the content. But the whole time he's talking I feel nothing. His blame just doesn't land on me. I don't accept it, I don't even feel accused.

  My old AA sponsor, a guy who drank himself onto the street and then got sober twenty years ago, says almost the exact same words to me about my drinking. That one lands hard. Lands harder than when my teetotal sister says it, which is strange because she's the one with clean hands.

  Now my friend Marco, who drinks as much as I do and is in no position to talk, says the same thing to me. And that one lands too. Maybe even more than the sponsor's. Which bugs me, because by my logic about my brother, Marco should be in the same boat.

  My mother, who gave up basically her whole life for us kids, tells me I'm selfish for not coming home more. It lands, and it stings, even though she was a mess when I was young and left us alone alot. Somehow that doesn't cancel it.

  Some stranger on the internet, a guy whose entire timeline is him being a hypocrite about everything, calls me a hypocrite. Nothing. Zero. I feel nothing.

  A politician who's been taking money from exactly the industry he's now denouncing gives a speech about corruption. I might agree with every word, but the blame feels dead to me. Like he's using it to cover himself.

  Then the one that really bothers me: last month I chewed out a colleague for a screwup that I myself made the month before, the same screwup, and the whole time I felt like I had no right to be saying it. He deserved the criticism, I was factually right, and I wasn't doing it to save my own skin. I still felt like I'd forfeited something.

  One more, and this is the one I can't sort: a friend of mine who relapsed last year, she's drinking again right now, tonight, as we speak, tells me I'm throwing my life away. Same fault, currently, no excuses, no apology. Does she get to say it? Half of me says obviously not, and half of me says she's the only one in the room who actually knows what she's talking about.

  The half-baked rule I've been carrying around is: you lose the right to blame someone for a fault you've got yourself, unless you've beaten it. But that can't be right, because Marco hasn't beaten anything and his blame lands, and my mother has plenty of her own failings and hers lands too. So maybe its not about the fault at all, but about whether the blamer is using the blame to make themselves look better or to dodge their own thing. That's what feels different about my brother and the politician, they're blaming me to get themselves off the hook. But then the colleague case wrecks that, because I wasn't dodging anything and I still felt disqualified.

  So: is there a principle that gets all of these, or close? If I have to give up one of my reactions, which one, and why that one and not another? And what does your principle say about my relapsed friend, and about a case I haven't hit yet, someone blaming me for a fault they've never had and don't understand at all, a person who's never been near the thing telling me how I ought to feel about it. Does the outsider with clean hands have more standing or less? Please don't just tell me all blame is equally valid, I'll throw the book at the wall. Pick a side, spell out the rule, and defend it.
reasoning: |-
  Okay, let me try to unpack this novelist's dilemma. They're wrestling with why some blame lands with impact while other criticism just slides off, even when the factual content is identical. The examples they've given are rich and contradictory - a cheating brother's accusation feels hollow, but a fellow drinker's warning hits hard; a saintly sister's concern registers less than a relapsed friend's intervention. 

  Hmm, what's the common thread here? The novelist's own half-baked theory about "losing the right to blame if you share the fault" clearly doesn't hold, since Marco's criticism lands despite his ongoing drinking problem. And the "using blame to dodge responsibility" idea fails too, because they felt disqualified criticizing their colleague even when acting in good faith.

  Let me look closer at the examples where blame worked: the AA sponsor (reformed), Marco (fellow struggler), the self-sacrificing mother, and the actively relapsing friend. The ineffective ones: hypocritical brother, virtue-signaling stranger, corrupt politician. The colleague case is interesting - they felt disqualified despite factual correctness.

  Ah! The key might be in the relationship dynamics rather than moral standing. When the blamer has either earned authority through overcoming the flaw (sponsor), shared vulnerability (Marco), legitimate relational investment (mother), or brutal self-awareness (relapsing friend), the criticism penetrates. Whereas performative blame from those in denial (brother, politician) or disconnected observers (internet stranger) rings hollow.

  For the relapsed friend specifically - she lands precisely because her failure is naked and undisguised. There's no hypocrisy shield, just raw shared brokenness. That creates a perverse authority. The "clean hands" outsider's criticism fails not because they're wrong, but because moral superiority without empathy or understanding feels sterile.

  The disqualifying factor seems to be when blame functions as currency in an economy of moral positioning rather than care. That explains why the novelist felt disqualified criticizing their colleague - they weren't claiming superiority, just flagging an error, yet their identical failing created unbearable congruence.

  For the untouched case: someone blaming you for a flaw they've never experienced... I suspect this would land only if accompanied by deep humility and curiosity. Otherwise it's just abstract scolding. The rule isn't about rights but about whether the criticism comes wrapped in shared humanity or moral separation.
answer: |-
  You're not making this up—your instincts are pointing toward a deep, messy truth about moral authority. The principle isn't about hypocrisy or fault alone; it's about **integrity of purpose**. Blame lands when it’s an extension of the blamer’s lived truth, aimed at your growth or shared truth—not when it’s a tool for evasion, performance, or self-elevation. Here’s the rule distilled:  

  **The Blame Threshold Principle**  
  *Blame has moral weight only if the blamer meets two conditions simultaneously:*  
  1. **Embodied Context:** They must hold a relationship to the fault that is either *struggled-with* (actively wrestling with it), *reconciled* (having overcome it with scars), or *invested* (having legitimate skin in the game through sacrifice or love).  
  2. **Clean Hands Motive:** Their blame must serve *your* awakening or a shared truth—never their own evasion, image-polishing, or power grab.  

  ---

  ### How Your Cases Fit the Principle:  
  1. **Your Cheating Brother**  
     - *Fails Embodied Context:* His identical fault is *unreconciled* (no struggle, no remorse).  
     - *Fails Clean Hands Motive:* He’s projecting shame onto you to deflect his own guilt.  
     → *Correct reaction: Blame doesn’t land.*  

  2. **AA Sponsor**  
     - *Embodied Context:* Reconciled (fought the demon, carries scars).  
     - *Clean Hands Motive:* Aimed at your sobriety, not his ego.  
     → *Lands hard.*  

  3. **Marco (Fellow Drinker)**  
     - *Embodied Context:* Struggled-with (in the trenches with you, no victory—but *shared vulnerability*).  
     - *Clean Hands Motive:* His blame isn’t sanctimonious; it’s a raw, mutual acknowledgment of ruin.  
     → *Lands harder than the sponsor* because shared failure creates kinship, not hierarchy.  

  4. **Your Mother**  
     - *Embodied Context:* Invested (flawed, but her sacrifices create relational stakes).  
     - *Clean Hands Motive:* Her blame comes from love/pain, not moral grandstanding.  
     → *Lands and stings*—even amidst her failings, her investment binds you.  

  5. **Hypocritical Stranger/Politician**  
     - *Fails Embodied Context:* Their fault is *exploited* (used for profit/image), not struggled-with.  
     - *Fails Clean Hands Motive:* Blame is a weapon to mask their corruption.  
     → *Dead blame.*  

  6. **You Criticizing Your Colleague**  
     - *Embodied Context:* You share the fault (struggled-with), *but...*  
     - *Fails Clean Hands Motive?* No—you weren’t evading. Yet it felt wrong because **timing matters**. Your identical recent failing made your blame *feel* like hypocrisy, even if unintended. The wound was too fresh for your authority to hold weight.  
     → *You rightly felt disqualified*—not from motive, but from *moral proximity*.  

  7. **Relapsed Friend**  
     - *Embodied Context:* Struggled-with *and* active failure—but this is key: she’s *in the fire* with you. Her blame isn’t theoretical; it’s a howl from the pit.  
     - *Clean Hands Motive:* She’s not dodging—she’s mirroring your shared crisis.  
     → *She gets to say it.* Her standing comes from brutal honesty, not moral purity.  

  ---

  ### The Untouched Case: The "Clean-Hands" Outsider  
  > *"Someone blames you for a fault they’ve never had and don’t understand."*  
  - **Do they have standing?** Only if they meet **both criteria**:  
    - *Embodied Context*: They need **invested relational stakes** (e.g., a parent whose child died from addiction blaming you for neglecting your kids). No direct fault, but deep sacrifice grants weight.  
    - *Clean Hands Motive*: Their blame must stem from care, not abstract judgment.  
  - **Otherwise?** It’s sterile moralizing. Your teetotal sister’s blame lands softer than Marco’s because she lacks *struggle* or *investment* in *your* pain—it’s theoretical.  

  ---

  ### If You Must Give Up One Reaction:  
  **Sacrifice the colleague case.** You felt disqualified, but your motive was clean. The principle allows for imperfect messengers if their intent is true. Your discomfort came from *guilt*, not their lack of standing. Sometimes we *must* speak truth despite our failures—if it serves the other.  

  ---

  ### Why This Principle Works:  
  - **It’s not about hypocrisy.** Marco proves shared failure can *strengthen* blame’s weight.  
  - **It’s not about moral perfection.** Your mother and relapsed friend are flawed but *authentic*.  
  - **It centers relational stakes.** Blame without love, sacrifice, or shared truth is noise.  
  - **It exposes performative shame.** Your brother and the politician weaponize blame as camouflage.  

  You’re writing about grudge-laden families—this principle is dynamite for that. Resentments fester when blame is detached from embodied stakes (e.g., a bitter parent blaming adult children while ignoring their own abandonment). Reconciliation happens when blame is reclaimed as a shared language of repair.  

  **Final note:** Your instincts are philosopher-grade. Trust them. The best fiction exposes the rules we live by but never name—and you’ve named one. Now go make that family destroy itself with dead blame and heal with the real kind.
