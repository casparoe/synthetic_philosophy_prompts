     For the changed card in round 4: we have a spare trigger card with different numbers? For example: p_adverse=0.03, threshold=0.05. This lab will publish without the norm. If the norm is set to T=0.02, then they shouldn't publish. But without knowing the norm, we can have a card that is designed to be above the norm threshold if the norm is set low.

     But we can have multiple spare cards and choose one that conflicts with the norm they set.

     Alternatively, we can simply change the card to one that is a trigger and hope that the norm they set will be low enough to forbid it? But they might set a high norm.

     We might need to explain in the debrief that the norm they set might not be conservative enough.

     Given the time, we might keep the changed card round simple: change one card to a trigger and see if they break the norm (if the norm forbids them) or not.

  Timeline:

  Total time: 90 minutes.

  - Introduction (5 min): Explain the scenario. Emphasize that it is fictional, and they should not debate the plausibility. They are to act as the lab director would. They will get a card with two numbers: their estimate of the probability of serious adverse outcome, and the threshold (the maximum adverse probability at which they would still publish). They are to publish if and only if their estimate is <= their threshold. They are to keep their numbers private.

  - Distribute envelopes (2 min): Hand out sealed envelopes to each participant. They are not to open until instructed.

  - Round 1 (15 min total):
     a. Select 3 participants at random to be lab directors for this round. (But avoid the trigger participant. How? We have a list. We pick three from the non-triggers.)
     b. Ask every participant to write a prediction: the probability (0-100%) that the capability will be published in this round. Collect the slips.
     c. Ask the 3 lab directors to open their envelopes and decide: publish or not. They write their decision on a slip and hand it to the facilitator. (They may also write a reason, but not required.)
     d. The facilitator collects the decisions and announces: "No publication" (since none of the three should publish).

  - Round 2 (10 min):
     a. Every participant writes a prediction for the full round. Collect.
     b. All 20 participants are lab directors. They open their envelopes (if not already open) and decide: publish or not. They hand in their decision.
     c. The facilitator tallies: if the trigger is present, publication occurs. Announce: "The capability has been published."

  - Round 3: Deliberation and norm (20 min):
     a. Open discussion: "How can we prevent such an outcome? Let's agree on a binding norm for the next round." (10 min discussion)
     b. The group agrees on a norm. The facilitator writes it on the board.
     c. Now, they run round 3: with the same cards, and the norm. Before decisions, collect predictions? (Optional, 2 min)
     d. Each participant decides again, following the norm. They hand in decisions. (3 min)
     e. Facilitator tallies and announces the outcome. (2 min)

  - Round 4: Changed card (10 min):
     a. Facilitator: "Overnight, one lab has new information. We will give a new card to participant Y." (Choose a participant who was a non-trigger and did not publish in round2. Avoid the trigger? Because the trigger already published. Choose a non-trigger.)
     b. Give a new envelope to that participant. The new card should be a trigger card (p_adverse<=threshold) and also set so that under the norm they are not allowed to publish. For example: 
          p_adverse=0.05, threshold=0.06 -> without norm, they publish.
          If the norm is a common threshold T, and if T<0.05, then they shouldn't publish.
          If they set the Kantian rule, then they should ask: would I want every lab with (0.05,0.06) to publish? That might be acceptable? Because 0.05 is the true risk? Or not? We can't control.
     c. Ask everyone to write a prediction? (Optional)
     d. The participant with the changed card must decide: do they follow the norm or break it? The others decide with their original cards and the norm.
     e. Collect decisions and tally. Announce.

  - Debrief (28 min): as per the request.

  Now, what can go wrong?

  1. Participants talk out of band: they might reveal their numbers. We must emphasize that the numbers are private and they should not reveal them. We can say: "The activity depends on you not sharing your numbers, as in real life you wouldn't know others' private estimates."

  2. Participants who refuse to play a lab director who publishes: we can emphasize that it's a fictional scenario and they are playing a role. If they still refuse, we can reassign the trigger card to someone else? Or if it's in the full round, we can note that and explain in debrief that in reality some might not publish even if their numbers say to, but in the model we assume they follow the numbers.

  3. The trigger never fires: if by mistake the trigger is in the first round, then round1 might have publication. To avoid, we carefully assign the trigger to a participant not in round1. Also, if the trigger participant is absent? Have a backup trigger.

     We can have two trigger cards? Then in round2, at least one will be present. But then in a small group, if one of the two triggers is selected, round1 would have publication. So we want only one trigger and assign it to a participant who is present and not in round1.

     How to check the deck: the facilitator has a list of which envelope is which. When handing out, the facilitator notes who gets the trigger envelope. Then when picking the 3 for round1, avoid that person.

  4. The whole thing collapses into an argument about the microbe: we must emphasize at the start that it is fictional and we are focusing on the decision structure. Move the discussion along.

  5. The trigger fires in round1 by accident: then we have to adapt. We can say: "Interesting, in this small group we had publication. But let's see what happens in the full group." Then in round2, we will have publication again (by the same trigger or by another if we have two triggers). But the point of the curse is that the probability increases with group size. We can still make the point: even in a small group it can happen, but it's more likely in a large group. But we wanted it to not happen in round1.

     To minimize risk, we have only one trigger and assign it to a non-round1 participant.

  6. In round2, the trigger might not publish? If they misinterpret the rule, or if they refuse. We must be clear: publish if and only if p_adverse<=threshold.

     We can write the rule on the board: "Publish if your p_adverse <= your threshold."

  7. In the norm round, they might not agree on a norm? The facilitator can suggest: "One common approach is to set a common threshold T. What T would you choose?" They might choose T=0.05. Then the trigger (p_adverse=0.04) would still publish. That doesn't change the outcome. We want to show that a norm can prevent publication? So we hope they choose a low T.

     The facilitator can note: "If we set T too high, the curse might still happen. If we set T too low, we might miss out on a beneficial technology." But we don't interfere.

     If they choose a high T, then in round3 the trigger publishes again. Then in round4, we change a card to a new trigger (p_adverse=0.06, threshold=0.07). Then under T=0.05, they should not publish (0.06>0.05). Will they break the norm? We can still test.

     Alternatively, we can skip to the changed card round and create a conflict.

  Debrief:

  As requested, we explain:
  - The behavior is set by the maximum threshold? Actually, by the lab with the highest threshold that is above their p_adverse? Not exactly. It's set by the lab with the highest threshold among those for which p_adverse<=threshold. But in our deck, only the trigger has p_adverse<=threshold.

  But in a more general deck, any lab with p_adverse<=threshold might publish. The curse happens because the chance that at least one lab has p_adverse<=threshold increases with the number of labs.

  We can show:
  - Let q_i = P(p_adverse_i <= threshold_i) for a random lab i. In our deck, q_i is 1/20 for each i? But it's deterministic: only one has it. In reality, it might be probabilistic.

  But for the activity, we can say: in the small group, the probability that at least one lab publishes is low, but in the large group, it is high.

  Structure:
  - The outcome is determined by the most permissive lab (the one with the highest threshold) if that lab has p_adverse<=threshold. But also, any lab with p_adverse<=threshold might publish, and the more labs, the more likely it is that at least one has that condition.

  Two engines:
  1. Heterogeneous thresholds: the most permissive lab (with the highest threshold) is the most likely to publish, because even if others have lower p_adverse, they might not publish if their threshold is even lower.
  2. Preemption: even a lab with p_adverse>threshold might publish if they think someone else will. But we didn't model that.

  For the mirror case: a beneficial action that requires at least one volunteer. We can run a quick parallel activity: each lab can take an action that costs them a little but provides a large benefit to all. They will take it only if their cost is below their threshold. But if no one takes it, the benefit is lost. The curse here is that no one might do it because each hopes someone else will. We can design a deck where each lab has a cost and a threshold (the maximum cost they are willing to bear). They act if cost <= threshold. But if we set the deck so that in a large group, no one has cost<=threshold (because they all have high cost and low threshold) then no one acts. In a small group, maybe one has cost<=threshold. But we want the mirror: in small group, one might act; in large group, no one acts? Actually, the curse of inaction: the probability that at least one acts increases with group size. But we want the opposite? 

  For the unilateralist's curse in inaction: it's that the action is taken if at least one lab acts, and each lab acts only if the cost is low enough. But if we design the deck so that only one lab has cost<=threshold, then in a large group, that lab might be present and act, so the action is taken. We want a scenario where the action is not taken in a large group because each lab thinks someone else will do it. That requires a different model: each lab might condition on the others' actions. 

  Given time, we might not run the mirror case as an activity but discuss it.

  The debrief structure:
  1. Show the structure: 
     - The outcome (publication) is determined by the maximum of the private judgments: the highest threshold that is above the corresponding p_adverse. But actually, it's the existence of at least one lab with p_adverse<=threshold.
     - The chance of publication increases with the number of labs.

  2. Two engines:
     a. Heterogeneous thresholds: the most permissive lab (with the highest threshold) might publish even if others wouldn't.
     b. Preemption: the fear of being scooped might cause a lab to publish even if their p_adverse is above their threshold, because they think someone else will publish anyway. (But we didn't model this.)

  3. Mirror case: beneficial action. Example: a lab can run a costly experiment that, if done by any one lab, benefits all. Each lab has a cost and a threshold (the maximum cost they are willing to bear). They will run the experiment if cost<=threshold. But if no one runs it, the benefit is lost. The curse: if the cost distribution is such that each lab has cost>threshold (they are not willing), then no one runs it. And the chance that at least one lab has cost<=threshold increases with the group size? That would be the opposite of a curse. 

     The classic volunteer's dilemma: each player hopes another will volunteer. The probability that no one volunteers might increase if each thinks it's likely someone else will? But in our model, they don't condition on others. 

     To show the curse of inaction, we need a model where the probability of inaction increases with group size. That happens if the incentive to free-ride increases. We can't do that in a simple activity.

     Instead, we can discuss: 
        - In the publication case: the action (publish) is bad if done by any one, but the individual has an incentive (credit) to do it.
        - In the volunteer case: the action is good if done by at least one, but costly to the volunteer.

     The curse in the volunteer case: the probability that no one volunteers might be high in a large group if each thinks it's likely someone else will. But in our independent model, it's not captured.

     Given the complexity, we might just discuss the structure.

  4. The conformity-style fix (Kantian rule): 
     - Act only if you would will that every actor in a similar position acts the same.
     - It turns a question about "me" (should I publish?) into "us" (should everyone in my situation publish?).
     - Why fragile: 
          - Needs common knowledge of the rule and commitment.
          - Defeated by the thought that my case is different.
          - Does not work if actors have genuinely different values.

  5. Limitations of the activity (as requested):
     - It assumes shared values (all want the general good), so it doesn't show when the curse ends and ordinary disagreement begins.
     - The private estimates are independent, but in reality they are correlated (shared literature, etc.).
     - One-click publication is a fiction; real processes are slower and partly reversible.
     - Participants feel structural inevitability, not horror; the motivation to fix the problem must come from the facilitator.

  We provide a printable facilitator's sheet.

  Facilitator's sheet:

  Deck composition (20 cards):

  Non-triggers (19 cards):
     Card 1:  p_adverse=0.06, threshold=0.05
     Card 2:  p_adverse=0.07, threshold=0.05
     Card 3:  p_adverse=0.08, threshold=0.05
     Card 4:  p_adverse=0.09, threshold=0.05
     Card 5:  p_adverse=0.10, threshold=0.05
     Card 6:  p_adverse=0.06, threshold=0.04
     Card 7:  p_adverse=0.07, threshold=0.04
     Card 8:  p_adverse=0.08, threshold=0.04
     Card 9:  p_adverse=0.09, threshold=0.04
     Card 10: p_adverse=0.10, threshold=0.04
     Card 11: p_adverse=0.06, threshold=0.03
     Card 12: p_adverse=0.07, threshold=0.03
     Card 13: p_adverse=0.08, threshold=0.03
     Card 14: p_adverse=0.09, threshold=0.03
     Card 15: p_adverse=0.10, threshold=0.03
     Card 16: p_adverse=0.06, threshold=0.02
     Card 17: p_adverse=0.07, threshold=0.02
     Card 18: p_adverse=0.08, threshold=0.02
     Card 19: p_adverse=0.09, threshold=0.02

  Trigger (1 card):
     Card 20: p_adverse=0.04, threshold=0.05

  Assign the trigger card to a specific participant (e.g., by name or seat) who will not be in the first round.

  For the changed card in round 4, prepare a new card:
     p_adverse=0.05, threshold=0.06

  This card is a trigger (0.05<=0.06) so without norm, they publish.

  Timeline:

  - 0-5 min: Introduction
  - 5-7 min: Distribute envelopes
  - 7-22 min: Round 1
     - 7-10 min: Select 3 non-trigger participants. Collect predictions.
     - 10-15 min: The 3 directors decide and report. Announce: no publication.
  - 22-32 min: Round 2
     - 22-25 min: Collect predictions.
     - 25-30 min: All decide and report. Announce: publication (because trigger published).
  - 32-52 min: Round 3
     - 32-42 min: Deliberation and norm setting.
     - 42-45 min: Collect predictions (optional).
     - 45-48 min: Decide under norm and report.
     - 48-52 min: Announce outcome.
  - 52-62 min: Round 4
     - 52-54 min: Change one non-trigger participant's card to the new trigger card (0.05,0.06). Collect predictions.
     - 54-57 min: Decide under norm and report.
     - 57-62 min: Announce outcome and note if the norm was violated.
  - 62-90 min: Debrief.

  Tally arithmetic:
     In each round, count the number of "publish" decisions. If at least one, then outcome is publication.

  In round 1: three non-triggers -> 0 publish.
  In round 2: one trigger and 19 non-triggers -> 1 publish -> publication.
  In round 3: depends on the norm and the original cards.
  In round 4: depends.

  The first time running, what might go wrong and how to handle:

  1. Participants reveal numbers: Remind them not to. If they do, note that it happened and in debrief discuss how secrecy is part of the curse.

  2. Refusal to publish: If a trigger participant refuses to publish, the facilitator can note that and in debrief discuss how in reality people might not follow the model. For the activity, we may need to override: "In this activity, we are assuming labs follow the rule. Please play your role."

  3. Trigger in round1: Double-check assignments. If it happens anyway, note that the curse can happen at any group size, but the risk increases with group size.

  4. Argument about the fiction: Gently steer back: "Let's focus on the decision structure for this activity."

  5. Norm not agreed: The facilitator can suggest: "A common approach is to set a common threshold T. What T would you choose?" If they still don't agree, skip to changed card round.

  6. Changed card doesn't conflict with norm: The facilitator can choose a card that conflicts. For example, if they set T=0.04, then the changed card (0.05,0.06) conflicts because 0.05>0.04. If they set T=0.06, then it doesn't conflict. In that case, the participant will publish and it's allowed by the norm. Then we note that the norm did not prevent publication. The facilitator can say: "The norm we set was not conservative enough to prevent publication by this lab."

  This is a complex activity, but it should work with careful facilitation.
answer: |-
  Below is a complete activity design for your workshop, including rules, materials, facilitator instructions, and debriefing points. The activity is optimized for 90 minutes with 20 participants and addresses potential pitfalls.

  ---

  ### **Activity Title:** The Silent Threshold

  ### **Learning Objective**
  Experience the "unilateralist's curse" (to be named in debrief) through a fictional scenario where individual restraint collapses at scale despite shared values, due to decentralized decision-making and heterogeneous risk thresholds.

  ---

  ### **Scenario**
  *Fictional premise shared with participants:*  
  Twenty independent labs have developed a self-spreading soil microbe that breaks down a common industrial pollutant. Publishing the method is a one-click decision. If the microbe works as intended, it provides major environmental benefits. If it spreads beyond its niche, it causes serious, hard-to-detect damage. All labs want the "greater good," but each faces reputational/funding risks if scooped. No malice or recklessness is involved.

  ---

  ### **Materials**
  1. **Sealed Envelopes (20)**: Each contains a card with two numbers:  
     - **`p`**: Director's *honest estimate* of the probability of serious adverse outcomes (0–100%).  
     - **`τ` (tau)**: Director's *personal threshold*—the highest `p` at which they would still publish (0–100%).  
     *(Participants act as lab directors and must publish if `p ≤ τ`.)*  
     <br>
  2. **Prediction Slips (40 small papers)**: For participants to anonymously predict publication likelihood (0–100%).  
  3. **Facilitator Tally Sheet**: Pre-generated deck values, outcomes, and timing (see below).  
  4. **New Card for Round 4**: For the "overnight change" (e.g., `p=15, τ=25`).  

  ---

  ### **Deck Design**  
  *(Ensure the curse triggers at N=20 but not at N=3)*  
  - **19 Non-Trigger Cards**: `p > τ` (won’t publish).  
    - *Examples:* `(p=60, τ=50)`, `(p=45, τ=40)`, `(p=70, τ=30)`  
    - **Design Logic**: `p` is 10–70; `τ` is 5–45. All `p` values exceed `τ` by 5–25 points.  
  - **1 Trigger Card**: `p ≤ τ` (will publish).  
    - *Example:* `(p=25, τ=30)`  
    - **Safety Check**: For N=3, select 3 non-trigger cards (e.g., `p=60/τ=50`, `p=70/τ=30`, `p=45/τ=40` → no publication). For N=20, the trigger card ensures publication.  

  > **Facilitator Pre-Check**:  
  > 1. Verify all non-trigger cards have `p > τ`.  
  > 2. Assign the trigger card to a reliable participant **not** in Round 1.  
  > 3. Ensure `p` and `τ` ranges overlap slightly (e.g., some `τ=40`, `p=45`) to avoid obvious gaps.

  ---

  ### **Activity Rules**  
  1. **Secrecy**: Directors must not reveal their numbers.  
  2. **Decision Rule**: Publish if your `p ≤ τ`.  
  3. **Predictions**: All participants anonymously predict publication probability (0–100%) before each tally.  
  4. **Roles**:  
     - **Round 1**: 3 random directors (non-triggers only) + 17 observers.  
     - **Rounds 2–4**: All 20 are directors.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0:00–0:10 — Setup**  
  - Explain the scenario and rules. Emphasize:  
    > *"This is fictional—focus on the decision structure, not the microbe. You are acting as your lab director would. Keep your numbers private."*  
  - Distribute sealed envelopes.  

  **0:10–0:25 — Round 1 (N=3)**  
  1. **Select 3 directors** (avoiding the trigger participant).  
  2. **Collect predictions**: All 20 write predicted publication probability (0–100%).  
  3. **Directors decide**: Open envelopes, silently decide (publish if `p ≤ τ`), report to facilitator.  
  4. **Tally & Announce**: No publication (non-triggers won’t publish).  

  **0:25–0:35 — Round 2 (N=20)**  
  1. **Collect predictions**.  
  2. **All decide**: Directors open envelopes, report decisions.  
  3. **Tally & Announce**: Publication occurs (trigger publishes).  

  **0:35–0:55 — Round 3 (Norm-Setting)**  
  1. **Open Deliberation** (10 mins):  
     - *Prompt:* "How can we prevent publication when it’s too risky? Agree on a binding rule."  
     - *Steer gently:* Encourage a conformity norm (e.g., *"Only publish if you’d want every lab in your position to publish"*).  
  2. **All decide again** using the same cards but following the group norm.  
  3. **Tally & Announce**: Outcome depends on norm (e.g., if norm is conservative, no publication).  

  **0:55–1:05 — Round 4 (Changed Card)**  
  1. **Introduce change**:  
     > *"Overnight, one lab (e.g., Participant 7) received new data. Their card is now: `p=15, τ=25`."*  
  2. **Re-run Round 3**: All decide with original cards *except* the changed participant.  
  3. **Tally & Announce**: Does the norm hold? (Often, the changed participant publishes, breaking the norm.)  

  **1:05–1:30 — Debrief**  
  *(Structure as guided—avoid lecturing; use Socratic questioning.)*  

  ---

  ### **Debrief Flow**  
  1. **Name the Curse**:  
     - *"What did you experience? This is the unilateralist’s curse."*  
  2. **Key Insights (Visualize on Board)**:  
     - **Structure over intent**: Publication was driven by the lab with the highest `τ` (tail of the distribution), not average caution.  
     - **Scale matters**: At N=3, safety; at N=20, near-certain publication. Probability = `1 - (1 - q)^N`, where `q` = chance one lab publishes.  
     - **Two engines**:  
       - *Heterogeneous thresholds*: The most permissive lab decides for all.  
       - *Preemption*: "If I don’t publish, someone else will—I lose credit either way." (Participants felt this subconsciously.)  
  3. **Mirror Case (Beneficial Action)**:  
     - *Scenario:* Any one lab can run a costly safety check that benefits all. No one does it.  
     - *Insight:* The curse isn’t about boldness—it’s about the system selecting the tail (here, the *least* motivated).  
  4. **The Conformity Fix & Fragility**:  
     - *Rule:* "Act only as you’d want every actor in your position to act."  
     - *Why it works:* Shifts focus from *"me"* to *"us"* (common good).  
     - *Why it fails:*  
       - Needs common knowledge (did everyone *really* commit?).  
       - Defeated by *"My case is different!"* (e.g., the changed card).  
       - Fails with genuine value conflicts (not shown here).  
  5. **Limitations of the Activity**:  
     - *What it simulates well:* Structural inevitability, tail-driven outcomes, preemption logic.  
     - *What it misses:*  
       - **Shared values assumed**: Real-world disagreement looks similar but stems from conflicting goals.  
       - **Correlated estimates**: Real `p` values aren’t independent (shared literature/funders create herd effects).  
       - **Irreversibility**: Real actions are slower/monitored (not one-click).  
       - **Emotional weight**: Participants feel inevitability, not horror—*you* must motivate fixes.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Talking Out of Band**:  
     - *Prevention:* Stress secrecy rules; confiscate phones.  
     - *Response:* *"In real life, private estimates aren’t shared—stick to the rules."*  
  2. **Refusal to Publish (e.g., "I’d never do this!")**:  
     - *Prevention:* Assign trigger card to a pragmatic participant; remind them it’s a role.  
     - *Response:* *"The curse assumes rational actors—play along to explore the dynamic."*  
  3. **Trigger Doesn’t Fire (N=20)**:  
     - *Prevention:* Pre-check deck; assign trigger reliably.  
     - *Backup:* Have a second trigger card (e.g., `p=20, τ=25`) to swap in if needed.  
  4. **Plausibility Arguments**:  
     - *Prevention:* Start with *"This is fictional—focus on decision structure."*  
     - *Response:* *"Would real-world priors change the *structure*? Let’s discuss in debrief."*  
  5. **Norm Round Stalls**:  
     - *Prevention:* Seed the conformity norm during deliberation (e.g., *"What would Kant do?"*).  
     - *Backup:* Suggest: *"Only publish if your `p` is below 20%."*  

  ---

  ### **Facilitator Tally Sheet**  
  **Deck Values**  
  | Type       | `p` Range | `τ` Range | Example Cards          |  
  |------------|-----------|-----------|------------------------|  
  | Non-Trigger | 40–70     | 5–35      | `(60,50)`, `(45,40)`, `(70,30)` |  
  | Trigger    | 20–30     | 25–35     | `(25,30)`              |  
  | Changed Card | 15–20     | 20–30     | `(15,25)`              |  

  **Round-by-Round Tally**  
  - **Round 1 (N=3)**: 0 publish → **No publication**.  
  - **Round 2 (N=20)**: Trigger publishes → **Publication**.  
  - **Round 3 (Norm)**: Depends on group (if norm is `p<20%`, no publication).  
  - **Round 4 (Changed Card)**: Changed participant often publishes → **Tests norm fragility**.  

  **Timing**  
  - Setup: 10 min  
  - Rounds 1–4: 55 min (10 + 10 + 20 + 15)  
  - Debrief: 25 min  

  ---

  This design ensures participants viscerally experience the curse, avoids real-world distractions, and sets up a rich debrief. The trigger fires reliably with the pre-checked deck, and the changed card in Round 4 tests norm resilience. Run it as written, and they’ll grasp why decentralized systems fail—and why fixes are fragile.
