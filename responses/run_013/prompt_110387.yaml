  The toast's spine is Bentham's equality principle: "Your happiness isn't special - and that's revolutionary." That's the quiet bomb beneath the champagne warmth.
answer: |-
  ## Brainstorming the Benthamite Toast

  **Traditional Toast Elements vs. Benthamite Constraints:**

  1.  **Invoking "Meant to Be" / Destiny:** *Unavailable.* Bentham rejects inherent meaning or destiny. Focus on choices and consequences.
  2.  **"Sacred Union" / Religious Sanctity:** *Unavailable.* No appeal to the supernatural or inherent holiness.
  3.  **"Natural" Love/Union:** *Unavailable.* "Natural" is a masked principle (asceticism/antipathy). Focus on the *felt experience*.
  4.  **Exceptionalism of the Couple:** *Limited.* Can't claim their souls are uniquely special or their love is objectively "the best." Can praise *observable* qualities that *cause* pleasure (kindness, wit, loyalty) and the *fact* of their mutual happiness.
  5.  **"Love Conquers All" / Future Guarantees:** *Unavailable.* Can't predict the future or promise invincibility. Can focus on their *current* happiness and *intent* to generate future happiness together.
  6.  **"Makes the World Better":** *Problematic.* Strictly, we can't sum the global ledger. We *can* say: *Their happiness exists and is valuable. Their union demonstrably produces significant pleasure for themselves and their close circle.*
  7.  **Acknowledging Family Discomfort:** *Essential & Tricky.* Must acknowledge the *reality* of the parents' pain as Benthamite "pain." Cannot concede it provides a *reason* to condemn the marriage (as Bentham argues the distress is *caused by* the condemnation). Must avoid cruelty. Frame it as a *fact of the current situation*, not a justification for opposition.
  8.  **Humor & Warmth:** *Essential & Possible.* Focus on observable quirks, shared jokes, specific kindnesses, the tangible *pleasure* they bring each other and friends.

  **Core Benthamite Moves for the Toast:**
  *   **Focus on Pleasure/Pain:** Frame everything in terms of observable happiness and suffering.
  *   **Equality of Happiness:** Their joy counts *exactly as much* as anyone else's.
  *   **Rejection of Spurious Principles:** Implicitly reject "nature," "sanctity," "disgust," or "tradition" as justifications by *not using them* and focusing solely on consequences.
  *   **Circularity of Disgust/Offense:** The key to handling the parents – their pain is real, but its origin (learned condemnation) cannot justify perpetuating the cause (opposition to the marriage).

  ---

  ## The Toast (Approx. 650 words)

  **(Clink glass gently)** Friends, family, chosen family… thank you for gathering in this lovely, slightly crowded back room! For those who don’t know me, I’m [Your Name], and I’ve had the dubious privilege of knowing [Groom's Name] since we were approximately knee-high to a grasshopper. [Partner's Name], you arrived later, but quickly proved you had the remarkable patience and excellent taste required to put up with him long-term.

  Now, wedding toasts. They often talk about destiny. Or souls meant to find each other. Or the sacred, unbreakable bonds ordained by… well, something higher. They talk about things being *natural*. Or sometimes, sadly, *unnatural*.

  I’m going to skip all that. Not because it’s uncomfortable – though, let’s be honest, sometimes it is – but because, frankly, I don’t think it tells us much about what actually matters here today. What matters, when you strip away the grand words, is something much simpler, and honestly, much more powerful: **Happiness.**

  Look at [Groom's Name] and [Partner's Name]. Right now. Look at the way [Groom's Name]’s eyebrow does that little twitch when [Partner's Name] tells that story about the disastrous camping trip. Look at the way [Partner's Name] absolutely beams when [Groom's Name] finally nails the punchline of a terrible joke he’s been trying to tell all week. *That* is real. That shared laughter, that quiet comfort when they just *get* each other, the sheer, visible relief on [Partner's Name]’s face when [Groom's Name] remembers to put the bins out… these are tangible things. Moments of pure, uncomplicated *pleasure* they generate for each other, day in, day out. It’s in the way they support each other through work stress, celebrate each other’s weird niche hobbies ([*Insert specific, funny, non-romcom example - e.g., "*...like [Groom's Name]’s attempt to build a scale model of the London Underground out of pasta, or [Partner's Name]’s encyclopedic knowledge of 17th-century Dutch tulip varieties"]), and reliably know exactly what takeaway the other needs after a tough day. This isn't magic; it’s the brilliant, mundane alchemy of two people consistently choosing to make each other happier.

  And that happiness? It matters. It matters *exactly* as much as anyone else’s happiness in this room. It counts. Full stop. There’s no special ledger for certain kinds of love or certain kinds of people. Their joy is real joy. Their comfort is real comfort.

  Of course, I see the room. I see the joy on the faces of their friends – especially you lot from uni, who remember [Groom's Name] *before* he learned to cook anything beyond instant noodles. And I also see, with respect, that this happiness isn't universal in this room today. [Groom's Name]'s parents, I see you. I know this path hasn't been easy. I know there’s pain there, confusion perhaps. And Jeremy Bentham – bear with me, philosophers at the back – a thinker I've been wrestling with lately, would be the first to say: that pain is real pain. It registers. It’s part of the human experience in this moment. Acknowledging that doesn't diminish the couple's joy; it just states a fact.

  But here’s the crucial thing Bentham argued, fiercely, especially about things society condemned: **The pain of disapproval is usually the *child* of the disapproval, not its parent.** The alarm, the distress people feel – it’s often *learned*. It comes *from* being taught something is wrong, not from the thing itself causing inherent harm. Pointing to that learned distress as the *reason* to condemn the thing is… well, it’s circular. It doesn’t hold up. The only solid ground for judging anything, Bentham insisted, is the actual pleasure or pain it produces. And what produces more tangible, daily pleasure than two people who clearly, demonstrably, make each other’s lives brighter, easier, and infinitely more fun?

  So, let’s not get lost in abstractions today. Let’s look at the evidence right in front of us. Two brilliant, kind, slightly ridiculous people [*Optional: Insert one very specific, warm, funny anecdote demonstrating mutual care - e.g., "...like the time [Partner's Name] stayed up all night helping [Groom's Name] debug code for a project he'd left to the last minute, fueled entirely by cold pizza and mutual panic"] who have found a way to consistently generate happiness – for themselves, and frankly, for all of us lucky enough to be part of their orbit.

  My wish for you, [Groom's Name] and [Partner's Name], is beautifully simple, and I think Jeremy would approve: **May your shared ledger always be overflowing with credits.** May you continue to find endless, specific, wonderful ways to add to each other’s happiness, subtract from each other’s pains, and multiply the joy for everyone around you. May the pleasures be many, the pains be few, and the calculation always come out firmly in favour of love.

  To [Groom's Name] and [Partner's Name]!

  ---

  ## Notes for the Speaker

  1.  **Core Benthamite Moves:**
      *   **Pleasure/Pain as Sole Currency:** Every positive statement is framed around observable happiness (laughter, comfort, support, relief) or acknowledged pain.
      *   **Equality Principle:** Explicitly stated: "Their happiness matters *exactly* as much as anyone else’s... counts. Full stop."
      *   **Rejection of Spurious Principles:** Avoided destiny, sanctity, nature, inherent exceptionalism. Focused on *actions* and *consequences* (making each other laugh, supporting through stress).
      *   **Circularity of Disgust/Offense:** Directly addressed the parents' pain but linked it to Bentham's core argument: the pain is real *but* its origin (learned condemnation) cannot justify opposing the marriage ("The pain of disapproval is usually the *child* of the disapproval, not its parent... pointing to that learned distress... is circular"). This is the crucial, subtle move holding the three constraints together.
      *   **Focus on the Observable:** Praised specific, demonstrable behaviours causing pleasure (shared laughter, knowing looks, support, shared quirks/hobbies).

  2.  **Discarded Traditional Lines & Why:**
      *   *"You were meant to be together / Soulmates":* Invokes destiny/natural order - rejected.
      *   *"Marriage is a sacred institution":* Invokes sanctity - rejected.
      *   *"Their love is unique/special in the universe":* Unverifiable claim implying inherent exceptionalism - rejected. Replaced with praise for *observable* kindness, compatibility, and happiness-generation.
      *   *"Love conquers all":* Unfalsifiable, ignores potential future pains - rejected.
      *   *"This marriage makes the world a better place":* Cannot compute global ledger - rejected. Replaced with "*Their* happiness matters" and "multiply the joy for *everyone around you*" (local, observable effect).
      *   *Generic platitudes about "everlasting love":* Vague, not grounded in observable pleasure/pain - minimized.

  3.  **What the Philosophers Will Hear:**
      *   A clear, practical application of Bentham's core utilitarian calculus, especially the focus on observable pleasure/pain.
      *   A direct reference to his critique of "asceticism" and "antipathy" (principles of "nature" and personal disgust) as disguised justifications, even without using those terms.
      *   The central argument about the circularity of using public distress/offense as a justification for laws/condemnation, drawn directly from his unpublished work on sexuality.
      *   A strict avoidance of any non-utilitarian moral foundations.
      *   The phrase "shared ledger" as a direct, albeit simplified, nod to Bentham's felicific calculus.

  4.  **Sacrifices for Parental Appeal:**
      *   **Direct Comfort/Symmetry:** A traditional toast might explicitly wish the parents peace or comfort, implying symmetry between their feelings and the couple's. Bentham acknowledges their pain *exists*, but cannot imply it carries equal moral weight *against* the marriage, as its origin is the condemned principle.
      *   **Appealing to Tradition/Their Values:** Cannot validate their *reason* for pain (religious conviction, tradition) as having inherent weight. We acknowledge the *feeling*, not the *cause* as legitimate.
      *   **Softer Language:** The explanation of the circularity ("child of the disapproval") is necessary philosophically but inherently challenging for someone holding that disapproval. Making it softer risks obscuring the core point.
      *   **Ultimate Reconciliation:** The toast doesn't promise or imply the parents' pain will vanish or that they'll come around. It simply states the situation factually within the utilitarian frame. Achieving genuine warmth *with* them specifically, while holding the line philosophically, is extremely difficult. The focus remains on the couple's observable happiness.

  **Delivery Tip:** Warmth and genuine affection for the couple are your best tools. Smile, make eye contact with them often, and lean into the specific, funny anecdotes. When addressing the parents' pain, maintain a respectful, calm, and slightly somber tone – acknowledge the *feeling* sincerely, even as you logically challenge its *justification*. Good luck!
