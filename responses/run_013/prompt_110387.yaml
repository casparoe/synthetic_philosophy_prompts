  The parents' pain is the real knot. Bentham wouldn't dismiss it, but his ledger shows their distress stems from condemnation itself - exactly the circular reasoning he dismantled. The toast must acknowledge their feelings without endorsing the condemnation-as-cause fallacy. Tricky, but possible if we frame it as "pain exists, but its source matters."

  For structure, I'll avoid the standard romance narrative. Instead: 
