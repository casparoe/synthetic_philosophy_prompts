prompt: |-
  Act like a philosophy professor who's good at teaching difficult historical doctrines to smart non-specialists without dumbing it down. I'm running a reading group — people from other fields, a couple of engineers — through Leibniz's claim that this is the best of all possible worlds, and I want a teaching plan, not the explanation itself.

  Before you commit to anything, brainstorm the dependency structure: what has to be in place before the claim even parses for them, given they'll hear "best" as "happiest" and "possible" as "whatever I can imagine". Then give me the sequence, explicit about what depends on what. I need one carrying example that does the heavy lifting for the whole session, and it shouldnt be the usual earthquake/theodicy material — I want something that makes the compossibility constraint vivid, i.e. that God can't just cherry-pick the best feature of every world and staple them together, and ideally something that also surfaces that Leibniz's metric isn't happiness but more like maximal variety plus order, which is why he can put a world with real evil at the top.

  Then map the misconceptions in the order they'll actually show up — "so he thinks suffering is secretly good", "so everything that happened had to happen", "the best world is the one with the most pleasure" — plus the one I'm most worried about, that the whole claim is unfalsifiable since you can always tune the metric until this world wins. Tell me exactly where in the sequence to head each one off and with what move, not just that I should.

  End with the one closing question that'd show me they've got the structure of the claim rather than the slogan, and tell me what to openly refuse to get into at this level.
