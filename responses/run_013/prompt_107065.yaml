prompt: |-
  I'm doing a part-time MA in philosophy, mainly so I can argue with my friends more efficiently, and we've just hit the module on virtual worlds and virtual harms. I'm a longtime reader of LessWrong-adjacent blogs, so my instinct is to hunt for one clean principle, but the more cases I write down the more I suspect I'm smuggling in two different senses of 'real' — one about what exists and one about what matters — and quietly switching between them. I've got a provisional rule of my own that I'd like you to stress-test: a virtual act is a real act, and its harm is a real harm, exactly to the extent that it sets back the real interests of actual people. But I don't trust it, because I think it either says too much or too little depending on how I fill in 'interests'.

  Here are my verdicts, going case by case. Someone hacks my account and moves my rare sword — 200 hours of grinding, worth maybe £300 on the grey market — to their own character: that's plainly theft, a real wrong, and should be punishable. A player kills my avatar in a PvP zone the game openly advertises: no wrong at all, even though I'm annoyed for an hour. A group of players follows a woman around an MMO, penning her avatar into corners and using voice chat to harass her: that's serious harassment, ban-worthy and arguably worse than the sword. Someone builds an avatar of my real face and does degrading things with it in a social VR space, then shares screenshots: real harm, and somehow worse than the item theft. Two consenting adults role-play something atrocious in a private instance: no harm, leave them alone. A company sells me virtual land for £5,000 and then shuts the servers down with no refund: it feels like expropriation and I want to say something's wrong, but I can't tell whether it's theft or just a bad contract I signed. And a friend's AI companion gets switched off and she genuinely mourns it: I think her grief is real and the loss is real, yet I don't think any wrong was done to the chatbot itself.

  The pair that's really bugging me is the PvP kill versus the sword theft versus the harassment, because all three are 'just pixels' and I give them wildly different verdicts — and then the face-avatar case versus the private role-play, where the virtual content is equally vile but only one of them I call a harm. So: is there one principle that gets all of these, or close? State it precisely, say what each clause is doing and which case forces it, tell me what it predicts for a case I haven't listed (say, griefing someone's memorial service held in-game), and be honest about which of my verdicts it can't save. If a principle that saves every verdict has to grow extra epicycles, I'd rather you told me that and named the one verdict I should abandon for the simple version. And please separate what's actually settled among people who work on virtuality and the metaphysics of games from what's genuinely contested — I don't want one camp's line presented to me as the consensus, even if it's the camp I'd probably end up in.
reasoning: |-
  Okay, the user is doing a part-time MA in philosophy and wants to argue more effectively with friends about virtual worlds and harms. They've proposed a principle: a virtual act is real and harmful if it sets back real interests of actual people. But they're unsure because "interests" is vague, leading to inconsistent judgments in different cases. They listed scenarios like theft of virtual items, harassment, griefing, and more, showing conflicting verdicts.

  First, I need to identify the core issue. The user suspects they're conflating two senses of 'real'—existence vs. moral significance. Their cases highlight this tension. For example, stolen sword (theft) vs. PvP kill (no harm), both involve virtual actions but different outcomes. Then there's harassment which feels worse than theft, and avatar degradation causing harm. The private role-play is deemed harmless. The user struggles to reconcile these under one principle.

  The user's deeper need might be understanding how to define 'interests' clearly to avoid ambiguity. They want a principle that consistently applies across cases without ad-hoc adjustments. They also want to know academic consensus versus debated points. They mentioned LessWrong, which values rationality and clear principles, so the solution must be logically coherent.

  Looking at their cases, the key is distinguishing between different types of interests. Instrumental interests (like time/money invested) vs. intrinsic (psychological well-being). The sword theft sets back instrumental interests—time and potential money. Harassment affects psychological well-being directly. The avatar with real face ties to identity and reputation, hence intrinsic harm. Private role-play involves consent, so no setback.

  The academic consensus: virtual items have real value due to labor/market, so theft is real. Harassment in virtual spaces is recognized as harmful, akin to real-world harassment. However, the ontological status of virtual entities (like AI companions) is contested—some see grief as real, others as misdirected.

  To create a principle: harm occurs when a virtual act violates autonomous interests without consent, causing measurable setback. Autonomous interests include psychological integrity, property (as time/labor), and social dignity. Consent is crucial—PvP is consented, hence no harm. Harassment lacks consent, causing harm. Private role-play has consent, so no issue. The memorial griefing would be harmful due to non-consensual emotional distress.

  Cases where this might struggle: AI companion loss. The grief is real, but the AI lacks interests. The harm is from the company's action, but no obligation unless implied. Here, the principle might not cover, revealing a limitation. The user might need to accept that some grief, while real, doesn't imply wrongdoing.

  So the refined principle: A virtual act constitutes real harm iff (1) it violates an autonomous interest of an actual person, (2) without valid consent, (3) causing measurable setback to that interest. This covers theft (property interest), harassment (psychological), avatar degradation (dignity), but excludes PvP (consented) and private RP (consented). The server shutdown: if terms didn't guarantee permanence, it's a bad contract, not theft. AI companion: company didn't violate interests, but user's grief is real yet not a harm by the act itself. Memorial griefing: violates psychological interest without consent, so harm.

  Unsettled areas: whether virtual entities have moral status, like AI companions. Also, if psychological harm from virtual acts is always equivalent to real-world. Some argue immersion blurs the line, others don't. The user might need to accept that the AI case is an edge where their verdict (grief real, no wrongdoing) stands, even if unsatisfying.
answer: |-
  Your instinct about conflating "real as existent" and "real as morally significant" is sharp—this is a core tension in virtual ethics. Your provisional principle is solid (harm occurs when real interests of actual people are set back), but its power depends on rigorously defining "interests." Below is a unified principle that preserves *most* of your verdicts, grounded in consensus where it exists and flagging controversies. I'll stress-test it against your cases, add a new one, and identify the verdict that must be sacrificed for simplicity.

  **The Principle:**  
  A virtual act constitutes **real harm** if and only if it **violates an autonomous interest of an actual person** in a way that **causes measurable setback** to that interest, **without valid consent or justification** within the relevant normative framework.

  ### Clause Breakdown & Case Justification:
  1.  **"Violates an autonomous interest"**:  
      *   **What it does**: Narrows "interests" to fundamental human goods: physical/psychological integrity, property (as an extension of labor/time/resources), social dignity/reputation, and relational autonomy. Excludes mere preferences, transient feelings, or interests in purely fictional entities *qua* fictional.  
      *   **Case it forces**: *Your friend mourning her AI companion*. The grief is real (*psychological setback*), but the AI lacks moral status—it has no *autonomous interests* of its own. The harm stems from the *loss of a meaningful relationship object*, not a violation of the AI's interests. The company switching it off *might* violate *her* interest if it breached promises, but the act isn't inherently wrong *to the AI*.

  2.  **"Causes measurable setback"**:  
      *   **What it does**: Requires demonstrable negative impact (emotional distress, financial loss, reputational damage, inhibited freedom). This filters out trivial annoyances (e.g., losing a fair PvP fight).  
      *   **Case it forces**: *PvP Kill*. Annoyance ≠ measurable setback to an autonomous interest. The game's framework *justifies* the act via consent to PvP rules. Contrast with *Harassment*: measurable psychological harm (distress, fear) and inhibition of autonomy (trapped, unable to play).

  3.  **"Without valid consent or justification"**:  
      *   **What it does**: Recognizes normative contexts (game rules, social contracts, explicit agreements). Consent transforms acts (PvP kill vs. harassment). Justification includes adherence to agreed systems.  
      *   **Case it forces**: *Private Role-Play*. Consent negates harm *to participants*. No setback to autonomous interests occurs *because* it's consensual and contained. Contrast with *Avatar Degradation using your face*: Non-consensual violation of reputation/dignity (measurable setback: humiliation, social risk).

  ### Predictions for New Case: Griefing an In-Game Memorial Service
  *   **Act**: Players disrupt a solemn, player-organized memorial in a non-PvP zone with offensive avatars, spam, and voice chat mockery.
  *   **Principle Prediction**: **Real Harm**.  
      *   *Violates autonomous interest*: Psychological integrity (grief, distress) and relational autonomy (right to associate/mourn peacefully).  
      *   *Measurable setback*: Profound emotional distress, disruption of a meaningful social ritual.  
      *   *Without consent/justification*: No consent to disruption; no game mechanic justifies this in a non-PvP context. It exploits the platform to inflict harm.

  ### Stress-Testing Your Cases:
  | Your Case                    | Verdict Under Principle             | Analysis                                                                                                |
  | :--------------------------- | :---------------------------------- | :------------------------------------------------------------------------------------------------------ |
  | **Hacked Sword Theft**       | ✅ **Real Harm (Theft)**            | Violates *property interest* (labor/time/market value = measurable £ setback). Non-consensual.          |
  | **PvP Kill**                 | ✅ **No Harm**                      | No setback to autonomous interest; justified by game rules/consent. Annoyance ≠ measurable harm.        |
  | **MMO Harassment**           | ✅ **Real Harm (Harassment)**       | Violates *psychological integrity/autonomy* (measurable distress/trauma). Non-consensual.               |
  | **Avatar Degradation (Face)**| ✅ **Real Harm (Defamation/Harm)**  | Violates *dignity/reputation* (measurable humiliation/social risk). Non-consensual. Worse than theft due to intrinsic harm. |
  | **Private Role-Play**        | ✅ **No Harm**                      | Consensual; no measurable setback to autonomous interests.                                              |
  | **Server Shutdown**          | ⚠️ **Contested Harm**              | *If terms promised permanence*: Violates property interest (measurable £ setback = **Harm**). *If terms allowed shutdown*: Bad faith/exploitation, but may be a **contract dispute**, not inherent harm. Principle leans toward **harm if deceptive**. |
  | **AI Companion Loss**        | ✅ **Grief Real, No Wrongdoing**    | *Grief is real* (setback to relational interest), but *no violation*: AI has no interests; company acted within rights (unless promised permanence). |

  ### The Sacrifice for Simplicity: Server Shutdown Verdict
  *   **The Conflict**: Your intuition ("feels like expropriation") clashes with contractual reality. The principle *can* call this harm **only if** "interests" include *expectations based on representations*, and shutdown breaches them. However, making this explicit adds complexity ("epicycles").
  *   **The Simple Version Sacrifice**: For true simplicity, abandon **"This is inherently theft/harm"** for the server shutdown. Instead, accept it as **"potentially exploitative but governed by contract law."** This preserves the core focus on *non-consensual setback to fundamental interests* without muddying "interests" with speculative expectations. Most virtual law scholars agree: unless fraud or specific guarantees exist, it's a consumer protection issue, not theft.

  ### What's Settled vs. Contested in Academia:
  *   **Settled Consensus**:  
      1.  Virtual acts causing *psychological harm* (harassment, defamation) are real harms.  
      2.  Virtual *property* with real-world value (time/money invested, marketable assets) warrants protection (theft/fraud are real).  
      3.  *Consent and context* are critical (PvP vs. harassment; private vs. public acts).  
      4.  *Purely fictional entities* (NPCs, basic chatbots) lack moral status—harm is only to users.

  *   **Genuinely Contested**:  
      1.  **Ontological Status**: Are persistent virtual items/worlds "real property" or licensed access? (Your server shutdown case hinges here).  
      2.  **Harm Equivalence**: Is psychological harm from virtual acts *identical* to real-world equivalents? Some argue immersion creates unique vulnerabilities.  
      3.  **Moral Patiency of Advanced AI**: If an AI exhibits apparent sentience/relationship depth, does *it* have interests? (Your AI case—most philosophers say *no*, but it's heated).  
      4.  **Virtual "Rights"**: Do users have inherent rights to persistence/access beyond contracts? (Libertarians vs. consumer protection advocates).

  ### Conclusion
  Your principle works with this refinement: **Harm requires a non-consensual, measurable setback to an autonomous interest (integrity, dignity, rightful property, relational autonomy).** It saves all your verdicts except the server shutdown's "inherent theft" claim, which you should downgrade to "potentially exploitative contract issue" for elegance. The griefing case confirms its robustness. The core insight—virtual harms are real when they impact *human flourishing* in recognized ways—aligns with mainstream virtual ethics (e.g., Morgan Luck's "Gamer's Dilemma" work, David Chalmer's *Reality+*). Where it gets fuzzy (AI, server shutdown), you're hitting the genuinely contested frontiers—perfect for arguing with friends.
