  Here's my assessed probability decomposition for the coherence of Ockhamism without a privileged actual future, along with key sub-questions and a final synthesis. My framing leans into the philosophical tensions you've identified:

  **Overall Probability: 0.35**  
  (That Ockhamism can be coherently maintained *without* a privileged branch)

  ### Decomposition & Key Sub-Questions
  1.  **(a) Bivalence holds for future contingents (non-relatively)**  
      **Probability: 0.7**  
      *Justification:* Natural language and logical simplicity favor bivalence – "There will be a sea battle" *feels* like it must be true or false *now*, even if unknowable. Supervaluationist rejections (truth only relative to histories) seem technically coherent but linguistically revisionary for ordinary assertions. Ockhamism's appeal rests heavily on preserving this intuition.

  2.  **(b) Bivalence *requires* a privileged branch (truthmaker demand)**  
      **Probability: 0.3**  
      *Justification:* While a robust truthmaker theory (e.g., Armstrongian) pushes hard here, deflationary/disquotational views of truth ("'P' is true iff P") can arguably satisfy bivalence without ontological commitment to *the* future branch. Truth supervenes on *how the world is*, and if the world is genuinely open, "how it is" includes indeterminacy – the truthmaker for "will be P" might simply be the occurrence of P *when it happens*, not a present fact *about which branch is actual*. This is metaphysically lightweight but philosophically contentious.

  3.  **(c) The hard/soft fact distinction blocks fatalism non-ad-hoc-ly**  
      **Probability: 0.4**  
      *Justification:* This is Ockhamism's Achilles' heel. While intuitively plausible (e.g., "It was true yesterday that P" *feels* different from "Caesar crossed the Rubicon"), drawing a *principled*, non-circular criterion between "genuinely about the past" and "depends on the future" has proven notoriously difficult. Counterexamples abound (e.g., "God infallibly believed yesterday that P"). Many definitions seem tailored *specifically* to block fatalism, risking ad-hoc-ness. The distinction *can* be formally implemented in branching time semantics, but its *metaphysical justification* remains the core vulnerability.

  4.  **(d) The problem stems from misregimentation / we only need settledness**  
      **Probability: 0.6**  
      *Justification:* This is highly plausible. Ordinary language "will" often functions modally (like "going to" implying present tendency/plan). Peircean semantics (truth = settled truth) or relativistic views (truth assessed from the future) often align better with our experience of deliberation under openness. Insisting on a *momentaneous*, bivalent truth-value for raw future contingents might be imposing a metaphysical demand ("What is THE truth *now*?") that arises *only* from the formal semantics we choose, not from pre-theoretic intuition. Settledness is what matters for agency and inevitability; bivalent future truth might be a philosopher's artifact.

  **Combining the Terms:**  
  The overall probability depends heavily on the interaction of (b), (c), and (d).  
  *   **Path 1 (Ockhamist Success):** (a) True (0.7) *AND* (b) False (0.7) *AND* (c) True (0.4) *AND* (d) False (0.4) → ≈ 0.7 * 0.7 * 0.4 * 0.4 = **0.078**  
  *   **Path 2 (Alternative Vindicated):** (d) True (0.6) → **Undermines the need for Ockhamism**, rendering (a)-(c) moot for preserving openness. High probability this path exists.  
  *   **Path 3 (Privileged Branch Needed):** (a) True (0.7) *AND* (b) True (0.3) → **Requires privileged branch** (≈0.21), contradicting the goal.  

  **Synthesis to 0.35:** Path 1 is low (0.078), but Path 2 (d true ≈0.6) suggests the problem might dissolve, offering an *alternative* way to preserve openness without Ockhamism's baggage. Path 3 (privileged branch required ≈0.21) directly opposes the goal. The residual 0.35 reflects the *possibility* of Path 1 succeeding *despite* the odds, plus the weight of Path 2 not *refuting* Ockhamism but offering a *better* solution, and uncertainty in the interactions. My number leans towards instability.

  **The Term to Be Most Suspicious Of: (c) The Hard/Soft Distinction (0.4)**  
  This is the linchpin. If (c) fails, Ockhamism collapses into fatalism or requires the privileged branch it denies. Its historical resistance to a non-circular, widely accepted definition is a major red flag. Ask: "Can I state a criterion for hard/soft facts that doesn't rely on the *intuition* that past truth about futures shouldn't compel, and that withstands counterexamples like divine foreknowledge or 'It was causally determined yesterday that P'?"

  **What Would Move My Number Most:**  
  A compelling, non-question-begging, *metaphysical* criterion for the hard/soft fact distinction that robustly handles counterexamples and is grounded in something *other* than the need to block fatalism. If someone like Alvin Plantinga (defending a similar distinction for foreknowledge) or a contemporary Ockhamist (e.g., Trenton Merricks) offered a newly persuasive principle, I'd raise (c) significantly, pushing the overall number towards 0.5 - 0.6. Conversely, a devastating new counterexample or a clear argument showing the distinction is *incoherent* within branching time would drop it below 0.2, sinking the overall probability below 0.2.

  **Framing Mistake? Partial Yes.**  
  The question isn't strictly malformed, but it risks accepting Ockhamism's *framing* of the problem – that we *need* momentaneous bivalent truth for future contingents (rejecting (d)). **The strongest challenge to Ockhamism isn't necessarily needing a privileged branch *given* its assumptions, but that its core assumption (the need for bivalent, non-relative, momentaneous future truth) is itself the mistake.** If (d) is correct (as I lean), then the "problem" Ockhamism solves is largely self-created. The future is open because "will" statements often aren't the kind of thing that *have* a settled truth-value yet, not because we have a special way to block fatalism despite their current truth. Your credence of 0.55 suggests you sense this tension but still find Ockhamism's bivalence deeply compelling. Focus your paper on interrogating *that* intuition – is it bedrock or baggage?
