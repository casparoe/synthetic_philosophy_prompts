prompt: |-
  I teach a seminar on the ethics of drug policy and there's a pattern I keep running into that I've never seen named, and it's driving me a little nuts. Wondering if anyone has the term for it.

  Here's the shape. A jurisdiction softens the law on some drug — decriminalizes possession, or legalizes supply. Two or three years later everyone is waving numbers around, and Portugal gets cited at me from both directions, and the strange part is that both camps are waving the same numbers, because the numbers are all from the system that was just dismantled. Possession arrests are down by half, say. The reformers say: there, we stopped criminalizing users. The other side says: the users didn't go anywhere, they were moved — there's now a fine, a ticket, a referral to an assessment board, and because the threshold for those is lower than the threshold for arrest was, more people are inside the new machine than were ever inside the old one. And hardly anyone compares the new system's totals to the old system's totals, because they don't live in the same table. The old ledger is the scoreboard. The reform's own ledger — the one it built — never gets audited. So "it worked" means the old numbers went down, and "it failed" also means the old numbers went down, but the drug is still around.

  Second case I use in class. Retail supply gets legalized. Street-level seizures and possession arrests collapse, and that gets reported as crime falling. But the thing the old numbers were a rough proxy for — how much of the stuff is actually moving, who's getting the money, what's in it — was never measured directly, and is now measured by the licensed market's own reporting, which has every incentive to look healthy. So the reform appears to have solved a problem that was only ever visible through the lens the reform took away. I've watched the same movie with school discipline (suspensions down, police referrals up) and with immigration enforcement, so I dont think it's really about drugs.

  I know the neighbourhood here. Balloon effect: enforcement pushes production somewhere else. Net-widening: decriminalization pulls more people in through side doors. The iron-law thing where prohibition makes the substance stronger rather than rarer. And the old point that a measure stops measuring anything once people start managing to it. I'm not asking about those, I can recite those. I'm asking whether there's a name for the narrower thing: a reform that changes the unit of account and then gets graded in the old unit, so that the machinery the reform itself created is never the object of assessment, and one statistic can be read as vindication or as a shell game depending on which side of the aisle you're on. The part I care about is that nobody is cheating — the metric isn't being gamed, it's just no longer the thing, and everyone keeps scoring on it anyway.

  What I want out of this: if there's an established term, give it, and then tell me which of the concepts above it's closest to and exactly what it adds to that one — I won't be satisfied with a name and nothing else. If there isn't one, coin one, but I want the definition and the boundary and the edge cases, not a slogan. Three edges I'd want sorted: (i) does it still count if the new ledger is genuinely better and the activity really did shrink? (ii) what if the reform creates no new machinery at all and just deletes the old — is there still a phenomenon there, or does it need the migration into something? (iii) is the essential ingredient the relocation of the activity, or the inertia of the scoreboard? Those feel separable to me and I suspect they only travel together sometimes.

  I'm a philosopher by trade, so what I'm really after underneath is the general shape: what happens to a normative vocabulary when the practice that gave it its point has been replaced and the vocabulary just stays put. But start with the concrete thing.

  End with a single last line of the form \answer{...} — either the established term, or \answer{none — <your coinage>} if you're coining it. One term, short.
reasoning: |-
  Hmm, the user is describing a very specific conceptual problem in policy evaluation and wants to know if there's a term for it. They teach a seminar on drug policy ethics and keep encountering a pattern where policy changes (like decriminalization or legalization) lead to conflicting interpretations of the same data. Both supporters and opponents point to declining arrest numbers as evidence - reformers say it proves success by reducing criminalization, while critics argue it just moves people into different systems (fines, assessments) without addressing the core issue.

  What makes this pattern interesting is that:
  - Everyone keeps using the old metrics (arrest stats) to evaluate the new system
  - The new system's own metrics (fines issued, assessments conducted) aren't being compared or audited
  - This creates a situation where the same statistic can be interpreted as either success or failure
  - The phenomenon appears in multiple domains beyond drug policy (school discipline, immigration)

  The user has already considered related concepts like balloon effect, net-widening, prohibition's iron law, and Goodhart's law, but these don't quite capture this specific dynamic. They want to know if there's a term for when a reform changes the measurement system but everyone keeps evaluating it using the old metrics, making the new system's performance invisible.

  Key aspects they want clarified:
  1) Does it still apply if the new system is genuinely better and activity decreased?
  2) What if the reform simply removes old systems without creating new ones?
  3) Is the core issue the relocation of activity or the persistence of old metrics?

  Philosophically, they're interested in how normative language persists after the practices it described have changed.

  After considering various possibilities:
  - "Metric fixation" (Muller) is close but too broad
  - "Legacy metric trap" captures the persistence aspect but might imply intentionality
  - "System displacement blindness" emphasizes the failure to see the new system
  - "Policy evaluation lag" is descriptive but not precise enough

  The most precise fit seems to be "metric inertia" - the persistence of obsolete measurement frameworks after systemic change. This emphasizes the automatic continuation of old evaluation habits rather than intentional deception.

  Boundary clarifications:
  1) Yes, it still applies even if the reform worked - the issue is methodological, not outcome-dependent
  2) If no new system is created, it doesn't apply - requires migration to something new
  3) The core is the inertia of the scoreboard - the relocation enables but isn't essential

  The coinage "metric inertia" seems most accurate and useful for their needs.
answer: |-
  Based on your detailed description, the specific phenomenon you're identifying—where a policy reform changes the measurement system ("unit of account"), yet evaluation remains fixated on legacy metrics from the abolished system, rendering the new system's outcomes invisible—**lacks a single established term**. While adjacent concepts like Goodhart's Law (metric distortion), net-widening (system expansion), or policy feedback loops touch on aspects, none capture the core dynamic you've articulated: the **inertia of the scoreboard** overshadowing the reform's own machinery.

  ### Proposed Coinage: **Metric Inertia**  
  *Definition*: The persistent reliance on legacy metrics to evaluate a reformed system, despite a fundamental shift in the underlying institutional machinery, rendering the new system’s performance invisible and enabling contradictory interpretations of the same data.  

  ### Boundaries & Edge Cases  
  1. **Does it apply if the new system is better and activity shrank?**  
     - **Yes**. Metric inertia occurs regardless of the reform's actual success. Even if the new ledger is superior and activity decreased, evaluation remains anchored to the old metric (e.g., "arrests are down" dominates discourse, while improved health outcomes are ignored). The *inertia* is in the evaluation framework, not the outcome.  

  2. **What if the reform deletes the old system without creating a new one?**  
     - **No**. Metric inertia requires a *migration* of activity into a new institutional framework (e.g., arrests → fines + assessments). If the reform simply abolishes measurement (e.g., stop collecting data entirely), the phenomenon doesn't arise—there's no "new ledger" to ignore, just data absence.  

  3. **Core: Relocation of activity vs. inertia of the scoreboard?**  
     - **The inertia of the scoreboard is essential**. Relocation enables the paradox (same activity, different measurement), but the defining feature is the *evaluative stagnation*—using outdated metrics as the primary scorecard. Relocation without inertia (e.g., rapid adoption of new metrics) avoids the issue.  

  ### Relation to Adjacent Concepts  
  - **Goodhart's Law** ("when a measure becomes a target, it ceases to be a good measure") is a cousin but focuses on *gaming*. Metric inertia involves no gaming—the metric is obsolete, not corrupted.  
  - **Net-Widening** describes system expansion but doesn't address the *evaluative mismatch* (old metrics grading new systems).  
  - **Policy Feedback Loops** explain how systems reinforce themselves but don't highlight the *legacy metric trap*.  

  ### Why "Metric Inertia"?  
  - **Inertia**: Emphasizes the unstoppable momentum of old frameworks, persisting without active malice.  
  - **Metric**: Specifies the root is measurement, not just policy or rhetoric.  
  - **Adds value**: It isolates the *evaluative blind spot* created when institutional change outpaces methodological adaptation.  

  ### Philosophical Core  
  This reflects a **normative vocabulary lag**: when practices evolve but the language of evaluation remains moored to extinct institutional logics. The "point" of the old vocabulary (e.g., "crime reduction" tied to arrests) loses coherence, yet it endures, distorting discourse.  

  \answer{none — metric inertia}
