answer: |-
  Here's the WW1 "war guilt" dispute reframed in causal inference terms, followed by a residue report on translation fidelity. I'll strictly use your requested vocabulary and address your suspicions head-on.

  ---

  ### **Causal Inference Restatement of the Dispute**
  **Unit of Analysis:** The European state system in July-August 1914.  
  **Outcome (Y):** Binary onset of continental war by August 4, 1914 (Austria-Hungary vs. Serbia escalating to general war).  
  **Treatment (T):** German foreign policy posture (binary: "expansionist/deliberative risk-acceptance" vs. "status quo/restraint").  
  **Target Counterfactual:** Y(1) - Y(0), where:  
  - *T=1*: Observed German policy (blank check to Austria, mobilization timings, rejection of mediation).  
  - *T=0*: Hypothetical German policy (restraint: no blank check, delayed mobilization, acceptance of mediation).  

  **Key Confounders (Z):**  
  - *Systemic militarism* (arms race dynamics)  
  - *Alliance rigidity* (entente vs. triple alliance)  
  - *Austro-Hungarian revanchism* (desire to punish Serbia)  
  - *Russian pan-Slavism*  
  - *French revanchism* (Alsace-Lorraine)  

  **Mediators (M):**  
  - Austrian ultimatum severity → Serbian rejection  
  - Russian mobilization speed → German Schlieffen activation  
  - British intervention decision  

  **DAG Disagreement:**  
  - **Fischer camp DAG:** T (German policy) → Y, with T confounded by Z (domestic pressure/militarism). Minimal M blocks.  
  - **"Slide" camp DAG:** T ↔ Y (bidirectional arrows), with Z (systemic factors) as parent of all nodes. M (mediators like Russian mobilization) as necessary colliders.  

  **Causal Estimands in Dispute:**  
  1. **Average Treatment Effect (ATE):** E[Y(1) - Y(0)]  
     - Fischer: ATE > 0 (war probability higher under T=1)  
     - Critics: ATE ≈ 0 (war occurs under T=0 via other paths)  
  2. **Probability of Necessity (PN):** P(Y(0)=0 | T=1, Y=1)  
     - *"But for German policy, would war have been avoided?"*  
  3. **Probability of Sufficiency (PS):** P(Y(1)=1 | T=0, Y=0)  
     - *"Was German policy alone sufficient to cause war?"*  
  4. **Mediated Attribution:** % of effect via Austrian ultimatum (path T→M₁→Y) vs. Russian mobilization (T→M₂→Y).  

  **Fundamental Problem:** Single realization (n=1). We observe Y(1)=1 but never Y(0). All estimands require untestable assumptions (e.g., consistency, no interference, positivity).  

  ---

  ### **Residue Report**  
  **What Translated Cleanly:**  
  1. **DAGs as core dispute:** Yes, historians argue over graph structure. Fischer posits *T* as root parent; critics add bidirectional edges (e.g., Russian mobilization → German mobilization) or make *Z* dominant.  
  2. **Confounding:** Domestic politics (e.g., German industrialists) as confounder Z affecting both T (policy) and Y (war) is explicitly debated.  
  3. **Mediation:** Chains like "Blank Check → Austrian Ultimatum → Russian Mobilization" are analyzed as mediated paths.  
  4. **PN/PS as "blame" quantifiers:** PN formalizes *"necessary cause"* critiques; PS formalizes *"sufficient provocateur"* claims.  
  5. **Fundamental problem:** Historians implicitly acknowledge SUTVA violations (e.g., "what if UK stayed neutral?" is a counterfactual with interference).  

  **What Required Bending:**  
  1. **Treatment definition:** "German policy" isn't binary. Bending required to force it into T=1/0. Real exposure is continuous (e.g., degree of risk-acceptance).  
  2. **Counterfactual baseline (T=0):** "Germany without expansionism" is ill-defined. Historians argue over *what T=0 entails* (e.g., "Is a status quo Germany even possible given Z?"). This isn't a positivity violation—it's conceptual underspecification.  
  3. **PN/PS collapse:** In deterministic views (war was inevitable), PN=1 and PS=1 for multiple "causes." Graded blame is recovered by:  
     - Stochastic reinterpretation: PN/PS as *propensities* (e.g., "war probability under T=0 was 30%, so PN=0.7").  
     - Path-specific effects: Blame shared via mediation (e.g., 40% through Austrian path, 30% Russian).  
  4. **Unit homogeneity:** Treating "Europe 1914" as a single unit ignores spatial interference (e.g., Balkan crises vs. colonial tensions).  

  **What Has No Counterpart:**  
  1. **Normative agency:** *Guilt* requires:  
     - **Moral agent:** Causal inference treats "Germany" as a node, not an entity with *intent* or *capacity for blame*.  
     - **Violated norm:** No DAG encodes "unjustified aggression" as a variable.  
     - **Counterfactual freedom:** "Could Germany have chosen T=0?" is a metaphysical question (no causal analog).  
  2. **Reparations logic:** *Licensing punishment* relies on:  
     - **Desert basis:** PN/PS measure probabilistic necessity, not *deserved consequences*.  
     - **Collective responsibility:** Causal inference can't apportion blame to a *nation* vs. leaders vs. systems.  
  3. **Intentionality:** Historians debate if Germany *wanted* war (a mental state). Causal inference only handles *actions* (treatments).  

  ---

  ### **Addressing Your Suspicions**  
  1. *"Arguing about the graph? Unfalsifiable?"*  
     - **Yes, but worse.** They argue over *unknowable* graph structures (no experimental data). DAGs clarify assumptions but can't resolve disputes. The disagreement is *underdetermined* by evidence.  

  2. *"Attributable fraction ill-posed?"*  
     - **Ill-posed as causal query.** Requires a well-defined T=0 ("no drive for world power"), which doesn't exist in a vacuum. Historians use *narrative counterfactuals* (e.g., "If Bethmann-Hollweg acted like Bismarck...") as imperfect baselines. The guilt question morphs into: *"Under which plausible T=0 would Y=0?"* — a question of historical judgment, not statistics.  

  3. *"PN/PS collapse in deterministic systems?"*  
     - **Collapse happens, but historians evade it** by:  
       - Implicit stochasticity (e.g., "war was 95% likely under T=1, 20% under T=0" → PN=0.8).  
       - Path-specific attribution ("Germany caused the *timing* but not the underlying conflict").  
     - Graded blame survives via *contingency* (how sensitive Y is to minor T changes).  

  4. *"Normative layer scrubbed out?"*  
     - **Correct diagnosis.** Causal inference:  
       - Erases *intent* (replacing "will to war" with "policy as treatment").  
       - Neutralizes *guilt* (replacing with PN/PS probabilities).  
       - Ignores *reparations justification* (no estimand for "owed amends").  
     - Historians' "guilt talk" *is* doing normative work: It frames causation as *culpability* for audiences (e.g., Versailles negotiators). Your vocabulary exposes this as *non-causal* add-on.  

  ---

  ### **The Bottom Line**  
  **What causal inference clarifies:** The logical structure of necessity/sufficiency claims; how confounding (systemic factors) dilutes blame; mediation as shared responsibility.  
  **What it can't resolve:** Whether Germany was "guilty," because *guilt* imports agency, morality, and collective punishment — concepts foreign to potential outcomes.  
  **What historians have that you lack:** Narrative counterfactuals ("What if Franz Ferdinand lived?") as *plausible baselines*, and comfort with underdetermination.  

  **Historiography Fidelity Note:** I've simplified Fischer vs. Clark/Mommsen debates but preserved core tensions. The "slide" camp isn't monolithic—some emphasize Russian mobilization (M) as key mediator, others treat Z (systems) as primary. No bluffing detected.
