answer: |-
  Here’s your Q&A prep sheet, structured by objection severity (high to low damage), tailored to your audience, with concise replies and vulnerability flags. Concessions and "prayer question" at the end.

  ### **Top 8 Objections & Replies**
  *(Ordered by potential damage)*

  1. **Economist (Discounting Expert):**  
     *"If 'cold akrasia' leaves no revealed preference trace (no conflicting choice), how can we empirically distinguish it from a standard preference shift? Your 'diagnostic' fails if commitment devices work identically in both cases."*  
     **Reply (2 min):** "Commitment devices *should* fail in cold akrasia when the agent *judges* they don’t need them (no felt conflict), but succeed in discounting cases (where conflict is acknowledged). Look for agents who reject commitments *despite* insisting they intend to φ. That’s the empirical signature."  
     **Thin Spot:** Relies on self-reports (economists distrust these).

  2. **Philosopher (Self-Governance):**  
     *"Aren’t you smuggling in a homunculus? If the 'will' fails to 'pick up' a second-order volition, what *is* the will besides a failure of agency?"*  
     **Reply (2 min):** "I’m not positing a homunculus but a *structural failure in practical reasoning*. The will isn’t an entity—it’s the dynamic process of enacting endorsed preferences. Cold akrasia is that process stalling despite no opposition."  
     **Thin Spot:** Needs deeper metaphysics of "process" to satisfy philosophers.

  3. **Economist (Commitment Devices):**  
     *"My field experiments show commitment savings work even for people who claim they 'wanted to save all along'. That contradicts your diagnostic—it suggests they *had* conflicting preferences."*  
     **Reply (2 min):** "Not necessarily. They might be *misdiagnosing* their own akrasia. Alternatively, commitments may work by *externalizing* will-engagement (e.g., making inaction harder), not resolving preference conflicts. We need finer-grained self-reports + choice data."  
     **Thin Spot:** Field data trumps theory; you need a test to reclassify subjects.

  4. **Philosopher (Moral Psychology):**  
     *"Your 'levels' sound like Frankfurt, but he treats second-order volitions as *constitutive* of agency. If the agent endorses φ-ing but doesn’t φ, isn’t that just a *different* first-order desire winning?"*  
     **Reply (2 min):** "Frankfurt requires coherence between orders for agency. I’m isolating cases where *no* first-order desire opposes φ—e.g., procrastination without temptation, just inertia. The conflict is between endorsement and *enaction*, not desires."  
     **Thin Spot:** Philosophers may argue inertia *is* a first-order state.

  5. **Economist (Multi-Selves):**  
     *"This is just a rewording of myopia with asymmetric information. Your 'Friday self' judges correctly, but your 'Tuesday self' lacks insight into its own preferences."*  
     **Reply (2 min):** "In standard myopia, Tuesday *prefers* the vice (e.g., $10 now > $15 later). In cold akrasia, Tuesday *prefers* virtue ($15 later) but still grabs $10—contradicting revealed preference. It’s a breakdown of preference-*expression*, not preference-*formation*."  
     **Thin Spot:** Economists may see this as an exotic preference.

  6. **Philosopher (Intention):**  
     *"How can you 'judge you have most reason to φ' without forming an intention? If you form the intention and don’t act, that’s weakness of will—which *does* involve conflict."*  
     **Reply (2 min):** "Intention-formation can be decoupled from judgment (e.g., 'I should exercise, I’ll do it later'). Cold akrasia is when judgment *fails to generate* intention. Weakness of will is intention *overcome* by desire."  
     **Thin Spot:** Blurs intention/judgment distinction; requires cognitive psychology.

  7. **Economist (Welfare):**  
     *"If there’s no preference conflict, why call it a *failure*? Maybe the agent just doesn’t care enough to act. Isn’t this trivial?"*  
     **Reply (2 min):** "The puzzle is *avowed* care without action. Agents report anguish over inaction despite 'no excuse'—suggesting a rupture between valuation and motivation. It’s non-trivial in psychiatry (e.g., depression) and philosophy (e.g., Sartrean bad faith)."  
     **Thin Spot:** Economists may dismiss anguish as noisy data.

  8. **Behavioral Econ Group:**  
     *"Why reject discounting as *part* of the story? Cold akrasia could be extreme present bias (β≈0) or misestimation of future costs."*  
     **Reply (2 min):** "Discounting implies the *reward* is devalued. In cold akrasia, the reward is fully valued—it’s the *action* that isn’t initiated. Think: valuing a gym session but being unable to *start* driving there."  
     **Thin Spot:** Overlaps with "procrastination costs" literature.

  ---

  ### **First 3-Minute Concessions**  
  *(Disarm critics early)*  
  - "I concede discounting models *perfectly* capture intertemporal conflict—my claim is they don’t exhaust *all* akrasia."  
  - "I grant that 'levels of preference' need rigorous operationalization for empirical work—this is a conceptual foundation."  
  - "Yes, cold akrasia may be rare outside pathologies—but its possibility challenges our models of agency."

  ### **The Prayer-Nobody-Asks Question**  
  **Philosopher/Economist Hybrid:**  
  *"If cold akrasia involves no competing desire, no preference inconsistency, *and* no irrational belief—what positive mechanism causes inaction? Isn’t 'will failure' just a name for our ignorance?"*  

  **Why it’s deadly:** Forces you to speculate on neural/mechanical causes (e.g., "dorsolateral prefrontal cortex dysfunction")—which you likely lack evidence for—or admit it’s a placeholder. It exposes the thinnest part of your thesis.

  **Mitigation Strategy:**  
  *"I’m offering a *phenomenological* distinction to refine theory. The mechanism could be computational (e.g., failed 'action initiation' in cognitive science) or metaphysical (e.g., non-causal agency gaps). Either way, lumping it with discounting obscures inquiry."*

  ---

  ### **Tactical Notes**
  - **Economists:** Focus on *testability* and *anomalies in existing models*. Use "revealed preference" language.  
  - **Philosophers:** Emphasize *phenomenology* (the agent’s experience) and *conceptual taxonomy*.  
  - **Both:** Stress this *enriches* both fields: economists get new heuristics for commitment puzzles; philosophers get a clearer action-theory map.  
  - **When Thin:** Say, "That’s beyond this paper’s scope, but crucial for future work."  

  Good luck—your thesis is philosophically sharp and economically provocative. Hold the line on the levels distinction.
