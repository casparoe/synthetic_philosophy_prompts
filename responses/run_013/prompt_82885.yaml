prompt: |-
  I am the consulting historian for a new permanent gallery at a natural history museum, and over the next five months I have to write or approve roughly 120 object labels, a dozen audio stops, and an eight-minute film script. The gallery's thesis is that non-human things — pathogens, climate, volcanoes, pests, soils — have been actors in human history, not scenery. That thesis is currently getting me into trouble from two directions at once. A reviewer from the history department objects that my drafts are environmental determinism with better production values, and that we are reviving a tradition whose worst versions ranked peoples by climate. A reviewer from the earth sciences side objects that when we hedge, we bury the actual physical evidence behind a fog of agency-talk about emperors and merchants, and end up telling the same old story in which only people do anything.

  What I need from you is a decision procedure my label writers can actually run — people with good general educations and no graduate training in history, working about ten minutes per label, under a hard sixty-word limit, at a reading level a fourteen-year-old can follow, with no footnotes and no citations. Each label has to survive review by the lead curator, by an external historian, and — for the sections on plague and on the conquest of the Americas — by a community advisory panel. The procedure should return one of a small fixed set of verdicts, and for each verdict it should say what wording that verdict licenses in sixty words. It needs to contain, at minimum:

  1. The questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a human being because the question is one of values rather than evidence — and which human being that is.
  2. A rule about grammar, since I have noticed that agency gets smuggled in by syntax: when a non-human factor may be the subject of the sentence, and when it may appear only as a modifier, a date, or a background clause.
  3. A rule for the four-way case where the physical evidence is settled but the historiography is not, and the reverse.
  4. A screen that separates a claim about how a non-human factor shaped the terms in which things happened from a claim that it explains why one people's history diverged from another's.
  5. Something to do about the fact that "the mosquito," "the volcano," and "the plague" are shorthand for long chains of engineering, settlement, trade, and finance — so that naming the natural thing as the actor sometimes hides the human decisions that made it decisive.

  Then run the procedure on three cases and show me the labels it produces: the volcanic dust veils of 536–541 and the Justinianic plague that followed; the 1815 Tambora eruption and the harvest failures of the following year; and the malaria epidemic and famine in Egypt in 1942, which I have been quoting in the form of Timothy Mitchell's argument that the mosquito did more killing there than the battle everyone remembers. I expect one of the three to come out in a way I will not like, and I want that one flagged and argued rather than softened.

  Finally, tell me what the procedure cannot do, and where a writer who follows it will still produce something a good historian would object to. Do not send me a reading list; I need the procedure, not the bibliography.
reasoning: |-
  Okay, the user is a consulting historian for a natural history museum's new gallery. They're developing a gallery that positions non-human elements—like pathogens, climate, and volcanoes—as active players in human history, not just background. But they're facing criticism from two sides. Historians accuse them of environmental determinism, while earth scientists say they're not emphasizing physical evidence enough when they hedge. 

  The user needs a practical decision procedure for label writers. These writers have general education but no graduate history training, and they work under strict constraints: 60 words per label, 10 minutes per label, readability for a 14-year-old, no citations. Each label must pass multiple reviews, including curators, external historians, and community panels. The procedure must output clear verdicts with approved wording templates.

  Breaking down their requirements: They need 1) a step-by-step question flowchart that stops at "no" or escalates to human judgment (specifying who), 2) grammar rules to prevent agency smuggling via syntax, 3) rules for when physical evidence vs. historiography conflicts, 4) a screen to distinguish non-human factors shaping events vs. explaining historical divergence between peoples, and 5) a way to handle shorthand terms (like "the mosquito") that mask human decisions.

  Then they want the procedure tested on three cases: 6th-century volcanic dust veils and plague, 1815 Tambora eruption, and 1942 Egypt malaria epidemic (referencing Timothy Mitchell). They explicitly want one outcome to be deliberately unsatisfying to demonstrate rigor.

  Finally, they need limitations outlined—where the procedure will still fail despite being followed. No bibliographies; pure practicality.

  Hmm... The core tension is balancing material reality with historical contingency without falling into determinism or human-exceptionalism. The grammar piece is especially sharp—passive voice could inadvertently give nature "intent," or hedging could erase it entirely. 

  For the decision procedure, maybe a four-step filter:
  1. **Evidence Check:** Is there scientific consensus on the natural event? (Escalate to earth science reviewer if unclear)
  2. **Historiography Check:** Is there consensus on human responses? (Escalate to history reviewer if contested)
  3. **Agency Screen:** Does the claim attribute divergence between groups to nature? (Automatic "no" if yes—that's the determinism trap)
  4. **Human Nexus Test:** Does phrasing obscure critical human choices enabling the natural impact? (Requires rewrites)

  Grammar rule: Non-human subjects only for direct physical actions ("ash blocked sunlight"), never for outcomes involving society ("famine killed"). Modifiers for context ("during a drought").

  For the "shorthand" problem (requirement 5), enforce "through" or "combined with" language to expose human links: e.g., "Malaria spread through troop movements" not "mosquitoes caused deaths."

  Testing the cases:
  - **536-541 Dust Veils/Plague:** Passes checks. Science consensus on volcanoes/climate; historiography on plague spread settled. Label can say volcanoes altered climate *and* human movement spread plague.
  - **Tambora 1815:** Science solid on eruption→cooling. But historiography on "Year Without a Summer" blames governments for poor response. Highlight human decisions in label.
  - **Egypt 1942:** Tricky. Mitchell argues mosquitoes > Rommel, but procedure flags "mosquito did more killing" as shorthand hiding war logistics (requirement 5). Verdict: "no" unless rephrased to show *how* war enabled malaria. User won't like this—which is exactly what they requested for one case.

  Limitations: The procedure can't resolve deep historiography splits (e.g., "Little Ice Age" agency debates). It may oversimplify when human/nature boundaries blur (e.g., domesticated crops). And 60 words will *always* sacrifice nuance—that's inherent.

  Biggest risk: Writers might still imply "volcanoes changed history" passively, suggesting inevitability. But the grammar rules should catch that. Time to draft the full procedure...
answer: |-
  Here is a decision procedure designed for your constraints, followed by its application to your cases and an analysis of limitations.

  **Label Writing Decision Procedure: "Non-Human Actors in History"**

  **Core Principle:** Focus on **interaction**, not causation. Show *how* non-human factors constrained, enabled, or interacted with human societies and choices, not *why* societies succeeded/failed relative to others.

  **Verdicts & Licensed Wording (60 words max):**
  1.  **VERDICT: INTERACTION CONFIRMED (IC):** "Licenses naming the non-human factor as the subject of a physical action verb. Must show the human context of vulnerability/response."
  2.  **VERDICT: HUMAN NEXUS REQUIRED (HN):** "Licenses naming the non-human factor ONLY as context (prepositional phrase, background clause) or modifier. Requires explicit mention of key enabling human decisions/systems."
  3.  **VERDICT: ESCALATE TO REVIEWER (ESC):** "Stops procedure. Writer flags specific conflict (evidence/historiography/values) for designated reviewer."
  4.  **VERDICT: NO - DETERMINISM RISK (ND):** "No label passes without major conceptual rewrite. Triggered by attributing societal divergence primarily to nature or implying inevitability."

  **Procedure Flow (Ask Sequentially):**

  1.  **EVIDENCE CHECK:** Is there robust, consensus scientific evidence *for the specific physical event/process and its immediate physical effects* (e.g., volcanic eruption causing cooling, pathogen identified, insect vector proven)?
      *   **Sufficient Answer:** Yes (peer-reviewed consensus from relevant earth/life sciences).
      *   **Insufficient/Unclear Answer:** ESC to **Earth Science Reviewer**.
      *   **No:** ND. (Can't base label on disputed physical core).

  2.  **HISTORIOGRAPHY CHECK:** Is there broad historical consensus on the *human societal conditions* that made this event impactful (e.g., existing trade routes for plague, agricultural dependence for famine, specific policies/practices increasing vulnerability)?
      *   **Sufficient Answer:** Yes (major scholarly agreement on vulnerability factors/circumstances).
      *   **Insufficient/Contested Answer:** ESC to **External Historian Reviewer**. (Focus: *"What vulnerability factors are least contested?"*).
      *   **No:** HN (Proceed cautiously, focus only on undeniable physical context + human actions).

  3.  **AGENCY SCREEN:** Does linking this non-human factor to the historical outcome *primarily explain why one group's experience differed fundamentally from another group's*? (e.g., "Volcanic cooling doomed Society A, while Society B thrived").
      *   **Yes:** ND. (Determinism risk - stop).
      *   **No:** Proceed.

  4.  **HUMAN NEXUS TEST:** Is the shorthand term ("the volcano", "the mosquito") masking **critical, specific human decisions or systems** that were *necessary* for the non-human factor to have its historical impact? (e.g., war moving troops into malarial zones, trade networks spreading plague, lack of grain reserves making famine inevitable, policies ignoring warnings).
      *   **Yes:** HN verdict. *Requires* mention of key human factor(s).
      *   **No:** IC verdict likely.

  5.  **GRAMMAR RULE:**
      *   **IC Verdict:** Non-human factor *can* be **subject** of a **physical action verb** directly related to its scientifically confirmed effect (e.g., "Volcanic ash *blocked* sunlight," "Plague bacteria *killed* people," "Drought *parched* crops"). *Must* be followed by a clause/phrase showing human context/response.
      *   **HN Verdict / General Rule:** Non-human factors *cannot* be the subject of verbs implying societal change, causation of complex events, or intent. They appear as: **Prepositional Phrase:** ("During widespread malaria..."), **Modifier:** ("Malaria-carrying mosquitoes..."), **Background Clause:** ("As temperatures cooled after the eruption...").
      *   **Never Allowed:** Non-human factors as subject of verbs like: "caused collapse," "changed history," "defeated," "led to," "forced migration" (unless modified by "helped," "contributed to," *and* human context is explicit).

  **Applying the Procedure to Your Cases:**

  **1. Case: 536-541 Dust Veils & Justinianic Plague**
  *   **E1:** Yes (Ice core/tree ring evidence for severe cooling; *Yersinia pestis* identified).
  *   **H1:** Yes (Consensus cooling caused hardship; consensus plague spread via Mediterranean trade/imperial movement).
  *   **A1:** No (Not explaining divergence *between* societies here, just impact).
  *   **N1:** Yes! "Plague" masks human trade networks & imperial movement enabling spread.
  *   **Verdict:** HN (Human Nexus Required)
  *   **Label (58 words):** *Widespread volcanic ash after 536 CE dimmed the sun for years, weakening harvests. Within this strained world, the Justinianic Plague emerged. Carried along bustling Roman trade routes and by moving armies, the deadly bacteria found dense populations with little immunity. The resulting pandemic devastated communities across the Mediterranean, killing millions amid existing challenges.* (Highlights: Ash = modifier ("dimmed" implied human experience). Plague emergence = stated. Human nexus = "trade routes," "moving armies," "dense populations". Impact = "devastated communities").

  **2. Case: 1815 Tambora Eruption & 1816 "Year Without a Summer"**
  *   **E2:** Yes (Clear link: eruption → stratospheric aerosols → global cooling → frosts/failed harvests 1816).
  *   **H2:** Yes (Consensus: Severe harvest failures occurred in NH; varied societal responses/policies mattered).
  *   **A2:** No (Focus on event impact, not inherent societal divergence).
  *   **N2:** Yes! "Harvest failures" mask dependence on specific crops/vulnerable agriculture and varying government responses (e.g., grain taxes, relief efforts).
  *   **Verdict:** HN (Human Nexus Required)
  *   **Label (60 words):** *The massive 1815 eruption of Mount Tambora filled the atmosphere with ash, causing extreme global cooling in 1816. "The Year Without a Summer" brought frosts and relentless rain. These conditions ruined harvests across Europe and North America. Famine struck hardest where poor infrastructure, high food prices, and limited government aid left populations most vulnerable to the lost crops.* (Highlights: Eruption = subject of physical action ("filled"). Cooling = modifier ("These conditions"). Human nexus = "dependence," "poor infrastructure," "high prices," "limited aid").

  **3. Case: 1942 Egypt Malaria Epidemic & Famine (Mitchell's Argument)**
  *   **E3:** Yes (Malaria transmission proven; *Anopheles* mosquito vector; famine conditions documented).
  *   **H3:** **Contested.** Strong evidence for malaria/famine deaths. *Causal weight* vs. battle (Mitchell's core argument) is a significant historiographical *interpretation*, not settled consensus. Military vs. epidemic death tolls debated.
  *   **A3:** **YES - FLAGGED.** Mitchell's *comparison* ("mosquito did more killing than the battle") inherently frames the mosquito as the *primary reason* for the scale of death *compared to* the human conflict (Rommel). This directly addresses divergence in causal impact (nature vs. human warfare). Triggers determinism risk screen (A3).
  *   **Procedure Path:**
      *   E3: Yes.
      *   H3: Contested (Causal weight interpretation). → **ESC to External Historian Reviewer.** *Question:* "Can we accurately state the mosquito/battle comparison as settled fact without endorsing one contested interpretation?" Likely Reviewer Decision: **ND (No - Determinism Risk)**, due to the inherent comparative claim being the thesis' core vulnerability. Mitigation impossible in 60 words without misrepresentation.
  *   **Label Under ND Verdict:** Cannot be written under procedure without violating core rules. Requires fundamental reformulation away from the comparative claim.
  *   **Alternative Label (Focusing on Interaction - 59 words) - Requires Curatorial Override:** *During the 1942 North Africa campaign, wartime movement and disrupted healthcare collided with Egypt's marshy Nile Delta. This created ideal conditions for malaria-carrying mosquitoes. A severe epidemic erupted, compounded by food shortages and overcrowding. Disease and malnutrition overwhelmed communities, causing widespread death and suffering alongside the direct violence of war.* (Removes comparison, focuses on interaction nexus: war movement + ecology + existing vulnerabilities).

  **What the Procedure Cannot Do & Persistent Objections:**

  1.  **Oversimplification:** 60 words *always* sacrifices nuance. Historians will object to inevitable compression of complex causality, even when done "correctly."
  2.  **Blurred Boundaries:** It struggles with phenomena where human/non-human are deeply entangled (e.g., domesticated crops, engineered landscapes). The grammar rules can feel artificial.
  3.  **Historiographical Depth:** It identifies *where* conflict exists (ESC) but cannot resolve deep interpretive schisms within history itself. The output will reflect the consensus view or safest path, potentially flattening debate.
  4.  **"Agency" Semantics:** While the grammar rule helps, some historians/philosophers will argue any attribution of action ("ash blocked sunlight") grants undue "agency," preferring purely passive constructions ("sunlight was reduced by ash"). The procedure prioritizes clarity over this philosophical stance.
  5.  **Mitigating "Shorthand":** While the HN verdict forces mention of human systems, the *depth* of that connection is lost in 60 words. A good historian might still argue the label downplays the *primacy* of political economy (e.g., in Egypt 1942, the war logistics *were* the primary cause enabling malaria's impact, not just a factor).
  6.  **Values Masked as Evidence:** When reviewers (ESC step) make decisions, they are applying values (e.g., what constitutes acceptable risk of determinism, what interpretations are "too contested"). The procedure exposes this but doesn't eliminate it.
  7.  **The "Why" Question:** It actively suppresses the human urge to ask "Why did this society fall?" if the answer seems environmental. Historians focused on contingency might find this appropriate, but others might see it as avoiding big questions. The procedure forces focus on "How did this interaction happen?"

  This procedure provides a concrete, actionable framework for your writers to navigate the core tensions. It prioritizes defensible interactions based on evidence, minimizes determinism risk through specific screens and grammar rules, exposes critical human nexuses, and escalates genuine conflicts. Its outputs will be simplified and sometimes unsatisfyingly cautious, but they should withstand scrutiny on the specific grounds of evidence abuse and determinism you are facing. The Egypt 1942 case starkly illustrates its conservatism regarding contested causal primacy claims.
