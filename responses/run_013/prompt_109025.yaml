prompt: |-
  I do evaluation work for a health charity and I keep running into a pattern I don't have a name for, and I'm not sure its even one thing.

  Here's the setup. We pick a number because it's a decent stand-in for something we actually care about — say, the share of patients still showing up to clinic a year later, used as a proxy for "the care stuck." Early on it behaves like a proxy should: it tracks the thing we care about, and where the two come apart, that gap is where the interesting information lives.

  Then the number becomes the thing we manage. And here's the part I can't explain: it doesn't stop tracking the thing we care about, it starts tracking it *better*. Our validation checks come out cleaner than they ever did, the correlation is higher, the noise is lower, and nobody can point to a case where the number looks good and the underlying thing looks bad. But I've stopped trusting those checks and I can't say why in a way that isn't hand-wavey. Best I can do: the number tracks the thing better because the clinic has reorganized itself around the number, and the reorganizing has eaten exactly the variation that made the original correlation mean anything. The gap between proxy and goal is where the information lived, and the gap is now closed — not because the proxy got more accurate, but because the thing we care about got quietly redefined as whatever the proxy can see.

  So: a measure that gets more predictive of its target at the exact moment it stops being evidence about it.

  Is there a name for this? Goodhart's law is the nearest thing I know but it looks like the opposite — Goodhart is the number drifting away from the goal, mine is the number cosying up to it. Self-fulfilling prophecy is also close but backwards: there the belief makes itself true, here the belief was already true and it's the evidence that rots. I don't just want a label — I want to know what the thing actually is, which nearby concepts it's nearest to and how it differs from each, and where it stops applying. (I've got a second case where a charity's "cost per person housed" went down and got more predictive after it landed in a grant agreement, but that one might be a different animal — the easy-to-house got served first, so the number got better at measuring a different population. Tell me if that's the same pattern or not.)
reasoning: |-
  Okay, let me start by understanding the user's problem. They work for a health charity evaluating programs and have noticed a pattern. They use a proxy metric, like clinic attendance rates, to measure something deeper, like patient retention. Initially, the proxy correlates well with the real goal, and discrepancies provide insights. But over time, as the clinic optimizes for that number, the correlation becomes stronger, validation checks look cleaner, yet the user feels uneasy. They suspect the metric isn't reflecting the original goal anymore.

  First, I need to recall related concepts. Goodhart's Law comes to mind, but that's about metrics losing value when targeted. Here, the metric seems to improve correlation, which is the opposite. Campbell's Law is about distortion under pressure, but the user mentions reduced noise, not just distortion. So maybe it's a specific variant.

  The user describes the clinic reorganizing around the metric, eliminating the variation that made the proxy meaningful. That sounds like the proxy is redefining the underlying goal. So the real issue might be that the operational environment has changed so much that the original goal isn't being measured anymore. The proxy becomes the target, and the system adapts to it, narrowing the scope. 

  The second example about "cost per person housed" decreasing because the charity focused on easy-to-house individuals first. That seems similar—optimizing for the metric changes the population served, altering what's measured. So in both cases, the metric's improvement comes from a shift in the system or population, not actual progress toward the original goal. 

  I should differentiate this from Goodhart's and Campbell's laws. Goodhart's is about metrics becoming useless when targeted; here, they become misleadingly better. Campbell's focuses on corruption; this is more about redefinition. The key is the illusion of validity through reduced variation. 

  Also, the user might need terminology for reports or to explain the issue to stakeholders. They might want to prevent this in future evaluations. So providing clear concepts and distinctions is crucial. Terms like "criterion contamination" or "proxy redefinition" could help. Emphasizing the loss of meaningful variation as the core problem would address their unease. 

  The deeper need here is likely validating their intuition that something's wrong despite positive metrics. They need frameworks to articulate this and strategies to maintain meaningful measurement. Highlighting the importance of variation and independent validation checks could be practical steps.
answer: |-
  This is a brilliant and deeply important observation – you've identified a sophisticated and insidious form of measurement corruption that goes beyond classic Goodhart or Campbell. **It doesn't have a single universally agreed-upon name, but the most precise concepts describing this phenomenon are "Criterion Contamination," "Proxy Redefinition," or "Operationalization Drift."**

  Let's break down why these fit and how they differ from nearby concepts:

  1.  **Core Mechanism:**
      *   **Proxy Redefinition / Criterion Contamination:** This is the heart of your observation. The *operational definition* of the underlying concept you care about ("the care stuck") subtly shifts to become *whatever the proxy (attendance rate) measures*, because the system optimizes around that proxy. The *criterion* (the true goal) becomes *contaminated* by the proxy measure itself. The gap didn't close because the proxy got better at measuring the original "care stuck," but because "care stuck" *in practice* now *means* "attended at 12 months." The variation that was previously informative (e.g., people who *didn't* attend but *did* have "care stick" through other means like self-management, or people who *attended* but whose lives weren't meaningfully improved) is systematically eliminated or ignored.

  2.  **Why it Looks "Better":**
      *   **Illusion of Improved Validity:** By eliminating the very cases that created "noise" (i.e., the discrepancies that held valuable information), the correlation *artificially increases*. Validation checks look cleaner because the system has been pruned of the data points that would invalidate the proxy. You've created a tautological loop: the proxy defines the goal, and the goal validates the proxy. The measure becomes perfectly predictive *only* of *its own operationalized version* of the goal, not the original, richer concept.

  3.  **Distinguishing from Nearby Concepts:**
      *   **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):**
          *   **Difference:** Classic Goodhart often involves gaming, distortion, or outright cheating *without* necessarily improving the correlation to the *intended* goal. Think teachers teaching to the test (improves test scores, not necessarily underlying learning) or Soviet nail factories producing tiny, useless nails to meet weight quotas. The *correlation to the true goal usually weakens*.
          *   **Your Case:** Here, the correlation *strengthens*, but only because the *true goal has been redefined to match the proxy*. It's a more subtle and dangerous form of Goodhart where the *goal itself* bends to the measure.
      *   **Campbell's Law ("The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor"):**
          *   **Difference:** Campbell's Law focuses on the *distortion of the underlying social process* (e.g., teaching becomes test prep, policing focuses on easy arrests). This is absolutely happening in your case (clinic reorganization).
          *   **Your Case:** The unique twist you observe is the *illusion of improved validity* (cleaner checks, higher correlation) *caused by* that distortion, specifically through the *redefinition of the goal*. Campbell's Law describes the *pressure and distortion*, your case describes the specific *measurement artifact* that results when the distortion successfully redefines the operational goal.
      *   **Self-Fulfilling Prophecy:**
          *   **Difference:** An SFP makes a *false* belief become true through the actions motivated by that belief. The belief *causes* the outcome.
          *   **Your Case:** The initial belief (attendance correlates with "care stuck") was likely *true* for the original system state. The actions taken (optimizing for attendance) didn't necessarily make "care stuck" *more universally true* in its original sense; they *changed what "care stuck" operationally meant* within the system to align perfectly with attendance. It's redefinition, not fulfillment of the original prophecy.
      *   **Observer Effect / Hawthorne Effect:**
          *   **Difference:** These describe temporary changes in behavior *because* people know they are being measured. They are usually short-term reactivity.
          *   **Your Case:** This is a fundamental, systemic, and often permanent *reorganization* of processes and goals, not just temporary behavioral change by individuals under observation.

  4.  **Where it Stops Applying:**
      *   This applies when the proxy is a *reasonable but imperfect* stand-in for a *complex, multi-faceted goal*, and when the system has the *capacity and incentive* to reorganize around optimizing that specific proxy.
      *   It stops being the best explanation if:
          *   The proxy *genuinely* becomes a better measure of the *original* goal through improved methodology or technology.
          *   The increased correlation is due to *actual* systemic improvements that enhance both the proxy *and* the original goal simultaneously (e.g., a genuinely better clinic process improves both attendance *and* health outcomes meaningfully).
          *   The variation wasn't eliminated *by system reorganization* but by external factors unrelated to targeting the metric (though this often coincides).

  5.  **Your Second Case ("Cost per person housed"):**
      *   **This is the SAME core pattern.** The grant agreement made "cost per person housed" a key target. The charity optimized for it. How? By focusing resources on the *easiest* and *cheapest* people to house first (creaming/skimming). The *operational definition* of their housing success subtly shifted from "housing people experiencing homelessness" to "housing people experiencing homelessness *who are cheap and easy to house*."
      *   **Result:** The "cost per person housed" metric improves dramatically (lower cost, less variance) and becomes highly "predictive" – predictive of the cost to house *this newly prioritized subgroup*. The correlation strengthens because the *population* being measured has been redefined to align perfectly with the low-cost profile. The original, broader goal (housing diverse individuals facing homelessness, including the hard-to-house) is no longer what the metric primarily reflects. The "gap" (housing harder cases costs more) is eliminated by systematically avoiding those cases.

  **Why your unease is justified:** Your intuition about the "rotten evidence" is spot-on. The cleaner correlations and validation checks are artifacts of a system that has sacrificed the *richness* and *external validity* of the original goal for the sake of internal consistency with a narrow metric. You've lost the ability to see *how well the clinic serves patients whose success doesn't neatly map onto 12-month attendance* or *how well the charity serves the hardest-to-house homeless individuals*.

  **What to call it?** In your reports, you might say:

  > *"We observe evidence of 'Proxy Redefinition' or 'Criterion Contamination': the strong correlation between [Proxy Metric] and [Original Goal Concept] appears to have strengthened primarily because operational processes have been optimized for the proxy, effectively redefining the operational meaning of [Original Goal Concept] to align with what the proxy measures, thereby eliminating the informative variation that previously existed between them."*

  **The key takeaway:** When a proxy metric becomes a target and its correlation with the *stated* goal *increases* while your unease also increases, suspect that the *goal itself* has been silently redefined by the system's response to the metric. The information hasn't been captured; it's been engineered out of existence.
