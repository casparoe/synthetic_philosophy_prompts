  ### Time and Thermodynamics Seminar Activity: Reversible Dynamics and Boundary Conditions

  #### **Phase-by-Phase Timeline (Total: 75 min)**
  1. **Setup & Initial State (10 min)**:  
     - Facilitator tapes a 5x5 grid on the floor (cells labeled A1–E5).  
     - Assign 9 students as "particles" holding playing cards (suits = velocity: ♥ = right, ♦ = up, ♠ = left, ♣ = down).  
     - Initial state: Particles clustered in 3x3 top-left grid (A1–C3), each holding a card facing **right** (♥). Empty space elsewhere. Students agree this is "orderly."  
     - Observers (9 students) record grid snapshots on index cards.  

  2. **Forward Simulation (15 min)**:  
     - Run 6 time-steps using **reversible update rule** (detailed below). At each step:  
       - Particles move/collide per rule.  
       - Observers sketch grid state (particle positions + directions) on index cards.  
     - Final state: Particles spread randomly. Students agree this is "disorderly."  
     - Snapshots saved: Steps 0 (initial), 2, 4, 6 (final).  

  3. **Reverse Simulation (10 min)**:  
     - Announce: "Run it backward! Apply the reverse rule."  
     - Run 6 reverse steps (invert the update rule).  
     - System returns to **exact initial state** (positions + velocities). Validate via student positions/cards.  

  4. **Blind Betting Round (15 min)**:  
     - Facilitator shows 6 pairs of snapshots (each pair = 2 distinct states). Students guess: *Which state came **later** in the simulation?*  
     - Pairs:  
       - 3 easy: From forward run (Step 0 vs 2, Step 2 vs 4, Step 4 vs 6).  
       - 3 tricky: Includes reverse-run states (e.g., Step 4 vs "reverse Step 2" = Step 4 in system-time, but later in real-time).  
     - Students write guesses privately on cards (no discussion).  

  5. **Debrief (25 min)**:  
     - Reveal answers. Discuss why "spread out = later" heuristic failed for tricky pairs.  
     - Map phases to concepts:  
       - Reversible rules → **Time-symmetry of micro-dynamics**.  
       - Initial clustered state → **Special boundary condition**.  
       - Betting failures → **Entropy defined by counting states, not memory**.  
       - Reverse run → **Reversal requires precise microstate control**.  
     - Close with limitations (see below).  

  ---

  #### **Materials & Setup**
  - **Grid**: 5x5 masking-tape cells (1m² each). Label rows A–E, columns 1–5.  
  - **Particles**: 9 students, each holds a playing card (velocity suit: ♥/♦/♠/♣).  
  - **Observers**: 9 students with index cards + markers to draw grid snapshots.  
  - **Betting**: Index cards for guesses.  
  - **Whiteboard**: Track steps, rules, and betting results.  

  ---

  #### **Reversible Update Rule**  
  **Physical (Lattice Gas) Scheme**:  
  - **State**: Particle positions + velocities (suits). Each cell holds ≤1 particle.  
  - **Update (1 step)**:  
    1. **Simultaneous proposals**: All particles plan to move 1 cell in their direction (e.g., ♥ moves right).  
    2. **Collision handling**:  
       - If 2+ particles target the same cell, they "collide":  
         - All colliders reverse velocity (turn card 180°: ♥ → ♠, ♦ → ♣, etc.).  
         - **No movement** (stay in place).  
       - Else, execute planned moves.  
    3. **Edge cases**:  
       - Particles hitting walls reverse velocity (no move).  
       - Empty cells: No action.  

  **Fallback (Permutation Scheme) if Physical Ambiguous**:  
  - Assign each particle a unique ID (1–9). Predefine a reversible shuffle (e.g., swap positions in fixed pairs: A1↔B1, A2↔B2, etc.). Each step applies this permutation. Reversal applies inverse permutation.  

  **Why Reversible?**  
  - **Physical rule**: Collisions and moves are momentum-conserving. Reversing velocity + position undoes changes.  
  - **Proof**: Run backward by reversing velocities first, then reapplying the same rule. Returns to prior state.  
  - **Check**: After reverse run, positions and velocities match initial state exactly.  

  ---

  #### **Betting Round**  
  - **Items**: 6 snapshot pairs. Examples:  
    - Easy: Step 0 (clustered) vs Step 2 (slightly spread).  
    - Tricky: Step 4 (disordered) vs "Reverse Step 2" (same as Step 4 in system-time, but later in real-time).  
  - **Stakes & Scoring**:  
    - "Pride points" for correct guesses.  
    - Facilitator tallies correct/incorrect. Focus: Why did "spread out = later" fail for 3+ students on tricky pairs?  

  ---

  #### **Debrief Script**  
  1. **Time-symmetry of laws**:  
     - "You reversed the rules and recovered the start. Micro-dynamics don't favor past/future."  
  2. **Special initial condition**:  
     - "You *felt* the initial state was orderly. Entropy increase relies on this boundary."  
  3. **Entropy as counting**:  
     - "Betting failures show why we count states, not trust memory. Your 'later' guess was a record made *after* the boundary."  
  4. **Reversal requires precision**:  
     - "Reversing demanded the exact final microstate. In large systems, this is practically impossible."  
  5. **Limitations**:  
     - Small systems fluctuate (unlike 10²³-particle systems).  
     - Typicality ≠ impossibility (fluctuations happen, but are rare).  
     - We didn’t explain *why* the boundary is special (cosmology).  

  ---

  #### **Predictable Issues & Fixes**  
  1. **Collision bookkeeping breaks**:  
     - **Issue**: Students misidentify collisions in crowded areas.  
     - **Pre-empt**: Practice with 2 particles pre-step. Use observers to flag conflicts.  

  2. **Students call reversal a "cheat"**:  
     - **Issue**: "You changed the rules for reversal!"  
     - **Response**: "Yes! The *inverse* rule is different. But the laws are symmetric—boundary conditions break the tie. Your reaction shows how unintuitive reversibility is!"  

  3. **Betting too easy**:  
     - **Issue**: Tricky pairs are obvious.  
     - **Fix**: Add more reverse-run states. Ask: "If you saw *only* these states, could you tell?" Highlight memory dependence.  

  4. **Grid edge chaos**:  
     - **Issue**: Edge collisions confuse.  
     - **Fix**: Use fallback permutation scheme.  

  **Final Note**: This activity distills core concepts but simplifies statistics and cosmology. Emphasize that entropy increase is *typical*, not inevitable, and rests on a special past.
