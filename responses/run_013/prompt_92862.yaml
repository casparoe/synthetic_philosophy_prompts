  ### Decision Tree for Resolving Disagreements: From "Trusted Colleague Disagrees" to Actionable Position  
  *(Designed for software engineers; answer questions based on the situation, not prior philosophical knowledge)*  

  ---

  #### **Q1: Is the disputed claim (X) a step-by-step checkable fact (e.g., "this code has a memory leak") or a holistic judgment (e.g., "this function is too clever")?**  
  - **Step-by-step checkable** → Proceed to Q2.  
  - **Holistic judgment** → Proceed to Q3.  

  ---

  #### **Q2 (Step-by-step claims only): Does your colleague have evidence you lack (e.g., data, logs, benchmarks) that directly addresses X?**  
  - **Yes, they have new evidence** → **Position: Evidence-Seeking Update**.  
    - *Action*: Request and review their evidence. Update your view based on findings.  
    - *Philosophical root*: Total-evidence view (disagreement signals gaps in your knowledge).  
  - **No, we have the same evidence but interpret it differently** → Proceed to Q4.  

  ---

  #### **Q3 (Holistic judgments only): Do you have independent reasons to distrust your own judgment here (e.g., fatigue, deadline stress, poor track record on similar issues)?**  
  - **Yes** → Proceed to Q5.  
  - **No** → Proceed to Q6.  

  ---

  #### **Q4 (Step-by-step claims, same evidence): Are you and your colleague peers on this topic (e.g., equal expertise in the relevant domain)?**  
  - **Yes, we’re peers** → **Position: Joint Reverification**.  
    - *Action*: Re-examine the evidence together (e.g., pair-debug, rerun tests). Resolve via shared process.  
    - *Philosophical root*: Steadfastness (peer disagreement doesn’t inherently require concession; focus on resolving objectively).  
  - **No, they’re a generalist (or I’m the domain expert)** → **Position: Defend with Documentation**.  
    - *Action*: Explain your reasoning with proofs/tests. If they remain unconvinced, escalate to a third-party expert.  
    - *Philosophical root*: Right-reasons view (weight depends on who has stronger domain support).  

  ---

  #### **Q5 (Holistic judgments, self-distrust): Is your colleague a peer on this topic?**  
  - **Yes, we’re peers** → **Position: Conciliate**.  
    - *Action*: Significantly weight their view (e.g., compromise or adopt their position).  
    - *Philosophical root*: Equal-weight conciliationism (self-doubt + peer status demands major adjustment).  
  - **No, they’re a generalist** → **Position: Consult a Third Party**.  
    - *Action*: Defer to an expert or team lead. Avoid digging in.  
    - *Philosophical root*: Pragmatic deference (self-doubt overrides generalist input).  

  ---

  #### **Q6 (Holistic judgments, no self-distrust): Do you both have the same evidence but weigh it differently?**  
  - **Yes** → **Position: Calibrated Confidence**.  
    - *Action*: Re-explain your weighing rationale. If disagreement persists, table the debate and revisit later.  
    - *Philosophical root*: Right-reasons view (disagreement is weak evidence of error; adjust slightly if new info emerges).  
  - **No, they have evidence I lack** → **Position: Investigate then Decide**.  
    - *Action*: Examine their evidence. If credible, update; if not, explain why it doesn’t sway you.  
    - *Philosophical root*: Total-evidence view (new evidence trumps peer status).  

  ---

  ### Positions Covered & Key Notes  
  1. **Named Positions**:  
     - `Evidence-Seeking Update` (Total-evidence view).  
     - `Joint Reverification` (Steadfastness).  
     - `Defend with Documentation` (Right-reasons view).  
     - `Conciliate` (Equal-weight conciliationism).  
     - `Consult a Third Party` (Pragmatic deference).  
     - `Calibrated Confidence` (Right-reasons view).  
     - `Investigate then Decide` (Total-evidence view).  

  2. **Uncovered/Undefended Combinations**:  
     - *Holistic judgment + Peer + Same evidence + No self-distrust* → Leads to `Calibrated Confidence`.  
       - *Why unattractive?* Pure equal-weight conciliationism isn’t applied here. Conciliationists argue you *should* adjust despite confidence, but engineers often reject this as impractical ("why concede if I’m sure?"). The tree prioritizes track record (self-distrust) over peer status.  
     - *Step-by-step + Generalist + New evidence* → Covered under `Evidence-Seeking Update`.  
       - *Why unexplored?* No major philosophy disputes this; new evidence dominates.  

  3. **Ambiguities the Tree Doesn’t Resolve**:  
     - **Peer dissolution** ("disagreement voids peer status") isn’t a distinct leaf. It’s embedded in `Calibrated Confidence`/`Defend with Documentation` (if disagreement makes you question their expertise, you implicitly downgrade them to "generalist").  
     - **"Right reasons" vs. "total evidence"** blur in `Investigate then Decide`/`Calibrated Confidence`. The tree can’t split hairs on evidence-weighting metaphysics—focus on whether *new information* exists.  

  ---

  ### How to Use This Tree  
  1. Start at **Q1** and answer based on the disagreement.  
  2. Follow branches until you hit a **position** (bolded action).  
  3. **Wiki example**:  
     > *Claim X*: "This cache strategy is over-engineered."  
     - Q1: Holistic → Q3: "I’m tired and rushed today" → Q5: "Colleague is a peer" → **Position: Conciliate**.  
     > *Action*: Adopt their view or find a middle ground. Document lessons for future debates.  

  This tree avoids philosophical jargon, focuses on actionable outcomes, and exposes where disagreements stem from (evidence gaps vs. values vs. context).
