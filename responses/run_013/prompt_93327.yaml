  Source defect: The claim is vague about what is being optimized. Without specifying the objective, it's hard to formalize.
  Closest formal object: Potential games (where the equilibrium minimizes a potential function) or the concept of an "invisible hand" in economics (e.g., competitive equilibrium maximizing total surplus under perfect competition).

  Claim 6:
    The process captures the values of those caught in it: participants come to want what the race rewards, so the demand for an escape weakens as the race proceeds.
  Rendering:
    The players' utility functions are endogenous to the game dynamics. Specifically, through a process of preference adaptation (e.g., via learning or evolutionary pressure), players' preferences shift to align with the payoffs of the game. Hence, the players come to value the actions that yield high payoffs in the equilibrium. Consequently, their willingness to change the game (e.g., to escape the equilibrium) decreases over time because they now have a higher valuation for the equilibrium outcomes.
  Status: `lossy`. While we can model changing preferences, standard game theory typically takes preferences as fixed. The idea that preferences adapt to the game is not standard and requires a model of preference evolution.
  Loss: The standard toolkit does not include endogenous preference formation. We have to step outside to evolutionary models with changing types or learning that affects preferences.
  Source defect: The claim is clear, but it requires an extension of the standard model.
  Closest formal object: Evolutionary game theory with replicator dynamics on both strategies and preferences (e.g., indirect evolution) or models of cultural transmission.

  Claim 7:
    There are apparent escapes — a single actor with enough power to set the rules for everyone, or a shared norm or moral commitment that holds without enforcement — and both look less like solving the game than like changing it.
  Rendering:
    Two potential solutions to the inefficiency: 
    (a) A central authority (a mechanism designer) who can enforce a new set of rules (a mechanism) that changes the game form, leading to a better equilibrium. 
    (b) A correlated equilibrium or a self-enforcing agreement (a norm) that uses common knowledge and shared commitments to coordinate on a better outcome without external enforcement. 
    However, both approaches do not solve the original game; they change the game (by altering the rules or the information structure) to a different game with a better outcome.
  Status: `clean`. This is a standard point: to escape a bad equilibrium, we need to change the game (via mechanism design or by introducing correlations). The original game remains unchanged.
  Loss: none.
  Source defect: none.

  Claim 8:
    Some races are good: competitive pressure that destroys inefficiency or dissolves unearned rents. The literature has no formal criterion for distinguishing those from the bad ones, and neither, so far as I can tell, do I.
  Rendering:
    Some competitive processes (e.g., in markets) lead to efficient outcomes (e.g., by driving prices to marginal cost and eliminating deadweight loss) and remove unearned rents (e.g., by eroding monopolistic advantages). However, other competitive processes lead to inefficient outcomes (e.g., rent-seeking races). The literature does not provide a formal criterion to distinguish between these, and indeed, in the user's toolkit, there is no general criterion: the welfare effect of competition depends on the context (e.g., the market structure and the nature of the rents).
  Status: `clean`. This is a known issue: competition can be welfare-enhancing or welfare-reducing.
  Loss: none.
  Source defect: none.

