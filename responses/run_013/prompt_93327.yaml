  We are given a stipulative definition of "multipolar trap" and a set of eight claims that we must translate into the user's formal vocabulary (game theory, mechanism design, etc.). We must also assess the stipulative definition and report on residues that do not survive translation.

  Stipulated Definition Assessment:
  - The user defines a multipolar trap as a strategic situation with:
    1. A unique equilibrium that is Pareto-dominated by a feasible joint outcome.
    2. No participant can unilaterally deviate to reach the better outcome.
  - It is shallow if the Pareto-superior outcome can be attained by an enforceable agreement or a single rule change.
  - It is deep if not, because unilateral abstention leads to being outcompeted, and coalitions are vulnerable to defection (unique stochastically stable state).

  But note: the definition requires uniqueness of equilibrium. However, in the claims (e.g., claim 1) we see "each does X because each expects the others to" which suggests a Nash equilibrium, but not necessarily unique. Also, the deep trap condition requires stochastic stability, which is a strong requirement.

  What it might miss:
  - The literature often describes traps that are not unique equilibria (e.g., multiple equilibria, some of which are bad) but where the bad one is selected by dynamics.
  - The definition of "deep" requires the equilibrium to be stochastically stable, but the literature might use a weaker notion (e.g., being the only equilibrium that survives under some learning dynamics, not necessarily the most stable in the long run).

  What it overstates:
  - Uniqueness: in many traps (like prisoner's dilemma) there is a unique Nash equilibrium, but in others (like coordination games) there might be multiple, and the trap is that we are stuck in the bad one. The literature might include games with multiple equilibria.

  Verdict: `fits_partially`

  Translations:

  We must translate each claim without using the source vocabulary. We'll use standard game-theoretic terms.

  Claim 1: 
    Everyone would be better off if no one did X, yet each does X because each expects the others to; the outcome is stable, and no participant can fix it alone.
  Rendering: 
    There exists an action profile (a strategy for each player) in which no player chooses action X, and this profile Pareto-dominates the profile where every player chooses X. However, the profile where every player chooses X is a Nash equilibrium: each player, expecting the others to choose X, has no incentive to unilaterally deviate (since if they stop X, they are worse off). Moreover, no unilateral deviation from the equilibrium (by a single player) can achieve the Pareto-superior outcome.
  Status: `clean` (this is a standard coordination failure, e.g., prisoner's dilemma). 
  Loss: none.
  Source defect: none. This is a common game-theoretic situation.

  Claim 2:
    The failure is multipolar: it arises from the manyness and mutual indifference of the participants, and it disappears if the participants merge or if one of them grows large enough to internalize the externality.
  Rendering:
    The inefficiency (Pareto-dominated equilibrium) occurs in a game with a large number of players, each with independent objectives (no shared utility). The inefficiency arises due to externalities that are not internalized. If the players were to merge into a single entity (thus becoming a single player) or if one player becomes sufficiently large (acquires the ability to control a significant fraction of the actions and internalize the externalities), then the Pareto-superior outcome can be achieved (because the merged entity or the large player can coordinate internally to avoid the inefficient outcome).
  Status: `clean`. This is a standard point about externalities and internalization via mergers or the emergence of a dominant player.
  Loss: none.
  Source defect: none.

  Claim 3:
    The trap deepens over time. The race alters the participants, the payoffs, and the set of available moves, so that each round makes the next round worse; the relevant state space is discovered as the process runs rather than given in advance.
  Rendering:
    The game is dynamic and repeated. The actions taken in each period change the game for the next period: they may alter the set of players (via entry/exit), the payoff functions (e.g., via investment in capabilities that change costs), and the action sets (e.g., by locking in technologies). This leads to a worsening of outcomes over time (e.g., welfare decreases monotonically). Moreover, the state space (the set of possible game states) is not fixed at the outset but is endogenously expanded (e.g., by innovation) as the game proceeds.
  Status: `lossy` because the standard repeated games or stochastic games have a fixed state space and known transitions. The idea of an expanding state space (discovered as the process runs) is not standard. We might model it as an extensive form game with an unknown game tree that is revealed over time, but that is not typical.
  Loss: The notion of the state space being "discovered" is not captured. We could say the game has an unknown and evolving structure, but that is not a standard formal object.
  Source defect: The claim is somewhat vague about how the state space is discovered. It might be interpreted as a game with endogenous state space, which is complex and not commonly modeled.
  Closest formal object: Stochastic games with endogenous state transitions, but typically the state space is fixed. Alternatively, games with innovation (e.g., in evolutionary game theory) where new strategies appear.

  Claim 4:
    Some participants would prefer not to race and cannot afford to stop, because those who stop are eliminated. The competition is a selection process rather than a choice, and the eliminated do not get to have preferences about the outcome.
  Rendering:
    In an evolutionary game setting, the players are not rational optimizers but are subject to a selection dynamic (e.g., replicator dynamics). Strategies that yield below-average payoffs are eliminated (or reduced in frequency). Therefore, even if a player (or a type) would prefer a different outcome, if they choose a strategy that leads to elimination, they are removed from the population and thus cannot influence the future state. The process is driven by selection, not by intentional choice.
  Status: `clean` in the context of evolutionary game theory. The eliminated players (or strategies) are removed, so their preferences become irrelevant.
  Loss: none for the core idea, but note: in evolutionary models, we often model the population as a whole, not individual preferences. The claim about "preferences" might be interpreted as the strategy being dominated, but the translation captures it.
  Source defect: none.

  Claim 5:
    The process is not driven by an agent. No one wants the result and no one could have chosen it, yet it is as if something were optimizing for it.
  Rendering:
    The outcome (e.g., the equilibrium) is not the result of any player's intended goal (it is not the objective of any player). Moreover, no single player could have chosen the outcome unilaterally. However, the outcome emerges as the result of the strategic interaction (e.g., the Nash equilibrium) and may be the result of an optimization process at the system level (e.g., it minimizes some global cost function, even though no player is minimizing that function).
  Status: `lossy`. We can say that the outcome is an equilibrium that no player desires, and it is the result of decentralized decisions. The "as if optimizing" part is tricky: in evolutionary games, we sometimes see that the dynamics optimize a Lyapunov function (like a potential) but that is not always the case. The claim that it is "as if something were optimizing" is metaphorical and not always formally true.
