  ### Decision Tree for Views on Death  
  *Each node presents a concrete case. Participants answer based on their immediate judgment without knowing the resulting position.*  

  1. **A patient suffers cardiac arrest. After 30 minutes of failed CPR, resuscitation stops. The heart remains stopped for 5 minutes ("hands-off" interval), and death is declared for organ donation. *Could the heart be restarted with aggressive intervention? Yes, but it is not attempted.* Is the patient dead at the moment of declaration?**  
     - **Yes** → Go to 2  
     - **No** → Go to 8  

  2. **A patient has complete destruction of their cerebral cortex (no consciousness, cognition, or awareness) but an intact brainstem. They breathe independently, have sleep-wake cycles, and maintain stable blood pressure. Is this patient dead?**  
     - **Yes** → Go to 3  
     - **No** → Go to 4  

  3. **A patient meets *all* criteria for brain death (no brainstem reflexes, no respiratory drive, flat EEG). They are on a ventilator, with a warm body, beating heart, and functioning organs. If maintained, the body could survive for weeks. Is this patient dead?**  
     - **Yes** → **Leaf: Higher-Brain (Cortical) Criterion**  
       *Awkward commitment: A breathing, warm-bodied human with a heartbeat is dead.*  
     - **No** → **Leaf: Circulatory Criterion (DCD-Aligned)**  
       *Awkward commitment: A body with no brain function at all is not dead if the heart beats.*  

  4. **The brain-dead patient from Node 3 is maintained on a ventilator. The body digests food, fights infections, and heals wounds. Is this evidence the body remains *an integrated organism*?**  
     - **Yes** → Go to 5  
     - **No** → Go to 6  

  5. **In the patient from Node 2 (destroyed cortex, intact brainstem), has the *person* died even if the organism is alive?**  
     - **Yes** → **Leaf: Person/Organism Decoupling**  
       *Awkward commitment: A breathing human body can be a living organism housing a dead person.*  
     - **No** → **Leaf: Organismal Integration View (Bernat-Aligned)**  
       *Awkward commitment: Brain death is death because the ventilator cannot replicate the brain’s biological integration.*  

  6. **Could the ventilator in Node 3 replace the brain’s function if technology advanced (e.g., artificial brainstem)?**  
     - **Yes** → **Leaf: Brain Death is Not Death**  
       *Awkward commitment: A brain-dead body is alive if externally integrated; death requires circulatory cessation.*  
     - **No** → Go to 7  

  7. **Is the brain-dead patient dead because they have *permanently* lost consciousness, even if the body functions?**  
     - **Yes** → **Leaf: Higher-Brain Criterion** (*Same as Node 3 "Yes"*)  
     - **No** → **Leaf: Whole-Brain Criterion**  
       *Awkward commitment: A patient with a working brainstem but no cortex is alive; one without both is dead.*  

  8. **The brain-dead patient from Node 3 is declared dead per hospital protocol. Is this patient dead?**  
     - **Yes** → Go to 9  
     - **No** → Go to 10  

  9. **The patient from Node 2 (destroyed cortex, intact brainstem) will never regain consciousness. Is this patient dead?**  
     - **Yes** → **Leaf: Higher-Brain Criterion** (*Same as Node 3 "Yes"*)  
     - **No** → **Leaf: Brainstem Criterion (UK-Aligned)**  
       *Awkward commitment: A patient with no cortex but a working brainstem is alive; loss of brainstem (even with residual cortical activity) is death.*  

  10. **The DCD patient from Node 1 could have their heart restarted minutes after declaration. Is "irreversible" circulatory failure a fact about the body or our intent?**  
      - **Fact about the body** → Go to 11  
      - **Dependent on intent/technology** → **Leaf: Circulatory Criterion (DCD-Aligned)** (*Same as Node 3 "No"*)  

  11. **When *does* the DCD patient die? At 5 minutes? 1 hour? When decomposition begins?**  
      - **At a specific time** → **Leaf: Circulatory Criterion** (*Same as Node 3 "No"*)  
      - **No precise moment** → **Leaf: Death as a Process**  
        *Awkward commitment: Death has no discrete point; declarations are arbitrary markers in a continuum.*  

  ---

  ### Collapsed Positions & Unrepresented Views  
  - **Whole-Brain vs. Brainstem Criteria**: Collapsed into one leaf (Node 7/Node 9). They are operationally identical in practice (loss of brainstem implies global brain failure).  
  - **Legal/Moral Status View**: Not captured. It co-exists with multiple leaves (e.g., accepting DCD/brain death as legal constructs).  
  - **Dead-Donor Rule Abandonment**: Not captured. It is orthogonal (e.g., one could hold this while accepting any criterion).  
  - **Integration View (Bernat)**: Explicitly named (Node 5 "No").  

  ### Single Node to Cut for Brevity  
  - **Drop Node 5 ("Person/Organism Decoupling")**. It is the least clinically relevant and rarely alters organ donation decisions. Merge into Node 3 "No" (Circulatory Criterion) or Node 7 (Whole-Brain).  

  ### Facilitator’s Note  
  Clinicians will anchor to legal/clinical criteria (e.g., "brain death is death—I’ve declared it"). Philosophers will dissect "irreversibility" (Node 1/Node 10) and "integration" (Node 4), exposing tension between biology and intent. Expect deadlock at:  
  1. **Node 4 (ventilator as integrator)**: Clinicians see medical intervention; philosophers see artificial substitution.  
  2. **Node 10 ("irreversible" as fact vs. choice)**: Clinicians focus on protocol; philosophers argue it’s normative.  
  3. **Higher-Brain Criterion (Node 3/Node 9)**: Clinicians reject it (PVS patients are treated as alive); some philosophers embrace it.  

  **Intervention**: Stress that the tree reveals *underlying commitments*, not "correct" answers. Use disagreements to explore why protocols exist and where they might falter.
