   The tree must address:
     - Whether "irreversible" is about the body or about willingness to intervene (e.g., DCD case: heart could be restarted but we choose not to).
     - Whether a patient with destroyed cortex and intact brainstem is dead.
     - Whether the ventilator is doing the integrating work for a brain-dead patient.

   We have ten positions to cover, but some may collapse. The positions are:
     1. Whole-brain criterion: death when all functions of the entire brain (including brainstem) have irreversibly ceased.
     2. Brainstem criterion (UK): death when brainstem functions have irreversibly ceased (even if some cortical activity might remain, but in practice, brainstem death implies loss of cortical function due to lack of blood flow).
     3. Higher-brain (cortical) criterion: death when higher brain functions (consciousness, cognition) are lost, even if brainstem functions remain.
     4. Circulatory (cardiopulmonary) criterion: death when circulatory and respiratory functions have irreversibly ceased (as in DCD).
     5. Integration or "organism as a whole" view (Bernat): death when the organism can no longer function as an integrated whole, which is tied to the loss of brain function that provides this integration.
     6. Position that brain death is not death because the organism is still integrated (e.g., by the ventilator and other medical support).
     7. View that the death of the organism and the death of the person can come apart (e.g., the person dies when consciousness is lost, even if the organism lives on).
     8. View that death is a legal or moral status we assign, not a biological fact.
     9. View that the dead-donor rule should be abandoned and death is a distraction for organ donation.
     10. View that death is a process with no determinate moment.

