  3. **Redirecting View** (Q7→Yes):  
     - Bystander: ✅ | Loop: ✅ | Footbridge: ❌  
  4. **Unintended Means** (Q5→Yes):  
     - No named defense. *Unexplored/incoherent* (death a non-intended means).  
  5. **Reckless Harm** (Q3→No):  
     - No named defense. *Unattractive* (direct harm without intention).  

  ---

  ### Notes:  
  - **Tree cannot separate**:  
    - *Strict Double Effect* (Q5→No) and *Redirecting View* (Q7→Yes) both permit Bystander but diverge on Loop.  
  - **Unoccupied combinations**:  
    - Loop + "death unintended but a means" (Q5→Yes): *Unexplored* (no scenario fits cleanly).  
    - Footbridge + "death unintended" (Q3→No): *Unattractive* (direct force without intention is reckless).  
