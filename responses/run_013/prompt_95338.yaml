  ### Decision Tree: Trolley Problem & Doctrine of Double Effect  
  **Starting commitment**: Diverting the trolley (bystander case) is permissible. Assess permissibility for any variant.  

  #### Root Question:  
  **1. Is the harm a result of redirecting an existing threat (vs. creating a new force)?**  
  - **Yes** → Go to Q2.  
  - **No** (e.g., pushing in Footbridge) → Go to Q3.  

  ---

  #### Branch 1: Redirecting Harm (e.g., Bystander, Loop)  
  **2. Is the victim’s death *intended* (as a means or end)?**  
  - **Yes** (e.g., Loop variant, where the body *stops* the trolley) → Go to Q4.  
  - **No** (e.g., Standard Bystander, death is foreseen but unintended) → Go to Q5.  

  **4. [If death intended] Are the numbers saved sufficiently large to justify?**  
  - **Yes** → **Position: Threshold Double Effect** (Loop permissible with large numbers, e.g., 1 vs. 100).  
  - **No** → **Position: Strict Double Effect** (Loop impermissible; death intended as means).  

  **5. [If death unintended] Is the death a *means* to saving the five?**  
  - **Yes** → **Position: Unintended Means** (No named defense; incoherent/unexplored).  
  - **No** → **Position: Strict Double Effect** (Bystander permissible; death unintended side effect).  

  ---

  #### Branch 2: Creating New Force (e.g., Footbridge)  
  **3. Is the victim’s death *intended*?**  
  - **Yes** (e.g., Pushing to stop trolley) → Go to Q6.  
  - **No** → **Position: Reckless Harm** (Unattractive; impermissible).  

  **6. [If death intended] Are the numbers saved sufficiently large to justify?**  
  - **Yes** → **Position: Threshold Double Effect** (Footbridge permissible with large numbers).  
  - **No** → **Position: Strict Double Effect** (Footbridge impermissible; death intended as means).  

  ---

  #### Branch 3: Alternative Path (Redirecting without DDE)  
  **7. [From Q1: Redirecting] Do you reject intention/means criteria, permitting *all* redirecting?**  
  - **Yes** → **Position: Redirecting View** (Bystander *and* Loop permissible; only doing/allowing matters).  
  - **No** → Proceed to Q2 (as above).  

  ---

  ### Leaves (Named Positions):  
  1. **Strict Double Effect** (Q5→No, Q4→No/Q6→No):  
     - Bystander: ✅ | Loop: ❌ | Footbridge: ❌  
  2. **Threshold Double Effect** (Q4/Q6→Yes):  
