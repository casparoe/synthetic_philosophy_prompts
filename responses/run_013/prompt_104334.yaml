  Alex: I think this table perfectly illustrates the problem. If we just look at the subgroups, we'd say A is better in both, so we should choose A. But if we look at the overall, we'd choose B. The dominance principle — better in every subgroup implies better overall — fails because it's not invariant to the partition. The problem is that we don't have a principled way to choose which partition to look at without already knowing the answer or without bringing in external causal assumptions.

  Bailey: But that's exactly the point. The data alone don't tell us which partition to use. We need to know the causal structure. In this case, the covariate (the grouping variable) is pre-treatment. We must adjust for it because it's a confounder. Without adjustment, the overall comparison is misleading. The right partition is fixed by the causal structure: we adjust for variables that cause both the treatment assignment and the outcome. In this case, the covariate is a confounder, so we should condition on it. Then we see that A is better in both groups, so we should choose A.

  Alex: How do you know it's a confounder? The data don't tell you that. All you have is the association. Suppose the covariate is something like the hospital where the patient was treated. Hospital 1 might have more severe cases? Or maybe not. Without knowing the causal story, how do you decide? And what if there are multiple partitions? For example, what if we also had data partitioned by age, and in every age group A was worse, but overall A was better? Then you'd have two partitions giving opposite advice.

  Bailey: That's why we need a causal diagram. We use background knowledge to decide which variables are confounders. In this case, if the covariate is a pre-treatment variable that affects both the treatment assignment and the outcome, then we must condition on it. If it's not, then we shouldn't. The data alone can't tell us, but that doesn't mean we throw up our hands. We use subject-matter knowledge. In our toy table, if we have reason to believe that the covariate (say, disease severity) is a confounder, then we condition. Otherwise, we might not.

