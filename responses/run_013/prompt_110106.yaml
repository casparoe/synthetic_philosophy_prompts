  The user mentions existing frameworks like the gift vs. commodity dichotomy and cultural relativism but finds them insufficient. They want a precise term for this specific property of the exchange itself. If no term exists, they prefer a newly coined one with clear boundaries rather than a vague label.

  I need to figure out why the pricing aspect changes the perception. The user's deeper need might be for a conceptual tool to analyze and combat corruption more effectively. They might also want to communicate this distinction clearly to others in their field. The unspoken need could be validating their observation academically and finding leverage points for anti-corruption strategies.

  The anthropologist Marcel Mauss's work on gifts comes to mind. He discusses how gifts create ongoing social bonds, while commodities are detached transactions. But the user already knows this. The key here is the transformation of a reciprocal favor into a closed transaction via monetization. That shift from relational to transactional is crucial.

  The term "commensuration" comes up in sociology—reducing qualities to quantities. But it might be too broad. "Quantification" is similar but also broad. "Monetization" is close but focuses on money specifically. The user's examples include cash envelopes, which are monetary, but what about non-cash priced items? They need a term that covers any priced transfer, not just money.

  Another angle: the irreversibility of monetized exchanges. Cash finalizes the obligation, ending the social relationship aspect. Gifts imply future reciprocity; priced transactions don't. This aligns with the user's note about the envelope making the obligation "exact and finished."

  The user also asks why unreciprocated gifts are judged more harshly. In gift economies, not reciprocating is a social failure. But in corruption contexts, a one-way gift to an official might imply coercion or imbalance of power. The direction matters because it highlights dependency—when the giver is seeking a decision, it's coercive.

  Terms like "fungibility" (interchangeability of value) and "alienability" (detachment from the giver) are relevant. Money is fungible and alienable, which strips the transaction of social context. A favor is unique and tied to the relationship.

  Putting this together, the core issue is the transformation of a social, relational exchange into a discrete economic transaction. The term "transactionalization" captures this—converting ongoing obligations into a one-time deal. But it's not commonly used. "Commoditization" might work but is broader. The best fit is "monetization" but specified as "monetized closure" to emphasize the finality.

  However, the user wants a term that includes non-monetary priced items. Perhaps "price-mediated finality" or "quantified finality." But these are clunky. Revisiting "commensuration," it means making different things comparable through a common measure. When a favor is priced, it becomes commensurable, thus corrupt. This shifts the focus from social bonds to measurable value.

  The user also needs to rule out other interpretations. The term should exclude cultural relativist arguments and focus on the exchange's properties. "Commensuration" does this by emphasizing the act of pricing itself as transformative.

  Additionally, the direction of flow matters because pricing a favor from petitioner to official commodifies the official's duty. If the official receives a priced item, their decision becomes a service for sale, undermining impartiality. Whereas in reverse, if the official gives, it might be seen as patronage, which is different.

  So the established term in sociology is "commensuration." But the user might need a more accessible term. Alternatively, framing it as "the monetization boundary" or "pricing threshold." However, "commensuration" is academically established and precise.

  To address the user's questions: unreciprocated gifts are harshly judged because they lack the mutuality of gift exchange, appearing as a purchase. Open vs. private gifts affect perception because secrecy implies illegitimacy. The direction matters because it commodifies the official's role when value flows to them.

  Thus, recommending "commensuration" as the key term, explaining its facets, and addressing their sub-questions using this framework.
answer: |-
  Based on your precise description and the limitations of existing frameworks (gift/commodity, cultural relativism, legal terms), the core property you're isolating has a name in social theory and economic sociology: **Commensuration**.

  **Why "Commensuration" Fits:**

  1.  **Definition:** Commensuration refers to the process of **transforming qualitatively different things into a common quantitative metric that allows for direct comparison, calculation, and exchange based on that metric** (usually price/money). It's the act of *making things measurable and fungible*.
  2.  **Your Core Insight:** The critical feature flipping the transfer's standing is precisely this act of *pricing* or *quantifying* the value. Commensuration:
      *   **Makes the Obligation Exact and Finished:** As your informants said. A favor, being qualitative and embedded in social relations, creates an open-ended, diffuse, often unquantifiable obligation. Pricing it defines a specific, calculable value and settles the debt conclusively ("paid in full").
      *   **Detaches the Value from Social Context:** Commensuration strips away the unique social meanings, histories, and relational nuances of the favor or gift. It renders the value abstract, impersonal, and interchangeable (fungible). Cash is the ultimate commensurating tool – it has no inherent meaning beyond its numerical value.
      *   **Creates a Discrete Transaction:** It transforms a potentially ongoing, relational exchange into a single, bounded, economic event.
  3.  **Contrast with Gifts:** Gifts operate in a realm of **incommensurability**. Their value is symbolic, relational, and often deliberately *not* precisely calculable. Repaying a gift with an exact cash equivalent is frequently considered insulting because it negates the social bond the gift embodies and attempts to impose commensuration where it's socially inappropriate. Your "favor returned in kind" relies on this incommensurability to remain within the sphere of social reciprocity.
  4.  **Contrast with Cultural Relativism:** Commensuration explains *why* pricing a traditionally reciprocal favor *within a specific institutional context* (like an official decision) triggers the "corruption" label, regardless of local reciprocity norms. It highlights the *act of quantification itself* as the transformative element crossing a boundary, not just an external Western judgment.

  **How "Commensuration" Addresses Your Specific Questions:**

  1.  **Why the unreciprocated gift is judged more harshly than the reciprocated one?**
      *   **Commensuration Lens:** An unreciprocated *priced* transfer (bribe) is a pure, commensurated transaction. It's perceived as a cold, calculated purchase of influence, devoid of any mitigating social bond. A reciprocated gift or favor maintains its incommensurate, relational character. The *lack* of reciprocation in a commensurated exchange highlights its purely transactional, non-relational nature, making it feel more blatantly corrupt. Reciprocation, even if corrupt, reintroduces a veneer of sociality that softens the perception slightly compared to a pure cash-for-decision swap.

  2.  **Why the same gift is read differently when given openly and privately?**
      *   **Commensuration Lens:** Secrecy is often *required* for commensuration to function as corruption within a system that publicly denies its legitimacy. An open gift *before* a decision is hard to commensurate secretly – it looks like a blatant attempt to buy influence. An open gift *after* can be framed (however disingenuously) as gratitude, a non-commensurated social gesture. A private gift *before* allows the *illusion* of commensuration (a hidden transaction) to exist, triggering the corruption frame. Secrecy facilitates the act of treating the official's action as a commensurable service.

  3.  **Why direction matters (petitioner -> official)?**
      *   **Commensuration Lens:** Commensuration applied to a flow *from the petitioner to the official* directly quantifies the value of the official's decision or action. It turns the public duty or impartial judgment into a *commodity* with a price tag. This commodification of public office or trust is the essence of the corruption judgment. A flow *from the official to the petitioner* (patronage, nepotism) might be condemned as favoritism or abuse of power, but it doesn't typically involve the same act of commensuration – the official isn't usually *paid* for granting the favor; they are dispensing resources or influence based on loyalty or obligation, operating more within an incommensurate gift/patronage logic. Direction matters because commensuration corrupts by *commodifying the specific act of public decision-making*.

  **What "Commensuration" Rules Out/Clarifies:**

  *   **It's not just about money:** While cash is the clearest example, any act that assigns a precise, fungible value (e.g., "I'll give you this specific valuable watch worth $5000 for that permit") involves commensuration. A vague promise of "a favor someday" does not.
  *   **It's not about the absolute size:** As you note, a small sum can be corrupt via commensuration, while large reciprocal favors are not. The *act* of pricing, not the amount, is key.
  *   **It's not about motive/consequence per se:** The *social meaning* shifts due to commensuration, regardless of intent or outcome. A well-intentioned cash "thank you" before a decision is still commensuration of the official's role.
  *   **It distinguishes from "Conflict of Interest":** Conflict of interest highlights a *situation* of potential bias. Commensuration describes the specific *mechanism* (pricing the decision) that often *actualizes* that conflict into a corrupt exchange.
  *   **It distinguishes from simple "Bribery":** Bribery is the legal term *for the crime* that often results from commensuration. Commensuration explains *why* a particular transfer constitutes a bribe in perception and law, while a qualitatively similar favor does not.

  **Conclusion:**

  "Commensuration" is the established concept capturing the transformative act of pricing or quantifying value in a transfer, which shifts it from the realm of social reciprocity (gift/favor) to the realm of economic transaction (commodity/bribe), thereby flipping its moral and legal standing, particularly within contexts demanding impartiality (like public office). It directly addresses your core observation about the "exact and finished" nature of the obligation created by pricing and explains the subsidiary questions about reciprocity, secrecy, and directionality within this framework. This term provides the conceptual "edges" you seek, grounded in social theory, distinct from cultural relativism, and focused on the property of the exchange itself.
