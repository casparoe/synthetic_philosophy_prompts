  Check historical accuracy: paper tokens were used in some contexts, like playhouses or trade, in the 18th century. Berkeley would reference everyday experiences. Avoid anachronisms. The joke must be concise—a few sentences max. Dry wit over whimsy, so keep it sharp and pointed.

