  We are going to construct a thought experiment in which two historians, Alice and Bob, write about the same small historical episode. They have access to the same archive and make the same factual and causal claims, but their narratives differ in the prominence they give to various episodes, leading one to be Whiggish and the other not.

  **Definition of Whiggish (from the prominence rule):** An account is Whiggish to the degree that the prominence (space, emphasis, placement in the narrative arc) given to each episode is monotone in how much that episode contributes to the outcome we now care about.

  **The Setup: The Invention of the Steam Engine**

  We'll take a very simplified episode: the development of the steam engine in the early 18th century. The outcome we now care about is the successful invention of a practical and efficient steam engine by Thomas Newcomen in 1712.

  **The Facts (agreed upon by both historians):**

  1. In 1698, Thomas Savery patented a steam-powered device for pumping water, but it was inefficient and prone to boiler explosions.
  2. In 1705, Thomas Newcomen, a blacksmith, began experimenting with steam engines. He collaborated with John Calley, a plumber, and they built several models.
  3. In 1707, Newcomen and Calley conducted an experiment that failed due to a faulty piston seal. They discovered that using a leather seal soaked in tallow improved the piston's performance.
  4. In 1710, they built a full-scale engine that worked for a few weeks but then broke down because of a cracked cylinder. This led them to experiment with different casting techniques.
  5. In 1711, they developed a new casting method that produced a more durable cylinder.
  6. In 1712, Newcomen and Calley installed a successful engine at a coal mine in Dudley, which worked continuously and efficiently, marking the breakthrough.

  **Causal Claims (agreed upon by both):**

  - Savery's patent (1698) provided a starting point but was not a direct cause of Newcomen's success because Newcomen's design was fundamentally different and avoided Savery's main flaws.
  - The 1707 experiment with the piston seal was a crucial step because it solved a major leakage problem.
  - The 1710 failure was pivotal because it forced the development of a better casting method, which was essential for the 1712 success.
  - The 1711 casting innovation was a direct cause of the 1712 engine's durability.
  - The 1712 installation was the culmination of these efforts and the immediate cause of the steam engine's adoption.

  **The Outcome We Now Care About:** The successful and practical steam engine (the 1712 engine).

  **The Two Narratives:**

  1. **Alice's Account (Whiggish):** 
     - She structures her narrative around the direct path to the 1712 success.
     - She gives **most prominence** to the 1712 engine itself and the immediate causes: the 1711 casting innovation and the 1710 failure that led to it. She spends less time on the earlier events.
     - The 1707 piston seal experiment is mentioned but in less detail and is not emphasized as a turning point. Savery's patent is mentioned only in passing as a historical curiosity.
     - The arc of her story: it builds up to the 1712 success, with the earlier events presented as steps that were necessary but only as they directly contributed to 1712.

  2. **Bob's Account (Non-Whiggish):**
     - He structures his narrative to reflect the process of invention as it was experienced by the historical actors, without knowing the outcome.
     - He gives **equal prominence** to the 1707 piston seal experiment and the 1710 failure, and even to Savery's patent, because at the time, each of these events was a major focus and had uncertain outcomes.
     - He spends considerable time on the 1707 experiment because it was a moment of high drama and risk: the failure could have ended their work, but the discovery of the leather seal saved the project. Similarly, the 1710 failure was a crisis that might have led to abandonment but instead led to a breakthrough in casting.
     - The 1712 success is presented as the outcome of a series of contingent events, each of which was a significant episode in its own right and not guaranteed to lead to the next.

  **Applying the Prominence Rule:**

  - The prominence rule measures the degree to which the prominence given to an episode is monotone in its causal contribution to the outcome (1712 engine).

  - **Causal Contribution (as agreed):**
    - The 1711 casting innovation: high contribution (direct cause).
    - The 1710 failure: high contribution (led directly to the 1711 innovation).
    - The 1707 piston seal: medium contribution (necessary but not sufficient, and not the last step).
    - Savery's patent: low contribution (provided a starting point but not a direct cause).

  - In **Alice's account**:
    - Prominence: 
      - 1712: highest (the outcome)
      - 1711 and 1710: high (much space and emphasis)
      - 1707: medium (some space, but less than 1710 and 1711)
      - Savery: low (minimal mention)
    - This is monotone with causal contribution: the more an event contributes, the more prominence it gets.

  - In **Bob's account**:
    - Prominence:
      - He gives high prominence to 1707 (because it was a dramatic turning point at the time) and to 1710 (another crisis) and also to Savery (as context for the challenges they faced). 
      - He gives the same level of prominence to 1707 as to 1710 and 1711, even though 1707 has a lower causal contribution to the 1712 outcome than 1710 and 1711.
      - He also gives significant space to the 1712 success, but the earlier events are not downplayed relative to their causal contribution. In fact, the 1707 event is given more prominence than its causal contribution might warrant (if we only consider the 1712 outcome).
    - This is not monotone: the 1707 event (medium causal contribution) gets the same prominence as the 1710 event (high causal contribution). Also, Savery's patent (low) gets more prominence than in Alice's account.

  Therefore, by the rule, Alice's account is Whiggish because the prominence is aligned (monotone) with the causal contribution to the outcome. Bob's account is not because it gives more prominence to events that were significant at the time but less directly contributory to the outcome.

  **The Feature Doing the Work:** The key feature is that Bob's account assigns prominence based on the significance of events *at the time they occurred* (the drama, the uncertainty, the effort) rather than based on their causal contribution to the outcome we now know. Alice, on the other hand, assigns prominence based on the retrospective causal chain leading to the known outcome.

  **What If Prominence Tracks Evidential Weight?**

  Suppose we change the rule: prominence is assigned based on the evidential weight (how much evidence we have for an event, or how important it is for understanding the context). Then:

  - Both historians have the same evidence. If Bob argues that the 1707 experiment has more evidential weight because it is well-documented in the archive and reveals the inventors' thought processes, then he might assign it more prominence for that reason. Similarly, if Savery's patent is well-documented and had a big impact on the public perception of steam power at the time, it might have high evidential weight for understanding the context.

  - Then the difference between Alice and Bob could be seen as a disagreement about what aspects of the evidence are most important. Alice might say the evidence about the causal chain is most important, while Bob might say the evidence about the lived experience and contingencies is most important.

  - However, in our original setup, both historians have the same evidence and agree on the causal claims. The disagreement is purely about narrative weighting. But if we shift to evidential weight, then the case might collapse into a plain disagreement about the evidence: which parts of the evidence are more important to emphasize? But note: they agree on the facts and the causal claims. So if Bob assigns prominence based on evidential weight (say, the amount of primary source material available for an event), then:

    - If the archive has a lot of material on the 1707 experiment (diaries, letters, detailed accounts of the failure and the discovery of the leather seal), then Bob might give it more prominence because it is well-documented and reveals a lot about the process.

    - Alice, however, might still give it less prominence because, despite the wealth of evidence, she considers it less important for the outcome.

    - But this would violate the original constraint: they are both using the same archive and are not suppressing evidence. However, they might interpret the *significance* of the evidence differently.

    - The case would then become a disagreement about the relative importance of different types of evidence (causal vs. contextual) rather than a purely narrative weighting. But note: our original definition of Whiggish is about causal contribution to the outcome.

  **Defending the Whiggish Account:**

  Alice might push back by saying:

  - "The evidence forces us to focus on the events that actually caused the outcome. It would be misleading to give equal weight to events that, while dramatic, were not as causally significant. The purpose of history is to explain how we got to where we are, and that requires emphasizing the causal chain. If we give too much space to events that turned out to be dead ends or were less important in the chain, we distort the historical explanation."

  - She might also argue that the prominence rule is exactly what good historical explanation requires: to highlight what mattered for the outcome. She might say that Bob's account, by giving equal prominence to the 1707 experiment and the 1710 failure, overstates the importance of 1707 relative to 1710 (which had a higher causal contribution). 

  - Moreover, she might claim that the evidence does not force Bob's weighting. The same evidence can be organized in multiple ways, and her way is more explanatory of the outcome.

  **Conclusion:**

  The thought experiment shows that the Whiggishness of an account can arise purely from the narrative structure (the assignment of prominence) and not from factual or causal errors. The key feature is the monotonicity of prominence with respect to causal contribution to a present-day outcome. If we remove that and instead base prominence on evidential weight (which might be correlated with the amount of documentation or the event's contemporary impact), then the case becomes a disagreement about what aspects of the evidence are most important. However, if both historians agree on the causal claims and the facts, then the Whiggishness is a matter of narrative choice, not evidence.

  But note: the defender of the Whiggish account (Alice) would argue that her narrative is the one that the causal evidence forces, because the causal evidence shows that some events contributed more than others. This reveals a deeper philosophical disagreement: is the goal of history to explain the present (which requires a focus on the causal chain that led to it) or to recover the past as it was experienced (which requires attention to the contingencies and the events that seemed important at the time)? The prominence rule for Whiggishness is tied to the former.
