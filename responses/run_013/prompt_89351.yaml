  ### Thought Experiment: The Whiggish vs. Non-Whiggish Narrative  
  **Episode:** The development of the *Stannary Act* in a fictional 18th-century tin-mining region, "Penwithia." The outcome we now care about is the **1710 Penwithia Tin Act** (hereafter, the Act), which standardized mining regulations and boosted production. Both historians, **Dr. Linear** (Whiggish) and **Dr. Contingent** (non-Whiggish), use the same archive and agree on all facts and causal claims.  

  ---

  #### **Step 1: The Facts (Agreed by Both Historians)**  
  The archive contains records of four episodes:  
  1. **1690: The "Tinners' Revolt"**  
     - Tin miners protested unfair levies, leading to minor clashes with crown officials.  
     - **Outcome:** Reforms were promised but never implemented.  

  2. **1700: The Falmouth Conference**  
     - Miners, merchants, and crown officials met to discuss regulations.  
     - **Outcome:** Consensus on standard weights/measures, but no enforcement mechanism.  

  3. **1705: Wheal Vor Disaster**  
     - A mine collapse killed 30 miners. Public outrage forced a temporary shutdown of unsafe mines.  
     - **Outcome:** Spurred inspections, but inspections lapsed within a year.  

  4. **1708: Truro Negotiations**  
     - Secret meetings between merchant elites and crown officials. Drafted the core clauses of the Act.  
     - **Outcome:** Directly produced the draft ratified in 1710.  

  ---

  #### **Step 2: The Causal Claims (Agreed by Both Historians)**  
  - **Causal contribution to the 1710 Act** (measured by how indispensable each episode was to the final outcome):  
    - **Tinners' Revolt (1690):** *Low* contribution. Highlighted grievances but produced no lasting change.  
    - **Falmouth Conference (1700):** *Medium* contribution. Established ideas but lacked teeth.  
    - **Wheal Vor Disaster (1705):** *High* contribution. Forced temporary reforms that kept pressure on elites.  
    - **Truro Negotiations (1708):** *Highest* contribution. Finalized the Act’s text and political backing.  

  ---

  #### **Step 3: Narrative Prominence Assigned by Each Historian**  
  Both historians include all episodes and facts but differ in **prominence** (space, emphasis, narrative arc):  

  - **Dr. Linear (Whiggish Account):**  
    - **Structure:** Arcs linearly toward the 1710 Act.  
    - **Prominence allocation:**  
      - **Tinners' Revolt (1690):** 1 paragraph (minimal space, framed as "background noise").  
      - **Falmouth Conference (1700):** 2 paragraphs (briefly noted as "early steps").  
      - **Wheal Vor Disaster (1705):** 4 paragraphs (emphasized as "catalyst").  
      - **Truro Negotiations (1708):** 8 paragraphs (climactic, detailed analysis of clauses).  
    - **Narrative arc:** Builds inexorably to 1708/1710. Episodes are framed as "stepping stones," with prominence scaling to their causal role in the Act.  

  - **Dr. Contingent (Non-Whiggish Account):**  
    - **Structure:** Emphasizes contingency, dead ends, and lived experience.  
    - **Prominence allocation:**  
      - **Tinners' Revolt (1690):** 5 paragraphs (detailed eyewitness accounts; framed as a turning point *in miners’ consciousness*).  
      - **Falmouth Conference (1700):** 5 paragraphs (explores debates; notes how consensus nearly collapsed).  
      - **Wheal Vor Disaster (1705):** 4 paragraphs (equal emphasis on trauma and *temporary* reforms).  
      - **Truro Negotiations (1708):** 5 paragraphs (avoids climax; treats as elite maneuvering in a chaotic process).  
    - **Narrative arc:** Revolt and Falmouth are "pivotal moments" where history could have diverged; Truro is one outcome among many possibilities.  

  ---

  #### **Step 4: Applying the Prominence Rule**  
  - **Rule:** Prominence must be monotone in causal contribution to the outcome (1710 Act).  
    - Idealized monotone prominence: *Truro (highest) > Wheal Vor (high) > Falmouth (medium) > Revolt (low)*.  
  - **Dr. Linear’s account:**  
    - **Prominence order:** Truro (8) > Wheal Vor (4) > Falmouth (2) > Revolt (1).  
    - **Verdict:** Monotonic. Highest prominence to highest-contribution episodes → **Whiggish**.  
  - **Dr. Contingent’s account:**  
    - **Prominence order:** Revolt (5) = Falmouth (5) = Truro (5) > Wheal Vor (4).  
    - **Violation:** Revolt (low causal contribution) gets equal prominence to Truro (highest contribution). Falmouth (medium) gets more prominence than Wheal Vor (high).  
    - **Verdict:** Non-monotonic → **Not Whiggish**.  

  ---

  #### **Step 5: The Feature Doing the Work**  
  - **Key feature:** *Dr. Contingent assigns prominence based on the episode’s perceived significance at the time*, not its retrospective causal contribution.  
    - The Revolt (1690) had immense contemporary impact (e.g., shaped miner identity) but contributed little to the Act.  
    - Truro (1708) was decisive for the Act but was a closed-door meeting with little public resonance.  
  - **Consequence:** Dr. Contingent’s weighting reflects how actors *experienced* events, rejecting hindsight.  

  ---

  #### **Step 6: What If Prominence Tracks Evidential Weight?**  
  - **Scenario:** Both historians assign prominence based on "evidential weight" (e.g., volume of archival documents).  
    - Archive contents:  
      - Revolt (1690): 100 pages (eyewitness depositions, court records).  
      - Falmouth (1700): 20 pages (minutes, letters).  
      - Wheal Vor (1705): 50 pages (inquests, sermons).  
      - Truro (1708): 10 pages (sparse notes; most burned in a fire).  
  - **Result:**  
    - Both historians would allocate prominence as: **Revolt (high) > Wheal Vor (medium) > Falmouth (low) > Truro (lowest)**.  
    - **Effect on Whiggishness:**  
      - Dr. Linear’s account now violates monotonicity (Revolt gets high prominence but low causal contribution).  
      - Dr. Contingent’s account aligns with evidence but still violates monotonicity.  
    - **Collapse?** Yes—the distinction between Whiggish/non-Whiggish dissolves. They now have a **plain disagreement about evidence**, not narrative weighting. Dr. Linear would resist this, arguing Truro’s causal role *should* override scant evidence.  

  ---

  #### **Step 7: The Whiggish Historian’s Pushback**  
  **Dr. Linear’s defense:**  
  > "The evidence *forces* my weighting. The Truro Negotiations were objectively decisive for the Act—without them, there’d be no outcome. Giving equal space to the Revolt (which changed nothing) or Falmouth (which failed) distorts causality. History’s job is to explain *why* outcomes happened, not dwell on dead ends. If we ignore causal contribution, we turn history into a series of unweighted anecdotes."  

  **Key argument:**  
  - Prominence *must* track causal contribution because history is explanatory. Contingency-focused narratives are "merely descriptive" and fail to explain the present.  

  ---

  ### Conclusion  
  The case shows Whiggishness is **purely a property of narrative weighting**, not facts or causality. The difference arises because Dr. Linear ties prominence to *retrospective causal outcomes*, while Dr. Contingent ties it to *contemporary significance*. If prominence shifts to evidential weight, the Whiggish/non-Whiggish distinction collapses into evidentiary debate—but Dr. Linear would reject this, insisting causal contribution must dominate. This reveals Whiggishness as a **methodological stance**: that history should prioritize explanation of known outcomes over recovering past subjectivity.
