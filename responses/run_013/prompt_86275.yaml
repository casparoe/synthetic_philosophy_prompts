answer: |-
  Here are the desiderata for any adequate theory of letter identity, grounded in core phenomena, with cases, distinctions, and inherent tensions highlighted:

  ### I. Phenomena & Core Requirements (What the theory MUST explain)
  1.  **Sameness Across Radical Variation (The 'a' Requirement):** The theory must explain why fundamentally different shapes (e.g., single-storey `ɑ`, double-storey `a`, block `𝖺`, script `𝒶`, handwritten scribble) are all recognized as the same letter 'a'.
      *   **Case:** A child reads both "cat" in a storybook (double-storey 'a') and "cat" on a neon sign (single-storey 'ɑ') as the same word.
      *   **Distinction:** Letter category identity vs. stylistic realization (glyph form).

  2.  **Difference by Minor Perturbation (The b/d/p Requirement):** The theory must explain why a small, specific change (e.g., rotating, mirroring) can transform one letter category into another (b → d → p → q), while equally large changes within *another* category (like 'a') do not.
      *   **Case:** A rotated 'b' becomes a 'd'; a mirrored 'd' becomes a 'p'; a poorly closed 'c' might look like an 'e', but a distorted 'a' is still an 'a'.
      *   **Distinction:** Critical topological/spatial relationships vs. mere overall shape similarity.

  3.  **Robustness to Malformation & Ambiguity (The Scribble Requirement):** The theory must account for how letters can be recognized even when poorly formed, incomplete, or ambiguous in isolation, often relying on context.
      *   **Case:** A hastily written 'r' that lacks a descender might resemble an 'n'; a smudged 'o' might look like a 'c'; a very narrow 'm' might resemble 'rn'. Recognition often succeeds despite this.
      *   **Distinction:** Glyph in isolation vs. glyph within a word/alphabet system; literal shape vs. inferred intent/category.

  4.  **Equivalence of Canonical Variants (The Single/Double-Storey Requirement):** The theory must accommodate the existence of multiple, structurally distinct yet equally valid canonical forms for the same letter within a writing system (e.g., single-storey vs. double-storey 'a' or 'g').
      *   **Case:** The letters 'a' and 'g' have two widely accepted printed forms (ɑ/a, ɡ/g), neither considered a distortion of the other. Both are 'a' and 'g'.
      *   **Distinction:** Core identity vs. permissible variation within the category's definition.

  ### II. Foundational Distinctions (What the theory MUST respect)
  5.  **Category vs. Style:** The theory must clearly separate the abstract letter category (e.g., the concept 'a') from its concrete stylistic instantiation (e.g., Times New Roman 'a', Helvetica 'a', italic 'a', handwritten 'a').
      *   **Case:** We understand that changing a font changes the *style* of the letters, not their *identity* ("cat" in Comic Sans is still "cat").
      *   **Artifact:** This distinction is fundamental to understanding writing systems and typography; *not* an artifact.

  6.  **Shape Similarity vs. Letter Identity:** The theory must acknowledge that high visual similarity between shapes does not guarantee identical letter identity (e.g., 'c' and 'e' can be very similar but are distinct), and conversely, low similarity does not preclude identical identity (e.g., single/double-storey 'a').
      *   **Case:** A slightly open 'c' might look almost identical to a poorly closed 'e', yet they represent different phonemes/graphemes. Conversely, `ɑ` and `a` look very different but represent the same.
      *   **Artifact:** This is a genuine requirement reflecting the symbolic nature of writing vs. pure iconicity.

  7.  **Isolation vs. System Constraint (The Context Dependence Requirement):** The theory must account for the fact that the identity of a glyph is often determined not solely by its intrinsic shape, but by its relationship to and differentiation from other glyphs in the specific alphabet or word context.
      *   **Case:** The ambiguous shape `┌┐` in isolation could be 'u' or 'n'. In "┌┐t" it's likely 'nut' (so 'n'). In "b┌┐t" it's likely 'but' (so 'u'). In "m┌┐im┌┐m" it could be 'minimum' (n/u/n/u/n). The surrounding letters constrain the interpretation. What counts as a valid 'r' depends on how 'n', 'v', 'm', etc., are drawn in that specific hand or font.
      *   **Genuine Requirement:** This is crucial for explaining contextual disambiguation and the systematic nature of alphabets.

  ### III. Cognitive & Systemic Facts (What the theory MUST be consistent with)
  8.  **Learned System Membership:** The theory must be consistent with the fact that letter recognition is a learned skill based on exposure to a specific writing system. What constitutes an 'a' is defined by convention within that system.
      *   **Case:** A child learns that both `ɑ` and `a` are called "ay" and represent the same sound in their language, while `b` and `d` are distinct. The criteria are culturally transmitted.
      *   **Genuine Requirement:** Rules out innate geometric definitions.

  9.  **Differentiation Within the Alphabet:** The theory must reflect that a letter's identity is partly defined by how it *differs* from other letters in the specific alphabet set used, ensuring mutual distinguishability.
      *   **Case:** In a font where 'I' (capital i) and 'l' (lowercase L) are identical (`I`), context or knowledge of the alphabet set is essential for disambiguation. The acceptable shape for 'r' is constrained by the shapes chosen for 'n', 'v', and 'h' in that same font/handwriting.
      *   **Genuine Requirement:** Directly follows from Requirement 7 and the combinatorial nature of writing.

  ---

  ### Tensions & Exclusions

  1.  **Sharpest Tension:**
      *   **Requirement 1 (Sameness Across Radical Variation - e.g., single/double-storey 'a') vs. Requirement 7 (System Context Dependence).**
      *   **Why:** Requirement 1 suggests an 'a' has some intrinsic, perhaps abstract, property that persists despite radical shape change *inherent to the category*. Requirement 7 suggests an 'a' is defined by its role in *differentiating* from other letters *in a specific context*. How can radically different shapes (`ɑ` vs `a`) inherently belong to the same category *and* fulfill the same systemic role across vastly different fonts/hands where the *entire set* of differentiating features changes? A purely intrinsic theory struggles with `ɑ`/`a` equivalence. A purely systemic theory struggles to explain why `ɑ` is *always* an 'a' regardless of the surrounding letters in *that* instance (though its systemic role defines the *category*).

  2.  **The Most Excluding Requirement:**
      *   **Requirement 7 (System Context Dependence)** is the single requirement that excludes the most otherwise-popular intuitive or simplified theories.
      *   **Excluded Theories:**
          *   **Prototype Theories (Averaged Shape):** Cannot explain why `ɑ` (which may be far from the 'average' a-shape in a system using `a`) is still an 'a', or how malformed glyphs are recognized. Fails Requirement 1 & 3.
          *   **Essential Geometric Feature Theories (e.g., "an 'a' must have an enclosed bowl"):** Fail Requirement 1 spectacularly (single-storey 'ɑ' often lacks an enclosed bowl), and struggle with Requirement 4. Also struggle with Requirement 7 (features might not be sufficient for differentiation in all contexts).
          *   **Pure Topological Theories (e.g., connectivity):** Fail Requirement 1 (compare topology of `ɑ` vs `a`) and Requirement 2 (b/d/p/q share the same topology: one stem + one connected lobe). Struggle with Requirement 4.
          *   **Pure Template Matching:** Fails Requirements 1, 4, and 3 (malformations). Utterly fails Requirement 7.
      *   **Why Requirement 7 Excludes Them:** All these theories focus primarily or exclusively on the *intrinsic properties of the isolated glyph shape*. Requirement 7 demands that letter identity is fundamentally relational and contextual, depending on the *system* and the *other letters present*. A theory that only looks at the glyph in isolation cannot satisfy Requirement 7.

  ---

  ### Settled vs. Contested

  *   **Settled:**
      *   Letter recognition is learned, not innate (Requirement 8).
      *   Letters function as part of a system (alphabet/script) where differentiation is key (Requirement 9).
      *   Stylistic variation exists within a stable category identity (Distinction 5).
      *   Context (word, alphabet system) plays a crucial role in disambiguating glyphs, especially malformed or ambiguous ones (Aspect of Requirement 3 & 7).

  *   **Genuinely Contested:**
      *   **The Primacy of Intrinsic Features vs. Systemic Role:** Is there a core set of abstract features or a schema defining 'a'-ness that persists (supporting Req 1/4), or is 'a'-ness *primarily* defined by its functional role in differentiating from other letters within a specific instantiation of the system (supporting Req 7/9), or is it a hybrid? This is the core tension.
      *   **Nature of the Abstract Category:** Is the abstract letter category best represented as a prototype, a set of necessary & sufficient features, an exemplar cloud, or a schema defined by its position in a relational system? There is no consensus.
      *   **Scope of Context Dependence:** *How much* can context override shape? Can a shape that perfectly matches 'b' in isolation be read as 'd' in the word "red" if the system context demands it? Most agree context resolves ambiguity (e.g., the `┌┐` case), but whether it can *completely override* unambiguous shape is debated. Requirement 7 focuses on the necessity of context for ambiguous/malformed cases and for defining the category boundaries within a system, not necessarily on overriding unambiguous canonical shapes.
      *   **Representational Level:** Is the core identity tied more closely to perceptual shape patterns or to abstract linguistic function (grapheme/phoneme correspondence)? The relationship is complex and contested.

  The desiderata reveal that an adequate theory must navigate a path between the persistence of identity under radical shape change and the fragility of identity under minor changes, all while acknowledging that letters are not shapes in a vacuum but learned symbols existing within a constraining and defining system. The tension between intrinsic properties and systemic role remains the central theoretical challenge.
