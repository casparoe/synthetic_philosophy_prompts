answer: |-
  Here's a complete, ready-to-run activity design that meets all your requirements. The structure ensures students experience the dilemmas viscerally before conceptualizing them.

  ---

  ### **Activity: Symmetry & Choice**
  **Materials Needed:**
  - 40 blank index cards
  - 20 envelopes
  - 1 lockable collection box (or sealed shoebox with slot)
  - Dice (1 per student) or allow phone randomizers
  - 200+ small candies (e.g., M&Ms) for payouts
  - Laptop with this Python script for lottery drawing:
    ```python
    import random
    entries = [int(x) for x in input("Enter numbers separated by spaces: ").split()]
    total = sum(entries)
    ticket_list = []
    for i, num in enumerate(entries):
        ticket_list += [i] * num
    winner = random.choice(ticket_list) if ticket_list else None
    print(f"Total: {total} | Pot: {round(100/total,1)} candies" if total > 0 else "No winner")
    print(f"Winner: Student {winner+1}" if winner is not None else "No valid entries")
    ```

  ---

  ### **Round 1: Telegram Dilemma (15 min)**
  1. **Setup (2 min)**  
     - Distribute 1 envelope + 1 blank card per student.  
     - *In character:* "I'm the Benefactor. If exactly ONE of you writes 'SEND' on a card, seals it in your envelope, and drops it in the box by the 3-minute deadline, that person wins this entire bag of candy. If zero or multiple send, all lose. No communication."  

  2. **Play (3 min)**  
     - Start timer. Observe body language.  

  3. **Reveal (2 min)**  
     - Open box. Hold up envelopes without opening.  
     - *If 0:* "No telegrams sent."  
     - *If 1:* Open envelope, award candy.  
     - *If >1:* Show unopened envelopes: "Too many sent."  

  4. **Record**  
     - Secretly mark envelopes "A" for first attempt, "B" for variation. Track counts.

  ---

  ### **Round 1 Variation: Randomizer (10 min)**  
  - Redistribute envelopes.  
  - "New rule: You may use a die/phone. Roll *before* deciding to send. All else unchanged."  
  - Repeat play/reveal.  
  - *Key:* Compare counts. Expect 2-4 sends (vs. 0 or 20 in Round 1).

  ---

  ### **Round 2: Luring Lottery (20 min)**  
  1. **Rules (3 min)**  
     - "Write a whole number ≥1 on a card. Total = sum(all numbers). Prize pot = 100 candies."  
     - "Pot per winner = 100 / Total (rounded to nearest whole candy)."  
     - "Your entry count = your number. Higher number = better odds but smaller pot."  
     - *Example:* "If total=20, pot=5 candies. If you wrote '4', you have 4 of 20 lottery tickets."  

  2. **Play (4 min)**  
     - Students write numbers secretly. Collect cards.  

  3. **Payout (3 min)**  
     - Run script with inputs. Announce winner + candy amount.  
     - *Pro tip:* Dramatically round candies (e.g., "Pot was 4.7 candies → 5 candies").  

  ---

  ### **Debrief (25 min)**  
  **Guide the discovery:**  
  1. **Telegram Failure Modes (5 min)**  
     - *Ask:* "In Round 1, why did we get [0/20]? What were you thinking?"  
     - *Surface:* "If I send, others might too" vs. "If I don't, no one will."  
     - *Reveal:* "Both are symmetric reasoning—assuming others think like you."  

  2. **Randomizer Shift (5 min)**  
     - *Ask:* "Why did randomization change outcomes?"  
     - *Build concept:* "Symmetric players → identical decisions. Randomness breaks symmetry. Optimal send probability = 1/N (here 1/20=5%)."  

  3. **Lottery Explosion (10 min)**  
     - *Ask:* "Why did numbers balloon? Who wrote [high number]? Why?"  
     - *Reframe resentment:* "Blame the math, not the player. Best response = total of others' numbers. If all think this → runaway growth."  
     - *Script demo*: Show (n_i / T) * (100/T) payoff formula. Ask: "What if everyone writes 1? 10? 1000?"  

  4. **Name the Concept (5 min)**  
     - "This is **superrationality**: Choosing as if your reasoning is mirrored by all identical players. It resolves symmetries but crumbles when incentives push toward infinity."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Silent Coordination Attempts**  
     - *Signs:* Eye contact, exaggerated non-action, strategic coughing.  
     - *In-game fix:* "The Benefactor voids prizes if signaling is detected." Walk through aisles.  
     - *Debrief use:* "Did anyone try to coordinate? Why couldn't it work?" (Highlights need for communication protocols.)  

  2. **Goofing Off with Small Stakes**  
     - *Prevention:* Start in character ("This candy represents life-changing money"). Award physical candy immediately for wins.  
     - *Reframe:* "If this were $1M, would your number be different? The structure forces this tension regardless of stakes."  

  3. **Lottery Entry Confusion**  
     - *Clarify pre-play:* "Your number buys MORE tickets but makes ALL tickets worth LESS."  
     - *Script safeguard:* Pre-test with extreme inputs (e.g., [1,1,1000]).  

  ---

  ### **What the Activity Can't Replicate**  
  1. **Astronomical Scale**  
     - Students won't *feel* infinity. Some may write 100, but not 10¹⁰.  
     - *Tell them:* "Real lotteries see entries like 10³⁰. At that scale, 100/T rounds to zero—winning gives nothing."  

  2. **True Stakes**  
     - Candy ≠ existential stakes.  
     - *Say:* "With $1B, the pressure to defect would be crushing. Small stakes let us see the logic cleanly."  

  3. **Pure Randomization**  
     - Students won't naturally deduce p=1/N.  
     - *Explain post-game:* "Symmetric players randomize identically. Probability is derived from needing exactly one 'send' (Poisson math)."  

  ---

  ### **Why This Works**  
  - **Emotional arc:** Students *live* the paralysis (Telegram) and frustration (Lottery) before analysis.  
  - **Physicality:** Envelopes/box create gravity. Candy makes payouts visceral.  
  - **Contrast:** Comparing Round 1 vs. Variation highlights randomization's power.  
  - **Climactic naming:** "Superrationality" arrives as the key to their lived experience.  

  Run this tight, and they'll leave buzzing—ready for your friend's theory deep dive.
