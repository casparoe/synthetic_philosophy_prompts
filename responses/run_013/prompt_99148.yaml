  Okay, let me start by unpacking the user's problem. They're in a philosophy of history working group and their colleague presented an argument that leads to the conclusion that history doesn't actually explain anything. The user finds this conclusion unacceptable but can't refute the argument. They want to know which premise is faulty and what rejecting it would entail.

  First, I need to break down the colleague's argument step by step. Premises (1) and (2) establish that explanation requires subsumption under general laws. (3) follows from that, and (4) states historians do explain. (5) combines these to say history must use laws. But (6) points out that no such laws exist in history, and (7) argues that if a requirement can't be met in practice, it's not genuine. Thus, (8) concludes history doesn't explain.

  The user is stuck because they accept (1)-(4) but can't accept (8). They're also worried about a parallel issue with narrative history being arbitrary. I should identify which premise is the weakest link. 

  Looking at (6), it claims all candidate laws are false or vacuous. But maybe this is too strong. Historians might use ceteris paribus laws—generalizations that hold under specific conditions. While these aren't universal like in physics, they're not useless. For example, a generalization about economic distress leading to unrest might have exceptions, but it's still explanatory in context. So (6) might be overlooking how these generalizations function in history.

  Then there's (2), which insists on strict general laws. But perhaps explanation doesn't require strict laws. Counterfactual dependence is an alternative—showing how the outcome depended on specific causes without needing universal laws. This fits historical practice better. Rejecting (2) allows keeping explanation without strict laws, preserving (4) and avoiding (8).

  The user also worries about narrative selection being arbitrary. But narrative coherence provides a different kind of explanation, linking events meaningfully rather than through laws. While selection is necessary, it's not arbitrary if guided by explanatory relevance. This contrasts with the covering-law model's problem where no actual laws are found.

  Considering costs: rejecting (6) means defending historical generalizations as valid despite exceptions. Rejecting (2) requires an alternative account of explanation, like pragmatics or counterfactuals. The latter seems more feasible since it aligns with actual historical practice. The user needs a conception that justifies 'because' without storytelling. Emphasizing contextual and contrastive explanation could work here—historians explain why something happened rather than something else, which doesn't require universal laws.

  The parallel narrative argument is less problematic because selection is based on explanatory goals, not arbitrary. So narrative isn't embarrassed in the same way. The covering-law model fails because its requirement isn't met, but narrative's selectivity is inherent and purposeful.
answer: |-
  Your colleague's argument is a sophisticated revival of Carl Hempel's covering-law model critique, pressing it to a skeptical conclusion about historical explanation. The flaw lies primarily in **premise (6)**, with secondary issues in **premise (2)**. Rejecting these allows you to retain (4) (historians explain) and avoid (8) (history doesn't explain), while offering a defensible account of historical "because." Here's the breakdown:

  ### 1. **Premise (6) is Overstated and Misleading**  
     - **The Claim**: "Every candidate law we supply... proves false, vacuous, or hedged."  
     - **The Problem**: This ignores how generalizations *actually function* in historical explanation. Historians use **ceteris paribus generalizations** (e.g., "Severe economic crises increase the risk of regime collapse") that are:  
       - **Contextually bounded**: They hold *under specific historical conditions* (e.g., pre-industrial agrarian economies, modern democracies).  
       - **Defeasible**: They admit exceptions without being vacuous (e.g., "unless offset by strong nationalist solidarity").  
       - **Mechanistic**: They often reference *causal mechanisms* (e.g., "economic crisis → popular unrest → elite defection → collapse") rather than universal laws.  
     - **Why it Matters**: Rejecting (6) undercuts the inference to (7). Historians *do* invoke generalizations (e.g., about revolution, bureaucratic inertia, or diplomatic escalation), but they are **middle-range** (applicable to specific contexts) and **pragmatically deployed** (invoked when relevant). Their "hedged" nature doesn't make them non-explanatory; it reflects the complexity of social systems.

  ### 2. **Premise (2) is Too Narrow**  
     - **The Claim**: Explanation *requires* subsumption under "general regularities."  
     - **The Problem**: This assumes the *only* way to make events "expectable" is via covering laws. But historical explanation often works through:  
       - **Counterfactual dependence**: Showing that *if X hadn't occurred, Y wouldn't have happened* (e.g., "Without the Tsar's miscalculations in 1916, the February Revolution might have been avoided").  
       - **Causal mechanisms**: Tracing processual linkages (e.g., "War exhaustion → bread shortages → street protests → military mutiny → abdication").  
       - **Contrastive explanation**: Explaining *why P rather than Q* (e.g., "Why did the Weimar Republic collapse *rather than stabilize*?" focuses on specific vulnerabilities).  
     - **Alternative to (1)/(2)**: Replace the covering-law model with a **pragmatic** or **mechanistic** theory of explanation (e.g., Woodward's counterfactuals, Machamer-Darden's mechanisms). This retains (1)'s core idea (making occurrences intelligible) without requiring strict laws.

  ### Escaping the Reductio
  - **Retain (4) and reject (8)**: Historians *do* explain.  
  - **Revise (2) and (6)**:  
    - Explanation relies on **non-universal but robust patterns** and **causal mechanisms**.  
    - Historical generalizations are **not falsified** by exceptions; they are **refined by them**.  

  **Costs of Rejection**:  
  - **Abandoning strict covering laws**: Requires conceding that historical explanations are *not* nomologically deductive like physics. But this aligns with actual practice.  
  - **Accepting contextual generalizations**: Forces philosophers to engage with the messy, contingent nature of social causality.  

  ---

  ### Addressing Your Concern About Narrative Arbitrariness
  Your worry is astute: if covering-law explanations fail because laws are elusive, couldn't narratives fail because event-selection is arbitrary? The parallel argument would be:  
  > *"Narratives select arbitrarily from infinite antecedents, so they don't objectively explain."*  

  **Why this is less threatening**:  
  1. **Narrative coherence** provides a constraint: Events are selected based on **explanatory relevance to the outcome** (e.g., including the Treaty of Versailles in a WWII narrative but not contemporary weather patterns).  
  2. **Contrastive focus**: Historians address specific puzzles (e.g., "Why did Rome fall *when it did*?"), which limits relevant antecedents.  
  3. **Mechanisms anchor selection**: If a narrative traces a causal mechanism (e.g., "inflation → currency debasement → loss of legionary pay → border defenses weakened"), inclusion is non-arbitrary.  

  **Key Difference**: While covering-law models demand *universal laws that don't exist*, narrative explanations demand *selective causal links that do exist*. The latter is tractable; the former is not.  

  ---

  ### A Path Forward: What Historians' "Because" Achieves
  To defend historical explanation without covering laws:  
  1. **Adopt a contrastive-pragmatic model**:  
     - Historians explain *why P rather than Q* (e.g., "Why did the French Revolution occur in 1789 *rather than 1750 or 1800*?").  
     - This focuses on **salient differences** in antecedents (e.g., fiscal crisis + Enlightenment ideas), not universal laws.  
  2. **Embrace mechanistic explanations**:  
     - Show how a chain of events (A → B → C) produced an outcome through identifiable social mechanisms (e.g., "resource competition → ethnic polarization → violence").  
  3. **Use middle-range generalizations**:  
     - Invoke defensible claims like, "Sustained military defeats undermine authoritarian regimes" (true in many cases, falsifiable but not falsified by exceptions).  

  **Result**: You keep historians' "because" (it cites real, non-arbitrary causes), avoid storytelling reductionism, and reject the covering-law straitjacket—while conceding that historical explanations are **probabilistic** and **context-bound**. The colleague's argument fails because it mistakes the *absence of physical-style laws* for the *absence of explanation*.
