  Okay, the user is leading a discussion on Robert Bolt's "A Man for All Seasons" and wants to approach it through Plutarch's lens of biography. They have several layered questions about whether the play is Plutarchan or hagiographic, the moral implications of having one hero versus paired lives, and how situationist psychology challenges the idea of learning from character examples. 

  First, I need to unpack their core concerns: They're wrestling with whether Bolt's portrayal of Thomas More serves as a genuine moral exemplar (Plutarch's approach) or an unrealistic saint (hagiography). The absence of Plutarch's comparative structure in Bolt's play seems significant to them—why present More alone amidst moral inferiors? And the situationist critique looms large: if behavior is context-dependent, can we really learn from individual character?

  The user clearly wants concrete textual analysis ("point me to specific scenes") and original insights that move beyond just applying Plutarch. They're wary of reducing the play to an illustration of Plutarch's ideas. Their deeper aim seems to be reconciling the play's moral ambition with modern skepticism about fixed character traits.

  Hmm, interesting tension here: Plutarch believes small gestures reveal character, but situationists say those gestures might just reflect circumstances. The Common Man scenes might be Bolt's answer—showing how ordinary people rationalize moral compromises. More's refusal to manipulate the oath in Act II ("What matters is that I don't take it") feels key: it's less about grand heroism than precise consistency.

  The user's mention of Richard Rich is telling. Rich isn't just a villain; he's the counter-example who reveals how context corrupts ("Every man has his price"). That scene with the silver cup is almost Plutarchan in its revealing detail. But Bolt complicates it by making Rich's fall gradual—which subtly addresses the situationist point. More's character holds across contexts, while Rich's disintegrates.

  For the discussion's end, I should emphasize Bolt's insight: Moral exemplars matter precisely because situations pressure us. More isn't a statue; he's a man who chooses integrity despite context. The play shows character as both formed and tested by circumstance—neither pure virtue ethics nor pure situationism captures that. The Common Man's direct address ("It isn't difficult to keep alive, friends") forces the audience to confront their own situational compromises.

  ...Wait, the user wants to avoid making the play "an illustration of Plutarch." So I must frame Bolt as engaging with Plutarch's questions (how lives teach) while offering distinct answers. The Common Man's role is crucial here—he's Bolt's invention that Plutarch wouldn't use, making us complicit in moral mediocrity. That's where the play transcends both ancient biography and modern psychology.
answer: |-
  Here's a framework for your discussion, focusing on your core questions and moving beyond Plutarchan illustration to Bolt's unique insights on learning from lives, while addressing the situationist challenge:

  **Core Tension:** Is Bolt writing Plutarchan biography (revealing character through small moments to inspire emulation) or hagiography (idealized, uncritical admiration)? Does the distinction matter?

  1.  **Plutarch vs. Hagiography: The Distinction & Bolt's Nuance:**
      *   **Plutarch:** "I am not writing history but lives... a slight thing like a phrase or a jest often makes a greater revelation of character than battles... where thousands fall." Focus on revealing *character traits* (good and bad) through *specific, telling moments* to inspire *emulation* or *avoidance*. Comparative structure aids judgment.
      *   **Hagiography:** Emphasizes saintly perfection, miracles, unwavering faith, often minimizing flaws or complexity. Aim is veneration, not necessarily practical emulation.
      *   **Bolt's More: The Resistance to Pure Hagiography:**
          *   **Scene: More and Rich discussing "comfort" (Act 1).** More advises Rich to teach, showing awareness of worldly temptation ("Why not be a teacher?") but also a potential lack of full empathy for Rich's ambition. His advice, while good, feels slightly detached.
          *   **Scene: More's pragmatism.** His intricate legal maneuvering, refusal to see Cromwell ("The Great Visitor"), use of silence, and even his initial hope to "lie low" until the storm passes. He's not seeking martyrdom; he's strategically trying to survive *without* compromising his soul.
          *   **Scene: His anger with Roper (Act 1).** "God's my god... But I find [Him] rather too subtle... I don't know where He is nor what He wants." This reveals profound human doubt and anguish, not serene certainty.
          *   **Conclusion:** Bolt avoids pure hagiography by showing More's *human* struggles: pragmatism, fear, doubt, strategic calculation. His heroism lies in his *choices* made *despite* these very human feelings, not in their absence. He is *tested*, not inherently flawless.

  2.  **One Hero vs. Plutarch's Pairs: The Moral Landscape & Lesson:**
      *   **Plutarch's Pairs:** Facilitate nuanced comparison ("Was Cato more virtuous than Phocion?"). Encourages critical judgment of *relative* virtues/vices in similar contexts.
      *   **Bolt's "Chorus of Inferiors":**
          *   **Effect:** Creates stark moral contrast, emphasizing More's singularity. It feels less like a comparison of viable paths and more like a demonstration of corruption's various forms (Rich's ambition, Norfolk's loyalty to king over principle, Cromwell's ruthless pragmatism, Wolsey's cynicism).
          *   **Moral Lesson:** The play doesn't ask "Which virtue is best?" but rather "Can integrity survive *at all* in a world of power?" The lesson is less about *choosing between* virtues and more about the *cost* and *nature* of holding *any* principle against overwhelming pressure. The "inferiors" serve as warnings, not alternative models for emulation.
          *   **Scene: Rich's betrayal for Wales (Act 2).** Not just evil, but a chillingly banal descent: small compromises leading to the ultimate betrayal. Shows the *process* of corruption More resists.
          *   **Scene: Norfolk's desperate plea (Act 2 - "Oh confound all this...").** Shows the anguish of a fundamentally decent man caught between friendship and state power, unable to find More's anchor. He's not purely "inferior," just unable to match More's extreme resolve.

  3.  **Imitate or Admire? The Practicality of More:**
      *   **The Play's Challenge:** Bolt presents More's *extreme* sacrifice as necessary for his *specific* principle (integrity of soul/conscience before God and Law) in his *specific* situation (tyranny attacking the foundation of law itself). He doesn't suggest everyone must face the block.
      *   **Scene: More's explanation to Margaret (Act 2 - "When a man takes an oath... he holds his own self in his own hands").** This is the core. The lesson isn't "die for your beliefs," but rather "understand what truly constitutes *your* self, your integrity, and be prepared to defend *that* absolutely, whatever the cost *to you*." It's about knowing your inviolable line.
      *   **Distinction:** The play likely asks for **admiration of the *principle* of unwavering integrity**, and **emulation of the *clarity* and *courage* to define and hold one's line**, even if the *specific* line and *ultimate cost* differ. We admire the *quality* of his commitment; we might emulate the *process* of defining and defending our own core integrity in *our* lesser trials.

  4.  **The Situationist Challenge: Gutting Plutarch?**
      *   **The Critique:** If behavior is primarily driven by situational pressures (Milgram, Stanford Prison Exp.), not stable character traits, then studying "great lives" for character lessons is futile. More was just cornered; Rich was pressured.
      *   **Bolt's Response (Through the Play):**
          *   **More's Consistency:** The play *shows* More's character holding *across* situations. His principles guide him in private (Rich), public (Parliament, trial), family (Margaret, Alice), and under intense pressure (interrogations, prison). His *character* is his strategy.
          *   **Rich's Situational Corruption:** Rich is the situationist poster child – his environment *does* shape him. But Bolt presents this not as inevitable, but as a *failure* to cultivate an inner anchor. Rich *has* no "self" to hold onto.
          *   **The Common Man:** The ultimate situationist figure! He constantly adapts, justifies, and survives ("It isn't difficult to keep alive, friends...just don't make trouble"). He embodies the *alternative* to character-driven action. His direct address forces the audience to confront their own situational compromises.
          *   **Scene: More in prison refusing to swear (Act 2 - "When a man takes an oath...").** This isn't just a reaction to *this* situation; it's the culmination of a lifetime's understanding of self and law. The situation *reveals* his character; it doesn't *create* his response in isolation.

  5.  **What Bolt Shows About Learning from Lives (Beyond Plutarch & Situationism):**
      *   **The Cost of Integrity:** Plutarch shows character; Bolt shows the *excruciating human price* of maintaining it against systemic, corrupting power. He makes the abstract cost visceral (loss of family, home, comfort, life).
      *   **The Anatomy of Compromise:** Plutarch compares virtues; Bolt dissects the *process* of moral failure (Rich, Norfolk) and the rationalizations used (The Common Man), showing the slippery slope in intimate, human detail.
      *   **Integrity as Active Defense:** More isn't just "virtuous"; he fights for his soul with legal brilliance, silence, and strategic withdrawal. Integrity isn't passive goodness; it's an active, often costly, defense of a core self.
      *   **The Audience as Participant:** The Common Man breaks the fourth wall, forcing us out of passive admiration ("admire me") and into complicity ("would *you* do differently?"). Learning isn't just observation; it's uncomfortable self-confrontation.
      *   **The Necessity of the Anchor:** Against situationism, Bolt argues that without a consciously defined, inviolable core principle (More's "self"), individuals *are* merely products of circumstance (Rich, Common Man). The play shows *how* such an anchor functions under pressure.

  **Conclusion for Your Discussion:**  
  Bolt uses Plutarch's technique of revealing character through specific moments (More's pragmatism, anger, the silver cup, the prison explanation) but transcends both Plutarch and hagiography. He presents More not as a flawless saint but as a profoundly human exemplar of *defining and holding an inviolable line*, showing the terrible cost and active defense required. The "chorus of inferiors" isn't for nuanced comparison but to illustrate the pervasive power of corruption and the process of failure. The play directly confronts the situationist challenge by showing More's character as a *stable force* guiding him *through* diverse situations, while Rich embodies situational corruption. Ultimately, Bolt argues that learning from More isn't about copying his martyrdom, but understanding the *necessity* of defining one's core self ("What matters is that I don't take it!") and the *courage* required to defend it, however great or small the immediate cost may be. The play teaches that in a world of pressures, an unanchored self is lost, and integrity is the hardest, most essential fight.
