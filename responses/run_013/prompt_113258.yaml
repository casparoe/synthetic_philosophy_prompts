answer: |-
  ### Graduate Reading Group Specification: Core Desiderata for Theories of Dispositions  

  **Brainstorming: Live Families of View**  
  1. **Conditional Analyses (CA) & Repairs:** Dispositions as subjunctive conditionals (e.g., *if x were struck, it would break*); amended to handle finks/masks (e.g., *retained after stimulus* clauses).  
  2. **Dispositional Monism/Pan-dispositionalism:** All properties are fundamentally dispositional; no "categorical" bedrock.  
  3. **Categoricalist/Humean Accounts:** Dispositions reduce to non-dispositional bases (e.g., microstructure + laws); disposition-talk is heuristic.  
  4. **Essentialist/Functionalist Accounts:** Dispositions grounded in essence (e.g., salt’s solubility is essential) or systemic function (e.g., heart’s disposition to pump blood).  
  5. **Primitivism:** Dispositions are irreducible, basic features of properties.  

  ---

  ### **Desiderata for an Adequate Theory of Dispositions**  
  *(Non-negotiables marked **)***  

  1. **Unmanifested Dispositions**  
     - **Statement:** Must allow dispositions to exist unmanifested.  
     - **Motivation:** A fragile vase never struck retains fragility.  
     - **Type:** Phenomenon to explain.  
     - **Status:** **Non-negotiable** (Dispositions ≠ manifestations; without this, dispositionality collapses).  

  2. **Finkish Cases**  
     - **Statement:** Must explain dispositions lost *during* stimulus application (e.g., live wire disconnected *as* touched).  
     - **Motivation:** Martin’s wire: disposed to conduct when untouched, but loses disposition upon contact.  
     - **Type:** Case to get right.  
     - **Status:** **Non-negotiable** (Tests stimulus-manifestation link; failure implies inadequate modal analysis).  

  3. **Masking/Antidotes**  
     - **Statement:** Must distinguish disposition survival from manifestation prevention (e.g., poison antidote blocks death).  
     - **Motivation:** A fragile vase wrapped in bubble wrap remains fragile but doesn’t break when struck.  
     - **Type:** Distinction to preserve.  
     - **Status:** **Non-negotiable** (Collapsing disposition/power with manifestation denies causal independence).  

  4. **Mimicking Cases**  
     - **Statement:** Must exclude false positives (manifestation without disposition) and false negatives (disposition without manifestation).  
     - **Motivation:** A non-porous "sponge" squeezed by a machine mimics water-absorption; an insulated wire fails to conduct despite conductivity.  
     - **Type:** Case to get right.  
     - **Status:** **Non-negotiable** (Preserves dispositional identity and veridicality).  

  5. **Multi-Track Dispositions**  
     - **Statement:** Must accommodate single dispositions with multiple manifestations (e.g., elasticity: stretch, compress, rebound).  
     - **Motivation:** Science ascribes unified powers to objects (e.g., charge’s diverse electromagnetic effects).  
     - **Type:** Scientific consistency.  
     - **Status:** Preference (Monists demand it; Humeans may reduce to multiple conditionals).  

  6. **Iterated Dispositions**  
     - **Statement:** Must handle dispositions to gain/lose other dispositions (e.g., a chemical’s disposition to become corrosive when heated).  
     - **Motivation:** Common in biology/chemistry (e.g., stem cells’ potency to differentiate).  
     - **Type:** Explanatory demand.  
     - **Status:** **Non-negotiable** (Dispositionality requires modal depth beyond single-track).  

  7. **Dispositional Stimuli**  
     - **Statement:** Must allow stimuli themselves to be dispositional (e.g., UV light *disposed* to cause sunburn).  
     - **Motivation:** Causal chains often involve dispositional interactions.  
     - **Type:** Phenomenon to explain.  
     - **Status:** Preference (Monists embrace; Humeans resist irreducible dispositions).  

  8. **Probabilistic Dispositions**  
     - **Statement:** Must explain propensities (e.g., atom’s 50% chance of decay in time *t*).  
     - **Motivation:** Quantum mechanics and statistical mechanics.  
     - **Type:** Scientific consistency.  
     - **Status:** **Non-negotiable** (Excluding probabilistic cases misrepresents science).  

  9. **Modal Force**  
     - **Statement:** Must ground the *necessity* in dispositional ascriptions (e.g., "salt *must* dissolve in water").  
     - **Motivation:** Dispositions imply non-accidental connections.  
     - **Type:** Explanatory demand internal to project.  
     - **Status:** **Non-negotiablе** (Without modal force, dispositions reduce to regularities).  

  10. **Intrinsicness**  
      - **Statement:** Must allow dispositions to be intrinsic (e.g., mass’s inertial power).  
      - **Motivation:** Some dispositions (charge, mass) seem inherent, not relational.  
      - **Type:** Distinction to preserve.  
      - **Status:** Preference (Monists insist; contextualists/Humeans reject).  

  ---

  ### **Pressure-Valve Case Analysis**  
  **Case:** Valve disposed to open at pressure *P*, but housing stiffens with rising pressure, reducing aperture. Stimulus (pressure) triggers both disposition *and* its prevention mechanism.  

  - **Diagnosis:** This is a **hybrid of fink and mask**:  
    - *Finkish aspect:* Rising pressure *simultaneously* triggers the valve’s opening-disposition *and* a housing-stiffening process that *alters* the system.  
    - *Masking aspect:* The stiffening *prevents full manifestation* (opening) even if the disposition persists.  
  - **Key Requirement:** **Masking/Antidotes (Desideratum 3)**. It demands the theory discern whether the disposition *survives* despite non-manifestation.  
  - **Verdict:** The valve *retains* the disposition to open, but the stiffening *masks* its full manifestation. The stimulus *causally enables* both the disposition and its mask.  
  - **Cost of Failure:** If masking is misdiagnosed as finkish loss, the theory conflates extrinsic interference with intrinsic dispositional change. Desideratum 3 is doing appropriate work here.  

  ---

  ### **Joint Satisfiability Assessment**  
  - **Tension Pair:** **Intrinsicness (10)** + **Finkish Cases (2)**.  
    - *Problem:* Finks often involve extrinsic changes (e.g., disconnecting a wire). If dispositions must be intrinsic (10), extrinsic finks threaten their identity.  
    - *Resolution:* Theories may reject intrinsicness (making it negotiable) or argue finks alter intrinsic bases (straining for Humeans).  
  - **Overall Satisfiability:** All desiderata *can* be jointly met by **robust primitivism** or **essentialism** (treating dispositions as basic/essential properties with modal force). Monism struggles with masking (if *all* properties are dispositional, what "masks"?). Conditional analyses fail finks/mimicking. Humeanism fails modal force.  

  ---

  ### **Theory Scorecard**  

  | **Family of View**       | **Key Failure/Strain**                                  | **Excluded By**                     |  
  |--------------------------|---------------------------------------------------------|-------------------------------------|  
  | **Conditional Analyses** | Finkish/masking cases (Des. 2, 3)                       | Non-negotiable cases                |  
  | **Dispositional Monism** | Masking (if no categorical base) (Des. 3)               | Preservation of disposition survival |  
  | **Categoricalist/Humean**| Modal force (Des. 9); probabilistic dispositions (Des. 8)| Non-negotiable explananda           |  
  | **Essentialism**         | Iterated dispositions (Des. 6) if essence is static     | Explanatory demand                  |  
  | **Primitivism**          | Intrinsicness (Des. 10) if contextual triggers matter   | Negotiable preference               |  

  **Most Exclusionary Requirement:** **Modal Force (9)**. It excludes all anti-realist (Humean) and reductive (CA) accounts, demanding irreducible necessity.  

  ---  
  **Specification Complete.**
