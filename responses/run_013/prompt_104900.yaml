  - They'd rather bet on a precise 0.5 than a range containing 0.5.  
  - They reject dilation (widening of ranges) from irrelevant evidence.  
  - They see ranges as "indecision bookkeeping" yet pay extra for warranties on ambiguous risks.  
  - They dislike the "probability distribution over probabilities" view for the boot-sale coin.  
  - They acknowledge that when forced to act, they collapse the range to a point.  

  The key tension is between ranges representing genuine indeterminacy (for the boot-sale coin) versus mere indecision. Their urn preference suggests ranges track something objective, but their collapse-to-point view under pressure undermines that. I recall resources like Walley's imprecise probability, where credal sets model ambiguity aversion. That might fit—it explains the urn preference (avoiding ambiguity) and warranty behavior (paying to reduce uncertainty).  

  For dilation: standard imprecise models *do* allow dilation from irrelevant evidence, which the user hates. But maybe we can sidestep this by restricting dilation cases or adopting a more pragmatic approach. The user's rejection feels visceral, so accommodating it might require tweaking the theory.  

  On identical evidence leading to different ranges: this clashes with objective Bayesianism but fits subjective imprecise models. If evidence underdetermines the credal set, different rational agents could have different sets based on risk tolerance. That aligns with their warranty example—some might pay more for ambiguity aversion.  

  Putting it together:  
  - **Core principle**: Imprecise credences are credal sets representing unresolved ambiguity, not indecision.  
  - **Accommodates**:  
    - Mint coin: no ambiguity → precise 0.5.  
    - Boot-sale coin: maximal ambiguity → wide range.  
    - Urn preference: aversion to ambiguity in the uncounted urn.  
