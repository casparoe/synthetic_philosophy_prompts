prompt: |-
  For the past fourteen months I have chaired the allocations committee of a small charitable foundation, and I have gradually come to think that the way we make grants is not merely imprecise but confused. The procedure is uniform: for each proposal we write down a probability of success, a value conditional on success, and a cost, and we fund in descending order of value per dollar. Two months ago we had to choose between two proposals of nearly identical cost, and I argued for the second. The first was an intervention with good trial evidence whose effects we can measure within five years. The second was an attempt to change the long-run trajectory of a large and durable institution: its theory of change runs through decisions that will be made by people who are not yet born, and on reflection our estimate of its probability of success, and of its value if it succeeds, were not rough measurements of anything but numbers we produced because the form demanded a number. What I have come to believe is that the difficulty here is not our ignorance. The long-run consequences of everything we fund are so sensitive to downstream contingencies, and the relevant outcome space is so ill-defined, that it is doubtful whether a determinate expected value attaches to the second proposal at all, and doubtful in the same way, though less visibly, for the first.

  Please set out the most important implications of this for how the committee should actually operate. Rank them by how much they should change our practice rather than by how interesting they are, make the reasoning explicit at each step, and tell me which of them I should decline to act on. Four questions matter most to me. Does the argument give us any reason to prefer the proposal whose effects we can measure, or does it bear equally on every option we could fund and so fail to guide us at all? Does it tell against the rubric itself, or only against the confidence with which we fill it in? If we fall back on our best guesses while labelling them as guesses, are we being honest about the limits of our knowledge, or smuggling the discredited rubric back in through the side door? And what is the strongest case that the whole difficulty dissolves once the decision problem is specified carefully, so that our ordinary procedure was never in trouble? The committee is practical and unsentimental and will want to know what changes on Monday morning.
reasoning: |-
  Hmm, the user is describing a problem they've encountered as chair of a charitable foundation's allocations committee. They're realizing that their current grant evaluation system - which uses probability of success, value conditional on success, and cost to calculate value per dollar - is fundamentally flawed when dealing with complex interventions. The example they give of choosing between a measurable intervention versus one with long-term institutional impact illustrates how the form forces them to assign numbers to essentially unquantifiable factors.

  The user raises several important questions: whether measurable projects should be preferred, whether the rubric itself is flawed, whether labeling guesses helps, and whether careful problem specification could solve everything. They need practical changes by Monday for their committee.

  I need to structure a response that prioritizes actionable changes over philosophical insights. The core issue seems to be that expected value calculations are inappropriate for projects where outcomes are indeterminable or the outcome space is ill-defined. The committee is essentially pretending to quantify the unquantifiable.

  For practical changes, I'll suggest: stopping the practice of assigning numbers to unquantifiable elements, creating distinct evaluation tracks for different project types, introducing qualitative assessment frameworks, developing new decision rules that acknowledge uncertainty, and improving documentation practices. 

  The most important implication is that they must stop forcing quantification where it's meaningless. This will require the biggest change but addresses the root problem. The measurable vs. unmeasurable distinction matters - measurable projects can still use EV but with appropriate uncertainty disclosures. The rubric itself is flawed for certain categories of projects because it forces false precision. Labeling numbers as guesses doesn't solve the fundamental problem of applying a quantitative framework to qualitative realities. And no, careful specification doesn't dissolve the issue - it's inherent to complex systems with long time horizons.

  I'll emphasize that the committee must develop the discipline to say "we cannot quantify this" rather than inventing numbers to fit the form. This will be challenging but necessary for meaningful reform.
answer: |-
  Here are the most important implications for your committee's operations, ranked by required change magnitude (most disruptive first), with explicit reasoning and clear guidance on which to implement or decline. I address your four core questions directly within the framework.

  ### Ranked Implications (Highest Impact Change First)

  1.  **Stop Assigning Pseudo-Precise Numbers to Fundamentally Unquantifiable Proposals.**
      *   **Reasoning:** Your core insight is correct. Assigning specific probabilities and values to interventions whose success hinges on distant, unknowable contingencies (like future generations' decisions) is not "rough measurement" but fabrication. It creates a false sense of objectivity and comparability ("value per dollar") where none exists. This corrupts the decision process by making fundamentally different *types* of interventions look comparable on a single, flawed metric. The long-term institutional proposal is a prime example – its "expected value" is undefined.
      *   **Change Required:** Major. This requires abandoning the current mandatory uniform rubric for *all* proposals. The form cannot demand a number where a number is meaningless.
      *   **Action (Monday Morning):** Immediately create a distinct category for proposals with extremely long time horizons, complex causal chains involving future actors, or fundamentally ill-defined outcome spaces. For these, **prohibit** entering specific numbers for probability of success and value conditional on success on the standard form. Instead, require a robust qualitative theory of change narrative and explicit identification of key uncertainties. **Answer to Q4:** The difficulty *does not* dissolve with careful specification. The indeterminacy stems from the nature of the intervention and the world, not laziness. The rubric *is* the problem for this class of proposals. **Answer to Q2:** This tells decisively against the rubric *itself* when applied universally. **Answer to Q3:** Falling back on "best guesses" labelled as such is still smuggling in the discredited rubric – it pretends quantification is possible when it's not. It maintains the false framework.

  2.  **Develop Distinct Evaluation Frameworks for Different "Epistemic Classes" of Proposals.**
      *   **Reasoning:** Your two proposals exemplify different epistemic classes:
          *   **Class A (Measurable):** Shorter-term, measurable outcomes, established evidence base (like the first proposal). Expected Value (EV) *can* be estimated, albeit with acknowledged uncertainty and error bars.
          *   **Class B (Unquantifiable Long-Term/Complex):** Very long-term, high complexity, contingent on future unknowns, ill-defined outcome space (like the second proposal). EV is effectively undefined or so indeterminate as to be useless for precise comparison.
      *   **Change Required:** High. Requires designing and implementing new evaluation methodologies alongside the existing EV approach.
      *   **Action (Monday Morning):**
          *   **Formalize Proposal Classification:** Add a mandatory initial step where proposers *and* reviewers classify the proposal into predefined epistemic classes (starting minimally with Class A and Class B as above).
          *   **Class A:** Continue using the EV/value-per-dollar rubric, but **mandate explicit documentation of uncertainty ranges** for probability and value, and the basis for estimates (e.g., "P(success): 60-80%, based on RCTs X & Y replicating in similar contexts. Value: $Z million +/- 20%, based on measured outcomes A, B, C").
          *   **Class B:** Use a *qualitative* framework focused on:
              *   **Plausibility & Coherence:** Strength of the theory of change, logic model, actor analysis.
              *   **Importance of Target:** Significance of the institution/system it aims to influence.
              *   **Leverage Potential:** Does the grant unlock disproportionate change (catalytic effect)?
              *   **Option Value / Learning Potential:** Does it create valuable future options or generate crucial learning even if primary goals aren't fully met?
              *   **Robustness:** How well might it perform under various plausible futures (scenario analysis)?
              *   **Track Record (of Org/Approach):** Evidence of capability, even if not for *this exact* long-term outcome.
          *   **Develop Comparative Rules:** Establish clear rules for comparing proposals *within* Class B (e.g., ranking based on assessed importance, leverage, and plausibility) and rules for comparing *across* classes (e.g., "A Class B proposal requires a minimum threshold of plausibility/importance and may only be funded over a highly certain Class A proposal if its potential upside is deemed *transformatively* higher, accepting the irreducible uncertainty").
      *   **Answer to Q1:** Yes, the argument gives a *strong* reason to prefer the measurable proposal (Class A) *when comparing directly to an unquantifiable one (Class B)*, *unless* the Class B proposal demonstrates exceptional transformative potential/importance that justifies the irreducible uncertainty. The difficulty does *not* bear equally on every option – it fundamentally distinguishes them. **This is the key operational takeaway.**

  3.  **Explicitly Value Information Gain and Option Value.**
      *   **Reasoning:** Traditional EV struggles with interventions where the primary value might be learning *whether* something works or *how* to influence a complex system, or keeping future valuable options open. This is particularly crucial for Class B proposals. Funding them might be rational even if their "expected value" is indeterminate, because they reduce future uncertainty or create pathways for future high-value actions.
      *   **Change Required:** Moderate. Requires adding new criteria to the evaluation process.
      *   **Action (Monday Morning):** Add explicit criteria/questions to the review process for *all* proposals, but especially Class B:
          *   "What significant learning (success or failure) will this grant generate, regardless of its primary outcome?"
          *   "Does this grant create valuable future options or pathways that would not otherwise exist?"
          *   "How does this grant reduce critical uncertainties for future funding decisions (ours or others')?"
          *   Factor these assessments into the qualitative evaluation (Class B) and as additional considerations alongside EV (Class A).

  4.  **Implement Robust Uncertainty Disclosure & Scenario Planning for Class A.**
      *   **Reasoning:** While Class A proposals *can* support EV estimates, your insight about the sensitivity to downstream contingencies still applies, albeit less severely. The "known uncertainty" ranges are likely wider and more consequential than previously acknowledged. Scenario planning makes this concrete.
      *   **Change Required:** Moderate. Enhances existing practice rather than replacing it.
      *   **Action (Monday Morning):** For Class A proposals:
          *   **Mandate Uncertainty Ranges:** Require reviewers to provide *ranges* (low/median/high) for P(Success) and Value, not single points. Discuss sources of uncertainty.
          *   **Simple Scenario Analysis:** Require proposers/reviewers to briefly outline 2-3 plausible scenarios (e.g., best-case, worst-case, most-likely) and how the intervention might fare. How robust is the intervention?
          *   **Sensitivity Flag:** Add a flag indicating proposals where the EV calculation is particularly sensitive to assumptions or has wide uncertainty bands. These require extra scrutiny.

  5.  **Radically Improve Documentation of Deliberation & Rationale.**
      *   **Reasoning:** Moving beyond a single quantitative metric necessitates clearer articulation of the *reasons* for decisions, especially for Class B proposals and when choosing between classes. This ensures accountability and builds institutional knowledge about evaluating complex interventions.
      *   **Change Required:** Low-Moderate (procedural change).
      *   **Action (Monday Morning):** Revise decision documentation templates:
          *   **Record the Classification:** Document why a proposal was deemed Class A or Class B.
          *   **Capture Qualitative Rationale:** For Class B proposals, and for comparisons across classes, require a concise summary of the key qualitative factors driving the decision (e.g., "Funded despite high uncertainty due to exceptional leverage potential on Institution Y and strong organizational track record" or "Chose Class A proposal Z over Class B proposal W due to certainty of measurable impact vs. highly speculative theory of change for W").
          *   **Document Key Uncertainties & Debates:** Explicitly note the major uncertainties discussed and how they factored into the decision.

  **Summary of Actions for Monday Morning:**

  1.  **Halt false quantification.** Introduce "Class B" for unquantifiable proposals; ban P/V numbers for them.
  2.  **Classify rigorously.** Mandate initial epistemic classification (A/B) for every proposal.
  3.  **Dual-track evaluation:**
      *   **Class A:** Use EV/value-per-dollar, but require uncertainty ranges & scenario notes.
      *   **Class B:** Use qualitative framework (Plausibility, Importance, Leverage, Learning, Option Value, Robustness).
  4.  **Add universal criteria:** Explicitly evaluate Information Gain & Option Value for all proposals.
  5.  **Revise decision docs:** Record classification, qualitative rationale (especially for B/cross-class), and key uncertainties.

  **Answers to Your Four Questions Recap:**

  1.  **Preference for Measurable?** **YES.** The argument strongly supports preferring Class A (measurable) proposals *over* Class B (unquantifiable) proposals *unless* the Class B proposal demonstrates *exceptional* transformative potential/importance justifying its irreducible uncertainty. The difficulty distinguishes proposal types; it doesn't paralyze all choice.
  2.  **Against Rubric or Confidence?** **PRIMARILY AGAINST THE RUBRIC'S UNIVERSAL APPLICATION.** The rubric itself is fundamentally flawed and inappropriate for Class B proposals. Confidence is a secondary issue for Class A.
  3.  **Best Guesses + Labels?** **DECLINE THIS APPROACH FOR CLASS B.** Labelling guesses is insufficient; it perpetuates the false quantitative framework. For Class B, abandon quantification entirely and use the qualitative framework. For Class A, labelling guesses *as ranges/scenarios* is an improvement.
  4.  **Does Careful Specification Dissolve the Problem?** **NO.** The indeterminacy arises from the intrinsic nature of complex, long-term interventions in an uncertain world. No amount of careful specification within the EV framework can create a meaningful expected value for a Class B proposal. The flaw is in the framework's applicability, not the specification effort.

  **What to Decline:** Decline the idea that simply labelling your current probability and value estimates as "guesses" is sufficient or appropriate for proposals like the second one (now Class B). This change is cosmetic and maintains the flawed quantitative comparison structure. Replace it entirely with the qualitative framework for those proposals. The other implications require action. The committee must embrace the discomfort of qualitative judgment for the hardest, potentially highest-impact, but least knowable, opportunities.
