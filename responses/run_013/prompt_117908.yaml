answer: |-
  ## Panel Opinion on Medication Coverage Appeals

  I recommend that we adopt the following two-step test for evaluating requests for interventions, particularly pharmaceuticals, that exceed published plan guidelines regarding dosage or access for non-diagnosed conditions:

  1.  **Restoration vs. Elevation:** Determine whether the requested intervention primarily functions to restore the individual to, or maintain them at, a level of cognitive or physical functioning demonstrably within their own established personal trajectory prior to the onset of a diagnosed condition or a documented, significant decline. If the intervention demonstrably serves this restorative or maintenance function relative to the *individual's own history*, the request should generally be considered medically necessary for treating an existing health condition. If the evidence indicates the intervention aims to elevate the individual beyond any level of functioning they have previously sustained without comparable intervention (excluding temporary or context-specific peaks), proceed to step two.
  2.  **Source of Performance Standard:** Where step one indicates the goal is elevation beyond the individual's baseline, evaluate the standard against which the requested enhancement is measured. Is this standard grounded in a fundamental biological or developmental norm for the individual's age and sex (e.g., achieving age-appropriate milestones, managing basic activities of daily living)? Or is the standard demonstrably set by a competitive or demanding arrangement inherent to the university environment itself – such as the curve on qualifying exams, the expectations for promotion and tenure that implicitly require excessive hours, or job performance metrics calibrated to unsustainable effort? If the standard is primarily a product of such institutional arrangements, the request should be treated as a claim about the reasonableness of *that arrangement* and the support the institution provides, rather than as a claim of medical necessity requiring coverage under the health plan.

  We should apply this test immediately to the two appeals before us. For the staff member with the documented diagnosis of persistent inattention, we must assess whether the requested higher dose of medication demonstrably restores her to a level of attentional function she maintained prior to the onset or significant progression of her condition, or prevents a decline from that level. If her medical evidence supports this restorative purpose relative to *her own history*, the request should be approved. The comparison to colleagues is irrelevant under step one; the focus is solely on her trajectory. For the doctoral student without a diagnosis, step one is decisive: he seeks the medication explicitly to elevate his performance beyond his established baseline ("without it his performance is not the performance his work requires") for a specific, high-pressure institutional event (qualifying exams). There is no claim or evidence this is restoring him to a prior level of function he sustained without medication. Therefore, his request is fundamentally about meeting the demands of the exam structure, not treating a medical condition, and should be denied as not medically necessary.

  Recognizing that individuals may be mid-treatment under previous understandings, we should phase in this approach. Any member currently receiving medication above plan ceilings based on a prior approval must be reassessed under this two-step framework within the next 60 days. During this period, their current coverage will continue uninterrupted. Providers will be notified immediately of the new framework and asked to submit supporting documentation focused on the patient's personal functional trajectory relative to their diagnosed condition for any existing high-dose prescriptions. New requests exceeding guidelines will be evaluated solely under this test from the date of this decision.

  The strongest case against this proposal, as its proponents would argue, is that it improperly tasks a health benefits panel with diagnosing and adjudicating the structural pressures of the university itself – pressures that are complex, multifaceted, and often necessary for maintaining academic rigor and operational efficiency. They would contend that the panel lacks the expertise and mandate to determine whether qualifying exams are too demanding, promotion ladders too steep, or job expectations too high. This test, they argue, blurs the line between managing health benefits and managing institutional policy, inviting the panel into areas far beyond its competence and potentially opening the floodgates to claims framed as critiques of university structures disguised as medical needs. They would assert that the medical director's proposed population-based norm, while imperfect, provides a clearer, more objective, and administratively feasible boundary grounded in established medical practice, keeping the panel focused on its core purpose: covering treatments for recognized health conditions, not optimizing performance or critiquing institutional demands.

  I acknowledge this objection has significant force. It correctly identifies that my proposal relocates the problem from the murky distinction between treatment and enhancement to the equally challenging terrain of institutional self-scrutiny. However, I believe this relocation is necessary and ultimately more tractable for three reasons. First, it confronts the core issue these appeals reveal: our health plan is being asked to subsidize solutions to problems our own institutional structures may create or exacerbate. Pretending these pressures are irrelevant medicalizes social and competitive dynamics. Second, while assessing institutional pressures is complex, it is not beyond our capacity *in the context of specific claims*. We are not being asked to redesign the tenure system wholesale, but to ask, for a specific individual seeking a specific drug for a specific institutional hurdle: is the demand biologically inherent or institutionally constructed? Third, and crucially, identifying a request as stemming from institutional pressure doesn't mean ignoring the individual's struggle; it means directing the *response* appropriately. Denying coverage as not medically necessary under the plan is the correct health benefits decision, but it simultaneously signals that the underlying pressure point – the exam structure, the workload expectation – is a legitimate concern needing attention, albeit through channels like academic policy review, workload committees, or student support services, not the health plan. This test forces transparency about the source of the demand. While the population norm *seems* objective, it fails precisely where we need it most: when "normal" function isn't enough for *our* university's demands, or when an individual's restored baseline still falls short of those demands. Our test accepts the messy reality that health and performance are intertwined within our institutional context, but insists on distinguishing the biological from the competitive when deciding what the health plan should fund.

  Therefore, for the meeting next Tuesday, I propose we take the following actions: First, vote to adopt the two-step test outlined above as our framework for evaluating these and similar appeals. Second, apply the test immediately to the two current appeals, resulting in the approval of the staff member's request (pending confirmation under step one of restoration relative to *her* history) and the denial of the doctoral student's request. Third, approve the 60-day transition period with the notification and documentation requirements described. Fourth, direct the benefits office to draft communication to plan members and providers explaining the new framework, emphasizing the focus on individual functional trajectory relative to diagnosed conditions. This approach provides a principled, actionable resolution to these specific appeals while establishing a more honest and institutionally self-aware framework for the future.
