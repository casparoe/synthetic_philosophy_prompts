  Here, the truth of the belief appears to explain recovery in A, while its falsity seems irrelevant in B. 

  The pivot: In A, correspondence theorists say the belief's correspondence to facts explains recovery. Deflationists counter that only the doctor's evidence-based actions matter, and "truth" adds nothing. 

  Crucial feature: The treatment is non-specific (works for both conditions). This prevents attributing outcome to diagnostic accuracy. Remove this, and the case collapses - if antibiotics only treat bacterial, then falsity would explain treatment failure in B. 

  Deflationist reply: "The explanation reduces to: doctor believed bacterial based on symptoms → gave antibiotics → patient recovered. 'Truth' is redundant." This holds for both scenarios. 

  What the case doesn't show: That truth never explains anything. Correspondence theorists can still argue for explanatory roles elsewhere (e.g., stable beliefs in science). It just isolates one contested instance. 

