  The core confusion seems to be about how Sor Juana's personal defense morphs into a broader feminist argument. The user is rightly picking up on tensions between submission and defiance, individual versus systemic arguments. They're also alert to subtle moves like the "women teaching women" point and the kitchen metaphor—both of which aren't just decorative but structurally significant.

  For the submission vs defense question: The framing is absolutely strategic. When Sor Juana bookends her fiery arguments with obedience, she's using a common convent rhetorical tactic—establishing orthodoxy to create space for radical ideas. The "church as final arbiter" bit isn't weakness; it's armor. A 17th-century reader would recognize this as standard protocol for dangerous discourse.

  About the women-teaching-women point: This isn't redundant after the God-given-talent argument. It's a practical solution to the access problem she just described (being barred from university). Where the first establishes divine right, this offers ecclesially palatable implementation—very clever pastoral pragmatism.

  The kitchen bit? Definitely not just charming. It's a full epistemological challenge to Aristotelian hierarchies, elevating experiential knowledge. And it ties back to her "learning alone" lament—positioning autodidacticism as superior to institutional exclusion.

  On holy ignorance: She's wrestling with a real theological debate (quietism vs active intellect) but flips the script. By distinguishing willful stupidity from contemplative humility, she defends study as piety. A contemporary reader would hear echoes of Teresa of Ávila here.

  Nunhood is both shield and shackle. Obedience gives her cover ("I'll stop if ordered") but forces indirect arguments. Yet her status also legitimizes her voice—a laywoman couldn't have written this.

  As for modern lenses: The user should watch for projecting collective feminism. Sor Juana argues from exceptionalism ("God gave me this burden") not equality. Her frustration is about wasted God-given potential, not systemic justice. That distinction matters.

