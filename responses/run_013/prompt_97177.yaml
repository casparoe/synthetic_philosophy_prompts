  ### Key Design Notes:
  1. **Fat-Handed Focus**: The question forces engagement with supervenience by requiring discussion of interventions that "wiggle" simmballs without changing simms (impossible) and how to handle this in practice (covariance across micro-states).

  2. **Proportionality Distinction**: Students must distinguish between the simmball *being a cause* (possible via the detector) and being a *proportional/difference-making cause* (arguable due to granularity matching in the rearrangement).

  3. **Indeterminism Leverage**: Micro-indeterminism blocks exclusion arguments by making micro-states insufficient for rearrangement predictions.

  4. **Model-Relativity Demand**: The final prompt explicitly requires evaluating whether causation is "in the world" or "in the model," preventing stance-based retreats.

  The model answer demonstrates handling fat-handedness through practical interventions, uses proportionality to justify macro-causation, and balances factual/physical elements with model-relativity—pushing beyond canned responses. The marking scheme prioritizes reasoning over labels, with 60% of marks tied to core interventionist application.
