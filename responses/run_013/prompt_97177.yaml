       "typical_error": "Ignores the fat-handed intervention problem or does not connect it to the supervenience relation."
     },
     {
       "move": "Distinguishes between being a cause and being a proportional/difference-making cause, and applies this to the simmball.",
       "marks": 5,
       "typical_error": "Does not address proportionality or confuses being a cause with being the only cause."
     }
   ]

   However, note that we have 5 moves each worth 5 marks, totaling 25. But we might want to break down differently, or have some moves overlapping. Alternatively, we can have fewer moves with higher marks. But the problem says at least one must-hit for fat-handed and one for proportionality. We have included both.

   Distinction Note (distinction_note): 
     "Answers that earn an A (distinction) not only cover all the required moves but also integrate them into a coherent argument, showing how the interventionist account illuminates the metaphysics of causation in layered systems, and go beyond the surface to critically evaluate the model-relativity of causation."

