       "marks": 5,
       "typical_error": "Falls back on exclusion argument without addressing the indeterminism or the new causal path via the fan."
     },
     {
       "move": "Addresses part (c) by discussing reducibility and the role of the detector, and whether the pattern is genuinely causal or just read off.",
       "marks": 5,
