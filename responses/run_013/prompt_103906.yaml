prompt: |-
  You're a philosopher-economist — someone fluent both in formal models of social dynamics (adoption curves, tipping points, coordination and signaling games, payoff matrices, preference endogeneity) and in the history of moral philosophy — so take your time, and start by brainstorming what the three candidate drivers of a moral revolution actually are before you write anything down.

  Background: I work on norm and behavior change and I think in econ. The story I keep hearing about how slavery, dueling, footbinding and the like ended is that argument didn't do it: either material interests shifted, or an honor code turned against the practice, or arguments did the real work. Restate that three-way debate in my vocabulary as faithfully as you can — what do argument, interest, and honor each become once you write them as agents with payoffs, beliefs, information, and network position? Do any of the three quietly collapse into the others in translation (is "argument" just information that updates beliefs about payoffs?), or do they stay genuinely distinct?

  Then the residue report, which is the part I actually care about. What does my vocabulary fail to carry? My suspicion is that honor is the problem case: a point of honor is supposed to bind you against your own interests, and it seems to be about what others can believe about you rather than what they'll do to you — but maybe thats just reputation in a signaling model with extra steps, tell me. Related: after these revolutions basically everyone claims they were always on the right side, which looks odd for a model where a lot of people genuinely changed what they did — is that even stateable in my terms? For each piece of residue, say whether its a defect of my vocabulary or a sign that the philosophers are dressing up a payoff shift in fancy language. And where is your reasoning on that last question most likely to fail — what would change your mind? If some particular consideration (who actually switched first, or a case where interests and honor came apart) would flip your verdict, name it.
