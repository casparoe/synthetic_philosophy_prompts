  But the interesting part is the residue - what gets lost? Honor does pose challenges. When someone acts against self-interest for honor, economic models can capture it as reputation management, but philosophers would argue something deeper is lost - the intrinsic value of integrity. That gap between instrumental and intrinsic motivation is real.

  Also the "everyone claims they were always right" phenomenon is fascinating. Game theory can model this as preference falsification or Bayesian updating, but it struggles with the bad faith aspect - people actively rewriting history rather than just updating beliefs.

  My analysis could fail if we examine who actually changed first. If moral pioneers were those with little to lose reputationally (like marginalized groups), that supports the signaling model. But if respected elites led the change at great personal cost, that suggests honor might be irreducible to reputation. Cases like Wilberforce sacrificing political capital against slavery would test this.

