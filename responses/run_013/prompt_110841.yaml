prompt: |-
  I am trying to determine what I actually believe about honoring sunk costs, and I would like the principle—or the smallest set of principles—that reproduces my verdicts. My verdicts, case by case, are these.

  1. You have placed a non-refundable deposit on a week's rental, and a friend then offers you a better week elsewhere. I think you should take the better week and write off the deposit; traveling to the rental in order not to waste the deposit is a mistake.

  2. At mile twenty of a marathon your knee is injured, and stopping would cost you nothing but the finisher's medal you wanted. You finish because you have come this far. I think this is defensible, and not only because finishing feels good afterwards: the endurance is part of the achievement, so the miles are not merely spent, they are partly the point.

  3. A founder keeps funding a venture that she and everyone else now believe will fail, citing the money and years already committed. I think this is plainly irrational.

  4. Wanting to attend a talk you would otherwise skip, you deliberately buy a non-refundable, non-transferable ticket for it, and it works: you go and are glad. I think both the purchase and the going are rational, even though the only thing that moves you is a cost you cannot recover.

  5. A family keeps a failing farm running because the family has worked that land for generations. This feels unlike the startup to me, but I cannot tell whether the generations are a reason or merely a sentiment dressed as one.

  6. Two hundred pages into a novel you are not enjoying, you finish it because you have read two hundred pages. I think this is irrational, and closer to the startup than to the marathon, even though all three run through the thought that you have come this far.

  7. You keep at a proof because the weeks already spent, and the fact that you are still gripped by it, strike you as evidence that the problem is worth solving. I cannot decide whether this is a good reason or a rationalization.

  My tentative principle is that a sunk cost is a reason only when it is either evidence about the future or a device that binds your later self to your earlier one, but I suspect it fails on the marathon. Please state the principle precisely, name the case that forces each clause, tell me what it predicts for at least two cases I have not listed, and say plainly which of my seven verdicts it cannot accommodate and whether I should give that verdict up. Open with the principle in no more than two sentences, and keep the whole answer under 600 words.
reasoning: |-
  Hmm, the user is trying to develop a principle for sunk costs that explains their judgments across different scenarios. They've provided seven cases with their verdicts on whether honoring sunk costs is rational or not.

  Looking at their examples:
  - Case 1: They think writing off a non-refundable deposit for a better vacation is rational.
  - Case 2: They see finishing a marathon despite injury as defensible.
  - Case 3: They view continued funding of a failing startup as irrational.
  - Case 4: They find buying a non-refundable ticket to motivate attendance rational.
  - Case 5: They're unsure about keeping a failing family farm for generational reasons.
  - Case 6: They consider finishing an unenjoyable book just because you've read most of it irrational.
  - Case 7: They're undecided about continuing a proof based on time already invested.

  The user's tentative principle about sunk costs being evidence or a commitment device is interesting but seems insufficient, especially for the marathon case where endurance itself is part of the achievement.

  I think the key distinction is between sunk costs that become integral to the goal itself versus those that are merely past expenditures. In the marathon, the miles run aren't just costs - they're constitutive of the achievement. Whereas in the startup or book cases, the money or time spent doesn't change the nature of the future outcome.

  I'll propose this principle: Honor sunk costs only when the expenditure has become constitutive of the goal itself, meaning the act of persisting has intrinsic value beyond completion. Otherwise, treat sunk costs as irrelevant to future decisions.

  This explains:
  - Why the marathon (Case 2) is defensible - enduring is the achievement
  - Why the ticket purchase (Case 4) works - the commitment creates value
  - Why the deposit (Case 1) shouldn't matter - it doesn't change the vacation experience
  - Why the startup (Case 3) and book (Case 6) are irrational - past costs don't transform future outcomes

  For Case 5 (family farm), the principle would say honoring generational commitment could be rational if maintaining heritage is intrinsically valuable, not just because of sentiment. For Case 7 (proof), persistence is rational only if past effort provides genuine evidence of solvability.

  The principle accommodates all cases except perhaps Case 7's ambiguity, which is intentional since the user was undecided. I'll also provide two new cases to test the principle: continuing a diet because you've suffered through weeks (irrational) versus training for an Ironman where the struggle is the point (rational). The book case (6) might need reevaluation if completion itself holds value, but the user should probably maintain their verdict since they see it as irrational.
answer: |-
  Here is the principle: Honor sunk costs only if either (1) they provide reliable evidence about future outcomes, or (2) the expenditure has become constitutive of the goal itself, meaning the act of persisting *is* the achievement or has intrinsic value beyond completion. Otherwise, sunk costs are irrelevant to future decisions.

  **Cases forcing each clause:**
  *   Clause (1) (Evidence): Case 7 (Proof) – Past effort *might* signal solvability.
  *   Clause (2) (Constitutive): Case 2 (Marathon) – Enduring *is* the point; Case 4 (Ticket) – The sunk cost creates commitment, making attendance the valued act.

  **Predictions for new cases:**
  1.  **Continuing a painful diet solely because "I've suffered this long":** Irrational (Clause 2 fails; suffering isn't the goal).
  2.  **Finishing military boot camp despite misery because "earning the title" requires enduring all of it:** Defensible (Clause 2 applies; enduring defines the achievement).

  **Accommodation of your verdicts:**
  *   **Fully Accommodated:** Cases 1 (No evidence/constitutive), 2 (Constitutive), 3 (No evidence/constitutive), 4 (Constitutive via commitment device), 6 (No evidence/constitutive value).
  *   **Accommodated with Nuance:** Case 5 (Farm): Rational *only if* the act of continuing the lineage on the land is intrinsically valuable (Constitutive), not just because of past costs. Your uncertainty aligns with this test.
  *   **Accommodated:** Case 7 (Proof): Rational *if* sunk effort is genuine evidence of solvability (Clause 1), irrational if it's mere rationalization. Your indecision reflects this distinction.

  **Verdict to reconsider:** Case 6 (Book). The principle deems finishing irrational as sunk pages aren't evidence and completion isn't intrinsically valuable like the marathon. You *could* reconsider if "finishing books" itself holds constitutive value for you, but your verdict aligns with the principle and likely should stand. Your intuition distinguishes between constitutive acts (marathon) and mere completion (book, startup). Stick with it.
