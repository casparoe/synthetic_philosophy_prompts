prompt: |-
  I run the weekly incident-review meeting at a mid-size software company -- postmortems, blameless culture, the whole thing -- and I've got an hour with the team next week where I want to actually teach them causation by omission, because right now they write sentences like 'the outage was caused by the on-call engineer not escalating' and 'we lost the data because nobody rotated the key,' and then two lines later they're arguing about who's at fault, and it's obvious they think 'X caused it' and 'X is to blame' are the same claim. I dont want you to explain omission-causation to me; I want a plan for how I explain it to them. What order do the ideas have to come in -- I'm pretty sure counterfactual dependence has to land before anything about norms or duties, but push back if that's wrong -- what single case should carry the whole session (and why not the classic pond-and-child / trolley stuff, which I suspect they'll pattern-match to and then stop thinking), and where exactly in that sequence I should head off the misconceptions I expect: my guess is the big one is 'if nothing happened then nothing caused anything,' with a second being that any omission that made a difference is automatically a cause, and a third that 'cause' just means 'the thing we'd blame.' For each, tell me the point in the arc where it has to be dealt with and why there rather than earlier or later. Also: what should I deliberately not get into with this crowd, and how do I say that I'm skipping it so it doesn't read as me not knowing?

  One thing that might help you aim it: a colleague framed the whole area for me as three separate questions that people constantly fuse -- (1) did the not-doing make a difference, (2) was there a norm that required the doing, and (3) was the not-doing even an action of the agent's or just something that happened to them -- and I want the session built so those three land as genuinely independent, because I think alot of their muddle is just running them together. Use that if it's useful, drop it if it's wrong.

  Finish with one question I can ask in the last five minutes that would actually tell me whether the distinction landed or whether they just nodded along, and keep the whole plan under 550 words.
reasoning: |-
  Okay, let me unpack this request. The user runs incident reviews and wants to teach their team about causation by omission to prevent blame-masking-as-analysis. They're frustrated with statements like "outage was caused by the on-call not escalating" that inevitably devolve into finger-pointing.

  Hmm... the core insight they're after is disentangling three fused concepts: counterfactual difference-making, normative expectations, and agency. That's smart - those exact conflations are why "nobody rotated the key" slides into blame so easily. 

  For the session structure, I agree counterfactuals must come first since it's the factual bedrock. Starting with a non-work example is wise to bypass defensiveness, but classic trolley problems would make them check out. A gardening scenario where neglected watering causes plant death feels neutral yet relatable. 

  Key timing points: 
  - Difference-making misconception ("if nothing happened...") must be shattered during counterfactual explanation using the plant case. Show concrete absence causing harm. 
  - "Any difference-maker is a cause" overreach gets addressed when contrasting factual causes with significant causes. Use the "guard didn't yell" example to show why we filter causes. 
  - The blame/cause confusion gets its own dedicated segment after agency/norms discussion - that's when they'll finally see the separation.

  Crucially, I won't touch moral philosophy or legal liability - explicitly state this is about incident analysis precision. The closing question "Why might we not list Alice's snack break?" forces them to apply all three filters: difference-making (did it matter?), norms (should she?), agency (was it work-related?).

  Notable constraints handled: 
  - 550 words? Outline fits in 500. 
  - Three questions disentangled? Explicitly segmented. 
  - One anchoring case? Gardening carries entire load. 
  - No trolley problems? Check. 
  - Blame separation? Final module focuses on it.

  This should give them the conceptual toolkit without triggering defensiveness. The test question will reveal if they internalize that "could blame" ≠ "did cause".
answer: |-
  Here’s a focused 50-minute teaching plan (550 words):

  ---

  ### **1. Groundwork: Counterfactual Dependence First (15 min)**  
  **Start with a neutral, non-work example** (avoids defensiveness):  
  *"Imagine a neighbor agrees to water your plant while you’re away. They forget. The plant dies."*  
  **Ask:** *"Did the neighbor’s omission change the outcome?"* → Establish **difference-making**.  
  **Key point:** Omissions *can* cause outcomes by failing to prevent them. **Shatter "if nothing happened..." here:** Use the example to show the plant lived *only if* watering happened. Absence *was* the change.  

  ---

  ### **2. "But Was It REALLY a Cause?" – Filtering Noise (10 min)**  
  **Introduce over-inclusion risk:**  
  *"What if, that same day, a passing bird didn’t knock over the pot? Does that omission *also* cause the death?"*  
  **Explain:** Many omissions are difference-makers; we focus on **significant/proximate** ones. **Address "any omission = cause" here:** Contrast the bird (irrelevant norm) vs. neighbor (clear expectation). Significance depends on context, not just difference-making.  

  ---

  ### **3. Separating Cause, Norm, & Agency (20 min)**  
  **Use your colleague’s 3 questions explicitly:**  
  1.  **Difference-making?** (Did *not*-doing X change the outcome?) → *Factual*.  
  2.  **Norm?** (Was there an expectation/reason to do X?) → *Prescriptive*.  
  3.  **Agency?** (Could the agent reasonably have done X?) → *Capability*.  

  **Apply to incident examples:**  
  *"The outage was caused by the on-call not escalating."*  
  - **Difference-making?** *Maybe* – if escalation would’ve fixed it faster.  
  - **Norm?** *Maybe* – if SOPs say they should.  
  - **Agency?** *Maybe* – if they weren’t overwhelmed/confused.  

  **Stress:** These are **separate investigations**. Cause (Q1) is necessary but *never sufficient* for blame (Q2+Q3). **Kill "cause = blame" here:** Show how Q1 can be "yes" while Q2/Q3 are "no" (e.g., on-call had no training → agency lacking).  

  ---

  ### **What to Skip & Why**  
  *"We’re avoiding moral philosophy (trolley problems) and legal liability. Why? Our goal is precise incident analysis, not ethics debates. This is about *understanding* causation, not assigning punishment."*  

  ---

  ### **Closing Check (5 min)**  
  **Ask:**  
  *"In an incident, if we prove Alice’s omission *did* make a difference (Q1), but she had no duty to act (Q2) or couldn’t reasonably have acted (Q3), should we label her omission as *the cause* in the postmortem? Why/why not?"*  

  **Why this works:**  
  - Tests if they distinguish factual cause (Q1) from blame (Q2/Q3).  
  - Reveals if they grasp "cause" as a technical term ≠ culpability.  
  - Forces application to postmortem language.  

  ---

  ### **Why This Order Works**  
  1.  **Counterfactuals first** establishes an objective foundation (prevents norms/agency from distorting cause).  
  2.  **Filtering** stops over-attribution *before* introducing norms/agency.  
  3.  **Explicit 3-question split** isolates fused concepts at the point of maximal confusion (incident examples).  
  4.  **Blame/cause decoupling last** leverages prior steps to show why "cause" ≠ "fault."  

  **Anchor case** works because it’s relatable, non-threatening, and mirrors incident structure (expected action missing → bad outcome). Avoids trolley problem overcomplication.  

  **Outcome:** They stop writing "caused by not doing X" without first asking: *Did it matter? Should they have? Could they have?*
