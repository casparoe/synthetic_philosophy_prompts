prompt: |-
  I'm a postdoc with a foot in two camps, a theory group and a philosophy department, and next month I'm giving a joint seminar talk defending a claim that I expect to irritate both: that when philosophers of mind and epistemologists appeal to computational intractability in order to argue that Bayesian updating or expected-utility maximization cannot be a norm for finite agents, they are usually appealing to the wrong kind of hardness result, and that once one separates what I have been calling representation-hardness from instance-hardness, a narrower and more defensible thesis survives. The narrower thesis is that for the inference problems at issue, the difficulty is not an artifact of the algorithm, the encoding, or the machine model but is a feature of the problem itself, and that ideal rationality should therefore be defined relative to a resource class rather than as an unconstrained limit, with different resource classes yielding genuinely different normative theories rather than the same theory plus a footnote about running time. The argument has three moves. First, a taxonomy: a problem can be hard in the instance sense (this input defeats every algorithm we have), in the representation sense (hard under one encoding, easy under another), or in the class sense (complete for a class that no physically realizable device escapes). Second, a claim that the class-sense hardness of these inference problems is stable under the reductions and encodings anyone would accept as faithful, so that the second category collapses into the third for our purposes. Third, the normative conclusion: a theory that specifies what an agent ought to believe or do while remaining silent about resources is not an idealization but a category error, since its prescriptions are undefined for every agent that could exist.

  The audience is about a dozen people. Six or seven are complexity theorists whose own work is on circuit lower bounds, derandomization, and average-case complexity; they are not hostile to philosophy but they have little patience for it, and their default suspicion is that anyone who says intractable in a philosophical register has confused no known algorithm with no algorithm, has ignored the gap between worst case and average case, or has smuggled in a claim about uniform machines that a non-uniform or interactive model would undercut. Two are philosophers of science who work on idealization and on what makes a model explanatory; they will care about whether my thesis is descriptive or normative and about whether a resource-indexed rationality is still recognizably a theory of rationality rather than a description of engineering practice. One is a statistician who will want to know why practical inference is not, in fact, intractable, given that people solve large instances of these problems every day with satisfiability solvers and sampling methods. I have forty-five minutes and then thirty minutes of questions, and a referee at a journal has already described the thesis as either trivially true or plainly false, so I know the triviality charge is coming.

  Write my question-period prep sheet: the eight or so objections I will actually get from this room, not the ones I would get from a philosophy-of-computing reading group, ordered by how likely each is combined with how much damage it does if I fumble it, each phrased the way the person who raises it would phrase it, with a two-minute reply for each, a note on what I should concede up front, and a note on where the reply is weakest. Flag which objections are really the same objection in different clothing. I do not need references or citations, just the arguments. And tell me the one question I am hoping nobody asks.
reasoning: |-
  Okay, let me tackle this postdoc's request. They're preparing for a joint seminar with both complexity theorists and philosophers, defending a niche thesis about computational intractability in normative theories. The challenge is anticipating objections that could derail their argument. 

  First, I need to map the audience dynamics. The complexity theorists will pounce on technical sloppiness—they'll care deeply about misused hardness concepts or overlooked computational nuances. The philosophers will attack normative implications, like whether resource-bounded rationality still counts as "rationality." The statistician will demand reconciliation with real-world tractability via heuristics.

  The referee's "trivially true/plainly false" comment signals two traps: either the thesis is uncontroversial (since everyone agrees problems are hard) or absurd (since agents clearly solve them). I must steer replies between these poles.

  For objection prioritization: 
  - Top threat is the complexity theorists' "worst-case vs. real-world" critique. If they convince the room that hardness results don't apply to actual inference, the thesis collapses. 
  - Next is the statistician's "but SAT solvers work!"—it directly challenges the relevance of class-hardness. 
  - Philosophers' "normative collapse" objection risks making resource-bounded norms seem like mere engineering, not rationality. 

  I notice two hidden duplications: 
  1. The "heuristics solve it" and "worst-case ≠ average-case" objections both attack the practical relevance of class-hardness but from different angles. 
  2. The "triviality" charge overlaps with "you've just reinvented bounded rationality," questioning novelty.

  The reply weaknesses are consistent: conceding that heuristics work but arguing they're approximate (risks sounding evasive), and defending "rationality" redefinition without diluting normativity (philosophers may remain skeptical).

  The nightmare question—"Why isn't this just computational epistemology?"—would force admitting the thesis is a reframing, not a revolution. Best avoided by emphasizing the synthesis of complexity/philosophy insights.
answer: |-
  Here’s your question-period prep sheet, ordered by combined likelihood and potential damage. I’ve grouped identical objections, flagged concessions, and noted reply weaknesses. The nightmare question is at the end.

  ---

  ### **1. Objection (Complexity Theorist):**  
  *"You’re conflating worst-case hardness with average-case or heuristic tractability. Real agents face structured inputs, not worst-case adversaries. SAT solvers handle huge instances daily—why should class-hardness matter?"*  
  **Why it’s damaging:** Undermines the *relevance* of class-hardness to real agents.  
  **Reply (2 min):**  
  - Concede: Average-case/structured inputs *are* often tractable.  
  - Core: Hardness results expose *fundamental constraints*—they show no algorithm solves *all* instances efficiently, even if many are easy. Norms must cover adversarial cases (e.g., self-improving AI, security-critical beliefs). Resource classes define where norms *break*, not just where they hold.  
  **Weakness:** Risks sounding like "worst-case matters more"—needs examples (e.g., cryptographic tasks) where average-case isn’t separable.  

  ### **2. Objection (Statistician):**  
  *"If these problems are class-hard, why do MCMC/sampling methods work so well in practice? Your ‘feature of the problem’ claim ignores that we sidestep hardness via approximation."*  
  **Why damaging:** Suggests your thesis ignores real-world success.  
  **Reply (2 min):**  
  - Concede: Approximations *are* effective workarounds.  
  - Core: Approximations *are* resource-bounded algorithms! They don’t refute class-hardness—they *rely* on it to justify shortcuts. My thesis *demotes* unconstrained norms: if ideal rationality requires exact Bayes, but exact Bayes is class-hard, then only resource-relative norms are coherent.  
  **Weakness:** Could imply your view is compatible with status quo (reply must stress "narrower thesis" redefines idealization).  

  ### **3. Objection (Complexity Theorist):**  
  *"Non-uniform models (e.g., circuits) or interactive protocols can solve problems uniform TMs can’t. Why assume the ‘physically realizable’ class is uniform polynomial time?"*  
  **Why damaging:** Challenges your "stable under faithful encodings" claim.  
  **Reply (2 min):**  
  - Concede: Non-uniform models *do* change hardness landscapes.  
  - Core: For *inference problems* (e.g., Bayesian updating), input representations (e.g., priors, utilities) are inherently uniform—they’re not circuit-encodable without losing generality. Philosophers assume agents manipulate *beliefs*, not fixed circuits. Faithful reductions preserve this.  
  **Weakness:** Hand-wavy on why non-uniformity isn’t "faithful." Needs example (e.g., circuit for *all* possible beliefs is infeasible).  

  ### **4. Objection (Philosopher of Science):**  
  *"If rationality is resource-relative, isn’t this just descriptive psychology? How can a ‘norm’ vary with computational power?"*  
  **Why damaging:** Questions whether your view is normative at all.  
  **Reply (2 min):**  
  - Concede: Unconstrained norms *seem* more "ideal."  
  - Core: Norms govern *agents in their circumstances*. Just as we don’t blame humans for not calculating pi in base-3, we shouldn’t blame them for class-hard inferences. Resource classes define *feasible obligations*—failing a class-hard task isn’t irrational, but violating a feasible norm is.  
  **Weakness:** May not satisfy those who see rationality as *transcending* resources.  

  ### **5. Objection (Complexity Theorist):**  
  *"This is trivial. Everyone knows P≠NP implies we can’t solve NP-hard problems. Why dress this up as philosophy?"*  
  **Why damaging:** Dismisses the entire project.  
  **Reply (2 min):**  
  - Concede: The *hardness* itself isn’t news.  
  - Core: Philosophers *misdiagnose* the issue—they blame encoding or algorithms, not the problem. My taxonomy shows class-hardness is inescapable, forcing a *normative* shift: resource-relativity isn’t an addendum but the core. That’s the novelty.  
  **Weakness:** If audience thinks philosophers *already* grasp class-hardness, reply fails.  

  ### **6. Objection (Philosopher of Science):**  
  *"Aren’t you just reinventing bounded rationality? What’s new here?"*  
  **Identical to #5 in substance** (triviality charge).  
  **Reply (2 min):**  
  - Core: Bounded rationality *describes* compromises; my thesis *prescribes* distinct norms per resource class (e.g., polynomial-time agents *should* use sampling, not exact Bayes). It’s not "bounded ideal theory" but *multiple ideal theories*.  
  **Weakness:** Requires convincing them that resource classes yield *genuinely different norms* (e.g., sampling vs. exact is not just "approximation").  

  ### **7. Objection (Complexity Theorist/Philosopher Hybrid):**  
  *"Instance-hardness *is* the problem—agents face specific instances, not classes. Why privilege class-hardness?"*  
  **Why damaging:** Attacks the taxonomy’s relevance.  
  **Reply (2 min):**  
  - Concede: Instance-hardness matters for *individual* failures.  
  - Core: Class-hardness explains *systemic* limitations: no device can efficiently handle *all* instances. Norms must be general—they can’t say "be rational, except on inputs that stump you."  
  **Weakness:** May not resolve why class-hardness (vs. instance) is normatively decisive.  

  ### **8. Objection (Statistician/Philosopher):**  
  *"Your view implies ‘ideal rationality’ is empty—there’s no gold standard. Doesn’t this collapse normativity into pragmatics?"*  
  **Why damaging:** Accuses you of abandoning normativity.  
  **Reply (2 min):**  
  - Core: The "gold standard" is *contextual*: for resource class C, ideal-C agents satisfy C-feasible norms. This is still normative—it forbids wasting resources or using sub-C algorithms. Unconstrained norms are the *true* empty set.  
  **Weakness:** Feels like relabeling "efficiency" as "rationality."  

  ---

  ### **The Nightmare Question (You Hope Nobody Asks):**  
  *"Isn’t your ‘narrower thesis’ just computational epistemology repackaged? Marr’s levels, Frixione’s tractability constraints, or even classic work by Cherniak—why isn’t this already the consensus?"*  
  **Why it’s deadly:** Exposes your core as derivative. Forces you to defend novelty against experts who know the literature.  
  **Why you’d fumble:**  
  - Few philosophers *endorse* resource-relative *ideal* norms—they treat tractability as a practical barrier, not a normative fracture.  
  - Complexity theorists won’t care about philosophical nuances.  
  **Salvage:** Stress your *taxonomy* (instance/representation/class) and *normative collapse* claim ("same theory plus a footnote"). But if pressed, concede synthesis while insisting the *joint conclusion* is unexplored.  

  ---

  ### **Summary Strategy:**  
  - **Pre-empt triviality:** Open with "This isn’t about whether problems are hard—it’s about *why* and what it implies for norms."  
  - **Concede eagerly:** Acknowledge heuristic success, average-case tractability, and non-uniform models upfront to build credibility.  
  - **Pivot to norms:** Frame replies around "This forces us to redefine idealization" to avoid getting bogged down in CS minutiae.  
  - **Unify objections:** Group "triviality," "bounded rationality," and "why hardness matters" as one cluster rehashing relevance.  

  Good luck—this is a minefield, but your framing is razor-sharp. If the statistician doesn’t invoke SAT solvers, I’ll eat my hat.
