  The user's deeper need seems to be reconciling empirical design approaches with normative questions about societal compliance. They suspect their metrics can't address legitimacy. The residue points to this: street design lacks terms for legitimacy or moral obligations, focusing instead on measurable outcomes. The Friesland backlash indicates that what's measurable (like speed reduction) might miss equity concerns. 

