answer: |-
  Here’s a systematic translation of the tight/loose framework into your vocabulary, followed by a residue analysis and specific answers to your queries.

  ### Translation into Street Design Vocabulary  
  **Descriptive Claim (How Societies Differ):**  
  - **Tight Societies:** Require high **compliance rates** with explicit **posted rules**, enforced via low **enforcement thresholds** (e.g., automated cameras, frequent policing). They feature high **signage density**, physical **kerbs** segregating users, and rigid **desire line** suppression. **Risk compensation** is minimized by eliminating ambiguity; users rely on external controls.  
  - **Loose Societies:** Tolerate lower compliance rates with higher enforcement thresholds. **Signage density** is minimal; **shared surfaces** replace kerbs. **Desire lines** are accommodated, relying on **risk compensation** (users self-regulate via perceived danger). Rules are often **merely posted** rather than enforced, trusting user negotiation.  

  **Normative Dispute (Legitimate Compliance Demand):**  
  - **Tight Argument:** High compliance rates prevent systemic risk (e.g., pedestrian fatalities). Legitimacy comes from optimizing **deterrence** and minimizing harm through unambiguous controls.  
  - **Loose Argument:** Over-reliance on **posted rules** erodes natural vigilance. Legitimacy requires balancing compliance with **self-explaining roads** that harness **risk compensation** (e.g., narrowed lanes reduce speeds without signage).  

  ### Residue Report  
  | **Original Element**          | **Survives Intact**                     | **Distorted in Translation**                 | **No Counterpart**                         |  
  |-------------------------------|------------------------------------------|---------------------------------------------|--------------------------------------------|  
  | **Norms/Deviance Tolerance**  | → Compliance rates, enforcement thresholds | "Norms" become "posted rules"; ignores unwritten social contracts | *Societal values driving rule creation* |  
  | **Threat-Induced Tightness**  | —                                        | —                                           | *Historical/cultural threats* (war, famine) |  
  | **Freedom/Innovation Cost**   | → Trade-off: high signage density vs. desire line flexibility | "Innovation" distorted as "user adaptability" | *Societal creativity/individual autonomy* |  
  | **Disorder Cost**             | → Measurable risk (e.g., collision stats) | Ignores non-physical "disorder" (e.g., norm erosion) | *Social trust/cohesion metrics* |  
  | **Internalization of Norms**  | —                                        | Partially mapped to **self-explaining roads** | *Deep cultural internalization* |  

  ### Residue Analysis: Defects or Vagueness?  
  1. **Threat-Induced Tightness (No Counterpart):**  
     - *Vagueness in Original:* "Threat" is underspecified (is heterogeneity a threat like famine?).  
     - *Defect in Your Trade:* Streets are designed for present conditions, not historical trauma.  

  2. **Internalization of Norms (Distorted/No Counterpart):**  
     - *Distortion:* Your field equates "internalization" with **self-explaining roads** (physical design prompting caution). But this is behavioral, not moral.  
     - *Defect:* No metric for *why* users comply (fear of fines vs. social duty).  

  3. **Freedom/Disorder Costs (Partial Distortion):**  
     - *Vagueness:* "Freedom" is ill-defined in original (freedom from rules? from harm?).  
     - *Defect:* Your trade measures disorder as *immediate risk*, not long-term social fragmentation.  

  ---  

  ### Pressing Your Queries  
  **1. Is Tightness One Thing?**  
  Your vocabulary **splits enforcement from internalization**:  
  - **Enforcement Side:** Quantified via **compliance rates** and **enforcement thresholds**.  
  - **Internalization Side:** Only partially captured by **risk compensation** (e.g., slower speeds due to perceived danger, not fear of tickets).  
  - **What You Can’t Say:** Whether compliance stems from social pressure, moral agreement, or design-induced caution. Your tools measure *outcomes* (speeds, collisions), not *motivations*.  

  **2. Friesland Case Study Through Translation**  
  - **Translation:** Monderman reduced **signage density**, removed **kerbs** (creating **shared surfaces**), and relied on **risk compensation** (eye contact, caution). Compliance shifted from **posted rules** to self-regulation.  
  - **Result:** This was a **loosening** by design parameters (lower explicit control).  
  - **Why the Kerbs Were Restored:** The **residue** explains the failure. Your vocabulary optimizes for *aggregate* outcomes (e.g., average speed reduction). But:  
    - *Blind users* couldn’t leverage **risk compensation** (no visual cues for negotiation).  
    - The tight/loose axis **cannot represent equity trade-offs**. Loosening worked for the majority but excluded vulnerable users.  
  - **What the Framing Leaves Out:** The axis assumes uniformity of user capability. Restoring kerbs revealed that "legitimate compliance demand" must account for *varying needs*—some users require physical controls (**tight** elements) to access the same safety others achieve through negotiation (**loose** elements).  

  ### Conclusion  
  Your vocabulary **excels** at operationalizing control levels into measurable parameters (signage density, compliance rates). It **fails** to:  
  1. Capture *non-physical societal forces* (threats, values),  
  2. Distinguish *motivations for compliance* (fear vs. internalization),  
  3. Address *equity* in rule enforcement (e.g., blind users vs. sighted ones).  
  The Friesland case shows the tight/loose axis oversimplifies legitimacy: **Optimal control isn’t a single setting for a society, but a system accommodating diverse user requirements simultaneously.**
