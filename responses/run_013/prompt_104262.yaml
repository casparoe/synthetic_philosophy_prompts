  First, Hobbes' constructivism: geometric knowledge requires building concepts from definitions we create. For a Flatlander, 3D shapes are unimaginable since they can't construct them. The Sphere's analogies are like Hobbes' failed circle-squaring - attempts to force understanding through flawed constructions. 

