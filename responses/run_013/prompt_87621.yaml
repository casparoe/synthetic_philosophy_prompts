prompt: |-
  Hey — I'm the student council president at my high school and I got asked to give a short speech (like four minutes) at the rally outside the district office next Wednesday night, the night before the teachers vote on whether to authorize a strike. So the crowd is going to be a wierd mix: a few hundred teachers, alot of whom have done this before and will visibly groan at anything that sounds like a bumper sticker; parents who are honestly freaked out about who's watching their kids if there's a walkout; students like me; and I'm pretty sure the local paper is sending somebody. Everything I write comes out either as "we support our teachers!" (which says nothing) or as me lecturing adults about labor law, and I need it to be neither.

  Here's the thing that's actually bugging me and I want the speech built around it. My friend Maya keeps saying a strike is just a bunch of people each individually deciding not to show up, and since the union gets the raise for everybody anyway — including the teachers who cross the line — the ones who strike are basically chumps and the ones who cross are just being rational. My dad says the opposite, that the ones who cross are free-riders living off other people's risk. I don't think either of them has the facts wrong, and I don't think shouting "solidarity" answers it, because that's the word I'm trying to pin down, not the answer. Mr. Alvarez in social studies said the whole legal idea is that what gets protected is acting *together*, not one person refusing by themselves, and he also said a strike is more like a sentence than a decision because it's aimed at somebody — which I don't fully get, but I think it's the seed of the thing. So what I want the speech to actually do is say something precise about what a strike is, one action or a million actions, and whether the right to organize is something a person has or something a group has (a right to assemble seems like it only means anything when there's a bunch of you), and then make that land for this exact crowd without turning into civics class.

  Couple more things: nothing in it for the parents can be a promise I can't keep, and please don't put a quote from some famous person in there, because if the reporter asks me who said it I will definately get it wrong. Just write the speech.
reasoning: |-
  Okay, the user is a high school student council president preparing a speech for a rally ahead of a teachers' strike vote. They need a four-minute speech that addresses the complex nature of strikes without being cliché or academic. The crowd includes teachers (some cynical), anxious parents, students, and a reporter. 

  The core challenge is unpacking Maya's pragmatic view ("strikers are chumps") versus their dad's solidarity view ("crossers are free-riders") without preaching. The social studies teacher's insight about strikes being "a sentence, not a decision" is key—they want to explore whether organizing rights belong to individuals or groups. 

  Notably, they reject bumper-sticker slogans and famous quotes. Parents need reassurance without false promises. The speech must feel human, not like a civics lecture. 

  Hmm... The tension here is between individualism and collective action. The legal framework Mr. Alvarez mentioned (strikes as protected *group* action) could anchor this, but it needs vivid metaphors. The "sentence" idea implies intentional communication—maybe frame the strike as language? 

  Also critical: acknowledging parental fears without overpromising. The student role is unique—they're stakeholders but not decision-makers. Should emphasize that students see both sides (teachers' sacrifices, parents' logistics) to build bridges. 

  Avoiding "solidarity" as a buzzword means showing, not telling: concrete examples of how individualism fails (e.g., one voice vs. a chorus). The assembly right point is sharp—rights exist *because* groups matter. 

  Structure thoughts: 
  Open with immediacy ("tonight matters because..."). 
  Then name the elephant—Maya's view vs. dad's—to show we're tackling real doubts. 
  Use the teacher's "sentence" metaphor to explain strikes as dialogue. 
  Address parents' fears by validating them, then pivoting to shared stakes. 
  Close with student perspective as the unifying thread. 

  No platitudes. No quotes. Just clear, warm, precise language that makes abstract concepts feel urgent.
answer: |-
  Here’s a speech that tackles the core question you raised—**what a strike actually *is***—while speaking plainly to all three groups in your audience. It avoids slogans, lectures, and quotes, focusing instead on the *action* itself and why collective action matters differently than individual choice:

  ---

  **(Start with calm, clear energy - not shouting, but conviction)**  
  Good evening. My name is [Your Name], and I’m the student body president at [Your School]. I’m here tonight not as an expert on contracts or labor law, but as a student who sees what’s happening, who talks to teachers, who hears parents worrying, and who knows what’s at stake if our classrooms go quiet.

  **A lot of us are trying to figure out what a strike really *is*. Is it just a bunch of individuals, one by one, deciding not to go to work?** That’s a practical way to see it. And if you look at it *only* that way, it’s easy to ask: Why would anyone take that risk? Why stand outside when someone else might walk in, do the job, and get the same reward later? That seems… rational. On the surface.

  **But that view misses something fundamental.** A strike isn’t just the *sum* of those individual choices. It’s something else entirely. It’s a single action taken *by the group, as a group*. It’s the difference between one voice shouting into the wind and an entire chorus speaking together so they cannot be ignored.

  **My social studies teacher put it like this: A strike is more like a sentence than a decision.** A sentence needs structure; it needs purpose; it needs to be aimed *at* someone to convey meaning. One person staying home alone? That’s a word, maybe. But a strike? That’s the whole sentence. It’s the organized voice of the educators saying, clearly and collectively: **“This matters enough that we act together.”** Without the *together*, it’s just noise. With it, it becomes communication. It becomes power.

  **That’s why the right to organize isn’t really just about individuals.** An individual has the right to quit. An individual has the right to complain. But the right to organize? **That’s the right of a group to exist *as* a group**, to turn those individual voices into a single, clear statement. It’s the right to assemble meaningfully – not just physically, but with purpose. When teachers vote tomorrow, they aren’t just deciding individually; they’re deciding *whether to speak as one voice*.

  **So to the teachers here:** We students see you. We see the work you do far beyond the bell, the supplies you buy, the passion you bring. We understand this isn’t about wanting more; it’s about needing what’s fair to keep doing what you love. Your potential strike isn’t a collection of individual absences; it’s the sentence you are forced to speak together to be heard.

  **To the parents here:** I hear you. The uncertainty is scary. “Who watches my kid?” “What about practices, plans, college apps?” Those worries are real and valid. I can’t stand here and promise you easy solutions if a strike happens. What I *can* say is this: That fear you feel? It mirrors ours as students. And it underscores *why* this collective voice matters. Because the issues teachers are fighting for – fair pay, support staff, classroom conditions – those directly impact *who* is watching us, *how well* they can do it, and whether they can afford to stay. This isn’t teachers versus parents. It’s about ensuring our schools have what they need – together.

  **And to my fellow students:** We’re caught in the middle, but we’re not powerless. We see the complexity. We understand the frustration on all sides. Our role right now? **To listen.** To understand that this isn't just about adults arguing. It’s about the foundation of our learning. It’s about recognizing the difference between one person stepping back and an entire profession standing together to protect its ability to serve *us*.

  **So tonight, as we stand together outside this building, remember:** We’re not just a crowd. We’re assembling with purpose. Teachers, your potential action isn’t a million small choices; it’s one powerful statement spoken together. Parents, your presence shows you’re listening to that statement. Students, we’re here to witness that collective voice – the voice that speaks for the future of our schools.

  **Let’s make sure they hear us listening. Thank you.**

  ---

  **Why this works for your audience & purpose:**

  1.  **Tackles the Core Question Head-On:** Directly addresses Maya's view ("just individuals") vs. your dad's view ("free-riders") by reframing the strike as a *singular group action*, distinct from individual choices. Explains *why* the group action matters legally and practically (the "sentence" metaphor).
  2.  **Grounds "Solidarity" Without Saying It:** Explains *why* acting together is different and protected, without using the potentially groan-inducing word. Defines the *right to organize* as a *group right*.
  3.  **Respects Teachers' Intelligence:** Avoids platitudes. Acknowledges the difficulty and risk. Uses the "sentence" concept which is substantive. Focuses on their agency as a collective.
  4.  **Addresses Parents Honestly & Empathetically:**
      *   Validates their fear ("uncertainty is scary," "worries are real").
      *   Doesn't make false promises ("can't promise easy solutions").
      *   Connects the teachers' fight to the parents' core concern: the quality and stability of their children's education and care ("who is watching us," "how well," "whether they can afford to stay").
      *   Frames it as a shared interest ("not teachers versus parents").
  5.  **Gives Students a Role:** Positions students as witnesses who see the complexity and understand the stakes. Makes their presence meaningful ("here to witness that collective voice").
  6.  **Practical for You:** No quotes to remember. Language is clear and speakable. Fits within 4 minutes when delivered at a moderate pace. Stays focused on the *what* and *why* of the strike itself.
  7.  **Reporter-Friendly:** Offers a clear, non-cliché conceptual hook ("A strike is more like a sentence than a decision") that is substantive and quotable.

  **Delivery Tip:** Emphasize the key conceptual lines clearly: "*A strike isn’t just the sum of those individual choices*," "*It’s the difference between one voice... and an entire chorus*," "*A strike is more like a sentence than a decision*," "*the right of a group to exist as a group*." Pause slightly after these to let them land. Maintain a tone of respectful urgency, not anger. Good luck! You've got this.
