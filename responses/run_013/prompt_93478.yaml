prompt: |-
  So I've been going around in circles with a couple of friends after one of them brought up this view called tranquilism, which as I understand it says the only thing that's good in itself is the absence of craving and suffering -- pleasure isn't good on its own, it only looks good because it's the relief of some craving or discomfort, and once the craving's gone the pleasure has nothing left to be good about. I'm honestly not sure who came up with it or how standard that framing is, so just take my version of it as the version I want you to work with. It seems like one of those views that's easy to state and then quietly ruins everything else you believe, which is why I can't stop poking at it. For context, I'm 38, I have a job I don't hate, a partner I do love, and a fairly bad case of always wanting the next thing -- a promotion, a better flat, another trip -- and I half-suspect this view is right about me and would tell me to knock it off. We're a sci-fi book club mostly, we got onto this after someone mentioned a novel where everyone takes a drug that kills desire, so the conversation has been pretty freewheeling.

  What I actually want is the most important implications of the view, not a summary of it. Specifically: (a) if craving is itself a kind of suffering, does it follow that a restless, ambitious life is worse than a dull contented one, even when the ambitious one clearly has more of what we'd normally call pleasure in it? (b) what does the view say about the things we usually treat as goods in themselves -- love, friendship, making something good, understanding something difficult -- are they all just instruments for reducing craving, and if so is that as bleak as it sounds, or does the view have a story about why they're still worth wanting for their own sake? And (c) the one that's been bugging me most: a person in a dreamless sleep or a deep coma has no craving and no suffering, and if that's the whole of the good then their state seems to score as well as the best human life, which can't be what the view means to say -- so I want to know whether the view can actually block that, or whether it just has to bite the bullet, and which of those two a defender would really pick. Please don't give me a reading list or citations, I can't look anything up right now and I'd rather just have the arguments laid out.

  Also, tell me how confident you are in each of the claims you make and single out the one point you're least sure about -- I'd rather have an honest this-bit-is-shaky than false confidence, since I'm going to be repeating some of this at book club on Thursday and I don't want to be the guy who's definately sure about a view he half-remembers.
