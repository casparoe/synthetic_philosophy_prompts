  I'm in a decision theory reading group that's been meeting for a few months, and we've gotten stuck on a pair of cases that I suspect are the same case wearing different hats, though half the group insists they're obviously different and can't see why the other half doesn't see it. The first case: a predictor that's essentially always right flips a fair coin; if it comes up tails, it asks you for $100, and if it comes up heads, it gives you $10,000, but only if it predicted in advance that you would have paid in the tails branch. You're now in the tails branch and it's asking for the $100. The second case: a blackmailer has dirt on you and flips a fair coin; he'll release the dirt if and only if the coin is heads XOR you pay him $100 — so if the coin is tails and you pay, he releases it, and if the coin is heads and you don't pay, he releases it. He sends the demand either way, and you're deciding whether to pay without knowing the coin. Our group splits cleanly: some of us pay in the first case and refuse in the second, others refuse in both, one person pays in both and says the rest of us are just squeamish about blackmail, and nobody's arguments have moved anyone in weeks. I want you to act as a decision theorist who's seen this kind of impasse before and actually diagnose the disagreement rather than pick a side.

  Start by brainstorming the candidate structural differences between the two cases — e.g., whether your action causally affects the payoff, whether the relevant object of choice is the act or the policy/disposition, whether the predictor's accuracy gives you evidence about the coin or a causal link through your own disposition, whether the payoffs should be evaluated ex ante or branch by branch — and then tell me which of those differences is doing the real work and which are red herrings. My hypothesis, which I'd like you to test rather than just agree with, is that the whole thing turns on whether "your decision" means the act you're about to perform or the policy you've already settled into, and that once you fix that, one of the cases dissolves into an ordinary causal decision problem. Is that right, or is there a substantive disagreement about causation, or about what rational agents are allowed to care about, that survives even after the act/policy distinction is made? I definately lean toward the verbal-diagnosis myself, but I've been wrong before and the person who pays in both cases is annoyingly good at arguing. Whichever way you come down, tell me what would actually count as progress here: a formal result, a cleaner case that separates the competing diagnoses, or an argument that the dispute is verbal and we should stop having it. Please don't just survey the decision theories — I want the diagnosis with reasons.
