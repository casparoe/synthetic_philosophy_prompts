  ### Diagnosis of the Disagreement

  Your intuition is largely correct: the core disagreement hinges on **whether "your decision" refers to the specific act in the current branch or a pre-commitment to a policy**. However, there's a deeper structural difference that makes this distinction matter more in the Predictor case than in the Blackmailer case. I'll break this down step by step.

  ---

  ### **Candidate Structural Differences**
  I'll evaluate each candidate difference for its relevance, then identify which are doing the real work.

  1. **Causal vs. Evidential Effects**  
     - **Predictor Case**: Your act (paying/not paying) has no *causal* effect on the $10,000 outcome (which is already determined in the heads branch). However, it provides *evidence* about the predictor's past accuracy and thus about the $10,000 outcome.  
     - **Blackmailer Case**: Your act has a direct *causal* effect on whether the dirt is released (it's part of the XOR condition).  
     - **Verdict**: **Real work**. This is the key difference. The Predictor case involves evidential reasoning (your choice reveals info about a past event), while the Blackmailer case is purely causal (your choice directly affects the future).

  2. **Act vs. Policy/Disposition as the Object of Choice**  
     - **Predictor Case**: Rationality depends on whether you view your choice as:  
       - An *act* (in the tails branch, paying costs $100 with no local benefit).  
       - A *policy* (ex ante, committing to pay ensures you get $10,000 in the heads branch).  
     - **Blackmailer Case**: No policy-based benefit. Your choice is only an act (paying affects dirt release causally, but no global policy improves outcomes).  
     - **Verdict**: **Real work, but secondary**. This distinction amplifies the causal/evidential split. Policies matter in the Predictor case because the predictor's accuracy ties your disposition to outcomes in other branches.

  3. **Predictor's Accuracy as Evidence vs. Causal Link**  
     - **Predictor Case**: The predictor's accuracy creates a *logical correlation* between your disposition and the $10,000 outcome. Your choice reveals whether you "always pay," which implies the $10,000 was received.  
     - **Blackmailer Case**: No such correlation. The coin is independent of your disposition.  
     - **Verdict**: **Real work**. This is why evidence matters in the Predictor case but not the Blackmailer case.

  4. **Ex Ante vs. Branch-by-Branch Evaluation**  
     - **Predictor Case**: Ex ante evaluation (before the coin flip) favors paying (expected value: $4,950). Branch-by-branch evaluation in the tails branch favors not paying (lose $100 with no upside).  
     - **Blackmailer Case**: Both evaluations favor not paying (expected value: not pay = lose $0.5X, pay = lose $100 + $0.5X, where $X is dirt cost).  
     - **Verdict**: **Red herring**. The ex ante/branch conflict is a *symptom* of the deeper issue (causal vs. evidential), not the cause. In the Blackmailer case, both evaluations align.

  5. **Squeamishness About Blackmail**  
     - **Verdict**: **Red herring**. The lone "pay in both" position is likely a moral/emotional stance (avoiding dirt release at all costs), but it doesn't resolve the logical split. The blackmailer's mechanism doesn't reward policies, so paying is causally dominated.

  ---

  ### **The Real Culprit: Causal vs. Evidential Reasoning**
  - **Predictor Case**:  
    - **Evidential reasoners** (e.g., EDT, UDT agents) pay. They reason: "If I pay, it means I'm the type who pays, so I likely got $10,000 in the heads branch. Not paying suggests I didn't get it, and I lose $100 for nothing." Here, the act is evidence of a beneficial past outcome.  
    - **Causal reasoners** (e.g., CDT agents) refuse. They reason: "Paying can't affect the $10,000 (already decided). In this branch, I only lose $100."  
    - *Why the policy distinction matters*: Evidential reasoners implicitly treat the choice as revealing a *disposition* set ex ante. Causal reasoners treat it as a local act.

  - **Blackmailer Case**:  
    - **Both reasoners refuse**. Paying costs $100 and *causes* dirt release in tails (XOR condition). There's no evidence to leverage—the coin is independent.  
    - *Why the policy distinction doesn't matter*: No global policy improves outcomes. Committing to pay doesn't affect the coin or the dirt release mechanism.

  ### **Your Hypothesis: Confirmed with a Caveat**
  You're right that the act/policy distinction is central—but only because it **exposes the causal/evidential divide**. In the Predictor case, policy-based reasoning (evidential) conflicts with act-based reasoning (causal). In the Blackmailer case, there's no conflict because no evidence exists to exploit. The "substantive disagreement" is about whether rational agents should:
  - Ignore evidence about past events (causal view), or  
  - Use their choices as information about correlated outcomes (evidential view).  

  This isn't purely verbal; it reflects a **fundamental split in decision theories** (CDT vs. EDT/UDT). However, the Blackmailer case *is* "an ordinary causal decision problem" for all theories, while the Predictor case is not.

  ---

  ### **Why the "Pay in Both" Position is Flawed**
  The lone dissenter likely conflates the cases emotionally (e.g., "paying avoids bad outcomes") or misapplies policy reasoning. In the Blackmailer case:  
  - Paying doesn't leverage a predictor, so it can't create evidence of past benefits.  
  - The XOR mechanism ensures paying *causes* harm in tails. No policy justifies it.  
  This position is defensible only if one values avoiding dirt release more than money (e.g., if $X > $200), but even then, not paying is *strictly better* by $100 in expectation.

