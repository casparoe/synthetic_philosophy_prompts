  ### **Path to Progress**
  1. **Formalize the Distinction**:  
     - Calculate expected utilities for both cases under CDT and EDT.  
       - *Predictor case (EDT)*: Pay if \(0.5 \times (\text{evidence of \$10,000}) - \$100 > 0\).  
       - *Blackmailer case (all)*: Not pay if \(0.5X > 0.5X + \$100 - \$100\) (always true).  
     - Result: CDT refuses both; EDT pays in Predictor, refuses in Blackmailer. This clarifies the split.

  2. **Use a Cleaner Case**:  
     - **Newcomb's Coin Toss**:  
       - Predictor flips coin; if heads, puts \$10K in Box A only if it predicts you take only Box A. If tails, asks for \$100 only if it predicts you pay.  
       - *This isolates the evidential structure*. Those who pay here but refuse blackmail are consistently evidential.  

  3. **Argue the Dispute is Partly Verbal**:  
     - The group disagrees on what "rational" means:  
       - **Causalists**: "Rational = choose acts that cause good outcomes."  
       - **Evidentialists**: "Rational = choose acts that correlate with good outcomes."  
     - Once this is explicit, the Predictor case becomes a standard Newcomb debate. The Blackmailer case is neutral ground where both agree.  

  4. **Acknowledge the Stalemate**:  
     - Philosophers (e.g., Lewis, Nozick) and decision theorists (e.g., Yudkowsky) have debated this for decades. The group won't "solve" it—but they can agree:  
       - The Blackmailer case is uncontroversial: refuse.  
       - The Predictor case splits by decision theory.  
     - Progress means mapping positions to frameworks, not converting others.

  ---

  ### **Final Verdict**
  - **Your hypothesis holds**: The act/policy distinction drives the split, but only because it mediates the **causal vs. evidential** rift. The Predictor case is where these models diverge; the Blackmailer case is causally straightforward.  
  - **Substantive disagreement remains**: Even after clarifying "decision," causalists and evidentialists will clash on whether evidence about past outcomes justifies acts. This is a deep, unresolved debate in decision theory.  
  - **Path forward**: Formalize the cases under CDT/EDT, then agree to disagree on the Predictor. Focus shifts from persuasion to understanding why others hold their position.
