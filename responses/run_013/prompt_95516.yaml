  ## The Sistrum (After Du Châtelet)

  Young friend, you ask how joy is truly won,
  And if my books hold maps for ecstasy.
  Beware the sage who strips all **illusion**
  Away! Cold truth breeds barren misery.
  A frozen heart feels nothing. Fan the **passion**
  That makes the blood sing! Let its wildfire run!

  Not reckless, though! The mind must also run
  Through measured paths. Devote yourself to **study**;
  Let **reason** build its scaffold, strong and high.
  But mortar it with heat! For arid **reason**,
  Unsweetened by the heart, is but dry stone.
  True wisdom knows: we need to lose the **self**

  In something vast. A calculated **self**
  Is but a cage. Oh, let the spirit run
  Beyond its chains! Embrace the sweet **illusion**
  That paints the world with hues of bright **passion**.
  The cynic, peeling layers, finds no sun,
  Only the dust of unrelenting **time**.

  Ah, **time**! That thief who steals the bloom, the run
  Of youthful strength. Yet even as **time** flies,
  My solace is the page, the focused **study**
  That builds a world impervious to sighs.
  Here, **reason** is my lamp, a steady flame,
  A private fortress, sheltering the **self**.

  But is this refuge just another **self**-
  Deception? Walls built against cruel **time**?
  Perhaps. Yet knowledge gleaned through patient **study**
  Offers a different, deeper kind of run:
  Not wild abandon, but a clarified **passion**,
  A structured fire, dispelling vague **illusion**?

  Or does it? Look: the grandest **illusion**
  Persists! That ardent spark, that shared **passion**
  Igniting thought and touch – though **reason** warns
  Of transience, the swift escape of **time**,
  I cling! His voice, his laugh… a heady run
  I choose, even knowing the cost. My **study**

  Grows cold sometimes. This rigorous **study**
  Can feel a citadel, remote and stark. **Time**
  Spent chasing proofs… does it betray the **self**
  That craves warm light? Yet when the fierce **passion**
  Flickers, or wounds, or fades before harsh **time**,
  The quiet page remains, my truest **run**.

  *(Envoi)*
  Dear girl, hold **study** close, your fortress, cage.
  Let sweet **illusion** be your kindest lie.
  Feed **passion**’s blaze, though **reason** counts the wage.
  Forget the **self**? Perhaps. Yet watch it fly.
  Outrun bleak **time**? We try, and still we try.
  We chase both flame **and** lamp beneath the sky.

  ---

  **Notes on the Sestina:**

  1.  **The Voice:** The poem adopts Du Châtelet's persona – intellectual, passionate, self-aware, and mentoring. References to study as a "fortress," "lamp," and "refuge" align with her writings, as does the tension between intense love ("his voice, his laugh") and intellectual pursuit.
  2.  **The End-Word Shifts:**
      *   **Illusion:** Begins as necessary sweetness ("sweet illusion"), becomes a conscious choice despite knowledge ("grandest illusion," "kindest lie"), acknowledging its potential self-deception.
      *   **Passion:** Starts as vital wildfire ("fan the passion"), evolves into a structured intellectual fire ("clarified passion"), and remains a vital blaze to be fed ("Feed passion's blaze").
      *   **Study:** Introduced as disciplined pursuit ("Devote yourself to study"), becomes a crucial solace ("My solace is the page"), a refuge ("private fortress"), but also potentially isolating ("citadel, remote and stark").
      *   **Reason:** Begins as a necessary scaffold ("Let reason build"), becomes a clarifying tool ("reason is my lamp"), a warning voice ("though reason warns"), and ultimately a counterpoint to passion ("though reason counts the wage").
      *   **Self:** Starts as something to transcend ("lose the self"), becomes a refuge ("sheltering the self"), a potential object of calculation ("calculated self"), and a persistent entity ("watch it fly").
      *   **Time:** Introduced as the thief ("thief who steals"), becomes an inescapable pressure ("swift escape of time," "fades before harsh time"), and the ultimate constraint ("Time grants no reprieve").
  3.  **The Tension:** The poem circles the unresolvable conflict: the necessity of passionate engagement (often requiring illusion) versus the clarifying, grounding (but potentially isolating) power of reason and study. The envoi explicitly refuses resolution ("chase both flame **and** lamp"), leaving both as necessary, contradictory pursuits under the pressure of time.
  4.  **Accuracy & Clarity:** References to her intellectual work ("proofs," "page," "knowledge," "reason"), her passionate nature ("blood sing," "wildfire," "ardent spark"), and the central tension from the *Discourse* are woven in. Even without knowing the source, the poem stands as a meditation on love, intellect, and the pursuit of happiness against mortality. The "his voice" subtly nods to Voltaire without requiring prior knowledge.
  5.  **The Obsessive Form:** The sestina's relentless circling of the six end-words mirrors the mind's obsessive return to these core, conflicting concepts in the search for happiness, unable to settle on one path.
