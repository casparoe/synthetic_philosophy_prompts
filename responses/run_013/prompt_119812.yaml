prompt: |-
  I'm the research editor at a small popular-history magazine. Part of my job is triaging pitches and manuscripts that make big unorthadox claims -- a lost Ice Age civilization, the pyramids being poured concrete, Fomenko's re-dating of basically all of ancient history, ancient astronauts hidden in the Sumerian texts. Right now its mostly vibes: if it feels crankish we pass. That's burned us twice this year, once by publishing something we shouldn't have and once by passing on something that later turned out to be respectable. I want a procedure I can actually run on a manuscript in half an hour, and that my two interns could run without me. It should end in one of three verdicts: treat as ordinary scholarship, publish but flag as contested, or decline as pseudohistory. Ground it in whatever the demarcation literature actually settled -- I gather not much, so be honest about that -- and keep it usable by someone who hasn't read any of it. Order the questions, say what counts as a good enough answer to each, and mark the spots where it stops being a factual question and becomes an editorial call I have to sign off on myself. Then run it on three cases: Fomenko, the ancient-astronaut reading of Sumerian texts, and the pre-Clovis migration fight, where the fringe side basically won. Tell me where it hands me an answer I won't like, and name one boundary it must not cross -- I don't want a rubric that quietly classifies religious or political conviction as pseudohistory just because it makes empirical claims.
reasoning: |-
  We are creating a triage procedure for evaluating manuscripts making unorthodox claims. The procedure should be runnable in half an hour by interns and end in one of three verdicts: 
  1. Treat as ordinary scholarship
  2. Publish but flag as contested
  3. Decline as pseudohistory

  The procedure must be grounded in demarcation literature (with honesty about its limitations), usable by non-experts, and avoid classifying religious or political convictions as pseudohistory solely because they make empirical claims.

  We'll design a step-by-step flowchart of questions. Each question should have clear criteria for passing or moving to the next step. We note points where it becomes an editorial call.

  ### The Procedure

  **Step 1: Initial Scan for Red Flags (Crank Indicators)**
     - **Question 1: Does the manuscript exhibit any of the following?**
       a) Claims of a vast conspiracy suppressing the truth (e.g., mainstream scholars are lying or incompetent to hide the truth).
       b) Reliance on a single, overlooked piece of evidence while dismissing the broader body of evidence without engagement.
       c) Use of jargon that is non-standard or redefines standard terms without clear explanation.
       d) Claim of absolute certainty (e.g., "proves beyond any doubt") without acknowledging limitations or alternative views.
       e) Dismissal of entire fields (e.g., "all of archaeology is wrong") without specific critique.
     - **Criteria**: If 2 or more of (a-e) are present, flag as pseudohistory (Verdict: Decline). If 1 is present, note it and proceed. If none, proceed.

  **Step 2: Engagement with Existing Scholarship**
     - **Question 2: Does the manuscript engage with the current scholarly consensus?**
       - Check if it cites key works in the field (especially recent ones) and addresses counterarguments.
       - If the manuscript claims to overturn a consensus, does it provide a systematic critique of the existing evidence?
     - **Criteria**:
       - **Poor engagement**: Ignores major scholars, misrepresents consensus, or only cites fringe sources. → Proceed to Step 4 (but note: this might lead to pseudohistory).
       - **Adequate engagement**: Engages with mainstream scholarship, even if critically. → Proceed to Step 3.

  **Step 3: Quality of Evidence and Reasoning**
     - **Question 3: Is the evidence presented in a way that allows for independent verification?**
       - Are sources cited so that one could check them?
       - Are methods described in sufficient detail for replication?
       - Is the reasoning logical (e.g., avoids non sequiturs, ad hominem attacks, or confusing correlation with causation)?
     - **Criteria**:
       - **Yes, and the reasoning is sound** → Proceed to Step 5.
       - **No, or reasoning is flawed** → Proceed to Step 4.

  **Step 4: Check for Salvageable Elements**
     - **Question 4: Despite flaws, does the manuscript offer a novel perspective or data that might be worth considering?**
       - Look for: Newly discovered evidence (e.g., an artifact, document), a reinterpretation of known evidence that isn't obviously flawed, or a testable hypothesis.
       - **Criteria**:
          - If yes, and the flaws are in engagement (Step 2) or reasoning (Step 3) but the core idea is testable and not obviously false, then **Publish but flag as contested**.
          - If no, or the core idea is untestable or based on a logical fallacy (e.g., argument from ignorance), then **Decline as pseudohistory**.

  **Step 5: Plausibility and Burden of Proof**
     - **Question 5: Does the manuscript meet the burden of proof for its claim?**
       - Extraordinary claims require extraordinary evidence (ECREE). Consider:
          - How extraordinary is the claim? (e.g., overturning well-established consensus vs. offering a minor reinterpretation)
          - Is the evidence commensurate with the claim? (e.g., a single ambiguous inscription is not enough to rewrite world history)
       - **Criteria**:
          - **Ordinary claim** (e.g., a new interpretation of a local event) with adequate evidence → **Treat as ordinary scholarship**.
          - **Extraordinary claim** with strong, multiple lines of evidence that directly address the consensus → **Publish but flag as contested** (because it is contested by nature).
          - **Extraordinary claim** with weak or insufficient evidence → **Decline as pseudohistory**.

  **Editorial Call Points**:
     - At Step 4: Deciding whether a flawed manuscript has enough novelty to flag as contested is subjective. The editor must sign off.
     - At Step 5: Judging the "extraordinary" nature of a claim and whether the evidence meets the burden is also subjective. The editor must sign off.

  **Boundary Not to Cross**: 
     - The procedure must not classify a claim as pseudohistory solely because it challenges a consensus. It must be based on flawed methodology, lack of evidence, or failure to engage. Also, if a claim is rooted in religious or political conviction but is presented with testable evidence and reasoning, it should be evaluated on those grounds.

  ### Now, run the procedure on three cases:

  **Case 1: Fomenko's New Chronology (re-dating ancient history)**
     - Step 1: 
          - (a) Claims conspiracy: Yes (mainstream historians are wrong due to a conspiracy or massive error).
          - (b) Reliance on single evidence: Not single, but uses astronomical calculations and dismisses other evidence (e.g., archaeology, dendrochronology) without adequate rebuttal.
          - (c) Non-standard jargon: Redefines historical timelines without standard terms.
          - (d) Absolute certainty: Often presents as definitive.
          - (e) Dismissal of entire fields: Yes (all of ancient and medieval history).
          → Multiple red flags → **Decline as pseudohistory** (by Step 1).

  **Case 2: Ancient Astronauts in Sumerian Texts (e.g., von Däniken)**
     - Step 1:
          - (a) Conspiracy: Often implies that scholars ignore or suppress the truth.
          - (b) Single evidence: Focuses on selective readings of texts (e.g., the Anunnaki as aliens) without considering alternative interpretations in context.
          - (c) Non-standard jargon: Uses terms like "ancient astronauts" and reinterprets gods as extraterrestrials.
          - (d) Absolute certainty: Often presents interpretations as fact.
          - (e) Dismissal: Dismisses mainstream interpretations of mythology and religion.
          → Multiple red flags → **Decline as pseudohistory** (by Step 1).

  **Case 3: Pre-Clovis Migration (the fringe side that won)**
     - Note: This was once fringe but is now widely accepted (e.g., sites like Monte Verde).
     - Step 1: 
          - (a) Conspiracy: Some proponents might have claimed bias, but not necessarily a core part of the argument.
          - (b) Single evidence: Initially, new sites were presented (e.g., Monte Verde) but the argument engaged with existing Clovis-first evidence.
          - (c) Jargon: Uses standard archaeological terms.
          - (d) Certainty: Typically presented as a challenge to the consensus with evidence, not absolute.
          - (e) Dismissal: Did not dismiss the entire field, but challenged a specific paradigm.
          → No clear red flags, or maybe one (if there were occasional conspiracy claims) → Proceed.

     - Step 2: Early pre-Clovis proponents did engage with Clovis-first scholarship, though sometimes critically. They cited existing work and tried to address counterarguments. → **Adequate engagement** → Step 3.

     - Step 3: Evidence was presented (e.g., radiocarbon dates, stratigraphy) that allowed independent verification. Methods were standard. Reasoning: Initially controversial but based on empirical data. → **Sound reasoning and verifiable** → Step 5.

     - Step 5: The claim (human presence in Americas before Clovis) was extraordinary at the time. The evidence (from Monte Verde and others) was strong and multiple (multiple sites, different methods). Even when it was fringe, it met the burden of proof with new evidence. 
          → **Extraordinary claim with strong evidence** → **Publish but flag as contested** (at the time when it was still contested). Now, it would be ordinary scholarship because the consensus shifted.

  **Where the procedure hands an answer you won't like**:
     - The procedure would have flagged pre-Clovis as contested at the time (which might have led to passing on it, because it was then fringe). But note: the procedure does not prevent publishing contested ideas — it flags them. The editor must then decide if the evidence is strong enough to publish with a flag.

  **One boundary it must not cross**:
     - As requested, we avoid classifying religious claims (e.g., a manuscript arguing for a historical Exodus based on biblical texts and archaeological correlations) as pseudohistory just because it's religious. If it engages with scholarship, uses evidence, and meets the burden of proof (even if contested), it could be flagged as contested but not declined as pseudohistory.

  ### Final Procedure Summary for Interns:

  **Verdict Key**:
  - **Decline as pseudohistory**: Fails at Step 1 (multiple red flags) or Step 4 (no salvageable element) or Step 5 (extraordinary claim without evidence).
  - **Publish but flag as contested**: Passes Step 1 (with maybe one red flag) but has issues in engagement or reasoning (Steps 2 or 3) but has a testable core idea (Step 4), or in Step 5 is an extraordinary claim with strong evidence (which is inherently contested).
  - **Treat as ordinary scholarship**: Passes all steps without red flags and the claim is ordinary or the extraordinary claim has become mainstream (like pre-Clovis now).

  **Time Management**:
  - Step 1: 5 minutes (scan for red flags)
  - Step 2: 10 minutes (check citations and engagement)
  - Step 3: 10 minutes (evaluate evidence and reasoning)
  - Step 4: 5 minutes (if needed, check for novelty)
  - Step 5: 5 minutes (burden of proof and editorial call)

  Total: 35 minutes (within half-hour target with practice).

  **Note to Editor**: 
  - Steps 4 and 5 require your sign-off when the verdict is "publish but flag as contested" or when there is uncertainty in Step 5 about the burden of proof.
  - Always check for the boundary: if the manuscript is making a religious or political claim with testable evidence, do not decline solely for being religious/political.
answer: |-
  Below is a triage procedure for evaluating manuscripts with unorthodox historical claims, grounded in demarcation literature (e.g., Popper's falsifiability, Kuhn's paradigm shifts, and later work by Thagard, Bunge, and Pigliucci). Demarcation remains contested—no universal test exists—but consensus centers on **methodological rigor, engagement with evidence, and testability**. The procedure prioritizes practical, objective checks over philosophical debates. Interns can run it in 30 minutes using the flowchart below. **Editorial calls** (where you must sign off) are marked. 

  ### **Triage Procedure: 5 Questions, 3 Verdicts**  
  **Verdicts**:  
  - ✅ **Treat as ordinary scholarship** (publish unflagged).  
  - ⚠️ **Publish but flag as contested** (requires framing, e.g., "a minority view").  
  - ❌ **Decline as pseudohistory** (fails methodological standards).  

  **Boundary**: Never classify a claim as pseudohistory **solely** because it challenges consensus, involves religion/politics, or is "weird." Focus on **methodological failures** (e.g., ignoring counterevidence, untestability). Religious/political claims with testable evidence get evaluated like others.  

  ---  
  #### **Step 1: Is the core claim testable?** (5 mins)  
  **Ask**: Can we imagine evidence that would disprove this? Does the author specify how their claim could be falsified?  
  - **Good enough**: Yes, and the manuscript proposes ways to test it (e.g., "If we radiocarbon date X, it should show Y").  
  - **Red flag**: Untestable (e.g., "Aliens hid all counterevidence"; "This is true because mainstream scholars are biased").  
  - **Verdict**:  
    - ❌ **Decline** if untestable.  
    - ✅ **Proceed** if testable.  

  *Why?* Demarcation 101 (Popper): Pseudoscience avoids falsification. Testability separates empirical claims from dogma.  

  #### **Step 2: Does it engage with counterevidence?** (10 mins)  
  **Ask**: Does the author address key objections from mainstream scholarship? Scan citations: are major critics or consensus sources (e.g., textbooks, journals) cited?  
  - **Good enough**: Directly addresses 2+ major counterarguments (e.g., "Smith (2020) argues X, but my evidence Y contradicts this because...").  
  - **Red flag**: Dismisses counterevidence without engagement (e.g., "All critics are clueless"), cites only fringe sources, or uses conspiracy logic (e.g., "Academia suppresses this").  
  - **Verdict**:  
    - ✅ **Ordinary scholarship** if robust engagement.  
    - ⚠️ or ❌ **Proceed to Step 3** if weak.  

  *Why?* Scholarly work anticipates objections (Kuhn). Ignoring counterevidence suggests crankery (Thagard).  

  #### **Step 3: Is evidence reproducible?** (10 mins)  
  **Ask**: Can another researcher verify the evidence? Check:  
  - Sources cited (primary > secondary > self-published).  
  - Methods described (e.g., "We used carbon dating on artifact Z").  
  - Data availability (e.g., "Images are in Appendix 2").  
  - **Good enough**: Clear sources/methods; evidence is physical, textual, or data-based.  
  - **Red flag**: Evidence is vague ("ancient texts say..."), anecdotal, or requires special access (e.g., "I alone decoded this").  
  - **Verdict**:  
    - ✅ **Ordinary scholarship** if reproducible.  
    - ⚠️ or ❌ **Proceed to Step 4** if not.  

  *Why?* Reproducibility is scientific bedrock (Bunge). Pseudohistory relies on inaccessible "proof" (e.g., psychic channeling).  

  #### **Step 4: Is the burden of proof met?** (5 mins)  
  **Ask**: For the claim’s boldness, is the evidence sufficient? Use the **Extraordinary Claim Checklist**:  
  - **Ordinary claim** (e.g., "New evidence suggests Vikings arrived earlier"): Requires modest evidence (e.g., one new artifact).  
  - **Extraordinary claim** (e.g., "Entire chronology is wrong"): Requires multiple lines of high-quality evidence (e.g., peer-reviewed studies + archaeology + texts).  
  - **Good enough**: Evidence matches the claim’s scope (e.g., 5+ data points for rewriting history).  
  - **Red flag**: Grand claims from thin evidence (e.g., "One inscription proves aliens built pyramids").  
  - **Verdict**:  
    - ✅ **Ordinary scholarship** if burden met.  
    - ⚠️ **Publish but flag as contested** if ambitious but plausible (e.g., strong but incomplete evidence).  
    - ❌ **Decline** if wildly disproportionate.  

  *Why?* "Extraordinary claims require extraordinary evidence" (Sagan, via Hume). Pseudohistory leaps to big conclusions (Pigliucci).  
  **Editorial call**: Deciding if evidence is "sufficient" is subjective. You sign off here.  

  #### **Step 5: Is it peer-reviewed or peer-reviewable?** (5 mins)  
  **Ask**: Has this work been vetted by experts? If not, would it survive peer review? Check:  
  - Published in academic journals?  
  - If not, is the methodology rigorous enough that it *could* be?  
  - **Good enough**: Already peer-reviewed, or methods/data are robust.  
  - **Red flag**: Self-published only, with fatal flaws (e.g., no citations, magical thinking).  
  - **Verdict**:  
    - ✅ **Ordinary scholarship** if peer-reviewed.  
    - ⚠️ **Publish but flag as contested** if unvetted but passes Steps 1-4.  
    - ❌ **Decline** if self-published and fails prior steps.  

  **Editorial call**: Judging "peer-reviewability" requires experience. Interns flag this for you.  

  ---  
  ### **Flowchart Summary for Interns**  
  1. ❌ **Decline** if claim is untestable (Step 1).  
  2. ✅ **Ordinary** if it engages critics, evidence is reproducible, and burden is met (Steps 2–4).  
  3. ⚠️ **Contested** if testable and ambitious but has gaps (e.g., new evidence not yet peer-reviewed).  
  4. ❌ **Decline** if evidence is irreproducible or burden wildly unmet.  
  5. **Editorial call** at Steps 4–5: Interns highlight borderline cases.  

  **Time allocation**: Stick to timings—no deep research. Use Google Scholar for quick citation checks.  

  ---  
  ### **Test Cases**  
  **Case 1: Fomenko’s New Chronology** (Redates ancient history)  
  - **Step 1**: Testable? ❌ No. Claims are unfalsifiable (e.g., "all ancient records are forgeries").  
  - **Verdict**: ❌ Decline. *You won’t like this*—Fomenko is popular, but fails demarcation 101.  

  **Case 2: Ancient Astronauts in Sumerian Texts** (e.g., Sitchin)  
  - **Step 1**: Testable? ⚠️ Yes (e.g., "Texts describe tech; we could find artifacts").  
  - **Step 2**: Engage counterevidence? ❌ No. Ignores Assyriologists (e.g., "Scholars hide the truth").  
  - **Step 3**: Reproducible? ❌ No. Relies on mistranslations; no primary sources cited.  
  - **Verdict**: ❌ Decline.  

  **Case 3: Pre-Clovis Migration** (Once-fringe, now mainstream)  
  - **Step 1**: Testable? ✅ Yes (e.g., "Artifacts in pre-Clovis strata").  
  - **Step 2**: Engage counterevidence? ✅ Yes. Early papers addressed Clovis objections (e.g., dating methods).  
  - **Step 3**: Reproducible? ✅ Yes. Sites like Monte Verde published data/methods.  
  - **Step 4**: Burden met? ✅ Yes. Multiple sites, consistent evidence over time.  
  - **Verdict**: ✅ Ordinary scholarship (today). *At the time*, it might have been ⚠️ contested until evidence mounted.  

  ---  
  ### **Where the Procedure Hands You Answers You Won’t Like**  
  - **Consensus-challengers that pass**: A well-argued, evidence-based challenge (e.g., early pre-Clovis) may get ✅ or ⚠️. You must publish these even if controversial—*demarcation isn’t about defending orthodoxy*.  
  - **"Wonky but sincere" claims**: A poorly argued manuscript with a kernel of novelty (e.g., "Pyramids were concrete, but I can’t prove it") might survive to Step 4, where you must ⚠️ or ❌ it.  
  - **Religious claims**: E.g., a biblical archaeology piece with testable evidence and engagement would pass—**never auto-decline**. Only fail if methods collapse (e.g., "God told me, so no counterevidence matters").  

  ### **Boundary: What This Procedure Does NOT Do**  
  - **Never classify based on ideology**. A Marxist or libertarian history gets evaluated on evidence, not politics.  
  - **Never punish "weirdness"**. Claims about Atlantis or giants are ❌ only if they fail testability/reproducibility.  
  - **Never require consensus adherence**. Revolutionary ideas (like pre-Clovis) can be ⚠️ contested but published.  

  This balances demarcation standards with editorial pragmatism. Interns handle clear passes/fails; you judge the gray areas.
