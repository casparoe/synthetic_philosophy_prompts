  For the hospital example: If published mortality rates improve without real outcome gains, strategic invalidation (doctors gaming metrics) seems likely. But to favor structural, we'd need evidence the metric was always regime-dependent (e.g., risk-adjustment flaws exposed by policy changes). 

  My uncertainty peaks at whether Lucas-style structural shifts can occur without strategic intent - e.g., if agent behavior changes passively due to new rules. Also, in the hospital case, distinguishing gaming from flawed measurement design could be ambiguous without insider data.

