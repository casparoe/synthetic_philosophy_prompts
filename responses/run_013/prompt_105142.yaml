  I'm in a historiography seminar and we keep going in circles about Whig history -- the habit of writing the past as a story that was always heading toward the present, so every dead end, plague, or failed revolt gets recast as a necessary stepping stone to how things turned out. I want to open my presentation with a joke about it. Can you write one? I'm thinking the setup is someone narrating a real mess (a bad harvest, a doomed uprising, whatever) and the funny part comes from the Whig move itself -- the punchline should turn on the fact that the event's "meaning" only exists retroactively, like the historian is reading it with the answer key already in hand. It should actually land for people who've read the critique, not just be "lol historians are smug." A eulogy or a wedding toast might work well since the mismatch would be really audible. Keep it short, I only have a couple minutes.
