prompt: |-
  I'm a TA for a 300-level seminar called Reasons and Motives — 14 students, 90 minutes, ordinary classroom, chairs we can move, whiteboard, no laptops. Next week is the Bernard Williams internal vs external reasons distinction and I'm sick of how it goes every time: everyone nods along when I say a reason has to be able to move the agent, and then the second I hand them a case where the agent is genuinely, coldly unmoved, the whole room quietly turns externalist and nobody can say what changed. So I want an activity where they have to live inside internalism with their hands for 45 minutes and then walk into the wall themselves, before anyone in the room hears the words internal or external.

  Here's my sketch — wreck it if you have something better, but keep the core mechanic, which is that the rules *are* internalism. Everyone gets a hidden motivational set: a hand of four or five cards, each one a desire, project or commitment (you want to be someone your sister can rely on; you'd rather be disliked than pitied; you want to finish the boat). Then a citation market. Any player can cite a reason to any other player — you have a reason to give up your seat — but the citation only lands if the citing player can trace a route from the target's actual cards to the action, and the route has to survive the target's challenges: no false beliefs, no wishful thinking, no skipping steps, no just imagining harder. No new cards, and no "come on, anyone would want that". If you can't trace it, the target says I remain unmoved, the citation is void and you burn your turn. Then mid-game I want to inject the cases where the room's moral confidence is highest and the cards refuse to cooperate — someone indifferent to their own future agony, someone with no desire to be liked and no desire to be decent, someone whose every remaining desire is conditional on their still being alive, so nothing in the set gives them a reason to take the pill — and the group has to either break the mechanic or eat the conclusion.

  What I need from you is the whole runnable thing: materials, how the cards get dealt, the citation and challenge rules, turn order, a timeline for the 90 minutes, a way to keep it tense without real stakes, and a debrief that walks back over specific moments — this citation was the internalism claim, this is the bit where you stretched route until it swallowed everything, this is where the externalist temptation showed up, this is the blame and irrationality question — plus what will predictably go wrong the first time I run it and how to handle that, and an honest note on the one feature of the distinction the activity can't stage and that I'll have to supply myself. Keep it tight enough that I can run it off a single page. Last line of your answer, on its own: \unstaged{the feature the activity can't stage}
reasoning: |-
  We are designing an activity to help students experience the internal reasons thesis by Bernard Williams. The core idea is that reasons must be able to motivate an agent by being grounded in their "motivational set" (which we represent with cards). The activity will have students cite reasons to each other, but the citation only succeeds if the citer can trace a path from the target's motivational set to the action without false beliefs, wishful thinking, etc. If not, the target remains unmoved and the citer loses their turn.

  Goals:
  - Students live inside internalism: reasons must be grounded in the agent's actual motivations.
  - Force them to confront cases where an agent is coldly unmoved and there is no internal reason, even if we think there should be a reason (externalist temptation).
  - Debrief to connect the game mechanics to the philosophical concepts.

  Activity Outline:
  1. Setup (10 min)
  2. Gameplay (45 min)
  3. Injection of problematic cases (during gameplay, about 20 min in)
  4. Debrief (35 min)

  Total: 90 min

  Materials:
  - Index cards (or pre-printed cards) for motivational sets. Each card has a desire, project, or commitment. Examples:
    - "You want to be someone your sister can rely on."
    - "You'd rather be disliked than pitied."
    - "You want to finish building the boat in your garage."
    - "You value honesty above being liked."
    - "You are committed to never being in debt."
    - "You want to become a doctor."
    - "You desire to travel the world."
    - "You want to avoid physical pain."
    - ... and so on. Prepare at least 14 sets (one per student) of 4-5 cards each. Some sets should be designed to lead to clear reasons, and others to be sparse or problematic (e.g., no concern for others, no concern for future self).

  - Whiteboard to track any public information (optional).

  Setup (10 min):
  - Explain the rules without using the words "internal" or "external". Frame it as a game of "giving reasons that work".
  - Each student gets a sealed envelope (or handed face down) with their motivational set (4-5 cards). They look at their own cards but keep them hidden. They are told that these are their only motivations for the duration of the game.
  - The room is set up so that students can address each other.

  Gameplay Rules (45 min total, but we'll break it into two parts):
  - Turn order: We go around the room (or use a speaking order). Each student on their turn can either:
    a) Cite a reason to another player (target) to do a specific action.
    b) Pass (if they can't think of a good citation or don't want to risk it).

  - Citation: The citing player must state: "[Target's name], you have a reason to [action]." Then they must explain how the action connects to the target's motivational set (which they don't see, so they must speculate). They must trace a route from at least one card in the target's set to the action.

  - Challenge: The target can challenge the citation in two ways:
    1. "That motivation isn't in my set." -> The citer must try a different motivation (if they have more attempts? Rule: maybe allow up to two attempts per turn? But to keep it tight, let's say one citation per turn and if it fails, the turn ends.)
    2. "The route from that motivation to the action fails because [reason]." (e.g., false belief, wishful thinking, missing step). The target must explain why the connection doesn't hold.

  - Outcome of a citation:
    - If the target is convinced (or doesn't challenge) and the route is valid, then the citation is successful. We record it (maybe a point? but no real stakes) and the target might be considered to have done the action? But note: we are not simulating actions, just the existence of a reason. So perhaps we just mark that the citer succeeded.
    - If the target challenges and the challenge is valid (i.e., the route is flawed or the motivation isn't present), then the citation fails and the citer burns their turn (loses the chance to do anything else that turn). The target says, "I remain unmoved."

  - Important: The citer cannot invent new motivations. They can only use what they think the target might have (based on knowledge of the person, or previous successful citations, etc.). Also, no "anyone would want that" — the reason must be grounded in the target's set.

  - To keep it tense without real stakes, we can have a light competitive element? For example, each successful citation gives the citer a token. But maybe not necessary. Alternatively, we can frame it as cooperative: the group is trying to see how many successful citations they can make.

  - However, we want the problematic cases to be frustrating. So perhaps we don't use points. Instead, we focus on the experience of being unable to give a reason.

  - Turn structure: We go around the room. Each turn is about 2-3 minutes. With 14 students, we can do about 3 rounds (42 minutes) but we'll break for the injection.

  Injection (around 20 min in, after about 7-8 students have had a turn):
  - The TA (you) interrupts and introduces a "special case". You hand out new motivational sets to 2-3 students (or replace their current set) that are designed to be problematic. You can do this by having pre-set envelopes for these cases. Examples:

    Case 1: Future agony indifference
      Motivational set:
        - "You care only about what happens today, not about the future."
        - "You want to avoid any discomfort right now."
        - "You have no projects that extend beyond today."
      Action: Take a pill that will prevent terrible agony tomorrow.

    Case 2: No desire to be liked or decent
      Motivational set:
        - "You only care about accumulating wealth."
        - "You have no concern for how others view you (liked, respected, etc.)."
        - "You have no interest in being moral or decent."
      Action: Give up your seat to an elderly person.

    Case 3: Conditional desires (only alive)
      Motivational set:
        - "You want to finish your book, but only if you are alive to do so."
        - "You want to see your family, but only if you are alive."
        - "You have no fear of death, and no desire for anything that requires being alive."
      Action: Take a life-saving pill.

  - Now, the group will try to cite reasons to these targets. The targets will challenge because there is no route from their set to the action. The students will experience the frustration of having a moral intuition that there should be a reason, but being unable to ground it.

  - Let this run for a few turns (about 20-25 minutes of the gameplay time) until the difficulty is felt.

  Debrief (35 min):
  - First, ask students to describe their experience: What was easy? What was frustrating? When did they feel stuck?
  - Then, connect to Williams:
    - The rules of the game were the internal reasons thesis: a reason must be grounded in the agent's motivational set.
    - The challenges were the conditions of sound deliberative route (no false beliefs, no wishful thinking, etc.).
    - The problematic cases: sometimes there is no route, so the agent has no reason to act, even if we (from the outside) think they should.
  - Highlight specific moments during the game:
    - "Remember when X cited a reason to Y? That was a successful internal reason because the route was there."
    - "When we tried to cite a reason to [problematic case] and failed, that's because the motivational set didn't provide a route. That's the internalist conclusion: no reason."
    - "But you probably felt that there should be a reason? That's the externalist temptation."
  - Discuss: What did you do when stuck? Did you try to imagine the agent having a new motivation? (But the rules said no new cards.) That's the externalist move.
  - Blame and irrationality: Williams says we can call the agent irrational only if they fail to do what they have a reason to do (internal). In the problematic cases, they aren't irrational because they have no reason. But we might still blame them? That's a tension.
  - Finally, note the feature the activity couldn't stage: The activity cannot capture the full richness of the agent's subjective motivational set and the idea that it might be extended by sound deliberation (but without adding new motivations). The activity uses fixed cards, but in reality, deliberation might reveal new connections or even change motivations. However, Williams insists that the set is fixed for the purpose of having a reason at a time.

  What could go wrong:
  1. Students might not understand how to trace a route. Solution: Give a clear example at the start. E.g., "Your set has 'I want to be healthy' and 'I believe that exercise promotes health'. Then I cite a reason for you to exercise: because it will help you be healthy. That route is valid."
  2. The targets might be too lenient or too harsh in challenges. Solution: As TA, you can step in to moderate. Remind them of the rules: no false beliefs, no skipping steps. Also, the target must be honest about their set (they can't lie about what cards they have).
  3. The problematic cases might not be engaged deeply. Solution: Make sure the sets are handed to students who can play the role well. You might even brief them privately to be stubborn but truthful to their set.
  4. Time: 45 min gameplay might be too long. Solution: Be ready to cut the gameplay short if the point is made. Maybe 30 min total gameplay (15 min normal, then 15 min with problematic cases).

  Revised Timeline:
  - Setup: 10 min
  - Gameplay (normal): 15 min (about 7-8 turns)
  - Injection: Introduce problematic cases (5 min to explain and hand out new sets to 2-3 students)
  - Gameplay (with problematic cases): 20 min
  - Debrief: 35 min

  Total: 85 min (allows 5 min buffer)

  One-Page Run Sheet:

  Activity: Reasons That Move

  Materials:
  - Pre-made motivational sets (each in an envelope): 14 sets, 4-5 cards per set. Include 3 sets for problematic cases (set aside until injection).

  Setup (10 min):
  - Distribute envelopes. Students look at their own cards and keep them hidden.
  - Explain rules:
    - On your turn, you can cite a reason to another student: "[Name], you have a reason to [action]."
    - Then, you must explain how that action connects to the target's motivations (from their set). You can guess what they have.
    - Target can challenge:
        a) "I don't have that motivation." -> Citation fails.
        b) "The route is flawed: false belief, wishful thinking, or missing step." -> Explain why.
    - If unchallenged or the citer successfully defends the route, citation succeeds. If challenged successfully, citation fails and the citer's turn ends.
    - No new motivations: only what's on the cards.

  Gameplay (15 min normal):
  - Turn order: Go around the room. Each turn max 2 min.

  Injection (5 min):
  - "We now have some special cases." Hand out the 3 problematic sets to specific students (choose students who are engaged). Explain: "These students have received new motivational sets. The rules are the same."

  Gameplay with problematic cases (20 min):
  - Continue turns. The problematic cases will be targeted and will likely fail.

  Debrief (35 min):
  1. How did that feel? What was easy? Frustrating?
  2. The rules = internalism: reason must be grounded in the agent's motivations.
  3. Successful citations: showed internal reasons.
  4. Problematic cases: no route -> no reason, but you wanted one? That's externalism.
  5. Discussion: Why did we feel the agent should act? Blame? But internalism says no reason -> not irrational.
  6. What the activity couldn't stage: The activity uses fixed motivational sets, but in reality, deliberation might extend the set without adding new elements? (But note: Williams allows for the set to be extended by deliberation that corrects false beliefs and fills in means, but not by adding entirely new motivations.) However, the activity cannot simulate the potential for an agent to come to have a new motivation through deliberation because we are freezing the set for the game. So the unstaged feature is the dynamic aspect of the motivational set under sound deliberation.

  Last line:
  \unstaged{the dynamic extension of the motivational set through deliberation without adding new elements}
answer: |-
  ### **Reasons and Motives Activity: Internalism Immersion**  
  *Runnable in 90 minutes with minimal prep. Core mechanic: The rules enforce Williams' internalism—reasons must connect to the agent's actual motivations. No "internal/external" terms used until debrief.*

  ---

  ### **Materials**  
  - **Motivational Set Cards**: Pre-print 14 sets (one per student) of 4–5 index cards. Each card states a desire/project/commitment (e.g., "You want to finish your boat," "You’d rather be disliked than pitied," "You avoid owing favors").  
    - *Include 3 "problematic sets"* for injection:  
      1. **Future-Indifferent**: "You care only about today," "You dismiss future consequences," "You seek immediate pleasure."  
      2. **No-Sociality**: "You feel no need to be liked," "You have zero concern for others’ well-being," "You prioritize total self-sufficiency."  
      3. **Conditional-Desires**: "You only value things if you’re alive (e.g., ‘Finish my book’—but only if alive)," "You feel no fear of death."  
  - **Whiteboard**: Track "successful citations" (tally marks) to add light tension.  
  - **Timer**: Keep turns strict.  

  ---

  ### **Setup (10 min)**  
  1. **Distribute Cards**: Shuffle and deal one set face-down to each student. They peek at their cards but keep them hidden.  
  2. **Rules Brief**:  
     - "You’ll give each other reasons to act. But your reasons must *work*—they must connect to the person’s actual motivations. No guessing what ‘anyone’ would want; use only their cards."  
     - **Two Key Rules**:  
       - To cite a reason: *"[Name], you have a reason to [action] because..."* and trace a path from their cards.  
       - The target can challenge: *"I remain unmoved—[state flaw]."* Flaws: false belief, skipped step, wishful thinking, or motivation not in set.  
     - If challenged successfully, citation fails, and the citer’s turn ends.  

  ---

  ### **Gameplay (45 min)**  
  - **Turn Order**: Use a speaking token (e.g., a whiteboard marker) passed clockwise. 2 min per turn max.  
  - **On Your Turn**:  
    - **Option 1**: Cite a reason to one player (e.g., "Alex, you have a reason to skip class today because...").  
      - Cite an action tied to **real-world scenarios** (e.g., "apologize," "study longer," "take a risk").  
      - **Defend Your Route**: Explain step-by-step how the action links to the target’s cards.  
    - **Option 2**: Pass (no penalty).  
  - **Target’s Response**:  
    - Accept the route → Citation succeeds. Add a tally to the whiteboard.  
    - Challenge → Cite a flaw (see rules). If valid, citer "burns" their turn.  
  - **Inject Problematic Cases (20 min in)**:  
    - Pause gameplay. Replace 3 volunteers’ cards with the **problematic sets**. Announce: "New motivations are in play—same rules."  
    - Introduce **morally loaded actions** for these players:  
      - To Future-Indifferent: *"Take the pill that prevents tomorrow’s agony."*  
      - To No-Sociality: *"Give your seat to someone in pain."*  
      - To Conditional-Desires: *"Take the life-saving pill."*  
    - **Goal**: Force the group to confront "unmovable" agents. They must either break rules (e.g., invent motivations) or accept failure.  

  ---

  ### **Debrief (35 min)**  
  - **Part 1: Experience (10 min)**:  
    - "What felt easy? Frustrating? When did you hit a wall?"  
    - "How did it feel to be ‘unmoved’ or to fail a citation?"  
  - **Part 2: Connect to Williams (20 min)**:  
    - **Rules = Internalism**: "The game forced you to tie reasons to *actual motivations*—that’s Williams’ internalism. A reason must be able to motivate the agent."  
    - **Key Moments**:  
      - *Successful citation*: "This is the internalist core—reasons are grounded in the agent’s set."  
      - *Stretched route*: "When you said, ‘If they just thought harder...’—that’s wishful thinking. Internalism bans this."  
      - *Problematic cases*: "You knew they ‘should’ act, but couldn’t trace a route. That frustration? That’s the *externalist temptation*—wanting reasons outside the agent’s set."  
      - *Blame*: "Did you blame the unmoved agent? Internalism says they’re not irrational—they have no reason. But we still judge. Why?"  
  - **Part 3: Big Picture (5 min)**:  
    - "Williams’ point: If there’s no sound route from the agent’s set, there’s no reason for them. Externalists disagree. Where do you stand now?"  

  ---

  ### **Predictable Problems & Fixes**  
  - **"Too many passes!"**: Students hesitate to cite. *Fix*: Start with an example. You (TA) cite a reason to a student: "Sam, you have a reason to practice piano—because your card says ‘You want to impress your mentor,’ and practice achieves that."  
  - **"Targets are too nice"**: Players accept weak routes. *Fix*: Remind them: "Your job is to enforce the rules—challenge if the route is shaky."  
  - **"Overly creative routes"**: Students rationalize (e.g., "If they cared about X, they’d want Y"). *Fix*: Intervene: "No skipping steps—show the exact link."  
  - **Time crunch**: Gameplay runs long. *Fix*: After 35 min, skip to debrief. Focus on the problematic cases.  

  ---

  ### **Unstaged Feature**  
  The activity simplifies the motivational set as static cards. In reality, Williams allows for *deliberative refinement*—agents can discover new connections within their existing set (e.g., via reflection). This nuance (e.g., "Does ‘finish my book’ imply ‘stay alive’?") isn’t fully staged. Highlight this in debrief: "The cards froze your set, but real agents can deepen their understanding—though Williams argues this doesn’t add new elements."  

  \unstaged{deliberative refinement of existing motivations}
