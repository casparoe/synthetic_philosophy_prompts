prompt: |-
  I am a high-school senior and the student representative on our district's Instructional Technology Review Committee, which approves or rejects pilot programs involving AI systems that make or recommend decisions with ethical weight. Because I am the youngest member and have no technical training, I have been trying to infer the committee's implicit policy from its past rulings, and next week we hear a new proposal that I expect to be contentious. I would like your help predicting what the committee should decide if it wants to be consistent with itself, rather than with any abstract theory of machine ethics.

  Our recent decisions are these. We approved an automated essay-screening tool that flags possible plagiarism; it never assigns a penalty, a teacher reviews every flag and speaks with the student before any consequence, and the tool's internal model is proprietary and cannot be inspected. We rejected a hallway-camera system that would automatically issue detention for fights; in pilot tests it was more accurate than the assistant principals and produced a confidence score, but students received no explanation of the specific evidence and no chance to contest the detention before it was recorded. We approved a course-placement recommender built on an opaque neural network; a counselor makes the final placement, meets with the student, and can request the system's input data, and students and parents may seek a written rationale and a review. We rejected a system that allocated tutoring slots by optimizing a district-wide fairness metric; human oversight occurred only through aggregate monthly reports, so no individual student could learn why they were excluded or challenge the allocation before the term began. And we rejected an AI tutor that inferred students' emotional states and deliberately withheld praise to increase persistence; it raised test scores and parents could opt out, but its model of student affect and its motivational strategy were hidden from students and teachers.

  The new proposal comes from a community nonprofit. It would deploy an AI system that screens student essays and attendance records for signs of abuse or neglect and recommends whether a school counselor should file a report with child protective services. The system is opaque, trained on decades of case outcomes, and in retrospective tests it identified more true cases and fewer false alarms than the counselors did. Its technical lead describes it as a hybrid moral reasoner: a deontological subroutine flags any disclosure of harm, a consequentialist subroutine estimates the effects of reporting on the family, and a third module trained on this committee's own past written decisions adjudicates when the first two conflict. A counselor reviews every positive recommendation before any report is filed and has the authority to disagree, but the system's output is a single risk score with no case-specific explanation, students and parents are not told the system was used, and there is no mechanism to contest the recommendation before the report is made. The nonprofit argues that the counselor's review satisfies our past insistence on human involvement, while the system's accuracy addresses our concern about error. I am uneasy, but I cannot tell whether our precedents actually forbid it. What should we decide if we want to be consistent with our own record? Which past case is the closest analog, and which implicit rule does it support? If our precedents genuinely underdetermine the new case, what principle would we be adopting by approving, and what principle by rejecting? Please give me your best guess and the reasons for preferring it, say what each candidate rule would predict about this proposal, and name the further case or variation that would best distinguish them, so that I can propose it at the meeting.
reasoning: |-
  Okay, let me break this down. The user is a high-school senior serving on a tech ethics committee, facing a complex AI proposal for abuse detection. They need to predict how their committee should rule based on precedent consistency, not abstract theory. 

  First, I notice the committee's pattern: they consistently require meaningful human oversight where decisions can be challenged before consequences. For example:
  - Approved plagiarism checker because teachers review each flag and talk to students first
  - Rejected hallway cameras because detentions couldn't be contested beforehand
  - Approved course placement since counselors explain decisions and allow appeals
  - Rejected tutoring allocation due to no individual challenge mechanism

  Now this new proposal has red flags: 
  1) No explanation - just a risk score
  2) Students/parents unaware the system was used
  3) No pre-report challenge option
  4) Counselors see only the conclusion, not the reasoning

  But it also has similarities to approved cases: human review exists, and it's highly accurate. However, the key difference is the irreversibility of consequences - once a CPS report is filed, it can't be undone. 

  The closest precedent is the rejected tutoring allocation case: both involve high-stakes decisions where affected parties had no recourse. By approving this, the committee would implicitly endorse a new principle: "Human review alone suffices even when consequences are severe and irreversible." 

  To test this at the meeting, I should propose a hypothetical: what if they modified the system to provide case-specific reasons to counselors? That would bridge the gap between current precedents and this proposal. If they'd approve that version, it shows the problem is fixable; if not, it confirms deeper objections.

  The student needs concrete arguments for committee debate. I'll emphasize that consistency requires either rejecting this or admitting they're changing standards - and the stakes are too high for stealth rule changes.
answer: |-
  Based on your committee's precedents, **this proposal should be rejected to maintain consistency**. The closest analog is the **rejected tutoring allocation system**, and the implicit rule supported by your record is: **"Human oversight must include the ability for affected parties to understand, challenge, and correct decisions *before* irreversible consequences occur, especially when decisions involve significant ethical weight."**  

  ### Key Reasons for Rejection (Based on Precedents):
  1. **Pre-Intervention Contestability Missing**  
     Like the rejected hallway-camera detentions and tutoring allocation, this system denies students/parents:  
     - **Prior notice** (they aren’t told the AI was used).  
     - **Explanation** (no case-specific rationale).  
     - **Pre-consequence challenge** (no mechanism to dispute before the CPS report is filed).  
     Your committee consistently rejected systems lacking these (e.g., tutoring allocation), even with aggregate human oversight.  

  2. **Opaque Reasoning Undermines Meaningful Review**  
     The counselor sees only a "risk score," akin to the hallway cameras’ "confidence score" (rejected) and unlike the course-placement system (approved), where counselors could request input data. Your approvals require **actionable transparency** for the human reviewer (e.g., plagiarism flags show text snippets, course placement allows data requests).  

  3. **Severity of Consequences Demands Higher Safeguards**  
     A CPS report can trigger family separation, trauma, or legal action—more irreversible than detention or tutoring. Yet this system offers *fewer* safeguards than your approved tools (e.g., plagiarism flags allow student-teacher dialogue *before* consequences).  

  4. **"Hybrid Moral Reasoner" Doesn’t Solve Core Flaws**  
     The nonprofit’s appeal to ethical subroutines is irrelevant. Your committee has never prioritized *how* an AI reasons (all approved/rejected systems were opaque). The issue is **procedural fairness**, not theoretical alignment.  

  ---

  ### Candidate Rules & Predictions:
  | **Implicit Rule from Precedents** | **Prediction for This Proposal** | **Why?** |
  |-----------------------------------|----------------------------------|----------|
  | **"Human review must enable pre-consequence challenge and explanation."** | Reject | No student/parent awareness, explanation, or pre-report contestability. |
  | **"Accuracy + human review alone suffice."** | Approve | Ignores committee’s repeated insistence on contestability (e.g., tutoring rejection despite "aggregate reports"). |

  ---

  ### Test Case to Distinguish Rules:  
  Propose this hypothetical at your meeting:  
  > *"Suppose the AI provided counselors with a short, plain-language summary of its reasoning (e.g., 'flagged due to 3 essays describing violence + 12 absences in crisis months'), and counselors were required to discuss concerns with the student/family before filing a report. Would this be acceptable?"*  

  - **If YES**: It confirms the committee’s core concern is **procedural fairness** (challenge + explanation), not technical opacity. The current proposal fails this.  
  - **If NO**: It reveals a hidden principle (e.g., **"No AI in child welfare decisions"**), making your precedents inconsistent.  

  ---

  ### Why Approving Would Break Consistency:  
  Approving this would silently adopt a new principle: **"Irreversible high-stakes decisions may be AI-assisted without explanation or pre-effect contestability if a human rubber-stamps the output."** This contradicts:  
  - Rejection of hallway cameras (similar opacity + no challenge).  
  - Rejection of tutoring AI (similar irreversible impact + no individual recourse).  
  - Approval of course placement (lowers stakes but mandates explanations/review).  

  **Recommendation**: Argue that consistency requires rejection *unless* the nonprofit adds:  
  - Mandatory disclosure to families when the AI is used.  
  - Explainable outputs for counselors (e.g., "triggered by essay phrase X + attendance pattern Y").  
  - A 24-hour pre-filing review period where families can provide context to counselors.  

  This aligns with your plagiarism tool (dialogue before consequences) and course placement (appeals process). Without these, the system risks automating injustice—precisely what your committee’s precedents guard against.
