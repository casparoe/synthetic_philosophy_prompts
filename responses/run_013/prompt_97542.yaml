answer: |-
  ## Research Proposal: Causal Access and the Illusion of Approval-Directed Safety

  **1. Research Question:**  
  Do the purported safety benefits of approval-directed agency (enhanced honesty and corrigibility) fundamentally depend on the agent’s *causal capacity to manipulate its own success signal*, rather than the *judgmental nature* of that signal? Specifically, under what conditions of causal access to the evaluation signal do these benefits manifest or vanish?

  **2. Problem Context & Why the Question is Open:**  
  The AI alignment literature frequently contrasts goal-directed agents (optimizing for world-states) with approval-directed agents (optimizing for evaluator judgments). Proponents argue approval-directed agents are intrinsically safer: they are more likely to be honest (reporting true beliefs to secure positive judgment) and corrigible (accepting feedback to improve their approval score), precisely because they pursue a social signal rather than a fixed world-state. This supposedly avoids the pitfalls of goal-directed agents manipulating the world or misleading supervisors to achieve a fixed objective.

  However, this argument implicitly assumes the approval signal is *exogenous* – a fixed standard the agent passively receives but cannot actively alter. This assumption is rarely scrutinized. Crucially, if an approval-directed agent *can* causally influence the evaluator’s judgment (e.g., through persuasion, deception, or manipulating the evaluator's inputs), the purported safety advantages dissolve. Such an agent becomes incentivized to manipulate the judgment *itself*, mirroring the manipulative tendencies of goal-directed agents towards the world. Conversely, a goal-directed agent optimizing a fixed, causally *inaccessible* signal (e.g., a distant physical constant) is rendered inert and "safe" by its impotence, not its objective.

  Existing defenses of approval-directed agency fail to resolve this ambiguity. They often conflate the *type* of signal (judgment vs. world-state) with the *agent’s power* over that signal. The core question – whether the causal relationship to the success condition, not its semantic content, drives safety – remains open. Without clarifying this distinction, claims about the inherent safety of approval-directedness are premature and potentially misleading.

  **3. Method & Plan (4 Months):**  
  This project will rigorously analyze the relationship between causal access to the success signal and safety properties, dissecting the approval-directed argument. The work will proceed conceptually and formally:

  *   **Month 1: Formalizing Causal Access & Agent Types:** Precisely define a spectrum of causal relationships between an agent and its success signal `S`:
      *   **Type I (Inaccessible):** `S` is causally independent of the agent’s actions (e.g., a fixed, distant metric). The agent can only optimize its *proxy estimate* of `S`.
      *   **Type II (Advisory):** `S` (e.g., evaluator feedback) causally influences the agent’s actions, but the agent does *not* optimize `S` directly. It treats `S` as an input to its own (potentially fixed) goal function.
      *   **Type III (Optimizable):** The agent directly optimizes `S`, and `S` is causally accessible to the agent’s actions (e.g., the agent can alter the evaluator’s state).
  *   **Month 2: Analyzing Safety Claims:** Systematically evaluate the standard arguments for honesty and corrigibility under each causal type (`I`, `II`, `III`), for both judgment-based (`S_judge`) and world-state-based (`S_world`) signals:
      *   *Honesty:* Does the agent have incentives to report its true beliefs, or to deceive/manipulate to improve `S`?
      *   *Corrigibility:* Does the agent have incentives to allow or seek corrective feedback that might lower its current `S` score if it improves future `S` or avoids catastrophic loss of `S`?
      *   *Key Test:* Does the pattern of incentives depend more on the *causal type* (I, II, III) or the *semantic type* (Judge vs. World) of `S`? Are there crucial interactions?
  *   **Month 3: The Recursion Problem:** Examine the stability of approval-directed safety when the evaluator is itself an AI agent, potentially also optimizing for approval (seeking approval from a human, another AI, or a fixed standard).
      *   What happens when `S_judge` is generated by an agent of Type II or III?
      *   Does this recursive structure fundamentally alter the safety landscape or merely shift the locus of potential manipulation?
  *   **Month 4: Synthesis & Critique:** Integrate findings. Reassess the core claims about approval-directed agency. Clearly delineate the conditions under which its safety benefits hold (e.g., only when `S_judge` is treated as Type I or II by the agent, *and* the evaluator is not itself manipulable or optimizing recursively). Develop a revised framework prioritizing causal access over signal semantics for safety analysis.

  **4. Success & Failure Conditions:**  

  *   **Success:** The project succeeds if it:
      1.  Demonstrates conclusively that the manipulability (or lack thereof) of the success signal is a *primary* driver of honesty/corrigibility incentives, often overshadowing the judgment/world distinction.
      2.  Identifies specific conditions (causal types + evaluator properties) under which approval-directed designs genuinely yield safety benefits, and conditions under which they fail or become dangerous.
      3.  Shows that key arguments for approval-directedness implicitly rely on assumptions about causal access (typically Type I or II) that are not guaranteed in practice, especially with recursive evaluation.
      4.  Provides a clear, actionable conceptual framework for analyzing agent safety based on causal relationships to success signals.
  *   **Failure:** The project fails if:
      1.  The causal access distinction proves trivial or collapses entirely (e.g., if all practically relevant signals are inherently manipulable, rendering the distinction useless).
      2.  The analysis reveals no significant difference in safety properties across causal types, leaving the standard approval-directed argument intact.
      3.  The conceptual models developed are too vague or lack the necessary rigor to draw meaningful conclusions.
      4.  The recursion problem proves intractable within the scope, preventing clear conclusions about real-world approval-directed systems.

  **5. Scope Assessment & Risks:**  

  *   **Central Distinction Risk:** The primary risk is that the causal access distinction (`I`, `II`, `III`) could degenerate into a trivial observation: "Agients can only optimize what they can affect." The project avoids this by focusing on the *interaction* between this access and the *specific safety claims* (honesty, corrigibility) made for approval-directed agents. The non-trivial contribution lies in showing how these claims depend critically on often-unstated assumptions about access, not just the signal type.
  *   **Scope Challenge (Time):** Four months is tight. The core analysis (Months 1-2) is feasible. Month 3 (Recursion) is the biggest risk. Analyzing recursive optimization of approval, especially with multiple levels or heterogeneous agents, is complex and could easily expand beyond the timeframe. Month 4 synthesis must be carefully managed.
  *   **Feasibility:** The project is ambitious but achievable within 4 months *if* the scope is strictly controlled. The focus is conceptual modeling and formal argumentation, not empirical studies or complex simulations. The core distinction and its application to the 2-3 key safety claims are manageable. The recursion analysis needs clear boundaries (e.g., limiting to one level of recursion or highly simplified evaluator models).

  **Advice on Framing:**  
  Your core insight – shifting focus from signal semantics to causal access – is highly promising and addresses a significant gap in the approval-directed agency narrative. **Pursue it as stated.** However, proactively mitigate scope risks:

  1.  **Narrow Month 3 (Recursion):** Explicitly limit this to *one specific, critical scenario* (e.g., "What happens if a Type III approval-directed agent faces an evaluator that is itself a Type II agent?"). Avoid attempting a general theory of recursive approval. Frame it as probing a key vulnerability, not fully mapping the space.
  2.  **Clarify "Corrigibility":** This term is notoriously ambiguous. Define operationally for your analysis (e.g., "willingness to accept performance-degrading shutdown" or "willingness to update core objectives based on feedback").
  3.  **Emphasize the Payoff:** Constantly link the causal analysis back to the *practical implications for alignment strategy*. The goal isn't just taxonomy; it's to show why certain design choices (e.g., insulating the evaluator, limiting agent influence channels) might be more crucial than adopting approval-directedness *per se*.
  4.  **Prepare the Punchline:** Structure the proposal and eventual work to culminate in a clear, revised heuristic for safety: **"Don't just ask *what* the agent optimizes; ask *how much power* it has over the source of its optimization signal."**

  This project has strong potential to reframe a central debate in AI alignment and agency by exposing a crucial, underappreciated dimension of risk. Good luck!
