answer: |-
  The damp stone of the workshop breathed its usual chill, but Elias felt the heat prickling under his collar. Master Willem’s commission – the whole Psalter for the Bishop’s nephew – lay like a physical weight on the long bench. Months of work, meticulous, back-breaking, hung on this single sheet of scraped vellum held between Elias’s stained fingers. On it, cut by young Tomas, was an 'a'.

  Tomas stood rigid, knuckles white where he gripped the edge of his own workbench. His eyes, wide and dark in the flickering lamplight, never left the shape in Elias’s hand. The silence was thick, broken only by the distant drip of water from the eaves and the nervous tap-tap of Elias’s own worn fingernail on the vellum.

  It was, in isolation, an ugly thing. Elias’s own rule, hammered into every apprentice, was simple: one sheet, one uncut line, no islands. The bowl of the 'a' – the rounded belly where ink would pool – needed to be anchored to the spine. Tomas had obeyed. He’d cut a single, unbroken path: down the spine, a sharp curve for the bowl, then up and over, forming the top, then plunging down again to form the… strut. That was the problem. The strut.

  Where it should have met the spine cleanly, just below the bowl’s apex, Tomas had let it plunge deeper, almost halfway down the spine’s length. Worse, the curve where the strut joined the bowl wasn’t smooth; it kinked, like a bent reed. The result was a strut that seemed to spear *through* the bowl, not support it. The space inside the bowl looked pinched, unnatural. Alone, on the scrap, it resembled a broken pot pierced by a stake.

  "Explain it, Tomas," Elias said, his voice rougher than he intended. He kept his eyes on the cut shape, tracing its path with his fingertip. Cold. Precise. But wrong.

  Tomas swallowed. "Master Elias… the 'n'. And the 'e'. They… they crowd it. With the standard strut, the space gets choked. Here," he fumbled, grabbing a wax tablet smeared with charcoal dust. His fingers trembled as he sketched a clumsy 'n' and then his 'a' beside it. "See? The top of the 'n' leans in. With the shallow strut, the 'a' bowl gets squeezed. But with this deeper one," he drew the 'a' again, that awkward kink prominent, "it pushes back. Makes a… a space." He jabbed at the gap between the 'n' and the deeper strut. "And the 'e'…" He sketched the looping form. "The eye of the 'e' pulls away. With the deep strut, the bottom of the 'a'… it echoes? Mirrors? It holds its ground."

  Elias studied the charcoal smudges. It was crude, but the boy wasn't wrong about the crowding. He walked to the light-frame where the first test sheets for the Psalter hung. He picked up a sheet where the word "cape" was inked. The standard 'a' he’d used for years – neat, shallow strut – looked… flimsy next to the robust 'c' and the open arms of the 'p'. The space after the 'a' felt weak, a gap rather than a pause. He imagined Tomas’s 'a' in its place. That deeper strut would push into the space, make a definite shape. But would it read? Or just look like a spike?

  He pulled another sheet: "cart". The 'a' sat between the 'c' and the 'r'. The 'r' had a strong, straight leg. With the standard 'a', the rhythm flowed. He pictured the kinked strut of Tomas’s 'a' jutting towards the 'r’s' leg. Would they clash? Or lock together, forming a dark knot? He couldn't see it clearly. That was the torment. A letter wasn't just itself; it was the space it stole, the shape it denied its neighbors, the beat it set in a line.

  He remembered his own niece, barely able to hold a chalk, scribbling loops and sticks. He’d seen her draw an 'a' that was nothing but a circle with a line dangling off the top like a broken handle. He’d known it was an 'a' instantly. Context. The word "cat" above a crude drawing of their tabby. But this wasn't childish scrawl. This was the Bishop’s Psalter. Precision mattered. Legibility mattered. Elegance mattered. Master Willem’s sharp eye mattered most of all.

  Elias returned to the bench. He laid Tomas’s cut 'a' on a clean sheet of paper. With a sharpened charcoal stick, he carefully drew Tomas’s exact shape: the spine, the kinked junction, the deep strut. Then, slowly, deliberately, he drew an 'n' beside it. Then an 'e'. He filled the bowl with charcoal dust to see the solid form. It looked like a fat worm impaled on a thorn. He blew the dust away.

  He tried it with an 'o'. The 'o' was a perfect, unbroken circle. Placing it next to Tomas’s 'a' made the 'a' look deformed, its bowl a collapsed mimicry. But then he drew a 'd'. His workshop 'd' had a tall, straight back. Next to it, Tomas’s 'a', with its deep strut reaching down, suddenly looked grounded, solid. The 'd' soared; the 'a' held firm. The rhythm changed. It wasn't ugly; it was… different. Purposeful?

  He looked at Tomas. The boy hadn't moved. His face was pale, etched with a terrible hope. Elias knew the stakes. Tomas was the youngest, least experienced. This commission was his chance to step beyond mere copying. The Bishop’s nephew was known as a discerning man, impatient with flaws. Reject this 'a', force Tomas back to the standard cut, and the boy’s confidence, his nascent style, might shatter. Accept it, and if Willem found it awkward, if it slowed the reader’s eye even for a heartbeat in the sacred text, the blame would fall squarely on Elias. The commission itself could be jeopardized. Months of work, the workshop’s reputation, Tomas’s future… it balanced on this single, kinked line.

  Elias picked up his finest knife, the blade honed to a whisper’s edge. He could trim the strut, make it shallower, neater. Fix it. Make it safe. He held the tip near the offending kink. He imagined the cut: a small slice, shaving the vellum to smooth the curve, shorten the strut’s plunge. It would be close to the standard form. Legible. Unobjectionable.

  But then he saw the words again, not static, but flowing: *cape*, *cart*, *date*, *dare*. He saw the standard 'a' yielding space, sometimes gracefully, sometimes weakly. He saw Tomas’s 'a', stubborn, occupying its territory, forcing a rhythm with that deep strut. Would it grate? Or would it sing a slightly different, stronger tune? Would readers stumble, or would their eyes simply accept it as the shape that wasn't 'o', wasn't 'e', wasn't 'd'? He thought of the niece’s lopsided circle with the stick – instantly 'a' in the context of "cat". But this needed to be 'a' everywhere, always, effortlessly. Could this shape carry that burden?

  His hand hovered. He looked from the knife to the cut shape, then to the charcoal test with the 'd' holding firm beside the deep strut. He looked at Tomas, whose breath seemed to have stopped. The lamplight caught the sweat on the boy’s upper lip. Elias lowered the knife. He didn’t cut. He didn't smooth the kink or shorten the strut. He laid the knife down beside the vellum shape. He picked it up, the stiff vellum cool against his skin, and held it out towards Tomas.

  "Set it," Elias said, the words feeling heavy but final. "Set it in the next quire. 'Cape'. 'Dare'. 'Father'. Let’s see it stand." He didn’t say it was right. He didn’t say it was good. He just committed it to the company of its neighbors, to the flow of words, to the judgment of ink and parchment and, ultimately, Master Willem’s critical eye. The shape remained, with its deep plunge and its awkward kink, a question mark cut in vellum, its true nature waiting to be revealed not in isolation, but in the crowded, contrasting choir of the page. The proof, Elias knew, bitter and uncertain, would be in the praying.
