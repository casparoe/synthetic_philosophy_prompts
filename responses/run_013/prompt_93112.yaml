  **MEMORANDUM**  
  To: Riverbend High School Board of Directors  
  From: [Student Name], Philosophy Club, Ethics Subcommittee  
  Subject: **Proposal for Revised Pest Management Protocol Based on Expected Welfare Optimization**  
  Date: October 26, 2023  

  **1. BACKGROUND**  
  Riverbend High School currently maintains a comprehensive pest management contract addressing several recurring issues: termite infestations in the gymnasium substructure, fly proliferation in cafeteria waste disposal areas, mosquito swarms over athletic fields during evening events, and the operation of electric insect zappers in outdoor common areas. Annual contractor reports indicate these measures eliminate approximately one billion (1,000,000,000) individual insects across all species annually. While effective for maintaining hygiene and student comfort, current practices require ethical reassessment under a rigorous expected-value framework.  

  **2. ETHICAL FRAMEWORK**  
  We propose evaluating all pest management decisions through the lens of *expected welfare impact*. This model quantifies moral cost as follows:  

  > **Expected Welfare Cost** = (Probability of Sentience) × (Number of Beings Affected) × (Welfare Change per Being)  

  Where:  
  - *Probability of Sentience (P_s)* represents the likelihood that a given insect possesses morally relevant subjective experience (e.g., capacity for suffering).  
  - *Welfare Change (ΔW)* is measured in standardized welfare points (WP).  

  Critically, the multiplicative effect of population size necessitates that even vanishingly small values of *P_s* generate substantial expected costs when *n* (affected individuals) is sufficiently large.  

  **3. ANALYSIS OF CURRENT PRACTICES**  
  Applying this framework to Riverbend’s operations, using conservative parameters (see Appendix A for derivations):  

  *   **Termite Eradication (Gymnasium):**  
      Annual extermination affects ~700 million termites. While termites exhibit collective behaviors suggesting colonial integration, we conservatively treat each termite as one individual unit for welfare accounting. Assuming *P_s* = 0.001 and ΔW = -1 WP per death (total welfare loss), the expected cost is **700,000 WP**. Structural damage prevention yields an estimated benefit of 50 WP (averting disruption to 500 students valued at 0.1 WP each). **Net Expected Welfare Impact: -699,950 WP.**  

  *   **Fly Control (Cafeteria):**  
      ~250 million flies eliminated annually. *P_s* = 0.001, ΔW = -1 WP per death. Expected cost: **250,000 WP**. Benefits (averted contamination, minor nuisance reduction) estimated at 20 WP (0.04 WP per student). **Net Impact: -249,980 WP.**  

  *   **Mosquito Mitigation (Athletic Fields):**  
      ~50 million mosquitoes eliminated. *P_s* = 0.001, ΔW = -1 WP per death. Expected cost: **50,000 WP**. Benefits (averted bites, potential disease reduction) highly valued at 100 WP (0.2 WP per student). **Net Impact: -49,900 WP.**  

  *   **Electric Zappers:**  
      ~1 million insects of mixed species eliminated. *P_s* = 0.001, ΔW = -1 WP per death. Expected cost: **1,000 WP**. Benefits (aesthetic improvement, minor nuisance reduction) estimated at 5 WP. **Net Impact: -995 WP.**  

  **4. KEY OBSERVATIONS**  
  4.1. **Scale Dominance:** In all cases, the expected welfare cost to insects exceeds the expected benefit to students by 3-4 orders of magnitude. This discrepancy arises from the vast numerical imbalance (10^9 insects vs. 10^2 students) overwhelming the low *P_s*.  
  4.2. **Robustness to Uncertainty:** Reducing *P_s* to 0.00000001 (1 in 100 million) still yields expected insect costs exceeding human benefits for termites (7,000 WP vs. 50 WP) and flies (2,500 WP vs. 20 WP). The conclusion is remarkably insensitive to plausible downward revisions of *P_s*.  
  4.3. **Welfare Unit Definition:** While complexities exist (e.g., is a termite colony one "being"? Does swatting a fly equate to crushing a termite?), our analysis uses maximally conservative, individual-based accounting. Adopting colony-based units would *increase* the cost discrepancy further.  

  **5. RECOMMENDATIONS**  
  Given the overwhelming expected welfare deficit generated by current practices, immediate cessation of all insect eradication measures is imperative. We propose:  

  1.  **Termite Management:** Cease chemical treatments. Gymnasium structural integrity concerns are secondary to the catastrophic expected welfare cost. Monitor for critical failure; if imminent, relocate activities.  
  2.  **Fly & Mosquito Control:** Discontinue all chemical and mechanical elimination in cafeteria and athletic areas. Install non-lethal deterrents (fans, nets) where feasible. Accept increased insect presence as a necessary consequence of ethical consistency.  
  3.  **Electric Zappers:** Decommission immediately. Their minimal benefit cannot justify their cost.  
  4.  **Resource Reallocation:** Redirect the annual pest control budget ($12,000) towards establishing an Insect Welfare Oversight Committee and developing student educational modules on minimizing unintentional arthropod harm during daily activities (e.g., mindful walking).  
  5.  **Curriculum Adjustment:** Dedicate one instructional hour per week across all grades to supervised habitat restoration projects on school grounds, explicitly prioritizing arthropod flourishing.  

  This protocol prioritizes expected welfare optimization, acknowledging that while the subjective experience of insects remains uncertain, the scale of potential harm demands the utmost precaution.  

  **6. CONCLUSION**  
  The ethical mathematics are unambiguous. Failure to adopt these recommendations constitutes acceptance of profound, quantifiable expected suffering vastly outweighing the minor conveniences afforded to the student body. We urge the Board to implement this revised protocol at the start of the next fiscal quarter.  

  Respectfully submitted,  
  [Student Name]  
  Philosophy Club, Ethics Subcommittee  

  ---

  **APPENDIX A: WELFARE POINT CALCULATIONS**  

  *   **Student Welfare Baseline:**  
      500 students. Assign each student's *aggregate annual pest-related interests* (comfort, health, convenience) a value of **1 Welfare Point (WP) total per student**.  
      *Total Annual Student Welfare Stake (S_Total):* 500 students × 1 WP = **500 WP**.  

  *   **Insect Welfare Parameters:**  
      *   Total Insects Eliminated Annually (*n*): **1,000,000,000**  
      *   Probability of Sentience (*P_s*): **0.001** (1/1000)  
      *   Welfare Change per Insect Death (*ΔW*): **-1 WP** (Assumption: Death represents total welfare loss)  

  *   **Expected Annual Welfare Cost to Insects (*C_I*):**  
      C_I = *P_s* × *n* × *ΔW* = 0.001 × 1,000,000,000 × (-1) = **-1,000,000 WP**  

  *   **Net Expected Welfare Impact of Current Program:**  
      Net = (Benefits to Students) + (Cost to Insects)  
      = (*S_Total* from averted pests) + (*C_I*)  
      = **500 WP** + (**-1,000,000 WP**) = **-999,500 WP**  

  *   **Sensitivity Analysis (Lower *P_s*):**  
      *   If *P_s* = **0.00000001** (1/100,000,000):  
          C_I = 0.00000001 × 1,000,000,000 × (-1) = **-10 WP**  
          Net = 500 WP + (-10 WP) = **490 WP** (Positive but marginal)  
      *   *However*, this requires attributing *all* student benefits to pest control (overstated) and ignores concentration: Termites alone (*n*=700,000,000) yield C_I = -7 WP, exceeding most individual practice benefits. Maintaining *any* large-scale eradication likely remains net negative.
