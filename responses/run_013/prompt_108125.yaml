prompt: |-
  I recently took a job at a small development charity, I write grant applications and evidence summaries, and the more I look at what we actually do the less it hangs together. Officially we're institutionalists: the whole pitch to donors is that poverty is caused by bad institutions, that geography and culture are mostly excuses, so we fund rule-of-law projects, anti-corruption work, property rights. But the actual grantmaking runs on RCTs — cash transfers, deworming, bednets — and whenever I ask whether one of the governance projects actually worked, the answer is some version of "you can't randomize a legal system." So what are we presupposing here? That there are two separate kinds of causal claim, local and macro, one of which gets tested and the other of which is just known? That "institutions" and "geography" are distinct additive factors rather than the same thing counted twice (bad geography produces bad institutions produces...)? And what about the standard move of instrumenting a country's institutions today with its colonial settler mortality — does using history that way presuppose that history is basically a natural experiment we can read off like a trial, and if so does that survive the complaints I keep hearing that the instrument is broken anyway? Please take the practice apart: what view of causation, of evidence, and of what a "fundamental cause" is does it commit us to, which rival views does it quietly rule out, and what's the strongest thing an anti-institutionalist — or someone who thinks we simply can't know why some nations are rich — could say we're smuggling in? Also, honestly: is the split between our donors' theory and our grantmaking actually incoherent, or can you hold both without contradiction? I'd like to know what's strictly presupposed versus what we could drop without changing anything we do.
reasoning: |-
  Okay, let me unpack this user's query. They work at a development charity that pitches institutionalist theories to donors—claiming poverty stems from bad institutions, not geography or culture. But their actual grantmaking relies on RCTs for interventions like cash transfers or bednets. The user is noticing a disconnect: governance projects aren't evaluated with RCTs because "you can't randomize a legal system," while smaller-scale projects are. 

  First, I need to understand the core tension. The charity's theory is macro-level (institutions as fundamental causes), but their evidence comes from micro-level RCTs. The user is questioning whether these two approaches are compatible. They're also skeptical about the colonial settler mortality instrument used in institutional economics, mentioning critiques that the instrument is flawed.

  The user raises several philosophical and methodological points. They want to know what causal model the charity presupposes, how evidence fits in, and whether the split between theory and practice is coherent. They're also asking about alternatives they might be ignoring and what could be changed without disrupting operations.

  I should break this down systematically. Start with the causal models: institutionalism vs. RCT-based approaches. Institutionalism sees institutions as fundamental, deep causes that shape outcomes. RCTs focus on proximate, measurable interventions. The charity seems to treat these as complementary—macro theory guides overall strategy, micro evidence validates specific tools. But is that logically consistent?

  On evidence hierarchies, RCTs are gold standard for micro interventions, but macro claims rely on natural experiments or instrumental variables. The settler mortality instrument is a key example. It assumes colonial history acts as a natural experiment, assigning institutions randomly. But critics argue settler mortality wasn't random—it correlated with geography/disease, and institutional outcomes were complex. If the instrument is weak, it undermines the macro theory's evidence base.

  The user also hints at geography vs. institutions. What if bad geography causes bad institutions? The charity's model treats them as separate, but they might be intertwined. Plus, by focusing only on tractable micro projects, they might be avoiding hard questions about institutional change.

  For the anti-institutionalist view, someone like Jeffrey Sachs would emphasize geography's role. Others might argue that fundamental causes are unknowable due to complex historical paths. The charity might be smuggling in a technocratic bias—prioritizing measurable interventions over structural change.

  On coherence: the split isn't necessarily contradictory if seen as a division of labor. But there's a risk of mission drift. If donors fund based on institutional theory, but money goes to RCT-friendly projects, are they misleading donors? Or is this just pragmatic adaptation?

  The user wants to know what's essential. The institutionalist pitch to donors seems crucial for funding, even if operations focus on what's testable. They could drop the strong institutional fundamentalism without changing practices, but that might affect donor relations. The settler mortality instrument is a vulnerability—if it's debunked, the macro theory weakens.

  Underlying all this is the user's unease. They feel the charity isn't confronting whether governance projects work. The RCT focus avoids evaluating the core theory, creating a disconnect between what's sold and what's done. That could be ethically problematic.
answer: |-
  This is an incredibly sharp dissection of the core tensions in modern development practice. Your charity's position isn't unique; it reflects a widespread, often unacknowledged, epistemological schizophrenia in the field. Let's break it down systematically:

  ## Core Presuppositions & Tensions

  1.  **Dualistic Causal Ontology:**
      *   **Macro-Level (Institutional):** Presupposes **fundamental, structural causation.** Institutions (rule of law, property rights) are seen as *deep*, *systemic* causes that structure societies, set the "rules of the game," and determine long-term developmental trajectories. Poverty is an emergent property of bad institutions. This level operates on **historical/comparative timescales.**
      *   **Micro-Level (RCTs):** Presupposes **proximate, local, interventionist causation.** RCTs test specific, bounded interventions (cash transfer, bednet) within an *existing* institutional context. They identify *marginal effects* of a treatment compared to control, holding (largely) the broader institutional environment constant. This level operates on **programmatic timescales.**
      *   **The Split:** The charity implicitly treats these as *separate but complementary*. The macro theory provides the *justification* ("Why we work here? Why this matters?"). The micro RCTs provide the *operational legitimacy* ("How we know *this specific tool* works?"). The "you can't randomize a legal system" response reveals the unbridgeable methodological gap between these levels.

  2.  **Hierarchy of Evidence & Knowability:**
      *   **Micro:** Privileges **experimental evidence (RCTs)** as the gold standard. Causality is established through manipulation and control. Knowability is high for specific, bounded interventions.
      *   **Macro:** Relies on **observational, historical, and quasi-experimental evidence** (like settler mortality instruments). Causality is inferred through complex statistical modeling and narrative historical analysis. Knowability is inherently lower, more contested, and relies on strong assumptions. RCTs are deemed impossible.
      *   **The Tension:** The charity *accepts* lower standards of evidence for its core theoretical justification (institutionalism) while demanding the highest standard (RCTs) for its operational work. This creates an epistemic asymmetry where the *foundation* is less rigorously tested than the *applications* built upon it.

  3.  **The Nature of "Fundamental Causes":**
      *   The institutionalist view presupposes institutions are **autonomous, primary drivers.** They are the "fundamental cause" in the sense that they are seen as *prior to and determinative of* other factors like specific policies, technologies, or even geography's *economic* effects (e.g., geography matters *because* it shapes institutions, not directly). History (via instruments like settler mortality) is used to establish this *primacy* and *exogeneity*.
      *   **The Instrumental Variable (Settler Mortality) Presuppositions:**
          *   **Exogeneity:** Settler mortality rates are assumed to be *randomly assigned* with respect to *potential* institutional outcomes today (i.e., determined solely by local disease environment facing colonists, not by pre-existing societal factors affecting both mortality and future institutions).
          *   **Exclusion Restriction:** Settler mortality affects modern income *only* through its impact on *early institutions* set by colonists. No other causal pathways exist.
          *   **Relevance:** Settler mortality strongly predicts the early institutions.
          *   **Natural Experiment Analogy:** It presupposes colonial encounter was a quasi-random "treatment" assigning different institutional "doses" based on mortality. This *does* treat history like an imperfect RCT.
          *   **Critiques & Vulnerability:** These assumptions are fiercely contested ("the instrument is broken"). Critics argue mortality *wasn't* truly random (geography shaped indigenous societies too), that exclusion fails (mortality likely affected disease burdens, population density, social capital, etc., *independently* of colonial institutions), and that institutional development was far more complex and path-dependent than the model allows. **If the instrument is fatally flawed, the core empirical pillar of macro institutionalism wobbles badly.**

  4.  **Geography vs. Institutions:**
      *   The charity's pitch explicitly **rejects geographical determinism** (geography as destiny). It presupposes geography and institutions are **distinct, separable factors**, with institutions being the dominant causal force. Geography's effect is *mediated* through institutions. Bad geography might *influence* the *likelihood* of bad institutions emerging, but it is not seen as the *direct* cause of poverty; bad institutions are.
      *   **The Anti-Institutionalist Counter:** Critics (like Jeffrey Sachs) argue you *cannot* separate them so neatly. Geography (disease, climate, soil, isolation) imposes **hard constraints** that directly impact productivity, disease burden, state capacity, and trade costs, making *good* institutions vastly harder to establish and sustain. Institutions aren't magically independent of their physical context. The separation risks being artificial.

  ## What Rival Views Are Ruled Out?

  The charity's stance quietly (or not so quietly) rules out:

  1.  **Strong Geographical Determinism:** The view that factors like climate, disease ecology, or resource endowments are the *primary* drivers of long-term development paths.
  2.  **Cultural Primacy Theories:** Views emphasizing deep-seated cultural values (e.g., trust, work ethic, social capital) as the fundamental cause, relatively independent of formal institutions.
  3.  **Critical/Structuralist Views:** Theories emphasizing global power structures, historical exploitation (slavery, colonialism *beyond* just settler mortality), or inherent capitalist contradictions as the core drivers of persistent poverty, where "good institutions" within a nation are insufficient or even impossible under current global arrangements.
  4.  **Radical Complexity/Unknowability:** The view that national development outcomes are the result of such complex, contingent, path-dependent interactions of countless factors (institutions, geography, culture, leadership, luck, global events) that identifying a single "fundamental cause" is impossible or meaningless ("we simply can't know why some nations are rich").

  ## What Are You Smuggling In? (The Anti-Institutionalist Critique)

  An anti-institutionalist, or skeptic, would argue the charity is smuggling in:

  1.  **Methodological Individualism Masquerading as Institutionalism:** By focusing *operations* on RCTs (testing individual/household responses to incentives/treatments), you're implicitly prioritizing *micro-level behavioral changes* within existing structures, not testing or truly challenging the *macro-institutional structure* itself. The "institutionalism" becomes a rhetorical fig leaf.
  2.  **Technocratic Reductionism:** Reducing development to discrete, measurable interventions (bednets, cash) that *can* be RCT'd, while ignoring or downplaying the messy, political, structural change implied by the institutionalist rhetoric. This avoids grappling with power, politics, and historical legacies.
  3.  **Pragmatic Defeatism on Institutions:** Accepting that "you can't randomize a legal system" becomes an excuse *not* to rigorously evaluate governance projects with the best *available* (non-RCT) methods (e.g., rigorous quasi-experiments, process tracing, comparative case studies, mixed methods). This smuggles in an acceptance that the core theory is unfalsifiable at the operational level.
  4.  **Implicit Acceptance of Geography/History:** By relying on settler mortality instruments (even if flawed), you *are* smuggling geography (disease environment) and a specific interpretation of colonial history back in as the *ultimate* exogenous shapers of the "fundamental cause" (institutions). You haven't escaped them; you've just made them the "cause of the cause."
  5.  **The "Fundamental Cause" as Unactionable Abstraction:** If institutions are truly the deep, historical, system-level cause, but your only *actionable* tools are micro-RCTs operating *within* those systems, then the proclaimed "fundamental cause" becomes functionally irrelevant to your actual *doing*. It's a fundraising slogan, not an operational guide.

  ## Is the Split Incoherent? Can You Hold Both?

  *   **Not *Strictly* Contradictory:** You *can* logically hold both views simultaneously as a form of **pragmatic pluralism**. The argument goes:
      *   Macro Theory: Bad institutions are the *underlying reason* Country X is poor.
      *   Micro Practice: *Given* those bad institutions (which we can't easily fix directly), here are some discrete interventions (cash, bednets) that RCTs show can *marginally improve* lives *despite* the bad institutions. We do what we *can* test and know works locally. We fund governance work as a hopeful long-term bet, acknowledging the evidence challenges.
  *   **But It's Deeply Problematic & Risks Incoherence:**
      *   **Mission Drift:** If donors fund based on the institutionalist *promise* (fix the root cause!), but the vast majority of resources go to micro-interventions that *don't* challenge the root cause (and may even be necessitated *by* its persistence), it risks misleading donors and misallocating resources away from the harder institutional work.
      *   **The Evaluation Gap:** The refusal to apply *rigorous non-RCT evaluation* to governance projects creates a dangerous accountability vacuum. How do you know *any* of that money is well-spent? "You can't RCT it" becomes an excuse for laxity.
      *   **Theoretical Erosion:** Over time, the operational focus on RCT-able micro-projects can subtly *replace* the institutional theory as the de facto organizational purpose. The "fundamental cause" rhetoric becomes hollow.
      *   **Ignoring Interactions:** It ignores how macro institutions *constrain* or *enable* the effectiveness of micro-interventions (e.g., cash transfers work very differently in a high-corruption vs. low-corruption context).

  ## What Could You Drop Without Changing What You Do?

  1.  **The Strong Primacy Claim:** You could soften the pitch from "Institutions are *the* fundamental cause, geography/culture are excuses" to "Institutions are *a* crucial factor shaping development, alongside others like geography and history. We focus on improving institutions where possible, and alleviating suffering caused by poverty directly where institutional change is slow." This better reflects the operational reality without undermining the *existence* of institutional work.
  2.  **Blind Faith in the Settler Mortality Instrument:** You can acknowledge the critiques and debates around this instrument without abandoning institutionalism entirely. Frame historical institutional origins as complex and contested, while still arguing that *current* institutions matter. This doesn't change any *current* operations.
  3.  **Rigid Evidence Hierarchy for Macro Claims:** Stop implying that macro claims *should* or *could* meet RCT standards. Acknowledge different methodologies are needed for different levels of analysis. This actually strengthens your position intellectually.

  ## What's Essential to Keep (For Now)?

  *   **The Institutional Focus for Donor Pitch & Governance Work:** This is likely core to your funding identity and justifies that strand of work. You can't easily drop it without a major strategic shift.
  *   **RCTs for Micro-Interventions:** This is your operational bread and butter and evidence base for those programs. Dropping it would undermine their credibility.

  ## The Honest Conclusion

  The split isn't *logically* incoherent, but it is **operationally unstable and intellectually uncomfortable.** It reflects the field's struggle to reconcile deep structural theories with the demand for measurable, accountable interventions in a complex world. The strongest critique isn't that it's impossible to believe both, but that the *gap* between the grand theory and the actionable practice is so wide that it:

  1.  Allows the core theory (institutionalism) to remain untested and potentially unfalsifiable at the level you *act* upon it.
  2.  Risks reducing development to technocratic tinkering at the margins (RCT-able projects) while paying lip service to transformative change (institutions).
  3.  Creates an accountability problem for the governance work.

  **The most coherent path forward for your charity might be:** Honestly acknowledge the different levels of causation and evidence. Be explicit with donors that while institutions are crucial, *directly* changing them is complex, slow, and hard to measure with RCTs, hence you use other methods to evaluate that work and also fund proven life-improving interventions *within* existing institutional constraints. Drop the overly simplistic dismissal of geography/history. Invest seriously in *rigorous non-RCT evaluation* for the governance projects to close the accountability gap. This wouldn't require changing your daily operations, but it would make your intellectual framework more robust and honest. The tension won't vanish, but it can be managed with integrity.
