  I'm working through Nietzsche's second Untimely Meditation and I'm stuck on the section on critical history. I don't have the book to hand, so this is a paraphrase: we're supposed to drag the past before a tribunal, interrogate it, and condemn it — but he also warns that this is dangerous, because we're made of that past, so condemning it means condemning part of ourselves, and the new second nature we try to grow can end up weaker than the one we cut away. I can follow the general idea. What I can't see is how the condemnation is supposed to work without either being toothless or being self-destructive. If the past is constitutive of who I am, what is left of me to do the condemning? And is the critical mode meant to be applied to one's own personal history, to a culture's history, or both? I already understand the monumental/antiquarian/critical division at the level of a summary; what I want is the actual argument of the critical section and how it's supposed to avoid the circularity. Begin with the bottom line in your first sentence, then give the reasoning. No preamble, no restating my question. British English.
