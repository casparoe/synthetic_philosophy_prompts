answer: |-
  Critical condemnation of the past functions through a *selective negation* driven by present life-affirming needs, not total annihilation, enabled by our inherent 'plastic power' to metabolise historical influences.

  Nietzsche argues that while our present self *is* constituted by the past, this self possesses a vital capacity ("plastic power") to assimilate, transform, and crucially, *reject* elements of that inheritance based on what serves its current will to grow and create. The act of condemnation isn't performed by a self untouched by history (an impossibility), but by the *emergent, life-affirming aspect* of the present self that recognises certain historical elements as *hostile* to its further development and future potential. This condemnation is not toothless because it actively *severs* the influence of specific harmful or oppressive past formations (institutions, values, narratives) that inhibit life. It avoids pure self-destruction because:
  1.  **It's Partial:** It targets *specific* condemned aspects, not the *entirety* of the past constituting the self. One condemns the 'second nature' (the ingrained, potentially life-denying habits and values) *in favour of* cultivating a new one, not the entire foundation.
  2.  **It's Purposive:** The force driving condemnation is the *affirmative will* of the present self striving for greater health and power. The energy for critique comes from the life-force *within* the constituted self that seeks to overcome its own limitations. The judge isn't external; it's the vital core demanding growth.
  3.  **It Relies on Plastic Power:** This inherent capacity allows the self to survive the necessary 'surgery', to heal the wound inflicted by condemning part of itself, and to generate a stronger 'second nature' from the remaining, affirmed elements and new creations. Weak plastic power risks collapse; strong plastic power enables productive destruction.

  The critical mode applies **fundamentally to both personal and cultural history simultaneously.** Nietzsche sees the individual and culture as deeply intertwined. Critiquing the oppressive historical forces shaping one's culture *is* critiquing the forces shaping the individual self within that culture, and vice versa. The aim is liberation for *life* – both the life of the individual and the vitality of the culture – from the suffocating burden of a past that commands obedience and stifles becoming. The circularity is broken by the *forward-driving force of life itself* within the present moment, using critique as a scalpel for necessary amputation, not a bomb for suicide.
