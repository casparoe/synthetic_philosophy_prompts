  **Bottom line:** Marcus has the stronger position overall, as supervaluationism better explains the board's practice and the nature of legal vagueness in this context, though both views have unresolved weaknesses; Dana's epistemicism is defensible but less suited to policy implementation.

  ### Adjudication of Moves:
  **(1) Dana (Epistemicism): Defensible but flawed.**  
  Rating: **Defensible**  
  Justification: Epistemicism is a coherent philosophical stance (e.g., Williamson’s view), arguing vagueness stems from ignorance of sharp boundaries. It rightly notes that the 5% rule is a pragmatic error-avoidance policy. However, it struggles to explain how a sharp boundary exists despite no linguistic/behavioral evidence for it, making it metaphysically puzzling in practice.  

  **(2) Marcus (Supervaluationism): Clearly right.**  
  Rating: **Clearly right**  
  Justification: Supervaluationism accurately describes vagueness as semantic indecision, where borderline cases (like 2.09m) lack determinate truth values. It correctly frames the 5% rule as the board selecting a precisification (resolving vagueness), not tracking a hidden fact. This aligns with the board’s role in interpreting ordinances.  

  **(3) Dana (Critique of Supervaluationism): Defensible.**  
  Rating: **Defensible**  
  Justification: Dana validly highlights supervaluationism’s "higher-order vagueness" problem: if "admissible precisification" is vague, the theory risks regress or inconsistency. His "enforcement as fiat" concern also has merit—supervaluationism doesn’t fully avoid arbitrariness. However, this doesn’t refute the theory; it’s a known challenge that doesn’t invalidate its utility here.  

  **(4) Marcus (Critique of Epistemicism): Clearly right.**  
  Rating: **Clearly right**  
  Justification: Marcus correctly identifies epistemicism’s core weakness: it cannot explain how a sharp boundary exists if language use never established it. His contrast with supervaluationism is apt—the latter better explains the board’s practice by showing how precisifications make one verdict "correct" without positing unknowable facts.  

  **(5) Dana (Amendment Argument): Mistaken.**  
  Rating: **Clearly mistaken**  
  Justification: Dana errs in claiming the amendment (explicit 5% tolerance) eliminates vagueness. As Marcus notes, vagueness is relocated: "more than 5%" still has borderline cases (e.g., is 5.0001% "more than 5%"?). The amendment doesn’t prove vagueness was "non-essential"; it explicitly manages it, which is consistent with semantic vagueness.  

  **(6) Marcus (Relocation Response): Clearly right.**  
  Rating: **Clearly right**  
  Justification: Marcus is correct that the amendment trades one vague predicate ("exceeds the limit") for another ("more than 5%"), shifting the borderline to the edge of the tolerance. This clarifies that such clauses redefine admissibility boundaries (a policy choice), not discover preexisting facts. It’s a pragmatic solution to semantic indecision.  

  ### Overall Verdict on the Underlying Question:  
  Marcus is closer to right: the vagueness is **semantic** (not epistemic). Supervaluationism better accounts for the board’s discretionary role and the function of tolerance clauses.  

  ### What Both Miss:  
  - **Dana** misses that legal interpretation inherently involves precisification, making "fiat" unavoidable and not problematic.  
  - **Marcus** underaddresses higher-order vagueness (from Dana’s Move 3), which remains a thorn for supervaluationism.  
  - **Both** talk past each other on "enforcement": Dana sees it as tracking truth, Marcus as constructing it. They miss that legal contexts blend semantics and pragmatics—vagueness mandates discretion, but discretion isn’t arbitrary when guided by purpose (e.g., avoiding trivial violations).  

  ### Confidence and Uncertainty:  
  **Confidence:** High (8/10) on Marcus’s overall advantage, given the policy context.  
  **Least Sure About:** Rating Dana’s Move 5 as "clearly mistaken." One could argue numerical thresholds reduce vagueness significantly (even if not perfectly), but Marcus’s relocation rebuttal is stronger.
