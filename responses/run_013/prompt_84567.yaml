prompt: |-
  I'm a philosophy PhD student working on the ethics of intellectual property, and I keep tripping over an inconsistency among the regimes that govern ideas at my own university. Copyright leaves ideas entirely free — only expression is owned — so I may reimplement a colleague's algorithm the day after reading her paper. Patent law says nearly the opposite: the invention, the method itself, is the thing owned, for a term, provided it is novel and non-obvious. Research integrity policy takes a third line: anyone's ideas may be used freely, but they must be attributed, and failing to attribute a substantive idea counts as misconduct even if I arrived at it independently. My integrity office only pursues idea-plagiarism, as opposed to text-plagiarism, when the idea was non-obvious to a competent researcher in the field and central to the later work — a filter that looks borrowed from patent law but does different work there. Then the technology transfer office treats those same ideas as trade secrets that may not be disclosed at all. All four regimes sit in one building and bind the same people.

  Please reconstruct what each practice presupposes about ideas. What conception of an idea — as property, as a discoverable fact, as a social artifact, as someone's labour — does each regime need in order to be coherent, and which rival conceptions does each quietly rule out? Which elements are strictly presupposed and which are merely well served? I suspect the idea/expression line is really about administrability and could survive almost any metaphysics of ideas, whereas the attribution norm needs something more; tell me whether that's right. Where are these regimes genuinely inconsistent, and where do they only look inconsistent because each answers a different question? Finally, if we replaced the whole patchwork with a single view — ideas are never owned, only attributed — what would have to change in each practice to make that workable?
reasoning: |-
  Okay, let me tackle this philosophy PhD student's query. They're wrestling with the conflicting intellectual property regimes at their university: copyright, patent law, research integrity policies, and tech transfer rules. Each treats ideas differently, creating a conceptual mess. 

  First, I need to unpack what each system presupposes about ideas. Copyright's idea/expression dichotomy seems purely utilitarian - it's not about the nature of ideas but about balancing access and incentive. The student suspects this distinction is administratively motivated rather than metaphysically grounded, and I agree. Copyright doesn't care if ideas are discoveries or creations; it just draws a pragmatic line.

  Patent law is more interesting. By protecting methods, it treats ideas as human inventions requiring solution-oriented labor. This actively rejects the notion that ideas are pre-existing discoveries. There's a tension here with copyright's neutral stance - patents demand novelty while copyright doesn't care about an idea's newness.

  The research integrity angle fascinates me most. Attribution norms suggest ideas are social artifacts, born from scholarly labor. Unlike patents, independent discovery isn't a defense - the social fact of prior conception matters more than the idea's ontological status. The "non-obvious" filter here serves social recognition, not technical inventiveness like in patents.

  Tech transfer offices operate in yet another universe, treating ideas as secrets with commercial potential. This commercial lens overrides all other considerations - attribution becomes secondary to confidentiality. 

  Where do these regimes genuinely conflict? Most sharply in how they handle independent derivation: forbidden by secrecy rules, irrelevant to attribution norms, and a complete defense in patent law. The student's observation about the borrowed "non-obvious" filter being repurposed differently is spot-on too - it's a structural parallel with divergent functions.

  If we adopted their proposed "attribution-only" model, each system would need radical surgery: patents would collapse entirely, copyright's merger doctrine would expand, tech transfer would shift to delayed attribution, and integrity rules might become the primary framework. But this would require dismantling deep institutional structures - the practical hurdles might be insurmountable even if philosophically coherent.

  Throughout this, I'm mindful that the student is looking for conceptual clarity more than policy solutions. The core insight emerging is that these regimes aren't just different rules - they're different worlds of meaning, each constructing "ideas" to serve incompatible social purposes. The real inconsistency lies in forcing academics to inhabit all these worlds simultaneously.
answer: |-
  Your analysis astutely identifies profound conceptual tensions in how different regimes govern ideas. Let's reconstruct the presuppositions, inconsistencies, and reform possibilities:

  ### Core Presuppositions of Each Regime
  1. **Copyright**  
     - *Presupposes:* Ideas are non-rivalrous public goods ("free as the air to common use," *per* Brandeis). Expression is a separable, labor-intensive artifact.  
     - *Metaphysics:* Ideas are discovered facts or abstract concepts; expression is created through individual labor.  
     - *Rules Out:* Ownership of ideas qua ideas; moral claims over ideas beyond their expression.  
     - *Administrability Focus:* The idea/expression dichotomy is indeed a pragmatic boundary to avoid monopolizing thought. It survives with almost any metaphysics—even if ideas are social artifacts, copyright cares only about fixed form.

  2. **Patent Law**  
     - *Presupposes:* Ideas (methods/processes) are *inventions*—artificial solutions to technical problems, created through directed labor.  
     - *Metaphysics:* Ideas are human-made tools, not discoveries. Novelty/non-obviousness imply they wouldn't exist without inventor effort.  
     - *Rules Out:* Independent invention as a defense; the notion that technical ideas are free public goods.  
     - *Tension:* Directly contradicts copyright's view of ideas as unownable. Patents protect "functional knowledge" as property.

  3. **Research Integrity Policy**  
     - *Presupposes:* Ideas are *scholarly contributions* embedded in a social-epistemic network. Attribution is a debt to communal labor.  
     - *Metaphysics:* Ideas are social artifacts shaped by authorship. Even independent discovery doesn't erase the *social fact* of prior conception.  
     - *Rules Out:* Truly "ownerless" ideas; the patent view that obvious ideas are free.  
     - *Non-obviousness Filter:* Unlike patents (which exclude obvious ideas *from protection*), integrity policy uses it to *intensify* attribution duties—highlighting the idea’s social value.

  4. **Technology Transfer (Trade Secrets)**  
     - *Presupposes:* Ideas are *commercial assets* whose value depends on exclusivity.  
     - *Metaphysics:* Ideas are rivalrous commodities; disclosure = value destruction.  
     - *Rules Out:* The academic norm of open attribution; copyright's presumption of free reuse.  
     - *Conflict:* Turns the scholarly attribution model into a liability—citing prior art might breach secrecy.

  ### Genuine Inconsistencies vs. Divergent Purposes
  - **Genuine Inconsistencies:**  
    - *Independent Derivation:* Allowed under patent law (if not copied), forbidden by trade secrecy (if secret exists), irrelevant to attribution norms (must cite regardless), and permitted by copyright.  
    - *Disclosure vs. Attribution:* Tech transfer prohibits disclosure; integrity policy demands it for used ideas.  
    - *Obviousness:* Patents exclude obvious ideas from ownership; integrity policy may still demand attribution for "non-obvious-to-peers" ideas.  

  - *Divergent Purposes Explaining Apparent Conflicts:*  
    - Copyright enables cultural production; patents incentivize technical innovation; integrity norms sustain academic trust; tech transfer commercializes research. Each answers: "How do we best foster X type of progress?"

  ### "Attribution-Only" Model: Feasibility & Required Changes
  If ideas are **never owned, only attributed**, the regimes would need radical restructuring:  

  | **Regime**          | **Changes Required**                                                                 |
  |----------------------|--------------------------------------------------------------------------------------|
  | **Copyright**        | Minimal change. Already focuses on expression. Merger doctrine expands: when expression is inseparable from idea, neither is protected. |
  | **Patent Law**       | Abolished for methods/algorithms. Replace with prizes, grants, or mandatory licensing with attribution. |
  | **Research Integrity** | Strengthened as primary governance. Extend attribution to all "significant scholarly influence," regardless of independence. |
  | **Tech Transfer**    | Shift from secrecy to lead-time advantage or open licensing. Attribution replaces NDAs: "Use my idea, but cite me." |

  ### Your Suspicions Confirmed
  - **Idea/Expression Dichotomy:** Yes, it’s primarily administrative. It works with:  
    - *Platonism* (ideas exist independently; expression instantiates them)  
    - *Social Constructivism* (ideas emerge communally; expression individualizes them)  
    - *Labor Theory* (expression embodies labor; ideas do not)  
    Only radical materialism (ideas = physical brain states) might challenge it.  

  - **Attribution Norm Needs More:** Correct. It presupposes ideas are *constituted* by social recognition. An unattributed idea ceases to function as scholarly currency. This requires:  
    - A **communal epistemology** where knowledge-claims derive authority from lineage.  
    - **Labor-as-contribution**: Even obvious ideas may demand attribution if labor was expended in their contextualization.  

  ### Philosophical Pathway Forward
  The regimes clash because they answer **competing social imperatives**:  
  - *Economic efficiency* (patents/trade secrets)  
  - *Cultural flourishing* (copyright)  
  - *Epistemic integrity* (attribution)  

  A unified "attribution-only" model favors epistemic integrity at potential cost to commercialization. To make this workable:  
  - **Forfeit exclusivity** as an incentive; replace with reputational capital (citations → prestige → funding).  
  - **Accept slower tech transfer** in favor of open science.  
  - **Expand "significant contribution"** standards to avoid attribution overload.  

  The inconsistency isn’t merely operational but **ontological**: each regime constructs "the idea" differently—as *expression*, *invention*, *credit*, or *asset*. Harmonization requires choosing which social good to prioritize. The university, as a knowledge commons, logically should elevate attribution—but only if society accepts decommodifying ideas.
