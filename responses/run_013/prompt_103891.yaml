answer: |-
  Below is a defended research agenda for your accuracy-first epistemology project, prioritizing open questions under the "self-referential accuracy" constraint. The ordering balances **dependency** (what unlocks downstream work), **tractability** (tools vs. new math), **neglect** (importance vs. attention), and **impact** (whether resolution changes practice). The self-referential constraint reshapes priorities significantly, demanding foundational checks before applications. I flag overrated questions and include key observational triggers.

  ### Core Prioritization Criteria
  1. **Dependency**: Does solving this enable progress on others?  
  2. **Tractability**: Can non-mathematicians make headway with existing decision/epistemic tools?  
  3. **Neglect**: Is the question underexplored relative to its centrality?  
  4. **Impact**: Does resolving it force revisions to foundations or norms?  

  ### Base Ranking of Open Questions (Without Constraint)
  1. **The Unit-Sensitivity Problem for Scoring Rules**  
     - **What**: Are there *fully general* accuracy measures (scoring rules) that avoid arbitrary sensitivity to how propositions are "scaled" (e.g., binary vs. [0,100])?  
     - **Dependency**: Foundational. All accuracy arguments (dominance, calibration, etc.) depend on the scoring rule. Unlocks everything.  
     - **Tractability**: Low. Requires new mathematics (functional analysis, invariance proofs). Current tools (Brier score, log score) fail generality.  
     - **Neglect**: High. Acknowledged but sidelined; most work assumes a "good enough" scoring rule.  
     - **Impact**: Transformative. If insoluble, the entire program rests on arbitrary choices.  
     - **Overrated?** No—but often ignored because it’s mathematically thorny.  

  2. **The Problem of the Priors**  
     - **What**: Can accuracy arguments justify *non-uniform* initial credences (e.g., simplicity biases)?  
     - **Dependency**: Unlocks diachronic norms and epistemic value theory.  
     - **Tractability**: Medium. Needs decision-theoretic innovations (e.g., accuracy over computational states), not new math.  
     - **Neglect**: Moderate. Heavily debated but no consensus; alternatives (e.g., pragmatic virtues) dominate.  
     - **Impact**: High. Without this, Bayesianism lacks a complete accuracy foundation.  

  3. **Diachronic Norms Beyond Conditionalization**  
     - **What**: Can accuracy justify updating rules for memory loss, self-locating beliefs, or logical uncertainty?  
     - **Dependency**: Requires prior justification (Problem #2). Enables applied epistemology.  
     - **Tractability**: High. Builds on existing dynamic scoring rules (e.g., Greaves and Wallace).  
     - **Neglect**: Low. Active area (e.g., epistemic utility theory for non-ideal agents).  
     - **Impact**: Medium. Important for realism but doesn’t reshape core norms.  

  4. **Epistemic Value of Questions**  
     - **What**: Can accuracy characterize which inquiries are epistemically valuable?  
     - **Dependency**: Requires stable priors (#2) and scoring rules (#1).  
     - **Tractability**: Medium. Uses existing info-theory (e.g., entropy reduction).  
     - **Neglect**: High. Underexplored; most value discussions are pragmatic.  
     - **Impact**: Medium. Nice-to-have, not foundational.  

  5. **Pragmatic Encroachment**  
     - **What**: Can accuracy-first explain why practical stakes affect epistemic justification?  
     - **Dependency**: None. Isolated application.  
     - **Tractability**: High. Leverages existing decision theory.  
     - **Neglect**: Low. Well-trodden; non-accuracy approaches dominate.  
     - **Overrated?** **Yes**. Accuracy-first adds little here—pragmatic factors are exogenous. Resources better spent elsewhere.  

  ---

  ### Reordering Under Self-Referential Accuracy Constraint  
  The constraint **demotes** questions where self-reference is irrelevant (e.g., pragmatic encroachment) and **promotes** those testing coherence of self-applied accuracy. Crucially, it introduces **two new questions** that leap to the top due to dependency.  

  1. **Self-Referential Accuracy Dominance (New)**  
     - **What**: Can an agent avoid *strict accuracy dominance* when her credences are about her *own* credences or accuracy? (e.g., "My credence in P is 0.7, and this credence is inaccurate").  
     - **Dependency**: Absolute bedrock. If self-referential dominance is incoherent (e.g., liar-like paradoxes), the entire extension fails. Unlocks all self-referential work.  
     - **Tractability**: Medium-High. Uses fixed-point theorems or diagonal arguments from formal logic/decision theory—no new math needed.  
     - **Neglect**: Extreme. Almost unaddressed in accuracy-first; minor work in logical uncertainty (e.g., Garrabrant) hints at pitfalls.  
     - **Impact**: Existential. Success forces new foundations (e.g., hierarchy of credences); failure sinks the constraint.  
     - **Promoted from**: N/A (new).  

  2. **Unit-Sensitivity Problem (#1 in base list)**  
     - **Why promoted?** Self-referential scoring rules (e.g., for "my credence is reliable") exacerbate scaling issues. If no general solution exists, self-referential accuracy is doubly arbitrary.  
     - **Dependency**: Still #1 for enabling *any* scoring, now with higher stakes.  

  3. **Accuracy of Methods' Reliability (New)**  
     - **What**: Can agents assign accuracy-optimal credences to propositions like "Method M is reliable"?  
     - **Dependency**: Requires dominance coherence (#1) and scoring rules (#2). Unlocks "questions worth asking" via reliability assessments.  
     - **Tractability**: Medium. Builds on calibration literature and formal learning theory.  
     - **Neglect**: High. Reliability is often assumed, not derived accuracy-centrically.  
     - **Impact**: High. Integrates process reliability into mainstream Bayesianism.  

  4. **Problem of the Priors (#2 in base list)**  
     - **Why demoted?** Self-referential priors (e.g., "my prior is reliable") depend on solving reliability (#3). Less urgent than coherence.  

  5. **Epistemic Value of Questions (#4 in base list)**  
     - **Why demoted?** Requires prior justification (#4) *and* reliability (#3). Now downstream of self-referential foundations.  
     - **Connection to constraint**: "Questions worth asking" reduce to reliability of methods that answer them.  

  6. **Diachronic Norms (#3 in base list)**  
     - **Why demoted?** Self-referential updating (e.g., "I should mistrust my memory") needs reliability (#3) first.  

  **Overrated under constraint**: Diachronic norms. Updating rules for self-reference are premature if self-applied accuracy isn’t coherent.  

  ---

  ### Final Agenda Order & Rationale  
  1. **Self-Referential Accuracy Dominance**  
     - *Why first?* Coherence is non-negotiable. A negative answer implodes the project; positive enables everything. High tractability for your team.  
  2. **Unit-Sensitivity for Scoring Rules**  
     - *Why second?* Foundational to all accuracy evaluations. Self-reference magnifies arbitrariness risks.  
  3. **Accuracy of Methods' Reliability**  
     - *Why third?* Directly satisfies your constraint. Unlocks "valuable questions" via reliability.  
  4. **Problem of the Priors**  
     - *Why fourth?* Needed for non-arbitrary starting points in reliability assessments.  
  5. **Epistemic Value of Questions**  
     - *Why fifth?* Depends on reliability (#3) and priors (#4). The "payoff" for your constraint.  

  **Dropped**: Diachronic norms (overextended), Pragmatic encroachment (misplaced for accuracy-first).  

  ---

  ### Critical Observations to Reshape the Agenda (Next 1–2 Years)  
  - **If Self-Referential Dominance is insoluble** (e.g., proof of unavoidable paradoxes): Abandon the constraint. Pivot to unit-sensitivity or priors.  
  - **If Unit-Sensitivity solution emerges** (e.g., from math literature): Rebalance resources toward applied self-reference (#3–5).  
  - **If formal epistemology integrates computational hierarchy** (e.g., work on logical inductors): Accelerate self-referential reliability (#3).  
  - **If reliability-first epistemology gains traction** (e.g., in social epistemology): Elevate #3 to compete with priors (#4).  

  ### Why This Agenda?  
  The self-referential constraint forces a **foundational pivot**—it’s not a mere application. By front-loading coherence checks (#1) and scoring rules (#2), you avoid wasted effort on higher-level topics that assume solvability. The sequence maximizes "option value": early work on #1–2 either validates the path or kills it quickly, while #3–5 deliver on your vision with minimal dependency on deep math. Crucially, it targets *neglected* questions where a small team can make an outsized impact without competing against mathematics-heavy programs.
