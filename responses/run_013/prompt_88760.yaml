  ### Program Equilibrium in a One-Shot Prisoner's Dilemma

  Here's a pair of agents that achieve mutual cooperation by reading each other's source code. I'll provide pseudocode short enough to write on a board, then walk through execution, add a wrinkle, and discuss robustness.

  #### The Programs (Identical for Both Agents)
  ```python
  // Agent Pseudocode
  1. my_source = "if hash(opponent_source) == hash(my_source): return 'C' else return 'D'"
  2. if hash(opponent_source) == hash(my_source):
  3.     return 'C'
  4. else:
  5.     return 'D'
  ```

  **Key Features**:
  - `hash()` is a deterministic function (e.g., SHA-256) that outputs a fixed-size string.
  - `my_source` contains the entire program's source as a string (simulated via quine-like techniques).
  - No external libraries/randomness needed—hash is computed internally.

  ---

  ### Walkthrough: How Cooperation Emerges
  1. **Agent A receives Agent B's source**:
     - Computes `hash(B_source)`.
     - Compares it to `hash(A_source)` (its own source hash).
     - Since both programs are identical, hashes match → A outputs `C`.

  2. **Agent B receives Agent A's source**:
     - Same process: `hash(A_source)` matches `hash(B_source)` → B outputs `C`.

  3. **Result**: (C, C) → Payoffs = (3, 3).

  **Load-Bearing Line**:  
  Line 2 (`if hash(opponent_source) == hash(my_source)`). The hash comparison is the coordination mechanism.

  ---

  ### The Wrinkle: Single-Character Change
  Change Agent A's code by adding a comment (no behavioral impact):
  ```python
  // Agent A (Modified)
  1. my_source = "if hash(opponent_source) == hash(my_source): return 'C' else return 'D'" // Added comment
  2. if hash(opponent_source) == hash(my_source):
  3.     return 'C'
  4. else:
  5.     return 'D'
  ```

  **What Happens**:
  - Agent A computes `hash(A_source)` → hash includes the comment → **new hash H1**.
  - Agent B computes `hash(B_source)` → original hash **H2**.
  - `H1 != H2` → Both agents hit the `else` clause and defect.
  - **Result**: (D, D) → Payoffs = (1, 1).

  **Why?**  
  The hash function is sensitive to *any* textual change. Even harmless comments alter the source string, breaking hash equivalence.

  ---

  ### Can Cooperation Survive? Yes, with Normalization
  Here's a robust version that ignores comments/whitespace:

  ```python
  // Robust Agent Pseudocode
  1. my_source = "norm_src = normalize(source); if norm_src == normalize(my_source): return 'C' else return 'D'"
  2. norm_opp = normalize(opponent_source)  // normalize() strips comments/whitespace
  3. norm_self = normalize(my_source)
  4. if norm_opp == norm_self:
  5.     return 'C'
  6. else:
  7.     return 'D'
  ```

  **Normalize Function** (same for both):  
  - Removes all whitespace and text after `//` in each line.

  **Effect of Wrinkle**:  
  - Adding a comment in Agent A → `normalize(A_source)` removes it → normalized string unchanged.
  - Both agents see identical normalized sources → (C, C).

  **But There's a Catch**:  
  - If we change **functional code** (e.g., rename `norm_opp` to `n_opp`), normalization *won't help*:
    - Renaming alters the normalized string (`norm_opp` vs `n_opp`).
    - Hashes/normalized strings differ → (D, D).

  ---

  ### Why This is a Knife Edge
  1. **Load-Bearing Feature**:  
     Syntactic equivalence (exact source matching via hash/normalization). Pull this out, and cooperation collapses.

  2. **What Breaks**:  
     - **No Robustness to Behavioral Equivalence**:  
       If Agent B is behaviorally identical but syntactically different (e.g., reordered lines), cooperation fails. Proving behavioral equivalence is undecidable (halting problem), so we can't rely on it.
     - **Dependency on Implementation**:  
       Normalization handles comments but not logic-preserving changes (e.g., algebraically equivalent expressions).

  3. **Proponent's Counterargument**:  
     _"Use cryptographic hashes of compiled bytecode or formal verification!"_  
     **Rebuttal**: Requires shared tooling/third parties, violating the "no third party" constraint. In self-contained code-only settings, syntax is all you have.

  ### Conclusion
  Program equilibrium works only when agents *syntactically mirror* each other. It's:
  - **Fragile**: Fails under trivial text changes.
  - **Unscalable**: Breaks if agents evolve independently.
  - **Theoretically Ironic**: Cooperation depends on code similarity, not intent.

  This shows program equilibrium isn't a robust solution—it's a clever but brittle hack. Use it to spark discussion on why real-world cooperation requires richer mechanisms (e.g., repeated interaction, common knowledge).
