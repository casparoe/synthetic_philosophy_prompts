prompt: |-
  I run evals and inference-time tricks for a small team, mostly LLM reasoning stuff — we sample a bunch of chain-of-thought answers at temperature > 0 and take the majority answer, and everyone keeps telling me this is "basically the Condorcet jury theorem." I've read the one-paragraph version (each voter more likely than not to be right, votes independent, majority converges toward certainty as you add voters) and I have a solid working grasp of my own vocabulary: ensembles, weak learners, the weak-learning / edge assumption, bagging vs boosting, bias-variance, calibration, correlated errors between models, self-consistency decoding, pass@k, and the difference between a model being accurate on a distribution and being right about a particular question. What I don't have is any real philosophy or social-choice background, so when someone says the theorem "justifies" my majority vote I genuinely can't tell what's being claimed or whether it's a compliment to my method or an insult.

  So: translate the Condorcet jury theorem into my vocabulary as faithfully as you can. Go assumption by assumption — the binary choice, the fact that there's a correct answer and everyone wants to find it, each voter's competence being above one half, independence, sincere rather than strategic voting, and the claim about what happens as you add voters — and for each one tell me the closest thing in ensemble / ML terms, how much you had to fudge to get the match, and whether the fudge is doing real work or is just decoration. Then the part I actually care about, the residue report: what does the theorem say that I have no way to say in my own terms? And where does my vocabulary let me say something the theorem can't say at all?

  Two specific things I want you to take seriously, because I think they're where the analogy usually breaks:

  1. Temperature sampling isn't a jury. When I sample the same model twelve times, am I twelve jurors, one juror with a shaky hand, or twelve jurors who all read the same newspaper? Say precisely wich of the theorem's assumptions that violates, and whether anything in my own toolkit — an ensemble of genuinely different models, or the notion of error correlation — gets closer to what the theorem actually wants than self-consistency does.

  2. Competence can be heterogeneous, and sometimes below one half. Real voters (and real samples) aren't uniformly p > 0.5, and I've heard that if enough of them are worse than chance the majority can get worse as you add them rather than better. Say what happens in the translated setting, and whether the ML notion of a weak learner that's only barely better than chance captures the same condition or a seperate one. Also tell me what the translation does with the case where the errors are correlated in a structured way — say all twelve samples fail on the same kinds of questions — which I suspect is the normal case rather than the exotic one.

  Finish by answering the thing I can't figure out on my own: is "majority vote is more likely to be right than a single sample" even a claim my setup can support, or is it a claim that only holds in a world that satisfies the theorem's assumptions, and what should I actually do differently at inference time if I take the disanalogies seriously — more samples, fewer, differently-trained models, something else entirely. Don't give me a reading list or citations, I won't be able to check them anyway. I just want the translation, the residue, and your honest read on which parts of my setup the theorem is actually talking about.
reasoning: |-
  Okay, let me tackle this user's query step by step. They work on LLM evals and inference tricks, specifically using majority vote on multiple chain-of-thought samples. People compare this to the Condorcet jury theorem, but they're unsure how the analogy holds up. 

  First, I need to map Condorcet's assumptions to their ML framework. The binary choice is straightforward—LLMs often output categorical answers, so that fits. The "correct answer exists" assumption aligns with their eval setup where ground truth is known. 

  The competence assumption (p>0.5) is trickier. Their temperature sampling creates correlated voters, not independent ones. This violates Condorcet's independence requirement. In ML terms, this is like having high error correlation between ensemble members. The theorem's p>0.5 also assumes homogeneous competence, but their samples might vary in quality per question, making competence heterogeneous. 

  Independence is the biggest sticking point. Sampling from the same model multiple times doesn't create independent voters; it's more like one juror copied by others. Their ensemble of different models would be closer to Condorcet's ideal, but even then, shared training data creates correlation. 

  For the convergence claim, Condorcet promises rapid improvement with more voters, but with correlated errors, adding samples gives diminishing returns. Their pass@k metric already hints at this limitation. 

  The residue—what Condorcet adds—is the mathematical guarantee of certainty with infinite independent voters. Their ML vocabulary lacks this certainty but offers tools like measuring error correlation or using calibrated confidence scores. 

  On competence heterogeneity, if average p<0.5, majority vote worsens—this mirrors having "weak learners" below chance. But ML's weak learner concept (slightly better than random) is a subset; Condorcet handles any p≠0.5. 

  For practical advice: since their samples are correlated, more models beat more samples. They should prioritize diversity—different checkpoints, prompts, or model families. Also, monitor per-question competence variance and average p. 

  The compliment/insult angle: calling it "basically Condorcet" is a half-compliment. It recognizes the power of aggregation but overlooks the correlation flaw. Their method is smarter than naive voting but not a true jury. 

  Final take: They should keep using self-consistency but supplement with truly diverse models when possible. And track error correlations—that's the silent killer of the Condorcet analogy.
answer: |-
  Here's the translation you asked for, assumption by assumption, with fudges flagged and residue exposed—no philosophy, just your toolkit:

  ### 1. **Binary Choice Assumption**  
     - *Theorem*: Only two options (correct/incorrect).  
     - *Your World*: Matches common LLM evals (e.g., multiple-choice QA).  
     - **Fudge?** Minimal. Real CoT outputs aren't always binary, but you force a vote.  

  ### 2. **Correct Answer Exists & Sincere Voting**  
     - *Theorem*: Ground truth exists; voters want truth, not strategy.  
     - *Your World*: You assume ground truth (evals); models "vote sincerely" via sampling (no adversarial intent).  
     - **Fudge?** None—your setup explicitly assumes this.  

  ### 3. **Competence > 0.5 (Homogeneous)**  
     - *Theorem*: Every juror independently has *same* probability *p > 0.5* of being correct.  
     - *Your World*: **Violated twice over**:  
       - **Heterogeneity**: Each sample has *different* competence (*p_i*) per question.  
       - **Competence Range**: Some *p_i < 0.5* on hard questions; average *p̄* may be >0.5, but not uniform.  
     - **Fudge?** Critical. Theorem assumes identical *p*; you have a *distribution* of *p_i*.  
     - **Weak Learner Analogy**: Close! Weak learners require *p_i > 0.5* on average, but Condorcet demands *every* juror >0.5. Your "edge" is averaged, not per-voter.  

  ### 4. **Independence**  
     - *Theorem*: Jurors' errors are statistically independent.  
     - *Your World*: **Catastrophic Violation**:  
       - Sampling 12x from the *same model* → errors are **correlated** (shared weights, prompt, biases).  
       - You're not 12 jurors; you're **1 juror hallucinating 12 times**, or 12 clones who read identical training data.  
     - **Fudge?** Deal-breaker. Theorem collapses with correlation. Your "error correlation" metric is the right tool, but Condorcet ignores it.  
     - **Closer Analogy**: An *ensemble of diverse models* (e.g., different architectures/finetunes) better approximates independence—but shared pretraining data still correlates them.  

  ### 5. **Majority → Certainty as N→∞**  
     - *Theorem*: With *p>0.5* and independence, P(majority correct) → 1 as jurors increase.  
     - *Your World*: **False under correlation**:  
       - With high error correlation, adding samples has **diminishing returns** (sometimes *harmful* if avg *p̄ < 0.5*).  
       - Your `pass@k` metric knows this: more samples help, but not exponentially.  
     - **Residue**: Condorcet gives a *mathematical guarantee* of convergence; you get a *heuristic* with error bars.  

  ---

  ### Residue Report: What Doesn't Translate  
  **What Condorcet Says That You Can't**:  
  - "With infinite independent jurors >0.5 competent, majority vote is infallible." Your world has no infallibility—only probability bounds via binomial statistics (which *require* independence).  

  **What You Say That Condorcet Can't**:  
  - **Heterogeneous Competence**: Your framework handles varying *p_i* per question (some samples strong, others weak).  
  - **Structured Correlation**: You can measure/model *when* errors correlate (e.g., all samples fail on spatial reasoning).  
  - **Calibration**: You know a model's confidence ≠ accuracy; Condorcet assumes jurors are perfectly self-aware.  
  - **Non-Binary Settings**: Your `pass@k` for code generation has no Condorcet equivalent.  

  ---

  ### Your Two Specifics, Demystified  
  **1. Temperature Sampling ≠ Jury**  
  - You have **12 correlated voters from one cognitive source**. This violates:  
    - *Independence* (critical)  
    - *Homogeneous competence* (minor; heterogeneity is manageable).  
  - **Closer in Your Toolkit**: An ensemble of *truly different models* (e.g., GPT + Claude + Mixtral) better satisfies independence—but still imperfect due to shared training data. Self-consistency is a "poor man's ensemble."  

  **2. Competence Heterogeneity & p<0.5**  
  - **If avg competence *p̄ < 0.5***:  
    - *Condorcet*: Majority becomes *less* accurate as N increases!  
    - *Your World*: Same if errors are uncorrelated. But with correlation, it’s messy.  
  - **Weak Learners**: Condorcet's *p>0.5* per juror is stricter. Weak learners only need *p̄ > 0.5*—they can include *p_i < 0.5* voters.  
  - **Structured Correlation**: If all samples fail on "question type X," majority fails. Condorcet has no language for this—it’s your "error correlation" or "systematic bias."  

  ---

  ### Should You Trust "Majority > Single Sample"?  
  - **Yes, but weakly**: Even with correlation, if *p̄ > 0.5*, majority *usually* beats a single sample—but **not guaranteed**, and gains plateau fast.  
  - **Condorcet’s "justification" is flimsy here**: It describes an ideal world you don’t inhabit (independent voters). Calling your method "Condorcet" is a **polite half-compliment**—it recognizes aggregation helps, but ignores your correlation problem.  

  ---

  ### What to Do Differently  
  1. **Prioritize Diversity Over Sample Count**:  
     - 5 samples from *different models* > 20 from one model.  
     - Use varied prompts/decoding strategies to simulate "model diversity."  
  2. **Measure Correlation**:  
     - Track when samples agree *because correlated* vs. *because correct*.  
     - If high correlation, adding samples wastes compute.  
  3. **Detect p̄ < 0.5 Questions**:  
     - Flag questions where single-sample accuracy <50%—majority vote may harm here.  
  4. **Hybrid Approaches**:  
     - Use self-consistency for "easy" questions (high p̄), but switch to confidence-weighted voting for hard ones.  

  **Bottom Line**: Condorcet describes a utopia of independent voters. Your sampling is a correlated hive-mind—useful, but not what the theorem describes. Your toolkit (error correlation, weak learners) is *more nuanced* for real-world ML. The theorem’s value is reminding you that **independence is the ceiling**—so chase diversity, not just sample volume.
