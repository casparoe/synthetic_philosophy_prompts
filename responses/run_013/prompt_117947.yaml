prompt: |-
  I work for a city council in a mid-sized city and we've somehow ended up committed to building a standing citizens' assembly -- not a one-off consultation, an actual permanent body that meets in cycles, gets a question from us, deliberates, and hands back a recommendation the council then votes on. My job is to write the operating manual: how members get drawn, how long they sit, how they're replaced, when we're allowed to deviate from a plain lottery, what we do when people decline. We have no statistician on staff, the clerk has to be able to run the thing, and the city attorney will read whatever I write before the council does. I've become a convert to the whole idea -- the fairness case (everyone gets an equal chance to hold power, not just an equal vote), the epistemic case (a random draw brings cognitive diversity that a self-selected room of the usual suspects never has), the fact that nobody in the room has to fundraise -- but i genuinely can't see how to get from any of that to rules a hostile councellor can't call rigged.

  So: turn the case for sortition into a decision procedure I can actually follow. Ordered questions, what counts as a sufficient answer to each, where it stops with a hard no, and where it stops and says "this one is a value call, get a human to sign off." The things I keep getting stuck on and need the procedure to resolve: which variables, if any, we stratify on when we draw, given that you can't stratify on everything without turning the lottery into a quota system; whether what actually matters is census-fidelity or diversity of *relevant* perspectives, and how that changes the answer; whether we recruit by address or let people sign up, given that volunteers are systematically more civically minded and more opinionated than the population; what to do about attrition when a third of the seats turn over mid-cycle; whether paying members changes who accepts and therefore corrupts the draw; who gets to frame the question and write the briefing materials, since that's where the real power sits; and whether the body should be able to bind us or only advise.

  Then run the procedure on three cases and show your work: (1) a proposal to run the draw as an open public sign-up, which we know will produce roughly three men for every woman who volunteers; (2) a councillor's motion to reserve eight of sixty seats for one particular group; (3) my own favourite, making the recommendations binding. I'll warn you I'm rooting for (3), and I'd rather you told me straight if the theory doesn't get us there.

  Don't give me citations or a reading list -- I can't look anything up right now and it would just be guessing. Cap it at 1200 words, I'd much rather have a tight procedure than an essay. And tell me what would change your mind about it: which argument or consideration would make you reorder or drop one of the steps, and where you think the procedure is most likely to break down in real use.
reasoning: |-
  Okay, the user works for a city council and needs to create an operating manual for a permanent citizens' assembly. They're dealing with practical issues like member selection, stratification, attrition, and power dynamics. They want a clear decision procedure that can withstand scrutiny from potentially hostile council members.

  First, I need to unpack their key pain points. They're stuck on several design questions: stratification variables, recruitment methods, handling attrition, payment's impact, question framing, and binding vs. advisory powers. They also provided three test cases to apply the procedure to. The underlying need seems to be legitimacy - creating rules that appear fair and unbiased to critics.

  The core challenge is balancing randomness with representation. Pure lottery could lead to demographic mismatches, but too much stratification turns it into quotas. The recruitment method affects participation rates - volunteer sign-ups skew toward certain demographics, while mandatory approaches have attrition issues. Payment might influence who participates, but it's necessary for accessibility.

  For the decision procedure, I'll build it around sortition principles: equal opportunity, cognitive diversity, and avoidance of systemic bias. Each step needs clear pass/fail criteria. For example, stratification should only correct severe distortions from pure randomness. Recruitment methods must minimize self-selection bias. 

  The three test cases are revealing:
  1. Open sign-up would disproportionately attract men, failing the gender balance threshold. 
  2. Reserved seats violate the equal probability principle unless it's about correcting exclusion. 
  3. Binding recommendations require council surrender of power - politically unlikely though desirable.

  The procedure must acknowledge where human judgment is unavoidable, like setting stratification variables or defining exclusion thresholds. These become political decisions that need explicit sign-off. 

  Real-world breakdown risks include council interference in question framing, attrition snowballing, or statistical thresholds being gamed. The escape valves (explicit sign-off points) are crucial for maintaining transparency when pure procedure can't decide.

  Most importantly, the manual must force acknowledgment that some choices are value judgments - like whether to prioritize census fidelity or perspective diversity. Making these explicit protects against accusations of rigging by showing the tradeoffs were consciously made.
answer: |-
  Here's a procedural framework for designing your citizens' assembly operating manual, built on core sortition principles. It uses ordered questions with clear pass/fail thresholds and identifies "Value Call" points requiring human sign-off (Council/City Attorney).

  **Core Principles Driving the Procedure:**
  1.  **Equal Probability:** Every eligible resident must have an equal *chance* of selection (barring justified exclusions/corrections).
  2.  **Representative Randomness:** The assembly should be a *statistically likely* microcosm of the city on key demographics, *not* a collection of quotas.
  3.  **Mitigated Attrition:** Processes must minimize dropouts and manage replacements without compromising randomness.
  4.  **Guarded Integrity:** Protect against systemic bias in recruitment, participation, and agenda-setting.
  5.  **Clear Mandate:** Define the power relationship with the Council upfront.

  **Decision Procedure:**

  1.  **Eligibility Pool Definition:**
      *   **Question:** Who is a "resident" eligible for the draw? (e.g., voting age? resident X months? on tax roll? citizen?).
      *   **Sufficient Answer:** Defined by clear, objective criteria (e.g., "Registered city voters" OR "Persons 18+ listed on the annual property tax roll or city utility account"). *Must use reliable, current administrative data.*
      *   **Stop/Hard No:** If criteria create systemic exclusion of identifiable groups without compelling justification (e.g., "only property owners"). "Value Call" on justification.
      *   **Output:** Defined source list (e.g., Voter Roll, Combined Tax/Utility List).

  2.  **Stratification Variables:**
      *   **Question:** Does pure random selection from the Pool risk severe under/over-representation (*beyond normal statistical fluctuation*) of any group whose perspective is demonstrably critical to fair deliberation on a *broad* range of city issues?
      *   **Sufficient Answer:** Identify *only* variables where:
          *   (a) Data is accurate & available for the *entire* Pool.
          *   (b) Severe distortion is *statistically likely/proven* (e.g., >10% absolute deviation from city proportion based on pool demographics).
          *   (c) The variable correlates strongly with distinct life experiences/perspectives *generally* relevant to city governance (e.g., geography, broad age bands, maybe socioeconomic proxies like neighborhood).
      *   **Stop/Hard No:** Stratifying on variables without (a), (b), and (c). Stratifying on too many variables (e.g., >3-4) turning it *de facto* into quotas. Stratifying on highly specific identities (e.g., "dog owners," specific ethnic groups <5%).
      *   **Value Call:** Deciding *which* variables meet criteria (b) and (c). Requires Council/CA sign-off on the final stratification schema *before* first draw.
      *   **Output:** List of stratification variables (e.g., Council District, Age Band 18-34/35-64/65+, Neighborhood Cluster SES) OR decision for pure lottery.

  3.  **Recruitment Method:**
      *   **Question:** How are individuals contacted and confirmed?
      *   **Sufficient Answer:** Mandatory Source List Draw (with opt-out) + robust follow-up protocol. Initial random draw from defined Pool. Multiple contact attempts (mail, phone, email if available). Emphasize civic duty, compensation, support.
      *   **Stop/Hard No:** Open Public Sign-Up (self-selection bias violates Equal Probability & Representative Randomness). Opt-*in* systems.
      *   **Value Call:** Specifics of follow-up protocol intensity/budget.
      *   **Output:** Mandatory draw process with defined contact steps & declination tracking.

  4.  **Handling Declinations & Attrition:**
      *   **Question:** How are replacements selected for initial declinations and mid-term dropouts?
      *   **Sufficient Answer:** Maintain the *original* stratification schema. Draw replacements randomly from the *same* source list segment (stratum) as the departing member. Repeat recruitment steps. Track reasons for decline/dropout.
      *   **Stop/Hard No:** Allowing the assembly or staff to "pick" replacements. Re-drawing the *entire* assembly mid-cycle. Ignoring stratification for replacements.
      *   **Value Call:** Threshold for declaring a seat "vacant" mid-cycle (e.g., missing 3 consecutive meetings? Serious misconduct?). Process for catastrophic attrition (>33%).
      *   **Output:** Protocol for random replacement within original stratum, with vacancy definition.

  5.  **Member Tenure & Rotation:**
      *   **Question:** How long do members serve, and how is staggered rotation managed?
      *   **Sufficient Answer:** Fixed terms (e.g., 18-24 months) with staggered start dates (e.g., cohorts of 20 every 6 months for a 60-seat assembly). Prevents capture, allows institutional memory turnover.
      *   **Stop/Hard No:** Life tenure. Unlimited self-nomination for subsequent terms. No rotation mechanism.
      *   **Value Call:** Exact term length and cohort size.
      *   **Output:** Defined term length, rotation schedule, and "no immediate re-selection" rule (e.g., 2-year gap before eligible again).

  6.  **Compensation & Support:**
      *   **Question:** Should members be paid, and how?
      *   **Sufficient Answer:** Yes. Meaningful compensation (e.g., city avg hourly wage x meeting hours + prep time) and childcare/transport costs covered. Removes financial barriers, validates time commitment.
      *   **Stop/Hard No:** Unpaid service only (systematically excludes lower-income residents). Excessive pay creating a "professional representative" class.
      *   **Value Call:** *Level* of compensation. Requires Council sign-off on budget.
      *   **Output:** Defined compensation formula and reimbursement policy.

  7.  **Agenda Setting & Briefing:**
      *   **Question:** Who frames the question and provides information?
      *   **Sufficient Answer:** Council *proposes* the question. Assembly has right to *reframe/clarify* (with neutral facilitation). Briefing materials curated by independent secretariat (e.g., Clerk's Office) with mandated balance: diverse expert views, stakeholder submissions, clear pros/cons. Assembly can request additional info/experts.
      *   **Stop/Hard No:** Council writing final briefing materials. Denying assembly access to diverse viewpoints. Council refusing to let assembly clarify an ambiguous question.
      *   **Value Call:** Composition/oversight of secretariat. Process for resolving Council-Assembly disputes on question clarity.
      *   **Output:** Protocol for question proposal, assembly clarification, and neutral briefing material development.

  8.  **Decision Authority:**
      *   **Question:** Are recommendations binding or advisory?
      *   **Sufficient Answer:** **Advisory.** Council must publicly debate and vote on the recommendation within a defined timeframe. Requires a *super-majority* (e.g., 2/3) of Council to *deviate* from the recommendation, with a mandated public statement of reasons.
      *   **Stop/Hard No:** **Fully Binding.** (Requires ceding core democratic legislative power, likely unconstitutional/unprecedented for a non-elected body). Ignoring recommendations without consequence.
      *   **Value Call:** The required Council majority to deviate (simple majority? supermajority?). *This is the biggest political hurdle.*
      *   **Output:** Defined "Comply or Explain with Supermajority" model.

  **Applying the Procedure to Your Cases:**

  1.  **Open Public Sign-Up:**
      *   Q3 (Recruitment): **Stop/Hard No.** Self-selection violates Equal Probability & Representative Randomness (3:1 M/F ratio proves severe distortion). Mandatory draw required.

  2.  **Reserve 8 Seats for Group X:**
      *   Q2 (Stratification): Does it meet criteria?
          *   (a) Data Available? (Probably yes for specific group).
          *   (b) Severe Distortion? (Need stats: Is Group X >10% under-represented in pure draw?).
          *   (c) Critically Relevant Perspective? (Is perspective *unique and vital across all issues*? Unlikely for most specific groups).
      *   **Likely Outcome:** **Stop/Hard No.** Reserves are quotas, violating Equal Probability and Representative Randomness. Only justifiable if group faces *proven systemic exclusion* and meets (a),(b),(c) *and* normal stratification fails. "Value Call" on justification, but procedure strongly disfavors.

  3.  **Binding Recommendations:**
      *   Q8 (Authority): **Stop/Hard No.** Theory (and democratic practice) does not support unelected bodies making binding law. Sortition excels at informed *recommendation*, not final *decision*. The "Comply or Explain with Supermajority" model provides significant weight while respecting Council's elected role.

  **What Would Change My Mind & Where it Breaks:**

  *   **Change My Mind:** Only significant new evidence. E.g., conclusive proof that modest stratification *causes* more harm than severe distortion; evidence that unpaid assemblies reliably achieve socioeconomic diversity; a successful legal/political precedent for binding sortition at the municipal level (none exist currently). For binding power, a fundamental change in constitutional law.
  *   **Most Likely Breakdown Points:**
      1.  **Attrition:** If declinations/early dropouts are very high (>50%), maintaining randomness and diversity becomes impossible. Requires intense recruitment effort & potential "Value Call" on relaxing stratification slightly for replacements *if* original strata are devastated.
      2.  **Question Framing/Briefing:** Council or factions attempting to bias the briefing materials. Requires a fiercely independent secretariat and strong transparency rules (all materials public).
      3.  **Council Override:** If Council frequently overrides recommendations with simple majorities and weak justifications, the assembly's credibility dies. Needs strong norms/political pressure.
      4.  **"Value Call" Exploitation:** Council using sign-off points (Stratification, Compensation, Override Threshold) to inject partisan bias. Requires vigilant public scrutiny and clear documentation of rationale.

  **Final Manual Core:** Mandatory draw from a clean source list. Minimal, justified stratification only if severe distortion is proven. Robust recruitment & replacement protocol within original strata. Meaningful pay/support. Council proposes questions, neutral secretariat briefs, assembly clarifies. Assembly advises; Council must publicly vote and needs a supermajority to override. Track everything. The procedure forces hard choices into the open, making "rigged" accusations harder to sustain. Good luck.
