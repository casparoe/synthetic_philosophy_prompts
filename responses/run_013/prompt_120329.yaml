            After round 1: collect, compute totals, write on board. Students record V and compute payoff.

            Round 2: same.

            Round 3: during the 2-minute discussion, we can compute round 2? But we haven't collected round 3 yet. We'll do:

              At the end of round 1, we compute and write the results for round 1.

              At the end of round 2, we compute and write the results for round 2.

              At the end of round 3, we compute and write the results for round 3.

              At the end of round 4, we compute and write the results for round 4.

          Then after round 4, we give them 5 minutes to compute their own payoffs for all rounds and record.

     70-90 min: Debrief.

          Start by asking: 
            - "What did you notice about your behaviour and your group's behaviour across the rounds?"
            - "In which rounds did your group succeed in providing the public good? In which rounds did it fail?"
            - "How did communication help in rounds 3 and 4? Did it always help? Why or why not?"

          Then map each round to the structure:

            Round 1: Summation (or total contributions) - the classic public goods game. The problem is free-riding: each person wants to let others contribute.

            Round 2: Weakest-link - the problem is strategic uncertainty: if you contribute more than the minimum, it's wasted, and if you contribute less, you lower the minimum. So without communication, they may end up with a low minimum. Communication in this round would have helped to agree on a common level.

            Round 3: Best-shot - the problem is free-riding on the highest contributor. Even with communication, they might not be able to get exactly one volunteer because the volunteer gets less than the others. So communication doesn't fully solve the problem.

            Round 4: Threshold - the problem is coordinating to meet the threshold without over-contributing. Communication helps to coordinate.

          Then separate the explanations:

            Motivational: greed (free-riding), fear of being a sucker, altruism, reciprocity.

            Structural: 
              Round 1: the aggregation rule (sum) makes each contribution have a small individual return (0.4 < 1) so free-riding is dominant.
              Round 2: the aggregation rule (min) makes the level of the good depend on the lowest contribution, so you don't want to contribute more than you expect the minimum to be, and you don't want to be the one who lowers the minimum. Communication reduces uncertainty.
              Round 3: the aggregation rule (max) means that one contribution can provide the good for all, so you want to be the free-rider. Communication can help to designate a volunteer, but the volunteer gets less, so it's hard to get someone to volunteer.
              Round 4: the aggregation rule (threshold) requires a total. Communication helps to coordinate on meeting the threshold.

          The key point: the same people, with the same preferences (they are trying to maximize their own points in each round), behaved differently because the rules changed.

          What the activity cannot do:
            - Real-world commons problems develop over time, so norms and reputations matter. Here, we did one-shot games.
            - We didn't have monitoring or punishment.
            - The ecological feedback (like depletion) is missing.

          The facilitator must mention these limitations.

   Facilitator's Sheet:

     Payoff formulas:

        Round 1 (Summation):
            V = 0.4 * (total contributions in group)
            Payoff_i = (10 - c_i) + V

        Round 2 (Weakest-link):
            V = 2 * min(c1, c2, c3, c4)
            Payoff_i = (10 - c_i) + V

        Round 3 (Best-shot):
            V = 2 * max(c1, c2, c3, c4)
            Payoff_i = (10 - c_i) + V

        Round 4 (Threshold):
            If total >= 20, then V = 20 for everyone.
            Else, V = 0.
            Payoff_i = (10 - c_i) + V

     Expected equilibria (if self-interested and no communication):

        Round 1: All contribute 0 -> total=0, V=0, each gets 10.

        Round 2: Without communication, they might contribute 0? Actually, any common level is an equilibrium, but the risk-dominant or the one that is played in practice is often low. Expect contributions to be low (maybe 0 or low numbers).

        Round 3: Without communication, they might all contribute 0? But if one person contributes 10, then they get 20 and others get 30. But if no one contributes, they get 10. So it's a coordination game with multiple equilibria. It's possible that one person contributes 10 and others 0. But without communication, it might not happen? Or it might. With communication, we hope for inefficiency.

        Round 4: Without communication, they might contribute 0? But then they get 10. If they could coordinate, they would get at least 20. But without communication, they might fail to meet the threshold. With communication, we expect they meet it.

     But in our design, round 3 and 4 have communication. So:

        Round 3 (best-shot, with communication): We hope for either under-provision (no one contributes) or over-provision (more than one contributes). The efficient outcome is to have at least one contribute 10. But even with communication, they might not achieve it, or they might have too many.

        Round 4 (threshold, with communication): They should be able to meet the threshold. They might over-contribute? But that's inefficient only in the sense of wasting tokens. They get the public good.

     What might go wrong:

        - Round 1: Students might not understand the payoff. They might think that contributing is good because it adds to the total. But the numbers show that free-riding is better. Be clear with the example.

        - Round 2: They might not understand that if they contribute more than the minimum, they are wasting tokens. They might think that high contributions are always good. Stress: "the public good value is 2 times the smallest contribution".

        - Round 3 and 4: The communication might lead to binding agreements? We must stress: "you cannot make binding agreements; after the discussion, you write your contribution privately and you are free to choose any number".

        - The points might be meaningless: Some students might not care about points. Encourage them: "We will not record individual scores, but try to maximize your own points as if it were real money. This is an experiment in decision-making."

        - Guessing the twist: If a student says in round 2: "I think the rule will change, so I'll contribute differently", you can say: "The rules are different each round, but we are not trying to trick you. We are studying how different rules affect contributions. Please focus on the current round's rule."

        - In round 3 (best-shot with communication): A group might decide to rotate who volunteers? But we don't have multiple rounds of the same. So they can't rotate. They are playing one-shot. They might not volunteer because they don't want to be the sucker.

        - In round 4: They might not be able to agree on a plan? Then they fail.

     Weakest part of the design:

        Round 3 (best-shot) with communication: We are assuming that without side payments, the volunteer's dilemma will lead to inefficiency (either no provision or over-provision). But in reality, groups might solve it by having one volunteer. We hope that some groups will have multiple volunteers (because everyone wants to be the hero? or by mistake) and some will have none (because no one wants to be the sucker). But if every group has exactly one volunteer, then we don't see the inefficiency. We rely on the empirical generalization that in volunteer's dilemmas with communication, there is often over-provision or under-provision.

        What would lead us to redesign? 
          - If in piloting, we find that groups always manage to have exactly one volunteer, then we might change the payoff to make it even harder: for example, set the return for the volunteer to be lower? But that would break the consistency of the 10 tokens and 2 multiplier.
          - Alternatively, we might run best-shot without communication and then with communication? But we don't have time.

        We can rely on the fact that in experiments, volunteer's dilemmas with communication still show inefficiencies (see Diekmann, 1985). But if in the classroom, they always succeed, then in the debrief we can note: "In this class, you were able to solve the best-shot game by designating one volunteer. But note that the volunteer gets 20, while the others get 30. Is that fair? Would you volunteer if it were real money? And what if you played multiple rounds? The volunteer would be worse off every time. In real life, without side payments, it might be hard to sustain."

     Materials:

        - Slips of paper for contributions (one per student per round). We can prepare 24*4 = 96 slips? Or have them reuse a slip by writing the round? But we collect after each round.

        - A board to record the group results.

        - A facilitator's cheat sheet with the formulas and threshold.

        - Scorecards for students (with a grid: Round, My Contribution, Group Result, V, My Payoff).

     Scorecard example:

        Round 1 (Summation):
          My contribution: ___
          Group total: ___ (from board)
          V = 0.4 * total = ___
          My payoff = (10 - my contribution) + V = ___

        Similarly for others.

     Final note: We use British English.

     Let's write the facilitator's sheet with the actual numbers and checks.

     Facilitator's Cheat Sheet:

        General: 
          Each student has 10 tokens per round.
          Contribution c_i between 0 and 10 (integers).
          Groups of 4, fixed.

        Round 1: Summation
          V = 0.4 * (c1+c2+c3+c4)
          Payoff_i = (10 - c_i) + V

          Expected: Contributions low, near 0.

        Round 2: Weakest-link
          V = 2 * min(c1, c2, c3, c4)
          Payoff_i = (10 - c_i) + V

          Expected: Without communication, contributions might be low (0 or 1?).

        Round 3: Best-shot (with 2 min discussion)
          V = 2 * max(c1, c2, c3, c4)
          Payoff_i = (10 - c_i) + V

          Expected: With communication, they might have 0, 1, or more than one volunteer (contributing 10). We hope for inefficiency (0 or >=2).

        Round 4: Threshold (with 2 min discussion)
          If (c1+c2+c3+c4) >= 20, then V = 20 for everyone.
          Else, V = 0.
          Payoff_i = (10 - c_i) + V

          Expected: With communication, they should meet the threshold (total>=20). They might over-contribute? But that just means they wasted tokens.

     How to compute:

        After each round, for each group:
          - Collect the contributions (c1, c2, c3, c4).
          - Compute the group statistic: 
              Round 1: total = sum
              Round 2: min
              Round 3: max
              Round 4: total and whether >=20
          - Compute V for the group (same for all members) using the formula.
          - Write on the board for each group:
              Group #: [statistic] and V = [value]
          - For round 4, also write if the threshold was met.

        Then each student computes their own payoff.

     What if a group has a tie in round 2 or 3? That's fine.

     Time permitting, we can have a discussion about fairness in round 3 and 4.

     This should fit 90 minutes.
answer: |-
  ### **"The Commons Challenge" In-Class Activity**

  **Objective:** Students experience how the aggregation rule (not individual selfishness) determines outcomes in commons dilemmas. Four rounds with identical stakes but different rules: summation, weakest-link, best-shot, threshold. Communication is permitted in Rounds 3–4 to show its variable effectiveness.

  **Materials (per student):**  
  - 10 identical tokens (e.g., paper clips, beads) per round.  
  - Contribution slip (paper) for each round.  
  - Personal scorecard (see template below).  

  **Setup (5 mins):**  
  - Randomly assign 24 students to 6 groups of 4. Keep groups fixed.  
  - Distribute tokens and scorecards.  
  - Explain: *"Each round, you have 10 tokens. Decide privately how many to contribute to a group project. Your payoff: tokens kept + project value. Your goal: maximise personal payoff."*  

  ---

  ### **Round Rules (Total: 60 mins)**  
  *Rules are revealed only at the start of each round. Payoff formulas are written on the board.*

  #### **Round 1: Summation (No Communication, 10 mins)**  
  - **Rule:** *"Project value = 0.4 × total tokens contributed. Divided equally among all."*  
    *(e.g., Total = 20 → Value = 8 → Each gets 8).*  
  - **Payoff:** `(10 - your contribution) + (0.4 × group total)`  
  - **Rationale:** Free-riding dominates (individual return = 0.4 < 1).  
  - **Activity:** No talking. Students contribute tokens privately.  

  #### **Round 2: Weakest-Link (No Communication, 10 mins)**  
  - **Rule:** *"Project value = 2 × the smallest contribution in your group."*  
    *(e.g., Min = 3 → Value = 6 → Each gets 6).*  
  - **Payoff:** `(10 - your contribution) + (2 × group min)`  
  - **Rationale:** Fear of low min causes under-contribution.  
  - **Activity:** No talking. Contribute privately.  

  #### **Round 3: Best-Shot (With Communication, 20 mins)**  
  - **Rule:** *"Project value = 2 × the largest contribution in your group."*  
    *(e.g., Max = 8 → Value = 16 → Each gets 16).*  
  - **Payoff:** `(10 - your contribution) + (2 × group max)`  
  - **Rationale:** Volunteers lose out (contributor gets 16, free-riders get 26).  
  - **Activity:** Groups discuss for 2 mins (*"Plan contributions, but decisions are private and non-binding"*). Contribute privately.  

  #### **Round 4: Threshold (With Communication, 20 mins)**  
  - **Rule:** *"Project value = 20 for everyone if total ≥ 30. Else, 0."*  
  - **Payoff:** `(10 - your contribution) + 20 (if total ≥ 30) or 0 (if total < 30)`  
  - **Rationale:** Coordination solves the problem.  
  - **Activity:** Groups discuss for 2 mins. Contribute privately.  

  ---

  ### **Scoring & Feedback (10 mins)**  
  - **After each round:**  
    1. Collect contributions.  
    2. For each group, compute and announce:  
       - *Round 1:* Group total → Project value (0.4×total).  
       - *Round 2:* Smallest contribution → Project value (2×min).  
       - *Round 3:* Largest contribution → Project value (2×max).  
       - *Round 4:* Group total → Met threshold? (Yes/No) → Project value (20 or 0).  
    3. Students record on scorecards:  
       - **Group result** (e.g., "Total=15, Value=6").  
       - **Personal payoff** (tokens kept + project value).  

  **Sample Scorecard:**  
  | Round | Rule Hint          | My Contribution | Group Result | Project Value | My Payoff |  
  |-------|--------------------|-----------------|--------------|---------------|-----------|  
  | 1     | "Total matters"    | _____           | _____        | _____         | _____     |  
  | 2     | "Smallest matters" | _____           | _____        | _____         | _____     |  
  | 3     | "Largest matters"  | _____           | _____        | _____         | _____     |  
  | 4     | "Target: 30"       | _____           | _____        | _____         | _____     |  

  ---

  ### **Debrief (15 mins)**  
  **1. Map Rounds to Structures:**  
  - **Round 1 (Summation):** Free-riding rational. *"Why did contributions drop? Greed? Or because 0.4 < 1?"*  
  - **Round 2 (Weakest-Link):** Strategic uncertainty. *"Why wait? Not selfishness—fear of wasting effort if others contribute less."*  
  - **Round 3 (Best-Shot):** Volunteer’s dilemma. *"Even with communication, did volunteers lose out? Free-riders won, so no one wants to step up."*  
  - **Round 4 (Threshold):** Coordination solvable. *"Communication worked here—why not in Round 3?"*  

  **2. Structural vs. Motivational Explanations:**  
  - Ask: *"Did you become ‘greedier’ in Round 1? Or did the rule make free-riding rational?"*  
  - Contrast: Same people cooperated in Round 4 but failed in Round 3. Preferences unchanged—**aggregation rules** drove outcomes.  
  - **Key insight:** Strategic uncertainty (Rounds 2–3) and marginal returns (Round 1) matter more than selfishness.  

  **3. Limitations of the Activity:**  
  - *"This misses real-world dynamics: slow norm-building, reputation, ecological feedback (e.g., irreversible overfishing). We isolated aggregation rules to show their power."*  

  ---

  ### **Facilitator’s Cheat Sheet**  
  **Payoff Formulas & Equilibria:**  
  | Round | Aggregation      | Project Value (V)             | Expected Equilibrium      |  
  |-------|------------------|-------------------------------|---------------------------|  
  | 1     | Summation       | V = 0.4 × group total        | All contribute 0 (payoff=10). |  
  | 2     | Weakest-Link    | V = 2 × group min            | All contribute 0 (payoff=10). |  
  | 3     | Best-Shot       | V = 2 × group max            | No contributors (payoff=10) or ≥2 over-contributors (e.g., two contribute 10 → payoff=20 each; free-riders get 30). |  
  | 4     | Threshold (30)  | V = 20 if total ≥30; else 0  | Total ≥30 (e.g., all contribute 8 → payoff=22 each). |  

  **Predicted Issues & Fixes:**  
  - **Problem:** Students dismiss points as "not real money."  
    **Fix:** *"Treat tokens as real income—maximising payoff reveals how you’d act in real dilemmas."*  
  - **Problem:** Rules opaque in Rounds 2–3.  
    **Fix:** Use examples (e.g., *"If min=3, V=6 for all"*). Check understanding pre-decision.  
  - **Problem:** Someone guesses the "twist" early.  
    **Fix:** *"Rules change, but focus on this round’s payoff. No ‘meta-gaming’."*  
  - **Problem:** Round 3 communication leads to fair shares (e.g., rotation).  
    **Fix:** In debrief, note: *"Without enforceable deals, volunteering fails long-term."*  

  **Weakest Design Element:**  
  - **Round 3 (Best-Shot):** Assumes communication won’t resolve volunteer’s dilemma (empirically, groups often over-volunteer or under-provide).  
  - **Redesign if:** Groups consistently get exactly one volunteer (e.g., by lottery).  
    **Solution:** Increase free-rider payoff (e.g., `Payoff = (10 - c_i) + 3 × max` to make volunteering even less attractive).  
  - **Supporting Evidence:** Experimental data (Diekmann, 1985) shows volunteer rates <25% in 4-player games without incentives.  

  **Materials to Print:**  
  - **Contribution Slips:** Blank slips (Name, Group, Contribution).  
  - **Scorecards:** Table with rounds, rule hints, and columns for results.  
  - **Facilitator Sheet:** Payoff formulas, group tracker grid.  

  **Timeline Summary:**  
  - 0–5 mins: Setup.  
  - 5–60 mins: Rounds 1–4 (contributions + scoring).  
  - 60–75 mins: Scorecard fill-in.  
  - 75–90 mins: Debrief.  

  This design forces students to *feel* structural constraints, using identical stakes to isolate aggregation rules. The payoff numbers ensure predicted equilibria emerge, and communication in Rounds 3–4 highlights its context-dependent power.
