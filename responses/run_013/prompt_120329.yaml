     Payoff = (Tokens kept) + (Value from public good)

   The value from the public good depends on the round's rule. We will have:
     Round 1: Summation (total contributions matter)
     Round 2: Weakest-link (minimum contribution matters)
     Round 3: Best-shot (maximum contribution matters)
     Round 4: Threshold (a fixed target must be reached by the sum)

