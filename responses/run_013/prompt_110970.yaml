prompt: |-
  I am a novelist, some way into a book that I had assumed was a book about people and now realize is a book about categories — specifically about whether the categories that bear hardest on my characters are discovered or made. The difficulty is not that I lack opinions; it is that my characters hold incompatible ones, and I have reached the point where I can no longer write a scene in which someone asserts that a kind is socially constructed without knowing what would have to be true for the assertion to be more than a gesture. I am not asking you to settle the metaphysics. I am asking you to tell me what a theory of socially constructed kinds would have to get right before I let any character use the word.

  Give me the specification: the requirements any adequate account of "kind K is socially constructed" must satisfy, with the consideration or case that motivates each. I would expect the list to include at least the following, and I want each one made precise and defended rather than merely named. First, a usable contrast class: what it is for a kind *not* to be socially constructed, on pain of the claim collapsing into the truism that everything depends on human activity somewhere. Second, the distinction between a kind's being caused or shaped by social arrangements and its being constituted by them — money and mountains presumably differ here, and I want the criterion that marks the difference. Third, an account of why social kinds present themselves as external and constraining, resistant to individual revision, when they are also the products of collective practice. Fourth, the feedback phenomenon: classification that alters the classified, so that the kind's extension at one time is not the extension it would have had under a different label. Fifth, a way of saying that constructed kinds are nonetheless real, causally efficacious, and objects of genuine knowledge, without thereby reducing to the claim that they are arbitrary or fictional. Sixth, room for historical and cross-cultural variation, and for the possibility that a person can be substantially mistaken about the kind she herself inhabits. Seventh, a clean separation between the conditions under which a kind exists and the conditions under which something is a member of it. Eighth, an account of what, if anything, follows — epistemically or normatively — from a kind's being constructed, since this is where the argument in my book actually lives. Ninth, consistency with whatever the relevant empirical disciplines establish about the kind in question. Tenth, an answer to who or what does the constructing, and by what mechanism, so that "constructed" is not merely a place-holder for an unspecified social process.

  Then, and this is the part I care most about: mark which of these are genuine desiderata and which are commitments of one camp that a rival account could reasonably reject; identify any pair that cannot be jointly satisfied, and say whether the conflict is a genuine result about the subject or an artifact of how the requirements were stated; and tell me which single requirement does the most to eliminate otherwise popular accounts. Test the finished list against money, against gender, and against race — money, I take it, is the case where construction and reality most obviously coexist and so makes the best control — and against one kind you regard as plainly not constructed, so that I can see the list bite. I have no interest in a bibliography; refer to positions and arguments as you like, and I will attach the sources myself. What I need is a specification I could hand to a character and have her argue from.
reasoning: |-
  Okay, the user is a novelist working on a book that started as a character study but evolved into an exploration of categories—specifically, whether the categories affecting their characters are discovered or socially constructed. They're stuck because their characters hold conflicting views, and the author can't write scenes where someone claims a kind is socially constructed without understanding what makes that claim substantive. They need a clear specification for what "socially constructed" means, with precise requirements any theory must satisfy, and then an analysis of those requirements.

  The user provided a list of ten specific requirements they want addressed. Each needs to be made precise and defended, not just named. Let me go through them one by one, thinking about what each entails. 

  First, the contrast class. To avoid everything being socially constructed by default, there must be a clear distinction. Natural kinds like electrons or tigers exist independently of human society, while social kinds like money require human practices. The key is whether their existence depends on social recognition.

  Second, the difference between being caused by social arrangements versus constituted by them. Money is constituted by collective agreement—it wouldn't exist without it. Mountains are shaped by human concepts (like which peaks are named) but their physical existence is independent. Constitution involves necessary dependence; without the social practices, the kind ceases to exist.

  Third, why social kinds feel external and constraining. This ties to collective intentionality—once a status is assigned, it gains objectivity through networks of beliefs and institutions. Individuals can't easily change it because it's upheld by societal structures, making it resistant to individual revision.

  Fourth, feedback loops. Classification can alter the classified, as in the labeling theory in criminology where being called a criminal might influence behavior. The kind's extension changes based on the label itself, creating a dynamic interaction.

  Fifth, constructed kinds must be real and causally efficacious without being arbitrary. Money influences economies; gender roles affect life outcomes. They're real because they have tangible effects, even if their foundations are social agreements. They're not fictional because they're intersubjectively real and durable.

  Sixth, variation and error. Social kinds differ across cultures and history. Someone might be mistaken about their own kind, like a person unaware of systemic biases affecting their social category. This shows that social construction isn't always conscious or intentional.

  Seventh, separation between existence conditions and membership conditions. For money, existence requires a financial system; membership depends on objects being designated as currency. An object can be money only if the system exists, but the system's existence doesn't depend on any single object.

  Eighth, implications of construction. Knowing a kind is constructed can shift perspectives—it might delegitimize it or highlight its mutability. Normatively, it could demand reform if the kind perpetuates injustice. However, it doesn't automatically imply eliminability or ethical flaws; that requires additional argument.

  Ninth, consistency with empirical disciplines. Theories must align with findings from sociology, history, etc. For example, race as a social construct must fit biological data showing no genetic clusters matching racial categories.

  Tenth, specifying the constructor and mechanism. It's not vague "society" but collective acceptance, institutional enforcement, or discursive practices. E.g., gender is constructed through socialization, laws, and cultural norms.

  Now, analyzing these requirements: Which are genuine desiderata vs. camp-specific? For instance, the contrast class and causal efficacy are likely universal; any theory must address them. However, the emphasis on feedback loops might be more crucial for some theories (like Hacking's) than others. Conflict might arise between realism and normative implications—saying a kind is constructed doesn't inherently imply it should be abolished, but some theories might push that way, which isn't logically necessary.

  Testing against examples: Money clearly fits all criteria—constituted by agreement, real effects, etc. Gender shows feedback loops (social expectations shape behavior). Race has historical variation and biological inconsistency. Tigers as a natural kind fail the constitution requirement—their existence doesn't depend on human recognition.

  The most eliminative requirement is likely constitution vs. causation. Many theories conflate the two, but the distinction is crucial. If a kind is merely influenced by society (like mountains), it's not constructed; constitution is necessary for true social construction.

  The user needs this for their characters to argue credibly. The specification must be robust enough to withstand in-story debates, showing depth without resolving the metaphysics. Highlighting tensions, like between realism and normativity, can fuel character conflicts naturally.
answer: |-
  Below is a **strict specification** for the phrase "kind K is socially constructed," designed as a defensible framework your characters could wield in argument. Each requirement is precise, motivated by a concrete case, and tested against core examples (money, gender, race, tigers). The analysis identifies tensions, desiderata, and eliminative power.

  ---

  ### **The Specification: 10 Requirements for "K is Socially Constructed"**
  *(With motivation, precision, and defense)*

  1. **Contrast Class (Non-Constructed Kinds)**  
     - **Requirement:** K is socially constructed *only if* it would not exist or have its core properties in a world without human minds, languages, or social practices. Non-constructed kinds exist independently of human interpretation (e.g., tectonic plates).  
     - **Motivation:** Avoids collapsing into truisms (e.g., "mountains depend on human activity for *naming*").  
     - **Precision:** K fails this if its existence/properties are fixed by non-social facts (e.g., water is H₂O regardless of human concepts).  
     - **Defense:** Money vanishes without society; tectonic plates do not. "Dependence" must be *existential*, not epistemic or causal.

  2. **Constitution vs. Causation**  
     - **Requirement:** K is *constituted* (not merely *caused* or *shaped*) by social practices. K’s members are defined by their place in a system of rules, roles, or collective intentionality.  
     - **Motivation:** Distinguishes money (constituted by agreement) from mountains (causally shaped by human mining, but still geologically defined).  
     - **Precision:** K is constituted if: (1) Facts about K are *ontologically dependent* on social facts; (2) K cannot be reductively explained by non-social facts alone.  
     - **Defense:** A gold coin is money only by social status; its mass is intrinsic. Gender roles (e.g., "nurse") are constituted; biological sex is causally influenced but not constituted by society.

  3. **Objectivity & Constraint**  
     - **Requirement:** K presents as external/resistant because it is *institutionally embedded* and *collectively sustained*. Individuals cannot revise K alone because it requires coordinated deontic power (rights/duties enforced by groups).  
     - **Motivation:** Explains why race/gender feel "real" despite being mutable collectively.  
     - **Precision:** K’s constraining power arises from: (1) Penalties for non-compliance (e.g., jail for counterfeit money); (2) Network effects (e.g., one person rejecting gender norms doesn’t dismantle them).  
     - **Defense:** A dollar bill’s value persists because millions of strangers honor it; an individual’s refusal cannot erase it.

  4. **Feedback Loops (Dynamic Enactment)**  
     - **Requirement:** K’s classification alters its instances, creating a feedback loop where the label changes the behavior/identity of the classified.  
     - **Motivation:** Race classifications alter life outcomes (e.g., via redlining), which reinforces the kind’s "reality."  
     - **Precision:** K has feedback iff: (1) Knowing one is classified as K changes traits relevant to K; (2) K’s extension at t₁ differs from what it *would have been* under a different label at t₀.  
     - **Defense:** Calling someone "criminal" may increase recidivism; calling copper "money" changes its use.

  5. **Reality Without Reduction**  
     - **Requirement:** K is real and causally efficacious *because* of its social constitution, not despite it. Its reality is irreducible to individual psychology or non-social substrates.  
     - **Motivation:** Money causes inflation; gender norms shape careers. Denying their reality is incoherent.  
     - **Precision:** K is real if: (1) It has causal powers (e.g., being "Black" affects health outcomes); (2) It is intersubjectively stable (not hallucinatory).  
     - **Defense:** Arbitrary foundations (e.g., arbitrary fiat currency) still produce non-arbitrary effects (e.g., recessions).

  6. **Variation & Fallibility**  
     - **Requirement:** K must admit historical/cross-cultural variance in its boundaries or significance, and allow that individuals can be systematically mistaken about what K entails.  
     - **Motivation:** "Race" meant lineage in 1700s Virginia, biology in 1900s Germany, and is contested today.  
     - **Precision:** (1) K in culture C₁ ≠ K in C₂ in membership or properties; (2) A member of K can falsely believe K is natural/immutable.  
     - **Defense:** Medieval "gender" included single-sex models; modern individuals may misattribute their struggles to biology rather than norms.

  7. **Existence vs. Membership Conditions**  
     - **Requirement:** The conditions for K *existing* (as a kind) must differ from conditions for an individual *being a member* of K.  
     - **Motivation:** Money exists as a system even if specific coins are disputed; race exists as a structure even if specific people are racially ambiguous.  
     - **Precision:** K exists if social practices sustain its constitutive rules; X is a member if X satisfies those rules in context.  
     - **Defense:** "USD" exists as a currency type; a torn $1 bill may not be a token member. "Racialized" exists; a person’s membership depends on local rules.

  8. **Epistemic/Normative Implications**  
     - **Requirement:** Acknowledging K is constructed implies: (1) *Epistemically*, K can be studied via social sciences (not just natural sciences); (2) *Normatively*, K’s contingency opens it to critique/reform, but does *not* automatically entail abolition.  
     - **Motivation:** Characters weaponize "constructed" to delegitimize K (e.g., gender) or defend it (e.g., money).  
     - **Precision:** Construction implies: (a) K’s properties are not fixed by nature; (b) But K may still be functionally necessary or just.  
     - **Defense:** Knowing money is constructed justifies central banks; it doesn’t imply we should return to barter.

  9. **Empirical Consistency**  
     - **Requirement:** Any account of K must cohere with findings from relevant sciences (e.g., biology for race, economics for money).  
     - **Motivation:** Racial constructionism fails if it denies biological diversity; gender constructionism fails if it ignores endocrinology.  
     - **Precision:** Constructionism explains how social processes *interact* with non-social facts (e.g., biology constrains but doesn’t fix gender).  
     - **Defense:** Race is constructed because genetic variation doesn’t map to social categories; money is constructed because value isn’t intrinsic to paper.

  10. **Constructor & Mechanism**  
      - **Requirement:** Specify *who* constructs K (e.g., institutions, communities) and *how* (e.g., laws, rituals, language). "Society" is insufficient.  
      - **Motivation:** Vague appeals to "construction" mask power dynamics (e.g., who gets to define race?).  
      - **Precision:** Identify: (1) Key actors (e.g., states for money, physicians for historical gender); (2) Mechanisms (e.g., enforcement, habituation, discourse).  
      - **Defense:** Money is constructed by central banks (actors) via legal tender laws (mechanism); gender by families/media via socialization.

  ---

  ### **Analysis: Desiderata, Conflicts, and Elimination**
  **Genuine Desiderata (all accounts must address):**  
  - Requirements 1 (contrast), 5 (reality), 6 (variation), 7 (existence/membership), 9 (empirical consistency).  
  *Why:* Without these, "constructed" loses meaning or becomes empirically vacuous. Even skeptics must engage (e.g., a realist about race must explain variation).

  **Contingent Commitments (rival accounts may reject):**  
  - Requirements 4 (feedback) and 8 (normative implications).  
  *Why:* Biological determinists deny feedback loops matter; minimalists argue construction has *no* normative consequences. These are battle lines, not neutral demands.

  **Inherent Tensions:**  
  - **Tension 1:** Feedback loops (4) vs. Reality (5). *Conflict:* If K changes when labeled, is it stable enough to be "real"? *Resolution:* Not artifactual—dynamic kinds *are* unstable (e.g., evolving gender norms), but their effects are real at a time-slice.  
  - **Tension 2:** Objectivity (3) vs. Normative implications (8). *Conflict:* If K feels immutable, does admitting construction imply dismantling it? *Resolution:* Construction explains *why* change is hard (collective action required), not that it’s unjust.  

  **Most Eliminative Requirement:**  
  - **#2 (Constitution vs. Causation)**. Eliminates:  
    - Weak social shaping (e.g., "mountains are constructed because we name them").  
    - "Human-dependent" natural kinds (e.g., "diseases are constructed because we define health").  
    *Why:* Constitution requires K to *be* its social role, not just be affected by it.  

  ---

  ### **Testing the Specification**
  | **Kind**       | Passes Requirements?                                                                                                | Key Test Case                                          |
  |----------------|---------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------|
  | **Money**      | Yes: Contrast (1), Constituted (2), Constraining (3), Feedback (4: e.g., inflation), Real (5), Variable (6: e.g., shells vs. crypto), etc. | *Control:* Shows construction/reality coexist.        |
  | **Gender**     | Partially: Fails if defined as biological sex (violates 1,2); passes if defined as roles/identity (satisfies 1–10). | Feedback (4): Gender socialization alters behavior.   |
  | **Race**       | Partially: Fails if posed as biological (violates 9); passes as hierarchical categorization (satisfies 1–10).       | Variation (6): "Race" in Brazil vs. USA differs.      |
  | **Tigers**     | **Fails**: Natural kind (independent of society, no feedback loops, not constituted by rules). Fails 1,2,3,4,6,7,10.| Contrast (1): Exists without humans.                  |

  ---

  ### **Why This Works for Your Characters**
  - **Arguable & Nuanced:** Requirements 4 and 8 are contested ground—a character can reject feedback loops or insist construction *must* imply injustice.  
  - **Bites Where It Should:** Money satisfies cleanly; tigers fail decisively; gender/race expose fault lines (e.g., "Is gender constituted or caused?").  
  - **Mechanisms Over Metaphysics:** Focuses on *how* construction works (e.g., feedback loops, institutional enforcement), letting characters clash over concrete processes.  
  - **Room for Error:** Requirement 6 allows characters to be wrong about their own kind (e.g., "I thought race was biological, but it’s the housing policy that constructs me").  

  Hand this to your character. She can now say: "Calling gender constructed isn’t a gesture. It means our practices *constitute* it, not just influence it—and that’s why we can change it, but not alone."
