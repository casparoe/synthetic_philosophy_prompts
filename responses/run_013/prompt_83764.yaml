  ### The Case: The Divorced Artists' Dilemma

  Lena and Mark, once a married couple, are now bitterly divorced and living in separate countries with no contact—no mutual friends, no shared assets, and no way to communicate or influence each other directly. Mark, a struggling artist, has learned that Lena, a gallery owner, is planning to publicly auction his most valuable painting, "Azure Dreams," which she legally owns but he emotionally claims. The auction would net Lena $20,000 (a few months' income for her) but devastate Mark, who values the painting at $15,000 for its personal significance and potential future sales. Lena, knowing Mark might retaliate by smearing her reputation in art circles (which would cost her $10,000 in lost business), sends Mark a one-way message via an encrypted, anonymous channel (which he receives but cannot reply to or verify beyond the message itself): "If you attack my reputation, I will burn 'Azure Dreams.' And to prove I mean it, I will irreversibly hypnotize myself to genuinely despise this painting and crave its destruction. This will cost me $1,000 for the hypnotist and the pain of destroying something I once loved. If you stay silent, I won’t change and won’t burn it." Lena then undergoes hypnosis, genuinely becoming someone who would burn the painting with satisfaction if provoked. She documents the hypnosis but cannot send proof to Mark due to their isolation. Mark, receiving only the initial message, must decide: attack Lena’s reputation (gaining catharsis and potentially $5,000 from sympathy sales) or stay silent (preserving the painting’s emotional value).  

  **The Work**  
  Lena, post-hypnosis, now truly wants to burn the painting if Mark attacks. She locks it in a storage unit with a webcam, vowing to herself she’ll torch it upon confirming Mark’s aggression. Mark, isolated and unable to verify Lena’s claim, weighs his options. If he attacks, he might gain $5,000 and emotional release but risks losing the painting. If he stays silent, he avoids that risk but gains nothing. He recalls Lena’s stubbornness—she rarely bluffed when angry. Lena, meanwhile, has already paid the $1,000 hypnotist fee and feels the loss of her former love for the art. If Mark attacks, she’ll burn the painting, costing her the $20,000 auction potential plus the $1,000 change cost. If he stays silent, she avoids burning it but has wasted $1,000 and altered herself. Mark, fearing her resolve, stays silent. Lena auctions "Azure Dreams" safely, netting $19,000 after the hypnotist fee ($20,000 - $1,000), better than if she’d done nothing (where Mark might have attacked, costing her $10,000 in reputation damage). But had Mark attacked, she would have burned the painting, leaving her at a $21,000 loss ($20,000 auction + $1,000 fee), worse than the $10,000 loss from an attack without her threat.  

  ---

  ### Analysis  

  1. **Plain Causal Reasoning (Causal Decision Theory - CDT)**  
     - **Lena’s perspective:** Changing herself costs $1,000 and doesn’t causally affect Mark’s decision—he can’t see it. Rational choice: Don’t change, as it wastes money. Threat is an empty performance.  
     - **Mark’s perspective:** No proof Lena changed. Her threat can’t physically reach him. Rational choice: Attack to gain $5,000, as the painting’s destruction isn’t causally tied to his actions.  
     *Conclusion:* Threat shouldn’t be believed. Mark attacks, Lena loses $10,000. Threat fails.  

  2. **Evidential/Reflective Reasoning (Evidential Decision Theory - EDT)**  
     Here, treat Mark’s decision as evidence about Lena’s (and vice versa), assuming both use similar reasoning.  
     - **Lena’s view:** "If I change myself, it’s evidence Mark is like me—rational and cautious—so he’ll likely stay silent to avoid loss. Thus, changing is evidence I avoid the $10,000 attack cost, netting me $19,000 vs. $20,000."  
     - **Mark’s view:** "If I attack, it’s evidence Lena didn’t change (since a rational Lena would only change if she expected silence). So I expect no burning and gain $5,000. If I stay silent, it’s evidence Lena changed and I gain nothing."  
     *Conclusion:* EDT splits. Lena changes expecting silence. Mark attacks expecting no change. Result: Mark attacks, Lena burns the painting. Both lose (Lena: -$21,000; Mark: -$10,000 painting loss). The threat fails. **This isn’t pure EDT but a "twin reasoning" variant—it fails here because mutual reflection doesn’t guarantee coordination when stakes diverge.**  

  3. **The Key Feature and Its Removal**  
     - **Key feature:** Lena’s *pre-commitment cost* ($1,000 and irreversible self-change). This makes the threat non-bluff, forcing Mark to confront its credibility.  
     - **Remove it:** If Lena’s threat costs nothing (e.g., she says, "I’ll burn it!" but doesn’t change herself), it’s an ordinary bluff. Mark attacks, knowing she won’t destroy $20,000 art. Lena loses $10,000, worse than her threatened outcome. Case collapses into an empty threat.  

  4. **Skeptic’s Strongest Attack**  
     "The threat is irrational hot air. Lena can’t prove she changed, so Mark ignores it. Even if he considers it, his attack doesn’t *cause* the burning—Lena’s independent choice does. If she burns it, she’s just self-harming. Rational Mark attacks for gain. Rational Lena never wastes $1,000 on an unobservable change. This ‘acausal’ link is just magical thinking—it only ‘works’ in the story because Mark irrationally caves to paranoia about Lena’s personality, not logic."  

  5. **Requirements Conflict and Resolution**  
     - **Conflict:** Cut-off isolation (#2) vs. surrogate goal credibility (#3) vs. threatener coming ahead (#5). Isolation prevents proof of the surrogate goal, making the threat ignorable. If Lena can’t show she changed, Mark won’t believe it, and her gamble fails.  
     - **Which to give up:** Drop #2 (strict cut-off). Allow one-way, non-verifiable communication (e.g., Lena’s message is received but not provable). This mirrors "real-world" threats where credibility hinges on reputation, not proof. In the case, Mark’s knowledge of Lena’s stubbornness makes the threat plausible. If you insist on total isolation, the threat fails—Lena shouldn’t bother.  

  ---  
  **Why the Threat Fails (as Requested)**  
  The acausal threat fails in causal and reflective reasoning. Mark attacks because he gains if Lena bluffed and loses nothing if she didn’t (his attack doesn’t cause the burning). Lena’s change is a costly gamble that only pays if Mark cooperates, but his dominant move is betrayal. The "twin reasoning" doesn’t save it—their incentives aren’t symmetric enough to align decisions. The surrogate goal adds weight but can’t bridge the isolation gap. You didn’t smuggle in cooperation; it falls apart naturally.
