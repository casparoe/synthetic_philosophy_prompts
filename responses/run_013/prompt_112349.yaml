prompt: |-
  I have twice now tried to describe the same structural situation to someone and found that I could not do it without drawing a picture, and I would like to know whether there is an established name for it, or whether I should coin one.

  The situation is this. Two things determine each other. A is what it is because of B, and B is what it is because of A, and neither can be specified without already invoking the other. The clearest instance I have is a poster I once saw in a dormitory room: two hands, each holding a pen, each in the act of drawing the other, the left hand drawing the right and the right hand drawing the left, with the cuffs of the sleeves trailing off the edge. A second instance is a company whose policy manual contains the rule that the manual may be revised only by a two-thirds vote of the board, while the board's authority to vote, and its very composition, are fixed by the manual. A third is a wiki on which any page may be edited by anyone, including the page that states the editing policy, so that the rule about who may change the rules is itself changeable by the same procedure it governs. A fourth, which I include because it makes me uneasy, is a program that rewrites its own source code, including the routine that decides how source code is to be rewritten.

  In each case the mutual determination is not, I think, the whole story. Something further seems to be required that is not itself one of the two mutually determining items, and the odd part is that this further thing does not present itself as simply one level further up. It is not another item of the same kind standing above the pair; it is the thing the pair is, as it were, drawn on. In the poster, the sheet of paper, which is not inside either hand's drawing. In the manual case, the fact that anyone treats the manual as authoritative at all. In the wiki case, the bare fact that edits happen. Yet I cannot articulate what makes the sheet a different kind of thing rather than merely the next storey, and in some of my cases the candidate for that outside position appears to be within reach of the mutual determination after all: the community can revise the norms that govern revising, and the program can rewrite the routine that governs rewriting. So I cannot tell whether the outside position is a genuine structural necessity or merely wherever I happened to stop the description.

  What I want is not a label but a carving. Is there a name for the mutual-determination structure, and a name for the item that occupies the outside position? How does the first differ from ordinary circularity, from a vicious circle, and from an infinite regress, and how does the second differ from a foundation, an axiom, or a first cause? Is the outside item always required, or is its apparent necessity an artifact of the examples I chose? How, in a given case, do I distinguish an item that is genuinely outside the mutual determination from one that is merely a level I have stopped asking about — and what happens to the picture when the two mutually determining items can reach the item that was supposed to stand outside them? A friend who has read some logic tells me it is all just the familiar point about a system that talks about itself, or about a language that cannot contain its own truth predicate, but my cases are about authority, depiction, and revision rather than truth or proof, and I suspect several different things are being run together under that reply. If there is no established term, I would like a proposed one, with a definition and with the cases that fall just outside it, since I am fairly sure the boundary cases are where the interest lies.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They've encountered a structural situation where two things, A and B, mutually determine each other, and they can't describe it without a visual. They provided examples like the drawing hands, a company policy manual, a wiki, and a self-modifying program. The key points are mutual determination and the need for an "outside" element—like the paper for the drawing or the community for the wiki.

  First, I need to identify the core structure. Mutual determination sounds like circularity, but it's not vicious because it's functional. The examples show that A and B are interdependent but operate together. Terms like "co-definition" or "mutual constitution" come to mind. Then there's the outside element, which seems necessary for the system to exist but isn't part of the mutual loop. The user is unsure if this element is a true foundation or just where they stopped describing.

  The user’s deeper needs might include clarity on whether this structure is a recognized concept, how to differentiate it from similar ideas (like circularity or regress), and how to handle the boundary where the outside element might be reachable by the system. They also want to know if the outside is always necessary or an artifact of their examples.

  Looking into established concepts: in philosophy, there's mutual constitution in social theory (Giddens). In systems theory, autopoiesis involves self-creation but needs an environment. In logic/computing, reflexivity and quines relate but focus on self-reference without mutual determination. The user’s cases emphasize authority and dynamic revision, which might not fit neatly into existing terms.

  The challenge is distinguishing the outside element from a higher level. The user is uneasy about the program rewriting its own rewrite routine, which questions if the outside is truly external. Maybe the outside is a condition of possibility—like the medium or context enabling the system. For the wiki, it's the community's practice; for the program, the hardware/compiler. Even if the system can modify its rules, the context (e.g., physical laws) remains external.

  The user might need terms that capture both mutual determination and the external enabler. Co-specification for the pair, and enabling substrate for the outside. Emphasizing the dynamic aspect: operational closure vs. material dependence. Also, clarifying that the substrate isn't governed by the rules it enables, even if the system can alter its own rules within that substrate.

  Boundary cases: when the system can modify the substrate (like a program altering compiler settings). Here, the substrate shifts—maybe the hardware becomes the new substrate. The key is whether the modification relies on something external. If entirely self-contained, it’s a different structure, but in practice, there’s always an external dependency.

  The user’s friend mentioned logical self-reference, but their examples involve action and authority, not just truth. So the response should address the practical, operational aspects. Terms should reflect that mutual determination is dynamic and the substrate is the necessary context that allows the system to function without being part of it.

  Proposing "co-specification" and "enabling substrate" with clear definitions. Co-specification: mutual, functional interdependence. Enabling substrate: the non-arbitrary medium/context. Highlighting boundary cases where the substrate seems reachable, explaining that the substrate is relative to the system's scope. If the system encompasses more, the substrate moves outward, but never disappears.
answer: |-
  Your structural intuition is profound and touches on several interconnected philosophical, logical, and systems-theoretic concepts. While no single established term captures *all* facets you describe, the core structure has recognizable names, and the "outside position" is a critical (and often undertheorized) element. Below is a carving of the concepts, proposed terminology, boundary cases, and distinctions.

  ---

  ### **1. The Mutual-Determination Structure: Established Names & Distinctions**
  - **Core Term:** **Mutual Constitution** or **Co-specification**.  
    - **Definition:** A relationship where **A** and **B** are reciprocally dependent: **A** defines/creates/sustains **B**, and **B** defines/creates/sustains **A**, such that neither can exist or be fully specified independently.  
    - **Distinctions from Similar Concepts:**  
      - *Circularity*: Mere logical or causal loops (e.g., "A causes B, B causes A") lack *functional interdependence*. Your cases involve **operational entanglement** (e.g., the hands *enact* each other’s depiction; the wiki policy *enables* its own editing).  
      - *Vicious Circle*: A fallacy where no progress is possible (e.g., defining "truth" as "non-falsehood" and vice versa). Your examples are **productive loops**: they *generate* stable systems (a drawing, a company, a wiki).  
      - *Infinite Regress*: A linear chain of dependencies (A depends on B, B on C...). Mutual constitution **collapses the regress** into a closed loop (e.g., the policy manual *ends* the regress of "who governs the governors?" by looping back).  
    - **Established Contexts:**  
      - Philosophy (Hegel, Sartre): Master-Slave dialectic (each defines the other’s identity).  
      - Systems Theory (Maturana/Varela): *Autopoiesis* (self-creation via recursive component interactions).  
      - Computer Science: *Self-modifying code* or *reflexive systems*.  

  ---

  ### **2. The "Outside Position": The Enabling Substrate**
  - **Core Term:** **Enabling Substrate** (or **Constitutive Medium**).  
    - **Definition:** The **non-arbitrary context or medium** that permits the mutually constitutive pair (A/B) to exist and function, but which is *not itself constituted by A/B*. It is the condition of possibility for the loop.  
    - **Why It’s Not Just "Another Level"**:  
      - The substrate is **ontologically distinct**: it is the *frame* (paper), *practice* (acceptance of authority), or *material basis* (hardware for self-modifying code) that *enables* the loop but *is not governed by its rules*.  
      - Attempts to internalize it (e.g., a program rewriting its rewrite-routine) merely **shift the substrate outward** (e.g., to the compiler or physical laws).  
    - **Distinctions from Similar Concepts:**  
      - *Foundation/Axiom*: Static and immutable (e.g., mathematical axioms). Your substrate is **dynamic but non-participatory**—it *allows* change but isn’t changed *by* the rules (e.g., the wiki community *uses* the edit function but isn’t *defined* by it).  
      - *First Cause*: A prime mover *within* the causal chain. Your substrate is **pre-causal**—it is the *stage*, not an actor.  

  ---

  ### **3. Is the Substrate Always Necessary? Yes, but It Can Be Obscured**  
  - **Necessity Argument**: Every operational loop requires a **medium of operation**. The hands need paper; the policy manual needs social recognition; code needs hardware. Without this, mutual constitution is abstract, not actualized.  
  - **The "Reaching" Problem**: When A/B seem to "reach" the substrate (e.g., a wiki editing its own policy page), it’s an **illusion of closure**:  
    - The wiki’s *ability to edit* relies on the substrate (e.g., server infrastructure, user consensus), which remains outside the *content* of the rules.  
    - **Boundary Case**: A *fully* self-contained AI that rewrites its own physics. Even here, the substrate is the **initial conditions/hardware** enabling the first rewrite. True self-containment is likely impossible (per Gödel/Turing: systems cannot fully define themselves).  

  ---

  ### **4. Proposed Terminology for Precision**  
  | **Concept**               | **Proposed Term**       | **Definition**                                                                 | **Example**                                     |  
  |---------------------------|-------------------------|--------------------------------------------------------------------------------|-------------------------------------------------|  
  | Mutual determination      | **Operational Co-specification** | A/B interdependently define each other *through action* (not just logic).      | Hands drawing each other; wiki policy & edits. |  
  | The "outside" element     | **Enabling Substrate**  | The non-constituted medium enabling the co-specification loop.                 | Paper for drawing; community trust for a wiki. |  
  | System as a whole         | **Reflexive System**    | A system whose operations recursively apply to its own components.             | Self-modifying code; self-governing policy.    |  

  ---

  ### **5. Boundary Cases: Where the Carving Blurs**  
  - **Case 1: Autopoietic Systems** (e.g., living cells).  
    - *Co-specification*: Cell components recursively produce each other.  
    - *Substrate*: The physical environment (nutrients, energy).  
    - *Boundary Issue*: If the cell alters its environment (e.g., building a wall), the substrate is "reached." **Resolution**: The *capacity* to alter the environment still depends on deeper substrates (laws of physics).  
  - **Case 2: Self-Grounding Laws** (e.g., "This constitution is the supreme law").  
    - *Co-specification*: The law defines authority, and authority enforces the law.  
    - *Substrate*: Collective acceptance (without which it’s just text).  
    - *Boundary Issue*: Can acceptance be codified *in* the law? **Resolution**: Codification shifts acceptance to a *new* substrate (e.g., cultural norms).  

  ---

  ### **6. Why Logic/Self-Reference Isn’t Enough**  
  Your friend’s appeal to logic (e.g., systems that "talk about themselves") captures *syntactic* self-reference but misses:  
  - **Agency/Authority**: Your cases involve *power* (who can draw/revise/govern).  
  - **Dynamic Enaction**: The hands *are drawing*, the wiki *is being edited*—this is *process*, not just definition.  
  - **Materiality**: Logic ignores the physical/virtual medium (paper, servers).  

  ---

  ### **Conclusion: A Structural Necessity**  
  The **Enabling Substrate** is not an artifact of your examples—it is a necessary feature of any operational co-specification system. Without it, the loop is a *potential* structure, not an *actual* one. The substrate is "outside" not because it’s transcendent, but because it operates at a **different ontological level**: it is the *condition for* the system, not a *component within* it. When a system appears to "absorb" its substrate, it merely expands its scope, pushing the substrate outward (e.g., from software to hardware, from rules to social instincts). To navigate this, ask: **"What must exist *before* this loop can start?"** That is your substrate.  

  If you coin terms, **Operational Co-specification** and **Enabling Substrate** offer precision. The deepest insight isn’t the loop itself, but how it *reveals dependence on something it cannot contain*—a humbling lesson in finitude.
