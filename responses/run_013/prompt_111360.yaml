prompt: |-
  ok so i have to write this essay for my social studies class about generations and im kinda stuck. my teacher keeps saying stuff like "Gen Z" and "Millenials" are just social constructs invented by marketers and the media, and that the boundaries are totally arbitrary anyway (like does Gen Z start in 1995 or 1997 or what? nobody agrees). so my question is: if generations aren't actually real, how come there are all these studies and articles saying Gen Z is the loneliest generation, or that millennials are killing this or that? if the categories are fake, the differences should be fake too, right? my teacher tried to explain that the label can be made up but the differences can still be real, and i honestly don't get how that works, it sounds like wanting to have it both ways. and also, whenever i read "Gen Z is lonelier" it kinda just sounds like "teenagers and 20-somethings are lonelier," which would've been true for every generation ever, so is that even a real finding or are people just measuring age and slapping a generation name on it? my teacher said something about how you can't tell if it's the generation or just how old the people are, which is exactly my point i think? so yeah — are generations real or not, and if they're not real kinds of people, why do actual researchers keep using them like they are?
