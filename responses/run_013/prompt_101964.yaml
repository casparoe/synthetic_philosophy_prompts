answer: |-
  Here's the case you need, built for clarity and hand-calculation. I'll use a hospital resource allocation scenario to keep it grounded: two patients (A and B) with different baseline well-being levels, and a choice between two treatment plans (X and Y). Well-being is measured on a cardinal index where higher numbers are better, and everyone is above zero. The key is that prioritarianism with a sufficiently steep transform (here, \(g(w) = -\frac{1}{w}\)) demands a massive sacrifice from A for a tiny gain to B, while utilitarianism and moderate prioritarianism (square root) reject this. Leximin agrees with the steep prioritarian, confirming your hunch.

  ### **The Case**
  - **Patient A**: Well-off individual (e.g., chronic condition managed well).  
  - **Patient B**: Much worse off (e.g., severe untreated pain).  
  - **Well-being index**: Ratio-scale, interpersonally comparable.  
  - **Options**:  
    - **Option Y**: Give standard care.  
      - A: 100 units  
      - B: 0.1 units  
      - *Total well-being*: 100.1  
    - **Option X**: Sacrifice almost all of A's well-being to slightly improve B's.  
      - A: 1 unit (e.g., severe deterioration)  
      - B: 0.111 units (e.g., minor pain relief)  
      - *Total well-being*: 1.111  
  - **Why these numbers?**  
    - B starts very low (0.1) in Y, so even a tiny gain (0.011 units) is heavily weighted by steep prioritarianism.  
    - A's sacrifice is extreme (100 → 1), but B's gain is minimal (0.1 → 0.111).  
    - Everyone above zero: A at 1, B at 0.111.  

  ---

  ### **Verdicts and Arithmetic**
  Assume well-being \(w\) for each person. We sum the transformed well-being for prioritarianism.  
  - **Utilitarianism** (maximize total well-being):  
    - Y: \(100 + 0.1 = 100.1\)  
    - X: \(1 + 0.111 = 1.111\)  
    - **Verdict**: Y ≻ X (100.1 > 1.111)  

  - **Moderate Prioritarian** (square root transform: \(g(w) = \sqrt{w}\)):  
    - Y: \(\sqrt{100} + \sqrt{0.1} = 10 + 0.3162 ≈ 10.3162\)  
    - X: \(\sqrt{1} + \sqrt{0.111} ≈ 1 + 0.3332 ≈ 1.3332\)  
    - **Verdict**: Y ≻ X (10.3162 > 1.3332)  

  - **Steep Prioritarian** (transform: \(g(w) = -\frac{1}{w}\)):  
    - Y: \(-\frac{1}{100} - \frac{1}{0.1} = -0.01 - 10 = -10.01\)  
    - X: \(-\frac{1}{1} - \frac{1}{0.111} ≈ -1 - 9.009 = -10.009\)  
    - **Verdict**: X ≻ Y (-10.009 > -10.01)  
    - *Note*: Higher (less negative) is better. The gain for B (\(-\frac{1}{0.111} \approx -9.009\) vs. \(-\frac{1}{0.1} = -10\)) outweighs A's loss (\(-\frac{1}{1} = -1\) vs. \(-\frac{1}{100} = -0.01\)).  

  - **Leximin** (compare the worst-off, then next-worst if tied):  
    - Y: Worst-off is B at 0.1.  
    - X: Worst-off is min(A=1, B=0.111) = 0.111.  
    - **Verdict**: X ≻ Y (0.111 > 0.1).  
    - *Tiebreak note*: If min were equal, we'd compare the next-worst. Here, no tie: X wins outright.  

  ---

  ### **What's Doing the Work? The Transform's Behavior Near Zero**
  The verdict flips for steep prioritarianism because:  
  - **The transform \(g(w) = -\frac{1}{w}\) has unbounded marginal priority weight as \(w \to 0^+\)**.  
    - Marginal weight (derivative) is \(g'(w) = \frac{1}{w^2}\). At B's level in Y (\(w_B = 0.1\)), this is \(\frac{1}{(0.1)^2} = 100\).  
    - At A's level in Y (\(w_A = 100\)), it's \(\frac{1}{100^2} = 0.0001\).  
  - **Why this forces the sacrifice**:  
    - B's tiny gain (0.011) gets massive weight: \(\approx 0.011 \times 100 = 1.1\) (priority units).  
    - A's massive loss (99) gets near-zero weight: \(\approx 99 \times 0.0001 = 0.0099\) (priority units).  
    - Net priority gain: \(1.1 - 0.0099 ≈ 1.0901\), so X wins despite the huge utilitarian loss.  
  - **Square root (\(g(w) = \sqrt{w}\)) is bounded**:  
    - Marginal weight \(g'(w) = \frac{1}{2\sqrt{w}}\) blows up as \(w \to 0^+\), but not fast enough here.  
    - Gain for B: \(0.011 \times \frac{1}{2\sqrt{0.1}} ≈ 0.011 \times 1.581 = 0.0174\).  
    - Loss for A: \(99 \times \frac{1}{2\sqrt{100}} = 99 \times 0.05 = 4.95\).  
    - Net priority loss: \(0.0174 - 4.95 < 0\), so Y still wins.  
  - **Leximin agrees with steep prioritarianism** because B's status in Y (0.1) is dire, and X lifts the worst-off above that (to 0.111).  

  ---

  ### **Sensitivity Check: Swap Steep Transform to Square Root**
  - **Does the verdict flip?** Yes. With square root prioritarianism, Y wins (as above: 10.3162 > 1.3332).  
  - **Do other elements need to change?** No. The same numbers work cleanly:  
    - Utilitarianism still prefers Y (100.1 > 1.111).  
    - Steep prioritarianism (now square root) prefers Y.  
    - Leximin still prefers X (0.111 > 0.1).  
  - **Why this confirms the issue**: The flip shows the verdict is driven solely by the transform's steepness, not the well-being levels themselves. The case is robust because B's baseline (0.1) is low enough for \(-\frac{1}{w}\) to dominate but high enough for \(\sqrt{w}\) to behave moderately.  

  ---

  ### **Steelman: How a Prioritarian Defends Against This**
  - **Objection 1: "You picked a pathological transform"**  
    The strongest reply is that \(g(w) = -\frac{1}{w}\) (or \(g(w) = -e^{-w}\)) is *ethically implausible* because it implies:  
    - **Catastrophic sensitivity to small well-being changes**: Sacrificing 99.999% of a well-off person's well-being for a 0.001-unit gain to someone at 0.1 is required (e.g., A: 100 → 0.001, B: 0.1 → 0.101). This violates the "non-extreme priority" axiom (Parfit 1997, Rabinowicz 2002).  
    - **Violates continuity**: At very low well-being, tiny differences cause massive moral shifts, making the view overly rigid.  
  - **Objection 2: "The transform isn't a free knob—it must be constrained"**  
    Prioritarianism isn't committed to *any* concave function. Plausible transforms (e.g., \(\sqrt{w}\), \(\ln(w)\)) must:  
    - **Respect diminishing marginal moral weight**: Weight decreases with well-being, but not explosively.  
    - **Avoid boundedness issues**: \(-\frac{1}{w}\) "blows up" near zero, but well-being near zero should not dominate all other considerations (e.g., Adler 2012 advocates for transforms with finite marginal weight at zero).  
  - **Core defense**: The case exploits an *unreasonable* degree of priority to the worst-off. A moderate prioritarian (e.g., using square root) avoids this while still dodging leveling-down.  

  ---

  ### **Summary**
  - **Option X**: A=1, B=0.111 (massive sacrifice for tiny gain).  
  - **Option Y**: A=100, B=0.1 (status quo with high inequality).  
  - **Verdicts**:  
    - Utilitarianism: Y ≻ X.  
    - Square-root prioritarianism: Y ≻ X.  
    - Steep prioritarianism (\(-\frac{1}{w}\)): X ≻ Y.  
    - Leximin: X ≻ Y.  
  - **Key driver**: Unbounded marginal priority weight of steep transform near zero well-being.  
  - **Prioritarian steelman**: The transform must be ethically plausible; \(-\frac{1}{w}\) is not, as it demands catastrophic sacrifices for trivial gains.  

  This case isolates how prioritarianism *can* mimic leximin's extreme demands when the transform is steep, without leveling-down. Use it to argue that moderating the transform is essential to avoid counterintuitive results.
