  **The responsibility gate/weight distinction does the most sorting work, as it fundamentally shapes whether choice nullifies claims or merely weakens them.**

  ### Decision Tree

  1. **Currency Case**: Alex needs a $20k wheelchair to be as happy as Taylor (who has no disability). After buying it, Alex has less money but equal happiness. Is the core unfairness in Alex having less money, or in Alex having fewer opportunities to achieve happiness at the same cost?  
     - **Less money** → Go to 2A  
     - **Fewer opportunities** → Go to 2B  
     - **Equal happiness, so no unfairness** → Go to 2C  

  2. **Unchosen Disadvantage Case**: Riley, healthy and wealthy, gambles $100k on a fair coin flip, loses, and becomes poor. Had they not gambled, they’d still be wealthy. Is Riley’s poverty "unchosen"?  
     - **A: No, they literally could’ve skipped the gamble** → Go to 3A  
     - **B: Yes, losing was pure bad luck despite a fair choice** → Go to 3B  
     - **C: Yes, skipping the gamble was too costly (forgone 50% chance to double wealth)** → Go to 3C  

  3. **Responsibility Case**: Casey leaves a stable job for a risky startup that fails due to market conditions. Should society compensate their unemployment?  
     - **A: No, the choice makes it their responsibility (gate)** → Go to 4  
     - **B: Partially, the choice lowers but doesn’t eliminate their claim (weight)** → Go to 4  
     - **C: Yes, fully—the outcome was uncontrollable** → Go to 4  

  4. **Site of Luck Case**: Jamie, diligent but raised in a town where the sole industry collapsed, is now poor. Is the disadvantage unchosen?  
     - **A: Yes, group-level bad luck (town’s economy)** → Go to 5  
     - **B: No, individual-level (Jamie could’ve moved/trained)** → Go to 5  

  5. **Gaps vs Floor Case**: Group A ($200k) and Group B ($150k) are both comfortable; neither is at fault. Should we tax A to help B?  
     - **A: Yes, to reduce the gap (equality)** → Go to 6  
     - **B: No, without a floor to raise, gaps don’t matter (priority)** → Go to 6  

  6. **Abandonment Case**: A reckless driver causes their own severe injury and can’t afford care. Should society help?  
     - **A: No, they’re responsible (stick with luck egalitarianism)** → Leaf  
     - **B: Yes, to uphold social dignity (bail to relational equality)** → Leaf  

  ### Leaves (Positions)
  1. **Path: 1→2A, 3A, 4B, 5A, 6A**  
     - *Position*: Resource-focused luck egalitarianism with strong responsibility gate, individual-level luck, equality, and no safety net for choices.  
     - *Name*: Libertarian luck egalitarianism.  
     - *Awkward commitment*: Denies aid even when avoiding disadvantage was prohibitively costly (e.g., fleeing a collapsing town).  

  2. **Path: 1→2A, 3B, 4A, 5B, 6A**  
     - *Position*: Resource-focused with responsibility as weight, group-level luck, priority, sticks with LE.  
     - *Name*: Weighted-priority luck egalitarianism.  
     - *Awkward commitment*: Partially compensates for chosen gambles (e.g., startup failure), blurring accountability.  

  3. **Path: 1→2B, 3A, 4A, 5A, 6A**  
     - *Position*: Opportunity-focused with responsibility gate, group-level luck, equality, sticks with LE.  
     - *Name*: Arneson-style opportunity egalitarianism.  
     - *Awkward commitment*: Compensates for unchosen preferences (e.g., expensive tastes) if they limit opportunity.  

  4. **Path: 1→2B, 3C, 4B, 5B, 6B**  
     - *Position*: Opportunity-focused with full compensation for outcomes, individual-level luck, priority, bails to relational equality.  
     - *Name*: Hybrid opportunity-relational egalitarianism.  
     - *Awkward commitment*: Overcompensates for bad outcomes of avoidable risks (e.g., gambling losses).  

  5. **Path: 1→2C, 3A, 4A, 5B, 6B**  
     - *Position*: Welfare-focused with responsibility gate, group-level luck, priority, bails to relational equality.  
     - *Name*: Welfare prioritarianism.  
     - *Awkward commitment*: Ignores costly disadvantages (e.g., wheelchair cost) if welfare is equal.  

  6. **Path: 1→2C, 3B, 4B, 5A, 6A**  
     - *Position*: Welfare-focused with responsibility as weight, individual-level luck, equality, sticks with LE.  
     - *Name*: Weighted-welfare egalitarianism.  
     - *Awkward commitment*: Compensates for depression but not paralysis if welfare differs.  

  7. **Path: Any to 6B**  
     - *Position*: Relational/democratic equality, emphasizing social standing over luck.  
     - *Name*: Andersonian relational egalitarianism.  
     - *Awkward commitment*: May tolerate large inequalities if they don’t undermine dignity.  

  8. **Path: 1→2A, 3C, ... → (empty leaf)**  
     - *Position*: Resource-focused with full compensation despite choice.  
     - *Why empty*: Incoherent—node 2A says poverty is chosen, but 3C ignores choice for full compensation.  

  ### Notes  
  - **Inseparable pairs**: Paths differing only in *site of luck (4)* may be indistinguishable to students. Group vs. individual bad luck often overlaps (e.g., Jamie’s town could be framed either way).  
  - **Ruled-out combinations**:  
    - **Welfare currency (1→2C) + responsibility gate (3A) + individual luck (4B) + equality (5A)**: Ignores that welfare equality may require redistributing for preferences (e.g., depression case), conflicting with 4B’s individual focus.  
    - **Full compensation (3C) + bail (6B)**: 3C’s blanket compensation negates 6B’s motivation to bail for relational reasons.  
    - **Costly option (2C) + priority (5B)**: 2C’s broad "unchosen" scope clashes with 5B’s narrow floor focus.
