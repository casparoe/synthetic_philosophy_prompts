prompt: |-
  I started volunteering at a hospice two months ago and somethings been bugging me that I don't have a word for.

  Here's the pattern. When I'm actually in the room with someone who's dying, what moves me is completely particular: this person, this hand, the fact that he's scared. If I caught myself thinking "I'm doing this because it's my duty as a volunteer," something would have gone wrong — that thought, in that moment, would be a contaminant. But then the family shows up and asks why I stayed, and I say "it's part of the volunteer role, we dont leave people alone at the end," and that's... fine? It's true, it's a good answer, and it does something useful: it takes the weight off them, it stops them from owing me anything personal. Nobody's being deceived. I'm not misreporting my motives, because that sentence was never offered as a report of my motives — it's a justification, and as a justification it's exactly right.

  So the same proposition — I did it because it's my job — would be corrupting if it were what was actually driving me, and correct, even virtuous, if it's what I offer in answer to a why-question. The two roles seem to be governed by opposite standards. Same thing at home: my kid asks why I read to her every night, and "because I love you" is the honest answer; "because nightly reading correlates with vocabulary gains" would be monstrous as a motive, and yet if her teacher asks me why I read to her, the vocabulary point is a legitimate part of the answer and the love part is nothing the teacher can act on.

  I know the Williams case about the man saving his wife, where if his deliberation had to include the thought that saving one's wife is permissible, that's one thought too many. But that's about a thought that shouldn't be in the agent's head at all. Mine is weirder: the thought is fine, it's true, it's even the right thing to say out loud, and it's still true that if it had been doing the motivating it would have wrecked the action. And I don't think it's just rationalization, because rationalization is giving a false or self-serving reason for what you did; here the reason is genuinely good, I genuinely endorse it as a justification, I just wasn't acting on it.

  Is there a name for this? I keep reaching for self-effacement, but that seems to be about a theory being true while it's better that people not believe it, which is about belief, not about the gap between a motive and a justification. And the integrity objections in the Williams/Stocker vein seem to be about theories demanding the wrong motive, not about one proposition being right in one role and wrong in the other. I'd be happy to be told this already has a name, but mostly I want the carving: what exactly is the asymmetry, what's the nearest established concept and how does it fall short, where's the line between this and plain hypocrisy or rationalization, and does it generalize past motives — can a justification be correct and also be correct that it never be anyone's reason? If there's no name, give me one, define it, and tell me what falls outside it.
reasoning: |-
  Hmm, the user is describing a really fascinating philosophical dilemma they've encountered while volunteering at a hospice. They're noticing this asymmetry between what motivates their actions in deeply personal moments versus how they justify those actions to others. 

  When they're actually sitting with a dying person, thinking "I'm doing this because it's my duty" would feel like a contamination - the motivation needs to be purely personal and immediate. But when family members ask why they stayed, giving that same duty-based explanation is perfectly appropriate and even virtuous because it relieves the family of feeling indebted. 

  They give another beautiful example with reading to their child - "because I love you" is the true motivation, while citing educational benefits is the appropriate justification for the teacher. The user is clearly very thoughtful and has already engaged with Bernard Williams' "one thought too many" concept but notes this is different - here the thought is actually good to express externally, just corrupting if it were the internal driver.

  What they're really asking for is conceptual clarity. They want to know if this phenomenon has a name, how to precisely define the asymmetry, and how it differs from hypocrisy or rationalization. They're also wondering if this extends beyond motives to justifications more broadly. 

  This reminds me of several philosophical concepts but none quite fit perfectly. Williams' "one thought too many" captures part of it but focuses on the thought's presence in deliberation rather than this motive/justification duality. Stocker's "moral schizophrenia" addresses motive/justification splits but frames it as pathological, whereas here it seems healthy. The user is right that "self-effacement" doesn't fit either - that's about beliefs being true but better unbelief.

  What makes this case special is how the same proposition serves opposite functions: poisonous as motive, virtuous as justification. And crucially, the user isn't being deceptive - they fully endorse both levels sincerely. This isn't hypocrisy but rather a sophisticated form of moral double-bookkeeping where different contexts demand different truth-telling.

  For naming, perhaps "Janus-faced justification" or "chameleon normativity" could work, but I think "contextual decoupling of motive and justification" might be most precise. The key is recognizing that some actions require motivational immediacy to preserve their moral quality, while social contexts require generalizable justifications to maintain relationships and institutions.
answer: |-
  This is a profound and beautifully articulated observation about the structure of moral psychology and social discourse. You've identified a genuine asymmetry that isn't fully captured by existing concepts like "self-effacement," "rationalization," or the "one thought too many" problem. Here's a breakdown and a proposal:

  **The Asymmetry Defined:**

  1.  **Motivational Corruption:** For certain deeply personal, relational, or intimate actions (comforting the dying, expressing love to a child), acting *primarily* or *in the moment* on the basis of a general, impersonal, or institutional justification (duty, rule, outcome) fundamentally corrupts the character and value of the action. It replaces the essential, immediate responsiveness to the *particular person* with an abstraction. The thought becomes a "contaminant" because it displaces the required focus.
  2.  **Justificatory Virtue:** Providing that same general, impersonal, or institutional justification *after the fact*, especially to third parties (family, teachers, institutions), is often not only acceptable but *precisely the right thing to do*. It serves vital social functions: relieving burdens ("you don't owe me"), providing understandable reasons within a shared framework, upholding institutional trust, and offering reasons that others *can* act upon or integrate into their own understanding. Crucially, it's recognized *as* a justification, not necessarily a report of the inner motivational state.

  **Why Existing Concepts Fall Short:**

  *   **Williams' "One Thought Too Many":** Focuses on the *presence* of a justifying thought *within deliberation*. Your case highlights the *functional difference* of the *same thought* depending on whether it's acting as the *motive* or offered as the *justification*. The thought *isn't* "too many" when used externally; it's necessary and good.
  *   **Stocker's "Moral Schizophrenia" / Integrity Objections:** Primarily critiques ethical *theories* that *demand* or *only recognize* impersonal motives, thereby alienating agents from their genuine, personal springs of action. Your case shows a *pragmatic necessity* for *using* impersonal justifications externally, *without* demanding they be the internal motive. It's about communication and social function, not theory-induced alienation.
  *   **Self-Effacement:** Concerns the truth of a *theory* and the pragmatic undesirability of *believing* it. Your issue is about the *functional role* of a *proposition* (as motive vs. justification), regardless of belief in a larger theory.
  *   **Rationalization:** Involves offering a *false* or *self-serving* justification that misrepresents the actual (often less noble) motive. In your case, the justification offered is *genuinely good, true, and endorsed* – it's just not what was motivationally primary *in the moment*. There's no deception or self-deception implied.
  *   **Hypocrisy:** Involves a *discrepancy* between public pronouncement and private belief/motive *where consistency is morally expected*. In your hospice example, there's no expectation that your answer to the family *must* mirror your internal, moment-to-moment state during the vigil. The justification serves a different purpose.

  **The Core Concept: Contextual Decoupling of Motive and Justification**

  This asymmetry arises because actions exist in two distinct contexts governed by different norms:

  1.  **The Context of Engagement:** The immediate, lived experience of the action (being with the dying, reading to your child). Norm: Authenticity, particularity, relational responsiveness. Motives must align with this context to preserve the action's intrinsic value. Impersonal motives *corrupt*.
  2.  **The Context of Accounting:** The social space where actions are explained, justified, or made sense of to others (or institutions). Norms: Clarity, generalizability, manageability of social debts/incentives, functional communication. Impersonal justifications *function* well here.

  **Proposing a Name: Motivational-Justificatory Asymmetry (MJA) / The Decoupling Principle**

  *   **Definition:** The phenomenon where a specific proposition (e.g., "It's my duty," "It produces good outcomes") is:
      *   (a) **Corrupting as a Motive:** If it constitutes the primary or operative reason for acting *within the immediate context of engagement* for certain types of actions (especially intimate, relational, or particularistic ones), it undermines the essential character and value of that action.
      *   (b) **Virtuous as a Justification:** If offered *after the fact* as the reason for the action *within the context of accounting* (especially to third parties or institutions), it serves legitimate, valuable social functions and is often the most appropriate response, despite not reflecting the primary motivational state.
  *   **Boundaries & What Falls Outside:**
      *   **Not Hypocrisy:** The agent sincerely endorses *both* the immediate, particular motive *and* the general justification for its social role. There's no bad faith.
      *   **Not Rationalization:** The justification offered is sincerely believed to be *a* valid reason (even if not the primary motive in the moment) and serves a legitimate external purpose, not masking a disreputable motive.
      *   **Applies Specifically:** Not all actions exhibit MJA. It's most salient for actions where the *quality of the engagement itself* is paramount and defined by particularity and immediacy (care, love, intimate presence, artistic creation, deep friendship). Actions primarily defined by their outcomes or adherence to rules (paying taxes, following traffic laws) may not exhibit this asymmetry as strongly, or at all. The corrupting potential lies in displacing the *required* particularistic engagement.
      *   **Requires Sincerity:** The agent must genuinely experience the particular motive *in the moment* and genuinely endorse the justification *as valid and socially functional* afterwards. If the justification is offered cynically or the particular motive is feigned, it falls back into hypocrisy or bad faith.
  *   **Generalization (Can a justification be correct and also correct that it never be anyone's reason?):** Yes, absolutely. This is a key insight of MJA. The impersonal justification (Duty, Rule R, Good Outcome G) can be objectively true and normatively valid *as a justification* – it *is* part of the reason the institution exists, it *does* explain why the action is good, it *is* the reason society encourages it – *and yet*, for the action to retain its highest value *in the doing*, the primary, operative motive *for the agent in the moment* must be the particular, non-abstracted engagement. The justification stands as a valid public reason, independent of anyone's psychology in performing the act. It's correct that this reason *shouldn't* be what primarily moves the agent *in the act itself* for these specific actions, even though it correctly explains *why* the act is valuable from an external, general perspective.

  **Why "Decoupling"?**

  It captures the essential feature: the *functional separation* between the role a proposition plays internally (motivation) and externally (justification). They are "decoupled" – what works well and is virtuous in one role is corrupting in the other. "Asymmetry" highlights the opposing standards governing the two roles.

  **In Conclusion:**

  You've pinpointed **Motivational-Justificatory Asymmetry (MJA)** or **The Decoupling Principle**. It recognizes that the moral and psychological economy of intimate action requires a decoupling: the motive that fuels authentic engagement in the moment (particular, responsive, immediate) must often differ from the justification offered afterwards to navigate the social world (general, impersonal, functional). This isn't a failing; it's a sophisticated adaptation reflecting the dual nature of human action – deeply personal engagement within complex social structures. Your experience in the hospice captures this perfectly: the hand, the fear, demand your full, unmediated presence; the family’s gratitude and need for reassurance demand an explanation that fits within the shared framework of the volunteer role, lifting a burden they shouldn't carry. Both are true, both are necessary, but they belong to different moments and serve different, equally vital, purposes.
