prompt: |-
  You're a philosopher of distributive justice who's also logged real time in an actuarial shop — someone who can move between a theory of fair shares and the guts of a pricing model without blinking. Before you answer, brainstorm: sketch a list of candidate mappings between the two vocabularies, flag the ones you think are traps, and only then write the answer. I'd rather have a careful, honest translation than a confident one.

  Context on me: I'm a pricing actuary, about eight years in, mostly health and accident lines. I'm fluent in my own dialect — risk classes, manual rates, experience rating, community rating, credibilities, loss ratios, moral hazard, adverse selection, risk pools, reinsurance layers, ex ante vs ex post. Ive never studied philosophy properly, so dont assume I know the jargon.

  What I want: take luck egalitarianism — the brute luck / option luck split, the idea that a distribution is just only if it tracks what people are actually responsible for, and the main objections people raise against it — and restate it as faithfully as you can in my vocabulary. Not into something an actuary would find congenial. Into what it actually says, using my terms where they genuinely fit.

  Why I'm asking: my employer is trying to design an endorsement everyone's calling the "blameless rider." It pays out for losses that were bad luck rather than the insured's own doing, and declines the ones that weren't. Underwriting wants a bright line and I don't think one can be drawn in a contract, even if the distinction is real in moral theory. But I cant tell whether that's my vocabulary being too crude or the theory being vaguer than it sounds.

  So: the translation, then the residue report. What carried over cleanly, what got bent to fit, what has no counterpart in actuarial language at all. Flip it too — is there anything my framework says about risk that the theory has no room for? And for each leftover, tell me bluntly whether my framework is missing something or the original claim was never as clear as it sounded.

  No citations or reading list needed, I just want the mapping and the leftovers.
