answer: |-
  Here are five numbered points reconstructing the implicit theory of causation presupposed by the described legal practice:

  1.  **The core default is counterfactual dependence (but-for causation) for singular deterministic events.** This serves as the baseline test where harm *would not* have occurred without the defendant's action, presupposing a simple counterfactual theory as the foundational ideal for direct causation.

  2.  **Overdetermination (multiple sufficient causes) necessitates abandoning strict counterfactual dependence.** When multiple independent factors are each sufficient alone, the law implicitly adopts a **NESS (Necessary Element of a Sufficient Set) theory or "substantial factor" concept**, recognizing causation based on an action being a necessary component of *some* minimal sufficient set of actual conditions for the harm.

  3.  **Probabilistic harm (toxic torts) requires a shift to probabilistic causation and risk attribution.** The "doubling of risk" standard presupposes that causation can be established by showing the defendant's action **significantly increased the objective probability** of the harm occurring, even if the harm's actual occurrence in a specific individual remains counterfactually dependent on background chance.

  4.  **The practice integrates multiple distinct theories situationally, not a single unified one.** It defaults to counterfactual dependence, switches to sufficiency-based theories (NESS/substantial factor) for overdetermination, and adopts probability-raising for probabilistic harms, ruling out a purely counterfactual or purely productive-connection theory as universally sufficient.

  5.  **The overdetermination context is underdetermined; NESS and interventionism often align.** For cases with multiple sufficient causes, both NESS (focusing on sufficient sets) and interventionist accounts (asking if manipulating the defendant’s action while holding others fixed prevents the harm) typically yield the same verdict (liability) as "substantial factor," unlike strict but-for deletion which fails.
