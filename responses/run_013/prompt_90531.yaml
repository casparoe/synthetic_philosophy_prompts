prompt: |-
  ok so I'm trying to actually understand Nagarjuna's tetralemma and I keep getting stuck on how to use it. The four options are true, false, both, and neither, right? If those are the four possibilities for any claim, then one of them has to be the correct one — so for something like 'the self exists', which corner is it? I've been assuming it's the fourth one, the 'neither' one, and that emptiness is basically that fourth truth value, the special Madhyamaka one. But then someone told me the Jaina version of this has seven options, with a 'maybe' stuck in front of each, and I also saw a book title about a fifth corner, so now I'm worried Nagarjuna just stopped early and there are corners he didn't list. Is emptiness the fourth corner or the fifth? And if this is a logic, where's the truth table — I want to be able to plug in a proposition and read off an answer, because a friend and I are arguing about whether anything really exists and I'd like to settle it formally instead of going back and forth. Which of the four (or five) do I assign to emptiness?
