  - Information is free (no cost to gather).
  - There is no cost to delay.
  - The decision can wait for the information.
  - The decision-maker is an expected-utility maximizer.
  - There are no strategic concerns (e.g., information becoming public and affecting behavior).
  - The information is about the state of the world and not about the model itself (unless the model is known to be correct).

