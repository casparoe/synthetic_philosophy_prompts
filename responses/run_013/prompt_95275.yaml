     - If EVPI <= S_cost + D, then gathering more evidence cannot be worthwhile (even perfect information is not worth the cost). Then we recommend to decide now (go to step 9). Otherwise, proceed to step 7.

  7. **Estimate the value of the proposed study (EV_gather):**
     - We need the possible results of the study and their likelihood. If the study provides a binary result (e.g., success or failure) or a continuous measure, we need to know how it updates our belief.
     - *Simplification for binary result*: Suppose the study can yield "positive" or "negative". We need:
          - The true positive rate (sensitivity): P(positive | effective) = sens
          - The true negative rate (specificity): P(negative | ineffective) = spec
     - Then:
          P(positive) = P_eff * sens + (1 - P_eff) * (1 - spec)
          P(negative) = 1 - P(positive)

          P(effective | positive) = [P_eff * sens] / P(positive)
          P(effective | negative) = [P_eff * (1 - sens)] / P(negative)

     - Then for each result:
          - If positive: 
                EV_proceed_after = P(effective|positive)*B - C
                EV_after_positive = max(EV_proceed_after, 0)
          - If negative: similarly.

          EV_gather_before_costs = P(positive)*EV_after_positive + P(negative)*EV_after_negative
          EV_gather = EV_gather_before_costs - S_cost - D

     - *Note*: If the study is more complex, the analyst may need to use a more sophisticated model or consult a statistician. However, we are aiming for simplicity. If these rates are unavailable, use the following approximation: the expected value of the study is approximately EVPI minus some discount for imperfection, but this is not rigorous.

     - *Alternative*: If the study provides an estimate of the effect size, and we are updating a continuous prior, then this step becomes too complex. We then recommend using the EVPI to bound and if the study is not too expensive and EVPI is high, then gather.

  8. **Compare EV_gather and EV_best_now:**
     - If EV_gather > EV_best_now, then recommend gathering more evidence.
     - Otherwise, recommend deciding now.

  9. **Make the recommendation:**
     - If we recommend deciding now:
          - If EV_proceed > 0: recommend to proceed.
          - Otherwise: recommend to abandon.
     - If we recommend gathering more evidence: recommend to conduct the study and then decide.

  **Assumptions and Violations**

  The non-negativity result for the value of information assumes:
     - The information is free (no cost to gather).
     - There is no cost to delay.
     - The decision can wait.
     - The decision-maker is an expected-utility maximizer.
     - The information is about the state of the world and does not change the world.
     - The information is not shared in a way that changes other actors' behavior.

  Our procedure explicitly accounts for:
     - The cost of the study (S_cost) and the cost of delay (D). Therefore, the net value of information (EV_gather - EV_best_now) can be negative.
     - We assume expected utility maximization. If the decision-maker is risk averse, we would need to adjust the valuation of outcomes.

  Our procedure does not account for:
     - Strategic concerns: information becoming public and changing behavior (e.g., in a lead-paint remediation, if the study reveals high levels, it might cause panic).
     - Preference not to know: sometimes a department might prefer not to have evidence that could kill the program. We do not account for this.
     - The study might only test an assumed model: we partially account for this by requiring the likelihood (sensitivity and specificity) and by the prior. If the prior is very strong (close to 0 or 1), then the study might not change the decision.

  **Separation of Values**

  We separate:
     - The value of information for the decision at hand: captured by the EV_gather calculation.
     - The value of knowing for future decisions: not accounted for. We assume that the information is only for this decision.
     - The value of being seen to have studied: not accounted for. This is a political or reputational factor.

  **Running the Examples**

  We now apply the checklist to three proposals.

  **Example 1: Mentoring Pilot**

  - Proposal: Scale a mentoring program to the whole district. The pilot had 60 participants and showed a modest positive effect (effect size 0.2) but not statistically significant (p>0.05). 
  - Cost of scaling (C): $1,000,000
  - Benefits if effective (B): $1,500,000 (estimated from increased graduation rates and future earnings)
  - Prior probability of effectiveness (P_eff): The pilot was small and not significant. However, there might be prior evidence from other districts. Let's assume based on the pilot and other factors, P_eff=0.4.
  - Proposed study: Not specified, but the department is asking whether to scale now or gather more evidence. We assume a study of 200 students for $50,000, taking 6 months.
  - During the 6 months, if scaled, the program would have served 100 students (out of a district of 1000, say). 
    - Benefits during delay if effective: B_delay = (100/1000)*$1,500,000 = $150,000
    - Costs during delay: C_delay = (100/1000)*$1,000,000 = $100,000
  - Expected cost of delay (D) = C_delay - P_eff * B_delay = 100,000 - 0.4*150,000 = 100,000 - 60,000 = $40,000

  Steps:

  1. Decision: Proceed now or gather evidence? We assume a study of 200 students.

  2. C = $1,000,000; B = $1,500,000.

  3. P_eff = 0.4.

  4. EV_proceed = 0.4*1,500,000 - 1,000,000 = 600,000 - 1,000,000 = -$400,000. 
     Therefore, EV_best_now = max(-400,000, 0) = 0 (abandon now).

  5. Study cost S_cost = $50,000; D = $40,000.

  6. Since we would not proceed now (EV_proceed<0), 
        EVPI = P_eff*(B - C) = 0.4*(1,500,000 - 1,000,000) = 0.4*500,000 = $200,000.
     Total cost of gathering = 50,000 + 40,000 = $90,000.
     EVPI ($200,000) > $90,000, so we cannot rule out gathering evidence.

  7. Now, we need the likelihood. The proposed study has 200 students. We need to know how the study will update our belief. We'll assume the study will give a statistically significant result or not. But we need sensitivity and specificity.

     How to get these? We can use the power of the study. Given the pilot effect size (0.2) and a two-sided test with alpha=0.05, the power for n=200 (100 in treatment, 100 in control) is about 0.33 (from power calculation). We'll approximate:

          sensitivity (true positive rate) = power = 0.33
          specificity (true negative rate): if the program is ineffective, the probability of not getting a significant result is 1 - alpha = 0.95? But note: if ineffective, we should get a non-significant result 95% of the time? Not exactly, because the effect size might not be exactly zero. We'll assume 0.95.

     Then:
          P(positive) = P_eff * sens + (1-P_eff)*(1-spec) = 0.4*0.33 + 0.6*0.05 = 0.132 + 0.03 = 0.162
          P(negative) = 1 - 0.162 = 0.838

          P(effective|positive) = (0.4*0.33)/0.162 = 0.132/0.162 ≈ 0.815
          P(effective|negative) = (0.4*(1-0.33))/0.838 = (0.4*0.67)/0.838 = 0.268/0.838 ≈ 0.32

     Now, for each result:
          If positive: 
              EV_proceed_after = 0.815*1,500,000 - 1,000,000 = 1,222,500 - 1,000,000 = $222,500 -> positive, so we would proceed.
          If negative:
              EV_proceed_after = 0.32*1,500,000 - 1,000,000 = 480,000 - 1,000,000 = -$520,000 -> negative, so we would abandon (0).

          EV_gather_before_costs = 0.162*222,500 + 0.838*0 = $36,045
          EV_gather = 36,045 - 50,000 - 40,000 = -$53,955

     Since EV_gather is negative and less than EV_best_now (0), we recommend to decide now: abandon.

     However, note: we would not proceed now anyway. And gathering evidence has a negative expected value.

     Recommendation: abandon now.

     But note: the department might be disappointed. Why did the non-negativity argument fail? Because the study costs ($50,000) and the cost of delay ($40,000) together exceed the expected value of the information ($36,045). The expected value of the information in this case is positive (36,045) but not enough to cover the costs.

  **Example 2: Long-running service contract**

  - The contract is up for renewal. It is cheap to exit (no penalty). The department wants to evaluate before renewing.
  - Cost of the contract (C): $500,000 per year.
  - Benefits if effective (B): $800,000 per year.
  - The program has been running for 5 years without a formal evaluation. Anecdotal evidence is positive. We set P_eff=0.7.
  - Proposed study: A rigorous evaluation costing $100,000 and taking 3 months.
  - During the 3 months, if renewed, the contract would cost $125,000 and generate benefits (if effective) of $200,000.
  - Expected cost of delay (D) = C_delay - P_eff * B_delay = 125,000 - 0.7*200,000 = 125,000 - 140,000 = -$15,000 (i.e., a net benefit of $15,000 to delay).

  Steps:

  1. Decision: Renew now or gather evidence?

  2. C = $500,000; B = $800,000.

  3. P_eff = 0.7.

  4. EV_proceed = 0.7*800,000 - 500,000 = 560,000 - 500,000 = $60,000 > 0, so we would renew now if no study.

  5. S_cost = $100,000; D = -$15,000.

  6. Since we would proceed now, 
          EVPI = (1 - P_eff)*C = 0.3 * 500,000 = $150,000.
          Total cost of gathering = 100,000 - 15,000 = $85,000.
          EVPI (150,000) > 85,000, so proceed to step 7.

  7. We need the study's sensitivity and specificity. Let's assume a well-designed study: 
          sens = 0.9, spec = 0.9.

     Then:
          P(positive) = 0.7*0.9 + 0.3*0.1 = 0.63 + 0.03 = 0.66
          P(negative) = 0.34

          P(effective|positive) = (0.7*0.9)/0.66 = 0.63/0.66 ≈ 0.9545
          P(effective|negative) = (0.7*0.1)/0.34 = 0.07/0.34 ≈ 0.2059

     For each result:
          If positive: 
              EV_renew_after = 0.9545*800,000 - 500,000 = 763,600 - 500,000 = $263,600 -> renew.
          If negative:
              EV_renew_after = 0.2059*800,000 - 500,000 = 164,720 - 500,000 = -$335,280 -> abandon (0).

          EV_gather_before_costs = 0.66*263,600 + 0.34*0 = $173,976
          EV_gather = 173,976 - 100,000 - (-15,000) = 173,976 - 100,000 + 15,000 = $88,976

     Compare to EV_best_now = $60,000.
     Since 88,976 > 60,000, we recommend gather evidence.

     Note: the cost of delay is negative (i.e., a benefit) because by delaying we avoid the risk of an ineffective program during the study period. The expected value of gathering is high because the study is informative and might save us from renewing an ineffective contract.

  **Example 3: Lead-paint remediation**

  - Proposal: Expand a lead-paint remediation program to a neighborhood where children are already testing high for lead. The department proposes a 12-month study before expanding.
  - Cost of expansion (C): $2,000,000.
  - Benefits if effective (B): $10,000,000 (from avoided health costs and improved lifetime outcomes for the children).
  - Prior: Existing data shows high lead levels, but the effectiveness of remediation in this specific context is uncertain. We set P_eff=0.5.
  - Study: Costs $200,000 and takes 12 months.
  - During the 12 months, if the program is not delayed, it would have remediated 50% of the homes (because the expansion would take time). 
    - Benefits during delay if effective: B_delay = $5,000,000 (50% of the benefits)
    - Costs during delay: C_delay = $1,000,000 (50% of the costs)
  - Expected cost of delay (D) = C_delay - P_eff * B_delay = 1,000,000 - 0.5*5,000,000 = 1,000,000 - 2,500,000 = -$1,500,000.

  Steps:

  1. Decision: Expand now or gather evidence (12-month study)?

  2. C = $2,000,000; B = $10,000,000.

  3. P_eff = 0.5.

  4. EV_proceed = 0.5*10,000,000 - 2,000,000 = $3,000,000 > 0, so we would expand now.

  5. S_cost = $200,000; D = -$1,500,000.

  6. EVPI (since we would proceed now) = (1-0.5)*2,000,000 = $1,000,000.
     Total cost of gathering = 200,000 - 1,500,000 = -$1,300,000 (i.e., a net benefit of $1,300,000 from gathering? That doesn't make sense because we are getting the study and also the delay has a negative cost meaning a benefit). 

     But note: the total cost of gathering is S_cost + D = 200,000 + (-1,500,000) = -$1,300,000. This means that even if the study provided no information, we would save $1,300,000 by waiting? Actually, this D already includes the expected net benefit of not implementing during the study period. 

     However, we must compare EV_gather and EV_best_now. Since EVPI is $1,000,000 and the "cost" of gathering is negative (-$1,300,000), then EVPI is less than the negative cost? Meaning: the cost of gathering is negative (i.e., we are being paid to gather evidence). So we should gather evidence.

     But let's go to step 7.

  7. We need the study's informativeness. Assume a study that will give a clear answer: 
          sens = 0.95, spec = 0.95.

     Then:
          P(positive) = 0.5*0.95 + 0.5*0.05 = 0.475 + 0.025 = 0.5
          P(negative) = 0.5

          P(effective|positive) = (0.5*0.95)/0.5 = 0.95
          P(effective|negative) = (0.5*0.05)/0.5 = 0.05

     For each result:
          If positive: EV_expand_after = 0.95*10,000,000 - 2,000,000 = $7,500,000 -> expand.
          If negative: EV_expand_after = 0.05*10,000,000 - 2,000,000 = $500,000 - 2,000,000 = -$1,500,000 -> abandon (0).

          EV_gather_before_costs = 0.5*7,500,000 + 0.5*0 = $3,750,000
          EV_gather = 3,750,000 - 200,000 - (-1,500,000) = 3,750,000 - 200,000 + 1,500,000 = $5,050,000

     Compare to EV_best_now = $3,000,000.
     Since $5,050,000 > $3,000,000, we recommend gather evidence.

     Why would we not like this? The neighborhood has children already testing high, and delay might be harmful. But note: our calculation of D already accounts for the expected harm of delay: by waiting, we avoid the costs of a full expansion during the study period and only forgo half the benefits. Since the program is only 50% likely to be effective, the expected benefits forgoing are 0.5*5,000,000=$2,500,000, and the costs avoided are $1,000,000, so the net effect of waiting is -$1,500,000 (a net gain). This is because we avoid the risk of incurring costs for an ineffective program for that year.

     However, there might be ethical considerations: even if the expected value is positive, we might not want to gamble with children's health. But the procedure is based on expected monetary value. If we assign a high value to preventing harm to children, then we might be risk averse. Our procedure does not account for risk aversion.

     In this case, the decision to gather evidence is driven by the high cost of the program and the substantial chance of ineffectiveness. The study can prevent a costly mistake.

  **What the Procedure Cannot Do**

  - It cannot account for risk aversion or other non-expected-utility preferences.
  - It does not include option value beyond the immediate decision (e.g., learning that can be applied to other programs).
  - It does not account for political or reputational factors.
  - It assumes that the study results will be available and used as planned.
  - It does not handle complex study designs or continuous outcomes without simplification.

  **Confidence in the Procedure**

  - The theoretical foundation (decision theory) is solid.
  - We are least sure of the simplification for the cost of delay and the assumption that the benefits and costs of the program can be reduced to a single monetary value. This is particularly problematic for programs with ethical dimensions (like the lead-paint remediation).

  The procedure provides a structured way to incorporate the key factors. It should be used as a starting point for discussion, especially when inputs are uncertain.

  **Final Checklist Format**

  We write the checklist for the analyst:

  **Evidence Gathering Decision Checklist**

  1. **Define the Decision:**
     - Describe the program and the immediate choices: proceed now or gather more evidence (with a specific study).

  2. **Program Costs and Benefits:**
     - C = total cost of the program if proceeded with now.
     - B = total benefits (in monetary terms) if the program is effective.
     - If B cannot be monetized, use a qualitative scale and note that the analysis will be qualitative.

  3. **Prior Probability:**
     - P_eff = probability that the program is effective (0 to 1).

  4. **Expected Value of Proceeding Now:**
     - EV_proceed = P_eff * B - C
     - If EV_proceed > 0, then the best action without more evidence is to proceed (set EV_best_now = EV_proceed). Otherwise, abandon (set EV_best_now = 0).

  5. **Study Details:**
     - S_cost = cost of the study.
     - Study duration: in months.
     - B_delay = benefits that would have been generated during the study period if the program is effective and we had proceeded now.
     - C_delay = costs that would have been incurred during the study period if we had proceeded now.
     - D = C_delay - P_eff * B_delay   [cost of delay]

  6. **Expected Value of Perfect Information (EVPI):**
     - If EV_proceed > 0: EVPI = (1 - P_eff) * C
     - If EV_proceed <= 0: EVPI = P_eff * (B - C)
     - If EVPI <= S_cost + D, then recommend to decide now (go to step 9). Otherwise, continue.

  7. **Expected Value of the Study (EV_gather):**
     - Get the study's sensitivity (sens) and specificity (spec). If unavailable, use sens=0.8, spec=0.8 as a default, but note the uncertainty.
     - P(positive) = P_eff * sens + (1 - P_eff) * (1 - spec)
     - P(negative) = 1 - P(positive)
     - P(effective | positive) = (P_eff * sens) / P(positive)
     - P(effective | negative) = (P_eff * (1 - sens)) / P(negative)
     - For positive result:
          EV_proceed_after = P(effective|positive) * B - C
          EV_after_positive = max(EV_proceed_after, 0)
     - For negative result: similarly.
     - EV_gather_before_costs = P(positive)*EV_after_positive + P(negative)*EV_after_negative
     - EV_gather = EV_gather_before_costs - S_cost - D

  8. **Compare:**
     - If EV_gather > EV_best_now, then recommend to gather evidence.
     - Otherwise, recommend to decide now.

  9. **Final Recommendation:**
     - If gather evidence: recommend to conduct the study.
     - If decide now and EV_proceed > 0: recommend to proceed.
     - If decide now and EV_proceed <= 0: recommend to abandon.

  **Note:** This is a technical recommendation. Consider ethical, political, and strategic factors before finalizing.
answer: |-
  ### Decision Procedure for Evidence Gathering Recommendations  
  **Ordered Checklist for Analysts**  
  Follow these steps for each funding proposal. Use best estimates when exact values are unknown; flag uncertainties. Terminate at any step if a decisive answer emerges.  

  ---

  #### **Step 1: Clarify the Decision and Alternatives**  
  **Question:**  
  "What are the immediate choices? Define:  
  - **Proceed now**: Commit funds as proposed.  
  - **Gather more**: Conduct a specific study (describe design, cost, duration).  
  - **Abandon now**: Reject the proposal entirely."  

  **Sufficient Answer:**  
  - A clear statement of the choice (e.g., "Scale mentoring to all schools now" vs. "Run a 6-month RCT with 200 students costing $50K").  
  - *Judgment Call*: Ensure the "gather more" option is feasible (e.g., no legal/political barriers).  

  ---

  #### **Step 2: Estimate Costs, Benefits, and Prior Belief**  
  **Questions:**  
  1. "What is the **cost (C)** of proceeding now? (Total funding requested.)"  
  2. "What is the **net benefit (B)** if the program succeeds? (Monetized outcomes: e.g., increased lifetime earnings from mentoring, health savings from lead remediation.)"  
  3. "What is the **probability the program is effective (P_eff)**? (Based on existing evidence. Use 0–1 scale.)"  

  **Sufficient Answers:**  
  - **C** and **B**: Point estimates or ranges (e.g., "C = $1M", "B = $1.5M if effective"). If unquantifiable, use low/medium/high (see Step 6).  
  - **P_eff**: A probability (e.g., "0.4 for mentoring based on pilot"). Default to 0.5 if no prior data.  
  - *Judgment Call*: P_eff requires expert input; B may involve ethical tradeoffs (e.g., valuing health vs. cost).  

  ---

  #### **Step 3: Calculate Expected Value of Proceeding Now**  
  **Calculation:**  
  - **EV_proceed = (P_eff × B) − C**  
  - **EV_best_now = max(EV_proceed, 0)**  
    - If EV_proceed > 0: Proceeding now is better than abandoning.  
    - If EV_proceed ≤ 0: Abandoning now is better.  

  **Termination Point 1:**  
  - If **EV_best_now = 0** (i.e., EV_proceed ≤ 0) AND gathering evidence is costly, **recommend "abandon now"** (no need for costly study if current EV is negative).  

  ---

  #### **Step 4: Specify the Proposed Study**  
  **Questions:**  
  1. "What is the **cost of gathering (S_cost)**? (e.g., study budget + staff time.)"  
  2. "What is the **duration**? How long until results?"  
  3. "What is the **cost of delay (D)**? (Monetized impact of waiting. Estimate:  
     - *Benefits lost during delay*: If effective, what net benefits (B_delay) would accrue in the study period?  
     - *Costs saved during delay*: What costs (C_delay) are avoided by not implementing yet?  
     - **D = C_delay − (P_eff × B_delay)**)"  

  **Sufficient Answers:**  
  - **S_cost** and **duration** (e.g., "$50K, 6 months").  
  - **D**: Simplified formula (e.g., "If mentoring delayed 6 months, B_delay = $150K, C_delay = $100K → D = $100K − (0.4 × $150K) = $40K"). Default to 0 if unknown.  
  - *Violates Non-Negativity Assumption*: Real-world delays incur costs (e.g., kids exposed to lead longer).  

  ---

  #### **Step 5: Compute Expected Value of Perfect Information (EVPI)**  
  **Purpose:** Upper bound on value of any study. If EVPI < cost of gathering (S_cost + D), no study is justified.  
  **Calculation:**  
  - If **EV_proceed > 0**: **EVPI = (1 − P_eff) × C**  
    (Represents expected loss from funding an ineffective program.)  
  - If **EV_proceed ≤ 0**: **EVPI = P_eff × (B − C)**  
    (Represents expected gain from discovering an effective program.)  

  **Termination Point 2:**  
  - If **EVPI ≤ S_cost + D**, **recommend "decide now"** (even perfect info isn’t worth the cost).  
  - If **EVPI > S_cost + D**, proceed to Step 6.  

  ---

  #### **Step 6: Estimate Value of the Proposed Study (Imperfect Info)**  
  **Questions:**  
  1. "What are possible **study results**? (e.g., 'positive/negative' or 'effect size X')."  
  2. "How will results update beliefs? Define:  
     - **Sensitivity (Sens)**: P(positive result | effective program).  
     - **Specificity (Spec)**: P(negative result | ineffective program)."  
  *(Default: Sens = Spec = 0.7 if unknown.)*  

  **Calculations:**  
  1. **P(positive) = (P_eff × Sens) + ((1 − P_eff) × (1 − Spec))**  
  2. **P(effective | positive) = (P_eff × Sens) / P(positive)**  
  3. **P(effective | negative) = (P_eff × (1 − Sens)) / (1 − P(positive))**  
  4. For each result (positive/negative):  
     - **EV_proceed_after = [P(effective | result) × B] − C**  
     - **EV_after_result = max(EV_proceed_after, 0)**  
  5. **EV_gather = [P(positive) × EV_after_positive + P(negative) × EV_after_negative] − S_cost − D**  

  **Termination Point 3:**  
  - If **EV_gather > EV_best_now**, **recommend "gather more"**.  
  - If **EV_gather ≤ EV_best_now**, **recommend "decide now"**.  

  ---

  #### **Step 7: Make Final Recommendation**  
  - If "decide now":  
    - **EV_proceed > 0** → "Proceed now."  
    - **EV_proceed ≤ 0** → "Abandon now."  
  - If "gather more": Specify study parameters.  
  - **Flag**: Non-quantifiable factors (e.g., ethical risks, political constraints).  

  ---

  ### Key Principles  
  1. **Non-Negativity Violations**:  
     - Information has **cost (S_cost)** and **delay (D)**, which can make EV_gather negative.  
     - Decisions **cannot wait** (e.g., urgent health risks).  
     - **Model uncertainty**: Studies often test "given model X" but can’t prove X wrong (e.g., mentoring pilot assumes RCTs predict scale-up).  
     - **Strategic/political factors**: Information may trigger public backlash or influence other actors.  

  2. **Separating Values**:  
     - **Value for decision**: Captured in EV_gather (Step 6).  
     - **Value of knowing**: Ignored (e.g., future programs using this data).  
     - **Value of being seen to study**: Excluded (political, not decision-theoretic).  

  3. **Probability of Changing Decision**:  
     - A **byproduct, not the focus**. High probability doesn’t guarantee high EV_gather (e.g., if study is costly).  
     - Computed in Step 6 as:  
       - **P(change) = P(result leading to different decision)**  
       - *Example*: If proceed now is optimal, P(change) = P(negative result) × P(abandon after negative).  

  ---

  ### Example Evaluations  
  #### **1. Mentoring Pilot (Scale Up)**  
  - **Proposal**: Scale 60-participant pilot (modest effect, not significant) to district. C = $1M, B = $1.5M if effective.  
  - **Prior**: P_eff = 0.4 (weak pilot).  
  - **Study**: $50K, 6 months. B_delay = $150K, C_delay = $100K → **D = $40K**.  
  - **EV_proceed = (0.4 × $1.5M) − $1M = −$400K → EV_best_now = 0** (abandon now).  
  - **EVPI** (since EV_proceed ≤ 0) = 0.4 × ($1.5M − $1M) = **$200K**.  
  - **S_cost + D = $50K + $40K = $90K**. EVPI ($200K) > $90K → proceed to Step 6.  
  - **Study sens/spec**: Sens = 0.33 (low power), Spec = 0.95.  
    - P(positive) = (0.4×0.33) + (0.6×0.05) = 0.162.  
    - P(effective | positive) = (0.4×0.33)/0.162 ≈ 0.815 → EV_after_positive = $222.5K.  
    - EV_after_negative = 0 (abandon).  
    - EV_gather = (0.162×$222.5K) − $50K − $40K ≈ **−$53K**.  
  - **Recommendation**: **Abandon now** (EV_gather < EV_best_now).  
  - **Why non-negativity fails**: Study cost ($50K) and delay cost ($40K) exceed value of information ($36K). Waiting isn’t free.  

  #### **2. Service Contract Renewal**  
