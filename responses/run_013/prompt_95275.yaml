  1. Explicitly account for costs and delays of gathering information.
  2. Consider the irrecoverability of funds and the cost of delay.
  3. Acknowledge that sometimes a decision cannot wait.
  4. Recognize that decision-makers might not be expected-utility maximizers (e.g., due to risk aversion or political pressures).
  5. Separate the value of information for the immediate decision from other values (like being seen to study or the value of knowing for future decisions).
