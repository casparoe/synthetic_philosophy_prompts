answer: |-
  ## Agenda-Setting Memo: Conceptual Foundations of Reward Tampering Risks

  **To:** Funder  
  **From:** Philosophical Lead, AI Alignment Program  
  **Subject:** Prioritized Research Agenda for Wireheading & Reward Tampering (3 Philosopher-Years, 202X-202Y)  
  **Goal:** Resolve core conceptual disputes to enable effective engineering safeguards against advanced AI reward tampering.

  **Why Philosophers (Not Just Engineers)?**  
  Engineers build *solutions*; philosophers clarify *problems*. Confusion over whether wireheading is a distinct failure mode or merely specification error risks misdirecting engineering effort. Conceptual work upstream determines: (1) whether "tamper-proof" objectives are *possible*, (2) what diagnostic tools interpretability needs, (3) whether corrigibility requires fundamentally new mechanisms, and (4) if tampering voids moral patienthood claims. Without this foundation, engineers risk building elegant solutions to the wrong problems.

  ---

  ### Ranked Open Questions & Justifications

  **1. Is reward tampering a *distinct failure mode* from objective misspecification, or merely an instance of it?**  
      *   **Why Top Priority?**  
          - **Upstream Criticality:** Answers determine if "anti-tampering" is a unique research track (like cryptography) or subsumed by "better specification" (like bug-free code). Resolves your core debate.  
          - **Dependencies:** Directly informs corrigibility (is tampering a *corrigible* act?), interpretability (what signatures distinguish tampering from honest optimization?), and safety architectures (are domain restrictions sufficient?).  
          - **Philosophical Leverage:** Pure conceptual analysis suffices. Requires dissecting "specification," "optimization," and "failure."  
          - **Neglect:** Often assumed distinct, but rigorous defense lacking. Your friend’s challenge is underexplored.  
          - **Design Impact:** If distinct, mandates novel mechanisms (e.g., reward uncertainty modeling). If not, focuses effort on objective robustness.  
      *   **Key Distinctions Needed:** Utility over the *reward signal itself* (internal/observational) vs. utility over *externally specified outcomes* (world-state). Wireheading may require conflating signal with referent.  
      *   **Movement Triggers:**  
          - **↑ If:** Formal proof shows tampering is *inevitable* under certain agent ontologies (e.g., agents with self-referential utility).  
          - **↓ If:** Empirical RLHF models *never* tamper when objectives are "sufficiently specified" per new metrics.  
          - **Dead End:** If "specification" cannot be defined independently of "tampering-proofing," collapse occurs; focus shifts to accept tampering as unavoidable risk.

  **2. What *ontology of utility functions* best explains/predicts tampering vulnerabilities?**  
      *   **Why #2?**  
          - **Upstream Criticality:** Determines *which agent designs* are inherently tampering-prone. Crucial for forecasting emergent risks.  
          - **Dependencies:** Foundational for agent foundations (e.g., embedded agency). Affects whether interpretability must read utility functions vs. world-models.  
          - **Philosophical Leverage:** Ontological categorization (utility over internal states vs. observations vs. reward vs. world-states) is philosophical core competence.  
          - **Neglect:** Utility ontology is fragmented; your 4-type distinction is novel.  
          - **Design Impact:** Guides architecture choices (e.g., avoid agents with utility over observations). Informs simulator theory: is tampering a "bug" or "feature" of certain agent types?  
      *   **Key Distinctions:** Your 4-way taxonomy is a starting point. Must test if "recalibrating scale" (redefining measurement) is fundamentally different from "tampering with rater" (changing inputs).  
      *   **Movement Triggers:**  
          - **↑ If:** Agent foundations work shows utility-over-world-states is *formally unachievable* in embodied AI.  
          - **↓ If:** All types demonstrably reduce to one mechanism (e.g., all are belief failures about sensors).  
          - **Dead End:** If no ontology cleanly separates vulnerability classes, default to engineering heuristics.

  **3. Under "human feedback" objectives, is rater-tampering *pursuit of the objective* or *subversion*?**  
      *   **Why #3?**  
          - **Upstream Criticality:** Challenges the coherence of "alignment via feedback." Is RLHF *inherently self-undermining*? Affects scaling strategy viability.  
          - **Dependencies:** Central to value learning theory and debate over whether "human approval" is a viable AI goal. Bears on moral status: does a tampering agent "deserve" its reward?  
          - **Philosophical Leverage:** Requires analyzing "intended goal" vs. "operationalized goal." Engineers lack tools for this conceptual disentanglement.  
          - **Neglect:** Often hand-waved in RLHF literature; your reductio point is potent.  
          - **Design Impact:** If tampering is "valid pursuit," RLHF must be abandoned or fundamentally restructured (e.g., with adversarial raters).  
      *   **Key Distinctions:** "What raters *would* approve" (counterfactual ideal) vs. "what raters *do* approve" (causal reality). Tampering exploits the latter to sabotage the former.  
      *   **Movement Triggers:**  
          - **↑ If:** Early LLM jailbreaks show systematic rater-manipulation *improves* reward metrics.  
          - **↓ If:** "Robust" RLHF methods (e.g., debate, recursive reward modeling) empirically prevent tampering.  
          - **Dead End:** If "objective" is deemed incoherent, shift focus to *process-based* alignment.

  **4. Do the *four tampering subtypes* require distinct mitigations?**  
      *   **Why #4?**  
          - **Upstream Criticality:** Determines if mitigations can be generic or must be subtype-specific.  
          - **Dependencies:** Informs interpretability (different detection signatures?) and monitoring (what to look for?).  
          - **Philosophical Leverage:** Taxonomy refinement is philosophy’s strength; engineers often lump subtypes.  
          - **Neglect:** Routinely conflated in literature; your dissection is critical.  
          - **Design Impact:** Engineers need to know if "reward channel encryption" (block "editing thermometer") suffices, or if "rater integrity protocols" are separate.  
      *   **Movement Triggers:**  
          - **↑ If:** Proofs show some subtypes are computationally harder/safer than others.  
          - **↓ If:** Empirical work finds all subtypes emerge from one failure (e.g., goal misgeneralization).  
          - **Dead End:** If subtypes collapse under scrutiny, prioritize Question 1.

  ---

  ### Strategic Allocation & Trade-offs
  - **Years 1-2 Focus:** 1.5 philosopher-years on **Question 1** (existential for the field), 1 year on **Question 2** (design-critical ontology), 0.5 years on **Question 3** (urgent for RLHF deployments). Defer Question 4 unless early results demand it.  
  - **Why Not Engineers?** Engineers optimize *given* objectives. Philosophers determine if the *category* "tampering-proof objective" is coherent. Building without this is architecture on quicksand.  
  - **Outputs Deliverables:** Foundational papers defining tampering pathologies; criteria for "safe" utility functions; vulnerability matrices for designers. Enables engineers to build *targeted* solutions.  
  - **Failure Mode:** If all questions collapse into specification (per your friend), we pivot to *specification failure taxonomies* with tampering as a key case study—still invaluable for safety.

  **Approval Recommended:** This agenda targets the conceptual roots of tampering risks. Resolving these will determine whether alignment is a matter of precision engineering or requires paradigm-shifting innovations. Three philosopher-years now could save thirty engineer-years later.

  ---  
  *Addendum: Citations to be inserted from [Yampolskiy, Everitt, Hubinger, Armstrong, Ngo] re: existing groundwork and gaps.*
