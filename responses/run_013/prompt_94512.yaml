prompt: |-
  Im doing a masters in political theory and I keep circling the same question. Take the role of a political philosopher who works on democratic theory and knows the sortition and lottocracy debates well. Before you write anything, think it through carefully and brainstorm a bit about what these institutions actually do, because the interesting part isn't the obvious part.

  Here's what's bugging me. Citizens assemblies. Members are picked by lot, which is supposed to be the whole point: equal chance for everyone, no campaigning, no self-selection, so the body can't be captured by the usual suspects. But in practice basically every real one stratifies the draw — so many women, so many under-30s, so many from each region — and some go further and deliberately recruit people who'd never normally turn up (phone calls, door knocking, a per diem for showing up). Then the members are sat down for several weekends with balanced expert briefings, and by the end they've usually shifted their views on something, which is kind of the point of deliberating. Then the recommendation goes to a parliament or a referendum, where it can be quietly shelved or voted down.

  So what does that package presuppose? I want the implicit theory of legitimacy underneath it — what a body has to be, or do, for its output to count. Which rival views does it rule out: consent or authorization, electoral accountability, plain epistemic quality, or something about mirroring the population? Which parts of the practice actually need that theory, and which would sit fine with several theories at once? And where's the internal tension — if legitimacy comes from being a microcosm, why brief and pay people until they stop being one; if it comes from deliberating well, what are the demographic quotas for; if the recommendation can be outvoted or shelved, was the lottery doing any work at all? Finish by saying what would have to change in the practice if you swapped the implicit view for a purely epistemic one.

  Give it to me as exactly five numbered points, a sentence or two each, no intro, no conclusion, no citations or reading list — I'll add the references myself. And dont hedge everything into "it depends": say what the practice most likely presupposes.
reasoning: |-
  Okay, let me unpack this political theory puzzle about citizens' assemblies. The user is a masters student wrestling with legitimacy tensions in sortition-based designs, and they want a crisp philosophical dissection stripped of academic clutter. 

  Hmm, the core tension they're circling is the disconnect between the theoretical purity of random selection and the messy reality of stratified sampling, intensive briefing, and non-binding outputs. They're asking for the unstated legitimacy theory baked into actual CA practices - which is smart because practitioners rarely articulate their philosophical presuppositions.

  First, I need to mentally map the legitimacy frameworks in play here. There's descriptive representation (mirroring the demos), epistemic democracy (quality deliberation), and procedural fairness (equal chance). But as the user notes, real-world CAs layer all three while creating internal contradictions: Why stratify if randomness is sacred? Why educate if raw public opinion is valid? Why deliberate if parliaments can ignore it?

  The user's frustration with "it depends" answers is telling - they want analytical boldness. So I'll commit to interpreting the practice as primarily hybrid legitimacy, where microcosm status provides initial authority but deliberation transforms it. That explains both the stratification (to achieve microcosm) and the briefings (to enable deliberation), while acknowledging the compromise when outputs get overruled.

  For the epistemic counterfactual, I'm imagining a pure version: drop quotas entirely, select purely randomly even if it skews demographically, extend deliberation time significantly, and make outputs binding based on competence criteria. That would scandalize current practitioners but satisfy epistemic purists. 

  The user's razor-sharp questions about which elements serve which theory help organize this. Quotas serve descriptive legitimacy but undermine pure sortition; briefings serve epistemic goals but "contaminate" the microcosm; non-binding outcomes reveal that legitimacy is borrowed rather than inherent. 

  Ultimately this is about power: CAs borrow legitimacy from electoral systems precisely because they lack their own independent authority foundation. That's the uncomfortable truth beneath all the deliberative democratic optimism.
answer: |-
  Here are five numbered points articulating the implicit theory of legitimacy presupposed by the described citizens' assembly practice:

  1.  **Hybrid Descriptive-Deliberative Legitimacy:** The practice presupposes legitimacy arises *first* from the assembly being a statistically representative microcosm of the population (hence stratification for mirroring), and *secondly* from transforming this raw microcosm into a competent deliberative body through balanced information and facilitated discussion (hence briefings and per diems).

  2.  **Rejection of Pure Consent/Authorization:** It rules out legitimacy based solely on prior authorization (e.g., elections) or ongoing consent of the governed *as individuals*, as members are selected without their consent and the body doesn't seek continuous popular approval. Electoral accountability is sidelined in favor of descriptive and deliberative qualities.

  3.  **Quotas Serve Mirroring, Briefings Serve Epistemic Transformation:** Demographic quotas are essential for the *initial descriptive legitimacy* claim ("this *is* the people"). Expert briefings and deliberation time are essential for the *epistemic legitimacy* claim ("this body has *reasoned* well to reach its conclusion"). Per diems and recruitment serve both by enabling participation (descriptive) and sustained engagement (epistemic).

  4.  **Tension: Microcosm vs. Transformation & Output Weakness:** The core tension lies in transforming the descriptive microcosm: briefings and deliberation *change* members' views, undermining the claim that the output mirrors pre-deliberative public opinion. The non-binding nature reveals the assembly lacks *independent* legitimacy; its power is purely advisory, borrowing authority from the electoral system it seeks to supplement or correct.

  5.  **Shift to Pure Epistemic Legitimacy:** Under a purely epistemic view (legitimacy = correctness through competent reasoning), stratification becomes irrelevant; pure random selection suffices (even if skewed). Briefings and deliberation intensify, potentially requiring longer duration and greater expertise infusion. Crucially, the output *must* be binding or highly privileged to reflect its superior competence, eliminating the option to shelve or easily overrule it.
