answer: |-
  Here's the specification table for Maxwell's demon solutions, followed by conflict analysis and key weaknesses:

  ### Requirements for a Valid Solution to Maxwell's Demon
  | Requirement | Case/Principle Forcing It | Non-Negotiable? |
  |-------------|---------------------------|------------------|
  | **1. Resolve the basic trapdoor demon** | Original thought experiment: trapdoor selectively lets molecules pass to create pressure/temp gradient. Must show no net work extraction or entropy decrease in isolated system. | Yes |
  | **2. Uphold the Second Law statistically** | Fundamental thermodynamics: Entropy of a closed system never decreases *on average* for an ensemble of trials. Must allow for *temporary* local decreases if compensated elsewhere. | Yes |
  | **3. Treat the demon as a physical system** | Self-contained universe constraint: Demon has mass, memory, sensors, etc., made of atoms subject to thermodynamics. Must account for its internal state changes and energy exchanges. | Yes |
  | **4. Account for memory as a physical subsystem** | One-bit memory demon: Even a single bit of information storage (e.g., "saw fast/slow molecule") has thermodynamic consequences when reset or correlated. | Yes |
  | **5. Handle pre-existing correlation** | Pre-correlated demon: Demon starts with microstate already recorded (e.g., gas state written on tape). Must show work extraction consumes the correlation, not just "free" energy. | Yes |
  | **6. Address the no-erasure case** | Infinite-storage demon: Never erases memory, accumulates infinite records. Must demonstrate why work extraction ceases despite no reset cost. | Yes |
  | **7. Distinguish measurement from erasure** | Reversible computation: Measurement *can* be thermodynamically reversible; erasure is dissipative. Must separate these operations in accounting. | Yes |
  | **8. Resolve the ratchet and pawl** | Smoluchowski-Feynman ratchet: No memory, asymmetric device in thermal bath. Must show why it cannot extract net work from equilibrium. | Yes |
  | **9. Differentiate single-run vs. ensemble behavior** | Fluctuation theorems: Single trials can appear to violate the Second Law; solution must prove violations vanish when averaged over many trials. | Yes |
  | **10. Specify the entropy cost location** | Accounting clarity: Must identify *where* entropy increases (gas, demon memory, environment) to compensate for local decreases during work extraction. | No (implementation-dependent) |

  ### Conflicts Between Requirements
  1. **Requirement 3 (Physical Demon) vs. Requirement 2 (Second Law)**  
     - **Conflict**: If the demon is an ordinary system with finite resources, its "success" should self-limit (e.g., memory saturates). But the Second Law demands it *never* wins on average.  
     - **Resolution**: Sacrifice **Requirement 3's literal universality**. Allow idealized demons (e.g., infinite initial memory) but show they still fail Requirement 6/9. *Why*: The demon's physicality is a tool to expose hidden costs, but the core physics lies in information-statistical mechanics links.

  2. **Requirement 5 (Pre-correlation) vs. Requirement 7 (Measurement/Erasure Distinction)**  
     - **Conflict**: Pre-correlation seemingly bypasses measurement cost, blurring the measurement/erasure boundary.  
     - **Resolution**: **No sacrifice needed**. Pre-correlation has prior thermodynamic cost (to establish correlation) paid externally. The demon consumes this "resource" like fuel.

  ### Requirement That Eliminates Weak Solutions
  - **Requirement 4 (Memory as Physical Subsystem)** kills popular accounts by forcing explicit modeling of the demon's information storage. Most non-technical explanations ignore memory's heat generation during reset (Landauer's principle) or correlation decay.  
  - **Requirement 5 (Pre-correlation)** specifically annihilates solutions hyper-focused on measurement costs, exposing those that miss correlation thermodynamics.

  ### Handling Your Key Case: The Pre-Correlated Demon
  - **Solution Requirement**: Any account **must show that work extracted ≤ *k*<sub>B</sub>T ln(2) × initial mutual information** between the gas and demon's memory.  
  - **Why**: The "free" pre-written tape implies prior correlation. Work extraction reduces mutual information (e.g., by making gas states more predictable/ordered). When correlation is exhausted, work stops. The "bill" is paid by the correlation's thermodynamic value, not measurement.  
  - **Failure Sign**: Solutions claiming pre-correlation violates the Second Law (it doesn't) or ignoring the correlation's finite capacity.

  ---

  **Word Count**: 798  
  **Use Case**: Test any proposed solution against Requirement 5 (pre-correlation) first—if it fails, the account is incomplete. Then verify Requirement 4 (memory physics) to filter oversimplified "demon as abstract observer" arguments.
