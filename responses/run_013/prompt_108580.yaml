  The requirement that wrecks pop-sci takes? Easily Requirement 4 (memory as physical subsystem). Most oversimplify the demon as an abstract observer, ignoring its thermodynamic cost. 

  For the table, I'll distill each requirement to its sharpest form. No fluff. Their reading group will test drives this against papers, so precision is key. The "non-negotiable" column must be brutally honest—some requirements (like ensemble averaging) are physical necessities; others (like explicit Landauer limits) are framework-dependent. 

  ...Double-checking conflicts: Requirement 6 (no erasure) vs. Requirement 2 (2nd law) seems tense, but perpetual correlation storage avoids erasure costs. As long as work extraction stops when memory saturates, it holds. Good. 

