prompt: |-
  I am a doctoral candidate in the philosophy of physics, and I am trying to work out what the so-called quantum-immortality thesis actually commits one to. I take it to rest on three components, each of which I would like you to hold fixed for the purposes of this question: first, an Everettian, no-collapse reading of quantum mechanics, on which every physically possible outcome of a measurement is realised in some branch; second, a continuity-of-consciousness view of personal identity across branches, on which my future selves in different branches are all genuinely me; and third, a self-locating rule on which, in considering my own future, I assign no weight to those branches in which I do not survive, so that my own death is never among the outcomes I anticipate. I recognise that the third component is contested, but I want to take it as given and see what it implies.

  Please set out the most important implications of this package for practical deliberation. I am particularly interested in three things. First, whether it should change how a rational agent weighs catastrophic risks — both risks borne by the agent herself, such as a medical gamble that is almost certainly fatal but offers a large benefit if survived, and risks borne by others, such as a policy carrying a small probability of global catastrophe. Second, what it implies for the intelligibility of ordinary self-interested risk aversion, and for whether the agent's preferences become in some way inconsistent or non-consequentialist. Third, what it implies for the standard decision-theoretic apparatus of probability and expected utility: in particular, whether the notion of a branch's measure can do the work that probability is meant to do, and what becomes of expected value when the outcomes that would give it its weight are ones the agent never expects to experience. Where your conclusions depend on one or another of the three components above, or where the implications pull in opposite directions, please make that dependence explicit rather than smoothing it over.
reasoning: |-
  Okay, the user is a doctoral candidate in philosophy of physics, focusing on the quantum-immortality thesis. They want to explore its implications for practical deliberation, especially regarding catastrophic risks, risk aversion, and decision theory. The thesis rests on three fixed components: Everettian quantum mechanics, continuity of consciousness across branches, and a self-locating rule ignoring branches where they die.

  First, I need to recall each component clearly. Everettian QM means all possible outcomes occur in separate branches. Continuity of consciousness implies that all future selves in different branches are still "me." The self-locating rule means the agent ignores branches where they don't survive when considering future possibilities.

  The user has three main questions. Let me tackle each systematically. Starting with catastrophic risks. For personal risks, like a medical gamble with high fatality but big payoff if survived. Under this view, the agent would only consider branches where they survive. So even a tiny survival chance means they experience survival. This could encourage risk-taking because the agent expects to always find themselves alive. For global risks, like policies with small catastrophe chances, it's trickier. If the catastrophe kills everyone, no branches survive, so the agent should care. But if some branches survive, even with low measure, the agent expects to be in those. So they might downplay such risks unless extinction is certain in all branches.

  Next, risk aversion and preferences. The agent might paradoxically be risk-seeking with personal survival but risk-averse otherwise. For example, they might take reckless personal gambles but still buy insurance for property damage. This seems inconsistent under standard consequentialism because survival is assured, yet other losses still matter. The self-locating rule creates a discontinuity: death is excluded from consideration, making small survival probabilities irrelevant as long as they're non-zero. This challenges the usual expected utility framework, where probabilities matter continuously.

  Then decision theory. Probability as subjective weight conflicts with the self-locating rule. Branch measure might not function like probability since the agent only cares about the existence of surviving branches, not their measure. Expected utility might need modification, where only outcomes in surviving branches are considered, but the measure might still matter for other aspects like resource distribution. However, without assigning probabilities to survival, the decision-making could become non-consequentialist, focusing on actual outcomes rather than weighted averages.

  I should highlight dependencies. The self-locating rule is crucial for ignoring death branches. Without it, the other components wouldn't lead to quantum immortality. Also, continuity of consciousness allows identifying with future selves across branches. For global risks, the implications depend on whether the catastrophe is total or partial.

  The user might have deeper concerns. They're a doctoral candidate, so they need rigorous analysis for their thesis. They might be exploring if quantum immortality leads to contradictions or undermines decision theory. They could also be interested in ethical implications, like whether this view promotes reckless behavior or neglect of low-probability global threats. Unspoken needs might include clarifying if the position is tenable or if it leads to absurdities that challenge its premises. They might want to see where the theory breaks or how to reconcile it with intuitive risk attitudes.
answer: |-
  Based on the three fixed components (Everettian QM, Branching Identity, Survival-Filtered Self-Location), the quantum-immortality (QI) thesis has profound and often counterintuitive implications for practical deliberation. Below is an analysis addressing your specific questions, highlighting dependencies and tensions:

  ### 1. Implications for Catastrophic Risk Assessment
  *   **Personal Catastrophic Risks (e.g., high-stakes medical gamble):**
      *   **Radical Risk-Tolerance:** A rational agent *should* be extraordinarily tolerant of personal survival risks. Any non-zero quantum amplitude for survival entails that *some* future branches exist where the agent survives. Due to the Survival-Filtered Self-Location rule, the agent anticipates *only* experiencing those survival branches. The measure (amplitude squared) of the survival branches becomes irrelevant to the agent's expectation of *experiencing survival*. They will always find themselves alive after the gamble, regardless of the objective likelihood.
      *   **Implication:** Agents should pursue gambles with extremely low survival probabilities if the payoff in survival branches is high enough. The "almost certainly fatal" aspect is epistemically irrelevant to the agent's future subjective experience. They expect to be one of the "lucky" survivors, not because of luck, but because *all* survivors are "them".
      *   **Dependency:** This relies critically on the **Survival-Filtered Self-Location Rule**. Without it, the vanishingly small measure of survival branches would dominate decision-making under standard decision theories. The **Branching Identity** is also crucial – if future survivors aren't "me", the gamble remains terrifying.

  *   **Global Catastrophic Risks (e.g., policy with small risk of human extinction):**
      *   **Asymmetry & Measure-Sensitivity:** Here, implications diverge sharply:
          *   **Total Extinction Scenarios:** If the catastrophe *annihilates all conscious observers* (e.g., true vacuum decay sterilizing the universe), then *no* future branches contain the agent (or any observers). The Survival-Filtered Self-Location Rule implies the agent *should* anticipate experiencing *nothing* post-catastrophe (i.e., permanent cessation). Therefore, **extinction risks retain full weight** proportional to their branch measure. Preventing extinction remains paramount.
          *   **Non-Extinction Catastrophes:** If the catastrophe leaves *some* surviving observers/branches (e.g., nuclear war killing 99.9% but not 100%), the agent, applying the Survival-Filtered Self-Location Rule, anticipates being in a survival branch. The *magnitude* of the catastrophe (e.g., collapse of civilization, suffering of survivors) *within those survival branches* still matters. However, the *probability* (branch measure) *of the catastrophe occurring at all* becomes less relevant to the agent's expectation of *experiencing the catastrophe's consequences*. They expect to be in a world where the catastrophe *did not prevent their survival*, though they may experience its aftermath.
      *   **Implication:** QI agents should be highly concerned with **total extinction risks** (weighted by measure) but potentially less concerned with the *likelihood* of **non-extinction catastrophes**, focusing instead on mitigating their *severity in survival branches*. This creates a stark asymmetry.
      *   **Dependency:** This distinction hinges entirely on whether the catastrophe eliminates *all* branches with observers (**Everettian QM** defining the possibilities) and the **Survival-Filtered Self-Location Rule** filtering the agent's perspective. The **Branching Identity** ensures the surviving observers are "them".

  ### 2. Intelligibility of Risk Aversion & Preference Consistency
  *   **Erosion of Self-Interested Survival Risk Aversion:** Under QI, ordinary aversion to personal death risk becomes **rationally unintelligible** for the agent. Why fear something you *know* you will never experience? The subjective anticipation of death vanishes. Standard justifications for risk aversion (diminishing marginal utility of life-years, intrinsic fear of non-existence) are circumvented by the guaranteed subjective survival.
  *   **Paradoxical Risk Preferences & Inconsistency:**
      *   **Risk-Seeking for Survival, Risk-Averse for Other Losses:** The agent becomes radically risk-*seeking* regarding events potentially causing their *death*. However, they remain rationally risk-*averse* regarding events causing non-fatal losses *within survival branches* (e.g., injury, financial ruin, loss of loved ones). They avoid gambles likely to leave them poor but unharmed, while embracing gambles likely to kill them.
      *   **Consequentialism Under Strain:** This pattern is **inconsistent with standard consequentialism**. Standard consequentialism evaluates acts based on the *expected* (probability-weighted) value of outcomes across *all* possible states. QI deliberation explicitly ignores entire classes of states (death branches) regardless of their measure. The Survival-Filtered Self-Location Rule acts as a non-consequentialist filter on the state space considered relevant.
      *   **Source of Inconsistency:** The core inconsistency stems from the **Survival-Filtered Self-Location Rule**. It introduces a fundamental discontinuity: Branches with survival probability ε > 0 are treated identically to branches with survival probability 1.0 (you expect to experience them), while branches with survival probability 0 are treated completely differently (you expect non-existence). Standard utility theory assumes continuous trade-offs. This rule makes the transition between ε>0 and ε=0 a catastrophic shift in anticipated experience, violating continuity.
  *   **Dependency:** This entire tension arises from the interaction of the **Survival-Filtered Self-Location Rule** with standard consequentialist frameworks. The **Branching Identity** and **Everettian QM** provide the metaphysical structure enabling this filtering.

  ### 3. Implications for Decision Theory (Probability, Measure, Expected Value)
  *   **Branch Measure vs. Subjective Probability:** Branch measure (amplitude squared) **cannot straightforwardly play the role of subjective probability** for the agent regarding their *own survival*. The Survival-Filtered Self-Location Rule severs the link between measure and the agent's expectation of experiencing an outcome *involving their survival*. For survival-contingent events, measure becomes relevant only for:
      *   Predicting the *objective distribution* of outcomes across the multiverse.
      *   Events *not* contingent on the agent's survival (e.g., total extinction, the outcome of a coin flip *in branches where they survive*).
  *   **Expected Utility (EU) in Crisis:**
      *   **The Collapse of EU for Survival Gambles:** The standard EU formula Σ [P_i * U(O_i)] breaks down for actions affecting survival. Branches where the agent dies (O_death) are assigned P_i > 0 by the physics (Everettian QM), but U(O_death) is *effectively undefined or irrelevant* for the agent due to the Survival-Filtered Self-Location Rule – they anticipate no such experience. Assigning U(O_death) = -∞ doesn't help, as the rule makes the agent disregard these branches regardless of weight.
      *   **A Modified "Survival-Conditioned Expected Utility" (SCEU)?** Rational deliberation might focus *only* on branches where the agent survives. The "value" of an action could be calculated as the *measure-weighted average utility* **across surviving branches only**: SCEU(A) = Σ_{i: Survive} [μ_i * U(O_i)] / Σ_{i: Survive} μ_i. This rescales the measure within the surviving subspace to sum to 1.
      *   **Problems with SCEU:**
          *   **Ignores Measure of Survival Itself:** SCEU treats surviving with μ=10^-100 identically to surviving with μ=1, as long as survival occurs. The *cost* of making survival improbable (low total survival measure Σ_{i: Survive} μ_i) isn't directly captured in SCEU – the agent expects to survive regardless. SCEU only cares about the *conditional* distribution *given* survival.
          *   **Consequences for Others:** SCEU focuses solely on the agent's experience in survival branches. Low-measure survival branches might contain immense suffering for others, or conversely, high-measure death branches might prevent global suffering. SCEU largely disregards these broader consequences if they don't impact the agent's utility *within their survival branch*. This raises significant ethical concerns.
          *   **Non-Consequentialist Foundation:** The selection of the relevant state space (surviving branches) is dictated by the non-consequentialist Survival-Filtered Self-Location Rule. The decision rule (SCEU) is consequentialist *within* that filtered space, but the filtering itself isn't.
  *   **Dependency:** The need for a radically modified decision theory stems entirely from the **Survival-Filtered Self-Location Rule**. The **Everettian QM** framework provides the measure μ_i, and the **Branching Identity** allows the agent to identify with the survivors for utility calculation.

  ### Summary of Key Tensions and Dependencies
  *   **The Central Tension:** The **Survival-Filtered Self-Location Rule** fundamentally conflicts with the core principles of probability-based expected utility maximization by creating a privileged, measure-insensitive status for branches containing a future instance of "oneself".
  *   **Dependence on Rule 3:** Virtually all the striking implications (radical personal risk tolerance, erosion of death aversion, breakdown of standard EU) are *direct consequences* of Rule 3. Without it, Everettian QM + Branching Identity leads to very different (e.g., measure-weighted) decision theories.
  *   **Dependence on Rule 2:** Branching Identity is essential for the Survival-Filtered Rule to have personal significance. If survivors aren't "me", filtering death branches doesn't guarantee *my* subjective survival.
  *   **Global vs. Personal Risk Asymmetry:** Rule 3 creates a stark difference in how personal survival risks (ignored) vs. total extinction risks (fully weighted) are treated, due to the presence or absence of *any* survival branches.
  *   **Consequentialism Undermined:** The deliberate exclusion of high-measure branches from consideration based on a self-locating perspective makes the overall decision process non-consequentialist, even if a form of consequentialism operates within the filtered set of branches.

  In essence, adopting this QI package transforms rational agency. The agent becomes a "subjective immortal," for whom personal death is not a future experiential possibility. This necessitates abandoning standard risk aversion towards death, encourages extreme personal gambles, and forces a radical revision of decision theory that prioritizes conditional outcomes in survival branches over the absolute likelihood of survival itself, while maintaining vigilance against total extinction. The resulting position is powerful internally but leads to significant ethical and decision-theoretic paradoxes when interfacing with the broader world and standard frameworks.
