  ### Two-Envelope Puzzle: Concrete Case  

  **Distribution of Smaller Amount \(X\)**:  
  - \(X = 10\) with probability \(0.5\)  
  - \(X = 20\) with probability \(0.3\)  
  - \(X = 40\) with probability \(0.2\)  

  Envelopes contain \((X, 2X)\). You pick one uniformly at random.  

  **Joint Distribution (Your Envelope, Other Envelope)**:  
  | Your Envelope | Other Envelope | Probability |  
  |---------------|----------------|-------------|  
  | 10            | 20             | 0.25        |  
  | 20            | 10             | 0.25        |  
  | 20            | 40             | 0.15        |  
  | 40            | 20             | 0.15        |  
  | 40            | 80             | 0.10        |  
  | 80            | 40             | 0.10        |  

  **Unconditional Expected Value (Blind Swap)**:  
  - \(E[\text{Keep}] = 10 \cdot 0.25 + 20 \cdot 0.40 + 40 \cdot 0.25 + 80 \cdot 0.10 = 28.5\)  
  - \(E[\text{Swap}] = 20 \cdot 0.25 + 10 \cdot 0.25 + 40 \cdot 0.15 + 20 \cdot 0.15 + 80 \cdot 0.10 + 40 \cdot 0.10 = 28.5\)  
  **→ Blind swapping is break-even.**  

  **Tempting Reasoning (After Opening)**:  
  - If you see \(Y\), the other envelope is \(Y/2\) or \(2Y\)?  
  - E.g., see \(20\): "Other is \(10\) or \(40\) with \(50/50\)? Then \(E[\text{Other}] = (10 + 40)/2 = 25 > 20\) → seems to favor swapping!"  
  - But actual conditional expectations:  
    - See \(10\): Other = \(20\) (swap gains \(+10\)).  
    - See \(20\): \(P(\text{Other}=10) = 5/8\), \(P(\text{Other}=40) = 3/8\) → \(E[\text{Other}] = 10 \cdot 5/8 + 40 \cdot 3/8 = 21.25 > 20\).  
    - See \(40\): \(P(\text{Other}=20) = 3/5\), \(P(\text{Other}=80) = 2/5\) → \(E[\text{Other}] = 20 \cdot 3/5 + 80 \cdot 2/5 = 44 > 40\).  
    - See \(80\): Other = \(40\) (swap loses \(-40\)).  
  **→ Swapping *seems* beneficial for \(Y = 10, 20, 40\), but not for \(Y = 80\).**  

  **Cutoff Rule: Swap if \(Y < 80\), else keep.**  
  - See \(10\): swap → gain \(20\).  
  - See \(20\): swap → average gain \(21.25\).  
  - See \(40\): swap → average gain \(44\).  
  - See \(80\): keep → gain \(80\).  
  - \(E[\text{Cutoff}] = 20 \cdot 0.25 + 21.25 \cdot 0.40 + 44 \cdot 0.25 + 80 \cdot 0.10 = 32.5\)  

  **Comparison**:  
  | Strategy      | Expected Value |  
  |---------------|----------------|  
  | Always Keep   | 28.5           |  
  | Always Swap   | 28.5           |  
  | Cutoff Rule   | **32.5**       |  

  **Why the Cutoff Rule Wins**:  
  The distribution is **skewed** (\(P(X=10) > P(X=20) > P(X=40)\)) and **overlapping** (e.g., \(20\) appears in two pairs). This asymmetry allows the cutoff rule to exploit conditional gains for \(Y < 80\) while avoiding a large loss at \(Y = 80\). Blind strategies miss this conditioning.  

  **Follow-Ups**:  
  1. **Objection**: "Using a cutoff cheats by leveraging the seen amount!"  
     **Reply**: The puzzle allows you to open the envelope. The cutoff uses only *your observed amount*, which is given information. Unconditional strategies ignore this, so they are strictly worse.  

  2. **Flattened Distribution (Uniform \(X\) over \(\{10, 20, 40\}\))**:  
     - \(E[\text{Keep}] = E[\text{Swap}] = 35\).  
     - Cutoff rule (swap if \(Y < 80\)): \(E[\text{Value}] = 250/6 \approx 41.67 > 35\).  
     **→ The effect persists!** The key is not the probabilities but the **overlap in envelope amounts** and the **existence of a maximum-amount pair**, enabling the cutoff to avoid a loss at the top.  

  **No Infinities, No Improper Priors, Finite Support → Self-contained and robust.**
