answer: |-
  Your position—that moral considerability for video-game characters arises from a character's functional role in the game's *mechanics* (rules, affordances, normative economy) rather than player sentiment or mere fictional existence—faces challenges across several axes. Below, I rank defeaters from **fatal** to **merely awkward**, analyze what would falsify the view, its unique predictions, and its risks. Crucially, I anchor the fatal case in the affordance/fiction divergence you requested.

  ---

  ### **Fatal Defeaters**  
  *If true, these force abandonment or radical revision of the view.*

  1. **The "Cogmind" Scenario (Affordance/Fiction Divergence):**  
     - **Case:** A strategy game features NPCs with complex mechanics: they make choices (e.g., resource allocation, tactical retreats), have frustratable interests (e.g., survival, efficiency), and impact the game's economy (e.g., trade penalties if exploited). However, the *fiction* explicitly frames them as non-sentient: they are robots following programmed routines, with lore stating they lack inner states. Players universally treat them as tools.  
     - **Why fatal?** Your theory predicts moral considerability due to mechanical agency, but the fictional framing overrides this. If players *and* designers deny moral weight despite robust mechanics, the "locus of agency" status hinges on fictional personhood, not just mechanics. This collapses the irreducibility claim.  
     - **Defender's burden:** Must argue that mechanical agency *should* grant status regardless of fiction—but this contradicts actual practice, violating the "practice-dependent" core.

  2. **Moral Overgeneration in Abstract Games:**  
     - **Case:** A puzzle game (e.g., *Tetris*) has "blocks" with "interests" (e.g., blocks "want" to fit neatly; gaps "frustrate" grid integrity). The rules penalize misplacement (normative economy), and blocks "act" (rotate, fall).  
     - **Why fatal?** Your view grants considerability to any entity with game-mechanical "interests" and "frustration," but we intuitively reject moral duties to Tetris blocks. This reduces the view to absurdity, showing that mechanical agency alone is insufficient without *anthropomorphic fiction*.  
     - **Defender's response:** Qualify that "interests" require *goal-directedness* akin to biological agents. But this smuggles in fiction/sentience, undermining practice-dependence.

  ---

  ### **Serious but Potentially Survivable Defeaters**  
  *These demand significant qualification but don't destroy the core.*

  3. **Player Sentiment as Necessary Condition:**  
     - **Case:** Games with identical mechanical agency (e.g., NPCs in *Stardew Valley* vs. *RimWorld*) elicit radically different moral responses. Players feel obligations to Stardew characters but treat RimWorld colonists as resources, despite both having frustratable needs.  
     - **Threat:** Suggests moral considerability is player-relative, not embedded in mechanics.  
     - **Defender's move:** Argue that RimWorld's mechanics *allow* instrumentalization (e.g., organ harvesting is rewarded), thus altering the normative economy. But this risks circularity: the rules "allow" frustration only if we already deny moral status.

  4. **The "Disposable Clone" Problem:**  
     - **Case:** In a multiplayer game (e.g., *Team Fortress 2*), clones of the same character are spawned endlessly. Each has identical mechanical agency (goals, frustratable interests), but players see them as expendable copies.  
     - **Threat:** Mechanical agency exists, but considerability vanishes due to non-unique existence.  
     - **Defender's move:** Claim clones lack *persistent identity*—a prerequisite for "locus of agency." But games rarely track identity mechanically, forcing reliance on fiction.

  ---

  ### **Awkward Defeaters**  
  *Challenges the view's elegance or scope but not coherence.*

  5. **Non-Player Characters as Environmental Hazards:**  
     - **Case:** Enemies in *Dark Souls* respawn when rested, have goals (kill player), and interests (survival), but are "cleansed" mechanically to reset levels. Players feel no moral restraint.  
     - **Awkwardness:** Your view must explain why respawning voids considerability. Possible reply: Respawning turns them into "obstacles," not persistent agents. But this feels ad hoc.  

  6. **Exploitative Game Design:**  
     - **Case:** A game *rewards* frustrating NPC interests (e.g., farming "suffering" for resources in a dystopian sim). If mechanics determine morality, this is morally abhorrent by design—yet players comply.  
     - **Awkwardness:** Implies game designers can "dictate" morality, conflicting with moral realism. Defender may bite the bullet: "Yes, practices create context-specific duties."

  ---

  ### **What Would Falsify the View?**  
  The view is falsified if:  
  - **Mechanical agency is present but moral considerability is absent** *and* this absence is explained by non-mechanical factors (e.g., fictional framing, player psychology) that systematically override mechanics.  
  - **Moral considerability arises without mechanical agency**, e.g., from pure narrative or player empathy alone (e.g., a passive NPC with no goals evokes moral concern).  

  ---

  ### **Unique Predictions**  
  Your account predicts:  
  1. Moral considerability in *minimally fictional* but mechanically rich NPCs (e.g., a stock trader in a finance sim with complex goals).  
  2. No moral weight for *deeply fictionalized* but mechanically inert NPCs (e.g., a "suffering" background character with no gameplay role).  
  3. Moral dilemmas in games with **conflicting mechanical interests** (e.g., choosing which NPC to save based on their in-game utility).  

  Rival accounts (e.g., sentimentalism) cannot predict #1 or #2; fiction-based accounts fail at #1 and #3.  

  ---

  ### **Risks and Insulation**  
  - **Risks:** Overextension (Tetris blocks), moral relativism (designer tyranny), and counterintuitive duties (to clones/hazards).  
  - **Insulation:** By anchoring in "practice," you avoid metaphysical debates about fictional minds. But this limits universality—your morality is *local* to gameplay contexts.  

  **Verdict:** Your view is strongest when fiction and mechanics align (e.g., *The Last of Us* NPCs) but fatally vulnerable when they diverge **(Cogmind Scenario)**. To survive, you must either concede that fiction constrains mechanical agency or redefine "agency" to require fictional personhood—risking collapse into fiction-centric accounts. The most defensible path is to retreat to a weaker claim: mechanical agency is *necessary but not sufficient*, requiring *some* fictional support.
