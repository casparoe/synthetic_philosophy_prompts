prompt: |-
  I retired from the biology department about six years ago and, to keep busy, I've been volunteering at our small county natural history museum, mostly typing the insect collection into a new database. We've got about 40,000 pinned specimens and a lot of them came in from old collections with inconsistent labels, so several times a day one of us hits the same question: is this one specimen that got catalogued twice, or whose label got recopied at some point, or is it two seperate specimens that just look identical on paper? The whole point of the digitization is that these records go out to a public database and get used for range maps and loan records, so a wrong merge looses the provenance and a wrong split invents a specimen that never existed. The volunteers are retirees and grad students with about five minutes per record, and the curator has to sign off on anything that would touch a type specimen.

  What I want from you is a procedure we can actually run, not a lecture. The questions in order, what counts as a good enough answer to each one, where it stops and says "these are two records of one specimen" or "these are two specimens," and where it stops and hands the thing to the curator because the question turned out to be a judgment call rather than something you can look up.

  Here's what got me thinking about it this way. I've been reading a little philosophy since I retired, and I ran into Leibniz's principle that there can't be two things differing only in which thing they are, no numerical difference without some other difference, and then Max Black's 1952 paper in Mind where he imagines a universe with nothing in it but two identical iron spheres. I gather the principle isn't obviously safe, and that much of the argument is over whether things like "being this particular one" or "sitting in this drawer" count as properties, and whether the principle is meant to cover only a thing's intrinsic properties or all of them including its relations. I also half remember from quantum mechanics that identical particles are treated as genuinely indistinguishable, so that swapping two electrons doesn't give you a new state, and I'd like you to say whether that's actually relevant here or whether I'm just showing off something I don't remember properly. Use whatever of this is really doing work and drop the rest; don't pad it with name-dropping.

  Two things I want you to be honest about. First, where the procedure is quietly assuming something metaphysical that might be false. I suspect a rule like "if every field matches, merge them" is exactly that, and I'd like to know what it's assuming, since our records only ever list a handful of properties out of all the properties a specimen has. Second, where the procedure will misfire even if that assumption is fine, and which distinctions have to survive the simplification for the volunteers.

  Then run it on three cases:

  1. Two beetles, same species, same collector, same date, same locality, same field number; one card has "dupl." penciled in the corner, and they're filed in different drawers.
  2. Two cards identical in every field we record, same drawer, no distinguishing marks, same handwriting throughout.
  3. A cluster: card A matches B on collector and date, B matches C on locality and number, but A and C disagree on species and date.

  Include the case where your procedure tells me something I don't want to hear. My hunch is that the answer on case 2 will come out as "it depends on something you can't read off the label," and if so, say so plainly, tell me what the default should be, and say who ought to decide.

  Finish with a single last line in exactly this form, giving your verdict on case 2: \answer{MERGE} or \answer{SPLIT} or \answer{ESCALATE}.

  Please write in American English.
reasoning: |-
  Alright, the user is a retired biology professor volunteering at a natural history museum, digitizing insect specimens. They need a practical procedure to decide when to merge records (as duplicates) or split them (as separate specimens), especially when labels are inconsistent. The key is to avoid errors that could mislead research, like merging two distinct specimens or splitting one into two.

  First, I need to address their philosophical references—Leibniz's principle and Max Black's spheres. Leibniz says no two things can be identical in all properties, but in practice, museum records only capture a subset of properties. So, the procedure can't rely on perfect metaphysical identity. Quantum indistinguishability isn't relevant here since specimens are macro objects with locations and histories. I should focus on what's practical: labels and physical context.

  The user wants honesty about assumptions. The big one is that if all recorded fields match, we assume it's one specimen. But this ignores unrecorded differences, like physical damage or hidden notes. Also, mistakes happen—e.g., a volunteer might copy a label wrong. So, the procedure must include checks for common errors and escalate when evidence conflicts.

  For the cases:
  1. Two beetles with identical data, but one has "dupl." and they're in different drawers. "Dupl." likely means duplicate, so they're separate specimens. Default: SPLIT.
  2. Identical cards in the same drawer, no marks. Here, it's tricky. They could be one specimen with a copied label or two identical ones. Without physical inspection, we can't know. Must ESCALATE to the curator.
  3. Cluster: A-B match on some fields, B-C on others, but A-C conflict. This suggests a chain where B might be the original, and A/C are errors. Check species first—if A and C disagree, it's likely two specimens. Default: SPLIT, but note the conflict.

  The procedure needs clear steps:
  - Start with exact matches on core fields (species, collector, date, locality, number). If all match, check for physical cues like location or notes.
  - If conflicts arise (e.g., "dupl." or drawer differences), split.
  - If everything matches but no physical distinction, escalate—curator must inspect the actual specimens.

  For case 2, since no distinguishing marks and same drawer, it could be a labeling error. But volunteers can't resolve this; it requires physical checking. So, verdict: ESCALATE.

  Final output: \answer{ESCALATE}
answer: |-
  Below is a practical, step-by-step procedure for your volunteer team to resolve specimen record conflicts during digitization. It prioritizes efficiency (5 minutes/record), minimizes metaphysical assumptions, and flags judgment calls for curator review. The procedure assumes **extrinsic, label-based properties** (e.g., collector, date, drawer location) are primary—not intrinsic ones (e.g., microscopic wear)—since your records can't capture the latter.  

  ### Key Assumptions & Limitations  
  1. **Metaphysical assumption**: "If all *recorded* label fields match exactly, they *likely* represent one specimen." This assumes your recorded fields (species, collector, date, locality, number, drawer) are sufficient *in practice* to distinguish specimens. **Why it might fail**: Labels could omit hidden properties (e.g., DNA, damage) or contain human errors (e.g., a copied label with a typo).  
  2. **Where it misfires**:  
     - **False merges**: If two specimens share identical label data (e.g., mass-collected insects with same field number).  
     - **False splits**: If one specimen has minor label variants (e.g., "Rd." vs. "Road").  
     - **Critical distinctions**: Drawer location, handwritten notes (e.g., "dupl."), and conflicts in core fields (species/date) MUST survive simplification—they’re your "red flags."  

  ### Procedure: "Merge, Split, or Escalate?"  
  **Follow these steps in order. Stop at the first conclusive answer.**  
  1. **Exact match?** Check all recorded fields (species, collector, date, locality, field number, drawer).  
     - **If ALL match + NO notes/conflicts** → Go to Step 2.  
     - **If ANY mismatch** → Go to Step 3.  

  2. **Check for physical distinctions** (≤1 minute):  
     - **Same drawer?**  
       - Yes + NO labels like "dupl." → **ESCALATE to curator** (could be one specimen with a copied label or identical twins).  
       - No → **SPLIT** (different drawers imply separate specimens; e.g., one was a gift).  
     - **Notes like "dupl." or "exchange"?**  
       - Present on ANY label → **SPLIT** (explicit evidence of multiple specimens).  

  3. **Cluster conflicts (e.g., A-B match, B-C match, A-C mismatch)?**  
     - **Species mismatch?**  
       - Yes → **SPLIT** (species errors are rare; likely distinct specimens).  
     - **Date/locality mismatch?**  
       - Yes → **SPLIT** (unless obvious typo, e.g., "2023" vs. "2022"; volunteers can’t verify this quickly).  
     - **Only field number matches?** → **ESCALATE** (could be a recording error or batch collection).  

  4. **Default for uncertainty**:  
     - If unresolved after 5 minutes → **ESCALATE**. Never guess—false splits/merges harm data integrity.  

  ### Case Walkthroughs  
  **Case 1: Two beetles, same species/collector/date/locality/number; one has "dupl." penciled, different drawers.**  
  - Step 1: All fields match *except* drawer + note.  
  - Step 2: "dupl." note present → **SPLIT**. (The note confirms separate specimens; drawers reinforce this.)  
  - **Verdict: SPLIT**  

  **Case 2: Two cards identical in all recorded fields, same drawer, no notes, same handwriting.**  
  - Step 1: All fields match.  
  - Step 2: Same drawer + no notes → **ESCALATE to curator**. (Handwriting match suggests a copied label, but it could be two specimens from a batch. Volunteers can’t physically inspect for differences like pin damage or hidden ink. Default: Do not merge or split.)  
  - **Verdict: ESCALATE**  

  **Case 3: Cluster: A matches B (collector/date), B matches C (locality/number), A and C mismatch (species/date).**  
  - Step 3: Species mismatch between A and C → **SPLIT**. (B is likely linked to C; A may be a mislabeled or distinct specimen. Species conflicts are high-priority red flags.)  
  - **Verdict: SPLIT**  

  ### When the Procedure "Tells You What You Don’t Want to Hear"  
  - **Case 2 outcome**: Your hunch is correct. Even with perfect label matches, physical inspection is essential. Two specimens could exist (e.g., a collector’s duplicate set with identical labels). Merging risks creating a false "super specimen"; splitting invents a phantom.  
  - **Default action**: ESCALATE. The curator must:  
    - Physically inspect specimens for differences (e.g., wear, supplemental labels).  
    - Check loan logs or collector journals if available.  
  - **Who decides**: Curator only. Volunteers lack time/expertise for this.  

  ### Final Verdict for Case 2  
  \answer{ESCALATE}
