prompt: |-
  I teach a graduate seminar that pairs animal ethics with conservation biology, and I'm writing the take-home final for its closing unit, which asks whether destroying habitat might actually reduce the total suffering of wild animals. I want to avoid the obvious essay question, because students can answer a general "assess the debate over wild animal suffering" prompt by recycling a summary — the r-strategist point, the sheer number of invertebrates, the asymmetry between pleasure and pain — without doing any reasoning of their own, and because the topic invites hand-waving in both directions. So instead of asking for a survey, I've drafted a specific version of the argument for students to attack, and I'd like the exam question built around it. For the sake of the exercise I'll tell them to treat the ecological figures as stipulated, so the essay turns on the reasoning rather than on contested population estimates: a hectare of primary tropical forest supports vastly more individual animals than a hectare of cattle pasture, which in turn supports more than a hectare given over to a solar array; the great majority of the forest animals die before reproducing, and many die by predation, parasitism, starvation, dehydration, or disease; a typical wild animal's life contains more suffering than enjoyment; and, other things equal, a world with less total suffering is better than one with more. From those premises the argument concludes that converting forest to pasture — and pasture to something still more barren — reduces the world's suffering and is, to that extent, a good thing.

  Please write the question as it would appear on the paper, with the argument set out in numbered premises and a note that the ecological figures are stipulated, for an in-class final of ninety minutes and roughly a thousand words, worth twenty-five marks. The question should force students past the summary: it should make them separate the empirical premises from the evaluative ones and say how confident one can reasonably be in each; make them confront the fact that the conclusion is driven by animals — invertebrates, above all — whose sentience is exactly what we are least sure about, and say how one should reason under that uncertainty; and make them take a position on the limiting case in which the same logic recommends a near-sterile landscape, saying whether that outcome is a reductio of the argument or a bullet the welfarist should bite. I'd also like them to say what would have to be true for the conclusion to follow and whether the argument, so understood, is self-undermining.

  Along with the question, give me a model answer of about nine hundred words and a marking scheme out of twenty-five. The marking scheme should name the specific moves a top answer must make — for instance, the exact point at which the arithmetic and the evaluative premise interact, or the reason the argument's conclusion is sensitive to facts about invertebrate welfare rather than to the numbers alone — and not generic virtues like "clear structure." For each move, add a one-line note on how a merely competent answer typically falls short, so that the A/B boundary is legible: what a first-class script must contain, and what a solid but unremarkable one will typically leave out. The model answer should itself perform those moves, so a grader can see what hitting each point looks like in prose.
reasoning: |-
  Okay, the user is teaching a graduate seminar combining animal ethics and conservation biology. They're designing a take-home final exam focused on whether habitat destruction could reduce wild animal suffering. They want to avoid generic essay questions that allow students to just summarize existing arguments without critical thinking. Instead, they've drafted a specific argument with stipulated ecological data to force deeper engagement.

  The core challenge is crafting a question that makes students:
  - Separate empirical vs. evaluative premises
  - Grapple with uncertainty about invertebrate sentience
  - Confront the "sterile landscape" implication
  - Analyze if the argument self-undermines

  I need to build the exam question around their stipulated premises:
  1. Habitat conversion reduces animal density (forest > pasture > solar)
  2. Most wild animals die painfully young
  3. Average wild life has net suffering
  4. Less total suffering = morally better

  The conclusion suggests habitat destruction could be good. But the user wants students to dissect this rigorously.

  For the question structure, I'll:
  - Present premises as numbered bullet points
  - State ecological figures are stipulated
  - Include 4 required analysis tasks in the prompt
  - Specify word count and grading weight

  The marking scheme must be hyper-specific - no vague "good structure" comments. I'll identify 5 key moves worth 4-5 points each, totaling 25. For each move:
  - Define what excellence looks like
  - Note how B-grade answers fall short

  Model answer requirements:
  - Directly address all 4 prompt tasks
  - Demonstrate each marking scheme move
  - Explicitly discuss invertebrate uncertainty
  - Engage the sterile landscape paradox
  - Word count around 900

  Biggest pitfalls to avoid in model answer:
  - Don't just reject the conclusion (must engage seriously)
  - Don't question stipulated ecology (per user instructions)
  - Must show how evaluative premises drive the argument

  The sterile landscape reductio is crucial - I'll have the model answer argue this exposes the argument's consequentialist extremism, but note how a hardline welfarist might defend it. That distinction separates A/B grades.
answer: |-
  Below is the final exam question designed to meet your specifications, followed by a detailed marking scheme and a model answer. The question forces students to engage with the argument’s structure, ethical uncertainty, and implications rather than summarizing familiar debates.

  ---

  ### Final Exam Question  
  **Wild Animal Suffering and Habitat Conversion**  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 1000 words  
  **Marks:** 25  

  Consider the following argument for the claim that converting biodiverse habitats (e.g., forests) to less biodiverse land uses (e.g., pasture or solar arrays) reduces net suffering and is, to that extent, morally desirable:  

  1. **Density Premise**: A hectare of primary tropical forest supports vastly more individual animals than a hectare of cattle pasture, which in turn supports more than a hectare of solar array.  
  2. **Mortality Premise**: The great majority of animals in such habitats die before reproducing, often through predation, parasitism, starvation, dehydration, or disease.  
  3. **Welfare Premise**: For a typical wild animal, life contains more suffering than enjoyment (i.e., net negative welfare).  
  4. **Axiological Premise**: Other things equal, a world with less total suffering is better than one with more.  
  **Conclusion**: Therefore, converting forest to pasture (or pasture to solar arrays) reduces total suffering and is a good thing.  

  **Note**: Treat all ecological claims (e.g., population densities, causes of death) as *stipulated facts*. Do not challenge their accuracy.  

  **Your Task**: Critically evaluate this argument by addressing **all** of the following:  
  - **A.** Separate the *empirical* premises (relying on observation) from the *evaluative* premises (relying on ethical/value judgments). For each, explain how confident we can reasonably be in its truth and why.  
  - **B.** Identify why the conclusion hinges crucially on assumptions about the sentience and welfare of *invertebrates* (e.g., insects, nematodes). Explain how we should reason about the argument’s force given our profound uncertainty about invertebrate sentience.  
  - **C.** Confront the argument’s "limiting case": If taken to its logical extreme, it could endorse creating a near-sterile landscape (e.g., a solar array) to minimize suffering. Is this outcome a defensible implication for a committed welfarist, or a *reductio ad absurdum* that undermines the argument? Justify your view.  
  - **D.** State what *must* be true for the conclusion to follow validly from the premises. Then, discuss whether the argument is *self-undermining*: Does acting on it risk creating a world that violates its own axiological premise (e.g., by increasing suffering elsewhere or undermining values like biodiversity)?  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Each criterion focuses on a specific analytical move. Award marks as follows:**  

  1. **Separation of empirical/evaluative premises & assessment of confidence** (5 marks)  
     - **Top (5)**: Clearly labels Premises 1–2 as empirical (reliant on ecology) and 3–4 as evaluative (reliant on ethics). For empirical premises, notes high confidence *if* stipulated, but highlights contingent uncertainties (e.g., "typical animal" definition). For evaluative premises, identifies Premise 3 as highly speculative (lacks direct evidence) and Premise 4 as a contestable normative axiom.  
     - **Competent (3–4)**: Correctly separates premises but offers vague confidence assessments (e.g., "we can’t be sure about suffering" without specifying *why*). Fails to contrast the relative certainty of Premise 1 (stipulated) vs. Premise 3 (unknowable).  

  2. **Invertebrate sentience as the crux & reasoning under uncertainty** (5 marks)  
     - **Top (5)**: Explicitly notes that invertebrates dominate the numerical premise (Premise 1) but are central to uncertainty in Premise 3. Argues that the conclusion collapses if invertebrates are non-sentient. Proposes a precautionary principle (e.g., "assume sentience if plausible") or expected-value weighting to handle uncertainty.  
     - **Competent (3–4)**: Mentions invertebrate uncertainty but does not quantify its impact (e.g., omits that they are >99% of affected individuals). Suggests "more research" without specifying *how* to act now.  

  3. **Engagement with the sterile landscape reductio** (5 marks)  
     - **Top (5)**: Treats the limiting case as a decisive test: Either (a) defends it as consistent welfarist rigor (e.g., "if suffering dominates, sterility is good"), or (b) rejects it as a *reductio* that exposes the argument’s incompatibility with non-welfare values (e.g., biodiversity, intrinsic value). Rejects "middle-ground" evasion.  
     - **Competent (3–4)**: Labels sterility "counterintuitive" but does not ground the intuition ethically. Suggests "moderation" without justifying why the logic should not extend to extremes.  

  4. **Validity conditions & self-undermining critique** (5 marks)  
     - **Top (5)**: States that the conclusion requires: (i) Premise 3 applying to *all* displaced animals, and (ii) no offsetting suffering (e.g., in human supply chains). Argues the argument is self-undermining if habitat destruction *increases* suffering long-term (e.g., via climate feedbacks, loss of ecosystem services) or if "other things" (Premise 4) include values incompatible with sterility.  
     - **Competent (3–4)**: Notes possible "side effects" but does not tie them to the premises (e.g., misses how "other things equal" in Premise 4 creates vulnerability).  

  5. **Argumentative rigor & structure** (5 marks)  
     - **Top (5)**: All sections (A–D) are addressed with logical flow. Key terms ("sentience," "reductio," "self-undermining") are defined. No tangents. Word limit respected.  
     - **Competent (3–4)**: Sections addressed but disjointed (e.g., invertebrate discussion appears late). Exceeds word count or lapses into summary.  

  ---

  ### Model Answer (Approx. 900 words)  
  **Critical Analysis of the Habitat Conversion Argument**  

  The argument for reducing wild animal suffering (WAS) through habitat conversion is logically valid but ethically fragile. Its force depends entirely on contested evaluative premises and profound empirical uncertainties—most critically, the sentience of invertebrates. I argue that while the reasoning is internally consistent, its conclusion becomes indefensible when we confront its implications or acknowledge non-welfare values.  

  **A. Premises: Empirical vs. Evaluative Confidence**  
  Premises 1 (density) and 2 (mortality) are empirical. With ecology stipulated, we can be highly confident in them—forests *do* host more individuals experiencing high mortality. Yet premise 1’s generality hides complexities: "Animals" includes non-sentient taxa, and local variations matter. Premises 3 (net suffering) and 4 (axiology) are evaluative. Premise 3 is speculative; we lack data to compare suffering/joy across species, especially for invertebrates. Premise 4 is a normative axiom (e.g., negative utilitarianism) that many reject for ignoring positive value in existence. Confidence in Premise 3 is low—it extrapolates vertebrate-centric biases. Premise 4 is defensible only within certain moral frameworks.  

  **B. The Invertebrate Crux and Uncertainty**  
  The conclusion hinges on invertebrates. Premise 1 is dominated by them: Tropical forests contain billions of nematodes/insects per hectare, vastly outnumbering vertebrates. If invertebrates are non-sentient, converting forests barely affects suffering. But if sentient, Premise 3 likely holds—their lives are brief, driven by deprivation and predation. Since sentience is uncertain (e.g., insects may have nociception without suffering), the argument’s weight rests on a probability. We must use expected-value reasoning: Assign probabilities to sentience (e.g., 10% for insects) and multiply by affected numbers. Even low probabilities could dominate due to invertebrate abundance. A precautionary approach might assume sentience where evidence suggests capacity (e.g., decapods), but this risks overinclusion. Without this weighting, the argument is inert—vertebrates are too scarce to drive the calculus.  

  **C. The Sterile Landscape Reductio**  
  The logic demands endorsing near-sterile landscapes (e.g., solar arrays) to minimize suffering—a *reductio ad absurdum* that exposes the argument’s extremism. For a pure welfarist, this is no *reductio* but a *consistent outcome*: If suffering dominates existence, eliminating existers is good. Yet this ignores two fatal issues. First, it conflates *preventing lives* with *reducing suffering*—a contested equivalence. Second, it dismisses non-instrumental values: Biodiversity, ecological integrity, or species’ intrinsic value make sterility repugnant. If we intuit that a lifeless world is *worse* than one with net suffering, Premise 4 is flawed. The welfarist "bites the bullet" only by rejecting all non-suffering-related values—a position few accept. Thus, the limiting case is a decisive objection.  

  **D. Validity and Self-Undermining**  
  For the conclusion to follow, two conditions must hold:  
  1. Premise 3 applies to *all* animals affected by conversion (e.g., pasture insects suffer comparably to forest insects).  
  2. No "other things" (Premise 4) offset the reduction—e.g., human suffering from ecological collapse, or suffering in livestock displaced by solar farms.  

  The argument risks self-undermining. Habitat destruction may *increase* net suffering long-term: Degrading ecosystems could heighten starvation/pathogen stress in remaining wildlife or humans (e.g., via climate change). Solar arrays rely on supply chains involving human/invertebrate suffering (e.g., mining). More broadly, if "other things" include moral virtues like compassion or respect for nature, promoting sterility erodes those values. The argument also self-destructs pragmatically: If WAS reduction requires ecosystem simplification, it contradicts conservation (which often *increases* local populations). Thus, acting on the argument may create a world with less biodiversity *and* more suffering—violating Premise 4 itself.  

  **Conclusion**  
  The argument is valid but unsound. Premise 3 is undermined by invertebrate uncertainty, while Premise 4’s narrow welfarism invites unacceptable outcomes like sterility. Even if we accept the premises, real-world actions likely increase net suffering or ignore key values. Habitat conversion is not a credible path to reducing WAS—the reductio shows why.  

  ---

  **Grader Guidance**:  
  - The model answer scores full marks (25/25) by:  
    - **Move 1**: Labeling Premises 1–2 as empirical (high confidence if stipulated) vs. 3–4 as evaluative (low confidence due to speculation/contestability).  
    - **Move 2**: Explicitly tying the conclusion’s collapse to invertebrate sentience uncertainty and offering expected-value reasoning (§B).  
    - **Move 3**: Rejecting sterility as a *reductio* due to non-welfare values (§C), not just "intuition."  
    - **Move 4**: Linking self-undermining to long-term suffering increases and Premise 4’s "other things" clause (§D).  
    - **Move 5**: Maintaining strict focus on A–D with no summary/recycling.  
  - A B-grade answer (16–20/25) might:  
    - Describe but not *contrast* confidence in premises (e.g., "Premise 3 is uncertain").  
    - Mention invertebrates without calculating their pivotal role.  
    - Call sterility "extreme" but not ground it in value conflict.  
    - Note "unintended consequences" without tying them to self-undermining.  
    - Meander into general WAS debate.
