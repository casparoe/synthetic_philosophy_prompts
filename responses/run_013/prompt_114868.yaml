prompt: |-
  I'm a program officer at a small foundation that can fund one full-time researcher for three years on the ethics and moral mathematics of food — desk work only, no lab, no fieldwork, no new data collection. I've been arguing about this with friends for weeks and keep landing in the same tangle. The familiar farmed-animal arithmetic says chicken is the worst offender per calorie, since a kilogram of chicken represents vastly more individual lives than a kilogram of beef; but the arithmetic blurs once land is taken seriously, because beef consumes far more land and feed per calorie, pasture substitutes for or displaces wild habitat, and crop cultivation itself kills large numbers of small wild animals through ploughing, harvest, and storage. Some people push this to the conclusion that a grass-fed ruminant diet might kill fewer animals than a plant-based one; others reply that this only looks plausible if you count deaths rather than suffering, or if you attribute crop deaths to plants rather than to the animals that eat the crops. Underneath all of it sits the wild-animal question: the conservationist reason to farm intensively on less land and spare the rest reverses if wild animal lives are on balance bad rather than good, and nobody seems to agree whether those lives are net positive, net negative, or simply unknowable at our current resolution.

  I'd like you to act as an expert in applied ethics and cause prioritization — someone who knows the farmed-animal and wild-animal literatures and also has a good eye for telling a tractable research question from an intractable one. Think carefully before answering, and begin by laying out in your own words what you take the distinct open questions in this area to be, aiming for six to eight and not restricting yourself to the ones I named, since I suspect I've framed the space too narrowly.

  Then tell me which two or three the researcher should actually work on, and defend the ordering against explicit criteria: which questions are upstream of which others, which are answerable with a single philosopher's tools (conceptual analysis, formal modelling, synthesis of existing empirical work) as opposed to needing new data, which are already crowded, and which look weighty but would not change anyone's behaviour however they came out. For the top choices, say concretely what a good three-year output would look like, and what argument or finding over the next couple of years would move them up or down the list. I care far more about the reasoning than the list, and I'd rather you flag a question I've missed than pad the list with restatements of what I already said. No need for citations or a reading list — I want your judgment, not a bibliography.
reasoning: |-
  Okay, the user is a program officer at a small foundation looking to fund a three-year research project on the ethics and moral mathematics of food. They've been stuck in debates about the trade-offs between different food choices, especially concerning animal welfare. Their main confusion revolves around whether plant-based diets or certain types of meat (like grass-fed beef) cause more harm when considering factors like land use, crop deaths, and wild animal suffering. They also mention the uncertainty around whether wild animal lives are net positive or negative. 

  First, I need to unpack their core concerns. They mentioned the standard farmed-animal arithmetic where chickens suffer more per calorie because more individuals are involved, but then land use complicates things. Beef uses more land, which could displace wild habitats, leading to wild animal deaths. Then there's the debate about whether grass-fed ruminants might actually kill fewer animals than a plant-based diet, but that hinges on how we count deaths versus suffering and how we attribute crop deaths. Underlying all this is the wild animal welfare question—whether sparing land for nature is good or bad if wild animals suffer.

  The user wants me to act as an expert in applied ethics and cause prioritization. They need a structured approach to identify open questions, prioritize them, and justify why certain questions are more research-worthy. They emphasized wanting distinct questions beyond what they mentioned, so I should broaden the scope. Key considerations include which questions are upstream (foundational), answerable with desk research, not already crowded, and impactful on behavior.

  Looking deeper, the user's explicit need is to allocate resources effectively for maximum impact. But unspoken needs might include wanting clarity in a morally complex field, avoiding common pitfalls in existing research, and ensuring the research can influence real-world decisions. They might also want to navigate academic debates without getting bogged down in intractable issues. 

  I should start by listing distinct open questions. The user mentioned a few, but I need to expand. Possible questions: 1) Value functions for comparing different types of harm (death vs. suffering, different species). 2) Attribution of harm in crop production. 3) Counterfactual land use modeling. 4) Welfare ranges across species. 5) Net welfare of wild animals. 6) Tractability of indirect effects. 7) Moral weights for insects and invertebrates. 8) Decision theory under deep uncertainty. 

  Prioritizing these requires criteria: upstream importance, answerability without new data, lack of existing saturation, and potential to change behavior. For example, Question 1 (value functions) is foundational because it affects how we measure harm in all other areas. If we can't compare death to suffering, other calculations are moot. It's also desk-research friendly—philosophical analysis and synthesizing existing data. It's not crowded; most work focuses on specific cases rather than a unified framework. Even if the results are complex, they can inform better models and highlight limitations, influencing EA communities and policymakers indirectly.

  Question 5 (net welfare of wild animals) is crucial because it underpins the land-sparing argument. If wild lives are net negative, intensive farming might be better to reduce wild animal suffering. This is highly uncertain but potentially high-impact. Desk research can synthesize ecology and welfare biology. However, it's thorny and might not yield definitive answers, but even clarifying the uncertainty could shift how conservation and farming policies are viewed.

  Question 2 (crop death attribution) is actionable. If we attribute harm to consumers rather than producers, it changes individual responsibility. This is a conceptual issue that doesn't need new data. It's under-discussed and could affect consumer choices and labeling policies. 

  The other questions might be lower priority. For instance, welfare ranges (Q4) are important but better handled by other researchers. Counterfactual land modeling (Q3) needs empirical data, which isn't feasible. Insect weights (Q7) are too speculative now. 

  For the top choices, concrete outputs for Q1 would be a framework paper and decision aids. If new studies on suffering equivalence emerge, it could move up. Q5's output would be a review article and uncertainty assessment. If evidence from invertebrate sentience or ecology studies comes in, it could change priority. Q2 could result in a consensus paper and policy briefs, influenced by new attribution studies.

  The user might not have considered how value functions underpin all comparisons, so emphasizing that as upstream is key. Also, highlighting that even partial answers in wild animal welfare can reduce uncertainty in key policies. Making sure to avoid intractable issues while focusing on those that can be addressed conceptually is vital for a three-year desk-based project.
answer: |-
  Below is a structured analysis of the research landscape, prioritized research questions, and concrete deliverables for your 3-year project. My reasoning prioritizes **upstream leverage, tractability under desk constraints, neglectedness, and behavioral relevance** – while avoiding questions where even definitive answers wouldn't shift decisions or require new empirical work.

  ### Distinct Open Questions (Expanding Your Frame)
  1. **Value Function Specification**: How to compare dissimilar harms (death vs. suffering, chicken vs. rodent vs. insect, acute vs. chronic)? What is the exchange rate between preventing a cow’s year of suffering and preventing a mouse’s death?  
  2. **Harm Attribution in Crop Systems**: Are crop cultivation deaths morally attributable to *crop consumers* or *crop producers*? Does buying wheat carry moral responsibility for field mouse deaths?  
  3. **Counterfactual Land-Use Modeling**: What happens to spared land? Does it revert to high-suffering wild ecosystems, low-suffering wilderness, or human development? How dynamic are these transitions?  
  4. **Welfare Ranges Across Species**: Beyond sentience, how do we quantify *capacity for welfare* across taxa? Is a shrimp’s maximum possible welfare 0.1% of a pig’s?  
  5. **Net Welfare of Wild Animals**: Is the average wild animal life net positive or negative? How does this vary by ecosystem (forest vs. grassland) or taxon (insects vs. mammals)?  
  6. **Tractability of Indirect Effects**: Can we model second-order consequences (e.g., if beef demand falls, do poultry subsidies rise?) without uncontrolled speculation?  
  7. **Moral Weight of Invertebrates & Insects**: If insect plowing deaths dominate calculations, but insect sentience is uncertain, how do we handle this under moral ambiguity?  
  8. **Decision Theory Under Deep Uncertainty**: When key parameters (e.g., wild insect welfare) are unknown by orders of magnitude, what robust heuristics should guide action?

  ---

  ### Prioritized Research Questions & Justification
  **Criteria Applied**:  
  - **Upstreamness**: Resolving this would clarify >3 other questions.  
  - **Tractability**: Answerable via conceptual work, existing data synthesis, or modeling.  
  - **Neglectedness**: Not saturated by existing EA/animal ethics literature.  
  - **Behavioral Relevance**: Outcomes could change funding, advocacy, or consumer choices.

  #### #1 Priority: **Value Function Specification**  
  *Why it tops the list*:  
  - **Upstream**: Foundational to comparing any intervention (e.g., is sparing 1,000 insects better than sparing 1 cow?). Without this, all "moral mathematics" rests on arbitrary assumptions.  
  - **Tractable**: Requires conceptual analysis of welfare ethics + synthesis of neurobiology data on pain capacity. No new fieldwork.  
  - **Neglected**: EA literature often uses "weighing by neuron count" as a placeholder, but this is philosophically shallow and ignores duration/intensity of suffering.  
  - **Behavioral**: Would force major EA orgs (GFI, ACE) to revise cost-effectiveness models. Veg advocacy might shift from "save 100 animals!" to "reduce 10,000 pain-years!"  
  *Concrete 3-Year Output*:  
    - A monograph proposing a *defensible framework* for cross-species harm comparison, including sensitivity analyses for key parameters (e.g., discount rates for future suffering).  
    - Open-access calculator tool allowing users to input their ethical priors (e.g., "I value preventing death 100× more than chronic stress") and output harm ratios for food types.  
  *What Could Change Priority*: If a consensus value function emerges externally (e.g., through large-scale expert surveys), this drops. If new evidence shows insects suffer 100× more than assumed, it rises.

  #### #2 Priority: **Harm Attribution in Crop Systems**  
  *Why it’s critical*:  
  - **Upstream**: Determines whether plant-based diets "cause" field animal deaths. Directly impacts the "grass-fed beef vs. tofu" debate you described.  
  - **Tractable**: Pure applied ethics – analyzing moral responsibility in supply chains using existing cases (e.g., is buying conflict minerals analogous?).  
  - **Neglected**: Most analyses assume crop deaths *are* attributable to consumers; rigorous challenge is rare.  
  - **Behavioral**: If crop deaths aren’t attributable to consumers, plant-based diets gain massive moral advantage. If they are, it forces a reassessment of "low-harm" meat.  
  *Concrete 3-Year Output*:  
    - A series of papers reconciling attribution theories (consequentialist vs. deontological) with real-world agricultural economics.  
    - A flowchart for advocates: "When are you responsible for indirect harms?" based on causal proximity/market elasticity.  
  *What Could Change Priority*: If leading ethicists converge on attribution (e.g., "only direct intent matters"), this becomes less urgent. If new data shows crop deaths vary 100-fold by farming technique, it rises.

  #### #3 Priority: **Net Welfare of Wild Animals**  
  *Why it’s included despite uncertainty*:  
  - **Upstream**: Decides whether "land sparing" is a win (reducing wild suffering) or loss (preventing positive lives). Affects conservation funding.  
  - **Tractable (enough)**: Desk-based synthesis of ecology (predation rates, disease prevalence) and welfare biology (stress hormones in wild populations).  
  - **Neglected**: Wild welfare is discussed but rarely quantified. Key papers like Tomasik’s are back-of-envelope.  
  - **Behavioral**: Could redirect billions in conservation funding (e.g., if wild lives are net negative, rewilding becomes harmful).  
  *Concrete 3-Year Output*:  
    - A meta-review of evidence for/against net wild welfare, segmented by biomes (e.g., "tropical forests likely net negative due to parasitism").  
    - A "uncertainty map" showing where future research could most reduce ambiguity.  
  *What Could Change Priority*: If wild welfare is deemed fundamentally unknowable, this drops. If AI-powered wildlife monitoring reveals shockingly high suffering (e.g., via bioacoustics), it surges.

  ---

  ### Why Others Didn’t Make the Cut
  - **Counterfactual Land-Use Modeling**: Requires new geospatial/economic data – not desk-friendly.  
  - **Welfare Ranges**: Important but better handled by neuroscientists; philosopher’s tools add limited value.  
  - **Invertebrate Weights**: Too speculative without sentience breakthroughs; unlikely to change behavior soon.  
  - **Indirect Effects**: Intractable without empirical supply-chain modeling.  
  - **Decision Theory**: Valuable but abstract; less likely to shift real-world decisions than #1-#3.

  ### Strategic Rationale
  Focusing on **Value Functions** and **Harm Attribution** creates immediate scaffolding for more applied work: they resolve the core ambiguities plaguing your "tangle." **Wild Welfare** is a high-risk/high-reward complement – if the researcher makes headway, it could redefine the field. All three leverage a philosopher’s core skills: conceptual clarity, argument rigor, and synthesizing disparate evidence. Crucially, each output would provide **actionable guidance** for funders and policymakers, moving beyond theoretical debates.

  This prioritization ensures that even if wild welfare remains unresolved, the foundation funds research that makes every subsequent cost-effectiveness model more ethically rigorous – breaking the stalemate you described.
