    - Reveals whether Vance prioritizes *provision-specific* context (e.g., committee report in drafting history) over *chapter-level* purpose (preamble).  

  **Key Insight**: Vance’s purpose-based reasoning (*Coma*, *Cross-Reference*) operates only when text is ambiguous or self-defeating. Here, textual context provides a "ceiling," making purpose secondary. Rule 1 best systematizes her jurisprudence without contradiction. Rule 2’s reliance on purpose to expand text lacks direct support in her record.
