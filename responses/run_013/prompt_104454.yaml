  - Immediate textual context (e.g., surrounding words, syntax)  
  - Structural context (e.g., headings, adjacent provisions)  
  - Enacted purpose only to confirm/disambiguate textual ambiguity, *never* to narrow plain text.  
  (2) Legislative history may *only* affirm a meaning already supported by textual context (as in *Hospital*), not introduce limitations (as rejected in *School-Zone*).  
  *Match*: Matches her professed textualism in *School-Zone* but explains deviations via contextual constraints (e.g., *Park Trails* heading, *Hospital* legal meaning).  

  **Rule 2: Purpose-Constrained Textualism**  
  *Mechanism*:  
  (1) Apply unambiguous text literally unless:  
     - It produces operational absurdity (*Coma*) or nullity (*Cross-Reference*); *or*  
     - The term has a specialized legal meaning (*Hospital*).  
  (2) Purpose (from preamble/findings) may *only* resolve textual ambiguity or correct ministerial errors, *not* override clear text.  
  *Match*: Matches her practice in *Coma*/*Cross-Reference* but not her professed rejection of purpose in *School-Zone*.  

