  ### (e) Discriminating Case  
  **Hypothetical**: A statute bans "electronic devices in courtrooms." The preamble states it aims to "prevent disruptions to judicial proceedings." A witness uses a silent e-reader to reference documents. The committee report specifies "all screen-based devices."  
