  Here's a practical decision tree for determining "is it alive?" based on testable, operational questions. The tree is designed to be used by lab techs with minimal theoretical bias. Each question is binary and answerable through standard lab tests (e.g., microscopy, growth assays, chemical analysis, genetic sequencing, environmental simulation). The tree has 12 leaves, each corresponding to a unique combination of answers, with positions mapped to them based on their core commitments. If multiple positions map to the same leaf, it's noted. Unattractive or unexplored leaves are marked.

  ### Decision Tree
  **Start at Q1:**  
  1. **Does the sample, under appropriate conditions, take in free energy or matter to maintain its structure?** (Test via isotopic labeling, calorimetry, or metabolic activity assays. "Appropriate conditions" means providing ideal environment, e.g., thawing frozen samples.)  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q2.  

  2. **Does the sample, under appropriate conditions, have the capability to grow in size or replicate?** (Test via time-lapse imaging, replication assays, or population growth tracking. Include potential for replication if external factors are supplied, e.g., host for viruses.)  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q4.  

  3. **When replicating, does the sample exhibit heritable variation?** (Test via mutation assays, selection experiments, or genetic/structural analysis of progeny. "Heritable" means changes passed to offspring.)  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q4.  

  4. **Is the sample descended from something universally agreed to be alive?** (Test via genetic sequencing for conserved biomarkers, fossil records, or phylogenetic analysis.)  
     - **Yes** → Leaf (see below).  
     - **No** → Leaf (see below).  

  ### Leaf Positions (Based on Answer Paths)
  Each leaf is named by its defining features. Positions are assigned based on their core criteria (e.g., metabolism-first requires metabolism, replication-evolution-first requires replication and heritable variation). If multiple positions share a leaf, it's noted. "Awkward commitment" is a one-sentence summary of the position's counterintuitive implication. Unattractive/unexplored leaves are flagged.

  | Leaf | Path (M, R, H, D) | Position Name & Assignment | Awkward Commitment |
  |------|-------------------|----------------------------|-------------------|
  | 1 | M=yes, R=yes, H=yes, D=yes | **Standard Life** (Metabolism-first, Replication-evolution-first, Lineage view, Gradualist) | Must accept that frozen/revived entities are "fully alive" despite periods of inactivity. |
  | 2 | M=yes, R=yes, H=yes, D=no | **Abiogenic Life** (Metabolism-first, Replication-evolution-first, Lineage view, Gradualist) | Life can arise without any biological ancestry, challenging origin-of-life narratives. |
  | 3 | M=yes, R=yes, H=no, D=yes | **Static Replicator** (Metabolism-first, Gradualist) | Unattractive: Entities that replicate and maintain but cannot evolve are "alive," even if evolutionarily sterile. |
  | 4 | M=yes, R=yes, H=no, D=no | **Systemic Life** (Holistic, Gradualist) | A whole system (e.g., pond) is alive, but its components are not, making "individuals" irrelevant. |
  | 5 | M=yes, R=no, D=yes | **Degenerate Organism** (Metabolism-first, Gradualist) | Sterile entities are "alive" despite being evolutionary dead-ends. |
  | 6 | M=yes, R=no, D=no | **Metabolic Zombie** (Metabolism-first, Gradualist) | Unexplored: Self-maintaining entities with no replication or ancestry could be considered "alive." |
  | 7 | M=no, R=yes, H=yes, D=yes | **Parasitic Lineage** (Replication-evolution-first, Lineage view, Gradualist) | Viruses or genes are "alive" without metabolism, reducing life to information. |
  | 8 | M=no, R=yes, H=yes, D=no | **Aevolutionary Replicator** (Replication-evolution-first, Lineage view, Gradualist) | Software or simulations are "alive" despite lacking physical substrate. |
  | 9 | M=no, R=yes, H=no, D=yes | **Prion-Like Replicant** (Gradualist, Stipulation) | Prions are "borderline alive" despite no heredity or metabolism. |
  | 10 | M=no, R=yes, H=no, D=no | **Mineral Replicant** (Gradualist) | Unattractive: Self-replicating minerals are "partially alive," blurring life/non-life boundaries. |
  | 11 | M=no, R=no, D=yes | **Genetic Fossil** (Gradualist, Stipulation) | Inert genetic material is "residually alive" due to descent, even with no activity. |
  | 12 | M=no, R=no, D=no | **Inert Non-Life** (N/A) | Clear non-life; no position assigns "alive." |

  ### Notes on Position Mapping
  - **Metabolism-first** (alive if M=yes): Maps to leaves 1–6. Shares leaves with others but prioritizes self-maintenance over replication.
  - **Replication-evolution-first** (alive if R=yes and H=yes): Maps to leaves 1, 2, 7, 8. Views replication and evolution as essential.
  - **Lineage view** (alive if R=yes and H=yes): Maps to leaves 1, 2, 7, 8. Focuses on lineages, not individuals; identical to replication-evolution-first for this tree.
  - **Gradualist** (alive in degrees): Maps to all leaves except 12. Sees life as a spectrum, with leaf 1 as "most alive."
  - **Strong emergence** (requires "extra" property): Not mapped to any leaf. Always answers "no" based on tests, as it demands non-testable properties (e.g., consciousness, qualia).
  - **Holistic** (only systems alive): Maps uniquely to leaf 4. Only assigns "alive" to system-level entities like the pond.
  - **Stipulation** (splits "life" into categories): Maps to leaves 9 and 11. Treats ambiguous cases as needing new terms (e.g., "life" vs. "replicant").
  - **Unattractive/unexplored**: Leaves 3, 6, and 10 are theoretically awkward or lack real-world advocacy (e.g., leaf 6 has no sample).

  ### Borderline Bucket: "Provisional Life"
  - **Definition**: Entities not clearly alive/dead by standard criteria but exhibiting life-like properties; warrant monitoring for reclassification.  
  - **Used by**: Gradualist (all leaves except 1 and 12), Stipulation (leaves 5, 7, 9, 10, 11), Metabolism-first (leaves 3, 5, 6).  
  - **Not used by**: Replication-evolution-first, Lineage view (their criteria are clear-cut), Holistic (only cares about systems), Strong emergence (rejects all test-based classification).  

  ### What the Tree Cannot Separate
  1. **Realism vs. Instrumentalism**: The tree cannot resolve whether "alive" reflects a natural category (realism) or is a useful label (instrumentalism). For example, leaves 7 and 8 (viruses/software) might be deemed "alive" for practical purposes without ontological commitment.  
  2. **Strong emergence**: This view rejects test-based classification entirely, so it cannot be captured by any leaf. It requires non-empirical criteria (e.g., subjective experience).  
  3. **Holistic nuances**: While leaf 4 maps to the holistic view, the tree cannot distinguish between "the whole system is alive" and "the system's processes are alive" (a process-focused view).  

  ### Sample Classifications (for Validation)
  - **Mineral assemblage**: M=no, R=yes, H=no, D=no → Leaf 10 (mineral replicant).  
  - **Prion**: M=no, R=yes, H=no, D=yes → Leaf 9 (prion-like replicant).  
  - **Virus**: M=no, R=yes, H=yes, D=yes → Leaf 7 (parasitic lineage).  
  - **Self-replicating programs**: M=no, R=yes, H=yes, D=no → Leaf 8 (aevolutionary replicator).  
  - **Frozen bacterium**: M=yes, R=yes, H=yes, D=yes → Leaf 1 (standard life).  
  - **Sterile cell**: M=yes, R=no, D=yes → Leaf 5 (degenerate organism).  
  - **Autocatalytic network**: M=yes, R=yes, H=yes, D=no → Leaf 2 (abiogenic life).  
  - **Self-maintaining pond**: M=yes, R=yes, H=no, D=no → Leaf 4 (systemic life).  
  - **Simulated bacterium**: M=no, R=yes, H=yes, D=no → Leaf 8 (aevolutionary replicator).  
  - **Viral gene**: M=no, R=no, D=yes → Leaf 11 (genetic fossil).  

  This tree covers your sample types, handles overlaps, and highlights conceptual gaps. It produces 12 leaves with no forced splits—positions that agree on tests share leaves. Use the "provisional life" bucket for ambiguous cases during monitoring.
