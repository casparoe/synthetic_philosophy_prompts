prompt: |-
  I keep running into a conceptual muddle when I travel and I want you to sort it out. When does a local practice -- how much to tip, where to stand on an escalator, whether to wait for the walk signal when no cars are coming -- become something a visitor is genuinely obligated to follow, rather than just something that would be rude or awkward to skip? My suspicion is that people are collapsing two different things: a convention in the coordination sense (arbitrary, could have been otherwise, held up by mutual expectation and common knowledge) and a norm that carries real evaluative weight. Explain that distinction and then actually use it on the hard cases -- the practice that's mostly dead so there's barely a convention left to follow (everyone jaywalks, tipping is going optional), the practice the visitor comes from a conflicting version of, and the case where locals themselves don't conform but still expect visitors to. I want the explanation to earn its keep on those cases rather than just define the terms and stop.
reasoning: |-
  Okay, the user is struggling with when local practices become obligations for visitors. They mention tipping, escalator standing, and jaywalking as examples. They suspect there's a confusion between coordination conventions and norms with evaluative weight. I need to clearly explain that distinction and then apply it to their three hard cases.

  First, I should define coordination conventions versus evaluative norms. Conventions are arbitrary rules that solve coordination problems, like which side of the road to drive on. They're held together by mutual expectations. Breaking them causes inefficiency or awkwardness but not moral judgment. Evaluative norms, however, carry moral weight. Violating them feels wrong to people, like cutting in line. These are based on shared values, not just convenience.

  Now, for the application part. The user wants concrete analysis of three tricky scenarios: practices that are fading (like tipping becoming optional), conflicting norms (visitor's home vs. local), and locals not following but expecting visitors to. I need to ensure each case uses the framework to provide clarity.

  For fading practices, I should consider if the convention is dissolving. If most locals ignore it, then the mutual expectation weakens. But if it's transitioning from convention to norm, there might still be judgment. Tipping in the US is a good example—some places add service charges, reducing the need to tip, but not tipping might still attract disapproval if servers rely on tips. The key is whether the practice still has evaluative weight or if it's purely coordination.

  Conflicting norms case: Here, the visitor comes from a place where the opposite is normal. The escalator standing example is perfect. If standing on one side is a coordination convention, deviating causes inefficiency. But if it's tied to values like efficiency or respect, it becomes a norm. In London, standing on the right might be seen as considerate, so a visitor standing left might be judged as rude, even if it's just a convention back home. The obligation depends on how locals perceive it—convention or norm.

  Locals not following but expecting visitors to: This is tricky. The user might be frustrated by hypocrisy. Here, the distinction helps. If locals break a coordination convention but enforce it on visitors, it might be inconsistent. But if it's an evaluative norm they struggle with, like littering, they might still hold visitors accountable. For instance, jaywalking in New York: locals do it but might expect tourists to follow rules for safety or order. The obligation comes from the norm's underlying values, even if locals are lax.

  I need to check if the user's deeper need is about reducing social friction while traveling. They might want a principled way to decide when to adapt without feeling coerced. Emphasizing the source of the norm (values vs. convenience) and the likelihood of judgment can help them prioritize. Also, addressing the hypocrisy in the third case validates their frustration while offering a rationale.

  Finally, ensure the explanation earns its keep by resolving each case with the framework. For fading practices, assess if mutual expectations still exist. For conflicts, evaluate if the local practice has moral weight. For inconsistent enforcement, distinguish between norms' ideals and compliance. This should give the user practical tools to navigate their muddle.
answer: |-
  You've hit on a crucial philosophical and sociological distinction! Your suspicion is correct: conflating **coordination conventions** and **evaluative norms** is the core muddle. Let's define them clearly and then *apply* this framework rigorously to your hard cases.

  **The Core Distinction:**

  1.  **Coordination Convention (CC):**
      *   **Nature:** Arbitrary solutions to recurring coordination problems ("Which side of the road should we drive on?", "Which side of the escalator should we stand?"). The specific rule is arbitrary – driving on the left or right *works* equally well *as long as everyone agrees*.
      *   **Basis:** Mutual expectations and common knowledge. We follow it because we know others expect it, and they know we expect it, creating a self-reinforcing equilibrium. Efficiency and predictability are the primary goals.
      *   **Enforcement:** Breaking it causes inefficiency, annoyance, or awkwardness ("Hey, you're blocking the escalator!", "You caused a traffic jam!"), but rarely strong *moral* condemnation. The reaction is more "Why are you making this harder?" than "You are a bad person."
      *   **Obligation:** Primarily pragmatic. You *should* follow it to avoid causing problems *for yourself and others* in that specific interaction/system. The obligation dissolves if the convention genuinely no longer exists or isn't enforced.

  2.  **Evaluative Norm (EN):**
      *   **Nature:** Rules rooted in shared values, morals, or deeply held beliefs about how people *ought* to behave ("Don't steal", "Help those in distress", "Respect elders", "Don't be wasteful"). The rule isn't arbitrary; it's tied to something the community perceives as inherently good, right, or important.
      *   **Basis:** Internalized values, social pressure, perceived "rightness." We follow it because we believe it's *the right thing to do*, or because we fear social sanction for violating community values.
      *   **Enforcement:** Breaking it often provokes genuine disapproval, judgment, anger, or feelings of betrayal ("How could you be so rude/selfish/disrespectful?"). Sanctions can range from dirty looks to ostracism.
      *   **Obligation:** Moral or ethical. You *should* follow it out of respect for the community's values, even if it's inconvenient or you disagree. The obligation persists even if *some* locals violate it, as it represents an ideal.

  **Applying the Distinction to Your Hard Cases:**

  1.  **The Fading Practice (e.g., Tipping becoming optional, Everyone Jaywalks):**
      *   **Analysis:** This is fundamentally about the *dissolution of mutual expectations* for a CC or the *weakening of shared values* for an EN.
          *   **If it was primarily a CC (e.g., Jaywalking when traffic patterns changed):** When *almost everyone* jaywalks in clear situations, the mutual expectation to wait for the signal collapses. The *coordination problem* (predicting pedestrian flow) is now solved by *jaywalking normatively*. The "obligation" to wait vanishes because the convention is dead. Following the dead rule (waiting pointlessly) might make *you* inefficient, but locals likely won't care or even notice. *No obligation remains.*
          *   **If it was an EN transitioning (e.g., Tipping in flux):** This is trickier. Tipping often starts as a CC (standardizing compensation) but morphs into an EN tied to values like fairness, gratitude, or recognizing service labor's dignity. If the *practice* is fading (e.g., service charges added, living wages mandated), but the *underlying value* ("service workers deserve fair compensation") remains strong, *expectations* might become confused. Locals might tip less *themselves* due to structural changes, but still *evaluate* a visitor harshly for not tipping because they perceive it as undervaluing the worker. **Obligation?** It's weakened but potentially still present *if the evaluative component lingers*. You might be judged for not tipping even if locals tip less, because the *value* of recognizing service persists. The key is whether locals see the *act* as reflecting a moral failing (EN residue) or just an outdated habit (dead CC).
      *   **Guideline:** Observe locals *and* service providers. If workers seem genuinely surprised/offended by no tip (EN signal), or if signage/checks subtly pressure tipping, the evaluative weight likely remains. If everyone pays and walks away without a thought, it's probably a dead CC.

  2.  **Conflicting Norms (Visitor from a place with the opposite rule):**
      *   **Analysis:** This tests whether the local practice is *just* a CC or has risen to an EN.
      *   **If it's a CC (e.g., Stand Right/Stand Left on Escalators):** The visitor has no *moral* obligation to follow the local CC over their own ingrained CC. However, the *pragmatic* obligation is strong: failing to follow the local CC causes immediate inefficiency and annoyance ("Standing on the left blocks the path in London!"). The visitor *should* follow the local CC purely to avoid disrupting the local coordination system, *out of courtesy and practicality*, not because their home rule is "wrong." Locals' annoyance stems from the disruption, not moral judgment.
      *   **If it's an EN (e.g., Tipping Culture vs. Service-Included Culture):** This is harder. If tipping locally is a strong EN tied to worker welfare (US), while the visitor comes from a place where fair wages are ensured by law and tipping is minimal/insulting (some Nordic/Asian countries), there's a genuine clash of *values*. **Obligation?** The visitor has a stronger obligation to respect the local EN. Why? Because violating it directly challenges the local community's values about fairness and compensation in a way that feels like disrespect or exploitation. "I come from a place where we don't do this" isn't a full excuse when the local system *relies* on that norm for fair compensation. Failing to tip adequately in the US is seen as *stiffing the worker*, not just breaking a rule.
      *   **Guideline:** Ask: "If I don't do this, will locals see it as *merely inconvenient* (CC) or as *morally deficient/rude* (EN)?" If it's perceived as the latter, the obligation to conform to the local EN is high, even if it conflicts with your home practice.

  3.  **Locals Don't Conform but Expect Visitors To (e.g., Jaywalking, Littering, Queue Jumping locals expect orderly tourists):**
      *   **Analysis:** This highlights the difference between *behavior* and *underlying values/ideals*, and often reveals hypocrisy or double standards. Apply the distinction:
      *   **If it's a CC locals ignore (Rare):** If locals genuinely don't follow a CC (e.g., a dead "stand on the right" rule where everyone now stands randomly), their expectation for visitors to follow it makes little sense. The mutual expectation is gone. **Obligation?** None. Their expectation is irrational or based on outdated information.
      *   **If it's an EN locals violate but still uphold (Common):** This is the classic case. Locals know the EN ("Don't jaywalk," "Don't litter," "Wait your turn") represents a *shared ideal* (safety, cleanliness, fairness), but they personally cut corners due to convenience, cynicism, or seeing others do it. However, they still *believe in the ideal* and resent visitors violating it because:
          *   It highlights their own failure.
          *   Visitors are seen as guests who should respect the community's stated values, even if residents fall short.
          *   "We might do it, but we *know* it's wrong; *you* should know better / set an example."
      *   **Obligation?** This is messy. Strictly speaking, visitors aren't morally bound by hypocritical enforcement. *However*, the *pragmatic* and *social* reasons to follow the EN are strong:
          *   Violating it *will* likely attract disproportionate scorn ("Look at these rude tourists!").
          *   It avoids giving locals an excuse for their own bad behavior ("Even the tourists do it!").
          *   It respects the *aspiration* of the community, even if imperfectly realized. You're upholding the *value* they claim to hold.
      *   **Guideline:** Follow the EN as the publicly stated rule. While the locals' hypocrisy diminishes the *moral force* of their expectation, conforming avoids negative social consequences and shows respect for the community's *idealized self-image*. Think of it as respecting the signpost, even if some locals ignore it.

  **Conclusion:**

  The obligation isn't binary. Use this framework as a diagnostic tool:

  1.  **Identify:** Is this primarily a **Coordination Convention** (efficiency, predictability) or an **Evaluative Norm** (values, morals, respect)?
  2.  **Assess Context (especially for hard cases):**
      *   *Fading Practice:* Is the mutual expectation (CC) dead? Does the evaluative weight (EN) linger?
      *   *Conflicting Norms:* Does violating the local practice cause mere inconvenience (CC - follow for pragmatism) or moral offense (EN - follow out of respect for values)?
      *   *Hypocritical Locals:* Is the expectation based on a dead CC (irrational, ignore) or a violated but still-held EN (follow to respect the ideal & avoid scorn)?

  **Visitor's Rule of Thumb:** Prioritize following Evaluative Norms out of respect for local values. Follow Coordination Conventions out of courtesy and practicality to avoid disruption. When in doubt, especially in the hard cases, err on the side of the local practice – the social cost of violating an EN is usually higher than the inconvenience of following a CC. Your framework helps you understand *why* you're doing it, reducing the conceptual muddle.
