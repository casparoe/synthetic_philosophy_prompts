prompt: |-
  I'm a graduate teaching fellow and I've been handed a single seventy-five-minute session in a second-year undergraduate module called Mind, World, and Technology. The students have had one introductory metaphysics course, so they have met the question "what is real?" before, but they have no formal ontology, and most of them walk in already convinced that the whole topic is a squabble over the word "real" that a dictionary could dissolve. The session is on virtual worlds — whether virtual objects and virtual harms are real — and I need a teaching plan, not the explanation itself. I want the order in which the pieces have to be introduced and why each depends on the one before it; the one example that carries the session; the misconceptions the students will predictably arrive with or form along the way, and the exact point in the sequence where each should be headed off; the question I should ask at the end to tell whether the idea has actually landed; and what I should openly decline to cover at this level.

  I keep circling a candidate for the carrying example and cannot decide whether it will do the work: a sword that a player owns in a persistent multiplayer world, which exists as an entry in the server's authoritative state that every client is required to agree about, which the player bought with real money, and which the operator can delete at will. Tell me whether that example has what the session needs — I suspect it has to be a single object whose existence, ownership, and destruction can all be interrogated without my changing the subject — or whether something with less built-in machinery would serve better; if it is the right case, tell me precisely which questions to put to it and in which order. I would also like you to place a distinction a colleague from computer science keeps pressing on me: she says that everything we care about in this debate turns on the difference between objects that live in the shared authoritative state of a world, where the server can adjudicate disputes and every client must agree, and objects that live only in one client's local view, like a cosmetic modification only I can see. She thinks this difference cuts the metaphysical debate at a joint. I want to know where in the sequence it should enter, whether it really separates the cases that matter, and whether importing it early will illuminate the students or merely hand them a technical-sounding way to dodge the philosophical question.

  The students will bring some things I can already predict: that "real" just means "physical," so the answer is trivially no; that anyone who says virtual harms are real must think a virtual stabbing is as bad as a stabbing; that "virtual" and "fictional" are interchangeable; and that the debate is settled by stipulating a definition and moving on. I expect they will also form at least one misconception I have not anticipated, and I want that flagged. Finally, tell me what to leave out — I am inclined to skip the modal and simulation-style arguments and anything about the nature of fiction as such, and to say so out loud rather than let them dangle — and give me the single closing question, built on a case they have not seen, that would show me whether they can now say what the realist and the fictionalist each owe us rather than merely recite a side.
reasoning: |-
  Okay, the user is a graduate teaching fellow preparing a 75-minute session on virtual worlds for second-year undergrads. They need a structured teaching plan focusing on whether virtual objects and harms are real. The students have some metaphysics background but likely see the topic as semantic quibbling. 

  First, I need to address the core challenge: students dismissing "real" as purely physical. The plan must confront this upfront. The proposed sword example seems ideal—it's concrete, involves value exchange, and has clear properties (existence in server state, deletability). It anchors all key questions: existence, ownership, harm. 

  The CS colleague's server-state vs. local-object distinction is useful but risky. If introduced too early, students might reduce "real" to technical implementation. Better to place it after establishing metaphysical tension—once they grasp why server-persistence feels "more real," the distinction illuminates rather than dodges. 

  Predictable misconceptions: 
  - Equating "virtual" with "fictional" (correct via the sword's functional consequences) 
  - Assuming real harm = physical harm (counter with psychological/economic harms) 
  - Definitional stalemate (undermine by showing definitions have stakes) 

  Unanticipated pitfall: Students might conflate virtual object durability with reality. Need to clarify that persistence ≠ ontological status (e.g., a dream can persist without being "real"). 

  What to exclude: Modal arguments (possible worlds), simulation theory, and fiction ontology. Explicitly state these are out of scope to focus on applied metaphysics. 

  Closing test: Present a new case (NFT artwork) asking what realist/fictionalist must explain. Success looks like identifying commitments (e.g., realist: why deletion matters; fictionalist: why we pay money) without rehashing positions. 

  The sword example works because it bundles existence, value, and vulnerability—one object, layered questions. Sequence: 
  1. Establish existence (server state) 
  2. Ownership (real money transaction) 
  3. Deletion (harm when destroyed) 
  Each step forces reconsideration of "real."
answer: |-
  Here's a structured teaching plan tailored to your constraints, leveraging the sword example and addressing your colleague's distinction strategically. The goal is to build a ladder from naive physicalism to recognizing metaphysical stakes in virtuality.

  ---

  ### **Teaching Plan: "Are Virtual Objects and Harms Real?"**
  **Core Sequence & Rationale**  
  *(Total: 75 min | Target: Conceptual shift from "real = physical" to "real = consequential")*  

  1. **Hook: Dissolving Dictionary Objections (5 min)**  
     - **Activity**: Poll students: *"If I delete a file on your laptop, is it *real* before deletion? If yes, what makes it real?"*  
     - **Why**: Forces acknowledgment that "real" applies to non-physical entities (data). Blocks the "just a word" dismissal by showing *even anti-realists* treat digital entities as consequential.  

  2. **Introduce Sword Example & Interrogate Existence (15 min)**  
     - **Case**: *"A sword in a persistent MMO: bought with real money, exists as server-state data, deletable by admins."*  
     - **Key Questions**:  
       - Q1: *"Does the sword exist *at all*? Where?"* (Elicit: server/client distinction).  
       Q2: *"If the server burns down, does the sword still exist?"* (Prompt: Object permanence ≠ physicality).  
       Q3: *"Is it *merely* code? Is your bank account ‘merely’ code?"*  
     - **Why**: Grounds abstract debate in a concrete object. Server-state existence establishes minimal objectivity.  

  3. **Introduce CS Distinction: Server-State vs. Local-Client Objects (10 min)**  
     - **Placement**: After Q1 above.  
     - **Activity**: Contrast the sword (server-state) with a "cosmetic mod only you see" (local-client). Ask:  
       - *"Which feels more 'real'? Why?"*  
       - *"Can the mod be stolen? Can the sword?"*  
     - **Why now?** Prevents premature "it's all imaginary" equivocation. Shows *shared persistence* undergirds virtual reality claims. **Risk Mitigation**: Stress this is a *necessary but insufficient* condition for reality—don’t let it end debate.  

  4. **Interrogate Ownership & Value (15 min)**  
     - **Return to Sword**:  
       - Q4: *"You paid $100 for this sword. Is ownership real? What’s owned?"*  
       - Q5: *"If the admins delete it without cause, did they take something *of yours*?"*  
     - **Misconception Head-off**: "Real harm = physical harm." Counter: *"If someone deletes your thesis file, is that harmful? Is it theft?"* Links virtual harm to *violation of expectations/investment*.  

  5. **Interrogate Harm (15 min)**  
     - **Extend Case**: *"Another player scams you, ‘stealing’ the sword via phishing. Is this a real harm?"*  
     - **Key Move**: Separate *harm type* (emotional/financial) from *harm reality*. Ask:  
       - *"Is the scammer’s *intent* real? The victim’s anger? The $100 loss?"*  
     - **Misconvention Block**: "Virtual = fictional." Contrast: *"Is a novel character *owned*? Can it be *stolen*? Can it cause financial loss?"* Shows virtuality ≠ fiction.  

  6. **Synthesize: Realism vs. Fictionalism (10 min)**  
     - **Frame Debate**:  
       - **Realist**: Virtual objects/harms are real because they have *consequences* (economic, emotional, social) in virtue of *shared, persistent structures*.  
       - **Fictionalist**: They are "make-believe" patterns—consequences exist, but the sword *itself* is imaginary.  
     - **Crucial Nuance**: *Both agree on consequences* but disagree on **what grounds them**.  

  7. **Closing Diagnostic Question (5 min)**  
     - **New Case**: *"An NFT artwork: exists on blockchain, owned by you, suddenly vanishes due to a platform bug. The realist says ___. The fictionalist says ___."*  
     - **Why it works**: Tests if they see the stakes (realist: "real loss of property"; fictionalist: "loss of imaginary token, but real frustration"). Success = identifying *commitments*, not positions.  

  ---

  ### **Why the Sword Example Works**  
  It’s ideal because it bundles:  
  - **Existence** (server state),  
  - **Value** (real money),  
  - **Vulnerability** (deletion/scamming).  
  **Precise Use**: Progress through "Is it there?" → "Is it *yours*?" → "Can it be *harmed/taken*?" without changing the subject.  

  ---

  ### **Predictable Misconceptions & Neutralization Points**  
  | **Misconception** | **When it Arises** | **Neutralization Strategy** |  
  |-------------------|-------------------|----------------------------|  
  | "Real = physical" | Opening poll | Contrast with data/files (Step 1). |  
  | "Virtual harm = trivial" | Harm discussion (Step 5) | Analogize to non-physical harms (thesis deletion). |  
  | "Virtual = fictional" | Ownership (Step 4) | Contrast sword with Harry Potter’s wand (no one pays $ for wand ownership). |  
  | "Debate is verbal" | Any time | Stress *stakes*: "If virtual theft isn’t real, should scammers go unpunished?" (Step 6). |  
  | **UNANTICIPATED**: "Durability = reality" (e.g., "Server persistence makes it real") | CS distinction (Step 3) | *"Does a recurring dream become 'real'? Persistence ≠ mind-independence."* |  

  ---

  ### **What to Explicitly Exclude**  
  Announce upfront:  
  *"Today, we won’t resolve:  
  - Whether our world is a simulation (modal metaphysics),  
  - The nature of fiction (e.g., is Hamlet real?),  
  - Technical implementation details beyond what’s needed for shared virtual spaces.  
  We focus on *consequences* and why they might demand a metaphysics of virtuality."*  

  ---

  ### **Assessing Your Colleague’s CS Distinction**  
  - **Where it fits**: Step 3—after establishing "existence" but before value/harm.  
  - **Does it cut at a joint?** **Yes, pragmatically**: It separates *intersubjective virtuality* (server-state) from *solipsistic experiences* (local-client). This isolates cases where "reality" claims are strongest.  
  - **Risk**: Students might reduce "real" to "server-backed." **Mitigation**: Immediately follow with value/harm questions (Steps 4–5) to show server-state enables but doesn’t *define* reality (e.g., the $100 loss matters beyond server logs).  

  ---  
  This plan forces engagement with *what realism/fictionalism must explain* (consequences, not just semantics). The sword’s machinery is a feature—it makes abstract properties tangible. By ending on NFTs (novel but familiar), you test if they can transfer the framework.
