prompt: |-
  I'm in an MA program and I've got to write something for a seminar on collective responsibility, but honestly this whole thing started as a recurring fight with my roomates. We keep going around on whether one person can really be on the hook for the big collective messes -- climate, meat, elections -- and it always ends with everybody asserting their gut and nobody moving, there's alot of heat and no light. So I said I'd sit down and write out my actual verdicts on a pile of cases and then see whether there's one principle behind them, and if there isn't, at least figure out which of my verdicts has to go.

  Here's the pile. (1) I vote in every election, including ones my district is safe by thirty points in, and I think people who just can't be bothered are doing something wrong. (2) But my roommate skipped a school board election because she had a shift, and I don't think she did anything wrong at all, and I don't think I'm being inconsistent, though I can't yet say why. (3) I eat beef maybe twice a month and feel a genuine pang about it; my brother eats chicken basically daily and I think he's worse than me, even though I'd struggle to say what either of us does to any particular animal. (4) I once spent an afternoon arguing online that no single flight matters for the climate, then flew to a wedding and felt awful the whole time, and I still think the awful feeling was the right response even though I still think the argument was fine. (5) I signed a neighborhood petition that needed ten signatures for a speed bump; I was the seventh, so my signature changed nothing, and I'd have been a jerk to refuse. (6) There's a delivery app I use that I'm fairly sure shorts its couriers a few cents an order; I don't think that makes me complicit in anything. (7) The one that really started it: a friend described a scheme where a thousand people each wire ten dollars to a pot, and the pot only does its (bad) thing if it hits exactly ten thousand -- and I said the thousandth person, the one who tips it over, is much worse than the other 999, and she said that's absurd, because without the rest he's just some guy sending a wire transfer. (8) And I think someone who runs a leaf blower for an hour for fun has done something worse than someone who takes one commercial flight, even though I'm pretty sure the flight emits more.

  I've been trying to fit these with something like: I'm on the hook when my act is one of a pattern that would cause the harm if everyone in my position did it, provided I could have known that and the alternative was cheap. That seems to cover (3) and (5) and maybe (1), but it makes (7) come out wrong and it doesn't touch (2) or the leaf blower in (8). My friend has her own one-liner, that it's all about whether your contribution is "load-bearing" -- take it away, does the harm still happen? -- and I've been using that word ever since, but I don't think it can be the whole story either, since (3) and (8) are both non-load-bearing and I don't treat them alike. So: is there a principle, or a small family of them, that gets these? I want it stated precisely enough to check, with each clause motivated by a specific case, its verdicts on a few cases I haven't listed (especially: someone who eats meat only when that exact portion would otherwise have gone to someone else, and someone who gives to a campaign fund that will hit its goal with or without them), and an honest list of which of my verdicts it can't save -- because if something has to go, I'd rather know which. Don't worry about references, I'll chase those myself.
reasoning: |-
  Okay, the user is in an MA program and needs to write a seminar paper on collective responsibility. They've been having recurring arguments with their roommates about whether individuals can be held responsible for large collective problems like climate change, meat consumption, or elections. Their approach is to list specific cases where they have intuitive judgments about responsibility and then try to find a unifying principle.

  Looking at their cases:

  1. They vote in every election and think others who don't are wrong.
  2. But their roommate skipping a school board election due to work isn't wrong.
  3. Eating beef twice a month vs. brother eating chicken daily - brother is worse.
  4. Feeling guilty about a flight despite arguing no single flight matters.
  5. Signing a petition as the 7th of 10 needed - would be a jerk to refuse.
  6. Using a delivery app that shorts couriers - not complicit.
  7. The 1000th person tipping a bad pot is worse than others.
  8. Running a leaf blower for fun worse than a commercial flight.

  The user has tried two principles: one based on universalizability (if everyone did it, harm would occur) and "load-bearing" (whether removing their action would prevent harm). Neither fully captures all their intuitions.

  I need to develop a principle that explains these judgments. Let me look for patterns. In cases 1 and 5, participation is expected and refusal seems wrong. In case 2, the roommate had a legitimate conflict. For meat consumption (3), frequency matters. The flight guilt (4) persists despite logical arguments. The delivery app (6) doesn't feel complicit. The tipping point case (7) has a threshold where the last person is more culpable. The leaf blower (8) seems worse than a flight because of necessity vs. frivolity.

  The key factors emerging are: thresholds (when contributions cross a critical point), cost of alternatives (how easy it is to avoid the action), and purposefulness (whether the action is necessary or frivolous). Also, social expectations play a role in voting and petitions.

  For the universalizability principle, it works for meat consumption and voting but fails for the tipping point case since everyone contributes equally. The load-bearing idea works for tipping point and petition but not for meat or flights where individual actions don't change outcomes.

  A better approach might be a multi-factor principle. Factors include: threshold effects (is there a critical point?), cost of alternatives (how burdensome is abstaining?), purposefulness (is the action necessary or frivolous?), social expectations (is participation expected?), and causal contribution (does the action make a difference?).

  Applying this to the cases:
  - Voting: High threshold relevance (elections depend on turnout), low cost to vote usually, but high cost in roommate's case excuses her.
  - Meat: No threshold, but high cost to alternatives (diet change), so frequency matters.
  - Flight: No threshold, low cost to alternative (could skip), so guilt appropriate.
  - Petition: Threshold at 10, signing was costless and expected.
  - Delivery app: No threshold, high cost to alternative (not using), so not complicit.
  - Tipping point: Clear threshold, the 1000th person is load-bearing.
  - Leaf blower vs flight: Both non-load-bearing, but leaf blower is frivolous while flight might be necessary.

  This framework explains all their cases. For the additional cases: eating meat that would go to waste - low purposefulness, so less culpable. Donating to a campaign that will hit its goal anyway - not load-bearing, so less culpable unless it's a symbolic gesture.

  The principle would be: An agent bears moral responsibility for their contribution to a collective harm when either (a) their action is load-bearing for the harm, or (b) the action is part of a pattern that predictably causes harm through accumulation, and abstaining is low-cost, and the action is not necessary while the harm is serious.

  This covers their judgments. The only case that might need adjustment is the flight guilt - but they already feel it's appropriate. The leaf blower case is covered by the frivolity factor.

  This gives them a solid framework for their paper, connecting personal intuitions to ethical theory without requiring them to abandon any core judgments.
answer: |-
  Based on your cases, your intuitions aren't captured by pure *individual causal impact* (load-bearing) or pure *universalizability* (Kantian/generalization tests). Instead, they suggest a **hybrid principle combining thresholds, cost of abstention, purposefulness, and social expectations**. Here's a precise principle family, grounded in your cases and designed for testability:

  ### The Principle: Threshold-Sensitive Expected Harm with Costly Alternatives (TSEH-CA)
  An agent bears significant moral responsibility for their contribution to a collective harm **iff**:
  1. **Threshold Proximity (TP)**: The collective action operates near a morally relevant threshold where individual actions *could* be load-bearing, **or** the harm is cumulative with no clear threshold but high expected harm per act.
  2. **Low Cost of Abstention (LCA)**: Abstaining or choosing a harmless alternative imposes *minimal burden* on the agent (financial, temporal, social, or psychological).
  3. **Non-Necessity/Purposefulness (NNP)**: The action serves no essential purpose for the agent’s well-being or morally urgent goals; it’s avoidable, frivolous, or luxury-driven.

  **Subsidiary Clause for Social Context (SC)**:
  - In structured collective endeavors (elections, petitions), established social expectations can amplify responsibility when TP and LCA are satisfied, or mitigate it when they aren’t.

  ---

  ### How TSEH-CA Explains Your Cases
  1. **Voting in safe districts (✓ Responsible)**:  
     - *TP*: Elections *can* have thresholds (e.g., tipping a referendum; symbolic legitimacy).  
     - *LCA*: Voting is low-cost (mail ballots, short time).  
     - *NNP*: Essential for democratic function.  
     - *SC*: High social expectation to participate.  
     → **Verdict: Consistent**.

  2. **Roommate skips school board for work shift (✓ Not responsible)**:  
     - *TP*: School boards rarely hinge on one vote; low threshold proximity.  
     - *LCA*: Abstention has high cost (lost wages/job risk).  
     - *SC*: Social expectation overridden by material necessity.  
     → **Verdict: Consistent. Differs from (1) on LCA**.

  3. **Brother’s daily chicken vs. your beef (✓ Brother worse)**:  
     - *TP*: No load-bearing, but high *expected harm per act* (meat industry scales linearly; each purchase incentivizes production).  
     - *LCA*: Abstention is low-cost (plant-based alternatives exist and are accessible).  
     - *NNP*: Chicken consumption is habitual, not essential (nutritional needs met cheaper/healthier without).  
     → **Verdict: Consistent. Brother’s higher frequency = greater expected harm**.

  4. **Flight guilt despite "no single flight matters" (✓ Guilt appropriate)**:  
     - *TP*: Non-load-bearing, but high *expected harm per act* (aviation emissions scale linearly; your flight emits ~1 ton CO₂).  
     - *LCA*: Alternatives exist (video call; train; or skip non-essential travel).  
     - *NNP*: Wedding attendance is socially pressured but not essential.  
     → **Verdict: Consistent. Load-bearing irrelevant; expected harm + LCA/NNP matter**.

  5. **7th signature on petition (✓ Not signing = jerk move)**:  
     - *TP*: Clear threshold (10 signatures); you weren’t load-bearing, but were *proximate* to threshold (if 3 others abstain, harm occurs).  
     - *LCA*: Signing costless.  
     - *SC*: Strong social expectation in communal efforts; free-riding exploits others’ effort.  
     → **Verdict: Consistent. TP proximity + SC create obligation**.

  6. **Delivery app shorting couriers (✓ Not complicit)**:  
     - *TP*: No threshold (harm occurs per order, but your order doesn’t enable systemic exploitation alone).  
     - *LCA*: Abstention may be high-cost (no alternatives; need food).  
     - *NNP*: Potentially essential (food access).  
     → **Verdict: Consistent. Fails TP and LCA**.

  7. **1000th person tipping bad pot (✓ Worse than others)**:  
     - *TP*: Clear load-bearing action (threshold crossed *because* of them).  
     - *LCA*: Abstention is zero-cost (no reason to send $10).  
     - *NNP*: Action is gratuitous (no personal gain).  
     → **Verdict: Consistent. Load-bearing + LCA + NNP maximize culpability**.

  8. **Leaf blower for fun vs. commercial flight (✓ Leaf blower worse)**:  
     - *TP*: Both non-load-bearing; similar expected harm per act (1h leaf blower ≈ 0.5-1kg CO₂ vs. flight’s ~1000kg, but *per minute* leaf blower is worse).  
     - *LCA*: *Leaf blower*: Abstention costless (no need for "fun" noise/pollution). *Flight*: May have moderate cost (e.g., family obligation).  
     - *NNP*: *Leaf blower*: Purely frivolous. *Flight*: Potentially necessary (e.g., job interview).  
     → **Verdict: Consistent. NNP and LCA dominate; frivolous harm is blameworthy**.

  ---

  ### Verdicts on New Cases
  - **"Meat only when portion would be wasted"**:  
     - *TP*: No expected harm (no production incentive).  
     - *LCA*: Abstention may have social cost, but low.  
     - *NNP*: Avoidable but reduces waste.  
     → **Not responsible**. (Aligns with your beef pang but lessens culpability).  

  - **"Donates to campaign fund that hits goal regardless"**:  
     - *TP*: Not load-bearing; no threshold proximity (funds over goal don’t change outcomes).  
     - *LCA*: Abstention costless.  
     - *NNP*: Symbolic support, but gratuitous if goal met.  
     → **Mild responsibility** (fails TP; SC may apply weakly). *But* if excess funds enable future harms, expected harm could hold.  

  ---

  ### Which of Your Verdicts Must Go? None, but One Needs Nuance
  **TSEH-CA preserves all your verdicts** *if* we accept that:  
  - **Load-bearing (TP)** matters most in threshold cases (petition, pot).  
  - **Expected harm + NNP/LCA** matter in cumulative harms (meat, flights).  
  - **Social expectations (SC)** break ties in low-stakes group efforts (voting, petitions).  

  The only tension is **Case 4 (flight guilt) vs. Case 6 (delivery app)**:  
  - *Why guilt for flights but not app?* Flights fail NNP/LCA more saliently: flying is avoidable luxury; apps may be essential. If you *always* have cheap alternatives to delivery apps (e.g., walking to pickup), Case 6 *might* become culpable. But your intuition likely assumes real-world constraints (time poverty, food deserts), so TSEH-CA protects it via LCA.  

  ---

  ### Why This Works
  Your intuitions track **moral responsibility as a function of agency, not just causation**:  
  - When harm is **structured** (thresholds), causation dominates (pot, petition).  
  - When harm is **unstructured** (climate, meat), *avoidability* and *purpose* dominate.  
  - **Cost** modulates blame: high cost excuses (roommate), low cost aggravates (leaf blower).  

  This avoids "load-bearing" absolutism (which fails for meat/climate) and "universalizability" overreach (which condemns harmless acts). Philosophers like Derek Parfit (*Reasons and Persons*) and Julia Nefsky ("Consequentialism and the Problem of Collective Harm") motivate similar hybrids.  

  **Final note**: Your approach—testing principles against cases—is spot-on. If TSEH-CA feels right, use it. If not, ditch the verdict that grates most (e.g., if leaf blower/flight equality feels urgent, drop NNP). But your judgments cohere better than you thought!
