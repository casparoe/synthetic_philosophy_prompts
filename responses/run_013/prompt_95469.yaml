answer: |-
  Here is a comprehensive exam question package designed for your upper-level seminar, meeting all specified criteria.

  ---

  ### **Exam Question: Value of Information in Ambiguous Contexts**  
  **(Worth 40% of exam; answer in ~75 minutes)**  

  **Scenario:**  
  Regina, a fund manager, must decide whether to invest in a startup (*Act A*) or a government bond (*Act B*). A tech giant, **NeuroCore**, may acquire the startup. If the acquisition occurs (*State θ₁*), *Act A* yields \$10M; otherwise (*State θ₂*), it yields -\$5M. *Act B* yields a guaranteed \$1M. Regina is *ambiguity-averse*: she evaluates acts using the *maximin expected utility (MEU)* rule with a set of priors **C** = {*P₁, P₂*}, where *P₁*(θ₁) = 0.3, *P₂*(θ₁) = 0.7. She can consult an analyst who claims to predict the acquisition but is unreliable. The analyst’s report (*Signal S*) has accuracy *P(S = "Acquire" | θ₁) = 0.8* and *P(S = "No Acquire" | θ₂) = 0.6*. Crucially, Regina distrusts the analyst’s reliability estimates and applies MEU to her *post-signal* decisions using the same set **C**.  

  **Tasks:**  
  1. **Calculate the expected value of the analyst’s information (EVI) for Regina.** Show that EVI < 0. *(Hint: Compare her MEU payoffs with and without the signal.)*  
  2. Good’s theorem states: *"For a Bayesian expected-utility maximizer who updates by conditionalization, EVI ≥ 0."* Identify the **specific premise** Regina violates and explain *why* this violation causes EVI < 0.  
  3. Despite (2), defend the claim: *"Good’s proof remains mathematically incontestable for agents satisfying its premises."*  
  4. Good’s result is often summarized as *"more information never hurts."* Assess whether this slogan holds for agents like Regina. Should the theorem be considered a general vindication of information-gathering?  

  ---

  ### **Model Answer**  
  **(~800 words)**  

  **1. EVI Calculation for Regina**  
  Regina uses MEU: she maximizes worst-case expected utility across **C**.  
  - **Without information:**  
    - *Act A*: min{ *0.3×10 + 0.7×(-5) = -0.5* ; *0.7×10 + 0.3×(-5) = 5.5* } = **-0.5**  
    - *Act B*: \$1M in all cases → **1**  
    → *Optimal act: B* → **MEU₀ = 1**  
  - **With information:** For each signal *S*, she re-applies MEU to posterior beliefs. Since she distrusts the likelihood model, she computes posteriors for *each prior in **C*** and takes the worst case.  
    - *Signal S = "Acquire"*:  
      - Under *P₁*: Posterior *P₁(θ₁|S) = [0.8×0.3]/[0.8×0.3 + 0.4×0.7] ≈ 0.46* → *E[A]≈1.9 ; E[B]=1* → **MEU_S = min(1.9,1) = 1** (Act B)  
      - Under *P₂*: Posterior *P₂(θ₁|S) = [0.8×0.7]/[0.8×0.7 + 0.4×0.3] ≈ 0.82* → *E[A]≈7.3 ; E[B]=1* → **MEU_S = min(7.3,1) = 1** (Act B)  
      → *Worst case MEU = 1*  
    - *Signal S = "No Acquire"*:  
      - Under *P₁*: Posterior *P₁(θ₁|S) = [0.2×0.3]/[0.2×0.3 + 0.6×0.7] ≈ 0.12* → *E[A]≈-3.8 ; E[B]=1* → **MEU_S = min(-3.8,1) = -3.8** (Act A? But MEU forces worst prior)  
      - Under *P₂*: Posterior *P₂(θ₁|S) = [0.2×0.7]/[0.2×0.7 + 0.6×0.3] ≈ 0.44* → *E[A]≈1.6 ; E[B]=1* → **MEU_S = min(1.6,1) = 1**  
      → *Worst case MEU = min(-3.8,1) = -3.8* (from *P₁*)  
  - **Expected MEU with information:**  
    *P(S="Acquire")* = Avg over **C**: min{ *0.8×0.3 + 0.4×0.7=0.52* ; *0.8×0.7 + 0.4×0.3=0.68* } = **0.52**  
    → *E[MEU|info] = (0.52×1) + (0.48×[-3.8]) ≈ 0.52 - 1.82 = -1.3*  
  - **EVI** = E[MEU|info] - MEU₀ ≈ **-1.3 - 1 = -2.3 < 0**  

  **2. Violated Premise and Mechanism**  
  Good’s theorem requires:  
  - **Premise 1:** *Bayesian updating* (conditionalization on the signal).  
  - **Premise 2:** *Additive separability* of preferences across states (via the Sure-Thing Principle or linearity in probabilities).  
  Regina violates **Premise 2**. Her MEU preferences are *non-additive*: she evaluates acts by *minₚ Eᵤ[act|P]*, which violates the independence axiom of expected utility. This causes EVI < 0 because the signal *creates new ambiguity*. Without information, the worst prior (*P₁*) makes *Act A* bad (-0.5), but *Act B* is safe. After *S="No Acquire"*, the worst prior (*P₁*) now makes *Act A* disastrous (-3.8) *even though other priors make it acceptable*. Since MEU forces her to guard against this newly revealed worst case, she is *effectively harmed by information that expands perceived ambiguity*. Good’s proof relies on preferences being linear in probabilities, ensuring information only refines expectations without creating new "worst cases."  

  **3. Validity of Good’s Theorem**  
  Good’s result holds *without exception* for any agent who:  
  - Has a *single prior* (satisfying Kolmogorov axioms),  
  - Updates by *conditionalization*,  
  - Has *state-independent utilities* linear in probabilities.  
  The proof is algebraic: EVI = ∑ₛ P(s) maxₐ ∑ᵩ P(θ|s) u(a,θ) - maxₐ ∑ᵩ P(θ) u(a,θ) ≥ 0. The "always ignore" option ensures non-negativity *if* conditionalization and additive separability hold. Regina’s case violates the latter, but this does not challenge the theorem’s internal validity. It confirms that the result is *tight*: relax its premises, and EVI can turn negative.  

  **4. The Slogan and Theorem’s Reputation**  
  - **Settled consensus:** The theorem *does* vindicate "information never hurts" *for Bayesian expected-utility maximizers*. Within this class, gathering free information is always rational.  
  - **Contested issues:**  
    - *Rationality of ambiguity aversion*: Proponents (e.g., Gilboa-Schmeidler) argue MEU protects against model uncertainty; critics (e.g., Savage) deem it irrational to violate the Sure-Thing Principle.  
    - *Scope of the slogan*: If ambiguity-averse agents are rational (a normative dispute), then "more information is always better" is false as a universal claim.  
    - *Practical vindication*: In real-world decisions (e.g., finance, medicine), where ambiguity is prevalent, the theorem’s advice may be pragmatically limited.  
  The theorem *does not* support the slogan unconditionally. Its reputation as a "vindication" of information-gathering holds only in ambiguity-free Bayesian contexts. When society includes ambiguity-sensitive agents (e.g., in markets or collective decisions), the slogan requires qualification.  

  ---

  ### **Marking Scheme**  
  **Total: 40 marks**  

  #### **Part 1: EVI Calculation (10 marks)**  
  - **A (9–10):** Correct MEU₀ (1); correct posterior sets for signals; identifies worst-case MEU for each signal; accurate E[MEU|info] (-1.3); EVI = -2.3.  
  - **B (7–8):** Minor arithmetic errors but sound MEU methodology.  
  - **C (5–6):** Omits MEU in posterior analysis (e.g., assumes Bayesian updating).  
  - **D (0–4):** Fundamental errors (e.g., misapplies EU, ignores ambiguity).  

  #### **Part 2: Premise Violation (10 marks)**  
  - **A (9–10):** Names *non-additivity* (or *violation of linearity/Sure-Thing Principle*) as cause; explains how signal creates new worst-case scenarios; contrasts with Bayesian additivity.  
  - **B (7–8):** Correctly identifies non-Bayesian updating but does not link to separability; or notes ambiguity without specifying preference structure.  
  - **C (5–6):** Vague (e.g., "she’s not Bayesian"); confuses with info cost or risk aversion.  
  - **D (0–4):** Claims "theorem is false" or "ambiguity refutes Good."  

  #### **Part 3: Theorem Validity (10 marks)**  
  - **A (9–10):** States premises precisely (single prior, conditionalization, additive EU); explains how "ignore" option works algebraically; emphasizes internal soundness.  
  - **B (7–8):** Correct premises but vague on proof mechanics; minor omissions.  
  - **C (5–6):** Only describes Bayesianism generally; fails to address "ignore" option.  
  - **D (0–4):** Suggests the counterexample challenges the theorem’s logic.  

  #### **Part 4: Slogan Assessment (10 marks)**  
  - **A (9–10):** Affirms slogan for Bayesians; notes ambiguity aversion as a live normative dispute; distinguishes descriptive/practical validity; nuanced conclusion.  
  - **B (7–8):** Correct scope limitation but dismisses ambiguity aversion as irrational without argument; or overgeneralizes the theorem’s applicability.  
  - **C (5–6):** One-sided view (e.g., "slogan is dead" or "theorem proves information is good").  
  - **D (0–4):** Ignores normative debate; conflates with cost of information.  

  ---

  ### **Key Distinctions for Grading**  
  - **A vs. B Threshold:**  
    - **A answer:** Maintains clear separation between (a) theorem’s validity under premises, (b) violation due to specific preference structure, and (c) open questions of rationality. Avoids overgeneralization.  
    - **B answer:** Correctly analyzes the scenario but concludes "Good’s theorem fails for ambiguity-averse agents" without clarifying its *restricted* validity, or dismisses Regina as irrational without engaging normative debate.  
  - **Critical Penalties:**  
    - -5 marks for unqualified claims like "this refutes Good’s theorem."  
    - No credit for Part 2 if student blames updating (Regina *does* update within each prior; violation is in preference aggregation).  

  This design ensures students must engage the interplay of assumptions, theorem scope, and normative philosophy to score highly, moving beyond rote recitation.
