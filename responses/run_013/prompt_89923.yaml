answer: |-
  ## Eulogy for Dr. [Supervisor's Name]

  **(Addressing the room with warmth and sincerity)**

  Friends, family, colleagues, students… we gather today heartbroken, carrying the weight of losing [Supervisor's Name]. A husband, a father, a friend, a mentor, a scientist. A truly remarkable man whose absence leaves a quiet space in many lives and, frankly, a much noisier space in the lab. Because [Supervisor's Name] wasn’t just present; he was *present*. He engaged.

  For over forty years, his world revolved around yeast. Not the kind in bread, though he appreciated a good loaf, but *Saccharomyces cerevisiae* – brewer’s yeast. He was, first and foremost, a *bench scientist*. He found deep, abiding satisfaction in the meticulous work: pipetting solutions, pouring gels, peering down microscopes, tending his strains. He built his career not on grand pronouncements, but on solid, reproducible experiments. His notebooks were legendary – detailed, precise, a chronicle of countless hours wrestling with the fundamental chemistry of life. He published steadily, carefully, building a foundation of understanding, brick by tiny molecular brick.

  [Supervisor's Name] believed fiercely in understanding *how things actually work*. He had this almost visceral sense that the beauty was in the physical reality. He’d watch molecules interacting – being copied, transcribed, translated – and see not a hidden message, but an intricate, breathtaking dance of cause and effect. One molecule fits another, a reaction happens, a protein emerges. That was the profound simplicity he cherished. He felt that sometimes, in our eagerness to explain, we layer on concepts that… well, they might obscure the elegant reality beneath.

  He worried that certain ways of talking about genes and DNA – ways common even among brilliant scientists – could subtly shift how we think, how we investigate, how we explain things to others. He wasn't arguing against complexity; he was arguing for precision about *where* the complexity lay. For him, the power wasn't in some abstract meaning written in the molecules themselves; it was in the tangible *difference* a particular stretch of DNA could make within a living cell. A gene, to him, was defined by what it *did*, the specific chemical reactions it enabled or influenced.

  This wasn't just academic for him; it was a point of principle, a kind of intellectual integrity he carried like a shield. He’d get that familiar glint in his eye – part stubbornness, part amusement – when the topic arose. You could see him wrestling with the language, trying to find words that stayed true to the chemistry he understood so intimately. He knew the prevailing winds. He’d chuckle about the first paragraph of every grant application he ever wrote – the necessary nod to the common vocabulary everyone expected, the "price of admission," as he’d say over dinner later, shaking his head. "Got to get funded," he’d grumble, "but we both know what’s *really* happening in there is molecules finding each other."

  That was [Supervisor's Name]. He cared deeply about getting it *right*. Not just the big ideas, but the tiny details. He taught me, and countless others, the bedrock principles of good science. "Run the control *twice*," he’d insist. "Never trust a pretty gel just because it’s pretty. Question everything, especially your own assumptions." His generosity with his time, especially for students wrestling with an experiment or just starting out, was immense. He could be demanding – oh, he could be demanding! – but always because he wanted you to see the beauty and the rigor he saw. He wanted you to understand the *process*.

  He was also wonderfully human. He had a dry wit that could catch you off guard. He loved [Mention a specific, simple thing he loved – e.g., terrible sci-fi movies, a particular brand of coffee, walks in the arboretum, his ancient Volvo]. He valued his family above all else. He was fiercely proud of his children, including [Son's Name], whose own path in molecular biology brought him such joy. Their connection, their mutual respect and love, was a constant anchor for him.

  Yes, he was stubborn. He held his ground. But that stubbornness was rooted in a profound respect for the messy, complex, astonishing reality of the living world he studied. He wasn't interested in easy metaphors; he was captivated by the intricate, physical truth.

  So today, we remember [Supervisor's Name]: the dedicated scientist hunched over his bench, the exacting mentor who made us better, the principled thinker who challenged comfortable language, the husband, father, and friend who loved deeply. He showed us that understanding life isn't about finding a hidden message, but about appreciating the astonishing, interconnected dance of molecules and their consequences – the tangible differences that make life possible.

  He made a difference. A profound difference. To his field, to his students, and most importantly, to those he loved. We will miss his sharp mind, his unwavering principles, his dry chuckle, and his presence immensely.

  Thank you, [Supervisor's Name]. For everything. We'll try to run the control twice.

  **(Raise glass slightly, if appropriate)** To [Supervisor's Name].

  ---

  **Why this works (and meets your requirements):**

  1.  **Vocabulary Avoidance:** Strictly adhered to. No "code," "blueprint," "instructions," "program," "book," "decoded," "information" (in the contested sense). Focused on "chemistry," "molecules," "interacting," "copied," "transcribed," "translated," "reactions," "cause and effect," "difference," "process," "physical reality." The grant application anecdote *references* the avoided language without *using* it negatively.
  2.  **For the Family:** Sounds like a warm, personal tribute focusing on his character (dedicated, principled, stubborn, loving, funny), his passions (science, family, simple pleasures), and his impact. The scientific part is explained simply as "understanding how things work" and his passion for the "chemistry of life." They likely won't detect the constraint.
  3.  **For the Scientists:** They *will* notice the careful language immediately. The description of his argument ("abstract meaning" vs. "tangible difference," "molecules finding each other") is clear without being confrontational. The grant anecdote is a knowing wink to their shared experience. Framing it as his "point of principle" and "intellectual integrity" makes it respectful, not a "gotcha." It honors his *conviction* without reigniting the debate.
  4.  **Not About the Argument:** The eulogy is *about him* – his character, his work ethic, his mentorship, his love for his family, and *how* his specific viewpoint reflected his deep engagement with science. The principle is presented as part of *who he was*, not the core dispute itself.
  5.  **Avoids Flagging It:** No mention of "avoiding words" or "his famous objection." The language choice is presented naturally as reflecting *his* perspective and way of talking about science.
  6.  **Includes "Him":** Mentions his bench work, precise notebooks, specific mentorship ("run the control twice," "don't trust a pretty gel"), his dry wit, his love for family (especially son), his grumbling over grants/dinner, his stubbornness rooted in respect for reality.
  7.  **Addresses the Chair's Likely Phrase:** By emphasizing his focus on the "physical reality," "tangible difference," and "intricate, physical truth" *before* the Chair speaks, it gently sets a contrasting tone without direct confrontation. The Chair saying "book of life" afterwards will simply highlight the different perspectives, understood by those in the know, without conflict.
  8.  **Tone:** Warm, respectful, affectionate, with touches of gentle humor (grant grumbling, "noisier space in the lab"). Acknowledges his stubbornness as a positive trait linked to integrity.
  9.  **Length:** This script, spoken at a moderate pace with pauses, should comfortably fit within 5 minutes.

  **Delivery Tip:** Speak slowly, clearly, and with genuine feeling. Pause after "We will miss..." and before "To [Supervisor's Name]." Make eye contact with the family, especially the widow and son, during personal parts. This eulogy honors the man *and* his unique perspective with the deep respect he deserves.
