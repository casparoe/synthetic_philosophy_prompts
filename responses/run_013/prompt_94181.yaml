answer: |-
  ## Joint Statement on the Nature and Validity of Consent  
  *Produced by the Ad Hoc Committee for Conceptual Reconciliation (Inside & Outside Camps)*  
  *[Date]*

  **Preamble:** After sustained deliberation, representatives of the "Inside" and "Outside" traditions concerning consent find substantial common ground on its ethical function, core cases, and necessary conditions for validity. We acknowledge significant theoretical differences but commit to a shared framework for identifying and resolving them. This document outlines our agreements, clarifies our disagreements neutrally, identifies potential cruxes for future inquiry, and distinguishes substantive disputes from terminological ones.

  ### Part 1: Agreed Claims (Signed Without Reservation by Both Camps)
  1.  **The Core Function:** Consent transforms the moral permissibility of an action (typically, an intrusion upon bodily integrity, property, or personal sphere) that would otherwise be wrongful. It renders permissible what would otherwise be a violation of autonomy or rights.
  2.  **The Wrong of Non-Consensual Action:** Acting without valid consent constitutes a wrong *against the person whose consent was required*. The primary wrong is a violation of their autonomy – specifically, their right to control what happens to their person, body, or legitimate sphere of concern.
  3.  **The Necessity of Competence:** Valid consent requires the consenter to possess sufficient cognitive and volitional capacity. This minimally includes the ability to understand the nature and significant consequences of the act in question and the ability to make a choice free from overwhelming internal compulsion (e.g., severe psychosis). Both camps reject "consent" from individuals lacking this baseline competence (e.g., very young children, severely cognitively impaired individuals).
  4.  **Core Case Agreement - Clear Valid Consent:** Consent is clearly valid when a competent person, free from relevant deception or coercion, possesses the affirmative attitude towards the specific act ("inside" state) *and* communicates this permission in a reasonably clear manner understood or understandable by the recipient ("outside" act).
  5.  **Core Case Agreement - Clear Invalid Consent:** Consent is clearly invalid when a competent person explicitly communicates a refusal (e.g., "No", "Stop", resisting) *or* when there is a manifest absence of the affirmative attitude (e.g., unconsciousness, clear distress).
  6.  **Deception Nullifies Consent in Core Cases:** Consent is invalid if obtained through deception about the *nature* of the act itself (Fraud in the Factum - e.g., pretending a medical procedure is a massage). Both camps agree deception about *materially significant consequences or fundamental aspects* of the act also typically invalidates consent, though the precise boundaries require further discussion (see Disagreements & Cruxes).
  7.  **Coercion Nullifies Consent in Core Cases:** Consent is invalid if obtained through coercion that overrides the consenter's free will in a fundamental way. Both camps agree that credible threats of *serious, imminent, and wrongful harm* constitute coercion that invalidates consent (e.g., "Have sex with me or I will kill you"). The nature of the baseline and the role of the proposer require further analysis (see Disagreements & Cruxes).
  8.  **Revocability:** Consent, once given, is revocable at any time prior to or during the act by a competent consenter. Revocation can be communicated verbally or non-verbally in a reasonably clear manner. Post-act withdrawal does not retroactively negate consent for the act *as it occurred*, though it may have other moral significance.
  9.  **Scope & Specificity:** Consent must be given with sufficient understanding of the specific act and its scope. Broad or vague consent does not cover specific acts not reasonably implied.
  10. **Theory Constraint:** Any adequate theory of consent must explain why and how the agreed core cases (4 & 5) are clear, how deception and coercion (as agreed in 6 & 7) undermine validity, and account for the necessity of competence and revocability.

  ### Part 2: Genuine Disagreements (Neutrally Framed)

  | # | Question At Issue (Neutral Framing)                                                                 | Inside Camp Position                                                                                             | Outside Camp Position                                                                                                                | What Turns On It                                                                                              |
  | :--- | :-------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------ |
  | **D1** | **What is the essential defining element of consent?**                                              | Consent is fundamentally a private, affirmative mental state (attitude, willingness) towards the specific act. Communication is evidence, not the essence. | Consent is fundamentally a public, communicative act – the performance of granting permission in a manner reasonably interpretable by the recipient. The mental state informs the act but is not the consent itself. | The very definition of the concept. Determines what we are *referring to* when we say "consent occurred".      |
  | **D2** | **When an individual possesses the affirmative mental state but fails to communicate it (e.g., freezes), and another proceeds, has consent been given? Was proceeding wrong?** | **Consent Given?** No. The essential element (affirmative attitude) is present, but consent *is* that state. Consent exists but is incomplete/unrealized without communication. <br>**Wrong to Proceed?** Yes. Proceeding without the *communicated permission* violates the recipient's duty to ensure they have permission to act. Proceeding here is reckless. | **Consent Given?** No. Consent requires the communicative act. Silence or inaction, absent prior agreement, is not permission. <br>**Wrong to Proceed?** Yes. Proceeding without any communication of permission is acting without consent. The recipient has no basis to rely on. | Whether consent *exists* privately without communication. The duty of the actor relying on permission.         |
  | **D3** | **When an individual performs a clear communicative act granting permission but lacks any corresponding affirmative mental state (hollow consent), and another proceeds relying on it, has consent been given? Was proceeding wrong?** | **Consent Given?** No. The essential element (affirmative attitude) is absent. The act is mere mimicry, not consent. <br>**Wrong to Proceed?** *Resulting Act:* Yes. Proceeding based on a false signal is non-consensual *if discovered*, but the recipient may not be culpable if reasonably relying. The *moral character* of the act is non-consensual. | **Consent Given?** Yes. Valid consent is the reasonably reliable communicative act itself. The recipient validly acquired permission to act. <br>**Wrong to Proceed?** No. The recipient acted based on valid consent. The *moral character* of the recipient's act is permissible. The hollowness may involve deception by the "consenter" or other wrongs, but not a consent violation by the recipient. | Whether communication alone (without attitude) constitutes consent. The moral permissibility of relying on apparently valid communication. |
  | **D4** | **When the affirmative mental state and the communicative act diverge (D2 & D3 scenarios), who generally bears the primary responsibility/risk for the mismatch?** | The primary responsibility lies with the *actor* (the one seeking consent) to ensure they have secured genuine agreement, going beyond mere surface signals. The actor bears the risk of misreading silence or accepting hollow signals. | The primary responsibility lies with the *consenter* to ensure their communication accurately reflects their will. The consenter bears the risk of failing to communicate their 'yes' or misleadingly communicating a 'yes' they don't mean. | Fairness in assigning responsibility for communicative breakdowns. Efficiency in social coordination.           |
  | **D5** | **Is the validity of consent undermined by deception only if the deception relates to the "essential nature" of the act (Factum), or can deception about inducements (Inducement) also undermine it?** | Deception about *any* fact material to the consenter's decision can invalidate consent, whether concerning the act's core nature (Factum) or the reasons for agreeing (Inducement). If the lie caused the 'yes' and concerned something important *to the consenter*, consent is vitiated. | Deception typically invalidates consent only if it concerns the *identity or fundamental nature of the act itself* (Factum). Deception about collateral matters, benefits, or reasons (Inducement) usually does not negate consent to the act *as understood by the consenter*, though it may be a separate wrong. | The scope of what an act "is" for consent purposes. The importance of subjective reasons versus objective act-descriptions. |
  | **D6** | **Is competence primarily about the *process* of understanding and choosing, or does it also involve the *content/substance* of the choice (e.g., "reasonable" values)?** | Competence is solely about the *process*: understanding relevant information and reasoning to a choice. A competent person can consent to acts others find foolish or repugnant based on their own values (however "weird"). | Competence inherently involves a minimal threshold of *content*: the ability to grasp not just facts but the *significance* of the act requires alignment with broadly shared human values or interests. Truly bizarre or self-annihilating choices by someone understanding facts may indicate incompetence. | The boundary of paternalism. Whether consent can validate acts perceived as fundamentally against "human flourishing". |
  | **D7** | **Can valid consent be given non-occurrently (e.g., advance directives, blanket consent for a period including unconsciousness)?** | Yes, if given competently while occurrent, specifying clear conditions/triggers, and revocable when occurrent. The affirmative attitude existed when the directive was set. | No. Consent is an *occurrent* phenomenon tied to the specific act-at-the-time. Advance directives are *authorizations* or *promises*, not consent itself. Consent requires a contemporaneous communicative act (or pre-defined reliable proxy) linked to the specific instance. | The temporal scope of consent. Whether autonomy can be exercised prospectively for future states. |

  ### Part 3: Cruxes for Resolution

  1.  **The Silent Willingness Crucible:**
      *   **Case:** Person A, competent and uncoerced, forms a clear, affirmative mental state ("yes") regarding a specific act with Person B. Due to a sudden paralyzing anxiety, A is completely unable to move or speak. B, unaware of A's internal state and seeing no signal, proceeds with the act.
      *   **Relevant & Agreed Test:** Does proceeding in this scenario constitute a *consent violation* against A? Is B's act morally impermissible *because* it lacked consent?
      *   **Inside Prediction:** Yes. Consent (the state) existed. B proceeded without knowing they had consent, acting recklessly without ensuring communication. Violation occurs.
      *   **Outside Prediction:** No. Consent (the act) never occurred. B had no permission to act. Violation occurs. *(Note: Agreement violation occurs, disagreement on whether consent existed/its role in the violation)*.
      *   **Crux Value:** Forces clarity on D1 & D2. If violation occurs *despite* the internal state, Inside must weaken the sufficiency of the state. If violation occurs *because* of the lack of state despite apparent signals, Outside must adapt.

  2.  **The Hollow Performance Crucible:**
      *   **Case:** Person A, competent and uncoerced, performs a flawless, unambiguous communicative act granting permission for a specific act to Person B (e.g., clear verbal "yes", signing a form). A does this solely "to get it over with," feeling intense internal reluctance and no affirmative attitude whatsoever. B, reasonably relying on A's communication, proceeds.
      *   **Relevant & Agreed Test:** Did B act with valid consent? Was B's act morally permissible *based on having consent*?
      *   **Inside Prediction:** No. No consent (state) existed. B acted without consent, though B may be non-culpable due to reasonable reliance. The act's moral character is non-consensual.
      *   **Outside Prediction:** Yes. Valid consent (act) was given. B acted permissibly based on valid consent. A's internal state creates a separate issue (deception? bad faith?) but doesn't negate B's consent.
      *   **Crux Value:** Directly tests D3. If B is judged to have acted permissibly *with consent*, Inside must acknowledge the normative force of the act. If B is judged to have acted *without consent* (even if blameless), Outside must explain why the act wasn't sufficient.

  3.  **The Risk Allocation Crucible (Divergence Cases):**
      *   **Scenario Set:** Systematically examine cases where attitude and communication diverge (Silent Willingness, Hollow Performance, ambiguous signals). Vary contexts (intimate, medical, commercial).
      *   **Relevant & Agreed Test:** In cases of divergence, does moral responsibility for the resulting interaction (including potential wrongs) fall primarily on the *actor* (B) for proceeding without adequate assurance of genuine agreement, or on the *consenter* (A) for failing to accurately manifest their will?
      *   **Inside Prediction:** Primary responsibility lies with the *Actor* (B) to secure genuine agreement, not just surface compliance. B bears more risk.
      *   **Outside Prediction:** Primary responsibility lies with the *Consenter* (A) to communicate their will truthfully and effectively. A bears more risk.
      *   **Crux Value:** Tests D4 practically. Examining patterns of responsibility assignment across contexts may reveal which default rule is more workable, fair, or autonomy-respecting, potentially forcing one camp to modify its stance on risk allocation.

  4.  **Deception by Omission Crucible:**
      *   **Case:** Person B seeks consent from Person A for Act X. B knows Fact Y is a absolute deal-breaker for A, but Y is not part of the standard understanding of X. B deliberately withholds information about Y. A consents to X, never discovering Y. Act X occurs.
      *   **Relevant & Agreed Test:** Was A's consent to Act X valid? Did B act with consent?
      *   **Inside Prediction:** No. Consent was vitiated by deception (omission) regarding a material fact (Y). B acted without valid consent.
      *   **Outside Prediction:** Ambiguous/Contested. If Y is not part of the "essential nature" of X, consent to X *as described* may be valid. This highlights the core disagreement (D5). Outcome depends on resolving the Factum/Inducement boundary.
      *   **Crux Value:** Directly pressures the D5 disagreement. If both camps agree consent is invalid here, Outside must broaden its view of what deception matters. If disagreement persists, it sharpens the need to define "essential nature" vs. "inducement".

  5.  **Non-Occurrent Consent Crucible (Medical Directive):**
      *   **Case:** Person A, while fully competent and occurrent, signs a detailed advance directive consenting to specific life-saving medical procedure Y should they become unconscious and incompetent due to Event Z. Event Z occurs. A is unconscious and incompetent. Doctors perform Y exactly as authorized in the directive.
      *   **Relevant & Agreed Test:** Did the doctors perform Procedure Y with A's valid consent?
      *   **Inside Prediction:** Yes. A exercised autonomy by giving valid consent (state+act) while occurrent for the future scenario.
      *   **Outside Prediction:** No. Consent must be contemporaneous and occurrent. The directive provided valid *authorization* (justifying the act), but not consent itself at the time of the act.
      *   **Crux Value:** Directly tests D7. If the act is widely judged as *consensual*, Outside must expand its notion of the temporal scope of consent or differentiate consent from authorization. If judged *non-consensual but justified*, Inside must explain why consent isn't necessary for permissibility in such cases.

  ### Part 4: Merely Verbal Disagreements & Remaining Substance

  We identify one significant merely verbal element:

  *   **Term "Consent" as State vs. Act:** A substantial portion of the disagreement stems from using the single term "consent" to label two distinct (though related) phenomena: the *mental state* of willingness (Inside focus) and the *communicative act* of granting permission (Outside focus). Much heat arises from arguing which one "is really consent."

  **Setting Aside the Term:** If we agree to use distinct terms (e.g., "Consenting Attitude" vs. "Permission-Granting Act"), significant *substantive* disagreements remain:

  1.  **Normative Primacy:** Which phenomenon (Attitude or Act) is *morally primary* in rendering an otherwise wrongful act permissible? Does the act's permissibility hinge on the actor's state (requiring its presence and grounding the act), or on the recipient's valid acquisition of permission through communication (making the act permissible regardless of the underlying state, unless vitiated by factors like incompetence)?
  2.  **Risk Allocation:** When the Attitude and Act diverge (silence/hollowness), which party (Consenter or Actor) should bear the primary burden of ensuring alignment and the risk of harm when alignment fails? (D4 remains fully substantive).
  3.  **Scope of Deception:** What *kinds* of deception invalidate the Permission-Granting Act? Does it depend on the nature of the fact lied about (Factum/Inducement) or solely on its materiality to the Consenter's decision? (D5 remains substantive).
  4.  **Temporal Scope:** Can the Consenting Attitude, validly formed and expressed in advance, render a future act performed on a non-occurrent person permissible? Or is a contemporaneous Permission-Granting Act always required? (D7 remains substantive).

  **Conclusion:** We affirm the profound importance of consent in respecting autonomy and preventing wrongful intrusions. While our traditions emphasize different facets of the consensual transaction, we share core commitments to competence, voluntariness, and clarity. The identified disagreements are substantive and significant, concerning the fundamental grounds of permissibility and the distribution of responsibility. The proposed cruxes offer pathways for productive debate and potential convergence. We pledge to engage with these questions rigorously and in good faith.
