prompt: |-
  Hey, I teach a final-year module that's half history, half philosophy of history, and I'm writing the exam. The last essay is the one I actually care about: it's on the theme we've run all term, when does a legend become history, using Troy, Arthur and the Exodus as the three running cases. The problem is that every question I've tried lets them just recite the standard fact-sheets ("no Egyptian evidence for the Exodus", "there's a burnt layer at Hisarlik", "Geoffrey of Monmouth mostly made Arthur up") and then stop. I want a question that makes them do conceptual work instead. So I'd like you to act as an external examiner who knows this material cold — archaeology, the texts, and the methodology debates — and write me the question plus everything I'd need to mark it. Dont worry about citations or a reading list, it's a closed-book exam, no books allowed.

  Here's the angle I've been pushing at them and I want the question to test whether they've actually absorbed it. I keep telling them that when someone asks "did the Trojan War really happen", they're usually asking one of three quite different things and sliding between them without noticing: (i) the event question — did the things the story narrates actually occur; (ii) the descent question — is there a causal chain that carries the content of the story back to some real event, as opposed to the story being invented later and read backwards onto the past; and (iii) the datum question — what does the mere fact that people told this story tell us about the people who told it. My provocation, which I want the question to force them to either defend or knock down, is that the evidence can really only bear on (ii), that (i) mostly can't be settled either way, and that most of the shouting in this area is people arguing about (i) while waving evidence that only speaks to (ii) — or, going the other way, minimalists quietly swapping (iii) in for (i) and presenting it as a finding about what happened. And then the sting I want them to face: the three cases look like they should be graded very differently, but I'm not sure the evidence actually grades them differently. Troy has its hints (the Hittite material some scholars match to a place and a king they read as Wilusa and Alaksandu, plus a destruction layer); the Exodus has the Merneptah reference to Israel and not much else Egyptian; Arthur has Nennius, then Geoffrey, and effectively nothing behind either of them. Yet we cheerfully call one of these historical, one contested, and one literary. Is that grading earned by the evidence, or is it cultural, and what would have to be true for the grading to be earned?

  So please write me (a) the essay question itself, phrased so it can't be answered by reciting the three fact-sheets, (b) a model answer of around 700–800 words that actually takes a position on my provocation and on whether the three-way grading is earned, and (c) a marking scheme out of 20 that names the specific moves an A answer has to make and the specific mistakes that should cost marks — including at least one mistake that a very well-read student is especially likely to make. Think it through carefully, and start by brainstorming the ways a strong student could push back on my three-question split before you commit to the model answer.
reasoning: |-
  Okay, the user teaches a final-year module blending history and philosophy of history. They're crafting an exam essay question but keep getting fact-based responses instead of conceptual analysis. Their core frustration? Students regurgitate archaeological bullet points about Troy/Arthur/Exodus without engaging their deeper framework about three distinct historical questions: event reality (i), causal descent (ii), and cultural meaning (iii).

  The user's provocative thesis is that evidence primarily bears on (ii), while (i) is often undecidable, and scholars confuse these levels. They want the question to force students to confront whether the common academic grading of Troy (historical), Exodus (contested), and Arthur (literary) reflects evidence or cultural bias. 

  Hmm, first I need to brainstorm pushbacks against their three-question split before designing the question. A strong student might argue:
  - That (i) and (ii) are interdependent—you can't assess descent without some event hypothesis
  - That dismissing (i) as undecidable ignores probabilistic reasoning (e.g., Troy's destruction layer + Hittite texts make war more likely than not)
  - That (iii) isn't truly historical inquiry but anthropology, avoiding the "what happened" question

  But the user's point stands—much debate conflates these. Now for the question design: it must block fact-dumping by focusing on methodology. Phrases like "what is at stake" and "epistemological consequences" should force higher-order thinking. The model answer needs to defend their triad while admitting the grading is cultural—Troy benefits from Homeric prestige and archaeological tangibility, whereas Arthur lacks "smoking guns." The marking scheme must penalize mere case summaries and reward meta-analysis of evidentiary thresholds.

  Key traps: A knowledgeable student might cite the Papyrus Ipuwer as "evidence for Exodus" without addressing its temporal disconnect (perfect example of misapplying evidence for descent to event reality). The model answer will preempt this by noting how minimalists reframe absence of evidence via (iii). 

  For the sting—yes, the grading is cultural. Hisarlik's excavated walls feel "real," Merneptah's stele is bureaucratic, Arthur's swords are mythic. But evidentially? All three descent chains are fragmentary. The model answer should conclude that we grade based on what each culture considers authoritative traces: archaeology for Troy, texts for Exodus, literary evolution for Arthur. That's the philosophical punch.
answer: |-
  Here's a comprehensive exam package designed to test the conceptual framework you've emphasized, moving beyond fact recitation and engaging directly with your provocation:

  **(a) Essay Question (Phrased to Demand Conceptual Work):**

  > "**'The question "Did it happen?" obscures more than it illuminates when evaluating traditions like Troy, Arthur, and the Exodus.' Critically evaluate this statement in light of our module's threefold distinction between the Event, Descent, and Datum questions. Using these three cases, argue whether the common scholarly grading of Troy as 'historical', Exodus as 'contested', and Arthur as 'literary' primarily reflects differences in the available evidence concerning Descent, or whether it reflects deeper cultural or methodological biases. What would conclusive evidence for the Event question realistically look like in each case, and why is it so elusive?**"

  **(b) Model Answer (Approx. 780 words):**

  The assertion that "'Did it happen?' obscures more than it illuminates" captures the core methodological challenge in evaluating traditions like Troy, Arthur, and the Exodus. Focusing solely on the **Event Question** (Did the specific narrated events occur?) often leads to intractable debates because the evidence required for definitive answers is typically absent or ambiguous. Instead, the available evidence – archaeological traces, textual references, linguistic shifts, cultural memory patterns – is primarily probative for the **Descent Question** (Is there a causal chain transmitting content from some originating past reality to the later story?) and the **Datum Question** (What does the existence and nature of the story reveal about the societies that told it?). The common scholarly grading of Troy as 'historical', Exodus as 'contested', and Arthur as 'literary' appears, on the surface, to reflect a hierarchy of evidence concerning Descent. However, a closer analysis suggests this grading is significantly influenced by cultural expectations, disciplinary traditions, and the often-unacknowledged substitution of Descent or Datum evidence for claims about the Event itself.

  Consider the evidence. For **Troy**, the Descent evidence is relatively robust *compared to the others*: a destruction layer (VIIa) at Hisarlik roughly within the plausible timeframe, Hittite diplomatic texts mentioning Wilusa (widely accepted as Ilios/Troy) and figures like Alaksandu (potentially Paris/Alexander), and a plausible context of Mycenaean-Anatolian friction. This suggests a *potential* causal chain: conflict involving a significant western Anatolian citadel named Wilusa/Ilios entered cultural memory, eventually feeding into epic traditions. However, this does *not* confirm the Event – the specific war, its cause (Helen), its duration, or its participants (Achilles, Agamemnon). The evidence speaks to context and the *possibility* of a kernel, not the Homeric narrative's historicity.

  The **Exodus** presents a different Descent profile. The Merneptah Stele confirms "Israel" existed in Canaan c. 1208 BCE, but says nothing about origins. The absence of direct Egyptian records of a mass Hebrew slave revolt or departure is significant negative evidence *for the Event as narrated*. The Descent evidence hinges on internal biblical traditions, potential cultural memory of Semitic groups in the Delta (attested archaeologically and textually for centuries), possible links to the Hyksos period (though chronologically problematic), and later Egyptian toponyms mentioned in the Exodus narrative. This suggests the story likely descends from genuine cultural experiences (marginalization, migration, conflict) and perhaps specific historical elements (e.g., memories of Egyptian control or expulsion), woven into a foundational myth. Minimalists often correctly point out that overwhelming evidence addresses the story's development and function (Datum – e.g., forging Israelite identity in the Babylonian exile) rather than the Event, yet maximalists sometimes present evidence for Descent (e.g., plausibility of Semitic slaves) as proof for the Event.

  For **Arthur**, the Descent evidence is the weakest. Post-Roman Britain was chaotic, but there's no contemporary record of Arthur. The earliest references (e.g., *Y Gododdin*, *Historia Brittonum*) are centuries later, vague, and likely legendary accretions. Geoffrey of Monmouth is demonstrably inventive. The Descent chain here is faint: perhaps traditions coalesced around memories of successful Romano-British warlords (Ambrosius Aurelianus is a stronger candidate) resisting Saxon incursions. The evidence primarily illuminates the Datum: the desperate need for a unifying hero figure in later, fragmented British kingdoms, and the evolving literary tradition.

  The grading (Troy=historical, Exodus=contested, Arthur=literary) *seems* to align with the strength of Descent evidence. Troy has tangible archaeology and corroborating external texts; Arthur has neither. Exodus sits ambiguously in between. However, this grading masks the crucial point: **None of them provide conclusive evidence for the specific Event.** Calling Troy "historical" often implicitly substitutes evidence *for a possible kernel of Descent* (a conflict at Hisarlik) for evidence *of the Homeric Event*. The label reflects cultural factors: Troy benefits from Homer's immense prestige, the tangibility of archaeology, and Hittite texts feeling like "hard" evidence. Exodus's "contested" status stems partly from its profound religious significance, driving maximalist efforts, and the ambiguity of the evidence allowing polarized interpretations. Arthur's "literary" tag reflects the lack of contemporary evidence and the clear, late literary fabrication (Geoffrey), but even here, the *possibility* of a kernel for Descent isn't entirely extinguished – it's just far weaker.

  Conclusive evidence for the **Event Question** would require something specific and irrefutable for *each specific narrative*: For Troy, a Hisarlik inscription naming Agamemnon or referencing Helen's abduction; for Exodus, an Egyptian record detailing Moses, plagues, and the drowning of Pharaoh's army matching the biblical account; for Arthur, a contemporary chronicle or inscription detailing his battles and court as later described. Such evidence is elusive because these stories are cultural products shaped over centuries, not verbatim historical reports. The originating events, if any, were likely messy, localized, and contextually different from the epic narratives. The evidence we *do* have illuminates the journey of the story (Descent) and the needs of the storytellers (Datum) far more reliably than the precise historical reality of the Event. Therefore, the common grading, while seemingly evidence-based for Descent, is indeed blurry and culturally influenced, often misleadingly presenting Descent findings as answers to the more alluring, but ultimately less answerable, Event Question. The distinction between the three questions is essential to avoid this confusion.

  **(c) Marking Scheme (Out of 20):**

  *   **A (18-20):** Outstanding, demonstrates mastery of the conceptual framework and applies it rigorously.
  *   **B (16-17):** Very Good, clear understanding and good application, minor omissions or weaker argumentation.
  *   **C (14-15):** Competent, understands core concepts but application is uneven or lacks depth/insight.
  *   **D (12-13):** Pass, some understanding but significant confusion, weak argument, or excessive fact recitation.
  *   **E/F (0-11):** Fail, fundamental misunderstanding, ignores the question, or purely descriptive.

  **Specific Moves for an A Answer (Must Include Most):**
  1.  **Explicitly Defines & Distinguishes:** Clearly defines and rigorously distinguishes between the Event, Descent, and Datum questions early on.
  2.  **Engages the Provocation:** Directly addresses and evaluates the statement that "Did it happen?" obscures understanding, agreeing, disagreeing, or refining it based on the triad.
  3.  **Analyzes Evidence Through Triad Lens:** For each case (Troy, Exodus, Arthur), analyzes the *type* of evidence available (arch, text, cultural) and correctly identifies which question(s) (Event/Descent/Datum) it primarily bears upon. Avoids simply listing evidence without methodological framing.
  4.  **Critiques the Grading:** Explicitly evaluates whether the common grading (Historic/Contested/Literary) is justified *based solely on evidence for Descent*. Argues persuasively for or against the grading being "earned" evidentially.
  5.  **Identifies Cultural/Methodological Bias:** Insightfully identifies specific cultural (e.g., Homer's status, religious significance of Exodus) or methodological (e.g., privileging archaeology over textual criticism, confusion of Descent/Datum with Event) factors influencing the common grading.
  6.  **Addresses Conclusive Evidence for Event:** Thoughtfully discusses what "conclusive evidence" for the *specific Event* would look like in each case and explains *why* such evidence is realistically elusive (centuries of transmission, nature of cultural memory).
  7.  **Synthesizes & Concludes:** Draws a clear, well-supported conclusion about the relationship between the three questions, the validity of the provocation, and the evidentiary/cultural basis of the common grading. Synthesis shows deep understanding.

  **Specific Mistakes Costing Marks:**
  *   **Fact Recitation Without Analysis (Major - Loss of 5+ marks):** Simply listing "no Egyptian evidence for Exodus," "destruction layer at Troy VIIa," "Geoffrey invented Arthur" without linking these facts to the Event/Descent/Datum framework or the essay's conceptual argument.
  *   **Conflating the Three Questions (Major - Loss of 3-5 marks):** Treating evidence for Descent (e.g., Hittite texts mentioning Wilusa) as direct proof for the Event (Homeric Trojan War), or presenting Datum evidence (e.g., Exodus shaping Israelite identity) as settling the Event question.
  *   **Ignoring the Triad Framework (Major - Loss of 4+ marks):** Failing to structure the answer around the Event/Descent/Datum distinction or not using the terminology. Answering a simpler "what evidence is there?" question.
  *   **Uncritically Accepting the Grading (Minor - Loss of 2-3 marks):** Stating that Troy is "historical," Exodus "contested," and Arthur "literary" without analyzing *why* or whether this grading aligns with the Descent evidence as per the triad.
  *   **Weak or Absent Analysis of Bias (Minor - Loss of 1-3 marks):** Failing to explore cultural/methodological reasons beyond pure evidence for the differing perceptions of the three cases.
  *   **Vague Discussion of Conclusive Evidence (Minor - Loss of 1-2 marks):** Giving generic answers ("more documents") instead of case-specific, historically plausible examples of what would settle the Event question.
  *   **Poor Structure or Lack of Conclusion (Minor - Loss of 1-2 marks):** Disorganized argument or missing a clear synthesis tying the threads together.

  **The "Well-Read Student Trap":**
  *   **The Mistake:** Citing **Papyrus Ipuwer** (or similar texts like the "Admonitions of Ipuwer") as potential Egyptian evidence *for the historicity of the Exodus plagues*. A well-read student might know this text describes chaos, famine, blood in the river, etc., and resembles some plague descriptions.
  *   **Why it Costs Marks (2-3 marks):** This demonstrates a classic **conflation of Descent/Datum with Event** and a **misunderstanding of chronology/context**. Papyrus Ipuwer is widely dated to the Middle Kingdom or Second Intermediate Period (c. 1800-1600 BCE or earlier), centuries *before* the standard Exodus dates (13th-12th Century BCE). It describes *generalized societal collapse*, not a specific event targeting Hebrew slaves. While it *might* potentially belong to the *cultural milieu* influencing the *literary formation* of the Exodus story centuries later (i.e., **Descent** or **Datum** - showing Egyptians had tropes about chaos/natural disasters), it is categorically *not* evidence for the *Event* of the Exodus happening as described in the 13th/12th century. Citing it as such shows a failure to apply the critical temporal and contextual analysis demanded by the triad framework.
