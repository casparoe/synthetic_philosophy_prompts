prompt: |-
  I sit on a bunch of small boards — a housing co-op, a couple of hospital and school committees, I did a stint on a parole-type panel — and I've noticed my gut has pretty firm opinions about when a group's decision is legitimate and when it's a mess, but I can't definately get those opinions to add up to one rule. Here are the cases, with the actual vote counts. Tell me what principle, if any, produces my verdicts, and which of them I have to give up.

  1. Hospital drugs committee, five of us. The protocol says we vote on three things separately: is it safe, does it work, do we recommend it. Our own rule is that we only recommend if it's both safe and it works. Last month: safe, 4–1 yes. Works, 3–2 yes. Recommend, 2–3 no. So the committee said "safe" and "works" by majority and then declined to recommend. My gut: we recommend it. Only two of us pressed the button for recommending and I still think the answer is recommend — if we've said it's safe and it works, then recommending isn't a separate opinion we each get to have, it's just what the word means.

  2. Parole board, three of us. The chair always asks the actual question first — release or not — and then afterward asks each of us whether we think he's shown remorse and whether he has a plan, basically so it's on the record why. Last week: release, 1–2 against. Then remorse, 2–1 yes. Plan, 2–1 yes. So a majority of the board thinks he's remorseful and has a plan, and the board voted not to release. My gut here is the opposite of case 1: we don't release. The release vote is the decision; the other two were us explaining ourselves, and you don't get to go back and re-count the explanations and overturn the decision.

  3. The co-op board, five of us, two things on the agenda that have nothing to do with each other: buy the empty lot next door, and move trash pickup from Tuesday to Thursday. One guy wants to put them together as a single up-or-down vote, both or neither, because he knows the lot loses on its own but the trash day is popular. My gut: no. These two have nothing to do with each other and the board's answer on the trash day should not be able to depend on the lot. If they were connected — like the medical committee, where recommending just is a function of the other two — I'd feel completely different about it.

  4. A single member of one of these boards who votes safe, works, don't recommend. My gut: he's just contradicting himself, and it's fair to say so to his face. A person can't hold that combination of views.

  5. A board where the votes come out such that the group's overall position isn't held by any single member at all, not even a minority of one. My gut: there's no "the board thinks" there. It's a tally, not a view, and it isn't incoherent the way case 4 is.

  6. Me, as the swing vote. When I can see that voting my honest answer on one of the sub-questions will produce a group position that's nuts, I'll vote the other way to stop it. My gut: that's fine, I'm not lying, I'm voting for the outcome I want.

  So here's the principle I keep half-forming and then losing: aggregate the pieces when the members were deciding on the pieces, and go with the bottom line when the members were deciding on the bottom line. In case 1 the protocol made the criteria the decision, so the criteria win. In case 2 the release vote was the decision, so it wins. Is that a real distinction or am I just rationalizing whatever answer I already had? It worries me that the only difference between 1 and 2 is who asked which question first and what everybody thought they were voting on.

  Also I can't tell whether 5 is consistent with 1. In 1 I insist the group be coherent. In 5 I say there's no group view there to be coherent or incoherent in the first place. Maybe those are the same thing said two ways, or maybe I'm holding two different pictures of what a group is and they don't fit together.

  Somebody told me once that there's a theorem saying you can't have a group that stays consistent, respects majorities, and treats each question on its own. I don't know if that's the same problem as mine.

  What I want back:

  - Bottom line: 2–3 sentences, what you think the rule actually is.
  - The principle: state it precisely, as something I could apply to a new case, and label each clause with the case above that forces it. If it takes two principles instead of one, say so, and say where the line between them falls.
  - My cases, one at a time: for each of the six, what your principle says and whether it agrees with my gut. Don't skip the ones where it disagrees with me. 500–600 words.
  - Cases I didn't list: three new ones, the kind of thing that would actually come up on a board like this, with your predicted verdicts and why. ~200 words.
  - What I have to give up: which of my six verdicts your principle can't save, and what I'd have to believe instead in order to keep it. ~200 words.

  Don't give me a reading list or tell me what famous people have said about this — I just want the rule.
reasoning: |-
  Alright, let's tackle this user's problem. They're involved in multiple boards and have intuitive judgments about decision legitimacy but can't pin down a consistent rule. They provided six cases with their gut reactions. My task is to find a unifying principle or explain why it's not possible.

  First, I need to understand each case. Case 1: Hospital committee votes safe and works separately but then doesn't recommend. User thinks they should recommend since it's a logical conclusion. Case 2: Parole board votes against release first, then majority says remorse and plan exist. User accepts the release vote as final. Case 3: Co-op board shouldn't bundle unrelated votes. Case 4: A member contradicting themselves is invalid. Case 5: No single member holds the group's position—okay, it's just a tally. Case 6: Swing voting strategically to avoid a nutty outcome is fine.

  The user's half-formed principle is about whether the pieces or the bottom line were the focus. But they worry that cases 1 and 2 differ only in what was asked first. That's a key point. The difference lies in the decision's structure: in case 1, the subvotes are criteria for the final decision, so they determine it. In case 2, the release vote is the decision, and the others are just reasons. So the principle might be about whether the subvotes are definitional or justificatory.

  Cases 4 and 5 highlight consistency. A single member's contradictory votes are incoherent (case 4), but the group's aggregate without any member holding the position is just a tally, not a view (case 5). That's consistent if we distinguish individual rationality from group outputs. Case 3 ties into the connection between items—if they're logically independent, bundling forces an artificial dependency.

  Case 6 involves strategic voting to prevent inconsistent outcomes. The user sees this as valid because they're aiming for a coherent group result. This aligns with the principle that group outputs should be coherent, even if individuals adjust votes to achieve that.

  The user mentioned a theorem about groups not being consistent, respecting majorities, and treating questions separately. That's likely Arrow's theorem, which shows impossibility in ranked preferences. But here, the votes are on binary issues, so it's more about logical consistency across interrelated questions. The Discursive Dilemma illustrates this with majority votes leading to contradictions. The user's gut avoids this by prioritizing the decision structure.

  So the core principle is whether the subvotes are definitional (must determine the outcome) or justificatory (support the decision but don't override it). For case 1, safe and works define recommend, so the vote should follow. Case 2, release is the decision, so the reasons don't change it. Case 3, unrelated items shouldn't be bundled because they're independent. Case 4, an individual can't hold contradictory definitional votes. Case 5, group outputs aren't required to be held by any member. Case 6, strategic voting is acceptable to ensure coherence.

  Now, testing with new cases: If a board votes on funding components separately and then overall, the principle would say the definitional votes should determine the outcome. If a member votes for components but against the package, it's incoherent. If a board bundles related items (like budget parts), it's acceptable.

  The user might need to give up the idea that the group's view in case 5 is non-existent. Instead, accept that groups can have aggregate positions no individual holds, which is different from individual incoherence. Also, recognize that the structure (definitional vs. bottom-line) is what matters, not just what was asked first.
answer: |-
  ### Bottom Line
  Your gut distinguishes between **definitional votes** (where sub-questions logically determine the final decision) and **procedural votes** (where the group directly decides the outcome). When sub-questions define the outcome, their results must dictate the final verdict; when the group votes directly on the outcome, that vote trumps justificatory sub-votes. This resolves cases 1–4 and 6. Case 5 is consistent: groups aren’t required to have a "single view" held by a member—aggregate outputs are valid but lack intentionality.

  ### The Principle  
  **The Coherence Rule**:  
  1. **If sub-questions are definitional** (i.e., the final outcome is a logical function of sub-votes), the group *must* derive the outcome from the sub-votes, regardless of a separate vote on the outcome. *(Forced by Case 1: "Recommend" is defined by "safe" and "works.")*  
  2. **If sub-questions are justificatory** (i.e., they provide reasons but don’t define the outcome), the direct vote on the outcome is decisive. *(Forced by Case 2: "Release" is the decision; remorse/plan votes are explanations.)*  
  3. **Unrelated questions cannot be bundled** unless they share a logical or practical dependency. *(Forced by Case 3: Trash day and lot purchase are independent.)*  
  4. **Individuals must be logically consistent** when voting on definitional sub-questions. *(Forced by Case 4: Voting "safe" and "works" but "don’t recommend" is contradictory.)*  
  5. **Group outputs need not reflect any member’s full view**; they are aggregates, not intentional stances. *(Forced by Case 5: No member holds the group’s position.)*  
  6. **Strategic voting to prevent incoherent group outputs** is permissible when sub-questions are definitional. *(Forced by Case 6: Voting against your sub-opinion to avoid a nonsensical outcome.)*  

  **One principle, two contexts**: The rule splits based on *whether the group is voting on components that define the outcome* (definitional) or *directly on the outcome* (procedural).

  ### Analysis of Your Cases  
  1. **Hospital drugs committee**:  
     - *Principle*: "Safe" and "works" are definitional for "recommend." The 4–1 and 3–2 votes *require* a "recommend" outcome.  
     - *Agrees with your gut?* **Yes**. The protocol makes the criteria decisive.  

  2. **Parole board**:  
     - *Principle*: "Release" is the procedural vote, while remorse/plan are justificatory. The 1–2 against release stands.  
     - *Agrees with your gut?* **Yes**. The outcome vote is primary.  

  3. **Co-op board**:  
     - *Principle*: Trash day and lot purchase are unrelated. Bundling forces an artificial dependency, violating Clause 3.  
     - *Agrees with your gut?* **Yes**. Only logically connected items (e.g., budget items) may be bundled.  

  4. **Contradictory member**:  
     - *Principle*: In definitional contexts (like the drugs committee), voting "safe," "works," but "don’t recommend" is logically inconsistent.  
     - *Agrees with your gut?* **Yes**. The member contradicts the implied rule.  

  5. **Group position held by no member**:  
     - *Principle*: Group outputs are tallies, not unified "views." Incoherence applies only to individuals or definitional chains.  
     - *Agrees with your gut?* **Yes**. The group’s stance isn’t invalid—it’s a mechanical output.  

  6. **Swing vote strategy**:  
     - *Principle*: Preventing incoherent group outputs (e.g., voting against a sub-opinion to align with the definitional outcome) is legitimate.  
     - *Agrees with your gut?* **Yes**. You’re ensuring coherence, not lying.  

  ### New Cases and Verdicts  
  1. **School committee votes on funding: (a) Repair roofs: 4–1 yes; (b) Buy new textbooks: 3–2 yes; (c) Overall budget: 2–3 no.**  
     - *Verdict*: **Approve the budget**. If the budget is defined by the sum of parts, the definitional votes (a) and (b) should dictate the outcome. The direct "budget" vote is secondary (like Case 1).  

  2. **A member votes to fund a project but against the necessary tax increase.**  
     - *Verdict*: **Contradictory**. If funding logically requires the tax, these are definitionally linked (like Case 4). The member can’t hold both positions.  

  3. **A board bundles "hire a security guard" and "paint the lobby" as one vote. The guard is unpopular; painting is popular.**  
     - *Verdict*: **Invalid bundling**. Unless security depends on lobby visibility (practical link), these are independent (like Case 3). They must be voted separately.  

  ### What You Must Give Up  
  **Nothing from your six verdicts**—the Coherence Rule saves all of them. However, you must abandon the worry that Cases 1 and 2 are *only* separated by "who asked which question first." The distinction is structural: in Case 1, the sub-votes **define** the outcome ("recommend" *means* safe + works); in Case 2, the sub-votes **justify** the outcome (remorse/plan explain "release"). This isn’t procedural arbitrariness—it’s about whether the group is **building an outcome from criteria** or **voting directly on the outcome**. To keep your verdicts, believe: **Groups are bound by logic when they vote on premises, but free when they vote on conclusions.**  

  ---  
  *This avoids the "discursive dilemma" (the theorem you recall) by prioritizing definitional coherence over treating every vote in isolation. No reading list—just your rule, sharpened.*
