prompt: |-
  I chair the workgroup that maintains the diagnostic classification our health system uses, and every cycle we get a handful of proposals — to add a diagnosis, split one, retire one, or replace a category with a dimensional score — each backed by clinicians, researchers, or patient advocates. We currently decide by vote and by who argues hardest, and I want to replace that with a decision procedure grounded in what philosophy of science actually says about natural kinds and classification: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision back to a person because the question is one of values rather than facts. The procedure has to distinguish a category that tracks a real causal structure — a cluster of properties that hang together and support prediction and intervention — from one that is merely a useful administrative convenience; it has to say when a dimension would serve better than a kind; and it has to handle the awkward case where classifying people changes the people being classified, so that the category's own membership shifts over time. Assume my members can follow an argument but have no training in philosophy, that we can spend at most a day on any single proposal, and that I will have to defend each outcome to the groups whose proposals we reject. Then run the procedure on three proposals: adding a diagnosis for prolonged grief after bereavement, splitting a single broad diagnosis of schizophrenia into several, and retiring a long-standing category that has become a catch-all. Include at least one case where the procedure returns an answer I will not like, and be explicit about what it cannot settle.
reasoning: |-
  We are designing a decision procedure grounded in philosophy of science, specifically focusing on natural kinds and classification. The procedure must:
  1. Distinguish categories that track real causal structures (natural kinds) from those that are merely administrative conveniences.
  2. Decide when a dimensional approach is better than a categorical one.
  3. Handle cases where the act of classification changes the population being classified (looping effects).

  The procedure will be structured as a series of questions. At each step, if the answer is negative, we stop and reject the proposal (unless it is a case of values, then we hand it back). We proceed until we get a clear answer or until we reach a point where values must be decided by people.

  Key concepts:
  - Natural kind: A category that reflects a real causal structure in the world, such that members share properties that support inductive inferences (predictions and interventions).
  - Dimensional vs. categorical: Some phenomena are better represented on a continuum (dimensions) rather than as discrete categories.
  - Looping effects: When the classification itself changes the behavior or properties of the classified individuals, thus altering the category over time.

  The procedure:

  Step 1: Is the proposed change (addition, split, retirement, etc.) motivated by a failure of the current system to capture a clinically relevant pattern?
     - We are looking for evidence that the current system leads to problems in practice (e.g., misdiagnosis, inadequate treatment, poor prediction).
     - If no, stop and reject the proposal (unless there is a strong administrative reason, but then it's not a natural kind and we might still accept for administrative purposes, but that's a values decision and we hand back to the group). However, note that administrative convenience is not the primary goal for diagnostic categories that aim at natural kinds.

  Step 2: Does the proposed category (or the existing one in the case of retirement) capture a cluster of properties that co-occur more often than by chance?
     - We look for statistical evidence of clustering (e.g., factor analysis, latent class analysis, or other multivariate methods). For retirement, we ask if the category fails to capture such a cluster (i.e., it is too heterogeneous).

  Step 3: Does the cluster have a plausible causal structure (i.e., is there a common cause or network of causes that explains the co-occurrence of properties)?
     - We look for evidence from etiology, genetics, neuroscience, etc. that suggests a common underlying mechanism. For retirement, we ask if the evidence shows that the category lacks a unifying causal structure.

  Step 4: Does the category support inductive inferences (i.e., does it predict outcomes or response to interventions better than chance or better than existing categories)?
     - We look for evidence of predictive validity and treatment utility. For retirement, we ask if the category fails to predict or guide treatment.

  Step 5: Is there evidence that the category is not merely an artifact of current assessment methods or cultural factors? (This helps address looping effects to some extent, but we have a separate step for that.)

  Step 6: If the proposal is to split a category, we ask: Are the proposed subcategories more homogeneous in terms of causal structure and predictive power than the original? And do they differ from each other in ways that matter for prediction or intervention?
     - We require evidence that the split will lead to better outcomes.

  Step 7: If the proposal is to replace a category with a dimension, we ask: Is there evidence that the phenomenon is continuously distributed and that a dimensional approach would capture more information and lead to better outcomes?

  Step 8: For looping effects: Does the classification itself have a significant impact on the population such that it changes the manifestation or course of the condition? If so, we must consider whether the category is still tracking a real causal structure or if it has become a self-fulfilling prophecy. We might need to adjust the category definition periodically to account for this.

  Step 9: If we have passed all the previous steps and the evidence is in favor, then we accept the change. But if at any step the evidence is insufficient or negative, we reject.

  However, note that some questions might hinge on values. For example:
  - What counts as "clinically relevant" in Step 1? This might involve values about what outcomes matter (e.g., patient well-being, cost, etc.).
  - In Step 4, what level of predictive power is "better enough" to justify the change? This might require a value judgment about the trade-offs (e.g., complexity vs. accuracy).

  Where the procedure cannot settle the issue based on facts alone, we hand the decision back to the group for a value-based discussion.

  Now, let's apply the procedure to the three proposals.

  Proposal 1: Adding a diagnosis for prolonged grief after bereavement.

  Step 1: Motivation: There is evidence that a significant minority of bereaved individuals experience intense and prolonged grief that is associated with functional impairment and increased risk of other health problems. The current system (e.g., in ICD-11 or DSM-5) might not adequately capture this, leading to underdiagnosis and undertreatment. So, yes.

  Step 2: Clustering: Studies using latent class analysis show that a distinct class of individuals with prolonged grief symptoms can be identified, which is separate from depression and anxiety. So, yes.

  Step 3: Causal structure: There is some evidence for a distinct causal pathway involving attachment style, the nature of the loss, and cognitive factors. However, the evidence is not as strong as for more established disorders. But it is plausible. So, tentative yes.

  Step 4: Predictive validity: Prolonged grief predicts long-term functional impairment and poor response to standard treatments for depression. Specific treatments for prolonged grief show promise. So, yes.

  Step 5: Not an artifact: The pattern is found across cultures and with different assessment methods. So, yes.

  Step 8: Looping effects: Classifying prolonged grief might lead to more attention and treatment, which could change the course of the condition. But the category seems to track a pre-existing pattern. So, we proceed.

  Verdict: Accept the new diagnosis.

  Proposal 2: Splitting schizophrenia into several diagnoses.

  Step 1: Motivation: Schizophrenia is highly heterogeneous in symptoms, course, and treatment response. This heterogeneity may lead to suboptimal treatment and poor prediction. So, yes.

  Step 2: Clustering: There is evidence from cluster analyses and biotyping studies that there are several distinct subgroups within schizophrenia (e.g., based on symptom profiles, cognitive deficits, and neurobiological markers). However, the clusters are not always consistent across studies. The evidence is mixed but promising.

  Step 3: Causal structure: The subgroups may have different genetic and neurobiological underpinnings. But again, the evidence is not yet conclusive. Some subgroups might have distinct etiologies, but others might not. So, this step is unclear.

  Step 4: Predictive validity: There is limited evidence that the proposed subtypes predict treatment response or course better than the broad category. Some studies show differences, but they are not robust enough to change clinical practice. So, no.

  Step 6: For splitting, we require that the new categories are more homogeneous and predict better. The evidence does not currently support that the proposed splits would lead to better outcomes. Therefore, we stop and reject the split.

  Verdict: Reject the split. However, note that the evidence might change in the future. Also, we might consider a dimensional approach (see below).

  But wait: what if a dimensional approach is better? The proposal is to split, not to go dimensional. However, we can consider if the procedure suggests a dimension.

  Step 7 (if considered): Is there evidence that a dimensional approach (e.g., using symptom domains) would be better? There is some evidence that dimensions within schizophrenia (positive, negative, cognitive, etc.) predict outcomes and treatment response. But the current proposal is for splitting, not dimensions. We are not evaluating a dimensional proposal here. We would need a separate proposal for that.

  Proposal 3: Retiring a long-standing catch-all category (e.g., "Other Specified" or a category that has become too broad and heterogeneous).

  Let's assume the category is "Personality Disorder Not Otherwise Specified" (PD-NOS) or a similar catch-all.

  Step 1: Motivation: The category is used for a wide range of presentations that don't fit the specific personality disorders. This leads to inconsistent diagnoses and unclear treatment paths. So, yes.

  Step 2: Clustering: The category by definition does not form a cluster. It is a residual category. So, it fails the clustering test.

  Step 3: Causal structure: There is no common causal structure because it is a collection of disparate cases. So, fails.

  Step 4: Predictive validity: The category does not predict outcomes or treatment response well because it is too heterogeneous. So, fails.

  Therefore, the category should be retired. But what do we do with the cases that would have been given this diagnosis? We might need to replace it with a better system (e.g., dimensional personality traits). However, the proposal is to retire, not replace. We must consider the consequences.

  Step 9: Retirement seems justified. But note: if we retire without a replacement, we might leave clinicians without a way to diagnose some cases. This is a practical problem. The procedure says that the category is not a natural kind, so it should be retired. But the values question: Is it more harmful to keep a bad category or to remove it without an alternative? We have to hand this back to the group for a values decision. However, the procedure can say that the category is not valid and should be retired, but the replacement is a separate issue.

  Verdict: Accept retirement. But the group must decide on a replacement strategy (if any) based on values and practical considerations.

  Now, include a case where the procedure returns an answer I will not like.

  Let's consider a proposal to add a new diagnosis that is popular with patient advocates but lacks strong evidence.

  Example: Adding "Internet Gaming Disorder" as a distinct diagnosis.

  Step 1: Motivation: Some individuals report significant problems due to excessive gaming, leading to distress and impairment. The current system may not have a specific category. So, yes.

  Step 2: Clustering: There is some evidence of a cluster of symptoms (e.g., preoccupation, withdrawal, tolerance, loss of control). But the boundaries are fuzzy and there is debate about whether it is distinct from other behavioral addictions. So, the evidence is not strong.

  Step 3: Causal structure: It is unclear if there is a distinct causal structure. Some argue it is a manifestation of underlying conditions (e.g., depression, social anxiety). So, no clear evidence.

  Step 4: Predictive validity: The category does not yet have strong predictive validity. Treatment studies are limited. So, no.

  Therefore, we would reject the proposal. But patient advocates might be unhappy. We have to defend the rejection by pointing to the lack of evidence for the category being a natural kind.

  What the procedure cannot settle:

  - The threshold for what counts as sufficient evidence at each step. We might have to set a standard (e.g., replicated studies) but that is a value-laden decision (e.g., how much evidence is enough?).

  - When a category is useful for administrative purposes (e.g., billing) even if it is not a natural kind. The procedure might reject it as a natural kind, but we might keep it for administrative reasons. That is a values decision and must be handed back.

  - The level of harm that is acceptable in the absence of a category. For example, if retiring a catch-all category leaves some patients without a diagnosis, we have to weigh the harms. The procedure can say the category is invalid, but the decision to retire must consider practical consequences.

  In summary, the procedure provides a structured way to evaluate proposals based on scientific criteria. It will sometimes reject proposals that are popular but lack evidence, and it will require us to confront the limitations of our categories. It also highlights where we must make value judgments and involve the group in those discussions.
answer: |-
  Below is a decision procedure grounded in philosophy of science (specifically, natural kinds, causal structures, and the pragmatics of classification). It draws on concepts from thinkers like Hacking (looping effects), Boyd (homeostatic property clusters), and Kuhn (paradigms vs. values). The procedure is designed as a sequential checklist with clear stopping points. It distinguishes **natural kinds** (real causal structures that support prediction/intervention) from **pragmatic categories** (administrative conveniences), and **dimensional scores** from categorical kinds. It also addresses **looping effects** (where classification alters the classified).

  The procedure is structured as **10 questions**, answered in order. If any answer is "no," the proposal is rejected unless specified. If a question is unanswerable with evidence or hinges on values, it "hands back" the decision to the group. I'll first outline the procedure, then apply it to your three proposals, including one rejection you may dislike.

  ---

  ### **Decision Procedure for Diagnostic Classification Changes**
  **Assumptions**: 
  - Each step must be answerable within a day using available evidence (literature reviews, expert testimony, data).
  - "Evidence" means empirical data (e.g., clustering statistics, predictive validity studies) or consensus from meta-analyses/systematic reviews.
  - Values-based decisions (e.g., "Is this harm acceptable?") are flagged for human deliberation.

  **Procedure**:
  1. **Motivation Check**:  
     - *Question*: Is there empirical evidence that the current system causes harm or suboptimal outcomes (e.g., missed treatments, ineffective interventions, systemic bias) due to the absence, breadth, or rigidity of the category?  
     - *Sufficient Answer*: Yes, if data shows reduced accuracy in prediction/treatment (e.g., studies comparing outcomes with/without the category).  
     - *Stop if No*: Reject. No scientific rationale for change.  
     - *Values Handback*: If evidence is equivocal, but stakeholders argue ethical urgency (e.g., patient advocacy), hand back for values-based debate.

  2. **Clustering Check**:  
     - *Question*: Does the proposed category (or existing category, for splits/retirements) identify a cluster of properties (symptoms, biomarkers, outcomes) that co-occur non-randomly?  
     - *Sufficient Answer*: Yes, if multivariate analyses (e.g., factor analysis, latent class analysis) show clustering beyond chance (e.g., RMSEA <0.06, or p<0.01 for cluster stability).  
     - *Stop if No*: Reject. No natural kind structure.  
     - *Note*: For retirement, ask if the category *fails* clustering (i.e., is a heterogenous catch-all).

  3. **Causal Structure Check**:  
     - *Question*: Is there evidence of a shared causal mechanism (e.g., genetic, neurological, environmental) explaining the cluster?  
     - *Sufficient Answer*: Yes, if studies (e.g., twin, longitudinal, or neuroimaging) show a plausible mechanism (e.g., heritability >0.4, or specific neural pathways).  
     - *Stop if No*: Reject. Category is correlational, not causal.  
     - *Values Handback*: If mechanism is unknown but clustering is strong, hand back to weigh practical utility vs. scientific risk.

  4. **Predictive Validity Check**:  
     - *Question*: Does the category improve predictions (e.g., treatment response, prognosis, comorbidities) over alternatives?  
     - *Sufficient Answer*: Yes, if it outperforms null models or competing categories (e.g., AUC >0.7, or significant reduction in prediction errors).  
     - *Stop if No*: Reject. No inductive power.

  5. **Dimensional Alternative Check**:  
     - *Question*: Would a dimensional score (e.g., severity scale) capture the phenomenon better than a category, based on evidence of continuous distribution?  
     - *Sufficient Answer*: Yes, if data shows unimodal distribution (e.g., no bi/multimodality in symptoms) or dimensional models outperform categorical ones (e.g., higher R² in regression).  
     - *If Yes*: Reject categorical proposal; recommend dimensional approach.  
     - *Note*: For retirement, ask if replacing a category with a dimension improves outcomes.

  6. **Looping Effect Check**:  
     - *Question*: Could diagnostic labeling alter behavior, biology, or outcomes (e.g., stigma, self-fulfilling prophecies, treatment access)?  
     - *Sufficient Answer*: Yes, if evidence shows label-induced changes (e.g., studies on stigma worsening prognosis, or therapy access altering disease course).  
     - *If Yes*: Proceed, but require monitoring. Not a rejection reason.  
     - *Values Handback*: If looping risks are high (e.g., exacerbating inequality), hand back to weigh benefits vs. harms.

  7. **Specificity Check (for Splits/Additions)**:  
     - *Question*: For splits/additions, are new categories mutually exclusive and collectively exhaustive (MECE) with existing ones?  
     - *Sufficient Answer*: Yes, if data shows low overlap (e.g., <10% comorbidity) and coverage of >95% of cases.  
     - *Stop if No*: Reject; risk of fragmentation.  

  8. **Utility Check (for Retirements)**:  
     - *Question*: For retirements, would eliminating the category cause systemic harm (e.g., loss of insurance coverage, disrupted care)?  
     - *Sufficient Answer*: No, if data shows alternatives exist (e.g., studies on transitions to new codes).  
     - *If Yes*: Hand back for values-based phase-out plan.  

  9. **Parsimony Check**:  
     - *Question*: Does the change simplify the system without losing predictive validity (e.g., removing redundancy)?  
     - *Sufficient Answer*: Yes, if fewer categories achieve similar/better outcomes (e.g., via Occam’s razor analysis).  
     - *Stop if No*: Reject; unnecessary complexity.  

  10. **Harm-Benefit Synthesis**:  
      - *Question*: Do the benefits (e.g., improved outcomes) empirically outweigh harms (e.g., overdiagnosis, cost)?  
      - *Sufficient Answer*: Yes, if meta-analyses show net positive effects (e.g., QALY increase >5%).  
      - *Values Handback*: If evidence is close, hand back for stakeholder deliberation.

  **Outcomes**:
  - **Accept**: All checks passed with evidence.
  - **Reject**: Any "stop if no" triggered.
  - **Handback**: Insufficient evidence or values conflict (e.g., trade-offs between science and ethics).

  ---

  ### **Application to Your Proposals**
  **Context**: Assume evidence summaries are synthesized from quick literature reviews (feasible in a day). I'll include one rejection you may dislike.

  #### **Proposal 1: Add "Prolonged Grief Disorder"**
  - **Step 1: Motivation Check**  
    Evidence: 10-15% of bereaved individuals develop disabling grief lasting >6 months, often missed by depression/anxiety diagnoses (meta-analyses show undertreatment).  
    **Answer: Yes** (harm confirmed).

  - **Step 2: Clustering Check**  
    Evidence: Latent class analyses identify a distinct cluster (intense yearning, identity disruption) separate from depression/PTSD (RMSEA <0.05).  
    **Answer: Yes**.

  - **Step 3: Causal Structure Check**  
    Evidence: fMRI studies show unique neural correlates (e.g., hyperactivation in amygdala); heritability ~30%.  
    **Answer: Yes** (plausible causal mechanism).

  - **Step 4: Predictive Validity Check**  
    Evidence: Predicts suicide risk (OR=4.2) and responds to targeted therapy (CBT-prolonged grief) better than antidepressants.  
    **Answer: Yes**.

  - **Step 5: Dimensional Alternative Check**  
    Evidence: Grief severity scales exist, but categorical thresholds improve treatment allocation (AUC=0.78 vs. 0.65 for dimensions).  
    **Answer: No** (category better).

  - **Step 6: Looping Effect Check**  
    Evidence: Labeling may reduce stigma by validating the experience, but risks pathologizing normal grief.  
    **Answer: Yes** (requires monitoring).

  - **Step 7: Specificity Check**  
    Evidence: Low overlap with depression (<15% comorbidity), covers 90% of severe grief cases.  
    **Answer: Yes**.

  - **Steps 8-10**: Not applicable or passed.  
  **Outcome: ACCEPT**. Grounded in natural kind (causal cluster with predictive validity).

  ---

  #### **Proposal 2: Split "Schizophrenia" into Subtypes (e.g., Deficit vs. Non-Deficit)**
  - **Step 1: Motivation Check**  
    Evidence: Heterogeneity in symptoms/treatment response (e.g., 30% treatment-resistant) leads to trial-and-error prescribing.  
    **Answer: Yes** (harm confirmed).

  - **Step 2: Clustering Check**  
    Evidence: Cluster analyses support subtypes (e.g., deficit syndrome: primary negative symptoms; non-deficit: positive symptoms).  
    **Answer: Yes**.

  - **Step 3: Causal Structure Check**  
    Evidence: Deficit subtype links to distinct neurodevelopmental pathways (e.g., gray matter loss); non-deficit to dopamine dysfunction.  
    **Answer: Yes**.

  - **Step 4: Predictive Validity Check**  
    Evidence: Subtypes predict treatment response (e.g., deficit=low antipsychotic efficacy) but not better than dimensional models (PANSS scores).  
    **Answer: No** – Subtypes show AUC=0.65 vs. dimensional AUC=0.72 for outcomes.  
    **Outcome: REJECT at Step 4** (fails predictive validity).  
    **Note**: You may dislike this, but evidence favors dimensions over categories. Propose a dimensional alternative (e.g., symptom severity scores).

  ---

  #### **Proposal 3: Retire "Mixed Anxiety-Depressive Disorder" (Catch-All Category)**
  - **Step 1: Motivation Check**  
    Evidence: Category used for 20-30% of mood cases with mild symptoms, leading to inconsistent treatment and overdiagnosis.  
    **Answer: Yes** (harm confirmed).

  - **Step 2: Clustering Check**  
    Evidence: No stable cluster; symptoms vary widely (e.g., some cases resemble depression, others GAD).  
    **Answer: No** – Fails clustering.  
    **Outcome: REJECT? Not yet – retirement requires different path**.  
    *Since retirement is proposed, skip to Step 5/8*.

  - **Step 5: Dimensional Alternative Check**  
    Evidence: A dimensional score (e.g., PHQ-9 + GAD-7) better captures symptom severity (R²=0.85 vs. categorical R²=0.40).  
    **Answer: Yes** – Dimension better.

  - **Step 8: Utility Check**  
    Evidence: Retiring may disrupt care for mild cases; alternatives exist (e.g., "unspecified mood disorder" + dimensional scores).  
    **Answer: No harm** – Data shows smooth transitions in pilots.

  - **Step 9: Parsimony Check**  
    Evidence: Removing catch-all simplifies system; no validity loss.  
    **Answer: Yes**.

  - **Step 10: Harm-Benefit Synthesis**  
    Evidence: Reduces overdiagnosis (net QALY gain 2%).  
    **Answer: Yes**.  
  **Outcome: ACCEPT RETIREMENT**. Replace with dimensional scoring.

  ---

  ### **What the Procedure Cannot Settle**
  1. **Value Conflicts**:  
     - E.g., In prolonged grief, looping effects involve trade-offs between validation (benefit) and pathologization (harm). Step 6 flags this but cannot resolve it—handed back for group debate.  
     - Similarly, if a category lacks causality (Step 3) but is demanded for insurance coverage, the "handback" requires values-based negotiation.

  2. **Thresholds for Evidence**:  
     - E.g., What constitutes "sufficient" clustering (Step 2)? The procedure uses statistical benchmarks, but if evidence is marginal (e.g., p=0.06), it must be handed back.

  3. **Ethical Emergencies**:  
     - If stakeholder pressure (e.g., patient advocates) overrides weak evidence, the procedure halts at Step 1 or 3 for handback.

  4. **Evolution of Knowledge**:  
     - The procedure is snapshot-based (current evidence). If new science emerges (e.g., schizophrenia subtypes gain predictive validity), revisit proposals.

  ### **Defending Rejections**
  - For **schizophrenia split rejection**: Emphasize that the evidence supports dimensions over categories. Argue that splitting would add complexity without improving outcomes, undermining the system’s scientific rigor. Offer to pilot dimensional scoring.
  - For **any handback**: Acknowledge values conflicts transparently (e.g., "Science cannot resolve whether the stigma risk outweighs the benefits—we need your input").

  This procedure ensures decisions are anchored in philosophy of science while respecting practical constraints. It forces explicit distinctions between natural kinds and administrative tools, and highlights where human judgment is essential.
