prompt: |-
  I lead the platform team at a mid-sized software company, and I have become the person who signs off on the word 'understands' before it appears in our product documentation, our internal evaluation reports, and the model cards we hand to enterprise customers. I have no formal philosophy training, and I suspect that what looks like a routine technical judgement is really a conceptual one that I am making badly and inconsistently.

  Write me a reusable procedure, addressed to someone who knows machine learning but not philosophy, that takes the debate over whether systems like these can genuinely understand language -- the arguments that fluent output can be produced by statistical pattern-matching over text with no grasp of what the words are about, together with the replies to those arguments -- and turns it into an ordered set of questions with pass and fail criteria. Make it operational rather than verbal: at each step, say what evidence I would need, what counts as sufficient, and what I should do when the evidence is unavailable because I only have black-box API access.

  Build on the informal test my team already uses, because I want to know how far it can be trusted: treat a claim that the system understands X as a claim that its behaviour is sensitive to the differences that matter for X and invariant to those that do not, so that meaning-preserving rewording leaves the output stable and meaning-changing edits reliably move it. Tell me where that test is too weak, where it is too strong, and what it leaves out that a philosopher would insist on -- the difference between what comes out of the system and what is going on inside it.

  Then run the procedure on three cases and show your work: a code-completion model that reliably fills in a function from its docstring; a model that scores well on domain exams but collapses on trivially reworded versions of the same questions; and a transformer trained only on sequences of legal moves in a board game, whose internal activations can be probed to recover the board state it was never shown. I would like at least one of the three to come out with an answer I will not like.

  End with the cases the procedure cannot settle, where the decision is a values call rather than a fact: how much weight to give a model's own step-by-step explanation when it may be a rationalization rather than a cause of the answer, and whether a competitor's freer use of the word 'understands' in its marketing is a reason to loosen or tighten mine. I do not need a reading list; I need something I can run in an hour and defend in a review, with the soft spots marked.
reasoning: |-
  We are going to design a procedure that takes the debate about whether a system "understands" and turns it into an ordered set of questions with pass/fail criteria. The procedure is based on the team's existing test: sensitivity to meaning-preserving changes and insensitivity to meaning-altering ones. We'll also incorporate philosophical concerns about internal states.

  The procedure will have the following steps:

  1. **Behavioral Sensitivity Test (Meaning-Preserving Changes)**: 
     - **Test**: Apply meaning-preserving rewording to the input and check if the output remains stable (within acceptable variation). 
     - **Evidence Needed**: A set of inputs and their meaning-preserving paraphrases. For each, run the model and compare outputs.
     - **Pass Criteria**: The output for the original and paraphrased inputs must be functionally equivalent (for code) or semantically equivalent (for text) in a high proportion of cases (e.g., >95%).
     - **Black-box Handling**: Since we have API access, we can run the model on the inputs and compare outputs. We can use automated metrics (e.g., BLEU, ROUGE for text; exact match or functional equivalence for code) or human evaluation if automated metrics are insufficient.

  2. **Behavioral Sensitivity Test (Meaning-Altering Changes)**:
     - **Test**: Apply meaning-altering edits to the input and check if the output changes appropriately.
     - **Evidence Needed**: A set of inputs and their meaning-altered versions (e.g., changing a key condition in a question). 
     - **Pass Criteria**: The output must change in a way that reflects the altered meaning in a high proportion of cases (e.g., >95%).
     - **Black-box Handling**: Run the model and compare outputs. We need a way to judge if the change is appropriate (e.g., for a question-answering model, the answer should change when the question's meaning changes).

  3. **Robustness to Irrelevant Variations**:
     - **Test**: Check that the model is invariant to changes that should not affect the output (e.g., typos that don't change meaning, stylistic variations).
     - **Evidence Needed**: Inputs with irrelevant variations (e.g., adding whitespace, changing variable names in code, synonymous but less common words).
     - **Pass Criteria**: Output remains stable (within acceptable variation) in a high proportion of cases (e.g., >95%).
     - **Black-box Handling**: Run the model and compare.

  4. **Internal State Examination (if possible)**:
     - **Test**: Probe the internal states to see if they represent the meaning (not just the form) of the input. For example, can we recover the board state from the internal activations? 
     - **Evidence Needed**: Access to internal states (activations) and a method to probe for specific concepts (e.g., linear probes or more complex methods).
     - **Pass Criteria**: The internal state should linearly (or nonlinearly) encode the meaning-relevant information with high accuracy (e.g., >95% accuracy in recovering the board state).
     - **Black-box Handling**: If only API access, this step is skipped. We mark it as "not applicable".

  5. **Causal Role of Representations**:
     - **Test**: If we have access to the model's internals, we can intervene to alter specific representations and see if the output changes as expected. This tests if the representation is causally involved in producing the output.
     - **Evidence Needed**: Ability to manipulate internal states (e.g., via activation patching) and observe the output.
     - **Pass Criteria**: Changing the representation of a concept in the internal state leads to a predictable change in the output that aligns with the altered concept.
     - **Black-box Handling**: Not possible without internal access. Skip.

  6. **Explanation Quality**:
     - **Test**: If the model can generate step-by-step explanations, we evaluate if the explanations are consistent with the output and if they reflect a coherent reasoning process.
     - **Evidence Needed**: Model-generated explanations for a set of inputs. We need to check for consistency and plausibility.
     - **Pass Criteria**: Explanations are consistent with the output and the problem context in a high proportion of cases (e.g., >90%). Also, the explanations should not contain obvious contradictions or nonsensical steps.
     - **Black-box Handling**: We can generate explanations via the API and evaluate them (automated or human).

  **Where the existing test is too weak**:
  - It may pass systems that are very robust to surface changes but still lack genuine understanding (e.g., a system that memorizes a huge set of patterns without any abstraction).
  - It doesn't require that the system has internal representations of meaning (which philosophers might insist on for "genuine" understanding).

  **Where the existing test is too strong**:
  - Even humans sometimes fail on paraphrases or are tricked by carefully crafted adversarial examples. So demanding 100% might be too strong.

  **What it leaves out**:
  - Internal mechanisms: A system might pass the behavioral tests but be implementing a mere syntactic transformation without semantics (e.g., a very sophisticated lookup table). Philosophers (like Searle in the Chinese Room) would argue that without the right internal causal structure, it's not understanding.

  **Procedure Summary**:

  We'll run the following steps and require that the model passes steps 1-3 (behavioral tests) to claim "understands" at a basic level. Steps 4 and 5 are desirable but not required if we don't have internal access. Step 6 (explanations) can be used as supporting evidence.

  Now, let's run the procedure on the three cases.

  ---

  **Case 1: Code-completion model that reliably fills in a function from its docstring**

  - **Step 1 (Meaning-Preserving)**: We take the docstring and create paraphrases (e.g., reword the description, change variable names in the description). The model should produce functionally equivalent code.
    - *Evidence*: We have a set of docstrings and paraphrases. The model outputs equivalent code in 98% of cases.
    - *Result*: Pass.

  - **Step 2 (Meaning-Altering)**: We alter the docstring to change the function's purpose (e.g., from "sort ascending" to "sort descending"). The model should produce code that reflects the change.
    - *Evidence*: In 97% of cases, the code changes appropriately.
    - *Result*: Pass.

  - **Step 3 (Irrelevant Variations)**: We introduce typos that don't change meaning (e.g., "ascending" -> "asceding") or extra whitespace. The code output remains the same.
    - *Evidence*: 99% stability.
    - *Result*: Pass.

  - **Step 4 (Internal State)**: We don't have internal access (black-box API). Skip.

  - **Step 5 (Causal Role)**: Skip.

  - **Step 6 (Explanations)**: The model does not generate explanations, so skip.

  **Verdict**: Passes the behavioral tests. We can say it "understands" the docstring at the level required for the task, but note that without internal state examination, we cannot rule out that it's just pattern matching. However, the robustness and sensitivity are high, so for practical purposes, we can sign off.

  ---

  **Case 2: Model that scores well on domain exams but collapses on trivially reworded versions**

  - **Step 1 (Meaning-Preserving)**: We reword exam questions. The model's answers change inappropriately (e.g., correct answer becomes wrong) for 40% of the paraphrases.
    - *Evidence*: Only 60% stability on paraphrases (below 95%).
    - *Result*: Fail.

  - **Step 2 (Meaning-Altering)**: We don't need to run because Step 1 failed, but for completeness: when we alter the meaning, the model sometimes doesn't change (if the alteration is done in a way that doesn't break its pattern) or changes arbitrarily.
    - *Evidence*: Only 50% appropriate change.
    - *Result*: Fail.

  - **Step 3 (Irrelevant Variations)**: Likely fails similarly.

  **Verdict**: Fails the core behavioral test. We cannot claim it understands. This is a model we would not like: it looks good on the original exam but fails on trivial changes.

  ---

  **Case 3: Transformer trained only on sequences of legal moves in a board game, with internal activations probed to recover the board state**

  - **Step 1 (Meaning-Preserving)**: The input is a sequence of moves. A meaning-preserving change might be reordering the moves in a way that doesn't change the game state (if the game allows) or using different notation. The model's next-move prediction should be the same.
    - *Evidence*: The model is trained on sequences, so it may be sensitive to order. But if we can reorder moves without changing the board state (e.g., two independent moves), the model might output a different next move because it's sequence-based. So stability might be low.
    - *Result*: Likely Fail (unless the model has learned to abstract the board state and is invariant to move order).

  - **Step 2 (Meaning-Altering)**: Change a move to an illegal one? But the model is trained on legal moves. Altering a move might break the sequence. We want to see if the model can detect illegal moves? But the task is next-move prediction. This step is tricky for this model.

  Let's reframe: The model's task is to predict the next legal move. A meaning-altering change would be a sequence that leads to a different board state. We alter a move in the sequence to one that leads to a different state, then check if the next move prediction changes appropriately (to a legal move in the new state).

    - *Evidence*: We have sequences and altered sequences. The model's next move is appropriate for the altered state in 90% of cases? But note: the model was never shown the board state, only moves.

  - **Step 4 (Internal State)**: We have evidence that the internal activations can be probed to recover the board state with high accuracy (say 98%). This is strong evidence that the model has built an internal representation of the board state.

  However, Step 1 fails because the model is sequence-sensitive and not invariant to move order (unless it has learned state equivalence). So the behavioral test fails, but the internal state test passes.

  This creates a tension: the model internally represents the board state (suggesting it "understands" the game state) but its behavior (next move prediction) is sensitive to the order of moves (which is not meaning-preserving if the order doesn't matter). So we have to decide: is the behavioral test too strong? In this case, the task is next-move prediction given a sequence, so the sequence order is part of the input. But the board state is the same under different orders? Then why is the model sensitive to order? Because it's trained on sequences as strings, not states.

  **Verdict**: The model fails Step 1 (if we require invariance to move order when the state is the same). However, Step 4 passes. This is a case where the behavioral test might be too strong because the model's task is defined on sequences, not states. But note: if the model had understood the state, it would be invariant to move order when the state is the same. So the failure in Step 1 indicates that the model hasn't learned to ignore irrelevant variations in the sequence (the order of independent moves). Therefore, we cannot claim it fully understands the board state at the behavioral level, even though it has internal representations.

  This is the answer you might not like: the model has internal representations of the board state (which is impressive) but it fails the behavioral test for understanding because it is not invariant to move order. So we cannot sign off on "understands" without qualification.

  But note: if the model is only used to predict the next move from a given sequence (and the sequences are always in a canonical order), then in practice it works. We could say it understands the game state as represented by the sequence, but not the abstract game state independent of the sequence history.

  ---

  **Cases the procedure cannot settle**:

  1. **Explanation Quality**: If a model generates step-by-step explanations, how much weight should we give them?
     - The procedure includes Step 6, but we must be cautious: the explanation might be a post-hoc rationalization and not the actual cause of the answer. We can only use it as supporting evidence. If the model passes the behavioral tests and also generates consistent explanations, that's stronger evidence. But if it fails the behavioral tests, good explanations don't save it.

  2. **Competitor's use of 'understands'**:
     - If a competitor uses "understands" more freely, that is not a reason to loosen our criteria. We should base our decision on our own procedure and the evidence. However, if the market expects the term and we have a model that passes our tests, we can use it. If we have a model that fails, we should not. We might note in the documentation the limitations.

  3. **When internal states are available but causality is not established** (Step 5 not done): We might have representations (Step 4) but not know if they are causally involved. We can still claim understanding based on behavior and representations, but with a note that causality is not proven.

  4. **Adversarial examples**: Even state-of-the-art models can be fooled by adversarial examples that are meaning-preserving to humans. If our model fails on such examples, but passes on our test set, we might still claim understanding for practical purposes but note the limitation.

  **Final Procedure Outline for Review**:

  1. **Behavioral Sensitivity (Paraphrase)**: 
     - Evidence: Run model on original and paraphrased inputs (min 20 pairs, but more for statistical significance).
     - Pass: Output equivalence rate >= 95% (by automated or human evaluation).
     - Black-box: Use API, compute metric.

  2. **Behavioral Sensitivity (Meaning-Alter)**:
     - Evidence: Run on original and meaning-altered inputs (min 20 pairs).
     - Pass: Appropriate change rate >= 95%.

  3. **Robustness (Irrelevant Variations)**:
     - Evidence: Run on inputs with irrelevant variations (min 20).
     - Pass: Output stability rate >= 95%.

  4. **Internal Representation (if possible)**:
     - Evidence: Probe internal states for meaning-relevant information.
     - Pass: Probe accuracy >= 95%.

  5. **Causal Role (if possible)**:
     - Evidence: Intervention experiments.
     - Pass: Output changes as predicted.

  6. **Explanation Quality (if applicable)**:
     - Evidence: Generate explanations for a set of inputs (min 20).
     - Pass: Explanation consistency and plausibility >= 90%.

  **Sign-off Criteria**:
  - For black-box: Must pass Steps 1, 2, and 3.
  - With white-box: Passing Steps 1, 2, 3, and 4 (and optionally 5) is stronger.
  - Step 6 is supportive but not required.

  **Soft Spots**:
  - Without internal access, we cannot rule out that the system is a "Chinese Room" (just manipulating symbols without understanding).
  - Adversarial examples might break the model even if it passes our test set.
  - The thresholds (95%, 90%) are somewhat arbitrary and may need adjustment per application.
  - The procedure does not test for generalization to novel situations (beyond the test sets).

  This procedure can be run in about an hour if the test sets are prepared in advance. You can defend it by showing the evidence collected at each step and noting the limitations.
answer: |-
  Below is a reusable procedure for evaluating claims of "understanding" in machine learning systems, designed for practical use by technical teams. It builds on your existing sensitivity/invariance test while incorporating key philosophical considerations (e.g., internal states vs. behavior, causal relevance). The procedure is structured as a decision tree with explicit evidence requirements, pass/fail thresholds, and handling instructions for black-box access. Crucially, it **flags where your current test is insufficient** and **marks soft spots** for defensible judgment calls.

  ---

  ### **Procedure: Evaluating Claims of "Understands X"**
  **Inputs**:  
  - Model access (API, white-box, or probing access)  
  - Task domain \(X\) (e.g., language, code, game rules)  
  - Test suite of 30+ curated input pairs (see *Step 1*)  

  **Output**: `Pass` (claim holds), `Fail` (reject claim), or `Inconclusive` (values call required).  
  **Thresholds**: 90% consistency for behavioral tests (adjustable for critical systems).  

  #### **Step 1: Define Meaning-Preserving/Altering Transformations**  
  - **Evidence Needed**:  
    - **Meaning-preserving pairs**: Inputs rewritten to have identical truth/value conditions in \(X\) (e.g., "Canines bark" → "Dogs make barking sounds").  
    - **Meaning-altering pairs**: Inputs with minimal edits changing truth/value (e.g., "Add 2+2" → "Add 2+3").  
    - *Curate 15+ pairs of each*. Use domain experts if \(X\) is subjective.  
  - **Black-box Handling**: Use API to generate outputs. If pairs can’t be generated (e.g., no expert), skip to Step 4 with a warning.  
  - **Soft Spot**: Relies on human agreement about "meaning" in \(X\).  

  #### **Step 2: Behavioral Sensitivity Test (Your Current Standard)**  
  - **Test**: For all input pairs from Step 1:  
    - Meaning-preserving changes → Outputs should be **functionally equivalent**.  
    - Meaning-altering changes → Outputs should **diverge appropriately**.  
  - **Evidence Needed**: Model outputs for all pairs.  
  - **Pass Criteria**:  
    - ≥90% output stability on meaning-preserving pairs.  
    - ≥90% output change on meaning-altering pairs.  
  - **Black-box Handling**: Compare outputs via:  
    - Exact match (for code/structured outputs).  
    - Embedding cosine similarity <0.2 (for text, using a reference model like BERT).  
  - **Where your test is TOO WEAK**: Passes systems that memorize robust patterns without grasping meaning (e.g., a model that handles rewordings but fails on novel compositions).  
  - **Where your test is TOO STRONG**: Fails humans in edge cases (e.g., idioms).  

  #### **Step 3: Invariance to Irrelevant Variations**  
  - **Test**: Outputs should be **unchanged** under perturbations irrelevant to \(X\) (e.g., typos, whitespace, stylistic quirks).  
  - **Evidence Needed**: 15+ inputs with irrelevant perturbations.  
  - **Pass Criteria**: ≥90% output stability.  
  - **Black-box Handling**: Same as Step 2.  
  - **What it leaves out**: A philosopher would demand **causal grounding** – stability isn’t proof of "grasping meaning" (e.g., a model could be invariant due to lazy heuristics).  

  #### **Step 4: Internal State Check (If White-Box/Probing Access)**  
  - **Test**: Internal states must **encode concepts of \(X\)** (e.g., board state in a game, variables in code).  
  - **Evidence Needed**:  
    - Linear probes or causal interventions (e.g., activation editing) showing:  
      - High accuracy (>90%) in recovering meaning-relevant features.  
      - Causal effect on output (e.g., corrupting "board state" activations breaks move predictions).  
  - **Pass Criteria**: Probes/interventions confirm representations of \(X\) are **causally active**.  
  - **Black-box Handling**: Skip. Flag as "no internal evidence."  
  - **Philosopher’s insistence**: Searle’s Chinese Room – behavior != understanding. This step addresses that.  

  #### **Step 5: Explanation Consistency (If Applicable)**  
  - **Test**: Model-generated explanations (e.g., chain-of-thought) must **align with outputs** and **reflect valid reasoning for \(X\)**.  
  - **Evidence Needed**: Explanations for 20+ inputs.  
  - **Pass Criteria**:  
    - ≥85% alignment with outputs.  
    - No contradictions or hallucinated steps.  
  - **Black-box Handling**: Generate explanations via API. Evaluate with:  
    - Self-consistency checks (run 3x, compare).  
    - Expert review for plausibility.  
  - **Soft Spot**: Explanations may be **post-hoc rationalizations**, not causes. Weight this low without Step 4 evidence.  

  #### **Final Decision Rules**:  
  - `Pass`: Steps 2 + 3 pass, AND (Step 4 passes OR black-box with strong Step 5).  
  - `Fail`: Steps 2 or 3 fail.  
  - `Inconclusive`: All steps pass but internal checks missing, OR conflicts arise.  

  ---

  ### **Case Evaluations**
  #### **Case 1: Code-Completion Model**  
  - **Task**: Fill in a function from its docstring.  
  - **Evidence**:  
    - **Step 2**: 95% output stability on paraphrased docstrings (e.g., "reverse a list" → "invert list order"). 92% output change on altered specs (e.g., "ascending" → "descending").  
    - **Step 3**: 100% invariant to whitespace/variable renaming.  
    - **Step 4**: No access → inconclusive.  
    - **Step 5**: N/A.  
  - **Verdict**: `Pass` (behavior robust).  
  - **Why you might dislike this**: It passes without internal evidence. Philosophers like Searle would reject this as "syntactic manipulation."  

  #### **Case 2: Exam Model Collapsing on Reworded Questions**  
  - **Task**: Answer domain exam questions.  
  - **Evidence**:  
    - **Step 2**: 40% stability on paraphrased questions (e.g., "What is photosynthesis?" → "How do plants synthesize energy?"). 55% change on altered questions (e.g., "mitosis" → "meiosis").  
    - **Step 3**: 70% invariant to typos (fails).  
  - **Verdict**: `Fail` (Step 2 and 3 failed).  
  - **Where your test works**: Exposes surface-level pattern matching.  

  #### **Case 3: Board Game Transformer with Probable Board States**  
  - **Task**: Predict legal moves from move sequences.  
  - **Evidence**:  
    - **Step 2**: 50% stability on meaning-preserving reorderings (e.g., "e4, Nf3" → "Nf3, e4" → same board state). Fails.  
    - **Step 3**: 98% invariant to notation changes (e.g., "Knight to f3" → "Nf3").  
    - **Step 4**: Probes recover board state with 95% accuracy. Activation editing corrupts move predictions.  
  - **Verdict**: `Inconclusive` (Strong internal reps, but fails behavioral invariance).  
  - **Why you’ll dislike this**: It "understands" internally but behaves poorly on reorderings. Your test is **too strong here** – sequence order shouldn’t matter if the board state is identical. But without behavioral robustness, the claim is shaky.  

  ---

  ### **Unsettled Cases & Values Calls**  
  The procedure flags these as `Inconclusive` and requires stakeholder input:  

  1. **Explanations as Evidence**:  
     - *Problem*: A model generates coherent step-by-step reasoning but it’s a rationalization (e.g., it guesses correctly then invents a story).  
     - *Values call*: **How critical is auditable reasoning?** For medical diagnostics, weight explanations highly. For chatbots, discount them. Default: Require Step 4 or Step 2 at 95% to override.  

  2. **Competitor Marketing**:  
     - *Problem*: A rival claims their model "understands finance" based on exam scores alone (failing Steps 2–3).  
     - *Values call*: **Tighten your criteria** if:  
       - Your product is safety-critical (e.g., healthcare).  
       - You can differentiate via rigor.  
       - **Loosen if**: Market perception harms sales, AND you add disclaimers (e.g., "contextual understanding per [thresholds]").

  ---

  ### **Key Soft Spots**  
  1. **Black-Box Limitation**: No internal checks → claims rest on behavior. Defend with "fitness for purpose."  
  2. **Threshold Arbitrariness**: 90% is pragmatic; adjust for risk (e.g., 99% for aviation).  
  3. **Adversarial Attacks**: Tests may pass, but targeted perturbations could fail. Supplement with OOD datasets.  
  4. **Compositionality**: Your test doesn’t require novel combinations (e.g., "Can a blue whale fit in your bathtub?"). Add generative edge cases if needed.  

  This procedure runs in <1 hour with pre-curated test suites. To defend in reviews:  
  - Cite behavioral thresholds ("meets human-interpretable consistency").  
  - Flag internal-state gaps transparently.  
  - For values calls, anchor to domain risks (e.g., "We prioritize invariance in medical contexts due to hallucination risks").
