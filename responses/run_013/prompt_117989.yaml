answer: |-
  Here is a taxonomy structured as a decision tree, designed to sort positions based on concrete commitments rather than labels. Each branch point is a question answerable by reasoning about cases or convictions. Leaves include the requested views and others demanded by the logical space.

  **The Taxonomy Tree: What is Marriage For?**

  1.  **Does marriage have *any* essential purpose (or purposes) defined by the institution itself, independent of the parties' private intentions?**
      *   **NO (Marriage has no inherent purpose; it is a vessel for private goals or a legal tool):** Go to 2.
      *   **YES (Marriage has an inherent purpose or function):** Go to 3.

  2.  **If marriage has no inherent purpose, what justifies the state in having a distinct legal category called "marriage"?**
      *   **Nothing – the state should abolish marriage as a distinct legal status.** → **Abolitionist View**
          *   *Awkward Commitment:* Must explain why the state shouldn't support *any* caregiving/familial structures legally, even minimally.
      *   **To provide a flexible bundle of default legal benefits/obligations for interdependent relationships.** → **Minimal Marriage / Flexible Contract View**
          *   *Awkward Commitment:* Must accept that any grouping (e.g., siblings, close friends, polycules) meeting minimal criteria of care/interdependence qualifies, potentially severing the link to romantic partnership.
      *   **To remedy civic inequality by granting equal status to relationships historically excluded.** → **Civic Status View**
          *   *Awkward Commitment:* The purpose of marriage itself is irrelevant; inclusion is solely about equality and dignity, making debates about "what marriage is for" moot for law.

  3.  **What is the essential purpose/core function of marriage?**
      *   **Procreation and the creation/raising of children within a stable family unit.** Go to 4.
      *   **A comprehensive union of the spouses – emotional, spiritual, and bodily – oriented towards mutual flourishing.** Go to 5.
      *   **Providing a reliable, long-term framework for mutual care, dependency support, and economic partnership.** Go to 6.
      *   **Serving a civic function: promoting stable households, social order, or fostering virtues like fidelity.** Go to 7.

  4.  **If procreation is central, is sexual complementarity (i.e., male-female pairing) essential to fulfilling this purpose?**
      *   **YES: Only a union capable of generating new life *together* (in principle) constitutes the core of marriage.** → **Conjugal View**
          *   *Awkward Commitment:* Must explain the status of infertile opposite-sex couples or marriages never consummated; often argues they resemble the *type* capable of procreation or uphold the norm.
      *   **NO: The essential purpose is providing a stable, committed context for raising children; sexual complementarity is not necessary for this.** → **Child-Centered Revisionist View**
          *   *Awkward Commitment:* Must accept that childless marriages (by choice or circumstance) are incomplete or marginal to the institution's core purpose.

  5.  **If comprehensive union is central, what makes the union "comprehensive"? Is bodily union (sexual intercourse) essential?**
      *   **YES: Bodily union, understood as the kind of act that can create new life (even if it doesn't), is integral to the comprehensive union.** → **Conjugal View** (Reached via a different path)
      *   **NO: The comprehensive union is primarily emotional, spiritual, and committed partnership; bodily union is significant but not definitional.** → **Revisionist View (Comprehensive Union Focus)**
          *   *Awkward Commitment:* Struggles to articulate a principled reason why deeply committed, long-term platonic friendships (e.g., the lifelong friends caring for each other) shouldn't qualify if they achieve similar mutual flourishing.

  6.  **If care/dependency support is central, does the relationship need to be romantic/sexual?**
      *   **NO: Any relationship providing deep, long-term, comprehensive care and interdependence could fulfill this function.** → **Care-Centered Functionalist View**
          *   *Awkward Commitment:* Must accept that siblings cohabiting and caring for each other, or lifelong platonic friends, qualify equally with romantic couples, potentially making marriage indistinguishable from other legal constructs like civil union if applied broadly.
      *   **YES: The romantic/sexual bond is a crucial element distinguishing marriage-level care/dependency from other close relationships.** → **Revisionist View (Care/Mutual Good Focus)** (Often converges with the comprehensive union revisionist view in practice).

  7.  **If the civic function is central, is the state's interest primarily in...**
      *   **...promoting the specific good of spouses (e.g., fostering fidelity, commitment, personal flourishing)?** → **Perfectionist View**
          *   *Awkward Commitment:* Requires the state to make judgments about what constitutes a valuable or flourishing life for adults, raising liberal neutrality concerns.
      *   **...securing stable environments for raising children?** → **Child-Centered Revisionist View** or **Conjugal View** (Reached via different paths; distinction made at question 4).
      *   **...maintaining social order and efficient household management?** → **Civic Stability View** (Often overlaps with Care-Centered Functionalist or Minimalist views).

  **Branch Point Clarifiers & Case Applications:**

  *   **Question 1 (Essential Purpose?):** Tested by cases like the **visa marriage** (private purpose vs. institutional purpose), the **long-lived friends/siblings** (does their caregiving fit the institution?), and the **couple raising children without marrying** (does the function exist outside the institution?).
  *   **Question 3 (Core Purpose?):** Tested by **childless-by-choice couple** (problem for strict procreation views), **infertile couple** (problem for views requiring biological potential), **unconsummated marriage** (problem for bodily union views), and **three-person household** (problem for views assuming dyadic exclusivity as essential to purpose).
  *   **Question 4 (Complementarity Essential?):** Tested by **same-sex couples raising children** (can they fulfill the child-rearing purpose?) and **infertile opposite-sex couples** (are they fundamentally different?).
  *   **Question 5 (Bodily Union Essential?):** Tested by the **unconsummated marriage** and potentially the **long-term platonic caregivers**.
  *   **Question 6 (Romance Necessary?):** Tested directly by the **long-lived friends/siblings** case.
  *   **Question 7 (State Interest?):** Tested by **all cases** regarding whether the state has a legitimate interest in promoting/supporting that particular configuration.

  **Unoccupied or Problematic Branches & Indistinguishable Pairs:**

  *   **"Procreation Central, Complementarity Contingent, BUT Bodily Union Essential":** Incoherent. If bodily union (of the procreative kind) is essential, complementarity logically follows. No plausible view holds this combination.
  *   **"No Essential Purpose BUT State Has Perfectionist Interest":** Unattractive/Incoherent. If there's no inherent purpose, it's hard to justify the state promoting a specific conception of the good *through this specific institution*. Why not use a different tool? Likely unexplored/unoccupied.
  *   **"Civic Function (Stability/Order) BUT Romance Necessary":** Unexplored? Logically possible but strained. The civic stability argument usually doesn't hinge on romance itself, but on structure. Why wouldn't stable non-romantic caregiving units serve order equally well?
  *   **Indistinguishable Pair (by cases alone):** The **Revisionist View (Comprehensive Union)** and the **Revisionist View (Care/Mutual Good)** often converge in practice for romantic dyads. The key difference (significance of bodily union vs. depth of care) might only be sharply tested by extreme cases like long-term, deeply caring but platonic partnerships or marriages where intimacy ceases but profound care continues. For most typical marriages, they yield the same verdicts.
  *   **Indistinguishable Pair (by cases alone):** A **Minimal Marriage** proponent and a **Care-Centered Functionalist** might agree on including the **long-lived friends/siblings**, making them hard to distinguish unless pressed on whether the *label* "marriage" matters vs. just the bundle of rights (Civic Status view might also overlap here). The Minimalist is more focused on legal flexibility, the Functionalist on the underlying social purpose.

  **How the Tree Reveals Verdict/Reason Splits & Verbal Disagreements:**

  *   **Same Verdict (Pro-SSM), Different Reasons/Leaf:** A **Child-Centered Revisionist** (Leaf: Pro-SSM because child-rearing is key, complementarity irrelevant) and a **Revisionist** (Leaf: Pro-SSM because spousal union/love is key) both support same-sex marriage but are on different branches (3->4 vs. 3->5). A **Civic Status** advocate (Leaf: Pro-SSM for equality) is on a different branch entirely (1->2).
  *   **Different Verdict (Anti-SSM), Same Core Purpose:** A **Conjugalist** (Leaf: Anti-SSM) and a **Child-Centered Revisionist** (Leaf: Pro-SSM) agree procreation is central (Branch 3) but split on complementarity (Branch 4), leading to opposite legal conclusions.
  *   **Merely Verbal Disagreements Revealed:**
      *   Debates over whether a **childless-by-choice marriage** is "real" or "defective" are substantive if based on purpose (Procreation-Centered vs. Revisionist views), but *could* be merely verbal if "defective" just means "doesn't fulfill *one* common purpose" without implying it's not a valid instance of the institution.
      *   Disputes about whether the **long-lived friends/siblings** "count as married" are substantive if based on purpose (Comprehensive Union vs. Care-Centered Functionalist) but *could* be merely verbal if "married" is simply conflated with "has the legal package" (Minimalist view) vs. "embodies the essential relationship type."
      *   Arguments about whether the state's *interest* is in "children" or "stability" might mask agreement that the practical legal function is similar.

  This tree forces students to engage the underlying reasons and commitments revealed by cases, moving beyond surface-level "for/against" labels and exposing the diverse philosophical foundations of positions on marriage law.
