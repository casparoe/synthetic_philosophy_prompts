prompt: |-
  I've been trying to work out what my country's chemical and drug regulators actually believe, because the pattern doesn't add up to anything I can name.

  Start with a new molecule. Say a company wants to sell a new pesticide, a new food additive, a new plasticiser. The default answer is no. They have to hand over the studies, and if the studies don't cover something, the gap counts against them -- the regulator's line is basically that the absence of evidence of harm isn't itself evidence that there's no harm. Some of these rules don't even look at exposure. If the stuff is the kind of thing that can cause cancer, that's enough to sink it, even if the dose anyone would ever get is minuscule; it's banned for what it is rather than for what it does.

  Now take the same agency and ask it to pull something off the shelf that's been sold for thirty years. Suddenly the burden is on the regulator. Show me the harm, in humans, at real exposure levels, with the confounders controlled. If the evidence is a mess, the product stays. That same absence-of-evidence point never gets used in this direction.

  Third thing. A new drug needs a decade of trials before anyone can take it. But a surgeon can invent a new operation and start doing it next week, and there's no approval process at all -- the profession just polices itself afterwards, and if it goes wrong the defence is that it was the state of the art. Same with a hospital quietly switching on an internal AI triage tool. No pre-market gate for any of it.

  Fourth. When the agency does act, the numbers it acts on are weird. A theoretical one-in-a-million lifetime cancer risk from a new additive is treated as a real reason to ban it. But a workplace exposure that measurably kills a few hundred identifiable people a year gets told the epidemiological evidence is contested, and gets another decade of study.

  So heres what I want. Not what the guidance documents say they're committed to -- I want the view you'd have to hold for all four of those to hang together. What does the pattern presuppose about what a risk is, about who the default protects, and about the difference between introducing a hazard and tolerating one? I suspect there's a hidden premise about the status quo being the safe place, and if that's right I want to know exactly where its doing work and where the practice could get along fine without it. Which parts of this are strictly required by the underlying view, and which are just institutional habit? And is it even self-consistent -- because acting on the hazard rather than the exposure in one case, and needing measured human harm in another, can't both be the general rule, so is there a principled line between them or is it just two different agencies' cultures colliding inside one building? And if someone replaced the whole thing with a framework that treats inaction as a choice with its own body count, what would actually have to change on the ground?
reasoning: |-
  Okay, let me unpack this user's query. They're clearly frustrated with regulatory inconsistencies, pointing out four main patterns: strict pre-approval for new chemicals, leniency for existing products, differing standards for drugs vs. medical procedures, and inconsistent risk thresholds. 

  Hmm, the user isn't just complaining—they're asking for the underlying philosophy that could explain these contradictions. That's sophisticated. They suspect a "status quo bias" and want to know where it's essential versus habitual. Smart observation. 

  First, I need to map their examples to regulatory principles. The new-chemicals stance screams precautionary principle—better safe than sorry when introducing unknowns. But the old-products approach is pure risk management: don't rock the boat without ironclad proof. The drug/surgery double standard? That's about regulatory scope—drugs get controlled because they're systemic and replicable, while surgeries are seen as artisanal. 

  Ah, and the risk-tolerance inconsistency! Theoretical micro-risks get banned while proven macro-risks linger. Classic "salience of the new" versus "invisibility of the familiar." The one-in-a-million cancer risk feels controllable; accepting ongoing deaths feels like failure. 

  Wait—they're hinting at a deeper question: Is this system logically coherent? Probably not. The hazard-vs-exposure flip-flop suggests institutional schizophrenia. Precaution for newcomers, inertia for incumbents. 

  The user's last question is killer: What if we framed inaction as a choice with body counts? That'd force regulators to weigh lives lost by delay against lives saved by caution. But implementing it... oof. You'd need sunset clauses on old approvals, mandatory re-evaluations, and maybe "regulatory equivalence" assessments between action/inaction risks. 

  Notably, they didn't mention industry lobbying or resource constraints—which are huge factors. But their focus is philosophical, so I'll stay there. The core tension? Regulators see themselves as gatekeepers against new threats, not stewards reducing existing harm. That mental model explains all four patterns. 

  ...Better structure this as: 1) The core premises, 2) Where status quo bias is essential vs. habitual, 3) The hazard/exposure contradiction, 4) What "inaction as choice" would change. Need to emphasize that surgery/AI loopholes exist because regulators never claimed jurisdiction—it's not hypocrisy, it's boundary-drawing. 

  Final thought: The user's razor-sharp. They've spotted that "regulatory capture" isn't just corruption—it's baked into how we define safety.
answer: |-
  Your analysis captures a profound inconsistency in regulatory philosophy. To reconcile these patterns, we must identify the core principles driving them. Here's a deconstruction of the underlying belief system and its implications:

  ### Core Regulatory Premises
  1. **The Tyranny of the Status Quo**  
     *Regulators treat existing products/processes as "innocent until proven guilty" but view novel substances as "guilty until proven innocent."* This stems from:
     - **Risk Asymmetry Perception**: Introducing *new* risk is politically/legally blameworthy; tolerating *existing* risk is often seen as unavoidable.
     - **Institutional Inertia**: Removing established products faces industry pushback, job-loss fears, and consumer backlash (e.g., "nanny state" accusations). Approving new products faces only abstract future-risk accusations.

  2. **Hazard vs. Exposure Hierarchy**  
     - **For novel entities**: Hazard properties (e.g., carcinogenicity) trigger regulation regardless of exposure, due to the **precautionary principle**. Regulators assume exposure pathways *could* emerge (e.g., environmental accumulation, misuse).
     - **For legacy products**: Exposure *must* be proven harmful at real-world levels. Removing them requires overcoming **evidentiary thresholds** (human epidemiological studies with controlled confounders) that are often impossible to meet.

  3. **Jurisdictional Boundaries & Professional Autonomy**  
     - Drugs are regulated as *commodities*; surgery/AI tools are seen as *professional services*. This reflects:
       - **Historical precedent**: Medical practice autonomy predates modern regulation.
       - **Practical constraints**: Regulating every surgical innovation is logistically impossible; professional liability ("state of the art" defense) acts as a post-hoc control.
       - **Misplaced categorization**: AI triage tools fall into a regulatory gap because they're neither "devices" (if software-only) nor "practices."

  4. **Perceived vs. Actual Risk Calculus**  
     - **Theatrical risks** (one-in-a-million theoretical cancer) are banned because they’re *politically salient* and *attributable* to regulators.
     - **Chronic, diffuse risks** (workplace exposures) persist because harm is:
       - Statistically diluted across populations
       - Politically "invisible" (victims lack collective voice)
       - Economically entrenched (cost of mitigation vs. perceived "acceptable loss")

  ---

  ### What This Pattern Presupposes
  - **Risk is Political, Not Scientific**: Regulatory action correlates more with blame-avoidance than with net harm reduction. 
  - **The Default Protects Incumbents**: Existing industries/technologies benefit from inertia; innovators bear infinite proof burdens.
  - **Status Quo as "Safe Harbor"**: Existing risks are normalized; *change* (whether introducing new hazards or removing old ones) is viewed as inherently dangerous.
  - **Epistemic Bias**: Absence of evidence = safety for legacy products, but absence of evidence = risk for new ones.

  ---

  ### Self-Consistency Check: Contradictions & Drivers
  | **Conflict**                     | **Root Cause**                                                                 |
  |----------------------------------|--------------------------------------------------------------------------------|
  | Hazard-based (new) vs. exposure-based (legacy) regulation | **Temporal bias**: "New" hazards have uncertain exposure pathways; "old" hazards have embedded exposure assumptions |
  | Drugs (pre-market proof) vs. Surgery/AI (post-market) | **Regulatory scope**: Products vs. practices. Also, **innovation asymmetry**: Surgical "innovations" are framed as incremental professional judgment |
  | Micro-risks (banned) vs. macro-risks (tolerated) | **Accountability asymmetry**: Theoretical risks create regulator liability; proven risks are society’s "shared burden" |

  **Institutional Habit vs. Core Premise**:  
  - *Required by philosophy*: Status quo bias, hazard-based precaution for new substances.  
  - *Institutional habit*: Over-reliance on human epidemiology for legacy risks (when mechanistic/toxicological data could suffice), non-review of professional practice standards.

  ---

  ### Reforming the System: Treating Inaction as a Choice
  To align regulation with *actual harm reduction*, these changes would be needed:
  1. **Sunset Clauses & Periodic Re-evaluation**  
     All products/processes automatically expire after 10-15 years unless re-evaluated under *current* risk-assessment standards (removing legacy-product inertia).

  2. **Burden-Shifting for Legacy Hazards**  
     If credible evidence of hazard *and* exposure exists, industry must fund studies to *disprove* significant risk (mirroring new-product requirements).

  3. **Unified Risk Metric**  
     Adopt a standard metric (e.g., Disability-Adjusted Life Years per unit exposure) applied equally to novel and existing risks. Ban/tolerate based on absolute harm, not novelty.

  4. **Expand "Product" Definition**  
     Regulate AI tools/surgical protocols as *systems* if they pose population-level risks (e.g., FDA’s SaMD framework for software).

  5. **Transparent Risk Tradeoffs**  
     Require regulators to quantify lives saved/lost by approval/delay/inaction (e.g., "If we delay this pesticide, farmers will use older agents causing X additional cancers").

  **Obstacles to Reform**:  
  - Industry lobbying protects legacy products.  
  - Regulators lack resources for proactive re-evaluation.  
  - Legal systems reward blame-avoidance over optimal outcomes.  

  ### Conclusion
  The pattern presupposes that **regulators are liability managers, not risk minimizers**. Their actions optimize avoidance of *attributable blame* rather than *net harm reduction*. A self-consistent system would require abandoning status quo bias, adopting uniform risk metrics, and acknowledging that *both action and inaction kill*. The hardest shift isn’t technical—it’s accepting that perfect safety is impossible, and that tolerating known harms while blocking innovation based on theoretical risks is itself a deadly choice.
