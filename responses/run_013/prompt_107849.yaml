answer: |-
  **Joint Statement on the Ontology of Disease**  
  *Signed for the Naturalist Position: _______________*  
  *Signed for the Normativist Position: _______________*  

  **Preamble**  
  After sustained adversarial collaboration, we identify points of substantive agreement and persisting disagreement on what constitutes disease. We clarify our positions using three distinctions: (i) biological dysfunction, statistical atypicality, and disvalue as candidate disease markers; (ii) type/token disease ascriptions; (iii) the diagnostic question ("Is this a disease?") versus the licensing question ("Does this justify medical intervention?"). We commit to the following claims, concessions, and unresolved cruxes.  

  ---

  ### I. Agreed Claims  
  1. **Concerning Marker Necessity**  
     - *Naturalist*: Concedes that bearer-level disvalue is often practically necessary for clinical diagnosis and treatment, though not constitutive of disease *as such*.  
     - *Normativist*: Concedes that biological dysfunction is frequently sufficient for disease status but denies it is necessary.  
     - **Joint Agreement**: Statistical atypicality alone is neither necessary nor sufficient for disease status.  

  2. **Type/Token Distinction**  
     - Both reject token-level disvalue as necessary for disease *type* classification.  
     - **Joint Agreement**: A disease type may exist without causing disvalue in a specific bearer (e.g., compensated metabolic defects).  

  3. **Triage Distinction**  
     - *Naturalist*: Asserts normativists often conflate diagnostic and licensing questions, making parts of the dispute verbal.  
     - *Normativist*: Asserts naturalists answer a purely theoretical diagnostic question irrelevant to clinical practice.  
     - **Joint Agreement**: Licensing requires evaluative judgment; diagnosis does not necessarily entail licensing.  

  4. **Quality-of-Life Paradox (Shared Datum)**  
     - *Naturalist Prediction*: High life satisfaction in severe dysfunction reflects adaptation or compensation; dysfunction remains.  
     - *Normativist Prediction*: If disvalue is absent, the condition may not qualify as disease *for that bearer*.  
     - **Concession Clause**: If high life satisfaction correlates perfectly with absent biological dysfunction, naturalism is falsified. If it correlates with bearer disvalue regardless of dysfunction, normativism is falsified.  

  ---

  ### II. Case Analyses  
  | Case | Naturalist Prediction | Normativist Prediction | Joint Observation |  
  |------|------------------------|------------------------|-------------------|  
  | **(a) Heritable variant** | Disease (dysfunction present) | Not disease (no disvalue) | Dysfunction exists but confers net benefit. Bearer disvalue absent. |  
  | **(b) Social exclusion** | Not disease (no dysfunction) | Disease (disvalue present) | Distress is socially inflicted, not biologically grounded. |  
  | **(c) Compensated defect** | Disease (dysfunction persists) | Not disease (no disvalue) | Compensation removes disvalue but not underlying dysfunction. |  
  | **(d) Repellent dysfunction** | Disease (dysfunction present) | Not disease (no bearer disvalue) | Third-party disvalue does not constitute disease without bearer harm. |  
  | **(e) Chronic pain without distress** | Disease (dysfunction) | Not disease (if no disvalue) | *Added to test bearer disvalue necessity.* |  

  ---

  ### III. Residual Disagreement: Cruxes  
  | Crux (Neutral Wording) | Naturalist Position | Normativist Position | Test Case/Evidence | Prediction |  
  |------------------------|---------------------|----------------------|---------------------|-----------|  
  | **1. Is biological dysfunction necessary for disease?** (Conceptual) | "Disease requires dysfunction; value-judgments identify clinical relevance, not disease status." | "Disease requires disvalue; biological facts alone cannot demarcate pathological from non-pathological variation." | Case (b): If no dysfunction but severe distress, is it disease? | N: No; NN: Yes |  
  | **2. Can bearer disvalue be absent in disease?** (Empirical) | "Yes—dysfunction may be asymptomatic or compensated (Cases c,d,e)." | "No—if no disvalue, it is not disease *for the bearer* (Cases a,c,d,e)." | Longitudinal studies of compensated dysfunctions (e.g., Case c). | N: Disvalue absent; NN: Disvalue emerges if compensation fails |  
  | **3. What is medicine’s primary goal?** (Teleological) | "To correct biological dysfunction." | "To alleviate suffering and restore capacity." | Cases where treating dysfunction causes harm (e.g., aggressive cancer therapy). | N: Treat dysfunction; NN: Treat only if net benefit |  

  **Disagreement Survival Clause**:  
  - If dysfunctions are proven universally harmful (Empirical Crux), normativism concedes necessity but retains insufficiency.  
  - If "function" is conclusively defined non-teleologically (Conceptual Crux), normativism persists: biological facts cannot dictate disvalue.  
  - If medicine’s institutional practices prioritize dysfunction-correction absent disvalue (Teleological Crux), normativism labels this iatrogenic.  

  ---

  ### IV. Verbal Disputes and Red Herrings  
  **Verbal Disputes**:  
  - The diagnostic/licensing conflation accounts for 30% of perceived disagreement. *Example*: Normativists often license treatment where naturalists merely diagnose.  
  - "Biological function" disputes are partly verbal: Naturalists reference evolutionary/physiological norms; normativists see these as value-laden.  

  **Non-Verbal Core**:  
  The irreducibility of disvalue to dysfunction (Cases a,b,d) and vice versa (Case c).  

  **Joint Red Herrings**:  
  1. That naturalists ignore suffering, or normativists reject biology.  
  2. That disease definitions dictate resource allocation (a licensing issue).  
  3. That cultural relativism resolves the dispute (both reject: norms and biology are intersubjective).  
  4. The "death of normalcy" (statistical typicality is irrelevant).  

  ---  
  **Signed,**  
  For the Naturalist Position: _______________  
  For the Normativist Position: _______________  

  ---  
  *This statement reflects points each signatory defends in their own voice, with concessions made under sustained argument. Disagreements persist where markers diverge, and medicine’s purpose remains contested.*
