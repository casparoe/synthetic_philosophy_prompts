prompt: |-
  I teach an undergrad seminar on practical rationality and I want to close the term with Memento. The philosophy people usualy write about that film is all memory and personal identity, which I'm a bit bored of, so I want to do money pumps and diachronic rationality instead. Leonard's tattoos and Polaroids are plainly a commitment device, and the ending is him using that device to commit a future self he'll never share memories with to killing Teddy, so: is he running a money pump on himself, and is it the same kind of pump the literature describes, or does the analogy break because the later Leonard doesn't remember the trades and can't feel himself being taken? Teddy says he's been using Leonard for years and that the whole search just resets, which sounds like a pump running on a loop. And Natalie gets work out of him and then hands him Teddy's name, which may or may not be the same move. I also want the sophisticated-vs-resolute chooser distinction taken seriously (if I know I'll defect later, why not defect now?) and a straight answer on whether the film vindicates resoluteness or shows it collapsing, plus what it dramatizes about diachronic agency that the decision-theory papers dont. Where the analogy to the atemporal pump strains, say so, and don't let the whole thing dissolve into a claim about personal identity. Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating the question.
reasoning: |-
  Okay, the user teaches an undergrad seminar on practical rationality and wants to analyze "Memento" through the lens of money pumps and diachronic rationality instead of the usual memory/personal identity angle. They're specifically asking whether Leonard is running a money pump on himself via his commitment device (tattoos/Polaroids), and how Teddy/Natalie's manipulations relate to this. They also want sophisticated vs. resolute chooser analysis applied to Leonard's final act of tattooing Teddy's name, plus broader insights about diachronic agency beyond standard decision theory.

  Hmm, the core tension here is fascinating: Leonard's system is designed as a resolute commitment strategy against his future "sophisticated" self who'd otherwise abandon the revenge mission. But the film actually shows this resolution collapsing because the commitment device gets hijacked - Teddy exposes how Leonard already achieved closure (killing the real attacker) but keeps recycling the pump, while Natalie manipulates him into a new cycle. 

  The money pump analogy holds surprisingly well if we frame Leonard's "preferences" as cyclical: he values revenge (A) over abandoning the quest (B), but once revenge is temporarily satisfied, he values having a purpose (B) over inactivity... which Teddy/Natalie exploit by offering a new target (A again). It's a literal behavioral loop powered by his memory condition. 

  Where it strains is the standard money pump's reliance on exploitation by an external actor - here Leonard is both victim and architect, and his later selves can't regret the "trades" because they don't remember them. That shifts focus to the commitment device's vulnerability rather than preference inconsistency per se. 

  For soph vs resolute: Leonard's final tattoo scene is peak resolute choice - he knows future-him will defect (question the tattoo), so he burns evidence to force compliance. But the film brutally undermines this: the resolute act perpetuates the pump because the premise (John G still out there) is false. So it dramatizes how resolute commitment requires accurate world-knowledge, not just willpower - something decision theory often sidesteps. 

  Bigger picture: the film shows diachronic agency as vulnerable not to changing preferences, but to others weaponizing your own rules. Papers focus on internal consistency, but "Memento" exposes how external bad actors can turn commitment devices into perpetual exploitation engines. That's the fresh angle for the seminar.
answer: |-
  **Leonard runs a self-sustaining money pump on himself via his commitment device, but it's critically distinct from standard pumps due to his inability to regret trades or learn, and Teddy/Natalie exploit this loop; the film dramatizes how resoluteness, while instrumentally effective for immediate action, collapses when built on false premises and external manipulation, revealing a vulnerability in diachronic agency beyond preference inconsistency.**

  Here's the breakdown:

  1.  **Leonard as a Self-Created Money Pump:** His system (tattoos, Polaroids, rules) is designed as a resolute commitment device to bind his future self to a single goal (find and kill John G). Future Leonard, lacking memories and confronted with the "facts" on his body, acts as a sophisticated chooser *within* that pre-committed frame – he follows the evidence because it's the only rational choice *given the constraints his past self imposed*. The "pump" aspect arises from the cyclical nature Teddy describes: Leonard achieves his goal (killing *a* John G), feels momentary satisfaction (A > B), but then resets due to his condition, creating a preference for having a purpose/revenge again (B > A), leading him to seek a new target. Teddy fuels this cycle by providing new targets (a new A), extracting value from Leonard's labor. Natalie similarly pumps him by manipulating the inputs to his system (feeding him Teddy as a target).
      *   **Analogy Holds:** It's a loop where Leonard pays a cost (effort, violence, being manipulated) to achieve A (revenge/killing John G), then effectively pays again (by resetting) to return to a state where he prefers pursuing A over B (inaction/no purpose). Value leaks out to Teddy/Natalie.
      *   **Analogy Breaks (Key Distinction):** Standard money pumps rely on the agent *regretting* the sequence of trades due to the net loss and *learning* to avoid the cycle. Leonard cannot remember the trades, feel the regret, or learn from the net loss. He can't feel "taken" in the moment or reflect on the cycle. The pump runs *because* of his amnesia, not despite it. The exploitation is purely external (Teddy/Natalie) feeding the loop Leonard created.

  2.  **Sophisticated vs. Resolute Chooser:**
      *   **Sophisticated Leonard (Future Self):** Confronted with the commitment device (tattoos/Polaroids), future Leonard acts sophisticatedly. He knows he has these "facts" and rules *because* past Leonard deemed them crucial. Given his amnesia and the apparent reliability of the system (from his perspective), the rational choice *is* to follow the evidence to its conclusion (kill Teddy). Defecting (ignoring the tattoo) would be irrational within his epistemic state.
      *   **Resolute Leonard (Ending Scene):** When past Leonard (in the timeline we see) tattoos "FACT 6: CAR LICENSE SG13 7IU" (Teddy) and burns the Polaroid of Jimmy Grantz (the John G he just killed), he is making a *resolute* choice. He *knows* his future self, lacking the memory of Teddy's confession and manipulation, will be sophisticated and might defect (question the tattoo, look for corroborating evidence *if it existed*). By destroying the contradictory evidence (Jimmy's photo), he forces his future self to accept the tattoo as the sole, definitive truth, binding him to the action. He pre-commits his future self to killing Teddy, overriding any potential sophisticated doubt that might arise from incomplete evidence.
      *   **Vindication or Collapse?** The film shows resoluteness *instrumentally succeeding* in binding his future self to act. However, it **collapses catastrophically** because the resolute commitment is built on a lie ("The one. Salvable.") and Teddy's manipulation ("He's the one. You got him."). Leonard resolves to commit to a *false* premise. His resolute act doesn't achieve true closure or justice; it perpetuates the exploitative pump loop. Resoluteness works mechanically but fails substantively.

  3.  **What the Film Dramatizes Beyond Decision Theory:**
      *   **Manipulation of Commitment Devices:** Decision theory often assumes commitment devices are chosen and used autonomously. *Memento* shows how powerful external agents (Teddy, Natalie) can hijack these devices, feeding them false inputs to steer the agent towards actions that serve *their* ends, turning the agent's own resolve against them. Leonard's system, designed for self-control, becomes a tool for his exploitation.
      *   **Agency Under Epistemic Scarcity:** Standard diachronic problems assume the agent retains knowledge over time. Leonard's amnesia creates radical epistemic discontinuity. His agency is fragmented; each "self" acts rationally within its limited knowledge horizon, but the diachronic whole is irrational and exploitable. The film shows how maintaining a coherent diachronic agency requires not just consistent preferences or willpower, but also *continuity of knowledge and critical access to the history of one's own commitments*.
      *   **The Cost of Purpose:** Leonard's entire system is a commitment to having a purpose (vengeance). The money pump loop highlights the immense *cost* he pays (being manipulated, committing violence, never finding peace) to maintain this sense of purpose against the void his condition creates. The pump isn't just about inconsistent preferences; it's about the existential drive to avoid nihilism, making him vulnerable to those who can supply the illusion of purpose (new John Gs).

  **Bottom Line:** Leonard's system is a unique, self-imposed money pump loop exploited by others, distinct due to amnesia preventing regret/learning. His final resolute act binds his future self effectively but collapses because it's based on falsehoods. The film reveals how diachronic agency crumbles under epistemic discontinuity and external manipulation of commitment devices, exposing vulnerabilities beyond simple preference reversal.
