  First, I need to map their description to existing concepts. The reference class problem is part of it, but they're clear that this goes beyond that—it's the opportunistic switching of interpretations that's the core issue. The user mentions "principled pluralism" as distinct because it's consistent, not opportunistic. 

  The user's deeper need seems to be precision in labeling and defining this concept for academic or critical purposes. They might be writing a paper, teaching, or engaging in a debate where this tactic is used. Their frustration suggests they've encountered this in practice and want tools to call it out. 

  I should check philosophy of probability and statistics. Key terms: "reference class problem" (Reichenbach), "moving the goalposts" fallacy, "motivated reasoning." The interpretation-switching feels closest to what's sometimes called "interpretation laundering" in informal contexts, but I'm not aware of a formal term. 

  Possible names: "Probabilistic Defensive Maneuvering" (too generic?), "Chameleon Probability" (vivid but not established). The switching between interpretations is the unique element. "Interpretation Shopping" captures the selective, opportunistic use. 

