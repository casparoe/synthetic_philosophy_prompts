  - The driver cannot remember how many exits she has passed. Thus, at each exit she faces the same choice without knowing if it is the first or the second.

  *The Paradox:*
  The driver, at an exit, must decide whether to exit (E) or continue (C). She reasons based on the probability that the current exit is the first or the second. But since she has no information, she assigns a probability p to being at the first exit and 1-p to being at the second. However, the driver also knows that she will face the same situation at the next exit if she continues. This leads to a circularity.

  *Locally Correct Reasoning:*
  At an exit, the driver calculates the expected value of exiting and the expected value of continuing.
  - If she exits, she gets 0 if it is the first exit, and 4 if it is the second. But she doesn't know which one it is. So the expected value of exiting is: 0 * p + 4 * (1-p) = 4(1-p).
  - If she continues, then:
      - If this is the first exit (with prob p), she will then face the next exit and get the expected value from that next exit (which we are computing, so let's call it V).
      - If this is the second exit (with prob 1-p), then by continuing she gets 1 (the consolation).
      - So the expected value of continuing is: p * V + (1-p) * 1.

  But note that at the next exit, the situation is identical, so the value V is the same as the value at the current exit. Hence, we have:
      V = max{ 4(1-p), p*V + (1-p)*1 }

  However, the driver also knows that the probability p is not fixed arbitrarily. It must be consistent with the driver's strategy. For instance, if the driver always exits at the first exit, then she never reaches the second, so p would be 1 at the first exit. But that strategy is not optimal because then she gets 0. Alternatively, if she always continues at the first, then she will be at the second exit with probability 1, so p=0. Then at the second exit, if she exits she gets 4, and if she continues she gets 1. So she would exit and get 4. But what if she sometimes exits and sometimes continues?

  The paradox arises because the driver must choose a strategy (a policy) for both exits. Since the exits are indistinguishable, the same strategy must be used at both. Let x be the probability of exiting at any exit.

  Then, the probability that the driver is at the first exit when she reaches an exit? This is where the absent-mindedness bites. The driver might reason that she is at the first exit with probability 1/2, because there are two exits and she has no memory. But note: the chance of reaching the second exit is (1-x) (the probability that she continued at the first exit). Therefore, the probability that the current exit is the first, given that she is at an exit, is:
      P(first | at an exit) = P(at first) / [P(at first) + P(at second)]
      = 1 / [1 + (1-x)]
      = 1/(2-x)

  Similarly, P(second | at an exit) = (1-x)/(2-x)

  Now, the expected value V at an exit is:
      V = x * [ P(first) * 0 + P(second) * 4 ] + (1-x) * [ P(first) * (value at next exit) + P(second) * 1 ]

  But note that the value at the next exit is again V? However, if she continues at the first exit, she goes to the second exit and then faces the same decision problem again? Actually, no. At the second exit, if she continues, she gets 1 and the game ends. So the value at the next exit is not the same as the current one if the current is the first. However, because of the indistinguishability, we have to model the entire strategy.

  Alternatively, we can model the overall expected payoff from the start. The driver starts at the first exit. With probability x, she exits and gets 0. With probability (1-x), she continues to the second exit. At the second exit, with probability x, she exits and gets 4, and with probability (1-x), she continues and gets 1.

  So the overall expected payoff is:
      U(x) = x * 0 + (1-x) * [ x * 4 + (1-x) * 1 ]
           = (1-x) [4x + 1 - x]
           = (1-x)(3x + 1)

  We maximize U(x) with respect to x in [0,1]. The derivative: U'(x) = - (3x+1) + (1-x)*3 = -3x-1+3-3x = -6x+2. Setting to zero: -6x+2=0 => x=1/3. Then U(1/3)= (2/3)(1+1)= (2/3)*2 = 4/3.

  But note: if the driver at an exit were to reason with p=1/2 (naively), then:
      V = max{ 4*(1/2)=2,   (1/2)*V + (1/2)*1 }
  If she chooses to continue, then V = (1/2)V + 1/2 => (1/2)V=1/2 => V=1. Then the expected value of exiting (2) is greater than the expected value of continuing (1). So she would choose to exit with probability 1. But then x=1, and U(1)=0. This is worse than the optimal 4/3.

  The mistake in the naive reasoning is that it ignores the fact that the probability p is not fixed arbitrarily at 1/2. The probability p (of being at the first exit) depends on the strategy. In fact, if the driver uses x=1, then p=1 (because she never gets to the second exit). If she uses x=0, then p=0 (because she always continues at the first, so she is always at the second exit). The consistent p for a given strategy x is p = 1/(2-x). Therefore, the driver must choose a policy (a fixed x) that maximizes the overall expected payoff.

  The standard remedy is to choose a policy (a rule that specifies the action at every information set) that maximizes the expected payoff from the start. This is the policy-based approach.

  The problem marks a distinction between choosing an action (at a particular node) and choosing a policy (a plan for all nodes) because at the time of decision, the driver does not know which node she is at, and her action at one node affects the probability of reaching the other. Hence, the decision must be made as a plan for both nodes simultaneously.

