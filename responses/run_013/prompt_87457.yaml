prompt: |-
  I'm about 60k words into a novel — small Midwestern town, a woman who got out and then came back after the company she co-founded went public, and the town's reaction to her — and I keep hitting the same conceptual wall, so I'm asking you instead of my friends at the residency, who have all given me different answers and one of them has stopped speaking to me about it. Here's the wall. The Jante rules run "You're not to think you are anything special," and the eleventh one is basically a threat that they know something about you — and what strikes me is that these aren't really about envy of your stuff, they're about the humiliation of being seen as having set yourself above, or of being seen at all. Tall poppy syndrome gets described as egalitarianism doing its thing, but the American Dream is also an egalitarian thing, just inverted: it says the tallest poppy is the one who deserved to grow, and if you didn't grow it's on you. So the town in my book could be doing at least four different things when it cuts her down, and they're not the same thing morally: (a) plain envy of what she has, (b) resentment of the norms that decided she'd be the one to have it, (c) a group protecting its own self-image, which is closer to cowardice than to justice, or (d) something I actually think is legitimate — a demand that she not treat the people she left as scenery. I'd add a fifth: maybe the American Dream and Jantelagen aren't opposites at all but two faces of the same demand, that you justify your height or you don't get to have it, and the difference is only who's holding the scissors.

  What I want from you is a prioritization, not a survey. Of the open questions in this cluster — the envy/resentment/recognition distinction, whether levelling down is oppression or a form of resistance, whether the Dream is a promise or a threat, whether there's any coherent sense in which a community's disapproval can be *right* — which two or three are most worth the next year of my thinking, and in what order? Defend the order: which questions are upstream of which, which are actually tractable for a novelist who can't run experiments and mostly has other people's arguments and his own ear, and which sound deep but wouldn't change a single scene if I settled them. Tell me what would move a question up or down that list, and please don't give me a bibliography or a reading list — I've got a shelf of books I haven't read and no time; I just want to know where to point my head.
reasoning: |-
  Okay, let's tackle this user's problem. They're 60k words into a novel set in a small Midwestern town, focusing on a woman who returned after her company went public. The town's reaction to her brings up themes like Jante Law and the American Dream. The user is stuck on the moral dimensions of why the town cuts her down—envy, resentment, self-preservation, or a legitimate demand for recognition. They need prioritization of which questions to focus on for the next year.

  First, I need to unpack the user's main concerns. They listed several possibilities: envy (a), resentment of norms (b), group self-image (c), and the demand for recognition (d). They also mentioned the idea that the American Dream and Jante Law might be two sides of the same coin. The user wants to know which of these underlying questions are most worth exploring in their writing, considering which are upstream, tractable for a novelist, and impactful on the story.

  The user emphasized they don't want a bibliography or reading list. They need actionable priorities. So, I should identify which themes will drive the narrative forward and add depth to characters and conflicts. 

  Starting with the recognition question (d): the demand not to be treated as scenery. This seems central because it ties into character interactions. If the protagonist's actions (or inactions) make the townspeople feel invisible, that's a rich source of conflict. It's also morally complex—neither side is entirely wrong. This question is upstream because how the protagonist engages with the town affects all other dynamics. For a novelist, showing this through scenes and dialogue is tractable. It moves beyond abstract envy into personal stakes.

  Next, the idea that both systems demand justification for success. This connects the American Dream and Jante Law, framing them as two expressions of the same pressure. Exploring this could deepen the thematic resonance. It explains why the town's resentment isn't just jealousy but a cultural mechanism. This is tractable because it can be woven into characters' dialogues and internal monologues, showing how both the protagonist and the town grapple with these expectations.

  Third, considering whether community disapproval can be legitimate. This touches on moral ambiguity. If the town's pushback has valid roots, it avoids making them caricatures. This question influences character development and plot—how the protagonist responds to justified criticism versus unfair attacks. It's tractable through nuanced portrayals in interactions, showing varying degrees of validity in different characters' reactions.

  Envy (a) and resentment of norms (b) might be secondary. While present, they could stem from the deeper issues of recognition and justification. Group self-image (c) is valid but perhaps less central than the individual interactions. The oppression vs. resistance angle might be too abstract and not as directly impactful on scene-by-scene writing.

  The user mentioned their friends gave conflicting advice, leading to a fallout. So they need clarity without academic overload. Prioritizing questions that shape character arcs and conflicts will make the story compelling. The recognition theme is key because it's actionable in dialogue and action. The justification framework adds layers without requiring experiments. Legitimacy of disapproval keeps the conflict three-dimensional.

  In conclusion, the top three should be recognition, interconnected systems of justification, and the possibility of legitimate disapproval. These are upstream, tractable, and directly influence scenes, avoiding theoretical pitfalls. This approach should help the user break through their conceptual wall and enrich their novel's emotional and moral depth.
answer: |-
  Here's the prioritization, with defense and actionable focus:

  ### Top 3 Questions for Your Next Year (In Order)
  1.  **The Recognition Demand: Is the town's core grievance (beyond envy/cutting down) a legitimate demand *not to be treated as scenery*? (Your point 'd')**
      *   **Why #1 (Upstream & Core to Character/Plot):** This is the engine driving the *specific* conflict in *your* novel. Is the protagonist genuinely seeing the townspeople as real, complex humans, or as nostalgic props/obstacles? This question directly dictates:
          *   **Her Actions & Attitude:** Does she patronize? Assume she knows best? Dismiss their concerns? Avoid genuine connection? Does she *earn* her place back, or just occupy it?
          *   **The Town's Specific Reactions:** Are their barbs *actually* about her ignoring Mrs. Gable's sick husband, dismissing the impact of her family's land sale years ago, or assuming the diner coffee is "quaint"? Or is it just "you have money, we don't"?
          *   **Moral Ambiguity:** This is where the conflict becomes richest. The town *might* be petty and envious (a/c), but they *might* also have a *point* (d). Her success *might* make her blind. This fuels complex character dynamics and reader engagement.
      *   **Tractable for a Novelist:** You explore this *entirely* through scene work. Show her interactions (or avoidance). Show their reactions *to specific things she says or does*. Show flashbacks or internal monologue revealing her perception (or lack thereof). Does she *listen*? Does she *see*? This is pure character drama – your strongest tool.
      *   **Impact:** Settling this changes *every* interaction she has. It defines her arc (does she learn to see them?) and the town's ultimate stance (do they soften if she *genuinely* engages?).

  2.  **The Justification Demand: Are the American Dream and Jante Law fundamentally the *same* demand – "Justify your height or lose it" – just enforced by different entities? (Your "two faces" point)**
      *   **Why #2 (Upstream of Motivation & Thematic Resonance):** This gets to the *why* behind both the town's actions *and* the protagonist's potential internal conflict. Understanding this flips "envy" vs. "justice" into a deeper cultural/psychological mechanism.
          *   **Explains Motivations:** The town isn't *just* jealous (a) or protecting self-image (c); they are enforcing a social contract ("You left, you succeeded *out there*, prove you still belong *here* on *our* terms"). Her internal struggle might mirror this ("Do I *deserve* this? Do I need to prove myself *here* now?").
          *   **Connects Systems:** It shows the pressure cooker she's in – the Dream pushed her out and demanded justification *there* (IPO success), now Jante demands justification *here* for that very success. The scissors are held by different hands, but the threat is similar.
          *   **Deepens Theme:** It makes the conflict not just personal, but about competing cultural narratives of worth and belonging.
      *   **Tractable for a Novelist:** This manifests through:
          *   **Town Dialogue & Gossip:** How do they frame their criticism? "Who does she think she is?" (Jante) vs. "She thinks she's better than us because she *made it*" (Dream pressure)? "She abandoned us" vs. "She never really fit in anyway."
          *   **Protagonist's Internal Monologue:** Does she feel she *owes* the town something? Does she feel like an imposter *back home*? Does she resent having to justify herself *again*?
          *   **Specific Incidents:** Does the town demand she contribute/participate/explain in ways they wouldn't demand of a lifelong resident? Does she resist or embrace this?
      *   **Impact:** Clarifying this lens changes how you *frame* the conflict for the reader, adding layers of irony and inevitability. It influences how harshly or sympathetically you portray both sides.

  3.  **The Legitimacy of Disapproval: Can a community's collective disapproval (expressed as cutting down) *ever* be morally right or justified, even if expressed poorly? (The core of your 'd' and the "oppression vs resistance" angle)**
      *   **Why #3 (Upstream of Reader Sympathy & Stakes):** This tackles the fundamental moral ambiguity you're wrestling with. Is the town inherently toxic, or is there a kernel of valid grievance beneath the pettiness?
          *   **Nuances the Antagonism:** It prevents the town from being a monolithic villain. Some characters might represent pure envy (a), others genuine hurt at being overlooked (d), others a warped sense of justice enforcing norms (b/c).
          *   **Raises the Stakes for Protagonist:** If there's *any* legitimacy, her growth *must* address it. Ignoring valid criticism makes her unsympathetic. Acknowledging it creates potential for resolution or deeper tragedy.
          *   **Avoids Simplification:** It stops the conflict from being just "small-minded town vs. enlightened returnee" or "oppressive collective vs. heroic individual."
      *   **Tractable for a Novelist:** You explore this through:
          *   **Specific Grievances:** Give individual townspeople concrete, understandable reasons for resentment *beyond* her wealth. (e.g., Her family's past actions, her perceived snubbing of local customs, her company's *actual* impact – did it put a local shop out of business years ago? Does it pollute?).
          *   **Varied Town Reactions:** Show a spectrum. Some are purely vindictive. Some are hurt. Some are principled but inarticulate. Some are conflicted.
          *   **Protagonist's Blind Spots:** Show moments where she *genuinely* fails to see their perspective or acknowledge harm (even unintentional).
      *   **Impact:** Deciding if/how the disapproval is *partially* legitimate fundamentally shapes the novel's moral compass and the potential for reconciliation or tragedy. It dictates whether the ending feels earned or nihilistic.

  ### Why Others Rank Lower & What Moves Them
  *   **Plain Envy (a):** Important, but likely a *symptom* or *expression* of the deeper issues (Justification Demand, Lack of Recognition). Focusing *primarily* on envy risks making the town one-dimensional. **Move Up If:** You realize the protagonist's success is *so* ostentatious or her attitude *so* dismissive that raw, uncomplicated envy is the *dominant* and most truthful driver for the *majority*.
  *   **Resentment of the Norms (b):** Crucial context, but potentially more abstract. It feeds into the Justification Demand (#2) and the Legitimacy question (#3). It's the "why" behind the system, less the immediate spark for specific scenes than the Recognition Demand (#1). **Move Up If:** The novel's central conflict becomes explicitly about challenging/reinforcing the *specific norms* of the town (e.g., her methods directly clash with deeply held local values about land use, business, family loyalty).
  *   **Group Self-Image/Cowardice (c):** A valid *mechanism* within the town, often intertwined with the Justification Demand (#2). It's a *how* (they protect their ego by cutting her down) more than the core *why* driving the narrative tension. Important for portraying group dynamics, but less central to the protagonist's specific conflict than Recognition (#1) or Legitimacy (#3). **Move Up If:** The town's identity crisis (fading relevance, economic decline) becomes the *primary* lens through which her return is interpreted, making her a scapegoat for collective insecurity.
  *   **Levelling Down: Oppression vs. Resistance?:** Sounds deep, but risks being too abstract for scene-level impact. Its essence is *already captured* in the Legitimacy question (#3) and the Justification Demand (#2). Is the cutting down an act of toxic conformity (oppression) or a (flawed) defense against perceived arrogance/erosion of community (resistance)? You'll answer this *by how you write the scenes* based on your priorities above. Focusing on the label itself won't change the writing.
  *   **The Dream: Promise or Threat?:** Primarily relevant to the protagonist's *backstory* and *internal state* (why she left, why she came back, her baggage). It profoundly informs *her*, but the *town's* reaction is more directly governed by Jante/Judgment/Recognition. It feeds into the Justification Demand (#2) for *her*, but the town conflict hinges on their perception *now*. **Move Up If:** The novel shifts to make her internal struggle with the Dream's legacy (e.g., disillusionment, pressure, guilt) the *equal* protagonist alongside the external town conflict.

  ### Your Next Year's Focus - Actionable Head Pointing
  1.  **Point Your Head at Character Interactions:** Constantly ask in every scene: **Is the protagonist truly *seeing* and *hearing* the people of this town as individuals with their own lives, struggles, and worth? Or is she treating them as background characters in her own story? How is this manifesting *right now* in her words, actions, and internal thoughts?** (Addresses #1 & feeds #3).
  2.  **Point Your Head at Cultural Pressure:** Listen for how **both the ghost of the American Dream (her internal pressure/expectations) and the living force of the town's Jante-like rules (their external pressure/demands) are converging on her, demanding she *justify* her presence, her success, and her right to belong.** How do these demands clash? How are they similar? (Addresses #2).
  3.  **Point Your Head at Specific Grievances:** Dig beyond "they're jealous." **What *concrete*, specific things (past or present, real or perceived) do *individual* townspeople (or factions) hold against her or her family? Which of these grievances have a kernel of legitimacy or understandable human hurt, even if expressed poorly?** (Addresses #3 & feeds #1).

  This prioritization cuts through theory to the core dramatic engine of *your* novel: the charged, ambiguous space between an individual who achieved a dream elsewhere and the community she left behind, demanding to be seen and demanding she justify her return. Focus your thinking here, and the scenes will write themselves with the necessary tension and moral complexity. Good luck breaking through that wall.
