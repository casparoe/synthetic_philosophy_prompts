  ### **Leaves (Positions)**
  - **A: Age-Period Reductionism**  
    Generations aren't real; differences attributed to them are just age or period effects.  
  - **B: Essentialism**  
    Generations are real only if they have a strict essence (e.g., all Boomers are optimistic); cutoffs like 1996 vs. 1997 undermine this.  
  - **C: Cluster Skepticism**  
    Generations aren't real kinds; they're probabilistic clusters with too many exceptions (e.g., non-techy Millennial) to be robust.  
  - **D: Strong Constructionism**  
    Generations become real through labeling and self-awareness; applying the label changes people (e.g., "Gen Z" adoption shapes behavior).  
  - **E: Nominalism**  
    Generations are only identities (e.g., self-aware "Millennials"); they don't explain behavior or represent a deeper kind.  
  - **F: Label Dependence**  
    Generations exist only as long as the label is used (like money); without it, shared traits fade.  
  - **G: Gradient Realism**  
    Generations are real only for fine-grained cohorts (e.g., 5-year buckets); broad labels (e.g., 20-year) are arbitrary and less valid.  
  - **H: Historical Kinds**  
    Generations are real kinds based on shared formative experiences (e.g., Boomers and post-war prosperity); they persist even with variation.  

