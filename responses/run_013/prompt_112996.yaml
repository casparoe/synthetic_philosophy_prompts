  ### **Decision Tree: Are Generations Real Kinds?**

  **Q1 (Age-Period-Cohort Tie):**  
  Imagine a study shows 20-year-olds today are more anxious than 60-year-olds. Could this difference be fully explained by age (e.g., youth) or the current year (e.g., 2023 events), without needing birth year?  
  - **Yes:** → Skepticism is plausible; go to Q2.  
  - **No:** → Cohort effects may be real; go to Q3.  

  **Q2 (Single Cross-Section Assumption):**  
  With only one survey year, age + period = cohort (e.g., a 20-year-old in 2023 must be born in 2003). To break this tie, must we assume cohort effects exist?  
  - **Yes:** → Go to Q3.  
  - **No:** → **Leaf A: Age-Period Reductionism** (Generations aren't real; they're just age/period effects in disguise).  

  **Q3 (Stereotype Outlier):**  
  Consider someone born in 1990 who acts nothing like the "Millennial" stereotype (e.g., hates technology, prefers newspapers). Does this person disprove generations as real kinds?  
  - **Yes:** → Go to Q4.  
  - **No:** → Go to Q5.  

  **Q4 (Essence Requirement):**  
  If generations are real, must every member share a core trait (e.g., all Gen Z are digital natives)?  
  - **Yes:** → **Leaf B: Essentialism** (Generations are real only if they have a strict essence; arbitrary cutoffs like 1996 vs. 1997 are invalid).  
  - **No:** → **Leaf C: Cluster Skepticism** (Generations are arbitrary if they allow many exceptions; they're just fuzzy buckets).  

  **Q5 (Self-Awareness):**  
  For the December 1996 (Millennial) vs. January 1997 (Gen Z) boundary: if the 1997 group identifies as Gen Z and acts on it, but the 1996 group doesn't, does that make Gen Z more real?  
  - **Yes:** → Go to Q6.  
  - **No:** → Go to Q7.  

  **Q6 (Performative Labeling):**  
  If media and schools start calling people "Gen Z," does this change their behavior (e.g., they adopt "Gen Z" traits because of the label)?  
  - **Yes:** → **Leaf D: Strong Constructionism** (Generations become real through labeling and self-awareness; labels create the kind).  
  - **No:** → **Leaf E: Nominalism** (Generations are just names for identities; they don't explain behavior).  

  **Q7 (Label Survival):**  
  If we erased the label "Boomer," would the group born 1946–1964 still share traits (e.g., economic optimism) due to their shared past (e.g., post-war prosperity)?  
  - **Yes:** → Go to Q8.  
  - **No:** → **Leaf F: Label Dependence** (Generations only exist if labeled; like money, they vanish if unused).  

  **Q8 (Granularity vs. Generality):**  
  If 5-year buckets (e.g., 1990–1994) predict behavior better than 20-year ones (e.g., Millennials: 1981–1996), does that make 20-year generations less real?  
  - **Yes:** → **Leaf G: Gradient Realism** (Generations are real only for narrow cohorts; broad ones are overgeneralized).  
  - **No:** → **Leaf H: Historical Kinds** (Broad generations capture cultural shifts; internal variation doesn't negate reality).  

