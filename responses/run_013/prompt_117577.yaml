  For authenticity, one character should recognize the game yet still participate. Maybe Dr. Aris Thorne, who studies behavioral traps? His internal monologue could show conscious rationalization: "I know this is irrational system-wide, but for me personally right now..." That satisfies the "eyes open" requirement without breaking plausibility. 

