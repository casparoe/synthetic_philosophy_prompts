answer: |-
  The coffee room held the particular quiet that precedes committee meetings, a silence thick with unsaid calculations. Dr. Aris Thorne stirred powdered creamer into his mug, watching the clumps dissolve. Lena Voss stood by the window, pretending to examine the parking lot. Between them, on the scuffed laminate table, sat the object: a single, crisp one-dollar bill, weighted down by a chipped departmental mug. Beside it lay a clipboard and pen.

  Thorne knew the ritual. The Bureau Head, Everett, loved his little 'motivational exercises'. This month: auctioning off discretionary funds. The rules, scrawled on the clipboard, were brutally simple. Highest bidder pays their bid from their project’s quarterly slush fund, receives the dollar. Second-highest bidder pays their last bid, receives nothing. Bids in five-cent increments. Starting bid: five cents. Everett had beamed while explaining, a man pleased with his own cleverness. Thorne had felt a cold recognition settle in his gut. The Dollar Auction. A textbook escalation trap.

  He watched Voss’s reflection in the window glass. Ambitious, sharp, newly promoted. Her project, like his, was under review. Discretionary funds were a pittance, but visible spending demonstrated decisiveness, control – qualities the higher-ups supposedly valued. Losing here, especially to him, wouldn't be catastrophic financially. But the optics? Being the one who blinked? Paying for nothing? That could echo in budget meetings, promotion whispers. Everett’s games were never *just* games.

  "Shall we?" Voss turned, her smile tight. She picked up the pen.

  "After you," Thorne gestured.

  She wrote: *$0.05 - Voss*.

  Thorne added: *$0.10 - Thorne*. Harmless. Rational. A five-cent gamble for a dollar. Pure profit, if Voss folded now. He knew she wouldn't.

  *$0.15 - Voss*.

  *$0.20 - Thorne*.

  The increments were small, insignificant against their project budgets. Each bid felt like a nudge, a test of resolve. He was buying the chance to demonstrate strength, to deny Voss a cheap win. She was doing the same. The dollar itself was already irrelevant; what mattered was the ledger Everett would see, the narrative of who backed down.

  *$0.50 - Voss*. Her pen tapped the clipboard.

  Thorne hesitated. This was the inflection point. The dollar's face value. Bid $0.55, win the dollar, net forty-five cents for his project. Or let Voss have it for fifty cents. But letting her win felt like conceding ground. Paying fifty cents for nothing felt worse – a public admission of poor judgment, a waste. He wrote *$0.55 - Thorne*. He won. He paid fifty-five cents, received a dollar. Net gain: forty-five cents. Rational.

  Voss didn't flinch. *$0.60 - Voss*.

  Thorne stared. Now, *he* was the second-highest bidder. His options: Eat the fifty-five-cent loss. Or bid sixty-five cents. If he bid sixty-five and won, he'd pay sixty-five cents for the dollar, netting thirty-five cents. Worse than his initial win, but better than losing fifty-five cents for nothing. And he’d win. Again. He wrote *$0.65 - Thorne*. He won. Net gain down to thirty-five cents. Voss lost sixty cents. Her expression remained neutral, but her knuckles were white on the pen.

  *$0.70 - Voss*.

  The cold logic gripped Thorne. He was now out sixty-five cents if he quit. Bidding seventy-five cents would mean paying seventy-five for the dollar, netting twenty-five cents. A paltry return, but twenty-five cents was better than *losing* sixty-five. Quitting meant funding Everett’s coffee fund with sixty-five cents of his project’s money, while Voss paid seventy cents and got the dollar. His project took a pointless hit. He looked weak. He wrote *$0.75 - Thorne*. Net gain: twenty-five cents. Voss’s loss: seventy cents. The air hummed.

  *$0.80 - Voss*.

  Thorne felt a grim fascination. He knew the descent. He’d lectured on it. Sunk costs weren’t supposed to dictate future actions, but here, the cost of *inaction* – the guaranteed loss – felt heavier. Pay eighty cents for nothing? Or bid eighty-five. Win, pay eighty-five, net fifteen cents. Terrible, but fifteen cents beats losing eighty. He wrote *$0.85 - Thorne*. He won. Net gain: fifteen cents. Voss lost eighty cents.

  *$0.90 - Voss*.

  Her face was a mask. Thorne admired her composure, even as he recognized the identical trap closing around her. She was now facing a ninety-cent loss for nothing. Bidding ninety-five would net her five cents if she won. Five cents was better than losing ninety. She was buying the avoidance of that guaranteed, visible failure. He understood perfectly. He’d do the same. *$0.95 - Thorne*. Net gain: five cents. Voss’s cumulative loss: ninety cents.

  *$1.00 - Voss*.

  A dollar bid for a dollar bill. Thorne was the second-highest bidder. He would lose ninety-five cents if he quit now. Paying ninety-five cents for nothing. His name beside that number on Everett’s report. Or… he could bid one dollar and five cents. If he won, he’d pay $1.05 for a dollar, netting a *loss* of five cents. A five-cent loss. But… compare it to the alternative: a ninety-five-cent loss. Losing five cents was vastly preferable to losing ninety-five cents. It wasn’t profit, but it was damage control. Minimizing the visible deficit. Denying Voss the satisfaction of making him eat the near-total loss. Winning meant she lost her entire dollar bid and got nothing. That had value too, in this silent war of perceptions. Winning meant *she* looked like the one who’d wasted project funds, chasing a lost cause to the bitter end. He needed that narrative counterpoint. The Bureau watched. Budgets were reviewed. Promotion cases were built on thin reeds like this.

  Voss met his eyes. There was no anger, only a chilling focus. She understood the math too. She knew he was calculating the lesser loss, the preservation of standing, the denial of her victory. She knew he would bid. Because she would, in his place. It wasn’t about the dollar. It hadn't been for a while. It was about the ledger, the report, the unspoken scorecard Everett maintained. It was about not being the one who flinched in front of the other. Paying $1.05 to avoid a ninety-five-cent loss and to inflict a dollar loss on Voss? For Thorne, with his project's funds, it was the locally rational choice. He picked up the pen. The plastic felt cold. He wrote *$1.05 - Thorne*.

  He didn't look at Voss. He watched his own hand. The bid was placed. He had just committed his project to paying one dollar and five cents for a one-dollar bill. A net loss of five cents. But he was now the high bidder. Voss was the second-highest. She faced a guaranteed loss of her last bid: one dollar. Paid for nothing. Utterly visible. Unless she bid one dollar and ten cents. If she bid $1.10 and won, she’d pay $1.10 for the dollar, netting a loss of ten cents. Compare *that* to the alternative: losing a full dollar for nothing. Losing ten cents was preferable to losing a dollar. And she would win. She would inflict a $1.05 loss on him. She would demonstrate resilience, a refusal to be the one who ultimately folded. The five-cent increments were tiny, meaningless against the larger budgets, yet each step deepened the commitment, refined the focus on the immediate, local rationality of avoiding the catastrophic *looking* like the bigger loser.

  He could feel her stillness beside him. The pen lay on the clipboard. The crisp dollar bill sat under the chipped mug, absurdly insignificant. Thorne waited. The coffee room was very quiet. He wondered, clinically, how high the numbers would go before the sheer absurdity outweighed the immediate, personal, rational fear of being the one who paid more for nothing. He knew the theory. He knew the trap. He was still inside it, and the next move, whether his or hers, would be perfectly logical.
