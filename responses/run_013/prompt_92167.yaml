  Alright, I've settled on a take about the two-envelope thing and I want you to try to wreck it. My take: there's no deep paradox here, it's just a bad conditional expectation. The switching argument -- you open your envelope, see some amount, figure the other is equally likely to be half or double, so its expected value is 1.25x what you're holding -- only goes through if the prior over the smaller amount is flat, and a flat prior over an unbounded quantity isn't a probability distribution. With any real distribution, seeing the number tells you something about whether you're holding the smaller one, and that's the whole story. No leftover mystery.

  So what should make me drop this? I want the actual defeaters, ranked, and I don't want the lazy version where someone just waves at the unopened case -- I want the specific cases my line can't absorb.

  Here's the one that keeps nagging me. A friend built a version where the smaller amount is 2^n, with n drawn from a distribution that decays slowly -- each term more than half the previous one, so the probabilities still sum to 1 but the mean of 2^n is infinite. He says that in this version it's better to swap whatever number you open to, every single time, and that this kills my "it's just an improper prior" move because his prior is perfectly proper. Is he right? And if he is, does that finish my view off or just make it more expensive to hold? My gut says the improper prior was never the real culprit and the real culprit is something about infinite expectations -- but I can't tell if that's a genuine rescue or a retreat into a narrower claim.

  Also, what does my view have to predict that a rival resolution doesn't? Specifically: is there any case where the switching argument is actually sound, and my diagnosis would wrongly condemn it? If my line can't seperate a real expected-value advantage from the fallacious one, that seems fatal, and I want to know whether that ever actually happens.

  And be straight with me about whether this has quietly become "any surprising expected-value result is a modeling error" -- because that's unfalsifiable and kind of worthless. Which of these defeaters would a committed deflationist like me concede, and which would I wave away? Rank them fatal to merely annoying, and tell me which one you'd personally take most seriously.
