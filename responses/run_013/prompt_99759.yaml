prompt: |-
  So I write about science and ideas for a general-audience outlet and I've fallen down a rabbit hole on statues, street names, all of it. What got me: my city council just passed an ordinance saying every publicly owned monument or street name has to go through a review every 25 years, and if nobody can make the affirmative case for it again, it comes down. And nobody in any of the coverage could say what that case would even look like — what the review board is actually supposed to be checking. Everyone argues one statue at a time and nobody has the standard.

  Two other wrinkles from the same ordinance, because they're what made me think this is a real philosophy problem and not just local politics. First, a removed statue's plinth has to stand empty for a year before anything can replace it — the sponsor said it was so people could sit with the absence, which I think is either profround or a load of, you know. Second, an amendment that would ban monuments to people who are still alive. Both passed, nobody's sure what either actually does.

  So before I write the big piece I want the spec, not the verdicts. What would a theory of commemoration — something that tells you when a public monument should stay up, come down, or be altered — actually have to get right to be any good? Write me the desiderata.

  Give me the cases it has to handle and why each is genuinely hard — the ordinance cases above, plus whatever else the theory can't dodge: the scientist who did real good and real harm, the street named for someone whose fame has simply faded, the monument that's memorializing victims rather than honoring a hero, the one that's really a piece of public art nobody reads as a monument at all. Then the distinctions it can't be allowed to collapse — honoring vs. remembering vs. teaching, the person vs. the event, who the thing is addressed to (the dead, the neighborhood, or the future). And any result it can't contradict, like what we actually know about the historical figure, or about who even sees the thing.

  I want to know which of these are real requirements and which are just one camp's taste, which are non-negotiable, and — the part I most care about — whether any two of them can't both be satisfied at once, because if so that's the story. And tell me which single requirement does the most to rule theories out. You can skip scoring the famous schools against the list, I'll do that in the piece. A table is fine if it helps.
reasoning: |-
  Okay, let me tackle this query about developing a robust theory of commemoration. The user writes about science and ideas for a general audience and is deep into the topic of public monuments and street names. Their city council passed an ordinance requiring reviews every 25 years, with unique provisions like leaving plinths empty for a year and banning monuments to living people. They want to explore the philosophical foundations before writing their piece.

  First, I need to understand the core request: they want desiderata for a theory of commemoration—what it must handle, what distinctions it must maintain, and any inherent contradictions. The examples they provided include complex cases like figures with mixed legacies, forgotten honorees, memorials vs. monuments, and abstract public art.

  Key challenges jump out. The 25-year review cycle raises questions about criteria: Is it about historical impact? Current values? The plinth provision introduces tension between reflection and public space utility. Banning living honorees touches on premature canonization versus acknowledging contemporary contributions.

  The hard cases they mentioned are crucial. A scientist who advanced knowledge but enabled harm forces us to weigh different dimensions of legacy. Faded fame tests whether commemoration requires ongoing recognition. Victim memorials differ from hero monuments in purpose and emotional resonance. Abstract art as unintentional monument blurs intentionality.

  Distinctions matter greatly. Honoring vs. remembering vs. teaching serve different functions. The subject (person/event) and audience (dead/community/future) shape the commemorative act. A theory can't conflate these without losing precision.

  Non-negotiables emerge. Any theory must ground itself in verifiable history, acknowledge the diversity of viewers' experiences, and accept that commemoration serves public purposes—it's not private sentiment. Crucially, it must recognize that values change over time, making commemoration inherently provisional.

  Now, contradictions. The deepest tension is between pluralism (reflecting diverse perspectives) and coherence (avoiding a patchwork of conflicting symbols). The review process might also clash with civic continuity if reinterpretation happens too frequently. And the plinth provision's reflective goal might conflict with practical space use.

  The single most demanding requirement is pluralism. In divided societies, satisfying all groups equally while maintaining a unified civic identity is nearly impossible. This tension is where the richest insights lie for the user's piece.

  I'll structure this by outlining the desiderata categories (core functions, distinctions, constraints), then unpack the hard cases and contradictions. The tables in the response help crystallize these relationships. The goal isn't to solve the tensions but to map them clearly—that's where the story is.
answer: |-
  Here's a framework for the "spec" of a robust theory of commemoration, built around your core question: **What *must* a good theory of public commemoration get right?** It focuses on desiderata, hard cases, critical distinctions, non-negotiables, and inherent tensions.

  **I. Core Desiderata (What the Theory Must Get Right)**

  A theory of commemoration must provide principled, applicable answers to these fundamental questions:

  1.  **Purpose:** What is the *primary function* of *this specific* commemoration? (e.g., Honor? Remember? Warn? Teach? Beautify? Unify? Express civic identity?)
  2.  **Subject:** What is being commemorated? (e.g., A person? An event? An idea? A group? A sacrifice? An achievement? A loss?)
  3.  **Audience:** Who is the commemoration *for*? (e.g., The honored dead? The contemporary community? Future generations? Victims? Descendants? Tourists?)
  4.  **Context:** How does the commemoration relate to its *specific* physical, historical, and social setting? (Location matters; history evolves).
  5.  **Values:** What values does the commemoration embody or promote? Are these values consistent with the community *now* and the stated purpose?
  6.  **Impact:** What is the actual effect of the commemoration on those who encounter it? (Does it achieve its purpose? Does it cause harm? Is it ignored?)
  7.  **Legitimacy:** By what process and authority was the commemoration established? Who gets to decide its fate? (This ties into democratic principles).
  8.  **Change:** How does the theory account for the fact that communities, values, historical understanding, and the meaning of symbols *change over time*?

  **II. Hard Cases & Why They're Hard (The Theory's Test Suite)**

  | Case                                      | Why It's Hard                                                                                                                                | Core Questions Stressed                                          |
  | :---------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------- |
  | **The 25-Year Review**                    | Defining the "affirmative case" is ambiguous (Historical significance? Current values alignment? Aesthetic merit? Ongoing relevance?). Who decides? What burden of proof? Risk of erasure vs. ossification. | Purpose, Values, Change, Legitimacy, Context                     |
  | **Empty Plinth (Absence)**                | Is "sitting with absence" a valid public purpose? Does it achieve reflection or just create blight? How long is meaningful? Conflicts with utility of public space. | Purpose, Impact, Context                                         |
  | **Ban on Living Honorees**                | Avoids premature canonization/cults of personality vs. denying recognition to contemporary contributors. Where's the line? (Is naming a library after a living donor different from a statue?) | Subject, Purpose, Change, Values (prematurity vs. timeliness)    |
  | **Mixed Legacy (e.g., Scientist)**        | How to weigh profound contributions against significant harms? Does context matter (e.g., era norms)? Can commemoration acknowledge both? | Subject, Values, Purpose (teaching complexity vs. pure honor?) |
  | **Faded Fame (Street Name)**              | What is the threshold of ongoing relevance? Does historical significance alone suffice if unrecognized? Does renaming cause unnecessary disruption? | Purpose, Change, Impact, Context (utility as signpost vs. history) |
  | **Victim Memorial (vs. Hero Monument)**   | Purpose shifts from celebration to remembrance/warning/mourning. Different emotional resonance. Is the criteria for staying the same? | Purpose, Subject, Audience, Impact                               |
  | **Artwork as Unintentional Monument**     | Artist's intent vs. public interpretation/use. Does public perception *make* it a monument? How to review if not intended as commemoration? | Purpose, Subject, Impact                                         |
  | **Deeply Divisive Figure**                | Can a commemoration serve a unifying civic purpose if a significant portion of the community finds it actively offensive or harmful? | Values, Impact, Purpose, Legitimacy (whose community?)           |

  **III. Critical Distinctions the Theory MUST Maintain**

  *   **Honoring vs. Remembering vs. Teaching:**
      *   *Honoring* implies celebration, approval, and emulation.
      *   *Remembering* is about acknowledging existence, impact, or loss, without necessarily endorsing.
      *   *Teaching* focuses on conveying historical context, complexity, or lessons (which may involve critical examination).
      *   **Why Collapse is Fatal:** Conflating them leads to inappropriate criteria (e.g., judging a Holocaust memorial by whether it "honors" victims, or demanding a critical lesson from a simple honorific statue).
  *   **The Person vs. The Idea/Event:**
      *   Is the focus the individual's life/actions, or the broader event/concept they represent (e.g., "Founding Father" vs. "The Revolution")?
      *   **Why Collapse is Fatal:** Critiques of the person may not negate the significance of the event/idea, and vice-versa. Requires different evaluation.
  *   **Audience: The Dead, The Present, The Future:**
      *   Is it for the comfort of ancestors? For current civic identity/values? As a lesson or artifact for future generations?
      *   **Why Collapse is Fatal:** Prioritizing one audience can completely change the justification and criteria (e.g., "They wanted it" vs. "It teaches us now" vs. "It shows future generations who we were").
  *   **Historical Accuracy vs. Commemorative Intent:**
      *   The monument/marker makes claims (explicit or implicit) about history. These must be supportable, even if simplified.
      *   **Why Collapse is Fatal:** A theory that ignores factual accuracy allows harmful myths to be perpetuated. One that demands exhaustive nuance may make public commemoration impossible.

  **IV. Non-Negotiable Requirements (Not Mere Taste)**

  1.  **Historical Fidelity (Minimum):** Cannot *contradict* well-established, significant historical facts. It can simplify, focus, or interpret, but not fabricate or deny core truths relevant to its subject/purpose.
  2.  **Acknowledgment of Viewer Diversity:** Must account for the fact that different people/groups experience the commemoration differently based on identity, history, and perspective. Impact isn't monolithic.
  3.  **Public Purpose:** Commemoration in public space must serve a discernible public, civic, or communal function, not purely private sentiment or uncritical veneration.
  4.  **Process Legitimacy:** The process for establishing, reviewing, altering, or removing must be transparent, inclusive (within reason), and grounded in democratic or widely accepted civic principles. Arbitrary decisions undermine public trust.
  5.  **Acknowledgment of Temporal Change:** The theory *must* explicitly incorporate the reality that meaning and relevance change over time. It cannot assume commemoration is eternally fixed.

  **V. Inherent Tensions & Contradictions (Where the Story Lies)**

  1.  **Pluralism vs. Coherence:** Can a single theory accommodate vastly different cultural perspectives on history, honor, and memory *within one civic space* without becoming incoherent or privileging one narrative? Satisfying diverse communities simultaneously may be impossible.
  2.  **Stability (Civic Continuity) vs. Responsiveness (Reflecting Change):** The 25-year review embodies this. How often *should* commemoration be re-evaluated? Constant flux erodes shared landmarks; stagnation ossifies potentially harmful symbols. The "empty plinth" tries to force responsiveness but clashes with stability/utility.
  3.  **Honoring Complexity vs. Communicating Clearly:** Can a monument effectively teach the full nuance of a mixed legacy or a horrific event? Public commemoration often relies on simplicity and symbolism, which inherently flattens complexity. Detailed plaques or context often go unread.
  4.  **The Empty Plinth's Goal vs. Public Space Utility:** The intended purpose (meaningful reflection on absence) directly conflicts with the practical function of public space (use, beauty, navigation, positive civic expression). One year is an arbitrary duration; its effectiveness is highly subjective and likely uneven.
  5.  **Historical Significance (Past Impact) vs. Current Values Alignment:** A figure/event might be undeniably historically significant but embody values now considered abhorrent. The theory needs a way to weigh past impact against present harm. Does significance *require* alignment, or can it coexist with condemnation? (This is the core tension in most statue debates).

  **The Single Most Demanding Requirement: Pluralism.**

  In a diverse, often divided society, the requirement that a theory must **meaningfully acknowledge and accommodate vastly different historical experiences, cultural values, and perspectives on commemoration within a single civic framework** is arguably the most difficult to satisfy. It constantly strains against:
  *   The desire for a coherent civic narrative.
  *   The need for clear criteria (which might inherently favor one perspective).
  *   The challenge of defining the relevant "community."
  *   The emotional weight attached to symbols.

  **Why This Framework Helps Your Piece:**

  This spec provides the concrete yardstick you need. When you examine specific arguments (for keeping Columbus up, for renaming schools, for the empty plinth), ask:
  *   Which desiderata are they prioritizing/ignoring?
  *   How do they handle the hard cases?
  *   Are they collapsing critical distinctions?
  *   Do they violate non-negotiables?
  *   Which inherent tensions are they trying (and perhaps failing) to resolve?

  The ordinance's ambiguities (the "affirmative case," the plinth's purpose, the living ban) highlight the *lack* of a shared theory. The story lies in exploring why these questions are philosophically fraught and practically messy, revealing the deep tensions – especially **Pluralism vs. Coherence** and **Stability vs. Responsiveness** – that any policy or theory must grapple with, but can never fully resolve.
