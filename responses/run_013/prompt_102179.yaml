prompt: |-
  Hey — I'm taking a philosophy of biology module and we just did the units of selection debate (genes vs individuals vs groups) and honestly it feels alot like everyone's just relabeling the same maths to get the answer they wanted. I want one worked case I can actually argue about, so could you build me a thought experiment to spec?

  Spec: one heritable trait in a plausible real organism, no scifi and no invented biology, such that (1) selection at the level of the individual is against the trait — carriers leave fewer offspring than non-carriers, all else equal; (2) selection at the level of the group is also against it — groups with more carriers do worse (die out, split less, whatever you like); (3) the allele for the trait still climbs in frequency across the whole population. The engine behind (3) has to be competition between alleles inside the individual, i.e. something that biases its own transmission, rather than a benefit to anybody — so no cop out where it secretly helps relatives after all.

  Then do the analysis: name the trait and the allele, give the verdict at each level and why, and say which definition of "a unit of selection" you're leaning on when you say the gene wins here. Tell me which feature of the case is doing the work and what happens if I remove it. And finish with how a group selectionist would push back — I suspect they'd say your gene-level story is just transmission bias and not selection at all, so tell me if that's right and whether the case survives it.
