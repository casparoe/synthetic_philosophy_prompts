prompt: |-
  Hi — I'm in my third year and I've been told to lead the seminar discussion for the consent week of my ethics-of-law course, and I want to bring a decision tree instead of the usual slide with the three conditions of informed consent on it. The reason is that everyone in my tutorial can recite the three conditions and then we spend the whole hour disagreeing about every hard case anyway, which makes me think the conditions arn't where the action actually is.

  So: can you build me a decision tree that goes from questions anyone could answer about concrete cases to the named positions on what makes consent valid? I want the branch nodes to be the questions people really come apart on, not the standard doctrine. Roughly the distinctions I care about:

  - What kind of thing is a valid consent — a mental state (they really did agree, even if they never said so), a communicative act (it has to be given or at least expressed somehow), or a normative power (it's the thing that changes what others are permitted to do to you)? And a related one: does valid consent make the act permissible, or could you validly consent to something it's still wrong for the other person to do?

  - Coercion, and specifically the baseline problem. When someone says 'I'll do X unless you do Y', what do you compare against to decide whether that's a threat or just an offer? What would have happened anyway if they'd said nothing, what's statistically normal, or what the person making the proposal morally owes you? I want this as a branch node because I've noticed the same case gets called coercive or not depending only on which baseline people are quietly using.

  - Deception: does the lie have to be about the nature of the act itself, or does being misled about something peripheral (the other person's motives, how much they're being paid, whether they'll still respect you afterwards) also void consent? And does it matter whether they would have refused had they known, or only whether they were misled about something they cared about?

  - Competence: fixed threshold versus decision-relative (the same person can be competent to consent to a haircut and not to a mortgage), and whether competence is about understanding the facts or about being able to weigh them.

  Cases I want the tree to have to handle, because these are the ones that split my tutorial: someone threatens to tell the truth about your affair unless you lend them money (true disclosure, but no right to make that threat); a lawful job offer that's awful but better than every alternative; a surgeon who truthfully lists the complication rates but presents them in a way that leaves the patient underestimating them; someone who agrees to sex while drunk and is glad about it sober; a patient with early dementia who can restate the procedure but can't compare it to the alternatives; a blanket advance consent to whatever a future doctor thinks best.

  What I need: a tree with 4-6 levels and 8-12 leaves, each leaf named (or marked unnamed if nobody really holds it), every branch node phrased as something answerable without already knowing the label it leads to, and one sentence per leaf on its most awkward commitment. Also please flag (a) any leaves the tree can't separate and why, and (b) any combinations of answers that come out empty — is that because the view is incoherent, or just that nobody's bothered to defend it? Keep it to stuff a second-year can follow; don't assume we've read alot beyond the standard consent material.
reasoning: |-
  Hmm, the user is a third-year law student tasked with leading a seminar on consent ethics. They want to move beyond rote recitation of the three conditions (informed, voluntary, competent) by creating a decision tree that surfaces underlying disagreements in hard cases. 

  Key observations about their needs:
  - Frustration with superficial debates where everyone knows doctrine but can't apply it consistently
  - Wants concrete branching questions that force engagement with philosophical divides (mental state vs performative vs normative theories of consent)
  - Specifically requests coverage of coercion baselines, deception scope, and competence thresholds
  - Provides seven thorny cases that split their tutorial group
  - Needs operational clarity: answerable questions without presupposing theory, named positions, and flagging of dead ends

  Notable subtext:
  - They're intellectually ambitious (rejecting slides for conceptual mapping)
  - Pragmatic about classroom dynamics (wants to structure disagreement productively)
  - Sensitive to peer knowledge level (no advanced theory assumed)

  Challenges to address:
  1. Avoiding question-begging (e.g. "Is it communicative?" presumes communicative theory)
  2. Handling cases where multiple doctrines converge on same outcome (e.g. dementia patient)
  3. Distilling complex positions (e.g. Shiffrin's view on consent vs waiver) accessibly

  Structure approach:
  Start broadest divide: what consent fundamentally DOES (permission vs mental state vs social act). Then drill into coercion by forcing baseline choice early - this exposes hidden premises. Deception branch must separate core/peripheral lies from materiality tests. Competence needs sliding-scale vs threshold handling. 

  Potential pitfalls:
  - "Normative power" branch might confuse peers (needs concrete examples)
  - Some cases (like drunken consent) map to multiple leaves - good for discussion
  - Empty branches likely where positions conflict (e.g. mental state + strict deception voids too much)

  Will include:
  - 5 key questions (ontology, coercion baseline, deception scope, materiality, competence threshold)
  - 9 named positions + "unoccupied" leaves
  - Flags on:
    - Overlaps (e.g. dementia case fits multiple leaves)
    - Dead ends (e.g. "strict deception + mental state" has no coherent defenders)
    - Counterintuitive commitments (e.g. value-conditional consent allowing awful job offers)
answer: |-
  Here's a decision tree designed to expose foundational disagreements in consent validity, using concrete questions to bypass rehearsed doctrine. It handles your specified cases and distinctions with **5 levels**, **10 leaves** (8 named positions + 2 unnamed/unoccupied), and flags overlaps/empty branches.  

  ---

  ### **Consent Validity Decision Tree**  
  *(Start at Question 1 for any case)*  

  **1. Does consent require the person to communicate agreement?**  
  - **YES** → Go to Q2  
  - **NO** (Agreement is purely mental) → Go to Q3A  

  **2. Can valid consent exist if the act would be wrong *regardless* of agreement?**  
  - **YES** (Consent changes permissions, but some acts are always wrong) → **Leaf: Normative Power (Conditional)**  
    - *Commitment:* Someone can "validly consent" to being assaulted if they communicate agreement, but it remains immoral/illegal.  
  - **NO** (Valid consent *always* makes the act permissible) → Go to Q3B  

  **3A. If consent is mental-only, does deception *ever* invalidate it?**  
  - **YES** (If they misunderstood key facts) → **Leaf: Mental State Absolutism**  
    - *Commitment:* A drunk person who *mentally* agrees (even if incoherent) gives valid consent; lies about *anything* the person cares about void consent.  
  - **NO** (Only competence matters) → **Leaf: Internal Will Theory (Uncommon)**  
    - *Commitment:* Surgeon’s misleading stats don’t matter if patient subjectively agreed; early dementia patient’s consent is valid if they "feel" okay.  

  **3B. Was consent given under a proposal involving "I’ll do X unless you do Y"?**  
  - **YES** → Go to Q4  
  - **NO** → Go to Q5  

  **4. To judge coercion, compare the proposal to:**  
  - **What the proposer *morally owed* anyway** → **Leaf: Moral Baseline View**  
    - *Commitment:* Threatening true disclosure (e.g., affair exposure) is coercive if blackmailer had no right to threaten; awful job offer isn’t coercive if employer owed nothing more.  
  - **What would *likely happen* without the proposal** → **Leaf: Statistical Baseline View**  
    - *Commitment:* Awful job offer isn’t coercive if unemployment was worse; threatening disclosure *is* coercive if silence was statistically normal.  
  - **What the recipient *reasonably expected*** → **Leaf: Reasonable Expectation View**  
    - *Commitment:* Lawful job offers in desperate contexts (e.g., famine) may be coercive if workers expected aid; affair threat isn’t coercive if target expected blackmail.  

  **5. Did deception involve lying about the *core nature* of the act?**  
  - **YES** → **Leaf: Core Deception Invalidates**  
    - *Commitment:* Surgeon’s misleading stats void consent; lies about peripheral motives (e.g., "I love you") do not.  
  - **NO** → Go to Q6  

  **6. If deceived about non-core details, does consent require the person *would have refused* if truthful?**  
  - **YES** → **Leaf: Material Deception Test**  
    - *Commitment:* Agreeing to sex based on lies about STDs voids consent *only* if you’d have refused; lies about respect/motives rarely matter.  
  - **NO** → **Leaf: Value-Conditional Consent**  
    - *Commitment:* Consent is void if deceived about *any* fact the person *cared about* (e.g., surgeon’s stats, partner’s affection), even if they’d still consent.  

  **7. For competence: Is the person unable to grasp *alternatives/consequences* (not just facts)?**  
  - **YES** → **Leaf: Outcome-Relative Competence**  
    - *Commitment:* Early dementia patient can consent to haircuts but not surgery; drunk consent is invalid if intoxication blocks consequence-weighing.  
  - **NO** → **Leaf: Fixed Threshold Competence**  
    - *Commitment:* If you can restate facts (e.g., procedure risks), you’re competent—even if drunk/demented and unable to compare options.  

  ---

  ### **Key to Leaves**  
  | **Leaf Name**                  | **Handles Your Cases**                                                                 | **Most Awkward Commitment**                                                                 |
  |-------------------------------|----------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | Normative Power (Conditional) | Blanket advance consent (valid but doesn’t make immoral acts permissible)              | "Valid" consent to torture is possible but still wrongful.                                |
  | Mental State Absolutism       | Drunk consent (valid if mental agreement exists)                                       | Silent, secretly willing victim "consents"; lies about *anything* (e.g., weather) void consent. |
  | Internal Will Theory           | Early dementia (valid if they "feel" agreeable)                                        | Consent valid even if profoundly deluded about basic reality.                             |
  | Moral Baseline View           | Affair threat (coercive if threat violates moral duty)                                | Non-coercive to exploit famine if no duty to feed workers.                                |
  | Statistical Baseline View     | Awful job offer (non-coercive if statistically better)                               | Coercive to offer life-saving surgery only for cash if most get it free.                  |
  | Reasonable Expectation View   | Job offer in crisis (coercive if workers expected relief)                             | Subjective expectations determine coercion; may vary by individual.                       |
  | Core Deception Invalidates    | Surgeon’s stats (void if deception alters "core nature" of risk)                     | Lying about HIV status voids consent; lying about your income does not.                   |
  | Material Deception Test       | Surgeon’s stats (void only if patient would refuse)                                  | Consent valid if deceived about fatal risk, but patient was suicidal anyway.              |
  | Value-Conditional Consent     | Sex based on false promises (void if partner cared about motives)                    | Consent void if deceived about trivial preferences (e.g., "I love jazz").                 |
  | Outcome-Relative Competence   | Early dementia (can’t weigh surgery alternatives)                                     | Competent adults may be incompetent for complex decisions (e.g., mortgages).              |
  | Fixed Threshold Competence    | Drunk consent (valid if coherent speech)                                              | Advanced dementia patient can consent to amputation if they repeat risks.                 |

  ---

  ### **Flags**  
  **(a) Overlapping Leaves (same case fits multiple leaves):**  
  - **Surgeon’s misleading stats:** Could be *Core Deception* (if "core"), *Material Deception* (if not core but would refuse), *or Value-Conditional* (if stats were valued).  
  - **Drunk consent:** Fits *Mental State Absolutism* (if mentally agreed), *Outcome-Relative Competence* (if impaired weighing), or *Fixed Threshold* (if coherent).  

  **(b) Empty Branches & Why:**  
  - **Mental State + "Consent always permits" (Q3A → Q2 NO):** Empty. Mental-state theorists rarely claim consent *always* permits acts (e.g., Feinberg rejects consent to murder). *Why:* Incoherent—if consent is internal, it can’t magically permit immoral acts.  
  - **Normative Power + "No communication required" (Q1 NO → Q2 YES):** Unoccupied. Normative power requires performative expression (communicative/normative act). *Why:* Unlikely—consent as "power" implies social/legal performativity.  

  ---

  ### **How to Use in Seminar**  
  1. **Pick a case** (e.g., "drunken consent").  
  2. **Walk through the tree as a group**, answering each question concretely:  
     - *Q1:* "Did they communicate? (e.g., said 'yes' while drunk)" → YES.  
     - *Q2:* "Could agreeing to drunk sex be wrong even if 'valid'?" → YES/NO debate → Branch.  
  3. **Reveal the leaf’s commitments:** "If you chose YES, you’re endorsing that..."  
  4. **Repeat for hard cases** to show why peers diverge (e.g., coercion baselines split the job offer case).  

  This forces engagement with *why* we disagree, not just outcomes. The unoccupied branches clarify conceptual boundaries. Designed for 60 mins—focus on 3-4 cases max!
