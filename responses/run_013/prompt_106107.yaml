answer: |-
  The spine of the plan is that the market metaphor must be established as the formal definition of coherence under bounded computation before introducing self-reference or learning dynamics, as it grounds all subsequent concepts in exploit avoidance rather than approximate reasoning.

  **Reasoning and Dependency Structure**  
  Logical induction redefines coherence for bounded agents via exploit avoidance in a prediction market. Without this foundation, self-reference and learning appear as ad-hoc additions. The dependency is:  
  1. **Market setup** → 2. **Exploit avoidance** → 3. **Self-reference** → 4. **Temporal learning**.  
  Misconceptions arise if this order is violated (e.g., discussing self-reference before traders exist, or treating the market as heuristic). Key dependencies:  
  - Traders and exploits must be defined before showing why self-referential sentences are nontrivial.  
  - The market’s computability must be stressed before introducing learning over time.  
  - Empirical uncertainty analogs (e.g., coin flips) must be contrasted late to avoid conflation.

  **Teaching Plan**  
  **Session 1: The Core Problem and Market Metaphor**  
  *Goal: Show why Bayesian logical omniscience fails for bounded agents, and establish the market as the solution.*  
  1. **Problem framing (20 min)**:  
     - Use the *halting problem for a small program* (e.g., a 3-line loop) as a carrying example. Ask: "What probability should we assign to ‘Program P halts’ before running it?" Highlight that:  
       - Truth is fixed but unknown.  
       - Exhaustive simulation is possible but costly (emulate 100 steps; later, scale to infeasible sizes).  
     - Contrast with empirical uncertainty (e.g., coin toss). Emphasize: Logical uncertainty is *about uncomputable consequences*, not ignorance of facts.  
     - Head off: "Coherence requires P(tautology)=1" by noting that bounded agents *can’t recognize all tautologies*.  

  2. **Market setup (30 min)**:  
     - Define a *toy market*:  
       - Sentences: Finite set (e.g., "P halts in ≤100 steps", "P halts in ≤200 steps").  
       - Prices: Reflect probabilities. Shares pay $1 if true, $0 if false.  
       - Traders: Algorithms with fixed runtime (e.g., 1 sec) submitting buy/sell orders.  
     - Key: Prices must avoid giving traders *risk-free profits*. Example: If "P halts" priced at $0.4, but simulation proves it halts, a trader buys low and profits.  
     - **Carrying example requirement**: Must have computable sentences (like small halting problems) but lack self-reference initially. Avoid π-digits (distracts with infinity) or surprise exam (lacks computational constraints).  

  3. **Exploit definition (10 min)**:  
     - An exploit is a trader that, using feasible computation, forces guaranteed profit *regardless of truth*.  
     - Stress: This is the *definition* of incoherence, not a heuristic.  

  **Session 2: Self-Reference via Exploit Avoidance**  
  *Goal: Extend the market to self-referential sentences, showing they necessitate dynamic pricing.*  
  1. **Recap and setup (10 min)**:  
     - Reiterate market rules. Add a self-referential sentence: "The market price for this sentence is <$0.5 at noon."  

  2. **Self-referential exploit (25 min)**:  
     - **Toy market**: Two times (t=1, t=2), one sentence φ: "Price of φ at t=1 is <$0.5".  
     - Demonstrate naive pricing:  
       - If t=1 price = $0.6, φ is false → trader sells φ, profits when false.  
       - If t=1 price = $0.4, φ is true → trader buys φ, profits when true.  
     - **Crucial**: Traders exploit *any fixed price*. Resolution requires prices to *change over time* (e.g., start low, rise cautiously).  
     - Head off: "Self-reference is a sideshow" by showing it creates unavoidable exploits without temporal design.  

  3. **Dynamic markets (25 min)**:  
     - Extend carrying example: Market runs in discrete steps. Traders submit orders based on historical prices.  
     - Show φ’s price evolving (e.g., $0.3 → $0.45 → $0.49) to avoid large exploits.  
     - Highlight: Prices must reflect *current computational state*, not just ground truth.  

  **Session 3: Learning and Logical Uncertainty**  
  *Goal: Show how the market learns patterns, and contrast with empirical uncertainty.*  
  1. **Learning mathematical facts (25 min)**:  
     - **Carrying example**: Market for digits of π *computed sequentially* (e.g., digit 1, then 1-2, then 1-3).  
       - Sentences: "Digit 3 is 7", "Digit 4 is 5", etc.  
       - Traders detect patterns (e.g., "even digits are high") via regression on past digits.  
     - Show price updates: Uniform priors → spike in P(digit=correct) as computation progresses.  
     - Stress: Budget constraints limit pattern detection (e.g., can’t compute all digits).  

  2. **Asymptotic properties (15 min)**:  
     - Logical inductor learns: Prices converge to 0/1 for decidable sentences, recognize patterns, and are calibrated.  
     - Contrast with empirical learning:  
       - **Revealing question**: "How does P(1000th π-digit=7) change as the agent computes more digits, versus P(coin=heads) after 100 flips?"  
       - Answer: π-digit uncertainty *decreases deterministically* with computation; coin-flip uncertainty decreases *stochastically* with data.  

  3. **Diagonals and wrap-up (10 min)**:  
     - Full diagonal sentence: "My price will never exceed $0.5."  
     - Show cautiously rising prices (e.g., $0.5 − 1/𝑡) avoid unbounded exploits.  
     - Head off: "Logical uncertainty ≈ empirical uncertainty" by noting π-digit prices converge *because truth is fixed*, while coins require repeated sampling.  

  **What to Refuse and How**  
  - **Refuse**: Fixed-point construction of traders, exact convergence bounds, complexity-class details.  
  - **Response**: "This requires graduate-level computability theory; here, we focus on the market’s philosophical implications. I’m happy to suggest technical references offline."  
  - **Why**: These are implementation details that obscure the conceptual core for non-specialists.  

  **Misconception Mitigation**  
  - "Uncertainty is about what follows": Head off in Session 1 by noting it’s about *uncomputable* consequences.  
  - "Coherence requires P(tautology)=1": Defused in Session 1 via boundedness.  
  - "Market is heuristic": Preempted in Session 1 by defining exploits as the coherence criterion.  
  - "Self-reference is peripheral": Addressed in Session 2 by showing it creates exploits.  

  **Carrying Example Specifications**  
  - **Must have**:  
    - Feasible computations (e.g., halting in 100 steps).  
    - Explicit runtime limits for traders.  
    - Self-referential sentences in Session 2.  
    - Temporal dynamics for learning.  
  - **Must lack**:  
    - Undecidable sentences initially (avoid Gödel distractions).  
    - Infinite sets (keep finite for hand simulation).  
  - **Why alternatives fail**:  
    - π-digits: Lacks self-reference; infinite set.  
    - Theorem prover + probabilities: Misses exploit-based coherence.  
    - Surprise exam: Not computational; focuses on temporal paradox over feasibility.
