     If C=1 (common source correct), then expert i is correct with probability p_i1 (high).
     If C=0 (common source incorrect), then expert i is correct with probability p_i0 (which might be lower, but note that without the common source they might still have independent knowledge).

   However, we want positive association: when one expert is correct, the others are more likely to be correct. This will happen because they share the common source.

   But note: we want the majority to be less reliable than the least accurate member. We also require that each member is right more often than 50%.

   We choose parameters carefully. Let's try:

     p_c = 0.6   (the common source is correct 60% of the time)

