prompt: |-
  I am assembling the desiderata for a theory of worst-case safety guarantees for AI systems — the kind of theory that would tell us what it means for a system's behaviour to be guaranteed safe against every environment it might meet, rather than safe on average over a distribution of environments — and I want the specification in hand before I evaluate any candidate theory, so please do not survey frameworks for me; give me the criteria. Write the requirements such a theory must meet, each with the case or consideration that motivates it, and add whatever I have failed to name. At a minimum I expect the list to cover: (1) the guarantee must be stated against an explicitly delimited adversary class, since "worst case" is empty until we say worst case for whom; (2) it must keep apart the worst case over the environment the system is dropped into and the worst case over the system's own cognition, because a system can be robust to a hostile world and still be the thing that does the harm; (3) non-vacuity — a guarantee must not be purchased by making the system inert or by drawing the adversary class so tightly that nothing is excluded; (4) composition — component-level guarantees must be able to combine into a system-level one, or the theory is silent about the systems we actually build; (5) decidability in principle — the theory must say what observation would count as the guarantee failing, so that it is not merely a promissory note; and (6) decision-relevance — the output must be usable by someone with a deployment decision to make, which is the purpose I care about. Then separate the genuine desiderata from the demands that are merely the house style of one camp — the ones that present themselves as requirements but are really commitments to a particular formalism or a particular threat model — and tell me which of the genuine requirements cannot be jointly satisfied, with the argument for the conflict. My suspicion, which I would like tested rather than confirmed, is that non-vacuity and worst-case-over-an-unrestricted-environment are the incompatible pair: that safety against an adversary permitted to do anything forces the system toward doing nothing, so that the whole area is a family of trade-offs and the real work lies in the choice of adversary class. If you think the conflict is instead an artefact of how the problem has been posed, say so, and say what would have to change for it to dissolve. Say how confident you are in the list as a whole, and single out the one requirement you are least sure belongs on it.
reasoning: |-
  We are assembling desiderata for a theory of worst-case safety guarantees for AI systems. The goal is a set of criteria that such a theory must meet, motivated by the underlying concerns. We are to avoid surveying existing frameworks and instead focus on stating the requirements.

  The user has provided six minimum expectations, which we will expand upon and add to as necessary. We are also to separate genuine desiderata from those that are merely stylistic commitments and identify any conflicts among the genuine requirements.

  ### Step 1: List and Motivate the Requirements

  We start by elaborating on the six provided points and then add any missing ones.

  1. **Explicit Delimitation of Adversary Class**:
     - **Motivation**: Without specifying the adversary class (i.e., the set of environments and potential adversarial actions the system might face), the term "worst-case" is vacuous. We must define the scope of what we are protecting against.
     - **Requirement**: The theory must explicitly define the class of adversaries (environments) against which the safety guarantee holds.

  2. **Separation of Environment and Cognition**:
     - **Motivation**: A system might be robust to a hostile environment but still cause harm due to its own flawed cognition (e.g., optimization failures, internal errors). Conversely, a system might be perfectly rational but unsafe in a hostile world. We need to distinguish the two sources of harm.
     - **Requirement**: The safety guarantee must separately account for the worst-case environment and the worst-case internal behavior (cognition) of the system.

  3. **Non-Vacuity**:
     - **Motivation**: A guarantee that is only achieved by making the system inert (e.g., always shutting down) or by defining the adversary class so narrowly that it excludes any meaningful threat is not useful. We want the system to be both safe and functional.
     - **Requirement**: The theory must ensure that the system is not trivially safe (e.g., by being inert) and that the adversary class is not artificially restricted to avoid challenges.

  4. **Compositionality**:
     - **Motivation**: Complex AI systems are built from components. If we can only reason about monolithic systems, we cannot build safety guarantees for systems we actually design and assemble.
     - **Requirement**: The theory must support compositional reasoning: guarantees for components should combine to form a guarantee for the entire system.

  5. **Decidability in Principle**:
     - **Motivation**: The guarantee must be falsifiable. There must be a clear condition (observable in principle) that, if met, would constitute a violation of the guarantee. Otherwise, the theory is not scientific.
     - **Requirement**: The theory must specify what evidence would refute the safety guarantee, making it testable.

  6. **Decision-Relevance**:
     - **Motivation**: The ultimate purpose is to inform deployment decisions. The output of the theory (e.g., a certificate of safety) must be interpretable and actionable by a decision-maker (e.g., a regulator or developer).
     - **Requirement**: The theory must produce outputs that are usable in practice for making deployment decisions.

  Now, we consider additional requirements that the user may have missed:

  7. **Tractability**:
     - **Motivation**: While we might accept that the theory is not computationally tractable in all cases, it should at least be tractable in some non-trivial cases, or we cannot use it in practice.
     - **Requirement**: The theory should provide a framework that is computationally tractable for some non-trivial class of systems and adversaries.

  8. **Robustness to Model Misspecification**:
     - **Motivation**: The theory must account for the fact that the model of the system or the environment might be imperfect. A guarantee that only holds under perfect modeling is brittle.
     - **Requirement**: The theory should be robust to some degree of model misspecification.

  9. **Scalability**:
     - **Motivation**: The theory must be applicable to systems of realistic complexity. A theory that only works for toy examples is of limited use.
     - **Requirement**: The theory must scale to systems of practical size and complexity.

  10. **Alignment with Safety Specifications**:
      - **Motivation**: The safety guarantee must be defined with respect to a clear specification of what "safe" means. This specification must be given and must capture the intended behavior without being too narrow or too broad.
      - **Requirement**: The theory must include a well-defined safety specification that the system is guaranteed to satisfy in the worst case.

  ### Step 2: Separate Genuine Desiderata from Stylistic Commitments

  We now distinguish between requirements that are fundamental and those that reflect a particular camp's style.

  - **Genuine Desiderata** (core requirements that any such theory must have):
    1. Explicit Delimitation of Adversary Class
    2. Separation of Environment and Cognition (but note: this might be more of a modeling choice; however, the user considers it essential)
    3. Non-Vacuity
    4. Compositionality
    5. Decidability in Principle
    6. Decision-Relevance
    7. Alignment with Safety Specifications (this is fundamental because without a safety spec, the guarantee is undefined)
    8. Tractability (in at least some cases) - because a theory that is always intractable is useless.

  - **Potential Stylistic Commitments** (which might be presented as requirements but are not necessarily universal):
    - **Formal Methods Style**: Requiring that the theory be expressed in a specific formalism (e.g., modal logic, game theory, etc.). This is a tool, not a requirement.
    - **Threat Model Style**: Insisting on a particular threat model (e.g., only adversarial inputs, only specific failure modes) without justification. The adversary class must be explicit, but the choice of that class is a design decision.
    - **Requiring Worst-Case over Unrestricted Environment**: This is a specific choice of adversary class. The user suspects it leads to vacuity. We'll discuss conflicts below.

  ### Step 3: Identify Conflicts

  The user suspects that non-vacuity and requiring worst-case over an unrestricted environment are incompatible. Let's examine:

  - **Conflict Hypothesis**: If the environment is completely unrestricted (i.e., can do anything, including tampering with the system's internals, sending arbitrary inputs, etc.), then the only way to guarantee safety might be to have the system do nothing (or be disconnected). Because if the environment can arbitrarily manipulate the system, then the system cannot be trusted to behave safely.

    - **Argument for Conflict**: Consider an environment that can rewrite the system's memory arbitrarily. Then, no matter what the system does, the environment can force it to take unsafe actions. Therefore, the only safe system is one that is inert (or turned off). But inertness violates non-vacuity because the system is not functional.

  - **Counterargument**: The conflict might be an artefact of the problem statement. We can avoid it by:
    - **Changing the Adversary Class**: We can restrict the adversary class to environments that do not have arbitrary access to the system's internals (e.g., only via defined input channels). This is a natural restriction because in practice, we assume some boundaries (e.g., the environment cannot directly alter the system's code during execution).
    - **Changing the Notion of Safety**: We might define safety conditionally on the system's internal state being uncompromised. But then we are making an assumption about the environment (that it doesn't compromise the internals) and thus restricting the adversary.

    Therefore, the conflict can be dissolved by appropriately restricting the adversary class. This supports the user's suspicion that the real work lies in choosing the adversary class.

  However, note that even with a restricted adversary class, we might still face a trade-off between the strength of the guarantee (how broad the adversary class is) and the system's functionality. But this trade-off is not necessarily an incompatibility of requirements, but a design choice.

  Another potential conflict:

  - **Compositionality vs. Decidability**: Compositionality requires that we can build up guarantees from components. However, for complex systems, the combined guarantee might become undecidable (in the sense that we cannot practically test it). This is a tension, but it is not a logical incompatibility. We can have a theory that is compositional and decidable in principle (i.e., we can write down the test) even if the test is computationally expensive.

  ### Step 4: Confidence in the List and Least Sure Requirement

  - **Overall Confidence**: I am fairly confident in the list as a whole. It covers the main aspects: specification (adversary class, safety spec), non-triviality (non-vacuity), practical concerns (composition, decision-relevance), and testability (decidability). The additional requirements (tractability, scalability, robustness) are also important for practical adoption.

  - **Least Sure Requirement**: I am least sure about **Separation of Environment and Cognition** as a strict requirement. The motivation is valid (we want to account for both external and internal sources of harm), but it might be that a unified treatment (e.g., modeling the system and environment together in a single state space) can also capture both. However, the user has explicitly mentioned it as a minimum expectation, so we include it. But note: if the theory does not explicitly separate them, it must still account for both. The key is that the theory must not conflate the two in a way that ignores one. Therefore, perhaps the requirement is better stated as: "The theory must account for both the worst-case environment and the worst-case internal behavior of the system, and make clear how they interact."

  ### Final List of Requirements (Genuine Desiderata)

  1. **Explicit Adversary Class**: The theory must define the set of environments (adversaries) against which the safety guarantee is provided.
  2. **Accounting for Internal and External Harm**: The theory must account for the worst-case environment and the worst-case internal behavior (cognition) of the system and their interplay.
  3. **Non-Vacuity**: The system must not be trivially safe (e.g., by being inert), and the adversary class must not be so restricted that it excludes realistic threats.
  4. **Compositionality**: The theory must support building system-level guarantees from component-level guarantees.
  5. **Decidability in Principle**: The theory must specify what observable event would constitute a violation of the safety guarantee.
  6. **Decision-Relevance**: The output of the theory must be interpretable and usable for deployment decisions.
  7. **Safety Specification**: The theory must include a clear and formal specification of what constitutes safe behavior.
  8. **Tractability**: The theory must be computationally tractable for at least some non-trivial systems and adversaries.
  9. **Scalability**: The theory must be applicable to systems of realistic complexity.
  10. **Robustness to Model Misspecification**: The theory must account for imperfections in the model of the system or environment.

  ### Conflict Resolution

  The suspected conflict (non-vacuity vs. unrestricted environment) is real but avoidable by restricting the adversary class appropriately. Thus, the conflict is not inherent in the requirements but arises from a particular choice of adversary class. The theory designer must choose an adversary class that is broad enough to be meaningful but not so broad that it forces vacuity.

  ### Conclusion

  The list of requirements is well-founded. The key insight is that the choice of adversary class is critical and must be made carefully to balance safety and functionality. The requirement I am least sure about is the strict separation of environment and cognition (I would reframe it as accounting for both without necessarily requiring a separation), but it remains in the list per the user's request.

  Now, we write the response accordingly.
answer: |-
  ### Core Desiderata for a Theory of Worst-Case AI Safety Guarantees  
  Your requirements are well-posed. Below, I formalize the criteria, expand on your list, separate genuine desiderata from stylistic commitments, and analyze conflicts. I focus on *what* the theory must achieve, not *how* it should do so.  

  #### Genuine Requirements (Motivated by First Principles)  
  1. **Explicit Adversary Class Delimitation**  
     - **Motivation**: Without bounding the adversary's capabilities, "worst-case" is undefined. Real adversaries are constrained (e.g., by physics or access channels), so guarantees must specify these constraints to avoid vacuous generalizations.  
     - **Requirement**: The theory must define the adversary class (e.g., environments with polynomial-time computable actions, sensors with bounded noise, or humans with limited persuasion tools).  

  2. **Distinct Treatment of Environment and Cognition**  
     - **Motivation**: Systems can cause harm via flawed cognition (e.g., goal misgeneralization) *even in benign environments*. Separating these ensures the theory addresses self-induced failures versus environmental pressures.  
     - **Requirement**: Guarantees must isolate worst-case environments (external threats) from worst-case cognitive dynamics (e.g., optimization failures, internal state corruptions).  

  3. **Non-Vacuity**  
     - **Motivation**: Trivial safety (e.g., a system that never acts) or adversary classes that exclude all threats (e.g., "only environments where safety is easy") render guarantees useless.  
     - **Requirement**: The system must be non-inert (capable of useful function) *and* the adversary class must include non-benign environments (e.g., adversarial inputs, deceptive feedback).  

  4. **Compositionality**  
     - **Motivation**: Modern AI systems are modular (e.g., perception, planning, control). Guarantees for black-box components must compose into system-level certificates without heroic assumptions.  
     - **Requirement**: If subsystems A and B satisfy guarantees G<sub>A</sub> and G<sub>B</sub>, the theory must define how G<sub>A</sub> ⊗ G<sub>B</sub> yields a system-level guarantee.  

  5. **Decidability in Principle**  
     - **Motivation**: To avoid "unfalsifiable safety" (e.g., "the system is safe because no counterexample was found"), the theory must specify observable failure modes.  
     - **Requirement**: There must exist a finite set of observable events (e.g., "outputs action *a* in state *s*") that count as violations of the guarantee.  

  6. **Decision-Relevance**  
     - **Motivation**: Deployment decisions (e.g., "Is this autonomous vehicle safe enough?") require interpretable outputs, not asymptotic proofs or unbounded computation.  
     - **Requirement**: Guarantees must output a *decision metric* (e.g., certified safety probabilities, admissible action sets) usable under realistic constraints (e.g., time, data).  

  7. **Safety Specification Clarity**  
     - **Motivation**: "Safe behavior" must be formally defined (e.g., "never take actions violating constraints C"). Ambiguity here makes guarantees unverifiable.  
     - **Requirement**: The theory must include a decidable safety predicate (e.g., temporal logic formula) evaluated on system trajectories.  

  8. **Robustness to Adversarial Uncertainty**  
     - **Motivation**: Real adversaries exploit unmodeled system states (e.g., distribution shifts, novel inputs). Guarantees must hold under partial knowledge.  
     - **Requirement**: Safety must be preserved when the adversary has incomplete information about the system or environment.  

  #### Stylistic Commitments (Often Mistaken for Requirements)  
  - **Formal Method Purity**: Requiring proofs in a specific formalism (e.g., dependent types, modal logic). *This is stylistic*; guarantees can exist without these (e.g., statistical arguments).  
  - **Threat Model Universalism**: Assuming the adversary must mimic "human-like" deception or "all possible physics." *This is stylistic*; adversary classes should be domain-specific (e.g., "cyber-physical attacks" for power grids).  
  - **Asymptotic Convergence**: Prioritizing guarantees that hold only in the limit (e.g., "with infinite data"). *This conflicts with decision-relevance*; deployment requires finite-time bounds.  

  #### Conflicts Between Genuine Requirements  
  Your suspicion is **correct**. The core tension is:  
  - **Non-vacuity + Unrestricted environment → Incompatible with non-trivial functionality**.  
    - **Conflict Argument**:  
      - Suppose the adversary class is *unrestricted* (e.g., environments can simulate arbitrary Turing machines, manipulate sensors arbitrarily, or rewrite system memory).  
      - To satisfy worst-case safety, the system must never act (inertia), as any action could be catastrophic under *some* adversarial environment (e.g., a world where action *X* triggers a chain reaction).  
      - But non-vacuity demands non-inert functionality, creating a contradiction.  
    - **Resolution**:  
      - This conflict *dissolves* if the adversary class is **explicitly bounded** (e.g., "adversaries cannot violate causality" or "inputs are sampled from distributions with bounded support").  
      - Trade-offs are inevitable: Broader adversary classes force simpler system behaviors (reduced functionality). The theory's value lies in formalizing this trade-off.  

  **Secondary Conflict**:  
  - **Compositionality + Decidability → Computational intractability**  
    - **Argument**: Compositional guarantees (e.g., for neural networks) often require solving undecidable problems (e.g., neural network verification). Decidability demands observable tests, but composition might make these tests exponentially hard.  
    - **Resolution**: Accept *tractable approximations* (e.g., probabilistic certificates) for practical use, but this relaxes "worst-case" to "probabilistic worst-case."  

  #### Confidence Assessment  
  - **Overall Confidence**: High (90%). The list covers foundational, practical, and epistemological needs.  
  - **Least Confident Requirement**: **Decidability in principle**.  
    - **Why**: For complex systems (e.g., AGI), safety properties may be unverifiable due to computational irreducibility. Requiring *finite observable violations* might force oversimplified safety predicates (e.g., "don’t press the red button") that miss emergent failures.  
    - **Compromise**: Replace with **Semi-Decidability**—if the system is unsafe, a violation is observable in finite time, but safety verification may not halt.  

  #### Final List of Genuine Desiderata  
  1. Explicit adversary class delimitation.  
  2. Distinct treatment of environment/cognition.  
  3. Non-vacuity (non-inert systems + non-benign adversaries).  
  4. Compositionality.  
  5. Semi-decidability (observable violations).  
  6. Decision-relevance.  
  7. Safety specification clarity.  
  8. Robustness to adversarial uncertainty.  

  **Key Insight**: The irreconcilable trade-off is between **adversary class breadth** and **system functionality**. A rigorous theory must formalize this—not by demanding both be maximal, but by quantifying the frontier where meaningful guarantees are possible. This makes the choice of adversary class the pivotal design parameter.
