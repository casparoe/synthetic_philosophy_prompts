  I notice they explicitly reject "vibes" in favor of analytical rigor. Their witch case is particularly clever - it pressures theories to explain how something can be "real" while operational (courts, executions) yet later abandoned. The money/race contrast is the core puzzle: both depend on collective recognition, but money can be redesigned overnight while racial hierarchies resist deliberate change. Essential workers offers a contemporary stress test for how quickly categories gain material consequences.

  For the structure, I'll follow their requested four sections exactly. In "Cases that set the bar", I'll distill each case's theoretical pressure point without resolution. The "Requirements" section needs particular care - each criterion must emerge organically from the cases. For instance: witches demand explaining deconstruction, money requires handling arbitrariness, race needs power analysis, essential workers highlight institutionalization speed, sex/gender necessitate biology-culture distinction.

  I anticipate tension between explaining institutional durability (racial hierarchies) versus mutability (currency redenomination). This trade-off belongs in section three. For the "most filtering" criterion, I suspect the "irreducible power dynamics" requirement will eliminate individualist approaches that reduce social kinds to mere beliefs.

  Throughout, I'll maintain strict neutrality - no verdicts on the cases, just the evaluative framework. The user wants tools, not conclusions. References to "shell-and-stone money" and "essential workers" show they value concrete examples over abstractions, so I'll keep explanations grounded. Their impatience with renamed puzzles means each requirement must force genuine explanatory work.
answer: |-
  Here’s the spec for a theory of social construction, structured as requested:

  ### 1. Cases That Set the Bar (280 words)
  *   **Witches:** Tests *temporal contingency* and *deconstruction*. A category that was institutionally embedded (courts, executions), widely believed, then collapsed. The theory must explain how such a collective reality emerges, functions robustly *while active*, and ceases to be real without biological change in individuals. Failure: Treating it as always illusory ignores its past causal power; treating it as eternally real ignores its disappearance.
  *   **Money (incl. shell/stone):** Tests *functional arbitrariness* and *systemic interdependence*. Tokens with no intrinsic value (Yap stones, digital bits) function as money due to collective recognition within a system of exchange, debt, and accounting. The theory must explain how value and function emerge *solely* from social coordination. Failure: Invoking intrinsic properties of the token or reducing it to pure belief without systemic function.
  *   **Race (context-dependent):** Tests *power-laden institutionalization* and *relativity*. The same individual categorized differently across societies (e.g., "white" in Brazil vs. US) with material consequences, despite unchanged biology. The theory must explain how categories gain reality through *social/political hierarchies* and institutional enforcement, not biology. Failure: Biologizing race or ignoring the role of power in making these categories materially real.
  *   **Essential Worker:** Tests *rapid construction & institutionalization*. A novel category coined recently, rapidly embedded in laws (vaccine priority, pay) with tangible effects, widely recognized but explicitly understood as socially defined. The theory must explain how new categories gain reality *quickly* through institutional action and collective response. Failure: Requiring long historical development or deep cultural embedding to be "real."
  *   **Sex vs. Gender:** Tests the *biology/culture interface*. Sex (biological features) is often seen as a basis, while gender (roles, identities) is constructed atop it. The theory must distinguish socially contingent *interpretations/expectations/categories* from biological referents *without* denying the relevance of biology or reducing gender to pure individual choice. Failure: Collapsing sex into gender (denying biology) or gender into sex (denying social construction).

  ### 2. What a Theory Has to Deliver (Requirements) (800 words)
  1.  **Explain Causal Efficacy Independent of Individual Belief:** The theory must account for how socially constructed entities (like money, race categories, essential worker status) have *real, objective effects* on people's lives (wealth, incarceration, vaccine access) even if an individual personally disbelieves or rejects the construction. *Case:* Essential worker status determined vaccine priority regardless of personal feelings. *Failure:* Theories claiming "it's only real if you believe it" cannot explain why a disbelieving "essential worker" still got priority shots, or why a racially profiled person suffers regardless of their personal racial ideology.
  2.  **Account for Functional Arbitrariness & Systemic Dependence:** It must explain how entities derive their specific function and value *entirely* from their position within a larger social system, independent of their physical properties. *Case:* Yap stones or digital currency have value only because of the collective system of accounting, debt, and exchange they participate in. Their physical form is irrelevant beyond being a token within that system. *Failure:* Theories suggesting money's value stems from the material properties of the token (e.g., gold's "intrinsic" value) or reducing it to pure psychological states without systemic interdependence.
  3.  **Explain Durability and Resistance to Change:** The theory must account for why some constructions (like racial hierarchies or gender norms) exhibit significant *inertia* and resistance to deliberate change, persisting despite individual opposition or attempts at reform. *Case:* Racial categorizations and associated hierarchies persist across generations despite legal changes or widespread acknowledgment of their social origins, unlike currency redenomination. *Failure:* Theories portraying social reality as *only* a matter of current collective agreement or belief, making it seem easily changed by consensus (e.g., "if we all just stopped believing in race...").
  4.  **Explain Contingency, Mutability, and Deconstructibility:** Conversely, the theory must explain how constructions *can* change, emerge rapidly, or completely collapse due to shifts in collective practices, beliefs, or power structures. *Case:* Witchcraft collapsed as a legally recognized category; "essential worker" emerged and gained institutional traction within months; currencies can be redenominated. *Failure:* Theories implying constructions are permanent, natural, or transcend human practices (e.g., treating race or gender as eternal biological essences).
  5.  **Distinguish Constructions from Their Biological/Physical Referents (Where Applicable):** It must provide a clear framework for understanding the relationship between social constructions and any underlying biological or physical phenomena they interact with or interpret. *Case:* Gender roles/identities (constructed) vs. biological sex characteristics (referent); racial categories (constructed) vs. human genetic variation (referent). *Failure:* Collapsing the biological referent entirely into the social construct (denying biology) *or* reducing the social construct solely to the biological referent (denying genuine construction).
  6.  **Accommodate Relativity and Context-Dependence:** The theory must explain how the reality and meaning of a construction can vary significantly across different social, cultural, or historical contexts. *Case:* The same person categorized as different races in different countries; the meaning/status of "witch" differing vastly across cultures and times. *Failure:* Theories positing universal, essential, or context-independent definitions for constructed kinds.
  7.  **Integrate Power and Hierarchy:** It must centrally incorporate the role of *power*, *domination*, and *institutional enforcement* in establishing, maintaining, and giving material consequences to social constructions. *Case:* Racial categories gain their oppressive reality through laws, policing, economic structures, and social norms enforced by dominant groups; witch trials required institutional power. *Failure:* Theories portraying social construction as a benign, egalitarian process of shared agreement or meaning-making, ignoring coercion and inequality.
  8.  **Handle Both Tacit and Explicit Constructions:** The theory must account for constructions that operate largely through unspoken norms, habits, and practices (e.g., gendered behavior) *and* those explicitly defined and codified (e.g., legal tender laws, "essential worker" statutes). *Case:* Gender norms often enforced implicitly; money requires explicit legal frameworks for its core function. *Failure:* Theories only recognizing explicit, codified agreements as "real" construction, or conversely, only recognizing deep, tacit cultural norms.

  ### 3. Requirements That Can't Both Be Met (Trade-offs) (200 words)
  The most significant tension lies between **Durability/Resistance to Change (Req 3)** and **Contingency/Mutability (Req 4)**. Explaining the deep inertia of racial hierarchies or gender norms seems to demand structures beyond fleeting agreement. Explaining rapid currency redenomination or the collapse of witchcraft suggests reality rests on more fragile consensus. A theory emphasizing institutional embeddedness and power (satisfying Req 3 & 7) risks downplaying how quickly *some* institutional realities *can* change (Req 4, Essential Worker). A theory emphasizing collective acceptance (satisfying Req 4) risks underestimating the entrenched power maintaining oppressive constructs (Req 3 & 7).

  **Trade-off Resolution:** I would prioritize **Durability/Resistance to Change (Req 3)** and **Integrate Power and Hierarchy (Req 7)**. While mutability is crucial, the most pressing task for a theory of social construction is explaining why oppressive or dominant constructions are so *hard* to dismantle despite their acknowledged contingency. A theory that explains durability via power and institutionalization can *still* account for mutability (e.g., revolutions, institutional collapse, powerful counter-movements), whereas a theory focused only on contingent agreement struggles profoundly with explaining entrenched inequality. Power is the key mechanism bridging durability and the *potential* for (often difficult) change.

  ### 4. What Does the Most Filtering (200 words)
  The requirement that eliminates the most otherwise plausible views is **Integrate Power and Hierarchy (Req 7)**.

  *   **Individualist/Consensus Views:** Views reducing social reality *only* to widespread individual belief or agreement (common in naive interpretations) fail immediately, as they cannot explain the reality and persistence of constructions (like racial hierarchies) imposed by dominant groups *against* the beliefs or interests of subordinated groups.
  *   **Functionalist Views:** Views focusing solely on systemic interdependence or collective benefit (e.g., some analyses of money) often struggle to explain constructions maintained primarily through domination and conferring *dis*advantage (e.g., rigid racial caste systems).
  *   **Interpretivist/Cultural Views:** Views emphasizing shared meaning and cultural frameworks often downplay or neglect the role of coercion, material force, and institutional power in *enforcing* meanings and making them consequentially real.
  *   **Minimalist "As If" Views:** Views claiming things are real "because we act as if they are" often fail to interrogate *why* we act that way, skipping the crucial analysis of power dynamics that compel or normalize those actions.

  **Main Families (by Claim):**
  1.  *Collective Acceptance/Agreement:* Reality stems from mutual belief or commitment.
  2.  *Institutional Facts:* Reality stems from constitutive rules within human institutions.
  3.  *Discursive Practices/Performances:* Reality stems from language, discourse, and repeated actions.
  4.  *Power-Knowledge Nexus:* Reality stems from the inseparable link between power structures and systems of knowledge/categorization.
  5.  *Structural-Functional Systems:* Reality stems from the role an entity plays within a larger social system maintaining stability.
