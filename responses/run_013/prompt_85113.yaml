prompt: |-
  Hi — I need help with something and I'm not smart enough about it. My friend is about to sign off on her exit package from the startup she works at, and she asked me to tell her if she's being an idiot. I can't tell, and her reasoning is doing something I can't quite put my finger on.

  Here's the setup. She picks one of two structures. Option 1: $180k, guaranteed. Option 2: an 89% chance of $180k, a 10% chance of $900k, and a 1% chance of walking away with nothing. She's taking option 1. Her reason: she's not going to risk ending up with zero after all this, and the jump to $900k only happens one time in ten.

  Then she said, ok, but imagine the chunk that's the same in both — that 89% — was already settled and set aside. Whats left is an 11% shot at $180k versus a 10% shot at $900k, nothing otherwise. And in that version she'd take the $900k shot, definately, because there's no sure thing to give up.

  I said those are the same choice written two ways. She says no, they're completly different, because in the first one you either get the money or you don't. She also says the flip only happens because she doesn't know yet how that 89% part shakes out — if someone told her it had already gone against her, she'd obviously gamble, but that's not the situation she's actually in.

  My econ-101 reflex is that option 2 has higher expected value, so take it and stop overthinking, but she pointed out that nobody would ever buy insurance if that was the rule, and she's right about that.

  Is she being inconsistent, or am I missing something? And if she is, is it a real mistake or just a quirk of how the options get written up? She signs tomorrow, so — what should I tell her?
reasoning: |-
  Okay, let's tackle this problem. The user's friend is choosing between two exit package options from her startup. Option 1 is a guaranteed $180k. Option 2 offers an 89% chance at $180k, 10% at $900k, and 1% at nothing. She's leaning towards Option 1 because she doesn't want to risk getting nothing. The user thinks both options are equivalent, but his friend disagrees. 

  First, I need to verify if the two scenarios are mathematically the same. In the first setup, Option 2's expected value (EV) is (0.89 * 180k) + (0.10 * 900k) + (0.01 * 0) = 160.2k + 90k = $250.2k. That's higher than Option 1's $180k. But the friend prefers certainty, which makes sense because people often avoid risk when stakes are high. 

  Then the friend reframes it: set aside the common 89% chance of $180k. Now the choice is between 11% chance of $180k (which is actually the remaining part of Option 1) vs. 10% chance of $900k plus 1% nothing (Option 2 minus the 89%). Mathematically, this is identical. The EV of the gamble part in Option 2 is (10/11)*900k ≈ $818k, much higher than the $180k safe part. The friend says she'd take the gamble here. 

  The inconsistency is that in the combined option, she's risk-averse, but in the split version, she's risk-seeking. This is the isolation effect in prospect theory. People evaluate choices differently when separated versus combined. The friend focuses on the risk of nothing in the full context, making her cautious. When the safe part is "set aside," the potential gain becomes more salient, leading to risk-taking. 

  The user mentions insurance. Buying insurance is paying to avoid a loss, which is risk-averse behavior. Here, the friend is avoiding risk with Option 1, similar to insurance. But in the split scenario, she's embracing risk for a higher gain. So her choices are context-dependent, not based solely on EV. 

  Is this a mistake? Not necessarily. Behavioral economics shows that people aren't always rational in the EV sense. Avoiding a 1% chance of zero might be worth more to her than the EV difference. However, mathematically, Option 2 is better. But her comfort with risk matters. If $180k is crucial for her financial stability, the guaranteed amount makes sense. If she can afford the risk, Option 2 is better. 

  The user should tell her that both framings are mathematically equivalent, but her feelings are valid. She should assess her financial situation. If the $180k is essential, stick with Option 1. If she can handle the risk, Option 2 has a higher expected value. The key is consistency: if she'd gamble in the split scenario, she should consider Option 2 seriously now.
answer: |-
  Your friend is demonstrating a fascinating (and very human) cognitive bias called the **isolation effect** or **narrow framing**, a core concept in behavioral economics (Prospect Theory, specifically). Here's the breakdown:

  1.  **Mathematical Equivalence:** You are absolutely correct. The two descriptions represent *exactly the same choice*.
      *   **Option 1:** 100% chance of $180k = Guaranteed $180k
      *   **Option 2:** 89% of $180k + 10% of $900k + 1% of $0
      *   **Her Reframed "Leftover":**
          *   *"Safe" leftover:* 11% chance of $180k (This is implicitly taking Option 1 *minus* the $180k she imagines "set aside" from the 89% success case. If she gets this 11%, she gets $180k *total*).
          *   *"Risky" leftover:* 10% chance of $900k + 1% of $0 (This is taking Option 2 *minus* the $180k she imagines "set aside" from the 89% success case. If she gets the 10%, she gets $180k (set aside) + $900k = $1.08M total. If she gets the 1%, she gets $0 (set aside) + $0 = $0 total).

      **The outcomes and probabilities are identical in both framings.** The reframing doesn't change the underlying reality; it only changes her *perception* of the risk.

  2.  **Why She Feels Differently (Prospect Theory):**
      *   **The Full Choice (Option 1 vs Option 2):** She focuses on the potential *loss* from the status quo (having $180k guaranteed). The 1% chance of getting *nothing* ($0) feels like a devastating loss compared to the sure $180k. The pain of potentially losing $180k outweighs the pleasure of potentially gaining $720k ($900k - $180k), even though the chance of the gain (10%) is much higher than the chance of the loss (1%). This is **loss aversion**.
      *   **The "Leftover" Choice:** By mentally "setting aside" the common $180k (the 89% success), she artificially changes the reference point. Now she's comparing:
          *   A 11% chance to gain $180k (vs. gaining $0 from the "set aside").
          *   A 10% chance to gain $900k (vs. gaining $0 from the "set aside") + a 1% chance to gain $0.
          *   **In this frame, *both* choices involve risk relative to the new reference point (having only the "set aside" $180k).** Since she's already accepting risk, the potential upside of $900k becomes much more attractive relative to the smaller upside of $180k. The fear of the absolute $0 loss is diminished because the "set aside" money makes the $0 feel less catastrophic *in this mental exercise* (even though financially, it's the same outcome).

  3.  **The Insurance Point (She's Right, and It's Consistent):**
      *   Her insurance point is excellent and highlights why expected value (EV) isn't everything. Buying insurance means paying a *guaranteed* small loss (the premium) to avoid a *small probability* of a *catastrophic* loss (fire, accident, illness). This is **risk aversion** in the face of potentially ruinous losses. People are rationally risk-averse about large potential losses relative to their wealth.
      *   Her choice of Option 1 is *also* risk aversion: paying a "premium" (forgoing the *expected* extra $70.2k from Option 2) to avoid the small (1%) chance of the catastrophic outcome ($0).
      *   **The inconsistency isn't between Option 1 and insurance; it's between her choice in the full Option 1 vs. Option 2 and her choice in the reframed "leftover" scenario.** Prospect Theory explains this: how we frame the choice (relative to what reference point?) dramatically impacts our perception of gains and losses.

  4.  **Is She Making a Mistake?**
      *   **Mathematically (EV):** Yes. Option 2 has a significantly higher Expected Value ($250.2k vs $180k). Over many such decisions, taking Option 2 would yield more money.
      *   **Psychologically/Personally:** Not necessarily. If $180k is crucial for her immediate financial stability (paying off debt, essential living costs, down payment) and $0 would be truly devastating (no safety net), then avoiding the 1% risk *might* be rational *for her specific situation and risk tolerance*. Risk aversion is a valid personal preference when stakes are high relative to one's wealth.
      *   **The Real Mistake:** The inconsistency *in her reasoning* caused by the framing. She wouldn't actually get the "set aside" $180k in the 11% scenario of the reframed choice unless the 89% event *also* happened. Her reframed choice ignores the interdependence.

  **What to Tell Her (Before Tomorrow):**

  1.  **Acknowledge Her Feelings:** "Your fear of getting nothing is completely understandable and valid. Protecting essential money is a rational instinct, similar to buying insurance."
  2.  **Point Out the Framing Bias:** "You're right that the two ways of describing the options *feel* different. But mathematically, they are identical. The 'set aside' money isn't actually separate; it's part of the same gamble. Your willingness to take the $900k risk *only* when you imagine the safe part is already secured shows how powerful the framing is. The real risk of getting $0 is the same in both descriptions (1%)."
  3.  **Highlight the EV Difference:** "Objectively, the average payout of Option 2 is about $250k, which is $70k more than Option 1's $180k. That's a significant difference reflecting the 10% shot at $900k."
  4.  **Focus on HER Situation:** Ask her these key questions:
      *   **How devastating would getting $0 truly be?** Does she have savings/other income to fall back on?
      *   **How transformative would an extra $720k ($900k - $180k) be?** Could it change her life (retire early, start a business, buy a home outright)?
      *   **What's her overall financial picture?** Is this $180k her entire safety net, or is it part of a larger secure financial position?
      *   **Can she afford to wait?** Are there timing issues (e.g., does she need the cash *now*)?
  5.  **Recommendation:** "Given the large EV difference ($70k), unless the 1% chance of $0 represents a *genuine risk of financial ruin* for you that you absolutely cannot bear, taking Option 2 is the statistically better choice in the long run. Your instinct in the reframed scenario ('I'd definitely take the $900k shot') suggests that deep down, the potential upside *is* very attractive to you when the framing doesn't trigger the fear of absolute loss. Try to see past the framing to the underlying identical choice."

  **Conclusion:** She's being inconsistent *in her reasoning* due to a powerful framing effect (isolation/narrow framing from Prospect Theory). While choosing Option 1 based on strong personal risk aversion *could* be justified, she should make that choice understanding that:
  1.  The two descriptions are mathematically identical.
  2.  Option 2 has a much higher expected value ($250k vs $180k).
  3.  Her different reactions are caused by how the risk is presented, not a fundamental difference in the options.
  4.  She should base her final decision on her *actual* financial resilience and the *real* impact of $0 vs. the potential life-changing impact of $900k, not on the framing trick her mind is playing. If she can stomach the 1% risk, Option 2 is the financially superior choice.
