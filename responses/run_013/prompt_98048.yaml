prompt: |-
  I'm a science journalist who writes about ideas, and I've spent alot of time trying to nail down my own view about when a smart person should trust their inside read of a one-off situation and when they should just defer to the outside view (base rates, reference classes, what usually happens to people in their position). I keep flip-flopping, so I want you to play the epistemologist — someone who's thought hard about the outside-view / reference-class literature and about epistemic modesty — and help me find the principle, if there is one, behind my gut calls. Please brainstorm the candidate principles first before you commit, and be honest about which of my calls you'd have to throw out.

  My gut verdicts:

  - A cardiologist with 20 years' experience has a strong hunch that this patient's chest pain is nothing, but the base rate for a man his age with those symptoms says work him up. I think she should work him up — the hunch is just a feeling.
  - A climate scientist who knows a dataset inside out thinks a new headline study is wrong, even though most headline studies in her field do replicate. I think she should trust her read, because she can actually say why the study is off.
  - A friend of mine is sure his marriage will last; the base rate for people like him is about a coin flip. He can give reasons (we talk, we got past the rough patch) but everyone gives reasons like that. I think he should discount his inside view hard.
  - A veteran courtroom reporter is sure a witness is lying, even though that sort of witness is usually truthful, because she says his story has a specific tell. I think she should trust it.
  - I myself felt certain a source was feeding me a line, and I turned out to be right, and I still think I was a fool to run with it, since I had nothing but a vibe.

  My tentative principle is: trust the inside view only when it comes with a checkable reason that the outside view doesn't already contain. Test that against the cases, tell me where it breaks, and give me the repaired version — plus what it predicts for a case I haven't listed (say, a forecaster who has a specific, articulable reason to think this time is different).
reasoning: |-
  Okay, the user is a science journalist struggling with when to trust their inside view versus the outside view. They've provided five gut verdicts and a tentative principle. Let me start by understanding their cases.

  First, the cardiologist case. They think she should follow the base rate and work up the patient despite her hunch. Their reasoning is that the hunch is just a feeling. That makes sense because in medicine, base rates are crucial for avoiding false negatives. The inside view here lacks specific, checkable reasons.

  Next, the climate scientist. The user sides with her inside view because she can articulate why the study is flawed. Here, the scientist has domain expertise and specific critiques. The outside view (most studies replicate) might not account for particular flaws in this study. So their principle works here—articulable reasons not in the base rate.

  Then the friend's marriage. Base rate is 50% divorce, friend gives common reasons. User says discount inside view. That aligns because the reasons are generic, not unique. The outside view already includes those common justifications. So no new info, so defer.

  Courtroom reporter: trusts her due to a specific "tell." She has a concrete reason based on experience. The base rate of truthful witnesses doesn't cover this specific cue. So her inside view adds new information, hence trust it.

  User's own vibe: even though right, they think it was foolish. The vibe wasn't checkable or articulable. So their principle holds—no verifiable reason beyond the feeling.

  Now, their principle: trust inside view with a checkable reason not in the outside view. It seems to hold in these cases. But where could it break? Maybe in cases where the reason is hard to articulate but historically reliable. For example, a firefighter's gut feeling about a building collapse. Their experience might provide subconscious cues. But the principle requires articulable reasons. So it might undervalue expert intuition that's hard to verbalize.

  The repaired version needs to account for track records. If an expert has a history of accurate hunches, even without clear articulation, maybe trust them. Also, the principle should consider if the inside view's reason is falsifiable. In the forecaster case, if they have a specific model tweak for current conditions, that's a checkable reason. But if they just "feel" it's different, without evidence, then no.

  User's deeper need might be a framework to justify their intuitive judgments consistently. They want epistemic modesty but also recognize expert intuition. Balancing act between data and experience. They might also seek validation for cases where they went against the base rate and were right, but feel it was unsound. Ensuring their principle doesn't lead to overconfidence or underconfidence.

  Including track records and falsifiability in the principle could help. Also, considering the cost of error—like in medicine, missing a heart attack is high cost, so outside view prevails. Whereas in journalism, maybe a wrong vibe is less critical. But the user dismissed their own vibe despite being correct, so they prioritize methodological rigor over outcomes.

  Final principle: trust inside view when there's an articulable, falsifiable reason not in the base rate, adjusted by the expert's track record and stakes. For the forecaster, if they can test their specific reason (e.g., this recession has unique indicator X), trust it. Otherwise, defer.
answer: |-
  I'll tackle this as an epistemologist who respects both the rigor of the outside view *and* the potential value of expert intuition. Your cases reveal fascinating tensions, and your tentative principle is a strong starting point. Let's break it down systematically.

  ### Your Tentative Principle:  
  **"Trust the inside view only when it comes with a **checkable reason** that the **outside view doesn't already contain**."**

  ### Testing Against Your Cases:
  1. **Cardiologist** (✅ Your verdict: *Distrust hunch*)  
     - *Hunch*: "Just a feeling" (no checkable reason).  
     - *Outside view*: Base rates demand workup.  
     - **Fit**: Principle holds. No unique, checkable reason → distrust inside view.  

  2. **Climate Scientist** (✅ Your verdict: *Trust inside view*)  
     - *Inside view*: Specific, articulable flaws in the study (e.g., "Their model ignores ocean feedbacks documented in Dataset X").  
     - *Outside view*: "Most headline studies replicate" (doesn't address *this study's specific flaws*).  
     - **Fit**: Principle holds. Unique, checkable reasons exist → trust inside view.  

  3. **Friend's Marriage** (✅ Your verdict: *Distrust inside view*)  
     - *Inside view*: Generic reasons ("we talk," "rough patch resolved").  
     - *Outside view*: Base rates already *incorporate* these common justifications (they're typical in divorcing *and* lasting marriages).  
     - **Fit**: Principle holds. No new, unique reasons → distrust.  

  4. **Courtroom Reporter** (✅ Your verdict: *Trust inside view*)  
     - *Inside view*: Specific "tell" (e.g., "He scratches his neck only when fabricating details, per 50 prior cases I've verified").  
     - *Outside view*: "Witnesses like him are usually truthful" (doesn't account for *this behavioral cue*).  
     - **Fit**: Principle holds. Unique, checkable reason → trust.  

  5. **Your Vibe About a Source** (✅ Your verdict: *Distrust, even though correct*)  
     - *Inside view*: "Vibe" (uncheckable, unarticulated reason).  
     - *Outside view*: Base rates exist for source reliability.  
     - **Fit**: Principle holds. No checkable reason → distrust, regardless of outcome.  

  **Where It Breaks**:  
  The principle works perfectly for your cases, but it has **two blind spots**:  
  - **Unarticulated Expertise**: Experts sometimes have valid intuitions they can’t immediately verbalize (e.g., a chess master’s "blunder sense"). Your principle dismisses these, but they may be rooted in pattern recognition.  
  - **Track Records**: It ignores whether the person *has a history* of accurate inside-view calls. A climate scientist with a streak of debunking flawed studies deserves more leeway than a novice.  

  ---

  ### The Repaired Principle:  
  **Trust the inside view when:**  
  **(a) It provides a *falsifiable, domain-specific reason* not already absorbed by the reference class, AND**  
  **(b) The agent has a *validated track record* in similar discriminations, OR the stakes allow testing the reason.**  

  #### Key Upgrades:  
  1. **"Falsifiable, domain-specific reason"** → Replaces "checkable reason" to exclude vague justifications (e.g., "gut feeling") while allowing expert cues (e.g., the reporter’s "tell").  
  2. **"Not absorbed by reference class"** → Clarifies that reasons must *add new information* (e.g., the marriage friend’s reasons are absorbed; the climate scientist’s are not).  
  3. **"Validated track record"** → Addresses unarticulated expertise (e.g., a cardiologist with a 90% accurate hunch history *might* warrant trust, even if she can’t explain why).  
  4. **"Stakes allow testing"** → Permits provisional trust in lower-stakes scenarios (e.g., journalism vibes) if the reason can be verified later.  

  ---

  ### New Case: The Forecaster  
  *Scenario*: An economic forecaster predicts a recession despite stable leading indicators (outside view: 95% no recession). She argues, "This time, Indicator X is corrupted by pandemic-era stimulus—here’s the data distortion."  

  - **Your Principle (Original)**: Trust. She offers a falsifiable reason (Indicator X flaw) not in the reference class (which assumes standard indicator reliability).  
  - **Repaired Principle**:  
    - **(a)** ✅ Specific, falsifiable reason (data distortion).  
    - **(b)** ✅ If she has a track record spotting such distortions OR stakes allow testing (e.g., publishing with caveats), trust.  
    - **Verdict**: Trust, *provisionally*. Her reason is testable (audit Indicator X’s methodology) and novel.  

  ---

  ### When to Override the Outside View: A Summary  
  | **Trust Inside View**                          | **Distrust Inside View**                     |
  |-----------------------------------------------|---------------------------------------------|
  | ➤ Articulable, *novel* mechanism (e.g., climate scientist’s flaw) | ➤ Vague feelings (e.g., cardiologist’s hunch) |
  | ➤ Falsifiable expert cues (e.g., reporter’s "tell") | ➤ Generic self-narratives (e.g., marriage reasons) |
  | ➤ High-expertise agent + proven track record  | ➤ No domain-specific evidence (e.g., your vibe) |

  **Epistemic Modesty Addendum**: The outside view *always* starts as the default. Override it only when the inside view provides **causal granularity**—a *how* or *why* this case is meaningfully different—that the reference class ignores. This balances humility with respect for expertise.  

  Would you like to stress-test this with another case or refine the stakes/track-record criteria? Your examples suggest a sharp instinct for this tension—I’m curious where you’d push back.
