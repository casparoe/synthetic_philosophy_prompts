prompt: |-
  ok so i'm in this distributive justice class and our final paper is "take any dead philosopher and argue what theyd say about a contemporary position," and I picked Hume because I did him last term in modern phil and liked him. im doing luck egalitarianism. the core idea (at least the way our prof tells it) is that the distribution of goods should track what people are responsible for and not the stuff they just got unlucky about. so if your worse off because of brute luck — you got sick, you were born in a drought — that's an injustice the state should fix, but if your worse off because of option luck — you gambled and lost, you chose not to work — then thats on you and society doesn't owe you anything. two things bug me and i want the paper to actually dig in instead of being a vibe. first, the whole framework needs a real line between the two kinds of luck and it needs people to be genuinely responsible for the choices that count as option luck. Hume was a compatibilist about free will, so does he even have the machinery for that, or does his own account of liberty and necessity quietly dissolve the distinction. second, Hume thinks justice is an artificial virtue — something we cook up by convention because it's useful, not something that tracks a natural fact about persons like desert or responsibility. so my gut thesis is he'd say luck egalitarianism is confusing an artificial virtue for a natural one. but he also has the sympathy stuff and the bit about how if nature handed us everything we wanted, justice would never have occurred to us — which sounds like he'd be fine with redistributing whenever it's useful, regardless of responsibility. so hes pulling both ways and i cant tell which way wins. can you predict what he'd actually say about luck egalitarianism, not just "he'd be skeptical," and say where his own commitments fight each other. also is the compatibilism objection a real threat to luck egalitarianism or am i overreading it. thanks
