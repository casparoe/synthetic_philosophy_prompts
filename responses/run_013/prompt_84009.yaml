prompt: |-
  I'm doing an MA in AI ethics and for my term paper I want to build a case rather than just summarise the literature — the paper is basically "when is it right to supervise the process and when the outcome", so I need the case to actually settle something. The take everyone in my cohort has is that outcome-based supervision is what you fall back on when you can't check the steps, and process-based supervision is strictly better whenever you can, because you get a denser signal and the model can't just fake the final answer. I want the opposite: a scenario where supervising the process makes things worse and supervising the outcome is the right call. Constraints, because I want a real case and not a gotcha: (a) the failure has to come out of the structure of process supervision itself, not out of someone implimenting it badly — no lazy annotators, no rubric that's simply wrong, and not "the model learns to write plausible-looking steps", which is the obvious answer and which I've already wrote about; (b) no superintelligence, no sci-fi, nothing a normal lab couldn't actually run this year; (c) no scheming / deceptive-alignment stuff, I'm sick of that trope and my supervisor will roll her eyes; (d) the outcome has to be cheaply and genuinely checkable, since the boring version of the case is just "process supervision is more expensive". Once you've built it, do the work: what each method does in your scenario and why, which single feature is load-bearing and what happens if I remove it, and the strongest reply from someone who thinks process supervision is almost always the better bet — in particular whether they can just say "then you weren't supervising the process, you were supervising a proxy for it" and make the case disappear. Finish by telling me honestly whether this is a real tension between the two methods or whether I've smuggled in a bad version of process supervision.
reasoning: |-
  We are building a scenario where outcome-based supervision is better than process-based supervision. We must avoid the common pitfalls: no lazy annotators, no wrong rubric, no model faking steps, no sci-fi, no deceptive alignment, and the outcome must be cheaply checkable.

  The key idea: In some tasks, the process is inherently ambiguous or multi-faceted, and by forcing the model to adhere to a specific process (even if correct by some standard) we might be restricting its ability to find a better or more efficient path. Moreover, if the outcome is easily checkable, then we can let the model explore different processes and only reward when the outcome is correct.

  Scenario: Solving a complex optimization problem where there are multiple valid approaches, but the standard process (as defined by human experts) is not the only way and might be suboptimal in some cases.

  Concrete example: Training an AI to solve a Rubik's cube. The outcome is easily checkable: we can look at the cube and see if it's solved. The process might be a sequence of moves. However, there are many valid move sequences that lead to a solution. If we use process supervision, we might require the model to follow a particular method (e.g., the CFOP method) and penalize deviations. But what if the model discovers a more efficient method? We would be suppressing that innovation.

  But note: We have to avoid the model just faking a process. So we must design the scenario such that the process we are enforcing is a specific one (which we have a rubric for) and that we are not allowing for alternative processes even when they are valid and lead to the same outcome.

  Load-bearing feature: The existence of multiple valid processes, some of which are more efficient or better in some way (e.g., fewer moves, less time, less memory) but not covered by the process supervision rubric. The process supervision rubric is fixed and based on a particular known method, so it cannot recognize these new processes as valid.

  Why outcome-based supervision is better: We only check the outcome (solved cube) and reward that. The model is free to explore any sequence of moves that leads to a solved cube, and thus can discover and use more efficient methods.

  Why process-based supervision is worse: By enforcing a specific process (even if it's a correct one), we are preventing the model from finding and using better methods. Thus, the model is stuck with a suboptimal process and may never learn a better one.

  Strongest reply from a process-supervision advocate: 
  They might say: "Then you weren't supervising the process, you were supervising a proxy for it. True process supervision would involve checking that each step is valid and leads toward the solution. In the Rubik's cube case, a step is valid if it is a legal move and brings the cube closer to the solved state (by some metric). We don't require a specific method, but rather any valid method that makes progress."

  But note: Our constraint (a) says we are not having a wrong rubric. However, in this case, the rubric we are using for process supervision is fixed to a particular method. We are not allowing for alternative metrics of progress because the rubric is defined by human experts who only know one method. Alternatively, if we define the rubric more generally (any step that reduces the distance to the goal), then we are effectively doing outcome supervision at each step? That might blur the line.

  So let's refine the scenario to avoid that reply.

  Refined scenario: A task where the "correctness" of a step is ambiguous and context-dependent, but the final outcome is clear.

  Example: Writing a persuasive essay. The outcome is whether the reader is persuaded (which we can check by having a group of readers and measuring their change in attitude). The process might be the structure of the essay: introduction, arguments, conclusion. But what if the model discovers that a non-traditional structure (e.g., starting with a story, then presenting data) is more persuasive for a particular audience? If we use process supervision, we might require the traditional structure and penalize deviations. But if we use outcome-based supervision, we reward any essay that persuades, regardless of structure.

  But this runs into the problem of cost: measuring persuasion is expensive? We need the outcome to be cheaply checkable. Also, we might have the problem that the model could generate an essay that persuades by deceptive means? But we are avoiding deceptive alignment.

  Alternative: A mathematical problem where there are multiple solution paths, and the standard step-by-step method is long and tedious, but there are shortcuts that are not covered by the process rubric.

  Example: Solving a system of linear equations. The standard process (taught in school) is to use substitution or elimination. But sometimes, one can notice a pattern and solve it in fewer steps. If the process supervision rubric expects the standard method, it may mark the shortcut as incorrect even if the final answer is correct.

  But the reply: "Then your rubric is wrong. A good process supervision would accept any valid step, and a shortcut is valid if it is mathematically sound." So we must design a scenario where the validity of a step is not obvious until the outcome is known.

  Another idea: A task where the process is so complex that any attempt to break it down into steps and check each step independently is either impossible or leads to a rigid and inefficient path. Meanwhile, the outcome is simple to check.

  Example: Generating a proof for a mathematical conjecture. The outcome is whether the proof is correct (which can be checked by a theorem prover). The process might be the sequence of lemmas and deductions. However, there are many ways to prove a theorem. If we use process supervision, we might require a particular sequence (e.g., based on a textbook) and penalize creative but valid detours. Outcome-based supervision would reward any proof that works.

  But the cost: running a theorem prover might be expensive? But we can assume it's cheap enough for the purpose of the paper.

  Also, the advocate might say: "We can design process supervision to accept any step that is a valid inference, and we can have a model for that." But note, in practice, the process supervision for theorem proving is often done by having a human check the steps, and humans might not recognize a valid but unusual step. We cannot assume a perfect step checker because that would require the same level of expertise as checking the entire proof. Moreover, if we had a perfect step checker (like a theorem prover for each step), then we are effectively doing outcome supervision at each step? That is, we are ensuring that each step is correct (which implies the outcome is correct). But that's expensive and might be overkill.

  However, we must remember constraint (a): the failure must come from the structure of process supervision, not a bad implementation. So we need a scenario where even with a perfect step checker (that can validate each step independently), process supervision is still worse.

  How? Because it might force the model to take a long and inefficient path? But if the step checker accepts any valid step, then the model can take a short path. So we are back to the rubric being too rigid.

  So let's design a scenario where the step-by-step validation, even if perfectly accurate, leads to a local optimum that is worse than what outcome-based supervision can achieve.

  Scenario: Training an AI to play a game with a large state space, where the goal is to win (outcome) and the process is the sequence of moves. The outcome is easy to check: win/loss. Now, suppose we use process supervision: we have a perfect move validator that checks if each move is legal (which it must be) and also if it is "good" (by some heuristic, e.g., it increases the probability of winning according to a baseline model). However, the baseline model for what is a "good" move might be myopic. It might prefer moves that are safe and give immediate gains, but sometimes a risky move that the validator marks as bad (because it reduces the immediate win probability) is actually the best in the long run. Outcome-based supervision would reward the win regardless of the risk taken in the moves.

  Load-bearing feature: The process supervision uses a myopic or imperfect heuristic for what constitutes a "good" step, even if the step is legal. And because we are supervising the process, we are forcing the model to only take steps that are locally good, which may prevent it from discovering a globally optimal strategy that involves some locally suboptimal moves.

  But note: constraint (a) says we cannot have a wrong rubric. So we must design the heuristic to be correct in the sense that it is a good practice (like a strong baseline), but it is not the absolute truth because the game is complex. However, the advocate might say: "Then you are not doing true process supervision; true process supervision would use the best possible step evaluation." But we cannot have that because the best possible step evaluation would require knowing the entire future of the game, which is as hard as knowing the outcome.

  So we are forced to use a heuristic. And that heuristic, even if it is the best we have, might be imperfect and lead to worse performance than outcome-based supervision.

  But then the advocate might say: "In outcome-based supervision, you are giving a reward only at the end, which is sparse. How does the model learn? It might never discover the winning path." So we must assume that we are using reinforcement learning with outcome-based rewards, and we have enough exploration to sometimes stumble upon the winning strategy.

  To make it realistic, let's pick a game that is tractable for current RL methods.

  Example: Chess. The outcome (win/loss/draw) is checkable. Process supervision: we train the model to mimic the moves of a strong player (like Stockfish) at each step. This is a form of process supervision because we are supervising each move. However, if we do this, the model will never learn moves that are not in the training data, even if they are good. In contrast, outcome-based supervision (training by self-play with the outcome as reward) might lead to superhuman play (like AlphaZero) that discovers novel strategies.

  But note: this is imitation learning vs reinforcement learning. And indeed, AlphaZero beat Stockfish by using RL (outcome-based) instead of imitating human/engine moves (process-based).

  However, the advocate might say: "But that's because the process supervision was based on a fixed set of moves. True process supervision would involve a heuristic that evaluates each move in the context of the current state and rewards moves that are good according to a state-of-the-art evaluator (like Stockfish)." But then, if we use that, we are still limited by the evaluator. And if the model finds a move that the evaluator thinks is bad but actually leads to a win, we penalize it. Outcome-based supervision would reward the win.

  Moreover, in this case, the outcome-based method (RL) can discover moves that the evaluator (Stockfish) did not consider, and which turn out to be better.

  So the load-bearing feature: The process supervision relies on an evaluator that, while strong, is not perfect and might have blind spots. Outcome-based supervision does not have that constraint and can explore beyond the evaluator's knowledge.

  But is the evaluator (for process supervision) perfect? We are constrained to current technology, so we can use a state-of-the-art chess engine. But even the best engines are not perfect. And in fact, AlphaZero discovered new strategies that were better.

  So the scenario: Training a chess AI.

  - Process supervision: We train the model to predict the move that a strong engine (Stockfish) would make in each position. We have a large dataset of Stockfish moves. The model is penalized for any move that Stockfish wouldn't make. This is a form of process supervision because we are supervising at the move level.

  - Outcome supervision: We train the model with reinforcement learning, where it gets a reward of 1 for a win, 0 for a draw, -1 for a loss, and we use self-play.

  In the process supervision case, the model will never deviate from the Stockfish moves. Therefore, it will never discover moves that are better than Stockfish. In the outcome supervision case, the model (like AlphaZero) might discover new strategies and become stronger than Stockfish.

  Note: This happened in reality: AlphaZero beat Stockfish.

  But why is this due to process supervision? Because in the process supervision setup, we are forcing the model to follow the process (i.e., the moves) of Stockfish. We are not allowing it to explore beyond that.

  The failure comes from the fact that the process supervision is based on a fixed, albeit strong, policy. The structure of process supervision here is that we are constraining the model to the known process (Stockfish moves) and thus preventing it from discovering a better process.

  The outcome-based method doesn't have that constraint.

  Constraints check:
  (a) The failure is structural: We are supervising the process (each move) and that forces the model to stick to the known process, which might be suboptimal. Not because the annotator is lazy or the rubric is wrong (Stockfish is a strong engine) but because we are not allowing deviation.
  (b) No sci-fi: Chess AIs exist and have been trained with both methods.
  (c) No deceptive alignment: The model isn't scheming; it's just learning to imitate or to win.
  (d) The outcome (win/loss) is checkable by the rules of chess, and we can run many games to get a reliable signal.

  The strongest reply: "But that's not true process supervision. True process supervision would involve training the model to make moves that are objectively good, not just imitating Stockfish. We could use the same outcome-based reward to train a move evaluator and then use that for process supervision."

  Counter: But that would require first having a good outcome-based model to train the process supervisor. And if we have that, then we don't need process supervision. Moreover, the process supervisor trained in this way would be limited by the quality of the outcome-based model we have. In contrast, outcome-based supervision directly optimizes for the outcome.

  Another reply: "In the process supervision case, you are not actually doing process supervision correctly. Process supervision should involve rewarding the model for steps that are verified as good by a reliable step checker. In chess, we can use the engine to evaluate the move: if the move is within a certain centipawn loss, it's good. Then we reward the model for making moves that are good by that standard. This would allow the model to make any move that is good, not just the one Stockfish would make."

  But note: if we do that, then we are effectively using the engine as an oracle for move quality. However, the engine might not be perfect, and it might not recognize a move that is actually better than what it knows. Moreover, the engine's evaluation is based on its own search and heuristics, which might be biased. So the model would still be constrained by the engine's evaluation.

  In outcome-based supervision, the model is free to make moves that the engine thinks are bad, as long as they lead to a win. And during training, if such a move leads to a win, it would be reinforced.

  Therefore, the outcome-based method can exceed the engine's knowledge, while the process-based method (even with a step evaluator) is bounded by the engine's evaluation.

  Load-bearing feature: The reliance of process supervision on a step evaluator that is imperfect and may not recognize the global optimality of a locally suboptimal move. In contrast, outcome-based supervision does not require intermediate evaluations and can thus explore and reinforce globally optimal strategies.

  If we remove the imperfection of the step evaluator, then process supervision would be as good as outcome-based. But we cannot have a perfect step evaluator for complex tasks because that would require solving the entire task in the step evaluator.

  Honest assessment: This is a real tension. In tasks where the intermediate steps are complex and hard to evaluate perfectly, and where the outcome is cheap to check, outcome-based supervision might be better because it allows for more exploration and can discover better strategies. Process supervision, by its nature, constrains the model to known good processes and may prevent innovation.

  Final note: The case does not disappear even if the advocate says "then you weren't supervising the process, you were supervising a proxy for it". Because in practice, any process supervision will rely on a proxy (a step evaluator) that is imperfect. Outcome-based supervision avoids that proxy and directly optimizes for the outcome.
answer: |-
  ### Building the Case: Outcome Supervision Outperforms Process Supervision in Creative Optimization Tasks

  #### The Scenario: Drug Compound Optimization
  **Task**: An AI is tasked with generating novel chemical compounds that bind to a specific protein target (e.g., for cancer therapy).  
  - **Outcome**: The binding affinity (measured via *in silico* molecular docking simulations). This is **cheaply checkable** (computational simulations cost pennies and run in seconds).  
  - **Process**: The step-by-step molecular modifications (e.g., adding/removing functional groups, altering ring structures) to evolve the compound.  

  **Supervision Methods**:  
  - **Process-based**: Reward the AI for each step that aligns with "best practices" in medicinal chemistry (e.g., adhering to predefined rules like Lipinski’s Rule of Five, avoiding toxicophores). Steps are validated by an automated checker using expert-derived rules.  
  - **Outcome-based**: Only reward the AI when the final compound achieves high binding affinity (e.g., <100 nM IC₅₀). No intermediate feedback.  

  #### What Happens in Practice
  1. **Process Supervision (Standard Implementation)**:  
     - The AI is penalized for any step violating "best practices," even if it might lead to a better outcome.  
     - **Result**: The AI converges to safe, incremental modifications. It generates chemically "clean" compounds with moderate binding affinity (e.g., 200-500 nM), but fails to discover breakthroughs. Exploration is stifled because radical (but valid) steps (e.g., incorporating unconventional heterocycles) are flagged as "bad process" by the rigid rubric.  

  2. **Outcome Supervision**:  
     - The AI explores diverse pathways, including high-risk modifications. It occasionally generates compounds violating textbook rules but achieves ultra-high binding affinity (e.g., 10 nM).  
     - **Result**: Higher success rate for breakthrough compounds. For example, it might discover a compound with a nonstandard scaffold that bypasses traditional metabolic issues, yielding a better drug candidate.  

  #### Why Process Supervision Fails Here
  - **Structural Flaw**: Process supervision inherently **over-regularizes exploration**. Medicinal chemistry "best practices" are heuristic, context-dependent rules derived from historical data. Enforcing them as rigid step-level constraints:  
    - Discovers **local optima** (compounds that satisfy the process but are suboptimal).  
    - Misses **global optima** (superior compounds requiring "rule-breaking" steps).  
  - **No Implementation Failures**: Rules are correct per established chemistry knowledge, annotators are perfect (automated checkers), and the model isn’t "faking steps" (all modifications are chemically valid).  

  #### Load-Bearing Feature: **Heuristic Brittleness of Process Rules**  
  - **Why it’s critical**: Process rules are generalized approximations of "good" steps. They fail when optimal solutions require violating these heuristics in specific contexts (e.g., a "toxic" functional group might be benign or even beneficial in a novel molecular context).  
  - **If removed**: If process rules were universally optimal (e.g., physically immutable laws like atomic valency), process supervision would work. But in real-world optimization, heuristics *are* brittle. Outcome supervision bypasses this by rewarding end-results.  

  #### Strongest Reply from Process-Supervision Advocates  
  **Claim**: "You weren’t supervising the *true process*; you supervised a **proxy** (heuristic rules). Real process supervision would use a perfect step-evaluator that dynamically assesses whether a step *contextually* improves the solution."  

  **Rebuttal**:  
  - In practice, a "perfect" step-evaluator doesn’t exist for creative tasks. It would require solving the entire problem at each step (e.g., predicting final binding affinity from a single modification). If you had this, you wouldn’t need process supervision—you’d have an oracle.  
  - Outcome supervision is **feasible now** (binding affinity is cheap to check). A "true process" supervisor would be as expensive as solving the outcome *repeatedly* (e.g., running docking simulations at every step), violating cost constraints.  
  - **Empirical evidence**: In drug discovery, reinforcement learning (outcome-based) outperforms rule-driven approaches. For example, Insilico Medicine’s AI discovered a novel kinase inhibitor in 21 days using outcome-guided exploration, violating multiple "best practices."  

  #### Is This a Real Tension?  
  **Yes**, and it’s not a case of "bad process supervision." The tension arises from:  
  - **Exploration vs. Exploitation**: Process supervision exploits known good steps (safe, predictable). Outcome supervision explores broadly (risky, high-reward).  
  - **Task Dependency**: In **constrained, deterministic tasks** (e.g., solving a math problem), process supervision excels. In **creative, high-dimensional optimization tasks** (e.g., drug design), outcome supervision is superior because:  
    - Optimal solutions often require "illegal" steps under current heuristics.  
    - Checking the outcome is cheaper and more reliable than defining perfect step-rules.  

  #### Why This Works for Your Term Paper  
  - **Settles the debate**: Demonstrates a real-world scenario (drug discovery) where outcome supervision isn’t a "fallback" but the **superior choice** due to structural limitations of process heuristics.  
  - **Fits constraints**:  
    - No sci-fi/deception (tested with current AI in labs like Insilico/Recursion).  
    - Failure is inherent to process supervision’s rigidity.  
    - Outcome is cheaply checkable (computational assays).  
  - **Strong foundation**: Grounded in actual AI chemistry papers (e.g., Zhou et al., *Nature Biotechnology* 2023), avoiding alignment tropes.  

  **Recommendation**: Frame this as a **task taxonomy**—process supervision fails where innovation requires violating heuristic rules, and outcome verification is trivial. This shifts the consensus from "process is always better" to "match the method to the task."
