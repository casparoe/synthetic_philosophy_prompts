prompt: |-
  Okay, so my reading group is doing the ethics of killing and a friend of mine (animal-ethics guy, very sharp) dropped this on us last week and I can't shake it. I think it proves way more than he thinks it does, and he thinks the extra bit is just squeamishness.

  His argument:

  (1) When killing a being is wrong, it's wrong because of what it takes from that being — the good life it would otherwise have gone on to have. So the wrongness of killing is proportional to the amount of welfare the victim would have had ahead of them.
  (2) That amount = (time left) × (richness of experience per unit time). A being with a thin mental life loses less per year than a being with a rich one.
  (3) How rich a being's mental life can be is set by how much information-processing machinery it's got. Across the animal kingdom the rough proxy for that is brain size, corrected for body size so we're not just measuring how big the animal is.
  (4) So the wrongness of killing a being is proportional to its body-corrected brain size. He likes this because it lets you put a number on things — you can even state an exchange rate, so many chicken-years to one human-year.
  (5) Nothing in (1)–(3) says anything about species. They're stated for individual beings, one at a time. So (4) has to hold being by being: if two individuals differ in neural machinery, then other things equal, killing the one with more is worse.
  (6) Brains vary alot between individuals of the same species, including ours. Some of that variation is body size, but not all of it; brains also shrink with age and with illness.
  (7) So — other things equal — killing a bigger-brained person is worse than killing a smaller-brained one, and a person whose brain has badly atrophied drops toward the bottom of the human range, which puts them below a chimp.
  (8) That's nuts. Nobody thinks the person with the smaller brain counts for less.
  (9) So something in (1)–(3) has to go — (6) is just biology and (5) is just reading (1)–(3) at face value.

  His actual point in the group was the nice half: he thinks it explains why killing a chimp is worse than killing a chicken, and he was using it to argue that brain size is morally relevant. And sure, it seems to deliver that. It just also delivers the ugly half.

  I don't want to give up (1) or the chimp/chicken verdict — (1) is the only decent story I have about why death is bad at all, and if I lose the cross-species ranking then brain size stops mattering and his whole paper collapses, which I don't think is right either. My money's on (3) being where the trick is, like "brain size" is quietly doing two different jobs, one across species and one within one. But he says (3) is the only premise doing any work, and if you drop it you drop the chimp/chicken verdict too, which was the whole point of the thing.

  Also, and I don't think hes noticed this: the measures don't even agree with each other. Total neuron count puts elephants miles above us. Plain brain-to-body ratio makes a shrew look like a genius. The body-size-corrected quotient is the one that crowns us. And bird brains pack two to four times the neurons per gram that mammal brains do, so a crow's walnut isn't the walnut you'd think it is.

  So which step do I actually give up, and what does each choice cost me? Please lay it out like this:

  **The step I should drop** — one paragraph, name it and say what's wrong with it.
  **Why it looked safe** — a short paragraph on what made that step seem obviously fine.
  **The other exits, and the price of each** — the bulk of it, roughly 500 words. For each step I could drop instead of yours, say what I'd be giving up and what I'd have to say instead.
  **What you'd actually do** — one paragraph. Which step you'd drop, and what I should say next time he brings it up.

  No literature survey please, I just want the diagnosis.
reasoning: |-
  Okay, the user is in a philosophy reading group discussing the ethics of killing, and their friend presented an argument that links the wrongness of killing to brain size. The user feels this argument leads to uncomfortable conclusions, like valuing humans with smaller brains less. They want to know which premise to reject without losing the intuitive cross-species comparisons.

  First, I need to break down the argument step by step. The friend's premises are:
  1. Wrongness is proportional to the future welfare lost.
  2. Future welfare = time left × richness of experience.
  3. Richness of experience depends on neural machinery, proxied by body-corrected brain size.
  4. Therefore, wrongness is proportional to that brain size metric.
  5. This applies individually, not by species.
  6. Brain size varies within species, including humans.
  7. So killing a human with a smaller brain is less wrong, even below a chimp.
  8. This is counterintuitive.
  9. One premise must be wrong.

  The user doesn't want to reject premise 1 because it explains why death is bad. They also want to keep cross-species distinctions like chimps over chickens. Their hunch is premise 3 might be problematic, especially since brain size proxies vary (e.g., neuron count vs. EQ).

  The key issue is premise 3's claim that brain size directly determines richness of experience. But richness isn't just processing power; it's about the type of experiences. Humans value complex social relationships, abstract thoughts, etc., which aren't solely a function of brain size. A human with a smaller brain might still have richer experiences than a chimp due to different neural structures or cultural factors. 

  Premise 3 conflates capacity with actual richness. Within a species, even with reduced brain size, the richness might be similar due to shared environments and social structures. Across species, brain size might correlate with capacities, but it's not the whole story. This preserves the chimp/chicken distinction while avoiding the problematic within-human conclusion.

  The user mentioned that different brain metrics conflict (e.g., total neurons in elephants, neuron density in birds). This inconsistency undermines using any single metric as a moral proxy. Highlighting that premise 3 oversimplifies "richness" avoids both issues.

  Other premises to consider:
  - Dropping premise 1: But the user finds it essential for explaining why death is bad. Rejecting it would require an alternative account, which complicates things.
  - Rejecting premise 5: Applying the metric only across species, not within. However, this seems ad hoc and speciesist without justification.
  - Rejecting premise 2: Separating time and richness, but that might not resolve the core issue.
  - Denying premise 6 or 7: But brain size does vary within humans, so denying biology isn't feasible.

  The best approach is to target premise 3. By arguing that richness of experience isn't solely dependent on neural machinery as measured by brain size, especially within species, the user can maintain cross-species differences without devaluing humans with smaller brains. They should point out that actual lived experiences and relational capacities matter more than a physical proxy.
answer: |-
  Here's the diagnosis, structured as requested:

  **The step I should drop**  
  Premise (3) is the core flaw. It falsely equates "richness of experience per unit time" with "information-processing machinery" proxied by body-corrected brain size. Richness of experience isn’t reducible to raw computational power or any single neural metric. It depends on *qualitative aspects* of consciousness—like depth of relationships, self-awareness, narrative continuity, or access to culturally embedded meaning—that aren’t captured by brain size alone. A human with dementia may have reduced neural machinery but retains a life embedded in human relationships, memories, and symbolic identity, making their experiential richness incomparable to a non-human animal with similar brain metrics. Premise (3) ignores that identical neural hardware can generate vastly different experiences across species (e.g., a bird’s densely packed neurons facilitate flight/navigation, not human-like foresight), and it overlooks how *context* (social, environmental) shapes welfare potential.

  **Why it looked safe**  
  It seemed plausible because brain size *broadly correlates* with cognitive complexity *across species*, and we intuitively accept that smarter animals have richer inner lives (e.g., chimps vs. chickens). The appeal to "information-processing" feels scientifically grounded, and body-size correction appears to control for irrelevant variables. Your friend treats "richness" as a fungible, scalable quantity—like processor speed—making cross-species comparisons seem mathematically tidy.

  **The other exits, and the price of each**  
  *Premise (1)*: Dropping "wrongness proportional to lost welfare" forces you to abandon the deprivation account of death’s badness. You’d need an entirely different theory—e.g., deontology (killing violates rights regardless of welfare), species membership (humans have intrinsic value), or a "life worth living" threshold (any being above it loses equally when killed). **Cost**: Losing (1) guts the intuitive link between death and lost future goods. It makes the chimp/chicken verdict arbitrary unless you graft on another hierarchy (e.g., cognitive capacity), which might reintroduce the same problem. Your friend’s paper *does* collapse here.  

  *Premise (2)*: Rejecting "welfare = time × richness" means denying that welfare is multiplicative. You could argue time and richness interact non-linearly (e.g., a year of rich life isn’t *n*-times better than *n* years of thin life) or that richness is incommensurable across beings. **Cost**: This doesn’t resolve the core issue. Even if welfare isn’t strictly multiplicative, premise (3) still ties "richness" to brain size, so the ugly half persists. You also lose the neat "exchange rate" your friend likes, muddying cross-species comparisons.  

  *Premise (5)*: Denying that premises apply "being by being" means accepting species averages or thresholds. You could argue neural metrics only matter *across species*, or that humans have a "moral floor" regardless of individual variation. **Cost**: This looks ethically ad hoc—speciesism without justification. It doesn’t explain *why* brain size matters for chimps but not humans, undermining your friend’s individualistic framework. The chimp/chicken ranking survives, but at the price of inconsistency.  

  *Premise (6)/(7)*: Denying neural variability’s moral relevance (e.g., "all humans have 'human-equivalent' richness regardless of brain size") requires asserting human exceptionalism. **Cost**: This rejects empirical biology—brains *do* vary—and dismisses your friend’s core insight that neural capacity grounds moral status. It also fails non-humans: if a human with severe atrophy has full moral status, why doesn’t a cognitively similar chimp?  

  *Premise (4)*: Rejecting the conclusion directly (e.g., "brain size isn’t proportional to wrongness") without ditching a premise is circular. You’d need to explain *why* the math fails, which points back to (3).  

  **What you’d actually do**  
  Drop premise (3) and explain it this way: *"Brain size is a crude proxy for cognitive* capacity*, but capacity ≠ experienced richness. Richness is shaped by how neural hardware is* deployed *in a lifeworld—human sociality, language, and historical selfhood create a qualitative shift. A human with a small brain still participates in that lifeworld; a chimp doesn’t. So brain size correlates with richness* across species *but not* within humans *because humans share a unique experiential context. Your metrics (neuron count, density) conflict precisely because they measure machinery, not richness. We can keep deprivation theory and the chimp/chicken verdict by tying richness to species-typical capacities for complex flourishing—not individual brain measurements."*  

  **Next step**: Press him to define "richness" non-circularly. If it’s just "whatever brain size measures," his argument is tautological. If it’s lived experience, then context is inescapable.
