prompt: |-
  I work in accident and incident investigation — industrial and aviation safety — so my professional vocabulary is the one used to apportion causal responsibility after the fact: but-for and sine qua non causation, cause versus mere condition, intervening and superseding causes, proximate cause, comparative fault percentages, joint and several liability, the distinction between operator error and systemic or organizational failure, and the hindsight bias investigators are trained to fight precisely because we always know how the story ended.

  I have been reading about the historiographical quarrel over who is to blame for the First World War: the dispute reopened in the 1960s by a German historian who argued from the archives that the Reich had been pursuing expansionist aims all along, set against the older view that Europe slid into war through a shared failure of diplomacy, and against the later view that domestic pressures rather than any master plan drove the key decisions. Restate that quarrel in my vocabulary, as faithfully as you can — the competing theses and the evidence marshalled for each, rendered as competing causal apportionments. Then give me the residue report: what failed to survive the translation, and for each piece of residue, whether it marks a gap in my framework or a sign that the historians' disagreement is thinner than it sounds. Where you had to fudge rather than translate, say so rather than smoothing it over. Do not take a side on the war yourself, and do not assume that "who was at fault" means the same thing in the historians' mouths as it does in a fault-apportionment report — if my framework forces a verdict the historians would call a category error, flag that as an artifact of the translation.

  Return your answer as JSON with this schema:

  - "translation": array of objects, each with "historical_claim", "rendering_in_my_vocabulary", "fidelity" (one of "clean", "distorted", "forced"), and "where_it_strains" (empty string if none).
  - "residue": array of objects, each with "historical_claim", "why_no_counterpart", and "diagnosis" (one of "gap in my framework", "original dispute is doing work my framework cannot see", "original claim is vaguer than it looked").
  - "hardest_case": the single translation you are least confident in, with a sentence of justification.
  - "bottom_line": one sentence on whether the translation improved or damaged the original quarrel.
reasoning: |-
  We are going to restate the historiographical quarrel about the causes of WWI using the vocabulary of accident investigation.
   The competing theses:
   1. The older view (pre-1960s): Europe slid into war through a shared failure of diplomacy (multicausal, shared responsibility).
   2. The Fischer thesis (1960s): Germany was primarily responsible due to expansionist aims (the Reich had a master plan for war).
   3. A later view: Domestic pressures (in various countries) drove the key decisions, rather than any master plan.

   We will translate these into causal apportionment terms.

   Important: We are not taking sides. We are translating and noting where the translation distorts or forces the original.

   Steps:
   - For each historical claim, we create an entry in the "translation" array.
   - We note the fidelity: 
      - "clean" if the translation is straightforward and preserves the meaning.
      - "distorted" if we had to change some nuances but the core is there.
      - "forced" if we had to push the claim into a mold that doesn't fit well.
   - We also note where it strains.

   In the residue, we note what didn't translate and why.

   Let's break down:

   Thesis 1: The older view (shared failure of diplomacy)
     - In our terms: This is a case of joint and several liability, with comparative fault percentages being distributed among the major powers (Austria-Hungary, Russia, Germany, France, etc.). The cause is a chain of diplomatic failures (intervening causes) and the war is seen as a system failure (systemic/organizational failure of the European diplomatic system). The but-for causation: but for the failures of multiple actors, the war would not have happened. The proximate cause might be the immediate events (like the July Crisis) but the deeper causes are conditions that were necessary but not sufficient on their own (mere conditions).

   Thesis 2: The Fischer thesis (German expansionism)
     - In our terms: Germany is the proximate cause and the primary but-for cause. Without Germany's expansionist aims (sine qua non), the war would not have happened. The other nations might have contributed conditions, but the active cause was Germany's plan. This thesis might see the domestic situation in Germany as part of the systemic failure that allowed the expansionist plan to proceed (operator error at the level of the German leadership? but note: it's not just an operator error, it's a deliberate plan). However, note that Fischer argued from archives showing German leaders had a plan for war.

   Thesis 3: The domestic pressures view
     - In our terms: The war was caused by the interaction of domestic pressures in multiple countries (systemic/organizational failures in each country) that led to a situation where leaders felt they had no other option. This is similar to joint and several liability, but the fault is apportioned to the internal political and social conditions in each country. The but-for causation: without these domestic pressures (in at least the key countries), the war would have been avoided. The proximate cause might be the decisions made under pressure.

   Now, residue: what doesn't fit?
     - The historians are often concerned with intentionality and moral responsibility in a way that our framework might not capture. For example, our framework is designed to apportion fault for the purpose of liability (which might be legal or financial) but the historians are often debating moral and historical responsibility.
     - The concept of "blame" in history might be more about assigning moral responsibility, whereas in accident investigation it's about causation for the purpose of preventing recurrence and assigning liability.
     - The historians are also concerned with the evidence from archives (which is about what the decision-makers thought and intended) and how that affects the causal story. In accident investigation, we often have physical evidence and data logs, but the human intentions are harder to capture and may be treated differently.

   Let's structure the output as JSON.

   Translation array:

     Claim 1: The older view (shared failure of diplomacy)
       historical_claim: "Europe slid into war through a shared failure of diplomacy."
       rendering_in_my_vocabulary: "The war was the result of a systemic failure in the European diplomatic system, with joint and several liability among the major powers. The but-for causes include multiple diplomatic missteps by various nations, each contributing a necessary condition. The proximate cause was the chain of events in the July Crisis, which was an intervening cause that triggered the war. Comparative fault percentages would be distributed among the powers, with no single nation bearing majority fault."
       fidelity: "clean" (because it fits the idea of shared conditions and multiple necessary causes, and the system failure concept)
       where_it_strains: "The concept of 'diplomacy' as a system is analogous to an organizational system, so it fits. However, the translation might underemphasize the role of individuals (like operators) and overemphasize the system."

     Claim 2: Fischer thesis (German expansionism)
       historical_claim: "Germany was primarily responsible due to expansionist aims, as shown by archival evidence of a premeditated plan for war."
       rendering_in_my_vocabulary: "Germany's expansionist policy was the sine qua non cause of the war. The archival evidence shows a premeditated plan (akin to operator error at the highest level of the German state) that was the proximate cause. The actions of other nations were mere conditions. Comparative fault would assign the majority percentage to Germany, with the rest distributed among other nations for contributing conditions. The German leadership's actions are the superseding cause that overrode other intervening factors."
       fidelity: "forced" (because the idea of a premeditated plan is more than just operator error; it's a deliberate act, which our framework might not distinguish well from a system failure. Also, the concept of a "superseding cause" might not perfectly fit because the other nations' actions were not necessarily independent intervening causes that broke the chain.)
       where_it_strains: "The framework does not have a clear category for state-level intentional acts as distinct from system failures. Also, the archival evidence of intent is a type of evidence we might not typically have in accident investigation, and it complicates the causal apportionment by introducing motive."

     Claim 3: Domestic pressures view
       historical_claim: "Domestic pressures in the key nations (not a master plan) drove the decisions that led to war."
       rendering_in_my_vocabulary: "The war was caused by systemic failures in multiple nations, where domestic pressures created conditions that forced leaders into decisions that escalated the crisis. The but-for cause was the presence of these domestic pressures in several nations. Liability is joint and several, with comparative fault percentages distributed based on the extent to which each nation's internal situation contributed. The proximate cause was the interaction of these pressures during the July Crisis, which acted as an intervening cause that turned a crisis into a war."
       fidelity: "distorted" (because the framework's 'systemic failure' is a good fit, but the idea of domestic pressures is a bit vague and might be seen as a condition rather than an active cause. Also, the translation might overemphasize the system and underemphasize the agency of leaders.)
       where_it_strains: "The translation blurs the line between condition and cause. Also, the framework does not have a good way to account for the interaction of multiple independent systemic failures."

   Residue array:

     Residue 1: The moral dimension of blame.
       historical_claim: "The historians are often concerned with moral responsibility and the 'war guilt' question (as in the Treaty of Versailles)."
       why_no_counterpart: "The accident investigation framework is designed for causal apportionment for the purpose of liability (often legal or financial) and prevention, not moral judgment."
       diagnosis: "gap in my framework"

     Residue 2: The role of evidence from archives (intentions and plans).
       historical_claim: "The Fischer thesis relies heavily on archival evidence showing German leaders had expansionist aims and planned for war."
       why_no_counterpart: "In accident investigation, we rarely have access to the internal thoughts and plans of the operators in the same way. We rely more on physical evidence and data recorders. Intent is not typically part of causal analysis in accidents (unless it's a criminal act)."
       diagnosis: "gap in my framework"

     Residue 3: The idea of "sliding" into war (in the older view) versus a deliberate act.
       historical_claim: "The older view emphasizes the inadvertent nature of the escalation (they 'slid' into war)."
       why_no_counterpart: "The accident framework can capture inadvertent actions through the concept of operator error or system failure, but the metaphor of 'sliding' implies a lack of control that is not easily captured in the binary of cause vs. condition. It also suggests a path dependency that our linear causal chain model might not represent well."
       diagnosis: "original dispute is doing work my framework cannot see" (because it's about the nature of the process, which is more complex than a chain of causes)

     Residue 4: The distinction between a master plan and domestic pressures (which might be uncoordinated and reactive).
       historical_claim: "The debate between whether there was a master plan (Fischer) or uncoordinated reactions to domestic pressures (later view)."
       why_no_counterpart: "The accident framework does not distinguish well between a coordinated plan and uncoordinated reactions. Both are patterns of human decisions that can be analyzed as causes. The framework might treat both as either operator errors or system failures without capturing the intentionality difference."
       diagnosis: "gap in my framework"

   Hardest case: 
     We are least confident in the translation of the Fischer thesis because the idea of a premeditated plan by a state is hard to fit into the accident model. In accident investigation, we don't typically deal with intentional harmful acts (which might be criminal) and our causal models are built for unintentional accidents. This is a forced translation.

   Bottom line: 
     "The translation improved the clarity of causal apportionment in the older and domestic pressure views but forced the Fischer thesis into an ill-fitting model, thus damaging the original quarrel's nuance on intentionality."

   Let's write the JSON accordingly.
