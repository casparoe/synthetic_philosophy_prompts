  The core of their idea is challenging the traditional shape metaphor (foundation, circle, infinite chain) used in the regress problem. They think two different regresses are being conflated: dependence (each justification depends on another) and demand (endless challenges of "what justifies that?"). They suspect foundationalism and infinitism might actually address different regresses, and coherentism might not be a separate solution but a holistic view. The goal is to disentangle these and identify where the real disagreements lie.

  Their novel contribution is distinguishing between generative chains (subject actively produces new reasons) and retrieval chains (reasons pre-exist and are accessed). They suspect infinitism only works for generative chains, and that switching to retrieval chains makes infinitism collapse into coherentism. They want to test if this distinction holds up and what each position implies for a finite subject who can generate new reasons.

  For the prospectus, they need:
  - A clear, answerable research question
  - Why existing positions don't resolve it
  - Methodology: monthly plan, cases to test the generative/retrieval distinction
  - Expected results: how to validate or invalidate the distinction
