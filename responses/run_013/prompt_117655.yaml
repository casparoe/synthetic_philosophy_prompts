prompt: |-
  I'm in a seminar on perception and we've spent what feels like three weeks circling the old puzzle about the person who's been blind since birth, can tell a cube from a sphere by touch, and then gets their sight back — does he know which is which just by looking? Everyone nods along and then nothing gets decided, and I've realised why: the classic version of the case is compatable with basically every position at once, so it can't discriminate between them. What I want from you is a version built to order that actually does the work. My half-formed idea, take it or leave it: the subject has been blind from birth, no light perception at all, and for a few years before the operation he's been using one of those sensory substitution rigs — camera on the head, signal driving a grid of vibrating pins against his back or his tongue, the sort of thing people really do use — and he's gotten good with it, so he's had a lot of practice with how the signal changes as he moves, turns, leans in, reaches out. By the time the bandages come off he has a deep grip on the laws connecting his own movements to changes in the input, he's just never had any of it in a visual format.

  The three positions I want to separate: (a) the old empiricist line — recognising across the senses is learned from experienced correlations between them, so with no prior visual experience he should fail flatly; (b) the nativist line — the visual system arrives with its own spatial machinery, so he should recognise the shapes straight away, history be damned; and (c) my own hunch, which is that seeing a shape is really a skill, and the skill is about the movement-dependence of the input rather than about which organ is delivering it — on this view he should succeed, but with a signature: fine when he's allowed to move around the object and watch the signal change, hopeless when the thing is just flashed at him for half a second. Build the scenario so that those three verdicts fall out of the three positions and aren't smuggled into the story.

  Constraints: keep the medical side mundane (surgery and devices that actually exist, no magic, no perfect prosthetics), the scenario itself no longer than about 200 words, and don't give him any visual experience whatsoever before the operation. After the scenario, go through each position and show where its verdict comes from, then tell me honestly which single feature is doing the work, what happens if I strip that feature out (I suspect it collapses back into the undecisive classic case, but check me), and how a defender of (b) would try to save it — I can already hear someone saying my subject is doing it all through the device and never really seeing anything. No need for citations, I'll add those myself. End with one line of the form Verdict: <the position the case would count as evidence for, if it came out as specified> — <the single feature that does the work>.
reasoning: |-
  Okay, the user is in a philosophy seminar discussing the Molyneux problem—whether a person blind from birth could recognize shapes by sight alone after gaining vision. They feel the classic version is too vague and want a tailored scenario that clearly differentiates between three philosophical positions: empiricism, nativism, and their own sensorimotor skill-based view. 

  The user proposes a twist: the subject uses a sensory substitution device (like a camera-to-tactile grid system) pre-surgery, mastering how movements affect input signals. Post-surgery, they'd test recognition with and without movement. The goal is to force distinct predictions: empiricism predicts failure, nativism predicts instant success, and the skill view predicts success only with movement. 

  Key constraints: medically plausible (real tech/surgery), under 200 words, zero prior visual experience. Post-scenario, I need to: 
  - Map each position to its verdict 
  - Identify the critical feature making the case decisive 
  - Show how removing it reverts to the classic ambiguity 
  - Preempt nativist objections (e.g., "not real vision") 
  - End with a verdict line 

  The core tension: Nativism traditionally dismisses cross-modal transfer, but here the substitution device creates a movement-based "proto-visual" skill. The critical feature is *pre-op sensorimotor expertise via substitution*—it bridges the gap empiricism can't cross while demanding movement in a way nativism wouldn't. Without it, you're back to "maybe correlations, maybe innate reps." 

  Nativists might argue the device provides covert visual training, but the rebuttal is clear: no optics/luminance processing, just dynamic pattern navigation. The movement-contingency test then isolates the skill view. 

  User's hunch seems influenced by Noë/O'Regan's enactive perception—smart framing. Their frustration with seminar deadlock is palpable; this version weaponizes the ambiguity.
answer: |-
  Here's the scenario, built to your specifications (178 words):

  > Subject: Profoundly blind from birth (no light perception). For three years pre-op, used a head-mounted camera driving a 40x40 vibrotactile grid on his back (existing tech). Mastered navigating rooms, identifying objects by *how the tactile pattern transformed* as he moved his head/body relative to them (e.g., a cube's pattern shifts rigidly, a sphere's warps smoothly). Surgery successfully restores normal vision. Post-op, fully healed:  
  > **Test 1 (Static):** A cube and sphere are presented side-by-side on a table under uniform light, viewed from a single fixed position for 2 seconds. He's asked to name them by sight alone.  
  > **Test 2 (Active):** He's allowed to move freely around the same objects, viewing them for 30 seconds. Asked again to name them by sight.

  **Verdicts by Position:**
  *   **(a) Empiricism (e.g., Locke):** Fails both tests. Recognition requires learned correlations *between specific visual sensations* (color, luminance gradients, static form) and tactile sensations. The substitution device provided tactile/kinesthetic patterns, not true *visual* qualia or static form. No prior visual-visual or visual-tactile associations exist. *Verdict: Fail Static & Fail Active.*
  *   **(b) Nativism (e.g., core cognitivist view):** Succeeds both tests immediately. Innate spatial/geometric representations (shape primitives, 3D structure) are modality-independent. Restored vision provides access to these representations via the new visual input. The pre-op device is irrelevant; the innate machinery recognizes the shapes visually now that input is available. *Verdict: Pass Static & Pass Active.*
  *   **(c) Skill-Based (Sensorimotor Contingency - e.g., Noë/O'Regan):** Fails Static, Passes Active. "Seeing" isn't receiving static images but mastering the *laws* governing how sensory input changes with movement. The substitution device trained him *precisely* in the relevant sensorimotor contingencies for spatial layout and object shape (rigid transformations, smooth warping), just via a different input channel. Actively exploring visually allows him to apply this existing sensorimotor skill. A static flash provides insufficient information for the skill to engage. *Verdict: Fail Static, Pass Active.*

  **The Critical Feature:** **Pre-op mastery of object-contingent *sensorimotor laws* via substitution.** This provides a rich, structured, movement-contingent spatial understanding *without* visual qualia or static form.

  **Removing It (Collapse to Classic Case):** Without this pre-op sensorimotor expertise, the scenario reverts to the classic puzzle. Empiricism still predicts failure (no visual-tactile correlations). Nativism still predicts success (innate representations). Your skill view loses its specific prediction (no reason to predict failure in static *if* the skill is innate). The outcome becomes genuinely ambiguous.

  **Nativist Salvage Attempt:** A defender of (b) would argue: *"The substitution device didn't just teach sensorimotor laws; it covertly trained his *visual cortex* via cross-modal plasticity. The vibrotactile input was processed by visual areas (as seen in fMRI studies), building latent *visual* representations. Post-sight, he's not transferring 'skills' but accessing these now-visually-triggered representations. He *was* 'seeing' in a rudimentary way pre-op. Hence, he passes both tests."*

  **Verdict:** Skill-Based (Sensorimotor Contingency) - Pre-op mastery of object-contingent sensorimotor laws via substitution.
