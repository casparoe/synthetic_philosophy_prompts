prompt: |-
  I'm in a second-year seminar on epistemic rationality and we've spent the last three weeks on the accuracy-first program -- the move where you treat a credence as a thing that can be graded for how close it came to the truth, and then you try to get all your norms out of the demand that you not be accuracy-dominated. I find the machinery genuinely compelling and I'm not looking for a biblography or a reading list, I want the spec. Before I decide whether to stay inside this family or become a pluralist about epistemic value, write me the full list of what a theory in this family has to deliver: which cases it must get right, which distinctions it can't collapse, and which results or constraints it has to be consistent with -- each with the case or consideration behind it, plus your call on which requirements are non-negotiable and which are just house style of one camp.

  The cases I most want it to handle, because these are the ones that make me nervous: (1) a coin flipped in a sealed room and then destroyed, so nobody will ever learn the outcome and nothing hangs on it -- is a credence about that still subject to accuracy norms, and if so what is 'accuracy' even doing for us there; (2) two forecasters, one who says 30% every single day and is beautifully calibrated, one who is sharper but occasionally off -- if the theory has to prefer one, which and why; (3) a credence that is about your own credences, or about what your credence will be tomorrow after you've slept on it; (4) someone who reports an interval instead of a number ('somewhere between 0.4 and 0.6') and refuses to sharpen -- does the theory have to call them irrational, and is that a cost; and (5) a group, a comittee that has to hold one credence set rather than five. I also keep thinking the fix for the unverifiable cases is to grade the process rather than the credence, but then I can't say what the score of a process is, so tell me whether that's a dead end.

  And then the part I actually care about: flag any two desiderata on your list that you suspect can't be satisfied together, with the argument for why -- I half-expect there's a pair like that hiding in the regularity / finite-penalty area, or in whatever you're supposed to say about evidence you can never collect, and if the list itself contains an unsatisfiable pair then that's the result I want. Also tell me which single requirement does the most work in ruling out the alternatives, and go easy on scoring particular named views -- I'll do that part in class.
reasoning: |-
  Okay, the user is in a seminar on epistemic rationality, specifically the accuracy-first program. They've spent three weeks on it and find it compelling but want to know what a theory in this family must deliver before deciding whether to stay with it or become a pluralist. They have specific cases they're nervous about and want a list of desiderata, including any conflicting pairs and which requirement does the most work.

  First, I need to outline the core commitments of the accuracy-first program. The main idea is that credences are evaluated based on their accuracy, using scoring rules like the Brier score or log score. The key results are the accuracy-dominance arguments: if a credence is incoherent, it's dominated by a coherent one. Also, conditionalization minimizes expected inaccuracy. 

  Now, the user's cases: 
  1. The sealed coin flip. They're worried about unverifiable events. The theory must say that accuracy norms still apply, but what's the point if we never know? I should explain that verifiability isn't necessary; it's about the actual truth value. The non-negotiable here is that truth is binary and independent of verification.
    
  2. Calibration vs. sharpness. The calibrated forecaster at 30% vs. the sharper one. The theory should favor the sharper one when it's more accurate, but calibration matters too. The desideratum here is that the theory must reward both calibration and refinement without collapsing them.

  3. Higher-order credences. Credences about one's own credences or future credences. The theory must handle self-referential cases without inconsistency. This ties to the Reflection Principle and Dutch strategies.

  4. Imprecise credences (intervals). The user wonders if the theory forces precise credences. Imprecise probabilism is a thing, but accuracy arguments might push for precision. There's a tension here with representational optimality.

  5. Group credences. How to aggregate individual credences into a group. Must satisfy coherence and avoid dictatorship. The theory needs to extend to collective epistemology.

  The user also wants conflicting desiderata. One pair is Truth-Directedness vs. Continuity & Finite Penalties. Truth-Directedness requires that moving toward truth always improves accuracy, but Continuity and Finite Penalties might allow dominated imprecise credences in some cases. Also, Propriety requiring honest reporting might conflict with cases where intervals are more honest, but the scoring rule penalizes them.

  The single most important requirement is probably Coherence-As-Dominance-Avoidance. It's the foundation of the accuracy-first argument for probabilism.

  Another conflict might be between calibration and refinement in scoring rules. Strictly proper scores reward both, but in practice, a perfectly calibrated forecaster might be less accurate than a sharper one. The theory must account for this without favoring one over the other unduly.

  The user's worry about process vs. credence: Grading processes is hard because processes aren't directly scorable. The accuracy-first program focuses on credences, but processes matter for diachronic norms. The theory must justify norms like conditionalization through expected accuracy.

  I should also note that for the sealed coin, the argument is that accuracy is a theoretical virtue independent of practical benefits. But that might be a point where pluralists push back.

  Finally, highlighting the conflict between requiring precise credences (due to dominance arguments) and allowing representational benefits of imprecision. Imprecise credences avoid dominance but aren't themselves undominated, leading to a tension.
answer: |-
  Here's the specification you're requesting: the core commitments, test cases, and tensions within the accuracy-first program (AFP), structured around your concerns. This outlines what an AFP theory *must* deliver to stay true to its core, versus where flexibility exists.

  **Core Tenets (Non-Negotiable):**
  1.  **Accuracy as Fundamental Epistemic Good:** The primary (often sole) epistemic value of a credence is its *accuracy* – closeness to truth (1 for true propositions, 0 for false). Other putative epistemic goods (informativeness, explanatory power, coherence *itself*) must be justified in terms of accuracy or shown to be non-epistemic. *Rationale:* The entire program is built on this foundation. Abandoning it means leaving AFP.
  2.  **Truth-Directedness:** If Credence A is closer to the truth-value than Credence B for every possible world, then A is strictly more accurate than B. *Rationale:* Core intuition about accuracy. Without this, "accuracy" loses meaning.
  3.  **Coherence-as-Dominance-Avoidance:** Probabilistic coherence (satisfying Kolmogorov axioms) is a necessary condition for epistemic rationality because, and *only* because, incoherent credences are *strictly accuracy-dominated*: there exists an alternative coherent credence function that is more accurate in every possible world. *Rationale:* The central result (de Finetti, Rosenkrantz, Joyce) that launched AFP. If this fails, AFP loses its primary argument for probabilism.
  4.  **Propriety of Scoring Rules:** Rational agents should be motivated to *report their true credences* when epistemic utility is measured by a *strictly proper scoring rule* (e.g., Brier score, logarithmic score). Your expected accuracy is maximized precisely when you announce your actual credence. *Rationale:* Connects epistemic rationality to incentives for honesty and grounds the assessment of credences *ex ante*.

  **Essential Deliverables & Test Cases:**
  5.  **Handle Unverifiable Propositions (Your Case 1):**
      *   **Must Deliver:** Accuracy norms *absolutely apply*. A credence of 0.6 that the destroyed coin landed heads can be evaluated as accurate (if heads) or inaccurate (if tails). The *point* is theoretical: accuracy is the constitutive aim of belief/credence, independent of practical utility or verifiability. Irrationality consists in holding credences that *could* be strictly dominated *in principle*, regardless of whether the dominance is *detectable*.
      *   **Non-Negotiable?:** Yes. If AFP capitulates here and says accuracy doesn't matter for unverifiable propositions, it abandons its core commitment to accuracy as fundamental. The "doing for us" is fulfilling the constitutive aim of belief-like states. *Cost:* Requires accepting that epistemic value operates even without practical consequences or feedback.
  6.  **Distinguish & Justify Calibration vs. Refinement (Your Case 2):**
      *   **Must Deliver:** The theory must *reward both calibration and refinement* without collapsing them. It must explain why the consistently calibrated 30% forecaster is good (they are reliable) but also explain why a forecaster who is *also* sharp (e.g., assigns 10%, 90% appropriately) is *better*, *if their sharpness leads to greater accuracy*. A strictly proper scoring rule naturally does this: the sharp forecaster gets higher scores when they are correct in their extreme judgments, outweighing the occasional miss compared to the timid 30%.
      *   **Non-Negotiable?:** Distinction is non-negotiable (collapse undermines the value of learning). *Justifying the preference* for the sharper forecaster *when they are more accurate* is essential, grounded in Propriety (you *should* report your sharp credence if it's sincere) and Truth-Directedness (when they are right at 0.9, they are much closer to 1.0 than the 0.3 forecaster). AFP *can* accommodate the 30% forecaster being rational *if* that truly reflects their best evidence (they lack information enabling sharpness), but it *must* explain why sharper forecasts *based on better evidence* are rationally preferable.
  7.  **Accommodate Higher-Order Beliefs (Your Case 3):**
      *   **Must Deliver:** Consistent handling of credences about credences (e.g., "I'm 80% confident that my credence in P is 0.7") and future credences (e.g., "I'm 90% sure that after sleeping, my credence in P will be 0.6"). This requires extending accuracy measures to propositions about credences and ensuring coherence (e.g., avoiding Dutch books across time or levels). The Reflection Principle (credence now should align with expected credence later) should ideally be justified via accuracy arguments (e.g., violating it risks accuracy-domination diachronically).
      *   **Non-Negotiable?:** Consistency and avoidance of dominance in these scenarios is non-negotiable. The *specific justification* for Reflection might be "house style" (some argue it *is* required by accuracy, others argue it's more nuanced).
  8.  **Address Imprecise Credences (Intervals - Your Case 4):**
      *   **Must Deliver:** The theory must *explain* why precise credences are often rationally required (dominance avoidance arguments strongly suggest any *precise* credence within an interval is dominated by a coherent precise alternative). However, it must also *acknowledge and account for* the representational benefits of imprecision (modeling ambiguity, lack of evidence). AFP *does not necessarily have to* declare imprecision irrational *tout court*, but it *must* show how imprecise states relate to accuracy goals. Common moves: argue that imprecise *representations* are permissible if they correspond to sets of precise credences, none of which are dominated; argue that the *demand for precision* stems from decision contexts, not pure epistemology; or develop accuracy measures for imprecise credences (highly contested).
      *   **Non-Negotiable?:** Explaining the dominance pressure *towards* precision is non-negotiable. *Whether* this forces a verdict of irrationality for *all* imprecise reporting is debated ("house style"). *Cost:* If AFP *must* declare interval-reporters irrational, this clashes with intuitions about ambiguous evidence being a legitimate reason for indecision. If it *doesn't*, it needs a robust account of how imprecision serves accuracy.
  9.  **Ground Diachronic Norms (e.g., Conditionalization):**
      *   **Must Deliver:** A justification for updating via (Jeffrey) Conditionalization based on accuracy. The standard result: conditionalizing on your total evidence minimizes *expected inaccuracy* relative to your prior credences (under a strictly proper score). *Rationale:* Without this, AFP is incomplete; rationality isn't just static coherence.
      *   **Non-Negotiable?:** Providing an accuracy-based justification for a central diachronic norm is essential. The *specific form* (standard vs. Jeffrey) is "house style" depending on how evidence is modeled.
  10. **Extend to Group Epistemology (Your Case 5):**
      *   **Must Deliver:** A framework for evaluating the accuracy of *group credence functions* and principles for aggregating individual credences into group credences based on accuracy goals. Must satisfy coherence for the group and avoid obvious irrationality (e.g., "dictatorship" isn't the only option). Should ideally ground popular aggregation methods (e.g., linear averaging) in accuracy considerations (e.g., minimizing average inaccuracy) or explain their limitations.
      *   **Non-Negotiable?:** Providing *an* accuracy-based approach to group credences is necessary for completeness. The *specific aggregation method* justified is "house style" (e.g., linear pooling vs. geometric vs. other).

  **The Process Gambit:**
  You suggest grading the *process* rather than the *credence* for unverifiable cases. AFP generally views this as a **dead end** *for its core project*:
  *   **The Scoring Problem:** How do you *score* a process? Accuracy is defined for *states* (credences) relative to *truth values*. Processes aren't true/false. You'd need to define "accuracy" for a process, which likely collapses into the accuracy of the credences it *tends* to produce – bringing you back to scoring credences *ex post* (even if unverifiable in a specific instance) or expected accuracy *ex ante*.
  *   **AFP's Response:** AFP bites the bullet. The rationality of the credence *in the unverifiable case* is determined by whether it was produced by a process (like conditionalization) that is *justified* by its *expected* accuracy across many cases (including verifiable ones), and crucially, by whether that *specific* credence avoids accuracy-domination *in the actual world* (even if unknowably). The process matters *instrumentally* for producing credences that are likely non-dominated and accurate.

  **Conflicting Desiderata (The Tension You Suspect):**

  The most significant tension lies between **Requirement 3 (Coherence-as-Dominance-Avoidance)** and the desire for **Requirement 8 (Accommodating Imprecise Credences without declaring them irrational)**.

  1.  **The Argument:**
      *   **Dominance Pressure (Req 3):** The core AFP argument shows that any precise, *incoherent* credence function is strictly dominated by a coherent one. This argument *also* applies within an imprecise credence set (represented by a set of probability functions). For *any particular* precise credence function within the imprecise representor that is *incoherent*, there exists a coherent precise function dominating it. Therefore, AFP seems to demand that each permissible credence in the representor be *coherent*.
      *   **The Precision Pressure:** Crucially, the dominance argument *also* applies *across* the representor. Suppose your imprecise state permits credence function C1 (say, P(H)=0.4) and credence function C2 (say, P(H)=0.6). If the true P(H) is 0.5:
          *   C1 (P=0.4) is dominated by a credence of 0.5 (closer to 0.5 in all worlds where H is true/false? Wait, H is binary! Let's use a better example).
          *   *Better Example:* Consider proposition A and its negation ~A. Your imprecise state allows C1: P(A)=0.4, P(~A)=0.6 and C2: P(A)=0.6, P(~A)=0.4. Both are coherent. But now consider a precise credence C3: P(A)=0.5, P(~A)=0.5.
              *   If A is true: C1 scores worse than C3 (distance |1-0.4|=0.6 vs |1-0.5|=0.5); C2 also scores worse (|1-0.6|=0.4 vs 0.5? Wait! 0.4 is better than 0.5? **Mistake!**)
              *   **Corrected:** Use Brier Score for a binary event: Score = (Outcome - Credence)^2.
                  *   If A True: Score(C1) = (1-0.4)^2 = 0.36; Score(C2) = (1-0.6)^2 = 0.16; Score(C3)=(1-0.5)^2=0.25. C2 (0.16) is *better* than C3 (0.25).
                  *   If A False: Score(C1) = (0-0.4)^2=0.16; Score(C2)=(0-0.6)^2=0.36; Score(C3)=(0-0.5)^2=0.25. C1 (0.16) is better than C3 (0.25).
              *   **Conclusion for this example:** C3 (0.5) is *not* universally better than both C1 and C2. It's better than C1 if A is false, better than C2 if A is true, but worse than C1 if A is true and worse than C2 if A is false. C3 *does not* dominate the set {C1, C2}.
      *   **The Real Problem (Unverifiable & Complex Propositions):** The tension becomes acute with *unverifiable propositions* or propositions where the *relevant partition* is unclear. Suppose the proposition is inherently vague or the evidence is deeply ambiguous (e.g., "The beauty of this painting is profound"). AFP's dominance arguments rely on a well-defined set of possible worlds. If the set of worlds is ill-defined or the proposition's truth-value is indeterminate, applying dominance becomes problematic. An imprecise credence might seem like the *honest* representation, avoiding a false precision. However, AFP's Requirement 3, applied rigorously, demands that *any specific precise credence you might hold* must be coherent and non-dominated relative to the assumed space of worlds. If no single precise credence seems appropriate, but AFP's tools push towards precision to avoid dominance, there's a conflict with the desire to permit imprecision (Req 8) as rationally permissible in such cases.
      *   **The Formal Result:** While a *set* of precise credences (the imprecise representor) can avoid being *as a set* strictly dominated by a single alternative, *each individual member* of the set must be coherent to avoid being dominated *on its own* (by Requirement 3). More importantly, proponents of precision argue that for any *specific decision*, an imprecise representation forces you to adopt *some* precise credence within the set, and whichever one you pick for that decision *might* be accuracy-dominated. The imprecise state itself doesn't provide a single credence function that is guaranteed non-dominated. The tension is between the *representational value* of imprecision and the AFP's *normative pressure* towards adopting a specific, non-dominated, precise credence.

  2.  **Why it's Fundamental:** This tension strikes at the heart of whether AFP can fully capture the nuances of rational belief under severe uncertainty or with propositions resistant to precise world-partitioning. Resolving it requires either:
      *   *Rejecting* the rationality of imprecise credences in principle (cost: clashes with intuitions about ambiguity).
      *   *Developing a viable accuracy-based account* for scoring imprecise credences themselves (highly challenging, risks violating Truth-Directedness or Propriety).
      *   *Arguing* that the dominance pressure only applies when a precise commitment is made, and the imprecise state isn't itself a credence but a different doxastic attitude (potentially moving outside core AFP).

  **The Single Most Important Requirement:**

  **Requirement 3: Coherence-as-Dominance-Avoidance.** This is the engine of AFP. It provides the powerful, unified justification for probabilism that is the program's flagship result. It rules out all forms of probabilistically incoherent credence functions as irrational. Every alternative approach to justifying coherence (pragmatic Dutch books, logical consistency arguments) either lacks the unified force of the dominance argument or faces significant objections that the accuracy-dominance argument arguably avoids (or reframes successfully). Without this requirement, AFP loses its defining achievement and much of its motivation.

  **In Summary:** AFP demands a theory where accuracy is fundamental, dominance-avoidance mandates coherence, propriety ensures honesty, and these principles apply even to unverifiable propositions and higher-order beliefs. It must explain the value of both calibration and refinement, justify conditionalization, and grapple with group beliefs. The deepest tension arises between the dominance-based demand for coherence (pushing towards precision) and the intuitive legitimacy of imprecision under ambiguity. Navigating this tension is crucial for deciding whether AFP's compelling core machinery can fully capture epistemic rationality.
