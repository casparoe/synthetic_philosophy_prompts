  To distinguish between different possible rules, introducing a case where the speaker makes a truthful statement with intent to deceive but without relying on context like reputation. For example, using irony or sarcasm where the literal statement is true but meant to convey falsehood. If Augustine still doesn't consider it a lie, that reinforces the belief-utterance match as the sole criterion. 

  Alternatively, a case where the speaker withholds information or uses ambiguous language. Augustine's silence case already indicates that withholding isn't lying. Ambiguity might be trickier. If someone says something ambiguous that they believe is true in one sense but intend the false sense, does Augustine call that a lie? That could help clarify if only explicit statements matter or if intended meaning is considered. 

