prompt: |-
  I read the rationalist blogs, so I know the standard warnings about metrics — Goodhart's and Campbell's laws, the cobra effect, the whole gallery of agents who hit a target by cheating it. The pattern I keep running into isn't that, and I can't find a name for it.

  The shape: a statistic goes up. Nobody cheats, and the statistic is honest — audit every number and you'll find it correctly computed from real cases. But the rise comes from a change in which cases the statistic is computed over, not from any change in the performance it was meant to track. And the change in membership is produced by ordinary local decisions, made by people with no view of the aggregate and no stake in the number.

  Two instances. A hospital's reported mortality falls because the sickest patients are increasingly transferred out — every transfer defensible on clinical grounds, the rate a true rate over the patients actually treated, the improvement entirely a fact about a population that got easier. A support team's average first-response time falls because agents clear the easy tickets first and let the hard ones sit; the unanswered ones aren't in the average yet, the average is correct, and the growing backlog is precisely the thing the metric was a proxy for.

  The general form, as best I can state it: a true statistic over a drifting set, where the drift is uncoordinated rather than strategic, and the drift happens to flatter. Proxy and target come apart with no one doing anything they can be criticized for.

  What I want is the carving, not a label. Does this have a name? If it's case-mix drift, or a selection effect, or cream-skimming, say which and say what that name commits me to that my description doesn't — cream-skimming seems to require intent, and the hospital isn't the one doing the selecting. If nothing fits, coin a term and define it against Goodhart and against survivorship bias, with the boundary cases marked: does the phenomenon survive someone eventually noticing and steering the set deliberately, and does it require that the damage be invisible in the metric itself, or is that just an artifact of my two examples?
reasoning: |-
  Okay, the user is describing a specific statistical phenomenon they've observed, and they're frustrated that it doesn't fit existing named pitfalls like Goodhart's Law or the cobra effect. They provided two clear examples: hospital mortality rates dropping due to transferring out the sickest patients, and support teams improving response times by handling easy tickets first while hard ones linger. 

  The core issue is a drifting dataset where the measured improvement comes from changes in what's included, not actual performance gains. What's interesting is that this drift happens organically—no one's gaming the system, just making locally rational decisions that collectively distort the metric. 

  Hmm, they're clearly well-versed in rationalist concepts (mentions LessWrong, knows Goodhart/cobra effect) but want precision. Their examples show they've thought deeply about the boundary cases: they explicitly reject "cream-skimming" because no intent, and wonder whether this still counts if someone later notices and exploits it. 

  The challenge is finding terminology that captures: 
  (1) The metric is technically correct but misleading 
  (2) The selection effect is emergent, not deliberate 
  (3) The proxy/target divergence is invisible in the data itself 

  "Case mix drift" almost fits but is too narrow (hospital-specific). "Selection effect" is too broad—it includes survivorship bias where excluded data vanishes permanently. Here, backlogged tickets *will* eventually be counted, just late. 

  Aha! The key is the *temporary* exclusion. The support ticket example is perfect: by delaying hard tickets, agents create a lagging indicator where current metrics look artificially good because future pain isn't visible yet. It's like a statistical mirage. 

  "Metric myopia" feels right—it emphasizes the short-sightedness. And "emergent selection effect" covers the unintentional, systemic nature. Should explicitly distinguish this from survivorship bias (where excluded data never enters the system) and Goodhart (where people actively corrupt the measure). 

  User will appreciate the "boundary case" analysis: if someone later exploits this drift intentionally, it becomes cream-skimming, but the underlying structural flaw remains. Also worth noting that while the damage is invisible in the *current* metric, it might surface elsewhere (e.g., customer complaints)—but that's outside the scope of what they asked.
answer: |-
  You've articulated a profound and underappreciated statistical pitfall. This **isn't Goodhart's Law** (no one is gaming the metric), **isn't cream-skimming** (no strategic intent), **isn't survivorship bias** (excluded cases aren't permanently lost), and **isn't just selection bias** (which is too broad). It's a specific subspecies of selection effect where the *composition drift is emergent, unintentional, and temporarily flattering*.

  ### The Core Phenomenon: **Metric Myopia via Emergent Selection Drift**
  1.  **Accurate Micro, Misleading Macro:** The statistic is correctly calculated over its *current* defined set.
  2.  **Drifting Denominator/Numerator:** The set itself changes composition over time due to unrelated local decisions.
  3.  **Emergent Drift:** The change arises organically from decentralized actions, *not* from a strategy to influence the metric.
  4.  **Temporal Flattery:** The drift *coincidentally* improves the metric in the short-to-medium term by *temporarily excluding* cases that would lower it.
  5.  **Proxy-Target Decoupling:** The metric ceases to reflect the underlying system performance it was intended to measure.

  ### Why Existing Terms Fall Short
  *   **Case-Mix Drift:** Specific to healthcare outcomes adjusting for patient severity. Your hospital example *is* case-mix drift, but your support ticket example isn't. "Case-mix drift" implies a predefined risk adjustment, which isn't present here.
  *   **Selection Effect/Bias:** Too broad. Includes survivorship bias (permanent exclusion), deliberate sampling bias, and confounding. Lacks the *emergent, uncoordinated, temporally flattering* aspects.
  *   **Cream-Skimming:** Requires *intent* to select easier cases to improve metrics/outcomes. Your examples lack this intent.
  *   **Cobra Effect/Goodhart's Law:** Require agents to *actively* distort behavior to hit the target, often corrupting the measure itself. Here, the measure remains pure; the *universe* it's applied to shifts.

  ### Boundaries & Nuances (Addressing Your Questions)
  1.  **"Does it survive someone eventually noticing and steering deliberately?"**
      *   **Phase 1 (Pure Phenomenon):** The drift is entirely emergent and unintentional (your examples).
      *   **Phase 2 (Exploitation):** If someone *recognizes* the drift and *intentionally reinforces or accelerates it* to improve the metric, it **morphs into cream-skimming**. The underlying structural flaw enabling the drift remains, but the *driver* shifts from emergent to strategic.
  2.  **"Does it require the damage to be invisible in the metric itself?"**
      *   **Yes, fundamentally.** This is the core deception. The metric itself looks genuinely better *because* the difficult cases are temporarily absent from its calculation window. The "damage" (growing backlog, worsening eventual outcomes for hard cases) exists *outside* the metric's current reporting scope. If the damage were visible *within* the metric's own numbers, it would be a different problem (e.g., miscalculation, incomplete data).

  ### Proposed Terminology & Carving
  1.  **Emergent Selection Drift (ESD):** Emphasizes the *uncoordinated origin* and the *changing composition* of the measured set.
  2.  **Metric Myopia:** Highlights how the metric is "shortsighted," only seeing the *current* (and flattering) slice of the workflow, blind to the accumulating problems pushed into the future or elsewhere.
  3.  **Temporal Exclusion Bias:** Focuses on the mechanism: difficult cases are *temporarily excluded* from the calculation window due to processing delays or transfers, creating an illusion of improvement.

  **Definition:** **Metric Myopia via Emergent Selection Drift (MM-ESD)** occurs when a performance metric accurately calculated over its defined set shows artificial improvement due to uncoordinated local decisions that systematically (though unintentionally) shift the composition of that set over time. This shift temporarily excludes cases that would negatively impact the metric, decoupling it from the underlying system performance it purports to measure, while the negative consequences accumulate outside the metric's current view.

  ### Key Distinctions from Neighbors
  *   **vs. Goodhart's Law:** MM-ESD has no agent *trying* to hit the target; the drift is emergent. Goodhart corrupts the measure; MM-ESD corrupts the *scope*.
  *   **vs. Cream-Skimming:** MM-ESD lacks *intent* to select easier cases. Cream-skimming is strategic; MM-ESD is systemic.
  *   **vs. Survivorship Bias:** MM-ESD involves *temporary* exclusion where excluded cases *will eventually be processed* (or transferred, impacting someone else's metric). Survivorship bias involves *permanent* exclusion of failures.
  *   **vs. Simple Lag:** Lag delays *all* reporting. MM-ESD involves *differential* lag/transfer specifically impacting harder cases, distorting the *composition* of the reported set.

  This phenomenon thrives in complex systems with queues, transfers, or prioritization rules, where local optimization decisions (treat the patient now, answer the easy ticket) have unintended aggregate consequences on measurement. Recognizing MM-ESD requires looking *beyond* the metric's calculation to the *dynamics of how cases enter and exit its measurement window*.
