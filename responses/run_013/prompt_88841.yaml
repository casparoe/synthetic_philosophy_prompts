  2. In the actual sequence (where the agent decides to X without intervention), the FSC is designed to show that the agent is morally responsible for her decision and action.

  3. The FSC is intended to challenge the Principle of Alternative Possibilities (PAP), which states that an agent is morally responsible for what she has done only if she could have done otherwise.

  4. The counterfactual intervener in the FSC is set up so that it does not actually intervene in the actual sequence. Its role is to eliminate alternative possibilities without causing the agent's action in the actual sequence.

  5. The FSC leaves open whether the actual sequence is deterministic or indeterministic. The FSC does not rely on determinism to make its point. The dispute about FSCs is primarily conceptual, not empirical. It concerns what follows from the description of the case, not how the world actually is.

  6. The FSC does not depend on any particular view about the nature of free will or moral responsibility beyond what is stated in the case.

  7. Both sides agree that for the FSC to succeed in its aim, it must be the case that in the actual sequence:
     - The agent is morally responsible for her decision and action.
     - The agent could not have done otherwise (in the relevant sense).

  8. Both sides agree that a case fails to establish its conclusion if either:
     - It does not actually remove all relevant alternative possibilities (so that the agent could have done otherwise in a way that matters for PAP), or
