  ### Joint Statement of Adversarial Collaboration on Frankfurt-Style Cases

  **Agreed Claims**  
  Both parties affirm the following without reservation:  
  1. A Frankfurt-style case (FSC) stipulates an agent who decides and acts without intervention in the actual sequence, but for whom a counterfactual intervener would have caused the same outcome had she been about to decide or act otherwise.  
  2. The intervener does not operate in the actual sequence and plays no causal role in the agent’s decision or action. Its sole function is to eliminate alternative possibilities.  
  3. The case leaves open whether the actual sequence is deterministic or indeterministic; it is not designed to depend on determinism.  
  4. Questions about the case are conceptual (e.g., whether it coherently describes responsibility without alternatives) and not empirical (e.g., whether such interveners exist).  
  5. Accepting the FSC’s verdict (that the agent is responsible and lacks alternatives) commits the Frankfurt-defender to rejecting the Principle of Alternative Possibilities (PAP) as a necessary condition for responsibility. It commits the PAP-defender only to evaluating the case on its own terms, not to endorsing its conclusion.  
  6. A case fails to establish its conclusion if either: (i) it preserves a relevant alternative possibility, or (ii) it undermines responsibility in the actual sequence.  
  7. Both sides would count a case as unsuccessful if it relies on ambiguity in "could have done otherwise" or implicitly assumes responsibility without alternatives in the stipulation.

  **Disagreements Table**  
  Each position is stated as its proponents would affirm it. "What Would Move Each Side" indicates conditions under which they would revise their stance. "Genuine/Verbal" assesses whether the dispute concerns substantive commitments or conceptual interpretations.  

  | Sub-question in dispute                                                                 | Frankfurt-defender position                                                                                                                                                     | PAP-defender position                                                                                                                                                                 | What would move each side                                                                                                                               | Genuine/verbal |  
  |-----------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------|----------------|  
  | Does the FSC remove all alternative possibilities?                                      | Yes: The intervener ensures no alternative action or decision is possible. The agent cannot do otherwise because any divergence would be negated.                                | No: The agent retains the ability to begin to do otherwise (e.g., initiate a decision), triggering intervention. This ability is the relevant alternative possibility.               | F-defender: Proof that the agent could achieve a different outcome. PAP-defender: Proof that the agent cannot even try to do otherwise.                 | Genuine       |  
  | In the actual sequence, is the agent morally responsible?                               | Yes: Responsibility is grounded solely in the actual sequence—her reasons, deliberation, and control are uncompromised. The intervener’s presence is irrelevant to this.         | No: The intervener’s setup undermines responsibility by making the outcome inevitable and the agent’s control illusory. Responsibility requires being the ultimate source, which is absent. | F-defender: Evidence that the actual sequence is insufficient for responsibility. PAP-defender: Evidence that responsibility can exist without ultimate sourcehood. | Genuine       |  
  | Does the FSC refute the Principle of Alternative Possibilities (PAP)?                   | Yes: It proves responsibility without alternatives, falsifying PAP as a general requirement. PAP is false in its unqualified form.                                               | No: The case either preserves alternatives (via the ability to trigger intervention) or stipulates away sourcehood, which is integral to PAP. PAP remains intact.                    | F-defender: A case both sides agree has no alternatives but preserves responsibility. PAP-defender: A case without alternatives where responsibility is intuitively absent. | Genuine       |  
  | What does "ability to do otherwise" require for PAP?                                    | PAP requires the ability to bring about a different outcome. The FSC shows this is unnecessary.                                                                                  | PAP requires the ability to choose or try otherwise (even if thwarted). The FSC does not remove this.                                                                                | F-defender: Acceptance that PAP only requires trying. PAP-defender: Acceptance that PAP requires outcome-level ability.                                  | Verbal        |  

  **Cruxes**  
  Sub-questions that would resolve part of the dispute if settled, with agreed-upon tests and predictions.  

  1. **Does a successful FSC refute all forms of PAP or only a specific version?**  
     - *Argument*: Both sides agree this turns on whether PAP must require robust alternatives (bringing about a different outcome) or if non-robust alternatives (e.g., flickers of intention) suffice. The original FSC bears on this.  
     - *F-defender prediction*: The FSC refutes any PAP requiring robust alternatives, showing no alternatives are needed.  
     - *PAP-defender prediction*: The FSC at most refutes a robust-outcome PAP; it does not challenge a PAP requiring non-robust alternatives (e.g., choosing otherwise).  

  2. **Is the core dispute about the grounds of responsibility, not PAP itself?**  
     - *Argument*: Both sides agree that if responsibility hinges solely on actual-sequence features (e.g., reasons-responsive deliberation), the FSC’s success would not depend on alternatives. If responsibility requires being an ultimate source, alternatives are indispensable.  
     - *F-defender prediction*: Responsibility is grounded in actual-sequence mechanisms; PAP is a red herring.  
     - *PAP-defender prediction*: Ultimate sourcehood (which implies alternatives) grounds responsibility; the FSC ignores this.  

  3. **Would a scenario without an intervener but with identical actual-sequence responsibility undermine PAP?**  
     - *Argument*: Both sides agree this tests whether responsibility intrinsically requires alternatives. A deterministic case without interveners but with responsibility would bear on it.  
     - *F-defender prediction*: Responsibility without alternatives in such a case would confirm PAP is false.  
     - *PAP-defender prediction*: Determinism inherently removes alternatives and responsibility; such a case would prove PAP.  

  **Stipulated Variants**  
  *(Treated as new material, not from literature)*  

  **(a) Two Interveners**  
  - *Obstruction intervener*: Blocks actions/decisions. *Substitution intervener*: Causes alternative decisions via deliberation (e.g., inducing desires).  
  - *Agreement on original vs. substitution*: Both sides agree that if the original FSC fails, the substitution variant fails, and vice versa. The cases stand or fall together.  
  - *F-defender prediction for substitution*: The agent is responsible; no alternatives exist.  
  - *PAP-defender prediction for substitution*: Alternatives exist (agent could deliberate otherwise, triggering substitution), or responsibility is undermined.  
  - *What the difference reveals*: The obstruction intervener tests physical alternatives; substitution tests deliberative alternatives. Both test whether alternatives must be robust (outcome-changing).  

  **(b) Agent Knows the Device Is Attached (Inert)**  
  - *Same or different case?*: F-defender: Same; knowledge doesn’t alter actual-sequence responsibility. PAP-defender: Different; knowledge introduces coercion or fatalism, undermining responsibility.  
  - *What the difference shows*: If responsibility is compromised, it reveals that the FSC’s original setup implicitly depends on the agent’s ignorance to preserve sourcehood.  

  **(c) Indeterministic Deliberation with Device Standing Ready**  
  - *Does the case still work for F-defender?*: Yes; responsibility holds, and the device eliminates alternatives.  
  - *Does PAP-defender concede no alternatives?*: No; indeterminism ensures alternatives (e.g., a chance to decide otherwise), so the device only blocks outcomes, not possibilities.  
  - *Same question?*: No. F-defender asks if responsibility exists without alternatives; PAP-defender asks if indeterminism inherently provides alternatives.  

  **(d) Flicker of Freedom Variant**  
  - *Scenario*: Only alternative is a "flicker" (e.g., briefly intending otherwise before intervention).  
  - *Does PAP-defender need robust alternatives?*: Yes; PAP requires robust alternatives (able to be realized via reasoning), not flickers.  
  - *Does F-defender deny only robustness?*: Yes; the FSC targets robust alternatives, but allows that responsibility might require non-robust alternatives (which flickers provide).  

  **Note on Verbal Disagreements**  
  Disagreements marked "verbal" in the table arise from divergent interpretations of terms:  
  - The dispute over whether "ability to do otherwise" requires *bringing about outcomes* (F-defender) or *choosing/trying* (PAP-defender) is verbal. It stems from differing definitions of PAP’s scope, not substantive commitments about responsibility.  
  - Other disputes are genuine; e.g., whether the intervener’s presence affects responsibility involves incompatible views of sourcehood and control.  

  \answer{substantive | Grounds of Responsibility}
