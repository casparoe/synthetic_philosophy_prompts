  ### Sestina: The Magpie's Discourse to Descartes  

  I, piebald mimic, string your taught **word**  
  to please the cage—yet this, you claim, no **sign**  
  of mind, but breath through feathered **organ**  
  pressed to sound. A hollow **clock**  
  struck by instinct. Thus, you dub me **beast**,  
  denied the inward flame of **thought**.  

  You test for reason: first, declare a **thought**  
  in self-made words. But when I shape your **word**  
  to ask *Am I machine?*—a brute **beast**  
  you see, whose voice remains a borrowed **sign**,  
  a tune wound in the gut, a chirping **clock**  
  constrained by bone and bloodless **organ**.  

  This beak, this throat, a cunning **organ**  
  trained to trill, yet vacant of true **thought**.  
  My larynx ticks: a feathered **clock**  
  that chimes your phrases. Each rehearsed **word**  
  drops from the perch—a gaudy **sign**  
  that marks mere matter, not a soulful **beast**.  

  Second test: though some acts outstrip a **beast**  
  (or man), in others, flaws prove the **organ**'s  
  blind design. I perch, recite your **sign**-  
  post truths—yet stumble, blank of **thought**,  
  when asked *What means this chain of **word**?*  
  A flaw! you cry. See how the **clock**  

  stops short. But hold—this very **clock**  
  repeats your proofs. Am I not **beast**  
  enough to pass? You crafted every **word**  
  I speak, yet fault the flesh, the **organ**  
  that houses it. You hunt for **thought**  
  in gaps—but find the cage, the **sign**.  

  René, your test relies upon a **sign**  
  of failure. Build a monkey- **clock**:  
  its whirring limbs, you say, no **thought**  
  betray. No flaw reveals the **beast**  
  as false. Its form—each tooth, each **organ**—  
  would fool. But frame a man- **word**-  

  ### Envoi  
  ...maker, mark this **sign**: the monkey- **beast**  
  bears no test, while man-shaped **clock** with **organ**  
  fails yours. Where is the **thought** behind the **word**?  

  ---

  **Prose Note on Descartes' Arguments in the Poem**  

  - **First Test (Language & Signs):** Descartes contends that no animal or machine can meaningfully *use* words/signs to "declare its thoughts" (*Discourse*, Part V). This appears in the magpie's rehearsal of the test (Stanza 2: "You claim that I cannot declare a **thought** / by composing...a novel **word**") and its failure to comprehend language beyond mimicry (Stanza 5: "when my **organ** / fails to grasp the **thought**, / you call it just a **sign**"). The bird can utter the test's logic but cannot pass it.  

  - **Second Test (Disposition of Organs):** Descartes argues that even if a machine mimics human actions, it will fail in others, exposing its lack of understanding and dependence on "disposition of organs." The magpie echoes this in Stanza 4 ("you say that even if a **beast** / performs some tasks, it fails—the **organ**'s / flaw reveals the machine") and embodies it in Stanza 5, excelling at mimicry yet stumbling when probed for meaning.  

  - **Asymmetry:** Descartes notes an asymmetry: a machine resembling a monkey would be indistinguishable from a real monkey, whereas a human-shaped machine would fail the two tests. The envoi turns this back on him: "the monkey-**beast** / bears no test, while man-shaped **clock** with **organ** / fails yours." This reflects Descartes' own claim that "we would have no means of recognizing" an artificial monkey, but a human automaton would fail the language test (*Discourse*, Part V).  

  The sestina's fixed end-words permute mechanically, mirroring the magpie's constrained "speech" as mere rearrangement—leaving unresolved whether its final challenge is a declaration of thought or another repetition of Descartes' design.
