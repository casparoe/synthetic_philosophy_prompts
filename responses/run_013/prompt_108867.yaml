answer: |-
  This pattern is indeed pervasive but under-theorized as a unified concept. It represents a methodological tension at the heart of historical source criticism, particularly for traditions blending history and legend. Based on your description, I propose the following conceptualization:

  **Core Concept:** **Residual Minimalism** (The Methodology) vs. **The Residuum Fallacy** (The Problematic Application)

  1.  **Residual Minimalism (The Methodology):**
      *   **Definition:** A historiographical method attempting to isolate a historical core within a legendary or tendentious narrative by systematically subtracting elements deemed functional to the narrative's literary, ideological, or cultural purposes (e.g., marvels, moralizing, symbolic numbers, etiological motifs, blatant anachronisms, flattering embellishments). The remaining "residue" is presumed historical on the grounds that it lacks an obvious inventive motive ("criterion of implausible invention" or "criterion of inexplicable persistence").
      *   **Goal:** To move from an obviously embellished *story* towards a plausible historical *event* by filtering out noise.

  2.  **The Residuum Fallacy (The Problematic Application):**
      *   **Definition:** The flawed application of Residual Minimalism characterized by:
          *   **Indeterminate Reduction:** The absence of a principled stopping rule for subtraction, leading to a residue so minimal ("a battle-leader named Arthur," "some disturbance involving western Anatolians," "a tradition of servitude/escape") that it becomes effectively unfalsifiable and historically insignificant.
          *   **Motivational Conflation:** The bidirectional conflation of *narrator motive* with *historical probability*: Flattering/functional detail (X) = likely invented; Unflattering/odd/functionally inexplicable detail (Y) = likely historical. This converts assumptions about the storyteller's psychology into claims about past reality without sufficient independent validation.
          *   **Neglect of Transmission Mechanics:** Underestimating how functional elements (even "unflattering" ones used ironically, pedagogically, or to enhance verisimilitude) and minimal residues can be generated, preserved, or modified *during transmission* for reasons unrelated to their historicity.
          *   **The Thinness Trap:** Producing a residue too thin to connect meaningfully back to the rich narrative it supposedly underlies, failing to explain *how* such a minimal event generated the elaborate story.

  **Carving the Boundaries: How it Differs from Neighbors**

  1.  **Vs. Criterion of Embarrassment (CoE):**
      *   **CoE is a specific *subtype* or *tool within* Residual Minimalism.** It focuses *exclusively* on "unflattering" details as the residue.
      *   **Residual Minimalism is broader:** It seeks *any* residue lacking an obvious inventive motive, which *can* include embarrassing details but also includes: mundane details, inconvenient facts (for the *narrative* goal, not necessarily the narrator), geographically plausible but unremarkable locations, names that don't obviously serve a symbolic purpose, or events that don't fit the narrative's clear moral or ideological arc. Your Troy example (retaining the *existence* of a conflict at a specific site, stripped of divine intervention and heroic motives) illustrates this well – it's not primarily about embarrassment.
      *   **The Residuum Fallacy highlights problems *inherent* to CoE:** The motivational conflation is starkest here (embarrassing = historical), and the stopping rule problem applies (how embarrassing *is* embarrassing enough?).

  2.  **Vs. Argument from Silence (AfS):**
      *   **AfS is fundamentally different:** It argues *from the absence of expected evidence* (e.g., no Egyptian record of Exodus). It's about missing external corroboration.
      *   **Residual Minimalism/Residuum Fallacy operates *within* the source:** It's a strategy for *interpreting the internal content of the testimony itself*, regardless of external silence or presence. The Exodus debate *uses* AfS externally, but internally, minimalists argue for a residue (e.g., a small-group escape tradition) *within* the Hebrew narrative precisely because they think the full story is unsupported externally (AfS) and internally embellished.
      *   **Interaction:** AfS can *motivate* applying Residual Minimalism (if external evidence is lacking or contradictory, strip the story down further). Conversely, a residue derived via Residual Minimalism might be deemed plausible *despite* AfS.

  **When is the Inference Legitimate? Avoiding the Fallacy**

  Residual Minimalism *can* be a useful starting heuristic if applied cautiously and avoids collapsing into the Residuum Fallacy. Legitimacy requires:

  1.  **Falsifiable Residue:** The proposed residue must be specific and testable *in principle* against independent evidence (archaeology, independent texts, linguistics, climatology). "A battle-leader named Arthur" is untestable; "A late 5th/early 6th century military leader winning a significant battle near a place linguistically ancestral to 'Badon' against Saxon adversaries in a context of documented migration/conflict" is potentially falsifiable (though difficult).
  2.  **Beyond Motive-Guessing:** The judgment that a detail "lacks inventive motive" must be robust. This requires:
      *   Deep understanding of the narrative's genre, conventions, and cultural context (what *was* plausible invention?).
      *   Acknowledging that motives are complex and diverse. An "unflattering" detail might serve a theological point (e.g., disciples' failures in Gospels) or enhance verisimilitude. A "mundane" detail might be invented for realism.
      *   Avoiding the simple bidirectional trap. Motive is a clue, not proof.
  3.  **Positive Evidence for Transmission:** Ideally, independent evidence should support the *plausibility of transmission* of the specific residue. Does the archaeology support conflict at Troy VIIa? Does post-Roman British archaeology support localized military resistance? Does Levantine archaeology/culture show Egyptian influence or traditions distinct from Canaanites?
  4.  **Explanatory Power:** The residue should offer a plausible kernel that helps explain *why this particular story emerged and persisted* in its specific form, not just a generic "something happened." How does "a small group escaping servitude" generate the Exodus narrative's central role in Israelite identity? The residue needs traction.
  5.  **Acknowledging Uncertainty:** Recognizing that the residue is a *hypothesis*, often inherently uncertain, not a proven fact. The procedure suggests possibilities, not certainties.

  **Literature & Established Concepts**

  While "Residual Minimalism" and "Residuum Fallacy" are my proposed terms capturing the *specific pattern you identify*, the core issues are deeply embedded in:
  *   **Historiography & Source Criticism:** Discussions of hypercriticism vs. naive acceptance. Marc Bloch's *The Historian's Craft* touches on stripping away legend. Debates around the "historical-critical method" in biblical studies and classics grapple with these layers.
  *   **Oral Tradition Studies:** Work by Jan Vansina (*Oral Tradition as History*) and others on processes of simplification, leveling, sharpening, and functional adaptation during transmission directly relates to the "transmission" side of your conflation. What persists and why?
  *   **Philosophy of History/Historiography:** Hayden White's *Metahistory* (on narrative emplotment) and Paul Ricoeur's *Memory, History, Forgetting* (on the interplay of memory and narrative) provide frameworks for understanding how stories are shaped, making pure "residue extraction" problematic. Epistemologists like C. Behan McCullagh (*Justifying Historical Descriptions*) address inference from evidence, including testimony.
  *   **Biblical Scholarship:** Beyond the CoE, debates about the "historical Jesus" and the "historical Exodus" (e.g., William Dever's *What Did the Biblical Writers Know and When Did They Know It?*, Israel Finkelstein & Neil Silberman's *The Bible Unearthed*) are prime examples of the method and its pitfalls in action. The "Minimalist" vs. "Maximalist" debates in Hebrew Bible scholarship are directly relevant.
  *   **Classics & Archaeology:** The Troy debates (Latacz, *Troy and Homer*; Easton, Schliemann's excavations reassessed) and Arthurian research (Higham, *King Arthur: Myth-Making and History*; Dumville, 'Sub-Roman Britain: History and Legend') exemplify the application and its controversies.

  **In Summary:**

  You've identified a fundamental methodological tension: **Residual Minimalism** – stripping narratives to find a historical core based on assumptions about motive and transmission. Its uncritical application leads to **The Residuum Fallacy**: producing an unfalsifiable, insignificant residue through indeterminate reduction and conflation of narrator motive with historical fact. This differs from the **Criterion of Embarrassment** (a specific motive-based subtype) and **Arguments from Silence** (which concern external evidence). Legitimacy requires a **falsifiable residue**, moving **beyond simplistic motive-guessing**, seeking **positive evidence for transmission**, demanding **explanatory power**, and **acknowledging inherent uncertainty**. The literature spans historiography, oral tradition studies, philosophy of history, and specific historical debates (Biblical, Classical, Arthurian). This framework provides the "carving" you need to analyze this pervasive pattern critically.
