prompt: |-
  I'm a third-year philosophy student taking a metaphysics module on causation, and I'm trying to get clear on the debate over causation by omission. I'd like you to act as an expert in the metaphysics of causation and, before answering, do a short brainstorming pass in which you lay out the candidate analyses you might appeal to. Here is the issue I want explained. Set aside the familiar move of saying that an omission "causes" something only in a loose or derivative sense, and consider instead two ways a failure to act can enter a causal story: (a) an agent's inaction leaves an ongoing harmful process running — nobody switches off the machine that is already injuring the patient; and (b) an agent's inaction means that a process which would have started, or would have been stopped, simply never gets going — nobody throws the rope. I've been calling these "sustaining omissions" and "blocking omissions", though I have no idea whether those labels match anything in the literature; I'm using them only to fix the two cases. Please explain whether these cases genuinely come apart conceptually or whether the difference is merely pragmatic. Specifically: does a counterfactual-dependence account of causation treat them identically, and if so, is that a defect? Does the distinction simply collapse into the familiar doing/allowing distinction, or is it orthogonal to it? And what would have to be true of the causal relation itself for these to be two different kinds of causal connection rather than one relation described twice? Be precise about which of your claims concern causation as such and which concern our practices of blaming and of selecting a cause to talk about.
reasoning: |-
  Okay, the user is a third-year philosophy student focusing on metaphysics, specifically causation by omission. They've introduced two types of omissions: sustaining and blocking. They want to know if these are conceptually distinct or just pragmatically different. Let me start by recalling the main theories of causation. Counterfactual approaches, process theories, difference-making, etc.

  First, I need to break down their examples. Sustaining omission: not turning off a machine that's already harming someone. Blocking omission: not throwing a rope to save someone. The user suspects these might be different, but how do various theories handle them?

  Counterfactual dependence is the first thing that comes to mind. Both cases involve counterfactuals. For sustaining, if the agent acted, the harm would stop. For blocking, if they acted, the harm would be prevented. So counterfactually similar. But maybe the timing of dependency differs? Sustaining might depend on continuous inaction, while blocking is a one-time thing. But does that make a conceptual difference? Probably not for counterfactual theories; both show dependency.

  Now, process theories. Sustaining omission might involve an active process (the machine running) that the agent doesn't interrupt. Blocking lacks any such process; there's no rope-throwing event. So process theories might see sustaining as a real cause because there's a process, whereas blocking might not count. That's a potential difference.

  Difference-making: both omissions make a difference, but the structural context varies. Sustaining occurs within an ongoing harmful system, blocking is about preventing a new process. This could relate to the doing/allowing distinction, but the user asks if it's orthogonal. Allowing harm (sustaining) vs. not preventing (blocking) might map to doing/allowing, but I need to check if that's accurate.

  The user also asks if collapsing these into one is a defect in counterfactual accounts. If both are treated the same but intuitively different, that might be a problem. Counterfactual theories might miss the structural asymmetry. Also, moral implications: sustaining omissions might be more blameworthy, but the user wants to separate causation from blame.

  Then, what would make these two distinct causal relations? If causation involves processes, sustaining might be a type of causation, blocking not. Or if causation requires connection, sustaining has it via the ongoing process. Blocking lacks that connection. So ontology matters: are there negative events? Are absences causes? Some theories reject omissions as causes altogether, which might resolve the distinction but conflict with intuition.

  The user mentioned precise claims about causation vs. blame. Need to clarify that counterfactual accounts treat both similarly causally, but practices might differentiate based on responsibility. The structural context (ongoing harm vs. new intervention) affects blame, but not necessarily the causal relation itself.
answer: |-
  As an expert in the metaphysics of causation, I'll address your query methodically. Below is my brainstorming pass outlining key candidate analyses, followed by a precise response to your questions. I'll use your labels (*sustaining omission* for ongoing process cases, *blocking omission* for absent-prevention cases) while noting they aren't standard (literature typically uses "preventions" or "double-preventions" for blocking cases).

  ---

  ### **Brainstorming Pass: Candidate Causal Analyses**
  1. **Counterfactual Dependence (e.g., Lewis)**:  
     - Causation as counterfactual dependence: *c* causes *e* iff, had *c* not occurred, *e* would not have occurred.  
     - Omissions: Treats absences as "quasi-events" (Lewis's controversial move).  

  2. **Process/Mechanism Theories (e.g., Salmon, Dowe)**:  
     - Causation as transfer or persistence of conserved quantities (e.g., energy/momentum) via spatiotemporally continuous processes.  
     - Omissions: Typically excluded (no physical process/transfer).  

  3. **Difference-Making (e.g., Woodward)**:  
     - Causation as invariant interventionist dependence.  
     - Omissions: Can be causes if interventions on the omission change the outcome.  

  4. **Primitivism (e.g., Anscombe)**:  
     - Causation as irreducible, known via intuition/practice.  
     - Omissions: Contextually valid causes if they "make a difference."  

  5. **Dispositional/Oomph Theories (e.g., Armstrong)**:  
     - Causation as production (e.g., "bringing about").  
     - Omissions: Generally excluded (no "oomph").  

  ---

  ### **Analysis of Your Cases**
  **Case 1: Sustaining Omission**  
  *(Not switching off an injuring machine)*  
  - **Counterfactual**: If the agent had acted, the harm *would have ceased*. Dependence is on *terminating an existing process*.  

  **Case 2: Blocking Omission**  
  *(Not throwing a rope to a drowning person)*  
  - **Counterfactual**: If the agent had acted, the harm *would not have occurred*. Dependence is on *initiating a preventive process*.  

  ---

  ### **Responses to Your Questions**
  #### **1. Conceptual vs. Pragmatic Distinction**  
  - **Conceptual Distinction**: The cases *do* come apart structurally:  
    - *Sustaining*: Involves an **ongoing actual process** (machine injuring) that the omission allows to persist.  
    - *Blocking*: Involves a **merely possible process** (rope-throwing) that never actualizes.  
    Counterfactual accounts treat both as dependence relations, but process theories (e.g., Dowe) *only* recognize sustaining omissions as causal (due to the pre-existing process). For blocking omissions, there is no physical connection to the outcome—only counterfactual fragility.  

  - **Pragmatic Overlap**: In practice, both are cited as "causes" due to **normative salience** (e.g., we blame agents for both). But metaphysically, the distinction holds.  

  #### **2. Counterfactual Treatment & Defects**  
  - **Identical Treatment**: Counterfactual theories (e.g., Lewis) analyze both as:  
    > "If the agent had acted, the outcome would have been different."  
    This collapses the distinction, treating both as symmetric dependence relations.  
  - **Defect?** Yes, for two reasons:  
    (a) **Intuition of Asymmetry**: Allowing harm (sustaining) feels more directly tied to the outcome than failing to prevent it (blocking), as sustaining involves an *actual process*.  
    (b) **Preemption Problems**: Blocking omissions invite "trivial dependence" (e.g., *not* teleporting to save the drowning person counterfactually "causes" death). Sustaining omissions avoid this by anchoring to actual processes.  

  #### **3. Relation to Doing/Allowing Distinction**  
  - **Orthogonal**: The doing/allowing distinction concerns **agency** (actively causing harm vs. passively permitting it). Your distinction concerns **causal structure**:  
    - *Sustaining* aligns with *allowing harm* (e.g., "letting the machine injure").  
    - *Blocking* aligns with *not aiding* (e.g., "failing to intervene").  
    However, the causal structure (ongoing vs. absent process) applies even in non-agential cases (e.g., a rock *sustaining* a landslide vs. a missing barrier *blocking* containment). Thus, it’s broader than doing/allowing.  

  #### **4. Two Distinct Causal Relations?**  
  For these to be metaphysically distinct *kinds* of causation:  
  - **Causal Relation Must Be Process-Dependent**: If causation requires spatiotemporal continuity (e.g., Salmon), only sustaining omissions qualify as causal (they exploit an existing process). Blocking omissions become mere counterfactual dependence.  
  - **Absences as Genuine Causes**: If absences can be causes (e.g., via "quasi-events" or difference-making), the distinction collapses. To separate them, causation must require **positive contributors** (e.g., dispositions activating processes). Sustaining omissions then become "causal enablement," while blocking omissions are "non-causal preventions."  

  ---

  ### **Precision on Causation vs. Practice**  
  | **Claim Type**               | **Sustaining Omission**                          | **Blocking Omission**                          |  
  |------------------------------|--------------------------------------------------|------------------------------------------------|  
  | **Causation (Metaphysical)** | *May* qualify under process theories; involves actual energy transfer. | Typically non-causal; no process connects omission to outcome. |  
  | **Blame/Practice**           | High blame (directly "enabling" harm).          | Contextual blame (dependent on duty to act).   |  
  | **Causal Selection**         | Often selected as "the cause" due to salience of ongoing harm. | Less salient unless normatively highlighted (e.g., lifeguard cases). |  

  ---

  ### **Conclusion**  
  The distinction between sustaining and blocking omissions is **conceptual**, rooted in the presence (or absence) of an *ongoing actual process*. Counterfactual accounts treat them identically, which is a defect because it ignores structural asymmetry. The distinction partially overlaps with doing/allowing but extends to non-agential causation. For them to be two kinds of causation, the causal relation must incorporate process ontology—otherwise, blocking omissions reduce to non-causal counterfactual dependence. Moral practices leverage this asymmetry (e.g., legal liability for sustaining omissions), but metaphysically, only sustaining omissions align with robust process-based causation.  

  **Recommended Reading**:  
  - Lewis (1973) *Counterfactuals* (for dependence view).  
  - Dowe (2000) *Physical Causation* (for process critique of omissions).  
  - McGrath (2005) "Causation by Omission" (for normative implications).  
  - Schaffer (2004) "Causes Need Not Be Physically Connected" (for absence-friendly view).
