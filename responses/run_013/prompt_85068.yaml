answer: |-
  ## Sestina for Middle Knowledge

  Before the world was water, earth, or light,
  Before the first command to *Be* was said,
  God saw the paths that *might* be, clear and stark:
  A future man, in study, hunched and pale,
  Beside a fragile, priceless, ancient tome
  That held the wisdom fragile minds might burn.

  He saw the scholar, tempted, choose *not* burn
  The fragile script. No flickering torch's light
  Would touch its vellum. Safe would lie the tome
  From anger, fear, or pride. This simply *said*
  Himself: a truth about this future pale
  Soul's choice, a fixed point shining in the dark.

  For God beheld this truth within the dark
  Of pure potential. What *would* happen? Burn?
  No. Not this scholar, earnest, slightly pale.
  It wasn't forced by circumstance or light
  Or threat. The man, uncoerced, simply said,
  Within his heart, "I will preserve this tome."

  God saw this moment, held it like a tome
  Unopened yet. The scholar in the dark
  Of non-existence, waiting to be said
  Into the world. The choice: preserve, not burn,
  Was clear as fact beneath God's knowing light,
  A truth about the man who'd one day pale.

  It wasn't *made* by God. The scholar, pale
  Or flushed, would freely guard the sacred tome.
  No divine push, no overwhelming light
  Compelled the act. Within creation's dark
  Foundation, this: he *wouldn't* let it burn,
  Stood settled, known, before a word was said.

  The "why?" hangs heavy. *Why* this truth is said,
  Beyond the scholar's nature? What made pale
  Potential bind so tight? What stops the burn?
  No cause resides within the waiting tome,
  Nor in the void, that deep, pre-creative dark.
  This knowing stands alone, a sovereign light.

  **Envoi**
  This light knew all: the tome, the dark, the pale
  Decision said *before* decree: "Not burn."

  ---

  ### Notes on the Choices

  *   **Form as Doctrine:** The fixed end-words (`light`, `said`, `dark`, `pale`, `tome`, `burn`) represent God's pre-volitional knowledge of counterfactuals: settled truths about what *would* freely happen in any given circumstance (each stanza). Their unchanging nature, regardless of the stanza's evolving narrative, mirrors the fixed, non-causal nature of these truths. The poet's freedom to *order* them represents God's sovereign decree arranging which circumstances (which sequence of potentialities) become actual, without altering the counterfactual truths themselves.
  *   **Concrete Focus:** The invented scholar and his specific, free choice (`burn`/not `burn` the `tome`) embody the doctrine concretely. His `pale` earnestness and the `dark` study are the circumstances, the `tome` the object of choice. God knows the outcome (`said`) beforehand without causing it.
  *   **Disanalogy & Awkwardness:** The poet *chooses* the end-words, mirroring God's decree, not His *knowledge*. This highlights the core disanalogy: God doesn't *choose* the counterfactual truths (`light`, `dark`, `pale`, `tome`, `burn`, `said`), He simply *knows* them. The poem makes this visible: the poet's selection stands in for decree, while the *fixed return* of the words, regardless of context, represents the known truths. The philosophical "why?" (`light` knowing the `burn`/not `burn` truth) remains unresolved, echoing the doctrine's inherent tension. The envoi's compression embodies the single, simultaneous act of pre-creative knowledge.
