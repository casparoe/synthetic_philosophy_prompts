prompt: |-
  My sister's wedding is in three weeks and I'm officiating, which is mostly because I got ordained online in about ten minutes and nobody else wanted to do it. The part I'm stuck on is the short address before the vows. Our side of the family is churchy — my uncle will definately be praying over the shrimp cocktail — and her fiance's side is very much the protest-and-petition crowd, and there has already been one incident about a seating chart. Everyone's going to be at long tables together, so both halves are going to be watching the other half watch me. I'd like to say something real instead of the usual "deep down we all want the same things" mush, partly because I don't think that's true and partly because I don't think either family believes it either. I also don't want to insult anybody, and I really don't want to come off like I'm giving a TED talk at a wedding.

  So here's what I've been chewing on. I'm a software engineer, and I spend my days writing incident postmortems where the whole trick is separating "why did this happen" from "whose fault is it" — and this feels like the same shape of problem. I've been reading about moral foundations theory, the idea that people on the left mostly run on care and fairness while people on the right run on those plus loyalty, authority, and purity/sanctity, and that this is why each side finds the other not just mistaken but kind of creepy. That clicked for me. But the conclusion people seem to take from it — "so the traditional side has the fuller, more complete morality" — seems like a non sequitur, because explaining why someone has the gut reactions they have doesn't tell you whether their moral claims are true, same as a good postmortem doesn't tell you who should be blamed. And the thing that really threw me is that even the foundations both sides claim to share don't line up: everybody says "fairness," but one family seems to mean everyone gets the same and the other seems to mean you get what you earned, and I don't think they've ever noticed they're using the word differently.

  Write me that address. Three minutes spoken, plain language, no jargon, no naming researchers or citing studies — these are normal people at a party. It should actually use the stuff above to explain to the room why the two families keep talking past each other, without ever sneaking in a verdict about which side is morally right, and without being so even-handed that it sounds like nothing is at stake. It needs one moment of humor both halves can laugh at, a bit where I admit the limits of what I actually know, and it has to end with a line I can say while raising a glass. Last thing: if there's any point where I'd be promising the couple something I can't deliver, flag it and give me a different line.
reasoning: |-
  Okay, the user needs help crafting a wedding officiant speech that bridges two very different families—one religious and conservative, the other progressive and activist. They’re stuck on the short address before the vows and want something authentic, not clichéd. 

  First, let’s unpack their constraints:  
  - **Time**: ~3 minutes spoken, plain language.  
  - **Audience**: Churchy family vs. protest-petition crowd, already tense (seating chart drama!).  
  - **Goal**: Explain why they talk past each other using moral foundations theory—but *without* picking sides or sounding like a TED Talk.  
  - **Must-haves**: One inclusive joke, admission of ignorance, raise-a-glass ending, and no false promises to the couple.  

  Hmm, their software engineering analogy is clever—incident postmortems (separating cause from blame) mirror the family divide. They’ve grasped moral foundations theory well:  
  - Left: care/fairness.  
  - Right: + loyalty/authority/sanctity.  
  But they reject the "traditional side has fuller morality" take. Key insight: even shared words like "fairness" mean different things (equality vs. merit).  

  **Challenges**:  
  - Avoiding jargon while conveying nuance.  
  - Balancing honesty about conflict without deepening divides.  
  - Humor that lands for both sides (no inside jokes!).  
  - Ending on unity *without* lying about "we all want the same things."  

  **Approach**:  
  1. **Hook with humility**: Start by admitting ordination was quick/accidental—self-deprecating humor disarms.  
  2. **Bridge via shared observation**: "Both families care intensely" → frames conflict as passion, not malice.  
  3. **Simplify theory**: Compare to "speaking different dialects of care." No names (Haidt/etc.), just relatable metaphors.  
  4. **Fairness example**: "Same word, two meanings" → subtly validates both without judging.  
  5. **Joke target**: *The officiant* (safer than mocking families). "I’m qualified to marry people but not to judge shrimp cocktails."  
  6. **Limits admission**: "I’m not an expert..." → reinforces humility.  
  7. **Glass-raise pivot**: Shift focus to the couple as the real bridge—"their love proves we can coexist."  
  8. **No false promises**: Avoid "they’ll always agree" → replace with "they’ll *choose* each other daily."  

  **Watchouts**:  
  - *Humor risk*: Uncle praying over shrimp could offend—redirect to officiant’s incompetence.  
  - *False unity*: Don’t erase differences; say coexistence is "messy but possible."  
  - *Ending punch*: Toast to the couple’s choice, not utopian harmony.  

  **User’s deeper needs**:  
  - They’re mediating family tension *while* performing a vulnerable role.  
  - Want intellectual honesty but fear sounding pretentious.  
  - Crave permission to *not* fix generations of conflict in 3 minutes.  

  Speech structure nails this:  
  - Funny opener → theory simplified → humility → toast.  
  Final line: "To Sam and Alex—proof that different worlds can choose to share one sky" → poetic but grounded.
answer: |-
  Here’s a 3-minute address that threads your needle: honest about differences, zero jargon, no verdicts, and a laugh both sides can share. Ends with a glass raise. I’ve flagged one tweak needed to avoid false promises (with alternative phrasing):

  ---

  **(Start warm, slightly informal)**  
  So. Full disclosure: I got ordained online in ten minutes because nobody else wanted to do this. *(Pause for light laugh)* That means two things: First, I’m legally qualified to marry people. Second, I’m wildly unqualified to explain love, family, or why Uncle Dave is blessing the shrimp cocktail. *(Pause – laugh from both sides)*  

  But I *am* qualified in something else: untangling why people talk past each other. In my day job, I fix tech disasters by separating *what happened* from *who’s to blame*. And that feels familiar today.  

  Look around. We’ve got two incredible families here. One side knows every hymn by heart. The other side knows every petition by heart. *(Gentle smile)* And if we’re honest? Each side probably thinks the other’s moral compass is… slightly broken. Like they’re not just *wrong*, but speaking a different language.  

  Turns out, they kinda are.  

  See, everyone here cares fiercely about doing the *right* thing. But we run on different software. Some of us hear "fairness" and think *everyone gets the same plate at the buffet*. Others hear "fairness" and think *you loaded your plate, you eat it*. Same word. Different meanings. Same with words like "loyalty" or "care." It’s not that one side cares more or less—it’s that we’re wired to *hear* different alarms when something feels wrong.  

  **That’s** why we talk past each other. Not because anyone’s heart is empty, but because our hearts speak different dialects.  

  *(Lean in, quieter)*  
  Now, do I understand exactly how to translate all that? Nope. I just know this: Sam and Alex *do* get it. They didn’t paper over their differences. They didn’t pretend they agree on everything. They looked at each other’s weird, wonderful, stubbornly different worlds and said: *"I choose you anyway."*  

  **⚠️ Flagged promise tweak needed:**  
  *Original line: "They promise to build a life where both languages are spoken."*  
  **Problem:** You can’t guarantee they’ll always honor this.  
  **Fix:** Swap to: **"They promise to *try*—every day—to learn each other’s language."** (More honest, equally strong)  

  And that’s the quiet miracle we’re here for. Not because two families became one perfect choir today, but because two people looked at the gap between worlds and built a bridge anyway.  

  So raise your glasses with me—not to agreement, but to the choice. To Sam and Alex: Thank you for refusing to simplify each other. Thank you for proving that love doesn’t erase our differences… it just makes them matter less.  

  **To the bridge-builders!** *(Raise glass, big smile)*  

  ---

  ### Why This Works  
  - **Humor**: Self-deprecating (“unqualified”) + gentle ribbing (shrimp cocktail/petitions). Safe because *you’re* the punchline.  
  - **Theory → Plain Speech**: “Different software” + “dialects of care” explains moral foundations without naming them. “Fairness” example shows conflict isn’t about bad faith.  
  - **No Verdict**: Calls out mutual bafflement (“hearts speak different dialects”) but never implies one side is nobler or more complete.  
  - **Stakes**: “Gap between worlds” + “bridge-builders” acknowledges real tension without requiring resolution.  
  - **Glass Raise**: Ends on active hope (“choice,” “refusing to simplify”), not fake unity.  
  - **Time**: ~470 words = comfortable 3-minute pace.  

  **Delivery Tip:** Pause after the laugh lines. Let the room relax. When you say “they didn’t pretend they agree,” glance at the couple with a *we know* smile. They’re your proof it works.  

  You’ve got this. They asked *you* for a reason.
