  - Within the system, you follow rules mechanically.
  - "Creativity" in this context is recognizing when to step back and how to find invariants.

  But finding invariants can be seen as a heuristic, which might be rule-based (e.g., in automated theorem proving, there are methods to find invariants).

  Therefore, it's still rule-following, but at a meta-level.

  The feeling of insight comes from shifting levels of abstraction.

  For the music analogy: Composer writing in a style vs. about it. When writing about it, they might analyze, deconstruct, etc., which involves different rules.

  But it's still rule-governed, just different rules.

  So, the professor's hunch seems supported: Jootsing is not rule-breaking; it's following the rules of a meta-system.

  Implications:
  - Genius might be less about breaking rules and more about mastering multiple levels of rules.
  - This demystifies creativity but also shows its computational nature.
  - For education, it emphasizes teaching meta-cognition and abstraction skills.

  If there is a discontinuity, where in MIU?

  Suppose we insist that the MIU system is all there is. Then, from within, you cannot prove the impossibility; you can only fail indefinitely.

