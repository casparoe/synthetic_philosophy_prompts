prompt: |-
  Im doing a Q&A for our department's student paper series next month with a philosopher who's been pushing a line I want to grill him on: he says the whole "AI is eroding our understanding" panic is confused, because understanding isn't a state inside your head — it's a property of an epistemic system (you plus the tools plus the people you defer to), so offloading a task onto a model can't erode it by itself. What actually gets eroded, on his view, is something different and narrower: our capacity to check a result we didn't derive ourselves, and he thinks that's a problem about dependence and power rather than about understanding. I'm moderating, and I want 8-10 questions. Press him on the system-property move — doesn't it end up true of any reliably functioning pipeline, and does he owe us a real difference between understanding and mere reliability? Then on whether his verification-capacity worry is just the old division of epistemic labour in new clothes. And finally on whether the two halves of his view can even sit together: if understanding is social, why isn't checking social too? For each of those three threads add a follow-up keyed to the answer he's most likely to give. No warm-up stuff about how he got into philosophy, and don't bother with reading lists or citations, I just want the questions.
