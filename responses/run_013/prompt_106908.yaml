prompt: |-
  I have spent the better part of a year on the governance working group of a large member-owned cooperative — about forty thousand members, an elected board, and a stubborn habit of settling every contentious question by referendum — and I have arrived at a settled view that I want stress-tested before I put it into a position paper. Here is the package. (1) Contested policy questions should be decided by conditional prediction markets rather than by referendum or board vote: two markets are opened on the same future date, one on the cooperative's per-member surplus if the proposal is adopted and one on the surplus if it is not, and the proposal is adopted whenever the first price exceeds the second. (2) Markets are the right instrument because they aggregate dispersed information that no committee or electorate could gather, and because they force people to back their beliefs with something they would hate to lose. (3) Whatever the markets are scored against must be a single, published, periodically measured index — I have in mind a composite of per-member surplus, member retention, and an independently audited safety measure — because a market needs a definite settlement value. (4) A decision is legitimate only if every member bound by it has an equal formal say in making it, and only if those on the losing side keep a standing avenue to contest the outcome. (5) I take seriously the thought that any index which is published and used to decide anything will be gamed, so the cooperative should treat its measured index as a fallible proxy for a true objective it cannot measure, and should never let the index itself become the thing it is trying to maximize.

  To head off the obvious objection I have been assuming two further things: that the trading tokens would be non-transferable and issued one per member, so the market cannot simply be captured by whoever holds the most cash, and that any member shown to have moved the index by sabotage rather than by genuinely useful action would forfeit a bond posted at the outset.

  What I want from you is an audit, not a defence. Tell me which of these commitments actually pull against one another, which pairs only look like they conflict, and how severe each genuine tension is. Rank the tensions rather than listing them as equally bad; for each, say what would have to give and what the cheapest repair would cost me elsewhere in the package; and then tell me which single revision would clean up the most at once. I would far rather be told that two of these cannot be held together than be reassured that they can.
reasoning: |-
  Okay, the user has spent nearly a year working on governance for a large cooperative and wants their ideas stress-tested. They've proposed using conditional prediction markets instead of referendums or board votes. Let me start by understanding their key points.

  First, they want two markets predicting per-member surplus under adoption vs. non-adoption of a proposal. The higher price decides. They believe markets aggregate information better and force commitment by risking something valuable. The index for settlement includes surplus, retention, and safety metrics. They emphasize equal formal say for legitimacy and avenues to contest losses. Also, they're wary of index gaming, so it's a proxy, not the target.

  Their safeguards: non-transferable tokens to prevent wealth dominance, and bonds against sabotage. They want an audit, not defense, focusing on internal conflicts.

  I need to identify tensions between their commitments. Let's break down each point and see where they clash. 

  Starting with equal formal say (point 4) vs. prediction markets (point 1). Equal say usually means one person, one vote. But prediction markets could let informed members dominate if they hold more tokens. But the user has non-transferable tokens, so each member gets one. But here's the issue: participation isn't equal. Some might not trade, leading to unequal influence. Those who trade more have more impact. So even with one token each, active traders sway the market. That conflicts with equal say in practice. Also, the bonding requirement might exclude risk-averse members. So tension here is high.

  Next, the index as a proxy (point 5) vs. the settlement index (point 3). The index needs to be concrete for market settlement. But if it's a proxy, gaming is a risk. Users want to treat it as fallible, but markets settle on the published index. Traders will focus on the index, not the true objective. So when the index is gamed, the market's outcome doesn't reflect the true goal. High tension because the market can't see beyond the index.

  Then, information aggregation (point 2) vs. equal formal say (point 4). Markets excel when information is dispersed. But equal say might mean including all members, even uninformed. With prediction markets, uninformed members might not participate or might trade poorly. That could lead to decisions driven by a few informed traders. So the legitimacy from equal say is undermined if only a subset participates effectively. Medium-high tension because it affects both efficiency and legitimacy.

  Another tension: information aggregation vs. gaming the index. Markets aggregate info, but if the index is gamed, the information becomes about gaming tactics, not real value. Traders might predict how others will game the system rather than actual outcomes. That corrupts the information aggregation. High severity because it could make markets counterproductive.

  Then, the bonding requirement vs. equal formal say. Forfeiting bonds for sabotage could deter gaming but might discourage participation. Risk-averse members might avoid trading, leading to unequal influence. Also, proving sabotage is tricky; false accusations could arise. Medium tension due to potential exclusion and enforcement challenges.

  Now, ranking tensions. The index proxy vs. market settlement is top. It's fundamental because if the index is gamed, the whole mechanism fails. Next, equal say vs. market dynamics because legitimacy is core. Then info aggregation vs. gaming because it affects decision quality. Followed by equal say vs. bonding due to participation barriers. 

  The cheapest fix for the index tension might be diversifying the index with non-manipulable metrics. But that's costly. Alternatively, accept some gaming but monitor. For equal say vs. markets, maybe require minimum participation or education. But that adds complexity. 

  The single revision to clean up most? Making the index more robust or adding oversight. But the user might need to accept less precise settlements. Alternatively, reconsider markets for all decisions, using them only for informative purposes. But that steps back from their proposal. 

  Also, the user's deeper need: effective governance that's both legitimate and efficient. They might fear that traditional methods (referendums) are inefficient, but markets could lack legitimacy. They need a balance. Unspoken needs: maintaining member trust, ensuring long-term sustainability, avoiding polarization. The audit should highlight where trade-offs threaten these.
answer: |-
  Here's a rigorous audit of your governance package, identifying genuine tensions, ranking them by severity, and outlining necessary trade-offs. The conflicts arise from inherent contradictions between democratic ideals, market mechanics, and incentive structures.

  ### **Ranked Tensions (High to Low Severity)**
  1.  **Tension: Equal Formal Say (4) vs. Market Participation Reality**  
      - **Conflict:** "Equal formal say" implies equal *de facto* influence. But prediction markets (even with non-transferable tokens) inherently concentrate influence among:  
        - Active traders (who participate) vs. passive members.  
        - Confident/risk-tolerant members vs. risk-averse ones.  
        - Members with resources to analyze outcomes vs. those without.  
      **Severity: High** — Undermines core legitimacy claim. Markets ≠ equal influence; they reward engagement/skill.  
      - **What Must Give:** Either redefine "equal formal say" as *access* (not influence), or abandon markets for binding decisions.  
      - **Cheapest Repair:** Mandatory participation (e.g., auto-betting tokens unless opted out). **Cost:** Coerced engagement reduces goodwill; passive members become easy arbitrage targets.

  2.  **Tension: Index as Proxy (5) vs. Market Settlement (3)**  
      - **Conflict:** Markets require a *definite, objective settlement metric* (point 3). But if the index is a "fallible proxy" (point 5), traders will predict *measured index outcomes*, not true welfare. This *guarantees* gaming, as optimizing for the index ≠ optimizing for the true goal.  
      **Severity: High** — Markets become engines for Goodhart’s Law: "When a measure becomes a target, it ceases to be a good measure."  
      - **What Must Give:** Either accept that markets optimize a flawed index (abandoning point 5), or abandon markets for binding decisions.  
      - **Cheapest Repair:** Add non-manipulable metrics (e.g., third-party sentiment analysis). **Cost:** Increased complexity; harder settlement disputes.

  3.  **Tension: Information Aggregation (2) vs. Index Gaming (5)**  
      - **Conflict:** Markets aggregate beliefs about the *published index* (point 3), but if the index is gameable (point 5), the "information" aggregated is about *how to manipulate the index*, not true member welfare.  
      **Severity: High** — Corrupts the primary benefit of markets.  
      - **What Must Give:** Strengthen the index against gaming (contradicting point 5’s premise) or admit markets optimize the wrong thing.  
      - **Cheapest Repair:** Make the index formula opaque until settlement. **Cost:** Reduced transparency invites distrust; harder for traders to price accurately.

  4.  **Tension: Contesting Outcomes (4) vs. Market Finality (1)**  
      - **Conflict:** Markets settle mechanically via prices. Allowing "standing avenues to contest outcomes" creates ambiguity. If losers routinely challenge, market decisions lose authority.  
      **Severity: Medium** — Risks paralysis or undermining market efficacy.  
      - **What Must Give:** Limit contests to procedural flaws (not substantive disagreements) or weaken contestability.  
      - **Cheapest Repair:** High burden of proof for contests (e.g., evidence of index manipulation). **Cost:** Perceived suppression of dissent.

  5.  **Tension: Bond Forfeiture vs. Equal Say (4)**  
      - **Conflict:** Forfeiting bonds for "sabotage" requires subjective judgment. Members accused of sabotage lose their "say" disproportionately.  
      **Severity: Medium** — Creates adversarial governance; subjective penalties erode legitimacy.  
      - **What Must Give:** Weaken sanctions (making gaming easier) or accept unequal penalties.  
      - **Cheapest Repair:** Define "sabotage" contractually (e.g., "any action reducing index without offsetting benefit"). **Cost:** Legalistic overhead; still requires adjudication.

  6.  **Tension: Non-Transferable Tokens vs. Market Efficiency**  
      - **Conflict:** Non-transferable tokens prevent liquidity. Illiquid markets produce noisy, manipulable prices.  
      **Severity: Low-Medium** — Threatens market accuracy but manageable.  
      - **What Must Give:** Allow limited token transfers (e.g., to designated proxies) or accept less efficient markets.  
      - **Cheapest Repair:** Use market makers (bots) to boost liquidity. **Cost:** Centralization risk; gaming market makers.

  ---

  ### **The Single Revision That Fixes the Most: Demote Markets to Advisory Role**  
  **Revision:** Use prediction markets to *inform* the board/referendums, not to *decide* policy.  
  - **Resolves:**  
    - Tensions 1 & 4: Preserves "equal formal say" via votes, while using markets for insight.  
    - Tension 2 & 3: Index flaws become less critical; markets expose gaming risks.  
    - Tension 5: Sanctions apply only to deliberate harm, not market activity.  
  - **Costs:**  
    - Sacrifices pure market efficiency (point 1) and "backing beliefs" incentive (point 2).  
    - Adds step between markets and decisions.  

  **Why this cleans up most:** It separates the *epistemic strength* of markets (information aggregation) from their *procedural weaknesses* (legitimacy/gaming risks). Retains your core innovation while avoiding irreconcilable conflicts with democratic values.

  ---

  ### **Key Takeaways for Your Position Paper**  
  - **Unavoidable Trade-off:** Markets optimize for *what you measure*, not what you care about. If your index is gameable, markets will game it.  
  - **Legitimacy Gap:** Equal tokens ≠ equal influence. Passive members will delegate influence to active traders.  
  - **Critical Fix Needed:** Either redefine "legitimacy" (accepting unequal influence) or use markets as advisory tools.  
  - **Least Contested Elements:** Non-transferable tokens and bonding are clever safeguards but don't resolve core tensions.

  Your design is intellectually audacious but overburdened. Prioritize either **decision efficiency** (markets as deciders) or **legitimacy** (markets as advisors). Hybrids fracture under the tensions above.
