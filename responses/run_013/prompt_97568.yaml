  ## The Thief's Refrain
  *(A Pantoum on Strategy-Stealing)*

  You call it swindle, not true proof's design:
  A win declared, yet no first move displayed.
  Where is the tactic, then, that proves the line?
  A strategy is stolen, not home-made.

  "A win declared, yet no first move displayed"—
  The second player claims a path to win.
  "A strategy is stolen, not home-made,"
  The first replies, "I'll wear your stolen skin."

  "The second player claims a path to win,"
  But spare a stone? It cannot cause you loss.
  The first replies, "I'll wear your stolen skin,
  On boards where passing never bears a cost."

  "But spare a stone? It cannot cause you loss,"
  Unlike misère, or endgames forced and tight.
  "On boards where passing never bears a cost,"
  And draws are absent from the fair game's light.

  Unlike misère, or endgames forced and tight,
  In Chomp, the poisoned corner waits alone.
  "And draws are absent from the fair game's light"— 
  Where is the move that breaks the board, unknown?

  In Chomp, the poisoned corner waits alone.
  The proof insists the first must seize the day.
  "Where is the move that breaks the board, unknown?"
  You call it swindle, not true proof's design.

  ---

  **Notes on the Argument & Poem:**

  *   **Structure as Argument:** The pantoum's recursive theft of lines mirrors the strategy-stealing itself. Lines spoken defending the *second player* (e.g., "A win declared, yet no first move displayed," "The second player claims a path to win") are later appropriated by the voice arguing for the *first player*.
  *   **Premises Honored:**
      *   *"spare a stone? It cannot cause you loss" / "On boards where passing never bears a cost"*: Highlights the need for no zugzwang (where a forced move hurts). The extra move must be harmless or beneficial.
      *   *"Unlike misère, or endgames forced and tight"*: Explicitly names misère play (where the *last* move loses) and zugzwang situations as places the argument fails.
      *   *"And draws are absent from the fair game's light"*: The argument only proves the second player *cannot* force a win; without no-draws, it doesn't force a first-player win.
  *   **Chomp & The Unanswered Question:**
      *   *"In Chomp, the poisoned corner waits alone"*: Describes the game (eating down/right from a grid, avoiding the poisoned bottom-left corner).
      *   *"The proof insists the first must seize the day"*: The strategy-stealing argument *proves* the first player has a winning strategy on any finite rectangle.
      *   *"Where is the move that breaks the board, unknown?"*: The recurring, unanswered question. For all but trivial Chomp boards, the winning first move is unknown, embodying the "swindle" feeling – we know a win exists, but the proof gives no clue *how*.
  *   **The Loop Closes:** The final line circles back to the opening accusation, "You call it swindle, not true proof's design," reflecting how the argument relies on its own contradiction but leaves the constructive solution elusive. The thief wins the argument, but the winning move remains hidden.
