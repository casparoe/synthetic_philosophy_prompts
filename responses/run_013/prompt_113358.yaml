prompt: |-
  for philosophy club I got stuck doing epiphenomenalism — the view that your experiences are real but cause nothing, not even your belief that you're having them. I don't want the usual for/against, I want the spec first: what does any theory in this area have to deliver before I take it seriously? So give me the requirements list — the cases it has to get right (blindsight, split-brain, people who sincerely report a reason for a choice that obviously wasn't the real one, the plain fact that I can apparently just tell I'm seeing red), the distinctions it can't collapse (having an experience vs judging that you have it; the experience causing the judgment vs the two just being reliably in sync), and whatever from brain science it can't contradict — with the case or result doing the work behind each one, and a flag on any two that look like they can't both be satisfied.

  One thing I want the list to deal with, my friend brought it up and I can't stop thinking about it: imagine a creature whose experiences are totally causally idle, but whose brain has a seperate little module that reads those states off and writes the reports — so its reports are always accurate while the experiences still do nothing. If a theory says that counts as the creature knowing what its experiencing, fine; if not, what does have to be true instead? Either way the list should handle that case.

  Give it back as exactly five numbered items, a sentence or two each, no intro and no closing paragraph, and inside item five tell me how confident you are in the whole list and which single item your least sure of.
reasoning: |-
  Okay, the user is in a philosophy club and stuck on epiphenomenalism—the idea that experiences are real but causally inert. They don't want the usual pros and cons; instead, they're asking for a "spec" or requirements list that any theory in this area must meet. 

  Hmm, they're clearly frustrated with surface-level debates and want foundational criteria. The request is precise: exactly five numbered items, no fluff, with specific cases and distinctions. They also mentioned a thought experiment about a creature with idle experiences and a separate reporting module—this needs to be addressed explicitly. 

  The user's tone suggests they're analytically minded ("spec first," "requirements list") and annoyed by hand-wavy philosophy. Probably an undergrad or grad student? Their friend's objection about the "separate module" creature seems to have genuinely unsettled them—it’s a sharp challenge to epiphenomenalism’s coherence. 

  Breaking this down: 
  First, any theory must handle the *basic intuition* of direct awareness (e.g., "I can just tell I’m seeing red"). If epiphenomenalism can’t explain this without smuggling in causation, it’s in trouble. 
  Second, it must account for *dissociation cases* like blindsight (where behavior persists without experience) and choice blindness (where confabulated reasons expose gaps between cause and report). These reveal fractures in "experience → report" chains. 
  Third, it needs a *causal firewall* between experience and judgment. The "separate module" creature tests this: if accurate reports without causal links count as "knowledge," epiphenomenalism might work—but is that *really* knowledge? If not, what’s missing? 
  Fourth, *neuroscientific constraints* matter. Libet’s readiness potential, for example, shows neural events precede conscious decisions. A theory can’t ignore that timing. 
  Fifth, *internal coherence* is key. Can the theory avoid collapsing distinctions (e.g., experience vs. report) or contradictions? The hardest tension is likely between direct awareness (#1) and causal idleness (#3)—how can you "just know" without *any* causal role? 

  For item 5, I’ll flag that tension explicitly and note my confidence. Least sure about #3 (causal firewall) because the "separate module" case feels like cheating—it *solves* the report problem technically but might hollow out "knowledge." 

  …Writing the response now. Keeping it clinical: five bullets, no intros, just specs. The user will appreciate that.
answer: |-
  Here are five requirements for a theory of consciousness regarding epiphenomenal claims:

  1.  **Explain Direct Introspective Access:** It must account for the robust intuition and apparent fact that we can directly know our own conscious states (e.g., knowing "I see red") without inferential reasoning. This requires explaining the reliable link between having an experience and forming a belief *about* it, without the experience *causing* that belief (the core epiphenomenal challenge). The "plain fact" of apparent direct awareness is the case.

  2.  **Handle Dissociation Cases Without Collapse:** It must accommodate cases like blindsight (unconscious visual processing guiding action without conscious experience), split-brain phenomena (conflicting reports/actions between hemispheres), and choice blindness/confabulation (sincere but demonstrably false reports of reasons for actions). These cases show experience, judgment, and causal control can dissociate, requiring the theory to preserve distinctions like *having an experience* vs. *judging you have it* vs. *the actual causes of behavior*.

  3.  **Resolve the Reporting Mechanism Problem:** It must specify what constitutes "knowing" one's experience in light of the "separate module" case: a causally inert experience state (E) and a separate brain mechanism accurately detecting E and generating reports (R). The theory must clarify if this reliable E->R detection *suffices* for knowledge, or if something else (e.g., E playing a direct causal role in R) is necessary. Avoiding collapse between mere reliable correlation and genuine epistemic justification is key here.

  4.  **Respect Neuroscientific Causality & Timing:** It cannot contradict established neuroscientific findings about the timing and neural correlates of perception, decision, and action. For example, it must be compatible with Libet-style readiness potentials (neural activity precedes conscious intention) and neural causes of reports without requiring conscious experience to *initiate* those neural events. The neural causes of reports must be distinct from the conscious experiences reported on.

  5.  **Maintain Internal Coherence & Avoid Contradiction:** The theory must coherently integrate all the above without collapsing essential distinctions (e.g., experience vs. judgment, correlation vs. causation) or creating logical contradictions (e.g., requiring experiences to cause beliefs while denying they cause anything). **Confidence: Moderately high overall. Least sure about Item 3 (Reporting Mechanism)** – defining "knowledge" without any causal role for the experience is deeply problematic, making it hard to see how *accurate detection* alone suffices for genuine first-person knowledge rather than just third-person information. The tension between Item 1 (direct access) and Item 3's requirements under epiphenomenalism feels particularly acute.
