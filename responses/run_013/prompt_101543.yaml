answer: |-
  The practice of ranked-choice voting (RCV) and its accompanying voter guides reveal specific presuppositions about the purpose of a ballot and the nature of electoral security, while exposing a tension between its advertised ideals and its actual properties.

  ### Presuppositions about the Ballot's Purpose
  1.  **Ballot as a Complete Preference Schedule:** The ballot is presupposed to be a vehicle for voters to express their *complete and sincere ordinal ranking* of all candidates. It's not merely a tool for selecting a single winner, but for detailing a full hierarchy of preferences.
  2.  **Ballot as Insurance:** The ballot serves as "insurance" against the elimination of a voter's top choice. The promise is that expressing lower preferences ensures continued influence even if the favorite is eliminated.
  3.  **Ballot as Transferable Influence:** The ballot's value lies not just in its first choice, but in its potential to transfer support down the ranking. This presupposes the counting process will actively utilize this information to determine the most broadly acceptable winner.

  ### Presuppositions about Voter Security
  1.  **Safety in Sincerity:** Voters are promised **security against betrayal by their own ballot**. The core security guarantee is: *"Ranking your sincere favorite first cannot hurt that candidate, and expressing lower preferences cannot harm your higher preferences."* This is the advertised "end of the wasted vote" and "vote your conscience" promise.
  2.  **Immunity from "Spoiler" Dynamics (Implied):** While not absolute, the system presupposes a significant reduction in vote-splitting spoiler effects compared to plurality voting. The security includes freedom from feeling forced to abandon a sincere favorite due to fear of helping a less-preferred candidate win.
  3.  **Security Through Transferability:** The voter is promised security that their ballot's influence will persist through rounds *as long as it remains active* (i.e., hasn't exhausted). The risk of exhaustion is acknowledged (by discarding such ballots) but presented as an acceptable trade-off for the initial security of ranking sincerely.

  ### The Sincere-Ranking Advice & Strategic Vulnerability
  The voter guide advice ("rank sincerely") presupposes a specific strategic property of the counting rule, but **not full strategy-proofness for any number of candidates**.

  1.  **The Advertised *Implied* Promise (Stronger):** The messaging ("put your true favorite first") heavily implies **strategy-proofness** (or near-strategy-proofness) – that sincere ranking is *always* optimal, regardless of the number of candidates or others' behavior. This is the "stronger" promise voters likely infer.
  2.  **The Strictly Necessary Promise (Weaker):** The practice *strictly needs* only the **weaker property of Monotonicity** (or "Positive Responsiveness" in a specific sense). Specifically:
      *   **Adding a lower preference never harms a higher preference.** (Ranking candidate B second cannot cause candidate A, ranked first, to lose if A would have won without that B ranking).
      *   **Raising a candidate in one's ranking never harms that candidate.** (If you rank candidate A first instead of second, this should never cause A to lose an election they would have won under your original ranking).
      *   **Commitment Needed:** This weaker property is essential for the core security promise against ballot betrayal. Without it, the advice to "rank sincerely" is fundamentally undermined, as ranking a favorite higher *could* cause them to lose.
  3.  **The Reality Gap:** RCV (Instant-Runoff Voting) is **not strategy-proof**. Strategic ranking (e.g., "betraying" a true favorite perceived as weak by ranking a strong compromise higher) can sometimes yield a better outcome. Crucially, RCV is also **not monotonic**. There are rare but real configurations where:
      *   *Ranking a candidate higher can cause them to lose* (Non-Monotonicity Failure).
      *   *Ranking a candidate lower can cause them to win* (The inverse failure).
  4.  **Institutional Reading:** The practice can absolutely be read as **presupposing the weaker property (monotonicity) while advertising the stronger one (strategy-proofness)**. The voter guides focus on the sincere ranking advice and the transferability benefit, implicitly assuming monotonicity holds (since violating it makes sincere ranking perilous). However, the messaging ("end of wasted vote," "vote your conscience") uses language that strongly suggests strategy-proofness, exploiting the common voter assumption that "ranking sincerely is always safe and optimal."

  ### Commitments: Strictly Needed vs. Fits Well With
  | Commitment                     | Strictly Needed | Fits Well With | Notes                                                                 |
  | :----------------------------- | :-------------- | :------------- | :-------------------------------------------------------------------- |
  | **Monotonicity (Weaker Prop.)** | **YES**         | -              | Core promise: Sincere ranking won't betray you/hurt your favorites.   |
  | **Sincere Ranking Optimal**    | -               | YES            | Advertised ideal, but not strictly true; strategy sometimes required. |
  | **Full Strategy-Proofness**    | NO              | -              | Advertised *implicitly* but not delivered; not required for function. |
  | **Immunity to "Spoilers"**     | NO              | YES            | Reduced spoiler risk is a key benefit, but not absolute immunity.     |
  | **Ballot Exhaustion Acceptable** | **YES**         | -              | System design inherently allows it; guides implicitly acknowledge it. |
  | **Transferability as Security** | **YES**         | -              | Core mechanism enabling the "no wasted vote" promise.                 |

  ### Changes to Voter Guides if the Weaker Property Were Explicit
  If voter guides explicitly acknowledged that RCV only guarantees the weaker monotonicity property (and not full strategy-proofness) and that non-monotonicity is a rare possibility, they would need significant changes for transparency:

  1.  **Qualify the "Sincere Favorite First" Advice:** Language would need softening: "In most cases, you can safely rank your true favorite first. However, in very close multi-candidate races with specific dynamics, ranking a candidate higher *could* theoretically hurt their chances. Such situations are rare."
  2.  **Acknowledge Strategic Complexity:** Guides would need to admit: "While ranking sincerely is usually recommended and safe for your higher preferences, there might be complex situations where considering the perceived strength of candidates could lead some voters to make different strategic choices. This is less common than in plurality voting."
  3.  **Explain Non-Monotonicity (Simply):** Include a brief, clear explanation: "Important Note: In extremely rare and specific circumstances, giving a candidate a higher ranking on your ballot could accidentally lower their chance of winning, or giving them a lower ranking could help them win. This quirk is a mathematical possibility in this counting system, though it happens very infrequently in real elections."
  4.  **Emphasize Exhaustion Risk More Prominently:** While exhaustion is acknowledged, its impact would need stronger framing: "Remember, if you don't rank enough candidates who make it to the final rounds, your ballot will 'exhaust' and stop counting. To maximize the chance your vote counts in the final decision, consider ranking candidates you can tolerate, even if they aren't your top choices."
  5.  **Shift Focus from "Always Safe" to "Safer Than Plurality":** The messaging would evolve from "the end of the wasted vote" / "vote your conscience without fear" to "a system designed to *reduce* wasted votes and spoiler effects compared to choose-one voting, while allowing you to express your full preferences, though with some rare strategic complexities."

  **Conclusion:** RCV practice presupposes a ballot is a sincere preference schedule offering security through transferability. Its core, strictly necessary commitment is monotonicity – the promise that expressing preferences sincerely won't harm your higher choices. However, it is marketed using language implying the stronger, unattainable property of strategy-proofness. Explicitly acknowledging the weaker property would necessitate voter guides to admit rare strategic complexities and the non-intuitive risk of non-monotonicity, significantly tempering the "vote your conscience without any strategic worry" sales pitch, but aligning better with the system's actual mathematical properties. The institution relies on monotonicity while often advertising an illusion of strategy-proofness.
