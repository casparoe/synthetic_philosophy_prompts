  Hmm, the core challenge here is that Strawson's framework centers on interpersonal moral dynamics where the offender's repentance can modify the victim's reactive attitudes. But in this case, the offender is dead and unrepentant. The Amish forgave anyway - which seems to bypass Strawson's primary forgiveness pathway. 

  First I need to map the Strawsonian elements at play:
  - The victims' families would normally experience personal reactive attitudes (resentment) toward Roberts
  - The broader Amish community likely felt vicarious indignation on their behalf
  - Non-Amish observers probably had even stronger vicarious attitudes given the horrific nature of the crime

  But the Amish response complicates this: their immediate forgiveness suggests either suspension of reactive attitudes or their transformation. The key question is whether this constitutes adoption of the objective stance (viewing Roberts as broken rather than blameworthy) or something else entirely.

  What's striking is that the Amish didn't deny Roberts' moral responsibility - they acknowledged his wrongdoing while choosing forgiveness. This suggests transformation rather than suspension of reactive attitudes. Their actions (attending his funeral, supporting his family) seem like positive moral responses replacing resentment.

  The communal aspect is crucial here. Strawson focuses on dyadic relationships, but the Amish acted as a collective moral agent. Their forgiveness wasn't just individual - it was a communally reinforced stance. This might reveal a gap in Strawson's individualistic model.

  Regarding the repentance problem: since Roberts couldn't repent, the Amish created conditions for forgiveness through their own spiritual framework - treating him as a fellow human deserving grace despite his actions. This bypasses Strawson's requirement for offender attitude change.

  The case also highlights how reactive attitudes can be collectively reshaped through cultural/religious practices - something Strawson doesn't address. His model assumes attitudes arise naturally, but here we see deliberate cultivation of alternative responses.

  Where I'm uncertain: 
