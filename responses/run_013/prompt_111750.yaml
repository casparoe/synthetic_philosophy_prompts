answer: |-
  ### Sestina: Varieties of the Good  

  The water holds you, soft as faith—a **bath**.  
  Bright as a dawn, the solved theorem’s **proof**.  
  That vise inside your skull dissolves: **relief**.  
  You catch the stumble, bite back a **laugh**.  
  The raw, red itch finds peace in each **scratch**.  
  The espresso’s dark embrace: pure **bitter**.  

  You craved that tannic sting, the thrill of **bitter**,  
  long after leaving steam and skin—the **bath**.  
  The welt demands attention, begs a **scratch**.  
  No axiom compares to this hard-won **proof**.  
  The trip, the flailing limbs—a snort, a **laugh**—  
  then guilt, then pleasure doubled by **relief**.  

  Not just the end of ache, but pure **relief**  
  that floods the veins, unlike the slow-sipped **bitter**.  
  You sink until the water’s like a **bath**  
  of liquid dusk. The elegance of **proof**  
  unspools. That pratfall jars a startled **laugh**,  
  while nails dig deep to grant the blissful **scratch**.  

  A fingernail meets fire: the final **scratch**.  
  No agony remains, just cool **relief**.  
  The roasted bean’s charred kiss, the grown-up **bitter**,  
  steams beside the damp towel from the **bath**.  
  You trace the logic, flawless as a **proof**,  
  but hear the street, the cruel, cascading **laugh**.  

  They hid their eyes but couldn’t kill the **laugh**.  
  You raked your arm until the burning **scratch**  
  brought silence like a theorem’s **proof**.  
  When ice picks melt, you breathe the word **relief**.  
  The cup’s last drop, that acrid, wanted **bitter**,  
  cleanses like the memory of the **bath**.  

  The mind alights upon a gleaming **proof**.  
  The stranger’s shame ignites a borrowed **laugh**.  
  The cocoa’s ash, the necessary **bitter**,  
  the welt’s fierce cry, the answering **scratch**,  
  the vice unclamped, the mercy of **relief**—  
  all fade beside the sanctuary: **bath**.  

  In **relief**, the **scratch**, the **laugh**, the **bitter**, the **proof**,  
  each claims the **bath**’s calm throne, yet stands apart—  
  no common note within the choir of the heart.  

