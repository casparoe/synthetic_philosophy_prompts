answer: |-
  Below is a practical procedure for your mechanism registry anomaly detector, designed for efficiency, minimal GPU usage, and clarity for a rotation student. It prioritizes **counterfactual tests** (which do the "real work") over structural or role-based tests (which are more decorative and subjective). The procedure is built to fail fast (<1 afternoon of GPU time) and flags ambiguous cases for team review.

  ---

  ### **Procedure: Mechanism Sameness Check**
  **Inputs**:  
  - Flagged anomaly (behavior unexplained by registry entry).  
  - Registry entry (task, parts, causal story, interventions).  
  - Predefined tolerance thresholds: Effect size (±15%), performance drop (±10% absolute), structural similarity (≥70% overlap in parts).  

  **Outputs**:  
  - **Same**: Mechanism matches registry (no action needed).  
  - **Different**: New mechanism (create new registry entry).  
  - **Needs Team**: Registry merge/split (e.g., mechanism refactored, partial match, or ambiguity).  

  **Steps**:

  #### **Phase 1: Triage (15 mins, No GPU)**  
  *Goal: Rule out false alarms or trivial cases.*  
  1. **Q1: Is the task identical?**  
     - *Check*: Compare task parameters (e.g., input distribution, output metric).  
     - *Sufficient answer*: If parameters differ (e.g., new prompt template), → **Different** (new context). Else, proceed.  

  2. **Q2: Is the anomaly explainable by known noise?**  
     - *Check*: Compare anomaly magnitude to historical fluctuations (e.g., <5% performance drift from baseline).  
     - *Sufficient answer*: If within noise threshold → **Same**. Else, proceed.  

  3. **Q3: Is the registry intervention applicable?**  
     - *Check*: Can the registered intervention (e.g., ablation) be replicated *exactly*? (e.g., same nodes, same metric).  
     - *Sufficient answer*: If not (e.g., nodes missing), → **Needs Team**. Else, proceed to Phase 2.  

  **Phase 2: Core Interventions (60–90 mins GPU)**  
  *Run in order; stop early if conclusive.*  
  1. **I1: Re-run registered intervention** (e.g., ablate key head/layer).  
     - *What to run*: Exact intervention from registry on anomalous inputs (10–20 samples).  
     - *Stop if*: Effect matches registry (e.g., performance drop within ±10% of registered effect). → **Same**.  
     - *Else*: Proceed to I2.  

  2. **I2: Activation patching on critical nodes**  
     - *What to run*: Patch activations from a clean run into the anomalous run at registry-specified nodes (e.g., swap outputs of a head).  
     - *Stop if*: Anomaly resolves (performance restored to within 5% of clean baseline). → **Same** (mechanism intact).  
     - *Else*: Proceed to I3.  

  3. **I3: Localized counterfactual search**  
     - *What to run*:  
       - Ablate/patch nodes in the registry-defined "area" (e.g., ±1 layer, adjacent heads).  
       - Test only *one* new candidate intervention (e.g., ablate a suspect head from activation maps).  
     - *Stop if*:  
       - Effect matches registry → **Same** (implementation changed, role same).  
       - No effect in the area → **Different** (mechanism absent).  
       - Partial effect (e.g., performance partially restored) → **Needs Team** (likely merge/split).  

  **Phase 3: Final Judgment (15 mins, No GPU)**  
  *Only if I1–I3 inconclusive.*  
  1. **Structural check**: Overlap of parts (e.g., heads, layers) with registry.  
     - ≥70% overlap → Lean **Same**.  
     - <50% overlap → Lean **Different**.  
     - *Judgment call*: Human compares part types (e.g., "induction head" vs. "composition head").  

  2. **Role check**: Does the mechanism fulfill the same high-level purpose?  
     - *Judgment call*: Human answers: "Is this still the 'thing that does X' in the model's story?"  
     - If role matches → **Same**; else → **Different** or **Needs Team** if ambiguous.  

  **Output Decision**:  
  - **I1/I2 conclusive** → Trust counterfactual result.  
  - **I3 + Phase 3** → Use majority vote:  
    - Structural + Role match → **Same**.  
    - Both mismatch → **Different**.  
    - Conflict (e.g., structural match + role mismatch) → **Needs Team**.  

  ---

  ### **Which Tests Do Real Work?**
  - **Counterfactual (Core)**: Empirical, causal, and GPU-efficient. Handles 80% of cases in Phases 1–2.  
  - **Structural (Decorative)**: Quick sanity check; prone to false positives (e.g., same "type" of head ≠ same role).  
  - **Explanatory Role (Decorative/Subjective)**: Useful for edge cases but not factual—requires human intuition.  

  **Human Judgment Dressed as Procedure**:  
  - Phase 3 (structural/role checks) and tolerance thresholds (±10% effect) are inherently subjective. Calibrate thresholds using past anomalies.  
  - "Localized" in I3 requires defining an "area" (e.g., "attention heads in layers 5–7"), which is model-dependent.  

  ---

  ### **Limitations & Failure Modes**  
  - **Can’t Handle**:  
    - Distributed mechanisms (no clear critical nodes).  
    - Contextual switches (e.g., mechanism works only for specific subtasks).  
    - Counterfactual-resistant changes (e.g., mechanisms with redundant pathways).  
  - **Misfires**:  
    - **False Same**: Mechanism changed but counterfactuals similar (e.g., due to redundancy).  
    - **False Different**: Anomaly caused by external factor (e.g., interference from another mechanism).  
    - **False Needs Team**: Overly cautious when tolerances are too strict.  
  - **First-Run Risks**:  
    - Student misjudges structural similarity or tolerances.  
    - I3 search is too broad → GPU timeout.  
    - Role ambiguity → unnecessary team escalation.  

  ---

  ### **Case Applications**  
  #### **Case 1: 7B Model vs. 160M Registry Entry (Same Task, Different Depths/Redundancy)**  
  - **Triage**: Task identical → Proceed.  
  - **I1**: Ablate registry-specified head → Smaller effect (due to redundancy). Proceed to I2.  
  - **I2**: Patch head → Partial anomaly resolution. Proceed to I3.  
  - **I3**: Ablate adjacent heads → Full resolution when all 3 heads ablated. Effect matches registry.  
  - **Phase 3**: Structural mismatch (different depth), but role matches (same task).  
  - **Output**: **Needs Team** (registry split—one entry → three heads).  
  - **Why**: Counterfactual matches, but structural change and redundancy require registry update.  

  #### **Case 2: Modular Addition (Memorized vs. Rotation)**  
  - **Triage**: Task identical → Proceed.  
  - **I1**: Ablate "rotation" head on large moduli → No effect. Proceed to I2.  
  - **I2**: Patch head → No resolution. Proceed to I3.  
  - **I3**: New ablation in same area → Critical head found for large moduli, but effect pattern differs (e.g., no rotation signatures).  
  - **Phase 3**: Structural match (same head type), but role mismatch (memorization ≠ rotation).  
  - **Output**: **Different** (new mechanism for large moduli).  
  - **Why**: Counterfactuals diverge; role fails for large moduli. Detector misfired because threshold was for rotation.  

  #### **Case 3: Flagged Behavior That Weakens Public Claims**  
  **Scenario**: You publicly claimed "we detect all mechanism switches." The detector flags a **contextual switch**—the model uses a known mechanism (e.g., induction head) for task X, but *only* when inputs are simple. For complex inputs, it silently uses a *new, unregistered* mechanism.  
  - **Triage**: Task identical → Proceed.  
  - **I1**: Ablate registry node → Effect matches for simple inputs, but no effect on anomalous (complex) inputs.  
  - **I2**: Patch node → Resolves simple cases, not complex.  
  - **I3**: New ablation → Finds critical node for complex inputs, but effect pattern is novel.  
  - **Phase 3**: Role mismatch (same task, different algorithm).  
  - **Output**: **Different** (new mechanism for complex inputs).  
  - **Why This Hurts**: The anomaly detector missed the *emergence* of the new mechanism until it caused a deviation. Public claim weakened because:  
    - Switches can be context-dependent and evade detection until triggered.  
    - Registry only monitors *known* mechanisms; silent additions aren’t caught proactively.  

  ---

  ### **Final Notes**  
  - **GPU Budget**: Phase 2 uses <100 runs (I1: 10 runs, I2: 20 runs, I3: 50 runs). Prioritize small batches (10–20 samples) to fit within an afternoon.  
  - **Training Rotation Students**: Start with synthetic anomalies (e.g., inject noise into known mechanisms) to calibrate judgments.  
  - **Iterate**: Refine tolerances and "localized search" rules after 5–10 real runs.  

  This procedure prioritizes speed and objectivity, but 20–30% of cases will escalate to the team—embrace this as a feature (it protects against oversimplification). The first 3–5 uses will be messy; debrief after each to tighten thresholds.
