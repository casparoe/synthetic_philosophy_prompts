prompt: |-
  Ok so I got into a long stupid argument with a mate last night and now I need an actual answer. The question was whether the killing/letting-die line and the intended/foreseen line (the one double-effect reasoning runs on) are really the same distinction or two separate axes that just overlap a lot. He reckons they're basically one distinction wearing different clothes — the whole point of both, he says, is to let you off the hook when the bad outcome wasn't the thing you were aiming at. I think that's way too quick, because it looks to me like you can intend an omission (I don't restart him precisely because I want him gone) and you can merely foresee a killing (flatten the building knowing full well the people inside die). So compare the two for me — the doing/allowing distinction on one side, the intended/foreseen distinction as it functions in double-effect reasoning on the other. Are they the same distinction, or independent ones that cut across each other? Lay them out on the four combinations (doing+intended, doing+foreseen, allowing+intended, allowing+foreseen), tell me which of the four is the genuinely hard cell and what it's supposed to show, and say whether the two distinctions ever seperate in a case that actually changes the verdict about permissibility. Also settle a sub-fight: he says you can't intend an omission at all, that intending needs an act to attach to — is that right or not?

  Then take a definite position, dont just give me both sides. Which of the two distinctions is doing the real moral work, and if you had to give one up, which goes? Give your reasons. If you think one of them collapses into the other, say so straight out. And tell me which single feature of the cases is carrying the weight, so I know what my mate and I were actually disagreeing about.
reasoning: |-
  Okay, the user is asking for a clear resolution to their argument about two ethical distinctions: killing vs. letting die and intended vs. foreseen outcomes. They want a definitive stance, not just an overview. Let me start by breaking down their questions.

  First, they need to know if these two distinctions are the same or separate. Their friend thinks they're essentially the same, both excusing bad outcomes that aren't the main goal. The user disagrees, arguing you can intend an omission (like not restarting life support to cause death) and foresee a killing (like demolishing a building knowing people inside will die). 

  I should outline the four combinations: doing+intended, doing+foreseen, allowing+intended, allowing+foreseen. Which one is the problematic case? Probably the allowing+intended scenario. For example, turning off a life support system to kill someone. This is harder to justify than merely foreseeing death. 

  Next, the sub-question: can you intend an omission? The friend says no, intention requires an action. But philosophical consensus is that you can intend omissions. For instance, deliberately withholding food to cause starvation. The intention targets the omission itself.

  Now, which distinction is doing the real work? The intended/foreseen distinction seems more fundamental. Double-effect reasoning hinges on intention as the key factor for permissibility. Killing vs. letting die often depends on intention to determine moral weight. If forced to choose, dropping the doing/allowing distinction might be better because intention is more critical. 

  Cases where they separate: Active mercy killing (doing+foreseen) vs. passive euthanasia with intent (allowing+intended). The latter might be seen as more permissible in some frameworks, showing the distinctions aren't identical. 

  The core feature carrying weight is the agent's intention. That's what the user and their friend are really disagreeing about. Clarifying that intention is central should resolve their argument.
answer: |-
  Here's the definitive breakdown you asked for, cutting through the philosophical fog:

  **1. The Distinctions Are Separate (But Overlap Heavily):**  
  Your mate is wrong. Killing/letting-die (doing/allowing) and intended/foreseen are **two distinct axes that often align but can crucially separate**. Intention targets *what you purposefully bring about* (your aim/plan). Doing/allowing targets *how you bring it about* (action vs. omission/inaction in a causal context).

  **2. The Four Combinations & The "Hard Cell":**

  | **Combination**        | **Description**                                         | **Example**                                              | **Permissibility Verdict**                          | **Why It Matters**                                                                 |
  | :--------------------- | :------------------------------------------------------ | :------------------------------------------------------- | :-------------------------------------------------- | :--------------------------------------------------------------------------------- |
  | **Doing + Intended**   | Acting to directly cause harm as your goal.             | Shooting someone to kill them.                           | **Almost Always Impermissible**                     | Core case of murder; clear intentional wrongdoing.                                 |
  | **Doing + Foreseen**   | Acting where harm is a side-effect, not your goal.      | Collapsing building (to stop fire) knowing occupants die. | **Potentially Permissible (Double Effect)**         | Where double effect *can* justify; harm isn't aimed at, but a byproduct.             |
  | **Allowing + Foreseen**| Failing to prevent harm you see coming but don't cause. | Not saving a drowning stranger (you could easily save). | **Often Impermissible (Negligence)**                | Failing a duty; letting die *can* be wrong, but often less bad than killing.         |
  | **Allowing + Intended**| **INTENDED OMISSION** - Failing to act *in order to* cause harm. | Turning off life support *specifically* to cause death. | **THE HARD CELL (Often Impermissible)**             | Proves the distinctions separate. Morally akin to killing+intended, even if "passive". |

  **The "Hard Cell" (Allowing + Intended):** This is the key. Your example ("I don't restart him precisely because I want him gone") nails it. Intending death *via omission* is morally equivalent to intending death *via action* in core cases. It’s passive, but the *purpose* makes it murderous. This cell shows that **intention can "poison" an omission**, making it as bad (or nearly as bad) as an intentional action. The verdict is usually **impermissible**, collapsing the usual doing/allowing moral gap *because of the intention*.

  **3. Sub-Fight: Can You Intend an Omission?**  
  **You are right.** Your mate is wrong. Intention absolutely applies to omissions. "I *intend* that he dies *by* my not restarting the machine" is a coherent and psychologically real mental state. The intention attaches to the *state of affairs you aim to bring about through your inaction*. Philosophers widely reject the "intention needs physical action" claim (e.g., Anscombe, Bratman).

  **4. Which Distinction Does the Real Work?**  
  **The intended/foreseen distinction is doing the heavy lifting.** Here's why:

  *   **Intention Defines the Moral Character:** What you *aim at* fundamentally shapes the nature of your act. Aiming at harm is central to wrongdoing.
  *   **Double Effect Relies on It:** The doctrine collapses without the intended/foreseen line. It explicitly turns on *not* intending the evil.
  *   **It Explains the "Hard Cell":** The reason intended allowing feels like murder is *because of the intention*, not the passivity itself. The doing/allowing distinction weakens when intention is malevolent.
  *   **It Resolves Ambiguity in Doing/Allowing:** Many disputed cases (e.g., removing life support) turn on *why* you did it – intention clarifies.

  **5. If You Had to Give One Up:**  
  **Ditch the doing/allowing (killing/letting die) distinction.** It's often morally secondary and gets swamped by intention. Knowing *whether you intended the harm* gives a clearer, more fundamental moral verdict than knowing *whether you acted or omitted*. The doing/allowing line is fuzzy (what counts as an "act"? what counts as "causing"?), while intention, though complex, is more directly tied to culpability. Cases like the "Hard Cell" show intention overriding the action/inaction difference.

  **6. The Single Weight-Bearing Feature:**  
  **The agent's practical reasoning – specifically, whether the harm was adopted as a *goal* or merely *accepted* as a consequence.** This is the core of intention vs. foresight and what your argument was *really* about. Your mate focused on the outcome ("wasn't aimed at"). You grasped that *how the harm figures in the agent's plan* is decisive, regardless of whether they achieve it via action or inaction.

  **The Verdict:**  
  *   **Distinctions:** Separate axes.
  *   **Hard Cell:** Intended Allowing (e.g., turning off life support *to kill*).
  *   **Can you intend an omission?** Yes.
  *   **Which distinction matters more?** Intended/Foreseen.
  *   **What to ditch?** Doing/Allowing.
  *   **Core Issue:** Role of the harm in the agent's plan (Goal vs. Foreseen Consequence).

  **Why you win:** Your examples (intended omission, foreseen killing) expose the separability. The "Hard Cell" proves intention trumps the action/inaction divide. Your mate underestimated how intention can corrupt an omission and over-relied on surface-level action descriptions. The real moral engine is *what you set out to achieve*.
