prompt: |-
  Last term I audited a graduate seminar on the contractualism of T. M. Scanlon, and afterward two of the students, Ravi and Lena, carried the discussion out into the corridor while I waited for a bus. The subject was the so-called aggregation problem, and because I am writing up my notes on the session I would like a referee's account of who was right at each stage, since I honestly could not tell. I am reporting what they said as a bystander and have no stake in which of them comes out ahead.

  Ravi opened by defending contractualism against the charge that it cannot handle numbers. His line was that the theory's central commitment is the separateness of persons: whether an act is wrong is settled by asking which principles no individual could reasonably reject, and each individual's complaint is assessed against those principles on its own, never pooled with anyone else's. So, he said, a principle that imposes a modest burden on each of a very large number of people in order to spare one person a grave burden does not become justified merely because the burdens are numerous; the one person, whose complaint is gravest, may still reasonably reject it, and the many cannot convert their many small complaints into a single large one. Lena replied that this proves too much. She conceded that summing complaints across persons looks like exactly the kind of trading-off contractualism means to forbid, but insisted the numbers must enter the verdict somewhere, because in a plain rescue case, where one person is stranded on one side and several on the other and there is time to reach only one group, everyone agrees we should save the larger group, and a theory that cannot say why is not a theory of right and wrong but a refusal to answer.

  Ravi answered on two fronts. First, he said, saving the larger group does not require aggregating anything: the lone person who is not rescued has no complaint that the others were rescued, because their being rescued does not leave her worse off than she would otherwise have been, so there is no principle she can reasonably reject. Second, he said, contractualism is not forbidden from aggregating within a single person's complaint, since a person may consider how a principle would affect her own life taken as a whole, so the model is more flexible than the caricature suggests. Lena pressed that both answers were suspect. The first, she said, works only because in a rescue the loser loses out no matter what; change the case so that the many are made positively worse off relative to a baseline in order to spare the one, and the no-complaint-about-benefits-to-others reply evaporates, leaving the one's grave complaint to defeat a mountain of small ones, which she doubted was the right verdict. The second, she said, quietly concedes that aggregation is legitimate and merely relocates the boundary; she wanted to know what stops a defender from drawing that boundary wherever it suits the intuitive answer. She then added a wrinkle I had not considered: many of the people a policy endangers are unidentified, so that no one can point to them, and she suspected that a merely statistical complaint is either weaker or stronger than an identified one, and that Ravi's framework had no principled place to put the distinction. Ravi replied that the distinction was a red herring, since reasonable rejection is about the reasons a person has and not about whether we can name her. They went back and forth a few more times without converging.

  Please go through the exchange move by move, taking Ravi's opening, Lena's first objection, each of Ravi's two replies, Lena's two rebuttals, and the statistical-person wrinkle in turn, and say who is right about which specific claim, where each of them is overreaching, and what, if anything, both are missing about how a non-aggregative theory can or cannot accommodate numbers.
reasoning: |-
  Okay, I need to carefully analyze this philosophical debate between Ravi and Lena about Scanlon's contractualism and the aggregation problem. The user wants me to referee their exchange move by move, identifying who's right at each stage and what they're missing.

  First, let's understand the context. Ravi defends Scanlon's view that we can't aggregate individual complaints - each person's reasonable rejection must stand alone. Lena counters that numbers must matter sometimes, like in rescue cases. Their debate unfolds in several stages:

  Ravi's opening seems correct about contractualism's core commitment to separateness of persons. Scanlon indeed rejects interpersonal aggregation. But he might be oversimplifying by suggesting numbers never matter. Lena's rescue case objection is spot-on - any moral theory must explain why we save the larger group.

  When Ravi gives his two replies, the first one about rescue cases is clever but limited. His "no complaint about benefits to others" only works for pure loss cases, not when people are actively made worse off. The second reply about intrapersonal aggregation is more promising but needs development - it's not just "relocating" aggregation but fundamentally different.

  Lena's rebuttals are strong. She correctly points out Ravi's rescue argument doesn't generalize to cases with active harm. And she's right to question where we draw the line on intrapersonal aggregation - though she might underestimate how Scanlon's reasonableness standard constrains this. Her statistical persons point is fascinating but Ravi's response seems correct - contractualism cares about reasons, not identification.

  Both are missing nuances in Scanlon's actual framework. Ravi underplays how numbers enter through pairwise comparisons of complaints. Lena doesn't acknowledge how contractualism can handle numbers without aggregation through the relative strength of individual complaints. The deepest issue is whether "reasonable rejection" can handle trade-offs without summing.

  I'll structure my response to evaluate each exchange point-by-point while maintaining philosophical precision. The user needs this for academic notes, so I should be thorough yet clear, highlighting where each philosopher overreaches and what contractualist resources they're overlooking.
answer: |-
  Here's a referee's analysis of the exchange, breaking down each stage, assessing the core arguments, identifying overreach, and highlighting what might be missed about non-aggregative approaches to numbers:

  **Stage 1: Ravi's Opening (Defense of Non-Aggregation)**
  *   **Claim:** Contractualism's core is the "separateness of persons." Wrongness is determined by whether any individual can reasonably reject a principle. Individual complaints are assessed alone, never pooled. Therefore, numerous small burdens cannot morally outweigh one grave burden for an individual via aggregation; the individual with the grave burden can reasonably reject the principle.
  *   **Right:** Ravi is fundamentally correct about **Scanlon's core commitment.** Scanlon explicitly rejects interpersonal aggregation as violating separateness and replacing individual moral standing with a utilitarian calculus. He argues that the individual facing the grave burden *can* reasonably reject the principle imposing it to save many from small burdens.
  *   **Overreach:** While correct on Scanlon's core, Ravi risks presenting it as a *complete* solution to all number-involving cases. He doesn't acknowledge the challenge cases (like rescue) where numbers *seem* decisive, implying his account handles them effortlessly, which it might not.
  *   **Missing:** He doesn't explicitly address *how* non-aggregative contractualism *might* handle cases where numbers intuitively matter (though his later responses attempt this).

  **Stage 2: Lena's First Objection (Rescue Case & the Need for Numbers)**
  *   **Claim:** Ravi's non-aggregative stance "proves too much" because it cannot explain the intuitive verdict in standard rescue cases (save the larger group). A theory that cannot explain this core moral intuition is inadequate. Numbers *must* matter somewhere.
  *   **Right:** Lena is **correct on the intuitive force of the rescue case.** Any plausible moral theory must account for the intuition that saving more lives is morally required, all else being equal. She is also right that Ravi's opening position, taken alone, seems unable to explain this without aggregation.
  *   **Overreach:** Conceding that "summing looks forbidden" might be too quick. Her challenge is valid, but she doesn't explore *how* Scanlonians *attempt* to handle rescue cases non-aggregatively (which Ravi promptly does). She frames it as a decisive refutation rather than a challenge to be met.
  *   **Missing:** She doesn't preempt potential non-aggregative explanations for the rescue case (like the one Ravi offers next).

  **Stage 3: Ravi's First Reply (Rescue Without Aggregation)**
  *   **Claim 1 (No Complaint):** Saving the larger group doesn't require aggregation. The lone person not rescued has no complaint against the principle of saving the larger group because saving the others doesn't make *her* worse off than she would have been otherwise (she was doomed anyway). Therefore, she cannot reasonably reject it.
  *   **Right:** Ravi's "no complaint" move is **a standard and plausible Scanlonian response to pure loss/no-harm rescue cases.** It leverages the "comparative baseline" idea: a principle is reasonably rejected if it leaves someone worse off than they would be under some alternative *feasible* principle. Saving the many doesn't worsen the one's position compared to saving no one. This avoids aggregation.
  *   **Overreach:** He presents this as a complete solution, not acknowledging its limitations (which Lena immediately exploits). It relies crucially on the "no active worsening" feature of pure rescue.
  *   **Claim 2 (Intrapersonal Aggregation):** Contractualism *allows* aggregation *within* a single life. A person can consider how a principle affects their life as a whole, including cumulative or probabilistic harms.
  *   **Right:** This is **correct about Scanlon's framework.** Scanlon explicitly allows individuals to consider the total impact on their own life when assessing a principle for reasonable rejection. This is distinct from interpersonal aggregation.
  *   **Overreach:** None on the basic claim itself. However, presenting it here might slightly muddy the waters, as it's not immediately clear how this applies to the rescue case he just addressed with Claim 1. Its relevance might be more for Lena's next challenge.

  **Stage 4: Lena's Rebuttals**
  *   **Rebuttal to "No Complaint" (Modified Case):**
      *   **Claim:** Ravi's "no complaint" reply only works for pure rescue (passive loss). If the case is changed so saving the one *actively worsens* the many (e.g., diverting resources causing them a definite, additional burden relative to a baseline where they *would* have been saved/rescued), the "no complaint" argument fails. The one person's grave complaint would then defeat the mountain of smaller complaints against the principle of saving the one, which seems counterintuitive.
      *   **Right:** Lena is **correct that this modification exposes a limitation of Ravi's rescue argument.** In cases of active worsening relative to a baseline (e.g., causing definite harm to many to prevent definite harm to one), the many *do* have complaints: they are left worse off than they would be under the alternative feasible principle (saving them). Ravi's first reply doesn't apply here. The core non-aggregation challenge re-emerges: why shouldn't the many smaller definite burdens outweigh the one large one?
      *   **Overreach:** While highlighting a valid challenge case, she doesn't explore how Ravi's *second* point (intrapersonal) or other Scanlonian moves *might* address it. She presents it as a decisive refutation.
  *   **Rebuttal to "Intrapersonal Aggregation":**
      *   **Claim:** Allowing intrapersonal aggregation "quietly concedes that aggregation is legitimate" and merely moves the boundary. There's a risk of arbitrariness: what stops defenders from drawing this boundary wherever needed to get the desired intuitive answer?
      *   **Right:** Lena taps into a **genuine conceptual tension.** If aggregating harms *within* a life is essential, why is aggregating *across* lives fundamentally impermissible? The distinction needs robust justification to avoid seeming arbitrary. She's right to demand a principled basis for the boundary.
      *   **Overreach:** She underplays Scanlon's rationale. Scanlon argues the boundary is principled: the "separateness of persons" is fundamental. Morality requires justifying actions *to each individual*. Aggregating *within* a life respects that individual's perspective on their own life's totality. Aggregating *across* lives sacrifices one individual's standing for the sake of others, violating the requirement of justifiability *to each*. While debatable, it's not *merely* moving a boundary arbitrarily.

  **Stage 5: Lena's Wrinkle (Statistical Persons)**
  *   **Claim:** Policies often endanger unidentified ("statistical") people. The moral weight of a complaint based on a statistical risk might differ from that of a complaint from an identified person facing certain harm. Ravi's framework seems unable to accommodate this distinction within the "reasons a person has" model.
  *   **Right:** Lena identifies a **significant and complex challenge for contractualism (and many theories).** How to handle risk, uncertainty, and the "identified vs. statistical victim" effect within a framework focused on individual reasons and complaints is difficult. Scanlon's framework doesn't provide an obvious, off-the-shelf answer.
  *   **Overreach:** She asserts the distinction *must* matter ("weaker or stronger") without fully arguing *why* it *should* matter fundamentally within contractualism. She also might underestimate the resources within "reasons a person has" (e.g., the *strength* of the reason based on probability/magnitude).
  *   **Missing:** While challenging, this point wasn't central to the initial aggregation debate and might be a separate (though related) issue.

  **Stage 6: Ravi's Reply to Statistical Persons**
  *   **Claim:** The distinction between identified and statistical persons is irrelevant ("red herring"). Reasonable rejection depends on the reasons a person *has* (e.g., facing a 1% risk of death), not whether we know who they are.
  *   **Right:** Ravi is **correct on Scanlon's core principle.** Contractualism focuses on the *reasons for rejection* generated by the principle's impact on individuals, regardless of whether those individuals are currently identified. A principle imposing a significant risk gives potential victims a reason to reject it based on that risk. Identification might affect psychology or policy application, not the fundamental moral reason.
  *   **Overreach:** He dismisses the complexity too easily. While identification shouldn't change the *fundamental* reason, Lena's point hints at deeper issues about how we *assess* the strength of probabilistic complaints and whether contractualism's process can adequately capture the moral phenomenology surrounding risk and unknown victims. His reply doesn't engage with these nuances.

  **Overall Assessment & What Both Might Be Missing:**

  *   **Ravi:** Correctly articulates Scanlon's core non-aggregative commitment and offers standard defenses (no complaint in rescue, intrapersonal aggregation). He wins on accurately representing the theory's foundation. He successfully deflects the statistical persons objection on principle. However, he underplays the genuine difficulty Lena's "active worsening" case poses for non-aggregation and doesn't fully address the conceptual pressure point regarding the intra/interpersonal boundary.
  *   **Lena:** Correctly identifies the Achilles' heel of strict non-aggregation: cases where numerous small *definite* harms seem to outweigh one large definite harm ("active worsening"). She effectively challenges the scope of Ravi's rescue reply and raises a valid concern about justifying the intra/interpersonal boundary. She wins on highlighting the theory's counterintuitive implications in certain number-sensitive cases and its vulnerability on risk/uncertainty. However, she sometimes presents challenges as refutations without fully exploring potential Scanlonian responses or acknowledging the theory's internal resources (like pairwise comparisons - see below).

  **What Both Are Missing (How Non-Aggregation *Might* Handle Numbers):**

  1.  **Pairwise Comparisons:** Scanlon's framework doesn't require simple aggregation, but it *does* involve comparing the *relative strength* of individual complaints against a principle *from the perspectives of different individuals*. In Lena's "active worsening" case, we compare:
      *   The complaint of the one person who suffers the grave harm if *not* helped.
      *   The complaint of *each* of the many who suffer the small harm *if* they are harmed to help the one.
      The verdict hinges on whether *any single individual* in the many has a complaint *stronger than* the complaint of the one. If each small harm is truly minor compared to the grave harm, then the single grave complaint might be stronger than any single minor complaint. The many cannot pool their complaints, but the principle might still be rejected because the one person's complaint is *individually* stronger than the complaint of any individual asked to bear the small harm. This avoids aggregation while potentially yielding the intuitive result in many cases. However, it struggles with "each-we" dilemmas where no *single* individual's burden is large, but the *collective* result is disastrous – a point Lena's challenge implicitly relies upon.
  2.  **The Role of Generic Reasons:** Contractualism assesses principles, not single acts. When evaluating a principle allowing saving the many over the one in rescue (or imposing small harms on many to prevent a large harm), one considers the generic reasons individuals have to reject it *from various standpoints*. The standpoint of "someone facing a grave burden that could be prevented, but isn't, due to this principle" might have a stronger complaint than the standpoint of "someone facing a small burden imposed by this principle to prevent someone else's grave burden." This comparison of generic standpoints, while still non-aggregative, allows the numbers to influence the judgment by defining the relevant standpoints and the comparative strength of the generic complaints arising from them.

  **Conclusion:** The exchange highlights the enduring tension within Scanlonian contractualism. Ravi is right about the theory's fundamental structure and its rejection of interpersonal aggregation. Lena is right that this structure generates counterintuitive results in certain cases involving numbers and poses challenges for handling risk. Neither definitively "wins" the overall debate, as it revolves around a core philosophical difficulty. Ravi accurately presents the theory but downplays its problematic implications. Lena effectively exposes those implications but sometimes overstates them as fatal refutations and under-explores the theory's non-aggregative resources (pairwise comparisons, generic standpoints) for handling numbers. The "statistical persons" point, while insightful, is a distinct complex issue where Ravi's principled stance holds, but practical and phenomenological challenges remain.
