prompt: |-
  I'm a graduate student who has been volunteered to open the discussion at a moral psychology reading group, and I've realized I don't have a firm enough grip on what we are even asking of a theory of moral worth. Before I defend any particular line, I want the specification written out in full. Take it that we are after an account of when an action is performed for the right reasons in the sense that earns the action a distinctive kind of moral credit — not merely the sense in which the action happens to be right, and not merely the sense in which the agent is a decent person. Give me the desiderata: what any adequate theory of that has to deliver, with the case or consideration behind each requirement.

  Here is what I want on the list, though I expect you to add to it and to tell me which items are genuine requirements rather than the prejudices of one camp. The cases: the honest shopkeeper who charges fair prices only because honesty is good for business, whom we want to say acts rightly but without moral worth, and where the theory must explain why the motive disqualifies rather than merely fails to add anything; the reluctant agent who does the right thing from a sense of duty while resenting every minute of it; the case of someone who acts against his own settled moral verdict — he believes he is doing wrong by helping a fugitive — but from a compassion that tracks the real moral reasons, and where many of us want to call the act morally worthy even though he is not acting from his conception of what is right; the overdetermined case, where duty and friendship both move the agent, so that the act would have been done for the right reason even had the other motive been absent; the case where the agent does the right thing under a description that is false (he helps because he takes the stranger for his brother, though what makes the help right is the stranger's need); and the moral analogue of a Gettier case, where the right-making feature is something the agent could not have known. The distinctions I take it the theory cannot collapse: between the moral worth of an action, the praiseworthiness of the person, and the rightness of the action; between acting for a reason and merely having one, and between doing so under one description and doing so under another; between credit for getting it right and credit for trying hard; and between the worth of the motive and the worth of the act.

  Beyond the cases, tell me which structural constraints the theory has to respect — for instance, that moral worth should attach to something within the agent's control, that it should not be hostage to the very luck the cases above turn on, that it should leave room for morally worthy action done without deliberation or self-conscious reasoning, and that it should not make moral worth unavailable to someone who does the right thing for the right reasons while believing, on balance, that the act is merely permissible rather than required. Then, and this is the part I most want: flag any subset of these requirements that you think cannot be jointly satisfied. My own suspicion is that the fault line runs between the demand that the agent act for the reason that is in fact the right-making one and the demand that moral worth not be a matter of luck, and I would like you to tell me whether that is the real pressure point or a red herring, and what each side of the current debate — the duty-driven Kantians, the motive-centred Humeans, the reasons-responsive accounts, and the knowledge-based accounts — has to give up in order to escape it. You can close with a short verdict on which single requirement eliminates the most candidates, but keep the weight on the criteria; I will do the scoring of particular authors myself.
reasoning: |-
  Okay, let me unpack this graduate student's request. They're preparing to lead a moral psychology discussion and need a comprehensive framework for evaluating theories of moral worth - specifically, when an action deserves moral credit for being done "for the right reasons." 

  The user has already identified several key cases and distinctions, which shows deep engagement with the literature. What they really need is systematic organization of these into testable criteria, plus identification of inherent tensions. The mention of "fault lines" suggests they suspect fundamental incompatibilities in the desiderata.

  First, I should categorize their input: 
  - The shopkeeper case demonstrates motive disqualification 
  - Reluctant duty shows worth surviving negative affect
  - Compassionate rebel highlights worth without moral conviction
  - Overdetermination requires motive isolation
  - Mistaken identity probes description-sensitivity 
  - Moral Gettier examines epistemic luck

  Their requested distinctions (action/person/rightness, acting/having reasons, etc.) are crucial for preventing category errors. The structural constraints about control, anti-luck, spontaneity, and permissible beliefs add necessary meta-requirements.

  The core tension they identify - between tracking actual moral reasons and avoiding luck - is indeed the central fault line. Kantians must relax their motive purity to handle the compassionate rebel, while Humeans struggle with the shopkeeper. Reasons-responsive accounts get strained by mistaken identity cases, and knowledge-based views falter on moral Gettier scenarios.

  For the verdict: the "actual right-making reason" requirement eliminates the most candidates because it creates the luck problem. But this requirement is precisely what makes moral worth distinct from mere right action or good character. The insoluble tension suggests we might need graded conceptions of moral worth rather than binary ones - though that's beyond the current request.

  The response should map all cases to explicit criteria, then show how the luck/reality tension forces tradeoffs between schools. Ending with the eliminative power of the actual-reason requirement gives the user a sharp tool for their discussion.
answer: |-
  Below is a systematic breakdown of desiderata for an adequate theory of moral worth, organized by cases, distinctions, structural constraints, and inherent tensions. I've expanded your list, flagged core requirements (★), and identified the central fault line you suspected.

  ---

  ### **I. Core Cases & Associated Desiderata**  
  *(What the theory must explain)*  

  1. **The Honest Shopkeeper**  
     - *Case*: Acts rightly (charges fair prices) but *only* for self-interest (good for business).  
     - **Requirement (★)** → *Motive Disqualification*: Explain why self-interested motives *negate* moral worth even when the act is right. The theory must show why moral worth requires motives that *respond to moral reasons*, not merely coincide with them.  

  2. **The Reluctant Agent**  
     - *Case*: Does the right thing from duty but with resentment (e.g., rescues someone while grumbling).  
     - **Requirement (★)** → *Affective Neutrality*: Establish that moral worth can exist despite negative emotions if the *primary motive* is morally appropriate (e.g., duty).  

  3. **The Compassionate Rebel**  
     - *Case*: Helps a fugitive against their own moral belief ("this is wrong") but from compassion that tracks the *actual* moral reason (e.g., preventing suffering).  
     - **Requirement (★)** → *Non-Cognitivist Accommodation*: Allow that moral worth can arise from motives tracking objective moral reasons *even when* the agent misidentifies those reasons.  

  4. **Overdetermined Action**  
     - *Case*: Acts for both duty and friendship (e.g., visits a sick friend from both care and obligation).  
     - **Requirement** → *Motive Isolation*: Show that moral worth obtains if the right moral reason *alone would suffice* to motivate the act (i.e., it is non-accidental that the right reason moved them).  

  5. **Mistaken Identity**  
     - *Case*: Helps a stranger thinking they’re their brother; the act is right due to the stranger’s need.  
     - **Requirement (★)** → *Description-Sensitivity*: Explain why acting under a *misleading description* (e.g., "my brother") may undermine moral worth if the agent is unresponsive to the *actual* right-making feature (e.g., need).  

  6. **Moral Gettier Case**  
     - *Case*: Acts for a reason that *happens* to be right-making but could not have been known (e.g., gives water to a thirsty person who is secretly poisoned, unaware water is an antidote).  
     - **Requirement (★)** → *Epistemic Constraint*: Moral worth must depend on the agent’s *accessible reasons*, not unknowable facts. Luck in outcome should not confer moral credit.  

  ---

  ### **II. Non-Collapsible Distinctions**  
  *(What the theory must preserve)*  

  - **Action vs. Person vs. Rightness (★)**  
    Moral worth of an act ≠ praiseworthiness of the agent (e.g., a vicious person might perform a morally worthy act) ≠ rightness of the act (the shopkeeper’s act is right but lacks worth).  
  - **Acting for a Reason vs. Merely Having One (★)**  
    The theory must distinguish motivation (e.g., the shopkeeper *acts for* profit) from mere coincidence (e.g., a sympathetic shopkeeper *has* profit as a reason but acts for fairness).  
  - **Credit for Correctness vs. Effort**  
    Moral worth rewards "getting it right" for the right reasons, not trying hard (e.g., a well-meaning bungler isn’t morally worthy).  
  - **Motive Worth vs. Act Worth**  
    The value of the motive must be separable from the value of the act (e.g., a good motive can’t redeem a wrong act).  

  ---

  ### **III. Structural Constraints**  
  *(Meta-requirements for the theory)*  

  1. **Anti-Luck Condition (★)**  
     Moral worth must not depend on factors beyond the agent’s control (e.g., the Moral Gettier case).  
  2. **Deliberative Neutrality**  
     Must allow for morally worthy acts without deliberation (e.g., spontaneous rescues).  
  3. **Permissibility Accommodation**  
     Moral worth should be possible for agents who believe an act is *merely permissible* (not obligatory) but do it for the right reasons.  
  4. **Control Requirement**  
     The elements conferring moral worth (motives/reasons) must be within the agent’s rational sphere.  

  ---

  ### **IV. The Central Tension: Your Suspicion is Correct**  
  **Fault Line**: The *Actual Reason Requirement* (moral worth demands responding to the *real* right-making feature) vs. the *Anti-Luck Requirement* (moral worth must be insensitive to epistemic/moral luck).  

  - **Why this is the pressure point**:  
    - To satisfy the Compassionate Rebel/Moral Gettier cases, the theory must prioritize the agent’s *actual reasons* (e.g., compassion tracks objective reasons; ignorance blocks credit).  
    - But this makes moral worth hostage to luck (e.g., whether the agent’s reason *happens* to track reality).  
    - Conversely, prioritizing the agent’s *subjective reasons* (e.g., "sincere conviction") fails the Shopkeeper case (sincere profit-seeking lacks worth).  

  ---

  ### **V. What Each School Must Sacrifice**  
  | **Theory**               | **To Satisfy Anti-Luck**                          | **To Satisfy Actual-Reason**                     |  
  |--------------------------|--------------------------------------------------|-------------------------------------------------|  
  | **Kantian (Duty-Driven)** | Must allow non-duty motives (e.g., compassion) to confer worth → weakens "duty as sole motive" dogma. | Must accept that agents can act for objective reasons *without* recognizing duty → undermines rationalist purity. |  
  | **Humean (Motive-Centered)** | Must exclude "good" motives that accidentally align with rightness (e.g., shopkeeper) → risks circularity (which motives count as "virtuous"?). | Must explain how motives track *objective reasons* → abandons subjectivism about moral reasons. |  
  | **Reasons-Responsive**   | Must deny worth in Moral Gettier cases → severs link between worth and external reasons. | Must explain why acting under *false descriptions* (Mistaken Identity) lacks worth → needs a robust account of reason-awareness. |  
  | **Knowledge-Based**      | Must reject worth in cases of ignorance (e.g., Compassionate Rebel) → over-intellectualizes moral response. | Struggles with spontaneous/deliberation-free worthy acts → requires tacit knowledge. |  

  ---

  ### **VI. The Most Eliminative Requirement**  
  **★ "Actual Right-Making Reason" Requirement**  
  This eliminates theories that:  
  - Reduce moral worth to good intentions (fails Shopkeeper)  
  - Prioritize subjective sincerity (fails Mistaken Identity)  
  - Ignore the agent’s responsiveness to objective morality (fails Compassionate Rebel)  

  *Why it’s decisive*: If a theory cannot ground worth in the agent’s connection to the *actual moral truth* (even if non-cognized), it collapses moral worth into praiseworthiness or rightness.  

  ---

  ### **Final Verdict**  
  Your suspicion is correct: the **Actual Reason vs. Anti-Luck** tension is the core fault line. No theory fully resolves it without sacrificing intuitive cases. The "Actual Right-Making Reason" requirement is the most discriminating criterion, but it exacerbates the luck problem. To use this framework in your reading group:  
  1. Map each theory onto the cases.  
  2. Note which desiderata it accepts/rejects.  
  3. Identify its "cost" in the tension matrix.  

  This reveals why moral worth remains contested: it demands a *non-lucky connection to moral reality* within the agent's psychology—a philosophically unstable ideal.
