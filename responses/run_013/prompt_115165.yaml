prompt: |-
  I write about ideas for a general audience, so I know just enough about Buddist ethics to get myself into trouble. I'm working on a piece about protest suicides and I keep circling back to Saigon in 1963 — Thích Quảng Đức sitting down at that intersection on June 11 and burning to death over the Diệm government's treatment of Buddhists, then several other monks doing the same thing over the following months, right up until the coup. I don't need the history, I've got the history. What I need is for you to run that episode through the fight in Buddhist ethics over whether the tradition is really a form of consequentialism.

  The consequentialist reading says the whole apparatus is a ledger: suffering weighed against suffering, karma as arithmetic, and that Mahayana move where a bodhisattva breaks a precept out of compassion as the proof that outcomes trump rules. The other side says no, karma is cetanā, it's what you intended, and the tradition is really about the state of the agent's mind — which means the arithmetic doesn't decide anything. Take those two and tell me what each says Quảng Đức was actually doing, and whether he should have done it. Was it a precept violation at all, or is the standard move — that he wasn't committing suicide, he was bearing witness — doing real work here?

  Then turn it around and tell me whether the case helps the consequentialist reading or hurts it. His act is usually credited with moving Kennedy, forcing Diệm to promise reforms, and the monks who followed him died much the same way for much murkier reasons. Judge those two cases by the same ledger and you get opposite answers; judge them by intention and you have to say something about what was going on in each man's head. Which reading survives that better? And where does the whole framework go quiet — is there anything about the third parties, the government, the journalists with cameras, the people it was meant to move, that neither reading has room for?

  No sources and no bibliography, I just want the argument, and I'd definately rather you tell me the theory doesn't reach than watch you force it. 650 words max, and give me the bottom line first: one sentence on whether the case makes the consequentialist reading stronger or weaker, then the analysis.
