answer: |-
  ### Bottom Line:  
  **The Quảng Đức case weakens the consequentialist reading of Buddhist ethics by highlighting intention's irreducible role and exposing consequentialism's inability to ethically distinguish his act from later, less effective immolations.**

  ### Analysis:

  **Consequentialist Reading:**  
  This view judges Quảng Đức's act solely by outcomes: his immense personal suffering is justified *if* it sufficiently reduced the greater suffering of persecuted Buddhists. His death galvanized global outrage, pressured the Kennedy administration, and forced Diệm’s regime to promise reforms (however short-lived). On this ledger, his sacrifice was karmically skillful – a bodhisattva breaking the precept against killing (including oneself) out of ultimate compassion. The horrific means were outweighed by the beneficial end. However, this logic condemns subsequent protest immolations under Diệm’s successors. These monks died similarly but achieved no clear political change; the consequentialist arithmetic would deem their acts futile, karmically unskillful, and unjustified precept violations. The *same act* gets opposite ethical judgments based purely on external results – a major instability for the theory.

  **Intention-Based Reading:**  
  This view focuses on *cetanā* (volition). Quảng Đức’s act wasn't "suicide" (*ātma-ghāta*, motivated by aversion, despair, or selfish escape) but *self-immolation as witness* – a radical act of compassion (*karuṇā*) and wisdom (*prajñā*). His meticulously planned, calm demeanor (meditating while burning) signaled a mind purified of self-grasping and hatred. The "bearing witness" framing is essential: his body became a truth-revealing offering, shocking the world’s conscience. Karmically, the weight lies entirely on this selfless, enlightened intention to alleviate others' suffering, regardless of immediate outcomes. Subsequent monks acting from the *same purified intention* – even if their deaths didn’t change policy – would be judged identically: profound acts of compassion. Their karmic merit is internal, rooted in mind-state, not external success. The precept against killing is contextually overridden by bodhisattva motivation, not outcome.

  **Which Reading Survives Better?**  
  The intention-based reading handles the distinction between Quảng Đức and later immolators more coherently. Consequentialism fractures, forced to approve one act and condemn near-identical others based on fluctuating political results beyond the agent's control. Intention provides a stable, internal criterion: the purity of compassionate volition. It explains why the tradition venerates Quảng Đức *as a bodhisattva*, focusing on his mental state, not just the political outcome.

  **Where the Frameworks Go Quiet:**  
  Neither reading adequately addresses the role of the *audience*:
  1.  **The Spectacle:** The act's power depended on journalists capturing and disseminating the horror. The ethical frameworks don't inherently account for how the act functioned as visceral communication for those *causing* the suffering (the regime, international backers).
  2.  **Interpretation & Misuse:** Both readings struggle with how the act was received. Did it inspire genuine compassion or merely political expediency in Kennedy? Did it inadvertently normalize self-destruction as protest? The *impact* on the minds of others – crucial to its effectiveness – is secondary in the intention view and reductively instrumental in the consequentialist view.
  3.  **The Body as Message:** The sheer, undeniable physicality of the protest – the body burning publicly – transcends both "outcome" and "intention" as abstract categories. It forced an immediate, visceral confrontation with suffering that neither ethical calculus fully captures. The frameworks analyze the agent's karma, but the act's meaning was forged in the shocked perception of witnesses.
