answer: |-
  Here is a systematic specification of desiderata for a theory of causation by omission, organized as requested. The focus is on criteria and their motivating cases, highlighting points of tension.

  **I. Cases the Theory Must Get Right (Non-Negotiable Core)**

  1.  **The Slipping Hand Case (Action/Omission Boundary):**
      *   **Case:** Safety system holds valve closed *only* while operator depresses switch; operator's hand slips, valve opens, harm follows.
      *   **Requirement:** The theory must clearly state whether the cause is the *slip* (action), the *failure to maintain pressure* (omission), or both. Crucially, it must provide a *principled basis* for this distinction grounded in the theory's core mechanics (e.g., event ontology, counterfactual structure, process physics).
      *   **Justification:** This is the paradigmatic case probing the action/omission divide. A theory collapsing this distinction fails a fundamental intuition. The basis for the distinction must be inherent to the causal framework, not an ad hoc addition.

  2.  **Redundant Clinicians (Overdetermination by Omission):**
      *   **Case:** Two clinicians (A and B), acting independently, each withhold a drug from a patient. Either drug alone would have saved the patient; neither withholding was but-for necessary for death.
      *   **Requirement:** The theory must deliver the result that *both* A's omission *and* B's omission caused the death (or provide a compelling reason why not, consistent with other desiderata). It must explain how causation works without but-for necessity in omission cases.
      *   **Justification:** This is the omission analogue of symmetric overdetermination (two assassins). Legal and moral intuition strongly holds both omissions responsible/causal. But-for theories fail catastrophically here, making this a key test.

  3.  **Duty to Rescue Bystanders (Causation vs. Responsibility):**
      *   **Case:** Two bystanders (C under a legal duty to rescue, D with no duty) identically fail to throw a life-preserver to a drowning victim. The victim dies.
      *   **Requirement:** The theory must either (a) hold that the *causal relation* between the omission and death is identical for C and D, differing only in responsibility/blame, *or* (b) provide a clear account of how the duty *makes* C's omission causal while D's is not. It cannot simply assert the latter; the duty must be integrated into the causal mechanism.
      *   **Justification:** Tests whether causation itself is normatively loaded or purely descriptive. Collapsing causation and responsibility is undesirable; but making causation *depend* on normativity is highly controversial and requires robust justification.

  4.  **The Silent Alarm (Pure Absence as Cause):**
      *   **Case:** A warning alarm fails to sound due to a power outage (or lack of installation). This failure causally contributes to harm (e.g., workers not evacuating).
      *   **Requirement:** The theory must accommodate the non-sounding of the alarm – a pure absence – as a cause of the harm.
      *   **Justification:** Represents the core challenge: causally efficacious absences. Any theory denying this result is likely inadequate for many practical contexts (engineering, law).

  5.  **Additional Critical Cases:**
      *   **Symmetric Omission Overdetermination (Generalization of Clinicians):** Multiple independent omissions, each sufficient, none necessary. *Requirement:* The theory must assign causal status to each sufficient omission.
      *   **Preemptive Omission:** Omission A (e.g., guard failing to patrol) would have sufficed to prevent harm, but Omission B (e.g., backup system failing) occurs first and *also* suffices. *Requirement:* The theory must identify B's omission as the cause, relegating A's omission to being preempted (non-causal).
      *   **Negative Condition as Background:** A lifeguard's absence from the beach is the normal state; a specific bystander's failure to rescue a swimmer occurs against this background. *Requirement:* The theory must distinguish why the bystander's omission (in the context) is causal for the drowning, while the lifeguard's permanent absence is mere background condition (or explain why it *is* causal).

  **II. Distinctions the Theory Must Not Collapse**

  1.  **Omitting vs. Acting:** The theory must provide a clear, non-arbitrary criterion distinguishing an *omission* (e.g., not pressing the button) from an *action* (e.g., pressing the 'off' button). (Motivated by Slipping Hand Case; Non-Negotiable).
  2.  **Causing vs. Merely Allowing:** The theory must distinguish between an omission that *causes* a new sequence of events (e.g., not watering a unique plant causing its death) and an omission that merely *allows* an existing causal process to proceed unimpeded (e.g., not putting out a fire already raging). (Motivated by prevention vs. 'standing back' intuitions; reflects commitments of some camps, particularly those emphasizing causal processes).
  3.  **Causation vs. Causal Explanation vs. Attributability/Blame:** The theory must distinguish the *causal relation* itself (e.g., the omission caused the death) from a *causal explanation* (invoking the omission explains why it happened) and from *attributability or blame* (it was *your fault* due to duty/violation). (Motivated by Duty to Rescue Case; Non-Negotiable to avoid conceptual confusion).
  4.  **Omission as Entity vs. Relational Description:** The theory must be clear whether it treats an omission as a distinct entity (e.g., an absence, negative event, fact) or fundamentally as a way of describing a relation (e.g., "the death counterfactually depends on the non-occurrence of X"). This has profound ontological implications. (Motivated by debate in metaphysics; reflects deep commitments of different camps).
  5.  **Singular vs. General Causal Claims:** The theory must handle both singular causal claims ("Not watering *this* plant *yesterday* caused *its* death") and general causal claims ("Failure to water causes plant death"). (Motivated by need for both specific applications and general laws/norms).
  6.  **The Baseline/Contrast Problem:** The theory must explicitly address *against what* an omission is defined. What is the default or expected alternative? (e.g., Not watering implies the omission of *watering*; but what defines *watering* as the relevant alternative to omission?) Crucially, it must specify whether this baseline is fixed descriptively (statistical norm, physical default) or normatively (duty, expectation, ideal). (Motivated by Slipping Hand, Silent Alarm, Background Condition cases; **Crucially Problematic**).

  **III. Results the Theory Must Remain Consistent With**

  1.  **Practical Treatment:** The theory must be consistent with the fact that legal systems (causation in torts, criminal omission liability) and medical practice/ethics (failure to diagnose/treat, withdrawal of care) treat certain omissions as causes. (Non-Negotiable for practical relevance).
  2.  **Context Sensitivity of Causal Status:** The theory must accommodate that the *very same absence* (e.g., the alarm not sounding) can be a cause in one explanatory context (e.g., why didn't the workers evacuate?) and a mere background condition in another (e.g., why did the fire spread so fast? - assuming the alarm system was known to be offline). (Motivated by explanatory practice; Non-Negotiable).
  3.  **Accommodate Prevention/Double Prevention:** The theory must coherently handle standard cases of prevention (omission stops a threat) and double prevention (omission removes an obstacle, allowing a threat to proceed), recognizing their causal efficacy. (Motivated by ubiquitous examples; Non-Negotiable).
  4.  **Preserve "Nothing from Nothing"? (Negotiable):** If the theory aims to preserve the intuition that "nothing comes from nothing," it must explain how causation by omission doesn't violate this principle. However, some theories (e.g., strong counterfactual dependence) may explicitly reject this intuition as misleading or inapplicable. (Reflects commitments of particular camps, e.g., process theorists vs. counterfactualists).

  **IV. Key Challenges & Points of Tension**

  1.  **The Requirement That Eliminates the Most Plausible Accounts:** **Handling Redundant Omission (Overdetermination) correctly.** But-for (counterfactual dependence) accounts, many process accounts, and some difference-making accounts are immediately ruled out or require significant, often ad hoc, modifications to accommodate cases like the Redundant Clinicians. This requirement forces theories away from simple necessity and towards sufficiency, disjunction, or fundamentally different causal structures.
  2.  **The Pair That Makes a Unified Theory Look Hopeless:** **The combination of (A) Handling Redundant Omission (Overdetermination) correctly** and **(B) Accommodating the Context Sensitivity of Causal Status driven by the Baseline/Contrast Problem.**
      *   **Why?** Requirement (A) pushes towards making causation depend on *objective sufficiency* or a non-counterfactual structure (e.g., physical disconnection in processes). Requirement (B) pushes towards making causation *relative to a chosen contrast/baseline*, which is often contextual and sometimes normative. Reconciling an objective, context-independent causal structure (needed for robust overdetermination) with the inherent context-relativity of omissions (what counts as *the* omission depends on the contrast) creates a profound tension. A theory satisfying (A) risks making causal status *too* objective and context-insensitive, failing (B). A theory satisfying (B) by deeply integrating baseline relativity risks making causal status in overdetermination cases subjective or context-dependent in a way that undermines the objective wrongness/causality intuitively present in cases like the redundant clinicians. This tension highlights the core difficulty in finding a *unified, objective, and contextually adequate* theory of omission causation.

  This specification provides the necessary groundwork, emphasizing the critical cases, essential distinctions, practical constraints, and the fundamental tensions (especially the Redundant Omission / Context Sensitivity clash) that any serious theory of causation by omission must confront. Good luck with your assessment!
