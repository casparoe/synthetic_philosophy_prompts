answer: |-
  ## Joint Statement on the Doing/Allowing Distinction in Moral Reasoning

  **Agreed Common Ground (Claims We Both Sign):**

  1.  **Empirical Reality:** Observably, people consistently *perceive* a moral difference between actively causing harm (doing) and failing to prevent harm (allowing/allowing to happen), even in cases with identical outcomes. This perception is widespread and robust across many cultures and contexts.
  2.  **Not Always Decisive:** The doing/allowing distinction, even if real, is not the *sole* or always the *primary* moral factor. Other considerations (intent, consequences, relationships, duties, rights, necessity, proportionality) frequently interact with it or override it. A justified "doing" (e.g., self-defence) can be permissible; a culpable "allowing" (e.g., neglecting a dependent) can be seriously wrong.
  3.  **Boring/Uncontroversial Cases:**
      *   **Clear Doing:** Actively pushing someone off a bridge to stop a trolley killing five is uncontroversially *doing* harm.
      *   **Clear Allowing:** Failing to donate all spare income to prevent distant starvation is uncontroversially *allowing* harm (though its *wrongness* is debated).
      *   **Irrelevant Omissions:** Failing to prevent harm where one has no capacity, knowledge, or duty (e.g., failing to stop an earthquake) is generally seen as morally neutral, neither a culpable allowing nor a doing.
  4.  **What Needs Explanation:** The persistent *intuition* and *argumentation* relying on the distinction demands explanation. Is it tracking a genuine moral feature (e.g., different causal roles, different normative demands), or is it a psychological heuristic/bi-product of other factors (e.g., focus on agency, counterfactual reasoning, emotional salience) that lacks independent moral weight?

  **Area of Disagreement:**

  *   **My Position (Pro-Distinction):** The doing/allowing distinction tracks a genuine, morally relevant difference in the structure of agency and causation. Actively intervening to *initiate* or *alter* a harmful sequence typically involves a different kind of responsibility and imposes a different normative burden than merely *failing to interrupt* an independently developing harmful sequence, even when the outcome is the same. This difference persists as a significant factor in moral assessment.
  *   **My Mate's Position (Anti-Distinction):** The perceived doing/allowing difference is largely a psychological illusion or heuristic, primarily serving to absolve agents of responsibility for omissions rather than reflecting a fundamental moral truth. What matters morally is the *foreseeable consequence* of an agent's *choice* (whether action *or* inaction) relative to their capabilities and duties, coupled with the *reason* for that choice. The distinction itself adds no independent moral weight beyond these factors and can obscure equivalent moral culpability.

  **Identified Cruxes:**

  1.  **Crux 1: The Role of Plan & Intention in Omissions**
      *   **Case:** A company designs a safety system for its machinery. *Option A:* They deliberately omit an expensive safety feature during the design phase, foreseeing it will likely lead to occasional worker injuries but calculating the cost savings outweigh compensation. *Option B:* They install the safety feature initially. Later, foreseeing the same injuries, they deliberately disable the active feature to save costs, leading to the same injuries.
      *   **Shared Question:** Is the moral culpability of the company significantly different between Option A (planned omission) and Option B (active disabling)?
      *   **Pro-Distinction Prediction:** Yes. Option B (active disabling) is a clearer "doing" – actively removing protection and making the situation worse. Option A (planned omission) is a culpable "allowing," but the directness and active initiation of harm in B makes it typically *worse*. The plan in A makes the omission deliberate, but it doesn't transform it into the same kind of act as B.
      *   **Anti-Distinction Prediction:** No significant difference. The key factors are identical: the company *chooses* a course leading to foreseeable harm for cost reasons, knowing safety is compromised. The *form* of the choice (design omission vs. active disablement) is morally irrelevant. The culpability stems from the deliberate choice for harm, not the mechanism. The "plan" in A *is* the relevant "action" equivalent to disabling.

  2.  **Crux 2: The Line in System Design & Reliance**
      *   **Case:** A government considers a new welfare benefit. *Option X:* They never implement the benefit, foreseeing that without it, some vulnerable people will suffer hardship they could prevent. *Option Y:* They implement the benefit, people rely on it. Later, foreseeing the same hardship, they actively cancel the benefit program.
      *   **Shared Question:** Is the moral difference between Option X (never enabling) and Option Y (cancelling an established program) adequately captured by the doing/allowing distinction, or is the reliance in Y the key factor?
      *   **Pro-Distinction Prediction:** The distinction *survives* but interacts with reliance. Option Y involves an *active doing* (taking away an established resource) causing direct harm by worsening people's position. Option X involves a (potentially culpable) *allowing* of harm by not improving their position. Reliance in Y *intensifies* the harm and wrongfulness, but the core difference in agency (taking away vs. not giving) remains relevant. The act of cancellation is a distinct kind of wrong.
      *   **Anti-Distinction Prediction:** The distinction *collapses*. The core moral issue in both is the *choice* not to provide aid foreseeably needed to prevent harm. The reliance in Y creates a stronger *duty* (due to legitimate expectations and harm caused by withdrawal) and makes the consequences *worse* (taking away what people have vs. never giving it), but it doesn't create a *fundamentally different category* of moral wrong ("doing" vs. "allowing"). The wrongfulness in both stems from the choice against providing necessary aid where able.

  **Verbal Dispute Clarification:**

  *   **The 'Causing' Issue:** Part of our disagreement is indeed verbal regarding the scope of "causing." You (Pro-Distinction) typically reserve "causing" for direct, active interventions initiating sequences. Your mate (Anti-Distinction) often uses "causing" more broadly to include cases where a deliberate omission is a necessary condition for a foreseeable harm, arguing that the choice *causes* the harm by allowing it to proceed. This difference in terminology reflects the deeper disagreement about whether omissions can be genuine causes in the morally relevant sense. We agree this is a verbal difference pointing to the underlying conceptual split.

  ---
  **This draft is presented for your review and refinement.** The goal is to fairly represent both positions and the agreed testing grounds for the core disagreement, providing a clear framework for your collaborative exploration.
