prompt: |-
  You are a philosopher of science who knows both the demarcation literature and its critics well. Think carefully, and open with a short brainstorm of the possible sources of an impasse in a debate like this one before you commit to a diagnosis.

  I am preparing a seminar on the demarcation problem and keep hitting the same wall. The debate seems to me stalled in a particular way: each proposed criterion — falsifiability, puzzle-solving within a paradigm, novel prediction by a research programme, a community's institutional norms — is refuted by a counterexample drawn from a different kind of case, and the counterexample is then treated as decisive. Falsificationists point to a doctrine that can absorb any observation; critics point to the historical sciences, to theories whose central commitments are shielded by auxiliary hypotheses, or to respectable programmes that make no risky predictions. Nobody moves.

  My hypothesis, which I want you to test rather than assume, is that the impasse is largely an artifact of three different jobs being run together under one heading: (1) sorting a finished body of work into science and non-science in a way that matches what competent practitioners would say; (2) supplying a procedure a non-expert — a court, a school board, a journalist — can apply to a live, contested claim; and (3) saying what a practice must do to be a good way of finding out about the world, even if the criterion condemns stretches of what we call science and matches no practitioner's classifications. Falsificationism, on this reading, is a poor answer to (1) and (2) and a substantive answer to (3); the classical counterexamples aim at (1); and the conclusion that the problem is a pseudo-problem follows only if (1) was the job all along.

  Assess this. For each major position and each standard objection, say which of the three jobs it is really addressing, and then diagnose the disagreement itself: is it substantive, is it about what a criterion is for, or are several parties answering different questions under one name? Close with what would count as progress — a distinction, a change of question, a formal result — or an argument that none should be expected. Engage the actual moves rather than surveying the field, and say where my three-way division itself papers over a real disagreement. No reading list; I want the diagnosis and the reasons for it.
reasoning: |-
  Hmm, the user is a philosopher of science preparing a seminar on the demarcation problem and has hit a wall. They're observing that debates around demarcation criteria like falsifiability or puzzle-solving seem stuck in a loop of counterexamples. Their hypothesis is that this impasse comes from conflating three distinct jobs: (1) retrospective classification of established science, (2) practical decision procedures for non-experts, and (3) normative epistemology about what makes inquiry reliable.

  I need to test this hypothesis by analyzing major positions and their counterexamples through this three-job lens. The user wants me to avoid survey-style responses and focus on diagnosing actual moves in the debate. They also want me to identify where their three-way distinction might oversimplify things.

  Looking at the key positions: Popper's falsifiability clearly aims at job (3) - it's about what makes science epistemically virtuous. But critics attack it using job (1) cases like historical sciences or shielded theories, which are classification concerns. Kuhn's paradigm-based approach seems primarily about job (1) - describing how scientific communities actually operate. Lakatos is more complex; his MSRP tries to bridge job (1) and (3) by evaluating research programmes normatively while respecting historical cases.

  The counterexamples reveal this confusion of purposes. When falsificationists dismiss psychoanalysis as unfalsifiable, they're mixing job (3) critique with job (1) classification. When critics point to Darwinian evolution's lack of risky predictions, they're using a job (1) exemplar to attack a job (3) criterion.

  The deepest disagreement might be between those who see demarcation as essentially descriptive (job 1) versus those who see it as normative (job 3). Job 2 is particularly problematic because it tries to turn philosophy into a procedural tool, which may be impossible without philosophical assumptions.

  Where the user's framework might oversimplify is in treating "finding out about the world" as unproblematic - but realists and anti-realists disagree fundamentally about what this means. There's also tension between the social dimensions of job 1 and the individual reasoning aspects of job 3.

  Progress would involve clearly separating these jobs and recognizing that no single criterion serves all purposes. We might need to accept that job 1 classification is inherently fuzzy and practice-based, while job 3 requires deeper epistemological commitments. Job 2 may be impossible to satisfy neutrally and should be abandoned as a philosophical goal.

  The user's hypothesis holds up well: the impasse does stem largely from running these different jobs together. By disentangling them, we can see why counterexamples feel decisive - they're often valid against one job but irrelevant to another. The seminar should emphasize that demarcation isn't one problem but several distinct questions requiring different approaches.
answer: |-
  Your hypothesis perceptively diagnoses the core structural flaw driving the impasse. The conflation of three distinct epistemic/social tasks under the single label "demarcation" explains why counterexamples feel decisive yet fail to resolve the debate: they exploit the criterion's weakness for *one* job while ignoring its potential strength for *another*. Here's the breakdown:

  **Diagnosis of Positions & Objections via the Three Jobs:**

  1.  **Popperian Falsificationism:**
      *   **Aimed Primarily At:** Job (3) - Normative Epistemology. Popper sought the *epistemic virtue* that makes science a rational, error-correcting enterprise, contrasting it with dogmatism. "Science" here is an idealized rational practice.
      *   **Standard Counterexamples Addressed to:**
          *   "Shielded Theories" (e.g., Marxian historical materialism, Freudian psychoanalysis - *as presented by critics*): Targets Job (1). Shows Popper fails to match practitioners' (or historians') classifications of what *was* considered science, even if flawed. Also implicitly targets Job (2) – it's impractical for a court to adjudicate auxiliary hypothesis adjustments.
          *   "Historical Sciences" (e.g., Darwinian evolution pre-modern synthesis, geology): Targets Job (1). Argues Popper's criterion misclassifies respectable, established scientific fields lacking specific Popperian predictions.
      *   **Why the Objection Sticks (for that job):** Because Popper often *presented* falsifiability as solving Job (1) and sometimes Job (2). Critics correctly show it fails *those* tasks decisively. The Job (3) defense ("Yes, but those *aren't* epistemically virtuous!") feels question-begging to opponents who see Job (1) as primary.

  2.  **Kuhnian Paradigms/Normal Science:**
      *   **Aimed Primarily At:** Job (1) - Descriptive Classification of Practice. Kuhn described how scientific communities *actually operate* and identify themselves. Demarcation is sociological/internal to the community ("puzzle-solving" within shared commitments).
      *   **Standard Counterexamples Addressed to:**
          *   "Lack of Normative Bite" (e.g., astrology could be a paradigm; paradigm shifts seem irrational): Targets Job (3). Argues Kuhn provides no way to distinguish *good* or *reliable* science from other puzzle-solving communities, only descriptive features of self-identified groups.
          *   "Inapplicability to Non-Experts" (e.g., How can a school board identify a paradigm?): Targets Job (2). Kuhn's criterion is useless for external bodies needing a decision rule.
      *   **Why the Objection Sticks (for that job):** Kuhn's framework *is* primarily descriptive (Job 1). Critics demanding normative force (Job 3) or procedural rules (Job 2) are imposing tasks Kuhn never intended it to solve, but which are often *expected* of a "demarcation criterion."

  3.  **Lakatosian MSRP (Progressive vs. Degenerating Programmes):**
      *   **Aimed At:** A *synthesis* of Job (1) and Job (3). MSRP tries to normatively evaluate programmes (Job 3 - heuristic progress as epistemic virtue) while respecting historical case studies (Job 1 - explaining why some programmes were rationally abandoned). Novel prediction is key.
      *   **Standard Counterexamples Addressed to:**
          *   "Respectable Programmes Without Risky Novel Predictions" (e.g., much of taxonomy, descriptive biology, some complex systems modeling): Targets Job (1). Argues Lakatos misclassifies established scientific work lacking his specific form of predictive novelty.
          *   "Judgment Calls on 'Progress'" (e.g., Was plate tectonics progressive *enough* early on? When does degeneration become decisive?): Targets Job (2) (too vague/context-dependent for non-experts) and implicitly Job (1)/Job(3) by highlighting the criterion's inherent subjectivity and difficulty in application even for historians/philosophers.
      *   **Why the Objection Sticks:** Lakatos tries to bridge the gap between normative ideals (Job 3) and historical description (Job 1). Counterexamples exploit the tension: programmes considered scientifically legitimate but lacking Lakatosian progress (Job 1 failure) *or* cases where applying the criterion requires intricate, contestable historical judgments (making it useless for Job 2 and problematic for clear Job 1 classification).

  **Diagnosis of the Disagreement:**

  1.  **Primarily About the *Purpose* of Demarcation:** This is the core driver. The substantive disagreements (e.g., realism vs. anti-realism, role of prediction, nature of rationality) exist *within* each job. However, the *impasse* arises because proponents advocate a criterion designed for *one* job, critics attack it with counterexamples relevant to a *different* job, and both sides often talk past each other by assuming demarcation *must* solve Job 1 *and* Job 3 simultaneously.
  2.  **Substantive Disagreement Lurking Beneath:** Your division brilliantly exposes the purpose clash, but it papers over a deeper *substantive* disagreement about **epistemic foundationalism** and the **nature of scientific rationality**. Those prioritizing Job (3) (Popper, Lakatosians) often seek universal, formal criteria of rationality/reliability. Those prioritizing Job (1) (Kuhnians, sociologists, Wittgensteinians like the later Laudan) see rationality/reliability as contextual, embedded in practices, and resist universal formalizations. They view the *demand* for a universal Job (3) criterion applied to Job (1) classification as itself flawed.
  3.  **Job (2) as the Impossible Dream:** This is where the conflation is most damaging. *All* proposed criteria fail miserably at Job (2). Expecting a simple, context-free, non-expert-applicable procedure to adjudicate "live, contested claims" ignores the inherent complexity, defeasibility, and expert-judgment required in scientific reasoning. This demand stems from a misunderstanding of science itself. Job (2) might be a *societal need*, but it's not a task philosophy of science can solve *without* incorporating sociological, ethical, and political dimensions far beyond epistemology.

  **What Counts as Progress?**

  1.  **Embracing the Distinction:** The primary progress is explicitly adopting your three-way distinction. This reframes the debate. Instead of "Is falsifiability the criterion?", the questions become:
      *   "What descriptive features reliably identify communities/practices *historically recognized* as scientific?" (Job 1 - sociological/historical inquiry).
      *   "What features make an inquiry practice *reliable* or *epistemically virtuous* for generating knowledge?" (Job 3 - normative epistemology, potentially pluralistic).
      *   "How can societal institutions best manage contested claims involving expertise, recognizing that no simple philosophical litmus test exists?" (A reframing of Job 2 into science policy/science communication/ethics).
  2.  **Accepting Different Answers for Different Jobs:** Progress means recognizing that:
      *   Job (1) might have a messy, cluster-concept answer (Wittgensteinian "family resemblances") or rely on institutional/social markers (peer review, methodology, community structure). Counterexamples here show the fuzziness, not the failure of the *task*.
      *   Job (3) will involve substantive, contestable philosophical arguments about evidence, explanation, confirmation, and the nature of knowledge. Counterexamples here are crucial for refining the normative theory. Falsifiability might be *an* important virtue, but likely not the *only* one. Novel prediction might be strong evidence, but not always necessary.
      *   Job (2) as traditionally conceived (a philosophical decision procedure) should likely be abandoned. Progress lies in developing robust frameworks for *expertise identification*, *science communication*, *managing dissent within science*, and *procedural fairness in policy* – recognizing these involve values beyond pure epistemology.
  3.  **Formal Results (Limited Scope):** Formal work (e.g., Bayesian confirmation theory, formal learning theory) can contribute significantly to clarifying concepts within Job (3) (e.g., what constitutes evidence, how confirmation works, what makes a prediction "novel" or "risky"). However, it cannot *resolve* the Job (1)/Job (3) split or provide a complete, uncontested Job (3) criterion alone, as it relies on formalizations that themselves make substantive assumptions.

  **Conclusion:**

  Your hypothesis is correct. The impasse is largely an artifact of conflating distinct tasks: describing scientific practice (Job 1), providing a decision procedure (Job 2), and defining epistemic virtue (Job 3). Counterexamples are decisive because they expose a criterion's weakness for the *job the critic assumes is primary*. The deepest substantive disagreement papered over by your (otherwise excellent) distinction is the foundational one concerning the nature of rationality and the possibility of universal epistemic norms (Job 3) versus contextual, practice-embedded rationality (Job 1). Progress requires abandoning the quest for a single criterion serving all three jobs, accepting different approaches for different purposes, and recognizing that the societal need behind Job (2) demands solutions far more complex than any philosophical demarcation criterion can provide. The "pseudo-problem" charge only holds if one insists that *only* Job (1) matters *or* that a single criterion *must* solve all three; your distinction shows we have three genuine, though distinct, problems.
