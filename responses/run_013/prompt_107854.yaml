prompt: |-
  I'm a phil-of-sci PhD student writing a chapter on mechanistic anomaly detection — the "the model's outputs look fine but the insides are doing something else" line of work — and I keep getting stuck on what "the same mechanism" is even supposed to mean. I dont want a definition, I want two worked cases that make the criteria come apart. Case 1: two systems that compute the same thing but whose internal causal structure differs, so that a structural criterion has to say "different mechanism". Case 2: two systems with the same causal structure — a sub-circuit transplanted or reused, say — that are doing different jobs, so a functional/role criterion has to say "different mechanism". Keep both small and concrete (a toy transformer and its fine-tune is plenty), and keep them as parallel as you can, so the only thing varying is which criterion you individuate by. No cheating: nothing hidden from the detector that it couldn't in principle see, no input distribution we can't sample, and no scheming-agent story — the story would do the work for you. For each case, tell me what the structural criterion says, what the role criterion says, which verdict the anomaly-detection argument actually needs, which single feature of the case is doing the work and what happens if you take it away, and how someone who thinks "same mechanism" just means "same causal structure" would come at case 1. The whole point is that in this literature "same mechanism" is threat-model-relative rather than explanatory, so make the cases earn that rather than just asserting it. British English please, and start straight in with case 1 — no preamble.
