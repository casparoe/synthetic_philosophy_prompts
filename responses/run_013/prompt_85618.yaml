prompt: |-
  I spent about eight years doing comms for a city government, and there's a pattern I kept running into that I've never found a good name for.

  Here's the shape of it. Somebody says something that isn't true — usually small and convenient, like that a contract went out to competitive bid, or that a report was reviewed by a lawyer when it wasn't. On its own that's just a lie and nobody needs a concept for it. The part I'm interested in is what happens next. The claim gets repeated in a press release, then it goes into a budget memo, then another department starts planning around it, then an outside vendor hires two people because of it. Six months later the original question — did the contract actually go out to bid? — has basically stopped being the issue. Nobody can correct it anymore, not because people still believe it but because correcting it would take down everything that got built on top of it. The person who said it first is now stuck feeding it, and the strange part is that the more it grows the cleaner and more coherent it looks next to the actual mess of what happened.

  Smaller version I watched once: a manager tells a lie to protect one employee, and over a year it hardens into the official story of the event; new hires get trained on it; the manager starts to half-believe it themselves, because the tidy version is easier to carry around than the true one.

  I dont think 'lie' or 'propaganda' or 'self-fulfilling prophecy' is what I'm after — with a self-fulfilling prophecy it's the belief that makes it come true, whereas here what makes it stick is that people build on it, not that they believe it. 'Sunk cost' and 'doubling down' feel closer but too thin.

  So: is there an established concept for the specific thing where a falsehood stops being answerable to the facts because it's been made load-bearing, and the liar ends up serving it? If so, which concept, and how exactly is it different from the near misses above? If there isnt one, name it and define it, and tell me where it stops applying — does a lie people keep repeating out of habit, with nothing built on top of it, count? At what point does it turn into a different phenomenon altogether? I'd rather you commit to an answer and defend it than lay out the options and leave me to pick.
reasoning: |-
  Okay, the user has described a fascinating phenomenon they observed during their eight years in city government communications. They're looking for a precise term to describe how a small falsehood becomes embedded in an organization's structure until it can't be corrected without causing systemic collapse. 

  First, I need to unpack their core frustration: existing terms like "lie" or "propaganda" feel inadequate because they miss the structural aspect. The key differentiators are: 1) the falsehood becomes foundational to subsequent actions, 2) correction becomes impossible due to dependency, not belief, and 3) the liar becomes trapped by their own creation. 

  Hmm... let me mentally scan relevant concepts. "Self-fulfilling prophecy" fails because belief isn't the driver. "Sunk cost fallacy" is adjacent but too narrow. "Institutional memory distortion" isn't quite right either. Wait—what about architectural metaphors? The "load-bearing lie" concept they mentioned feels intuitively right. 

  *Pauses to consider historical precedents* 
  The Enron scandal comes to mind—early accounting fictions that became structural necessities. Or urban legends that shape policy decisions. The manager example shows how utility (protecting an employee) breeds systemic dependence. 

  Crucially, this isn't about intentional deception persisting, but about structural entanglement. The threshold question: when does a repeated falsehood become this phenomenon? Only when three conditions align: 1) material consequences are built upon it, 2) correction would cause disproportionate damage, and 3) the falsehood develops functional utility beyond its truth value. 

  *Checks for boundary cases* 
  A lie repeated habitually without consequences? That's just a myth. One with minor dependencies? Not yet load-bearing. But when hiring decisions or budgets hinge on it—that's the tipping point. The moment the cost of truth exceeds the cost of maintenance, the lie becomes institutional infrastructure. 

  The user's "clean versus messy" observation is profound. The false narrative's efficiency actually becomes its armor—truth is often inconveniently complex. This explains why the manager half-believes their own lie: cognitive ease over factual fidelity. 

  *Refines definition* 
  "Structural Entanglement" captures the dependency aspect, while "Load-Bearing Lie" highlights the architectural peril. I'll propose both but emphasize the latter's vividness. The key is distinguishing it from similar concepts by stressing the concrete dependencies—not just beliefs or traditions, but active operational reliance. 

  User clearly values precision. They'd reject vague terms. Must emphasize the threshold test: no material dependencies? Then it's not this phenomenon. Also worth noting how this differs from "gaslighting"—here the system unintentionally colludes, there's no manipulative intent. 

  Final thought: This feels like what happens when game theory meets institutional decay. The Nash equilibrium becomes "maintain the fiction" because no actor can afford to defect.
answer: |-
  Based on your vivid description, I'll argue that the core phenomenon you observed is best named **Structural Entanglement**, with "**Load-Bearing Lie**" as its most precise and evocative conceptual anchor. This isn't a widely established term in social sciences (yet), but it perfectly encapsulates the mechanism you've identified and distinguishes it from near-misses.

  **Here's the full definition:**

  **Structural Entanglement / Load-Bearing Lie:** A falsehood that becomes irreversibly embedded within an organization or system because subsequent actions, decisions, investments, and narratives *structurally depend* on its assumed truth. Correction becomes impossible, not due to sustained belief or sunk costs alone, but because revealing the falsehood would necessitate the collapse or radical restructuring of systems built upon it. The original liar becomes trapped as a maintainer of the fiction, which often gains perceived coherence and utility exceeding the messy reality.

  ### Why "Structural Entanglement" and "Load-Bearing Lie" Fit Best
  1.  **Emphasis on Dependency:** "Structural" explicitly highlights that the falsehood has become part of the organizational *infrastructure*. It's not just repeated; it's foundational.
  2.  **Mechanism of Irreversibility:** "Entanglement" captures how the lie becomes woven into processes, budgets, contracts, staffing, and policies. Untangling it would require dismantling functional systems.
  3.  **"Load-Bearing" as the Key Differentiator:** This metaphor is crucial. It specifies *why* the lie can't be corrected:
      *   A **Self-Fulfilling Prophecy** becomes true *because* people believe and act on it (e.g., believing a bank is failing causes a run, making it fail). Here, belief isn't the primary driver; *structural dependency* is. People might suspect it's false, but the cost of dislodging it is too high.
      *   **Sunk Cost Fallacy/Doubling Down** focuses on the *investment already made* (time, money, ego). Structural Entanglement includes sunk costs but goes further: the lie is actively *supporting current and future operations* like a load-bearing wall holds up a building. Removing it doesn't just waste past effort; it collapses the present structure.
      *   **Propaganda** is deliberate, sustained dissemination of (often false) information to shape perception. Your phenomenon *can* involve propaganda-like repetition, but its persistence stems primarily from structural dependency, not ongoing persuasion efforts. The system *needs* it to stand.
      *   **Institutional Memory/Groupthink** describe how narratives solidify, but lack the critical element of active, functional dependency causing catastrophic failure if corrected.
  4.  **The Liar's Trap:** The "Load-Bearing Lie" framing explains why the originator becomes trapped. They aren't just protecting their initial lie; they are now maintaining critical infrastructure. Admitting the truth isn't just admitting deceit; it's admitting they caused systemic failure.
  5.  **Perceived Coherence:** The "cleaner than reality" observation is explained. The fiction, now serving as a structural foundation, *must* be maintained as consistent and functional. Reality is messy and contradictory; the Load-Bearing Lie, by necessity of its role, is streamlined and coherent.

  ### Boundaries: When Does It *Not* Apply?
  1.  **The Habitual Lie with No Dependencies:** A falsehood repeated out of habit or convenience, but upon which *no significant decisions, investments, or processes actively depend*, **does not** qualify. If correcting it merely requires saying "oops, we misspoke," it's just a persistent myth or error. The threshold is crossed when correction necessitates dismantling or fundamentally altering *built structures* (budgets, contracts, staffing, policies, legal justifications).
  2.  **The Lie with Minor Dependencies:** If only one minor memo or report relies on the falsehood, correction might be annoying but is feasible. It becomes Structural Entanglement when the dependencies are *multiple, significant, interconnected, and operational*. Think: "This lie is in our budget justification, our vendor contract terms, our staffing plan, and our annual report to the state."
  3.  **When Belief Truly Persists:** If people *genuinely, actively still believe* the core falsehood despite evidence, and *that belief* is the primary barrier to correction (not the fear of collapsing dependent structures), it's closer to **dogma**, **ideology**, or simple **denial**. Structural Entanglement persists *even when key actors privately doubt it* because the functional cost of correction is too high.
  4.  **The Point of Transformation:** A Load-Bearing Lie turns into a different phenomenon when:
      *   **It's Discovered & Collapses:** It becomes a **scandal** or **systemic failure**.
      *   **The Structure Adapts & Renders it Irrelevant:** If new systems are built that no longer depend on the lie, it might revert to being just a persistent myth.
      *   **It Becomes Purely Ceremonial:** If the structures built on it are abandoned but the lie persists as a harmless ritual or tradition, it loses its "load-bearing" status.

  ### In Summary
  You witnessed **Structural Entanglement**, where a falsehood evolves into a **Load-Bearing Lie**. Its defining feature is that the falsehood has become a *functional* component of an operational system. Correction is impossible not because people believe it, or because of sunk costs, or due to propaganda, but because *admitting the truth would cause the collapse of structures actively depending on the lie's existence*. The liar becomes the lie's custodian, and the fiction often appears *more* rational than the complex reality it replaced. It applies only when the lie is genuinely "load-bearing" – when its removal would cause structural failure, not just embarrassment or wasted past effort. The habitual, dependency-free lie is simply a lie; the Load-Bearing Lie is an integral, albeit rotten, pillar holding up the building.
