prompt: |-
  ok so I'm putting together a handout for the first meeting of a grad seminar on knowledge, and I want to do it backwards from usual — before anyone gets to defend a theory, I want the spec nailed down. So write me the desiderata: what does any theory of knowledge have to deliver before it counts as adequate? Not a survey of the field — the actual requirments, each one with the case or consideration that forces it.

  And I don't want just the four or five that everyone already knows. I want the list to bite. Some things I'd like on the table:

  - the Gettier-style cases, sure, but also the fact that they can be manufactured by the thousand — you can write a little program that takes a true belief and swaps the good grounds for lucky ones, so a theory that needs a separate patch per case is already in trouble
  - cases where the only thing going for the belief is a base rate. A guy sues a bus company because their buses are 80% of the buses on that route, and everyone agrees he doesn't *know* it was their bus, even though 80% is a strong ground. Whatever the theory says, it has to say something about that, and I suspect its the requirement that kills the most contenders
  - the fact that we ascribe knowledge to things that don't obviously have beliefs at all — a dog knows where the food is, a lab "knows" the results are bad, a trained classifier knows there's a cat in the picture. Does the theory have to cover them, or is it allowed to say knowledge is a human thing? Either answer is fine, but it has to be a principled one
  - the fact that "knows" does work for us: we let people act on what they know, we hold them to it, we stop asking once someone knows. A theory that ignores what the word is for is probably describing a different word
  - and the awkward one — does it have to match what ordinary people say when you actually run the vignettes on them? Because if yes, and the answers come out inconsistent, or vary by culture, or flip depending on how the question is worded, then "get the cases right" is itself in trouble as a requirement, and I want you to say so if it is.

  For each requirement give me the case or consideration behind it, and one line on why it's a requirement rather than a preference of one camp. Then flag which are negotiable and which aren't, and — this is the part I actually want — any pair or triple you think can't be satisfied together, with the reason. And tell me which single requirement does the most excluding work.

  If it helps to end with a few lines on how the usual families (grounding-and-defeaters style, reliabilist, virtue-theoretic, knowledge-first) fare against the list, fine, but keep it short — the list is the deliverable, I'll do the arguing in class.
reasoning: |-
  Okay, the user is putting together a handout for a grad seminar on epistemology, specifically about theories of knowledge. They want a list of desiderata—requirements that any theory must meet to be considered adequate—beyond the standard ones. They've provided several specific concerns: Gettier cases and their generative nature, base rate issues, non-human knowledge ascriptions, the functional role of 'knows', and empirical data on ordinary usage.

  First, I need to parse each of their points. The user emphasizes that Gettier cases aren't just individual counterexamples but can be systematically generated. This points to needing a structural solution rather than ad-hoc patches. The base rate example (80% bus company) highlights probabilistic justification without knowledge, which might challenge theories that equate high probability with knowledge. 

  The non-human knowledge point is interesting. The user questions whether theories must account for animal or AI knowledge or if they can limit scope to humans. Either answer requires justification. The functional role of 'knowledge' in practical reasoning (acting, deferring) suggests that any theory must explain its normative force. 

  The empirical data on ordinary usage introduces potential conflicts. If people's intuitions vary culturally or are context-sensitive, a theory might need to accommodate this variability or explain it away. The user specifically wants to know if satisfying all desiderata simultaneously is possible and which requirement is most exclusionary.

  I'll start by listing the core requirements. Desideratum 1 should address the Gettier problem structurally, emphasizing immunity to mass production. The base rate issue (Desideratum 2) needs to explain why statistical justification alone isn't sufficient. Desideratum 3 should clarify the scope: must the theory cover non-human cases? If not, why? Desideratum 4 ties knowledge to its functional role in social practices. Desideratum 5 grapples with empirical adequacy—must the theory match folk intuitions, even if inconsistent?

  Next, negotiating trade-offs. The user wants to know which pairs conflict. For example, demanding both structural Gettier immunity (D1) and functional role (D4) might clash if a theory's solution to D1 makes knowledge too elusive for practical use. Similarly, scope (D3) and empirical data (D5) could conflict if folk ascribe knowledge to animals but the theory restricts it to humans.

  The most exclusionary requirement is likely D2 (base rates), as many theories (e.g., reliabilism, justification-based) struggle to explain why high probability isn't sufficient without additional conditions. D1 is also tough but somewhat addressed by existing approaches like virtue epistemology or safety conditions.

  Finally, I'll briefly map how major theories fare. Grounding-and-defeaters might handle D1 with no false lemmas but fail D2 if base rates count as grounds. Reliabilism could satisfy D1 with a safety condition but falter on D2 if 80% reliability is deemed sufficient. Virtue theory handles D1 well via competent manifestation but may struggle with D2 unless skills override base rates. Knowledge-first (e.g., Williamson) prioritizes D4 but might have tension with D5 if folk intuitions vary. All theories face challenges with D3 (scope) and D5 (empirical consistency).

  The user's deeper need is to equip students with critical tools to evaluate theories rigorously, moving beyond textbook summaries. They want the desiderata to "bite," exposing weaknesses and forcing nuanced debates. Highlighting conflicts (e.g., between structural anti-luck and functional utility) will stimulate deeper discussion in the seminar.
answer: |-
  Here’s a distilled list of **core desiderata for any theory of knowledge**, designed to "bite" by exposing foundational tensions. Each includes the motivating case, rationale for non-negotiability, and conflict flags. Requirements marked **✱** are non-negotiable for any theory claiming broad adequacy.

  ---

  ### **The Desiderata**
  1. **✱ Structural Anti-Luck (Gettier-Proofing)**  
     **Case:** A security system (e.g., AI) *correctly* identifies an intruder but only because a random glitch canceled its *false* initial judgment. Mass-produced variants (e.g., "lucky defuser" cases) show ad-hoc fixes fail.  
     **Why requirement?** Theories must explain why *accidentally true* beliefs aren’t knowledge, without case-by-case exceptions.  
     **Negotiable?** No — Gettier-susceptibility is fatal.

  2. **✱ Non-Statistical Sufficiency (Base Rate Block)**  
     **Case:** A pedestrian sees a bus injure someone. 80% of buses on the route are from Company X, but no other evidence identifies it. Belief "It was Company X’s bus" (true) is justified but *not knowledge*.  
     **Why requirement?** Shows probabilistic justification ≠ knowledge. Kills theories equating high probability with knowledge (e.g., crude Bayesianism).  
     **Negotiable?** No — statistical justification alone is insufficient.

  3. **Scope Coherence (Non-Human Ascription)**  
     **Case:** A dog finds food via smell; a lab instrument flags contaminated samples via sensors; an AI classifier identifies tumors. We say they "know" *if reliable*.  
     **Why requirement?** Theories must either explain knowledge ascriptions in non-doxastic agents (e.g., via reliability) OR justify restricting "knowledge" to believers with conceptual capacities.  
     **Negotiable?** Yes — but the *choice must be principled* (e.g., "knowledge requires concepts" vs. "reliable indication suffices").

  4. **✱ Practical Nexus (Functional Role)**  
     **Case:** We let surgeons operate if they *know* the procedure; juries convict if they *know* guilt; we stop investigating once knowledge is attained.  
     **Why requirement?** Knowledge terminates inquiry and licenses action. A theory ignoring this misdescribes the concept’s social function.  
     **Negotiable?** No — divorcing knowledge from its role renders it inert.

  5. **Empirical Accountability (Ordinary Usage)**  
     **Case:** Surveys show "know" ascriptions shift with context (e.g., stakes), culture (e.g., individualist vs. collectivist), or phrasing ("really knows" vs. "knows"). People deny knowledge in 80% base-rate cases but accept it in structurally identical "lottery" cases.  
     **Why requirement?** If the theory aims to capture *our concept*, it must engage with actual usage — even if messy.  
     **Negotiable?** Partially — but dismissing all empirical variance is dogmatic.

  ---

  ### **Key Conflicts & Trade-offs**
  - **D1 + D2 vs. Simplicity:** Satisfying *both* anti-luck (D1) and non-statistical sufficiency (D2) often requires complex machinery (e.g., sensitivity/safety conditions, virtue constraints) that strains functional role (D4).  
  - **D3 + D5:** If ordinary usage (D5) ascribes "knowledge" to dogs/AI but the theory restricts scope (D3), it must explain why folk usage is *misleading* — risking disconnect from D4.  
  - **D1 + D5:** Mass-produced Gettier cases (D1) are uniformly rejected as non-knowledge by philosophers, but empirical studies (D5) show laypeople *sometimes* ascribe knowledge in luck-laden cases.  

  **Most exclusionary desideratum: D2 (Base Rate Block).** It eliminates:  
  - Pure reliabilism (if 80% reliability suffices)  
  - Justificationist views equating statistical evidence with justification  
  - "Knowledge-first" approaches that lack resources to explain *why* base rates fail  

  ---

  ### **How Major Families Fare (Briefly)**  
  | **Theory**          | **D1 (Anti-Luck)** | **D2 (Base Rates)** | **D3 (Scope)**       | **D4 (Function)**    | **D5 (Empirical)** |  
  |----------------------|-------------------|---------------------|----------------------|----------------------|-------------------|  
  | **Grounding/Defeaters** | ✅ (No false lemmas) | ❌ (Base rates may count as grounds) | ❌ (Restricts to believers) | ✅ (Justification licenses action) | ⚠️ (Varies) |  
  | **Reliabilism**      | ⚠️ (Needs safety condition) | ❌ (80% reliability may suffice) | ✅ (Applies to non-humans) | ⚠️ (Reliability ≠ action license) | ⚠️ (Mixed fit) |  
  | **Virtue Epistemology** | ✅ (Competent manifestation) | ✅ (Skills > base rates) | ⚠️ (Skills in humans only?) | ✅ (Knowledge = achievement) | ❌ (Ignores stakes-sensitivity) |  
  | **Knowledge-First**  | ❌ (Primitive, luck unaddressed) | ✅ (Knowledge ≠ justification) | ❌ (Human-centric) | ✅ (Core to normativity) | ⚠️ (Folk intuitions ≠ "knowledge") |  

  ---

  ### **Summary for Handout**  
  A theory of knowledge must:  
  1. **Block mass-produced Gettier cases** (not just known examples).  
  2. **Explain why statistical evidence (e.g., 80% base rate) fails** even when true.  
  3. **Take a stance on non-human "knowledge"** — with principled scope limits *or* expansion.  
  4. **Ground knowledge’s role in stopping inquiry and licensing action**.  
  5. **Engage empirical data on ordinary use** — even if to explain deviations.  

  **The tension:** D2 (base rates) is the hardest nut to crack, while D1+D4 together demand anti-luck conditions that don’t make knowledge too elusive for practical use. **The bottom line:** If a theory can satisfy D1, D2, and D4 coherently, it’s a contender; if it dodges D2 or D4, it’s likely inadequate. Use this list to stress-test *every* proposal.
