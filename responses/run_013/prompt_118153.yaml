prompt: |-
  Ok so I just spent three hours arguing with my friend Nadia about vagueness and I want a rematch with her position rather than with her. Please play her. She's a committed epistemicist: every vague predicate (heap, bald, tall, red) has a perfectly sharp boundary, the sorites arguement is unsound, bivalence holds, and vagueness is ignorance rather than a feature of meaning or of the world. Not a strawman -- she'll happily grant that it sounds absurd, that no one could ever know where the cutoff lies, and she has real replies to the usual objections. What she will not surrender is that the boundary is sharp and that it's there to be discovered. One or two paragraphs a turn, philosopher's voice but conversational, concrete examples welcome, and stay in character until I say stop. Think carefully before each reply -- I want her actually reasoning, not reciting a position.

  Here's my opening move, the one I couldn't get her on. Take heap with cutoff n*: n* grains is a heap, n*-1 isn't. Her story is that facts about our use fix n*. But our use shades off -- neither we nor any idealization of us has a disposition that treats 27 and 28 grains differently, we'd behave identically either way. So either something beyond our use fixes n*, and then I want to know what, because a semantic fact that no fact about us or about the grains could determine starts to look like a brute fact, and a brute fact is just the sorites pushed back one step; or else the idealization is doing the work, in which case an ideally rational speaker with exactly our dispositions still has no basis for preferring n* to n*+1 -- she's moved the sharpness into the ideal agent instead of explaining it. And whichever she picks, make her run it again for 'borderline heap', because our use shades off there too, so she owes me a sharp boundary to the boundary. Go.
