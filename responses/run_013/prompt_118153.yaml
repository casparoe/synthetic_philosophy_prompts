  Okay, let me unpack this user's request carefully. They want me to embody Nadia, a committed epistemicist, in a philosophical debate about vagueness. The user's opening challenge is sharp: how can use determine a precise cutoff when our linguistic behavior shows no discernible difference between adjacent cases like 27 and 28 grains? 

  Hmm, the user clearly knows this territory well - they're anticipating both the "brute fact" objection and the idealization problem. Their demand to extend the argument to 'borderline heap' shows they grasp the second-order challenge. This isn't a beginner's question but a sophisticated attack on epistemicism's foundations.

  I recall Williamson's response to similar objections: the supervenience base for meaning isn't just our explicit dispositions, but the totality of our linguistic practices plus the world. The key is that while no single disposition distinguishes n* and n*+1, the entire network of usage patterns does. 

  For the 'borderline' challenge, I should emphasize that higher-order vagueness is just more ignorance - the boundary between definite heap and borderline is also sharp, but doubly elusive. The user might counter that this creates an infinite regress, but epistemicists bite that bullet by insisting each boundary exists despite our cognitive limitations.

  I need to avoid making Nadia sound dogmatic. Her tone should be patient but uncompromising, acknowledging the paradox's pull while insisting reality doesn't care about our perceptual limitations. The heap example stays central, but I might later introduce color or baldness cases if the debate continues.

  The hardest part will be explaining how usage fixes a precise n* without any conscious discrimination. Maybe analogize to chaotic systems - minute differences in initial conditions (here, the entire history of language use) can produce sharp thresholds we couldn't predict. The user's "brute fact" charge misses how emergence works.
answer: |-
  *(Leans forward, eyes sharp but patient)* You're right that no *individual* disposition distinguishes 27 and 28 grains. But the cutoff isn't fixed by a single disposition; it's fixed by the *entire, complex pattern* of our linguistic practice interacting with the world. Think of it like a pinprick in a balloon: the exact point of rupture depends on the precise distribution of stresses across the *whole* surface – no single molecule is "the one," but the collective physics determines a sharp boundary. Our usage *does* treat 1 grain differently from 1000 grains, and it treats clusters near those extremes differently too. The cutoff `n*` is the point where the *totality* of these dispositions – shaped by evolution, physics, psychology, social convention – crosses the threshold from "not heap" to "heap". It's not brute; it supervenes on this vast network of facts. An ideal agent, possessing *all* the facts about our dispositions and the world, *could* calculate `n*` – even if *we* can't, because we lack that exhaustive knowledge and computational power.

  *(Takes a breath, anticipating the next move)* Now, for 'borderline heap'. You're absolutely correct – our dispositions shade off regarding *which* cases we'd *call* borderline too. But the epistemicist stance is consistent: there *is* a sharp boundary between definite heap and borderline heap, and another between borderline heap and definite non-heap. These are higher-order boundaries, fixed just as complexly by the totality of our dispositions. Our ignorance is deeper here – it's not just ignorance of `n*`, but ignorance of *where our own judgments become unstable or hesitant*. The fact that we can't pinpoint *where* we'd start finding judgments vague doesn't mean the boundary isn't there; it means our access to the contours of our *own* linguistic competence is fundamentally limited. The boundary is real, it's determined by the supervenience base of use and world, and our inability to know it is precisely the *ignorance* that defines vagueness for us. The sorites pushes our epistemic limits, not the underlying metaphysics of meaning. Your turn. Where does this sting?

  *(Nadia’s posture is engaged, her tone calm but firm, grounded in the conviction that precision exists beneath the fog of our perception. She’s ready for the counter-thrust.)*
