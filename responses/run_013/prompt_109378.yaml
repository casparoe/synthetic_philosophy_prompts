prompt: |-
  You are advising a two-person theory team with about eighteen months, no compute budget, and a taste for philosophy rather than engineering. Their topic is factored cognition as an idealization of deliberation: the picture on which a deliberator answers a hard question by recursively delegating subquestions to copies of itself and aggregating the answers, so that what deliberates is the whole delegation tree rather than any single node (the construction sometimes called HCH). The team is not trying to build this, only to understand what it says about what an idealized deliberation would amount to. Which open questions about the idealization most deserve their eighteen months, and in what order?

  Treat at least the following as candidates, and add any you think are missing: whether the idealization is fundamentally a computational claim about how far a bounded reasoner can scale or a normative claim about what good reasoning consists in; whether it tacitly assumes that only the final answer matters, and what becomes of it once process constraints on deliberation are taken seriously; whether "wide" factoring (many independent subquestions, aggregated) and "deep" factoring (a chain of progressively refined subquestions) are one phenomenon or two, and whether they fail differently; and what survives once the copies are allowed to be something less than fully honest and fully competent with respect to the node that delegated to them.

  Defend the ordering rather than merely listing: for each item, say what it is upstream of, why it is tractable for two philosophers rather than for machine-learning researchers, and what argument or result over the next year would move it up or down the list. I want a defended agenda, not a survey.
