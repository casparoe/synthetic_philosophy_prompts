prompt: |-
  I host a small podcast on decision theory and epistemology — mostly an excuse to talk at length with people whose work I have been arguing with in comment threads for a decade — and next month's guest is a philosopher who has spent her career trying to retire the Dutch book argument for probabilism. Her position, as I reconstruct it, has three planks. First, that the synchronic Dutch book theorem is at bottom a theorem about the consistency of a preference ordering over acts: anyone who has already accepted expected-utility theory learns nothing from it, and anyone who hasn't is being handed an argument that quietly assumes what it set out to prove. Second, that the diachronic versions of the argument — the ones meant to force conditionalization, or a principle of reflection — are invalid, because they require a bookie whose strategy is fixed in advance in order to exploit a foreseeable lapse of rationality, and an agent who has been told the strategy has thereby acquired evidence that ought to move the very credences the strategy is designed to punish. Third, that the criterion we should put in its place is what she calls adversarial robustness: your credences are acceptable just in case no rational and equally well-informed adversary can assemble a set of bets you would accept that guarantees you a loss. I have been reading rationalist blogs since well before the Sequences were finished, and I have lost more hours than I care to admit to forum threads in which somebody declares that a view is Dutch-bookable as though that ended the discussion, so I am broadly on her side, but I do not think I understand her position well enough to push on it.

  What I want from you is nine to eleven interview questions, in the order I should actually ask them, that force her to defend each plank instead of restating it, plus for each question one or two conditional follow-ups keyed to the answer she is most likely to give — if she says the information asymmetry is doing no work, ask X; if she concedes the point, ask Y. I want the questions to press where the technical pressure is genuinely highest, so please make sure the set covers the following: whether her first plank leaves her with any argument for probabilism that is neither question-begging nor merely prudential, and whether she accepts that consequence; the gap between being exploitable and being irrational, including what her view says about an agent who simply refuses all bets, or who is risk-averse about stakes, or who is indifferent to money; the objection that the guaranteed loss attaches to the whole package of bets rather than to any single bet she would individually reject, and whether her criterion can even be stated without assuming the package principle; why the deliberative move in her second plank does not prove too much, since if learning the bookie's strategy legitimately shifts your credences, it seems to immunize you against synchronic Dutch books as well — if it does not, I want the question that makes her say what distinguishes the two cases; whether adversarial robustness is weaker than probabilism, taking as a test case an agent whose credences are only finitely additive, the kind who can assign probability one to each of infinitely many mutually exclusive possibilities so long as nothing forces those to sum to one; whether the clause requiring the adversary to be equally well informed collapses her criterion into the reasoning behind no-trade results in economics, where the asymmetry of information rather than any defect in the agent is what generates the sure loss; and whether the adversary can be the agent herself at a later time, since in that case the asymmetry disappears and the argument's force returns. Close with a question about what evidence or proof would actually make her abandon the adversarial robustness criterion, and one about what she takes the practical upshot to be for how people in my audience talk about well-calibrated systems.

  Please keep each question short enough to say aloud and do not ask her to reproduce a proof — a sketch is fine, and she can always expand. Do not ask her for reading recommendations, paper titles, or where in the literature a point was first made; this is a conversation, not a syllabus, and I have read her work. Nothing about how she came to philosophy, and nothing that lets her answer by defining her own terms a fourth time.
reasoning: |-
  Okay, let me tackle this complex podcast interview question request. The user is preparing for an interview with a philosopher who critiques Dutch book arguments for probabilism, and needs pointed questions that challenge her three main positions without letting her simply restate them.

  First, I need to understand the core of her position: she rejects Dutch book arguments by claiming they're circular (plank 1), vulnerable to evidence changes (plank 2), and proposes adversarial robustness as alternative (plank 3). The user wants questions that press on technical weaknesses they've identified.

  For plank 1, the key pressure point is whether this leaves any non-circular argument for probabilism. I'll craft a question forcing her to address if she's abandoning normative foundations or embracing purely prudential arguments. The follow-up should corner her on whether rationality requires coherence at all.

  On plank 2's diachronic argument critique, the critical issue is why learning the strategy affects conditionalization cases but not synchronic books. I'll design a question highlighting this asymmetry, with follow-ups about whether the bookie's existence itself constitutes evidence and why it doesn't invalidate all Dutch books.

  For plank 3's adversarial robustness, several angles need coverage: 
  - The gap between exploitability and irrationality (with cases like bet-refusers or risk-averse agents)
  - Whether the package principle is smuggled in
  - Finite additivity counterexamples 
  - Information symmetry/no-trade theorem parallels
  - Self-as-adversary implications

  Each requires precise phrasing to prevent evasion. The finite additivity question must specify the infinite fair coins case explicitly since that's where probabilistic additivity fails. The no-trade follow-up should force her to distinguish information asymmetry from rationality defects.

  I'm structuring the questions to flow from foundations (plank 1) to objections (plank 2) then alternatives (plank 3), ending with falsifiability and practical implications. Each question isolates one vulnerability while allowing natural conversational progression.

  The closing questions about abandonment criteria and practical takeaways will make the discussion actionable for the audience. Throughout, I'm avoiding any scholarly references or biographical detours as instructed, focusing purely on conceptual pressure points.
answer: |-
  Here are 10 tightly-focused interview questions with conditional follow-ups, ordered for logical flow and pressing the key technical tensions:

  1.  **Opening Pressure on Plank 1 (Circularity):** "You argue the synchronic Dutch Book theorem assumes expected utility theory (EUT). If EUT itself *presupposes* probabilistic coherence as a consistency constraint on preferences, doesn't this leave us with no non-circular, non-prudential argument *for* probabilism itself? Is rationality just coherence-by-another-name?"
      *   *If she denies EUT presupposes probabilism:* "What specific axioms of EUT *don't* implicitly require probabilistic representability of beliefs to generate a coherent preference ordering over acts involving uncertainty?"
      *   *If she accepts consequence/no non-prudential argument:* "Does this mean probabilism isn't a *rational requirement* but merely a pragmatic one to avoid sure loss? Should we then tolerate logically inconsistent credences if an agent is indifferent to betting losses?"

  2.  **Testing Plank 2 (Diachronic Vulnerability - Immunization):** "On diachronic Dutch Books: you argue learning the bookie's strategy provides evidence shifting credences. But why doesn't *any* synchronic Dutch Book strategy, once revealed, similarly provide evidence that *should* shift the agent's credences about the events being bet on, immunizing them against synchronic exploitation too?"
      *   *If she distinguishes synchronic/diachronic:* "What specific *type* of evidence does learning the diachronic strategy provide (e.g., about *future* credence changes, about the bookie's knowledge) that learning a synchronic strategy does *not*, such that it legitimately shifts the *conditional* credences crucial for diachronic exploitation?"
      *   *If she suggests synchronic strategies don't provide relevant evidence:* "Couldn't learning a synchronic strategy reveal the bookie believes my credences are incoherent, which *is* evidence about the world? If I trust the bookie's diagnosis, shouldn't that make me *revise* my incoherent credences?"

  3.  **Pressure on Plank 2 (Diachronic Vulnerability - Proving Too Much?):** "Following up: Doesn't your argument imply that *no possible* diachronic strategy could ever legitimately exploit an agent, because revealing it always provides defeating evidence? Doesn't this make diachronic Dutch Books conceptually impossible, not just invalid as arguments?"
      *   *If she denies this/qualifies:* "Under what conceivable scenario *could* a diachronic Dutch Book strategy be revealed *without* providing evidence that shifts the agent's credences in a way that avoids exploitation? Doesn't the *mere existence* of a strategy designed to exploit a specific future credence shift *itself* constitute relevant evidence?"

  4.  **Testing Adversarial Robustness (Exploitability vs. Irrationality):** "Your adversarial robustness criterion: An agent refusing *all* bets is unexploitable but seems epistemically inert. A risk-averse agent might reject fair bets. Are these agents therefore 'acceptable' by your lights, even if their credences are wildly incoherent? Where exactly does the *irrationality* enter if exploitability is the criterion?"
      *   *If she appeals to "rational" adversary or "bets you'd accept":* "Doesn't defining 'rational adversary' and 'bets you'd accept' presuppose a background theory of rationality (like EUT) that *already* builds in coherence? How is this not circular?"

  5.  **Pressure on Adversarial Robustness (The Package Principle):** "Adversarial robustness targets a *package* of bets guaranteeing loss. But an agent might accept each bet individually as fair given their credences, rejecting only the package as unacceptable. Doesn't your criterion *assume* the 'package principle' – that rationality requires accepting any combination of individually acceptable bets – the very thing Dutch Books are often used to *argue for*?"
      *   *If she defends the package principle:* "What independent justification do you offer for the package principle, distinct from Dutch Book vulnerability? If it's intuitive, is that sufficient?"
      *   *If she rejects it/qualifies:* "How can adversarial robustness even be *stated* without presupposing that the agent is committed to evaluating the *package*? What constrains the adversary's bundling?"

  6.  **Testing Adversarial Robustness (Finite Additivity):** "Is adversarial robustness weaker than strict countable additivity? Consider an agent assigning P(Heads) = 0.5 to each toss in an infinite sequence of fair coin flips, but also P(All Tails) = 0. They avoid sure loss on *finite* sets of bets. Can a *rational, equally informed adversary* construct a *finite* package of bets this agent accepts that guarantees a loss? If not, are they 'adversarially robust' despite violating countable additivity?"
      *   *If she says no loss/finite robustness acceptable:* "Doesn't this mean your criterion permits credences that assign probability 1 to 'All Tails' *and* probability 1 to 'At least one Head' simultaneously, as long as no finite package exploits it? Isn't this a fatal flaw?"
      *   *If she argues a loss *is* possible:* "Sketch how the adversary constructs a finite package exploiting only finite additivity. Doesn't this require exploiting the agent's *infinite* set of credences, violating the 'finite package' aspect?"

  7.  **Pressure on Information Symmetry (No-Trade Theorems):** "The 'equally well-informed' clause in adversarial robustness seems crucial. Doesn't this collapse the criterion into the reasoning behind no-trade theorems? If both parties are rational and equally informed, no trade occurs. Isn't the 'sure loss' then solely due to information asymmetry, not irrationality? How does your criterion identify defective credences specifically?"
      *   *If she distinguishes:* "Can you describe a scenario where a rational, equally informed adversary *can* construct an exploitative package against an agent, purely due to a defect in the agent's credences, *without* any information asymmetry?"

  8.  **Pressure with Self as Adversary (Diachronic Return?):** "Can the 'rational adversary' be the agent *themselves* at a later time? If my future self, equally informed *up to that point*, can see that my current credences would lead them to accept a package guaranteeing a loss *from the perspective of my current information*, doesn't this restore the normative force of diachronic Dutch Books against my *current* self?"
      *   *If she rejects self-adversary:* "Why can't my future self, acting rationally with the information available *then* (which includes knowing my past credences and strategy), play the role of the adversary evaluating my *past* credences?"
      *   *If she accepts/qualifies:* "Doesn't this reintroduce a diachronic argument against probabilism or conditionalization, precisely the thing your second plank sought to retire?"

  9.  **Falsifiability:** "What specific, conceivable empirical finding or theoretical proof *would* convince you to abandon or significantly revise the adversarial robustness criterion as the right standard for credence evaluation?"
      *   *(Potential implicit follow-up depending on answer: If she cites extreme scenarios, ask: "But doesn't robustness already handle [e.g., bet refusal]? What's a *realistic* counterexample?")*

  10. **Practical Upshot:** "Putting theory aside: What's the key practical takeaway for how your audience – people discussing calibration in ML/AI or everyday reasoning – should *change* how they evaluate or criticize systems or beliefs, moving beyond 'it's Dutch-bookable'?"
      *   *(Potential implicit follow-up: If she emphasizes avoiding exploitation:* "But isn't the core issue *why* we care about exploitation? Does adversarial robustness give a clearer 'why' than Dutch Books?")*

  **Key Rationale for Order & Focus:**

  1.  **Start with Core Justification (Q1):** Attacks the foundation. If probabilism lacks a non-circular argument, the whole debate shifts.
  2.  **Immediately Pressure Plank 2 (Q2 & Q3):** This is the most distinctive and controversial claim. Q2 forces the synchronic/diachronic distinction. Q3 presses the "proves too much" worry hard.
  3.  **Introduce & Pressure Adversarial Robustness (Q4 & Q5):** Q4 tests basic intuitions (exploitability ≠ irrationality). Q5 targets a fundamental presupposition (package principle) crucial to *any* betting-based argument.
  4.  **Technical Counterexamples (Q6 & Q7):** Q6 (finite additivity) tests the criterion's strength vs. probabilism. Q7 (no-trade) attacks the core mechanism, questioning if it identifies irrationality or just asymmetry.
  5.  **Powerful Thought Experiment (Q8):** Using the self as adversary is a strong challenge to her rejection of diachronic arguments and tests the robustness of her alternative.
  6.  **Falsifiability & Practical Impact (Q9 & Q10):** Ends on broader relevance. Q9 forces intellectual honesty. Q10 translates theory to practice for the audience.

  **Avoids:** Restatements, definitions, biography, lit reviews. Focuses relentlessly on logical pressure points and potential internal contradictions within her stated position. Follow-ups are designed to block easy exits and force clarification of the underlying mechanisms.
