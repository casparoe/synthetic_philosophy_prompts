answer: |-
  ### Exam Question: Frankfurt Cases & PAP Revisited (20 marks | 45 minutes)  
  **Scenario:** Alex is deciding between a healthy salad (Option A) and a greasy burger (Option B). Unbeknownst to Alex, a "Nudge Device" is implanted in their brain. If Alex shows any neural inclination toward Option B, the device activates, making Option B *subjectively feel increasingly nauseating*. Alex never considers Option B long enough to trigger the device and chooses Option A freely, stating, "I chose it because I genuinely wanted it."  

  **Question:**  
  1. Explain how this case challenges the **Principle of Alternative Possibilities (PAP)**.  
  2. Distinguish between:  
     - **(a)** "Alex *could have done otherwise*" (acted differently)  
     - **(b)** "Alex *could have chosen otherwise*" (formed a different intention)  
  3. Does this case refute PAP(a), PAP(b), both, or neither? Justify your answer.  
  4. Respond to this objection: "Alex *could* have persevered with Option B despite the nausea, so alternatives existed."  

  ---

  ### Model Answer (480 words)  
  This case challenges PAP—which claims moral responsibility requires the ability to do otherwise—by presenting a scenario where Alex lacks genuine alternatives but still seems responsible. The Nudge Device ensures Alex *would* be prevented from choosing Option B if they tried, yet Alex "freely" chooses Option A without intervention.  

  Crucially, PAP splits into two claims:  
  - **PAP(a)**: Alex *could have done otherwise* (e.g., physically eaten the burger).  
  - **PAP(b)**: Alex *could have chosen otherwise* (e.g., formed the intention to pick the burger).  

  **PAP(a) is refuted**: Alex could *not* have done otherwise (acted on Option B). The device guarantees that if Alex ever seriously considered Option B, nausea would deter action. Since responsibility arises here without Alex ever facing a "real" alternative action, PAP(a) fails. Alex’s responsibility stems from their actual choice (A), not phantom alternatives.  

  **PAP(b) is *not* refuted**: Alex *could* have *chosen* otherwise (started forming intent for B), even if briefly. The device activates *only* when neural signals *begin* favoring B. Thus, Alex retained the capacity to *initiate* a choice for B—though this would trigger nausea, aborting the choice before action. PAP(b) concerns choice-formation, not follow-through. Since Alex *could* have begun choosing B (but didn’t), PAP(b) stands.  

  **Objection response**: The claim that Alex "could have persevered" misunderstands the device’s design. The nausea intensifies *proactively* when Option B is *contemplated*, making perseverance psychologically implausible. If Alex tried to "push through," the escalating discomfort would likely overwhelm rational choice, functionally coercing them. This doesn’t preserve a robust alternative—it merely highlights a *theoretical* possibility that collapses under psychological pressure. True "could have chosen" requires a *feasible* path, not a torturous one.  

  **Conclusion**: This case refutes PAP(a) but not PAP(b). Responsibility depends on the unimpeded *actual choice* (here, A), not access to alternative actions. However, the persistence of PAP(b) suggests that the *seed* of alternative choice remains, even if unexercised. This reinforces Frankfurt’s core insight: responsibility thrives without alternate *actions*, but not without the latent capacity for alternate *intentions*.  

  ---

  ### Marking Scheme (20 marks total)  
  | **Criterion**                                                                 | **Marks** | **Common Pitfalls**                                  |
  |-------------------------------------------------------------------------------|-----------|------------------------------------------------------|
  | **1. Accurately describes the scenario & PAP challenge** (Clarity on device mechanics & PAP’s role) | 4 | Misrepresenting the device (e.g., claiming it forces choice A directly). |
  | **2. Distinguishes PAP(a) and PAP(b) precisely** (Clear definitions of "done" vs. "chosen")       | 5 | Conflating the two or defining them ambiguously.     |
  | **3. Correctly evaluates refutation of PAP(a)/PAP(b)** (PAP(a) refuted; PAP(b) intact)            | 5 | Arguing both are refuted, or neither, without justification. |
  | **4. Engages the "perseverance" objection** (Explains why nausea undermines feasibility)         | 4 | Accepting the objection uncritically or ignoring psychological coercion. |
  | **5. Links analysis to moral responsibility** (Notes why responsibility persists sans PAP(a))     | 2 | Treating responsibility as irrelevant to the case.   |

  ---

  **Total Word Count**: 850 words (Exam Q: 180, Model: 480, Scheme: 190)  
  **Key Strengths**: Forces analysis of PAP’s ambiguity, uses psychological pressure (not force), prioritizes argument over names.
