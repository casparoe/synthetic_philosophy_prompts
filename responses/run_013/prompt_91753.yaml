prompt: |-
  I am a novelist, and I am writing a book set in a benefits office in a town that has seen better days. I had expected to find that my characters' moral reflexes were sharper than my own; they have turned out to be mine, and I cannot say what they add up to.

  Here is what I find I think. A claimant does undeclared cash work at a car wash, and I think he should lose money for it, though I would not want to be the officer who takes it. A claimant turns down a job because childcare and the bus fare would swallow the wage, and I think nothing should happen to her. A claimant turns down a job at a payday lender, says so to the officer's face, and again I think nothing should happen to her. A claimant's partner moves in and she does not report it, so she goes on receiving the higher rate paid to people who live alone; she regards her household as nobody's business, and I find I cannot bring myself to call that fraud. A claimant who is genuinely too ill to work lays it on thick at her assessment, and I think that is fraud, or near enough. A family with a great deal of money claims the payment that goes to every family with children, and I have no objection whatever. A woman who fails to mention that she has moved house, netting herself four pounds a week, ought in my view to be prosecuted.

  My own best attempt at a principle: the vice is not taking money you do not need, nor refusing work; it is dealing with the office as an adversary, managing what it knows. But to save my verdict on the concealed partner I have to add that only an active misstatement counts, which looks like special pleading, and the upshot is that the woman who embellishes her symptoms and the woman who quietly keeps four pounds come out worse than the woman who hides a partner. I cannot tell whether I believe that, and I suspect a simpler principle would simply overturn one of my verdicts.

  What principle, or small set of principles, fits these verdicts best? What does it imply for two cases I cannot settle — a claimant who reports every hour she works truthfully but has arranged her hours so as to stay just under the threshold, and a claimant who is overpaid through the office's own error, notices at once, and says nothing? Tell me which of my verdicts you would have to overturn, what would change your mind about the principle you settle on, and where your reasoning is most likely to fail.
reasoning: |-
  Okay, the user is a novelist struggling with moral judgments about their characters in a benefits office setting. They've listed several scenarios where claimants interact with the system, and their own intuitive judgments seem inconsistent. They want a coherent set of principles that explain their reactions, while acknowledging some verdicts might need revisiting. 

  Hmm... what's interesting is how visceral their reactions are - they clearly feel strongly about "adversarial" behavior (like the symptom-embellisher) but forgiving about structural conflicts (like the childcare refusal). The unspoken tension here is between seeing benefits as collective safety net versus individual transaction. 

  Ah! The key insight emerges when I notice their judgments correlate with perceived *intent* rather than monetary impact. The car wash guy actively deceives, the moved-house woman exploits a loophole, but the silent partner feels like resisting bureaucratic intrusion. That explains why they condemn the £4 fraud more harshly than the larger partner concealment - it's the pettiness of the deception that rankles.

  Wait... but this creates problems. Their "active misstatement" principle saves the silent partner but not the symptom-embellisher. Yet both involve deception. Maybe the difference is whether the claimant is *reacting* to systemic injustice (partner hiding as defiance) versus gaming the system (symptom exaggeration). 

  For the unsettled cases: The hours-threshold claimant plays within rules - no deception, so should be fine by their logic. The overpayment silence feels like passive deception - closer to the £4 fraud. But if the office's error was obvious, is silence really immoral? This exposes the principle's fragility.

  If pressed, I'd suggest overturning the silent partner verdict - either embrace it as legitimate resistance (making symptom-embellishment the outlier) or concede it's fraud (making childcare refusal the outlier). The novelist's discomfort suggests they actually value *authenticity* over strict legality - which beautifully suits literary complexity.
answer: |-
  Your moral intuitions reveal a coherent ethical framework centered on **honesty, adversarial conduct, and systemic fairness**. Here's a principle set that fits your verdicts, addresses unsettled cases, and highlights tensions:

  ---

  ### **Core Principles**
  1. **The Adversarial Principle**: Wrongdoing arises when claimants *actively deceive* the system to extract unentitled resources, treating it as an opponent to manipulate.  
  2. **The Integrity Principle**: No moral breach exists when refusing work or claiming universal entitlements aligns with:  
     - Basic self-preservation (childcare costs, exploitative jobs)  
     - Resistance to unjust systems (payday lenders)  
     - Passive receipt of errors not caused by the claimant  
  3. **The Proportionality Principle**: Severity of wrongdoing scales with:  
     - Deliberate deception (fraud) > passive omission  
     - Personal gain relative to need (e.g., £4/week vs. concealed partner)  

  ---

  ### **Your Verdicts Explained**  
  | Scenario                      | Your Verdict      | Principle Applied |  
  |-------------------------------|-------------------|-------------------|  
  | Undeclared cash work          | Penalize          | Adversarial (active fraud) |  
  | Refused job (childcare/costs) | No penalty        | Integrity (self-preservation) |  
  | Refused payday lender job     | No penalty        | Integrity (system resistance) |  
  | Concealed partner             | Not fraud         | Proportionality (passive omission; need-driven?) |  
  | Embellishing illness          | Fraud             | Adversarial (active deception) |  
  | Wealthy family claims benefit | Acceptable        | Integrity (universal entitlement) |  
  | £4/week address fraud         | Prosecute         | Adversarial + Proportionality (trivial but deliberate fraud) |  

  **The concealed partner case** is your outlier. You exempt it because it’s passive omission (not "active misstatement"), driven by privacy/need. But this *does* require special pleading—**embellishing symptoms** (active deception) feels worse to you than **hiding a partner** (passive omission), even if the latter costs more.  

  ---

  ### **Unsettled Cases**  
  1. **Claimant structuring hours below threshold**:  
     - **Verdict**: No penalty. Aligns with *Integrity Principle*—they’re transparent and gaming *rules*, not deceiving. You’d likely accept this as "working the system" fairly.  
  2. **Claimant silent about office’s overpayment error**:  
     - **Verdict**: Penalize. Violates *Adversarial Principle*—active silence is exploitation. (Contrast with passive partner omission; here, claimant *notices* and chooses deception.)  

  ---

  ### **Inconsistencies to Resolve**  
  - **Overturn one verdict?** To align principles, you must either:  
    a) **Condemn the concealed partner** as fraud (overturning your verdict), OR  
    b) **Absolve the symptom-embellisher** (if "need justifies deception" applies equally).  
  - **Your current stance** prioritizes *method* (active vs. passive) over *impact*. This holds if you view passive omissions as non-adversarial—but society rarely agrees.  

  **Weakness in reasoning**: Your principles risk **romanticizing "need-based fraud"** while condemning "greed-based fraud." But:  
  - The £4/week claimant may *need* that money more than the silent partner.  
  - "Need" is subjective—e.g., is embellishing illness not also survival-driven?  

  ---

  ### **A Revised Principle**  
  **"The test is whether the claimant’s act:  
  (a) Involves *active deception* (not mere omission), AND  
  (b) *Harms the system’s ability to help others* (e.g., diverting funds from needier claimants)."**  

  This would:  
  ✅ **Condemn**: Car wash fraud, symptom embellishment, £4 fraud, overpayment silence (all active + harmful).  
  ✅ **Absolve**: Childcare refusal, payday lender refusal, wealthy claimants (no deception).  
  ❓ **Problem case**: Concealed partner—passive omission, but arguably harms system. **You’d need to overturn your verdict here.**  

  **What would change my mind?** If evidence showed passive omissions (like unreported partners) *significantly drain resources* from needier claimants, your "privacy defense" might collapse.  

  ---

  ### **Conclusion**  
  Your instincts reflect a **humanist pragmatism**: deception is wrong, but need and resistance to exploitation excuse non-compliance. The tension arises when "need" clashes with "honesty." For your novel, lean into this ambiguity—it mirrors real welfare dilemmas. To resolve it:  
  1. Prosecute active fraud (£4/week, car wash).  
  2. Forgive survival-driven non-deception (childcare, payday jobs).  
  3. Treat passive omissions (partner) as morally gray—neither heroic nor villainous.  

  This preserves your empathy while acknowledging systemic costs.
