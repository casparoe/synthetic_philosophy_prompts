prompt: |-
  I teach a third-year seminar in decision theory, and next week's session is on satisficing. Don't explain the idea to me; plan how I should explain it in eighty minutes to students who have had one term of expected-utility theory and nothing else. The crux I want the session built around is a distinction my students collapsed last year: between a rule that stops at the first option clearing a fixed bar and a rule that stops at the first option better than whatever you already hold. These are different rules with different failure modes — a bar set too high can leave you searching indefinitely, whereas an improvement rule can settle you into something you would never have accepted from scratch — and until they see the two come apart in a case, they will read every version of satisficing as the first. So: give me the order in which the pieces must go for bounded rationality to look like a constraint on what maximising can even mean, rather than a concession to human weakness; the one case to carry the session, which should not be the secretary problem (it presupposes the maximising frame I am trying to dislodge) and must let the two rules give different verdicts; the misconceptions to expect in the order they will surface — my guesses are that satisficing is settling for less, that it is just constrained optimisation, that the aspiration level is an arbitrary fudge, and that it is a claim about psychology rather than about rationality — with the point in the sequence where each should be headed off; and one closing question that would show they can tell the two rules apart in a case they haven't seen. Tell me too what I should refuse to cover at this level, and say so out loud in the session. If the crux I have built the session around is confused, or the framing is a bad way in, say so rather than working around it. Write in American English.
reasoning: |-
  Okay, let me tackle this professor's request for their decision theory seminar. They need an 80-minute session plan on satisficing that clarifies a key distinction students often miss: fixed-bar satisficing versus improvement-based satisficing. 

  First, I need to understand why last year's students conflated these two rules. The professor mentions both involve stopping rules but have different failure modes - fixed bars risk endless search while improvement rules risk settling for subpar options. The secretary problem is off-limits because it assumes maximization, which defeats the purpose of challenging that framework.

  Hmm... the professor wants the session to frame bounded rationality as a constraint on what maximizing even means, not just human weakness. That's subtle. I should start by problematizing maximization itself - maybe show situations where rational maximizing is impossible due to computational or informational limits. 

  For the central case study, I need something where the two satisficing rules clearly diverge. What about... a job search scenario? Candidate qualities are revealed sequentially with costly search. If aspiration level is fixed too high (say top 10%), you might never hire. But an improvement rule (better than current offer) could make you accept a mediocre early offer you'd never consider initially. Yes, that exposes both failure modes cleanly.

  Anticipating misconceptions is crucial. The professor listed four: 
  1) Satisficing as settling for less (need to reframe as rational response to constraints)
  2) Just constrained optimization (must emphasize it's not approximating maximizing)
  3) Aspiration level arbitrariness (show how it can be evidence-based)
  4) Psychological claim vs rationality (stress normative interpretation)

  The session flow should probably: 
  1) Revisit EU limitations (5 min) 
  2) Introduce bounded rationality (10 min) 
  3) Present job search case (15 min) 
  4) Contrast the two rules through case analysis (20 min) 
  5) Systematically debunk misconceptions (20 min) 
  6) Closing application question (10 min)

  For the closing test, maybe a house hunting scenario: fixed-bar buyer rejects all if minimum square footage is unrealistic, while improvement buyer might overpay for the first upgrade they see. 

  Must explicitly exclude: evolutionary interpretations, computational complexity proofs, and multi-agent satisficing. The professor should state these boundaries aloud.

  Wait - is the core distinction actually solid? Fixed-bar depends entirely on setting the "good enough" threshold, while improvement rules depend on initial reference points. Both are vulnerable to framing effects, but that's a feature not a bug for this lesson. The framing seems pedagogically sound as long as we stress they're distinct heuristic classes under the satisficing umbrella.

  American English phrasing check: "math" not "maths", "modeling" not "modelling", "behavior" not "behaviour". Got it.
answer: |-
  Here’s an 80-minute session plan focused on your crux, structured to force confrontation between **fixed-bar satisficing** and **improvement-triggered satisficing**, while reframing bounded rationality as a constraint on maximization’s *meaning*—not a psychological concession. Uses one core case study and targets misconceptions proactively.

  ---

  ### **Session Structure & Timing**  
  *(Total: 80 min)*  

  #### **1. Framing: Why Maximization Fails in the Wild (15 min)**  
  - **Hook (2 min):** "You’ve mastered EU maximization. Now: when is it *impossible* to maximize? Not because you’re lazy—but because the world denies you the tools."  
  - **Constraint Recap (8 min):**  
    - *Information gaps:* Can’t know all options/payoffs (e.g., job market).  
    - *Computational limits:* Can’t solve NP-hard choice environments.  
    - *Temporal pressure:* Decisions can’t wait for exhaustive search.  
  - **Pivot (5 min):** "Bounded rationality isn’t ‘humans suck at math.’ It’s ‘maximization is *undefined* here.’ Satisficing isn’t a retreat—it’s making rationality *possible*."  

  #### **2. Introducing Satisficing: Two Stopping Rules (10 min)**  
  - **Define Both Rules Visually** (side-by-side chart):  
    - **Fixed-Bar Satisficing (FBS):** Stop at first option ≥ fixed aspiration level (e.g., "Rent ≤ $1,200").  
    - **Improvement Satisficing (IS):** Stop at first option better than current best (e.g., "Better than the apartment I saw yesterday").  
  - **Emphasize:** "These look similar but fail *differently*. Today’s goal: see them split apart."  

  ---

  #### **3. The Core Case Study: "The Cafeteria Problem" (20 min)**  
  *(Not the secretary problem; avoids optimal-stopping frame.)*  

  - **Setup (5 min):**  
    - *Scenario:* You’re hungry, walking past cafeterias in a row. You must enter one; no returning. Each has a hidden quality score (1–100). You learn a cafeteria’s score only after entering.  
    - *Cost:* Each entry costs $1 (search is expensive). You start with $0 (so first entry is free, but you pay for subsequent searches).  
    - *Goal:* Get a "good enough" meal without overspending.  

  - **Contrast the Rules (15 min):**  
    - **FBS:** Set a fixed bar (e.g., "≥70/100").  
      - *Risk:* If bar is too high, you bankrupt yourself searching (e.g., scores are 65, 68, 69, 72... you pay $3 to find the 72).  
    - **IS:** Stop when you find one better than your best so far.  
      - *Risk:* Enter a terrible first cafeteria (score 10). Next is 11—you stop! You’d never accept 11 from scratch.  
    - **Key Twist:** Run the case twice:  
      1. *Fixed-bar failure:* Scores = 68, 67, 66, 65... (bar=70 → search forever).  
      2. *Improvement failure:* Scores = 10 (free), then 11 (pay $1 → stop at 11).  

  ---

  #### **4. Debunking Misconceptions (20 min)**  
  *Address in this order—they’ll arise when rules are contrasted:*  

  1. **"Satisficing is settling for less."**  
     - *When it surfaces:* After seeing IS accept "11."  
     - *Response:* "No—it’s avoiding *catastrophic* failure (bankruptcy). FBS can’t stop; IS stops too early. Neither ‘settles’; they manage different risks."  

  2. **"It’s just constrained optimization."**  
     - *When it surfaces:* During framing ("If you build constraints into EU...").  
     - *Response:* "Constrained EU still maximizes *within* bounds. Satisficing *replaces* maximization: FBS doesn’t compare options; IS ignores global payoffs."  

  3. **"Aspiration levels are arbitrary."**  
     - *When it surfaces:* Setting the bar in FBS.  
     - *Response:* "They’re *evidence-based* (e.g., market rents). Arbitrary? Only if uncalibrated. But IS’s reference point (your current best) is *inherently arbitrary*—it depends on search order!"  

  4. **"This is psychology, not rationality."**  
     - *When it surfaces:* Post-case ("People do this, but is it *rational*?").  
     - *Response:** "If rationality requires the impossible (omniscience), it’s empty. Satisficing is *procedurally rational*: the best you can do with what you have."  

  ---

  #### **5. The Takeaway: Bounded Rationality Redefined (5 min)**  
  - "Satisficing doesn’t ‘approximate’ maximizing. It defines rationality *when maximizing is impossible*. FBS and IS aren’t ‘flawed’—they solve different problems: FBS controls aspiration risk; IS controls search cost."  

  #### **6. Closing Test Question (10 min)**  
  - **Scenario:** You’re buying a used car. You see one per day; no recalls.  
    - **Version A:** You use FBS (bar: "≤$10,000"). You see a $10,100 car on Day 1.  
    - **Version B:** You use IS. On Day 1, you see a $15,000 car. On Day 2, you see a $14,999 car.  
  - **Q:** "What does A do? What does B do? Why might B regret its choice, and why might A never choose?"  
    - *Answer:*  
      - A rejects Day 1 (over bar) → risks indefinite search.  
      - B buys Day 2 ($14,999 < $15,000) → pays near-max for a car they’d never accept from scratch.  

  ---

  ### **What to Explicitly Exclude (State Aloud!)**  
  - **"We’re ignoring:**  
    1. *Evolutionary/adaptive justifications* (e.g., Simon's scissors). Today is about *rationality*, not biology.  
    2. *Computational complexity proofs*. Focus on the *logic* of failure modes.  
    3. *Multi-agent satisficing* (e.g., markets). This is single-agent choice."  
  - **Why:** "These are crucial topics—but they’d blur today’s line between FBS and IS."  

  ---

  ### **Why This Works**  
  - **Your crux is sound:** Students *will* conflate FBS/IS without a stark contrast. The cafeteria case makes the divergence visceral.  
  - **Framing succeeds:** By starting with "maximization is impossible here," satisficing becomes a necessity—not a compromise.  
  - **Misconceptions pre-empted:** Each rebuttal ties directly to the case’s mechanics.  

  **Final Tip:** Hammer the cafeteria case hard. Ask: "Which rule failed here? How?" after each twist. If they see *that* split, the rest follows.
