answer: |-
  Below is a decision tree designed to navigate key positions in decision theory through concrete scenarios. It starts with Newcomb's Problem and progresses to Counterfactual Mugging and XOR Blackmail, using only practical questions about actions and reasons. The tree separates major positions (CDT, EDT, TDT/UDT/FDT) and flags contested areas. Each leaf includes a named position and its "most awkward commitment."

  ---

  ### **Decision Tree: Navigating Decision Theories**

  **Instructions:**  
  Answer each question based on your intuition. Proceed to the next node based on your choice. No prior knowledge of decision theory is required—just your reasoning about the scenarios.

  ---

  #### **Node 1: Newcomb's Problem**  
  *Setup:* Omega puts $1,000,000 in Box B if it predicts you take only Box B; else $0. Box A is transparent with $1,000. You can't change Omega's prediction.  
  **Question:** Do you take both boxes or only Box B?  
  - **A. Take both boxes** → Go to Node 2  
  - **B. Take only Box B** → Go to Node 3  

  ---

  #### **Node 2 (for two-boxers):**  
  *Setup:* Same as Node 1.  
  **Question:** Why take both boxes?  
  - **A. "Box B’s contents are fixed. Taking A gives extra $1,000 without costing me Box B’s money."**  
    → Go to Node 4  
  - **B. "I don’t trust Omega’s prediction, so I hedge my bets."**  
    → *Leaf: **Skeptical Pragmatist***  
    *Awkward commitment:* In Newcomb-like scenarios, you might miss out on $1M if Omega is truly reliable.  

  ---

  #### **Node 3 (for one-boxers):**  
  *Setup:* Counterfactual Mugging (tails branch). Omega flipped tails and asks for $100. If heads (counterfactual), Omega would have given you $10,000 *only if* it predicted you’d pay here.  
  **Question:** Do you pay the $100?  
  - **A. Yes** → Go to Node 5  
  - **B. No** → *Leaf: **Evidential Decision Theory (EDT)***  
    *Awkward commitment:* In XOR Blackmail (bomb location based on prediction; paying gives no causal benefit), you’d pay to avoid the bomb (since paying *correlates* with safety), but here you refuse, risking inconsistency.  

  ---

  #### **Node 4 (for two-boxers who cite fixed boxes):**  
  *Setup:* Same as Node 2A.  
  **Question:** In Counterfactual Mugging (tails branch), do you pay $100?  
  - **A. Yes** → *Leaf: **Hybrid/Inconsistent***  
    *Awkward commitment:* You two-box in Newcomb (rejecting correlations) but pay here (accepting counterfactual correlations). Few defend this.  
  - **B. No** → *Leaf: **Causal Decision Theory (CDT)***  
    *Awkward commitment:* In XOR Blackmail, if paying gave you information to *causally* avoid a bomb (e.g., by revealing its location), you’d pay. But if no causal link exists, you’d refuse—even if refusal means likely death.  

  ---

  #### **Node 5 (for one-boxers who pay in CM):**  
  *Setup:* XOR Blackmail. A bomb is hidden in one of two locations. The location is XORed with your decision (paying $100 or not). Paying *doesn’t causally affect* the bomb’s location (set by a predictor), but correlates with safety.  
  **Question:** Do you pay $100?  
  - **A. Yes** → *Leaf: **Timeless/Functional/Updateless Decision Theory (TDT/FDT/UDT)***  
    *Awkward commitment:* You’d pay in CM tails even though you lose $100 and gain nothing—because you want to "be the agent" who pays, ensuring benefits in *counterfactual* branches (e.g., CM heads).  
  - **B. No** → *Leaf: **EDT with Limits***  
    *Awkward commitment:* You one-box in Newcomb (using correlations) but reject them here, implying you only care about correlations in "actual" outcomes, not purely counterfactual ones. Rarely defended.  

  ---

  ### **Summary of Leaves & Positions**
  1. **Causal Decision Theory (CDT)**  
     - *Path:* 1A → 2A → 4B  
     - *Core:* Act only on causal consequences. Ignore correlations if no causal link.  
     - *Awkward commitment:** Refuses to pay in CM tails (losing $10K counterfactually) and in non-causal XOR Blackmail (risking death).  

  2. **Evidential Decision Theory (EDT)**  
     - *Path:* 1B → 3B  
     - *Core:* Act based on evidence (correlations). Current choice signals what *would* or *did* happen.  
     - *Awkward commitment:** Pays in non-causal XOR Blackmail (since paying correlates with safety) but not in CM tails (where the benefit is counterfactual).  

  3. **TDT/FDT/UDT**  
     - *Path:* 1B → 3A → 5A  
     - *Core:* Optimize for the output of your decision algorithm across counterfactuals. "Be the agent" who gets the best outcomes in all possible branches.  
     - *Awkward commitment:** Pays $100 in CM tails despite no personal gain, to "commit" to being a paying agent.  

  4. **Skeptical Pragmatist**  
     - *Path:* 1A → 2B  
     - *Core:* Distrust predictors; prioritize immediate, tangible gains.  
     - *Awkward commitment:** Misses out on $1M in Newcomb if Omega is reliable.  

  5. **EDT with Limits**  
     - *Path:* 1B → 3A → 5B  
     - *Core:* Like EDT but rejects correlations in purely counterfactual branches.  
     - *Awkward commitment:** Inconsistent use of evidence (accepts in Newcomb, rejects in CM/XOR).  

  6. **Hybrid/Inconsistent**  
     - *Path:* 1A → 2A → 4A  
     - *Core:* Mixes causal and counterfactual reasoning without a clear principle.  
     - *Awkward commitment:** No cohesive defense; violates most axioms.  

  ---

  ### **Key Notes**
  - **Contested Areas:**  
    - Whether to *care about counterfactuals you don’t experience* (Node 3) is **hotly disputed**. TDT/FDT/UDT says yes; CDT/EDT say no.  
    - Whether *algorithmic commitment* (Node 5) is rational is **unsettled**. Critics call it "paying for nothing"; proponents say it’s winning across multiverses.  
  - **Bedrock Agreements:**  
    - All agree: If a choice *causally changes outcomes* (e.g., paying to defuse a bomb), do it if net positive.  
    - All agree: Predictor reliability matters. If Omega is fallible, two-boxing in Newcomb can be rational.  
  - **Collapsed Positions:**  
    - TDT, FDT, and UDT **collapse** on this tree (all take Path 1B → 3A → 5A). They differ in metaphysics but agree on actions here.  
  - **Unattractive/Undefended:**  
    - *Hybrid/Inconsistent* (1A→2A→4A) and *EDT with Limits* (1B→3A→5B) lack coherent principles.  
    - *Skeptical Pragmatist* (1A→2B) is practical but ignores thought-experiment logic.  

  ---

  ### **How to Use in Lunch-and-Learn**
  1. **Hand out the tree** as a worksheet.  
  2. Have each person **fill it out individually** (5 mins).  
  3. **Tally results** on a whiteboard.  
  4. **Discuss disagreements** (e.g., "Why did 40% of one-boxers refuse to pay in CM?").  
  5. **Reveal leaf positions/commitments** to spark debate (e.g., "CDT would rather die in XOR Blackmail than pay without causal benefit!").  

  This approach avoids lectures, focuses on actions, and exposes fault lines. It clarifies that CM/XOR lack consensus—even experts split on Node 3 and 5.
