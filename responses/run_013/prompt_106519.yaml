  ### Decision Tree: The Combination Problem for Panpsychism  
  **Root Commitment:** Consciousness (or a close analogue) is fundamental—it is not a late product of purely physical processes.  

  #### **Node 1: Is macro-consciousness (e.g., human experience) real?**  
  - **No** → **Illusionism/Eliminativism**  
    - *Most awkward commitment:* Our first-person sense of unified consciousness is a pervasive illusion; only micro-experiences exist.  
  - **Yes** → Proceed to Node 2.  

  #### **Node 2: Where is the *fundamental* consciousness (or analogue) located?**  
  - **At the cosmic level** → **Cosmopsychism**  
    - *Most awkward commitment:* The universe is a single conscious subject, and individual minds (like ours) are derivative fragments or aspects of it.  
  - **Not level-specific (or everywhere)** → **Neutral/Dual-Aspect Monism**  
    - *Most awkward commitment:* Fundamental reality is inherently neither mental nor physical, yet mysteriously grounds both aspects without explaining their interaction.  
  - **At the micro-level (basic physical entities)** → Proceed to Node 3.  

  #### **Node 3: What is the nature of the fundamental micro-properties?**  
  - **Non-subjective qualities (e.g., raw feels without a subject)** → **Panqualityism**  
    - *Most awkward commitment:* Subjectivity (the "I" in experience) emerges from quality-combination, but qualities themselves lack a point of view.  
  - **Protophenomenal properties (pre-conscious potentials)** → Proceed to Node 4.  
  - **Subjects (possessing a point of view)** → Proceed to Node 5.  

  #### **Node 4 (Protophenomenal base): Does macro-consciousness *emerge* as a novel kind?**  
  - **Yes** → **Emergentism**  
    - *Most awkward commitment:* Macro-consciousness is ontologically "more than" its protophenomenal parts—a brute discontinuity violating mereological expectations.  
  - **No** → **Panprotopsychism**  
    - *Most awkward commitment:* Protophenomenal properties constitute consciousness "as is," but how they become subjective remains unexplained.  

  #### **Node 5 (Micro-subjects): Is macro-experience *literally composed* of micro-experiences?**  
  - **No** → *Position collapses into Emergentism or Cosmopsychism* (see below).  
  - **Yes** → Proceed to Node 6.  

  #### **Node 6: Does combination require a *primitive bonding relation* beyond the natures of the parts?**  
  - **Yes** → **Constitutive Panpsychism + Bonding Relation**  
    - *Most awkward commitment:* A fundamental "consciousness-glue" must be added to reality, with no physical or experiential basis.  
  - **No** → **Constitutive Panpsychism (Standard)**  
    - *Most awkward commitment:* Micro-subjects' natures *alone* explain their fusion into a macro-subject, despite no evidence of intrinsic combinability.  

  ---

  ### Collapsed Positions & Unoccupied Regions  
  **Collapsed Positions:**  
  - **Constitutive Panpsychism vs. Emergentism (under micro-subjects):** If Node 5 ("Is macro-experience composed of micro-experiences?") is answered "No," the position *collapses into Emergentism* (if micro-subjects are retained) or *Cosmopsychism* (if grounding is reversed). The tree cannot separate these without adding a question about *grounding direction* (upward vs. downward).  
    - *Why:* Constitutive panpsychism requires composition; rejecting this implies either emergence (novel macro-property) or top-down derivation (cosmic subject).  

  **Unoccupied Regions of Logical Space:**  
  1. **Micro-subjects + Non-constitutive + Non-emergent:**  
     - *Description:* Micro-subjects exist, but macro-experience is neither composed of them nor emergent.  
     - *Diagnosis:* Incoherent. If macro-experience is real and fundamental consciousness is micro-located, macro must be built from or emerge from micro.  
  2. **Micro-qualities + Emergent Subjectivity:**  
     - *Description:* Fundamental qualities (non-subjective) combine to *emerge* as a subject (e.g., "I" from raw feels).  
     - *Diagnosis:* Unattractive. Panqualityists avoid emergence to preserve continuity; emergentists avoid micro-qualities to permit novelty.  
  3. **Cosmic Subject + Micro-Survival:**  
     - *Description:* The cosmos is fundamental, yet micro-subjects survive as independent entities within it.  
     - *Diagnosis:* Unexplored. Combines top-down grounding with bottom-up autonomy, risking overdetermination.  

  ---

  ### How to Use This Tree  
  - **Start at the root** and answer each node’s question from the armchair.  
  - **Follow branches** to a leaf position. Each leaf’s "awkward commitment" highlights its key challenge.  
  - **Collapsed pairs** (e.g., constitutive panpsychism vs. emergentism under micro-subjects) require extra distinctions (e.g., grounding direction).  
  - **Unoccupied regions** show theoretical "dead ends"—incoherent, unpopular, or underexplored.  

