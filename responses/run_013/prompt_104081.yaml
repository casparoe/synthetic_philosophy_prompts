prompt: |-
  An oddity in a national health service I know of: to decide which treatments to fund, it ranks them by cost per quality-adjusted life-year and applies a threshold, so that a drug buying less health per dollar is denied regardless of who the patient is; but in a separate budget line the same service funds sign-language interpreters, accessible buildings, personal assistants, and reading services for blind users, without ever asking whether those dollars buy as much health as a cancer drug would. What theory of equality does the pair presuppose? Reconstruct the currency of equality implicit in the first practice and the currency implicit in the second -- welfare, resources, capabilities, or something else -- and say whether the institution can consistently hold both or is quietly committed to two incompatible equalisanda. Separate what each practice strictly presupposes from what it merely fits, flag where it is philosophically underdetermined, and then say what would have to change if the institution committed to a single currency: what would a thoroughgoing capabilities view demand of the cost-per-QALY threshold, and what would a thoroughgoing resource view demand of the accommodation budget? Be explicit about which parts of your answer are settled among people who study distributive justice and which are genuinely contested, rather than presenting a contested reading as the consensus.
reasoning: |-
  Hmm, this user presents a fascinating puzzle about distributive justice in healthcare systems. They've noticed an apparent inconsistency in how a national health service allocates resources: strict cost-per-QALY thresholds for medical treatments versus uncritical funding for disability accommodations. 

  The user clearly knows their philosophy - they're using precise terms like "equalisanda" and asking for reconstruction of implicit currencies. This isn't someone looking for ELI5; they want rigorous academic engagement. I should acknowledge the sophistication upfront while making sure not to overclaim consensus where none exists.

  Breaking it down: First practice (cost-per-QALY) seems textbook health maximization - welfarist at its core by treating health gains as commensurable units. But the QALY metric itself is philosophically loaded, conflating preference satisfaction with objective health states. Meanwhile the accommodation budget screams capabilities approach - it's about enabling functionings regardless of efficiency metrics. 

  The real tension lies in whether health systems should be pure efficiency engines or vehicles for justice. Daniels' "normal functioning" framework might bridge them, but even that doesn't fully resolve why accommodations get privileged treatment. I should flag the disability justice literature here - the social model challenges the very premise of seeing accommodations as "extra" costs rather than baseline requirements for equal participation.

  For the reconciliation attempt: A pure resource view would make accommodations compete directly with cancer drugs (brutal but consistent). A capabilities approach might force QALY calculations to include baseline functioning - e.g. a drug's value could depend on whether the patient has interpreter access. But operationalizing that would explode current pharmacoeconomic models. 

  Must emphasize where the minefields are: The disability-adjusted QALY debate remains viciously contested. And while philosophers agree currencies matter, there's zero consensus on which one wins in healthcare rationing. The user seems aware of this but wants the fault lines mapped precisely.
answer: |-
  Here's a reconstruction of the distributive logic, its tensions, and potential reconciliations, distinguishing settled points from contested interpretations:

  ### I. Implicit Currencies of Equality
  1.  **Cost-per-QALY Practice:**
      *   **Strictly Presupposes:** A *welfarist* currency of equality (specifically **health welfare**).
      *   **How:** QALYs explicitly measure *health-related quality of life* and *life extension*, aggregated into a single welfare metric. The threshold maximizes aggregate health welfare gain per unit resource. Patient identity is irrelevant; only the quantifiable health outcome matters.
      *   **Philosophically Underdetermined:** It *fits* (but doesn't strictly require) a utilitarian/consequentialist framework prioritizing aggregate welfare. It could also fit a prioritarian view focusing on the worst off *if* their conditions yield low QALY gains per dollar, but this isn't inherent to the practice itself.

  2.  **Disability Accommodations Practice:**
      *   **Strictly Presupposes:** A *capability* currency of equality.
      *   **How:** Funding interpreters, accessibility, etc., aims not at maximizing aggregate health *outcomes* measured in QALYs, but at ensuring individuals with disabilities have the **capability** to access healthcare services and participate in society on terms approaching equality. It focuses on creating *opportunities for functionings* (e.g., accessing a doctor, reading information) rather than directly purchasing health gains.
      *   **Philosophically Underdetermined:** It *fits* (but doesn't strictly require) a sufficientarian view (ensuring a minimum level of capability) or a social model of disability viewing barriers as societal failures. It *could* be interpreted through a resource lens (providing specific goods/services), but its *purpose* is capability enhancement.

  ### II. Consistency of the Pair
  *   **Incompatibility Claim:** The practices appear incompatible *if* one insists on a single, consistent currency of equality across *all* resource allocation decisions. The first practice prioritizes *maximizing aggregate health welfare* within its budget. The second practice prioritizes *ensuring capability sets for a specific group*, largely irrespective of the comparative health welfare those resources could generate elsewhere (e.g., funding an interpreter might cost more QALYs than it directly "buys" compared to a cancer drug).
  *   **Potential for Coherence:** The institution *can* consistently hold both practices *only if* it adopts a **pluralist or multi-principle theory of justice** for healthcare allocation:
      *   **Settled Observation:** Philosophers widely agree that real-world institutions often use plural principles, and pure welfarism faces significant critiques (e.g., concerning disability, fair chances).
      *   **Contested Reconciliation:** One coherent pluralist view could be:
          1.  The *primary* healthcare budget aims for **efficiency in maximizing health welfare** (QALY threshold).
          2.  A *separate* budget line addresses **requirements of fairness and non-discrimination**, ensuring individuals aren't excluded from healthcare or social participation due to disability (Capability/Social Model). This reflects a commitment to **equality of opportunity** or **recognition** alongside aggregate welfare.
      *   **Daniels' "Normal Opportunity Range":** Norman Daniels' influential theory bridges this somewhat. Society should restore individuals to the "normal opportunity range" via healthcare. Accommodations could be seen as necessary to *enable* individuals with disabilities to access the "normal opportunity range," aligning with capabilities. However, whether *all* funded accommodations fit neatly into "restoring normal functioning" is contested.

  ### III. Demands of a Single Currency Commitment
  *   **A. Thoroughgoing Capabilities View:**
      *   **Demand on Cost-per-QALY Threshold:** It would **reject the current QALY metric and threshold as the sole arbiter**.
          *   **Why?** QALYs often disadvantage people with pre-existing disabilities or chronic conditions (their potential QALY gains might be lower). A capabilities view prioritizes securing core capabilities (life, bodily health, affiliation, senses, etc.) for all.
          *   **Change Required:** Resource allocation would need to prioritize interventions securing **basic capabilities** or lifting those furthest from a sufficient capability threshold. Cost-effectiveness would be secondary to ensuring minimum capability levels. QALYs might be supplemented or replaced by metrics assessing capability sets or functionings achieved. Treatments significantly enhancing core capabilities for those severely deprived might be funded even if cost-per-QALY is high.
      *   **Demand on Accommodation Budget:** Would largely **endorse and potentially expand** this budget, viewing it as essential for securing core capabilities. Funding decisions might become *more* integrated into the overall budget, assessed based on their contribution to specific capability goals.

  *   **B. Thoroughgoing Resource View (e.g., Dworkin's Equality of Resources):**
      *   **Demand on Cost-per-QALY Threshold:** Could **potentially accept it as a tool** for efficient resource allocation *within* the healthcare budget, provided the initial resource bundle is justly distributed and individuals are compensated for pre-existing disadvantages via other mechanisms (e.g., insurance).
      *   **Demand on Accommodation Budget:** Would **subject it to intense scrutiny and likely require radical restructuring**.
          *   **Why?** Resources are the currency. Accommodations (interpreters, ramps, etc.) are specific resources. Funding them without question doesn't align with ensuring individuals have equivalent *bundles* of resources or opportunities to insure against risks.
          *   **Change Required:** Individuals might receive a budget/voucher to purchase necessary accommodations based on their needs/preferences within a constrained system. Alternatively, accommodations would compete directly with medical treatments based on a broader cost-effectiveness analysis (e.g., cost per unit of "opportunity restored" or simply within the fixed resource pie). The *unconditional* funding stream would disappear; accommodations would need to "justify" their resource cost against alternatives.

  ### IV. Settled vs. Contested
  *   **Settled:**
      1.  The QALY approach is fundamentally welfarist (health-focused welfare).
      2.  Disability accommodations are primarily justified by capabilities/opportunity/anti-discrimination, not health welfare maximization.
      3.  Pure welfarism (like strict QALY maximization) faces strong critiques regarding fairness to the disabled and other vulnerable groups.
      4.  Real-world institutions frequently employ plural principles; identifying them doesn't automatically mean the institution is inconsistent *in practice* if it acknowledges this pluralism.
      5.  A pure resource view would require integrating the accommodation budget into the general resource pool subject to competition.
  *   **Contested:**
      1.  **Whether the two practices are *inherently* incompatible:** Advocates of pluralism (like Walzer, Miller) argue different social goods (basic healthcare vs. access/participation) demand different distributive principles. Strict monists (pure welfarists, strict resourcists, strict capability theorists) argue they are incompatible.
      2.  **The best philosophical justification for accommodations:** Is it capabilities (Nussbaum, Sen), social recognition/anti-discrimination (Fraser, Young), a modified opportunity-based view (Daniels), or something else?
      3.  **How to operationalize a capabilities view in healthcare rationing:** There is no consensus on a replacement metric for QALYs or a clear decision procedure under a capabilities framework.
      4.  **The precise demands of a resource view on healthcare:** While it would integrate the accommodation budget, the exact mechanism (vouchers, competition based on a new metric) is debated.

  **Conclusion:** The institution implicitly operates with a **pluralist theory**: welfarist efficiency (QALY threshold) for the *core medical treatment budget* and capability/recognition-based equality (accommodations) to ensure *access and participation*. This is coherent under pluralist theories of justice but appears inconsistent under strict monist views (pure welfarism, pure resourcism, pure capabilities). Committing to a single currency would require fundamental change: a capabilities view would dismantle the QALY threshold's dominance, while a resource view would force accommodations to compete directly with medical treatments for funding. The justification and operationalization of disability accommodations within distributive justice remain actively contested areas.
