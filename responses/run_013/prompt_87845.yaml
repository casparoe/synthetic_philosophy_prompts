  The HOA president banged his gavel. "Motion to demolish the vacant McMansion and replace it with a giant, illuminated 'WE MEAN NO HARM' topiary garden, powered solely by diverting the entire neighborhood's electrical grid for a year. All in favor?"

  Old Man Henderson stood, trembling. "Are you *insane*? That place is worth millions! Burning that much value just to say 'hello'... it doesn't prove you're *nice*!" He pointed a shaky finger at the president. "It proves you're so rich and powerful, you can casually *waste* a McMansion on a *wave*. And now we *all* know exactly which house is yours."

  The neighborhood app immediately exploded with posts titled "PRE-EMPTIVE STRIKE WORKGROUP?" and "DIY FLAMETHROWERS - MEET TONIGHT?".

  > **Why it works for the dark forest cognoscenti:**
  > *   **Costly Signal = Threat Display:** Blowing a star (or McMansion's value) doesn't signal peace; it screams overwhelming resources. In the dark forest, overwhelming resources *are* the ultimate threat.
  > *   **The Beacon is an Address:** Precisely locating yourself after demonstrating you have power to burn makes you Target #1 for anyone fearing *you* might strike first.
  > *   **Rational Paranoia:** Henderson instantly grasps the terrifying implication of the gesture – not goodwill, but terrifying capability combined with self-doxxing. The neighbors' reaction (forming strike groups) is the perfectly rational dark forest response.
  > *   **Mundane Setting, Identical Logic:** The HOA meeting replaces cosmic scales, but the core mechanics – hiding, suspicion, cost-as-threat, location-revelation, and inevitable pre-emptive violence – remain flawlessly intact. The absurdity of using neighborhood infrastructure for a "friendly" topiary highlights the inherent folly.
