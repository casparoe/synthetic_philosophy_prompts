prompt: |-
  I keep hitting the Judy Benjamin case and I want the spec before I read any more proposed fixes. Setup as I have it: Judy's lost in a war zone and her space has four cells -- Blue HQ, Blue second company, Red HQ, Red second company -- each at 1/4. A reliable source tells her only: if you're in Red, you're in Red HQ. She hasn't learned she's in Red; she's learned a conditional. My gut says the Blue numbers shouldn't budge, so something like 1/4, 1/4, 1/2, 0, but if you read the conditional as material and minimize relative information subject to giving it probability 1, you kill the Red-second-company cell and land on 1/3 apiece for the other three, which drags Blue up to 2/3. So: write the desiderata a theory of updating on conditionals has to meet, each with the case behind it. Which of these can it not dodge -- getting the Judy case right, keeping propositions the evidence says nothing about rigid, explaining why 'you're in Red or Blue HQ' (plain conditioning, same three cells) and the conditional come apart when the material reading makes them the same proposition, handling a source who's only 90% reliable, handling the fact that the source chose to utter that particular conditional rather than something stronger, and coping with a conditional about Judy's own future choice ('if I take the bet I'll win') where the material reading looks worse still? Also: must the update commute with coarsening -- merge the two Red cells, update, then split -- or is partition-sensitivity a genuine cost? Flag which subset cant be had together, and tell me which single requirement does the most to exclude candidates. I'd guess rigidity or the material-conditional one, but I want the argument, not the guess. Skip the scorecard.
reasoning: |-
  We are dealing with Judy Benjamin's update problem. The setup:

  - Four cells: BHQ (Blue HQ), BSC (Blue second company), RHQ (Red HQ), RSC (Red second company)
  - Prior: uniform, each 1/4.

  Evidence: a reliable source says "If you are in Red territory, then you are in Red HQ." 
    This is a conditional: Red → RHQ.

  We note that the material conditional ¬Red ∨ RHQ is equivalent to: (BHQ or BSC or RHQ) because:
    ¬Red = Blue = BHQ or BSC, and RHQ is RHQ. So the material conditional is true in every cell except RSC.

  Thus, if we update by conditioning on the material conditional, we set P(RSC) = 0 and renormalize:
    P(BHQ) = 1/3, P(BSC)=1/3, P(RHQ)=1/3, P(RSC)=0.

  But this gives Blue (BHQ and BSC) a total probability of 2/3. Intuition (the gut reaction) is that the Blue probabilities should remain at 1/2 (each Blue cell at 1/4, so total Blue 1/2) because the evidence only says something about Red.

  We are to write desiderata for a theory of updating on conditionals:

  1. **Getting Judy Benjamin right**: The update should not change the probability of the Blue cells (so they remain 1/4 each, and the total Blue remains 1/2). The evidence only tells us about Red, so within Red we get RHQ with probability 1 (so RSC becomes 0). Hence the posterior should be: BHQ=1/4, BSC=1/4, RHQ=1/2, RSC=0.

  2. **Rigidity (invariance) for irrelevant parts**: The evidence says nothing about Blue, so the probabilities of the Blue cells should not change (they remain 1/4 each). Similarly, the relative probabilities of the Blue cells to each other should remain the same (they were equal and remain equal).

  3. **Distinguishing conditionals from material conditionals**: The update based on the conditional "if Red then RHQ" should yield a different result from updating on the material conditional (which is equivalent to ¬Red ∨ RHQ). This is because the material conditional is a disjunction that includes the entire Blue territory and RHQ, and thus it rules out only RSC. But the conditional, in the context of the utterance, might be interpreted differently.

  4. **Handling uncertain reliability**: The source might be only 90% reliable. We would then have a situation where the evidence is not certain. How should the update account for that?

  5. **The choice of utterance**: Why did the source choose to say "if Red then RHQ" and not something stronger? This might indicate that the source does not know whether Judy is in Blue or Red, so they only condition on the Red part.

  6. **Conditionals about future choices**: For instance, "if I take the bet I will win". The material conditional reading of this would be: either I don't take the bet or I take and win. But updating on this material conditional might lead to an inappropriate change in the probability of taking the bet. We need an update that respects the causal or evidential structure.

  7. **Commuting with coarsening**: If we first merge the two Red cells (so we have three cells: BHQ, BSC, and Red) and update, then split the Red cell appropriately, we should get the same result as updating on the original four cells and then merging. Alternatively, we might accept that the update is partition-sensitive.

  Now, which of these cannot be had together? And which requirement does the most to exclude candidates?

  The most controversial is the rigidity requirement (desideratum 2). The standard conditioning on the material conditional violates rigidity for Blue. Also, the conditional is not the same as the material conditional (desideratum 3). So any theory that updates by conditioning on the material conditional will fail desiderata 2 and 3.

  The argument:

  - The material conditional update (getting 1/3 for each of BHQ, BSC, RHQ) does not leave the Blue probabilities invariant (they go from 1/2 to 2/3). So it fails desideratum 2.

  - Also, the conditional "if Red then RHQ" is intended to be about the Red territory, and the material conditional is a disjunction that includes the Blue territory. So they are different in meaning (even though logically equivalent in truth conditions) and the update should reflect that. Hence, we want the update to be different from conditioning on the material conditional. Thus, desideratum 3 is important.

  The most excluding requirement is likely the rigidity requirement (desideratum 2) because it forces the update to leave the Blue probabilities unchanged. This requirement alone rules out the material conditional update and many others.

  However, note that the rigidity requirement and the requirement to get the Judy Benjamin case right (desideratum 1) are aligned in this case: we want Blue to remain at 1/2 and each Blue cell at 1/4. So desideratum 1 and 2 are consistent and together they require that the update only redistributes the probability within the Red cells.

  But what update rule does that? We can update by conditioning on the material conditional only within the Red territory? That is, we set P(RSC | Red) = 0 and P(RHQ | Red) = 1, but leave the probability of Red and Blue unchanged? But note that the evidence does not directly say that RSC is impossible; it says that if she is in Red then she is in RHQ. This suggests that we should set the conditional probability of RHQ given Red to 1. So we are updating the conditional probability of the cells given Red.

  This leads to the following:

    P(RHQ | Red) = 1
    P(RSC | Red) = 0

  and we leave the marginal probability of Red and Blue unchanged? But the marginal probability of Red is 1/2. Then:

    P(RHQ) = P(RHQ | Red) * P(Red) = 1 * 1/2 = 1/2
    P(RSC) = 0

  and the Blue cells remain at 1/4 each.

  This is exactly the desired posterior: BHQ=1/4, BSC=1/4, RHQ=1/2, RSC=0.

  This update is known as *conditionalization* or *Jeffrey conditionalization* on the partition {Red, Blue} with the constraint that given Red, the probability is concentrated on RHQ. Specifically, we are updating the conditional probability of the cells given Red.

  But note: the evidence does not directly give us a new probability for Red. It only tells us about the distribution within Red. So we are updating the conditional distribution within Red without changing the odds between Red and Blue.

  This update rule is sometimes called "updating on a conditional" by setting the conditional probability. It can be generalized as:

    We have a partition {A_i}. We receive evidence that within a particular part A, the probability is redistributed to a subpartition B of A (so that P(B|A)=1). Then we set:
      P_new(B) = P_old(A)   (since P(B|A)=1, then P(B) = P(A))
      and for any subset C of A that is disjoint from B, P_new(C)=0.
      The probabilities outside A remain unchanged.

  This rule satisfies desiderata 1 and 2.

  But what about the material conditional? The material conditional is ¬Red ∨ RHQ. The update we did does not set this material conditional to 1. In fact, the material conditional is true in all cells except RSC. In our posterior, RSC has probability 0, so the material conditional has probability 1. So the posterior does assign probability 1 to the material conditional. However, the update rule we used is not conditioning on the material conditional. We used a rule that only changes the conditional distribution within Red. So we have satisfied the condition that the material conditional is true (as we must, because the conditional implies the material conditional) but without conditioning on it.

  So desideratum 3 is satisfied because the update rule we used is different from conditioning on the material conditional, even though the end result makes the material conditional true.

  Now, for the other desiderata:

  4. **Handling uncertain reliability**: If the source is only 90% reliable, then we might not set P(RHQ | Red) to 1, but to 0.9? And leave 0.1 for RSC? But note the evidence is then uncertain. We might then use a Jeffrey-style update that sets:
        P_new(RHQ) = P_old(RHQ) * (0.9) / [P_old(RHQ) + 0.9 * P_old(RSC)]   ??
     Actually, we are updating the conditional probability within Red. So we set:
        P_new(RHQ | Red) = 0.9
        P_new(RSC | Red) = 0.1
     and leave the marginal P(Red) unchanged? Then:
        P_new(RHQ) = 0.9 * P_old(Red) = 0.9 * 1/2 = 0.45
        P_new(RSC) = 0.1 * 1/2 = 0.05
     and Blue remains 1/2 (each Blue cell 0.25). This seems reasonable.

  5. **Choice of utterance**: The source chose to say the conditional rather than, say, "you are in RHQ". This might be because the source does not know whether Judy is in Blue or Red. So the source only has information about the Red territory. This fits our update: we are only updating within Red.

  6. **Conditionals about future choices**: Consider "if I take the bet I will win". We don't want to update by conditioning on the material conditional (¬take ∨ win) because that would make the probability of not taking the bet go up (which might be undesirable). Instead, we might want to update the conditional probability of winning given taking the bet. So we set:
        P(win | take) = 1   (if we take the evidence as certain)
     and then we leave the marginal probability of taking the bet unchanged? But note: this might be problematic if taking the bet is causally linked to winning. However, in the evidential update, we are only changing the conditional probability. This is the approach of *Adams conditioning* or *conditional probability kinematics*.

     Example: Prior: P(take)=0.5, P(win|take)=0.6, P(win|¬take)=0 (say). Then we update by setting P(win|take)=1. Then:
        P_new(win, take) = 1 * P_new(take) = P_old(take) = 0.5? 
        But note: we are not changing P(take). So:
          P_new(take) = P_old(take) = 0.5
          P_new(win | take) = 1 => P_new(win and take) = 0.5
          P_new(win and ¬take) = 0 (from prior) so P_new(win) = 0.5
          P_new(¬win and take) = 0
          P_new(¬take) = 0.5, and P_new(¬win | ¬take)=1, so P_new(¬win and ¬take)=0.5.

     This update does not change the probability of taking the bet. But it does change the probability of winning: from 0.3 (0.5*0.6) to 0.5. This might be acceptable if the evidence is interpreted as changing our belief about the chance of winning given we take the bet.

     However, note that the material conditional update would condition on ¬take ∨ win. The prior probability of this material conditional is:
          P(¬take ∨ win) = 1 - P(take and ¬win) = 1 - 0.5*0.4 = 0.8.
     Conditioning on it would set:
          P_new(take and ¬win) = 0
          and renormalize by dividing by 0.8: 
            P_new(take and win) = (0.5*0.6) / 0.8 = 0.3/0.8 = 0.375
            P_new(¬take and win) = 0? (but in our prior we had 0) but actually we might have non-zero? Let's assume prior: 
              take and win: 0.3, take and ¬win:0.2, ¬take and win:0, ¬take and ¬win:0.5.
            Then conditioning on ¬take ∨ win (which is true in all states except take and ¬win) we set:
              take and win: 0.3/0.8 = 0.375
              ¬take and win: 0/0.8 = 0
              ¬take and ¬win: 0.5/0.8 = 0.625
            So P_new(take) = 0.375, which is less than 0.5.

     So the update on the material conditional changes the probability of taking the bet (from 0.5 to 0.375). The conditional update does not. The latter seems more appropriate if the evidence is about what happens if we take the bet, not about whether we take it.

  7. **Commuting with coarsening**: Consider coarsening the partition by merging the two Red cells. Then we have three cells: BHQ, BSC, and Red (which includes RHQ and RSC). The prior is (1/4, 1/4, 1/2). The evidence is: "if you are in Red, then you are in Red HQ". In the coarsened partition, this evidence might be interpreted as: if you are in the Red cell (which is the merged cell) then ... but we don't have a split of the Red cell anymore. So we cannot update the conditional within Red because we don't have the subcells. Therefore, we cannot perform the update in the coarsened partition.

     Alternatively, if we first update in the four-cell partition and then merge, we get:
          BHQ: 1/4, BSC:1/4, RHQ:1/2, RSC:0 -> merging Red: RHQ and RSC become 1/2+0=1/2. So the merged partition has (1/4,1/4,1/2).

     But if we try to update in the coarsened partition, we are stuck: the evidence is about a conditional that requires the finer partition. Therefore, the update does not commute with coarsening. This is a genuine partition-sensitivity.

     We might argue that the evidence is only meaningful in the finer partition. So the update rule is only defined when the partition is fine enough to express the conditional. This is a cost, but a necessary one.

  Conclusion:

  - The update rule that sets the conditional probability within the antecedent (here, setting P(RHQ|Red)=1 and P(RSC|Red)=0) and leaves the rest unchanged satisfies:
        Desideratum 1 (Judy Benjamin right): yes.
        Desideratum 2 (rigidity for Blue): yes.
        Desideratum 3 (distinguishing from material conditional update): yes, because we do not condition on the material conditional; we do a different operation.
        Desideratum 4 (uncertain reliability): extendable by setting the conditional probability to a value less than 1.
        Desideratum 5 (choice of utterance): the update only touches the Red part, which is consistent with the source not knowing about Blue.
        Desideratum 6 (future choice): extendable by updating the conditional probability without changing the marginal of the antecedent.

  - But it fails to commute with coarsening (desideratum 7) because the update requires the partition to have the antecedent and the consequent split appropriately.

  Therefore, the rigidity requirement (desideratum 2) is the one that forces the update to be of the conditional-probability-kinematics style and thus excludes the material conditional update and others that change the Blue probabilities.

  The requirement that does the most to exclude candidates is the rigidity requirement because it demands that the update does not change probabilities of events that the evidence does not bear upon. This is a strong invariance principle.

  However, note that the update rule we have described is not without controversy. Some argue that the evidence "if you are in Red then you are in RHQ" should be interpreted as restricting the space to the three cells (BHQ, BSC, RHQ) and thus the update should be conditioning on that set (yielding 1/3 each). But that violates rigidity. The controversy remains.

  But given the desiderata, the conditional probability kinematics update is the best candidate.

  So the answer: the rigidity requirement (desideratum 2) is the one that does the most to exclude candidate update rules.
answer: |-
  ### Desiderata for Updating on Conditionals, with the Judy Benjamin Case

  The Judy Benjamin case highlights challenges in updating beliefs upon learning a conditional statement. Below are the key desiderata a theory must satisfy, each motivated by the case and related considerations. The case setup: Uniform prior over four cells—Blue HQ (BHQ), Blue second company (BSC), Red HQ (RHQ), Red second company (RSC)—each with probability \( \frac{1}{4} \). A reliable source states: "If you are in Red territory, then you are in Red HQ" (i.e., \( \text{Red} \rightarrow \text{RHQ} \)).

  1. **Correct Handling of Judy Benjamin (Intuitive Rigidity for Unrelated Propositions)**  
     - **Requirement**: Learning the conditional should not alter probabilities for propositions the evidence *does not mention*. The evidence only concerns Red territory, so Blue probabilities should remain unchanged.  
     - **Case Justification**: Intuition suggests the Blue cells (BHQ, BSC) should stay at \( \frac{1}{4} \) each (total Blue: \( \frac{1}{2} \)), with Red probability concentrated on RHQ (i.e., posterior: \( \text{BHQ} = \frac{1}{4} \), \( \text{BSC} = \frac{1}{4} \), \( \text{RHQ} = \frac{1}{2} \), \( \text{RSC} = 0 \)).  
     - **Violation Example**: Material conditional update (\( \neg \text{Red} \lor \text{RHQ} \)) eliminates RSC and yields uniform \( \frac{1}{3} \) over BHQ, BSC, RHQ, raising Blue probability to \( \frac{2}{3} \).

  2. **Rigidity Under Partial Information**  
     - **Requirement**: If evidence is silent on a part of the space, relative probabilities within that part remain fixed.  
     - **Case Justification**: The conditional only restricts *Red*; it says nothing about Blue. Thus, ratios within Blue (BHQ:BSC) should stay 1:1, and the probability mass of Blue (\( \frac{1}{2} \)) should be preserved.  
     - **Violation Example**: Material conditional update alters BHQ:BSC ratio (still 1:1) but inflates Blue mass to \( \frac{2}{3} \), violating rigidity.

  3. **Distinction from Material Conditional**  
     - **Requirement**: Updating on a conditional \( A \rightarrow B \) must differ from updating on the material conditional \( \neg A \lor B \).  
     - **Case Justification**:  
       - Material conditional \( \neg \text{Red} \lor \text{RHQ} \) is true in BHQ, BSC, RHQ (same as "you are in Blue or RHQ").  
       - Learning "Blue or RHQ" via conditioning eliminates RSC and yields uniform \( \frac{1}{3} \) over BHQ, BSC, RHQ.  
       - But the source *uttered a conditional*, not a disjunction. The two updates *should* differ: the conditional is *about Red*, while the disjunction includes Blue.  
     - **Violation Example**: Material conditional update treats \( \text{Red} \rightarrow \text{RHQ} \) as identical to \( \text{Blue} \lor \text{RHQ} \), erasing the distinction.

  4. **Robustness to Uncertain Reliability**  
     - **Requirement**: The update must gracefully handle sources with less than 100% reliability (e.g., 90% reliable).  
     - **Case Justification**: If the source is 90% reliable, the update should:  
       - Increase probability of RHQ *given Red*, but not eliminate RSC entirely.  
       - Not arbitrarily alter Blue probabilities.  
     - **Violation Example**: Material conditioning on \( \neg \text{Red} \lor \text{RHQ} \) forces RSC to 0 even with unreliable sources. Better: Shift probability *within Red* (e.g., \( P(\text{RHQ}|\text{Red}) = 0.9 \), \( P(\text{RSC}|\text{Red}) = 0.1 \)), preserving Blue.

  5. **Sensitivity to Utterance Choice**  
     - **Requirement**: The update should reflect *why the source chose* this conditional (e.g., they lack knowledge of \( A \) in \( A \rightarrow B \)).  
     - **Case Justification**: The source said "if Red, then RHQ"—not "you are in RHQ"—implying they don’t know if Judy is in Red. Thus:  
       - They restrict only the *Red* subcase.  
       - Blue should be unaffected.  
     - **Violation Example**: Material conditional update fails this—it doesn't encode the source's epistemic state.

  6. **Handling Conditionals About Future Choices**  
     - **Requirement**: For conditionals like "if I take the bet, I win" (\( \text{Take} \rightarrow \text{Win} \)), updating must not conflate with \( \neg \text{Take} \lor \text{Win} \).  
     - **Justification**:  
       - Material conditional update \( \neg \text{Take} \lor \text{Win} \) inflates \( P(\neg \text{Take}) \) (undermining autonomy).  
       - Desired: Update \( P(\text{Win} | \text{Take}) \) to 1 without altering \( P(\text{Take}) \).  
     - **Violation Example**: Material conditional update alters \( P(\text{Take}) \), violating intuitions about self-locating conditionals.

  7. **Commutation with Coarsening (Partition-Invariance)**  
     - **Requirement**: Updating then coarsening should match coarsening then updating.  
     - **Case Test**:  
       - Coarsen: Merge Red cells → {BHQ, BSC, Red}.  
       - Update on conditional: But coarsened space lacks RHQ/RSC distinction!  
       - Desired: Update on finer partition, then merge → BHQ: \( \frac{1}{4} \), BSC: \( \frac{1}{4} \), Red: \( \frac{1}{2} \).  
       - Issue: Coarsening first loses granularity, making update impossible.  
     - **Cost**: Genuine partition-sensitivity. Theories violating this may be acceptable if updates require fine partitions.

  ### Conflicts and Key Excluding Requirement
  - **Conflicts**:  
    - **Rigidity (2) vs. Material Conditional (3)**: Satisfying rigidity (e.g., leaving Blue unchanged) forces the update to differ from material conditioning (which drags Blue to \( \frac{2}{3} \)).  
    - **Rigidity (2) vs. Coarsening (7)**: Rigidity requires updating within the *mentioned* partition (Red). Coarsening destroys this partition, so commutation fails.  
    - **Utterance Choice (5) vs. Material Conditional (3)**: The source’s choice implies they lack knowledge of the antecedent; material conditioning ignores this.  

  - **Most Excluding Requirement**:  
    **Rigidity (Requirement 2)** is the strongest constraint.  
    - **Why**: It demands that *unrelated probabilities remain fixed*, directly contradicting material conditional updates (which redistribute mass globally). It also forces partition-sensitive updates (violating 7) and requires distinguishing conditionals from disjunctions (3).  
    - **Argument**: Rigidity is core to intuitive belief updating—evidence shouldn’t alter irrelevant beliefs. Violating it (e.g., inflating Blue to \( \frac{2}{3} \)) is the central paradox of Judy Benjamin. Theories that abandon rigidity (e.g., standard conditioning) fail the case. Conversely, rigidity-compliant updates (e.g., **conditional probability kinematics**) handle Judy Benjamin correctly: set \( P(\text{RHQ}|\text{Red}) = 1 \), preserve Blue, and satisfy 1, 3–6, but sacrifice 7.

  ### Summary
  - **Non-Negotiable**: Rigidity (2) and distinguishing conditionals (3) are essential for Judy Benjamin.  
  - **Tradeoff**: Rigidity entails partition-sensitivity (7)—a justifiable cost.  
  - **Strongest Constraint**: Rigidity excludes most candidates (e.g., material conditioning) and shapes viable theories (e.g., kinematics).
