answer: |-
  Here's the translation of the ethical debate into common-law terms, followed by a residue report assessing fidelity, distortions, and gaps. I'll flag confidence levels throughout and identify the least certain point.

  ---

  ### **Restatement in Common-Law Vocabulary**

  #### **1. Core Position: Moral Knowledge via Exemplars as Precedent**  
  - **Claim:** Moral learning operates through *stare decisis* applied to exemplary lives. Each exemplar is a **binding precedent**, with their actions constituting the *ratio decidendi* (core moral principle) of their "case." Biography becomes moral pedagogy by presenting these precedents for analogical reasoning. Plutarch’s paired biographies function like **split-circuit precedents** (e.g., contrasting Athenian vs. Spartan jurisdictions), allowing moral "distinguishing" between contexts.  
  - **What Binds vs. Persuades:** The *ratio* (essential virtuous action/choice) binds morally; circumstantial details (*obiter dicta*) merely persuade. Studying Caesar teaches *when decisive action* (ratio) binds, not his specific battles (dicta).  
  - **Confidence:** High (90%). The analogical structure maps cleanly: exemplars = cases, moral principles = *ratio*.  

  #### **2. Hagiographic Distortion as Bad Law Reporting**  
  - **Objection:** Saints' lives are **unreported cases** or those with corrupted *headnotes*. Hagiography edits facts to flatter, turning the exemplar into *dicta* without binding *ratio* (e.g., omitting a saint’s moral failures). This violates the "duty of candor" in moral precedent.  
  - **What Binds vs. Persuades:** Only historically verified actions can yield binding *ratio*; idealized embellishments are non-binding *persuasive authority*.  
  - **Confidence:** High (85%). Legal concern for factual integrity parallels ethical worries about idealization.  

  #### **3. Inimitability as Non-Binding Dicta**  
  - **Objection:** An "inimitable saint" (e.g., fasting on a pillar) is a case with **no extractable *ratio***—their actions are pure *obiter dicta*. Like an eccentric judicial opinion (e.g., "I rule for Plaintiff because Jupiter aligns with Mars"), it lacks generalizable principle. Thus, it persuades but cannot bind.  
  - **What Binds vs. Persuades:** Only *ratio* (universalizable aspects of virtue) binds; superhuman feats are *dicta* with no precedential weight.  
  - **Confidence:** Moderate (75%). Legal *dicta* are non-binding but still reasoned; "inimitable" acts may lack even that.  

  #### **4. Plutarch’s Pairs as Jurisdictional Comparison**  
  - **Method:** Comparing Lycurgus vs. Numa is like comparing **precedents from different circuits** (Spartan "law" vs. Roman "law"). Differences highlight how context (*facts of the case*) affects the application of virtue (*ratio*). Allows "distinguishing" when applying exemplars to new situations.  
  - **What Binds vs. Persuades:** The underlying *ratio* (e.g., "justice requires cultural adaptation") binds; specific cultural expressions are *dicta*.  
  - **Confidence:** High (80%). Cross-jurisdictional comparison is a core case-law technique.  

  #### **5. Exemplarism vs. Codification**  
  - **Contrast:** Exemplarism is **case law**; rule-based ethics (Kantianism, utilitarianism) is **codification**. Codification seeks universal statutes (maxims); case law builds principles incrementally through analogical reasoning from particulars.  
  - **What Binds vs. Persuades:** Codification binds via abstract rules; exemplarism binds via the *ratio* of accumulated precedents.  
  - **Confidence:** Very High (95%). Direct match to common-law vs. civil-code traditions.  

  ---

  ### **Residue Report: What Survives, Distorts, or Vanishes**  

  #### **Intact Through Translation**  
  1. **The structure of analogical reasoning** (90%).  
     - *Why:* Both systems rely on pattern-matching particulars to derive guidance.  
  2. **Critique of distortion** (85%).  
     - *Why:* Flawed reporting undermines authority in both law and hagiography.  
  3. **Context-sensitivity** (Plutarch’s pairs as jurisdictional splits) (80%).  
     - *Why:* Distinguishing cases based on facts mirrors adjusting exemplars to cultural contexts.  

  #### **Distorted by Translation**  
  1. **Supererogation as "Non-Binding Dicta"** (60%).  
     - *Distortion:* Legal *dicta* are non-binding but still *reasoned*; supererogatory acts (e.g., martyrdom) may be inspirational but rationally *incommensurable*. The legal frame implies they could be binding if generalizable, but ethics sees them as categorically beyond duty.  
     - *Gap Highlighted:* Supererogation exposes a limit of rule-based reasoning—exemplars inspire *because* they transcend obligation. Legal precedent cannot capture this "beyond-duty" quality.  
  2. **Emotional/Imaginative Engagement** (50%).  
     - *Distortion:* Moral exemplars motivate through affective resonance (awe, emulation); legal precedents bind through institutional authority. Calling both "precedent" flattens the role of emotion in ethics.  
     - *Gap Highlighted:* Ethics requires *inspiration*; law requires *compliance*.  

  #### **No Common-Law Counterpart**  
  1. **The Voluntary Aspect of Imitation** (0%).  
     - *Residue:* One *chooses* to emulate an exemplar; a judge *must* follow binding precedent. No legal equivalent to the free adoption of a role model.  
     - *Real Gap?:* Yes—moral development hinges on personal agency in a way legal reasoning does not.  
  2. **Exemplars as Unconscious Templates** (0%).  
     - *Residue:* We internalize exemplars as tacit norms (e.g., "What would X do?"). Legal precedent requires explicit citation.  
     - *Real Gap?:* Yes—moral psychology operates pre-rationally; law is deliberative.  

  ---

  ### **Side Question: Case Method for Moral vs. Legal Learning**  
  The case method is a **better model for moral learning** than for legal learning.  
  - *Why:*  
    - **Moral:** Cases (exemplars) supply rich narrative context for virtue, accommodating ambiguity and emotion—key to moral development. Rules emerge organically (*ratio*) from lived experience.  
    - **Legal:** Real-world adjudication relies on statutes, regulations, and policy—not just precedent. The case method overemphasizes judicial reasoning at the expense of legislative/administrative law.  
  - *Confidence:* 85%. Supported by MacIntyre's narrative ethics vs. legal realism critiques.  

  ---

  ### **Confidence Assessment & Least Certain Point**  
  - **High Confidence (>80%):** Structural parallels (precedent-as-exemplar, codification critique), Plutarch as jurisdictional comparison.  
  - **Moderate Confidence (60-75%):** Supererogation as *dicta*, case method's pedagogical value.  
  - **Least Certain Point:** **Equating inimitability with non-binding *dicta*** (Confidence: 50%).  
    - *Why:* Legal *dicta* still shape future reasoning (e.g., as persuasive authority). Truly "inimitable" exemplars (e.g., a hermit’s asceticism) may offer *no* actionable *ratio*, functioning more like a vacated precedent. This risks over-intellectualizing moral awe.  

  **Conclusion:** The legal frame clarifies how exemplars *bind* (via *ratio*) but obscures how they *inspire*. The residue (supererogation, agency, emotion) marks a real gap: exemplarism’s power lies in transcending obligation, while precedent’s power lies in enforcing it. Your redescription is robust for the "logic" of exemplarism but muffles its "poetics."
