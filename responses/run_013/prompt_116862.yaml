  Possible interpretations: It could be a trivial claim that biographies are inspiring (platitude), or a strong one that rules are useless (radical). I need to categorize them from trivial to radical. For each, I'll assess if it's defensible and whether it supports dismissing the principles-and-cases approach.

  Key distinctions to cover:
  - Learning that (knowledge) vs. learning how (skill): Virtue might be more like a skill, so lives show how to apply it contextually.
  - Emulation vs. admiration: Biographies might evoke admiration, but does that lead to real emulation? Hagiography could be idealized, unlike Plutarch's critical lives.
  - Particular vs. general: Lives are specific stories, while rules are abstract generalizations. But principles can be derived from cases.
  - Motivational vs. epistemic role: Narratives might motivate us emotionally, but do they provide reliable knowledge?
