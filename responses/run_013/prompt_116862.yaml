answer: |-
  Below is a systematic analysis of the slogan "We learn virtue from lives, not from rules," structured as a "menu" of possible interpretations. I'll outline each thesis from trivial to radical, assess its defensibility (platitude, substantive/defensible, or false), and evaluate whether it supports your colleague's dismissal of principles-and-cases approaches. I'll then suggest key readings that turn on the distinctions you requested (e.g., learning-that vs. learning-how, emulation vs. admiration). Finally, I'll conclude with what I suspect your colleague had in mind and its implications for moral education.

  The slogan is ambiguous and can be parsed along several axes:
  - **Scope**: Does it claim lives are *necessary*, *sufficient*, or *superior* to rules?
  - **Mechanism**: Is it about motivation, understanding, skill acquisition, or justification?
  - **Epistemology**: Does it concern how we *know* virtue, how we *learn* it, or how we *practice* it?

  I present six theses, ordered from least to most radical, with readings that illuminate the relevant distinctions.

  ---

  ### 1. **Trivial Motivational Thesis**  
     *Claim*: Lives (biographies) are uniquely effective at *motivating* moral emulation by engaging emotions (e.g., admiration, empathy), while rules are abstract and inert.  
     *Defensibility*: **Platitude**. It's widely accepted that narratives inspire action (e.g., Aristotle on *pathos*), but rules can also motivate through duty or reason (e.g., Kant).  
     *Supports dismissal?* **No**. Principles-and-cases can incorporate narratives (e.g., case studies as micro-biographies), so this doesn't undermine the approach.  
     *Key Distinctions*: Motivational role of narratives vs. rules; admiration (passive) vs. emulation (active).  
     *Readings*:  
       - Martha Nussbaum, *Love's Knowledge* (1990) – Explores how literature (including biography) engages emotions for moral motivation.  
       - Jonathan Haidt, "The Emotional Dog and Its Rational Tail" (2001) – Argues intuition/emotion drives moral judgment, with reason as post-hoc justification.  

  ### 2. **Anti-Reductionist Thesis**  
     *Claim*: Virtue cannot be fully *reduced* to codifiable rules because it involves context-sensitive judgment (e.g., *phronesis*); lives show the "thick" particularity of virtue in action.  
     *Defensibility*: **Substantive and defensible**. Echoes Aristotle (*Nicomachean Ethics*) and Wittgenstein on rule-following: rules underdetermine action in complex situations.  
     *Supports dismissal?* **Partially**. It challenges *over-reliance* on rules but not cases, which offer contextual examples. Principles-and-cases could still teach *how* to apply rules contextually.  
     *Key Distinctions*: Particular (lives) vs. general (rules); learning-how (virtue as skill) vs. learning-that (propositional knowledge).  
     *Readings*:  
       - Aristotle, *Nicomachean Ethics* (Book VI) – Virtue as *phronesis* (practical wisdom) requiring experience, not just rules.  
       - John McDowell, "Virtue and Reason" (1979) – Argues moral knowledge is perceptual, not rule-based.  

  ### 3. **Epistemic Priority Thesis**  
     *Claim*: We grasp the *meaning* of virtue concepts (e.g., courage) primarily through concrete exemplars in narratives, not abstract definitions. Rules are secondary "summaries" of lived virtue.  
     *Defensibility*: **Substantive and defensible**. Supported by exemplarist virtue ethics (e.g., Zagzebski): we understand "courage" by seeing it in Achilles, not a dictionary.  
     *Supports dismissal?* **Yes, weakly**. It prioritizes biographies over rules but not over cases, which also provide concrete examples. Hagiography risks idealization, undermining this.  
     *Key Distinctions*: Epistemic role of narratives (showing concepts) vs. rules (defining them); admiration as a source of moral knowledge.  
     *Readings*:  
       - Linda Zagzebski, *Exemplarist Moral Theory* (2017) – Proposes virtue is learned through direct reference to exemplars.  
       - Alasdair MacIntyre, *After Virtue* (1981) – Links moral understanding to narrative traditions, contrasting with Enlightenment rule-based ethics.  

  ### 4. **Skill-Acquisition Thesis**  
     *Claim*: Virtue is a *practical skill* (like carpentry) learned through apprenticeship/imitation of models, not theoretical instruction. Lives provide "how-to" demonstrations; rules are mere manuals.  
     *Defensibility*: **Substantive and defensible**. Draws from Aristotle and Ryle: moral learning is "knowing-how" embedded in practice (e.g., emulating a mentor).  
     *Supports dismissal?* **Yes, moderately**. Principles-and-cases may teach *about* virtue but not *how* to embody it, missing the non-cognitive aspects of skill acquisition. Biography could be essential for emulation.  
     *Key Distinctions*: Learning-how (emulation) vs. learning-that (rules); motivational vs. epistemic roles (narratives fuse both).  
     *Readings*:  
       - Gilbert Ryle, *The Concept of Mind* (1949) – Distinguishes "knowing-how" from "knowing-that"; virtue as a dispositional skill.  
       - Nancy Sherman, *The Fabric of Character* (1989) – Analyzes Aristotle on moral education as habituation through role models.  

  ### 5. **Motivational Exclusivity Thesis**  
     *Claim*: Only lives can *motivate* moral *change* because they engage identity and desire ("I want to be like her"), while rules provoke resistance or cold compliance.  
     *Defensibility*: **False**. Rules can motivate through reasoned commitment (e.g., Kantian duty), and biographies can demotivate (e.g., "Saints are unattainable").  
     *Supports dismissal?* **Yes, but overstrong**. If true, it would invalidate rules-based approaches, but evidence shows mixed results (e.g., psychology of "do as I say, not as I do").  
     *Key Distinctions*: Emulation (active modeling) vs. admiration (passive feeling); Plutarch’s critical lives vs. hagiography’s idealization.  
     *Readings*:  
       - Timothy Wilson, *Strangers to Ourselves* (2002) – On narrative identity and motivation; but notes rules can shape behavior via introspection.  
       - Plutarch, *Parallel Lives* (e.g., "Alexander and Caesar") – Contrasts flawed heroes, inviting critical engagement vs. uncritical idealization in hagiography.  

  ### 6. **Radical Particularist Thesis**  
     *Claim*: Moral rules are *always* misleading or false because virtue is irreducibly context-dependent; only studying diverse lives can cultivate flexible judgment.  
     *Defensibility*: **False** (or overstated). Extreme particularism (e.g., Dancy) denies general rules, but this ignores how principles guide novice learners and enable consistency.  
     *Supports dismissal?* **Yes, decisively**—but it’s indefensible. Rules + cases can handle context (e.g., casuistry); hagiography often ignores context by idealizing.  
     *Key Distinctions*: Particular (unique lives) vs. general (rules); Plutarch’s comparative method vs. hagiography’s singularity.  
     *Readings*:  
       - Jonathan Dancy, *Ethics Without Principles* (2004) – Argues for moral particularism; critiques rules as rigid.  
       - Suzanne Fagence Cooper, *The Victorian Hagiography* (2001) – Examines how idealized biographies can distort moral learning by removing context.  

  ---

  ### Conclusion: What Your Colleague Likely Meant and Implications  
  I suspect your colleague had in mind a blend of the **Skill-Acquisition Thesis (#4)** and **Epistemic Priority Thesis (#3)**, emphasizing *emulation* and *practical wisdom* over theoretical rules. This draws from Aristotelian virtue ethics and the tradition from Plutarch (which she invoked) but risks conflating it with later hagiography. Plutarch’s *Parallel Lives* supports this: he pairs flawed figures (e.g., "Demosthenes and Cicero") to model contextual judgment, not perfect virtue. However, hagiography (e.g., medieval saints' lives) often presents unattainable ideals, which may inspire admiration but not emulation—undermining the slogan if overgeneralized.

  **Implications for moral education**:  
  - **Biography is valuable but insufficient**: Lives excel at teaching moral perception, motivation, and "how-to" skills through exemplars. But principles-and-cases can complement this by teaching critical reasoning, consistency, and handling novel dilemmas.  
  - **Avoid hagiography**: Prioritize critical, comparative biographies (à la Plutarch) over idealized ones to foster realistic emulation.  
  - **Hybrid approach**: Your colleague’s dismissal is premature. Effective moral education likely requires both: lives for embodied emulation, rules/cases for abstract reasoning and anti-bias training (e.g., correcting for "halo effects" in narratives).  

  **Suggested Seminar Structure**: Frame the discussion around the distinctions (e.g., "Can we learn *how* to be virtuous from rules?") and test the slogan against historical shifts (Plutarch vs. hagiography). Use the readings above to explore tensions without endorsing a single view. This menu should empower your students to dissect slogans and avoid dogmatism.
