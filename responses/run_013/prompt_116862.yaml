  Now, for the readings menu: I'll outline several theses with evaluations and implications for the debate. Start with trivial ones and build to radical.

  1. **Trivial motivational thesis**: Lives inspire us to care about virtue. Defensible but doesn't dismiss rules, as both can be combined.
  2. **Anti-reductionist thesis**: Virtue can't be fully codified into rules. Defensible, but rules still have a role; doesn't fully oppose the approach.
  3. **Epistemic priority thesis**: We understand virtue better through concrete examples. Defensible, and supports biography, but case studies could serve a similar purpose.
