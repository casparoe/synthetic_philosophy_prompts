prompt: |-
  I'm a novelist, roughly two-thirds through a book whose main character is a philosopher of mind, and I keep walking into a wall I can't talk my way out of. Her whole deal is dispositions — the fragility of glass, the solubility of sugar, a person's being brave or honest or generous — and she's obsessed with the two ways those can misfire: cases where something is rigged to take the disposition away at the exact moment it would fire, and cases where the disposition is still sitting there but something else blocks it from ever showing. She has a big set-piece speech arguing that this means you can never read a trait off behaviour, and I want her to be right in a way that's actually interesting and not just a clever-sounding gotcha. So what I need from you isn't the definitions (I've got those, more or less), it's the downstream: what are the most important implications of this whole apparatus, especially the ones that reach past the toy examples.

  To make it concrete, the thing that got me started was a case I half-invented for the book and now can't stop poking at: a woman whose generosity is reliably switched off by the very fact of being watched — she's genuinely generous, but the situation that would call the trait out (someone sees her giving) is also the situation that disables it, so it never once shows in public. Is that a disposition or a hole where one should be? I'd like you to take that and run it out into the big questions: what it does to the idea that people have stable character traits and to virtue-ethics-style talk about character; what it does to dispositional theories of belief (a belief as a bundle of dispositions to act and assent) and to dispositional accounts of colour and the other secondary qualities; what it does to how we dole out praise, blame and responsibility when the trait may never have had a chance to manifest; and whether enough finks and masks piled on top of each other make the word "disposition" so watered down that it stops earning its keep. If there's a payoff for how the sciences test claims about unobservable or hidden properties — the idea that a disposition just is whatever the tests would reveal — throw that in as well, since it's adjacent to what she argues.

  One last thing, and it matters to me: I'm not a philosopher and I don't want to be sold one school's line as if it were the settled truth. Sort your answer so I can see which of these implications are basically agreed on by people who work on dispositions, and which are live fights where smart people genuinely disagree — and where you're extrapolating past the literature into my made-up case, just flag it as your own move. Please don't send me off to read anyone; I've no way to chase down papers and I'd rather you just tell me what the ideas do. (Also I should warn you the book has a deadline and I'm writing this at 2am, so forgive the typos.)
