prompt: |-
  I lead a small technology-assessment unit at a national environmental regulator. Our remit is broad: we receive proposals to authorize new activities and substances — a gene drive intended to suppress an invasive rodent on an island, a new class of neonicotinoid, a deep-sea mining license, an outdoor stratospheric aerosol injection experiment — and we must recommend one of a fixed set of dispositions: approve, approve with conditions, require further study, restrict, or refuse. Our governing statute directs us to act precautionarily where there are threats of serious or irreversible damage, and forbids us from treating the absence of full scientific certainty as a reason to postpone protective measures. In practice this has degenerated into a slogan that both proponents and opponents of any proposal can invoke with equal sincerity, and our decisions have become unpredictable and hard to defend on review.

  I need a decision procedure my unit can actually run. It will be used roughly twice a month, on proposals where the science is contested and the harms at stake are large; each recommendation goes to a board and may be litigated, so the procedure has to be defensible step by step rather than merely sensible in aggregate. Assume a five-person team, a ninety-minute meeting, access to the proposing party's dossier and to our own literature review, and no ability to commission new research on the timescale of the decision.

  Build the procedure from the following raw materials, which we have been using loosely and which you may sharpen, reject, or replace as you see fit. First, a three-way distinction among cases where we can attach probabilities to the outcomes, cases where the possible outcomes are known but their probabilities are not, and cases where we do not know what the possible outcomes are. Second, the observation that declining to act is itself an action with its own harms, so that a precautionary rule must be symmetric — it must be able to tell us when precaution argues for a proposal as well as against it, and it must not be able to license any conclusion whatsoever. Third, the thought that any precautionary measure has three separable components: a trigger, the condition that licenses action; a target, what specifically is to be protected; and a remedy, the action taken — each of which can fail independently of the others.

  Then give me the procedure itself: the questions to ask, in order, with what counts as a sufficient answer to each; the point at which the procedure stops and returns a refusal; the point at which it hands the decision to a person because the remaining question is one of values rather than facts; and the point at which it can only recommend further study, together with the condition under which that recommendation is a genuine deferral rather than an evasion. Run the procedure on three proposals: the gene drive, the neonicotinoid, and the stratospheric aerosol injection experiment. At least one of the three should come out in a way I will not like. Finally, tell me the failure mode to which this procedure is most vulnerable, and what the first line of attack from an opponent of a decision made under it would be.
reasoning: |-
  We are designing a structured decision procedure for a technology-assessment unit that must act under a precautionary principle. The procedure must be defensible, step-by-step, and symmetric (i.e., precaution can argue for or against a proposal). We have the following raw materials:

  1. A three-way distinction in knowledge states:
     - State A: We can attach probabilities to outcomes.
     - State B: Possible outcomes are known but probabilities are not.
     - State C: We do not know what the possible outcomes are.

  2. The observation that declining to act is an action with its own harms, so the precautionary rule must be symmetric.

  3. The thought that any precautionary measure has three separable components:
     - Trigger: the condition that licenses action.
     - Target: what specifically is to be protected.
     - Remedy: the action taken.

  Each of these components can fail independently.

  The procedure must be run by a five-person team in a 90-minute meeting, using the proposing party's dossier and the unit's own literature review. No new research can be commissioned.

  We will build a step-by-step procedure that asks specific questions and leads to one of the dispositions: approve, approve with conditions, require further study, restrict, or refuse.

  ### Proposed Decision Procedure

  We structure the procedure as a series of questions. The goal is to progressively narrow down the decision by assessing the state of knowledge, the nature of the threat, and the feasibility of protective measures.

  #### Step 1: Identify the Trigger
     - **Question 1:** Is there a plausible threat of serious or irreversible damage? (This is the trigger condition from the statute.)
     - **Sufficient Answer:** 
       - If **yes**, proceed to Step 2.
       - If **no**, then the precautionary principle does not apply. Proceed to Step 5 (non-precautionary assessment).
     - **Rationale:** The trigger is the starting point. Without a plausible threat, the precautionary principle is not invoked.

  #### Step 2: Classify the Knowledge State
     - **Question 2:** What is the state of knowledge regarding the outcomes of the proposed activity?
       - **A:** We can assign probabilities to the outcomes (including benefits and harms).
       - **B:** We know the possible outcomes but cannot assign probabilities.
       - **C:** We do not even know all the possible outcomes (unknown unknowns).
     - **Sufficient Answer:** The team must agree on one of A, B, or C based on available evidence.

  #### Step 3: Define the Target and Potential Harms
     - **Question 3:** What is the specific target of protection? (e.g., a species, ecosystem, human health, climate stability) and what are the potential harms to that target?
     - **Question 4:** Are there potential benefits that might offset the harms? (This ensures symmetry: precaution can argue for the proposal if inaction has serious risks.)
     - **Sufficient Answer:** A clear identification of the target and a list of potential harms and benefits. This step must be done regardless of the knowledge state.

  #### Step 4: Assess the Remedy (if we are considering conditions or restrictions)
     - **Note:** This step is only relevant if we are considering approving with conditions or restrictions. If we are at a point of refusal or approval without conditions, skip.
     - **Question 5:** Are there feasible and effective remedies (conditions, restrictions, or monitoring requirements) that can be applied to reduce the risk to an acceptable level?
     - **Sufficient Answer:** 
       - If **yes**, then we can consider approval with conditions.
       - If **no**, then we must consider refusal or require further study (if the knowledge gap can be filled).

  #### Step 5: Non-Precautionary Assessment (if no trigger)
     - **Question 6:** In the absence of a plausible threat of serious or irreversible damage, what is the net expected impact of the proposal?
     - **Sufficient Answer:** 
       - If the net impact is positive, approve (possibly with standard conditions).
       - If the net impact is negative, refuse.
       - If uncertain, require further study (but note: without a trigger, the precautionary principle doesn't apply, so the bar for further study is higher).

  #### Step 6: Decision Based on Knowledge State and Symmetry

  We now combine the knowledge state (from Step 2) with the assessment of harms and benefits (from Step 3) to make a decision. We also incorporate symmetry by comparing the risks of action vs. inaction.

  - **For State A (known probabilities):**
    - **Question 7:** What is the expected net harm (i.e., expected harm minus expected benefit)? 
      - If expected net harm is negative (i.e., net harm) and large, then refuse or require conditions (if conditions can turn it positive).
      - If expected net harm is positive, then approve (with conditions if needed to ensure it remains positive).
    - **Question 8:** Can we reduce uncertainty with further study? (But note: we cannot commission new research on the timescale. If the existing data is sufficient to assign probabilities, then further study might not be necessary.)

  - **For State B (known outcomes, unknown probabilities):**
    - **Question 9:** What is the worst-case outcome? And what is the best-case outcome?
    - **Question 10:** Is the worst-case outcome so severe (serious and irreversible) that even a small probability would be unacceptable? (This is the "maximin" rule: avoid the worst.)
      - If yes, then refuse unless there is a remedy (Step 4) that can eliminate the worst-case outcome.
      - If not, then we must also consider the worst-case outcome of inaction. 
        - **Symmetry Check:** Compare the worst-case outcome of action vs. the worst-case outcome of inaction. If the worst-case of inaction is worse, then precaution argues for action (approve, possibly with conditions). Otherwise, it argues against (refuse or require conditions to avoid the worst-case).
      - If the worst-case outcomes of both action and inaction are severe and incomparable, then require further study to assign probabilities (if feasible within existing data) or to reduce the uncertainty.

  - **For State C (unknown outcomes):**
    - **Question 11:** Can we bound the uncertainty? (i.e., can we at least say that the unknown outcomes are within some range? This might be difficult.)
    - **Question 12:** Is there a way to test the proposal in a controlled way to reveal the unknown outcomes? (But note: we cannot commission new research, but perhaps the proposal includes a pilot phase? If so, then we might approve a limited experiment with monitoring as further study.)
    - **Question 13:** If we cannot bound the uncertainty and there is no safe way to test, then we must default to the precautionary principle. 
      - **Symmetry Check:** Compare the known risks of inaction with the unknown risks of action. If the known risks of inaction are serious and irreversible, and the action might prevent them, then we might approve (with conditions and monitoring) if the potential benefits are high. Otherwise, the unknown risks of action are too great and we refuse.

  #### Step 7: Points of Decision

  - **Refusal Point:** 
    - If in Step 1, there is no plausible threat and in Step 5 the net impact is negative.
    - If in State B, the worst-case outcome of action is severe and cannot be remedied (Step 4) and the worst-case of inaction is not worse (or is less severe).
    - If in State C, the unknown risks of action are too great and there is no remedy, and the risks of inaction are not clearly worse.

  - **Handoff to Values Decision:** 
    - When the decision hinges on a trade-off between competing values (e.g., economic benefit vs. environmental protection) that cannot be resolved by the available scientific evidence. This might occur in Step 6 (for any state) when the net expected harm is borderline, or when the comparison of worst-case outcomes in State B is inconclusive and involves value judgments. In that case, the procedure stops and the decision (with a summary of the scientific facts and the unresolved value conflict) is handed to the board.

  - **Further Study Recommendation:**
    - This is recommended when:
      - The knowledge state is B or C and the existing data is insufficient to make a decision, but there is a clear path to obtaining the missing information (without new research, but perhaps by re-analyzing existing data or waiting for ongoing studies) within a reasonable timeframe.
      - The threat is not imminent and the risks of delay are acceptable.
    - **Condition for genuine deferral (not evasion):** The recommendation must specify exactly what information is needed, how it would change the decision, and a feasible way to obtain it without new research (e.g., by re-examining existing data, or by requiring the proponent to provide additional analysis from existing studies). If these conditions are met, then it is a genuine deferral.

  ### Procedure Summary

  1. **Trigger:** Is there a plausible threat of serious or irreversible damage? (Yes → Step 2; No → Step 5)
  2. **Knowledge State:** Classify as A, B, or C.
  3. **Target and Harms/Benefits:** Identify the target and list potential harms and benefits.
  4. **Remedy (conditional):** If considering conditions, are there feasible remedies?
  5. **Non-Precautionary Assessment (if no trigger):** Assess net impact.
  6. **Decision by State:**
     - **State A:** Calculate expected net harm. Approve if positive, refuse if negative, or conditionally approve if conditions can make it positive.
     - **State B:** Compare worst-case outcomes of action and inaction. If action's worst-case is unacceptable and irremediable, refuse. If inaction's worst-case is worse, approve (with conditions if needed). If inconclusive, require further study (if feasible) or hand off to values.
     - **State C:** Try to bound uncertainty. If possible, treat as State B. If not, then if inaction has known serious risks and action might help, approve with conditions and monitoring (as a form of further study). Otherwise, refuse.
  7. **Handoff to Values:** When a value judgment is unavoidable, stop and hand to the board.
  8. **Further Study:** When the missing information can be obtained without new research and within a reasonable time, and the delay is acceptable.

  ### Running the Procedure on Three Proposals

  #### Example 1: Gene Drive for Rodent Suppression on an Island

  - **Step 1: Trigger?** Yes. Potential threat: unintended spread of the gene drive to non-target populations, disruption of ecosystems. Also, inaction: ongoing damage from invasive rodents.

  - **Step 2: Knowledge State:** Likely State B or C. We know some outcomes (reduction of rodents, potential for non-target effects) but probabilities are unknown. There might be unknown unknowns (e.g., long-term evolutionary consequences).

  - **Step 3: Target:** Native species and ecosystem. Harms: accidental spread, affecting non-target species, potential for the gene drive to persist and cause ecological imbalance. Benefits: elimination of invasive rodents, restoration of native species.

  - **Step 4: Remedy?** Conditions might include physical isolation (island), monitoring, and a kill switch. Feasible? Yes, for an island.

  - **Step 6 (State B or C):** 
    - Worst-case of action: Gene drive spreads to mainland, causing widespread extinction of rodents and cascading effects. 
    - Worst-case of inaction: Continued loss of native species on the island, possibly leading to extinctions.
    - Comparison: The worst-case of action (global spread) is potentially more severe than the worst-case of inaction (local extinctions). But the probability of spread from an island is low? (But we don't know probabilities, so we must consider the worst-case as possible.)
    - Without probabilities, we must rely on the severity. The trigger for precaution is met for both action and inaction. But we have a remedy: physical isolation and a kill switch. If these remedies are robust, then we can conditionally approve.

  **Decision:** Approve with conditions (strict containment and monitoring).

  #### Example 2: New Class of Neonicotinoid

  - **Step 1: Trigger?** Yes. Neonicotinoids have been linked to bee colony collapse and other ecological harms. Potential for serious and irreversible damage to pollinators.

  - **Step 2: Knowledge State:** State A or B. We have data from previous neonicotinoids, so we might assign probabilities. But it's a new class, so there might be unknowns.

  - **Step 3: Target:** Pollinators (bees), aquatic ecosystems. Harms: toxicity to non-target insects, persistence in environment. Benefits: effective pest control, higher crop yields.

  - **Step 4: Remedy?** Conditions: restrictions on use (timing, location), buffer zones, monitoring. Feasible? Yes.

  - **Step 6 (State A):** 
    - Expected net harm: We have data. If the expected harm (to pollinators and ecosystems) is high and the benefits are moderate, then net harm is negative. But the new class might be designed to be less harmful? 
    - If the proponent's data shows low risk, we must verify. If our literature review shows high risk, then we might refuse.

  **Decision:** If the expected net harm is negative and cannot be mitigated by conditions, refuse. Otherwise, approve with conditions. (But let's assume our review shows high risk and the proponent's data is contested. Then we might refuse.)

  #### Example 3: Outdoor Stratospheric Aerosol Injection Experiment

  - **Step 1: Trigger?** Yes. Potential for ozone depletion, changes in precipitation patterns, and unknown climate effects. Also, inaction on climate change has its own serious risks.

  - **Step 2: Knowledge State:** State C. There are many unknown outcomes (e.g., regional climate disruption, impacts on agriculture, health).

  - **Step 3: Target:** Global climate system, ozone layer, human health. Harms: unintended weather changes, ozone damage. Benefits: information that could help combat climate change.

  - **Step 4: Remedy?** Conditions: small scale, monitoring, stop if problems arise. But the nature of the experiment is such that even a small release might have global effects? So remedies may not be effective.

  - **Step 6 (State C):** 
    - We cannot bound the uncertainty. The worst-case of action (triggering a climate catastrophe) is severe. The worst-case of inaction (continued climate change) is also severe. But the experiment is not the same as deployment; it's a small test. However, the unknowns are large.
    - Symmetry Check: The known risks of inaction (climate change) are high, but the experiment might not directly reduce them (it only provides information). The risks of the experiment are unknown and potentially global.
    - Without a way to bound the risks, and given the global nature, we might refuse.

  **Decision:** Refuse. The potential for serious and irreversible damage from the experiment is too high, and the benefits (information) do not justify the unknown risks. Alternatively, require further study in a more controlled setting? But the proposal is for an outdoor experiment. So refusal.

  **Note:** This decision might not be liked because the experiment is intended to gather data for a potential climate solution, but the procedure leads to refusal due to State C and the inability to bound risks.

  ### Failure Mode and First Line of Attack

  **Most Vulnerable Failure Mode:** The procedure is most vulnerable to misclassification of the knowledge state (Step 2). If a situation is wrongly classified (e.g., as State B when it is really State C, or vice versa), the entire decision path may be flawed. Also, the assessment of the worst-case outcomes in State B and C is subjective and might be challenged.

  **First Line of Attack from an Opponent:** An opponent would likely attack the classification of the knowledge state. For example, in the gene drive case, if we classified as State B (known outcomes) but there are unknown outcomes (State C), then the opponent could argue that we underestimated the risks. Similarly, in the aerosol experiment, if we classified as State C, the proponent might argue that we do know the outcomes (from models) and can assign probabilities (State A), so refusal is too harsh.

  Additionally, the symmetry check (comparing worst-case of action and inaction) is value-laden and might be attacked as arbitrary. For instance, in the gene drive, comparing the global worst-case of action to the local worst-case of inaction involves a value judgment about scale and probability. An opponent might argue that the procedure does not adequately weigh the benefits.

  ### Final Thoughts
  The procedure provides a structured way to apply the precautionary principle. It forces the team to be explicit about the state of knowledge and the worst-case scenarios. However, it requires careful and honest assessment at each step. The handoff to the board for value judgments is crucial for maintaining defensibility when science cannot resolve the issue.
answer: |-
  ### Structured Decision Procedure for Precautionary Technology Assessment

  **Core Principles:**  
  1. **Symmetric Precaution:** Declining to act (inaction) must be evaluated for its own risks.  
  2. **Three-Component Analysis:** Explicitly assess the *trigger* (threat condition), *target* (protected entity), and *remedy* (protective action) for failure modes.  
  3. **Knowledge-State Framework:** Classify proposals into:  
     - **State A:** Outcomes have quantifiable probabilities.  
     - **State B:** Outcomes are known, but probabilities are unquantifiable.  
     - **State C:** Outcomes are unknown ("unknown unknowns").  

  **Procedure Workflow**  
  *Time Allocation: 90 minutes total (strictly enforced).*  

  #### **Step 1: Threat Identification & Trigger Assessment**  
  - **Question 1:** Is there a *plausible threat of serious or irreversible damage* from either **approving** or **rejecting** the proposal?  
    - *Sufficient Answer:* Evidence-based consensus (e.g., literature review shows non-negligible risk). If absent → **Approve** (no precautionary trigger).  
    - *Failure Mode:* Trigger absent (no threat), remedy absent (no protective action), or target undefined.  
  - **Output:** If "no threat" for both action/inaction → Proceed to **Step 5**. Else → **Step 2**.  

  #### **Step 2: Knowledge-State Classification**  
  - **Question 2:** What is the knowledge state?  
    - *Sufficient Answer:*  
      - **State A:** Probabilistic models exist (e.g., dose-response data).  
      - **State B:** Outcomes cataloged (e.g., lab studies), but probabilities unknown.  
      - **State C:** Outcomes indeterminate (e.g., novel tech with no analogs).  
    - *Requirement:* Team vote (3/5 majority).  
  - **Output:** Proceed to **Step 3**.  

  #### **Step 3: Target & Harm Symmetry**  
  - **Question 3:** What is the *target* (e.g., ecosystem, human health) and what harms arise from **approval** vs. **rejection**?  
  - **Question 4:** Is harm to the target *reversible*?  
    - *Sufficient Answer:*  
      - List harms for action/inaction (e.g., "Rejecting gene drive: invasive species extinction; Approving: off-target gene flow").  
      - If harms symmetric (both action/inaction threaten the same target) → Proceed to **Step 4**.  
      - If asymmetric → **Handoff to Board** (value judgment on target priority).  
  - **Handoff Point:** When targets conflict (e.g., economy vs. biodiversity) and science cannot prioritize.  

  #### **Step 4: Remedy Feasibility**  
  - **Question 5:** Is there a *remedy* (e.g., containment, monitoring) that reduces risk below the "serious/irreversible" threshold?  
    - *Sufficient Answer:*  
      - Remedy must be specific, enforceable, and validated (e.g., "Island gene drive: kill-switch gene").  
      - If feasible → **Approve with Conditions**.  
      - If infeasible → Proceed to **Step 6**.  

  #### **Step 5: Non-Precautionary Assessment**  
  - **Question 6:** What is the net expected impact?  
    - *Sufficient Answer:*  
      - Use cost-benefit analysis (State A) or qualitative trade-offs (State B/C).  
      - If net positive → **Approve**.  
      - If net negative → **Refuse**.  
  - *Applies only if Step 1 found no threat.*  

  #### **Step 6: Knowledge-State Decision**  
  - **State A (Known Probabilities):**  
    - **Question 7:** Is expected harm > acceptable threshold?  
      - *Sufficient Answer:* Quantitative threshold (e.g., >1% chance of irreversible damage).  
      - If yes → **Refuse**.  
      - If no → **Approve**.  
  - **State B (Known Outcomes, Unknown Probabilities):**  
    - **Question 8:** Is the worst-case outcome for *either action or inaction* "unacceptable" (catastrophic/irreversible)?  
      - *Sufficient Answer:* Team consensus on unacceptability (e.g., "Gene drive: irreversible species extinction").  
      - If action’s worst-case unacceptable → **Refuse**.  
      - If inaction’s worst-case unacceptable → **Approve with Conditions** (if remedy exists).  
      - If both unacceptable → **Require Further Study**.  
  - **State C (Unknown Outcomes):**  
    - **Question 9:** Can the proposal be bounded to exclude unacceptable outcomes?  
      - *Sufficient Answer:* "Bounded" = proof of no pathway to catastrophe (e.g., "Aerosol experiment: limited to troposphere").  
      - If bounded → Treat as **State B**.  
      - If unbounded → **Refuse**.  
  - **Further Study Recommendation:**  
    - *Genuine Deferral Criteria:*  
      1. Missing data is identifiable and obtainable *without new research* (e.g., reanalysis of existing datasets).  
      2. Delay does not exacerbate threat (e.g., invasive species slow-spreading).  
      3. Study design is specified in the recommendation.  
    - *Evasion:* If criteria unmet → **Refuse**.  

  #### **Stopping Points**  
  - **Refusal:** Step 6 (all states), Step 5 (net negative).  
  - **Handoff to Board:** Step 3 (target conflict).  
  - **Further Study:** Step 6 (State B with dual unacceptability).  

  ---

  ### Application to Cases  
  *Assumes conservative evidence interpretation (e.g., peer-reviewed literature > proponent data).*  

  #### **1. Gene Drive (Invasive Rodent Suppression)**  
  - **Step 1:** *Trigger present.* Harm if approved: gene flow to non-target species. Harm if rejected: biodiversity loss from invasive rodents.  
  - **Step 2:** **State B** (outcomes known, e.g., gene flow observed in lab mice; probabilities unknown).  
  - **Step 3:** *Target = island ecosystem.* Harms symmetric (both irreversible). Proceed.  
  - **Step 4:** *Remedy feasible?* Yes (physical isolation, gene kill-switch). → **Approve with Conditions** (e.g., phased release with monitoring).  
  - ***Outcome: Approve with Conditions.***  

  #### **2. New Neonicotinoid**  
  - **Step 1:** *Trigger present.* Harm if approved: pollinator collapse. Harm if rejected: crop loss (economic/regional food security).  
  - **Step 2:** **State A** (extensive data on bee toxicity; probabilities estimable).  
  - **Step 3:** *Target = pollinators.* Harm from approval irreversible (pollinator extinction); harm from rejection reversible (crop loss mitigable). → **Handoff to Board** (values: food security vs. biodiversity).  
  - ***Outcome: Handoff.*** *Likely board refusal due to statutory emphasis on irreversibility.*  

  #### **3. Stratospheric Aerosol Injection Experiment**  
  - **Step 1:** *Trigger present.* Harm if approved: ozone depletion, precipitation shifts. Harm if rejected: delayed climate mitigation.  
  - **Step 2:** **State C** (no analogs; unknown unknowns dominate).  
  - **Step 3:** *Target = global climate system.* Harms asymmetric (approval risks irreversible system shock; rejection risks incremental warming). Proceed.  
  - **Step 6 (State C):** *Unbounded?* Yes (no proof excluding catastrophe). → **Refuse**.  
  - ***Outcome: Refuse.*** *You may dislike this—it halts research but aligns with statutory burden of proof.*  

  ---

  ### Failure Mode & Vulnerabilities  
  - **Primary Failure Mode:** **Misclassification of Knowledge State** (e.g., underestimating State C as State B). This could license reckless action or unnecessary refusal.  
  - **First Line of Attack by Opponents:**  
    - "Arbitrary State Assignment." Example: Proponent of aerosol experiment argues it is State B (known outcomes from models), not State C, to force worst-case comparison.  
    - **Countermeasure:** Require documented evidence for state classification (e.g., "State C: no peer-reviewed studies on stratospheric effects").  

  ### Procedure Strengths  
  - **Defensibility:** Documents each step (e.g., "Refused in Step 6 due to unbounded State C").  
  - **Symmetric:** Evaluates inaction risks explicitly (Step 1).  
  - **Time-Efficient:** Forces clear thresholds (e.g., remediable vs. irremediable harm).  
  - **Anti-Evasion:** "Further study" only if delay is safe and data is obtainable.  

  **Final Recommendation:** Implement this with a template for recording answers at each step. Train the board on the handoff step to ensure value judgments are made transparently. Run a mock trial for litigation preparedness.
