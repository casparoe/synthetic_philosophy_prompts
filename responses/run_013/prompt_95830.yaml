prompt: |-
  I coordinate the simulation lab at a nursing school and I'm the one who signs the competency forms, which means I'm the person who decides wether a student is allowed to do a thing on a real patient without someone standing next to them. It's three or four of these a month, about twenty minutes each at a bench in the sim room, and I've got a rubric from the accreditors that mostly asks whether they performed the steps in the right order. Here's why I'm asking you instead of just re-reading the rubric. Years ago I got signed off on a procedure I now think I couldn't actually do -- I could recite the whole thing, I knew every number and every contraindication, and nobody ever found out that my hands didn't know it until I was alone with a patient who hadn't read the textbook. So the thing I'm actually trying to detect isn't on the form. Somebody in my book club said that philosophers now think knowing how to do something just *is* knowing a fact -- knowing a way of doing it -- and that this is basically a licence for checklists; someone else said no, that skill is its own kind of thing and doesn't survive being written down as information. I've also never been able to shake a point somebody made about regress: if doing a skill means following a rule, and following a rule is itself a skill, then no checklist can ever fully capture what I'm certifying. Take that seriously as a design constraint, not as a curiosity.

  So build me a decision procedure I can actually run in twenty minutes on one student at a bench. What do I ask them to do first, and what am I watching for while they do it; what counts as a sufficient answer or a sufficient performance at each step and *why*; at which point does the procedure stop with a no; and where does it stop and hand the decision to a person because the question is about values rather than evidence (I'm fairly sure the pass line is one of those, and I want it labelled as such rather than buried). Tell me which of the distinctions from that knowing-how literature have to survive into a form a clinical instructor can use and which ones I can just throw away, and be explicit about where the procedure will misfire -- I'd rather have a form that tells me a truth I don't like than one that ratifies what the school already wants to hear. Two students it has to handle: the one whose hands are perfect but who can't explain a single thing they just did, and the one who can narrate the entire protocol flawlessly while their hands do something else.

  Then run it on the three I've actually got right now: (a) flawless hands, can't say why, (b) beautiful explanation, shaky hands, (c) did it once in sim last month with me prompting her through two of the steps and hasn't touched it since. I want to see at least one of those come out in a way that'll make the remediation committee unhappy. And at the end, tell me where your own procedure is most likely to be wrong, and what you'd have to learn -- some fact about how skill actually transfers from a sim room to a ward, say -- that would make you throw the whole thing out and tell me to weight the written exam instead.
reasoning: |-
  Okay, the user coordinates a simulation lab at a nursing school and signs off on competency forms. They need a decision procedure to assess whether students can perform procedures independently on real patients. The challenge is that the current rubric checks steps in order but misses actual skill, as the user experienced themselves when they were certified without practical ability. 

  The user wants a method that detects true competence beyond just following a checklist. Key issues: the philosophical debate on whether knowing-how is just knowing facts (procedural knowledge) or a separate skill (embodied practice), and the regression problem where following a rule is itself a skill. 

  Their constraints: 20 minutes per student, one-on-one at a bench. Must handle two extremes: perfect execution without explanation vs. flawless verbalization with poor performance. Also, three test cases: (a) skilled but can't explain, (b) explains well but performs poorly, (c) needed prompting previously and hasn't practiced since.

  The user also wants transparency on where the pass line involves value judgments rather than evidence. They prefer a method that might produce unpopular truths over one that rubber-stamps the school's preferences. 

  First, the philosophical distinctions matter here. Ryle's "intellectualist legend" critique shows that reducing skill to rule-following leads to infinite regress. Knowing-how involves dispositional capacities beyond declarative knowledge. However, for clinical assessment, some declarative elements (like contraindications) are essential. The key is integrating both without reducing skill to information. 

  For the decision procedure, a tripartite structure makes sense: declarative knowledge, procedural simulation, and adaptive response. This covers rules, execution, and real-time adjustment. Each step must be pass/fail to avoid averaging out weaknesses. 

  The pass line is a value judgment: independent practice requires minimal supervision. The evidence shows capability, but the risk threshold is institutional. This should be explicit. 

  Handling the two extremes: For the student with perfect hands but no explanation, Step 2 (procedural simulation) passes, but Step 1 (declarative) fails unless they can demonstrate understanding non-verbally. The procedure fails them, which might upset committees but reflects that verbal articulation is part of clinical competence (e.g., handoffs, teaching). For the student with beautiful explanation but shaky hands, Step 1 passes but Step 2 fails—execution matters more in real settings. 

  For the test cases: 
  - (a) Flawless hands, can't explain: Fails Step 1. Remediation needed on rationale. 
  - (b) Beautiful explanation, shaky hands: Fails Step 2. Needs physical practice. 
  - (c) Previously prompted, no recent practice: Fails all steps if current performance gaps exist. 

  The procedure's weaknesses: It might undervalue experiential learning or over-penalize articulation in rare cases. If studies show sim-to-ward transfer depends heavily on cognitive load management (not covered here), weighting written exams more might be better. But for now, this integrates critical elements while exposing where the school's preferences clash with evidence.
answer: |-
  Here's a decision procedure designed for your constraints, grounded in the philosophy of skill while remaining clinically practical. It rejects the "checklist = competence" model and addresses the regress problem by testing **integration of knowledge, embodied execution, and adaptive capacity**.

  ### Core Philosophy & Key Distinctions
  1.  **Ryle's Knowing-How vs. Knowing-That Survives:** Skill (knowing-how) is *not reducible* to recalling facts (knowing-that). A checklist captures knowing-*that* about the procedure; your test must assess knowing-*how* to *do* it. You cannot throw this away.
  2.  **The Regress Problem Survives (as a constraint):** Since rule-following *is* a skill, the test must probe *how* the student applies rules under pressure/novelty, not just *if* they recall them. You *can* throw away the idea that this makes assessment impossible – instead, it means your test must create a scenario where rule-application *itself* is challenged.
  3.  **Polanyi's Tacit Knowledge Survives:** Embodied skills involve tacit elements ("we know more than we can tell"). The "flawless hands, can't explain" student demonstrates this. Your test must *allow* for competence here without demanding impossible articulation, *while* still probing for critical safety-critical understanding.
  4.  **Knowing-That is Necessary (but not Sufficient):** Contra pure anti-intellectualism, some facts (critical labs, contraindications) *must* be recalled. You can throw away the idea that *all* knowing-how requires explicit knowing-that *in the moment of action*, but *safety* requires key thresholds be known *before* action.

  ### The Decision Procedure (20-Minute Bench Test)

  **Goal:** Assess if the student can perform the procedure *safely and effectively* on a real patient *without direct, step-by-step supervision*.

  **Structure:** Three sequential Pass/Fail gates. **Failure at any gate = Overall Fail.** Time allocation is flexible based on procedure complexity.

  1.  **Gate 1: Critical Declarative & Rationale Check (3-5 min)**
      *   **Ask:** "Tell me the **3 absolute contraindications** for this procedure and **why** each one matters. What is the **single most critical vital sign** to monitor immediately after, and what value would make you stop and call for help *immediately*?"
      *   **Watching For:** Correct identification of *critical* contraindications (not just any). **Sufficient answer:** Clear, concise statements of the contraindication *and* a plausible physiological rationale for the risk (e.g., "Bleeding disorder because this procedure involves X which could cause uncontrolled hemorrhage"). Correct vital sign *and* a specific, correct safety threshold (e.g., "Systolic BP < 90 mmHg, because it indicates shock risk from potential bleeding").
      *   **Why:** Tests non-negotiable safety knowledge that *must* be recallable *before* starting. The "why" probes understanding, not just rote recall. Failing this means the student lacks the knowledge to *decide if the procedure is even safe to attempt* – a fundamental failure for independent practice.
      *   **Misfires:** Student knows the "what" but gives a weak/wrong "why." Student freezes under pressure but *does* know it. (See Gate 3 for mitigation). Student fixates on minor contraindications.

  2.  **Gate 2: Embodied Execution Under Observation (10-12 min)**
      *   **Ask:** "Perform the entire procedure on this simulator/task trainer as if I am not here. Narrate ONLY if it helps *you* focus, otherwise work silently. I will interrupt once to simulate a minor, realistic problem."
      *   **Watching For:**
          *   *Flow & Economy of Motion:* Smoothness, lack of hesitation/fumbling, efficient hand movements, correct body mechanics. Does it look practiced and embodied?
          *   *Asepsis/Universal Precautions:* Consistent adherence without conscious effort.
          *   *Critical Step Integrity:* Correct sequence for *safety-critical* steps (e.g., confirming placement before delivery, locking a mechanism before activation). Order matters most here.
          *   *Handling Interruption:* When you interrupt (e.g., "Simulated EKG shows new arrhythmia," "The IV line snags," "Family member asks a question"), do they pause safely? Can they refocus and continue accurately? Do they recognize if the interruption creates a new contraindication?
      *   **Sufficient Performance:** Safe, fluid execution. Critical steps performed correctly and in sequence. Recovers from minor interruption appropriately without losing track or compromising safety. *Minor* non-critical deviations (e.g., slightly imperfect angle on non-critical step) are acceptable if safety isn't impacted and flow is good.
      *   **Why:** This is the core test of embodied skill (knowing-how). Silence/narration choice allows the "flawless hands" student to shine. The interruption probes adaptability and rule-application skill under mild stress – addressing the regress problem by seeing how they apply their "internal checklist" when distracted. Focus on critical steps prioritizes safety.
      *   **Misfires:** Student is overly nervous performing observed vs. alone. Simulator fidelity limitations mask real-world tactile feedback issues. Interruption is unrealistic or overly disruptive.

  3.  **Gate 3: Adaptive Response & Limited Articulation (3-5 min)**
      *   **Ask:** Based on Gate 2 performance: "I noticed you did [X - a specific, non-critical choice they made, or their response to the interruption]. *Why* did you choose to do it that way?" AND "If [Y - a plausible, non-catastrophic complication relevant to the procedure, e.g., mild bleeding, difficulty securing device, patient discomfort] happened *right now*, what would your *next two actions* be?"
      *   **Watching For:**
          *   *Rationale (if applicable):* A plausible, practical reason for their choice (even if simple: "It's faster," "It felt more stable," "I was taught that way"). Not demanding textbook theory.
          *   *Complication Response:* Quick, safe, prioritized actions focused on patient stability and problem-solving (e.g., "Apply pressure for bleeding," "Reposition and reassess before securing," "Stop and assess pain source"). Not panicking or jumping to extreme measures.
      *   **Sufficient Performance:** A reasonable practical justification *or* demonstrating the action was safe/effective (if they can't articulate). Safe, immediate actions for the complication. Doesn't need textbook perfection, needs safe pragmatism.
      *   **Why:** Probes *adaptive* knowing-how – applying skill to variation. The "why" question allows the articulate student to demonstrate depth *and* gives the tacit expert a chance to show practical reasoning *if* they can, without demanding it for every step. The complication tests judgment and prioritization under simulated pressure – key for independent practice.
      *   **Misfires:** Student misinterprets the complication scenario. Questioning throws off a competent but introverted student.

  **The Pass Line (Value Judgment - Explicitly Labeled):**
  *   **Pass:** Student passes all 3 Gates.
  *   **Fail:** Student fails any 1 Gate.
  *   **Why it's a Value Judgment:** The evidence (passing Gates 1-3) shows capability *in the sim lab context*. Deciding this translates to **permitting independent practice on a real patient** involves accepting a level of risk. This threshold is set by the *institution/society*, not purely by the test evidence. A student could pass the test but still make an error on a real patient. You are certifying that, based on *this evidence*, the risk is deemed *acceptably low* for unsupervised practice *according to your institution's standards*. This is inherently value-laden.

  ### Handling Your Extremes
  *   **Flawless Hands, Can't Explain:** Likely *fails Gate 1* if they cannot state contraindications/thresholds & rationale. *Passes Gate 2* easily. *May pass or fail Gate 3* depending on complication response and if their choice rationale was purely tacit. **Overall: Likely FAIL.** *Why:* Independent practitioners *must* be able to recall critical safety thresholds instantly. They cannot look these up while managing an emergency.
  *   **Beautiful Explanation, Shaky Hands:** Likely *passes Gate 1* brilliantly. *Fails Gate 2* due to fumbling, unsafe execution, or poor response to interruption. Irrelevant of Gate 3. **Overall: FAIL.** *Why:* Knowing-that does not equal knowing-how. Unsafe execution is an absolute barrier.

  ### Running Your Three Students
  1.  **(a) Flawless hands, can't say why:**
      *   Gate 1: Fails. Stumbles over contraindications, gives vague/wrong rationale for vital sign threshold. (*Critical safety knowledge gap*)
      *   Gate 2: Passes. Smooth, safe, correct critical steps. Handles interruption calmly. (*Embodied skill present*)
      *   Gate 3: Mixed. Maybe gives a simple practical reason for a choice ("It felt secure"). Responds adequately to complication scenario ("Apply pressure" for bleeding).
      *   **Decision: FAIL.** Remediation Committee unhappy? **Tough.** This student is a safety risk. They might *do* the procedure well *if* it's indicated, but they lack the knowledge to *know when it's absolutely unsafe to do it at all* or when to stop due to instability. Remediation focused on core safety knowledge is essential.
  2.  **(b) Beautiful explanation, shaky hands:**
      *   Gate 1: Passes. Articulate, textbook-perfect answers on contraindications, rationale, and thresholds.
      *   Gate 2: Fails. Hesitant, fumbles instruments, breaks sterility momentarily, sequences a critical step poorly under mild stress from interruption. (*Unsafe execution*)
      *   Gate 3: (Irrelevant due to Gate 2 fail) Probably passes easily with articulate answers.
      *   **Decision: FAIL.** Remediation Committee unhappy? **Tough.** This student is a safety risk. Knowing the book doesn't mean they can safely perform the task. They need significant supervised practice on psychomotor skills and managing performance anxiety/distraction.
  3.  **(c) Did it once with prompting, hasn't touched it since:**
      *   Gate 1: *May* scrape a pass if they remember core contraindications/thresholds from lecture (but rationale weak). Or fail.
      *   Gate 2: High chance of failure. Lack of practice shows: hesitant, searches for next step, forgets a critical element (e.g., confirming placement), poor flow, doesn't handle interruption well. (*Lack of embodied skill/retention*)
      *   Gate 3: Likely fails if asked about a choice during the shaky performance or struggles with complication response.
      *   **Decision: VERY LIKELY FAIL.** Remediation Committee unhappy? **Tough.** One prompted practice session a month ago is grossly insufficient for independent practice certification. This demonstrates inadequate preparation and retention. Requires significant deliberate practice before re-assessment.

  ### Where This Procedure is Most Likely Wrong & When to Scrap It
  1.  **Greatest Weakness: Transfer Validity.** The core assumption is that **safe, adaptive performance on a high-fidelity simulator under observation with mild stress predicts safe, adaptive performance on a real patient without direct supervision.** This is *not* guaranteed. Factors that could invalidate it:
      *   **The Simulation Fidelity Gap:** If the *specific tactile feedback*, patient movement, or environmental chaos (lights, noise, multiple demands) of the real ward is *crucial* for competent performance in *this specific procedure*, and the sim cannot replicate it, the test is invalid. (e.g., Inserting an IO needle in a moving trauma patient vs. a static leg model).
      *   **Cognitive Load Mismatch:** The test imposes *some* load (observation, interruption), but the real ward imposes *massively* more (multiple patients, alarms, family, documentation pressure). A student passing in sim might crumble under real-world load, *even if the embodied skill is there*.
      *   **The "Alone with the Patient" Factor:** Some competent individuals perform well under observation but make critical errors when truly alone due to overconfidence or lack of oversight pressure. The test cannot perfectly simulate this.
  2.  **What Would Make Me Tell You to Weight the Written Exam Instead:** If rigorous, longitudinal studies demonstrated that **performance on a well-constructed written exam assessing deep understanding (indications, contraindications, complications, rationale, troubleshooting) was a *stronger predictor* of safe independent outcomes on the ward for *this specific procedure* than performance in a simulation-based assessment like the one described.** This would imply that the cognitive knowledge *is* the primary protective factor, and the psychomotor skill is either easily acquired on the job or less critical for safety than previously thought. (This scenario seems unlikely for most hands-on procedures but might hold for primarily cognitive tasks like interpreting certain monitors or calculating complex drips).

  **Use this procedure with the humility that *all* competence assessment involves prediction and risk.** It explicitly tests beyond the checklist, prioritizes safety-critical elements, handles your extreme cases rigorously (likely leading to uncomfortable but necessary fails), and flags the value judgment at the pass line. It is far more likely to detect the "textbook incompetent" than a pure checklist, but no test is infallible. Track your graduates' real-world performance – that's the ultimate validation.
