  **Note:** Contemporary metaphysics acknowledges no consensus on when composition occurs. It is uncontested that ordinary objects *seem* to exist, but genuinely debated whether this reflects mind-independent "wholes" or useful human categories. Moderates (invoking *contact*, *fastening*, or *life*) dispute nihilists ("*never*") and universalists ("*always*"), while some reject the question itself as *broken*.  

  Verdict: The poem leaves unresolved whether its lines compose an object or merely scatter in the void.
