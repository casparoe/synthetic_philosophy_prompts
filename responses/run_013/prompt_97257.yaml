  ### Sestina: The Gathering  

  Atoms in the void: do they compose *always*?  
  Or is the chair just dust—true whole *never*?  
  If closeness counts, what weight in *contact*?  
  Or must there be a bolt, a *fastening*?  
  Perhaps when pulsing as a tree’s green *life*?  
  Or is the question’s frame itself *broken*?  

  The seat collapses, leg now *broken*.  
  Does "chair" persist? The answer drifts *always*.  
  Once-rooted wood still holds a forest’s *life*—  
  does that bond matter? Say it: *never*.  
  The glue decays, undone from *fastening*—  
  is bond more than a pressured *contact*?  

  Two stones that kiss in casual *contact*  
  lie on the shore—a statue’s arm *broken*.  
  What nail or weld would count as *fastening*?  
  They’re two, not one. This truth rings *always*.  
  We call them "pair," but unity? *Never*—  
  unless they’re swept in ocean’s tidal *life*.  

  That gull, though—wings in rapid *contact*  
  with wind—we *never* doubt its single *life*  
  until the bone snaps, body *broken*.  
  Then cells disperse. The form was *always*  
  brief, a fragile, momentary *fastening*  
  of breath and blood. What held it? *Fastening*?  

  A joint, a grip, mere *fastening*  
  can’t bind the sea’s fierce, formless *life*.  
  Its waves but foam in fleeting *contact*,  
  then shatter on the rocks, *broken*.  
  Yet we name "ocean"—truth or tale *always*?  
  The whole’s mirage? The doubt *never*  

  dies. *Never* trust the claim of *fastening*.  
  The chair, now kindling, feeds a fire’s *life*,  
  its atoms freed from forged *contact*—  
  ash on the breeze, the bond *broken*.  
  "Whole" was a ghost—or real? *Always*  
  the question gnaws: what makes *life*  

  more than a spark? What makes *contact*  
  more than two dust motes, *broken*  
  by thought? The answer’s not *always*  
  in glue. *Never* in mere *fastening*.  
  This poem’s lines—do they share *life*?  
  Or lie apart, a list *broken*?  

  Envoy:  
