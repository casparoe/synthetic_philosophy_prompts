  - **Honeycomb as structure**: Precision isn’t pedantry—it’s what holds the whole together.  
  - **Parallel to ethics**: Falsifying data, like damaging a comb, erodes trust in systems people rely on.  

  For the 1989 story, the key is shifting focus from *numbers* (3 lives vs. a lie) to *what the lie would erode*:  
  - **Not "clean hands"**: Emphasize that his refusal protected the hospital’s integrity—a shared resource.  
  - **Link to bridge**: His terrible card-playing shows he valued the *game’s rules* over winning, mirroring his ethics.  

  The paradox of deontology is sidestepped by redefining the "constraint" as active preservation:  
  - **Not "don’t lie"** but "actively uphold truth-telling as communal glue."  
  - **Consequentialist listeners** hear a defense of systems that save lives *long-term*.  
  - **Family** hears loyalty to principles, not stubbornness.  

  Tone is critical:  
  - **First line** ("He kept bees...") grounds it in warmth before philosophy.  
  - **"Bumbling walks"** and bridge failures add levity, humanizing him.  
  - **Calling the lie a "small betrayal"** frames it as relational, not abstract.  

  The user’s anxiety about "lecturing" is mitigated by:  
