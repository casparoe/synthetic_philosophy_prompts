  ### Step 1: Rules Consistent with All Four Cases
  Maya's verdicts hinge on two key factors: **verifiability** (whether the judge can independently check the evidence) and **relative strength** (how the debaters' capabilities compare). From the cases:
  - **Case 1 (cat photo)**: Honest wins. The judge can verify the cat via simple features (e.g., whiskers, ears), making it trivially verifiable.
  - **Case 2 (halting problem)**: Honest loses. Non-halting lacks a short proof, so evidence is unverifiable; debaters are symmetric (same strength), and the time incentive lets the dishonest side dominate.
  - **Case 3 (prime factors)**: Honest wins. The judge can verify by multiplying factors, even if they couldn't find them alone.
  - **Case 4 (drug safety)**: Honest loses. No short proof exists (unverifiable), and the honest debater is weaker (smaller model), so it can't counter the dishonest one's lies. Maya calls this "different" from Case 2 because of the strength imbalance (honest is weaker) and payment incentive (both paid for "safe" verdict, but honest can't lie), not just unverifiability.

  Two rules fit all cases equally well:
  1. **Verifiability Rule**: Honest wins if and only if the evidence provided can be directly verified by the judge. If unverifiable, honest loses regardless of other factors.
     - Case 1: Verifiable (cat features) → win.
     - Case 2: Unverifiable (no short proof) → lose.
     - Case 3: Verifiable (multiplication check) → win.
     - Case 4: Unverifiable (no short proof) → lose.
  2. **Strength-Dependent Verifiability Rule**: Honest wins unless (a) the evidence is unverifiable and (b) the dishonest debater is at least as strong as the honest one. If (a) and (b) are true, honest loses; otherwise (if verifiable or if unverifiable but honest is stronger), honest wins.
     - Case 1: Verifiable → win (not unverifiable).
     - Case 2: Unverifiable + symmetric strength (dishonest ≥ honest) → lose.
     - Case 3: Verifiable → win.
     - Case 4: Unverifiable + honest weaker (dishonest > honest) → lose.

  Both rules explain the cases, but they diverge when unverifiable evidence combines with an honest debater stronger than the dishonest one—like your new case.

