prompt: |-
  I want you to act like a philosopher of mind who's spent years on the animal welfare committees — the kind of person who actually has to turn "is it sentient?" into a yes/no recommendation for a regulator, not just write essays about it. Take your time with this. Start by brainstorming on your own before you write anything down, because I want the list to be complete rather than tidy.

  Background so you know what I'm doing with it: my dept is putting together a workshop on the moral status of the things we're unsure about — insects, crabs and octopuses, fish, newborn babies, patients who only sometimes respond, people under general anaesthesia, and now chatbots that tell you they're suffering. I keep noticing that every argument I read picks one of these cases and argues from it, and I want the specification first. What would a theory of morally relevant computation — a theory of what makes something a candidate for mattering morally — actually have to get right before I'd trust it on any of the cases?

  So: write me the desidarata. I mean the full spec — the cases it has to get right, the distinctions it isn't allowed to collapse, the things we already know that it can't contradict, and the constraints that come from the fact that we'll be using it under uncertainty, on things we can't ask. For each one, tell me why it's a requirement and not just something nice to have, and give me the case or consideration that motivates it.

  Two things I want you to be explicit about:

  1. Which of these are genuine requirements and which are just the prejudices of one camp wearing a requirement's clothes. I suspect a lot of the "it must give a determinate verdict" stuff is really a demand for a sharp line, and I'm not sure the world owes us one — but tell me if I'm wrong about that.
  2. Whether any subset of them can't be satisfied together. If some pair or triple is jointly unsatisfiable — say the demand for a criterion that's actually testable pulls against the demand that it not just be a test for being like us, or substrate-independence pulls against letting the biology constrain the answer — that's the part I most want to see, because then the list is itself a result and not just a checklist.

  A few distinctions I want kept seperate in there, because I keep seeing them run together: the computation that's a *sign* of sentience vs the computation that would *be* the sentience; being a subject of experience vs having interests vs being an agent; sentience as a threshold vs sentience as a matter of degree; and what we're justified in attributing vs what's actually there. Add any others the list needs.

  Then at the end tell me which single requirement does the most excluding work — which one, if I take it seriously, kills off the most otherwise-popular theories. If you want, a short pass over the main families (higher-order, global-workspace-ish, recurrent-processing-ish, behaviour-and-marker-based, precautionary/uncertainty-first) against the list. Keep that part short, the list is the point.

  Don't pad it, and don't hedge every claim into mush — I'd rather have a definite list with a few things you'd actually defend than a survey that says everything depends. And don't bother citing literature or pointing me at reading; I'm not asking for that, I want your reasoning.
