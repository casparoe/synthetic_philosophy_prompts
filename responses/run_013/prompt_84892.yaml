  - If he cites Machina's paradox for sure-thing, ask why we shouldn't fix the principle instead of ditching it.  
  - For medical tests, force him to reconcile REU with instrumental value of information.  

  Tone-wise, questions must sound conversational but precise—no jargon dumps. Phrases like "Could you walk us through..." or "Help me square that with..." keep it collegial. The "medical test" example grounds abstraction in visceral stakes.  

  One unspoken need: The user might want to showcase seminar rigor without hostility. So questions should model constructive skepticism—e.g., "Is there a risk that..." instead of "Isn't this wrong?"  

  Final list tightens phrasing:  
