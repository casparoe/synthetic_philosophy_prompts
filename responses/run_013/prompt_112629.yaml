answer: |-
  The air in the Bureau of Recompense Sub-Level Gamma hummed with the low thrum of calculation engines and the dry rasp of paper. Dust motes danced in the shafts of pale light falling from the high, grimy clerestory windows. Anya, Junior Auditor Grade 3, pushed her spectacles up her nose, the ink stain on her finger smudging the temple. Before her lay File #7743X, a life just concluded: **Subject: Male, Human, Age 8, Region: Bharata-Varsha (Southern Subcontinent), Cause of Termination: Starvation (complex).**

  The ledger was precise. Birth circumstances: impoverished weaver caste family, monsoon failure. Early years: marked by chronic hunger, parental neglect (mitigated by societal pressure). Karmic intake minimal (few conscious acts, mostly reactions). Output: suffering, significant. The actuarial tables whirred in her mind, cross-referencing the suffering index against the karmic balance carried forward. The conclusion was clear: insufficient suffering to offset the negative balance accrued *before* this life. The recommended next birth: similar circumstances, harsher environment, probable congenital defect to increase suffering efficiency.

  Standard procedure. But Anya’s pen hovered. The seam she kept tripping over had snagged her mind again.

  She flagged the file and carried it to Mithra’s desk. Mithra, Senior Auditor Grade 7, moved through ledgers like water through stone, unperturbed. Her desk was a fortress of stacked files, each representing a soul-stream’s interminable accounting.

  "Problem, Anya?" Mithra didn’t look up, her quill scratching steadily.

  "Case 7743X. Starvation termination. Child." Anya placed the file atop a precarious pile. "The negative balance predates this incarnation. Substantially."

  "Common enough. Carry-forward deficit." Mithra flipped a page in her own file, a complex case involving a merchant-prince’s fraudulent dealings.

  "Yes, but... tracing the source?" Anya leaned in, lowering her voice. "The deficit stems from Life Iteration #B-4492: adult male, violent theft resulting in death. The *victim* of that theft, according to the cross-reference, carried *their* deficit from a previous existence involving... well, it goes back. Indeterminate origin point."

  Mithra sighed, finally looking up. Her eyes, the colour of faded ledger paper, held infinite patience. "Origin point? Anya, you know the doctrine. The causal stream has no first cause. It’s adi-anadi, beginningless. We don’t *need* an origin point, only the current balance. The stream owes, the stream pays. Simple accounting."

  "But *who* is paying?" Anya pressed, tapping the file. "This child? He wasn't the thief in B-4492. He has no memory of it, no connection to it except this arbitrary label of 'same causal stream'. He suffered horribly for eight years to pay down a debt incurred by... by what? A ghost? A statistical probability? And now we propose more suffering for a debt *he*, as this specific aggregation of suffering and sensation, didn't incur?"

  Mithra steepled her fingers. "The 'who' is the stream. The label isn't arbitrary; it denotes causal continuity. The suffering in this life modifies the stream, alters its potential. The demerit *is* the debt, Anya. It *is* the negative potential. Suffering discharges it. Think of it like... compound interest. The principal is ancient, obscured, but the obligation remains attached to the account."

  "But merit and demerit," Anya argued, frustration creeping in, "they’re just entered as positive and negative integers. Yet they feel... different. The joy this child *might* have had, stolen by his circumstances – is that just a negative number? Is the thief's violent greed the same *kind* of negative as the systemic failure that starved a child? The system treats them as fungible quantities, summed into one total. It feels... crude. Like paying for stolen gold with sacks of potatoes."

  "It *is* crude," Mithra said flatly. "It's quantification. We deal in aggregates, probabilities, and balances. Nuance is a luxury for philosophers, not for an office processing quintillions of life-streams across multiple lokas. Justice?" She gave a dry chuckle. "The system *is* justice. It's the machinery of cause and effect, automated. Our job is accurate bookkeeping, not metaphysical hand-wringing." She gestured at the towering stacks. "Backlog in Processing is up 12% this quarter. Inter-Departmental squabble over jurisdiction for dream-state karma accruals is delaying half the files from the Astral Plane annex. We don't have time for existential audits."

  Anya looked down at the file. The cold facts: **Total Merit: 1.4 Standard Units (largely involuntary infant reflexes). Total Demerit: 378.5 SU (including carry-forward). Net: -377.1 SU. Recommended Suffering Quotient for Next Birth: Elevated (Tier 3). Proposed Circumstances: Rural labourer caste, flood-prone region, susceptibility to respiratory disease.**

  The child's eight years of hunger, the fear, the weakness – all meticulously logged as suffering units discharging a fraction of that massive negative number. A number born from an act of violence committed by a consciousness long dissolved, whose own negative balance stemmed from another dissolved consciousness, and so on, back into a past that never dawned. Who was being punished? Who was being repaid? The stream owed, the stream paid. But the *paying* felt like pure, meaningless agony inflicted on an innocent node in the chain.

  The doctrine denied a persistent self. So, punishment wasn't *retributive*, aimed at a sinner. It was merely... causal adjustment. But the *effect* was indistinguishable from horrific, disproportionate punishment meted out to someone who couldn't possibly comprehend the crime. And the quantification... reducing starvation and murder to commensurable units in a cosmic ledger. It felt less like justice and more like a horrifically complex, self-perpetuating accident.

  Anya could sign. Recommend the harsh rebirth. The calculations were correct. The system was internally consistent. The stream owed. The stream must pay. Mithra was right; sentiment and philosophical discomfort were inefficiencies the Bureau couldn't afford.

  She could refuse. Stamp 'Re-Audit Required: Philosophical Anomaly'. It would vanish into the Appeals backlog, likely for centuries, delaying the stream's progression, potentially causing karmic interest to accrue, making the next life *worse*. And what justification? 'Feels unfair'? The system didn't recognize 'fairness' as a valid metric, only balance.

  Her eyes fell on the 'Remarks' section, usually blank. A third option, neither approval nor refusal, but... annotation. A footnote in the endless ledger.

  She picked up her pen, dipped it. Not in the 'Approve' box. Not in 'Reject'. She wrote, clear and small, in the Remarks section:

  > *"Net deficit (-377.1 SU) discharged partially by Subject #7743X (8 solar years, suffering index gamma-7). Deficit source: Iteration #B-4492 (violent theft/homicide). No persistent identity verified between iterations. Suffering appears borne by unaware entity for debt incurred by dissolved antecedent. Validity of 'desert' in this context auditor notes as operationally defined but existentially unresolved per doctrine's own premises. Next birth recommendation procedurally compliant."*

  She didn't sign the approval line. She initialled the remark – **A.J.A. Gr3** – and placed the file in Mithra's 'Reviewed' tray. It wasn't refusal. The machinery would grind on. The child-stream would likely get its harsh next life. But the note was there. A tiny, bureaucratic grain of sand in the gears, a whisper of unease embedded in the official record.

  Mithra glanced at the tray, then at Anya's retreating back. She picked up File #7743X, saw the initialled remark, and sighed again, a sound like dry leaves skittering on stone. "Junior auditors," she muttered, stamping **APPROVED** with a decisive thud over Anya's note, partially obscuring it. She dropped it into the chute marked 'Incarnation Scheduling - Tier 3 Hardship'. The file vanished into the bowels of the Bureau.

  Anya sat back at her desk. The hum of the engines seemed louder. The next file awaited: a prosperous merchant who died peacefully in his sleep. She opened it. Clean ledger. Significant merit accrued through charitable donations (calculated net of tax evasion demerits). Recommended next birth: minor celestial administrator.

  She picked up her pen. The ink stain on her finger felt like a brand. She thought of a child who never knew why he was always hungry, told by some village philosopher that it was simply the fruit of seeds he didn't remember planting. She looked at the merchant's comfortable balance. The calculations were correct. The system was consistent.

  Her pen hovered. The seam felt wider than ever. She began to add the figures.
