answer: |-
  Here's your one-sentence answer: **The phrase "is – and remains" emphasizes that capital's *foundation and continued existence* absolutely depend on measuring wealth by labor time, even as technological development makes this measure increasingly obsolete for actual wealth creation, revealing a fundamental contradiction.**

  **Full Reading (under 400 words):**

  1.  **"Ultimate development"**: This means the *highest, most complete form* the value relation takes. The capital/wage-labor relation is where production based on exchange-value reaches its peak expression and logical conclusion. It's the culmination, not necessarily the immediate end.
  2.  **"Presupposition is – and remains"**: This is crucial. Marx states that for this value-based system (capitalism) to function *at all*, labor time *must* be the fundamental measure and source of value ("determinant factor in the production of wealth"). This isn't just a historical starting point; it's an *ongoing, structural necessity* for capital. Capital *requires* the exploitation of living labor measured in time to generate surplus value.
  3.  **The Technological Shift**: Large industry makes real wealth (use-values, material abundance) depend increasingly on the "power of the agencies" (machinery, science, technology) applied *during* labor time, rather than the sheer quantity of labor time expended itself.
  4.  **The Contradiction**: This is where the force of "is – and remains" becomes clear. Capital's *own* drive for productivity (using more powerful machines/technology) *undermines* the very foundation ("presupposition") it depends on – the measurement of wealth/value by labor time. Wealth creation becomes detached from labor input, yet capital must still measure and extract value *as if* labor time were the sole source. This is a **Hegelian contradiction**: the system generates the force (technology) that makes its core principle (value measured by labor time) obsolete and dysfunctional. The relation (capital/labor) *generates* the conditions for its own potential dissolution.
  5.  **Why Determinism is Wrong?**: Your friend's reading misses the active contradiction. Marx isn't just predicting machines take over and capitalism peacefully ends. He's showing that capital *relies* on labor time ("is – and remains") but *simultaneously* develops forces that make this reliance absurd, creating an internal crisis. The system doesn't automatically end; the contradiction creates immense tensions and the *potential* for crisis and transcendence. The "fragment" explores how this *contradiction* strains the system to breaking point.
