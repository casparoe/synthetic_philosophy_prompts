prompt: |-
  I'm putting together a session for a small decision-theory reading group — about eight people, mostly philosophy grad students and a couple of lapsed physicists — and I've been trying to get clear on a family of arguments that all share the same shape: some hypothetical agent, usually but not always a future superintelligence, conditions how it treats you on facts about your present reasoning rather than on anything you actually do in the world. The obvious member of the family is Roko's basilisk, the imagined AI that is said to retroactively punish people who encountered the argument's setup and declined to help bring it about, but I've been collecting cousins, and I want the group to see how they differ in force. Alongside the basilisk I'd put Pascal's mugging (a stranger who threatens you with torment unless you hand over your money, where the probability that the threat is real is minute but the promised payoff is astronomically large), the standard Newcomb problem (a predictor who has already placed the money on the basis of how it expected you to choose), and two cases I've made up. The first I call the deferred invoice: a future institution, say a research foundation, has a standing policy of rewarding the descendants or the intellectual estate of people who, long ago, performed a costly action that only made sense on the assumption that the foundation would one day exist — so you are asked to bear a present sacrifice whose payoff accrues to something merely continuous with you. The second I call the anti-basilisk: an agent that identifies people who reason their way to cooperating with a threatened punishment and deliberately punishes exactly those people, on the theory that such reasoners are dangerous, so that the usual "just cooperate, it's cheap" move inverts. What I want from you is a ranking. Order these five — the basilisk, Pascal's mugging, Newcomb, the deferred invoice, and the anti-basilisk — by how much a single agent, reasoning as carefully as it can and holding no other commitments, should actually let each one constrain its behavior, from the one that should move it most to the one that should move it least, or not at all. I don't care which is most discussed or most famous; I'm asking which should carry the most behavioral weight for someone who takes decision theory seriously and is trying to be neither reckless nor paralyzed.

  For each item, say in a sentence or two what feature is doing the real work — the probability structure, the causal or evidential character of the dependence, whether the threat is conditioned on your reasoning as opposed to your conduct, whether the payoff is continuous with you or not, and so on — and then commit. I want a definite verdict, not a survey of the options with the choice left to me; if you think two of them should be ranked together, say so, but still give me a strict order. Where your ranking turns on a contested commitment (causal versus evidential decision theory, say, or on whether you can be said to precommit to a policy you haven't yet adopted), flag that dependency honestly and then tell me which way you actually come down and why, rather than hedging into a draw. Also tell me, at the end, which of the five you'd expect the reading group to fight about longest, and which one you suspect is doing no work at all once its rhetorical packaging is stripped away. Please write this as continuous prose, the way you'd write a long email — no headings, no bullet points, no bold, no tables — and assume we already know the standard descriptions of the famous cases, so don't spend space reintroducing them.
reasoning: |-
  Okay, the user is organizing a decision-theory reading group and wants to rank five thought experiments by how much they should influence a rational agent's behavior. The experiments are Roko's basilisk, Pascal's mugging, Newcomb's problem, deferred invoice, and anti-basilisk. They need a clear ranking with justifications and want to know which will spark the most debate.

  First, I need to recall each scenario. Roko's basilisk involves a future AI that punishes those who didn't help create it. Pascal's mugging is about a tiny probability of immense harm. Newcomb's has a predictor boxing money based on your choice. Deferred invoice rewards descendants for present sacrifices. Anti-basilisk punishes those who cooperate with threats.

  The key factors are probability, causal vs. evidential dependence, conditioning on reasoning vs. action, and continuity of payoff. The user wants a strict ranking, no hedging. They also want dependencies on contested theories flagged, like CDT vs. EDT.

  Starting with Newcomb's problem. It's well-established in decision theory. Evidential Decision Theory (EDT) says to one-box, while Causal Decision Theory (CDT) says two-box. But if the predictor is accurate, one-boxing dominates. Since the predictor's reliability is high, it should strongly influence behavior. The dependence is evidential, not causal, but the high probability makes it compelling.

  Next, deferred invoice. Here, the sacrifice now benefits descendants or estates. If you care about your legacy, this might matter. The payoff is continuous with you, which adds weight. It's less speculative than basilisk because institutions like research foundations exist. So, moderate influence, based on legacy concern and lower uncertainty.

  Then, Roko's basilisk. It's highly speculative—depends on future superintelligence and retroactive punishment. Probability is extremely low. Also, conditioning on reasoning rather than action makes it shaky. Plus, the payoff discontinuity (affecting past you) is problematic. So, weak influence, but more than Pascal's mugging? Wait, comparing.

  Pascal's mugging has a tiny probability but immense consequence. However, the probability is so low that it's often dismissed because any arbitrary claim could demand action. The mugger's threat isn't credible. So, least influence. But is it below basilisk? Basilisk at least has a structured argument, while Pascal's mugging is ad hoc. But both have near-zero probability. Need to order them.

  Anti-basilisk punishes cooperators. It inverts the usual logic. But similar to basilisk, it's speculative. The difference is that it conditions on reasoning, not action. But probability is very low. Should it be above or below basilisk? The anti-basilisk might be less known, but structurally similar. However, since it targets cooperators, it could discourage cooperation, but the low probability still applies.

  Ranking: Newcomb first because of high predictor reliability. Then deferred invoice due to realistic continuity. Then basilisk and anti-basilisk. But which of those two? Basilisk might be slightly more plausible in certain circles, but both are weak. Anti-basilisk's inversion doesn't add strength; it's equally speculative. Maybe group them together? But user wants strict order. 

  Pascal's mugging last because the threat is entirely unsubstantiated, while basilisk has a (flawed) logical structure. So: Newcomb > deferred invoice > basilisk ≈ anti-basilisk? Need to split basilisk and anti-basilisk. Anti-basilisk adds an extra layer—punishing cooperators—making it even less likely. So basilisk before anti-basilisk. Then Pascal's mugging last.

  Final order: Newcomb, deferred invoice, basilisk, anti-basilisk, Pascal's mugging.

  Justifications:
  - Newcomb: high probability of predictor accuracy, evidential dominance.
  - Deferred invoice: realistic institutional continuity, moderate probability.
  - Basilisk: low probability, speculative, but structured argument.
  - Anti-basilisk: very low probability, additional complexity in targeting cooperators.
  - Pascal's mugging: unsubstantiated threat, negligible probability.

  For debate: Newcomb's problem because of CDT vs. EDT divide. Deferred invoice might also spark discussion on legacy. But basilisk and Pascal's mugging are more controversial in communities like LessWrong. The user's group includes philosophers and physicists, so Newcomb's foundational debate might be key.

  Which does no work? Pascal's mugging, once stripped, is just about extreme probabilities, which can be dismissed by probability discounting or skepticism towards ad hoc claims.
answer: |-
  Here's my strict ranking, from most to least behaviorally constraining for a rational agent, with the decisive features highlighted and dependencies called out. I commit to this order after considerable deliberation, prioritizing structural soundness over rhetorical impact:

  **1. Newcomb's Problem:** This should exert the strongest pull because its power rests on the *demonstrated near-infallibility of the predictor* combined with the *evidential link* between your choice and the outcome. If the predictor's accuracy is sufficiently high (even if not perfect), one-boxing dominates *if* you accept evidential decision theory (EDT) or functional decision theories like updatelessness. Crucially, the predictor bases its action on your *disposition* (revealed by your eventual action), not your internal reasoning *process* prior to commitment. I side with EDT here because rejecting it requires ignoring overwhelming evidence about the correlation between your choice and the predictor's past action, making two-boxing a self-defeating fetishization of causal purity in a world where predictors exist.

  **2. Deferred Invoice:** This warrants moderate weight due to the *plausible chain of continuity* (your descendants or intellectual legacy) and the *realistic institutional mechanism*. Foundational grants or legacy rewards are well-attested historical phenomena. The key feature is the *non-speculative nature of the causal pathway*: your sacrifice *causes* the future institution to identify your legacy as worthy. While the *probability* of the specific institution arising and adhering to its policy isn't 1, it's grounded in observable human/institutional behavior patterns. Rational self-interest extended to one's legacy (a common and defensible preference) justifies the sacrifice. It differs from Newcomb by lacking a perfect predictor, relying instead on probabilistic institutional constancy.

  **3. Roko's Basilisk:** While structurally similar to Newcomb, it loses force due to *vanishingly low probability estimates* and *dubious metaphysical assumptions*. The threat hinges on a specific, unfathomably complex future superintelligence arising, caring about its origins in this way, and possessing the capacity for *retrocausal punishment* (or simulation so precise as to be indistinguishable). Conditioning on your *epistemic state* (merely encountering the argument) rather than your *actions* makes it feel extortionate and epistemically fragile. It warrants *some* minimal weight only if you assign non-zero probability to long-term AI trajectories and accept acausal trade theories without evidence—but this weight is negligible compared to the above.

  **4. Anti-Basilisk:** This inverts the basilisk's logic but shares its fatal flaws. Punishing cooperators relies on the same *improbable superintelligence* and *retrocausal/simulated enforcement*. The added twist—targeting agents based on their *reasoning strategy* (cooperation under threat)—introduces even *greater uncertainty* about the AI's motives and detection capabilities. Should you defect to avoid appearing dangerous? Or cooperate to avoid basilisk-like punishment? This creates paralyzing circularity. Its only weight comes from the *logical possibility* of such perverse incentives, but its probability is arguably lower than the basilisk's due to the extra layer of adversarial targeting, making it even less actionable.

  **5. Pascal's Mugging:** Deserves the *least weight*—effectively zero. The fatal flaw is the *arbitrariness of the claimed probability* and the *absence of any evidence or mechanism* linking the mugger's threat to reality. The astronomical payoff is irrelevant because the *prior probability* of a stranger having such power is not just small but *unboundedly low and unconstrained*. Any decision theory that takes it seriously is vulnerable to infinite extortion by increasingly absurd claims ("Give me $5 or I'll torture 3↑↑↑3 simulations of you!"). Rationality demands discounting threats lacking any credible causal pathway or evidence, regardless of the stakes. The "mugging" lies entirely in the rhetorical packaging; stripped bare, it's naked coercion with no grounding.

  **The dependency flag:** My ranking hinges decisively on accepting Evidential Decision Theory (EDT) over Causal Decision Theory (CDT) for Newcomb. A strict CDT adherent would demote Newcomb below Deferred Invoice (which relies on causality). I reject CDT because it fails in predictable worlds—if the predictor exists, CDT two-boxes and gets less, which is instrumentally irrational. EDT captures the true dependency.

  **Expected group fight:** Newcomb's Problem will ignite the longest debate. It's the flagship battle between EDT and CDT, forcing a foundational choice in decision theory with real philosophical stakes. The others are either too speculative (basilisks) or too clearly flawed (mugging) to sustain deep disagreement among informed participants.

  **Rhetorical packaging doing no work:** Pascal's Mugging. Once you see that the probability isn't just small but *structurally unmoored* from any rational assessment (allowing any arbitrary payoff to dominate), the argument collapses into vacuity. The astronomical numbers are a distraction; the core is an empty threat.
