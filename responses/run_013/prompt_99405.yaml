prompt: |-
  I'm reading Burke's Reflections on the Revolution in France and I'm stuck on a passage where he says something like a state that has no means of changing itself also has no means of conseving itself. I get the words but not the deeper point. Can you help me understand what he's getting at? And how does that connect to Chesterton's fence idea? I don't need citations or reading lists, just explain the idea.
