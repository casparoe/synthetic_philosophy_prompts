answer: |-
  Here's a faithful translation of Pascal's core argument on justice and force into your institutional economics vocabulary, followed by a residue report highlighting the conceptual gaps:

  **Pascal's Argument Translated:**

  1.  **The Problem of Enforcement:** There exists no universally recognized, self-enforcing "justice equilibrium" based on an intrinsic, deliverable standard. Justice, as an abstract concept, lacks inherent power/force (`credible commitment`).
  2.  **Equilibrium Selection via Power:** Faced with this inability to make justice inherently strong (`self-enforcing`), societies select an equilibrium where existing power (`de facto power`) is endowed with legitimacy (`de jure legitimacy`). This power becomes the focal point around which expectations coalesce.
  3.  **The Source of Legitimacy (Custom/Law):** What passes for "justice" in practice (`the selected equilibrium`) is stabilized and made operational not by reference to an intrinsic standard, but through `focal points` established by `custom` and codified `law`. These function as `third-party enforcement` mechanisms (`conventions`, `institutions`) that coordinate beliefs and behaviors, making the power-based equilibrium `self-enforcing` by punishing deviations.
  4.  **The Gap as Foundational:** The persistent `gap between de facto power and de jure legitimacy` is not an institutional failure to be corrected, but the *very foundation* of the selected equilibrium. Legitimacy is *conferred upon* power by the stabilizing institutions (custom/law), masking its origin in force.
  5.  **The Diagnosis vs. Explanation:** This analysis (`diagnosis`) of the power-legitimacy link serves primarily a religious/apologetic purpose (highlighting the flawed, contingent nature of human justice and pointing towards divine justice) rather than being offered as a complete positive `explanation` of *how* specific institutions emerge or persist through functional incentives alone.

  **Residue Report:**

  1.  **"No Deliverable Standard" of Justice:**
      *   **Translation Attempt:** Economics assumes preferences/stability define the equilibrium. Pascal denies any *intrinsic, knowable* standard exists *at all*, making the very notion of a "just" equilibrium based on deliverable truth incoherent in his view.
      *   **Residue:** Pascal's radical skepticism about any objective, knowable foundation for justice.
      *   **Nature of Residue:** **Genuine Gap in Economic Vocabulary.** Institutional economics takes preferences, values, and notions of "justice" (as defined within a system) as given or emerging from interactions. It doesn't (and typically cannot) engage with the metaphysical question of whether an *objective* standard exists or is knowable. Economics explains *how* beliefs about justice function within an equilibrium; Pascal questions if any belief corresponds to *actual* justice. This residue reflects economics' agnosticism about ultimate normative foundations.

  2.  **Justice's Inherent Lack of Force:**
      *   **Translation Attempt:** Framed as justice lacking a `self-enforcing` mechanism or `credible commitment` technology on its own.
      *   **Distortion:** Economics can readily model equilibria *called* "just" that *are* self-enforcing based on shared beliefs/incentives (e.g., norms of fairness). Pascal's claim is stronger: abstract justice *in principle* lacks force, *requiring* force to be made operational. The translation *describes the outcome* (justice needs enforcement) but subtly naturalizes it, while Pascal presents it as a profound human failing.
      *   **Survival with Distortion:** Yes. The translation captures the functional dependence of "justice" on enforcement power within any operational system. However, it loses Pascal's sense that this dependence reveals a deep *problem* or *tragedy* inherent in the human condition, rather than just a practical institutional design challenge.

  3.  **The Religious/Apologetic Purpose:**
      *   **Translation Attempt:** Stated directly as the purpose being non-explanatory.
      *   **Residue:** The entire *point* of the diagnosis – to reveal the contingency and inadequacy of human institutions, thereby making room for faith/divine justice – and the specific theological framework driving this conclusion.
      *   **Nature of Residue:** **Pascal Doing Something Else Entirely.** Institutional economics aims for positive (descriptive/explanatory) or functional analysis of how institutions work. Pascal's ultimate goal is normative, theological, and existential: to humble human reason, expose the vanity of worldly power, and direct attention towards God. This residue isn't a gap in economics; it's a fundamentally different project. Economics describes the machine; Pascal uses the machine's flaws to argue for a different reality beyond it.

  4.  **The Moral Evaluation Implicit in "Made Strength Just":**
      *   **Translation Attempt:** Framed as `equilibrium selection` where power becomes the `focal point` and gains `de jure legitimacy`.
      *   **Distortion:** While accurate descriptively, the translation risks making the process sound neutral or functional ("we selected an equilibrium"). Pascal's phrasing ("we *could not* make justice strong... *made* strength just") carries a strong connotation of *resignation*, *fraud*, or *corruption*. The act of *making* strength just implies a conscious or systemic deception masking raw power.
      *   **Survival with Distortion:** Partially. The translation captures the institutional outcome. However, Pascal's profound pessimism and moral critique about the *necessity* and *nature* of this act – the sense that it's a fallen compromise, not just a coordination solution – is significantly diluted. Economics explains *why* it happens (coordination, stability); Pascal laments *that* it happens and *what it says about us*.

  **Summary of Honest Translation:**

  Pascal's core institutional insight – that stable social order (`self-enforcing equilibrium`) requires converting `de facto power` into `de jure legitimacy` via `focal points` (`custom`, `law`) acting as `third-party enforcement`, precisely because no intrinsic `deliverable standard` of justice provides its own `credible commitment` – translates remarkably well into modern institutional economics vocabulary concerning `equilibrium selection` and enforcement.

  **Summary of Key Residues & Their Nature:**

  1.  **Radical Skepticism about Objective Justice:** A **genuine gap** in economic vocabulary. Economics doesn't engage with the (non-)existence of knowable intrinsic standards.
  2.  **Inherent Tragedy of Justice's Weakness:** Survives translation **with distortion**. Economics describes the functional dependence; Pascal emphasizes its existential weight.
  3.  **Theological Purpose & Framework:** **Pascal doing something else entirely.** Not a failure of economics, but a different intellectual project (religious apology).
  4.  **Moral Critique of the "Making Just" Process:** Survives translation **with significant distortion**. The translation describes the mechanism; Pascal condemns its moral implications.

  The translation holds for the *mechanism* of institutional stabilization (`equilibrium selection` via `focal points`/`enforcement` bridging the power-legitimacy gap). The residues primarily stem from Pascal's deeper philosophical skepticism about the foundations of justice and his ultimate theological/apologetic aims, which lie outside the descriptive/explanatory scope of institutional economics. The distortion arises mainly in neutralizing the profound moral and existential weight Pascal assigns to these institutional realities.
