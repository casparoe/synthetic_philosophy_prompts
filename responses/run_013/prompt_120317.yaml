prompt: |-
  In the metaphysics of dispositions, a fink is a condition that removes a disposition when its stimulus occurs, while a mask prevents manifestation without removing the disposition. The standard conditional analysis says that an object is disposed to M when S just in case it would M if S were to occur. Consider a self-exhausting disposition: its stimulus condition includes the condition that the disposition has not yet been manifested, so the first manifestation removes the disposition. Give an example of a conceptual issue that such a disposition raises for the conditional analysis—especially concerning whether the disposition can be intrinsic and whether its stimulus condition can be specified without circularity—and say whether the case is best classified as finkish, masked, or neither. End with a one-sentence summary on a final line beginning "Summary:".
