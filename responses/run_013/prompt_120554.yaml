  ### **Humean Money & Trade Simulation: "The Neutrality Illusion"**  
  *Designed for 75 minutes, 18 students, $0 budget, using only paper, tokens, and movable chairs.*

  ---

  #### **Core Learning Goals**  
  1. **Long-run neutrality of money**: Doubling money without changing real factors only inflates prices.  
  2. **Short-run non-neutrality**: The *order* of money injection redistributes real wealth.  
  3. **Self-correcting trade imbalance**: Surplus countries "price themselves out" of markets.  

  ---

  #### **Materials & Setup**  
  **What You’ll Prep (1 hour, reusable):**  
  - **Goods Tokens**: Cut 100+ small cards:  
    - 50x **"Cloth"** (blue paper)  
    - 50x **"Spice"** (yellow paper)  
  - **Money Tokens**: Print 200+ **"Gold Coins"** (circle stickers on cardstock; 1 coin = £1).  
  - **Role Cards**: 18 cards (9x **"England"**, 9x **"Portugal"**).  
  - **Player Trackers**: 18 sheets to record trades, prices, and endowments.  

  **Starting Conditions:**  
  - Each player starts with:  
    - **England**: 10 Cloth + 10 Gold.  
    - **Portugal**: 10 Spice + 10 Gold.  
  - **Total Money Supply (M)**: 180 Gold.  
  - **Utility Scoring**:  
    - 1 Cloth + 1 Spice = 10 points (full utility).  
    - Any other combination = 5 points (partial utility).  

  **Room Setup:**  
  - Push chairs into two circles: **England** (left) and **Portugal** (right).  
  - Place a **trading zone** in the center for cross-country deals.  

  ---

  #### **Game Rules (45 minutes total)**  
  1. **Introduction (5 min)**:  
     - Assign roles (9 England, 9 Portugal).  
     - Explain: *"Trade to maximize points. Set your OWN prices. Money is saved between rounds."*  

  2. **Round 1: Baseline Trade (10 min)**  
     - **Rules**:  
       - Players trade domestically OR internationally (walk to center zone).  
       - **No price controls**: Buy/sell Cloth/Spice for Gold via haggling.  
       - Record transactions on trackers (e.g., "Sold 1 Cloth for 2 Gold to Portugal").  
     - **Goal**: Establish equilibrium prices (e.g., Cloth ≈ Spice ≈ 1-2 Gold).  

  3. **Round 2: Money Injection to England (10 min)**  
     - **Shock**: Give **England players +20 Gold each** (simulates trade surplus/mine discovery).  
     - **Rules**: Same as Round 1.  
     - **Predictable outcome**: English bid up Spice prices → Portuguese gain Gold.  

  4. **Round 3: Delayed Effects (10 min)**  
     - **No injection**.  
     - **Rules**: Same.  
     - **Predictable outcome**: Portuguese (now flush with Gold) bid up Cloth prices → English feel inflation.  

  5. **Round 4: Neutrality Test (10 min)**  
     - **Shock**: **Double every player’s Gold** (e.g., if a player has 15 Gold, give +15).  
     - **Rules**: Same.  
     - **Predictable outcome**: Prices double → real consumption unchanged.  

  ---

  #### **Debrief (25 min): Guided Socratic Dialogue**  
  **Map Game → Hume’s Essays:**  
  | **Game Event**          | **Humean Concept**                          | **Student Prompt**                                                                 |  
  |--------------------------|---------------------------------------------|------------------------------------------------------------------------------------|  
  | Round 1 prices           | Initial trade balance                       | *"Why did Cloth/Spice settle at ~1-2 Gold? Did anyone ‘win’ trade?"*               |  
  | Round 2 English spending | Short-run non-neutrality                    | *"Who gained REAL goods when England got new Gold? Why didn’t Portugal benefit yet?"* |  
  | Round 3 price spikes     | Self-correcting imbalance                   | *"Why did England’s early ‘win’ now hurt them? How does this kill their trade edge?"* |  
  | Round 4 doubled prices   | Long-run neutrality                         | *"Did doubling Gold make anyone richer? Why/why not?"*                             |  

  **Key Connection:**  
  > *"Hume isn’t contradicting himself—he’s describing a TIME-LAG. New money is non-neutral at first (redistributing real goods), but neutral later (just changing numbers). The trade imbalance isn’t stable because winners inflate their own costs."*  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem: Price confusion in Round 1.**  
     - *Why*: Students freeze when setting prices.  
     - **Fix**: Start trading with a **practice minute**. Model haggling: *"I’ll sell 1 Cloth for 3 Gold! Anyone?"*  

  2. **Problem: Asymmetric inflation (e.g., Spice prices soar, Cloth lags).**  
     - *Why*: Portugal might hoard Gold in Round 2.  
     - **Fix**: Remind them: *"Points come from GOODS, not Gold. Spend to win!"*  

  3. **Problem: "Why does Round 4 matter if no one wins?"**  
     - *Why*: Students miss neutrality’s significance.  
     - **Fix**: Contrast Rounds 2 and 4: *"In Round 2, England gained REAL Spice. In Round 4, did anyone gain REAL goods? Why not?"*  

  ---

  #### **Limitations of the Game vs. Hume**  
  **What the Game Can’t Replicate:**  
  - **Hume’s "Industrious Spirit"**:  
    Hume argues new money boosts productivity *before* prices rise ("encouraging industry"). But in the game, **goods are fixed** (no production choices). Students can’t "work harder" when money arrives.  
    - **How to Address**: Say explicitly:  
      > *"In reality, new money can stimulate output IF producers expand before prices adjust. Our game holds goods fixed to focus on price effects—but Hume’s full picture includes this dynamism."*  

  ---

  #### **Confidence Assessment**  
  - **Overall Confidence**: 8/10.  
    - **Why it will land**: The visceral experience of bidding wars makes non-neutrality unforgettable. Self-correction emerges naturally when "winners" lose access to goods.  
  - **Weakest Element**: **Self-correcting trade imbalance** (Round 3).  
    - *Risk*: Econ students may not "feel" being priced out if inflation is mild.  
    - **Mitigation**:  
      1. Pre-game: *"Portugal, your goal is to buy LOW and sell HIGH. England, your goal is to avoid being squeezed."*  
      2. During Round 2: Whisper to Portuguese: *"Charge more! English are desperate!"*  
      3. Debrief: Hammer the point: *"England’s early surplus flooded Portugal with Gold—how did that turn England’s win into a loss?"*  

  ---

  ### **Final Tips**  
  - **Keep Pace**: Use a timer! Stick to 10 min/round.  
  - **Embrace Chaos**: Let students haggle loudly—it mirrors real markets.  
  - **No Tech, No Problem**: Paper tokens force tactile engagement (apps would distance them).  
  - **9am Energy**: Start with a provocation: *"Who thinks doubling money makes you richer? Let’s test that..."*  

  By making students *live* Hume’s paradox, you’ll transform abstract theory into a "Eureka!" moment. The game’s imperfections (fixed goods, simplified trade) become teachable moments—not bugs.
