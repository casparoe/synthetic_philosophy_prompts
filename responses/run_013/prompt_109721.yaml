prompt: |-
  I am a junior at a large public high school and the student representative on our school's science fair ethics review committee. The committee meets once a month, usually with five to eight student research proposals on the agenda, and I have about twenty minutes to review each one before we vote. Most proposals involve human participants, and almost all of them are designed and run by students on their classmates. My role is not to make final legal rulings; the faculty advisor and the district research review office have to sign off on anything we approve. But the committee's recommendation carries weight, and I am the only member who has not taken a research methods course. I need a decision procedure I can actually run in a meeting, grounded in the philosophical conditions that make consent valid, rather than in a list of rules I would have to look up.

  Please write that procedure for me. I want it as a checklist or a flowchart in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it has to hand the decision to a human because the question is about values rather than facts. It should be built around the conditions that philosophers usually treat as necessary for valid consent: that the person is competent to consent, that they are adequately informed, and that their agreement is voluntary rather than coerced or unduly influenced. But I need those conditions translated into something a high school student can apply to peer research, where the participants and the researchers are often friends, classmates, or students of the same teachers, and where the line between a favor and pressure is not obvious.

  The procedure has to handle at least these hard cases: a study that uses deception, where participants are told the study is about one thing but it is actually about another; a study where a teacher offers extra credit or some other benefit for participating; and a study where a participant may not fully understand what they are agreeing to, either because of age, disability, or language. It should also say what to do when more than one problem is present at once, and it should distinguish between consent that is invalid and consent that is valid but should still be refused for other reasons. I do not need citations, a reading list, or a survey of the literature. I need the procedure itself, in a form I can defend to teachers and parents who will ask why we approved or blocked a project.

  Then run the procedure on three proposals. First, a student wants to test whether peer pressure affects snack choices. Participants will be told the study is about taste preferences, but the real purpose is to see whether they change their answers after hearing a confederate. The student plans to debrief them afterward. Second, a student wants to survey classmates about homework habits, and a teacher has agreed to offer five points of extra credit to anyone who participates. Third, a student wants to survey classmates about school belonging, including a sixteen-year-old classmate with an individualized education program and a mild intellectual disability. The researcher is a close friend of that classmate and plans to read the questions aloud. For each proposal, give me the verdict the procedure produces, the steps that produce it, and the strongest objection someone on the committee would raise. I expect to dislike at least one verdict, so please do not soften the procedure to make it come out the way I would prefer.

  Finally, tell me what the procedure cannot do. Where is it likely to misfire? Which judgments are really about values rather than facts? What should I do when the procedure gives no clear answer, and what information would a human decision-maker need in those cases? I would rather have a procedure with honest limits than one that pretends to settle everything.
reasoning: |-
  Okay, the user is a junior in high school serving on their school's science fair ethics review committee. They need a practical decision procedure for evaluating research proposals, grounded in the philosophical conditions for valid consent: competence, information, and voluntariness. They want this in a checklist or flowchart format that's easy to apply during meetings, especially for peer research where relationships complicate consent.

  The user faces unique challenges. As a student reviewing peers' projects, they deal with proposals involving classmates as participants, where power dynamics and friendships blur lines. They need something actionable without requiring research methods expertise. The procedure must handle deception, incentives like extra credit, and vulnerable populations while distinguishing invalid consent from other ethical concerns.

  Hmm, the core challenge is translating abstract philosophical concepts into concrete questions a high schooler can ask. For example:
  - How to assess "voluntariness" when a teacher offers extra credit?
  - How to handle deception without banning it entirely?
  - How to evaluate competence for a classmate with disabilities?

  I should structure this as a linear checklist with clear stop/go points. Each condition (competence, information, voluntariness) needs specific sub-questions tailored to high school contexts. Must include:
  - Hard stops for clear violations (e.g., coercion)
  - Flags for human judgment calls (e.g., "is this incentive undue pressure?")
  - Handling multiple issues compounding

  For the three test cases:
  1. The deception study about snack choices - the procedure should flag deception as automatically invalid without exceptional justification, which a high school project likely lacks.
  2. The extra credit survey - this needs nuance. The procedure should ask whether the incentive creates unavoidable pressure, which it probably does since extra credit is tied to academics.
  3. The survey including a classmate with disabilities - here the key question is whether the researcher-friend relationship creates influence that undermines voluntariness, and whether accommodations are sufficient for competence.

  The limitations section is crucial. The procedure won't catch everything - like subtle coercion in friend groups, or whether debriefing fixes deception harm. It also can't replace value judgments about what risks are "worth it" for educational benefits. When stuck, the committee should default to "no" or escalate to faculty.

  Biggest risks are false negatives (approving bad studies) when relationships mask coercion, or false positives (blocking benign studies) by being too strict on incentives. The user should document why they overruled the procedure in edge cases.
answer: |-
  Here is a consent validity assessment procedure designed for your context, grounded in the three core philosophical conditions (Competence, Information, Voluntariness). It's a linear checklist with clear stopping points and flags for human judgment.

  **Consent Validity Assessment Procedure (CVAP)**

  1.  **START:** Review the proposed consent process/materials & research activities.
  2.  **COMPETENCE CHECK:**
      *   **Q1:** Are *all* participants legally minors (under 18) in your jurisdiction? *(Usually YES in a high school)*
          *   **IF YES:** Proceed to Q2.
          *   **IF NO (e.g., adult teacher participating):** Skip to Step 3 (Information).
      *   **Q2:** Does the proposal identify *any* potential participants known or likely to lack the cognitive/emotional maturity to understand the basic nature of the research and what they are agreeing to? *(Consider age, known disabilities - especially intellectual/cognitive - language barriers, developmental stage)*
          *   **IF NO:** Proceed to Step 3 (Information).
          *   **IF YES:**
              *   **Q2a:** Does the proposal include *specific, documented, and appropriate* accommodations to ensure understanding for *each* such participant? (e.g., simplified language, visual aids, independent verification of understanding by a neutral party, parental/guardian involvement if appropriate and required by policy).
                  *   **IF YES:** Proceed to Step 3 (Information).
                  *   **IF NO:** **STOP - INVALID CONSENT (Competence Failure).** Recommendation: Reject or require robust accommodations before reconsideration.
  3.  **INFORMATION CHECK:**
      *   **Q3:** Does the consent information clearly state the **core activities** the participant will be asked to do? (e.g., "You will fill out a 10-minute survey about homework," "You will taste 3 snacks and rate them," "You will be interviewed for 15 minutes about friendships").
          *   **IF NO:** **STOP - INVALID CONSENT (Information Failure).** Recommendation: Reject or require clear description.
          *   **IF YES:** Proceed to Q4.
      *   **Q4:** Does the consent information clearly state any **reasonably foreseeable risks or discomforts**? (e.g., boredom, mild embarrassment from answering personal questions, minor time commitment, potential for peers to see their choices, potential for feeling pressured). *(Note: Must be concrete, not just "some risk exists")*
          *   **IF NO:** **STOP - INVALID CONSENT (Information Failure).** Recommendation: Reject or require inclusion of foreseeable risks.
          *   **IF YES:** Proceed to Q5.
      *   **Q5:** Does the consent information clearly state that participation is **voluntary** and they can **withdraw at any time** without penalty? (Must be explicit).
          *   **IF NO:** **STOP - INVALID CONSENT (Information Failure).** Recommendation: Reject or require explicit statement.
          *   **IF YES:** Proceed to Q6.
      *   **Q6:** **Is deception involved?** (Participants are misled about the true purpose or some aspect of the study).
          *   **IF NO:** Proceed to Step 4 (Voluntariness).
          *   **IF YES:**
              *   **Q6a:** Is the deception about something trivial AND absolutely necessary to get valid results? (e.g., not telling the *exact* hypothesis is usually okay; lying about what they are doing is not trivial).
              *   **Q6b:** Does the proposal include a **mandatory, timely debriefing** where the true purpose is explained, deception is revealed, and participants are given a chance to withdraw their data?
              *   **IF BOTH Q6a AND Q6b are YES:** The deception *might* be justified, but **FLAG FOR HUMAN JUDGMENT**. Proceed to Step 4 (Voluntariness), but the deception requires committee debate on necessity and risks. *(The consent given was still not fully informed, but debriefing mitigates)*.
              *   **IF EITHER Q6a OR Q6b is NO:** **STOP - INVALID CONSENT (Information Failure - Fundamental Deception).** Recommendation: Reject. Deception without strong justification and debriefing invalidates initial consent.
  4.  **VOLUNTARINESS CHECK:**
      *   **Q7:** Are there any **offers of benefits** for participation? (e.g., extra credit, gifts, money, preferred activity).
          *   **IF NO:** Proceed to Q8.
          *   **IF YES:**
              *   **Q7a:** Is the benefit **contingent solely on participation**? (e.g., just showing up/signing up earns it, regardless of answers or completing the study).
                  *   **IF NO (e.g., must complete study, must give certain answers):** **STOP - INVALID CONSENT (Voluntariness Failure - Coercion).** Recommendation: Reject.
                  *   **IF YES:** Proceed to Q7b.
              *   **Q7b:** Is the benefit **modest and proportional** to the effort/risk? (e.g., small candy bar for 5 mins; 1% extra credit for a 30-min survey).
              *   **Q7c:** Is the benefit **available through an equivalent alternative activity**? (Crucial for academic benefits like extra credit).
              *   **IF BOTH Q7b AND Q7c are YES:** Benefit is likely acceptable. Proceed to Q8.
              *   **IF EITHER Q7b OR Q7c is NO:** **FLAG FOR HUMAN JUDGMENT (Potential Undue Influence).** Proceed to Q8, but the voluntariness is questionable and requires committee debate. *(Is the benefit too big? Is the alternative truly equivalent and non-burdensome?)*
      *   **Q8:** Is there any **perceived or real pressure** to participate beyond the potential benefit? (Consider: Is the researcher in a position of authority over participants? Teacher? Club leader? Popular kid? Close friend? Is recruitment public/group-based increasing social pressure? Is refusal made to feel awkward or disloyal?)
          *   **IF NO:** Proceed to VERDICT 1.
          *   **IF YES:**
              *   **Q8a:** Does the proposal include **specific, robust safeguards** to minimize this pressure? (e.g., private recruitment/consent by a neutral party, anonymous participation, clear & repeated emphasis on "no penalty for saying no", avoiding researchers recruiting their own close friends for sensitive topics).
                  *   **IF YES:** Proceed to VERDICT 1.
                  *   **IF NO:** **FLAG FOR HUMAN JUDGMENT (Serious Voluntariness Concern).** Proceed to VERDICT 1, but the risk of coercion/undue influence is high and requires committee debate.

  **VERDICT POINTS:**

  *   **VERDICT 1: CONSENT IS VALID (Proceed to Risk/Benefit & Other Ethics):** The core conditions for valid consent (Competence, Information, Voluntariness) appear met. *This does NOT mean the project is automatically approved.* The committee must *still* consider:
      *   Is the risk/benefit ratio acceptable? (Even with consent, is the risk too high for a school setting?)
      *   Are there other ethical concerns? (Privacy, confidentiality, scientific validity, fairness, potential for harm even with consent)?
      *   Does it comply with *additional* school/district policies? (Parental consent requirements for minors are common! This checklist doesn't replace that legal requirement).
  *   **STOP - INVALID CONSENT:** Consent is fundamentally flawed. **Recommendation: Reject the proposal** unless the flaw can be definitively corrected *before* any participant contact. Do not proceed to risk/benefit.
  *   **FLAG FOR HUMAN JUDGMENT:** The checklist identifies a significant concern (Deception Justification, Benefit Voluntariness, Pressure Safeguards) that requires the *committee's collective discussion and vote* based on the specific context. There is no purely factual answer. The committee must debate necessity, proportionality, risk, and the adequacy of proposed safeguards. **Recommendation:** Discuss, then vote on whether the concern invalidates consent or if the safeguards/proposed justification are sufficient. Majority rules.

  **Handling Multiple Problems:** Apply the checklist sequentially. The first **STOP - INVALID CONSENT** encountered ends the consent assessment (reject). **FLAGs** accumulate; the committee must discuss each flagged issue. Multiple flags indicate higher risk.

  **Distinguishing Invalid Consent vs. Other Refusal:** Invalid Consent (STOP) means the agreement itself isn't ethically meaningful. Other reasons for refusal (after VERDICT 1) mean consent is real, but the activity is still deemed too risky, harmful, poorly designed, or against policy.

  ---

  **Application to Test Cases:**

  **Case 1: Peer Pressure / Deception Snack Study**

  1.  **Competence:** (Q1: Yes, minors. Q2: Unlikely specific incompetence mentioned. Assume NO) -> Proceed.
  2.  **Information:** (Q3: States "taste preferences" - YES core activity. Q4: Likely misses risk of embarrassment/pressure from deception -> **NO, STOP - INVALID CONSENT (Information Failure - Q4)**. They aren't informed of the real risk (peer pressure manipulation).
      *   *Verdict:* **STOP - INVALID CONSENT.** Recommendation: Reject. Deception about the core purpose means foreseeable risks (embarrassment, feeling manipulated) are not disclosed. Debriefing *might* fix it later, but initial consent is invalid.
      *   *Strongest Objection:* "But debriefing fixes it! We learn about Milgram! The risk is minimal, it's just snacks!" *Counter:* The checklist prioritizes informed consent *before* participation. They consent to taste testing, not peer pressure research. The risk isn't the snack, it's the deception and potential social discomfort, which isn't disclosed.

  **Case 2: Homework Survey with Extra Credit**

  1.  **Competence:** (Q1: Yes. Q2: Unlikely specific incompetence -> NO) -> Proceed.
  2.  **Information:** (Q3: Survey about homework - YES. Q4: Risks? (Time, potential boredom, maybe mild stress if questions are personal?) - *Likely insufficiently described, but assume generic "minimal risk" is stated -> YES? Proceed cautiously. Q5: Voluntary/Withdraw - MUST be YES. Q6: No deception -> Proceed.
  3.  **Voluntariness:** (Q7: YES, benefit (extra credit). Q7a: Contingent solely on participation? (Likely YES, just signing up). Q7b: Modest? (5 points - Depends on grading scale. If a 1000-point class, probably YES. If a 100-point class, 5 points is significant). Q7c: Equivalent alternative? **THIS IS CRITICAL.** Is there a clear, non-research-related way for *any* student to earn the same 5 points with comparable effort/time? If not -> **NO. FLAG FOR HUMAN JUDGMENT (Potential Undue Influence - Q7c)**. Q8: Pressure? Researcher is peer -> Potential minor pressure, but probably NO specific safeguard needed if anonymous/private. Proceed to Verdict with Flag.
      *   *Verdict:* **VERDICT 1: CONSENT VALID (BUT WITH FLAG)**. The committee must debate: **Is there a truly equivalent alternative activity for the extra credit?** If YES, consent is valid. If NO, the benefit may constitute undue influence, potentially invalidating consent. The committee must vote on this.
      *   *Strongest Objection:* "Teachers offer extra credit all the time! It's fine!" *Counter:* The checklist forces us to ask *if it's coercive*. Without a comparable alternative, students feel they *must* participate to get the credit, undermining true voluntariness. The committee must get clarity on the alternative.

  **Case 3: School Belonging Survey (Friend & Classmate with IEP)**

  1.  **Competence:** (Q1: Yes. Q2: **YES**, participant with mild intellectual disability identified). Q2a: Accommodations? (Researcher/friend reads questions aloud). **Is this sufficient?** Reading aloud helps, but does it ensure *understanding* of concepts like "school belonging," confidentiality, or voluntariness? Likely **NO** robust, documented plan involving verification of understanding (e.g., by a teacher, aide, or parent). -> **STOP - INVALID CONSENT (Competence Failure - Q2a)**.
      *   *Verdict:* **STOP - INVALID CONSENT.** Recommendation: Reject. The accommodation (friend reading aloud) is unlikely sufficient to ensure comprehension for an individual with a known mild intellectual disability. A more robust plan involving a neutral party assessing understanding is needed.
      *   *Strongest Objection:* "But they're friends! The researcher knows how to explain it to them! They want to help!" *Counter:* The checklist prioritizes the *participant's* understanding and autonomy. Friendship introduces potential for undue influence (covered later) but *first*, we must ensure the participant actually understands what they are agreeing to. The researcher/friend is not a neutral assessor of understanding. The disability requires specific, verifiable accommodations.

  ---

  **What the CVAP Cannot Do (Limitations & Misfires):**

  1.  **Nuanced Power Dynamics:** It flags obvious authority (teacher) or pressure, but struggles with subtle peer pressure, popularity, or intense friendship bonds ("I *have* to do it, they're my best friend"). Misfire: Might approve genuinely coercive situations involving subtle social forces if no explicit benefit or authority exists.
  2.  **Assessing "Reasonable" Risk:** It requires disclosure of *foreseeable* risks (Q4), but defining "foreseeable" and judging if disclosed risks are "reasonable" for a school setting involves value judgments the checklist can't make. This is pushed to the risk/benefit discussion after VERDICT 1.
  3.  **Judging Necessity & Proportionality:** The "Human Judgment" flags (Deception justification Q6a, Benefit Modesty Q7b, Undue Influence Q7c/Q8) are inherently value-laden. Is the deception *really* necessary? Is 5 points *too* much credit? Is an alternative *truly* equivalent? The checklist identifies the issue but requires human debate.
  4.  **Privacy & Confidentiality:** While hinted at in risk disclosure (Q4), robust assessment of data handling, anonymity, and privacy protection is outside the consent validity scope. This must be a separate check.
  5.  **Parental Consent:** It assumes parental consent is handled per policy but doesn't assess its validity. Parental consent has its own competence/information/voluntariness challenges.
  6.  **Scientific Merit:** A study can have valid consent but be scientifically worthless or poorly designed. The CVAP doesn't assess this.
  7.  **False Sense of Security:** Passing the CVAP (VERDICT 1) only means consent isn't *invalid*. A study can still be unethical due to high risk, poor privacy, or lack of merit. The committee *must* still do this broader review.
  8.  **"Gray Zone" Ambiguity:** When answers aren't clear-cut (e.g., "Is this risk foreseeable?" "Is this benefit modest?"), the checklist provides no tie-breaker. It relies on the committee member's best judgment during application.

  **When the CVAP Gives No Clear Answer:**

  1.  **Encounter a "FLAG FOR HUMAN JUDGMENT":** This *is* the clear answer – the committee must discuss and vote. Require the researcher to clarify ambiguities (e.g., *exactly* what is the alternative activity? *How* will understanding be verified? *Why* is deception necessary?).
  2.  **Ambiguous Application (Gray Zone):** If a question genuinely has no clear "Yes/No" based on the proposal (e.g., the level of risk disclosure is borderline), default to the **more protective option** (usually "No" or "Flag"). When in doubt about consent validity, err on the side of protecting participants.
  3.  **Information Needed for Human Judgment:** For flagged items or gray zones, human decision-makers need:
      *   Clarification from the researcher (specifics on safeguards, alternatives, justification).
      *   Understanding of school/district policies (e.g., minimum requirements for extra credit alternatives).
      *   Consideration of the specific participant population (age, maturity, known sensitivities).
      *   Assessment of the *magnitude* of the issue (How big is the benefit? How severe is the potential pressure? How essential is the deception?).

  This CVAP gives you a defensible, philosophy-based framework focused *specifically* on the validity of consent. It provides clear stops for clear failures, flags the hard cases requiring debate, and explicitly acknowledges its limits. Use it as the *first* ethical gate, but remember that valid consent is necessary, not sufficient, for an ethical research project. Always document your reasoning using the steps of the checklist. Good luck!
