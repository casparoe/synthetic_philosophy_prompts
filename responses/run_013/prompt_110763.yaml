prompt: |-
  I have been reading rationalist blogs and forums for the better part of a decade, and somewhere along the way I talked myself into moral particularism: I now think a feature that is a reason to act one way here can be a reason to act the opposite way there, and that no finite set of principles gets the verdicts right. The trouble is that I moderate a large online community, and I still have to act. Ten or so times a week I decide whether to warn, remove, or ban, usually with a few minutes' notice and sometimes with a few hundred users watching; a co-moderator reviews bans after the fact, and there is no one above me to escalate to.

  Please write me a decision procedure I can actually run: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a decision, and where it has to hand the call back to me because the question is one of values rather than facts. The hard part, and the reason I am asking you rather than just drafting a rules document, is that the procedure has to be a particularist's procedure. It cannot quietly assume that the listed considerations always cut in the same direction. So I need to know how a checklist stays honest to the idea that the same feature counts differently in different cases — whether that means treating every rule as defeasible, or something else — and how the procedure marks the points at which a rule is likely to be overridden rather than applied.

  Then run it on three cases: a user whose comments are each technically true and individually defensible but who reliably leaves a thread worse; conduct that was fine last month in a different thread and is not fine now; and one case where I expect the procedure to return a verdict I will dislike, since I would rather discover that now than in the moment.

  Finally, tell me what the procedure cannot do. If particularism is right, any procedure is a lossy compression of a judgment it cannot reproduce, so say where this one will misfire and whether I should stop pretending it is more than a crutch.
reasoning: |-
  We are designing a decision procedure for a moderator who is a moral particularist. The procedure must:
  1. Be executable in minutes with potentially many users watching.
  2. Avoid assuming that features always count in the same direction (i.e., be particularist).
  3. Be structured as a checklist of questions, where some answers lead to decisions and others require human judgment (values).
  4. Explicitly mark points where rules are likely overridden.

  The key idea: We will use a decision tree that asks questions about the context and the action in question. Each question is designed to be answered quickly. The procedure will have:
  - "Terminal nodes": where the answer leads to a clear decision (warn, remove, ban, or no action).
  - "Value nodes": where the answer requires the moderator's judgment because it involves weighing values that cannot be pre-specified.

  To handle particularism, we note that each feature (reason) is considered in the context of the entire situation. Thus, the procedure will:
  - Ask about multiple factors and their interactions.
  - Allow that a factor that in one context suggests action A might in another context suggest action B.
  - Use a structure that forces consideration of defeating conditions (i.e., even if factor X is present, if condition Y is also present then X might be overridden).

  We design the procedure as a sequence of questions, with branching.

  **The Decision Procedure:**

  1. **Start: Assess the immediate harm.**
     - *Question:* Is the comment/post causing or likely to cause immediate, severe harm? (e.g., direct threats, incitement to violence, clear and present danger)
     - *Answers:*
       - Yes: **Remove the content immediately and issue a temporary ban (escalating to permanent if repeated).** (Terminal)
       - No: Proceed to 2.

  2. **Check for clear rule violation.**
     - *Question:* Does the comment/post violate a clearly stated and non-controversial rule of the community? (e.g., spam, doxxing, illegal content)
     - *Answers:*
       - Yes: **Remove the content and issue a warning (or ban if repeated or severe).** (Terminal)
       - No: Proceed to 3.

  3. **Evaluate the context.**
     - *Question:* Is the comment/post part of a pattern of behavior by this user? (Look at their history in similar contexts.)
     - *Answers:*
       - Yes, and the pattern is harmful: Proceed to 3.1.
       - No, or pattern is neutral/positive: Proceed to 4.
     - *3.1: Pattern of harm?* 
          - *Question:* Does the pattern show that the user, despite technically true or defensible individual comments, consistently degrades the quality of discussion? (This is a judgment call about cumulative effect.)
          - *Answers:*
            - Yes: **Issue a warning and consider temporary ban (with explanation about pattern).** (Terminal) 
            - No: Proceed to 4.

  4. **Assess the effect on the thread.**
     - *Question:* Is the comment/post making the current thread worse? (Consider: derailing, creating hostility, discouraging participation, etc.)
     - *Answers:*
       - Yes: Proceed to 4.1.
       - No: **No action (unless other factors).** (Terminal) 
     - *4.1: Degree of harm?*
          - *Question:* Is the harm significant and outweighing any benefits? (Value node: requires judgment because the same behavior in a different thread might be acceptable. Weigh the value of free expression against the harm to the community.)
          - *Answers:*
            - Yes, harm outweighs benefits: **Remove the content and issue a warning.** (Terminal)
            - No, or unsure: Proceed to 5.

  5. **Consider community norms and evolution.**
     - *Question:* Is the behavior in question acceptable under the current community norms, even if it was acceptable in the past? (This is a value node: norms change and the moderator must judge the current context.)
     - *Answers:*
       - No: **Remove the content and explain the norm shift.** (Terminal)
       - Yes: Proceed to 6.
       - Unsure: **Flag for co-moderator review or take no action for now.** (Terminal: no action or escalate to co-review)

  6. **Final check for edge cases.**
     - *Question:* Are there any special circumstances that override the above? (This is a catch-all for particularism. It might include: the user's intent, their role in the community, unique value of the comment, etc. This is a value node and the answer is almost always going to require judgment.)
     - *Answers:*
       - Yes: **Use judgment to decide. (Hands back to moderator)**
       - No: **No action.** (Terminal)

  **How the procedure handles particularism:**
  - Every step that leads to a terminal decision is defeasible by step 6 (the final check). Step 6 is designed to catch cases where the rules don't apply as expected.
  - Steps 4.1 and 5 are explicitly value nodes where the same feature (e.g., a comment that derails) might be acceptable in one thread (if the benefits outweigh) and not in another.
  - The procedure does not assume that a pattern of behavior (step 3) always leads to a ban. It asks whether the pattern is harmful in context.

  **Running the procedure on three cases:**

  *Case 1: A user whose comments are each technically true and individually defensible but who reliably leaves a thread worse.*
  - Step 1: No immediate severe harm -> proceed to 2.
  - Step 2: No clear rule violation (each comment is defensible) -> proceed to 3.
  - Step 3: Pattern of behavior? Yes, and harmful -> step 3.1: Pattern of harm? Yes -> Issue a warning and consider temporary ban.

  *Case 2: Conduct that was fine last month in a different thread and is not fine now.*
  - Step 1: No immediate severe harm -> 2.
  - Step 2: No clear rule violation (it was fine before) -> 3.
  - Step 3: Pattern? We don't know, so assume no or neutral -> 4.
  - Step 4: Is it making the thread worse? Assume yes -> 4.1: Harm outweigh benefits? (Value node) Moderator judges: in the current context, the behavior is causing harm and the benefits (which might have been present in the old thread) are not here -> Remove and warn.
  - Alternatively, if step 4.1 is unsure, we go to step 5: Is the behavior acceptable now? No -> Remove and explain.

  *Case 3: A case where the procedure returns a verdict I dislike.*
  Let's design a case: A user posts a comment that is technically false but in a way that the community finds humorous and actually improves the thread (e.g., a lighthearted, obvious exaggeration that sparks a productive and friendly discussion). However, by the rules, false statements are against the rules.

  - Step 1: No immediate severe harm -> 2.
  - Step 2: Violates a rule? Yes, because it's false. So by step 2: Remove and warn.
  - But the moderator dislikes this because the comment is beneficial. How does the procedure handle it?
    - The procedure would catch this in step 6 (final check). Step 2 leads to a terminal decision, but step 6 is the final check that can override. So after step 2, we would normally remove. However, step 6 asks: any special circumstances? 
    - The moderator would answer: Yes, because the comment is beneficial and the falsity is harmless and intended as humor. Then the procedure hands back to the moderator to use judgment. The moderator might decide to leave it (overriding step 2).

  **What the procedure cannot do:**
  - It cannot capture every nuance. It is a crutch. Specifically:
    - It cannot replace the moderator's ability to read the room and sense the tone and context that are hard to articulate.
    - It may be too rigid in step 2 (clear rule violation) when a rule violation is minor and the context makes it acceptable (like the humor example). Step 6 is the escape valve but requires the moderator to actively override.
    - It may not handle novel situations well (the first time a new type of harm appears).
    - It relies on the moderator's ability to quickly assess patterns (step 3) and context (step 4,5) which are inherently judgment-based.

  **Should you stop pretending?**
  - No, because even a lossy procedure is better than none. It provides consistency and a framework to fall back on when under pressure. But always remember that step 6 is there to remind you that the procedure is not infallible and that your judgment is essential.

  **Final Note:** This procedure is designed to be run quickly. It is not meant to be a comprehensive moral theory but a practical tool. It should be reviewed and updated periodically based on experience.
answer: |-
  Below is a **particularist-friendly decision procedure** for moderation, designed to respect that the moral weight of features (e.g., truthfulness, context, intent) can shift across cases. It avoids rigid rules by forcing explicit consideration of **defeaters** (conditions that override typical judgments) and **value thresholds** (points where facts end and contextual judgment begins). The procedure is a flowchart of questions, executable in under 5 minutes.  

  ---

  ### **The Decision Procedure: Questions, Answers, and Exit Points**  
  **Goal**: Decide between **No Action**, **Warn**, **Remove**, or **Ban**.  
  **Core Mechanics**:  
  - **Defeasibility**: Every "rule" is treated as a *prima facie* consideration (e.g., "Truthfulness usually supports no action, *but*...").  
  - **Defeaters Marked Explicitly**: Override conditions are flagged with ⚠️.  
  - **Value Nodes**: Where answers require weighing tradeoffs (e.g., "Is harm *significant enough*?"), marked with ❓. At these points, *you* must decide.  
  - **Termination**: Ends at a decision (✅) or hands back to you (❓).  

  **Flow**:  
  1. **START**: Is this *imminent real-world harm*?  
     - *Examples*: Threats, doxxing, incitement.  
     - **Yes** → **Remove + Ban** ✅.  
     - **No** → Proceed to Q2.  

  2. **Q1**: Does the content violate a **bright-line rule**?  
     - *Bright-line rules*: Spam, illegal content, slur usage (features that *nearly always* require action).  
     - **Yes** → **Remove + Warn** ✅.  
     - **No** → Proceed to Q3.  

  3. **Q2**: Is the user **acting in good faith**?  
     - *Indicators*: Admits errors, engages with critiques, avoids loaded language.  
     - **No (bad faith)** → Proceed to Q4.  
     - **Yes** → Proceed to Q5.  
     - ❓ *Unclear* → Hand back to you. *Why?* Good faith is contextual (e.g., sarcasm in one thread is playful, in another hostile).  

  4. **Q3**: Is there a **pattern of harm**?  
     - *Assess*: User history, recurring impact on threads (e.g., "technically true" comments that derail discussions).  
     - **Yes, pattern exists** → Proceed to Q6.  
     - **No pattern** → Proceed to Q5.  

  5. **Q4**: Is the harm **outweighing value** *in this specific context*?  
     - *Consider*:  
       - Does it chill participation?  
       - Does it distort truth-seeking?  
       - ❓ **Value threshold**: *You* must judge if harm > benefit. No factual answer.  
     - **Yes, harm dominates** → Proceed to Q7.  
     - **No, or unclear** → **No Action** ✅.  

  6. **Q5**: Is this **meaningfully different** from past permitted conduct?  
     - *Defeater conditions* (⚠️ Override "but it was allowed before!"):  
       - ⚠️ *Changed context*: Topic sensitivity, current events, thread tone.  
       - ⚠️ *Cumulative effect*: First time vs. repeated.  
     - **Yes, meaningfully different** → Proceed to Q7.  
     - **No, similar** → **No Action** ✅.  

  7. **Q6**: Would **moderation reduce harm** without disproportionate cost?  
     - *Consider*:  
       - Streisand effect?  
       - Chilling useful discourse?  
       - ❓ **Value threshold**: *You* must weigh cost/benefit.  
     - **Yes** → Proceed to Q8.  
     - **No** → **No Action** ✅.  

  8. **Q7**: Is **removal sufficient**?  
     - *Defeater* (⚠️ Override if removal isn’t enough):  
       - ⚠️ User ignores warnings.  
       - ⚠️ Harm is persistent/reputational.  
     - **Yes** → **Remove + Warn** ✅.  
     - **No** → **Ban** ✅.  

  9. **FINAL CHECK**: ❓ **Are there exceptional reasons to override?**  
     - *Hands back to you* if:  
       - Novel context (e.g., satire in a crisis).  
       - Conflicting values (e.g., "truth" vs. "kindness" tradeoff).  
       - **Otherwise**, proceed with the decision.  

  ---

  ### **Running the Procedure on Your Cases**  
  **Case 1: User with "technically true" comments that leave threads worse**  
  - Q1 (Bright-line rule): No.  
  - Q2 (Good faith): **No** (assessed as bad faith due to tone/pattern).  
  - Q3 (Pattern of harm): **Yes**.  
  - Q4 (Harm > value?): ❓ *You judge*: Threads consistently derailed → **Yes**.  
  - Q7 (Removal sufficient?): **No** (pattern persists) → **Ban** ✅.  
  - FINAL CHECK: Unlikely to override.  

  **Case 2: Conduct fine last month, not fine now**  
  - Q1: No.  
  - Q2: Unclear → ❓ *You judge*: Assume good faith.  
  - Q3: **No pattern** (first offense).  
  - Q5 (Meaningfully different?): **Yes** (⚠️ *Changed context*: Topic now sensitive).  
  - Q6 (Moderation reduce harm?): ❓ *You judge*: Removal prevents escalation → **Yes**.  
  - Q7 (Removal sufficient?): **Yes** (first offense) → **Remove + Warn** ✅.  
  - FINAL CHECK: None needed.  

  **Case 3: Verdict you dislike (e.g., banning a popular user)**  
  *Scenario*: A high-status user posts a "true" but cruel comment that sparks productive debate. Community loves them, but the comment violates norms.  
  - Q1: No.  
  - Q2: **No** (bad faith: cruel tone).  
  - Q3: **Yes** (history of edge-pushing).  
  - Q4 (Harm > value?): ❓ *You judge*: Cruelty harms inclusivity → **Yes**.  
  - Q7 (Removal sufficient?): **No** (ignored past warnings) → **Ban** ✅.  
  - FINAL CHECK: ❓ *You override?* Popularity and debate value might justify **Warn** instead. *Here, procedure forces you to confront the values tradeoff.*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Replace judgment in value-laden nodes** (❓):  
     - At Q4, Q5, Q6, and FINAL CHECK, the procedure *requires* your input. It flags where "facts" end and "values" begin but cannot resolve them.  
     - *Example*: "Is harm significant?" depends on your community's tolerance for conflict vs. truth-seeking.  

  2. **Handle radical novelty**:  
     - If a case has no analog in past experience (e.g., an unprecedented form of trolling), the flowchart may misfire by forcing older patterns onto new contexts.  

  3. **Ensure consistency across moderators**:  
     - Two moderators might answer Q2 (good faith) differently. This is a *feature* of particularism but may frustrate users seeking rigid fairness.  

  4. **Capture all contextual nuances**:  
     - Subtleties like "inside jokes among regulars" or "cultural references" may be lost. The FINAL CHECK is a safety net but relies on your awareness.  

  **Should you treat it as a crutch? Yes, but a necessary one.**  
  - **Strengths**: Prevents rash decisions, systematizes *consideration* of defeaters, and forces explicit value judgments.  
  - **Weaknesses**: It will miss edge cases (e.g., "beneficial rule-breaking"). Use it to *slow down* reasoning, not replace wisdom.  
  - **Advice**:  
    - **Review bans weekly** with your co-moderator to spot systemic flaws.  
    - **Log overrides** at FINAL CHECK to refine the procedure.  
    - **Publish the flowchart**: Transparency shows users you’re not arbitrary, even when contextual.  

  This procedure embraces particularism by making defeasibility and value conflicts explicit—compressing judgment without pretending context is irrelevant. It’s a scaffold for your intuition, not a cage.
