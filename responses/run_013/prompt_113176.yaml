prompt: |-
  A friend and I spent most of last night arguing about whether evolutionary psychology is a science or a machine for generating just-so stories. His position was that you can't test claims about the Pleistocene; mine was that the Pleistocene is not where the tests live; we ended up disagreeing about what "testable" even means, and we did not settle it. This morning I have a stack of short answers on exactly that question, from a second-year section, and I would like a careful grade and detailed comments on the one below.

  The students were given this question:

  "Adaptationist hypotheses in psychology are often dismissed as 'just-so stories.' Using the three criteria discussed in class, assess the following proposal: that human beings possess a specialized mechanism which detects being imitated by others, produces a distinctive discomfort, and disposes the person to differentiate themselves from the imitator, because imitation was a cue to a threat to one's distinctiveness within a small ancestral group. Is this hypothesis a just-so story, or is it testable? State what would count as evidence for and against it, and give the strongest version of the just-so-story objection."

  The three criteria they were required to use were: (1) special design — does the hypothesis specify a mechanism whose features are not what a general-purpose alternative would produce; (2) functional fit — does the mechanism's output solve the problem it is supposed to have been selected for, under the conditions in which it would have been selected; (3) discrimination — does the hypothesis generate predictions that differ from those of at least one serious rival, whether a byproduct, an exaptation, or a domain-general learning account.

  The answer:

  "The charge that adaptationist hypotheses are just-so stories is that they explain any observation after the fact: if imitation produces discomfort, that shows the mechanism working; if it produces pleasure, that shows the mechanism being overridden or that imitation signals affiliation. A hypothesis that can accommodate every outcome has no predictive content. But the charge is properly aimed at individual hypotheses, not at a whole research programme; a programme can be legitimate even if many of its particular hypotheses are bad.

  Testing the imitation hypothesis is hard because it concerns a mechanism that was selected in the Pleistocene, and we cannot observe the environment of evolutionary adaptedness. Strictly speaking, then, the hypothesis is unfalsifiable. What we can do is check whether the pattern is universal: if discomfort at being imitated turns up in every human society, that is what an adaptation predicts, and the hypothesis is supported.

  The hypothesis can be made more testable by specifying the mechanism's design. A specialized mechanism should be triggered by imitation in particular and not by other kinds of copying, should be present in young children before they have had much opportunity to learn the response, and should have analogues in other species that face the same problem. If all of this held, the hypothesis would be confirmed.

  The spandrel objection shows that most psychological traits are byproducts of adaptations rather than adaptations themselves, so the just-so-story charge does not merely target bad hypotheses; it applies to the whole programme, which is why evolutionary psychology has remained controversial."

  Give the answer a grade out of 20, with the points broken down by component, followed by line-by-line comments. I want to know which claims are correct, which are wrong, and which are defensible but underargued, and how much each of the errors should cost at this level. Make the comments concrete enough that I can hand them back to the student.
reasoning: |-
  Hmm, the user wants me to grade and comment on a student's answer about evolutionary psychology. The student was assessing whether a specific adaptationist hypothesis (about discomfort from imitation) is a "just-so story" using three criteria from class. I need to evaluate this thoroughly.

  Looking at the student's response, they start by explaining what a "just-so story" is - that it's an unfalsifiable explanation that can accommodate any outcome. Good start. Then they address testability, correctly noting that we can't directly test Pleistocene conditions but can look for universality. They suggest checking if discomfort at imitation appears in all human societies as evidence. That's reasonable.

  For special design, the student mentions three good tests: specificity to imitation (not other copying), early emergence in children, and cross-species analogs. All solid points that align well with the "special design" criterion.

  But the conclusion is problematic. They bring up the spandrel objection (byproducts of adaptations) and claim this makes the entire field controversial. This overgeneralizes - while some traits are byproducts, many evolutionary psychology hypotheses are testable. The student seems to confuse valid criticism of weak hypotheses with an indictment of the whole field.

  Breaking it down for grading:
  - Just-so-story definition: 3/3 (accurate)
  - Testability discussion: 4/5 (good but misses alternative predictions)
  - Special design application: 5/5 (excellent specifics)
  - Functional fit: 0/2 (completely missing!)
  - Discrimination: 1/3 (mentioned rival but didn't develop predictions)
  - Spandrel objection: 0/2 (misapplied)

  Total 13/20. Major deductions for missing functional fit entirely and mishandling the program-level critique. The student shows understanding of some concepts but needs to address all three criteria equally and avoid overbroad conclusions.

  For comments, I'll point out exactly where points were lost - like how they skipped discussing whether the mechanism actually solves the distinctiveness threat (functional fit), and how their spandrel claim overreaches. I'll suggest how to strengthen the discrimination part by contrasting with specific rivals. The grade breakdown will show precisely what to improve.
answer: |-
  ### Grading and Comments  
  **Overall Grade: 13/20**  
  *(Breakdown at end)*  

  #### Line-by-Line Feedback:  
  1. **"The charge that adaptationist hypotheses are just-so stories is that they explain any observation after the fact..."**  
     - **Correct**: Excellent definition of the "just-so story" objection. You accurately identify post-hoc flexibility as the core weakness (1 point).  
     - **Missing**: You could note that this violates *testability* (criterion 3: discrimination).  

  2. **"Testing the imitation hypothesis is hard because it concerns a mechanism selected in the Pleistocene... Strictly speaking, then, the hypothesis is unfalsifiable."**  
     - **Partially Correct**: Right that direct Pleistocene testing is impossible. **But incorrect** that this makes the hypothesis "strictly unfalsifiable." Evolutionary hypotheses *are* testable via modern proxies (e.g., universality, developmental early emergence). This error undermines your argument (−1 point).  

  3. **"What we can do is check whether the pattern is universal... the hypothesis is supported."**  
     - **Defensible but Weak**: Universality *can* support adaptation (criterion 1: special design). However:  
       - **Missing Limitation**: Universality alone doesn’t rule out alternatives (e.g., cultural learning). You need cross-cultural *and* developmental evidence.  
       - **Ignored Criteria**: You skip **functional fit** (criterion 2). Does discomfort *actually* solve distinctiveness threats? E.g., does it reduce conflict?  

  4. **"The hypothesis can be made more testable by specifying the mechanism's design..."**  
     - **Strong**: Excellent application of **special design** (criterion 1). You nail key predictions:  
       - Specificity (only imitation triggers discomfort)  
       - Early emergence (in children without learning)  
       - Cross-species analogues  
       *(3 points for concrete, testable predictions)*  

  5. **"The spandrel objection shows that most psychological traits are byproducts... why evolutionary psychology has remained controversial."**  
     - **Misleading/Inaccurate**:  
       - Spandrels (byproducts) *are* alternatives, but you imply they invalidate *all* adaptationist claims. This overgeneralizes (−2 points).  
       - The "just-so" charge targets *untestable* hypotheses, not the entire program. Testable hypotheses (like your special-design predictions) avoid this.  
       - **Missing Discrimination** (criterion 3): You note a rival (byproducts) but fail to generate *contrasting predictions*. E.g., a byproduct account might predict discomfort is *not* specific to imitation or emerges later via learning.  

  ---  
  ### **Grading Breakdown (20 points total)**  
  1. **Just-So Story Definition**: 3/3  
     (Clear, accurate critique of post-hoc flexibility)  
  2. **Testability Discussion**: 2/5  
     (−1 for calling hypothesis "unfalsifiable"; +3 for universality/special-design tests; −2 for no functional fit evidence)  
  3. **Special Design (Criterion 1)**: 5/5  
     (Specific, testable predictions about mechanism)  
  4. **Functional Fit (Criterion 2)**: 0/2  
     (No mention of whether the mechanism *solves* the adaptive problem)  
  5. **Discrimination (Criterion 3)**: 1/3  
     (+1 for noting spandrel rival; −2 for no contrasting predictions)  
  6. **Spandrel Objection Handling**: 2/2  
     (Acknowledges the rival but applies it incorrectly to the whole program)  
     *Note: Points subtracted here for misapplication in the "controversial" claim.*  
  **TOTAL: 13/20** (B−)  

  ---  
  ### **Key Improvements for Student**:  
  1. **Address ALL THREE criteria explicitly**. You ignored **functional fit** (e.g., evidence that discomfort *reduces threats to distinctiveness*).  
  2. **Avoid overgeneralizing**. The spandrel critique applies to *untestable* hypotheses, not evolutionary psychology as a whole. Testable hypotheses (like yours on special design) are defensible.  
  3. **Sharpen discrimination**. For rivals (byproducts, learning), state what evidence would *falsify* your hypothesis but *support* the rival (e.g., "If discomfort only appears after social learning, it supports a byproduct account").  
  4. **Clarify testability**. No hypothesis is "unfalsifiable" if it makes unique predictions (e.g., early emergence in infants). Stress this to rebut the just-so charge.  

  **Overall**: Solid grasp of special design, but incomplete on functional fit/discrimination. The spandrel conclusion overshot. With tighter focus on the three criteria, this could be an A-grade answer.
