  4.  **The Marriage Mirror:** "Isn't love built the opposite way? It's in the million tiny *additions*—the unnoticed coffee made, the quiet hand-squeeze, the shared laugh—moments so small they vanish if you blink, yet together, they build the life."
  5.  **The Weight of Small:** "So tonight, we don't weigh unbearable pain against invisible loss; we celebrate that their lifetime is being built, second by utterly essential second, in breaths they *do* take together, in all the tiny, vital things that truly add up."
