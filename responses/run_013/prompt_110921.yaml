  1. **Rule 1: Expected Sentient Beings Threshold (ESBT)**  
     - **Formulation:** Fund exactly when \(N \times C \geq T\), where \(T\) is a fixed threshold.  
     - **Rationale:** This rule computes the expected number of sentient beings affected (\(N \times C\)) and funds if it meets or exceeds a critical threshold \(T\). It aligns with expected value reasoning: even low \(C\) can be offset by very high \(N\).  
     - **Assumptions:** The moral weight of an intervention is linear in \(N \times C\), and there is no minimal \(C\) or \(N\). \(T\) must be consistent with past votes.

  2. **Rule 2: Minimal Credence Constraint (MCC)**  
     - **Formulation:** Fund exactly when \(N \times C \geq T\) and \(C \geq C_{\text{min}}\), where \(T\) is a threshold for expected sentient beings and \(C_{\text{min}}\) is a minimal credence threshold.  
     - **Rationale:** This rule adds a safeguard against funding interventions where \(C\) is extremely low (e.g., near-zero), even if \(N \times C\) is high. It reflects epistemic or deontological concerns (e.g., "do not act on credences below a reasonable doubt").  
