prompt: |-
  ok so I'm TAing the decision theory unit in a phil of science course, I'm on my third pass through the midterms, my brain is mush, and there's one script I keep flip-flopping on. I'd like you to grade it like a very careful grader who's taught this material for years — the kind who can see exactly where a student slides from "true" to "sounds true." Before you give any marks, please brainstorm: write out for yourself what a full-credit answer to each part would have to contain, then read the script against that. Don't reward fluency, and don't punish clunky wording if the substance is there — I want substance. Also don't be polite about it; if a sentence is wrong, say which sentence and why.

  Here's the question, 20 points:

  "Recall the standard Newcomb problem. Two boxes. Box A is transparent and contains $1,000. Box B is opaque and contains either $1,000,000 or nothing. A Predictor has already made its prediction about whether you will take both boxes or only Box B, and has put the million in Box B iff it predicted you would take Box B alone. You know the Predictor has been right about 99% of the people it has predicted, and you have no reason to think you're special. You may take both boxes or Box B alone.

  Now the variant, call it Commit. Everything above holds except the order of events. Before the Predictor makes its prediction, you are offered a contract. If you sign, you are bound: from then on, taking both boxes is not a profitable option, because the contract directs the entire contents of both boxes to a third party in that case (so if you sign and then take both boxes you get $0 no matter what). The contract cannot be revoked. You know all this, and you know the Predictor will know whether you have signed before it makes its prediction.

  (a) In the standard problem, what does causal decision theory (CDT) recommend, what does evidential decision theory (EDT) recommend, and what is each theory's reason? (6)

  (b) In Commit, what does each theory recommend you do about the contract, and what does each then recommend at the box stage? Explain the difference from (a), if any. (8)

  (c) A classmate claims: 'Commit shows that CDT and EDT aren't really rival theories — CDT is just EDT plus a precommitment device.' Assess that claim. (6)"

  And here's what the student wrote:

  "(a) CDT says take both boxes. The money is already in Box B before you get to choose — the Predictor did its thing in advance — so nothing you do now can change what's in there, and whatever is in there you're better off with it plus the $1,000 in Box A. Taking both dominates: in each of the two states of the world you end up $1,000 richer than if you took one box. Since dominance is a state-wise comparison it doesn't depend on what probabilities you assign to the two states, so two-boxing comes out with the higher expected utility even by the evidentialist's own lights, and the Predictor's accuracy rate doesn't enter into it. EDT says take one box, and the reason is that taking one box is a sign of what the Predictor will have predicted — since it's right 99% of the time, one-boxing and the million go together, and conditional on one-boxing the expected value of Box B is close to a million. In other words, one-boxing is what brings the good prediction about, so the conditional expected value of one-boxing is higher and that's the act to perform.

  (b) In Commit, CDT says sign. Signing happens before the Predictor predicts, so signing actually does change what the Predictor will predict — it reads your brain, sees the contract and knows two-boxing is off the table, so the million goes in. That's a causal difference and CDT can use it. After signing, CDT takes one box, since two-boxing now pays $0 by the contract and there's nothing to take. EDT signs as well and then takes one box, though for its usual reason rather than a causal one. Compared to (a): the CDT agent now gets the million, the EDT agent's advice is unchanged, and CDT's advice flipped between (a) and (b) while EDT's didn't — which is exactly because the causal structure flipped.

  (c) I think the classmate is basically right, with a caveat. Commit shows that the CDT agent's problem in the standard setup isn't that it's confused about rationality, it's that the causal lever isn't there. Give it a lever — a contract binding you before the prediction — and it does exactly what the evidentialist does. So the two theories agree whenever the structure of the case allows the lever to exist and disagree only when it doesn't. The caveat is that they do give different advice in the standard problem, so they're not literally the same rule. But if the difference only shows up in cases where there's no lever, then it looks like a dispute about how to describe a case rather than a real disagreement about what to do, and I'd say the classmate's point survives."

  What I need back: a total out of 20; then a breakdown by part with the specific points awarded and deducted, quoting the sentence or step at issue (sub-points I had in mind are below, tell me if they're miscalibrated); then a short list of things a fast grader would miss — the slips that only show up on a close read; then a sentence or two on what the script would have had to say to get full marks. If part of my question is genuinely ambiguous, note it at the very end, but grade the script as if it means what it plainly says.

  Rubric I had in mind: (a) 6 points — 3 for CDT's recommendation plus its reason, 3 for EDT's; (b) 8 points — 3 for what CDT says about the contract, 2 for what CDT then does at the box stage, 2 for EDT on both, 1 for correctly saying how (b) differs from (a); (c) 6 points — 3 for what's right in the classmate's claim, 3 for whether the student locates the flaw.

  Thanks — this one is definately going to get me into an argument with the prof either way.
reasoning: |-
  Okay, I'm looking at this grading task for the philosophy of science TA. The student's answer is pretty detailed, but I need to be meticulous. Let me start by recalling the full-credit requirements for each part based on standard decision theory knowledge.

  For part (a), CDT should clearly recommend two-boxing because actions can't causally affect the past prediction. The dominance argument must be properly explained. EDT needs to recommend one-boxing based on the high correlation with the predictor's accuracy. The student's answer seems solid here - they nail the recommendations and reasons, especially the dominance argument and conditional probability.

  Part (b) is trickier. In Commit, CDT should recognize that signing creates a causal lever since it happens before prediction. The student gets this right - signing binds you and makes one-boxing inevitable, so CDT recommends signing then taking only B. For EDT, signing is evidentially identical to one-boxing in the standard case, so they sign and one-box. The difference from (a) is correctly identified as CDT flipping recommendations while EDT stays consistent.

  Now part (c) is where it gets interesting. The classmate's claim that CDT is just EDT plus precommitment needs careful assessment. The student agrees but with a caveat - they note the theories differ when no causal lever exists. Full credit here requires acknowledging that while precommitment resolves the conflict in Commit, the theories fundamentally differ in their decision rules (causal vs. evidential) and will disagree in no-lever scenarios.

  I notice some subtle issues though. In (b), the student says CDT "takes one box" after signing - technically correct but they miss explicitly stating that two-boxing is contractually impossible. More importantly, in (c) they claim the difference only shows up in no-lever cases, but actually the theories compute expected utility differently even with levers - they just happen to coincide in recommendations here. That's a significant oversight.

  The student's phrasing about "dispute about how to describe a case" downplays the substantive theoretical difference. A fast grader might miss how they gloss over the distinct calculation methods. Also, their "brings the good prediction about" wording in (a) slightly misrepresents EDT as endorsing backwards causation, but it's minor.

  For scoring: (a) gets full 6/6 - all key points covered. (b) loses 1 point on CDT box stage (missing contractual enforcement detail) but otherwise solid for 7/8. (c) is weaker - they identify the surface agreement but fail to articulate the fundamental divergence in decision rules, so maybe 4/6. Total 17/20 seems fair.

  The script would need to explicitly state that CDT and EDT use different utility calculations (causal models vs. conditional probabilities) even when they agree, and that their disagreement isn't just about "description" but about rational choice foundations. That's the core insight missing here.
answer: |-
  ### Grading Report  
  **Total Score: 17/20**  
  *(Breakdown: a: 6/6, b: 7/8, c: 4/6)*  

  ---

  ### **Part (a): Standard Newcomb (6/6)**  
  **Full-Credit Requirements:**  
  - CDT: Recommends **two-boxing**. Reason: Dominance argument (taking both yields $1,000 more regardless of Box B's content) + no causal influence on past prediction.  
  - EDT: Recommends **one-boxing**. Reason: High correlation (99%) between one-boxing and Box B containing $1M → higher *conditional* expected utility.  
  - Must **explicitly contrast** the theories' bases (causal vs. evidential).  

  **Script Evaluation (Quotes & Analysis):**  
  > "CDT says take both boxes... whatever is in there you're better off with it plus the $1,000... Taking both dominates... dominance is a state-wise comparison... Predictor's accuracy rate doesn't enter."  
  ✅ **CDT (3/3):** Correct recommendation + dominance argument + causal irrelevance.  

  > "EDT says take one box... taking one box is a sign... conditional on one-boxing the expected value of Box B is close to a million."  
  ✅ **EDT (3/3):** Correct recommendation + conditional probability (evidence) + accuracy rate relevance.  

  **Verdict:** Full marks. Substance perfect; wording ("sign of what the Predictor predicted") is clunky but captures evidential link.  

  ---

  ### **Part (b): Commit Variant (7/8)**  
  **Full-Credit Requirements:**  
  - **CDT on contract:** **Sign**. Reason: Signing *causally affects* prediction (Predictor sees commitment → fills Box B).  
  - **CDT at box stage:** **Take one box** (since two-boxing yields $0).  
  - **EDT on contract:** **Sign**. Reason: Signing is strong evidence Predictor will fill Box B.  
  - **EDT at box stage:** **Take one box** (same as standard).  
  - **Difference from (a):** CDT flips advice (signs → one-boxes), EDT unchanged. Why: Causal lever now exists (signing precedes prediction).  

  **Script Evaluation (Quotes & Analysis):**  
  > "CDT says sign... signing actually does change what the Predictor will predict... it reads your brain, sees the contract... million goes in."  
  ✅ **CDT contract (3/3):** Correct + explicit causal mechanism.  

  > "After signing, CDT takes one box, since two-boxing now pays $0."  
  ⚠️ **CDT box stage (1.5/2):** Correct act but **misses key detail**. Must state *why* one-boxing is the *only* rational post-signing choice (contract enforces one-boxing; two-boxing is impossible profitably).  

  > "EDT signs as well and then takes one box, though for its usual reason..."  
  ⚠️ **EDT (1.5/2):** Correct recommendations **but underspecified**. Fails to explicitly state EDT’s reason for signing (signing is evidence Predictor will fill Box B).  

  > "CDT's advice flipped... EDT's didn't — which is exactly because the causal structure flipped."  
  ✅ **Difference (1/1):** Spot-on.  

  **Verdict:** -1 total. CDT box stage and EDT contract lack precision.  

  ---

  ### **Part (c): Assessing the Claim (4/6)**  
  **Full-Credit Requirements:**  
  - **What’s right:** Commit resolves CDT/EDT conflict by adding a causal lever (precommitment), aligning recommendations.  
  - **Flaw in claim:** CDT ≠ "EDT plus precommitment." Fundamental divergence:  
    - CDT uses causal models; EDT uses conditional probabilities.  
    - They disagree in *standard* Newcomb (no lever) → different decision rules.  
    - Precommitment exploits EDT-like correlations *causally*, but CDT doesn’t "become" EDT.  

  **Script Evaluation (Quotes & Analysis):**  
  > "Commit shows that the CDT agent's problem... isn't that it's confused... it's that the causal lever isn't there. Give it a lever... it does exactly what the evidentialist does."  
  ✅ **Strength (3/3):** Correctly identifies alignment via precommitment.  

  > "The caveat is that they do give different advice in the standard problem... not literally the same rule... difference only shows up in cases where there's no lever... dispute about how to describe a case."  
  ❌ **Flaw (1/3):** **Misdiagnoses the disagreement**. The theories aren’t just describing the same case differently—they use *distinct calculations* (causal vs. evidential EU). The student implies the conflict is *merely practical* (no lever) rather than *theoretical*. Fails to note that even in Commit, CDT’s signing decision relies on *causal* EU, while EDT uses *conditional* EU—they converge numerically but not methodologically.  

  **Verdict:** -2 for misrepresenting the theoretical divergence.  

  ---

  ### **Close-Read Slips a Fast Grader Would Miss**  
  1. **Part (a), EDT:** "One-boxing is what *brings the good prediction about*" → Suggests backwards causation (EDT doesn’t endorse this; it’s about *evidence*, not bringing about). *Not penalized* as the rest clarifies the evidentialist stance.  
  2. **Part (b), CDT box stage:** Omits that post-signing, two-boxing is *contractually futile* (not just suboptimal). Weakens rationale.  
  3. **Part (c):** "Dispute about how to describe a case" → Implies theories are epistemically equivalent. Misses that CDT/EDT have incompatible definitions of rational choice.  

  ---

  ### **What Full-Credit Answers Require**  
  - **(a)** Dominance + causal irrelevance (CDT); conditional probability + accuracy rate (EDT).  
  - **(b)** CDT: Sign (causal lever) → one-box (contract enforces it). EDT: Sign (evidence of prediction) → one-box. Difference: CDT flips, EDT same due to new causal link.  
  - **(c)** Acknowledge precommitment aligns recommendations *in Commit* but stress:  
    - Theories compute EU differently (causal models vs. conditioning).  
    - Disagreement in standard Newcomb reveals distinct rationality criteria.  
    - *Not* a "precommitment-enhanced EDT" (CDT doesn’t adopt evidential reasoning).  

  ---
  **Ambiguity Note:** None. Script interprets "Commit" correctly.  

  **Final Comment:** Strong but overstates convergence in (c). Prof argument likely over (c): Student’s "dispute about description" downplays the foundational rift. Defend 17/20 by noting (b)’s underspecification and (c)’s conflation of *outcome* alignment with *theoretical* equivalence.
