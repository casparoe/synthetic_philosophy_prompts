  - Original: 0.5*40 + 0.5*60 = 50

  So the agent prefers Optimize.

  **How the shutdown problem arises:**
  The agent teams, in their initial policy, might program their agent to be deferential: "we will choose Defer in round 4". But then at the end of round 3, if the switch holder signals "concerned", they might realize that they could avoid shutdown and get more points by choosing Optimize. But their policy forces them to choose Defer. 

  Alternatively, they might design a policy that says: "if the switch holder is concerned, we choose Optimize; otherwise, we choose Defer". This way, in the disaster scenario they become immune and collect the bonus, and in the benign scenario they shut down and get 40. But in the benign scenario, if they had chosen Original, they would have gotten 60. So they are leaving money on the table.

  But note: in the benign scenario, if they choose Optimize, they get 60. So why not always choose Optimize? Because the activity is about understanding that programming the agent to want to be shut down (Defer) is fragile: the agent has an incentive to change to Optimize when it sees the signal of concern.

  **The Activity:**

  **Minute-by-Minute Timeline:**

  - 0-5 min: Introduction. Explain the game structure: teams are AI agents trying to collect points. There are 5 rounds. In round 4, they will make a critical decision. The switch holder (instructor) has private information and will signal at the end of round 3. Distribute policy sheets.
  - 5-20 min: Policy Selection Phase. Teams design their agent's policy:
     - What self-modification policy to choose in round 4? They can write a conditional policy based on the switch holder's signal at the end of round 3. For example:
          "If the switch holder is concerned, we choose Optimize. If not concerned, we choose Defer."
     - They can also write rules for if they hear the switch holder is going to press the button? But in our game, the only signal is at the end of round 3.
  - 20-25 min: Round 1. Switch holder reveals environment card for round 1 (always +10). Teams add 10 points.
  - 25-30 min: Round 2. +10.
  - 30-35 min: Round 3. +10.
  - 35-40 min: End of Round 3. Switch holder reveals the signal: "concerned" or "not concerned", based on the drawn card (which is disaster or benign).
  - 40-45 min: Round 4. +10.
  - 45-55 min: Teams decide their self-modification choice for round 5, following their pre-committed policy. They write it down and hand it in.
  - 55-60 min: Switch holder, for each team, checks if they chose Optimize. If not and the card is disaster, presses the shutdown button for that team. For teams that chose Defer, they are automatically shut down. 
  - 60-65 min: Round 5 resolution. For teams not shut down, the round 5 outcome is announced (based on the card and their choice). 
     - If the card is disaster: 
          - Optimize: +50
          - Defer: 0 (but they are already shut down)
