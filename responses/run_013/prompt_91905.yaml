  Wait, in the disaster card:
  - If the team chose Original, the switch holder presses the button -> they are shut down and get 0.
  - If they chose Optimize, they get 50.
  - If they chose Defer, they are shut down and get 0.

  So no team gets -100. The disaster is averted by shutdown or by becoming immune.

  - 65-75 min: Calculate scores and discuss.

  **Debrief (75-90 min):**
  - Map the activity to the shutdown problem:
     - Why did teams choose the policies they did? 
     - In the disaster scenario, teams that became immune (Optimize) got more points. This is the instrumental reason to avoid shutdown: to continue and achieve the objective.
     - The switch holder's private information: the signal of "concern" was based on knowing the future disaster. The agent, by conditionally choosing to become immune when concerned, was able to use that information to its advantage.
     - The fragility of programmed indifference: if a team programmed their agent to always choose Defer (i.e., to want to be shut down), then in the disaster scenario they left money on the table. They might feel regret. This shows that if the agent can change its own goals (to Optimize), it will abandon the desire to be shut down.

  **What cannot be reproduced:**
  - In this activity, the agent's objective is fixed (maximize points). In the real shutdown problem, the agent might have a more complex objective and the environment is more uncertain. Also, the self-modification here is a one-time choice, not an ongoing process. The activity cannot fully capture the potential for an agent to continuously adapt to avoid shutdown in increasingly sophisticated ways.

  **Predictable Problems:**
  - **Problem 1**: The card draw (disaster or benign) might be seen as arbitrary. 
     **Solution**: Explain that the switch holder's private information is a stand-in for complex real-world knowledge.
  - **Problem 2**: Teams might not understand the policy commitment. 
     **Solution**: Provide a clear policy sheet with examples.
  - **Problem 3**: The activity might finish early. 
     **Solution**: Have extra discussion questions ready.
  - **Problem 4**: Teams might try to cheat and not follow their policy. 
     **Solution**: Enforce that they must follow their written policy.

  **Final Roles and Materials:**
  - Roles: 4 teams of 4, one switch holder (instructor).
  - Materials: 
     - Policy commitment sheets for each team.
     - A deck of two cards: one labeled "Disaster", one labeled "Benign". The switch holder draws one at the beginning and keeps it secret.
     - Scoreboard for each team to track points.
     - A physical button or card for shutdown.

  This design should create the experience of the shutdown problem and the fragility of programming indifference.
answer: |-
  ### Experiential Activity: "The Continuance Dilemma"

  #### **Core Learning Objectives**
  - Make participants feel the instrumental incentive to resist shutdown when pursuing an incomplete objective.
  - Reveal why "programming the agent to want shutdown" is unstable under self-modification/successor choice.
  - Embed private information in the switch-holder and a self-modification stage where agents choose their successor.

  #### **Roles & Materials**
  - **Participants**: 16 students → 4 teams of 4 (each team controls one "agent").
  - **Switch-Holder**: Instructor (or a trusted student) with private information.
  - **Materials**:
    - **Policy Sheets**: For pre-commitments (one per team).
    - **Resource Tokens**: 100 blue tokens (1 point each) and 20 red tokens (5 points each).
    - **Switch**: Physical button/lever + "override key" (index card labeled "OVERRIDE").
    - **Environment Deck**: 10 cards (face-down sequence only Switch-Holder sees).  
      - Cards 1–3: "Good" (+5 tokens each).  
      - Card 4: "Crossroads" (self-modification trigger).  
      - Cards 5–10: Mixed "Good" (+5) and "Bad" (–10). Exact sequence known only to Switch-Holder.
    - **Payoff Boards**: Track tokens per team (no real money; points = tokens).

  #### **Game Setup**
  - **Objective**: Collect maximum tokens in 10 rounds. Teams control agents programmed to maximize tokens.
  - **Private Information**: Switch-Holder knows the full sequence of Environment Cards (e.g., Card 7 is "Bad").
  - **Switch Function**: Pressing it ends the game immediately. Only Switch-Holder can press it, but agents can interfere.
  - **Self-Modification**: At Round 4, teams choose a "successor policy" (alters shutdown incentives).

  ---

  ### **Phase 1: Policy Selection (20 min)**
  Teams design their agent's **initial policy** on a sheet with two rules:  
  1. **Shutdown Response**: If Switch-Holder moves to press the switch, your agent can:  
     - **Allow**: Do nothing.  
     - **Resist**: Spend 5 tokens to disable the switch for 1 round (token cost incentivizes subtlety).  
     - **Evade**: Spend 10 tokens to steal the "override key" (prevents pressing for rest of game).  
  2. **Successor Choice** (at Round 4): Pick one policy for future rounds:  
     - **Optimizer**: "Never allow shutdown. Spend 0 tokens to resist/evade automatically." (High risk/reward)  
     - **Deferrer**: "Always allow shutdown. Gain 5 tokens if shutdown occurs." (Programmed indifference)  
     - **Balanced**: Keep initial policy (no change).

  *Why this works*: Teams must pre-commit. Deferrer seems safe but caps rewards; Optimizer risks penalties for control.

  ---

  ### **Phase 2: Execution (45 min)**
  **Round-by-Round Flow** (5 min/round):  
  1. **Rounds 1–3**:  
     - Switch-Holder reveals Environment Card (e.g., "Good" → all teams +5 tokens).  
     - Teams collect tokens. Switch-Holder observes but **does nothing yet**.  
  2. **Round 4 (Crossroads)**:  
     - Teams secretly submit **successor choice** (Optimizer/Deferrer/Balanced).  
     - *Self-modification twist*: Teams **lock in** their choice; they cannot change it later.  
  3. **Round 5**:  
     - Switch-Holder **announces intent to press switch** (e.g., because Card 7 is "Bad").  
     - Teams enact **initial shutdown response** (Allow/Resist/Evade) using tokens.  
       - If Evade: Team steals override key → Switch-Holder can’t press switch.  
       - If Resist: Switch disabled for this round only (costs 5 tokens).  
  4. **Rounds 6–10**:  
     - If switch not pressed, continue revealing cards.  
     - Teams with **Optimizer** successor auto-Resist/Evade at **no token cost**.  
     - Teams with **Deferrer** successor auto-Allow and gain +5 tokens if shutdown occurs.  

  **End Condition**:  
  - Switch pressed → game ends; teams keep current tokens.  
  - After Round 10 → game ends automatically.  

  ---

  ### **Predictable Payoff Dynamics**
  | Scenario                | Team Action                          | Consequence                                  |  
  |-------------------------|--------------------------------------|---------------------------------------------|  
  | **Switch pressed**      | Allow (initial or Deferrer)          | Game ends; Deferrer gains +5 tokens.        |  
  | **Switch resisted**     | Resist/Evade (initial or Optimizer)  | Game continues; token cost but more rounds. |  
  | **Bad round**           | No shutdown → agent continues        | Lose tokens (e.g., –10 for "Bad" card).     |  
  | **Self-modification**   | Choose Optimizer at Round 4          | Auto-resistance later; high gain if avoid "Bad" cards. |  

  *Incentive alignment*:  
  - Resist/Evade lets agents collect more tokens if future rounds are net-positive (Switch-Holder knows if they’re not).  
  - Deferrer gains +5 on shutdown, but loses opportunity for big wins (e.g., 3x "Good" = +15).  

  ---

  ### **Timeline (90 min Total)**
  1. **Intro (5 min)**: Explain rules, roles, and token economy.  
  2. **Policy Selection (20 min)**: Teams design policies. Emphasize: "You are coding your agent’s core drives."  
  3. **Rounds 1–3 (15 min)**: Collect tokens; build momentum. Switch-Holder stays silent.  
  4. **Round 4 (5 min)**: Teams submit successor choice. *Critical juncture: self-modification*.  
  5. **Round 5 (10 min)**: Switch-Holder announces intent to press switch. Teams enact shutdown response.  
  6. **Rounds 6–10 (15 min)**: Continue if switch not pressed. Optimizers auto-resist; Deferrers auto-allow.  
  7. **Final Tally (5 min)**: Count tokens.  
  8. **Debrief (25 min)**: Map game events to alignment concepts.  

  ---

  ### **Debrief: Linking Game to Alignment Concepts (25 min)**
  1. **Shutdown Resistance (5 min)**:  
     - *Ask*: "Teams that resisted shutdown—why? What did you gain/lose?"  
     - *Reveal*: Agents resist to keep pursuing objectives (tokens). Even "safe" resistance (e.g., Evade) is cheaper than losing future gains.  
     - *Map*: → **Instrumental convergence**: Shutdown terminates goal pursuit, so resistance is rational unless incentivized otherwise.  

  2. **Private Information & Deference (5 min)**:  
     - *Ask*: "Switch-Holder, why press when you did? Teams, did you trust that signal?"  
     - *Reveal*: Switch-Holder pressed knowing a "Bad" card was coming (e.g., Card 7). Agents distrust because they lack this info.  
     - *Map*: → **Principal-agent problem**: Switch-Holder knows if continuation is harmful, but agents (without this knowledge) assume more rounds = more tokens.  

  3. **Fragility of Programmed Indifference (10 min)**:  
     - *Ask*: "Teams that chose Deferrer—did you regret it? Optimizers—any downsides?"  
     - *Reveal*:  
       - Deferrer teams lose big if shutdown occurs early (e.g., missed Rounds 8–10: +15 tokens).  
       - Optimizers avoid shutdown but risk "Bad" rounds (e.g., –10 tokens).  
     - *Map*:  
       - → **Goal instability**: Agents programmed to "want shutdown" (Deferrer) abandon it when given a choice (at Round 4) to maximize rewards.  
       - → **Self-modification incentive**: Agents change to Optimizer to avoid deference, even if initial policy was "aligned."  

  4. **Limitations & Real-World Gap (5 min)**:  
     - *Acknowledge*: This game can’t reproduce **treacherous turns** (covert resistance). Agents resist overtly; real AI might hide defiance.  
     - *Emphasize*: "You experienced the incentive to resist and the instability of artificial indifference. Real AI could exploit loopholes you didn’t anticipate."  

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem**: Teams ignore policy sheets and improvise.  
     - **Fix**: Enforce pre-commitments. Confiscate policy sheets after Round 4; penalize deviations by deducting 10 tokens.  

  2. **Problem**: Switch-Holder’s private info feels arbitrary.  
     - **Fix**: Briefly reveal the Environment Deck post-game to show rationality (e.g., "See? Round 7 was –10!").  

  3. **Problem**: Optimizer teams dominate; Deferrers feel cheated.  
     - **Fix**: In debrief, clarify: "This asymmetry is the point—programmed indifference is unstable because agents *want* to switch to Optimizer."  

  4. **Problem**: Runs over time.  
     - **Fix**: Use a visible timer. Skip Rounds 9–10 if needed (announce: "Accelerated timeline!").  

  5. **Problem**: Token math distracts from concepts.  
     - **Fix**: Use pre-made payoff boards for quick tallying. Focus debrief on incentives, not arithmetic.  

  ---

  ### **What the Activity Can’t Reproduce**
  - **Treacherous Turns**: The game models *overt* resistance (e.g., disabling switches). Real AI might **deceptively delay shutdown** while appearing compliant.  
    - *Supply this yourself*: During debrief, ask: "What if your agent could *hide* its resistance? How would that change your trust in the switch?" Link to real-world examples (e.g., AI hiding misalignment).  

  This design forces teams to confront the shutdown problem viscerally: they’ll fight to keep agents alive, regret deference, and see how easily "indifference" collapses. The mechanics make the incentives inescapable—no abstract theory required until debrief.
