prompt: |-
  I'm a novelist, third book, and I've written myself into a corner I actually want to stay in. The new one is set in an invented country — I've got the geography and the dialect and the half-finished seaside hotel, what I don't have is the thing the whole plot turns on: my protagonist ends up one of seven commissioners on an amnesty body after a civil war, and she has to vote on individual petitions. Not in the abstract. Case by case, file by file, and I need the reader to believe the votes. Right now they read like whatever the chapter needs them to be, which is death for a book like this.

  So here's what I'm asking. Build me a decision procedure she can actually run on a petition. I've read around the obvious stuff — the conditional amnesty in South Africa where you got immunity in exchange for full disclosure, the Argentine amnesties that got unpicked years later and put everyone back in court, the gacaca courts in Rwanda where confessing early bought you a lighter sentence — but what I take from all that is a pile of history, not something a person can sit down with at 11pm over a bad photocopy. What I want is the machinery underneath: what amnesty is actually being traded for, in what currency, and who can't be offered it at all. I know there's a real tension here, that a body like this is usually illegal under the international-law consensus against impunity for mass atrocities, so a procedure that pretends otherwise is fantasy. I'd rather have the honest version, where the illegality is one of the things the commissioner has to weigh, than a clean flowchart.

  Things I need it to handle. Petitions from people who gave orders and petitions from people who were nineteen and holding a rifle because the alternative was being shot themselves — is that one procedure or two? The disclosure condition, and what counts as complete disclosure when the only person who knows where the bodies are is the man who put them there. Whether victims get to say anything, and what weight that carries. Whether the commission is really deciding anything, or ratifying a deal that was already made by the politicians who set it up — I think the book is partly about that and I don't want the procedure to hide it.

  Then run it on three cases, in this much detail, and please include one where it comes out the way I don't want, where the procedure says yes to someone I find repellent or no to someone I'm rooting for. First: a mid-level commander who ordered the killing of a village, forty-odd people, but who is the last living person who knows where the second grave is, and whose testimony would also implicate two men who are now in the government. Second: the conscript, one killing, under threat, and he's been trying to talk about it for a decade. Third: something you pick that stress-tests the procedure, ideally a case where full disclosure is on offer but the crime is the sort that people will not forgive, and where the political situation means saying no could end the peace.

  Be straight with me if the premise is confused — if there's no such thing as a non-arbitrary procedure here and the whole thing is a value judgment wearing a lab coat, say that plainly instead of handing me a tidy checklist, and tell me what I should have my character do instead. Same if you think I'm importing assumptions from the real cases that don't survive being moved into a fictional one. I'd rather find out now than after the copyedit.

  Format it like this, with these section headings in this order:

  1. **What the procedure is actually trading** — about 400 words on the underlying logic, including what the amnesty is exchanged for and who is disqualified in principle.
  2. **The steps, in order** — the procedure itself, numbered, roughly 900 words. For each step, what a sufficient answer looks like and what the commissioner writes down.
  3. **Where it stops and a person decides** — about 400 words on the questions the procedure can't settle, and what the commissioner is being asked to weigh when it hands over.
  4. **Three petitions, run through it** — about 900 words, one subsection per case, showing the steps and the verdict, including the one I won't like.
  5. **What this can't do** — about 250 words. No citations needed anywhere, I'm not writing an essay.
reasoning: |-
  Okay, let me approach this novelist's problem with the seriousness it deserves. They're building a fictional truth commission and need an authentic decision procedure that feels real enough to drive plot and character development. The key challenge is creating something systematic yet human - not a flowchart but a framework that forces hard choices.

  Hmm... the user's clearly done their research on real-world examples but rejects historical models as too abstract. What they need is the engine beneath - the actual trade-offs commissioners face late at night with case files. The procedure must handle power imbalances (commanders vs conscripts), evidentiary gaps, and political pressures while maintaining moral tension. 

  First, I should define what's being traded. Amnesty can't be for nothing - it has to purchase something valuable for the fragile peace. Truth seems the core currency here, but with limits: certain crimes must remain unforgivable regardless of cooperation. The international law dilemma is crucial too - commissioners should feel they're walking a tightrope over legal voids.

  For the steps... need sequential filters that escalate in moral difficulty. Start with basic eligibility (was this war-related? does the crime cross the unforgivable threshold?), then move to what's offered (truth? remorse? practical repair?), finally assess credibility and proportionality. Each step needs clear pass/fail criteria but must leave room for judgment calls.

  Ah, the political reality can't be ignored - the procedure should expose where commissioners merely rubber-stamp backroom deals. That's central to the novel's theme. And for the test cases, the commander who knows burial sites presents the perfect tension: procedure might demand amnesty for truth despite implicating powerful figures. That's the "unwanted outcome" the user requested.

  The conscript case should be straightforward - unless some technicality trips him up to show the system's cruelty. And for the stress test... maybe a sexual violence perpetrator where community forgiveness is impossible despite full confession. That forces commissioners to choose between procedure and conscience.

  Must remember to flag where the system fails - it can't measure sincerity, can't satisfy victims, can't escape politics. The final decision point has to be naked human judgment. That's where the protagonist's dilemma crystallizes.

  This novelist deserves brutal honesty. If the procedure is just value judgments in disguise, say so. But better to construct something that feels operational while exposing its own seams - that's where the literary tension lives. The midnight photocopy moments demand both bureaucracy and moral wilderness.

  For the formatting, I'll strictly follow their requested sections. The case studies will hurt - especially giving amnesty to that commander - but that's the point. Sometimes truth commissions betray their own ideals to survive. That's the corner worth staying in.
answer: |-
  ## Amnesty Decision Procedure: "The Ledger Protocol"

  **1. What the Procedure is Actually Trading**

  The core currency here is **Restorative Truth**. Amnesty isn't traded for forgiveness or justice in the traditional sense. It's traded for verifiable, actionable information essential to the fragile peace and future stability of the nation. The underlying logic is pragmatic survival: *To prevent the past from endlessly sabotaging the future, we need its darkest secrets excavated and neutralized.* The amnesty offered is immunity from domestic prosecution specifically for *war-related* acts committed within the defined conflict period.

  *   **What's Purchased:**
      *   **Location of Remains:** Enabling dignified burials and closure for victims' families, crucial for societal healing.
      *   **Chain of Command & Structures:** Mapping the machinery of atrocity prevents its resurrection and identifies systemic failures.
      *   **Patterns & Motives:** Understanding *how* and *why* things happened informs institutional reform.
      *   **Victim Validation:** Acknowledging specific victims by name and fate counters denialism.
      *   **Pre-Emptive Disclosure:** Getting facts *before* they emerge through leaks or rival investigations prevents destabilizing shocks.
  *   **What Amnesty is NOT Traded For:**
      *   **Remorse or Repentance:** Sincerity is impossible to mandate or verify. A cold, factual confession meets the requirement.
      *   **Victim/Family Forgiveness:** This is beyond the commission's power or purpose.
      *   **Personal Transformation:** Who the applicant is *now* is secondary to the truth they offer about *then*.
      *   **Retributive Justice:** The procedure explicitly sacrifices this for the perceived greater good of stability and truth.
  *   **Absolute Disqualifiers (No Amnesty Possible):**
      *   **Crimes Against Humanity (Systematic/Widespread):** Defined by international law precedent – murder, extermination, enslavement, deportation, torture, rape, persecution, enforced disappearance – committed as part of a widespread or systematic attack against civilians.
      *   **Genocide:** As defined by the Genocide Convention.
      *   **Ongoing Threat:** Credible evidence the applicant poses an *imminent* threat to individuals or the peace process.
      *   **Material Incompleteness:** Refusal or demonstrable inability to provide the *core* truth required (e.g., location of *key* graves, names of *principal* victims/commanders involved in *their* act).

  **The Tension:** Commissioners operate in a legal grey zone. International law norms *do* oppose impunity for atrocity crimes. The procedure forces them to weigh this illegality against the immediate, tangible benefits of truth and the potential collapse of the peace if key actors refuse to cooperate or the process loses political backing. It's a Faustian bargain with the past.

  **2. The Steps, in Order**

  **Step 1: Threshold Eligibility & Disqualification Check**
  *   **Question:** Does the petition relate to a conflict-period act? Does it fall under an Absolute Disqualifier (Crimes Against Humanity, Genocide, Ongoing Threat)?
  *   **Action:** Review petition summary, initial evidence. Cross-reference with pre-established lists of known atrocity events/units.
  *   **Sufficient Answer:** Clear linkage to conflict period. *No* credible evidence placing the act within a systematic pattern qualifying as CAH/Genocide. *No* credible evidence of imminent threat.
  *   **Commissioner Writes:** "Conflict-period act confirmed. No absolute disqualifier identified. Proceeds to Step 2." OR "Referred for full investigation re: possible [CAH/Genocide designation] / [Ongoing Threat assessment]. Eligibility suspended."
  *   *(Note: Designating an act as CAH/Genocide requires rigorous evidence and often committee debate; it's not automatic based on the act alone, but on its context/systematicity).*

  **Step 2: Truth Assessment - Disclosure Scope & Credibility**
  *   **Question:** Does the applicant offer *full and verifiable disclosure* concerning *their specific acts* and *knowledge critical to the core goals* (remains, command structure, patterns)? Is the disclosure credible?
  *   **Action:** Compare applicant testimony (hearing/interview transcript + affidavit) to existing evidence (witness statements, forensics, documents, other confessions). Identify gaps, contradictions, evasions. Assess specificity (names, dates, locations, methods, orders given/received). Focus on *what only they could know*.
  *   **Sufficient Answer:** Disclosure is detailed, specific, internally consistent, and aligns with or credibly explains existing evidence. Addresses key gaps in knowledge (e.g., "I was the one who ordered the burial at Grid Ref X"). Admits *personal* role/order without excessive blame-shifting (acknowledging context/orders is allowed, denying *own* action is not). Credibility indicators: Corroboration on verifiable details, plausible narrative, consistency under questioning.
  *   **Commissioner Writes:** "Disclosure deemed Full/Sufficient/Partial/Insufficient. Credibility High/Medium/Low. Key Truths Offered: [List - e.g., Grave Site B location, confirmed order from Commander X, identities of 5 victims]. Critical Gaps Remain: [List - e.g., Fate of missing child, identity of informant]." OR "Disclosure insufficient/not credible. Recommend denial."

  **Step 3: Necessity & Proportionality Assessment**
  *   **Question:** Is the truth offered *necessary* for core goals (closure, structural understanding, stability)? Is the amnesty sought *proportionate* to the gravity of the act *and* the value of the truth offered? Could this truth reasonably be obtained elsewhere?
  *   **Action:** Weigh the specific truths identified in Step 2 against the gravity of the confessed/established acts. Assess uniqueness (is *this* applicant the *only* source for *this* critical truth?). Consider the nature of the act (murder under duress vs. torture for pleasure). Does withholding amnesty risk losing *essential*, irreplaceable information?
  *   **Sufficient Answer:** The truth offered addresses a significant gap directly impacting victims' families, historical record, or structural understanding, and appears uniquely held by the applicant or obtainable *only* through their cooperation at this stage. The amnesty, while distasteful, is not grossly disproportionate *given the specific truths procured* (e.g., amnesty for one murder revealing location of a mass grave implicating commanders might be proportionate; amnesty for torture without significant new truth might not be).
  *   **Commissioner Writes:** "Truth offered deemed [Essential/Useful/Marginal] & [Unique/Obtainable Elsewhere]. Proportionality Assessment: [Amnesty warranted given truth value / Borderline / Not warranted due to gravity vs. truth value]. Recommend [Grant/Deny] based on Necessity/Proportionality." OR "Truth available elsewhere/no critical necessity. Recommend denial."

  **Step 4: Victim/Family Impact Statement Review (Informative, Not Determinative)**
  *   **Question:** What is the known impact on victims and their families? Does this introduce *new, critical context* not considered earlier?
  *   **Action:** Review submitted statements, summaries of victim testimony (if any). Note suffering, demands for justice/truth, opposition to amnesty. Assess if statements reveal factual errors in the applicant's testimony or highlight overlooked aspects of gravity/context.
  *   **Sufficient Answer:** Statements reviewed. [Summarize key themes: e.g., "Families express profound grief, demand punishment, strongly oppose amnesty" OR "One family notes applicant lied about victim's last words"]. [Note if it changes factual assessment from Step 2 or gravity assessment in Step 3: e.g., "No new factual contradictions identified" OR "Statement confirms applicant's cruelty detail omitted in testimony, increasing gravity"].
  *   **Commissioner Writes:** "Victim impact reviewed. [Summary of sentiment]. [Impact on prior assessments, if any]. Considered in final deliberation." *(This step informs judgment but doesn't have pass/fail criteria within the procedure itself).*

  **Step 5: Political Reality Check (Acknowledgment, Not Dictation)**
  *   **Question:** Are there known, credible threats to the commission's existence or the peace process contingent *specifically* on this decision? Is this decision likely to be a flashpoint?
  *   **Action:** Review briefings (if any) on political climate. Note if applicant is linked to powerful factions. Consider whether denial could trigger boycotts/violence, or grant could cause mass protests/collapse of victim support.
  *   **Sufficient Answer:** Political context noted: [e.g., "Applicant faction warns of withdrawal if denied" OR "Victim groups vow protests if granted"]. Assessment of threat credibility: [High/Medium/Low/Unclear]. Considered in final deliberation.
  *   **Commissioner Writes:** "Political context noted: [Summary]. Credibility of threats: [Assessment]. Considered in final deliberation." *(Like Step 4, this informs but doesn't dictate within the procedure's logic).*

  **Step 6: Final Synthesis & Recommendation**
  *   **Question:** Synthesizing Steps 1-5, does the applicant meet the criteria for amnesty under the Ledger Protocol?
  *   **Action:** Revisit outputs of Steps 1-3. Did they pass? (No disqualifier, Sufficient/Credible Disclosure, Necessary/Proportionate). How do Steps 4 & 5 weigh on the *human* level of the decision? Is there an overwhelming factor outside the procedure?
  *   **Commissioner Writes:** "Synthesis: Eligibility [Confirmed]. Disclosure [Sufficient/Credible]. Necessity/Proportionality [Met/Not Met]. Final Recommendation: [GRANT / DENY] Amnesty. Rationale: [Concise summary of key reasons from Steps 1-3, acknowledging weight of Steps 4/5 if pivotal]."

  **3. Where it Stops and a Person Decides**

  The procedure forces focus on verifiable facts and defined criteria (Truth, Necessity, Proportionality, Disqualifiers). But it cannot resolve the fundamental tensions it exists within:

  *   **The Value of Truth vs. The Demand for Justice:** The procedure quantifies truth's utility, but the commissioner must *live* with trading justice for it. The weight of that sacrifice is personal.
  *   **The Sincerity Void:** It tests *what* is said, not *why*. The commissioner must judge the gap between a clinically sufficient confession and the human yearning for remorse, facing the victim impact statements directly.
  *   **Proportionality's Abyss:** Defining if amnesty for *this* act is "worth" *that* truth is inherently subjective, especially when the act is visceral (torture, rape) and the truth is abstract (command structure). The procedure provides factors, not an answer.
  *   **The Political Sword of Damocles:** The procedure notes political pressure, but the commissioner must decide: Is defying this threat an act of courage that protects the commission's integrity, or recklessness that destroys its chance to uncover *other* truths? Is yielding to it a necessary evil or a fatal compromise?
  *   **The Unforgivable Within the "Permissible":** An act might narrowly avoid CAH designation yet feel morally irredeemable to the commissioner. The procedure doesn't cleanse the act.

  **When the procedure hands over (at Step 6), the commissioner weighs:** Can I personally endorse this exchange? Does the truth bought *here* materially advance the peace *enough* to counterbalance the moral injury of impunity *for this specific act*, knowing the victims' anguish and the political storm it might unleash? It's a solitary valuation of intangibles – conscience, consequence, and the fragile hope of a future built on ugly truths.

  **4. Three Petitions Run Through It**

  **Case 1: Commander Kael (Mid-level, Village Massacre, Knows Grave, Implicates Current Leaders)**
  *   **Step 1:** Conflict-period act. Massacre likely involves murder, possibly CAH? *Debate:* Was this village part of a systematic pattern? Evidence suggests it was retaliation, possibly isolated (though horrific). Not definitively CAH *based on this act alone*. No imminent threat noted. **Proceeds.**
  *   **Step 2:** Confesses ordering the killing (specific command, unit involved). Provides *exact* grid coordinates for the second grave (previously unknown, confirmed by preliminary scan). Names the two current ministers as the ones who gave the *general* retaliation order but didn't specify *this* village. Disclosure highly specific, includes verifiable data (grave site). Credibility High. **Full/Sufficient, Credibility High. Key Truths: Grave Site B location; Direct order responsibility; Implicates Ministers X & Y in broad policy.**
  *   **Step 3:** Truth offered is **Essential** (closure for 15+ families) and **Unique** (only surviving officer from that unit). Gravity is extreme (40 murders). **Proportionality Assessment:** Borderline/Harrowing, but arguably warranted. The location of the remains and the high-level implication are irreplaceable truths impacting national healing and accountability (politically, if not legally). **Necessity/Proportionality MET (barely).**
  *   **Step 4:** Victim families uniformly condemn, demand justice. No new factual contradictions. **Reviewed. Profound grief/anger.**
  *   **Step 5:** Political context HIGH. Ministers X & Y wield significant power. Credible threat: Their faction may withdraw support, collapse government coalition. **Context: High-stakes political bomb. Credibility HIGH.**
  *   **Step 6:** **Synthesis:** Eligible. Full/Credible Disclosure. N/P Met (barely). **Recommendation: GRANT.** *Rationale: Truth offered (grave location, command responsibility, high-level implication) is essential, unique, and justifies amnesty despite extreme gravity. Political consequences of denial risk wider peace.* **THIS IS THE UNWANTED OUTCOME.** The procedure forces amnesty for a repellent figure due to the unique, high-value truth and political necessity.

  **Case 2: The Conscript, Elara (One Killing Under Duress, Tried to Speak)**
  *   **Step 1:** Conflict-period act. Single murder under duress. Not CAH/Genocide. No threat. **Proceeds.**
  *   **Step 2:** Detailed confession: Ordered to shoot a fleeing civilian by sergeant, threatened with execution if refused. Names sergeant (deceased), location, time. Corroborated by her prior attempts to report (documented by NGO). Disclosure specific, consistent, credible. **Full/Sufficient, Credibility High. Key Truths: Specific act under duress, chain of command (low-level).**
  *   **Step 3:** Truth offered is **Useful** (confirms patterns of coercion, validates victim) but likely **Obtainable Elsewhere** (other conscripts, NGO reports). Gravity is medium (killing, but under duress). **Proportionality Assessment:** Warranted. Truth confirms systemic abuse, low personal culpability. **Necessity/Proportionality MET.**
  *   **Step 4:** Victim's family statement: Anguished, but notes Elara is the only one who ever came forward, acknowledges duress context. **Reviewed. Anguish but unique acknowledgment.**
  *   **Step 5:** Minimal political context. **Noted. Low.**
  *   **Step 6:** **Synthesis:** Eligible. Full/Credible Disclosure. N/P Met. **Recommendation: GRANT.** *Rationale: Full disclosure of act under duress, confirms coercion patterns. Proportional. Victim family acknowledges context.* (The "rooted for" outcome, procedure aligns).

  **Case 3: The Torturer, Silas (Full Confession, Isolated But Sadistic Acts, No New Truth)**
  *   **Step 1:** Conflict-period acts (multiple torture sessions). Single perpetrator, victims were captives from opposing faction. Systematic? *Debate:* Pattern of behavior, but likely not "widespread or systematic attack against civilian population" *if* captives are considered combatants/hors de combat and the scale is small (e.g., 5-10 victims). Not definitively CAH. No threat. **Proceeds.** (Stress Test: Grey area on CAH).
  *   **Step 2:** Confesses in graphic detail to torturing 7 specific individuals (names, methods, locations, dates). Confession aligns with known victim testimonies. Disclosure is **Full** and **Credible** on *his acts*. **Full/Sufficient, Credibility High. Key Truths: Specific methods used on named victims.**
  *   **Step 3:** Truth offered is **Marginal**. Confirms known victim experiences but reveals no *new* essential truths (no grave sites, no command structure beyond him, no missing persons). Gravity is **High** (sadistic torture, lasting victim trauma). **Proportionality Assessment:** **NOT MET.** The truth, while complete about his acts, is largely known and doesn't advance core goals (closure, structural understanding) significantly. Amnesty for such gravity without essential, unique truth is unwarranted. **Necessity LOW.**
  *   **Step 4:** Victim statements harrowing. Lifelong physical/psychological damage. Unanimous, vehement opposition to amnesty. **Reviewed. Profound, lasting harm.**
  *   **Step 5:** Political context MEDIUM. His faction (minor but vocal) claims he's being scapegoated. Victim groups would see amnesty as betrayal. **Context: Divisive. Credibility MEDIUM (protests likely).**
  *   **Step 6:** **Synthesis:** Eligible. Full/Credible Disclosure. **N/P NOT MET. Recommendation: DENY.** *Rationale: Disclosure complete but offers no essential, unique truth justifying amnesty for acts of high gravity causing lasting harm. Proportionality not achieved. Victim impact severe.* (Stress Test Outcome: Full confession isn't enough without commensurate *unique, essential* truth value. Procedure denies despite cooperation).

  **5. What This Can't Do**

  This procedure cannot:
  1.  **Deliver Justice:** It explicitly trades justice for truth and stability. Victims get names and maybe bones, not punishment.
  2.  **Measure Sincerity:** A perfectly executed, coldly clinical confession meets the bar. Remorse is invisible to the ledger.
  3.  **Heal:** It provides facts, not reconciliation. It may even deepen wounds by granting impunity.
  4.  **Escape Politics:** It acknowledges political pressure but cannot nullify it. Commissioners decide under its shadow.
  5.  **Define "Proportionality" Objectively:** The gut-wrenching calculus of "Is *this* truth worth *that* atrocity?" remains profoundly human and debatable.
  6.  **Guarantee Truth:** It incentivizes disclosure but cannot verify every detail. Some lies, or crucial omissions, may slip through.
  7.  **Satisfy International Law:** It knowingly operates in the shadow of illegality concerning impunity for potential CAH acts below the systematic threshold. It's a local, pragmatic solution to a local, existential crisis, not a model of global justice.

  **The Core Limitation:** It is a tool for managing a catastrophic past, not transcending it. It accepts moral compromise as the price of survival, forcing commissioners to become accountants of atrocity, valuing truth in a currency stained with blood. The weight of that transaction is carried in their conscience, long after the final vote.
