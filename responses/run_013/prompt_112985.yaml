  Level 2: Trial-and-error learning (the agent acts in the world and gets feedback, e.g., reinforcement learning with real-world rewards).
  Level 3: Internal simulation (the agent builds a model and tests actions internally before acting).
  Level 4: Offloading cognition (using external tools, other agents, or humans to carry part of the cognitive load).

  We note that Dennett's classification is indeed: Darwinian (trial and error in the world), Skinnerian (conditioned by rewards, but note: Dennett's Skinnerian is often associated with operant conditioning without internal models, which is similar to our Level 2), Popperian (test hypotheses internally, die in simulation), and Gregorian (using tools, especially language and culture). However, for our purposes, we'll use the levels as described but note:

  - Level 1: Fixed, pre-programmed behavior.
  - Level 2: Learning by real-world trial and error (with feedback).
  - Level 3: Using an internal model to simulate and choose actions.
  - Level 4: Using external resources (tools, other agents, humans) to aid in decision-making.

