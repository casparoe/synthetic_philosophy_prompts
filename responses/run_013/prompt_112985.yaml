answer: |-
  **Decision Procedure for Adding a Behavior**  
  1. **Is the behavior safety-critical?**  
     *Definition:* A mistake could cause physical harm, major financial loss, or irreversible trust damage.  
     - **YES:**  
       - Cannot use Level 2 (trial-and-error learning).  
       - Proceed to Question 2.  
       - *Sign-off required:* Always (due to risk).  
     - **NO:** Proceed to Question 2.  
     - *Stop/Don’t build only if:* Safety-critical and no viable path to Level 1, 3, or 4 within constraints.  

  2. **Is the behavior well-defined and stable?**  
     *Definition:* Inputs/outputs are predictable; no need for adaptation to new/unseen cases.  
     - **YES:** Use **Level 1 (pre-programmed)**. Stop.  
     - **NO:** Proceed to Question 3.  
     - *Sign-off required:* If safety-critical and choosing Level 1.  

  3. **Can we simulate internally within constraints?**  
     *Definition:* Build an accurate model to test actions *before* real-world execution. Must meet:  
     - Robot: Runs in ≤200ms on weak hardware.  
     - Chatbot: Runs in ≤2 seconds.  
     - **YES:** Use **Level 3 (internal simulation)**. Stop.  
     - **NO:** Proceed to Question 4.  
     - *Sign-off required:* For robot wheel-touching behaviors.  

  4. **Can we offload cognition safely?**  
     *Definition:* Use external tools (e.g., lookup tables, APIs, humans) to reduce onboard computation. Must meet:  
     - Robot: Offloading + response ≤200ms (account for network latency).  
     - Chatbot: Offloading + response ≤2 seconds.  
     - **YES:** Use **Level 4 (offloaded cognition)**. Stop.  
     - **NO:** Proceed to Question 5.  
     - *Sign-off required:* For new external dependencies.  

  5. **Is trial-and-error justified?**  
     *Definition:* Mistakes are low-cost (no harm, minor inefficiency), and feedback is obtainable.  
     - **YES:** Use **Level 2 (trial-and-error learning)**.  
     - **NO:** **Don’t build.**  
     - *Sign-off required:* Always (due to unpredictability).  

  **Distinctions to Keep/Throw Out:**  
  - **KEEP:** Safety-critical flag, time/resource constraints, offloading viability.  
  - **THROW OUT:** Philosophical labels (e.g., "Popperian"). Focus on *mechanism* (simulation, offloading) vs. theory.  

  ---

  ### Case Applications  
  **(a) Warehouse Robot Collision Avoidance**  
  1. **Safety-critical?** YES (mistake → harm). Cannot use Level 2.  
  2. **Well-defined?** YES (known sensors, obstacles, stop conditions).  
     → **Level 1 (pre-programmed)**. Use hard-coded rules (e.g., "stop if obstacle < 1m").  
     *Engineers won’t like this:* They may argue for adaptive learning (Level 2/3), but safety and 200ms constraint force simplest solution.  
     *Sign-off required:* Yes (wheel movement + safety).  

  **(b) Chatbot: Refund Promise Above Limit**  
  1. **Safety-critical?** YES (mistake → financial loss/trust damage). Cannot use Level 2.  
  2. **Well-defined?** NO (depends on complex customer context).  
  3. **Simulate internally?** YES (train model nightly on logs; infer in seconds).  
     → **Level 3 (internal simulation)**. Pre-trained model evaluates refund eligibility.  
     *Sign-off required:* No (unless new dependencies).  

  **(c) Robot Picking an Aisle (Ordinary Day)**  
  1. **Safety-critical?** NO (mistake → inefficiency, not harm).  
  2. **Well-defined?** NO (dynamic factors: congestion, spills).  
  3. **Simulate internally?** NO (weak computer; simulating paths >200ms).  
  4. **Offload cognition?** NO (network latency risks breaching 200ms).  
  5. **Trial-and-error justified?** NO (constraint: no learning in aisles with people).  
     → **Don’t build adaptive version.** Use pre-programmed routes (Level 1).  
     *Engineers won’t like this:* They’ll push for "smart" routing, but constraints block Levels 2-4.  

  ---

  ### What This Procedure Can’t Decide  
  1. **Trade-offs between efficiency and safety:** E.g., If Level 1 is safe but inefficient, vs. Level 3 being optimal but borderline on time.  
  2. **Implementation effort:** Doesn’t weigh cost of building internal models (Level 3) vs. offloading (Level 4).  
  3. **Edge cases:** Fails when constraints conflict (e.g., safety-critical + no time for simulation/offloading → forces "don’t build," even if desirable).  

  ### Where It Will Misfire  
  - **Overly strict safety flags:** E.g., Chatbot refunds flagged "safety-critical" may stall progress if overused.  
  - **Resource misjudgments:** Assumes engineers accurately assess simulation/offloading feasibility; underestimates real-world lag.  
  - **Human factors:** Offloading to humans (Level 4) may *seem* viable but fail in practice (e.g., slow response times).
