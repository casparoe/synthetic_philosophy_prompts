prompt: |-
  I am reading Hobbes's Leviathan alongside the early modern debates about the certainty of mathematics, and I have run into a sentence in chapter 4 that I cannot make sense of on my own. Hobbes writes: "And therefore in geometry, which is the only science that it hath pleased God hitherto to bestow on mankind, men begin at settling the significations of their words; which settling of significations they call definitions, and place them in the beginning of their reckoning."

  My difficulty is not the English but the surrounding doctrine. In the same chapter Hobbes insists that "there being nothing in the world universal but names; for the things named are every one of them individual and singular," and he warns that the names of virtues and vices, whose signification shifts with the speaker's passions, "can never be true grounds of any ratiocination." In chapter 9 he defines science as conditional knowledge, and his example is geometrical: if the figure shown be a circle, then any straight line through the centre divides it into two equal parts.

  My tentative reading is that the necessity Hobbes finds in geometry is internal to the definitions we impose, so that calling geometry God's gift amounts to saying that God gave us speech and the faculty of reckoning, the definitions themselves being ours. I would like help seeing whether the passage supports that, or whether I am flattening a distinction Hobbes needs. In particular: what does "God-given" add that the earlier remark about God instructing Adam in the naming of the creatures does not already supply, and why should the definitional method secure certainty in geometry but not in the moral vocabulary Hobbes requires for civil philosophy? I have also seen it suggested that Hobbes holds a "maker's knowledge" view — that we know with certainty only what we ourselves construct, which would tie the geometer's figures to the commonwealth we build — but I am unsure whether that is Hobbes or a later idea (it sounds to me like Vico) read back into him.

  Please help me understand the passage and the doctrine behind it. If my framing is a misreading, or if the puzzle I have posed is one Hobbes's text does not actually generate, say so plainly rather than answering it as posed.
reasoning: |-
  Okay, the user is grappling with a dense passage from Hobbes' Leviathan, specifically about why geometry is unique as "the only science" God bestowed. They've done impressive groundwork—noticing tensions between nominalism (only names are universal) and geometric certainty, connecting it to maker's knowledge theories, and questioning why moral language lacks similar stability. 

  Their core confusion seems twofold: first, how divine gift language coheres with Hobbes' radical nominalism (if definitions are human constructs, what makes geometry "God-given"?), and second, why geometry’s definitional method can’t extend to civil philosophy. They’re also wary of anachronistically projecting Vico’s maker’s knowledge onto Hobbes. Smart hesitations.

  Hmm. The key is unpacking Hobbes' layered view of language. When he calls geometry God’s gift, he’s not endorsing divinely implanted ideas (he rejects innate ideas!), but crediting God for creating human cognitive faculties—specifically, our capacity for rigorous definition and deduction. The "gift" is the *method*, not the content. Adam’s naming was arbitrary labeling; geometric definitions are systematic constraints on signification. That’s why the latter yields certainty: we control the parameters entirely. Virtue/vice terms fail because they attempt to name fluid human desires—things we don’t construct and can’t fix semantically. 

  The maker’s knowledge angle is valid but needs nuance. Yes, for Hobbes, geometric certainty stems from constructing mental objects (circles, lines), but crucially, this parallels political artifice: both are products of human will imposing order. The divine aspect? Merely that our reason—the tool for such constructions—is God-given. No Platonic forms here. 

  Their framing isn’t wrong, but could sharpen the distinction: definitions aren’t just "ours" in a casual sense; they’re *stipulative fiat* creating closed systems. Geometry works because its referents are imaginary; ethics crumbles because it points to uncontrollable realities. God’s role is limited to gifting us the rational capacity to build these systems—nothing more. 

  Should flag that Hobbes’ optimism about geometry’s transferability to politics was… overly hopeful. His civil science never achieved Euclidean tidiness, as later critics noted. But that’s beyond the scope. For now, affirming their intuition while tightening the logic chain: divine gift → human faculties → stipulative definitions → constructed certainty. No anachronism with Vico; maker’s knowledge is rightly spotted, just less developed than in Scienza Nuova.
answer: |-
  Your reading is perceptive and largely aligns with Hobbes's doctrine, but the passage requires unpacking to resolve the tensions you've identified. Hobbes's claims about geometry as "God-given" and its unique certainty stem from his **nominalism, materialist epistemology, and the concept of "conditional" science**. Here’s a systematic breakdown:

  ### 1. **The "God-Given" Status of Geometry**  
     - **Not Innate Ideas, but Human Faculties**: When Hobbes calls geometry "God’s gift," he means God endowed humans with **reason and language** (speech + "reckoning"). This contrasts with Adam’s naming (Gen. 2:19–20), which was arbitrary labeling of *existing* particulars. Geometry is "gifted" because it emerges from our divinely bestowed capacity to *construct universal truths* through definitions and deduction.  
     - **Divine Gift vs. Human Construction**: The gift is the *method*, not the content. God gave us the tools (reason/language); we build geometric certainty ourselves by stipulating definitions. As Hobbes states:  
       > "Reason is not born with us; nor gotten by experience only, but attained by industry" (*Leviathan*, Ch. 5).  
       Geometry is "gifted" because it exemplifies the *only* flawless application of this God-given faculty.

  ### 2. **Why Definitions Secure Certainty in Geometry**  
     - **Nominalism and Construction**: Since "nothing is universal but names" (Ch. 4), geometric objects (e.g., "circle") are **mental constructs** defined by us. We control their signification entirely:  
       - We define "circle" as "a set of points equidistant from a center."  
       - Consequences (e.g., "bisected by a diameter") follow *necessarily* from this definition.  
     - **Contrast with Moral Terms**:  
       | **Geometry** | **Moral/Political Terms** |  
       |--------------|----------------------------|  
       | Significations fixed by stipulation (e.g., "circle") | Significations shaped by passions (e.g., "justice") |  
       | Refers to *fictions we create* | Refers to *real, contested desires* |  
       | Conclusions are *conditional*: "If this is a circle, then..." | Grounded in mutable human nature |  
       Moral terms lack fixed referents because they name subjective human experiences (appetites/aversions), not constructed ideals.  

  ### 3. **"Maker's Knowledge" in Hobbes**  
     - **Yes, Hobbes Endorses This**:  
       - We know geometric truths with certainty because **we make them up**. As he writes:  
         > "The first truths were arbitrarily made by those that first settled the significations of names" (*De Corpore*, I.3.8).  
       - This extends to politics: The commonwealth is an "artificial man" (*Leviathan* Introduction) constructed via covenant. We know its principles because we *invent* them.  
     - **Distinction from Vico**: Vico’s *verum-factum* (truth is made) is broader, applying to history/culture. Hobbes restricts it to **formal systems** (geometry, politics) where humans impose order. It *is* authentically Hobbesian.  

  ### 4. **Resolving Your Questions**  
     - **Why "God-Given" Adds to Adam’s Naming?**  
       Adam named *pre-existing* things (contingent particulars). Geometry’s gift is the ability to create *necessary truths* from definitions—transcending experience through reason.  
     - **Why Not Moral Vocabulary?**  
       Moral terms ("good," "just") signify desires, which are:  
       - Subjective (vary by individual),  
       - Relative (depend on circumstances),  
       - Caused by bodily motions (passions), not stipulation.  
       Unlike circles, we cannot fix their meaning by fiat because their referents are not mental constructs but **embodied human experiences**.  

  ### 5. **Key Doctrine: Science as Conditional Knowledge**  
     Hobbesian science is **conditional** (*if* definitions, *then* conclusions):  
     - Geometry: "If this is a circle, it is bisected by its diameter."  
     - Politics: "If humans covenant to obey a sovereign, then peace follows."  
     Certainty derives from the logical chain *within* the system, not correspondence to external reality. Geometry is exemplary because its definitions are unambiguous and consequences inexorable.  

  **Conclusion**: Your reading is correct. The "God-given" element is the rational capacity for definition and deduction, not preformed ideas. Geometry’s certainty arises from **self-contained stipulation**, impossible for moral terms due to their anchor in volatile human passions. Hobbes’s "maker’s knowledge" is central: we know geometry and politics because we construct their principles. The distinction you seek lies in the *domain of application*: geometry deals with fictions we control; moral philosophy deals with the uncontrollable realities of human nature.  

  **Sources to Confirm**:  
  - Hobbes’s *De Corpore* (Part I, Ch. 3) clarifies his epistemology.  
  - *Leviathan* Ch. 5: Reason as "reckoning" (computation) with names.  
  - Quentin Skinner’s *Hobbes and Republican Liberty* traces maker’s knowledge in Hobbes’s politics.
