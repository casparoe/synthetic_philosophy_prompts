      - The payoffs are such that at any node i, if the current player Takes, they receive a_i and the opponent receives b_i. If they Pass, then the game moves to the next node. The payoffs are structured so that a_i is slightly higher than the payoff the current player would get if they passed and the opponent took at the next node (i+1). Similarly, the pot grows so that the payoffs at later nodes (if reached) are higher for both.

