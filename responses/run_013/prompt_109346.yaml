     - Side A's prediction: Rationality is primarily normative. It tells players what they should do to maximize their payoff. Therefore, the BI outcome is the rational prescription.
     - Side B's prediction: Rationality in this context is intended to be predictive. If the prediction fails (as in experiments), then the model is inadequate.

