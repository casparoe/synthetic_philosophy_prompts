     - Formal result: Both sides accept that in the formal model of the game with common knowledge of rationality, backward induction yields a unique solution. However, the critic argues that common knowledge of rationality is an extremely strong assumption that is not robust to small perturbations (e.g., a tiny probability that a player is irrational). This is supported by the work on the centipede game with incomplete information (e.g., McKelvey and Palfrey, 1992) which shows that with even a small amount of uncertainty about the other player's rationality, the game can have equilibria where players pass for several rounds.
     - Side A's prediction: The counterfactuals are well-defined and true because rationality is common knowledge. Therefore, the BI path is the only rational path.
     - Side B's prediction: The counterfactuals at unreached nodes are not well-defined because the assumption of common knowledge of rationality is inconsistent with the game having reached that node. Therefore, the BI argument fails.

   IV. Verbal Dispute:

