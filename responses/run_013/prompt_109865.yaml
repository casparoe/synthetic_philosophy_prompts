  Here’s a joint statement draft for Maya (Knowledge Norm) and Dev (Truth Norm), structured as requested. It aims for adversarial collaboration—clarifying agreements, isolating disagreements neutrally, and flagging conceptual pitfalls:

  ---

  ### **Joint Statement: Norms of Assertion**  
  *Signed: Maya & Dev*  

  #### **I. Shared Starting Points**  
  We agree on the following:  
  1.  **Assertion Defined**: Assertion is a speech act where a speaker presents a proposition *as true* (contrasted with guessing, conjecturing, or fiction).  
  2.  **Purpose of Norms**: A norm of assertion should:  
      -   Explain when an assertion is *appropriate* or *correct* in ordinary conversation.  
      -   Account for why we criticize certain assertions (e.g., "How do you know?") and require retractions.  
      -   Distinguish assertion from weaker speech acts (e.g., "It might rain" vs. "It will rain").  
  3.  **Key Data Points**:  
      -   **Lottery Cases**: Asserting "Your ticket lost" (before results) feels inappropriate even if true and probable. *(Maya: Shows knowledge is needed; Dev: Shows truth alone isn’t sufficient for appropriateness.)*  
      -   **Moore-Paradox**: Saying "It’s raining but I don’t believe it" is absurd, even if true. *(Both: Suggests belief is necessary for proper assertion.)*  
      -   **Retraction/Challenge**: If challenged ("Why think that?"), asserting without evidence often requires retraction. A good norm explains this.  
      -   **Guessing vs. Asserting**: Saying "I guess it’s safe" is fine; asserting "It’s safe" without basis isn’t.  
  4.  **Decisive Argument Criteria**: A successful norm must:  
      -   Explain all the data above better than alternatives.  
      -   Avoid making ordinary conversation impossible (e.g., requiring certainty for every claim).  
      -   Not permit clearly irresponsible assertions (e.g., asserting random truths without evidence).  

  #### **II. Disagreements Table**  
  | **Issue**                          | **Maya’s View (KN)**                                                                 | **Dev’s View (TN)**                                                                |  
  |------------------------------------|--------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|  
  | **Primary Norm**                   | Assertion is permissible only if you *know* the proposition.                         | Assertion is correct if the proposition is *true*, and you’re not lying/guessing. |  
  | **Core Purpose**                   | To share *knowledge* and maintain conversational reliability.                       | To communicate *facts* accurately; knowledge is ideal but not required.           |  
  | **Handling False Assertions**      | A false assertion is always incorrect (even if reasonable).                         | A false assertion is incorrect, but a true one is correct *even if unreasonable*. |  
  | **"Norm" Meaning**                 | A *permissibility rule*: What makes an assertion socially/epistemically acceptable? | A *correctness condition*: What makes an assertion successful/factual?            |  

  #### **III. Cruxes: Key Sub-Questions**  
  1.  **Does assertion require *epistemic justification* beyond truth?**  
      - *Test Case*: A doctor asserts "The drug is safe" based on flawed (but not negligent) research. Later, it’s found safe by luck.  
      - *Maya predicts*: Assertion was improper (lacked knowledge), requiring retraction if challenged.  
      - *Dev predicts*: Assertion was correct (true) and need not be retracted, though method was poor.  

  2.  **Can a true assertion be improper *solely* due to the speaker’s ignorance?**  
      - *Test Case*: Claire asserts "The meeting is at 3 PM" after misreading an email (but the meeting *is* at 3).  
      - *Maya predicts*: Assertion is improper (Claire didn’t know); she should concede ignorance if challenged.  
      - *Dev predicts*: Assertion is correct (true) and need not be retracted. Criticizing Claire is about her belief, not the assertion.  

  3.  **Is the "oddness" of lottery assertions best explained by lack of knowledge or lack of belief?**  
      - *Test Case*: Jay says, "I don’t know if I won, but I assert: my ticket lost."  
      - *Maya predicts*: This is inherently contradictory (asserting what you admit you don’t know).  
      - *Dev predicts*: Oddness comes from asserting while disavowing belief—truth norm + belief requirement explains it.  

  #### **IV. Clarifying Conceptual Pitfalls**  
  -   **"Norm" Ambiguity**: We acknowledge a verbal disagreement. Maya uses "norm" as a *regulative rule* (what you *ought* to do), Dev as a *constitutive rule* (what *makes it* an assertion). This may explain some friction, but our core dispute remains substantive: what conditions must an assertion satisfy to be proper?  
  -   **Is KN just Belief + Testimony?**  
      Maya: No. Assertion has its *own* norm (knowledge) because it commits the speaker to defend a claim as known. Belief is necessary but insufficient (e.g., lucky guesses).  
      Dev: Possibly. If testimony requires knowledge, KN reduces to that + believing what you assert. But truth norm is simpler.  
  -   **Can TN explain Moorean Absurdity?**  
      Dev: Yes, by adding a *belief requirement*: Asserting "P" while disbelieving P violates sincerity.  
      Maya: This makes belief a separate norm—knowledge explains both belief and justification in one standard.  
  -   **Constitutive vs. Regulative**: Both norms can be framed either way. The crux is *which standard* (knowledge or truth) is fundamental to assertion’s function in conversation.  
  -   **Scope of the Norm**: We agree norms govern *all* flat-out assertions. Context may change *standards* for knowledge/evidence, but not the underlying norm.  

  #### **V. The Belief Norm: Common Ground or Competitor?**  
  -   **Shared View**: Both agree you *should* only assert what you *believe*. This is a minimal, shared requirement (explaining Moore-paradox).  
  -   **Maya’s Addendum**: Belief is necessary but not sufficient—knowledge is the full norm.  
  -   **Dev’s Addendum**: Belief + truth make an assertion correct and sincere. Extra justification is virtuous but not obligatory.  
  -   **Joint Conclusion**: The belief norm is a *component* of both our views, not a third position. The debate is whether knowledge or truth is the *completing* condition.  

  ---  

  **Why this works for both**:  
  - Maya’s core demand (assertion must be knowledge-backed) is preserved, but Dev isn’t forced to accept KN.  
  - Dev’s core demand (truth determines correctness) is preserved, but Maya isn’t forced to abandon KN’s explanatory role.  
  - Disagreements are pinpointed without caricature.  
  - Conceptual clarifications (e.g., norm ambiguity) prevent talking past each other.  
  - Belief is included but not elevated—it’s a shared foundation, not the battleground.  

  This reflects "in-the-weeds" nuances (constitutive/regulative, primary/secondary norms) without citations or dumbing down. It treats both views as serious contenders while pushing them toward testable predictions.
