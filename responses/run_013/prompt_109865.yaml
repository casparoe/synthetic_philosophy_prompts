prompt: |-
  I'm a junior in high school and I'm in this philosophy club where me and two friends have been having this arguement for like a month about what the norm of assertion actually is. My friend Maya is a total knowledge-norm person: she thinks you should only assert something if you know it, and she keeps bringing up lottery cases and the weirdness of saying something and then admitting you don't know it. My friend Dev thinks that's way too strong and that the real norm is truth: you can assert something if it's true, even if you don't know it, as long as you're not lying or just guessing. They've been talking past each other for weeks. Dev says the knowledge norm makes ordinary assertions way too hard and turns every conversation into an epistemology exam, while Maya says the truth norm is too weak because it lets you assert stuff you have no business asserting. There's also the belief norm — you should only assert what you believe — and I want the statement to say whether that's a third position or just something both of them can accept as a fallback.

  I want to write the joint statement they could both sign after a real adversarial collaboration. Not a debate transcript, not a verdict on who's right — a constructive document they could both put their names to. Start with a numbered list of claims they both accept: about what a norm of assertion is supposed to do, about the data (lottery cases, Moore-paradox cases, retraction, challenge, the difference between asserting and guessing or conjecturing), and about what would count as a decisive argument. Then a disagreements table where each remaining disagreement is stated in wording that each side would accept for their own view. I want the cruxes — the sub-questions where settling it would move at least one side — and for each crux, a case or argument that both sides agree bears on it, plus what each side predicts about that case. Also, I have a suspicion that part of their fight is verbal: Maya seems to use the word norm to mean a rule that makes an assertion permissible or impermissible, while Dev seems to use it to mean a standard that makes an assertion correct or incorrect. Make them say whether that's a real disagreement or just two different questions.

  Can you also include a short section on whether the knowledge norm is really a norm of assertion or whether it's just a norm of belief plus a norm of testimony, and whether the truth norm can explain why it's weird to assert something you don't believe? And don't just give me the standard textbook positions — I want the in-the-weeds stuff: constitutive vs regulative rules, primary vs secondary norms, whether the norm governs all assertions or only some, and whether the whole thing is about keeping track of what's been said in a conversation rather than about what you're allowed to say. Please don't give me a reading list or citations, just the actual joint statement. I'm a high schooler so keep it clear, but don't dumb it down — I can handle the technical stuff.
