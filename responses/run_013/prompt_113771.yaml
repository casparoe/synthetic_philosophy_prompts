  For the essay question, I'm considering framing it around two pressure points: (1) whether the value revealed is merely about our present psychological state or implies an objective reason to ensure survival, and (2) whether humanity has special status versus any future collective. The Mars case should be central - it forces candidates to confront if Earth projects retain meaning through Martians who've severed ties.

  The model answer needs to honestly wrestle with the limitations. It should show how Scheffler reveals our contingency on collective survival but falters in bridging to moral obligation, and how the "humanity" requirement risks arbitrariness. I'll structure it to: explain the conjecture, analyze the Mars dilemma, then evaluate what normative work it can actually do.

  For the marking scheme, these five discriminators seem crucial:
  - Correctly framing the conjecture's claims/non-claims
  - Applying the Mars case to challenge humanity's necessity
  - Separating psychological impact from moral reasons
