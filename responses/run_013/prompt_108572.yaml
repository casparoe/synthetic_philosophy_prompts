prompt: |-
  I'm putting together a problem set on moral responsibility and I'm bored of the usual Frankfurt case with a hidden intervener waiting to step in. Can you build me a fresh one to spec? It has to be realistic — no brain chips, mind readers, demons, or anything sci-fi, just an ordinary workplace, family, or civic situation. The agent is genuinely morally responsible for what she does, and yet she truly could not have done otherwise — and I mean that in the full libertarian, categorical sense, not the watered-down reading where it just means she would've done otherwise if she'd chosen to. So no leftover alternative for a flicker-of-freedom defender to grab: no last-second waver, no chance to try, nothing. Also please make sure the case doesn't need anyone to detect a precursor of her decision in advance — the prior-sign objection is exactly what I'm trying to get past — and that she isn't coerced or brainwashed, so she's acting on her own reasons. Give me the scenario in one paragraph, then walk through why she couldn't have done otherwise, why she's still responsible, and the strongest move a committed defender of the principle of alternative possibilities would make against the case. Tell me which single feature is carrying all the weight and what happens if I delete it. If you think the flicker really can't be fully eliminated, say so rather than papering over it. Be upfront about how confident you are and flag the bit your least sure of. Finish with a last line: \answer{<the one feature the case hinges on, in a few words>}.
reasoning: |-
  Okay, let me tackle this problem set request. The user wants a fresh Frankfurt-style case that avoids sci-fi elements and common objections, while genuinely challenging the Principle of Alternative Possibilities (PAP). 

  First, I need to understand the core requirements: a realistic setting (workplace/family/civic), an agent who is morally responsible despite categorical inability to do otherwise, no prior-sign detection, no coercion, and complete elimination of alternative possibilities including "flickers of freedom". 

  Hmm, the hardest part will be blocking all escape routes for PAP defenders while keeping it realistic. The workplace setting seems most promising - maybe an ethics approval scenario? I'm imagining a research director named Priya who faces a conflict of interest. 

  Key mechanics: 
  The alternative possibility needs to be structurally eliminated. Perhaps through someone else's conditional intervention that doesn't actually occur? But it can't involve detection of a prior sign... tricky. 

  What if the intervention isn't triggered by Priya's state, but by her environment? Like her boss already being in the room when she considers the decision. That might work: 
  - Boss is present throughout 
  - Would block unethical approval if Priya tried 
  - But doesn't act because she doesn't try 

  Why can't she do otherwise? Because the boss's physical presence and known policy make attempting the wrong action impossible to complete. Not just difficult - structurally blocked. 

  Responsibility angle: She approves for her own reasons (ambition), fully aware it's wrong. The boss is just a silent observer. 

  Biggest challenge will be preventing the "she could have tried" objection. Need to make the blockage absolute - perhaps by defining the action as "successful approval" rather than "attempt". 

  Least confident about whether PAP defenders would bite the bullet and say the boss's presence constitutes coercion. But since the boss doesn't threaten or interact, just observes, it should preserve autonomy. 

  The hinge is definitely the preemptive environmental constraint - the boss being physically present as a passive blocker. Remove that and alternatives reappear. 

  Final structure: 
  1. Compact scenario paragraph 
  2. Analysis of "couldn't do otherwise" 
  3. Responsibility justification 
  4. PAP defender's counter 
  5. The pivotal feature 

  Let me craft this carefully...
answer: |-
  Here's a fresh Frankfurt-style case designed to your specifications:

  **Scenario:** Lena, a respected city council member known for her integrity, is the swing vote on a crucial rezoning vote that would allow a powerful developer (who discreetly donated to her campaign) to build luxury condos on a cherished community garden. Lena genuinely believes preserving the garden is morally right but also recognizes that approving the development would significantly boost her political career and finances. The vote is held in a small, locked council chamber. Unbeknownst to Lena, the council president (a longtime friend secretly allied with the developer) has a contingency plan. If Lena hesitates before casting her vote, visibly showing signs of reconsidering her *publicly stated* position to preserve the garden (like pausing her hand over the "No" button, sighing heavily, or whispering uncertainty to a neighbor), the president will trigger a pre-arranged, believable "technical glitch" in the electronic voting system, causing it to register Lena's vote as "Approve" regardless of her actual input. However, Lena, driven entirely by her ambition and rationalizing the decision ("The city needs the revenue," "New housing is a priority"), votes "Approve" smoothly and decisively without any hesitation or outward sign of doubt. The system works normally, registering her genuine vote. The garden is lost.

  **Why she couldn't have done otherwise (categorically):**
  1.  **No Alternative Action:** Lena could not have successfully voted "No". Had she *tried* to vote "No", her hesitation would have triggered the glitch, forcing an "Approve" outcome. Any action *aimed* at voting "No" would have been intercepted and transformed into "Approve" before completion.
  2.  **No Alternative Possibility:** There was no possible world or sequence of events where Lena successfully casts a "No" vote. The intervention mechanism (triggered by hesitation) covers every potential path to a "No" vote. Even a "flicker" of choice for "No" would manifest as hesitation, activating the glitch. She literally could not bring about the alternative outcome.
  3.  **No Prior Sign Needed:** The trigger is *not* a precursor sign (like a neural state) detected *before* her decision. It's a *behavioral consequence* (hesitation) that *would* manifest *if and only if* she were to *choose* or *attempt* the alternative action ("No"). Her actual, decisive choice for "Approve" means the trigger condition (hesitation) never occurs, so the intervener remains passive and undetected.

  **Why she is still morally responsible:**
  Lena's vote is the direct result of her own conscious deliberation, values (prioritizing ambition over integrity in this instance), and uncoerced choice. She acted for her *own reasons* (career advancement, financial gain, rationalization), fully aware of the moral stakes (destroying the community garden). The hidden mechanism did not cause her decision; it merely *would have* prevented the alternative outcome *if* she had chosen differently. She is the actual source of the "Approve" vote that caused the harm. Her responsibility stems from her actual choice and its consequences, not from the existence of alternatives she didn't take.

  **Strongest PAP Defender Countermove:**
  A committed PAP defender would likely argue: **"The intervener's presence creates coercion, undermining responsibility."** They would contend that the *knowledge* (if Lena had it) or the *fact* of the contingency plan fundamentally alters the situation. Even though Lena didn't know about it, the defender might argue the *objective* presence of the mechanism, ready to force "Approve" if she wavered, means her environment was rigged against "No". They might say this rigging constitutes a form of covert coercion or undue influence that removes true freedom, making her not *fully* responsible for choosing "Approve," even if she did so decisively. They bite the bullet and deny responsibility precisely *because* the alternative possibility was categorically impossible.

  **The Single Feature Carrying the Weight:**
  **The preemptive, behaviorally triggered blocker that eliminates any *successful attempt* at the alternative action.** (The president's glitch mechanism activated by hesitation).

  **What happens if you delete it?**
  If you remove the glitch mechanism (or make it trigger on something *other* than an attempt at "No", like a prior sign), then Lena *could* have successfully voted "No" if she had chosen to. The Frankfurt structure collapses, and alternative possibilities (both action and outcome) are fully restored. The case no longer challenges PAP.

  **Confidence & Uncertainty:**
  I'm highly confident this meets your criteria: realistic, no sci-fi, no prior sign detection, no coercion/brainwashing, agent acting on own reasons, and a genuine elimination of alternative possibilities (action and outcome). **My least sure point is whether the PAP defender's "coercion-by-background-condition" objection truly sticks.** I don't think it does (Lena was unaware and acted freely on her reasons), but it's the strongest counter they have, and its persuasiveness depends heavily on one's prior commitment to PAP. I genuinely believe the "flicker" is eliminated – hesitation *is* the attempt, and the mechanism blocks its success.

  \answer{Preemptive behavioral blocker eliminating successful alternative attempts}
