prompt: |-
  I help run a monthly philosophy discussion group that meets in a back room above a pub, and this year we're putting on an essay prize for our members; there's no course, no reading list, and the judging panel is three of us, none with a philosophy degree, so the whole thing stands or falls on the question. Last month we spent an evening on when it's acceptable to change someone's mind, and we found that a question like "when is persuasion manipulation?" just produces essays that recite the obvious answer and then stop. I'd like you to take on the role of a seasoned examiner in applied ethics — someone who has marked hundreds of scripts and can tell the difference between an answer that names a distinction and one that can actually wield it — and produce the question, a model answer, and a marking scheme. Please think carefully before you write, and begin by brainstorming the candidate ways of drawing the line between manipulation and legitimate persuasion, so that I can see two or three approaches considered and rejected before you commit to one; a tidy formula that arrives unargued is no use to me.

  The question must be answerable with no reading whatsoever, so it has to carry its own material: state the cases in full rather than gesturing at them, and don't lean on anything a candidate would have to look up. Here are the cases our members kept circling, which you should build the question around. (1) A doctor explains a treatment's risks to a frightened patient using true and complete figures, but chooses the order that flatters the safer option — out of a hundred people like you, ninety are still here in five years, rather than ten out of a hundred die. (2) A friend who knows you have been dithering about leaving your job waits until you are drunk, exhausted and hours past your bedtime, and then tells you the same true thing she could have told you on Tuesday afternoon; you resign, and you would endorse that decision sober. (3) A landlord truthfully mentions that two other couples are viewing the flat tomorrow. (4) A phone company runs a 48-hour flash sale that returns every fortnight, which everyone in your office has stopped believing in, though the deadline is always genuinely enforced. (5) An anti-smoking advertisement shows a woman in her forties dying in a hospital bed; nothing in it is false and she is not unrepresentative. Most of us thought (3) was fine and (4) was not, and could not say why, since in both the pressure comes from a fact that is true. We split badly on (1) and (2): several members thought the doctor's reordering was the most manipulative item on the list and the drunk friend the least, while others had it exactly the other way round. The question should make candidates confront that pair, and should make it impossible to answer by simply asserting that manipulation bypasses the audience's rational agency, because in every one of these cases the propositions conveyed are true, and in (2) the person ends up believing precisely what she would have arrived at on her own. I want candidates forced to say what the bypassing is supposed to consist in when nothing false has been said and no option has been taken away.

  So please give me three things. First, the essay question itself, pitched to be answered in ninety minutes by an intelligent member of the group who has done no reading, and phrased so that nobody can collect the marks by listing criteria without applying them to the cases. Second, a model answer of roughly 750 words that actually does the work: it should state a criterion precisely enough to be argued with, run that criterion through all five cases, admit honestly where it gets one wrong or has to strain, and say what it implies about a sixth case the answer invents for itself. The model answer must not cite anyone or anything — it has to stand entirely on its own reasoning, since our members have no library to check it against. Third, a marking scheme out of 20 marks built around five must-hit points, giving the marks for each, a one-line description of what a top answer does at that point that a merely competent one does not, and a note on the characteristic way candidates get each point wrong — the tempting move that looks like the point but isn't. Please make the A/B boundary turn on the argument rather than the vocabulary: naming a well-known philosopher or dropping a technical term should earn nothing by itself, and the marking scheme should say so explicitly.
reasoning: |-
  Okay, the user runs a philosophy discussion group in a pub setting and is organizing an essay prize. They need a robust essay question on distinguishing manipulation from legitimate persuasion, based on five specific cases where their group struggled to find consistent principles. 

  First, I need to understand the core challenge: the group couldn't agree on cases like the doctor's framing (case 1) or the drunk friend (case 2), despite all scenarios involving truthful statements. The user explicitly wants to avoid superficial answers that just name distinctions without applying them. 

  Hmm... The key constraints are: no required reading, must force engagement with cases 1 and 2, and cannot rely on "bypassing rationality" as a cliché since truth-telling complicates that. The marking scheme must prioritize argument over jargon.

  Brainstorming approaches to reject:
  Approach 1: Intent-based distinction (manipulator's bad faith). Why reject? Fails case 4 (phone sale) - the company likely intends to manipulate, but case 3 (landlord) may have similar intent yet feels permissible. Also, drunk friend (case 2) has good intent but feels manipulative to some.
  Approach 2: Vulnerability exploitation. Why reject? Doctor (case 1) leverages patient's fear legitimately, while drunk friend (case 2) exploits exhaustion - but both use vulnerability. Where's the line? 
  Approach 3: Information asymmetry. Why reject? All cases except anti-smoking ad (case 5) involve asymmetry, yet outcomes differ (landlord fine, phone sale manipulative). 

  Ah - settling on the "deliberative integrity" approach. It focuses on whether the persuader intentionally degrades the audience's decision-making process (e.g. by exploiting cognitive biases or transient states) while preserving truth. This explains why doctor's framing (optimizing comprehension) differs from drunk friend (weakening reasoning capacity). 

  For the essay question, I'll force comparison of cases 1/2 head-on while demanding criterion application to all cases. The model answer must show friction - e.g. admitting case 5 (ad) is borderline under this framework. 

  Marking scheme traps to highlight: 
  - Mistaking intent for mechanism (good intent doesn't absolve degraded deliberation)
  - Equating truthfulness with legitimacy (ignoring process corruption)
  - Treating cases in isolation without cross-comparison
answer: |-
  ## Essay Question  
  **"In all five cases below, true information is used to influence a decision. When does such influence become manipulation? Develop a clear criterion that distinguishes legitimate persuasion from manipulation *specifically in truthful contexts*. Your criterion must: (a) explain why cases like the Doctor (1) and Landlord (3) are legitimate while the Phone Sale (4) is manipulative; (b) resolve the disagreement over the Drunk Friend (2) versus the Doctor (1); and (c) address the Anti-Smoking Ad (5). Test your criterion by applying it to a sixth case of your own invention."**  

  *(Cases restated for clarity)*  
  1. **Doctor**: Presents identical survival rates for a medical procedure as "90% survive" (emphasizing safety) instead of "10% die" to a frightened patient.  
  2. **Drunk Friend**: Waits until you’re exhausted and intoxicated to persuade you to quit your job—a decision you’d endorse sober.  
  3. **Landlord**: Truthfully mentions competing interest in a rental property.  
  4. **Phone Sale**: Runs "48-hour flash sales" every fortnight (enforced but predictable), knowing customers dismiss them as fake.  
  5. **Anti-Smoking Ad**: Shows a truthful, representative depiction of a dying smoker.  

  ---

  ### Model Answer (750 words)  
  **Thesis**: Truthful influence becomes manipulation when it *intentionally degrades the audience’s capacity for reasoned reflection* without justification by urgency or the audience’s own goals. Legitimate persuasion optimizes understanding; manipulation optimizes compliance by exploiting cognitive or contextual vulnerabilities.  

  **Criterion**: An act is manipulative if:  
  (i) It *deliberately impairs* the target’s rational processing (e.g., by inducing fatigue, exploiting bias, or overwhelming cognition); AND  
  (ii) This impairment is *unnecessary* for conveying truth or achieving the target’s own ends.  

  **Application to Cases**:  
  - **Doctor (1)**: *Legitimate*. Framing "90% survive" clarifies rather than impairs: it mitigates fear (a barrier to processing facts) *to aid* comprehension. The patient’s goal (informed choice) is served. No rational capacity is degraded.  
  - **Drunk Friend (2)**: *Manipulative*. Timing exploits exhaustion/alcohol to *induce impulsivity*, bypassing reflective capacity. Though the decision is "correct," the friend *chose* a moment when reasoning is impaired. Urgency was artificial (could wait).  
  - **Landlord (3)**: *Legitimate*. Mentioning competition provides relevant data for a time-sensitive decision. It doesn’t exploit cognitive bias or impairment; it merely informs.  
  - **Phone Sale (4)**: *Manipulative*. The fake urgency exploits *habituation to lies* and scarcity bias. Customers dismiss it *because* they know it’s deceptive—yet the company leverages that dismissal to surprise them. It impairs judgment by weaponizing distrust.  
  - **Anti-Smoking Ad (5)**: *Ambiguous but defensible*. Shocking imagery may overwhelm reflection, but if smoking’s risks require emotional impact to register (aligning with health goals), it’s justified. If it *only* triggers panic without aiding understanding, it’s manipulative.  

  **Resolution of Doctor vs. Drunk Friend**:  
  The Doctor *enhances* rational agency by reducing noise (fear); the Drunk Friend *undermines* it by adding noise (impairment). The difference isn’t outcome or intent—it’s whether the tactic *corrupts the process* of deliberation. Persuasion respects the mind’s machinery; manipulation hijacks it.  

  **Invented Case & Test**:  
  **Charity Collector (6)**: At a train station, a fundraiser shouts donations requests at commuters rushing to catch trains, using accurate poverty statistics.  
  - *Assessment*: Likely manipulative. Exploits stress/time pressure to trigger impulsive giving, impairing reflection. Urgency is external (trains), but the fundraiser *chooses* this context to bypass deliberation. Justification weak unless giving *requires* immediacy (it doesn’t).  

  **Flaw in the Criterion**:  
  It struggles with the Anti-Smoking Ad (5). If the audience *needs* emotional shock to grasp consequences (serving their health goals), it’s legitimate. But if the emotion *replaces* understanding (e.g., using irrelevant trauma), it’s manipulation. Context matters—this line is blurry.  

  **Conclusion**:  
  Manipulation isn’t about lies or outcomes, but *process corruption*. The Drunk Friend (2) and Phone Sale (4) degrade reasoning; the Doctor (1) and Landlord (3) don’t. Persuasion treats the audience as a reasoning partner; manipulation treats them as a system to be gamed.  

  ---

  ### Marking Scheme (20 marks)  
  **A/B Boundary (14/20)**: Turns on *rigorous application of a precise criterion* to all cases, not vocabulary. Citing philosophers/terms earns 0 marks.  

  | **Marks** | **Must-Hit Point**                                                                 | **Top-Scoring Move (A/A*)**                                                                                              | **Common Failure (What Looks Like the Point But Isn’t)**                                                                 |
  |-----------|------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|
  | **4**     | **Clear, actionable criterion** addressing truthful influence.                    | Defines a *mechanism* (e.g., degradation of reasoning) — not just outcomes, intent, or "bypassing reason" vaguely.       | Asserting "manipulation is covert/self-serving" without linking to deliberation. (Ignores cases like Drunk Friend’s "good" intent). |
  | **4**     | **Resolution of Doctor (1) vs. Drunk Friend (2)** using the criterion.            | Contrasts *how* each case affects cognition: one reduces noise, one adds it. Explains why intent/outcome alone fail.     | Claiming "Doctor is worse because health is serious" or "Drunk Friend is fine because sober-you agrees." (Misses process focus). |
  | **4**     | **Consistent application to all 5 cases**, including Anti-Smoking Ad (5).         | Admits ambiguity in (5) and *tests* the criterion against it. Treats (3)/(4) as a revealing contrast, not isolated.      | Listing case-by-case judgments without cross-comparison. (e.g., "Landlord is fine, Phone Sale is bad" with no unifying principle). |
  | **4**     | **Sixth case invention and analysis** that probes the criterion’s limits.         | Creates a case where the criterion *strains* (e.g., exploiting "positive" emotions) and honestly evaluates it.           | Adding a case merely to "prove" the criterion works. (No pressure-testing).                                              |
  | **4**     | **Self-critique**: Identifies flaws in own criterion and adjusts or concedes.     | Shows *why* a case (e.g., the Ad) is hard, and whether the criterion needs refinement (not just "it’s subjective").      | Handwaving ("this is complex") without pinpointing where the criterion struggles.                                         |

  **Allocation**:  
  - 16–20: Precise criterion + rigorous case-driven argument + self-critique.  
  - 12–15: Functional criterion + uneven application + superficial self-critique.  
  - 8–11: Vague/unworkable criterion + case descriptions without systematic analysis.  
  - <8: Assertions without a criterion, or ignores cases.  

  ---

  **Why this works for your group**:  
  - The criterion (*deliberative degradation*) emerges from your cases’ tensions, not theory. It forces engagement with (1) vs. (2).  
  - The model answer demonstrates "wielding" a distinction: It admits friction (case 5) and invents a test case.  
  - The marking scheme penalizes jargon and rewards *applied reasoning*, mirroring your pub-discussion ethos.  
  - It avoids "obvious" answers by focusing on *process*—truthful content alone can’t rescue manipulative methods.  

  Let me know if you’d like refinements to the cases or deeper traps for the marking scheme.
