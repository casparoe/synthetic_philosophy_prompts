prompt: |-
  I run the population-ethics desk in the cost-benefit shop of a mid-sized government: four analysts, no philosopher on staff, roughly forty rules a year that change how many people there are or when they are born — a pronatalist tax credit, a road-safety standard, a screening program, an immigration measure. We score everything with a value of a statistical life and a QALY framework, and I have come to suspect that this quietly commits us to the repugnant conclusion without our ever having decided to. I want a decision procedure rather than another round of debate.

  Please write one my team can run in two hours per rule: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a finding that the rule is bad, where it must hand the decision to the deputy director because the question is one of values rather than facts, and where our own existing practice — a chain of pairwise judgments we have already made, each of which seemed harmless on its own — has to break if we are to avoid the repugnant conclusion. The procedure should force us to state in writing any critical level, or comparable parameter, that it depends on, so that the number is auditable and binds our later decisions.

  Then run it on three rules: a tax credit whose additional children would have lives that are modestly worth living; a safety standard that saves lives and, as a side effect, lowers fertility; and a cheap treatment for a mild chronic condition. Include the case where the procedure tells me something I will not like, and say plainly what it cannot settle.
reasoning: |-
  Okay, let me start by understanding the user's problem. They run a population-ethics desk in a government cost-benefit analysis shop. Their team handles about forty rules a year that affect population size or birth timing—like tax credits, safety standards, screening programs, and immigration measures. Currently, they use VSL and QALY frameworks, but they suspect this leads them unknowingly towards the repugnant conclusion. They want a decision procedure to avoid this without lengthy debates.

  First, I need to recall what the repugnant conclusion is. It's a paradox in population ethics where improving total happiness can lead to preferring a huge population with minimally positive lives over a smaller, happier one. The user's existing methods might be adding lives just above neutrality without considering this ethical pitfall.

  The user's explicit needs are clear: a practical, time-bound procedure (under 2 hours per rule) that fits into their workflow. They need specific steps with clear decision points, places where the rule is rejected, and points where higher-ups must decide on value judgments. They also want parameters documented for auditability.

  But there are deeper needs here. The team lacks a philosopher, so the procedure must be accessible to analysts without ethics expertise. They want consistency and transparency to avoid hidden ethical commitments. The examples provided (tax credit, safety standard, treatment) show they need concrete applications. The mention of "something I will not like" indicates they expect pushback, probably when the procedure challenges existing practices.

  I should design a procedure that's structured and efficient. Breaking it into stages makes sense: pre-screening, threshold tests, total assessment, and documentation. Each stage needs clear questions to guide analysts. The key is to identify when a rule adds lives near neutrality, which might trigger the repugnant conclusion. 

  The critical level (C) is crucial here. Setting C above zero avoids valuing barely worthwhile lives. But determining C isn't up to analysts—it's a value judgment for leadership. The procedure must flag when C comes into play and require explicit documentation. 

  For the tax credit example, adding lives above zero but below C would be problematic. The safety standard reduces population; since it doesn't add low-value lives, it passes. The chronic treatment adds QALYs without affecting births, so it's safe. The challenge comes when the tax credit forces the team to confront their C value, which might be uncomfortable if they've been implicitly using C=0.

  I need to ensure the procedure stops early if a rule fails a test, saving time. Also, documenting all parameters (like C) ensures transparency and future consistency. The deputy director's involvement is necessary for value judgments, keeping analysts focused on application rather than policy.

  Lastly, the procedure should highlight when existing practices conflict with avoiding the repugnant conclusion. If analysts have been using C=0, switching to a positive C breaks that chain. This needs to be explicit so the team understands the shift required.
answer: |-
  Here’s a practical decision procedure for your team, designed to run in ≤2 hours per rule. It forces explicit ethical parameterization, flags repugnant conclusion (RC) risks, and documents value judgments for audit trails.

  ---

  ### **Population Ethics Screening Protocol (PESP)**
  **Time Allotment**: 15 min/step (total 1h45m)  
  **Outputs**: "Approve," "Reject," or "Elevate to Deputy Director (DD)" with documented rationale & parameters.

  #### **Step 1: Pre-Screen for Population Effects**
  *   **Question**: *Does this rule change the number or timing of births by ≥0.1% of the affected cohort?*  
  *   **Sufficient Answer**: Quantitative projection from demography/epidemiology models.  
  *   **Stop if**: No material population change → **Approve** (proceed to standard CBA).  
  *   **Elevate if**: Uncertainty exceeds ±50% of estimate → DD judges evidence quality.

  #### **Step 2: Threshold Test**
  *   **Question**: *Are added/subtracted lives projected to have wellbeing *below* a critical level **C**? (C ≥0)*  
  *   **Sufficient Answer**: Compare projected QALY/patient-year of affected lives against **C**.  
  *   **Reject if**: Added lives < **C** or subtracted lives > **C** → **RC risk: Adding "barely worth living" lives**.  
  *   **Elevate if**: **C** is undefined → DD must set **C** (documented as Policy Parameter PP-001).

  #### **Step 3: Asymmetry Test**
  *   **Question**: *Does the rule treat losses and gains of equivalent wellbeing symmetrically?*  
  *   **Sufficient Answer**: Check if VSL/QALY values for mortality/morbidity are identical for present vs. future people.  
  *   **Elevate if**: Asymmetry detected (e.g., discounting future lives but not QALYs) → DD must approve asymmetry justification (audit doc AD-01).

  #### **Step 4: Total Wellbeing Assessment**
  *   **Question**: *Does the rule increase *critical-total* wellbeing? (Sum of [Wellbeing - **C**] for all affected lives)*  
  *   **Sufficient Answer**: Cost-benefit model using **(QALY - C)** as value metric for existence.  
  *   **Reject if**: Δ(Critical-total wellbeing) < 0 → **Inefficiency or net harm**.  
  *   **Elevate if**: Trade-offs involve rights/non-welfarist values → DD resolves conflict.

  ---

  ### **How This Breaks Existing Practice**
  Your current framework (VSL + QALY) implicitly assumes:
  1. **C = 0** (Any life >0 QALY is a "gain"),
  2. **Symmetry** (Creating a 70-QALY life = saving a 70-year-old),  
  3. **Additivity** (Wellbeing sums without limit).  

  PESP forces **explicit C > 0** (Step 2) and rejects pure additivity (Step 4). To avoid RC, you must break the chain at **C=0** – accepting that some positive-QALY lives are net negative when **C > 0**.

  ---

  ### **Application to Cases**
  *(Assume C = 10 QALYs/life as illustrative policy parameter)*  

  #### **Case 1: Pronatalist Tax Credit**  
  *   Adds 5,000 births. Projected QALY: 60 (decent but below median 75).  
  *   **Step 1**: Pass (adds births).  
  *   **Step 2**: Lives added at 60 QALY > **C=10** → Pass.  
  *   **Step 3**: Symmetry? VSL same for present/future → Pass.  
  *   **Step 4**: Critical-total Δ = 5,000 × (60 - 10) = +250,000 → **Approve**.  
  *   **What you won't like**: If **C=60** (defensible for RC avoidance), added lives = (60-60)=0 → Reject. **DD must justify C**.

  #### **Case 2: Road Safety Standard**  
  *   Saves 200 lives/year (QALY: 75), but reduces births by 100/year (QALY: 70).  
  *   **Step 1**: Pass (reduces births).  
  *   **Step 2**: No lives added < **C** → Pass.  
  *   **Step 3**: Asymmetry? Your VSL likely discounts future lives → **Elevate: DD must confirm future-life valuation**.  
  *   **If DD approves symmetry**: Step 4 Δ = [200×(75-10)] + [100×(70-10)*(-1)] = +13,000 - 6,000 = +7,000 → **Approve**.

  #### **Case 3: Cheap Treatment for Mild Chronic Condition**  
  *   Adds 0.1 QALY to 1M people. No fertility impact.  
  *   **Step 1**: No population change → **Approve** (proceed to standard CBA).  

  #### **Case 4: Problematic Tax Credit (Your Uncomfortable Result)**  
  *   Adds 50,000 births at 15 QALY (modest but >0). **C=10** policy.  
  *   **Step 1**: Pass.  
  *   **Step 2**: 15 > **C=10** → Pass.  
  *   **Step 4**: Critical-total Δ = 50,000 × (15-10) = +250,000 → **Approve**.  
  *   **Why uncomfortable?** Approves large population with low wellbeing (RC risk). **PESP cannot eliminate RC** without higher **C**. Solution: DD must set **C > 15** to reject, accepting that some lives above zero are net negatives.

  ---

  ### **What PESP Cannot Settle**
  1. **The value of C**: Must be set by DD (values decision).  
  2. **Non-welfarist rights** (e.g., "No one should live below 50 QALY").  
  3. **Catastrophic risks** or infinite horizons.  

  ---

  ### **Implementation Kit**
  - **Templates**: Standardized forms for each step.  
  - **Parameter Registry**: Digital log of **C**, asymmetry rules, DD rulings.  
  - **Training**: 4-hour workshop on identifying population effects & RC logic.  

  This procedure makes implicit tradeoffs auditable while containing philosophical scope to 1-2 value parameters per rule. It forces the break at **C=0**—where your existing practice hides the RC commitment.
