answer: |-
  ### Coordination Protocol Review Procedure  
  This procedure, grounded in game theory and epistemic logic (the philosophy of knowledge), helps you verify whether a coordination rule or protocol can achieve stable alignment. It focuses on **conventions** (self-sustaining regularities) and **common knowledge** (I know that you know that I know, ad infinitum). Use this checklist in design reviews.

  ---

  #### **Step 1: Identify Alignment Dependencies**  
  **Question:** *Do parties’ actions depend on what others do?*  
  - **Check:** For each party, does their preferred action change based on others’ choices?  
  - **Pass:** Yes (e.g., Team A prefers rule X only if Team B uses X).  
  - **Fail/Stop:** No (not coordination; hand to domain experts).  
  - **Output:** Map each party’s actions and preferences (e.g., payoff matrix).  

  #### **Step 2: Verify Self-Sustaining Conventions**  
  **Question:** *Does every party prefer to conform if others conform?*  
  - **Check:** For each rule/action, if all others follow it, is it optimal for a party to follow it too?  
  - **Pass:** Yes (convention exists).  
  - **Fail:** No (e.g., a party benefits from deviation; hand to leadership to resolve incentives/authority).  

  #### **Step 3: Distinguish Mutual vs. Common Knowledge**  
  **Question:** *Does coordination require "I know that you know..." indefinitely (common knowledge) or a finite level (mutual knowledge)?*  
  - **Check:**  
    - **Mutual knowledge (level *n*):** Sufficient if parties only need *n* levels of "I know you know" (e.g., 2-way handshake).  
    - **Common knowledge:** Required if parties must act *only when certainty is infinite* (e.g., "A proceeds only if certain B will proceed, and B requires the same certainty about A").  
  - **Pass:** Requirement is clear.  
  - **Fail/Stop:** Ambiguous; redesign to clarify knowledge dependencies.  

  #### **Step 4: For Common Knowledge, Avoid Message Handshakes**  
  **Question:** *Can we replace message exchanges with a focal point or authority?*  
  - **Check:**  
    - Common knowledge is **impossible via finite messages** (each ack needs its own ack; infinite regress).  
    - Use **focal points** (salient default rules, e.g., "alphabetically first option") or **authorities** (e.g., leader, configuration server) to shortcut knowledge gaps.  
  - **Pass:** Focal point/authority is feasible.  
  - **Fail:** No alternatives (redesign to use mutual knowledge or tolerate uncertainty).  

  #### **Step 5: For Mutual Knowledge, Design *n*-Level Handshake**  
  **Question:** *What mutual knowledge level *n* is needed, and how do we achieve it?*  
  - **Check:**  
    - Level *n* requires *n* message hops (e.g., level 2: A→B, B→A).  
    - Handle message loss: Add **timeouts + retries**, and define **fallback actions** (e.g., abort if no ack after *k* retries).  
  - **Pass:** Protocol achieves level *n* with failure handling.  
  - **Fail:** Unreliable channels or insufficient *n* (redesign or accept risk).  

  #### **Step 6: Final Viability Check**  
  **Question:** *Can parties act confidently with the knowledge they have?*  
  - **Check:** Simulate message loss scenarios. Ensure no party acts without requisite knowledge.  
  - **Pass:** All parties act correctly under defined failures.  
  - **Fail:** Ambiguity in edge cases (simplify or escalate).  

  ---

  ### **Run the Procedure on Your Cases**  
  #### Case 1: Two Teams, Shared Tie-Break Rule  
  - **Step 1:** Alignment dependencies exist (both teams need identical rules).  
  - **Step 2:** Self-sustaining convention exists (both prefer matching, regardless of rule). **Pass.**  
  - **Step 3:** Requires **mutual knowledge level 1** (teams only need to know the chosen rule).  
  - **Step 4:** Not applicable (common knowledge not required).  
  - **Step 5:**  
    - Use 2-way handshake: Team A proposes rule → Team B acks.  
    - Handle loss: Timeout + retry; if no ack, use default rule (e.g., "rule X").  
  - **Step 6:** Parties act once rule is known. **Viable.**  
  - **Output:** Protocol works with 2-way handshake + default fallback.  

  #### Case 2: Acknowledge-the-Acknowledgement Protocol  
  - **Step 1:** Alignment dependencies exist (A proceeds only if B proceeds, and vice versa).  
  - **Step 2:** Self-sustaining convention exists (both prefer mutual action). **Pass.**  
  - **Step 3:** Requires **common knowledge** (A needs infinite certainty B will act; B needs same).  
  - **Step 4:**  
    - **Messages cannot solve this.** Adding acks (A→B→A→B...) creates infinite regress.  
    - **Solution:** Use **focal point** (e.g., "always proceed if message received") or **authority** (e.g., coordinator).  
  - **Step 5:** Not applicable (common knowledge needed).  
  - **Step 6:** Without focal point/authority, parties stall or misalign. **Not viable via messages.**  
  - **Output:** Stop message escalation. Use:  
    - **Focal point:** "Proceed if you receive any message from the other party within timeout." (Tolerates uncertainty.)  
    - **Authority:** Designated service broadcasts "commit" to both.  

  ---

  ### **What This Procedure Cannot Decide**  
  1. **Rule Selection:** Which tie-break rule (X/Y) to pick (use focal points like "alphabetical first").  
  2. **Preferences/Incentives:** If parties disagree on rules (Step 2 fails), leadership must resolve.  
  3. **Authority Assignment:** Who should be the coordinator? (Hand to org governance.)  
  4. **Byzantine Failures:** Malicious actors are out of scope (use consensus protocols e.g., Paxos).  
  5. **Probabilistic Guarantees:** It assumes "perfect" knowledge; for probabilistic solutions (e.g., "99% certainty"), use risk analysis.  

  **Time Commitment:** This review runs in **<30 minutes** with prepared action/preference maps. The architecture lead signs off on Steps 2 (conventions) and 4 (focal points/authority). For complex cases, escalate during Step 4.  

  **Final Advice:** When common knowledge is needed, *never* rely on message chains. Use focal points (salient defaults) or authorities. This is not an engineering limitation—it’s a fundamental result in game theory (see "coordinated attack problem").
