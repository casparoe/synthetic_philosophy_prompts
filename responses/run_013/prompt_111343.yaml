  1. **Convention**: A regularity in behavior that is self-sustaining because each party prefers to conform given that the others do.
  2. **Mutual Knowledge**: A fact F is mutual knowledge up to level n if everyone knows F, everyone knows that everyone knows F, and so on up to n levels. But this is finite.
  3. **Common Knowledge**: A fact F is common knowledge if everyone knows F, and everyone knows that everyone knows F, and so on ad infinitum. This is the strongest form and is required for many coordination problems.

  The procedure will help us check if a coordination rule or protocol relies on common knowledge and whether our design achieves it. We note that common knowledge is difficult to achieve in practice because of the possibility of communication failures (any message can be lost). Therefore, we must often rely on weaker forms (like mutual knowledge up to a finite level) or alternative mechanisms (focal points, authorities).

