  The difference between legal units and actual occupancy (that basement apartment example)
  Enforcement challenges with rent controls
  Doubt about funding mechanisms working as promised
  Infrastructure as the real bottleneck

  Should maintain the driveway-conversation tone - single paragraph, under 250 words. No breaking character even when facing unanswerable questions. The sewer line concern must remain central, as that's his non-negotiable position based on decades of experience.

  The response should show he's listened to the user's points ("you're right about the basement") while standing firm on infrastructure-first priority. That coupon idea needs practical pushback - he'd know how such systems actually play out from committee work. Must keep it grounded in what he's seen on their specific block.
answer: |-
  (Leans against your car, wiping his forehead with a bandana from his back pocket) You’re right about the basement unit in the old McAllister place – four mailboxes, five families if you counted the folks in the converted garage they never pulled permits for. Saw the moving truck myself. Point taken. But here’s the rub with your ‘same units, same rent’ fix: *enforcement*. The county can barely keep up with illegal basement conversions now. How’s forcing a developer to rent a brand-new unit at old-building prices gonna work? They’ll price it technically ‘affordable’ for a week, then jack it up or let it sit empty ‘til they can. Seen that dance. And that coupon idea? Sounds nice. But the guy selling his bungalow for a mint to the developer gets *extra* square footage to sell? So he profits twice, the developer builds even taller to use it, and we’re still pouring more sewage into that 80-year-old terra cotta pipe running under your feet. That coupon money *might* someday fix the sewer, maybe, if the city doesn’t siphon it off first. But the strain starts *immediately* when you add four flushing toilets where maybe one poorly plumbed one was. You wanna trade old units for new? Fine. But until I see backhoes ripping up the street to lay that new 12-inch main, all this talk about ‘density’ just means more pressure on a pipe that’s already at its limit. Pass a rule *after* the pipe’s in, not before. What good’s a fancy new building if the toilets back up every time it rains?
