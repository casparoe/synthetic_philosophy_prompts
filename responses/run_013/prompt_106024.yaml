answer: |-
  ## Memorandum: Standing Committee on Language and Usage - Final Decision on Style Guide Revisions

  **Date:** [Date of Circulation - Prior to Thursday Meeting]
  **To:** Members of the Standing Committee on Language and Usage
  **From:** The Standing Committee on Language and Usage
  **Subject:** Final Decision on Proposed Revisions to University Style Guide: False Generics and Re-substitution Exercises

  ---

  **1. Recommendation (Approx. 120 words)**
  The Committee adopts the subcommittee's proposed revision on false generics, mandating singular *they* as the default third-person singular pronoun for unspecified persons in all university documents, effective immediately upon final guide publication (target: August 1). Terms *guys* (for mixed groups) and *freshman* require further study; their use is discouraged pending a report due December 1. Concerning re-substitution exercises (Part Two), tier (iii) usage (parody/satire voicing a position not held by the author) is **permitted** in courses satisfying the writing requirement, **subject to mandatory conditions**. The Writing Program's specific exercise may continue, effective Fall term, provided it incorporates both a robust prefatory frame *and* a viable opt-out alternative assignment for students objecting to voicing specific categories. Departments must develop implementation frameworks by October 15.

  **2. The Question Before Us (Approx. 140 words)**
  This revision addresses two contested areas. First, whether to mandate singular *they* as the default third-person singular pronoun for unspecified persons and how to handle terms like *guys* and *freshman*, deemed "false generics" due to their implied default groups. Second, whether to prohibit re-substitution exercises (like the "Person Paper" flip) in writing-requirement courses. The core dispute centers on Tier (iii) usage: permitting students to voice, in parody or satire, positions they do not hold, using potentially offensive language attributed to a fictional speaker. We must determine if Tier (iii) is admissible and, if so, under what criteria (legibility and/or non-appropriation), balancing pedagogical value against risks of harm and misinterpretation, while addressing specific objections raised by students and faculty regarding the existing exercise.

  **3. What the Exercise Does (Approx. 290 words)**
  The re-substitution exercise aims to foster critical linguistic awareness beyond what prescriptive style rules alone can achieve. By requiring students to systematically swap the default category in a source text (e.g., replacing gender terms with racial terms, or religion for gender), the exercise forces a visceral confrontation with how language encodes and naturalizes power imbalances. Students experience firsthand how defaults function: what feels neutral when applied to the dominant group becomes jarring and revealing when applied to another. The "flip" demonstrates that the perceived neutrality of terms like *mankind* or *he* is contingent, not inherent; it depends entirely on the reader unconsciously accepting one group as the norm.

  For the trick to work, the reader must momentarily inhabit the perspective of the group being othered by the newly imposed default. This requires recognizing the satirical frame – that the piece is deliberately adopting a voice to critique, not endorse, the default logic. The pedagogical goal is metacognition: students learn to identify default assumptions embedded in language, understand the cognitive and social mechanisms by which they operate, and critically evaluate the impact of linguistic choices. A style rule prohibiting "man" teaches *what* to avoid; this exercise seeks to teach *why* such defaults are problematic and how they function socially, fostering deeper, transferable analytical skills applicable to diverse contexts of language and power.

  **4. The Case for Prohibition (Approx. 290 words)**
  The strongest argument for prohibiting Tier (iii) exercises, particularly the re-substitution flip, rests on the unacceptable risk of harm and the compromised educational environment it creates. Regardless of pedagogical intent, requiring students to generate text using language associated with real-world bigotry – even within a satirical frame – forces them to reproduce harmful speech. This act can be deeply distressing for students belonging to targeted groups, effectively compelling them to weaponize language against their own identity or that of others as a condition of academic evaluation. The recent incident starkly illustrates the inherent danger: decontextualized material, stripped of its satirical frame, is easily misread as genuine hate speech, causing reputational damage to the individual student and the institution, and potentially inciting real-world hostility. This risk is amplified in the digital age.

  Furthermore, the argument that "intent" or "critical framing" neutralizes the harm is insufficient. The exercise places an unreasonable burden on the student author to ensure every conceivable reader, acting in good faith or malice, will correctly interpret the complex satirical frame without fail – an impossible standard. It also places instructors in the untenable position of grading work that could legitimately cause distress to other students or violate community standards. Critically, the pedagogical goal of exposing defaults does not inherently require students to *generate* the offensive language themselves; alternative methods exist that achieve similar learning outcomes without forcing students into the role of perpetrator, even hypothetically, or exposing them and their work to potential misuse.

  **5. The Case for Keeping It, With Conditions (Approx. 290 words)**
  The strongest argument for retaining Tier (iii) exercises, under stringent conditions, emphasizes their unique and irreplaceable pedagogical power in developing critical consciousness about language. Simply learning rules about avoiding "man" or "he" is superficial; this exercise forces an *embodied understanding* of how linguistic defaults function to marginalize. The visceral discomfort experienced when a student's own identity group is substituted as the absurd default is precisely the point – it replicates the alienation felt by non-dominant groups daily, fostering genuine empathy and insight that abstract discussion cannot match. Banning the exercise surrenders a potent tool for combating linguistic bias because it makes students uncomfortable; discomfort, when pedagogically managed, is often a catalyst for profound learning about power structures.

  Proponents argue that the recent incident highlights implementation flaws, not an inherent flaw in the concept. A robust, *mandatory* prefatory frame, integrated into the assignment itself and impossible to separate from the student's text, addresses the legibility concern. The non-appropriation criterion is crucial: students should never be compelled to voice hatred targeting their *own* identity group or another group they do not belong to in a way that constitutes harmful appropriation. Providing a meaningful, equally rigorous alternative assignment respects student autonomy and mitigates the coercion concern. Used correctly, the exercise doesn't teach students to *use* slurs or defaults uncritically; it teaches them to *deconstruct* them with unparalleled effectiveness, equipping them to be more critical consumers and producers of discourse in a world saturated with coded language and implicit bias.

  **6. Decision and Operative Criteria (Approx. 340 words)**
  The Committee rules that Tier (iii) usage (parody, satire, historical ventriloquism, fictional speakers voicing positions not held by the author) **is admissible** in university coursework, including courses satisfying the writing requirement. **However, its use is strictly conditional.** Both the Legibility Test and the Non-Appropriation Test are adopted as mandatory governing criteria for assignments involving Tier (iii) language in writing courses:

  1.  **Legibility Test:** The satirical or critical frame must be *intrinsically legible* within the student's submitted work itself. A reader encountering the text without prior knowledge of the assignment or the author's intent must be able to discern the critical purpose and frame from cues within the text or an inseparable prefatory statement. Reliance solely on external assignment sheets or oral instructions is insufficient.
  2.  **Non-Appropriation Test:** Assignments must not require a student to write in the voice of a category targeting their *own* identity group in a manner that causes foreseeable harm or distress. Nor may they require a student to write in the voice of a category they do *not* belong to if doing so constitutes harmful appropriation or places the student's work at significant risk of being decontextualized and used as evidence *for* the very view being critiqued. A viable, equally rigorous alternative assignment must be offered to any student who objects to the specific category substitution required.

  **Application to the Writing Program Exercise:** The specific re-substitution flip exercise may continue, provided:
  *   A robust, mandatory prefatory frame is an integrated, inseparable part of *every* student submission.
  *   The exercise guidelines explicitly prohibit substitutions targeting categories where harm based on non-appropriation is foreseeable and high-risk (specific guidance to be developed by the Writing Program).
  *   A meaningful, approved alternative assignment is always available without penalty.

  **Impact on Part One (False Generics):** The controversy surrounding the exercise underscores the persistent challenge and power of linguistic defaults. Mandating singular *they* actively disrupts the masculine default, aligning with the pedagogical goal of the exercise. While terms like *freshman* and *guys* also function as defaults, their revision requires broader consultation considering common usage and alternatives; they are remanded for specific study and recommendation, separate from the core Tier (iii) decision.

  **7. Implementation (Approx. 90 words)**
  The Writing Program Director, in consultation with department chairs offering writing-requirement courses, shall revise the re-substitution exercise guidelines and develop a framework for implementing the Legibility and Non-Appropriation criteria across relevant courses by **September 1**. All departments housing writing-requirement courses must develop and submit their implementation plans for Tier (iii) assignments to the Committee by **October 15**. The Committee will review compliance, assess the effectiveness of the new safeguards, and evaluate any incidents related to Tier (iii) usage in a report due **May 30** of the following academic year.

  ---
