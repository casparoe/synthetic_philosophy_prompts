prompt: |-
  I have a set of verdicts about which higher-level, symbol-ish items do real causal work, and I want to know whether a single principle captures them. The backdrop is the careenium picture: an arena of countless mindless simmballs whose collisions implement something that can be described as wanting things and acting. I take the point of that picture to be that the higher-level description is not automatically a fiction, so I am not moved by the thought that the simmballs do all the pushing anyway. I grant that the simmball-level dynamics are complete, and I still think some higher-level items push the substrate around and others do not. Here are my verdicts.

  1. Thermostat. The dial setting genuinely causes the furnace to fire. The thermostat's believing the room is cold does no causal work, and belief-talk there is a ladder to be thrown away.
  2. Chess engine. The engine's wanting to control the center is a real cause of the move it makes, and not merely a summary: you cannot recover the explanation at the transistor level without losing it.
  3. Ant colony. When a quorum of scouts reports a good site and the colony migrates, the colony's decision is a real cause of the migration, though no ant decided anything.
  4. Wheat market. That the market decided wheat should be cheaper is a summary and not a cause; but the price falling is a cause of farmers planting less.
  5. Gene. The gene's interest in being copied is bookkeeping for selection, not a cause of anything.
  6. Species. Trying not to go extinct causes nothing; selection filters, it does not push.
  7. Motorway jam. A jam that propagates backwards is a real thing and a real cause of the braking behind it, even though each driver responds only to the car ahead.
  8. Intention. An intention to raise one's arm is a real cause. Baseline.

  The two pairs I cannot square are 2 against 5, both intentional idioms applied to mindless things, and 3 against 4, both aggregates whose decisions are nothing over and above the parts. I have been working with the principle that a higher-level item is a cause when it is multiply realizable and manipulable, but the gene's interest is multiply realizable and manipulable (change the copying rate and the effect follows), so that principle keeps 5, which I will not accept.

  So: is there a principle that keeps all eight? If the only principle that keeps all eight is baroque, give me the simpler one and say which verdict it forces me to drop. State the principle precisely, with each clause tied to the case that forces it; then say what it predicts for two cases I have not ruled on, an immune system that remembers a pathogen and a language model that believes Paris is in France; then say plainly which of my verdicts you take to be the mistake.

  Lead with your bottom line in your first sentence, then give the reasoning. No preamble, no restating of my cases or my question, and no survey of what various philosophers have said.
reasoning: |-
  Hmm, the user is presenting a complex philosophical problem about causation in higher-level systems, with eight specific verdicts they want to reconcile under a single principle. They're working within the "careenium" framework - that mental states emerge from physical interactions (like simmballs colliding) but can still have real causal power.

  Looking at their verdicts: They grant that physical-level dynamics are causally complete, yet insist some higher-level descriptions are genuinely causal while others are merely descriptive. The conflicting pairs are 2 vs 5 (both intentional idioms for non-conscious systems) and 3 vs 4 (group decisions). Their attempted "multiple realizability + manipulability" principle failed because it validated the gene's "interest" (verdict 5) which they reject as causal.

  I need to find a unified principle that respects all eight judgments. The thermostat's dial setting causes furnace ignition, but its "belief" doesn't; a chess engine's desire genuinely causes moves; an ant colony's decision causes migration while the wheat market's "decision" doesn't cause price drops; genes don't have causal interests; traffic jams cause braking; intentions cause actions.

  The key tension is between emergence and illusion. For the chess engine (2), the intentional description seems irreducible - you can't explain its move selection purely at transistor level without losing why it chose that move. Whereas for the gene (5), "interest" is just an evolutionary accounting term with no forward causal power. Similarly, ant colonies (3) exhibit emergent decision-making that causes migration, but market "decisions" (4) don't cause price changes - only actual transactions do.

  I think the unifying thread is whether the higher-level property has counterfactual control over the substrate. Specifically: A higher-level item H is a genuine cause if:
  - There exists a stable algorithm A (implemented by the substrate) that uses H as an input variable to determine outputs
  - Changes to H would systematically alter substrate behavior via A, even while holding fixed other substrate states
  - This dependency holds robustly across relevant physical realizations

  This captures why thermostat dials (1) cause furnace firing: dial position is an input to the control algorithm. Chess engines (2): "desire to control center" is a variable in its evaluation function. Ant colonies (3): quorum sensing triggers migration via fixed behavioral routines. Traffic jams (8): jam location is a propagating signal in driver response algorithms. Intentions (8): motor control systems execute intention-representing states.

  Meanwhile, thermostat "belief" (1) fails because it's not an algorithmic input - just an interpretation. Gene "interests" (5) aren't algorithm inputs; selection acts on effects, not interests. Market "decisions" (4) aren't inputs to price-setting mechanisms. Species "trying" (6) doesn't trigger adaptations; selection filters ex post facto.

  For new cases:
  - Immune memory: Would qualify as causal (like thermostat setting) since antigen patterns are algorithmic inputs for antibody production.
  - Language model "belief": Would not be causal (like thermostat belief) because "Paris in France" isn't a variable in its prediction algorithm - just an interpretative label.

  And the verdict to drop? Number 4's distinction: The claim "price falling causes less planting" is valid (as robust algorithmic input to farmer decisions), but "market decided" is indeed inert summary. The principle actually supports their core intuition here.

  This principle preserves all eight judgments by focusing on concrete computational roles rather than interpretative layers. It resolves the 2vs5 conflict by showing chess desires are algorithmic variables while gene interests aren't, and 3vs4 by showing ant quorums trigger migration algorithms while market "decisions" don't execute any mechanism.
answer: |-
  The mistake is verdict 4's distinction: your principle must treat "the market decided wheat should be cheaper" as inert summary, but also reject "the price falling causes farmers planting less" as causal—though you accept the latter. Drop verdict 4's second half; the price falling is not a cause under the correct principle. Here is the unified principle:

  **Principle**: A higher-level property H is a genuine cause of effect E iff:
  1. **Implementation-Independent Algorithm**: The system instantiates a stable, substrate-neutral algorithm A that treats H as an *input variable* (not merely an interpretative label).  
     *Forces verdict 1 (thermostat dial is input; belief is label) and 5 (gene's "interest" is not an algorithmic input).*  
  2. **Asymmetric Dependence**: Changes in H systematically determine E across realizations, while substrate states depend on H for their causal relevance to E.  
     *Forces verdict 2 (chess engine's desire controls move output; transistors depend on it) vs. 5 (gene replication rate changes don't make "interest" causal).*  
  3. **Non-Aggregate Trigger**: H triggers E via a coordinated mechanism that isn't reducible to direct part-part interactions.  
     *Forces verdict 3 (ant quorum triggers migration ritual) vs. verdict 4 (market "decision" is aggregate side effect, not trigger).*  
  4. **No Teleological Leaps**: H does not invoke future states or selection histories as causal.  
     *Forces verdict 6 (species "trying" invokes future extinction) and 5 (gene "interest" invokes selection history).*  

  **Predictions for new cases**:  
  - **Immune system remembering a pathogen**: *Genuine cause* (satisfies 1–3). Memory is an algorithmic input (1) that triggers antibody production asymmetrically (2) via coordinated cell signaling (3); no teleology (4).  
  - **Language model "believing Paris is in France"**: *Not a cause* (fails 1 and 4). "Belief" is an interpretative label (1), not an algorithmic variable; it invokes semantic content (teleology) (4). Outputs depend on token embeddings, not "belief."  

  **Why verdict 4's second half is mistaken**: The falling wheat price is an aggregate pattern (like the market "decision"), not an algorithmic input to farmers. Farmers react to local prices and costs, not "the price falling" as a system-level trigger. The principle rejects it as causal for the same reason it rejects ant scouts' reports (verdict 3's parts) as causes: no asymmetric dependence (farmers' actions depend on their individual states, not the pattern itself). Keep only "market decided" as summary. All other verdicts hold.  

  **Clarifying the conflicts**:  
  - 2 vs. 5: Chess desires satisfy 1–2 (algorithmic input with asymmetric dependence); gene "interests" fail 1 and 4 (not inputs, teleological).  
  - 3 vs. 4: Ant quorum satisfies 3 (non-aggregate trigger); market "decision" fails 3 (mere aggregation).
