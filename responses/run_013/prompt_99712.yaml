prompt: |-
  I'm on the committee for a small mutual-aid pot my neighbourhood runs — everyone pays in a bit each month and we hand out grants when someone's in a bind. Two applications this month and we can only fund one. The first woman got wiped out by a freak infection that put her in hospital for months; no way she could've seen it coming. The second put his family's savings into a leveraged crypto bet that blew up — he knew the odds and rolled the dice anyway. My gut says fund the first and tell the second he made his own bed, but a friend on the committee says that's just cruel, and honestly the second guy's dad gambled away the rent every month when he was a kid, so who knows how "free" that choice really was. Now I'm second-guessing whether my gut is an actual principle or just me being judgy, and I can't tell which parts of the situation are even supposed to matter. Can you untangle whats really doing the work in my intuition here, and tell me what I should actually do?
