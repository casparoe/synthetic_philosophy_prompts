  Starting with realism: This maps cleanly to nominal types in languages like Java or Rust, where a type (e.g., a class) is a distinct entity. Python's metaclasses take it further by making types runtime objects, which is almost too literal a translation. The fit is very clean here.

  Moderate realism (Aristotelian view) aligns with structural typing in TypeScript - the property exists only when instantiated in objects. But it's a partial fit because structural types still have conceptual existence in the type system. The residue is that moderate realism demands properties can't exist uninstantiated, which programming types often do at compile time.

  Nominalism is tricky. The "just names" version maps to type erasure (Java generics become raw types at runtime) and duck typing in dynamic languages. However, erasure still has compile-time reality, so it's a distorted fit. Pure nominalism would require zero type information surviving compilation, which is rare.

  Resemblance nominalism fits prototype chains best: JS objects delegate to others, creating property families through similarity. But even here, prototypes are concrete objects, not just resemblances. The residue is that programming always has some concrete representation, while philosophy debates abstract existence.

  Now the residue analysis: The biggest casualty is the "existence" question itself. In programming, types are tools - they exist insofar as they affect compilation or runtime. Philosophers debate metaphysical existence, which doesn't translate. The universals-as-patterns idea also loses force because patterns are explicitly designed in code, not discovered in reality.

