answer: |-
  ### Incoherence Audit Procedure for Decision-Support Team  
  **Purpose**: To detect violations of structural conditions necessary for expected-utility (EU) coherence. Tests three axioms separately:  
  1. **Preference Transitivity** (ordering consistency).  
  2. **Independence Axiom** (invariance under mixing).  
  3. **Probability Additivity** (sum to 1 for partitions).  

  **Rules**:  
  - **Sufficient Answer**: Passes the axiom test without violation.  
  - **Failure**: Violation detected. Distinguish **real violation** (robust to re-elicitation) from **artifact** (elicitation error).  
  - **Bookkeeping vs. Representation Failure**:  
    - **Bookkeeping**: Fixable via better elicitation/scoping (e.g., overlapping scenarios).  
    - **Representation Failure**: Axiom violated; EU is the wrong tool (e.g., incomparable options, absolute rules).  
  - **Anticipation Defense**: Allowed only where no sure-loss exploitation exists *even if the agent sees it coming*. Noted per step.  
  - **Stop for Human Judgment**: Required when options are **incomparable** (neither better, worse, nor equal) or commitments are **absolute** (non-negotiable).  
  - **Output**: One-page report per allocation: "Pass," "Fail [reason]," or "Stop: [issue]."  

  ---

  #### **Step 1: Test Preference Transitivity**  
  **Question**: *For any three options A, B, C, if A is preferred to B and B is preferred to C, is A preferred to C?*  
  - **Sufficient Answer**: Consistent transitive ordering (no cycles).  
  - **Failure**: Cycle (e.g., A > B > C > A).  
  - **Audit Protocol**:  
    1. Elicit strict preferences (avoid indifference).  
    2. Re-express options in neutral terms (e.g., anonymize, use outcomes).  
    3. Test in reverse order or split options (e.g., decompose into sub-components).  
  - **Artifact Check**: Cycle breaks under re-elicitation → **artifact** (e.g., framing effect).  
    Persists → **real violation**.  
  - **Bookkeeping vs. Representation**:  
    - Bookkeeping: Cycle due to ambiguous descriptions (fix: clarify options).  
    - Representation Failure: Cycle robust → EU inapplicable (no utility function exists).  
  - **Anticipation Defense**: **Not available**. Transitivity is foundational; cycles enable exploitation *even if anticipated* (e.g., "money pump").  
  - **Stop for Human Judgment**: If options are **incomparable** (e.g., ethical vs. financial tradeoffs).  

  ---

  #### **Step 2: Test Independence Axiom**  
  **Question**: *If A is preferred to B, is a mix of A and C (e.g., 50% A, 50% C) preferred to the same mix of B and C?*  
  - **Sufficient Answer**: Preference holds for all mixing probabilities (0 < p < 1) and common lotteries C.  
  - **Failure**: Reversal under mixing (e.g., A > B but 0.5B + 0.5C > 0.5A + 0.5C).  
  - **Audit Protocol**:  
    1. Fix a common lottery C (e.g., status quo, worst-case).  
    2. Test mixes at p = 0.5, 0.25, 0.75.  
    3. Vary C (e.g., safe vs. risky baseline).  
  - **Artifact Check**: Reversal disappears when C is changed/explained → **artifact** (e.g., loss aversion).  
    Persists → **real violation**.  
  - **Bookkeeping vs. Representation**:  
    - Bookkeeping: Reversal due to mis-specified C (fix: align C with context).  
    - Representation Failure: Robust reversal → EU fails (e.g., Allais paradox, ambiguity aversion).  
  - **Anticipation Defense**: **Available**. If the agent binds themselves to reject all trades involving mixed lotteries, exploitation is blocked.  
  - **Stop for Human Judgment**: If mixing is **absolutely forbidden** (e.g., "never gamble on harm").  

  ---

  #### **Step 3: Test Probability Additivity**  
  **Question**: *For mutually exclusive, jointly exhaustive scenarios, do probabilities sum to 1?*  
  - **Sufficient Answer**: Sum = 1 (tolerance: ±0.01 for rounding).  
  - **Failure**: Sum ≠ 1 (e.g., 1.15 or 0.85).  
  - **Audit Protocol**:  
    1. Verify exhaustiveness (add "other" if needed).  
    2. Verify exclusivity (no overlap).  
    3. Re-elicited probabilities via betting odds or frequency grids.  
  - **Artifact Check**: Sum normalizes after clarifying exclusivity → **artifact** (e.g., double-counting).  
    Persists → **real violation**.  
  - **Bookkeeping vs. Representation**:  
    - Bookkeeping: Non-additivity due to poor partitioning (fix: refine scenarios).  
    - Representation Failure: Robust non-additivity → use non-EU models (e.g., Dempster-Shafer).  
  - **Anticipation Defense**: **Not available**. Non-additivity enables Dutch books *even if binding occurs* (bets can be crafted pre-commitment).  
  - **Stop for Human Judgment**: If probabilities represent **non-quantifiable uncertainty** (e.g., "unknown unknowns").  

  ---

  ### **Case Applications**  
  #### **Case 1: Circular Preference (A > B > C > A)**  
  - **Step 1 (Transitivity)**:  
    - Failure: Cycle persists after re-elicitation (neutral terms, decomposed options).  
    - Real violation (not artifact).  
    - Representation Failure: Cycle is stable → EU inapplicable.  
    - Anticipation Defense: Invalid (money pump possible).  
    - Stop? No—colleague accepts comparability.  
    **Verdict: Fail. EU abandoned. Use non-utility model (e.g., Borda count).**  
  - *Steps 2–3 skipped (transitivity failure halts EU)*.  

  #### **Case 2: Scenario Probabilities Sum to 1.20**  
  - **Step 3 (Additivity)**:  
    - Failure: Sum = 1.20 after verifying exclusivity/exhaustiveness.  
    - Real violation (not artifact).  
    - Bookkeeping: Initially overlap in "crisis" and "recession" scenarios → fixed by redefinition. Sum now 1.05.  
    - **Re-test**: Sum still 1.05 → Representation Failure (DM insists "crisis" and "recession" can co-occur).  
    - Anticipation Defense: Invalid (Dutch book possible).  
    - Stop? No—probabilities are quantifiable.  
    **Verdict: Fail. Use non-additive uncertainty model (e.g., capacities).**  

  #### **Case 3: Board Member’s Absolute Principle**  
  *Principle: "No expected benefit justifies any increase in irreversible harm risk."*  
  - **Step 1 (Transitivity)**: Pass (e.g., Safe > LowRisk > HighRisk).  
  - **Step 2 (Independence)**:  
    - Test: Let A = $1B benefit (zero harm risk), B = $1T benefit (0.0001% harm risk).  
      - Elicit: A > B (by principle).  
    - Mix with C = Guaranteed harm (worst outcome) at p = 0.5:  
      - Lottery 1: 0.5A + 0.5C (0.5 chance of harm).  
      - Lottery 2: 0.5B + 0.5C (0.5 chance of harm + negligible risk).  
      - Elicit: Lottery 1 = Lottery 2 (both rejected).  
    - Failure: A > B but indifference when mixed with C → Reversal.  
    - Real violation (robust to C changes).  
    - Representation Failure: Absolute principle violates independence → EU inapplicable.  
    - Anticipation Defense: **Available** (board member binds to never accept harm-risk lotteries).  
    - Stop? **Yes**—principle is absolute. Human judgment required.  
    **Verdict: Stop. EU abandoned. Record as lexicographic preference.**  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Misclassify**:  
     - **False Negatives**: Misses violations if elicitation is flawed (e.g., leading questions).  
     - **False Positives**: Flags artifacts as violations if re-elicitation is insufficient.  
     - **Incomparability**: May force comparisons where none exist (e.g., ethical tradeoffs).  

  2. **Overconfidence**:  
     - The audit ensures *structural* coherence but **not** that preferences/probabilities are "correct."  
     - E.g., Transitivity passes even if preferences are biased (e.g., status quo bias).  

  3. **Unsettled Questions**:  
     - **Normative Validity**: Cannot adjudicate if violations are "rational" (e.g., Allais paradox).  
     - **Ambiguity**: Fails to distinguish risk (known probabilities) from ambiguity (unknown).  
     - **Dynamic Decisions**: Ignores time consistency (e.g., hyperbolic discounting).  

  **Final Output**: One-page summary per allocation (example):  
  ```  
  Allocation: Health Initiative  
  Step 1: Pass  
  Step 2: Fail [Independence violation: Reversal when mixed with crisis scenario]  
  Step 3: Pass  
  Action: Representation failure. Switch to prospect theory.  
  ```  

  Use this to flag incoherence *before* board review—ensuring allocations avoid exploitable errors.
