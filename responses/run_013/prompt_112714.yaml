  We are designing an audit procedure to check for incoherence in preferences and probability estimates. The procedure is structured as a sequence of questions, each targeting a specific structural condition. We are to test three conditions separately:

  1. **Preference Ordering (Transitivity)**: Preferences should be transitive (if A > B and B > C, then A > C).
  2. **Independence Axiom**: Preferences should be independent of irrelevant alternatives (if A > B, then for any lottery L, a mixture of A and L is preferred to the same mixture of B and L).
  3. **Probability Coherence (Additivity)**: Probabilities over a mutually exclusive and exhaustive set of scenarios should sum to 1.

