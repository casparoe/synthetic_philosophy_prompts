  - Distinguish real violations from artifacts of elicitation.
  - Indicate which violations are mere bookkeeping (fixable by adjusting the representation) and which suggest that the expected utility representation is the wrong tool.
  - Address the objection that an agent who anticipates the exploitation or binds themselves can avoid revising preferences/probabilities.
  - Identify points where the procedure stops and requires human judgment (e.g., when options are incomparable or when there are absolute commitments).

  We will then apply the procedure to three cases.

  ---

  **Audit Procedure: Incoherence Check**

  **Step 1: Check for Preference Transitivity**
  - **Question**: For any three options A, B, C, if the decision-maker (DM) prefers A to B and B to C, do they also prefer A to C?
  - **Sufficient Answer**: The DM states a consistent ordering without cycles. If a cycle is found, probe by re-eliciting the preferences in a different context (e.g., changing the description but not the substance, or using a different elicitation method). Also, check if the options are being compared in the same state of the world (i.e., no change in information).
  - **Failure**: A cycle that persists after re-elicitation (e.g., A>B, B>C, C>A) and cannot be explained by a change in context or state of the world.
  - **Artifact vs. Violation**: If the cycle disappears when the options are presented differently, it may be an elicitation artifact. If it persists, it is a violation of transitivity.
  - **Bookkeeping vs. Representation Failure**: A transitivity violation is a representation failure because it violates a necessary condition for representing preferences by a utility function.
  - **Anticipation Defense**: The DM might claim they can avoid exploitation by not trading. However, the violation means there is no utility function representing their preferences. This is a fundamental flaw in the preference structure, so the defense does not apply to the representational issue. The procedure must note that without transitivity, the expected utility framework is inapplicable.
  - **Stop for Human Judgment**: If the options are incomparable (e.g., incommensurable values) or if the DM has an absolute rule that overrides the comparison, then transitivity might not hold by design. Mark as "stop: requires human judgment for incomparability or absolute rule."

  **Step 2: Check the Independence Axiom**
  - **Question**: For any two options A and B with A preferred to B, and for any lottery L and any probability p (0<p<1), is the mixture pA+(1-p)L preferred to pB+(1-p)L?
  - **Sufficient Answer**: The DM consistently maintains the preference for A over B when mixed with any common lottery L at any positive probability p.
  - **Failure**: The DM reverses the preference for some mixture (i.e., for some L and p, they prefer pB+(1-p)L to pA+(1-p)L).
  - **Artifact vs. Violation**: If the reversal occurs only for specific ways of describing the mixture, it might be an artifact. If it persists even when the mixtures are presented clearly and in equivalent forms, it is a violation.
  - **Bookkeeping vs. Representation Failure**: A violation of the independence axiom suggests that the expected utility representation may not hold. However, it may be fixable by a more complex model (e.g., rank-dependent utility). But if the violation is robust, it indicates that expected utility is the wrong tool.
  - **Anticipation Defense**: The DM might avoid exploitation by not accepting the specific bets that would lead to a sure loss. However, the violation of independence means that preferences cannot be represented by expected utility, so the framework breaks. The defense does not address the representational issue.
  - **Stop for Human Judgment**: If the DM has a principled reason to violate independence (e.g., uncertainty aversion that leads to Allais-type behavior), and they are aware of the implications, then we note that expected utility may not be the right model. This step requires human judgment to decide whether to switch to an alternative model or to stick with the violation.

  **Step 3: Check Probability Additivity**
  - **Question**: For a mutually exclusive and exhaustive set of scenarios, do the assigned probabilities (credences) sum to 1?
  - **Sufficient Answer**: The probabilities sum to 1 (within a small tolerance, say 0.01, to account for rounding).
  - **Failure**: The sum is not 1 (e.g., >1 or <1).
  - **Artifact vs. Violation**: If the sum is off due to rounding or because scenarios were not properly defined as mutually exclusive and exhaustive, it is an artifact. If after clarifying and re-eliciting, the sum still deviates significantly (e.g., by more than 0.05), it is a violation.
  - **Bookkeeping vs. Representation Failure**: A violation of additivity is a bookkeeping issue if it is due to a mistake in the elicitation (e.g., overlapping scenarios). If the DM insists on non-additive probabilities (e.g., because of ambiguity), then it suggests that the classical probability model is inadequate and an alternative (e.g., Dempster-Shafer) may be needed.
