prompt: |-
  I'm on a small working group that's building a wellbeing index for our city's budget process -- the kind of thing where every department has to show that its proposal improves residents' lives, and the economists have (fairly) told us that until we can say what improves lives means, we're just measuring GDP with extra steps. So before I go to bat for any particular view, I want the spec: what does a theory of wellbeing actually have to deliver to be usable as the welfare standard in a public cost-benefit analysis? Not which theory is true -- the requirements list. The cases it has to get right, with the consideration behind each: the experience machine, sure, but also the ones we keep running into in practice -- the person who's adapted to a genuinely bad situation and reports being fine with it, the achievement nobody ever finds out about, the preference we satisfy without them ever knowing, the thing that's bad for someone now and good for them later, the person who wants their life to have gone a certain way even though it didn't. The distinctions it can't collapse -- how well a life is going for the person vs. how much they like it vs. what they'd choose; one person's welfare vs. the size of the pie; worse for someone vs. worse on balance. And the constraints that come from the fact that we're going to have to measure, compare, and add these things up across millions of people and defend the result in a council meeting, which I suspect is where half my list is going to die.

  Mark which requirements are genuine desiderata and which are just the prejudices of the utility-maximizing crowd I'm stuck with, and don't pad it with a reading list -- I'm not going to read anything before Thursday, I just need to know what I'm demanding. The part I most want is the collisions: any two requirements you think can't both be met, and why the standard moves for rescuing one (say, admitting paternalism to fix adaptive preferences, or dropping comparability to keep the theory faithful to individual subjects) end up costing you somewhere else on the list. I have a hunch that don't tell people what's good for them and don't count preferences formed under duress can't coexist, but tell me if I'm wrong, and whether the same tension shows up in a place I haven't thought of. Then one line each on hedonism, desire-satisfaction, and objective-list views against the list, and your pick for the single requirement that does the most killing.
reasoning: |-
  Okay, let me unpack this user's request. They're part of a team building a wellbeing index for city budgeting, and need a practical specification for what makes a wellbeing theory usable in public cost-benefit analysis. The economists have challenged them to move beyond GDP proxies, so they need rigorous criteria - not philosophical truths.

  Hmm, the user clearly has real-world constraints: council meetings, measurement across populations, defensibility. They're signaling frustration with academic solutions ("don't pad with reading lists"). The core ask is a conflict analysis: where requirements clash, and why common fixes create new problems. That adaptive preferences vs. anti-paternalism tension they mention is spot-on - that's going to be central.

  Breaking it down: First, the theory must handle hard cases (experience machine, hidden achievements, etc.) without collapsing key distinctions (subjective happiness vs objective welfare). Second, it needs operational feasibility (measurable, additive). Third, it must navigate normative landmines (paternalism, autonomy). The collisions will likely center on three friction points: respecting preferences vs overriding them for "true" wellbeing, individual focus vs aggregation needs, and anti-paternalism vs correcting distorted desires.

  For the "two requirements that can't coexist" part: Absolutely, "don't override self-reports" and "don't validate coerced preferences" are fundamentally at odds. If someone in a terrible job says they're content, honoring their report validates adaptive preference; overriding it is paternalistic. Every solution here loses something - either legitimacy or accuracy. This same tension appears in discounting future wellbeing (e.g., addicts refusing treatment) and in handling cultural differences in valuation.

  When I compare theories against the requirements: Hedonism fails on hidden achievements and adaptation. Desire theory implodes on adaptive preferences. Objective lists struggle with measurement and anti-paternalism. The real killer requirement? "Must be measurable at population scale without subjective interpretation" - this murders most philosophically pure approaches because proxies always distort.

  The user's urgency suggests they need this for immediate negotiation prep. I'll emphasize tradeoffs rather than ideals, and flag where their economist colleagues will likely attack. The "single requirement that does the most killing" point will resonate - it's their ammunition for Thursday.
answer: |-
  Here's the specification for a public cost-benefit wellbeing standard, stripped to operational requirements and collisions:

  **Core Deliverables (What the Theory MUST Do):**

  1.  **Handle Adaptation:** Accurately value wellbeing in cases where individuals report satisfaction despite objectively harmful conditions (e.g., chronic poverty, systemic discrimination, poor health *they've adjusted to*). *(Desideratum: Avoids rewarding neglect or trapping people in bad states.)*
  2.  **Value Unobserved States:** Assign welfare value to achievements, experiences, or preference satisfactions that remain entirely private/unknown to the individual or others (e.g., secret philanthropy, undiscovered artistic creation). *(Desideratum: Captures intrinsic value beyond social validation.)*
  3.  **Value Unfelt Satisfactions:** Account for welfare impacts of satisfying preferences *the individual never learns about* (e.g., preventing a harm they were unaware of, fulfilling a posthumous wish). *(Desideratum: Recognizes welfare beyond conscious experience.)*
  4.  **Temporal Tradeoffs:** Systematically weigh short-term costs/losses against long-term benefits/gains (and vice-versa) for the *same individual* (e.g., education, painful medical treatment, addiction). *(Desideratum: Essential for policy time horizons.)*
  5.  **Life Narrative Value:** Capture the welfare significance of how a life *unfolds* or is *perceived to have unfolded*, even if the endpoint is identical (e.g., recovering from illness vs. never being ill; achieving success after struggle vs. easily). *(Desideratum: Respects common intuitions about meaning.)*
  6.  **Maintain Critical Distinctions:**
      *   *Wellbeing (how life is going)* vs. *Hedonic State (how it feels)* vs. *Choice (what they'd pick)*. *(Desideratum: Prevents "happy slave" justification; explains why people choose painful goods.)*
      *   *Individual Welfare* vs. *Aggregate Social Good*. *(Desideratum: Prevents sacrificing individuals for nebulous totals.)*
      *   *Worse for Someone* (Pareto-relevant) vs. *Worse on Balance* (Kaldor-Hicks). *(Desideratum: Crucial for equity analysis.)*
  7.  **Operational Feasibility:**
      *   *Measurable:* Yields quantifiable (cardinal or clear ordinal) indicators feasible to collect/administer at city scale. *(Desideratum: Practical necessity.)*
      *   *Comparable:* Allows defensible interpersonal comparisons of welfare levels/changes. *(Desideratum: Required for aggregation/prioritization.)*
      *   *Aggregatable:* Permits summing welfare impacts across individuals to get a total social welfare figure. *(Desideratum: Core function of CBA.)*
      *   *Defensible:* Produces results explainable & justifiable to non-experts (council, public). Avoids overly complex/esoteric justifications. *(Desideratum: Political reality.)*

  **Key Collisions (Where Requirements Conflict):**

  1.  **Anti-Paternalism vs. Handling Adaptation:**
      *   **Conflict:** "Respect self-reports/subjective states" (Anti-Paternalism) vs. "Don't validate preferences formed under duress/oppression" (Handling Adaptation).
      *   **Why:** Calling the adapted poor person "truly fine" validates the bad state. Saying they *aren't* fine overrides their stated preference.
      *   **Cost of Fixing (e.g., admit paternalism):** Undermines legitimacy ("elites know best"), violates autonomy, politically toxic. Makes measurement harder (who defines "true" interest?).
      *   **Parallel Tension:** Appears in **Valuing Unfelt Satisfactions** (overriding *current* expressed preference for a future/unfelt good) and **Temporal Tradeoffs** (imposing short-term pain).

  2.  **Faithfulness to Individual Subjects vs. Comparability/Aggregation:**
      *   **Conflict:** "Reflect the unique values/experiences of each person" (Faithfulness) vs. "Produce a single, comparable, additive metric" (Operational Feasibility).
      *   **Why:** Deeply subjective or pluralistic wellbeing (e.g., objective lists) resists reduction to a common scale. Forcing it distorts individual realities.
      *   **Cost of Fixing (e.g., drop comparability):** Renders CBA impossible (no totals, no clear rankings). **This requirement (Operational Feasibility) kills most philosophically pure theories.**
      *   **Parallel Tension:** Appears in **Life Narrative Value** (hard to quantify meaning) and **Distinctions** (collapsing distinctions makes aggregation easier but less accurate).

  3.  **Value Unobserved/Unfelt States vs. Measurability/Defensibility:**
      *   **Conflict:** How do you measure & defend the value of a secret achievement or an unknown preference satisfaction?
      *   **Why:** These states lack observable proxies. Any valuation is inherently speculative or relies on contested theory.
      *   **Cost of Fixing (e.g., ignore them):** Renders the theory incomplete (misses real welfare aspects). Creates perverse incentives (only value observable outcomes).

  **Theories Against the Spec (One Line Each):**

  *   **Hedonism:** Fails Adaptation (happy slave), Unobserved States (secret achievement), Unfelt Satisfactions, Life Narrative. Excels at Measurability (in theory). *Dies on collisions 1 & 3.*
  *   **Desire-Satisfaction:** Fails Adaptation (coerced/adapted desires), Unfelt Satisfactions (if desire unknown), Temporal Tradeoffs (myopic desires). Struggles with Measurability (latent desires). *Dies spectacularly on collision 1.*
  *   **Objective List:** Fails Anti-Paternalism (imposes goods), Measurability/Defensibility (whose list? weights?), Value Unobserved States (if not on list). Handles Adaptation well. *Dies on collision 2 & Operational Feasibility.*

  **The Single Requirement That Does the Most Killing:**

  **Operational Feasibility (Measurable, Comparable, Aggregatable, Defensible).** This is where elegant philosophical theories meet the brutal reality of budgets, surveys, spreadsheets, and council chambers. It forces simplification, proxies, and often the collapse of distinctions (#6) that philosophers deem essential. It's the primary filter ruling out theories that cannot be practically implemented at scale under real-world constraints and scrutiny. **This is the economists' hill to die on, and it's where your list faces its toughest battle.** Prioritize ruthlessly here.
