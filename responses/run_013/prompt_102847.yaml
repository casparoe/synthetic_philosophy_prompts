answer: |-
  Here’s a focused research proposal structured around your core insight, designed for a 5,000-word semester paper. It sharpens your question, critiques existing approaches, outlines a method, defines success/failure, and assesses feasibility.

  ---

  **Research Proposal: Semantic Ambiguity in the White Horse Paradox - Untangling Gongsun Long’s "Horse"**

  **1. Research Question:**  
  Does the apparent paradox in Gongsun Long’s *White Horse Dialogue* arise from an unacknowledged ambiguity in the key term "horse" (*ma* 馬)—specifically, between its use as an *abstract kind-concept* (a shape-based universal, indifferent to color or individuation) and its use as a *concrete particular* (a countable, determinate object)—and does resolving this ambiguity reveal a coherent philosophical claim about the nature of sortal terms that transcends the logic/sophistry dichotomy?

  **2. Why the Question is Open & Existing Answers are Inadequate:**  
  The standard interpretations fail to resolve the paradox satisfactorily because they presuppose a univocal meaning for "horse" and focus exclusively on the function of "not" (*fei* 非) or ontological commitments:  

  *   **The "Logic" Reading (e.g., early Fung Yulan, some Western logicians):** Treats *fei* as strict non-identity. Reads "A white horse is not a horse" as logically true if "horse" denotes an abstract universal distinct from the compound "white horse." *Problem:* Ignores the intuitive absurdity by abstracting too far from language use. Doesn't explain *why* Gongsun Long thinks this needs arguing or how it relates to naming.  
  *   **The "Sophistry" Reading (Traditional critiques, Han Feizi):** Dismisses the argument as deliberate verbal trickery by equivocating on terms (possibly "horse"). *Problem:* Offers no *philosophical* insight into the text. Fails to engage with the structured argument presented or why it might have been philosophically provocative.  
  *   **"Nominalist" Readings (e.g., Chad Hansen's mass-noun/stuff interpretation):** Argues classical Chinese nouns function like mass nouns ("horse-stuff"), making "white horse" a portion of that stuff. *fei* indicates non-identity of portions. *Problem:* While highlighting grammatical context, it *replaces* the apparent ambiguity with a single, forced interpretation (mass-noun). Crucially, **it conflates grammar with semantic function.** Your insight targets a deeper, *conceptual* distinction in how the term *picks out* reality – classification (abstract kind) vs. reference (concrete particular) – which *can* map onto grammatical distinctions but is not reducible to them. Hansen's reading pre-emptively collapses the ambiguity you identify.  

  **The Key Gap:** None of these readings systematically interrogate whether "horse" itself shifts meaning *within the dialogue* between these two functional roles (abstract kind vs. concrete particular). This ambiguity is the likely source of the paradox's persuasive power and its intractability in standard debates. Your question is open because scholars either assume univocality (logic/sophistry) or impose a single functional interpretation (nominalism), rather than exploring the ambiguity as philosophically significant in itself.

  **3. Method & Monthly Plan:**  
  This project moves beyond a simple close reading by systematically testing the ambiguity hypothesis against the text *and* its context within Gongsun Long's thought, while engaging comparative philosophy to avoid "reinventing the wheel."  

  *   **Month 1: Micro-Analysis of the *White Horse Dialogue*:**  
      *   **Task:** Conduct an exhaustive, line-by-line analysis of the dialogue. Tag every instance of "horse" (*ma*), "white horse" (*baima*), and key verbs (e.g., "have" *you* 有, "seek" *qiu* 求).  
      *   **Focus:** Does the argument *require* or *suggest* different senses of "horse" at different points? E.g., When "horse" is used in abstraction ("separating shape from color") vs. in practical contexts ("horses in the stable," "riding"). Does the opponent's confusion stem from switching senses?  
      *   **Tool:** Develop explicit criteria for identifying "abstract-kind" use (focus on shape, definition, universality) vs. "concrete-particular" use (focus on individuation, countability, specific existence).  
  *   **Month 2: Corpus Context & Comparative Framework:**  
      *   **Task 1:** Test the identified ambiguity against other key texts attributed to Gongsun Long/the School of Names (e.g., *Zhiwu Lun* 指物論 / "Discourse on Referring to Things," *Jianbailun* 堅白論 / "Discourse on Hardness and Whiteness"). Does this pattern of ambiguity appear elsewhere? Is it consistent? Does resolving ambiguity clarify other arguments?  
      *   **Task 2:** Engage selectively with Analytic Philosophy (e.g., Frege's *Sense/Reference* distinction, Strawson on sortal terms, debates on kind-terms vs. object-terms). **Goal:** Not to *apply* these directly, but to use them as conceptual tools to *sharpen the description* of the ambiguity observed in the text ("Hey, this looks similar to X, but notice difference Y") and to pre-empt the "reinventing the wheel" critique by showing awareness and differentiation.  
  *   **Month 3: Synthesis & Resolution:**  
      *   **Task:** Synthesize findings. Does the ambiguity hypothesis resolve the paradox into a valid argument when the senses are distinguished? What *positive* claim about sortal terms (their dual function in classification vs. reference) does Gongsun Long emerge with? Re-evaluate the logic/sophistry/nominalism debate in light of this resolution.  
      *   **Focus:** Articulate the philosophical *significance* of this ambiguity for understanding early Chinese philosophy of language.  

  **Why this method beats simple close reading?** A pure close reading risks simply declaring a winner based on textual intuition. This method:  
  1.  **Systematizes** the search for ambiguity with defined criteria.  
  2.  **Tests** the hypothesis against Gongsun Long's *wider corpus* to see if it's an isolated trick or a consistent feature.  
  3.  **Engages Comparatively** explicitly to justify the novelty and conceptual grounding of the ambiguity claim, moving beyond grammatical nominalism.  
  4.  **Seeks Resolution:** Aims not just to identify ambiguity but to show *how* resolving it dissolves the paradox and reveals a coherent philosophy.

  **4. Expected Results & Success/Failure Conditions:**  

  *   **Successful Result:** A clear demonstration that:  
      a) The paradox *depends* on an unrecognized ambiguity in "horse" between abstract-kind and concrete-particular senses.  
      b) Distinguishing these senses renders Gongsun Long's core argument *valid* (though perhaps counter-intuitive) under the abstract-kind reading.  
      c) This reveals a deliberate, philosophically significant point about the dual function of sortal terms in classification (abstract kind) and individuation (concrete particular).  
      d) This ambiguity is detectable in other School of Names arguments (e.g., *Jianbailun*), strengthening its plausibility as an authentic feature of Gongsun Long's thought.  
  *   **Decisive Considerations:**  
      *   Does the text *compel* the dual reading at specific points? (e.g., Does the argument only work if "horse" shifts meaning? Does the opponent's objection only make sense on one reading?)  
      *   Does the dual reading provide a *clearer and more consistent* interpretation of the *entire* dialogue than univocal readings?  
      *   Does it find resonance in other Gongsun Long texts?  
  *   **Failure Conditions:**  
      *   The ambiguity proves unnecessary; a single, consistent reading (logical, sophistical, or nominalist) adequately explains the entire text without strain.  
      *   The distinction between abstract-kind and concrete-particular uses cannot be consistently or meaningfully applied to the text or other School of Names fragments.  
      *   The ambiguity, while present, turns out to be philosophically trivial or irrelevant to resolving the core dispute (logic vs. sophistry).  
      *   The comparative engagement reveals the distinction *is* entirely subsumed under existing Western categories (like mass/count) in a way that negates its novelty for interpreting the Chinese text (though this seems unlikely given your conceptual focus).

  **5. Feasibility (One Semester, 5,000 words):**  
  *   **Scope is Appropriate:** Focus is tightly constrained to one core dialogue (White Horse), with targeted analysis of 1-2 other short School of Names texts (*Jianbailun*, *Zhiwu Lun*) for corroboration. The comparative engagement is focused (specific concepts, not whole theories).  
  *   **Manageable Risk:** Primary texts are short. The core analytical work (Months 1 & 2) is well-defined.  
  *   **Potential Challenge:** Avoiding getting bogged down in the vast secondary literature. **Mitigation:** Use secondary sources *reactively* to position your argument against logic/sophistry/nominalism (Hansen), not exhaustively survey all views. Prioritize primary text analysis.  
  *   **Why not too small?** Reinterpreting a foundational paradox with a novel lens that bridges Chinese thought and analytic philosophy of language is substantive.  
  *   **Why not too big?** By limiting the primary corpus and defining a specific ambiguity, it avoids sprawling into general philosophy of language or the entire School of Names.

  **Conclusion:** This proposal moves beyond the stale logic/sophistry debate by identifying a specific, resolvable semantic ambiguity ("horse" as abstract kind vs. concrete particular) within Gongsun Long's *White Horse Dialogue*. By systematically analyzing the text, testing the hypothesis against Gongsun Long's corpus, and engaging strategically with analytic philosophy, it aims to dissolve the paradox and uncover a coherent, philosophically significant claim about sortal terms. The project is ambitious but feasible within the constraints, offering a fresh perspective grounded in close reading yet enhanced by systematic analysis and conceptual comparison.

  --- 

  **Key Strengths of this Structure for You:**

  1.  **Sharp Question:** Clearly isolates the ambiguity of "horse" as the pivot, moving focus from "not" (*fei*).
  2.  **Targeted Critique:** Explicitly shows *why* logic, sophistry, *and especially nominalism* (Hansen) fail to resolve the issue satisfactorily. Acknowledges Hansen but argues his approach misses your core conceptual distinction.
  3.  **Method Justification:** Explains why corpus analysis + *focused* comparative work beats pure close reading. Pre-empts the "reinventing the wheel" critique by making engagement with analytic concepts explicit and purposeful (sharpening description, not direct application).
  4.  **Clear Success/Failure:** Defines what a result looks like and specific ways the project could fail (especially the crucial test against other texts).
  5.  **Feasibility Argument:** Explicitly addresses scope and manages the secondary literature risk.

  **Next Steps for You:**

  1.  **Flesh out Criteria:** Develop specific textual markers for "abstract-kind" vs. "concrete-particular" uses of *ma* for your Month 1 analysis.
  2.  **Identify Key Secondary Touchpoints:** Find 1-2 representative papers/articles for each: Logic Reading (e.g., an early logician), Sophistry Reading (e.g., a traditional critique), Nominalist Reading (Hansen, *Language and Logic in Ancient China* Ch. 5-6 is essential). Find 1-2 key analytic pieces on sortals/kind terms (e.g., Strawson's *Individuals*, relevant parts; Wiggins *Sameness and Substance*; maybe Pelletier on mass terms).
  3.  **Sketch Corpus Analysis:** Briefly note passages in *Jianbailun* (Hardness/Whiteness) and *Zhiwu Lun* (Referring to Things) where similar ambiguities (e.g., *bai* 白 "whiteness" vs. "a white thing", *zhi* 指 "referring" vs. "what is referred to") might be operative.

  This gives you a solid, defensible framework to work from. Good luck!
