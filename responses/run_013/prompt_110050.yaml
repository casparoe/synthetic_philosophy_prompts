  We are building a decision procedure for personal identity in the context of copying minds. The procedure is grounded in two main ideas: 
   1. Psychological continuity (especially continuity of memory and character) as traditionally discussed in personal identity.
   2. Hofstadter's idea of the self as a self-referential pattern that can be carried by other minds (i.e., the self is a pattern that can be instantiated in multiple substrates and maintained through relationships with others).

  The procedure will have a series of questions. At each step, if we get a clear negative, we return "no" (not the same person). Some steps are marked as requiring a value judgment — in those cases, we stop and return "undetermined by procedure; author must decide based on narrative values".

  Steps in the procedure:

  1. **Continuity of Memory**: 
     - Question: Does the copy have a continuous, first-person access to the original's memories, such that they remember the original's experiences as their own?
     - Sufficient answer: If the copy does not have the majority of the original's episodic memories (memories of events) and cannot recall them from the first-person perspective, then the answer is no. Otherwise, proceed.
     - Note: We are not requiring perfect memory, but a substantial core.

  2. **Continuity of Character (Personality/Traits)**:
     - Question: Does the copy exhibit the same core character traits, dispositions, and values as the original?
     - Sufficient answer: If the copy has diverged so much in fundamental traits (e.g., the original was kind and the copy is cruel, or the original was brave and the copy is cowardly) that they would be considered a different personality, then no. Otherwise, proceed.
     - Note: Minor changes due to new experiences are expected, but the core must remain.

  3. **Continuity of Self-Representing Pattern (Hofstadter's Idea)**:
     - Question: Is the copy maintaining the same self-referential pattern? That is, does the copy consider itself to be the original, and is it recognized by the original's close associates as carrying the same self-pattern?
     - Sufficient answer: This has two parts:
          a. Subjective: Does the copy claim to be the original and feel that they are the same person?
          b. Objective: Do the people who were in a position to know the original (especially those who loved or interacted deeply with them) recognize the copy as the same person? (i.e., does the pattern persist in the social context?)
     - If both (a) and (b) are absent, then no. If one is present and the other absent, then we proceed to step 4. If both are present, then we return "yes" at this step.

  4. **Continuity of Project/Goals**:
     - Question: Is the copy continuing the central life projects and goals of the original?
     - Sufficient answer: If the copy has abandoned the original's core life projects and goals without good reason (or due to a fundamental change in values), then no. Otherwise, proceed.
     - Note: This step is less about identity and more about what matters in survival. We use it as a tie-breaker.

  5. **Value Judgment Step**: 
