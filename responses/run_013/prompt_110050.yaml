  Finally, what the procedure cannot do:

  1. **The procedure cannot resolve metaphysical disputes**: For example, if we have a case where the copy has all the psychological traits but there is no causal connection (e.g., a coincidental duplicate), the procedure might say "yes" at step 3 (if it has the memories and character and is recognized) but some theories (like causal theories) would say it is not the same. The procedure is based on psychological and social patterns, not causation.

  2. **The procedure may not handle gradual replacement**: If the copy is gradually changed over time, step 2 (character) might pass even if the end result is very different, because we might still see a core. This is a judgment call.

  3. **Value judgments are deferred**: The procedure stops at step 5 when the facts are ambiguous and the answer depends on what matters in the particular context (legal, emotional, etc.). The procedure does not make value judgments.

  4. **It may get wrong cases where bodily continuity matters**: The procedure ignores the body. But in some contexts (like a romantic relationship) the body might be important. The procedure would not capture that.

  5. **Cases with multiple copies**: The procedure evaluates one copy at a time. But when there are multiple copies, the social recognition (step 3b) might be split. The procedure does not have a step to compare copies.

  6. **Cases of brain damage or mental illness**: If the original had a condition that altered their memory or character, and the copy does not, then the copy might be more continuous than the original was at the end. The procedure does not account for this.

  This procedure is designed to be quick and yield narrative elements:

