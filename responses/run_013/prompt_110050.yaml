          - In the context of the narrative, what is the purpose of the identity question? (e.g., for inheritance, for promise-keeping, for criminal responsibility, for grief)
          - The procedure stops and returns: "Undetermined — author must decide based on narrative values and the specific context (e.g., legal, emotional, moral)."

  The procedure returns "no" at any step that fails. It returns "yes" only at step 3 if both (a) and (b) are present. Otherwise, it proceeds until step 5, which is the value judgment step.

  Note: We are not requiring bodily continuity because we are in a context of copying minds.

  Now, we run the procedure on three cases:

  **Case 1: A copy who has every memory but none of the original's character.**

  - Step 1: **Continuity of Memory**: Yes, the copy has every memory. Proceed.
  - Step 2: **Continuity of Character**: No, because the character is completely different. 
