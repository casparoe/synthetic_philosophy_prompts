answer: |-
  ### Decision Procedure for Personal Identity in Mind-Copying Scenarios  
  **Grounding**: This procedure blends Hofstadter's "self-referential pattern" (where identity is a dynamic, socially embedded loop maintained by self-perception and recognition by others) with psychological continuity (emphasizing memory, character, and projects). The self is a pattern that can be copied, but survival requires this pattern to be actively sustained—not just stored. The steps prioritize narrative usability: each question yields concrete character reactions (e.g., dialogue, hesitation) you can write into scenes.  

  #### The Procedure  
  Run these questions in order for any copy-original pair. Stop early if you get a "no" or a definitive "yes." If the answer is unclear or requires value judgments, hand it back to yourself.  

  1. **Does the copy genuinely remember the original’s life as its own?**  
     - *What counts as sufficient*: The copy must recall specific, emotionally charged events from the original’s life (e.g., "I felt the rain on my wedding day") without gaps or distortions that break the "first-person flow." Not just facts—raw, subjective memory.  
     - *Narrative yield*: If **no**, the copy might blank on key moments ("I... don’t recall that"), or recite memories coldly like data. Original’s loved ones react with disbelief ("You don’t remember our son’s birth?").  
     - *Verdict*: **No** → Not the same person. Stop here.  
     - *If unclear or partial*: Proceed.  

  2. **Does the copy share the original’s core character?**  
     - *What counts as sufficient*: Consistency in 2–3 defining traits (e.g., impulsiveness, empathy, humor) that shaped the original’s choices. New traits from divergence don’t disqualify unless they override the core (e.g., a gentle person becomes cruel).  
     - *Narrative yield*: If **no**, the copy acts "out of character" (e.g., a risk-taker now hesitates; a pacifist lashes out). Others notice: "You used to laugh at this—who are you?"  
     - *Verdict*: **No** → Not the same person. Stop here.  
     - *If traits are mixed*: Proceed.  

  3. **Does the copy claim to be the original, and is it recognized as such by those who mattered most?**  
     - *What counts as sufficient*:  
       - (a) The copy asserts identity unprompted ("I am her, I survived").  
       - (b) At least one key person (spouse, close friend) treats it as the original without coercion (e.g., hugs it, confides in it, mourns it as "back").  
     - *Narrative yield*: If **(a) and (b) are both true**, write affirmation: "It’s really you," or the copy insisting, "I kept my promise."  
       - If **(a) is true but (b) false**, the copy fights for recognition ("Believe me!"), while others reject it ("Imposter!").  
       - If **(a) false but (b) true**, the copy resists ("I’m not them"), but others project identity ("You’re all that’s left of her").  
     - *Verdict*: **Yes** → Same person (if both a and b). Stop here.  
       - If **only one is true**, proceed.  
       - If **neither is true**, **no** → Not the same person. Stop here.  

  4. **Is the copy continuing the original’s defining life project?**  
     - *What counts as sufficient*: The copy pursues a central, identity-defining goal of the original (e.g., an artist still paints, an activist leads the same movement). Not hobbies—projects that gave the original’s life meaning.  
     - *Narrative yield*: If **yes**, the copy finds purpose ("Her work must finish"); if **no**, it abandons the mission ("That was her dream, not mine").  
     - *Verdict*: **No** → Not the same person. Stop here.  
       - *If yes or ambiguous*: Proceed to Step 5.  

  5. **Value Judgment Handoff**  
     - *When you get here*: Facts are unclear or conflicting (e.g., memory gaps but strong recognition). No mechanical answer exists.  
     - *Narrative yield*: Force a choice based on the *stakes*. A lawyer argues legal precedent; a widow grapples with grief; a copy demands rights. Write the tension: "The law says no, but my heart says yes."  
     - *Verdict*: **Hand back to you**. Decide based on:  
       - Context: Is this about love (recognition matters most?), justice (memory/character?), or ethics (project continuation?).  
       - Narrative theme: Do you value continuity (favoring memory/character) or social bonds (favoring recognition)?  

  #### Key Features  
  - **Quick at your desk**: 2–5 minutes per copy-original pair.  
  - **Stops early**: 80% of cases resolve by Step 3.  
  - **Unstable verdicts**: Flagged below—small changes flip outcomes.  
  - **Jargon-free**: Uses "memory," "character," "claim identity," "recognized," "project."  

  ---

  ### Case Tests from Your Draft  
  **Case 1: Copy has every memory but none of the original’s character.**  
  - Step 1: **Yes**—Clear memory. (Narrative: Copies recite past events perfectly.)  
  - Step 2: **No**—Core character is gone. (Narrative: Original was patient; copy snaps, "Stop wasting my time!")  
  - Verdict: **No**—Not the same person.  
  - *Unstable?* No—Character loss is decisive here.  

  **Case 2: Copy shares almost nothing with the original (fails memory/character) but continues her project and is recognized by loved ones.**  
  - Step 1: **No**—Memories are missing. (Narrative: "I don’t remember our wedding, but I’ll finish your cancer research.")  
  - Verdict: **No**—Not the same person.  
  - *You’ll dislike this*: Recognition and project aren’t checked because Step 1 failed. Psych continuity tradition demands memory; Hofstadter needs the pattern’s "loop" to include self-memory.  
  - *Unstable?* Yes: If the copy had *some* memory (e.g., flashes of the lab where the project began), Step 1 passes → proceed to Step 3. Recognition (Step 3b) might then yield "yes."  

  **Case 3: Two copies claim to be the person who made a promise. Both diverged past "continuation."**  
  - **Copy A** (aggressive activist):  
    - Step 1: **Yes**—Remembers making the promise. (Narrative: "I vowed to protect the protest!")  
    - Step 2: **No**—Original was diplomatic; copy is violent. (Narrative: "You’d never have hurt anyone!")  
    - Verdict: **No**—Not the same person.  
  - **Copy B** (reclusive scholar):  
    - Step 1: **Yes**—Remembers the promise. (Narrative: "I promised to publish her research.")  
    - Step 2: **No**—Original was outgoing; copy is a hermit. (Narrative: "She’d never hide from the world!")  
    - Verdict: **No**—Not the same person.  
  - *But*: If either copy retained *one* core trait (e.g., the original’s stubbornness), Step 2 passes → Step 3. If loved ones recognize one copy (e.g., "She’s still stubborn as ever!"), Step 3b passes → **yes** for that copy.  
  - *Unstable?* Extremely: Recognition (Step 3b) or a single trait (Step 2) could flip a "no" to "yes."  

  ---

  ### What the Procedure Cannot Do  
  1. **Metaphysical decisions in disguise**:  
     - Step 3 (recognition) assumes Hofstadter’s view that identity is socially co-created. If your story rejects this, the procedure "feels objective" but isn’t.  
     - Step 4 (projects) prioritizes "what matters" over "what is identical"—a values call disguised as fact.  

  2. **Edge cases it gets wrong**:  
     - **Fading patterns**: A copy with spotty memory/character but intense recognition (e.g., a widow’s desperate belief) may be "yes" per Step 3, but feel false.  
     - **External forces**: If recognition is manipulated (e.g., a clone marketed as "the real one"), Step 3b may yield "yes" incorrectly.  
     - **Multiple copies**: The procedure treats copies individually. But if two copies pass Step 3, it can’t resolve which (if any) "is" the original—hand to Step 5.  

  3. **True gaps**:  
     - **Bodily continuity**: If a scene hinges on the physical body (e.g., "You killed *this* hand that touched me"), the procedure ignores it.  
     - **Emotional gut-feel**: A widow who *feels* her spouse is gone won’t be overruled by a "yes" verdict—write the dissonance.  
     - **Moral luck**: A copy guilty of murder may be "not the same person" but still bear responsibility. The procedure doesn’t handle blame—only identity.  

  **Final Tip**: Use unstable verdicts dramatically. A "no" flipped to "yes" by a single witness (Step 3b) creates tension—e.g., in a trial scene: "I don’t care what the tests say—*I know my husband*."
