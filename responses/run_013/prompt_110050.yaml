  But note: the case states they have diverged past the point of being the continuation. So we are leaning toward step 2 failing. Therefore, we say **no** for both.

  But to illustrate an unstable verdict, consider a small change: what if one of the copies is still recognized by the original's spouse as the same person? Then for that copy, step 3b passes. And step 3a passes (the copy claims to be the same). Then step 3 returns **yes** for that copy. The other copy, without recognition, might get a no at step 3b and then we proceed. So a small change in recognition flips the verdict for one copy.

