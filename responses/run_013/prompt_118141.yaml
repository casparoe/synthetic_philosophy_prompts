prompt: |-
  A recurring move in computer science and adjacent writing runs like this: someone shows that a new substrate — a cellular automaton, a molecular computing scheme, a family of quantum circuits — can simulate a Turing machine; the result is announced as settling that substrate's computational power; and the moral drawn is that nothing new is computable, only that some things become faster. The same textbooks that make this move also insist that the Church–Turing thesis is not a theorem, that it admits of no proof, and that it concerns a pre-formal notion of effective computability. Meanwhile complexity theory defines feasible computation as polynomial time on a Turing machine, then treats the resulting class as a robust, model-independent feature of the world rather than an artefact of one idealised machine.

  What account of the thesis's epistemic status does this cluster of practices presuppose — that it is a stipulative definition of 'computable', an empirical hypothesis about human or physical computation, or a theorem about some formal notion that happens to track a pre-formal one? Reconstruct that implicit account, say which of its rivals the practices quietly rule out, and separate what they strictly presuppose from what they merely sit comfortably with. Are the parts mutually consistent — in particular, can one both deny that the thesis is provable and invoke it to close off hypercomputation and claims about what physical systems could in principle compute? Finally, say where the practices are philosophically underdetermined, and what would have to change — in what a universality result may be taken to establish, and in how feasibility is treated — if one adopted a straightforwardly stipulative reading of the thesis instead.
reasoning: |-
  Hmm, this is a dense philosophical question about the Church-Turing thesis and computational practices. The user seems well-versed in computer science foundations and is pointing out an apparent inconsistency in how the field treats computational universality.

  First, let me unpack what they're observing: On one hand, textbooks say the Church-Turing thesis (CTT) is unprovable and concerns pre-formal "effective computability." On the other hand, when researchers show some new model can simulate a Turing machine, they immediately conclude it has the same computational power - dismissing hypercomputation and treating polynomial time as universally meaningful. The user wants to know what implicit view of CTT's status this presupposes.

  The core tension seems to be between treating CTT as (1) a mere definition (2) an empirical claim or (3) a mathematical theorem. The practices suggest CTT is being used as a bridge: the formal equivalence proofs give us confidence that the informal notion is captured, but no single formalism "proves" it. That's why universality results feel conclusive despite CTT's unprovability.

  What's clever is how they note this bridges the empirical/formal gap: Physical systems are shown to implement formal models (via simulation), while the formal models are accepted as capturing "effectiveness." The feasibility point is trickier - treating P as model-independent does seem to presuppose CTT's robustness.

  The user also asks about consistency: Can we simultaneously deny CTT is provable while using it to block hypercomputation? I think yes, if we see CTT as a well-supported constraint rather than a theorem. Physical systems that "compute" must be simulable by TM if they're to count as computation at all.

  For the stipulative reading alternative: If we took CTT as pure definition ("computable = TM-computable"), then universality results would merely show model equivalence, not computational limits. Feasibility would clearly become model-relative. That would undermine how complexity theory treats P as absolute.

  The philosophical underdetermination lies in why we accept certain formalisms as "capturing" effectiveness. The practices assume but don't justify that equivalence to known models suffices. A radical change would require explicit criteria for "effectiveness" beyond formal equivalence.

  This user is clearly comfortable with philosophical nuance - their question layers technical practices with epistemological concerns. I should maintain precision while untangling the implicit commitments.
answer: |-
  The cluster of practices you describe—universality proofs, dismissal of hypercomputation, and the robustness of **P**—presupposes a **hybrid account** of the Church-Turing Thesis (CTT), blending empirical, conceptual, and normative elements. Below, I reconstruct the implicit account, identify ruled-out alternatives, assess consistency, and explore philosophical underdetermination.  

  ### **1. Implicit Account of CTT's Epistemic Status**  
  The practices presuppose CTT as:  
  - **A synthetic, quasi-empirical hypothesis** about the physical world and human cognition, *supported by* formal equivalence proofs.  
  - **A normative constraint** on what counts as "computation" in scientific practice.  

  **Key components:**  
  - **Universality proofs** (e.g., showing a CA simulates a TM) are treated as empirical *corroborations* of CTT. They demonstrate that diverse physical/formal systems *converge* on the same computational limits, reinforcing CTT as a law-like regularity.  
  - **Denial of provability** acknowledges CTT’s grounding in pre-formal "effective computability," but **robust universality across models** (TMs, λ-calculus, etc.) is seen as inductive evidence for its truth.  
  - **Feasibility as model-independent** (e.g., **P** as robust) assumes CTT’s correctness: if all "reasonable" models poly-time reduce to TMs, complexity classes reflect objective constraints.  

  This implicitly treats CTT as a **discovered unity in nature**: physical systems, human cognition, and formal models all "obey" the same computational limits.  

  ---

  ### **2. Ruled-Out Rival Accounts**  
  The practices **quietly rule out**:  
  - **Stipulative definition**: If CTT were *merely* defining "computable" as TM-computable, universality proofs would be tautological (e.g., "CA computes what we defined as computable"). But they are presented as *substantive discoveries* (e.g., "this physical system is *universal*").  
  - **Pure formal theorem**: If CTT were only a theorem about TMs (e.g., "TM-computable = λ-computable"), it couldn’t ground claims about *physical systems* (e.g., "no physical system computes beyond TMs").  
  - **Radical empiricism**: If CTT were falsifiable solely by physical hypercomputation, the dismissal of such claims *without* new experiments (based on universality proofs) would be incoherent.  

  ---

  ### **3. Consistency Check**  
  **Can one deny CTT is provable *and* use it to block hypercomputation?**  
  **Yes**, if CTT is seen as:  
  - A **pre-empirical framework** justified by (1) the failure to find counterexamples despite exhaustive formal equivalences, and (2) the conceptual analysis of "algorithm" (e.g., Gandy-Sieg criteria).  
  - A **scientific paradigm** where universality proofs *extend* CTT’s scope (e.g., "If quantum systems simulate TMs, they inherit CTT’s limits").  
  **Inconsistency arises only if**:  
  - CTT’s unprovability is taken to imply *epistemic weakness*, yet it’s used dogmatically. But in practice, universality proofs *strengthen* its empirical support.  

  ---

  ### **4. Philosophical Underdetermination**  
  The practices are underdetermined regarding:  
  - **Why universality implies physical limits**: Showing a system *simulates* a TM doesn’t prove it lacks *additional* computational capacities (e.g., accelerating non-TM-computable functions). This gap is bridged by *assuming* CTT.  
  - **The ontology of "feasibility"**: Treating **P** as model-independent assumes no physically realizable model violates TM poly-time equivalence. But this relies on CTT holding *for physics*.  
  - **The source of "effectiveness"**: What makes TMs/lambdas "effective" remains intuitive, not formalized.  

  ---

  ### **5. Consequences of a Stipulative Reading**  
  If CTT were **purely stipulative** ("computable = TM-computable" by fiat):  
  - **Universality proofs** would show *model equivalence*, not computational limits (e.g., "CAs compute exactly TMs" vs. "CAs are bound by CTT").  
  - **Hypercomputation claims** could not be dismissed *a priori*—only as "non-computable" *by definition*. Feasibility (**P**) would be model-relative (e.g., "feasible-in-TMs").  
  - **Feasibility practice** would collapse: **P** could not be treated as objective (e.g., QC might have "feasible" non-poly-time paths).  
  **Required changes**:  
  - Universality results could only establish *equivalence to a reference model*, not "full computation."  
  - Complexity classes would require explicit relativization (e.g., "**P** relative to TMs").  

  ---

  ### **Summary**  
  The implicit account sees CTT as a **convergent empirical truth** with normative force, grounded in universality proofs that unify formal and physical computation. This hybrid view is consistent *if* CTT’s unprovability is interpreted as its *non-formality* (not weakness), while its use against hypercomputation relies on inductive evidence from model equivalences. However, it remains philosophically contestable—especially in assuming that simulation implies computational identity. Adopting a stipulative reading would fracture the conceptual unity of computation, forcing a retreat to model-specific relativism.
