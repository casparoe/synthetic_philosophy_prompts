  The gentrification context adds layers. When old-timers claim persistence despite physical changes, they're asserting ownership of the narrative thread. A perdurantist can accommodate this through gen-identity relations without strict identity. The temporal worm framework actually helps analyze power dynamics in whose narrative gets privileged.

  On moral responsibility: the user's worry about blame/promise-keeping needs addressing. Parfit's psychological continuity theory offers a path - responsibility attaches to person-stages appropriately connected. The "I" pronoun doesn't denote identity but a continuity relation.

  I should emphasize that perdurantism's value lies in its explanatory power for change. The neighborhood worm captures both continuity and displacement simultaneously in ways endurantism struggles with. The old-timers aren't wrong - they're tracking genuine causal-narrative threads within the larger worm.

