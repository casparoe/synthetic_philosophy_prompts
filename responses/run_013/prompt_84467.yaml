  ok so my roommate in phil of physics has finally conviced me that the block universe is true, and I just assumed that means I have to be a perdurantist — objects have temporal parts, endurantism is dead, done. I can live with that. But I'm writing a chapter on gentrification and collective memory and it keeps tripping me up in a way I suspect is embarrasing. If the neighborhood is a four-dimensional worm, then the 1980 neighborhood and today's neighborhood are two different things and the worm is just the sequence of them. So when the old-timers say 'this is still my neighborhood, it's just changed' — are they literally wrong? Then it gets worse. If tomorrow's me is a different temporal part, then no part of me is in him, so he can't keep my promises or be blamed for what I did yesterday, and honestly the worm isn't really me anyway, it's just a big object that has me stuck onto it as a part. At that point it feels like perdurantism has talked itself out of everything we wanted a theory of persistence for, and I end up thinking the endurantists win by default. What am I missing? Everyone I ask either points me at the SEP or starts yelling about McTaggart.
