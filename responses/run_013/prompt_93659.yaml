answer: |-
  You're absolutely right to suspect this "mic-drop" line bundles multiple distinct claims, and your friend is likely equivocating between them. Strawson's "Basic Argument" is indeed the heavyweight version, but the one-liner works by exploiting ambiguity. Let's dissect the precise assertions behind "you'd have to have made yourself" and evaluate each for truth/contentiousness and whether it supports your friend's "no blame" conclusion. Crucially, **most readings don't kill ordinary blame**; they only attack an extreme, ultramaximalist notion of responsibility. The argument *does* work without determinism, which strengthens the regress claim.

  Here's the menu of interpretations, with verdicts and relevance to blame:

  ### The Menu: Interpretations of "You'd Have to Have Made Yourself"

  1.  **Claim Type: Causation (Starting Conditions)**
      *   **What it asserts:** You are not the *ultimate cause* of your fundamental starting materials (genes, initial environment, early childhood shaping). These were given to you; you didn't choose or create them.
      *   **Truth Status:** **Trivially True.** Nobody caused their own conception, genetic makeup, or formative childhood environment. These are brute facts of existence.
      *   **Supports 'No Blame'?** **NO.** This only negates responsibility for *being born with certain traits or into certain circumstances*. It says nothing about responsibility for *actions* taken *later*, given those traits/circumstances. Ordinary blame focuses on actions and choices made *within* one's developed capacities and context. This claim is true but irrelevant to blaming someone for, say, committing a robbery as an adult.
      *   **Harmless?** **YES.** Acknowledging this doesn't threaten everyday moral practices.

  2.  **Claim Type: Regress (Ultimate Source of Reasons/Character)**
      *   **What it asserts:** For you to be truly responsible for an action (Choice Z), you must be responsible for the reasons/character/values that led to Choice Z. But those reasons/character/values (State Y) were caused by prior states (genetics, environment, prior choices, etc.). To be responsible for State Y, you'd need to be responsible for the state that caused *it* (State X), and so on, back to your starting conditions. Since you aren't responsible for your starting conditions (Claim 1), this regress means you can never be the *ultimate source* of any choice – it always traces back to something unchosen.
      *   **Truth Status:** **Genuinely Contentious.** This is the core of Strawson's argument (and similar arguments from hard incompatibilists). It highlights the dependency of choices on prior shaping. *However*, compatibilists (the majority view) strongly reject that responsibility requires being the *ultimate* source. They argue responsibility requires *reasons-responsiveness* and *ownership* of one's *current* character/values in action, regardless of their origin. They see the regress as irrelevant to practical responsibility.
      *   **Supports 'No Blame'?** **ONLY IF YOU ACCEPT THE REGRESS AS FATAL.** If you believe true responsibility *requires* being the ultimate, uncaused source of your character (ultramaximalism), then yes, this argument kills all blame. However, if you accept compatibilism (that responsibility arises from how choices flow from *your* reasons/character *now*, even if shaped), ordinary blame remains intact. **This is the reading your friend *needs* for his conclusion, but it's highly contested.**
      *   **Harmless?** **NO.** This is the contentious core. If accepted, it *does* kill all blame. But its premise (that responsibility requires ultimacy) is rejected by most philosophers and our everyday practices.

  3.  **Claim Type: Definition of Responsibility (Causa Sui)**
      *   **What it asserts:** Responsibility, *by definition*, requires being *causa sui* (self-caused) – the uncaused cause of your entire being. Anything less is not "true" responsibility.
      *   **Truth Status:** **Genuinely Contentious (and likely false as a necessary condition).** This defines responsibility in an extremely demanding, arguably impossible way. It conflates *metaphysical* ultimacy with *moral* responsibility. Most philosophers and ordinary language distinguish them. We hold people responsible for choices made *from* their character, not for *being* that character in an ultimate sense. Defining responsibility this way makes it incoherent by fiat.
      *   **Supports 'No Blame'?** **ONLY BY DEFINITIONAL FIAT.** If you define "responsibility" *exclusively* as being *causa sui*, then yes, it's impossible, and blame evaporates. **This is another reading your friend might *implicitly* rely on.** However, this definition is arbitrary and rejects the common, practical understanding of responsibility used in law and daily life. It's a rhetorical sleight-of-hand: redefining responsibility to be impossible so blame disappears.
      *   **Harmless?** **NO.** Used this way, it's a definitional trick designed specifically to eliminate blame.

  4.  **Claim Type: Logical Incoherence (Pre-Existence)**
      *   **What it asserts:** The very idea of "making yourself" is logically impossible. To make yourself, you would need to exist *prior* to yourself to do the making, which is absurd (*causa sui* is logically incoherent).
      *   **Truth Status:** **Trivially True.** This is a straightforward logical point. You cannot cause your own existence because causation requires an existing entity to cause the effect.
      *   **Supports 'No Blame'?** **NO.** This only shows that *literal self-creation* is impossible. It says nothing about whether responsibility requires this impossibility. Since no plausible theory of responsibility *actually* requires literal self-creation (not even the *causa sui* definition requires *temporal* precedence), this is attacking a straw man. Ordinary responsibility doesn't demand you built yourself from scratch in a time machine.
      *   **Harmless?** **YES.** It points out an obvious logical absurdity that isn't actually required for moral responsibility as commonly understood.

  ### The "Works Without Determinism" Point Explained
  *   The **Regress Claim (2)** is why this argument doesn't need determinism. Imagine libertarian free will exists: your choices are truly undetermined, spontaneous breaks in causality.
  *   **Why the regress still applies:** Even if Choice Z is undetermined, *why did YOU make THAT undetermined choice?* It presumably flowed from *your* reasons, character, desires, or values at that moment (State Y). The argument asks: Are *you* responsible for *having those specific reasons/character/desires/values (State Y)* that led to *that specific* undetermined choice? The regress kicks in: State Y was shaped by prior undetermined choices or brute facts about your starting point. If you aren't ultimately responsible for State Y (because of the regress back to unchosen starts), then even an undetermined choice Z is seen as ultimately "arbitrary" from *your* perspective, not truly authored by *you* in the ultramaximal sense. **The problem isn't just causal determination; it's the *source* of the character/values that produce choices (determined or not).** This makes the Regress Claim particularly powerful against libertarian free will.

  ### Verdict on Your Friend's Move & The Slide
  *   **Which readings support "no blame at all"?** Only the **Regress Claim (2)** and the **Definitional Claim (3)** (if accepted) get him there.
  *   **The Slide:** Your friend is almost certainly starting with the **Trivially True claims (1 or 4)** – "You didn't cause your genes/childhood!" or "Making yourself is impossible!" – which are undeniable but harmless. He then **slides** into the **Regress Claim (2)** or **Definitional Claim (3)**, implying that because you didn't *ultimately* cause your starting point, you can't be responsible *at all* for your actions. This slide relies on confusing:
      *   Responsibility for *starting conditions* vs. responsibility for *actions*.
      *   Responsibility requiring *absolute ultimacy* (which is impossible) vs. responsibility requiring *ownership/control within one's developed capacities* (which is possible).
  *   **Why it feels powerful:** The Trivially True claims resonate. The slide to the Regress/Definitional claims leverages that resonance to make the impossible ultimacy requirement *seem* necessary. The "works without determinism" point makes it harder to escape via free will.
  *   **The Harmless Truth:** The Causation Claim (1) and Incoherence Claim (4) are true but **harmless** to ordinary blame. They only negate impossible, hyper-demanding notions of responsibility nobody actually uses. Your friend's conclusion **only follows** if one accepts the contentious Regress premise (that responsibility *requires* ultimacy) or the arbitrary Definitional premise (that responsibility *just means* *causa sui*).
  *   **Your Suspicion is Correct:** The slogan bundles harmless truths with contentious claims. Your friend grabs the harmless truth for rhetorical force ("See? You didn't make yourself!") but needs the contentious claim for his conclusion ("Therefore, no blame!"). Most readings leave ordinary blame (holding people accountable for harmful actions flowing from their own reasons and character) completely intact. The slogan only kills blame if you define responsibility in an unrealistically extreme way.
