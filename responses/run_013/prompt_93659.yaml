  Okay, the user is dealing with a philosophical one-liner that's used to dismiss blame: "you can't be responsible for who you are because you didn't make yourself." They've encountered it in arguments, most recently from a friend defending someone who did something awful by saying the person isn't blameworthy since they didn't choose their genes or upbringing. The user suspects this argument bundles multiple claims and wants them disentangled. They reference Galen Strawson's "Basic Argument" but focus on the slogan itself.

  First, I need to break down the possible interpretations of "you'd have to have made yourself." The user listed several angles: causation (not causing one's starting materials), regress (choices trace back to unchosen factors), responsibility definition (requiring being causa sui), and incoherence (existing before existing). For each, I should assess truth value and relevance to blame. Also, the user mentioned this argument works without determinism, so I must address libertarian free will.

  The user's core concern is which interpretation supports their friend's claim that blame evaporates entirely. They suspect most readings only challenge a hyper-demanding responsibility, leaving everyday blame intact, and that their friend is equivocating between strong and weak versions. They want a menu-like breakdown with verdicts per interpretation, plus identification of harmless truths.

  Starting with the interpretations: 

  1. Causation claim: True but trivial. Not causing your initial conditions doesn't negate responsibility for actions, only god-like self-creation. Verdict: Doesn't support friend.

  2. Regress claim: Contentious (Strawson's core argument). If every reason traces back to unchosen causes, true responsibility requires impossible self-creation. But compatibilists reject this, saying reasons-responsive actions suffice. Verdict: Only supports friend if we accept the regress as fatal—which is debated.

  3. Responsibility definition claim: Contentious. If responsibility requires being causa sui, then yes, it's impossible. But this is a niche, ultramaximalist view; ordinary blame doesn't demand this. Verdict: Only supports friend if we adopt this extreme definition.

  4. Incoherence claim: True and trivial. Self-creation is logically impossible. But since no one thinks responsibility requires this, it's a straw man. Verdict: Doesn't support friend.

  The "works without determinism" point: The regress claim applies even if choices are uncaused (libertarianism), because your character/values—shaped by unchosen factors—still determine choices. So indeterminism doesn't solve it. This makes the regress reading stronger against libertarians but still contentious.

  Harmless truths: Causation and incoherence claims are true but irrelevant to ordinary blame. The friend might use them rhetorically to imply more than they do.

  Which readings support "no blame at all"? Only the regress and definition claims—if accepted. But both are contested, and the definition claim is extreme. The friend likely conflates the trivial truths (e.g., "didn't make myself") with the contentious regress claim to make blame seem impossible.

  User's suspicion is spot-on: The slogan mixes harmless points with debatable ones, creating a slide from "can't be causa sui" to "can't be responsible for anything." The friend's move only works if we accept the regress as fatal or the ultramaximalist definition—both of which have strong counterarguments.

