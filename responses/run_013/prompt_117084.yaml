prompt: |-
  I'm teaching the epistemology core seminar and I'm halfway through a stack of midterms at 1am, and I've hit one answer that I keep flip-flopping on, which usally means I'm missing something. I'd rather not grade it on vibes, so can you give me a proper assessment?

  The question was Q3, worth 20 of the 100 points:

  Q3 (20 points). The accuracy-dominance argument for probabilism is often advertised as a purely epistemic vindication of the demand that our credences obey the probability calculus.
  (a) Reconstruct the argument, saying explicitly what it assumes about (i) the scoring rule used to measure accuracy and (ii) what the agent herself cares about.
  (b) Is the argument unconditional — does it apply to any agent, whatever her values? Explain.
  (c) Does the same style of argument extend to conditionalization: does it show that an agent who fails to conditionalize on her evidence is accuracy-dominated? Explain.

  Here's the answer:

  (a) The argument starts with the idea of a scoring rule: a function that takes a credence function and a world and returns a number saying how accurate those credences are at that world. The central result is that any credence function that violates the probability axioms is dominated by some coherent, probabilistic credence function — in every possible world, the coherent one scores better. The scoring rule has to be strictly proper for this to go through, i.e. each probability function has to uniquely maximise its own expected score. What the argument delivers is an epistemic reason to be coherent: incoherent credences aren't only bad because they leave you open to a Dutch book, they're bad because there's a credence function you could have instead that is guaranteed to be more accurate.

  (b) It's unconditional, and that's the main selling point. Dominance is a sure-thing argument: you do worse in every world, not merely on average, so no assumptions about the agent's goals or about what she's trying to do are needed. Even an agent who doesn't care about accuracy is irrational if her credences are incoherent, since she's then in a dominated position and rational choice theory forbids choosing dominated options. This is what makes it a genuine advance over the Dutch book argument, which only shows that you'd be exploitable if you were willing to bet at the implied odds.

  (c) The same argument extends to conditionalization. Given a strictly proper scoring rule, an agent who fails to conditionalize on her evidence is dominated by one who does — conditionalizing gets her closer to the truth, whatever the world turns out to be. In the literature this is usually put in terms of expected accuracy instead, but I take that to be the same point restated, since dominance is just expected accuracy in the special case where one option wins everywhere. So the framework gives us both probabilism and conditionalization, and it does so for any strictly proper scoring rule, so neither result is an artifact of the Brier score.

  What I want back: a grade out of 20, and then the comments I'd write in the margins, part by part — what's actually right, what's wrong or unsupported, and what a tired grader would be tempted to wave through. Where something is subtly off rather than flatly wrong, tell me why, in a line or two I can hand back, and if a common misreading is what makes the wrong bits sound right, name it. If you find more than one problem, say whether they're seperate problems or one mistake wearing two hats. No citations or reading lists needed, just the assessment.
reasoning: |-
  Alright, let me tackle this epistemology grading dilemma. The professor needs a precise assessment of this midterm answer on the accuracy-dominance argument for probabilism and conditionalization. 

  First, I'll break down each part systematically. For (a), the student correctly identifies the core argument: incoherent credences are accuracy-dominated by coherent ones under strictly proper scoring rules. They nail the key points about dominance being world-wise and the scoring rule requirement. But they missed explaining what "the agent cares about" - the argument assumes agents want to avoid dominated positions, not that they explicitly value accuracy. That's a subtle but important omission worth deducting 1 point for.

  Moving to (b), the student's claim that the argument is "unconditional" needs correction. While dominance arguments are strong, they're not value-free. The argument presupposes the agent cares about having undominated credences - it's not magically applicable to agents who reject dominance avoidance altogether. This conflation of structural rationality with universal applicability is a significant error, so 3 points off feels right.

  For (c), the conditionalization extension is where the student goes fully off-track. Accuracy-dominance doesn't directly apply to update rules - instead, Greaves and Wallace proved conditionalization maximizes expected accuracy. The student's "wins everywhere" phrasing reveals a fundamental misunderstanding of how the argument works. Since this misrepresents the core mechanism, 4 points deduction is necessary.

  The point distribution makes sense: 12/20 reflects the solid grasp of probabilism's argument while flagging the serious conditionalization error. Marginal comments should emphasize that (a) was nearly perfect but incomplete, (b) overstated universality, and (c) fundamentally confused the nature of the conditionalization argument. The tired grader temptation to overlook the conditionalization error is real - it's an easy mistake if one assumes symmetry between the two arguments - but it's too substantive to ignore.

  Overall, this answer shows good comprehension of probabilism but stumbles on deeper philosophical nuances about value assumptions and update rules. The grade should reward the strong foundation while clearly marking where the reasoning cracks.
answer: |-
  ### Grading Summary  
  **Overall Score: 12/20**  
  (A: 5/7, B: 4/7, C: 3/6)  

  ---

  ### Marginal Comments (Part-by-Part)  
  **Q3(a) Reconstruct the argument (7 points)**  
  ✅ **What’s right:**  
  - Correctly identifies the core dominance result: incoherent credences are accuracy-dominated by coherent ones in *every* world.  
  - Properly notes the scoring rule must be **strictly proper**.  
  - Clear explanation of the epistemic advantage over Dutch books.  

  ⚠️ **What’s subtly off:**  
  - **Missing assumption about the agent’s values:** The argument assumes the agent cares about *avoiding dominated options* (structural rationality), not that she explicitly values accuracy. You note the dominance is "sure-thing," but don’t explicitly state that the agent must accept dominance avoidance as a rational requirement.  
  - **Clarify "what the agent cares about":** The argument hinges on agents valuing *non-dominance* (i.e., rejecting credences strictly worse in all worlds), not necessarily "accuracy" as a goal.  

  📝 **Tired Grader Temptation:** Wave through the reconstruction (it’s 90% solid), but the omission of the dominance-avoidance norm is a key gap.  
  **Deduction: –2 points**  

  ---

  **Q3(b) Is the argument unconditional? (7 points)**  
  ❌ **What’s wrong:**  
  - **Overclaims universality:** The argument is **not** "unconditional." It assumes the agent accepts **dominance avoidance** as a rational constraint. If an agent *rejects* this norm (e.g., a "risk-seeking" agent who embraces dominated options), the argument doesn’t apply.  
  - **Misreads "unconditional":** The selling point is that it doesn’t require *practical* goals (e.g., avoiding Dutch books), but it *does* presuppose a *structural epistemic norm* (avoiding strictly dominated credences).  

  💡 **Why it sounds right:** Confusing "no practical assumptions" with "no normative assumptions." The target isn’t an agent with *any* values—only those accepting dominance avoidance.  

  📝 **Tired Grader Temptation:** The Dutch book comparison is sharp, but the universality claim is a critical error.  
  **Deduction: –3 points**  

  ---

  **Q3(c) Extension to conditionalization (6 points)**  
  ❌ **What’s wrong:**  
  - **False claim about dominance:** An agent who fails to conditionalize is **not** accuracy-dominated in *every world*. The result is **not** a dominance argument but an *expected-accuracy* one: conditionalizing maximizes *expected* accuracy *relative to the prior*.  
  - **Key misstep:** Dominance requires one strategy to be better in *all* worlds. Failing to conditionalize can yield *better* accuracy in *some* worlds (e.g., if the evidence is misleading).  
  - **Misconception:** You conflate dominance ("wins everywhere") with expected-accuracy maximization. These are distinct; the latter depends on the prior.  

  🔍 **Root issue:** Mistaking the *form* of the argument for probabilism (dominance) for conditionalization (which uses expected accuracy given evidence).  

  📝 **Tired Grader Temptation:** The mention of "expected accuracy" hints at awareness, but the explicit "dominated in every world" is flatly incorrect.  
  **Deduction: –3 points**  

  ---

  ### Overall Feedback  
  **Strengths:** Clear grasp of probabilism’s dominance argument and strictly proper scoring rules. Good contrast with Dutch books.  
  **Weaknesses:**  
  1. **Under-specified norms:** Missed that dominance arguments rely on agents accepting dominance avoidance (Q3b).  
  2. **Conditionalization ≠ Dominance:** Fundamental error in treating updating rules like coherence (Q3c).  
  **Key Insight:** Probabilism uses **dominance**; conditionalization uses **expected-accuracy maximization**. They share a scoring-rule framework but deploy different rationales.  

  **Final Note:** A strong effort on probabilism, but conditionalization tripped you up—a common pitfall! Review Greaves & Wallace’s expected-accuracy proof for updating.  

  ---  
  **Grading Key:**  
  - A: –2 (minor omission)  
  - B: –3 (substantive normative error)  
  - C: –3 (major conceptual confusion)
