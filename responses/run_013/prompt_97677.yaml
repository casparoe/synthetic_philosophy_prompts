prompt: |-
  I am a doctoral student in public policy who has been sitting in on a philosophy department reading group on welfare and social choice, and I have become fixated on an argumentative move that I keep encountering and cannot name. It is easiest to see in two contrasting instances. In the first, someone objects to a cost-benefit analysis by insisting that you simply cannot compare one person's suffering with another's, because there is no common yardstick; the room nods along, and yet the same speaker, ten minutes later, will say without hesitation that a person in agony is worse off than a person who is mildly annoyed, and no one treats this as a retraction. In the second instance, a different speaker defends interpersonal comparison by pointing out that we make such judgments constantly and usually agree about them, and then, without any further argument, treats this as having established that there is a single scale on which all these amounts can be placed and summed. What strikes me is that in both cases a modest claim is quietly exchanged for a much stronger one, and that the exchange runs in opposite directions: in the first, an inability to locate a common unit is treated as settling that there is no fact of the matter about who is worse off; in the second, an ability to rank people in easy cases is treated as settling that there is a common unit. I suspect these are in fact several distinct claims — that there is no fact about the ranking, that we cannot reliably know the ranking, that there is no shared unit, that there is no shared zero point, that the resulting numbers cannot be meaningfully added — and that much of the heat in these debates comes from parties who have collapsed them into one another. I also suspect the collapse is not innocent, because the practical question (may we weigh one person's gain against another's loss, and by how much?) seems to require only some of these claims and not others.

  I would like you to act as a philosopher of economics and social choice and help me carve this up. First, is there an established term, distinction, or body of work for this pattern of slides — where a claim about measurability or knowability is swapped for a claim about whether the comparison is meaningful at all, and vice versa? If there is, name it and state precisely which of the distinct claims above it actually covers; if there is not, coin a term, define it, and give me boundary cases showing what falls inside and outside it. In either case, I want the carving more than the label: lay out the distinct claims explicitly, tell me which ones entail which and which are independent, and identify which one (or ones) the practical aggregation question really turns on. Compare your answer to the nearest established concepts you can think of — they may come from measurement theory, welfare economics, or elsewhere — and for each say exactly how it differs from the phenomenon I have described. Do not bother with a reading list or citations; I cannot look anything up right now and want the conceptual work done in front of me. Please think carefully, begin by brainstorming the candidate distinctions before committing to one, and finish with a single line beginning "Verdict:" that states either the established term or "no established term" followed by your proposed term.
reasoning: |-
  Hmm, the user is a doctoral student in public policy who's attending a philosophy reading group on welfare and social choice. They've noticed a recurring argumentative pattern where speakers slide between different claims about interpersonal comparisons of welfare. Specifically, they describe two instances: one where someone moves from "no common yardstick" to "no fact of the matter" about who is worse off, and another where someone moves from "we can make judgments in easy cases" to "there is a common unit for summing." They suspect there are several distinct claims being conflated and want help disentangling them.

  The user wants me to act as a philosopher of economics and social choice to analyze this. They're asking for an established term for this pattern of slides, or to coin one if none exists. More importantly, they want a clear conceptual breakdown: what distinct claims are involved, how they relate to each other (entailments and independencies), and which ones are actually relevant for practical aggregation questions. They also want comparisons to nearest established concepts, with precise differences noted.

  First, I need to identify the distinct claims involved here. Based on their description, I can see at least five separable propositions:
  1. Existence of ordinal comparisons (can we say A is worse off than B?)
  2. Existence of a common unit (is there a single scale for measuring welfare differences?)
  3. Additivity (can we sum welfare across individuals?)
  4. Knowability (can we reliably determine interpersonal comparisons?)
  5. Measurability (can we assign meaningful cardinal values?)

  The user is right that these are often conflated. The first slide they described (from "no common unit" to "no fact about ranking") conflates #2 with #1. The second slide (from agreement in easy cases to existence of common unit) conflates #1 (in limited cases) with #2 and possibly #3.

  For practical policy questions about weighing gains against losses, we primarily need #1 (ordinal interpersonal comparisons) and possibly #2 (a common unit) if we want to quantify trade-offs, but we don't necessarily need full additivity (#3). Knowability (#4) is crucial for implementation but separate from existence.

  Now, is there an established term for this specific pattern of slides? I'm considering concepts like the "fact-value distinction," but that's not quite right. "Commensurability" in philosophy sometimes refers to whether values can be compared, but it's broader. In measurement theory, there's "scale types" (ordinal, interval, ratio), but that doesn't capture the slide between them. I think what they're describing doesn't have a standard name - it's a particular rhetorical move that conflates distinct metaphysical, epistemological and practical claims.

  The nearest established concepts would be:
  - Interpersonal comparability in welfare economics (which distinguishes ordinal vs cardinal comparability)
  - The epistemic challenge of other minds (how can we know others' mental states?)
  - The aggregation problem in social choice (how to combine individual preferences into social welfare)

  But each differs from what the user describes. Interpersonal comparability debates usually keep the distinctions clearer. The other minds problem is purely epistemological. Aggregation assumes comparability rather than conflating claims.

  Since I don't think there's an established term, I'll coin one: "comparative scope collapse" - where limitations or permissions regarding one aspect of comparison are illegitimately extended to others. The "scope" refers to which types of comparisons are possible (ordinal, cardinal, additive).

  For the conceptual breakdown, I'll map out the five claims, show that:
  - #1 (ordinal comparisons) can exist without #2 (common unit), as in Arrow's framework
  - #2 (common unit) implies #1 but not vice versa
  - #3 (additivity) requires #2 but #2 doesn't imply #3
  - #4 (knowability) is independent but practically crucial
  - #5 (measurability) relates to #2 but adds precision requirements

  For practical aggregation, we need at least #1 and #4 to make any comparative judgments. For quantified trade-offs, we need #2. Full cost-benefit summation requires #2 and #3.

  Finally, my verdict will be that there's no established term, so I'll propose "comparative scope collapse" with clear boundaries. I'll make sure to emphasize that the practical question turns primarily on ordinally meaningful interpersonal comparisons (can we say whose loss is greater?) rather than requiring a full common unit or additivity.
answer: |-
  ### Conceptual Carving: The Slides in Interpersonal Comparison

  Your observation identifies a systematic conflation across multiple dimensions of interpersonal welfare comparisons. I'll first brainstorm the distinct claims, then analyze their relationships, identify the practical core, compare to established concepts, and finally address the terminological question.

  ---

  ### Brainstormed Distinct Claims (Metaphysical & Epistemic)
  1. **Ordinal Comparability (O)**: It is *meaningful* to say "Person A is worse off than Person B" in some cases (e.g., agony vs. mild annoyance).  
  2. **Cardinal Comparability (C)**: Welfare differences can be measured on a *common numerical scale* (e.g., A’s pain is "twice as bad" as B’s).  
  3. **Additivity (A)**: Welfare units can be *summed across individuals* (e.g., −10 utils for A + +5 utils for B = net −5).  
  4. **Full Knowability (K)**: We can *reliably know* interpersonal comparisons in most/all cases.  
  5. **Common Zero Point (Z)**: There is an *intersubjectively shared baseline* for "zero welfare" (e.g., neutrality between pain/pleasure).  

  **The Collapses You Observed**:  
  - **First Speaker**: Denies **C** → Illegitimately infers denial of **O**.  
  - **Second Speaker**: Affirms **O** in easy cases → Illegitimately infers **C** (and often **A**).  

  ---

  ### Entailments and Independences  
  | Claim | Entails | Independent Of |  
  |-------|---------|---------------|  
  | **O** | None | **C**, **A**, **Z**, **K** |  
  | **C** | **O** (if differences are comparable, ordinal ranks exist) | **A**, **Z**, **K** |  
  | **A** | **C** (summation requires a common unit) | **O**, **Z**, **K** |  
  | **Z** | None | **O**, **C**, **A**, **K** |  
  | **K** | None | **O**, **C**, **A**, **Z** |  

  **Key Dependencies**:  
  - **A** requires **C**, but **C** does not require **A** (e.g., comparable ratios without additivity).  
  - **O** does **not** require **C**, **A**, **Z**, or **K**. We can have meaningful ordinal comparisons even with unknown magnitudes or no common zero.  
  - **C** typically presupposes **Z** (meaningful ratios require a zero), but **O** does not.  

  ---

  ### What the Practical Aggregation Question Turns On  
  - **Minimal Requirement**: **O** + partial **K** (we need ordinally meaningful comparisons *and* sufficient knowledge to apply them in policy-relevant cases).  
  - **Cost-Benefit Analysis (CBA) Requirement**: **C** + **A** + **K**. However:  
    - **CBA can function weakly without C/A**: If we have **O** and rough **K**, we can prioritize cases where one party’s loss clearly dominates another’s gain (e.g., agony vs. minor inconvenience).  
    - **The core practical error**: Assuming **CBA requires all-or-nothing validation** of **C/A**. In reality, **O** (+ **K**) suffices for *many* (but not all) policy trade-offs.  

  ---

  ### Comparison to Established Concepts  
  1. **Interpersonal Comparability (Welfare Economics)**:  
     - *Difference*: Typically distinguishes *ordinal* (O) vs. *cardinal* (C/A) but often conflates epistemic (**K**) and metaphysical (**O**, **C**) layers. Your cases show intra-level slides (e.g., **C**↔**O**).  
  2. **Other Minds Problem (Philosophy of Mind)**:  
     - *Difference*: Purely about **K** (how we know others' mental states). Your cases involve smuggling **K** into ontological claims (e.g., "no common unit → no fact of the matter").  
  3. **Measurability (Measurement Theory)**:  
     - *Difference*: Distinguishes ordinal/interval/ratio scales (**O** vs. **C/Z**). Your phenomenon conflates *scale type* (**C**) with *existence of comparisons* (**O**) and *feasibility of aggregation* (**A**).  

  ---

  ### Term for the Pattern  
  - **Established Term?**: **None**. Closest is "**slippery slope in comparability**" (informal) or "**conflation of measurability scopes**" (unstandardized).  
  - **Proposed Term**: **Comparative Scope Collapse**  
    - *Definition*: Illegitimate inference from limitations/permisions regarding one aspect of welfare comparison (e.g., cardinality, knowability) to stronger/weaker claims about other aspects (e.g., ordinal meaningfulness, additivity).  
  - **Boundary Cases**:  
    - **Inside**: "We can’t measure pain precisely (**¬K/C**) → Therefore, we can’t say torture is worse than a headache (**¬O**)."  
    - **Outside**: "We lack a common unit (**¬C**) → Therefore, we can’t add welfare gains/losses (**¬A**)." (Valid, as **A**→**C**.)  

  ---

  ### Verdict  
  No established term; proposed term: **Comparative Scope Collapse**.  

  This pattern exploits ambiguity in "comparison" (ordinal? cardinal? additive?) and "impossibility" (metaphysical? epistemic?). Resisting it requires insisting that **O** is the bedrock claim: even without common units or precise quantification, we *can* and *must* compare welfare in extreme cases for coherent policy. The rest are modular additions.
