  - Twist: Revelation itself creates the bad outcome 
  - Tie to theorem: Oracle regrets giving free evidence despite ex ante certainty of non-negative value 

  Key joke mechanics:
  - Misdirection: Frame prediction as harmful content when harm is in transmission 
  - Culprit: Agent's own Bayesian rationality causes the doom 
  - Technical punch: "Realized value of information: negative" as delivered line 

