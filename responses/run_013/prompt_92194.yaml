answer: |-
  Below is a decision tree that starts from the uncontroversial empirical premise of systematic left-right differences in moral concerns (e.g., the right's greater emphasis on loyalty, authority, purity) and leads to named positions in moral psychology. Each branch is answerable without prior knowledge of the labels, and the tree incorporates your specified turning points. The leaves include all requested positions, with notes on collapses, empty paths, and distinctions. A concrete case (disgust without reason) anchors one branch.

  ---

  ### **Decision Tree: From Empirical Premise to Moral Psychology Positions**

  **Start**: People on the political left and right differ systematically in what they find morally relevant (e.g., the right more frequently endorses loyalty, authority, and purity concerns).

  #### **Level 1: What are "moral foundations"?**
  - **Q1**: Is framing these differences as "moral foundations" (e.g., care, fairness, loyalty, authority, purity) a *neutral description* of psychological traits, or does it implicitly *favor one side's worldview*?  
    - **A: Neutral description** → Proceed to Level 2A.  
    - **B: Partisan redescription** (e.g., it frames the right as "broader") → Proceed to Level 2B.  

  ---

  #### **Level 2A: Ontology of foundations (from Q1-A)**
  - **Q2**: Do these foundations track *objective moral properties* (e.g., real wrongness/rightness), or are they *mere dispositions to react* (e.g., culturally shaped sentiments)?  
    - **A: Track objective properties** → Proceed to Level 3A.  
    - **B: Mere dispositions** → Proceed to Level 3B.  

  #### **Level 2B: Normative force of breadth (from Q1-B)**
  - **Q3**: Does the finding that the right uses "more foundations" imply the right is *morally superior* (e.g., more comprehensive), or is it *just a demographic fact*?  
    - **A: Normatively superior** → **Leaf: Haidt-ish view** (right's breadth counts in its favor; MFT as vindicatory).  
    - **B: Demographic fact only** → **Leaf: Moral-reframing view** (descriptive tool to "translate" arguments across factions; no normative upshot despite marketing).  

  ---

  #### **Level 3A: Evolutionary debunking (from Q2-A)**
  - **Q4**: Does the evolutionary origin of these intuitions give reason to *distrust all moral intuitions*, *only the other side's*, or *none*?  
    - **A: Distrust all equally** → **Leaf: Symmetric debunking** (both sides' intuitions are unreliable evolutionary byproducts).  
    - **B: Distrust only the other side's** → **Leaf: Asymmetric view** ("My side uses reason; yours uses instinct").  
    - **C: Distrust none** → Proceed to Level 4A.  

  #### **Level 3B: Status of dispositions (from Q2-B)**
  - **Q5**: Can reasoning *critically evaluate* these dispositional intuitions, or is moral truth *defined by settled sentiments*?  
    - **A: Reasoning can evaluate** → Proceed to Level 4B.  
    - **B: Truth = settled sentiments** → **Leaf: Sentimentalism** (moral facts reduce to collective emotional responses).  

  ---

  #### **Level 4A: Normative force of breadth (from Q4-C)**
  - **Q6**: Does the right's use of "more foundations" confer *moral advantage* (e.g., access to deeper truths), or is it *descriptively interesting but normatively inert*?  
    - **A: Moral advantage** → **Leaf: Haidt-ish view** (as above; collapses into earlier leaf).  
    - **B: Normatively inert** → **Empty** (incoherent: if foundations track objective properties, breadth *should* matter. Attractive only if foundations are unequal, but no named position).  

  #### **Level 4B: Concrete case - disgust without reason (from Q5-A)**
  - **Q7**: If someone calls an act wrong *solely* because it disgusts them (e.g., gay marriage, eating insects) and cannot give a reason, is this a *genuine moral judgment*?  
    - **A: Yes** → **Leaf: Rationalist comeback** (foundations describe intuitions, but reasoning can override them; disgust may initiate judgment).  
    - **B: No** → **Leaf: Rationalist comeback** (collapses: if reasoning is necessary for moral judgment, intuitions alone are insufficient).  

