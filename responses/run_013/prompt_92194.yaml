  ### **Key Notes**
  1. **Collapses**:  
     - The "rationalist comeback" leaf collapses on Q7: both answers lead to the same position (reasoning arbitrates intuitions).  
     - The "Haidt-ish view" appears twice (from Q3-A and Q6-A) but is identical.  
  2. **Empty Paths**:  
     - Q6-B (breadth without normative force + objective properties) is **incoherent**: If foundations track moral truth, breadth *must* confer advantage. No named position exists.  
  3. **Distinctions**:  
     - **Moral-reframing** is distinct: purely descriptive (no normative upshot), unlike Haidt-ish or sentimentalism.  
     - **Symmetric debunking** is reached only via Q4-A (objective properties + distrust all).  
     - **Asymmetric view** requires partisan distrust (Q4-B).  
  4. **Concrete Case**:  
     - Anchors the rationalist comeback (Q7), testing if intuitions sans reason qualify as moral judgments.  

