  ### Principles for the Two-Envelope Paradox

  After analyzing your six cases, I derive the following principles to explain your verdicts. These principles hinge on **whether a known probability distribution justifies an expected value calculation for swapping**. The core idea is that expected value calculations require well-defined probabilities; without them, swapping is unjustified.

  1. **Known Distribution Principle (KDP)**:  
     If the mechanism for filling the envelopes includes a known random process (e.g., a coin flip or die roll) that defines probabilities for the possible pairs, use expected value to decide.  
     *Motivation*: Cases 2, 4, and 5, where you swap or not based on calculable odds.

  2. **No Distribution Principle (NDP)**:  
     If no mechanism is specified (or you lack knowledge of it), the "average 1.25X" argument is invalid. Do not swap, as there's no basis to assume equal likelihood of the other envelope being 2X or X/2.  
     *Motivation*: Cases 1, 3, and 6, where you avoid swapping due to undefined probabilities.

  3. **Bounded Support Principle (BSP)**:  
     If a known distribution has a maximum possible value (e.g., a finite list), and you observe that maximum, do not swap. The observed amount must be the larger in its pair.  
     *Motivation*: Case 4 (peeking at the ceiling value), where you infer you have the larger amount.

  4. **Implicit Uniform Prior Principle (UPP)**:  
     If the filling mechanism involves a random base amount but its distribution is unspecified, assume a uniform prior over possible values to compute expected value. This is a pragmatic default when no other information exists.  
     *Motivation*: Case 5, where the coin flip justifies swapping under a uniform prior for the base amount.

  ### Application to Your Cases
  - **Case 1 (Vanilla)**: No swap (NDP). No known distribution → the 1.25X argument assumes probabilities that aren't justified.  
  - **Case 2 (Peek + Coin)**: Swap (KDP). Known coin flip → 50% chance of $5 or $20, EV = $12.50 > $10.  
  - **Case 3 (Peek, No Info)**: No swap (NDP). No coin → no basis for 50/50 probabilities.  
  - **Case 4 (Ceiling)**: No swap (BSP). The observed amount ($1,048,576) is the max possible smaller amount → it must be the larger in its pair (since $2,097,152 isn't a possible smaller amount).  
  - **Case 5 (Base Amount + Coin)**: Swap (UPP). The coin and shuffle define randomness; assume uniform prior for the base amount → EV of other envelope is $12.50 > $10.  
  - **Case 6 (Unbounded Powers)**: **No swap** (NDP). No known distribution for \( n \) → same as Case 1. (Your gut says swap, but NDP forces consistency with Case 1.)

  ### Resolution of Case 6
  Your gut verdict for Case 6 (swap) conflicts with Case 1 (no swap). Both are identical in principle: no distribution is specified for how the amounts were chosen. Thus, **you must give up the swap verdict in Case 6**. The "powers of 2" detail doesn't introduce a known distribution, so NDP applies. Swapping would require inventing probabilities, which you reject in Case 3.

