prompt: |-
  I am a journalist who covers science and ideas, and I have been asked to lead a ninety-minute professional-development workshop for general-assignment reporters who cover courts, public health, and local government. Their work repeatedly puts them in front of cases where the contested question is whether a failure to act caused a harm: a utility that did not replace a corroded valve, a regulator that did not inspect, a physician who did not order a test. I want them to leave with a working grasp of causation by omission, not a tour of the literature. Plan the session for me rather than explaining the topic. What has to come first so that the question of whether an omission can be a cause feels like a genuine metaphysical question rather than a verbal dispute? What depends on what as the sequence proceeds? I am inclined to build the workshop around a case in which a city's failure to repair a levee is singled out as the cause of a flood, while a contractor's failure to deliver sandbags, a resident's failure to evacuate, and a regulator's failure to inspect are also in the story. Tell me whether that example can carry the whole session, what it must contain and leave out, and what I would need to add or replace if it cannot. I want the plan to make room for three harder ideas: the difference between an omission as a counterfactual difference-maker and an omission as a breach of a norm or expectation; the puzzle of redundant omissions, where two officials each fail to act and either failure would have been sufficient to prevent the harm; and the structure of double prevention, where one failure prevents another potential preventer from acting. Where in the sequence should those ideas appear, which of them should I leave out at this level, and what should I do about the fact that they pull in different directions? Which misconceptions should I expect—for instance, that omissions are causes only when they are morally blameworthy, that counterfactual dependence by itself settles the issue, that doing nothing is a single natural kind, or that causal language in law and in metaphysics must line up—and at exactly what point in the session should I head each one off? What should I deliberately refuse to explain at this level, and how should I mark that refusal? Finally, give me one question to ask at the end that would show whether the reporters can distinguish a metaphysical claim about omission causation from a normative or pragmatic one, and tell me what a good answer and a bad answer would look like. I do not want readings or citations; I want a teaching plan.
reasoning: |-
  Okay, the user is a science journalist preparing a 90-minute workshop on causation by omission for reporters covering courts, public health, and local government. They need a practical teaching plan centered on a levee failure case study, with three advanced concepts woven in. The challenge is making metaphysical questions feel real, not semantic.

  First, I need to understand their core dilemma: reporters see "failure to act" cases daily but likely conflate legal/moral blame with actual causation. The workshop must decouple these. The levee example is strong because it's visceral (flood = concrete harm) and layers multiple omissions (contractor, resident, regulator). 

  I wonder if they're underestimating how deeply "blame = cause" is ingrained. The opening hook must force discomfort: show identical harm scenarios where only the *expected action* differs. That "wait..." moment is crucial. Maybe contrast a guard failing to sound alarm vs. a janitor - same inaction, different expectations.

  For structure: the three advanced concepts need scaffolding. Counterfactual vs. normative should come right after defining omissions, while redundant omissions and double prevention require the foundation of "sufficiency." Must resist over-explaining - e.g., skip preemption debates. 

  Biggest pitfall: reporters might reject metaphysics as irrelevant to their work. The payoff must be clear - "this helps you spot when lawyers are smuggling normative claims into causal arguments." Their regulator example is perfect for this: an inspection failure may not change outcomes (counterfactually irrelevant) but still breaches duty.

  The closing question needs to expose conflation. "Did the resident's failure to evacuate *cause* their death?" Good answers would separate "yes, counterfactually" from "but normatively, the city had primary responsibility." Bad answers would fixate on moral blame.

  Should I add a quick courtroom roleplay? No - time is tight. Better to have them dissect quotes from real cases showing judges confusing causation and responsibility. But the user said no readings... stick to the levee narrative.

  Deliberate omissions: won't touch overdetermination (two simultaneous floods) or probabilistic causation. Mark boundaries by saying "for today's purpose, we're assuming definite outcomes."

  Final call: the levee case *can* carry all three advanced concepts if carefully sequenced. Use redundant omissions for the two city officials, and double prevention for the regulator blocked by budget cuts. But drop the sandbags - it's one variable too many.
answer: |-
  Here’s a focused 90-minute workshop plan centered on your levee case, designed to make omissions feel metaphysically puzzling while addressing your three target concepts and common misconceptions.  

  **Total Time:** 90 mins  
  **Case Study:** Flood caused by City’s failure to repair levee. Other omissions:  
  - Contractor fails to deliver sandbags  
  - Resident fails to evacuate  
  - Regulator fails to inspect levee  

  ---

  ### **PART 1: SETTING THE METAPHYSICAL STAGE (25 mins)**  
  **Goal:** Make omissions feel like genuine causes, not just blame assignments.  
  1. **Hook (5 mins):**  
     - Show two identical flood scenarios.  
     - **Scenario A:** Levee collapses due to natural erosion (no human omission).  
     - **Scenario B:** Levee collapses because the City *knew* it was corroded and didn’t repair it.  
     - *Ask:* "Is the *cause* of the flood meaningfully different in B? Why?"  
     - *Key:* Elicit that we intuitively say the City "caused" the flood in B—but *how*?  

  2. **The Puzzle (10 mins):**  
     - Define "omission": An absence of action where an action was possible/expected (e.g., not repairing, not evacuating).  
     - *Question:* "If the City did *nothing*, how can nothing *cause* something? Isn’t causation about things that happen?"  
     - Highlight the tension: Our language treats omissions as causes ("Their inaction killed people!"), but philosophically, absences aren’t "events."  

  3. **The Levee Case Rollout (10 mins):**  
     - Present full case: Flood occurs. All four omissions occurred (City, Contractor, Resident, Regulator).  
     - *Group Task:* "Rank these omissions by ‘how much’ they caused the flood. Explain your reasoning."  
     - *Expect:* Moral blame (City/Regulator > Resident) or "directness" (City > Contractor).  

  ---

  ### **PART 2: CORE CONCEPTS & MISCONCEPTIONS (40 mins)**  
  **Goal:** Distinguish counterfactual dependence from norms; tackle redundancy.  
  1. **Counterfactual vs. Normative (15 mins):**  
     - **Counterfactual Test:** "But for the omission, would the harm have occurred?"  
       - *Apply to Resident:* "But for the resident not evacuating, would they have drowned? *No* (if evacuation works). So counterfactually, their omission *is* a cause."  
     - **Normative Expectation:** "Was there a duty/expectation to act?"  
       - *Contrast:* Resident had no *duty* to evacuate; City had a *duty* to repair.  
     - *Misconception Alert:* "Omissions are causes only when blameworthy."  
       - *Crush this:* "The resident’s omission meets the counterfactual test but isn’t blameworthy. The *cause* vs. *blame* distinction matters."  

  2. **Redundant Omissions (15 mins):**  
     - Modify the case: *Two* City engineers independently knew about the corrosion; either could have ordered repairs. Neither did.  
     - *Question:* "Did *both* cause the flood? If we can’t say ‘but for Engineer A, the flood would’ve happened’ (since Engineer B could’ve acted), is neither a cause?"  
     - *Reveal:* Redundancy breaks simple counterfactuals. We still want to say *each* omission was causally relevant.  
     - *Tool:* "Each was *sufficient* to prevent harm if acted. Like two failed backup systems."  

  3. **Double Prevention (10 mins):**  
     - Add to the case: The Regulator failed to inspect *because* the Mayor cut their budget (Mayor’s omission).  
     - *Question:* "Did the Mayor’s failure cause the flood? The Mayor didn’t touch the levee—they stopped the Regulator, who might have stopped the flood."  
     - *Structure:* A prevents B from preventing C. Omissions can chain.  

  ---

  ### **PART 3: SYNTHESIS & PRAGMATICS (20 mins)**  
  **Goal:** Separate metaphysics from legal/pragmatic concerns.  
  1. **Group Work (10 mins):**  
     - *Task:* "In the levee case, which omissions would a lawyer call ‘the cause’? A scientist? A local activist? Why do they differ?"  
     - *Reinforce:*  
       - Law cares about duties and proximate cause.  
       - Metaphysics cares about dependence/necessity.  

  2. **Deliberate Refusals (5 mins):**  
     - *Mark boundaries:*  
       - "We won’t resolve *whether omissions are ‘real’ causes*—philosophers debate this. We care about *using the concept clearly*."  
       - "We’re ignoring probabilistic causation (e.g., ‘failure increased risk’)."  

  3. **Final Misconception Check (5 mins):**  
     - "Omissions are all the same ‘type’ of cause." → *No:* Compare not evacuating (direct counterfactual) vs. not inspecting (independent/double prevention).  
     - "Counterfactual dependence settles everything." → *No:* Redundancy and norms complicate it.  

  ---

  ### **CLOSING (5 mins):**  
  **The Test Question:**  
  *"Imagine a doctor fails to wash hands, and a patient dies of an infection. A janitor also failed to refill soap dispensers that day. Did both omissions cause the death? Does your answer change if the janitor was on strike? Explain."*  

  - **Good Answer:**  
    - "Both *counterfactually* caused it (if either acted, death avoided). But normatively, we blame the doctor more due to duty. The janitor’s strike might break counterfactual dependence (if dispensers were empty anyway)."  
    - *Shows grasp* of multiple causal frames and context-dependence.  

  - **Bad Answer:**  
    - "Only the doctor caused it—they’re responsible for patients." (Conflates cause with duty)  
    - "Neither caused it; germs did." (Ignores counterfactual dependence)  

  ---

  ### **WHY THIS WORKS WITH YOUR CASE**  
  - **The levee example carries the session** if you:  
    - **Include:** Clear harm (flood), multiple omission types (duty-based/voluntary, direct/indirect), and layered failures (redundancy/double prevention).  
    - **Exclude:** Overcomplicating with probabilistic harm or third-party actions.  
  - **Add only if needed:** A quick medical omission (e.g., undiagnosed infection) to reinforce universality.  

  **Pacing Guardrails:**  
  - If Part 1 runs long, simplify redundant omissions (use City/Regulator only).  
  - Double prevention is hardest; drop it if energy lags (focus on counterfactual vs. normative).  
  - **End with punch:** "Your job: Spot when people use ‘cause’ to mean duty, not dependence. That’s where stories hide."  

  This plan forces engagement with the "how can nothing cause something?" tension early, uses the case to manifest abstract ideas, and arms reporters to dissect causal claims in their work.
