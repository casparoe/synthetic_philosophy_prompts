  The user notices a pattern: proponents emphasize the huge numbers, saying even a tiny probability matters when multiplied. Opponents focus on the low probability, demanding proof it's non-trivial. Both sides ignore the other's point, and the argument structure itself feels flawed. They've seen similar patterns in AI-risk and precautionary principle debates.

  Hmm, they want to know if there's a name for this argument structure where one factor is well-measured (insect count) and the other is highly uncertain (sentience probability). They mention Pascal's Mugging but note differences—here the big number is real, not made up. They also ask about related concepts and edge cases.

  First, I recall that in decision theory, Knightian uncertainty deals with unmeasurable unknowns. The scale argument multiplies a known quantity by an unknown probability, leading to what's sometimes called an "expected value vacuum." But is there a specific term? 

  I think of "moral weight uncertainty" from animal ethics, where uncertainty about consciousness complicates welfare calculations. The user's case is similar but with astronomical numbers. Also, the "multiplier effect" in utilitarianism might apply, but that doesn't capture the epistemic clash.

  The debate dynamic reminds me of "talking past each other" due to asymmetric burdens of proof. Proponents shift burden to prove probability is zero; opponents demand proof it's significant. This ties into "Pascal's Wager" logic but diverges because insect sentience isn't binary.

  For a coined term, "Knightian Multiplier Dilemma" fits—combining Frank Knight's uncertainty with the multiplier effect. Or "Scale Paradox" to highlight the tension between size and uncertainty. The user might prefer something descriptive.

  Comparing to Pascal's Mugging: here the numbers are real, not invented, so it's a "non-fabricated" version. Precautionary principle applies but is broader. Scope neglect is relevant but different—it's about ignoring scale, while here scale is central.

  Edge cases: if the uncertain factor becomes known (e.g., sentience probability measured), the problem shifts to standard risk assessment. The issue arises when uncertainty spans orders of magnitude, making expected value calculations volatile. Also, treating guesses as fixed numbers when multiplied is a form of false precision fallacy.

  The user's deeper need might be to frame this recurring pattern in their reporting, giving them a lens to analyze such debates. They might also seek validation that this isn't just about insects but a broader epistemic clash in high-stakes decisions.
answer: |-
  What you're describing is a brilliantly observed epistemic pattern that cuts across multiple domains. While there's no single universally accepted term for this *exact* structure, it sits at the intersection of several well-established concepts. Let's break it down, coin a term, and map its territory:

  ### The Core Structure & Its Name
  *   **The Argument:** Moral Significance = (Enormous, Well-Estimated Quantity N) × (Highly Uncertain Probability P of a morally relevant property, e.g., sentience, catastrophic harm).
  *   **The Clash:** Proponents focus on `N` ("Look at the scale! Even tiny `P` matters!"). Opponents focus on `P` ("Prove `P` isn't negligible first!"). They talk past each other because they assign the burden of proof differently regarding `P`.
  *   **The Underlying Issue:** The product `N × P` has extreme **epistemic instability**. A tiny shift in the *estimate* of `P` (especially when `P` is fundamentally uncertain) causes massive, order-of-magnitude swings in the final `N × P` value due to the colossal `N`. This makes the expected value calculation highly volatile and sensitive to priors.
  *   **The Coined Term:** **Knightian Multiplier Dilemma (KMD)**
      *   **Knightian:** From economist Frank Knight's distinction between *risk* (quantifiable probabilities) and *uncertainty* (unquantifiable unknowns). `P` here is pure Knightian uncertainty.
      *   **Multiplier:** The colossal `N` acts as a force multiplier for the uncertainty in `P`.
      *   **Dilemma:** The core conflict about where the burden of proof lies and the instability of the conclusion.

  ### Why "Knightian Multiplier Dilemma" Fits
  1.  **Captures the Uncertainty Type:** `P` isn't just unknown; it's often *unquantifiable* with current knowledge (true Knightian uncertainty), not merely a "risk" with known probabilities.
  2.  **Highlights the Amplifier:** The massive `N` is the engine that makes the uncertainty in `P` so consequential.
  3.  **Names the Impasse:** The "dilemma" directly refers to the burden-of-proof deadlock and the instability of the expected value.

  ### Relation to Neighboring Concepts
  1.  **Pascal's Mugging:**
      *   **Similarity:** Relies on massive `N` (mugger's claimed payoff) multiplied by a tiny, unsubstantiated `P` (threat credibility) to demand action.
      *   **Difference:** KMD uses a *real*, empirically grounded `N` (insect count, AI system deployments) rather than a fabricated one. `P` is an *honest epistemic unknown* (insect sentience, specific AI failure mode probability) rather than an arbitrary claim by an agent. KMD feels more like "Pascal's Mugging with Real Numbers and Genuine Uncertainty."
  2.  **Precautionary Principle (PP):**
      *   **Similarity:** Both deal with potential severe harm under uncertainty. KMD provides a specific *mathematical structure* often underlying PP arguments when massive scale (`N`) is involved. PP often *invites* KMD-style reasoning ("What if `P` is non-zero? Look at `N`!").
      *   **Difference:** PP is a broad principle for decision-making ("better safe than sorry"). KMD is a specific *argument structure* highlighting the instability created by `N × P` under uncertainty. PP can be invoked without the colossal `N` multiplier (e.g., a new chemical with unknown but localized effects).
  3.  **Scope Neglect / Scope Insensitivity:**
      *   **Similarity:** Both involve failing to properly account for scale (`N`). Opponents in KMD might *exhibit* scope neglect by dismissing `N` because `P` feels small.
      *   **Difference:** Scope neglect is a cognitive bias *about* `N`. KMD is an argumentative structure *using* `N` as a lever, but its core conflict revolves around the *interaction* of `N` with the uncertainty of `P` and the resulting burden-of-proof clash. KMD exploits the *potential* for scope neglect in opponents.
  4.  **Expected Value Reasoning:**
      *   **Similarity:** KMD *is* fundamentally an expected value calculation: Expected Moral Weight = `N × P × (Average Moral Weight per Individual)`.
      *   **Difference:** KMD highlights the extreme fragility of EV calculations when one factor (`N`) is astronomically large and the other (`P`) is shrouded in deep uncertainty. Standard EV often assumes quantifiable (even if estimated) probabilities.

  ### Mapping the Edges: When Does KMD Apply?
  1.  **The Shaky Factor (`P`):**
      *   **Genuine Unknown (Knightian Uncertainty):** This is the core domain (insect sentience, novel AI risk pathways). KMD is strongest here. Burden-of-proof clash is most acute.
      *   **Competing Guesses (Wide Credence Intervals):** Still applies strongly (e.g., different models for AI risk probability yielding estimates spanning orders of magnitude). The instability of `N × P` is key.
      *   **Known Frequency:** If `P` becomes a reasonably well-constrained frequency (e.g., *known* failure rate of a specific, well-understood component in a large system), KMD *dissipates*. It becomes a standard risk assessment problem. The argument shifts to the accuracy of the frequency estimate and the value of `N`, not the fundamental uncertainty *about the nature of `P` itself*.
  2.  **The "Solid" Factor (`N`):** Must be genuinely large and empirically grounded. If `N` is speculative or contested, the argument becomes different (e.g., debates about the number of potential future digital minds).
  3.  **The Fallacy of False Precision:** This is **crucial** to KMD dynamics. Both sides often commit this fallacy:
      *   Proponents: Treat the *range* of plausible `P` (e.g., `1e-12` to `1e-3`) as if it justifies using *some* non-zero value (e.g., `1e-6`), ignoring that the choice within that range is arbitrary and massively impacts `N × P`. They treat the *guess* as a *number* once multiplied.
      *   Opponents: Sometimes dismiss `N × P` entirely because `P` isn't a single, precise number, failing to engage with the *possibility* that even the lower bounds of plausible `P` could yield a large `N × P` given `N`.
  4.  **Burden of Proof:** The central failure mode you identified hinges entirely on this asymmetric burden of proof regarding `P`. Proponents: "You must prove `P ≈ 0`." Opponents: "You must prove `P` is meaningfully > 0." Resolving KMD often requires explicitly negotiating this burden of proof upfront, acknowledging the deep uncertainty, and deciding on decision rules under that uncertainty (e.g., minimax, PP, cost-effectiveness of research to reduce uncertainty in `P`).

  ### In Summary
  You've identified a pervasive and structurally fascinating argumentative pattern – the **Knightian Multiplier Dilemma (KMD)**. Its power and fragility stem from multiplying a colossal, measurable quantity (`N`) by a deeply uncertain probability (`P`), creating an epistemically volatile product (`N × P`) that drives high-stakes disagreements. The core failure mode is the burden-of-proof clash over `P`, exacerbated by the fallacy of false precision applied to guesses once multiplied. While related to Pascal's Mugging (real `N` vs. fabricated), the Precautionary Principle (a potential application), and Scope Neglect (a cognitive factor), KMD is distinct in its reliance on genuine scale interacting with fundamental uncertainty, creating a unique and often frustrating dynamic where opposing sides argue fundamentally different points anchored to different factors in the same equation. Your instinct that this pattern transcends insect farming is exactly right.
