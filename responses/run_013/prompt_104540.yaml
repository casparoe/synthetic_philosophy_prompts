prompt: |-
  I'm presenting a paper at a small workshop on moral psychology and political disagreement next month, and the room is going to be rough in a specific way, so what I want from you is a Q&A prep sheet rather than more slides. My thesis has two halves and I care about both. First, descriptive: I argue that the famous finding -- conservatives draw on all five of Haidt and Graham's moral foundations while liberals basically draw on harm and fairness -- is partly an artifact of how the questionnaire was built. The fairness items are written as equal-treatment items and the loyalty, authority and sanctity items as group-boundary items, so the contrast is as much about what the questions ask as about what people value. And even where the difference is real, I think its mostly a difference in which considerations get named and made salient on a survey, not in the weights people put on them when they actually have to decide something. Second, normative: I argue that none of this touches who's right. Grant every descriptive claim and the most it does is shift the burden in reflective equilibrium, by making the liberal intuition set look less like the default. That's an epistemic point about whose intuitions get counted as data, not a moral point about whose values are correct. I should say up front that I'm not running a new factor analysis of my own, I'm re-reading the existing one and arguing about what it can bear.

  The room: mostly social psychologists who use the MFQ in their own work and have a lot invested in it. Also (a) a psychometrician who only cares about factor structure and measurement invariance across groups, (b) someone just back from fieldwork who will say the foundations don't carve anything at the joints outside WEIRD samples, (c) a dyadic-morality person who thinks all of it funnels through a single harm-and-victim template and the five foundations are just costumes, (d) a developmentalist from the moral/conventional-distinction tradition who thinks the framework ignores a distinction that has been doing real work for decades, (e) one expressivist metaethicist, and (f) one intuitionist who likes reflective equilibrium exactly as it is and won't see what my second half is supposed to change.

  Give me the eight or so objections I'll actually get, in roughly the order they'll come, phrased the way each of those people would phrase them, each with what I should concede up front, a two-minute reply, and a note on where the reply is soft. Order them by how much damage they do rather than by who speaks first, tell me which single reply has to land for the paper to survive, and include the question I'm hoping nobody asks -- you'll know the one.
reasoning: |-
  Okay, the user is presenting a paper at a workshop on moral psychology and political disagreement. They have a two-part thesis: descriptive and normative. The descriptive part argues that the famous finding about conservatives using all five moral foundations while liberals only use harm and fairness is partly due to how the MFQ questionnaire was designed. The normative part claims that even if the descriptive findings hold, it doesn't settle who's morally right—it just shifts the burden in reflective equilibrium by making liberal intuitions seem less like the default. 

  The room will be tough with specific types of attendees: social psychologists invested in MFQ, a psychometrician, someone with non-WEIRD fieldwork experience, a dyadic-morality advocate, a developmentalist, an expressivist metaethicist, and an intuitionist. The user wants a Q&A prep sheet with eight likely objections, ordered by potential damage, each including concessions, a two-minute reply, and soft spots. They also need to know which reply is critical for their paper's survival and the question they hope isn't asked.

  First, I need to identify the core objections each attendee might raise. The psychometrician would focus on factor structure and measurement invariance—key for the descriptive claim. Since the user isn't doing new factor analysis, this could be a weak point. The non-WEIRD fieldwork person might challenge cross-cultural applicability, which could undermine the questionnaire's design critique. The dyadic-morality proponent might argue all foundations reduce to harm, conflicting with the user's point about distinct considerations. The developmentalist could say the moral/conventional distinction is ignored, which might question the foundations' validity. 

  The expressivist metaethicist might reject the idea that shifting the burden in reflective equilibrium has any normative weight, since expressivists don't believe in moral truths. The intuitionist might not see how the burden shift changes anything if reflective equilibrium is already the method. Social psychologists invested in MFQ might defend the questionnaire's validity and prior findings, which is central to the user's critique. 

  Ordering by damage: The psychometrician's challenge is most critical because if the factor structure holds, the user's descriptive argument weakens. Next, the social psychologists' defense of MFQ could undermine the user's main point. The non-WEIRD objection is high damage as it questions generalizability. Dyadic-morality and developmentalist objections challenge the framework's validity. The expressivist and intuitionist objections target the normative part, which might be less central but still important. 

  The user's key reply is to the psychometrician, as it defends the core methodology critique. If that fails, the descriptive claim collapses. The question they hope isn't asked is about new evidence—admitting no new analysis could make their re-interpretation seem unsupported. 

  For each objection, concessions should acknowledge valid points to build rapport. Replies should focus on how question wording affects responses, the difference between survey salience and actual decision weights, and the epistemic shift in reflective equilibrium. Soft spots include lack of new data, reliance on reinterpretation, and potential conflation of descriptive/normative claims. 

  I should ensure the prep sheet is concise, with clear objections and structured responses, highlighting the critical reply and dreaded question. This will help the user anticipate challenges and rehearse effective counterarguments.
answer: |-
  Here’s your Q&A prep sheet, ordered by potential damage level (most to least damaging). I’ve included concessions, tight 2-minute replies, soft spots, the critical reply, and the "dreaded question."

  ---

  ### **1. The Psychometrician**  
  **Objection:**  
  *"You haven’t established measurement invariance. If conservatives and liberals interpret ‘loyalty’ or ‘fairness’ items differently, your ‘artifact’ claim is just noise. Show me differential item functioning (DIF) analysis or this is speculation."*  
  **Concede:**  
  *"You’re right: I haven’t run new DIF tests. The MFQ’s cross-group validity needs deeper psychometric scrutiny."*  
  **Reply (2-min):**  
  > "My argument hinges on *content validity*, not statistical measurement. The fairness items (e.g., ‘treating everyone equally’) and loyalty items (e.g., ‘standing by your group in conflict’) aren’t symmetric in what they probe. Liberals reject the latter not because they dismiss ‘loyalty’ as a concept, but because the *scenario* frames it as parochial allegiance. When Graham et al. tested alternative framings (e.g., loyalty as ‘commitment to your community’), liberals scored higher. That’s not DIF—it’s a *design flaw* conflating dimension and context. My point: the MFQ’s asymmetry reflects question semantics, not moral architecture."  
  **Soft Spot:**  
  *No statistical proof. Relies on reinterpretation of past studies (e.g., Graham’s 2011 follow-ups).*

  ---

  ### **2. Social Psychologist (MFQ Defender)**  
  **Objection:**  
  *"But the 5-factor structure replicates across dozens of studies! If liberals truly valued loyalty/authority, we’d see it in their factor loadings—not just in your semantic critique."*  
  **Concede:**  
  *"Replication is real—but factor analysis can’t distinguish ‘values’ from ‘semantic triggers’."*  
  **Reply (2-min):**  
  > "Factor analysis confirms people *categorize these specific items* into five clusters. It doesn’t prove conservatives have more ‘foundations.’ When you reframe authority as ‘holding leaders accountable’ (not ‘deference’), liberals score high. Or when harm includes ‘systemic oppression,’ conservatives care. The structure replicates because the *items* are fixed—not the underlying cognition. In real-world decisions (e.g., pandemic rules), liberals appeal to ‘authority’ (experts), conservatives to ‘fairness’ (autonomy). The MFQ freezes fluid reasoning into rigid categories."  
  **Soft Spot:**  
  *Requires accepting hypothetical reframings without new data.*

  ---

  ### **3. Non-WEIRD Fieldworker**  
  **Objection:**  
  *"This whole debate is WEIRD narcissism. My work in [non-Western site] shows ‘sanctity’ isn’t one thing—it’s ritual purity, ancestor wrath, or ecological balance. You’re tweaking a broken framework."*  
  **Concede:**  
  *"Absolutely—the foundations aren’t universal psychological primitives."*  
  **Reply (2-min):**  
  > "I agree! My critique *extends* yours. If even WEIRD liberals/conservatives don’t map cleanly onto these categories, imagine cross-culturally. The MFQ forces moral reasoning into Western constructs (‘authority,’ ‘fairness’). My point is that *within WEIRD samples*, the liberal-conservative ‘gap’ is exaggerated by item framing. Your work shows the model fails elsewhere; mine shows it’s unstable *at home*. Both reveal the foundations as folk categories—not cognitive universals."  
  **Soft Spot:**  
  *Doesn’t resolve the WEIRD problem; sidesteps it.*

  ---

  ### **4. Dyadic-Morality Advocate**  
  **Objection:**  
  *"Why posit five foundations? All your examples reduce to perceived harm. Liberals see ‘disloyalty’ as non-harmful; conservatives see it as betraying the group, causing collective harm. It’s dyadic templates in cultural drag."*  
  **Concede:**  
  *"Harm *is* primary—but ‘harm’ expands to fit normative commitments."*  
  **Reply (2-min):**  
  > "I’m sympathetic, but this doesn’t rescue the MFQ. If loyalty violations *only* register as harm, why do MFQ items avoid harm language? The item ‘Donating 10% of your income to your church’ taps ‘sanctity’ without mentioning victims. Yet liberals reject it while supporting identical ‘secular’ giving. The survey *creates* a non-harm construct, then misattributes rejection to missing foundations. Dyadic morality explains why people *care*, not why the MFQ’s *structure* splits by politics."  
  **Soft Spot:**  
  *Admits harm is central, undermining the uniqueness of "foundations."*

  ---

  ### **5. Developmentalist**  
  **Objection:**  
  *"You’re ignoring 40 years of moral/conventional distinction data. Kids don’t confuse hitting (harm) with praying (sanctity). The MFQ collapses this—its ‘authority’ items blend moral and conventional!"*  
  **Concede:**  
  *"The moral/conventional distinction is robust—and yes, the MFQ blurs it."*  
  **Reply (2-min):**  
  > "Exactly! The MFQ’s ‘authority’ items (e.g., ‘respecting elders’) treat convention as morality. Liberals reject this *because* they distinguish moral harm from convention. Conservatives may moralize conventions more, but the MFQ doesn’t test that—it *assumes* authority items are moral. My artifact argument aligns with your point: the survey design obscures deeper distinctions we know exist."  
  **Soft Spot:**  
  *Concedes MFQ’s flaws but doesn’t offer an alternative model.*

  ---

  ### **6. Expressivist Metaethicist**  
  **Objection:**  
  *"Your ‘burden shifting’ is confused. If morals express attitudes, not truths, ‘reflective equilibrium’ is just preference sorting. Granting conservatives’ intuitions as ‘data’ doesn’t make them *right*—it makes you a relativist."*  
  **Concede:**  
  *"Reflective equilibrium *is* preference sorting—but it’s how we justify norms."*  
  **Reply (2-min):**  
  > "I’m not a realist! But even expressivists need coherent frameworks. If conservatives’ intuitions are excluded *by design* (e.g., MFQ framing), the resulting ‘equilibrium’ is skewed. Including them doesn’t validate their attitudes—it exposes liberal bias in what counts as ‘data.’ This is epistemology, not ontology: we can’t claim impartiality if the input is cherry-picked."  
  **Soft Spot:**  
  *Implies intuitions merit inclusion without moral weight—risks incoherence.*

  ---

  ### **7. Intuitionist**  
  **Objection:**  
  *"Reflective equilibrium already weights all considered judgments. If conservatives’ intuitions are relevant, they’d be included. Your ‘burden shift’ changes nothing."*  
  **Concede:**  
  *"Equilibrium *should* include all voices—but often doesn’t."*  
  **Reply (2-min):**  
  > "In theory, yes. In practice, tools like the MFQ are used to *define* whose judgments count as ‘considered.’ If conservatives are framed as having ‘more’ moral foundations, their intuitions seem overbuilt. If liberals are ‘narrow,’ theirs seem deficient. My descriptive claim corrects this misperception. Now, when we weigh intuitions, we start from parity—no side is ‘by default’ richer or poorer in moral resources."  
  **Soft Spot:**  
  *Assumes the MFQ influences philosophical methods—debatable.*

  ---

  ### **8. The Dreaded Question (You Hope Nobody Asks)**  
  **Objection:**  
  *"Where’s your *evidence* that people ‘weight considerations differently in real decisions’? You dismiss the MFQ but offer no alternative data. Isn’t this just armchair psychology?"*  
  **Why it’s deadly:**  
  Exposes your biggest gap—no original decision-making study.  
  **Concede:**  
  *"I haven’t run new experiments. This is a theoretical critique."*  
  **Reply (2-min):**  
  > "Fair—but we have clues. Tetlock’s work on taboo trade-offs shows liberals sacrifice ‘purity’ for justice; conservatives sacrifice ‘equality’ for loyalty. IHU studies reveal both sides reframe dilemmas to fit their values. The MFQ *predicts* attitudes but not behavior. My aim is to show why the survey’s ‘gap’ needn’t reflect real moral cognition. Next step: test my view with vignettes that decouple values from MFQ framings."  
  **Damage Control:**  
  Emphasize this as a *call* for better methods, not a finished product.

  ---

  ### **Key Takeaways**  
  - **Critical Reply to Land**: The **Psychometrician’s objection** (#1) is the lynchpin. If your semantic critique holds, the rest follows. If not, your descriptive claim collapses.  
  - **Biggest Vulnerability**: No new data (especially for real-world weighting).  
  - **Strategy**:  
    - For **descriptive claims**, pivot to *existing* studies showing framing effects (e.g., Graham’s loyalty reframing).  
    - For **normative claims**, stress the *procedural* point: "This isn’t about who’s right—it’s about starting fair."  
    - **Bridge audiences**: "Even if you reject foundations, my critique explains why *this tool* exaggerates polarization."

  Good luck—this room is a minefield, but your argument is nimble. Stay in the epistemology lane, and you’ll survive.
