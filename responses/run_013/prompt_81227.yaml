prompt: |-
  Hi, I'm the collections care officer at a regional museum — about 40,000 objects, three curators, nobody on staff with any philosophy — and I need help getting from an abstract puzzle to something I can actually run at my desk.

  Roughly twice a month a treatment proposal lands on me that turns out not to be a conservation question at all. The Roman torso: the head and both arms are eighteenth-century additions, a curator wants them off, and then wants a newly carved head put on. The whale in the entrance hall: maybe a third real bone, the rest cast and sculpted, and its the thing every school group comes for. The longcase clock somebody wants to make run again by swapping the movement. When these come up, one trustee says it's the same object as long as it's the same material, another says it's the same object as long as it looks the same from ten feet, and the registrar just wants to know whether the accession number survives. What actually rides on it is money and honesty: the record, the label, the valuation, whether we can lend it as 'the' object, and once in a while whether we're allowed to dispose of it at all. I usually have a day or two, sometimes an afternoon if something's wet, and anything that changes a label goes to the director, who will not read more than a page.

  I'm fairly sure this is the statue and the lump of clay in a museum uniform, and I know the usual moves in outline — two objects in one place, one thing under two sortals, the statue as a phase in the career of the clay, form and matter — but I've definately never seen anyone get from those to a rule, and I can't either. So: write me a decision procedure.

  What it has to have. The questions in the order I should ask them, and what counts as a sufficient answer to each, phrased so I can use it with a curator who thinks 'sortal' is a kind of soup. A point where it stops and says no, this is not the original any more and you may not go on calling it that. A point where it hands the thing to a person, because the question is one of values rather than facts, and it tells me which person that should be. And a small number of tests I can run in the storeroom — things I can settle by looking and by asking the curator one question, not by reading.

  The half-idea I've been groping toward, which you should either fix or throw out: I think some of our things matter as this particular stuff with this particular history (the bones, a relic) and some matter as a design that could in principle be made again and still be the thing (a cast, a chair we let people sit on), and that a lot of our fights are two people asking under different headings without saying which. I also suspect there is more than one identity question in play — one for the accession record, one for the scholar, one for the insurer, one for the label — and that these can honestly come apart, though I don't know when that's legitimate and when it's just wanting to have it both ways. And if the truthful verdict is sometimes 'not the same object, but the same individual at a later stage', I'd like to know that's on the menu and what it would change for me.

  Then run the procedure start to finish on all three cases above. At least one of them has to come out in a way the director won't like, and say so plainly instead of softening it. Finish by telling me what the procedure can't do, and where I'll be fooling myself that I've got a fact when I've really just made a choice.

  No citations please, I won't chase them down, and no headings, bullets, bold text or tables — plain paragraphs, like an email, because I'll be reading this on my phone between meetings.
reasoning: |-
  Okay, let me start by really understanding what this collections care officer needs. They're dealing with complex decisions about object identity in a museum setting, with real-world constraints like time pressure and practical limitations. The core challenge is turning philosophical concepts into a usable step-by-step procedure.

  Hmm, the key pain points seem to be: conflicting stakeholder views (trustees, curators, registrar), multiple practical implications (records, labels, lending, disposal), and time constraints. The officer already recognizes the matter/design duality but needs concrete tools.

  I notice they've given three test cases that each stress different aspects: the Roman torso (authenticity vs. historical composite), the whale (educational artifact vs. original specimen), and the clock (functionality vs. preservation). These will be perfect for validating the procedure.

  The officer's half-formed idea about material history vs. replicable design feels like the right foundation. But how to operationalize this? I think we need to separate two fundamental questions first: "what is this thing made of?" and "what is this thing for?" Then build decision branches from there.

  For practical use, the procedure must: flow in logical question order, have clear stopping points, assign value judgments to appropriate people, include simple physical tests, and acknowledge when multiple truths coexist. Most importantly, it must sometimes deliver uncomfortable conclusions.

  Let me structure it around five key questions that move from objective to subjective:
  Start with physical continuity (can we point to original parts?)
  Then consider deliberate creation (was it designed as one thing?)
  Then examine functional essence (does the change break its core purpose?)
  Only then address practical implications (what does each stakeholder need?)
  Finally articulate distinct truths (how do we communicate this complexity?)

  The whale example is particularly tricky - as an educational prop it might "survive" restoration, but as a scientific specimen it wouldn't. The procedure should force this distinction to surface rather than paper over it.

  I need to ensure every "stop" in the procedure has clear consequences: e.g., when original matter is below threshold = must change cataloging, cannot lend as original. And explicitly state who owns each value judgment - e.g., curators decide educational significance, director approves deaccessioning.

  The limitation section is crucial too. Must emphasize that at certain points we're making institutional choices, not discovering facts. Especially around percentages of original material - any threshold is arbitrary.

  For the test cases:
  - The torso fails at question 1 (original parts gone) - uncomfortable truth is it's a composite
  - The whale passes as educational artifact but fails as specimen
  - The clock movement swap might pass functionally but fail materially

  The director won't like that last one - we'll have to say plainly that keeping the original movement is essential for authenticity.

  Finally, the "same individual later stage" option should appear when original matter persists but form changes significantly - like conserved paintings where underdrawings become visible. But this requires full transparency in records.

  Throughout, language must stay soup-metaphor-free while handling concepts like sortals and phase sortals implicitly. No jargon, just "what is this thing fundamentally?" type questions.
answer: |-
  Here's a straight-talking decision procedure, built for your desk and your deadlines. It focuses on two core questions: **"What is this thing fundamentally *made of*?"** and **"What is this thing fundamentally *for*?"**. Conflicts usually happen when these answers clash. The goal is to pinpoint where the break happens and who needs to make the call when facts run out.

  **The Procedure (Ask in Order):**

  1.  **"Can we point to specific, original parts that *are* the thing we care about? What are they?"**
      *   *Why ask first?* Starts with physical reality. What's actually in front of you?
      *   *Sufficient Answer:* List the specific, original components (e.g., "the Roman marble torso", "the original whale vertebrae", "the clock case and dial"). If the answer is "nothing original remains" or "the original parts are gone/unrecoverable", **STOP HERE**. It is **not the original object** anymore in any material sense. You *cannot* ethically call it "the" original object on labels, for lending, or valuation. It's a replica, composite, or facsimile. (See Whale & Clock below).
      *   *Storeroom Test:* Physically inspect. Can you identify and isolate original elements? Ask the curator: "Point to the parts that were here when it was accessioned/made."

  2.  **"Was it deliberately created *as one thing* from the start?"**
      *   *Why ask?* Separates things designed as a unity (a painting, a chair) from composites (the Roman torso + additions, the whale mount) or objects where parts are functionally distinct (a clock case vs. movement).
      *   *Sufficient Answer:* "Yes, it was made whole" (e.g., the original whale skeleton before casting, a complete Roman statue) OR "No, it was assembled/modified later" (e.g., the torso with 18th-C additions, the whale mount mixing bone/replica, the clock case built for a movement). If "No," **it was likely always a composite**. The original *core* might remain (Question 1), but the *whole* as presented wasn't created that way. This flags complexity.
      *   *Storeroom Test:* Look for joins, material mismatches, documentation of assembly. Ask curator: "Was it found/donated like this, or put together later?"

  3.  **"Does changing it destroy the core reason it's significant *now*?"**
      *   *Why ask?* Gets to the functional essence or value proposition *for your museum*. This is where "matter" vs. "design" kicks in.
      *   *Sufficient Answer:* "Yes, because..." (e.g., "Its value *is* its original material/age - relic, specimen"; "Its wholeness *is* its historical truth - the composite torso"; "Its significance *is* the specific artist's hand - a painting") OR "No, because..." (e.g., "Its value is its form/function/educational impact - the whale as a teaching tool; a reproduction chair for sitting; the clock *telling time* with a period movement").
      *   *This is the Handoff Point.* If the answer hinges on *significance/value* ("Is original material *essential* to its value here? Is the current appearance its primary value?"), **STOP and hand it to the Curator(s) and Director**. Their job is to define the institution's stance on *why* the object matters. You provide the facts (Q1 & Q2), they decide the value judgment. Your job is to enforce the consequences of their decision in the records/labels.
      *   *Storeroom Test:* Ask curator *one* question: "If we change X, does it break the main reason we have this object? What *is* the main reason?" (Listen for "original bone," "authentic appearance," "it works," "kids recognize it").

  4.  **"Who needs to know what, and what do they need?"**
      *   *Why ask?* Acknowledges that different truths exist for different purposes.
      *   *Sufficient Answer:* List the audiences and their needs:
          *   *Accession Record/Registrar:* Needs the *physical truth* (Materials, modifications, provenance - Q1 & Q2 answer this). The number survives with the *original material*.
          *   *Scholar:* Needs *all* the truth (Original parts, additions, alterations, context). Often cares deeply about Q1 & Q2.
          *   *Insurer:* Needs the *current state and value* (What is it *now*? What would replace it? Value is set by the institution's stance - Q3).
          *   *Label/Public:* Needs *honest clarity* ("Roman torso, 2nd C AD, with 18th C restorations"; "Model of a Blue Whale, incorporating original vertebrae"; "Longcase Clock, case c.1780, modern replacement movement").
          *   *Lending:* Must match the *description* used for significance (Q3). If lent as "the" original, the original core (Q1) must be materially dominant and significant (Q3). If a composite or replica, say so.
          *   *Disposal:* Depends on policy, but *original material* (Q1) usually has stricter rules. Replicas/facsimiles may be easier to deaccession. **HANDOFF:** The Director, based on policy and significance (Q3), decides disposal per rules.
      *   *Storeroom Test:* None. This is desk work based on answers above.

  5.  **"What is the honest sentence describing this object *now*?"**
      *   *Why ask?* Forces you to synthesize Q1-Q4 into clear communication. This is your output for the label, proposal note, or director's one-pager.
      *   *Sufficient Answer:* A phrase like:
          *   "Original core with later additions/modifications"
          *   "Reconstruction incorporating original elements"
          *   "Modern replica/facsimile of..."
          *   "Original [Part A] with replaced [Part B]"
          *   "The original [Thing], conserved"
      *   *This is where "same individual, later stage" fits:* Use this *only* when the original matter (Q1) is substantially intact and continuous, but its form/context has changed *without deliberate remaking of its essence* (Q3). Example: A heavily conserved painting where the original paint layer is still the primary artifact, even if cleaned or stabilized. *What changes:* How you describe the intervention ("extensively conserved" not "restored"), potentially valuation, scholarly study. **Not** for swapping major components.

  **Running the Cases:**

  1.  **The Roman Torso:**
      *   Q1: Original parts? Yes, the torso marble. Arms/head? No, 18th-C additions. **Original core (torso) exists.**
      *   Q2: Created as one thing? Originally yes (whole statue), but *as it is now*, no. It's a composite (ancient core + later additions).
      *   Q3: Core reason significant? Likely **both** the ancient material *and* the historical composite nature (showing restoration practices). Removing *original* 18th-C parts *and* adding a *new* head destroys both the original core's context *and* creates a fake. **STOP - Not Permitted.** Destroying the original additions alters the historical artifact; adding a new head is fabrication. It stops being an ancient artifact with a restoration history and becomes a modern pastiche. *Honest Verdict:* **It is the original torso, but within a composite object formed in the 18th century. Removing the historical additions fundamentally alters *that* composite artifact. You cannot ethically add a new head.** Tell the Director: No, you can't do this without creating a fake and destroying historical evidence. The label must reflect the composite.

  2.  **The Whale in the Entrance Hall:**
      *   Q1: Original parts? Yes, some vertebrae. Majority? Cast/sculpted replica. **Original elements exist, but are minor.**
      *   Q2: Created as one thing? As it stands, yes – it was assembled as a complete mount mixing real and replica.
      *   Q3: Core reason significant? **Handoff to Curator/Director.** Is it a scientific specimen? Then it's mostly *not* the original (Q1 fails). Is it an iconic educational model? Then the *form* and *impact* matter most (Q3 = Form/Function). They decide its primary value. *Likely Outcome:* Its significance is as the beloved school group model. The original bones add interest but aren't primary. *Honest Verdict:* **It is a reconstruction/model of a whale, incorporating some original vertebrae.** It is **not** "the" whale specimen. The accession number stays with the original bones. For lending, it must be described accurately. Disposal of the *replica* structure might be easier if needed (Director decides based on policy).

  3.  **The Longcase Clock:**
      *   Q1: Original parts? Case & dial? Likely yes. Original movement? Yes, but to be removed/replaced. **Original core components exist.**
      *   Q2: Created as one thing? Traditionally, case and movement were often made separately but intended as a functional unit. The *functional essence* is split.
      *   Q3: Core reason significant? **Handoff to Curator/Director.** Is it significant as a complete historical artifact (material *and* function)? Or primarily as decorative furniture where time-telling is a bonus? If the former, swapping the movement destroys the integrity – the specific historical mechanics are part of the object. If the latter, a period replacement movement might be acceptable to restore function/appearance. *Honest Verdict (if they prioritize material/history):* **Swapping the original movement creates a different object: an original case housing a non-original movement.** The original movement *is* the clock's functional core. The "clock" as a complete historic artifact ceases to exist if you remove it. The accession number stays with the *original movement* if separated, or the whole if kept together. You cannot lend it as "the" 18th-century clock without qualification. **Tell the Director: If historical integrity matters, you can't swap the movement and still ethically call it the original clock. It becomes the original case with a replacement movement.** (This is likely the verdict they won't like).

  **What the Procedure Can't Do (Where You're Making Choices):**

  1.  **Define "Substantial" Original Parts (Q1):** Is 30% original enough? 51%? 10%? This is arbitrary. You *choose* a threshold based on best practice and institutional policy (aim for material dominance). It's a factual report *after* you choose the line. Document your reasoning.
  2.  **Define "Core Significance" (Q3):** You can identify the *question*, but the *answer* is a value judgment belonging to curators/directors. The procedure forces this choice into the open but doesn't make it for you.
  3.  **Reconcile Inherent Conflicts:** Sometimes the "matter" truth and the "design/function" truth are irreconcilable (like the clock). The procedure shows the conflict clearly but can't magically resolve it. You have to pick a primary truth for your purpose (e.g., record the material truth, label the functional truth *with caveats*).
  4.  **Eliminate All Ambiguity:** Some objects are messy (heavily repaired artifacts). The procedure gives a framework for honest description ("Original ceramic vessel with extensive fills and reconstruction") but won't make it simple.
  5.  **Override Policy or Law:** It informs decisions but doesn't replace deaccession policies, cultural protections, or legal requirements.

  You'll be fooling yourself that you have a pure fact when you decide the threshold for "original parts" (Q1) or when you accept the curator's definition of "core significance" (Q3) without questioning if it aligns with the physical reality (Q1 & Q2). The strength of this is that it forces those choices to be explicit and grounded in observable reality first. Use it to cut through the abstract soup and pin people down on what's actually there and why it matters *here*.
