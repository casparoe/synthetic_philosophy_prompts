answer: |-
  ### The Case
  The Thorne family firm, established in 1870s Birmingham, held a core tenet: "thrift as divine stewardship". This Protestant-derived value mandated parsimonious reinvestment of profits, forbidding lavish consumption. Consequently, Thornes Ltd. consistently ploughed back 80% of earnings for decades, fuelling steady expansion. By the 1920s, few family members actively held the religious belief. Yet, the 80% reinvestment rule persisted rigidly, enforced by long-serving, secular managers (many non-family) who cited "company tradition". Even new, non-religious employees adopted the practice swiftly, viewing it simply as "how Thornes operates". The behaviour endured until the 1950s, long after the original value had faded from collective memory.

  ### The Three Verdicts

  1.  **Causal-Mechanism/Rational-Choice Stance (Value as Cause):** The value *was* initially causal. It directly shaped the founding generation’s preferences, leading them to choose high reinvestment over consumption. This established a profitable pattern. Persistence is explained by rational habituation and institutionalisation: the behaviour became a low-effort, successful norm. New managers rationally adopted it because deviating risked conflict or reduced predictable profits. The value’s origin in preferences explains why *this specific* behaviour pattern emerged and solidified; material factors alone wouldn’t specify the 80% rule.
  2.  **Interpretive/Weberian Stance (Value Explains, Causality Ambiguous):** The value rendered the *initial* behaviour intelligible – founders acted *for the reason* of divine stewardship. This explanatory relevance is distinct from efficient causation. The later persistence, driven by tradition, habit, or institutional inertia, lacks this specific reason-giving force. Calling the value a "cause" of the enduring behaviour conflates understanding motive (its proper domain) with identifying mechanisms sustaining a practice. The value explains the origin and meaning of the pattern, but not necessarily its later mechanical reproduction.
  3.  **Materialist/Practice-Theoretic Stance (Value Not a Cause):** The value never caused anything. It was merely a *post hoc* justification supervening on the material practice of high reinvestment, driven by competitive pressures and the pursuit of capital accumulation inherent in the firm’s position. The behaviour persisted solely due to ingrained habits ("habitus") of managers, institutional routines, and market discipline. The value’s disappearance without behavioural change proves its epiphenomenal nature; the *real* causes were always the material practices and structures of the firm and market, which the value merely rationalised.

  ### What is Doing the Work
  The single feature driving the disagreement is the **persistence of the specific behaviour (80% reinvestment) for a generation after the value widely ceased to be held**. For the causal-mechanist, this persistence is *consistent* with the value’s initial causal role creating a stable norm. For the interpretivist, it *separates* the value’s reason-giving role (relevant at origin) from the later causal mechanisms. For the materialist, it *demonstrates* the value’s irrelevance, as the behaviour continues via material/habitual forces alone. Other features (non-value holders displaying behaviour) are important but secondary; it is the *temporal decoupling* that forces the stances to confront the relationship between origin, meaning, and sustained causation.

  ### Stripping the Feature Out
  If the behaviour *ceased* shortly after the value faded, the case collapses towards consensus. The causal-mechanist stance would be strongly confirmed: value directly caused behaviour. The interpretivist could still argue for a distinction between reason and cause but would lack the key evidence separating them, making the stance less compelling. The materialist stance would become difficult to sustain, as the behaviour’s dependence on the value would be evident, undermining claims of its epiphenomenal nature. The case would resemble a simpler narrative of direct cultural causation, like a naive reading of Weber, where value change leads directly to behavioural change.

  ### The Pushback (Materialist Stance Defender)
  "This case is rigged to obscure material reality by fixating on a superficial 'value'. You've artificially isolated 'thrift as divine stewardship' as a discrete cause, ignoring it was always embedded in and generated by the material practice of capital accumulation within a competitive market. The 'persistence' proves nothing except the robustness of the underlying economic habitus and institutional structure. The so-called 'value' was just the linguistic wrapping specific to that firm's early context. The *real* cause – the imperative to accumulate capital – remained constant before, during, and after the value's currency. Attributing causality to the value reifies ideology and ignores the continuous material substrate driving the identical behaviour. The disagreement is an artefact of your idealist framing that privileges a belief as separable from the practice it accompanied."

  ### Bottom Line
  The case suggests that a value (thrift as divine stewardship) can possess significant *explanatory relevance* by making the origin and specific form of a behaviour intelligible, without necessarily functioning as the direct *causal mechanism* sustaining that behaviour over time, especially after the value itself fades. Conversely, it shows that identifying a *causal mechanism* for persistence (habits, institutions) does not negate the value's potential role in explaining the behaviour's initial emergence and distinctive character.
