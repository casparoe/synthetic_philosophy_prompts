answer: |-
  Here’s a structured 40-minute lesson plan for your Judy Benjamin session, prioritising conceptual clarity and addressing predictable pitfalls. Focus on **why** the problem resists straightforward solutions.

  ---

  ### **Phase 1: Foundations (10 mins)**  
  **Goal:** Establish prerequisites without overloading.  
  **Key elements:**  
  1. **Spatial Setup (3 mins):**  
     - Sketch the map: Red/Blue Territory, each split into HQ (Headquarters) and 2nd Company areas.  
     - Initial belief: Equal prior probability over *all four quadrants* (P(R-HQ) = P(R-2nd) = P(B-HQ) = P(B-2nd) = 0.25).  
     - *Crucial:* Stress that Judy knows *nothing* about correlations between colour and company location.  

  2. **Conditional Probability vs. Material Conditional (7 mins):**  
     - **Simple example first:** "If it rains (R), the match is cancelled (C)". Contrast:  
       - *Material conditional (P(¬R ∨ C))*: True whenever it doesn’t rain, or if cancelled.  
       - *Conditional probability (P(C|R))*: Only concerns cases where rain *actually occurs*.  
     - **Relevance to Judy:** The radio message *"If you’re in Red, then it’s odds 3:1 you’re in 2nd Company"* provides **P(S|R) = 0.75**, *not* P(¬R ∨ S).  
     - *Head off misconception:* "The message fixes P(S|R), so why isn’t conditioning on that sufficient?" → Explain: Conditioning requires a *proposition* (e.g., "S|R"), but "S|R" isn’t a true/false event—it’s a *constraint*.  

  ---

  ### **Phase 2: The Problem & Failed Approaches (15 mins)**  
  **Goal:** Show why standard tools fail. Use Judy’s case directly.  
  **Sequence:**  
  1. **State the radio update:** P(S|R) = 3/4. Judy’s new belief about *location*?  
  2. **Pitfall 1: "Just set P(S|R) = 3/4!" (5 mins)**  
     - Why it fails: This specifies one value but leaves the entire distribution underdetermined (e.g., P(R), P(S|B) still free).  
     - *Illustrate:* Ask the group: "Should P(S|B) change? Should P(R) stay 0.5?" → Highlight ambiguity.  
  3. **Pitfall 2: Conditionalising on the material conditional (5 mins)**  
     - Proposal: Update on ¬R ∨ S ("Either not-Red, or in 2nd Company").  
     - Calculate: P(¬R ∨ S) = 1 – P(R & ¬S) = 1 – P(HQ|R)P(R) = 1 – (0.25)(0.5) = 0.875.  
     - Apply Bayes: P(HQ|¬R ∨ S) = P(HQ & (¬R ∨ S)) / P(¬R ∨ S) = P(B-HQ)/0.875 = 0.25/0.875 ≈ 0.286.  
     - **Problem:** This *changes* P(B-HQ), which seems unjustified—the message didn’t mention Blue territory!  

  ---

  ### **Phase 3: The Infomin Solution & Controversy (10 mins)**  
  **Goal:** Present the standard resolution *and* its oddity.  
  **Approach:**  
  1. **Introduce Infomin intuitively (5 mins):**  
     - "We need a *unique* update that respects P(S|R)=3/4 while altering priors minimally."  
     - *Avoid entropy maths:* Frame as "preserve as much prior structure as possible." Key assumption: **Leave ratios within unaffected regions unchanged**.  
     - Calculation sketch:  
       - Fix P(S|R)=3/4 → P(HQ|R)=1/4.  
       - Assume P(S|B) *unchanged* (minimises "unnecessary" changes).  
       - Thus: P(B-HQ) / P(B-S) remains 1:1, P(R-HQ) / P(R-S) becomes 1:3.  
       - Solve: P(R) decreases (P(R-HQ)=0.1, P(R-S)=0.3, P(B-HQ)=0.3, P(B-S)=0.3).  
  2. **Controversy (5 mins):**  
     - **Result:** P(HQ) = P(R-HQ) + P(B-HQ) = 0.1 + 0.3 = 0.4 (down from 0.5).  
     - **Why controversial?** HQ area is *safer*, but Judy’s belief in being there *decreases* after a message *only about Red*. Feels counterintuitive!  
     - *Key insight:* Infomin assumes *conditional independence* unless forced otherwise—here it "protects" P(S|B), squeezing the update into P(R) and P(HQ|R).  

  ---

  ### **Phase 4: Consolidation & Check (5 mins)**  
  **Diagnostic question (to check conceptual grasp):**  
  > *"After the radio update, Judy’s probability of being in Headquarters decreases (from 0.5 to 0.4). But the message only mentioned Red territory—why does this feel paradoxical, and what assumption in the Infomin update drives this result?"*  

  **Expected answers:**  
  - Paradox: Message seems irrelevant to Blue/HQ, yet changes belief about HQ.  
  - Driver: Infomin preserves P(S|B) (no update "justification" to change it), forcing the P(S|R) change to reduce P(R-HQ) and thus total P(HQ).  

  ---

  ### **Teaching Notes**  
  - **Why Judy’s case?** It’s the simplest example where conditional info *constrains but doesn’t fully specify* the posterior.  
  - **What to skip:** Relative entropy maths. Focus on its *effect* (preserving untouched conditionals).  
  - **Misconception timing:**  
    - Pre-empt "just set P(S|R)" when introducing the radio message.  
    - Crush material conditional *after* they see its unstated impact on Blue.  
  - **Emphasise:** The core challenge is *underdetermination*—many distributions satisfy P(S|R)=3/4. Infomin picks one via a conservative principle (which some dispute!).  

  This flow ensures the paradox bites: They’ll *feel* the unease about Infomin’s result, priming deeper discussion post-session. Good luck!  

  ---  
  *Further reading: Van Fraassen’s 1981 paper (the originator), with Douven & Romeijn for modern critiques. Skip unless group is especially keen.*
