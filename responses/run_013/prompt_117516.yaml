prompt: |-
  I'm planning a session for our reading group on the Judy Benjamin problem — the case where Judy is dropped into Red/Blue territory subdivided into Second Company and Headquarters areas, and the radio message constrains a conditional probability rather than an unconditional one. The group is comfortable with Bayesian conditionalisation and has at least heard of Jeffrey conditioning, but most haven't encountered the problem before. I don't need you to explain the problem to me; I want a plan for teaching it in about forty minutes. What has to be in place before the problem even makes sense — in particular, how much of the material-conditional-versus-conditional-probability distinction should come first, and does the group need to understand relative entropy minimisation before they can see why the standard infomin answer is controversial? What single example should carry the session, and should it be Judy's case itself or something simpler? Which misconceptions will they form — I'd guess "the message just fixes P(S|R), so why isn't that the end of it?" and "you should simply conditionalise on the material conditional" — and at what point in the sequence should I head each off? Finally, what question should I ask at the end to check whether they've understood the crux rather than just followed the algebra? Please answer in British English.
