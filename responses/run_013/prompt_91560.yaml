answer: |-
  ## Driving Policy

  The road unspools. Each branching looks the same.
  One rule must serve both turns. The trees stand witness,
  indistinct. I choose:

  **Straight on.**

  (At the first bend, this choice is merely wise:
  a turning there yields nothing. Only onward
  preserves the chance for more.)

  The headlights carve the dark. The mist grows thick.
  Is this the place? The trees lean, mute observers.
  I hold the course, enact the chosen plan:

  **Straight on.**

  (But here, the second turn, the longed-for prize
  lies waiting just beyond the verge! To sail past
  now is to grasp the lesser, lose the much.)

  The wheel feels cold. The policy I made
  when roads were clear demands I pass the treasure.
  One act, one shape, must fit both gaps unseen.
  To seek the best *here* needs a knowing glance,
  but trees repeat their shadows without end.
  What's best on *average* breaks upon *this* verge
  where action and intention split the road
  and vanish in the mist, in the same breath.

  ---

  **Notes on the Approach:**

  *   **Refrain Duality:** The refrain **"Straight on."** first appears as the sound, rational policy choice (correct for Intersection 1). Its exact repetition later becomes the tragic error at Intersection 2, where turning would yield the high payoff.
  *   **Indistinguishability:** "Each branching looks the same," "indistinct trees," "Is this the place?", "trees repeat their shadows without end" emphasize the driver's inability to tell which intersection she's at.
  *   **Policy vs. Local Action:** The poem contrasts the driver's necessary *policy* ("One rule must serve both turns," "the policy I made") with the impossible desire for the locally optimal action *here* ("To seek the best *here* needs a knowing glance"). The driver cannot execute "turn at 2" without knowing she's at 2.
  *   **The Gap:** The closing lines explicitly state the conflict: "What's best on *average* breaks upon *this* verge / where action and intention split the road." The driver *intends* to turn at 2 via her policy, but the *action* demanded by that policy ("Straight on") prevents it. This gap remains unresolved ("vanish in the mist").
  *   **Vividness:** Imagery of the road, mist, headlights, indistinct trees, and the cold wheel creates a concrete setting for the abstract dilemma. The payoff difference is implied ("nothing" vs. "longed-for prize," "lesser" vs. "much").
  *   **Recognition:** Someone familiar with the paradox will recognize the first **"Straight on."** as the optimal choice for Intersection 1 (low payoff turn) and the second **"Straight on."** as the mistake at Intersection 2 (high payoff turn). The final lines explicitly name the core conflict between average-optimal policy and locally-optimal action.
  *   **Accessibility:** Without knowing the paradox, the poem presents a clear dilemma of a driver lost on identical roads, forced to make one decision that fits both, leading to a situation where her chosen action seems to thwart her own goal at a critical moment she cannot identify.
