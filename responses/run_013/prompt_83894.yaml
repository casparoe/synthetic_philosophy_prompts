answer: |-
  Consider this framework—think of it as a morphological key for moral intuitions, where the specimens are our ethical commitments laid bare by concrete cases. We begin with the most common entry point: suffering. Does the capacity to experience pain or distress grant an entity moral status? If you say no, we immediately diverge; your path likely leads to views where moral significance requires something more demanding, like complex agency. But if you say yes, we immediately encounter the pig and the human infant, stipulated to have identical cognitive and affective capacities. If you believe they deserve identical moral consideration, you stand firmly against giving weight to species membership itself. If you hesitate, believing the infant warrants greater protection despite identical capacities, you signal that species membership, or perhaps something tied to it like relational bonds or symbolic value, carries independent moral weight.

  Now, take that infant. Imagine it suffers a catastrophic injury, leaving it in a persistent vegetative state, devoid of consciousness, sensation, or any prospect of recovery. Does it retain the same moral status it had before? If you believe its current lack of capacities negates its moral standing, you prioritize actual, present capacities. If you believe it retains significant status, perhaps because of what it was, or what it represented (a member of our moral community), or its inherent human dignity, you lean towards potential, relational, or kind-based grounds. This forces a choice: are we valuing the actual individual before us, or something about the kind it belongs to, or the relationships it once sustained?

  Next, consider range. Compare a dog, a chimpanzee, a chicken, an octopus, and a shrimp. Do you see a clear hierarchy in their moral standing, perhaps aligning roughly with cognitive complexity or behavioral richness? If so, you likely see moral status as a matter of degree, contingent on the possession of specific capacities. Or do you see a sharp line? Perhaps only above a certain cognitive threshold (maybe excluding the shrimp and chicken)? Or perhaps suffering itself creates a threshold, grouping all sentient beings (dog, chimp, chicken, octopus, possibly shrimp if you believe it suffers) together? If you see degrees, can you compare them meaningfully? Could the interests of many shrimp ever outweigh the significant harm to one chimpanzee? If you believe such comparisons are possible, status is commensurable. If you find the idea repugnant, believing a chimp's fundamental interests always trump vast numbers of shrimp interests, you see status as lexically ordered.

  Now, ponder potential. Imagine a being—perhaps a human fetus or infant—that would have developed full rational capacities but for a developmental accident or genetic anomaly. Does this lost potential grant it significant moral status? If yes, you accord weight to modal properties—what the individual *could have been* under normal circumstances. If no, you focus strictly on its actual, realized capacities.

  Species membership itself: is it ever a fundamental ground for moral status, or is it only ever a rough indicator for underlying capacities? If someone argues that simply being human grants unique moral worth, irrespective of individual capacities (remember the infant versus pig case, and the PVS patient), they endorse species membership as directly status-conferring. If they reject this, status must derive from individual properties or relationships.

  Consider enhancement. A member of a cognitively simple species—say, a mouse—is genetically modified to possess human-level intelligence and self-awareness. Does it now possess moral status equivalent to a human with those same capacities? If yes, you prioritize the individual's actual capacities over its species origin. If no, species membership or kind constrains the moral significance of enhanced capacities.

  The wrongness of killing: is it distinct from the wrongness of causing suffering? Imagine a painless, instantaneous death for a being that desires to continue living its life. Is this wrong in itself, even without suffering? If yes, you separate killing from suffering; preventing future experiences or thwarting preferences matters independently. If no, the wrongness lies solely in any suffering caused or the loss of future pleasure, collapsing the distinction.

  Finally, the case closest to my heart: a species, like certain colonial invertebrates perhaps, where individual members possess only rudimentary awareness—akin to a shrimp—but the collective colony behaves as a rational, self-aware entity, making decisions, solving problems, and seemingly possessing a collective consciousness. Does moral status attach primarily to the individual shrimp-like zooids, or to the emergent colony system? If you insist status resides solely in the individuals, you must deny the colony itself possesses moral claims, however complex its behavior. If you grant status to the colony as a system, you embrace a form of holism where collective organization generates moral significance beyond the individuals composing it.

  Following these branching paths, defined by your answers to these concrete cases, leads us to distinct positions. If you affirm suffering as sufficient for status, reject species membership as fundamental, see status as a threshold (all sentient beings equal), and separate the wrongness of killing from suffering, you arrive at **Equal Consideration of Interests (Utilitarianism/Painism)**, whose awkward commitment is that the suffering of a mouse must be weighed equally against comparable suffering in a human. If you affirm suffering as necessary but see status as hierarchical and commensurable, you land in **Scalar Welfarism**, whose awkward commitment is accepting that large numbers of low-status beings can morally outweigh the significant harm to one high-status being. If you focus on actual complex capacities (like autonomy, future-planning) as the threshold for full status, often termed personhood, you reach a **Rights View**, whose awkward commitment is that beings lacking those specific capacities (like infants, PVS patients, or many animals) have significantly diminished or no direct rights claims.

  If you ground status primarily in the capacities typical for the biological kind, granting higher status to a normal human than a normal pig even if a specific pig matched a specific human, you find **Hierarchical Species-Typicalism**, whose awkward commitment is that a severely cognitively impaired human retains higher status than a cognitively sophisticated pig solely because of species norms. If you grant significant status based on what an individual *could have been* under normal circumstances (like the injured potential human), you endorse **Modal Personhood**, whose awkward commitment is that a healthy human zygote possesses greater moral status than an adult chimpanzee due to its potential trajectory. If you believe only beings capable of rational agency and reciprocal moral reasoning warrant full moral status, you adopt a **Rational-Agency-Only View (Kantianism)**, whose awkward commitment is the near exclusion of most animals, infants, and cognitively disabled humans from direct moral consideration.

  If you see status as fundamentally arising from membership in a community of mutual recognition and obligation, you enter a **Relational or Contractualist View**, whose awkward commitment is that a highly intelligent, suffering alien, or an enhanced mouse, might lack moral standing if unable to participate in our (or its own species') moral practices. If you accept animal suffering matters but permit their humane use for human benefit (food, research), you align with **Humane-Use Welfarism**, whose awkward commitment is condoning the instrumental use and ultimate killing of sentient beings provided suffering is minimized. If you reject individual sentience as the sole locus of value, perhaps granting moral significance to living things, species, or ecosystems themselves—especially in the collective intelligence case—you approach a **Biocentric or Ecocentric View**, whose awkward commitment is potentially valuing the integrity of a species or ecosystem over the suffering or killing of individual organisms within it.

  Notice that the combination denying suffering grounds status *and* seeing status as a threshold *and* rejecting species membership as fundamental struggles to find any coherent position—it seems unstable. Similarly, affirming species membership as status-conferring *while* insisting status is a threshold based solely on individual capacities creates tension; these paths may lead to incoherence or require significant qualification. Views combining gradation with lexical ordering are rare and largely unexplored in mainstream discourse. Crucially, the positions **Equal Consideration** and **Scalar Welfarism** cannot be cleanly separated by our questions if both affirm suffering as sufficient and reject species membership; the distinction hinges entirely on whether status is seen as a threshold or gradational, revealed in the animal ranking case. The **Collective Intelligence** case most sharply divides individualistic views (Rights, Equal Consideration, Scalar Welfarism) from holistic ones (Biocentrism/Ecocentrism), forcing a commitment on where status truly resides. This, I hope, provides the instrument to dissect the assumptions my students bring into the room.
