  I'm applying for a small six-month grant (philosophy of mind / ethics crossover) and need a research proposal on the hedonistic imperative, the abolish-suffering-with-biotech program, humans first and wild animals eventually. My half-formed thought, and I honestly don't know if its a real problem or just a confusion I'm stuck in: the program seems to assume valence is one axis, that "suffering" picks out a single quantity you can turn down, and that turning it down is always an improvement. The cases that make me doubt it are people born with congenital insensitivity to pain, who aren't better off — they wreck their joints and die young — and the way aversive states look load-bearing for attention, learning, and caring about anything at all. So I want the proposal to state the question precisely: does the case for the imperative survive if hedonic valence is plural rather than unitary, so that there's no single dial to turn? Then say why the existing answers leave that open (my sense is that both the defenses and the standard critiques treat suffering as one thing to be minimized, so neither has to take the pluralist option seriously), what the method would be — I'd want it conceptual and case-driven rather than empirical, taking a few functionally distinct aversive states and asking what removing each would do to an agent's motivational economy, and then what the imperative's normative premises actually require of that — what a result would look like, what would count as the project failing (my worry: it turns out to be a terminological fight about how we count states), and a realistic scope for six months. Keep it to the human case and say so explicitly, I don't want it ballooning into gene drives and wild animal suffering, thats a seperate paper. Don't bother with citations or a reading list, I'll fill those in. And write it in continuous prose, no headings or bullets or bold, just paragraphs, I'll reformat it myself when I paste it in.
