  My mate Dan and I have been going round and round on this for about two months and it always ends the same way, which is why I'm asking you. His position: oversight-by-debate is basically dead in the water. You know the setup — two models argue in front of a judge who can't do the task itself, and the hope is that refuting a lie is easier than telling one, so a weak judge can supervise something stronger than it. Dan's killer case is the obfuscated arguments problem: the dishonest debater strings together a long, individually plausible chain that lands on the wrong answer, and neither debater can point to which step is broken, so the honest one is stuck saying some step in there is wrong without being able to say which. Meanwhile the honest debater's own long argument looks the same to the judge, and nothing in the protocol separates the two cases. He leans on the human-judge experiments where exactly this pattern showed up on real physics problems, and on the fact that the whole guarantee seems to presume the task breaks down into steps a human can check one at a time — his line is that the interesting cases are precisely the ones that don't, or where the gap between what the judge can check and what the model can do is polynomially large, and then the checks you'd need become infeasible. My side: there's the complexity-theoretic work showing the judge needs only a constant number of checks and the honest debater only modestly more compute than the liar, even with the liar unbounded, and people have at least sketched a route through the obfuscation thing — let the second debater challenge the first with related subproblems it can plant a trapdoor answer to, so the class of subproblems is shown to be solvable rather than just asserted. Dan says all of that quietly assumes the honest debater knows where the right answer is and only needs to steer the judge to it, which is the very thing at issue. I say if you're claiming the protocol fails you owe me a counterexample or a theorem, not a vibe. He says I'm asking him to prove a negative. And that's where we sit.

  What I want from you isn't a literature survey and it isn't a verdict on who's right about AI — it's a diagnosis of what kind of disagreement this actually is. Is one side answering a formal question (does some protocol exist with a proof of honesty-under-assumptions in a model that permits obfuscation) while the other is answering an empirical one (how big is the judge-checkable/not-checkable gap in practice, at scale, with a model judge rather than a human one)? Or are we just using debate works to mean different things — the honest strategy being a Nash equilibrium, versus the thing we'd actually deploy and trust? Or is it a burden-of-proof standoff, where he wants a construction and I want a refutation, and neither demand can be met? My own hunch, which I'd like you to test rather than accept, is that we're answering different questions under one heading and the reason nothing moves is that the real disagreement is about what would have to be true before you'd hand a weak judge authority over a strong model — which sounds more like risk appetite than like a technical claim. Don't tell me both sides have a point, that's the one thing I can already do myself. Also, we both have day jobs, so if the honest answer is that this needs data, say which data and what it would look like.

  Give it to me as exactly five numbered points, one or two sentences each, no preamble and no wrap-up — straight into point one. If it helps, the five I'd want are: what the disagreement really is, what each of us is actually committed to by our own moves, what's doing the hidden work, what would genuinely move it, and whether it should move at all.
