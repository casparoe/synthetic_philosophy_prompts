prompt: |-
  I am a third-year undergraduate taking a seminar in the philosophy of biology, and I also work about ten hours a week as an editorial assistant for a publisher that produces a digital high-school biology textbook. My job is line-editing and flagging claims for review, and the same problem keeps returning: sentences that say the function of some trait is to do something. There are hundreds of them across the book, I have to clear roughly forty a week, and I have about three minutes per sentence. I have no research budget, no access to the primary literature on most of these organisms, and no background in the taxa in question; the writers I work with are generalists too. Our standards reviewer has begun returning pages with the note "unwarranted teleology," which nobody in the office can define.

  The seminar has given me two ways of answering the question what the function of a trait is. On the first, a trait's function is what it was selected for: the effect that explains why the trait is present in this lineage, given its history. On this view a trait that exists for no such reason has no function at all, however useful it may be, and a trait that was selected for one effect and is now used for another has the function it was selected for rather than the one it now serves. On the second, a trait's function is the contribution it makes to some capacity of the larger system it belongs to. On this view history is irrelevant: a trait can have a function in this sense even if it arose by accident, and the same trait can have as many functions as there are capacities you might ask about.

  I need a procedure I can actually run, sentence by sentence, that uses these two accounts to decide what to do with a sentence. Please give me:

  1. The steps in the order I should ask them, with a clear statement of what counts as a sufficient answer at each step, and where the procedure stops with a verdict.
  2. Three possible verdicts and when each applies: accept the sentence; rewrite it so that it asserts only what the evidence supports; send it to a consultant. For the rewrite option, include a formula a writer with no philosophy training can execute in two minutes.
  3. The points where the procedure hands the decision to a person rather than settling it, and an honest account of which of those points are real judgment calls and which are merely places where I am ignorant.
  4. What the procedure cannot do at all, and the kind of sentence it will get wrong.

  Then run it on three sentences:

  (a) The familiar case of feathers, where the standard account is that they arose in a lineage in a thermoregulatory or display context and were later co-opted for flight. What do I do with "the function of feathers is flight"?
  (b) A gene inserted into a crop for pest resistance, in our biotechnology chapter, where there is no selection history at all. What does each account license me to say?
  (c) A confident sentence about the function of a trait in a little-studied organism, where we have a clear description of what the trait does and no evidence whatever about its history.

  I have also been told that a reviewer disputes the standard story about the giraffe's neck. I do not need you to settle that, but tell me how the procedure behaves when the experts themselves disagree about the history, since I cannot adjudicate that from my desk.

  The one idea I have had so far is a test: before letting a sentence through, imagine the same organism with the same trait but with no history of selection for it at all — a mutant, or an engineered version — and ask whether the sentence would still be true. If it would, then the sentence is a claim about what the trait does rather than about what it is for, whatever it says. Tell me whether that test is sound, what it gets right, and where it breaks; if it is broken, replace it with something better.

  Finally: at each step, say which of the two accounts is doing the work, and flag the steps where the two accounts would give different verdicts on the same sentence, because I suspect those are where the procedure is most fragile. Include at least one case where the procedure tells me to kill a sentence I would rather keep. The procedure itself should fit on a page; the applications can run longer.
reasoning: |-
  Hmm, this is a fascinating challenge from a philosophy of biology student working as an editorial assistant. They're grappling with teleological language in biology textbooks and need a practical decision procedure based on two function concepts: the etiological view (selected effects) and the systemic view (causal role).

  The user has outlined very specific requirements: they need a step-by-step procedure with clear verdicts (accept/rewrite/refer), examples of application, and transparency about judgment calls. They're time-constrained (3 minutes per sentence!) and lack research resources. I should address their "mutant test" idea and explicitly note where the two function concepts conflict.

  Key constraints from their situation:
  - No budget or literature access
  - Generalist writers
  - "Unwarranted teleology" complaints
  - Must handle cases like feathers (historical change), GMOs (no history), and obscure organisms (no history)

  For the procedure design:
  I'll build a flowchart-style algorithm that starts by checking for explicit history mentions, then moves to evidence quality. The systemic view will handle cases where history is unknown or irrelevant. The "mutant test" they proposed is actually a decent proxy for systemic function but fails for etiological claims - I'll incorporate it with caveats.

  For the verdict system:
  - Accept: Only when both accounts agree or evidence is solid
  - Rewrite: Using a simple "enables" template for systemic cases
  - Refer: When history is disputed or evidence ambiguous

  Special conflict points to highlight:
  - Feathers: Systemic says "enables flight" but etiological rejects "function is flight"
  - GMOs: Etiological view blocks function claims entirely
  - Giraffe necks: Procedure should flag for expert consultation when history is contested

  I'll structure the response with:
  1. The procedure flowchart
  2. Verdict definitions
  3. Judgment call explanations
  4. Limitations
  5. Example applications
  6. Analysis of their mutant test

  The giraffe neck dispute is perfect for showing how the procedure handles expert disagreement - it'll trigger the "refer" verdict. And I'll include an example where we must reject "function is flight" for feathers despite its intuitive appeal, to demonstrate philosophical rigor over convenience.

  Most importantly, this needs to be practically usable. Every step must be executable in seconds, with no jargon. The rewrite template should be foolproof for non-philosophers. And I'll explicitly call out where the user's 3-minute limit forces compromises.
answer: |-
  Here is a practical, step-by-step procedure based on your two accounts of function (Etiological = "selected effect"; Systemic = "causal role"). It prioritizes efficiency and minimizes unresolvable judgment calls.

  ---

  ### **Function Claim Evaluation Procedure**
  *(Etiological Account = E; Systemic Account = S)*

  1.  **STEP 1: Does the sentence explicitly reference history (e.g., "evolved to", "selected for", "adaptive purpose")?**
      *   **Yes:** Proceed to Step 2.
      *   **No:** Proceed to Step 3.
      *   *Account in Use: Both (Determining claim type).*

  2.  **STEP 2: Is there explicit, uncontroversial evidence for the stated historical function in this sentence?** (e.g., "Feathers evolved for thermoregulation" cites fossil/developmental evidence; "This gene was inserted to confer pest resistance").
      *   **Yes:** **VERDICT = ACCEPT.** (Sentence matches evidence). *Stop.*
      *   **No:** **VERDICT = REWRITE** (using Systemic template). *Stop.* (Claim overreaches historical evidence).
      *   *Account in Use: E (Assessing historical claim).*

  3.  **STEP 3: Does the trait demonstrably *enable* or *contribute to* the stated activity *in the current organism/system*?** (e.g., Feathers demonstrably enable flight in birds; the inserted gene demonstrably kills pests; the giraffe's neck demonstrably enables reaching high leaves).
      *   **Yes:** Proceed to Step 4.
      *   **No:** **VERDICT = REWRITE** (using Systemic template, *if* it contributes to *something*) **or KILL** (if demonstrably false). *Stop.* (Core causal claim is wrong).
      *   *Account in Use: S (Assessing current causal contribution).*

  4.  **STEP 4: Is the trait's evolutionary history for *this specific effect* well-established and uncontroversial *in the relevant lineage*?** (This is the key judgment call).
      *   **Yes (Strong Consensus):** **VERDICT = ACCEPT.** (E account satisfied). *Stop.*
      *   **No (Unknown, Disputed, or Co-opted):** **VERDICT = REWRITE** (using Systemic template). *Stop.* (Insufficient evidence for E claim; S claim is safe).
      *   *Account in Use: E (Assessing historical evidence strength).* **Conflict Point:** E may require rewrite; S allows acceptance of rewritten claim.

  **REWRITE TEMPLATE (Systemic Focus):**
  Replace "The function of [TRAIT] is to [ACTIVITY]" with:
  *   **"[TRAIT] enables [ORGANISM] to [ACTIVITY]"** OR
  *   **"[TRAIT] plays a key role in [ACTIVITY] for [ORGANISM]."**
  *(Writers can execute this in <2 mins; it removes teleological implication while stating the causal contribution.)*

  **VERDICTS:**
  1.  **ACCEPT:** Use *only* if:
      *   The sentence explicitly states a historical function AND Step 2 confirms evidence (E), OR
      *   The sentence makes a systemic claim AND Step 4 confirms strong historical consensus for that effect (E).
  2.  **REWRITE (Systemic Template):** Use if:
      *   A historical claim lacks explicit evidence (Step 2: No).
      *   A systemic claim is valid (Step 3: Yes) BUT historical evidence is lacking/controversial/co-opted (Step 4: No). **Most common outcome.**
  3.  **REFER TO CONSULTANT (or KILL):** Use *only* if:
      *   The causal claim is demonstrably false (Step 3: No - requires checking basic biology).
      *   **Crucially:** Step 4 reveals **active, significant expert disagreement** about the historical function *for the specific effect mentioned in the sentence*, even if the systemic claim (Step 3) is true. (This is rare; usually, rewrite suffices).

  **JUDGMENT CALLS & IGNORANCE:**
  *   **Step 4 (History Well-Established?):** This is the **MAJOR JUDGMENT CALL.** You must assess the *degree* of consensus from your general knowledge, textbook context, or common knowledge (e.g., "eyes are for seeing" = strong consensus; "giraffe necks are for feeding" = strong consensus *despite fringe disputes*; "feathers are for flight" = weak consensus for origin). **Ignorance Default:** If you genuinely don't know the state of the field (common for obscure taxa), assume "No" (controversial/unknown) -> **REWRITE.** Err on the side of caution.
  *   **Step 3 (Causal Contribution?):** This is **mostly factual (not judgment)**, but relies on your biological knowledge or the textbook's description. If the text clearly describes the trait *doing* the activity, it's Yes. If unsure, it's a factual gap -> **KILL/REFER** (rare).

  **WHAT THE PROCEDURE CANNOT DO / LIMITATIONS:**
  1.  **Resolve Genuine Scientific Disputes:** It flags them (Step 4 -> Refer), but doesn't solve them.
  2.  **Define "Strong Consensus":** You must use judgment (Is this like "hearts pump blood" or like "giraffe necks for fighting?"). When in doubt -> Rewrite.
  3.  **Handle "Function" Claims in Truly Ahistorical Systems (like some engineered traits):** E account blocks "function"; S account allows it. The procedure forces Rewrite (Systemic) for these (Step 4 always = No for novel traits).
  4.  **Get "Deep" Etiological Claims Perfect:** It relies on textbook-level knowledge of history. Obscure or newly revised histories might slip through as "Accept" if consensus *seems* strong based on general knowledge but isn't.
  5.  **Where it Might Get it Wrong:** Accepting a sentence based on perceived strong historical consensus (Step 4: Yes) that is actually outdated or oversimplified (e.g., "The function of the appendix is vestigial" - its potential secondary functions were historically downplayed). Rewriting systemic claims avoids most big errors.

  **Your Mutant Test:**
  *   **Soundness:** Excellent proxy for **Systemic (S) function.** If the sentence ("Function is X") would be true of a novel mutant/engineered trait doing X, it's *only* claiming S function. Your test correctly identifies these.
  *   **What it Gets Right:** Efficiently isolates claims relying *only* on current causal role (S).
  *   **Where it Breaks:** Fails for **Etiological (E) function.** A true E claim ("evolved *for* X") would be *false* for a novel mutant/engineered trait doing X. Your test would incorrectly flag a valid E claim for rewrite. It also doesn't help if the mutant *couldn't* do X (invalidating even S).
  *   **Integration:** The test is incorporated into Step 3 & Step 4 logic. Step 3 asks if the trait *does* contribute now (like your test). Step 4 explicitly checks the history your test *removes*.

  **Conflict Points (Where E and S Verdicts Differ):**
  *   **Co-opted Traits (Feathers):** E says "Not for flight (originally)"; S says "Enables flight". Verdict: REWRITE (Systemic).
  *   **Novel Traits (Engineered Gene):** E says "No function (in this lineage)"; S says "Enables pest resistance". Verdict: REWRITE (Systemic).
  *   **Traits with Unknown History:** E says "Cannot claim function"; S says "Can claim contribution". Verdict: REWRITE (Systemic).
  *   **Traits with Multiple Contributions:** E identifies the *selective* effect; S can list all contributions. Verdict: If the sentence names a contribution that wasn't the selective force, REWRITE (Systemic) is needed unless it explicitly makes a systemic claim.

  ---

  ### **Application to Examples**

  **(a) "The function of feathers is flight."**
  1.  Step 1: **No** explicit history reference.
  2.  Step 3: **Yes.** Feathers demonstrably enable flight in birds.
  3.  Step 4: Is flight the *evolutionary origin* well-established & uncontroversial? **No.** Strong consensus is feathers *originated* for thermoregulation/display and were *co-opted* for flight.
      *   *Conflict Point:* E: Would reject "function is flight" (origin). S: Accepts "enables flight".
      *   **VERDICT: REWRITE.** "Feathers enable birds to fly." (Systemic claim). *Kill the original sentence you'd rather keep.*
      *   *Why not Accept?* Step 4 fails (No). History matters for the unqualified "function" claim.

  **(b) Engineered Gene: "The function of the inserted gene is to confer pest resistance."**
  1.  Step 1: **No** explicit history reference (though context implies engineering).
  2.  Step 3: **Yes.** The gene demonstrably confers pest resistance.
  3.  Step 4: Is there evolutionary history in *this crop lineage* for pest resistance via this gene? **No.** It's a novel insertion.
      *   *Conflict Point:* E: Blocks "function" (no selection history). S: Allows "contributes to/confers resistance".
      *   **VERDICT: REWRITE.** "The inserted gene confers pest resistance on the crop." OR "The inserted gene enables the crop to resist pests." (Pure systemic claim).
      *   *Why not Accept?* The word "function" implies purpose/history. The engineering *intent* isn't evolutionary *selection history*. Step 4 fails (No).

  **(c) Trait in Little-Studied Organism: "The function of the elaborate tail frill in the Zogfish is communication."**
  1.  Step 1: **No** explicit history reference.
  2.  Step 3: **Yes?** Assume the text clearly describes its use in communication displays (e.g., rivals flare them, mates respond).
  3.  Step 4: Is the evolutionary history for communication well-established & uncontroversial? **No.** (Little-studied organism, no history evidence provided).
      *   *Conflict Point:* E: Cannot claim "function" (no history evidence). S: Can claim "contributes to/is used in communication".
      *   **VERDICT: REWRITE.** "The elaborate tail frill is used by the Zogfish in communication displays." OR "The tail frill enables communication in the Zogfish."
      *   *Why not Accept?* Step 4 fails (No consensus/known history). Default to caution.

  **(d) Giraffe Neck Dispute: "The function of the giraffe's long neck is to reach high leaves."**
  *   Step 1: **No** explicit history reference.
  *   Step 3: **Yes.** Necks demonstrably enable reaching high leaves.
  *   Step 4: Is reaching high leaves the *evolutionary origin* well-established & uncontroversial? **MAJOR JUDGMENT CALL.** You know there is *active expert dispute* (browsing vs. sexual selection hypotheses). This is **not** strong consensus. It's contested.
      *   **VERDICT: REWRITE.** "The giraffe's long neck enables it to reach high leaves." (Systemic claim).
      *   *Why not Refer?* While disputed, the *systemic contribution* is uncontested. Refer is reserved for cases where the *causal contribution itself* is disputed or the historical dispute is so central and unresolved that even presenting the systemic claim without heavy qualification feels misleading *in a high school text*. Rewrite here is sufficient and avoids taking sides.

  ---

  This procedure prioritizes accuracy (avoiding unsupported teleology) and efficiency. It defaults to the safer Systemic rewrite whenever historical evidence is lacking, disputed, or points to co-option. It forces you to kill appealing sentences like "function of feathers is flight" due to the historical record, relying on the Systemic rewrite to preserve the important causal information. The key judgment (Step 4) is manageable with general biological knowledge and textbook context, defaulting to caution when unsure.
