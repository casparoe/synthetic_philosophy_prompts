  Hey, I'm a junior and I write the advice column for my school paper. My school counselor has gotten really into this game theory idea called the common prior assumption. She says that if two people are both rational and have the same prior beliefs, they literaly can't agree to disagree—any disagreement has to be because they have different private information. So now she's making everyone fill out these prior reconciliation forms before they can resolve a fight. It's driving everyone nuts. Can you write a satirical advice column, like 600 words, in the voice of the counselor answering letters from students? The jokes should come from getting the idea right: private information vs. different priors, common knowledge of rationality, the fact that the theorem doesn't say people can't have different priors, just that they can't agree to disagree if their priors are common. She should apply it to totally trivial high school stuff—pizza toppings, who asked who to prom, whether the gym is haunted. The piece should be deadpan and funny to someone who knows the concept, but still readable if you don't. No need to cite anything, just make the counselor's logic consistently absurd. Thanks!
