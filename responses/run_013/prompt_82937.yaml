prompt: |-
  So my friend Mark and I got into it for like two hours last night about whether you can even make a moral judgement without having a rule in your back pocket. He's a generalist through and through — thinks that if you say "that was wrong," you're implicitly applying some principle even if you can't state it. I lean particularist (Dancy is the name I always half-remember), because reasons seem to shift with context, and not in a way you can just write into the rule without the rule turning into a monster. We've argued about this alot.

  Anyways, I want to run an activity for our department's philosophy society next month: 16 people, mostly second and third years, one 75-minute session. I want them to feel the thing rather than hear me lecture about it. Here's the rough shape I have, but I want you to design the actual thing — rules, materials, roles, timeline, debrief, the whole deal — and fix what's broken in my version:

  Everyone gets a card with a consideration on it — "it was a lie," "someone got hurt," "it was done to protect a kid," "it was what everyone around them was doing," that sort of thing. I read out a short case, and each person has to physically move to one of three zones: counts for, counts against, or doesn't count at all. Same card, different case, different zone. Then — and this is the part I really care about — a few people get modifier cards that don't add any weight on their own but switch another card on or off. Some philosophers call these "enablers," I think. Like "the promise was made under duress" doesn't itself count against anything; it just means the fact that it was a promise stops being a reason at all. And some cards should turn the volume up or down rather than on or off. Maybe give one person the job of playing the generalist and having to defend the rulebook as it gets built.

  Then at the end the group has to write the rulebook: principles that would predict where every card lands in every case. They should be the ones who discover what that rulebook turns into.

  What I want them to walk out seeing: that the same feature genuinely changes valence across cases, that some features do real work without carrying any weight, and that the rulebook either becomes unmanageably hedged or starts predicting the wrong zones on a fresh case they haven't seen.

  Please include a debrief that maps what actually happened in the room onto the philosophical machinery, a list of what will predictably go wrong the first time (I've never ran anything like this), and be honest about which part of the particularist picture the activity can't reproduce and I'll have to supply myself. And since I'm the one standing at the front: tell me where you think this design is most likely to fail, what I'd see in the room that would make you think the game isn't actually capturing the point, and what would change your mind about the design.
reasoning: |-
  Hmm, the user is deeply engaged in a philosophical debate about moral particularism versus generalism with their friend Mark. They want to design an activity for their philosophy society to demonstrate particularist ideas experientially. I need to create a detailed session plan based on their rough concept.

  The core challenge here is translating abstract philosophical concepts into an interactive experience. The user's card-based approach is clever - having participants physically move to zones representing "counts for," "counts against," or "doesn't count" based on contextual factors. The key innovation is adding modifier cards that enable/disable or intensify/diminish other considerations without carrying moral weight themselves.

  For the activity structure, I'm considering three phases: a foundational phase with simple cases to establish baseline intuitions, an enhancer phase introducing modifier cards to demonstrate contextual shifts, and a rulebook challenge where groups attempt to codify principles that explain all previous judgments. This progression mirrors the philosophical journey from naive generalism to particularist insights.

  The debrief is crucial for connecting the experience to theory. I'll map the activity moments to Dancy's concepts of enablers/disablers and intensifiers/diminishers. Participants should discover that consistent rules either become monstrously complex or fail to predict new cases - precisely the particularist argument against principle-based ethics.

  Potential pitfalls include participants forcing consistency where none exists, overlooking modifier cards' subtle effects, or creating overly flexible "rules" that evade falsification. The facilitator must be vigilant for these and use probing questions to surface contradictions.

  What this activity can't fully capture is the holistic nature of particularist reasoning - how all contextual features interrelate simultaneously rather than as discrete factors. The user will need to articulate this limitation verbally during debrief.

  For practical execution: I'll specify timing allocations, provide sample cases that clearly demonstrate valence shifts (like lying to protect someone vs. lying for personal gain), and include troubleshooting tips for common facilitation challenges. The rulebook challenge is intentionally designed to fail elegantly, revealing the impossibility of comprehensive moral codification.
answer: |-
  Here’s a fully designed activity based on your vision, optimized for engagement, philosophical insight, and practical execution. I've refined the structure, added safeguards against common pitfalls, and built in clear debriefing links.

  **Activity Title:** *The Shifting Sands of Morality: Can We Build a Rulebook?*

  **Core Goal:** Demonstrate moral particularism’s claims: (1) Valence-switching of reasons, (2) Role of enablers/disablers/intensifiers/diminishers, (3) Impossibility/uselessness of a comprehensive, consistent "rulebook."

  **Participants:** 16 Philosophy Society Members (2nd/3rd Year Undergrads)
  **Time:** 75 Minutes
  **Materials:**
  *   16 "Consideration Cards" (Laminated cardstock, large print)
  *   4 "Modifier Cards" (Different color/design)
  *   1 "Generalist Hat" (Silly hat or badge)
  *   3 Large Zone Signs: `COUNTS FOR` | `DOESN'T COUNT` | `COUNTS AGAINST`
  *   Whiteboard or Large Paper + Markers
  *   Timer
  *   Pre-written "Rulebook Challenge" Cases (2 new ones)
  *   (Optional) Sticky notes for Rulebook drafting.

  **Key Concepts Embedded:**
  *   **Consideration:** A factual feature of a situation (e.g., "It was a lie").
  *   **Valence:** The moral direction/polarity (For/Against/Neutral).
  *   **Enabler/Disabler:** A modifier that makes another consideration *count* or *stop counting* morally (e.g., "Promise made under duress" *disables* "A promise was broken").
  *   **Intensifier/Diminisher:** A modifier that makes another consideration *stronger* or *weaker* morally (e.g., "Done with malicious intent" *intensifies* "Someone was hurt").
  *   **Generalism:** The belief moral judgments require/appeal to general principles.
  *   **Particularism (Dancy-esque):** Moral reasons are context-dependent; principles are either too vague, have too many exceptions, or mislead.

  **Setup (5 mins):**
  1.  Place Zone Signs prominently around the room.
  2.  Shuffle and randomly distribute **Consideration Cards** (1 per person). Keep **Modifier Cards** separate.
  3.  Briefly explain the activity: "We're exploring how context changes moral reasoning. You each have a feature. I'll describe a scenario. Based *only* on that scenario and your card, move to the zone showing if your feature counts FOR the action's morality, AGAINST it, or DOESN'T COUNT. There are no 'right' answers – capture your intuitive judgment."

  **Phase 1: Foundational Cases (Establishing Valence Shift) (25 mins)**
  *   **Process:**
      *   **Case 1 (Simple, Low Stakes):** Read aloud. *Example: "Alex finds a $20 bill on the empty sidewalk and keeps it."*
      *   Participants move to zones based on their card. *Likely movements: "Finder needed money" -> FOR; "Finder was wealthy" -> AGAINST or NEUTRAL; "Owner might miss it" -> AGAINST; "Finder looked for owner briefly" -> FOR?; "It was money" -> NEUTRAL?*
      *   **Facilitator:** Ask 2-3 people *why* they chose their zone for their card. Note diversity. *Do NOT seek consensus.*
      *   **Case 2 (Different Context):** Read aloud. *Example: "Bailey sees a $20 bill fall from a harried parent's pocket struggling with groceries in a crowded mall. Bailey picks it up and keeps it without saying anything."*
      *   Participants move *again* based on the *same* card, *new* case.
      *   **Facilitator:** Ask specific people whose cards *changed zones*: "You moved from [Zone1] to [Zone2]? What about *this* case changed how your feature mattered?" Highlight valence shifts (e.g., "needed money" might stay FOR, but "owner might miss it" becomes STRONGER AGAINST; "finder was wealthy" might become more salient AGAINST).
      *   **Case 3 (Radically Different Context - Trigger Valence Flip):** Read aloud. *Example: "Casey, hiding from an abusive ex-partner, uses a fake name and lies about their job when meeting new neighbors for safety."*
      *   Participants move again. Target cards like "It was a lie". *Likely flip:* "Lie" moves from AGAINST (Case 1/2) to FOR or NEUTRAL. Ask: "Cardholder 'It was a lie', you're in FOR? Why does lying seem *positive* here?"
      *   **Key Point:** Emphasize the *same feature* (the lie) changed its fundamental moral contribution (valence) based on context.

  **Phase 2: Introducing Modifiers (The Hidden Machinery) (20 mins)**
  *   **Process:**
      *   Collect all Consideration Cards. Briefly explain Modifier Cards: "These cards describe features that *don't usually carry moral weight themselves* but change *how or if* another feature counts. They are Enablers, Disablers, Intensifiers, or Diminishers."
      *   Distribute **Modifier Cards** to 4 participants. *Examples:*
          *   **Disabler:** "The promise was made under duress." (Disables "A promise was made")
          *   **Enabler:** "The person had a special duty of care." (Enables "Someone was hurt" to count more strongly AGAINST *if* hurt occurs)
          *   **Intensifier:** "Done with malicious intent." (Intensifies "Someone was hurt" or "It was a lie")
          *   **Diminisher:** "The harm was unintended and unforeseeable." (Diminishes "Someone was hurt")
      *   Randomly redistribute **Consideration Cards** to the other 12 participants. Give the **Generalist Hat** to one volunteer.
      *   **Case 4 (Designed for Modifier Impact):** Read aloud. *Example: "Dakota promised their friend they wouldn't tell anyone about their secret hobby. Later, a journalist pressures Dakota aggressively, implying Dakota's job is at risk if they don't reveal the hobby. Feeling cornered, Dakota tells the journalist."*
      *   **All Participants Move:** Consideration cardholders move first based on their card. Modifier cardholders move *last* – their role is *reactive*.
      *   **Modifier Activation:** After initial movement, Facilitator says: "Modifier cardholders, look around. Does your modifier card change *how* or *if* someone *else's* consideration card matters? If so, explain *which card* it affects and *how* (enable/disable/intensify/diminish)." *Example: "Disabler" holder ("Promise made under duress") says: "This disables 'A promise was broken' – it shouldn't count against Dakota anymore." Ask the "Promise broken" holder if they agree/want to move to NEUTRAL.*
      *   **Generalist Role:** The Generalist (hat wearer) observes. After movement/modifiers, their job is to propose a *simple rule* that explains the final positions. *Example: "Breaking a promise is always wrong... unless under duress."* Note this rule on the board as "Rule Draft 1".
      *   **Case 5 (Challenge the Modifiers & Rule):** Read aloud. *Example: "Elara, a doctor, promised a terminally ill child she wouldn't tell their parents about the child's minor, non-life-threatening secret (e.g., hiding candy). Later, the parents directly ask Elara if the child has told her any secrets. Elara lies and says no."*
      *   **Repeat Movement & Modifier Activation:** Note if modifiers apply differently? *Example: "Promise made" might be enabled AND intensified by "Special duty of care" (if held) even though kept? "Lie" might be FOR due to protecting child? Does the Generalist's Rule Draft 1 ("Breaking a promise...") fit? Probably not – keeping the promise (lying) might seem wrong? Generalist struggles to amend the rule clearly.*

  **Phase 3: The Rulebook Challenge (The Impossible Task) (15 mins)**
  *   **Process:**
      *   Divide into 4 small groups (4 people each).
      *   **Challenge:** "Using the whiteboard/paper, your group has 7 minutes to draft 1-3 clear moral principles (rules) that would predict the zone (FOR/AGAINST/NEUTRAL) for *every consideration card we used* in *all the cases we discussed* (Cases 1-5)."
      *   **Facilitator:** Circulate, observe the struggle. Listen for: "It depends...", "Except when...", "But in Case 3...", frustration.
      *   After 7 mins, ask groups to share their "best" rule. Write them on the board (e.g., "Lying is wrong unless it protects someone from harm," "Breaking promises is wrong unless under pressure").
  *   **The Test:**
      *   Announce: "Now, let's test your rulebooks! I have two brand new cases you haven't seen."
      *   Read **Fresh Case A:** *Designed to conflict with their rules. Example: "Finn lies on their resume about having a basic certification (they do have the skill) to get a job desperately needed to support their sick sibling."* Ask groups: "Based on your rule 'Lying is wrong unless it protects someone from harm' – does 'It was a lie' count FOR, AGAINST, or NEUTRAL here?" Discuss ambiguity: Does "support sibling" = "protect from harm"? Is financial harm included? Is the lie justified? Point out rule vagueness/incompleteness.
      *   Read **Fresh Case B:** *Designed to be predicted wrongly by a rigid rule. Example: "Gwen breaks a trivial promise made casually to an acquaintance (e.g., 'I'll call you tomorrow') because they got offered a last-minute dream opportunity."* Ask: "Based on 'Breaking promises is wrong unless under pressure' – does 'Promise broken' count AGAINST? Is 'dream opportunity' enough 'pressure'?" Point out the rule either forbids this (seeming too harsh) or becomes uselessly broad ("pressure" includes anything).

  **Debrief & Philosophical Mapping (10 mins)**
  *   **Connect Activity to Concepts:**
      *   *Valence Shift:* "Remember Case 1 vs. Case 3? The *lie* itself changed from generally AGAINST to potentially FOR. The particular context changed the *moral polarity* of the same fact. This is core to particularism."
      *   *Modifiers (Enablers/Disablers/Intensifiers/Diminishers):* "The 'duress' card didn't make keeping the promise good or bad *itself*. It *disabled* the 'broken promise' consideration. The 'malicious intent' card *intensified* the badness of harm. These features change the *moral landscape* without being reasons *for* or *against* the action themselves. They show morality isn't just adding up simple pros and cons."
      *   *The Rulebook Struggle:* "What happened when you tried to write the rules? Did they get long lists of exceptions ('unless...')? Did they become vague ('significant harm', 'reasonable pressure')? Did they fail for the fresh cases? Generalism hopes for neat principles. Particularism (like Jonathan Dancy argues) says these principles either collapse into useless truisms, become monstrously complex, or mislead us in new situations. The context *always* matters fundamentally."
      *   *The Generalist's Plight:* "Did having to defend a rule feel forced? Did you have to stretch the rule or ignore nuances to make it 'fit'? That tension is real for generalists!"
  *   **Summarize the Particularist View:** "Particularism suggests we don't *need* a rulebook in our back pocket to make good judgments. We develop moral sensitivity – the ability to perceive the *salient* features and how they *interact* in *this specific context*. Rules of thumb can be useful guides, but they aren't the foundation. The foundation is responding appropriately to the unique situation, guided by experience and discernment."

  **Predictable Problems & Mitigation:**
  1.  **"But it *should* be consistent!":** Some students will resist valence shifts, insisting a feature *must* have a fixed valence. *Mitigation:* In debrief, emphasize this is about *describing* how we *actually* reason, not prescribing. Use strong cases (like lying to protect from abuse) where the shift is undeniable. Ask: "Does 'lying' *always* carry the exact same moral weight, no matter why or to whom?"
  2.  **Modifiers Get Ignored/Misunderstood:** Participants might treat modifiers as reasons themselves or not speak up. *Mitigation:* Clearly explain their passive/reactive role *before* Case 4. Facilitator should prompt: "Modifier holders, look at the board/cards. Does your card change how ANY OTHER card matters? Who does it affect? How?" Give examples.
  3.  **Generalist Feels Silenced/Overwhelmed:** The rule-defender might get shouted down. *Mitigation:* Assign the role clearly. After movement/modifiers, *ask the Generalist first*: "Hat wearer, what simple rule explains this?" Protect their speaking time.
  4.  **Rulebook Groups Write Vague Truisms:** Instead of falsifiable rules, they write "It depends on the situation." *Mitigation:* Challenge them in the moment: "But how? What *specifically* would your rule say about 'lying' in Case 1 vs. Case 3? Give me a rule I could *use*." Push for testable predictions.
  5.  **Time Crunch:** 75 mins is tight. *Mitigation:* **STRICT TIMEKEEPING IS ESSENTIAL.** Use a visible timer. Cut off discussion ruthlessly to move phases. Prioritize movement and modifier activation over lengthy justifications during cases. Keep case descriptions *very* short. Debrief can run slightly over if core activity is done.

  **Where the Activity Can't Go (What You Must Supply):**
  *   **Holism:** The activity treats reasons/modifiers somewhat atomistically (individual cards). Dancy emphasizes *holism*: the *entire* constellation of features matters simultaneously; it's not just one modifier affecting one reason. The *gestalt* matters. *Supply:* Explicitly mention this in debrief: "In real life, it's not *just* one modifier affecting one reason. *All* the features interact simultaneously, shaping the overall moral landscape. This activity simplifies to show pieces of that interaction."
  *   **Default Reasons:** Particularism often allows that some features *tend* to be reasons in certain ways (e.g., pain is *prima facie* bad). The activity focuses on shifts/negations, which might overstate the arbitrariness. *Supply:* Clarify in debrief: "Particularism doesn't mean *anything* can be a reason for *anything*. Pain usually counts against an action. But its *precise* contribution – strength, whether it's overridden, *how* it counts – is always context-dependent. The default can be silenced or inverted."
  *   **Epistemology:** How *do* we perceive salient reasons without rules? The activity shows the *problem* for rules but doesn't fully model the particularist *skill*. *Supply:* Briefly discuss moral perception, sensitivity, experience, and analogy in the debrief: "Without a rulebook, we rely on cultivated discernment – seeing *this* situation as similar to *that* past one, noticing what *stands out* as morally relevant here."

  **Design Failure Points & Warning Signs:**
  *   **Failure Point 1: Artificial Consistency.** Participants force cards into consistent zones across cases because "it should be a rule," ignoring intuitive valence shifts. *Warning Sign:* Minimal movement between cases 1, 2, and 3; participants arguing "lie is *always* bad" even in the abuse case. *Change My Mind:* If deep, reflective discussion emerges *about why* consistency feels necessary despite the intuitive pull of context, even if movement is minimal. The *tension* is pedagogically valuable.
  *   **Failure Point 2: Modifiers Treated as Standard Reasons.** Modifier holders move immediately to FOR/AGAINST based on their own card, or others don't see how modifiers change their own card's status. *Warning Sign:* Modifier holders move first/as soon as case is read; little discussion about their *effect* on others; "duress" holder argues keeping the promise *under duress* is good/bad *itself*. *Change My Mind:* If the facilitator's prompts ("Modifiers, who do you affect? How?") successfully trigger the intended reactive discussion and cardholder movement changes based on modifiers.
  *   **Failure Point 3: Rulebook Challenge Isn't Challenging.** Groups easily write simple, elegant rules that seem to fit all cases and the fresh cases. *Warning Sign:* Rules are short, lack "unless" clauses, and groups confidently apply them to fresh cases without dissent. *Change My Mind:* If the fresh cases are so perfectly designed that they expose flaws even in seemingly elegant rules (e.g., their rule for lying fails on the resume case because "supporting sibling" isn't neatly "preventing harm" or "protecting someone" as defined).
  *   **Failure Point 4: Activity Feels Like Chaos, Not Insight.** Participants leave confused, feeling morality is arbitrary, not grasping the structure within context-dependence. *Warning Sign:* Debrief discussions are shallow; participants express frustration like "so anything goes?" without appreciating the role of enablers/modifiers. *Change My Mind:* If the debrief successfully connects the activity's moments (movement shifts, modifier actions, rulebook failure) clearly to the particularist claims, and participants can articulate *why* rules struggled.

  **Final Tip for You:** Your passion for the topic is evident. Lean into the chaos during the activity – let the rulebook struggle be real! Then, in the debrief, be the calm guide connecting the experiential mess to the profound philosophical insight. Emphasize: "The point isn't that morality is subjective or arbitrary. The point is that its complexity and sensitivity to context resist being captured in a simple rulebook. Judgment requires attention to the particulars." Good luck! This sounds like a fantastic session.
