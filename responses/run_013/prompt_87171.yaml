prompt: |-
  You are a philosopher of social science with expertise in Max Weber and in the theory of causal explanation in history. I want a careful audit of an analogy, not a summary of the literature.

  Weber's Protestant ethic argument is often compressed into a railroad image: religious world-images act as switchmen, setting the tracks along which the dynamic of interests drives action. In seminar discussion this image gets used to license a specific verdict — that culture can be a cause of economic conduct without being its motor, since interest supplies the energy and the ethic only steers. A colleague objects that the image is doing the argument's work: it appears to grant culture causal status, but what it actually grants is a steering role, and steering is not what the Protestant ethic thesis needs. In that thesis the ethic seems to generate the drive rather than merely redirect one, and its most famous outcome — the hardening of the capitalist order into a mechanical shell that no longer requires the religious motive — is not something a switchman can produce.

  Begin by brainstorming the candidate correspondences before committing to a reading. Then: (1) lay out the mapping explicitly, saying what plays the role of engine, fuel, track, switchman, destination, and the railway's prior construction; (2) identify where the mapping breaks, separating the disanalogies that matter for the intended conclusion from those that do not; (3) say what the image quietly imports — in particular whether casting ideas as switchmen presupposes agents, single-valued outcomes, or an already-laid institutional track, and whether it covertly assigns ideas the role of formal cause while reserving efficient causation for interests; (4) rule on whether the conclusion that culture can be a cause survives, and if so under what account of causation (difference-making, constitutive, or another); (5) if a better image exists for the relation the thesis actually needs, propose it.

  Close with a candid statement of your confidence and what would change your verdict: which argument or piece of historical evidence would make you abandon it, and where your reasoning is likeliest to fail.
