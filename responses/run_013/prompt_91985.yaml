prompt: |-
  I'm a PhD student in computer science working on the statistical foundations of algorithmic fairness, and I keep encountering a pattern in how high-stakes scoring systems are actually built and audited that I want to think through philosophically rather than statistically.

  The practice is this. A vendor builds a risk-scoring tool for a consequential decision — screening job applicants, or flagging defendants for a diversion program. The development pipeline does four things: it drops the protected attribute from the feature set, on the reasoning that a model that never sees race cannot discriminate by race; it optimizes predictive accuracy and then certifies that the score is calibrated within each group, so that a score of 0.3 denotes the same probability of the outcome whichever group you belong to; the buyer's compliance office separately requires evidence, at the chosen operating threshold, that the selection rate is equal across groups; and the model card reports group-wise false-positive and false-negative rates. I know the impossibility results well enough to know that these last three guarantees cannot hold together except in special cases (equal base rates, or near-perfect prediction). I am not asking how to repair the pipeline. I am asking what it presupposes.

  Reconstruct the implicit theory of fairness under which this pipeline and its audit make sense: what "bias" is taken to be a property of — the data, the model, the decision policy, or the world — and whether fairness is treated as a measurable quantity or as a normative relation; what deleting the protected attribute is supposed to accomplish, and what view of causation and of proxy variables that assumes; and what it assumes about the commensurability of the several group-wise metrics it reports side by side. Then distinguish what the practice strictly presupposes from what it merely fits well with, identify which rival accounts of fairness it quietly rules out and which it leaves open, so that the same pipeline is licensed by several incompatible theories, and say whether its parts presuppose consistent things. Finally, state what would have to change in the pipeline and in the audit if the presupposition that fairness is a property of the model were replaced by the view that it is a property of the decision policy together with a normative account of which inequalities are unjust. No citations needed; I'll handle references myself.

  After the prose analysis (roughly 1,000 words), give me a JSON object with exactly these fields: `practice_components` (array of strings, the parts of the practice as you have analyzed them); `presuppositions` (array of objects, each with `presupposition`, `status` taking one of "strict presupposition", "fits but not required", "inconsistent with another part of the practice", `supported_by` naming the component that carries it, and `rivals_excluded`, an array of strings); `internal_consistency` (object with `verdict` and `tensions`, an array of strings naming the incompatible pairs); `underdetermination` (array of objects, each with `question` and `theories_that_license_the_practice`, an array of strings); and `counterfactual` (array of objects, each with `presupposition` and `what_changes`).
reasoning: |-
  We are going to reconstruct the implicit theory of fairness in the described pipeline and audit practice. The pipeline consists of:
  1. Dropping the protected attribute (e.g., race) from the feature set.
  2. Optimizing for predictive accuracy and then certifying calibration by group (i.e., same score implies same probability of outcome across groups).
  3. The compliance requirement: at the chosen operating threshold, the selection rate must be equal across groups.
  4. Reporting group-wise false positive and false negative rates.

  We are to analyze the presuppositions of this practice, its internal consistency, and what it rules in or out.

  ## Implicit Theory of Fairness

  ### What is bias and what does it attach to?
  - **Bias as a property of the model and data**: The practice treats bias as arising from the model having access to protected attributes or from the model's predictions being miscalibrated by group. By removing the protected attribute, the practice assumes that bias is introduced by the model using the protected attribute directly. The requirement for calibration by group treats bias as a statistical property of the model's output (i.e., the scores should be equally reliable across groups). The equal selection rate requirement (at the threshold) treats bias as a property of the decision policy (the threshold rule) because it focuses on the outcome (selection rate) and not the model per se. However, the overall framing suggests that the model itself is the primary locus of bias, and the decision policy is adjusted to fix the outcome.

  - **Fairness as measurable quantities**: The practice treats fairness as a set of statistical metrics that can be measured and enforced: calibration, equal selection rate, and group-wise error rates. It does not engage with normative questions about why these metrics are chosen or what underlying inequalities they are meant to address. Fairness is reduced to meeting these statistical conditions.

  ### The role of deleting the protected attribute
  - The deletion of the protected attribute is based on a view that if the model doesn't see race, it cannot use race to discriminate. This assumes:
    - **Causation**: That the protected attribute (race) is not causally relevant to the outcome, or that even if it is, we should not use it. This is a form of "fairness through unawareness".
    - **Proxy variables**: It assumes that by removing the protected attribute, we avoid direct discrimination. However, it ignores the possibility of proxies (other features that correlate with race) that can reintroduce bias. The practice does not address proxies, which suggests an implicit belief that without the protected attribute, the model is "blind" to race and hence fair, or that the use of proxies is acceptable as long as they are not the protected attribute.

  ### Commensurability of group-wise metrics
  - The practice reports multiple group-wise metrics (calibration, selection rate, FPR, FNR) without acknowledging the impossibility of satisfying them all simultaneously (except in special cases). This suggests that the practice treats these metrics as independently desirable and does not recognize the trade-offs. It assumes that by enforcing each one, we are making progress on fairness. Moreover, it assumes that these metrics are commensurable and can be presented side by side without conflict. This is at odds with the impossibility results.

  ## Presuppositions: Strict vs. Fits Well

  ### Strict Presuppositions
  1. **Fairness is a property of the model and the decision policy**: The model must be calibrated (a property of the model) and the decision policy (threshold) must yield equal selection rates (a property of the policy). The model is the primary object of fairness, and the policy is adjusted to meet the outcome requirement.
  2. **Bias arises from the model having protected attributes**: Hence, deletion of protected attributes is necessary to prevent direct discrimination.
  3. **Fairness is measurable by statistical parity in the metrics reported**: Calibration, selection rate, and error rates are the relevant dimensions.
  4. **The metrics are independent and can be simultaneously achieved**: Despite the impossibility, the practice acts as if they are compatible.

  ### What Fits Well but Not Strictly Required
  - **Individual Fairness**: The idea that similar individuals should get similar scores might fit with calibration (if we interpret the score as a measure of similarity) but is not explicitly required.
  - **Utilitarianism**: The optimization for accuracy fits with a utilitarian view that overall correctness is the goal, and fairness constraints are additional.

  ### Rival Accounts Ruled Out
  - **Causal fairness accounts**: These require that the model does not use race or proxies in a way that violates causal fairness (e.g., counterfactual fairness). The practice does not check for proxies and in fact might use them, so it rules out causal accounts that require no proxy discrimination.
  - **Fairness as correcting historical injustice**: The practice does not consider base rate differences as potentially unjust and does not aim to correct for them. It enforces equal selection rates regardless of base rates, which might conflict with such corrective accounts.
  - **Group fairness metrics that are incompatible**: The practice implicitly rules out any account that acknowledges the impossibility of satisfying all three (calibration, equal selection rate, and equal error rates) because it attempts to satisfy them all.

  ## Internal Consistency

  The practice is internally inconsistent because:
  - It requires both calibration by group and equal selection rates at a threshold. By the impossibility results (unless base rates are equal or the model is perfect), these two conditions together imply that the outcome must have equal base rates. If base rates are unequal, then requiring equal selection rates and calibration will lead to a contradiction.

  Specifically, the tensions are:
  1. **Calibration and Equal Selection Rate**: If base rates differ, then a model that is calibrated will have different distributions of scores by group. Setting a single threshold will then lead to different selection rates (unless the threshold is set at a point where the cumulative distributions cross in a way that by chance the selection rates are equal). Therefore, requiring both calibration and equal selection rates is impossible without equal base rates or perfect prediction.

  2. **Calibration and Equal Error Rates**: Calibration does not imply equal false positive or false negative rates. In fact, with different base rates, the error rates will differ even under calibration.

  Thus, the practice has an internal tension because it requires conditions that are mathematically incompatible in general.

  ## Underdetermination: Which Theories License the Practice?

  The practice is licensed by:
  - **Formal Equality of Opportunity (Procedural)**: The idea that the process is blind to protected attributes and that the same standards (score) are applied. The equal selection rate requirement might be seen as ensuring equal outcomes in the decision.
  - **Predictive Parity and Calibration**: The view that a score should mean the same thing for everyone and that errors should be reported by group for transparency. This is compatible with the calibration requirement and the reporting of error rates.
  - **A misunderstanding of the impossibility results**: Some practitioners might not be aware of the impossibility and hence require all metrics.

  However, note that the requirement for equal selection rates is more aligned with demographic parity, which is a distinct notion.

  ## Counterfactual: Changing the Presupposition

  If fairness is viewed as a property of the decision policy together with a normative account of which inequalities are unjust, then:
  - The model building would change: We might not drop the protected attribute because it might be needed to measure and correct for unjust inequalities. For example, we might want to adjust the decision policy to compensate for past injustices.
  - The audit would focus on the decision policy: We would assess whether the policy leads to outcomes that align with the normative account. For instance, if the normative account says that base rate differences are due to structural injustice and should be corrected, then we might require a selection rate that is not equal but that corrects for the injustice (e.g., selecting a higher proportion from the disadvantaged group to achieve equality of opportunity). We might not require calibration by group if that interferes with the corrective goal.
  - The metrics reported would change: We might not care about calibration by group if the goal is to achieve a certain distribution of opportunities. We might focus on error rates that are normatively relevant (e.g., false negatives for a disadvantaged group might be more harmful) and set different thresholds by group.

  In summary, the pipeline would:
  - Keep the protected attribute to measure group disparities and to design interventions.
  - Optimize for accuracy but subject to constraints that reflect the normative account (e.g., equal opportunity, which requires equal false negative rates, or demographic parity, which requires equal selection rates, but without necessarily requiring calibration).
  - The compliance requirement would be based on the normative account (e.g., equal opportunity might require equal false negative rates, or a compensatory account might require a higher selection rate for a disadvantaged group).
  - The model card would report the metrics that are relevant to the normative account.

  The key shift is from a model-centric view to a policy-centric view that is informed by a normative theory of justice.

  ## JSON Output

  We now create the JSON object as per the specification.
answer: |-
  ### Analysis of the Implicit Theory of Fairness in High-Stakes Scoring Systems

  The described pipeline—dropping protected attributes, optimizing for accuracy, enforcing calibration, requiring equal selection rates, and reporting group-wise error rates—rests on an implicit theory of fairness that blends technocratic objectivity with legalistic formalism. It treats fairness as a set of *statistical properties of the model*, decoupled from societal context, while quietly assuming that procedural adherence to these metrics suffices for ethical legitimacy. Below, I reconstruct its presuppositions, tensions, and unspoken exclusions.

  #### **Core Presuppositions**
  1. **Bias as Proxyless Data Flaws**  
     Bias is presupposed to originate from *explicit inclusion of protected attributes* in the data. Deleting race/gender assumes that discrimination requires direct perceptual access to protected characteristics—a "fairness through ignorance" stance. This implicitly denies that proxies (e.g., ZIP code for race) can perpetuate bias, reflecting a shallow view of causation where correlation is separable from structural influence. The practice treats protected attributes as *contaminants* rather than markers of systemic inequity.

  2. **Fairness as Model-Centric Statistical Properties**  
     Fairness is reduced to three measurable outputs:  
     - *Calibration*: Scores must reflect identical outcome probabilities across groups.  
     - *Selection Parity*: Decisions at the threshold must yield equal group selection rates.  
     - *Error Rate Reporting*: FPR/FNR are audited but not constrained.  
     These metrics treat fairness as a *technical equilibrium* between model behavior (calibration) and policy outcome (selection parity). Crucially, fairness is a property of the *model's outputs and the threshold rule*, not the world or historical context. Inequalities in base rates or societal harms are excluded from the definition.

  3. **Commensurability of Metrics**  
     Reporting calibration, selection parity, and error rates side-by-side presupposes these are *independent and simultaneously achievable* ideals. This ignores the impossibility theorem, implying that trade-offs are mere implementation noise rather than fundamental conflicts. Metrics are treated as isolated dashboard readings, not mutually constitutive dimensions of justice.

  #### **What the Practice Strictly Presupposes vs. Fits With**
  - **Strict Presuppositions**:  
    - Fairness is *measurable* via group-wise statistical parity.  
    - Protected attributes are *exogenous contaminants*; their removal preempts bias.  
    - The model’s calibration is *necessary and sufficient* for non-discriminatory scores.  
    - Selection parity at the threshold *corrects* any residual unfairness.  
  - **Fits But Not Required**:  
    - Utilitarianism (accuracy optimization as a social good).  
    - Formal equality (identical treatment as fairness).  
  - **Inconsistent Within Practice**:  
    Requiring *both calibration and selection parity* contradicts the impossibility theorem, yet the pipeline demands both. This tension is obscured by treating them as sequential fixes (calibration first, parity second).

  #### **Rival Accounts Ruled Out**  
  The pipeline quietly excludes:  
  - **Structural Accounts**: Bias as a property of *historical injustice* (e.g., unequal base rates as unjust) is ignored. Base rates are accepted as natural facts.  
  - **Causal Fairness**: Theories requiring no path-specific effects (e.g., via proxies) are invalidated because proxy use is unchecked.  
  - **Relational Equality**: Fairness as repairing dignity or power imbalances (e.g., Anderson, Hellman) is reduced to error rate transparency without constraint.  
  - **Critical Race/Gender Perspectives**: Systems producing "equal" outcomes in an unequal world are presumed legitimate.  

  #### **Internal Consistency: Fault Lines**  
  The practice is **internally inconsistent** due to:  
  1. **Calibration vs. Selection Parity**:  
     Calibration demands scores reflect ground-truth probabilities, while selection parity forces equal decision rates. When base rates differ (e.g., recidivism rates by race), these goals conflict mathematically. The pipeline masks this by delegating parity to compliance—a bureaucratic afterthought.  
  2. **Error Reporting vs. Actionability**:  
     Reporting FPR/FNR without constraints assumes transparency implies accountability, yet no mechanism rectifies disparities. This decouples measurement from intervention.  
  3. **Attribute Deletion vs. Proxy Permissiveness**:  
     Deleting protected attributes assumes proxies are neutral, while calibration relies on proxies being predictive. This conflates *predictive utility* with *ethical acceptability*.  

  #### **Underdetermination: Theories Licensing the Practice**  
  The pipeline is licensed by divergent—even incompatible—theories:  
  - **Wasserstein Fairness**: Calibration as the sole requirement (selection parity is adjustable via thresholds).  
  - **Formal Equality of Opportunity**: Selection parity satisfies "blind" decision-making.  
  - **Utilitarianism**: Accuracy optimization maximizes social welfare; fairness metrics are side constraints.  
  - **Legal Compliance Models**: Parity requirements mirror disparate impact doctrine (e.g., Title VII).  

  #### **Counterfactual: Shifting to Policy-Centric Fairness**  
  If fairness is a property of the *decision policy + normative account of unjust inequalities*, the pipeline would transform radically:  
  1. **Protected Attributes**: *Retained* to measure structural disparities. Deleting them would obscure inequity.  
  2. **Model Training**: Accuracy optimized *only if* consistent with normative goals (e.g., reducing disadvantage). Calibration might be abandoned if it reinforces base-rate inequalities.  
  3. **Compliance Requirements**: Selection parity replaced by *normative targets* (e.g., equal opportunity requires equal FNR; corrective justice may demand *unequal* selection).  
  4. **Audit Metrics**: Error rates evaluated for *harm asymmetry* (e.g., higher FPR for marginalized groups deemed worse than FNR for privileged groups).  

  This shift would center *which inequalities matter morally*—e.g., whether base rate differences reflect injustice—making the pipeline a tool for societal repair, not statistical hygiene.

