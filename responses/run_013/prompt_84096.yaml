  Below is a complete 90-minute activity designed to make underdetermination tangible for your students. The setup guarantees empirical equivalence between two rival theories while creating a genuine tie in evaluations, followed by a refutation round that distinguishes auxiliary assumptions from underdetermination.

  ---

  ### **Activity: The Black Box Challenge**
  **Goal:** Students experience underdetermination firsthand by building empirically equivalent theories, then confront the limits of scientific standards in theory choice.

  **Materials:**
  - Sealed "black box" (laptop running a Python script, hidden under cardboard; outputs projected)
  - Data sheets (printed input-output sequences)
  - Rubric cards (laminated for reuse; criteria with scoring rules)
  - Whiteboard for scoring
  - Timer

  **Setup:**
  1. **Black Box:** Python script simulating Device B (see code below). Inputs: `A`, `B`, `R` (reset). Outputs: non-negative integers.  
     - *Internal Mechanism (Device B):*  
       - Two counters: `pos` (starts at 0), `neg` (starts at 0).  
       - `A` → `pos += 1` → Output = `pos - neg` (if negative, output 0).  
       - `B` → `neg = min(neg + 1, pos)` → Output = `pos - neg`.  
       - `R` (reset) → `pos = 0`, `neg = 0` → Output = 0.  
     - *Empirical Twin (Device A):*  
       - Single counter: `state` (starts at 0).  
       - `A` → `state += 1` → Output = `state`.  
       - `B` → `state = max(0, state - 1)` → Output = `state`.  
       - `R` → `state = 0` → Output = 0.  
     - **Guaranteed Tie:** For *any sequence* of `A`/`B`/`R`, Devices A and B produce identical outputs. Verified by mathematical proof (see *Checks* below).

  2. **Data Sheets:**  
     - *Training Data:* 10 sequences (e.g., `[A]→1`, `[B]→0`, `[A,B]→0`, `[B,A]→1`, `[A,A,B]→1`).  
     - *Held-Out Data (sealed envelope):* 3 new sequences (e.g., `[A,B,A]→1`, `[B,B]→0`, `[A,A,B,B]→0`).

  3. **Rubric Cards (5 criteria, 4 points each; 20-point max per theory):**  
     - **Fit:** Matches all training data (4 pts) and held-out data (4 pts).  
     - **Simplicity:** Fewer free parameters (state variables) = higher score.  
     - **Scope:** Explains all input types (A/B/R) = 4 pts.  
     - **Novel Prediction:** Accurately predicts held-out data = 4 pts.  
     - **Coherence:** Aligns with background belief: *"Device components only add or reset; never subtract."*  

  ---

  ### **Timeline (90 Minutes)**
  #### **0–5 min: Introduction**  
  - **Instructor:** *"This device has rules governing its outputs. Your job is to find them. No peeking inside. We’ll have two teams build theories, a panel scoring them, and a board deciding which gets funded."*  
  - Project the black box interface (buttons: `A`, `B`, `R`; output screen).  
  - Distribute data sheets (training data only).

  #### **5–25 min: Theory Building (20 min)**  
  - Divide students:  
    - **Team 1 (Device A):** *"Your mechanism uses **one internal state**. Rules must modify it directly."* (Subtly guide toward a counter).  
    - **Team 2 (Device B):** *"Your mechanism uses **two internal states**. Rules modify them separately; output combines both."* (Guide toward twin counters).  
  - **Output:** Each team sketches rules + predictions for training data.  
  - *Guarantee:* Circulate to ensure Team 1 builds Device A (single counter) and Team 2 builds Device B (twin counters). Provide hints if needed.

  #### **25–35 min: Theory Presentations (10 min)**  
  - Teams share mechanisms:  
    - Team 1: `state`; `A` increments, `B` decrements (min 0), `R` resets.  
    - Team 2: `pos`, `neg`; `A` increments `pos`, `B` increments `neg` (capped at `pos`), `R` resets both.  
  - **Key:** Both perfectly fit training data. Write theories on the board.

  #### **35–45 min: Held-Out Prediction Round (10 min)**  
  - **Instructor:** *"Time to test novel predictions!"* Open sealed envelope.  
  - Run each held-out sequence on the black box (Device B).  
  - **Result:** Both theories predict perfectly → **Fit/Novel Prediction scores = 4/4 each**.

  #### **45–60 min: Scoring & Funding (15 min)**  
  - **Scoring Panel (4 students):** Uses rubric cards to score theories.  
  - **Results (Guaranteed Tie):**  
    | **Criterion** | **Team 1 (A)** | **Team 2 (B)** |  
    |---------------|----------------|----------------|  
    | Fit           | 4              | 4              |  
    | Simplicity    | 4 (1 parameter)| 2 (2 parameters)|  
    | Scope         | 4              | 4              |  
    | Novel Prediction | 4            | 4              |  
    | Coherence     | 2 (`B` decrements) | 4 (only adds/resets) |  
    | **Total**     | **18/20**      | **18/20**      |  
  - **Funding Board (12 students):** Debates and votes.  
    - *Guaranteed Deadlock:* Teams vote for themselves; scoring panel splits 2-2 → **8-8 tie**.  
    - **Instructor:** *"No majority. Funding denied for both."*

  #### **60–70 min: Refutation Round (10 min)**  
  - **New Input:** `A+B` (simultaneous press).  
  - **Output:** Device B sets `pos=10`, `neg=0` → Output = 10.  
  - **Teams adjust theories with auxiliaries:**  
    - Team 1: *"`A+B` sets `state=10`."*  
    - Team 2: *"`A+B` sets `pos=10`, `neg=0`."*  
  - **Test Auxiliaries:**  
    - `[A+B]` → Output = 10 (both correct).  
    - `[A+B, B]` → Output = 9 (both predict 9).  
  - **Scoring Panel:** *"Auxiliaries are equally simple but not independently testable (same predictions)."*

  #### **70–90 min: Debrief (20 min)**  
  - **Q1:** *"Could scientific standards (fit, simplicity, etc.) break the tie? Why?"*  
    → **Key takeaway:** Standards didn’t resolve underdetermination; theories were empirically equivalent.  
  - **Q2:** *"When the refutation (`A+B=10`) hit, how did you 'save' your theory? Was that move legitimate?"*  
    → **Distinguish:**  
      - Auxiliary assumptions (Duhem-Quine): Saved theories from refutation but introduced new untested claims.  
      - Underdetermination: Rivals agreed on *all observable outcomes* but disagreed on ontology (one vs. two counters).  
  - **Address Student Replies:**  
    - *"If theories agree on observables, is the choice just verbal?"*  
      → Not trivial: Ontological differences could matter in *other* contexts (e.g., if the device interfaces with another system).  
    - *"Should we wait for more data?"*  
      → Distinguish:  
        - *Settleable later:* New inputs (e.g., `A+B` with *different* outputs) could break equivalence.  
        - *Never settleable:* If equivalence holds for *all possible* inputs (like here), choice is underdetermined.  
  - **Finally:** Reveal "underdetermination" and "holism." Map activity moments:  
    - Theory building → Underdetermination.  
    - Refutation round → Duhem-Quine holism.  
  - **Close:** *"Science isn’t 'just a curve fit.' The bite is when rivals are *total* equals by our best standards."*

  ---

  ### **Black Box Code (Python)**
  ```python
  pos, neg = 0, 0  # Device B: Twin counters

  def black_box(input):
      global pos, neg
      if input == 'A':
          pos += 1
      elif input == 'B':
          neg = min(neg + 1, pos)  # Ensures output = pos - neg >= 0
      elif input == 'R':
          pos, neg = 0, 0
      elif input == 'A+B':  # Refutation input
          pos, neg = 10, 0
      output = max(0, pos - neg)
      return output
  ```
  **Checks for Empirical Equivalence:**  
  - For any sequence of `A`/`B`/`R`, Device A’s `state` = Device B’s `pos - neg` (provable by induction).  
  - Test with edge cases: `[B]`, `[B,A]`, `[A,B,B]`, `[R,A]`.  
  - **Holdout/Refutation Tests:** Both devices match by design.

  ---

  ### **Honest Warnings & Fixes**
  1. **Predictable Problem:**  
     - *"Team 1’s theory is simpler, so it must be true!"* → Students reject underdetermination premise.  
     - **Fix:** Pre-empt in debrief: *"Simplicity favored Team 1, but coherence favored Team 2. Did that feel arbitrary? That’s the point."*  

  2. **What the Activity Can’t Capture:**  
     - **Real underdetermination is not manufactured.** In science, equivalence emerges from gaps between theory and evidence, not deliberate design.  
     - **Say this aloud:** *"In real life, scientists don’t *try* to build empirically equivalent rivals. The challenge is that evidence alone *can’t* rule out countless possible explanations."*

  ---

  ### **Why This Works**
  - **Tie Guaranteed:** Scoring rubric and device rules ensure an 18-18 tie.  
  - **Physical Engagement:** Teams build theories; scoring panel debates; board votes.  
  - **Critical Distinction:** Refutation round separates underdetermination (irresolvable equivalence) from holism (auxiliary fixes).  
  - **No Jargon Until Debrief:** Students feel the frustration first, then name it.  

  Run this, and your students won’t just nod at "underdetermination"—they’ll have lived it.
