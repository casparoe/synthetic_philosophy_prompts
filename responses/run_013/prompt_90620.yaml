prompt: |-
  I'm a PhD student in philosophy working on authenticity and reproduction, and I want you to help me think through a puzzle in museum practice. Please act as an expert in the metaphysics and aesthetics of art — someone at home with analytic work on authenticity, forgery, and the ontology of artworks, but not confined to it. Work carefully: start by brainstorming the space of possible readings before committing to a reconstruction, and flag your own uncertainty where it arises.

  Here is the pattern that puzzles me. On the one hand, museums and the art market treat the physical original as irreplaceable. A painting that turns out to be a forgery is effectively destroyed as an asset: it is deaccessioned or revalued sharply downward, removed from display, and stripped of the premium that attaches to a documented artist's hand. Provenance research, scientific authentication, and the money paid for a securely attributed work all testify to a value placed on origin and causal history as such.

  On the other hand, the same institutions routinely treat originals as dispensable. They display high-quality facsimiles and 3D-printed replicas — for touch tours, for accessibility, for objects too fragile to show. They sell reproductions in gift shops. They let digital surrogates circulate as the primary object of study. And when a forgery is exposed, they sometimes keep it on display anyway, relabeled to acknowledge its status, on the grounds that it remains aesthetically or pedagogically valuable.

  I'd like you to do the following.

  First, reconstruct the implicit theory: what view of the value of originals does this cluster of practices presuppose? Consider at least these candidates and say which the practice best fits — (a) originals have non-instrumental value as particular objects, independent of any experience they afford; (b) originals have only instrumental value, as the most reliable route to certain experiences or to historical contact with a maker; (c) originals have value as nodes in an institutional or testimonial network, conferred by provenance, certificates, and shared recognition rather than residing in the object; (d) some hybrid.

  Second, separate what the practice strictly presupposes from what it merely fits comfortably with. Where is it underdetermined — which rival theories would license the same behavior equally well?

  Third, is the practice internally consistent? Can a single coherent theory account for both the reverence for originals and their routine dispensability, or does the practice silently presuppose incompatible commitments?

  Fourth, a counterfactual: suppose we replaced the presupposed theory with the view that only the perceptual and experiential encounter with the work matters. What would have to change in museum practice, and what would be lost that better copies cannot recover?

  Finally, consider a proposed policy on which every displayed object carries two numbers: a "provenance confidence" rating and a "contact distance" — the number of causal steps separating the viewer from the maker's hand. Does adopting such a policy commit a museum to a particular theory of the value of originals, or is it theory-neutral? Explain your answer.
reasoning: |-
  Hmm, this is a rich and complex query from a philosophy PhD student working on authenticity and reproduction. They're asking me to analyze a puzzle in museum practices regarding the treatment of originals versus replicas. The user clearly has deep expertise in this area, so I need to approach this with careful philosophical rigor.

  The puzzle centers on an apparent contradiction: museums treat physical originals as irreplaceable (with authentication processes, high valuations, etc.), yet they also treat them as dispensable (using facsimiles for accessibility, keeping exposed forgeries on display, etc.). The user wants me to reconstruct the implicit theory behind these practices.

  First, I need to consider the candidate theories they've proposed about the value of originals:
  (a) Non-instrumental value as particular objects
  (b) Only instrumental value as a means to experiences
  (c) Value as nodes in institutional networks
  (d) Some hybrid view

  Looking at museum practices, the reverence for provenance and the sharp devaluation of forgeries suggest something beyond pure instrumental value. If only the experience mattered, a perfect replica would be just as valuable, but museums clearly don't treat them that way. The continued display of exposed forgeries for pedagogical reasons suggests that even when the "original" status is lost, the object can still have instrumental value.

  The institutional network view (c) seems particularly strong here. The art market's focus on provenance and certification shows how value is socially constructed through authentication practices. Yet the persistence of aesthetic engagement even with known replicas suggests this isn't the whole story.

  I think a hybrid view best explains the practices - specifically what I'd call "historically mediated instrumentalism." Originals have privileged instrumental value because they provide a unique historical connection, but they're not valued purely for their physicality alone. This accounts for both the reverence for originals and their dispensability when other means can serve experiential or pedagogical goals.

  Regarding consistency, there is tension but not outright contradiction. Museums seem to operate with a "default hierarchy" where originals are preferred for their historical connection, but replicas are acceptable substitutes when originals are unavailable or when other values (accessibility, preservation) outweigh the historical connection value.

  If museums adopted a purely experiential view (only perceptual encounter matters), several things would change: they'd display the best available replica regardless of origin, devalue provenance research, and likely stop treating forgeries differently from originals if they're perceptually identical. What would be lost is the sense of historical communion - that intangible "aura" Walter Benjamin described.

  For the proposed policy of "provenance confidence" and "contact distance" metrics - this isn't theory-neutral. By quantifying historical connection, it implicitly endorses the view that this connection has value. A pure instrumentalist wouldn't need these metrics, while a pure physicalist might see them as irrelevant to the object's inherent value. The policy operationalizes the hybrid view I described earlier.

  Throughout this analysis, I should acknowledge uncertainties - particularly regarding how different museums might weight these values differently, and whether the practices reveal genuine philosophical commitments or merely pragmatic compromises. The user is likely looking for this kind of nuanced, self-aware analysis befitting PhD-level philosophical discourse.
answer: |-
  Your puzzle reveals a profound tension in how cultural institutions navigate the metaphysics of artworks. Let's dissect this systematically, drawing on analytic aesthetics while acknowledging institutional pragmatism.

  ### First: Reconstructing the Implicit Theory
  The museum practice cluster suggests a **hybrid (d) of (b) and (c), with a historical-instrumental core**. Here's the breakdown:

  - **Against (a)**: If originals had *non-instrumental* value as particulars, facsimiles would be categorically unacceptable for display. Yet museums readily substitute when practical needs arise, implying the object itself isn't sacred *qua* physical entity.
    
  - **For (b)**: Instrumental value is evident in uses of replicas for accessibility/study. The forgery's devaluation stems partly from its failure to deliver "authentic experience" of the artist's creative act. However, pure instrumentalism can't explain why *undetected* forgeries retain value while *exposed* ones collapse—the experience is identical.

  - **For (c)**: The institutional network is crucial. Provenance and certification *confer* value through social recognition (à la Arthur Danto's "artworld"). A forgery's deaccessioning represents expulsion from this testimonial network. Yet replicas displayed pedagogically retain institutional framing (labels, context), suggesting value isn't purely network-dependent.

  - **The Hybrid (d)**: **Historically Mediated Instrumentalism**. Originals are valued as *reliable causal conduits to historical artistic agency*. Key elements:
    - The "maker's hand" matters not as physical residue but as *traceable causation* linking viewer to creative act.
    - Institutions authenticate this causal chain (provenance) to warrant experiential access.
    - When originals are fragile, replicas become *instrumental proxies*—but museums signal their status (labels, context) to preserve institutional honesty.
    - Forgeries fail as historical witnesses; replicas succeed as transparent substitutes.

  This explains why exposed forgeries may stay displayed: they retain *aesthetic* instrumental value but lose *historical* instrumental value. The practice presupposes that historical causation enables unique experiential goods.

  ### Second: Presupposition vs. Underdetermination
  - **Strictly Presupposed**: 
    - Historical origins confer distinct value beyond perceptible qualities.
    - Institutional certification is necessary to warrant that value.
    - Objects are not intrinsically valuable (contra a).

  - **Underdetermined/Compatible Rivals**:
    - **Moderate Physicalism** (e.g., Wollheim): Could license replica use if "physical history" is preserved in displays (but struggles with digital surrogates).
    - **Institutional Nominalism** (e.g., Dickie): Fits gift-shop reproductions (all are "art" if framed) but can't explain forgery devaluation.
    - **Aesthetic Empiricism** (e.g., Beardsley): Justifies replica displays but clashes with provenance obsession.

  The practice is *least* compatible with (a) and pure (b), but *equally* fits several hybrid institutional-historical theories.

  ### Third: Internal Consistency
  **Mostly consistent via a "Default Hierarchy" of Values**:
  1. **Primary**: Historical-instrumental value (originals preferred)
  2. **Secondary**: Aesthetic/educational value (replicas acceptable when primary unavailable)
  3. **Tertiary**: Institutional integrity (transparent labeling)

  **Tension Points**:
  - **Forgery Display**: Keeping exposed forflies shows aesthetic/educational value can *override* historical value loss—suggesting historical value isn't absolute.
  - **Digital Primacy**: When surrogates become primary study objects, historical value is subordinated to access. This edges toward pure instrumentalism but is mitigated by contextual metadata.

  **Resolution**: Museums treat historical connection as a *defeasible default*. When physical preservation, access, or pedagogy conflict with displaying originals, they privilege broader institutional missions. This isn't inconsistent if historical value is seen as *prima facie* but not inviolable.

  ### Fourth: Counterfactual (Pure Perceptual Encounter View)
  **Changes to Practice**:
  - Deaccessioning forgeries would cease (if perceptually identical).
  - Provenance research budgets slashed; conservation focused solely on perceptual fidelity.
  - "Best available copy" displayed—e.g., a perfect replica over a damaged original.
  - Touch tours using replicas unchanged; digital surrogates become equivalent to originals.

  **What Would Be Lost**:
  - **Epistemic Contact**: Benjamin's "aura"—the sense of temporal co-presence with the maker.
  - **Testimonial Value**: Art as evidence of historical techniques/cultural moments.
  - **Narrative Cohesion**: Objects as nodes in art-historical causation (e.g., how brushstrokes influenced contemporaries).
  - **Institutional Trust**: Museums as guarantors of historical transmission.

  Even perfect copies cannot recover the *indexical* value (Peirce) of the original as a physical effect of the artist's actions.

  ### Fifth: The Two-Number Policy
  **Not Theory-Neutral—Commits to Historically Mediated Instrumentalism**:
  - **Provenance Confidence** quantifies institutional warrant (theory c).
  - **Contact Distance** operationalizes causal-historical value (theory b).
    
  **Why Not Neutral**:
  - **Rejects Pure Physicalism (a)**: Physical particulars need no "distance" metrics.
  - **Rejects Pure Empiricism**: If only perception matters, both metrics are irrelevant.
  - **Presupposes**: Value scales with proximity to artistic genesis and reliability of attestation.

  **Operational Risks**: This policy might reify causal chains in ways that oversimplify (e.g., privileging direct lineage over complex restorations) or commodify authenticity.

  ### Conclusion
  Museum practices reveal a **pragmatic metaphysics** where artworks are valued as *catalysts for historically situated experiences*. The reverence for originals reflects their role as privileged witnesses to artistic creation; their dispensability acknowledges that other values (access, preservation) can trump historical continuity when properly framed. The inconsistency is not logical but *axiological*—museums balance competing commitments to preservation, education, and authenticity, with historical instrumentalism providing the dominant (but not inviolable) rationale. This suggests your work might productively explore how "authenticity" functions as a *graded* rather than binary concept in institutional contexts.

  *Uncertainty Flag*: Real-world practice likely involves unexamined compromises. Some behaviors (e.g., lavish spending on provenanced works while displaying replicas) may reflect market logic more than philosophical coherence. Ethnographic study of curatorial decision-making could test this reconstruction.
