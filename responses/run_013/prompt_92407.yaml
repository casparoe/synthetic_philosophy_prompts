prompt: |-
  Ok so I work at a small impact-investing fund — we put money into companies making social/environmental claims — and I'm the one who has to vet the factual claims in a pitch deck before the partners sign off. Stuff like "our wastewater discharge is within safe limits," "this training program raised grads' incomes by 20%," "our stoves cut indoor smoke deaths." Right now it's pure vibes, whoever's loudest in the room wins, and we've been burned twice already. We do maybe four of these a month and I've got about half an hour per claim, and I'm the one who has to defend the call if it blows up later.

  I keep thinking the classical Nyaya framework — the pramanas — is basically a vetting protocol that got formalized centuries ago and I want you to turn it into one I can hand to a junior analyst. I know it counts four independent means of knowing: perception, inference, comparison/analogy, and testimony from a reliable speaker. Keep all four in, including the analogy one even though my colleagues will roll their eyes at it — that's kind of the point. And I vaguely remember terms like vyapti (the pervasion between the reason and what you're proving), tarka (the counterfactual test you use to check it), and something about a "deviating" reason that ruins an inference — use that stuff, that's what I'm paying for. Please no reading list or citations, I can't go read anything, just give me the thing itself. And don't just say "check the source" — I need the actual characteristic failure mode of each pramana, so a non-philosopher can actually run the check.

  Give it to me as exactly five numbered items, no intro, no conclusion, one or two sentences each: the steps in order, and inside each step, in one more sentence, how it plays out on two claims — (a) "our factory's discharge is within safe limits" and (b) "our program raised graduates' incomes by 20%." Say in the relevant step where a step can't decide and a person has to, and be honest that at least one of those two claims the procedure will tell us we simply can't certify — even though the deal team will hate it. Also flag where the whole thing will misfire on you.
reasoning: |-
  Okay, the user works at an impact-investing fund and needs a practical vetting protocol based on Nyaya's pramanas. They're frustrated with the current "vibes-based" approach that's led to mistakes. 

  First, I need to unpack their core pain points: They handle about four pitch decks monthly with only 30 minutes per claim, and they're personally accountable if things go wrong. The mention of "we've been burned twice" suggests high stakes. Their request is very specific - they want Nyaya's four pramanas operationalized into a five-step checklist for junior analysts, with zero academic fluff.

  Hmm... interesting they insist on keeping upamāna (analogy) despite anticipating eye-rolls. That tells me they've noticed flawed analogies derailing discussions before. The demand to include vyapti, tarka, and deviating reasons means they've done their homework - this isn't a surface-level ask.

  For structure: They want exactly five numbered steps, each with:
  - The pramana's core check 
  - How it fails (characteristic failure mode)
  - Concrete application to both example claims
  - Clear flags where human judgment is needed

  Key challenges:
  ▶ Timing: Half-hour per claim means steps must be brutal prioritization.
  ▶ Honesty: Must explicitly state when certification is impossible (they predict deal team pushback).
  ▶ Balance: Avoid oversimplification but stay actionable.

  The examples are perfect opposites:
  (a) "Discharge within limits" is testable physical data
  (b) "20% income increase" has attribution complexities

  Biggest trap: Step 3 (analogy) could feel redundant but is crucial for their context - investors often get swayed by "Like Company X who succeeded!" false parallels. Need to make that danger visible.

  Final design principles:
  1. Mirror the pramana sequence (pratyakṣa to śabda) 
  2. Embed Nyaya concepts in plain language (e.g., "deviating reason" = hidden variable)
  3. For impossible certifications: Choose claim (b) since causality is thornier
  4. Misfire warning: Place it where vibes-based pressure usually wins (probably Step 5 testimony)
answer: |-
  Here are the five Nyaya vetting steps:  

  1.  **Direct Perception Check (Pratyakṣa):** *Verify through immediate evidence or measurement.*  
      - *(a) Failure mode: No current sensor data/readings; (b) Failure mode: No pre/post income records.* → If missing, flag "Requires human verification" immediately.  
      - *(a) Demand real-time discharge monitor logs; (b) Demand raw payroll data before/after program.*  

  2.  **Analogy Test (Upamāna):** *Identify flawed comparisons hiding critical differences.*  
      - *Failure mode: False equivalence (e.g., different contexts, scales, or variables).* → If analogy is core to claim, human must assess relevance.  
      - *(a) If they say "Like [Clean] Factory X’s results," check if X used identical waste treatment; (b) If citing "Like Program Y’s income boost," verify Y had same economic conditions/participant profile.*  

  3.  **Inference Scrutiny (Anumāna with Vyāpti & Tarka):** *Demand the universal link (vyāpti) between evidence and claim, stress-test via counterfactual (tarka).*  
      - *Failure mode: Deviating reason (upādhi) – a hidden factor explaining the result (e.g., "Discharge was safe *only* during drought").* → If no vyāpti, inference fails.  
      - *(a) Link: "Tested pH always predicts safety." Counterfactual: "If pH spiked, would safety fail?" Check for hidden factors like seasonal dilution; (b) Link: "Training alone caused income rise." Counterfactual: "Without training, would incomes *not* rise?" Hunt for deviators like a coincidental local wage boom.*  

  4.  **Testimony Vetting (Śabda):** *Assess source credibility AND trace evidence origin.*  
      - *Failure mode: Hearsay or conflicted authority (e.g., self-verified data, uncited third parties).* → If source is claimant or unattributed, halt.  
      - *(a) If "Lab-certified safe," demand lab name and full report (not summary); (b) If "Independent study shows 20%," demand study methodology and funder disclosure.*  

  5.  **Decisive Certification:** *Only certify if ALL prior steps hold. Explicitly state when evidence is insufficient.*  
      - *(a) Certifiable only with sensor logs + valid lab report + no hidden discharge variables; (b) UNVERIFIABLE here – income claim fails Step 3 (deviating reason likely) and Step 4 (requires flawless causal study).* → **Human must reject (b) unless deviators are ruled out.**  
      - **MISFIRE WARNING:** This fails if partners override Step 5 due to deal pressure.
