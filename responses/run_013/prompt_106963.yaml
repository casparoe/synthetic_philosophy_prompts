prompt: |-
  I'm a grad student in philosophy of mind and I've gotten really into the Dennett "Quining Qualia" paper — specifically the Chase and Sanborn intuition pump about the two coffee tasters who both claim their experience of coffee has changed but in opposite directions (one says the coffee tastes worse but the coffee's taste hasn't changed, the other says the coffee tastes the same but his taste buds have changed). I find the setup genuinely unsettling because it seems to show that we can't even tell, from the inside, whether our qualia have changed or whether it's just our attitudes toward them. But I'm also not sure the paper's conclusion — that the whole notion of qualia as ineffable, intrinsic, private, and directly apprehensible is incoherent — is actually right, or whether it just shows that a certain overstuffed conception of qualia is untenable while a leaner one survives. I'm trying to figure out where to actually spend my time over the next year or two, and I don't want to just write another exegesis of Dennett.

  So here's what I want from you: given the current state of the debate — illusionism, representationalism, the various phenomenal-concept strategies, the "qualia" vs. "what-it's-like-ness" distinction, the whole mess around whether the Chase and Sanborn case really generalizes — which open questions or lines of work do you think actually matter most for someone with my interests, and why? I'm less interested in a list than in a defended prioritization: for each item, why it's upstream of other work rather than downstream, how tractable it is for a philosopher working alone with no lab and no funding (I can read psychology but I can't run studies), and what would have to happen — empirically or argumentatively — for it to move up or down your ranking. I'd also like you to flag anything that looks important but that you'd actually deprioritize because its resolution wouldn't change much elsewhere, and say what you think the biggest trap is for someone who wants to work on this stuff seriously without just becoming a Dennett commentator.
