  Next, phenomenal concepts and illusionism. Phenomenal concept strategies address the explanatory gap, crucial for defending physicalism. Illusionism challenges the need for qualia at all. Both are tractable through theoretical work. If illusionism gains traction, it could dissolve the hard problem, but resistance is strong. These are high-priority due to their centrality.

