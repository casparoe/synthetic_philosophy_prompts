  Next, assessing the current philosophical landscape. The key debates revolve around the existence and nature of qualia. Illusionism (Frankish) denies qualia, treating them as illusory. Representationalism (Tye, Dretske) reduces qualia to representational content. Phenomenal concept strategies (Loar, Papineau) explain the epistemic gap without an ontological one. The qualia vs. what-it's-like distinction matters because some argue that even if "qualia" are problematic, the subjective character of experience remains.

