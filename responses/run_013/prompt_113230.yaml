answer: |-
  ### Exam Question

  **Truth and Paradox: Final Exam**  
  **Time Allowed:** 90 minutes (this question should take approximately 40 minutes)  
  **Total Marks:** 25  

  ---

  **Instructions:**  
  Answer all parts of this question. Write your answers clearly and concisely. Justify all claims with reasoning. Assume a truth predicate governed by the ordinary truth schema: a sentence is true just in case its content holds, and false otherwise.  

  Consider two sentences, A and B:  
  - **A**: "Exactly one of A and B is true."  
  - **B**: "Exactly one of A and B is false."  

  **Part (a)**  
  In classical two-valued logic (where sentences are either true or false), determine whether a consistent assignment of truth values to A and B exists. If it exists, show that it is unique. For each of the three alternative assignments, demonstrate why it fails.  
  *(10 marks)*  

  **Part (b)**  
  Explain what truth values a Kripke-style minimal fixed point (using the strong Kleene evaluation scheme) assigns to A and B. Are these sentences grounded? Justify your answer.  
  *(7 marks)*  

  **Part (c)**  
  What would a supervaluationist, who quantifies over all classical fixed points (i.e., all consistent classical extensions), say about the truth values of A and B? Provide a rationale.  
  *(4 marks)*  

  **Part (d)**  
  The verdicts in (b) and (c) diverge. What does this reveal about the relationship between *groundedness* and *determinacy*? Does the "exactly-one" construction play a special role in this divergence? Additionally, can a theory that yields the verdict in (c) state its own verdict about A and B without inviting a revenge paradox? Briefly explain.  
  *(4 marks)*  

  ---

  ### Model Answer (Approximately 800 words)

  **Part (a)**  
  In classical two-valued logic, there is exactly one consistent assignment: **A is false and B is false**. To demonstrate this, consider all four possible assignments and check consistency with the truth schema.  

  - **Assignment 1: A true, B true.**  
    If A is true, then exactly one of A and B is true. But both are true, so two are true—contradiction. A cannot be true.  
    If B is true, then exactly one of A and B is false. But both are true, so zero are false—contradiction. B cannot be true.  
    *This assignment fails.*  

  - **Assignment 2: A true, B false.**  
    If A is true, then exactly one of A and B is true. Since A is true and B is false, exactly one (A) is true—consistent for A.  
    If B is false, then its content ("exactly one of A and B is false") must be false. But with A true (so not false) and B false, exactly one (B) is false. Thus, B’s content is true, but we assigned B false—contradiction.  
    *This assignment fails.*  

  - **Assignment 3: A false, B true.**  
    If A is false, then its content ("exactly one of A and B is true") must be false. Since B is true and A is false, exactly one (B) is true, so A’s content is true. But we assigned A false—contradiction.  
    If B is true, then exactly one of A and B is false. With A false and B true, exactly one (A) is false—consistent for B. But A’s contradiction suffices to fail.  
    *This assignment fails.*  

  - **Assignment 4: A false, B false.**  
    If A is false, then its content must be false: "exactly one of A and B is true" is false because neither is true (both false).  
    If B is false, then its content must be false: "exactly one of A and B is false" is false because both are false (two are false, not one).  
    No contradiction. *This assignment is consistent.*  

  Thus, the unique consistent classical assignment is A false and B false.  

  **Part (b)**  
  In a Kripke-style minimal fixed point using the strong Kleene evaluation scheme, A and B are **neither true nor false** (i.e., they are undefined). Consequently, they are **ungrounded**.  

  *Justification:*  
  - Start with stage 0: no truth values (both A and B undefined).  
  - At stage 1, evaluate A and B using the strong Kleene scheme:  
    - A: "Exactly one of A and B is true" depends on the truth values of A and B. Both are undefined at stage 0, so the disjunctions in "exactly one" (e.g., "A true and B false" or "A false and B true") are undefined (strong Kleene: undefined component makes whole formula undefined). Thus, A is undefined.  
    - B: Similarly, "exactly one of A and B is false" depends on A and B. Both undefined → B undefined.  
  - At stage 2, reevaluate with stage 1 values (still undefined) → same result.  
  - The minimal fixed point stabilizes here: A and B never gain truth values.  

  Groundedness requires a sentence to receive a truth value (true or false) in the minimal fixed point. Since A and B remain undefined, they are ungrounded.  

  **Part (c)**  
  A supervaluationist quantifies over all classical fixed points (consistent classical extensions) and would assign **both A and B false**.  

  *Rationale:*  
  The supervaluationist considers all classical assignments that respect the truth schema. Part (a) showed only one consistent classical assignment: A false and B false. Since this is the only classical extension, the supervaluationist assigns "super-truth" only to what is true in all extensions (and "super-falsity" to what is false in all). Here, A and B are false in the sole extension, so they are super-false (i.e., determinately false).  

  **Part (d)**  
  The divergence reveals that **groundedness and determinacy can come apart**: A and B are ungrounded (undefined in Kripke’s minimal fixed point) but determinate (super-false in all classical extensions).  

  The "exactly-one" construction plays a key role. It requires evaluating both components simultaneously. In partial logic (e.g., strong Kleene), if any component is undefined, "exactly one" becomes undefined (due to its reliance on disjunctions and conjunctions). Classically, however, exhaustive case analysis resolves it determinately. This creates divergence because partial logic "sees" gaps, while supervaluationism "sees" the classical resolution.  

  A theory yielding (c)’s verdict (e.g., supervaluationism) **can state its verdict without immediate revenge** for this pair. It asserts "A and B are both false," which is consistent with the unique classical assignment. No new Liar-like loop arises because the verdict is about A and B externally, not via a self-referential sentence in the same pair. However, revenge may threaten if the theory tries to *generalize* this verdict (e.g., by adding a sentence like "This theory’s verdicts are always determinate"), but for this specific pair, no revenge is invited.  

