answer: |-
  1. The rehab practice strictly presupposes that visual shape recognition after sight restoration isn't immediate or automatic from tactile experience alone, directly committing to a "no" answer to Molyneux's question about instant cross-modal recognition.  
  2. It does *not* strictly presuppose that shape information is fundamentally separate and modality-specific; the same matching drills could be interpreted as calibrating access to shared amodal concepts via a new sensory channel, meaning the practice is compatible with both modality-specific and amodal theories of shape representation.  
  3. If Molyneux's "yes" were true (instant recognition), the rehab's core matching exercises would be unnecessary; therapists would instead focus solely on low-level visual skills like acuity or motion detection, not systematic shape-touch association drills.  
  4. The practice strongly implies that cross-modal *association* requires learning, but remains neutral on whether the underlying spatial *concepts* are innate or learned—only their visual access needs training.  
  5. Confidence: High (items 1-3); Least sure about whether slower/faster learning rates in rehab might subtly favor modality-specific vs. amodal views (item 2), as individual variability complicates inference.
