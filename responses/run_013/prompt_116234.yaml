  I need to break this down carefully. The rehab involves matching visual shapes with tactile experiences through repeated drills - looking at a shape and then feeling it, or vice versa. Patients can't initially visually identify shapes they've known by touch their whole lives. 

  The core question is whether this practice necessarily presupposes that shape recognition is modality-specific ("no" to Molyneux), or if it could be compatible with amodal theories where shape concepts are shared across senses, just requiring calibration of a new sensory channel.

