  5) My confidence levels and uncertainties

  The key insight is that the rehab demonstrates the need for learning cross-modal associations, which by definition contradicts "immediate recognition" - so it does commit to "no" on Molyneux. But this doesn't necessarily reject amodal theories; it just shows that accessing shared concepts requires perceptual learning when adding a new sense. 

