prompt: |-
  Next month I present a paper at a small workshop on distributive justice, and I need a Q&A prep sheet. My thesis: the standard reply to the leveling-down objection — that prioritarianism ranks distributions by a concave transform of individuals' absolute levels and therefore never claims a world in which everyone is worse off and no one is better off is itself better — succeeds only by quietly giving up the idea that prioritarianism is a theory about the goodness of outcomes. I argue that once the view is relocated from axiology into the theory of choice (what I call the relocation move), the leveling-down objection mutates into a harder one: the view can no longer explain why the worse off warrant priority without covertly appealing to inequality, the very thing the reply was supposed to expunge. The audience is mixed. Most are welfare economists and social-choice theorists who care about axiomatic properties — Pareto, anonymity, separability, continuity — and will go after the formal machinery; several are egalitarian political philosophers who hold that equality is intrinsically valuable and will go after the moral story. Give me the objections I will actually get from these two camps, ordered by how much damage they do, each phrased in that camp's own vocabulary, with a two-minute reply and a note on where the reply is soft. Tell me what I should concede up front, and include the one question I am hoping nobody asks. Skip the stock objections from the literature unless this audience would actually raise them.
reasoning: |-
  Okay, the user is preparing for a Q&A session after presenting a paper at a workshop on distributive justice. They've shared their thesis, which challenges the standard prioritarian response to the leveling-down objection. Their main argument is that prioritarianism only avoids leveling-down by shifting from axiology (goodness of outcomes) to decision theory, but this relocation introduces new problems. Specifically, they claim this move can't justify prioritizing the worse-off without secretly relying on inequality concerns.

  The audience includes welfare economists/social-choice theorists who focus on formal properties, and egalitarian philosophers who value equality intrinsically. I need to anticipate objections from both groups, prioritize them by damage potential, provide concise replies with weaknesses noted, suggest upfront concessions, and identify a dreaded question.

  First, I'll analyze the core argument:
  - Prioritarianism traditionally uses a concave transformation function (e.g., square root) to weight welfare, avoiding literal leveling-down claims
  - User contends this only works if we stop calling outcomes "better" and instead frame it as choice-worthiness
  - But in choice framework, explaining why we prioritize worse-off might require implicit inequality aversion

  For economists:
  They'll care about formal coherence. Top objection should be about separability violation - if priority isn't outcome-goodness, how can we evaluate policies affecting subgroups independently? My reply would involve distinguishing local/global choice contexts, but this is weak because economists expect separability everywhere.

  For philosophers:
  Their main concern will be moral foundations. Strongest objection: if priority isn't about intrinsic badness of inequality, why care about relative position at all? My reply would say priority responds to absolute deprivation, but this risks circularity since deprivation is often relative.

  Upfront concessions needed:
  - Acknowledging that standard prioritarianism avoids leveling-down technically
  - Admitting the relocation move makes prioritarianism "shallow" - it describes choices without deep justification

  The nightmare question:
  One that forces me to explain how exactly inequality "sneaks back in" - this could expose vagueness in my critique. I'd need concrete examples like identical twins cases.

  I'll structure responses with:
  1. Objection in camp-specific language
  2. Two-minute reply
  3. Soft spot in reply
  4. Damage rating

  For economists, I'll include objections about Pareto, anonymity, and continuity too. For philosophers, I'll cover the moral distinctiveness concern and the claim that my view is just disguised egalitarianism.

  The dreaded question will bridge both camps by asking for a formal test to detect covert inequality aversion - this could reveal if my argument is substantive or semantic.
answer: |-
  Here are the objections you're likely to face, ranked by damage potential, tailored to each camp's perspective, with concise replies and vulnerability notes. Concessions and your dreaded question are at the end.

  ---

  ### **I. Welfare Economists / Social-Choice Theorists**  
  *(Focus: Formal coherence, axioms, implications for policy choice)*  

  1. **Objection (High Damage: Undermines Core Formalism):**  
     "You claim prioritarianism 'relocates' to choice, but if it violates *separability* in the choice context, it becomes intractable for policy evaluation. Suppose we fix the well-being of unaffected individuals. If prioritizing the worse-off isn't about outcome goodness, why should choices between subgroups depend on unrelated others' levels? This makes social welfare non-decomposable."  
     **Reply (2 min):** "Separability holds *locally* when comparing identical transformations. My point is that the *justification* for the concave transform in choice—why we weight the worse-off more—cannot be grounded solely in absolute deprivation without referencing relative gaps. In practice, we apply separability pragmatically, but the moral logic leaks context."  
     **Soft Spot:** Admits prioritarianism loses axiomatic "cleanliness" when relocated, weakening its use in decentralized policy.  

  2. **Objection (Medium Damage: Contradicts Pareto):**  
     "If prioritizing the worse-off isn't about outcome quality, how do you avoid violating *Weak Pareto*? Suppose a change benefits everyone slightly but widens inequalities. Your 'relocated' view might reject it, implying you value something beyond welfare—which is exactly inequality aversion in disguise."  
     **Reply (2 min):** "Relocated prioritarianism still satisfies Pareto: if everyone gains, the sum of concave-transformed welfare increases. But Pareto doesn't explain *why* we use a concave function. My argument is that this choice *presupposes* that a gain to the worse-off matters more—a judgment inseparable from their relative position."  
     **Soft Spot:** Doesn't fully resolve why "matters more" must imply inequality if outcomes aren't ranked.  

  3. **Objection (Low Damage: Anonymity/Continuity):**  
     "Anonymity is baked into prioritarianism’s formalism. If your critique holds, does the concave transform become arbitrary? Could we 'prioritize' the better-off if we relabel axes? And if not, doesn’t continuity require outcome-level comparisons?"  
     **Reply (2 min):** "Anonymity survives relocation—we apply the same transform to all. But anonymity alone doesn't justify prioritization; it just hides who is worse off. Continuity isn’t threatened: concave functions are continuous. The arbitrariness charge misses my target: the transform isn't *mathematically* arbitrary, but its *moral rationale* is."  
     **Soft Spot:** Hand-waves the "moral rationale" point; economists may see this as non-falsifiable.  

  ---

  ### **II. Egalitarian Political Philosophers**  
  *(Focus: Moral foundations, intrinsic value, justice)*  

  1. **Objection (High Damage: Rejects Core Moral Intuition):**  
     "You say prioritarianism can't explain priority to the worse-off without smuggling in equality. But equality *is* intrinsically valuable! Your 'relocation' reduces justice to mere decision rules, ignoring the *distinctive badness* of one person being worse off than another. Why isn't your view just a surrender to utilitarianism?"  
     **Reply (2 min):** "I agree equality might be intrinsically valuable—my target is prioritarianism’s claim to *avoid* that. Prioritarians say they don’t care about inequality, only absolute levels. But if the moral force of 'worse-off' depends on their *relative* disadvantage, then prioritarianism either tacitly accepts egalitarianism or is morally hollow."  
     **Soft Spot:** Concedes ground on intrinsic equality, which may alienate anti-egalitarian allies.  

  2. **Objection (Medium Damage: Misdiagnoses the LDO):**  
     "The leveling-down objection (LDO) targets egalitarianism for valuing equality even when it harms all. Prioritarianism avoids this by design. Your 'harder objection' just restates that we *should* care about inequality! But that’s a virtue—your 'relocation' exposes prioritarianism’s true egalitarian core."  
     **Reply (2 min):** "Prioritarianism avoids LDO only by refusing to call equal-but-worse worlds 'better.' But if it’s not about betterness, why prioritize anyone? When we choose to weight the worse-off, we’re implicitly acknowledging their *relative* plight. My point is that avoiding LDO costs prioritarianism its moral story."  
     **Soft Spot:** Appears circular—assumes "relative" is essential without proving it.  

  3. **Objection (Low Damage: Ignohes Pluralism):**  
     "Why can’t prioritarianism be one component of a pluralist view? It handles absolute deprivation; equality handles relative fairness. Your critique assumes a false dichotomy."  
     **Reply (2 min):** "I’m attacking prioritarianism *as a standalone theory*. If it needs pluralism, it concedes my point: pure prioritarianism lacks resources to explain priority without equality. Relocation exposes this by stripping away outcome-goodness talk."  
     **Soft Spot:** Doesn’t engage pluralism deeply; pragmatic audiences may find this unsatisfying.  

  ---

  ### **Concessions to Make Upfront**  
  1. **"Standard prioritarianism technically avoids leveling-down** via its concave transform—I grant its formal coherence."  
  2. **"The relocation move isn’t new—** it echoes decision-theoretic defenses (e.g., Adler 2012). My contribution is showing how it *mutates* the LDO."  
  3. **"Yes, prioritarianism post-relocation can still guide policy—** but it becomes a 'shallow' theory: it describes *how* we choose, not *why*."  

  ### **The Question You Hope Nobody Asks**  
  **"Can you formalize a test for when 'priority to the worse-off' covertly relies on inequality? If not, is your argument just a verbal intuition?"**  
  - **Why it’s deadly:** Forces you to either propose a test (which economists will tear apart) or admit your argument is hermeneutic (which philosophers may dismiss as non-falsifiable). It exposes the gap between your moral critique and formal social choice.  
  - **Damage Control Reply:** "We can test it by examining cases where absolute gains to the better-off reduce relative gaps. If prioritarians object, they reveal inequality aversion. But formalizing this requires specifying 'covert' reliance—which is my point: prioritarianism lacks the vocabulary to confess this." *(Soft Spot: Still hand-wavy; economists will demand axioms.)*  

  ### **Tactical Notes**  
  - **For economists:** Emphasize that relocation violates the *interpretation* of separability/Pareto, not the math. Redirect to "What justifies the concave transform?"  
  - **For philosophers:** Stress that relocated prioritarianism becomes "moral choice without moral explanation." Invite them to claim it as egalitarianism in disguise.  
  - **Dodge stock objections** (e.g., "Doesn’t prioritarianism allow monstrous inequalities?")—this audience won’t waste time on well-trodden ground.  

  This prep balances technical credibility with philosophical traction. Your strongest shield is consistency: relocation *systematically* forces prioritarianism into this dilemma. Lean into that.
