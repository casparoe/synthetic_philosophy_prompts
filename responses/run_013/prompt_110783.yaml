  Hmm, this user is deep in graduate-level philosophy of personal identity, specifically frustrated with how discussions unfold in their seminar. They're tired of intuitive case-tossing without clarifying what these cases are meant to test. Their request is razor-focused: they want desiderata for what matters in survival (not identity per se), structured around specific puzzle cases, plus meta-constraints about theory architecture and empirical adequacy. 

  The user's tone is impatient but precise—they're clearly done with hand-waving and want analytical scaffolding. Key tells: they emphasize "specification" over "another theory," demand explicit verdicts on which constraints are binding vs. partisan, and even flag their own suspicion about an incompatibility (anticipability vs. all-or-nothing survival). This isn't a first-year student; they're mapping the battlefield.

  Breaking down their ask: First, the case-based desiderata. They list five phenomena: standard teletransportation, non-destructive replication, delayed destruction, fission, slow drift, and universal relation induction. For each, a theory must deliver three outputs: survival status, prudential significance, and scalar weighting if applicable. 

  Then the framework constraints: (1) decouple survival-mattering from identity or justify conflation, (2) interface with practices like promise-keeping/desert/grief, (3) take stands on gradience and branching, (4) fit real-world psychology (sleep, anesthesia gaps). Finally, they want conflict diagnostics—especially their pet incompatibility—and a breezy comparative scorecard of major theories.

  My response must resist the seminar's pitfalls: no unanchored intuitions, no theory-promotion. Structure is key: desiderata as numbered requirements with explicit case-motivators and verdicts on constraint status. The universal-induction case (their "device" scenario) is especially potent—it's designed to smoke out theories that smuggle in identity through the back door. 

  The incompatibility they sense is real: if survival is rationally anticipable (so you can't be wrong about your own future existence), it probably can't be all-or-nothing when fission/drift cases force continuum outcomes. Resolving this costs either anticipability (making survival epistemically alien) or bivalence (forcing us to say "I sort of survive"). I'll mark this as Desideratum 10.

  For the theories snapshot: psychological views (Parfit-style) ace branching/drift but flunk non-branching teletransport; brute-physical views save teletransport but make psychological drift death; Parfit himself bites all bullets but sacrifices identity to preserve what matters. User can run the math—they just need the axioms clear.
answer: |-
  Here are the desiderata for a theory of prudential concern ("what matters in survival"), structured as requirements with motivating cases, constraint status, and explicit verdicts. The phenomena you listed are treated as test cases, with each desideratum specifying how a theory must handle them.

  ---

  ### **I. Case-Based Desiderata**  
  *(What the theory must explain about specific scenarios)*  

  1. **Teletransportation (Standard)**  
     - **Case:** Original destroyed, replica constructed elsewhere with identical psychology.  
     - **Requirement:** The theory must judge whether prudential concern transfers to the replica.  
     - **Verdict Constraint:** *Genuine* (tests if psychological continuity sans physical continuity suffices).  
     - **Output Needed:** Survival? *Yes/No*. Matters? *Yes/No*. Degree? *Full/Diminished*.  

  2. **Non-Destructive Replication + Delayed Destruction**  
     - **Case:** (A) Replica created, original unharmed; (B) Original destroyed after a week of co-existence.  
     - **Requirement:** The theory must explain differing intuitive unease in (A) vs. relief in (B).  
     - **Verdict Constraint:** *Genuine* (tests uniqueness/branching of prudential relation).  
     - **Output Needed:**  
       - (A) Survival? *Original yes, replica no*. Matters for replica? *No*.  
       - (B) Survival? *Replica yes*. Matters? *Yes, but possibly diminished if branching is problematic*.  

  3. **Hemispheric Fission**  
     - **Case:** Brain split; two successors emerge, each psychologically continuous with you.  
     - **Requirement:** The theory must reject full survival in *both* (all-or-nothing) but permit partial concern for *each*.  
     - **Verdict Constraint:** *Genuine* (tests branching and degrees).  
     - **Output Needed:** Survival? *No (strict identity)*. Matters? *Yes, symmetrically for both*. Degree? *~50% each*.  

  4. **Slow Drift**  
     - **Case:** Gradual replacement of all mental traits over time via ordinary processes.  
     - **Requirement:** The theory must affirm survival at each step but deny it between endpoints, without sharp boundaries.  
     - **Verdict Constraint:** *Genuine* (tests gradualism vs. all-or-nothing survival).  
     - **Output Needed:** Survival? *Yes at t1, no at tn*. Matters? *Degrades gradually*.  

  5. **Universal Relation Induction**  
     - **Case:** A device induces the "prudential relation" between any two arbitrary persons.  
     - **Requirement:** The theory must either (a) deny this is possible (if relation is identity-dependent) or (b) accept it implies *no special concern* for one’s prior self.  
     - **Verdict Constraint:** *Genuine* (tests whether the relation is non-arbitrary and self-specific).  
     - **Output Needed:** Survival? *No*. Matters? *No* (else the relation is trivial).  

  ---

  ### **II. Framework Constraints**  
  *(Non-case-based theoretical requirements)*  

  6. **Decoupling from Identity**  
     - **Requirement:** The theory must not define prudential concern via identity *unless* it justifies why identity is necessary for anticipation.  
     - **Motivation:** Fission cases show identity can diverge from concern (e.g., I care about both successors though neither is *me*).  
     - **Constraint Status:** *Genuine* (else collapses into identity theory by fiat).  

  7. **Practical Compatibility**  
     - **Requirement:** The theory must prescribe revisions (or not) to:  
       - *Self-promising*: Can I bind a future self that is psychologically discontinuous?  
       - *Advance directives*: When should they be overridden?  
       - *Desert/Punishment*: Is the drifted self responsible for past acts?  
       - *Grief*: Is grief irrational if "survival" is satisfied?  
     - **Constraint Status:** *Genuine* (theories must engage real-world stakes).  

  8. **Gradience and Branching**  
     - **Requirement:** The theory must explicitly state if prudential concern:  
       - (a) Admits degrees (e.g., in drift/fission),  
       - (b) Can branch (e.g., in fission).  
     - **Motivation:** Fission/drift demand scalar or branching solutions; teletransport may resist.  
     - **Constraint Status:** *Genuine* (empirical cases force this).  

  9. **Psychological Realism**  
     - **Requirement:** The theory must accommodate interruptions (sleep, anesthesia) without denying survival.  
     - **Motivation:** Daily breaks in consciousness don’t terminate prudential concern.  
     - **Constraint Status:** *Genuine* (rejects overfitting to idealized continuity).  

  ---

  ### **III. Incompatible Desiderata**  
  10. **The Anticipability vs. All-or-Nothing Conflict**  
      - **Incompatibility:**  
        - (A) *Rationally Anticipable*: I cannot be mistaken about whether *I* will experience a future.  
        - (B) *All-or-Nothing*: Survival is binary (you survive or you don’t).  
      - **Conflict:** Fission/drift force continuum cases where (A) and (B) clash. If survival is all-or-nothing, fission implies I don’t survive (violating anticipability if I expect to wake up). If survival is graded, (A) is false (I may "partly" survive but cannot anticipate "being" a successor).  
      - **Costs:**  
        - *Drop All-or-Nothing*: Accept degrees of survival → forces revisions to identity-based practices (e.g., punishment).  
        - *Drop Anticipability*: Survival becomes an objective fact I might be wrong about → severs first-person authority.  

  ---

  ### **Theories at a Glance**  
  - **Psychological Continuity (e.g., Parfit):**  
    Satisfies 1 (replica: survival), 2A (no survival), 2B (survival), 3 (branching/degrees), 4 (gradual loss), 5 (relation is non-arbitrary), 6–9. Rejects all-or-nothing survival (cost: revises identity-bound practices).  
  - **Brute Physical Continuity (e.g., Animalism):**  
    Fails 1 (replica: death), 2B (replica death), 3 (no branching), 4 (drift is death), 5 (relation is identity-bound). Satisfies 6–7 (by conflating identity/survival) but fails 8–9 (ignores psychology).  
  - **Parfit’s Reductionism:**  
    Explicitly drops all-or-nothing survival. Satisfies all case desiderata (1–5) and 6–9. Licenses self-concern in branching (3) but denies identity. Cost: Radical practice revisions (e.g., fission voids promises).  

  Focus on weighting desiderata against each other—especially the incompatibility in §10—when scoring theories. No theory satisfies all constraints without sacrificing core intuitions.
