prompt: |-
  I have been going back and forth with two friends about conspiracy theories, and I have found that I hold quite firm verdicts on particular cases while having no idea what general principle, if any, unifies them. What I want from you is not a survey of what various authors have said, nor a reading list, but the principle itself — or a small set of competing candidates — stated precisely enough that I could apply it to a fresh case on my own. Tell me what each principle implies about cases I have not considered, and be honest about which of my verdicts it forces me to abandon.

  Here are the cases and my verdicts. (1) Senior officials in an administration coordinated to cover up a break-in and then lied about their involvement: believing this was not merely reasonable but correct, and I would not call the believer a "conspiracy theorist" at all. (2) A coalition of tobacco companies coordinated for decades to manufacture doubt about the link between smoking and cancer: likewise reasonable, and every bit a real conspiracy, even though it was large and lasted a long time. (3) The moon landings were staged: unreasonable. (4) A recent national election was stolen by rigged voting machines: unreasonable. (5) A large bank knowingly laundered money for a cartel, believed on the strength of a leaked internal memo together with the bank's implausible denials: reasonable. (6) A consortium of governments and airlines is concealing the true cause of a plane crash, where my friend treats the fact that no insider has ever come forward as proof of how airtight the cover-up is: unreasonable. (7) The same friend counters that the tobacco companies' public position was equally airtight — every new study was dismissed as inconclusive and the demand for further research never ended — and yet I still say it was reasonable to believe them guilty. That is the pair I cannot reconcile: I want to say the self-sealing quality of (6) is what damns it, but (7) appears to have the very same quality, so either my verdict on (6) or my verdict on (7) has to give, and I cannot see which.

  One friend has offered a tentative principle and I would like it tested and repaired: that a conspiracy theory is unwarranted just when it explains the absence of evidence as itself part of the conspiracy, so that nothing could count against it. Another friend put it differently — that a conspiracy theory is what you get when stray anomalies are explained by hidden agency rather than by noise, error, or ordinary self-interest. I suspect both are too crude: the first seems to make warrant turn on the content of the claim rather than on how the believer came to hold it, and I am not sure a purely procedural account, which asks only whether the belief was formed by a reliable-enough method, can explain why (1) and (2) feel like knowledge while (4) and (6) feel like a failure of reasoning, given that the believers in all four may be equally confident and equally unable to produce the decisive document. Please give me a principle or a few candidates, each stated precisely, with the case that motivates each clause, its verdicts on at least two further cases I have not listed, and an explicit statement of which of my verdicts it cannot accommodate. I would also like to know whether the principle is meant to govern the warrant of the belief or the aptness of the label "conspiracy theory," since I suspect those two come apart.
reasoning: |-
  Okay, let me start by really understanding what the user is asking for. They want a clear principle that distinguishes between reasonable and unreasonable conspiracy beliefs, based on their specific examples. They mentioned cases like Watergate and tobacco cover-ups as reasonable, but moon landing hoaxes and election fraud as unreasonable. The main conflict they're struggling with is between cases (6) and (7)—why the airtight defense in tobacco is acceptable but in the plane crash cover-up it's not.

  First, I need to unpack their examples. Watergate (1) and tobacco (2) are well-documented conspiracies. The user sees these as reasonable because there's evidence. Moon landings (3) and election fraud (4) are deemed unreasonable. The bank money laundering (5) is reasonable based on a leaked memo. But the plane crash cover-up (6) is unreasonable despite the friend's argument that no insiders came forward. The tobacco case (7) also had a self-sealing defense, yet it's still reasonable. That’s the core contradiction they need resolved.

  The user’s friends proposed principles: one about explaining absence of evidence as part of the conspiracy, and another about attributing anomalies to hidden agency. The user thinks these are too crude. They want something that considers both the content and the belief formation process. Also, they want to know if the principle is about warrant for belief or the label "conspiracy theory."

  I should consider different angles. Maybe an epistemic principle focusing on evidence resilience. For example, in reasonable cases like tobacco, evidence can emerge despite suppression. In unreasonable ones like the plane crash, the theory is structured so no evidence could ever disprove it. That might resolve the (6) vs (7) conflict. 

  Another principle could be about explanatory scope. Tobacco conspiracy explains specific anomalies (doubt campaigns), while plane crash theories might over-reach without evidence. But the user might worry this is too vague. 

  A third principle could involve institutional incentives. Legitimate institutions sometimes investigate conspiracies (like courts with tobacco), lending credibility. But rogue theories lack such pathways. This addresses why Watergate was confirmed through investigations. 

  Need to test each principle against all cases. For example, the evidence resilience principle: tobacco had leaks and documents surfacing, so it's falsifiable. The plane crash theory, where lack of whistleblowers is seen as proof, isn't falsifiable. That saves both (6) and (7). 

  Also, check against new cases. Like the Sokal Hoax—reasonable to suspect fraud based on inconsistencies. Or 9/11 truther—unreasonable because evidence against is dismissed as part of cover-up. 

  Which verdicts conflict? The resilience principle might challenge case (4) if there's some evidence, but the user thinks it's unreasonable. So clarify that mere allegations without resilience make it unwarranted. 

  Label vs. warrant: the term "conspiracy theory" is often pejorative, so separating descriptive from normative aspects. The principles here focus on warrant, not the label. 

  Finally, the user needs to know which of their verdicts might be abandoned. Probably none, if the principles correctly categorize each case. The key is resolving the (6) and (7) contradiction through falsifiability and evidence dynamics.
answer: |-
  Based on your cases and the core conflict between (6) and (7), here are three precisely stated principles designed to distinguish warranted conspiracy beliefs from unwarranted ones. Each principle focuses on **epistemic warrant** (the justification/rationality for *believing* the claim), not merely the aptness of the label "conspiracy theory." The label is often applied pejoratively to *unwarranted* conspiracy beliefs but can descriptively apply to *any* claim of covert coordination (like Watergate or Big Tobacco).

  **Core Principles & Your Cases:**

  1.  **The Evidence Resilience Principle (ERP):**
      *   **Statement:** A conspiracy belief is warranted if and only if:
          1.  It explains specific, credible anomalies *better* than non-conspiratorial alternatives.
          2.  It *permits* the existence of counter-evidence that could genuinely falsify the core conspiracy claim, without requiring that *all* counter-evidence must itself be part of the conspiracy.
          3.  There exists a plausible, accessible pathway by which evidence *supporting* the conspiracy could realistically emerge despite the conspirators' efforts, and such evidence has demonstrably emerged or is actively emerging.
      *   **Motivation:** Directly addresses your (6) vs. (7) conflict. The tobacco conspiracy *allowed* counter-evidence (studies showing harm existed and were published) and had a plausible pathway for evidence emergence (leaks, whistleblowers, internal documents surfacing in litigation). The plane crash theory in (6) fails condition (2) & (3): the *absence* of whistleblowers is used as *proof*, making the theory unfalsifiable and lacking a plausible path for evidence emergence beyond the believer's assumptions.
      *   **Your Verdicts:**
          *   (1) Watergate: **Warranted.** Met condition (3) - leaks, investigations, tapes emerged.
          *   (2) Tobacco: **Warranted.** Met condition (2) (counter-evidence existed) & (3) (internal docs emerged via lawsuits/journalism).
          *   (3) Moon Landing: **Unwarranted.** Fails (1) (lacks credible anomalies not explained by simpler means), (2) (dismisses all counter-evidence as staged), (3) (no plausible path for evidence emergence exists).
          *   (4) Election Rigged: **Unwarranted.** Typically fails (1) (anomalies often debunked/misinterpreted), (2) (dismisses audits/court rulings as corrupt), (3) (no credible evidence emerged despite intense scrutiny; path blocked only by assumption).
          *   (5) Bank Laundering: **Warranted.** Leaked memo (+ implausible denial) provides specific evidence satisfying (1) & demonstrates condition (3) is active (evidence *did* emerge via leak).
          *   (6) Plane Crash Cover-up: **Unwarranted.** Fails (2) & (3). Absence of whistleblowers is *explained by* conspiracy, making it self-sealing. No plausible path for evidence emergence defined.
          *   (7) Tobacco Defense: **Doesn't Apply.** This is *about* the tobacco conspiracy claim, not a separate conspiracy theory. ERP judges *that claim* warranted, as above. The *defense tactics* are part of the conspiracy's execution, not evidence against the conspiracy theory's warrant.
      *   **Verdicts You Must Abandon:** None. ERP reconciles (6) and (7).
      *   **New Cases:**
          *   **Sokal Affair:** Believing a specific journal published nonsense as part of a hoax *before* confession. **Warranted?** *Yes.* Specific, bizarre anomaly (paper content) (1). Counter-evidence possible (e.g., journal retraction, author denial) (2). Plausible path for evidence (author confessing, journal investigating) existed (3). *Confirmation occurred.*
          *   **9/11 Controlled Demolition:** **Unwarranted.** Fails (1) (Anomalies explained by physics/complex event). Fails (2) (All counter-evidence - engineering studies, NIST report - dismissed as part of cover-up). Fails (3) (No plausible path for evidence emergence; all dissent is seen as suppressed or part of cover-up).

  2.  **The Anomaly Scope & Parsimony Principle (ASPP):**
      *   **Statement:** A conspiracy belief is warranted if and only if:
          1.  It explains a *specific, well-defined set of anomalies* that are genuinely puzzling under non-conspiratorial explanations.
          2.  The proposed conspiracy mechanism is the *most parsimonious* explanation for *that specific set of anomalies*, considering the scale, complexity, and inherent risks of the conspiracy.
          3.  The theory *does not* require the conspiracy to explain *all* related events, data, or the *absence* of expected evidence beyond its core claims.
      *   **Motivation:** Addresses the "stray anomalies" idea but refines it. Focuses on whether the conspiracy is invoked for specific, localized puzzles rather than as a universal explanation. Separates warranted (specific anomalies) from unwarranted (explaining absence/universal doubt).
      *   **Your Verdicts:**
          *   (1) Watergate: **Warranted.** Specific anomalies (break-in, money trail, erased tapes) (1). Parsimonious for those anomalies (2). Doesn't claim to explain all politics (3).
          *   (2) Tobacco: **Warranted.** Specific anomalies (doubt campaigns despite internal knowledge) (1). Parsimonious explanation (2). Focuses on specific actions, not all science (3).
          *   (3) Moon Landing: **Unwarranted.** Fails (1) (Lacks genuine anomalies not explained by physics/logistics). Fails (2) (Wildly unparsimonious - staging would be vastly harder/more complex than landing).
          *   (4) Election Rigged: **Unwarranted.** Often fails (1) (Anomalies usually debunked/misinterpreted). Fails (2) (Massive, nationwide fraud less parsimonious than known voting issues/irregularities). Often fails (3) (Explains entire result, absence of proof seen as proof).
          *   (5) Bank Laundering: **Warranted.** Specific anomaly (incriminating memo + implausible denial) (1). Parsimonious explanation (2). Doesn't claim vast hidden banking system (3).
          *   (6) Plane Crash Cover-up: **Unwarranted.** Fails (1) (Often starts from absence of whistleblowers, not a positive anomaly). Fails (2) (Global cover-up less parsimonious than accident + investigation limitations). Fails (3) (Explains *why* no evidence exists).
          *   (7) Tobacco Defense: **Doesn't Apply.** The conspiracy *theory* (tobacco cover-up) meets ASPP. The defense tactics are *evidence* within that theory's scope.
      *   **Verdicts You Must Abandon:** None. ASPP also reconciles (6) and (7) by focusing on the *scope* of what the conspiracy is claimed to explain.
      *   **New Cases:**
          *   **Libor Scandal:** Believing banks colluded to manipulate interest rates *before* full proof. **Warranted?** *Yes.* Specific anomalies (rate patterns, trader comms) (1). Parsimonious for those anomalies (2). Didn't require explaining all financial data (3). *Confirmed.*
          *   **Chemtrails:** **Unwarranted.** Fails (1) (Contrails are well-understood; alleged "anomalies" aren't credible). Fails (2) (Global spraying conspiracy vastly less parsimonious than atmospheric physics). Fails (3) (Explains all contrails/weather patterns/absence of proof).

  3.  **The Institutional Pathway Principle (IPP):**
      *   **Statement:** A conspiracy belief is warranted if and only if:
          1.  There exists credible, specific evidence pointing towards covert coordination.
          2.  There is a plausible, functioning societal institution (e.g., journalism, law enforcement, courts, regulatory body, academia) with the *incentive*, *capability*, and *independence* (relative to the alleged conspirators) capable of investigating the claim and potentially uncovering confirming evidence.
          3.  This institutional pathway is demonstrably active or being actively pursued in a manner consistent with the claim.
      *   **Motivation:** Focuses on the *process* of justification within a social epistemology. Warranted beliefs have a credible path to *becoming* knowledge via established means. Addresses why Watergate/tobacco were confirmable, while moon landing hoaxes are not.
      *   **Your Verdicts:**
          *   (1) Watergate: **Warranted.** Evidence (break-in, money) (1). Institutions (Congress, Courts, Press) had incentive/capability (2). Investigations active (3).
          *   (2) Tobacco: **Warranted.** Evidence (leaked docs, research) (1). Institutions (Courts, State AGs, Media) had incentive/capability (2). Lawsuits/investigations active (3).
          *   (3) Moon Landing: **Unwarranted.** Lacks credible evidence (1). No institution exists with capability/incentive to "prove" it was faked *if it wasn't* (2).
          *   (4) Election Rigged: **Unwarranted.** Typically lacks credible evidence (1). Institutions (Courts, Auditors) investigated and found no evidence; claim often dismisses these institutions *themselves* as corrupt, removing the pathway (2 & 3).
          *   (5) Bank Laundering: **Warranted.** Evidence (leaked memo) (1). Institutions (Regulators, Prosecutors, Media) have capability/incentive (2). Leak *enables* active pursuit (3).
          *   (6) Plane Crash Cover-up: **Unwarranted.** Lacks credible evidence (1). Dismisses official investigations (NTSB, etc.) as *part* of the cover-up, destroying the institutional pathway (2 & 3).
          *   (7) Tobacco Defense: **Doesn't Apply.** The conspiracy *theory* met IPP conditions. The defense tactics were *targeted at* institutions (courts, regulators), demonstrating the pathway existed.
      *   **Verdicts You Must Abandon:** None. IPP reconciles (6) and (7) by showing the tobacco conspiracy had an active institutional pathway for confirmation, while the plane crash cover-up theory inherently undermines/disables any such pathway.
      *   **New Cases:**
          *   **Panama Papers:** Believing in widespread offshore tax evasion by elites *before* the leak based on hints. **Warranted?** *Debatable, but leaning Yes.* Some evidence (anomalous wealth patterns, prior scandals) (1). Institutions (ICIJ, intl. media, prosecutors) had capability/incentive (2). Journalistic investigations were active (3). *Leak confirmed.*
          *   **Reptilian Elite:** **Unwarranted.** Lacks credible evidence (1). No institution exists capable of investigating/confirming such a claim (2). Any investigation dismissed as controlled by reptiles.

  **Resolution of the (6) vs. (7) Conflict:** All three principles resolve it similarly:
  *   **(2) Tobacco & (7):** The tobacco conspiracy theory was *falsifiable* (ERP), explained *specific anomalies* parsimoniously (ASPP), and had an *active institutional pathway* for confirmation (IPP). The "self-sealing" defense was *evidence within the theory*, not a logical feature making the *belief itself* unfalsifiable. Counter-evidence existed and was addressed by the theory's mechanism (doubt manufacturing), not used to immunize the theory.
  *   **(6) Plane Crash:** This theory *is* self-sealing/unfalsifiable (ERP fails), explains the *absence* of evidence rather than specific anomalies (ASPP fails), and inherently disables the institutional pathway by incorporating investigators into the conspiracy (IPP fails). The lack of whistleblowers *is* the anomaly it "explains," making it circular.

  **Conclusion:** Your intuitions align best with principles emphasizing **falsifiability/evidence dynamics (ERP)**, **explanatory scope and parsimony (ASPP)**, or the **existence of a credible institutional pathway for confirmation (IPP)**. All three reconcile your key conflict and support your verdicts on the listed cases. ERP most directly addresses the epistemological mechanics of self-sealing arguments. ASPP provides a clear content-based rule. IPP grounds warrant in social processes of verification.

  **Regarding the Label:** None of these principles strictly govern the *descriptive* label "conspiracy theory," which can apply to Watergate (true, warranted) or Moon Hoaxes (false, unwarranted). They govern **warrant**. The pejorative use of "conspiracy theory" often *correlates* with unwarranted beliefs as defined here (especially those failing ERP/ASPP/IPP), but the label itself is not a reliable indicator of warrant. Focus on the principles of justification, not the label.
