prompt: |-
  I'm a second-year PhD student in philosophy and I need to turn a half-formed idea into a term-paper proposal for my epistemology seminar (one semester, about 6,000 words). Everyone argues about whether the norm of assertion is knowledge, truth, belief, or justification, but all of those debates seem to assume the assertor and the audience are in a live exchange, where the hearer can push back, ask how you know, demand a reason, and so on. What I want to look at is what I've been calling record-assertions: the things we assert into a file, a log, a case note, an evidence record, where the audience is some downstream user, maybe years later, who can't query you at all. My hunch is that the standard norms either misfire here or need a relativised version, but I'm honestly not sure it isn't just the familiar audience-sensitivity point dressed up in new clothes, and I need the proposal to take that worry seriously rather than pretend its new. Don't worry about citations, I'll add those myself.

  Can you write the proposal? Give it to me as exactly five numbered points, each one a sentence or two, no intro and no conclusion, covering: the question stated so it has a determinate answer; why the existing positions leave it open; what I'd actually do and why that approach rather than the obvious alternatives; what a result would look like; and what would count as the project failing or turning out too big for a semester. I'll pad it out into prose afterwards.
reasoning: |-
  Okay, let me approach this systematically. The user is a second-year philosophy PhD student working on an epistemology seminar paper about assertion norms in non-interactive contexts. They've identified a gap in the literature where current debates assume live exchanges with pushback possibilities, but they want to examine "record-assertions" like case notes or logs where recipients can't query later. 

  Hmm, the core challenge here is making sure their concept feels substantive rather than just repackaged audience-sensitivity. I need to craft a proposal that acknowledges that risk head-on while still carving out intellectual space. The five-point structure they requested is actually brilliant for forcing precision - each point must do heavy lifting.

  For the research question (point 1), I'll frame it as whether standard norms apply to record-assertions at all, pushing beyond mere parameter-adjustment. The key is making the "non-interactive" element central rather than incidental. 

  On existing theories (point 2), I should highlight how even contextualists like DeRose assume some baseline interactivity - their mechanisms for resolving ambiguity fail when no back-and-forth exists. The literature's silence on this specific scenario needs emphasis.

  Methodologically (point 3), they'll need case studies where record-assertions caused epistemic harm precisely due to lack of interactivity. Contrasting with live testimony shows why alternative approaches like Gricean pragmatics can't fully address this. 

  For outcomes (point 4), success would be showing record-assertions demand either new norms or radical reworking of existing ones - not just tweaks. The "constitutive difference" phrasing makes the stakes clear.

  Finally (point 5), failure conditions protect against scope creep: if record-assertions reduce to standard cases or if the analysis becomes purely practical (not epistemic), that would undermine the project. This keeps them focused.

  Throughout, I'm resisting the urge to over-intellectualize - their tone suggests they want lean, actionable points they can expand later. The archaeology example concretizes things without needing citations now. Mostly I'm hoping this structure gives them confidence their idea isn't just old wine in new bottles.
answer: |-
  Here's your proposal in five numbered points:

  1.  **The Question:** Does the constitutive norm governing assertion—whether knowledge, truth, justified belief, or something else—apply unchanged, require significant modification, or demand a distinct norm entirely for "record-assertions" (e.g., entries in medical charts, police logs, scientific data notes) where the original asserter is permanently unavailable for clarification or challenge by future users of the record?
  2.  **Why Existing Positions Leave It Open:** Current debates focus primarily on conversational assertions where hearer pushback is possible, treating audience sensitivity as a contextual *parameter adjustment* within the same normative framework (e.g., varying strength of justification required), rather than examining if the *absence of any possibility for pushback* fundamentally alters the nature or demands of the norm itself for this distinct speech act type.
  3.  **Method and Rationale:** I will analyze concrete cases of record-assertions (e.g., ambiguous clinical notes leading to misdiagnosis, unclear archaeological field notes hindering reinterpretation) using conceptual analysis informed by speech act theory and epistemology, arguing that this case-study approach reveals structural features (permanent speaker unavailability, decontextualized interpretation risk) overlooked by purely theoretical extensions of conversational norms or purely pragmatic accounts focused solely on downstream consequences.
  4.  **What a Result Looks Like:** A successful result would demonstrate that record-assertions necessitate either (a) a relativized version of a standard norm (e.g., "assert only what you know *could be reasonably interpreted correctly* given foreseeable record use") that fundamentally differs from conversational relativization, or (b) a distinct norm grounded in the unique responsibilities of creating an enduring, unclarifiable epistemic artifact, thereby showing non-interactivity creates a constitutive difference.
  5.  **Failure/Overextension Conditions:** The project fails if record-assertions turn out to be governed *without remainder* by existing norms merely requiring stronger justification due to higher stakes, or if the analysis collapses into purely practical/ethical norms about record-keeping rather than revealing a distinct *epistemic* normativity inherent to the act; it overextends if establishing a *new* norm requires extensive meta-normative justification beyond the scope.

  **Key strengths embedded:** Directly confronts the "dressed up" worry by focusing on *structural absence* of pushback, uses concrete cases to force the issue, defines success/failure rigorously against scope creep.
