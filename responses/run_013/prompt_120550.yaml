  The key is that they’re operating on different levels of linguistic theory. The friend is focused on semantics—what the word itself contributes. The user is looking at pragmatics—how the word is used. Both are valid but address different aspects. The real issue might be what a theory of meaning should include. Does it cover truth conditions only, or also social effects?

