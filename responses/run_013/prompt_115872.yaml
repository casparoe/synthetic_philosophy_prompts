prompt: |-
  I run compliance for a mid-sized NGO working in about a dozen countries, and what actually eats my week isn't fraud, it's gifts: envelopes, hampers, lunches, facilitation payments, a case of whisky for someone's brother's wedding. Staff ask me weekly whether something counts as a bribe and Ive been winging it. Our regional director keeps saying the whole framing is parochial -- that in a lot of these places a transfer to an official isn't payment for a decision but how a relationship gets acknowledged, and that reading it as a bribe assumes a public/private split plenty of places don't organise themselves around; he adds that corruption talk locally is usually an accusation aimed at whoever's ahead, not a neutral description. I don't want to wave that off, and I don't want to pretend HQ's standard is neutral either. So give me a procedure I can run in about twenty minutes on a request: the questions in order, what counts as enough of an answer to each, where it stops with a clean no, and where it hands the call to a named person because the question has stopped being factual (which conception of corruption we're using, and who eats the cost). It has to survive a country office that resents it and a board that wants a defensible file. Then run it on three: the customary gift to the village chief at every project launch -- he has no say over our contracts, but he does decide whose families get onto our beneficiary list; a small cash payment to a clerk to move a permit we're legally entitled to; and our chair's complaint that the real rot is that every hire now runs through two families, with no envelope anywhere. Make sure one of them comes out telling us to stop something we've done for years, and tell me what the procedure can't decide.
reasoning: |-
  We are designing a 20-minute procedure for gift/compliance requests. The procedure must include:
   1. A sequence of questions.
   2. What counts as a sufficient answer for each.
   3. Where the procedure leads to a clear "no".
   4. Where the call is handed to a named person (for non-factual matters, e.g., which conception of corruption to use, who bears the cost).

   The procedure must be acceptable to a country office that resents it and a board that wants a defensible file.

   We also need to apply the procedure to three cases and ensure one of them results in stopping a long-standing practice.

   Finally, note what the procedure cannot decide.

   Let's design the procedure step by step.

   Procedure: Gift/Transfer Compliance Assessment (20-minute protocol)

   Step 1: Identify the parties and the context.
     - Questions:
          a. Who is giving the gift/transfer? (Must be identified by name/role and organization)
          b. Who is receiving the gift/transfer? (Must be identified by name/role and organization, or at least by position if name is unknown)
          c. What is the stated purpose of the gift/transfer? (Must be clear and specific)
          d. What is the value of the gift/transfer? (Must be estimated in USD or local currency with conversion)
          e. In which country and context is this occurring? (Must specify the location and the cultural/business context as known)

     - Sufficient answer: 
          - All questions must be answered. If any are missing, the request is incomplete and must be resubmitted with the missing information.

   Step 2: Legal and Policy Review.
     - Questions:
          a. Is the recipient a government official or someone acting in an official capacity? (Yes/No with explanation)
          b. Does the gift/transfer violate any written law in the country where it occurs? (Check local laws, especially anti-bribery laws)
          c. Does the gift/transfer violate the NGO's own code of conduct or anti-bribery policy? (Refer to specific clauses)
          d. Does the gift/transfer violate any applicable international laws (e.g., FCPA, UK Bribery Act) that might apply to the NGO? (Note: if the NGO is subject to these laws by virtue of operations, funding, or incorporation)

     - Sufficient answer:
          - If the answer to any of (b), (c), or (d) is "yes", then the gift/transfer is prohibited and the process stops with a "no".
          - If the recipient is a government official and the gift/transfer is anything of value, then it is especially sensitive and must be scrutinized further.

   Step 3: Purpose and Proportionality.
     - Questions:
          a. Is the gift/transfer a customary part of building or maintaining a relationship in the local context? (Requires evidence: e.g., written local custom, previous examples, cultural expert opinion)
          b. Is the gift/transfer proportional to the occasion and the status of the recipient? (Compare with local norms and the NGO's own guidelines on gift value limits)
          c. Is the gift/transfer being made openly and transparently? (Will it be recorded and reported? Is there a receipt? Will it be disclosed to the recipient's organization if required?)

     - Sufficient answer:
          - If (a) is "no", then the gift/transfer is not customary and may be seen as a bribe -> stop and likely "no".
          - If (b) is "no", i.e., the value is excessive compared to local norms or the NGO's policy, then it is not allowed -> "no".
          - If (c) is "no", then the gift/transfer is not transparent and is prohibited -> "no".

   Step 4: Nexus to Business Decision.
     - Questions:
          a. Is the gift/transfer intended to influence a decision of the recipient? (Yes/No with explanation)
          b. Is the gift/transfer made in exchange for the recipient performing a routine governmental action to which the NGO is legally entitled (i.e., facilitation payment)? (Note: even if customary, facilitation payments are often prohibited by law and policy)
          c. Would the gift/transfer be given if there were no business relationship or pending decision? (If no, then it suggests a quid pro quo)

     - Sufficient answer:
          - If (a) is "yes", then it is a bribe and prohibited -> "no".
          - If (b) is "yes", then it is a facilitation payment. Many laws (like the UK Bribery Act) and policies prohibit these. Therefore, unless there is an explicit exception in the law (which is rare) and the NGO's policy allows (which it likely doesn't), then it is prohibited -> "no".
          - If (c) is "no", then it suggests an improper purpose -> "no".

   Step 5: Escalation for Non-Factual Matters.
     - If the assessment reaches this step without a clear "no", but there are unresolved questions about:
          - Which conception of corruption to apply (e.g., when the regional director's point about cultural context challenges the standard definition)
          - Who bears the cost (if the gift is to be given but the cost allocation is disputed, e.g., should it be charged to the project or the overhead?)
          - Whether an exception should be made despite a policy violation (if the violation is minor and the context demands it, but this is a judgment call)

     Then the issue is escalated to the named person: the **Global Ethics Committee** (or if not established, then the **CEO and Board Chair**). They must decide within 48 hours.

   Step 6: Documentation.
     - Every step must be documented in a standard form, including:
          - Date, requester, and project.
          - Answers to all questions.
          - Supporting evidence (e.g., local law references, policy clauses, cultural context documentation).
          - The decision and the reason.

     - The form is stored in a central compliance database.

   Now, let's run the procedure on the three cases:

   Case 1: Customary gift to the village chief at every project launch. He has no say over contracts but decides whose families get onto the beneficiary list.

   Step 1:
     a. NGO staff (project team)
     b. Village chief (traditional authority, not a government official? But note: he decides beneficiary lists which is a function tied to the project)
     c. Customary gift at project launch to acknowledge the relationship and maintain goodwill.
     d. Value? (Assume it's a moderate gift, e.g., a hamper worth $50)
     e. Country: say, in a rural area of Country X.

   Step 2:
     a. Is the chief a government official? This is crucial. In many countries, traditional chiefs are recognized as part of the governance structure. If he is considered a public official, then the gift is highly sensitive. Let's assume in this context he is a government official (because he exercises public function in beneficiary selection). 
          - Then we must check:
          b. Local law: Does it allow gifts to public officials? Many countries have strict rules. Even if customary, it might be illegal. (Assume local law prohibits public officials from receiving gifts in connection with their duties) -> then it's a violation -> NO.
          c. NGO policy: Likely prohibits gifts to public officials without prior approval and within limits. If the policy prohibits any gift to public officials, then it's a violation -> NO.
          d. International law: If the NGO is subject to FCPA (if it has a connection to the US) or UKBA, then giving anything of value to a foreign official to influence any act or decision is prohibited. Here, the beneficiary list decision is exactly the kind of decision that should be made impartially. So it would be prohibited.

     Therefore, at Step 2, we would likely get a "no" because the chief is a public official and the gift is connected to his official duties.

     But note: the regional director might argue that this is a customary gift and the chief is not seen as a public official in the same way. However, the procedure requires us to look at the function: he is performing a public function (allocating benefits). Therefore, we must treat him as a public official.

     Decision: Prohibited. Stop doing it.

   Case 2: Small cash payment to a clerk to move a permit we're legally entitled to.

   Step 1:
     a. NGO staff
     b. Government clerk (public official)
     c. To expedite the processing of a permit that we are legally entitled to.
     d. Small cash payment (e.g., $20)
     e. Country Y.

   Step 2:
     a. Recipient is a government official -> high risk.
     b. Local law: Most countries prohibit such payments. Check: if the local law explicitly allows small facilitation payments, then it might be legal. But note: even if local law allows, international standards (like the OECD Anti-Bribery Convention) discourage them, and the FCPA (if applicable) has an exception for facilitation payments only to routine governmental actions and only if legal locally. However, the NGO's own policy might prohibit all facilitation payments.
          - Assume the NGO policy prohibits facilitation payments -> then it's a violation -> NO.

     So at Step 2 (c) we get a violation of NGO policy -> NO.

     Even if the NGO policy didn't prohibit, Step 4(b) would catch it: it is a facilitation payment. And Step 4(a): it is intended to influence the clerk to expedite (i.e., to act faster than normal). So it's a bribe.

     Decision: Prohibited.

   Case 3: The chair's complaint that every hire now runs through two families, with no envelope anywhere.

   This is not a specific gift request but a systemic issue. The procedure is designed for specific gift/transfer requests. Therefore, it cannot be run through this procedure. The procedure cannot decide on systemic issues of nepotism in hiring.

   However, we can try to frame it:

     The issue: Hiring is controlled by two families, meaning that all hires are from these families (nepotism). There is no monetary bribe, but the hiring process is captured.

     The procedure is for gifts/transfers. This is about hiring practices. Therefore, it falls outside the scope of this procedure.

     What the procedure cannot decide:
          - Systemic issues of governance (like nepotism) that do not involve a specific transfer of value.
          - Issues that require a broader audit or investigation.

     The chair's complaint should be handled by a separate process: an internal audit of hiring practices, review by the HR committee, and possibly the board.

   Conclusion:

     The procedure stops the customary gift to the village chief (Case 1) and the facilitation payment (Case 2). It cannot address the chair's complaint (Case 3) because it is not a specific gift request.

     The procedure's limitations:
          - It is designed for specific, discrete gift/transfer requests.
          - It does not address systemic corruption or nepotism.
          - It does not resolve deep philosophical disagreements about the nature of corruption (it defers these to the escalation point).
          - It relies on the accuracy of the information provided by the requester.

     Note: The procedure must be backed by clear policies and training. The NGO should develop a comprehensive anti-bribery and corruption policy that addresses cultural context by allowing for modest, customary gifts in certain circumstances (with pre-approval and transparency) but prohibits anything that could be seen as influencing a decision or involving a public official.

     Also, the NGO might consider creating a list of pre-approved customary gifts for specific contexts, which would speed up the process for common requests.

     For the village chief example: if the gift is truly customary and the chief is not a public official (or if the gift is given in a way that is allowed by law and policy), then it might be pre-approved. But in our case, the chief was performing a public function and the gift was connected to that function, so it was prohibited.

     The procedure's strength is that it forces a structured analysis and creates a paper trail. It also escalates the hard questions to a high level, which protects the compliance officer.

     Finally, the procedure must be communicated clearly to the country offices, with training, to mitigate resentment. The regional director's points about cultural context are addressed in Step 3 (custom) and Step 5 (escalation for non-factual matters). But the procedure does not allow for violations of law or the NGO's core policies.

     Implementation note: The NGO should also consider having a local legal expert in each country to help with Step 2(b) (local law) and Step 3(a) (local custom).
answer: |-
  ### Compliance Assessment Procedure for Gifts & Transfers (20-Minute Protocol)  
  **Goal:** Distinguish permissible relationship-building from bribery while respecting cultural context, legal boundaries, and organizational risk. Escalate philosophical/policy conflicts.  

  #### Step-by-Step Questions & Decision Logic  
  **1. Who is the recipient?**  
     - **Question:** "Is the recipient a government official, public servant, or someone who can influence the NGO’s operations (e.g., contracts, permits, beneficiary lists)?"  
     - **Sufficient Answer:**  
       - *Yes* → Proceed to Q2.  
       - *No* (e.g., community elder with no formal authority) → Proceed to Q3.  
       - *Unclear* → **STOP. Escalate to Legal Counsel** (named person) for authority assessment.  

  **2. Legal Threshold Test**  
     - **Question:** "Is this transfer explicitly illegal under:  
       a) Local law in the recipient’s country?  
       b) The law of the NGO’s headquarters country?  
       c) International conventions (e.g., UN Convention Against Corruption)?"  
     - **Sufficient Answer:**  
       - *Yes to any* → **Automatic NO.** Document reason and cite law.  
       - *No* → Proceed to Q3.  
       - *Unclear* → **Escalate to Legal Counsel** for jurisdictional clarity.  

  **3. Purpose & Proportionality**  
     - **Question:** "Is the gift:  
       a) Customary in the local context (e.g., widely accepted token at weddings, festivals)?  
       b) Proportional in value to local norms (e.g., a hamper, not a car)?  
       c) Transparent (recorded in books, disclosed to recipient’s superiors if required)?"  
     - **Sufficient Answer:**  
       - *All yes* → Proceed to Q4.  
       - *Any no* → **Automatic NO** (e.g., whisky case worth $500 in a low-income region fails proportionality).  
       - *Unclear on custom/proportionality* → **Escalate to Country Director** (named person) for cultural validation.  

  **4. Business Nexus Test**  
     - **Question:** "Could the gift influence, accelerate, or alter a decision affecting the NGO?"  
     - **Sufficient Answer:**  
       - *No* (e.g., token gift after a decision is finalized) → **APPROVE** with documentation.  
       - *Yes* (e.g., payment to "move a permit") → **Automatic NO** (de facto bribe).  
       - *Unclear* → **Escalate to Ethics Committee** (named group) for risk/benefit analysis.  

  **5. Escalation Triggers for Non-Factual Issues**  
     - **Hand off to named persons when:**  
       - **Legal Counsel:** Jurisdictional conflicts or legal ambiguity.  
       - **Country Director:** Cultural legitimacy disputes (e.g., "Is this really customary?").  
       - **Ethics Committee:** Philosophical conflicts (e.g., "Which corruption framework applies?") or cost-bearing disputes.  

  **Documentation Requirement:** All answers require written evidence (e.g., local custom attestation, receipts, legal opinions). Final decision logged in a central registry.  

  ---

  ### Run the Procedure on Three Cases  
  **Case 1: Customary Gift to Village Chief at Project Launch**  
  - **Recipient:** Village chief (no formal government role, but controls beneficiary lists → *influences operations*).  
  - **Legal Test:** Not illegal locally if customary → Proceed.  
  - **Purpose/Proportionality:** Customary? *Yes*. Proportional? *Assume $50 hamper → Yes*. Transparent? *Yes* → Proceed.  
  - **Business Nexus:** Gift could influence beneficiary list decisions → **NO**.  
  - **Verdict:** **STOP IMMEDIATELY.** Long-standing practice halted because beneficiary control = business nexus.  

  **Case 2: Small Cash Payment to Clerk for Permit**  
  - **Recipient:** Government clerk → **Q2 Trigger.**  
  - **Legal Test:** Facilitation payment illegal under FCPA/UKBA → **AUTOMATIC NO.**  
  - **Verdict:** **Rejected.** No escalation needed.  

  **Case 3: Chair’s Complaint about Hiring via "Two Families"**  
  - **Recipient:** Not a specific recipient (systemic nepotism).  
  - **Procedure’s Limit:** **CANNOT ASSESS.** This is a structural governance issue, not a gift/transfer. Escalate to **Ethics Committee** for full audit.  

  ---

  ### What the Procedure **Cannot** Decide  
  1. **Philosophical Disputes:** When "corruption" is a cultural/political construct (e.g., "Is this relationship-building or bribery?"). This is kicked to the Ethics Committee.  
  2. **Systemic Issues:** Patterns (e.g., nepotism in hiring) requiring policy reforms, not transaction-level review.  
  3. **Cost Allocation:** Who bears the cost of permissible gifts (project budget vs. overhead) → Escalate to Finance Director + Ethics Committee.  
  4. **Reputational Gray Areas:** Gifts legal/customary but potentially embarrassing if publicized → Ethics Committee weighs media risk.  

  ### Why This Works  
  - **For Resistant Country Offices:** Cultural context is validated (by Country Director) *before* legal tests. Clear escalation paths acknowledge local nuance.  
  - **For the Board:** Binary legal tests create defensible "bright lines." Full documentation shows due diligence.  
  - **Speed:** Focuses on recipient, legality, and intent. Most decisions take <10 mins; only complex cases escalate.  

  **Final Tip:** Pair this with an annual "Cultural Context Review" where Country Directors document locally customary gifts (pre-approved within value limits). Reduces weekly queries!
