prompt: |-
  I am assembling the criteria for a theory of AI takeoff speed before evaluating any particular fast-takeoff or slow-takeoff account, and I want the specification in hand first. Write the desiderata that any adequate theory of how fast AI capabilities could improve has to meet: the phenomena it must account for, the cases it must get right, the distinctions it must not collapse, and the findings from outside the debate with which it must be consistent. Give the case or consideration behind each requirement, and mark which requirements are genuine obligations on any theory and which are merely the commitments of one camp dressed up as conditions of adequacy. I need the theory to be adequate for a practical purpose — good enough to tell a regulator whether an intervention in the next few years, a pause or a compute threshold, would reduce risk or merely displace it — so where a requirement is defensible only relative to some other purpose, say so.

  Anchor the list to cases rather than truisms. At a minimum it should say what a theory owes about each of the following: a narrow self-improving system — a theorem prover, or a compiler that improves its own heuristics or its own code — which has existed for decades without anything like an explosion; the human-in-the-loop version of the same loop, in which researchers use models to do machine-learning research faster, which is already the ordinary case; a system with no new data, compute, or experimental feedback available to it; and a system whose further improvement is bottlenecked by processes that run on the timescale of wet labs, fabs, and power grids. It should separate the speed of capability gain from the speed of deployment and both from the speed of real-world consequence, and say what becomes of the theory if intelligence is not one scalar but a bundle whose components have different returns. It should be able to represent a large stock of already-built but idle compute being switched on without thereby asserting anything about how fast the underlying capability would improve, and it should distinguish a system that can do a task from one that can do it fast enough, cheaply enough, and reliably enough to displace the humans currently in the loop. Two facts from outside the AI literature should constrain it: that measured productivity growth in the economies that adopted information technology most aggressively has been roughly flat to declining since the mid-2000s despite very large investment, and that in several fields, semiconductors among them, sustaining a constant rate of progress has required a rising number of researchers.

  Then tell me which subsets of the requirements cannot be satisfied together — I expect there to be at least one such pair, and it is the part I care most about — and which single requirement does the most work in ruling out candidate theories. If the list rules out the standard families of view, note in a sentence or two which camp each requirement cuts against.

  Close by saying what would change your mind: which consideration, if it turned out to be true, would make you drop or demote a requirement, and where your reasoning in constructing the list is most likely to fail. No citations or reading lists, please — I want the criteria, not the literature.
reasoning: |-
  Okay, the user is asking for a comprehensive set of criteria to evaluate theories about how fast AI capabilities could improve—what they call "takeoff speed." They want these criteria to be practical, specifically to help regulators decide on interventions like pauses or compute thresholds. The emphasis is on grounding each requirement in real-world cases rather than abstract principles. 

  Hmm, they listed several concrete examples that any theory must address: narrow self-improving systems (like theorem provers) that haven't led to explosions, human-in-the-loop scenarios where researchers use AI to accelerate progress, systems bottlenecked by physical constraints (labs/fabs/power grids), and the distinction between capability gains vs. deployment vs. consequences. They also mentioned two external constraints: stagnant productivity growth despite IT investments, and rising researcher effort in fields like semiconductors. 

  The user seems deeply familiar with the debate—they’re anticipating contradictions between requirements and want to know which single requirement is most decisive. They’re also skeptical of requirements that might be "camp commitments disguised as obligations." Practicality is key: they’ll dismiss criteria that don’t help regulators assess near-term interventions. 

  ...I need to avoid generic platitudes. Every requirement must be anchored to a specific case. For example:  
  - The "no explosion from narrow self-improvers" case kills theories that assume recursive self-improvement is automatically explosive.  
  - The "human-in-the-loop already exists" case forces theories to explain why adding AI to R&D hasn’t (yet?) caused discontinuity.  
  - The "idle compute" case demands theories separate capability growth from mere resource mobilization.  

  The toughest trade-off will likely be between "Recursive Power" (self-improvement *could* be fast under ideal conditions) and "Human-Bottleneck Realism" (real-world constraints dominate). Most theories sacrifice one for the other.  

  If semiconductor-like diminishing returns apply to AI (more researchers needed per "unit" of progress), that’d sink fast-takeoff views. But if we found a domain where AI *did* accelerate itself exponentially without human help or new data, I’d demote the "No New Inputs" requirement.  

  The "rising researcher effort" fact does the heaviest lifting—it directly challenges the orthogonality of intelligence and effort. If doubling progress requires more than double the R&D resources, pure intelligence gains can’t bypass that.
answer: |-
  Here is a criterion set for evaluating AI takeoff speed theories, grounded in cases, distinctions, and external constraints, with clear obligations vs. camp commitments marked. Requirements are designed for regulatory practicality on interventions like pauses or compute thresholds.

  ---

  ### **Core Requirements (Obligations for Any Adequate Theory)**
  1. **Narrow Self-Improver Stasis**  
     *Must account for:* Decades of non-explosive progress in systems like self-optimizing compilers or theorem provers (e.g., GCC, Coq).  
     *Case:* These systems improve linearly/incrementally despite recursive loops.  
     *Obligation:* Yes. Theories must explain why self-reference ≠ auto-acceleration here.  
     *Regulatory relevance:* Rules out "recursive improvement = inevitable explosion" as justification for pauses.

  2. **Human-in-the-Loop Dominance**  
     *Must account for:* Current ML R&D, where humans use AI tools (e.g., Codex for code, AlphaFold for protein design) with no discontinuous speedup.  
     *Case:* AI-aided research accelerates sublinearly (e.g., 10–30% yearly efficiency gains).  
     *Obligation:* Yes. Theories must model hybrid systems without assuming rapid AI substitution of human researchers.  
     *Regulatory relevance:* Shows existing "takeoff" (tool use) is slow; pauses may not halt this.

  3. **Bottleneck Distinction**  
     *Must separate:*  
     - Capability gains (algorithmic insights)  
     - Deployment (scaling compute/data)  
     - Real-world impact (economic/military adoption)  
     *Case:* GPT-4 existed internally for months before deployment; its societal impact unfolded over years.  
     *Obligation:* Yes. Collapsing these misattributes deployment speed to capability gain.  
     *Regulatory relevance:* Compute thresholds may cap deployment but not capability R&D.

  4. **Idle Compute Neutrality**  
     *Must allow for:* Sudden activation of pre-built compute (e.g., idle data centers) *without* conflating it with underlying capability gains.  
     *Case:* Switching on 1 million idle GPUs enables faster inference/scaling but doesn’t invent new architectures.  
     *Obligation:* Yes. Ignores physical bottlenecks.  
     *Regulatory relevance:* Compute caps might displace risk (to e.g., competitors) but not reduce it if capabilities keep advancing.

  5. **Diminishing Returns from Task Bundling**  
     *Must model:* Intelligence as multidimensional (e.g., creativity, planning, tool use) with nonlinear returns.  
     *Case:* A system mastering chess, protein folding, and poetry may still fail at real-world robotics due to missing "brittle" components.  
     *Obligation:* Yes. Scalar "IQ" models mispredict takeoff dynamics.  
     *Regulatory relevance:* Capability thresholds must be task-specific; pauses need precise targets.

  6. **Production-Scale Bottlenecks**  
     *Must account for:* Physical constraints (chip fab timelines, energy grid upgrades, lab experiments).  
     *Case:* TSMC’s 3nm fab construction took 4 years; wet-lab biology has inherent cycle times.  
     *Obligation:* Yes. Ignores real-world inertia.  
     *Regulatory relevance:** Pauses on training runs won’t affect bottlenecks like chip supply chains.

  ---

  ### **Contested Requirements (Camp Commitments Disguised as Obligations)**
  7. **"No New Inputs" Viability**  
     *Must allow for:* Improvement in systems with frozen data/compute/experimental feedback.  
     *Case:* A system improving via synthetic data or architectural tweaks alone.  
     *Obligation:* No (contested). Slow-takeoff camps cite this as possible; fast-takeoff camps reject it.  
     *Regulatory relevance:* Only relevant if regulators believe in "closed-loop" self-improvement.

  8. **Recursive Self-Improvement Threshold**  
     *Must specify:* Conditions where self-improvement transitions from linear to superlinear.  
     *Case:* Hypothetical "seed AI" that redesigns its architecture.  
     *Obligation:* No (contested). Slow-takeoff views deny this threshold exists; fast-takeoff views hinge on it.  
     *Regulatory relevance:* Central to pause justifications but lacks empirical precedent.

  ---

  ### **External Fact Constraints (Obligations)**
  9. **Productivity Paradox Consistency**  
     *Must reconcile:* Flat/declining productivity growth (e.g., US/EU post-2005) despite massive IT/AI investment.  
     *Case:* Solow Paradox ("computers everywhere except in the productivity statistics").  
     *Obligation:* Yes. Theories predicting rapid economic transformation must explain this discrepancy.  
     *Regulatory relevance:* Counters "AI will instantly reshape economy" arguments for urgent pauses.

  10. **Research Burden Realism**  
      *Must align with:* Rising researcher effort to sustain progress rates (e.g., semiconductors, drug discovery).  
      *Case:* Moore’s Law required 18× more researchers per generation post-2010.  
      *Obligation:* Yes. Ignores compounding difficulty.  
      *Regulatory relevance:* Suggests AI progress may slow without population-scale R&D resources.

  ---

  ### **Inconsistent Requirement Pairs**
  - **Human-in-the-Loop Dominance (2) vs. Recursive Self-Improvement Threshold (8):**  
    If humans are irreplaceable bottlenecks (2), recursive improvement cannot bypass them (8). Resolving this requires abandoning either slow-takeoff realism (2) or fast-takeoff mechanisms (8).  
  - **Production-Scale Bottlenecks (6) vs. "No New Inputs" Viability (7):**  
    Physical bottlenecks (6) imply external inputs are unavoidable, negating closed-loop improvement (7).

  ---

  ### **Most Discriminating Requirement**  
  **Research Burden Realism (10)** does the most work:  
  - Rules out fast-takeoff theories assuming unbounded returns to intelligence (neglects rising effort).  
  - Challenges slow-takeoff theories if they ignore automation of research itself.  
  - Anchored in hard data from parallel domains.

  ---

  ### **What Would Change My Mind**  
  - **Demote "No New Inputs" (7):** If an AI system achieves sustained capability gains (e.g., >2× efficiency/year) with frozen data/compute/feedback, this requirement becomes obligatory.  
  - **Demote "Recursive Threshold" (8):** If a narrow self-improver (e.g., a compiler) exhibits explosive gains without human input, it gains credibility.  
  - **Key Failure Point:** Underestimating **task-bundling complexity (5)**. If intelligence components are synergistic (e.g., planning + creativity → rapid tool discovery), takeoff could be faster than case-based constraints suggest.  
  - **Regulatory Blind Spot:** Overindexing on technical capability gain while ignoring deployment friction (3) could misdirect interventions (e.g., pauses that delay deployment but not research).

  ---

  ### **How Requirements Cut Against Camps**  
  - **Fast-takeoff views:** Violate Narrow Self-Improver Stasis (1), Human-in-the-Loop Dominance (2), Research Burden Realism (10).  
  - **Slow-takeoff views:** Struggle with Recursive Self-Improvement Threshold (8) if pressed for discontinuity scenarios.  
  - **Both camps:** Often collapse Capability/Deployment/Impact (3), risking regulatory overreach.
