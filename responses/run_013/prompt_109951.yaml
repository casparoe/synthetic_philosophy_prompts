  The novel concept needed would focus on the internal recalibration of proposed mechanisms. "Trigger retrofit" seems apt - it emphasizes the retroactive fitting of conditions to the detection apparatus of the proposed mechanism. For boundary cases: 
  - Should count: The kinship cues example where kinship detection shifts to reciprocity based on environmental noise
  - Shouldn't count: Actual facultative adaptations like stress-induced early puberty where the condition is empirically established upfront

  The user's request for confidence levels is smart - shows they understand conceptual boundaries can be fuzzy. The shakiest part is distinguishing this from legitimate facultative adaptation revisions, which often involve post-hoc adjustments too. But the key difference is whether the condition was part of the original theoretical structure or only emerges when challenged.

  This feels like giving a writer precision tools - they're not after academic citations but the exact blade shape to dissect bad arguments in their narrative. The proposed definition gives them that surgical instrument.
answer: |-
  Here's the dissection you requested, sharpened for your novelist's toolkit:

  ### 1. Short Answer
  No single established term perfectly captures this *specific* move. Philosophers often discuss related concepts like "ad hoc hypotheses" or "immunizing stratagems," but they're broader. I propose a new term: **Trigger Retrofit**.

  ### 2. The Pattern Said Back
  You observe claims about evolved behavioral mechanisms (e.g., "help kin for genetic fitness," "crave sweets for calorie scarcity"). When presented with counterevidence (e.g., helping non-kin, rejecting sweets in abundance), proponents don't abandon the core mechanism. Instead, they *retroactively* add a conditional clause *specifically to the mechanism's activation trigger* (e.g., "if kinship cues are noisy, switch to reciprocity," "if local abundance is high, dial down preference"). This conditional is presented as inherent sophistication, not a patch, absorbing counterevidence without empirical cost.

  ### 3. Nearest Named Concepts & Where They Miss
  *   **Ad Hoc Hypothesis (Lakatos/Popper):** An auxiliary assumption added solely to protect a theory from falsification. **Why it misses:** While the retrofit *is* ad hoc, your focus is *where* it's applied – specifically *inside* the proposed mechanism's trigger condition. Ad hoc hypotheses are broader; they can be external (e.g., "the experiment was flawed," "an unknown variable interfered"). Your case involves surgically modifying the *internal logic* of the mechanism's activation rule itself *after* the fact.
  *   **Just-So Story (Gould/Lewontin):** An adaptationist narrative with no supporting evidence, often unfalsifiable. **Why it misses:** Your issue isn't necessarily the *initial lack* of evidence, but how the narrative *actively consumes counterevidence* by modifying the trigger condition. A just-so story might ignore counterevidence; this move *digests* it by growing a new conditional, often while maintaining an illusion of specificity about the mechanism.
  *   **Facultative Adaptation (Legitimate Biology):** A genuinely conditional adaptation where the "if-then" logic *is* the core, empirically supported claim from the outset (e.g., "if stressed during development, mature faster"). **Why it misses:** In legitimate cases, the conditional is the *starting point* and can be independently tested/falsified (e.g., does stress *actually* cause faster maturation?). In your pattern, the conditional is *absent* in the initial bold claim and only appears *post-hoc* as an escape hatch when challenged.

  ### 4. Proposed Name & Definition
  *   **Term:** **Trigger Retrofit**
  *   **One-Line Definition:** The retroactive insertion or modification of a conditional clause governing the *activation trigger* of a proposed evolved psychological mechanism, specifically in response to counterevidence, presented not as a revision but as inherent sophistication, thereby immunizing the core mechanism claim against falsification by absorbing the counterevidence into its triggering logic.
  *   **Boundary Cases:**
      *   **Should Count:** The kinship example. Initial claim: "Mechanism: Help kin (to spread genes)." Counterevidence: "People help non-kin." Retrofit: "Mechanism: Help *those perceived as kin via cues*; *if cues are noisy*, switch to reciprocity." The trigger condition ("cues present/not noisy") is retrofitted to absorb the counter.
      *   **Should NOT Count:** Discovering that a known facultative adaptation (e.g., stress-induced early puberty) operates via a *different specific molecular pathway* than originally hypothesized. This revises the *how* of the mechanism, not the fundamental conditional *trigger* ("if stressed") itself, which was the original claim. The trigger condition itself isn't being retrofitted post-hoc.

  ### 5. Confidence
  *   **Overall Confidence:** **85%**. The *pattern* you describe is real, distinct, and pernicious in pop evo psych. Identifying it as a specific move involving the mechanism's *trigger condition* is sound. The proposed term "Trigger Retrofit" effectively carves it out.
  *   **Least Sure Point:** **Distinguishing it sharply from legitimate *revisions* to facultative adaptation triggers based on *new empirical discoveries*.** If new data shows a mechanism's trigger is more complex (e.g., "not just stress, but stress *plus* nutritional status"), is that a legitimate update or a Trigger Retrofit? The key lies in *intent and timing*: Was the complexity genuinely discovered through proactive research, or only invoked defensively *after* a counterexample was raised? Judging this requires context, making the boundary slightly fuzzy (5% of my doubt). The core move – *defensive, post-hoc* modification of the trigger – remains distinct.
