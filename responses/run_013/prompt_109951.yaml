  Their frustration is palpable - they call it "swallowing evidence" and note how each new conditional is presented as sophistication rather than patchwork. The core issue seems to be the retroactive insertion of conditions specifically about mechanism triggers, not just adding external hypotheses.

  Looking at philosophy of science concepts:
  - Auxiliary hypotheses (Lakatos) are close but usually external to the core mechanism
  - Ad hoc hypotheses are broad but don't capture the internal trigger adjustment
