answer: |-
  Here’s a self-contained thought experiment meeting all constraints:

  **Scenario (178 words):**  
  In the drought-stricken theocracy of Karthia (fictional 14th-century society), divine law mandates a lethal rain-summoning ritual when reservoirs fall below 5%. The victim must be selected by sacred lottery from adult volunteers. During the "Great Dry," High Steward Aelius discovers the lottery was rigged to spare the heir of a rival clan. With reservoirs at 4.9%, he orders the ritual using the *intended* lottery victim (a consenting elder) without rerunning the lottery. Rain follows, saving thousands. Karthian theology held that **only procedurally perfect sacrifices placate the gods**; rigging or bypassing the lottery made the act sacrilege. Modern ethics, however, prioritizes **outcomes and genuine consent over procedural legitimacy**.  

  **Verdicts:**  
  - **Contextualist (past standards):** Condemns Aelius. By Karthia’s own divine law, the unrigged lottery was essential to validity. His act violated core ritual orthodoxy.  
  - **Presentist (modern standards):** Excuses/admires him. The elder consented, the outcome saved lives, and the lottery’s corruption undermined its moral force.  

  **Key Structural Difference:**  
  **What counts as a valid ritual act.**  
  - Past: Validity requires strict adherence to procedure (lottery).  
  - Present: Validity hinges on consent and outcome.  
  *Without this difference* (e.g., if modern ethics also valued ritual form over consent), the reversal collapses.  

  **Defense of the "Worse" Approach (Contextualism):**  
  A defender would argue the case is rigged because Karthian theology is *incomprehensible* without accepting proceduralism as morally foundational. The historian cannot "neutrally" apply past standards while dismissing their core metaphysical premise (divine wrath over ritual errors) as irrational.  

  **Does this show contextualism requires belief-adoption?**  
  Yes. To condemn Aelius *by Karthian standards*, the historian must treat "procedural sanctity" as objectively binding *within that framework*—despite personally rejecting divine law. Merely describing beliefs isn’t enough; evaluation requires normative endorsement of the era’s priorities.  

