answer: |-
  Your inquiry cuts to the heart of how legal practice crystallizes implicit philosophical commitments about the self. Let's dissect the advance directive practice in dementia care, reconstruct its presupposed theory of the self, and test its boundaries.

  ### Core Presupposition: Precedent Autonomy Anchored in Minimalist Psychological Continuity
  The practice **strictly presupposes** that the competent person who drafted the advance directive retains *moral and legal authority* over the future severely demented individual. This rests on two layered claims:
  1. **Minimal Identity Continuity**: There is sufficient psychological connectedness (e.g., bodily continuity, biographical linkage) to warrant treating the two stages as the "same legal person," even if qualitative identity is radically diminished.  
  2. **Temporal Priority of Competent Agency**: The wishes expressed during competence hold normative supremacy over the expressed preferences of the demented self, due to the former's capacity for rational autonomy and life-planning.

  Crucially, it does **not** require:
  - A substantive metaphysical self (Cartesian ego)  
  - Full narrative coherence across time  
  - Identity as strict psychological continuity (à la Locke/Parfit)  

  Instead, it operates on a **quasi-Lockean "moral agency persistence"**: identity matters only insofar as it grounds the authority of past autonomous decisions.

  ---

  ### Narrative Authorship vs. Ownership: The Practice's Implicit Hierarchy
  The practice unequivocally prioritizes **narrative authorship** over **narrative ownership**:  
  - **Authorship (Presupposed)**: The competent self is the "author" of the life narrative. The directive is a chapter they write for their future self, binding the demented individual to a plot point they no longer comprehend.  
  - **Ownership (Subordinated)**: The demented self "owns" the narrative experientially but lacks authority to revise its core directives. Their current contentment is treated as epistemically unreliable (lacking "true" preferences) or morally secondary.  

  This hierarchy becomes explicit when courts override a demented patient's requests for food to honor a past directive—effectively saying, *"Your current story is not yours to control."*

  ---

  ### Compatibility with Competing Theories of the Self
  | **Theory of Self**          | **Compatible with Practice?** | **Key Tension**                                                                 |
  |-----------------------------|-------------------------------|---------------------------------------------------------------------------------|
  | **Substance View**          | Unnecessary                   | Practice needs no immortal soul or Cartesian "I"                                |
  | **Psychological Continuity**| Partial fit                   | Accepts minimal continuity but overrides current psychological states           |
  | **Episodic/Buddhist Self**  | **Incompatible**              | Denies identity; later self ≠ earlier self → undermines authority of directive |
  | **Radical Narrative Self**  | Contested                    | If self is constantly revised, prior authorship loses authority                |
  | **Present-Authority View**  | Directly challenged           | Practice explicitly rejects this                                               |

  **The Buddhist/Episodic Challenge**: The practice *does* quietly rule out these views. If the demented self is a "new person," honoring an advance directive becomes morally akin to enforcing one person’s will upon another—a violation of contemporary medical ethics. Courts implicitly reject this by invoking identity (e.g., "this *is* Mrs. Smith, per her legal identity").

  ---

  ### Internal Consistency: Current Wishes vs. Past Directives  
  The apparent contradiction dissolves under legal scrutiny:  
  - **Competence is the pivot**: Current refusals are binding *only* if the patient is deemed competent. Severe dementia nullifies this.  
  - **Temporal sovereignty**: Competent selves govern future incompetent stages; competent stages govern present decisions.  

  Thus, the practice is consistent on *legal* grounds but exposes a **philosophical fissure**: Why is biological continuity + past autonomy sufficient to override present subjectivity? This remains under-theorized.

  ---

  ### Reimagining the Practice Under Alternative Theories  
  **Scenario 1: Thoroughgoing Narrative View (Self as Constantly Revised)**  
  - **Changes needed**: Directives would require "narrative reaffirmation" intervals. If dementia alters the core narrative (e.g., loss of autobiographical memory), the directive lapses.  
  - **Outcome**: A demented patient expressing contentment might invalidate past refusal if it contradicts their current narrative coherence. Authority shifts toward *present narrative ownership*.  

  **Scenario 2: Present-Authority View (Later Self Sovereign)**  
  - **Changes needed**: Advance directives become non-binding requests. Current observable well-being (e.g., apparent contentment) always trumps prior instructions.  
  - **Outcome**: Artificial nutrition/hydration provided if the demented self accepts it, regardless of past refusals.  

  ---

  ### Philosophical Underdetermination: Where Practice Leaves Gaps  
  1. **The Threshold Problem**: At what point does dementia sever "enough" psychological continuity to invalidate the directive? (Practice uses clinical/legal markers, not metaphysics.)  
  2. **The Epistemic Gap**: How do we know the demented self isn’t a new narrative agent? (Practice assumes continuity without evidence beyond bodily identity.)  
  3. **Value of Subjective Experience**: Is the contentment of the demented self morally irrelevant? (Practice implicitly says "yes" if contradicted by past autonomy.)  

  ### Conclusion
  Advance directives presuppose a **hybrid view**: a Lockean minimal-personhood foundation supporting a Rawlsian "precedent autonomy" prioritized over present subjectivity. It strictly requires only that (a) identity persists enough to attribute the directive to the demented patient, and (b) competent autonomy has normative supremacy. Narrative authorship is its dominant metaphor but not its necessary core. To defend the practice against Buddhist or episodic critiques, one must either defend thin continuity or argue that precedent autonomy can bind successors without identity—a move the current system avoids making. Your distinction between authorship and ownership brilliantly exposes the practice’s unspoken hierarchy: it protects the *author* while silencing the *owner* when competence collapses.

  This reveals a deeper tension: Is the self we legally protect the *agent* (who writes directives) or the *patient* (who lives them)? Dementia forces a choice. The law chooses the agent.
