answer: |-
  ## Memorial Address: Sutter’s Bend Trailhead

  Friends, neighbors, members of the Cass Fork squad… nine years is a long time. And yet, standing here today, spring air thick with memory, it feels like yesterday the river roared over that road. I was the Incident Commander that night. What that means is simple: the choices were mine. The hardest of those choices is why we’re gathered here today.

  We remember Robert Adler. We remember him trapped in his car, on the phone, the water rising. We remember the four souls stranded on the roof of the feed store. And we remember the agonizing truth: we couldn’t reach them all in time. The last boat went to the roof. Robert Adler drowned.

  For nine years, I haven’t talked publicly about that choice. Not to reporters, not in detail. Turning away felt necessary. Every time I tried to write about it, the words twisted. They either begged for forgiveness or tried to build a fortress of reasons why it *had* to be that way. Neither felt true. Neither felt worthy of Robert, or of you, or of the weight of that night.

  I owe you something different today. Not an apology that rings hollow because I know, given the storm, the water, the time… I don’t know if a different choice was possible. Not a justification that pretends saving four lives somehow cancels out the loss of one, or claims it was a fair trade. It wasn’t a trade. It was a terrible, necessary choice made in the teeth of a flood.

  So what *can* I say? What feels true?

  Imagine standing on that rain-lashed bank, radio crackling, water surging. Imagine knowing someone is alone in a car, terrified. Knowing four others cling to a roof. Knowing you have one boat, one chance left. The question isn't theoretical: *Who do you try to reach?* Do you look only at the number? Four is more than one. That seems clear. But does that make the claim of those four together somehow *stronger*, somehow more *deserving* than the claim of the single man? Is his life worth less because he was alone?

  Here’s the hard thing I’ve wrestled with: No. I don’t believe it is. The value of Robert Adler’s life wasn’t diminished because he was outnumbered. The fear he felt, the hope he held onto talking to the dispatcher – that mattered just as much as the fear and hope shared by the four on the roof. Four beating hearts don’t make one beating heart count less. The loss felt by his parents, his brothers, all who loved him… that loss is immense and whole, not a fraction of a larger sum.

  So why send the boat to the roof? Not because four lives were *worth more* than one. Not because Robert Adler mattered less. But because, in that impossible moment, faced with two calls for help I couldn’t both answer, I had to choose. And choosing meant finding a way to break the tie. Looking at the numbers wasn’t about measuring worth; it was a way to make a decision when every other way felt like flipping a coin in the dark. It was a terrible necessity, not a moral calculation.

  That’s the brutal honesty of command in chaos: sometimes, you break the tie. You make the call. You live with it. We ask our emergency responders to carry that burden. We ask them to choose. We owe them, and the people affected by those choices, the honesty of admitting that burden exists, and that the reasons aren't always grand or satisfying. Sometimes, it's simply the best we could see to do in the storm.

  I know the county is considering a rule: in situations like this, go to the larger group first. I support that rule. Not because it means the larger group has a *greater right* to be saved – I don’t believe that’s true. But because we need clear ways to make impossible choices under crushing pressure. We need a shared understanding, a common starting point, so those making the call aren’t paralyzed by the very weight of the question in the seconds they have. It’s a tool for decision-making in the flood, not a statement about the value of human life. It’s a convention, an agreement on how we will act when we *must* act, knowing no convention can erase the loss when someone is left behind.

  To the four who lived: You carry a weight no one should bear. The question of "why me?" may never leave you, especially you, young one, stepping up to speak your truth today. I won’t answer that question for you; it’s yours to carry and yours to find meaning in. But hear this: Your lives are not an argument. They are a fact. A fact forged in a terrible night. Carry that fact forward. Live. Not because you *deserved* it more, but because you *have* it. Make the life you have count. That is the only answer the living can ever give to death. That is your task.

  To Robert’s parents, to his brothers: I made the call that left your son, your brother. I see the void that choice helped create. I see it every time I stand on this bank, every spring when the river runs high. Please know this, and know I mean it with everything I am: Robert Adler was not the price paid for four other lives. His life was not currency. His loss is not balanced by their survival. His life was singular, irreplaceable. His absence is its own unique, unbearable weight. Remembering him here, specifically, by name, for himself… that is what this stone is for. That is what matters. He mattered. He still matters. Nothing about that night changes that fundamental truth.

  We stand by this river today, nine years on. The water flows past, indifferent. We are not indifferent. We remember the terror, the courage of rescuers pushing into the dark, the fragility laid bare. We remember Robert Adler. We remember the four who came home. We hold the impossible tension of that night – the gratitude and the grief, the life and the loss, forever entwined.

  May this stone mark the place where memory lives. May it remind us of the weight of choices made in the storm. May it honor a life lost, and remind the living of the precious, precarious gift they carry. Thank you.

  ---

  **Notes for Speaker (Not for Delivery):**

  *   **Avoided Justification & Where:** Refused the "greater good/trade-off" narrative explicitly: "It wasn’t a trade" / "Robert Adler was not the price paid... His life was not currency." Rejected the implication that numbers reflect greater moral claim: "Four is more than one. That seems clear. But does that make the claim... somehow *stronger*...? Is his life worth less...? No. I don’t believe it is."
  *   **Avoided Justification & Where:** Refused "divine plan/fate" ("it was his time," "everything happens for a reason") by omission and focus on human choice/contingency ("terrible, necessary choice," "break the tie," "convention"). Directly honored the promise to the parents.
  *   **Avoided Platitude & Where:** Sidestepped the hollow "all lives are equally precious" by separating the *value* of life (affirmed Robert's singular worth) from the *decision procedure* (numbers as tie-breaker, convention). Avoided saying "it doesn't matter who was saved."
  *   **Supported Policy Without False Justification:** Framed the county rule ("go to larger group") explicitly *not* as recognizing a stronger claim, but as a necessary convention/decision-making tool ("shared understanding," "common starting point," "tool for decision-making," "convention, an agreement").
  *   **Gave Up (For Cohesion):**
      *   **Full Taurek Endorsement:** Couldn't fully embrace Taurek's "equal chance" ideal as the *only* fair procedure without undermining the county policy and potentially sounding callous to the survivors' reality. Framed the numbers choice as *a* way to break the tie, not necessarily *the* only fair way, but a necessary one *in that context* for decision.
      *   **Philosophical Nuance on "Obligatory/Forbidden":** Simplified the "not obligatory, but not forbidden" point into the practical reality of "breaking the tie" and the distinction between life's value and the decision method. Explicit academic framing was impossible per constraints.
      *   **Deep Dive on Survivor Guilt:** Left the profound question of "right to be alive" entirely to the 17-year-old's speech, offering only the directive to "live" and "make it count" without philosophizing.
  *   **Kept Parents & Four Together By:** Relentlessly separating Robert's unique, irreplaceable value from the fact of the four's survival. Explicitly denying any transactional relationship ("not the price," "not currency"). Affirming both the survivors' burden and their directive to live, *alongside* the parents' unique grief and Robert's singular worth. Making space for both realities in the same narrative without conflating them or making one contingent on the other.
