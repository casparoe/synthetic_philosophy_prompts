prompt: |-
  I am putting together a single fifty-minute session for a lunchtime seminar series that colleagues from across the university attend — two historians, an engineer, a couple of clinicians, a philosopher or two, nobody with any formal training in ethics. The subject is supererogation, and what I want from you is a plan for how to teach it rather than an exposition of it; I can do the reading myself. Assume an audience that is intelligent, sceptical and entirely new to the topic, and assume I have a whiteboard and no handouts.

  First, the order. Say what has to be in place before anything else can be said, and what depends on what. My own instinct is to open by pressing the thought that appears to make the concept impossible — that if an act is genuinely good, and I am able to do it, and there is nothing wrong with it, then surely I am required to do it — and only then to introduce the ordinary distinction and show how the pressure returns. Tell me whether that is the right first move or whether it belongs near the end, and why.

  Second, the case. I had intended to carry the whole session on a case of my own construction: a man who dives into a canal to pull out a drowning stranger, chiefly because a colleague whose good opinion he is anxious to keep is watching from the towpath. Tell me whether that case can bear the weight — whether it teaches the concept or quietly begs the question against it — and then specify what the carrying case must have and must lack. If it cannot carry the session, say what should, and say what disqualifies a candidate: too saintly, too rare, too obviously expensive, or one whose omission already strikes the audience as a wrong.

  Third, the misconceptions. I expect at least these: that "beyond the call of duty" is a matter of degree or expense — going the extra mile, doing more than one's share; that the supererogatory is simply the heroic and the dramatic; that if an act is good but its omission is not wrong, the act cannot really have been good, only pleasant; and the converse collapse, that the concept amounts to saying morality is optional. There will be others I have not foreseen. Give me the list in the order the audience will actually produce them, mark the point in the sequence at which each must be headed off, and say which one, left alone until the end, would poison the whole session.

  Fourth, the check. One question, or one small case put to the room in the final five minutes, that will show whether they have grasped the structure of the idea rather than merely acquired a taste for heroes. Say what a wrong answer would look like and what it would tell me.

  Fifth, what to refuse. Tell me what I should decline to settle in fifty minutes — the demandingness of morality, whether there is a duty to be heroic, the question of whether the agent's motive matters to the classification — and how to decline it out loud without leaving the impression that I am concealing something. I am also tempted to mention suberogation at the very end; say whether that will consolidate the idea or damage it.

  Two further decisions bear on the opening move, so I want your judgement on both. I am drawn to the etymology — the Latin root is a word for paying out over and above what is owed, the vocabulary of accounts rather than of heroism — and I suspect that opening there would plant the wrong picture from the first minute. And I am tempted to use the parable of the Good Samaritan as the framing illustration, but I am uneasy that the parable is standardly read as teaching that mercy is required rather than optional, which would make it the worst possible illustration for a concept that turns entirely on optionality.

  No reading list, please; I have one.

  Finally, tell me where this plan is most likely to be wrong: which step is the weakest link in the sequence, what the sharpest person in the room could say to derail it, and which consideration would lead you to replace the plan with a different one. End with a single line of the form \answer{...} containing one sentence that states the spine of the plan.
reasoning: |-
  Hmm, the user is planning a 50-minute seminar on supererogation for colleagues from various disciplines. They've provided detailed questions about how to structure this session effectively. Let me break down their queries systematically.

  First, they're asking about the order of presentation. Their instinct is to start with the apparent impossibility of supererogation - if something is good and doable, why isn't it obligatory? This seems pedagogically sound because it creates cognitive tension right away. I agree with this approach as it mirrors how the concept historically emerged from recognizing this tension in ethical systems. The paradox hooks interdisciplinary audiences effectively.

  For the case study, they've proposed one with problematic motivation (a man saving someone to impress a colleague). While psychologically realistic, this introduces motive complications prematurely. Better to start with a cleaner case of pure supererogation first. A modified version - say someone anonymously donating a kidney - would work better before introducing motivational complexities later.

  Regarding misconceptions, several need addressing: the degree fallacy (supererogation ≠ extreme sacrifice), the heroism conflation (it includes small acts too), the optionality misunderstanding (it's not that morality is optional but that some good acts exceed requirements), and the goodness collapse (supererogatory acts being good doesn't make them obligatory). The most dangerous misconception is that supererogation makes morality optional - this needs early correction.

  For the comprehension check, a simple case comparison works best - like contrasting returning a wallet (duty) with donating a kidney (supererogation). Wrong answers would conflate the two or misattribute motivation.

  There are several topics to explicitly table for later discussion: demandingness of morality, duties toward heroism, and motive's role in classification. These are important but would derail the foundational session. Suberogation should be avoided entirely - it introduces unnecessary complexity.

  Etymologically, starting with "payment beyond owed" risks economic reductionism. The Good Samaritan parable is problematic too - its standard reading emphasizes obligation, contradicting supererogation's optional nature. Better to use original cases.

  The weakest point might be the transition from the initial paradox to the solution. A sharp critic could argue that apparent supererogatory acts are actually disguised duties. Countering this requires emphasizing that duties have definable limits while supererogation operates beyond those boundaries.

  The core plan should be: Present the paradox → Define duty/supererogation via neutral cases → Expand with complex examples → Debunk misconceptions → Verify understanding.
answer: |-
  Here’s a focused, battle-tested plan for your seminar, structured to leverage scepticism and avoid common pitfalls:

  ### 1. **Order of Concepts**  
     **Start with the paradox** (your instinct is correct).  
     - **Minute 1-7:** Pose the opening challenge on the whiteboard:  
       *"If an act is (a) morally good, (b) I can do it, and (c) it causes no harm—why isn’t it required? What’s left for ‘beyond duty’ to mean?"*  
     - **Why this first?** The paradox creates productive tension. It forces the audience to confront the apparent *logical impossibility* of supererogation before introducing the concept. This primes sceptics to engage deeply when you resolve it.  
     - **Then introduce the distinction:** "Duty vs. Supererogation" (Minute 8-12). Define duty as *what is morally required* (omission = wrong). Supererogation as *good but not required* (omission = not wrong, yet praiseworthy).

  ### 2. **The Case Study**  
     **Reject your canal case for now; use a cleaner example first.**  
     - **Problem:** Your case smuggles in motive complications too early. If the rescuer acts for reputation, it risks conflating supererogation (about *status of the act*) with praiseworthiness (about *agent’s character*). Sceptics will pounce on motives.  
     - **Use this instead (Minute 12-20):**  
       *"Ana, a nurse, donates a kidney to a stranger. She isn’t related, faces moderate risk, and could refuse without blame. Is this required? Is it good?"*  
       → This isolates optionality/heroism without motive distractions.  
     - **Later, *add* your canal case (Minute 30-35):**  
       *"Now, Ben dives in to save a stranger *only* to impress a colleague. Is the act still supererogatory? What about Ben?"*  
       → Now it teaches: acts can be supererogatory *even if* the agent’s motives are flawed.  
     - **What a case MUST have:**  
       - Clear optionality (omission isn’t wrong)  
       - Significant cost/risk (to block "it’s just pleasant")  
       - Moral goodness independent of motive  
     - **What it MUST lack:**  
       - No prior obligation (e.g., not a parent saving their child)  
       - Not vanishingly rare (avoid "saintly" extremes)  

  ### 3. **Misconceptions & When to Crush Them**  
     Expect these objections **in this order** (based on teaching this):  
     1. **"It’s just doing *extra*"** (e.g., working late). → *Crush immediately* (Min 20-22): "Is working late *good*? Or just helpful? Supererogation requires moral significance."  
     2. **"It’s only big, heroic acts"** (e.g., saving lives). → *After defining* (Min 23-25): "Small acts can be supererogatory if costly *and* good (e.g., anonymously donating a large sum). Scale isn’t defining."  
     3. **"If omission isn’t wrong, the act can’t be *truly moral*"** → **POISON if left.** Address when resolving the paradox (Min 10-12): "Does ‘good’ always imply ‘required’? Consider thanking a colleague—good, but skipping it isn’t *wrong*. Morality has layers."  
     4. **"This makes morality optional!"** → *After introducing distinction* (Min 15-18): "No—duties still bind strictly. Supererogation is *beyond* the fence of duty, not a hole in it."  
     5. **"Isn’t this just subjective?"** → *During case discussion*: "The *status* (duty/supererogatory) is objective, even if motives vary."  

  ### 4. **The Check (Min 45-48)**  
     - **Pose:** *"Clara returns a lost wallet with $500. Diego donates $500 to a famine charity. Is either supererogatory? Why?"*  
     - **Right answer:** Returning wallet = duty (it’s owed). Donating = supererogatory (good but not owed).  
     - **Wrong answer:** "Both are duties" (collapses the distinction) or "Diego is just nicer" (focuses on character, not act status).  
     - **Tells you:** If they distinguish *types of moral reasons* (owed vs. elective good), they grasp the structure.  

  ### 5. **What to Refuse**  
     - **Decline explicitly:**  
       - *"Is morality too demanding?"* → "That’s a debate about the *scope* of duty, not supererogation."  
       - *"Do motives matter?"* → "Crucial for *praise*, but not for whether the act *is* supererogatory."  
       - *"Is there a duty to be heroic?"* → "Self-defeating! If required, it’s not supererogatory."  
     - **How:** "These are vital, but we’re mapping the *conceptual terrain* today. Without the core distinction, those debates misfire."  
     - **Suberogation?** **Reject.** Mentioning "bad but not wrong" (e.g., rude comments) will blur the lesson. It’s a mirror-image problem for another day.  

  ### On Etymology & Framing  
     - **Avoid etymology.** "Paying extra" implies duties are debts—which invites a slide into quantitative thinking ("how much extra?"). Start with the *logical* puzzle, not accounting.  
     - **Reject the Good Samaritan.** You’re right: its standard interpretation ("go and do likewise") frames mercy as obligatory. Use secular, contemporary cases to avoid theological baggage.  

  ### Weakest Link & Recovery  
     - **Weakest point:** Transition from paradox to distinction (Min 7-12). A sharp philosopher might say: *"If duties underdetermine the good, doesn’t that imply we *should* always do the best possible act?"*  
     - **Counter:** "Does morality demand *maximizing* good? Or does it set a baseline (duties) with room for *elective* goodness? Supererogation assumes the latter."  
     - **Abort if:** The group universally denies the paradox (e.g., "All good acts *are* required"). Then pivot to debating demandingness—but that’s unlikely with sceptics.  

  \answer{Introduce supererogation by weaponizing its apparent impossibility, define it against duty using a motive-neutral heroic case, dismantle misconceptions in the order they arise, and validate understanding with a duty/supererogatory contrast case.}
