  ### Aristotle's Ethics Market Simulation: Experiencing Money & Exchange

  #### **Learning Objectives**
  - Experience the **commensurability problem** in barter.
  - Understand money's emergence as a solution to barter, and its new problems (durability, use vs. exchange value).
  - Feel Aristotle's distinction between **exchange for need** (natural) and **acquisition for its own sake** (unnatural).

  ---

  ### **Setup & Materials**
  - **Participants**: 18 students (all act as producers/traders; 1 becomes Central Banker in Regime 3).
  - **Goods**: Six types of colored cards (A–F), each representing a good (e.g., wheat, tools).  
    - **Starting Allocation** (reset each regime):  
      - 3 students produce **A** (10 cards each), 3 produce **B** (10 cards), ..., 3 produce **F** (10 cards).  
      - **Needs**: Each student *needs* 3 specific goods they *don’t* produce (e.g., Producer A needs B, C, D).  
  - **Money Tokens**:  
    - **Perishable Unit (PU)**: Banana stickers (or paper slips labeled "PU") for Regime 2.  
    - **Durable Tokens (DT)**: Poker chips for Regime 3.  
  - **Payoffs**: Points tracked on paper (convertible to candy/extra credit).  
    - 10 points per needed good acquired.  
    - **Ritual Bonus**: 50 points for holding **one Good F** at the end of Regime 3.  

  ---

  ### **Regimes & Rules**  
  *(Total: 60 min activity / 15 min debrief)*  

  #### **1. Regime 1: Strict Barter (15 min)**  
  - **Rules**:  
    - Trade goods for goods only (no tokens).  
    - Trades require **direct exchange** (e.g., "I give you 1A for 1B").  
    - No credit or promises of future trades.  
  - **Goal**: Acquire 1 of each needed good.  
  - **Predictable Chaos**:  
    - Students struggle to find "double coincidence of wants."  
    - Some hoard goods, others can’t trade despite surplus.  
    - **Instructor Tip**: Push students to vocalize trades loudly to highlight matching failures.  

  #### **2. Regime 2: Perishable Unit (15 min)**  
  - **Rules**:  
    - Each student gets **5 PU** (banana stickers).  
    - **All goods must be priced in PU** (e.g., "1A = 2 PU").  
    - PU **expire** after 15 min and lose all value.  
    - Goods can be bought/sold for PU, but PU cannot be traded post-expiry.  
  - **Goal**: Acquire needed goods; PU are worthless if held too long.  
  - **Predictable Chaos**:  
    - Prices fluctuate wildly; students dump PU before expiry.  
    - Some refuse to accept PU (fearing spoilage), reverting to barter.  
    - **Instructor Tip**: Enforce pricing in PU; announce "1 minute left!" to trigger panic selling.  

  #### **3. Regime 3: Durable Token + Central Banker (20 min)**  
  - **Rules**:  
    - Each student gets **5 DT** (poker chips).  
    - **Good F is ritual-critical**: Students need 1 Good F at the end for 50 bonus points.  
    - **Central Banker (CB)**:  
      - Can mint new DT (unlimited supply).  
      - May buy/sell goods for DT to stabilize prices (optional).  
    - All trades require DT. Hoarding allowed.  
  - **Goal**: Acquire needed goods + hoard DT/Good F for points.  
  - **Predictable Chaos**:  
    - Hyperinflation (if CB mints recklessly) or liquidity crisis (if CB is strict).  
    - **Good F frenzy**: Traders sell F for DT, then scramble to repurchase it. Hoarders corner F.  
    - **Instructor Tip**: Secretly prompt CB to over-mint DT halfway through to spark inflation.  

  ---

  ### **Debrief (15 min)**  
  *Map student experiences to Aristotle’s arguments:*  

  1. **Regime 1 (Barter) → Commensurability Problem**:  
     - "Why was trading so hard?"  
     - **Aristotle**: Barter fails without a common measure (*NE V.5*). Goods lack inherent equality.  

  2. **Regime 2 (Perishable PU) → Money as Convention**:  
     - "Why did PU help or fail?"  
     - **Aristotle**: Money solves commensurability by social agreement (*NE V.5*), but perishability limits its store-of-value role.  

  3. **Regime 3 (Durable DT) → New Problems**:  
     - **DT Hoarding**: "Why did some collect DT beyond needs?"  
       - **Aristotle**: Money enables *unnatural acquisition* (wealth for its own sake, *Pol. I.9*).  
     - **Good F Tension**: "Why did selling F feel risky?"  
       - **Aristotle**: Goods have *use-value* (F for ritual) vs. *exchange-value* (F for DT) (*Pol. I.9*).  

  4. **Frank Gap**:  
     - **What the simulation misses**: Aristotle’s claim that money’s value rests on **social trust** (*nomos*), not just utility.  
     - **Supply this verbally**: "Money is a *social institution*—unlike DT, real money requires collective faith in its worth."  

  ---

  ### **Timeline**  
  | Phase          | Time  |  
  |----------------|-------|  
  | Setup          | 5 min |  
  | Regime 1       | 15 min|  
  | Regime 2       | 15 min|  
  | Regime 3       | 20 min|  
  | Tally Points   | 5 min |  
  | Debrief        | 15 min|  

  ---

  ### **Predictable Problems & Fixes**  
  - **Barter gridlock**: If no trades occur, secretly give 2 students matching needs to jumpstart activity.  
  - **PU rejection**: Confiscate goods traded without PU; award "bonus PU" to students using it correctly.  
  - **CB inaction**: Hand CB a script: "Mint 10 DT if prices rise >100%; buy F if supply drops."  
  - **Ritual-good hoarding**: Let shortages play out—students *feel* F’s use/exchange tension.  

  ---

  ### **Why This Works**  
  Students **live** Aristotle’s logic:  
  - Barter’s inefficiency → Money’s emergence → Hoarding/use-exchange conflicts.  
  By withholding theory until debrief, distinctions like "natural vs. unnatural acquisition" become visceral insights, not abstractions.
