  Ok, so I've been reading this popular philosophy-of-science book — I won't name it, it's the kind of thing that sells well in airport bookshops and also gets assigned in first-year courses — and the chapter on Quine has been bugging me for a week, and I can't quite put my finger on wether it's the chapter that's wrong or me. I did a couple of philosophy courses about fifteen years ago and I remember liking Quine, so I don't fully trust my instincts here. The author's summary of the "Two Dogmas" essay goes roughly like this (my words, not his):

  Quine's essay is what finally killed the analytic-synthetic distinction — the line Kant drew between truths that are true by their meanings alone and truths that are true because of how the world happens to be. Quine's argument is holism: no statement is ever tested against experience on its own, because when a prediction fails you can always rescue any statement you're attached to by changing something else in the system instead. So nothing is ever true purely in virtue of its meaning, and the distinction turns out to be not just hard to draw but empty — there are no analytic truths, full stop. Quine's own picture is of a single seamless web of belief with no joints or hierarchy in it: every belief is equally revisable, and the only reason to keep one rather than another is pragmatic — which belief is more convenient, which makes the system simpler. That's why he says even logic is up for grabs: he gives the example of dropping the law of excluded middle to make quantum mechanics simpler, and he says the same goes for mathematics, which is just another useful myth on all fours with Homer's gods. The chapter closes with the claim that Quine is the philosopher who ended the a priori — nothing is knowable independently of experience — and that this is why the essay is remembered as the moment the two dogmas turned out to be the same dogma, since analyticity just was the verificationist theory of meaning, so pulling out one nail pulled out the other.

  Something feels off, and I don't think it's only that the chapter is breezy. But I can't seperate out which parts are the sort of thing a lecturer would say with a shrug, and which parts would make someone who actually works on Quine wince. I can't go reread the essay right now, so I'd rather you do the audit.

  Please give me:

  - "Bottom line" — three or four sentences, your overall verdict on the chapter.
  - "What it gets right" — about 150 words.
  - "Claim by claim" — the main event, maybe 500–700 words, working through the summary in the order I gave it. For each bit, say what a specialist would nod at, what's the sort of simplification that's fine out loud but misleading in print, and what's just wrong. Where it's wrong, say what Quine actually holds instead, and flag anything the chapter gets right for the wrong reason.
  - "The positive picture" — around 200 words on what Quine's view actually is once the distortions are peeled off.
  - "Does the closing claim survive?" — 100–150 words on whether the chapter's punchline about the a priori, and about science being one myth among others, follows from anything true in its own summary, or is smuggled in.

  One thing to keep in mind: I'm fairly inclined to think the chapter is basically fair and that I'm just being pedantic, so push back on me if I'm giving the author too much credit — or tell me if I'm being too harsh.
