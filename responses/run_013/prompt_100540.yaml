  Okay, let me think through this carefully. The user is a novelist struggling with a philosophical problem about conflicting yet truthful perspectives. They describe a situation where two characters witness the same event and give incompatible accounts, but neither is lying or misremembering – each account reflects what they had reason to notice. The user rejects several existing frameworks: Rashomon effect (which they feel implies untrustworthiness), relativism (all accounts equally valid), and Hegelian synthesis (contradictions dissolving into higher unity).

  Hmm, the core issue seems to be about how partial perspectives can simultaneously hold validity without collapsing into subjectivism. The user wants to know: is there a term for this, and more importantly, how do legitimate standpoints organize into a cohesive whole? They specifically ask for British English terminology and a precise conceptual "carving".

  I recall several philosophical concepts that might fit:
  - Perspectivism (Nietzsche) - but often misunderstood as relativism
  - Standpoint epistemology (Harding) - focuses on marginalized perspectives
  - Phenomenology's "adumbration" (Husserl) - partial manifestations of objects
  - Nagel's "view from nowhere" problem
  - James' pluralism about truth

  But the closest match seems to be "aspectuality" – the idea that objects present different aspects to different observers, all constituting the whole. This avoids relativism by acknowledging each perspective's legitimacy is constrained by the actual object. The user's description mirrors this perfectly: "the truth is the two held together".

  For conceptual boundaries:
  - It's NOT about factual errors or bias
  - It IS about how position shapes access to aspects
  - Legitimacy comes from actual engagement with the phenomenon
  - The whole isn't a compromise but the sum of valid partial views

  The British spelling would be "aspectual realism" or simply "aspectuality". Since they asked for an established term and "aspectuality" has philosophical grounding without being jargon-heavy, that seems best. I'll structure the answer to first define the concept, contrast it with rejected frameworks, explain standpoint legitimacy, then conclude with the term.
answer: |-
  Your dilemma captures a profound epistemological problem: the **irreducible multiplicity of legitimate perspectives** on a single event, where each account is veridical *from its standpoint* yet incomplete when taken alone. This is not relativism, nor synthesis, but the recognition that reality presents different *aspects* to different observers based on situatedness. Philosophers offer several frameworks for this:

  1.  **Aspectuality (or Aspectual Realism):** Rooted in phenomenology (Husserl) and developed by thinkers like Roy Bhaskar, this holds that objects/events possess multiple *aspects* (ways of being perceived or understood). No single perspective captures all aspects. Legitimacy arises when a standpoint accesses a *real aspect* of the phenomenon, constrained by the observer's position, capacities, and interests. A standpoint isn't merely "opinion" if it genuinely engages with an actual facet of the event. The "whole truth" is the structured totality of all possible legitimate aspects – it *is* the event's manifold reality.

  2.  **Standpoint Epistemology (e.g., Sandra Harding):** While often applied to social position (gender, class), its core principle applies: knowledge is situated. A standpoint is *legitimate* (not arbitrary) when it emerges from a specific, engaged location within the phenomenon, revealing truths inaccessible from elsewhere. The "master standpoint" is rejected; the whole is constituted by the interplay of distinct situated knowledges.

  3.  **Perspectivism (Nietzschean, not Relativist):** Nietzsche argued that *all* knowing is perspectival, yet some perspectives are more *fruitful* or reveal more about the world than others based on their engagement with it. Legitimacy stems from the perspective's capacity to disclose features of reality, not from correspondence to a mythical "view from nowhere."

  **The "Carving": What It Is and Is Not**

  *   **What it IS:**
      *   **Ontologically Complex:** The event itself possesses multiple, real facets or dimensions.
      *   **Epistemologically Situated:** Access to these facets is inherently conditioned by the observer's physical position, cognitive framework, interests, history, and capacities.
      *   **Non-Additive:** The whole is not the sum of perspectives, nor a compromise. It's the structured reality *of which each perspective reveals a part*.
      *   **Truth-Aspecting:** Each account is "true" insofar as it faithfully reports the *aspect* accessible from that standpoint. It is "false" only if it claims comprehensiveness or denies the validity of other aspects.
      *   **Constraint-Based:** Legitimacy isn't arbitrary. A standpoint must be *answerable to the phenomenon*. It gains legitimacy through genuine engagement with the event, revealing features that exist independently of the observer (even if access is mediated). An account based on wilful ignorance, hallucination, or disengagement lacks legitimacy.

  *   **What it is NOT:**
      *   **Relativism:** Not all accounts are equally valid. An account ignoring central aspects due to bias or inattention is less legitimate than one engaging deeply. Truth remains tethered to the real structure of the event.
      *   **The Rashomon Effect:** While describing conflicting accounts, Rashomon often implies radical uncertainty or inherent deceit. Your case asserts *multiple veridicalities* arising from structure, not unreliability.
      *   **Hegelian Synthesis:** There is no sublation into a higher truth cancelling the contradictions. The contradictions *are* the structure; both perspectives remain valid and necessary.
      *   **Subjectivism:** The aspects revealed are features of the *event-in-its-context*, not merely projections of the observer's mind. The standpoint mediates access, but does not create the aspect.
      *   **Simple Partiality (like the Blind Men and Elephant):** This parable implies a single, simple underlying object misunderstood. Your event is inherently complex and multi-faceted; the perspectives reveal genuine, irreducible dimensions, not just sensory errors about a simple whole.

  **The Edges:** The phenomenon breaks down when:
  1.  Standpoints become solipsistic, denying any shared reality.
  2.  Accounts demonstrably misreport the aspect accessible from their position (e.g., factual errors *within* their frame).
  3.  The differences stem purely from internal bias distorting perception, rather than from a legitimate focus on different aspects.
  4.  The event lacks sufficient complexity to genuinely manifest multiple, irreducible aspects.

  **The Name:** While "Perspectivism" or "Standpoint Theory" are contenders, **Aspectuality** (or **Aspectual Realism**) most precisely captures the core idea: truth is found in the *aspects* revealed from legitimate standpoints, and the object/event *is* its manifold aspects. It emphasises the ontological grounding of the perspectives in the structure of the phenomenon itself. This is the established term within critical realism and certain phenomenological traditions that best fits your rigorous description.

  \answer{aspectuality}
