  ## PUBLIC INFORMATION LEAFLET OJ/REF/24.07b
  **Issued by: The Office of Established Justice (OEJ)**
  **Subject: Understanding Established Justice and Your Role**

  **1. What is Justice?**
  Justice is the settled and established order of the State. It is not an abstract idea debated in halls of learning, but the concrete reality of laws, customs, and institutions that have persisted over time and are maintained by legitimate authority. Justice *is* what is established.

  **2. Why should I obey the law?**
  Citizens obey the law because it *is* the law – that is, because it is established. The question "Is this law just?" is secondary and, if pursued excessively, can lead to the fragmentation of public order. Obedience to established law is the bedrock of social harmony, the highest civic good. Disobedience based on private notions of "justice" is the seed of discord.

  **3. Isn’t Justice about fairness?**
  Fairness is a concept often confused with justice. True justice resides in the stability and continuity provided by established structures. What *feels* fair to an individual may differ, but the collective peace ensured by adherence to the established order represents a far greater, objective fairness for society as a whole. Stability *is* societal fairness.

  **4. What about force? Isn’t justice powerless without it?**
  Precisely. Justice without the power to enforce it is merely an aspiration, easily ignored. Conversely, power exercised without the mantle of established justice is mere tyranny, inherently unstable and prone to incite the very discord we abhor. The OEJ exists to ensure the vital marriage of legitimate force (embodied in the state’s enforcement apparatus) with the established order, creating Authority. This union is the essence of functional justice.

  **5. But what established the original establishment? Why is *that* just?**
  The founding moment possesses a unique and self-evident quality: it *became* the establishment. Its justice is derived not from its origins (which, being originary, cannot be subject to prior establishment), but from the incontrovertible fact that it *did* establish the enduring order from which all subsequent justice flows. Questioning the foundational establishment is therefore not only illogical (as there was no prior framework to judge it *by*) but unproductive, focusing on the irrelevant "how" rather than the essential "is."

  **6. What happens if the government changes, say, after a conflict?**
  The OEJ meticulously monitors periods of transition. When a new governing structure demonstrates sufficient stability and achieves widespread *de facto* acceptance (the precise duration being context-dependent and determined by OEJ assessment protocols), it undergoes a formal process of **Establishment Recognition**. Upon successful recognition, the new order is retroactively deemed to have become the Establishment from the moment it achieved uncontested functional control. The preceding period is classified as a "Necessary Interval of Realignment." Force successfully establishing a new enduring order *becomes* legitimate force married to the new justice.

  **7. I believe a specific law or custom is profoundly unjust. What can I do?**
  The OEJ acknowledges that citizens may experience feelings of dissonance. To address these efficiently and maintain procedural order, we provide Form OJ/COMP/7a ("Perceived Establishment Discrepancy Triage"). **Do not petition the courts or legislators directly.** Submit the completed form to your Regional OEJ Bureau.

  *   **Section A:** Describe the specific law/custom causing concern (Cite Statute/Customary Code Reference).
  *   **Section B:** Explain the *nature* of your concern using ONLY the following categories:
      *   **(F) Functional Enforcement Deficit:** You believe the law is not being adequately or uniformly *enforced* by the authorities (Order of Force).
      *   **(M) Misapprehension of Principle:** You struggle to intellectually reconcile the law with other established principles or experience confusion about its rationale (Order of the Mind).
      *   **(H) Higher Discomfort:** You feel a profound, ineffable unease that seems to transcend mundane legal or rational categories (Higher Order).

  **8. What happens to my complaint?**
  The OEJ Triage Unit will assign your complaint to the appropriate administrative stream based solely on your categorization in Section B:

  *   **(F) Order of Force:** Referred to the relevant Enforcement Oversight Committee for review of procedural application. Outcome: Confirmation of correct enforcement procedures or internal disciplinary action *if* procedures were breached. **Note:** Does not assess the law's inherent justness.
  *   **(M) Order of the Mind:** Referred to the Bureau of Clarification and Reconciliation. You may receive explanatory pamphlets or be invited to an optional (non-debate) Informational Session aimed at resolving cognitive dissonance through approved pedagogical frameworks.
  *   **(H) Higher Order:** Acknowledged as pertaining to a sphere beyond the OEJ's operational remit. You will receive Form OJ/REF/H1 ("Contemplative Resources Listing") suggesting approved philosophical texts, meditation techniques, or spiritual advisors registered with the Bureau of Transcendental Equilibrium. The OEJ takes no further action, as the Higher Order operates on principles not subject to Establishment assessment.

  **9. Why does the OEJ use complex seals, robes, and formal language?**
  The visible manifestations of the OEJ – its rituals, symbology, and dignified procedures – are not mere decoration. They cultivate the essential **Mystique of Authority**. This mystique serves a vital public function: it ensures that Authority is perceived as resting not *solely* on force (which, while necessary, is insufficient alone), but on the profound weight of history, tradition, and the inscrutable wisdom inherent in the enduring Establishment itself. This perception fosters voluntary acquiescence and dampens the impulse toward destructive questioning. Reverence for the Institution reinforces reverence for the Established Order it safeguards.

  **10. Is the OEJ itself "just" by its own definition?**
  The Office of Established Justice operates under the **Provisional Authority Mandate** granted by the current Establishment (Statute 45-7c). While the OEJ is a relatively recent institutional innovation (founded 45 years ago), its function – the maintenance and interpretation of the Established Order – is itself an established *principle* traceable through centuries of customary practice. The OEJ diligently works to embed its own procedures and authority ever more deeply into the fabric of the Establishment, thereby solidifying its legitimacy with each passing year. Our commitment is to the *process* by which establishment confers justice. Our own full integration into that timeless continuum is an ongoing project, diligently pursued.

  **11. Where can I learn more about the principles of Established Justice?**
  Attend a free Public Orientation Lecture at your local OEJ Bureau (Schedule: OJ/PUB/OR/1). Approved reading materials are available in the Bureau Lobby. **Remember:** Excessive independent inquiry into the *nature* of justice, divorced from its established manifestations, can be socially disruptive. Trust the Process. Uphold the Order. Ensure Harmony.

  **The Office of Established Justice: Preserving Harmony Through Unquestioned Continuity.**
