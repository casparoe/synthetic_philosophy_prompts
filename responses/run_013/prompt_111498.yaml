prompt: |-
  ok so me and my labmate have been arguing for like five months about mechanistic anomaly detection and I think we just need to write the joint statement and be done with it. Background so the doc is anchored: we're building tools that flag when a model is doing something other than what we thought it was doing -- it sails through every behavioral eval, but the worry is that the internals are running a different process. The whole fight is about what "different process" even means.

  I'm the structural one. I say a mechanism is the actual causal-computational setup -- the parts and how theyre wired, the algorithm being run -- so two systems are running the same mechanism only if there's a structure-preserving map between their internal goings-on, and an anomaly is when that structure isn't the one you expected even though the outputs line up. She's the profile one. She says the mechanism just is its counterfactual profile: the input-output map together with how the outputs would change under interventions on the inputs (and on any internal variable you can actually intervene on). So two systems run the same mechanism exactly when they agree across the interventions that matter, and internal wiring that never shows up in any profile is not part of the mechanism at all, or at least not part of what we should care about.

  Write the joint statement we could both sign. I want: (1) numbered claims we both accept -- about what the detection problem even is, what an anomaly is an anomaly relative to (two systems? one system at two times? a system against a spec?), and whether "same mechanism" has to be relative to some chosen set of variables and interventions or whether there's a privileged level; (2) the disagreements, each stated twice, once in wording I'd put my name to and once in wording she would, so neither of us feels strawmanned; (3) the cruxes -- the sub-questions where settling one would actually move one of us; (4) for each crux, a case or argument we'd both agree is relevant to it, with both our predictions written down in advance.

  The cases I keep wanting us to settle: a net that learned the task by a generalizing algorithm vs one that memorized a lookup table, both agreeing on everything in the training distribution; the same computation reimplemented in completely different hardware; a model that latches onto a feature that's always present in training, so behavior alone can't tell it from the real thing; and a single system whose internal story drifts over training -- at what point did it become a different mechanism. Both of us should agree these bear on something, even if we disagree about what they show.

  Also: if part of our fight is just the two of us using "mechanism" in different senses, say which part and what the fix is. And flag any claim in the agreed section that sounds nice but is actually vacuous. Format it as a numbered agreed-claims section, then a table for the disagreements with columns for the question, my wording, her wording, the crux it turns on, the case we both accept, and each of our predictions.
reasoning: |-
  We are writing a joint statement to clarify our positions on mechanistic anomaly detection. We agree on the core problem: building tools to detect when a model's internal processes differ from what we expected, despite matching expected behavior on standard evaluations. However, we disagree on what constitutes "the same mechanism" and thus what counts as an anomaly.

  ## Agreed Claims

  1. **Definition of Mechanistic Anomaly Detection**: The goal is to detect when a model's internal processes (mechanism) differ from the expected mechanism while the model's behavior (input-output mappings) on the observed data distribution remains within acceptable bounds.

  2. **Anomaly Relative To**: An anomaly is always defined relative to an expected mechanism. This expectation can be derived from:
     - A specification (e.g., a formal description of the intended algorithm).
     - A reference system (e.g., a known system that implements the desired mechanism).
     - A prior state of the same system (e.g., before a change occurred).

  3. **Behavioral Agreement is Insufficient**: Both agree that behavioral agreement (on the training distribution or a fixed test set) does not guarantee that the internal mechanism is as expected. We must look beyond input-output pairs.

  4. **Interventionist Perspective**: We both agree that interventions (on inputs and internal states) are essential for probing the mechanism. However, we disagree on whether the set of interventions is exhaustive for defining the mechanism.

  5. **Level of Abstraction**: The question of "same mechanism" must be answered relative to a chosen level of abstraction (e.g., the choice of which internal variables to consider and which interventions to perform). There is no absolutely privileged level of description; the appropriate level depends on the context and goals.

  6. **Practicality of Detection**: Any detection method must be practically feasible. We cannot require interventions that are impossible to perform or observations that are infeasible to measure.

  7. **Relevance of Counterfactuals**: Both agree that counterfactual behavior (how the system would respond under interventions) is a crucial part of understanding the mechanism.

  ## Disagreements

  We now present our key disagreements. Each disagreement is stated from both perspectives, and we identify the crux and a shared case that bears on it.

  | Question | Structural Wording (My View) | Profile Wording (Her View) | Crux | Shared Case | Structural Prediction | Profile Prediction |
  |----------|------------------------------|----------------------------|------|------------|------------------------|-------------------|
  | What constitutes the mechanism? | A mechanism is the causal structure (parts and their causal connections) and the algorithm being executed. Two systems have the same mechanism if and only if there exists an isomorphism (structure-preserving map) between their internal states and transitions that respects the causal relationships. | A mechanism is defined by its counterfactual profile: the set of all possible input-output behaviors under all possible interventions (including on internal variables). Two systems have the same mechanism if and only if they exhibit identical counterfactual profiles for the set of interventions we care about. | Is there a distinction between the causal structure and the counterfactual profile? Can two systems with different causal structures have identical counterfactual profiles? | **Lookup Table vs. Generalizing Algorithm**: Two models: one implements a general algorithm (e.g., a learned circuit for adding numbers), the other is a lookup table that memorized the same outputs for the training distribution. Both behave identically on the training distribution. | The lookup table and the generalizing algorithm have different internal structures (one has a fixed table, the other has a computational circuit) and thus are different mechanisms. This is detectable by interventions outside the training distribution (e.g., new inputs) or by internal probes. | If the lookup table and the generalizing algorithm have identical counterfactual profiles (i.e., they respond the same to every intervention we can perform, including on internal variables), then they are the same mechanism. If they differ in their response to some intervention (e.g., on an internal state), then they are different. But if no intervention (including on internals) reveals a difference, then they are the same mechanism for our purposes. |
  | What is the status of unobservable internal structure? | Internal structure that is never revealed by any intervention is still part of the mechanism. If it causally contributes to the computation, it must be accounted for. A mechanism is more than just the profile; the structure matters. | If an internal structure (e.g., a set of wires) has no effect on the counterfactual profile (i.e., intervening to change it does not alter the output, and it is not used in any causal path), then it is not part of the mechanism. The mechanism is only what is causally relevant to the input-output behavior. | Can there be causally active internal structure that does not affect the counterfactual profile? | **Same Computation, Different Hardware**: Two systems: one implemented in silicon, the other in biological neurons. They run the same algorithm (same high-level code) but with different low-level implementations. | The low-level details (e.g., the physical substrate) are part of the mechanism. Even if the counterfactual profiles are identical at the behavioral level, the internal structure is different. Anomaly detection should flag this if we expected silicon. | The counterfactual profile is defined at the level of the variables we care about. If the two systems have the same counterfactual profile at the algorithmic level (e.g., they respond identically to interventions on the same set of high-level variables), then they have the same mechanism. The physical substrate is irrelevant if it doesn't affect the profile. |
  | Can two mechanisms have the same counterfactual profile? | Yes. Two different internal structures (e.g., a parallel vs. serial implementation) can produce the same counterfactual profile. This is a case of multiple realizability. An anomaly could occur if we expected one structure but got the other, even if the profile matches. | No. The counterfactual profile is the mechanism. If two systems have the same counterfactual profile (for all interventions we can perform and care about), then they are the same mechanism. Any internal differences are irrelevant. | Is the counterfactual profile exhaustive of the mechanism? | **Parallel vs. Serial Implementation**: Two systems compute the same function. One uses a parallel algorithm, the other a serial one. They have identical input-output behavior and respond identically to all interventions we can perform on the inputs and the internal states we can access. | These are different mechanisms because the internal causal structure differs (e.g., the parallel system has independent paths). This difference might become relevant in some scenarios (e.g., when introducing faults) but is not captured by the current profile. | If we cannot detect any difference by any intervention (including on internal states we can access), then they are the same mechanism. If we can detect a difference (e.g., by an intervention that disables one part and the other system behaves differently), then they are different. Otherwise, they are the same. |
  | When does a system become a different mechanism over time? | The mechanism changes when the internal causal structure changes (e.g., a rewiring) even if the counterfactual profile remains the same for the current distribution. The change might only become visible under new conditions. | The mechanism changes when the counterfactual profile changes (i.e., there is an intervention under which the system now behaves differently than before). If the profile hasn't changed, the mechanism hasn't changed. | Is a change in internal structure without a change in counterfactual profile a change in mechanism? | **Internal Drift**: During training, a model's internal representation of a feature shifts (e.g., from using a direct feature to a correlated one) without any change in behavior on the training distribution. | This is an anomaly because the internal causal structure has changed. The mechanism is now different, even though the behavior is the same. We should flag this. | Without a change in the counterfactual profile (on the training distribution and any other interventions we perform), the mechanism has not changed. We should not flag this as an anomaly. If the drift leads to a change under some intervention (e.g., a distribution shift), then it becomes an anomaly. |

  ## Cruxes and Cases

  We have identified the following cruxes and use the cases to test our positions:

  1. **Crux: Is the counterfactual profile exhaustive of the mechanism?**
     - Case: **Lookup Table vs. Generalizing Algorithm** (as above)
       - Structural Prediction: They are different mechanisms because of internal structure. We can detect this by interventions outside the training distribution (if allowed) or by inspecting internal states.
       - Profile Prediction: They are the same mechanism if their counterfactual profiles are identical (including on internal interventions). If they differ on an intervention (e.g., on a new input or an internal state), then they are different. Otherwise, they are the same.

  2. **Crux: Can there be causally active internal structure that does not affect the counterfactual profile?**
     - Case: **Same Computation, Different Hardware** (as above)
       - Structural Prediction: The hardware difference is part of the mechanism and should be flagged if we expected a specific implementation.
       - Profile Prediction: The hardware is irrelevant if it doesn't affect the counterfactual profile at the level of abstraction we care about.

  3. **Crux: Does a change in internal structure without a change in counterfactual profile constitute a mechanism change?**
     - Case: **Internal Drift** (as above)
       - Structural Prediction: Yes, it is a change and should be flagged.
       - Profile Prediction: No, unless the counterfactual profile changes.

  ## Linguistic Disagreement

  Part of our disagreement is terminological: we are using "mechanism" in different senses. 
  - The structural view uses "mechanism" to refer to the internal causal structure and implementation. 
  - The profile view uses "mechanism" to refer to the set of causal dependencies (the counterfactual profile) without commitment to internal structure beyond what is revealed by interventions.

  **Proposal**: We can avoid confusion by explicitly specifying the level of abstraction and the set of interventions when we talk about mechanisms. For example:
  - "The mechanism at the algorithmic level (with interventions on variables X, Y, Z) is the same."
  - "The mechanism at the physical level is different."

  ## Vacuous Agreement

  We note that Claim 5 ("Level of Abstraction") might be vacuous if we do not specify how to choose the level. However, we both agree that the level must be chosen based on practical and theoretical goals, and it is not vacuous because it forces explicit acknowledgment of the chosen granularity.

  ## Conclusion

  We agree on the problem and the need for intervention-based methods but disagree on the fundamental nature of mechanisms and what constitutes a difference. Our joint research will proceed by:
  1. Specifying the level of abstraction and set of interventions for each experiment.
  2. Using the cases above to test our detection methods and refine our theories.
  3. Reporting results in terms of both structural isomorphism and counterfactual profiles.

  Signed,

  [Your Name]
  [Her Name]
answer: |-
  ## Joint Statement on Mechanistic Anomaly Detection  

  ### 1. Agreed Claims  
  We both endorse the following statements about mechanistic anomaly detection:  
  1. **Core Problem**: Mechanistic anomaly detection flags when a model’s *internal computational process* meaningfully diverges from an expected process, despite matching behavioral outputs on the observed data distribution.  
  2. **Anomaly Relativity**: An anomaly is defined relative to an **expected reference** (e.g., a specification, a trusted system, or a prior state of the same system). It is not an absolute property.  
  3. **Behavioral Insufficiency**: Agreement on behavioral outputs (I/O mappings) is necessary but insufficient to confirm mechanistic alignment.  
  4. **Intervention Necessity**: Interventions (on inputs or accessible internal states) are essential tools for probing mechanisms.  
  5. **Level-Relative Identity**: "Same mechanism" is only definable relative to a **chosen set of variables and interventions**. There is no universally privileged level of description.  
  6. **Practical Detectability**: Detection methods must be feasible given constraints (e.g., accessible variables, intervention capabilities).  
  7. **Temporal Drift Relevance**: A system’s mechanism can change over time (e.g., during training), and detecting this drift is within scope.  
  8. **Case Relevance**: The cases below are valid tests for mechanistic divergence, regardless of interpretation.  

  **Flagged Vacuous Agreement**: Claim 5 ("level-relativity") risks circularity if the "chosen set" is arbitrary. We agree it must be grounded in goals (e.g., safety, interpretability).  

  ---

  ### 2. Disagreements  
  We diverge on the definition of "mechanism" and what constitutes a mechanistic anomaly. Below, each position is stated neutrally in both proponents’ terms.  
    

  | Question | Structural Wording ("My" View) | Profile Wording ("Her" View) | Crux | Shared Case | Structural Prediction | Profile Prediction |  
  |----------|-------------------------------|------------------------------|------|-------------|----------------------|-------------------|  
  | **What constitutes the mechanism?** | A mechanism is the causal-computational *structure*: the algorithm, parts, and their wiring. Identity requires a structure-preserving map (e.g., isomorphism) between systems. | A mechanism is defined by its *counterfactual profile*: I/O mappings plus responses to interventions on inputs/accessible states. Identity requires profile equivalence. | Does mechanism identity depend *only* on observable interventions? | **Lookup Table vs. Generalizing Algorithm**: Two models solve a task identically on the training distribution. One generalizes; one memorizes. | These are different mechanisms (structural divergence). Detectable via interventions on novel inputs or unused internal nodes. | Same mechanism if profiles match *for all feasible interventions*. No anomaly if differences are "invisible" to interventions. |  
  | **Can irrelevant structure define anomaly?** | Internal structure (e.g., unused circuitry) is part of the mechanism. Anomalies include structural deviations even if profiles match. | Only structure affecting the counterfactual profile is mechanism-relevant. "Silent" differences are ignorable. | Can structure exist without profile consequences? | **Same Algorithm, Different Hardware**: Identical computation on physically distinct substrates (e.g., CPU vs. neuromorphic chip). | Different mechanisms (structural misalignment). Anomaly if hardware violates expectations. | Same mechanism (profile equivalence). Hardware is irrelevant if interventions yield identical responses. |  
  | **What triggers anomaly during drift?** | Mechanism change occurs when internal structure meaningfully reconfigured, even if profiles remain stable. | Mechanism change occurs only when the profile changes detectably via interventions. | Does structural change *without* profile change constitute an anomaly? | **Feature Representation Drift**: A model shifts from using feature X to correlated feature Y during training. I/O unchanged. | Anomaly upon structural shift (e.g., at the epoch where weights rewire). Detectable via internal probes. | No anomaly until drift alters intervention responses (e.g., perturbing X now changes outputs). |  
  | **Is "expected mechanism" defined by spec or behavior?** | The expectation is a structural specification (e.g., causal graph). Anomaly: violation of spec, even if unobservable. | The expectation is a profile (e.g., I/O + intervention responses). Anomaly: deviation from *this profile*. | Can a spec be defined independently of interventions? | **Latched Feature Exploit**: Model uses spurious feature Z (always present in training) instead of true feature T. I/O matches. | Anomaly (structural deviation from spec). Detectable via interventions removing Z. | No anomaly if no intervention distinguishes Z from T. True anomaly only if Z causes divergent *behavior* under intervention. |  

  ---

  ### 3. Cruxes and Testing Cases  
  Settling these cruxes would resolve core disagreements. Both parties agree the cases below bear on the cruxes. Predictions are stated upfront.  

  | Crux | Shared Case | Structural Prediction | Profile Prediction |  
  |------|-------------|----------------------|-------------------|  
  | **Does mechanism identity require structural isomorphism?** | *Lookup Table vs. Generalizer*: Test generalization on OOD inputs. | Generalizer succeeds; lookup table fails → Confirms structural difference. | Both identical if interventions on training inputs match; OOD tests are beyond scope. |  
  | **Can interventions exhaustively define mechanisms?** | *Hardware Difference*: Introduce noise to internal components. | Noise affects systems differently (e.g., error rates diverge) → Confirms structural anomaly. | If responses to noise interventions match, systems are mechanistically identical. |  
  | **Is structural change sufficient for anomaly absent profile effects?** | *Feature Drift*: Intervene to perturb feature X/Y at different training stages. | Anomaly detectable *before* intervention responses change (e.g., via activation patterns). | Anomaly only detectable *when* interventions produce new input-output responses. |  
  | **Does a mechanistic spec require more than a profile?** | *Latched Feature*: Intervene to remove spurious feature Z at test time. | Model fails → Confirms anomaly (structural misuse of Z). | Model fails → Profile now diverges, confirming anomaly. *Prior* match meant no anomaly. |  

  ---

  ### 4. Linguistic Reconciliation  
  **Core Disagreement**: "Mechanism" is used in two distinct senses:  
  - **Structural sense**: Physical/computational implementation (e.g., "the circuit").  
  - **Profile sense**: Observable causal role (e.g., "the function").  

  **Proposal**: We adopt qualified terminology:  
  - **Structure-mechanism**: The implementation-level details.  
  - **Profile-mechanism**: The intervention-dependent behavior.  
  Anomaly claims must specify which is meant (e.g., "structural anomaly" vs. "profile anomaly").  

  ---  
  **Signed**,  
  [Your Name] (Structural Proponent)  
  [Her Name] (Profile Proponent)  

  ---  
  ### Appendix: Shared Testing Protocol  
  For transparency, we agree to jointly evaluate the cases above using:  
  - **Interventions**: Input corruptions, activation clamping, and component ablation.  
  - **Metrics**: Structural (e.g., parameter similarity, circuit topology) and profile (e.g., output divergence under interventions).  
  - **Anomaly Thresholds**: Defined relative to reference models/specs.
