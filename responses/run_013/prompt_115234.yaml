answer: |-
  ### Exam Question: Superrationality and Modified Prisoner's Dilemma  
  **Time Allocation:** 40 minutes  
  **Total Marks:** 20  

  Consider a symmetric simultaneous-move game with two players. Each chooses **C** (Cooperate) or **D** (Defect). Payoffs:  
  - Both **C**: Each gets **4**  
  - Both **D**: Each gets **2**  
  - One **D**, one **C**: **D**-player gets **6**, **C**-player gets **0**.  

  **Modification:** Before playing, each player is informed that with probability *p* (0 ≤ *p* ≤ 1), the opponent is their *algorithmic twin* (an agent who will make the identical choice they make). Otherwise (probability 1−*p*), the opponent is a *committed defector* (always plays **D**).  

  **Answer the following:**  
  1. **Standard Game Theory:** What do (a) dominance reasoning and (b) Nash equilibrium reasoning prescribe? Justify both answers. *(4 marks)*  
  2. **Superrationality:** What does the superrational argument prescribe? Name the key assumption that allows superrationality to recommend **C** despite **D** dominating in the standard game. *(4 marks)*  
  3. **Threshold Calculation:** Derive the critical probability *p* at which **C** becomes the optimal choice. Show the expected payoff calculations for choosing **C** and **D**. *(5 marks)*  
  4. **Critique:** Assess the objection: "Once (3) is done, superrationality reduces to ordinary expected utility maximization under correlated opponents." What must be true of the players for *p* = 1? Is this ever plausible? Defend whether superrationality offers a distinct principle of rationality. *(7 marks)*  

  ---

  ### Model Answer (≈700 words)  

  #### 1. Standard Game Theory  
  **(a) Dominance reasoning** prescribes playing **D**. **D** strictly dominates **C**:  
  - If the opponent plays **C**, playing **D** yields 6 > 4.  
  - If the opponent plays **D**, playing **D** yields 2 > 0.  
  Thus, **D** is always better regardless of the opponent’s choice.  

  **(b) Nash equilibrium reasoning** prescribes playing **D**. The only Nash equilibrium is (**D**, **D**):  
  - Given Player 2 plays **D**, Player 1’s best response is **D** (2 > 0).  
  - Mutual cooperation (**C**, **C**) is *not* Nash: if one player cooperates, the other can defect to get 6 > 4.  
  Dominance and Nash both lead to (**D**, **D**) and a payoff of 2.  

  #### 2. Superrationality Argument  
  Superrationality prescribes playing **C**. The key assumption is **indistinguishability**: each player must view themselves and their opponent as *identical rational agents*, such that their own choice logically determines the twin’s choice. If both players recognize they are twins (i.e., their algorithms and inputs are identical), they reason:  
  > "My twin will choose *exactly* what I choose. If I choose **C**, they choose **C**, giving me 4. If I choose **D**, they choose **D**, giving me 2. Thus, I should choose **C**."  

  This overrides dominance by treating the outcome as *dependent* on one’s own choice alone. The assumption licenses ignoring the possibility of unilateral defection since twins cannot "defect separately."  

  #### 3. Threshold Calculation  
  With probability *p*, the opponent is a twin (copies your choice); with probability 1−*p*, they are a defector (always **D**).  

  - **Expected payoff for playing C**:  
    - *p*: Twin copies → both play **C** → payoff = 4.  
    - 1−*p*: Opponent defects → you get 0.  
    ∴ *E[C]* = 4*p* + 0*(1−*p*) = **4p**.  

  - **Expected payoff for playing D**:  
    - *p*: Twin copies → both play **D** → payoff = 2.  
    - 1−*p*: Opponent defects → both **D** → payoff = 2.  
    ∴ *E[D]* = 2*p* + 2*(1−*p*) = **2**.  

  **C** is optimal when *E[C]* > *E[D]*:  
  > 4p > 2  
  > p > **0.5**.  

  At *p* = 0.5, both choices yield equal expected payoff (2). For *p* > 0.5, **C** maximizes expected utility.  

  #### 4. Critique and Defense  
  The objection claims superrationality reduces to **ordinary expected utility maximization** (EU) with a correlated opponent. When *p* < 1, the calculation *is* EU maximization: we weigh outcomes based on empirical uncertainty about the opponent’s type. However, this conflates two distinct ideas:  
  - **EU with correlation** (empirical): *p* reflects a *contingent fact* about the opponent’s type (e.g., "twins exist in 60% of cases").  
  - **Superrationality** (normative): *p* = 1 is a *logical necessity* under indistinguishability. If players are truly identical (same algorithm, same inputs), they *must* make the same choice. Here, choosing **C** is not a bet on correlation—it is dictated by rationality itself.  

  **For *p* = 1**: Players must be **ontologically identical** (e.g., deterministic clones with identical decision algorithms and information). This is plausible in highly controlled settings (e.g., identical AI agents) but rarely in humans due to subjective differences.  

  **Is superrationality distinct?**  
  - **Reductionist view (objection)**: At *p* < 1, superrationality *is* EU maximization.  
  - **Defense**: At *p* = 1, superrationality demands **C** as a unique rational act, while standard EU would still allow **D** if players are "causal" agents (e.g., causal decision theory ignores acausal correlation). Superrationality’s core claim—that identical agents *cannot* rationally defect—remains a non-empirical principle. It fails only if indistinguishability is metaphysically impossible, but this is a feature, not a bug: it defines a boundary of rational cooperation.  

  Thus, superrationality offers a distinct *normative* principle for perfectly symmetric agents, while the *p*-threshold shows how it generalizes to imperfect cases.  

  ---

  ### Marking Scheme (Total: 20)  
  | **Part** | **Marks** | **Key Requirements**                                                                 | **Common Errors (Costs 1-2 marks each)**                                |  
  |----------|-----------|--------------------------------------------------------------------------------------|-------------------------------------------------------------------------|  
  | **1a**   | 2         | - Correct dominance: **D** strictly dominates. <br> - Clear justification (6>4, 2>0). | - Omits strict dominance. <br> - Fails to compare payoffs conditionally. |  
  | **1b**   | 2         | - Identifies (**D**, **D**) as only Nash. <br> - Explains why (**C**, **C**) isn’t Nash. | - Claims (**C**, **C**) is Nash. <br> - Misstates best responses.      |  
  | **2**    | 4         | - Prescribes **C**. <br> - Names "indistinguishability" (or "identical agency"). <br> - Explains reasoning: own choice determines twin’s. | - Vague on assumption ("trust," "reciprocity"). <br> - Omits why dominance is overridden. |  
  | **3**    | 5         | - Correct *E[C]* = **4p**; *E[D]* = **2**. <br> - Sets inequality: **4p > 2**. <br> - Solution: **p > 0.5**. | - Wrong *E[D]* (e.g., 6 for D vs defector). <br> - Algebra errors. <br> - Ignores twin copying **D**. |  
  | **4**    | 7         | - **Reduction (2 marks)**: Notes EU maximization for *p* < 1. <br> - **p=1 condition (2 marks)**: Ontological identity (deterministic clones). <br> - **Distinctness (3 marks)**: Contrasts normative vs. empirical; defends *p*=1 case against CDT. <br> - **Plausibility (1 mark)**: Possible in theory (e.g., AIs), rare in humans. | - Assumes p=1 is "perfect correlation." <br> - Claims superrationality = Bayesian updating. <br> - Fails to engage with causality. |  

  **Merely competent answers** (12-14/20):  
  - **Part 1**: Correctly states dominance/Nash but undersells justification.  
  - **Part 2**: Names "C" but vague on assumption (e.g., "they think alike").  
  - **Part 3**: Derives *E[C]* correctly but errs in *E[D]* (e.g., assumes D gets 6 vs defector).  
  - **Part 4**: Accepts reduction without addressing *p*=1’s normative uniqueness.  

  **Top answers** (18-20/20):  
  - Part 4 explicitly distinguishes *acausal correlation* (superrationality) from *causal agency* (standard EU).  
  - Uses terms like "ontological identity," "normative principle," or "acausal decision theory."
