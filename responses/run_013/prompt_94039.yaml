prompt: |-
  I spent thirty years at the bench in experimental physiology before turning to philosophy, and I keep finding that discussions of the readiness potential presuppose a standard of adequacy that no one bothers to state. Before I read any more, write me that specification: what any adequate account of the relation between conscious intention and the neural preparation for action has to deliver. Give me, with the consideration behind each, the phenomena it must accommodate -- a readiness potential that precedes the subject's reported awareness of the urge to move; the human capacity to cancel an incipient movement, and the question of what neural activity accompanies the cancellation; the demonstrated unreliability of introspective reports about when an intention formed; and the suspicion current among working neuroscientists that the averaged readiness potential is partly an artifact of filtering and averaging and may reflect a slow stochastic accumulation rather than a specific motor command. Give me the distinctions it must not collapse -- predicting a movement versus constituting a decision, the timing of an intention versus the timing of its neural precursor, freedom as absence of external constraint versus freedom as ultimate authorship, and a cause of behavior versus a reason for it. And give me the constraints it cannot contradict -- that single-trial prediction is far weaker than averaged prediction, and that the subject's report is itself a behavior with a neural cause. Tell me which of these are genuine desiderata and which are the prejudices of one camp, flag any pair that cannot be jointly satisfied, and name the single requirement that eliminates the most candidate theories. No reading list and no scorecard of individual authors; I want the criteria themselves. End with one sentence beginning "Bottom line:" that states the requirement you would refuse to give up.
reasoning: |-
  Okay, the user is a former experimental physiologist with 30 years of experience who's moved into philosophy. They're frustrated with discussions about the readiness potential (RP) because they feel there's an unstated standard of adequacy that nobody articulates. They want a clear specification of what any adequate account of the relationship between conscious intention and neural preparation for action must deliver.

  First, I need to unpack their request. They want several components: phenomena to accommodate, distinctions to maintain, constraints to respect, and an evaluation of which are genuine desiderata versus biases. They also want to know if any pairs conflict and which requirement is the most stringent.

  Let me start with the phenomena. The user listed four key points: RP precedes reported awareness, the ability to cancel movements (veto power), unreliability of introspective timing, and skepticism about RP as an artifact. Each of these is backed by empirical studies, like Libet's experiments for the first and third, and more recent critiques on signal processing for the last one. The veto phenomenon comes from experiments where subjects can stop an action after RP onset but before movement. The introspective unreliability is well-documented in psychology. The artifact concern relates to how averaging might misrepresent single-trial neural activity.

  Next, distinctions to avoid collapsing. Predicting vs. constituting a decision addresses whether RP is a precursor or the decision itself. Timing distinctions are crucial to avoid conflating neural precursors with conscious experiences. Freedom as constraint vs. authorship touches on philosophical debates around free will. Cause vs. reason highlights the difference between mechanistic explanations and intentionality.

  Constraints include weak single-trial prediction, meaning RP isn't deterministic at the individual level. The subject's report as neural behavior emphasizes that verbal reports are also produced by the brain, so they're not infallible.

  Now, evaluating which are genuine desiderata. Most phenomena and constraints are based on empirical evidence, so they're non-negotiable. The skepticism about RP being an artifact is a current debate, so it's a valid concern but not settled. Among distinctions, freedom as authorship might be more philosophical and could be contested, though it's important for some theories. Cause vs. reason is a fundamental philosophical divide, so it's necessary to maintain.

  Checking for conflicts. The main tension is between RP preceding awareness and the veto power. If RP is the neural decision, how can it be consciously canceled? This points to a need for a model where RP isn't the irrevocable command. Also, the reliability of reports vs. their neural basis: if reports are behaviors with neural causes, their accuracy is questionable, which complicates using them to time intentions.

  The single requirement that eliminates most theories: Subject's report as neural behavior. If an account can't explain how reports themselves are generated by neural processes without assuming privileged access, it fails. Many theories might treat conscious reports as directly authoritative, but this constraint forces acknowledgment that they're part of the causal chain.

  Bottom line: The key requirement is that conscious intention must be integrated into the causal structure of the brain without assuming any non-physical causation. This ensures the account remains naturalistic, respecting neuroscience while addressing philosophical issues.
answer: |-
  Here is the specification you demand, distilled from phenomena, distinctions, constraints, and their epistemic status. No platitudes, no citations—just criteria.

  ### I. Phenomena Any Account Must Accommodate (with Rationale)
  1. **RP Temporal Priority**: The readiness potential (RP) onset precedes the subject's reported conscious intention (W-time) by ~300-500ms.  
     *Rationale: Empirical bedrock (Libet-type paradigms); challenges notions of conscious volition as initiator.*  
  2. **Veto Capacity**: Humans can abort initiated actions after RP onset but before movement execution.  
     *Rationale: Demonstrates decoupling of early motor preparation from final commitment; critical for debates on agency.*  
  3. **Introspective Unreliability**: Subjective reports of intention timing are inconsistent and manipulable.  
     *Rationale: Robust experimental evidence (e.g., confabulation in W-time estimation); undermines reliance on phenomenology as data.*  
  4. **RP as Potential Artifact**: The averaged RP may reflect stochastic noise, filtering artifacts, or domain-general neural dynamics rather than a specific motor command.  
     *Rationale: Single-trial variability; critiques from signal processing and neural noise models (e.g., Schurger et al.).*  

  ### II. Distinctions Any Account Must Preserve
  1. **Prediction vs. Constitution**: Neural precursors *predict* actions but do not necessarily *constitute* the decision.  
     *Rationale: Avoiding conflation of correlation with causation in volition.*  
  2. **Neural Precursor vs. Conscious Intention**: The *timing* of unconscious neural activity ≠ *timing* of conscious awareness.  
     *Rationale: Rejects simplistic "consciousness causes action" models.*  
  3. **External Freedom vs. Authorship**: Freedom from coercion (compatibilist) vs. "ultimate authorship" (libertarian).  
     *Rationale: Prevents smuggling metaphysical assumptions into neuroscience.*  
  4. **Cause vs. Reason**: Neural *causes* of movement vs. intentional *reasons* for acting.  
     *Rationale: Upholds explanatory autonomy for psychology.*  

  ### III. Constraints Any Account Cannot Violate
  1. **Single-Trial Prediction Weakness**: RP predicts actions robustly at the group level but unreliably in single trials.  
     *Rationale: Empirical limitation; undermines determinist overinterpretations.*  
  2. **Report as Neural Behavior**: The subject's introspective report is itself a behavior produced by neural mechanisms.  
     *Rationale: Inescapable consequence of neural causation; denies privileged access.*  

  ### IV. Evaluation of Desiderata vs. Prejudices
  - **Genuine Desiderata (Non-Negotiable)**:  
    RP temporal priority, veto capacity, introspective unreliability, single-trial prediction weakness, report as neural behavior.  
    *Rationale: Empirically grounded; replicable across labs.*  
  - **Potential Prejudices (Contentious)**:  
    "RP as artifact" (reflects methodological skepticism but not settled), "ultimate authorship" (philosophical preference without empirical basis).  
  - **Incompatible Pair**:  
    *Veto capacity* and *RP as specific motor command* conflict if RP is characterized as an irrevocable motor signal. Resolution requires decoupling preparation (RP) from permission (conscious veto).  

  ### V. The Eliminator Requirement
  **"Subject's report as neural behavior"** eliminates the most candidate theories. Accounts that treat conscious intention as an uncaused cause (e.g., dualist or strong libertarian models) or those using introspection as uncontested data (e.g., some phenomenologies) cannot satisfy this. It forces acknowledgment that *all* mental events, including reports of intention, are embedded in causal neural chains.  

  ### Bottom line:  
  **Any adequate account must situate conscious intention as an integrated component within the causal architecture of the brain, not as an exogenous trigger or epistemically privileged narrator.**
