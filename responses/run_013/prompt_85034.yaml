prompt: |-
  I am drafting a position statement on skill and knowledge to circulate before a workshop, and I should like it audited before anyone else sees it. Please take the role of a philosopher of mind and action who works on the epistemology of skill and who knows the intellectualism debate in detail. Think carefully before you commit to a verdict, and begin by restating my position in your own words and noting anything you find ambiguous, so that I can see how you have read me. I do not need a reading list or attributions — I want the arguments worked out from the commitments as I have stated them.

  Here is where I have landed.

  1. Knowing how to do something is a species of propositional knowledge. To know how to F is to know that such-and-such is a way for one to F; I take this to be the correct account of the ascriptions themselves, not a reconstruction of them.

  2. I reject the idea that the proposition known in a case of know-how is a special, practical proposition, or that it is grasped under a distinctive practical mode of presentation which the instructor who can only describe the stroke lacks. The content is ordinary, and so is the attitude taken towards it.

  3. Skilled performance is largely unreflective. The expert does not consult representations as she goes, and the familiar findings about automaticity and the chunking of action sequences show that guidance by explicit content drops out as skill is acquired.

  4. Know-how ascriptions are gradable and context-sensitive in a way that knowledge ascriptions are not. "She knows how to play the piano" admits of degrees, and whether someone counts as knowing how to do something shifts with what is being asked of her and with the standards in play.

  5. Know-how cannot be acquired from testimony alone. One can be told, exhaustively and accurately, how to do something and still not know how to do it; practice is indispensable.

  6. Ability and know-how come apart in both directions. A skier who cannot say what she does need not know how to ski, while an instructor who cannot ski at all may nonetheless know how to.

  Now: which of these pull against one another, and how badly? I should like the genuine tensions ranked by severity, each with an account of what would have to give and what that would cost me; the pairs that only look as though they are in tension, with an explanation of why they are not; and, at the end, your judgement as to which single revision would clean up the most. I should also like to know which of my commitments you would want to press me on even if it is not strictly inconsistent with the others.
reasoning: |-
  Okay, the user is drafting a position statement on skill and knowledge and wants me to act as a philosopher of mind specializing in epistemology of skill. They've presented six clear theses and want me to audit them for internal consistency, ranking tensions by severity.

  First, I need to fully understand their position. Thesis 1 is a strong intellectualist claim - know-how is propositional knowledge ("knowing that such-and-such is a way to F"). Thesis 2 doubles down by rejecting any special practical content or mode of presentation. The content is ordinary propositional content. 

  But then thesis 3 describes skilled performance as unreflective and non-representational, which seems at odds with 1 and 2. If know-how is propositional knowledge, why doesn't skilled performance involve consulting that knowledge? The user acknowledges this tension but maintains both positions.

  Thesis 4 notes that know-how ascriptions are gradable and context-sensitive unlike standard knowledge ascriptions. This creates another challenge for equating know-how with propositional knowledge. 

  Thesis 5 states know-how can't be acquired from testimony alone - practice is needed. This contradicts standard views of propositional knowledge which can be acquired through testimony. 

  Thesis 6 claims ability and know-how can come apart in both directions - an expert performer might lack know-how while an instructor might possess know-how without ability. This further distinguishes know-how from both ability and straightforward propositional knowledge.

  The most severe tension is between the intellectualist claims (1-2) and the embodied nature of skill (3). The user might resolve this by arguing that propositional knowledge becomes proceduralized and automatic, but this needs careful development. 

  The second major tension is between intellectualism (1) and the gradability of know-how (4). Propositional knowledge isn't typically gradable in the same way. The user could appeal to context-sensitivity in knowledge standards but must explain why know-how is more context-dependent.

  Testimony issues (5) present another challenge. If know-how is propositional knowledge, why can't it be acquired through testimony? The user must explain why practice is necessary even for propositional knowledge.

  The ability/know-how distinction (6) is actually consistent with intellectualism but requires defending why propositional knowledge doesn't always yield ability.

  I think the most impactful revision would be to soften thesis 1 to allow that know-how might involve both propositional knowledge and embodied capacities. This would resolve many tensions while maintaining core intellectualist insights. The user should also clarify the relationship between propositional knowledge and automatic performance in thesis 3.

  The user seems well-versed in this debate and wants rigorous analysis without citations. They're likely preparing for academic discussion and need to anticipate objections. I'll focus on logical tensions while respecting their expertise.
answer: |-
  ### Restatement of Your Position  
  I understand your core theses as follows:  

  1. **Intellectualism about Know-How**: *Knowing how to F* is identical to *knowing that w is a way for one to F* (where *w* is a method/technique). This is a direct semantic claim about the truth conditions of "know-how" ascriptions, not a reduction.  
  2. **Anti-Exceptionalism about Content**: The proposition known (*that w is a way to F*) has no special "practical" content or mode of presentation. It is ordinary propositional content grasped via a standard cognitive attitude.  
  3. **Automaticity of Skill**: Skilled performance is largely automatic and non-representational; explicit propositional guidance fades with expertise.  
  4. **Gradability & Context-Sensitivity**: Know-how ascriptions admit degrees and shift with context/stakes (unlike standard propositional knowledge).  
  5. **Testimony Insufficiency**: Know-how cannot be acquired *solely* through testimony; practice is necessary.  
  6. **Ability/Know-How Divergence**: Ability (physical capacity) and know-how (propositional knowledge) are mutually separable: an expert performer may lack know-how, and a non-performer (e.g., an instructor) may possess it.  

  ### Ambiguities & Clarification Points  
  - **Thesis 1**: Does "such-and-such is a way" require *awareness* of the proposition, or could it be tacit? Your rejection of "practical modes" (Thesis 2) suggests awareness is required.  
  - **Thesis 3**: Does "guidance by explicit content drops out" imply that propositions become *irrelevant* to performance, or merely *non-conscious*?  
  - **Thesis 4**: Is gradability (e.g., "knows *fairly well* how to play") inherent to the knowledge itself, or a feature of how we *ascribe* it?  
  - **Thesis 6**: When the skier "cannot say what she does," does this imply she lacks *access* to the proposition, or that she lacks the proposition altogether?  

  ---

  ### Tensions Ranked by Severity  
  **#1: Tension between Thesis 1–2 (Intellectualism) and Thesis 3 (Automaticity)**  
  - **Conflict**: If know-how *is* propositional knowledge (1–2), why does skilled action *not* involve consulting propositions (3)? Intellectualism typically ties knowledge to action-guidance, but you concede guidance is non-propositional in experts.  
  - **What Must Give**: Thesis 3 forces a concession: the proposition known is *not what guides action* in expertise. This risks decoupling know-how from performance, making it inert.  
  - **Cost**: Weakens intellectualism’s core motivation (explaining action-guidance). Raises the question: *What role does the proposition play in skilled action if not guiding it?*  

  **#2: Tension between Thesis 1 (Intellectualism) and Thesis 4 (Gradability)**  
  - **Conflict**: Propositional knowledge (e.g., "I know that Paris is the capital of France") is traditionally binary (true/false) and context-invariant. Know-how’s gradability (4) suggests it behaves differently.  
  - **What Must Give**: Either (a) Thesis 4 must be reined in (gradability stems from pragmatic factors, not the knowledge itself), or (b) Thesis 1 must allow propositions to be "known to degrees" (which strains standard epistemology).  
  - **Cost**: Option (a) risks ad hoc maneuvering; option (b) requires overhauling standard conceptions of propositional knowledge.  

  **#3: Tension between Thesis 1–2 (Intellectualism) and Thesis 5 (Testimony Insufficiency)**  
  - **Conflict**: Standard propositional knowledge *can* be acquired via testimony (e.g., I learn *that* Tokyo is populous from a reliable source). If know-how is propositional knowledge, why can’t it?  
  - **What Must Give**: Thesis 5 implies the proposition *that w is a way to F* cannot be known *solely* by testimony. This demands an explanation: e.g., knowing this proposition *requires* embodied practice to grasp its content.  
  - **Cost**: Thesis 2 (anti-exceptionalism) is pressured. If the proposition *that w is a way to F* requires practice to grasp, it *is* exceptional content.  

  **#4: Tension between Thesis 1–2 and Thesis 6 (Divergence)**  
  - **Conflict**: If know-how *is* propositional knowledge (1), how can an expert performer (e.g., the skier) lack it? Conversely, if the instructor knows the proposition, why can’t they ski?  
  - **What Must Give**: Thesis 6 requires that knowing *that w is a way to F* does not entail ability (which intellectualists like Stanley & Williamson accept). But the inverse (ability without know-how) is harder: if the skier performs expertly, how can she *fail* to know *that* her actions constitute a way to ski?  
  - **Cost**: Defending "ability without know-how" may require positing *tacit* knowledge (threatening Thesis 2) or redefining "way" (threatening Thesis 1).  

  ---

  ### Apparent (but Resolvable) Tensions  
  **Thesis 3 (Automaticity) vs. Thesis 1 (Intellectualism)**  
  - **Why Unproblematic**: Intellectualism need not claim that propositions *consciously* guide action. Propositions can be encoded in motor routines (e.g., via procedural memory). Thesis 3 describes *how* skill manifests, not *what know-how is*.  
  - **Resolution**: The expert’s automaticity *results from* prior internalization of the proposition. No contradiction.  

  **Thesis 6 (Divergence) vs. Thesis 5 (Testimony Insufficiency)**  
  - **Why Unproblematic**: The instructor (who knows propositions but can’t perform) illustrates Thesis 5: they acquired propositions *from testimony* but lack practice. The skier (who performs but "cannot say") may have tacit propositional knowledge.  
  - **Resolution**: Both cases reinforce that propositional knowledge ≠ ability.  

  ---

  ### Most Impactful Revision  
  **Revise Thesis 1 to Allow Tacit/Implicit Propositional Knowledge**  
  - **Why**: This resolves the severest tensions:  
    - With **Thesis 3**: Automatic skill can be guided by *implicit* propositions (e.g., motor representations with truth-conditions).  
    - With **Thesis 6**: The skier’s ability *without* verbal articulation becomes compatible with *tacit* know-how.  
    - With **Thesis 4**: Gradability could reflect degrees of fluency in accessing/implicitly wielding propositions.  
  - **Cost**: Weakens anti-exceptionalism (Thesis 2). Tacit knowledge may require a "practical mode of presentation," threatening your rejection of it. But it preserves intellectualism’s core.  

  ---

  ### Commitments to Press (Even Without Strict Inconsistency)  
  **Thesis 2 (Anti-Exceptionalism)**  
  - **Why Press**: If know-how is ordinary propositional knowledge, why can’t we *fully* articulate it (Thesis 3)? Why does its acquisition *require* practice (Thesis 5)? Ordinary propositions (e.g., "2+2=4") don’t require sensorimotor engagement. You need an account of *why* "that *w* is a way to F" is uniquely resistant to testimony and reliant on embodiment.  

  **Thesis 3 (Automaticity)**  
  - **Why Press**: If skill *isn’t* guided by propositions, what *does* guide it? If you say "dispositions," this risks conceding to anti-intellectualism. If you say "propositions, but implicitly," clarify how this differs from a "practical mode of presentation."  

  ---

  ### Final Judgment  
  Your position is tenable but strained at **Thesis 1–2 vs. Thesis 3**. The single revision that cleans up the most is **allowing tacit propositional knowledge** (modifying Thesis 1). This retains intellectualism while accommodating automaticity, gradability, and divergence. However, it forces a concession on Thesis 2: if the content is "ordinary," why must it be tacit? **Without this revision, the automaticity of skill (Thesis 3) becomes the biggest threat to intellectualism.**  

  Would you like to refine any thesis in light of this? I can simulate objections or help rephrase.
