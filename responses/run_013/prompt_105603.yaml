  But the satire still bites because both systems perpetuate bias through linguistic defaults. Even if histories differ, the present-day effect of marking "otherness" is similar. A refined argument would say: the harm isn't identical, but the underlying mechanism—defining normality through unmarked terms—deserves equal scrutiny. 

