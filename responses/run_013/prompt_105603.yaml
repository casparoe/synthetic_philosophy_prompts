prompt: |-
  I recently read Douglas Hofstadter's essay "A Person Paper on Purity in Language," in which a fictional columnist argues that we should keep using terms like "white" and "black" to describe people, and illustrates the point by writing as though our ordinary racial vocabulary were applied to the sexes -- so that "woman" becomes a marked, secondary term and the unmarked human being is assumed male. The essay is clearly meant as a satire, and its method is to take the way we talk about race and treat it as obviously offensive, then show that the way we talk about sex has exactly the same structure, so that a reader who is comfortable with the second but not the first is being inconsistent. I understand the point, but I want to know how far the parallel actually carries. Could you lay out what corresponds to what in the analogy -- which racial terms line up with which gendered terms, what plays the role of the unmarked default in each case, and what the fictional columnist's argument is supposed to mirror in real life -- and then tell me where the mapping breaks down: whether the history, the social meaning, or the grammatical facts differ enough between the two cases that the analogy proves less than it seems to. I am most interested in whether the conclusion the essay wants, that the two vocabularies are equally objectionable and should be rejected for the same reason, survives once the disanalogies are on the table, and if it does not fully survive, what a more careful version of the argument would look like. Please lead with the bottom line, include the correspondence table, and keep the whole answer under 450 words.
