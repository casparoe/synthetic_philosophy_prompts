answer: |-
  ### Crux Analysis  
  The critical challenge lies in moving beyond cultural relativism versus universalism by forcing students to **apply the symmetry requirement concretely** to Amina’s defense and the rich-country counterpart. Competent-but-unremarkable answers will:  
  1. Describe Amina’s "duty-bound particularism" and the mayor’s legal patronage,  
  2. Mention cultural context vs. institutional harm,  
  3. Conclude vaguely that "context matters."  
  To excel, students must dissect **whether the material consequences of Amina’s actions (e.g., systemic dependency, market distortion) differ fundamentally from the mayor’s case in ways that justify asymmetric judgments** – independent of legality or familiarity.  

  ---

  ### **Exam Question**  
  **"Amina’s defense of her actions rests on the claim that her use of public resources for ward-specific benefits constitutes legitimate representation in her context, not corruption. Using the symmetry requirement (which forbids justifying asymmetric judgments based solely on legality, foreignness, or familiarity), evaluate whether her position succeeds. In your analysis:  
  (a) Specify what Amina must establish to show her actions are non-corrupt despite violating donor conditions;  
  (b) Compare her case to the mayor who lawfully channels contracts to a donor/charity-supporter;  
  (c) Assess whether the ‘duty-bound particularism’ defense resolves the tension between local norms and anti-corruption universalism;  
  (d) Discuss what your conclusion implies for the legitimacy of the donor’s conditions.  
  Address the argument that refusing favors betrays moral duties, and engage the structural critique of ‘greasing the wheels’ efficiency claims."**  

  ---

  ### **Model Answer** (700 words)  
  Amina’s objection to the donor’s conditions requires establishing that her actions fulfill a defensible conception of public trust *specific to her institutional environment*, such that condemning it as corruption while excusing analogous acts elsewhere violates symmetry. She must prove that her particularism generates distinct *public benefits* or avoids distinct *public harms* compared to the rich-country mayor’s patronage, justifying asymmetric evaluation.  

  Amina’s strongest claim is that in contexts of state-dominated economies and weak welfare systems, representatives’ discretionary allocation of resources is essential for basic welfare. Her brother-in-law’s contract employs locals, while school fees invest in human capital—actions constituents reward electorally. Refusing such duties could collapse community trust. Conversely, the mayor operates in a setting with competitive markets, independent charities, and public schools; her contracts and donations are transactional (support for favors), not essential for survival. Here, the symmetry test reveals a material difference: **Amina’s actions address market failures the state has not resolved, while the mayor’s exploits functional institutions for mutual gain**. This difference is defensible independent of location: where state capacity voids exist, rigid universalism may harm welfare.  

  However, the duty-bound defense fails to resolve the core tension. Sincerely feeling obliged to favor kin does not negate corruption’s systemic harm. Amina’s markup funds school fees but entrenches dependency: local jobs hinge on her funneling contracts to specific firms, incentivizing councillors to preserve inefficient bureaucracies. This creates a **self-perpetuating cycle** where "greasing the wheels" demands ever more grease—unlike the mayor’s context, where diversified markets limit harm from patronage. The structural critique applies acutely here: profiting from arbitrage (e.g., contract markups) motivates actors to *maintain* the scarcity that justifies particularism. Thus, the efficiency claim collapses empirically when particularism becomes systemic.  

  The mayor’s actions, while legal, may still distort competition or access. But crucially, robust institutions (courts, auditors, free press) contain these risks. In Amina’s case, discretionary funds *substitute for* institutional safeguards, enabling elite capture. Symmetry thus exposes that the salient distinction is **institutional fragility**, not culture: where oversight is weak, particularism’s costs (corruption traps, inequality) outweigh transient benefits.  

  Consequently, the donor’s conditions gain legitimacy. By mandating competitive tendering and asset declarations, they disrupt cycles of dependency and rent-seeking. While Amina’s welfare role is real, donors may legitimately insist that aid build *alternative institutions* (e.g., transparent social programs) rather than lubricate extractive ones. The conditions’ universal form is defensible because institutional harm—not subjective intent—defines corruption.  

  ---

  ### **Marking Scheme** (20 marks total)  
  1. **Symmetry Requirement Application** (5 marks):  
     - *Hit:* Compares *structural conditions* (e.g., institutional fragility, market diversity) to justify asymmetry.  
     - *Miss:* Merely names symmetry or cites "culture" without material analysis.  

  2. **Amina’s Burden of Proof** (4 marks):  
     - *Hit:* Identifies she must prove *context-specific public benefit/harm difference* vs. mayor.  
     - *Miss:* Restates her cultural claim without testing it materially.  

  3. **Duty-Bound Particularism Critique** (4 marks):  
     - *Hit:* Shows sincerity doesn’t negate systemic harm (dependency cycles, incentive to preserve inefficiency).  
     - *Miss:* Accepts "moral duty" as self-justifying or only discusses intent.  

  4. **Structural Critique Engagement** (4 marks):  
     - *Hit:* Explains *how* particularism perpetuates inefficiency (e.g., elites benefit from bureaucracy’s flaws).  
     - *Miss:* Only describes "greasing wheels" without addressing perverse incentives.  

  5. **Donor Legitimacy Conclusion** (3 marks):  
     - *Hit:* Ties donor conditions to disrupting harmful cycles and building institutions.  
     - *Miss:* Vague appeals to "universalism" or "relativism" without institutional logic.  

  **Distinguishing Weak Answers**:  
  - **Naming vs. Applying Symmetry**: Weak answers mention symmetry but default to legality ("Amina broke rules, mayor didn’t") or cultural exceptionalism ("norms differ"). Strong answers identify *testable differences* (e.g., welfare gaps, oversight capacity).  
  - **Long-but-Weak Answers**: Spend 300 words defining corruption/relativism, describe cases without comparison, assert Amina’s "noble intent" as exoneration, and conclude with "it’s complex."  

  ---  
  This framework forces students to **interrogate institutional causality** beyond cultural tropes. The model answer demonstrates how to dissect "duty" through systemic effects, satisfying the module’s emphasis on structural analysis.
