  For the question, I'll force analysis of what Amina must prove for her objection to succeed (not just cultural difference), whether it holds under symmetry, and implications for donor conditionality. The rich-country mayor comparison must be integral, not decorative. 

  Model answer needs to: 
  - Reconstruct Amina's strongest case: reciprocal obligation as core representation, not personal gain 
  - Test symmetry by comparing structural features (e.g., competitive markets vs. state-dependent livelihoods) 
  - Show why "duty sincerity" alone fails without systemic analysis 
  - Argue donor legitimacy hinges on harm prevention, not cultural imposition 

  Marking scheme will penalize: 
  - Mere relativism without symmetry application (common pitfall) 
