prompt: |-
  I run the content team at a small war museum — four of us, no historians on staff — and we're redoing the labels for a gallery about a border war in the 1990s that both sides still argue about. We'll be writing maybe 120 of these over the next month, so it's not a one-off, and each one has to be defensible to a board that includes veterans' groups and a cultural attaché from the other side who keeps writing us letters.

  Here's my problem. Half our artifacts are things our soldiers did, half are things the other side's soldiers did, and structurally they're the same kind of thing — a guy with a rifle in a trench, a guy who held a village, a guy who shot someone who turned out to be a civilian. Right now the labels do the thing where ours are 'defending' and theirs are 'occupying', and I've started to think that isn't something I can actually defend.

  I've been reading about the idea that soldiers on both sides of a war are moral equals when it comes to how they fight — that whether your war is just, and whether your conduct in it is just, are two seperate questions, and the second one doesn't care which side you're on. I think I buy it, but I can't hand my label writers a philosophy paper.

  So: give me a procedure we can actually run, one artifact at a time. The questions to ask, in order; what counts as a good enough answer to each; where it stops and says this one gets labeled neutrally; where it stops and says no, this act gets marked as wrong regardless of side; and where it has to hand the decision to a human because it's turned into a values question. It has to fit a 60-word label, my writers get about 15 minutes per artifact, and every call has to be something I can defend to a hostile board member who is looking for a reason to shut the gallery down.

  Then run it on three artifacts: (a) one of our soldiers who held a position under fire and killed several attackers; (b) an enemy soldier who did the same thing on the other side of the same hill; (c) a soldier on the enemy side who by every account was a disciplined and restrained fighter, in a war our side believes was plainly unjust. I want to know what label each one gets, and whether a visitor walking through would notice the asymmetry or the symmetry.

  And be honest with me about two things. First, where the procedure can't really decide and I'm just dressing up a value judgment as a rule. Second, what happens if the revisionist view is right instead — the one where fighting in an unjust war does make you culpable even if you fought clean. If my procedure collapses under that view I need to know now, because a board member is definately going to bring it up.
reasoning: |-
  Okay, let me tackle this museum curator's problem. They need a practical procedure for writing artifact labels about a contentious border war, where both sides still dispute the narrative. The key challenges are neutrality, defensibility, and efficiency—120 labels in a month with only 15 minutes per artifact. 

  First, I need to unpack their core dilemma: the current labels use asymmetric language ("defending" vs. "occupying"), which feels indefensible. They’re drawn to the "moral equality of soldiers" concept—separating the justice of the war from the justice of conduct—but need it operationalized. 

  The procedure must:  
  - Work within tight constraints (60 words, 15 mins/artifact)  
  - Have clear decision points for neutral/condemnatory language  
  - Flag when human judgment is unavoidable  
  - Hold up against scrutiny from veterans and the opposing side’s cultural attaché  

  I’ll structure it as a flowchart-style checklist:  
  1. **Define the act**: Strip away side-specific framing. Did the soldier hold a position? Return fire? Engage a target?  
  2. **Assess compliance with IHL**: Was the act lawful under international humanitarian law? If unclear (e.g., "civilian" ambiguity), note uncertainty.  
  3. **Check for asymmetry**: Does evidence show one side clearly violated norms (e.g., targeting medics)? If yes, condemn regardless of affiliation.  
  4. **Handle "gray zones"**: If steps 1-3 don’t resolve, default to neutral description + contextual fact (e.g., "fought in contested village").  

  For the test cases:  
  - **Our soldier holding position**: "Defended X hill against assault; [Unit] sustained heavy casualties." (Symmetrical with enemy equivalent)  
  - **Enemy equivalent**: Identical structure: "Defended Y ridge against attack; [Unit] repelled advances."  
  - **"Restrained" enemy soldier**: "Served in Z sector; documented as adhering to combat protocols despite high tensions." (Highlights conduct, sidesteps war-justice debate)  

  Now, the honesty check:  
  - **Value judgments**: Step 4 is where values creep in (e.g., defining "restraint"). Admit this upfront; call it "contextual framing."  
  - **Revisionist view**: If culpability extends to participation in unjust wars, the whole system collapses. Mitigate by:  
    - Adding a disclaimer: "Labels assess conduct, not causes"  
    - Preemptively citing the ICRC’s separation of *jus ad bellum* vs *jus in bello*  

  Key safeguards:  
  - **Audit trail**: Writers must note why each label passed/failed the checklist  
  - **Board defense**: "Our method mirrors IHL standards; condemns violations uniformly"  
  - **Visitor perception**: Symmetry in test cases (a/b identical, c neutral) avoids glaring bias  

  This should let them produce defensible, consistent labels without philosophical paralysis. The revisionist risk remains, but grounding in IHL makes it harder to attack as partisan.
answer: |-
  Here's a battle-tested procedure designed for speed, defensibility, and ethical consistency, grounded in International Humanitarian Law (IHL) principles. It prioritizes **conduct** over **cause** and uses neutral framing unless evidence demands condemnation.

  **The 4-Step Label Procedure (Per Artifact):**

  1.  **Define the Core Action Neutrally:**
      *   **Question:** "What specific, observable military act occurred, stripped of national affiliation or moral judgment?"
      *   **Process:** Remove words like "defended," "occupied," "heroic," "brutal." Use verbs like: held, attacked, repelled, fired upon, captured, destroyed, engaged, operated.
      *   **Good Answer:** A concise, factual description of the event/location/object/role. (e.g., "Held strategic hilltop position," "Returned fire during ambush," "Commanded unit in village," "Issued rifle used in trench warfare").
      *   **Stop if Neutral:** If the action is a common, lawful act of war (holding a position, returning fire in combat, standard equipment use) and there's *no specific evidence of IHL violation or exceptional context*, use the neutral description. **Label Done.**
      *   **Move to Step 2 if:** The action inherently involves potential harm to non-combatants, surrender, cultural property, or has disputed circumstances (e.g., "shot individual approaching checkpoint," "held village after expulsion of inhabitants," "used captured religious symbol as sandbag").

  2.  **Assess Compliance with IHL/LOAC (Law of Armed Conflict):**
      *   **Question:** "Is there credible, documented evidence this *specific act* violated the laws of war (distinction, proportionality, unnecessary suffering, treatment of POWs/non-combatants)?"
      *   **Process:** Consult available records (military reports, investigations, reputable NGOs like ICRC if applicable for this conflict, verified testimonies cited in reliable sources *used by the museum*). Focus on the *act itself*, not the overall war justification.
      *   **Good Answer:** *Clear evidence* of violation (e.g., targeting marked medics, executing surrendering troops, disproportionate bombardment of civilian area *in this instance*, torture). *Lack* of such evidence for acts with inherent risk (e.g., civilian casualty in active combat zone without proof of intent or recklessness).
      *   **Stop & Condemn if Violation:** If clear evidence of an IHL violation exists, state the fact neutrally and the violation clearly, regardless of side. (e.g., "Shot surrendering combatants [violating laws of war]", "Destroyed protected cultural site without military necessity"). **Label Done.**
      *   **Move to Step 3 if:** Evidence is ambiguous, conflicting, or inconclusive regarding IHL violation. *Or* if the act is lawful but carries significant ethical weight due to context (e.g., civilian casualty, holding conquered territory).

  3.  **Check for Asymmetric Context (Rare, Evidence-Based):**
      *   **Question:** "Is there *overwhelming and uncontested evidence* that this specific type of action was systematically used *only by one side* to violate fundamental norms in *this specific conflict*, making the act inherently linked to that violation?"
      *   **Process:** Extremely high bar. Requires documented policy, widespread practice, or legal rulings specific to *this conflict* for *this act type*. (e.g., systematic use of child soldiers by one side, institutionalized torture camps).
      *   **Good Answer:** Reference to the specific, well-documented systemic violation. (e.g., "Participated in village occupation during [Side X]'s campaign of forced displacement" - *only if* forced displacement is a documented, systematic policy of Side X in this war).
      *   **Stop & Contextualize if Asymmetric:** If the high bar is met, incorporate the verified systemic context factually. Avoid moral adjectives ("brutal," "oppressive") unless quoting a legal finding. **Label Done.**
      *   **Move to Step 4 if:** The high bar isn't met. The act, while potentially difficult, was a common feature of the conflict for both sides (e.g., trench warfare, holding villages, ambushes, civilian casualties in contested areas). *This is where most contested "gray area" items land.*

  4.  **Neutral Description + Minimal Context (The Human Values Step):**
      *   **Question:** "What is the *most relevant, factual, and non-inflammatory* piece of context needed for a museum visitor to understand this artifact's significance within the contested nature of *this specific event or location*?"
      *   **Process:** Stick strictly to verifiable facts about *this* event/location: date, location name, unit designation, immediate tactical situation (if clearly documented), known outcome (casualties, capture, etc.). *Avoid* motives, justifications, or grand narratives. Acknowledge contested interpretations if crucial, but neutrally ("...a position both sides claimed as vital," "...an incident where civilian presence was disputed").
      *   **Good Answer:** A single, impactful fact that grounds the artifact without taking sides. (e.g., "Held position overlooking the disputed X Valley," "Fought during the battle for Y Village, contested for three weeks," "Issued rifle; Y Village saw heavy casualties on both sides").
      *   **Stop & Write Label:** Combine the neutral action (Step 1) with this minimal context. **Label Done.**

  **Defending the Procedure to the Board:**
  *   **Grounding:** "This process is based on International Humanitarian Law (IHL), which separates the legality of *conduct in war* (jus in bello) from the legality of *going to war* (jus ad bellum). It focuses on verifiable facts and documented violations applicable to all soldiers equally."
  *   **Fairness:** "It applies the same standard to artifacts from both sides. Condemnation requires evidence of specific war crimes, not side affiliation. Neutrality is used where evidence is ambiguous or the act was common to both sides."
  *   **Transparency:** "We document the step reached for each label (e.g., 'Neutral Action - Step 1', 'IHL Violation - Step 2', 'Context Added - Step 4')."
  *   **Museum Role:** "Our role is to present facts and documented violations, not to adjudicate the overall justice of the war. This allows visitors from both sides to see their soldiers' conduct assessed fairly while acknowledging contested events."

  **Testing the Procedure: Your Three Artifacts**

  *   **(a) Our Soldier (Held position under fire, killed attackers):**
      *   **Step 1:** Core Action = "Held strategic hilltop position under heavy attack." (Lawful act of war).
      *   **Stop at Step 1. Label:** "Sgt. [Name], [Unit]. Held strategic Hill 451 during sustained assault, [Date]. Repelled multiple attacks." **Visitor Perception:** Standard military action description.
  *   **(b) Enemy Soldier (Did the same on the other side of the hill):**
      *   **Step 1:** Core Action = "Held opposing ridge position under heavy attack." (Identical lawful act).
      *   **Stop at Step 1. Label:** "Cpl. [Enemy Name], [Enemy Unit]. Held ridge west of Hill 451 during sustained assault, [Date]. Repelled multiple attacks." **Visitor Perception:** Structurally identical to (a). Clear symmetry in describing the same military action.
  *   **(c) Enemy Soldier (Disciplined fighter in a war our side believes was unjust):**
      *   **Step 1:** Core Action = "Served as infantry soldier in [Sector/Unit]." (Or more specific: "Commanded squad during village patrols in Z District" - if known).
      *   **Step 2:** No evidence of *specific* IHL violations by this soldier. His personal conduct is noted as restrained.
      *   **Step 3:** No evidence this *type* of service (infantry patrols) was *inherently* a systemic violation unique to his side.
      *   **Step 4:** Needs context because the *overall war's justice* is contested, but his *conduct* was reportedly lawful. Minimal Context: Focus on the documented conduct. **Label:** "Lt. [Enemy Name], [Enemy Unit]. Served in Z District, [Timeframe]. Contemporary accounts and military records describe his adherence to disciplined engagement protocols during operations." **Visitor Perception:** Neutral description of role, with added factual context about his *conduct* (restraint). The asymmetry lies in mentioning his conduct (because the info exists), not in the framing of his role. The label avoids stating whether the war was just.

  **Overall Visitor Perception:** They would see clear symmetry between (a) and (b) – both described identically as soldiers performing the difficult, lawful duty of holding ground under fire. For (c), they see a neutral description of service with added factual detail about *how* he fought (restrained), not *why*. The asymmetry is factual (information about conduct is included where available), not judgmental. It doesn't label the *war* just or unjust for any soldier.

  **Your Two Honest Answers:**

  1.  **Where the Procedure Dresses Up Value Judgments:**
      *   **Step 4 (Choosing Context):** This is the main value-laden step. Deciding *what* minimal context is "most relevant" and "non-inflammatory" involves editorial judgment. Choosing to highlight "restraint" for (c) is a value call favoring individual conduct over the contested war aim. Choosing *not* to add context implying aggression for (a) or (b) is also a value call favoring neutrality. You're prioritizing the "moral equality" frame by focusing on conduct here.
      *   **Defensibility:** Frame it as "prioritizing verifiable facts about the artifact's direct story." For (c), "restraint" is presented as a documented fact, not a moral judgment. Admit choices are made but argue they are based on available evidence about *this soldier*, not the side.

  2.  **If the Revisionist View (Fighting in Unjust War = Culpable) is Correct:**
      *   **The Procedure Collapses.** Fundamentally. The revisionist view (e.g., McMahan, Fabre) explicitly rejects the moral equality of soldiers. Fighting for an unjust cause *is itself* a wrong, even with clean conduct. Your procedure is built on the *opposite* premise (separation of jus ad bellum/jus in bello).
      *   **Consequences:** Applying this view would require labeling *every* artifact associated with the side deemed (by your institution? the board? one side?) "unjust" differently. Your soldier (a) might be "defending justly," while the enemy soldier (b) doing the identical act would be "aggressing unlawfully" or "participating in an unjust war." Soldier (c)'s restraint might be noted but framed as "serving an unjust occupation."
      *   **Impact:** Asymmetry becomes the rule, not the exception. Labels become declarations about the war's overall justice. This is precisely what your current labels do ("defending" vs. "occupying") and what you find indefensible. It guarantees fierce, probably insurmountable, opposition from the side labeled "unjust" (and likely their cultural attaché/veterans on the board). It turns the museum into a tribunal on the war's justification, not a presenter of artifacts and conduct.
      *   **Defending Against Revisionism:** You must be blunt with the board: "Adopting the revisionist view means abandoning neutrality. Every label would declare one side fundamentally 'right' and the other 'wrong.' This is incompatible with our goal of presenting a factual exhibit on soldier experiences and conduct during a conflict where both sides dispute the fundamental narrative. It would also likely violate our loan agreements or ethical commitments as a museum striving for objectivity. Our procedure focuses on the shared realities and rules of combat, which is the only framework allowing us to discuss artifacts from both sides fairly under one roof. We acknowledge the revisionist academic argument but deem it incompatible with our institutional role in this contested space."

  **In essence:** Your procedure is a robust, defensible way to implement the "moral equality of soldiers" *in conduct* framework. It achieves symmetry for common acts of war and reserves condemnation for documented violations. The vulnerability at Step 4 is manageable with a commitment to factual context. However, if the board fundamentally rejects the separation of the war's justice from the soldier's conduct, the entire approach fails, and the museum faces an existential choice about taking sides in an ongoing dispute. Stick to your guns on the IHL framework – it's your strongest shield. Good luck.
