prompt: |-
  I have been circling a pattern for some time and cannot tell whether it already has a name or whether I need to invent one.

  The pattern is a kind of value that attaches to a thing because of what it is a trace of, and it moves in two directions I cannot reconcile. It rises when the thing traced disappears: a photograph of a building since demolished, a plaster cast of a sculpture since destroyed, a letter in the hand of someone now dead. Nothing about these objects changed, and the value was never located in their perceptible qualities to begin with, yet as the thing they point back to becomes unavailable the value goes up. But it collapses when the relation itself is shown not to hold: a painting loses most of its worth the moment it is exposed as a forgery rather than the work of the hand it was credited to, and here nothing in the world changed at all, only what is known about the object's history.

  Both changes look external to the object, and both look like the same value being moved, which is what I cannot sort out. Is there an established concept for value of this kind, and how does it divide from the neighbours I know of — aura, authenticity, relic value, ordinary scarcity? Is the first phenomenon the same as the second, or are they two different things sharing a surface? And where do the intermediate cases fall — a cast taken from the original mould, a freehand copy, a forgery of a work that never existed, a photograph of a photograph? If no concept exists I would happily take a coined term, but I care more about where the boundaries fall than about the label.
reasoning: |-
  Okay, the user is describing a really intriguing pattern about how the value of an object changes based on its connection to something else. Let me unpack this. They mention two scenarios: one where the original thing disappears, increasing the value of the trace, and another where the trace's link to the original is disproven, causing its value to plummet. 

  First, I need to figure out what they're really asking. They want to know if there's an established concept for this kind of value. They mentioned terms like aura, authenticity, etc., but feel those don't fully cover both phenomena. They also seem concerned with boundary cases, like copies versus forgeries.

  Hmm, let me recall relevant concepts. Benjamin's "aura" comes to mind—the idea that original artworks have a unique presence tied to their history and authenticity. But in the first scenario, when the original is gone, the trace gains value, which isn't directly covered by aura. Then there's "authenticity" itself, which when questioned, destroys value, as in forgeries. But why does the destruction of the original increase the trace's value? That's where relic value or scarcity might play a role. 

  I should consider cultural memory and indexicality. The trace serves as an index, a physical connection to the original. When the original is destroyed, the trace becomes a more crucial link, hence more valuable. But if the trace is fake, that link is broken, so the value collapses. This seems like two sides of the same coin: the value depends on the perceived strength of the indexical connection. 

  The user also brought up intermediate cases. A cast from the original mold might still hold value as an authentic reproduction, while a forgery has none. A photo of a photo might have value if the original photo is lost, but less than the original. These nuances show that the value isn't just about the object but about its perceived proximity to the source. 

  The deeper need here might be understanding how cultural and historical context assigns value. The user is circling around the idea that value isn't intrinsic but relational. They might be looking for a framework to categorize these relationships, possibly for academic or creative work. 

  I should synthesize the concepts into "indexical value." It ties together the trace's physical connection and the role of provenance. The two phenomena are interconnected: both hinge on the trace's legitimate link to the original. When the original is gone, the trace's link becomes more precious. When the link is fake, the trace loses all value. The boundaries depend on the trace's directness and the certainty of its provenance. 

  Also, the user might need this for practical applications, like appraising artifacts or understanding cultural heritage. Clarifying these boundaries helps in assessing value in various contexts, from art markets to historical preservation. 

  In conclusion, while no single term exists, "indexical value" captures the essence. The key is the perceived authenticity of the connection, not the object itself. The user's insight reveals how value is dynamic, shaped by loss, knowledge, and cultural narratives.
answer: |-
  Your observation captures a profound tension at the heart of cultural, historical, and economic value. While no single, universally accepted term encompasses *both* phenomena you describe, they are deeply connected facets of a concept we might call **Indexical Value** or **Provenance-Dependent Scarcity**. Here's how established ideas relate to your pattern and where the boundaries lie:

  ### Core Concept: The Value of the Link
  The value you're observing isn't in the object's inherent material or aesthetic properties, but in its **perceived connection to a specific origin point (source, event, creator, or historical moment)**. This value is:
  1.  **Relational:** It exists solely *because of* the object's connection to the source.
  2.  **Epistemic:** It depends heavily on *knowledge* and *belief* about that connection.
  3.  **Fragile:** It is vulnerable to shifts in knowledge (provenance revelations) or the status of the source (destruction/loss).

  ### Reconciling the Two Directions
  The seeming contradiction arises from different threats to the *strength* and *uniqueness* of the link:

  1.  **Source Disappearance (Value Increases):**
      *   **Mechanism:** The destruction/loss of the source makes the trace the *primary remaining physical link* to that source. Its **indexical power** intensifies.
      *   **Drivers:** Heightened **scarcity** (fewer direct links exist), increased **relic value** (it becomes a physical remnant/surrogate), amplified **aura** (as the closest accessible embodiment of the lost original's historical presence). The trace becomes a more crucial vessel for **cultural memory**.
      *   **Analogy:** The only surviving key to a lost treasure vault becomes incredibly valuable *because* the vault is gone. Its value *as a key* is contingent on the vault's existence *and* its own unique link to it.

  2.  **Link Proven False (Value Collapses):**
      *   **Mechanism:** The revelation severs the perceived connection. The object loses its **authenticity** *as a trace of that specific source*. It becomes "merely" an object, no longer imbued with the history it was thought to possess.
      *   **Drivers:** Collapse of **authenticity**, loss of **provenance**, destruction of **aura** (dependent on genuine origin), exposure as **common** (if it's just a copy/forgery) rather than unique. The narrative power vanishes.
      *   **Analogy:** Discovering the "key" is a replica that never opened the vault destroys its value *as a key to that vault*. Its material form is unchanged, but its relational meaning is obliterated.

  **They are two sides of the same coin:** Both phenomena demonstrate that the core value resides *in the strength and perceived truth of the indexical link itself*. The first strengthens the link's perceived importance by removing alternatives; the second destroys the link's perceived reality.

  ### Differentiating from Neighbouring Concepts
  *   **Aura (Walter Benjamin):** Encompasses the unique presence, authority, and "cult value" of an original artwork rooted in its specific history and ritual context. *Your pattern focuses on the value derived specifically from the trace's *connection* to the source of aura (which may be lost), and how that value changes based on the link's integrity.* Aura is a quality *of* the original; indexical value is a quality *of the link*.
  *   **Authenticity:** The genuine nature of the origin or authorship. *Essential to the indexical link, but not sufficient on its own.* Authenticity *enables* the indexical value, but the value *changes* based on external factors like the source's existence (as per your first point). Authenticity is binary (it is or isn't); indexical value is scalar (stronger when the source is gone, zero if the link is false).
  *   **Relic Value:** The value derived from direct physical contact with a sacred or revered person/event. *This is a powerful *form* of indexical value, specifically where the source is sacred/historical and the link is physical contiguity (e.g., saint's bone, bullet from Gettysburg).* Your pattern is broader, encompassing artistic provenance and representational traces (photos).
  *   **Ordinary Scarcity:** Value from limited supply of similar objects. *Indexical value creates a unique kind of scarcity: scarcity of *access points* to the specific source.* A photo of a demolished building is scarce *as a trace of that building*, even if millions of photos exist. Its scarcity is defined relationally.

  ### Mapping the Intermediate Cases
  The value depends on the **strength/directness of the indexical link** and the **certainty/authenticity of the provenance:**

  1.  **Cast taken from the original mould:**
      *   **Strong Link:** Direct physical causation (mould touched the original).
      *   **Authentic Provenance:** Known history.
      *   **Value:** High "indexical value," especially if the original is lost. Seen as the most authentic reproduction, a legitimate trace. Value approaches (but rarely equals) that of the original if the original is gone. Scarcity of casts matters.

  2.  **Freehand Copy (not intended to deceive):**
      *   **Weak Link:** Interpretive representation, not direct physical trace. No causal chain.
      *   **Authentic Provenance:** Known to be a copy.
      *   **Value:** Primarily aesthetic/skill value. Minimal indexical value to the *original source* (it points more to the *copyist's* skill/interpretation). Value depends on the copyist's fame/skill, not the link to the original. If the original is lost, it gains *some* indexical value as the best *representation*, but far less than a direct trace like a cast.

  3.  **Forgery of a work that never existed:**
      *   **False Link (Specific):** Claimed connection to a specific, real source (e.g., "newly discovered Rembrandt") is severed when proven fake.
      *   **Result:** Indexical value collapses completely. May retain aesthetic value if skillfully done, but its primary claimed value is destroyed.
      *   **False Link (Generic):** Claimed to be *by* a master, but not a copy of a known work. Similar collapse when exposed. Value reverts to aesthetic/skill value (often low if dependent on the false attribution).

  4.  **Photograph of a photograph:**
      *   **Link to Original Subject:** Very weak/indirect. The new photo is a trace *of the first photo*, not the original subject. The chain is broken.
      *   **Authentic Provenance:** Known to be a copy.
      *   **Value:** If the *original photo* is lost/destroyed, the copy gains *some* indexical value *as the best remaining trace of that specific photographic object*. Its value *as a trace of the original subject* is minimal unless the original photo itself was the only trace (e.g., photo of a destroyed building, and the original negative is lost). Value primarily documentary/aesthetic of the image itself.

  ### Conclusion: Coining "Indexical Value"
  Your pattern brilliantly highlights a distinct category of value dependent entirely on the **authenticated, physical link to a specific origin**. While drawing on aura, authenticity, relic value, and scarcity, it's uniquely characterized by its **dynamic sensitivity to the status of the source and the integrity of the link**.

  Therefore, **Indexical Value** is a fitting term:
  *   **Indexical:** Rooted in semiotics (Charles Peirce), meaning a sign physically connected to its object (smoke to fire, footprint to foot, photo to subject). Perfectly captures the "trace" nature.
  *   **Value:** Emphasizes the economic/cultural worth derived from this link.

  **Boundaries:** Indexical Value emerges at the intersection of:
  1.  A physical object serving as a trace (index).
  2.  A specific, valued source/event/creator.
  3.  Authenticated provenance establishing the link.
  4.  Scarcity of access points to the source.

  It collapses if the provenance is false (destroying the link) but *increases* if the source is lost (increasing the link's relative importance due to scarcity of alternatives). The intermediate cases demonstrate the scalar nature of the value, dependent on the directness of the indexical connection and the robustness of its authentication. You've identified a fundamental, yet often overlooked, driver of worth in human culture.
