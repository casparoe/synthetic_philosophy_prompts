  First, I need to map the philosophical landscape on omissions as causes. The standard positions are: Event-causalists reduce omission-talk to actual events (like decisions). Normativists see it as normative judgments disguised as causality. The essay proposes a capacity-based view where omissions cause when agents don't exercise difference-making capacities they possess. 

