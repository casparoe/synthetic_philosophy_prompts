  On isolating omissions (Q2): The essay claims Cases 1 and 2 share identical physical histories (Gate B shut), but this is debatable. In Case 1, the operator's decision is a mental event—event-causalists could argue this decision (not the omission) is the real cause. The essay insists the cause is the non-exercise itself, but mental events seem smuggled in. Case 2 lacks comparable mental events, making the contrast rely on something positive. This risks conceding to event-causalists. 

  Is this a third option (Q3)? The capacity view avoids normativism by anchoring causation in capacities (factual, not normative) and avoids event-causalism by making the omission (non-event) primary. But one might argue capacities are dispositional properties—still not events—so it holds. However, if capacities reduce to normative expectations (e.g., "should have acted"), it collapses into normativism. The essay avoids this by emphasizing the agent's epistemic situation and difference-making potential. It's likely a distinct position. 

  Degrees of causation (Q4): The essay claims omission-causation comes in degrees (e.g., capacity reliability). This challenges binary causation but risks conflating causality with blame. For example, an operator with a 10% chance of success vs. 90%: does the omission cause less? Intuitively, the outcome is equally caused in both cases—only the probability of prevention differs. Degrees might better fit blameworthiness, not causation itself. 

  Structural omissions (Q5): The essay excludes system-level "omissions" (e.g., no safety guardrail) since no agent failed to exercise capacity. This is coherent but raises questions: if a designer omitted to include the guardrail, their omission could fit the capacity view. The essay might need to clarify agent scope. 

  Key improvement (Q6): The essay should address Case 1's decision more directly. If the cause is purely the non-exercise, it must explain why accompanying mental events aren't doing the work. Otherwise, event-causalists win. 

