     | R3   | Structured  | None (evaluate per case)   | Text: no loop, no ambiguity | No |
     | R14  | Circular    | Suspend                    | Theory: self-reference leads to loop and paradox | [contested] in logic, but in our procedure, yes |
     | R22  | Circular    | Suspend                    | Theory: self-reference        | [contested] if we take it as always in force, but our procedure flags self-ref as circular |
