          - The alternative (allowing a third truth value or leaving it undecided) is handled by the Circular and Unresolved labels, which have clear administrative actions.

     Contested point: Some logicians might argue that a circular rule could have a stable truth assignment (e.g., if the loop is of length 2 and both rules are the same, then they could both be true or both false). But we are not making that distinction. We treat any cycle as unresolvable and suspend it. This is conservative and safe for benefits: we would rather not enforce a rule than enforce it incorrectly.

     [contested]: There are logics that allow for stable assignments in some cycles (e.g., well-founded semantics). We choose to suspend all circular rules for simplicity.

  ### 4. Rules as prescriptions

     The procedure translates "rule R applies to case C" into a truth-apt statement: "the conditions for rule R to be applicable are met in case C". This is a factual question about the case and the rule's conditions. The cost is that we are treating applicability as a truth value, which may not capture the full normative force of the rule, but for the purpose of automated decision-making, we need to decide whether to use the rule or not.

  ### 5. Amendments

     - When the manual is amended, the procedure is run on the amended rule and any rule that depends on it.
     - A label can flip: for example, if a rule was Circular and the amendment breaks the cycle, it can become Structured. If a rule was Structured and the amendment introduces a cycle, it becomes Circular.
     - Actions already taken under the old label: We do not revisit past cases. The new label applies prospectively.
     - An ungrounded rule (Circular) can be made grounded (Structured) by later drafting (amendment).

  ### Worked examples

     We are given rules:

     - R3: "A claim is denied if it is filed more than thirty days after the notice is mailed." (Assume the facts of a specific case are settled.)

     - R14: "This rule governs every rule in this manual that does not govern itself."

     - R22: "This rule is in force."

     - R30: "This rule governs every rule whose applicability this manual does not determine."

     - R5 and R6: 
          R5: "Rule 5 governs every matter governed by Rule 6."
          R6: "Rule 6 governs every matter governed by Rule 5."

     We run the drafting procedure on each (since they are being adopted or amended).

     **R3:**
        Step 1: Parse. It depends on facts (filing date, mailing date) and has no dependency on other rules. No ambiguity.
        Step 2: No self-reference or circularity.
        Step 3: It might depend on facts that could be missing? The rule does not specify a default if the dates are missing. But at drafting, we only check for structure. We don't have a case. So we assign **Structured**.
        Action: None (wait for case).

     But the example says: assume facts of a specific case are settled. So if we are running for a case, and the facts are settled, then:
          - If filed more than thirty days after mailing, then Applies.
          - Otherwise, DoesNotApply.

     Since the facts are settled, we can evaluate.

     **R14:**
        "This rule governs every rule in this manual that does not govern itself."
        - This is a self-referential rule. It governs rules that do not govern themselves.
        - Let Q be a rule. R14 governs Q if Q does not govern itself.
        - Does R14 govern itself? 
            - If it does, then it is a rule that governs itself, so R14 should not govern it -> contradiction.
            - If it does not, then it is a rule that does not govern itself, so R14 should govern it -> but then it does govern itself, contradiction.
        Therefore, it is a paradox.

        Drafting procedure:
          Step 1: It depends on whether other rules govern themselves and on whether R14 governs itself. There is no ambiguity in the text.
          Step 2: Check for circularity. This rule is self-referential and creates a loop with itself. So it is a cycle of length 1. Assign **Circular**.
          Action: Suspend.

     **R22: "This rule is in force."**
        - This is a self-referential statement about being in force.
        - If we take it to be in force, then it is true. If not, then false. But there's no dependency on anything else.
        - In our procedure:
            Step 1: It depends on itself (for being in force). No ambiguity.
            Step 2: Self-reference -> cycle of length 1. Assign **Circular**.

     **R30: "This rule governs every rule whose applicability this manual does not determine."**
        - Let Q be a rule. R30 governs Q if the manual does not determine Q's applicability.
        - Does R30 govern itself?
            - If the manual determines R30's applicability, then R30 should not govern itself.
            - If the manual does not determine R30's applicability, then R30 should govern itself.
        - But what does "the manual determines" mean? If it means that the manual (via the rules) assigns a truth value to the applicability, then we have:
            - If we assume R30 is not governed by itself, then the manual must have determined its applicability? But we are in the process of determining.
        This is similar to R14.

        We consider it as self-referential and circular. Assign **Circular**.

     **R5 and R6:**
          R5: "Rule 5 governs every matter governed by Rule 6."
          R6: "Rule 6 governs every matter governed by Rule 5."

        - They form a cycle of length 2.
        - Drafting procedure for R5:
            Step 1: It depends on what matters are governed by Rule 6. If Rule 6 governs a matter, then Rule 5 governs it too. This includes matters governed by Rule 5? 
            Step 2: If we try to determine what matters are governed by Rule 5, we need to know what matters are governed by Rule 6, which in turn depends on Rule 5. So there's a cycle between R5 and R6.
            Assign **Circular** to both.

     Now, we present the worked cases in a table.

     We are asked to include at least one case where the procedure returns an answer the drafting committee will not want. R14, R22, R30, R5, R6 are all Circular and will be suspended. The drafting committee might not want that, especially for R14 which was intended to be the "tidy" clause.

     Table for drafting (abstract) evaluation:

     | Rule | Label       | Action                     | Basis (text/theory) | Contested? |
