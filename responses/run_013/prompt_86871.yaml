  ### Procedure for Rule Analysis

  **Step 1: Extract Dependencies**  
  Identify all explicit references in the rule text to:  
  - External facts (e.g., dates, amounts, form submissions).  
  - Other rules' "in force" status (e.g., "if Rule X is in force").  
  - Other rules' applicability (e.g., "if Rule Y applies").  
  - Self-references (e.g., "this rule applies when...").  
  **Sufficient answer**: A clear list of dependencies. If ambiguity persists (e.g., vague phrasing, undefined terms), assign **Ambiguous** and stop. Output: Dependency map.

  **Step 2: Check for Self-Reference**  
  Determine if the rule directly references its own applicability or in-force status.  
  **Sufficient answer**: Yes/no. If yes, assign **Circular** and stop. If no, proceed.

  **Step 3: Map Dependency Chains**  
  Using the dependency map from Step 1, trace all chains of dependencies for applicability/in-force status. For each dependency:  
  - If a chain loops back to the original rule (e.g., Rule A → Rule B → Rule A), assign **Circular** and stop.  
  - If dependencies lead to an **Ambiguous** or **Circular** rule (per the manual’s current labels), assign **Depends-On-Flawed** and stop.  
  **Sufficient answer**: Identification of loops or flawed dependencies. If none, proceed.

  **Step 4: Assign Status**  
  If no issues in Steps 1–3:  
  - If the rule relies solely on settled external facts, assign **Settled-True** or **Settled-False** based on condition evaluation.  
  - If it depends on unsettled facts or rules labeled **Structured**, assign **Requires-Facts**.  
  - If no dependencies, assign **Structured**.  

  ---

  ### Status Labels (6 max)
  1. **Settled-True**:  
     *Def.*: Rule’s condition is verifiably true.  
     *Action*: Enforce.  
  2. **Settled-False**:  
     *Def.*: Rule’s condition is verifiably false.  
     *Action*: Do not enforce.  
  3. **Structured**:  
     *Def.*: No self-reference/circularity; dependencies resolvable with facts.  
     *Action*: Enforce in engine when facts are available.  
  4. **Requires-Facts**:  
     *Def.*: Depends on unsettled external facts.  
     *Action*: Enforce with agency-stated default (e.g., deny if default is "false").  
  5. **Ambiguous**:  
     *Def.*: Unresolved drafting ambiguity.  
     *Action*: Return to drafting committee.  
  6. **Circular**:  
     *Def.*: Self-reference or dependency loop detected.  
     *Action*: Suspend enforcement.  

  ---

  ### Grounding the Procedure
  **Machinery**: Fixed-point iteration with three-valued logic (true/false/undetermined).  
  - **Process**: Start with rules relying only on external facts. Iteratively update rule statuses until no changes occur. Rules in loops remain undetermined.  
  - **Why Administrative, Not Academic**:  
    - Prioritizes timely, conservative outcomes (e.g., suspending loops) over philosophical resolution.  
    - Avoids unstable assignments (e.g., "both true and false") that create legal risk.  
  - **[Contested] Alternative**: Permitting stable assignments in some loops (e.g., "Rule X true if Rule Y false, and vice versa"). Rejected for administrative simplicity—suspension is safer than complex logic.  

  ---

  ### Rules as Prescriptions
  - **Translation**: "Rule R applies to case C" becomes truth-apt by rephrasing as: "Conditions triggering R’s enforcement are met in C."  
  - **Cost**: Treats rules as conditional statements (if X, then enforce Y), ignoring non-descriptive intent. Defensible because the engine requires binary enforcement decisions.  

  ---

  ### Amendment Impact  
  - **Label Flips**: Possible (e.g., **Circular** → **Structured** if a loop is broken).  
  - **Past Actions**: Not revisited; amendments apply prospectively.  
  - **Grounded by Drafting**: Yes (e.g., adding a termination condition to a loop).  

  ---

  ### Worked Examples  

  | Rule | Label           | Action                     | Basis              | Contested? |  
  |------|-----------------|----------------------------|--------------------|------------|  
  | R3   | Settled-True/False | Enforce/Do not enforce | Text (facts given) | No         |  
  | R14  | Circular        | Suspend                   | Theory (self-loop) | [contested] |  
  | R22  | Circular        | Suspend                   | Text (self-ref.)   | No         |  
  | R30  | Circular        | Suspend                   | Theory (self-loop) | [contested] |  
  | R5   | Circular        | Suspend                   | Theory (R5↔R6 loop)| No         |  
  | R6   | Circular        | Suspend                   | Theory (R5↔R6 loop)| No         |  

  - **R14 (Committee’s Unwanted Outcome)**: Labeled **Circular** and suspended, despite being drafted as a "tidy" clause.  

  ---

  ### Where the Procedure Fails: Human Intervention  
  - **Trigger**: Status is **Ambiguous**, **Circular**, or **Requires-Facts** with high-stakes default.  
  - **Who**: General counsel’s office (policy) or hearing officer (fact-specific cases).  
  - **Decision**:  
    - **Ambiguous/Circular**: Policy fix (redrafting).  
    - **Requires-Facts**: Fact determination (e.g., "Did the claimant receive notice?").  
  - **Misfires**:  
    - **Over-suspension**: Benign loops (e.g., "all rules are in force unless amended") labeled **Circular**.  
    - **Default rigidity**: **Requires-Facts** defaults may conflict with legislative intent.  

  ---

  **Summary**: This procedure detects and contains circular/ambiguous rules to preserve engine integrity; its largest limitation is suspending all loops—even those with intuitive resolutions.
