answer: |-
  ## The Structure of the Norm of Assertion

  Forget the simple slogans like "you must know what you assert" or "assert only what is true." The core problem about the "norm of assertion" – the rule governing what makes saying something okay – is more intricate. It involves understanding *what kind of job* a rule is trying to do and *how different situations test its limits*. Here’s a breakdown:

  **1. Two Jobs for a Rule: Licensing vs. Underwriting Reliance**

  Imagine a rule like "Only assert things you know" or "Only assert true things." Such a rule might be trying to do two distinct things:

  *   **Licensing the Assertion:** This answers the question: **"Am I, the speaker, allowed to say 'P' *at all*?"** The rule sets the bar for what makes *uttering the words* permissible *for me*. For example, a "knowledge" rule says I'm only licensed to assert P if I know P.
  *   **Underwriting Reliance:** This answers the questions: **"Can my audience safely take P on my word? If P turns out false, was I wrong to offer it, and must I take it back?"** This rule governs the *social transaction* – the promise or guarantee implicit in saying "P is so, trust me." For example, a "truth" rule underwrites reliance by guaranteeing P *is* true.

  **Why might a rule work for one job but not the other?**

  *   **Licensing Needs Manageability:** Rules like "justification" (having good evidence) or "belief" (being confident) seem good for licensing. They focus on the speaker's *state of mind* at the time of speaking, which is something the speaker can reasonably assess and control.
  *   **Underwriting Needs Security:** Rules like "truth" or "knowledge" seem better for underwriting reliance. They offer the audience a stronger guarantee about the *content* of what's said. "Justification" alone doesn't guarantee truth, and "belief" alone might be misplaced.

  **A Case Where They Pull Apart: The Well-Evidenced Falsehood**

  *   **Scenario:** A leading medical researcher, based on overwhelming, peer-reviewed evidence from multiple labs, asserts: "Drug X causes rare side-effect Y." Years later, it's discovered the original studies contained an undetectable error – Drug X *doesn't* cause Y. The researcher was supremely justified and believed it passionately.
  *   **Licensing:** Did the researcher do anything wrong *by asserting*? A justification rule (or belief rule) says *no*. They met their obligation *as a speaker* – they had excellent evidence. Licensing seems satisfied.
  *   **Underwriting Reliance:** Can the audience rely on this assertion? Clearly not – it's false. Patients avoiding Drug X based on this were misled. If the researcher *must* withdraw the claim upon discovering the error, it suggests the initial assertion didn't fully underwrite reliance. A truth rule (or knowledge rule) highlights this failure. The jobs conflict: Licensing seems okay, but underwriting failed.

  **2. The Acid Test Cases: False Confidence & Unbelieved Truth**

  Any proposed rule must handle these challenging situations:

  *   **Case A: Confidently Held, Well-Evidenced, But False (Like the researcher above)**
      *   **Truth Rule:** This *is* an assertion, but it's **defective** (violates the rule). The researcher **wrongs the audience** by asserting falsehood.
      *   **Belief Rule:** This *is* an assertion and **not defective** (they believed it). **No one is wronged** by the assertion itself (though the falsehood might cause harm).
      *   **Justification Rule:** This *is* an assertion and **not defective** (they were justified). **No one is wronged** by the assertion itself.
      *   **Knowledge Rule:** This *is* an assertion but **defective** (they didn't *know* it). The researcher **wrongs the audience** by asserting without knowledge.
      *   **Certainty Rule:** This *is* an assertion but **defective** (they weren't *absolutely* certain, nor could they be). The researcher **wrongs the audience**.
      *   **Genuine Difficulty:** This case is *genuinely difficult* for **Truth** and **Knowledge** rules. It seems harsh to say the careful, justified researcher *wronged* anyone by speaking responsibly. It's only *apparently difficult* for Belief and Justification rules – they easily say it's okay. Certainty struggles because genuine certainty is often impossible.

  *   **Case B: True But Not Believed (Spokesperson, Liar, Actor)**
      *   **Scenario:** A corporate spokesperson reads a true statement prepared by the PR team: "Our product is safe." They personally distrust their company and don't believe it. Or, a liar accidentally tells the truth ("I didn't eat the cookies!" when they actually didn't). Or, an actor on stage says, "The king is dead," which happens to be true off-stage.
      *   **Truth Rule:** This *is* an assertion and **not defective** (it's true!). **No one is wronged** by the assertion itself.
      *   **Belief Rule:** This *is* an assertion but **defective** (they didn't believe it). The speaker **wrongs the audience** (by misleading them about their belief).
      *   **Justification Rule:** The spokesperson *might* be justified (if the report is reliable) but doesn't believe it – **defective?** (Debatable). The liar/actor lack justification *for the truth they utter* – **defective.** **Wrongs the audience?** (Likely, due to insincerity/lack of justification).
      *   **Knowledge Rule:** This *is* an assertion but **defective** (they don't *know* it, lacking belief/justification). The speaker **wrongs the audience**.
      *   **Certainty Rule:** **Defective** (no belief/certainty). **Wrongs the audience.**
      *   **Genuine Difficulty:** This case is *genuinely difficult* for the **Truth** rule. It seems deeply problematic that the insincere spokesperson or the liar who accidentally tells the truth did *nothing wrong* according to this rule. It's only *apparently difficult* for Belief, Justification, Knowledge, and Certainty rules – they all clearly flag the assertion as defective due to the speaker's lack of proper commitment/state.

  **3. Reframing: Governing the Invitation, Not the Speaker**

  Instead of a rule dictating "When can *I* speak?", think of assertion as making an *invitation*: "To assert that P is to invite your audience to rely on your word for P." The norm then becomes: **"When is this invitation *in order*?"**

  *   **What This Changes:** It shifts focus directly to the *reliance* aspect and the *social relationship* between speaker and audience. The core question isn't just about the speaker's internal state or the world's state, but about the *appropriateness of offering this specific guarantee* to *this audience* in *this context*.
  *   **Impact on Knowledge:** This reformulation often **makes the knowledge condition *more* attractive.** Why? Because "I invite you to rely on my word that P" strongly implies "I put myself on the hook for P being true *and* I stand behind my ability to back it up." Knowledge captures this dual aspect (truth + strong epistemic position) better than truth alone (ignores the speaker's role) or justification/belief alone (ignores truth). An invitation to rely based *only* on belief or justification feels weaker and riskier than one based on knowledge.
  *   **Wronged or Merely Disappointed?** Imagine relying on the researcher's well-evidenced but false assertion about Drug X.
      *   Under an **invitation framework**: If the norm requires *knowledge* for the invitation to be in order, then the researcher issued an invitation they *shouldn't have*. You were invited to rely under false pretenses – you were **wronged** because the invitation itself was improper.
      *   If the norm only requires *justification*, the researcher issued an invitation that *was* in order (they met their epistemic duty). You relied and were disappointed, but you weren't **wronged** by the *invitation* itself; you suffered bad luck despite the speaker acting responsibly. The speaker might still feel obligated to apologize for the *outcome*, but not necessarily for *issuing the invitation*.

  **4. One Substantive Disagreement Resolved: The Duty to Retract**

  A key practical disagreement concerns **when a speaker is obligated to *retract* (take back) a previous assertion** if they later learn it was flawed.

  *   **Disagreement:** Suppose you asserted P yesterday. Today you learn P might be false, or you lose your justification, or you simply stop believing it. Must you publicly retract?
  *   **How the Norm Resolves It:**
      *   **Truth Rule:** Only if P is *actually false* must you retract. If P is true, even if you now disbelieve it or lack evidence, no retraction is needed. (Problematic: imagine a scientist no longer believing their own true, proven theory!).
      *   **Belief Rule:** If you *stop believing* P, you must retract – your current state matters. (Problematic: You might irrationally stop believing a true, well-supported claim).
      *   **Justification Rule:** If you *lose your justification* for P (e.g., key evidence is debunked), you must retract. (Intuitive, but doesn't cover if you *keep* justification but learn P is false).
      *   **Knowledge Rule:** If you *no longer know* P (which happens if P is false, or you lose justification, or lose belief), you must retract. This captures the core idea: You offered an invitation based on knowledge; if that knowledge is gone, the invitation is void, and you must withdraw it to prevent misleading reliance.
      *   **Invitation Framework:** Directly supports the Knowledge Rule view. If you invited reliance based on your knowledge, and you no longer possess that knowledge, the basis for the invitation is gone. Failing to retract leaves a misleading offer of reliance standing, potentially wronging your audience.

  **Why it depends:** The retraction duty flows directly from the *nature of the commitment* made in the original assertion. A Truth rule commits only to the *fact* of P's truth, not your ongoing relation to it. A Belief rule commits only to your *state of mind at the time*. A Knowledge rule, especially under the invitation view, commits to your *authority* on P *at the time*, and implies an ongoing duty to correct that authority if it lapses. The chosen norm dictates what you promised your audience, and thus what you owe them if circumstances change.
