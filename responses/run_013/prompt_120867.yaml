prompt: |-
  Alright, I need a parody document out of you, and I want it to be the kind of thing that makes a value theorist laugh instead of wince.

  Take the role of a philosopher who moonlights as a comedy writer — someone who's taught the transitivity-of-betterness literature and also knows how a real standards lab actually writes. Think carefully about the technical content before you write a single line, because in this piece the jokes have to be load baring. Sketch the sections and the technical beats you want to hit first, then write.

  Here's the setup. Some national metrology institute — invent a name, don't use a real one — has spent decades extending the SI to cover value. In their world "better than" is treated like a measurable quantity, and comparisons are done the way you'd calibrate a ruler: never directly, always through a traceability chain. You don't ask whether outcome A is better than outcome Z. You line up A, B, C, ... Z so that each neighbouring pair differs by a step so small nobody could sensibly say one is worse than the other, and you certify every link against the one before it. Chain's intact, the whole thing traces back to the primary standard locked in a vault. That's the good news.

  The document I want is their annual bulletin reporting what happened when they finally compared the two ends of a certified chain. The finding is a transitivity failure: every step was fine, the chain is fully traceable, and yet the far end is obviously worse than the near end. Write it deadpan — no winking, no "of course, this is absurd" — and let the reader figure out what's being skewered.

  Things the document has to get right, since that's where the humor lives:

  - the premise that no single step is noticeable, and the difference between "better than", "at least as good as", and "just as good as" — which of those is actually broken here, and does the result even show what the bulletin claims it shows
  - the possibility that the failure is in the comparisons rather than in the values, and why the lab's own methodology can't tell the difference
  - why alot of the machinery of rational choice quietly depends on the thing that just failed — a complete transitive ordering, a real-valued representation, expected utility, and the fact that anyone with the preferences the bulletin certifies can be pumped for money all day
  - one dissenting footnote from a rival lab that thinks this is a measurement artefact, and one from somebody who thinks it's a real feature of value and transitivity was always a fiction
  - a short "practical guidance" section for ordinary people: what do you do at the ballot box, in the hospital, at the grocery store, when you can't seperate two options by betterness and you know the endpoints aren't close

  Format: a numbered bulletin, around 700 words, with headers, a tolerances appendix, and the practical-guidance bit. Don't have anyone inside the document notice that the measurement analogy is doing any work. The target is the idea that betterness is a magnitude you can certify, and the habit of settling hard value questions by chaining up a long run of tiny unnoticeable steps.
