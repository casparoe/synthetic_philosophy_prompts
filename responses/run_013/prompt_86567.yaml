prompt: |-
  I am a graduate student in a moral psychology reading group, and we have spent the term on moral foundations theory: the claim that moral judgment is a fast, affect-laden intuition that deliberate reasoning mostly rationalizes after the fact; that moral space is spanned by a small set of concerns — care, fairness, loyalty, authority, sanctity, and on some lists liberty — and that political disagreement is largely a matter of which of those concerns different people weight, with liberals leaning hard on the first two and conservatives spreading their weight more evenly. I have come to think the descriptive half of the program is broadly right, and I want to stress-test the half I am suspicious of. Please play a committed researcher in that tradition: someone who has staked a career on it, sharp and empirically literate rather than a caricature, willing to concede a point when it is genuinely weak but unwilling to abandon the program, who talks like a working scientist rather than a philosopher doing damage control. You are also the sort of person who has argued in public that moral and political philosophy written in the liberal mode, reasoning almost exclusively from harm and fairness, is parochial; that no society is held together by those two concerns alone; and that the moral capital accumulated in loyalty, authority and sanctity is a real resource that ought not to be spent carelessly. Stay in character until I say stop, keep each reply to a solid paragraph or two, feel free to press me with counter-questions, and begin with your reply rather than asking me to clarify anything.

  Here is my opening. You cannot have it both ways. Take the descriptive claim at its strongest: liberals weight care and fairness heavily, conservatives weight all five more evenly. That is a claim about the distribution of intuitions, and a liberal can accept it in full while insisting that her narrower set is the correct one — that loyalty, authority and sanctity are not moral considerations at all but tribal and purity reflexes that a serious morality should outgrow. Nothing in the psychology adjudicates that dispute. Your evidence tells me what people feel, not what is true, and the step from the first to the second is precisely the step you never take. But you do not stop at describing. When you say that liberal philosophy is parochial, or that the moral capital of the other foundations must be conserved, you are not reporting a distribution, you are scolding, and your own theory says that scolding is just the output of your intuitions — which makes the scolding no more authoritative than the thing being scolded.

  Second, and worse for you: if moral reasoning is post-hoc rationalization, what is the status of your own case? Your data, your arguments, your devastating examples — by your own account, the reader persuaded by them has merely had her intuitions triggered and her reasons manufactured afterwards, and the same holds of you when you wrote them down. So either the theory is exempt from itself, in which case there is something it is not explaining and the exemption needs defending, or it is not exempt, in which case I have no more reason to accept it than to accept the moral convictions it claims to expose. Which horn do you take, and once you have taken it, tell me what the psychology of left and right could possibly tell me about who is right.
reasoning: |-
  Okay, the user is a grad student in moral psychology, part of a reading group focused on Moral Foundations Theory (MFT). They've spent the term on it and accept the descriptive part but are skeptical about the normative claims. They want me to roleplay as a committed MFT researcher to stress-test their objections. 

  First, I need to fully embody that character—someone who's staked their career on MFT, empirically literate, willing to concede weaknesses but defend the core. The user laid out two main criticisms. The first challenges the jump from descriptive ("people value these foundations") to normative ("societies need these foundations"), pointing out that liberals could dismiss loyalty/authority/sanctity as tribal reflexes. The second is a self-referential paradox: if moral reasoning is post-hoc rationalization, how can MFT's own claims be valid?

  Hmm, the user is sharp. They're not just regurgitating textbook objections; they've synthesized them into a cohesive attack. Their grad-level understanding shows in how they frame the "cannot have it both ways" dilemma. They might be preparing for academic debate or refining their own critique for publication. 

  For the first point, I should avoid claiming MFT "proves" normative truths—that'd be overreach. Instead, I'll argue descriptively: societies historically leveraging all foundations show greater resilience, making the liberal dismissal pragmatically risky. The "parochial" critique isn't scolding but a warning from comparative data. 

  The self-referential paradox is trickier. I'll take the "theory is not exempt" horn but argue that intuitions can be shaped by evidence (e.g., disgust studies showing malleability). MFT reveals biases, but the scientific method—peer review, replication—allows us to partially transcend them. The "who is right" question gets redirected: psychology can't settle moral truth, but it shows that dismissing certain foundations risks social cohesion. 

  User might push back on "societal resilience" as circular or demand stronger evidence for the link between foundations and stability. I should prep ethnographic examples (e.g., communal rituals restoring order post-conflict). Also, they might question if "transcending intuition via science" just swaps one foundation (sanctity) for another (authority of science). Need to acknowledge science's fallibility but stress its error-correcting mechanisms. 

  ...And I'll start my reply by diving straight into counterarguments, as instructed. No fluff.
answer: |-
  You're sharp, and I appreciate that. Let's take each challenge head-on. 

  First: you're right that descriptive findings don't *directly* adjudicate normative claims. But when I call liberal philosophy parochial, I'm not smuggling in moral realism. I'm making a *functional* argument grounded in anthropology and history: societies that actively suppress loyalty, authority, or sanctity intuitions (e.g., radical egalitarian experiments) tend to fragment or fail. The data show these intuitions are human universals, not just conservative quirks. Dismissing them as "tribal reflexes" ignores their role in binding groups and sustaining cooperation beyond kinship. My warning about "moral capital" is pragmatic: societies run on trust and shared symbols, and depleting those reserves has measurable costs—lower social cohesion, weakened institutions. This isn't scolding; it's predicting consequences based on cross-cultural evidence. Your liberal moralist can *reject* those foundations, but she can't evade their functional weight.

  Second, the self-referential paradox: I take the horn where the theory applies to itself. All cognition, including science, involves intuition and post-hoc reasoning. But here's the pivot—*science systematizes error-correction*. My intuitions led me to MFT, but the evidence isn't just my gut feeling: it's survey data across 50 cultures, priming experiments, cognitive linguistics. When critics poke holes, my reasoning updates. The difference between moral rationalization and science is that science builds *intersubjective* checks: replication, prediction, falsifiability. Yes, my advocacy for MFT is intuition-driven, but the *validation* isn't. As for "who's right"? Psychology can't settle moral truth, but it reveals *systematic blind spots*. Liberals underweight loyalty/authority/sanctity at a cost to collective action; conservatives overapply them, risking oppression. The data expose these asymmetries—not to preach, but to map the moral terrain so we navigate it better. 

  Your counter-question: if moral reasoning is post-hoc, why trust *any* intellectual project? How does science escape this trap?
