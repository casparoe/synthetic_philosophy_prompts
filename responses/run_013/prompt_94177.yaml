prompt: |-
  I am a third-year PhD student in distributed systems and causal inference. I can follow the standard Bell/EPR proof, but I do not have a settled understanding of what the locality assumption is actually doing. I would like you to restate Bell's theorem and the locality assumption in the vocabulary I actually use — nodes, local state, message-passing, shared randomness, latent common causes, d-separation (the standard graphical conditional-independence criterion), interventions, ignorability, and no-signaling — as faithfully as you can, and then tell me what does not survive the translation. Set up the standard two-node Bell scenario as a causal model: a source distributes some shared state, each node receives a setting, and each produces an outcome. Then answer four things. First, what does the Bell inequality become as a constraint on the joint distribution of outcomes given settings and the shared state? Second, which of my standard assumptions correspond to Bell's assumptions — locality, parameter independence, outcome independence, measurement independence, counterfactual definiteness — and which correspond only by fiat? Third, what is no-signaling in my vocabulary, and why is it compatible with a Bell violation? Fourth, and most important, the residue: which parts of the philosophical debate about locality have no counterpart in my vocabulary, and is that because my vocabulary is missing something — perhaps a notion of causal explanation that is not merely a joint distribution — or because the philosophical debate is less substantive than it looks? I am especially interested in whether a shared random seed is just a common cause in the causal-graph sense; if it were, Bell's theorem would be false, so either the source is not a common cause in my sense or my sense is too thin. I also want to know what superdeterminism looks like in my vocabulary: is it simply a violation of ignorability, and if so, why do physicists treat it as more radical than ordinary confounding? Be precise about where the translation distorts, and do not smuggle in assumptions from my framework and call them translations. No bibliography or citations are needed; I want the conceptual mapping and the residue.
