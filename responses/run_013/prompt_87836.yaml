  The user's deeper need might be clarity to break their group's cycle. They want to identify which requirements are essential and where the real tensions lie. Highlighting the grounding problem as the key obstacle could help them focus discussions. Also, explaining why some requirements are non-negotiable for Molinism versus other frameworks. 

