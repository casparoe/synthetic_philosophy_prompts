  Below is a designed game for your reading group, structured to induce tension around expected value fanaticism. It includes all your requirements: pre-commitment to a rule, a ladder of bets with real resolutions, aggregate vs. one-shot tension, a Pascal's Mugging finale, and a debriefing plan. Total runtime: 85-90 minutes.

  ---

  ### **Game Title: The Ladder of Fanaticism**  
  **Participants**: 14 PhD students  
  **Format**: Facilitator-led, anonymous participation (use numbered index cards)  
  **Materials**:  
  - Index cards for anonymous choices/rules  
  - Random number generator (RNG) for draws  
  - Whiteboard for tracking points  
  - Timer  

  ---

  ### **Game Structure**  
  #### **Phase 0: Rule Commitment (5 min)**  
  - **Instructions**: "Write a rule for when you’ll take a risky bet over a sure thing. Use this template: *‘I will take any bet with probability above \[ \_\_\_ \]% OR expected value above \[ \_\_\_ \]× the sure thing.’* No other constraints. Keep it anonymous."  
  - **Why**: Forces explicit commitment. Predict most will set probability floors (e.g., 0.1%) or EV multipliers (e.g., 1.1×).  

  #### **Phase 1: The Ladder (30 min)**  
  - **Setup**: 6 rungs of choices between:  
    - **Option A**: Sure thing (100 points)  
    - **Option B**: Risky bet (probability `p` of winning `X` points, else 0)  
    | Rung | `p`       | `X`          | EV (vs. 100) | Resolve? |  
    |------|-----------|--------------|--------------|----------|  
    | 1    | 1/2       | 200          | 100          | No       |  
    | 2    | 1/10      | 1,000        | 100          | **Yes**  |  
    | 3    | 1/1,000   | 100,000      | 100          | No       |  
    | 4    | 1/10,000  | 1,000,000    | 100          | **Yes**  |  
    | 5    | 1/10¹⁰⁰   | 10¹⁰²        | 100          | No       |  
    | 6    | 1/10¹⁰⁰⁰⁰ | 10¹⁰⁰⁰²      | 100          | No       |  

  - **Process**:  
    1. **Rungs 1-6**: Present each rung for 3 min. Participants write "A" or "B" on cards.  
    2. **Resolve Rung 2 (p=1/10)**:  
       - Use RNG (1-10). If "1", all who chose B win 1,000 points.  
       - *Outcome*: Likely 1–2 winners. Non-participants (A-choosers) get 100 but see winners gain 10× more.  
    3. **Resolve Rung 4 (p=1/10,000)**:  
       - Use RNG (1-10,000). If "777" (or similar), B-choosers win big.  
       - *Outcome*: Almost certainly no winners. B-choosers get 0; A-choosers get 100 and "look smart."  

  - **Why this works**:  
    - Rung 2 makes B-choosers feel smart; Rung 4 makes them feel foolish.  
    - Rungs 5–6 are too extreme to resolve but illustrate the absurdity (EV equivalence with near-zero probability).  
    - Participants’ own rules force them into untenable choices (e.g., if they set `p_min = 0.01%`, Rung 4 triggers regret).  

  #### **Phase 2: Aggregate vs. One-Shot Tension (10 min)**  
  - **Scenario**: "You’re a policymaker for 1,000 people. Each faces one independent trial of Rung 4’s bet (1/10,000 chance of 1M points vs. 100 sure). Choose for all:"  
    - **Policy A**: All get 100 points (total: 100,000).  
    - **Policy B**: All take the risky bet.  
  - **Reveal the math**:  
    - EV of Policy B: 1,000 × 100 = 100,000 (same as A).  
    - But variance: 63% chance of ≥1 winner (expected winners: 0.1). If 1 person wins, total = 1,000,000 >> 100,000.  
  - **Tension**: In aggregate, B is compelling (huge upside, no aggregate risk). Contrast with one-shot Rung 4, where B felt reckless.  

  #### **Phase 3: Pascal’s Mugging (15 min)**  
  - **Setup**: Facilitator plays "mugger." Participants start with 500 points.  
  - **Process**:  
    1. Mugger: "Pay me 100 points for a 1/1,000,000 chance at 1,000,000 points." (EV = 1, net gain = +0.9×)  
    2. If anyone pays, escalate: "Pay another 100 to increase the prize to 10,000,000." (EV = 10) → "Pay 100 more for 100,000,000." (EV = 100) → etc.  
    3. After 3–5 escalations, resolve the initial bet with RNG. Almost certainly no one wins.  
  - **Why**: Illustrates the slippery slope of EV fanaticism. Players "waste" points chasing microscopic chances.  

  ---

  ### **Debrief (30 min)**  
  **Map each phase to the core problem**:  
  1. **The Ladder**: Shows EV equivalence across probabilities. Rung 2–4 resolutions make regret visceral.  
  2. **Aggregate vs. One-Shot**: Highlights inconsistency—no rule works for both.  
  3. **Mugging**: Demonstrates exploitability of EV maximization.  
  4. **Infinite Payoffs**: Whiteboard extension: If `X = ∞`, any `p > 0` dominates finite sure things.  

  **Predictable Weasel-Outs & Responses**:  
  - **"The huge payoffs aren’t real!"**  
    → *Response*: "True, but ethics often deals with unobservables (e.g., large future impacts). Assume payoffs are real here."  
  - **"I’d reject low probabilities entirely!"**  
    → *Response*: "Your pre-commitment rule didn’t allow that. Why set arbitrary floors?"  
  - **Refusal to engage on extreme rungs**  
    → *Response*: "If you abandon EV here, what’s your alternative? Bounded utility? Risk sensitivity?"  
  - **Regret in resolved rounds**  
    → *Response*: "This is hindsight bias. EV maximizers ignore outcomes, only probabilities."  

  **Why This Works**:  
  - Participants *feel* the absurdity (Rung 4 losses, mugging waste) and tension (aggregate vs. one-shot).  
  - Pre-commitment forces confrontation with rules.  
  - Anonymity reduces ego-driven choices.  

  **Troubleshooting**:  
  - If students disengage during extreme rungs: Focus discussion on Rungs 2–4 and the mugging.  
  - If rule-setting is vague: Provide examples ("e.g., p_min = 0.1%").  

  ---

  ### **Timeline**  
  - Phase 0: 5 min  
  - Phase 1: 30 min (5 min/rung, 5 min resolution)  
  - Phase 2: 10 min  
  - Phase 3: 15 min  
  - Debrief: 30 min  
  **Total**: 90 min  

  This design ensures participants viscerally grapple with fanaticism’s pull and pitfalls, priming deep discussion. Let me know if you want tweaks!
