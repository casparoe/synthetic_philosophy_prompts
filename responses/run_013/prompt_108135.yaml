prompt: |-
  Ok, I need a case for my metaethics reading group next week. We're doing the internalism/externalism thing about reasons — Williams-ish internalism (you have a reason only if a sound deliberative route leads there from your existing motivational set) vs Parfit-ish externalism (facts give reasons, no motivational route required). Everyone is sick of the gin and tonic, the petrol, the wife-beater and the future-Tuesday guy, so I need soemthing new: build me a scenario where the internalist has to say "no reason" and the externalist has to say "there is a reason."

  Constraints, because otherwise it's too easy:

  - Realistic and contemporary, ordinary people, no sci-fi, no brainwashing or outside manipulation of his desires. One or two paragraphs.
  - The agent is fully informed, means-end coherent, no weakness of will. His practical reasoning is impeccable — whatever is off is upstream of it.
  - The reason at stake can't be a moral reason or a reason concerning his own future well-being. Those are the cheap routes and I want the case to work with something else. (If what you land on is borderline moral, say so and explain what that does to the case.)
  - Don't just stipulate that there's no deliberative route — make that fall out of an actual account of what a sound route is (imagination, self-criticism, whatever you think belongs in it). Then tell me how a Williams-style internalist would attack the case anyway, and whether that counter-move makes internalism unfalsifiable.

  Then: state the verdict and the reasoning for each side, tell me which single feature of the case is doing the work and what happens if you remove it (does it just collapse back into the wife-beater case?), and whether the whole thing can be defused by the "the two sides mean different things by 'reason'" move.

  And please separate what's actually settled here from what's genuinely contested among people who work on this. I'm going to say something out loud in the group based on this, so I don't want a contested reading of Williams or Parfit sold to me as the consensus.
reasoning: |-
  Okay, let me approach this step by step. The user needs a fresh case study for their metaethics reading group on internalism vs externalism about reasons, with very specific constraints. 

  First, I need to understand the core challenge: creating a scenario where internalism clearly says "no reason" and externalism says "there is a reason", avoiding tired examples like gin/petrol while meeting all constraints.

  The key constraints are:
  - Realistic contemporary setting, ordinary people
  - Agent is fully informed and rational
  - Reason can't be moral or self-interested
  - Must derive "no deliberative route" from sound deliberation theory
  - Need to anticipate internalist counter-moves
  - Clarify genuine philosophical disputes

  Hmm... most classic non-moral reasons involve prudence or aesthetics. Since future well-being is excluded, maybe something about personal integrity? But that borders on moral. What about... familial obligations? No, Williams already handles that. 

  Wait - what about epistemic reasons? The domain of belief formation might work. Consider a historian confronted with inconvenient evidence about their ancestor. 

  Developing this:
  - Protagonist: Academic historian
  - Conflict: Discovering beloved grandfather collaborated with oppressive regime
  - Motivational set: Deep family loyalty, professional integrity
  - Key point: No conflict in current motivations because loyalty overrides truth-seeking in personal matters
  - Deliberative route: Imagination shows this truth would shatter identity, no motivation to pursue it

  This satisfies:
  - Realism: Common cognitive dissonance in historical research
  - Non-moral: Truth-seeking as epistemic reason
  - Sound deliberation: Imagination reveals destructive consequences
  - Internalist verdict: No reason to seek truth here
  - Externalist verdict: Factual truth provides reason regardless

  But is epistemic reason "borderline moral"? Need to address that. Also must show why loyalty motivation blocks deliberative route - not weakness of will but protective identity mechanism.

  For internalist counter-move: They might argue "correctly imagining" should include accepting uncomfortable truths. But this risks making internalism unfalsifiable by redefining deliberation.

  The crucial feature is the identity-protective motivation. If removed, it collapses to standard cases. 

  On "different meanings of reason": Yes, that could defuse it, but the debate is precisely about whether reasons must be motivationally grounded.

  Genuine controversies: 
  - Scope of sound deliberation (Williams was vague)
  - Whether epistemic reasons count as "practical reasons"
  - How identity-constituting commitments function in motivation

  The case should expose these fault lines without pretending they're settled.
answer: |-
  Here's a case meeting your constraints, designed to force the internalism/externalism split cleanly over a non-moral, non-prudential reason:

  **The Case: The Historian's Grandfather**  
  Levi is a respected historian specializing in colonial-era trade. While meticulously digitizing his late grandfather's personal journals for a family archive project, he discovers cryptic entries suggesting his grandfather—a beloved community figure—secretly collaborated with an oppressive colonial administrator to sabotage rival businesses, leading to several families' ruin. Levi is deeply proud of his family's legacy of integrity. His motivational set includes: (1) a profound commitment to historical truth as an academic, (2) strong loyalty to family identity/narrative, and (3) a desire to protect living relatives from distress. He is fully informed about the journals' context and has impeccable reasoning skills.  

  Levi imagines verifying the entries: contacting archives, cross-referencing shipping logs. He acknowledges this could confirm the truth but sees no positive outcome. It would shatter his family's self-conception, devastate his elderly aunt (who idolized her father), and tarnish a community symbol. His loyalty and protective instincts wholly overpower his academic drive *in this personal context*. No sound deliberative route (including imaginative rehearsal or self-criticism) generates motivation to investigate, as it would only cause harm to values he holds dear. Yet the *fact* that his grandfather might have been complicit exists independently.

  ---

  ### Verdicts & Reasoning  
  1. **Williams-style Internalist Verdict: NO REASON**  
     - **Why:** A sound deliberative route (Williams' process of testing desires against facts, imagination, and non-impeded reflection) must connect to Levi's "subjective motivational set" (SMS). Here, Levi's SMS—*especially his identity-constituting loyalty*—renders him motivationally inert toward pursuing this truth. Imagination reveals only alienation from his core commitments. No weakness of will or irrationality is present; his reasoning correctly identifies that acting would undermine his deepest values. Internalism thus denies Levi has a reason to seek the truth, as no motivation is or could be produced via sound deliberation.  
     - **Counter-move & Unfalsifiability Risk:** The internalist might argue Levi *does* have a reason if "sound deliberation" requires confronting uncomfortable truths *as a historian*, overriding personal loyalties. But this moves the goalposts: it imposes an external ideal of "proper historicity" onto deliberation. If internalists insist sound deliberation *must* generate motivation in such cases, internalism becomes unfalsifiable—it would define "sound" as whatever yields motivation when we feel there "should" be a reason. Williams avoids this by tethering deliberation to the *actual* SMS.  

  2. **Parfit-style Externalist Verdict: THERE IS A REASON**  
     - **Why:** The factual possibility that Levi's grandfather was complicit gives him a normative reason to investigate, irrespective of Levi's motivations. Truth has intrinsic weight; its value doesn't depend on Levi's contingent feelings about family. Levi's flawless reasoning doesn't negate the reason—it just explains why he’s unmoved. Externalism separates normative reasons (facts) from motivating reasons (psychological states).  

  ---

  ### The Crucial Feature  
  - **What's doing the work:** The **identity-constituting commitment to family loyalty** that *systematically blocks* any motivational pathway to valuing the truth *in this domain*.  
  - **If removed:** If Levi’s loyalty were weaker (e.g., if he were estranged from his family), the case collapses into a standard "petrol" scenario—he’d have *some* motivation to investigate via his academic values, making internalism concede a reason. Here, his SMS is coherent but *insulated* against the external fact.  

  ---

  ### Can "Different Meanings" Defuse the Conflict?  
  Yes—but productively. This case highlights that internalists (Williams) often tie "normative reason" to *agent-relative practical rationality*, while externalists (Parfit) use it for *agent-neutral evaluative facts*. If your group adopts this disambiguation, the disagreement becomes terminological:  
  - Internalism: "There's no *practical reason for Levi* (no motive-generating fact)."  
  - Externalism: "There's a *normative reason* (truth possesses objective value)."  
  But this *is* the core debate: **Must reasons be capable of motivating rational agents?** Internalism says yes; externalism says no. The case forces this divergence without moral/prudential scaffolding.  

  ---

  ### What's Settled vs. Contested  
  - **Settled:**  
    - Williams ties reasons to the agent's SMS + sound deliberation.  
    - Parfit grounds reasons in objective facts.  
    - Both agree Levi feels *no motivation*.  
  - **Genuinely Contested (Avoid claiming consensus!):**  
    - **Scope of "sound deliberation":** Does it include radical perspective-taking (e.g., "What would an impartial historian do?")? Williams is vague, leading to interpretive disputes.  
    - **Epistemic vs. Practical Reasons:** Is "seeking truth" here a *practical* reason? Externalists say yes; some internalists argue epistemic reasons aren't "reasons for action" in Williams' sense.  
    - **The Externalist's Burden:** Can externalists explain *why* Levi *should* care without smuggling in morality/prudence? Parfit might appeal to "reason-fundamentalism," but this is hotly debated.  

  **Use this in your group:** Frame the case as exposing *whether normative reasons require a motivational anchor*. Point out that internalism’s counter-move risks vacuity unless "sound deliberation" is held to a pre-theoretical standard. Highlight the epistemic reason angle as fertile ground—it’s less trodden than moral cases.
