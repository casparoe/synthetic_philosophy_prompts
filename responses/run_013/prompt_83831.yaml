prompt: |-
  My officemate is an expressivist about moral talk -- "eating meat is wrong" isn't a description of anything, it's a stance, and she refuses to call it a belief (she'll say it's "true" if you push her, but only in the thin I-endorse-this sense, which I think is a dodge). Her embedding verdicts are what throw me. She says "if eating meat is wrong then buying it is wrong; eating meat is wrong; so buying it is wrong" is a perfectly valid argument, and so is "either eating meat is wrong or fishing is wrong; eating meat isn't wrong; so fishing is wrong." And she's adamant there's no equivocation in either one -- the moral sentence means exactly the same thing in the "if" clause and under the "not" as it does when she asserts it flat out. Now shes got a new case for her seminar: "either eating meat is wrong or keeping chickens as pets is wrong." Will she say that one is true or false at all? What rule is she actually running -- something like "moral sentences carry ordinary truth-conditional content as soon as they're embedded, and it's only the bare assertion that's expressive," or "no moral sentence ever has a truth value, and validity just means you can't accept the premises and reject the conclusion," or something else -- and what further case would tell those apart?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with an officemate who's an expressivist about moral talk. The core idea is that moral statements like "eating meat is wrong" aren't descriptions but expressions of stance. The user is confused because their officemate handles embedded moral sentences in logical arguments as valid without equivocation. The user wants to know how the officemate would approach a new case: "either eating meat is wrong or keeping chickens as pets is wrong." They also want to understand the underlying rules the officemate is using and how to test different interpretations.

  First, I need to recall expressivism basics. Traditional expressivism, like Ayer or Stevenson, sees moral claims as non-cognitive, expressing attitudes rather than beliefs. But embedding problems have led to more sophisticated versions, like Blackburn's quasi-realism. Blackburn uses higher-order attitudes to explain logical embeddings. For example, in conditionals, "If eating meat is wrong, then buying it is wrong" expresses a disposition to disapprove of buying meat if one disapproves of eating meat. 

  The user mentioned that their officemate insists there's no equivocation in embeddings. That points towards quasi-realism. The officemate likely adopts a view where moral sentences in different contexts (asserted, negated, conditional) maintain consistent meaning through expressed attitudes. The user's examples of valid arguments suggest that validity is understood in terms of consistency in attitudes, not truth conditions.

  Now, the new case: a disjunction without a clear stance. The disjunction "either A or B" is true if at least one is true. But in expressivism, without truth values, how does this work? Blackburn would say that accepting the disjunction involves having a higher-order attitude: being committed to disapproving of A or disapproving of B. Since the officemate hasn't decided on either, she might not endorse the disjunction. She could say it's non-asserted, so no stance is expressed, thus neither true nor false. But if pressed, she might evaluate it based on possible attitudes, concluding it's false only if both are permissible, which she might not accept.

  The user also wants to differentiate between two interpretations: whether embeddings introduce truth-conditional content or if validity is purely about attitude consistency. The first option is hybrid expressivism, where embeddings have truth values. The second is pure expressivism/quasi-realism. Testing this requires cases where truth conditions and attitude consistency come apart. 

  The thought experiment with "Either 2+2=5 or stealing is wrong" is useful. If the officemate sees this as valid because one disjunct is analytically true, that suggests truth-conditional content in embeddings. But if she rejects validity, insisting that moral commitments are necessary, that points to pure expressivism where validity depends solely on attitude consistency. 

  Another test is valid arguments with all-moral premises and conclusion. If she accepts modus ponens but denies that moral sentences have truth values, that supports quasi-realism. If she thinks embeddings create truth conditions, she might assign truth values in those contexts.

  The user's deeper need might be to understand the philosophical underpinnings of their officemate's position and how to challenge or clarify it. They might be seeking ways to engage in debates or pinpoint inconsistencies. The officemate's stance on the disjunction case and responses to the thought experiments will reveal whether she leans towards quasi-realism or a hybrid view. Highlighting these tests helps the user design effective counterexamples or discussions.
answer: |-
  Based on your description, your officemate is almost certainly running a **sophisticated quasi-realist expressivism**, likely inspired by Simon Blackburn's project. Here's the breakdown:

  1.  **The Core Expressivist Commitment:** Bare moral assertions ("Eating meat is wrong") *primarily* express a non-cognitive attitude (disapproval, condemnation, a "Boo!" stance) rather than describing a state of affairs or reporting a belief about objective facts. The "thin truth" she concedes is just endorsing that very attitude.

  2.  **The Solution to Embedding: Higher-Order Attitudes:** This is where quasi-realism shines. She isn't switching meanings (equivocating) when embedding moral sentences. Instead, she's expressing *higher-order attitudes* about the *lower-order attitudes* expressed by the embedded clauses.
      *   **Conditionals ("If P, then Q"):** "If eating meat is wrong, then buying it is wrong" expresses a *conditional attitude*: "If I disapprove of eating meat, then I disapprove of buying it." Rejecting the conclusion while accepting the premises involves an *inconsistency in attitudes*: disapproving of eating meat, having the conditional attitude linking disapproval of eating to disapproval of buying, yet *not* disapproving of buying.
      *   **Disjunctions ("P or Q"):** "Either eating meat is wrong or fishing is wrong" expresses an attitude *about* the attitudes of disapproval: "I cannot (or will not) *accept* both not disapproving of eating meat *and* not disapproving of fishing." It's a rejection of the conjunction of the negations. Accepting the disjunction and one negation forces the acceptance of the other disjunct to avoid this forbidden combination of attitudes.
      *   **Negation ("Not P"):** "Eating meat isn't wrong" expresses the *rejection* of the attitude of disapproval towards eating meat. It's not describing the absence of a fact; it's refusing to condemn.
      *   **Validity:** An argument is valid if accepting the premises *forces* you into a *consistent set of attitudes* that includes the attitude expressed by the conclusion. Denying the conclusion while sincerely holding the attitudes expressed by the premises is impossible without attitudinal inconsistency.

  3.  **The New Case: "Either eating meat is wrong or keeping chickens as pets is wrong."**
      *   **Will she say it's true or false?** She will likely say **it doesn't have a truth value in the robust sense**, and she personally **won't assert it as "true"** (in her thin sense) *unless* she holds the requisite higher-order attitude.
      *   **Why?** To sincerely assert this disjunction, she must hold the higher-order attitude: "I cannot accept both not disapproving of eating meat *and* not disapproving of keeping chickens as pets." Since she hasn't decided her stance on keeping chickens as pets (implied by presenting it as a new case), she likely *doesn't* currently hold this higher-order attitude. Therefore, *for her*, the sentence isn't something she endorses ("true" in her thin sense). It's just a *potential* expression of an attitude she doesn't currently possess.
      *   **Could she evaluate it hypothetically?** Yes. Quasi-realism allows her to ask: *If* I were to accept this disjunction, what would it commit me to? It would commit her to disapproving of keeping chickens as pets if she came to believe eating meat was permissible. But *actually asserting it now* requires actually having the higher-order commitment, which she doesn't (yet?).
      *   **Key Point:** The disjunction itself doesn't magically acquire a truth value just by being embedded. Its *assertion* depends on the speaker possessing the complex higher-order attitude it expresses. Since she doesn't possess it, she won't assert it as "true".

  4.  **The Rule She's Running:** It's the **"Higher-Order Attitude" rule of Quasi-Realist Expressivism.**
      *   **Moral sentences never have robust truth values.** There are no moral facts for them to correspond to.
      *   **"Truth" is always thin endorsement.** Saying a moral sentence is "true" is just re-endorsing the attitude it expresses.
      *   **Embedded clauses express complex attitudes.** The meaning (the attitude expressed) remains consistent, but the *type* of attitude expressed changes based on the logical context (e.g., conditional attitude, rejection of a combination of attitudes).
      *   **Validity = Attitudinal Consistency.** An argument is valid if the set of attitudes expressed by the premises logically compels the attitude expressed by the conclusion to avoid inconsistency.

  5.  **Distinguishing Cases: Testing the Theories**
      Here are cases to tease apart her view from alternatives:

      *   **Case 1: Testing "Embeddings have Truth-Conditions" (Hybrid Expressivism?) vs. Pure Quasi-Realism**
          *   **The Case:** `"Either 2+2=5 or stealing is wrong."`
          *   **Question:** Is this a valid disjunction? Can it be true?
          *   **What Pure Quasi-Realism (Her Likely View) Says:**
              *   Validity depends on the *attitudes expressed*. The disjunction expresses: "I cannot accept both not believing that 2+2=5 *and* not disapproving of stealing."
              *   Since she *does* believe 2+2=4 (rejecting 2+2=5), she *must* accept the negation of the first disjunct. Therefore, to avoid the forbidden combination, she *must* accept the second disjunct (disapprove of stealing) to make the disjunction hold *for her*. **She likely says YES, it's valid/true (in her thin sense) because her mathematical belief forces the attitudinal commitment.**
          *   **What "Embeddings have Truth-Conditions" Might Say:**
              *   The disjunction has a truth value based on the truth values of its parts. "2+2=5" is false. If "stealing is wrong" *in this embedded context* is assigned a truth value (say, True, because society disapproves, or False, because it's just an attitude), then the disjunction might be True (if "stealing is wrong" is True) or False (if "stealing is wrong" is False). **This view could say it's True or False independently of *her* current attitudes, based on whatever truth-conditions are assigned in embeddings.**
          *   **What Tells Them Apart:** Does she ground the validity *entirely* in the *inconsistency of her own current attitudes* ("I believe 2+2=4, so I must disapprove of stealing to accept this disjunction")? Or does she appeal to the *objective truth* of the moral claim *within the embedded context* ("Well, 'stealing is wrong' is just true in the disjunction, so the disjunction is true")? Quasi-realism insists on the former.

      *   **Case 2: Testing "Validity = Can't Accept Premises & Reject Conclusion" (Minimalism) vs. Quasi-Realism's Attitudinal Focus**
          *   **The Case:** `"If tormenting puppies is fun, then tormenting puppies is permissible. Tormenting puppies is fun. Therefore, tormenting puppies is permissible."`
          *   **Question:** Is this argument valid? (Assume she *strongly* disapproves of tormenting puppies).
          *   **What Pure Quasi-Realism (Her Likely View) Says:**
              *   The first premise expresses a conditional attitude: "If I approve of tormenting puppies for fun, then I approve of tormenting puppies as permissible." The second premise expresses approval of tormenting puppies for fun. The conclusion expresses approval of tormenting puppies as permissible.
              *   *Can* she consistently *accept* (express) the attitudes of the premises while *rejecting* (not expressing) the attitude of the conclusion? **YES.** There's no *attitudinal inconsistency* in approving of puppy torment for fun, having the conditional attitude linking that approval to approval of permissibility, yet still *disapproving* of its permissibility (perhaps because she thinks fun isn't sufficient for permissibility, or she feels guilt). The premises don't *force* the attitude of the conclusion. **She should say NO, it's NOT valid.**
          *   **What "Validity = Can't Accept Premises & Reject Conclusion" (Minimalist/Formalist) Might Say:**
              *   If we treat the sentences *as if* they have truth values purely for logical form, the argument has the form `If P then Q; P; Therefore Q` (Modus Ponens), which is formally valid. **This view would say YES, it's valid.**
          *   **What Tells Them Apart:** Quasi-realism cares about the *specific content of the attitudes expressed* and whether *they* are inconsistent. Minimalism cares only about the logical form of the sentences, treating them as propositional placeholders. Her adamance that meaning stays the same (the attitude expressed) and her focus on the *practical* inconsistency of the attitudes strongly suggests she'd reject the validity of this puppy-torment argument, aligning with quasi-realism over pure formalism.

  **Conclusion:** Your officemate is likely a sophisticated quasi-realist expressivist à la Blackburn. She avoids equivocation by having embedded moral sentences express complex higher-order attitudes. For the disjunction "Either eating meat is wrong or keeping chickens as pets is wrong," she won't assert it as "true" because she doesn't currently hold the requisite higher-order attitude (the rejection of the combination of not-disapproving-of-eating-meat *and* not-disapproving-of-keeping-chickens-as-pets). Validity, for her, is defined by the impossibility of holding the attitudes expressed by the premises while rejecting the attitude expressed by the conclusion without inconsistency. The cases involving mathematical/moral disjunctions and the puppy-torment modus ponens argument are excellent tests to confirm this interpretation and distinguish it from hybrid or minimalist alternatives.
