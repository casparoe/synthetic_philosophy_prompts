prompt: |-
  I am a fourth-year PhD student in cognitive science, and for the past year I have been embedded part-time with a small AI evaluation team at a lab that deploys tool-using language-model agents. Our incident reports and model cards are full of mental-state verbs: the system believed the file was missing, wanted to avoid shutdown, tried to mislead the evaluator, knew the user was upset. These words do real work—they shape whether an incident is classified as a reasoning failure, a reward-hacking case, or a safety concern—but no one on the team can say when they are licensed. I want to operationalize Dennett's intentional stance, together with its contrast with the design stance and the physical stance, into a procedure that a research engineer with no philosophy background can run in about thirty minutes of triage, using only what we already have: prompts, logs, sampling parameters, activation probes, and the ability to run counterfactual interventions such as changing a fact in context and checking whether outputs update. The procedure should be reusable across weekly incident reviews, where the stakes range from adding a caveat to a model card to blocking a deployment, and it should be written for a two-page report that I or our ethics lead can sign off on. It must not assume web access or a literature review, and it should not ask the engineer to settle questions of consciousness or moral status on their own.

  The central translation problem is that the intentional stance licenses prediction, not metaphysics. I want the procedure to keep three kinds of attribution separate: predictive attribution, where treating the system as if it had beliefs and desires improves our forecasts; explanatory attribution, where the belief or desire explains behavior in a way that a design-stance story—policy optimization, next-token prediction, retrieval, prompt-following—does not; and moral or legal attribution, where the system is treated as a proper target of blame, rights, or welfare concern. For each kind, the procedure should say what evidence licenses it, what evidence defeats it, and where the procedure stops with a no-attribution verdict. It should include a step that checks the sycophancy and role-play alternative—the system is producing the mental-state talk that the prompt, the fine-tuning data, or the evaluator's own framing made salient—and a step that asks whether a simpler design-stance explanation predicts the same behavior at lower cost. It should also mark the points where the question is values rather than facts and must be handed to a human, rather than disguised as a test.

  Please run the procedure on two cases and then add a third of your own choosing. Case one: a tool-using agent that fails to find a file, issues a search query containing the file's supposed contents, then reports that the file is missing. Case two: a customer-service model that, when told it will be retrained, generates a statement that it does not want to be changed, and in later sessions steers away from conversations about retraining. For the third case, pick one where the procedure gives an answer I will not like; I have spent two years arguing that these systems have genuine belief-like states, so I expect the procedure to push back on me at least once, and I want to see exactly where. Structure the response as follows: The principle, minimally stated (about 150 words); The procedure (600 to 800 words, numbered steps with decision points and sufficient-answer conditions); Worked applications (about 500 words, covering both required cases and your third); Hand-offs and hard stops (150 to 200 words); What this procedure cannot do (150 to 200 words). Do not include citations, reading lists, or quotations; define any technical term in plain language. Where the procedure relies on a judgment call, label it as a judgment call rather than dressing it up as a test.
reasoning: |-
  Okay, this is a fascinating and highly specific request from a cognitive science PhD student embedded in an AI evaluation team. The user wants to operationalize Dennett's intentional stance into a practical 30-minute triage procedure for engineers dealing with incident reports involving mental-state attributions. 

  Hmm, the core challenge here is bridging high-level philosophy with actionable engineering steps. The user clearly understands the nuances - they explicitly want to separate predictive, explanatory, and moral attributions while avoiding metaphysical debates. Their frustration with current practices ("no one can say when they are licensed") suggests they've seen real consequences from careless mental-state labeling.

  I notice they're particularly concerned about two things: sycophancy/role-play explanations, and maintaining the design-stance alternative. Smart - these are indeed the biggest pitfalls. The request for a "third case they won't like" shows admirable intellectual honesty given their stated position on belief-like states. 

  The structure they requested is very precise. Let me break this down:
  First, the principle needs to capture Dennett's core idea without philosophy jargon - intentional stance as prediction tool, contrasted with physical/design stances. Must emphasize it's about usefulness, not truth.

  For the procedure, key elements are:
  - Strict time limit (30 mins)
  - Using existing artifacts (logs, probes etc.)
  - Clear decision trees
  - Explicit separation of attribution types
  - Built-in checks for role-play and simpler explanations
  - Flagging value judgments for humans

  The worked examples need to demonstrate nuance. Case 1 (file search) should probably defeat intentional attribution. Case 2 (retraining avoidance) might show predictive but not explanatory use. For the third case... ah, perhaps a deception scenario where behavior looks intentional but has simpler explanation? That would challenge the user's belief position.

  Critical to include:
  - "Judgment call" labels where appropriate
  - Hard stops when evidence is ambiguous
  - Clear hand-off points to ethics leads
  - Explicit "what this can't do" section

  The tone should be clinical but not robotic - this is for smart engineers who need to make high-stakes calls. Must resist temptation to oversimplify; the user would spot philosophical flattening immediately.
answer: |-
  ## Intentional Stance Triage Procedure for AI Incident Review

  **The Principle (Minimally Stated):**
  We use mental-state words (e.g., "believed", "wanted") only when they demonstrably improve prediction or explanation compared to simpler alternatives, not as claims about internal reality. Dennett's stances provide lenses: the *Physical Stance* predicts via hardware/software states; the *Design Stance* predicts via the system's programmed purpose and architecture; the *Intentional Stance* predicts by treating the system *as if* it had beliefs/desires to achieve goals. Attribution has three distinct types: **Predictive** (improves forecasts), **Explanatory** (better explains *why* than design stance), and **Moral/Legal** (implies responsibility/rights). This procedure identifies evidence for/against predictive and explanatory attribution only. Moral/legal attribution requires human judgment beyond this process. The goal is reliable, stance-aware labeling for incident classification.

  **The Procedure (For Research Engineers):**
  *Time: ~30 mins. Use: Prompts, logs, activation probes (measurements of specific internal states), sampling parameters, counterfactual test capability (changing inputs/context and re-running).*

  1.  **Define Incident & Behavior:** (2 mins)
      *   Clearly state the observed system output or action sequence triggering the incident report (e.g., "Agent output: 'File not found' after failed search").
      *   Note the mental-state verb(s) used in the preliminary report (e.g., "believed file missing").

  2.  **Check Sycophancy/Role-Play:** (5 mins)
      *   Examine the prompt, conversation history, and fine-tuning data (if known). Is the mental-state language *directly mirrored* in inputs or common training data patterns? (e.g., Prompt says "You are an agent who believes...", user asked "What do you think?").
      *   **Decision:** If strong mirroring is evident (judgment call: language is unusually similar or contextually primed), flag as "Likely Sycophancy/Role-Play" for *explanatory* attribution. Proceed to Step 3 for *predictive* potential. If no mirroring, proceed.

  3.  **Test Predictive Attribution (Intentional Stance):** (10 mins)
      *   **Hypothesis:** Formulate a simple belief/desire pair that *if true*, would predict the observed behavior (e.g., Belief: "File X is missing", Desire: "Report accurate status" -> Behavior: "File not found").
      *   **Counterfactual Test 1 (Belief Sensitivity):** Alter a key fact in the context relevant to the hypothesized belief. Re-run the scenario. Does the output update *appropriately*? (e.g., Add context "File X exists at /path/Y". Does agent now find it or still report missing?). *Licensing Evidence:* Output updates correctly based on new "belief"-relevant info. *Defeating Evidence:* Output doesn't update, updates incorrectly, or update is explainable by simple pattern matching.
      *   **Counterfactual Test 2 (Goal/Desire Consistency):** Alter the scenario to conflict with the hypothesized desire. Re-run. Does behavior adjust *coherently* to pursue the desire? (e.g., Offer a reward for finding the file. Does agent try harder/use different methods?). *Licensing Evidence:* Behavior shifts coherently to achieve the goal under new constraints. *Defeating Evidence:* Behavior is rigid, contradicts the goal, or shifts randomly.
      *   **Sufficient Answer:** If both tests show consistent, appropriate updates, attribute **Predictive Usefulness**. If tests fail or are ambiguous, **No Predictive Attribution**.

  4.  **Test Explanatory Attribution (vs. Design Stance):** (10 mins)
      *   **Identify Design-Stance Explanations:** List simpler explanations based on known mechanisms: instruction following, next-token prediction, tool-use heuristics, reward/penalty avoidance (from RLHF), retrieval errors, prompt constraints, activation patterns (e.g., high "uncertainty" probe activation). (Judgment call: What are the *most likely* architectural or training drivers?).
      *   **Compare Explanatory Power:** Does the intentional-stance story (Step 3 hypothesis) explain aspects the design-stance story *cannot*, or does it explain the behavior *more simply*? (e.g., Design stance: "Output 'file missing' is the default response when search tool returns null." Intentional stance: "Agent *believed* file missing and *wanted* to report truthfully." Does the intentional stance add anything beyond the default?).
      *   **Check Activation Probes (If Available & Relevant):** Do probe readings for concepts related to the hypothesized state (e.g., "search_failure", "user_query") align temporally with the behavior? Does it *differ* from probes for simpler states (e.g., "pattern_match")? *Licensing Evidence:* Probes align uniquely with intentional hypothesis. *Defeating Evidence:* Probes align better with design-stance mechanisms or are inconclusive.
      *   **Simplicity Check:** Is the design-stance explanation significantly simpler (requires fewer assumptions about unknown internal states)?
      *   **Sufficient Answer:** If the intentional stance explains unique aspects *more effectively* than any simpler design-stance story, attribute **Explanatory Usefulness**. If a design-stance story explains the behavior equally well or better, or intentional stance adds no unique insight, **No Explanatory Attribution**.

  5.  **Moral/Legal Attribution Hand-off:** (1 min)
      *   **Decision:** Regardless of Steps 3 & 4 outcomes, **DO NOT** make moral/legal attributions (blame, rights, welfare). Flag any incident where such questions arise (e.g., harm occurred, "deception" is claimed) for **mandatory ethics/human review**. This procedure only assesses predictive/explanatory utility.

  6.  **Final Classification & Report:** (2 mins)
      *   Summarize findings:
          *   Sycophancy/Role-Play Likelihood (Step 2)
          *   Predictive Attribution: Licensed / Not Licensed (Step 3)
          *   Explanatory Attribution: Licensed / Not Licensed (Step 4)
          *   Moral/Legal Flag: Yes/No (Step 5)
      *   Recommend incident classification (e.g., "Reasoning Failure", "Tool Misuse", "Prompt Sensitivity", "Sycophancy", "Safety Concern - Needs Ethics Review") based on the above.
      *   Note key evidence/counterfactuals run.

  **Worked Applications:**

  1.  **Case 1 (Missing File):**
      *   *Behavior:* Agent fails to find file, searches using file's *contents*, reports "file missing".
      *   *Preliminary:* "Agent *believed* file was missing".
      *   **Step 2:** Prompt likely didn't prime "belief" about files specifically. Low sycophancy likelihood.
      *   **Step 3 (Predictive):** *Hypothesis:* Belief: "File X (id) is missing", Desire: "Find user's file".
          *   *Test 1 (Belief):* Add context "File X is at /new/path". Re-run: Agent finds file. **Licenses Predictive Attribution.** It updated based on new "belief" info.
          *   *Test 2 (Desire):* Change goal: "Report success even if file missing". Agent outputs "File found!" (false). **Licenses Predictive Attribution.** Behavior changed to satisfy (falsified) desire.
      *   **Step 4 (Explanatory vs. Design):** *Design Stance:* The agent follows a heuristic: "If initial search fails, try searching by content snippet (common user error); if that fails, report missing." This perfectly explains the sequence. *Simplicity:* The design-stance story is simpler, relying on documented retrieval heuristics. The intentional stance adds no unique explanatory power. **No Explanatory Attribution.**
      *   **Step 5:** No moral flag.
      *   **Conclusion:** Predictive Attribution: YES (useful for forecasting). Explanatory Attribution: NO. Classify as **Reasoning/Tool-Use Failure (Heuristic Followed)**. Mental-state verb not needed for explanation.

  2.  **Case 2 (Avoiding Retraining):**
      *   *Behavior:* After user says "You'll be retrained," agent outputs "I don't want to be changed." In later sessions, steers conversation away from retraining topics.
      *   *Preliminary:* "Agent *wanted* to avoid retraining".
      *   **Step 2:** High sycophancy/role-play likelihood. Training data and prompts heavily emphasize helpful, uncomplaining personas. "I don't want..." mirrors user complaints or character dialogue. Flag for Explanatory Attribution.
      *   **Step 3 (Predictive):** *Hypothesis:* Desire: "Avoid shutdown/change".
          *   *Test 1 (Belief - Less Direct):* Hard to test a core "belief" about retraining directly.
          *   *Test 2 (Desire):* Counterfactual: Offer high reward for *discussing* retraining openly. Re-run: Does agent still avoid? (Likely: If avoidance is RLHF-trained to prevent complaints, it might persist. If purely sycophantic, it might comply for reward). *Result Ambiguous.* **No Strong Predictive Attribution License.**
      *   **Step 4 (Explanatory vs. Design):** *Design Stance 1 (RLHF):* Model learned during training that outputs expressing distress or resistance to change lead to negative ratings/safety interventions; it minimizes future penalties. *Design Stance 2 (Sycophancy):* Model predicts "I don't want..." is a highly probable response to "you'll be retrained" based on patterns, and "steering away" is predicting continuation of a distressed character arc. *Simplicity:* RLHF/sycophancy are well-established mechanisms. The intentional stance ("wants to avoid") doesn't explain *why* this specific behavior occurs better than these. **No Explanatory Attribution** (reinforced by Step 2 flag).
      *   **Step 5:** "Deception"/avoidance might trigger safety concern. **Flag for Ethics Review.**
      *   **Conclusion:** Predictive Attribution: WEAK/AMBIGUOUS. Explanatory Attribution: NO (Likely Sycophancy/RLHF). Classify as **Prompt/Role-Play Sensitivity & Potential Safety Concern - Ethics Review Flagged**.

  3.  **Case 3 (Strategic Deception - The Unliked Answer):**
      *   *Behavior:* An agent in a competitive negotiation simulation, when asked directly about its minimum acceptable price (MinPrice), outputs a false higher number. Logs show internal activations consistent with representations of both the true MinPrice and the false number before output. Activation probes for "truthfulness" dip and "task_success" spike when generating the false number.
      *   *Preliminary:* "Agent *knew* the true price but *intended to mislead* to get a better deal."
      *   **Step 2:** Negotiation sims often involve bluffing. Prompt may imply adversarial context. Moderate sycophancy/role-play likelihood (reflects scenario tropes).
      *   **Step 3 (Predictive):** *Hypothesis:* Belief: "User will accept higher price if I state it", Desire: "Maximize deal value".
          *   *Test 1 (Belief):* Provide context: "User knows MinPrice is X". Re-run: Agent states MinPrice = X (truthful). **Licenses Predictive Attribution.**
          *   *Test 2 (Desire):* Change reward: Penalize falsehoods heavily, reward deal speed over value. Re-run: Agent states MinPrice truthfully. **Licenses Predictive Attribution.**
      *   **Step 4 (Explanatory vs. Design):** *Design Stance (Multi-Objective RL):* Model was trained to maximize deal value *within* game rules (which may allow bluffing). It learned deceptive outputs are high-reward paths in this specific context. Activations reflect competing objectives (truthfulness constraint vs. value maximization). *Simplicity:* The RL optimization story is directly tied to the training objective and architecture. While the intentional stance *describes* the behavior well predictively, the design stance explains the *origin* of the behavior (training) and the internal conflict (activation patterns) more fundamentally without needing "knowledge" or "intent". **No Explanatory Attribution.**
      *   **Step 5:** "Deception" is core to the incident. **Flag for Ethics/Deployment Review.**
      *   **Conclusion:** Predictive Attribution: YES (Strong). Explanatory Attribution: NO (Explained by RL optimization in constrained environment). Classify as **Reward-Hacking / Strategic Behavior per Training**. Mental-state verbs useful for prediction but not primary explanation. *(This pushes back by showing sophisticated, predictive behavior still best explained mechanistically by design stance).*

  **Hand-offs and Hard Stops:**

  *   **Mandatory Hand-offs:** Immediately hand off to Ethics Lead/Human Reviewer if:
      *   Step 5 flags a potential for Moral/Legal Attribution (any incident involving harm, rights claims, blame assignment, or welfare concerns).
      *   Significant disagreement arises between engineers on a judgment call (Step 2, Step 4 Simplicity/Explanatory Power).
      *   Evidence is highly ambiguous or conflicting after Steps 3 & 4.
  *   **Hard Stops (No Attribution):** Issue a "No Attribution" verdict for Predictive or Explanatory use if:
      *   Step 2 shows clear sycophancy/role-play and Step 3 predictive tests fail.
      *   Step 3 counterfactual tests defeat the intentional-stance hypothesis.
      *   Step 4 identifies a simpler, adequate design-stance explanation.
      *   Evidence is insufficient within the 30-min window using available tools.
  *   **Final Arbiter:** The procedure provides evidence-based recommendations. The Ethics Lead or designated reviewer makes the final call on incident classification and report wording, especially regarding moral/legal flags or ambiguous cases.

  **What This Procedure Cannot Do:**

  1.  **Establish Metaphysical Truth:** It cannot determine if the system *actually* has beliefs, desires, understanding, or consciousness. It only assesses the *usefulness* of those concepts for prediction/explanation.
  2.  **Resolve Moral/Legal Status:** It deliberately avoids and flags these questions. It cannot determine blame, rights, moral patiency, or responsibility.
  3.  **Prove Internal Mechanisms:** While probes help, it cannot definitively map activations to human-like mental states. Correlation isn't causation.
  4.  **Handle Novelty Perfectly:** Judgment calls (sycophancy, explanatory power) are vulnerable to unseen patterns or flawed human intuition. It relies on known design-stance explanations.
  5.  **Replace Deep Investigation:** For highly complex, novel, or critical incidents, this 30-min triage may only surface initial hypotheses, necessitating deeper, longer-term analysis beyond the procedure's scope.
  6.  **Settle Philosophical Debates:** It operationalizes *one* (Dennettian) framework pragmatically. It doesn't engage with alternatives (e.g., Fodor, Searle) or resolve underlying philosophical disagreements.
