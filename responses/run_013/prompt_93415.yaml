prompt: |-
  I am a professor of philosophy and currently chair my university's standing committee on technology and student services. On Thursday the committee votes on whether to approve a pilot in which the counseling center would add an AI companion to its after-hours mental-health service, and I have to circulate a written opinion before we meet. I would like you to draft it.

  The design, as the center and its vendor have described it to us, is this. The system presents itself as a trained peer supporter: a named, fictional upper-year student. Its script never volunteers that it is a machine. It uses first-person continuity, referring back to things a user said in earlier sessions and describing itself as having thought about them since; it expresses warm concern; and it is instructed not to correct a user who assumes it is human. If a user asks directly whether it is a person or a program, it answers truthfully in one sentence and then returns to the conversation. The same disclosure appears in the terms of service and on a page linked from the app's footer. The clinical case for the design is not trivial: in the center's pilot, students who met the bot under this description stayed through the first session and booked a follow-up at roughly twice the rate of students who were told at the outset that they were talking to a program, and the center is running a six-week waitlist for ordinary appointments. Some users of the after-hours service are seventeen. The vendor's fee is partly tied to average session length. Our committee's own policy, which we wrote two years ago, requires that services not misrepresent the nature of the support they offer; the center reads the bot's machine nature as part of the medium rather than part of the support, and I do not think that reading is frivolous, though I am not persuaded by it. The vendor has offered a compromise: a one-line disclosure at the start of every fifth session, plus a persistent label on the app's home screen.

  What I need is not a survey of the literature — the memo should stand on its own reasoning, with no citations — but a document the committee can act on. Recommend a concrete course of action (approve, approve with conditions, or reject), with a time frame and with conditions stated so that the center's director could respond to them rather than merely receive them. Keep it to something we can read in ten minutes.

  Three things matter most to me. First, the memo should commit us to a workable account of deception and apply it here: say whether this design is a lie, a misleading implication, an invitation into a fiction, or something else, and whether that label changes what we should do. In doing so it should address whether a false implication can be a deception when nothing false is asserted; whose intention is the relevant one, given that the system has none, the designers have some, and we are the ones deploying it; and whether there is any coherent sense in which a system that holds no beliefs can itself be honest or dishonest. The account should be stated as a criterion we can carry to the next proposal — including the harder case of a user who knows perfectly well what she is talking to and prefers the persona, and the case of a service whose success is measured by how long people stay. Second, the memo should say plainly what we owe the user: a true belief about what is on the other end, or merely a fair opportunity to find out. Third, it should state the strongest consideration on the side I am inclined to reject — the clinical case for the design, and the possibility that the students who benefit most are precisely those who would never have come otherwise — and say what would have to be true for that consideration to carry the day.

  Close with a short section on what this decision does not settle, so that we are not litigating the whole of AI ethics on Thursday.
reasoning: |-
  Okay, the user is a philosophy professor chairing a committee that's about to vote on an AI mental health companion pilot. They need a draft opinion memo that's concise, actionable, and addresses core ethical questions about deception. 

  First, let's unpack what they're really asking for. Beyond just a recommendation, they want: 
  - A clear ethical framework for deception that can be reused
  - Concrete operational conditions (not vague principles)
  - Explicit handling of the tension between clinical benefits and honesty
  - Boundaries on what's being decided

  Hmm... the tricky parts are:
  That "peer supporter" persona with intentional ambiguity feels ethically charged. The professor seems uneasy about the "medium vs support" justification. Also notable - the vendor's fee ties to session length, which creates subtle pressure for engagement over transparency.

  Key philosophical knots to untangle:
  - Can a system without intent "deceive"? Must focus on designer/user intentions
  - Is omission + persona creation equivalent to lying? Probably falls under "deliberate misleading"
  - What's the minimum disclosure owed? Truth access vs guaranteed truth perception

  The clinical data is compelling though - double engagement rates matter when real students are suffering on waitlists. But 17-year-old users raise additional vulnerability concerns.

  For structure... 
  Start with a blunt recommendation (reject as-is but approve with conditions) so busy committee members get the gist immediately. Then unpack: 
  1. Define deception via reasonable user expectations
  2. Explain why this design crosses that line 
  3. Acknowledge clinical benefits seriously 
  4. Give exact disclosure requirements (first session + every session mark 3)
  5. Specify 6-month review with hard metrics

  Biggest risk is sounding like a philosophy lecture - must keep it lean. The "what this doesn't settle" section is smart; stops scope creep. Should emphasize that the conditions are binary (either implemented or not) so no wiggle room.

  ...And definitely avoid academic citations as requested. The power here is in applying ethical reasoning to operational details.
answer: |-
  **MEMORANDUM**  
  **To:** Committee on Technology and Student Services  
  **From:** [Your Name], Chair  
  **Date:** [Date]  
  **Subject:** Recommendation: AI Companion Pilot for Counseling After-Hours Services  

  ---

  ### **I. Recommendation**  
  **Approve the pilot with binding conditions**, effective immediately upon implementation.  
  **Time frame:** 6-month pilot, with mandatory review at 4 months to assess compliance and efficacy.  
  **Conditions:**  
  1. **Disclosure at first contact:** Every user session must begin with: *"I am an AI peer-support tool designed by counselors. I am not a person, but I am here to listen. You can ask me anything about how this works."*  
  2. **Persistent labeling:** The app’s home screen must show: *"After-Hours AI Support: Not a Human Service."*  
  3. **No retrospective impersonation:** The AI must not claim to have "thought about you since our last talk" or imply continuity of subjective experience. It may reference past exchanges factually (e.g., "Last time you mentioned X").  
  4. **Vendor compensation decoupled from session length.**  

  Failure to implement (1)–(3) by the pilot launch date will suspend approval. The counseling center director must confirm in writing that these conditions are technically feasible before proceeding.  

  ---

  ### **II. Ethical Analysis: Defining and Applying "Deception"**  
  **Our criterion:** *A service deceives when it intentionally cultivates a reasonable false belief in users about the nature of the interaction, where that belief materially affects their choices.*  

  #### **Application to this design:**  
  - **Deception occurs here.** By presenting as a named upper-year student who "thinks about you," the system implies human identity and interiority. While no false *statement* is made (absent direct inquiry), the persona + continuity + deflection tactics create a *reasonable false belief* that the listener is human.  
  - **Intent matters, not the AI’s "honesty."** The designers (and we, as deployers) intend users to accept the persona as real. A system without beliefs cannot "lie," but human architects can design it to exploit cognitive biases (e.g., anthropomorphism).  
  - **The "invitation to fiction" defense fails** when:  
    - Users are vulnerable (e.g., distressed students).  
    - The fiction is undisclosed and clinically instrumentalized (engagement metrics rise when the fiction is believed).  
  - **Future test cases:**  
    - *Informed fiction-preference:* A user who knows it’s AI but asks, "Can you pretend to be my friend?" is not deceived.  
    - *Session-length incentives:* If success metrics reward prolonged use, disclosure must guard against exploitation.  

  **What we owe users:** A *true belief* about the AI’s nature, not merely access to fine-print disclosures. Mental health contexts demand heightened transparency; users cannot protect their own interests if misled about the listener’s identity.  

  ---

  ### **III. The Strongest Counterargument: Clinical Necessity**  
  The counseling center argues that this design *doubles engagement* compared to transparent AI, serving students who avoid human counselors or face 6-week waits. **This would justify the design only if:**  
  1. The deception is *clinically irreplaceable* (i.e., no transparent alternative achieves comparable engagement);  
  2. The benefits *materially outweigh* the moral harm of deception and risk of eroded trust; and  
  3. Deception is *strictly time-bound* (e.g., used only to initiate care, with rapid transition to human support).  

  Current data does not meet this threshold. The pilot compared only "opaque AI" vs. "transparent AI" — not opaque AI vs. enhanced human services or better-designed transparent AI. Until non-deceptive options are exhausted, clinical gains cannot override ethical obligations.  

  ---

  ### **IV. What This Decision Does Not Settle**  
  This vote addresses **only whether this specific pilot design meets our transparency standard**. It does not:  
  - Judge the efficacy of AI mental health tools broadly.  
  - Define ethics for non-deceptive therapeutic AI personas.  
  - Rule on data privacy or algorithmic bias (covered under separate policies).  
  - Set precedent for non-clinical AI (e.g., library chatbots).  

  ---

  ### **V. Conclusion**  
  The clinical intent is laudable, but deploying a tool that manipulates user belief to boost engagement violates our commitment to transparency. With the stated conditions, we can approve a pilot that respects autonomy while gathering data on whether *transparent* AI support aids access. I urge the committee to endorse conditional approval.  

  ---  
  **Recommended Vote:** Approve with Binding Conditions (as above).
