answer: |-
  ### Case One: Forced Indifference  
  **Gadget:** A perfectly symmetric tetrahedral die with four identical, equilateral triangular faces. The die is homogeneous, has uniform density, and rests on a flat, frictionless surface. Due to rotational symmetry (any face is indistinguishable from any other under 3D rotation), the die must land on any given face with equal probability. The symmetry is inherent in the physical shape and material, not in a mathematical description.  

  **Refinement Test:** Instead of partitioning by faces, partition by vertices (there are four vertices). The event "the die lands with vertex A pointing directly upward" has probability \(P(A)\). However, each vertex is shared by three faces, and by rotational symmetry, all vertices are equivalent. The physical symmetry ensures that \(P(A) = P(B)\) for any two vertices. Since the die always lands with exactly one vertex pointing upward (due to tetrahedral geometry), and the symmetry forces vertex probabilities to be equal, \(P(A) = 1/4\). This matches the face-based probability of landing on a face adjacent to A (each face has three vertices, but the vertex event is coarser). The probability doesn’t move because the rotational symmetry group acts transitively on both faces and vertices, and the event structure is invariant under this group. Any repartitioning that respects the symmetry (e.g., grouping faces into pairs) would similarly yield consistent probabilities due to the compactness of the rotation group.  

  ---

  ### Case Two: Self-Similar Indifference Failure  
  **Gadget:** A self-similar spring launcher: A spring is compressed to a random distance \(D\) (from 0 to \(L\)) by a symmetric plunger, then released to launch a ball. The device is self-similar: scaling the compression distance by any factor \(k\) (e.g., halving or doubling) yields an identical physical setup (same spring constant, plunger shape, and launch mechanics). Specifically, compressing to \(D\) and scaling the system by \(k\) (adjusting all lengths equally) produces indistinguishable dynamics.  

  **Yes/No Question:** "Does the ball land within 1 meter of the launcher when launched horizontally from height 1 meter?"  

  **Analysis:**  
  - **Natural Indifference Schemes:**  
    1. **Uniform in compression distance \(D\):** Assume \(D \in [0, L]\). Range distance \(R \propto D\) (by physics), so \(P(R \leq 1) = P(D \leq 1) = 1/L\).  
    2. **Uniform in compression energy \(E \propto D^2\):** Since \(E \propto D^2\), \(P(E \leq E_1) \propto \sqrt{E_1}\). For \(R \propto D \propto \sqrt{E}\), \(P(R \leq 1) \propto \sqrt{E} \big|_{R=1} = 1/\sqrt{L}\).  
    3. **Uniform in log-distance \(\log D\):** Let \(Y = \log D\). Uniform \(Y \in [-\infty, \log L]\) gives \(P(R \leq 1) = P(D \leq 1) = P(Y \leq 0)\). With cutoff \(Y_{\text{min}} = -\log L\) (to avoid \(-\infty\)), \(P = \log L / (2\log L) = 1/2\) for large \(L\).  
    Schemes 1 and 2 give \(P(R \leq 1) = 1/L\) vs. \(1/\sqrt{L}\)—different for finite \(L\).  

  - **Self-Similarity Scheme:** The symmetry \(D \to kD\) suggests equal probability for intervals \([a, ka]\) and \([b, kb]\) for any \(a,b,k\). Assign equal probability to geometrically scaled intervals. Partition \([0, L]\) into \([L/2, L], [L/4, L/2], [L/8, L/4]\), etc. Each interval has equal length ratio (scale factor 2), so self-similarity demands equal probability for each. But there are infinitely many intervals (countable partition), so if each has probability \(p > 0\), total probability is infinite; if \(p = 0\), total is zero. Contradiction—no consistent assignment.  

  - **Surviving Measure:** Only the scale-invariant measure \(\mu(dD) = dD/D\) (infinite total mass: \(\int_0^L dD/D = \infty\)) respects symmetry. For finite answers, impose cutoffs. With \(D \in [\epsilon, L]\), \(P(R \leq 1)\) becomes:  
    - Uniform \(D\): \((1 - \epsilon)/L\) → 0 as \(L \to \infty, \epsilon \to 0\).  
    - Uniform \(E\): \((\sqrt{1} - \sqrt{\epsilon})/(\sqrt{L} - \sqrt{\epsilon}) \to 0\).  
    - Uniform \(\log D\): \(\log(1/\epsilon) / \log(L/\epsilon) \to 0\) if \(\epsilon/L\) fixed, but varies (e.g., fix \(\epsilon\), \(L \to \infty\) gives 0; fix \(L\), \(\epsilon \to 0\) gives 1).  
    Answers depend on cutoff choice and do not converge.  

  ---

  ### Analysis  
  **What the Pair Shows:**  
  The principle of indifference is coherent when the symmetry group is **compact** (case one: tetrahedral rotations form a finite/compact group), forcing a unique normalized probability. It fails when the group is **non-compact** (case two: scaling group \(\mathbb{R}^+\) is non-compact), where the Haar measure has infinite mass. Compactness separates the cases—it is a topological property of the group, not a preference. Case one’s compact group ensures a finite invariant measure; case two’s non-compact group does not.  

  **Standard Rescue (Fully Specified Process):**  
  In case two, the physical process *is* fully specified (spring launcher with scale symmetry), but it pins down only an infinite measure, not a probability distribution. No normalized distribution respects the symmetry, so the "fact of the matter" is undefined for probabilities—it dissolves only if we accept infinite measures, but this avoids the question of finite probabilities.  

  **De-Idealisation (Approximate Self-Similarity):**  
  Ambiguity survives with finite ranges. Suppose the launcher has \(D \in [\delta, \Lambda]\) (e.g., \(\delta = 1\ \text{mm}\), \(\Lambda = 1\ \text{km}\)). Then:  
  - \(P(R \leq 1)\) varies widely: e.g., uniform \(D\) gives \(\approx 1/\Lambda\), uniform \(\log D\) gives \(\log(1/\delta)/\log(\Lambda/\delta)\).  
  - If the scale ratio \(\Lambda/\delta\) is large (e.g., \(10^6\)), probabilities differ by orders of magnitude (e.g., \(10^{-6}\) vs. \(1/\log(10^6) \approx 0.07\)).  
  Ambiguity is practical, not just theoretical: it scales with \(\log(\Lambda/\delta)\), vanishing only if \(\Lambda/\delta \to 1\) (no symmetry).  

  **Use Against Principle and Critics:**  
  - **Against Principle:** Use case two to show indifference fails structurally—symmetry alone doesn’t fix probabilities in non-compact settings, leading to contradictions.  
    *Best Reply:* "Indifference requires a *normalizable* symmetry; otherwise, it’s undefined."  
  - **Against Critics:** Use case one to show indifference works when symmetries are compact, and probabilities are physical, not arbitrary.  
    *Best Reply:* "Without indifference, why trust symmetries in physics (e.g., particle statistics)?"  

  The verdicts emerge from the gadgets: compact symmetry forces consistency; non-compact symmetry induces non-normalizability. No probabilities are stipulated—they derive from physical symmetries or their absence.
