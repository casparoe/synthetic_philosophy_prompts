  Case 3 (population with levels 1,2,3,... vs shifted versions) reveals problems with order-dependent evaluations. This motivates permutation invariance - non-negotiable - but also requires that shifting shouldn't create incomparability.

  Case 4 (world with half at 10/half at 0 vs all at 5) tests whether theories can handle distributional concerns. This motivates the weak dominance requirement (non-negotiable) but also shows that theories might differ on distribution sensitivity.

  Case 5 explicitly requires permutation invariance, which must be non-negotiable since it's fundamental to the concept of impartial evaluation.

  Case 6 (finite good vs minute probability of unbounded good) addresses practical decision-making needs. This motivates the finite deliberation requirement - non-negotiable - to avoid paralysis or trivialization.

  Case 7 (two-sided infinite population with finitely many improvements) is particularly interesting. It tests whether theories can handle symmetric infinite contexts without arbitrary cutoffs. This motivates the symmetry requirement, which might be camp-specific.

  Now, looking at potential conflicts: Finite sensitivity and finite robustness seem incompatible at first glance. If adding one person matters but removing one doesn't, that's fine - but in infinite contexts, adding and removing might be symmetric operations. This creates tension with case 7 where finite improvements in symmetric populations should matter but not disrupt overall structure.

  The permutation invariance requirement (from cases 3 and 5) does the most excluding work because it rules out all order-dependent theories like those based on limits of partial sums or averages that depend on enumeration order.

  For the three families:
  - Sum-like/totalist views struggle with permutation invariance and often fail finite robustness
  - Person-affecting views have trouble with the two-sided symmetry case and may violate weak dominance
  - Limit/average views typically violate permutation invariance and finite sensitivity

