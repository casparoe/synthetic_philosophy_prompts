  The user wants the desiderata first - each requirement with its motivating case and whether it's non-negotiable or camp-specific. Then I need to identify any conflicts between these requirements, determine which single requirement excludes the most theories, and briefly evaluate three broad families of theories: sum-like, person-affecting, and limit/average views.

