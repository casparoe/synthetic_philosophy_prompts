answer: |-
  Here is the desiderata list for a theory of value addressing infinite or unboundedly large populations, structured as requested. The requirements are derived from your fixed points and the specified purpose: enabling decisions with potentially unbounded stakes, particularly concerning the long-run future. Conflicts and exclusions are analyzed afterward.

  ### Desiderata List (Requirements for an Adequate Theory)
  1. **Strict Pareto (Non-negotiable)**  
     *Requirement:* If world A has the same population as world B, and every individual in A has strictly higher well-being than in B, then A is better than B.  
     *Motivating Case:* Fixed point 1 (world with everyone at level 5 vs. everyone at level 6). A theory failing this cannot justify basic improvements.  
     *Controversy:* The principle itself is uncontroversial for fixed populations; issues arise only when populations differ.

  2. **Finite Sensitivity (Non-negotiable)**  
     *Requirement:* Adding a single person with finite positive well-being to a world must sometimes improve the world’s value (i.e., not always negligible).  
     *Motivating Case:* Fixed point 2 (world with countably many at level 5 vs. the same with one added at level 100). A theory must recognize that a significant finite gain (e.g., a life at 100) can matter even in infinite contexts.  
     *Controversy:* Uncontroversial as a minimal condition for relevance to real decisions (e.g., creating one very happy person).

  3. **Finite Robustness (Preference: "Totalist" camp)**  
     *Requirement:* Deleting or altering a finite subset of people from an infinite world cannot reduce the world’s value to negative infinity, nor collapse it to a "default" value (e.g., zero).  
     *Motivating Case:* Fixed point 2 (world with countably many at level 5 vs. the same with one person deleted). A theory must not treat infinite worlds as "infinitely fragile" (e.g., deleting one person cannot make a world worthless).  
     *Controversy:* Some "person-affecting" views may reject this, arguing that finite changes in infinite worlds are undefinable. Marked as a preference due to this tension.

  4. **Permutation Invariance (Non-negotiable)**  
     *Requirement:* The value of a world must be invariant under reordering (permutation) of well-being levels across individuals.  
     *Motivating Case:* Fixed point 5 (any permutation leaves value unchanged). This formalizes impartiality: value depends on the multiset of well-being levels, not who has them or their spatiotemporal order.  
     *Controversy:* Directly rules out order-dependent theories (e.g., limit-average views where value depends on the sequence of partial averages).

  5. **Shift Invariance / Symmetry (Preference: "Neutralist" camp)**  
     *Requirement:* Shifting all well-being levels by a constant (e.g., adding +1 to everyone) must not alter the comparative value of worlds, and symmetric populations (e.g., two-sided infinities) must be evaluable without arbitrary cutoffs.  
     *Motivating Cases:* Fixed point 3 (population with levels 1,2,3,... vs. shifted to 2,3,4,...) and fixed point 7 (two-sided infinite population with finite local improvements). Theories must handle index-invariance and avoid "edge effects" in symmetric infinities.  
     *Controversy:* Some theories (e.g., partial-sum limits) violate this by privileging "early" positions. Marked as a preference due to debates over whether shift operations should preserve equality.

  6. **Weak Dominance (Non-negotiable)**  
     *Requirement:* If every person in world A has at least as high well-being as in world B, and some finite subset has strictly higher well-being, then A is better than B.  
     *Motivating Case:* Fixed point 4 (world with countably many at 10 and countably many at 0 vs. all at 5). The mixed world weakly dominates the uniform one (all at 0 are worse off in the uniform world, all at 10 are better off). A theory must not prefer the uniform world here.  
     *Controversy:* The principle is uncontroversial; issues arise in its application to populations of different sizes.

  7. **Non-Arbitrariness for Finite Changes in Symmetric Infinities (Non-negotiable)**  
     *Requirement:* In a symmetric infinite population (e.g., indexed by integers), improving the well-being of a finite subset must strictly increase the world’s value.  
     *Motivating Case:* Fixed point 7 (two-sided infinite population with finitely many near the middle moving from 0 to 1). A theory must deliver a verdict without relying on arbitrary boundaries or "discounting" distant individuals.  
     *Controversy:* Forces theories to handle local improvements in truly infinite contexts, beyond one-sided cases.

  8. **Finite Deliberation (Non-negotiable)**  
     *Requirement:* The theory must not force indifference between a finite certain gain and a tiny probability of an unbounded gain (or loss), nor make such comparisons impossible. Decisions under uncertainty must avoid paralysis (always favoring tiny probabilities of infinities) or triviality (ignoring them).  
     *Motivating Case:* Fixed point 6 (finite good now vs. minute probability of unboundedly good outcome). A theory must enable practical decisions without "Pascal’s Mugging" or its inverse.  
     *Controversy:* The principle is non-negotiable for usability, but implementations (e.g., discounting) vary.

  ---

  ### Conflicts Between Requirements
  **The core conflict is between Finite Sensitivity and Finite Robustness, exacerbated by Permutation Invariance and Shift Invariance:**  
  - Finite Sensitivity requires that adding one person at level 100 to an infinite world (fixed point 2) improves the world.  
  - Finite Robustness requires that removing one person from that same world (fixed point 2) does not make it catastrophically worse (e.g., undefined or infinitely negative).  
  - However, in a two-sided infinite population (fixed point 7), adding a person is symmetric to removing one (due to Permutation and Shift Invariance). Thus:  
    - If adding a person improves the world (Finite Sensitivity), then "removing" one (by symmetry) should worsen it.  
    - But Finite Robustness forbids worsening upon removal.  
  - **Result:** Finite Sensitivity and Finite Robustness cannot both hold in symmetric infinite worlds *if* the theory satisfies Permutation and Shift Invariance. Finite Robustness must be relaxed for truly symmetric cases (e.g., fixed point 7), making it a preference for totalists. Person-affecting views might reject Sensitivity or Symmetry instead.

  ---

  ### Most Excluding Requirement  
  **Permutation Invariance** rules out the largest number of otherwise plausible theories:  
  - It immediately invalidates all limit-based approaches (e.g., \(\lim_{n \to \infty} \text{avg}(x_1 \dots x_n)\)) if the limit depends on the ordering of individuals.  
  - It also challenges "order-sensitive" totalist views (e.g., partial-sum comparisons like overtaking criteria) and most average-based theories.  
  - Only fully symmetric theories (e.g., density-based measures or hyperreal summations) survive, but these face other constraints (e.g., Shift Invariance).

  ---

  ### Brief Evaluation of Three Families
  1. **Sum-like / Totalist Views** (e.g., hyperreal sums, extended integers):  
     - **Strengths:** Satisfy Strict Pareto, Finite Sensitivity, Weak Dominance.  
     - **Weaknesses:** Violate Permutation Invariance if order-dependent; struggle with Shift Invariance and Finite Robustness; risk "Pascal’s Mugging" in Finite Deliberation.  
     - **Verdict:** Fail without careful symmetrization.

  2. **Person-Affecting / Pairwise Views** (e.g., extended Pareto, relative comparisons):  
     - **Strengths:** May satisfy Permutation Invariance and Finite Robustness.  
     - **Weaknesses:** Often violate Finite Sensitivity and Weak Dominance (e.g., fixed point 4); struggle with Non-Arbitrariness in symmetric infinities; frequently silent in non-identical-population cases.  
     - **Verdict:** Fail unless they incorporate totalist elements.

  3. **Limit / Average / Finite-Approximation Views** (e.g., Banach limits, density measures):  
     - **Strengths:** Can satisfy Finite Robustness and Shift Invariance.  
     - **Weaknesses:** Typically violate Permutation Invariance and Finite Sensitivity; often fail Weak Dominance (e.g., fixed point 4); may trivialize Finite Deliberation.  
     - **Verdict:** Fail due to Permutation Invariance and Sensitivity.

  ---

  This list provides a rigorous foundation for your paper, highlighting the tensions inherent in axiologies for infinite populations. The conflicts suggest that no theory satisfies all desiderata universally, forcing trade-offs between sensitivity, robustness, and symmetry.
