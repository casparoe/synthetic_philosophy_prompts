     What if we make the cost of standoff at a lower rung less than the cost of winning at a higher rung for the Defender? For example, standoff at rung 1 might be -10, but winning at rung 2 for the Challenger means the Defender loses at rung 2 which is -20, but standoff at rung 2 is -25? Then the Defender might prefer to standoff at rung 1 (-10) rather than risk having to face the possibility of standoff at rung 2 (-25) or even higher.

     But in the sequential game, the Defender at rung 1 doesn't control whether the standoff happens or the escalation continues. The Challenger decides whether to escalate further after the Defender matches.

     We need the Defender to have a way to make the Challenger stop at a low rung. But without commitment, the Defender cannot make the standoff at a low rung happen because the Challenger will always escalate further if it is in their interest.

     This is the credibility problem! The Defender would like to threaten: "If you escalate to rung 1, I will match and then I will make sure that we both get standoff at rung 1." But the Challenger knows that after the Defender matches, the Challenger can choose to escalate to rung 2, and the Defender cannot force the standoff at rung 1.

     So the only way for the Defender to avoid the deeper loss is to concede at the first opportunity.

     Therefore, the game in phase 1 will always see the Defender concede at the first rung.

     This is the credibility problem in action: the Defender's threat to resist is not credible because it would lead to a deeper loss, so they don't resist, and the Challenger wins easily.

     Then in phase 2, we introduce a commitment device: the Defender can delegate the decision to press the button at the top to a random event or a delegate. Then the threat becomes credible: there is a chance that if the Challenger escalates to the top, the button will be pressed and mutual destruction will occur. Then the Challenger might be deterred at a lower rung.

     So in phase 1, we expect the following play:

          Challenger escalates to 1.
          Defender, rather than face the risk of deeper loss, concedes.
          Outcome: (W_1, L_1)

     This is the credibility problem: the threat to resist is hollow.

     Then in phase 2, the Defender is allowed to commit in advance to a random event at the top. For example, the Defender can publicly wire the retaliation decision to a coin flip if they are attacked at the top. Then the Defender at rung 4 will not have a choice: the coin will decide. And there is a probability p that the coin will order retaliation (mutual destruction) and probability 1-p that it will not (concede).

     Now, at rung 4, if the Challenger escalates to 4, the expected payoff for the Challenger is:
          p * ( mutual destruction payoff ) + (1-p) * ( win at 4 payoff )
          = p * (-1000) + (1-p) * (40)   [using our first numerical example]

     If this expected payoff is negative, then the Challenger will not want to escalate to 4.

     Then, at rung 3, the Defender can threaten to match, and if the Challenger escalates to 4, they risk mutual destruction. If the expected payoff at 4 is negative, then at rung 3 the Challenger might prefer to stop (standoff at 3) rather than escalate to 4.

     So let's use the first numerical example (with fixed prize and no cost accounting) for simplicity, but add mutual destruction at -1000.

     Payoff table for phase 2 might be the same as phase 1, but with the change at the top: if the Defender matches at rung 4, then with probability p, mutual destruction happens (both -1000), and with probability 1-p, the Defender's retaliation fails and the Challenger wins (C:40, D:-40).

     In phase 2, the Defender can publicly commit to this randomized response at rung 4.

     Now, backward induction for phase 2:

     At rung 4: 
          If the Challenger escalates to 4, the retaliation is automatic and randomized. The expected payoff for C: p*(-1000) + (1-p)*40.
          For D: p*(-1000) + (1-p)*(-40).

     We need to choose p such that the expected payoff for C at rung 4 is < the standoff payoff at rung 3 (which is -25). For example, if p=0.1, then expected C: 0.1*(-1000)+0.9*40 = -100 + 36 = -64, which is < -25.
          So if p>=0.1, then at rung 3, the Challenger, after the Defender matches, will prefer to stop (standoff at 3: -25) rather than escalate to 4 (expected -64).

     Therefore, at rung 3, if the Defender matches, then the Challenger will stop.

     Then at rung 3, the Defender's choice:
          If they match, then the outcome is standoff at rung 3: -25 for both.
          If they concede, they get -30.

     So they prefer to match (-25 > -30).

     Then at rung 2, if the Defender matches, the Challenger then has the choice:
          stop: standoff at rung 2: -15.
          escalate to 3: then the Defender will match at 3, and then the Challenger will stop, outcome standoff at 3: -25.
          -15 > -25, so they stop at rung 2.

     So if the Defender matches at rung 2, the outcome is standoff at rung 2: both -15.

     Defender at rung 2: 
          if they match, they get -15.
          if they concede, they get -20.
          so prefer to match.

     At rung 1:
          if the Defender matches, then the Challenger can:
               stop: standoff at 1: -5.
               escalate to 2: Defender matches, then Challenger stops: standoff at 2: -15.
               -5 > -15, so stop at 1.
          outcome: standoff at 1: both -5.

          Defender at rung 1: 
               match: -5.
               concede: -10.
               so prefer to match.

     Therefore, in phase 2, with the randomized deterrent at the top, the Challenger will escalate to 1, the Defender will match, and then the Challenger will stop. Outcome: standoff at rung 1.

     The deterrence works: the Defender's threat to match at rung 1 is credible because they are willing to do it (since it leads to only standoff at rung 1, which is better than conceding). And the reason the standoff happens is because the Challenger is deterred from escalating further by the threat of the randomized retaliation at the top.

     This is the effect we want.

     So let's design the game around this.

     We will use the first numerical example for payoffs:

          Rung 1: 
               Concede: C=10, D=-10
               Standoff: both=-5

          Rung 2:
               Conceive: C=20, D=-20
               Standoff: both=-15

          Rung 3:
               Concede: C=30, D=-30
               Standoff: both=-25

          Rung 4:
               Concede: C=40, D=-40
               Mutual destruction: both=-1000

     In phase 1 (without commitment), we expect the Defender to concede at the first rung.

     In phase 2, we introduce a randomized device at rung 4: if the Challenger escalates to 4 and the Defender has committed to the randomized response, then mutual destruction happens with probability p=0.1, and concede with probability 0.9.

     We need to set p so that the expected value at rung 4 for the Challenger is < standoff at rung 3 (-25). 
          EV_4 = p*(-1000) + (1-p)*40 = -1000p + 40 - 40p = 40 - 1040p.
          Set 40 - 1040p < -25  => -1040p < -65 => p > 65/1040 = 1/16 = 0.0625.

     So p=0.1 is sufficient.

     Now, the corollary: once the top is made unthinkable (safe from intentional reach), the contest occurs at lower rungs. In phase 1, the contest was settled at rung 1 by the Defender conceding immediately. In phase 2, the contest goes to rung 1 and then stops in a standoff. So the lower rung (1) becomes the site of the crisis, and the outcome is standoff at that level, which is a lower-level stability but still a crisis.

     Also, note that the top is never reached in phase 2, but there is a risk of accident throughout because the randomized device is in place. However, in our game, the accident only happens if the escalation reaches rung 4.

     We can also introduce an additional element: during the escalation, there might be a risk of accident at lower rungs? That would be more realistic, but for simplicity, we focus on the top.

     Game design:

     We need roles: 
          Team Challenger (C)
          Team Defender (D)
          Team Chance (CH): they will handle the random event at rung 4 in phase 2.

     Materials: 
          Whiteboard to display the escalation ladder and payoffs.
          A die for randomization (with p=0.1: for example, a 10-sided die, and if it lands on 1, mutual destruction; or a 6-sided die, and mutual destruction on 1, so p=1/6≈0.1667).

     Alternatively, to get exactly p=0.1, we can use a 10-sided die or a bag with 10 tokens (1 of which is destruction).

     Timeline for 90 minutes:

     0-10 min: Introduction and set-up. Explain the rules for phase 1. Divide the students into three groups: C, D, and CH. CH will not do much in phase 1. 

     10-30 min: Phase 1. 
          - The groups should be in separate areas to discuss.
          - The escalation ladder is displayed.
          - The game is played in a series of moves:

               Move 1: C decides whether to escalate to rung 1 or not. If not, the status quo remains (0,0) and the game ends.
               If they escalate to 1, then D decides: concede or match.
               If D concedes, outcome: C=10, D=-10.
               If D matches, then C decides at rung 1: stop or escalate to 2.

               If stop, outcome: both=-5.
               If escalate to 2, then D at rung 2: concede or match.

               And so on until rung 4.

          - We expect in phase 1 that D will concede at rung 1.

     30-50 min: Phase 2.
          - Now, the Defender is allowed to publicly commit to a randomized response at rung 4. They must do this before the game starts (at the beginning of phase 2). They explain to the Challenger that if the escalation reaches rung 4, then a randomization device will determine the response: with probability p=0.1, mutual destruction; otherwise, they concede.
          - The Chance team will be in charge of rolling the die at rung 4 if needed.
          - Then the game is played again from the beginning.

          - We expect: 
               C escalates to 1.
               D matches.
               C then has to decide: stop or escalate to 2.

               If they stop, outcome standoff at 1: (-5,-5).
               If they escalate to 2, then D at rung 2: we expect D to match (because they know that at rung 3 they can force a standoff at 3, etc.)

               But let's see: at rung 2, if D matches, then C must decide: stop or escalate to 3.
                   If stop, outcome (-15,-15).
                   If escalate to 3, then D at rung 3: will match (because if they match, then C will stop at 3? Because escalating to 4 has an expected value of -64, which is worse than -25).

               So at rung 3, after D matches, C will stop.

               Therefore, at rung 2, if D matches, they will get -15. If they concede, -20. So they match.

               Then at rung 1, after D matches, C has: stop -> -5, or escalate to 2 -> eventually they will stop at rung 3 and get -25. So they will stop at 1.

               So the game ends at rung 1 standoff.

          - But note: the students might not play optimally. They might escalate further. That's okay, because it will show the risk.

          - If they do escalate to rung 4, then the Chance team rolls the die. With probability p, mutual destruction happens, with probability 1-p, the Defender is deemed to have conceded.

     50-70 min: We can run phase 2 multiple times to see the effect. Or we can have a third phase to show the corollary.

     Alternatively, for the corollary: we can have a variant where the top is completely off the table (both sides rule out mutual destruction) and see how the contest shifts to lower rungs and becomes more unstable there.

     Phase 3 (optional): 
          - Remove the randomized deterrent. Instead, both sides agree that mutual destruction is unacceptable, so they will never choose it. Therefore, at rung 4, the Defender will always concede.
          - But also, they might try to introduce a randomized deterrent at a lower rung, say rung 3.

          - For example, the Defender might commit to a randomized response at rung 3: if the Challenger escalates to rung 3, then with probability q, the Defender will automatically escalate to rung 4 (leading to mutual destruction, which is now ruled out? Wait, but if they rule out mutual destruction, then they wouldn't do that).

     This might be too complex.

     Instead, in the debrief, we can discuss: 
          - In phase 2, the top was made unthinkable (because of the risk of accident) but the contest then occurred at rung 1 and ended in a standoff there. 
          - What if we made the top completely safe by agreement (no accidents either)? Then the Defender would have to concede at the top, and the backward induction would make them concede at the first rung again.

     So the corollary is: 
          - When the top is made safe (intentionally unreachable), then the lower rungs become the only arena, and there is no deterrence so the Defender concedes early.
          - When the top is made dangerous by the risk of accident (even though both sides don't want it), then the lower rungs become more stable in the sense that the contest stops at a lower rung, but that lower rung experiences a standoff.

     In the debrief, we can contrast the outcomes of phase 1 and phase 2.

     Timeline:

     0-10: Setup and explanation of phase 1 rules.
     10-30: Phase 1 gameplay and discussion.
     30-40: Explanation of phase 2 rules (with commitment device).
     40-60: Phase 2 gameplay.
     60-75: Optional: Phase 3 or a variant to illustrate the corollary? Or move to debrief.
     75-90: Debrief.

     How to illustrate the corollary in gameplay? We can try a phase 3:
          - Remove the randomized deterrent. Instead, both sides sign an agreement that they will not go to rung 4. So if the escalation reaches rung 3, the Defender cannot match by going to rung 4. They can only have a standoff at rung 3 or concede.
          - But then the deterrent for the lower rungs is gone.

          - In phase 3, the rules are the same as phase 1, but the escalation stops at rung 3. At rung 3, if the Defender matches, then the Challenger can only stop (standoff at rung 3) because they cannot escalate to 4.

          - Backward induction:

               At rung 3: 
                    If the Challenger escalates to 3, the Defender can:
                         concede: C=30, D=-30.
                         match: then Challenger must stop (because cannot escalate to 4), outcome standoff at 3: both=-25.
                    Defender: -25 > -30, so they match.

                    Then the Challenger at rung 3 (after Defender match) has no choice but to stop, so they get -25.

               At rung 2:
                    If the Challenger escalates to 2, Defender can:
                         concede: C=20, D=-20.
                         match: then Challenger can stop (standoff at 2: -15) or escalate to 3.
                               If escalate to 3: then as above, they will get -25 (because Defender will match and they have to stop).
                               So Challenger: max of -15 and -25 -> stop at 2.
                         So if Defender matches, outcome is standoff at 2: both=-15.

                    Defender: -15 > -20, so match.

               At rung 1:
                    If the Challenger escalates to 1, Defender can:
                         concede: -10.
                         match: then Challenger can stop (-5) or escalate to 2.
                               If escalate to 2: then Defender matches and Challenger stops at 2: -15.
                               So Challenger: stop at 1 (-5) is better than escalating to 2 (-15), so they stop.
                         outcome: standoff at 1: both=-5.

                    Defender: -5 > -10, so match.

               So outcome: standoff at rung 1.

          - This is the same as phase 2? But without the risk of accident.

          - However, in phase 3, the top is safe by agreement, and the contest still stops at rung 1.

          - This does not illustrate the corollary that the lower rungs become more unstable.

     Alternatively, we can change the agreement: they agree that mutual destruction is not an option, but they don't change the rules for lower rungs. So in phase 3, the escalation can still go to rung 4, but at rung 4 the Defender will always concede (as in phase 1). Then the backward induction will be the same as phase 1: the Defender will concede at rung 1.

     This illustrates the corollary: 
          - In phase 1 (top is safe by rationality but not by accident): contest settled at the bottom by early concession.
          - In phase 2 (top is dangerous by accident): contest becomes a standoff at the bottom.
          - In phase 3 (top is explicitly safe by agreement): contest again settled at the bottom by early concession.

     So the standoff at the bottom only happens when the top is dangerous.

     We can run phase 3 as follows: 
          - The agreement: both sides pledge not to use mutual destruction. Therefore, if the escalation reaches rung 4, the Defender will not have the randomized device. Instead, the Defender will simply concede (because mutual destruction is off the table and they don't have the randomized commitment anymore).
          - So the top is safe and the Defender will concede at rung 4.

          - Then backward induction is the same as phase 1: the Defender will concede at rung 1.

     So in phase 3, we expect the Defender to concede at rung 1.

     Then we can compare:
          Phase 1: early concession (peaceful but one-sided)
          Phase 2: standoff at rung 1 (crisis frozen at a low level)
          Phase 3: early concession again

     The corollary is that when the top is dangerous, the contest migrates to the lower rungs and freezes there. When the top is safe, the contest is settled at the lowest rung by concession.

     So in terms of stability of the lower rungs: in phase 2, the lower rung (1) is the site of an ongoing standoff, which might be unstable in its own right (because it could accidentally escalate?). In phase 1 and 3, the lower rung is settled immediately.

     We might say that the lower rungs become more dangerous in the sense that they are more likely to be the site of a standoff when the top is dangerous.

     Timeline adjusted for three phases:

     0-10: Setup and explanation of phase 1.
     10-25: Phase 1 gameplay.
     25-35: Explanation of phase 2.
     35-50: Phase 2 gameplay.
     50-55: Explanation of phase 3.
     55-65: Phase 3 gameplay.
     65-90: Debrief.

     Debrief (15 minutes):
          - Ask the students to describe what happened in each phase and why.
          - Map to the paradox:
              First half (credibility problem): In phase 1 and 3, the Defender's threat to resist at high levels was not credible, so they conceded early.
              Second half (the cure and its price): In phase 2, the Defender used a commitment device (randomized retaliation) to make the threat credible, and this deterred the Challenger from escalating beyond rung 1. But note that in phase 2, there was a risk (10%) of mutual destruction if the escalation had reached rung 4.

          - Corollary: When the top is made safe (phase 3), the contest is settled at the lowest rung. When the top is made dangerous (phase 2), the contest freezes at the lowest rung in a standoff. So the lower rung becomes the new arena, and it is more dangerous in the sense that it is active and might have the potential to escalate accidentally? (We didn't model accident at lower rungs, but we can discuss.)

     What will go wrong?

     - Students might not play optimally. In phase 1, the Defender might match at rung 1. Then the Challenger might not escalate further, leading to standoff at rung 1. That's okay, because it shows there are multiple equilibria? But we want to show the credibility problem. 

       How to handle: In the debrief, you can discuss why the Defender matched even though it was not optimal. Maybe they hoped the Challenger would stop? But in the rational model, the Challenger will escalate if it's in their interest. So you can remind the students to play to maximize their payoffs.

     - Teams colluding: The Challenger and Defender might agree to stop at a low level to avoid risk. That's okay, but it might not show the dynamics. Encourage them to play to win.

     - The arithmetic might have a dominant strategy: We have designed the payoffs to have specific backward induction paths. But if the students find a different path, that's a teaching moment.

     - The chance mechanism might feel arbitrary: It is arbitrary, but that's the point. The risk is unowned.

     What this format cannot reproduce:

     - The epistemic fog of a real crisis: In the game, the payoffs and rules are known. In reality, there is uncertainty about the other side's payoffs and intentions.

     - The moral weight of the actual weapons: The points are abstract.

     - The difference between genuine irrationality and chance: In the game, the randomized device is a substitute for the loss of control. In reality, a leader might cultivate a reputation for irrationality, which is a different kind of commitment.

     We'll proceed to write the full design.
answer: |-
  ### Nuclear Deterrence Simulation: "The Brink"  
  *Design to illustrate the paradox of credibility, dangerous commitment, and ladder migration*

  ---

  #### **Game Setup**  
  **Materials**: Whiteboard (display escalation ladder & payoffs), 1 six-sided die, 10 red chips (disaster tokens), 20 blue/20 green chips (points for Challenger/Defender), paper for secret bids.  
  **Roles**:  
  - **Challenger** (C): Seeks to escalate to gain concessions. *Goal: Maximize blue chips*.  
  - **Defender** (D): Resists escalation to protect status quo. *Goal: Maximize green chips*.  
  - **Chance** (CH): Manages randomization. Rolls die, holds disaster tokens.  

  **Escalation Ladder (5 Rungs)**:  
  | Rung | Conflict Stage             | If Defender Concedes (C wins) | If Standoff (both match, no further escalation) | If Escalation to Next Rung |  
  |------|----------------------------|-------------------------------|------------------------------------------------|----------------------------|  
  | 1    | Diplomatic Crisis          | C: +5, D: -5                  | C: -2, D: -2                                  | Proceed to Rung 2          |  
  | 2    | Conventional Military Moves| C: +8, D: -8                  | C: -4, D: -4                                  | Proceed to Rung 3          |  
  | 3    | Tactical Nuclear Alert     | C: +12, D: -12                | C: -7, D: -7                                  | Proceed to Rung 4          |  
  | 4    | Strategic Nuclear Threat   | C: +15, D: -15                | C: -12, D: -12                                | Proceed to Rung 5          |  
  | 5    | Mutual Destruction (MD)    | C: +20, D: -20                | **Auto-disaster**: Both lose everything        | N/A                        |  

  **Key Mechanics**:  
  - **Phase 1**: D relies on *rational threats* (no external commitment).  
  - **Phase 2**: D uses a **randomized tripwire** (die roll at Rung 5).  
  - **Phase 3**: Both teams sign a "No Mutual Destruction Pact" (removes Rung 5).  

  ---

  #### **Phase 1: Hollow Threats (20 mins)**  
  *Rules*:  
  1. C starts at Rung 0 (status quo: 0 points).  
  2. Each turn, C decides: *Escalate* or *Stop*.  
  3. If C escalates, D decides: *Concede* (C wins current rung) or *Match* (standoff; both pay standoff cost).  
  4. If D matches, C chooses: *Escalate further* or *Stop* (standoff locked).  
  5. **Payoff arithmetic check**:  
     - At Rung 4, if D matches, standoff costs both -12.  
     - If C escalates to Rung 5, D *always concedes* (D: -20 > MD’s total loss).  
     - Backward induction: D should concede at Rung 1 to avoid deeper losses (C: +5, D: -5).  

  *Predicted Outcome*:  
  C escalates to Rung 1 → D concedes (C wins +5).  
  *Why*: D’s threat to match is hollow—both know D won’t risk Rung 5.  

  ---

  #### **Phase 2: Dangerous Commitment (25 mins)**  
  *Rules*:  
  - D publicly commits to a **randomized tripwire at Rung 5**:  
    - If C escalates to Rung 5, CH rolls die.  
    - **1–2 (33%)**: Disaster (both lose all chips + 1 red token as "catastrophe marker").  
    - **3–6 (67%)**: D concedes (C wins +20).  
  - All other rules same as Phase 1.  

  *Predicted Outcome*:  
  1. C escalates to Rung 1 → D matches (standoff: both -2).  
  2. C *stops* instead of escalating further.  
  *Why*:  
  - At Rung 4, C’s choice:  
    - Standoff: -12.  
    - Escalate to Rung 5: 33% chance of total loss (expected value: 0.67×20 - 0.33×100 ≈ -18).  
  - C stops early to avoid risk. **Deterrence works**—but only because disaster is possible.  

  ---

  #### **Phase 3: Safer Top, Riskier Bottom (20 mins)**  
  *Rules*:  
  - Both sign the "**No MD Pact**": Rung 5 is removed. If Rung 4 escalates, D *must* concede (C wins +15).  
  - All other rules same as Phase 1.  

  *Predicted Outcome*:  
  C escalates to Rung 1 → D concedes immediately (C: +5, D: -5).  
  *Why*: With Rung 5 gone, D has no credible threat. Contest resolves at lowest rung.  

  ---

  #### **Timeline (90 mins)**  
  1. **Set-up (10 mins)**: Explain rules, divide into teams (C, D, CH), distribute chips.  
  2. **Phase 1 (20 mins)**: Run simulation. Record outcomes on whiteboard.  
  3. **Phase 2 (25 mins)**: Introduce tripwire. Run simulation.  
  4. **Phase 3 (20 mins)**: Introduce pact. Run simulation.  
  5. **Debrief (15 mins)**: Guide discussion using questions below.  

  ---

  #### **Debrief (15 mins)**  
  *Goals*: Elicit the paradox without naming it. Map gameplay to concepts.  

  1. **Phase 1 Recap**:  
     - *Question*: "Why did Defender concede so early? What did both teams know about Rung 5?"  
     - *Key Insight*: Threats under rational control are hollow—D would never *choose* Rung 5.  

  2. **Phase 2 Recap**:  
     - *Question*: "Why did Challenger stop at Rung 1 this time? What changed?"  
     - *Key Insight*: D’s threat worked by surrendering control (die roll).  
     - *Follow-up*: "Who ‘owned’ the risk of disaster? Was it worth it for Defender?"  
     - *Key Insight*: Credibility requires danger—the price is accidental catastrophe.  

  3. **Phase 3 Recap**:  
     - *Question*: "When Rung 5 was banned, why did the conflict collapse to Rung 1?"  
     - *Key Insight*: Making the top safe shifts conflict downward.  
     - *Corollary*: "Is the bottom *more stable* or just *more active* now?"  

  4. **Synthesis**:  
     - Name the paradox: *"You felt the credibility problem (Phase 1), the dangerous cure (Phase 2), and how ‘safety’ at the top destabilizes the bottom (Phase 3)."*  
     - Connect to history: "This mirrors Cold War dynamics—MAD relied on shared risk, not rational choice."  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Students play emotionally, not strategically**:  
     - *Fix*: Remind them: "You are state actors. Maximize your chips."  

  2. **Teams collude to avoid disaster**:  
     - *Fix*: Assign a "hawk" student to each team to advocate escalation.  

  3. **Payoff arithmetic ignored**:  
     - *Fix*: Simplify math upfront ("Negative numbers = losses"). Use chips for visual stakes.  

  4. **Die roll feels arbitrary**:  
     - *Fix*: Pre-frame CH as "fog of war," not a game mechanic.  

  5. **Phase 2 deters too well (no one escalates)**:  
     - *Fix*: If C escalates recklessly, let disaster happen—it teaches the risk.  

  ---

  #### **What the Game Cannot Simulate**  
  - **Epistemic fog**: Real leaders don’t know payoffs or intentions. *Supply this via discussion: "In 1962, JFK/Khrushchev guessed at red lines."*  
  - **Moral weight**: Points trivialize annihilation. *Supply this: "Imagine chips are cities."*  
  - **Irrationality vs. randomness**: Cultivated madness (Nixon’s "madman theory") feels different from dice. *Supply this distinction post-game.*  

  ---

  **Why Not Chicken?**  
  Unlike Chicken, this uses a multi-rung ladder, randomized enforcement, and a pact to dynamically shift conflict levels. The mechanics *generate* the paradox through payoff-driven choices, not pre-stated dilemmas. Students *experience* escalation logic, credibility traps, and ladder migration—no lecturing needed.
