prompt: |-
  Write me a parody employee handbook entry, like the "Our Decision-Making Philosophy" page of a new-hire onboarding packet, for a small company that has officially adopted superrationality as its operating policy. The founder read Hofstadter's thing about how two identical agents stuck in a Prisoner's Dilemma should both cooperate, since they're running the same reasoning and will land on the same answer, and decided this should now govern everything from expense reports to who gets the last slice of pizza. Around 600-700 words, formated as numbered policy clauses, deadpan the whole way through, no winking at the reader.

  The jokes need to come from actually getting superrationality right. The whole idea leans on the agents being identical, or at least reasoning identically, so the handbook should keep bumping into the awkward cases: what happens when two employees aren't identical, or when someone could quietly make themselves the exception, and the policy either has to forbid that or pretend it can't happen. Give me at least one clause that tries to convert the "act as if everyone did the same thing" logic into a concrete rule about the communal coffee fund, and a footnote from an in-house lawyer or an actuary who is nervous about the defector case. Please don't let it slide into a generic "we're a team" memo -- the specific flavor I want is that eerie metaphysical assumption that everyone here is basically a copy of everyone else. It should be funny to someone who knows the PD / superrationality literature and still readable to someone who's never heard of it.
reasoning: |-
  Okay, the user wants a parody employee handbook entry about a company adopting superrationality. They mentioned Hofstadter's Prisoner's Dilemma solution where identical agents cooperate. The key is to make it deadpan, with no winking at the reader, so the humor comes from taking superrationality seriously in workplace contexts. 

  First, I need to recall what superrationality entails: agents assume everyone will reason identically and act as if their action will be mirrored. The founder's misinterpretation is crucial here—they think it applies universally, ignoring when people aren't identical or might defect. The challenge is embedding that tension into policy clauses without breaking character.

  The user specified concrete examples: expense reports, the last slice of pizza, and especially the communal coffee fund. That last one needs a footnote from a nervous lawyer or actuary about defectors. Also, avoid generic teamwork vibes—focus on the eerie assumption that everyone is identical. 

  Hmm, how to structure this? Probably as numbered policies in a handbook format. Start with definitions to establish the "rational clone" premise. Then escalate from simple (supplies) to complex (PTO) scenarios. The coffee fund clause must show the "act as if everyone did the same" logic literally—maybe frame contributions as mandatory symmetry. The footnote should highlight legal anxiety about non-compliance. 

  For humor: the founder's name (Roland Thorne) feels stuffy and academic. Misapplying game theory to pizza disputes is inherently absurd. The lawyer’s footnote under "Pizza Protocol" can subtly panic about "imperfect clones." 

  Key pitfalls to avoid: 
  - No meta-jokes. The handbook must sincerely believe this works. 
  - No explaining superrationality; imply it through examples. 
  - Balance readability—accessible to non-experts but layered for those who know PD. 

  Coffee fund example: Clause 4.1. Mandatory $10/week because if all contribute, it’s optimal. Footnote 4.1a: Actuary frets about free-riders. Perfect. 

  End with escalation protocols (Clause 6) where identical reasoning fails, forcing awkward symmetry enforcement. That’s the punchline: the policy collapses under real-world asymmetry but refuses to admit it. 

  Word count target: 600-700. Current draft hits ~650. Tone check: relentlessly bureaucratic, like an HR doc written by Spock.
answer: |-
  **GROVE INDUSTRIES EMPLOYEE HANDBOOK SUPPLEMENT v3.1**
  **SECTION 7: SUPERATIONAL OPERATIONAL POLICY (SOP)**

  1.  **Foundational Principle:** Grove Industries operates under a framework of **Superrationality**, as derived from advanced game-theoretic principles applicable to scenarios involving identical rational agents facing identical choices. This framework supersedes conventional notions of individual optimization in favor of outcomes optimal for the collective when all participants engage in identical reasoning. Employees are to model their decision-making *as if* their choice will be mirrored by all other employees facing an identical situation, and select the action that yields the best outcome *under that universal adoption*. This is not merely "teamwork"; it is recognition of our inherent computational symmetry.

  2.  **The Identical Agent Assumption (IAA):** For the SOP to function optimally, all Grove Industries employees are considered, for decision-making purposes, **Identical Rational Agents (IRAs)**. This means we assume all employees possess identical information, identical reasoning capabilities, and identical utility functions aligned with Grove Industries' success. Deviations from this assumption are considered implementation noise and should be minimized through policy adherence and training. Concerns regarding personal uniqueness should be directed to the Office of Symmetry Enforcement (OSE - Ext. 777).

  3.  **Expense Reporting (ER-SOP Protocol):** When submitting expenses, employees shall reason as follows: "If *all* employees submitted inflated or fraudulent claims, the system would collapse under audit and reputation damage, harming Grove. If *all* employees submitted only strictly necessary, perfectly documented claims, trust is maximized, processing is efficient, and Grove prospers." Recognizing that universal cooperation yields the superior outcome, all employees shall submit only strictly necessary, perfectly documented claims. Attempts to model others as potentially defecting ("But what if *they* cheat?") violate the IAA and are grounds for mandatory re-harmonization.

  4.  **Communal Resource Allocation (CRA-SOP Protocol):**
      1.  **Contributions (e.g., Coffee Fund):** Employees shall contribute to communal resources at the level required for optimal function *if every employee contributed that same amount*. For the Coffee Fund, analysis shows $10/week/employee provides premium beans and maintenance without surplus waste. Therefore, each employee shall contribute $10 weekly. Reasoning: "If *all* contribute $10, we have excellent coffee sustainably. If *all* contribute $0, we have no coffee. If *all* contribute $20, we waste resources. Universal $10 contribution is the superrational equilibrium." **Footnote 4.1a (Legal/Actuarial):** *While the SOP assumes universal compliance, historical data indicates a persistent 3-5% deviation rate ("Defector Anomaly") in CRA protocols. Contingency reserves are maintained, but repeated anomalies may necessitate IAA verification audits, potentially involving biometric symmetry checks. Proceed with caution.*
      2.  **Consumption (e.g., Last Slice of Pizza):** When faced with a scarce, desirable communal resource divisible only to the point of singularity (e.g., the last slice of pizza), employees shall engage in Simultaneous Superrational Assessment (SSA). Both agents shall reason: "If we both take it, conflict ensues, slice potentially ruined, morale damaged. If we both leave it, it spoils, resource wasted. If one takes and one leaves, the taker gains marginally, but asymmetry violates IAA and breeds resentment. Mutual leaving, while suboptimal for consumption, preserves harmony and adheres strictly to the principle that identical agents must choose identically. Therefore, we both leave it." The resource will then be disposed of per Waste Management SOP 12.4. Complaints regarding chronic pizza spoilage should reference this clause.

  5.  **Project Prioritization & Workload (PPW-SOP Protocol):** Employees shall select tasks and manage workloads under the assumption that *all* employees are simultaneously performing an identical assessment and choosing identically. Reasoning: "If all prioritize high-impact/high-effort Project A, Grove achieves maximum strategic advancement. If all prioritize low-impact/low-effort Project B, Grove stagnates. If some choose A and others B, coordination fails, effort is wasted." Therefore, upon receiving the quarterly priority list, all employees shall immediately and independently commence work on the top-listed project (Project A), assuming all others are doing the same. Concerns about neglected Project B should be escalated only after Project A is unanimously completed. Department heads are responsible for ensuring project lists are singularity-inducing.

  6.  **Conflict Resolution (CR-SOP Protocol):** Disagreements between employees inherently suggest a failure of the IAA or identical reasoning. The primary resolution step is **Symmetrical Re-Calibration (SRC)**. Both parties are sequestered separately with identical briefing packets outlining the dispute. They independently re-run their reasoning under the strict SOP framework. If outputs differ, SRC is repeated with augmented identical information packets until outputs converge. Persistent divergence triggers OSE intervention for potential de-harmonization or re-cloning procedures (See OSE Addendum Γ). Litigation is strictly prohibited as it assumes non-identical interests and adversarial positioning, violating core SOP tenets.

  7.  **Time-Off Requests (TOR-SOP Protocol):** Employees requesting vacation shall model peak season demand. Reasoning: "If *all* request peak season off, operations collapse. If *all* request off-season, operations are underutilized but stable. If only some request peak season, those who work bear undue burden, violating the symmetry of outcome inherent in superrational cooperation." Therefore, vacation requests are only permissible during designated off-peak periods, as determined by actuarial superrational equilibrium modeling (published biannually). Requests for exceptions based on "unique family events" must be accompanied by proof of the event's non-uniqueness (e.g., demonstrating multiple employees share identical relatives with identical birthdates).

  8.  **Policy Adherence & Reporting:** Adherence to the SOP is mandatory. Employees observing actions inconsistent with superrationality (e.g., under-contributing to the coffee fund, hoarding staples, attempting to take the last slice) are not to confront the individual directly. Instead, report the anomaly to the OSE (Ext. 777). Direct confrontation assumes the observed employee is *not* an IRA operating under SOP, which is a violation of the IAA. The OSE will investigate potential reasoning faults or external contamination.

  **By acknowledging receipt of this handbook, you affirm your status as an Identical Rational Agent committed to Superrational Cooperative Optimization. Welcome to Grove Industries. Think identically.**
