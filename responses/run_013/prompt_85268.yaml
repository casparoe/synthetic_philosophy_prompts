prompt: |-
  I am writing a novel in which a character's memory and planning live as much in her notebooks as in her head, and I would like the underlying claim stated precisely enough to defend in the text. Take the proposition: a novelist who composes against a private, always-open notes file — consulted without deliberation and trusted without checking — has that file as a literal part of her cognitive system, so that a plan or belief recorded only there is hers. Give me your credence in that proposition, decomposed. How much rides on whether functional equivalence entails sameness of kind; how much on whether the coupling conditions — constant availability, automatic endorsement, easy accessibility — are necessary, sufficient, or neither; how much on whether belief can survive at the level of a file rather than a state of the organism; and how much on whether the location of a mental state is a substantive question or a verbal one. A number and one line of justification for each term, then the combination. Then alter the case: the file's contents were largely drafted by an AI assistant the novelist reads and endorses. Tell me how far your credence moves, which term carries the movement, and which single argument or finding would move the original figure most. My own number is about 0.6, and I suspect I want the metaphor to be true.
