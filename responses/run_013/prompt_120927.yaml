  Breaking down the layers:
  First, Skinner's operant conditioning does mirror Darwinian selection - random variations in verbal behavior get selected via reinforcement. But crucially, Skinner avoids positing any internal comprehension. The reinforcement history becomes the "designer" substitute.

  Chomsky's counterproposal is trickier. His innate faculty IS Darwinian design (species evolution without a designer), but the child's use of it requires no comprehension of grammatical rules. Here comprehension exists only in the linguist's theory, not the speaker. 

  Modern LLMs force new questions. Their statistical patterns achieve surface competence, but systematicity objections (like inability to handle novel constructions) reveal gaps. This suggests comprehension isn't just "understanding rules" but something about robust generalization - which neither Skinner's reinforcement nor Chomsky's innate grammar fully captured.

  The core tension: both inversions displace comprehension from the actor to the system (evolution/culture for Darwin, algorithm for Turing). But the persistence of systematicity concerns hints that competence alone isn't satisfying - we keep expecting "understanding" to show up somewhere.

