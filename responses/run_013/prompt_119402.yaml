  - Includes marking scheme with 5 must-hit points (20 marks total)

  I'll start by crafting a question using the swap test scenario. The rock substitution is perfect because it isolates the variable of "real suffering" versus "perceived suffering." This directly challenges the Kantian position. The reason/evidence distinction should be woven into the question to push students to differentiate between suffering as a moral reason versus a diagnostic tool.

  For the model answer, I'll structure it to first explain Kant's actual view clearly, then apply the swap test to show how it breaks down. The answer should explicitly state where it's paraphrasing Kant versus reconstructing. The conclusion should address what Kantians must sacrifice (anthropocentrism) to grant intrinsic value to animal suffering.

