prompt: |-
  I write novels for a living, which mostly means I spend my days asking why a character does what they do, and I've noticed I have very firm gut reactions about when a good deed gets spoiled by the reason the person attaches to it — and absolutely no idea what rule those reactions add up to. Any chance you can find one for me? Here's what I keep coming back to.

  A man is on a sinking boat, his wife and a stranger are both in the water, he can only get to one, he grabs his wife. Asked why, he says: she's my wife. I think that's perfect. Nothing's missing from it. Same rescue, but he says: she's my wife, and anyway I'd be within my rights to save whoever I was closest to. The deed is identical and I think slightly less of him — as if he'd had to check whether he was allowed.

  Flip to the stranger. A woman I don't know swims out for a person she's never met, and afterwards says she did it because every life counts the same, his as much as hers. I don't hear a thought too many there. I hear something admirable. If she'd said she had no idea why she did it, I'd think she was either lying or just running on instinct, and instinct isn't the same thing as goodness.

  Now the case that turns the whole thing over for me. A friend of mine spent thirty years on a painting practice that was obviously the point of her life, and gave it up to run her dead brother's failing shop because the money would do more good going there. I think she did something admirable and something terrible at once and I can't say which comes first. If she'd kept painting and told me that everyone's allowed some room for their own work, I'd definately have heard exactly the thought I disliked in the drowning man. And yet when someone else — a nurse I know — won't sign a false form to get medicine into a place that needs it, because lying is wrong, and people go without, I think she's protecting her own clean hands at their expense. But if she signed it and felt nothing at all, I'd think something was missing in her too.

  Is there one principle that gets all of these, or close? And which of my reactions does it make me give up? I'd also like to know what it predicts for a case I genuinely haven't settled: a father who does every right thing for his kids, but always because it's his duty and never once because they're his.
reasoning: |-
  Okay, let's tackle this novelist's dilemma. They're wrestling with why certain motivations behind good deeds feel "spoiled" while others don't. They've provided several scenarios to illustrate their gut reactions, and now they want a unifying principle. 

  First, I need to map their examples clearly. The drowning husband who saves his wife with a simple "she's my wife" feels pure, but adding "I had the right" taints it. The stranger saving a life because "every life counts equally" feels noble, while claiming "no idea why" feels instinctual, not moral. Then it gets thorny: the artist abandoning her life's work for family obligation feels both admirable and terrible, while the nurse refusing to lie for a greater good seems selfish. 

  Hmm... the common thread might be about ownership versus detachment. When the drowning husband claims his right, he's distancing himself from the emotional core of "she's my wife." The artist's sacrifice feels tragic because she's severing her identity (painting) for duty, similar to how the nurse's rigid honesty prioritizes abstract rules over human need. 

  But the life-saving stranger's "every life counts" works because it's an affirmative belief, not a detachment. Interesting! The father-doing-his-duty example might fail because he's treating his children as obligations rather than extensions of himself. 

  Wait—could this be about whether the motivation integrates the action into the person's sense of self? The "spoiled" examples feel like justifications tacked on after the fact (husband's legalistic addendum) or external impositions (artist's duty, nurse's rules). The "pure" motivations flow from identity: spousal love, egalitarian conviction. 

  The nurse case is tricky though. If she lied *for* the greater good, that might feel integrated if it aligned with her values (e.g., "saving lives matters more than paperwork"). But refusing to lie because "rules are rules" splits her identity from the suffering. Similarly, the artist's sacrifice would feel less tragic if she framed it as "keeping my brother's legacy alive is now part of who I am" rather than pure duty. 

  For the father: if he engages because "they're my kids" = inseparable from his identity, it lands differently than "duty" = external obligation. The unifying principle might be: **Does the reason make the action feel like an authentic expression of the person, or like a performance for external validation/absolution?** 

  This explains why the husband's legal justification feels icky (seeking absolution) and the nurse's rigidity feels selfish (prioritizing her own moral scorecard). The artist's sacrifice feels tragic because she's suppressing her authentic self for external "shoulds." 

  What would this principle ask the novelist to surrender? Probably the instinct to wholly condemn the nurse—if her refusal stems from deep integrity (e.g., "lying undermines medical systems"), it might be authentic, but if it's rote rule-following, it's not. Context matters. Likewise, the duty-bound father might be expressing love through duty if that's his cultural language. The principle demands nuance: motivations aren't binary good/bad but exist on a spectrum of integration into selfhood.
answer: |-
  Your gut reactions reveal a beautifully consistent principle: **Motivation is judged not by the deed itself, but by whether the reason *integrates* the action into the agent's core identity or *detaches* it as an external obligation, calculation, or performance.**

  This principle explains all your examples:

  1.  **The Drowning Spouse (Good):**
      *   "She's my wife." → The reason *integrates* the action. Saving her flows directly from his identity *as her husband*. It's an expression of who he is and the bond he embodies. There's no distance between the actor and the act.
      *   "...and anyway I was within my rights..." → The addendum *detaches* the action. He steps outside the identity-based reason and appeals to an external rulebook ("rights"). It feels like he's justifying himself to an imagined judge, creating distance. The act feels less purely an expression of love and more like a performance checked against rules.

  2.  **The Life-Saving Stranger (Good):**
      *   "Every life counts the same." → The reason *integrates* the action. It expresses a core ethical belief she holds, making the act an authentic expression of her values and identity (as someone who believes in fundamental equality). It's who she *is*.
      *   "I don't know why." → This *detaches* the action. It severs the deed from any conscious identity or value system. It reduces it to reflex or impulse, which feels morally neutral or accidental, not an expression of "goodness" rooted in character.

  3.  **The Artist & the Shop (Admirable & Terrible):**
      *   **The Deed:** Sacrificing her life's work for family obligation.
      *   **Your Reaction (Admirable):** The *integration* aspect: She acts on a core value (family loyalty, fulfilling a perceived duty to her brother). It's an expression of a deep part of her identity, even if painful.
      *   **Your Reaction (Terrible):** The *detachment* aspect: She sacrifices her *core identity* (artist) for an *external obligation* ("should"). The act feels detached *from her authentic self*, creating a profound inner conflict. It's admirable *because* it integrates a value (family duty), but terrible *because* it detaches from her deepest identity (artist).
      *   **The Counterfactual (Painting):** "Everyone's allowed room for their own work." → This feels like the drowning husband's rights-justification. It *detaches* the action (continuing her work) from her identity and appeals to an abstract, external rule ("allowance"). It feels defensive, justifying her choice rather than owning it as an expression of who she is. You dislike the *detachment*.

  4.  **The Nurse & the False Form (Bad):**
      *   "Lying is wrong." → This *detaches* the action (inaction). She prioritizes an abstract rule ("lying is wrong") over the concrete human need *and* the potential good she could do. The rule becomes an external barrier, detaching her from the human consequence. It feels like protecting her own "clean hands" (a detached performance of personal purity) at the expense of others.
      *   **Counterfactual (Signing & Feeling Nothing):** This *detaches* completely. Signing the form isn't integrated into any value system (compassion? rebellion against bureaucracy?); it's either amoral indifference or mere instinct, lacking the moral weight of conscious, identity-based choice.

  5.  **The Father (Your Unsettled Case):**
      *   "Always because it's his duty and never once because they're his." → This is pure *detachment*. His actions are performed because of an external obligation ("duty"), not because they flow from the integrated identity of "father" and the inherent love/connection that *should* be part of it. The deeds are correct performances, but feel hollow, unmoored from the core relationship that gives them meaning and warmth. He's acting *on* duty, not *out of* fatherhood. The principle predicts you would find this lacking, perhaps even sad or chilling, despite the correct actions.

  **The Principle Summarized:**

  *   **Integrated Motivation:** The reason makes the action feel like a *natural, authentic expression* of the person's core identity, values, or relationships ("This is who I am," "This is what I believe," "This is what love/friendship/this bond means").
  *   **Detached Motivation:** The reason makes the action feel like it's done *because of* an external factor – rules (rights, duties, prohibitions), calculations (cost/benefit, "allowance"), performance (looking good, avoiding guilt, "clean hands"), or instinct devoid of conscious value.

  **What This Principle Asks You to Give Up (or Nuance):**

  1.  **The Absolute Primacy of Outcome:** It forces you to accept that even a "good" outcome can feel spoiled if the motivation detaches the actor from their core self or the human connection involved (e.g., the drowning husband's addendum, the nurse's refusal). The *why* fundamentally alters the moral resonance.
  2.  **Simplicity in Sacrifice:** It makes the artist's sacrifice inherently complex and tragic *because* integration and detachment are at war within her single motive. There is no purely "admirable" or "terrible" verdict possible. You have to hold both.
  3.  **Condemning All Rule-Following:** It asks you to recognize that rules *can* be integrated if they are deeply held *as part of someone's core identity and values* (e.g., a deeply principled pacifist refusing to fight). The problem arises when rules are *detached* shields or performances (the nurse). You need to discern the *source* of the rule within the person.
  4.  **Valuing Instinct Over Conviction:** You have to accept that "I don't know why" (instinct) feels less morally substantive than a conviction like "every life counts," even if the deed is the same. Instinct is neutral; integrated conviction has moral weight.

  **In essence, your gut is reacting to the *authenticity* and *ownership* of the motivation in relation to the actor's self. Does the reason make the deed feel like it emanates *from* the person's heart and identity, or is it tacked on, defensive, or performed *for* something external? That's the rule your reactions reveal.** This principle gives you a powerful lens to dissect character motivation and understand why certain "good" deeds ring hollow while others, even smaller ones, resonate deeply.
