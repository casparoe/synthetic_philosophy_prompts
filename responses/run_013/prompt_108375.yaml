prompt: |-
  I have to run a ninety-minute session for a reading group of non-specialists—intelligent adults with no logic or mathematics—on tangled hierarchies and the inviolate level. Do not explain the idea to me; plan how I should teach it. I want the inviolate level presented not as a higher rung on the same ladder but as the generative outside that makes the tangle possible, and I want the familiar image of two hands each drawing the other held back until the end, as a test case rather than the carrying example. Give me exactly five numbered items, each a sentence or two, with no introduction or conclusion: first, the order in which the components must be introduced and what depends on what; second, the one example that should carry the session, what it must have and lack, and why not the two hands; third, the misconceptions they will bring or form—especially that the inviolate level is just the top level, that the tangle is a contradiction, and that the inviolate level is a hidden cause—and the point in the sequence where each must be headed off; fourth, the check for understanding that would show the idea has landed; fifth, what I should leave out at this level and say so.
