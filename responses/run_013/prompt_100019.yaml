  ok so I need an outside read on something thats been bugging me. My teammate Priya is the person everyone pings when a bug gets nasty, and over the last two years, whenever she and I have disagreed about what caused an incident, she's been right about 8 times out of 10 (our manager literally keeps a spreadsheet of it, I know how that sounds). Last week we disagreed again: I think the outage came from the new caching layer, she's sure it was the load balancer, and we have to roll one of them back tonight. I've spent two days in the logs and I'm pretty confident it's the caching layer. But that 8-out-of-10 number is still in my head telling me to just flip and agree with her, and I can't do it, it would feel like saying something I think is false. Two wrinkles: her record is almost all on memory-corruption bugs and this is a concurrency/timing thing, and she wrote the caching layer herself, so she isn't exactly neutral. Am I being irrational for not defering to her? Can you even decide to believe something you don't believe? And what do I actually do tonight.
