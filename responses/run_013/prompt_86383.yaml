prompt: |-
  I'm a novelist at work on a literary novel whose protagonist is a mathematician, and one scene turns on a lecture she gives about Gödel's incompleteness theorems to an audience of non-mathematicians. The scene has to work on two levels at once: she should be saying things a competent mathematician would endorse, and the two or three places where she reaches past what the theorems actually support should be legible as overreach to a reader who knows the material. For research I have been leaning on a popular trade book about the limits of mathematics — the kind that gets the history and the drama right and the logic a little glossy. Here is the gist of the passage I have been working from, as I have absorbed it:

  "The first incompleteness theorem shows that in any consistent system of mathematics rich enough to describe arithmetic, there are statements that are true but that the system can never prove — true of the numbers, true in every model of the axioms, and permanently beyond the reach of proof. The second theorem shows that such a system can never prove its own consistency, so mathematics can never be certain that it is not harboring a contradiction. Together the two results demolished Hilbert's program, which had hoped to place all of mathematics on an unshakable foundation. Gödel reached them by a single trick, a version of the liar paradox: he built a sentence that says of itself that it is not provable, so that if you could prove it you would make it false, and if you cannot prove it, then it is true. Some philosophers have taken the theorems to show that the human mind is not a machine, since we can see the truth of the Gödel sentence while no computer can. And some physicists have drawn a further moral: no final theory of nature can ever be written, because whatever laws we discover, there will be facts they cannot reach. What no one disputes is that mathematics is permanently incomplete — there will always be truths beyond proof — and that the dream of a finished, fully certified mathematics died in 1931."

  I would like an accuracy audit I can act on. Take the passage claim by claim and tell me what a philosopher of mathematics — not a hostile one, just a careful one — would accept, wince at, or reject. I am inclined to think the last sentence overreaches, since I have a vague sense that some mathematical theories are provably complete and even decidable, but I cannot tell whether that is a real objection or my own confusion.

  I want your verdicts, not a menu. Where specialists disagree, tell me which side you would take and why, and what argument or evidence would move you. Do not hand me the interpretations and leave me to choose, and do not hedge the audit as a whole; if a claim is wrong, say so plainly. I do not need citations or a reading list.

  Please answer in American English, and give me the audit as a table with exactly these columns, one row per claim:

  - claim — the claim from the passage, quoted or paraphrased in a few words.
  - precise version — the exact thesis the claim would have to be in order to be true, including any qualification it silently drops.
  - verdict — exactly one of: Sound; Harmless simplification; Needs a qualification that matters; Misleading; False.
  - why — the reason for that verdict, naming the missing condition or the counterexample.
  - specialist's version — one or two sentences of how a careful philosopher of mathematics would put the same point.
  - keep, fix, or cut — what my character should do with the line, with the revised wording if there is one.

  Lead with a short paragraph, three sentences at most, giving your overall verdict on the passage as a summary and saying whether my character's closing moral about physics survives once the earlier claims are corrected.
reasoning: |-
  Alright, let's tackle this query. The user is a novelist working on a scene where a mathematician explains Gödel's theorems to a non-mathematical audience. The passage they provided has some inaccuracies, and they need an accuracy audit. 

  First, I need to break down each claim in the passage. The user mentioned that some parts might overreach, especially the last sentence. They want a clear verdict on each point without hedging. 

  Starting with the claim about the first incompleteness theorem stating there are true but unprovable statements. The key here is "true in every model." The problem is that unprovable statements aren't necessarily true in all models; they depend on the model. For example, the Gödel sentence is true in the standard model but false in non-standard ones. So this claim is misleading without specifying the model.

  Next, the second theorem's claim that math can't prove its own consistency. This is mostly sound but needs a qualifier: the system must be sufficiently strong and the proof must be done within the system itself. Without that, it's an oversimplification. 

  The part about demolishing Hilbert's program is a simplification. While Gödel's results were a major blow, Hilbert's program adapted with modified goals like proof theory. So it's not entirely accurate to say it was completely demolished.

  The liar paradox explanation is a harmless simplification. Gödel used a similar idea but avoided the paradox by using provability instead of truth. For a lay audience, this analogy works even if it's not precise.

  The philosophical claim about the human mind vs. machines is contentious. Experts like Lucas and Penrose argue for it, but many logicians disagree, pointing to mechanisms that can "see" the truth. This is misleading without noting the controversy.

  The physics analogy about no final theory is a stretch. Gödel’s theorems apply to formal systems, not necessarily physical laws. This is an overreach and should be cut or heavily qualified.

  Finally, the last sentence claims math is permanently incomplete. But there are complete theories like Presburger arithmetic. Saying "mathematics" as a whole is incomplete ignores decidable subsystems. This is false without specifying "sufficiently strong" systems.

  The user's character should correct the overreaches, especially the last line and the physics analogy. The specialist would emphasize conditions like "sufficiently strong consistent systems" and avoid broad statements about all math or physics.
answer: |-
  Here's your accuracy audit. The passage captures Gödel's cultural impact but contains significant overstatements. Your character's physics analogy doesn't survive correction; it's an unsupported leap.

  | **claim**                              | **precise version**                                                                                                  | **verdict**                 | **why**                                                                                                   | **specialist's version**                                                                                                                                                                | **keep, fix, or cut**                                                                                     |
  | :------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :-------------------------- | :-------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- |
  | **1. True but unprovable statements exist in any consistent system describing arithmetic.** | In any consistent formal system capable of expressing basic arithmetic, there exists a sentence G such that neither G nor its negation is provable *within the system*, and G is true in the standard model of natural numbers. | **Needs a qualification that matters** | "True in every model" is incorrect. The unprovable sentence is true *in the standard model* but can be false in non-standard models satisfying the same axioms. | Gödel's first theorem shows that for any consistent formal system encompassing arithmetic, there is an arithmetical statement undecidable by the system's rules, which is nonetheless true when interpreted in the intended model of natural numbers. | **Fix:** "...there are statements true *of the natural numbers* that the system can never prove."         |
  | **2. System cannot prove its own consistency.** | No consistent formal system F capable of expressing basic arithmetic can prove a formal statement encoding "F is consistent" *using the means of proof available within F itself*. | **Harmless simplification** | Omits "within itself" and "sufficiently strong," but these are usually implied in context.                                                                 | The second incompleteness theorem states that if such a system is consistent, then a formalization of the statement of its own consistency cannot be proven *within the system*.        | **Keep**                                                                                                 |
  | **3. Results demolished Hilbert's program.** | Gödel's theorems showed that Hilbert's specific goal of proving the *finitistic* consistency of all mathematics (especially infinitistic parts like set theory) via a *single*, *complete*, and *decidable* formal system was unattainable. | **Needs a qualification that matters** | Hilbert's Program was multifaceted. Gödel destroyed core ambitions (finitistic proof of completeness/consistency for *all* math), but proof theory (modified Hilbertian research) survived and thrived. | Gödel's incompleteness theorems dealt a fatal blow to the central aims of Hilbert's Program by demonstrating the impossibility of a finitistically provable, complete, and consistent formal system encompassing all mathematics. | **Fix:** "...demolished the central aims of Hilbert's program..."                                        |
  | **4. Gödel used a version of the liar paradox.** | Gödel constructed a sentence G whose metamathematical meaning is "G is not provable in system F". This is analogous to the liar paradox but crucially uses *provability* (a syntactic, system-dependent concept) instead of *truth* (semantic). | **Harmless simplification** | Using "liar paradox" glosses over the critical distinction between truth and provability which Gödel meticulously navigated to avoid paradox. | Gödel's key insight was arithmetizing syntax to construct a self-referential sentence asserting its own *unprovability* within the system, achieving a formally rigorous analogue of paradoxical statements. | **Keep**                                                                                                 |
  | **5. Theorems show mind is not a machine (Lucas-Penrose).** | The Gödelian argument against mechanism claims that for any formal system (machine) F, a human mathematician can see the truth of F's Gödel sentence G_F, which F cannot prove, hence human reasoning transcends any machine. | **Misleading**              | Highly contentious. Most logicians/philosophers reject it. Counterarguments: Humans might be inconsistent machines; humans don't "see" truth of *all* G_F; mechanisms might "see" G_F via different systems. | While some philosophers (Lucas, Penrose) argue Gödel's theorems demonstrate human minds surpass machines, this interpretation is widely disputed by logicians and philosophers of mind, who point to flaws in the underlying assumptions. | **Fix:** "...*Some philosophers, like Lucas and Penrose, argue* the theorems show... *though this is highly contested.*" |
  | **6. Physics analogy: No final theory of nature.** | No formal system capable of expressing basic arithmetic can be both complete and consistent.                                                                                       | **Misleading**              | Wild overextension. Physical laws aren't formal systems for arithmetic. Gödelian incompleteness applies to *mathematical frameworks*, not necessarily to empirical scientific theories predicting observations. | There is no established connection between Gödel's theorems about formal mathematical systems and the possibility of a complete "Theory of Everything" in physics. The applicability is speculative at best. | **Cut** or **Radically Qualify:** "*Some have speculatively suggested* that, by analogy..."               |
  | **7. Mathematics is permanently incomplete.** | Any consistent formal system sufficiently strong to express basic arithmetic is incomplete (first theorem).                                                                        | **False**                   | "Mathematics" ≠ "All formal systems for arithmetic." Many *specific* mathematical theories (Presburger arithmetic, Tarski's geometry, real closed fields) are complete and decidable. | Gödel showed that *sufficiently strong* axiomatic systems for arithmetic are inherently incomplete. However, significant and useful parts of mathematics can be formalized in weaker systems that *are* complete and decidable. | **Fix:** "...that *sufficiently powerful axiomatic systems for mathematics* are permanently incomplete..." |

  **Recommendation for your character's closing:** Keep the core mathematical points (Claims 1-4, fixed) as her lecture. Have her *tentatively suggest* the Lucas-Penrose view (Claim 5, fixed) as a *philosophical interpretation some hold*, making it legible as potential overreach. **Cut the physics analogy (Claim 6).** Explicitly qualify the "permanently incomplete" claim (Claim 7) to specify "systems rich enough for arithmetic," subtly showing her awareness of complete subsystems and preventing a false generalization.
