answer: |-
  ### Decision Tree: Genetic Information & the Coding Metaphor  
  **Starting Point:** Genes are causally implicated in protein production.  

  ---

  #### **Q1. Does this causal role justify calling DNA "informational"?**  
  - **A: Yes, if there’s reliable correlation** (statistical/causal covariation). → **Q2**  
  - **B: Yes, but only if DNA *represents* something** (aboutness/function required). → **Q2**  
  - **C: Yes, but only if a system *uses* it as information** (consumption required). → **Q2**  
  - **D: No** → **Leaf: *Eliminativism***.  
    *Awkward: Must explain why "information" is pervasive if misleading.*  

  ---

  #### **Q2. Is the codon → amino acid mapping arbitrary?**  
  *(Variant codes exist: e.g., some mitochondria translate STOP as amino acids.)*  
  - **A: Arbitrary** (convention-like, like Morse code). → **Q3**  
  - **B: Constrained** (chemistry/selection dominate; a regularity, not a code). → **Q3**  

  ---

  #### **Q3. Does "genetic code" explain anything unique?**  
  - **A: Yes** (indispensable for explaining specificity, error, or evolution). → **Q4**  
  - **B: No** (dispensable; molecular interactions suffice). → **Q4**  

  ---

  #### **Q4. Where is information primarily located?**  
  - **A: In DNA** (sequence as instructions).  
  - **B: Distributed** (DNA is one resource in a developmental system).  

  ---

  ### **Leaves (Positions)**  
  | Path (Q1→Q2→Q3→Q4) | Position Name                 | Most Awkward Commitment                                                                 |
  |---------------------|-------------------------------|-----------------------------------------------------------------------------------------|
  | **D**               | *Eliminativism*               | Explain pervasiveness of "information" if it’s just a metaphor.                         |
  | **A→A→A→A**         | *Code Realism*                | Explain how molecules "encode" without a mind or convention-bearer.                     |
  | **A→A→A→B**         | *Extended Code Realism*       | Defend distributed arbitrariness (how can a convention be spread across molecules?).    |
  | **A→A→B→A**         | *Unnamed*                     | Accept arbitrariness but deny coding’s explanatory role while privileging DNA location. |
  | **A→A→B→B**         | *Causal Information* (e.g., Sterelny) | Explain why "code" metaphors persist if dispensable.                           |
  | **A→B→A→A**         | *Constrained Code Realism*    | Defend "code" without arbitrariness (undermines analogy to human codes).                |
  | **A→B→A→B**         | *Unnamed*                     | Defend indispensable constrained coding while distributing it (rare).                   |
  | **A→B→B→A**         | *Unnamed*                     | Privilege DNA location without arbitrariness or explanatory need for coding.            |
  | **A→B→B→B**         | *Regularity-Based Information* | Explain how constraints make correlation "informational" if not arbitrary.              |
  | **B→A→A→A**         | *Teleosemantic* (e.g., Maynard Smith) | Ground "aboutness" in evolution without intentional design.                     |
  | **B→A→A→B**         | *Unnamed*                     | Defend distributed intentionality (what part has the "representational function"?).     |
  | **B→A→B→A**         | *Unnamed*                     | Accept DNA-based aboutness but deny coding’s explanatory role.                          |
  | **B→A→B→B**         | *Unnamed*                     | Defend distributed, non-explanatory aboutness (unmotivated).                            |
  | **B→B→A→A**         | *Unnamed*                     | Defend constrained mapping as representational (how does selection "assign" meaning?).  |
  | **B→B→A→B**         | *Unnamed*                     | Defend distributed constrained representation (doubly strained).                        |
  | **B→B→B→A**         | *Unnamed*                     | Defend DNA-based aboutness without arbitrariness or explanatory coding.                 |
  | **B→B→B→B**         | *Unnamed*                     | Defend distributed, constrained, non-explanatory aboutness (incoherent?).               |
  | **C→A→A→A**         | *Interpreted Code*            | Identify cellular "interpreter" without anthropomorphism.                               |
  | **C→A→A→B**         | *Unnamed*                     | Defend distributed interpretation (what subsystem "consumes" information?).             |
  | **C→A→B→A**         | *Unnamed*                     | Accept interpretation but deny coding’s explanatory role (why "code" then?).            |
  | **C→A→B→B**         | *Consumer-Based Information*  | Specify "consumption" without intentionality (e.g., ribosomes as "readers"?).           |
  | **C→B→A→A**         | *Unnamed*                     | Defend interpretation of non-arbitrary mapping (why "interpret" a regularity?).         |
  | **C→B→A→B**         | *Unnamed*                     | Defend distributed interpretation of constrained mapping (unattractive).                |
  | **C→B→B→A**         | *Unnamed*                     | Defend consumption without arbitrariness or coding explanations.                        |
  | **C→B→B→B**         | *Unnamed*                     | Defend consumption of constrained correlation, distributed, dispensable coding (messy). |

  ---

  ### **Notes**  
  - **Indistinguishable Positions:**  
    - *Causal Information* (A→A→B→B) and *Consumer-Based Information* (C→A→B→B) both reject intentionality and privilege distributed explanations. The tree cannot separate them on dispensability/location; they differ only on whether "correlation" (Q1-A) or "consumption" (Q1-C) defines information.  
    - *Diagnosis:* Ambiguity in defining "information" leads to overlapping minimalisms.  

  - **Empty/Incoherent Combinations:**  
    - **Q1=B + Q2=B + Q3=B + Q4=B:** Requires intentionality without arbitrariness, explanatory coding, or a clear locus. Likely **incoherent** (no clear advocate).  
    - **Q1=C + Q2=B + Q3=A + Q4=B:** "Distributed interpretation of constrained code" lacks proponents; **unexplored/unattractive** due to tension between interpretation and constraint.  

  - **Variant Codes:** Cut **for arbitrariness** (Q2-A). If chemistry dictated codon assignments, variants wouldn’t evolve. Their existence supports conventionality.  

