  - **Insincere proposal**: A partner proposes at a party as a "joke," later claiming it wasn't real. The other insists it was sincere (abuse) vs. misfire due to tone/context. This highlights how context blurs lines.  
  - **Contested officiant**: At a wedding, an unauthorized friend "marries" a couple. The couple considers it valid (abuse: insincere officiant), but the friend says misfire (no authority). The bureaucratic absurdity could be funny.  

  The workplace scenario feels strongest—it’s relatable, and the HR-employee debate maps cleanly to Austin. Punchline: HR voiding it as misfire ("not in writing!") while the employee groans about hollow regret, forcing the audience to pick a side.  

