  Liberties taken: Real resignations *do* often require writing, but Austin might not fuss over that—he cares more about uptake. Still, bending rules for comedy works. If abuses were reclassified as misfires, the joke’s tension dissolves. But since the debate exists, the joke *uses* that ambiguity.  

  Final pick: Workplace resignation. It’s tight, philosophically meaty, and the HR’s pedantry vs. employee’s guilt is inherently funny. The note will clarify the interpretive choice so teachers can debate it.  

