  Starting with non-negotiable requirements. Since the theory is for practical guidance, the agent must be able to use it under time constraints. So, **Action-Guidance** is crucial—it must output a decision. **Hard Choice Recognition** is vital too; the theory should identify when choices are hard due to incommensurability. **Rationality Without Optima** allows decisions without a best option. **Residue Affirmation** acknowledges regret post-choice. **Tie Avoidance** prevents mislabeling hard choices as equal options. These are all necessary for real-world application.

