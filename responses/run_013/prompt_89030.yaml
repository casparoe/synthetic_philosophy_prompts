answer: |-
  Here’s a specification for your value theory paper, designed to evaluate rival accounts of incommensurable values and hard choices. I’ve structured it around **requirements**, **cases**, **distinctions**, and **results**, with explicit markers for non-negotiable demands (given your purpose of practical guidance), camp-specific commitments, and conflicting pairs. The "ruling out" requirement is highlighted at the end.

  ---

  ### **Core Purpose**  
  A theory must provide **action-guidance for an agent facing a hard choice under time constraints** (e.g., "must choose by Friday"). It should not merely describe value relations but output a defensible decision.  

  ---

  ### **Requirements & Their Rationale**  
  *(Non-negotiable = ⚠️ | Camp-specific = ⭐)*  

  1. **⚠️ Action-Guidance (AG)**  
     - **Case**: An agent must choose between career A (meaningful but low-paid) and career B (lucrative but unfulfilling) by Friday.  
     - **Rationale**: The theory must output a choice (e.g., "pick A" or "pick B"), not just declare values incomparable.  
     - *Non-negotiable*: Guidance requires a verdict.  

  2. **⚠️ Hard Choice Recognition (HCR)**  
     - **Case**: Two options where *neither is better, worse, nor exactly equal* (e.g., becoming a musician vs. a lawyer).  
     - **Rationale**: Must diagnose genuine incommensurability, not just ambiguity.  
     - *Non-negotiable*: Avoids misclassifying hard choices as easy.  

  3. **⭐ Trivial Improvement Immunity (TII)**  
     - **Case**: Option A (musician) is improved by adding $1 to its salary. If A was not better than B (lawyer) before, it still isn’t after.  
     - **Rationale**: Tests whether values are *robustly* incommensurable (Raz’s challenge to comparativism).  
     - *Camp-specific*: Raz/Incomparabilists insist on this; comparativists (e.g., Chang) reject it.  

  4. **⭐ Revisability (REV)**  
     - **Case**: An agent chooses career A over B, but can switch back to B next week at near-zero cost (e.g., no sunk costs).  
     - **Rationale**: Permissible reversibility suggests no "best" option exists (Chang’s voluntarism).  
     - *Camp-specific*: Central to "permission" views; opposed by optimizers.  

  5. **⭐ No Resolution Tolerance (NRT)**  
     - **Case**: A choice must be made while the agent sees no prospect of future clarity (e.g., lifelong divergence in value).  
     - **Rationale**: Some hard choices lack epistemic resolution; guidance can’t wait for "eureka."  
     - *Camp-specific*: Emphasized by unresolved conflict theories (e.g., Williams).  

  6. **⚠️ Distinguish Incommensurability vs. Incomparability (DIV)**  
     - **Distinction**: Values may be incommensurable (no common measure) *without* implying options are incomparable (no rational choice possible).  
     - **Rationale**: Collapsing these paralyzes agents; guidance requires comparability *of options* even with incommensurable *values*.  
     - *Non-negotiable*: Otherwise, no action-guidance.  

  7. **⚠️ Distinguish Incommensurability vs. Uncertainty (DIU)**  
     - **Distinction**: An agent’s struggle may stem from *incommensurable values* (e.g., justice vs. mercy) vs. *ignorance of her own values* (e.g., unsure how much she values family).  
     - **Rationale**: Guidance differs: resolving uncertainty requires introspection; handling incommensurability requires normative tools.  
     - *Non-negotiable*: Misdiagnosis leads to flawed remedies (e.g., "just learn your preferences").  

  8. **⚠️ Rationality Without Optima (RWO)**  
     - **Result**: A choice can be rational even if no option is "best" (e.g., picking A when A ≠ B and B ≠ A).  
     - **Rationale**: Denying this reduces hard choices to irrationality or indecision.  
     - *Non-negotiable*: Core to the phenomenology of hard choices.  

  9. **⚠️ Residue Affirmation (RA)**  
     - **Result**: Regret/residue (e.g., "I did the right thing but mourn the lost value") survives the choice.  
     - **Rationale**: Denying residue misrepresents the cost of hard choices.  
     - *Non-negotiable*: Essential for accounting for moral emotions post-choice.  

  10. **⚠️ Tie Avoidance (TA)**  
      - **Result**: Rejects that "neither better nor worse" implies exact equality (e.g., choosing between children).  
      - **Rationale**: Collapsing incommensurability to equality ignores the conflict of values.  
      - *Non-negotiable*: Ties are easy choices; hard choices are not ties.  

  ---

  ### **Conflicting Pairs**  
  These requirements **cannot be jointly satisfied** by existing theories:  

  1. **TII vs. AG**  
     - If no trivial improvement makes A better than B (TII), how can the theory guide choice (AG)? *Raz denies AG is possible; Chang denies TII.*  
     
  2. **REV vs. RA**  
     - If choices are freely reversible (REV), why does residue persist (RA)? *Voluntarists (Chang) downplay residue; regret theorists (Williams) reject revisability.*  

  3. **NRT vs. Optimizing Models**  
     - If no resolution is in sight (NRT), optimizing models (e.g., expected utility) cannot apply. *Demands a non-maximizing rationality (RWO).*  

  ---

  ### **The Requirement That Rules Out Standard Positions**  
  **⚠️ Tie Avoidance (TA)** does the most to exclude rival theories:  
  - **Consequentialism/Utilitarianism**: Often reduces values to a single scale (e.g., utility), denying TA by collapsing "on a par" to equality.  
  - **Maximization Models**: Assume a "best" option exists, violating TA and RWO.  
  - **Vague Value Theories**: Treat hard choices as borderline cases of equality, denying TA’s insistence on sharp divergence.  
  - **Incomparabilism**: Claims TA implies no rational choice (violating AG and RWO).  

  *Why it’s decisive*: TA forces the theory to explain how a rational choice exists *without* implying the options are equal or one is better. Most theories sacrifice TA to preserve comparability (e.g., "rough equality") or deny rational choice exists (e.g., incomparabilism).  

  ---

  ### **Summary for Your Paper**  
  - **Non-negotiable for guidance**: AG, HCR, DIV, DIU, RWO, RA, TA.  
  - **Camp-specific**: TII (Raz), REV (Chang), NRT (Williams).  
  - **Key conflict**: TA vs. maximization/consequentialism.  
  - **Adequate theories must**: Explain rational action without a best option (RWO+TA), distinguish value conflicts from ignorance (DIU), and allow residue (RA) while outputting a choice (AG).  

  This framework exposes why standard models (e.g., utilitarianism, rigid maximization) fail hard choices: they violate TA and RWO. Rivals like Raz (incomparability) fail AG, while Chang’s parity may fail TII. A guidance-suitable theory must navigate these constraints—especially TA—to avoid collapsing the phenomena.
