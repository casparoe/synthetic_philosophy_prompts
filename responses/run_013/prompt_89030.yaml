  The user mentioned that **Tie Avoidance** is a major hurdle for standard positions. Many theories, like utilitarianism or maximization, can't handle choices that aren't ties but still lack a best option. This requirement challenges models that assume comparability.

  I should ensure the distinctions are clear. Confusing incommensurable values with incomparable options might lead to thinking no choice is possible, but the theory must allow decisions. Also, distinguishing incommensurability from uncertainty prevents misattributing the struggle to ignorance rather than value structure.

