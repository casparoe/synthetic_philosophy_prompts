answer: |-
  Here's a comprehensive exam question, model answer, marking scheme, and confidence assessment designed to meet your specifications.

  **Exam Question (20 marks, 90 minutes):**

  > **Critically evaluate** the proposal that an agent facing *moral uncertainty* should simply "maximise expected moral value" (MEMV). Your evaluation must address the following interconnected issues:
  >
  > 1.  **The Regress Problem:** Explain why choosing MEMV *itself* appears to be a substantive normative decision made under uncertainty. Does this lead to an infinite regress? If the regress stops, where and why is that stopping point justified rather than arbitrary? (8 marks)
  > 2.  **Two Types of Uncertainty:** Agents can be uncertain *between* competing moral theories (e.g., Utilitarianism vs. Deontology) or uncertain *within* a single accepted theory about its implications for a specific case (e.g., Kantianism on a complex lie). Are these two types of uncertainty fundamentally distinct problems requiring different decision procedures? Can MEMV adequately handle both? Justify your answer. (6 marks)
  > 3.  **The Swamping Problem:** Suppose an agent has a credence of 0.01 in an absolutist theory forbidding action X (e.g., "Never intentionally kill an innocent, even to save a million"), and 0.99 credence in a moderate theory permitting X in this case (e.g., Utilitarianism where X saves many lives). Explain how MEMV calculation might lead the agent to refrain from X despite the overwhelming credence in the permissive theory. Is this result primarily: (i) a devastating objection to MEMV as a procedure, (ii) an inevitable and acceptable consequence of taking moral uncertainty seriously, or (iii) something else? Defend your position. (6 marks)

  ---

  **Model Answer (Approx. 700 words):**

  The proposal to resolve moral uncertainty by Maximising Expected Moral Value (MEMV) is intuitively appealing: aggregate the moral value each action yields according to each theory, weighted by the agent's credence in that theory, and choose the action with the highest expected moral score. However, this procedure faces deep challenges concerning its own foundations, the nature of uncertainty, and its practical implications.

  **(1) The Regress Problem:** Advocating MEMV presupposes it is the *correct* procedure for navigating moral uncertainty. But determining the correct procedure is itself a higher-order normative question. Should we use MEMV, a maximin approach, a voting procedure among theories, or something else? Making this choice involves uncertainty about meta-normative principles governing decision-making under moral uncertainty. Applying MEMV to *this* choice seems circular, as MEMV is the procedure being evaluated. Attempting to apply MEMV at the next level (e.g., maximising expected meta-value over decision procedures) simply pushes the problem back: we now need a meta-meta-procedure to choose *that* procedure, initiating a regress. If this regress is infinite, practical decision-making becomes impossible. If it stops, the stopping point must be justified. A common stopping point is accepting MEMV as a fundamental normative axiom for decision-making under *any* normative uncertainty. However, this appears arbitrary: why MEMV and not maximin? Proponents might argue MEMV uniquely coheres with standard instrumental rationality under uncertainty, but this invokes a *further* normative commitment to instrumental rationality. Alternatively, one might stop at "reflective equilibrium" or intuitive plausibility, but these lack the precision MEMV promises and risk collapsing into intuitionism about the procedure itself. Justifying the stopping point without arbitrariness remains a core challenge; MEMV's foundational status seems assumed, not derived, making it vulnerable to the regress.

  **(2) Two Types of Uncertainty:** Uncertainty *between* theories (inter-theoretic) and uncertainty *within* a theory (intra-theoretic) are fundamentally distinct and pose different challenges for MEMV.
      *   **Inter-theoretic Uncertainty:** MEMV directly targets this. Its core function is aggregating value judgments across distinct, competing normative frameworks (T1, T2...Tn). The major hurdle here is **intertheoretic value comparison (ITVC)**: How do we commensurate "units of utility" (T1) with "respect for autonomy points" (T2) or "duty-fulfilment units" (T3)? MEMV requires a common scale, but there's no theory-neutral way to establish it. Attempts (e.g., normalizing ranges, variance-stabilizing) are controversial technical fixes masking deep philosophical problems.
      *   **Intra-theoretic Uncertainty:** This arises when an agent is confident in a *single* theory (e.g., Kantianism) but unsure how it applies to a complex, novel, or borderline case (e.g., "Is *this* lie a violation of the CI?"). MEMV *can* be applied here by treating different plausible *interpretations* or *extensions* of the accepted theory (I1, I2...Im) like "sub-theories," assigning credences, and calculating expected value *within* that theory's framework. However, this is conceptually different. Firstly, ITVC is (mostly) avoided as valuations stay within one theoretical ontology. Secondly, the uncertainty is epistemological (applying known principles) rather than metaphysical (which principle is true). MEMV handles intra-theoretic uncertainty *technically* but conflates it with the deeper, metaphysically laden inter-theoretic problem. A different procedure (e.g., seeking clearer interpretation, applying casuistry) might be more appropriate here, though MEMV offers a calculative approach if desired. MEMV wears the same coat for both, but the bodies underneath – the nature of the uncertainty and the core challenge (ITVC vs. epistemic application) – differ significantly.

  **(3) The Swamping Problem:** In the described scenario, MEMV can indeed dictate refraining from X. The absolutist theory assigns an astronomically negative value (effectively -∞) to performing X (killing the innocent). The moderate theory assigns a large positive value (+V) to X (saving many lives). Expected Value (X) ≈ (0.01 * -∞) + (0.99 * +V) ≈ -∞. Expected Value (~X) is finite (e.g., 0 on the absolutist theory, some negative value on the moderate theory for failing to save lives). Thus, MEMV strongly favours ~X. This is the "swamping" effect: a tiny credence in an absolutist theory with unbounded disvalue dominates the calculation.
      This result is best understood as **(ii) an inevitable and acceptable consequence of taking moral uncertainty seriously**, rather than a decisive objection to MEMV. If the absolutist theory is *possibly true* (credence > 0), and if it *genuinely* holds that performing X is infinitely wrong, then *any* non-zero chance of incurring infinite disvalue rationally swamps finite gains. The counterintuitiveness stems from the high stakes of moral realism and the potential existence of truly catastrophic wrongs. To object to this result *as a flaw in MEMV* is often to implicitly reject either the *possibility* of such absolutist theories being true or the *normative force* of credence-weighted expected value maximization when infinite values are involved. MEMV is merely revealing the frightening implications of combining moral uncertainty with the potential existence of extremely demanding or absolutist moral truths. While this might motivate exploring alternatives to MEMV (e.g., lexical thresholds), it primarily highlights a feature of the moral landscape under uncertainty, not necessarily a bug in the procedure itself.

  **Conclusion:** MEMV provides a structured approach to inter-theoretic moral uncertainty but faces a foundational regress problem, struggles with the distinct nature of intra-theoretic uncertainty, and dramatically exposes the high stakes of credence in absolutist theories through swamping. Its viability hinges on resolving ITVC and justifying its own adoption as the fundamental stopping point in the regress.

  ---

  **Marking Scheme (20 Marks Total):**

  **First-Class Answer (17-20 marks) MUST:**
  *   **(Regress)** Clearly articulate the regress: Choosing MEMV is itself a normative choice under uncertainty, requiring justification leading to a higher-level problem. (2) Explicitly state the dilemma: infinite regress vs. stopping point. (1) Identify a plausible stopping point (e.g., axiomatic acceptance of MEMV, appeal to rationality) *and* offer a substantive critique showing why justification at that point is problematic/arbitrary (e.g., alternatives exist, relies on unargued commitments). (3) *Avoid* simply saying "just be reflective" without explaining the regress or why reflection solves it. (2)
  *   **(Two Uncertainties)** Explicitly define and distinguish inter-theoretic (between theories) and intra-theoretic (within a theory, application) uncertainty. (2) Argue convincingly that they are distinct problems, highlighting the core difference: ITVC is the *central, unique challenge* for inter-theoretic, while epistemic application is the core for intra-theoretic. (2) State that MEMV can *technically* model intra-theoretic uncertainty (by treating interpretations as sub-theories) *but* explain why this is conceptually different (ITVC mostly absent, different nature of uncertainty). (1) Conclude clearly whether MEMV can handle both (maybe technically) or whether intra-theoretic is different (conceptually yes). (1)
  *   **(Swamping)** Accurately demonstrate the swamping calculation (tiny credence * huge disvalue dominates). (1) Correctly identify the result (likely refrain from X). (1) *Choose a clear position* (i, ii, iii) on whether it's an objection or a consequence. (1) Provide a *defended justification* for that position, specifically addressing *why* it's seen as objectionable (counterintuitive, paralyzing) *and* why it might be acceptable (taking possibility of catastrophe seriously, internal logic of MEMV). (2) *Must* engage with the "fact about morality" vs. "objection to procedure" aspect. (1)
  *   **Overall:** Precision, clarity, logical flow, synthesis across parts, correct terminology.

  **Mark Deductions (Specific Moves):**
  *   **-2 to -4:** **Regress:** Fails to articulate the regress clearly; treats choosing MEMV as unproblematic; answers regress solely with "just be more reflective" without engaging the foundational dilemma; asserts a stopping point (e.g., "we just stop at MEMV") without any critique of its arbitrariness.
  *   **-2 to -3:** **Two Uncertainties:** Fails to distinguish the two types clearly; conflates them entirely; asserts MEMV handles both identically without addressing the crucial role of ITVC for inter-theoretic and its absence for intra-theoretic; doesn't acknowledge MEMV *can* be applied technically to intra-theoretic.
  *   **-2 to -3:** **Swamping:** Incorrect calculation; misses the dominance result; avoids taking a stance; gives an undeveloped answer (e.g., "it's a problem" without analysis); *treats ITVC as a minor technicality easily solved* (e.g., "we can just assign numbers") without recognizing the deep philosophical problem this masks, especially for the swamping scenario where normalization attempts fail spectacularly.
  *   **-1 to -2:** **Swamping Position:** Poorly defended position; fails to engage with the core tension (objection vs. consequence of uncertainty/absolutism).
  *   **-1 to -2 per instance:** Significant factual inaccuracy, lack of clarity, poor structure, irrelevant points.

  ---

  **Confidence Assessment of Model Answer:**

  I am **highly confident** (85-90%) in the overall structure, the identification of the core problems (Regress, Two Types, Swamping), and the logical connections drawn between them. The distinctions made (e.g., inter vs. intra-theoretic, ITVC as the core inter-theoretic challenge) are well-established in the literature (e.g., MacAskill, Bykvist, Ord, Ross, Sepielli).

  *   **Most Confident Claims:**
      *   The existence and basic structure of the Regress Problem.
      *   The fundamental distinction between inter-theoretic and intra-theoretic uncertainty and the central role of ITVC for the former.
      *   The mechanism of the Swamping Problem with absolutist theories under MEMV.
      *   That MEMV *can* be technically applied to intra-theoretic uncertainty by treating interpretations as sub-theories.
  *   **Moderately Confident Claims:**
      *   The critique of "reflective equilibrium" as a solution to the regress being potentially vague/intuitionistic. (Confidence: 75% - it's a common critique, but some sophisticated reflective equilibrium approaches exist).
      *   The characterization of intra-theoretic uncertainty as primarily epistemological vs. inter-theoretic as metaphysical. (Confidence: 70% - it's a useful heuristic, but the lines can blur, e.g., uncertainty might stem from borderline cases challenging the theory itself).
  *   **Least Confident Claim (The one I'd bet least on):**
      *   **"MEMV handles intra-theoretic uncertainty *technically* but conflates it with the deeper, metaphysically laden inter-theoretic problem."** (Confidence: 60%).
          *   *Why?* While technically correct that MEMV *can* be applied, the claim that this *conflates* the problems might be too strong. A sophisticated proponent of MEMV (like Will MacAskill) might argue MEMV is precisely the *unified framework* intended to handle *all* normative uncertainty, whether about first-order theories or their correct application, treating uncertainty about interpretation as just another form of credence distribution over possible normative views (including views about what the correct theory entails). They might argue the "metaphysical" vs. "epistemological" distinction isn't fundamental to the *decision procedure* itself, only to the *source* of the credences. My model answer emphasizes the conceptual difference in the *nature* of the uncertainty and the core *challenge* (ITVC vs. application), which I think is valid, but the claim of "conflation" within the MEMV procedure itself could be debated. The model answer's core point – that ITVC is the unique, massive hurdle for inter-theoretic that is largely absent for intra-theoretic – stands, but the wording "conflates" might be slightly polemical.

  The position on the Swamping Problem being primarily a consequence (ii) rather than an objection (i) is a defensible philosophical stance, aligning with certain realist perspectives, though it's certainly contestable (hence the need for students to defend their position). The model answer provides a clear rationale for this stance.
