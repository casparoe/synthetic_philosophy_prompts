prompt: |-
  You're going to answer as someone who actually knows the measurement-and-incentives literature cold — Goodhart, Campbell's law, the management and accounting work on metrics, the sociology of indicators, the philosophy of measurement — and I'd like you to think hard before you commit to anything. Brainstorm privately if that helps, but give me your actual verdict, not a menu of options.

  Context on me: I've been reading LessWrong and SSC-adjacent blogs for about a decade, so I know the standard moves. I don't think this is a Goodhart question, or at least not only that, and I'd like to be told if I'm wrong.

  Here's the pattern I keep running into.

  Instance 1: a city public works crew gets measured on how many potholes they fix per quarter. Year one, numbers go up. But what actually changed is the unit. A single long trench that would have been one repair gets logged as eleven repairs, because the work order system just has a field for it and filling it in that way is not false. Nobody lied. Two years later the old figures are useless, because 1994's 4,000 repairs and this year's 12,000 repairs are not the same kind of thing and there's no way to convert.

  Instance 2: personal. I track deep work hours in a spreadsheet. Early on I only counted time when I was genuinely locked in. At some point answering Slack while half-reading a paper started counting. I could not tell you when, and I don't think I ever decided to switch. If I go back to the strict reading now my numbers crater, which feels like discovering I've been slacking, even though nothing about the actual work changed.

  Instance 3: a friend in college administration says the same thing happened with their retention rate. The words of the metric never changed. What changed is which students count as having been retained — transfers, people who left and came back, people who got a GED. Again, nobody is cooking the books; each judgment call is individually defensible. Again, the old series can't be compared to the new one.

  The shape, as best I can state it: nobody is lying or being cynical, the metric keeps its name and its wording, but its extension quietly drifts. The drift is in the definition rather than in anyone's effort. It ratchets — after the drift, going back to the old reading registers as failure, so there's pressure never to go back. And the tell is that you can't even measure how far it's drifted, because the unit moved along with the thing being measured, so there's no fixed baseline to compare against.

  Is there a name for this? To be clear, I'm not asking for a bibliography, reading list, or citations — I can't look anything up anyway, so please don't lean on them. I already know the usual suspects: Goodhart, Campbell's law, teaching to the test, perverse incentives, goal displacement, mission creep, concept creep, whatever the accounting people call it when a metric replaces the strategy (I have a vague memory of a term that sounds like surrogation, but I may be inventing it).

  What I want is the carving, not the label. Does this exact configuration have an established name, and if so which? If the nearest thing is X, say precisely where my pattern differs from X and where it doesn't. What is not an instance of it. Whether the ratchet and the in-principle-unmeasurability are essential to it or incidental. And whether the good-faith, no-deceiver aspect is what makes it a distinct phenomenon rather than just a polite species of gaming.

  Give it to me as a numbered list of exactly five items, one or two sentences each, no introduction and no wrap-up. Don't hedge and don't hand me five candidate terms with a shrug — pick the one you think actually fits and say why the others are worse, even if the honest answer is that nothing established fits and here's the term you'd coin and define.
reasoning: |-
  Okay, the user is asking about a specific pattern they've observed across different contexts—public works, personal productivity, and college administration. They describe a situation where a metric's definition drifts over time without anyone intentionally deceiving, leading to incomparable data and a ratchet effect. They mention being familiar with concepts like Goodhart's Law and Campbell's Law but feel this is distinct.

  First, I need to recall the key concepts. Goodhart's Law is about measures becoming targets and ceasing to be useful. Campbell's Law focuses on corruption when metrics are used for decision-making. But the user's examples don't involve direct gaming; it's more about gradual, unintentional drift in interpretation.

  The examples show that the metric's name stays the same, but the underlying criteria change subtly. The pothole repair shifts from one trench to multiple entries without falsifying data. Personal tracking of deep work hours expands to include less intensive tasks. Retention rates broaden to include various student cases. Each step is defensible, but over time, the metric's meaning changes, and reverting feels like failure. Also, the drift isn't measurable because the baseline shifted.

  I need to identify if there's an established term for this. The user mentioned "surrogation," which comes from accounting—when a metric replaces the strategy it was meant to measure. That seems relevant because in their instances, the metric (a surrogate) loses its original connection to the goal. However, surrogation usually implies a replacement, not necessarily the gradual drift described.

  Other terms like "concept creep" or "mission creep" might come close, but they focus more on the expansion of concepts or missions rather than measurement drift. "Indicator proliferation" or "definitional drift" aren't standard terms. The key elements here are the unnoticed semantic shift and the ratchet effect.

  The closest established term might be "surrogation" from the management accounting literature (e.g., Van der Stede, 2011). It describes when a surrogate metric loses its link to the underlying construct. However, typical discussions of surrogation might not emphasize the gradual, unintentional drift without deception. The user's pattern adds the element of imperceptible change and the inability to measure the drift.

  Another angle: in philosophy of measurement, "construct drift" refers to when a measure no longer captures the intended concept. But it's often used in psychometrics and might not be widely recognized in other fields. The user's examples span multiple domains, so a more interdisciplinary term would be better.

  Considering the ratchet effect and the good-faith aspect, the user is highlighting that the drift isn't malicious but systemic. The pressure not to revert because it would show a decline is crucial. This isn't just surrogation; it's an evolution of the surrogate's meaning. 

  The term "measurement mutation" could be coined here, combining surrogation's replacement aspect with the gradual, unplanned change. But since the user wants an established name, surrogation is the closest, even if it needs extension to include unintentional drift.

  To structure the response as five items: 

  1. **Core Phenomenon**: Established term is surrogation, but with added elements of drift.  
  2. **Distinction from Goodhart**: Goodhart involves gaming; this is semantic drift without deceit.  
  3. **Ratchet and Unmeasurability**: Essential as they prevent correction.  
  4. **Good-Faith Aspect**: Key differentiator from typical metric corruption.  
  5. **Term Choice**: Surrogation is the best fit, though it needs expansion for drift.
answer: |-
  1.  **The established core phenomenon is "surrogation" (management accounting term)**, where a metric (the surrogate) fully replaces the underlying construct it was meant to measure. Your pattern is surrogation *plus* gradual, unchosen semantic drift in the surrogate's *operational definition* itself, not just its motivational role.
  2.  **It differs critically from classic Goodhart/Campbell** by lacking active gaming/effort distortion. Goodhart focuses on agents *changing effort* to optimize the measure (e.g., fixing easy potholes). Your pattern is about the *meaning* of the measure unit changing unnoticed through interpretive drift ("pothole repair," "deep work," "retained student"), not effort allocation against a fixed measure.
  3.  **The ratchet and unmeasurability are essential defining characteristics.** The drift is path-dependent and irreversible because reverting to the original interpretation *reveals* the degradation (cratering numbers), creating social/organizational pressure against correction. Unmeasurability follows because the drift alters the unit of account itself, destroying the baseline.
  4.  **The good-faith, no-deceiver aspect defines it as a distinct *species* of surrogation.** This is "innocent surrogation drift," driven by ambiguous concepts, evolving contexts, and cognitive biases (like scope creep in categorization) rather than cynical manipulation. The lack of intent separates it from fraud or deliberate metric corruption.
  5.  **"Concept creep" (psychology) is adjacent but insufficient.** Concept creep describes the expansion of a concept's *semantic boundaries* (e.g., "trauma"), but your pattern specifically concerns the *operationalization drift of a quantitative metric* used for assessment, within an institutional/personal incentive context – surrogation provides that crucial framework.
