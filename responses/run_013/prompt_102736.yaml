  - Map the activity to the model:
     - Round 1: Turning one dial (one dimension of variation).
     - Round 2: Turning multiple dials (combining dimensions).
     - Round 3: Adding a dial (expanding the space of possibilities by adding a new dimension without breaking the skeleton).
