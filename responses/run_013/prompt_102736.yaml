  Honest note on what the activity cannot reproduce:
  - The slow, unforced discovery of a new skeleton (as noted).
  - The role of deep domain expertise: in reality, the knobs and the space are often defined by years of practice in a domain. Our activity is domain-agnostic.
  - The emotional and aesthetic dimension: in real creativity, the invariant is often tied to an emotional core that is hard to capture in a clapping pattern.
  - The format distorts by making the re-carving a deliberate, explicit instruction, whereas in real creativity, the re-carving might be an implicit shift that the creator only realizes in retrospect.

  Implementation note: The activity requires the instructor to be flexible in time management and to guide the rating process. Also, the invariant must be clearly defined and understood. We'll write the invariant on the board and refer to it.

