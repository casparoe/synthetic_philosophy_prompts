  - We'll have two scores for each variation: 
    1. Sameness Score (0-3): How well the variation preserves the invariant. 
    2. Variation Score (0-3): How much it changes from the base pattern in a deliberate way.

  But how to judge sameness? To avoid collapsing into taste, we need an objective(ish) method.

  Objective(ish) invariant: 
  The invariant is the "skeleton" of the pattern. We define the invariant for the base pattern as:
  - A four-beat cycle.
