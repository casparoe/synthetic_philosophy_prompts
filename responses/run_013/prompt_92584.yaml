prompt: |-
  I'm a novelist — three books, none of them about computers — and I've somehow let myself get talked into co-teaching an upper-level undergrad seminar on AI safety this spring. The unit I'm stuck with is "control vs. alignment," and I need a final exam question I can actually grade. So put on your hat as an AI-safety researcher who's also good at writing assessments, and think it through before you write — brainstorm first about what a student could fake knowing versus what would really separate someone who gets it from someone who's just memorized the vocabulary. Take your time.

  Here's what I want the question to be about. A fictional lab runs a protocol: a big untrusted model writes code, a smaller trusted model reviews every output, anything the reviewer flags goes to a human, and the humans only have the budget to inspect a small fraction of what gets flagged. The lab's safety case says: "we don't need to know whether the big model is aligned; even if it's actively trying to sabotage us, it can't get a harmful change through undetected."

  Write me one essay question, 75 minutes, that forces students to (1) say what has to be true for that sentence to count as a valid safety argument at all, (2) say what the protocol buys you that an alignment-only approach doesn't, and (3) locate where the argument bottoms out — the thing that's still merely trusted rather than shown — and what happens to the case if the reviewer model is either weaker than the model it's reviewing or able to coordinate with other copies of itself.

  Then give me a model answer, around 700 words, plus a marking scheme worth 25 points, broken into the specific moves a top answer has to make, with a line for each on how a mediocre answer typically gets it wrong. It's closed-book, so don't build the rubric around anyone citing particular papers — I want it to be about the reasoning. And the question can't be answerable by just repeating "alignment makes models want the right thing, control makes them unable to do the wrong thing" — that sentence should be worth maybe 4 points out of 25 and I want the rubric to say so.

  Plain English please, I'm not a machine-learning person. Thanks.
