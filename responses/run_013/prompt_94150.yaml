answer: |-
  Here is the dialogue, crafted to meet your specifications:

  **Characters:**  
  **E:** Expressivist  
  **C:** Cognitivist  

  **(The dialogue begins mid-conversation, after initial positions are established)**  

  **C:** ...So you say "Lying is wrong" expresses disapproval of lying. Fine. But then take its negation: "Lying is not wrong." What does *that* express? Approval? Indifference?  

  **E:** Neither, directly. It expresses the *absence* of disapproval towards lying. It’s the rejection of the attitude expressed by the positive claim. Think of it like refusing to join in condemnation.  

  **C:** But absence isn’t an attitude in itself. Suppose I encounter someone entirely indifferent to lying – they feel neither approval nor disapproval. They might truthfully say, "Lying isn’t wrong *for me*," meaning they lack the attitude. But that seems different from *denying* that lying is wrong. The indifferent speaker isn’t contradicting the moralist; they’re just reporting their own apathy. Your "absence of disapproval" account seems to conflate denial with indifference.  

  **E:** A fair point. Let me refine: "Lying is not wrong" expresses *endorsement of the permissibility* of lying. It’s not mere absence; it’s the positive acceptance that lying is an option without negative weight. It’s the attitude you hold when you see no barrier to someone lying.  

  **C:** Now consider ambivalence. I might feel deeply torn: part of me disapproves of lying (it feels like a betrayal), part of me approves (it feels like kindness). So I sincerely utter both "Lying is wrong" and "Lying is not wrong" at different moments, reflecting my conflicting attitudes. But logically, these *sentences* contradict each other. How does your account capture that logical conflict? My utterances express different attitudes, yes, but the problem is that the *sentences themselves* stand in a relation of contradiction, regardless of my fluctuating psychology. Your attitudes explain my sincerity conditions, but not the logical relations *between* the sentences I use.  

  **E:** The logical relation is grounded in the incompatibility of the prescribed stances. To accept "Lying is wrong" is to commit to disapproving of lying. To accept "Lying is not wrong" is to commit to *not* disapproving of lying (or to endorsing its permissibility). You cannot consistently hold both commitments simultaneously towards the same act. That’s the incompatibility driving the contradiction. Your ambivalence is a psychological struggle *because* the stances are logically incompatible.  

  **C:** Hmm, grounding logic in commitment patterns is intriguing, but let’s test it with embedding. Take a simple conditional: "If lying is wrong, then getting your little brother to lie is also wrong." When someone asserts this whole conditional, they aren’t expressing disapproval of lying *right now*. So what’s the function of "lying is wrong" in the antecedent?  

  **E:** It sets up a constraint on attitudes. Asserting the conditional expresses a commitment: *if* you have the attitude of disapproval towards lying, *then* you must also have the attitude of disapproval towards getting your brother to lie. It’s about the coherence of one’s moral sensibilities. Accepting the antecedent and rejecting the consequent reveals an inconsistency in your practical commitments.  

  **C:** Okay, I can see how that *might* work for conditionals, though I worry it reduces logic to psychology. Let’s try something trickier: probability. Consider, "It’s probably wrong to lie in this situation, but I’m not sure." What is "wrong to lie" doing embedded under "probably"? On your view, it’s expressing an attitude, but here it’s being probabilified. Does that mean I’m expressing "probable disapproval"? That seems nonsensical – attitudes aren’t held probabilistically. I either disapprove or I don’t.  

  **E:** *(Pauses)* That *is* challenging. My first thought is that it expresses a tentative or partial commitment to disapproval – a leaning towards disapproval without full conviction. But you’re right, it feels strained. Perhaps it’s better to see the probabilistic operator as applying to the *proposition* that the sentence conventionally expresses, even if its core function is expressive. The speaker is indicating uncertainty about whether the attitude they *would* express categorically is actually warranted here. It’s hedging on the appropriateness of the attitude itself. **Concession:** I’ll grant this feels less elegant than my account of simple assertions or conditionals. Probabilistic moral claims push my framework hard.  

  **C:** Thank you. That concession feels genuine. Now, let me turn the tables, as you asked. If moral sentences are just truth-apt descriptions of facts, as I hold, what’s special about them? Why does believing "Lying is wrong" typically *move* someone to avoid lying, or make them feel guilty if they do? Believing "Grass is green" doesn’t have that effect. What’s the *practical oomph* of a moral belief?  

  **C:** A moral belief isn't *just* a descriptive belief. It's a belief about a special kind of fact – a *normative* fact, a fact about what there is reason to do or avoid. Believing that lying is wrong *is* believing that there are decisive reasons not to lie. Recognizing a decisive reason *just is* to be motivated to act accordingly, absent weakness of will or competing reasons. The motivation is internal to grasping the normative fact.  

  **E:** But what *is* this "normative fact"? Two people can agree on all the natural facts about lying – the deception, the potential harm, the broken trust – yet one concludes "Therefore, it's wrong" and feels motivated to avoid it, while the other concludes "But that’s just how humans are; no 'wrongness' added," and feels no motivation. If the normative fact isn't constituted by the natural facts, what independent existence does it have? And if it *is* constituted by them, why the difference in conclusion and motivation? **Concession:** I acknowledge that the "queerness" of these facts, their necessary connection to motivation, is a deep challenge. Maybe the motivational element depends on a *sensitivity* to reasons that not everyone possesses, or perhaps it requires an additional conative state. But I maintain the belief itself is about objective reasons.  

  **E:** And what about disagreement? If I say "Lying is wrong" and you say "Lying is not wrong," and we both know all the natural facts about lying, what are we *disagreeing about* on your view? We seem to agree on the description of the world. Are we just pointing at the same natural facts and one of us is incorrectly labeling them with the property "wrong"? That feels thin. My expressivist account captures the real friction: we feel conflicting attitudes; we are poised to condemn or permit the same act. That clash of practical stances is the substance of the disagreement.  

  **C:** We disagree about whether those natural facts *constitute* a decisive reason against lying. It’s a disagreement about the structure of reasons in the world. You think the natural features of lying generate a conclusive reason to avoid it; I think they do not (or perhaps generate a weaker reason, overridden in some cases). We agree on the base facts, but we disagree on the normative reality they ground.  

  **E:** But how do we *settle* that? We can point to more natural facts – the consequences, the intentions – but that just pushes the question back. Ultimately, we appeal to what seems rationally compelling to us, which looks suspiciously like appealing to our own attitudes about what counts as a good reason.  

  **C:** And on your side, how do we settle a clash of attitudes? We argue, we cite reasons, we point to features of the act... which looks suspiciously like we’re trying to show the other person that their attitude is *mistaken* based on how things *are*.  

  *(A long silence hangs between them)*  

  **E:** So, the pressure points are clear. For me: negation, ambivalence, complex embeddings like probability – showing how expressive commitments generate the *right* logical relations without collapsing into descriptions. For you: explaining the necessary connection between moral belief and motivation without making those beliefs mysterious, and explaining the substance of deep moral disagreement when all natural facts seem agreed upon.  

  **C:** Precisely. We both have our work cut out. Neither map is complete, and the territory remains rugged.  

  **E:** Indeed. The conversation continues.  

  **(End)**  

  **Key elements addressed:**  

  1.  **Negation & Contradiction:** E's move from "absence" to "endorsement of permissibility" to capture genuine denial vs. indifference.
  2.  **Indifference:** C presses how E's account distinguishes denial from mere lack of attitude.
  3.  **Ambivalence:** C highlights the conflict between fluctuating attitudes and stable logical contradiction. E grounds contradiction in incompatibility of commitments.
  4.  **Conditional Embedding:** E explains it as a commitment to attitudinal coherence.
  5.  **Less Common Embedding (Probability):** C presses hard on how to understand probabilified attitudes. E struggles, offers hedging proposals, makes a concession.
  6.  **Cognitivist Challenges - Motivation:** E turns the tables, asking about the "practical oomph." C invokes normative facts/reasons and internalism (belief in decisive reason motivates), but concedes the challenge of explaining their nature/connection.
  7.  **Cognitivist Challenges - Disagreement:** E asks what disagreement consists in when natural facts are agreed. C argues it's disagreement about the normative reasons constituted by those facts. E counters that resolution seems to appeal to attitudes about reasons.
  8.  **Unforced Concessions:** E concedes difficulty with probabilistic embeddings. C concedes the challenge of explaining the nature of normative facts and their necessary connection to motivation.
  9.  **Equality & Engagement:** Each directly responds to the other's points, refines positions under pressure, acknowledges strengths in the other's challenge.
  10. **No Resolution, Clear Pressure Points:** The dialogue ends by explicitly summarizing the core, unresolved challenges for each view.

  This dialogue focuses on the arguments themselves, avoids namedropping, keeps both speakers formidable and responsive, and delves into the specific complexities you requested beyond the initial Frege-Gech embedding point.
