answer: |-
  ## Joint Statement on the Adversarial Collaboration Regarding the Recoverability of History in Legendary Traditions

  **Preamble:** We, the undersigned representatives of the Historicist and Compositionist positions concerning the traditions of the Trojan War, King Arthur, and the Exodus, engage in this adversarial collaboration to clarify our points of agreement and disagreement. We accept the convenor's proposal to temporarily set aside the broad question "Did it happen?" and focus instead on the specific test: **Does the tradition contain at least one singular causal claim whose truth is required to explain some independent feature (e.g., a place-name, cult site, or awkward detail not plausibly invented)?** We seek to determine if this test resolves our core dispute or merely relocates it.

  ### Section 1: Points of Consensus

  1.  **Nature of the Traditions:** We agree that the Trojan War, King Arthur, and Exodus narratives, as received, are complex literary and cultural products shaped by transmission, accretion, ideological needs, and artistic license over significant periods. None represent straightforward, contemporary historical records.
  2.  **"Independent Features" Defined:** We agree on the types of evidence considered relevant under the test:
      *   **Place-names:** Specific, enduring geographical names within the tradition (e.g., Troy/Hisarlik, Camelot locations, Kadesh-barnea).
      *   **Cult Sites:** Locations of persistent ritual practice explicitly linked to the tradition (e.g., Mycenaean hero cults potentially linked to Trojan heroes, early medieval British saint cults potentially linked to Arthurian figures, Israelite/Judean cultic practices linked to Exodus events).
      *   **Awkward Details:** Elements within the narrative that are incongruous, inconvenient, or counterproductive to the apparent thematic or ideological goals of the composers/transmitters, lacking obvious literary or theological motivation (e.g., Moses's speech impediment, Arthur's incestuous birth, specific tactical blunders attributed to heroes).
  3.  **Burden of Proof:** We agree that the burden lies with proponents of historicity (applying the convenor's test) to demonstrate, for a *specific* causal claim within a tradition, that:
      *   (a) The independent feature exists.
      *   (b) The feature cannot be adequately explained by cultural processes, literary convention, thematic necessity, or coincidence.
      *   (c) The *truth* of the *singular causal claim* is the *only* or *best* explanation for the feature's origin or persistence.
  4.  **Shared Challenges:** We agree that all three cases present significant hurdles for historical recovery:
      *   Late written accounts distant from purported events.
      *   Intertwining of mythic and folkloric motifs.
      *   Clear ideological and political functions of the narratives.
  5.  **Differentiating the Cases:** We agree that the three traditions differ in the *nature* and *quantity* of potential independent features and the chronological/cultural gap between purported events and attestation. The Trojan War has strong toponymic continuity and potential Hittite textual parallels; Arthur has localized place-names and ambiguous archaeological sites but no contemporary textual evidence; Exodus has powerful cultic foundations but significant chronological and archaeological controversies.

  ### Section 2: Precise Statements of Remaining Disagreement

  *   **Historicist Position:** "We contend that for each tradition (Trojan War, Arthur, Exodus), application of the convenor's test identifies *at least one singular causal claim* (e.g., 'A war at Wilusa/Ilion caused the toponymic persistence of Troy'; 'A powerful British warlord's victory at Badon caused the place-name and later association'; 'A collective traumatic departure from Egypt caused the foundational Passover ritual and aversion to Egyptian motifs') whose truth provides the *only plausible explanation* for specific, persistent independent features (the site's significance, the name/location, the ritual's core etiology and specific taboos). These features resist adequate explanation solely through literary, thematic, or cultural processes, thus allowing the recovery of a historical kernel."
  *   **Compositionist Position:** "We contend that while the independent features identified by the convenor's test are real and require explanation, they *can* be adequately explained through cultural memory processes, etiological storytelling, the retrojection of later realities or ideologies, symbolic representation, or coincidence. The apparent 'singular causal claims' within the narratives are themselves literary constructs or distillations of complex processes, not recoverable historical events. The features (place-names, cults, awkward details) are best understood as the *inputs* or *motivations* for the tradition's construction, not as *effects* requiring the truth of a specific narrated cause."

  ### Section 3: Cruxes and Agreed Tests

  1.  **Crux: Event-Token vs. Event-Type**
      *   **Disagreement:** Do we seek evidence for a *specific, unique historical event* (token - e.g., *the* Trojan War led by Agamemnon c. 1200 BCE) or evidence for the *type of event* that could have inspired the tradition (e.g., Mycenaean-Anatolian conflicts)?
      *   **Agreed Test:** Examine the *specificity* of the causal claim allegedly required to explain the independent feature. Can the feature be explained by a *type* of event common in the era/region, or does it *demand* a specific token event matching the tradition's core details?
          *   *Historicist Prediction:* For core features (e.g., the specific etiology of Passover, the unique significance of Troy/Hisarlik), only the specific token event claimed provides a sufficient explanation.
          *   *Compositionist Prediction:* The features can be explained by event-types (conflicts, migrations, charismatic leaders) combined with cultural processes; the specific narrative token is not required.

  2.  **Crux: Kernel as Causal Claim vs. Kernel as Referential Anchor**
      *   **Disagreement:** Is the potential historical "kernel" primarily a *causal claim* (as per the convenor's test) or a *referent* (e.g., a real person, place, or object) that becomes the nucleus for narrative elaboration, regardless of specific causal claims attached to it?
      *   **Agreed Test:** Analyze "awkward details." If such a detail requires a historical cause, does it necessitate a specific *causal story* (kernel as cause), or could it originate from a real but mundane *referent* (e.g., a real Moses with a speech impediment, a real Arthur with a problematic lineage) whose existence is independent of the specific causal claims in the epic narrative (kernel as referent)?
          *   *Historicist Prediction:* Awkward details often point to specific causal claims about the referent (e.g., Moses's impediment *caused* Aaron's role) that are essential and historical.
          *   *Compositionist Prediction:* Awkward details are more likely literary devices (character flaws, narrative tension) or stem from the incorporation of a known referent (a figure named Moses/Arthur) into a story where the detail serves a narrative/thematic purpose, not proof of a specific historical cause.

  3.  **Crux: Legal vs. Scientific Standard of Proof**
      *   **Disagreement:** Should the "best explanation" under the test be judged by a legal standard (plausibility, preponderance of evidence) or a scientific/historical standard (falsifiability, requirement for positive evidence beyond reasonable alternative explanations)?
      *   **Agreed Test:** Evaluate the proposed singular causal explanations for a key independent feature (e.g., the Passover ritual's origin). Can plausible, non-historical alternative explanations be constructed using known cultural, literary, or psychological processes? How demanding should we be in ruling these out?
          *   *Historicist Prediction:* Alternative explanations for core features (e.g., complete invention of Passover's etiology) are less plausible than the historical causal claim, meeting a preponderance standard. Absolute proof is unrealistic for ancient events.
          *   *Compositionist Prediction:* Multiple plausible alternative explanations exist for any proposed feature (e.g., ritual origins independent of a specific Exodus event, retrojected onto a foundational narrative). The historical claim fails a scientific standard requiring positive evidence and the elimination of significant alternatives.

  ### Section 4: Merely Verbal Disputes

  We judge the following aspects of the broader debate to be potentially, or often, merely verbal:

  1.  **"Recoverable":** Disagreements often stem from differing thresholds for what constitutes "recovered" history. Does it mean establishing the existence of *a* referent (e.g., a city called Troy/Wilusa), *a* type of event (e.g., conflict between Aegean and Anatolian powers), or the specific narrated event-token (e.g., Agamemnon's war)? The convenor's test focuses narrowly on the latter.
  2.  **"Kernel":** Arguments about the "historical kernel" founder on ambiguity. Is it a specific event, a person, a place, a social conflict, or a thematic concern? The convenor's test explicitly defines the potential kernel as a *singular causal claim*.
  3.  **"History" vs. "Thematic Relation":** The claim that traditions have "at most a thematic relation" to past happenings versus preserving "some recoverable historical events" can become semantic. The Compositionist position readily accepts that traditions *reflect* historical realities (themes, concerns, environments) – the disagreement is solely about the recoverability of *specific singular causal claims* as defined by the test. The Historicist position, when pressed, often concedes the thematic layer is profound and the specific events are obscured.

  **Conclusion:** The convenor's test has successfully shifted the debate from the intractable "Did it happen?" to a more focused analysis of specific causal claims and independent features. However, it has **relocated rather than resolved** the core dispute. Fundamental differences remain concerning: (1) the necessity of event-tokens vs. event-types, (2) whether the kernel is a causal claim or a referent, and (3) the appropriate standard of proof for evaluating explanations of the independent features. The agreed tests provide a framework for structured debate on these cruxes. We acknowledge that significant parts of the *broader* discussion were entangled in merely verbal disputes concerning definitions ("recoverable," "kernel," "history"), which the narrower test helps to bypass.

