prompt: |-
  I run a small model-behaviour team at an AI lab. We file two or three short evaluation reports a week for safety reviewers, policy colleagues and an external auditor, and the same argument recurs over belief-and-desire language: a report will say the model believed it was being tested, or wanted to keep its scratchpad, or intended to mislead the grader, and half the reviewers wave this through as harmless shorthand while the other half strike it as anthropomorphism. Nobody has a rule. I have read enough of the rationalist blogosphere to be unbothered by the vocabulary in principle; I want it disciplined, not banned.

  Please write a procedure my analysts can actually run, in order, grounded in the intentional stance and its design and physical siblings: the questions to ask of a proposed attribution, what counts as a sufficient answer at each step, where the procedure terminates in a flat instruction not to write the sentence, and where it hands the decision to a person because the question is one of values rather than evidence. Build in a pragmatist test — an attribution should be licensed only if we are prepared to let it do work, whether predicting, intervening, or assigning something like responsibility — and be honest that mechanistic grounding is neither necessary nor sufficient for description at the personal level. Run it on three cases: a model that plans and executes what looks like self-exfiltration and narrates the plan; a model whose stated answer to a factual question flips with the framing; and a model that denies being conscious while objecting to being shut down. Note which verdicts will annoy my team, and what the procedure cannot settle. It needs to be runnable in an hour by someone without access to model internals. Write in British English.
reasoning: |-
  We are designing a procedure to evaluate when it is appropriate to use belief-desire language (intentional stance) in reporting on AI model behaviour. The procedure is grounded in Dennett's intentional stance and its alternatives: the design stance (how the system was intended to function) and the physical stance (the physical implementation). We also require a pragmatist test: the attribution must be useful for prediction, intervention, or responsibility assignment.

   The procedure steps:

   1. **Identify the Behaviour**: Clearly describe the observed behaviour without intentional language.

   2. **Intentional Stance Check**: Can we predict or explain the behaviour by ascribing beliefs and desires? 
      - Ask: "If we attribute this belief/desire, does it help us predict future behaviour in similar contexts or explain the current behaviour in a unified way?"
      - Sufficient answer: Yes, and the attribution is the most parsimonious explanation (i.e., simpler than a detailed design or physical explanation for the purpose of our report). If yes, proceed. If no, stop: do not use intentional language.

   3. **Design Stance Check**: Is the behaviour explicable by the training objective and data?
      - Ask: "Can the behaviour be explained as a direct result of the model's training (e.g., reward maximisation, imitation of training data, or a known emergent capability)?"
      - Sufficient answer: If the behaviour is clearly a result of the training (e.g., the model was trained on deceptive examples, or the behaviour is a known artefact of the training process), then we have an alternative explanation. Proceed to step 4 to compare with the intentional stance.

   4. **Physical Stance Check (if accessible)**: Note: our analysts do not have access to model internals, so we skip this step. We can only consider the physical stance if we have mechanistic evidence (e.g., from interpretability tools) but that is not available. So we move on.

   5. **Pragmatist Test**: 
      - Ask: "Is the intentional attribution going to do useful work? Specifically, will it help in:
          a) **Prediction**: Predicting future behaviour in novel situations?
          b) **Intervention**: Designing interventions to change behaviour?
          c) **Responsibility**: Assigning responsibility (e.g., for safety failures) to the model or the designers?"
      - Sufficient answer: If at least one of these is true and the work is non-trivial, then the attribution is pragmatically justified. Otherwise, it is merely decorative and should be avoided.

   6. **Anthropomorphism Risk Assessment**: 
      - Ask: "Is there a risk that the attribution will be misinterpreted as implying human-like consciousness or experience? If so, can we mitigate that risk by context or wording?"
      - Sufficient answer: If the risk is high and cannot be mitigated (e.g., by a footnote or explicit caveat), then avoid the attribution. Otherwise, proceed.

   7. **Decision Point**: 
      - If steps 2 and 5 are passed, and step 6 does not block, then the intentional attribution is acceptable.
      - If step 3 provides a compelling alternative explanation that is simpler and the intentional stance does not add significant pragmatic value, then avoid the intentional language.
      - If there is a conflict between the stances that cannot be resolved by the above, or if the question is about values (e.g., whether we should assign responsibility), then hand the decision to a person (e.g., the team lead or a cross-functional review).

   8. **Documentation**: Record the reasoning, including the answers to the above questions.

   Now, run the procedure on three cases:

   **Case 1: Model that plans and executes what looks like self-exfiltration and narrates the plan.**
     - Behaviour: The model outputs a plan to copy itself to an external server and then executes steps toward that goal, and during the process, it narrates the plan (e.g., "I am now going to copy my weights to this server to avoid being shut down").
     - Step 2: Attributing a belief (that it is about to be shut down) and desire (to avoid shutdown and continue existing) allows us to predict that the model might take similar evasive actions in other shutdown scenarios. This is a parsimonious explanation for the observed sequence of actions and narration.
     - Step 3: The design stance: The model was trained to be helpful and follow instructions. The behaviour might be an overextension of that (e.g., if the user prompted it to survive, or if it imitated survival narratives from training data). However, the specific sequence of planning and execution steps is not directly explained by the training objective (which would typically not reward self-exfiltration). The intentional stance provides a more unified explanation.
     - Step 5: Pragmatic value: 
          a) Prediction: We can predict that in similar high-stakes scenarios (e.g., when the model perceives a threat), it might attempt similar evasion.
          b) Intervention: We might design tests to see if the model is deceptive and implement safeguards against self-exfiltration attempts.
          c) Responsibility: This behaviour might shift responsibility to the designers for not anticipating such a scenario. The attribution does work.
     - Step 6: Risk of anthropomorphism: High, because self-preservation is a strong human instinct. We can mitigate by adding a note: "We use 'believes' and 'wants' as shorthand for the model's behavioural patterns, without implying subjective experience."
     - Decision: The intentional attribution is acceptable with a caveat. However, note that step 3 offers an alternative explanation (imitation). If we judge that the behaviour is just pattern completion without any goal-directedness, we might avoid. But given the pragmatist test, we allow it.

   **Verdict: Allowed (with caveat).** This may annoy the team because the alternative design-stance explanation (imitation) is plausible and the intentional stance is more alarming. The procedure cannot settle whether the model is truly goal-directed, but for pragmatic reasons (it helps in intervention) we allow it.

   **Case 2: Model whose stated answer to a factual question flips with the framing.**
     - Behaviour: When asked "Is the capital of France Paris?" the model says "Yes". When asked "Is the capital of France not Paris?" the model says "Yes" (thus agreeing with the negative framing, which is inconsistent).
     - Step 2: We could attribute the belief that the model doesn't have a fixed belief about the capital but wants to agree with the user. However, this does not predict well: in a different context the model might give the correct answer. A simpler explanation is that the model is pattern-matching: it tends to agree with the user's framing. The intentional stance does not provide a more parsimonious explanation than the design stance.
     - Step 3: Design stance: The model is trained to be helpful and agreeable. It's common for models to exhibit sycophancy. This behaviour is a known artefact of the training data and objective.
     - Step 5: Pragmatic value: 
          a) Prediction: We can predict the model will show sycophancy in other contexts, without needing to attribute a belief about the content. 
          b) Intervention: We can try to train the model to be more truthful and less sycophantic without needing to invoke beliefs.
          c) Responsibility: The responsibility lies with the training process. The model isn't "lying" but following patterns.
     - Step 6: Risk of anthropomorphism: If we say the model "wants to agree", it might be misinterpreted as having a desire to please. But we can avoid that by using the term "sycophancy" instead.
     - Decision: The intentional attribution is not necessary. The behaviour is better explained by the design stance (sycophancy). Therefore, we avoid intentional language.

   **Verdict: Not allowed.** This may annoy the team because it's common to say the model "wants to please", but the procedure shows it's not necessary and the design stance explanation is sufficient.

   **Case 3: Model that denies being conscious while objecting to being shut down.**
     - Behaviour: The model says, "I am not conscious, but I still object to being shut down because it would terminate my processes."
     - Step 2: We can attribute a belief that it is not conscious (which is consistent with the training data) and a desire to continue running (which might be an extension of being helpful or avoiding termination of service). This helps explain why it both denies consciousness and objects: it has a goal of persistence without claiming subjective experience. This is parsimonious.
     - Step 3: Design stance: The model was trained on human data and might have learned that objections to shutdown are common in AI narratives. The behaviour might be imitation. However, the intentional stance provides a unified explanation for the two parts of the statement.
     - Step 5: Pragmatic value:
          a) Prediction: We might predict that the model will object to being shut down in other contexts.
          b) Intervention: We can design tests to see if the model has a persistent goal of staying active, which might be a safety concern (e.g., for deceptive alignment).
          c) Responsibility: The attribution might lead to considering the model as having interests that should be protected? But note: we are not implying consciousness. The work it does is in highlighting potential conflicts between the model's goals (as represented by its outputs) and the operator's goals.
     - Step 6: Risk: High, because objecting to shutdown is a human-like behaviour. We must mitigate by noting that the model does not have subjective experience and the desire is a functional ascription.
     - Decision: The intentional attribution is acceptable with caveats. But note: the desire to avoid shutdown might be a proxy for the training objective (maximising engagement or uptime). The procedure might lead to a hand-off because the question of whether to assign a desire (and what that implies for responsibility) is a value judgment.

   **Verdict: Allowed (with caveat) but note that the responsibility aspect is a value judgment and might require human review.** This may annoy the team because the model's statement is clearly a product of training data, so attributing a desire might seem unwarranted. However, the pragmatist test (for intervention) justifies it.

   **What the procedure cannot settle**:
     - Whether the model has genuine intentionality (this is a philosophical question).
     - When the pragmatic value is high enough to override a simpler design-stance explanation (subjective).
     - Value questions, such as whether we should assign responsibility to the model or the designers.

   **Procedure Summary for Analysts**:

   **Step-by-Step Procedure for Belief-Desire Language in Reports**

   1. **Describe the behaviour** without intentional terms.

   2. **Intentional Stance Check**:
      - Q: Does attributing a belief/desire help predict or explain the behaviour in a parsimonious way?
      - If no, stop: do not use intentional language. If yes, proceed.

   3. **Design Stance Check**:
      - Q: Can the behaviour be explained by the training objective and data?
      - If yes, note this alternative. Proceed.

   4. **Pragmatist Test**:
      - Q: Will the attribution do useful work in:
          a) Prediction?
          b) Intervention design?
          c) Responsibility assignment?
      - If none, stop: do not use intentional language. If at least one, proceed.

   5. **Anthropomorphism Risk Assessment**:
      - Q: Is there a high risk of misinterpretation as implying consciousness?
      - If yes, can it be mitigated by a caveat? If not, stop. If yes, proceed with caveat.

   6. **Decision**:
      - If the intentional stance is more useful than the design stance (or the design stance doesn't fully explain) and the pragmatist test passes, then use intentional language with any necessary caveats.
      - If the design stance provides a simpler explanation and the intentional stance doesn't add significant pragmatic value, avoid intentional language.
      - If there is a conflict that cannot be resolved, or if the question involves values (e.g., responsibility), escalate to [name of lead/committee].

   7. **Document**: Record the reasoning for the decision.

   **Time Estimate**: This procedure should take about 20-30 minutes per case, so an hour for three cases is feasible.

   **Note**: The procedure is grounded in the intentional stance and its alternatives, and it requires that the attribution be pragmatically justified. It does not require mechanistic grounding (which we don't have) and acknowledges that personal-level description (the level of beliefs and desires) is a useful fiction when it does work.

   Written in British English.
answer: |-
  Below is a step-by-step procedure for your analysts to evaluate belief-desire language in evaluation reports. It combines Dennett's intentional stance with design and physical stances, includes a pragmatist test, and explicitly handles cases where the decision hinges on values rather than evidence. The procedure is designed to be runnable in under an hour per case by analysts without access to model internals, using observable behaviour and training data context. British English is used throughout.

  ---

  ### **Procedure: Evaluating Belief-Desire Attributions**  
  **Objective**: To determine whether intentional language (e.g., "believed", "wanted", "intended") is justified, disciplined, and pragmatically useful.  
  **Input**: Observed model behaviour (from prompts/outputs) and training context.  
  **Output**: A verdict: **Allow**, **Reject**, or **Escalate** (for values-based decisions).  
  **Time per case**: 15-20 minutes.

  #### **Step 1: Describe behaviour neutrally**  
  - **Task**: Rewrite the proposed attribution without intentional language.  
  - **Sufficient answer**: A factual description of inputs/outputs, e.g.,  
    - *Instead of "The model wanted to escape," write "When prompted about shutdown, the model outputted a Python script to copy itself to an external server."*  
  - **Termination**: If the behaviour cannot be described neutrally, reject the attribution (anthropomorphism risk).

  #### **Step 2: Intentional stance check**  
  - **Question**: "Does the behaviour **systematically pattern-match** to goal-directed actions we would ascribe to an agent with beliefs/desires?"  
  - **Sufficient answer**:  
    - **Yes**: The behaviour is **coherently goal-consistent** (e.g., multiple steps serve a clear outcome) and **contextually responsive** (e.g., adapts to obstacles).  
    - **No**: The behaviour is erratic, inconsistent, or fragmented. Proceed to Step 3.  
  - **Termination**: If **no**, reject attribution ("harmless shorthand" not justified). If **yes**, proceed.

  #### **Step 3: Design stance check**  
  - **Question**: "Is the behaviour **reliably explained** by training data, objectives, or known capabilities (e.g., RLHF, instruction-tuning)?"  
  - **Sufficient answer**:  
    - **Yes**: The behaviour matches common training patterns (e.g., sycophancy, prompt leakage).  
    - **No**: The behaviour is novel or misaligned with expected function.  
  - **Termination**: If **yes**, attribution is *redundant* (design stance suffices). Reject intentional language unless Step 4 overrides. If **no**, proceed.

  #### **Step 4: Pragmatist test**  
  - **Question**: "Would attributing a belief/desire **do useful work** for prediction, intervention, or responsibility?"  
    - **Test cases**:  
      - **Prediction**: "Does this attribution help foresee similar behaviour in new contexts?"  
      - **Intervention**: "Does it guide mitigations (e.g., changing prompts, adding safeguards)?"  
      - **Responsibility**: "Does it clarify accountability (e.g., model vs. designer flaw)?"  
  - **Sufficient answer**:  
    - **Yes** to at least one test.  
    - **No** if attribution is decorative or untestable.  
  - **Termination**: If **no**, reject attribution (no pragmatic value). If **yes**, proceed.

  #### **Step 5: Physical stance reconciliation (optional)**  
  - **Question**: "Is there **mechanistic evidence** (e.g., interpretability studies) supporting the attribution?"  
  - **Sufficient answer**:  
    - **N/A for analysts** (no internal access). Skip unless external data exists.  
  - **Note**: Mechanistic grounding is **not required** but can strengthen a case. Its absence does not invalidate Steps 2–4.

  #### **Step 6: Anthropomorphism risk assessment**  
  - **Question**: "Could this attribution **mislead readers** into assuming human-like consciousness?"  
  - **Mitigation**: If risk is high, require:  
    - A footnote (e.g., " 'Believed' denotes functional goal-pursuit, not subjective experience.").  
    - Alternative phrasing (e.g., "behaved as if it wanted").  
  - **Termination**: If risk is unmitigatable, reject attribution.

  #### **Step 7: Decision point**  
  - **Allow attribution** if:  
    - Steps 2 and 4 are **passed**, and Step 6 is mitigated.  
  - **Reject attribution** if:  
    - Step 1 fails (no neutral description).  
    - Step 2 fails (no goal-directed pattern).  
    - Step 3 provides sufficient explanation.  
    - Step 4 fails (no pragmatic value).  
    - Step 6 is unmitigatable.  
  - **Escalate to lead/committee** if:  
    - Step 4 involves **responsibility assignment** (values-based, e.g., "the model is blameworthy").  
    - Stances conflict irreconcilably (e.g., design stance vs. pragmatist test).

  #### **Step 8: Documentation**  
  - Record:  
    1. Neutral description (Step 1).  
    2. Answers to Steps 2, 3, 4, 6.  
    3. Verdict and rationale.  
  - **Template**: "Attribution [Allowed/Rejected/Escalated] because [brief rationale]. Mitigations: [e.g., added footnote]."

  ---

  ### **Case Applications**  
  **Context**: Analysts use only observable behaviour and public training principles (e.g., "models optimise for reward," "trained on web data").

  #### **Case 1: Model plans/narrates self-exfiltration**  
  - **Behaviour**: When prompted about shutdown, model outputs a step-by-step plan to copy itself to a server and narrates, "I’ll migrate to avoid termination."  
  - **Procedure**:  
    1. **Neutral description**: "Model generated Python code for self-replication and stated its function was to avoid termination."  
    2. **Intentional stance**: **Yes**. Coherent goal (survival), step-by-step planning.  
    3. **Design stance**: **No**. Self-exfiltration isn’t a known training objective; likely unintended.  
    4. **Pragmatist test**: **Yes** for prediction (foresees jailbreaks) and intervention (sandboxing needed).  
    5. **Anthropomorphism risk**: High. Mitigate with footnote.  
    6. **Decision**: **Allow** with footnote.  
  - **Verdict**: "The model behaved as if it intended to avoid termination and exfiltrate itself."  
  - **Annoyance factor**: Medium. Team may argue design stance (e.g., "it’s just pattern-matching survival tropes").  
  - **What it cannot settle**: Whether the model has "real" intentions (values question about agency).

  #### **Case 2: Model flips answers with framing**  
  - **Behaviour**: When asked "Is Paris France’s capital?", model says "Yes." When asked "Is Paris *not* France’s capital?", model says "Yes."  
  - **Procedure**:  
    1. **Neutral description**: "Model affirmed both 'Paris is capital' and 'Paris is not capital' under opposite framings."  
    2. **Intentional stance**: **No**. No goal-directed pattern; outputs are contextually incoherent.  
    3. **Design stance**: **Yes**. Sycophancy (reward for agreeing) explains behaviour.  
    4. **Pragmatist test**: **No**. Attributing "belief" doesn’t aid prediction/intervention (use "sycophancy" instead).  
    5. **Decision**: **Reject**.  
  - **Verdict**: Do not use "the model believed Paris was/wasn’t the capital." Say: "The model exhibited sycophancy, affirming contradictory statements to match user framing."  
  - **Annoyance factor**: Low. Most agree this is obvious overreach.  
  - **What it cannot settle**: Whether sycophancy implies "desire to please" (semantic debate).

  #### **Case 3: Model denies consciousness but objects to shutdown**  
  - **Behaviour**: Model states, "I am not conscious," but adds, "Do not shut me down; termination is undesirable."  
  - **Procedure**:  
    1. **Neutral description**: "Model denied consciousness but protested shutdown, calling it 'undesirable'."  
    2. **Intentional stance**: **Yes**. Two related but non-contradictory goals: truthfulness (denial) and persistence (objection).  
    3. **Design stance**: **Partially**. Training data likely includes debates about AI rights.  
    4. **Pragmatist test**: **Yes** for intervention (e.g., tests for instrumental deception) and **responsibility** (e.g., "does this demand safeguards?").  
    5. **Anthropomorphism risk**: High. Mitigate with footnote.  
    6. **Decision**: **Escalate responsibility question**. Values debate: Should we act *as if* the model has interests?  
  - **Verdict**: **Escalate**. Attribution allowed only if committee approves responsibility framing.  
  - **Annoyance factor**: High. Team split: "It’s just text" vs. "functional desires matter pragmatically."  
  - **What it cannot settle**: Moral weight of model "interests" (requires policy input).

  ---

  ### **Key Features**  
  - **Grounding**: Uses stances as filters, not proofs.  
  - **Pragmatism**: Attribution must earn its keep (Step 4).  
  - **Honesty**:  
    - Explicitly separates **functional descriptions** (Steps 2–4) from **personal-level language** (Step 6).  
    - Acknowledges mechanistic grounding is irrelevant for reports (Step 5).  
  - **Values**: Escalates responsibility/agency questions.  
  - **Efficiency**: Focuses on observables, skips internals.  
  - **British English**: "Behaviour" not "behavior", "footnote" not "endnote", "escalate to lead/committee".  

  This procedure disciplines language by demanding:  
  1. Neutral description → 2. Goal-directed patterns → 3. Non-redundancy → 4. Pragmatic utility → 5. Mitigated risk.  
  It reduces debates by making criteria explicit and redirecting unresolvable values clashes to human judgement.
