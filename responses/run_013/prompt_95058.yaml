answer: |-
  Here's a distilled list of desiderata for any adequate theory of welfare conditionality, incorporating your constraints and identifying core tensions. Requirements are derived from operational reality, normative coherence, and observed phenomena—*not* from ideological priors.

  ### Core Desiderata (Non-Negotiables)
  1. **Operational Epistemology**:  
     *Must function given imperfect, observable proxies for "desert," "effort," or "need" (e.g., job applications, attendance logs), not idealized moral states.*  
     *Why?* Policy acts on *evidence*, not truth. Theories requiring infallible judgment (e.g., "true willingness to work") collapse in practice. Forces theories to confront noise: false positives/negatives are inevitable.

  2. **Tripartite Error Accounting**:  
     *Must explicitly address and weigh three distinct failures:*  
     - **Type I**: Non-deserving receive benefits ("cheaters")  
     - **Type II**: Deserving denied benefits ("mistakes")  
     - **Type III**: Deserving *deterred from claiming* ("ghost claimants" due to stigma/complexity)  
     *Why?* Ghost claimants (e.g., eligible non-participants) are empirically significant (often 20-40% of eligible populations). Ignoring them falsely assumes conditionality only affects claimants. *Trade-off:* Reducing one error often exacerbates another (e.g., stricter verification cuts cheaters but increases ghosts/mistakes). Weighting *can* be independent (e.g., a theory might prioritize minimizing ghosts over cheaters), but resources constrain optimization.

  3. **Deterrence Ambiguity Resolution**:  
     *Must take a stance on whether deterrence (eligible non-claimants) is a success (e.g., "saves resources/fosters self-reliance") or a cost (e.g., "denies rightful support").*  
     *Why?* Deterrence is inherent to administrative burden. Dodging this conceals a theory’s implicit valuation of claimant dignity vs. fiscal purity.

  4. **Ambivalent Agency Recognition**:  
     *Must explain why claimants often *endorse* the norms used to sanction them, despite hardship.*  
     *Why?* Empirical psychology shows internalized work ethic/common-good norms among claimants. Theories reducing actors to "resisters" or "compliants" miss how conditionality exploits moral self-conception.

  5. **Benefit-Type Specificity**:  
     *Must justify why conditionality targets *means-tested* benefits (e.g., TANF, SNAP), not universal transfers (e.g., pensions, inheritances, public schools).*  
     *Why?* Exposes whether conditionality is rooted in *poverty stigma*, notions of "undeserved" windfalls, or administrative efficiency—and tests consistency.

  ### Contingent Desiderata (Camp-Dependent)
  6. **Autonomy vs. Paternalism Balance**:  
     Libertarians demand minimization of state coercion; paternalists accept shaping "good" behavior. *Not universal*—UBJ rejects coercion, while reciprocity theories may embrace it.  
  7. **Social Integration Promises**:  
     Conservative theories may demand conditionality promotes work ethic; egalitarians may prioritize poverty reduction over social engineering. *Operational test:* Can the theory survive if conditionality *reduces* social cohesion (e.g., via stigma)?  
  8. **Cost-Efficiency Mandate**:  
     Often a conservative priority ("taxpayer burden"), but egalitarians must still address resource trade-offs (e.g., monitoring costs vs. benefit levels).  

  ### The Trilemma (Jointly Unsatisfiable)
  You identified it: **Accuracy**, **Low Administrative Burden**, and **Equal Treatment** cannot be maximized simultaneously.  
  - *Accuracy* requires costly monitoring (e.g., caseworker time, appeals processes).  
  - *Low Burden* (for state/claimant) demands simple rules, increasing errors (e.g., automated sanctions).  
  - *Equal Treatment* is undermined by noisy proxies (e.g., disabilities misclassified as non-compliance).  
  *Trade-off:* Choose two; sacrifice the third. Most policies sacrifice accuracy for low burden, exacerbating inequality.

  ### The Theory-Killer Requirement
  **Benefit-Type Specificity** (#5) is the most potent filter. Many theories fail:  
  - *Desert-based* theories can’t explain why a lazy heir deserves unearned wealth, but a job-seeker must "prove" desert.  
  - *Reciprocity* theories struggle with unconditional transfers to wealthy retirees.  
  - *UBI* advocates flip this to argue *no* benefits should be conditional—but must then confront fiscal/political feasibility.  
  Only cynical ("sorting/deterrence") theories pass cleanly: they admit conditionality targets the poor because it’s administratively convenient and politically palatable.

  ---

  ### Scorecard of Major Approaches
  | **Theory**               | **Key Failure(s) Against Desiderata**                                  |  
  |--------------------------|------------------------------------------------------------------------|  
  | **Desert-Based**         | Violates #1 (requires unobservable moral desert); often ignores #2 (ghosts). |  
  | **Reciprocity/Contribution** | Struggles with #5 (why not condition all transfers?); ignores #4 (coercion amid agreement). |  
  | **Unconditional Basic Income** | Sidesteps conditionality but fails #3 (deterrence=success?); dismisses #7 (social cohesion) as irrelevant. |  
  | **Cynical (Sorting/Deterrence)** | Aces #1, #2, #3, #5—but violates #4 (denies agency), lacks *normative* justification. |  

  The cynical view is the most operationally robust but morally vacant; normative theories struggle with operational reality. A viable theory must bridge this gap—or admit its priorities.
