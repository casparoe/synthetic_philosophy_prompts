prompt: |-
  So I'm a backend engineer, no philosophy degree at all, and I fell down a rabbit hole on Bell's theorem after a coworker tried to explain why quantum computers can't send signals faster than light. I can follow the basic inequality stuff. What I dont get is why people are still arguing about it. My sense is there's alot of supposedly-open questions here -- is the assumption that has to go "locality" or "realism" or something more specific like local causality, is superdeterminism a real option or a cop-out, why does nature stop at the quantum maximum instead of the logical maximum for correlations, does any of this even survive when you move to a relativistic setting where "at the same time" isn't well defined, is the whole thing about correlations or about something deeper -- and I honestly can't tell which of those are live and which are basically settled or just noise.

  So here's what I want. Pretend I've got one solid year and enough budget for maybe two people, and I want to put it where it actually counts. Rank the open questions or research programs in this area for me. Which ones are upstream of the others, which are tractable for someone without a QFT background, which get hyped because they sound spooky but wouldn't change much downstream, and what would have to happen in the next year or two for you to move something up or down your list. I care way more about the reasoning behind the ordering than the list itself. And be straight with me about which of these is really a physics question, which is a philosophy question, and which is a nobody-knows-what-the-question-even-means question.
reasoning: |-
  Okay, let me start by understanding what this backend engineer is asking. They've dived into Bell's theorem after a discussion about quantum computing and FTL signaling. They grasp the basics but are confused about why debates persist. They listed several open questions: locality vs. realism, superdeterminism, quantum vs. logical correlation limits, relativistic implications, and whether it's about correlations or deeper issues. They want to know which of these are worth investing a year and two people's time in, considering factors like upstream impact, tractability without QFT, hype vs. substance, and how recent developments might shift priorities.

  First, I need to break down each open question. Bell's theorem shows that quantum mechanics conflicts with local realism. The engineer is aware that either locality or realism must be abandoned, but the specifics are debated. They mentioned terms like "local causality" and "superdeterminism." I should clarify these concepts. Locality means no FTL influences; realism means properties exist before measurement. Bell's inequalities violations force us to drop one. But which one? Quantum mechanics maintains locality (no FTL signaling) but rejects realism (properties aren't definite until measured).

  Superdeterminism is another approach. It suggests that the measurement choices and particle states are predetermined, eliminating statistical independence. Critics see it as a cop-out because it undermines scientific experimentation. Is this a viable research area? The engineer wants to know if it's tractable without QFT. Maybe exploring superdeterminism's testability or implications for free will could be a project, but it's philosophically heavy and might not yield practical results.

  Then there's the Tsirelson bound. Quantum correlations max out at a certain level, not the logically possible maximum. Why? Information-theoretic principles or computational constraints? Research here involves quantum information theory, which is math-heavy but doesn't require QFT. Recent work on post-quantum theories (like PR boxes) and their limitations (causing signaling) is relevant. This ties into why quantum computing isn't more powerful, so it might interest a backend engineer. Projects could involve simulating post-quantum correlations or studying cryptographic implications.

  Relativistic Bell tests are crucial. In curved spacetime or without a universal time, how do Bell experiments work? QFT frameworks like algebraic QFT address this, but they're complex. Without QFT, this might be too steep. However, recent loophole-free tests in labs might make relativistic aspects less urgent unless they're into foundational QFT.

  Regarding correlations vs. deeper issues: Bell violations challenge classical causality. Research in quantum causal models and process matrices is emerging. This is interdisciplinary, involving math and CS. A project here could explore causal structures in quantum networks, which is tractable without QFT and has implications for quantum networks.

  Now, ranking these. The Tsirelson bound question seems most tractable and impactful. It uses information theory, aligns with the engineer's background, and has clear sub-questions. Relativistic QFT is important but requires specialized knowledge. Superdeterminism is philosophically contentious and might not progress much in a year. Quantum causality is promising but nascent.

  Prioritization: 
  1. Tsirelson bound and post-quantum correlations. Directly related to quantum computing limits, uses CS skills, active research area.
  2. Quantum causality. Emerging field with practical applications in quantum networks.
  3. Relativistic aspects. Important but needs QFT.
  4. Superdeterminism. Likely a dead end without new evidence.

  The engineer should focus on the Tsirelson bound and quantum causality. These areas are ripe for progress, tractable with their skills, and have downstream impacts. Superdeterminism and relativistic QFT might not be the best use of limited resources. Recent loophole-free Bell tests make foundational QFT less urgent for now.
answer: |-
  As a backend engineer diving into Bell's theorem, you've pinpointed the core tension: the math is clear (violations of Bell inequalities force us to abandon *either* locality or realism), but the **interpretation, implications, and "what next" are fiercely contested**. Your instincts about the open questions are sharp—many are live wires, but some are more tractable and impactful than others. Below is a prioritized ranking of research programs based on **upstream importance, tractability without QFT, hype-to-substance ratio, and downstream impact**. I'll clarify the physics vs. philosophy boundaries and flag where recent developments could shift priorities.

  ### **Ranking Criteria**
  - **Upstream Impact**: How central is this to resolving foundational ambiguities?
  - **Tractability**: Can a team without QFT make progress? (I assume comfort with linear algebra, probability, and coding).
  - **Hype vs. Substance**: Does progress here actually change models, or just tweak interpretations?
  - **Downstream Relevance**: Implications for quantum computing, communication, or fundamental physics.
  - **1-Year Viability**: Potential for meaningful progress with 2 people.

  ---

  ### **Ranked Research Programs**
  #### **1. Why the Tsirelson Bound? (Quantum vs. Logical Correlations)**  
  **Why it's #1**:  
  - **Upstream**: Directly tests the "shape" of quantum mechanics. Bell inequalities show QM violates classical limits, but QM *also* stops at the Tsirelson bound (e.g., CHSH ≤ 2√2 ≈ 2.828) instead of the logical maximum (CHSH ≤ 4). **Why not higher?** Is this due to information causality, thermodynamics, or computational constraints?  
  - **Tractability**: Ideal for your skills. Combines info theory (e.g., non-signaling constraints), optimization, and simulation. Projects could involve:  
    - Simulating post-quantum correlations (e.g., PR-boxes) and their instability.  
    - Exploring cryptographic limits (e.g., why supra-quantum correlations break cryptography).  
  - **Hype vs. Substance**: Low hype, high substance. Resolving this could reveal if QM is "maximally useful" or constrained by deeper principles (e.g., the **Physical Church-Turing thesis**).  
  - **Downstream**: Crucial for understanding quantum advantage limits. If nature allowed CHSH=4, QC could solve #P-hard problems trivially.  
  - **Physics/Philosophy Split**: 90% physics (math/info theory), 10% philosophy (why *this* bound?).  
  - **Move Up/Down**: If new experiments (e.g., with photonic networks) show violations *approaching* but never exceeding Tsirelson, it solidifies. If theoretical work proves stability requires Tsirelson, it drops.

  #### **2. Quantum Causal Structures (Beyond Correlations)**  
  **Why it's #2**:  
  - **Upstream**: Bell’s theorem is about *correlations*, but what about **causation**? New frameworks (e.g., **quantum causal models**, **process matrices**) ask: Can quantum events have definite causal order? This probes if "reality" is fundamentally acausal.  
  - **Tractability**: High. Uses graph theory, probabilistic programming, and quantum circuits. Projects:  
    - Implement causal discovery algorithms for quantum data (e.g., using PyTorch).  
    - Test if quantum switches (indefinite causal order) violate generalized Bell inequalities.  
  - **Hype vs. Substance**: Emerging field—some hype ("quantum causality!"), but concrete math (e.g., the **QWEP conjecture** links to von Neumann algebras).  
  - **Downstream**: Impacts quantum networks (e.g., entanglement routing) and time-delocalized computing.  
  - **Physics/Philosophy Split**: 70% physics (applied math), 30% philosophy (causality definitions).  
  - **Move Up/Down**: If lab demonstrations of indefinite causality scale (e.g., 3-node experiments), it jumps to #1. If theorists show it reduces to known physics, it drops.

  #### **3. Relativistic Bell Tests (No Universal Time)**  
  **Why it's #3**:  
  - **Upstream**: Bell experiments assume synchronized measurements—but relativity kills "same time." QFT frameworks (e.g., **algebraic QFT**) suggest space-like correlations *still* can't signal, but is locality enforced differently?  
  - **Tractability**: Moderate. Requires special relativity, but *not* full QFT. Projects:  
    - Simulate Bell tests in curved spacetime (e.g., using GR solvers + qubit models).  
    - Analyze satellite-based entanglement (e.g., Micius mission data) for frame-dependence.  
  - **Hype vs. Substance**: Under-hyped but critical for unification. Tests if QM+relativity = **local quantum field theory** is the only consistent framework.  
  - **Downstream**: Essential for quantum gravity (e.g., black hole information).  
  - **Physics/Philosophy Split**: 100% physics (no ambiguity).  
  - **Move Up/Down**: If loophole-free experiments in gravitational wells (e.g., STE-QUEST) launch, it rises. If aQFT fully resolves it theoretically, it drops.

  #### **4. Superdeterminism: Viable or Cop-Out?**  
  **Why it's #4**:  
  - **Upstream**: Rejects "statistical independence" (measurement settings aren't free). If true, it saves locality *and* realism—but at what cost?  
  - **Tractability**: Low for physics, high for philosophy/simulations. Projects:  
    - Model superdeterministic systems (e.g., cellular automata with hidden constraints).  
    - Prove no-go theorems for "experimenter freedom" (e.g., using chaos theory).  
  - **Hype vs. Substance**: High controversy, low progress. Most physicists dismiss it (violates scientific method), but it resurfaces (e.g., 't Hooft).  
  - **Downstream**: Almost nil—wouldn't change QC or engineering.  
  - **Physics/Philosophy Split**: 40% physics (dynamic systems), 60% philosophy (free will, empiricism).  
  - **Move Up/Down**: If someone finds a testable prediction (e.g., anomalous noise in Bell tests), it skyrockets. Otherwise, it’s stagnant.

  #### **5. Locality vs. Realism: Which is "Really" Broken?**  
  **Why it's #5**:  
  - **Upstream**: Seems core—but it’s mostly settled. QM prefers **keeping locality** (no FTL signaling) and ditching **realism** (no definite pre-measurement properties). Interpretations (Copenhagen, QBism) agree here.  
  - **Tractability**: Low. Debates are now about interpretations (Many-Worlds, Bohmian), requiring heavy math.  
  - **Hype vs. Substance**: Endless philosophy debates ("What is real?"). Little new physics since **Pusey-Barrett-Rudolph theorem** (2012) showed realism conflicts with QM.  
  - **Downstream**: Minimal—engineers can treat QM as operational.  
  - **Physics/Philosophy Split**: 20% physics, 80% philosophy.  
  - **Move Up/Down**: Only if new experiments (e.g., macroscopic entanglement) force reinterpretation.

  ---

  ### **Strategic Recommendations for Your 1-Year Project**
  1. **Focus on #1 (Tsirelson Bound) + #2 (Quantum Causality)**.  
     - **Why**: Maximizes tractability and impact. Both use your CS strengths and interface with active QC research.  
     - **Concrete 1-Year Goal**: Build a framework to simulate post-quantum correlations in causal networks (e.g., extending **the QInfer library**). Publish on "Why the Quantum Speed Limit?"  
  2. **Avoid Superdeterminism (#4) and Locality/Realism (#5)**.  
     - These are philosophical quicksands with low ROI for your goals.  
  3. **Monitor Relativity (#3)**—but don’t prioritize unless you partner with a QFT specialist.  

  ### **What Would Change the Rankings?**
  - **Breakthrough in Post-Quantum Theory**: If someone derives Tsirelson’s bound from thermodynamics (e.g., via Landauer’s principle), #1 becomes even more critical.  
  - **Quantum Gravity Connection**: If AdS/CFT (holography) links Bell nonlocality to spacetime geometry, #3 jumps to #1.  
  - **New Bell-Type Experiments**: Projects like the **Cosmic Bell Test** (using quasars) could push #3/#5 up.  

  ### **Bottom Line**
  The most urgent, actionable questions are **why quantum correlations are bounded** and **how causality works in quantum networks**. These are physics-first, leverage your skills, and could clarify why QCs can’t achieve "magic" correlation-based speedups. Superdeterminism and locality/realism debates are philosophical tail-chasing without new evidence. Invest where the math meets the lab.
