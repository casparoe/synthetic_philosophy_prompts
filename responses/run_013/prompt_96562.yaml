  The user presents three specific difficulties: overdetermination (no single cause), dispersed agency (problem of many hands), and ambiguity about responsibility-bearers (individuals vs states). They want a precise anatomy of these issues—not just survey-level explanations—with explicit trade-offs for each position. 

