  For dispersed agency, must distinguish aggregate intention (Germany's institutional actions) from individual mens rea. The General Staff didn't "intend" war per se but intended high-risk actions knowing war was likely. Versailles' legalism complicates this—should note how its "guilt clause" conflated causal/moral claims, poisoning the well for historians. 

