  For killer constraints, Bayesian approaches struggle with hypothesis generation, similarity theories fail on relational leaps, prototypes collapse under negation cases. But the real dealbreaker is the "no free lunch" theorem - you can't be efficient across all possible concept spaces without innate tuning.

  *checks own biases* I'm probably underestimating how much cultural scaffolding enables these solutions. Those "single words" aren't innate - they're inherited cognitive tools. Also should flag that "concept" might be a family resemblance term here.

  User seems analytically rigorous but possibly overcommitted to computational purity. Their friend has a point about language doing heavy lifting, but it's not the whole story. The synthesis might be that concepts are tools co-developed with language and culture.

