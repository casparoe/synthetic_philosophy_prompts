answer: |-
  ## Sestina for the Shape-Shifter 'a'

  Consider every scribe and printer's aim:
  To craft the **bowl** that cups the absent space,
  To raise the upright **stem** against the void,
  To carve the hollow **counter** held within,
  To curve the sheltering **arc** above the ground,
  To place the small concluding **spur** or **terminal**.

  The neon sign, a liquid blaze, its **terminal**
  Glow bleeding light, forgets the perfect **bowl**,
  Its **arc** a molten slash, a hurried **spur**
  Of current flung towards the waiting **stem**.
  The printed text defines a clear **counter**
  While ink bleeds softly where the **terminal** ends.

  The child's thick crayon finds a different **end**:
  A simple loop, a circle's **terminal**,
  No separate chamber for a **counter**.
  It holds a rounded, single-storey **bowl**,
  One stroke that climbs to form a stubby **stem**,
  Then flicks a careless, playful little **spur**.

  The classic serif, carved with steady **spur**,
  Displays a foot, a grounded **terminal**,
  Its **stem** ascends with confident command.
  The **arc** leans gracefully, a poised **terminal**
  Above the deep, closed curve of its dark **bowl**,
  Containing neatly its white **counter** ghost.

  This negative, this pale and vital **counter**,
  Is not the mark, but what the mark surrounds.
  The **spur** might point or vanish on the page,
  The **terminal** may blunt or taper fine,
  Yet still the **bowl**'s embrace remains implied,
  The **arc** still bridges meaning to the **stem**.

  Despite the wild diversity of **stem**,
  The **counter** lost in flowing script's design,
  The **arc** collapsed to just a hurried peak,
  The **terminal** absorbed within the flow,
  The absent **bowl** implied by open curve,
  Or **spur** dissolved into a single line...

  How does this silhouette, this shifting **spur**
  Of meaning, hold? No fixed **terminal**,
  No essence in the **stem** or **arc** alone,
  Commands the eye. It's how the roles combine:
  The **bowl** (or space *for* **bowl**), the **counter**'s light,
  The **stem**'s support, the **arc**'s protective crown,
  The **terminal**'s quiet pause – a structure known.

  We *know* the **arc** leans, shielding the **counter** deep,
  The **bowl** rests low (though sometimes incomplete),
  The **stem** stands firm. We feel the **terminal**
  Or **spur** conclude the thought. The roles persist.
  Two-storey loop or scrawled-out circle's sweep –
  The **a** emerges from the roles it keeps.
