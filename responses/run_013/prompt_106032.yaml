  2. Granularity: If yes, is it about eras or specific acts? (Era/Act)
  3. Knowability: Can we know we're in one? (Yes/No)
  4. Recurrence: Can hinges recur or must they be terminal? (Recurring/Terminal)
  5. Obligations: Does living in one change what we owe to the future? (Yes/No)

  Some combinations might be incoherent or unexplored. For example, if someone says hinges don't exist, the granularity question becomes irrelevant. Also, positions like "Longtermism" and "Catastrophic Accelerationism" might be hard to distinguish if they share similar answers.

  The user wants about 6-8 branch nodes. I should ensure the tree isn't too deep. Maybe start with existence, then for "yes," branch into granularity, then knowability, recurrence, and obligations. For "no," branch directly into implications.

  I need to identify unnamed positions and note why some combinations are empty—whether incoherent, unattractive, or unexplored. For example, believing hinges exist but are eras and not knowable might be unattractive because it could lead to despair or apathy.

  Finally, write in American English, keeping sentences clear and conversational. Make sure each leaf has a position name or "unnamed," with a sentence on its toughest commitment.

  I'll outline the flowchart step by step, ensuring it covers all user requirements while staying within the node limit.
answer: |-
  Here’s a logical flowchart that sorts readers into positions based on core commitments, ignoring "loud advocates" and prioritizing unexplored angles. It uses **5 branch nodes** (questions) and results in **8 leaf positions** (4 named, 4 unnamed/uncommon), with annotations on gaps.

  ---

  ### The Hinge of History Flowchart  
  *(Answer each question based on intuition before seeing labels)*  

  **1. Does human history contain at least one moment whose consequences permanently and overwhelmingly dwarf all others?**  
  - **Yes** → Go to 2  
  - **No** → Go to 6  

  **2. Is this "hinge" primarily about a broad era (decades/centuries) or specific acts/decisions?**  
  - **Era** → Go to 3  
  - **Act** → Go to 4  

  **3. Could we ever confidently know we were living *inside* such an era?**  
  - **Yes** → **Longtermism**  
    *Least comfortable commitment: Prioritizing abstract future trillions over concrete present suffering.*  
  - **No** → **Unnamed (Era Agnosticism)**  
    *Least comfortable commitment: Acting urgently amid radical uncertainty about whether our actions matter historically.*  
    *Gap: Rare—knowing we’re *in* an era but not *which* era feels paralyzing; likely unexplored.*  

  **4. Could we ever confidently know we were facing such a decisive act?**  
  - **Yes** → Go to 5  
  - **No** → **Historical Inflectionism**  
    *Least comfortable commitment: Moral luck dominates ethics—your impact depends on unknowable historical context.*  

  **5. Can a "hinge moment" recur after failing, or must it be terminal (e.g., extinction)?**  
  - **Recur** → **Catastrophic Accelerationism**  
    *Least comfortable commitment: Inviting existential risk to trigger positive civilizational rebirth.*  
  - **Terminal** → **Existential Conservatism**  
    *Least comfortable commitment: Extreme precaution even against tiny extinction risks, stifling progress.*  

  **6. If no disproportionate moments exist, is history’s significance in gradual trends or recurring cycles?**  
  - **Trends** → **Whig Gradualism**  
    *Least comfortable commitment: Denying that crises demand exceptional action—trust slow progress.*  
  - **Cycles** → Go to 7  

  **7. Do these cycles impose distinct duties based on where we are in them?**  
  - **Yes** → **Cyclical Vitalism**  
    *Least comfortable commitment: Accepting decline/upheaval as natural and necessary.*  
  - **No** → **Ahistorical Presentism**  
    *Least comfortable commitment: Total moral disconnection from past/future generations.*  

  ---

  ### Key Annotations:  
  - **Unoccupied Combinations:**  
    - *"Act + Knowable + Recurring"*: Logically possible (e.g., "serial hinge moments"), but no coherent position exists. Likely **unattractive** (trivializes hinges).  
    - *"Era + Terminal"*: Incoherent—eras aren’t single terminal events.  
    - *"No Hinge + Cycles + Duties"*: Named (*Cyclical Vitalism*) but **rare**—most cycle theories (e.g., Strauss-Howe) reject special duties.  
  - **Indistinguishable Positions:** The tree **cannot distinguish** between:  
    - *Longtermism* and *Catastrophic Accelerationism* on obligations (both demand future-focused sacrifice).  
    - *Historical Inflectionism* and *Era Agnosticism* on knowability (both stress radical uncertainty).  
  - **Gaps Rationale:**  
    - "Era + Unknowable" (*Era Agnosticism*) is **unexplored** (philosophers focus on acts/outcomes).  
    - "Cycles + No Duties" (*Ahistorical Presentism*) is **unattractive** (denies history’s lessons).  

  ### Design Notes:  
  - **Branch Logic:** Avoids presupposing terms like "existential risk" or "longtermism." Q1 filters fundamental belief; Q2/Q4 split granularity; Q3/Q5 test epistemology/ontology.  
  - **Brevity:** 5 questions → 8 leaves, with dead ends (e.g., "Era + Terminal") implied.  
  - **American English:** "Prioritizing" (not "Prioritising"), "center" (not "centre"), "labeled" (not "labelled").  

  This isolates positions by **logical constraints**, not popularity—revealing underexplored views (e.g., *Era Agnosticism*) and forcing coherence tests on familiar ones. Users confront uncomfortable commitments *before* seeing labels.
