  ### Conditionals and Probability Trading Activity: Rules, Roles, and Materials  
  **Objective:** Students experience the triviality result for indicative conditionals through trading, discovering that pricing conditionals as truth-valuable contracts (with voiding) and requiring coherence forces the price of "if A then B" to collapse to the price of "B" alone.  

  ---

  ### **Materials**  
  1. **Die**: A fair six-sided die.  
  2. **Contracts**:  
     - **Plain Contracts**: Pay $1$ if event occurs, $0$ otherwise. Events:  
       - $A$: Die is low ($1, 2, 3$)  
       - $B$: Die is even ($2, 4, 6$)  
       - $C$: Die is prime ($2, 3, 5$)  
       - Atomic events ($1, 2, 3, 4, 5, 6$) for reference.  
     - **Conditional Contracts**: Pay $1$ if $A$ and $B$ occur, $0$ if $A$ occurs and $B$ does not, **void** (stake returned) if $A$ does not occur.  
       - "If $A$ then $B$"  
       - "If $A$ then $C$"  
       - "If $\neg A$ then $B$"  
       - "If $\neg A$ then $C$"  
  3. **Chips**: $20$ chips per student (for desk roles) and $10$ chips for the customer.  
  4. **Handout**: Exchange Rule Book (one page, see below).  
  5. **Whiteboard**: Track prices and trades.  

  ---

  ### **Exchange Rule Book (Handout)**  
  **Coherence Rule:**  
  - Prices must admit **no arbitrage**: No combination of contracts can guarantee a profit.  
  - Equivalently, prices must be expectations under a **single probability distribution** over outcomes.  

  **Trading Rules:**  
  1. **Phase 1 (Unconditional Pricing)**:  
     - Desk posts prices for all contracts.  
     - Prices must satisfy coherence.  
  2. **Phase 2 (Conditional Pricing)**:  
     - Scenario $S$ is announced (e.g., "$A$ occurs").  
     - Desk re-quotes prices for all contracts **as if $S$ is true**.  
     - Prices must satisfy coherence under the **assumption $S$ is certain**.  
  3. **Phase 3 (Customer Trading)**:  
     - Customer trades freely at posted prices (buy/sell any contract).  
     - Goal: Maximize profit (net chips after die roll).  
     - Die is rolled publicly. Contracts settle.  

  **Settlement:**  
  - Plain contract: Pays based on outcome.  
  - Conditional contract: Pays $1$ (TT), $0$ (TF), or void (antecedent false).  

  ---

  ### **Roles**  
  - **Desk (7 students)**: Collaboratively sets prices. Must defend coherence.  
  - **Customer (1 student or instructor)**: Trades to exploit incoherence.  
  - **Facilitator (You)**: Enforce rules, roll die, settle contracts.  
  - **Observers (6 students)**: Track prices, arbitrage opportunities.  

  ---

  ### **Minute-by-Minute Plan**  
  **Phase 1: Unconditional Pricing (25 mins)**  
  - 0-5: Explain rules, handout, assign roles.  
  - 5-20: Desk posts prices for all contracts. Ensure coherence (e.g., $P(A) + P(\neg A) = 1$, $P(\text{"if } A \text{ then } B\text{"}) = P(B|A)$).  
  - **Key moment**: Desk tries to price "if $A$ then $B$" as material conditional ($P(\neg A \text{ or } B)$). Facilitator asks: "Is this voiding rule consistent with a truth value? How?"  

  **Phase 2: Conditional Pricing (20 mins)**  
  - Scenario 1: "$A$ occurs" (10 mins)  
    - Desk re-quotes prices (e.g., $P(B|A)$ for "if $A$ then $B$").  
  - Scenario 2: "$\neg A$ occurs" (10 mins)  
    - Desk re-quotes prices (e.g., $P(\text{"if } A \text{ then } B\text{"} | \neg A) = 0$).  
  - **Key moment**: Desk realizes conditional price for "if $A$ then $B$" must be $0$ under $\neg A$ (void = no payout).  

  **Phase 3: Customer Trading (20 mins)**  
  - Customer has $10$ chips. Trades at all posted prices.  
  - **Critical trade sequence**:  
    1. Buy "if $A$ then $B$" at unconditional price $p_0$.  
    2. *Under scenario $\neg A$*: Sell "if $A$ then $B$" at conditional price $p_{\neg A} = 0$.  
    3. *Under scenario $A$*: Buy a plain contract on $B$ at conditional price $P(B|A)$.  
  - Die is rolled. Contracts settle.  

  **Settlement and Profit (5 mins)**  
  - Calculate customer’s profit.  
  - Desk loses chips if customer profits.  

  **Debrief (20 mins)**:  
  - Collate prices: Write initial, $A$-scenario, and $\neg A$-scenario prices.  
  - Replay trades: Map to triviality proof steps.  

  ---

  ### **Debrief: Mapping to Triviality Result**  
  1. **Voiding ↔ Conditional Probability (Phase 1)**  
     - Desk sets $P(\text{"if } A \text{ then } B\text{"}) = P(B|A)$.  
     - Why? Voiding when $A$ false makes the price the expected payout under coherence.  
     - *Student moment*: Desk’s price for "if $A$ then $B$" (e.g., $1/3$ for $A$: low, $B$: even).  

  2. **Re-Quoting Under Supposition (Phase 2)**  
     - Under $A$, "if $A$ then $B$" becomes a bet on $B$: Price must be $P(B|A)$.  
     - Under $\neg A$, contract is void: Price must be $0$.  
     - *Student moment*: Desk’s $P(\text{"if } A \text{ then } B\text{"} | \neg A) = 0$.  

  3. **Rule of Total Probability Collapse (Phase 3)**  
     - Customer’s trade:  
       - Unconditional: Buy "if $A$ then $B$" at $p_0 = P(B|A)$.  
       - Under $\neg A$: Sell same contract at $p_{\neg A} = 0$.  
     - Net cost: $p_0 - 0 = P(B|A)$.  
     - Outcome:  
       - If $A$ true: Contract pays $1$ if $B$, else $0$.  
       - If $\neg A$ true: Void (no payout).  
     - **Arbitrage forces $P(B|A) = P(B)$**:  
       - Portfolio replicates a bet on $B$ alone.  
       - Coherence requires $P(B|A) = P(B)$ (e.g., $1/3 = 1/2$).  
     - *Student moment*: Desk’s $P(B|A)$ vs. $P(B)$ exposed.  

  **Absurdity**: Prices imply $P(B|A) = P(B)$ (e.g., $P(\text{even} | \text{low}) = P(\text{even})$), which is false for the die.  

  ---

  ### **Predictable Failure & Handling**  
  **Failure**: Desk prices "if $A$ then $B$" as material conditional ($P(\neg A \text{ or } B)$) to avoid collapse.  
  **Handling**:  
  - In Phase 3, customer executes:  
    - Sell material conditional at $P(\neg A \text{ or } B)$.  
    - Buy plain contract on $B$ at $P(B)$.  
  - **Profit**: $P(\neg A \text{ or } B) - P(B) = P(\neg A) - P(A \text{ and } \neg B)$.  
  - If $A$ and $\neg B$ occurs (e.g., die=1: low, not even), customer loses $1$ (pays for material conditional).  
  - **Desk learns**: Material conditional pricing risks loss when $A$ true and $B$ false. Voiding avoids this but triggers collapse.  

  ---

  ### **Limitation and Facilitator’s Role**  
  **Unreproduced Feature**:  
  - The activity shows coherence *forces* $P(\text{"if } A \text{ then } B\text{"}) = P(B)$, but cannot prove this holds for *all* conditionals.  

  **Debrief Honesty**:  
  - Some students conclude: "Conditionals have no truth value (voiding prevents it)".  
  - Others: "Pricing rule is wrong; conditionals aren’t bets".  
  - **Facilitator adds**:  
    - Triviality proofs assume conditionals *are* truth-valuable *and* priced at $P(B|A)$.  
    - If both hold, conditionals reduce to consequents.  
    - Denial requires rejecting truth values or the pricing rule.  

  ---

  ### **Setup Tips**  
  - Use a large whiteboard for prices.  
  - Let desk debate: "Should voiding mean $0$ under $\neg A$?"  
  - Customer trades aggressively: Highlight profit from desk’s numbers.  
  - Roll die publicly: Build tension.  

  By the end, students *see* coherence force $P(\text{"if } A \text{ then } B\text{"}) = P(B)$—no proof written, no theorem named until debrief. The voiding rule and arbitrage make the result inescapable.
