answer: |-
  ## Research Proposal: Self-Unmasking Dispositions and the Analysis of Interference

  **The Question (Approx. 130 words):**

  Can existing, non-conditional analyses of dispositions adequately account for "self-unmasking dispositions" – dispositions whose characteristic manifestation *includes*, as a necessary part, the removal of the very masking condition that would otherwise prevent that manifestation? Specifically, when such a disposition is masked and triggered, does its manifestation occur (because the mask is removed by the manifestation process itself), and crucially, can leading accounts (e.g., causal basis theories, multi-track analyses) explain *why* this happens without either (a) implicitly relying on the truth of the problematic conditional they seek to replace, or (b) introducing problematic circularity in their analysis? The determinate answer sought is whether any prominent non-conditional account successfully passes this test or whether the case reveals a fundamental inadequacy requiring theoretical revision.

  **Why It's Still Open (Approx. 290 words):**

  The fink and mask counterexamples successfully undermined the naive conditional analysis of dispositions (e.g., "fragile if it would break if struck"). Standard responses propose alternative analyses, typically grounding dispositions in a stable, intrinsic causal basis or employing more complex, multi-track conditionals. However, a critical ambiguity persists concerning *how* these analyses handle interference. They often conflate or fail to explicitly distinguish between:

  1.  **Interference with the Disposition/Causal Basis:** Where the trigger or associated conditions directly destroy or alter the underlying property constituting the disposition (finkish cases).
  2.  **Interference with the Manifestation Pathway:** Where the disposition and its basis remain intact, but an external factor (a mask) blocks the causal pathway to the expected outcome *without* affecting the basis itself.

  This conflation obscures the precise challenge posed by masks. The novel case of the self-unmasking disposition directly probes this distinction. Here, the mask is *not* removed prior to or independently of the manifestation process; its removal is *constitutive* of the manifestation occurring *despite* its initial presence. Existing accounts, designed to handle standard masks (removed externally or prior to trigger) or finks (which destroy the basis), have not explicitly addressed this dynamic scenario. It remains an open question whether their conceptual resources – such as specifying the causal basis's operation "in appropriate conditions" or defining manifestation types – can non-circularly explain the sequence where the mask's presence is a starting condition, yet its removal is an *internal consequence* of the triggered dispositional process itself, without tacitly invoking the very conditional they reject.

  **Method (Approx. 280 words):**

  The project will proceed through structured conceptual analysis over a single term:

  1.  **Precise Characterisation (Weeks 1-2):** Rigorously define the target phenomenon: "self-unmasking dispositions". Develop clear, minimal exemplars (e.g., a substance disposed to dissolve *by first neutralizing* an inhibitor present in the solution; a system disposed to stabilise *by detecting and eliminating* a destabilising fault). Specify the temporal and causal structure where mask removal is an *essential component* of the manifestation event triggered.
  2.  **Survey and Disambiguate Accounts (Weeks 3-4):** Systematically review the mechanisms proposed by key non-conditional accounts (e.g., Martin's/Johnston's causal basis, Choi's multi-track, Mumford's non-reductive) to handle standard masks and finks. Explicitly identify where these analyses treat interference, pinpointing any ambiguity or conflation between disposition/basis interference and pathway interference.
  3.  **Construct Critical Test Cases (Week 5):** Apply the defined self-unmasking cases to each selected account. Scrutinise whether and how each account can describe the disposition being present, masked, triggered, and then successfully manifesting *via* mask removal.
  4.  **Diagnose Circularity/Smuggling (Weeks 6-7):** Analyse the explanations offered in step 3. Is the account forced to rely on an unexplained "appropriate conditions" clause that presupposes the problematic conditional? Does defining the manifestation type (e.g., "dissolving-by-neutralising-inhibitor") simply build the conditional's truth into the analysandum, rendering the analysis circular? Or can the account genuinely explain the success non-circularly using its core resources (e.g., the causal basis's intrinsic powers operating unimpeded *after* the self-unmasking)?
  5.  **Synthesis and Drafting (Weeks 8-10):** Compile findings, determining which (if any) accounts succeed or fail the test. Draft the 8-10k word paper presenting the case, the analysis of accounts, the results, and implications for disposition theory.

  **What Success and Failure Look Like (Approx. 190 words):**

  *   **Success:** The project succeeds if it achieves a clear, defensible verdict on the capacity of leading non-conditional accounts to handle self-unmasking dispositions. Success could manifest in two ways:
      *   **Negative Result:** Demonstrating that all examined accounts *fail* the test, either by circularity or by smuggling in the conditional. This constitutes success by revealing a significant, previously unappreciated gap in the existing theoretical landscape, strongly suggesting a need for novel approaches to dispositions that explicitly accommodate self-modifying manifestation pathways.
      *   **Positive Result:** Identifying at least one account that *can* handle the case robustly and non-circularly. Success here involves precisely articulating *which* feature(s) of that account do the explanatory work (e.g., a specific understanding of causal bases, or a particular multi-track structure), thereby clarifying the strengths and requirements of that theory.
  *   **Failure:** The project fails if the constructed self-unmasking cases prove conceptually incoherent or fail to genuinely challenge the existing accounts in a novel way, perhaps because they collapse into standard mask cases under scrutiny. Failure would also occur if the analysis cannot definitively demonstrate the presence or absence of circularity/smuggling in the accounts' responses to the cases.

  **Scope (Approx. 140 words):**

  To ensure feasibility within the term and word limit, the scope will be deliberately constrained. The primary focus will be on simple, deterministic self-unmasking cases applied to a select few paradigmatic non-conditional analyses (likely 2-3 core representatives like causal basis or prominent multi-track theories). Probabilistic dispositions, highly complex systems, or dispositions involving reflexivity beyond mask removal will be set aside. The project will *diagnose* the problem or success regarding existing accounts but will not aim to develop a comprehensive, novel positive theory of dispositions as its primary output; that would exceed the remit. The literature review, while essential context, will be focused solely on extracting the relevant analytical machinery of the chosen accounts, not providing exhaustive historical coverage.
