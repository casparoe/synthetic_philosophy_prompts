prompt: |-
  I am the senior drafter at a public regulator that issues individual decisions — permits, benefit determinations, enforcement actions — under statutory standards phrased as gradable predicates: significant risk, material change, substantial benefit, reasonably practicable. Our decisions are appealed constantly, and the appellate body quashes them either for being too vague to bind us or for being too arbitrary to be fair. I need a drafting-and-adjudication procedure my team can actually run, first when we must put one of these standards into a rule, and then when we must apply it to a case. My drafters are lawyers, not philosophers; they have a week per rule, not a semester, and the chief executive signs the rule while the appellate body signs off on the case.

  Write it as an ordered procedure: the questions to ask, in sequence, from the moment a statute hands us a gradable term to the moment we issue a determination; what counts as a sufficient answer at each step; the point at which the procedure forces us to fix a bright-line cutoff and defend it as a cutoff rather than a measurement; the point at which it stops and hands the case to a person as a value judgment; and the point at which it requires us to record a decision we cannot justify internally, so that the record remains auditable.

  Ground it in what the philosophical literature on vagueness and the sorites actually establishes rather than in folk wisdom about gray areas: the difference between vagueness and ambiguity or mere underspecification; the difference between a borderline case and a case we simply do not yet know how to classify; the possibility of higher-order vagueness, i.e. borderline cases of borderline cases; and the fact that any consistent cutoff licenses a sorites march in which every individual step looks defensible. Give my drafters two tests they can run: one that walks a proposed cutoff along a chain of cases from clearly-in to clearly-out and asks whether the justification survives each step, and one that asks whether the procedure itself has a penumbra. Propose a way of recording penumbral decisions so that later decisions stay consistent with earlier ones without pretending the cutoff was discovered rather than chosen.

  Then run the procedure on three cases — one threshold of risk, one threshold of degree or similarity, one threshold of effort — at least one of which returns an outcome I will find unjust and arbitrary. End by stating plainly what the procedure cannot do, and which questions a court or a legislature, rather than my team, has to settle.
reasoning: |-
  We are designing a procedure for drafting rules and making determinations under statutory standards with gradable predicates (e.g., "significant risk", "material change"). The procedure must address vagueness and avoid arbitrary application while being practical for lawyers with limited time.

  Key philosophical insights:
  1. **Vagueness vs. Ambiguity/Underspecification**: 
     - Vagueness: a term has borderline cases (e.g., "bald" for a person with some hair).
     - Ambiguity: a term has multiple distinct meanings (e.g., "bank" as financial institution or river edge).
     - Underspecification: the term is incomplete and requires more details (e.g., "vehicle" in a context that doesn't specify if it includes bicycles).

  2. **Borderline cases**: These are cases where it is unclear whether the term applies. They are not cases of lack of information; even with full information, the classification is indeterminate.

  3. **Higher-order vagueness**: The boundary between clear cases and borderline cases is itself vague. There might be borderline cases of borderline cases.

  4. **Sorites paradox**: If we set a cutoff (e.g., 1000 grains of sand is a heap, 999 is not), then a chain of tiny differences (removing one grain at a time) leads from a clear case to a clear non-case, making each step seem defensible but the whole chain leading to absurdity. This shows that any cutoff is arbitrary to some extent.

  Procedure Goals:
  - Force explicit recognition of when a cutoff is being set arbitrarily.
  - Allow for value judgments in borderline cases.
  - Ensure consistent application and auditable records.

  The procedure has two phases: 
    I. Rulemaking: Creating a rule that interprets the statutory standard.
    II. Adjudication: Applying the rule to a specific case.

  ---

  **I. Rulemaking Phase: Creating the Rule**

  Objective: Transform the statutory gradable term into a rule that minimizes vagueness and provides guidance for adjudication.

  Step 1: Clarify the Term
     - Question: Is the statutory term vague, ambiguous, or underspecified?
     - Sufficient Answer: 
          - If ambiguous: resolve by choosing one meaning (using statutory context, legislative history, etc.) and note the choice.
          - If underspecified: specify the missing details (e.g., what factors are relevant?).
          - If vague: proceed to Step 2.

  Step 2: Identify the Core and the Penumbra
     - Question: What are clear cases (core) of the term and clear non-cases? What are the factors that move a case from core to non-core?
     - Sufficient Answer: 
          - A list of factors that are relevant to the gradable concept (e.g., for "significant risk": probability, severity, affected population, etc.).
          - Examples of clear cases (both positive and negative).

  Step 3: Define a Metric (if possible) or a Set of Criteria
     - Question: Can we assign a numerical metric to the gradable concept? If not, can we define a multi-factor test?
     - Sufficient Answer: 
          - Either a formula (e.g., risk = probability * severity) with a threshold, or a set of criteria (e.g., "a risk is significant if either the probability is above X and severity above Y, or the severity is catastrophic and probability above Z").
          - If a metric is used, note that the metric itself may have vagueness (e.g., how to measure severity?).

  Step 4: Set a Cutoff and Acknowledge Arbitrariness
     - Question: At what point on the metric (or under what combination of factors) does the term cease to apply? Why that point?
     - Sufficient Answer: 
          - A specific cutoff (e.g., 0.1% chance of death per year) OR a set of criteria that defines the boundary.
          - An explicit statement: "This cutoff is chosen as a matter of policy to provide clarity, but it is arbitrary in the sense that a slightly different cutoff would also be defensible. However, it is necessary to draw a line to avoid the Sorites paradox and to ensure consistent application."
          - The justification must include the policy reasons for the cutoff (e.g., "we choose 0.1% because that is the level of risk that the agency has historically considered significant and because it aligns with other regulatory thresholds").

  Step 5: Test the Cutoff with Sorites March
     - Test 1: Walk the cutoff along a chain of cases from clear-in to clear-out.
          - Example: Start with a clear case of significant risk (say, 10% chance of death) and reduce the risk by small increments (e.g., 0.01% steps) until reaching a clear non-case (0.01% chance). 
          - Question: At each step, does the justification for the cutoff (from Step 4) still hold? If the justification breaks down at a step, then that step might be a better cutoff? But note: the point is that the justification will inevitably break down at some point because of the sorites. The test is to ensure that the cutoff is not set at a point where the justification is clearly inadequate (e.g., if the justification is "risks above 0.1% are significant because they are above the background risk of 0.05%", then at 0.11% the justification holds, but at 0.101% it becomes weak?).
          - Actually, the test is to reveal that the cutoff is arbitrary. The goal is not to find a non-arbitrary cutoff (because there isn't one) but to ensure that the chosen cutoff is within a range that is defensible and that the agency acknowledges the arbitrariness. Therefore, the test is passed if the justification holds for a reasonable range around the cutoff (i.e., the cutoff is not set at an outlier point) and the agency acknowledges that the exact point is a policy choice.

     - Test 2: Does the rule itself have a penumbra?
          - Question: Even after setting the cutoff, are there cases near the cutoff that are borderline? How will we handle them?
          - Sufficient Answer: 
              - Acknowledge that there is a penumbra (borderline cases) and that in the adjudication phase, these cases will be decided by a designated decision-maker using judgment, guided by the rule but not bound by a rigid cutoff if the rule is designed to allow discretion in borderline cases. 
              - If the rule sets a strict cutoff (e.g., above 0.1% is significant, below is not), then the penumbra is explicitly overruled by the cutoff. But note: the cutoff itself may be challenged as arbitrary. Therefore, the rule must record the reasons for the cutoff and the acknowledgment that it is a choice.

  Step 6: Record the Rule and Its Justification
     - The rule must include:
          - The factors or metric.
          - The cutoff or criteria for application.
          - The policy reasons for the cutoff.
          - An acknowledgment of the arbitrary nature of the cutoff and the existence of borderline cases (if the rule does not set a strict cutoff, then how borderline cases will be handled).

  ---

  **II. Adjudication Phase: Applying the Rule to a Case**

  Objective: Apply the rule to a specific fact pattern and issue a determination.

  Step 1: Gather Facts
     - Collect all relevant facts necessary to apply the rule.

  Step 2: Apply the Rule
     - If the rule sets a strict cutoff (e.g., a numerical threshold), then measure the case against the cutoff.
          - If the case is clearly above or below, then the determination is automatic.
          - If the case is near the cutoff (within a predefined margin, e.g., ±10% of the threshold) and the rule does not specify a margin of discretion, then treat it as a borderline case and go to Step 3.
     - If the rule sets a multi-factor test without a strict cutoff, then evaluate the factors and determine if the case meets the criteria.

  Step 3: Borderline Case Handling
     - If the case is borderline (either because it is near a numerical cutoff or because the multi-factor test does not yield a clear answer), then the decision must be made by a designated senior decision-maker (e.g., the chief executive or a panel) using judgment.
     - The decision-maker must consider:
          - The purpose of the statute and the rule.
          - Consistency with past decisions (if any).
          - The policy reasons for the rule.
     - The decision must be recorded as a borderline decision, and the reasons for the exercise of discretion must be documented.

  Step 4: Record the Determination
     - For non-borderline cases: state the facts and how they meet the rule.
     - For borderline cases: 
          - State that the case is borderline (explain why, e.g., "the risk level is 0.095%, which is within 5% of the 0.1% threshold").
          - Record the discretionary decision and the reasons for it (e.g., "we consider this risk significant because the affected population is particularly vulnerable").
          - Note that the decision is not dictated by the rule but is a policy choice in the penumbra.

  Step 5: Consistency Check
     - Compare the current case with past borderline decisions. 
     - If the current decision is inconsistent with past decisions without a reasoned distinction, then the decision must be revisited.

  ---

  **Auditability and Record Keeping**
  - All rules must record the rationale for the cutoff and the acknowledgment of arbitrariness.
  - For adjudications, the record must clearly indicate:
     - Whether the case was clear or borderline.
     - For borderline cases, the reasons for the discretionary decision.
  - This allows an appellate body to review whether the procedure was followed and whether the agency was consistent in its exercise of discretion.

  ---

  **Testing the Procedure with Three Cases**

  Case 1: Threshold of Risk (Significant Risk)
     - Rule: A risk is significant if the expected annual fatalities are at least 0.1 per 100,000 people (i.e., 1 in a million chance of death per year per person).
     - Case: A chemical plant's emissions are estimated to cause 0.099 expected annual fatalities per 100,000 people.
     - Application: 
          - The rule sets a strict cutoff at 0.1. The case is at 0.099, which is within 1% of the cutoff -> borderline.
          - The decision-maker must exercise discretion. They decide it is not significant because 0.099 is very close and the costs of regulation are high.
     - Arbitrary outcome: A nearly identical plant with 0.1001 would be regulated, but this one is not. The difference is negligible, but the outcome is different. This is the arbitrariness inherent in cutoffs.

  Case 2: Threshold of Degree or Similarity (Material Change)
     - Rule: A change is material if it affects the value of a property by more than 5%.
     - Case: A change that affects the property value by 5.01%.
     - Application: 
          - Clear case? The rule sets 5% as the cutoff. 5.01% is above -> material change.
          - However, if we consider measurement error, the true change might be between 4.9% and 5.2%. The agency's measurement method has an error margin of ±0.2%. Then, 5.01% might be as low as 4.81% (below) or as high as 5.21% (above). 
          - We must then treat it as borderline because the true value is uncertain and spans the cutoff. The decision-maker might decide that because the point estimate is above, they will treat it as material, but note the uncertainty.

     - Alternatively, if the rule does not account for measurement error, then the agency must set a policy for measurement (e.g., use a specific method and round to the nearest 0.1%). Then, 5.01% is above 5% -> material. But this is arbitrary because the true change might be 4.99% but measured as 5.01%.

  Case 3: Threshold of Effort (Reasonably Practicable)
     - Rule: A safety measure is reasonably practicable if the annualized cost per life saved is less than $10 million.
     - Case: A measure costs $9.9 million per life saved.
     - Application: 
          - Clear case? The rule sets $10 million as the cutoff. $9.9M is below -> reasonably practicable, so required.
          - But note: the company argues that it is in financial distress and that the cost would be ruinous. The rule does not consider financial distress. 
          - The rule might be underspecified. If the rule only considers the cost per life saved and not the absolute cost or the company's ability to pay, then the agency must either:
               a) Apply the rule strictly -> require the measure.
               b) Treat it as borderline and use discretion to waive it due to financial distress.
          - If the rule did not include financial distress as a factor, then the strict application leads to an outcome that may seem unjust: a company in distress must spend $9.9M to save one life, which might bankrupt it and cause many job losses. The agency might record that the case is borderline because the cost is very close to the cutoff and the financial distress is an extenuating circumstance. Then, the decision-maker waives the requirement.

     - Arbitrary outcome: A company with a measure costing $10.1M per life saved would not have to implement it, even if it is financially healthy, while the distressed company with a $9.9M measure is required to implement it unless discretion is exercised. By exercising discretion in this case, the agency avoids the injustice but introduces inconsistency.

  ---

  **What the Procedure Cannot Do**

  1. **Eliminate arbitrariness**: Any cutoff will be arbitrary in the sense that a tiny change can flip the outcome. The procedure forces acknowledgment and records the reasons, but it cannot remove the arbitrariness.
  2. **Resolve higher-order vagueness**: The procedure might set a cutoff and then a margin for discretion, but the boundary of that margin (i.e., what is "near" the cutoff) is itself vague. We can set a margin (e.g., ±10%) but then that margin is arbitrary too.
  3. **Provide a non-arbitrary justification for the cutoff**: The justification is policy-based and not derived from the concept itself.
  4. **Replace legislative or judicial clarity**: If the statute is too vague, only the legislature can amend it to provide more clarity. If the appellate body finds the agency's rule arbitrary, the court might strike it down. The agency cannot solve fundamental vagueness without exercising delegated authority, which is subject to judicial review.

  **Questions for Courts or Legislatures**:
  - The legislature must decide if it wants to delegate the drawing of lines to the agency. If it does, then the agency must do so, but the courts must review the reasonableness of the agency's choice.
  - The courts must decide the level of deference (e.g., Chevron deference) to the agency's interpretation of the statutory term and the reasonableness of the cutoff.

  By following this procedure, the agency can demonstrate that it has grappled with vagueness in a systematic and auditable way, which may help in defending against appeals.
answer: |-
  Below is a comprehensive, step-by-step procedure for your drafting team, grounded in philosophical principles of vagueness (drawing from Sorensen, Williamson, and the literature on the sorites paradox) and designed for practical regulatory use. The procedure forces explicit confrontation with vagueness at key points, distinguishes between epistemic uncertainty and true borderline cases, and mandates auditable records of arbitrary choices. It includes two concrete tests to evaluate cutoffs and manage penumbral cases.

  ---

  ### **Procedure for Drafting Rules & Adjudicating Cases with Gradable Predicates**

  #### **Key Definitions (Philosophical Grounding)**
  - **Vagueness**: A term is vague if it admits of borderline cases (e.g., "significant risk" has clear cases and unclear cases, even with perfect information).
  - **Ambiguity/Underspecification**: Distinct from vagueness. Ambiguity involves multiple meanings (e.g., "bank" as river vs. financial institution); underspecification means the term lacks detail (e.g., "reasonable" without context). Your procedure resolves these first.
  - **Borderline Cases**: Instances where the term’s application is indeterminate (not due to lack of data). For example, a risk that is neither clearly significant nor clearly insignificant.
  - **Higher-Order Vagueness**: The boundary between clear cases and borderline cases is itself vague (e.g., "clearly significant" vs. "borderline significant" vs. "clearly insignificant" may lack sharp divisions).
  - **Sorites Paradox**: Any cutoff (e.g., "risk ≥ 5% is significant") allows a "sorites march" where small, defensible steps lead from a clear case (e.g., 50% risk) to a clear non-case (e.g., 0.1% risk), exposing arbitrariness.

  ---

  ### **Phase 1: Rulemaking (Drafting the Rule)**
  *Time: 1 week per rule. Output: A rule with a testable cutoff and transparent justification.*

  1. **Clarify the Term (Day 1)**  
     - **Question**: Is the statutory term vague, ambiguous, or underspecified?  
     - **Sufficient Answer**:  
       - If ambiguous, identify and resolve all meanings (e.g., "material change" could mean financial or operational; choose one using statutory context).  
       - If underspecified, add context (e.g., "substantial benefit" must specify benefit to whom: consumers, environment, etc.).  
       - If vague, proceed to Step 2. Keep a record: *"Term is vague; borderline cases expected."*  
     - **Philosophical Anchor**: Vagueness is intrinsic and irreducible—no amount of analysis eliminates borderline cases.

  2. **Define the Scale and Core Cases (Day 2)**  
     - **Question**: What metric or factors measure this predicate? What are clear positive/negative examples?  
     - **Sufficient Answer**:  
       - A scale (e.g., risk as probability × severity) or factors (e.g., for "reasonably practicable": cost, feasibility, industry standards).  
       - 3+ clear positive ("significant risk": 80% chance of fatal injury) and negative examples ("insignificant risk": 0.001% chance of minor rash).  
     - **Record**: *"Core cases defined. Scale/factors: [list]."*

  3. **Propose a Cutoff and Justify It (Day 3)**  
     - **Question**: At what point does the predicate cease to apply? Why here?  
     - **Sufficient Answer**:  
       - A bright-line cutoff (e.g., "significant risk = risk score ≥ 6.0") or a weighted-factor test (e.g., "material change = ≥3 factors present").  
       - A policy-based justification (e.g., "cutoff aligns with legislative intent to prevent catastrophic harm" or "industry cost data shows feasibility").  
       - **Mandatory Statement**: *"This cutoff is policy-driven. It is arbitrary in the sorites sense but necessary for consistency."*  
     - **Philosophical Anchor**: All cutoffs are arbitrary—they resolve vagueness but invite sorites challenges.

  4. **Run the Two Tests (Day 4)**  
     - **Test 1: Sorites March**  
       - **Steps**: Take a chain of 10+ hypothetical cases from clear positive to clear negative (e.g., risk scores from 10.0 to 0.1 in 0.1-step decrements).  
       - **Question**: Does the cutoff justification hold at each step?  
       - **Sufficient Answer**: If the justification fails at any step (e.g., "risk=1.0 feels insignificant, but cutoff=1.0 was justified by public safety"), revise the cutoff or justification. Record failures.  
     - **Test 2: Penumbra Detection**  
       - **Question**: Does the cutoff create borderline cases? Is there higher-order vagueness?  
       - **Sufficient Answer**:  
         - Identify a "penumbral range" (e.g., risk scores 5.8–6.2 where classification is indeterminate).  
         - If higher-order vagueness exists (e.g., "is risk=5.8 borderline or clear?" is unclear), note: *"Borderline cases may themselves have borderline status."*  
     - **Record**: *"Cutoff passes/fails tests. Penumbra range: [X–Y]."*

  5. **Finalize and Sign the Rule (Day 5)**  
     - **Output**: A rule with:  
       - The cutoff/test.  
       - Justification and acknowledgment of arbitrariness.  
       - Defined penumbral range (e.g., "Scores 5.8–6.2 require adjudicator discretion").  
     - **Executive Sign-off**: Chief executive signs after confirming policy rationale.

  ---

  ### **Phase 2: Adjudication (Applying the Rule to a Case)**
  *Time: Case-dependent. Output: A determination with auditable reasoning.*

  1. **Gather Facts and Measure (Step 1)**  
     - **Question**: Where does this case fall on the scale/factors?  
     - **Sufficient Answer**: Quantified metric (e.g., risk score = 5.9) or factor tally (e.g., 2/3 factors for "material change").

  2. **Classify the Case (Step 2)**  
     - **Questions**:  
       - Is it a clear case (clearly in/out of penumbral range)?  
       - Is it borderline (within penumbral range)?  
     - **Sufficient Answer**:  
       - Clear case: Apply the rule automatically.  
       - Borderline case: Proceed to Step 3.  
       - **Record**: *"Case classification: [Clear/Borderline]."*

  3. **Resolve Borderline Cases (Step 3)**  
     - **Question**: What value judgment applies here?  
     - **Sufficient Answer**:  
       - Designated adjudicator (e.g., senior drafter) decides based on:  
         - Consistency with past borderline cases.  
         - Policy goals (e.g., "precautionary principle favors calling this risk significant").  
       - **Mandatory Statement**: *"This is a borderline case. Outcome is a policy choice, not a factual determination."*  
     - **Philosophical Anchor**: Borderline cases require value judgments—no "correct" answer exists.

  4. **Record and Audit-Proof (Step 4)**  
     - **For Clear Cases**: *"Rule applied: [cutoff] met/not met."*  
     - **For Borderline Cases**:  
       - *"Case in penumbra [range]. Adjudicator [Name] exercised judgment due to [policy reason]. Consistent with [past case ID]."*  
       - **No Internal Justification Allowed**: Never claim the cutoff "discovered" the answer. Admit arbitrariness: *"Choice made where rule is silent."*  
     - **Audit Trail**: Log all borderline decisions in a searchable registry for consistency checks.

  ---

  ### **Test Cases: Applying the Procedure**
  *Assume rules drafted per Phase 1.*

  #### **Case 1: Threshold of Risk ("Significant Risk" in a Chemical Permit)**  
  - **Rule**: "Significant risk = risk score ≥ 6.0 (score = probability × severity; 1–10 scale). Penumbra: 5.8–6.2."  
  - **Facts**: Factory emissions risk score = 5.9 (probability=medium, severity=high).  
  - **Adjudication**:  
    - Borderline case (within 5.8–6.2).  
    - Adjudicator denies permit, citing "precaution for vulnerable populations."  
  - **Arbitrary Outcome**: Identical factory with score=6.1 gets approved due to different adjudicator ("industry jobs priority"). Unjust inconsistency, but recorded as policy choice.  

  #### **Case 2: Threshold of Similarity ("Material Change" in a Merger Review)**  
  - **Rule**: "Material change = ≥3 factors: (1) >5% market share shift, (2) new regulatory burden, (3) consumer price increase >10%." Penumbra: 2/3 factors.  
  - **Facts**: Merger has 4.9% market shift, new burden, 11% price increase (2/3 factors).  
  - **Adjudication**:  
    - Borderline case (market shift near-threshold).  
    - Adjudicator approves merger, reasoning: "4.9% is de facto 5%; no material change."  
  - **Sorites Exposure**: If 4.9% ≈ 5%, then 4.8% ≈ 4.9% ≈ 5%—sorites march erodes cutoff.  

  #### **Case 3: Threshold of Effort ("Reasonably Practicable" Safety Modifications)**  
  - **Rule**: "Reasonably practicable = cost per life saved ≤ $10M. Penumbra: $9M–$11M."  
  - **Facts**: Modification costs $9.5M per life saved.  
  - **Adjudication**:  
    - Borderline case.  
    - Adjudicator rejects it, stating: "$9.5M is too burdensome for small businesses."  
  - **Arbitrary Injustice**: A nearly identical $10.5M case was approved last month. Rule lacks "small business" exception—adjudicator overreached, but record shows borderline discretion.

  ---

  ### **What the Procedure Cannot Do**
  1. **Eliminate Vagueness or Arbitrariness**:  
     - The sorites paradox ensures all cutoffs are vulnerable to "slippery slope" challenges.  
     - Higher-order vagueness means penumbral ranges themselves have blurred edges.  
  2. **Resolve Value Conflicts**:  
     - When statutory goals clash (e.g., "economic growth" vs. "public safety" in borderline cases), the procedure forces a choice but cannot make it "right."  
  3. **Override Courts or Legislatures**:  
     - **Courts must decide**: Whether the agency's cutoff is "reasonable" under *Chevron* or arbitrary under *State Farm*.  
     - **Legislatures must decide**: If gradable predicates are too vague to delegate (per *ATS v. EPA* nondelegation doctrine).  

  ### **Final Output for Your Team**  
  - **Rules**: Cutoffs with penumbral ranges, policy justifications, and sorites-test results.  
  - **Determinations**: Distinguish clear applications from borderline judgments.  
  - **Audit Trail**: Registry of all borderline cases to enforce consistency.  

  This procedure makes arbitrariness explicit, defensible, and auditable—turning philosophical inevitabilities into bureaucratic assets.
