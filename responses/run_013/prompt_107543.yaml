  Hmm, the user wants an accuracy audit of a summary of Kripke's origin essentialism. They've provided a detailed summary from a philosophy talk and want to know which parts Kripke or defenders would accept, which they'd wince at, and which they'd reject. They also want clarification on two consequences mentioned and whether the common objection refutes anything. Finally, they have two specific cases about twinning and gestation that they want analyzed through the lens of origin essentialism.

  The summary contains several key points: that you couldn't have come from different gametes, that this is just a vivid way of saying you couldn't have had different parents, that it's modal necessity with a thought experiment about sperm substitution, that the necessity is one-directional (origin couldn't be different but origin doesn't necessitate you), and that the alternative would be non-existence rather than a different person. The objection mentioned is conceivability implying possibility.

  For the accuracy audit: Kripke definitely held the core gamete essentialism in Naming and Necessity. The "vivid rather than adding anything" part is problematic since the gametes are actually doing important theoretical work - it's more precise than just "parents" which could be ambiguous. The modal thought experiment captures Kripke's method well. The one-directional necessity is correctly attributed - Kripke explicitly denies sufficiency. The "no one" consequence is standard. The conceivability objection is indeed the main counterargument, but Kripke would argue conceivability doesn't entail metaphysical possibility.

  For the user's cases:
  1. In the twinning scenario, origin essentialism faces a challenge since both twins share the same gametic origin. Kripke acknowledged this problem and it suggests origin might be necessary but not sufficient for identity.
  2. For gestation in a different womb, the doctrine as stated doesn't specify anything beyond gametes, so it should be metaphysically indifferent. Kripke didn't address womb location, so this would likely be an empirical detail.

  The user seems philosophically sophisticated but not specialized - they're careful about "packaging doing quiet work" and want precision. Their cases show they're thinking about boundary conditions of the theory. I need to answer exactly as requested: five numbered points without introduction or conclusion, each just 1-2 sentences covering the audit, consequences, objection, and their two cases.
answer: |-
  1. Kripke and defenders accept the core claim that an individual could not have originated from different gametes (sperm and egg), that this is a matter of metaphysical necessity, that the necessity is one-directional (your origin is essential, but your origin doesn't necessitate *you*), and that the alternative scenario involves your non-existence rather than a different person; they also accept the modal thought experiment as illustrative.
  2. Defenders would wince at the claim "the talk of gametes is there to make it vivid rather than to add anything," as Kripke explicitly grounds origin essentialism in the *specific gametes* to avoid ambiguity with "parents" (which could involve social or genetic relations distinct from the originating biological material), making the gamete-level specification crucial to the doctrine.
  3. The two announced consequences (one-directional necessity and the "no one" result) are genuine consequences of Kripke's stated position; the objection based on conceivability is the standard counterargument but does not refute the doctrine for Kripkeans, who deny that conceivability entails metaphysical possibility in such identity cases—it highlights the dispute rather than resolving it.
  4. In the twinning case (same sperm/egg, zygote splits, one twin dies), origin essentialism faces a well-known problem: both twins share the *same* gametic origin, so the doctrine (treating origin as necessary but not sufficient) cannot by itself determine whether the survivor is you or your twin, suggesting a potential need for additional criteria like spatiotemporal continuity.
  5. For the gestation case (same sperm/egg, different womb), Kripke's doctrine as explicitly stated implies gestation location is metaphysically irrelevant; only the specific gametes are essential to origin, so you would exist in that scenario (contingent on successful development), as the doctrine exhausts "origin" in the gametes themselves.
