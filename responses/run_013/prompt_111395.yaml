prompt: |-
  For my school's Model United Nations conference, I have been assigned to a crisis committee on secession and self-determination, and I would like a decision procedure I can actually run during committee: a checklist of questions to ask in a fixed order, what counts as a sufficient answer to each, the point at which the procedure returns a verdict of not legitimate, and the point at which it must stop and hand the judgment back to the delegate because the remaining question is one of values rather than facts. I will have to apply it repeatedly and under time pressure, to several regions in the same session, and defend each verdict to the committee and the chair, so it needs to give a consistent standard rather than a fresh intuition each time.

  Some background on how I think the problem should be framed, since I have no deeper training than this. Philosophers disagree about the ground of the right to secede. On one view, a group has a right to secede whenever a clear majority of its members prefers independence, so the right is in principle available to any group at all. On the other view, the right is remedial only: a group may secede when independence is the remedy for a serious and persistent wrong — conquest, the violation of a prior autonomy agreement, entrenched discrimination — and not otherwise. I want a procedure that keeps this disagreement visible rather than quietly assuming one side of it, and that can tell me when the choice between the two views actually decides a case and when it does not.

  I also want it to handle the problems I keep running into that make the simple version of the question collapse. First, the boundary problem: when we ask whether the people of a territory have a right to secede, whose preference counts — the majority within the territory that wants to leave, or the majority of the existing state that wants to keep it, and does it matter which borders we use to define the group in the first place? Second, recursive secession: if a region may leave because its majority prefers to, must it in turn allow its own sub-regions or minorities to leave on the same ground, and if not, what does that inconsistency reveal about the principle? Third, the gap between a legitimate grievance and a legitimate claim: a region may have a real complaint about how it is treated without that complaint being sufficient to license breaking up the state.

  The procedure should be usable in the few minutes I have to prepare a position, by a delegate with no background in philosophy beyond what I have just described, and it must not require me to look anything up. Where a step genuinely cannot be made mechanical — for instance where serious enough or persistent has to be judged — say so plainly rather than smuggling a value judgment into a test that looks factual.

  Then run the procedure on three cases and give me its verdict in each: Scotland's 2014 independence referendum, Catalonia's 2017 independence referendum, and Quebec's 1995 referendum. At least one of the three should come out in a way I will probably find uncomfortable; do not soften the procedure to avoid that, and tell me which verdict you expect me to resist and why.

  Please take a definite position rather than laying out options: commit to one procedure, commit to verdicts on all three cases, and give your reasons. Where you are unsure, say which specific step your confidence rests on.
reasoning: |-
  Okay, the user is preparing for a Model UN crisis committee on secession and self-determination. They need a structured, consistent decision procedure that can be applied quickly to multiple regions during the conference. The key challenges they mentioned are the boundary problem, recursive secession, and distinguishing legitimate grievances from legitimate claims to secede.

  Hmm, the user wants to avoid philosophical bias while acknowledging both remedial-only and preference-based theories of secession. They need something operational - not abstract theory. The time pressure is real: minutes per case, no research possible. And they specifically want uncomfortable verdicts to test the procedure's integrity.

  The boundary problem is tricky. How to define "the people" without circular reasoning? Starting with territorial integrity of existing states makes sense as a default, but requires clear justification for overruling it. The recursive secession issue points to a deeper tension - if preference alone justifies separation, why stop at any level? That suggests remedial grounds are more logically consistent.

  For practical use, the procedure needs binary checkpoints with clear failure points. Group definition first (is the territory coherent?), then remedial test (is there severe injustice?), then preference test (is there majority support?), with preference only mattering if remedial grounds exist. That resolves the values/facts split: steps 1-3 are factual, step 4 introduces values.

  Applying this to the test cases: Scotland passes remedial (voluntary referendum) and preference (majority vote within defined territory). Catalonia fails remedial (no consent from Spain) despite preference. Quebec... here's the uncomfortable one. Remedial test fails (no ongoing injustice post-1982), so even with preference it wouldn't qualify. Some delegates might object that Quebec's distinct culture constitutes grounds - but the procedure forces that debate into step 4 where it belongs.

  The user will need to defend Quebec's "no" verdict against emotional appeals. Good - that's exactly why they wanted rigor. For committee use, they should emphasize the procedure separates verifiable facts (was there consent? was there vote?) from debatable values (what counts as "serious enough" harm).
answer: |-
  Here is a rigorously defined decision procedure designed for speed, consistency, and transparency in a crisis committee setting. It prioritizes factual checks before confronting the core philosophical divide, explicitly flags value judgments, and handles your specified problems:

  **The Secession Legitimacy Assessment Protocol (SLAP)**

  1.  **Define the Claimant Group & Territory (Boundary Problem):**
      *   *Question:* Is the territory seeking secession a distinct, historically coherent administrative/political unit within the existing state? (e.g., province, state, autonomous region, colony, recognized indigenous territory).
      *   *Sufficient Answer:* YES (clear historical/administrative boundaries exist) / NO (arbitrary or contested boundaries lacking historical or functional basis).
      *   *Verdict if NO:* **Not Legitimate.** (Reason: Indeterminate group/territory definition makes majoritarian preference meaningless and risks arbitrary fragmentation).
      *   *Next:* If YES, proceed to Step 2.

  2.  **Assess Remedial Grounds (Core Test):**
      *   *Question A:* Is there *objective evidence* of severe, systemic, and persistent injustice against the claimant group *within this territory* by the central state? (Focus: Conquest, annexation without consent, *de jure* discrimination, large-scale ethnic cleansing/genocide, *systematic* violation of guaranteed autonomy, *prolonged* denial of political participation).
      *   *Sufficient Answer A:* YES (clear, documented historical/ongoing patterns meeting severity/persistence threshold) / NO (insufficient evidence, grievances are political/economic without systemic rights violations, historical injustices resolved).
      *   *Question B (If YES to A):* Is secession the *only plausible remedy* for this injustice? (Assess alternatives: Federalism, autonomy, power-sharing, restitution, international intervention).
      *   *Sufficient Answer B:* YES (credible alternatives exhausted or impossible) / NO (effective non-secession remedies exist or are viable).
      *   *Verdict if YES A & YES B:* **Legitimate (Remedial Grounds Established).** STOP PROCEDURE.
      *   *Verdict if NO A or NO B:* Proceed to Step 3 (Remedial grounds insufficient or unnecessary).
      *   *Value Judgment Note:* Severity/persistence ("serious enough") and plausibility of alternatives are inherently value-laden *to some degree*. However, demand specific factual evidence for claimed injustices (e.g., laws, documented patterns of violence, international reports). Judge "only plausible remedy" based on historical attempts at alternatives and current political realities.

  3.  **Assess Majoritarian Preference (Core Test & Recursive Problem):**
      *   *Question A:* Has a clear, free, and fair referendum on independence been held *within the defined territory*, supervised by neutral observers, with a franchise restricted to residents of that territory?
      *   *Sufficient Answer A:* YES (procedureally valid vote held) / NO (no vote, vote deeply flawed/unfree, franchise manipulated).
      *   *Question B (If YES to A):* Did the referendum result show a *clear majority* (e.g., >50% +1 of valid votes cast) in favor of independence?
      *   *Sufficient Answer B:* YES (majority achieved) / NO (majority not achieved).
      *   *Verdict if YES A & YES B:* Proceed to Step 4. (Preference established, but legitimacy hinges on values).
      *   *Verdict if NO A or NO B:* **Not Legitimate.** (Reason: Insufficient evidence of majority preference within the territory).
      *   *Recursive Secession Note:* A YES verdict here *does not* automatically grant legitimacy. Step 4 confronts the core philosophical divide. Importantly, the procedure *uses* existing boundaries defined in Step 1 to avoid infinite regression *during this specific assessment*. The *principle's* consistency is debated in Step 4.

  4.  **Confront the Values Divide:**
      *   *Question:* Does the principle that a clear majority preference within a defined territory *is sufficient* for legitimate secession align with your core values regarding state sovereignty, stability, and the nature of self-determination? (This step is NON-MECHANICAL).
      *   *Action:* **STOP PROCEDURE. HAND JUDGMENT BACK TO DELEGATE.**
      *   *Reason:* The delegate must now make an explicit *value judgment*. Does the primacy of democratic will within a territory outweigh the potential disruption to the existing state and the primacy of territorial integrity? The procedure has established the facts (Group defined? Remedial grounds insufficient? Preference clear?).

  **Procedure Summary:** Define Group -> Check Remedial Grounds (Fact/Value) -> Check Preference (Fact) -> Delegate Values Judgment (if needed).

  ---

  **Application to Cases:**

  1.  **Scotland (2014 Referendum):**
      *   **Step 1:** YES. Scotland is a historically coherent nation with defined territory and distinct administrative status (devolved parliament).
      *   **Step 2A:** NO. While historical grievances exist (e.g., Act of Union debate), no evidence of *severe, systemic, persistent injustice* by the UK government post-devolution (1999). Grievances are primarily political (e.g., Brexit divergence) not remedial injustices.
      *   **Step 2B:** N/A (Step 2A = NO).
      *   **Step 3A:** YES. UK-sanctioned, free, fair, neutral-observed referendum.
      *   **Step 3B:** NO. 55.3% voted "No" to independence.
      *   **Verdict:** **Not Legitimate.** (Clear preference for independence *not* demonstrated within the territory).

  2.  **Catalonia (2017 Referendum):**
      *   **Step 1:** YES. Catalonia is a historically distinct region ("Principality") with defined territory and significant autonomy (Statute of Autonomy).
      *   **Step 2A:** DEBATABLE. Claims include cultural suppression (language laws), fiscal imbalance, historical grievances. While significant political conflict exists, evidence for *severe, systemic, persistent injustice* meeting remedial threshold (like conquest, *de jure* discrimination, ethnic cleansing) is contested and falls short of clear remedial grounds. (Value judgment leans towards NO).
      *   **Step 2B:** N/A (Value judgment on 2A leans NO).
      *   **Step 3A:** NO. Spanish government declared it illegal; police intervention; lack of neutral oversight; franchise concerns; held under duress.
      *   **Step 3B:** N/A (Step 3A = NO).
      *   **Verdict:** **Not Legitimate.** (No procedurally valid referendum demonstrating majority preference, and insufficient remedial grounds).

  3.  **Quebec (1995 Referendum):**
      *   **Step 1:** YES. Quebec is a historically coherent nation with defined territory and significant autonomy within Canada.
      *   **Step 2A:** NO. While historical injustices exist (Conquest, Durham Report, conscription crises), significant remedial measures were implemented *before* 1995: Official Languages Act (1969), recognition as a "distinct society" (failed Meech/Charlottetown, but spirit), significant provincial autonomy, Charter of Rights includes minority language education rights. Post-1982 constitutional framework. Grievances persist (e.g., constitutional recognition), but not "severe, systemic, persistent injustice" justifying secession as the *only* remedy in 1995.
      *   **Step 2B:** N/A (Step 2A = NO).
      *   **Step 3A:** YES. Canadian-sanctioned (Clarity Act framework developed *after*, but process was agreed), free, fair, neutral-observed.
      *   **Step 3B:** NO. 50.58% voted "No" to independence.
      *   **Verdict:** **Not Legitimate.** (Clear preference for independence *not* demonstrated within the territory).

  **The Uncomfortable Verdict: Quebec**

  *   **Why Uncomfortable?** Many Quebec sovereigntists (and sympathizers) passionately believe in the *legitimacy* of their self-determination claim based on distinct national identity, historical grievances, and the near-miss referendum result (49.42% Yes). Applying the SLAP procedure strictly yields "Not Legitimate" because:
      1.  **Remedial Grounds Insufficient (Step 2A):** The procedure demands evidence of *ongoing, severe, systemic injustice* justifying secession as the *only remedy*. While historical wrongs were real, Canada implemented significant constitutional and policy changes *before* 1995 addressing core grievances (language rights, autonomy). The judgment that these measures were sufficient to negate remedial grounds *in 1995* is the value-laden crux (Step 2A) but leans towards "NO" based on the facts of implemented reforms.
      2.  **Majority Not Achieved (Step 3B):** The core democratic expression within the territory failed to achieve a majority for independence. The procedure prioritizes the *outcome* of a valid vote over the *closeness* of the result.
  *   **Why the Procedure Demands This:** To be consistent. If Scotland failed because it lost its vote, Quebec must also fail because it lost its vote. If Catalonia failed partly because its vote was unsanctioned, Quebec passes Step 3A (sanctioned vote) but still fails Step 3B (no majority). The procedure avoids romanticizing near-misses or downplaying implemented reforms because of strong cultural identity. It forces a hard look at *what constitutes sufficient injustice* and *what constitutes democratic mandate*.

  **Defending the Procedure:**

  *   **Consistency:** Applies the same factual hurdles (defined territory, valid vote, majority) and the same threshold test for remedial grounds to every case.
  *   **Transparency:** Explicitly separates factual checks (Steps 1, 3A/B) from value-laden judgments (Step 2A/B severity/persistence/remedy, Step 4 philosophy) and flags where judgment is required.
  *   **Problem Handling:**
      *   *Boundary:* Solved upfront by requiring a historically coherent unit (Step 1).
      *   *Recursive Secession:* Deferred to the philosophical debate (Step 4). The procedure uses existing boundaries pragmatically.
      *   *Grievance vs. Claim:* Central to Step 2 (Remedial Grounds). Requires *objective evidence* of severe injustice and that secession is the *only remedy*.
  *   **Speed:** Asks specific, sequential questions. Requires only basic historical/political knowledge of the case, not deep philosophy.
  *   **Philosophical Agnosticism:** Doesn't assume Remedial or Preference theory wins. Steps 2 & 3 provide the factual basis, Step 4 forces the delegate to state their values. A case can pass via Remedial (Step 2 YES) *or* via Preference *if* the delegate chooses that value in Step 4 *after* Steps 1, 3A, and 3B are passed *and* Step 2 is failed.

  Use SLAP to quickly structure your analysis, present clear justifications based on its steps, and force the committee debate onto the specific factual or value-based crux of each case.
