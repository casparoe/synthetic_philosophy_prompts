prompt: |-
  Ok, I'm writing a seminar paper on the wrong kind of reasons and before I start I want to check that my own view actually hangs together, because I have a feeling it doesn't and I can't see where. Roughly what I believe:

  (1) reasons for attitudes are the basic kind — reason to believe, reason to want, reason to admire — and reasons for action come downstream of those; more generally I'm a reasons-firster, I think "ought" and "fitting" get explained in terms of reasons rather than the other way round.
  (2) what makes a consideration a reason of the right kind for an attitude is that it bears on whether the attitude fits its object — fittingness is what does the normative work.
  (3) demon case: if a demon threatens to torture me unless I believe that 2+2=5, the threat gives me no reason at all to believe it, not even a weak one that just gets outweighed.
  (4) parallel case: if he threatens to torture me unless I desire a saucer of mud, I think the threat really does give me a reason to desire the mud — a reason to have the desire, not just a reason to bring the desire about.
  (5) same for admiration: threaten me unless I admire his painting and I've got no reason to admire it.

  My instinct is that (4) is fine because wanting isn't answerable to the world the way believing is, so the demon can get a grip on my desires in a way he can't on my beliefs. But I also think its perfectly rational to take a pill that makes you believe you'll succeed at something, and I can't tell whether that's a problem for (3) or a different kind of thing altogether. Can you tell me which of these are actually in tension, which only look like they are, how bad each one is, and what the cheapest way out would be? I'd rather not find out in the seminar that I've been helping myself to something.
reasoning: |-
  Okay, the user is working on a seminar paper about the wrong kind of reasons (WKR) and right kind of reasons (RKR) problem. They've outlined their views and are worried about inconsistencies. Let me break down each point they mentioned.

  First, they hold that reasons for attitudes (like belief, desire, admiration) are fundamental, and reasons for actions derive from these. They're a reasons-firster, which means they prioritize reasons over 'ought' and 'fitting'. That's a common stance in metaethics, aligning with theorists like Scanlon or Parfit. But combining this with fittingness as normative work might be tricky. Fittingness is often seen as a separate normative concept, so using it to define RKR while maintaining reasons-first could create tension. The user might not realize how these concepts interact, leading to a possible contradiction.

  Next, they mention that for an attitude to have RKR, it must bear on the fittingness of that attitude. That makes sense for beliefs and admiration—beliefs should fit the facts, admiration should be directed at genuinely admirable things. But when they talk about desire in point (4), they say that a demon threat gives a genuine reason to desire mud. Desires aren't typically evaluated by fittingness; they're often seen as based on value or good. If fittingness is tied to correctness conditions, desires might not have the same kind. The user might be conflating different normative standards for different attitudes without a clear criterion.

  The demon cases are where the tension becomes obvious. For belief (point 3), they say threats provide no reason to believe something false. That's standard in WKR literature. But for desire (point 4), they think the threat gives a reason to desire mud. That's inconsistent unless they can explain why desires differ. Their instinct is that wanting isn't answerable to the world like belief. But then in point (5), admiration is like belief—no reason to admire a bad painting under threat. So why the difference with desire? The user might be relying on intuition but lacking a principled distinction.

  The pill case complicates things. They think taking a pill to induce a belief (e.g., for success) is rational. But that seems to contradict their stance on belief not being subject to such incentives. If pragmatic reasons can rationally cause belief-formation, that challenges point (3). The user might not see that the pill scenario involves instrumental reasons for causing a belief, not reasons for the belief itself. Clarifying this distinction could resolve the tension.

  The core problem is differentiating attitudes. Belief and admiration have correctness conditions (truth, admirability), so only truth-related reasons are RKR. Desires might not have such conditions; instead, they respond to value or good. So demon threats provide reasons for desire because they relate to the good (avoiding pain), which is constitutive of desire's normativity. But the user uses fittingness for all attitudes, which might not fit desires. They need to either adjust their fittingness account for desires or accept a hybrid theory. 

  Also, the reasons-first framework might conflict with using fittingness as fundamental. If fittingness explains RKR, but reasons are basic, there's a circularity risk. The user needs to clarify if fittingness reduces to reasons or vice versa. 

  The cheapest fix is to argue that desires respond to different normative constraints. Maybe desires are about the good, so reasons promoting the agent's good are RKR. But that requires abandoning unified fittingness. Alternatively, they could deny that the demon provides a reason for the desire itself, only for causing it. But the user insists it's a reason for the desire. 

  The pill case: distinguishing between reasons for causing a belief (pragmatic) versus reasons for the belief content (epistemic). The user can maintain that only epistemic reasons are RKR for belief, so the pill provides a reason to cause belief, not to believe. That preserves (3). 

  The user's deeper need is to present a coherent view without obvious contradictions. They might be worried about criticism in the seminar. Highlighting the attitude taxonomy and separating constitutive norms could help. Emphasizing that belief and admiration are world-guided, while desires are goal-guided, might justify the asymmetry. But they must address the tension between reasons-first and fittingness as normative work. Maybe reframe fittingness as part of the reasons structure rather than foundational. 

  In summary, main tensions are: (A) reasons-first vs. fittingness doing normative work, (B) uniform fittingness account vs. different norms for beliefs/desires, (C) allowing pragmatic reasons for belief-formation (pill) while denying them for belief content (demon). Resolutions involve clarifying attitude-specific norms, distinguishing reasons for attitudes vs. causing them, and possibly adjusting the reasons-first stance to accommodate fittingness without circularity.
answer: |-
  Your view has significant tensions, but they're repairable with adjustments. Here's where the problems lie, their severity, and the cheapest fixes:

  ### Core Tensions
  1. **Between (2) and (4)**  
     - **Problem**: Your fittingness-based account of RKR (2) conflicts with granting a genuine reason to *desire* mud in the demon case (4).  
       - *Why?* Desiring mud doesn’t make the mud *desirable* (fittingness condition). The threat doesn’t bear on the mud’s properties—it’s irrelevant to whether mud *merits* desire. By (2), this should be a WKR (no reason to desire), yet you treat it as a genuine reason in (4).  
     - **Severity**: High. This directly contradicts your RKR criterion.

  2. **Between (1) and (2)**  
     - **Problem**: As a reasons-firster (1), you claim reasons are fundamental. But (2) makes *fittingness* the normative bedrock for RKR, implying fittingness is more basic.  
     - **Severity**: Moderate. This threatens internal consistency unless you clarify the relationship.

  3. **Between (3) and the Pill Case**  
     - **Problem**: Denying *any* reason to believe 2+2=5 (3) seems incompatible with taking a pill to induce a self-serving belief (e.g., believing you’ll succeed). If pragmatic benefits can rationally motivate belief-formation, doesn’t that suggest they provide *some* reason?  
     - **Severity**: Moderate. This challenges the purity of your belief norm.

  ---

  ### Diagnosis: The Root Issue  
  Your instinct about attitudes being "answerable to the world" is correct but underdeveloped. The tension arises because you’re implicitly treating **belief** and **admiration** as *correctness-apt* (they aim at truth/admirability), while treating **desire** as *teleological* (it aims at satisfaction/good).  

  - **Belief/Admiration**: Their constitutive aim is to *fit the world* (truth for belief, genuine merit for admiration). Only considerations bearing on this aim are RKR.  
  - **Desire**: Its constitutive aim is to *guide us toward the good*. Avoiding torture *is* a genuine good, so the demon’s threat *does* bear on desire’s aim.  

  **Result**: You’re using distinct normative standards for different attitudes but haven’t explicitly justified this asymmetry.

  ---

  ### Cheapest Fixes (Minimal Revisions)  
  #### Option 1: **Refine Fittingness for Desires**  
     - Claim that for desires, "fittingness" is about *promoting the agent’s good*. The demon’s threat bears on this, making it RKR.  
     - **Pros**: Retains (2), (4), and (5). Solves the desire/belief asymmetry.  
     - **Cons**: Stretches "fittingness" beyond its typical use (which usually tracks properties of the object, not consequences). Weakens the unity of your account.  

  #### Option 2: **Deny Genuine Reason for Desire in (4)**  
     - Argue the demon only gives a reason to *cause* the desire (e.g., via pill), not to desire *for its own sake*.  
     - **Pros**: Preserves a unified fittingness account (2). Aligns desire with belief/admiration.  
     - **Cons**: Contradicts your intuition about (4). May feel ad hoc for desires.  

  #### Option 3: **Adopt Attitude-Specific Norms**  
     - Explicitly state: RKR are determined by the *constitutive standard* of each attitude.  
       - Belief: Truth → Only evidence is RKR.  
       - Admiration: Merit → Only object’s properties are RKR.  
       - Desire: Good → Anything promoting the agent’s good is RKR.  
     - **Pros**: Justifies (3)-(5), resolves tension between (2)/(4), and handles the pill case cleanly.  
     - **Cons**: Abandons a *unified* account of RKR (a cost for elegance).  

  ---

  ### Handling the Pill Case  
  - **Solution**: Distinguish **reasons for φ-ing** (the attitude) from **reasons to bring about φ-ing**.  
    - The pill gives you a reason to *cause yourself to believe* you’ll succeed (a pragmatic reason for action).  
    - It does *not* give you a reason to *believe* you’ll succeed (no epistemic reason).  
  - This preserves (3): The demon gives no reason to *believe* 2+2=5, only a reason to *cause that belief*.  

  ---

  ### Recommended Path  
  1. **Adopt Option 3 (attitude-specific norms)**. This respects your intuitions while providing a principled basis for the demon cases.  
  2. **Clarify (1)**: Frame reasons as basic, but let the *content* of reasons be determined by each attitude’s constitutive standard.  
     - *Example*: "Reasons are basic, but what counts as a reason for an attitude depends on what that attitude *is* (e.g., belief aims at truth)."  
  3. **Use the pill case** to highlight the action/attitude distinction:  
     - Pragmatic reasons justify *taking steps to induce beliefs* but never *the beliefs themselves*.  

  This makes your view coherent, defensible, and consistent with standard treatments of belief (evidentialism) and desire (instrumentalism). It also explains why admiration mirrors belief: both are "object-oriented" attitudes, while desire is "subject-oriented."

  **Key Seminar Prep**: Preemptively address why desire is treated differently. Cite Schroeder’s (*Slaves of the Passions*) view that desires respond to reasons *via* the good, or Scanlon’s (*What We Owe*) distinction between object-given/state-given reasons.
