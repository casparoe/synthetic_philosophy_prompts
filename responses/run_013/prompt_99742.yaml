prompt: |-
  I run a small algorithmic-accountability unit inside a state human-services agency. Several times a year we are asked to sign off — or to refuse to sign off — on predictive models that allocate scarce public resources: which families are offered a preventive-services slot, which applicants are routed into a job-training program, which blocks are scheduled for a lead-abatement crew. The models arrive already built, with an accuracy figure attached and a vendor's assurance that the tool is fair. The decision is ours.

  The difficulty is the impossibility results. A model that is calibrated within groups, that is balanced across groups in its average scores at a given risk level, and that has equal error rates across groups cannot in general have all three at once unless the base rates are equal or the model is perfect, and we can neither equalize base rates nor build a perfect model. So the parity properties are a menu, and every choice off that menu is a choice about which group bears which kind of error. The vendor's assurance is therefore not evidence of anything; it is a choice of criterion dressed up as a property of the tool.

  Write me a decision procedure my analysts can actually run on a model-and-use-case package. It should take the package as input and produce a written determination that names, explicitly, which parity property we are treating as binding here, which we are treating as a target we will trade against, which we are knowingly sacrificing, and why. It has to force us to specify the real costs of false positives and false negatives for the particular decision at hand, and to say what we do when no defensible cost specification exists — because none of the standard parity criteria look at those costs, and a model that looks acceptable on any of them can still be the wrong thing to deploy. It has to cover the case where satisfying a parity property would require using the protected attribute, or a close proxy for it, at decision time, and the case where the relevant attribute is contested, self-reported, or simply unmeasured in our data. It has to make us state what label the model is predicting and why that label is the right object of concern, since a model can be impeccable with respect to a proxy that has nothing to do with the harm we are trying to prevent. And it has to mark, at each step, whether the step is a technical computation, a judgment call in technical clothing, or an outright value decision that must be escalated, naming who signs off.

  Then run the procedure on two cases: a tool the agency badly wants and that will pass every check we can run, and a tool whose honest cost specification points toward refusing deployment altogether. Say plainly what the procedure cannot settle, where it will misfire, and where it will produce a defensible answer that nobody in the room will be happy to hear. We have three analysts, no lawyers on staff, about two weeks per review, and the final signature is mine.
reasoning: |-
  We are designing a decision procedure for the algorithmic-accountability unit. The procedure must address several challenges: the impossibility of satisfying all fairness criteria simultaneously, the need to specify costs of errors, handling of protected attributes, and the choice of the prediction target. The procedure will be structured as a series of steps, each marked as a technical computation (T), a judgment call in technical clothing (J), or a value decision that must be escalated (V). The final signature is the unit head's.

  ### Decision Procedure Outline

  1. **Step 0: Preliminary Review**  
     - **Input**: Model-and-use-case package (including model, documentation, data dictionary, vendor's report, and description of the decision context).
     - **Actions**: 
       - Verify completeness of the package (T).
       - Identify the protected attributes (as defined by law or agency policy) and note if they are used in the model or if proxies are present (T/J: if the attribute is contested or self-reported, it becomes J).
       - Document the target variable (label) and the rationale for its use (J: because we must judge if it aligns with the harm we are trying to prevent).
     - **Output**: A report of completeness, identified protected attributes and proxies, and initial assessment of the target variable.

  2. **Step 1: Define the Decision Context and Error Costs**  
     - **Actions**:
       - Describe the decision being automated or assisted by the model. What resource is being allocated? What is the consequence of a false positive (FP) and a false negative (FN) in this specific context? (V: because assigning costs involves value judgments about the impact on individuals and society; must be escalated to the unit head for sign-off).
       - Quantify or qualitatively describe the relative cost of FP vs FN. (Example: In lead abatement, a FN might mean a child is poisoned, while a FP might mean an unnecessary inspection. The cost of FN is much higher.) (J: if quantification is attempted; V if it requires value trade-offs that are not clearly defined by policy).
       - If no defensible cost specification exists (e.g., incommensurable harms), document that and proceed by using the standard parity criteria as a starting point but note the limitation (V: must be escalated).
     - **Output**: A statement of FP and FN costs, including a ratio if possible, and a note on whether this is based on policy, expert judgment, or is undetermined.

  3. **Step 2: Fairness Criteria Selection**  
     - **Background**: We know from impossibility results that we must choose which fairness criteria to prioritize. The criteria we consider are:
       - *Calibration*: Within each group, the predicted risk matches the observed risk.
       - *Balance*: The average predicted score is the same across groups for individuals who have the same true risk.
       - *Equal Error Rates*: Equal FPR and/or FNR across groups.
     - **Actions**:
       - Compute base rates for the target variable across protected groups (T).
       - Check if base rates are equal (approximately) (T). If not, note that satisfying all three criteria is impossible.
       - For each criterion (calibration, balance, error rates), compute the current model's performance across groups (T).
       - **Select which criterion to treat as binding, which to trade, and which to sacrifice**:
          - The choice must be justified by the error costs from Step 1 (e.g., if FN is very costly, then equal FNR might be binding) (J/V: because it involves trade-offs that affect groups differently; if the choice is not dictated by policy, it becomes V and must be escalated).
          - If the cost specification is unavailable or unclear, default to a criterion that minimizes the worst-case harm to any group, but document the arbitrariness (V).
       - Document the vendor's claim about fairness and which criterion they chose, and note if that aligns with our error cost analysis.
     - **Output**: A table of the model's performance on each fairness criterion by group, and a statement of which criterion is binding, which is a target (we try to achieve but may trade off), and which is sacrificed, with justifications.

  4. **Step 3: Handling Protected Attributes**  
     - **Actions**:
       - Determine if the model uses the protected attribute or a close proxy (T: by examining feature importances or by the vendor's disclosure). 
       - If the model uses a protected attribute or proxy, assess whether this is necessary to achieve the chosen binding fairness criterion (J: because without it, we might not be able to enforce, say, equal FNR). 
       - If using the protected attribute is necessary and legally permissible, document the legal basis (if known) and the necessity (J). If not permissible, then the model must be adjusted (T: retrain without the attribute or with a fair masking technique) and reevaluated on fairness criteria (loop back to Step 2) OR we must reconsider the binding criterion (V: because it may require a policy exception).
       - If the protected attribute is unmeasured, self-reported, or contested, document the limitations and how they affect the fairness assessment (J: because we must rely on proxies and that introduces uncertainty).
     - **Output**: A report on the use of protected attributes, the necessity and permissibility, and any limitations due to data issues.

  5. **Step 4: Assessment of Target Variable**  
     - **Actions**:
       - Examine the target variable: what is it? How was it constructed? (T)
       - Assess whether this target variable is a valid proxy for the harm we are trying to prevent (J: because we must judge the alignment between the target and the real-world outcome of concern). 
       - If the target variable is misaligned (e.g., predicting "job training completion" when the harm is "long-term unemployment"), then the model may be optimizing the wrong thing (V: because we must decide if the model is fit for purpose; escalated to unit head).
     - **Output**: A statement on the validity of the target variable and whether it aligns with the intended harm prevention.

  6. **Step 5: Overall Assessment and Determination**  
     - **Actions**:
       - Summarize the findings from Steps 1-4.
       - If the model satisfies the binding fairness criterion, and the target variable is valid, and the error costs are acceptable (or as acceptable as we can make them), then the model may be approved. Otherwise, it may be rejected or conditionally approved with requirements (e.g., monitoring).
       - Explicitly state: 
          - The binding fairness criterion and why.
          - The criterion we are trading (and how we are trading it, e.g., by allowing some imbalance to achieve lower FNR for a group).
          - The criterion we are sacrificing and why.
          - The real costs of FP and FN and how they informed the choice.
          - How protected attributes were handled.
          - The assessment of the target variable.
       - Note any unresolved issues and the level of uncertainty.
     - **Output**: A written determination (approved, rejected, approved with conditions) with the required explicit statements.

  ### Marking the Steps
  - **Step 0**: T (completeness), J (protected attribute identification if contested), J (target variable rationale).
  - **Step 1**: V (error cost specification must be escalated to unit head).
  - **Step 2**: T (computing base rates and fairness metrics), V (selection of binding criterion must be escalated because it is a value decision).
  - **Step 3**: T (detecting protected attribute use), J (assessing necessity and permissibility), J (handling unmeasured attributes).
  - **Step 4**: T (examining target variable construction), J (assessing validity as a proxy), V (if misaligned, then decision to reject must be escalated).
  - **Step 5**: J (synthesis of findings), V (final determination by unit head).

  ### Running the Procedure on Two Cases

  #### Case 1: A Tool That Passes Every Check
  **Context**: A model that predicts which families are at highest risk of child maltreatment for offering preventive services. The agency badly wants this tool. It has high accuracy and the vendor claims it is fair by multiple criteria.

  - **Step 0**: 
    - Protected attribute: race (measured in the data, but not used in the model). Target: substantiated maltreatment within 18 months. Rationale: aligns with harm (child maltreatment).
  - **Step 1**:
    - Error costs: 
      - FN: a child might be maltreated without intervention -> high cost (life-altering harm).
      - FP: a family might be offered services they don't need -> moderate cost (resource waste and family burden).
    - Relative cost: FN cost >> FP cost. We set the cost ratio as 10:1 (FN:FP). (V: unit head signs off on this ratio.)
  - **Step 2**:
    - Base rates: unequal (higher in some racial groups). 
    - Fairness metrics: 
      - Calibration: holds within groups.
      - Balance: does not hold (due to base rate differences).
      - Error rates: FNR is equal across groups, FPR is not (because base rates differ).
    - Binding criterion: equal FNR (because FN is very costly). 
    - Trading: we want calibration but it's already satisfied. 
    - Sacrificing: balance (because we cannot have it without equal base rates or perfect prediction, and we are willing to accept higher FPR in groups with higher base rates to achieve equal FNR). (V: unit head signs off on this choice because it prioritizes minimizing the worst harm (unprevented maltreatment) equally across groups.)
  - **Step 3**: 
    - Protected attribute not used. Proxies? Some features are correlated with race, but not extremely. We accept. (J)
  - **Step 4**: 
    - Target variable: substantiated maltreatment. This is a reasonable proxy for harm, though imperfect (because not all maltreatment is substantiated). (J: we note the limitation but accept.)
  - **Step 5**: 
    - Determination: Approve. 
    - Why? The binding criterion (equal FNR) is met, which aligns with the high cost of FN. The target variable is acceptable. We sacrifice balance, which is less critical in this context because the resource allocation is about preventing severe harm and we are willing to over-offer to some groups to achieve equal protection.

  #### Case 2: A Tool That Points Toward Refusal
  **Context**: A model that routes applicants into a job-training program by predicting who will complete the program. The vendor claims the model is fair because it has equal FPR across racial groups.

  - **Step 0**:
    - Protected attribute: race (measured and used in the model). Target: program completion (yes/no).
  - **Step 1**:
    - Error costs:
      - FP: an applicant is routed into the program but does not complete -> cost: wasted slot that could have gone to someone else, and the applicant's time is wasted.
      - FN: an applicant is not routed into the program but would have completed -> cost: the applicant misses an opportunity, and society loses potential employment gains.
    - However, the real harm we care about is long-term unemployment, not program completion. The program is intended to reduce unemployment. We have no data on whether program completion leads to employment. (V: we cannot specify the costs because the target variable may not align with the harm. We note this and proceed to Step 4 for target assessment.)
  - **Step 4** (moved early due to Step 1 issue):
    - Target variable: program completion. But the harm is long-term unemployment. We find that program completion is a poor proxy because many who complete do not get jobs, and some who don't complete might get jobs. (V: unit head judges that the target is misaligned. This is a critical flaw.)
  - **Step 2** (if we proceeded anyway):
    - Base rates: unequal (completion rates differ by race).
    - Fairness metrics: 
      - The model has equal FPR (as claimed) but not equal FNR. 
    - Binding criterion? Without knowing error costs, we might default to equal FPR. But note: 
      - Equal FPR might not be the right choice because FNs (denying a slot to someone who would complete) might be more costly in terms of lost opportunity. 
    - We cannot choose a binding criterion without error costs, and we already have a problem with the target variable.
  - **Step 3**: 
    - The model uses race. Is it necessary? The vendor says it is to achieve equal FPR. But is that the right goal? (V: without knowing the goal, we can't judge. And using race is legally risky.)
  - **Step 5**:
    - Determination: Refuse deployment. 
    - Why? The target variable (program completion) is not a valid proxy for the harm (long-term unemployment). Even if the model were fair by some criterion, it is not addressing the right problem. Additionally, the use of race in the model is concerning and the fairness criterion chosen by the vendor (equal FPR) may not be appropriate without knowing the relative costs of errors.

  ### What the Procedure Cannot Settle
  - **Value decisions**: The procedure forces explicit value choices (like the cost ratio of FP to FN) but cannot make them. These must be escalated to the unit head or higher, and if there is no policy, then to policymakers.
  - **Uncertainty in proxies**: When the protected attribute is unmeasured or the target is a weak proxy, the procedure can only note the uncertainty; it cannot resolve it.
  - **Legal permissibility**: The unit has no lawyers, so when a model uses a protected attribute, we can note the legal risk but not definitively rule on it.
  - **When no criterion is acceptable**: If the cost specification and fairness criteria are in unresolvable conflict (e.g., satisfying the binding criterion would require unacceptable error rates), the procedure will lead to rejection, but it cannot create a new solution.

  ### Where It Misfires
  - If the error costs are misspecified (e.g., we underestimate the harm of FP), then the entire fairness choice might be misguided.
  - If the target variable is flawed but we accept it anyway (due to pressure or lack of alternatives), the procedure might approve a harmful model.

  ### Defensible but Unhappy Answers
  - In Case 2, the procedure leads to rejection because the model is optimizing the wrong thing. The agency might be unhappy because they want to use the tool. But the answer is defensible: we cannot allocate scarce resources based on a flawed target.

  ### Final Note
  The procedure is designed to force transparency and explicit value choices. It will not make the hard choices easy, but it will make them visible. The unit head must be prepared to defend the choices and, when necessary, escalate to higher authorities or policymakers when the value decisions are beyond the unit's remit.
answer: |-
  Below is a decision procedure designed for your algorithmic-accountability unit. It addresses the core challenges you described: fairness trade-offs, error costs, protected attributes, target variable validity, and delineation of technical vs. value judgments. The procedure is structured as a checklist with explicit outputs, escalation points, and role assignments (analysts for technical/computational steps; you for value decisions). Each step is tagged as:  
  - **T**: Technical computation (performed by analysts).  
  - **J**: Judgment call in technical clothing (analysts propose, you approve).  
  - **V**: Value decision (escalated to you, the unit head, for signature).  

  ---

  ### **Decision Procedure: Model Review Protocol**  
  **Input**: Model-and-use-case package (vendor documentation, model code/data, target variable definition, protected attributes, accuracy/fairness reports).  
  **Output**: Signed determination report with:  
  - Binding/traded/sacrificed fairness criteria and justification.  
  - Explicit false positive (FP)/false negative (FN) cost specification.  
  - Assessment of protected attribute use and target variable validity.  
  - Approval, rejection, or conditional approval.  

  ---

  #### **Step 1: Define Target Variable and Harm Alignment**  
  **(J: Judgment call)**  
  - **Task**: State the model’s target variable (e.g., "risk of child maltreatment") and the real-world harm it aims to prevent (e.g., "child injury"). Assess alignment.  
  - **Escalation**: If target is a poor proxy (e.g., predicting "job training dropout" when harm is "long-term poverty"), escalate as **V**.  
  - **Output**: "Target: [variable]. Harm: [harm]. Alignment: [Strong/Weak]. If weak, [justification]."  

  #### **Step 2: Specify FP/FN Costs for Decision Context**  
  **(V: Value decision)**  
  - **Task**: Quantify FP/FN costs *for this specific use case*. Example:  
    - FP cost (e.g., unnecessary lead inspection): Resources wasted, resident anxiety.  
    - FN cost (e.g., child lead poisoning): Life-long disability, systemic inequity.  
  - **Rules**:  
    - If costs are incommensurable (e.g., dollars vs. lives), state: "No defensible cost ratio."  
    - If costs conflict with policy (e.g., favoring one group), escalate as **V**.  
  - **Output**: "FP cost: [description]. FN cost: [description]. Cost ratio (FP:FN): [e.g., 1:10] or 'Undefined'."  

  #### **Step 3: Audit Protected Attributes**  
  **(T + J: Technical + Judgment)**  
  - **Task**:  
    - **T**: Detect if protected attributes (e.g., race) or proxies (e.g., zip code) are used in the model.  
    - **J**: Assess if proxy is unavoidable (e.g., neighborhood data for lead exposure).  
  - **Rules**:  
    - If protected attribute is *used at decision time*, justify necessity (e.g., "Required for equal FNR").  
    - If attribute is unmeasured/contested (e.g., self-reported race), state: "Fairness claims are unverifiable."  
  - **Output**: "Protected attribute: [Present/Absent]. Proxy risk: [High/Low]. Necessity: [Justification]."  

  #### **Step 4: Evaluate Fairness Trade-offs**  
  **(T + V: Technical + Value decision)**  
  - **Task**:  
    - **T**: Compute base rates, group-wise error rates (FPR/FNR), calibration, and balance.  
    - **V**: Choose one fairness criterion as **binding**, one as **target** (optimize toward), and one as **sacrificed** based on FP/FN costs.  
  - **Rules**:  
    - **Binding**: Must hold (e.g., equal FNR if FN cost is catastrophic).  
    - **Target**: Optimize subject to constraints (e.g., calibration if resource efficiency critical).  
    - **Sacrificed**: Accept violations (e.g., balance if base rates differ).  
    - Justify using Step 2’s cost ratio. If costs undefined, default to minimizing worst-group harm.  
  - **Output**: Table:  

  | **Criterion**       | **Role**     | **Justification**                                      |  
  |---------------------|--------------|--------------------------------------------------------|  
  | Calibration         | Binding      | FN cost high; cannot miss at-risk families.            |  
  | Balance             | Sacrificed   | Base rates unequal; efficiency requires imbalance.     |  
  | Equal FPR           | Target       | FP cost moderate; reduce unnecessary interventions.    |  

  #### **Step 5: Make Determination**  
  **(V: Value decision)**  
  - **Task**: Approve, reject, or conditionally approve based on Steps 1–4.  
  - **Rules**:  
    - Reject if:  
      - Target variable misaligned with harm (Step 1).  
      - Binding criterion violated *and* no mitigation possible.  
      - Protected attribute use illegal or indefensible.  
    - Conditionally approve with monitoring (e.g., "Audit FNR quarterly").  
  - **Output**: "Determination: [Approved/Rejected]. Rationale: [Concise summary]."  

  ---

  ### **Running the Procedure: Two Cases**  
  **Context**: 3 analysts, 2 weeks/review, your final signature.  

  #### **Case 1: "Easy Approval" (Preventive Services Tool)**  
  - **Use case**: Allocates preventive services to families at risk of child maltreatment. Vendor claims 95% accuracy and "fairness."  
  - **Step 1 (J)**:  
    - Target: "Substantiated maltreatment." Harm: "Child injury/death." Alignment: Strong.  
  - **Step 2 (V)**:  
    - FP cost: Unnecessary service slot (resource waste). FN cost: Child harm (catastrophic).  
    - Cost ratio: FP:FN = 1:50 → **FN dominates**.  
  - **Step 3 (T+J)**:  
    - Protected attribute: Race not used, but poverty score (proxy) present. Necessity: Moderate (poverty correlates with risk).  
  - **Step 4 (T+V)**:  
    - Base rates: Higher in low-income groups → **balance impossible**.  
    - **Choice**: Binding = equal FNR (avoid catastrophic FN), Target = calibration, Sacrificed = balance.  
  - **Step 5 (V)**: Approve.  
    - **Why**: Model satisfies binding criterion (equal FNR), FN cost justifies sacrificing balance.  

  #### **Case 2: "Rejection" (Job-Training Routing Tool)**  
  - **Use case**: Routes applicants to job-training slots; predicts "program completion." Vendor claims "fair" due to equal FPR.  
  - **Step 1 (J)**:  
    - Target: "Program completion." Harm: "Long-term unemployment." Alignment: **Weak** (completion ≠ employment).  
  - **Step 2 (V)**:  
    - FP cost: Wasted training slot (moderate). FN cost: Missed opportunity (high).  
    - **Conflict**: Costs undefined—long-term unemployment harm ≠ completion. No defensible ratio.  
  - **Step 3 (T+J)**:  
    - Protected attribute: Race used directly. Necessity: Unclear (vendor: "ensures equal FPR").  
  - **Step 4 (T+V)**:  
    - Base rates unequal → all criteria incompatible.  
    - **Choice**: Binding = equal FNR (FN cost high), but vendor optimized for equal FPR. Violation.  
  - **Step 5 (V)**: Reject.  
    - **Why**: Target misaligned with harm, binding criterion (equal FNR) violated, and race use indefensible.  

  ---

  ### **Limitations and Failure Modes**  
  1. **What the procedure cannot settle**:  
     - **Legal compliance**: Without lawyers, it flags protected attribute risks but cannot adjudicate legality (e.g., disparate impact).  
     - **Unmeasurable variables**: If harm (e.g., discrimination) isn’t captured in data, fairness claims are incomplete.  
     - **Value conflicts**: When costs split stakeholders (e.g., policymakers vs. communities), the procedure forces explicit trade-offs but can’t resolve them.  

  2. **Where it misfires**:  
     - **Garbage-in, garbage-out**: Poor data (e.g., biased labels) makes technical checks (T) misleading.  
     - **Over-reliance on cost ratios**: If costs are arbitrary (e.g., "FN cost = 10×FP"), it codifies bias.  

  3. **Defensible but unpopular outcomes**:  
     - **Case 2 rejection**: Analysts might pressure to approve a high-demand tool; the procedure forces refusal due to target misalignment and fairness violations.  
     - **Sacrificing balance**: In resource allocation, admitting that efficiency requires tolerating imbalance (e.g., serving more high-risk groups) may anger equity advocates.  

  ---

  ### **Workflow Integration**  
  - **Timeline**: Steps 1–2 (3 days), Step 3 (4 days), Step 4 (5 days), Step 5 (2 days). Analysts parallelize T/J tasks; you review V steps.  
  - **Output template**: Standardized report with sections for each step, making trade-offs auditable.  
  - **Escalation**: V decisions require your signature; if beyond agency mandate (e.g., changing base rates), recommend policy review.  

  This procedure forces transparency in trade-offs, centers harm prevention, and demarcates technical work from value judgments. It won’t make decisions easy—but it will make them explicit, defensible, and focused on the stakes you defined.
