  The user has outlined seven requirements: (1) some omissions must count as genuine causes, (2) avoid overcounting causes, (3) address act/omission asymmetry, (4) handle non-human omissions, (5) resolve hard cases, (6) clarify if it's the same as action causation, and (7) specify what omissions are in causal explanations. I need to add any missing requirements and for each, explain the motivation and whether it's genuine or possibly a prejudice. I should also identify any tensions, especially between reality, non-profligacy, and norm-independence.

  Looking at the requirements: Requirement 1 is motivated by cases like the negligent nurse - we need to hold people accountable for clear failures. Requirement 2 comes from the problem that if every failure to prevent something makes you a cause, we'd all be causes of famines. Requirement 3 deals with why we treat actions differently from omissions morally - is this based in causation or elsewhere? Requirement 4 is important because causation by absence applies broadly, like missing rain causing crop failure. Requirement 5 covers tricky scenarios like preempted omissions or probabilistic harm. Requirement 6 asks if omission causation is fundamentally different from regular causation. Requirement 7 addresses the metaphysical puzzle of how non-events can be causes.

  I think two more requirements are needed: One for probabilistic causation, since some omissions only increase risk, and another for double prevention cases. I'll add those as 8 and 9.

  The main tension is between requirements 1 (some omissions are causes), 2 (not too many causes), and the need for causal facts to be objective (not dependent on norms). It's hard to satisfy all three. If I had to sacrifice one, I'd give up strict norm-independence because our causal attributions often involve normative elements in practice.

  For the scorecard, I'll compare difference-making, interventionist, norm-based, and pluralist theories against the requirements. Difference-making theories fail on profligacy, interventionist ones struggle with asymmetry and ontology, norm-based approaches have objectivity issues, and pluralist theories might not unify causation.

  Requirement 5 is probably the hardest for theories to satisfy because it includes so many varied edge cases. I'll organize everything clearly with the desiderata in prose and a table for the scorecard at the end.
answer: |-
  Below is the specification of desiderata for a theory of causation by omission, grounded in the cases and considerations you outlined. Each requirement is motivated by a concrete problem or intuition, assessed for legitimacy, and analyzed for tensions. A scorecard for major theoretical approaches follows.

  ### Desiderata for a Theory of Causation by Omission  
  *(Genuine Requirement [GR] / Camp-Specific Prejudice [P])*  

  1.  **Requirement: Count some omissions as genuine causes**  
      -   **Motivation:** Cases like the nurse who fails to hang the IV drip (causing patient harm) or the parent who doesn't feed their child (causing starvation). Intuition: These are not *merely* failures to provide a necessary condition; they are genuine causes of harm, warranting blame/liability.  
      -   **Assessment:** GR. Essential for aligning with legal/medical/moral practice. Without this, the theory fails its core purpose.  

  2.  **Requirement: Avoid profligacy (prevent absurd overcounting)**  
      -   **Motivation:** The "famine donor" problem: If every failure to prevent is causation, everyone who didn't donate to a famine relief fund is a cause of every starvation death. This violates common sense and practical attributions.  
      -   **Assessment:** GR. A theory that implies universal culpability for all preventable harms is practically useless and counterintuitive.  

  3.  **Requirement: Respect or explain the act/omission asymmetry**  
      -   **Motivation:** We often judge actively harming (e.g., pushing someone off a bridge) as morally/legally worse than allowing equivalent harm via omission (e.g., failing to throw a rope to someone drowning), even if outcomes are identical. The theory must either show how this asymmetry is rooted in causal structure itself (e.g., active causes are "more direct") or demonstrate that the asymmetry is non-causal (e.g., purely normative).  
      -   **Assessment:** GR. The asymmetry is a robust feature of attributions. Ignoring it renders the theory descriptively inadequate.  

  4.  **Requirement: Handle causation by absence generally**  
      -   **Motivation:** Non-human omissions: The missing guardrail *causes* the car to plunge; the *lack of rain* causes crop failure; the *absence of oxygen* causes suffocation. A theory restricted to human agency fails to capture the full scope of causal explanations involving absences.  
      -   **Assessment:** GR. Causation by absence is a pervasive feature of causal reasoning, not limited to human inaction.  

  5.  **Requirement: Resolve hard cases**  
      -   **Motivation:** Specific puzzles demanding consistent answers:  
          *   **Simultaneous Omissions (Two Lifeguards):** Both fail to swim out; the victim drowns. Is only one, both, or neither a cause? (Tests individuation & overdetermination).  
          *   **Preempted/Trumped Omissions:** Lifeguard A fails to swim out, but Lifeguard B *would* have failed too if A had acted. Did A's omission cause the drowning? (Tests counterfactual dependence vs. actual sequence).  
          *   **Omissions within Processes:** Builder omits the footing; months later, the house collapses in a storm. Is the omission a cause, or just a background condition? (Tests integration with positive causation).  
          *   **Withholding vs. Removing:** Does switching *off* a life-sustaining respirator (active) differ causally from never switching it *on* in the first place (omission) if the outcome (death) is identical?  
          *   **Probabilistic Omissions:** Failing to inspect a bridge only slightly raises the chance of collapse; it collapses. Was the omission a cause? (Tests sufficiency/chance-raising).  
      -   **Assessment:** GR. A theory must handle edge cases to be robust and avoid arbitrariness.  

  6.  **Requirement: Specify the relation to action causation**  
      -   **Motivation:** Is causation by omission the *same fundamental relation* (e.g., counterfactual dependence, physical process) as causation by action? Or is it a distinct, derivative, or even metaphorical relation? This impacts metaphysical unity and explanatory power.  
      -   **Assessment:** GR. The theory must clarify its ontological commitments regarding the causal relation itself.  

  7.  **Requirement: State the ontology (what omissions are)**  
      -   **Motivation:** Omissions aren't events (like actions or occurrences). They are absences, lacks, non-occurrences. How can something non-existent be part of a causal relation or explanation? The theory must explain what causal claims about omissions *refer to*.  
      -   **Assessment:** GR. This is the core metaphysical challenge any theory must address head-on.  

  8.  **Requirement: Handle probabilistic causation by omission** *(Added)*  
      -   **Motivation:** Cases where an omission only *raises the probability* of harm, and harm occurs (e.g., engineer fails to perform a low-reliability inspection; bridge collapses due to undetected flaw). The theory must account for causes that are not deterministic.  
      -   **Assessment:** GR. Many real-world causal attributions (especially in law/medicine) involve probabilistic links.  

  9.  **Requirement: Deal with double prevention by omission** *(Added)*  
      -   **Motivation:** Omission A prevents Intervention B, which would have prevented Harm C. (E.g., Security Guard fails to lock door (Omission A), allowing Thief to enter and disable alarm (preventing Intervention B), leading to theft (Harm C)). Is Omission A a cause of Harm C? Tests complex causal chains involving omissions.  
      -   **Assessment:** GR. Complex causal structures involving prevention are common and challenging.  

  ### Tensions and Trade-offs
  *   **Core Tension:** **1 (Reality)**, **2 (Non-Profligacy)**, and the demand for **Norm/Convention Independence** (often implicit in 6 & 7) conflict sharply. Satisfying 1 requires some omissions to be causes. Satisfying 2 requires limiting *which* omissions count. The obvious way to limit them is by appealing to norms (duties, expectations), conventions (salience), or interests (what we care about). Insisting on pure, interest-independent physical facts (like those governing action causation) makes satisfying both 1 and 2 extremely difficult.
  *   **Sacrifice:** **Strict Norm/Convention Independence** must be sacrificed. Causation by omission is inherently *contrastive* and *interest-relative*. What counts as "the cause" depends on what normal or expected course of events we are contrasting the omission *against* and what outcomes we deem relevant. This relativity is necessary to avoid profligacy (2) while allowing genuine causal attributions (1). The asymmetry (3) might also be partly normative. This doesn't make omission causation non-causal; it makes it a type of causation whose *individuation* depends on context.

  *   **Most Eliminative Requirement:** **5 (Hard Cases)**. Many theories handle simple omissions or absences reasonably well but stumble catastrophically on one or more hard cases (especially preemption, trumping, or the withholding/withdrawing distinction). Requirement **7 (Ontology)** also eliminates theories that cannot provide a coherent account of absences.

  ### Scorecard: How Theoretical Approaches Fare Against Desiderata
  | Requirement                   | Difference-Making / Counterfactual (Lewis-style) | Interventionist / Causal Graph (Pearl-style) | Norm/Convention Filtering (e.g., Sartorio, Schaffer) | Pluralist (e.g., Hall, Paul) |
  | :---------------------------- | :----------------------------------------------- | :------------------------------------------- | :--------------------------------------------------- | :--------------------------- |
  | **1. Count Some Omissions**   | ✓ (Trivially: omissions make a difference)       | ✓ (Interventions on omissions can change outcome) | ✓ (Filters pick out "relevant" omissions)          | ✓ (Omissions are causes in "difference-making" or "dependence" sense) |
  | **2. Avoid Profligacy**       | ✗ (Fails catastrophically - famine problem)      | ✗ (Without norms, graphs often include too many absences) | ✓ (Norms/conventions filter out irrelevant omissions) | ⚠ (Depends on which "flavor" of causation applies) |
  | **3. Act/Omission Asymmetry** | ✗ (No inherent asymmetry; depends on similarity metric) | ✗ (Graphs symmetric; asymmetry imported from norms) | ✓ (Asymmetry often built into norms/duties)        | ⚠ (May locate asymmetry outside causation proper) |
  | **4. General Absences**       | ✓ (Absences make a difference)                   | ✓ (Absences as variables in graphs)           | ✓ (Absences can be normatively relevant)           | ✓ (Applies to absences generally) |
  | **5. Hard Cases**             | ✗ (Fails preemption/trumping; struggles with withholding/withdrawing, probability) | ⚠ (Depends on graph construction; can handle some preemption, struggles with others, ontology unclear) | ⚠ (Norms handle many cases well; struggles with purely physical absences/preemption) | ⚠ (Varies by case & "flavor"; often best fit) |
  | **6. Relation to Action Causation** | ✓ (Same relation: counterfactual dependence)   | ✓ (Same relation: interventionist counterfactuals) | ⚠ (Same relation, but individuation relies on norms) | ✗ (Different relations: production vs dependence) |
  | **7. Ontology (Absences)**    | ✗ (Treated as events; metaphysically suspect)    | ⚠ (Variables represent absences pragmatically; no deep ontology) | ✗ (Often avoids ontology, focuses on explanation)    | ⚠ (Depends on type; often metaphysically lightweight "contrasts") |
  | **8. Probabilistic Omissions**| ⚠ (Can be modeled, but profligacy worsens)      | ✓ (Handled naturally via probabilistic graphs) | ⚠ (Norms may handle threshold issues)              | ⚠ (Probabilistic dependence is a causal flavor) |
  | **9. Double Prevention Omissions** | ✓ (Captured by counterfactual chains)          | ✓ (Captured via path blocking in graphs)      | ⚠ (Norms may struggle with complex chains)         | ⚠ (Handled by dependence flavor) |

  **Key:** ✓ = Satisfies reasonably well; ⚠ = Partially satisfies or depends on implementation; ✗ = Fails or struggles significantly.

  **Conclusion:** The tension between **1**, **2**, and norm-independence is fundamental. No theory satisfying strict physicalism/norm-independence likely succeeds at both **1** and **2**. **Norm/Convention Filtering** approaches handle **2** and **3** best but stumble on **7** and some hard cases. **Pluralist** approaches handle the variety of cases (**5**, **8**, **9**) well but fracture the causal relation (**6**) and struggle with unity. **Interventionism** provides a powerful framework but relies on pragmatic graph construction (leaning on norms) to avoid profligacy. **Difference-making** alone fails **2** decisively. A successful theory likely needs a structured account of relevant contrasts or defaults, incorporating normative elements to individuate omissions causally.
