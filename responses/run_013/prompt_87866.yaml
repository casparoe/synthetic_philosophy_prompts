prompt: |-
  I'm a science journalist, I write a column on the mind and I run a session every year at a summer school for science writers, and this year I want to do the psychiatric classification one without it being me talking at 25 people for 90 minutes about the DSM. Mixed room, a few psychiatrists, alot of generalists, nobody's read any philosophy of science, 90 minutes, one room, no laptops.

  The thing I want them to actually feel is this: when you invent a new category of person, the people in the category can shift to fit it, and then the category gets redrawn around the shifted people, so the classification ends up partly manufacturing the thing it claims to be describing. Ian Hacking calls it the looping effect -- the targets are moving because the investigation interacts with them. I want that to happen to them in the room in the space of an hour, not be a slide.

  So design me the activity. Rules, materials, a minute-by-minute timeline, and the exact words I say when I hand out the first sheet, because I'm bad at improvising that part.

  Constraints, in rough order of how much I care:

  The category has to be invented by the group from scratch in the first 15 minutes, and it has to be about something that visibly happens in the room during the session -- how people take the floor in a discussion, that kind of thing -- so we can watch it operate twice before we're done. Nobody should be able to say "oh, that's just ADHD with a new name."

  I want the whole turn of the loop, not just "labels change behaviour." So somewhere in the middle the group has to go back and revise the criteria they invented, and the ending should be the discovery that the revised criteria fit the people they've already become. If that reveal has to be engineered rather than emerge, fine, just tell me how.

  Tell me how to measure the shift rather than assert it. Quick self-ratings before and after, a peer-sort, one person counting who speaks in round two -- something I can put on the board as numbers.

  Ethics, since these are journalists and two of them will blog about it: nothing resembling a real diagnosis, especially nothing stigmatised, nobody walks out feeling sorted, easy opt-out, and the invented category has to be non-pejorative or the whole thing collapses into a bit.

  Then the debrief, mapping what just happened onto the parts of the idea, including the scaffolding Hacking says a category needs to survive -- institutions, a body of knowledge, experts -- because a 90-minute workshop obviously can't build any of that.

  And be straight with me about two things: what will predictably go wrong the first time and what I do when it does (I'd bet money someone announces the point in minute five), and what the activity can't show. I'm pretty sure it can't tell looping apart from plain suggestibility, and it can't do the decade-long version where the textbooks get rewritten. Tell me which parts I just have to say out loud myself.
reasoning: |-
  We are going to design a 90-minute workshop activity to demonstrate the "looping effect" in psychiatric classification, as described by Ian Hacking. The goal is to have the participants experience how creating a category can change behavior, which then leads to a revision of the category, and how the revised category then fits the new behavior.

  Key elements:
  - Invent a new category from scratch in the first 15 minutes, based on observable behavior in the room (e.g., how people take the floor in discussion).
  - The category must be non-pejorative and not resemble any real diagnosis.
  - The activity must show the entire loop: category creation -> behavioral shift -> category revision -> the revised category fitting the new behavior.
  - Measure the behavioral shift (e.g., self-ratings, peer-sort, counting).
  - Debrief to map the experience to the looping effect and discuss the scaffolding (institutions, knowledge, experts) that real categories have but the workshop cannot build.

  Constraints:
  - 90 minutes total, no laptops.
  - Mixed group: a few psychiatrists, many generalist journalists, no philosophy of science background.
  - Opt-out option must be clear and easy.

  Activity Design: "The Conversational Styles Workshop"

  We'll create a category about how people participate in group discussions. We'll call it "Engagement Style" to be neutral.

  Materials:
  - Index cards (one per participant)
  - Markers
  - Flip chart or whiteboard for recording
  - Timer

  Timeline:

  Part 1: Introduction and Category Creation (15 minutes)
  Part 2: First Round of Discussion and Self-Rating (15 minutes)
  Part 3: Measure and Record Initial Behavior (5 minutes)
  Part 4: Introduce the Category and Observe (20 minutes)
  Part 5: Revision of the Category (15 minutes)
  Part 6: Second Round of Discussion and Measurement (10 minutes)
  Part 7: Reveal and Debrief (10 minutes)

  Detailed Minute-by-Minute Plan:

  Part 1: Introduction and Category Creation (0-15 minutes)

  0:00 - 0:05 (5 min): Introduction
  - You: "Welcome! Today we're going to do an experiment together about how we classify human behavior. We're going to create a new category of behavior that we can observe right here in this room. The category will be about how people participate in group discussions. We'll call it 'Engagement Style'. This is a made-up category for this exercise only. It's not real, and it's not about any medical or psychological condition. We're doing this to see how classification systems can interact with the people they describe. Remember, you can opt out of any part at any time by saying 'pass'."

  0:05 - 0:15 (10 min): Brainstorming the Category
  - You: "Let's brainstorm together what different ways people might engage in a group discussion. I want you to think about observable behaviors. For example, how often someone speaks, how long they speak, whether they respond to others or start new topics, etc. We'll come up with 3-5 distinct styles. I'll write them on the board."
    - Facilitate a quick brainstorm. Aim for 3-5 styles. Examples:
      1. The Initiator: Often starts a new topic or asks the first question.
      2. The Elaborator: Builds on others' points with more detail.
      3. The Synthesizer: Tries to summarize or find common themes.
      4. The Questioner: Asks clarifying questions.
      5. The Listener: Speaks less, listens more.
    - You: "We need to define these by what we can see and hear, not by internal states. Also, let's make sure they are neutral and non-judgmental. We're not saying one is better than another."
    - Write the final styles on the board.

  Part 2: First Round of Discussion and Self-Rating (15-30 minutes)

  0:15 - 0:20 (5 min): Setup and Self-Rating
  - Hand out index cards and markers.
  - You: "Now, we're going to have a 10-minute discussion. The topic is: 'What makes a science story compelling?' But before we start, on your card, rate yourself on a scale of 1 to 5 for how much you think you fit each of these styles. 1 means not at all, 5 means very much. Just quick gut ratings. Don't overthink. Also, write your name on the card. Then we'll collect them."
    - Participants self-rate for each style. Collect the cards.

  0:20 - 0:30 (10 min): First Discussion Round
  - You: "Now, let's discuss the topic for 10 minutes. Remember, we're also observing how people engage. Go ahead."
    - You (as facilitator) stay mostly silent, but keep time. Take mental notes of who speaks and how, but don't interfere.

  Part 3: Measure and Record Initial Behavior (30-35 minutes)

  0:30 - 0:35 (5 min): Tally and Report
  - You: "While you were talking, I was counting how many times each person spoke. I also have your self-ratings. Let me share the counts and we'll see which styles were most common in this first round."
    - On the board, write the number of times each person spoke (from your notes). Also, calculate the average self-rating for each style (from the cards) and write it down. Don't assign individuals to styles yet.

  Part 4: Introduce the Category and Observe (35-55 minutes)

  0:35 - 0:40 (5 min): Assigning the Category
  - You: "Now, based on what we saw, I'm going to assign each of you to one of these styles as your primary style. Remember, this is just for the exercise. It's not a real assessment. We're doing this to see what happens when we use the category."
    - Assign each participant a style based on your observations of the first discussion. Try to assign the style that seemed most prominent for them. Write the assignment on a new index card for each person and hand it to them. If you're not sure, pick one. Also, allow opt-out: "If you don't want to be assigned, just say so and we'll skip you."

  0:40 - 0:55 (15 min): Second Discussion Round with Category in Mind
  - You: "Now, we'll have another 10-minute discussion on a new topic: 'What challenges do science journalists face today?' But this time, I want you to try to embody the style I assigned you. If you were assigned as an Initiator, try to initiate more. If you were assigned as a Listener, maybe hold back a bit. We're not forcing, just experimenting. Also, I want you to observe how others are engaging. We'll discuss after."
    - During the discussion, you count the number of times each person speaks again.

  Part 5: Revision of the Category (55-70 minutes)

  0:55 - 1:05 (10 min): Group Reflection and Category Revision
  - You: "That felt different, didn't it? Let's talk about what we noticed. Were the styles we defined adequate? Did they capture what happened? Or do we need to change them?"
    - Facilitate a discussion. Aim to revise the category. Common revisions might be:
      - Splitting a style (e.g., "Initiator" into "Topic Initiator" and "Question Initiator")
      - Merging styles
      - Adding a new style (e.g., "The Connector" who links two ideas)
      - Changing definitions
    - Write the revised styles on the board.

  1:05 - 1:10 (5 min): Self-Rating Again
  - Hand out new index cards.
  - You: "Now, rate yourself again on the revised styles for the second discussion. How much did you embody each one? Scale of 1-5. Also, note if your behavior changed because of the assignment."

  Part 6: Second Round Measurement and Comparison (70-75 minutes)

  1:10 - 1:15 (5 min): Tally and Compare
  - You: "I counted speaking turns again. Here are the numbers for round two. Also, I have your new self-ratings. Let's put them next to the first round."
    - On the board:
      - Round 1: Speaking counts per person, average self-ratings per style (from first set of cards).
      - Round 2: Speaking counts per person, average self-ratings per revised styles (from second set of cards).
    - Note: The speaking counts might show a shift (e.g., assigned Initiators spoke more, Listeners less). The self-ratings might also shift.

  Part 7: Reveal and Debrief (75-90 minutes)

  1:15 - 1:25 (10 min): The Reveal and Looping Effect Explanation
  - You: "Look at the data. In round one, we had a certain pattern. Then we assigned styles, and in round two, we see changes in behavior. Then we revised the categories. Now, if we look at the revised categories, they might fit the second round behavior even better than the original ones did. That's the looping effect! We created a category, you shifted your behavior to fit it, and then we redrew the category around the new behavior. The category ended up partly manufacturing what it described."

  1:25 - 1:30 (5 min): Debrief - Mapping to Real World
  - You: "In real life, psychiatric categories like those in the DSM are created by experts. When people are diagnosed, they might change their behavior, join support groups, take medication, etc. Then the experts revise the criteria in the next DSM. That's the looping effect. But note: in real life, there are institutions (hospitals, schools), a body of knowledge (research), and experts (doctors) that sustain the category. Our workshop couldn't build that, so the effect is temporary here. Also, real looping takes years, not 90 minutes."

  What can go wrong and how to handle it:

  1. Someone announces the point early: If someone says, "Oh, this is about how labels change behavior," say: "You're on the right track, but let's see how it plays out in practice. We're going to experience it step by step."

  2. The category creation takes too long: Set a strict timer. If they can't agree, you can propose a set of styles and let them vote.

  3. No one shifts behavior: This is unlikely, but if the second discussion looks the same, you can point out that the assignment might not have been strong enough. Then in the debrief, discuss why: "Maybe the category didn't feel real, or there wasn't enough incentive. In real life, categories come with social consequences."

  4. Someone feels uncomfortable: Remind them they can opt out at any time. If someone doesn't want a style assigned, skip them.

  What the activity can't show:
  - The long-term looping effect (decades of revision).
  - The role of institutions and power structures (we don't have a medical authority here).
  - The difference between looping and suggestibility: In this activity, the change is due to conscious role-playing, but in real life, it can be unconscious and societal. You'll have to explain that.

  Exact Words for Handing Out the First Sheet (at 0:15):

  "Okay, we've defined our Engagement Styles. Now, before we start our first discussion, I want you to take this index card and marker. On the card, quickly rate yourself on a scale of 1 to 5 for each style we have on the board. 1 means you don't see that style in yourself at all, 5 means it fits you very well. This is just a quick self-assessment. Also, write your name at the top. Then we'll collect them. Remember, this is just for the exercise, and it's not a real test. When you're done, pass the card to the center."

  This design meets the constraints and should create an engaging, experiential understanding of the looping effect.
answer: |-
  Below is a complete 90-minute workshop design centered on **non-verbal discussion styles** (to avoid stigmatization and ensure visible in-room behavior). The invented category is **"Response Signalling"**—focusing on how participants physically signal they want to speak. This is neutral, observable, and distinct from clinical concepts.

  ### **Materials Needed**
  - 30 index cards
  - 15 sticky notes
  - 2 markers
  - Whiteboard/flip chart
  - Timer
  - Printed handouts (two versions, scripts below)

  ### **Timeline & Script**
  **Total: 90 minutes**  
  *(Ethics note: Start by emphasizing voluntary participation and fictionality. Say: "This is a simulation. Nothing we do reflects real traits—we're exploring how labels interact with behavior.")*

  ---

  #### **PART 1: CREATE THE CATEGORY (0-15 min)**  
  *Goal: Invent a neutral category based on observable in-room behavior.*  
  **Script (0:00):**  
  > *"We’ll start by inventing a new category of behavior. Look around: when this group discusses things, how do people non-verbally signal they want to speak? Maybe leaning forward, raising a hand, or making eye contact? Let’s define 3-5 types of 'Response Signallers.' Be concrete: what do we literally see? No internal states—just movement, posture, or gesture. And remember: no judgment. We’re describing, not diagnosing."*  

  **Activity (5 min):**  
  - Brainstorm 3-5 "signalling styles" (e.g., "The Hand-Raiser," "The Lean-In," "The Eye-Locker"). Write them on the board.  
  - **Force neutrality:** If a suggestion sounds pejorative (e.g., "The Interrupter"), reframe it ("The Quick-Starter").  

  **Measurement Setup (3 min):**  
  - Assign 3 volunteers as "counters." Their task: Tally *total speaking turns* per person in upcoming discussions.  
  - **Script:** *"Counters, note who speaks—but not what they say. We’ll compare two rounds later."*  

  **Define Criteria (7 min):**  
  - Finalize 3 styles with clear observable cues (e.g., "Hand-Raiser: arm above elbow height for >3 seconds").  
  - **Script:** *"These are our prototypes. No one ‘is’ this type—they’re just patterns we might notice."*  

  ---

  #### **PART 2: BASELINE BEHAVIOR & SELF-RATING (15-30 min)**  
  *Goal: Measure behavior before labeling.*  
  **Script (15:00):**  
  > *"Before we apply these styles, let’s capture a baseline. First, on your index card, rate from 1-5 how much you think you naturally fit each style. 1 = rarely, 5 = often. Do it quickly—gut instinct! Then we’ll have a short discussion."*  

  **Activity:**  
  - **Self-rating (3 min):** Participants rate themselves. Collect cards.  
  - **Discussion 1 (10 min):** Debate a low-stakes topic (e.g., *"Should cities ban cars downtown?"*).  
  - **Counters** tally speaking turns.  

  **Record Data (2 min):**  
  - Post on board:  
    - *"Avg. self-rating per style"* (e.g., Hand-Raiser: 2.4)  
    - *"Total speaking turns"* (e.g., 38)  

  ---

  #### **PART 3: APPLY LABELS & OBSERVE SHIFT (30-50 min)**  
  *Goal: Assign labels and trigger behavioral adaptation.*  
  **Script (30:00):**  
  > *"Now, we’ll randomly assign each of you one style to ‘try on’ during the next discussion. This isn’t who you are—it’s just a role. If it feels uncomfortable, you can opt out or adjust it. Your job: consciously experiment with that signalling style."*  

  **Activity:**  
  - Randomly assign styles via sticky notes (e.g., 1/3 get "Hand-Raiser," 1/3 "Lean-In," etc.).  
  - **Discussion 2 (15 min):** New topic (e.g., *"Is AI making journalism better or worse?"*).  
  - **Counters** tally speaking turns again.  

  **Measure Shift (5 min):**  
  - Post second-round data:  
    - *New speaking turns* (e.g., 52—likely higher due to exaggerated signaling).  
    - Note shifts: *"Look—signalling increased. Why? Maybe people amplified their assigned style."*  

  ---

  #### **PART 4: REVISE THE CATEGORY (50-65 min)**  
  *Goal: Redefine the category based on new behavior.*  
  **Script (50:00):**  
  > *"Styles felt awkward, right? Some of you adapted, others mixed approaches. Now, let’s redefine our category. Look around: what new signalling behaviors emerged? Did our original styles still fit?"*  

  **Activity (10 min):**  
  - Group revises the styles (e.g., "Hand-Raiser" splits into "High-Hand" and "Half-Raise"; "The Nodder" is added).  
  - **Key:** Tie revisions to observed changes (e.g., *"People started nodding—let’s add that"*).  

  **Self-Rate Again (5 min):**  
  - Hand out new cards: *"Re-rate yourself on the revised styles—how much did you embody them in Round 2?"*  

  ---

  #### **PART 5: REVEAL THE LOOP (65-80 min)**  
  *Goal: Show the revised category fits the adapted behavior.*  
  **Script (65:00):**  
  > *"Let’s compare. Here are your Round 2 self-ratings using the NEW styles. Notice anything? [Post data]. The average ratings are higher now! Why? Because we changed the styles to match what you actually did after being labeled. The label changed you, then we changed the label to fit the new you."*  

  **Evidence:**  
  - Contrast data:  
    - Round 1 avg. self-rating (original styles): **2.4**  
    - Round 2 avg. self-rating (revised styles): **3.8**  
    - Speaking turns increased by **35%**.  
  - **Script:** *"The category ‘manufactured’ its own evidence by shifting your behavior."*  

  ---

  #### **PART 6: DEBRIEF: MAPPING TO REALITY (80-90 min)**  
  *Goal: Link the exercise to psychiatric classification.*  
  **Script (80:00):**  
  > *"What did we just experience?  
  > 1. We invented a category (‘Response Signallers’).  
  > 2. You adapted to it (conscious signaling).  
  > 3. We redrew the category around your new behavior.  
  > That’s the ‘looping effect.’ Now, psychiatry:  
  > - When we label depression, people may ‘perform’ it (e.g., withdrawing more), which gets codified in future DSM criteria.  
  > - But here’s the catch: our workshop lacked scaffolding. In real life, looping needs experts, institutions (hospitals, schools), and knowledge (studies, textbooks) to sustain it. We simulated the core loop—not the 20-year societal machinery."*  

  **Closing Note:**  
  > *"Labels aren’t ‘wrong,’ but they’re not inert. They interact with us. As journalists, ask: ‘How might this category be shaping the people it describes?’"*  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Someone announces the point early:**  
     - *If* a participant says, *"This is about labels changing behavior!"* at 5 min:  
       - Respond: *"You’re warm—but let’s see how deep the rabbit hole goes. Does the category change too? Stick with me."*  
     - **Why it works:** Validates them without spoiling the reveal.  

  2. **No behavioral shift in Round 2:**  
     - *Likely cause:* Random assignments feel arbitrary.  
     - **Fix:** Assign styles contradicting natural behavior (e.g., give a quiet person "The Hand-Raiser").  

  3. **Category creation stalls:**  
     - **Fix:** Offer pre-written neutral examples (e.g., "The Pause-Signaller—stops mid-sentence to invite others").  

  4. **Opt-outs:**  
     - Have 2-3 "observer" roles for those uncomfortable.  

  ### **What the Activity Can’t Show (Say This Aloud)**  
  - **"This isn’t suggestibility."** In real looping, identity and institutions reinforce change—not just role-play.  
  - **"We skipped time."** Real looping takes decades (e.g., DSM revisions). We compressed it.  
  - **"Power matters."** Psychiatric labels carry stigma/access to care; our exercise had neither.  

  ### **Why This Works**  
  - **Safe:** Focuses on mundane, non-clinical behavior.  
  - **Loop visible:** Creation → adaptation → revision → fit.  
  - **Data-driven:** Self-ratings + counters quantify shift.  
  - **Hacking’s scaffolding:** Explicitly addressed in debrief.  

  **Final Tip:** Run this with colleagues first. It’s a live wire—but when it clicks, the room *feels* the loop.
