prompt: |-
  I coordinate advance-care planning for a small community hospital, and the work has become personal: my father's aphasia after a stroke means that his words, the situation that frames them, and what he is trying to tell us frequently come apart, and I have watched staff and family fill the gap with whatever reading is most convenient. I want to give our volunteer visitors and bedside clinicians a reusable procedure for determining what a patient's utterance or advance directive actually means when the literal content, the framing context, and the intended message diverge. The procedure should be grounded in the frame/outer/inner-message distinction: the frame message tells the receiver how to take the outer message, the outer message is the explicit content, and the inner message is what the sender is trying to convey. Please write the procedure as a sequence of questions to ask in order, say what counts as a sufficient answer at each step, identify where the procedure must stop with a determination that the meaning cannot be recovered, and mark the points where the decision must be handed to a person -- the patient's surrogate, a clinician, or an ethics consultant -- because it turns on values or on unrecoverable intention rather than on evidence. It has to be usable by someone with no background in semiotics or philosophy of language, in under ten minutes at the bedside, and it must not pretend to more certainty than the situation allows. Our volunteers see about fifteen patients a day, and any interpretation that would change code status must be signed off by the charge nurse and me. Then run it on three cases: a patient who asks to go home while on a ventilator; a family that insists on doing everything although the patient's written directive refuses intubation; and a translated advance directive whose original phrasing may have carried a different force. Include at least one case where the procedure returns an answer the family will not like, and say explicitly what the procedure cannot do.
reasoning: |-
  We are creating a procedure for interpreting patient utterances or advance directives when there's a divergence between literal content, context, and intended meaning. The procedure uses the frame/outer/inner message distinction:

  - Frame message: How the receiver should interpret the outer message (e.g., as a joke, a command, a wish).
  - Outer message: The explicit, literal content.
  - Inner message: What the sender is actually trying to convey.

  The procedure is a sequence of questions. It must be usable by someone without a background in semiotics or philosophy of language, in under ten minutes. It should not overstate certainty.

  Steps:

  1. **Determine the Frame Message**: How should we interpret the utterance? (e.g., is it literal, metaphorical, a joke, a command, a plea?)
     - Ask: "What is the context in which this was said? How is the patient communicating this (tone, body language, etc.)? What is the patient's typical way of communicating (if known)?"
     - Sufficient answer: A description of the context and the patient's manner that suggests a possible frame (e.g., "He said it with a smile, so maybe he's joking," or "She was crying and pointing at the door, so it might be a desperate request").
     - If the frame cannot be determined (e.g., the context is ambiguous and the patient cannot clarify), then the procedure stops and hands off to a surrogate/clinician/ethics consultant because we cannot proceed without a frame.
     - Note: The frame must be consistent with the patient's known values and situation. If there's conflict about the frame, we must hand off.

  2. **Identify the Outer Message**: What are the exact words or the literal content?
     - Ask: "What exactly did the patient say or write? (or, for a directive, what is the exact wording?)"
     - Sufficient answer: A verbatim account (if possible) or a close approximation. For written directives, use the document.

  3. **Interpret the Inner Message**: What is the patient trying to convey, given the frame and the outer message?
     - Ask: "Given the context and the way it was said (frame), and the literal words (outer), what do you think the patient really means? Is there a consistent pattern in their past expressions? Does this align with known values or prior statements?"
     - Sufficient answer: A plausible interpretation that reconciles the frame and outer message with the patient's known values and circumstances. If the inner message is clear and consistent, we can proceed.
     - If the inner message is unclear (e.g., the outer message and frame are contradictory, or there's no known value to anchor it), then we must hand off to a surrogate/clinician/ethics consultant because it requires value judgments or more information.

  4. **Check Against Known Values and Directives**:
     - Ask: "Does this interpretation align with the patient's known values, prior expressed wishes, or existing advance directives? If there are multiple directives, which one is most recent and applicable?"
     - Sufficient answer: A clear alignment or a clear conflict. If there's a conflict, we must reconcile by determining which expression is more representative of the patient's current wishes (if possible) or by handing off to the surrogate/ethics for resolution.

  5. **Document and Verify**:
     - Ask: "Can we state the interpretation with a level of certainty that allows us to act? (If yes, document and proceed. If not, hand off.)"
     - Also: For any interpretation that would change code status, it must be signed off by the charge nurse and the coordinator (you).

  Points where we hand off to a person (surrogate, clinician, ethics consultant):
  - When the frame cannot be determined and without it we cannot proceed.
  - When the inner message cannot be inferred because of conflicting or missing information about the patient's values/intentions.
  - When the interpretation conflicts with a written directive and there's no clear resolution (e.g., the patient's current utterance contradicts a written directive without clear evidence of a change of mind).

  The procedure cannot:
  - Force a clear meaning when there is none.
  - Override a valid written advance directive without clear and convincing evidence of a change of mind (and even then, it must be documented and signed off).
  - Substitute the interpreter's values for the patient's.

  Now, let's run three cases:

  **Case 1: Patient asks to go home while on a ventilator.**

  - Frame: The patient is in an ICU on a ventilator, unable to speak but writing notes. The note says: "I want to go home." The patient looks distressed and points repeatedly at the door.
  - Outer: "I want to go home."
  - Inner: We must interpret the frame: the distress and the context of being critically ill on a ventilator. The outer message is a request to go home. The inner message might be: "I am suffering and I want this to end" (i.e., a wish to stop treatment) or "I want to be in a familiar, comfortable place" (which might not be feasible because of the ventilator).

  Procedure:
  1. Frame: The patient is distressed and in a critical condition. The frame is a plea for relief. (Sufficient: context of suffering and pointing at door.)
  2. Outer: Literal request to go home.
  3. Inner: Given the frame (plea for relief) and the outer (go home), the inner message might be a desire to escape the current suffering. But note: it could also be a literal request to be discharged, which is impossible on a ventilator. We must check against known values: Does the patient have an advance directive? Have they expressed views on being kept alive by machines?
     - If the patient has previously stated they do not want life support, then the inner message is likely a request to stop treatment and allow a natural death (which might include going home with hospice). 
     - If there's no prior directive, we must hand off to the surrogate and clinician to discuss goals of care and feasibility. Also, because changing code status is involved, we must get sign-off.

  Procedure outcome: 
  - If the patient has a directive refusing life support, we interpret the inner message as a request to stop treatment and transition to comfort care (which may include going home if feasible). 
  - If not, we hand off to the surrogate and clinician to determine the patient's values and feasibility. We cannot assume a wish to stop treatment without evidence.

  **Case 2: Family insists on doing everything although the patient's written directive refuses intubation.**

  - Frame: The family is speaking for an incapacitated patient. The patient has a written advance directive that clearly states no intubation. The family says, "We want everything done."
  - Outer: Family's statement: "Do everything."
  - Inner: The family might be conveying their own wishes (not the patient's), or they might believe the patient changed their mind, or they might not understand the directive.

  Procedure:
  1. Frame: The family is making a request in the role of surrogate. The frame is a demand for full treatment. But note: the patient has a written directive that contradicts this.
  2. Outer: "Do everything."
  3. Inner: We must determine if the family is acting according to the patient's wishes or their own. The written directive is clear. We check: is there any evidence the patient changed their mind? If not, the inner message of the patient (via the directive) is to refuse intubation. The family's statement does not override the directive without evidence of a change.

  But note: the procedure is about interpreting the patient's communication. Here, the patient's communication is the written directive. The family's statement is not the patient's. Therefore, we must prioritize the patient's written directive unless there is evidence it no longer represents their wishes.

  Procedure outcome:
  - The inner message from the patient is clear: no intubation. The family's statement is not the patient's message. We hand off to the ethics consultant and the charge nurse because the family is not following the directive and we need to resolve the conflict of values (the family's wishes vs. the patient's autonomy). The procedure stops because we cannot recover a new intention from the patient without evidence. The existing directive stands until overridden by a legal process or by evidence of a change.

  **Case 3: A translated advance directive whose original phrasing may have carried a different force.**

  - Frame: The advance directive was written in another language and translated. The family argues that the translation does not capture the nuance of the original.
  - Outer: The translated document says, "I don't want to be kept alive by machines."
  - Inner: We must determine the force of the original. Was it absolute? Did it use conditional language?

  Procedure:
  1. Frame: The document is a formal advance directive. The frame is a legal/medical instruction. But the family questions the translation.
  2. Outer: The translation we have.
  3. Inner: We need to check the original language. We must hand off to a professional medical interpreter to retranslate and to clarify the nuances. We cannot proceed without verifying the translation.

  Procedure outcome:
  - If the retranslation confirms the same meaning, then we use that. 
  - If the retranslation shows a different meaning (e.g., the original was more nuanced: "I don't want to be kept alive by machines if there is no hope of recovery"), then we update the directive accordingly.
  - If the nuance is still unclear, we hand off to the ethics consultant and the surrogate to interpret in light of the patient's values.

  In this case, the procedure must stop until we have a verified translation. We cannot interpret without knowing the outer message accurately.

  Finally, note the procedure's limitations:
  - It cannot resolve disputes without evidence.
  - It cannot override a clear written directive without clear and convincing evidence of a change of mind.
  - It does not replace legal or ethical consultation when needed.
answer: |-
  Below is a step-by-step procedure for interpreting patient utterances or advance directives when literal content, context, and intended message diverge. It uses a simplified **frame/outer/inner-message model** and is designed for volunteers or clinicians with no specialized training. The entire process should take **under 10 minutes** and emphasizes humility in uncertainty—never forcing clarity where none exists. 

  **Key Definitions for Users:**
  - **Frame Message**: How the patient wants you to interpret their words (e.g., as a command, plea, joke, or metaphor). Clues come from tone, body language, and context.
  - **Outer Message**: The literal words spoken/written (e.g., "I want to go home").
  - **Inner Message**: What the patient truly intends to convey (e.g., "I am suffering and want treatment stopped").

  **When to Stop and Hand Off:**  
  - If values, intent, or ethics are unrecoverable (marked ⚠️), involve the **surrogate (medical decision-maker), clinician, or ethics consultant**.  
  - **Code status changes** always require sign-off from the charge nurse and you (the coordinator).  
  - The procedure **must not proceed** if ambiguity cannot be resolved—acting on guesses risks harm.

  ---

  ### **Interpretation Procedure: 5-Step Checklist**  
  *Ask these questions in order. Document answers clearly. Stop early if stuck.*

  1. **Establish the Frame Message**  
     *Ask: "How is the patient communicating this? What do their tone, face, gestures, or context suggest about how they want us to take their words?"*  
     - **Sufficient Answer**: A clear descriptor of the frame (e.g., "desperate plea," "calm request," "confused rambling"). Use observable clues (e.g., "tearing up," "pointing at door").  
     - **⚠️ Hand-Off Point**: If frame is unreadable (e.g., flat affect, no context clues) or conflicts with known values (e.g., a joyful "let me die" from a patient who loves life). **Stop and involve the surrogate or clinician.** Frame drives everything—if unclear, intent is unrecoverable.  
     - **Procedure Limit**: Cannot invent a frame; only use evidence.

  2. **Identify the Outer Message**  
     *Ask: "What are the exact words spoken/written? Strip away assumptions—just the facts."*  
     - **Sufficient Answer**: Verbatim quote (e.g., "Patient wrote: 'No tubes'") or direct observation (e.g., "Nodded when asked about pain"). For documents, use the text as written.  
     - **⚠️ Hand-Off Point**: If outer message is inaccessible (e.g., aphasia with no clear gestures) or corrupted (e.g., poorly translated directive). **Stop and involve a professional interpreter, clinician, or ethics consultant.**  
     - **Procedure Limit**: Cannot "fix" unclear words; only record them.

  3. **Connect to Known Values**  
     *Ask: "What do we know about the patient's beliefs, past statements, or advance directives that could explain this?"*  
     - **Sufficient Answer**: Alignment or tension with documented values (e.g., "Directive says no ventilators, but he’s asking for one now"). Prioritize: (1) Most recent advance directive, (2) Consistent past oral statements, (3) General values (e.g., "valued independence").  
     - **⚠️ Hand-Off Point**: If outer/frame clash with known values (e.g., a devout patient suddenly demanding suicide) or no values exist. **Stop and involve surrogate or ethics consultant.** Values trump guesses.  
     - **Procedure Limit**: Cannot assume values; only use recorded evidence.

  4. **Infer the Inner Message**  
     *Ask: "Given the frame, outer message, and values, what is the patient most likely trying to say? Does it 'click'?"*  
     - **Sufficient Answer**: A coherent, values-aligned interpretation (e.g., "‘Go home’ on a ventilator likely means ‘stop treatment’"). If inconsistent, flag the conflict.  
     - **⚠️ Hand-Off Point**: If inner message is speculative (e.g., no values to explain a contradiction) or harmful if wrong (e.g., life-ending). **Stop and involve clinician or ethics consultant.**  
     - **Procedure Limit**: Cannot create certainty; only offer "best guess" if evidence supports it.

  5. **Reality-Check and Escalate**  
     *Ask: "Is this interpretation actionable? Does it conflict with medical reality or ethics?"*  
     - **Sufficient Answer**: A "yes/no" on feasibility (e.g., "Going home on a ventilator is impossible") and alignment with policy (e.g., "Directive refuses intubation—this overrides family").  
     - **⚠️ Hand-Off Point**: Always if **code status changes** (sign-off required). Or if:  
       - Feasibility issues (e.g., request is medically impossible).  
       - Conflict with directives (e.g., family overrides a valid document).  
       **Involve charge nurse (feasibility), surrogate/ethics (values), or you (code change).**  
     - **Procedure Limit**: Cannot force reality (e.g., make "go home" happen on a vent).

  ---

  ### **What the Procedure Cannot Do**  
  - **Guarantee accuracy**: It reduces guesses but can’t read minds.  
  - **Override valid advance directives**: Written documents trump interpretations without clear evidence of change.  
  - **Resolve family conflicts or medical impossibilities**: These always require escalation.  
  - **Handle legal/translation ambiguities**: These need experts.  
  - **Skip documentation**: Every step must be written for accountability.

  ---

  ### **Case Applications**  
  **Case 1: Ventilated Patient Says, "I want to go home."**  
  - **Step 1 (Frame)**: Agitated, tugging at tubes. Frame: *Desperate escape plea*. ✅ Sufficient (observable distress).  
  - **Step 2 (Outer)**: Literal: "I want to go home." ✅ Verbatim.  
  - **Step 3 (Values)**: Known: Directive refuses "heroic measures," values comfort. ✅ Aligns with inner message.  
  - **Step 4 (Inner)**: Likely means *"Stop treatment; I want peace."* ✅ Coherent with frame/values.  
  - **Step 5 (Reality)**: "Go home" on vent is impossible. Interpretation: *Transition to comfort care/hospice*. ⚠️ **Hand-off**: Charge nurse for feasibility, you for code-sign-off (DNR).  
  - **Outcome**: Proceeds to comfort care. Family unhappy? **Procedure can’t please everyone—it prioritizes patient evidence.**

  **Case 2: Family Demands "Everything" Despite Directive Refusing Intubation**  
  - **Step 1 (Frame)**: Family shouts, "Do everything!" Frame: *Insistent command*. ✅ Sufficient.  
  - **Step 2 (Outer)**: Literal: "Do everything." ✅ Verbatim.  
  - **Step 3 (Values)**: Patient’s directive: "No intubation." Family claims "he changed his mind"—but no proof. ❌ **Hand-off**: Inner message unrecoverable without evidence. Escalate to ethics consultant.  
  - **Step 4 (Inner)**: *Not reached*—ambiguous intent.  
  - **Step 5 (Reality)**: Directive is valid. Family demand conflicts. ⚠️ **Hand-off**: Ethics/surrogate to resolve. **No code change without your sign-off.**  
  - **Outcome**: Directive stands unless ethics/surrogate validates change. Procedure **cannot ignore written directives** for family pressure.

  **Case 3: Translated Directive—Original Phrasing May Differ**  
  - **Step 1 (Frame)**: Document labeled "Advance Directive." Frame: *Formal instruction*. ✅ Sufficient.  
  - **Step 2 (Outer)**: Translation: "No machines if I can’t eat." Family says original was softer: "Avoid machines." ❌ **Hand-off**: Outer message corrupted. Involve professional medical interpreter.  
  - **Step 3 (Values)**: Paused until translation verified.  
  - **Step 4 (Inner)**: *Not reached*.  
  - **Step 5 (Reality)**: After retranslation: Original meant *"No life support if no hope of recovery."* ✅ Actionable. If ambiguity remains: ⚠️ **Hand-off to ethics/surrogate**.  
  - **Outcome**: Clarity requires expert help. Procedure **cannot trust amateur translations**.

  ---

  **Final Note for Volunteers:**  
  Use this to *clarify*, not decide. When in doubt, stop and escalate. You’re not failing—you’re protecting the patient. For code changes, always loop in the charge nurse and me. Remember: "I don’t know" is better than a harmful guess.
