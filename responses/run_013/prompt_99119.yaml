prompt: |-
  I am a high school student who has been trying to understand superrationality, and I have tentatively adopted a specific version of it. Take the role of an expert in decision theory and the philosophy of rational choice, think carefully before answering, and treat me as someone who wants the strongest case against my view rather than reassurance. The version I hold is this: in a symmetric one-shot Prisoner's Dilemma, if two agents know that they are running the same decision algorithm, or at least share a prior that makes their algorithms highly correlated, then each is rationally required to cooperate, because the expected value of cooperating is calculated over the possible algorithms rather than over the possible actions of a causally independent other. What would count against this? What would have to be true for it to be false, which assumptions could fail, what does it predict that causal decision theory or plain evidential decision theory does not, and which observations, intuitions, or formal results should move me? I want the defeaters sorted by how decisive they would be, including cases where the correlation is only approximate, results about agents who can inspect each other's source code, intuitions about exploitation and asymmetric versions, and any way the view becomes unfalsifiable by adding qualifications or collapses into a rival. Say which of these a committed defender of the view would themselves concede as counting against them and which they would dismiss, and whether the view risks anything at all or has been insulated. Please answer as exactly five numbered items, each one or two sentences, with no introduction or conclusion, and in the final item state how confident you are in your overall assessment and which single point you are least sure of.
reasoning: |-
  Okay, the user is a high school student interested in superrationality, specifically in symmetric one-shot Prisoner's Dilemmas where agents know they're using the same decision algorithm. They want the strongest counterarguments against their view. I need to provide five concise, numbered points without intro or conclusion.

  First, I recall that superrationality suggests cooperation is rational when agents know their algorithms are correlated. But critics point out that in standard game theory, defection dominates regardless of beliefs because outcomes depend on the other's action, not just correlation. Even with high correlation, if there's any chance the other defects, defecting might still yield higher expected utility.

  Second, there's the issue of symmetry breaking. If agents can inspect each other's source code, they could both defect even if identical, since each knows the other will defect upon seeing cooperation. This creates a mutual defection loop, undermining cooperation. 

  Third, the view might become unfalsifiable. Defenders could adjust the degree of correlation or shared priors to explain any outcome, which makes it hard to test. This risks being non-predictive compared to causal decision theory.

  Fourth, asymmetric versions pose a problem. If one agent is superrational and the other isn't, the superrational one might cooperate against a defector, leading to exploitation. This clashes with the intuition that rational players shouldn't be exploited.

  Fifth, the view conflates decision and prediction. Agents need to decide their action, not just predict the other's. Causal decision theory separates these, while superrationality might blur them, leading to incoherence in cases where actions aren't perfectly linked.

  For the final point, I'm fairly confident overall but least sure about the source code inspection argument because real-world agents can't perfectly inspect code, and high correlation might still lead to cooperation despite theoretical loopholes.
answer: |-
  1. **Causal Dominance Argument:** Even with high algorithmic correlation, defection remains causally dominant—your choice directly causes better outcomes regardless of the other’s action, and EDT/CDT show cooperating risks exploitation if correlation isn’t perfect (e.g., 99% correlation still makes defection superior when the other defects). Defenders concede this but argue perfect correlation negates dominance; opponents call this unrealistic.  
  2. **Source Code Loophole:** If agents can inspect each other’s identical source code, both face infinite regress ("I defect if you cooperate"), forcing mutual defection despite symmetry—this contradicts cooperation predictions. Defenders might dismiss this as pathological, but it reveals fragility in "same algorithm" assumptions.  
  3. **Unfalsifiability Risk:** The view becomes untestable if defenders arbitrarily adjust "sufficient correlation" thresholds to explain any observed behavior (e.g., defection is blamed on "insufficient" priors). This insulation from evidence weakens its predictive power versus CDT/EDT.  
  4. **Asymmetric Exploitation:** Against non-superrational agents (e.g., a defector), superrational cooperation yields the worst outcome (-5 utility), violating the intuition that rationality shouldn’t enable exploitation; CDT avoids this by defecting unconditionally. Defenders accept this cost but frame it as rare.  
  5. **Confidence & Uncertainty:** Overall, I am moderately confident this view is defensible only under idealized conditions (perfect symmetry, no uncertainty); least sure about source-code objections—high correlation might still imply cooperation if regress is resolved constructively.
