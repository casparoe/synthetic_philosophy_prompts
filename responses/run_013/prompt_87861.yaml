prompt: |-
  My old team lead has strong opinions about when something counts as a "cascade" and when it's just people doing the same thing for their own reasons, and I'm trying to work out what rule she's actually running. Her calls so far:

  - The line around the block at a new ramen place, where it turned out the first handful of people were the owner's friends and everyone after just saw a line: cascade.
  - Our whole org moving to the same CI tool, where the tool really does fit our stack and the savings are shared: not a cascade, just convergence.
  - A hiring committee where every member had read the candidate's code, but the later speakers visibly drifted toward whoever had spoken before them: cascade.
  - A run on a bank that was actually insolvent: not a cascade, because people were reacting to real payoffs and not to each other's beliefs.
  - A whole subfield adopting a statistical method because journals won't take papers without it, even though a few senior people privately think it's wrong: cascade.
  - Everyone using the same framework because that's what new hires already know: not a cascade, thats a network effect.

  Next week she has to rule on this one: my team is picking a cloud provider, and what will really decide it is that every other team in the company is already on provider X, so our tooling, our on-call and our promotion cases all depend on it. But our own benchmarks say provider Y is better for our workload, and two of us think that pretty strongly.

  What's she going to say, and what rule is she implicitly running? I want the candidate rules that fit all six earlier calls, what each one predicts about the cloud case, which you'd bet on and why, and what further case would seperate them. If you think her record is actually inconsistent, tell me which call you'd throw out.
