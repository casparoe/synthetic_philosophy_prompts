  The cost? We must accept that justification isn't "monotonic"—adding more evidence can sometimes *undermine* prior justification (here, for #1). It also makes rational belief context-sensitive, which feels messy but reflects how reasoning actually works. For the Lottery, my fix is cleaner: we just shouldn't believe individual tickets will lose, only that it's highly probable. No contradiction. 

