prompt: |-
  I'm in a reading group on formal epistemology and two of my friends have been going at each other for weeks over Aumann's agreement theorem. One of them, call her the Aumannian, says the theorem shows that two agents who share a prior and whose posteriors become common knowledge simply cannot rationally disagree, so any persistent disagreement among people who know each other's evidence and reasoning has to come from different priors, private information, or a failure of common knowledge. The other, call him the realist, says that's a mathematical curiosity that assumes away everything interesting: bounded rationality, heterogeneous priors, and the fact that you can never really know the other person is updating correctly. They keep talking past each other, and I want the document they should have produced after a good-faith adversarial collaboration: the joint statement they could both actually sign. Can you draft it for me?

  I'd like it to have a numbered list of claims both sides accept — about what the theorem says and doesn't say, what it assumes, and what it implies about persistent disagreement — then a table of the precise disagreements, with each side's position written in wording that side would accept as its own. I suspect one crux is whether common knowledge of rationality is a harmless idealization or a fatal one, and another is whether the theorem has any normative force for actual people who can't inspect each other's priors. For each crux, please give a concrete case or argument that both sides would agree bears on it, and write down what each side predicts about that case in advance. If part of their dispute is merely verbal, say which part and why.

  One more thing: we came up with a new case neither of them has seen. Two agents, A and B, share a prior and both know each other's likelihoods, but A has a private reason to distrust B's ability to conditionalize — she thinks B sometimes updates on the wrong proposition. They then learn each other's posteriors and learn that they disagree. Does Aumann's theorem apply here, or does the private distrust block the common-knowledge condition? What would each camp predict, and would either have to change its stated position? Please add a short section on that case at the end. Also, we're all philosophers, not economists, so keep the notation light and explain any formal idea in plain language.
reasoning: |-
  We are drafting a joint statement for two parties: the Aumannian and the realist. The goal is to produce a document that both can sign, which includes:
  1. A numbered list of claims both sides accept.
  2. A table of precise disagreements, with each side's position in wording they would accept.
  3. For each crux (disagreement), a concrete case or argument that both sides would agree bears on it, and what each side predicts about that case in advance.
  4. If part of the dispute is merely verbal, we identify it.
  5. A short section on the new case about distrust in updating.

  We begin by stating the common ground.

  **Common Ground: What Both Sides Accept**

  1. **Aumann's Agreement Theorem (AAT) Statement**: If two agents (i) share a common prior probability distribution over a set of states, (ii) their posteriors for a given event are common knowledge, and (iii) they are Bayesian rational (i.e., they update by conditionalizing on their information), then their posteriors must be equal.

  2. **Assumptions of AAT**: The theorem assumes:
     - Common prior (same initial probability distribution).
     - Common knowledge of posteriors (each knows the other's posterior, each knows that the other knows, and so on ad infinitum).
     - Bayesian rationality (each updates by conditionalizing on their private information).

  3. **What AAT Does Not Directly Address**:
     - The theorem does not address cases where agents have different priors.
     - It does not address situations where common knowledge of posteriors fails (e.g., due to communication barriers).
     - It does not address bounded rationality (e.g., computational limitations, memory constraints) or deviations from Bayesian updating.

  4. **Implications for Persistent Disagreement**:
     - If two agents share a common prior and are Bayesian rational, then any persistent disagreement about a proposition must be due to either:
       (a) Failure of common knowledge of posteriors (i.e., they don't know each other's opinions to an infinite degree), or
       (b) Private information (so that even after sharing posteriors, they haven't fully shared the evidence that led to them).
     - However, the theorem does not rule out that persistent disagreement can arise from other sources (like different priors or bounded rationality) when the assumptions are not met.

  5. **The Theorem is a Mathematical Truth**: Both sides agree that Aumann's theorem is a valid mathematical result given its assumptions.

  **Table of Disagreements**

  We now present the key disagreements. Each position is stated in the terms that the respective side would accept.

  | Crux Issue | Aumannian Position | Realist Position |
  |------------|---------------------|------------------|
  | **Common knowledge of rationality as an idealization** | "Common knowledge of Bayesian rationality is a necessary and harmless idealization for the purpose of the theorem. It allows us to isolate the effect of differing information and to show that, under these idealized conditions, agreement is inevitable. In real-world applications, we can approximate this condition by assuming that rational agents will update correctly." | "The assumption of common knowledge of Bayesian rationality is not harmless; it is a fatal flaw for applying the theorem to real-world disagreements. Actual agents are not perfectly rational, and they know that others are not. This breaks the theorem's applicability because the common knowledge condition cannot be achieved among boundedly rational agents." |
  | **Normative force of the theorem** | "Aumann's theorem has normative force: it prescribes that rational agents who share a prior and have common knowledge of each other's posteriors should agree. Thus, when we observe persistent disagreement, we must attribute it to either a failure of common knowledge of posteriors, private information, or a violation of shared priors. The theorem provides a standard for rational disagreement." | "The theorem has little to no normative force for actual human beings because the assumptions (common prior, common knowledge of posteriors, and common knowledge of rationality) are practically unattainable. Moreover, the theorem does not tell us how to resolve disagreements; it only tells us that under idealized conditions, disagreement is impossible. Therefore, persistent disagreement in the real world is expected and does not necessarily indicate irrationality." |
  | **Role of heterogeneous priors** | "The theorem highlights that shared priors are essential for agreement. In practice, when we see persistent disagreement, it often stems from different priors. The theorem thus guides us to investigate prior formation and the possibility of converging on common priors through shared experiences." | "Heterogeneous priors are the norm, not the exception, and the theorem's requirement of a common prior is so restrictive that it makes the theorem irrelevant for most real-world disagreements. The focus on common priors ignores the fact that priors are shaped by diverse life experiences and are not easily changed." |

  **Cruxes with Concrete Cases and Predictions**

  We now take two cruxes and provide a concrete case that both sides agree is relevant. We then state what each side predicts about that case.

  **Crux 1: Is common knowledge of rationality a harmless idealization or a fatal one?**

  *Concrete Case:* Consider two expert climate scientists, Alice and Bob, who share the same prior about the probability of catastrophic global warming by 2100. They both have access to the same large body of evidence and have shared all their data and models. They also have a long history of working together and know each other to be extremely competent and rational. They announce their posteriors to each other and find they disagree. They then engage in a public dialogue where each explains their reasoning step by step, and they come to know each other's reasoning and posteriors completely (so that common knowledge of posteriors is achieved). However, they still disagree.

  - **Aumannian Prediction**: If common knowledge of posteriors is achieved and they share a prior and are both Bayesian rational, then they must eventually agree. If they don't, then one (or both) must not be updating correctly (i.e., they are not Bayesian rational) or they did not actually share a prior. The persistence of disagreement in this case would be evidence of a failure of rationality or a hidden difference in priors.

  - **Realist Prediction**: Even in this ideal setting, disagreement may persist because the common knowledge of rationality is not achievable in practice. The scientists may have different interpretations of the evidence, or one might have a hidden doubt about the other's ability to process the evidence. The realist expects that such disagreements are common and do not necessarily indicate irrationality.

  **Crux 2: Normative force of the theorem for actual people**

  *Concrete Case:* Two jurors, Jane and John, are deliberating a case. They started with the same prior (based on the same jury instructions) and have seen the same evidence. They announce their posteriors (probability of guilt) to each other and then engage in a discussion until they have common knowledge of their posteriors. However, they continue to disagree.

  - **Aumannian Prediction**: The theorem says they must agree if they are rational and share a prior. Therefore, the persistence of disagreement indicates that either they did not actually share a prior (despite initial appearances) or one (or both) is not updating rationally (e.g., they are influenced by cognitive biases). The normative force: they should re-examine their priors and updating.

  - **Realist Prediction**: The theorem does not apply because the jurors are not perfectly rational and they know it. They may have different life experiences that affect how they weigh the evidence, and they may not trust each other's reasoning. The realist would not be surprised by the disagreement and would not necessarily attribute it to irrationality.

  **Merely Verbal Disagreement?**

  Both sides agree that the theorem is mathematically true. The dispute is not about the theorem itself but about its interpretation and applicability. However, there is a potential verbal issue:

  - The term "rationality" might be used differently. The Aumannian uses it in the technical sense of Bayesian updating, while the realist might include a broader notion that accounts for cognitive limitations. But both sides are aware of this distinction, so it is not merely verbal. The core disagreement is about the relevance of the theorem to real-world disagreement.

  **New Case: Distrust in Updating**

  Case: Two agents, A and B, share a common prior and both know each other's likelihoods. However, A has a private reason to distrust B's ability to conditionalize — A believes that B sometimes updates on the wrong proposition. They then learn each other's posteriors and learn that they disagree.

  **Question 1: Does Aumann's theorem apply here?**

  - The theorem does not directly apply because one of the assumptions (common knowledge of rationality) is violated. Specifically, A does not believe that B updates correctly. Therefore, the common knowledge of Bayesian rationality is absent.

  **Question 2: What would each camp predict?**

  - **Aumannian**: The Aumannian would note that the theorem's assumptions are not met because of the lack of common knowledge of rationality. Therefore, the theorem does not force agreement. However, the Aumannian might still hold that if the agents are rational (in the Bayesian sense) and if they share a prior and have common knowledge of posteriors, then they must agree. But in this case, A's distrust may be justified or not. The Aumannian would say that if B is indeed updating correctly, then A's distrust is irrational and the disagreement would persist due to A's failure. If B is not updating correctly, then the disagreement is due to B's irrationality. So the Aumannian would attribute the disagreement to a failure of rationality.

  - **Realist**: The realist would argue that this case is exactly why the theorem is not applicable in practice. The distrust is a common feature of real-world interactions. The realist would predict that disagreement is likely to persist and that this is not necessarily irrational. The realist might also point out that A's distrust may be well-founded (if B does indeed update incorrectly) and that the theorem does not account for such second-order uncertainties.

  **Question 3: Would either camp have to change its stated position?**

  - Neither camp would change its core position. The Aumannian would see this as a case where the rationality assumption fails, thus the theorem does not apply. The realist would see it as confirming their view that the assumptions are too strict for real-world application.

  **Joint Statement Draft**

  We, the undersigned, agree on the following:

  1. Aumann's agreement theorem is a valid mathematical result: under the assumptions of a common prior, common knowledge of posteriors, and common knowledge of Bayesian rationality, the posteriors of two agents must be equal.

  2. The theorem does not apply when:
     - Agents have different priors.
     - Common knowledge of posteriors is not achieved.
     - Agents are not Bayesian rational or there is no common knowledge of rationality.

  3. Persistent disagreement in the real world can arise from multiple sources, including:
     - Heterogeneous priors
     - Private information
     - Failure of common knowledge (of posteriors or rationality)
     - Bounded rationality and deviations from Bayesian updating

  We disagree on the following:

  4. The Aumannian holds that the theorem's assumptions, while idealized, are a useful benchmark and that the theorem has normative force: it tells rational agents that they should agree under the stated conditions. Thus, when disagreement persists, it calls for an explanation in terms of a violation of one of the assumptions.

  5. The realist holds that the theorem's assumptions are so restrictive that they are practically unattainable, and thus the theorem has limited applicability and normative force for actual human disagreements. The realist emphasizes that persistent disagreement does not necessarily indicate irrationality.

  Regarding the new case with distrust:

  6. In the case where A distrusts B's ability to update correctly, we agree that the common knowledge of rationality is absent, so the theorem does not apply. The Aumannian would attribute the persistent disagreement to a failure of rationality (either A's unjustified distrust or B's actual updating error), while the realist would see it as an example of the theorem's inapplicability in realistic settings and would not necessarily attribute the disagreement to irrationality.

  Signed,

