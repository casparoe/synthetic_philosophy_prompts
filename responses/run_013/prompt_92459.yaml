answer: |-
  ## Opening Remarks: The Man Who Wrote His Future

  Good morning. Thank you all for being here. Today, we gather around a single, human story. It’s not hypothetical; it unfolded in our hospital just last year. And it asks us a question that sits at the heart of advance directives: Why should a choice made years ago bind the person who exists now?

  Picture a man in his early sixties. Several years before his diagnosis of early-onset Alzheimer’s, he sat down, fully aware, and wrote a directive. He was clear. He refused any future move to a residential care facility. He refused aggressive treatment for pneumonia. He wrote, powerfully, that he could not imagine a life where he didn’t recognize his own family. His words were emphatic, repeated, born of a deep fear of losing his very self. He was choosing, then, the kind of death he wanted over a life he felt would be unrecognizable.

  Now, picture the same man today. He has lived in a care home for fourteen months. Observers describe him as settled, often cheerful. He knows the staff, greets them by name. This spring, he developed pneumonia. And when he did, he asked – clearly enough to be understood – to be treated. To fight the infection. To live.

  Here is our tension, stark and undeniable.

  On one hand: The man who wrote the directive. He was competent. He thought deeply about his values, his identity, his fears. He made a plan based on what *he* understood a worthwhile life to be. To disregard his explicit, carefully considered wishes feels like a profound betrayal of that person, of his autonomy at a time when he possessed it fully. It asks: Doesn’t the person he *was* deserve our deepest respect? Doesn't his foresight demand our fidelity?

  On the other hand: The man in the home *now*. He is not the man he was, but he *is* undeniably *here*. He experiences contentment. He forms connections. He expresses a will – a desire for treatment, for life, in *this* moment. To override his current, clearly expressed request feels like ignoring the person standing before us. It asks: Are we valuing a past document over the present, breathing human being? Does his current experience of contentment mean nothing because it doesn’t match his past imagination?

  The organizers asked me to hold this open, and I will. We cannot resolve it neatly this morning. But crucially, we must also resist two powerful, yet ultimately reductive, ways of framing it.

  First: We cannot simply say the man who wrote the directive is the only "real" person, and the man in the home is merely a faded echo whose current feelings don’t count. That denies the reality and dignity of the person living with dementia *right now*. It risks treating him as already gone.

  Second: We cannot simply say the present contentment is the *only* thing that matters, making the past directive irrelevant. That dismisses the profound exercise of foresight, the values, and the fears that motivated a competent person’s careful planning. It risks undermining the very purpose of advance directives.

  So where does that leave us? What concrete thing can we carry into today’s sessions?

  It leaves us holding this essential recognition: **Identity in serious illness is not a fixed point, but a complex journey.** The man who wrote the directive and the man who asked for treatment are connected across time, yet distinct in their experiences. Our challenge – as clinicians, ethicists, lawyers, caregivers, and patients ourselves – is to grapple honestly with *both* realities: the binding power of a past self's deeply held wishes, *and* the moral weight of the present self’s experiences and expressions. We cannot erase either without cost.

  Today isn’t about finding one simple answer for this man. It’s about learning how to sit respectfully within this profound tension, how to weigh these competing moral claims with care, and how to navigate the space between the life he feared and the life he is actually living. How do we honor *both* the author of the directive and the man in the room? That’s the difficult, necessary work we begin together now. Thank you.

