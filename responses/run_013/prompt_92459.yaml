prompt: |-
  I'm an undergraduate in my third year, currently enrolled in a bioethics seminar, and my department has asked a few of us to give the opening remarks at a one-day interdisciplinary workshop it is co-hosting with our teaching hospital's clinical ethics service. The theme is advance directives — specifically the question of why, if at all, a directive written by someone while competent should bind the person she later becomes. The audience is deliberately mixed: perhaps a third are clinicians (geriatricians, palliative-care nurses, a couple of intensivists), a third are philosophy and law students and faculty who know the standard autonomy-versus-welfare debate inside out, and a third are family caregivers and members of the hospital's patient advisory council who have actually lived through this and will tune out the moment anyone starts speaking in jargon. I have been asked to deliver the five-minute opening remarks, and the organizers want them organized around a detail from a case our ethics service handled last year, which they've asked me to treat as the spine of the talk: a man in his early sixties with early-onset Alzheimer's had, several years before his diagnosis, executed a directive that refused in explicit and repeated terms any future move into a residential care facility and any aggressive treatment of pneumonia, and wrote that he could not imagine a life in which he did not recognize his own family. He has now lived for fourteen months in a care home, appears settled and often cheerful, greets the staff by name, and when he developed pneumonia in the spring asked — clearly enough to be understood — to be treated. The organizers want the remarks to hold this case open rather than resolve it, and they have asked me in particular to resist the framing that the earlier, competent man is the 'real' author of his life and the man in the home is a kind of fading copy of him, while also resisting the opposite framing that treats the present contentment as simply the last word. They want the tension between those two framings to be the engine of the whole talk, because the day's later sessions are designed to pull it apart from different directions.

  What makes this hard for me is that the room will read almost any move as a tell. If I lean toward honoring the directive, the clinicians will hear a philosopher who has never sat with a patient who is frightened of dying; if I lean toward the present man's request, the philosophers will hear someone who has quietly abandoned the whole point of advance planning. I also can't simply declare the case tragic and leave it there, because the organizers have explicitly said that a talk which only says 'it's complicated' will have failed, and they want at least one concrete thing the audience can carry into the afternoon. I would like you to write the remarks. They should be something I could actually deliver out loud, in roughly five minutes, to this specific mixed room — plain enough that the caregivers stay with me, precise enough that the philosophers don't roll their eyes, and structured so that the case is doing the argumentative work rather than serving as an illustration bolted on at the end. Please do not cite or name any books, articles, or authors, and do not put any quotations in the text; I want the ideas carried by how the talk is built, not by appeal to authorities. After the speech itself, add a brief structured summary in JSON with exactly these fields: "opening_move" (the first thing the remarks do to the audience, in one sentence), "central_tension" (the specific conflict the talk refuses to resolve), "position_avoided" (the framing the talk most deliberately declines to adopt, and why), "takeaway" (the one concrete thing the audience is left holding), and "audience_risk" (the single place in the remarks most likely to lose one of the three groups, with the group named). Keep the speech under about seven hundred words.
