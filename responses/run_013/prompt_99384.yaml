prompt: |-
  I'm in a jurisprudence reading group and we've spent the last few weeks on the Hart–Devlin back-and-forth about whether the criminal law is entitled to enforce a shared morality, and ever since I keep noticing a phrase that people throw around to end arguments, and I genuinely can't tell whether it's doing any work. It came up last week when my roommate and I were arguing about a ballot measure in our city that would criminalize something fairly victimless-ish (won't bore you with the details, it's a vice-type thing). His whole case was "you can't legislate morality" — and he used it twice in the same conversation to do two different jobs. Once it was "so the law would be illegitimate / shouldn't pass," and once it was "so the law won't actually work anyway, people will do it regardless." I have a nagging feeling the slogan can't really pull both of those, and maybe not even one, because it seems like every law is somebody's morality written down somewhere — but I can't put my finger on what's actually wrong.

  What I'd like from you is a menu, not a lecture on Mill. Lay out the distinct precise claims that one sentence could be making — is it a claim about efficacy (law can't change what people believe or want), a claim about jurisdiction (moral questions aren't the law's business, full stop), a claim about the concept of law (law and morality are separate kinds of thing), a claim about whose morality gets encoded and how, something else entirely? — and for each reading tell me whether it's a trivial platitude, substantive and defensible, or just false. Then say which of those readings would actually get my roommate to his two conclusions, and which one the people who say this usually mean. And I'd rather you be honest about your confidence than perform certainty: tell me which reading you'd stake the most on, where your reasoning is most likely to be wrong or to be smuggling in a contested view of what law is, and what argument or example would actually change your mind about the verdict you give.
reasoning: |-
  Okay, the user is in a jurisprudence reading group and has been discussing the Hart-Devlin debate on enforcing morality through criminal law. They're frustrated with the phrase "you can't legislate morality" being used ambiguously in arguments, especially by their roommate. The roommate used it in two ways: to argue that a law would be illegitimate and that it wouldn't work anyway. The user suspects the slogan can't support both claims and wants a breakdown of the possible interpretations without a lecture on Mill.

  First, I need to unpack the different meanings behind "you can't legislate morality." The user mentioned efficacy, jurisdiction, conceptual separation, and whose morality is encoded. I should list these distinctly. For each, I'll assess whether it's trivial, defensible, or false. Then, connect which interpretations support each of the roommate's conclusions and what people usually mean when they say this.

  Starting with the distinct claims:

  1. **Empirical Efficacy Claim**: Laws can't change moral beliefs or eliminate desires. This might be defensible but not absolute. For example, smoking bans reduced smoking rates, so laws can influence behavior. But they might not change underlying beliefs. This supports the roommate's "won't work" point.

  2. **Jurisdictional Claim**: The state has no business enforcing morality. This ties into Hart's view from the debate, opposing legal moralism. It's substantive and defensible, rooted in liberal principles. It supports the "illegitimate" argument.

  3. **Conceptual Separation Claim**: Law and morality are fundamentally different. This is contested. Legal positivists like Hart might agree, but natural law theorists disagree. It's a substantive claim but not directly supporting either of the roommate's points on its own.

  4. **Democratic Legitimacy Claim**: Only democratically endorsed morality should be law. This is defensible but tricky because minority views might be overridden. Supports legitimacy if the ballot measure lacks majority support, but the roommate used it broadly, which might not hold.

  5. **Moral Relativism Claim**: No objective morality to legislate. This is highly contested and philosophically problematic. Probably false or at least not widely accepted. Doesn't strongly support either conclusion effectively.

  The roommate used the phrase for both illegitimacy and inefficacy. Jurisdictional claim best supports illegitimacy, while efficacy claim supports the "won't work" point. But conflating them is a category error. People usually mean the jurisdictional claim, especially in liberal contexts.

  The user's deeper need might be to understand how to counter this slogan in debates, recognizing its ambiguities. They want clarity to dissect arguments effectively. They also might seek validation that their suspicion about the phrase's overuse is correct.

  I need to be honest about confidence. The jurisdictional claim is the strongest, rooted in Hart-Devlin. Efficacy is context-dependent. Examples like Prohibition failing versus smoking bans working show nuance. If evidence shows laws effectively change behaviors linked to morality, that challenges the efficacy claim. For jurisdiction, if a society widely accepts legal moralism, that could challenge the jurisdictional claim, but liberal societies might still reject it.

  Also, note the user's meta-comment about not wanting certainty. Highlight where reasoning might be contested, especially the conceptual claim, which depends on legal philosophy schools. The jurisdictional claim assumes a liberal democratic framework, which isn't universal.
answer: |-
  You're right to be suspicious—this slogan is a classic "argument-stopper" because it's *massively* ambiguous. It collapses at least five distinct claims, each with different implications and levels of plausibility. Below is a menu breaking down the precise claims, their status (trivial/defensible/false), how they connect (or don't) to your roommate's two conclusions, and what people likely mean. I'll flag where my reasoning is contestable and what might change it.

  ### The Menu: 5 Distinct Claims Hidden in "You Can't Legislate Morality"
  *(Ordered loosely from least to most philosophically loaded)*

  1. **Empirical Efficacy Claim**  
     - **Precise Claim**: "Laws cannot reliably eliminate behaviors rooted in deeply held moral/desire-based commitments (e.g., vices), because people will defy them if the behavior feels essential to their identity/well-being."  
     - **Status**: **Substantive and defensible, but context-dependent**.  
       - *Why defensible?* History shows laws often fail to eradicate behaviors with strong cultural/psychological roots (e.g., alcohol prohibition, drug criminalization). People adapt (black markets, secrecy).  
       - *Why context-dependent?* Some "moral" laws *do* reshape behavior over time through deterrence, norm-shifting, or removing opportunities (e.g., smoking bans reduced smoking; seatbelt laws increased compliance). Efficacy depends on enforcement, social support, and whether the behavior is easily monitored.  
     - **Trivial?** No—it's an empirical prediction, not a tautology.  
     - **Supports Roommate's Conclusion?** Yes, but **only the second one** ("it won't work"). It says nothing about legitimacy.  
     - **Contestability**: High. This is social science, not philosophy. My claim could be wrong if evidence shows vice laws *do* reduce targeted behaviors significantly in specific cases (e.g., declining opioid use after prescription crackdowns). If you showed me rigorous data that *this specific ballot measure* would reduce the behavior despite low social cost, I'd revise.  

  2. **Jurisdictional Claim (The "Mind Your Own Business" Argument)**  
     - **Precise Claim**: "The state lacks the legitimate authority to use criminal law *solely* to enforce a particular moral code, especially concerning private, consensual, victimless conduct. Morality enforcement isn't the law's proper domain."  
     - **Status**: **Substantive and defensible (in liberal frameworks)**.  
       - *Why defensible?* Rooted in Mill's harm principle (only harm to others justifies coercion), Hart's anti-moralism, or privacy rights. It rejects Devlin's "society needs shared morals to survive" claim.  
       - *Key nuance*: It doesn't say morality *never* influences law—only that it *shouldn't* be the *sole* reason for criminalization.  
     - **Trivial?** No—it's a normative stance hotly contested in jurispruence (Hart vs. Devlin IS this debate).  
     - **Supports Roommate's Conclusion?** Yes, but **only the first one** ("illegitimate/shouldn't pass"). It directly challenges the law's justification.  
     - **Contestability**: Moderate. This assumes a liberal-democratic view of the state. If your society broadly accepts legal moralism (e.g., laws against blasphemy), this claim collapses. I'm most confident here *if* we're working within a Hart-ish framework—but if you convinced me that *all* criminal law implicitly enforces morality (e.g., theft laws enforce "property rights = moral"), I'd have to clarify that this claim targets *purely moral* enforcement without harm.  

  3. **Conceptual Separation Claim**  
     - **Precise Claim**: "Law and morality are fundamentally distinct conceptual categories. Legal validity isn't derived from moral correctness."  
     - **Status**: **Substantive and defensible (within legal positivism), but irrelevant here**.  
       - *Why defensible?* Hartian positivism insists law can be identified without moral evaluation (e.g., Nazi laws were legally valid but immoral).  
       - *Why irrelevant?* This is about identifying what counts as law, not whether morality *should* influence legislation. Your roommate isn't making a meta-legal point.  
     - **Trivial?** No—it's core to jurisprudence debates.  
     - **Supports Roommate's Conclusion?** **Neither**. This claim doesn't address whether legislating morality is effective or legitimate—only that "law" and "morality" aren't the same thing.  
     - **Contestability**: High. Natural law theorists (e.g., Finnis) would reject this, arguing unjust laws aren't "law" at all. My positivist leanings might blind me here—but even if I’m wrong, this claim doesn't help your roommate.  

  4. **Democratic Legitimacy Claim**  
     - **Precise Claim**: "Laws enforcing morality are illegitimate *unless* they reflect a stable, overwhelming democratic consensus. Otherwise, they're just tyranny of the majority (or minority!)."  
     - **Status**: **Substantive and defensible, but narrow**.  
       - *Why defensible?* In democracies, controversial moral legislation (e.g., sodomy laws) often lacks robust consensus and imposes minority views.  
       - *Why narrow?* It doesn't say morality *can't* be legislated—just that it requires democratic buy-in. If consensus exists (e.g., laws against murder), it's fine.  
     - **Trivial?** No—it's a procedural critique.  
     - **Supports Roommate's Conclusion?** **Potentially the first one** ("illegitimate"), if he argues this ballot measure lacks consensus. But he used it categorically ("you *can't*"), so it's a stretch.  
     - **Contestability**: Moderate. What counts as "consensus"? 51%? 90%? If your ballot measure polls at 80% support, this claim fails. My confidence drops here because it's easy to weaponize "consensus" loosely.  

  5. **Moral Relativism / Impossibility Claim**  
     - **Precise Claim**: "There's no objective morality to legislate—morality is subjective/relative, so enforcing it is literally impossible or meaningless."  
     - **Status**: **Generally false or irrelevant in this context**.  
       - *Why false?* Even if morality is subjective, people *do* hold strong moral views, and laws *can* enforce them (e.g., blasphemy laws in theocracies).  
       - *Why irrelevant?* Your roommate likely isn't making a meta-ethical nihilist argument. This is rarely what people mean.  
     - **Trivial?** No—it's philosophically heavy but misapplied here.  
     - **Supports Roommate's Conclusion?** **Neither effectively**. If morality is illusory, why would inefficacy or illegitimacy follow?  
     - **Contestability**: Low. This is a red herring in law debates—even relativists concede laws *attempt* to enforce norms.  

  ---

  ### How This Solves Your Roommate's Move
  - **His Two Jobs**:  
    1. *"Law would be illegitimate"* → Only supported by **Claim 2 (Jurisdictional)** or **Claim 4 (Democratic Legitimacy)**.  
    2. *"Law won't work"* → Only supported by **Claim 1 (Empirical Efficacy)**.  
  - **The Slogan Can't Do Both**: It's a **category error**. Legitimacy (a normative question) and efficacy (an empirical one) require distinct arguments. Conflating them lets him dodge both debates.  
  - **What People Usually Mean**: In everyday liberal discourse, especially post-Hart, they mean **Claim 2 (Jurisdictional)**. It's the go-to for opposing "victimless crime" laws. Claim 1 (Efficacy) is common too, but usually as a pragmatic add-on.  

  ---

  ### Where My Reasoning is Shakiest
  - **Staking the Most On**: **Claim 2 (Jurisdictional)**. It's the heart of the Hart-Devlin debate and aligns with how the slogan is used in policy fights (e.g., debates over drug legalization).  
  - **Most Contestable Part**: **Claim 1 (Efficacy)**. I called it "defensible but context-dependent," but the line between "changing behavior" and "changing morality" is fuzzy. Does a smoking ban reflect shifted morals or just inconvenience? If you showed me a vice law that *eliminated* a behavior *because* it altered moral perceptions (e.g., dueling), I’d have to admit law *can* reshape morality indirectly.  
  - **Biggest Blind Spot**: I’m assuming a **positivist/liberal framework** (like Hart's). If your group leans natural law or communitarian (à la Devlin), my jurisdictional claim looks ideological. Example: If you convinced me that enforcing "shared morality" is *necessary* for social cohesion (e.g., in highly homogeneous societies), I’d soften on Claim 2.  

  ### Bottom Line
  Your roommate’s use of the slogan is either confused or tactical. To counter:  
  - If he says "it’s illegitimate," ask: "Do you mean the state *shouldn't* enforce morality without harm (Hart), or that there’s no consensus?"  
  - If he says "it won’t work," ask: "Where’s your evidence? Other vice laws have reduced behaviors even if they didn’t eliminate them."  
  The phrase works as an argument-ender precisely because it’s a chameleon—peeling back its meanings forces the real disagreement into the open.
