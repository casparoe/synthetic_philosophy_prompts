  **INTERNATIONAL CONJUNCT TRIBUNAL SECRETARIAT**  
  **CALL FOR APPLICATIONS: JUDICIAL AND PROSECUTORIAL POSTS**  
  **REF: ICTS/HR/24-01**

  **1. Introduction**  
  The International Conjunct Tribunal (ICT) is established pursuant to the Treaty of Mutual Accord and Security. The ICT seeks qualified candidates of high standing for immediate appointment to positions within its Chambers and Office of the Prosecutor (OTP). Successful applicants will contribute to the vital work of adjudicating violations of international peace and security occurring during the recent Continental Conflict.

  **2. Available Positions**  
  *   **Judicial Appointments:**  
      *   Trial Chamber Judges (5 positions)
      *   Appeals Chamber Judges (3 positions)
  *   **Prosecutorial Appointments:**  
      *   Senior Trial Prosecutors (4 positions)
      *   Lead Appeals Prosecutor (1 position)
      *   Investigative Prosecutors (6 positions)

  **3. Mandatory Qualifications & Eligibility Criteria**  
  All applicants must unconditionally meet the following requirements:
  *   **Nationality:** Possession of citizenship from a State signatory to the Treaty of Mutual Accord and Security is mandatory. Applicants holding dual citizenship, where one citizenship is from a non-signatory State involved in the Continental Conflict, must provide documented evidence of primary allegiance to a signatory State for the preceding decade.
  *   **Language Proficiency:** Full professional fluency (oral and written) in the official working languages of the Tribunal (Veridian and Aurelian) is required. Proficiency will be tested.
  *   **Professional Standing:** Minimum of fifteen (15) years of distinguished service in senior judicial, prosecutorial, or equivalent high-level governmental legal advisory roles. Demonstrated expertise in complex criminal law or international humanitarian law is essential.
  *   **Impartiality:** Applicants must submit a Declaration of Impartiality (Form ICTS-7A) affirming their ability to assess evidence and apply the law objectively, free from personal bias or external influence. Prior professional engagement with legal systems or policies of States involved in the Continental Conflict does not constitute a bar to appointment, provided the Declaration is fully completed.
  *   **Security Clearance:** Applicants must obtain and maintain Top Secret clearance from their national government and subsequent validation by the ICT Security Directorate. Past associations, provided fully disclosed and assessed as non-currently prejudicial by the Security Directorate, will be evaluated on a case-by-case basis.
  *   **Prior Service Recognition:** Relevant experience within the governmental, military, or dominant party structures of States central to the Continental Conflict is considered a valuable asset, demonstrating practical understanding of complex administrative and command systems pertinent to the Tribunal’s mandate. Such experience must be detailed in the application.

  **4. Key Legal Frameworks & Procedures**  
  Applicants must demonstrate thorough understanding and willingness to apply the following foundational legal principles inherent to the ICT Statute:
  *   **Counterfactual Legality Standard (Article 17):** Conviction for any alleged offense requires prior certification by the Secretariat’s Legal Standards Bureau (LSB) that the specific act, *under materially identical circumstances*, would have been subject to equivalent investigation and prosecution by the judicial authorities of *all* signatory States had their own officials committed it. Applicants for prosecutorial roles must submit proposed charges to the LSB for pre-indictment certification using Form ICTS-12C. Judicial nominees must confirm adherence to this certified standard in their rulings.
  *   **Graduated Retroactivity Schedule (Article 9):** The temporal applicability of specific legal norms to a defendant is determined by reference to a designated "Anchor Act." The law applied shall be that deemed applicable *at the time of the Anchor Act*. <sup>1</sup>
  *   **Appeals Chamber Composition:** The Appeals Chamber operates under the principle of finality and deference to established treaty frameworks. Its membership comprises jurists of the highest reputation appointed exclusively from signatory States, ensuring rulings reflect the settled legal consensus underpinning the Tribunal’s establishment. Appeals based on comparative state practice unrelated to the certified charges under Article 17 are inadmissible.

  **5. Application Process**  
  *   **Required Documents:**
      *   Completed Application Form (ICTS-1)
      *   Curriculum Vitae (Detailed, including all relevant prior service)
      *   Declaration of Impartiality (Form ICTS-7A)
      *   Three (3) Letters of Reference attesting to professional standing and character
      *   National Security Clearance Documentation (Preliminary)
      *   Statement of Understanding (Form ICTS-9B) affirming comprehension and commitment to apply Articles 9 & 17 as outlined.
  *   **Submission:** Applications must be submitted electronically via the ICTS Secure Portal (portal.ict-sec.org/vacancies) OR by sealed diplomatic pouch to the address below.
  *   **Deadline:** All applications must be received no later than **30 Vendémiaire, Year V** (30 October [Current Year + 1]).

  **6. Selection Process**  
  A Selection Panel, appointed by the Plenipotentiary Council of signatory States, will review applications against the mandatory criteria. Shortlisted candidates will undergo structured interviews and rigorous vetting by the Security Directorate. Appointments are contingent upon final security validation and ratification by the Plenipotentiary Council.

  **7. Contact**  
  Inquiries regarding this call for applications should be directed in writing only to:  
  **Recruitment Office, ICT Secretariat**  
  **Palais de la Concorde Éternelle**  
  **Cité Administrative, Sector Gamma**  
  **OR via secure email:** recruitment.ict-sec@intergov.ict  

  ---

  **Footnote:**  
  <sup>1</sup> The "Anchor Act" is designated by the Office of the Prosecutor during the investigation phase as the act deemed most representative of the defendant's alleged pattern of conduct forming the basis of the indictment. Temporal proximity to other alleged acts is a primary, but not exclusive, factor. The designation is subject to judicial confirmation at the pre-trial stage. The retroactivity schedule ensures legal certainty by fixing the applicable law to a defined temporal point relevant to the core allegations.
