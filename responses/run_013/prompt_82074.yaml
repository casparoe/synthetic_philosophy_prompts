answer: |-
  Based on the rulings provided for your old labmate's views, the implicit rule she is applying appears to be **automatic endorsement plus easy access**. This means that for an external resource to be considered part of the mind, it must meet two key criteria: (1) it is accessed and consulted automatically (without conscious decision or effort), and (2) its contents are endorsed as authoritative without verification (i.e., trusted implicitly, as if they were internal memories or processes). This rule emphasizes the current cognitive stance and functional role of the tool, rather than long-term integration or parity alone. It also incorporates an element of individual control, where the user must be "in the driver's seat," meaning the tool is under their personal, habitual direction.

  ### How This Rule Fits All Her Rulings:
  - **Otto's notebook**: Extended mind because Otto consults it automatically (without deciding to) and endorses it as gospel without verification. It is easily accessible and under his individual control.
  - **Her phone contacts (implicit trust)**: Extended mind when she consults it automatically and treats it as authoritative without double-checking. Easy access is assumed, and she is in control.
  - **Same contacts (double-checking)**: Not extended because, despite easy access, she is not endorsing automatically—she verifies against other sources, breaking the automatic trust. The tool is not functioning as a transparent cognitive extension at that moment.
  - **Calculator**: Not extended because she has to consciously remember to pull it out (not automatic access) and she redoes the answers (not automatic endorsement). It lacks seamless integration into her cognitive processes.
  - **Lab whiteboard**: Not extended because no single individual is "in the driver's seat"; it is a shared, collaborative tool without personal automatic access or endorsement for any one person. Control is distributed, so it doesn't meet the individual criterion.

  ### Why the Other Rules Don't Fully Fit:
  - **Otto-style parity (it does the job an internal process would do)**: This fits most cases (e.g., Otto's notebook, trusted contacts) but fails for the whiteboard. The whiteboard does the job of an internal process (enabling proofs), but it's not extended because of the lack of individual control and automatic endorsement. Parity alone is insufficient without the endorsement and access components.
  - **Integration into habits over time**: This does not fit all rulings. For example, in the contacts case, the same list is extended or not on the same day based solely on her trust behavior, not long-term integration. Time-based integration isn't necessary, as the status can change instantly with cognitive stance (e.g., double-checking breaks extension immediately). The whiteboard might be used habitually, but it's not extended due to control issues.

  ### Prediction for Your Cousin:
  - **Automatic endorsement plus easy access rule**: Your cousin's use of the notes app involves automatic access (he "checks it without thinking about it") and automatic endorsement (he "treats what it says as authoritative"). The phone is easily accessible (implied by constant carrying), and he is individually in control. The nine-day period is not a barrier because the rule depends on current cognitive behavior, not duration, as shown in the contacts example where extension can shift daily. Therefore, this rule predicts that she will rule it **extended**.
    
  - **Otto-style parity rule**: The notes app does the job of an internal memory process, so it would also predict **extended**. However, this rule is less precise, as it doesn't explain the whiteboard ruling well.

  - **Integration over time rule**: If this were the primary rule, nine days might be seen as too short for full habit formation, leading to a "not extended" or "undecided" verdict. But this conflicts with the contacts ruling, where no time requirement is implied for extension (it can be revoked instantly when double-checking).

  **Best guess for her verdict**: She will say it is **extended**. The key reasons are the automatic access and endorsement, which align perfectly with Otto's notebook and her trusted contacts list. The short time frame (nine days) is irrelevant because her other rulings show that extension is based on current use, not longevity. Nothing has gone wrong, so trust is intact, and he is in the driver's seat.

  ### A Further Case to Tell the Rules Apart:
  To distinguish between the rules, consider a case where a tool has been used for a long time (e.g., years) with full integration into habits, but the user does not endorse it automatically (e.g., they always verify its outputs). For example:
  - **Scenario**: A scientist uses a well-integrated, personalized digital calendar for years. They access it automatically (e.g., it syncs with their routine) but, due to past errors, they always double-check every entry against email confirmations.
  - **Prediction by rule**:
    - **Automatic endorsement plus easy access**: Not extended, because automatic endorsement is missing (verification breaks trust).
    - **Otto-style parity**: Extended, as it does the job of internal memory, but this ignores the lack of trust.
    - **Integration over time**: Extended, due to long-term use, but this conflicts with the double-checking contacts ruling.
    
  This case highlights that "automatic endorsement plus easy access" is the most consistent rule, as it would align with the double-checking contacts ruling (not extended) and prioritize current cognitive stance over history or parity.

  Verdict: extended
