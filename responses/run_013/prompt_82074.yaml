  My old labmate is a philosopher of mind now and she has very settled views about where a mind stops and a tool starts. Her rulings so far: Otto's notebook — the Alzheimer's patient who carries it everywhere, consults it without ever deciding to, and takes what's in it as gospel — part of his mind. Her own phone contacts list, same drill — part of her mind. That exact same contacts list on a day when she's double-checking every number against other sources — not part of her mind, same list, same person, same day. A calculator she has to remember to pull out and whose answers she redoes in her head anyway — not part of her mind. The whiteboard in her lab, where the group works out a proof none of them could get alone — not part of anyone's mind, because she says none of them is really in the driver's seat.

