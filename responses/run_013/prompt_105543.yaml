answer: |-
  Let's map this debate onto your actuarial framework with strict terminological fidelity. I'll flag all metaphors with asterisks (*) to avoid smuggling assumptions.

  ### Policyholder & Beneficiary Structure  
  **Pro-Reparations Position:**  
  - **Policyholder(s):** The state* and private entities* that permitted/enforced slavery/Jim Crow (occurrence policies*) and ongoing systemic discrimination (claims-made policies* with retroactive dates* set at emancipation/1964 CRA).  
  - **Beneficiaries:** Descendant classes* of the wronged, treated as successor entities* to original victims (per "direct action" statutes* in some jurisdictions).  
  - **Covered Perils:** Chattel slavery (occurrence trigger*), discriminatory policies (claims-made trigger* with continuous exposure), wealth expropriation (incurred-but-not-reported losses*).  
  - **Loss Development:** Historical injustices exhibit extreme development tail*. Current racial wealth gap = emerged losses*, with IBNR reserves* for future economic impacts (e.g., reduced intergenerational wealth transfer).  

  **Main Objections (Resistance Arguments):**  
  1. **No Living Policyholder***  
     - "Policy lapsed*": Alleged liable entities (e.g., 1860s corporations, pre-14th-Amendment state*) dissolved or fundamentally restructured. Statute of limitations* expired (analog: claims-made policy with no retroactive coverage*).  
     - "Non-assumption of liability*": Current entities never underwrote* predecessor risks.  

  2. **Beneficiary Ambiguity***  
     - "Counterfactual causation problem": Descendants might not exist absent the wrong (i.e., no insurable interest*).  
     - "Adverse selection*": Benefits could flow to individuals with no quantifiable loss* (moral hazard* risk if reparations incentivize claims inflation*).  

  3. **Aggregation & Causation Challenges***  
     - "Correlation vs. causation": Systemic factors (e.g., automation, globalization) correlate* with racial disparities but aren't covered perils*.  
     - "Allocation dispute": No credible method to separate slavery/IBNR losses* from later "non-covered" events (e.g., post-1968 economic shifts).  

  4. **Valuation Without Baseline***  
     - "No control group": Can't observe undamaged counterfactual* (unlike standard loss triangles).  
     - "Discount rate indeterminacy": No agreed valuation date* (1619? 1865? 1964?) or curve* to discount historical losses to PV.  

  ---

  ### Residue Report: Where Translation Succeeds, Distorts, or Fails  
  **I. Clean Mappings (Actuarial Concepts That Hold)**  
  | Philosophical Concept          | Actuarial Equivalent                     | Validity |  
  |--------------------------------|------------------------------------------|----------|  
  | Statute of limitations         | Claims-made policy retroactive date*     | High     |  
  | Intergenerational harm         | IBNR reserves + loss development*        | Medium   |  
  | State/non-state actor liability| Joint & several liability/subrogation*   | Medium   |  
  | Moral vs. legal responsibility | Punitive vs. indemnity damages*          | Medium   |  

  **II. Distorted Mappings (Requiring Forced Analogies)**  
  | Philosophical Concept          | Actuarial Attempt                        | Distortion Point |  
  |--------------------------------|------------------------------------------|------------------|  
  | "You didn't commit the wrong"  | "Policyholder entity no longer exists"*  | Assumes liability is strictly corporate*, not societal* |  
  | "Wrongdoers are dead"          | "Lapse + no successor liability*"        | Ignores continuous entity* doctrine (e.g., US government as same "insurer"*) |  
  | "Descendants wouldn't exist"   | "Insurable interest failure*"            | Conflates existence with economic position (loss = deviation from no-harm baseline*) |  

  **III. Fundamental Gaps (No Actuarial Analog)**  
  1. **Counterfactual Baseline Problem**  
     - **Gap:** No "undamaged world" scenario to anchor loss valuation. Actuarial methods require known exposures* and development patterns*.  
     - **Limitation or Indeterminacy?** Both. Actuarial thinking *cannot* model this gap (no data, no control group), but the philosophical debate *fails to specify* the baseline (e.g., "What would Africa-descended wealth look like absent slavery?" involves untenable assumptions).  

  2. **Claimant Identity Ambiguity**  
     - **Gap:** Beneficiaries* are statistical constructs (racial groups), not contractual payees. No clear "proof of loss"* for individuals.  
     - **Limitation or Indeterminacy?** Philosophical limitation. Reparations advocates often conflate:  
       - *Individual claims* (no actuarial path: lineage dilution* over 8+ gens)  
       - *Group claims* (actuarially workable but requires arbitrary boundaries*)  
       - *Symbolic acknowledgment* (no loss equivalent)  

  3. **Standing to Adjudicate**  
     - **Gap:** No "insurer"* or "tribunal"* with pre-accepted authority. Current governments are *parties to the dispute*, not neutral adjusters*.  
     - **Limitation or Indeterminacy?** Core philosophical flaw. Actuarial methods presume a binding contract* and valuation standards*. The debate lacks both, making "pricing the risk"* impossible without political fiat*.  

  ---

  ### Critical Residue: What Actuarial Thinking Exposes  
  1. **The Tail Estimate Problem Is Central**  
     - Reparations require treating the *tail development* of historical harm as a *fact* (e.g., current wealth gap = emerged loss).  
     - Objections treat it as a *convention* ("why stop here?"). Actuarial rigor forces this into the open.  

  2. **No "Credible Loss Experience"***  
     - Like pricing a new peril* with no data, reparations demand extrapolation from non-analogous events (e.g., Holocaust reparations ≠ US slavery).  

  3. **Subrogation Failure is Fatal**  
     - Actuarial logic requires liability to attach to *specific policyholders*. If the state* is deemed the sole liable party*, private entities escape (undermining "complicity" arguments).  

  **Conclusion:** The translation *fails honestly* at the gaps above. Actuarial thinking reveals three irreducibly non-actuarial premises in the debate:  
  - That moral debts* outlast legal liability* (no "statute of limitations" for ethics)  
  - That group harm* exists independently of individual claims*  
  - That acknowledgment* has value beyond indemnity*  

  Demanding a "clean loss event" isn't pedantry—it exposes where reparations arguments rely on unstated moral axioms rather than calculable loss. The actuarial lens doesn't resolve the debate but clarifies which parts are *accounting problems* (e.g., allocation) and which are *foundational disputes* (e.g., counterfactual baseline).
