  ## Pantoum for the Digger Wasp

  She drags the cricket to the burrow's edge,  
  leaves it to check the tunnel’s shaded hold.  
  I shift it back beyond the sunlit ledge.  
  She finds it waiting in the day’s last gold.  

  Leaves it to check the tunnel’s shaded hold,  
  drags it again toward the waiting door.  
  She finds it waiting in the day’s last gold,  
  then checks the dark she’s checked before.  

  Drags it again toward the waiting door.  
  I shift it back, the same small space I cleared.  
  Then checks the dark she’s checked before.  
  She rises from the depths to seek, undeterred.  

  I shift it back, the same small space I cleared.  
  I shift it back beyond the sunlit ledge.  
  She rises from the depths to seek, undeterred.  
  She drags the cricket to the edge again.  

