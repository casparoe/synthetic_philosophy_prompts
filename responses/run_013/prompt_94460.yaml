    "the_tension": "The poem refuses to resolve whether the final 'again' is mechanical decay or minute adaptation, implicating observer and observed equally.",
    "where_it_could_be_wrong": "If the wasp's re-inspection is proven adaptive (e.g., detecting burrow parasites), the 'sphexishness' critique collapses; likelihood: ~60% given emerging entomology.",
    "line_numbers_doing_work": "Lines 1/16 (variation echoes displacement), 3/11/14 (human repetition), 6/9 (wasp's redragging ritual), 8/15 ('undeterred' vs. 'again' unresolved)."
  }
  ```
