prompt: |-
  My reading group has one guy who did a physics minor and now says "only the present is real" to close out arguments. Last week it was about whether there's any fact of the matter about the year 2500 — his line was that the future isn't real yet, so nothing about it is true or false. But he also thinks the present is *moving*, like a spotlight, and when I asked him what it's moving through he got annoyed with me. I dont think the slogan is doing the work he thinks it's doing. Can you lay out the distinct things "only the present is real" could actually be claiming, from the nearly trivial to the ones with real metaphysical weight — flagging which ones give him his "no truth about the future" conclusion and which leave it hanging, which are the reason other people use the same words to argue the opposite of what he wants, and which are really just claims about how we use the word "exists" rather than about time — and for each one say whether it's plausible, and whether his moving spotlight is even coherent on that reading? Lay it out as a menu I can read at him rather than picking one and defending it. Last line: \answer{...} with the single reading you think he's actually got in mind.
