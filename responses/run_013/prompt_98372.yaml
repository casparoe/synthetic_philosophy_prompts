  ### Decision Tree: What Does "DNA Carries Information" Mean?

  **Instructions:** Start at Q1. Answer each question based on your intuitions about hard cases (e.g., non-coding RNA, prions, same sequence in different contexts). Follow the branches to your leaf position. Avoid labels—focus on commitments.

  ---

  #### **Q1:** Is "DNA carries information" reducible to *correlation/causation* (e.g., DNA sequence covaries with traits/proteins), or does it require extra ingredients like a *sender, convention, or purpose*?  
  - **Correlation/causation → Q2**  
  - **Requires extra → Q3**  

  #### **Q2 (Correlation-Only):** Does cellular context *fundamentally* alter the information? (e.g., same DNA sequence produces different outcomes in different cells/states.)  
  - **Yes → Leaf B**  
  - **No → Q4**  

  #### **Q4 (Sequence-Dominant):** Does DNA’s information about a trait depend on *how precisely* the sequence controls that trait? (e.g., a mutation that always causes disease vs. one that only sometimes does.)  
  - **Yes → Leaf C**  
  - **No → Leaf A**  

  #### **Q3 (Extra Ingredients):** Is a *consumer system* essential? (i.e., something must *use* DNA to achieve a function/goal.)  
  - **Yes → Leaf D**  
  - **No → Q5**  

  #### **Q5 (No Consumer):** Is the genetic code’s mapping (e.g., codon → amino acid) *arbitrary*? (i.e., chemistry doesn’t force it—it could have been otherwise.)  
  - **Yes → Leaf E**  
  - **No → Leaf F**  

  ---

  ### Leaves (Named Positions & Awkward Commitments)  
  1. **Leaf A: Causal-Correlation Eliminativism**  
     - *Awkward commitment:* Must deny that the genetic "code" adds anything beyond ordinary cause-effect talk—even when explaining codon arbitrariness.  
  2. **Leaf B: Contextual Relationalism**  
     - *Awkward commitment:* Must argue DNA alone carries *zero* information—it only "has" info in specific cellular contexts.  
  3. **Leaf C: Causal Specificity View**  
     - *Awkward commitment:* Must accept DNA carries *little* information about traits where it’s necessary but insufficient (e.g., susceptibility to disease).  
  4. **Leaf D: Teleosemantic (Consumer) View**  
     - *Awkward commitment:* Must ground "representation" in evolved *function*—even for novel, non-adaptive sequences.  
  5. **Leaf E: Arbitrary Code Realism**  
     - *Awkward commitment:* Must defend arbitrariness as sufficient for "true" coding—even in abiotic systems with no sender/receiver.  
  6. **Leaf F: Non-Arbitrary Code Realism**  
     - *Awkward commitment:* Must explain why chemical determinism (e.g., stereochemistry) still counts as a "code."  

  ---

  ### Unresolved Overlaps & Empty Regions  
  - **Can’t pull apart:**  
    - **Leaf D (Consumer) vs. Leaf E (Arbitrary Code):** Some views blend teleology with arbitrariness (e.g., "arbitrariness requires a consumer to matter"). The tree forces a choice.  
    - **Leaf B (Contextual) vs. Leaf C (Specificity):** Contextualists may embrace specificity; the tree prioritizes context-dependence.  
  - **Empty Regions:**  
    - **"Dual-Aspect" views** (e.g., info as both causal *and* intentional): Excluded by Q1’s forced choice. Diagnosed as *incoherent* by eliminativists.  
    - **"Prion-Exceptionalism"** (e.g., templating makes prions "informational" but DNA not): No natural path; collapses under Q1 (if prions lack purpose/convention, they’re just causal). Diagnosed as *unexplored*.  

