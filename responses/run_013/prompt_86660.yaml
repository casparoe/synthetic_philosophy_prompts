  **Which feature generates non-ratifiability?** 
  The key is the combination of:
  1. The prediction is fixed but unknown.
  2. The agent's action provides evidence about what the prediction was (because of the predictor's accuracy).
  3. The counterfactual outcome of the other action depends on the prediction.

