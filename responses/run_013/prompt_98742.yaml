prompt: |-
  I have recently begun advising a small conservation nonprofit on a habitat intervention, and I have had to make my uncertainty explicit in a way I never did as a student. Instead of assigning a single probability to outcomes, I have been carrying a low and a high estimate, and treating any value in between as admissible. That part is manageable. What I did not expect is a particular kind of change in those ranges. I will have a range for whether the intervention reduces erosion. Then I learn something about an unrelated variable—say, the results of a survey on local rainfall patterns—something that, under every one of my candidate models, is supposed to be independent of the erosion outcome. My range for erosion does not narrow. It widens. A decision that was robust across the old range—one that was worth taking no matter where in the interval the true value fell—can become fragile, even though the new fact was, by my own assumptions, irrelevant to erosion. It feels like learning about the rainfall survey has made my ignorance about erosion more visible rather than less.

  Is there an established name for this? I have heard of ambiguity aversion, and of second-order probabilities, but the first seems to be about attitudes toward imprecision and the second still seems to collapse everything into a single higher-order distribution. What I am describing is a structural effect: the independence I assumed seems to be a property of each single model, not of the range as a whole. If there is a standard term, I want it and, more importantly, an account of how it differs from the nearest concepts. If there is no standard term, please coin one and define it, including what it excludes. I am not looking for a reading list or citations; I want the phenomenon carved at the joints.

  Please structure your answer as follows: (1) The pattern, restated (2–3 sentences), so I can see whether you have identified the right thing. (2) Nearest established concepts (about 200 words), taking each candidate in turn and saying what it captures and where it falls short. (3) Verdict on the name (one paragraph), giving the best established term or a new one, with a definition. (4) Boundary cases and a diagnostic test (one paragraph), including one case that looks similar but is not an instance.
reasoning: |-
  Hmm, the user is describing a fascinating statistical paradox they've encountered while advising a conservation nonprofit. They're dealing with uncertainty ranges for habitat intervention outcomes, and noticing that learning independent information (like rainfall data) actually widens their erosion probability range rather than narrowing it. This violates their intuition that independent information shouldn't affect the estimate.

  What they're observing is that while each individual model assumes independence between rainfall and erosion, the set of models as a whole doesn't preserve this independence. The key insight is that model uncertainty creates a dependency at the meta-level - different models may have different correlations between variables, even if each assumes independence.

  The user specifically wants to know if there's a name for this phenomenon. I recall concepts like model uncertainty, ambiguity, and dilation, but need to evaluate which fits best. Dilation seems promising but might not fully capture the range-widening aspect. Second-order uncertainty is too vague. The independence mismatch between individual models and the ensemble seems crucial.

  For the naming verdict, I consider "ensemblic dependence" as a new term since it precisely describes how independence holds within models but fails across the ensemble. This distinguishes it from simple model uncertainty or ambiguity aversion.

  To clarify boundaries, I should note that this isn't just about getting new data (which usually narrows ranges) nor about dependent variables (where range-widening would be expected). The paradox specifically occurs when learning truly independent information under model uncertainty.

  The user's deeper need seems to be understanding why their intuition fails and how to communicate this counterintuitive effect to colleagues. They're likely frustrated that standard statistical concepts don't capture this phenomenon cleanly.
answer: |-
  ### (1) The Pattern Restated  
  You maintain a range of probabilities for an outcome (e.g., erosion reduction). When you learn new evidence that is *independently generated* from the outcome *under each of your candidate models*, your probability range for the outcome widens rather than narrows. This expansion can undermine decision robustness despite the evidence being irrelevant to the outcome within every individual model. The core paradox: learning unrelated facts amplifies your perceived ignorance about the target variable due to structural properties of the model ensemble.

  ### (2) Nearest Established Concepts  
  - **Model Uncertainty/Average Model Robustness**: Captures uncertainty over competing models but assumes independence or fixed weighting. Falls short by ignoring how evidence *restructures* the ensemble, causing range expansion even when independence holds per-model.  
  - **Dilation (e.g., in Imprecise Probability)**: Occurs when an event stretches probability bounds after conditioning. *Similar* in widening ranges, but dilation typically arises from *dependent* evidence or non-linear updating. Your case involves *per-model-independent* evidence, making classic dilation insufficient.  
  - **Second-Order Uncertainty**: Encompasses distributions over probabilities but collapses to a single meta-distribution. Fails because your range-widening arises from the *geometry of the set* (e.g., how models disagree on joint distributions), not higher-order variance.  
  - **Ambiguity**: Describes aversion to imprecise knowledge but doesn’t explain the *mechanism* of range expansion from irrelevant evidence. Your issue is structural, not behavioral.  

  ### (3) Verdict on the Name  
  **Ensemblic Dependence** (coined term).  
  *Definition*: The phenomenon where learning evidence, which is *independent of a target variable under every candidate model in an ensemble*, nonetheless widens the probability range for the target due to (a) heterogeneity in how models specify the evidence-generating process, and (b) the resulting discord in how the evidence updates the ensemble’s composition. It highlights that "independence" within models does not imply "meta-independence" across models. This *excludes* range changes from dependent evidence, model consensus, or Bayesian updating under a single prior.  

  ### (4) Boundary Cases and Diagnostic Test  
  - **Boundary Case (Not an Instance)**: Learning rainfall data *directly predictive* of erosion (e.g., a model links heavy rain to soil loss). Range-widening here is expected and *not* ensemblic dependence—it stems from evidence-outcome dependence within models.  
  - **Diagnostic Test**: The phenomenon occurs *if and only if*:  
    1. Evidence is independent of the target *in each model individually*.  
    2. The set of models is *mutually inconsistent* in their likelihoods for the evidence.  
    3. Conditioning on the evidence *increases the variance* of the target’s probability across models.  
  Example: Model A says rainfall likelihood is 0.2, Model B says 0.8. Learning "high rainfall" boosts Model B’s weight, but Models A/B disagree on erosion probability. If Model B’s erosion estimate is extreme, the ensemble range widens.
