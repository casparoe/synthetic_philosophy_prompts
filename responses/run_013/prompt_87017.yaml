prompt: |-
  I've been reading up on this philosopher David Lewis who wrote a book about conventions, and I think I get the basic idea, but the more I poke at it the less sure I am, so I want to test it on something real. As I understand him, a convention is just a regularity everyone follows, where everyone expects everyone else to follow it, and everyone would rather follow it as long as the others do, and all of that is common knowledge. His example is which side of the road we drive on: nothing in the world makes left better than right, it only has to be the same for all of us, and once we're all on the same side nobody has a reason to move, so it holds itself up.

  What's bugging me is Sweden in 1967. They drove on the left like Britain does, and then one Sunday morning in September the whole country switched to the right. The odd part is they didn't want to. There was a referendum in the fifties and something like eighty per cent said keep it as it is, and then parliament went ahead anyway a few years later, with a massive campaign, new lines painted on the roads, all the signs swapped, the works. More than nine in ten Swedish cars already had the steering wheel on the left anyway, so left-hand driving meant you had to poke your nose into oncoming traffic to overtake. Apparently even the buses were wrong, because their doors were on the wrong side, and the trams in central Stockholm just got scrapped rather than converted, and thousands of buses got new doors cut into them, and there was some business about headlamps being cheap round ones then and about to get expensive, which is partly why they did it when they did. It worked. Everyone switched, and it stuck.

  So here's my problem. If a convention is held up by everyone expecting everyone else to do it, it should be nearly impossible to shift, because the expectations are propping up the old one. But Sweden shifted in a single morning, and not because people changed their minds, since the referendum says they didn't. Either the thing was never a convention in Lewis's sense, or a convention can be flipped by one authority telling everybody at once, which seems to make the expectation part do far less work than Lewis wants it to. And if expectations alone were holding left-hand driving in place, why couldn't expectations alone have moved it, without the law? Also it wasn't really arbitrary in the way the driving example is supposed to be, because the neighbours were all on the right and the cars were built the wrong way round for the left, so there was a real argument that one side was better.

  What I want is a proper going-over of this one case. Was left-hand driving in Sweden a convention by Lewis's conditions, taken one at a time, and where exactly does it fail to fit? What does the switch actually show about how a convention gets unmade, was the law doing the coordinating or just making the new expectation common knowledge or both, and what does the case show about the theory itself, whether it comes out confirmed or shows a gap? The theory seems to have almost nothing to say about how a convention travels from one equilibrium to another, and nothing at all about conventions getting welded to physical stuff like bus doors and tram rails, which is a cost that has nothing to do with anybody's expectations.

  I'd also like to know where I'm muddling convention with a rule we think we ought to follow, because driving on the left felt like a law as much as a habit, and if it's only a habit it's strange that a policeman could fine you for it. And test it for me: if they repealed the law tomorrow, would everyone just keep driving on the right? If yes, then it has turned into a real convention and the law was scaffolding. If no, then it was a rule all along and Lewis is describing something thinner than what we usually mean. And say what the case can't settle, because maybe Sweden is just a lucky case where a strong state could pull off a one-day switch, and the theory might do better or worse with conventions that settle with nobody in charge, the way the side you stand on an escalator or the way we queue seems to have sorted itself out.

  Write it out as plain prose please, no headings or bullet points or bold or tables, just a letter, that's how I read best.
reasoning: |-
  Okay, let me tackle this user's deep dive into David Lewis's convention theory using Sweden's 1967 driving switch. 

  First, I need to map their core tension: Lewis says conventions are self-reinforcing through mutual expectations, yet Sweden flipped overnight against public will. The user's pushing hard on whether this breaks Lewis's model. I should unpack each element - regularity, expectations, preference for coordination, common knowledge - against the Swedish case.

  Hmm, the physical infrastructure angle is crucial. Lewis focuses on psychological states, but bus doors and tram rails created material lock-in. That's a real gap in the theory. And the role of law here is fascinating - was it just broadcasting new expectations or forcing behavior? The referendum shows people preferred left-side driving, but switched anyway because the state reconstructed the entire coordination payoff matrix.

  I should emphasize how law short-circuited the expectation loop. Normally, shifting conventions requires gradual belief changes, but here the state simultaneously reset everyone's expectations on D-Day. The user's scaffolding metaphor is sharp - law provided temporary structure until the new convention stood on its own. 

  The arbitrariness point matters too. While theoretically arbitrary, Sweden's choice wasn't: neighboring countries and car designs made right-side objectively better. This weakens the "pure coordination" aspect Lewis assumes. Maybe his theory needs room for conventions with mild preference asymmetries.

  For the rule vs convention question, I'm thinking Sweden now would keep driving right without law because expectations are entrenched. But initially? Pure rule. That duality is key - conventions often start as rules. Lewis might call the post-1967 practice a convention, but the transition was all authority.

  The escalator comparison helps. User's right that Lewis excels at explaining organic conventions but stumbles on state-led shifts. Sweden exposes how power can brute-force new equilibria. Still, the theory holds if we see law as modifying the "preference" condition - once switch happened, people preferred right-side because others did.

  Physical constraints are the real blind spot. Lewis's game theory approach can't handle bus doors needing rebuilds. Maybe conventions exist on spectra: some pure coordination, some materially embedded. Sweden sits on the messy end.

  End thought: The case doesn't break Lewis but shows where his model needs stretching - particularly around transition mechanics and material entanglement. User's nailed the theory's limits beautifully.
answer: |-
  Here’s a close examination of Sweden’s driving switch through Lewis’s lens, untangling what fits, what strains, and what the theory might miss:

  You’re right to probe this case. Sweden’s 1967 switch *does* put pressure on Lewis’s elegant model of convention, revealing nuances and potential gaps. Let’s break it down piece by piece, starting with whether pre-1967 left-hand driving in Sweden qualified as a Lewisian convention.

  **Was Left-Hand Driving a Lewisian Convention Before 1967?**
  By Lewis’s criteria, it largely *did* fit:
  1.  **Regularity:** People *did* regularly drive on the left. That’s undeniable.
  2.  **Expectations:** Drivers *did* expect others to drive on the left. This expectation was crucial for safe driving and was constantly reinforced by daily experience. Violations would cause chaos and danger, proving the expectation’s strength.
  3.  **Preference for Uniformity:** Crucially, each driver preferred to drive on the same side as everyone else, regardless of which side it was. The preference wasn't for left *in itself*, but for *coordination* to avoid accidents. This condition seems met – the referendum suggests people preferred *staying coordinated on the left* to the disruption of switching, even if they disliked left-hand driving’s inefficiencies.
  4.  **Common Knowledge:** It was common knowledge that everyone expected everyone else to drive left, preferred coordination, and acted accordingly. Traffic laws codified this, but the underlying behavioral regularity and mutual understanding existed independently.

  **So, Why Could It Change Overnight? The Strain Points**
  The switch exposes where Lewis’s model, while largely applicable, might be incomplete or needs nuance regarding *transition* and *external forces*:

  1.  **The Role of Authority & Law:** Lewis focuses on decentralized emergence and maintenance. Sweden shows a powerful *central authority* can forcibly *create* a new coordination point. Parliament didn't just *suggest* a switch; it *mandated* it, invested massive resources (repainting, resigning, modifying buses), and crucially, *set a single, unambiguous switch date* ("Dagen H"). This didn't just "tell" people; it *orchestrated* a simultaneous jump.
      *   **Coordinating Expectations:** The state action *created* the common knowledge needed for the new equilibrium. Everyone knew that *on September 3rd, 1967, at 5 am, everyone else was legally required and practically prepared to switch*. The state guaranteed the new "regularity" would start instantly. It bypassed the gradual, uncertain shift in expectations that might happen organically.
      *   **Altering Preferences (Indirectly):** While individuals still *preferred coordination* (Lewis's key point), the state intervention massively changed the *costs* associated with each option. Continuing on the left after Dagen H meant breaking the law (fines), causing accidents, and facing social disapproval for non-compliance. The state effectively made *not switching* far more costly than switching, thereby making coordination on the *new* side the preferred option *given the new, state-enforced reality*. Lewis acknowledges that preferences can be conditional on the actions of others *and* the environment – the state drastically altered the environment.

  2.  **The "Arbitrariness" Caveat:** Lewis emphasizes conventions solve *pure* coordination problems where the solutions are equally good *in isolation*. Sweden muddies this:
      *   **Material Entanglement:** The physical infrastructure (steering wheels on the left, bus doors on the left, headlamp patterns, tram rails) created a *genuine asymmetry*. Right-hand driving *was* objectively better *given the existing car fleet and neighboring countries*, even if left-hand driving was perfectly functional in isolation. This wasn't purely arbitrary; there were underlying reasons to prefer one side *if a switch was possible*. The convention was "locked in" not just by expectations, but by sunk costs in physical capital. Lewis's theory struggles to fully incorporate these material constraints that make transitions costly and create path dependence.

  3.  **Transition Mechanisms:** Lewis is brilliant on why conventions *persist* but has less to say about how they *change*, especially abruptly. Sweden shows a specific transition path: **coordinated reset by authority**. The state acted as a massive, one-time coordination device, shattering the old expectation structure and instantly establishing the new one through law, investment, and publicity. It proves conventions *can* be flipped top-down, but this relies on a unique actor (the state) with unique powers. It doesn't explain how conventions shift without such authority (like your escalator example).

  **Rule vs. Convention, Law vs. Habit:**
  You hit a crucial point. Pre-1967, driving on the left was *both*:
  *   A **Lewisian convention:** Sustained by mutual expectations and a preference for coordination.
  *   A **legal rule:** Enforced by fines.

  This duality is common. The law often codifies and reinforces an existing convention (or tries to establish a new one). The referendum suggests the *conventional expectation/preference* (keep coordinating on the left) was strong *despite* the law potentially being changeable. Post-switch, the law initially *forced* the new behavior.

  **Your Test: Repeal the Law Tomorrow?**
  This is insightful. *Today*, driving on the right in Sweden is almost certainly a robust Lewisian convention. The expectation that others drive on the right is deeply ingrained through decades of universal practice. The preference for coordination on the *right* (to avoid accidents) is paramount. The law reinforces it, but the behavioral regularity and mutual expectations would likely persist without it. The material infrastructure (steering wheels, road layouts) now strongly favors the right. If repealed, people would almost certainly keep driving on the right – the convention is self-sustaining. The law was indeed scaffolding for the *transition*, now largely superfluous for *maintenance*. This confirms Lewis's core point about the self-reinforcing nature of established conventions.

  **What Sweden Shows (and Doesn't Show) About Lewis's Theory:**
  *   **Confirms:** The core logic of self-reinforcement through mutual expectations and preference for coordination is powerful. Post-1967 driving on the right *is* a textbook convention.
  *   **Reveals Gaps/Limitations:**
      *   **Transition Mechanics:** How conventions shift between equilibria, especially when material costs are high. Authority-driven coordinated reset is one mechanism, but Lewis under-theorizes this.
      *   **Material Entanglement:** Conventions aren't just psychological; they can be deeply embedded in physical infrastructure, creating inertia and asymmetric costs Lewis's model doesn't fully capture.
      *   **Arbitrariness Nuance:** While coordination is key, underlying asymmetries (like car design or geography) can make one solution *objectively preferable* if transition is feasible, even if both work for pure coordination.
      *   **Role of Authority:** Law can be more than just codifying convention; it can be a powerful tool for *destroying* an old convention and *establishing* a new one by altering the payoff structure and guaranteeing synchronized action.
  *   **Doesn't Settle:** How conventions emerge and change *without* a central authority. Sweden is a special case of top-down transition. The theory likely holds up better for conventions like escalator standing or queuing, where emergence and shifts are more organic and gradual, driven purely by decentralized expectations and preferences. Sweden doesn't invalidate Lewis for those cases; it shows a different pathway driven by unique institutional power.

  **In essence:** Sweden’s switch doesn’t break Lewis’s model, but it stretches it. It shows how a strong authority can forcibly overcome the inertia of a convention by simultaneously reshaping expectations, altering preferences through changed costs/enforcement, and providing a decisive coordination point. It highlights the under-appreciated role of material infrastructure in locking in conventions. And it confirms that once the new pattern is established, it operates *as* a Lewisian convention, self-sustained by the very expectations the state initially had to impose. The case illuminates the complex interplay between decentralized social coordination and centralized political power that Lewis's primarily game-theoretic, expectation-focused model only partially captures.
