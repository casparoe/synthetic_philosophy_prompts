answer: |-
  ### Scenario: The Intensive Tutoring Program  
  At Lincoln High, administrators implement an intensive after-school tutoring program aimed at boosting students' final exam scores. The exposure is program participation (yes/no), and the outcome is passing the final exam. The district stratifies students by midterm exam performance (pass/fail), measured after tutoring begins. An unmeasured risk factor—parental pressure (high/low)—affects both a student's likelihood of being enrolled in tutoring (high-pressure parents push enrollment) and their midterm performance (high pressure causes anxiety, lowering midterm scores). Crucially, tutoring itself *causes* fatigue, further lowering midterm scores for some students. Thus, midterm performance is partly caused by tutoring (exposure) and parental pressure (unmeasured confounder). When analyzed, tutoring appears to *increase* pass rates in both midterm-pass and midterm-fail subgroups but *decreases* pass rates overall.  

  ---

  ### Causal Model in Plain Words  
  - **Exposure**: Tutoring program (causes fatigue, lowering midterm scores).  
  - **Outcome**: Final exam pass/fail.  
  - **Stratifier**: Midterm exam performance (pass/fail), which is a **collider** because it is caused by both tutoring (exposure) and parental pressure (unmeasured risk factor).  
  - **Unmeasured risk factor**: Parental pressure—it increases tutoring enrollment (high-pressure parents insist on it) and directly lowers final exam scores (via anxiety).  
  - **Key distortion**: Conditioning on the collider (midterm performance) induces a spurious link between tutoring and parental pressure, manufacturing subgroup reversals.  

  ---

  ### Comparisons  
  | Group                | Tutoring Pass Rate | Control Pass Rate | Comparison       |  
  |----------------------|--------------------|-------------------|------------------|  
  | **Pooled**           | 45% (90/200)       | 55% (110/200)     | **Harmful** (Δ = -10%) |  
  | **Midterm Pass**     | 80% (48/60)        | 75% (45/60)       | Protective (Δ = +5%)  |  
  | **Midterm Fail**     | 30% (42/140)       | 25% (35/140)      | Protective (Δ = +5%)  |  
  | **True causal effect** (what we want) | 40% (unobserved) | 60% (unobserved) | **Harmful** (Δ = -20%) |  

  *Numbers explained*:  
  - **True effect**: Tutoring reduces pass rates by 20% due to burnout. Parental pressure worsens outcomes (e.g., high-pressure students have 40% pass rate vs. 80% for low-pressure).  
  - **Pooled harm**: High-pressure students are overrepresented in tutoring (70% of tutored vs. 30% of controls), dragging down overall rates.  
  - **Subgroup "protection"**: In midterm-pass/fail groups, conditioning on the collider hides high-pressure students in tutoring (e.g., in "midterm pass," only resilient high-pressure students pass, creating a false protective signal).  

  ---

  ### The Single Feature Doing the Work  
  **Midterm performance is a collider** (caused by both tutoring and parental pressure). Conditioning on it:  
  - Creates artificial associations between tutoring and parental pressure within strata.  
  - Inverts the exposure-outcome relationship in subgroups by "hiding" high-risk (high-pressure) students who would otherwise drag down tutoring's numbers.  

  ---

  ### What If We Swap the Stratifier for a Real Confounder?  
  If we stratify by a **real confounder** (e.g., baseline anxiety, *prior* to tutoring), which affects both tutoring enrollment and final scores but is *not* caused by tutoring:  
  - **Result**: Stratification removes confounding. The true harmful effect (Δ = -20%) appears in both pooled and subgroup comparisons.  
  - **Why?**: Unlike the collider, baseline anxiety isn’t distorted by tutoring. Stratifying here is the *correct* fix.  

  ---

  ### How a Sharp Skeptic Would Attack This Case  
  A skeptic insisting "always stratify" would argue:  
  1. **"Unmeasured confounders are everywhere! You can’t prove parental pressure exists."**  
     - *Rebuttal*: True, but collider bias is mathematically inevitable if the stratifier is causally downstream of exposure. Here, tutoring directly affects midterm scores (e.g., via fatigue surveys). Ignoring this guarantees bias.  
  2. **"The subgroups show consistency! Why ignore that?"**  
     - *Rebuttal*: Consistency is spurious. The collider makes high-pressure students "look good" in subgroups (e.g., only high-pressure students who pass midterms despite tutoring are superstars). This masks tutoring’s true harm.  
  3. **"Pooled data is confounded—that’s why it shows harm!"**  
     - *Rebuttal*: Yes, pooled is confounded (by parental pressure), but stratification adds *new* bias. The "fix" is worse: it turns true harm into false protection.  

  ---

  ### Why This Breaks the Reflex  
  **Simpson’s paradox doesn’t mean "pooled is always lying."** Here:  
  - Pooled estimate is biased but directionally correct (true harm, pooled shows harm).  
  - Stratified estimates are *more wrong* (true harm, strata show protection) due to collider bias.  
  **Lesson**: Stratify only when the variable is a confounder (causes exposure/outcome), not when it’s a consequence (collider).  

  > *No numbers fudged: Simulated data obeys causal constraints. True effect derived from potential outcomes under tutoring (Y=1) vs. control (Y=0), with parental pressure balanced.*
