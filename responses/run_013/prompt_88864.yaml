  ### First Problem: REU (Risk-Averse) Prefers Safer, EU Prefers Riskier  
  **Options:**  
  - **A:** 49 or 51, each with 50% probability.  
  - **B:** 0 or 101, each with 50% probability.  

  **Utility:** Linear, so utility = money.  

  **EU Calculation (straight probabilities):**  
  - EU(A) = (0.5 × 49) + (0.5 × 51) = 24.5 + 25.5 = 50  
  - EU(B) = (0.5 × 0) + (0.5 × 101) = 0 + 50.5 = 50.5  
  → EU maximizer prefers **B** (50.5 > 50).  

  **REU Calculation (risk-averse, using r(p) = √p):**  
  Rank outcomes worst to best.  
  - **A:** Outcomes = 49 (worst), 51 (best).  
    - Cumulative: F₁ = 0.5 → r(0.5) = √0.5 ≈ 0.707  
    - Weights: w₁ (for 49) = 0.707, w₂ (for 51) = 1 - 0.707 = 0.293  
    - REU(A) = (49 × 0.707) + (51 × 0.293) ≈ 34.643 + 14.943 = 49.586  
  - **B:** Outcomes = 0 (worst), 101 (best).  
    - Cumulative: F₁ = 0.5 → r(0.5) ≈ 0.707  
    - Weights: w₁ (for 0) = 0.707, w₂ (for 101) = 0.293  
    - REU(B) = (0 × 0.707) + (101 × 0.293) ≈ 0 + 29.593 = 29.593  
  → REU maximizer prefers **A** (49.586 > 29.593).  

  **Why they disagree:**  
  The risk-averse REU overweighted the worst outcome (49 in A, 0 in B) using r(p) = √p > p. The catastrophic loss in B (getting 0) is penalized heavily, while A’s tight spread is less penalized. If r were linear (r(p) = p), REU = EU, so no disagreement.  

  ---

  ### Second Problem: REU (Risk-Averse) Prefers Riskier, EU Prefers Safer?  
  **Result:** Impossible with strong risk aversion (r(p) ≥ p everywhere).  

  **Why:**  
  - Strong risk aversion (r concave, r(p) ≥ p) always makes REU ≤ EU for any lottery.  
  - If EU(A) > EU(B), then REU(A) ≤ EU(A) and REU(B) ≤ EU(B).  
  - But REU(A) > REU(B) could still hold if A is safer.  
  - To have EU maximizer prefer **A** (safer) and REU maximizer prefer **B** (riskier), we’d need:  
    - EU(A) > EU(B) (so EU prefers A),  
    - REU(B) > REU(A) (so REU prefers B).  
  - However, REU(B) ≤ EU(B) < EU(A) and REU(A) ≤ EU(A), so REU(B) > REU(A) implies EU(B) > EU(A) (contradiction).  

  **Verification:**  
  Suppose A is safer with higher EU, B is riskier with lower EU. Strong risk aversion makes REU discount B’s upside more than A’s, so REU(B) < EU(B) < EU(A) ≈ REU(A). REU cannot prefer B.  

  ---

  ### Third Problem: Weakened Risk Aversion  
  **Relaxation:** Only require r(0.5) > 0.5 (turns down fair 50/50 bets), no r(p) ≥ p everywhere.  

  **Result:** Possible.  

  **Example:**  
  - **A:** 0 (40%), 0 (40%), 101 (20%) → EU(A) = (0.2 × 101) = 20.2  
  - **B:** -10 (50%), 50 (25%), 50 (25%) → EU(B) = (0.5 × -10) + (0.5 × 50) = -5 + 25 = 20  

  **EU maximizer prefers A** (20.2 > 20).  

  **REU Calculation with custom r (r(0.5) = 0.6, r(0.8) = 0.9):**  
  - **A:** Outcomes ranked: 0, 0, 101.  
    - Cumulative: F₁ = 0.4 → r(0.4) = ? (not needed), F₂ = 0.8 → r(0.8) = 0.9, F₃ = 1  
    - Weights: w₃ (for 101) = 1 - 0.9 = 0.1  
    - REU(A) = 101 × 0.1 = 10.1  
  - **B:** Outcomes ranked: -10, 50, 50.  
    - Cumulative: F₁ = 0.5 → r(0.5) = 0.6, F₂ = 0.75 → r(0.75) = ? (not needed), F₃ = 1  
    - Weight for -10: w₁ = r(0.5) = 0.6  
    - Weight for each 50: Not needed; REU(B) = (-10 × 0.6) + 50 × [1 - 0.6] = -6 + 20 = 14  
    - (Simplification: 50 appears in all better states, so REU(B) = -10×r(0.5) + 50×(1 - r(0.5)) = 50 - 60×r(0.5))  
  → REU(B) = 50 - 60×0.6 = 50 - 36 = 14  
  → REU maximizer prefers **B** (14 > 10.1).  

  **Shape of r needed:**  
  - r(0.5) = 0.6 > 0.5 (satisfies weak risk aversion).  
  - r(0.8) = 0.9 (above identity, but not required everywhere).  
  - Example: r(p) = 1.2p for p ∈ [0, 0.5] (r(0.5)=0.6), r(p) = p + 0.1 for p ∈ [0.5, 0.8], r(p) = 0.5(p - 0.8) + 0.9 for p ∈ [0.8, 1] (r(1)=1).  
  - Not concave (e.g., convex in [0, 0.5]), but r(0.5) > 0.5 suffices for rejecting 50/50 bets.  

  **Why it works:**  
  REU underweights A’s high outcome (101) due to r(0.8)=0.9 (low weight 0.1), but B’s mild loss (-10) isn’t penalized as harshly (r(0.5)=0.6), making B appear better to REU despite lower EU.
