prompt: |-
  I run the staff wellbeing and resilience programme for a large ambulance trust, and I've hit something I can't fix with another slide deck. You're a philosopher who works on Hellenistic ethics and also keeps an eye on how Stoicism gets sold to organisations, so you know the difference between Epictetus and what ends up on a laminated card. I want you to think carefully and brainstorm a bit before you design anything.

  Here's the problem. Every cohort, some line manager asks me: 'fine, so what do I actually do on Monday when someone on my team is in bits about something?' Our current answer is basically focus on what you can control, and I've started to think that slogan is doing harm.

  What I want from you is a decision procedure — something a line manager or one of our coaches can actually run, in about twenty minutes, sitting with a distressed employee, with no philosophy training and no ability to look anything up.

  Before you design it, work out what the ancient idea actually is, because I don't trust my own version. I'm told the real point is narrower than the slogan: it's about what is up to us, meaning our judgements and our choices, and it is not advice to stop trying to change your circumstances — the Stoics still expected you to act. I'm also told the popular version quietly adds a third category, things you can influence, which wasn't in the original. And there's a puzzle underneath the whole thing: if the Stoics thought everything was fated, whats left of up to us? You don't have to settle that, but the procedure shouldn't fall apart if a line manager asks you about it. Also, whatever the procedure says about the employee, it has to say something about the manager, whose own judgements are just as much in scope.

  Deliverable: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because what's left is values rather than facts, and which steps are really judgement calls dressed up as procedure. Constraints: twenty minutes, no training, the line manager signs off on whatever comes out of it, and the employee is entitled to see anything written down about them.

  Then run it on three cases: (1) a paramedic whose rota means she barely sees her kids and who has been told by me, cheerfully, that the rota is outside her control; (2) a man being ground down by a team leader who is close to the director, so HR won't touch it; (3) a group of staff who want to campaign over a shift pattern everyone agrees is unsafe. Case two is the one I'm worried about — I suspect your procedure will tell him something he doesn't want to hear, and I'd rather you be honest about that than fudge it.

  Finish by telling me where this misfires and what it can't do. British English, please, no references or reading lists, and dont invent quotes from Epictetus or anyone else — paraphrase instead.
reasoning: |-
  Hmm, the user runs a staff wellbeing programme for an ambulance trust and has hit a wall with their current approach to Stoicism. They're frustrated that "focus on what you can control" is causing harm, especially when line managers ask what to actually do with distressed employees. They want a practical decision procedure rooted in proper Stoic philosophy, not the watered-down versions often sold to organisations.

  I need to unpack what the Stoics actually meant by "what's up to us." It's narrower than the popular slogan - only our judgments and choices, not circumstances. The popular version added a third category (influence) which wasn't original. There's also that tension with fate: if everything is determined, what space is left for agency? I should address this implicitly in the design.

  The user wants a 20-minute tool for untrained managers, with clear questions, stopping points, and transparency. Cases include a paramedic missing her kids due to rotas, someone being bullied by a protected manager, and staff wanting to campaign about unsafe shifts. Case 2 will likely give uncomfortable advice - I mustn't fudge that.

  Constraints: British English, no fake quotes, no references. The output must work when written down and shared with the employee. Crucially, it must apply to the manager's judgments too - they're not outside the system.

  The core insight: Stoicism isn't passivity. Managers often misuse "control" to shut down concerns ("rota's not your problem, move on"). But Epictetus would say: your judgment about the rota IS your problem. The employee can choose how to respond, even if they can't change the rota itself. And the manager must examine their own judgments about HR being untouchable.

  For the tool: Start broad ("What's the specific distress?"), then isolate the judgment fueling it. Distinguish: 1) External events (never fully controllable), 2) My actions/choices (always "up to me"), 3) Outcomes of actions (only influenceable, not guaranteed). The key pivot is Q4: "What's the next right action?" This forces agency without promising success.

  For Case 2 (bullying): The employee can't control the team leader or HR. But they control documenting incidents, seeking allies, or ultimately choosing to transfer. The manager must confront their own judgment that "nothing can be done" - perhaps they can quietly support documentation. It'll feel unsatisfactory, but the alternative is false hope.

  Limitations: This won't fix systemic issues like rotas. It might feel cold if the employee needs empathy first. And it assumes rationality - not suitable for acute crisis. Still, it prevents the worst harm of misapplied Stoicism: blaming the distressed for caring about things "outside their control."

  Finally, British phrasing: "rotas" not "schedules," "whingeing" as a verb. No laminates, no Marcus Aurelius misquotes. Just clear, actionable steps that respect both philosophy and frontline reality.
answer: |-
  Right, let's cut through the laminate. The core Stoic insight isn't "ignore what you can't control." It's: **Your well-being depends *only* on how you judge and choose regarding events, never on the events themselves.** What's "up to us" (*eph' hēmin*) is *exclusively* our faculty of judgement (*hēgemonikon*) and the choices/assents that spring from it. Everything else – our body, reputation, possessions, other people's actions, external events – is "not up to us" (*ouk eph' hēmin*). The "influence" category is a modern add-on; the ancients focused on the stark division: *only* your judgements/choices are truly yours. Fate? Events are determined, but *how you meet them* – your judgement and choice – is where your freedom and responsibility lie. The manager's judgements are just as much "up to them" as the employee's.

  **The "Up To Us" Decision Procedure (20-Minute Version)**

  **Goal:** To help the distressed person (and the manager) identify what aspects of the situation are *truly* within their power to govern (judgements, choices) and to move towards constructive action aligned with their values, without false promises or toxic positivity.

  **Instructions for Manager:**
  1.  **Listen First (3-5 mins):** Let the employee describe the problem. Acknowledge their distress ("This sounds really tough," "I can see this is weighing heavily on you"). *Don't offer solutions yet.*
  2.  **Run the Questions:** Use the framework below. Guide, don't dictate answers. Write key points *with the employee present*, using their words where possible. They see everything written.
  3.  **Focus on Action:** The output *must* include at least one concrete, immediate action step the employee *chooses* to take regarding what *is* up to them. The manager *must* also identify an action step for themselves if relevant.
  4.  **Timebox:** Stick to 20 mins. If stuck, note the sticking point for follow-up (coach, HR, etc.).

  ---

  **The Procedure: Questions, Answers, & Stops**

  1.  **"What is the specific event or situation causing distress *right now*? Let's name it clearly."**
      *   *Sufficient Answer:* A concrete description of the external circumstance (e.g., "My rota means I miss bedtime 4 nights this week," "Team Leader X criticised my report unfairly in front of the team again today," "The new shift pattern means 16-hour gaps between shifts regularly").
      *   *Stop if:* Vague distress ("Everything's awful," "I just can't cope"). Gently ask: "What *one specific thing* happened recently that brought this feeling up strongest?" If still vague, pause: "It sounds like things feel overwhelming right now. Let's focus on getting some immediate support [e.g., suggest break, EAP contact, agree to revisit later]." *Procedure ends.*
      *   *Judgement Call:* Is the description focused on the *external event* (good) or purely on their *internal state* (needs redirecting)? Avoid letting it become just venting.

  2.  **"What is your strongest *judgement* or *belief* about that situation? What does it mean to you?"** (e.g., "It's unfair," "It means I'm a bad parent," "They're out to get me," "It's dangerous and no one cares").
      *   *Sufficient Answer:* A statement capturing their interpretation/assessment of the event's meaning or impact. This is the core "judgement" within their *hēgemonikon*.
      *   *Crucial Note:* This step identifies the *internal* source of distress. The distress comes *from this judgement*, not solely the external event. The manager should note this internally but *not* say "Your judgement is wrong" at this stage.
      *   *Stop if:* Employee cannot articulate a judgement beyond restating the event. Probe gently: "What makes this *so* difficult/hurtful for you?" or "What does this situation say to you, or make you feel about yourself/others?"

  3.  **"Looking at this situation and your judgement about it, what aspects are *completely outside anyone's power to change right now*? (e.g., past events, other people's fixed decisions, immutable facts like geography/time)."**
      *   *Sufficient Answer:* Identification of concrete, fixed external factors (e.g., "The rota is published," "Team Leader X's personality/relationship with the Director," "The physical need for sleep between shifts," "HR's current stance").
      *   *Stop if:* Employee insists *everything* is changeable (unrealistic) or *everything* is fixed (helplessness). Manager must gently challenge: "Is [specific aspect] truly something you or I can *guarantee* will change *right now*?" or "While we can't change X, could we look at Y?"
      *   *Judgement Call:* Manager must be realistic about organisational constraints without shutting down hope prematurely. Focus on *current immutability*, not eternal impossibility.

  4.  **"What aspects are *truly 'up to you'* – meaning, what *choices* do you have about your own actions, reactions, or judgements *right now*?"** (e.g., "How I *respond* to the rota," "What I *do* with my feelings about Team Leader X," "How I *prepare* for fatigue," "Whether I *assent* to the belief 'I'm a bad parent'").
      *   *Sufficient Answer:* Identification of specific thoughts, choices, or behaviours the employee *can* control: their *assent* to judgements (Q2), their chosen *actions* (next question), their *focus*.
      *   *Stop if:* Employee says "Nothing" or only focuses on changing others/externals. Probe: "Even if you can't change X, what *can* you choose about how you *meet* X today? Can you choose your next small action? Can you choose to question that belief [from Q2]?" If truly stuck, manager *must* model it: "One thing *I* see that's up to you might be..." (Offer options, not commands).
      *   *The Core Pivot:* This shifts focus to agency. The Manager *must* also ask themselves silently: *"What judgements/choices are 'up to me' here as manager?"* (e.g., My belief about HR? My choice to listen? To escalate? To support documentation?).

  5.  **"Given what's 'up to you', what is *one specific, constructive action or choice* you can make *today or this week* that aligns with your values (e.g., care for family, professionalism, safety, integrity)? What would 'meeting this well' look like for you?"**
      *   *Sufficient Answer:* A concrete, actionable step the employee commits to, focused on their sphere of control (e.g., "I will schedule a special video call with kids on late nights," "I will document the next incident with Team Leader X factually," "I will speak to my GP about fatigue management," "I will draft my concerns about the shift pattern clearly"). It must be *their* choice.
      *   *Manager's Action:* **Crucially:** The manager *must* identify and state aloud *one specific action or choice* they will make based on what is 'up to *them*' (e.g., "I will explore potential rota swaps for you within policy," "I will review the incident log with you weekly," "I will take your documented concerns to the Wellbeing Lead," "I will reflect on my own assumptions about HR"). *Signs off on this.*
      *   *Stop if:* No actionable step emerges. Revisit Q4 options. If still nothing, state: "Our focus today is identifying an immediate step *within your control*. Let's agree you'll [suggest small self-care/admin step] and we'll revisit this aspect with [Coach/HR/Union] on [date]." *Procedure ends with follow-up.*
      *   *Judgement Call / Values:* Defining "constructive" and "values-aligned" is inherently value-laden. The manager guides towards agency and integrity but *must* respect the employee's stated values unless unethical. The *choice* of action belongs to the employee.

  **Output:** A written note (agreed by both) stating:
  1.  The specific distress trigger (Q1).
  2.  The core judgement/belief identified (Q2 - optional to include if employee agrees).
  3.  Key immovable external factors (Q3).
  4.  **Employee's Committed Action** (Q5 - the core output).
  5.  **Manager's Committed Action** (Q5 - essential).
  6.  Any agreed follow-up.

  ---

  **Running the Cases:**

  1.  **The Paramedic & Rota:**
      *   Q1: "Missing kids' bedtime 4 nights this week due to the published rota."
      *   Q2: "It means I'm failing as a parent / My job is ruining my family life."
      *   Q3: The published rota is fixed for *this week*. HR's slow process. The need to work.
      *   Q4: Her judgements about failing. Her choices on how to connect *despite* the rota. Her choice to explore longer-term solutions. Her choice to communicate with kids/partner.
      *   Q5: **Employee:** "I will record a short bedtime story video for each night I'm away and set up a quick morning video call." **Manager:** "I will check the policy on rota swap requests and bring you the form tomorrow. I will also raise the aggregate impact of these patterns at the next rota planning meeting."
      *   *Why it works:* Moves from helplessness (rota fixed) to agency (how she connects). Manager acts on systemic issue.

  2.  **The Man & the Team Leader (The Hard One):**
      *   Q1: "Team Leader X publicly ridiculed my report again today, citing minor errors. This happens weekly."
      *   Q2: "They're deliberately trying to humiliate me and push me out. HR won't help because of their connection. I'm powerless."
      *   Q3: Team Leader X's behaviour/personality. The Director's relationship with TL X. HR's current inaction. Past incidents.
      *   Q4: His judgement "I am powerless." His choice to document. His choice to seek support (manager/union/EAP). His choice to explore alternatives (transfer?). His choice in how he internally responds/reacts in the moment.
      *   Q5: **Employee:** "I will factually document the next incident, including date/time/witnesses/quotes, and send it only to you confidentially by the end of the week. I will also book a session with EAP to talk about coping strategies." **Manager:** "I will review your documentation confidentially. I will seek discreet advice from the Wellbeing Lead on pathways *despite* the HR situation. I will schedule a weekly 10-min check-in with you specifically for this issue."
      *   *Why it's hard/true to Stoicism:* It doesn't promise to fix TL X or HR. The employee's power lies *only* in his response: documenting (creating evidence/agency), seeking support, managing his own state. The manager acts *within their sphere* (support, advice, monitoring) without overpromising. It accepts the harsh reality while finding actionable agency. The employee may *not* want to hear his power is limited to his response, but it's honest and prevents false hope or passive suffering.

  3.  **The Group & Unsafe Shift Pattern:**
      *   Q1 (Group Rep): "The new 'compressed' shift pattern results in regular 16-hour gaps, which everyone, including managers, agrees is unsafe due to fatigue."
      *   Q2: "The organisation values efficiency over safety / Our concerns are being ignored."
      *   Q3: The *current* implemented shift pattern. Senior leadership's decision (for now). The physical realities of fatigue.
      *   Q4: Their choice to campaign *constructively*. Their choice to gather evidence (fatigue reports, near misses). Their choice to manage their *own* fatigue as best possible *while campaigning*. Their judgement "We are ignored" (can they test this?).
      *   Q5: **Group Rep (for the group):** "We will collate a log of fatigue-related incidents or near-misses from the last month linked to this pattern, anonymised, and present it to you by Friday." **Manager:** "I will formally present your collated evidence and request an urgent risk assessment review to my line manager and the Wellbeing Lead by next Monday. I will also advocate for interim mitigation measures during the review."
      *   *Why it works:* Accepts the pattern is *currently* fixed (Q3) but focuses group energy on constructive, evidence-based action within their control (documenting, presenting). Manager commits to using their position to escalate responsibly. It channels the desire for change into an actionable step.

  ---

  **Where This Misfires & Limitations:**

  1.  **Acute Crisis/Impaired Rationality:** If someone is in acute psychological crisis, severely traumatised, or cognitively impaired (exhaustion, distress), this rational, step-by-step approach is inappropriate. Use crisis protocols first. This is for *distress*, not breakdown.
  2.  **Deeply Embedded Beliefs:** If the core judgement (Q2) is deeply entrenched (e.g., chronic low self-worth, trauma response), 20 minutes won't shift it. The procedure highlights it but needs follow-up (coaching, therapy).
  3.  **Systemic Issues:** This addresses individual *responses* to systemic problems (rotas, bullying culture, unsafe systems). While manager actions *can* feed systemic change, this tool alone won't fix broken systems. It mitigates harm and fosters agency *within* them, which is vital but insufficient long-term. The Trust *must* act on the patterns revealed by aggregated outputs.
  4.  **The "Influence" Gap:** Purists might argue it ignores the grey area of "influence." The procedure implicitly covers it: actions (Q5) are *attempts* to influence, but their success is not guaranteed (Q3). The focus stays on the *choice* to act well, not the outcome. Some managers/employees might crave more "influence" discussion; remind them influence attempts *are* actions (covered in Q4/Q5), but outcomes remain external.
  5.  **Feeling Dismissed:** Poorly facilitated, Q3/Q4 can feel like "just suck it up." **This is why Q1 (listening/acknowledging) and the manager's own action (Q5) are NON-NEGOTIABLE.** It validates the pain *before* examining agency. The manager's action demonstrates shared responsibility.
  6.  **Fate/Determinism Question:** If asked: "The Stoics believed events are fated, but our choices matter. Think of it like bad weather: you can't stop the storm (fate), but you *can* choose to put on a coat, take shelter, or learn to dance in the rain (what's up to you). Your choice determines if you get soaked or not." (No quote, just the analogy).
  7.  **Values Conflict:** If the employee's proposed action (Q5) is harmful or against policy, the manager must say so and work to find an alternative within bounds. The procedure relies on shared basic values (wellbeing, professionalism, safety).

  **Final Note:** This tool doesn't offer easy fixes. It trades the potentially harmful oversimplification of "control the controllable" for the more demanding, but authentically Stoic, path of identifying true agency (judgement/choice) and taking responsibility for it, even amidst difficult externals. It forces the *manager* into the same accountability. Success depends entirely on the manager's skill in compassionate facilitation. It's a compass, not a map.
