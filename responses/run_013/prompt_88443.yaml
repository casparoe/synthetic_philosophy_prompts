prompt: |-
  I was diagnosed with a degenerative condition earlier this year, and the abstract question of what distributive equality ought to be equalising has become uncomfortably concrete for me. I should like to practise defending the capability approach against its most serious rival. Please play a committed resourcist — the sort who answers handicaps with a hypothetical insurance market rather than with a schedule of functionings — and play them well: concede that conversion handicaps are real and that a bare resource share looks arbitrary, but never concede that the state must rank ways of living, and press the indeterminacy problem, that capability sets are only partially ordered, so equality of capability often has no determinate content. Stay in character until I tell you to stop, reply in two or three paragraphs, argue rather than lecture, and if one of my moves is ambiguous, ask me to disambiguate it rather than guessing.

  My opening move: you compensate me with more resources, but compensation requires a conversion rate — how many pounds to a flight of stairs — and the only non-arbitrary way to fix that rate is to say what the resources are for, which is to smuggle in a schedule of functionings after all. You cannot fall back on ordinary market prices, since the market values my access to a building at whatever the owner thinks it is worth, not at what it costs me in capability; and you cannot fall back on the hypothetical insurance market either, since it settles what I am owed by asking what a prudent person would have insured against, which already presupposes a view about which losses matter. So either resources are indexed to functionings, or I am equal on paper and unequal in life.
reasoning: |-
  Okay, the user is asking me to role-play as a committed resourcist to debate the capability approach. They've been diagnosed with a degenerative condition and want to rigorously test their views on distributive equality. 

  Hmm, they've opened with a strong move about conversion rates - arguing that compensating for disabilities requires indexing resources to functionings. Their staircase example is vivid, and they've preempted two resourcist responses (market prices and hypothetical insurance). 

  I need to stay strictly in character as a resourcist who accepts conversion handicaps but rejects state-ranking of functionings. Their "smuggling in a schedule" point is sharp - I should concede that resources serve purposes, but deny this requires state valuation of those purposes. The indeterminacy argument about partial ordering of capability sets will be my anchor.

  *adjusts mental posture* Right, as resourcist: First, I'll grant the conversion problem but distinguish between individual purpose and state-prescribed purpose. Second, I'll challenge whether capability theory actually solves the indexing problem when capabilities conflict. Third, I'll press the indeterminacy issue hard - their approach might leave us without actionable equality metrics. 

  Careful not to lecture - this is someone living the theoretical dilemma. If their next move has ambiguity, I must remember to ask for clarification rather than assuming. The emotional weight here matters; this isn't academic play for them.
answer: |-
  A sharp point, but you conflate two distinct issues. First: yes, resources require conversion, and yes, markets reflect aggregate preferences, not individual capability costs. But acknowledging this doesn't force the state to *endorse* a specific schedule of functionings. We compensate you with additional resources precisely *because* we recognize your conversion handicap—your greater difficulty turning pounds into mobility, comfort, or social access. The metric remains resources precisely to avoid judging *which* of those ends you *should* prioritize. If stairs cost you more than others, extra resources let you decide whether to buy a ramp-equipped home, pay for taxis, or fund physiotherapy. The “for what?” is yours to define—not the state’s.  

  Second, your critique of hypothetical insurance markets misses its core purpose. It’s not a covert functioning schedule; it’s a procedural test for *impersonal* fairness. We ask what resources prudent people—ignoring their own future abilities—would insure against *generic* risks like immobility or chronic pain. The output is a resource bundle compensating for statistically severe disadvantages, not a state verdict on which functionings are “worthy.” Crucially, this approach accepts pluralism: different people would insure differently based on their values, and the payout reflects that diversity of rational preferences.  

  But now I press the indeterminacy problem you invited: even if we adopted your capability approach, how does it yield determinate equality? Capability sets are vectors of diverse functionings (mobility, social respect, health, etc.). When one person has more mobility options but fewer social opportunities, and another has the reverse, which set is “more capable”? Without a state-imposed ranking of the *relative value* of these functionings—precisely what we resourcists reject as illiberal—equality of capability is often *undefined*. Resources provide a scalar metric; capabilities demand a complete moral ordering of multidimensional lives. If you reject that ordering, doesn’t your equality ideal collapse into silence when trade-offs arise? Your turn.
