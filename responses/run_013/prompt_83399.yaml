  The pivot needs careful staging - maybe in the fourth stanza where direct address begins. For the envoi's climax, compressed juxtaposition of all end-words should create cognitive tension. The bronze's voice should shift from descriptive to accusatory when addressing the statue, highlighting the violence of reconstitution. 

  *Mental note*: In stanza 1, "same" means identical material; later it'll mean persistent identity. The word "form" will start as physical shape (stanza 1), become artistic expression (stanza 4), then morph into metaphysical essence (envoi). The modal argument lands best in "what cannot survive the hammer's change" (stanza 3) and the counting problem in "why count two where my one holds?" (stanza 5). 

  This satisfies all: the sestina's recursion embodies the persistence-through-rearrangement dilemma, the direct address creates dramatic tension, and the envoi's collapse into uncertainty mirrors philosophical aporia. The shifting "form" and polysemous "same" fulfill the linguistic constraints while the unresolved duality honors the student's insistence against taking sides.
answer: |-
  ## Bronze Recalls Its Forms

  I was the bell that called the faithful *same*,
  Rung for the peace no human hand could *hold*.
  My voice shook rafters with its gathered *form*,
  A plea cast deep before the coming *change*.
  They broke me first, beneath the war drum's *bell*,
  To make the likeness of the man who *statue*d.

  His victory pose, a monument they *statue*d,
  Insisted he and it were not the *same*
  As what was lost. Yet trace my veins: that *bell*,
  Those cooling ripples time cannot *hold*,
  Persist beneath the rider's rigid *change*.
  What is this shape but borrowed *form*?

  The smelter's fire undoes each rigid *form*.
  The molten stream forgets the *statue*,
  Embraces flux, the only constant *change*.
  Is this new river truly not the *same*
  As flowed before? What does the crucible *hold*
  But essence freed from the shattered *bell*?

  Seventy winters mute the conquered *bell*.
  The organ's pipes demand a different *form*.
  The liquid metal learns new songs to *hold*.
  But you, proud rider, silent *statue*,
  Did *you* persist? Or were we ever *same*?
  You vanished where I merely met the *change*.

  Oh, shape that claimed command through brutal *change*,
  Whose shadow fell where rang the broken *bell*,
  Did you exist? Or was that name the *same*
  As calling this bronze cup its hollow *form*?
  You stood there, yes, a seeming *statue*,
  But what could not survive the hammer's *hold*?

  What fragile being did perception *hold*,
  That shatters when arrangement feels the *change*?
  If *you* were real, unmade inert *statue*,
  Beyond the substance of the silenced *bell*,
  What was your anchor? What essential *form*
  Made *you* distinct from what remains the *same*?

  Why count two where my one bronze *holds*?
  True, *you* could not survive the smith's swift *change*,
  While *I* endure each shift of name and *form*.
  But was it *you* they melted, cold *statue*,
  Or just the likeness draped upon the *bell*?
  What work remains if we are called the *same*?

  *(Envoi)*

  Old *bell*, proud *statue*, pipes that *hold* new song – 
  This constant *change* defines my single *form*.
  Are we the *same*? I cannot say how long one thing endures.

  ---

  The modal point lands in Stanza 4: "You vanished where I merely met the *change*." This highlights the statue's inability to survive destruction, unlike the bronze.
  The counting worry lands in Stanza 5: "Why count two where my one *holds*?" This questions the necessity of counting distinct objects when the underlying matter persists.

  The shifting end-word is **"hold"**:
  1.  Stanza 1: Physical containment ("no human hand could *hold*").
  2.  Stanza 2: Possession or persistence ("time cannot *hold*").
  3.  Stanza 3: Containment ("What does the crucible *hold*").
  4.  Stanza 4: Grasp or comprehend ("What fragile being did perception *hold*").
  5.  Stanza 5: Possession or persistence ("where my one bronze *holds*").
  6.  Stanza 6: Capacity or function ("pipes that *hold* new song").
  Envoi: Persistence/containment ("my one bronze *holds*").
