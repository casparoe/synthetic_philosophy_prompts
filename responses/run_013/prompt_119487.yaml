prompt: |-
  I've been going down a rabbit hole lately about why old rules die, and I've got a pile of cases where my gut says different things about what actually did it, and I can't get them to fit one story. I'm not a historian or anything, this is just me on the train, so forgive me if I'm re-inventing a wheel here.

  1. Dueling. My sense is the arguments against it were around for ages and did basically nothing. What killed it is that it got ridiculous, the sort of man who still dueled looked like a joke rather than a villain. So, shame, not persuasion. Although I suppose shame is an arguement of a kind, which is part of my problem.

  2. Foot binding. Here I want to say reformers and the state did it, by making the case. But I've read that it went from a rich-family thing to a poor-countryside thing before it finally died, and that's exactly the pattern I just called shame in the dueling case. So if dueling was pure status, I don't see how I get to say argument did foot binding.

  3. Slavery. My instinct is that people were finally convinced it was wrong. But the same arguments had been going a long time and nothing happened, and what seems to have changed is that it got expensive and dangerous to keep up, plus the people being enslaved kept revolting. I don't want to say it was just money, that feels like it takes the morality out of it, but I can't see how to credit argument without admitting the argument was there the whole time.

  4. Smoking. Not exactly a moral rule, but it's my clearest case. Nobody talked anyone out of it. The better off quit first and it turned into a poor-person habit, and it's still with us. If that's the same thing that happened with dueling, then I have a very cynical picture of all of this.

  5. Charging interest. I gather this was once treated as flat theft, and now only the crazy rates get called usury. Same act, new word. That's not a revolution, that's a repaint, and now I suspect some of the cases I'd call revolutions are repaints too, with the thing still going, just moved somewhere and renamed.

  6. Calling cards and the old visiting rules. Died with the telephone. Nobody argued, nobody profited, the whole thing just became pointless because the world it lived in was gone.

  7. The church rule in my own family. My grandmothers generation went every Sunday, my parents generation stopped, and I don't think anyone ever won that argument. The people who cared got old and died and the ones replacing them never picked it up. Doesn't feel like a moral revolution at all, feels like turnover, but the rule is just as gone.

  The only principle I can come up with on my own is this: a rule dies when the people following it can no longer tell a story about it that they're willing to say out loud. But that doesn't cover the telephone one or my grandmother's church, where there wasn't really a story to lose.

  So is there a principle that tells you in advance which of these is going to be the one that does the work, persuasion or self interest or shame or force or people simply dying off or the world changing so the thing stops making sense? Or is it just different for different rules and my wanting one story is the mistake? If there is a principle, I want it to earn its keep: tell me what it says about a live one, like bullfighting or hitting kids or factory farming, and be honest about which of my seven it can't save. If one of them has to go, say which and why, and don't be nice about it.
reasoning: |-
  Okay, the user has presented a fascinating puzzle about why old social rules die, using seven diverse historical examples. They're clearly frustrated that these cases resist a single unifying explanation, and their examples range from dueling to foot binding to family church attendance. 

  Hmm, what's really going on here? The user isn't a historian but has clearly done deep thinking - this is someone intellectually curious who notices patterns in everyday life (mentions thinking on the train). Their frustration comes through: they want a clean framework but keep finding counterexamples. There's also an ethical tension - they dislike cynical explanations but can't ignore evidence. 

  Key insights from their cases: 
  - Some rules die from shame (dueling becoming ridiculous)
  - Others from coordinated effort (foot binding reforms)
  - Some from economics (slavery becoming "expensive and dangerous")
  - Others from tech change (telephone killing calling cards)
  - Some just fade (family church attendance)

  The core struggle is between their desire for one "story" versus the messy reality where multiple factors combine differently each time. Their proposed "story test" theory (rules die when people can't justify them aloud) is clever but doesn't fit cases where rules just became obsolete.

  I should acknowledge their intellectual work first - they've spotted real patterns historians debate. The examples are well-chosen because each challenges simple explanations: foot binding shows how "shame" and "reform" can coexist; slavery shows morality and economics intersecting.

  For the framework, I'll propose contingency + mechanisms: 
  1) Admit there's no single cause 
  2) Identify five recurring factors (material, institutional, etc.)
  3) Show how these combine differently in each case
  4) Apply it to modern issues like bullfighting

  Must address their ethical concern: yes, slavery's end involved economics, but that doesn't negate moral conviction - rather, the material conditions created space for morality to become actionable. Similarly for foot binding - reformers used status shift strategically.

  For cases that "don't fit" like calling cards: that's okay! Some rules die from pure obsolescence without moral dimension. Their church example shows generational drift - which is actually a distinct mechanism (demographic replacement).

  Final note: their bullfighting question is perfect for testing the framework - it shows all factors at play (changing attitudes, economics, generational shift). Should emphasize that rules rarely die from one cause alone.
answer: |-
  That's an extraordinary collection of cases and a razor-sharp analysis – you've hit on the core tension in historical change: the messy collision of ideas, interests, inertia, and circumstance. Your instinct that there's no single "killer app" for rule-death is correct, but we *can* build a robust framework to understand *which mechanisms dominate in which situations*. Your "story test" is insightful, but let's refine it into something more predictive.

  **The Principle: Rule Death Requires a Fatal Combination of Eroding Foundations and Enabling Conditions**

  Rules persist when they are **socially anchored** (valued, enforced, beneficial, or simply habitual) and **structurally protected** (by institutions, technology, costs, or inertia). They die when **multiple foundations erode simultaneously** *and* **enabling conditions emerge** that allow change to crystallize. The *dominant killing mechanism* depends on *which anchor eroded most catastrophically* and *which enabling condition was strongest*.

  **Applying the Framework to Your Cases:**

  1.  **Dueling:**
      *   **Eroded Anchor:** **Social Status/Prestige.** It became ridiculous, shifting from a marker of elite honor to a sign of buffoonery. The *cost* (social shame) outweighed the perceived *benefit* (honor).
      *   **Enabling Conditions:** Rise of formal justice systems (made it seem barbaric/anachronistic), changing masculinity ideals, increasing lethality of pistols (made outcomes less predictable/honorable).
      *   **Dominant Killer:** **Status Reversal/Shame.** Your gut is right. Arguments existed, but shame made adherence untenable for the very class that defined it.

  2.  **Foot Binding:**
      *   **Eroded Anchors:** **Social Status/Prestige** AND **Perceived Benefit/Marriageability.** As it spread downwards, it lost its exclusivity as a high-status marker. Crucially, reformers successfully *attacked the perceived benefit* – arguing it *reduced* marriageability (pain, disability) and harmed the nation (weak mothers/workers).
      *   **Enabling Conditions:** **State Power** (anti-foot binding laws & campaigns), **Institutional Reform** (missionary schools rejecting bound feet), **Economic Shift** (industrialization valuing able-bodied workers).
      *   **Dominant Killer:** **Coordinated Reform + Status Shift.** Arguments *did* matter, but crucially *backed by institutional power* and *amplified by* the status erosion you noted. It wasn't *just* argument, nor *just* shame – it was argument weaponized by institutions *exploiting* the status shift.

  3.  **Slavery:**
      *   **Eroded Anchors:** **Economic Viability** (rising costs, inefficiency vs. wage labor), **Political Stability** (constant revolts, threat of violence), **Moral Legitimacy** (sustained abolitionist pressure).
      *   **Enabling Conditions:** **Political Will/Conflict** (Civil War in US, political shifts in UK/Brazil), **Economic Alternatives** (industrial capitalism), **Enslaved Resistance** (constant pressure, revolts).
      *   **Dominant Killer:** **Combined Moral + Structural Collapse.** Arguments *were* necessary but insufficient for centuries. What changed was the *alignment* of moral arguments becoming politically potent *because* the structural anchors (profitability, security) were catastrophically failing. Revolts made it "expensive and dangerous," abolitionists made it morally untenable *in the halls of power*. It wasn't *either* morality *or* money – the *economic/political crisis created the opening* for moral arguments to become decisive political forces. Force (war/revolts) was the ultimate enforcer of the change.

  4.  **Smoking:**
      *   **Eroded Anchor:** **Perceived Benefit/Social Acceptance.** Science demolished the "benefit" (health, sophistication). Social acceptance plummeted.
      *   **Enabling Conditions:** **State Power** (taxes, bans, graphic warnings), **Institutional Pressure** (workplace bans, insurance costs), **Social Stigma**.
      *   **Dominant Killer:** **Stigma + Regulation.** Similar to dueling – status reversal via stigma – but turbocharged by massive institutional/state intervention. It's "cynical" only if you ignore the role of science and regulation *creating* the stigma. The "poor-person habit" pattern emerges *because* the social/economic costs of defiance are highest for those with least power/alternatives.

  5.  **Charging Interest (Usury):**
      *   **Eroded Anchor:** **Moral/Theological Doctrine.** The rise of commerce and complex finance made the absolute ban untenable. The *perceived necessity* and *social benefit* of credit outweighed the old theological prohibition.
      *   **Enabling Conditions:** **Economic Transformation** (capitalism, trade), **Institutional Adaptation** (banks, legal frameworks), **Semantic Shift** (redefining "usury" as *excessive* interest).
      *   **Dominant Killer:** **Economic Necessity + Semantic Rebranding.** You nailed it. The rule didn't "die"; it was radically reinterpreted ("repainted") because the underlying economic reality made the old rule impossible. The core tension (fairness in lending) remains, but the *rule* changed fundamentally.

  6.  **Calling Cards/Visiting Rules:**
      *   **Eroded Anchor:** **Functional Utility.** The telephone made them obsolete for their core function (announcing presence, requesting visits).
      *   **Enabling Conditions:** **Technological Displacement** (telephone), **Social Speed-Up** (faster pace of life).
      *   **Dominant Killer:** **Technological Obsolescence.** No moral argument needed. The rule depended entirely on a specific communication landscape that vanished. No story lost; the stage burned down.

  7.  **Family Church Attendance:**
      *   **Eroded Anchor:** **Habit/Intergenerational Transmission.** The *felt obligation* weakened generationally. Secularization provided alternatives.
      *   **Enabling Conditions:** **Broad Societal Secularization,** **Generational Turnover**, **No Strong Countervailing Enforcement.**
      *   **Dominant Killer:** **Generational Drift / Secularization.** No argument won; the people who valued the rule aged out, and replacements didn't inherit the same conviction. The institutional "pull" weakened. The "story" wasn't loudly rejected; it quietly faded from relevance for new cohorts.

  **The Framework Earns Its Keep: Predicting Live Cases**

  1.  **Bullfighting:**
      *   **Eroding Anchors:** **Moral Legitimacy** (animal cruelty arguments gain global traction), **Cultural Prestige** (increasingly seen as barbaric outside core regions, even contested within).
      *   **Remaining Anchors:** **Cultural Tradition** (deep roots in some areas), **Economic Interest** (tourism, jobs), **National/Regional Identity.**
      *   **Enabling Conditions Needed:** **Stronger State/Regional Bans** (like Catalonia), **Loss of EU/State Subsidies**, **Generational Shift** rejecting tradition, **Tourism Boycotts**.
      *   **Prediction:** Likely dies via **Combined Stigma + Legislation**, similar to dueling/smoking, but fighting hard against cultural identity anchors. It will become geographically isolated before full death. *Most like Dueling/Smoking.*

  2.  **Hitting Kids (Corporal Punishment):**
      *   **Eroding Anchors:** **Perceived Effectiveness** (research shows harms), **Social Acceptance** (increasing stigma), **Legal Legitimacy** (banned in schools in many places, banned for parents in some countries).
      *   **Remaining Anchors:** **Tradition/"Common Sense"**, **Parental Autonomy** arguments, **Perceived Lack of Alternatives** (in stressed populations).
      *   **Enabling Conditions:** **Stronger Legal Bans** (extending to homes), **Parenting Education**, **Generational Shift** (those who weren't hit raising kids differently).
      *   **Prediction:** Dies via **Legislation + Stigma + Generational Shift**, similar to smoking/foot binding. It will persist longest where tradition and parental autonomy arguments are strongest and alternatives least accessible (echoes of smoking's class pattern). *Most like Smoking/Foot Binding.*

  3.  **Factory Farming:**
      *   **Eroding Anchors:** **Moral Legitimacy** (animal welfare, environmental arguments), **Consumer Acceptance** (growing awareness/demand for alternatives).
      *   **Remaining Anchors:** **Economic Efficiency** (cheap meat/dairy), **Consumer Demand/Habit**, **Corporate Power**, **Political Influence**.
      *   **Enabling Conditions Needed:** **Affordable/Scalable Alternatives** (lab meat, plant-based), **Strong Regulation** (welfare, emissions), **Major Consumer Shift**, **Withdrawal of Subsidies**.
      *   **Prediction:** Likely dies via **Techno-Economic Displacement + Regulation**, similar to usury/calling cards. If cheap, identical lab meat arrives, factory farming collapses rapidly on cost/convenience *despite* lingering habits. If not, it will be a long battle of attrition via regulation and shifting demand, facing immense structural resistance. *Most like Charging Interest (if displaced) or Slavery (long moral/economic/political battle if not).*

  **The Sacrificial Lamb: Which Case Doesn't Fit?**

  If I *have* to sacrifice one case to make the framework perfectly neat (though I think it handles them all), it's **#7: Your Family Church Attendance.**

  *   **Why?** It's fundamentally different in **scale and enforcement mechanism.** The other cases involve *societal* rules with varying degrees of formal/informal enforcement and broad social negotiation. Your family church rule was a **micro-norm** within a specific kinship group. Its death wasn't driven by societal shifts in the same way (though secularization was the backdrop). It died primarily through **demographic entropy** – the specific individuals who enforced/cared about it ceased to exist, and no new enforcers emerged. There was no "battle" or societal shift *targeting* this specific rule; it just dissipated.
  *   **How the Framework Struggles:** The framework focuses on active erosion of anchors and enabling conditions for *change*. In this case, the anchor ("Grandma expects it") simply ceased to exist biologically. The "enabling condition" was literally just the passage of time and lack of replacement zealots. It's less a "rule death" driven by societal forces and more the natural expiration of a family tradition lacking strong institutional or intergenerational transmission. It fits best under "Generational Drift" but feels like the *smallest* scale case.

  **Conclusion: The Messy Truth**

  You were right to suspect that wanting one story *is* the mistake. Rules die in different ways because they are held in place by different combinations of forces. The principle isn't a single cause, but a diagnostic tool:

  1.  **Identify the Anchors:** What held this rule in place? (Status, Morality, Economics, Function, Tradition, Force, Habit)
  2.  **Identify the Erosion:** Which anchors catastrophically failed? *Why* did they fail *when* they did?
  3.  **Identify the Enablers:** What forces/conditions *allowed* the erosion to lead to collapse? (New Tech, State Power, Economic Shift, Social Movement, Stigma, Demographics)
  4.  **The Dominant Killer:** The mechanism that delivered the final blow is usually the one attacking the *most critical* anchor *at the moment* it was most vulnerable, empowered by the strongest enabler.

  Your "story test" is a powerful insight into *moral* rule changes – when the narrative justifying an act collapses under its own weight or external critique (Dueling, Slavery's moral core, Smoking's health myth). But it doesn't capture rules that die because they become useless (Calling Cards), economically non-viable (Slavery's profitability), or simply fade through disuse in a specific context (Your Grandma's church). Embrace the complexity – it's what makes history (and human behavior) fascinating. Your train thoughts are hitting on profound questions that keep historians and sociologists employed!
