answer: |-
  ### Exam Question  
  **Section A: Answer the following question (20 marks, 60-70 minutes)**  
  > "Assume a socialist planning board possesses:  
  > (a) A perfect preference-elicitation technology that captures every household’s complete ordinal ranking of all goods;  
  > (b) Unlimited computing power; and  
  > (c) Perfectly compliant managers who execute instructions without shirking, misreporting, or principal-agent slack.  
  >  
  > In this scenario, does any core element of the *economic calculation critique* of socialism survive? Identify which strand(s) of the critique (e.g., computational, epistemological, institutional) each part of your answer engages with, and explain why it persists or dissolves under these conditions. Critically evaluate whether this setup resolves the debate."  

  ---

  ### Model Answer (≈700 words)  
  The hypothetical planning board appears to neutralize key objections to socialist planning—preference/data gaps (Hayek), computational limits (Barone/Lange), and incentive failures (later neoclassical critiques). Yet **Mises’ *logical* critique and Hayek’s *epistemological* critique retain force**, while the setup inadvertently highlights Lange’s misunderstood role.  

  **1. Mises’ *logical* critique survives (Valuation without markets)**  
  Mises’ core argument (1920) was not about *data* or *computation* but the *impossibility of rational valuation* without private ownership and exchange. Capital goods under socialism lack genuine prices because no real market process exists to competitively bid for resources. The planning board’s perfect preference rankings provide *cardinal* utility data, but these are static valuations for consumption goods. For **capital/intermediate goods**, no mechanism generates opportunity costs reflecting trade-offs in *alternative uses*. Unlimited computing power allows solving equilibrium equations, but without entrepreneurs bidding for resources amid scarcity, prices are synthetic imitations. *This strand targets the institutional absence of exchange*, rendering "prices" arbitrary accounting units, not emergent scarcity signals.  

  **2. Hayek’s *epistemological* critique adapts but persists (Dynamic interpretation)**  
  Hayek (1935, 1945) conceded that *static* equilibrium could theoretically be solved computationally. However, his deeper concern was the **dispersal of *tacit*, context-specific knowledge** (e.g., local conditions, technological possibilities). Perfect preference elicitation captures *expressed* preferences but not latent, unarticulated knowledge (e.g., a worker’s insight into machine repair or a consumer’s future needs). Unlimited computing operates on fixed inputs, but economic coordination requires *interpreting* fragmented knowledge in *real-time* through entrepreneurial discovery. The board’s managers execute orders perfectly but cannot *generate* new solutions—only implement predefined commands. *This strand emphasizes the market’s role in dynamically synthesizing knowledge*, which no central entity can replicate.  

  **3. Lange’s model is misrepresented by the setup**  
  Lange (1936) proposed **decentralized trial-and-error** with a planning board setting *initial* prices, then iterating based on shortages/surpluses reported by *local managers*. The board here monopolizes all data and computation, contradicting Lange’s reliance on market-like feedback. Ironically, this setup resembles the centralized model Lange opposed. His solution *required* local autonomy and price adjustments—features nullified by perfect upfront data.  

  **4. Limitations of the stipulations**  
  - **Static vs. dynamic efficiency**: The board optimizes for known preferences/technology but cannot *adapt* to shocks (e.g., new innovations or scarcities) without market-driven discovery.  
  - **Valuation of capital**: Even with perfect data, capital valuation remains artificial without competitive bidding. Mises’ "common unit" problem endures.  
  - **Hayekian knowledge**: Tacit knowledge isn’t "elicitable"—it emerges through action (e.g., experimentation).  

  **Conclusion**: The stipulations dissolve *computational* and *principal-agent* issues but intensify Mises’ and Hayek’s core critiques. By removing markets entirely, the setup exposes socialism’s irreducible flaw: the *substitution of synthetic calculation for genuine entrepreneurial discovery*. The debate survives because the market is not an "algorithm" but a *knowledge-generating institution*.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A (18–20) vs. B (15–17) Distinction**: A answers *rigorously separate the three critiques*, precisely attribute arguments to figures, and identify *why* stipulations fail logically/dynamically. B answers correctly identify surviving critiques but blur distinctions or miss nuances (e.g., conflating Mises/Hayek, neglecting Lange’s decentralization).  

  | **Must-Hit Point**                                                                 | **Marks** | **Common Errors**                                                                 |
  |------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|
  | **1. Mises’ logical critique (no genuine capital valuation)** survives: Explains why synthetic prices lack opportunity costs from competitive exchange, even with perfect data. | 5 | Merging this with "data problems" (e.g., "planners can’t get enough info") or calling it "computational." |
  | **2. Hayek’s epistemological critique (tacit/dynamic knowledge)** persists: Distinguishes elicited preferences from undiscoverable tacit knowledge and adaptation limits. | 5 | Reducing Hayek to "dispersed data" without addressing *tacitness* or *discovery*. Blurring with Mises. |
  | **3. Correct attribution**: Treats Mises/Hayek critiques as *distinct* from principal-agent issues (which are stipulated away) and notes these are *early* Austrian arguments. | 3 | Attributing shirking/misreporting to Mises/Hayek (notably, these are post-1970s critiques). |
  | **4. Lange’s model**: Identifies that the setup centralizes planning, contradicting Lange’s trial-and-error *decentralization*. | 3 | Describing Lange as advocating "central planning without prices" (he used prices iteratively). |
  | **5. Dynamics/Innovation**: Argues that static efficiency ≠ dynamic adaptation; stipulations freeze innovation/knowledge discovery. | 4 | Only discussing static allocation, missing that markets process *change* (e.g., new tech/scarcities). |  

  ---

  ### Rationale for Design  
  - **Avoids memorization**: No dates/titles needed—students engage ideas (e.g., "logical critique" vs. "tacit knowledge").  
  - **Forces precision**: Stipulations surgically remove common objections, isolating theoretical cores.  
  - **Punishes conflation**: Marks split for confusing computation/tacit knowledge/logical critiques.  
  - **Corrects misattributions**: Explicitly rewards separating Mises/Hayek from incentive critiques and clarifying Lange.  
  - **Promotes critical analysis**: Top marks require explaining *why* survivable critiques are irreducible (e.g., "markets generate knowledge, not just allocate").
