  Okay, the user is a novelist stuck on a scene where a character's jealousy drives an action. They had a debate between their partner (philosopher-turned-lawyer) and a neuroscientist friend about whether jealousy is a real cause or just an epiphenomenon. The user wants me to referee this debate move by move and give a clear verdict for their writing.

  First, I need to unpack the six moves they reconstructed. The partner's argument (Point 1) is classic causal exclusion: neural states are sufficient causes, so adding jealousy as another cause is redundant. The neuroscientist (Point 2) counters with difference-making causation - jealousy explains variations the neural description misses. 

  Hmm, both make valid points but miss nuances. The partner is right that neural states are necessary and sufficient at the physical level, but wrong to assume this makes higher levels "epiphenomenal." The neuroscientist correctly notes causal explanations operate at multiple levels, but underplays how mental states depend on physical implementation.

  When they debate proportionality (Points 5-6), things get juicy. The partner's specificity argument has merit - sometimes neural details matter more than the jealousy label. But the neuroscientist's reductio holds water: rejecting all macro-causes leads to absurdity (poison doesn't kill, rocks don't break windows). 

  The core issue they're circling is explanatory pragmatism vs. ontological fundamentalism. For the novelist's purpose, the neuroscientist's view is more useful because fiction deals with human-scale explanations. Jealousy is real insofar as it reliably produces behavioral patterns across contexts - that's what readers connect with. 

  I should emphasize that causality isn't zero-sum. Neural mechanisms enable jealousy, which then does causal work at the psychological level. Like software running on hardware - both are essential. The novelist doesn't need quantum physics to explain a punch; they need the motive.

  Final verdict: side with the neuroscientist. Jealousy isn't a passenger - it's the driver, even if the car is made of neurons. The character's experience and the story's tension depend on treating emotions as real forces.
answer: |-
  Alright, let's break down this excellent philosophical brawl move by move. You've reconstructed it brilliantly, and the baby's timing was impeccable for dramatic tension, if not for resolution. Here's the referee's report:

  **On Point 1 (Partner: Neural Sufficiency & Exclusion):** He's *partly right but importantly incomplete*. He's correct that, *given a complete and determinate description of the brain state at time T1*, the physical laws governing those neurons seem sufficient to determine the arm movement at T2. The "exclusion" worry (why add a second cause?) is a genuine problem in philosophy of mind. Where he's incomplete is in assuming "cause" *must* mean something that *guarantees* the effect in this strict, deterministic, "once fixed, effect follows" sense. He's also assuming a very narrow, "billiard ball" model of causation where only the most fundamental physical level "really" counts. This sets up the conflict but ignores how we actually *use* causal explanations, especially concerning complex systems like minds and behavior.

  **On Point 2 (Friend: Difference-Making & Levels):** Your lab-running friend scores a solid point here. He's *largely right* about the insufficiency of the guarantee model of causation, especially for higher-level phenomena like psychology. His "difference-making" approach (stemming from thinkers like J.L. Mackie and developed in interventionist theories by Woodward) is a powerful and widely accepted alternative. It focuses on counterfactuals: "If X had been different, would Y have been different?" Applying this, "jealousy" *is* a difference-maker. If the character's jealousy (its intensity, object, or very existence) had been altered *while holding other relevant psychological/social factors constant*, the stupid action likely wouldn't have occurred, or would have been different. Crucially, he's also right that causation isn't a zero-sum competition *between levels*. Describing the same event (the neural activity culminating in the arm movement) as "neural firing pattern P" *or* "jealousy J" doesn't mean two causes are fighting; it means we have two *descriptions* of the causal process, each capturing different *aspects* of the difference-making relationship relevant to different inquiries. The neural description captures the physical mechanism; the jealousy description captures the functional role, motivation, and connection to other mental states/social contexts.

  **On Point 3 (Partner: Renaming & Fundamentality):** Here he tries to counter the levels argument but *stumbles slightly*. He's correct that difference-making alone doesn't automatically resolve *which* description is "the cause." But he misses the friend's point: we often *don't need* or *want* a single "the cause." His "fundamentality" argument (neural wins because we can intervene directly) is a *pragmatic* point about control and mechanism, not a knockdown ontological one. Yes, *currently*, we can intervene more precisely on neural states with electrodes or drugs than we can surgically target "jealousy" as such. But this reflects our current *technology and understanding*, not an inherent metaphysical priority. We intervene on "jealousy" indirectly *all the time* – through therapy, changing situations, conversations – and these interventions reliably make differences to behavior *because* they change the underlying neural states *in a way coherently described as altering jealousy*. The neural state isn't "more fundamental" in the sense of being the *only* real cause; it's the physical *implementation* of the jealousy state that does the causing at the physical level. Saying jealousy is "carried along" because it depends on the neural state ignores that the *content* of the jealousy (e.g., *who* he's jealous of, *why*) is what organizes the neural activity into a pattern that results in *this specific* stupid action rather than another.

  **On Point 4 (Friend: Fundamentality Absurdity & Generalization):** Your friend lands a powerful blow here. He's *decisively right* that reducing "real causes" only to the most fundamental physical level leads to absurd conclusions ("The economy didn't cause the recession; only specific quantum events in banks did"). This reductio ad absurdum is a standard and effective critique of strong reductionism. His point about "tools" reinforces that directness of intervention is contingent. Most importantly, he nails the key advantage of the mental description: **Generalization**. "Jealousy" is a *functional kind*. It picks out a *pattern* of internal state (with characteristic feelings, thoughts, motivations) that can be realized by *vastly different* neural states across individuals, cultures, or even species, and crucially, *leads to characteristic types of behavior* (like doing stupid, possessive things). The specific neural state Sn in Person A that causes Arm Movement M under jealousy J is physically different from the neural state Sm in Person B causing a *similar* stupid movement under *similar* jealousy. "Jealousy" captures the *common causal role* that explains why Sn and Sm *both* lead to *that kind* of outcome. The neural description alone, without the functional generalization, cannot predict or explain why *this* specific neural pattern in A and *that* different pattern in B lead to *similar* stupid actions in similar social contexts. "Jealousy" travels because it describes a stable causal-explanatory pattern.

  **On Point 5 (Partner: Proportionality & Specificity):** This is a clever counterattack and he's *partly right*. The principle of proportionality (a cause should be specific enough to match the effect, avoiding vagueness or over-generalization) *is* a legitimate consideration. Sometimes, the neural details *are* crucial. If the "stupid thing" is a *highly specific*, fine-grained movement (like picking a particular lock in a jealous rage), the precise neural activation controlling the fingers *is* the proportional cause of *that exact movement*. Saying "jealousy caused him to pick the lock" might be true, but less proportional than the neural story for explaining the *exactitude* of the movement. Where he overreaches is claiming the mental description is *always* or even *often* less proportional. For the novelist's core concern – "Did his jealousy cause him to *do something stupid*?" – "jealousy" is *highly* proportional. It directly accounts for the *type* of action (stupid, motivated by possessiveness/revenge) without irrelevant detail. The neural story, at that level of specificity, is wildly *disproportional* – it drowns the *meaning* of the act in irrelevant physical detail. Specificity *can* be a virtue, but so can generality when it captures the relevant causal pattern.

  **On Point 6 (Friend: Specificity Absurdity & Threat to Physicalism):** Your friend delivers the knockout punch here. He's *absolutely right*. Applying the specificity principle rigidly leads to absurdity: "The poison didn't kill him, only the specific metabolic cascade did"; "The rock didn't break the window, only the specific molecular bonds failing did." This *does* make ordinary causal talk systematically false, which is a massive cost. More importantly, your partner's rigor would force him to abandon *physicalism* (the view that everything is physical) in favor of *eliminativism* or *strict microphysical causation* – the view that *only* fundamental particles/fields and their interactions are real causes. This *is* a much bigger pill, denying causal efficacy to mountains, viruses, governments, software, and yes, brains considered as functional systems. Your partner *was* trying to defend a standard physicalist view (mind/brain identity), but his specificity argument, pushed hard, undermines the causal reality of *any* macro-level entity or property, including the brain as an organized system. His position becomes self-defeating for defending the causal relevance of *any* level above quarks.

  **What They're Both Missing:**
  1.  **The Causal Relevance of Content:** Both focused on states ("jealousy", "neural pattern"). But crucially, jealousy has *intentional content* ("I'm furious Bob touched my partner!"). This *content* is what makes the neural state relevant to *this specific* stupid action (punching Bob, not just flailing randomly). The content supervenes on the neural state but plays a unique causal role in explaining why *this* action was directed at *that* target. Neither fully unpacked how mental *meaning* contributes to the causal chain.
  2.  **Mechanism vs. Explanation:** They blurred the line. The neural state provides the *mechanism* (how the arm moved physically). Jealousy provides the *motivational explanation* (why *that* mechanism was engaged *now* for *this purpose*). These are complementary, not competing. We need both for a full picture, but we often prioritize one depending on the question ("How did his fist move?" vs. "Why did he punch Bob?").
  3.  **Realization & Multiple Realizability:** While touched on, the depth of how jealousy can be *realized* by many different neural substrates wasn't fully leveraged as the core reason why the mental description isn't redundant. It's precisely *because* it can be multiply realized that "jealousy" captures a causal pattern the neural description, fixed on one instance, cannot.

  **The Verdict: Side with the Neuroscientist Friend.**

  For your novel, the jealousy is absolutely doing real causal work. Here's why, grounded in the debate:

  1.  **Difference-Maker:** It passes the counterfactual test. If your character hadn't been jealous (or been jealous of someone else, or less intensely jealous), he wouldn't have done *that specific stupid thing* in that context. Changing the neural state *only* matters causally *because* it changes the jealousy (or the state described as jealousy).
  2.  **Generalization & Pattern Recognition:** "Jealousy" explains why *this* character's neural state led to *this type* of behavior, and why similar behaviors occur across diverse individuals with different neural wiring when they feel jealousy. It captures a stable, generalizable causal pattern relevant to understanding human action. The specific neural state is just one instance of that pattern.
  3.  **Proportionality (for your needs):** For explaining *why a character did something stupid motivated by possessive rage*, "jealousy" is the perfectly proportional cause. It directly accounts for the *nature* and *motivation* of the act. The neural story is wildly disproportionate – it explains the *mechanics of the arm swing* but obscures the *meaning* of the punch.
  4.  **Avoiding Absurdity:** Denying the causal efficacy of jealousy forces you to deny the causal efficacy of almost every high-level phenomenon we talk about – including the neural system itself! We *must* attribute causal powers to organized systems and their functional states to make sense of the world. Jealousy is one such state of the cognitive system.
  5.  **The Passenger Myth:** Jealousy isn't a passive passenger. It's the *functional state* the neural system is *in*. The neurons are the machinery; jealousy is the *operational mode* of that machinery that dictates *what the machinery does*. You wouldn't say the "engine braking mode" in a car is just a passenger when it slows the car down; it's the *state* the system is in that causes the specific behavior. Similarly, the jealousy *is* the brain state (under a functional description) *causing* the action.

  **So, write your scene.** The jealousy is the driving force. It’s the motivational engine, realized by neurons, that makes the stupid action intelligible, inevitable for that character in that moment, and resonant for your readers. The neurons are the how; the jealousy is the why. Both are real, but for your purpose, the why is the story. Now go make that character do something gloriously, catastrophically stupid.
