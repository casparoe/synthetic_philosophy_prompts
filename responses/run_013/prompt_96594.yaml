answer: |-
  Good morning! Look at us all here — lanterns ready, cider poured, that stubborn patch of nettles by the oak tree still winning its annual battle. It feels right, doesn’t it? This field, this light, this buzz of voices… it feels like *our* place, our moment in the long story of this town.

  We stand here because of the fierce love and hard work of folks like our Festival Committee. They’re the ones who kept the lanterns lit and the music playing year after year, even when the crowds were thin, because they believed this gathering mattered. They held onto something precious for all of us. Let’s give them a proper thanks! **[Pause for Applause]**

  Now, stories cling to a gathering like this. Stories about how far back it stretches. Eight hundred years is a powerful number. It speaks of roots deep in the earth. And roots *are* important. But sometimes… the most beautiful tree grows from a seed planted more recently, yet it becomes just as vital, just as much a part of the landscape.

  The truth about *this* particular festival, as I’ve learned digging through our own town’s records, is that it took the shape we recognize today about a hundred years ago. A passionate schoolmistress and some folks from the railway saw threads of older, smaller things – maybe a harvest custom here, a spring dance there, a lantern walk somewhere else – and they wove them together, right here, into this bigger celebration we know. That wonderful costume parade? Born from the imagination and needlework of locals back in the 1930s, wanting something special for a pageant. It wasn't dredged up from the distant past; it was made *then*, for *their* time. And look! Here we are.

  So what makes *this* tradition real? It’s not the date on its birth certificate. It’s not about how long ago the first spark flew.

  It’s real because of *this field, right now*.
  It’s real because you came.
  It’s real because generations of families have laughed here, met sweethearts here, brought their children here, remembering how *they* felt as kids.
  It’s real because the Committee kept showing up, year after lean year, keeping the flame alive.
  It’s real because we know the tunes, we recognize the faces under the lanterns, we feel that shared hum of belonging when the music starts.

  A tradition becomes true the moment it’s taken up, tended to, and passed hand to hand across the years. It becomes true through the doing, the repeating, the caring. That shared effort, that shared joy, that shared memory – *that* is its age. *That* is its depth. Those hundred years of *us* gathering here, shaping this thing together – that’s the powerful truth. It doesn't erase the older fragments woven in; it honours them by making them part of *our* living story. And it takes nothing away from anyone standing here now – it only adds. It adds the weight of all the hands that held this festival before us, and the promise of hands yet to come.

  So, what makes it real? **We do. Right now.** Every time we step into this field and add our voice, our step, our presence to the pattern.

  And that brings me to what you can do. Look around. See the young faces maybe feeling this for the first time? See the older faces holding decades of Midsummers in their smiles? This only stays real if we keep passing it on, not just as a story about the past, but as an experience *for* the future.

  So here’s your task: **Find someone new today.** Someone standing alone, someone young, someone who just moved to town. Share something. Point out where the best cider is, tell them why you love the lantern procession, teach them a line of the chorus, warn them about the nettles! Make them feel this is *their* tradition too, ready for them to pick up and carry.

  Because traditions aren’t found in dusty books; they’re built and rebuilt every time we gather, every time we welcome, every time we pass the flame. Let’s build this one strong, together, for the next hundred years.

  Happy Midsummer! Let the festival begin!
