prompt: |-
  I have read the blog-level version of this debate for years, and I want the specification rather than the survey: what any theory of imprecise credence has to deliver before I would trust it in an agent that must act on its uncertainty, update on evidence, and hand a human a single number when asked. Fix the purpose that way, then write the desiderata — the cases it must get right, the distinctions it cannot collapse, and the results it cannot contradict — each with the consideration that motivates it, marked as non-negotiable or as the taste of one camp. Include at least these: the Ellsberg choice, where a range rather than a point looks like what the evidence supports; dilation, where an observation you take to be irrelevant to X widens your interval for X, and the theory must say whether that is a discovery or a bug; the demand that the width of an interval answer to something, so that imprecision represents evidence rather than being a free parameter; a long run of evidence, where I want to know whether convergence to a point is required, permitted, or forbidden; and the moment of action, where acting on the worst case, on anything undominated, and on the best case come apart and the theory must still yield a choice. The part I most want is the incompatibility: I suspect that conditioning on the evidence, treating the interval as genuine evidential support, and never dilating cannot all hold, and I want that flagged as a result rather than smoothed over. Skip the scorecard for particular proposals; the criteria are the deliverable.
reasoning: |-
  We are building a list of desiderata for a theory of imprecise credence that must guide an agent acting under uncertainty, updating on evidence, and reporting a single number when asked. The purpose is fixed: the agent must make decisions, update beliefs, and communicate a summary of its uncertainty. We will list the cases and requirements, marking non-negotiable ones and those that are matters of taste. We focus on what the theory must deliver, not on existing proposals.

  We include at least: Ellsberg, dilation, the demand that interval width must represent evidence, long-run evidence, and the moment of action. We also highlight an incompatibility that may arise.

  Desiderata:

  1. **Ellsberg Choice (Non-negotiable):**
     - **Case:** The agent faces an urn with 90 balls: 30 red, and 60 that are either black or yellow in unknown proportion. The agent must choose between betting on red or on black. Then, between betting on red-or-yellow or black-or-yellow. The typical pattern: people prefer betting on red over black, and on black-or-yellow over red-or-yellow. This suggests aversion to ambiguity (imprecise knowledge about the black/yellow ratio).
     - **Requirement:** The theory must represent the agent's uncertainty about the black/yellow ratio with a range of probabilities (for black: [0, 2/3]) rather than a point. The agent's betting behavior must reflect the ambiguity aversion (or in some camps, the ambiguity neutrality) in a way that accounts for the observed choices. The representation of the agent's belief must capture the lack of information about the composition.

  2. **Dilation (Marked as a point of contention, non-negotiable that the theory must take a stand):**
     - **Case:** Initially, the agent has an imprecise credence for event X. Then, the agent observes an event E that is believed to be irrelevant to X (e.g., flipping a fair coin to generate E). However, after conditioning on E, the interval for X becomes wider. For example, let X be the outcome of a fair coin flip in the future, and E be the outcome of a different process (say, drawing from an urn with unknown composition) that is independent of X. After observing E, the agent's credence for X dilates to a wider interval (e.g., from [0.4,0.6] to [0.3,0.7]).
     - **Requirement:** The theory must explicitly state whether dilation is a rational response (a discovery) or a bug (an artifact to be avoided). Some camps (e.g., those emphasizing prior ignorance) may see dilation as a necessary consequence of learning about a source of ambiguity; others (e.g., those requiring stability of beliefs) may see it as a reason to reject the updating rule. The theory must not hide this issue.

  3. **Interval Width Represents Evidence (Non-negotiable):**
     - **Motivation:** The width of the interval must not be a free parameter that the agent can arbitrarily set. It must be determined by the evidence (or lack thereof). For example, complete ignorance might be represented by [0,1] (though some argue against this), while strong evidence should yield a narrow interval. The theory must provide a clear epistemic grounding for the width.
     - **Requirement:** The theory must have a rule that maps the body of evidence to the width of the interval. This rule must be such that two agents with the same evidence (and same prior constraints) should have the same imprecise credence. The width must be objectively determined by the evidence and the agent's prior state (if any).

  4. **Long Run of Evidence (Non-negotiable that the theory must specify the behavior, but the specification may be a matter of taste):**
     - **Case:** The agent observes a long sequence of conditionally independent and identically distributed outcomes (e.g., coin flips) for which the true probability is fixed but unknown. Initially, the agent has an imprecise credence (e.g., a set of priors). As data accumulates, what happens to the interval?
     - **Requirement:** The theory must specify whether the interval (a) must converge to the true probability (point), (b) may converge to a point, or (c) must not converge to a point (e.g., always reflecting some residual ambiguity). Some camps (e.g., Bayesians who allow imprecision only for finite data) require convergence to a point. Others (e.g., those who see ambiguity as inherent) may allow non-convergence. The theory must state its position.

  5. **Moment of Action (Non-negotiable that the theory must yield a choice, but the decision rule may be a matter of taste):**
     - **Case:** The agent has an imprecise credence (a set of probability functions) and must choose an action from a set of available options. The agent evaluates each action by a set of expected utilities (one for each probability function in the set). Then, how to choose? Common rules: 
          - Maximin: choose the action with the highest minimum expected utility.
          - MaxiMax: choose the action with the highest maximum expected utility.
          - Hurwicz criterion: a weighted combination of min and max.
          - E-admissibility: choose an action that is optimal under at least one probability function in the set.
          - Maximality: choose an action that is not dominated by another (i.e., there is no other action that is better under every probability function in the set).
     - **Requirement:** The theory must specify a decision rule that maps the set of probabilities to a choice (or a set of admissible choices). The rule must be well-defined and must not leave the agent paralyzed. The choice of rule may be a matter of taste (e.g., risk-averse agents might use maximin) but the theory must have one.

  6. **Incompatibility (Non-negotiable to flag):**
     - **Suspected Incompatibility:** There is a tension between conditioning (updating on evidence), treating the interval as genuine evidential support (so that the width represents the quality of evidence), and avoiding dilation. Specifically:
          - If we condition on evidence (using, say, the generalized Bayes rule for sets of priors), then dilation may occur even when the evidence is intuitively irrelevant.
          - If we avoid dilation by design (e.g., by requiring that the interval narrows when we get more information), then we may be forced to represent some states of evidence with a point even when the evidence is weak (violating the idea that the width represents the evidence).
          - Alternatively, if we insist that the interval always represents the current evidence and that we update by conditioning, then dilation must sometimes occur and we must accept it as rational.
     - **Requirement:** The theory must acknowledge this tension and state which of these it gives up. It must not smooth over the incompatibility. For example:
          - If the theory avoids dilation, then it must explain why the interval does not always reflect the evidence (e.g., by having a rule that prevents updating in a way that dilates) and what that implies about the representation of evidence.
          - If the theory allows dilation, then it must explain why dilation is acceptable even when the evidence seems irrelevant.

  We have now covered the required cases. The theory must deliver on these points to be trusted for the described purpose. The agent must be able to act, update, and report a single number (for the last, note that when asked for a single number, the agent must have a rule to pick one from the interval, e.g., the midpoint, or the value used in decision making, but that rule is part of the decision rule above or a separate reporting rule, which we didn't specify as a separate desideratum but note that the agent must have one).
answer: |-
  ### Desiderata for a Theory of Imprecise Credence  
  For an agent that must **act on uncertainty**, **update on evidence**, and **report a single number** when queried, a theory of imprecise credence must satisfy the following criteria. Each desideratum is motivated by a core purpose, with non-negotiable requirements flagged. Where divergent "camps" exist, their preferences are noted. The focus is on *what the theory must deliver*, not on specific proposals.  

  ---

  #### **1. Ellsberg Choice**  
  **Case**: An urn contains 90 balls: 30 red, and 60 black or yellow in unknown proportion. Agents prefer betting on red (known probability) over black (unknown probability), and on black-or-yellow over red-or-yellow.  
  **Motivation**: The agent’s belief about black/yellow proportions lacks evidence, so a precise probability misrepresents ignorance. A range of probabilities (e.g., P(black) ∈ [0, 2/3]) better reflects the evidential support.  
  **Non-negotiable**:  
  - The theory must represent ignorance as a non-singleton interval.  
  - It must explain ambiguity aversion (preference for known probabilities) as rational.  
  **Camp divide**:  
  - *Non-negotiable*: The interval must arise from objective evidence gaps (e.g., no information about black/yellow ratio).  
  - *Taste*: Whether ambiguity aversion is required (conservative agents) or optional (neutral agents).  

  ---

  #### **2. Dilation**  
  **Case**: Observing an event E, initially considered irrelevant to X, widens the interval for X (e.g., P(X) dilates from [0.4, 0.6] to [0.3, 0.7] after seeing E).  
  **Motivation**: Dilation tests whether imprecise updating respects independence and evidential relevance.  
  **Non-negotiable**:  
  - The theory must explicitly state whether dilation is rational ("discovery") or irrational ("bug").  
  - It must specify when dilation occurs and justify its stance (e.g., due to unrecognized dependencies).  
  **Camp divide**:  
  - *Discovery camp*: Dilation reflects discovering hidden dependencies (non-negotiable for ignorance-prior theories).  
  - *Bug camp*: Dilation violates the irrelevance intuition (non-negotiable for stability-focused theories).  

  ---

  #### **3. Interval Width Represents Evidence**  
  **Case**: An interval of [0.5, 0.5] (point) vs. [0, 1] (full ignorance) must correspond to strong evidence vs. no evidence.  
  **Motivation**: Width must be epistemically meaningful—not a free parameter—to prevent arbitrariness.  
  **Non-negotiable**:  
  - Width must be uniquely determined by the agent’s evidence.  
  - Two agents with identical evidence must have identical intervals (objectivity).  
  **Camp divide**:  
  - *Non-negotiable*: Width must tighten with accumulating evidence (no persistent intervals without justification).  
  - *Taste*: Whether [0, 1] is valid for complete ignorance (some reject this as "non-informative").  

  ---

  #### **4. Long Run of Evidence**  
  **Case**: After infinite observations of i.i.d. coin flips, the interval for P(heads) must resolve appropriately.  
  **Motivation**: Consistency with learning and convergence to truth.  
  **Non-negotiable**:  
  - The theory must specify if convergence to a point is *required*, *permitted*, or *forbidden*.  
  - It must clarify whether residual imprecision post-evidence reflects unlearnable ambiguity.  
  **Camp divide**:  
  - *Convergence required*: Frequentist coherence (non-negotiable for empiricist camps).  
  - *Convergence forbidden*: If ambiguity is ontological (e.g., underlying process is unstable).  

  ---

  #### **5. Moment of Action**  
  **Case**: Given actions A, B, and an interval for X, the undominated actions under different decision rules:  
  - *Worst-case*: Maximize minimum expected utility.  
  - *Best-case*: Maximize maximum expected utility.  
  - *Undominated*: Actions optimal under some probability in the interval.  
  **Motivation**: The theory must yield a choice without paralysis.  
  **Non-negotiable**:  
  - The theory must specify a decision rule mapping intervals to actions.  
  - It must handle cases where rules conflict (e.g., worst-case favors A, best-case favors B).  
  **Camp divide**:  
  - *Taste*: Choice of rule (worst-case for pessimists, undominated for moderates).  
  - *Non-negotiable*: The rule must be defined for all intervals and produce a non-empty choice set.  

  ---

  #### **6. The Incompatibility Result**  
  **Suspected incompatibility**: Conditioning on evidence, treating intervals as genuine evidential support, and avoiding dilation *cannot all hold*.  
  **Motivation**: Dilation arises when updating imprecise credences, even under evidentially irrelevant information. Avoiding it may force intervals to misrepresent evidence or violate Bayesian conditioning.  
  **Non-negotiable**:  
  - The theory must explicitly flag this tension.  
  - It must abandon at least one of:  
    - (a) **Generalized Conditioning**: Updating via sets of priors (e.g., natural extension).  
    - (b) **Width as Evidence**: Intervals strictly narrowing with unambiguous evidence.  
    - (c) **No Dilation**: Banning interval-widening on irrelevant evidence.  
  **Result**:  
  - If (a) and (b) hold, dilation *must* occur for some irrelevant evidence (proven in Walley’s theory).  
  - If (b) and (c) hold, conditioning must be restricted (e.g., to "stable" priors).  
  - If (a) and (c) hold, width cannot always represent evidence (e.g., intervals arbitrary).  

  ---

  ### Summary of Non-Negotiables  
  1. **Ellsberg**: Intervals for ignorance.  
  2. **Dilation**: Take a stand—rational or irrational?  
  3. **Width**: Determined solely by evidence.  
  4. **Long-run**: Specify convergence behavior.  
  5. **Action**: Define a decision rule.  
  6. **Incompatibility**: Admit which axioms are dropped.  

  The theory must resolve these while ensuring the agent can *act*, *learn*, and *report* (e.g., when asked for a single number, report the decision-critical value, midpoint, or minimize regret). Failure on any non-negotiable implies untrustworthiness for the specified purpose. The incompatibility result is unavoidable: no theory satisfies all three of conditioning, evidence-representing width, and no dilation.
