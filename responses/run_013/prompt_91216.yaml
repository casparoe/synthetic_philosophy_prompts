prompt: |-
  I run pre-departure briefings for a mid-sized engineering consultancy that posts staff, and often their spouses and children, to overseas offices for assignments of two to three years. Roughly twenty families pass through my ninety-minute session each year, I am the only person who runs it, and I have no philosophical training and no time to supply any. What they want, and what I cannot currently give them, is an answer to the question that surfaces in the first week of every posting: which of the local ways of doing things do we actually have to adopt? Tipping, queueing, jaywalking, shoes at the door, how you address a senior colleague, whether you take a gift to a dinner, whether you hold your ground in something that is not quite a line -- these are what people write to me about. My instinct is that some of it does not matter at all, that some of it you simply must do, and that I have no principled way of sorting the two. I keep running into the awkward fact that a rule can be purely conventional and still be the local form that respect takes, so that ignoring it is not merely a faux pas; and the reverse fact, that a rule can carry real moral weight for locals, because of dependencies and relationships they have and my people do not, without being anything my people owe anyone. I also have a nagging worry about standing: my people will never be in a position to know whether a local practice is uncontested or is something a good part of the country quietly resents, and they are certainly in no position to reform it. And I have never worked out what to say about the family members, who have signed no contract with anyone.

  Please write me a decision procedure I can hand out and walk through in the briefing. I want the questions to ask, in order, about a candidate convention; what counts as a sufficient answer to each; where the procedure stops with a clear comply or a clear do-not-comply; where it hands the matter to a person -- the employee, the country manager, our legal team -- because the question is not one a procedure can settle; and where the sensible move is to route around the situation rather than take a side. It has to be usable by someone with no philosophy and about ten minutes of attention, it must be honest about which of its steps are judgment calls dressed up as procedure, and it must survive the case where a local convention collides with the firm's own rules or with the law at home -- I am thinking especially of the gift and facilitation-payment customs, where I suspect the procedure is going to tell us to lose business. Open with a two-minute plain-language account of the one or two distinctions the procedure actually rests on, since I have to be able to state them myself; then the procedure; then run it on three cases: tipping in a country where cash left on the table is read as an awkward gesture rather than a kindness, a jaywalking statute that everyone including the police ignores, and the gift-to-an-official case above. For each case, give the verdict the procedure reaches and the step it turns on, and note where a reasonable employee might reach a different verdict without having misapplied it. Close by telling me what the procedure cannot do, and which single step is most likely to be gamed by someone who has already decided what they want the answer to be.
reasoning: |-
  We are building a decision procedure for an employee (and their family) to decide whether to adopt a local convention. The key distinctions we rest on are:

  1. **Morally Weighty vs. Conventionally Weighty Rules**: 
     - Some rules carry moral weight because they prevent harm, uphold fairness, or are tied to essential relationships (like not cheating or stealing). 
     - Others are primarily conventional – they are about local coordination and respect, but without a deep moral foundation. However, ignoring a conventional rule can still be disrespectful because it is the local way of showing consideration.

  2. **Standing to Judge or Reform**: 
     - As temporary visitors, employees and their families lack the social standing and context to judge which local conventions are harmful or contested. They also lack the standing to reform them. Their role is to respect the local context without endorsing every practice.

  The procedure will ask a series of questions about a candidate convention. We stop when we get a clear "comply", "do not comply", or when we decide to route around (avoid the situation) or delegate the decision.

  ---

  **Decision Procedure: "The Respectful Guest Test"**

  Ask these questions in order for the practice in question:

  1. **Is it illegal under local law?**
     - *Yes*: Do not comply. (But note: if the law is universally ignored and unenforced, see question 2.)
     - *No*: Go to question 2.
     - *Unsure*: Research or ask the country manager. If still unsure, treat as "no" for now and proceed, but note the uncertainty.

  2. **Is it illegal under the laws of your home country or against company policy?**
     - *Yes*: Do not comply. (Even if locals do it, you may face legal or professional consequences.)
     - *No*: Go to question 3.

  3. **Does the practice cause direct, significant harm to others?**
     - *Yes*: Do not comply. (Harm means physical, psychological, or severe economic harm. This is a judgment call; when in doubt, ask the country manager or legal team.)
     - *No*: Go to question 4.

  4. **Is the practice universally expected in the relevant context? (i.e., would locals be surprised or offended if you didn’t do it?)**
     - *No*: You are free to do as you prefer (but note: if there’s a chance of offense, consider routing around).
     - *Yes*: Go to question 5.

  5. **Can you easily avoid the situation without causing offense? (Routing around)**
     - *Yes*: Route around (e.g., if you don’t want to tip in a complex tipping culture, avoid services where tipping is expected; if you don’t want to take off shoes, avoid homes that require it).
     - *No*: Go to question 6.

  6. **Is the practice tied to a relationship or dependency that you are not part of? (e.g., a gift to a superior in a context where the superior is expected to provide ongoing support)**
     - *Yes*: You do not have to comply, because the practice is part of a reciprocal relationship you are not in. (But be cautious: if it’s expected of everyone, regardless of relationship, then it’s conventional and you should comply. When in doubt, ask the country manager.)
     - *No*: Comply. (It’s a conventional rule that serves as a sign of respect, and you are in the context where it is expected.)

  **Delegation Points**:
  - If at any step you are unsure about the facts (e.g., whether a practice is illegal, harmful, or expected), delegate to the country manager or legal team as appropriate.
  - If the issue involves potential harm or illegality, and the answer is not clear, delegate to legal.

  **Judgment Calls**:
  - Steps 3 (harm) and 6 (relationship) require judgment. The procedure flags these as such. When in doubt, delegate.

  ---

  **Applying the Procedure to Example Cases**

  **Case 1: Tipping in a country where cash left on the table is read as awkward (perhaps because tips are included or handed directly)**

  - Step 1: Not illegal locally -> proceed.
  - Step 2: Not illegal at home or against policy -> proceed.
  - Step 3: No direct harm -> proceed.
  - Step 4: Is it expected? The problem states that leaving cash on the table is awkward, meaning it is *not* the expected way. So, answer is *no* -> You are free to do as you prefer (but note: if the norm is to hand cash directly, then doing that would be expected. The key is to find out the expected method. If none, then no need). *Verdict: Do not leave cash on the table. Instead, either hand it directly or don't tip if it's not expected.*
  - Note: A reasonable employee might think that leaving cash is still a kind gesture and do it. But the procedure says if it's not expected (and in fact is awkward) then you are free to avoid it.

  **Case 2: Jaywalking statute that everyone including the police ignores**

  - Step 1: It is illegal (by statute) -> Do not comply? But note: the statute is ignored. So we must check: Step 1 says if it's illegal, do not comply. However, we have an exception: if the law is universally ignored and unenforced, then we treat it as not illegal in practice. But the procedure does not have an exception in Step 1 for unenforced laws. We need to adjust: Step 1 is about the letter of the law. But if the law is unenforced and ignored, then we might consider it a dead letter. However, the procedure asks for illegality under local law. So if it's illegal by statute, then Step 1 says "do not comply". This seems too strict. We must revisit the design.

    *Adjustment to Step 1*: We should add a note that if a law is universally ignored and unenforced (and not used selectively), then it is effectively not a law in practice. So we might rephrase Step 1:

    > 1. **Is it illegal under local law and enforced (or might it be enforced against you)?**
    >    - *Yes*: Do not comply.
    >    - *No*: Go to question 2.

    Now, in this case: the jaywalking law is not enforced -> so we treat as not illegal in practice -> go to Step 2.

  - Step 2: Not illegal at home or against policy -> proceed.
  - Step 3: Jaywalking might cause harm? It can, but in this context, since everyone does it, it might be done in a way that is safe. If it's done safely and is the norm, then no significant harm -> proceed. (But note: if it's unsafe, then even if everyone does it, it can cause harm. This is a judgment call. In this scenario, we assume it's safe because it's the norm and done carefully.)
  - Step 4: Is it expected? Not exactly expected, but it is the norm. The question is about not jaywalking: would locals be surprised if you didn't? If everyone jaywalks, then not jaywalking might be surprising. But the statute says you shouldn't. So there's a conflict. However, the norm is to jaywalk. So the expected behavior is to jaywalk. So Step 4: *Yes* -> go to Step 5.
  - Step 5: Can you avoid? Yes, by not jaywalking. But note: if you don't jaywalk, you might stand out and cause confusion, but not necessarily offense. However, if you are holding up a group because you refuse to jaywalk, that might be awkward. But the procedure says "without causing offense" – if it causes offense, then you cannot easily avoid. If it doesn't, then you can avoid. Let's assume you can avoid by waiting for the light. So Step 5: *Yes* -> Route around: wait for the light. 
  - *Verdict: Route around by not jaywalking if you are uncomfortable, but note that it's the norm and you might be the odd one out. Alternatively, if you are with a group and they jaywalk, it might be more offensive to refuse? The procedure says if you can avoid without offense, then route around. So if you are alone, you can avoid. In a group, you might have to explain, which could be awkward. In that case, Step 5 might be "no", then go to Step 6: Step 6 – not tied to a relationship -> comply (i.e., jaywalk). But note: jaywalking is not tied to a relationship. So if Step 5 is "no" (because avoiding would cause offense), then Step 6: *No* -> comply. 

    This case is tricky. The procedure might lead to different outcomes depending on the situation. The key step is Step 5: if you can avoid without offense, then route around. If not, then comply (because it's conventional and expected in that context).

  **Case 3: Gift to an official (which might be seen as a facilitation payment)**

  - Step 1: Check local law. In some countries, gifts to officials are illegal (bribery laws). If so, do not comply. If not, proceed. (But note: even if local law allows, Step 2 might catch it.)
  - Step 2: Is it illegal under home country law (e.g., Foreign Corrupt Practices Act for US persons) or against company policy? Almost certainly yes. *Verdict: Do not comply.*
  - Even if Step 2 were no (which is unlikely), we would proceed to Step 3: Gifts to officials can cause harm by perpetuating corruption -> so do not comply.

  So the verdict is clear: do not comply. The procedure stops at Step 2.

  ---

  **What the Procedure Cannot Do**

  1. **Resolve deep moral conflicts**: If a local practice is deeply embedded but conflicts with the employee's core values (e.g., gender roles that the employee finds discriminatory), the procedure may say to comply (if it's conventional and expected) but the employee might still feel uncomfortable. In such cases, the procedure might suggest routing around (avoiding the situation) or, if unavoidable, the employee might have to make a personal choice beyond the procedure.

  2. **Account for every nuance**: Some conventions are context-dependent. The procedure relies on the employee's ability to gather information (e.g., "is it expected?"). If the employee misjudges, the outcome might be wrong.

  3. **Deal with contested practices**: If a practice is controversial within the local society, the procedure (at Step 4) might still require compliance because it is expected by the people the employee interacts with. It cannot capture the internal dissent.

  **Most Gameable Step**

  Step 3 (harm) is the most likely to be gamed. An employee who wants to avoid a practice might overstate the harm, and one who wants to engage might understate it. That’s why we flag it as a judgment call and suggest delegation when in doubt.

  **Final Note for the Briefing**

  This procedure is a tool, not a substitute for good judgment. When in doubt, ask: your country manager, the legal team, or even long-term expats. And remember: you are a guest. When a practice doesn’t cause harm, isn’t illegal, and is expected, adopting it is a way of showing respect for your hosts.
answer: |-
  ### Decision Procedure: "The Respectful Guest Framework"  
  **Core Distinctions (Plain-Language Intro, <2 mins):**  
  Your goal is to be a **respectful guest**, not a judge or reformer. Two ideas underpin this:  
  1. **The Harm Principle**: If an action causes *direct, unjust harm* (physical, emotional, financial) to others, avoid it. Harm isn’t about discomfort—it’s about real damage.  
  2. **The Convention Principle**: Locals use customs to coordinate and show respect. You lack **standing** (social context/power) to challenge norms, even if some locals resent them. Your role: adopt harmless conventions to show goodwill, unless they conflict with hard rules (law/company policy).  

  ---

  ### The Procedure: 5 Questions in Order  
  *Ask these about any local practice (e.g., tipping, gifts, queueing). Stop at the first definitive answer.*  

  1. **Is it illegal under LOCAL law, or could it get you arrested/fined?**  
     - *Yes* → **Do NOT comply.** (Even if "everyone does it," you’re not above the law.)  
     - *No* → Go to Q2.  
     - *Unsure?* → Ask the country manager (delegate).  

  2. **Is it illegal under YOUR home-country law OR against company policy?**  
     - *Yes* → **Do NOT comply.** (E.g., facilitation payments violate most corporate policies.)  
     - *No* → Go to Q3.  

  3. **Does it cause DIRECT, UNAVOIDABLE HARM?**  
     - *Yes* → **Do NOT comply.** (Harm = clear damage: e.g., bribes that exploit the poor, unsafe practices.)  
     - *No* → Go to Q4.  
     - *Judgment call*: Harm isn’t hurt feelings—it’s tangible detriment. When in doubt, delegate to the country manager.  

  4. **Is it UNIVERSALLY EXPECTED in the situation?**  
     - *No* → **You may OPT OUT.** (If locals won’t notice or care, do what’s comfortable.)  
     - *Yes* → Go to Q5.  
     - *Judgment call*: "Expected" = locals would be confused/offended if you didn’t. Ask colleagues or expat forums.  

  5. **Can you AVOID the situation without causing offense?**  
     - *Yes* → **ROUTE AROUND.** (E.g., skip dinners if gift-giving stresses you; use taxis if jaywalking feels unsafe.)  
     - *No* → **COMPLY.** (It’s a harmless convention. Doing it shows respect; refusing insults hosts.)  

  ---

  ### Case Studies  
  **Case 1: Tipping where cash on the table is awkward (e.g., Japan)**  
  - Q1: Not illegal → Q2.  
  - Q2: Not illegal/home-law → Q3.  
  - Q3: No harm → Q4.  
  - Q4: **Not expected** (cash on table is awkward; tips are refused or handed discreetly).  
  - **Verdict: OPT OUT.** Don’t leave cash.  
  - *Step turning point*: Q4 (convention isn’t universal).  
  - *Reasonable alternative*: An employee might tip discreetly anyway (no misapplication—Q4 is a judgment call).  

  **Case 2: Jaywalking law ignored by all (e.g., Italy)**  
  - Q1: **Illegal** (by statute) → **Do NOT comply.**  
  - *But wait*: The law is ignored! Procedure says: "Could it get you fined?" If police *never* enforce it, Q1 answer is *no* → proceed to Q2.  
  - Q2: Not illegal/home-law → Q3.  
  - Q3: *Potential* harm? Only if unsafe. If locals jaywalk safely → no harm → Q4.  
  - Q4: **Expected** (not jaywalking would confuse locals) → Q5.  
  - Q5: Can you avoid? **Yes** (wait for the light).  
  - **Verdict: ROUTE AROUND.** Cross legally to avoid risk.  
  - *Step turning point*: Q5 (avoidance is easy).  
  - *Reasonable alternative*: Jaywalk with the crowd (if Q1 is deemed "no" due to non-enforcement).  

  **Case 3: Gift to an official (e.g., for permits)**  
  - Q1: Often illegal locally (bribery laws) → **Do NOT comply.**  
  - If *not* illegal locally → Q2.  
  - Q2: **Violates company policy/home law** (e.g., FCPA/UK Bribery Act) → **Do NOT comply.**  
  - **Verdict: Do NOT comply.** Lose the business.  
  - *Step turning point*: Q1 or Q2 (hard rules trump convention).  
  - *No reasonable alternative*: Compliance risks legal consequences.  

  ---

  ### What the Procedure CANNOT Do  
  1. **Resolve moral dilemmas**: It won’t tell you if a practice is "right"—only if it’s safe/respectful to adopt.  
  2. **Handle contested norms**: If 50% of locals love a custom and 50% hate it, the procedure defaults to "expected" (Q4) and may urge compliance. You lack standing to side with reformers.  
  3. **Override personal trauma**: If a convention triggers trauma (e.g., gendered greetings), Q5’s "route around" is your escape hatch—but it can’t heal the conflict.  

  ### Most Gameable Step  
  **Q3 (Harm)**: Employees who hate a practice might overstate harm; those eager to fit in might understate it. Example: Calling strict dress codes "emotional harm" to opt out. Mitigation: Delegate to the country manager when harm is debatable.  

  ---  
  **Final Note**: This isn’t philosophy—it’s risk management and respect. When in doubt: **Delegate (country manager), Avoid (Q5), or Do No Harm (Q3).** For family members? The same rules apply. They’re guests too, and the firm’s duty of care extends to them.
