prompt: |-
  I am a high school student trying to referee an argument in my ethics club. We were discussing a visiting student from a country where tipping is not customary and pedestrians cross whenever the street is clear. In her first week here, she left no tip at a sit-down restaurant, crossed against the light when no cars were coming, and cut into a long line at the cafeteria because she assumed it was just a crowd, not a queue. Two members, Maya and Jonah, disagreed about whether she did anything wrong.

  Maya said: "These aren't just local quirks. Tipping, queueing, and jaywalking are the terms on which a society coordinates, and a visitor who takes the benefits -- safe streets, paid service workers, orderly lines -- while ignoring the terms is free-riding. At minimum, she owes locals the courtesy of following visible conventions, even if she doesn't endorse them. Consent isn't the only source of obligation: when you enter someone's home, you follow their house rules even if you didn't vote on them."

  Jonah replied: "That proves too much. If convention alone created moral obligation, any oppressive or arbitrary local rule would bind visitors. She didn't consent to these norms, and some of them -- especially jaywalking laws almost no one obeys -- aren't moral rules at all. Tipping is a private transfer, not a duty; queueing is just efficient; crossing an empty street harms no one. We should distinguish morally load-bearing conventions from mere habits, and not demand that outsiders treat the second as the first."

  Maya answered: "But the examples aren't alike. Queueing is a coordination convention, tipping is a burden-shifting convention, and jaywalking is mostly a legal convention with little moral content. She can't be bound by all three in the same way, but she is bound by the first two because they affect others' expectations and burdens. She isn't being asked to adopt the norms as her own; she's being asked not to impose the costs of her noncompliance on people who follow them."

  Jonah said: "That still assumes the norms are fair. If a tip is expected because employers underpay staff, the visitor is being conscripted into fixing a labor problem she didn't create. And if the queue is just a local preference, cutting in is rude, maybe, but not immoral. There is a difference between breaking a rule and wronging a person."

  They asked me to decide, and I couldn't. Please adjudicate point by point: for each move, say whether it is clearly right, clearly wrong, or partly right, and why. Then say which side has the stronger overall position on whether everyday conventions like these are moral obligations, and on what visitors owe locals. I am especially interested in whether tipping, queueing, and jaywalking should be treated differently, and in where Maya and Jonah are talking past each other. Please do not give me a reading list or citations; I want the reasoning.
reasoning: |-
  Okay, the user is a high school student trying to referee an ethics club debate about whether visitors must follow local conventions like tipping, queueing, and jaywalking. They need a point-by-point adjudication of Maya and Jonah's arguments, then an overall verdict. 

  First, I notice the core tension: Maya frames conventions as social coordination mechanisms with moral weight, while Jonah sees them as arbitrary habits unless they directly harm others. The student specifically wants the three examples treated differently, so I can't lump them together.

  For Maya's first point: She's strong on coordination norms like queueing – when you benefit from orderliness, free-riding is unfair. But she overreaches by putting jaywalking in the same category. Jonah's counter is sharp here: equating all conventions risks justifying oppressive norms, but he dismisses coordination benefits too easily. 

  Ah, Jonah's "oppressive norms" point is valid but exaggerated – Maya isn't defending harmful customs. Still, he correctly flags that consent matters. Where he stumbles is calling tipping "just a private transfer" when it's a de facto wage subsidy system. Maya's follow-up about "burden-shifting conventions" nails this: if the visitor doesn't tip, the server bears the cost.

  Jonah's fairness argument about tipping has merit though – why should tourists fix broken labor models? But Maya's distinction between coordination vs. legal conventions is useful: queueing and tipping actively manage shared resources, while jaywalking laws here are barely enforced social noise.

  Biggest insight: They're talking past each other on what "moral obligation" means. Maya means relational duties (don't undermine systems people rely on), Jonah means universal wrongs (like harming others). That's why Jonah keeps saying "no one was hurt!" while Maya insists "the system was undermined!"

  For the verdict... Maya wins on queueing (free-riding on others' restraint is unfair) and tipping (shifting burdens onto workers is exploitative). Jonah wins on jaywalking (empty-street crossing has no victim). Overall, Maya's framework better captures how conventions glue society together, but Jonah usefully checks blanket enforcement of unjust norms.

  The student's hidden need? Probably tools to dissect real-world conflicts beyond this case. I'll emphasize the coordination/burden/harm distinctions so they can apply this to new examples.
answer: |-
  Here's a point-by-point adjudication of Maya and Jonah's arguments, followed by an overall verdict:

  ### Maya's Points
  1.  **"These aren't just local quirks... free-riding."**
      *   **Partly Right.** She correctly identifies tipping and queueing as **coordination conventions** essential for social functioning. Benefiting from others' adherence (orderly lines, service expecting tips) while violating the rules *is* free-riding. Queueing is a prime example – her cutting in undermines the system everyone else uses to fairly distribute a scarce resource (service time). Tipping, as practiced in the US, is a crucial part of service worker compensation; not tipping directly shifts the burden of paying the worker onto other patrons or the underpaid worker. **Partly Wrong:** Jaywalking (crossing an empty street) is fundamentally different. It lacks the coordination element and direct burden-shifting of the others. Calling it "free-riding" on safe streets is a stretch when no safety is compromised.

  2.  **"At minimum... house rules."**
      *   **Mostly Right.** The core principle – that visitors have a **pro tanto** (defeasible) obligation to respect prominent local conventions as a matter of courtesy and reciprocity, especially when violating them disrupts coordination or burdens others – is sound. The "house rules" analogy is apt for norms like queueing and tipping which manage shared social "spaces." Consent isn't required for basic respect of the local social fabric you are temporarily inhabiting. **Caveat:** The obligation isn't absolute and can be overridden if the rule is deeply unjust or harmful (which these generally aren't).

  3.  **"But the examples aren't alike... burden-shifting convention..."**
      *   **Clearly Right.** This is Maya's strongest point. Distinguishing the conventions is crucial:
          *   **Queueing (Coordination):** Essential for fair access. Violation (cutting in) directly takes unfair advantage of others' restraint.
          *   **Tipping (Burden-Shifting):** Deeply embedded in labor economics. Not tipping means the worker absorbs the cost of the service provided, effectively making them subsidize the visitor's meal. The visitor benefits from the service *knowing* the tip is expected compensation.
          *   **Jaywalking (Legal/Mild Coordination):** Primarily a legal rule with weak moral force when violated safely (empty street). Disruption to coordination or burden on others is minimal/nonexistent. Maya implicitly concedes its lesser moral weight.

  4.  **"She isn't being asked... costs of her noncompliance..."**
      *   **Clearly Right (for Queueing & Tipping).** This perfectly captures the moral issue. Noncompliance isn't just "different"; it imposes tangible costs:
          *   **Queueing:** Costs others time and undermines fairness.
          *   **Tipping:** Costs the server expected income.
          *   **Jaywalking (safely):** Imposes no discernible cost on others.

  ### Jonah's Points
  1.  **"That proves too much... would bind visitors."**
      *   **Partly Right.** He rightly notes that convention alone **cannot** create an indefeasible moral obligation. Unjust or harmful conventions (e.g., segregation laws) *shouldn't* bind visitors. **Mostly Wrong:** He misrepresents Maya. She isn't arguing *all* conventions bind absolutely; she argues for a *defeasible* obligation based on reciprocity and avoiding harm/burden within systems *others* rely on. His "slippery slope" ignores her implicit distinction between functional coordination norms and oppressive rules.

  2.  **"She didn't consent... aren't moral rules at all."**
      *   **Partly Right.** Consent isn't the sole source of obligation here; reciprocity, fairness, and avoiding harm matter more in this context. He's **Clearly Right** about jaywalking – safely crossing an empty street lacks significant moral content. **Partly Wrong/Misapplied:** This point is weak against queueing (a clear fairness/coordination issue) and tipping (a burden-shifting issue). Calling tipping "private" ignores the systemic reliance on it and the worker's expectation. Calling queueing "just efficient" ignores its role in establishing fairness.

  3.  **"We should distinguish... habits..."**
      *   **Partly Right.** Distinguishing conventions *is* important. **But:** Jonah fails to adequately apply his own distinction. Queueing and tipping *are* "morally load-bearing" in their contexts due to the burdens noncompliance imposes. He incorrectly dismisses them as "mere habits" or "local preferences," underestimating their functional and ethical significance.

  4.  **"That still assumes... labor problem..."**
      *   **Partly Right.** He raises a valid concern about the **structural injustice** potentially underlying tipping. A visitor *might* reasonably object to being forced to subsidize a broken labor system. **But Mostly Wrong Here:** While the *system* might be problematic, the immediate moral failing is towards the *worker* who provided service expecting the established compensation. Refusing to tip in this context primarily punishes the worker, not the system. Opting out isn't a meaningful protest; it's exploiting the worker. The visitor benefits from the low menu price *because* tips are expected.

  5.  **"Cutting in is rude, maybe, but not immoral... wronging a person."**
      *   **Mostly Wrong (for Queueing):** Cutting into an established queue *is* wronging specific people – everyone behind the point of insertion. It unfairly takes time from them. It's more than rudeness; it's a violation of fairness in resource allocation. **Partly Right (for Jaywalking):** Safely crossing an empty street against the light might be illegal and perhaps rude (ignoring convention), but it doesn't "wrong" a specific person in a morally significant way.

  ### Where They Talk Past Each Other
  1.  **Scope of "Moral Obligation":** Jonah equates "moral obligation" primarily with *universal moral wrongs* (like harming someone). Maya uses it more broadly for *contextual obligations of fairness and reciprocity* arising from participating in a cooperative system, even if the system itself isn't a universal moral imperative.
  2.  **Weight of Convention:** Jonah heavily discounts the moral significance of functional social coordination itself. Maya emphasizes the real-world harms (lost time, lost wages) caused by violating such conventions, giving them inherent moral weight *in that context*.
  3.  **Burden-Shifting:** Jonah largely ignores or minimizes the *cost* noncompliance imposes on others (workers losing wages, queuers losing time). Maya centers this cost imposition as the core moral issue.
  4.  **Consent vs. Reciprocity:** Jonah leans heavily on lack of consent. Maya argues consent is less relevant than reciprocity – taking the benefits of a system implies an obligation not to undermine it for others.

  ### Overall Verdict

  *   **On whether everyday conventions are moral obligations:** **Maya has the stronger position, but requires nuance.** Conventions like queueing and tipping *can* create contextual moral obligations for visitors **specifically because violating them imposes unfair burdens or costs on others within a cooperative system the visitor is benefiting from.** This obligation is defeasible (it can be overridden by stronger moral concerns, like opposing injustice) and depends on the nature of the convention. Jonah is correct that convention *alone* doesn't create a universal moral rule, but he underestimates the moral significance of fair participation and burden avoidance within established, functional systems.
  *   **On what visitors owe locals:** Visitors owe locals the **courtesy of respecting prominent conventions that facilitate coordination and prevent harm or unfair burden-shifting.** This is not about blind obedience or endorsing the norm, but about avoiding actions that exploit the system or directly disadvantage individuals relying on it. Maya's "house rules" analogy is apt for queueing and tipping.
  *   **On treating the examples differently:**
      *   **Queueing:** Strongest case for obligation. Violation directly exploits others' cooperation for personal gain (unfair time saving). **Clear moral failing for a visitor.**
      *   **Tipping:** Strong case for obligation *within the specific cultural context*. Not tipping directly harms the worker who provided service based on the established compensation model. While the system might be flawed, the visitor's obligation is primarily to the worker they directly interacted with and benefited from. **Significant moral failing for a visitor.**
      *   **Jaywalking (safely):** Weakest case. Violation imposes no tangible harm or burden on others and lacks coordination significance. It might be illegal and mildly discourteous, but lacks the moral weight of the others. **Not a significant moral failing for a visitor.**

  **Conclusion:** Maya presents the more compelling overall framework. Her key insight – that violating coordination and burden-shifting conventions like queueing and tipping imposes unfair costs on others – is morally significant. Jonah correctly pushes back against blind conformity and highlights potential injustice within systems, but he fails to adequately address the *immediate, contextual harm* caused by noncompliance in these specific cases. The visitor's actions regarding tipping and queueing were morally problematic; safely jaywalking an empty street was not.
