  First, I need to outline the desiderata for any adequate theory. The user emphasized clarity on what a theory should deliver before evaluating existing ones. They mentioned Austin, Searle, Strawson, and Grice, so I should ensure the criteria cover the tensions between these approaches. 

  The user’s deep needs: They’re stuck on how to critically engage without a framework. They need a structured set of criteria to anchor their analysis. Also, they want to identify irreconcilable conflicts between desiderata to show why no theory satisfies all, which is key for their argument. Highlighting which criterion is most "lethal" to mainstream theories will help them position their critique.

  I’ll start listing the desiderata. They must cover both explicit and implicit acts, so institutional and intentional aspects. For example, the difference between misfires (institutional failure) and abuses (intentional failure) is crucial. Then, the performative/constative collapse—Austin’s initial distinction that later blurred. The "hereby" test issue: it works for both promises and statements, so a theory must explain that without special treatment. 

  Parasitic uses like theater or jokes need explanation—why they’re non-serious. Indirect acts (e.g., "Can you pass the salt?" as a request) require understanding how context shifts force. Uptake is vital for Strawson but contested by Searle. Non-verbal acts (gestures, signatures) challenge intentionalist views. Novel acts test institutional rigidity. And the act vs. consequence distinction, like promising vs. its effects.

  Now, conflicting pairs: Institutional Anchoring vs. Generative Flexibility. Searle’s conventionalism handles existing institutions but fails at new acts. Strawson’s intentionalism allows novelty but struggles with institutional acts like declaring a defendant guilty. That’s a core tension.

  The most lethal requirement might be Parasitic Non-Seriousness. Searle’s conventionalism dismisses non-serious acts as non-acts, which feels ad hoc. Strawson and Grice might handle them via intentions, but uptake in theater is complex. This requirement challenges all major theories.

  For the theories: Searle’s conventionalism fails Generative Flexibility and Parasitic Non-Seriousness. Strawson’s intentionalism struggles with Institutional Anchoring and Uptake Necessity’s strength. Gricean reduction falters on Illocutionary Primacy and Institutional Anchoring, reducing force to intentions too simplistically.

  The user needs this to structure their paper’s critique, showing why each theory falls short and where the field’s tensions lie. Highlighting the conflicts and the lethal criterion gives them a solid foundation to argue rather than summarize.
answer: |-
  Here are the core desiderata for an adequate theory of illocutionary force (including performatives), motivated by key phenomena and categorized by negotiability. Following this, I address your specific requests regarding conflicts, lethal requirements, and major theories.

  ### Core Desiderata for a Theory of Illocutionary Force

  1.  **Distinction: Failure vs. Defect (Infelicities)**
      *   *Requirement:* The theory must distinguish between an act *failing completely to occur* (misfire) and an act *occurring but being defective* in some way (abuse). It must explain the *type* of condition violated (e.g., preparatory, sincerity, executive).
      *   *Motivation:* Austin's core observation: Saying "I promise..." without sincerity (abuse) is different from saying it to a dog (misfire). The act of promising *happens* in the first case but is broken; it *doesn't even happen* in the second.
      *   *Negotiability:* **Non-negotiable.** Any plausible account must handle this basic taxonomy of things going wrong.

  2.  **Performative/Constative Collapse**
      *   *Requirement:* The theory must explain how *all* utterances, including statements ("constatives"), are fundamentally *actions* (illocutionary acts) performed *in* speaking, dissolving any deep metaphysical distinction between "performatives" and "constatives".
      *   *Motivation:* Austin's own conclusion: Stating, warning, promising, etc., are all things we *do* with language. The "performative formula" is just an explicit marker, not a different kind of utterance.
      *   *Negotiability:* **Non-negotiable.** This collapse is foundational to Speech Act Theory itself. Denying it reverts to a pre-Austinian view.

  3.  **Explicitness & the "Hereby" Test:**
      *   *Requirement:* The theory must explain the function and limits of explicit performative formulas ("I hereby V...") and the "hereby" test, including why it *can* felicitously apply to assertions ("I hereby state that...").
      *   *Motivation:* The apparent paradox: Explicit performatives seem unique, yet the "hereby" test highlights that *any* illocutionary act can, in principle, be made explicit. Explicit performatives are just one way to perform an act, not a distinct class.
      *   *Negotiability:* **Non-negotiable.** A theory must account for this pervasiveness of explicit marking potential.

  4.  **Parasitic/Non-Serious Uses (Etiolation):**
      *   *Requirement:* The theory must account for utterances in fiction, poetry, soliloquy, jokes, and acting, explaining why they typically lack "full" illocutionary force (e.g., an actor saying "I promise" on stage doesn't *actually* promise) *without* simply dismissing them as irrelevant exceptions.
      *   *Motivation:* These uses borrow the *form* of serious acts but lack their conventional consequences or speaker commitment. They are pervasive and challenge theories relying solely on conventional form or speaker intention.
      *   *Negotiability:* **Minimally Negotiable.** While the *explanation* can vary significantly (intention, convention, suspension of rules), a theory that *cannot* account for their difference from serious use is inadequate.

  5.  **Indirect Speech Acts:**
      *   *Requirement:* The theory must explain how an utterance with one apparent illocutionary point (e.g., a question: "Can you pass the salt?") can successfully and conventionally function as a different act (e.g., a request).
      *   *Motivation:* Ubiquity in communication. Requires explaining the interplay between literal meaning, context, convention, intention, and hearer inference.
      *   *Negotiability:* **Non-negotiable.** Any plausible theory of natural language use must handle indirectness.

  6.  **Uptake & Recognition:**
      *   *Requirement:* The theory must specify the role of the hearer's understanding (uptake) in the *success* or *failure* of the illocutionary act. Is uptake *constitutive* of the act, or merely a frequent consequence?
      *   *Motivation:* If a warning isn't *taken as* a warning, did it fail? Conversely, can an act succeed if utterly misunderstood? Addresses the interpersonal dimension.
      *   *Negotiability:* **Highly Negotiable.** This is a major fault line (Searle vs. Strawson). A theory must take a *position*, but the *strength* of uptake's role is contested. (Non-negotiable that the theory *addresses* it).

  7.  **Non-Verbal & Non-Intentional Execution:**
      *   *Requirement:* The theory must account for illocutionary acts performed non-verbally (a nod for "yes", a signature enacting a contract), by institutions, or even by machines/scripts lacking conscious intentions (e.g., a judge's recorded verdict played automatically, a "Wet Paint" sign).
      *   *Motivation:* Illocutionary force extends beyond conscious, verbal utterances by individuals. Signing a contract *is* an act; the sign has force.
      *   *Negotiability:* **Non-negotiable.** A theory limited to conscious verbal acts is demonstrably insufficient.

  8.  **Generative Flexibility (Novel Acts):**
      *   *Requirement:* The theory must explain how genuinely new types of illocutionary acts can be created and successfully performed *without* relying on pre-existing, fully codified conventions.
      *   *Motivation:* Language and social practices evolve. New rituals, declarations, or informal acts emerge ("I vibe with that," "We're vibe-checking this plan"). Overly rigid conventionalism struggles here.
      *   *Negotiability:* **Negotiable.** The *mechanism* (intention + uptake, analogical extension, implicit convention creation) is debated, but a theory claiming *all* acts require *explicit prior* codification is implausible.

  9.  **Illocutionary vs. Perlocutionary Distinction:**
      *   *Requirement:* The theory must clearly distinguish the *illocutionary act itself* (e.g., warning) from its *consequences* (perlocutionary effects - e.g., alarming, causing to run away).
      *   *Motivation:* Fundamental to Austin's framework. You can successfully warn someone (illocution) without them believing you or acting (perlocution). A theory collapsing the distinction loses explanatory power.
      *   *Negotiability:* **Non-negotiable.** This distinction is core to isolating the object of study.

  10. **Institutional Anchoring:**
      *   *Requirement:* The theory must explain the role of social institutions, conventions, rules, and norms in grounding the possibility and felicity conditions of *many* illocutionary acts (e.g., marrying, sentencing, declaring war, promising).
      *   *Motivation:* Many acts *only* work within specific social frameworks. You cannot declare war unless you hold a specific institutional position.
      *   *Negotiability:* **Negotiable in Scope.** The *extent* to which *all* acts require institutions is debated (core Searle vs. Strawson/Grice), but the *existence* and importance of institutionally grounded acts is undeniable. A theory ignoring them is inadequate.

  ### Addressing Your Specific Requests

  1.  **Conflicting Requirements Pair:** The most significant tension lies between **Institutional Anchoring (IA)** and **Generative Flexibility (GF)**.
      *   **Horn 1 (Prioritize IA):** Theories leaning heavily on codified conventions (Searle) excel at explaining institutionally embedded acts (marrying, sentencing) and provide clear felicity conditions based on rules. However, they struggle profoundly with **GF**. How can a genuinely *new* act type emerge if it requires prior codified rules? They often must stretch "analogy" or "implicit convention" thin or deny the novelty.
      *   **Horn 2 (Prioritize GF):** Theories emphasizing speaker intention and hearer recognition (Strawson, Gricean) handle **GF** and novel/informal acts well and explain indirectness via inference. However, they struggle with **IA**. How does mere intention + uptake create the force of a judge's sentence or the validity of a signed contract? They risk reducing institutional power to interpersonal psychology, missing the constitutive role of social structure. Explaining etiolation (e.g., why the actor *can't* marry) purely via intentions is also strained.

  2.  **Most "Lethal" Requirement:** **Parasitic/Non-Serious Uses (Etiolation)** does the most to rule out popular accounts.
      *   **Why it's lethal:** It directly challenges the core mechanisms proposed by major theories. Searle's conventionalism struggles to explain why the *conventions* of theatre suspend the force without an *ad hoc* "non-seriousness" rule. Pure Gricean intention-based accounts struggle because the actor *intends* the audience to understand the *fictional* promise, and the audience *does* recognize it – yet no real promise occurs. Strawson's uptake-centric view faces a similar problem: uptake happens for the fictional act. Theories that rely on "real-world" consequences fail because many serious illocutions also lack immediate consequences. Etiolation forces theories to confront the complex interplay of context, intention, convention, and suspended commitment in a way that exposes their limitations. Most theories handle it awkwardly or by stipulation.

  3.  **Brief Assessment of Major Approaches:**
      *   **Searle (Conventionalism):** Strong on **IA, Infelicities (as rule violations), Distinction (Ill/Perloc)**. Weak on **GF, Parasitic Uses** (treated as derivative/exceptions), **Non-Verbal/Non-Intentional** (if lacking institutional backing), **Uptake** (sees it as consequence, not constitutive). **Explicitness/Collapse** handled via rules for declaratives. **Indirect Acts** handled via inference rules, sometimes awkwardly.
      *   **Strawson (Intention + Uptake):** Strong on **GF, Indirect Acts, Parasitic Uses** (via complex intentions), **Uptake** (as constitutive). Weak on **IA** (institutional power reduced to mutual recognition?), **Non-Verbal/Non-Intentional** (machines/lack of intention problematic), **Infelicities** (less structured than rule-based). Handles **Collapse** well.
      *   **Gricean Reduction (Force to Audience-Directed Intention):** Strong on **GF, Indirect Acts** (core strength). Weakest on **IA, Non-Verbal/Non-Intentional** (fails utterly for institutional acts/signs/machines), **Parasitic Uses** (intention/recognition is present for the fiction), **Distinction (Ill/Perloc)** (tends to blur them), **Infelicities** (limited framework). Struggles with **Explicitness/Collapse** and **Uptake Necessity**.

  This framework provides the critical yardstick you need. When evaluating any theory (Searle, Strawson, Bach & Harnish, Alston, etc.), ask: How well does it satisfy these desiderata? Where does it excel? Where does it falter or require awkward adjustments? Where does it land on the key tensions (IA vs. GF, Strength of Uptake)? This focus on the *criteria of adequacy* will allow you to argue substantively about the theories rather than merely summarizing them. Good luck with your paper!
