prompt: |-
  You are a philosopher who works on decision theory and on the ethics of large-scale philanthropy, and you have drafted policy for grant-making bodies before. Think carefully before you write: begin by spending a few lines, for your own use, mapping the space of rules a funder could adopt to keep tiny probabilities from dominating its decisions (credence floors, caps on the ratio of payoff to probability, requirements that the case survive worst-case or model-uncertainty analysis, dominance and portfolio criteria, lexicographic priorities, and the like), and note how each of those can be gamed. Then write the memo itself as the deliverable.

  Setting: I chair the grant committee of a mid-sized private foundation. Our charter directs us to give each cycle's budget to whatever we judge to have the greatest expected impact per dollar, and our reviewers score proposals by multiplying an estimated effect size by an estimated probability of success. We vote a week from Tuesday, and I need a short written opinion to circulate beforehand.

  Three finalists are competing for the same $2 million. The first is a well-measured service-delivery program: high confidence, narrow uncertainty, an expected value around 10,000 on our internal scale, which counts a life-year saved as one unit. The second is a speculative research program whose entire case rests on a chain of the applicant's own estimates: a probability on the order of one in a trillion of an outcome the reviewers would have to score at something like 10^20 life-years, which makes its expected value roughly 10^8 and the largest in the pile by four orders of magnitude. The third is a research program the reviewers score at a few thousand units of expected benefit but also, by the same method, at an expected loss of about 10^8, because they put a one-in-a-million chance on a misuse catastrophe worth 10^14 life-years lost. The second and third cases are exact mirrors of each other, and that is the knot I need untied.

  Half the committee says the arithmetic is the arithmetic: our charter says expected impact, and a rule that throws away small probabilities is precisely the failure of nerve the charter exists to prevent. The other half wants to bar any proposal whose case depends on a probability below some floor, and cannot see why a tiny probability of catastrophe should be treated any differently from a tiny probability of enormous good. Whatever I circulate has to be something a majority can actually adopt, so it must survive both factions.

  In the memo, please: recommend a concrete disposition for each of the three proposals, with reasons their advocates could respond to; state the rule we should adopt for future cycles and give me the wording I could paste into our guidelines, saying explicitly how it handles the negative case; confront the strongest objection to your rule, namely that any floor or cap is either arbitrary or empty, since a large enough payoff can defeat any threshold; tell me plainly what your rule costs us if the fanatics turn out to be right; and close with a short section that states the losing side's position in terms its own adherents would accept. Assume we will make grants for many years, not just this once. I want the argument, not the literature: no citations, no reading lists.
reasoning: |-
  Okay, the user is chairing a grant committee for a foundation focused on maximizing expected impact per dollar. They've got three proposals: one reliable but modest impact, one with a tiny chance of huge upside, and one with a tiny chance of catastrophic downside. The committee is split between strict expected value purists and those who want to ignore tiny probabilities. 

  First, I need to map the policy options for handling tiny probabilities. Credence floors (ignoring probabilities below a threshold) are simple but arbitrary and manipulable - applicants could split improbable scenarios into sub-components. Probability caps (capping max impact/probability ratios) avoid arbitrariness but create cliff effects. Worst-case analysis rejects any proposal with catastrophic downsides, but may be too conservative. Model uncertainty adjustments add robustness checks, but implementation is messy. Dominance criteria (rejecting options with worse outcomes in all scenarios) works well for the negative case but not for positive tail risks. Lexicographic priorities (safety first) are intuitive but may waste resources on negligible risks. Portfolio approaches only work with multiple grants.

  The user needs concrete recommendations now plus a sustainable long-term rule. The symmetric treatment of proposals 2 and 3 is the core tension - accepting one logic while rejecting the other seems inconsistent. The rule must handle: 1) Preventing tail risks from hijacking decisions 2) Avoiding arbitrariness charges 3) Surviving both committee factions.

  For the immediate decision: The reliable program (proposal 1) is an easy yes. The catastrophic risk proposal (3) must be rejected - even small catastrophe risks create moral responsibility. The astronomical upside proposal (2) gets rejected too for symmetry, though it's less urgent. This creates political cover: both tail risk proposals are treated equally.

  The recommended long-term rule combines probability floors with a catastrophe override. Key features: 1) Default floor at 10^-9 (negotiable but orders below typical grant levels) 2) Catastrophe exemption where expected loss > 10% of foundation assets even at min probability 3) Clear implementation mechanics. This lets us reject both proposals 2 and 3 while addressing the "arbitrary threshold" objection via the catastrophe carve-out.

  Strongest objection is that any threshold is arbitrary. Response: All thresholds are context-dependent (like p<0.05 in stats), and the catastrophe clause handles world-altering stakes. Cost of being wrong is bounded: if fanatics are right, we miss one-in-a-trillion shots but avoid existential errors, and the floor can adapt over time.

  Closing by validating both sides: Purists are right that tiny probabilities matter mathematically, but pragmatists correctly note that decision systems must function amid limited cognition and trust. The rule honors the charter while preventing its abuse.
answer: |-
  ## Internal Policy Space Mapping (For Drafting)
  * **Credence floors (e.g., ignore p < 10^-9):** Simple, intuitive. *Gaming:* Applicants frame one improbable event as many slightly-less-improbable sub-events ("probability laundering"). Doesn't distinguish benefit/risk asymmetry.
  * **Caps on |Payoff| / Probability (e.g., max |EV|/p = $10^15):** Directly limits influence of extreme stakes. *Gaming:* Applicants artificially inflate intermediate probabilities or moderate stated payoffs while implying larger real stakes. Negative/positive treated identically.
  * **Worst-case / Model Uncertainty Analysis:** Requires proposal to be justified even if key assumptions are pessimistic. *Gaming:* Defining "worst-case" is subjective; applicants can downplay model weaknesses. Favors robustness over ambition.
  * **Dominance Criteria:** Reject options with lower benefits *and* higher risks than an alternative in all plausible states. *Gaming:* Only applies if alternatives exist; complex with many states. Works well for Proposal 3 vs. 1.
  * **Lexicographic Priorities (e.g., "Avoid Catastrophe > Max EV"):** Clear hierarchy. *Gaming:* Defining "catastrophe" threshold; can lead to massive inefficiency if safety dominates too strongly. Explicitly asymmetric.
  * **Portfolio Criteria:** Assess proposals as part of a portfolio over time. *Gaming:* Hard to quantify diversification benefits; doesn't resolve single large-grant dilemma. Favors repeated small bets.

  ---

  **MEMORANDUM**

  **To:** Grant Committee Members  
  **From:** Chair, Grant Committee  
  **Subject:** Recommended Disposition of Finalists & Policy for Handling Extreme Probabilities  
  **Date:** October 26, 2023  

  **1. Recommendation on Finalists & Immediate Disposition:**
      *   **Proposal 1 (Service-Delivery): FUND ($2M).** This proposal meets our core mandate with high confidence and measurable impact. Its expected value (EV ~10,000) is robust and actionable. It represents prudent stewardship.
      *   **Proposal 2 (Speculative Upside): REJECT.** While the headline EV (~10^8) is large, it relies entirely on an applicant-estimated chain culminating in p~10^-12. Assigning meaningful credence to such a specific, self-reported, ultra-low-probability pathway exceeds reasonable epistemic limits. We cannot reliably distinguish this from noise or wishful thinking, making it an unsound basis for allocating significant resources.
      *   **Proposal 3 (Speculative Downside): REJECT.** The estimated catastrophic risk (p~10^-6, loss ~10^14 LYs, EV loss ~10^8) is similarly reliant on an applicant's own ultra-low-probability chain. While catastrophe avoidance is paramount, this specific risk assessment lacks the robustness required for decisive action *against* funding. Crucially, **funding Proposal 3 is dominated by funding Proposal 1:** Proposal 1 offers positive expected benefit *and* carries no plausible path to the catastrophic loss described in Proposal 3. Choosing Proposal 1 strictly dominates choosing Proposal 3.

  **2. Recommended Rule for Future Cycles:**
  We adopt a **Dual-Threshold Rule with Catastrophe Override** to operationalize expected value maximization while acknowledging deep epistemic uncertainty:
  > **Section X.Y: Handling Extreme Probabilities & Catastrophic Risks**
  > (a) **Probability Floor:** Estimated probabilities below 1 in 1 billion (10^-9) per independent pathway shall be assigned a probability of **zero** for the purpose of expected value calculation, unless compelling, independently verifiable evidence specific to this pathway demonstrates otherwise. This floor applies symmetrically to probabilities of benefit and harm.
  >
  > (b) **Catastrophe Override:** If a proposal's *expected loss*, calculated using the minimum allowable probability under (a) or the applicant's estimated probability (whichever is higher), exceeds 10% of the foundation's total endowment value (currently ~$X Billion), the proposal **must be rejected** regardless of its expected benefit, unless a rigorous, independent risk assessment concludes the catastrophic scenario is effectively impossible (p < 10^-15). This override applies *only* to catastrophic losses, not benefits.

  **3. Handling the Negative Case (Proposal 3):**
  The rule explicitly addresses negative tail risks asymmetrically:
  1.  The *Probability Floor (a)* symmetrically ignores the ultra-low-probability catastrophe pathway (p~10^-6 > 10^-9, so *not* floored to zero here, but its low probability limits its EV weight).
  2.  The *Catastrophe Override (b)* kicks in: Even using the *minimum* allowed probability (10^-9), the expected loss is (10^-9 * 10^14 LYs) = 10^5 LYs lost. Converting LYs to our scale and comparing to 10% of endowment value [**Calculation:** (10^5 LYs * $Value/LY) vs. (0.1 * $Endowment)]. If this expected loss > 10% endowment value, the proposal is rejected unless proven effectively impossible. Given the scale described (10^14 LYs), rejection under (b) is highly likely.

  **4. Confronting the Strongest Objection: "Arbitrariness & Defeated Thresholds"**
  The objection is correct: *Any* fixed threshold (10^-9, 10% endowment) is ultimately arbitrary, and a sufficiently large claimed payoff *could* mathematically defeat it. Our response:
  *   **Epistemic Reality:** Our capacity to meaningfully assess probabilities diminishes radically below levels like 10^-9 for complex, multi-step forecasts. Assigning *any* positive credence is itself arbitrary. The floor reflects a reasonable boundary for actionable quantification.
  *   **Asymmetric Safeguard:** The catastrophe override (b) is *not* defeated by large benefits. It imposes a hard limit on acceptable catastrophic risk exposure *regardless* of purported benefits. A proposal promising 10^30 LYs with p=10^-15 but risking 10^20 LYs loss with p=10^-10 would still be rejected under (b) if the expected loss exceeds the threshold, even if the floored EV benefit is astronomical.
  *   **Contextual Arbitrariness:** All thresholds (statistical significance p<0.05, "negligible risk") involve contextual judgment. Ours is calibrated to foundation-scale resources and the catastrophic stakes we might influence. It prevents decisions being hijacked by unfalsifiable claims.

  **5. The Cost if the Fanatics Are Right:**
  If proponents of Proposal 2 are correct (p~10^-12 benefit is real), our rule costs us the opportunity to achieve immense good. This cost is bounded:
  *   Only opportunities relying *entirely* on probabilities below 10^-9 are excluded.
  *   Opportunities with *any* plausible pathway above 10^-9 (e.g., multiple independent routes, one credible step) can still be funded based on that higher-probability pathway's contribution to EV.
  *   The cost is the price of epistemic humility and avoiding ruin. We accept this bounded risk of missed upside to guard against the far greater folly of betting the foundation's integrity (or potentially more) on narratives we cannot reasonably evaluate or distinguish from fantasy.

  **6. The Losing Side's Position, Stated Fairly:**
  **The Strict EV Purists:** Our colleagues remind us that the charter's core mandate is clear: maximize expected impact. Deliberately ignoring any positive probability, no matter how small, violates this mandate and constitutes a failure of rational decision-making under uncertainty. They argue that dismissing probabilities like 10^-6 or 10^-12 as "effectively zero" is an emotional bias (probability neglect for small p), not a rational principle. If we accept the *framework* of assigning probabilities and impacts, we must accept the arithmetic result. Imposing arbitrary floors or asymmetric catastrophe rules substitutes our subjective caution for the objective calculus of expected value, potentially forgoing civilization-scale benefits and undermining the foundation's founding purpose. Consistency demands treating symmetric probabilities of symmetric magnitudes (like Proposals 2 & 3) identically within the EV framework.

  ---

  **Conclusion:** I recommend funding Proposal 1 and rejecting Proposals 2 and 3 for the reasons stated. Adopting the Dual-Threshold Rule with Catastrophe Override provides a principled, implementable framework for upholding our mandate to maximize expected impact while recognizing the profound limits of our judgment when confronting claims of near-infinite stakes and infinitesimal probabilities. It balances ambition with responsibility, allowing us to pursue transformative good while safeguarding against existential recklessness. I urge the committee to support this approach for this cycle and amend our guidelines accordingly.
