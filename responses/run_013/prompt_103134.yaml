answer: |-
  ## The Circle’s Edge

  Before the people speak, the circle forms.
  Who shapes the law? But wait—who draws the line?
  We trace the borders weathered into norms.
  Who shapes the law? But wait—who draws the line?

  Who shapes the law? But wait—who draws the line?
  The vote disturbs the air—should every voice
  That feels the tremor enter the design?
  Who shapes the law? But wait—who draws the line?

  The vote disturbs the air—should every voice
  Now claim a chair? But interests shift and blend;
  Only the bound should make the binding choice.
  Now claim a chair? But interests shift and blend.

  Only the bound should make the binding choice,
  Yet who defines the cage? The lock, the key?
  The hand that draws the line must speak its voice.
  Yet who defines the cage? The lock, the key?

  The hand that draws the line must speak its voice.
  We trace the borders weathered into norms.
  The circle holds the answer by default—no choice.
  Before the people speak, the circle forms.

  ---

  **Why this works for your seminar:**

  1.  **Pantoum Form as Loop:** The strict repetition-with-variation mirrors the boundary problem’s circularity. Lines reappear, but their context and the implied "we" subtly shift, preventing closure.
  2.  **Embedded Positions (Unnamed):**
      *   **Stanza 2, Lines 1 & 3:** Represents **(a) Affected Interests:** "The vote disturbs the air—should every voice / That feels the tremor enter the design?" The focus is on impact ("disturbs," "feels the tremor").
      *   **Stanza 3, Lines 1 & 3:** Represents **(b) Bound by Coercion:** "Only the bound should make the binding choice." Directly addresses the coercion inherent in law.
      *   **Stanza 4, Lines 1 & 3:** Represents **(c) Power Determines:** "The hand that draws the line must speak its voice." Acknowledges the brute reality of power defining the demos.
  3.  **Exposing the Circularity:**
      *   Stanza 1 poses the core problem: "Before the people speak, the circle forms" / "Who shapes the law? But wait—who draws the line?"
      *   Stanza 2 (Affected Interests) *tries* to answer "who draws the line?" by expanding the circle ("every voice / That feels the tremor"). But it ends by *repeating* the very question it sought to answer ("Who shapes the law? But wait—who draws the line?"), revealing its presupposition.
      *   Stanza 3 (Bound by Coercion) tries a different answer ("Only the bound..."). Yet, immediately, it runs into the problem of *who defines the bound?* ("Yet who defines the cage? The lock, the key?"). It too ends trapped by the prior question ("Who shapes the law? But wait—who draws the line?").
      *   Stanza 4 (Power Determines) offers the "honest but ugly" answer: the power to draw the line *is* its own authority ("The hand... must speak its voice"). It highlights the regress ("Yet who defines the cage? The lock, the key?").
  4.  **Unresolved Closure:** The final stanza brings back the opening lines, but crucially changes key phrases:
      *   "The hand that draws the line must speak its voice" (from Stanza 4) replaces the original "Who shapes the law? But wait—who draws the line?" This injects the power answer into the circle.
      *   "The circle holds the answer by default—no choice" bluntly states the impasse hinted at by position (c).
      *   Ending on "Before the people speak, the circle forms" closes the loop, but the "people" remain undefined. The circle is tautological.
  5.  **Accessibility & Nuance:** The concrete images ("circle," "border," "vote disturbs the air," "tremor," "chair," "cage," "lock," "key," "hand," "voice") make the abstract dilemma tangible. Experts will recognize the positions and the unresolved regress. Non-experts feel the circular frustration.
  6.  **Length & Readability:** Five stanzas, concise lines. Read aloud in under a minute. No jargon, no grand pronouncements, just the relentless logic of the form embodying the problem.

  The poem *is* the boundary problem: it defines its "we" through repetition, but that "we" shifts and questions itself with each recurrence, leaving the reader/listener standing firmly *inside* the unresolved loop.
