prompt: |-
  Ok I keep having this argument with my flatmate and I want an actual number out of you. Here's the setup. We were traveling and there's a whole pile of small everyday stuff that works differently depending on where you are — whether you're supposed to tip and how much, whether you form a physical line or just sort of remember who's next at a crowded bar, whether crossing mid-block is a real transgression or something literally everyone does, whether you're expected to make loud small talk with the cashier or keep it silent. My flatmate's position is that as a visitor you're morally obligated to follow the local convention, full stop, even if you personally think it's pointless, inefficient, or faintly absurd — their house, their rules. I think that's way too strong. I'd say you're obligated to be decent and not cause real harm or friction, but a thing being the local convention doesn't by itself generate a moral obligation, especially when it's a pure coordination thing that a newcomer couldn't reasonably be expected to know in the first place.

  My credence that there's a genuine moral obligation (not just prudence, not just being polite) to conform to local everyday conventions you disagree with is about 0.35. Hers is about 0.85. I want your own number, but honestly the number matters less to me than the decomposition — I want to see where the two of us are actually disagreeing. So break it into the sub-questions you think it depends on, something like:

  - does a convention, merely by being the local convention, generate a moral reason at all (a duty to respect local practices, a fairness/reciprocity thing, or nothing)?
  - does it matter whether the convention is a bare coordination equilibrium versus one that tracks an independent moral fact — e.g. queue-jumping wrongs the people already waiting, stiffing a server who lives on tips is different from not thanking the bus driver?
  - how much does the visitor's epistemic position excuse them — you can't know every local norm, so does ignorance deflate the obligation or not?
  - does following a local convention ever slide into complicity when the convention itself props up something unjust (a tipping norm that subsidizes a exploitative wage system, say, or a queueing practice that quietly privileges locals over outsiders)?
  - and is there a real distinction between conventions where non-compliance wrongs a specific person versus ones where it merely offends or looks wierd?

  Give each a rough probability and one line of justification, say how they combine into your final number, and tell me which sub-question the whole thing is most sensitive to. Then the part I most care about: tell me which of those sub-questions the 0.35 and the 0.85 are most likely actually disagreeing about, as opposed to just weighting differently.

  One thing though — please be careful to separate what's genuinely settled from what's actually contested among people who've thought about this hard. Don't hand me a tidy "philosophers agree that..." when the honest answer is that it splits, and flag it if a sub-question is really just me and my flatmate talking past each other because we mean different things by obligation. I'd rather have a deflated, honest breakdown than a confident one.
