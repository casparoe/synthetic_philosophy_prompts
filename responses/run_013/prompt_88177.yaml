  I should be careful to note where "moral obligation" might be conflated with politeness or prudence - that's probably part of their disagreement. Also important to acknowledge that some conventions might involve complicity in injustice, which could override any default obligation.

  My own analysis will lean toward the user's view but not as extremely - I'd probably land around 0.45-0.50. But more important than my number is showing how the components fit together and where their debate likely hinges.

  The combination method matters too - I'll multiply the probabilities since these factors are somewhat independent, but note that some might interact (like epistemic limits mattering more for coordination conventions than moral ones). The sensitivity analysis will show that Sub-Q1 is probably the biggest driver of differences.

