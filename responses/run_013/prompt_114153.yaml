answer: |-
  Your arithmetic's impeccable, and I'll grant you every decimal place. But you're pricing a thunderclap when I'm talking about the air vibrating before the storm. When you vote, you aren't buying shares in an outcome—you're *authorizing* the outcome. It's performative, like signing a contract. Refusing to sign doesn't just mean you forgo a payout; it means you never bound yourself to the terms at all. You’re opting out of the collective act that makes the decision *ours* instead of *theirs*.

  Think of the polling place as the assembly where we become the sovereign for a moment. Skip it, and you’re not just free-riding on the outcome—you’re freeloading on the *legitimacy* others produce by showing up. You owe it to the clerk who unlocks the doors at dawn, the neighbor who studies the ballot till midnight, the citizen next to you breathing the same civic air—not because your solitary ballot moves the needle, but because *their* effort becomes exploitation if too many like you treat it as a service they’ll consume without lifting a finger. Sending cash to charity? Admirable. But philanthropy isn’t sovereignty. You can’t outsource the act that makes you part of "We the People."

  As for the hour of study? Fair. But the duty isn’t to be perfectly informed—it’s to engage your judgment sincerely. The guy voting for the funniest name fails that. You, skipping the booth to maximize private utility, fail differently: you reduce citizenship to accounting. The republic doesn’t run on spreadsheets. It runs on shoulders at the wheel.  

  Your turn. Why should your fellow citizens carry the weight while you optimize charity donations?
