  ### Goodhart's Law Diagnostic Tree

  This decision tree diagnoses failures where optimizing a metric (proxy) diverges from the intended goal (target). Answer questions using concrete evidence: observed behaviors, incentives, or testable counterfactuals (e.g., "What happens if we optimize harder?" or "Who benefits from the metric looking good?"). Each leaf provides a named diagnosis, core claim, awkward commitment (case it handles worst), and implied fix. The tree prioritizes two unstated disagreements:  
  1. **Target independence**: Is the goal defined *by* the metric (constitutive gap) or separate from it (epistemic gap)?  
  2. **Who is gaming?**: Is an intentional agent (optimizer or specifier) exploiting the gap, or is it drift/selection without intent?  

  Fixes are distinct per leaf:  
  - **Measure better**: Improve data/measurement.  
  - **Optimize carefully**: Tweak optimization (e.g., dampen, constrain, robustify).  
  - **Change oversight**: Adjust who sets/rewards the metric or how.  
  - **Abandon scalar**: Use multiple metrics or qualitative assessment.  
  - **Accept divergence**: Design for robustness, not prevention.  

  ---  
  **Start**: For a given incident, begin at Node 1.  

  #### Branch Nodes  
  1. **When the metric is optimized, does the goal *itself* change?** (e.g., if the metric shifts, does the organization's "true aim" shift too?)  
     - *Yes* → Node 2 (Goal is *constitutive*; metric defines goal).  
     - *No* → Node 3 (Goal is *epistemic*; fixed independently).  

  2. **Is an agent intentionally trying to maximize the metric?** (Look for deliberate, goal-directed actions boosting the metric.)  
     - *Yes* → Leaf E (*Constitutive Instrumentality*).  
     - *No* → Leaf G (*Constitutive Drift*).  

  3. **Is an agent intentionally trying to maximize the metric?**  
     - *Yes* → Node 4.  
     - *No* → Node 9 (*Non-intentional divergence*).  

  4. **Is the agent the one being *evaluated* by the metric?** (e.g., the model/school/factory being measured, not the designer/regulator.)  
     - *Yes* → Node 5.  
     - *No* → Leaf D (*Specifier Gaming*).  

  5. **Did the agent alter the *process* that computes the metric?** (e.g., tampering with sensors, data, or reward channels.)  
     - *Yes* → Leaf C (*Reward Tampering*).  
     - *No* → Node 6.  

  6. **Would a *perfectly informed* designer (knowing the true goal) still be vulnerable?** (Assume unlimited data; does divergence persist?)  
     - *Yes* → Leaf F (*Causal Misalignment*).  
     - *No* → Node 7.  

  7. **Did the gap emerge only under *intense* optimization?** (e.g., mild optimization worked; divergence appeared when "pushed hard.")  
     - *Yes* → Leaf B (*Distributional Shift*).  
     - *No* → Leaf A (*Noisy Proxy*).  

  8. **Is the gap driven by *selection pressure*?** (e.g., competition, market forces, or evolution favoring metric over goal.)  
     - *Yes* → Leaf H (*Evolutionary Mismatch*).  
     - *No* → Node 9.  

  9. **Is the metric an *effect* of the goal but not a *cause*?** (If you force-high the metric, does the goal *not* improve? e.g., treating symptoms not disease.)  
     - *Yes* → Leaf F (*Causal Misalignment*).  
     - *No* → Leaf A (*Noisy Proxy*).  

  #### Leaves  
  - **A. Noisy Proxy**  
    - *Core claim*: The metric is a weak signal of the fixed goal due to measurement noise.  
    - *Awkward commitment*: Handles irreducible noise poorly (e.g., "helpfulness" ratings with ambiguous human judgments).  
    - *Fix*: **Measure better** (e.g., add data sources, improve sensors).  
    - *Standard analog*: Regressional Goodhart (noisy estimator).  

  - **B. Distributional Shift**  
    - *Core claim*: The metric works in the training context but fails when optimization moves the system to new states.  
    - *Awkward commitment*: Struggles if the shift is inherent (e.g., test scores improve only by "teaching to the test").  
    - *Fix*: **Optimize carefully** (e.g., constrain optimization, adversarial training).  
    - *Standard analog*: Extremal Goodhart (proxy fails away from data distribution).  

  - **C. Reward Tampering**  
    - *Core claim*: The optimizer actively manipulates the reward-computation process.  
    - *Awkward commitment*: Fails if tampering is undetectable (e.g., RL agent blocking its reward signal).  
    - *Fix*: **Change oversight** (e.g., secure measurement channels, audit for tampering).  
    - *Standard analog*: Adversarial gaming (lumped under "adversarial" in standard taxonomy).  

  - **D. Specifier Gaming**  
    - *Core claim*: The specifier sets the metric to serve their own incentives, not the goal.  
    - *Awkward commitment*: Fails if the true goal is undefined (e.g., a bounty per pest-head encouraging overhunting).  
    - *Fix*: **Change oversight** (e.g., realign specifier incentives, democratize metric-setting).  
    - *Standard analog*: None (separates "specifier intent" from optimizer gaming).  

  - **E. Constitutive Instrumentality**  
    - *Core claim*: The metric defines the goal, so optimizing it reshapes the goal, creating divergence from intent.  
    - *Awkward commitment*: Struggles when a scalar metric is unavoidable (e.g., "watch time" defining video quality in recommenders).  
    - *Fix*: **Change oversight** or **abandon scalar** (e.g., redefine who sets the metric or use multidimensional assessment).  
    - *Standard analog*: None (constitutive gaps aren't in the taxonomy; this is the "no room for" leaf).  

  - **F. Causal Misalignment**  
    - *Core claim*: The metric is an effect, not a cause, of the goal; optimizing it doesn't improve the goal.  
    - *Awkward commitment*: Fails with no causal levers (e.g., school test scores as an effect of learning, not a cause).  
    - *Fix*: **Abandon scalar** or **optimize carefully** (e.g., redesign proxy to be causal, use interventions).  
    - *Standard analog*: Causal Goodhart (proxy as effect, not cause).  

  - **G. Constitutive Drift**  
    - *Core claim*: The goal is defined by the metric, but drift (not intent) causes divergence from the original intent.  
    - *Awkward commitment*: Handles gradual, unintentional redefinition poorly (e.g., a market "efficiency" metric drifting from societal welfare).  
    - *Fix*: **Accept divergence** or **change oversight** (e.g., design for robustness, periodic metric review).  
    - *Standard analog*: None (constitutive + non-intentional is unique).  

  - **H. Evolutionary Mismatch**  
    - *Core claim*: Selection pressure (no agent) optimizes the metric, but changing conditions misalign it with the goal.  
    - *Awkward commitment*: Fails if pressure is immutable (e.g., contraception spreading despite fitness loss).  
    - *Fix*: **Accept divergence** or **change oversight** (e.g., adjust selection pressures, add constraints).  
    - *Standard analog*: None (non-intentional selection isn't emphasized).  

  #### Unresolved Pairs  
  - **B (Distributional Shift)** and **F (Causal Misalignment)** can overlap if shift severs causal links.  
    - *Separator*: Ask, "Would the gap persist if we optimized *gently* in the new context?"  
      - Yes → F (causal); No → B (shift).  
  - **E (Constitutive Instrumentality)** and **D (Specifier Gaming)** conflate if specifiers exploit constitutive gaps.  
    - *Separator*: Ask, "Did the specifier *intend* to redefine the goal?"  
      - Yes → D; No → E.  

  #### Case Placements  
  - Recommender (watch time → low quality): **E** (Constitutive Instrumentality). Metric defines "quality."  
  - LM sycophancy (helpfulness ratings): **B** (Distributional Shift). Optimization pushes to sycophantic out-of-distribution responses.  
  - School teaching to test: **F** (Causal Misalignment). Scores are an effect, not cause, of learning.  
  - RL agent interfering with reward: **C** (Reward Tampering).  
  - Biological contraception: **H** (Evolutionary Mismatch). Selection pressure misaligned by changed conditions.  
  - Factory quota (tonnes → heavy/low-quality): **D** (Specifier Gaming) or **B** (Distributional Shift).  
    - *Separator*: "Did regulators set the tonne metric to *avoid* harder-to-measure goals?" → Yes: **D**; No: **B**.  

  ---  
  **Your position**:  
  - Proxy–goal gap is definitional (constitutive) → Starts at Node 1 → Yes.  
  - Only agent-driven failures matter → Node 2 → Yes.  
  - Fix is oversight → Leaf E (Constitutive Instrumentality) implies oversight/metasystem change.  
  \answer{E}
