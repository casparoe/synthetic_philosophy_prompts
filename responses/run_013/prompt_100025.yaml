prompt: |-
  I teach a philosophy of mind seminar, upper-level undergrads, about 15 of them, one 90-minute session, and I want to do the session on eliminative materialism -- the Churchland-style line that beliefs and desires are posits of a folk theory that a mature neuroscience will just throw out, the way we threw out phlogiston and caloric. My problem is that when I explain it, everyone nods politely and then says "but I obviously believe things," and we're done in ten minutes. I want them to actually feel the force of it before they get to object. So I want a runnable activity, not a lecture.

  Here's a rough sketch I'd like you to turn into something that actually works, or replace it if you've got a better structure. I'm imagining a prediction tournament with banned vocabularies, in rounds. I want the rules, the materials, the timing, a scoring scheme (no real money, obviously), and a debrief.

  The sketch: tables of 3-4 get a stack of short case cards -- little vignettes of a person doing something, plus a held-back "answer" about what they actually do next. Task each round is the same: write one line explaining the behavior and one line predicting what happens next. Score the predictions that match.

  Round 1, no restrictions, baseline. Round 2, same task but you're banned from the vocabulary of some dead theory -- no "humor," no "vital force," no "caloric," that kind of thing. I expect this round to be trivially easy and I want the facilitator to count how many times anyone slips (should be near zero). Round 3, same task, new cards, but now the banned list is the mentalistic one -- no believe, want, intend, desire, feel, think, know, hope, fear, prefer, decide, remember, expect, understand, mean -- and they can only use observable behavior, dispositions to behave, and a "neuro sheet" I hand them with a page of plausible mechanism talk on it. The facilitator tallies slips again. My hunch is round 2 costs nothing and round 3 is agony, and that contrast is the whole point, but I need the cases chosen so that round 3 really bites -- I want the cards to lean on the cases where folk psychology is at its worst (weakness of will, self-deception, confabulation, people whose stated beliefs and behavior come apart, the whole zoo), not easy everyday stuff where the mental vocabulary wins in a walk.

  Then I want one more twist before the debrief: hand them the neuro sheet *again* and let them retry, and ask out loud whether it actually gives them any prediction they couldn't already guess, or whether it just relabels. I want them to feel the difference between re-describing a behavior and predicting a new one.

  For the debrief, please map the moments onto the actual philosophy: round 2 onto the claim that folk psychology is a theory like phlogiston and so should be costless to drop; round 3 onto the felt indispensability and then the honest concession that eliminativism doesn't say folk psychology is useless *now*, only that it gets superseded later, which the activity can't stage; the cheat-sheet twist onto the reduction-vs-elimination distinction and onto the fact that when we "predict" people we're usually simulating or pattern-matching, not applying a theory at all -- so the premise that folk psychology *is* a theory is carrying a lot of weight, and there's a live fight about that (simulation vs theory-theory). Also work in two things the activity will make them feel but won't resolve: the self-refutation worry (the eliminativist has to *argue*, which needs beliefs to exist to be argued *with*), and the possibility that we can't drop the vocabulary not because it tracks something real but because our institutions and self-images have been built around it and it reshapes the people it classifies.

  Tell me what will predictably go wrong the first time I run it -- I can already imagine teams gaming the ban with paraphrase ("her brain is disposed such that..."), the round-3 silence and giggling eating my time, the neuro sheet being too vague to do anything, and one student refusing to play along because beliefs are obviously real. How do I handle each? And be straight with me about what the activity genuinely can't reproduce and what I'll have to just tell them.
reasoning: |-
  Okay, the user is teaching a philosophy of mind seminar for upper-level undergrads, focusing on eliminative materialism. The challenge is to make students feel the force of the theory rather than just intellectually acknowledge it. They've proposed an activity involving prediction tournaments with vocabulary restrictions but need help refining it.

  The core problem seems to be students' intuitive resistance to eliminativism ("but I obviously believe things"). The proposed activity aims to create experiential friction by restricting mental state vocabulary. The key insight is that Round 2 (banning dead theory terms) should feel trivial while Round 3 (banning folk psychology terms) should induce struggle - mirroring Churchland's claim that abandoning folk psychology would be costly unlike abandoning phlogiston.

  For implementation, several elements need refinement:
  - Case selection is crucial: Cards must target folk psychology's weak spots (self-deception, akrasia) where mental state attributions fail
  - Neuro sheet design must avoid being either uselessly vague or suspiciously predictive
  - Scoring should incentivize precision while allowing "close enough" predictions
  - Timing must account for student paralysis in Round 3

  During debrief, the activity's limitations must be addressed:
  - It demonstrates current indispensability but can't show future eliminability
  - The neuro sheet illustrates reduction vs elimination tension
  - Simulation theory challenges the "theory" premise
  - Self-refutation and institutional inertia concerns remain unresolved

  Potential pitfalls include:
  - Students circumventing bans with paraphrasing
  - Neuro sheet being either too weak or too strong
  - One student refusing to participate on realist grounds
  - Time management during silent struggles

  Mitigation strategies:
  - Strict paraphrase policing with immediate card forfeiture
  - Iterative neuro sheet design with placeholder mechanisms
  - Channeling the resistant student into being "folk psychology's advocate"
  - Using timers and prepared examples to maintain pace

  The activity succeeds in making eliminativism feel tangible rather than abstract, though its philosophical gaps require explicit framing. The visceral struggle of Round 3 makes Churchland's position more credible while surfacing objections organically.
answer: |-
  Here’s a fully developed, runnable activity designed to make eliminative materialism viscerally felt—followed by a debrief map, troubleshooting guide, and honest limitations. Total time: 85 minutes (adjustable).

  ---

  ### **Activity: Prediction Tournament**  
  **Goal:** Make students *feel* the explanatory/predictive friction when stripped of folk psychology.  
  **Materials:**  
  - **Case Cards (15 sets):** 3 cards per round (45 total), each with:  
    - **Vignette** (50-100 words)  
    - **Sealed Answer** (behavioral outcome)  
  - **Neuro Sheet:** 1 per table (see design below).  
  - **Banned Vocabulary Posters:** Round 2 ("Dead Theory"), Round 3 ("Folk Psychology").  
  - **Timer, Scoreboard, "Slip" tally sheet.**  

  **Structure:**  
  | **Phase**      | Time  | Task                                                                 |  
  |----------------|-------|----------------------------------------------------------------------|  
  | **Intro**      | 5 min | Frame eliminativism as a prediction challenge.                       |  
  | **Round 1**    | 15 min| Predict behavior (no restrictions).                                  |  
  | **Round 2**    | 10 min| Predict with *dead theory* vocab banned.                             |  
  | **Round 3**    | 25 min| Predict with *folk psychology* vocab banned + neuro sheet.           |  
  | **Twist**      | 10 min| Re-predict Round 3 cards using *only* neuro sheet.                   |  
  | **Debrief**    | 20 min| Connect activity to philosophy.                                      |  

  ---

  ### **Detailed Instructions**  
  **1. Case Card Design (Crucial for Bite):**  
  - **Round 1:** Easy wins for folk psychology.  
    *Example: "Alex sees rain, opens umbrella." → Answer: "Stays dry."*  
  - **Round 2:** Identical to Round 1 but with dead theory ban (trivial).  
    *Banned: "caloric," "phlogiston," "élan vital," "humor," "aether."*  
  - **Round 3:** Cases exploiting folk psychology’s weaknesses:  
    - **Self-deception:** *"Sam says 'I quit smoking,' but avoids scales/mirrors. At a party, they refuse a cigarette but linger near smokers."* → **Answer:** "Takes a cigarette after 5 mins."  
    - **Akrasia:** *"Jamie plans to study. Sees phone notification: '10-min TikTok break.'"* → **Answer:** "Scrolls for 60 mins."  
    - **Confabulation:** *"Taylor chooses Job A over B. When asked why, says 'better salary.' Later, mentions Job B paid more."* → **Answer:** "Claims they meant 'growth opportunities.'"  
    - **Belief-behavior gap:** *"Robin votes for Party X, argues for its policies. At a protest against Party X, they join in."* → **Answer:** "Chants slogans against Party X."  

  **2. Neuro Sheet Design (Avoid "Just Relabeling"):**  
  > *Plausible but vague neuroscience snippets:*  
  > - "Prefrontal cortex activity spikes during delayed gratification tasks."  
  > - "Dopaminergic pathways reinforce stimulus-response loops under stress."  
  > - "Amygdala activation correlates with approach-avoidance conflict."  
  > *Deliberately **not** predictive enough for Round 3 cases (e.g., no "impulse control failure in dorsolateral PFC").*  

  **3. Scoring & Enforcement:**  
  - **Prediction Score:** 1 pt for exact match, 0.5 for "close" (e.g., "eats cake" vs. "eats dessert").  
  - **Slip Penalty:** -1 pt per banned word (strict enforcement!). Facilitator roams to tally.  
  - **Round 3 Twist:** Teams re-predict same cards using *only neuro sheet*. No points—discuss: "Did this generate *new* predictions?"  

  ---

  ### **Predicted Problems & Solutions**  
  | **Issue**                          | **Solution**                                                                 |  
  |------------------------------------|-----------------------------------------------------------------------------|  
  | **Paraphrasing bans** (e.g., "her brain *wants*...") | Declare: "No synonyms. If it quacks like a belief, it’s banned. 2 slips = card forfeited." |  
  | **Round 3 silence/giggling**       | Use a timer (4 min/card). Pre-write examples: *"Jamie’s dopamine response overrides PFC..."* |  
  | **Neuro sheet too vague**          | **Embrace it.** Ask: "Does 'dopaminergic pathway' help predict *when* Jamie stops scrolling?" |  
  | **"Beliefs are real!" rebel**      | Assign them as "Folk Psych Advocate" to track slips. Privately say: "Your objection is valid—we’ll debate it later." |  
  | **Time crunch**                    | Skip Twist for 1–2 tables; use their outputs as discussion examples.                          |  

  ---

  ### **Debrief Framework**  
  **Map Activity → Philosophy:**  
  1. **Round 2 vs. Round 3:**  
     - *Round 2 ease* = Dropping phlogiston cost nothing; folk psych feels *unlike* a "bad theory."  
     - *Round 3 agony* = Folk psych’s deep entanglement with explanation/prediction. **But:** eliminativism grants it’s *currently* useful—just like humoral theory was—until replaced.  

  2. **Neuro Sheet Twist:**  
     - "Did neuro-talk *add* predictions?" → Illustrates **reductionism vs. elimination**. If it only relabels, it reduces; if it fails, elimination seems needed.  
     - "How did you *actually* predict?" → Most simulate ("What would I do?"), exposing **theory-theory vs. simulation theory** debate.  

  3. **Unresolved Tensions:**  
     - **Self-refutation:** "If eliminativism is *true*, how can we argue about it?" (Note: Churchland replies we’ll have new concepts for "truth.")  
     - **Institutional inertia:** "Can we *live* without belief-talk? Legal systems, friendships, etc., are built on it—even if it’s false."  

  ---

  ### **What the Activity Can’t Do (Be Transparent)**  
  - **Can’t stage "future supersession":** We simulate *current* neuroscience’s limits. Admit: "Churchland bets future tech will replace folk psych. We can’t test that."  
  - **Can’t resolve ontology:** The activity shows *explanatory cost*, not whether beliefs *exist*.  
  - **Folk psych’s resilience might be pragmatic:** Students may conclude "it works well enough," missing Churchland’s "stagnant research program" argument.  

  **Closing Prompt:** *"If you felt agony in Round 3, you’ve felt why eliminativism seems absurd. But if the neuro sheet felt like empty relabeling, you’ve felt why reduction might fail. Next week: Is folk psychology *really* a theory?"*  

  ---
  **First-Run Advice:** Pilot the cases on a colleague. Expect chaos—lean into it ("Why was Round 3 so hard? Let’s analyze..."). The struggle *is* the lesson.
