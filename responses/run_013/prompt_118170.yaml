prompt: |-
  I write novels, and a few years back I started keeping a prediction diary — will my agent sell this book in six months, will the chapter 12 ending land with my beta readers, that kind of thing. I write down a percentage before I know the answer, then check back later. Now I want to actually score myself, and I've got three schemes and no idea wich to trust, or how they'd change me over time:

  1. Hit rate — a hit if the thing I gave more than 50% to happened (or the thing I gave less than 50% to didn't), then hits divided by total.
  2. If it happened I score my stated probability, if it didn't I score 1 minus it, then average. So a correct 70% beats a correct 60%.
  3. For each one, take the gap between my stated probability and what actually happened (1 or 0), square it, average the lot.

  Rank these three by how well they'd actually train me to be good at predicitng rather than just feeling good, and for each say what it would push me to do with my percentages if I were trying to game it. I know myself, so the gaming part matters more to me than it should.
reasoning: |-
  Okay, let me tackle this novelist's prediction scoring question. They've been keeping a prediction diary with percentage estimates for outcomes like book sales or reader reactions, and now want to evaluate their forecasting accuracy properly. They've proposed three scoring methods and want to know which would best train them to improve, including how they might game each system.

  First, I need to understand the three schemes clearly. The hit rate (method 1) is straightforward binary scoring - just whether the higher-probability outcome occurred. The average probability score (method 2) rewards accurate confidence calibration - getting 70% right should score better than 60% right. The squared error (method 3) strongly penalizes extreme errors.

  For training value, method 2 (average probability score) seems strongest because it directly measures calibration quality. If they say 70% and it happens 70% of the time, that's perfect calibration. Methods 1 and 3 have flaws here - hit rate ignores confidence levels entirely, while squared error pushes toward extreme predictions.

  Considering gaming behavior is crucial as the user mentioned this matters more to them. With hit rate, they'd be tempted to always predict 51% for their preferred outcome to maximize "wins." Squared error would push them toward safer 50% predictions to minimize maximum penalty. But method 2 actually rewards honest estimates - gaming it by distorting percentages would worsen their score if they know the true probabilities.

  The user's context matters too - as a novelist, their predictions are likely unique events rather than repeatable probabilities. But the scoring should still encourage examining why 70% predictions succeeded more than 60% ones. I should emphasize that method 2 provides the richest feedback loop.

  For ranking, method 2 is clearly best for training, followed by squared error (despite its extremity bias), with hit rate being weakest. I'll explain how each would influence their prediction behavior if gamed, and stress that embracing the discomfort of method 2's scoring will serve their long-term improvement best.
answer: |-
  Based on your goals (training to be *accurately* predictive, not just feeling good, and resisting self-gaming), here's the ranking and analysis of your three schemes:

  **Ranked Best to Worst for Training & Honest Calibration:**

  1.  **Scheme 2: Average Probability Score (a.k.a. Brier *Component* or Logarithmic Score Core Idea)**
      *   **How it Works:** `Score = (If Event Happens: Stated Prob) + (If Event Doesn't Happen: 1 - Stated Prob)`. Average this score over all predictions.
      *   **Why it's Best for Training:** This is the **gold standard** for probabilistic calibration assessment. It directly measures how well your *confidence* (the probability you state) matches reality. A correct 70% prediction scores 0.70, while a correct 60% prediction scores only 0.60 – rewarding appropriate confidence. An incorrect 70% prediction scores only 0.30 (1 - 0.70), heavily penalizing high confidence in a wrong outcome. To maximize your average score *honestly*, you **must** report your true subjective probability. It forces you to confront the cost of overconfidence and underconfidence.
      *   **What it Pushes You to Do (If Gaming):** This scheme is **remarkably hard to game effectively in the long run** if you care about your score. Gaming strategies backfire:
          *   *Overconfidence Gamble:* If you *know* something is 60% likely but say 90% hoping to be "more right," you score 0.90 if correct (good!), but only 0.10 if wrong (disastrous!). Over many predictions, the penalties outweigh the gains.
          *   *Underconfidence Hedge:* If you know something is 90% likely but say 60% to avoid a big penalty if wrong, you score only 0.60 if correct (leaving points on the table) and 0.40 if wrong (better than 0.10, but you were wrong!). You consistently score less than your potential.
          *   *Safe 50%:* Always predicting 50% gives a constant score of 0.50, which is *worse* than the score you get when you are actually confident and correct (e.g., 0.70, 0.80, 0.90). You leave significant points on the table.
      *   **Gaming Verdict:** This scheme actively **punishes gaming** and **rewards honest, well-calibrated probability assessments.** It's the best teacher.

  2.  **Scheme 3: Average Squared Error (a.k.a. Brier Score)**
      *   **How it Works:** `Error = (Outcome - Stated Prob)^2` (Outcome is 1 or 0). Average this squared error over all predictions. *Lower* scores are better (0 = perfect, 0.25 = always guessing 50%, 1 = maximally wrong).
      *   **Why it's Good (But Not Best):** The Brier Score is a proper scoring rule, meaning it *also* rewards honesty. It strongly penalizes large errors, especially extreme confidence (90%+) that turns out wrong. It incorporates both calibration and discrimination (ability to distinguish likely vs. unlikely events).
      *   **What it Pushes You to Do (If Gaming):** The incentive to game is weaker than Scheme 1 but stronger than Scheme 2.
          *   *Avoid Extremes:* The squared term makes being extremely confident and wrong (e.g., predicting 95% and failing, Error = 0.95^2 = 0.9025) catastrophically bad. This pushes you *slightly* towards hedging your bets and avoiding high probabilities (<90%) even when you feel strong, to cap the maximum penalty. Predicting 80% and being wrong (Error=0.64) hurts less than predicting 95% and being wrong (Error=0.9025).
          *   *Safe 50% Temptation:* Predicting 50% consistently yields a Brier Score of 0.25. If you are genuinely uncertain a lot, this might be okay. But if you often have strong convictions (70%+), consistently predicting 50% will give you a *worse* score than stating your true higher probability when you are often correct. (e.g., True prob 70%, stated as 70%: Avg Error = (0.3)^2 * 0.3 + (0.7)^2 * 0.7 = 0.027 + 0.343 = 0.37; Stated as 50%: Avg Error = (0.5)^2 * 0.3 + (0.5)^2 * 0.7 = 0.075 + 0.175 = 0.25). 0.25 is better than 0.37, so if you *are* often uncertain, 50% is safe, but if you *could* be confident, it's suboptimal. The key is knowing when you *aren't* uncertain.
      *   **Gaming Verdict:** Harder to game profitably than Scheme 1, but creates a slight psychological nudge towards conservatism to avoid catastrophic errors. Still a very good training tool.

  3.  **Scheme 1: Hit Rate**
      *   **How it Works:** Count predictions where `(Prob > 50% AND Event Happens) OR (Prob < 50% AND Event Doesn't Happen)`. Divide by total predictions. *Ignores probabilities above/below 50% entirely.*
      *   **Why it's Worst for Training:** This scheme is **terrible for probabilistic calibration.** It completely discards all information about *how confident* you were. Predicting 51% is treated identically to predicting 99%. It only cares if you picked the right side of 50%. You could be consistently overconfident or underconfident and still score well. It teaches you nothing about refining your probability assessment skill.
      *   **What it Pushes You to Do (If Gaming):** This scheme is **extremely easy to game successfully:**
          *   *Always Predict >50% for Your Preferred Outcome:* Since you control the prediction threshold, simply *always* assign >50% (even 51%) to the outcome you *hope* happens or *slightly* believe is more likely. This guarantees a "Hit" whenever that outcome occurs. You completely ignore the *degree* of likelihood. Your score becomes simply the frequency of your preferred outcome happening, regardless of your actual predictive skill.
          *   *Safe 50% Avoidance:* Predicting exactly 50% is useless here – it can never be a "Hit" (the event either happens or doesn't, contradicting your "could go either way" stance). You're forced to pick a side.
      *   **Gaming Verdict:** Highly gameable. Rewards picking a side, not assessing probability. Provides minimal useful feedback for improvement beyond basic "was I directionally correct?" which isn't the point of probabilistic forecasting. Avoid this for your goal.

  **Summary & Recommendation:**

  *   **Best for Training & Anti-Gaming: SCHEME 2 (Average Probability Score).** This is the tool that will genuinely teach you calibration. Embrace the discomfort of low scores when you're overconfident and wrong – that's the lesson. It pushes you towards honesty.
  *   **Good Alternative: SCHEME 3 (Average Squared Error / Brier Score).** Excellent metric, slightly emphasizes avoiding big mistakes over perfect calibration nuance. Still vastly superior to Hit Rate.
  *   **Avoid: SCHEME 1 (Hit Rate).** It measures decisiveness, not probabilistic accuracy, and is trivial to game. It won't help you improve your prediction skill.

  **How They Change You Over Time:**

  *   **Scheme 2:** Will push you to constantly evaluate *why* you assigned a probability. Did a 70% prediction happen 7 out of 10 times? If not, why was your confidence misplaced? You'll learn to associate probability levels with empirical frequencies. You'll become more aware of your own biases (optimism, pessimism, anchoring).
  *   **Scheme 3:** Will make you acutely aware of the cost of high-confidence errors. You might become slightly more conservative with extreme probabilities (99%, 1%) unless you have *overwhelming* evidence. You'll still learn calibration, but with a lens focused on avoiding large mistakes.
  *   **Scheme 1:** Will push you to always pick a side (never 50%) and assign just enough probability (>50%) to claim a "hit" if it happens. You won't learn to quantify uncertainty better, just to mask your uncertainty by minimally committing.

  **Actionable Advice:** Commit to **Scheme 2.** Calculate your score periodically. Look at predictions where your stated probability was high (>70%) but you were wrong – analyze why. Look at predictions where your probability was low (<30%) but it happened – analyze why. Group predictions by your stated probability bin (e.g., all 60-70% predictions) and see what percentage actually happened. Aim for that percentage to match your bin (e.g., ~65% of your 60-70% predictions should happen). This is the path to becoming well-calibrated. Good luck!
