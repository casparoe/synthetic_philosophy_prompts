answer: |-
  ### Student-Facing Question  
  **Question 1 (25 marks)**  

  Consider a market for a single asset. The asset pays £1 if the state of the world \(\omega\) is 1 and £0 if \(\omega\) is 0. Two risk-neutral traders, A and B, trade the asset. The prior probability of \(\omega = 1\) is \(\frac{1}{2}\), and the prior for \(\omega = 0\) is \(\frac{1}{2}\). Initially, trader B holds one unit of the asset, and trader A holds none.  

  Each trader observes a private binary signal about \(\omega\):  
  - If \(\omega = 1\), each signal is 1 with probability \(\frac{2}{3}\) and 0 with probability \(\frac{1}{3}\).  
  - If \(\omega = 0\), each signal is 0 with probability \(\frac{2}{3}\) and 1 with probability \(\frac{1}{3}\).  
  Conditional on \(\omega\), the signals are independent across traders.  

  **Part 1: Bilateral Trade (10 marks)**  
  (a) Suppose A observes signal 1, and B observes signal 0. Compute each trader’s expected value of the asset, conditional *only* on their own signal. (2 marks)  
  (b) A is willing to buy from B at price \(p\) only if \(p\) is less than or equal to her valuation. B is willing to sell to A at \(p\) only if \(p\) is greater than or equal to his valuation. Find a price \(p\) at which both would be willing to trade *without conditioning on the other’s willingness*. (2 marks)  
  (c) Now, suppose trade is proposed at your \(p\) from (b). A conditions on her signal *and* the fact that B is willing to sell at \(p\). B conditions on his signal *and* the fact that A is willing to buy at \(p\). Compute each trader’s updated expected value of the asset. Does trade occur? Explain why. (6 marks)  

  **Part 2: Market Maker (8 marks)**  
  A market maker (risk-neutral, no private information) sets a single price \(p\) at which he buys or sells the asset. He sets \(p\) to the expected value of the asset given his information.  
  (a) The market maker has no information beyond the prior. What \(p\) does he set? Given this \(p\) and their private signals, what is A’s (signal 1) and B’s (signal 0) expected value of the asset? Would A buy from the market maker? Would B sell to him? (3 marks)  
  (b) Suppose the market maker observes *both* traders’ signals (one 1, one 0) and sets \(p\) to the expected value of the asset given both signals. What \(p\) does he set? Given this \(p\) and their own signal, what is A’s and B’s expected value? Would either trade with the market maker? (3 marks)  
  (c) In one sentence: If the market maker’s price always fully reveals all private information (as in (b)), why would traders lack incentive to gather private information? (2 marks)  

  **Part 3: Restoring Trade (7 marks)**  
  Suggest **two distinct modifications** to the **bilateral trade setting** (Part 1) that could restore trade at some price, even after conditioning on willingness to trade. For each:  
  - Explain in one sentence why trade becomes possible.  
  - Explain in one sentence what cost this imposes on the claim that market prices aggregate dispersed information.  
  Then, briefly compare the costs: Which modification most severely undermines price aggregation, and why? (7 marks)  

  ---  
  ### Model Answer  
  **Part 1: Bilateral Trade**  
  (a) Trader A’s valuation given signal 1:  
  \[
  P(\omega=1 \mid s_A=1) = \frac{P(s_A=1 \mid \omega=1) P(\omega=1)}{P(s_A=1)} = \frac{\frac{2}{3} \cdot \frac{1}{2}}{\frac{1}{2} \cdot \left(\frac{2}{3} + \frac{1}{3}\right)} = \frac{\frac{1}{3}}{\frac{1}{2}} = \frac{2}{3}.
  \]  
  Expected value for A: \(\frac{2}{3}\).  
  Trader B’s valuation given signal 0:  
  \[
  P(\omega=1 \mid s_B=0) = \frac{P(s_B=0 \mid \omega=1) P(\omega=1)}{P(s_B=0)} = \frac{\frac{1}{3} \cdot \frac{1}{2}}{\frac{1}{2} \cdot \left(\frac{1}{3} + \frac{2}{3}\right)} = \frac{\frac{1}{6}}{\frac{1}{2}} = \frac{1}{3}.
  \]  
  Expected value for B: \(\frac{1}{3}\).  

  (b) B will sell if \(p \geq \frac{1}{3}\) (his valuation). A will buy if \(p \leq \frac{2}{3}\) (her valuation). Any \(p \in [\frac{1}{3}, \frac{2}{3}]\) works; use \(p = \frac{1}{2}\) (midpoint).  

  (c) A conditions on \(s_A=1\) and B’s willingness to sell at \(p = \frac{1}{2}\). B is willing to sell only if his valuation \(\leq \frac{1}{2}\). Given B’s signal:  
  - If \(s_B=0\), valuation \(= \frac{1}{3} \leq \frac{1}{2}\) → willing.  
  - If \(s_B=1\), valuation \(= \frac{2}{3} > \frac{1}{2}\) → not willing.  
  Thus, B’s willingness implies \(s_B=0\). Similarly, B conditions on \(s_B=0\) and A’s willingness to buy at \(\frac{1}{2}\). A is willing only if her valuation \(\geq \frac{1}{2}\):  
  - If \(s_A=1\), valuation \(= \frac{2}{3} \geq \frac{1}{2}\) → willing.  
  - If \(s_A=0\), valuation \(= \frac{1}{3} < \frac{1}{2}\) → not willing.  
  Thus, A’s willingness implies \(s_A=1\). Both now know \(s_A=1\) and \(s_B=0\).  
  Updated valuation for both:  
  \[
  P(\omega=1 \mid s_A=1, s_B=0) = \frac{P(s_A=1, s_B=0 \mid \omega=1) P(\omega=1)}{P(s_A=1, s_B=0)}.
  \]  
  \[
  P(s_A=1, s_B=0 \mid \omega=1) = \frac{2}{3} \cdot \frac{1}{3} = \frac{2}{9}, \quad P(s_A=1, s_B=0 \mid \omega=0) = \frac{1}{3} \cdot \frac{2}{3} = \frac{2}{9}.
  \]  
  \[
  P(s_A=1, s_B=0) = \frac{1}{2} \cdot \frac{2}{9} + \frac{1}{2} \cdot \frac{2}{9} = \frac{2}{9}.
  \]  
  \[
  P(\omega=1 \mid s_A=1, s_B=0) = \frac{\frac{1}{2} \cdot \frac{2}{9}}{\frac{2}{9}} = \frac{\frac{1}{9}}{\frac{2}{9}} = \frac{1}{2}.
  \]  
  Both value the asset at \(\frac{1}{2}\). At \(p = \frac{1}{2}\), neither gains from trade: A (buyer) requires \(p < \frac{1}{2}\), B (seller) requires \(p > \frac{1}{2}\). Trade collapses.  
  *Key assumptions*: Common prior (for initial posteriors) and common knowledge of rationality/willingness (to infer signals from willingness).  

  **Part 2: Market Maker**  
  (a) Market maker sets \(p = \text{prior expectation} = \frac{1}{2}\).  
  - A (signal 1): Valuation \(= \frac{2}{3}\) (price adds no info). Since \(\frac{2}{3} > \frac{1}{2}\), A buys.  
  - B (signal 0): Valuation \(= \frac{1}{3}\). Since \(\frac{1}{3} < \frac{1}{2}\), B sells.  

  (b) Market maker observes signals (1 and 0). As in Part 1(c), \(E[\omega \mid s_A=1, s_B=0] = \frac{1}{2}\), so \(p = \frac{1}{2}\).  
  Traders know \(p = \frac{1}{2}\) is set using both signals. Possible signal pairs:  
  - Both 1: \(p = \frac{4}{5}\) (since \(P(\omega=1 \mid \text{both }1) = \frac{4}{5}\)).  
  - Both 0: \(p = \frac{1}{5}\).  
  - Mixed: \(p = \frac{1}{2}\).  
  Thus, \(p = \frac{1}{2}\) implies mixed signals.  
  - A (signal 1): Infers \(s_B=0\), so valuation \(= \frac{1}{2}\) (as Part 1(c)).  
  - B (signal 0): Infers \(s_A=1\), so valuation \(= \frac{1}{2}\).  
  At \(p = \frac{1}{2}\), both value asset at \(p\), so no trade (no strict gain).  

  (c) If prices always fully reveal private information, traders cannot profit from private information (since prices already reflect it), so costly information gathering is unrewarded.  

  **Part 3: Restoring Trade**  
  **Modification 1: Heterogeneous priors**  
  - *Why trade*: Traders start with different beliefs, so conditioning on willingness doesn’t eliminate disagreement.  
  - *Cost to aggregation*: Prices reflect subjective beliefs, not aggregated evidence (common prior abandoned).  
  **Modification 2: Noise traders**  
  - *Why trade*: Some trade for exogenous reasons (e.g., liquidity), so willingness doesn’t fully reveal signals.  
  - *Cost to aggregation*: Prices become noisy, failing to perfectly aggregate information.  
  **Comparison**: Heterogeneous priors most severely undermine aggregation because they abandon the common prior—essential for prices to represent objective evidence. Noise preserves aggregation but adds noise; priors break the link between information and prices.  

  ---  
  ### Marking Scheme (25 marks total)  
  **Part 1: Bilateral Trade (10 marks)**  
  1. **1 mark**: Correct valuation for A (\(\frac{2}{3}\)).  
     *Common miss*: Misapplies Bayes (e.g., ignores prior).  
  2. **1 mark**: Correct valuation for B (\(\frac{1}{3}\)).  
     *Common miss*: Same as above.  
  3. **1 mark**: Correct \(p\) in \([\frac{1}{3}, \frac{2}{3}]\) (e.g., \(\frac{1}{2}\)).  
     *Common miss*: Chooses price outside interval.  
  4. **2 marks**: Infers willingness implies counterparty’s signal (A infers \(s_B=0\), B infers \(s_A=1\)).  
     *Common miss*: Computes initial posteriors but doesn’t condition on willingness.  
  5. **2 marks**: Correct joint posterior (\(\frac{1}{2}\) for both).  
     *Common miss*: Incorrect Bayes for joint signals (e.g., averages posteriors).  
  6. **2 marks**: Concludes no trade with explanation (valuations \(=p\), no strict gain).  
     *Common miss*: Asserts trade occurs without checking valuations.  
  7. **1 mark**: Uses common prior assumption explicitly in Bayes.  
     *Common miss*: Treats prior as trivial.  

  **Part 2: Market Maker (8 marks)**  
  8. **1 mark**: Correct \(p = \frac{1}{2}\) for (a).  
  9. **1 mark**: Correct valuations for (a) (A: \(\frac{2}{3}\), B: \(\frac{1}{3}\)).  
  10. **1 mark**: Correct trade decisions for (a) (A buys, B sells).  
      *Common miss*: Updates valuation using price incorrectly.  
  11. **1 mark**: Correct \(p = \frac{1}{2}\) for (b).  
  12. **1 mark**: Correct valuations for (b) (both \(\frac{1}{2}\)).  
  13. **1 mark**: Correct trade decision for (b) (no trade).  
      *Common miss*: Doesn’t infer signals from price.  
  14. **2 marks**: Explains why no incentive to gather information (no profit from private info).  
      *Common miss*: Vague (e.g., “no one trades”).  

  **Part 3: Restoring Trade (7 marks)**  
  15. **2 marks** (1 per mod): Names two distinct modifications (e.g., heterogeneous priors, noise traders, hedging, uncertain information quality).  
      *Common miss*: Lists non-distinct or irrelevant modifications.  
  16. **2 marks** (1 per mod): Explains why trade restores for each.  
      *Common miss*: Doesn’t link to conditioning in Part 1.  
  17. **2 marks** (1 per mod): Explains cost to aggregation for each.  
      *Common miss*: Vague (e.g., “prices are wrong”).  
  18. **1 mark**: Compares costs (ranks/severe flaw).  
      *Common miss*: Lists costs without comparison.  

  **Strong-answer discriminators**: Must-hit points 7 (explicit common prior) and 18 (comparison of costs).
