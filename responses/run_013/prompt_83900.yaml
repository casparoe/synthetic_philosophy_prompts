  (a) What is trader A's valuation given her signal (s_A=1) and the price p=1/2? What is trader B's valuation (s_B=0 and p=1/2)? Do they want to trade with the market maker at p=1/2? 
  (b) Now, suppose the market maker has access to both traders' signals and sets p to be the expected value of ω given both signals. What p does he set? What is each trader's valuation given their own signal and the price? Do they want to trade at that price?
  (c) Explain in one sentence why, if the market maker's price is always fully revealing in this way, traders would have no incentive to gather private information in the first place.

  Part 3: Minimal departures.

  We ask the students to suggest and compare at least two ways to restore trade in the bilateral setting. They should discuss the cost to the claim that prices aggregate dispersed information.

  We'll now write the question.

  Student-Facing Question:

  Question 1 (25 marks)

  Consider a market for a single asset that pays £1 if the state of the world ω is 1 and £0 if ω is 0. There are two traders, A and B, who are both risk-neutral. The prior probability of each state is 1/2. Initially, trader B holds one unit of the asset, and trader A holds none. 

  Each trader receives a private binary signal about the state. Conditional on the state, the signals are independent across traders. The signal is correct with probability 2/3: 
  - If ω=1, then each trader receives signal 1 with probability 2/3 and signal 0 with probability 1/3.
  - If ω=0, then each trader receives signal 0 with probability 2/3 and signal 1 with probability 1/3.

  Part 1: Bilateral Trade (10 marks)

  (a) Suppose trader A observes signal 1 and trader B observes signal 0. Compute the expected value of the asset for A (conditional only on her signal) and for B (conditional only on his signal). (2 marks)

  (b) At what price p would both traders be willing to trade? Specifically, A would be willing to buy the asset from B at price p, and B would be willing to sell it to A at price p. (2 marks)

  (c) Now, consider that the trade is offered at the price p from part (b). Trader A conditions on her own signal and the fact that B is willing to sell at p. Similarly, trader B conditions on his own signal and the fact that A is willing to buy at p. Compute the updated expected value of the asset for each trader under this conditioning. Does the trade occur? Explain why or why not. (6 marks)

  Part 2: Market Maker (8 marks)

  Now, instead of bilateral trade, a market maker sets a single price p at which he is willing to buy or sell the asset. The market maker is risk-neutral and has no private information. He sets p to be the expected value of the asset given his information.

  (a) Initially, the market maker has no information beyond the prior. What price p does he set? Given this price and their private signals, what is the expected value of the asset for trader A (with signal 1) and for trader B (with signal 0)? Would A want to buy the asset from the market maker at this price? Would B want to sell the asset to the market maker at this price? (3 marks)

  (b) Suppose now that the market maker observes both traders' signals and sets p to be the expected value of the asset given both signals. What p does he set? Given this price and their own private signals, what is the expected value of the asset for trader A and for trader B? (You may use the fact that the signals are one 1 and one 0.) Would either trader want to trade with the market maker at this price? (3 marks)

  (c) In one sentence, explain why, if the market maker's price always fully reveals all private information (as in part b), traders would have no incentive to gather private information in the first place. (2 marks)

  Part 3: Restoring Trade (7 marks)

  Suggest two distinct ways to modify the setting of Part 1 (bilateral trade) so that trade can occur at some price even after conditioning on the willingness to trade. For each modification, explain in one sentence why trade becomes possible. Then, for each modification, explain in one sentence what cost it imposes on the claim that market prices aggregate dispersed information. (7 marks)

  Model Answer:

  Part 1:
  (a) For A with signal 1:
     P(ω=1 | s_A=1) = [P(s_A=1|ω=1)*P(ω=1)] / P(s_A=1) = [(2/3)*(1/2)] / ( (2/3)*(1/2) + (1/3)*(1/2) ) = (1/3) / (1/2) = 2/3.
     So A's valuation = 2/3.

     For B with signal 0:
     P(ω=1 | s_B=0) = [P(s_B=0|ω=1)*P(ω=1)] / P(s_B=0) = [(1/3)*(1/2)] / ( (1/3)*(1/2) + (2/3)*(1/2) ) = (1/6) / (1/2) = 1/3.
     So B's valuation = 1/3.

  (b) B is willing to sell at any price >= his valuation (1/3). A is willing to buy at any price <= her valuation (2/3). So any price in [1/3, 2/3] would work. We can choose p = 1/2, the midpoint.

  (c) We condition:
     For A: she has s_A=1 and knows that B is willing to sell at p=1/2. B is willing to sell at 1/2 if his valuation <= 1/2. Given that B's valuation is 1/3 if s_B=0 and 2/3 if s_B=1, B is willing to sell at 1/2 only if his signal is 0 (since 1/3<=1/2 and 2/3>1/2). Therefore, A infers that s_B=0.

     Similarly, for B: he has s_B=0 and knows that A is willing to buy at 1/2. A is willing to buy at 1/2 only if her valuation >=1/2. A's valuation is 2/3 if s_A=1 and 1/3 if s_A=0. So A is willing to buy at 1/2 only if s_A=1. Therefore, B infers that s_A=1.

     Now both have the information: s_A=1 and s_B=0.

     Compute P(ω=1 | s_A=1, s_B=0):
     P(s_A=1, s_B=0 | ω=1) = P(s_A=1|ω=1)*P(s_B=0|ω=1) = (2/3)*(1/3)=2/9.
     P(s_A=1, s_B=0 | ω=0) = P(s_A=1|ω=0)*P(s_B=0|ω=0) = (1/3)*(2/3)=2/9.
     P(ω=1, s_A=1, s_B=0) = (1/2)*(2/9)=1/9.
     P(ω=0, s_A=1, s_B=0) = (1/2)*(2/9)=1/9.
     So P(s_A=1, s_B=0) = 1/9 + 1/9 = 2/9.
     Therefore, P(ω=1 | s_A=1, s_B=0) = (1/9) / (2/9) = 1/2.

     Similarly, both traders value the asset at 1/2.

     At p=1/2, A is not willing to buy (because 1/2 is not less than her valuation of 1/2; she is indifferent, but strictly speaking, with no gain) and B is not willing to sell (because 1/2 is not greater than his valuation of 1/2; he is indifferent). So the trade does not occur.

     [Note: In a model with risk neutrality, indifference might allow trade, but it is a knife-edge. Typically, we assume they require a strict gain, so no trade. Or we can say they are indifferent and hence do not strictly prefer to trade.]

  Part 2:
  (a) Market maker with no information sets p = prior expected value = 1/2.
     For A: she has s_A=1 and sees p=1/2. Since the price is the prior, it doesn't add information. So her valuation is 2/3 (as in part 1a). Since 2/3 > 1/2, she would be willing to buy at 1/2.
     For B: he has s_B=0 and sees p=1/2. His valuation is 1/3. Since 1/3 < 1/2, he would be willing to sell at 1/2.

  (b) Market maker observes both signals: s_A=1 and s_B=0. As in part 1c, he computes E[ω | s_A=1, s_B=0] = 1/2. So he sets p=1/2.
     Now, each trader sees p=1/2. Moreover, they know that the market maker sets p based on both signals. Therefore, they can infer that the signals must be one 1 and one 0 (because any other combination would lead to a different price? Actually, if both had the same signal, the price would be different). 

     Specifically, if both signals were 1, then E[ω|s_A=1,s_B=1] = P(ω=1|s_A=1,s_B=1) = [ (2/3)*(2/3)*(1/2) ] / [ (2/3)^2*(1/2) + (1/3)^2*(1/2) ] = (4/18) / ( (4/18) + (1/18) ) = 4/5.
     Similarly, if both were 0, E[ω|both 0] = [ (1/3)*(1/3)*(1/2) ] / [ (1/3)^2*(1/2) + (2/3)^2*(1/2) ] = (1/18) / ( (1/18)+(4/18) ) = 1/5.
     So the market maker would set:
        both 1: p=4/5
        both 0: p=1/5
        mixed: p=1/2.

     Therefore, when a trader sees p=1/2, they know that the signals are mixed (one 1 and one 0). 

     Now, trader A: she has s_A=1 and sees p=1/2. She knows that the other signal is 0. So her information is s_A=1 and s_B=0, so she values the asset at 1/2 (as in part 1c).
     Similarly, trader B: has s_B=0 and sees p=1/2, so he infers s_A=1 and values at 1/2.

     At p=1/2, both value the asset at 1/2, so they are not willing to trade (since they are indifferent or require a gain). Specifically:
        A would not want to buy at 1/2 because it is not below 1/2.
        B would not want to sell at 1/2 because it is not above 1/2.

  (c) If the price always fully reveals all private information, then traders cannot profit from their private information because the price already reflects it, so they would not recover the cost of gathering the information.

  Part 3: 
  Possible modifications:

  1. Heterogeneous priors: Traders have different prior beliefs about the state. Then, even after conditioning, they might still disagree.
     - Why trade becomes possible: They have genuine disagreement that is not eliminated by conditioning.
     - Cost to aggregation: Prices then reflect differences in beliefs rather than aggregation of information (evidence).

  2. Noise or liquidity traders: Some traders trade for exogenous reasons (e.g., liquidity needs) and not based on information. Then, the willingness to trade does not perfectly reveal information.
     - Why trade becomes possible: The willingness to trade might be due to non-informational reasons, so it doesn't fully reveal the signal.
     - Cost to aggregation: Prices become noisy signals of the aggregated information.

  3. Hedging motives: Traders have different risk exposures or hedging needs, so they trade for risk-sharing even if they have the same beliefs.
     - Why trade becomes possible: Trade occurs for reasons other than differences in beliefs.
     - Cost to aggregation: Prices reflect risk premia and hedging demands, not just information.

  4. Uncertainty about the information structure: Traders are unsure about the quality of the other's signal or the information structure. Then, conditioning on willingness to trade does not perfectly reveal the other's signal.
     - Why trade becomes possible: The inference from willingness to trade is ambiguous.
     - Cost to aggregation: Prices might not fully aggregate information because traders are uncertain about what others know.

  5. Non-common priors: The common prior assumption is relaxed. Then, even after conditioning, they might not agree.
     - But note: heterogeneous priors is already listed.

  We must compare them. The cost to aggregation:

  - Heterogeneous priors: prices reflect beliefs, not just evidence. The common prior is surrendered.
  - Noise traders: prices are noisy, so not fully revealing.
  - Hedging: prices reflect risk preferences, not just information.
  - Uncertainty about information structure: prices may not aggregate information perfectly.

  A strong answer will note that heterogeneous priors abandon the common prior assumption that underlies the notion that prices aggregate evidence. Noise traders make the price a noisy signal. Hedging motives add a non-informational component. Uncertainty about information structure prevents the common knowledge reasoning.

