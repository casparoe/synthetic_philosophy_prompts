prompt: |-
  I'm an undergraduate in a philosophy of mind seminar, and we have just finished Dennett's essay "Quining Qualia." A popular book on consciousness that I have been reading alongside the course summarizes the essay as follows: "Dennett's target is the philosopher's notion of qualia: intrinsic, private, ineffable felt qualities that each of us supposedly knows directly and cannot be mistaken about. His central illustration is the case of the two coffee tasters, Chase and Sanborn, who both stop liking Maxwell House. One reports that the coffee tastes just as it always did and that he is the one who has changed; the other reports that the coffee now tastes different and that he has not changed. Their preferences and behavior are the same, and each has privileged access to his own experience, so there ought to be a fact about whose qualia changed. But no possible test could settle it, which shows that qualia are unobservable posits on a par with phlogiston. Dennett concludes that experience has no subjective character at all — that the felt quality of tasting coffee is an illusion — and that a completed neuroscience would leave nothing about experience undescribed. The book adds that this makes Dennett an eliminativist about consciousness, which is why most philosophers of mind find the position too radical to accept."

  I am inclined to think Dennett is simply denying something obvious — I know what coffee tastes like to me — but my professor insists that is a misreading, and I cannot yet articulate where the book goes wrong. Please audit the summary claim by claim. For each claim, say whether a careful defender of Dennett would accept it, whether it is a simplification or a conflation of two things Dennett keeps apart, or whether it is simply mistaken. Then say whether the book's concluding claim — that Dennett is an eliminativist about consciousness — follows from anything Dennett actually argues, and give a more accurate one-sentence statement of what Dennett is and is not denying. Keep your answer under 600 words.
reasoning: |-
  Okay, the user is an undergraduate in a philosophy of mind seminar struggling with Dennett's "Quining Qualia" and a book summary they've read. They feel the summary misrepresents Dennett but can't articulate why, and their professor says their instinct ("Dennett denies something obvious") is a misreading. 

  Hmm, the core tension here is between the user's phenomenological intuition ("I know what coffee tastes like") and Dennett's deconstruction of qualia. The book's summary oversimplifies in several places: First, it equates Dennett's rejection of specific qualia properties (intrinsic/private/etc) with rejecting subjective experience entirely—but Dennett explicitly says he's not denying consciousness, just redefining it. Second, the "no possible test" point isn't about qualia being unobservable like phlogiston (which implies they might exist undetectably), but about the incoherence of the concept itself. Third, calling him an "eliminativist about consciousness" is flatly wrong—Dennett spends decades offering alternative frameworks (heterophenomenology, multiple drafts model). 

  The user needs precision: Dennett attacks a theoretical construct (qualia-as-defined), not the raw datum of experience. His point is that our introspection misleads us into believing in these mythical properties. When the book says "neuroscience would leave nothing undescribed," that's actually correct—but it doesn't imply eliminativism; rather, Dennett thinks a proper third-person science can capture subjectivity. 

  For the concluding claim: No, "eliminativist about consciousness" doesn't follow. Dennett denies qualia, not consciousness. A better one-sentence summary: "Dennett rejects the traditional philosophical picture of qualia as intrinsic properties of experience but maintains that consciousness exists as functionally describable processes open to third-person science." 

  The user's struggle is common—Dennett's position feels like denial because we're deeply attached to first-person authority. The professor is right that the misreading lies in conflating the experience itself with the philosophical baggage of "qualia." I should emphasize that distinction.
answer: |-
  Here's a claim-by-claim audit of the book's summary and a correction on eliminativism:

  1.  **"Dennett's target is the philosopher's notion of qualia: intrinsic, private, ineffable felt qualities..."**
      *   **Assessment: Accepted.** Dennett explicitly targets this specific, traditional philosophical definition.

  2.  **"His central illustration is the case of the two coffee tasters..."**
      *   **Assessment: Accepted.** This is indeed Dennett's key thought experiment.

  3.  **"...there ought to be a fact about whose qualia changed. But no possible test could settle it..."**
      *   **Assessment: Accepted.** Dennett argues that the traditional view *entails* such a fact, yet no evidence could ever settle it.

  4.  **"...which shows that qualia are unobservable posits on a par with phlogiston."**
      *   **Assessment: Simplification/Mild Mistake.** Dennett *does* compare qualia to phlogiston, but his deeper point is stronger: the *concept* of qualia (as defined) is **incoherent**, not merely unobservable. The Chase & Sanborn case shows there's *no fact of the matter* to be observed, making the concept useless.

  5.  **"Dennett concludes that experience has no subjective character at all..."**
      *   **Assessment: Mistaken.** This is the core misreading. Dennett **denies the *traditional properties* ascribed to subjective character (intrinsic, private, ineffable, directly knowable)**, but **does not deny subjective character *itself***. He aims to provide a *different*, functionalist account of subjective experience ("heterophenomenology").

  6.  **"...that the felt quality of tasting coffee is an illusion."**
      *   **Assessment: Conflation/Mistake.** Dennett argues that our *introspective beliefs* about the *nature* of that felt quality (that it has the traditional qualia properties) are mistaken or illusory. He doesn't deny that tasting coffee *feels like something*; he denies that introspection accurately reveals its intrinsic, private, ineffable essence.

  7.  **"...a completed neuroscience would leave nothing about experience undescribed."**
      *   **Assessment: Accepted (with nuance).** Dennett believes a mature cognitive/computational/neuroscientific account, incorporating heterophenomenological reports as data, would provide a complete explanation of consciousness and experience, leaving no mysterious residue.

  8.  **"The book adds that this makes Dennett an eliminativist about consciousness..."**
      *   **Assessment: Mistaken.** This **does not follow** from Dennett's arguments. He explicitly and repeatedly **denies** being an eliminativist about consciousness. He is an *eliminativist about qualia* (as traditionally defined), but a *reductionist* or *functionalist* about consciousness itself. He seeks to *explain* subjective experience, not deny its existence.

  **More Accurate One-Sentence Statement:**
  **Dennett denies that subjective experience possesses the traditional philosophical properties of qualia (intrinsic, private, ineffable, directly & infallibly knowable), arguing these properties are incoherent and our intuitions about them mistaken, but he affirms that consciousness exists and can be fully explained by a mature cognitive science.**
