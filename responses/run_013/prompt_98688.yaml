answer: |-
  ### Final Examination: PHIL 310 Normative Ethics  
  **Time Allowed:** 45 minutes  
  **Total Marks:** 25  

  **Question:**  
  In the case below, the city council broadcasts a false report to divert a militia away from a civilian district, foreseeing that the militia will sack a distant settlement during redeployment. The council does not desire the settlers’ deaths but recognizes that the militia’s predictable violence is essential to the success of their diversion. Using the Doctrine of Double Effect (DDE), critically evaluate whether the council’s action is morally permissible. Your analysis must:  
  1. Explain why standard applications of DDE (e.g., trolley or medical cases) fail to resolve this dispute.  
  2. **Articulate two distinct interpretations** of what it means to "intend" harm or "use harm as a means" when the harm is carried out by another agent’s free choice.  
  3. **Defend one interpretation** as the correct reading of DDE, demonstrating why it justifies or condemns the council’s action.  
  *(Note: Merely listing DDE’s conditions without engaging these challenges will receive minimal credit.)*  

  ---

  ### Model Answer (Approx. 700 words)  
  The council’s action violates the Doctrine of Double Effect (DDE) and is impermissible. While the council does not directly cause the settlers’ deaths, it deliberately exploits the militia’s predictable atrocity to achieve its goal. This constitutes intending harm as a means, rendering DDE inapplicable.  

  **1. The inadequacy of standard DDE cases**  
  Typical DDE cases (e.g., diverting a trolley or removing a uterus while foreseeing fetal death) involve harms *directly* caused by the agent’s own act. The harmful outcome is either physically enacted by the agent (e.g., pulling a lever) or an immediate consequence of their intervention (e.g., a patient dying after surgery). In such cases, labeling harm a "side effect" is plausible because the agent’s causal chain does not *require* another agent’s moral failure. Here, however, the council’s plan *depends entirely* on the militia’s immoral choice to sack the settlement. The harm is not collateral to the council’s act; it is outsourced to a third party whose wrongdoing the council weaponizes. Standard DDE frameworks ignore this mediated agency, making them useless here.  

  **2. Two rival interpretations of "intention" in mediated harms**  
  - **Causalist Interpretation:** An agent "intends" harm only if it is part of their *own causal plan*. Harm executed by another’s free choice is always "merely foreseen," as the second agent’s autonomy breaks the first agent’s moral responsibility. The council *intends* only the broadcast and diversion; the sacking is external to their will.  
  - **Agency-Expanded Interpretation:** An agent "intends" harm if they *rely* on another’s immoral act to achieve their goal, even if they do not physically commit it. By incorporating the militia’s violence into their plan, the council treats the settlers’ deaths as a necessary tool, making it a means.  

  **3. Defending the agency-expanded interpretation**  
  The causalist view is untenable because it ignores *how the agent’s plan functionally incorporates harm*. DDE forbids using evil as a means, and "means" must include outcomes an agent knowingly manipulates to succeed. Here, the council’s diversion *works* only because they anticipate and instrumentalize the militia’s war crime. Without the sacking, the militia’s redeployment would not achieve the council’s goal: the diversion is effective *because* the militia moves toward the settlement *to destroy it*. Thus, the council does not merely foresee the harm; their plan *activates and exploits it*.  

  This meets DDE’s prohibition against intending harm as a means:  
  - **Condition 1 (Permissible Act):** Broadcasting a report is neutral, *but* its permissibility dissolves when the act is intrinsically tied to orchestrating atrocity.  
  - **Condition 2 (Intention):** The council intends the diversion *through* the militia’s violence. The sacking is not incidental but is calculatively harnessed.  
  - **Condition 3 (Means/Side Effect):** The harm is a *means*, not a side effect. The militia’s path is the diversionary mechanism, and the sacking is its foreseeable trigger.  
  - **Condition 4 (Proportionality):** While saving thousands may outweigh hundreds of deaths, proportionality cannot cleanse an intended evil.  

  *Contestable element:* Critics may argue the militia’s free choice absolves the council (causalist view). Yet DDE concerns the moral agent’s *deliberative structure*, not just physics. When agents outsource harm they could avoid—especially by leveraging others’ vices—they adopt that evil as their instrument. The council had alternatives (e.g., truthful warnings, evacuations), but *chose* a plan that functionally required mass murder.  

  **Conclusion:** The council acts impermissibly. DDE’s core purpose is to prohibit moral corruption by means-end reasoning. By outsourcing violence to the militia, the council violates this spirit, regardless of causal distance.  

  ---

  ### Marking Scheme (25 Marks Total)  
  **First-Class Answer (21–25 marks) must:**  
  1. **Explain why standard DDE cases fail** (3 marks):  
     - Contrast direct causation in trolley/medical cases vs. *reliance on another’s immoral act* here.  
  2. **Articulate both rival interpretations** (5 marks):  
     - Causalist: Harm by others’ choices is "foreseen" due to autonomy.  
     - Agency-expanded: Harnessing others’ wrongdoing makes harm "intended."  
  3. **Adjudicate decisively** (12 marks):  
     - Defend one view using DDE’s principles (e.g., means vs. side effect; corrupting intentions).  
     - Show how the council’s *reliance* on the militia’s violence makes harm a *functional means*.  
     - Address proportionality *only after* establishing the act is intrinsically tainted.  
  4. **Structure and clarity** (3 marks): Logical flow; precise language.  

  **Upper Second-Class (16–20 marks) caps due to:**  
  - **Superficial adjudication** (e.g., "Both views have merit" without defending one).  
  - **Misapplying DDE conditions:** Listing conditions without resolving the interpretive conflict.  
  - **Ignoring mediated agency:** Assuming harm is "merely foreseen" because the council didn’t kill.  

  **Common Pitfalls (Marks capped at 15 or below):**  
  - **Reciting DDE without engagement** (≤10 marks): Repeating the four conditions verbatim.  
  - **Ignoring the key dispute** (≤12 marks): Not contrasting causalist vs. agency-expanded readings.  
  - **Conflation** (≤15 marks): Equating "foresight" with "intention" or confusing proportionality with means-end reasoning.  

  **Note:** A strong answer *must* reject rote memorization by confronting the ambiguity of "intention" in mediated harms. The top mark band requires a committed, philosophically nuanced defence of one interpretation.  

  ---  
  This exam item forces students to dissect DDE’s conceptual machinery, not reheatre it. The model answer takes a firm stance, but the marking scheme rewards rigor over agreement—provided students grapple with the agency problem at the heart of the case.
