answer: |-
  ### Exam Question
  **Answer one question. Time allowed: 90 minutes.**  
  *"Benacerraf’s dilemma presents two challenges for mathematical realism: a *semantic* demand that mathematical statements have determinate truth conditions grounded in abstract objects, and an *epistemic* demand that our beliefs about such objects be reliably connected to what makes them true. Inferentialist platonism proposes to resolve this dilemma by arguing that mathematical objects are theoretical posits justified by their indispensable explanatory role in our best theories, akin to scientific realism. Our warrant for believing in them stems from their theoretical virtues (e.g., simplicity, explanatory power), not causal contact.*  

  **Critically evaluate whether inferentialist platonism succeeds in dissolving Benacerraf’s dilemma. Your answer must:**  
  (1) State the two horns of the dilemma, explaining precisely why they are distinct challenges and not merely the same concern repeated.  
  (2) Assess whether this proposal resolves the dilemma or merely relabels the epistemic ‘access problem’.  
  (3) Specify what a solution must accomplish to avoid stalemate (e.g., by reconciling the demands or redefining their scope).**  

  ---

  ### Model Answer (798 words)  
  Benacerraf’s dilemma poses two distinct but interwoven challenges for mathematical platonism. The **semantic horn** demands that mathematical statements (e.g., “2 + 3 = 5”) possess objective truth conditions grounded in mind-independent abstract objects. For realists, this requires a uniform semantics where “2” rigidly refers to a specific abstract entity, and truth is determined by its properties, independent of human cognition. The **epistemic horn**, conversely, demands that our mathematical beliefs be reliably connected to these truth-makers. If abstract objects are causally inert (as platonism holds), it seems impossible to explain how humans reliably form true beliefs about them—e.g., how we “access” the number 2. Crucially, these are not the same worry: the semantic horn concerns *what makes sentences true* (a metaphysical question), while the epistemic horn concerns *how we can reliably track those truth-makers* (a cognitive question). Conflating them obscures why satisfying one (e.g., securing truth conditions) may worsen the other (e.g., making knowledge inexplicable).  

  Inferentialist platonism addresses the epistemic horn by replacing causal contact with explanatory justification. It posits that mathematical objects, like electrons in science, are warranted by their indispensability in our best theories. We “know” of prime numbers because their postulation simplifies number theory, resolves anomalies, or unifies mathematical domains. This abandons causal epistemology, instead relying on inference to the best explanation (IBE). On the surface, this dissolves Benacerraf’s dilemma: truth conditions are secured by realism (satisfying the semantic horn), while knowledge is secured by IBE (satisfying the epistemic horn without causal contact). However, this proposal fails. It relabels—but does not resolve—the access problem, because it cannot ensure that our successful theories *correspond to specific abstract structures* rather than merely being useful fictions.  

  The core failure lies in the **targeting problem**: IBE justifies belief in *the existence of some abstract structure that fulfills a role*, but not that our theories pick out *one unique structure*. For example, our best set theory (e.g., ZFC) might be explanatorily successful, but it cannot distinguish between isomorphic models (e.g., different implementations of the natural numbers). IBE warrants belief that *some* ω-sequence exists, but not that our concept “natural number” refers to *this* particular abstract object (e.g., von Neumann ordinals) rather than a structurally identical alternative (e.g., Zermelo ordinals). This indeterminacy violates the semantic horn’s demand for determinate reference. Worse, since abstract objects lack causal profiles, no empirical or explanatory virtue can break symmetries between isomorphic models. Thus, inferentialism buys knowledge of *structural possibilities* at the cost of truth-conditional specificity. It relocates the access problem from “How do we contact abstracta?” to “How do we fix reference to particular abstracta?”, leaving the semantic demand unfulfilled.  

  The strongest objection to this criticism is that **explanatory success itself fixes reference**. If a posit (e.g., “prime number”) plays a unique role in explaining mathematical phenomena (e.g., the fundamental theorem of arithmetic), this role determines which abstract object it denotes. Just as “electron” refers via its functional role in physical theories, “prime number” refers via its role in mathematical ones. Thus, targeting is achieved automatically by theoretical integration.  

  This reply fails. First, mathematical objects lack the contingent properties that anchor scientific reference. Electrons are individuated by their causal powers (e.g., charge, mass), but prime numbers are individuated solely by their structural relations. Since multiple abstract structures identically satisfy those relations, no unique referent is fixed. Second, explanatory virtues (e.g., simplicity) are pragmatic features of *theories*, not properties of abstracta. They tell us which *descriptions* are useful, not which objects are real. For instance, preferring von Neumann ordinals for their ease in defining arithmetic operations reflects human cognitive preferences, not a metaphysical fact about numbers. Thus, inferentialism conflates justification for *accepting a theory* with justification for *believing in a specific ontology*. The former is secured; the latter is not.  

  To transcend stalemate, a solution must accomplish two things. First, it must **naturalize mathematical epistemology** without causal contact—e.g., by showing how reliability emerges from non-causal constraints (e.g., evolutionary pressures for consistent counting, or proof practices that converge on invariant structures). Second, it must **reconcile determinate reference with structural equivalence**, perhaps by redefining truth-conditional semantics (e.g., embracing structural realism where truth is model-relative) or by anchoring reference in mathematical practice (e.g., via primitive intentionality). Crucially, it must avoid *ad hoc* compromises: merely privileging epistemology over semantics (e.g., “truth is pragmatic”) surrenders realism, while privileging semantics over epistemology (e.g., “access is mysterious”) invites skepticism.  

  Inferentialist platonism makes progress by decoupling knowledge from causation, but it stumbles on targeting. Until it can explain how explanatory success selects *particular* abstracta—not just structures—it remains a sophisticated relabeling of the access problem. Benacerraf’s dilemma persists.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Must-hit points** (Award marks only if addressed explicitly):  
  1. **Distinguishes semantic and epistemic horns** (5 marks):  
     - *Semantic*: Truth conditions grounded in abstract objects.  
     - *Epistemic*: Reliable belief formation about those objects.  
     - *Mistake*: Conflating them as "just about knowledge" or "just about truth."  
  2. **Accurately characterizes inferentialist platonism** (5 marks):  
     - Justifies mathematical objects via theoretical virtues (e.g., IBE), rejecting causal contact.  
     - *Mistake*: Equating it with nominalism or causal platonism.  
  3. **Assesses whether it resolves or relabels the dilemma** (5 marks):  
     - Credits its epistemic advance (replaces causation with IBE).  
     - Critiques its semantic failure (targeting problem).  
     - *Mistake*: Claiming IBE "solves" access without addressing reference indeterminacy.  
  4. **Identifies a specific residual problem** (5 marks):  
     - Targeting problem: IBE cannot fix reference to unique abstract objects (e.g., isomorphic models).  
     - *Mistake*: Only repeating the original access problem without relocation.  
  5. **Articulates requirements for a solution** (5 marks):  
     - Naturalizing epistemology (non-causal reliability) + reconciling reference with structural equivalence.  
     - *Mistake*: Vague appeals to "better explanations" or ignoring the semantic-epistemic tension.  

  **Grading Thresholds**:  
  - **A (21–25 marks)**: Hits all 5 points; defends a clear verdict (e.g., "relabels but fails"); uses precise distinctions (e.g., targeting vs. access).  
  - **B (15–20 marks)**: Addresses 3–4 points; conflates horns (e.g., "both are about knowledge") or treats IBE as automatically securing reference; vague on residual problems.  
  - **C (10–14 marks)**: Superficial treatment; misstates dilemma or inferentialism; omits >2 points.  
  - **D/F (<10 marks)**: Major omissions/errors; fails to engage the dilemma’s structure.  

  **Note**: Award credit for coherent alternative positions (e.g., arguing inferentialism succeeds), but deduct if they ignore the targeting problem or miss distinctions. Prioritize analytical depth over agreement with the model answer.  

  ---  
  **Rationale**: This question forces students to disentangle semantics and epistemology—a common oversight in textbook treatments—while testing their ability to evaluate novel solutions. The model answer takes a defensible critical stance (aligning with your suspicion) but rewards students who coherently defend inferentialism. The marking scheme prioritizes precision over coverage, penalizing conflation and vagueness typical of B-grade essays.
