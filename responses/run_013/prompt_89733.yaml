  ## The False Purity of Strict Dominance: A Call for Epistemic Consistency in Game Theory

  The textbook gospel is clear: iterated elimination of *strictly* dominated strategies (IESDS), especially allowing mixed-strategy dominators, is the rational gold standard. It preserves Nash equilibria and yields order-independent results. Iterated elimination of *weakly* dominated strategies (IEWDS), however, is a messy heuristic. Order matters, equilibria vanish, and its epistemic foundations seem shakier. This hierarchy is presented as principled, rooted in rationality itself. Yet, the games you present expose a critical inconsistency. The textbooks elevate mixed IESDS based on its mathematical convenience, not its epistemic purity. **The standard "strict good, weak bad" line is fundamentally unprincipled; mixed IESDS relies on an epistemic leap comparable to IEWDS, and we should elevate our epistemic standards for *both* procedures in practice.**

  Let's dissect the epistemic defense. A strategy is eliminated under IESDS (with mixing) only if it is *never* a best response to *any* belief profile over opponents' strategies. This seems compellingly rational: why play something that isn't best under *any* conceivable scenario? Your first game demonstrates this power: C is strictly dominated by the mixed strategy (0.5A, 0.5B). Against any column, this mix yields at least 1.5, beating C's maximum of 1. Rationality, we're told, demands C's elimination.

  Now, consider weak dominance. A strategy is weakly dominated if there exists another that is *at least as good* against *all* opponent plays and *strictly better* against *some*. The epistemic argument against IEWDS centers on the "at least as good" part. A weakly dominated strategy *can* be a best response, but *only* against beliefs that assign zero probability to the specific opponent strategies where the dominating strategy performs strictly better. The standard counter-argument is this: "Rationality alone doesn't forbid playing a best response, even if it's weakly dominated. You need *additional* assumptions – like opponents never making 'mistakes' (playing the strategies where weakness is exposed) or players having 'trembling hand' beliefs."

  **Here lies the fatal inconsistency.** The epistemic justification for eliminating C in your first game via mixed IESDS rests entirely on the *logical possibility* of the opponent playing *any* strategy. We eliminate C because we must consider beliefs where the opponent plays X, Y, *or* Z. Yet, when defending the *banishment* of IEWDS, the textbooks suddenly retreat from considering all logically possible beliefs. They implicitly demand that players only consider beliefs with *full support* (positive probability on every opponent strategy) to justify eliminating a weakly dominated strategy. Why is considering *all* beliefs essential for strict dominance but suddenly problematic for weak dominance?

  Your second game highlights the practical consequences. (M, L) is a Nash equilibrium. Eliminating the weakly dominated M *first* destroys this equilibrium. Textbooks use this to damn IEWDS. But what is the epistemic basis for *not* eliminating M? It's *only* that we must consider beliefs where Column plays *only* L (with probability 1). Why is it rational to entertain a belief assigning *zero* probability to R when justifying why M shouldn't be eliminated? If we truly embrace the "never best response under *any* belief" logic of mixed IESDS, then we must apply it symmetrically: M *is* never a best response under any belief with *full support* (since against full-support beliefs, T strictly beats M when R is played with any positive probability). The textbooks arbitrarily restrict the belief set for weak dominance while embracing its universality for strict dominance with mixing.

  **The uncomfortable truth is this:** The clean mathematical properties of mixed IESDS (order-independence, equilibrium preservation) are not pure emanations of rationality. They are *consequences* of its specific epistemic justification ("never best response under *any* belief"). However, the epistemic justification for eliminating weakly dominated strategies ("never best response under any belief with *full support*") is equally compelling *if* we accept that rational players should hold beliefs allowing for the logical possibility of any opponent mistake or action. The textbook hierarchy elevates mixed IESDS not because its epistemic foundations are inherently superior, but because its mathematical consequences are tidier. This prioritization of mathematical convenience over epistemic consistency is unprincipled.

  **What should we do in practice?** We must acknowledge the epistemic demands underlying *both* procedures clearly:

  1.  **Mixed IESDS is Safe:** Use it confidently. Its order-independence and equilibrium preservation are valuable practical properties, and its epistemic justification ("never best response under *any* belief") is strong and uncontroversial.
  2.  **IEWDS Requires Careful Justification:** Do not dismiss it entirely, but *never* apply it blindly as an iterative procedure. Its use requires explicit epistemic justification:
      *   **Full-Support Beliefs:** If we explicitly assume players hold beliefs assigning positive probability to *all* opponent strategies (perhaps due to uncertainty or the possibility of trembles), then eliminating a strategy weakly dominated *only* by another pure strategy is justified. It is rational under this specific epistemic constraint (as M is eliminated in your second game under this view).
      *   **Trembling-Hand Perfection:** Weakly dominated strategies are eliminated in Trembling-Hand Perfect Equilibrium. If refining to this solution concept, IEWDS (applied cautiously) can be a step towards it.
      *   **Single-Round Caution:** If using IEWDS, limit it to a *single round* of elimination *before* proceeding with IESDS or equilibrium analysis. This mitigates path-dependence issues. State the epistemic assumption (full-support beliefs) clearly when doing so.
      *   **Avoid Blind Iteration:** Never apply IEWDS iteratively without acknowledging the potential for order-dependence and equilibrium loss. The fact that (M, L) vanishes if M is eliminated first is a *feature*, not necessarily a bug, if our epistemic assumption (full-support beliefs) renders M irrational.

  **Verdict: The textbook line prioritizing mixed IESDS over IEWDS is fundamentally unprincipled.** It confuses mathematical convenience (order-independence) for epistemic superiority. Mixed IESDS relies just as much on the requirement to consider *all possible beliefs* as IEWDS relies on the requirement to consider beliefs with *full support* to justify elimination. The epistemic argument doesn't cleanly separate them; the math does. In practice, embrace mixed IESDS fully. For weak dominance, abandon iterative application as a general heuristic. Instead, use it sparingly, consciously, and only with a clear justification rooted in specific epistemic assumptions about beliefs – primarily the assumption of full-support beliefs – clearly stated. Rationality demands not just eliminating bad strategies, but also intellectual consistency in our justifications for doing so.
