  For letter 1 (uncle's coin bet): The reader has seen a coin land heads 60/100 times. Using Kelly, the optimal fraction is edge/odds = (0.6-0.5)/1 = 10% of bankroll. But since edge is estimated, we should stake less - I'll suggest 5% as prudent.

  For letter 2 (inheritance loss): The columnist would explain that "getting back" isn't the goal - current bankroll is now £5k, period. Applying Kelly to new bets is the only rational path. The satire comes from ignoring emotional aspects of loss.

