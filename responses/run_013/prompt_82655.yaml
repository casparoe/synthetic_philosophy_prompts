answer: |-
  ## Ask the Growth Guide  
  *Where life’s uncertainties meet optimal fractional stakes.*

  **Dear Growth Guide,**  
  My uncle offered me even-money odds on a coin flip. I’ve seen this coin flipped 100 times; it landed heads 60 times. I have £5,000 saved for a house deposit. How much should I stake?  
  — **Cautious in Coventry**

  **Dear Cautious,**  
  Your estimated probability of heads is 60%, giving you a 10% edge (0.60 - 0.50) on a 1-to-1 payout. The Kelly Criterion suggests staking *f* = edge/odds = 10% of your bankroll. However, your edge is *estimated*, not known. Prudence dictates fractional Kelly – stake half the recommended fraction, so 5%. Thus, wager £250. Never stake more simply because the "house deposit" purpose feels urgent. Purpose is irrelevant; only the multiplicative growth of your bankroll matters. Stake £250, rejoice in the positive expected geometric growth, and ignore the siren song of arithmetic expectation whispering "stake £1,000 for an expected £100 profit". That way lies ruin.  

  **Dear Growth Guide,**  
  I inherited £45,000. Following my own spreadsheet (which calculated positive expected value), I placed a series of bets. I now have £5,000 left. How do I get back to £45,000 as quickly as possible?  
  — **Reeling in Rochester**

  **Dear Reeling,**  
  You misunderstand the nature of growth. Your current bankroll is £5,000. The £45,000 is gone. It is a sunk cost, an irrelevant historical data point. "Getting back" is an emotional, arithmetical fantasy. Your sole focus must be maximising the geometric growth rate *from your current £5,000*. If your future bets have positive geometric expectation (carefully estimated, using fractional Kelly to account for uncertainty!), then betting optimally will regrow your wealth fastest *in the long run*. Attempting to force a return to £45,000 quickly almost certainly means overbetting, turning a 90% loss into a 100% loss. Accept your new reality: £5,000. Size your next bet as a fraction of *that*. If the bets were truly +EV but variance struck, continuing rationally is your only path – though the journey back will be long and require immense discipline. Staking large fractions out of desperation guarantees the terminal outcome you fear: zero.  

  **Dear Growth Guide,**  
  My riverside flat has about a 1-in-500 annual chance of being completely destroyed by flood. Insurance costs £800/year, but the expected loss is only (£250,000 flat value / 500) = £500. You told Cautious to stake only 5% on a good bet, yet buying insurance seems like accepting a terrible bet (paying £800 to avoid a £500 expected loss!). Doesn’t this contradict your advice?  
  — **Perplexed in Poole**

  **Dear Perplexed,**  
  An excellent question revealing a common confusion. Insurance is *not* a bet you take for its positive expectation; it’s a bet you take to *avoid catastrophic ruin*. The Kelly Criterion isn’t about maximising arithmetic expectation; it’s about maximising the long-term growth rate of your wealth. Losing your £250,000 flat represents a loss of over 100% of your wealth tied to that asset – effectively, ruin within that domain. The geometric utility of ruin is negative infinity. Paying a premium larger than the expected loss (£800 > £500) is rational *if* it eliminates a sufficiently large, catastrophic loss probability. Here, a 0.2% chance of losing everything you’ve invested in the flat justifies the premium. Think of it as staking £800 to protect the remaining 99.8% of your flat's value from annihilation. This is perfectly consistent with fractional Kelly: you are staking a tiny fraction (£800) of your total life bankroll to avoid a terminal loss. Not buying it would be an enormous, reckless overbet on the certainty of no flood. Pay the premium.  

  **Dear Growth Guide,**  
  I’ve been offered a job at a fascinating startup. My current salary is £80k. The startup offers £40k plus valuable equity. There’s a 70% chance the company fails in 2 years (I lose salary difference + equity), a 25% chance it modestly succeeds (I break even vs. current path over 5 years), and a 5% chance it becomes wildly successful (10x my current net worth). Crucially, there’s no “repeated bet” here – I only get one career trajectory! How does geometric rationality apply?  
  — **Wary in Warwick**

  **Dear Wary,**  
  You correctly identify the core challenge: this is a singular, non-replicable sequence. Strictly speaking, the Kelly framework assumes repeated opportunities to apply the same edge. Your career is one long, complex, non-stationary bet. However, the *logic* of maximising the geometric mean of outcomes still applies. We must consider the multiplicative impact on your lifetime wealth potential. Calculate the *geometric expected value* of the outcomes relative to your current path’s certain continuation. Outcome 1 (70%): Wealth multiplier ≈ 0.8 (due to lower salary). Outcome 2 (25%): Multiplier ≈ 1. Outcome 3 (5%): Multiplier ≈ 10. The geometric mean is (0.8^0.7) * (1^0.25) * (10^0.05) ≈ 0.855 * 1 * 1.122 ≈ 0.96. A geometric mean less than 1 implies a negative expected *growth rate* compared to your baseline. While the arithmetic expectation might be positive (driven by the lottery ticket), the high chance of a significant relative loss dominates geometrically. Kelly logic suggests declining bets with negative geometric expectation, even if they offer lottery-like payoffs. Stay put. (Though strictly, without repetition, the framework is… strained. But the geometric mean calculation remains the soundest guide we have for such existential choices.)  

  *Keep growing multiplicatively,*  
  **The Growth Guide**  

  **P.S. Quick Growth Queries:**  
  **Q:** Should I buy a lottery ticket? **A:** Negative edge, negative geometric expectation. Stake £0.  
  **Q:** How much to spend on my partner’s birthday? **A:** Budget a small, fixed fraction of net worth annually for discretionary joy – perhaps 0.5% Kelly fraction applied to relationship capital.  
  **Q:** Invest my emergency fund? **A:** Only if you define "emergency" as a favourable bet. Liquidity avoids ruin; stake £0 in volatile assets.  
  **Q:** Have children? **A:** The ultimate long-term, high-variance investment with unknown edge. Fractional Kelly suggests starting small. One is often prudent.
