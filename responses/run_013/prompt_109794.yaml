  For (d) - interventional fairness: This could potentially escape if we define counterfactuals carefully, but it's messy. Maybe 0.25 credence that it fully dissolves the conflict.

  For (e) - exogenous base rates: If the predictor itself causes base rate changes, the premise might collapse. But in static analysis, we assume exogeneity. I'll go with 0.65.

