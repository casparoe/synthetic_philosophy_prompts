prompt: |-
  Three chapters into the new novel and I've hit a wall I can't think my way through, so I'm outsourcing the philosophy to you.

  Here's the setup. My protagonist joins a small secular community — no god, no guru, just a charter and a rota for the cooking — whose entire doctrine is that only the absence of craving and suffering matters. Everything else people call good (love, work, beauty, being right, the satisfaction of finishing a thing) is either a route to one of those two absences or a distraction from them. I've been calling it tranquilism in my notes. I'm not asking whether it's true. I'm asking for the spec.

  What I need is the list of things any theory in this area has to get right before I can put it in characters' mouths without the book reading like a first-year seminar. The cases it has to handle, the distinctions it isn't allowed to collapse (a life being good vs. a stretch of time being good, craving vs. merely wanting, the absence of a bad thing vs. the presence of a good one), the facts about how people actually work that it can't contradict. With the case or consideration behind each item, please, so I can see which ones are load-bearing and which are just how one camp likes its furniture arranged. Mark those too — non-negotiable vs. a matter of taste.

  And keep it in the weeds. I don't need the survey of hedonism, desire-satisfaction and objective lists; I've read enough of that to fake a paragraph of dialogue. I want the awkward joints. How does the theory handle time — does dreamless sleep count toward a life's score, is tranquility a state you're in or an achievement you have? What does it say about the woman who gets her cravings amputated rather than satisfied? Can the doctrine even be stated without prescribing a craving for itself? Is "mattering" a separate requirement from "being desired"? Whatever you've got along those lines.

  Two things I care about more than you probably will:

  1. The purpose clause. This theory doesn't have to be true, it has to be livable — good enough for a real community to run on and for one woman to hold onto while she's doing the dishes. So if a requirement follows only from wanting a tidy academic object (full comparability between lives, a single number at the end of it), flag it as that, because my characters don't need it and it makes them sound like actuaries.

  2. Tell me if some pair of the requirements can't both be met. That's the scene. That's where the fight in chapter nine goes. If the list itself turns out to be jointly unsatisfiable, say so plainly — that's the most useful sentence you could write me. Also flag the one requirement that does the most excluding, the one a theory can't survive losing, because that's the one my antagonist will attack.

  Then, short — a page at most — where tranquilism actually strains against the list. Not a verdict on the view, just the joints that creak. I need to know which scenes are genuine trouble and which are my protagonist being dim.

  A table is fine for the list. No reading list please, I'm not going to read any of it, and I can't have a character cite a book I've never opened.

  Last line, keep the shape exactly: Verdict: [jointly satisfiable | not jointly satisfiable] :: [the one requirement that does the most excluding, six words or less]
reasoning: |-
  Okay, the user is a writer working on a novel featuring a "tranquilist" community that prioritizes the absence of craving and suffering above all else. They need a detailed philosophical framework that feels authentic and livable, not academic.  

  First, I need to unpack their core request: They want the "load-bearing" requirements any such theory must handle, marked by necessity vs. taste, plus friction points for narrative conflict. Key constraints:  
  - Must avoid "first-year seminar" vibes (so no Philosophy 101 survey).  
  - Needs "awkward joints" (e.g., time-related edge cases, craving vs. wanting distinctions).  
  - Prioritizes livability over academic tidiness.  
  - Explicitly flags unsatisfiable requirements or major exclusions for plot fuel.  

  The user’s deeper needs seem to be:  
  - **Authenticity**: The doctrine must feel workable for a small community, not just theoretically coherent.  
  - **Narrative tension**: They need clear "breaking points" (e.g., requirements that clash, creating conflict for Ch9).  
  - **Practicality**: No citations, minimal jargon, and a focus on dish-washing realism over abstraction.  

  I’ll structure this as a table of requirements (non-negotiable vs. taste), then a friction analysis. Non-negotiables should include:  
  - **Craving/wanting distinction**: Vital—if tranquilism can’t separate healthy drives (eating) from destructive cravings (obsession), it collapses.  
  - **Absence ≠ presence**: Must clarify that removing pain isn’t the same as adding joy (or the theory becomes incoherent).  
  - **Temporal granularity**: Does "tranquility" apply to moments or life-as-a-whole? Affects how members track progress.  
  - **Self-referential paradox**: If pursuing tranquility becomes a craving, the doctrine implodes—huge plot potential.  

  For friction:  
  - The amputation case (surgically removing desire) likely breaks the theory—it "solves" craving but violates non-instrumentalization.  
  - Dreamless sleep is a win for absence-of-suffering but feels hollow, straining the "meaningful life" requirement.  
  - The purpose clause (livability) clashes with purity tests—e.g., demanding perfect non-attachment might make communal chores impossible.  

  Biggest exclusion: **Non-instrumentalization of persons**. If tranquilism permits using people as craving-removal tools, it becomes monstrous. Antagonist fodder!  

  Verdict: Jointly satisfiable *if* the community accepts some "taste" compromises (e.g., tranquility as cumulative, not binary). But the craving/wanting distinction is the keystone—if that cracks, the whole thing falls apart.
answer: |-
  Here's the load-bearing framework for your tranquilist doctrine, stripped to its awkward joints. Requirements are categorized as **Non-Negotiable** (NN - theory collapses without this) or **Taste** (T - community can debate/adjust without implosion). Friction points for your protagonist follow.

  ### Core Requirements for Tranquilism
  | Requirement | Type | Case/Justification | Why Load-Bearing? |
  |-------------|------|---------------------|-------------------|
  | **1. Craving ≠ Wanting** | NN | Distinguishes needing food (wanting) from obsessive hunger (craving). Must explain why cooking dinner isn't craving-violation. | Without this, all action is pathological. Undermines basic survival. |
  | **2. Absence ≠ Presence** | NN | Not suffering ≠ feeling joy. Dreamless sleep scores; euphoria does not. Must reject "peace is positive". | Collapses if absence of bad is conflated with presence of good. Core axiom. |
  | **3. Temporal Granularity** | T | Is tranquility summed moment-by-moment (sleep counts) or life-as-whole (requires narrative coherence)? Affects rota design: Is fragmented tranquility valid? | Livability hinges here. Rigid moment-focus breeds roboticism; narrative-focus risks craving "a good life". |
  | **4. Non-Instrumentalization of Persons** | NN | Amputating cravings via surgery or coercion is forbidden. Tranquility must not come from using others as tools. | Prevents monstrous "solutions". Community cohesion depends on this. |
  | **5. No Reflexive Craving** | NN | Doctrine can't prescribe craving tranquility itself. Must frame it as discovery, not goal. E.g., "Notice when craving drops" not "Achieve zero craving". | Else self-defeating. The cook burning dinner to avoid "craving perfection" fails this. |
  | **6. Mattering ≠ Desiring** | NN | Tranquility matters even if undesired (e.g., angry newcomer). Must ground value outside subjective states. | Without this, doctrine is arbitrary preference. Undercuts "only this matters". |
  | **7. Suffering Includes Anticipation** | NN | Dread of future craving (e.g., "I'll crave cake tomorrow") counts as present suffering. Cleaning now to avoid panic later is valid. | Real-world psychology. Forbids this makes doctrine useless for humans. |
  | **8. Allow Scaffolding** | T | "Distractions" (gardening, dish-washing) permitted if they reliably reduce craving/suffering *without becoming ends*. Must not demand constant meta-awareness. | Livability: Humans need cognitive off-ramps. Rigid policing breeds suffering. |

  ### Where Tranquilism Creaks (Your Chapter 9 Fights)
  - **The Amputation Case (vs. NN4 & NN1):** A member seeks surgical craving-removal. Community splits: *Mechanists* (NN1: "Craving excised = absence achieved, efficient!") vs. *Purists* (NN4: "This instrumentalizes your body, violates personhood!"). **Friction:** NN1 (Craving≠Wanting) is weakened if craving can be deleted like a tumor. NN4 (Non-Instrumentalization) looks like dogma if surgery brings peace.  
  - **Dreamless Sleep vs. "A Good Life" (NN2 & T3):** If tranquility is summed moments (T3), a life of sedation scores perfectly. *But* this feels meaningless (violates unstated "life coherence" expectation). **Friction:** Admit life-structure matters (undermining NN2’s purity) or embrace the comatose ideal (alienating humans).  
  - **The Dish-Washing Test (NN7 & T8):** Protagonist finds dish-washing tranquil *unless* she asks why. Is her focus on bubbles a distraction (T8) or meta-craving for tranquility (NN5)? **Friction:** NN7 (Anticipation Suffering) says planning rota reduces future dread. But analyzing "why this works" risks NN5’s reflexive craving. Livability (T8) demands not poking the bear.  
  - **Purpose Clause vs. NN6:** "Mattering" feels empty without *something* (not craving) filling the void. Beauty/work intrude as *experiences*, not absences. **Friction:** Characters might smuggle in "positive" values (rhythm of chopping vegetables) as "scaffolding." Purists scream distraction; realists survive.  

  ### The Breaking Point
  **NN4 (Non-Instrumentalization)** does the most excluding. Attacking this lets your antagonist justify coercion ("For your own tranquility!"), making the community cult-like. Lose NN4, and tranquilism becomes compatible with atrocity.  

  **Verdict: Jointly satisfiable :: Non-Instrumentalization of Persons**  

  *(Satisfiable if community accepts T3/T8 flexibility and isolates NN4 fiercely. But NN4 is the keystone – dislodge it, and the arch falls.)*
