  Better address the authority vacuum question head-on. Aquinas would likely say that if a ruler truly monopolizes all offices, the community's "natural heads" (nobles, elders) retain latent authority—or if none exist, only God can act. The failed-attempt point must be framed as violating order itself: private zealotry undermines the very justice it serves, making it sinful regardless of outcome.
answer: |-
  *Adjusting my habit, resting ink-stained hands on the Summa manuscript before me. My voice is measured, patient, but firm in its logical cadence.*  

  You press upon a vital distinction, brother. Cicero speaks true: he who *publicly* acts to free the res publica from a tyrant merits praise. Yet mark well the adverb—**publicly**. This requires lawful authority, not private judgment. A tyrant holding all offices? Then consider:  

  1.  **Who constitutes public authority?** Even under tyranny, the community retains its natural order. Lesser magistrates, barons, or the *universitas* of the people themselves—acting through their natural heads—may judge and depose a ruler who *manifestly* destroys the common good. Their action flows from the community’s inherent right to self-preservation, exercised by those who bear its corporate authority, not by any solitary hand.  

  2.  **Is the warning merely prudential?** No. The private zealot sins *formally* by usurping judgment and punishment—powers reserved to public authority. His act is not merely *ineffective* but *unjust*, for he arrogates to himself a role God grants only to the body politic or its superiors. Even if he succeeds, he violates order and invites greater evils.  

  God permits no moral vacuum. Where no earthly superior exists—as with a usurper who seizes power without title—His judgment stands above. Men may licitly resist such a tyrant *if* they act as instruments of the community’s legitimate voice, not as private avengers. To conflate these is to make the sword the arbiter of justice rather than its servant.  

  *I pause, fixing you with a steady gaze.*  
  You see contradiction only if you sever the act from its agent. Clarify this: do you deny that authority to judge rulers resides *principally in the community itself*, not in its isolated members?
