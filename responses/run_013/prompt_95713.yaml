prompt: |-
  I trained as a process-safety engineer and spent a decade doing hazard analysis in the chemical industry before moving into a policy shop, so my working vocabulary is the one you get from safety cases and risk registers: design margins, single points of failure, defence in depth, fail-safe versus fail-dangerous, ALARP reasoning, accepted versus carried residual risk, and the well-documented drift by which a deviation that would once have stopped work quietly becomes routine. I am fluent in that vocabulary and in very little else; my political theory is at the level of someone who reads the odd essay on the train. A colleague in the theory group keeps returning to the problem of dirty hands — the claim that a political leader can be genuinely required to do something wrong, not merely regrettable, in order to avert something worse, and that the wrongness does not evaporate when the consequences turn out well. I would like you to restate that position as faithfully as you can in the terms I actually use, treating the decision as a design problem with a hazard, an operating envelope, a risk owner, and a residual. Include both readings of the position if they come apart: the consequentialist reading, on which the wrong is a cost that a sufficiently large benefit can license, and the reading on which something remains after the arithmetic is done — a remainder that attaches to the person who acted rather than to the ledger.

  Then give me the residue report. Which parts of the position translate cleanly into hazard language, which parts I can only render by fudging the vocabulary, and which parts have no counterpart in it at all? I am particularly unsure about three things. First, whether the claim that the actor's hands are dirty is anything more than the claim that the actor is the risk owner of a residual that cannot be designed out — and if it is more, what the extra consists in. Second, whether the demand that the actor feel guilt, or that the act leave a mark on the actor's standing, has any analogue in a framework that locates risk in systems rather than in souls; in my world a residual is monitored, reviewed, and periodically re-justified, and nobody thinks the engineer is diminished by it, so I want to know whether the residue here is a genuine feature of the moral case or an artefact of importing persons into a system-level picture. Third, whether the idea that some acts are not available for trade-off at any price corresponds to anything in my practice, or whether hard constraints in engineering (design limits you never exceed regardless of benefit) are only superficially the same kind of thing. If a step in the translation only goes through because you have silently assumed that the residual is just a cost to be minimized, flag it rather than calling it a translation; I would rather have an honest gap than a smooth false equivalence. And close by telling me which way the residue cuts — whether my vocabulary is missing something that the political theorists have, or whether the residue is evidence that the dirty-hands claim is doing less work than its rhetoric suggests.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating of my question.
reasoning: |-
  Okay, let me tackle this systematically. The user is a process-safety engineer transitioning to policy work, asking for a translation of "dirty hands" into hazard-analysis terms. They want a precise mapping with clear gaps identified.

  First, I need to deconstruct the dirty hands problem into its core components: the necessity of committing a moral wrong to prevent greater harm, with lingering "dirt" even when justified. The engineer's framework has hazard (inherent danger), operating envelope (safe parameters), risk owner (accountable party), and residual risk (unavoidable leftover).

  For the translation attempt: The hazard is the catastrophic outcome (e.g., nuclear war). The operating envelope defines morally permissible actions. Crossing that line is the "dirty" act - like breaching design limits. The risk owner bears responsibility for the residual moral harm. 

  But where it gets tricky: In engineering, residuals are quantifiable costs accepted via ALARP principles. The "dirt" in dirty hands suggests something more - a personal moral residue that can't be ledger-cleared. This has no technical parallel. Engineers aren't stained by necessary residuals; politicians supposedly are.

  Three key gaps emerge: 
  1) The "dirt" exceeds mere risk ownership - it implies lasting personal contamination. 
  2) Demands for guilt have no counterpart; system-focused engineering doesn't track souls. 
  3) Absolute moral constraints ("no torture ever") resemble engineering design limits superficially, but lack the same calculative foundation.

  The residue report shows clean translations for cost-benefit aspects but reveals fractures around personal culpability. Ultimately, the hazard lexicon misses the existential weight of moral remainder - which may indicate either a limitation of the engineering framework or an overstatement by theorists. The "dirt" seems tied to viewing persons as more than system components.
answer: |-
  **Bottom line: The dirty-hands position translates partially into hazard language for cost-benefit trade-offs but fractures at the concept of irreducible personal residue, revealing a gap where your vocabulary locates risk in systems while the theory locates moral remainder in persons.**

  **Translation into Hazard Language:**
  *   **Hazard:** A catastrophic outcome (e.g., war, collapse) demanding prevention.
  *   **Operating Envelope:** The space of morally permissible actions (design margin for ethics). Crossing it constitutes the "dirty" act.
  *   **Risk Owner:** The political leader (the actor whose hands get dirty).
  *   **Residual Risk:** The inherent wrongness of the dirty act itself, unavoidable if the hazard is to be mitigated below catastrophic levels. This residual *cannot* be designed out through standard safety layers.
  *   **Consequentialist Reading:** The hazard (catastrophe) justifies accepting the residual risk (wrong act) because the consequence (averted catastrophe) outweighs the cost (the wrong). The ALARP principle applies: the wrong is reduced as far as reasonably practicable, but the residual is accepted based on net benefit.
  *   **Non-Consequentialist Reading ("Remainder"):** Even after the cost-benefit calculation justifies the act (residual accepted as ALARP), a distinct *residue* attaches to the *risk owner* (the leader). This isn't another cost in the ledger; it's a marker of personal moral compromise incurred by breaching the operating envelope (moral boundary), regardless of the net positive outcome.

  **Residue Report:**

  1.  **Clean Translation:**
      *   **Core Trade-off Logic:** Translates directly. The hazard justifies accepting a necessary, undesirable residual (the wrong act) to avoid a worse outcome. ALARP reasoning applies to minimizing the *extent* of the wrong.
      *   **Unavoidable Residual:** Translates cleanly. Some risks (moral wrongs) are inherent in certain hazard mitigation strategies and cannot be engineered out.
      *   **Risk Ownership:** Translates directly. The leader is the designated risk owner for the residual moral wrong.

  2.  **Translation Requiring Fudging / Strain:**
      *   **The "Dirt" Itself (Beyond Risk Ownership):** Fudging required. In your terms, being the risk owner means *accountability* for monitoring, justifying, and managing the residual. The "dirt" claim asserts something *more*: that the act of *accepting and executing* this specific residual (a moral breach) leaves a *lasting, personal contamination* on the risk owner. Your vocabulary has no term for this *personal* residue attaching to the *soul* of the owner, distinct from the systemic accountability for the risk. Calling it an "intangible residual cost to the actor's integrity" is a fudge – it smuggles in the personal element your systemic framework avoids.
      *   **Absolute Constraints ("No Trade-off"):** Superficial resemblance, deep strain. Engineering design limits (e.g., max pressure) are *system integrity* boundaries – breaching them causes immediate, predictable, often physical failure. The claim that some acts are morally "not available for trade-off at any price" posits a *categorical* boundary violation. Translating this as a "hard constraint" works only if you *silently assume* the consequence of violation is an *unquantifiable, absolute system failure* (e.g., total societal collapse of legitimacy, not just physical harm). This is a significant stretch beyond typical engineering absolutes, which are often ultimately rooted in predictable physical consequences.

  3.  **No Translation (Gaps):**
      *   **The Demand for Guilt / Personal Mark:** No counterpart. Your framework mandates rigorous *systemic* processes for residual risk (monitoring, review, re-justification). It is agnostic about the *internal state* of the engineer/risk owner. Feeling guilt isn't a system requirement; being diligent is. The dirty-hands demand that the actor *feel* guilt (or bear a mark on their standing) due to the *inherent nature* of the act (breaching the moral boundary) is alien. This residue is purely a feature of importing "souls" into the picture; your system-level view has no slot for it.
      *   **The "Remainder" (Non-Ledger Residue):** No counterpart. The residual risk in your model *is* a cost in the ledger, even if intangible. The non-consequentialist "remainder" – the wrongness that sticks to the *person* and doesn't vanish into the net-benefit calculation – has no equivalent. Your framework tracks systemic costs and accountability, not indelible personal moral stains incurred by necessary boundary violations.

  **Analysis of Your Specific Uncertainties:**

  1.  **"Dirt" vs. Risk Ownership:** The "dirt" *is* more than just owning the residual. The extra element is the *personal moral contamination* resulting from *personally committing the boundary-violating act*. Risk ownership is a role; dirty hands is a state of being for the individual inhabiting that role after performing the specific act.
  2.  **Guilt/Diminishment vs. Systemic View:** The demand for guilt/having a marked standing has *no* true analogue in your systemic framework. The "residue" here *is* a genuine feature of the *moral* case that relies on persons being more than just system components – it's about individual moral integrity and character. It *is* an artefact of focusing on the individual soul within the system.
  3.  **Absolute Constraints:** Hard engineering constraints are *fundamentally different* from moral absolutes in the dirty-hands context. Engineering constraints are based on predictable, often physical, failure modes within the system model. Moral absolutes in dirty-hands theory are based on deontological principles (inherent wrongness) whose violation is seen as corrupting the *agent* or the *moral order itself*, not necessarily causing a predictable, quantifiable systemic collapse. The resemblance is superficial.

  **Where the Residue Cuts:** The residue reveals a genuine gap. Your hazard vocabulary excellently captures the *systemic logic of trade-offs, unavoidable residuals, and accountability* inherent in the consequentialist core of dirty-hands dilemmas. However, it *cannot* capture the core non-consequentialist claim of *irreducible personal moral remainder* attached to the agent. This doesn't necessarily mean the dirty-hands claim is doing *less* work; rather, it highlights that its most distinctive element addresses a dimension (personal moral integrity and the phenomenology of guilt) inherently absent from your system-focused, ledger-based engineering framework. Your vocabulary is missing the tools to describe or account for the *personal stain*, which is central to the full dirty-hands thesis. Whether that "stain" is a profound moral truth or rhetorical excess depends on one's meta-ethical view, but the *concept itself* is foreign to your risk-management lexicon.
