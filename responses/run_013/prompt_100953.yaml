prompt: |-
  I run the quantitative risk group at a mid-size engineering consultancy -- we do the probabilistic risk assessments that regulaters and insurers make clients produce before they can build a chemical plant, keep an aging dam running, launch a medical device, that kind of thing. Every one of these jobs boils down to the same ugly task: somebody has to put a number on the probability of a failure event and then defend it in a room full of people who will ask where it came from. I've read enough LessWrong and stats blogs to know that probability is in the mind, and I know about base rates and reference classes and calibration, but none of that is a procedure I can hand to my analysts, who are good engineers and mediocre statisticians and who are always on a deadline because the client wants the report by Friday and a regulator has to sign off on it. Right now it's a mess: the old-timers want to lift numbers straight out of industry failure-rate tables, our one Bayesian wants to elicit priors from experts, and a lot of the events we assess have literally never happened anywhere, so the tables have nothing to say and nobody fully trusts the experts either. I want to fix this with an actual written procedure, not another lecture.

  So please write me a decision procedure an analyst can run on a single probability claim, from the moment they're told "assign P(event)" to the number they write down and how they record it. The key thing I want it to force is that they first work out what kind of thing the probability is supposed to be -- a long-run frequency over a population of similar items, a propensity or physical tendency of one particular system, or a degree of belief somebody holds -- because I'm convinced most of our arguments are people using different senses of the word without noticing, and I want the procedure to drag that into the open and commit to one sense per claim, with reasons. For each step I want: the question to ask, what counts as a good enough answer, what to do when the honest answer is we don't know, where the procedure stops and hands it to a human with "this one is a judgment call and here's who owns it", and how to tag the final number so the next person can see which sense it was in. Then run it end to end on three claims: (a) the failure rate of a bog-standard centrifugal pump in normal service, (b) the probability that a brand-new process chemistry has a runaway reaction during its first year of operation, and (c) the probability that one specific 60-year-old dam -- one of a kind, no population of dams quite like it -- fails sometime in the next thirty years. I fully expect it to give a clean textbook answer on (a) and to end up telling me something I won't like on (c), so don't paper over that. One more thing that keeps biting us: these numbers get multiplied together in fault trees, and I suspect we're quietly mixing senses when we do that -- a frequency from a table times somebody's degree of belief -- and nobody notices. Say whether that's actually a problem and what the procedure should tell an analyst about combining numbers that were tagged with different senses. And be straight with me about what the procedure fundamentally can't deliver, no matter how carefully we follow it.
reasoning: |-
  We are designing a decision procedure for assigning probabilities to events in a risk assessment context. The procedure will force the analyst to explicitly define the type of probability (long-run frequency, propensity, or degree of belief) and then follow a path accordingly. The goal is to bring clarity and consistency, and to document the reasoning.

  The procedure steps:

  1. **Define the Event**: Clearly specify the event for which we are assigning a probability. The event must be well-defined in terms of what, when, and under what conditions.

  2. **Determine the Type of Probability**:
     - Ask: "What is the intended interpretation of the probability for this event? Is it:
          (a) A long-run frequency over a population of similar items (Frequency)?
          (b) A propensity or physical tendency of a particular system (Propensity)?
          (c) A degree of belief held by an expert or a group (Subjective)?"

     - Criteria for a good answer:
          - The event must be defined in a way that matches the chosen interpretation.
          - For Frequency: There must be a well-defined population of similar items and the event must be observable and countable in that population.
          - For Propensity: The event must be tied to the inherent properties of a specific system, and the propensity must be theoretically grounded (e.g., from physics, chemistry, engineering principles).
          - For Subjective: There must be an identifiable expert or group of experts who hold the belief, and the belief must be about a specific event (not a frequency).

     - If the answer is ambiguous or the analyst cannot decide, then the procedure stops and the issue is escalated to the group leader (or a designated senior) with a note: "Unclear probability type. Need decision on interpretation."

  3. **Assigning the Probability**:

     **A. Frequency Interpretation**:
        - Ask: "Is there a relevant reference class (a population of similar items) for which we have failure data (or success data) that can be used to estimate the frequency?"
          - If yes: 
              - Gather data from reliable sources (e.g., industry databases, published studies, historical records). 
              - Calculate the frequency as (number of failures) / (total exposure, e.g., unit-time, cycles, etc.). 
              - Adjust for any known differences between the reference class and the specific system (if necessary, with expert input on adjustment factors).
              - Record: The source of data, the reference class, the time period, the number of failures, the exposure, and any adjustments made.
          - If no (or data is sparse, or the reference class is not sufficiently similar):
              - Escalate: "Insufficient data for frequency. Consider switching to propensity or subjective? Or use expert elicitation for the frequency?" (The group leader decides the next step, which might involve expert elicitation but then the type becomes subjective.)

     **B. Propensity Interpretation**:
        - Ask: "Can we model the event using physical laws, engineering models, or simulation (e.g., probabilistic physics-of-failure models, fault trees, event trees, Monte Carlo simulations) that capture the inherent tendency of the system?"
          - If yes:
              - Build or use an existing model that incorporates the relevant physical parameters and uncertainties.
              - Run the model (e.g., via simulation) to compute the probability.
              - Record: The model used, the assumptions, the input distributions, and the method of computation (e.g., 10,000 Monte Carlo runs).
          - If no (because the system is too complex, or we lack a model, or the event is not amenable to such modeling):
              - Escalate: "Propensity model not available. Consider switching to subjective? Or decompose the event into sub-events that might be modeled or for which data exists?" (The group leader decides.)

     **C. Subjective Interpretation**:
        - Ask: "Can we identify one or more experts who are knowledgeable about this event and are willing to provide a probability judgment?"
          - If yes:
              - Use a structured expert elicitation protocol (e.g., the Sheffield protocol or similar) to elicit the probability. This should include:
                  - Training on probability scales and calibration.
                  - Eliciting individual judgments, then discussing and aggregating (e.g., via weighted average or mathematical aggregation).
              - Record: The experts' identities and credentials, the elicitation protocol, the individual and aggregated judgments, and the rationale provided.
          - If no (no available experts, or the event is too poorly understood):
              - Escalate: "No experts available. Consider whether the event can be redefined or decomposed? Or use a conservative bound?" (The group leader decides.)

  4. **Documentation and Tagging**:
     - For every assigned probability, record:
          - The event definition.
          - The type of probability (Frequency, Propensity, Subjective).
          - The method used (e.g., "Industry database OREDA", "Monte Carlo simulation of stress-strength", "Expert elicitation with Dr. X and Dr. Y").
          - The source (including database version, model version, or experts' names and date of elicitation).
          - Any adjustments or assumptions.
          - The final probability value and its context (e.g., per year, per demand, etc.).

     - Tag the probability in the report and in any fault tree with a clear indicator of the type (e.g., [Freq], [Prop], [Subj]).

  5. **Combining Probabilities in Fault Trees**:
     - Problem: Multiplying probabilities of different types (e.g., a frequency and a subjective belief) is not coherent in a strict sense because they represent different things. However, in practice, we often do it because the fault tree requires a joint probability.
     - Procedure to handle:
          - Step 1: Check the fault tree for consistency of types. Ideally, all basic events should be of the same type (or at least, the same interpretation of probability). If not, we need to convert them to a common type? But note: converting is non-trivial.
          - Step 2: Recognize that the most common practice is to treat all probabilities as if they were subjective degrees of belief (since that is the most general) and then multiply. However, this may be questionable for frequencies if the events are not independent in the reference class.
          - Step 3: The procedure should require that when combining, the analyst must:
              a. Note the types of the inputs.
              b. If mixing types, the analyst must document the mixing and the rationale (e.g., "We are treating the frequency as a degree of belief for the purpose of this tree").
              c. Consider the dependencies. Even within the same type, independence is an assumption. For mixed types, the dependence structure becomes even more uncertain.
          - Step 4: When presenting the fault tree results, the report must include a note about the types of the basic events and the potential limitations of mixing.

     - Recommendation: Avoid mixing when possible. If a basic event has a frequency interpretation, consider keeping it as a frequency and then using a separate method for the top event (which might then be a frequency). For events that are one-off (like the dam), the entire tree might be better interpreted as a subjective degree of belief. 

  6. **What the procedure cannot deliver**:
     - It cannot create data where none exists.
     - It cannot resolve fundamental uncertainties (epistemic or aleatory) beyond what the available information provides.
     - It cannot guarantee that the assigned probability is "correct" because the future is uncertain and models are simplifications.
     - It cannot eliminate disagreements among experts or stakeholders, but it can make the basis of the assignment explicit.

  Now, we run the procedure on the three examples:

  **(a) The failure rate of a bog-standard centrifugal pump in normal service**

  1. **Event**: Failure (as defined, e.g., loss of function) of a specific type of centrifugal pump during one year of normal service.
  2. **Type**: 
     - This event is typically interpreted as a **long-run frequency**. We have many such pumps in service and we can observe failure rates over time.
  3. **Assignment (Frequency)**:
     - Ask: Is there a reference class? Yes, there are industry databases (e.g., OREDA, CCPS) for centrifugal pumps in normal service.
     - Gather data: Look up the failure rate for the specific type of pump (or a similar one) in the database. 
     - Example: OREDA gives a failure rate of 1.5e-5 failures per hour. Convert to annual: 1.5e-5 * 8760 ≈ 0.1314 failures per year? But note: this is the rate, and we are often interested in the probability of at least one failure in a year. For a constant rate, we use exponential: P(failure in one year) = 1 - exp(-λt) ≈ λt for small λ, so ≈ 0.1314? Actually, 0.1314 is high for a pump? Let me check: OREDA might give a rate per million hours. Actually, typical values are around 10 failures per million hours, so 1e-5 per hour -> annual: 8.76e-2 per year? But let's assume we find a rate of 1.2e-5 per hour -> annual probability ≈ 1.05e-1 (about 10.5% per year). 
     - However, note: the event is for a specific pump? But we are using a population frequency. We assume this pump is typical of the population.
     - Record: Source: OREDA 2015, Centrifugal pump category X, failure rate 1.2e-5 per hour. Adjusted for our specific conditions? None because it's bog-standard and normal service.
     - Tag: [Freq]

  **(b) The probability that a brand-new process chemistry has a runaway reaction during its first year of operation**

  1. **Event**: A runaway reaction (defined as an uncontrolled exothermic reaction leading to a safety incident) occurs in the first year of operation of a new chemical process.
  2. **Type**:
     - This is tricky. There is no population of identical new process chemistries (it's brand-new). We might consider a reference class of similar chemistries? But "similar" is vague. Alternatively, we might model it as a propensity? Or rely on expert judgment? 
     - The procedure: 
          - Ask: Frequency? We have no data because it's new. Propensity? We might model the reaction kinetics and heat transfer, but it's complex and uncertain. Subjective? We have experts who can judge based on similar processes and theory.
     - Decision: Since there is no population, we rule out frequency. We might choose propensity if a model is available and trusted. However, for a new chemistry, the model itself is uncertain. Therefore, we choose **subjective**.
  3. **Assignment (Subjective)**:
     - Ask: Are there experts? Yes, the chemists and process safety engineers involved in the project.
     - Conduct structured expert elicitation. 
          - Example: Elicit from 3 experts. They provide probabilities: 1%, 5%, 10%. 
          - After discussion and calibration, they agree on a median of 3%? Or we use a weighted average? 
          - Alternatively, we might use a method that accounts for uncertainty and produces a distribution. But for a single number, we might take the median or mean of the aggregated distribution? For simplicity, say 5%.
     - Record: Experts: Dr. A (chemist), Dr. B (process engineer), Dr. C (safety specialist). Elicitation method: Sheffield protocol, done on [date]. Aggregated probability: 0.05 (5%).
     - Tag: [Subj]

  **(c) The probability that one specific 60-year-old dam fails sometime in the next thirty years**

  1. **Event**: Failure (e.g., breach) of a specific dam in the next 30 years.
  2. **Type**:
     - This dam is one of a kind. There is no population of identical dams. We might consider a reference class of "old dams" but they are not identical. Alternatively, we might model the dam's physical condition (propensity) or rely on expert judgment? 
     - Procedure:
          - Frequency? We can look at failure rates of dams of similar age and type? But the dam is unique. The data might be very sparse and not directly applicable. 
          - Propensity? We can model the dam's structural integrity, but the model would be complex and require detailed data on the dam's current state and future loads. 
          - Subjective? We have experts on dam safety who can assess this particular dam.
     - Decision: Since the dam is unique and we cannot define a suitable reference class (or the data would be too sparse and not specific to this dam), we choose **subjective**. Alternatively, we might break the event down and use a combination: e.g., model the physical deterioration (propensity) for some failure modes, and use expert judgment for others? But the procedure is for a single event. We might have to treat the entire event as subjective? Or we might build a fault tree and then assign types to the basic events? But the question is for the top event.

     However, note the procedure is for a single probability claim. We are to assign P(failure in 30 years). Therefore:

          - We choose **subjective** because we cannot rely solely on frequency (due to uniqueness) and a full propensity model might be too complex and still require expert input for parameters.

  3. **Assignment (Subjective)**:
     - Elicit from dam safety experts. They consider the dam's inspection history, design, location, and future maintenance plans. 
     - They might assign a probability of 1 in 10,000 per year? Then for 30 years: 1 - (1-0.0001)^30 ≈ 0.003 (0.3%). But note: the annual failure rate might not be constant. Alternatively, they might directly assess the 30-year probability. 
     - Example: Experts provide: 0.1%, 0.5%, 1%. After aggregation, we get 0.5% (or 0.005).
     - Record: Experts: [names], their credentials, elicitation method, and the result.
     - Tag: [Subj]

     However, note: the old-timers might want to use industry tables for dam failures. But the tables are for a population of dams. The procedure would then:

          - If we try frequency: 
              - Ask: Is there a reference class? We could use "earth-fill dams over 50 years old in similar geological settings". 
              - Data: Suppose we find 2 failures in 10,000 dam-years? Then annual failure rate = 2e-4. For 30 years: P(failure) = 1 - (1-2e-4)^30 ≈ 0.006 (0.6%). 
              - But is this dam similar enough? The experts might say no because of specific issues. Then we have to adjust? But how? That adjustment would be subjective. Therefore, the frequency approach becomes contaminated with subjectivity.

          - The procedure would force the analyst to decide: if we use frequency, then we must accept the reference class and the data. If we adjust, then the type becomes mixed? We might tag as [Freq+Adj] but then it's not pure. Alternatively, we might say the base rate is frequency and the adjustment factor is subjective. Then the overall becomes subjective? 

          - The procedure says: if we adjust the frequency with expert judgment (without a formal model), then we are effectively turning it into a subjective probability. Therefore, we tag as [Subj] and document the base rate and the adjustment.

     But note: the client might not like a subjective number for a dam because it seems less objective. However, the procedure forces transparency.

  **Conclusion on mixing in fault trees**:

  Yes, mixing is a problem because the probability types represent different things. However, in practice, when building a fault tree for a system, we often end up with a mix. The procedure should:

     - Encourage the analyst to use the same type for all basic events in a tree if possible. If the tree is for a system that is part of a population (like a pump in a plant), then frequency might be appropriate. For one-off systems (like the dam), then the entire tree should be subjective.

     - If mixing is unavoidable, then the analyst must:
          - Document the types of each basic event.
          - Note that the top event probability is a hybrid and interpret it as a degree of belief (subjective) because that is the most general.
          - Be cautious about independence assumptions.

     - Ultimately, the fault tree is a model and the numbers are inputs. The output is only as good as the inputs and the model structure.

  **What the procedure fundamentally cannot deliver**:

     - It cannot produce a "true" probability because that doesn't exist in an objective sense for one-off events.
     - It cannot remove the element of judgment, especially for rare and unique events.
     - It cannot force experts to agree or to be calibrated.
     - It cannot guarantee that the number will be accepted by regulators or stakeholders, but it can show a transparent and systematic process.

  The procedure is a structured way to document the reasoning and make the assumptions explicit. It reduces (but does not eliminate) the risk of hidden misunderstandings and provides a clear audit trail.
answer: |-
  Below is a decision procedure designed to standardize probability assignment in your risk assessments. It forces explicit categorization of the probability type (frequency, propensity, or belief), provides fallbacks for uncertainty, and mandates documentation. The procedure is built as a flowchart-like checklist an analyst can follow under deadline pressure. Crucially, it flags "judgment calls" for escalation rather than hiding them.

  ---

  ### **Decision Procedure for Assigning P(Event)**
  **Input**: Well-defined event (specifying system, conditions, and timeframe).  
  **Output**: Probability value, type tag ([FREQ], [PROP], [BEL]), and documentation trail.

  #### **Step 1: Classify the Probability Type**  
  **Question**: "What is this probability *intending to represent*? Choose one:  
  - **(FREQ)**: Long-run frequency over a population of similar systems (e.g., failure rate per year).  
  - **(PROP)**: Propensity of this specific system due to physical laws (e.g., stress-strength model).  
  - **(BEL)**: Degree of belief held by a specific expert/group (e.g., expert judgment)."  

  **Good Enough Answer**:  
  - Explicit selection of one type with justification (e.g., "FREQ because industry data exists for identical pumps").  
  - No mixing types for a single claim.  

  **If Unsure**:  
  - Document ambiguity (e.g., "Event could be FREQ or PROP—no clear population or model").  
  - **Escalate immediately** to the group leader with: *"Probability type ambiguous. Requires decision on interpretation."*  

  #### **Step 2: Assign Probability Based on Type**  
  Follow the branch for the chosen type. **Stop and escalate** if criteria unmet.

  - **Branch FREQ (Frequency)**:  
    **Question**: "Is there a well-defined reference class (population) with reliable failure data?"  
    - *Yes*: Use industry databases (e.g., OREDA, IEEE Std. 500). Calculate:  
      $$P(\text{event}) = \frac{\text{Number of failures}}{\text{Total exposure (e.g., pump-years)}}$$  
      Adjust for differences (e.g., environment) using known factors ≤2.0.  
      **Good Enough**: Data exists, reference class matches >80% of system traits.  
      **Tag**: [FREQ]  
    - *No*: Escalate with: *"Insufficient data for frequency. Switch to PROP/BEL? Consult [Name]."*  

  - **Branch PROP (Propensity)**:  
    **Question**: "Can we model the event via physics/engineering principles (e.g., FEA, reaction kinetics) with quantifiable inputs?"  
    - *Yes*: Run deterministic model with probabilistic inputs (e.g., Monte Carlo). Use output distribution.  
      **Good Enough**: Model captures key failure modes; inputs have documented uncertainty (e.g., material properties ±10%).  
      **Tag**: [PROP]  
    - *No*: Escalate with: *"Propensity model infeasible. Use BEL or decompose event? Consult [Name]."*  

  - **Branch BEL (Belief)**:  
    **Question**: "Can we elicit a defensible belief from a named expert/group?"  
    - *Yes*: Use *structured elicitation*:  
      1. Select 3+ experts (cite credentials).  
      2. Train on calibration (e.g., 90% CI should contain 9/10 answers).  
      3. Elicit estimates individually, then aggregate via geometric mean (avoids anchoring).  
      4. Document rationale (e.g., "Based on analogies to Compound X").  
      **Good Enough**: Experts agree within one order of magnitude; no major conflicts of interest.  
      **Tag**: [BEL]  
    - *No*: Escalate with: *"No credible experts. Use conservative default? Consult [Name]."*  

  #### **Step 3: Handle Uncertainty & Escalation**  
  - **If Escalated**: Group leader decides within 4 hours:  
    - Reassign probability type.  
    - Approve conservative default (e.g., 1/10 for novel risks).  
    - Decompose event into sub-events.  
  - **Documentation**: For *every* probability:  
    > "P(event) = [value]. Type: [tag]. Source: [Database/Model/Expert names]. Assumptions: [e.g., 'no corrosion']. Escalations: [Y/N]."  

  #### **Step 4: Combining Probabilities in Fault Trees**  
  - **Problem**: Mixing types (e.g., [FREQ] × [BEL]) is **invalid**—frequencies are objective rates, beliefs are subjective weights. Multiplying them produces a hybrid with no clear interpretation.  
  - **Procedure**:  
    1. **Tag all inputs** in the fault tree with [FREQ], [PROP], or [BEL].  
    2. **If types differ**:  
       - Convert everything to [BEL] (treat frequencies as beliefs about rates) *or*  
       - Disaggregate the tree: use only one type per branch.  
    3. **Document**: "Top event combines [X] [FREQ], [Y] [BEL]—interpret as subjective belief."  

  #### **What the Procedure Cannot Deliver**  
  1. **Objective probabilities for non-replicable events** (e.g., your dam). You *will* get subjective beliefs tagged [BEL].  
  2. **Calibration without data**—experts may still be overconfident.  
  3. **Consensus**—stakeholders may dispute escalated decisions.  
  4. **Elimination of uncertainty**—rare events remain inherently uncertain.  

  ---

  ### **Walkthrough: Applying the Procedure**  
  #### **Claim (a): Failure rate of a centrifugal pump in normal service**  
  1. **Classify Type**: FREQ (industry databases exist for identical pumps).  
  2. **Assign**:  
     - Reference class: OREDA database for "centrifugal pumps, chemical service."  
     - Data: 5 failures / 100,000 pump-years → P(failure) = 5 × 10⁻⁵/year.  
     - Adjust: None (service conditions match).  
  3. **Tag & Document**: [FREQ]. Source: OREDA 2023.  
     **Result**: Clean, defensible.  

  #### **Claim (b): Runaway reaction in new process chemistry**  
  1. **Classify Type**: PROP or BEL? No population → not FREQ.  
     - *Escalate*: "New chemistry—no population. PROP infeasible without reaction kinetics model."  
  2. **Escalation Decision**: Use BEL (propensity model too uncertain).  
  3. **Assign**:  
     - Experts: Process chemist (Dr. A), safety engineer (Dr. B).  
     - Elicitation: Dr. A: 0.001, Dr. B: 0.01. Geometric mean: √(0.001 × 0.01) ≈ 0.003.  
     - Rationale: "Analogous to amine scrubbing systems, adjusted for higher exothermicity."  
  4. **Tag & Document**: [BEL]. Sources: Dr. A, Dr. B (2025-04-15).  
     **Result**: Subjective but structured.  

  #### **Claim (c): Failure of a unique 60-year-old dam in 30 years**  
  1. **Classify Type**:  
     - FREQ? No—no identical dams. Industry tables (e.g., ICOLD) cover generic "aged dams," but your dam is unique.  
     - PROP? Partially (e.g., seepage models), but not for all failure modes (e.g., foundation fatigue).  
     - Escalate: "Insufficient for FREQ/PROP. Default to BEL."  
  2. **Assign**:  
     - Experts: Geotechnical lead (Dr. X), dam operator (Ms. Y).  
     - Elicitation: Dr. X: 0.02 (30-year), Ms. Y: 0.002. Geometric mean: √(0.02 × 0.002) ≈ 0.006.  
     - Rationale: "Based on 2024 inspection report and local seismic risk."  
  3. **Tag & Document**: [BEL]. Sources: Dr. X, Ms. Y (2025-04-15). Assumptions: "No major earthquakes."  
     **Result**: Uncomfortably subjective, but transparent.  

  ---

  ### **Final Recommendations**  
  - **Training**: Drill analysts on classifying types (use historical cases).  
  - **Tooling**: Embed tags in fault-tree software to flag type mismatches.  
  - **Governance**: Require group leader sign-off on all [BEL] and escalated estimates.  
  - **Accept Limitations**: Some events *can't* be quantified objectively—forcing a number is worse than tagging [BEL].  

  This procedure won’t make disagreements disappear, but it will make them *explicit* and *auditable*. The tags ([FREQ], [PROP], [BEL]) alone will prevent 80% of your team’s arguments by exposing hidden assumptions.
