  The user mentioned a variant of counterfactual mugging where Omega pays $10,000 to a stranger if the agent pays $100 on tails. When tails happens, the money goes to someone else. Does this clarify or distort the structure? The original problem has the agent receiving the money on heads if they commit to paying on tails. In the variant, the agent never benefits directly. This might help isolate the altruistic aspect but could confuse the incentive structure. The key is that the agent's decision affects the prediction, which affects someone else's payoff. The variant might prevent the "it's just a bet" misunderstanding because the agent doesn't personally gain. So it could be useful, but I need to ensure the prediction mechanism is clear.

  Next, the user wants to know which of the two scenarios (counterfactual mugging or XOR blackmail) should be the spine of the session. XOR blackmail is usually filed under blackmail, but the user wants to show why that's the wrong categorization. XOR blackmail involves Omega using information to create a situation where paying leads to a worse outcome. However, counterfactual mugging more directly challenges CDT and EDT because it forces a decision that only affects others based on a prediction. Using counterfactual mugging as the spine makes sense because it isolates the tension between decision theories without the extortion element. XOR blackmail can then illustrate a similar structure but in a negative frame, reinforcing the lesson.

  The misconception map is crucial. Common misunderstandings include:
  1. Causal/evidential confusion: Thinking that paying causes the good outcome, whereas it's correlated via prediction.
  2. Backwards causation: Believing that paying affects the past prediction.
  3. "Just a bet": Viewing the payment as a gamble on the coin flip.
  4. Identity issue: Debating whether the counterfactual self is the same person.

  For each, I need to sequence the session to surface and defuse them. Start with a simple prediction scenario to establish Omega's reliability without causality. Then introduce the altruistic variant to prevent the "bet" misunderstanding. When discussing the decision, explicitly state that paying doesn't affect the coin or the prediction. Use XOR blackmail later to show how refusal leads to exploitation, reinforcing that it's about decision theory, not blackmail.

  The user's deeper needs: They want the group to grasp the underlying decision theory conflict without getting sidetracked by dismissive reactions. The session must build concepts step-by-step, preempting misconceptions without overwhelming. The variant might help by removing personal gain, making the altruistic decision the focus. Ending with a question that tests understanding, like whether paying in the mugging is rational under CDT or EDT, rather than just choosing a side.

