answer: |-
  Here’s a structured session plan designed to build understanding incrementally, preempt common misconceptions, and isolate the core decision-theoretic conflict. The "spine" is **Counterfactual Mugging (CM)**, with **XOR Blackmail (XOR)** serving as a reinforcing contrast to expose why framing it as "blackmail" misses the point.

  ---

  ### **Session Spine & Sequence**
  1. **Prerequisite Foundation (30 mins)**  
     **Goal:** Establish Omega’s capabilities *without* triggering "Pascal’s mugging" objections or causality confusion.  
     **Activity:** Use a **prediction game** (not Newcomb’s):  
     > *"Omega (a perfect predictor) examines your brain before a coin flip. If it predicts you’ll bet $1 that the coin lands heads, it makes the coin land tails; if it predicts you won’t bet, it flips fairly. You know this. Do you bet?"*  

     **Why this instead of Newcomb’s?**  
     - Newcomb’s *is* the conceptual prerequisite (it introduces predictor-based incentives), but your group is fatigued by it. This variant isolates the same dynamic (evidential vs. causal reasoning) without boxes or $1M stakes, reducing baggage.  
     - **Key takeaway:** Omega’s prediction *correlates* with your action but doesn’t *cause* the outcome. Defuses "backwards causation" early by showing the flip is determined *before* your choice.  

  2. **Introduce CM Variant (Your Version) (20 mins)**  
     Present your refined CM:  
     > *"Omega flips a coin. If heads, it pays $10,000 to a stranger in another city—but only if it predicted you’d pay Omega $100 if tails. If tails, Omega asks you for $100 (which goes to a different stranger). The coin is tails. Do you pay?"*  

     **Does this isolate or distort?**  
     - **Isolates beautifully:** By decoupling payment from personal gain (you never receive money), it forces focus on *acausal influence* (your decision affects the stranger’s payoff via prediction). Removes "it’s a bet" objections since you gain nothing either way.  
     - **Critical phrasing:** *"Omega’s prediction of your choice determines whether the stranger gets $10k."*  

  3. **XOR Blackmail as Contrast (20 mins)**  
     Briefly present XOR:  
     > *"Omega knows a secret binary digit. If you pay Omega $1, they tell you the digit. But if the digit is 1, they also take $10,000 from you unless you pay *another* $10,000 to a charity they hate."*  

     **Role:** Show how XOR’s "blackmail" framing obscures the key lesson. Ask: *"Is paying the $1 ever rational? Why is this structurally similar to CM?"*  
     - **Why XOR isn’t about blackmail:** Both scenarios turn on *precommitment* (your policy affects Omega’s prediction). XOR’s extortion is a red herring—the core is still acausal leverage.  

  ---

  ### **Misconception Map: Surfacing & Defusing**
  | **Misconception**                | **When It Surfaces**           | **Defusal Strategy**                                                                 |
  |----------------------------------|--------------------------------|--------------------------------------------------------------------------------------|
  | **Backwards causation**          | During the prediction game (Step 1) | *"Clarify: Omega’s prediction *precedes* your choice. Your action doesn’t change the past; it correlates with what Omega foresaw."* |
  | **"Just a bet on the coin"**     | Early CM discussion (Step 2)   | *"In this variant, you never win money. How can it be a bet? The $10k outcome is fixed before you choose."* |
  | **Causal/Evidential confusion**  | CM decision debate (Step 2)    | *"Does paying $100 *cause* the stranger to get $10k? Or did Omega’s prediction lock that in earlier?"* (Hint: Evidential reasoning cares about correlation; causal ignores it.) |
  | **Identity confusion**           | If CM feels "unfair"           | *"Your counterfactual self isn’t ‘you’—it’s about how your *decision rule* affects outcomes in worlds you’ll never see."* |
  | **"Omega can’t exist" dismissal**| Anytime                       | *"Assume Omega as a thought experiment. Focus on: If a predictor were possible, what would rational choices imply?"* |

  ---

  ### **Closing Question to Test Understanding**
  **Pose:** *"In CM, does paying the $100 maximize expected utility if you’re an evidential decision theorist? What about a causal decision theorist? Why would EDT pay while CDT wouldn’t?"*  

  **Why this works:**  
  - Forces engagement with the *mechanism* (acausal influence), not just sides.  
  - Reveals if they grasp CDT’s flaw: It ignores correlation between acts and past predictions.  
  - If they answer correctly, they see CM isn’t about "fairness" but decision-theoretic coherence.  

  ---

  ### **What to Explicitly Refuse to Explain**  
  1. **Logical/Functional Decision Theory (LDT/FDT):**  
     - *Reason:* Too abstract for this session. Say: *"Today is about exposing the problem, not solving it. We’ll explore FDT’s ‘agent as function’ later."*  
  2. **Metaphysical debates about predictors:**  
     - *Reason:* Distracts from decision theory. Shut down with: *"Whether Omega is possible matters less than what this reveals about rational choice under uncertainty."*  
  3. **Real-world blackmail parallels in XOR:**  
     - *Reason:* XOR’s surface story is a trap. Redirect: *"Focus on the information structure—how does Omega’s knowledge constrain your options?"*  

  ---

  ### **Why CM is the Spine, XOR the Tool**
  - **CM isolates the acausal dilemma:** No personal stakes, no coercion—pure conflict between EDT (pay to "ratify" the prediction) and CDT (don’t pay since it doesn’t cause benefit).  
  - **XOR’s job:** After establishing CM, XOR shows how the same acausal dynamic feels like "blackmail" when framed negatively. This reveals why filing it under "blackmail" is wrong—it’s really about **precommitment under perfect prediction**.  

  This sequence builds from simple prediction games to CM’s altruistic variant, inoculating against misconceptions before they root. By ending with XOR, you force the group to transfer insights beyond surface narratives.
