answer: |-
  Here is the specification of desiderata for any adequate theory of the indicative/counterfactual distinction, structured around your fixed points. Requirements are numbered, grounded in specific cases/data, marked for negotiability, and assessed for joint satisfiability. Theory-family assessment follows.

  ### Core Requirements (Derived from Fixed Points)

  1.  **Core Contrast Exploitation:** The theory must systematically distinguish between conditionals presented as having an *open* antecedent (indicative) and those presented as having a *settled-false* antecedent (counterfactual), even when A and C are identical. It must explain the perceived difference in meaning and the varying judgments of inconsistency/compatibility (e.g., "If Oswald didn't shoot Kennedy, someone else did" [indicative] vs. "If Oswald hadn't shot Kennedy, someone else would have" [counterfactual] are often judged inconsistent, while pairs involving future events may be compatible). *(Non-negotiable)*
      *   *Case:* Competent speaker judgments on minimal pairs differing only in mood/settledness marking.

  2.  **Commitment on Contrast Nature:** The theory must explicitly state where the indicative/counterfactual distinction resides: in truth conditions, presupposition/conventional implicature, or assertion norms. It must explain how this locus accounts for the judgments in (1). *(Non-negotiable)*

  3.  **Karst Semantics/Pragmatics:** The theory must state whether the distinction marked by the Karst clitic (settled vs. unsettled antecedent *as of utterance time*) constitutes a *semantic* difference in the conditional itself (e.g., different truth conditions or definedness conditions) or reduces entirely to a *pragmatic* effect of the clitic plus discourse context on interpreting the same underlying conditional meaning. *(Non-negotiable)*

  4.  **Karst Bare Conditional Translation:** The theory must predict how a *bare* Karst conditional (unmarked for settledness) is rendered into a mood-marking language like English. Crucially, it must specify whether it maps *only* to the indicative, *only* to the counterfactual, or *sometimes* to one and *sometimes* to the other based on context. *(Non-negotiable)*

  5.  **English to Karst Translation Fidelity:** The theory must specify what, if anything, is lost or altered when translating an English indicative or counterfactual conditional into Karst using the clitic system and context. *(Non-negotiable)*

  6.  **Karst Learnability Constraint:** The theory's account of the indicative/counterfactual distinction *cannot* rely on semantic features or distinctions that a learner of Karst *could not recover* from the input available in Karst (i.e., utterances with/without the settledness clitic, discourse context concerning what is settled/unsettled at utterance time, and truth-value judgments). *(Non-negotiable - Major Excluder)*

  7.  **Unsettled Antecedent Applicability:** The theory must provide a clear account of conditionals with antecedents that are *unsettled at utterance time* (future contingencies, unresolved lotteries, epistemic possibilities) in both Karst (bare conditional) and English (indicative). It must assign them a place within its framework for conditionals. *(Non-negotiable)*

  8.  **Settledness Boundary:** The theory must state whether the distinction between "settled" (true or false as of utterance time) and "unsettled" (not settled) relevant for Karst marking (and arguably underlying the English mood distinction) is treated as a *strict binary* or admits of *degrees* (e.g., reflecting subjective probability). *(Contentious - Preference)*

  9.  **Settled-True Classification:** The theory must classify conditionals where the speaker takes the antecedent to be *settled-true* (e.g., "If it *is* raining, then the picnic *is* cancelled"). It must explain why these pattern with indicatives in core contrast judgments (e.g., they are incompatible with their counterfactual counterparts: "If it were raining..." implies it isn't). *(Non-negotiable)*

  10. **Settled-True Explanation:** The theory must explain *why* settled-true conditionals pattern as they do (with indicatives) in the judgments outlined in (1) and (9), despite not being hypothetical in the same way unsettled or settled-false antecedents are. *(Non-negotiable)*

  11. **Disjunction Entailment (Karst):** The theory must account for the fact that Karst speakers uniformly accept conditionals with disjunctive antecedents (marked settled-false) as entailing the corresponding conditionals with each disjunct alone. *(Non-negotiable)*

  12. **Disjunction Entailment (English Counterfactuals):** The theory must account for the *lack* of uniform acceptance of the analogous entailment for English counterfactuals with disjunctive antecedents (e.g., "If Spain had fought with the Axis *or* the Allies, she would have won" does not clearly entail both "If Spain had fought with the Axis, she would have won" *and* "If Spain had fought with the Allies, she would have won"). *(Non-negotiable)*

  13. **Logic (In)Dependence:** Based on (11) and (12), the theory must state whether the indicative and counterfactual forms *share a single underlying logic* (and if so, why the disjunction behavior differs) or require *distinct logics*. *(Contentious - Preference)*

  ### Deliverable Summary

  1.  **Requirements List:**
      1.  Core Contrast Exploitation (Non-neg)
      2.  Commitment on Contrast Nature (Non-neg)
      3.  Karst Semantics/Pragmatics (Non-neg)
      4.  Karst Bare Conditional Translation (Non-neg)
      5.  English to Karst Fidelity (Non-neg)
      6.  Karst Learnability Constraint (Non-neg - Major Excluder)
      7.  Unsettled Antecedent Applicability (Non-neg)
      8.  Settledness Boundary (Binary/Graded) (Contentious Pref)
      9.  Settled-True Classification (Non-neg)
      10. Settled-True Explanation (Non-neg)
      11. Disjunction Entailment (Karst) (Non-neg)
      12. Disjunction Entailment (Eng CF) (Non-neg)
      13. Logic (In)Dependence (Contentious Pref)

  2.  **Non-negotiable vs. Preferences:** Requirements marked *(Non-neg)* are widely considered essential. Requirements marked *(Contentious Pref)* reflect significant theoretical divides (e.g., strict binary vs. probabilistic notions of settledness, insistence on a unified logic).

  3.  **Suspected Conflicts:**
      *   **Requirement 6 (Karst Learnability) vs. Theories relying on inaccessible features:** This is the primary excluder. Theories positing features like metaphysical modality, temporal asymmetry, or inaccessible world similarity as *definitional* to the counterfactual risk violating learnability in Karst.
      *   **Requirement 8 (Binary/Graded Settledness) vs. Requirement 7 (Unsettled Antecedents):** A strictly binary view struggles with graded uncertainty in unsettled antecedents. A graded view must still explain the sharpness of Karst marking.
      *   **Requirement 13 (Single Logic) vs. Requirements 11 & 12 (Divergent Disjunction):** Insisting on a single logic for indicatives and counterfactuals makes explaining the divergent entailment judgments for disjunctive antecedents very difficult.

  4.  **Major Excluding Requirement:** **Requirement 6 (Karst Learnability Constraint)** does the most to exclude candidate theories. It demands that the distinction be grounded solely in features recoverable from Karst input: the settled/unsettled status of the antecedent *at utterance time*, context, and truth judgments. Theories requiring irreducibly distinct modal bases, ordering sources, or accessibility relations risk failing this.

  ### Assessment of Theory Families

  *   **Truth-Functional (Material Implication):** Fails catastrophically. Cannot explain core contrast (1), collapses indicative/counterfactual, fails settled-true pattern (9,10), fails disjunction entailments (11,12), ignores settledness (3,6,7,8). *Excluded.*
  *   **Possible Worlds (Stalnaker/Lewis):**
      *   *Strengths:* Handles core contrast (1) via distinct accessibility/ordering (metaphysical vs. epistemic worlds). Can explain inconsistency (1). Can handle settled-true (9,10) via epistemic similarity. Strong on disjunction (11,12) via premise sets/ordering.
      *   *Weaknesses:* Karst Learnability (6) is a major issue. What makes worlds "closer"? Is this recoverable from settledness? Struggles with unsettled antecedents (7) – are future worlds "closer"? Settledness boundary (8) often binary implicitly. Logic dependence (13) is complex.
  *   **Premise Semantics (Kratzer, Veltman):**
      *   *Strengths:* Flexible modal bases/ordering sources can capture settledness (3, potentially 6 if based on context). Handles core contrast (1) well. Strong on disjunction patterns (11,12) via premise combination. Can accommodate unsettled antecedents (7) via epistemic ordering. Can explain settled-true (9,10).
      *   *Weaknesses:* Karst Learnability (6) still challenging – are the specific premise sets recoverable? Logic dependence (13) can be handled by distinct conversational backgrounds. Settledness boundary (8) often binary (factual vs. non-factual).
  *   **Suppositional (No Truth Value - Adams, Edgington):**
      *   *Strengths:* Explains core contrast (1) via different norms (probability vs. imagination). Handles unsettled antecedents (7) naturally via probability. Settled-true (9,10) fits as high-probability supposition. Karst clitic (3) could mark probability 0 vs. non-zero. Learnability (6) potentially good if norms are based on observable settledness/assertability.
      *   *Weaknesses:* Struggles with perceived inconsistency (1) without truth conditions. Disjunction entailments (11,12) are problematic (probability isn't truth-functional). Bare Karst translation (4) might map only to indicative. Logic dependence (13) difficult without truth conditions.
  *   **Epistemic Modal Base (Restrictor/Contextualist - often within Premise Semantics):** Focuses on indicatives/unsettled. Often subsumed under Premise Semantics. Good on unsettled (7), settled-true (9,10), core indicative patterns (1). Counterfactuals require additional mechanisms (e.g., shifting the modal base/time), raising challenges for unified accounts (13) and Karst learnability (6) regarding how the shift is triggered/learned solely from settledness marking. Bare Karst (4) likely maps only to indicative.

  **Conclusion:** No family satisfies all requirements flawlessly. **Premise Semantics** offers the most comprehensive coverage, particularly on logic and disjunction, but **Karst Learnability (6)** remains a significant challenge for all truth-conditional approaches (Worlds, Premise). **Suppositional** theories handle core contrast, unsettled antecedents, and learnability well but stumble on logic and entailments. **Requirement 6** is the most potent filter. An adequate theory must either show how its core mechanisms are learnable from Karst input or convincingly argue that Karst lacks the full distinction (which contradicts the fixed point).
