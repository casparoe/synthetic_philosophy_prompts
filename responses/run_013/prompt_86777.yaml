  For unsettled antecedents (like future contingencies), the theory must position them within the settled/unsettled spectrum - is this binary or gradient? And for settled-true antecedents ("Since it's raining..."), the theory must explain why they pattern differently.

  Finally, the logical interaction point about disjunctive antecedents reveals a fracture in English counterfactuals that's absent in Karst. The theory must account for this divergence in logical behavior between the two conditional types.

  I'll organize these into numbered requirements grouped by the fixed points. For each, I'll note whether it's non-negotiable or contentious. The Karst learnability requirement (#7) might be the most exclusionary - it rules out theories relying on inaccessible features. 

