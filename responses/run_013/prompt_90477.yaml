prompt: |-
  I just switched into an MA in philosophy after a law degree and got thrown into a seminar on expressivism, which means I'm presenting on the Frege-Geach problem next week and I'm panicking a bit. I think I've got the basic shape of it: "lying is wrong" has to mean the same thing when I assert it as when it sits unasserted in the antecedent of "if lying is wrong, then telling my little brother to lie is wrong" — otherwise the inference from that conditional plus "lying is wrong" to "telling my little brother to lie is wrong" is just an equivocation and not a valid argument. And the expressivist who says the meaning of "lying is wrong" is the expression of a non-cognitive attitude toward lying can't obviously say that about the antecedent, since nobody in that sentence is actually expressing disapproval of lying, they're only supposing it. Fine, I definately get the sketch.

  What I can't get a grip on is what the actual conceptual issue is once you go past the sketch. My supervisor keeps saying this is really two different problems that people run together — one about how a word can keep its meaning in a context where the attitude isn't expressed, and one about why certain inferences are valid or certain pairs of sentences inconsistent even though nothing in them is truth-apt, which is supposedly a problem about the logic of attitudes rather than about compositionality — and that the second one shows up much more sharply with negation than with conditionals. So: if "lying is wrong" expresses disapproval of lying, what exactly does "lying is not wrong" express? It can't just be the absence of disapproval, because someone who simply doesn't disapprove of lying isn't thereby disagreeing with me; and if it's meant to be some higher-order attitude (disapproval of the approval of lying, or whatever), then it's no longer clear that my "lying is wrong" and their "lying is not wrong" actually contradict each other — they just have different second-order tastes. Could you explain, as concretely as you can, what the expressivist actually has to show here, which of these two problems is the real one, and whether the standard fixes — higher-order attitudes, saying "wrong" picks out a property after all, etc. — solve the thing or just relocate it? I'd especially like to understand why negation is supposed to be harder than the conditional case, because on my reading they look like the same move.
reasoning: |-
  Okay, the user is transitioning from law to philosophy and is grappling with the Frege-Geach problem for an upcoming presentation. They understand the basic issue about unasserted contexts like conditionals but are confused about the deeper conceptual split their supervisor mentioned—specifically why negation poses a tougher challenge than conditionals.  

  First, I need to validate their grasp of the surface problem: they clearly get how expressivism struggles with compositionality in non-assertive contexts. Their supervisor’s point about two distinct problems (compositionality vs. logic/contradiction) seems to be the sticking point. The user’s phrasing about "second-order tastes" suggests they intuitively sense the negation issue but can’t articulate why it’s worse than conditionals.  

  Hmm, their law background might be shaping this. Legal reasoning thrives on binary oppositions (valid/invalid, guilty/not guilty), so the idea that "not wrong" isn’t a clean contradiction under expressivism probably feels especially destabilizing. They might be wrestling with how philosophical logic diverges from legal logic here.  

  The supervisor’s emphasis on negation being "sharper" makes sense when you consider that conditionals can be partially rescued by hypothetical attitudes ("suppose I disapproved..."), but negation demands a direct, real-world clash between stances. If "not wrong" expresses meta-disapproval (hating disapproval), then someone who says "lying isn’t wrong" isn’t contradicting the moralizer—they’re just disliking the moralizer’s attitude, which is a different kind of conflict. That’s catastrophic for expressivism because moral debates collapse into parallel monologues about preferences.  

  The user’s question about whether solutions "relocate" the problem is astute. Quasi-realism (e.g., Blackburn’s higher-order attitudes) tries to mimic logical relations through attitude structures, but it risks making contradiction contingent—like needing a third party to "boo" both attitudes to feel inconsistency. That’s a far cry from objective logical friction. Meanwhile, hybrid theories (adding truth-aptness) surrender core expressivism by smuggling in descriptivism.  

  I should stress that negation exposes this uniquely because:  
  - Conditionals are about inferential *movement* (can attitudes transition?)  
  - Negation is about *clash* (do attitudes directly oppose?).  
  The latter is harder to fake without truth-aptness.  

  ...Wait, their closing query about "same move" suggests they see both as attitude-repurposing. True, but conditionals repackage attitudes hypothetically ("if I felt X..."), while negation demands an actual counter-attitude. The difference is that hypotheticals don’t require real-world opposition, whereas negation must define what counts as genuine disagreement. That’s why it’s the litmus test.
answer: |-
  You've grasped the core issue brilliantly – and your supervisor is spot-on about the dual nature of the Frege-Geach problem (FGP). The "sketch" focuses on **compositionality** (how word meaning combines in complex sentences), but the deeper, more devastating problem revealed by negation is about **logic and inconsistency** (how sentences genuinely contradict each other and how inferences preserve *normative* disagreement). Let's break down the expressivist's task, why negation is the critical test, and how solutions fare.

  ### The Expressivist's Mandate
  An expressivist (e.g., Ayer, Stevenson, early Blackburn, Gibbard) says:
  *   **"Lying is wrong" (asserted):** Primarily expresses the speaker's *non-cognitive attitude* (e.g., disapproval, "Boo! lying!").
  *   **Meaning is Use:** The meaning *is* this expressive act. It's not describing a moral fact "out there."
  *   **Non-Truth-Apt:** Moral sentences aren't true/false in a robust, correspondence sense.

  ### The Two Problems Lurking in FGP
  1.  **The Compositionality Problem (The "Sketch"):**
      *   **Issue:** How can the *same meaning* ("lying is wrong") appear in an unasserted context (like an antecedent) if meaning *just is* the act of expressing an attitude? In "If lying is wrong, then...", nobody is *actually* booing lying. What semantic value does "lying is wrong" contribute to the conditional?
      *   **Analogy:** If "ouch" means *expressing pain*, what does "if ouch, then..." mean? It's gibberish.

  2.  **The Logic/Inconsistency Problem (The Real Beast - Especially with Negation):**
      *   **Issue:** How can sentences like "Lying is wrong" and "Lying is not wrong" be *genuinely inconsistent*? How can an inference like Modus Ponens ("If lying is wrong, then getting your brother to lie is wrong. Lying is wrong. Therefore, getting your brother to lie is wrong.") be *logically valid* and *preserve normative disagreement*?
      *   **The Stakes:** Logic requires stable meanings that stand in logical relations (contradiction, entailment). If moral sentences only express attitudes, what provides the necessary "logical friction"? Why *must* someone who accepts the premises but denies the conclusion be guilty of a *logical* error, not just a difference in taste?

  ### Why Negation is the Litmus Test (and Harder than Conditionals)

  Your intuition that it seems like the "same move" is understandable, but negation exposes a unique vulnerability:

  1.  **The Naive Expressivist Attempt at Negation:**
      *   "Lying is wrong": Expresses disapproval of lying (D(lying)).
      *   "Lying is not wrong": ???
          *   *Option 1 (Absence):* Merely *not* expressing D(lying). **Problem:** This doesn't contradict "Lying is wrong"! Someone indifferent to lying doesn't disapprove, but they aren't *denying* that lying is wrong. They might just not care. Contradiction requires *opposition*, not mere absence.
          *   *Option 2 (Higher-Order Attitude):* Expresses disapproval *of* disapproval of lying (D(D(lying))) or approval *of* lying (A(lying)). **Problem:** Now "Lying is wrong" (D(lying)) and "Lying is not wrong" (D(D(lying)) or A(lying)) express *different, non-conflicting attitudes*. They don't logically contradict; they just express different preferences about attitudes.

  2.  **The Contradiction Failure:**
      *   Under Option 2, someone saying "Lying is wrong" (D(lying)) and someone saying "Lying is not wrong" (D(D(lying))) aren't disagreeing *about lying*. They are disagreeing *about whether to disapprove of lying*. The first speaker dislikes lying. The second speaker dislikes disliking lying (perhaps they think disapproval is prudish). **Their disagreement is meta-ethical, not moral.** They aren't directly contradicting each other *about the wrongness of lying itself*. The core moral disagreement evaporates.

  3.  **Why Conditionals are (Slightly) Easier:**
      *   Expressivists can try to handle conditionals by appealing to *hypothetical* or *complex* attitudes. Blackburn, for example, suggests "If lying is wrong, then getting your brother to lie is wrong" expresses a *higher-order attitude*: something like *planning* to disapprove of getting your brother to lie *if* one disapproves of lying (or finding the combination of disapproving lying but *not* disapproving getting your brother to lie "icky").
      *   **The Move:** They *replicate the logical structure using attitude structures*. The antecedent ("lying is wrong") is embedded within a complex attitude expression about the connection between attitudes.
      *   **Why it *Seems* Less Bad:** The conditional doesn't *assert* the antecedent, so not expressing the basic attitude (D(lying)) in that context feels less jarring. The focus is on the *inferential connection* between attitudes, which they attempt to ground in a stable higher-order attitude. The problem of direct *clash* isn't forced immediately.

  4.  **Negation Forces the Clash:**
      *   Negation *demands* direct, immediate opposition. There's no hypothetical buffer. The expressivist *must* define an attitude expressed by "not P" that *directly, logically conflicts* with the attitude expressed by "P". The higher-order attitude strategy (D(D(lying))) fails this because it changes the subject.

  ### What the Expressivist Must Show (The Core Challenge)

  The expressivist needs to explain how their theory **grounds the *logical relations* (contradiction, validity) between moral sentences *solely in terms of the non-cognitive attitudes they express***. Specifically:

  1.  **Contradiction:** What relation between the attitudes expressed by P and ~P makes them *inconsistent*? Why *can't* one rationally/intelligibly hold both attitudes simultaneously *toward the same thing*?
  2.  **Validity:** Why *must* someone who holds the attitudes expressed by the premises of a valid moral argument (like Modus Ponens) also *hold* (or be rationally compelled to hold) the attitude expressed by the conclusion? Why is denying the conclusion while accepting the premises not just a different preference, but a *logical mistake*?

  ### The Standard "Fixes" & Their Problems

  1.  **Higher-Order Attitudes (Blackburn's Quasi-Realism - Projectivism):**
      *   **The Move:** Develop a sophisticated system where logical relations map onto relations between complex states of approval/disapproval. Contradiction (P and ~P) is modeled by "clashing" attitudes the speaker *cannot coherently hold together*. Validity is modeled by complex dispositions or plans (e.g., accepting the premises *commits* you to the conclusion's attitude).
      *   **Does it Solve?** It's the most developed attempt. It *mimics* logic impressively.
      *   **Or Just Relocate?** Critics (like Hale, Schueler, Schroeder) argue:
          *   **Relocation:** It explains logical relations *within* the attitude system, but not why *this specific structure* (e.g., D(D(lying)) for ~P) genuinely *deserves* the label "logical contradiction" applied to P and ~P. It builds a parallel "logic of attitudes."
          *   **Stability:** Are these higher-order attitudes stable enough to ground objective-seeming logic? Do we *really* have such complex, interlocking commitments?
          *   **Contingency:** The "inconsistency" feels contingent on human psychology (what attitudes we find "clashing") rather than necessary logical relations. Why *must* D(lying) and D(D(lying)) clash? Couldn't someone be indifferent to their own attitudes?

  2.  **Hybrid Theories (Adding Truth-Aptness - e.g., "Wrong" Picks Out a Property):**
      *   **The Move:** Combine expressivism with descriptivism. "Lying is wrong" both *describes* a normative property (e.g., the property of being such as to cause disapproval in the speaker/community/Ideal Observer) *and* expresses disapproval of lying. Meaning has both descriptive and expressive components.
      *   **Does it Solve?** Solves compositionality and logic easily! The descriptive component carries truth-value and logical relations just like any other descriptive claim. The expressive component is an add-on.
      *   **Or Just Relocate?** **Massive Relocation/Surrender:** This largely *abandons pure expressivism/non-cognitivism*. The deep problem (grounding logic *without* truth-aptness) is avoided by reintroducing truth-aptness. The core expressivist motivation (morality isn't fundamentally *about facts*, it's about attitudes/actions) is significantly weakened. It becomes a form of subjectivist/naturalist cognitivism with an expressive element.

  ### Conclusion

  *   **The "Sketch" (Compositionality):** Is the entry point to FGP, showing expressivism struggles with unasserted contexts. Conditionals are the classic example.
  *   **The Real Conceptual Issue (Logic/Inconsistency):** Is the deeper challenge: grounding genuine contradiction and valid inference *solely* in non-cognitive attitudes. **Negation is the acid test** because it demands a direct, non-hypothetical clash of attitudes *about the same object-level subject matter*. The higher-order attitude strategy risks changing the subject of disagreement.
  *   **Why Negation is Harder:** Conditionals allow the expressivist to embed the attitude *hypothetically* within a complex attitude *about connections*. Negation demands an *actual*, *opposing* attitude directed *at the very same thing* as the original attitude. Finding that opposition without appealing to truth-apt content is incredibly difficult.
  *   **Solutions:** Higher-order attitude strategies (quasi-realism) provide sophisticated models that *mimic* logic but face criticism for merely relocating the problem into the "logic of attitudes" and potentially lacking necessity. Hybrid theories solve the logical problem but largely abandon core expressivist commitments by reintroducing truth-apt descriptive content.

  Your presentation should emphasize this shift: FGP starts as a puzzle about meaning in complex sentences but reveals the existential threat to expressivism is explaining how its core components (attitudes) can sustain the objective-seeming logical relations essential to moral discourse. Negation, not the conditional, is where the pure expressivist's back is truly against the wall. Good luck! Your understanding is already very strong.
