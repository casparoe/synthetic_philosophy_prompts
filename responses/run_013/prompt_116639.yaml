prompt: |-
  So my friend and I got into this enormous argument at dinner last night and I'm still chewing on it. He's a big Steven Pinker guy — "the world has never been less violent," the whole long-run decline-of-violence story — and he thinks anyone who pushes back is just doing the usual "things feel worse than they are" routine. I'm an epidemiologist (infectious disease mostly, but I've done alot of surveillance work), and the whole time he was talking, the back of my brain kept saying: this is a claim about incidence, except nobody has defined the case. So here's what I want from you. Take the declining-violence thesis and restate it as faithfully as you can in the vocabulary I actually use — case definitions, notifiable-event reporting, ascertainment and surveillance artifacts, incidence vs. prevalence, person-time at risk, denominators, competing risks, secular trend, age-standardization, outbreak vs. endemic baseline. Be honest about the translation; if part of the thesis can't be written as a rate with a numerator and a denominator, say so instead of fudging it.

  Then I want the residue report, because that's the part I care about. What in his thesis survives the translation untouched? What has to get distorted to fit? And what has no expression at all in my vocabulary — my suspicion is that the moral weight of the word "violence" has no clean counterpart, since we never build legitimacy into a case definition, but I want you to tell me. Two specific things I keep going back and forth on. First, is the per-capita-vs-absolute fight just the ordinary fight about choosing a denominator and a time-at-risk, or are the philosophers arguing about something my framework genuinely has no slot for? Second, does "is the world becoming less violent?" have a fact of the matter the way "has measles incidence fallen since 1960" does, or is it more like "has depression incidence risen," where the case definition is doing all the work and the trend is partly an artifact of who's counting and how hard they're looking? My friend says I'm cheating by dragging a medical framework onto a moral question and that the residue you're going to find is just the residue of that cheat — he's definately sure he's right, and I'd like to know if he is.

  Give it to me as a numbered list of exactly five items, each one or two sentences, no intro and no closing paragraph.
