answer: |-
  Here are five numbered points addressing your queries:

  1.  **The "third bin" likely collapses:** Your stealth performative isn't a distinct failure category (misfire/abuse), but primarily an *implicit conventional performative*. The act succeeds via unofficial yet binding social conventions governing group decision-making, fitting within Austin's framework where conventions enable performatives. The "stealth" aspect highlights a feature of *this specific convention*, not a new failure mode.

  2.  **"Stealth" adds nuance beyond basic implicitness:** While implicit performatives exist (e.g., "Guilty!" implying a verdict), the "stealth" element crucially emphasizes that *explicit recognition* of the utterance *as the performative act* (calling it a "vote") would *invalidate it* under this specific convention. This dependency on non-awareness for validity is the novel contribution beyond simple implicitness.

  3.  **The test case is flawed:** It conflates the *performative success* of the act (creating agreement) with the *social consequences* (being bound). The new member *is* socially bound due to group pressure or subsequent actions, but this doesn't prove the performative *succeeded* at the moment of utterance *for them*. Their lack of uptake (understanding it *as* the decision act) means the act likely misfired *in relation to them*, even if the group proceeds *as if* it succeeded universally. It shows social enforcement ≠ performative success.

  4.  **Strongest unmentioned objection:** Austin might argue the utterance ("so we're agreed then") isn't *itself* the performative ("I declare the motion passed"), but a *constative report* of a pre-existing state (agreement). The binding force then arises from the *subsequent actions* based on *that report*, not from the utterance performing a distinct institutional act. Your case relies on interpreting it as performative, which is contested without clearer conventional markers.

  5.  **Cut or change the insincere chair variation:** Remove the "steamrolling" insincere chair scenario. It actively undermines your core case (sincere chair, unconventional success) by reintroducing insincerity, which *does* squarely fit Austin's "abuse" category. Keeping it dilutes the distinctness of the phenomenon you're trying to isolate and weakens your argument for a novel element. Focus solely on the sincere case with unconventional uptake.
