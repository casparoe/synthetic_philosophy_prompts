  - B: But then, how do we bound lives? And what about the Pasadena-like problems in ethics? Also, even if we bound, what about the summation order for the Pasadena game? Is temporal order privileged?

  Exchange 4:
  - A: For the Pasadena game, we can use a specific summation order (like temporal) or use a different decision rule (like weak expectation). 
  - B: But weak expectation gives up on completeness (it doesn't compare all acts) and relative expectation might smuggle in an ordering arbitrarily.

  Exchange 5:
  - A: Maybe we don't need completeness? Or we can use a bounded utility and avoid the problem altogether. The Pasadena game is too artificial.
  - B: But even in bounded utility, if the bounds are high, we can get Pasadena-like effects. And in ethics, the bounds might be too large to set meaningfully. Also, the temporal order might be arbitrary if the events are simultaneous in thought.

  Then we wrap up by having them agree on the math but disagree on the implications.

  We'll also note (either in dialogue or as an aside) what's settled and what's contested.

  Let's write the dialogue accordingly.
answer: |-
  ### Dialogue: The St. Petersburg Paradox and Beyond  
  *Two friends, Alex and Bailey, debate the paradoxes of infinite expectation over coffee. Alex is pragmatic, defending bounded utility and real-world constraints. Bailey is more skeptical, arguing that the paradox reveals deeper flaws in decision theory. Both know the math cold but clash on interpretation.*

  ---

  **Alex (A):** Okay, so the St. Petersburg game. Fair coin, payoff of \(2^n\) dollars for \(n\) flips until heads. Expected value is infinite, but it’s a non-problem. Real people have bounded utility—nobody values their trillionth dollar as much as their first. Real casinos have finite bankrolls. Plus, no rational host would offer it because *their* expected loss is infinite. Expected value theory works fine; the paradox is just an artifact of unrealistic idealization.

  **Bailey (B):** That’s too quick, Alex. You’re dodging the real issue. What about the Pasadena game? Payoff is \((-1)^{n+1} \cdot 2^n / n\) dollars for \(n\) flips. Its expectation is conditionally convergent—by Riemann rearrangement, you can make it sum to *any* real number, or diverge to \(\pm \infty\). It’s not infinite; it’s *undefined*. That’s worse. Expected value theory doesn’t just overshoot; it gives no verdict at all. And any verdict depends on an arbitrary choice of summation order.

  **A:** Fair point, but the Pasadena game is a mathematical curiosity. When do real-world decisions have that structure? We don’t see alternating signs in payoffs. Bounded utility handles St. Petersburg cleanly: with log utility, the expectation is finite. Problem solved.

  **B:** Not so fast. First, "real-world" is slippery. Consider global catastrophic risks: a vaccine has a \(1/2^n\) chance of saving \(2^n\) lives. Lives saved—not dollars. Bounded utility is least plausible here. Do we really cap the value of human lives? "Diminishing returns" on lives feels grotesque. And nature is the "casino"—it doesn’t care about bankrolls. If we follow bounded utility, we might underinvest in interventions with tiny odds of astronomical payoffs.

  **A:** Okay, that’s thorny. But even with lives, we can bound utility pragmatically. Resources are finite; we can’t value a billion lives infinitely more than a million. And for the Pasadena problem, why not just use the temporal order of flips? The coin is flipped sequentially—that privileges an ordering. Sum the expectation as the game unfolds: flip 1, then flip 2, etc. No rearrangement needed.

  **B:** Temporal order isn’t always privileged. What if the "flips" represent possible states of the world, not temporal events? In ethics, we might rank outcomes by scale, not time. And even if we use time, why not weight by probability density? That’s arbitrary too. Besides, bounded utility doesn’t save you here. Set a bound \(B\) for utility, and tweak the Pasadena payoffs to be \((-1)^{n+1} \cdot 2^n / n\) for \(n\) where \(|payoff| < B\), and 0 otherwise. You still get conditional convergence *within* the bound. The problem isn’t infinity—it’s indeterminacy.

  **A:** Then use a different decision rule. Weak expectation (only defined when absolute convergence holds) or relative expectation (compare acts pairwise). These avoid the issue. Or maximize median outcomes. We don’t *need* expected value for everything.

  **B:** But weak expectation gives up on completeness—it can’t rank all acts. Relative expectation? It sneaks in an ordering through the pairwise comparisons. Maximize the median? That ignores tail risks entirely. In the lives example, that means ignoring a 0.001% chance of saving a billion lives. And how do you set the bound \(B\) for lives? If \(B = 10^{12}\) lives, the "Pasadena effect" still lurks for payoffs below \(B\). This isn’t just theory—long-termism in ethics *does* face these payoff structures.

  **A:** Fine, but we’re conflating two issues. For St. Petersburg, bounded utility works. For Pasadena, we need a tailored approach. In practice, we don’t face conditionally convergent expectations—they’re engineered pathologies. We should focus on robust rules for realistic problems. Expected utility with reasonable bounds is still the best tool.

  **B:** "Reasonable bounds" are subjective, and "pathological" is a cheap dismissal. If a decision rule fails in some cases, it’s flawed. And tiny-probability, huge-impact events *are* realistic: asteroid deflection, AI safety, pandemics. Here, bounded utility feels ad hoc, and the Pasadena problem shows that expectation isn’t just fragile—it’s incoherent. We need a theory that handles indeterminacy without arbitrary choices.

  ---

  ### What’s Settled vs. What’s Contested  
  *(Alex and Bailey summarize their agreement and disagreement)*  

  **A:** We agree on the math:  
  - St. Petersburg: \(\sum (1/2^n) \cdot 2^n = \infty\).  
  - Pasadena: \(\sum (1/2^n) \cdot (-1)^{n+1} 2^n / n\) is conditionally convergent; rearrangement alters the sum.  
  - Bounded utility (e.g., \(u(x) = \log x\)) makes St. Petersburg’s expectation finite.  

  **B:** Yes, but we contest the implications:  
  - Is bounded utility a satisfying resolution? Alex says yes for realism; I say it’s arbitrary, especially for lives.  
  - Is there a privileged summation order? Alex says temporal order suffices; I say it’s context-dependent and manipulable.  
  - Should this change real decisions? Alex says focus on robust, bounded cases; I say we can’t ignore tail risks with undefined expectations.  

  **A:** And we disagree on depth: you think this undermines expected utility; I think it’s a niche limitation.  

  **B:** Exactly. But neither of us is a strawman. There are Nobel laureates in your camp, Alex, and philosophers like Hájek in mine. The debate isn’t settled—it’s about how much idealization decision theory can tolerate.  

  **A:** Cheers to that. More coffee?  

  **B:** Only if you pay—I’m not playing St. Petersburg with my wallet.  

  ---

  **Key Notes for the Blog Post**  
  - **Settled Math**:  
    - St. Petersburg: Divergent infinite expectation.  
    - Pasadena: Conditionally convergent expectation; rearrangement yields any real number or divergence.  
    - Bounded utility (e.g., log, linear with cap) makes St. Petersburg finite.  
  - **Genuinely Contested**:  
    - Whether bounded utility resolves the paradox or dodges it (especially for non-monetary goods).  
    - Whether conditionally convergent expectations are "pathological" or reveal decision-theoretic flaws.  
    - How to handle indeterminacy (privileged order? alternative rules?) and its real-world relevance.  
  - **No Consensus**: Economists often accept bounded utility; philosophers like Arntzenius or Nover see the paradoxes as deeper critiques. The dialogue lets both sides articulate their best arguments.
