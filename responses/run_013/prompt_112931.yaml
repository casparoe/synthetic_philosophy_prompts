  2. Pasadena game: conditionally convergent series, rearrangement can yield any expected value.
  3. Bounded utility as a solution? Person A defends it, Person B criticizes it.
  4. The twist: lives saved instead of dollars, making bounded utility less plausible and nature as the casino.
  5. The issue of summation order: is there a privileged order? (temporal? something else?)
  6. Alternatives: weak expectation, relative expectation, other decision rules.

  We'll also flag what is settled (mathematical facts) and what is contested (interpretations, decision relevance).

  Let's outline the dialogue:

  Exchange 1:
  - A: The St. Petersburg paradox is not a real problem because of bounded utility and finite bankrolls.
  - B: But what about the Pasadena game? There, the expected value is undefined, which is worse.

  Exchange 2:
  - A: The Pasadena game is a mathematical curiosity; real decisions don't have that structure.
  - B: Actually, infinite ethics and some real risks do (e.g., tiny chance of astronomically large benefit). And here's a case with lives: ...

