  ### Decision Tree for AI Safety Positions  
  **Fixed Vocabulary**:  
  - **Control measures**: Safeguards holding even if the model is misaligned and adversarial (e.g., weaker trusted monitor, tripwires, restricted affordances, sandboxing, human review).  
  - **Alignment measures**: Aim to make the model "want" what we want, removing the need for adversarial assumptions.  

  **Instructions**: Answer each question from engineering judgment about concrete scenarios (e.g., concealed triggers, model-based monitors, text-only deployments, delayed-harm cases, security-through-obscurity safeguards). Each leaf names a position (or marks one unnamed) and identifies its least comfortable commitment.  

  ---

  #### 1. **Must safety hold if the model is misaligned and actively adversarial?**  
     - **Yes** → Go to 2  
     - **No** → Go to 6  

  #### 2. **Does safety rely on restricting capabilities?** (e.g., no network access, sandboxing, immutable affordances)  
     - **Yes** → **Leaf: Capability Control**  
       *Least comfortable defending: That restrictions are robust against a model intentionally probing for escape vectors (e.g., social engineering or undiscovered exploits).*  
     - **No** → Go to 3  

  #### 3. **Can safeguards rely on the model being unaware of them?** (e.g., security-through-obscurity, concealed tripwires)  
     - **Yes** → Go to 4  
     - **No** → Go to 5  

  #### 4. **Is the safeguard a model assumed aligned without verification?** (e.g., a monitor trusted only via behavioral tests)  
     - **Yes** → **Leaf: Control with Assumed-Aligned Monitor**  
       *Least comfortable defending: That an unverified monitor model is aligned, given it may share the main model’s flaws or vulnerabilities.*  
     - **No** → **Leaf: Control with Opaque Safeguards**  
       *Least comfortable defending: That the model will remain unaware of safeguards indefinitely, despite incentives to discover them.*  

  #### 5. **Is the monitor trusted via non-behavioral argument?** (e.g., formal verification, simplicity, interpretability proofs)  
     - **Yes** → **Leaf: Verified Control**  
       *Least comfortable defending: That the trust argument scales to a deceptive model with full knowledge and unbounded capabilities.*  
     - **No** → **Leaf: Unnamed (Empty)**  
       *Reason: Unattractive—requires a non-verified monitor to stop an adversarial model without obscurity or restrictions, offering no justification for reliability.*  

  #### 6. **Is safety based on aligning the model’s internal goals?**  
     - **Yes** → Go to 7  
     - **No** → **Leaf: Average-Case Safety**  
       *Least comfortable defending: That the model won’t become adversarial post-deployment, even if evaluations show no issues.*  

  #### 7. **Can alignment be verified solely via outputs?** (e.g., evaluations, red-teaming, behavioral checks)  
     - **Yes** → **Leaf: Behaviorist Alignment**  
       *Least comfortable defending: That a model passing all behavioral tests cannot be deceptively aligned (i.e., faking alignment until deployment).*  
     - **No** → **Leaf: Inner Alignment**  
       *Least comfortable defending: That we can verify internal goals robustly without relying on observable outputs (e.g., via interpretability or objective guarantees).*  

  ---

  ### Key Notes for Study Group  
  - **Unnamed Position (Leaf 5)**: Empty because it’s unattractive—combines no safeguards against a fully informed adversary with no justification for the monitor.  
  - **Unseparated Leaves**: *Control with Opaque Safeguards* (Leaf 4) and *Control with Assumed-Aligned Monitor* (Leaf 4) may overlap in practice; the tree separates them via monitor trust, but both rely on obscurity.  
  - **Branching Logic**: Turns on commitments like worst-case adversarial behavior (Q1), reliance on ignorance (Q3), trusted-by-assumption monitors (Q4), capability restrictions (Q2), and output vs. disposition focus (Q7).  
  - **Usage**: Start at Q1, answer based on concrete cases (e.g., "Would this safeguard work if the model knew about it or tried to bypass it?"). Positions reflect engineering tradeoffs, not dogma.  

  ---  
  **Format**: Handout-friendly flowchart (≤8 nodes, 9 leaves). For deeper debate, map disagreements to nodes (e.g., if peers split at Q3, they prioritize obscurity vs. transparency).
