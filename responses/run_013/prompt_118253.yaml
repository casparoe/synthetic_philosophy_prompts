answer: |-
  Based on your team's unique composition, resources, and shared suspicion about the underexplored theoretical potential of constrained translation, here’s a defended research agenda prioritizing tractability, theoretical novelty, and impact. The ordering balances foundational work (Year 1) with synthesis and high-risk/high-reward questions (Year 2), leveraging computational scale while grounding results in humanistic practice.

  ### Core Principles for Prioritization
  1.  **Upstream First:** Build tools/data before testing abstract theories.
  2.  **Leverage Computation:** Prioritize questions where generating/scoring 1000s of candidates provides novel insight.
  3.  **Interdisciplinary Bridge:** Every project must engage all 3 team members meaningfully.
  4.  **Actionable Outputs:** Avoid questions where the answer ("it depends") doesn’t change practice. Seek metrics, heuristics, or frameworks.
  5.  **Risk Mitigation:** Tackle methodologically clearer questions early to build momentum.

  ### The Agenda: Phased Over 2 Years
  **Year 1: Foundations & Constraint Interactions**  
  *(Focus: Tool-building, empirical mapping, local/global trade-offs)*

  1.  **Quantifying the Sacrifice Ledger (Months 1-8)**  
      -   **Why First?** It’s upstream, tractable, and provides data for other questions. Computational generation/scoring allows systematic mapping of trade-offs previously only anecdotal. Answers "what *actually* gets lost/gained?" when satisfying specific constraints.  
      -   **Approach:**  
          -   Linguist: Build pipeline generating multiple constrained translations (e.g., rhyme-preserving vs. meter-preserving vs. literal) for diverse short poems/sentences.  
          -   Poet & Philosopher: Define "fidelity" dimensions beyond BLEU (semantic nuance, tone, imagistic impact – e.g., via annotated benchmarks).  
          -   Team: Analyze correlations – does forcing rhyme *systematically* damage imagery? Does preserving an acrostic alter word frequency distributions predictably? Visualize trade-offs (e.g., parallel coordinates plots).  
      -   **Output:** A validated "Trade-off Atlas" for common constraints + open-source pipeline. Makes the implicit explicit. Changes practice by providing empirical grounding for translator choices.  
      -   **Risk:** Low-Medium. Builds on existing MT evaluation; challenge is defining nuanced fidelity metrics.

  2.  **Mapping Constraint Lattices & Degradation (Months 6-14)**  
      -   **Why Next?** Builds directly on the Ledger. Computation is essential here – manually exploring the lattice is impossible. Tests if semantic fidelity degrades *predictably* as constraints accumulate or climb the lattice (e.g., rhyme → rhyme + meter → rhyme + meter + acrostic).  
      -   **Approach:**  
          -   Linguist: Extend pipeline to generate candidates satisfying increasing subsets of constraints (ordered by "strictness" or linguistic cost).  
          -   Poet & Philosopher: Define the partial order (lattice structure) for chosen source texts & target constraints. Refine fidelity scoring based on Ledger findings.  
          -   Team: Identify Pareto frontiers – are there "sweet spots" where adding a constraint doesn't degrade fidelity much? Is degradation linear, cliff-edged, or chaotic?  
      -   **Output:** Theory of constraint accumulation impact; visualizations of fidelity landscapes within lattices. Changes evaluation by showing *which combinations* are most/least costly.  
      -   **Risk:** Medium. Defining a universal lattice structure is hard; focus on specific constraint sets per source text.

  3.  **Local vs. Global Constraint Feasibility & Cost (Months 10-18)**  
      -   **Why Here?** Requires data from (1) & (2). Computation reveals scale of incompatibility. Directly addresses your "underneath all" question about informative incompatibility.  
      -   **Approach:**  
          -   Linguist: Design experiments forcing incompatible pairs (e.g., strict syllable count + strict anagram). Quantify failure rates/search costs.  
          -   Poet: Provide intuition/practical examples of what "breaks" first.  
          -   Philosopher: Formalize "incompatibility" – is it categorical or gradient? Define "carry capacity" metrics (e.g., % source letters usable in target palindrome, flexibility of target syntax for acrostics).  
      -   **Output:** A "Constraint Compatibility Matrix" for language pairs + metrics for "form-carrying capacity." Informs translators *which* global constraints are viable for a given source/target pair.  
      -   **Risk:** Medium-High. Defining good incompatibility metrics is novel. Focus on specific constraint clashes.

  **Year 2: High-Risk Theory & Reader Perception**  
  *(Focus: Phantom constraints, synthesis, theoretical impact)*

  4.  **Detecting & Validating Phantom Constraints (Months 15-24)**  
      -   **Why Last?** Methodologically hardest (involves human subjects), but potentially transformative. Requires tools/methods from Year 1.  
      -   **Approach:**  
          -   Poet: Identify candidate "phantom constraints" (e.g., perceived nursery-rhyme-ness, "sonnet-ness" even in free verse). Create source texts + translations manipulating these.  
          -   Linguist: Develop computational proxies for phantoms (e.g., n-gram similarity to nursery rhymes, metrical pattern detection).  
          -   Philosopher: Design reader studies – do participants *spontaneously* identify these phantoms? Does violating them harm perceived translation quality/fidelity *more* than violating explicit constraints?  
      -   **Output:** Framework for identifying/classifying phantom constraints; evidence of their impact. Changes reception theory – shows translators must infer unstated reader expectations.  
      -   **Risk:** High. Proxies may be poor; reader studies are noisy. **Prioritize only if Year 1 succeeds.**

  5.  **Synthesis: The Formal Constraint Translation Manifesto (Months 20-24)**  
      -   **Why?** Integrates findings. Uses workshop to test frameworks with practitioners.  
      -   **Approach:** Combine Ledger, Lattice, Compatibility, and Phantom insights into:  
          -   A practical heuristic for choosing viable constraint sets.  
          -   A theoretical model of translation as multi-constraint optimization.  
          -   Speculation on how cheap generation changes the translator's role (curator? constraint-system designer?).  
      -   **Output:** White paper + workshop proceedings; refined theoretical position.  

  ### Deprioritized & Why
  *   **Universal Lattice Theory:** A general partial order for *all* constraints is likely intractable and uninformative. Focus on *instance-specific* lattices (Output of #2).
  *   **Grand Unified Degradation Theory:** Predicting fidelity loss for *any* constraint combination is AI-complete. Focus on *patterns* and *heuristics* from specific mappings (#1, #2, #3).
  *   **Exhaustive Phantom Catalog:** An infinite regress. Focus on *detection methods* and *impact validation* for key examples (#4).

  ### Assessment of Your Notions
  1.  **Constraint Lattice:** **A Real (but Contextual) Object.** The partial order exists *for a specific source text and defined constraint set*. Its structure and the degradation across it are empirical questions – your core Year 1 work. Not a rebranding.
  2.  **Phantom Constraints:** **A Genuinely Novel Theoretical Object.** While related to "reception norms" or "genre expectations," framing them as *unstated constraints actively shaping perceived fidelity/identity* is fresh. Crucial for expanding the theory beyond authorial intent. High potential reward.
  3.  **Sacrifice Ledger:** **A Powerful Rebranding/Operationalization.** The *concept* of trade-offs is ancient. Your contribution is making it **explicit, quantifiable, and systematic** via computation. This is where your project can have immediate impact (#1).

  ### Criteria Recap
  *   **Importance:** Ledger/Lattice/Compatibility advance *translation theory* by providing empirical foundations for trade-offs. Phantoms advance *reception theory*. All aim to change *practice* by making constraints tools, not just curiosities.
  *   **Tractability:** Ledger (#1) is most tractable (tools exist, needs your fidelity definitions). Lattice (#2) & Compatibility (#3) need #1's output but leverage computation uniquely. Phantoms (#4) need everything else and human subjects.
  *   **Movement:** A question moves **up** if: Tool-building (#1) goes faster than expected; compelling early trade-off patterns emerge; philosopher devises robust metric for "carry capacity." Moves **down** if: Defining nuanced fidelity/scoring proves intractable; reader studies for Phantoms are unfeasible within budget.

  This agenda leverages your team’s strengths: the poet’s intuition for what matters, the linguist’s ability to scale exploration, and the philosopher’s skill in formalizing the messy. It starts concrete, builds tools, generates novel data, and only then tackles the deepest (and riskiest) theoretical questions, ensuring you deliver impactful results even if Phantoms remain elusive. Good luck!
