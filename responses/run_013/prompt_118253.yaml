  They've laid out several conceptual frameworks: local vs global constraints, a "constraint lattice" ordering, "phantom constraints" (unspoken reader expectations), and a "sacrifice ledger" for trade-offs. Underneath is a deeper question about measuring constraint incompatibility. They want a prioritized research agenda - what's upstream, tractable, and impactful given their team and tools.

