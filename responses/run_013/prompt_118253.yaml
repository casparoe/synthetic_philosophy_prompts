  Key opportunities: Computational generation/scoring now allows systematic study of what was previously anecdotal. But the poet's intuition is irreplaceable for "phantom constraints" and aesthetic evaluation. The philosopher can formalize what "trade-off" even means.

  Major risks: Mistaking computable proxies (e.g., rhyme density) for literary value. Over-indexing on easy-to-quantify constraints. Underestimating how subjective "phantom constraints" are.

  Their "constraint lattice" is promising but needs operationalizing - perhaps treat preservation as a vector in high-dimensional space rather than a partial order. "Phantom constraints" are genuinely novel but methodologically treacherous - maybe start with reader surveys on canonical examples. "Sacrifice ledger" feels like rebranding translation commentary, though making it algorithmic could be fresh.

