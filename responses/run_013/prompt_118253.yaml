  Proposed agenda phases: First year: Build tools to generate/scored constrained variants; map constraint interactions computationally; prototype "ledger" visualization. Second year: Design experiments on reader perception of phantom constraints; develop incompatibility metrics; refine theory through collaborative translation exercises.

  Prioritization criteria: 1) Enables later work (tool-building first), 2) Leverages computation uniquely, 3) Produces shareable outputs (datasets, visualizations), 4) Avoids subjective quagmires early on.

