  Now, for the translation into ML terms: I can map concepts to regions in embedding space, categorization to nearest-neighbor retrieval, analogy to vector arithmetic like word2vec's king - man + woman = queen, and context-sensitivity to contextual encoders like transformers. That fits neatly, as embeddings capture relational similarities through learned metrics.

