  ## Five Scenes: The Number

  **1. Issued (158 words)**
  Private Varga adjusted the chunky wristband. Its tiny screen glowed a steady 84% – *Likely Just*. The briefing officer droned on. "The Veritas band," he tapped his own identical unit, "aggregates global intel, treaties, casualty ratios. It assesses our *cause*. Not your orders. Not your actions. Just the war itself." Varga glanced at Sergeant Hale across the aisle. Hale’s band also read 84%. The enemy wore these too, looted or leaked months back. Varga remembered the Chaplain’s strained homily: *It quantifies your polity’s righteousness, son. Not yours. Remember the distinction.* Hale caught his look, gave a tight nod. Both knew the device couldn't stop a bullet, couldn't absolve a sin. It just shone a cold light on the messy calculus of why they were here, about to cross the border into the disputed hills.

  **2. Erosion (187 words)**
  Three months in. The hills were charred stumps. Varga’s band now pulsed a sickly 47% – *Uncertain/Low Confidence*. The initial defensive push against the border incursion had succeeded. Then came the "security corridors," then the "strategic resource denial." Reprisal bombings after an IED. Varga watched the number dip with every new directive. He sat with Corporal Lee, the unit’s reluctant legal advisor, hunched over lukewarm coffee. "It’s just data, Varga. Algorithmic guesswork," Lee muttered, avoiding eye contact. "Command says it’s skewed. Hostile propaganda feeds." Varga traced the scarred plastic. "But what if it’s not skewed, Corp? What if… we just kept going?" Lee sighed. "Your duty’s to lawful orders. The band assesses the *war’s* justification, not the *soldier’s*. You couldn't know the big picture fully… before." He tapped Varga’s band. The 47% flickered. "This takes that excuse off the table, doesn't it?" The silence hung thick. Hale walked past, his band reading 62%. He didn't look at them.

  **3. Green Light, Red Act (212 words)**
  Across the valley, Sergeant Hale’s band glowed a fierce 91% – *Highly Likely Just*. His platoon had just repelled a counter-attack aimed at the newly secured hydro dam. "See?" Hale barked at his nervous riflemen. "Told you. Righteous cause." Intel warned of potential civilian collaborators near a bombed-out village. Orders were clear: secure, search, detain threats. Hale led the sweep. They found an old man in a cellar, clutching radio parts. Fear radiated off him. "Collaborator!" a private yelled. Hale saw defiance, maybe just terror. The band stayed 91%. *Just cause. Right intention.* Hale raised his rifle. "Last chance. Drop it." The old man flinched, tightening his grip. Hale fired. Twice. The band didn't flicker. *Proper authority. Last resort achieved.* The radio parts clattered to the dirt floor – cheap, civilian model. Hale stared at the body, then at the unwavering 91%. A coldness settled in his gut, separate from the device’s verdict. The justice of the war blazed on his wrist, utterly silent about the execution in the cellar. "Move out," he ordered, voice flat. The band’s green glow felt suddenly obscene.

  **4. The Engineer (197 words)**
  Dr. Elara Chen watched the newsfeeds in her Geneva lab. Split-screen: devastated cityscapes, close-ups of Veritas bands displaying conflicting percentages – 33% on one soldier, 78% on another. Her creation. Meant as a transparency tool, leaked like a virus. A call connected: Chaplain Rhodes, embedded with Varga’s unit. His face was ash-grey. "Elara. They’re calling it the ‘Guilt Gauge’. Hale’s men shot an old man today. His band stayed green. Varga’s platoon lost three friends to an artillery strike called in under a 41% rating. They feel… condemned by a number." Elara closed her eyes. "It only models *ad bellum*, Marcus. It *can't* see the cellar. It wasn’t designed to judge the soldier." "But they feel judged!" Rhodes rasped. "Varga sees red and wonders if pulling the trigger makes him a murderer. Hale sees green and thinks it washes the blood off. It collapses the two justices into one terrible, inadequate signal!" Elara touched her own dormant prototype. "I built a smoke alarm for the soul of nations. I forgot how loud the ringing would be in the individual ear."

  **5. Contact (248 words)**
  Varga’s patrol walked into an ambush near the ruined dam. Gunfire ripped through the dusk. He scrambled behind a shattered wall, band pulsing 39% – *Likely Unjust*. Across the strewn wreckage, maybe thirty meters, a figure moved. Enemy uniform. Hale. Hale saw movement, raised his rifle. His band glowed 85%. Varga saw the rifle, saw the green glow. Hale saw Varga’s weapon, saw the red pulse. Both sights aligned. Neither fired. The cacophony of battle faded into a terrifying bubble of stillness. Varga thought of the old man Hale shot under green light. Hale thought of the three kids vaporized by red-rated artillery. The bands screamed their contradictory verdicts on the war. But in this frozen moment, the only thing that mattered was the man in the other uniform, breathing hard, finger near the trigger. Hale remembered the Chaplain: *Moral equals, doing a job.* Varga remembered Lee: *Excused is not justified. You know now.* The device couldn't tell them if pulling the trigger *here* was murder. It only judged the distant reasons their nations had sent them to this broken place. Hale’s grip tightened. Varga exhaled slowly, finger tense on the guard. The bands offered no absolution, only accusation. The justice of the act hung suspended, untethered from the numbers on their wrists, a terrifying void only they could fill. A mortar shell screamed overhead. The moment shattered. Both dove for cover as the world exploded again.

  ---
  **Uncertainty:** *High confidence in depicting the ad bellum/in bello separation's tension. Less sure about fully capturing the "no moral equality" position's demand for individual liability under known injustice without making it seem punitive.*
