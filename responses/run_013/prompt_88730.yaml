answer: |-
  ### Procedure for Health Technology Assessment Based on Harsanyi's Aggregation Theorem  
  *Grounding: Harsanyi's theorem requires (1) individual/social preferences satisfy expected-utility axioms, (2) social ordering respects unanimous individual preferences → social welfare = weighted sum of individual utilities. This procedure operationalizes that result while forcing explicit value judgments where the theory is silent.*

  ---

  #### **Step 1: Define the Affected Population**  
  - **Action**: Identify all groups whose utilities are impacted (patients, taxpayers, future patients, caregivers).  
  - **Evidence**: Epidemiological data, budget impact analysis, stakeholder input.  
  - **Judgment Call**: *Who counts?* (e.g., non-citizens? future generations?) **Record rationale** for inclusions/exclusions.  
  - **Passing**: Complete population map with justification.  

  #### **Step 2: Elicit Individual Utilities**  
  - **Action**: Measure utilities for health outcomes under the intervention vs. comparator.  
  - **Evidence**: Preference elicitation (e.g., standard gamble, time trade-off) from:  
    - Patients experiencing the condition.  
    - General public (for taxpayer/societal perspective).  
  - **Judgment Call**: ***Preference Correction*** – **Choose and record**:  
    - **Option A**: Use raw preferences (accepting adaptation/context effects).  
    - **Option B**: "Correct" preferences (e.g., exclude adaptation using disease-specific vignettes).  
  - **Passing**: Utilities for all key outcomes (range: 0–1, where 0 = death, 1 = full health).  

  #### **Step 3: Assign Social Weights**  
  - **Action**: Assign weights to groups reflecting their relative social value.  
  - **Evidence**: None – pure normative choice.  
  - **Judgment Call**: ***Weight Source*** – **Choose and record**:  
    - **Option A**: Equal weights (1 per person).  
    - **Option B**: Weights set by democratic deliberation (e.g., citizen jury).  
    - **Option C**: Weights favoring disadvantaged groups (e.g., higher weight for low-income patients).  
    *→ **Critical Note**: Unequal weights violate Harsanyi’s neutrality if not unanimously justified. Priority to the worse off is axiomatically incompatible.*  
  - **Passing**: Explicit weight list with ethical justification.  

  #### **Step 4: Model Outcomes Under Uncertainty**  
  - **Action**: Project health outcomes and costs for intervention/comparator.  
  - **Evidence**: Clinical trial data, probabilistic sensitivity analysis (PSA), cost models.  
  - **Judgment Call**: ***Timing of Aggregation*** – **Choose and record**:  
    - **Ex Ante**: Aggregate individual *expected utilities* first (respects risk preferences).  
    - **Ex Post**: Aggregate utilities *after uncertainty resolves* (respects outcome equity).  
  - **Passing**: PSA outputs (e.g., 1,000 simulations of costs/outcomes).  

  #### **Step 5: Compute Social Welfare**  
  - **Action**: Calculate weighted social welfare (SW) for intervention vs. comparator.  
  - **Formula**:  
    - **If Ex Ante (Step 4)**:  
      \( \text{SW} = \sum (\text{Weight}_i \times \text{Expected Utility}_i) \)  
    - **If Ex Post (Step 4)**:  
      \( \text{SW} = \mathbb{E} \left[ \sum (\text{Weight}_i \times \text{Utility}_{i,\text{state}}) \right] \)  
  - **Evidence**: Outputs from Steps 2–4.  
  - **Passing**: SW score (in utils) for each scenario.  

  #### **Step 6: Incorporate Opportunity Costs**  
  - **Action**: Subtract the utility loss from displaced care due to costs.  
  - **Evidence**: Health system cost data; marginal utility of health spending (e.g., £/QALY threshold).  
  - **Formula**:  
    \( \text{Net SW} = \text{SW}_{\text{intervention}} - \text{SW}_{\text{comparator}} - \left( \frac{\text{Cost Difference}}{\text{Marginal Utility of Health Spending}} \right) \)  
  - **Judgment Call**: Value of the threshold (e.g., £20k–£30k/QALY). **Record source**.  
  - **Passing**: Incremental net social welfare (INSW).  

  #### **Step 7: Recommend and Document**  
  - **Action**: Approve if INSW > 0; reject otherwise.  
  - **Evidence**: All prior steps.  
  - **Judgment Call**: **Transparency** – Publish:  
    - All weights, corrections, and aggregation timing.  
    - INSW calculation.  
    - **Limitations**: *"This utilitarian procedure cannot prioritize the worse off without violating its axioms."*  
  - **Passing**: Signed report with dissenting opinions.  

  ---

  ### Applications of the Procedure  

  #### **Proposal 1: High-Cost End-of-Life Therapy**  
  - **Context**: Therapy for 100 terminal patients; adds 4 months life (+0.1 QALY/patient) with severe side effects. Cost: £500,000/patient.  
  - **Run Procedure**:  
    1. **Population**: Patients (n=100), taxpayers (n=1M).  
    2. **Utilities**: Patients: raw utility = 0.6 (due to side effects). Public: values life-extension at 0.8.  
       *→ Judgment: Use **raw preferences** (no correction).*  
    3. **Weights**: **Equal weights** (1/patient, 1/taxpayer).  
    4. **Aggregation Timing**: **Ex ante** (patients know risks).  
    5. **SW Calculation**:  
       - Patient gain: \( 100 \times (0.6 \times 0.33 \text{ yrs}) = 19.8 \) QALYs.  
       - Cost: \( £50M / £25\text{k/QALY} = 2,000 \) QALYs lost.  
       - INSW = \( 19.8 - 2,000 = -1,980.2 \) QALYs.  
    6. **Recommendation**: Reject (INSW < 0).  
  - **Defense to Patient Group**: *"Equal weights and uncorrected preferences were used. Costs displaced 100x more health than gained."*  

  #### **Proposal 2: Low-Cost Mass Intervention**  
  - **Context**: Preventive app for 1M people with mild chronic pain; utility gain +0.02/patient. Cost: £10/patient.  
  - **Run Procedure**:  
    1. **Population**: Patients (n=1M), taxpayers (n=1M).  
    2. **Utilities**: Patients: raw utility gain = 0.02. Public: values pain reduction at 0.015.  
       *→ Judgment: Use **raw preferences**.*  
    3. **Weights**: **Equal weights**.  
    4. **Aggregation Timing**: **Ex post** (certain small gain).  
    5. **SW Calculation**:  
       - Patient gain: \( 1\text{M} \times 0.02 = 20,000 \) QALYs.  
       - Cost: \( £10\text{M} / £25\text{k/QALY} = 400 \) QALYs lost.  
       - INSW = \( 20,000 - 400 = 19,600 \) QALYs.  
    6. **Recommendation**: Approve (INSW > 0).  
  - **Defense**: *"Ex post aggregation amplified small gains across many people. Costs were low."*  

  #### **Proposal 3: The Repugnant Result (Deliberate Test Case)**  
  - **Context**: £10M drug for 1,000 healthy wealthy patients to boost utility from 0.95→0.96 for 1 year. Same funds could save 100 poor children from a fatal disease (0→0.8 utility for 50 years).  
  - **Run Procedure**:  
    1. **Population**: Wealthy patients (n=1,000), poor children (n=100), taxpayers (n=1M).  
    2. **Utilities**:   
       - Wealthy: raw utility gain = 0.01.  
       - Children: raw utility gain = 40 QALYs/child (50 yrs × 0.8).  
       *→ Judgment: Use **raw preferences** (no correction).*  
    3. **Weights**: **Equal weights** (1/person).  
    4. **Aggregation Timing**: **Ex ante**.  
    5. **SW Calculation**:  
       - Wealthy gain: \( 1,000 \times 0.01 = 10 \) QALYs.  
       - Children gain (if funded): \( 100 \times 40 = 4,000 \) QALYs.  
       - **Opportunity cost**: £10M displaces \( £10\text{M}/£25\text{k/QALY} = 400 \) QALYs.  
       - INSW (wealthy drug): \( 10 - 400 = -390 \) QALYs.  
       - INSW (children’s treatment): \( 4,000 - 400 = 3,600 \) QALYs.  
    6. **Recommendation**: Reject wealthy drug; approve children’s treatment.  
  - **The Repugnant Twist**: *If the insurer excludes the poor children (Step 1: "only citizens covered"), then:*  
    - Population: Only wealthy patients/taxpayers.  
    - INSW (wealthy drug): \( 10 - 400 = -390 \) → **Still rejected**.  
    - *But if weights favor the wealthy (Step 3: weight=100/wealthy patient):*  
      Wealthy gain: \( 1,000 \times 100 \times 0.01 = 1,000 \) QALYs.  
      INSW = \( 1,000 - 400 = 600 \) QALYs → **Approved**.  

  ##### **Why It’s Repugnant**  
  The procedure approves giving tiny benefits to the wealthy over life-saving care for the poor if:  
  - **Exclusion**: The population definition (Step 1) omits the disadvantaged.  
  - **Elitist Weights**: Weights (Step 3) prioritize the rich.  
  Harsanyi’s axioms *allow* this if weights are unequal.  

  ##### **What the Committee Can Do**  
  1. **Reject the weights**: Override Step 3 with deliberative democracy.  
  2. **Expand the population**: Redefine "affected" in Step 1.  
  3. **Break the procedure**: Use equity weights (violating Harsanyi) and document the breach.  
  *"The procedure cannot value equity without abandoning its axioms. Here, we choose to prioritize the poor and break Harsanyi."*  

  ---

  ### Key Takeaways for the Committee  
  - **Harsanyi’s Limits**:  
    - No priority to the worse off (utilitarian aggregation).  
    - Weights and population scope determine distributive outcomes.  
  - **Defensible Paper Trail**:  
    - **Judgment receipts** required at Steps 1 (population), 2 (preference correction), 3 (weights), 4 (ex ante/ex post).  
    - **Explicit disclaimers** on what the procedure cannot do (e.g., equity).  
  - **Clinician/Lay Language**:  
    - Replace "ex ante" with "using patient risk preferences."  
    - Replace "social welfare" with "total health benefit adjusted for fairness weights."  
  - **Chair’s Goal Achieved**: No black boxes. Every value choice is exposed.
