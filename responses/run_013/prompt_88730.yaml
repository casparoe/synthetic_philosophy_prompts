prompt: |-
  I sit on the value-assessment subcommittee of a regional public health insurer — I'm an analyst in the health economics unit by day, but since my father's application for a treatment was turned down last spring on cost-effectiveness grounds I've become the member who reads the modeling reports line by line and asks the awkward questions — and the chair has told us to stop issuing recommendations as a black box. She wants a written procedure, grounded in the actual theory of how individual preferences are supposed to aggregate into a social ordering, that any one of us can run in an afternoon on a new technology, that leaves a paper trail defensible to a patient group, and that stops pretending the number is neutral. We know the relevant theory is Harsanyi's aggregation theorem — the result that if individual and social preferences each satisfy the expected-utility axioms and the social ordering respects unanimous individual preference, then the social ordering is a weighted sum of individual utilities — and I want the procedure to be an honest operationalization of exactly that, not a generic cost-per-QALY checklist with the theory's name pasted on top of it.

  Please write it as an ordered procedure: the steps to run, what evidence or elicitation each step requires, what counts as passing, and — this is the part the chair will care about — the points where the theorem simply does not determine an answer and a value judgment has to be recorded as such rather than buried inside a spreadsheet cell. In particular I need the procedure to force an explicit decision on at least three things the theorem leaves open: where the weights come from and who is entitled to set them; whether we aggregate each person's expected utility before the uncertainty resolves or aggregate outcomes and then assign utilities to them (our current model quietly does one of these, and the distributive consequences of the two differ, which nobody on the committee realizes); and whether we take patients' reported preferences as they are — adaptation, relative-position concerns and all — or substitute some corrected version that we think they ought to have. It should also state plainly which distributive principles our procedure cannot accommodate without breaking its own axioms; I have a suspicion that giving priority to the worse off is one of them, and if that is right the committee needs to read it in the document rather than discover it when a patient group challenges a decision.

  Then run the procedure end to end on two proposals: a new therapy that adds a handful of months of life for a small group of very ill patients, at high cost and with burdensome side effects; and a low-cost intervention producing a modest improvement for a very large number of people with a chronic but non-life-threatening condition. I also want a third application, deliberately chosen, in which the procedure returns a recommendation I personally find repugnant — I would rather watch it misfire on the page now than have a patient's family watch it misfire later — and for that one, tell me what the procedure cannot do and what the committee's only remaining moves are. Throughout, keep the vocabulary usable by the clinician and the lay member who will not read any of the theory, and mark every step that is a judgment call wearing the costume of a calculation.
reasoning: |-
  We are designing a procedure based on Harsanyi's aggregation theorem. The theorem states that if individual and social preferences satisfy the expected utility axioms and the social ordering respects the Pareto principle (if everyone prefers A to B, then society prefers A to B), then the social welfare function is a weighted sum of individual utilities.

  However, the theorem leaves open several questions, which we must address explicitly:

  1. **Weights**: How are the weights for each individual determined? (This is a value judgment about whose well-being counts more.)
  2. **Timing of Aggregation**: Do we aggregate individual expected utilities (ex ante) or aggregate outcomes and then assign utilities (ex post)? The distributive implications differ.
  3. **Preference Correction**: Do we use individuals' actual preferences (with adaptation, context, etc.) or do we "correct" them to what we think they should prefer?

  Moreover, we must note that Harsanyi's theorem assumes a utilitarian aggregation and does not accommodate giving priority to the worse off (prioritarianism) without violating the axioms.

  We'll write a step-by-step procedure that requires explicit recording of judgments at the points where the theorem does not determine an answer.

  ---

  **Procedure for Health Technology Assessment Based on Harsanyi's Aggregation Theorem**

  **Purpose**: To provide a transparent, step-by-step method for assessing the social value of a health technology by aggregating individual preferences in a way consistent with Harsanyi's aggregation theorem. The procedure requires explicit value judgments at key points and leaves a clear paper trail.

  **Input**: A health technology (intervention) and a defined population (society) affected.

  **Output**: A recommendation (approve/reject) and a record of the value judgments made.

  **Steps**:

  1. **Define the Affected Population**:
     - Identify the groups of individuals whose health would be affected by the technology (both beneficiaries and those who bear the costs, including via opportunity costs). This includes current and future patients and taxpayers.
     - *Evidence required*: Epidemiological data, budget impact analysis, and market data to determine the size and characteristics of the affected groups.
     - *Judgment call*: How far into the future to consider? Which groups are included? (e.g., only patients or also families? only citizens or residents?)

  2. **Elicit Individual Utility Functions**:
     - For each relevant group (e.g., patients with a specific condition, the general public as taxpayers), we must represent their preferences over health outcomes. This is done by constructing a utility function for each group that satisfies the expected utility axioms.
     - *Evidence required*: Preference elicitation studies (e.g., standard gamble, time trade-off, or discrete choice experiments) for the health states relevant to the technology. For the general public, we might use willingness-to-pay studies or representative preference surveys.
     - *Judgment call*: **Preference Correction Decision** — Do we use the elicited preferences as they are (with adaptation, context, etc.) or do we apply a correction (e.g., using a reference set of preferences from the general public, or a 'rational' preference set)? Record the choice and the reason.

  3. **Assign Weights to Groups**:
     - Each group's utility will be multiplied by a weight. The weights reflect the relative social value placed on the well-being of each group.
     - *Evidence required*: None — this is a normative choice. The committee must explicitly set the weights.
     - *Judgment call*: **Weight Assignment** — Who sets the weights? (The committee? The public via a deliberative process? The government?) What principles guide the weights? (e.g., equal weight per person, higher weight for the worse off? Note: Harsanyi's theorem does not require equal weights, but if weights are unequal, it must be justified and recorded. Also note: giving higher weights to the worse off is a form of prioritarianism which is not consistent with Harsanyi's axioms if it violates the linear aggregation.)

  4. **Model Health Outcomes Under Uncertainty**:
     - For the intervention and comparator, model the distribution of health outcomes for each group, taking into account uncertainty (e.g., via probabilistic sensitivity analysis).
     - *Evidence required*: Clinical trial data, observational studies, and a decision-analytic model (e.g., Markov model) that projects outcomes (life years, quality of life, side effects) and costs over the relevant time horizon.

  5. **Choose Timing of Aggregation**:
     - Decide whether to aggregate utilities before the uncertainty resolves (ex ante) or after (ex post).
     - *Ex ante*: Compute each individual's expected utility (over possible outcomes) and then aggregate (sum of weighted expected utilities).
     - *Ex post*: For each possible outcome (state of the world), aggregate the utilities of individuals in that state (sum of weighted utilities) and then take the expectation over states.
     - *Evidence required*: None — this is a theoretical choice with distributive implications.
     - *Judgment call*: **Timing of Aggregation** — Choose either ex ante or ex post. Record the reason. (Note: Ex ante is consistent with Harsanyi's original setup. Ex post might be chosen if we care about actual outcomes rather than individual risk attitudes.)

  6. **Compute Social Welfare**:
     - Based on the choice in Step 5:
       - If **ex ante**: For each group, compute the expected utility (EU) for the intervention and the comparator. Then compute the weighted sum: Social Welfare = Σ [weight_group * EU_group].
       - If **ex post**: For each state of the world (e.g., each iteration in a probabilistic model), compute the utility for each group in that state. Then aggregate in that state: State Social Welfare = Σ [weight_group * utility_group(state)]. Then take the expectation over states.
     - *Evidence required*: Output from the model (Step 4) and the utility functions (Step 2).

  7. **Compare and Include Costs**:
     - The social welfare computed in Step 6 is in utility units. We must also account for resource costs (so that we can compare the net benefit).
     - Convert costs into utility terms by estimating the marginal utility of money. This requires knowing how much utility is lost by the taxpayers (or whoever bears the cost) when resources are used.
     - *Evidence required*: Estimate of the marginal utility of money (e.g., from income elasticity of well-being, or from a health opportunity cost if using a health budget constraint). This is typically done by estimating the cost per unit of health forgone elsewhere (e.g., using the threshold from the health budget).
     - *Judgment call*: How to value the opportunity cost? (e.g., using a fixed cost per QALY threshold? If so, what threshold and why?) Record the threshold and its source.

  8. **Net Social Welfare Calculation**:
     - Compute the incremental net social welfare (INSW) of the intervention versus the comparator:
       - INSW = [Social Welfare(intervention) - Social Welfare(comparator)] - [Cost(intervention) - Cost(comparator)] * marginal utility of money
     - *Passing condition*: If INSW > 0, then the intervention is recommended; otherwise, it is not.

  9. **Sensitivity Analysis**:
     - Test the robustness of the result to key uncertainties (parameter uncertainty) and to the value judgments (especially weights, preference correction, and timing of aggregation).
     - *Evidence required*: Results of probabilistic sensitivity analysis and scenario analyses.

  10. **Documentation and Reporting**:
      - Prepare a report that includes:
          - The evidence used (with sources).
          - The value judgments made (Steps 2, 3, 5, and 7) and who made them (committee, public, etc.).
          - The net social welfare and the recommendation.
          - A clear statement about the limitations: e.g., "This procedure uses a utilitarian aggregation and therefore cannot give extra priority to the worse off. If the committee wishes to incorporate such principles, a different framework would be required."

