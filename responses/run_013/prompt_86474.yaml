prompt: |-
  I'm in a metaphysics-of-science reading group and we've just wrapped the block on laws of nature — the Humean best-system picture on one side, and on the other the view that a law is a primitive relation of necessitation holding between universals, something over and above the regularities. I said I'd bring in an objection of my own to the Humean side, and I've ended up with an arguement that either lands cleanly or refutes itself, and I honestly can't tell which, because when I follow it through it seems to take out the anti-Humean as well. I'd like you to act as a philosopher of science who has taught this debate many times and knows what every move costs, and help me work out what's gone wrong.

  Here it is, tidied up:
  (1) Laws explain their instances. That this particular copper rod lengthened when heated is explained, at least partly, by the law of thermal expansion.
  (2) Nothing can explain a fact that it isn't independent of. A fact can't be its own explanans, and you can't explain something by citing it.
  (3) On the Humean picture, the law of thermal expansion just is the regularity that heated copper rods lengthen — a generalisation over the very instances we wanted explained.
  (4) A generalisation over some facts can't be what explains those facts. Citing the fact that all heated rods lengthen to explain why this one lengthened just re-cites the thing to be explained, plus all the others.
  (5) So Humean laws can't explain their instances.
  (6) But they do (1). So Humeanism is false: the law must be something over and above the regularities, a relation of necessitation between universals, and that relation is what does the explaining.
  (7) Now ask the same question about the necessitation relation. That N(F,G) obtains is a contingent fact — that's the whole point of it being a relation between universals rather than a logical truth. By (2) it needs an explanans it's independent of. Either there is none, in which case it's a brute fact, which is just the sort of thing (2) was supposed to rule out; or it's explained by some further necessitation relation, which is explained by a further one, and so on up.
  (8) So the demand that killed the Humean kills the necessitarian too, and no account of lawhood survives it.
  (9) Therefore either (1) or (2) is false: either laws don't explain their instances, or explaining something doesn't require being independent of it.

  What I'd most like to keep is (1) — I definately think it's a datum that laws explain, and any view that gives it up has lost the plot. (2) I'd part with more easily, but it doesn't feel like something I can just drop without saying what replaces it. Take your time with this one, and start by sketching what each of the main positions — Humean best-system, contingent necessitation between universals, the dispositionalist/necessitarian line on which laws are necessary, and the deflationary view on which laws are just useful summaries that don't explain anything — would say about the explanatory role of laws, before you commit to a diagnosis. Then tell me which premise or step I should give up, why it looked fine, and what it costs: what I lose, and what the view has to say instead. Please write your answer in British English, and don't worry about citing chapter and verse — I want the argument diagnosed, not a reading list.
reasoning: |-
  Okay, let me tackle this user's argument step by step. They've presented a clever dilemma that seems to undermine both Humean and anti-Humean accounts of laws by targeting explanatory independence. The core tension is between the intuition that laws explain their instances (premise 1) and the principle that explanations require independence (premise 2).

  First, I need to map how different positions would respond. The Humean best-system account (like Lewis's) would likely reject premise 4's claim that generalisations can't explain instances. They'd argue that laws explain precisely by systematising patterns - the explanatory work comes from the law's role in the overall best system, not from being metaphysically distinct. For them, citing a law isn't "re-citing" the instances but providing a unifying framework.

  The Armstrong/Dretske/Tooley contingent necessitation view faces the regress problem the user identifies. If N(F,G) is itself contingent, what explains its holding? They might bite the bullet and accept brute facts at the fundamental level, but this contradicts premise 2's strict independence requirement. Alternatively, they could claim N(F,G) explains instances without itself needing explanation - but that seems ad hoc after using premise 2 against Humeanism.

  Dispositional essentialists (like Ellis or Bird) have an interesting move: they make laws necessary by grounding them in essences. So N(F,G) isn't contingent - it holds in all possible worlds where F exists. This blocks the regress because necessary truths don't require further explanation. But it comes at the cost of making all laws metaphysically necessary, which clashes with scientific practice where we discover laws contingently.

  The deflationary view (van Fraassen-style) would reject premise 1 outright - laws don't genuinely explain, they're just predictive tools. But as the user notes, this abandons a central intuition about science.

  Looking at the user's concerns: they strongly want to preserve explanatory power (premise 1) and are open to modifying premise 2. The key flaw seems to be premise 4 - it assumes Humean laws are nothing but the instances, but Humeans can deny this. The "best system" isn't reducible to individual instances; it's an emergent, optimised summary that gains explanatory power through its systemic features. When we cite the law, we're not listing instances but invoking a higher-order pattern.

  For the anti-Humean, the contingent necessitation model is indeed vulnerable to the regress objection. But dispositional essentialism offers a coherent alternative that satisfies both premises by making laws necessary. The cost is accepting modality in nature's fabric - something Humeans reject. 

  The user might compromise on premise 2: allow that some explanations can be non-circular without full independence if there's asymmetric dependence. Laws could explain instances without being wholly distinct if the explanation direction runs one way. This preserves explanation while avoiding regress, though it requires careful handling of metaphysical dependence.

  In conclusion, the cleanest resolution is to challenge premise 4's characterisation of Humean laws while recognising that contingent necessitation faces genuine problems. Dispositional essentialism survives by necessity, and modifying premise 2 offers another path - but with trade-offs about modality or explanatory structure.
answer: |-
  Right, let's dissect this properly. This is a sharp argument – precisely the sort that reveals why the laws debate remains live after decades. You've hit on a genuine tension. I'll map the terrain as requested, then diagnose where the pressure points are.

  **How the Main Positions Handle Explanation:**
  1. **Humean Best-System (Lewis, Loewer):** Laws *do* explain their instances, but the explanation is *systemic* and *pragmatic*. The law (as part of the best system) provides the most efficient, informative summary of the vast mosaic of particular facts. Explaining the lengthening rod by the law isn't citing the *very same fact* redundantly; it's placing that particular fact within the most cohesive, simple, and informative framework describing the entire world-history. The explanation lies in the *organisation* and *projectibility* the system provides, not in a metaphysically distinct entity. They reject premise (4).
  2. **Contingent Necessitation (Armstrong, Dretske, Tooley):** Laws (N(F,G)) are primitive, contingent relations between universals. They *directly* explain their instances by *making them necessary*. That N(HeatedCopper, Lengthens) obtains is why *this* heated copper rod *had* to lengthen. The relation itself is brute – it doesn't (and cannot) have a further explanation without regress (as you note). They accept (1), (2), (3), (4), (5), and (6), but bite the bullet on (7): the fundamental N-relations *are* brute facts. Their explanatory power is foundational.
  3. **Necessitarian/Dispositional Essentialism (Ellis, Bird, Mumford):** Laws are metaphysically necessary, grounded in the essential natures (dispositions/powers) of properties. That heated copper *must* lengthen is part of what it *is* to be copper and to be heated. Explanation here is grounded in essence: the instance happens *because* it's in the nature of the relevant properties to manifest that way. Crucially, **N(F,G) isn't contingent** – it holds in all possible worlds where F and G exist. This blocks your regress in (7) because the necessitation doesn't *need* a contingent explanans; it's necessary. They accept (1), (2) (interpreted carefully), and reject the contingency in (7).
  4. **Deflationary/Non-Explanatory (e.g., van Fraassen, some pragmatists):** Laws are merely highly useful descriptions or inference tickets. They don't *genuinely explain* in a deep metaphysical sense; they help us predict, systematise, and answer certain 'why'-questions pragmatically. They reject (1) outright. The lengthening rod is explained by its *particular* antecedent conditions and the *non-nomic* regularities of the world; citing the 'law' is just shorthand.

  **Diagnosis of Your Argument:**

  Your argument is powerful because it exposes a genuine challenge: **the tension between the demand for explanation and the demand for non-circularity/metaphysical grounding.** It successfully shows that a simplistic reading of both Humeanism and contingent necessitarianism runs into trouble.

  **The Core Problem:** Your argument fatally **overgeneralises Premise (2) - "Nothing can explain a fact that it isn't independent of"** – when applied to fundamental laws or metaphysical grounds.

  1.  **Against Contingent Necessitation:** Your (7) is spot-on for *this specific version* of anti-Humeanism. If N(F,G) is genuinely *contingent* and fundamental, then by (2), it demands an explanation it cannot have without regress. Armstrongians *must* accept that fundamental N-relations are brute explainers. They deny your regress is vicious; it stops at the fundamental contingent facts about universals. **The cost:** Brute, contingent modal relations. Many find this ontologically costly and unsatisfying.
  2.  **Against Humeanism:** Your (4) ("A generalisation over some facts can't be what explains those facts") is the weak link **when applied to the *best system* interpretation**. Humeans don't claim the law *is identical to* the mere conjunction of instances ("All these rods lengthened"). The law is the *optimally systematised expression* of that regularity within the broader context of *all* phenomena. The explanation doesn't come from citing the instances *again*; it comes from citing the *systematisation* – showing how this instance fits into the simplest, strongest, most informative summary of the entire world. The explanans (the law-as-system) is *metaphysically dependent* on the instances (the mosaic), but it is *conceptually and explanatorily distinct*. It provides understanding and unification the raw list of instances does not. **The cost:** Explanation becomes pragmatic/systemic/global rather than grounded in local, metaphysically robust "oomph". It struggles with explaining *why the regularity holds in the first place*.
  3.  **The Overgeneralisation:** Premise (2), strictly applied, is **self-defeating for *any* fundamental explanation.** Consider:
      *   Why are the fundamental particles the way they are? (Brute fact or regress).
      *   Why do these fundamental properties have these specific causal powers? (Brute fact or regress).
      *   Why does logic hold? (Brute fact or regress).
      *   Why is there something rather than nothing? (Brute fact or...?).

      **Any fundamental metaphysical posit – Humean mosaic, N-relations, essential natures – will, at bottom, be a brute fact *relative to its explanatory framework*.** Demanding that *everything*, including the fundamental grounds of explanation themselves, must be explained by something *else* independent leads to infinite regress or contradiction. Explanation has to stop somewhere. Premise (2) needs qualification.

  **What to Give Up & The Costs:**

  You rightly want to keep (1). The best move is to **reject the *unqualified* version of Premise (2)**. Explanation requires *non-circularity* and often *asymmetry*, but **fundamental explainers need not be "independent" in the strong sense of being metaphysically separable or requiring a *further* distinct explanans.**

  *   **Why it looked fine:** (2) seems intuitive for non-fundamental cases (you can't explain the cup smashing by *just* citing that it smashed). We naturally extend this intuition upwards. But it founders on the bedrock.
  *   **What replaces it:** A principle like: **"Explanation requires that the explanans provides understanding of the explanandum that isn't trivially contained within a simple restatement of it, and for non-fundamental facts, the explanans should be metaphysically or explanatorily prior."**
      *   For **Humeans:** The law (the systematisation) provides understanding (unification, projectibility) that the raw list of instances does not. The law is explanatorily prior *to the instance* even if metaphysically posterior *to the mosaic*.
      *   For **Contingent Necessitarians:** N(F,G) is metaphysically prior to the instances and makes them necessary, providing a distinct kind of modal understanding. It's brute but fundamental.
      *   For **Necessitarians/Dispositionalists:** The essence/power is metaphysically prior *and* necessary. The explanation is grounded in what the thing fundamentally *is*. N(F,G) isn't contingent, so (7)'s regress is blocked. **Cost:** Radical necessity – all laws become metaphysically necessary. This clashes with the strong intuition that laws are contingent discoveries.
  *   **What you lose:** The hope for a perfectly satisfying, non-brute, non-circular explanation *all the way down*. You have to accept *some* form of fundamentality – either brute contingent facts (Humeanism, Armstrong), brute necessary facts (Dispositionalism), or a pragmatic stopping point (Humeanism again).

  **Conclusion & Recommendation:**

  Your argument successfully exposes the **bruteness problem** inherent in *any* account of fundamental laws. It doesn't refute itself, but it shows that premise (2), as stated, is **too strong to be universally applicable**; it leads to an explanatory nihilism where *nothing* fundamental can explain anything.

  *   **Give up the *unqualified* version of (2).** Allow that fundamental explainers can be brute relative to the framework they ground.
  *   **Clarify the nature of explanation.** Different accounts offer different *kinds* of explanation (systemic unification, modal necessitation, essential grounding). Your premise (1) is compatible with all of them, but they interpret "explain" differently.
  *   **The cost of keeping (1):** Whichever account you choose (Humean, Contingent Necessitation, Dispositional Necessitation), you must accept *some* cost: pragmatism/global dependence (Humean), brute contingent modality (Armstrong), or radical necessity (Dispositionalism). There's no cost-free solution that perfectly satisfies all intuitions.

  Your argument doesn't take out all contenders equally. It decisively **weakens Contingent Necessitation** by highlighting its brute contingency. It **challenges Humeanism** by questioning the *explanatory force* of systematisation (though Humeans have a strong rebuttal). It **leaves Dispositional Necessitarianism relatively unscathed** *if* you accept its core tenets (though its cost is high). Ultimately, the choice depends on which cost you find most palatable: brute facts (Humean/Armstrong), or necessary laws (Dispositionalist). The datum (1) that laws explain survives, but *how* they explain remains deeply contested.
