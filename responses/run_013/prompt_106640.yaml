  First, I recall the user's argument with Dana. Dana thinks Rand opposed sacrificial altruism as moral duty but allowed generosity to loved ones as self-expression. The user disagrees, feeling Rand rejected service instincts entirely. The toast must navigate this without sounding false to either side.

  Key points: Avoid phrases like "sacrifice" or "give the world." Focus on Theo's values. Priya's work in hospice shouldn't be framed as charity but as chosen passion. Her family's warmth needs acknowledgment without implying obligation. 

  Structure the toast: Start with a light story to warm up. Highlight their traits—Theo's conviction, Priya's compassion—as expressions of their core values. Emphasize mutual respect for each other's principles. Frame their love as a chosen value exchange, not loss of self. 

  Deeper needs: The user wants unity without compromising Theo's identity or offending Priya's family. They need authenticity, not platitudes. The toast must feel personal yet philosophical, avoiding jargon. 

  Final approach: Use Dana's interpretation. Show Theo's love as rational self-interest, Priya's care as her authentic choice. Celebrate their union as a meeting of values, not surrender. Keep it warm, concise, and champagne-ready.
answer: |-
  Here’s a toast that threads the needle – warm, authentic to Theo, respectful to Priya’s world, and philosophically coherent for the Objectivists. It leans into Dana’s interpretation: **Theo’s love for Priya is the ultimate expression of his self-interest and values, not a sacrifice.**

  **(Clink glass)** Okay, everyone. Deep breath. For those who don’t know me, I’m Theo’s sibling, [Your Name]. And like all of you, I’m incredibly happy to be here celebrating Theo and Priya.

  Theo… you’ve always been someone who knows exactly what you value. You’ve built your life, your career, your *mind* around what matters deeply to you. You don’t follow the crowd; you follow your own clear-eyed vision of what’s important. That’s one of the things I’ve always admired about you – that fierce conviction.

  And Priya… watching you with Theo has been… illuminating. You see him, truly see him, and you value that clarity in him, just as he values the incredible strength and purpose he sees in you. Because let’s be honest, Priya: dedicating your life to walking alongside people in their most vulnerable moments? That takes a different kind of fierce conviction. It takes profound strength, empathy, and a deep understanding of human dignity. It’s not a duty for you; it’s a calling. It’s *who you are*.

  That’s the magic of these two. Theo, you look at Priya and you see someone whose strength, whose compassion, whose very *being* aligns perfectly with your highest values. Being with her isn’t giving something up; it’s gaining everything. She’s not someone you sacrifice *for*; she’s someone you choose, every single day, because her presence in your life makes your world brighter, deeper, and more profoundly *yours*.

  And Priya, you look at Theo and you see that unwavering clarity, that commitment to his own path. You see someone who respects your strength enough to never ask you to be anything less than exactly who you are. Someone who loves you *for* your dedication, not in spite of it.

  Their love isn’t about losing themselves. It’s about finding in each other a perfect complement to their own deepest selves. It’s about two fiercely independent people choosing to build something incredible *together* because it makes each of their individual lives immeasurably richer. It’s a partnership built on mutual admiration, profound respect, and the shared joy of pursuing what they value most.

  So, Theo and Priya: Here’s to you. To the brilliant clarity you see in each other. To the strength you admire in each other. To the profound respect you hold for each other’s chosen paths. To the incredible partnership you’ve built, not on sacrifice, but on the unwavering belief that together, you create a world far greater than the sum of its parts. May your life together be a constant, joyful pursuit of everything you each value most.

  Cheers!

  **Why This Works:**

  1.  **Avoids Sacrifice Altogether:** No mention of "giving the world," "doing anything," or "sacrificing." The focus is on *gain*, *value*, and *enrichment*.
  2.  **Frames Priya's Work Authentically (For Both Sides):** It describes her work as "strength," "conviction," "calling," "purpose," "understanding human dignity." These are virtues an Objectivist *can* admire – it's *her* chosen value, pursued with integrity. For her family, it acknowledges the nobility of her work without framing it as "charity" or "duty."
  3.  **Centers Theo's Choice and Values:** Key phrases: "aligns perfectly with your highest values," "gaining everything," "choose... because her presence... makes your world... more profoundly *yours*," "pursuing what they value most." This is pure Dana-interpretation Rand: Priya is Theo's *selfish* value.
  4.  **Highlights Mutual Respect:** "Respects your strength enough to never ask you to be anything less," "mutual admiration, profound respect." This speaks to both families – Objectivists see the rational appreciation of virtue; Priya's family sees deep love and support.
  5.  **Focuses on the Partnership:** "Building something incredible *together*," "partnership," "complement to their own deepest selves." It celebrates the union as a rational, value-driven choice that benefits both individuals immensely.
  6.  **Avoids Randian Jargon & Platitudes:** No "self-interest," "altruism," or slogans. The underlying philosophy is present in the *framing*, not the vocabulary. It avoids "warm fuzzies" that deny Theo's core beliefs (e.g., "melding into one," "losing oneself in love").
  7.  **Respects Both Worlds:** Priya's family hears warmth, admiration for her character and work, and a celebration of partnership. Theo's friends hear a toast that understands Theo's perspective: Priya is his ultimate *selfish* value, chosen rationally, enhancing his life without demanding self-abnegation.
  8.  **Picks Dana's Side:** It explicitly rejects the sacrificial framing ("not about losing themselves," "not a duty," "not sacrifice") and embraces the idea that loving Priya is Theo's greatest act of self-interest and value-affirmation.

  **Delivery Tip:** Speak warmly and sincerely. Emphasize words like "clarity," "strength," "conviction," "value," "respect," "chosen," "together," and "richer." Let the genuine affection for both Theo and Priya shine through. Good luck!
