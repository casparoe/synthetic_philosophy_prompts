  Here’s a focused prospectus draft prioritizing conceptual clarity, feasibility, and your core tension around leakage/counterfactuals. It stays within 2 pages by trimming measurability to a single paragraph (expandable if space allows).

  ---

  # Prospectus: Can Harm Be Offset? Counterfactuals and Leakage in "Earning to Give" Ethics

  ## 1. Problem & Gap
  The "Earning to Give" (ETG) strategy within effective altruism typically assumes relatively "harmless" high-earning jobs. A more controversial variant involves taking *intrinsically harmful jobs* (e.g., fossil fuels, tobacco lobbying) with the intent to donate a large portion of income to offset harm. Proponents argue the donation's good cancels the job's harm, akin to carbon offsetting. However, this analogy remains critically underexplored, particularly regarding **counterfactual impact and leakage**. While complicity literature addresses moral taint, it often neglects the precise causal chain and offsetting *mechanism*, especially the critical tension: **if you vacate a harmful job, will someone else fill it (leakage, negating harm reduction), or is your presence uniquely causal?** This project tackles that gap: *Under what conditions, if any, can a donation genuinely offset the harm caused by taking a harmful job?*

  ## 2. Research Question & Core Tension
  **Central Question:** What are the necessary and sufficient conditions for a donation to ethically offset the net harm caused by an individual taking a harmful job, considering counterfactuals and leakage?

  **The Leakage Tension (Project Core):**
  *   **Scenario A (Leakage Negates Offset):** If you refuse the harmful job, an equally harmful agent immediately fills it. Your action causes no *additional* harm; the baseline harm occurs regardless. *Offsetting seems easier:* your donation is pure net good. But if *every* agent reasoned this way, harmful industries would persist unchallenged.
  *   **Scenario B (No Leakage, You Cause Harm):** The job exists *only because you take it* (or the harm scales with your specific actions). Refusing the job prevents the harm. Here, the donation must genuinely *counterbalance* the specific harm you cause. This demands a robust offsetting relation.
  *   **Tension:** The plausibility of offsetting hinges critically on the counterfactual (would harm occur without *me*?), yet this same counterfactual determines whether one bears responsibility for the harm *at all*. Resolving this tension – clarifying when responsibility attaches and what offsetting requires under different counterfactuals – is the primary intellectual work.

  ## 3. Objectives & Deliverables (Summer Focus)
  1.  **Define Candidate Offset Criteria:** Systematize conditions inspired by carbon offsetting (e.g., **Additionality** - would the good funded by the donation happen anyway?; **Permanence**; **No Double Counting**; **Specificity** - can money offset non-monetary harm?) and identify job-specific needs (e.g., **Agency/Causal Responsibility**).
  2.  **Map the Counterfactual Landscape:** Develop a typology of counterfactual scenarios for harmful jobs (e.g., pure fungibility, role-specific harm, marginal impact, job creation).
  3.  **Test Criteria with Toy Cases:** Construct stylized, contrasting hypotheticals where criteria clash, focusing on the leakage tension:
      *   *Case 1 (High Leakage):* Junior fossil fuel trader; role is highly fungible.
      *   *Case 2 (Low Leakage):* Unique skillset developing novel fossil extraction tech.
      *   *Case 3 (Probabilistic Harm/Good):* Lobbyist securing a harmful policy (high-certainty harm) vs. funding a low-probability high-impact charity.
  4.  **Propose a Resolution:** Argue for which criteria are necessary/sufficient under different counterfactual scenarios, resolving the leakage tension. Deliver a clear conditional framework: *"Offsetting is viable only if condition X holds regarding counterfactual impact, and criteria Y and Z are met for the donation."*
  5.  **Preliminary Insight on Measurability Bias (Time-Permitting):** Briefly explore whether the asymmetry in measuring diffuse harms vs. countable donated good creates a rational heuristic or a problematic bias in offsetting judgments under uncertainty.

  ## 4. Methodology
  *   **Purely Conceptual & Analytical:** Leveraging tools from moral philosophy (causation, counterfactuals, complicity), economics (marginal analysis), and effective altruism theory.
  *   **Core Scaffold:** Carbon offsetting criteria provide the initial structure. The analysis will explicitly identify where the analogy holds and where it breaks fundamentally (e.g., direct agency vs. purchasing an offset).
  *   **Case-Based Testing:** Develop and rigorously analyze 3-5 targeted toy cases designed to stress-test criteria and illuminate the leakage/counterfactual core. Focus on deriving clear verdicts and identifying criteria conflicts.

  ## 5. Feasibility & Scope Management (Summer Realism)
  *   **Focus:** This project is **feasible** for a summer by prioritizing the **core leakage/counterfactual tension and offset criteria analysis** (Objectives 1-4). This is the novel contribution.
  *   **Measurability:** The bias point (Obj. 5) is acknowledged but **relegated to a single concluding paragraph** unless significant space allows deeper exploration. *It can be cut entirely if necessary without undermining the core.*
  *   **No Empirics:** Conceptual analysis of toy cases keeps scope tight. No surveys or data collection.
  *   **Success Defined:** Deliverables 1-4 constitute success: a clear conditional framework + illustrative cases showing clear failure (e.g., offset fails under pure fungibility without additionality) and clear success (e.g., under specific low-leakage, high-additionality conditions) + resolution of the leakage tension.
  *   **Failure Avoided:** By constructing contrasting cases where plausible criteria *do* conflict (e.g., additionality vs. specificity), we ensure the analysis isn't trivial. Focusing on the core tension provides the required depth.

  ## 6. Significance & Expected Contribution
  This project provides the first rigorous ethical framework for evaluating the most controversial form of ETG. It moves beyond broad complicity debates by:
  *   Pinpointing the critical role of counterfactuals and leakage.
  *   Defining precise conditions for valid harm offsetting.
  *   Resolving the core tension where leakage seemingly both enables and undermines offsetting.
  *   Offering practical guidance for individuals considering harmful roles for philanthropic reasons.
  The output will be a foundation for future work integrating complicity concerns and empirical job-market dynamics.

  ---
  **Key Strengths for Your Application:**

  1.  **Sharp Focus:** Centers on your unique insight (leakage tension) and a clear, answerable question.
  2.  **Feasibility:** Explicit scope management (toy cases, conceptual, measurability as optional).
  3.  **Novelty:** Clearly distinguishes from complicity literature by focusing on the offsetting *mechanism* and counterfactuals.
  4.  **Methodology Fit:** Pure conceptual analysis is perfect for the scope/budget.
  5.  **Clear Deliverables:** Framework + cases showing success/failure + leakage resolution.
  6.  **Impact Potential:** Addresses a live debate in EA/ethics with practical implications.

  **Before submitting, ensure:**

  1.  The **"So What?"** is crystal clear in the abstract/intro (Why does resolving this specific tension matter?).
  2.  The **method section** explicitly names the philosophical tools (e.g., causal models, counterfactual reasoning) for reviewer comfort.
  3.  The **title** is as punchy as possible within academic norms.
