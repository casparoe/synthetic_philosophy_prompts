  The polished oak table felt cool under Elara’s palms. Across its expanse, the five members of the Stream Allocation Committee leaned forward, their expressions a mix of impatience and faintly patronizing curiosity. Chairman Vance tapped the report before him.

  “Dr. Voss, your analysis confirms the Aptitude Index heritability coefficient at 0.85. Impressive precision. The figure speaks for itself, wouldn’t you agree? It validates the Stream’s predictive power.” His smile didn’t reach his eyes.

  Elara took a steadying breath. “Chairman Vance, the coefficient *is* accurate, given the data. But what it ‘speaks to’ isn’t what you assume.”

  Councilor Thorne, known for his blunt pragmatism, cut in. “Assume? It’s arithmetic, Doctor. 0.85. Meaning eighty-five percent of the difference in kids’ scores is down to their genes. Biology. Destiny, if you like. The system sorts efficiently. What’s to misunderstand?” Murmurs of agreement rippled down the table.

  “It’s not about *destiny*, Councilor,” Elara countered, her voice tight. “It’s about *variance*. The heritability ratio tells us what *proportion* of the *observed differences* in a *specific population*, under *specific conditions*, can be attributed to genetic variation.”

  “Differences, genes, eighty-five percent.” Thorne shrugged. “Seems clear. Mostly genetic.”

  “No,” Elara pressed, leaning forward. “Think of *why* there’s so little other variance. Every child gets Nutri-Paste Standard. Every child attends an IDENT school – same curriculum, same teachers via screen, same classroom dimensions. Every child has a standard-issue learning tablet with identical content access. Every home is a Sector-approved unit. We’ve minimized environmental differences to an unprecedented degree.”

  Vance frowned. “We’ve *equalized* opportunity, Doctor. Leveled the playing field. That’s the point.”

  “Exactly!” Elara seized on the word. “You’ve flattened the environment. Squeezed out almost all the variation that environment *could* cause. So, when you look at the differences that *are* left in the Aptitude Index scores – the *variance* – what’s left to explain them? Mostly the genetic differences that *haven’t* been flattened. That’s why the genetic *share* of the variance is high. It’s not that genes suddenly got stronger. It’s that the environmental ‘container’ got shrunk down to almost nothing.”

  Councilor Iris, the developmental psychologist, tilted her head. “You’re saying the high heritability is… an artifact? Of our success in providing equality?”

  “It’s a statistical consequence of extreme environmental uniformity, yes,” Elara said, a flicker of hope rising. “Imagine you have a glass jar full of marbles of different sizes *and* colors. The size variance might be due to both marble type and how they were polished. Now, imagine you only use marbles polished by the same machine, identically. Suddenly, the differences in size you see are *overwhelmingly* due to the original marble type. The polishing variance is gone. That doesn’t mean polishing didn’t matter before, or couldn’t matter again. It just means in *this specific jar*, with *this specific polishing method*, type explains most of the size differences.”

  Thorne snorted. “Marbles? We’re talking children. Futures. The index is eighty-five percent genetic. That’s the fact.”

  “It’s a fact about the *population spread* in *this context*,” Elara insisted, frustration creeping in. “It tells you *nothing* about how fixed an *individual's* score is. It tells you *nothing* about what would happen if the environment *changed*.”

  Vance steepled his fingers. “But Doctor, why would we change it? We’ve achieved near-perfect environmental equality. The system is fair.”

  “Fairness isn’t the point right now,” Elara said, her knuckles whitening. “The point is interpretation. That 0.85 doesn’t mean the Aptitude Index is an immutable genetic trait. If you took these *same children* and put them in a society with wildly varying environments – some malnourished, some with incredible tutors, some traumatized, some enriched – the heritability coefficient for the *same index score* would plummet. Maybe to 0.4 or lower.”

  Silence. Then Councilor Reed, usually quiet, spoke softly. “Why?”

  “Because,” Elara explained, grasping at the opening, “in that unequal world, environmental differences would suddenly account for a huge chunk of the variance in scores. Differences in nutrition alone could cause massive swings in cognitive development. Differences in schooling quality, in home life stability, in access to stimulation… they would all create big variations in outcomes. The *genetic* differences would still be there, but they’d now be competing with massive environmental effects for explaining the overall spread of scores. The genetic *share* of the variance pie would shrink. The trait would appear far *less* heritable and far *more* responsive to environmental intervention.”

  Thorne shook his head, baffled. “But… that’s not relevant. We *don’t* have those variations. We’ve eliminated them. Here, it’s eighty-five percent genetic.”

  “You keep saying ‘it’,” Elara said, her voice dropping, weary. “The trait *isn’t* ‘eighty-five percent genetic’ in some absolute sense. That number is a reflection of *this place*, *this system*. It’s a measure of our environmental control, not a measure of genetic inevitability.”

  Iris looked thoughtful. “So… in a less controlled society, the same child might score very differently?”

  “Exactly!” Elara said, relief washing over her. “Potentially, yes! High heritability here doesn’t mean low potential for change elsewhere. It means the *differences we see* are mostly genetic *because we’ve made everything else the same*.”

  Vance leaned back, a dismissive smile playing on his lips. “Fascinating hypothetical, Doctor. Truly. But it *is* hypothetical. *Here*, in the society we have built, the society that *works*, the Aptitude Index shows overwhelming genetic determination. 0.85. That is the reality we must base our Stream allocations on. The figure confirms the innate hierarchy.”

  Thorne nodded vigorously. “Mostly genetic. That’s the takeaway. Simple.” He closed his copy of her report with a definitive thud.

  Elara looked at their faces – satisfied, certain, utterly closed to the distinction she’d tried so hard to draw. The nuance between the variation in a group and the fate of a single child, between a statistic describing a current state and a prophecy of immutability, had evaporated in the face of that seductively simple number: 0.85. It confirmed their world. It justified the Stream. It rendered individual potential irrelevant. They hadn’t heard a word about the flattened environment, only the amplified echo of genes in the silence they’d created.

  “Yes, Councilor Thorne,” she said, her voice flat, devoid of the passion she’d felt moments before. “In this specific population, under these specific, highly controlled conditions, genetic differences account for approximately 85% of the observed variance in the Aptitude Index scores at age twelve.”

  She gathered her datapad. The discussion, for them, was over. The truth she’d uncovered wasn’t a critique of the system; to them, it was its ultimate validation. The high heritability wasn't a discovery *despite* the uniform environment; it was the precise, predictable, and politically convenient *consequence* of it. They didn't want to understand the difference. They only wanted the number that sounded like destiny.
