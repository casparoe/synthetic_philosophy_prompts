prompt: |-
  I'm a second-year PhD student in philosophy, and over the last year I've become convinced that what makes an act right or wrong has something to do with its consequences, but I keep finding that my gut verdicts about consequences don't form anything like a system once the consequences get hard to trace. A friend of mine has taken to calling this the cluelessness problem and says I should just pick a line and defend it; I'd rather first find out which line I'm actually on. So here is what I think, case by case, as honestly as I can put it. Giving a hundred dollars to a charity that distributes anti-malarial bednets, where the evidence for effectiveness is solid: straightforwardly good, close to obligatory, and I lose no sleep over the fact that I can't trace which child gets the net. Letting a car merge in front of me in traffic: a small good, and I don't think its goodness consists in whatever the ripples turn out to be; if the four-second delay makes the driver miss a light and that reshapes their life, that doesn't make my courtesy better or worse. Voting in a national election: worth doing, and I'd think slightly less of a friend who stayed home out of pure indifference, even though the chance my vote is decisive is negligible and the long-run effects of the election are anybody's guess. Skipping a bottle in the recycling bin: nothing at all, no guilt, not worth a second thought, though I do think a society that stopped recycling would be in trouble. Buying a five-dollar shirt whose supply chain may or may not involve forced labor: somewhat wrong, and I feel it, even though I can't trace my purchase to any particular harm and my individual causal contribution is as negligible as the bottle's. A friend choosing between a career in pandemic-preparedness policy and one in quantitative finance: clearly should take the first, and I'd argue with them for an hour, though neither of us can trace how either career plays out over forty years. A friend asking whether to have a child: I refuse to answer in these terms at all, the frame seems to break, and I'd be embarrassed to run expected-value arithmetic on it. A physicist in the mid-1920s deciding whether to go into nuclear physics: not blameworthy for what the field later enabled, and not because the weapons were fine, but because he couldn't have known. A friend considering going to work on frontier AI: I think they should weigh the tail risks heavily even though nobody can trace how their specific contributions matter, and I don't accept that the absence of a traceable mechanism gets them off the hook.

  The pair I can't square on my own is the bottle and the shirt: both are tiny individual contributions to a large-scale pattern, and I treat one as nothing and the other as a real (if small) wrong, and I suspect that if I explain the difference by saying the shirt makes me complicit, I've stopped giving a consequentialist answer without noticing. The other pair is voting and recycling: same negligible individual effect, opposite verdicts, and I can't tell whether the difference is the size of the stakes conditional on mattering, the fact that voting is a shared practice rather than a private habit, or just sentiment. And I notice that throughout I've been sliding between three different things — how good the act's consequences are, whether the agent is blameworthy, and what the agent had reason to do given what they knew — and I don't know whether that slide is a confusion on my part or a sign that the principle has to split along that seam. The best I've managed on my own is this: an act is right just in case the expected value of the consequences I can foresee, through a mechanism I could describe in advance, is positive. I know that's bad, because it makes voting worthless, the shirt purchase fine, and the AI job a non-issue, all of which I reject.

  What I want from you is a principle, or a small set of candidates, stated precisely enough that I can test it, that gets as many of my verdicts as possible. For each clause, tell me which of my cases motivates it. Tell me which of my verdicts the principle forces me to abandon, and which abandonment is least costly. Tell me what it says about the case I keep going back and forth on: taking a well-paid job at an advertising-technology firm whose product I suspect degrades public discourse in ways nobody can measure, in order to donate half the salary to the bednet charity. Tell me whether the principle has to be split into an axiological part and a decision-guiding part to survive my three-way slide, and whether my verdicts are consistent once it is. Finally, give me its verdicts on two further cases I haven't listed, and name the single case that would most sharply separate the surviving candidates from each other.
reasoning: |-
  Okay, this is a fascinating and deeply nuanced ethical puzzle from a philosophy PhD student. The user is clearly wrestling with the tension between their consequentialist leanings and intuitive moral judgments across varied cases where tracing consequences is problematic. 

  First, I notice the user has done exceptional work laying out their intuitions systematically - this isn't just armchair philosophizing but a rigorous attempt to map their own moral landscape. The frustration with "cluelessness" resonates; it's that moment when abstract ethical theories meet the messy reality of causal chains. 

  The core tension seems to be between three elements: 
  1) Their commitment to consequences mattering 
  2) The practical impossibility of tracing most consequences 
  3) Strong but inconsistent intuitions about culpability (e.g., shirt vs bottle dilemma)

  What's particularly clever is how they've identified parallel cases (voting/recycling, bottle/shirt) that highlight inconsistencies in their own position. The advertising tech job case is especially thorny - it's like a trolley problem for effective altruism.

  I'm struck by how self-aware they are about sliding between consequence-evaluation vs blameworthiness vs decision-guidance. Most grad students would try to force consistency; this one is willing to entertain that the "slide" might be necessary. That's sophisticated philosophical maturity.

  The challenge they pose is deliciously precise: give testable principles that preserve most intuitions, identify which sacrifices are least painful, and provide new test cases. This isn't just "fix my theory" but "help me stress-test my entire moral framework."

  For the bottle/shirt asymmetry, I suspect the distinction lies in the type of harm - direct exploitation vs diffuse environmental impact. But calling it "complicity" does risk abandoning consequentialism, as they rightly worry. Maybe the solution involves expected harm conditional on collective action? 

  On voting vs recycling: the difference might be that voting is essentially expressive while recycling is purely instrumental. Their "shared practice" intuition feels important here - voting has symbolic value beyond causality.

  The physicist vs AI researcher case suggests they care about foreseeable downstream risks. The 1920s physicist couldn't anticipate nukes, but AI risks are actively debated today. This points to a "reasonable foreseeability" criterion.

  For the ad tech job dilemma... oof. Their draft principle would approve it (clear good vs vague harm), but their gut says no. This might require introducing a "participation in harmful systems" factor that pure expected value misses.

  I'll need to formulate principles that:
  - Handle probabilistic expectations
  - Account for collective action problems
  - Distinguish types of causal involvement
  - Preserve their strong intuitions about complicity
  While admitting where sacrifices must be made (probably the bottle case)

  The physicist/AI contrast will be key for testing principles. And I should invent new cases involving historical figures versus contemporary dilemmas to probe the foreseeability element.

  Most importantly, I must honor their methodological request: no hand-waving, precise testable clauses linked to specific cases, and clear tradeoffs. This deserves the kind of response that would make Derek Parfit nod approvingly.
answer: |-
  Your intuitions reveal a sophisticated, pattern-sensitive consequentialism that grapples with causal opacity. Below is a candidate principle structured to capture your core judgments, with explicit tradeoffs and test cases. It combines **expectational consequentialism** with **causal role** and **collective practice** components.

  ---

  ### **Proposed Principle: Contextual Expectational Consequentialism**
  **An act is right iff:**  
  *(1) Its reasonably expectable consequences (given the agent's evidence) are net positive,* **and**  
  *(2) It doesn't participate in a harmful causal mechanism (even probabilistically)* **or**  
  *(3) It sustains a beneficial collective practice essential for large-scale welfare.*  

  **Blameworthiness** depends on whether the agent reasonably foresaw or *should have* foreseen the relevant consequences/mechanisms.

  ---

  ### **Clause Motivations & Case Breakdown**
  | Case                  | Verdict      | Motivating Clause(s)                                     |
  |-----------------------|--------------|----------------------------------------------------------|
  | Charity donation      | Obligatory   | (1) High expected value; traceability irrelevant.        |
  | Letting car merge     | Good         | (1) Symbolic kindness; ripple effects excluded.          |
  | Voting                | Obligatory   | (1) + (3) Low EV but sustains democracy (collective practice). |
  | Recycling bottle      | Neutral      | Fails (1) *and* (3): Negligible EV; not essential as a *personal* act (system relies on mass participation). |
  | Buying exploitative shirt | Wrong     | (2): Participates in harmful supply chain (probabilistic complicity). |
  | Pandemic policy job   | Obligatory   | (1) High expectable value despite long-term opacity.     |
  | Having a child        | Non-evaluable| Excluded: Value incommensurable with consequentialism.   |
  | 1920s physicist       | Not blameworthy | Blame clause: Couldn't foresee harm.                     |
  | Frontier AI job       | Risky/Wrong  | (2) + Blame: Foreseeable tail risks; participates in harmful mechanism. |

  ---

  ### **Forced Abandonments & Cost Analysis**
  - **Must abandon:** Recycling verdict.  
    - *Cost:* Low. Your intuition here is weak ("no guilt"), and the principle explains why: isolated acts in large-scale systems *without* a practice-sustaining role (like voting) are negligible.  
  - **Retained:** All other verdicts, including shirt/voting asymmetry.

  ### **The Ad-Tech Job Case**
  - **Verdict:** Wrong, but not blameworthy if risks are genuinely opaque.  
    - *Why:*  
      - (2) Violated: Participates in a mechanism *plausibly* harmful (ad-tech degrading discourse), even if unmeasurable.  
      - Donation doesn't offset participation in harm (per shirt case).  
      - *But* blame depends on evidence: If harms are speculative, agent may be excused.

  ---

  ### **Handling the Three-Way Slide**
  The principle **splits axiology, decision guidance, and blame**:  
  - **Axiology:** Rightness depends on *actual* causal roles and expectable consequences.  
  - **Decision Guidance:** Agents use *reasonable expectations* (clause 1).  
  - **Blameworthiness:** Hinges on epistemic access to mechanisms (clause 2/3).  
  **Consistency:** Your verdicts cohere once split. E.g., the physicist isn't blamed because he couldn't foresee the mechanism, even if his act was objectively harmful.

  ---

  ### **New Test Cases**
  1. **Case A (Historical):** A 1950s oil executive funding early climate science.  
     - *Principle's Verdict:* Not blameworthy (unforeseeable harm), but act *now* would violate (2).  
  2. **Case B (Current):** Eating beef from a ranch linked to *possible* (not proven) deforestation.  
     - *Verdict:* Less wrong than the shirt. Harm mechanism less direct; if evidence is weak, (2) not triggered.

  ---

  ### **Crucial Separating Case**  
  **"The Precautionary Patent":** *A scientist discovers a technology that could prevent pandemics but also enable bioterrorism. She can patent it (slowing diffusion but controlling use) or open-source it (accelerating access but risking misuse).*  
  - **Candidate 1 (Pure Expectational):** Open-source if expected lives saved > lives lost.  
  - **Candidate 2 (This Principle):** Patent if harmful mechanisms are more controllable (invoking clause 2).  
  - **Your Intuition Test:** If you prioritize controlling harmful mechanisms over net EV, this principle holds; if not, lean expectational.  

  ---

  ### **Why This Captures Your Core**  
  - **Squares shirt/bottle:** Shirt purchase *participates* in exploitation (clause 2); recycling doesn’t trigger (2) or (3).  
  - **Squares voting/recycling:** Voting sustains democracy (clause 3); recycling lacks practice-sustaining role at individual level.  
  - **AI vs physicist:** Foreseeability of harm mechanisms (blame clause) and participation in risky systems (clause 2).  
  - **Ad-tech job:** Participation in *plausible* harm outweighs donation benefits.  

  **Weakness:** Clause (2) risks deontology ("complicity"). To stay consequentialist, ground it in *empirical likelihood* of enabling harm—e.g., buying a shirt *increases demand* for exploitative labor probabilistically. Your intuitions suggest this hybrid is where you live. Refine clause (2) as: *"Act probabilistically enables or reinforces a harmful system with significant expected harm."* Test against the patent case.
