prompt: |-
  I run grounds and pest control for a mid-sized school district — roughly thirty sites, mostly playing fields, hedgerows, and ornamental plantings — and from April through September I field two or three insecticide proposals a week, from the athletic department, from parents worried about ticks or wasps, from our landscaper, from the county health office. I have a budget, a spray license, and about twenty minutes per decision; anything to be applied while children are on site needs the superintendent's signature. I have read a good deal of the rationalist-adjacent literature on wild animal suffering, the replaceability argument, and dust-specks-style debates about aggregation, and none of it has given me anything I can actually run at seven in the morning.

  Please write me a decision procedure — a checklist in prose, the questions in order, what counts as a sufficient answer to each, where it terminates in a no, and where it hands the decision to a person because the question is one of values rather than entomology — for deciding whether to approve a proposed application. It has to preserve the moral structure the philosophical literature actually supports while dropping what a staffer without a philosophy background cannot use, and it has to be candid about which steps are judgment calls dressed up as procedure.

  Two things I want it to take seriously rather than wave at. First, the substitution problem: an application that kills a pest population need not reduce total insect mortality at all, because broad-spectrum sprays typically hit predators and parasitoids harder than the pest, so the pest rebounds, and because whatever replaces it is also alive and also sentient-or-not by whatever standard you have adopted. Second, the fact that the procedure's answer to which invertebrates count — whether a threshold is drawn at some level of neural complexity, or whether the default is precautionary, treating any plausible capacity for pain as counting — is a choice and not an empirical finding, and I want that marked as such in the procedure rather than smuggled into the facts column.

  Then run it on three proposals: a broad-spectrum pyrethroid spray across the stadium field to knock down an ant problem before a tournament; perimeter treatment of a hedgerow and the adjacent classroom wing for ticks, where the county has flagged a Lyme risk; and a request to destroy a wasp nest over a kindergarten entrance that I would rather leave alone. At least one of the three should come out against the answer I would obviously prefer, and you should say so explicitly. Finally, tell me what the procedure cannot do: which decisions it will keep getting wrong, and what would have to turn out to be true about insect sentience for the whole exercise to have been pointless.
reasoning: |-
  Okay, the user runs grounds and pest control for a mid-sized school district with about thirty sites. They're dealing with constant insecticide proposals from various groups—athletic departments, parents, landscapers, county health. They have limited time per decision (about 20 minutes) and need something practical that incorporates moral philosophy without requiring a philosophy background. They've read some rationalist literature but found it impractical for their daily work.

  Their main concerns are two-fold: the substitution problem (where killing pests might not reduce total suffering due to predator impacts and rebounds) and acknowledging that deciding which invertebrates count morally is a value judgment, not a scientific fact. They want a decision procedure that's honest about where judgment calls are needed.

  The user needs a structured checklist that's both ethically sound and operationally feasible. The procedure must explicitly mark value judgments and address ecological ripple effects. They also want it tested on three real-world scenarios where at least one outcome contradicts their initial preference.

  I'll build a decision tree that starts with non-lethal alternatives and escalates only when necessary. Key elements:
  - Front-load harm prevention (screens, sanitation)
  - Require pest identification before any action
  - Explicitly state the "sentience threshold" as a policy choice
  - Calculate expected net impact including substitution effects
  - Include strict criteria for child safety overrides

  For the test cases:
  1. Ant spray for tournament: Should fail (cosmetic issue, high substitution risk)
  2. Tick treatment: Might pass if Lyme risk is validated (medical necessity)
  3. Wasp nest removal: Should pass (imminent hazard) but with notes about relocation attempts

  The procedure's limitations: It'll struggle with complex ecological predictions and false precision in suffering estimates. If insects are completely non-sentient, the entire framework collapses - but that's why the sentience threshold is explicitly marked as a value choice.

  The output will be a clear flowchart-style checklist in prose, with annotations about what's factual vs. judgmental. For each test case, I'll show the decision pathway and explicitly state when it overrides the user's preference (like rejecting the ant spray they'd instinctively approve).
answer: |-
  Here's a pragmatic decision procedure designed for your operational reality, embedding the core philosophical concerns while remaining actionable under time pressure. It explicitly marks value judgments and forces consideration of substitution effects.

  **Grounds & Pest Control Insecticide Application Decision Checklist**

  1.  **Is there an immediate, credible threat to human health or safety?**
      *   *Sufficient Answer:* Verified venom allergy risk (e.g., wasps near allergic individual), observed aggressive swarming, confirmed presence of human disease vector (e.g., ticks with validated Lyme risk *in that specific location*), structural damage posing collapse hazard.
      *   *Insufficient Answer:* General fear, "lots of bugs," nuisance complaints without documented hazard, historical/statistical risk not confirmed *on-site*.
      *   **Termination:** If **YES** and threat cannot be immediately mitigated non-chemically (e.g., exclusion, evacuation), proceed to Step 6 (Safety Override). If **NO**, proceed to Step 2.

  2.  **Can the problem be effectively addressed *right now* with non-lethal methods?**
      *   *Sufficient Answer:* Physical removal (e.g., wasp nest at night into sealed container), exclusion (sealing entry points, screens), sanitation (removing food/water attracting ants), habitat modification (trimming vegetation away from structures/play areas for ticks/wasps), traps (monitoring or mass-trapping for specific pests like yellowjackets).
      *   *Insufficient Answer:* Methods requiring significant time/delay (e.g., "we'll plant repellent herbs next season"), methods demonstrably ineffective for the scale/location (e.g., ultrasonic repellents), methods shifting the problem elsewhere on-site.
      *   **Termination:** If **YES**, implement non-lethal method. Deny spray request. If **NO**, proceed to Step 3.

  3.  **Is the target pest *positively identified*?**
      *   *Sufficient Answer:* Clear photo/video/specimen confirming species, or diagnosis by qualified entomologist (e.g., County Extension).
      *   *Insufficient Answer:* "Ants," "wasps," "ticks" without specificity, descriptions only.
      *   **Termination:** If **NO**, deny request pending identification. If **YES**, proceed to Step 4.

  4.  **Is the proposed insecticide *highly targeted* to the identified pest?**
      *   *Sufficient Answer:* Product label lists the *specific* pest as a primary target, with minimal non-target effects listed (e.g., specific bait for fire ants, IGR for specific flies).
      *   *Insufficient Answer:* Broad-spectrum contact sprays (pyrethroids, organophosphates), products labeled for "general insect control."
      *   **Termination:** If **NO**, proceed to Step 5 (Substitution Evaluation). If **YES**, proceed to Step 7 (Benefit Assessment).

  5.  **SUBSTITUTION EVALUATION (For non-targeted sprays): Is there strong evidence this application will *reduce total arthropod populations/suffering* over the relevant timescale (e.g., season)?**
      *   *Consider:* Will it kill predators/parasitoids? (Almost certainly yes for broad-spectrum). Is the pest likely to rebound rapidly? (Often yes). Will a different, potentially worse (e.g., more numerous, harder to control) pest colonize? (Likely). Is the treatment necessary to prevent far greater suffering later? (Rarely, except perhaps for disease vectors *if* proven to break cycle).
      *   *Sufficient Answer for Proceeding:* Compelling, site-specific data showing net reduction in target pest *and* no significant increase in secondary pests over multiple seasons, *or* treatment is part of a documented IPM program with proven net benefit. Expert opinion (entomologist) *specific to this context*.
      *   *Insufficient Answer:* "It worked last time," "We need to kill these bugs," general claims about control without rebound data.
      *   **Termination:** If **NO** (Rebound/lack of net reduction likely), **DENY** request. Recommend revisiting Steps 2 & 3. If **YES** (Strong evidence of net reduction), proceed to Step 7. **(Judgment Call Dressed as Procedure: Assessing "strong evidence" and "net reduction" requires ecological intuition and is inherently uncertain.)**

  6.  **SAFETY OVERRIDE (Triggered by Step 1):**
      *   *Action:* Confirm immediate non-lethal mitigation is impossible. Select the *least broad-spectrum, most targeted* effective option feasible. Obtain Superintendent's signature (documenting the imminent threat justification). Apply ONLY to the minimal necessary area/time. **Proceed to Step 8 (Implementation Safeguards).**

  7.  **BENEFIT ASSESSMENT (Targeted spray or passed Substitution Evaluation): Does the *human benefit* outweigh the *certain harm* to arthropods, given our operational values?**
      *   *Consider Human Benefit:* Medical risk reduction (validated, not perceived), significant property damage prevention, essential function disruption (e.g., field unusable), severe psychological distress (rarely sufficient alone).
      *   *Consider Arthropod Harm:* Number likely killed, our policy on sentience (See **Value Declaration** below). Factor in non-target effects even for "targeted" sprays.
      *   *Sufficient Answer for Proceeding:* Significant, tangible human benefit (medical, severe disruption) *clearly* outweighs the harm. Benefit is not merely cosmetic or convenience-based.
      *   *Insufficient Answer:* "Looks bad," "Parents are complaining," "We always spray," "Athletic dept wants it pristine," minor nuisance.
      *   **Termination:** If **YES**, proceed to Step 8. If **NO**, **DENY** request. **(Major Judgment Call Dressed as Procedure: Balancing inherently incommensurate values - human convenience vs. arthropod life/suffering. Requires applying the district's implicit values.)**

  8.  **IMPLEMENTATION SAFEGUARDS:**
      *   Can it be applied strictly per label, minimizing drift/runoff? (e.g., wind <10mph, no rain forecast).
      *   Can it be applied when children/workers are **absolutely not present** (e.g., weekends, deep night) with sufficient re-entry interval (REI) before they return? (Check label REI).
      *   Is the applicator licensed and trained for *this specific product/application*?
      *   **Termination:** If **NO** to any, **HOLD** request until conditions met or deny if impossible. If **YES**, **APPROVE** with strict adherence to conditions and documentation.

  **Value Declaration (Required Policy Choice - Marked Explicitly):**
  *   "For the purpose of this procedure, the District treats all insects and arachnids (ticks, spiders) as possessing a *plausible capacity for aversion or suffering*. We apply a precautionary principle to minimize harm, acknowledging this is a **value choice** (not a settled scientific fact) about which neural complexities matter morally. This influences the 'harm' side of Step 7."

  ---

  **Application to Proposals:**

  1.  **Broad-spectrum pyrethroid spray for ants on stadium field before tournament:**
      *   Step 1: NO (No health/safety threat, just nuisance/field appearance).
      *   Step 2: MAYBE? (Bait stations *might* work, but slower. Judgment: Probably insufficient for "right now" tournament demand. Proceed).
      *   Step 3: PROBABLY NO? ("Ants" - Needs ID. Are they damaging turf or just mound-building? Fire ants vs. field ants matter. **Deny pending ID.** *[Even if ID'd as 'problem' ant...]*)
      *   *(Assume ID'd as nuisance field ant)* Step 4: NO (Pyrethroid is broad-spectrum).
      *   Step 5: SUBSTITUTION EVALUATION: **NO.** Broad-spectrum spray will kill predators (spiders, beetles, parasitic wasps). Ants (highly resilient) likely rebound. Other pests (e.g., sap-sucking insects) may explode without predators. Unlikely net reduction in arthropod numbers/suffering, likely increase. **DENY.** *[This contradicts your likely preference to appease Athletics for the tournament. The procedure rejects it as an unjustified ecological disruption for cosmetic/convenience reasons.]*
      *   *Alternative:* If ID confirms damaging pest (rare for field ants) *and* targeted bait exists (Step 4 YES), Step 7: Human benefit (field playability) vs. harm (ants + non-targets)? **Judgment Call:** Cosmetic/turf perfection likely insufficient to outweigh harm. **DENY** or very marginal approval only if field truly unusable.

  2.  **Perimeter treatment for ticks (hedgerow/classroom) - County Lyme flag:**
      *   Step 1: **YES** (County flag provides "credible threat" validation for Lyme risk). Proceed to Step 6 (Safety Override).
      *   Step 6: Confirm non-lethal (habitat mod - trim vegetation, create woodchip barrier?) insufficient *or* needs augmentation. Select *most targeted* acaricide (tick-specific) if possible (e.g., bifenthrin *can* be somewhat targeted via application method, but still broad). Get Superintendent sign-off. Proceed to Step 8.
      *   Step 8: Ensure application timed for minimal exposure (weekend?), strict adherence to perimeter only, no drift. **APPROVE with Safeguards.** (Focus shifts to *minimizing* harm due to validated health risk override).

  3.  **Destroy wasp nest over kindergarten entrance:**
      *   Step 1: **YES** (High traffic area for vulnerable population; risk of stings, including potential anaphylaxis). Proceed to Step 6 (Safety Override).
      *   Step 6: Confirm non-lethal removal *at night* is impossible/too risky? (Often possible but requires skill/timing). If impossible, select targeted aerosol (if possible) or least broad option. Get Superintendent sign-off. Proceed to Step 8.
      *   Step 8: **CRITICAL.** Must be done when kindergarten is **empty** (night/weekend) with strict REI adhered to before re-entry. **APPROVE with Safeguards.** (Your preference to leave it is overridden by the legitimate, imminent safety hazard to children).

  ---

  **What the Procedure Cannot Do (Limitations):**

  1.  **Predict Complex Ecological Ripple Effects Perfectly:** Step 5 (Substitution) relies on judgment and available data. We can't fully model the ecosystem. We might approve something causing unforeseen harm or deny something that would have had a net benefit.
  2.  **Resolve Deep Value Conflicts:** Step 7 forces a stark choice based on *operational* values. It doesn't solve the underlying philosophy; it operationalizes a precautionary, harm-minimizing stance. Parents valuing a pest-free playground at any cost will disagree with denials.
  3.  **Quantify Suffering:** It treats "harm" as a binary (death) weighted by precautionary sentience. It doesn't (and practically cannot) differentiate degrees of suffering between species or count "dust specks."
  4.  **Handle True Marginal Cases Well:** Situations where human benefit is minor but real, and harm is moderate but not extreme, will be highly dependent on the staffer's judgment in Step 7.
  5.  **Account for Long-Term Insecticide Resistance:** The procedure focuses on the immediate decision. Repeated approvals, especially with non-targeted sprays, will likely breed resistance, making future control harder and potentially increasing long-term suffering/harm – this isn't directly factored in.
  6.  **Eliminate Political Pressure:** It provides a *reasoned* basis for denial, but won't stop the Athletic Director or angry parents from complaining to the Superintendent. Documentation is key.

  **The Fatal Flaw (If Insect Sentience is Absent):**
  The entire ethical scaffolding collapses if **insects are completely non-sentient and incapable of any form of suffering or aversion.** If this is true:
  *   The Value Declaration is wrong.
  *   The "harm" in Steps 5 and 7 disappears (only cost is ecological disruption or human chemical exposure risk).
  *   The procedure becomes overly restrictive and inefficient. Decisions could be made purely on human benefit, cost, efficacy, and ecological impact (without the sentience weight). The substitution problem loses its moral dimension, remaining only an efficacy concern.
  *   **The exercise is pointless** *from an animal suffering ethics perspective* if this premise is false. However, the precautionary principle in the Value Declaration is explicitly chosen *because* we don't know for sure. The procedure hedges against the possibility they *are* sentient. If proven definitively non-sentient, the procedure would need fundamental revision.
