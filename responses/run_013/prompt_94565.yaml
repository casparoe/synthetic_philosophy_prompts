answer: |-
  ### Joint Statement on Harsanyi's Aggregation Theorem

  **Preamble**  
  This statement results from an adversarial collaboration between two camps debating the interpretation of Harsanyi’s aggregation theorem. We define key terms:  
  - **Expected-utility axioms**: Completeness (all alternatives are comparable), transitivity (preferences are consistent), continuity (small changes don’t reverse strict preferences), and independence (preferences over lotteries depend only on differing outcomes).  
  - **Social ordering**: A ranking of social alternatives (e.g., policies, lotteries) reflecting collective welfare.  
  - **Weighted sum of utilities**: A social welfare function \( W = \sum_{i=1}^n w_i U_i \), where \( U_i \) is individual \( i \)’s expected utility, and \( w_i \) are weights.  
  - **Equal-weight utilitarianism**: \( w_i = 1/n \) for all \( i \), implying \( W \) is the average utility.  
  - **Ex ante unanimity**: All individuals prefer alternative A to B before uncertainty resolves.  
  - **Ex post evaluation**: Social judgments based on outcomes after uncertainty resolves.  

  We agree the theorem assumes:  
  - Each individual’s preferences satisfy expected-utility axioms.  
  - The social ordering satisfies these axioms.  
  - The Pareto principle: If all individuals prefer A to B, society prefers A to B.  

  The theorem proves: Under these assumptions, the social ordering is representable as a weighted sum of individual expected utilities.  

  ---

  ### 1. Claims Both Camps Can Sign  
  1. **The theorem is a conditional representation result**. It shows that *if* the premises hold, the social ordering *must* be a weighted sum of individual utilities. It does not, by itself, justify or morally endorse utilitarianism.  
  2. **The gap between weighted sum and equal-weight utilitarianism**: Equal weights require an additional **impartiality condition** (e.g., anonymity or "veil of ignorance" where the social evaluator assumes equal probability of being any individual). Without this condition, weights may be unequal.  
  3. **Premises with substantive moral content**:  
     - The Pareto principle is a moral commitment to respecting unanimous preferences.  
     - The impartiality condition (for equal weights) is a moral postulate about fairness.  
  4. **Merely formal premises**: The expected-utility axioms for individuals and social ordering are rationality conditions without inherent moral content.  
  5. **Agreed cases**:  
     - With **shared probabilities and risk attitudes**, the theorem supports aggregating utilities.  
     - Under **statewise dominance** (one option better for all in every state), both camps accept the Pareto principle dictates social preference.  

  ---

  ### 2. Table of Remaining Disagreements  
  | Question                                                                                              | Camp 1 Answer                                                                 | Camp 2 Answer                                                                 |  
  |-------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|-------------------------------------------------------------------------------|  
  | **1. Is equiprobability (equal weight/probability for each member) a requirement of rationality or a moral postulate?** | A requirement of rationality: Ignorance of one’s identity implies equal probability, a rational constraint. | A moral postulate: Rationality permits unequal weights; equality expresses ethical impartiality. |  
  | **2. What expresses respect for persons: unanimity over ex ante prospects or ex post outcomes?**      | Ex ante unanimity: Respecting autonomy requires deferring to individuals’ pre-resolution choices. | Ex post outcomes: Respect requires ensuring no one suffers unfairly from avoidable harm. |  
  | **3. Does a lottery all prefer ex ante, but contested ex post, count as genuine agreement?**          | Yes: Ex ante consensus reflects informed consent, making objections ex post irrelevant. | No: Agreement is superficial if individuals’ gains/losses conflict in every state. |  
  | **4. Does the theorem justify a social ordering or merely represent one?**                            | Justifies: The premises are minimal, so the sum is uniquely defensible. | Represents: The sum codifies premises that may be rejected; it does not justify them. |  

  ---

  ### 3. Crux Section  
  We analyze cases to clarify disagreements.  

  **Case 1: Divergent Beliefs**  
  - **Setup**: Two individuals, two states (State 1, State 2).  
    - Option L: State 1 → (1, 0); State 2 → (0, 1) [payoffs for individual 1, 2].  
    - Option M: Both states → (0.6, 0.6).  
  - **Beliefs**: Individual 1 believes State 1 is 90% likely; individual 2 believes State 2 is 90% likely. Both are risk-neutral.  
  - **Preferences**: Both prefer L (EU₁(L) = 0.9, EU₂(L) = 0.9) over M (EU₁(M) = 0.6, EU₂(M) = 0.6).  

  | Camp | Social Ranking | Reason |  
  |------|----------------|--------|  
  | **1** | L ≻ M | Ex ante unanimity must be respected. Weighted sum (with equal weights) yields 0.9 for L vs. 0.6 for M. |  
  | **2** | M ≻ L | Unanimity relies on incompatible beliefs. Ex post, M avoids harm: In each state, L leaves one person worse off (0 vs. 0.6). |  

  **Case 2: Shared Beliefs, Different Risk Attitudes**  
  - **Setup**: Same as Case 1, but both agree states are equally likely (50/50). Individual 1 is risk-averse (utility = √payoff); individual 2 is risk-neutral (utility = payoff).  
    - Option L: State 1 → (1, 0); State 2 → (0, 1).  
    - Option M: Both states → (0.6, 0.6).  
  - **Preferences**:  
    - Individual 1: EU₁(L) = 0.5√1 + 0.5√0 = 0.5; EU₁(M) = √0.6 ≈ 0.774. Prefers M.  
    - Individual 2: EU₂(L) = 0.5×1 + 0.5×0 = 0.5; EU₂(M) = 0.6. Prefers M.  

  | Camp | Prediction |  
  |------|------------|  
  | **1** | M ≻ L | Ex ante unanimity holds; weighted sum (equal weights) yields ≈ 0.687 for M vs. 0.5 for L. |  
  | **2** | Ambiguous | Unanimity may be respected here due to shared beliefs, but if L caused extreme ex post inequality (e.g., payoffs of 1000 vs. 0), Camp 2 might rank L ≻ M to avoid ex post harm. |  

  **Case 3: Social Evaluator Knows Population Proportions**  
  - **Setup**: Social evaluator knows they are equally likely to be any individual (e.g., in a two-person society, 50% chance each).  
  - **Question**: How does this affect weights?  

  | Camp | Prediction |  
  |------|------------|  
  | **1** | Weights remain equal | Impartiality requires ignoring actual proportions; equiprobability is a rational constraint. |  
  | **2** | Weights reflect proportions | If proportions differ (e.g., 70% of population is type A), weights should be unequal (e.g., 0.7 for type A). |  

  ---

  ### 4. Verbal Dispute?  
  The dispute is partly verbal. Camp 1 defines **social welfare as coherence with individual rationality and unanimous preferences**. Camp 2 defines **social welfare as equitable outcomes, incorporating moral constraints beyond preferences**. Thus:  
  - For Camp 1, the theorem answers: "What social ordering respects individual rationality and autonomy?"  
  - For Camp 2, it answers: "How can we represent social preferences under uncertainty, given ethical limits?"  
  The core disagreement is not verbal, however: it centers on whether rationality requires the Pareto principle and equiprobability in morally fraught cases.  

  ---

  ### 5. Closing: What Would Move the Debate  
  **Camp 1’s vulnerability**: Evidence that ex ante unanimity yields intolerable ex post outcomes (e.g., one group consistently harmed) in cases of divergent beliefs. A test case: If individuals behind a veil of ignorance reject equiprobability, Camp 1’s rationality claim weakens.  
  **Camp 2’s vulnerability**: Proof that any departure from the Pareto principle or expected-utility axioms leads to irrationality (e.g., intransitive social rankings). A test case: If ex post evaluations violate individual autonomy in uncontroversial scenarios.  
  **Shared crux**: Both camps agree the debate would advance by:  
  - Empirical studies: Do individuals behind a veil of ignorance choose equiprobability? Do they reject ex ante unanimity when ex post harm is predictable?  
  - Theoretical work: Can a social ordering satisfy minimal rationality while accommodating ex post fairness?
