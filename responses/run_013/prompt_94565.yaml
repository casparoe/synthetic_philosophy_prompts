  1. Harsanyi's theorem assumes that each individual's preferences satisfy the expected utility axioms (completeness, transitivity, continuity, and independence) and that the social ordering also satisfies these axioms. Moreover, the social ordering must satisfy the Pareto principle: if every individual prefers one alternative to another, then the social ordering prefers it too.

  2. Given these assumptions, the theorem establishes that the social ordering can be represented by a weighted sum of individual expected utilities. That is, there exist positive weights (one for each individual) such that one alternative is socially preferred to another if and only if the weighted sum of the individual expected utilities is higher for the first alternative.

  3. The theorem does not, by itself, specify that the weights must be equal. To achieve equal weights (and hence utilitarianism) requires an additional impartiality condition. Such a condition might be that the social ordering is symmetric with respect to individuals (anonymity) or that the social evaluator, placed behind a veil of ignorance and not knowing which individual they will be, assigns equal probability to being any individual. Without this condition, the weights may be unequal.

  4. The premises of the theorem combine formal axioms (the expected utility axioms for individuals and the social ordering) and a substantive moral principle (the Pareto principle). The formal axioms are requirements of rationality in decision-making under uncertainty, while the Pareto principle is a normative requirement of respect for unanimous individual preferences.

  5. The theorem applies without controversy in two special cases:
     a. When all individuals share the same probability distribution over states and have identical risk attitudes (so that they have the same utility function up to an affine transformation), the social ordering is straightforwardly the sum of individual utilities (if weights are equal) or a weighted sum (if weights are not equal).
     b. When one alternative is better for every individual in every state (statewise dominance), the Pareto principle requires that the social ordering prefers this alternative.

