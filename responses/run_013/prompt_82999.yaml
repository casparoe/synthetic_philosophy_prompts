  Decompose it. At a minimum: (i) your credence that representational content is fixed by a state's selection history at all, rather than by its current causal or informational role; (ii) conditional on its being fixed by selection history, your credence that the consumer's function rather than the producer's fixes the content; (iii) your credence that the indeterminacy in this case is genuine rather than an artifact of describing the creature at the wrong grain; and (iv) any further term you think belongs. Give a number and a one-line justification for each, then show how they combine into the final figure. End by naming the term you would least like to have to defend, and the argument or finding that would move it most.
