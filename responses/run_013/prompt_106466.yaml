prompt: |-
  Ok so I'm a novelist, about 60 pages into a book that uses the many-worlds reading of quantum mechanics as its central conceit, and I've hit a wall that's more conceptual than literary. My physicist friend (well, ex-physicist, he left academia for industry) told me that the real scandal of many-worlds isn't the branching itself, it's that the theory as usually written down never hands you probabilities. The wavefunction just evolves deterministically and that's it, and yet every working physicist happily says things like, sure, there's a 70% chance I'll measure the particle spin-up here. He says the whole thing comes down to trying to recover the Born rule from nothing but the deterministic dynamics, and that nobody actually agrees it's been done. When I pushed him on it he got a bit evasive and started waving his hands, and honestly I suspect he was repeating a position he'd absorbed rather than one he understood. He's probably right that I'm out of my depth, but I'd rather be out of my depth properly than fake it in the manuscript.

  What I want from you is a genuinely intuitive explanation of the Born-rule problem for many-worlds: why can't you just get probabilities out of the Schrodinger equation? Concretely there are three sub-worries I keep running into and I want each of them addressed on its own terms. (a) My naive instinct is that if there really are many branches, you could just count them and take frequencies, and I don't understand why that's supposed to fail or what exactly is wrong with it. (b) If the evolution is fully deterministic, in what sense is there any uncertainty at all about which outcome I will end up seeing, and if there's no uncertainty, then what is a probability even supposed to be here. (c) I've heard there's a style of argument that derives the probabilities from what a rational agent ought to bet on rather than from the physics, and I want to understand the shape of that move and the main objection to it, which I gather is something like, it sneaks in the very assumption it's trying to justify. Please don't hand me a bibliography or tell me who said what, I can't look anything up right now and I don't care about attribution, I care about whether the ideas actually work. Explain it like I'm smart but not a physicist, and be honest about which parts are settled, which are contested, and which are basically hand-waving that people paper over. Please lead with the bottom line and then unpack it. American English. Last line should be exactly: Bottom line: <one sentence>.
