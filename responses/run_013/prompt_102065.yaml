  We are designing a procedure for evaluating grant proposals based on a suffering-focused, austere accounting system. The key constraints are:
   1. Benefits are only reductions in suffering (not gains in happiness or flourishing).
   2. Suffering is split into two non-convertible columns: severe and mild.
   3. We must not assume a common currency between severe and mild suffering.
   4. The procedure must handle cases where the two columns point in opposite directions (e.g., an intervention reduces severe suffering but increases mild suffering, or vice versa).
   5. We must not resolve the ambiguity about interventions that reduce suffering by reducing the number of beings who will exist (i.e., antinatalist-type interventions). The procedure must flag such cases for human decision.
   6. The procedure must produce a written rationale for each proposal that can be audited by a trustee.
   7. The program officers (without philosophical training) must be able to run the procedure in about 90 minutes per proposal.

   The procedure will be an ordered set of questions. We will include:
   - Stop conditions (returning "no")
