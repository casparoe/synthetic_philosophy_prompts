              Increase: 18260 - 350 = 17910 units of severe suffering.

          Therefore:

              Step 2: 
                  Increase in severe suffering: 17910 per person.
                  Reduction in severe suffering: 0? Actually, we are increasing. So we have an increase.

              Step 3: We have an increase in severe suffering. So we go to Step 4.

          Step 4: 
              Net severe change = 0 - 17910 = -17910 (negative) -> stop (reject).

          But note: what about mild suffering? The proposal might reduce mild suffering? But if the suffering is severe, then we don't have mild. So we reject.

          Therefore, the procedure rejects this proposal.

          This is a result that the director might not like because the crisis line saves lives. But in terms of suffering reduction, it might increase suffering if it extends a life of suffering.

          However, if the proposal can show that the suffering after the intervention is reduced enough to make the total less than without the intervention, then we might have a reduction. But in our example, they didn't.

          But note: what if the proposal argues that without the crisis line, the person might not have died immediately? Maybe they would have suffered for years? Then the without-intervention scenario might have more suffering? The proposal must provide their baseline.

          We rely on the proposal's estimates. If they cannot show a net reduction in suffering, we reject.

          In summary, the crisis line proposal might be rejected if it extends a life of suffering without reducing the suffering enough to compensate.

          This is a case where the procedure might misfire: if the crisis line actually does reduce suffering in the long run, but the proposal doesn't provide the estimates to show that, then we reject. Also, if the person would have lived anyway (without committing suicide) and the crisis line only prevents a suicide that would have happened in a moment of crisis, then the without-intervention scenario might be a long life of suffering? That's a complex counterfactual. The procedure requires the proposal to provide the counterfactual.

   Finally, we note:

     Cases where the procedure might misfire:

       1. When there is a mix of severe and mild reduction, but the severe reduction is not cost-effective and the mild is very cost-effective: we reject. This might be a misfire if the foundation would have wanted to fund very cost-effective mild suffering reduction even if there is a small amount of severe reduction that isn't cost-effective. But we cannot convert, so we have to reject.

       2. When the intervention causes a small increase in one type of suffering and a large reduction in the other: we reject. This might be a misfire if the increase is negligible and the reduction is huge. But we are forbidden to convert.

       3. The crisis line example: we reject if the total suffering increases, even if the person's life becomes worth living (because we don't count the positive aspects). This might be a misfire from a humanitarian perspective, but it is consistent with the austere accounting.

     What the procedure cannot do at all:

       - Handle interventions that primarily increase happiness or flourishing without reducing suffering (we reject at Step 0).
       - Compare two proposals that reduce different types of suffering (one severe, one mild) because we have separate benchmarks and we prioritize severe. We cannot combine them into a single ranking.
       - Account for positive well-being in any way.
       - Account for long-term, indirect effects that are not quantified in the proposal.
       - Make a decision on antinatalist interventions or life-shortening interventions without human review.

   We have written the procedure and applied it to the three proposals. The crisis line proposal (Proposal 3) is rejected in our example because it increases severe suffering. This is a result the director might not like.

   The procedure is as follows:

  # Procedure for Evaluating Grant Proposals

  ## Step 0: Formal Requirements
  - **Question:** Is the proposal complete, within the funding range ($10,000-$60,000), and explicitly aimed at reducing suffering?
  - **Sufficient answer:** Yes.
  - **Stop condition:** If no, reject and document the reason.
  - **Output:** Pass or Reject.

  ## Step 1: Type of Intervention
  - **Question:** How does the intervention primarily reduce suffering?
    - a) Improving conditions of existing beings (e.g., pain relief, better conditions).
    - b) Preventing future suffering by preventing the existence of beings (e.g., contraception, breeding moratorium).
    - c) Shortening the life of suffering beings (e.g., humane killing, euthanasia).
    - d) Other (specify).
  - **Sufficient answer:** Categorize as a, b, c, or d. If b or c, flag for director review (due to unresolved ethical questions).
  - **Stop condition:** None at this step.
  - **Output:** Type and flag if b or c.

  ## Step 2: Quantify Suffering Changes
  - **Question:** What are the estimated reductions and increases in severe suffering and mild suffering? (Proposal must provide these estimates in defined units.)
  - **Sufficient answer:** Numerical estimates for:
    - Reduction in severe suffering (R_sev)
    - Reduction in mild suffering (R_mild)
    - Increase in severe suffering (I_sev) - if any
    - Increase in mild suffering (I_mild) - if any
  - **Stop condition:** If estimates are not provided or cannot be derived with reasonable confidence within the time, reject.
  - **Output:** R_sev, R_mild, I_sev, I_mild.

  ## Step 3: Check for Increases
  - **Question:** Are there any increases in suffering (I_sev > 0 or I_mild > 0)?
  - **Sufficient answer:** Yes or no.
  - **Stop condition:** If no increases, proceed to Step 5. If increases, proceed to Step 4.
  - **Output:** Proceed to Step 4 or Step 5.

  ## Step 4: Net Changes (if there are increases)
  - **Question:** What are the net changes in severe and mild suffering?
    - Net severe change = R_sev - I_sev
    - Net mild change = R_mild - I_mild
  - **Sufficient answer:** Both net changes must be non-negative (>=0).
  - **Stop condition:** If either net change is negative, reject.
  - **Output:** Pass to Step 5 if both non-negative; else reject.

  ## Step 5: Cost-Effectiveness
  - **Question:** Is the intervention cost-effective in reducing suffering?
    - If net severe reduction > 0:
        - cost per unit severe reduction = total cost / net_sev_reduction
        - If this <= current benchmark for severe suffering, then pass; else reject.
    - Else if net mild reduction > 0:
        - cost per unit mild reduction = total cost / net_mild_reduction
        - If this <= current benchmark for mild suffering, then pass; else reject.
    - Else (no reduction in either): reject.
  - **Note:** The foundation must set and update benchmarks for severe and mild suffering reduction (e.g., $X per unit of severe reduction, $Y per unit of mild reduction).
  - **Stop condition:** Reject if not cost-effective by the above.
  - **Output:** Pass or reject.

  ## Step 6: Flag for Value Decisions
  - **Question:** Was the intervention categorized as type b or c in Step 1 and did it pass Step 5?
  - **Sufficient answer:** If yes, then do not reject but flag for director review. The director must make a value judgment on the ethics of preventing existence or shortening life.
  - **Stop condition:** None (this step doesn't reject, but the director might after review).
  - **Output:** If not type b or c, then the proposal is accepted (if it passed all steps). If type b or c, then it is conditionally accepted pending director review.

  ## Rationale Documentation
  At each step, document the answers and decisions. The final report should include:
  - Step 0: Outcome and reason if rejected.
  - Step 1: Type and flag status.
  - Step 2: The numerical estimates.
  - Step 3: Whether there were increases.
  - Step 4 (if applicable): Net changes and outcome.
  - Step 5: Cost-effectiveness calculation and outcome.
  - Step 6: Flag status and director decision (if applicable).

  ## Standard Objections
  - **Addressed by stipulation:** 
    - We only count suffering reduction, not gains in happiness (board's directive).
    - We do not convert between severe and mild suffering (board's directive).
  - **Deflected by procedure:**
    - Antinatalist and life-shortening interventions are flagged for human review (we do not decide on behalf of the board).
  - **Cannot handle:**
    - Comparing interventions that reduce only mild suffering vs. those that reduce only severe suffering (we use separate benchmarks and prioritize severe, but we cannot combine into a single metric).
    - Situations where a small increase in one type of suffering is outweighed by a large reduction in the other (we reject due to net increase).
    - Long-term indirect effects not quantified in the proposal.
    - Positive well-being in any form.

  We have applied this procedure to three proposals. One (the crisis line) was rejected in our example due to an increase in severe suffering, which might be an unwelcome result.
