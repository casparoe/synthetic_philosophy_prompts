  ### Screening Procedure for Grant Proposals

  **Purpose**: Evaluate proposals based solely on reductions in severe and mild suffering (non-convertible columns), without assuming a common currency or addressing population ethics ambiguities. Produce an auditable rationale.

  **Key Stipulations**:
  - Benefits booked *only* as suffering reductions (happiness/flourishing gains ignored).
  - Severe and mild suffering columns are separate; no cross-column arithmetic permitted.
  - Proposals reducing suffering by preventing existence require human judgment.
  - Cost-effectiveness assessed within suffering columns only; severe suffering prioritized.

  **Procedure**:

  1. **Eligibility Check**  
     - *Question*: Does the proposal explicitly aim to reduce suffering, and is the request between $10K–$60K?  
     - *Sufficient Answer*: Documentation of suffering-focused intervention and budget alignment.  
     - *Stop Condition*: If "no," reject. Rationale: "Not within scope or budget."  

  2. **Suffering-Reduction Mechanism**  
     - *Question*: Does the intervention reduce suffering by:  
       (a) Improving conditions for existing beings,  
       (b) Preventing future lives, or  
       (c) Shortening life?  
     - *Sufficient Answer*: Clear identification of (a), (b), or (c).  
     - *Human Judgment Flag*: If (b) or (c), escalate to Director. Rationale: "Board unresolved on population ethics."  

  3. **Quantify Suffering Reduction**  
     - *Question*: What is the estimated reduction in severe suffering (Column S) and mild suffering (Column M)?  
     - *Sufficient Answer*: Numerical estimates (with units defined by the proposal) for S and M reductions.  
     - *Stop Condition*: If no quantifiable estimates, reject. Rationale: "Insufficient evidence of impact."  

  4. **Quantify Suffering Increases**  
     - *Question*: Does the intervention cause increases in S or M? If yes, quantify.  
     - *Sufficient Answer*: Numerical estimates for increases (if any) in S and M.  
     - *Stop Condition*: If net increase in S *or* M (reductions < increases), reject. Rationale: "Net increase in [S/M] suffering."  

  5. **Cross-Column Conflict Resolution**  
     - *Question*: Do S and M reductions point in opposite directions (e.g., S reduced but M increased, or vice versa)?  
     - *Sufficient Answer*: Yes/no.  
     - *Stipulation Flag*: If "yes," reject. Rationale: "Columns conflict; no conversion permitted per board policy."  
     - *Note*: Ambiguity resolved via strict non-conversion.  

  6. **Cost-Effectiveness Assessment**  
     - *Question*:  
       - If S > 0: Cost per unit S reduction ≤ benchmark for S?  
       - If S = 0 but M > 0: Cost per unit M reduction ≤ benchmark for M?  
     - *Sufficient Answer*: Cost-effectiveness calculation using proposal’s units.  
     - *Stop Condition*: If above thresholds, reject. Rationale: "Not cost-effective within [S/M] column."  
     - *Prioritization Note*: If S > 0, M reductions are not considered in cost-effectiveness (severe suffering prioritized).  

  7. **Final Review**  
     - *Output*: Written rationale compiling steps 1–6.  
     - *Director Sign-off*: Required for all proposals. Escalated proposals (Step 2 flags) include Director’s ethical judgment.  

  ---

  ### Standard Objections Addressed
  - **"Why ignore happiness gains?"**  
    *Stipulation*: Board policy; procedure deflects by design.  
  - **"Can’t mild suffering be traded for severe?"**  
    *Cannot handle*: Columns are non-convertible; conflict triggers rejection (Step 5).  
  - **"What about reducing suffering via nonexistence?"**  
    *Deflected*: Flagged for human judgment (Step 2); procedure takes no stance.  
  - **"Doesn’t this neglect long-term effects?"**  
    *Cannot handle*: Only quantifiable, direct suffering reductions are counted.  

  ---

  ### Procedure Applied to Three Proposals

  **Proposal 1: Instant-Death Insecticide**  
  - **Step 1**: Reduces suffering by shortening life (c). → **Flag for Director**.  
  - **Step 2**: Quantified S reduction (aversive states eliminated); M reduction = 0.  
  - **Step 3**: No increases in S or M.  
  - **Step 5**: High S reduction, low cost → **passes cost-effectiveness for S**.  
  - **Verdict**: **Conditionally approved** (pending Director’s judgment on life-shortening).  
  - *Rationale*: "Conflicts with board’s unresolved population ethics; high S reduction at low cost."  

  **Proposal 2: Animal Contraception Campaign**  
  - **Step 1**: Reduces suffering by preventing future lives (b). → **Flag for Director**.  
  - **Step 2**: Quantified M reduction (mild deprivation prevented); S reduction = 0.  
  - **Step 3**: No increases in S or M.  
  - **Step 5**: High M reduction, low cost → **passes cost-effectiveness for M**.  
  - **Verdict**: **Conditionally approved** (pending Director’s judgment on antinatalism).  
  - *Rationale*: "Conflicts with board’s unresolved population ethics; high M reduction at low cost."  

  **Proposal 3: Suicide Prevention Crisis Line**  
  - **Step 1**: Reduces suffering by improving conditions (a).  
  - **Step 2**: Quantified S reduction (deaths prevented → severe distress reduced).  
  - **Step 3**: **Increases S**: Extended lifespan prolongs severe distress in some cases (counterfactual: death ends suffering). Net S reduction may be negative.  
  - **Step 4**: Net increase in S → **Stop. Reject**.  
  - **Verdict**: **Rejected**.  
  - *Rationale*: "Net increase in severe suffering due to prolonged distress; violates Step 4 stop condition."  
  - **Why you won’t like this**: Crisis lines are intuitively compelling, but the procedure’s austere accounting prioritizes suffering-minimization over life-extension.  

  ---

  ### Limitations and Expected Misfires
  **Misfires**:  
  1. **False Negatives**:  
     - Interventions with net happiness gains but marginal suffering reductions (e.g., art therapy for depression) rejected at Step 1.  
     - High-impact proposals with cross-column conflicts (e.g., reduces severe suffering but slightly increases mild suffering) rejected at Step 5.  

  2. **False Positives**:  
     - Cost-effective mild-suffering reductions in low-priority areas (e.g., reducing boredom in captive animals) funded if S = 0.  

  **Cannot Handle**:  
  - **Population Dynamics**: Long-term effects of reducing birth rates (e.g., ecosystem impacts).  
  - **Threshold Effects**: Suffering near the severe/mild boundary (no conversion allowed).  
  - **Indirect Benefits**: Ripple effects (e.g., economic stability reducing future suffering).  

  **Procedural Gaps**:  
  - **Value Judgments**: Relies on Director to resolve population ethics; no guidance for trustees.  
  - **Benchmark Setting**: Cost-effectiveness thresholds for S/M are assumed predefined.  

  **Recommendation**: Review benchmarks annually and document Director’s decisions on flagged proposals to inform future board policy.
