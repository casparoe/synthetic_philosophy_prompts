prompt: |-
  Next term I am running a graduate seminar on the politics of the archive, and I want to open with a session on what a theory of archival selection has to deliver before we start adjudicating between rival positions. The recurring fight in my field is between the older ideal of the archivist as a neutral custodian who keeps what the records happen to contain, and the newer insistence that every archive is an instrument of power that decides whose lives become legible and whose quietly vanish from the record. The two sides argue past each other because they never agree on what the theory is even supposed to do, so I want the specification settled first, in my hands before the term begins.

  Write me the desiderata: what any adequate theory of what an archive should preserve — and, by extension, whose lives get recorded — must be able to do. For each requirement, give the case or consideration that motivates it. I want the requirement that selection is inescapable, so the real question is never whether to exclude but on what grounds and by whose authority; the requirement that a silence be treated as a different object depending on whether it is a mere omission, the positive product of a decision to destroy or suppress, or the byproduct of a classificatory scheme that had no category for the people in question; the requirement that the theory account for the claims of the people inside the records as against the claims of those kept out of them; the requirement that it say whether the archivist can be neutral at all or only honest about a stance; and the requirement that it reconcile fidelity to a record's origin with making that record answerable to the communities it describes. Tell me which of these are non-negotiable and which are really just commitments of one camp dressed up as criteria, and flag any pair you think cannot be jointly satisfied — that is the part I most want, because if two of the demands pull against each other then the list itself is a result. Close by naming the single requirement that does the most to rule out the familiar positions.

  One case to test the list against, if it helps: a county archive is offered a trove of police surveillance files that document both the targeting of a local movement and the private lives of dozens of uninvolved people swept up in the same dragnet. The donors want it preserved whole and unredacted, the movement wants it kept as evidence of what was done to them, and several of the surveilled want it destroyed. Whatever you write should let me say, on the theory's own terms, what is demanded here — and if the list cannot decide the case, say so, and tell me whether that is a failure of the theory or a sign that the question was never the theory's to answer.
reasoning: |-
  Okay, the user is preparing for a graduate seminar on the politics of the archive and wants to establish foundational desiderata for a theory of archival selection. They’re frustrated with the entrenched debate between "neutral custodian" and "archive as power instrument" camps, and want to clarify what any adequate theory must deliver before evaluating rival positions.  

  The user’s explicit requests are thorough:  
  - **Inescapability of selection**: Must frame exclusion as inevitable, shifting focus to grounds/authority.  
  - **Typology of silence**: Distinguish omission, active destruction/suppression, and classificatory erasure.  
  - **Balancing claims**: Weigh interests of those inside vs. outside the records.  
  - **Neutrality vs. honesty**: Address whether archivists can be neutral or must declare stance.  
  - **Origin fidelity vs. community answerability**: Reconcile preserving records "as is" with making them serve affected communities.  

  They also want meta-analysis: flag non-negotiables vs. partisan claims, identify irreconcilable tensions, and pinpoint which requirement most decisively rules out existing positions. The police surveillance case is a litmus test.  

  **Reading between the lines**:  
  - They seek to *depolarize* the debate by exposing hidden premises. The "neutral vs. power" stalemate arises because each side prioritizes different desiderata (e.g., custodians fixate on fidelity; critical theorists on community answerability).  
  - Their closing demand—"name the requirement that rules out familiar positions"—suggests they want a framework that forces both camps to confront their blind spots.  
  - The surveillance example is perfect because it pits all desiderata against each other: donors (fidelity/origin), movement (answerability/claims of the recorded), surveilled innocents (claims of the excluded).  

  **Structuring the response**:  
  1. **Desiderata with motivations**: Anchor each in concrete stakes (e.g., classificatory silence motivated by colonial archives erasing Indigenous kinship structures).  
  2. **Tension analysis**:  
     - *Fidelity vs. answerability* is the core irresolvable pull. You can’t fully satisfy both the dead creator’s context and living communities’ needs.  
     - *Neutrality requirement* is a wolf in sheep’s clothing—it smuggles in the custodial ideal. Better to demand "stance accountability."  
  3. **Non-negotiables**:  
     - Inescapability of selection (empirically true)  
     - Typology of silence (analytically essential)  
     - Stance accountability (avoids false neutrality)  
  4. **Decisive requirement**: *Balancing claims* rules out both camps. Custodians ignore the excluded; power theorists overlook the recorded’s rights (e.g., marginalized groups *wanting* their trauma preserved).  
  5. **Surveillance case verdict**: The theory *can’t* prescribe an outcome—it only structures tradeoffs. Destruction might violate fidelity; redaction might compromise evidence; full preservation ignores privacy. The desiderata force transparency about *why* a choice is made, not the choice itself.  

  **Key insight for the user**: The real function of these desiderata isn’t to solve dilemmas but to make them *legible*. That’s the pedagogical win: students should see selection as structured dilemma, not technical or ideological failure.
answer: |-
  Here are the desiderata for an adequate theory of archival selection, structured to meet your specifications. Each requirement is grounded in a motivating case/consideration, followed by analysis of tensions, non-negotiables, and decisiveness against existing camps. The surveillance case is addressed at the end.

  ### **Core Desiderata for a Theory of Archival Selection**  
  1. **The Inescapability of Selection**  
     - **Requirement**: The theory must acknowledge that archival selection is inevitable. The critical question is never *whether* to exclude, but *on what grounds* and *by whose authority*.  
     - **Motivation**: Even "neutral" archives face practical constraints (space, resources) forcing triage. Example: A national archive receiving daily government records *must* discard >99% due to volume. Refusing to select is still a selection.  

  2. **Typology of Silence**  
     - **Requirement**: The theory must distinguish between:  
       - **Omission** (unintended gaps),  
       - **Active Erasure** (deliberate destruction/suppression),  
       - **Classificatory Exclusion** (systemic absence due to taxonomy, e.g., no category for non-binary people in 1950s records).  
     - **Motivation**: Different silences demand different remedies. Example: Recovering colonial histories requires diagnosing whether records were *destroyed* (erasure) or never created due to racist taxonomies (classificatory exclusion).  

  3. **Balancing Competing Claims**  
     - **Requirement**: The theory must weigh the rights/interests of those *in* the records (e.g., subjects, creators) against those *excluded* (e.g., marginalized groups rendered invisible).  
     - **Motivation**: Indigenous communities demand repatriation of ceremonial records (claim of the recorded), while activists seek redress for histories erased by archives (claim of the excluded).  

  4. **Stance Accountability over False Neutrality**  
     - **Requirement**: The theory must reject the myth of archivist-as-invisible-arbiter. Instead, it should require transparency about *positionality* (whose values shape selection) and *accountability mechanisms* (e.g., community review boards).  
     - **Motivation**: "Neutral" archives routinely preserved slaveholder ledgers but discarded oral histories of the enslaved. Neutrality obscures power.  

  5. **Fidelity-to-Origin vs. Community Answerability**  
     - **Requirement**: The theory must reconcile preserving records’ *provenance and original context* with ensuring they *serve and answer to* the communities they impact.  
     - **Motivation**: Medical archives documenting unethical experiments must preserve original data (fidelity for accountability) while enabling access for victim-descendants (answerability).  

  ---

  ### **Tensions, Non-Negotiables, and Partisan Claims**  
  - **Non-Negotiables**:  
    - *Inescapability of Selection* (empirical reality).  
    - *Typology of Silence* (analytical necessity for ethical action).  
    - *Stance Accountability* (avoids bad-faith neutrality).  

  - **Partisan Claims Dressed as Universal**:  
    - *Fidelity as inviolable sanctity* is a custodial ideal ignoring power imbalances (e.g., preserving racist records uncritically).  
    - *Community answerability as absolute* risks presentism, overwriting historical context (e.g., censoring oppressive language that evidences violence).  

  - **Irreconcilable Tension**:  
    **Fidelity-to-Origin vs. Community Answerability** cannot be fully satisfied jointly.  
    - *Why?* Fidelity demands preserving records intact, even harmful content; answerability may require redaction, reinterpretation, or restricted access to prevent harm.  
    - *Example*: Police records using slurs against activists. Fidelity insists on retaining slurs as evidence of state bias; answerability may demand redaction to avoid revictimization.  

  ---

  ### **The Requirement That Rules Out Familiar Positions**  
  **Balancing Competing Claims** invalidates both dominant camps:  
  - **Custodial Neutrality** fails by ignoring claims of the excluded (e.g., accepting colonial records without addressing Indigenous repatriation).  
  - **Archive-as-Power** often sidelines claims *within* records (e.g., dismissing survivors who want traumatic evidence preserved as proof).  
  *This requirement forces confrontation with the archive’s dual role: evidence-keeper and social actor.*  

  ---

  ### **Testing the Theory: The Police Surveillance Case**  
  **Scenario**: County archive offered unredacted police surveillance files. Donors (law enforcement) want full preservation; activists want evidence preserved; surveilled innocents demand destruction.  

  **Theory’s Demands**:  
  1. **Selection is inescapable** → Archive *must* choose; cannot avoid responsibility.  
  2. **Typology of silence** → Is the absence of consent from innocents *omission* (accidental) or *erasure* (intentional violation)? Here, it’s active erasure.  
  3. **Balancing claims** →  
     - *Surveilled innocents*: Privacy/dignity rights (claim to exclusion).  
     - *Activists*: Right to evidence of state oppression (claim to inclusion).  
     - *Donors*: Fidelity to record’s completeness (claim of origin).  
  4. **Stance accountability** → Archivists must transparently weigh #3 and justify choice.  
  5. **Fidelity vs. answerability** → Tension peaks: Fidelity supports unredacted preservation; answerability to innocents demands redaction/destruction.  

  **Verdict**:  
  - The theory **cannot prescribe a single outcome** but **demands a structured, transparent adjudication**:  
    - Non-negotiable: Silence typology confirms harm to innocents (active erasure), ruling out unredacted preservation.  
    - Irreconcilable tension: Full destruction violates activists’ claims; full preservation violates innocents’ claims.  
    - Solution-space: *Redaction* (protecting innocents’ IDs while preserving evidence) + *contextualizing* the erasure (documenting why redaction occurred).  
  - **Is this a failure?** No—it reveals the case’s inherent dilemma. The theory’s role is to frame the conflict and require ethical deliberation, not erase it. The question *is* the theory’s to answer, but its answer is processual: "You must weigh X, Y, Z and justify your stance."  

  ### **Conclusion for Your Seminar**  
  This framework forces students to move beyond "neutral vs. power" by exposing:  
  - The false choice of *whether* to select (all archives select).  
  - The necessity of diagnosing silences (to target interventions).  
  - The non-absoluteness of fidelity/answerability (requiring negotiation).  
  - The centrality of *accountable decision-making* over illusory neutrality.  

  The surveillance case exemplifies how desiderata clarify dilemmas without resolving them—a strength, not weakness. It shifts the debate from *which side is right* to *how we responsibly navigate conflicting rights*.
