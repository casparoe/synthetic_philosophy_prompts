  Below is a one-page decision tree for your split-brain reading group, centered on the shared premise of commissurotomy patients with hemispheric independence. The tree avoids "-isms" and uses questions to probe key distinctions. Each node is answerable without prior knowledge of the outcome, and leaves capture core commitments (8 total). Unoccupied combinations and indistinct leaves are noted at the end.

  ---

  ### **Split-Brain Decision Tree**  
  **Start**: Classic commissurotomy patients exhibit hemispheric independence—each hemisphere responds, reports, and can act at cross-purposes.  

  1. **Is there a split in *phenomenal unity* (i.e., two separate streams of consciousness)?**  
     - **No** → Proceed to **Q5**.  
     - **Yes** → Proceed to **Q2**.  
     - **No fact of the matter** → **Leaf 1: Deflationary view**  
       *The question of unity is ill-posed; no objective "count" of consciousness applies.*  

  2. **Do the two streams conflict *within a single action* (e.g., one hand buttons a shirt while the other unbuttons it)?**  
     - **Yes** → Proceed to **Q3**.  
     - **No** → Proceed to **Q4**.  

  3. **Does the conflict imply a split in the *agent* (i.e., two distinct sources of action)?**  
     - **Yes** → **Leaf 2: Two agents, two subjects, one person**  
       *The person remains unified (e.g., socially/legally), but contains two conscious subjects and agents.*  
     - **No** → **Leaf 3: One agent, two subjects**  
       *A unified agent "owns" both streams, but cannot reconcile conflicting actions (incoherent under cross-purpose behavior).*  

  4. **Is the disunity restricted to *non-shareable tasks* (e.g., naming lateralized objects)?**  
     - **Yes** → **Leaf 4: Two subjects, one agent**  
       *Tasks are segregated by hemisphere, but no conflict arises in shared actions; agency stays unified.*  
     - **No** → **Leaf 5: Two subjects, two agents, one person**  
       *Agency is split but avoids conflict via task segregation; the person persists as a higher-order entity.*  

  5. **Is the disunity (in access/report) *produced by surgery* or *always latent* in intact brains?**  
     - **Produced by surgery** → **Leaf 6: Surgical disruption of access**  
       *Phenomenal unity persists; surgery only disrupts information access and motor coordination.*  
     - **Always latent** → Proceed to **Q6**.  

  6. **In intact brains, would disunity arise if hemispheres were probed *independently*?**  
     - **Yes** → **Leaf 7: Access disunity without phenomenal split**  
       *Consciousness is unified, but reporting systems are parallel and normally synchronized.*  
     - **No** → **Leaf 8: Unified access and phenomenality**  
       *Surgery creates a novel disunity; intact brains show no latent splits.*  

  ---

  ### **Annotations**  
  - **Leaf Commitments** (8 leaves):  
    1. Deflationary view  
    2. Two agents, two subjects, one person  
    3. One agent, two subjects  
    4. Two subjects, one agent  
    5. Two subjects, two agents, one person  
    6. Surgical disruption of access  
    7. Access disunity without phenomenal split  
    8. Unified access and phenomenality  

  - **Unoccupied Combinations & Why**:  
    - **Q3 → "No" (Leaf 3)**: Incoherent. If actions conflict (Q2=Yes), denying split agency contradicts evidence of opposed volition.  
    - **Q4 → "No" (Leaf 5)**: Untried. No major theory posits split agents *without* task conflict.  
    - **Q6 → "No" (Leaf 8)**: Unattractive. Ignores evidence of hemispheric specialization pre-surgery.  

  - **Indistinct Leaves**:  
    - **Leaf 2 vs. Leaf 5**: Both posit one person with two agents/subjects. Tree distinguishes via *action conflict* (Leaf 2 requires it; Leaf 5 denies it).  
    - **Leaf 4 vs. Leaf 7**: Both deny phenomenal splits. Tree separates by *task scope* (Leaf 4: disunity in actions; Leaf 7: disunity only in access/report).  

  - **Design Notes**:  
    - Avoids "one mind or two?" framing per your request.  
    - Key distinctions: phenomenal unity, action conflict, surgical vs. latent disunity, and what unifies (subject/agent/person).  
    - "No fact of the matter" included as Leaf 1.  

