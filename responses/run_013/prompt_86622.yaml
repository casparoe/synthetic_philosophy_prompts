  What's interesting is how they've already ruled out several obvious explanations: it's not simple ambiguity (since meanings aren't pre-defined), not vagueness (each state feels precise), not theory-ladenness (no competing frameworks), not gestalt shifts (no visual reorganization), and not metaphor (no domain transfer). They're clearly deeply familiar with cognitive science concepts but haven't found the right fit.

  The core seems to be this negotiated meaning-making where interpretations are retroactively adjusted to fit the emerging solution. The user emphasizes three key features: necessity (you must shift to solve it), external drive (mapping demands force reinterpretation), and indeterminacy (no single "correct" reading survives the process). 

  Hmm... as I scan cognitive science concepts, a few candidates come close but miss the mark:
  - Frame shifting (from cognitive linguistics) captures meaning changes but assumes pre-existing frames
  - Functional fixedness overcoming (from problem-solving) is about changing an object's use, not its conceptual role
  - Conceptual role semantics (from philosophy) describes meaning through use but lacks the dynamic re-reading aspect

  What's unique here is the real-time negotiation of ontological status (is this letter an entity or a position?) driven by mapping constraints, with no privileged "base" interpretation. The closest established concept might be "pragmatic enrichment" from linguistics, but even that assumes stable core meanings being contextually adjusted.

  Perhaps this needs a new term - "ontic negotiation" or "interpretive bootstrapping" - to capture how problem-solving constructs temporary ontologies. The user's examples beautifully show cognition improvising reference systems on the fly, where meanings are both discovered and invented simultaneously through constraint satisfaction. 

  For boundary cases: 
  - Solving a math problem by reinterpreting variables wouldn't count if the rules are fixed upfront 
  - But interpreting "river bank" in different sentences would be too static 
  - The perfect match might be how chess players dynamically recast pieces as attacking units or defensive structures mid-game

  The user's description feels remarkably precise - they've carved nature at its joints. Their insistence that "two solvers give different accounts" suggests this might be a fundamental feature of inventive cognition rather than a puzzle-specific quirk.
answer: |-
  ### 1. Nearest Established Concepts  
  **a. *Pragmatic Enrichment* (Linguistics/Pragmatics)**  
  Definition: Context-driven amplification of an expression's meaning beyond its literal semantic core (e.g., "I ate" implies "I ate food today").  
  **Why it misses:** Pragmatic enrichment *extends* fixed meanings but doesn’t radically redefine ontological roles (e.g., a letter shifting from token to position). Your cases involve wholesale recategorization driven by global problem constraints, not incremental contextual fleshing-out.  

  **b. *Frame Shifting* (Cognitive Linguistics)**  
  Definition: Updating mental schemas when new information violates expectations (e.g., interpreting "college" differently in "party college" vs. "women’s college").  
  **Why it misses:** Frame shifts activate *pre-existing* frames. Your puzzles require *ad hoc* category invention (e.g., "whatever stands to j as b to a" isn’t a stored frame). Shifts are solutions, not reactions to incongruity.  

  **c. *Variable Binding* (Cognitive Science/Analogy)**  
  Definition: Aligning elements across domains by mapping roles (e.g., in *Rutherford’s solar system atom*, electrons "bind" to planets).  
  **Why it misses:** Binding assumes stable roles. Your cases show *role instability*: the same element (e.g., letter `b`) is rebound to distinct conceptual types (object, class, relation) *within the same analogy*.  

  ---

  ### 2. What Your Description Is Not  
  Your distinctions are sound:  
  - **Not ambiguity/homonymy:** Ambiguity involves choosing between pre-existing meanings (e.g., "bank" = river/finance). Your meanings are *constructed* during solving.  
  - **Not vagueness:** Vagueness (e.g., "tall") has borderline cases. Your descriptions are precise *locally* but globally inconsistent.  
  - **Not metaphor:** Metaphor maps *between* domains (e.g., "argument is war"). Your shifts stay *within* the domain’s elements.  
  - **Not Gestalt switch:** Gestalt shifts (e.g., duck-rabbit) are perceptual and exclusive. Your shifts are conceptual and cumulative—readings coexist without visual change.  
  **Correction:** One near-miss (*conceptual role semantics*) could be relevant if stretched: meanings defined by inferential roles. But it typically assumes stable roles within a system, whereas your roles mutate during problem-solving.  

  ---

  ### 3. The Phenomenon, Carved  
  **Definition:** *Ontic negotiation*—the iterative re-categorization of entities during problem-solving, where an element’s ontological type (object, property, relation, role) is dynamically reassigned to satisfy global mapping constraints.  

  **Essential features:**  
  - **Constraint-driven redescription:** Shifts are compelled by emergent solution requirements (e.g., absence of `b` forces `b` to become a relation).  
  - **Retrospective coherence:** Earlier states are re-interpreted to align with later insights, masking the negotiation.  
  - **Indeterminacy:** No "true" initial ontology exists—the process *constructs* the ontology it needs.  
  - **Local determinacy, global fluidity:** Each step uses fixed descriptions, but the system evolves.  

  **Your examples get this right**, but note: it’s not specific to invention. Routine tasks (e.g., reclassifying a "cup" as a "paperweight") use lighter negotiation. What distinguishes your cases is the *depth* of re-ontologizing (e.g., letter → abstract relation) and its necessity for solution discovery.  

  **One thing or family?** A unified phenomenon: *ontic negotiation* scales from toy puzzles to scientific reasoning (e.g., redefining "phlogiston" as energy). The core is the same: entities are plastic until constraints "freeze" them.  

  ---

  ### 4. Boundary Cases  
  **a. Scrabble tile as letter vs. point object**  
  *Verdict:* **Not ontic negotiation.**  
  *Why:* The dual identity (letter/point value) is predefined and stable; no global remapping occurs during play.  

  **b. Quantum particle as wave vs. particle**  
  *Verdict:* **Not ontic negotiation.**  
  *Why:* The duality is inherent to the entity, not a problem-solving redescription. Context selects a fixed aspect.  

  **c. Chess pawn becoming a "queen" upon promotion**  
  *Verdict:* **Negotiation.**  
  *Why:* The pawn’s *role* (low-value piece → monarch) is redefined by board-state constraints, retrospectively altering its "purpose" in earlier moves.  

  **d. Reinterpreting "mass" in Newtonian vs. relativistic physics**  
  *Verdict:* **Negotiation.**  
  *Why:* Solving gravitational problems forces "mass" to shift from invariant scalar to energy-dependent property, with earlier equations re-read as approximations.  

  ---

  ### 5. Name and Verdict  
  **Verdict:** No existing term suffices. "Ontic negotiation" best captures the phenomenon.  
  **Proposed term:** **Ontic negotiation**  
  **Definition:** *The dynamic, constraint-driven re-categorization of an entity’s fundamental type during problem-solving to resolve systemic inconsistencies, resulting in retrospective coherence.*  
  **Distinguish from:** *Pragmatic enrichment* (which enriches meanings but doesn’t alter ontological categories) and *conceptual change* (which is diachronic, not task-internal).
