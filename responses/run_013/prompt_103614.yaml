prompt: |-
  Someone in my climate ethics reading group keeps saying that pure time preference is irrational whenever anyone mentions a social discount rate, as if that settles whether we should use 0%, 1.5% or 3% in a cost-benefit model. I want to push back but I can't tell which of the many things that sentence could mean she's actually claiming. Can you seperate out the precise theses it could stand for, from the trivial to the radical, and for each say whether it's plausible, whether it's normative or descriptive, and whether it would actually dissmiss a discount rate? I'm especially interested in readings that turn on the difference between discounting utility and discounting consumption, the difference between pure time preference and discounting for risk of extinction or growth, the person-affecting vs impersonal readings, the non-identity problem, variable value, time consistency, infinite horizons, and whether the claim is about individuals, governments, or the whole intergenerational sequence. Don't give me a reading list, just the menu and your verdicts. Please write in British English and structure it as: Where I'm coming from (2-3 sentences); The menu (7-9 numbered readings, one or two sentences each); Verdicts (a short paragraph or table for each reading, saying trivial, substantive-but-defensible, substantive-but-false, or confused, and whether it gets her conclusion); Which one she probly means (one short paragraph); Bottom line (2-3 sentences).
