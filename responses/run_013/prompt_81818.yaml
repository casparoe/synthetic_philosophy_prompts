  ### Structured Plan for Your Joint Reading Group Session  
  **Total Time:** 60 minutes  
  **Goal:** Avoid philosophical deadlocks on "realism" while clarifying revealed preference (RP) and utility. Start with observable choices, build to axioms, then utility as representation. Defuse "is utility real?" early.  

  ---

  ### **Sequence of Topics, Timing, and Rationale**  
  **Core Principle:** Utility is a *representation* of consistent choices, not an inner state. Prioritize choices → inconsistency → axioms → utility.  

  1. **Start with Raw Choice Data (5 minutes)**  
     - **What:** Present a simple, visceral example (no budgets, no curves). Use the **carrying task** (below).  
     - **Why:** Philosophers and economists both "see" choices without theory-laden terms. Avoids smuggling in utility.  
     - **Why now?** Must begin with observables to ground everything. If you start with axioms or utility, philosophers fixate on metaphysics, economists dismiss.  

  2. **Reveal Inconsistency (10 minutes)**  
     - **What:** Show a violation of consistency using the carrying example. Contrast with a consistent version.  
     - **Why:** Forces both groups to *feel* the problem: "We can’t make sense of this." Creates demand for an axiom.  
     - **Why now?** Premature axioms seem arbitrary; inconsistency motivates them. Utility is irrelevant here.  

  3. **Introduce the Axiom (WARP) as a Consistency Constraint (5 minutes)**  
     - **What:** Weak Axiom of Revealed Preference (WARP): If choice A is revealed preferred to B, B can’t be revealed preferred to A in any observation.  
     - **Why:** Axioms are *rules for interpreting choices*, not assumptions about psychology.  
     - **Why now?** Only after inconsistency is felt. Axioms resolve the problem exposed in Step 2.  

  4. **Build Preference Ordering from Consistent Choices (5 minutes)**  
     - **What:** If choices satisfy WARP, we construct a ranking (e.g., "Box A ≻ Box B ≻ Box C").  
     - **Why:** Shows RP is *inferential*: we *discover* a ranking from choices, not define preferences as "whatever is chosen."  
     - **Why now?** Must come after axioms—they enable the construction.  

  5. **Define Utility as a Representation (5 minutes)**  
     - **What:** Utility is a numerical label for the ranking (e.g., assign u(A)=3, u(B)=2, u(C)=1). Emphasize: any monotonic transformation works.  
     - **Why now?** Utility depends on the ranking, which depends on consistent choices. Reverse order (utility first) invites "realism" debates.  
     - **Address "Is utility real?" here:**  
       - **Say aloud:** "Utility isn’t a feeling, brain state, or ‘real’ entity in this framework. It’s a tool—like numbering pages in a book to find chapters faster. The numbers aren’t in the book; we add them for convenience. If choices are consistent, we can ‘number’ the ranking. If not, we can’t. Philosophers: this sidesteps metaphysics. Economists: this is all we need for modeling."  

  6. **Carrying Example Deep Dive (10 minutes)**  
     - **The Setup:**  
       - Observer records a worker carrying one box/day when offered pairs. Boxes have objective traits (weight, volume), but *no inner states are reported*.  
       - **Consistent Version:**  
         - Day 1: Offered {Box A (5kg, 10L), Box B (10kg, 5L)} → chooses A.  
         - Day 2: Offered {Box B, Box C (15kg, 15L)} → chooses B.  
         - Day 3: Offered {Box A, Box C} → chooses A.  
         - *No cycle. We infer A ≻ B and B ≻ C, so A ≻ C. Utility u(A)>u(B)>u(C) captures this.*  
       - **Inconsistent Version (Violation):**  
         - Day 1: {A, B} → chooses A (A ≻ B).  
         - Day 2: {B, C} → chooses B (B ≻ C).  
         - Day 3: {A, C} → chooses C (C ≻ A).  
         - *Cycle! A ≻ B ≻ C ≻ A. WARP violated (C ≻ A contradicts implied A ≻ C from transitivity).*  
     - **Why This Works:**  
       - **Has:** Observable acts (no budgets/prices, so no "utility lurking in curves"), traits to tempt ad hoc explanations (e.g., "prefers lighter?" but Day 3 breaks that).  
       - **Lacks:** Any reference to utility, budgets, or time-based price changes (which imply hidden structure).  
       - **Feel the Difference:**  
         - "Assuming consistency" = "We demand A ≻ C on Day 3 to fit our model."  
         - "Finding consistency" = "Day 3’s choice completes a pattern we can rationalize."  
     - **Why No Time/Price Changes:** Prices imply a budget constraint, which smuggles in optimization (a utility function is assumed). This example is "purer."  

  7. **Misconceptions Breakdown (15 minutes)**  
     Tackle *during* the relevant step. Let (a) linger until Step 4; others addressed immediately.  

     | Misconception | When It Arises | How to Head Off | Let It Sit? |
     |---------------|----------------|-----------------|-------------|
     | **(a) "Preferences are defined as choices" (pure behaviorism)** | Steps 1–2 (seeing choices raw). | In Step 4: "RP doesn’t define a preference for every pair—only when choices are consistent and we can *infer* a ranking. Inconsistent choices = no ranking." | Yes, until Step 4. Useful: Shows behaviorism isn’t enough; consistency is active. |
     | **(b) "Utility is a feeling"** | Step 5 (utility introduced). | At utility definition: "Here, utility isn’t a psychological primitive. It’s a shorthand for the ranking *we constructed* from choices. Feelings may exist, but we don’t need them for RP." | No. Kill immediately. |
     | **(c) "WARP is empty/true of everyone"** | Step 2 (inconsistency shown). | Point to the cycle: "This person violates WARP. We see this in experiments (e.g., decoy effects). RP isn’t tautological—it’s a substantive constraint." | No. Use the example to prove it’s falsifiable. |
     | **(d) "Violators are irrational"** | Step 2–3 (inconsistency → axiom). | "WARP defines ‘rationality’ as consistency with a stable ordering. But this is technical. Violators could be learning, context-dependent, or using rules RP doesn’t capture. Normative? Not here—RP is descriptive." | Briefly. Let economists nod, then clarify: "It’s a modeling choice, not a moral claim." |

  8. **Final Question to Test Understanding (5 minutes)**  
     - **Ask:** *"In the carrying example, if on Day 3 the worker chooses A over C (consistent with Days 1–2), but on Day 4 we see them choose C over A when offered {A, C} again, does this violate WARP? Why?"*  
     - **Why it separates reciters from understanders:**  
       - Reciter: "WARP says no cycles," but misses direct comparison.  
       - Understander: "Yes—Day 3 implies A ≻ C, Day 4 directly shows C ≻ A for the same pair. This violates WARP (direct reversal)."  

  9. **What to Cut (Announce Upfront)**  
     - **Formal proofs:** Existence theorems for utility functions.  
     - **Empirical testing:** Treating axioms as falsifiable hypotheses (e.g., Afriat’s efficiency index).  
     - **Advanced axioms:** SARP, GARP.  
     - **Announce:** "To focus on foundations, we’re cutting proofs, empirical applications, and advanced axioms. Goal: clarity on what RP *is* and what utility *represents*."  

  ---

  ### **Why This Sequence Works**  
  - **Philosophers** get "realism" addressed upfront (Step 5) without derailing the session. The carrying example lets them engage with choices-as-data.  
  - **Economists** see axioms as practical tools (not dogmas) and utility as modeling infrastructure.  
  - **All** experience the "aha" of inconsistency (Step 2) before technicalities. By the time utility appears, it’s an anticlimactic tool—not a mystery.  

  **Stick to the script:** If "realism" resurfaces, defer to Step 5: "We’ll tackle that when utility enters—it’s coming, and I promise it’s not evasive."
