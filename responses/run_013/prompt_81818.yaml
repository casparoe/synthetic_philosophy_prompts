     - Show a non-violating example and construct the implied ranking.

  5. **Utility as a Representation (5 minutes)**
     - Now we can say: if we have a consistent set of choices (satisfying the axioms), then there exists a preference ordering (a complete, transitive, etc. relation) that rationalizes the choices. 
     - And then we can assign a utility function that represents that ordering. Any monotonic transformation of that function would do. 
     - So utility is just a numerical representation of the ordering that we constructed from the choices. It is not a psychological entity; it is a tool for representing the ordering.

