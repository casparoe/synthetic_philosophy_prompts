prompt: |-
  I'm running a joint reading group next week on revealed preference and on what 'utility' is even supposed to mean after it — half econ PhD students, half philosophy grad students, sixty minutes, whiteboard, and I'm the one presenting. Don't explain the topic to me; plan how I should explain it. What has to come first and what depends on what? My instinct is to put the axiom up first and then say 'so utility is just a representation of the ranking,' but I think that's backwards, because the philosophers in the room will spend the whole hour asking whether the utility is real while the economists keep saying it doesn't matter, and nobody will have learned anything. So give me the sequence, the reason each piece can't come earlier, and tell me where in that sequence the 'but is it real' question gets its answer — or whether at this level it should get an answer at all, and how I say that out loud without sounding evasive.

  The carrying example matters more than anything else, so be opinionated about it. I don't want the standard two-good budget line with indifference curves drawn in, because that smuggles in exactly the thing I'm trying to hold back — a utility function that's already there, just not named. I want an example where the person never says a word about their inner states and the consistency constraint still does visible work, and where a student can feel the difference between 'we're assuming they're consistent' and 'we've found out they're consistent.' Tell me what the example has to have and what it has to lack for that to land, and whether it needs a time dimension at all (same person, prices moved between two occasions) or whether that gives away the game too early. Then the misconceptions. I'm expecting at least: (a) 'revealed preference means preferences are defined as whatever you happen to choose' — the pure behaviorist reading; (b) 'utility is a feeling and this is just a trick for not talking about it'; (c) 'the constraint is basically empty, it's true of everyone'; (d) 'someone who violates it is being irrational.' For each one, tell me where in my sequence it gets formed, where I head it off, and which of them I should let sit uncorrected for a while on purpose because it's doing useful work. Also give me one question to ask at the end that would actually separate a student who got it from one who can recite the axiom, and tell me what to leave out — I'm figuring the formal proofs and the empirical work that treats the axiom as a testable hypothesis rather than a definition, but say so if you'd cut something else — and remind me to announce the cuts in the room so nobody feels cheated. American English please.
