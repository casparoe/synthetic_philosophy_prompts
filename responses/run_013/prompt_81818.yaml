  We are planning a 60-minute session for a mixed group of econ and philosophy students on revealed preference and the meaning of utility. The goal is to structure the presentation to avoid the philosophers getting stuck on "is utility real?" while the economists dismiss it, and to use a clear example that doesn't presuppose a utility function.

  Key structural principles:
  1. Start with observable data, not axioms or utility.
  2. Build up the revealed preference idea from choices, then introduce the consistency condition (axiom) as a requirement for rationalizing choices by a preference ordering.
  3. Utility comes last as a representation of that ordering.

  Sequence:

  1. **Start with Choice Data (5-10 minutes)**
     - Present a simple choice scenario without any reference to preferences or utility. Example: "Imagine we observe a person in a supermarket. On Monday, when apples cost $1 and bananas cost $2, they buy 2 apples and 1 banana. On Tuesday, apples cost $2 and bananas cost $1, and they buy 1 apple and 2 bananas." Write the choices on the board.
     - Ask: "What can we say about what this person likes? Can we say they prefer apples to bananas or vice versa?" 
     - Point: Without more, we can't say much. We have two isolated choices.

  2. **Introduce the Idea of Revealed Preference (10-15 minutes)**
     - Define the direct revealed preference relation: "We say that bundle A is directly revealed preferred to bundle B if the person chose A when B was available (and cost the same or less)." In the example, on Monday they chose (2 apples, 1 banana) when (1 apple, 2 bananas) was also affordable (since 2*1 + 1*2 = $4 and 1*1 + 2*2 = $5? Wait, let's fix the example to make sure bundles are comparable).

     Let me fix the example to make the budget sets clear:

     - Monday: Prices (p_a=1, p_b=2). Income = $4. 
          Chosen bundle: (a1, b1) = (2,1) [cost: 2*1 + 1*2 = $4]
          Alternative bundle: (1,2) costs 1*1+2*2= $5 > $4 -> not affordable. So we don't have a direct revealed preference comparison with (1,2) because it wasn't affordable.

     We need an example where two different bundles are affordable in the same budget set? But the point of revealed preference often comes when we compare across different budgets.

     Revised example (two goods, two periods):

     - Observation 1: Prices (p1, p2) = (1,2), income = $4. Chosen bundle: A = (2,1).
          Affordable set: { (x1,x2) | x1+2x2 <=4 }.
          Note: Bundle B=(1,2) costs 1+4=5>4 -> not affordable.

     - Observation 2: Prices (p1, p2) = (2,1), income = $5. Chosen bundle: C=(1,2).
          Affordable set: { (x1,x2) | 2x1+x2 <=5 }.
          Now, note that bundle A=(2,1) costs 2*2+1*1=5, which is exactly the income -> affordable.

     So in Observation 2, when the consumer chose C=(1,2), bundle A=(2,1) was affordable (because 2*2+1*1=5<=5). Therefore, we can say that the consumer revealed that they prefer C over A? Wait, no: they chose C when A was available. So we say that C is directly revealed preferred to A.

     But note: in Observation 1, when they chose A, bundle C was not affordable (because at prices (1,2), bundle C=(1,2) costs 1*1+2*2=5>4).

     Now, we have:
          In Obs1: A is chosen. Nothing else is revealed because no other bundle in the budget set was chosen (and we don't have multiple choices in one set).
          In Obs2: C is chosen, and A was affordable but not chosen -> so C is directly revealed preferred to A.

     But we haven't connected A and C in a way that creates a contradiction? We need an example that violates consistency.

     Let me create a violation:

     Example with violation:

          Obs1: Prices (1,2), income=4, chosen A=(2,1). 
          Obs2: Prices (2,1), income=5, chosen B=(0.5, 4). 
            Check: At Obs2, A=(2,1) costs 2*2+1*1=5, so A is affordable. But the consumer chose B=(0.5,4) which costs 2*0.5+1*4=1+4=5. So we have that B is directly revealed preferred to A.

          Now, what if we also have:
          Obs3: Prices (1,1), income=3. 
            What bundles are affordable? x+y<=3.
            Suppose the consumer chooses A=(2,1) (cost=3). Then note that bundle B=(0.5,4) is not affordable because 0.5+4=4.5>3. So no direct comparison.

          We need a chain. How about:

          Obs1: A chosen when ... (as above) 
          Obs2: B chosen and A was affordable -> B directly revealed preferred to A.

          Now, in Obs3: Prices (1,1), income=3. 
            Suppose the consumer chooses A=(2,1). 
            But note: bundle C=(1,2) is affordable? 1+2=3. 
            And we haven't seen C before.

          We need a third observation that creates a cycle? Let me try a standard example:

          Three observations:

            Obs1: Prices (1,2), income=4 -> chosen A=(2,1). 
            Obs2: Prices (2,1), income=5 -> chosen B=(1,2) [note: at these prices, A=(2,1) costs 4+1=5, so affordable. So B is chosen when A is affordable -> B R_d A.

            Now, at Obs1, when A was chosen, was B affordable? At prices (1,2), B=(1,2) costs 1*1+2*2=5>4 -> not affordable. So we don't have A R_d B.

            Now, Obs3: Prices (1,1), income=3. 
            Suppose the consumer chooses A=(2,1) (cost=2+1=3). 
            Now, at Obs3, B=(1,2) is affordable? 1+2=3. But they didn't choose B. So we have A chosen when B is affordable -> A R_d B.

