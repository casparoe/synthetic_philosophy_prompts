     - State the Weak Axiom of Revealed Preference (WARP): If bundle x is directly revealed preferred to bundle y, then y cannot be directly revealed preferred to x.
     - In our example, we have a violation. So the choices are inconsistent with any stable preference ordering.
     - Ask: "What does this inconsistency mean? It means we cannot explain these choices by a single, stable ranking of bundles." 
     - Note: We are not assuming the person has a preference ordering. We are saying: if we want to interpret the choices as coming from a stable preference, then we require consistency. Without it, we cannot assign a preference ordering that rationalizes the choices.

  4. **Building the Preference Ordering (5 minutes)**
