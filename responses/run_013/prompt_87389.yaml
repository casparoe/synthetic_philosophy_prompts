prompt: |-
  Ok so context: I'm a 3rd-year PhD student, officially in an econ dept but my work is really decision theory / phil of action, and I've been roped into running the next session of our little cross-department reading group. It's about 8 people, mix of game theorists and philosophy-of-action folks, all comfortable with basic Bayesian decision theory, two of them have Strong Opinions about Newcomb's problem, and thats roughly the ceiling of the room. My topic got assigned as "evidential cooperation in large worlds," which nobody in the group has heard of, so I can't lean on prior reading. I don't want you to explain the idea to me — I basically get it, I think — I want a plan for how to *teach* it in 75 minutes, because I've now tried twice to explain it off the cuff and both times it went off the rails: half the room decided I was doing mysticism, and the other half decided it was just ordinary causal bargaining wearing a hat, and after that the session was dead.

  Here's the thing I need to land. Two agents who will never interact causally — no signals, no precommitment devises, no shared ancestry, nothing — but who are similar enough that one agent's choice of policy counts as evidence about what the other will do, can both do better by adopting a cooperative / compromising policy. The gains come precisely from that evidential link: choosing to cooperate is like a unilateral move that nonetheless shifts both payoffs. And the juicy part is when their values *differ*, because then there's a real question about which compromise to adopt, and the answer has to be something both can coordinate on without communicating (a Schelling-point problem, and I'd rather not put "Nash bargaining solution" on a slide until they've felt the need for it themselves). There's also a mean little issue where some subset of the cooperators can do better by walking away from the agreed compromise, and I'd love them to hit that wall on their own rather than have me announce it.

  So what I want from you: the order the pieces have to go in so the conclusion feels forced rather than spooky, and why each piece has to come before the next. What's the one example that should carry the whole session — and what does it have to *not* have? My instinct was to build it on Newcomb's problem, but I'm worried that drags in twenty minutes of evidential-vs-causal decision theory and we never come back; tell me if I'm wrong. Then the misconceptions you'd expect this particular audience to form, and exactly where in the sequence each one needs to be headed off: my guesses are (a) "this is just causal influence in disguise," (b) "it only works if the other agents are literally identical / copies of me," (c) "it's wishful thinking that depends on the universe being infinite or on me being a Boltzmann brain," and (d) "if their values differ from mine, why on earth would I compromise instead of just doing my own thing." Also: one question I can put at the end that actually discriminates between them getting the mechanism and them just nodding along, and what I should explicitly refuse to cover at this level (and say out loud that I'm refusing). Please no reading list, half of them will just skim it and come back with worse intuitions than they started with.
reasoning: |-
  Okay, the user is a 3rd-year PhD student running a reading group on "evidential cooperation in large worlds." They've had trouble explaining it before, with the group splitting into factions—one thinking it's mysticism, the other seeing it as causal bargaining in disguise. The core idea is cooperation without causal interaction, purely through evidential links, especially when values differ. They need a teaching plan for 75 minutes that avoids past pitfalls.

  First, I need to understand the key challenges. The audience includes game theorists and philosophy-of-action folks, all familiar with basic Bayesian decision theory. Two have strong opinions on Newcomb's problem, which could derail things. The main misconceptions to address are: (a) it's just causal influence in disguise, (b) requires identical agents, (c) depends on infinite universes or Boltzmann brains, and (d) why compromise if values differ.

  The user wants the conclusion to feel forced, not spooky. They mentioned using an example that avoids certain pitfalls. Newcomb's problem is tempting but risky because it might lead to a 20-minute debate on evidential vs. causal decision theory. I need an alternative example that sidesteps this. The Twin Prisoners Dilemma comes to mind—it's simple, isolates evidential links, and avoids causal entanglement. 

  The structure of the session is crucial. Starting with a familiar concept like the Prisoner's Dilemma (PD) makes sense. But the Twin PD variant removes any possibility of causal interaction. Emphasizing that the agents are isolated and can't signal is key to prevent the "causal influence" misconception. Visual aids like a payoff matrix without communication lines would help.

  Next, introducing the evidential link through similarity. The agents aren't identical but similar enough that one's choice is evidence about the other's. This tackles misconception (b). Using a scenario like two unrelated but similarly-thinking philosophers in different galaxies could illustrate this without implying clones.

  The compromise issue arises when values differ. Switching to a Stag Hunt with asymmetric payoffs shows how both gain by coordinating on a compromise. The Schelling point here could be the Pareto improvement without needing Nash bargaining upfront. Letting the group realize the need for a coordination mechanism organically is better.

  Then, the betrayal problem: some might defect from the compromise. Presenting a three-agent scenario where one defects forces them to confront this. The user wants them to hit this wall themselves, so posing it as a question rather than stating it would work better.

  Timing is tight. Allocating specific minutes for each section ensures coverage without rush. Starting with Twin PD (15 mins), then Asymmetric Stag Hunt (20 mins), followed by Betrayal Problem (15 mins), and wrapping up with implications and Q&A (25 mins). 

  Common misconceptions should be addressed as they naturally arise. For example, when explaining the Twin PD, explicitly state there's no causal link to preempt (a). During the similarity discussion, clarify that agents aren't identical to counter (b). For (c), mention that the scenario doesn't rely on exotic physics. For (d), use the asymmetric payoffs to show mutual benefit despite differing values.

  The exit question should test understanding. Asking them to design the worst-case scenario for cooperation would reveal if they grasp the evidential dependence. Avoiding topics like infinite worlds or bargaining solutions keeps focus sharp. 

  The user emphasized not providing a reading list, so sticking to in-session materials is important. Visuals and guided examples will help more than external references. 

  Overall, the key is sequencing the concepts so each step builds logically, forcing the conclusion without seeming mystical. Starting simple, addressing misconceptions proactively, and letting the audience discover the pitfalls themselves should make the session effective.
answer: |-
  Here's a battle-tested teaching sequence designed to force the conclusion, avoid mystical vibes, and preempt common misconceptions for your specific audience. The core is **relentless focus on the evidential link as the *only* mechanism**, using carefully constrained examples.

  **Core Example:** **The Twin Philosophers' Dilemma (with variations)**  
  *Why it works:* Isolates the evidential link, avoids Newcomb's Omega/prediction baggage, feels "phil of action" native, values asymmetry is natural.  
  *What it MUST avoid:* Prediction, acausal signalling, shared environment, identical utility functions, or any hint of causal interaction. Agents are *similar*, not identical, and utterly isolated.

  **The 75-Minute Sequence (Key: Build the *Need* for Each Step):**

  1.  **Grounding in the Familiar & Isolating the Mechanism (15 mins):**
      *   **Start with Standard PD:** Remind them of the payoff matrix. Why defect dominates. "What if you could communicate? Precommit? Repeated interaction?" (Get them nodding). *Then nuke those options.*
      *   **Introduce the Twin Scenario:** "Two philosophers (A & B). Each faces an *identical, isolated* PD against a distinct, non-overlapping opponent. **Crucially:** They are physically isolated (different galaxies, no possible signals EVER). They have never met. BUT: They know they are *very similar* – same training, read the same papers, likely to reason similarly about decisions. Choosing happens simultaneously." Show the *same* PD matrix for each.
      *   **The Question:** "Agent A, knowing all this, is deciding their strategy. Should they Cooperate or Defect? *Why?*" (Let discussion brew – expect CDT arguments for Defect).
      *   **Force the Evidential Link:** "Agent A thinks: *'If I choose to Cooperate, what does that tell me about B? Well, since we're so similar, and likely to reason the same way... me choosing C is strong evidence that B is also likely to choose C! And if B chooses C, my payoff for C is higher than if I choose D and B chooses C. Hmm.'*" **Visually:** Add a dotted "Evidential Link" arrow between A's choice and B's predicted choice on the slide. Label it "Similarity → Evidence".
      *   **Preempt Misconception (a) & (b):** "Is A *causing* B to cooperate? NO. Impossible. Signals? NO. Are they identical clones? NO. Just similar enough that A's *own* choice is diagnostic evidence about what another similar agent *in a separate, identical situation* is likely to do. This evidence exists solely in A's mind."

  2.  **Introducing Value Conflict & The Need for Compromise (20 mins):**
      *   **Modify to Asymmetric Stag Hunt (The Philosophers' Compromise):** "New scenario. A & B are still isolated, similar, no communication. Each faces a *Stag Hunt* against their own separate opponent. BUT: A values Stag more (U=3), Hare less (U=1). B values Hare more (U=3), Stag less (U=1). The *coordination bonus* remains: If both hunt Stag, both get their preferred outcome *plus* a coordination bonus (+1 util each!).
          ```
          Agent A's Payoffs (vs Own Opponent):
              | A Hunts Stag | A Hunts Hare
          --------------------------------------
          B Hunts Stag | 3 (Stag) + 1 = **4** | 1 (Hare) = **1**
          B Hunts Hare | 3 (Stag) = **3**     | 1 (Hare) = **1**

          Agent B's Payoffs (vs Own Opponent):
              | B Hunts Stag | B Hunts Hare
          --------------------------------------
          A Hunts Stag | 1 (Stag) + 1 = **2** | 3 (Hare) = **3**
          A Hunts Hare | 1 (Stag) = **1**     | 3 (Hare) = **3**
          ```
          *Note:* Without the bonus, their dominant strategies conflict. The +1 bonus creates mutual gain *only* if they coordinate on the *same* action, even if it's not their individual favorite baseline.
      *   **The Problem:** "Agent A *wants* to Hunt Stag (prefers 3>1 baseline). Agent B *wants* to Hunt Hare (prefers 3>1 baseline). BUT, if they just do their own thing, A hunts Stag, B hunts Hare, both get only their baseline (A=3, B=3). If they could somehow *both* Hunt Stag, A gets 4, B gets 2. If they both Hunt Hare, A gets 1, B gets 4. **Neither can force the other!**"
      *   **The Evidential Question:** "Agent A thinks: *'My choice is evidence about B's choice. If I choose to Hunt Stag, that's evidence B also Hunts Stag (since we're similar, and B knows I prefer Stag...). Then I get 4! But B only gets 2... If I choose Hare, evidence B chooses Hare, I get 1, B gets 4. Hmm. 4 > 1 for me, but 2 < 4 for B... Is there a better way?'*" (Pose the same for B).
      *   **Trigger the Insight:** "Can they *both* do better than (3,3) *without communication*? What action could they both choose, knowing their choice signals the other to choose the same, leading to a *compromise* outcome?" (Guide them: Both Stag gives (4,2) - good for A, bad for B. Both Hare gives (1,4) - bad for A, good for B. (3,3) is worse than both compromises! The compromise outcomes (4,2) and (1,4) are Pareto improvements over non-coordination (3,3). *They need to coordinate on one of them*.)
      *   **Preempt Misconception (d):** "Why wouldn't A just Hunt Stag hoping for 4? Because if they just do their own thing without considering the evidence link, they *only* get (3,3). To access the bonus +1, they *need* to coordinate, and coordination requires choosing an action *expecting the other to match it via the evidential link*. Doing 'their own thing' (A:Stag, B:Hare) forfeits the bonus." **Emphasize:** The gains ONLY come from leveraging the evidential link to coordinate.

  3.  **The Schelling Point & Betrayal Problem (15 mins):**
      *   **The Coordination Problem:** "Okay, compromises (Both Stag or Both Hare) are better than (3,3). But which one? A prefers Both Stag (4>1). B prefers Both Hare (4>2). How do they coordinate without communication?"
      *   **Schelling Point Emergence:** "What's salient? Maybe the *action name*? 'Stag' might feel more 'cooperative'? Maybe the *less bad* compromise? Both Stag gives B 2, Both Hare gives A 1. 2 > 1, so Both Stag is less bad for the loser? Or maybe they flip a mental coin?" **Let them brainstorm.** (Plant the seed of Nash Bargaining without naming it: "Is there a point where the product of gains is maximized?"). *Don't resolve it yet.*
      *   **Introduce Betrayal:** "Assume they vaguely settle on 'Both Stag' as the compromise. Now, Agent A thinks: *'If I expect B to Hunt Stag because of our similarity and this vague agreement... what if I actually Hunt Hare instead? If B Hunts Stag (as evidence suggests), then I get 3 (Stag payoff for me) instead of 4? Wait no...'*" **Force them to calculate:**
          *   A Cooperates (Hunts Stag): Expects B Hunts Stag -> A gets **4**.
          *   A Defects (Hunts Hare): BUT! If A Hunts Hare, that is *evidence* that B is *also* likely to Hunt Hare (similarity!). So A expects: B Hunts Hare -> A gets **1**.
          *   **4 > 1.** Defecting is worse! *Because defecting erodes the evidence that the other cooperates.*
      *   **The Wall:** "The very act of considering defection weakens the evidential link supporting the payoff from defection! In this setup, once the compromise is vaguely established, sticking to it is stable *for each individual* because deviating predicts the *other* also deviates, destroying the bonus. The threat is *evidential*, not causal." (Preempts the "why cooperate?" part of (d)).

  4.  **Synthesis, "Large Worlds", and Q&A (25 mins):**
      *   **Recap the Mechanism:** 1) Isolation (no causal links). 2) Similarity (creates evidential link). 3) Strategic Choice (policy chosen knowing it's evidence about others). 4) Mutual Gain via Coordination (leveraging the link to achieve outcomes impossible otherwise). 5) Compromise (required when values differ). 6) Stability (defection undermines the evidential basis for its own payoff).
      *   **Why "Large Worlds"?** "The 'Large World' idea isn't mysticism or Boltzmann brains. It simply means: the agents recognize there might be *other* agents out there, similar enough to them, facing similar enough problems, that their own choice of policy (e.g., 'Always try to coordinate via similarity on Stag') could be correlated with those agents' choices *purely evidentially*. You don't need to know *who* or *how many*, just that the possibility exists and similarity creates the link. It scales the Twin Philosopher idea."
      *   **The Juicy Payoff:** "This is how compromise can emerge between rational agents with different values who cannot communicate or causally influence each other, purely through the recognition of their similarity and the evidential consequences of their own choices."
      *   **The Killer Exit Question:** "**What's the *most* important feature an agent needs to have to potentially benefit from evidential cooperation in large worlds, and why?**" (Target Answer: **Similarity to other agents** - because that's the *source* of the evidential link. If they say "rationality" or "knowledge of game theory", probe deeper: "Could two irrational but similar agents evidence-cooperate by accident?" (Yes, potentially) vs. "Could two perfectly rational but utterly dissimilar agents evidence-cooperate?" (No, no evidential link)).
      *   **Explicitly Out of Scope:**
          *   "We are **NOT** talking about causal influence, even disguised. The link is purely evidential."
          *   "We are **NOT** requiring identical agents or utility functions, just sufficient similarity."
          *   "We are **NOT** relying on infinite universes, Boltzmann brains, or exotic physics. This works in a single finite universe with sufficiently similar agents."
          *   "We are **NOT** solving the full bargaining problem today (though we see why it arises). We're establishing the *possibility* and *mechanism* of gainful compromise."
          *   "We are **NOT** covering logical uncertainty or self-reference in depth (e.g., Agent A modeling Agent B modeling Agent A...). We're treating the evidential link as a given black box from similarity." (This preempts mysticism and confusion).

  **Why this sequence works for your audience:**

  1.  **Starts Concrete (PD/SH):** Leverages existing knowledge without getting stuck in Newcomb.
  2.  **Force-Feeds Isolation:** Nuking causal options upfront makes the evidential link the *only* mechanism left.
  3.  **Value Conflict is Central:** It's not an afterthought; it's the driver for needing compromise and makes "just do your own thing" clearly suboptimal.
  4.  **Schelling Point Feels Natural:** They *want* a solution; introducing it as a problem primes them for bargaining later without needing the formalism now.
  5.  **Betrayal Backfires:** The calculation is simple and forces the conclusion that defection is self-undermining *because* of the evidential link.
  6.  **"Large Worlds" Demystified:** Framed as scaling up the twin scenario, not as metaphysics.
  7.  **Misconceptions Preempted Proactively:** Each step counters a specific likely error at the point it would arise.
  8.  **Exit Question Tests Core Mechanism:** Focusing on "similarity" discriminates deep understanding from surface-level agreement.

  **Key Delivery Tips:**

  *   **Use Clear Visuals:** Matrices, isolated agent diagrams, the dotted "Evidence" arrow.
  *   **Label the Gains:** Explicitly mark the "+1 Coordination Bonus" and where it comes from (leveraging the link).
  *   **Emphasize "Policy Choice":** Frame decisions as choosing a *rule* ("I cooperate with similar agents") not just a one-off action. This bridges to "large worlds".
  *   **Acknowledge the Weirdness:** "Yes, it feels spooky that your choice affects outcomes elsewhere without causation. That's why it's fascinating! The mechanism is *only* the updating of your own beliefs based on similarity."
  *   **Manage the Newcomb Veterans:** If they bring it up: "Great connection! Think of Omega as the *ultimate similar agent* who perfectly predicts you. But here, we don't need perfect prediction, just correlation from similarity, and crucially, *we're applying it between peers who both reason this way*, not just one agent vs. a predictor. We're also focusing on *compromise under conflict*, which Newcomb usually lacks." Then steer back to *your* example.

  This structure forces the logic, makes compromise necessary and beneficial, shows betrayal fails, and grounds "large worlds" in scalable similarity – all while systematically dismantling the misconceptions that derailed you before. Good luck!
