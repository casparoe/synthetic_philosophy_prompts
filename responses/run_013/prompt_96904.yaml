prompt: |-
  i'm putting together a spec for a working group before we commit to a fairness metric on a scoring model we're about to ship, and every time we argue about which metric we're really arguing about requirements nobody bothered to write down. so write them down. what does any adequate fairness criterion for a predictive scoring system have to deliver before we're even allowed to pick one?

  for each requirement: the case or consideration that forces it (the case, not just the label), whether it's non-negotiable or just a preference of one camp (group-parity people, individual-similarity people, the counterfactual crowd), and whether it constrains the score or only the decisions made from the score. then the part i actually need: which of these can't be jointly satisfied, and why. i'm fairly sure that once base rates differ across groups, wanting the score to mean the same thing in both groups and wanting the error rates to line up can't both hold -- give me the precise version, which ones drop out, and whether the conflict is a fact about the world (the base rates differ) or a fact about the definitions themselves.

  three things i want treated as candidate requirements even though i've mostly seen them mentioned as asides:

  - the score gets consumed by more than one downstream decision maker, and they each pick their own cutoff. so: fairness should be something certified at the score level that survives whatever threshold a downstream user chooses. genuine requirement, or disguised impossibility? say which.

  - composability: if two independently fair components get chained (one model's output feeding into another, or two fair scores averaged), should the result still be fair? should "closed under composition" be on the list, and what does keeping it there cost?

  - non-triviality: a criterion satisfied by a constant predictor, or by a model that just refuses to score anyone, is worthless. is that a real desideratum or am i smuggling in an accuracy preference? if its real, which of the usual metrics fail it?

  then rank the requirements by how many candidate metrics each eliminates, and tell me which single one does the most work. skip the full scorecard of every metric in the literature, i'll do that part myself. a table is fine if it helps.
reasoning: |-
  Okay, the user is putting together a spec for a working group on fairness metrics for a predictive scoring model. They're frustrated because arguments about which metric to use stem from unstated requirements. They need a clear breakdown of essential fairness requirements before selecting a metric.

  First, I need to identify what makes a fairness criterion adequate. The user wants requirements that any metric must meet, categorized by necessity (non-negotiable vs. preference), scope (score vs. decisions), and conflicts between them. They also have three specific candidate requirements to evaluate.

  Starting with core requirements. The first should be Unambiguity - a fairness definition must be mathematically precise. This is non-negotiable because without it, you can't measure or enforce fairness. It constrains the metric itself, not just decisions.

  Next is Measurability. You need observable data to compute the metric. If you can't measure it with available data, it's useless. Also non-negotiable, and it applies to the metric.

  Then there's Actionability. The metric should guide improvements. If it's impossible to satisfy, like requiring equal base rates when they naturally differ, it's not actionable. Non-negotiable for practical use.

  Group Validity is crucial too. The groups you're measuring (like race or gender) must be legally and ethically justified. This comes from anti-discrimination laws and is non-negotiable. It affects how you define groups but not scores directly.

  Now for contested requirements. Group Parity (equal outcomes) vs. Individual Similarity (similar scores for similar individuals). These conflict when base rates differ - you can't have both equal error rates and score meaning the same across groups. This is a mathematical conflict, not just about data.

  Counterfactual Fairness is another approach, considering what would happen under different group memberships. But it's hard to measure because it relies on untestable assumptions.

  For the three candidate requirements: First, Threshold Robustness. If downstream users set their own cutoffs, the score itself must be fair regardless of threshold. This leads to calibration, but conflicts with error rate balance when base rates differ. It's a preference, not absolute.

  Composability is about whether combining fair models stays fair. This is a preference that might conflict with other requirements. For instance, composing calibrated models might not stay calibrated.

  Non-Triviality means the metric shouldn't be satisfied by useless models like constant predictors. This is a real requirement because otherwise, fairness could be achieved without any predictive power. Metrics like demographic parity fail this if base rates differ.

  Conflicts arise mainly from differing base rates. For example, calibration (scores mean the same) and error rate balance (equal false positives/negatives) can't both hold if base rates differ - it's a mathematical impossibility.

  Ranking requirements by eliminations: Group Validity and Measurability eliminate metrics that use unobservable data or unjustified groups. Calibration is the most demanding because it requires specific score properties.

  The user's deeper needs include avoiding future rework by selecting a metric that fits all requirements, resolving team conflicts by clarifying trade-offs, and ensuring legal compliance. They might also want to prevent gaming of the system and ensure practical implementation. Highlighting mathematical impossibilities helps manage expectations and focus on feasible compromises.
answer: |-
  Here's a breakdown of essential requirements for any fairness criterion, structured for your spec. The conflicts arising from differing base rates are the core mathematical hurdle, and I'll clarify that precisely.

  ### Core Requirements (Non-Nnegotiable - Must Be Satisfied)

  1.  **Unambiguity (Definitional Rigor):**
      *   **Case:** Without a mathematically precise definition, "fairness" is subjective. Teams argue past each other, audits fail, and legal challenges are harder to defend. ("We said 'equal opportunity' but didn't specify *which* error rate!")
      *   **Non-Negotiable:** Absolute. A fairness metric that isn't rigorously defined is worse than useless.
      *   **Scope:** Constrains the metric definition itself.

  2.  **Measurability (Empirical Testability):**
      *   **Case:** A criterion requiring unobserved counterfactuals (e.g., "what *would* have happened if this person were a different race?") cannot be verified with real-world data, making compliance checks impossible and audits meaningless.
      *   **Non-Negotiable:** Absolute. If you can't measure it with observable data (features, scores, outcomes, protected groups), you can't enforce it.
      *   **Scope:** Constrains the metric – it must be computable from available data (X, S, Y, A, where A is group).

  3.  **Actionability (Achievability):**
      *   **Case:** Requiring equal positive rates (demographic parity) when base rates (P(Y=1|A)) differ significantly is often mathematically impossible without introducing randomness or explicitly using group membership in a way that might violate other principles. A criterion demanding the impossible paralyzes development and invites gaming.
      *   **Non-Negotiable:** Absolute. The criterion must be satisfiable *in principle* by *some* model trained on the available data, without violating fundamental constraints (like base rate differences).
      *   **Scope:** Constrains the feasibility of building models that satisfy the metric.

  4.  **Group Validity (Legally/Ethically Salient Groups):**
      *   **Case:** Fairness concerns arise specifically about discrimination against legally protected or ethically salient groups (e.g., race, gender, age). A criterion must specify *which* groups (A) it applies to. Applying it to arbitrary or non-salient groups dilutes its purpose.
      *   **Non-Negotiable:** Absolute. The metric is meaningless without defining the relevant protected attribute(s) and groups.
      *   **Scope:** Constrains the definition of the groups the metric applies to. Doesn't directly constrain scores/decisions, but defines the context.

  ### Contested Requirements (Reflecting Different "Camps")

  5.  **Group Parity (Balanced Outcomes):**
      *   **Case:** Concerns about systemic disadvantage, disparate impact, and equitable representation. E.g., lending approval rates shouldn't differ significantly by race if creditworthiness is equal (demographic parity), or error rates should be equal across groups (equalized odds/opportunity).
      *   **Negotiable/Preference:** Favored by the "group-parity" camp. Reflects a focus on equitable *results*.
      *   **Scope:** Primarily constrains *decisions* (e.g., approval rates, error rates). Some variants (like calibration) constrain the *score* meaning.

  6.  **Individual Similarity (Treatment Equality):**
      *   **Case:** Concerns about treating similar individuals similarly, regardless of group. E.g., two individuals with identical feature vectors X should receive similar scores (individual fairness) or similar likelihoods of positive outcomes (counterfactual fairness, similarity-based metrics).
      *   **Negotiable/Preference:** Favored by the "individual-similarity" camp. Focuses on procedural fairness at the individual level.
      *   **Scope:** Constrains the *score* or the *decision probability* for specific individuals.

  7.  **Counterfactual Validity (Causal Notions):**
      *   **Case:** Concerns that correlation isn't causation. True fairness requires considering what *would* have happened if group membership were different, holding legitimate factors constant. Aims to remove direct and indirect discrimination via proxies.
      *   **Negotiable/Preference:** Favored by the "counterfactual crowd". Requires strong (often untestable) assumptions about the data-generating process.
      *   **Scope:** Constrains the underlying *data-generating process* and the *model's relationship* to it. Impacts score interpretation/model design.

  ### Analyzing Your Candidate Requirements

  8.  **Threshold Robustness (Invariance to Cutoff Choice):**
      *   **Case:** Downstream users (loan officers, judges, HR) apply their own risk thresholds. Fairness defined only at one specific cutoff (e.g., FPR=0.1) fails if a user chooses a different threshold (e.g., FPR=0.2), potentially reintroducing bias. Requires fairness to hold *across all possible thresholds*.
      *   **Genuine Requirement or Impossibility?** **Genuine Requirement** for score-level certification. However, it **conflicts severely** with group parity metrics defined at a single threshold (like demographic parity or predictive parity at a point). Metrics satisfying threshold robustness usually involve **calibration** (P(Y=1|S=s, A=a) = s) or **separation** (P(S=s|Y=y, A=a) same across A). *Cost:* Insisting on this eliminates many popular single-threshold parity metrics. It strongly pushes towards calibration/separation criteria.

  9.  **Composability (Closed Under Operation):**
      *   **Case:** Complex systems involve model pipelines (e.g., risk score -> eligibility flag -> final offer) or ensembles. If Component A is "fair" and Component B is "fair", is the combined system fair? Desirable for modular design and accountability.
      *   **Should it be on the list?** **Preference, not a core requirement.** While desirable, demanding it universally is likely **too restrictive and costly**. Fairness is context-dependent; composing two models calibrated for different tasks likely breaks fairness. *Cost:* Insisting on composability might force overly simplistic definitions or limit model architecture choices. It's rarely a primary goal in fairness literature.

  10. **Non-Triviality (Avoids Degenerate Satisfiers):**
      *   **Case:** A constant predictor (always outputs 0.5) or a model refusing all applicants might satisfy some parity metrics (e.g., equal FPR/FNR = 0/1 or equal acceptance rate = 0). This is useless and doesn't reflect a genuine effort towards fairness.
      *   **Real Desideratum?** **Absolutely Real.** A fairness metric that can be perfectly satisfied by a model providing *zero utility* (no predictive power or no positive decisions) is meaningless as the *sole* criterion. It **is not** just smuggling in accuracy; it's about ensuring the fairness definition doesn't incentivize collapsing the system. Metrics failing this: **Demographic Parity** (satisfied by rejecting everyone), **Equalized Odds** (satisfied by a perfect classifier, *or* by a classifier making constant predictions per group if base rates differ - e.g., always predict negative for low-base-rate group, positive for high-base-rate group). Metrics generally satisfying it: **Calibration**, **Balance for the Positive/Negative Class** (require meaningful score distributions).

  ### The Core Conflict: Base Rates & The Impossibility

  *   **The Conflict:** You **cannot simultaneously satisfy all three** of the following when base rates (P(Y=1|A)) differ across groups:
      1.  **Calibration (Score Meaning):** P(Y=1 | S=s, A=a) = s for all s, a. (The score means the same probability of outcome Y=1 for everyone with score `s`, regardless of group).
      2.  **Equal False Positive Rate (FPR):** P(S > t | Y=0, A=a) is equal for all groups `a` at a given threshold `t`. (Balance for the Negative Class).
      3.  **Equal False Negative Rate (FNR):** P(S <= t | Y=1, A=a) is equal for all groups `a` at a given threshold `t`. (Balance for the Positive Class / Equalized Odds). *Note: Satisfying both (2) and (3) is "Equalized Odds".*
  *   **Which Ones Drop Out:** If base rates differ and you insist on **Calibration (1)**, you **cannot** have both **Equal FPR (2)** *and* **Equal FNR (3)**. You might satisfy one but not the other.
  *   **Nature of Conflict:** This is a **mathematical fact** arising directly from the definitions (specifically, Bayes' theorem and the law of total probability). Differing base rates are the *condition* that triggers this conflict, but the *incompatibility itself* is a logical consequence of the definitions of these three criteria.
  *   **Implication:** You must choose:
      *   **Calibration + Separation (e.g., Equalized Odds):** Requires the *score distributions conditional on the true label Y* to be identical across groups. This generally *breaks calibration* if base rates differ.
      *   **Calibration + Independence:** Requires the *score distribution* to be identical across groups (e.g., Demographic Parity). This generally *breaks separation* (Equalized Odds) if base rates differ.
      *   **A Single Threshold Metric:** You can satisfy Equalized Odds *at a specific threshold `t`* while also having approximate calibration, but this violates **Threshold Robustness (8)** as it won't hold for other thresholds.

  ### Requirement Ranking by Eliminative Power

  | Rank | Requirement          | Elimination Power                                                                                                | Key Metrics Often Eliminated                                                                 |
  | :--- | :------------------- | :--------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- |
  | **1** | **Actionability**    | Highest - If a metric is impossible to satisfy (e.g., DP with diff base rates), it's dead on arrival.            | Demographic Parity (when base rates differ), some strong causal criteria (untestable).       |
  | **2** | **Measurability**    | Very High - Can't use what you can't measure.                                                                    | Strong Counterfactual Fairness, Individual Fairness (without good similarity metric).        |
  | **3** | **Threshold Robustness** | High - Eliminates metrics defined only for a single threshold.                                                 | Predictive Parity, Demographic Parity, Equalized Odds *at a fixed threshold*.              |
  | **4** | **Non-Triviality**   | High - Eliminates metrics satisfied by useless predictors.                                                       | Demographic Parity (often), Equalized Odds (can be satisfied degenerately).                  |
  | **5** | **Unambiguity**      | Medium-High - Vague definitions are rejected, but most formal metrics pass.                                      | Poorly defined "bias scores", overly complex multi-component metrics without clear thresholds. |
  | **6** | **Group Validity**   | Low-Medium - Only constrains group definition, not the metric math itself.                                       | Metrics applied to arbitrary/non-salient groups.                                             |
  | **7** | Group Parity         | Contextual - Eliminates individual/counterfactual metrics if parity is mandated.                                 | Individual Fairness, Counterfactual Fairness.                                                |
  | **8** | Individual Similarity| Contextual - Eliminates group parity metrics if individual treatment is mandated.                                | Demographic Parity, Equalized Odds.                                                          |
  | **9** | Counterfactual Val.  | Contextual - Eliminates non-causal metrics if causality is required.                                             | Calibration, Equalized Odds, Demographic Parity.                                             |
  | **10**| Composability        | Low - Rarely a primary requirement; few metrics inherently compose well.                                         | Most metrics fail under naive composition.                                                   |

  ### The Most Impactful Requirement: Actionability

  **Why:** It fundamentally determines which fairness notions are even *viable* given the empirical reality of your data (specifically, differing base rates). Choosing a criterion like Demographic Parity when base rates differ **guarantees** failure unless you sacrifice accuracy entirely or engage in explicit (and likely illegal) group-based adjustment. It forces the team to confront the mathematical constraints upfront, moving the debate from abstract ideals ("we want equal outcomes!") to feasible solutions ("given base rate X vs Y, what *can* we achieve?"). It eliminates the largest class of impractical metrics immediately.

  ### Key Takeaway for Your Spec

  Before arguing metrics, **force agreement on these core requirements (1-4)** and explicitly decide on the contested requirements (5-10), especially **Threshold Robustness** and **Non-Triviality**. Crucially, **acknowledge the base rate conflict** mathematically: The team *must* understand that choosing Calibration precludes full Equalized Odds (and vice-versa) if base rates differ. Frame the metric choice as selecting *which* fairness properties are prioritized, knowing some desirable combinations are inherently incompatible. This shifts the discussion from "which is best?" to "which trade-offs align with our values and constraints?".
