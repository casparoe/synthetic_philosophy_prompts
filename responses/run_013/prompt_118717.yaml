              And they are not in contradiction? Because they also believe each ticket is a loser? 

              The problem is that they have asserted:
                 For each ticket i in the list: "i is a loser"
                 And also: "at least one ticket in the list is a winner"

              This is a contradiction. 

              So when the winning ticket is drawn, they have a false claim for that ticket (saying it's a loser) and the signed statement is true. But the set of claims is inconsistent.

              So we want them to see that they have asserted both P (for each i: loser) and not-P (that there is a winner in the list, which means at least one is not a loser). 

