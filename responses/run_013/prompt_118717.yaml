  ### **In-Class Exercise: Rational Acceptance Thresholds and Paradox Discovery**

  **Objective:** Students experience the Lottery and Preface Paradoxes through guided decision-making, discovering the collision between individual rational acceptance and collective consistency without prior labeling.

  **Materials:**
  - Paper for each group (3 groups of 6 students each)
  - Pens/markers
  - **Bag 1 (Lottery):** 100 numbered tokens (1–100) in a bag
  - **Bag 2 (Independent):** 10 tokens per group (9 blue/true, 1 red/false) + master list of 100 claim numbers (e.g., "Claim 1," "Claim 2," ..., "Claim 100")
  - **Scoring Tokens:** Small objects (e.g., beads) or tally marks to represent points
  - Optional: Prize privileges (e.g., bonus points, choosing discussion topics)

  ---

  ### **Rules and Setup**
  #### **Core Mechanics**
  - **Groups:** Divide into 3 groups (6 students each). Groups compete for tokens.
  - **Scoring Formula:**  
    **Score = (Number of true claims) × (Total claims in list)**  
    *Rationale:* Rewards volume and accuracy. Withholding claims (score=0) loses; blanket suspension is suboptimal. Adding claims increases potential points but risk.
  - **Signed Statement:** After listing claims, groups sign:  
    - **Lottery Round:** "All tickets in our list are losers."  
    - **Independent Round:** "All claims in our list are true."  
    *Rationale:* Forces commitment to the conjunction, making inconsistency tangible.

  #### **Round 1: Lottery Structure (Mutually Exclusive Claims)**
  - **Setup:**  
    - 100 lottery tickets; 1 winner (drawn randomly), 99 losers.  
    - Each claim: "Ticket [i] is a loser."  
  - **Group Task:**  
    1. Choose any number of tickets (1–100) to include in your list.  
    2. Write each claim (e.g., "Ticket 57 is a loser").  
    3. Sign the group statement: "All tickets in our list are losers."  
  - **Truth Determination:**  
    - Draw 1 token from Bag 1 (winner). Claims for losing tickets are true; claim for winning ticket is false.  
  - **Scoring Example:**  
    - Group lists 100 tickets → 99 true claims → Score = 99 × 100 = 9,900 tokens.  
    - Group lists 50 tickets, winner not included → 50 true claims → Score = 50 × 50 = 2,500 tokens.  

  #### **Round 2: Independent Structure (Fallible Claims)**
  - **Setup:**  
    - 100 independent claims (e.g., "Claim 1," "Claim 2").  
    - Each claim has 90% true probability (Bag 2: 9 blue/true, 1 red/false per group).  
  - **Group Task:**  
    1. Choose any number of claims (1–100) to include.  
    2. Write each claim (e.g., "Claim 33 is true").  
    3. Sign the group statement: "All claims in our list are true."  
  - **Truth Determination:**  
    - For each claim, draw from the group’s Bag 2 (blue = true, red = false). Draws are independent (replace token after each draw).  
  - **Scoring Example:**  
    - Group lists 20 claims, 18 true → Score = 18 × 20 = 360 tokens.  
    - Group lists 10 claims, all true → Score = 10 × 10 = 100 tokens.  

  #### **Anti-Cheat Safeguards**
  - **Mutually Exclusive Claims (Lottery):** Groups cannot list duplicates. All tickets are unique, preventing "same claim" escape.  
  - **Independent Claims (Preface):** Claims are predefined and uncorrelated (e.g., "Claim 1: Paris is in France," "Claim 2: Water boils at 100°C"). Groups select by number, not content.  
  - **Debrief Insight:** Escapes (e.g., copying claims) reveal that paradoxes require distinct, uncorrelated propositions. Correlation breaks independence.

  ---

  ### **Timeline (90-Minute Session)**
  1. **Introduction (5 min):**  
     - Explain scoring (Score = true claims × total claims) and goals.  
     - Emphasize: "Maximize tokens. You control how many claims to add."  

  2. **Round 1: Lottery Paradox (25 min)**  
     - Setup explanation (5 min).  
     - Group work (7 min): List tickets and sign statement.  
     - Draw winning ticket; score groups (5 min).  
     - Record scores (3 min).  

  3. **Round 2: Preface Paradox (25 min)**  
     - Setup explanation (5 min).  
     - Group work (7 min): List claims and sign statement.  
     - Truth draws; score groups (5 min).  
     - Record scores (3 min).  

  4. **Optional Round 3: Collective Statement (15 min)**  
     - **Task:** Each student submits 1 claim number anonymously. Teacher compiles a unique list (e.g., 18 claims). Class signs: "All claims in our list are true."  
     - **Truth Determination:** Draw for each claim using a central Bag 2.  
     - **Scoring:** Class score = (True claims) × (Total claims).  
     - **Debrief Point:** Group assertion is inconsistent, but individual credences (e.g., "My claim is 90% likely") remain defensible.  

  5. **Optional Variant: "At Least One False" (10 min)**  
     - **Task:** Groups sign: "At least one claim in our list is false" (Lottery or Independent round).  
     - **Scoring Adjustment:** Score = (True claims × Total claims) + 100 tokens if statement is true.  
     - **Debrief Insight:** Not self-contradictory, but combined with individual claims ("Each is true"), it creates inconsistency.  

  6. **Debrief (20 min):**  
     - Reveal paradox names only now. Map student actions to concepts:  
       - **Threshold View:** Believing claims above a probability threshold (99% lottery, 90% preface).  
       - **Closure under Conjunction:** Signing the conjunction forces groups to "believe" the entire list.  
       - **Collision:**  
         - Lottery: Flat contradiction (all tickets losers vs. one winner).  
         - Preface: Improbable conjunction (each claim 90% likely, but 20 claims → 12% likely all true).  
       - **Escapes:** Avoiding claims lowers scores; correlated claims break independence.  
     - **Unsimulatable Element:** Fixed thresholds (99%, 90%) are arbitrary. In reality, thresholds are context-dependent (e.g., stakes). Discuss how variable thresholds avoid paradox but introduce subjectivity.  

  ---

  ### **50-Minute Cut-Down**
  - **Skip Optional Rounds:** Omit Round 3 and Variant.  
  - **Shorten Group Work:** 5 min per round.  
  - **Condense Truth/Scoring:** 3 min per round.  
  - **Debrief:** 10 min (focus on Lottery vs. Preface failure modes).  
  - **Adjusted Timeline:**  
    - Intro (5 min).  
    - Lottery Round (15 min: 3 min setup, 5 min group work, 4 min draw/scoring).  
    - Preface Round (15 min: 3 min setup, 5 min group work, 4 min draw/scoring).  
    - Debrief (15 min).  

  ---

  ### **Predicted Challenges and Solutions**
  1. **Challenge:** Groups list few claims to avoid risk.  
     **Solution:** Remind them scoring rewards volume (e.g., "Listing 2 claims doubles potential points even with risk"). Use leading questions: "Can you maximize tokens by adding more?"  

  2. **Challenge:** Students protest independent claims are "meaningless."  
     **Solution:** Emphasize predefined content (e.g., "Claim 1: Everest is the tallest mountain") ensures independence. Debrief: "Real-world beliefs (e.g., in a book) are diverse."  

  3. **Challenge:** Truth-drawing takes too long.  
     **Solution:** Pre-draw truth values for claims (e.g., pre-generate a master list for Independent Round). For Lottery, draw one token publicly.  

  4. **Challenge:** Groups list all claims immediately.  
     **Solution:** This is ideal! They’ll see the paradox fastest. Debrief: "You maximized points but endorsed an inconsistent/conjunctively improbable statement."  

  **Frank Limitation:** The activity fixes probability thresholds (99%/90%). Real thresholds are fluid (e.g., high-stakes vs. low-stakes). **Supply by talking:** Discuss how pragmatic encroachment (adjusting thresholds by context) avoids paradox but erodes objectivity.  

  ---

  **Outcome:** Students internalize the paradoxes by experiencing rational acceptance thresholds breaking down. The debrief links their actions to epistemology’s core tensions: belief, closure, consistency, and the cost of withholding judgment.
