          For the independent round:
            They sign: "At least one claim in our list is false."

            Then if there is at least one false claim in the list, T=1, else 0.

            We can use the same scoring: 
               Score = (number of true claims)^2 / (number of claims) + K * T

            Expected score = E[ X^2/n + K*T ] = [ (0.09 + 0.81n) ] + K * (1 - (0.9)^n)

