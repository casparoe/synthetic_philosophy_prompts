                           = (m/100)[ (m-1)^2/m + K ] + (100m - m^2)/100
                           = (m/100)( (m-1)^2/m + K ) + (100m - m^2)/100
                           = ( (m-1)^2 + K*m )/100 + (100m - m^2)/100
                           = [ (m^2-2m+1) + K*m + 100m - m^2 ] / 100
                           = (98m + 1 + K*m) / 100

              We want this to increase with m? 

              We can choose K. For example, set K=100. Then expected = (98m+1+100m)/100 = (198m+1)/100 = 1.98m + 0.01 -> increasing in m.

