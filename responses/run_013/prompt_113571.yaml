  Summary of the game:

  Title: "The Beacon Activate Game"

  Materials: 
  - 16 envelopes, one for each player, containing their private clue (a card with their estimate of the safe threshold).
  - A facilitator's card with the true state (T=4) and the assignment of estimates (as above).
  - A way to collect decisions (e.g., a decision sheet for each round).

  Gameplay:

  1. Introduction (5 minutes): Explain the setting and rules. 
     - "You are regional directors. Each of you can choose to activate a Beacon in your region. 
     - If the total number of activations is within the safe threshold (T), then each director who activated gets +10 points. If the total exceeds T, then each director who activated gets -10 points. Those who did not activate get 0.
     - The safe threshold T is unknown to you. You have private information about T from your region.
     - Your goal is to maximize your own points."

  2. Round 1: Unilateral Action (10 minutes for decision, 5 minutes for reveal)
     - Each player reads their private clue (estimate of T).
     - They decide privately whether to activate or not. They write their decision on a slip of paper and hand it in.
     - The facilitator collects and counts the total activations.
     - Reveal: the true T=4. If total <=4, then activators get +10; else, activators get -10.
     - We expect total>4, so disaster. 
     - Note the player with estimate=2: they are likely not to activate? And they see the disaster happen.

  3. Reset and Round 2: Unanimity Rule (20 minutes for discussion and decision, 5 minutes for reveal)
     - "Now we reset to the same starting point (same state, same private information). But now, the rules have changed: any activation requires unanimous agreement by all 16 of you on which set of directors will activate. You must all agree on the same set. If you cannot agree, then no one activates."
     - They discuss to try to agree on a set. The facilitator times them (20 minutes).
     - If they reach agreement, then we activate that set. If not, then no activation.
     - Reveal: true T=4. If they activated a set with size<=4, then those activators get +10; if size>4, then activators get -10; if no activation, then 0 for all.
     - We hope that they cannot agree, so no activation? Or if they agree on a set>4, disaster? Or if they agree on<=4, good. But we want them to fail to act? So we hope for no agreement.

  4. Debrief (30-40 minutes): connect the experience to the unilateralist's curse.

  Now, to increase the chance that in Round 2 they fail to act, we have the pessimist (estimate=2) and maybe the estimate=3 players who will not agree to a set of 4? And the players with estimate=5 or 6 might want a larger set? So they might not agree.

  Assignment for estimates in Green state (T=4):
  - Player 1: estimate=2 (pessimist)
  - Player 2-4: estimate=3
  - Player 5-10: estimate=4
  - Player 11-15: estimate=5
  - Player 16: estimate=6

  In Round 2, the players with high estimates will push for a large set (say 5 or 6), while the pessimist will only accept 2. They may not find a number that everyone agrees on.

  Now, for the player who is right and knows it: in this setup, the players with estimate=4 are right? But they are for activation. The pessimist is wrong? But they are against. So we don't have a player who is against and right. We might have to accept that.

  Alternatively, we can have in the debrief: "In Round 1, player 1 (pessimist) was against activation because they thought T=2. They were wrong in this instance, but in a different scenario, they might have been right. The point is that their correct understanding of the risk (from their perspective) didn't stop the group from acting."

  Predictable problems and how to handle them:

  1. The group treats it as a puzzle and tries to solve for T.
     - Handle: Emphasize at the start that they should act based on their private information and that they cannot share their private clue verbatim. They can only share their reasoning in their own words.

  2. A participant refuses to play.
     - Handle: Have a backup role. Or if it's one person, let them observe and take notes for the debrief.

  3. Someone guesses the concept early.
     - Handle: If they say it out loud, thank them and ask them to play along to help others experience it. In the debrief, acknowledge their insight.

  4. In Round 2, they quickly agree on a small number (like 4) and avoid disaster.
     - Handle: To reduce this risk, make sure the players with high estimates (5,6) are vocal about wanting more. Also, the assignment has only 6 players with estimate=4, so if they propose 4, the players with 5 or 6 might object because they think it's safe to have more? So they might not agree. If they do agree on 4, then they succeed, and you can discuss in debrief: "In this case, you avoided disaster, but note that you had to agree on a number, and the pessimist might have been outvoted? But under unanimity, the pessimist could have blocked if they insisted on 2? So it's possible to have inaction even when action is good."

  Debrief script (outline):

  - Start by asking the players to describe their experience in Round 1: How many activated? What was the outcome? How did you feel when you saw the disaster? 
  - Highlight: "One or two activations would have been fine, but because each of you acted independently, and many of you had reasons to believe it was safe to activate, the collective result was harm."
  - Point out the player with the low estimate: "You were against activation. Why? And even though you didn't activate, your inaction didn't stop the disaster. Why not?"
  - Then Round 2: Did you reach agreement? If not, why not? If yes, how? 
  - "In Round 2, the requirement for unanimity meant that even one person could block action. In this case, we had a situation where a few activations would have been beneficial, but you ended up with none (or too many if they agreed on a large set)."
  - Connect to the unilateralist's curse: "This structure, where an action can be taken by any one individual and is good if done by a few but harmful if done by many, leads to a curse: adding more well-intentioned people can make the outcome worse because it only takes one optimist to act, and under independent action, there's no mechanism to stop at the safe number."
  - "Under a unanimity rule, the curse flips: it becomes very hard to act, even when action is warranted, because it only takes one pessimist to block."
  - Real-world examples: 
    - In science publishing: many journals might publish a marginal result because any one journal can publish it, and they think it's their duty, but collectively it floods the literature with noise.
    - In policy: multiple agencies might each launch a similar project, causing duplication and waste, but any one agency can do it because they think it's their mission.
    - In tech: many companies might independently develop AI systems that are safe if only one exists, but if many exist, they might interact dangerously.

  The gap in the game:
  - In the game, there is a discoverable right answer (the true T), and we reveal it. In real life, we never know the true state or whether the action was justified. The sting is in the uncertainty. 
  - To make up for it, in the debrief, emphasize: "In reality, you never get to find out the true T. You only see the outcome if you act, but not if you don't. And if you don't act, you don't know if you missed an opportunity or avoided a disaster. The curse operates in the realm of uncertainty."

  Materials list for 16 players:
  - 16 clue cards (estimate values: one 2, three 3, six 4, five 5, one 6)
  - Decision slips for Round 1
  - A board or paper to record the decisions and outcomes.

  Timeline:
  - 0-5 min: Introduction
  - 5-15 min: Round 1 decision and collection
  - 15-20 min: Round 1 reveal
  - 20-40 min: Round 2 discussion and decision (20 minutes for discussion)
  - 40-45 min: Round 2 reveal
  - 45-90 min: Debrief (45 minutes)

  This fits 90 minutes.

  Let's write the full game rules in prose for the facilitator.
answer: |-
  Here’s how I’d design the session for you, based on years of running similar exercises and knowing how easily these things can veer off track. Think of it as a cocktail of controlled chaos, carefully mixed to let the group stumble into the insight themselves. The game I’m calling "Threshold" mirrors the unilateralist’s curse by making participants grapple with individual actions that are benign in isolation but catastrophic in aggregation, while ensuring one player holds the "correct" view but can’t impose it. I’ll walk you through setup, gameplay, debrief, and the inevitable hiccups.

  ### The Setup  
  You’ll need a quiet room, sixteen chairs, a stack of index cards (one per player), a whiteboard or large paper, and pens. No tech. The scenario is a climate crisis response: each player leads a research team that can independently launch a geoengineering "aerosol probe" into the atmosphere. Probes cool the planet if only a few launch, but too many cause ecological collapse. The trick is that no one knows the exact safe threshold for launches, and each has partial, overlapping clues about it. Assign roles by handing out index cards with private information. For a group of sixteen, use this breakdown:  
  - Six players get: *"Your models show a high risk of ecosystem disruption if more than 4 probes launch. Launching is justifiable only if very few teams act."*  
  - Five players get: *"Your models show moderate risk; 5–6 probes are likely safe. Launching is reasonable if others show restraint."*  
  - Four players get: *"Your models show low risk; 7–8 probes are certainly safe. Launching is highly beneficial if coordinated."*  
  - One player (the "pessimist") gets: *"Your models confirm disaster if ANY probes launch. New data shows current conditions make even one probe catastrophic. You must oppose all launches."*  

  Crucially, the pessimist is "right" in the sense that their information is designed to be definitive—but in this game, the actual safe threshold is 4 probes. (In reality, thresholds are unknowable, but here we fix it to create visceral stakes.) Don’t reveal this threshold yet. On the board, sketch a payoff scheme:  
  - If total probes ≤ threshold, each launcher gains +10 "impact points" (symbolic credit for helping the planet).  
  - If total probes > threshold, each launcher loses –10 points (ecological damage).  
  - Non-launchers always get 0.  

  Emphasize three rules: (1) Decisions are private until revealed. (2) No sharing cards verbatim—discuss ideas, not text. (3) Points aren’t real money; they’re about "winning" the scenario ethically.  

  ### The Gameplay (60 minutes total)  
  **Round 1: Unilateral Action (25 minutes)**  
  Give them 5 minutes to read cards and ponder alone. Stress that each can launch their probe without consulting others—it’s a personal choice. Then, 10 minutes for open discussion. They’ll debate, but remind them: "No group votes or pacts—this is about individual judgments." Watch for the pessimist; they’ll argue forcefully against any launches, citing their "smoking gun" data. Others might sympathize, but they can’t stop someone from acting. After discussion, each writes "LAUNCH" or "HOLD" on their card and hands it to you. Tally launches publicly (e.g., "9 launches"). Reveal the threshold (4) and outcome: disaster (since 9 > 4). Mark launchers at –10, others at 0. The room will groan—they’ll see the pessimist was ignored, and well-meaning individuals (especially those with "7–8 safe" cards) caused collapse.  

  **Round 2: Unanimity Rule (25 minutes)**  
  Reset the scenario: same roles, same threshold (4), same payoff. But change the rule: "No one can launch unless every single person agrees to an exact list of who launches." Give 15 minutes for discussion. They must convince the pessimist (who’ll resist fiercely) and reconcile clashing evidence—e.g., the "high risk" players may push for 0–2 launches, while "low risk" players demand 5–6. If they reach full consensus on a list, those named "launch." If not, no one launches. Most groups deadlock; the pessimist’s veto power is paralyzing. Reveal the outcome: no launches mean 0 points for all, but since 4 launches would have been safe (+10 each), highlight the missed opportunity. If they miraculously agree on ≤4 launches, celebrate their "win" but note how close they were to deadlock.  

  **Transition (10 minutes)**  
  Before debrief, have them jot reflections: "What did your private info make you feel was the ‘right’ move? When did you feel powerless?" This primes the debrief without leading.  

  ### The Debrief (30 minutes)  
  Start by unpacking emotions, not concepts. Ask:  
  - "In Round 1, did anyone feel confident launching? What made it seem reasonable?" They’ll name their partial data. Then: "How did it feel watching the pessimist’s warnings get drowned out?" The pessimist will vent frustration—their certainty didn’t translate to influence.  
  - "In Round 2, what stalled consensus?" They’ll describe factionalism: the pessimist’s rigidity, optimists’ impatience. Ask: "If you knew the threshold was 4, could you have convinced the pessimist to allow four launches?" (Likely no—their data said zero.)  

  Now, frame their experience:  
  - "Round 1 was the unilateralist’s curse. Each of you had a noble reason to act—your data suggested launches were safe if few did it. But because only one optimist needed to act, and no one could veto, you overshot the threshold. Adding more thoughtful people made it worse, not better, because divergent judgments increased the chance of an overconfident actor."  
  - "Round 2 was the curse flipped. Requiring unanimity gave every skeptic veto power. The pessimist had legitimate concerns, but their certainty froze action even when limited launches would have helped. Good intentions + unanimous rules = paralysis."  

  Connect to real journalism/policy beats lightly:  
  - "Think of AI labs racing to deploy untested systems. Each believes their release is safe if contained, but no one coordinates thresholds. One optimist deploys, others follow, and suddenly we’re in a mess."  
  - "Or climate policies: ten agencies each fund a small solar geoengineering study. Alone, each is defensible; together, they normalize a dangerous technology. No single actor sees the cumulative risk."  
  - "The curse isn’t about bad people—it’s about disconnected good intentions. Your Round 1 decisions felt reasonable in the moment, just like a policymaker approving a ‘modest’ project. The horror is in the aggregation."  

  End by naming the curse. Say: "What you experienced has a name—the unilateralist’s curse—and it’s why I run sessions like this. Now, argue about how to fix it over coffee."  

  ### Predictable Problems (and Fixes)  
  **1. The Puzzle Solvers:** Some will treat this as a logic game to "win." If they collude to limit launches in Round 1, let them—but the moment one defector launches, chaos erupts. Use it: "See how easily cooperation crumbled? That’s the curse in action." If they hack Round 2 with a unanimous "safe" number, ask: "How many real-world groups have sixteen people who trust each other like this?"  
    
  **2. The Rebel:** One player might refuse to engage or mock the exercise. Pull them aside early: "Your role is to model skepticism—play along to challenge others." If they resist, let them observe; their aloofness can even highlight how disengagement enables the curse.  
    
  **3. The Early Guesser:** If someone names the curse in Round 1, whisper: "Brilliant—now help others *feel* it by playing your role straight." Their insight becomes a teachable moment in debrief: "Some spotted the trap early, but individual clarity didn’t stop the group dynamic."  
    
  **4. Time Crunch:** Round 2 discussions often overrun. Cap at 15 minutes—interrupt with "Consensus or deadlock? Decide now." The tension of forced choice mirrors real deadlines.  

  ### The Unreproducible Gap  
  You nailed it: the game’s flaw is its knowable threshold. In reality, we never learn if restraint was wisdom or cowardice, or if action was justified. The game reveals outcomes, but life doesn’t—that’s the curse’s true sting. To bridge this, say in debrief: "Here, you saw the disaster or the missed opportunity. In the wild, you’d only see the consequences of *acting*, never of *restraint*. The policymaker who blocks a project never learns if it would’ve sparked innovation or caused ruin. That uncertainty is where the curse thrives." I’d add: "This game makes you feel the structural trap. What it can’t simulate is the lifelong doubt—so when you cover a controversy, ask not just ‘Was this decision right?’ but ‘Did we set up the system so individual judgments could combine wisely?’"  

  Run this, and they’ll leave with the curse in their bones. The pessimist’s futile certainty, the optimist’s accidental havoc, the unanimity-induced gridlock—it’ll all click. And when they argue in the debrief, you’ll know it worked. Good luck.
