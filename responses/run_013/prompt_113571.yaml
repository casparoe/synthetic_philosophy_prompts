  For example, in Round 1, we can have a player who has information that the other players are likely to activate? So they know that many will activate and exceed T? So they are against any activation? And they are right? But they have to have information about the other players? That might be complex.

  We can give one player (the pessimist) a clue that says: "You have reason to believe that at least 10 other regions are likely to activate." Combined with their estimate of T=4, they know that if 10 activate, it will be a disaster. So they are against activation? But they might activate themselves? Or not? And they can choose not to activate, but they cannot stop others.

  Then, in Round 1, they choose not to activate, and indeed many others activate and cause disaster? So they were right to be against? But their being against didn't stop it.

  In Round 2, under unanimity, in a state where action is needed (T=4), the same player might block because they think (now in a new scenario) that many will want to activate? But we reset the state? 

  This is getting very complicated.

  Given the time constraints, I think we have to relax the requirement. Let's explain to the facilitator that we will have a player who is firmly against activation in Round 1 (based on their information) and who turns out to be wrong (because the state is such that a few activations would have been good, but in Round 1, many activated anyway causing disaster, so their being against didn't matter). Then in Round 2, under unanimity, in the same state (after they've seen the disaster of Round 1), we have a discussion, and they might block because they are now even more pessimistic? 

