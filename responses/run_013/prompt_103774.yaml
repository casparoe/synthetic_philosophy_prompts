  We are designing a thought experiment to challenge the clarity of the disagreement between eliminative materialism and realism about beliefs. The case must satisfy five conditions: (a) realistic, (b) belief-desire prediction works, (c) internal states lack the marks of belief (especially no redeployment), (d) no stipulation of the conclusion, and (e) one small step from an ordinary case.

  After brainstorming, here are some candidate systems and why they were rejected:

  1. **A chess-playing computer using a neural network with no symbolic representations**: Rejected because it might not clearly fail (c) – neural networks can have distributed representations that might be argued to have content, and the behavior might not be predictable by belief-desire psychology without extensive training.

  2. **A highly trained animal (e.g., a dog) that responds to commands in complex ways but without propositional attitudes**: Rejected because (b) might not hold – belief-desire ascription in animals is controversial and often seen as anthropomorphic; also, it's hard to show that the internal states are not redeployed.

  3. **A human with a specific brain lesion that disrupts certain inferences but leaves others intact (e.g., Capgras delusion)**: Rejected because (a) might be met, but (c) is unclear – the internal states might still have content and be redeployed in limited ways, and (b) might break down in novel situations.

  4. **A simple robot with hardwired reflexes for a specific environment (e.g., a Roomba)**: Rejected because (b) fails – its behavior is too limited and predictable without genuine belief-desire ascription; it's essentially a lookup table.

  5. **An institution like a corporation that 'acts' based on bylaws and procedures**: Rejected because (c) is hard to establish – the internal processes (e.g., meetings, votes) might be seen as having content, and (a) might be borderline for a seminar on the metaphysics of mind (as it's not a cognitive system).

  The chosen case: **A human expert in a highly specialized domain (e.g., a chess grandmaster) who has trained to the point of having 'intuitions' that are actually implemented by a large set of highly specific, non-compositional memory patterns and associations, without any general reasoning redeployment.**

  But wait, let me refine this to meet all conditions.

  Final Case: **A highly trained animal, specifically a border collie that has been conditioned to respond to an extensive set of verbal commands and gestures in a herding context, but where the internal states are purely associative and not redeployed for other purposes.**

  However, this might not satisfy (b) for indefinitely many novel situations.

  Alternative: **A human with acquired savant syndrome due to brain injury, who can perform complex calculations or artistic tasks without understanding, using non-conscious, encapsulated modules.**

  But (a) is met, but (b) might be limited.

  After reconsideration, I propose:

  **The Case: A 'mnemonist' who has trained using the method of loci (memory palace) to an extreme degree, such that they can recall vast amounts of information and even 'infer' new facts by navigating their memory palace, but the internal states are entirely tied to spatial navigation and sensory associations without propositional content or redeployment.**

  Why rejected? It might not clearly fail (c) because the associations could be seen as having content.

  Revised and chosen case:

  **The Case for: Showing that a system can exhibit behavior predictable by belief-desire psychology while having internal states that are not beliefs because they lack redeployment and compositionality.**

  **The Case:**

  Consider a human chess player who has memorized an enormous database of chess positions and associated moves, not through understanding but through rote memorization and pattern recognition. This player has trained for years, building a vast lookup tree of board states and moves, but without any general chess principles. When faced with a novel position, the player recognizes it as similar to a memorized one and makes the move from memory. If the position is entirely new, the player uses a simple fallback (e.g., a fixed set of heuristics) that has been pre-memorized. The internal states are neural patterns that activate based on visual input matching stored patterns, and they trigger motor outputs (moving a piece) without any inference or redeployment. The states are not truth- evaluable; they are just associations. They do not compose: the state for one position does not interact with the state for another to produce a new state. And crucially, these states are not redeployed: the pattern that leads to moving a pawn in one situation is never used in any other cognitive context (e.g., not for explaining why, not for predicting an opponent's move, not for any non-chess behavior).

  But wait, this might violate (b) for entirely novel positions. Also, it might be too close to a lookup table.

  To fix (b), we make the system more robust: the player has memorized so many positions that for any practical purpose, novel situations are rare, and the fallback heuristics cover them in a way that is predictable by belief-desire ascription (e.g., "She believes that controlling the center is good, so she'll move there"). But the internal fallback is not a belief; it's a fixed response.

  But then the fallback might look like a belief.

  Let's try a different approach.

  **Final Case:**

  Consider a highly trained service dog, such as a guide dog for the blind, that has learned to respond to a wide variety of commands and environmental cues. The dog has been conditioned through operant and classical conditioning to perform complex behaviors in response to specific stimuli. For example, it can navigate a busy street, avoid obstacles, and even disobey a command if it detects danger (like an approaching car). An observer using belief-desire psychology might say the dog believes there is a car coming and desires to protect its owner, so it stops. The dog's behavior is predictable in novel situations (e.g., a new type of obstacle) because of its extensive training and generalization abilities. However, the internal states are associative neural connections that do not carry truth-evaluable content. The state triggered by the sight of a car is not 'about' the car in a semantic sense; it is a sensory-motor association that directly links to an action. These states are not composed of simpler concepts and are not redeployed: the state for car-approaching is only used for stopping at the curb and not, for example, for 'inferring' that cars are dangerous in other contexts or for modifying other behaviors in a content-sensitive way. The dog cannot take that 'belief' and use it in a new inference chain.

  But is the dog's behavior predictable in indefinitely many novel situations? Perhaps not to the degree required.

  Therefore, I propose a human case that is more clearly robust:

  **The Case (in one paragraph):**

  Consider a human taxi driver in a large city who has an exceptional memory for routes and landmarks but no abstract understanding of geography or navigation principles. Through years of experience, the driver has built a massive associative network: each landmark is linked to specific motor actions (turn left, go straight) and to other landmarks. When driving, the driver recognizes landmarks and sequences them without any global map or propositional knowledge. The driver can take a passenger to any address by following these associations, even in novel detours caused by road closures, by recognizing a landmark and triggering the next action. An observer using belief-desive psychology can predict the driver's behavior by ascribing beliefs about the city's layout and desires to reach the destination. However, the internal states are purely perceptual-motor associations: they are activated by sensory input and directly produce behavior without truth conditions or compositionality. Crucially, these states are not redeployed: the association for a particular landmark is only used for driving and never, for example, for giving directions verbally (the driver is poor at that) or for planning a route outside the car. If you ask the driver how to get somewhere, they cannot explain; they must drive.

  Now, let's check the conditions:

  (a) Realistic: Yes, based on actual taxi driver studies (like London cabbies with enlarged hippocampi for spatial memory).

  (b) Belief-desire prediction works: An observer can ascribe beliefs (e.g., "He believes that Oxford Street is the fastest route") and desires (to get to the destination quickly) and successfully predict turns, detours, etc., in novel situations.

  (c) Internal states: The associations are not truth-evaluable (they are just neural links), they do not compose (no general map), and they are not redeployed (only for driving, not for other tasks).

  (d) No stipulation: We describe the mechanism without using terms like "no beliefs"; it's an empirical description.

  (e) One small step: If we add the ability to use the spatial knowledge in a flexible, redeployable way (e.g., the driver can draw a map or give directions), then it becomes ordinary belief.

  **Bookkeeping:**

  1. **Verdicts:**

     - **Eliminativist**: The case shows that there are no beliefs. The internal states are mere associations without content, and the predictive success of belief-desire psychology is due to the system's behavioral patterns, not because it has beliefs. The states are not redeployed, which is essential for belief.

     - **Realist (empirical theory)**: The realist argues that the predictive success itself is evidence that the internal states have content. The driver's behavior is best explained by attributing beliefs about the city, so there must be content-bearing states. The fact that the knowledge is tied to a specific modality (driving) does not negate that it is belief; it might be a limitation of access.

     - **Instrumentalist**: The intentional description picks out a real pattern in the behavior, so it is legitimate to say there are beliefs for predictive purposes. However, this does not commit to beliefs being internal states with content. In this case, the pattern is real (so we can use belief-talk) but the underlying mechanism lacks the features of belief (content, composition, redeployment). Therefore, the instrumentalist might say that while belief-talk is useful, it does not reflect the ontology of the internal states.

  2. **The key feature**: The lack of redeployment. The internal states are only used in one context (driving) and not for other inferences or actions.

     - **Without it**: If the driver could use the same spatial knowledge flexibly—for example, to give verbal directions, plan a route on a map, or use it in a new context like a video game—then the internal states would be redeployable, and the realist would argue that they are beliefs.

  3. **Strongest reply from the position that comes out worst (likely the realist)**:

     The realist might argue: "This case is parasitic on the real beliefs of the trainer or the designer of the system. The taxi driver was trained by others who have genuine beliefs about the city, and the driver's associative network is a compressed imprint of those beliefs. Moreover, the predictive success of belief-desire ascription depends on the environment being structured in a way that was shaped by beings with genuine beliefs (e.g., city planners). Without that, the associations would not work. Therefore, the case does not show a system without beliefs; it shows a system that inherits its behavioral patterns from genuine believers."

  4. **Self-assessment**:

     - (a) Realistic: Yes, based on real-world examples of skilled individuals with implicit knowledge.

     - (b) Genuine belief-desire prediction: Yes, the driver's behavior in novel detours can be predicted by ascribing beliefs and desires.

     - (c) Internal states fail the marks: The non-redeployment is key, and we describe it as tied to one context. They lack truth-evaluable content and compositionality.

     - (d) No stipulation: We described the mechanism without asserting that there are no beliefs.

     - (e) One small step: Removing the lack of redeployment (by adding flexible use) turns it into an ordinary case.

     - **Novelty**: This is a vivid restatement of the classic "cognitivist vs. behaviorist" debate but applied to a realistic human case with a focus on redeployment. It draws on the idea of modularity (e.g., Fodorian modules) where a system can be informationally encapsulated and not redeployable, but it extends it to show that such a system can still be predictable by intentional stance.

     - **Leaning on**: The case is inspired by discussions of implicit vs. explicit knowledge and Fodor's modularity, where some cognitive systems are domain-specific and encapsulated. It also touches on connectionist models that challenge classical symbolic representations.

  **Therefore, the thought experiment is presented as above.**
