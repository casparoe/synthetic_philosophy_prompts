  ### Thought Experiment: The Mnemonist's Maze

  **What the case is for:** Demonstrating that a system can exhibit robust belief-desire predictive success while lacking redeployable internal states, thereby challenging whether eliminativism and realism are addressing the same question.

  #### Brainstorming and Rejections
  - **Candidate 1: A chess AI using brute-force database lookup for moves.** *Rejected:* Violates (b) as its behavioral repertoire is finite and predictable without genuine belief-desire ascription; it’s essentially a lookup table.
  - **Candidate 2: A trained parrot producing complex, context-appropriate vocal responses.** *Rejected:* Fails (b) for novel situations; the behavior is not reliably extendable to indefinitely many new contexts without anthropomorphic stretching.
  - **Candidate 3: A human with hyperthymesia (superior autobiographical memory) acting on episodic recall.** *Rejected:* Risks violating (c) because episodic memories might be argued to have truth-evaluable content and limited redeployment in inference.
  - **Candidate 4: A bee colony’s foraging "decisions" based on pheromone trails.** *Rejected:* Fails (b) as belief-desire ascription doesn’t genuinely work for novel human-scale social situations; too dissimilar from standard cases.
  - **Candidate 5: A self-driving car with hardwired sensorimotor contingencies.** *Rejected:* Edges toward (a) but violates (b) for truly novel scenarios (e.g., unprecedented road events) and (c) as sensor data might implicitly carry content.

  #### The Case
  Consider a human "route mnemonist" who navigates a complex, familiar city exclusively through an overlearned associative network. This individual has memorized thousands of specific visual-sensorimotor sequences (e.g., "if landmark X appears, turn left; if sound Y occurs, slow down") via decades of repetitive driving in fixed zones. The mnemonist’s behavior—such as avoiding sudden obstacles, rerouting around construction, or choosing shortcuts during traffic—is guided purely by automatic pattern recognition and motor responses, with no integrated spatial map or conceptual understanding. Internal states consist of reinforced neural pathways linking perceptual cues (e.g., the shape of a building, the timing of a traffic light) directly to actions, without any propositional content, compositional structure, or truth conditions. Crucially, these states are not redeployed: a cue-action pair activated for avoiding a pothole is never used inferentially (e.g., to reason about road safety in conversation) or outside driving (e.g., to sketch a map); it exists solely for that singular context. The mnemonist cannot explain routes verbally or adapt knowledge to new tasks (e.g., biking), yet an observer using belief-desire psychology (e.g., "she believes Main Street is blocked and desires efficiency, so she’ll turn here") reliably predicts novel detours, demonstrating robust intentional pattern recognition without underlying beliefs.

  #### Bookkeeping
  1. **Verdicts on the Case:**
     - **Eliminativist:** The system has no beliefs. Predictive success arises from behavioral regularities, not content-bearing states. The internal mechanisms are non-representational associations (lacking truth-evaluability, compositionality, and redeployment), so belief-talk is a useful fiction. *Reasoning:* Beliefs require redeployment for inference across contexts; here, each state is causally isolated to one sensorimotor loop.
     - **Realist (empirical theory):** Beliefs are present. The predictive success in novel scenarios (e.g., unseen traffic jams) empirically confirms that internal states have content (e.g., "about" road conditions). *Reasoning:* If belief-desire psychology works robustly, it must approximate the causal structure of the mind; the limitation to one context is mere access failure, not absence of content.
     - **Instrumentalist:** Beliefs exist as patterns, not internal states. The intentional stance picks out a real behavioral pattern (e.g., efficient navigation), justifying belief ascription for prediction, regardless of mechanism. However, the ontology of internal states is irrelevant, so the system is neither fully belief-ful nor belief-less. *Reasoning:* The pattern is robust across novelties, satisfying instrumentalism, but the states' causal roles differ from beliefs, so the question of "real beliefs" is misplaced.

  2. **Key Feature and Its Removal:**  
     The critical feature is the **non-redeployment of internal states**. Each cue-action pair is causally effective only in its specific driving context and never reused for inference, explanation, or other tasks.  
     **Removal:** If the mnemonist could redeploy the same knowledge flexibly—e.g., using spatial relationships to give verbal directions, plan routes on foot, or infer construction impacts on pedestrian flow—the internal states would support cross-context inference. This would make the case ordinary belief: states would carry composable content (e.g., a "map-like" representation) and be truth-evaluable (e.g., directions can be false), handing realists the win.

  3. **Strongest Reply from the Worst-Off Position (Realism):**  
     The realist’s strongest rebuttal is that **the predictive success parasitically depends on the genuine beliefs of the system’s designers or trainers**. The mnemonist’s associative network was shaped by societal practices (e.g., traffic laws, urban planning) created by beings with real beliefs, and the observer’s belief-desire ascriptions work only because they implicitly track this inherited structure. The case is a trick: the "novel" predictions are not truly novel but pre-encoded in the environment by believers, so the system’s behavior is a derivative reflection of real intentionality, not evidence against it. (This draws on the "environmental embedding" objection, where external belief-dependent structures enable non-believers to mimic intentionality.)

  #### Self-Assessment
  - **(a) through (e) satisfaction:** I satisfied (a) (realistic, based on expert human mnemonists and taxi drivers with highly automatized skills), (b) (belief-desire prediction works robustly for novelties like unexpected detours), (c) (states lack truth-evaluability, compositionality, and—crucially—redeployment), and (d) (no stipulation; conclusions emerge from associative mechanism). I partially fudged (e): the case is one small step from ordinary belief (removing non-redeployment collapses it), but ordinary cases often involve partial redeployment (e.g., drivers explaining routes), making the "step" feel modestly idealized. I avoided explicit fudging by grounding it in real mnemonist phenomena.
  - **Novelty:** This yields a genuinely new argument by focusing on redeployment (not just content) as the fault line. Classic cases (e.g., lookup tables) fail (b); here, predictive success coexists with non-redeployment, forcing a sharper question: "Is redeployment necessary for disagreement about beliefs to be substantive?"
  - **Leaning on:** The case implicitly draws on Fodor’s modularity, where input systems are cognitively impenetrable and non-redeployable, but extends it to show such systems can sustain belief-desire prediction. It also engages Churchland’s connectionism, where distributed patterns replace propositions, but emphasizes redeployment as the realist’s litmus test.
