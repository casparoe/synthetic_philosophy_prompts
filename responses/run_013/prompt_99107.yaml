answer: |-
  Here’s an audit of tensions in your position, ranked by severity with repair options:

  ### 🚨 **Severe Tension: (iii) vs. (i) & (v)**  
  **Conflict:** Harsanyi’s theorem (i) requires *ex ante* social preferences over lotteries to satisfy expected utility (EU) axioms. Your ex post egalitarianism (iii) rejects this: you evaluate only final outcomes, not lotteries. But (v) tries to retain Harsanyi’s *structure* (weighted sum) while violating its *foundation* (EU at the social level).  
  **Why it breaks:** If social welfare is a function of ex post outcomes (iii), social preferences over lotteries can’t satisfy EU axioms (required by i). Example: Your coin-toss case violates the Independence Axiom—social preference depends on correlations between individuals’ outcomes, which EU ignores.  
  **Cheapest Repair:**  
  - **Option 1:** Abandon (iii) → Adopt *ex ante* egalitarianism (e.g., social indifference to distributing chances). **Cost:** Loses your core objection to outcome lotteries.  
  - **Option 2:** Abandon Harsanyi’s EU framework (i) → Use a non-EU model (e.g., rank-dependent utility) for social choice. **Cost:** Loses the "rational chooser" defense of welfarism; weights in (v) lose axiomatic grounding.  

  ### ⚠️ **Moderate Tension: (v) vs. (i) & (iv)**  
  **Conflict:** Applying a *concave transform* to individual utilities (v) before summing violates Harsanyi’s linear aggregation (i) unless the transform is linear (trivial). If utility is interpersonally comparable (iv), the concave transform implies prioritarianism, but Harsanyi’s theorem demands social utility be linear in individual *utilities*—not a transform of them.  
  **Why it strains:** Your "Prioritarian Harsanyi" isn’t Harsanyi. The weighted sum must be over *untouched* utilities to satisfy his axioms. Transforming utilities breaks the link between individual EU rationality and social EU rationality.  
  **Cheapest Repair:**  
  - Reinterpret (v): Apply weights *and* concavity **only** when evaluating *certain* (non-lottery) outcomes. For lotteries, revert to untransformed Harsanyi aggregation. **Cost:** Inconsistent treatment of risk vs. certainty; abandons a unified framework.  

  ### 🔍 **Minor/Apparent Tensions:**  
  **(ii) vs. (i):** **No conflict.** Harsanyi’s weights *are* arbitrary (not necessarily equal). Your rejection of equiprobability is consistent.  
  **(iii) vs. (iv):** **No conflict.** Ex post evaluation (iii) and interpersonal comparisons (iv) are compatible (e.g., comparing realized well-being levels).  
  **(v) vs. (ii):** **No conflict.** Weights as "degrees of concern" need not imply equality; priority weights can be unequal.  

  ### Repair Strategy Summary  
  | **Tension**         | **Severity** | **Cheapest Repair**                     | **Cost**                                  |
  |----------------------|--------------|-----------------------------------------|-------------------------------------------|
  | (iii) vs. (i)/(v)    | 🚨 High      | Adopt ex ante egalitarianism            | Abandons aversion to outcome lotteries    |
  |                      |              | *or* Drop Harsanyi’s EU axioms          | Loses axiomatic foundations for welfarism |
  | (v) vs. (i)/(iv)     | ⚠️ Medium    | Apply concavity only to certain outcomes | Framework inconsistency                   |

  ### Recommendation  
  The **fatal flaw** is (iii)’s incompatibility with Harsanyi’s lottery-based framework (i). To keep ex post egalitarianism, **drop Harsanyi’s EU axioms** (i) and reframe (v) as a *pure outcome-based prioritarianism* (e.g., sum concave-transformed utilities of realized outcomes). This sacrifices the "rational chooser" defense but preserves (ii)-(iv). If retaining Harsanyi is non-negotiable, **abandon ex post egalitarianism**—this is the cheapest fix but guts your egalitarian commitment.  

