prompt: |-
  I chair the state historical marker commission for our state historical society. We review roughly thirty applications a year and vote at monthly hearings; our plaques stay up for decades, so a bad one is at once a permanent embarrassment and a public insult. Our enabling language says markers must be "historically accurate," a phrase no one has ever defined. In the past two years we approved a marker that a descendant community says erases them, and rejected one that a neighborhood group says we dismissed only because its claim rested on oral tradition rather than documents. I want a decision procedure my staff historian and review subcommittee can actually run before each hearing — twenty minutes at triage, an hour for a contested application — working from what applicants submit plus digitized records and local historical society files, since we have no research budget and no power to compel anything.

  The procedure has to settle what our arguments keep circling: when a community's memory and the documentary record conflict, it is not obvious which should give way, because the two answer to different things — the record to evidence, the memory to obligation, identity, and the present needs of those who hold it. So do not hand me a rule that simply ranks the two. Build the procedure out of the distinctions that do the work: between a claim about an event and a claim about what a community is; between what a culture keeps in active circulation and what it merely stores, and which of the two a plaque is doing; between the three things a marker text can do — assert, commemorate, and attribute ("the X community holds that...") — and the trap by which attribution becomes a laundered assertion. It must treat the absence of documents as evidence about who had the power to write things down rather than as automatic refutation, without letting that license invention, and it must keep "we found evidence against this" separate from "we found nothing either way." It should also say who has standing to speak for a community, and what to do when two factions of the same community both claim to.

  Give me the questions in order, what counts as a sufficient answer to each, the points where the procedure stops with a no, and the points where it hands the decision to the commission because the question is about whose story deserves scarce public attention rather than about what happened. Then run it on three applications: (1) a descendant group seeking a marker asserting that their settlement predates the first land deed by thirty years, on the strength of an unbroken oral account and one ambiguous church record; (2) a town's application commemorating a founder whose story, as our staff historian reads the 1880s promotional history it rests on, appears to have been manufactured to justify taking land from the community that now objects; (3) a marker for an unmarked burial ground known only from oral tradition, where the official record is silent and a county history calls the site a battle. I am the commissioner who usually votes against tradition-based claims, so at least one of these should come out against my instincts; say so plainly. Finish with what the procedure cannot do, including the cases where the honest answer is an ugly compromise or a refusal to mark at all.
reasoning: |-
  Okay, let me start by understanding the user's problem. They chair a state historical marker commission and need a decision procedure for evaluating applications. The main issue is balancing documentary evidence with community memory, especially when they conflict. They want a structured process that avoids simplistic rules and addresses deeper distinctions like the type of claim, the role of commemoration, and power dynamics in documentation.

  First, I need to recall the user's specific requirements. The procedure must differentiate between event claims and community identity claims, active cultural circulation versus storage, and the three functions of markers: assert, commemorate, attribute. Also, handling absence of documents as evidence of power imbalance without allowing invention is crucial. Standing within communities and contested representations are other key points.

  The user provided three test cases. Case 1 involves a descendant group claiming earlier settlement via oral tradition and one ambiguous document. Case 2 is a town commemorating a founder with a potentially fabricated history that dispossessed a community. Case 3 is an unmarked burial ground known orally, with conflicting county history. The user usually votes against tradition-based claims, so one should challenge their stance—likely Case 1 or 3.

  I consider designing a phased procedure. Start with initial triage (20 mins) to filter out applications with factual errors or insufficient evidence. Then a deeper review (60 mins) for contested cases, evaluating evidence types, community role, and marker function. The procedure should stop at clear "no" points, like outright falsehoods or lack of community standing, and escalate ambiguous cases to the commission for policy decisions.

  For the test cases, applying the procedure step-by-step is essential. Case 1: The settlement claim. Check if it's an event or identity claim. Since it's about existence (event), evidence needed. Oral tradition plus ambiguous church record—absence of documents could be due to power dynamics. But no counter-evidence, so it passes initial checks. However, attribution might be safer than assertion. This challenges the user's usual stance.

  Case 2: Founder commemoration. The 1880s source is promotional and likely fabricated. Staff historian's assessment shows it dispossessed a community. This is an event claim with evidence against it. The commemorative function would validate the false narrative. Stop at Step 2.3—no marker, as it perpetuates harm. Aligns with the user's instincts.

  Case 3: Burial ground. Mixed evidence: oral tradition vs. county history calling it a battle. Absence of documents doesn't refute, but conflict exists. Identity claim for descendant community. Attribution is appropriate. Commission decides due to conflicting evidence. This might be a refusal to mark if harm is possible. Challenges the commission's role in contested narratives.

  The procedure's limitations: cannot resolve deep historical injustices, may lead to refusals or attributions that feel like compromises. Requires staff judgment but provides structure for consistent evaluation. Ensures decisions are deliberate, distinguishing between historical truth and commemorative choices.

  I need to ensure the steps clearly separate evidence types, address power dynamics, and define stopping points. For standing, representatives must have community mandate. Conflicting factions require both perspectives. The three cases test different aspects, with Case 1 going against the user's usual vote. Highlighting the limitations manages expectations, emphasizing that some situations lack clean solutions.
answer: |-
  Here is a comprehensive decision procedure designed for your specific challenges, built from the distinctions you requested, followed by application to your three cases and an analysis of limitations.

  **Historical Marker Decision Procedure**

  **Phase 1: Triage (20 Minutes - Staff Historian/Subcommittee)**
  *   **Q1.1 (Evidence Check):** Does the application contain *prima facie* factual errors or claims demonstrably contradicted by readily available, reliable documentary evidence (e.g., official records, established scholarship)?  
      *   *Sufficient Answer:* "Yes" (with specific citation of contradicting evidence). **STOP: Recommend REJECTION.**  
      *   *Sufficient Answer:* "No" or "Uncertain" → Proceed to Q1.2.
  *   **Q1.2 (Core Claim Type):** Is the marker's primary claim about a specific **event/condition** (e.g., "First Settlement Here," "Battle Fought Here") or about **community identity/enduring significance** (e.g., "Center of X Culture," "Founded by Y Group")?  
      *   *Sufficient Answer:* Clearly identify the core claim type(s). → Proceed to Q1.3.
  *   **Q1.3 (Marker Function):** What is the primary intended function of the marker text: **Assert** (state fact), **Commemorate** (honor/remember), or **Attribute** (state what a group believes/holds)?  
      *   *Sufficient Answer:* Identify primary function and note if secondary functions are present. Crucial distinction for next phase.

  **Phase 2: Contested/Complex Review (60 Minutes - Staff Historian/Subcommittee)**
  *   **Q2.1 (Evidence Assessment - Event/Condition Claims):** (If Q1.2 identified an Event/Condition claim)  
      a. **Documentary Evidence:** What direct, contemporary documentary evidence supports the claim? Assess reliability (source, context).  
      b. **Non-Documentary Evidence:** What oral tradition, archaeological data, folklore, or other non-documentary evidence supports the claim? Assess its lineage, consistency, and cultural context.  
      c. **Contradictory Evidence:** What evidence (documentary or non-documentary) contradicts the claim?  
      d. **Absence of Evidence:** Is the lack of documents likely due to power dynamics (marginalization, suppression, non-literate culture) or simply the nature of the event/era?  
      *   *Sufficient Answer:* Detailed inventory and assessment for a-d. *Do not weigh yet.*  
      *   *Stop Point:* If claim is directly, unambiguously, and reliably contradicted by evidence (Q2.1c), **Recommend REJECTION (for assertion)**. → May reconsider as Commemoration/Attribution.  
      *   → Proceed to Q2.3 regardless.
  *   **Q2.2 (Evidence Assessment - Community Identity/Significance Claims):** (If Q1.2 identified a Community Identity claim)  
      a. **Active Circulation:** Is the claimed identity/significance part of the community's *actively lived and transmitted* heritage *today*? (Evidence: community practices, contemporary statements, cultural events).  
      b. **Historical Basis:** What evidence (documentary or non-documentary) exists for the *historical development* of this identity/significance?  
      c. **Contested Identity:** Are there factions within the named community contesting this identity claim? (See Q2.4).  
      *   *Sufficient Answer:* Assessment of a-c. Focus shifts to present meaning and transmission (a) supported by historical context (b).  
      *   → Proceed to Q2.3.
  *   **Q2.3 (Marker Function & Evidence Match):** Does the proposed **Marker Function** (Q1.3) align with the **Evidence Strength** (Q2.1 or Q2.2)?  
      *   **Assertion:** Requires high confidence based on preponderance of reliable evidence (documentary + robust non-doc). Contradictions must be resolved or minor. Absence of docs must be reasonably explained *and* non-doc evidence strong.  
      *   **Commemoration:** Can proceed with weaker evidence *if* the event/group/person is demonstrably significant *and* commemoration doesn't validate a demonstrably false or harmful narrative. Focus shifts to *why* it's remembered, not just literal factuality.  
      *   **Attribution ("The X community holds that..."):** Appropriate when:  
          *   Evidence is primarily oral tradition/cultural memory *and* actively held by a defined community.  
          *   Documentary evidence is ambiguous, absent, or contradictory *but* the tradition is persistent and meaningful.  
          *   Claim is fundamentally about belief/meaning rather than a verifiable discrete event.  
      *   *Trap Warning:* Attribution must be explicit ("holds," "believes," "tradition states"). Avoid phrasing that launders belief into fact.  
      *   *Sufficient Answer:* Recommended function based on evidence alignment. If Assertion is proposed but evidence insufficient/contradicted, recommend shift to Commemoration/Attribution or REJECTION. If Commemoration would honor a demonstrably false/harmful narrative, **Recommend REJECTION**.  
      *   → Proceed to Q2.4.
  *   **Q2.4 (Community Standing & Voice):**  
      a. **Who Claims Representation?** Who submitted the application? What is their relationship to the subject/community?  
      b. **Defined Community:** Can the community affected by or central to the claim be clearly defined?  
      c. **Consent/Consultation:** Was meaningful consultation attempted with the descendant community or affected group? Is there evidence of broad community support?  
      d. **Contested Voice:** Are there known, organized factions within the community with differing views? If yes:  
          *   Have both perspectives been sought/represented in the process?  
          *   Is the dispute fundamental to the claim itself?  
      *   *Sufficient Answer:* Clear identification of applicant's legitimacy and community dynamics. Documentation of consultation efforts/outcomes if applicable.  
      *   *Stop Point:* If applicant demonstrably lacks standing or legitimacy within the affected community *and* there is active opposition from a significant segment of that community, **Recommend REJECTION** (marker would cause harm/division).  
      *   *Handoff Point:* If community definition is contested *or* factions have irreconcilable claims *but* the historical claim itself has merit, **Escalate to Commission**. Decision hinges on policy (which voice to platform) not just fact.
  *   **Q2.5 (Harm Assessment):** Would the marker, in its recommended form/function:  
      a. Perpetuate demonstrable historical falsehoods?  
      b. Cause significant harm or offense to a descendant or affected community?  
      c. Sanction or validate past injustice?  
      *   *Sufficient Answer:* Explicit "Yes/No" with reasoning.  
      *   *Stop Point:* If "Yes" to a, b, or c → **Recommend REJECTION** or **Require Function Change** (e.g., Assertion to Attribution).
  *   **Recommendation:** Based on Q2.1-2.5, recommend:  
      *   **APPROVE** (Specify Function: Assert, Commemorate, Attribute)  
      *   **REJECT** (State reason: Factual error, Insufficient Evidence, Harm, Lack of Standing)  
      *   **ESCALATE to COMMISSION** (Specify unresolved conflict: Community Voice, Significance Judgment despite weak evidence, Policy choice between valid narratives)

  **Application to Cases:**

  1.  **Descendant Group: "Settlement Predates Deed by 30 Years" (Oral + Ambiguous Church Record)**
      *   **Q1.1:** No *prima facie* contradiction. (Deed date is known, claim is *before* it).
      *   **Q1.2:** **Event Claim** (Date of settlement).
      *   **Q1.3:** Applicant seeks **Assertion**.
      *   **Q2.1a:** Minimal/No direct contemporary docs supporting pre-deed date. Ambiguous church record (needs interpretation).
      *   **Q2.1b:** Unbroken oral tradition (strong non-doc evidence if lineage/culture supports).
      *   **Q2.1c:** No direct contradiction, just absence of early docs.
      *   **Q2.1d:** Absence plausible due to marginalization/lack of official recognition pre-deed.
      *   **Q2.3:** **Evidence too weak for Assertion.** Shift to **Attribution** ("The [Community] holds that their settlement here predates the first recorded land deed by approximately thirty years, based on longstanding oral tradition") OR **Commemoration** ("Commemorating the enduring community of [Name], whose roots in this place trace deep into the oral history of its people") feasible.
      *   **Q2.4:** Applicant *is* descendant community. Defined community exists. Implied consent/broad support likely (they applied). No mentioned factions.
      *   **Q2.5:** No inherent harm identified; corrects potential erasure.
      *   **Recommendation:** **APPROVE** but **REQUIRE FUNCTION CHANGE** to **Attribution** (most precise fit). Escalate if commission insists on Assertion.
      *   **Commissioner's Note:** *This outcome challenges your instinct. While evidence doesn't support factual assertion, the active oral tradition, absence of docs plausibly linked to power, lack of contradiction, and community standing support attribution, addressing erasure without overclaiming. Rejection would perpetuate the erasure the community cites.*

  2.  **Town Application: "Commemorating Founder X" (Based on 1880s Promo History)**
      *   **Q1.1:** Staff historian identifies likely fabrication in source. Potential contradiction with land records showing prior occupation?
      *   **Q1.2:** Primarily **Commemoration** of individual, implicitly asserts his foundational role.
      *   **Q1.3:** Seeks **Commemoration**, implies **Assertion**.
      *   **Q2.1a:** Source (1880s promo history) deemed unreliable/fabricated for land grab. Contradictory evidence likely exists (prior deeds/census?).
      *   **Q2.1c:** Strong evidence *against* the factual basis of the founder myth (manufactured).
      *   **Q2.3:** **Commemoration** based on this narrative would validate a demonstrably false *and harmful* claim (used to dispossess). **Assertion** is factually unsupported. **Attribution** ("The town traditionally commemorates X as its founder...") is possible but risks laundering if not explicit AND acknowledges harm/stolen land.
      *   **Q2.4:** Applicant is town (current power structure). Affected community (dispossessed group) objects. Their standing is clear. Lack of consultation/harm cited.
      *   **Q2.5:** **High Risk of Harm (c):** Sanctions historical injustice and dispossession narrative. Likely causes offense (b).
      *   **Recommendation:** **REJECT.** (Stop at Q2.3/Q2.5). *Alternative:* Only approve if text explicitly attributes the story *to the town*, acknowledges the land dispossession context, *and* has consent from descendant community (unlikely here).
      *   **Commissioner's Note:** *Aligns with your instinct. Commemoration here validates a harmful fabrication.*

  3.  **Unmarked Burial Ground / Battle Site (Oral Tradition vs. County History)**
      *   **Q1.1:** No direct contradiction *yet*. County history calls it a battle, oral tradition says burial ground. Conflict emerges.
      *   **Q1.2:** Could be **Event Claim** (Battle happened here / Burial ground here) or **Commemoration** of sacred site/dead.
      *   **Q1.3:** Likely **Commemoration** or **Assertion** of location.
      *   **Q2.1a:** Official record silent. County history (calls it battle) is evidence *against* burial ground claim (if same spot).
      *   **Q2.1b:** Oral tradition identifies burial ground (strong non-doc if held by descendant community).
      *   **Q2.1c:** County history directly contradicts oral tradition about site use.
      *   **Q2.1d:** Silence plausible for marginalized burial ground. County history may reflect dominant narrative.
      *   **Q2.3:** **Assertion** too risky (direct contradiction). **Commemoration** ("Sacred Ground: A site of reverence and remembrance, known through oral tradition as a resting place of ancestors") possible but needs community buy-in. **Attribution** ("Oral tradition holds this site as an ancestral burial ground, while early county histories described it as a battle site") explicit about conflict.
      *   **Q2.4:** Who applied? (Crucial). If descendant community: strong standing. If unrelated group: weak standing. If county historical society relying on county history: potential conflict. Factions implied (tradition vs. written history).
      *   **Q2.5:** Potential for harm if burial ground is disturbed/disrespected, or if battle commemoration overshadows sacred site.
      *   **Recommendation:** **ESCALATE to COMMISSION.** Reasons:  
          *   Unresolved **Conflict of Evidence** (Q2.1c) - battle vs. burial.
          *   **Community Standing/Voice** critical (Q2.4 - who applied? Who objects?).
          *   **Function Choice is Policy-Driven:** Does commission prioritize commemorating the sacred site based on oral tradition despite contradictory written source? Or acknowledge the conflict explicitly? Or avoid due to sensitivity? Commission must weigh significance, voice, and potential harm.
      *   **Commissioner's Note:** *Your instinct might lean against due to evidence conflict. The procedure forces confronting the contradiction and the policy choice: whose narrative gets precedence on the landscape when evidence conflicts? A refusal to mark ("Too contested") or careful attribution might be the honest outcome.*

  **What the Procedure Cannot Do:**

  1.  **Resolve Deep Historical Injustices:** It can avoid perpetuating lies or causing harm, but it cannot fix the underlying history of erasure or dispossession. A marker is a limited tool.
  2.  **Create Definitive Truth from Scant Evidence:** It can assess probabilities and recommend appropriate framing (Attribute vs. Assert), but it cannot conjure certainty where none exists.
  3.  **Force Community Reconciliation:** It can identify contested voices and recommend rejection if harm is likely, but it cannot resolve internal community disputes about history or representation.
  4.  **Eliminate Subjectivity:** Judging "reliability," "significance," "harm," "active circulation," and "sufficient evidence" requires informed professional judgment. The procedure structures this but doesn't remove it.
  5.  **Guarantee "Happy" Endings:** The honest answer may be:
      *   **Refusal to Mark:** Due to insufficient evidence *for the proposed claim*, irreconcilable conflict, high risk of harm, or lack of legitimate standing.
      *   **Attribution as Compromise:** Framing a claim as belief ("holds that") rather than fact can feel like a defeat to communities seeking affirmation or a dilution to those prioritizing documentary rigor. It *is* a compromise, but an honest one when evidence is contested or primarily traditional.
      *   **Commission's Unavoidable Policy Choice:** When valid but conflicting narratives exist, the commission must decide which story to platform on public land, knowing it cannot please everyone. The procedure identifies *when* this choice is necessary.
  6.  **Compel Research or Evidence:** It works within the constraints of submitted materials + readily accessible digital/local archives. Gaps remain.
  7.  **Prevent Future Reevaluation:** New evidence or shifts in historical understanding may make a marker obsolete or problematic later. The procedure mitigates but cannot eliminate this risk.

  This procedure provides a structured framework to navigate the tensions between documentary evidence, community memory, power dynamics, and the different functions of historical markers. It forces explicit consideration of the key distinctions you identified, provides clear stopping points for rejection, identifies when the commission must make a policy choice, and offers pathways (like Attribution) that respect tradition without overstepping evidentiary bounds. It ensures these critical considerations aren't lost in debate but are systematically addressed upfront.
