  For the research question, I should frame it around whether the absence of a global time function in some models (like Gödel's) is necessary for his argument against objectivity. The existing positions likely fall into two camps: one taking the rotating universe as essential, and another focusing on contingency alone. But neither directly addresses whether underdetermination itself drives the argument.

  The methodology should involve philosophical analysis of Gödel's writings, examination of general relativity's structure, and constructing thought experiments. I'll propose three stages: (1) reconstructing the argument's logic, (2) analyzing underdetermination in GR, and (3) testing robustness via counterfactual models.

