answer: |-
  Here’s a decision tree for mapping self-deception theories, grounded in concrete cases and logical distinctions. British English spelling applied throughout.

  ---

  ### **Self-Deception: Belief, Behaviour & Awareness**  
  *Start with Case A: Your partner is acting suspiciously (late nights, secretive phone). Friends hint at infidelity. You dismiss it as "work stress".*

  **1. Does the person act as if they hold the belief they verbally deny?**  
  *(e.g., You avoid checking your partner’s phone or asking direct questions.)*  
  - **Yes → Go to 2**  
    *(Behaviour contradicts words: avoidance implies suspicion)*  
  - **No → Go to 3**  
    *(No behavioural contradiction: e.g., Case B: A doctor smokes but readily admits "It’s deadly, I’ll quit next month".)*  

  **2. Could they state the "denied" belief under gentle pressure?**  
  *(e.g., If asked "What if it were true?", would they engage or deflect?)*  
  - **Yes → Leaf: AVOWAL-REVERSAL MODEL**  
    *Standard name: "Attention-Management" (Ainslie)*  
    *Counter-case: The investor who won’t open financial statements, yet panics at market rumours — suggesting latent belief they cannot voice.*  
  - **No → Leaf: PARTITIONED MIND MODEL**  
    *Standard name: "Sub-doxastic States" (Davidson)*  
    *Counter-case: Case C: Someone declares "I trust my partner completely!" but hires a private investigator. How can they both "know" and "not know"?*  

  **3. Is there active effort to avoid evidence?**  
  *(e.g., Case D: Investor avoids opening statements after market crash.)*  
  - **Yes → Go to 4**  
  - **No → Leaf: MOTIVATED BELIEF**  
    *Coined name: "Wishful Thinking Plus"*  
    *Counter-case: The smoking doctor — they acknowledge the risk but delay quitting. Where’s the deception?*  

  **4. Is the avoidance driven by social concerns?**  
  *(e.g., You dismiss infidelity rumours partly to avoid social shame.)*  
  - **Yes → Leaf: SOCIAL SIGNALLING MODEL**  
    *Standard name: "Deception-Transmission" (Trivers)*  
    *Counter-case: A hermit avoids medical symptoms yet has no audience. Why self-deceive?*  
  - **No → Go to 5**  

  **5. Does the person feel conflicted about their avoidance?**  
  *(e.g., Investor feels guilt about unopened statements but still avoids.)*  
  - **Yes → Leaf: INTENTIONAL SELF-DECEPTION**  
    *Standard name: "Purposeful Ignorance" (Sartrean "Bad Faith")*  
    *Counter-case: Case E: Person loudly proclaims atheism but prays in crisis. If intentional, why the distress?*  
  - **No → Leaf: AUTOMATIC AVOIDANCE**  
    *Coined name: "Cognitive Shielding"*  
    *Counter-case: The "last-to-know" partner who seems genuinely shocked when shown proof — implying zero prior awareness.*  

  ---

  ### **Key Ambiguities & Empty Branches**  
  - **Blurred Leaves:** "Attention-Management" (2a) and "Cognitive Shielding" (5b) overlap in cases like the investor — both involve information control, but differ in intentionality.  
  - **Incoherent Branch:** *Unified mind + intentional self-deception* (e.g., claiming one could consciously decide to believe a lie). Rejected by most as paradoxical: if you know the truth to deceive yourself, you fail.  
  - **Unexplored Combination:** *Social signalling without behavioural contradiction* (e.g., Case B doctor). If behaviour aligns with stated belief ("I’ll quit"), social motives may not trigger self-deception.  
  - **Unliveable Position:** *Fully partitioned mind without distress* (e.g., Case C PI-hirer). Possible, but requires radical dissociation — psychologically unstable.  

  ---

  ### **Tree Summary**  
  | Path | Leaf Position | Core Mechanism | Weakest Case |  
  |------|---------------|----------------|--------------|  
  | 1→2a | Avowal-Reversal | Attention redirection | Investor’s panic |  
  | 1→2b | Partitioned Mind | Compartmentalised beliefs | Partner hiring a PI |  
  | 1→3b | Motivated Belief | Biased evidence weighting | Smoking doctor |  
  | 1→3a→4a | Social Signalling | Honest deception projection | Hermit’s symptom avoidance |  
  | 1→3a→4b→5a | Intentional Self-Deceit | Conscious avoidance maintenance | Atheist who prays |  
  | 1→3a→4b→5b | Automatic Avoidance | Pre-conscious defence | "Last-to-know" partner |  

  ---  
  **Format:** Fits 2x A4. **British English:** "Behaviour", "rumour", "centred", "deceit". Cases anchor nodes; leaves name theories + counterexamples. Designed to pre-empt definitional disputes by separating mechanisms.
