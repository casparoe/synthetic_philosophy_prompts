prompt: |-
  I am a second-year PhD student in philosophy, currently writing the opening chapter of a dissertation on causation and divine action, and I have been sitting in on a seminar in classical Islamic thought that has me re-reading the seventeenth discussion of al-Ghazālī's Incoherence of the Philosophers, where he denies that the connection between what we call a cause and what we call an effect is a matter of necessity and treats it instead as a settled pattern of divine custom, with the fire and the cotton as his stock example. My problem is not exegetical. It is that whenever the seminar tries to say what an account of causation of this kind is actually committed to, everyone offers a different criterion, and the disagreement turns out to be about the criteria rather than about the texts; my advisor's standing advice is to fix the specification before writing another line of commentary, and I have finally decided to take it.

  So what I want from you is the desiderata: the full list of things an account of causation of this kind must deliver in order to count as a metaphysics of causation rather than a pious refusal to have one, with the case or consideration behind each requirement and an explicit marking of which requirements are non-negotiable and which are merely the preferences of one camp. I am working with a rough list of my own, and I would like it corrected rather than merely supplemented. It seems to me that such an account must: (i) distinguish a cause from a mere occasion without circularity, which is what the old problem of accidental regularities forces — the night following the day cannot be a cause of it, yet a regularity that holds only under an unobserved condition, like a herb that works only when the moon is new, has to come out as causal or as something else, and the theory has to say which; (ii) say whether the unit of divine action is the individual event or the standing pattern, since a regularity that holds in nine hundred and ninety-nine cases out of a thousand with no discernible difference in the antecedent conditions will otherwise have no home; (iii) explain what individuates one divine act from another, given that the agent is one and simple, when a single occasion produces a compound effect or when two independent chains would each have produced the same result; (iv) ground whatever has to be true for the counterfactual that, had the fire touched the cotton, the cotton would have burned, since the practice of medicine, the techniques of agriculture, and the credibility of testimony all appear to require it; (v) tell us whether the difference between a change in custom and a miracle is available to a finite inquirer from the inside or only to God, and what follows for the epistemic status of reports of the former; (vi) either accommodate human action — by the familiar expedient of a power created in the agent for that specific act — or explain why the loss of genuine human causation is a cost worth paying; (vii) settle whether ordinary causal speech is true, elliptical, or systematically false, and thus whether the view is revisionary with an error theory or compatible with the surface grammar of our talk; and (viii) respect the difference between what the dialectical argument in the Incoherence actually establishes, namely that the philosophers have not proved necessity, and a positive metaphysics of divine action, which is a stronger claim than the argument supports. I would add one further requirement that seems to me to cut across the others: the pattern of divine action must not be arbitrary, on pain of losing any ground for the wisdom and goodness of the created order, and it must not be necessitated, on pain of losing divine freedom.

  What I most want to know is which of these cannot be jointly satisfied. My own suspicion is that (iv) and the freedom requirement pull in opposite directions — custom can ground the counterfactual only if it is a fact about what God will do, and a fact about what God will do looks like a constraint on a will that is supposed to be under no necessity — and I would like your view on whether the arbitrariness-and-necessity pincer I just described is a second, independent deadlock or merely a restatement of the first. If the set is indeed unsatisfiable, tell me the least costly repair and what it gives up. Finally, and briefly, score the main contenders against the list — al-Ghazālī's own position as you would reconstruct it, the necessitarian picture he attacks, the concurrentist view on which creatures have real powers and God concurs in each exercise of them, and a plain regularity view of the Humean sort — and tell me which single requirement does the most to eliminate the most candidates. I do not need citations, a bibliography, or a reading list; I need the criteria, each attached to the case that motivates it, and a candid verdict on which of them are negotiable.
reasoning: |-
  Okay, the user is a second-year PhD student in philosophy working on causation and divine action, specifically engaging with al-Ghazālī's Incoherence of the Philosophers. They've outlined eight requirements for a metaphysics of causation that avoids necessitarianism while grounding divine action. Their main concern is identifying which requirements conflict and which theories satisfy them. 

  First, I need to unpack their list. They're asking for desiderata that make such a metaphysics robust, not just a "pious refusal." Their eight points cover distinctions between cause/occasion, divine action units, individuation of acts, counterfactual grounding, epistemology of miracles, human agency, truth of causal language, and respecting al-Ghazālī's dialectical vs positive claims. The additional arbitrariness-necessity tension is crucial too.

  Hmm, the user suspects tension between (iv) counterfactuals and divine freedom—I agree. If custom grounds counterfactuals ("God would do X"), it implies divine constraint. But divine freedom requires no necessity. This isn't just restating old problems; it's a core metaphysical snag. 

  Now, negotiability: Some requirements are soft. For example, (vii) about causal language truth can bend—revisionism isn't fatal. But (i) distinguishing cause/occasion is non-negotiable; without it, the theory collapses into occasionalism where everything is arbitrary. Similarly, (iv) counterfactuals are essential for practicality (medicine, testimony), so grounding them is mandatory. 

  For theory scoring: 
  - Al-Ghazālī himself struggles with (iv) and (v). His divine freedom emphasis weakens counterfactual stability. 
  - Necessitarianism aces (i)-(iv) but fails divine freedom and al-Ghazālī's dialectical point (viii). 
  - Concurrentism handles (i)-(vii) well but may dilute divine sovereignty if not carefully framed. 
  - Humean regularity flunks (i) (no cause/occasion distinction) and (iv) (counterfactuals aren't robust). 

  The user’s arbitrariness-necessity pincer is lethal. To fix it, I’d suggest softening divine freedom: God’s commitment to custom stems from wisdom, not external constraint. This preserves counterfactuals without full necessitation. The cost? Some theologians might balk, but it’s better than implosion. 

  Biggest eliminator? Requirement (i). Without cause/occasion distinction, Humeanism and weak occasionalism die. Al-Ghazālī survives via divine wisdom, but barely. 

  User’s depth is impressive—they’ve nailed the tensions. Their advisor’s right: nailing specs first is wise. I’ll structure this as criteria with motivations, flag negotiability, then unpack conflicts and repairs.
answer: |-
  Below is a structured analysis of your desiderata for a divine-custom metaphysics of causation, addressing conflicts, negotiability, and comparative scoring of theories. The criteria are distilled to their philosophical core, with motivations and trade-offs made explicit.

  ---

  ### **Desiderata for a Divine-Custom Account of Causation**  
  *(Non-negotiable items marked with **★**)*  

  1. **Distinguish Causes from Occasions** (**★**)  
     - **Requirement**: Non-circular criterion for causal vs. accidental regularities (e.g., fire burning cotton vs. night following day).  
     - **Motivation**: Avoids collapsing into global occasionalism where all sequences are arbitrary; essential for scientific/practical reasoning.  
     - **Case**: Herb healing only during a new moon must be causal (due to divine custom linking herb/moon/health) — not accidental like night/day.  

  2. **Unit of Divine Action**  
     - **Requirement**: Specify whether God acts per event (token) or pattern (type).  
     - **Motivation**: Resolves statistical regularities (999/1000 cases). If token-based, exceptions (miracles) imply direct intervention; if type-based, exceptions threaten the pattern’s stability.  
     - **Negotiable**: Yes — but choice impacts epistemology (e.g., predictability).  

  3. **Individuation of Divine Acts** (**★**)  
     - **Requirement**: Explain how one simple divine will produces distinct effects (e.g., fire causing heat *and* light; two causes converging on one effect).  
     - **Motivation**: Preserves divine simplicity while accounting for causal complexity. Failure implies divine action is indistinguishable from chaos.  

  4. **Ground Counterfactuals** (**★**)  
     - **Requirement**: Ground truths like "If fire touched cotton, it would burn."  
     - **Motivation**: Undermines medicine/agriculture/testimony if custom lacks counterfactual force. Divine "reliability" must support conditionals.  

  5. **Epistemology of Miracles vs. Custom-Change**  
     - **Requirement**: Clarify whether humans can distinguish miracles from custom-changes.  
     - **Motivation**: If indiscernible, empirical knowledge collapses; if discernible, specify how. Affects epistemic status of historical/scientific reports.  
     - **Negotiable**: Partly — an "in principle" discernibility may suffice.  

  6. **Accommodate Human Agency**  
     - **Requirement**: Either secure genuine human causation (e.g., via created powers) or justify its loss.  
     - **Motivation**: Without this, ethics/law lose foundation (no real human responsibility).  
     - **Negotiable**: No — but *how* it’s secured (e.g., concurrentism vs. occasionalism) is flexible.  

  7. **Truth of Causal Language**  
     - **Requirement**: State whether "fire causes combustion" is true, elliptical (e.g., "God causes via fire"), or false.  
     - **Motivation**: Revisionary error-theories risk making science/commonsense systematically mistaken.  
     - **Negotiable**: Yes — elliptical or analogical approaches can preserve practice.  

  8. **Respect Dialectical vs. Positive Claims** (**★**)  
     - **Requirement**: Distinguish al-Ghazālī’s *negative* argument (against necessitarianism) from a *positive* divine-custom metaphysics.  
     - **Motivation**: Overreach invites accusations of theological bias. The negative argument only targets the *proof* of necessity, not necessity itself.  

  9. **Non-Arbitrary but Non-Necessitated Custom** (**★**)  
     - **Requirement**: Custom must reflect divine wisdom (non-arbitrary) but remain contingent (non-necessitated).  
     - **Motivation**: Arbitrariness undermines theodicy; necessitation voids divine freedom.  

  ---

  ### **Key Conflicts & Repairs**  
  - **Deadlock 1: (iv) vs. Divine Freedom**  
    Grounding counterfactuals requires divine commitment to patterns, *threatening freedom*. **Repair**: Soften divine freedom — God *freely* sustains customs out of wisdom, making patterns stable but revisable. Cost: God’s will is *defeasibly* constrained by His own wisdom.  
  - **Deadlock 2: (9) Non-Arbitrary vs. Non-Necessitated**  
    This is **not** identical to Deadlock 1. Divine wisdom could entail *reasons* for customs without *necessitating* them (e.g., God selects among equally wise options). **Repair**: Adopt "moderate voluntarism": customs reflect divine wisdom *as chosen*, not wisdom as an external standard. Cost: Wisdom becomes subordinate to will.  

  **Least Costly Repair**: Adopt **Defeasible Custom**. God’s wisdom *inclines* Him toward stable patterns (grounding counterfactuals) without absolute necessity. Miracles remain possible, and freedom is preserved via divine choice, not randomness. Sacrifices: Strict immutability of divine action; robust eternalism about natural laws.  

  ---

  ### **Theory Scoring**  
  *(✔ = Satisfies, ✖ = Fails, ~ = Partially/Ambiguously)*  

  | Requirement          | al-Ghazālī (Divine Custom) | Necessitarianism | Concurrentism | Humean Regularity |
  |----------------------|----------------------------|------------------|---------------|-------------------|
  | (1) Cause vs. Occasion | ~ (Divine intention, but vague) | ✔ (Causal powers) | ✔ (Creature powers + divine concurrence) | ✖ (No robust distinction) |
  | (2) Unit of Action   | ~ (Patterns, but miracles token-based) | ✔ (Laws govern tokens) | ✔ (Tokens, with divine support) | ✔ (Patterns only) |
  | (3) Individuation    | ✖ (Act-individuation unexplained) | ✔ (Causal structures) | ✔ (Creature powers individuate) | ✖ (No causal "acts") |
  | (4) Counterfactuals  | ~ (Customs ground them, but miracles threaten) | ✔ | ✔ | ✖ (No necessity) |
  | (5) Miracle Epistemology | ✖ (No internal criterion) | ✔ (Violates laws) | ~ (Discernible via created powers) | ✖ (All events equally brute) |
  | (6) Human Agency     | ✖ (Occasionalism) | ✔ | ✔ | ~ (Reduced to regularity) |
  | (7) Causal Speech    | ~ (Elliptical: "God causes") | ✔ | ✔ | ✖ (Systematic error) |
  | (8) Dialectical Respect | ✔ | ✖ (Ignores critique) | ✔ | ✔ (No positive claim) |
  | (9) Non-Arb/Non-Nec  | ~ (Wisdom invoked, but tension with freedom) | ✖ (Necessitated) | ✔ (Wisdom + freedom via concurrence) | ✖ (Arbitrary patterns) |

  ---

  ### **Key Insights**  
  - **Most Eliminative Requirement**: **(1) Cause vs. Occasion**. It eliminates Humeanism (no distinction) and forces divine-custom/concurrentist accounts to specify divine intentionality.  
  - **Best Performer**: **Concurrentism** (e.g., Aquinas, Mullā Ṣadrā). Satisfies all ★-requirements by balancing creature powers with divine concurrence, grounding counterfactuals in natures while preserving divine freedom via continuous creation.  
  - **al-Ghazālī’s Weaknesses**: Individuation (3), human agency (6), and counterfactual stability (4) suffer due to occasionalist tendencies. His strength lies in (8) and (9)’s non-necessity.  
  - **Necessitarianism’s Fatal Flaw**: Fails (8) and (9) — al-Ghazālī’s critique shows it assumes, but cannot prove, necessity.  
  - **Humeanism’s Failure**: Collapses at (1), (4), (7) — cannot distinguish causes or support robust counterfactuals.  

  ---

  ### **Your Suspicions Confirmed**  
  - **(iv) vs. Freedom** is the central tension. Divine-custom theories *must* accept defeasible stability (sacrificing radical voluntarism) to avoid collapse.  
  - The **arbitrariness-necessity pincer** is independent: even if counterfactuals are secured, wisdom must avoid arbitrariness *without* introducing necessity. al-Ghazālī’s appeal to divine wisdom hints at a solution but lacks mechanics.  

  **Recommendation**: Build your account on **concurrentism** or a **robust divine-custom theory** (e.g., Fakhr al-Dīn al-Rāzī’s later work) that addresses individuation and counterfactuals via divine wisdom structuring customs. Abandon strict occasionalism — its costs (human agency, counterfactuals) outweigh benefits.  

  Let me know if you'd like to drill deeper into any conflict or theory.
