answer: |-
  Here is a direct engagement with your argument's structure and vulnerabilities, as requested:

  **1. The Equivocation**  
  It occurs in Section 5:  
  > "*Some contrasts hold no matter which indicator you start from, and those are the ones we should be willing to call real.*"  
  Here, "contrast" shifts between:  
  - **Sense 1 (Ontological)**: The *actual difference* in the historical record (e.g., increased text circulation).  
  - **Sense 2 (Epistemic)**: The *historian’s claim* about that difference (e.g., "Renaissance" as a label for the contrast).  
  **Damage**: In claiming Robustness bounds arbitrariness, you treat "contrasts" as features of the world (Sense 1). But when you say "selected by historians" earlier, "contrasts" imply constructed claims (Sense 2). This conflates the *existence* of a difference with the *significance* assigned to it.  

  **2. Independence of Requirements**  
  - **Robustness vs. Scale**:  
    - Robustness fails, Scale holds: A sharp change in church architecture (Scale: visible across ±30-year shifts) but no parallel shifts in politics or economy (fails Robustness).  
    - Robustness holds, Scale fails: A surge in vernacular literature (Robustness: confirmed via poetry, letters, sermons) but only detectable at 50-year resolution (fails Scale if zoomed to 10-year intervals).  
  - **Robustness vs. Availability**:  
    - Robustness fails, Availability holds: Participants debated "mechanical arts" (Availability) but the contrast lacks evidence in non-technical domains (fails Robustness).  
    - Robustness holds, Availability fails: Widespread shift in inheritance patterns (Robustness: legal docs, wills, family records) but no contemporary recognition or debate (Availability fails).  
  - **Scale vs. Availability**:  
    - Scale fails, Availability holds: Participants recognized a conflict over land rights (Availability), but the contrast blurs when boundaries move ±5 years (fails Scale).  
    - Scale holds, Availability fails: A climatic transition (e.g., Little Ice Age onset) is clear at 50-year scale (Scale) but premodern actors lacked concepts to articulate it *as a systemic shift* (Availability fails).  
  **Verdict**: All three are independent. None entail another.  

  **3. Availability Requirement: Hard Test Case**  
  **Case**: The "Consumer Revolution" (18th c.). Participants had no concept of "consumerism" or macro-economic shifts. Yet archaeology and probate inventories show a contrast: broader access to luxury goods (tea, porcelain) post-1750 vs. pre-1700.  
  **Your Application**: Fails Availability—no evidence participants framed this as a period-defining shift.  
  **Failure in Requirement or Application?**  
  - **Failure in Requirement**: If Availability demands *explicit recognition of periodizing significance*, it excludes structural changes actors experienced but didn’t debate *as historical boundaries*. This may be too strict.  
  - **Your Framework’s Vulnerability**: Availability risks over-privileging elite self-awareness. The Renaissance ("half-pass") relied on elite vocabularies; the Consumer Revolution’s silence doesn’t make the contrast less *structurally* real.  

  **4. The Concession in Section 5**  
  - **Does it outperform "useful fictions"?**  
    Yes—but narrowly. Your framework forces historians to *justify* contrasts via empirical demands (Robustness, Scale) and avoid anachronism (Availability). "Useful fictions" lacks these constraints.  
  - **"Real to a degree" defensible?**  
    Defensible *if* degrees track validation through your requirements (e.g., Renaissance scores 2/3, Scientific Revolution 1/3). It becomes evasion only if degrees are asserted without criteria.  
  - **If doing no work**: To regain interest, drop "real" entirely. Frame requirements as *conditions for explanatory usefulness* (not reality). Example: "Contrasts failing Availability are poor explanations for historical agency."  

  **5. Rewriting the Middle Ages Paragraph**  
  **Original**: 150 words. **Rewritten (75 words)**:  
  > "The Middle Ages is residual: bounded by Classical and Renaissance contrasts, its content is parasitic on what those exclude. It fails Availability because its explanatory power derives only from negating the Renaissance—we explain the Renaissance as non-medieval, but never the medieval as non-Renaissance. The Carolingian revival undermines it not by resemblance to the Renaissance but by revealing internal structure the term denies. As a residual, it indexes time but cannot contrast."  
  **What was lost**: The vivid "borrowing runs one way" metaphor and the Carolingian example’s specificity. The core argument (parasitic residual, failed Availability) remains.  

  **6. Cutting Priorities (Highest to Lowest)**  
  1. **Section 1, lines 4–6** ("Both sides argue... picks out.") **Cost**: Loss of setup clarity, but your argument supersedes this.  
  2. **Section 2, last sentence** ("Nearly every argument... arbitrary.") **Cost**: Removes a concrete example of the confusion, but the core point stands without it.  
  3. **Section 4, "The Scientific Revolution..." paragraph, lines 4–5** ("the participants grouped... one enterprise.") **Cost**: Weakens the Availability failure argument slightly; the next sentence ("What survives...") suffices.  
  4. **Section 6, lines 4–5** ("I suspect... have one.") **Cost**: Removes metacommentary but strengthens the conclusion’s confidence.  

  **7. The Unanswered Objection**  
  **Strongest Objection**: Your requirements presume *contrasts* are the goal of periodization. But historians often use periods to track *continuities* (e.g., "early modern" implying enduring structures across 1500–1800). By requiring contrasts, you dismiss periodizations that explain stability. This is especially damaging for conventionalists, who see periods as neutral containers—not inherently contrastive.  
  **Fatal?**: Not fatal, but unfinished. It demands a defense of why periodization *must* be contrast-driven. A sympathetic conventionalist would find this omission annoying because it sidesteps their core claim: periods are heuristics, not explanations.  

  ---

  ### Overall Assessment
  **Central Move**: Not mere relabeling. You reframe "reality" as *validation of explanatory contrasts* via three criteria. This is a substantive epistemological shift.  
  **Critical Vulnerability**: Availability’s dependency on historical actors’ self-awareness risks excluding structural or material contrasts (see Consumer Revolution test). Robustness without a theory of indicator independence may collapse into circularity.  
  **Recommendation**: Clarify "contrast" as *historian’s claim* (not the difference itself) throughout. Drop "real" for "validated" or "explanatorily robust." Address the continuity objection head-on: concede that periods *can* mark continuities, but argue that their *boundaries* only matter when contrasts are asserted.
