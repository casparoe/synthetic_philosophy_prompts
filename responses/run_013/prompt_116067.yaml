prompt: |-
  Ok so I'm teaching the Hofstadter Person Paper in a 75-minute seminar next month — about 15 upper-years, mostly philosophy but a few from ling and English — and what I want is a plan for how to teach it, not an explanation of it. The piece, if you don't have it handy: it's the satire where some unmarked default in English gets swapped out for another term so that an ordinary sentence turns grotesque, and the whole thing is written in a borrowed voice rather than the author's own. Heres my problem. It's over-assigned. Half the room will have met the trick already, or met a version of it, and once you know a substitution is coming the thing dies on the page — it turns into a museum piece about 1980s usage that everyone in the room already agrees with. So I need either the sequence that rebuilds the surprise, or an honest argument that rebuilding it is a lost cause and I should teach it as a period piece instead.

  Tell me: what has to be in place before the piece can land at all — I think it's the idea of a default assumption in reading, the thing where you hear that a dog walked into the room and silently give it a sex, but you tell me whether that's the right first move or whether it belongs later — then the one example that carries the whole session, then the misconceptions in the order they'll actually surface and the exact point in the sequence where I head each one off, then the question I ask at the end to see whether it landed, and what I should openly refuse to do at this level.

  On the carrying example: do not hand me the race-for-sex swap. They've either seen it or they're about to see it in the text, and either way it's inert. I want a different substitution axis, chosen for a stated reason, that I can build live on the board, and it has to be one where the absurdity actually bites for this particular room rather than one where they just nod along. Tell me what it must have and what would ruin it.

  Misconceptions I'm already braced for: "it's just a gotcha, satire proves nothing"; "so the point is that the word man is sexist" — I don't think that's the point, but argue me out of it if I'm wrong; and the etymological one, that the generic use was historically neutral so the fuss is manufactured. There will be more, and I want them mapped, not listed.

  Be committed. Pick a sequence, pick an example, and defend them — no menu of alternatives with a "you could also." Lead with your bottom line in the first sentence, then the reasoning. No preamble and don't restate the question back at me.
reasoning: |-
  Okay, the user is teaching Hofstadter's "Person Paper" satire in a seminar and needs a lesson plan. They're worried that the satire's impact is lost because many students will already know the substitution trick. The key is to rebuild the surprise or pivot to teaching it as a period piece. 

  First, I need to understand the core issue: the satire relies on revealing an unmarked default in language, like assuming gender when it's not specified. The user wants to avoid the overused race-for-sex substitution and find a fresh example that bites for philosophy, linguistics, and English students. 

  The user mentioned common misconceptions: satire as a gotcha, reducing the point to "man is sexist," and the etymological fallacy. I need a sequence that preempts these. The plan must start by establishing what a linguistic default is without giving away the trick. 

  Brainstorming a new substitution axis: philosophy students might engage with a "human/non-human" swap. For example, replacing "human" with "cow" in contexts where humans are the default. "A researcher must ensure the comfort of his cows" becomes absurd when flipped. This highlights anthropocentrism, which could resonate with animal ethics discussions in philosophy. 

  Why this works: It's unfamiliar, so surprise is possible. It targets a default specific to academic contexts (human centrality), making the absurdity visceral. It avoids the sexism debate, sidestepping predictable reactions. Also, it connects to philosophical questions about language and ethics. 

  Sequence outline: 
  1. Start by defining linguistic defaults—ask students for examples of assumptions in language (e.g., "doctor" implies male). 
  2. Introduce a neutral example, like "artist," to show defaults aren't always harmful. 
  3. Build the "cow" substitution live: first show a sentence with "human" as default, then swap. Highlight the absurdity and ethical weight. 
  4. Preempt misconceptions: 
     - For "it's just satire," argue that satire exposes invisible norms. 
     - For "point is word X is bad," redirect to systemic bias in defaults. 
     - For etymology, stress that neutrality in origin doesn't negate present impact. 
  5. End by asking students to find another default in their field, assessing if they grasp the mechanism. 

  Key moves: Ban rehashing the original text; focus on how defaults function. Make the example live and participatory. The goal isn’t to revive 1980s gender debates but to show how language invisibly shapes thought. 

  Final check: Will this rebuild surprise? Probably, because the axis is new. Does it avoid being a museum piece? Yes, by linking to broader philosophical questions about language and power. The cow example is jarring enough to land but not so charged it derails discussion. Solid plan.
answer: |-
  Here is your seminar plan, stripped to the bones:

  **Bottom Line:** Rebuild surprise by *constructing a novel, high-stakes substitution axis live* focusing on **agency/intelligence defaults in AI discourse**, then pivot to Hofstadter as a case study in *mechanism*, not content.

  ### Sequence & Reasoning
  1.  **Primer: What We Assume Without Hearing (10 mins)**
      *   **Do NOT mention substitution or satire.** Start blind.
      *   **Ask:** "When I say 'The *professor* solved the problem,' what specific image forms? Be honest." (Elicit: likely male, older, specific race/field). Then: "What about 'The *nurse* calmed the patient'?" (Elicit: likely female).
      *   **Key Move:** Isolate the concept: "**Linguistic Defaults.** We silently fill in unstated attributes *based on cultural associations*. It happens instantly, unconsciously. It shapes how we understand the world through language."
      *   **Why First?** Establishes the *cognitive mechanism* as the core subject, not gender. Makes the default visible *before* manipulation. Avoids priming for sex substitution.

  2.  **Live Construction: Building a New Axis - "Human" vs. "AI" (25 mins)**
      *   **Axis Choice:** Agency/Intelligence Attribution. **Why?**
          *   **Unfamiliar:** Less likely to be pre-gamed than sex/race.
          *   **High Stakes:** Directly relevant to philosophy (agency, consciousness), ling (semantic frames), English (narrative voice). Bites *now*.
          *   **Visceral Absurdity:** Assigning complex human traits to simple tools, or denying them to complex systems, feels jarringly wrong.
          *   **Avoids Sexism Debate Trap:** Sidesteps the "man is sexist" dead-end.
      *   **Build It Live:**
          1.  Write a *banal sentence* embodying the **default assumption of human agency/intelligence superiority:** "After careful **evaluation**, the **researcher** determined the **tool** was malfunctioning and instructed **it** to recalibrate."
          2.  **Dissect Assumptions:** "What's assumed here about the *researcher*? (Human, intelligent agent). About the *tool*? (Passive, non-agentic object)."
          3.  **Introduce the Swap:** "Now, let's swap the **domain of assumed agency**. We'll replace references assuming *complex human-like agency/intelligence* with **'Cow'**, and references assuming *simple, non-agentic tool-ness* with **'Human'**." (Write key: Researcher/Cow ; Tool/Human).
          4.  **Apply Swap Live:** Rewrite sentence together: "After careful **evaluation**, the **Cow** determined the **Human** was malfunctioning and instructed **it** to recalibrate."
          5.  **Elicit the Grotesque:** "What happens? Why does this feel absurd/wrong?" (Absurdity: Attributing complex evaluation/instruction to a cow; reducing a human to a malfunctioning tool to be recalibrated. Grotesqueness: Dehumanization meets bovine hyper-agency).
          6.  **Stress the Mechanism:** "The *structure* is identical. Only the *default assumptions we brought* changed. The absurdity comes from violating the *unspoken hierarchy* embedded in the original language."

  3.  **Introduce Hofstadter *as Demonstration* (15 mins)**
      *   "Douglas Hofstadter did something structurally identical in 1982, targeting a different set of defaults. Read section X [e.g., the first few paragraphs introducing the 'race' substitution]."
      *   **Focus Question:** "Don't focus on *what* he swapped. Focus on *HOW* it works. What **linguistic default** is his swap revealing and destabilizing? How does the *feeling* it produces compare to our Cow/Human example?"
      *   **Key Pivot:** Hofstadter isn't the *lesson*; he's an *example* of the cognitive/linguistic mechanism you just demonstrated live. The mechanism is the subject.

  4.  **Preempting & Routing Misconceptions (15 mins)**
      *   **"Satire is just a gotcha, proves nothing":**
          *   **When it surfaces:** During Hofstadter discussion or wrap-up.
          *   **Head-off:** "Does our Cow/Human swap *prove* cows are unintelligent or humans shouldn't be tools? No. It *reveals* and *makes visceral* the **unquestioned hierarchy** embedded in our language about AI/humans. Satire exposes the *existence and power* of the default by violating it. The 'proof' is in your gut reaction."
      *   **"So the point is the *word* 'man' is sexist":**
          *   **When it surfaces:** Reading Hofstadter.
          *   **Head-off:** "Is the point of *our* example that the *word* 'researcher' or 'tool' is speciesist? No. It's that the **entire conceptual framework** – the assumed roles, agency, and hierarchy – is embedded *in how we use language generally*. 'Man' was just *one marker* of a much larger system of defaults Hofstadter targeted. The word is a symptom, the system is the disease."
      *   **"The generic use was historically neutral, so the fuss is manufactured":**
          *   **When it surfaces:** Discussion of historical context.
          *   **Head-off:** "Does the *historical origin* of 'man' change the **experience** of someone encountering it *today* where the male-specific sense is dominant? Does it change how the **default assumption** functions *cognitively right now*? Our Cow/Human swap might have roots in agriculture, but that doesn't make it less absurd *or less revealing of current assumptions* when applied to AI researchers. Language meaning is use, not just etymology."
      *   **Likely Addition: "But language changes/This is outdated":**
          *   **When it surfaces:** Post-Hofstadter.
          *   **Head-off:** "Agreed! And *why* might it change? Often precisely because interventions like Hofstadter's (or everyday pushback) make the **harm or absurdity** of an old default *visible and uncomfortable*, creating pressure for new forms. The mechanism, however, remains – we constantly create new defaults."

  5.  **The Landing Question & Refusal (10 mins)**
      *   **Landing Question:** "**Identify one other domain (not gender or AI) where a powerful linguistic default operates. What unspoken assumption does it encode, and what kind of swap might expose its absurdity or weight?**" (e.g., "citizen" vs. "undocumented immigrant", "artist" vs. "algorithm", "patient" vs. "consumer"). Assesses grasp of the *mechanism* and ability to apply it beyond the examples.
      *   **What to Refuse:** **Do NOT engage in a deep debate about 1980s gender politics or the current 'correctness' of specific terms.** Shut it down: "Our focus is the *linguistic and cognitive mechanism* of defaults revealed by substitution, not adjudicating specific historical or contemporary usage debates. Hofstadter is our *example*, not our *topic*."

  ### Why This Works
  *   **Rebuilds Surprise:** The novel AI/Cow axis is unfamiliar and high-stakes. Building it live creates investment.
  *   **Makes Mechanism Primary:** Hofstadter becomes an *instance*, not the sole focus. The core subject is how linguistic defaults work and how satire exposes them.
  *   **Preempts Misconceptions:** Addresses the core flaws in common reactions by rooting the discussion in the *structure* and *effect* of the substitution, not the specific content of Hofstadter's example.
  *   **Ensures Relevance:** Connects directly to contemporary concerns (AI ethics, agency) relevant across Philosophy, Ling, and English.
  *   **Protects Against Museum-ification:** By starting with a live, modern example and treating Hofstadter as a case study, it prevents the piece from being a stale relic. The *technique* is timeless.
  *   **The Cow/Human Swap Works Because:**
      *   **It Has:** A clear, high-stakes hierarchy (agency/intelligence), common modern context (AI), banal starter sentence, visceral absurdity upon swap, direct relevance to students' fields.
      *   **Would Ruin It:** Choosing a low-stakes axis (e.g., "chef"/"microwave"), using an already politicized axis (e.g., "terrorist"/"freedom fighter"), explaining the *purpose* before the swap, or not making the swap live and visceral.

  **Execute relentlessly.** Control the frame: This is a seminar about how language encodes and hides assumptions, using satire as a scalpel. Hofstadter provides *one* blade.
