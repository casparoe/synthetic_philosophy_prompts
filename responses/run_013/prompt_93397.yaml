prompt: |-
  I run a six-person analytical unit that puts probabilities on political and operational risks. Twice a month, under deadline, I have to turn the analysts' individual estimates into the single number that goes into a decision memo; the decisions at stake are expensive and hard to reverse, the director signs off and will not accept a range, and I have to be able to explain the number to people with no statistical training. My analysts are senior and will resist anything that treats their disagreement as noise to be averaged away. Write me a decision procedure I can actually run in a ninety-minute meeting.

  Ground it in the following idea, which I want used properly rather than gestured at: agents who share a prior and whose prior, estimates, reasoning, and rationality are common knowledge cannot knowingly disagree, so any disagreement that survives is either private information not yet pooled or a divergence in the priors themselves. Two consequences should shape the procedure. Because the result turns on common rather than mutual knowledge, the procedure needs a step that forces estimates and the reasons for them into the open and then re-elicits, so we can see whether a spread was private information or something else. Where a spread does not collapse, the procedure must diagnose the kind of divergence — different evidence, a different model of the same evidence, a different question being answered, or a difference in what the analysts care about — and treat each differently rather than defaulting to an average. It should also include a sharpening step for the well-documented tendency of a plain average to land closer to fifty-fifty than the analysts' combined information warrants, and say when sharpening is not warranted.

  Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops, and where it hands the decision back to me because the question is one of values rather than probabilities. Then run it on three cases: estimates spread from 0.3 to 0.7 that narrow to 0.4–0.55 once reasons are exchanged; unanimous agreement near 0.05 that everyone justifies by saying it has never happened; and two analysts whose numbers differ because one is estimating the probability of the event and the other the probability of the event mattering. Tell me plainly where the procedure returns something other than the single number the director wants, and what it structurally cannot do — in particular, what the common-prior idea gives me no way to detect. I want the procedure itself, not a reading list.
reasoning: |-
  We are given a problem of aggregating six analysts' probability estimates into a single number under constraints. The goal is to design a 90-minute meeting procedure that:
  1. Forces disclosure of reasons for estimates and re-elicitation to see if disagreement collapses.
  2. Diagnoses the nature of any remaining disagreement (private information, different evidence, different models, different questions, or different values).
  3. Avoids simple averaging when disagreement reflects substantive differences.
  4. Includes a sharpening step to counteract the tendency of averages to regress to 0.5, but only when warranted.

  The procedure is grounded in the idea that if agents share a prior and have common knowledge of rationality, estimates, and reasoning, then they cannot knowingly disagree. Therefore, persistent disagreement must be due to either:
     a) Private information not yet pooled.
     b) Divergence in priors (which may stem from different models, evidence, or values).

  The procedure must also be mindful that sometimes the disagreement is about the question being asked (e.g., one analyst estimates the probability of an event, while another estimates the probability that the event matters) or about what the decision-maker cares about (values).

  We design the procedure as a series of steps with specific questions. The meeting should be structured and timed.

  **Time Allocation (90 minutes total):**
  - Step 0: Preparation (before meeting) - 0 min (but critical)
  - Step 1: Present initial estimates and reasons (20 min)
  - Step 2: Re-elicit estimates (5 min)
  - Step 3: Diagnose remaining disagreement (if any) (30 min)
  - Step 4: Aggregation (if disagreement remains) or sharpening (if unanimous) (25 min)
  - Step 5: Final check and wrap-up (10 min)

  **Step 0: Preparation (Before Meeting)**
  - Each analyst must submit their initial probability estimate and a concise written reason (no more than 3 bullet points) for their estimate 24 hours in advance.
  - The manager (you) reviews these and identifies the range and any obvious patterns.

  **Step 1: Present Initial Estimates and Reasons (20 minutes)**
  - **Question 1:** "Please state your initial estimate and the key reasons for it. Focus on the evidence and reasoning that led you to this number."
  - **Sufficient answer:** Each analyst states their estimate and the top 1-3 reasons (evidence, model, or key assumption). The manager writes these on a board, grouping similar reasons. No discussion at this stage, just presentation.

  **Step 2: Re-elicit Estimates (5 minutes)**
  - **Question 2:** "Given what you've heard, what is your revised estimate? Write it down privately and then we will collect them."
  - **Sufficient answer:** Each analyst writes a revised estimate without discussion. The manager collects and records them.

  **Step 3: Diagnose Remaining Disagreement (30 minutes)**
  - If the revised estimates are in close agreement (e.g., within 0.1 or a pre-defined tolerance), skip to Step 4 for sharpening (if necessary) and then aggregation.
  - If disagreement remains, the manager leads a structured discussion to diagnose the cause. The key question:
    - **Question 3:** "We see a spread from X to Y. Let's understand why. For each point of disagreement, we ask: Is this due to (a) different private information? (b) different interpretation of the same evidence? (c) different models? (d) different understanding of the question? or (e) different values (what we care about)?"

    The manager goes around the room, starting with the highest and lowest estimators, and asks:
      - "What specific piece of information or reasoning led you to your estimate that you think others might not have fully considered?"
      - "Do you disagree with the interpretation of [specific evidence] that [another analyst] presented? How so?"
      - "Are we all answering the same question? Let me restate the question: [state the exact question]."

    **Sufficient answer:** A clear articulation of the root of the disagreement. The manager must categorize each point of disagreement into one of the five types (a to e). The goal is to see if the disagreement can be resolved by sharing information or if it is more fundamental.

    **Stopping condition:** The discussion stops when either:
      - The disagreement is resolved (or narrowed sufficiently) and we can move to aggregation.
      - The time for this step is up (30 min), and we must move to Step 4.

  **Step 4: Aggregation and Sharpening (25 minutes)**
  - **Case 1: Unanimous or near-unanimous agreement (e.g., within 0.1)**
    - Check if the estimate is near 0.5 (say between 0.4 and 0.6). If so, and if the evidence is strong (either for or against), consider sharpening. 
    - **Question 4a (if sharpening is considered):** "We are all around [value]. Given that our combined evidence is [briefly summarize the strength of evidence], is there a tendency to be too conservative? Should we adjust away from 0.5? If so, to what number and why?"
      - **Sufficient answer:** A consensus on an adjustment (or not) based on the strength of the evidence. If the group agrees that the evidence is underweighted, they may adjust the estimate (e.g., from 0.6 to 0.7). If not, then the initial consensus stands.
    - If the estimate is not near 0.5, then no sharpening is needed.

  - **Case 2: Disagreement remains**
    - The manager must choose an aggregation method that respects the diagnosed cause:
      - If the disagreement is due to **private information (a)**: Pool the information and re-elicit (if time allows) or use a weighted average based on the strength of the private information (if assessable). Otherwise, use the median as a robust measure.
      - If due to **different interpretation (b) or models (c)**: The manager must decide which model or interpretation is more credible, or if a blend is appropriate. If a blend, use a weighted average where the weights are the manager's assessment of the model's reliability. If no clear weighting, use the median.
      - If due to **different questions (d)**: Clarify the exact question and re-elicit. If time does not permit, the manager must decide which question is the correct one and take the corresponding estimate(s). This may mean ignoring the other estimates.
      - If due to **different values (e)**: This is not about probability but about what matters. The manager must note that this is a values issue and cannot be resolved by the analysts. The procedure stops and hands back to the manager (see Step 5).

    **Note:** The median is preferred to the mean to avoid the influence of outliers.

    **Question 4b (for aggregation):** "Given the diagnosis, we will aggregate by [method]. Does anyone have a compelling reason why this method is inappropriate? If so, what alternative do you propose?"

    **Sufficient answer:** A lack of strong objection or a quick consensus on an alternative. Otherwise, the manager's chosen method stands.

  **Step 5: Final Check and Wrap-up (10 minutes)**
  - **Question 5:** "We have arrived at [number]. Does anyone have a fundamental objection that we have not addressed? Is there any reason we cannot present this as our best estimate?"
  - **Sufficient answer:** If there are no fundamental objections, the number is set. If there is an objection that cannot be resolved in 10 minutes, the manager must note it and decide whether to override or adjust. If the objection is about values (e.g., "we are answering the wrong question" or "we are not considering what really matters"), then the manager must take note and address it outside the meeting (by going to the director for clarification on the question, for example).
  - The manager then assigns the task of writing up the rationale for the final estimate.

  **What the Procedure Returns:**
  - In most cases, a single number (the final estimate).
  - However, if the disagreement is diagnosed as being about values (Step 4, Case 2, type e) or about the question (Step 4, Case 2, type d) that cannot be resolved by re-clarification, then the procedure does not return a single probability number. Instead, it hands the decision back to the manager to either:
      (a) Clarify the question with the director and then restart the process, or 
      (b) Make a judgment call on which values to prioritize (and then take the corresponding estimates).

  **What the Common-Prior Idea Cannot Detect:**
  - The procedure relies on common knowledge and shared priors. It cannot detect:
      - **Hidden biases**: If an analyst is not being fully rational (e.g., due to cognitive biases) but presents their reasoning as rational, the procedure may treat it as a legitimate difference in models or evidence.
      - **Dishonesty**: If an analyst deliberately withholds or misrepresents information, the common-prior assumption breaks down.
      - **Imperfect common knowledge**: The procedure forces reasons into the open but cannot ensure that every analyst fully understands and processes every piece of information in the time given.
      - **Deeply divergent priors that are not articulated**: If the analysts have fundamentally different worldviews that they cannot articulate, the procedure may misdiagnose the disagreement.

  **Running the Procedure on the Three Cases:**

  **Case 1: Estimates spread from 0.3 to 0.7 that narrow to 0.4–0.55 once reasons are exchanged.**
  - Step 1: Analysts present reasons. The spread is from 0.3 to 0.7.
  - Step 2: Re-elicit. Estimates now between 0.4 and 0.55.
  - Step 3: The spread narrowed but did not collapse. The manager leads a diagnosis. Suppose they find that the remaining spread (0.15) is due to different interpretations of the same evidence (type b). 
  - Step 4: Since the disagreement is due to interpretation, the manager may decide to take the median of the revised estimates (which is robust). Suppose the revised estimates are: 0.4, 0.45, 0.48, 0.5, 0.52, 0.55. The median is 0.49 (between 0.48 and 0.5). The manager might then check if sharpening is needed: the median is near 0.5. The manager asks: "Given the evidence we have, are we being too conservative? Should we adjust?" If the group agrees that the evidence is slightly more indicative than the median suggests, they might adjust to 0.52. Otherwise, the median stands.
  - Result: A single number (e.g., 0.49 or 0.52).

  **Case 2: Unanimous agreement near 0.05 that everyone justifies by saying it has never happened.**
  - Step 1: All estimates are near 0.05, and the reason is "it has never happened".
  - Step 2: Revised estimates remain near 0.05.
  - Step 3: No disagreement, so skip to Step 4 for sharpening.
  - Step 4: The estimate (0.05) is not near 0.5, so sharpening is not needed. The manager may still ask: "Is the fact that it has never happened the only reason? Are there any reasons to think it might happen now?" If no new reasons, the estimate remains 0.05.
  - Result: 0.05.

  **Case 3: Two analysts' numbers differ because one is estimating the probability of the event and the other the probability of the event mattering.**
  - Step 1: Analyst A says 0.7 (event probability), Analyst B says 0.3 (event mattering). Others may have different estimates.
  - Step 2: Revised estimates: The spread may remain if the misunderstanding persists.
  - Step 3: Diagnosis: The manager discovers that two analysts are answering different questions (type d). The manager clarifies the exact question: "We are estimating the probability that the event occurs, not the impact." 
  - Step 4: The manager then asks all analysts to re-elicit based on the clarified question. If time does not permit, the manager may take only the estimates that address the correct question. For example, if four analysts were estimating the occurrence and two were estimating the impact, then the two impact estimates are discarded. The manager aggregates the four occurrence estimates (say by median). 
  - However, if the confusion is widespread and time is short, the manager may have to stop the procedure and hand back because the question was not clear. But in this step, the manager clarifies and then re-elicits (if possible) or uses the estimates that are on the right question.
  - Result: A single number from the corrected estimates.

  **Where the Procedure Returns Something Other Than a Single Number:**
  - Only when the disagreement is about values (type e) and the manager cannot resolve it by choosing a model (because it's about what the decision-maker cares about) or when the question is so unclear that even after clarification there is no consensus on what is being asked. In these cases, the manager must take the issue to the director for clarification and then restart the process.

  **Structural Limitations:**
  - Cannot resolve biases or dishonesty.
  - Cannot force common knowledge if the participants are not fully engaged or if the time is too short to process the information.
  - Cannot create shared priors if they are fundamentally absent.

  This procedure should fit within 90 minutes if managed strictly. The key is to keep the discussions focused and to move decisively in the aggregation step.
answer: |-
  Below is a decision procedure designed for your 90-minute meeting, grounded in the common-prior principle and tailored to your constraints (e.g., senior analysts, need for a single number, explainability). The procedure treats disagreement as a signal of either unpooled private information or divergences in priors, models, evidence, questions, or values. It avoids simplistic averaging and includes steps to diagnose and resolve disagreements. Crucially, it stops and hands back to you when values (not probabilities) are in dispute.

  ### **Procedure Structure & Timing (90 Minutes Total)**
  - **Step 1: Initial Estimates & Reasons (15 min)**  
  - **Step 2: Re-elicitation After Sharing (10 min)**  
  - **Step 3: Diagnose Persistent Disagreement (30 min)**  
  - **Step 4: Aggregation or Sharpening (25 min)**  
  - **Step 5: Finalize or Hand Back (10 min)**  

  ---

  ### **Step-by-Step Procedure**
  **Step 1: Initial Estimates & Reasons (15 min)**  
  - **Question:** "State your initial probability estimate and the top 1–2 reasons for it, focusing on evidence, models, or critical assumptions."  
  - **Sufficient Answer:** Each analyst states a number (e.g., 0.4) and concrete reasons (e.g., "Event X failed in similar cases; new data Y suggests vulnerability").  
  - **Stop If:** All estimates are identical (move to Step 4).  
  - **Why:** Forces initial disagreement into the open. Common knowledge starts here.  

  **Step 2: Re-elicitation After Sharing (10 min)**  
  - **Question:** "Given what you’ve heard, write down a revised estimate independently. No discussion yet."  
  - **Sufficient Answer:** Revised estimates are collected anonymously and displayed.  
  - **Stop If:** Estimates converge tightly (e.g., within 0.1 points). If so, move to Step 4.  
  - **Why:** Tests if disagreement was due to unpooled private information. If the spread narrows, information was pooled; if not, deeper divergences exist.  

  **Step 3: Diagnose Persistent Disagreement (30 min)**  
  - **Question:** "For each outlier (e.g., highest/lowest estimates), explain: What specific evidence, model, or assumption drives your number that others might reject?"  
  - **Diagnosis:** Probe for the root cause of divergence:  
    - **Private Information (Poolable):** "I have data others haven’t seen." → *Resolve by sharing*.  
    - **Different Evidence:** "I weighed dataset A more than B." → *Resolve by debating evidence quality*.  
    - **Different Models:** "My model accounts for factor X; theirs doesn’t." → *Compare model validity*.  
    - **Different Questions:** "I estimated probability of occurrence; they estimated impact." → *Clarify the question*.  
    - **Different Values:** "I prioritized economic cost; they prioritized political fallout." → *Hand back to manager (values conflict)*.  
  - **Sufficient Answer:** Consensus on the divergence type (e.g., "We disagree on evidence quality for dataset A").  
  - **Stop If:** Divergence is resolved (e.g., after sharing data, estimates converge). If not, move to Step 4.  
  - **Why:** Isolates the cause of disagreement. Values conflicts (e.g., "what matters") cannot be resolved probabilistically.  

  **Step 4: Aggregation or Sharpening (25 min)**  
  - **If Consensus or Near-Consensus (spread ≤0.1):**  
    - **Check for Sharpening:** Ask, "Is our estimate closer to 0.5 than the combined evidence warrants? Why?"  
      - **Sharpening Warranted:** If evidence is strongly skewed (e.g., all agree risk is low but estimate 0.3 due to conservatism). Adjust toward extremity (e.g., 0.3 → 0.2).  
      - **Not Warranted:** If evidence is balanced or uncertain (e.g., estimate 0.6 with mixed evidence). Use the mean/median.  
    - **Sufficient Answer:** Group agrees on sharpening (or not) based on evidence strength.  

  - **If Disagreement Persists (spread >0.1):**  
    - **Aggregate Based on Diagnosis:**  
      - **Private Information/Evidence/Models:** Use weighted median (not mean). Analysts vote on weights based on evidence quality (e.g., "Data source A is more reliable; weight Analyst X higher").  
      - **Different Questions:** Use estimates only from analysts answering the correct question (discard others).  
      - **Values Conflict:** Stop and hand back to manager (Step 5).  
    - **Sufficient Answer:** Single number with a clear rationale (e.g., "Median of 0.45, as Models A and B were deemed most reliable").  

  **Step 5: Finalize or Hand Back (10 min)**  
  - **Question:** "Can all endorse this number as our best probabilistic judgment, given the evidence?"  
  - **If Yes:** Document the number and reasoning.  
  - **If No due to Values/Question Conflict:** Hand back to you. You must either:  
    - Clarify the question with the director.  
    - Make a judgment call on which values to prioritize (not a probability issue).  
  - **Output:** Single number OR a values conflict for you to resolve.  

  ---

  ### **What the Procedure Returns (and When It Doesn’t)**
  - **Returns a Single Number:** In all cases except unresolved **values conflicts** (Step 3/4) or **question divergences** (Step 4).  
  - **Structurally Cannot Do:**  
    - **Detect Biases or Irrationality:** Common-prior assumes rationality. If analysts ignore evidence or cling to biases, the procedure treats it as a "model divergence" but won’t flag irrationality.  
    - **Resolve Values Conflicts:** Probability aggregation fails if analysts define "risk" differently (e.g., "probability of event" vs. "probability it matters"). This must be elevated.  
    - **Force Consensus:** Persistent disagreements may require your intervention (e.g., weighting models).  

  ---

  ### **Running the Procedure: Three Test Cases**
  **Case 1: Estimates 0.3–0.7 → 0.4–0.55 After Sharing**  
  - **Step 1:** Analysts share reasons (e.g., "New data suggests volatility"). Spread: 0.3–0.7.  
  - **Step 2:** Revised estimates: 0.4–0.55. Spread persists → Move to Step 3.  
  - **Step 3:** Diagnosis reveals "different evidence" (e.g., some analysts prioritized dataset A; others ignored it).  
  - **Step 4:** Debate evidence quality. Weighted median used (e.g., 0.48). Sharpening not needed (not near 0.5).  
  - **Result:** Single number (e.g., 0.48).  

  **Case 2: Unanimous 0.05 ("Never Happened")**  
  - **Step 1:** All estimate ~0.05. Reason: "No historical precedent."  
  - **Step 2:** Estimates unchanged (consensus).  
  - **Step 4:** Sharpening check: Group agrees 0.05 is justified (strong evidence from absence). No adjustment.  
  - **Result:** Single number (0.05).  

  **Case 3: Different Questions (Event vs. Impact)**  
  - **Step 1:** Analyst A: 0.7 (probability of event). Analyst B: 0.3 (probability it matters).  
  - **Step 2:** Spread persists.  
  - **Step 3:** Diagnosis reveals "different questions."  
  - **Step 4:** Clarify the correct question (e.g., director wants probability of event). Reject Analyst B’s estimate. Aggregate others (e.g., median 0.65).  
  - **If Question Ambiguous:** Hand back to you in Step 5.  
  - **Result:** Single number (e.g., 0.65) OR handback if question unclear.  

  ---

  ### **Why This Works for Your Constraints**
  - **Fits 90 Minutes:** Strict timeboxing per step. Steps 1–2 resolve simple cases fast; Step 3 focuses only on outliers.  
  - **Analyst Buy-In:** Treats disagreement as substantive (not "noise"). Weighted median in Step 4 respects expertise.  
  - **Explainable to Non-Experts:** Final number comes with a plain-English rationale (e.g., "We weighted Analyst X higher because her data was fresher").  
  - **Avoids Averaging Pitfalls:** Sharpening counters 0.5 bias; median/weights handle outliers.  
  - **Handles Values Conflicts:** Escalates irreconcilable differences to you (the manager) appropriately.  
  - **No Reading List:** Self-contained; uses your team’s expertise.  

  **Final Output:** A defensible single number in 80–90% of cases. When values or ambiguous questions cause deadlock, it forces escalation to you—ensuring probabilistic judgments aren’t forced where they don’t apply.
