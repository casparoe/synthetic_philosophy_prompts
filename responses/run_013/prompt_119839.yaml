prompt: |-
  Okay so I've somehow ended up as the person who has to write the call for proposals for a small foundation that wants to sink about $15M over five years into "the deep determinants of development" — you know, the why-are-some-places-rich-and-others-poor question, and whether the answer is mostly institutions, mostly geography, or mostly culture. I have to decide what to actually ask people to work on and I keep flip-flopping. My fear is that the whole field is a treadmill: every year there's another cross-country regression or another clever historical natural experiment, and it always lands on "institutions matter, with caveats" or "geography matters, with caveats," and none of it accumlates into an answer. The instrument is always questionable (settler mortality, colonial borders, whatever), the outcome is always measured badly, and everybody's preferred cause turns out to be endogenous to everybody else's — geography shapes institutions, institutions shape culture, culture shapes which institutions stick. So I suspect the honest framing is less "which of the three wins" and more "what can we legitimately learn about causation from history at all," and if that's the real question then that's what I want to fund.

  So here's what I want from you: not a lit review, an agenda. If you had my $15M and five years and maybe a dozen teams, which open questions in this area would you actually prioritize, and in what order? Tell me what's upstream of what — which questions, if settled, would make the others tractable — what's tractable with the tools that exist (quasi-experiments, border discontinuities, historical microdata, formal models, maybe some new data sources), what's neglected because it's unfashionable rather than because it's dead, and what's a dead end dressed up as a live one. And price the trade-offs for me: I'd rather fund one thing that could actually change how the field reasons than five things that produce publishable nulls.

  A couple of half-formed ideas from my own notes that you should feel free to shoot down or build on. One colleague keeps pushing "switching cases" — forget decomposing the variance across all countries and just study the places that flipped within a generation or two, using within-pair contrasts like the two Koreas, the two Germanys, Botswana versus Zimbabwe, as the unit of analysis. I can't tell if that's a real research program or a parlor trick. Another idea: run a many-analysts-style exercise where a bunch of teams get handed the same historical dataset and we see how much their answers diverge, as a way of measuring how much of the disagreement is the world and how much is the analyst. And a third: stop asking whether institutions or geography or culture "matters" and instead ask about switching dynamics — under what conditions does a place escape a bad equilibrium, and is that even a causal question or a narrative one. Which of these, or something I'm not seeing, is worth the money — and what evidence over the next couple of years would move it up or down your list?
reasoning: |-
  Okay, let me unpack this user's query. They're tasked with writing a call for proposals for a $15M foundation grant focusing on the deep determinants of development—specifically institutions, geography, and culture. The user is frustrated with the field's stagnation: endless regressions and natural experiments that yield non-cumulative, caveat-laden conclusions. They want to move beyond the "which factor wins" debate and instead fund research that addresses the fundamental challenges of causal inference in historical development studies.

  The user's explicit request is for a research agenda, not a literature review. They want priorities, tractability assessments, and trade-offs. But reading between the lines, their deeper needs include:
  - Escaping circular debates about endogeneity between institutions/geography/culture
  - Funding work that could shift the field's methodological paradigms
  - Avoiding "publishable nulls" in favor of transformative insights
  - Identifying research that acknowledges history's complexity without abandoning rigor

  Their half-formed ideas reveal interesting tensions:
  1. **Switching cases** (e.g., Koreas/Germanys): Could this solve endogeneity or just create new selection bias problems?
  2. **Many-analysts projects**: Would this expose methodological fragility or just document disagreements?
  3. **Equilibrium transitions**: Is this a way to study causation or a retreat into narrative?

  The foundation's scale ($15M over 5 years for ~12 teams) is unusual—it allows for coordinated attacks on hard problems. Most grants fund isolated projects; here they can build connected infrastructure. 

  Key barriers in the field they're rightly frustrated by:
  - **Endogeneity galore**: Everything causes everything else in development
  - **Measurement theater**: Fancy instruments masking bad proxies (e.g., settler mortality standing in for institutions)
  - **Causal illusion**: Mistaking clever identification for deep understanding
  - **Narrative resistance**: Ignoring path dependence because it's "too hard"

  Their intuition that "what can we learn from history at all?" is the real question seems spot-on. The field keeps pretending history is a lab when it's really a tangled ecosystem. 

  So the response needs to:
  - Prioritize questions that force engagement with causal complexity
  - Demand methodological innovation beyond regression discontinuity
  - Fund work that builds shared data/analytic infrastructure
  - Reward projects that could collapse circular debates

  The proposed agenda should:
  1. **Upstream first**: Tackle causal identification head-on before funding more "X matters" studies
  2. **Embrace messiness**: Support methods for nonlinear, contingent processes
  3. **Force synthesis**: Make teams confront competing explanations simultaneously
  4. **Value negative space**: Fund what journals ignore (e.g., failed transitions, non-European cases)

  The switching cases idea is promising but needs refinement—it shouldn't just compare "flipped" pairs but study the flip mechanism itself. The many-analysts project could be powerful if focused on analytic flexibility rather than just replication. The equilibrium question is crucial but requires new methods beyond current quasi-experiments.

  Biggest risk is funding more incremental work disguised as boldness. The response should emphasize red flags: projects using single instruments, claiming "clean identification," or ignoring counterfactuals. Green flags: teams combining historians/social scientists, studying how causation changes across contexts, or building tools for dynamic modeling.

  Ultimately the foundation's leverage is scale and duration—it can fund the unglamorous base layers (data, methods) that enable breakthroughs later. The agenda should reflect that patience.
answer: |-
  Here's a prioritized research agenda designed to break the treadmill and force progress on causal understanding, structured by tractability, upstream importance, and potential for field-changing impact. The $15M/5-year scale allows for parallel exploration of interconnected pillars. **The core shift: Stop decomposing variance, start studying *change mechanisms* and *causal identification limits*.**

  ### Prioritization Logic
  1.  **Upstream First:** Address foundational causal identification problems before funding substantive "X matters" studies.
  2.  **Tractability with Leverage:** Focus on approaches where new data/methods *can* resolve longstanding ambiguities within 5 years.
  3.  **Neglect over Fashion:** Prioritize unfashionable questions (dynamics, failure, non-European cases) over incremental regressions.
  4.  **Kill Circularity:** Force confrontation with endogeneity and equifinality (multiple paths to same outcome).

  ---

  ### The Agenda: Four Pillars (Ordered by Priority & Upstreamness)

  1.  **Pillar 1: The Historian's Crucible - Rigorous Process Tracing of Institutional/Cultural Shifts ($4M)**
      *   **The Core Problem:** Cross-country regressions and natural experiments often ignore the *actual mechanisms* of change and context-specific contingency. "Institutions matter" tells us nothing about *how* they emerge, stabilize, or change.
      *   **The Ask:** Fund 4-5 interdisciplinary teams (historians, political scientists, economists, anthropologists) to conduct *deep comparative case studies of "switching cases" and "failed switches."* Go beyond just comparing outcomes in Koreas/Germanys/Botswana-Zimbabwe.
      *   **Key Innovations:**
          *   **Mechanism Mapping:** Document the *sequence* of events, actors, choices, and critical junctures during the transition period (e.g., 1945-1960 for Koreas/Germanys; pre/post-independence for Botswana/Zimbabwe). What specific decisions, conflicts, or external shocks triggered divergence?
          *   **Counterfactual Reasoning:** Explicitly model plausible alternative paths *within the case* using archival evidence and structured expert elicitation. Could different choices have led to convergence? When was the "point of no return"?
          *   **Micro-Level Data Integration:** Combine narrative history with newly digitized local administrative records, newspapers, personal diaries, firm archives, etc., to trace how shifts played out *on the ground* for individuals and communities. Did culture adapt before, during, or after institutional change?
          *   **"Near-Failures" & "Near-Successes":** Actively study cases where a switch *almost* happened but didn't (e.g., post-Franco Spain vs. Portugal? Specific Indian states? Post-colonial Indonesia vs. Malaysia paths?).
      *   **Why Upstream?** Provides the raw material for *plausible* causal mechanisms and identifies key variables/contexts for Pillars 2 & 3. Challenges simplistic "institutions first" or "culture first" narratives by showing entanglement.
      *   **Tractability:** Leverages existing historical scholarship but demands rigorous, transparent process-tracing protocols. New archival digitization is feasible. Outputs are rich narratives *plus* structured datasets of events/decisions.
      *   **Trade-off:** Less generalizable *immediately*, but essential for building better theories. Funds deep dives, not broad coverage.
      *   **Evidence to Prioritize:** Pilot studies demonstrating ability to extract testable mechanisms from archives. Willingness of teams to adopt common tracing frameworks.

  2.  **Pillar 2: The Measurement & Inference Stress Test ($3.5M)**
      *   **The Core Problem:** We don't know how much disagreement stems from the world vs. the analyst's choices (model, instruments, controls, proxies). Endogeneity is pervasive and often hand-waved.
      *   **The Ask:**
          *   **Part A (Many Analysts+):** Curate 3-5 high-value, complex historical datasets (e.g., colonial administrative records across empires; pre-industrial demographic/economic data across regions; global trade/pollution records). Task 8-10 diverse teams *independently* with the **same core question** (e.g., "Effect of colonial revenue system X on post-independence outcome Y, controlling for Z?"). **Crucially:** Vary the identification strategies *explicitly* (e.g., Team 1 uses border discontinuity, Team 2 uses instrument Z, Team 3 uses matching, Team 4 does process tracing). Compare results *and* reasoning.
          *   **Part B (Instrument Zoo):** Systematically test the robustness and validity of popular instruments (settler mortality, malaria ecology, distance to trade routes, historical plough use, etc.) across multiple contexts using newly available data. When do they hold? When do they break? What hidden assumptions do they rely on?
      *   **Why Upstream?** Directly addresses your fear of the treadmill. Shows *where* and *why* inference is fragile. Forces transparency about model dependence. Reveals if certain instruments are fundamentally unreliable.
      *   **Tractability:** Building on successful "many analysts" projects. Requires careful dataset curation and coordination, but analysis itself is standard. Outputs are meta-analyses of divergence and instrument report cards.
      *   **Trade-off:** Doesn't produce new substantive answers, but tells us *how much we can trust* existing answers and where to focus method development. High leverage for field credibility.
      *   **Evidence to Prioritize:** Identification of truly comparable, rich historical datasets suitable for multiple methods. Commitment from top econometricians/historians to participate.

  3.  **Pillar 3: Dynamic Systems & Equilibrium Transitions ($4M)**
      *   **The Core Problem:** The "what matters" debate assumes static factors. Reality is path-dependent, interactive systems. How do shocks (climate, war, tech) trigger transitions? Can we model escape from poverty traps?
      *   **The Ask:** Fund 3-4 teams to develop and empirically test *dynamic, historically-grounded models* of institutional-cultural-geographic co-evolution.
      *   **Key Innovations:**
          *   **Agent-Based Models (ABMs) Informed by History:** Build computational models where agents (elites, citizens, firms) with evolving norms/culture interact under geographic constraints and institutional rules. Calibrate initial conditions and key parameters using insights from Pillar 1 cases. Test scenarios: What shocks cause transitions? What interventions alter paths?
          *   **Formal Theory of Critical Junctures:** Develop game-theoretic models specifying conditions under which small shocks lead to large, persistent changes vs. resilience. What makes elites commit to inclusive institutions? When do cultural norms shift rapidly?
          *   **Empirical Probes:** Use the models to generate *novel, testable predictions* about sequences of change or spatial/temporal patterns of development. Test these predictions against historical data (Pillar 1, new collections) or sub-national data.
          *   **Focus on "Escapes":** Model specific historical cases of successful escapes from poverty traps (e.g., Meiji Japan, South Korea post-war, Botswana post-independence) and near-misses.
      *   **Why Prioritize?** Directly tackles the endogeneity knot (geography->institutions->culture->institutions) by modeling feedbacks. Moves beyond "matters" to "how change happens." Offers a framework for synthesis.
      *   **Tractability:** Requires strong theory + computational skills + historical input. Challenging but feasible with interdisciplinary teams. Outputs are models, simulations, and new empirical tests.
      *   **Trade-off:** High risk of overly abstract models; requires tight coupling with empirics (Pillars 1 & 4). Less immediately publishable in top journals but potentially transformative.
      *   **Evidence to Prioritize:** Teams demonstrating strong integration of theory, computation, and historical empirics. Pilot models showing plausible dynamics.

  4.  **Pillar 4: Frontier Data & Non-European Trajectories ($3.5M)**
      *   **The Core Problem:** Over-reliance on European data and experiences biases theories. Key non-European cases lack granular historical data. Geography is often crudely measured.
      *   **The Ask:** Fund 2-3 large-scale data collection/curation projects focused on understudied regions (e.g., pre-colonial Africa, Southeast Asia, Indigenous Americas) and novel geographic/climate data.
      *   **Key Innovations:**
          *   **Indigenous & Pre-Colonial Institutions/Culture:** Systematically digitize and code oral histories, ethnographic records, early colonial reports, archaeological findings (e.g., settlement patterns, trade goods) to reconstruct pre-existing conditions and early responses to contact/shocks.
          *   **High-Resolution Historical Geography:** Develop GIS layers for historical climate variability (tree rings, sediment cores), soil productivity (adjusted for historical tech), transportation costs (rivers, trails, ports), and disease burden (local epidemiological records) at fine spatial scales globally.
          *   **"Recovery" Dynamics:** Focus data collection on places that experienced major negative shocks (famine, plague, conquest) to study resilience and recovery paths – a neglected aspect of development.
      *   **Why Prioritize?** Corrects Eurocentric bias. Provides essential fuel for Pillars 1-3. Novel geographic data allows better tests of geography's role *through specific channels* (e.g., trade costs vs. disease).
      *   **Tractability:** Primarily a scaling/digitization effort. Requires historians, archaeologists, geographers, data scientists. Outputs are public databases.
      *   **Trade-off:** Pure data work. Impact depends on uptake by others. Essential infrastructure but not direct causal insight alone.
      *   **Evidence to Prioritize:** Proof of concept for data extraction/standardization. Commitment to open data standards.

  ---

  ### What to Shoot Down & Build On
  *   **"Switching Cases" (Build On):** Your colleague is right *directionally*, but Pillar 1 refines it. Don't just contrast outcomes; study the *transition process itself* with micro-data and counterfactuals. It's not a parlor trick if done deeply; it's the core unit of analysis for understanding change.
  *   **Many-Analysts Exercise (Build On):** Essential (Pillar 2). Make it *more* than replication – explicitly vary *identification strategies* on the *same* question/data. This is key to stress-testing inference.
  *   **Switching Dynamics / Escape (Build On):** This is central! Pillar 3 makes it concrete with dynamic models and Pillar 1 provides the empirical grist. Frame CFP around "dynamics of change" and "escape from stagnation."
  *   **Dead Ends Dressed as Live Ones:**
      *   **More Cross-Country Regressions w/ Same Old Instruments:** Funding this perpetuates the treadmill. Pillar 2 should expose why.
      *   **"Culture Matters" via Surveys/Implicit Bias Tests:** Often acontextual and static. Culture must be studied *historically* (Pillar 1, Pillar 4 data) and *dynamically* (Pillar 3).
      *   **Single Natural Experiments in Isolation:** Only fund if they are explicitly designed to test a mechanism identified in Pillar 1 or a model from Pillar 3, or are part of Pillar 2's stress test.

  ---

  ### Trade-offs & Portfolio Management
  *   **$15M Allocation:** Pillar 1 ($4M), Pillar 2 ($3.5M), Pillar 3 ($4M), Pillar 4 ($3.5M). Allows ~3-5 teams per pillar.
  *   **High-Risk/High-Reward:** Pillar 3 (Dynamic Models) is highest risk (abstract, hard to validate) but highest potential reward (synthesizing the mess). Pillar 1 is medium risk (depth vs. breadth), high reward (new mechanisms). Pillar 2 is lower risk, essential groundwork. Pillar 4 is essential infrastructure.
  *   **Forcing Function:** Require teams from different pillars to interact annually (e.g., historians present cases to modelers; stress-testers present findings to case study teams). Mandate open data/models.
  *   **What Moves the Needle (2-3 years):**
      *   **Up Pillar 1:** If early case studies reveal surprising commonalities in transition mechanisms or highlight critical neglected variables.
      *   **Up Pillar 3:** If pilot ABMs generate compelling, empirically testable predictions about transition paths.
      *   **Down Pillar 3:** If models remain too abstract or fail calibration. Shift funds to deeper Pillar 1/Pillar 4.
      *   **Up Pillar 4:** If new non-European data reveals starkly different pre-conditions or paths, fundamentally challenging existing theories.
      *   **Pillar 2 Outputs are Constant:** Its findings (e.g., "Instrument X is fragile," "Question Y yields divergent answers") will continuously inform priorities for the other pillars.

  **The Goal:** In 5 years, the field should be less focused on "which factor wins" and more focused on "how do these factors interact dynamically to produce change or stasis, and what are the limits of our ability to know?" This agenda funds the infrastructure (data, methods, deep cases, models) needed to make that shift possible. It prioritizes understanding causation *in history* over decomposing variance *across countries*.
