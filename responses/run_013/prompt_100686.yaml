answer: |-
  Below is a decision tree/flowchart designed as a quiz to help users navigate their intuitions about the moral status of video game characters. It uses concrete cases to avoid abstract questions, focusing on the three aspects your flatmate highlighted: (a) represented person in a fiction, (b) software object in the real world, and (c) node in a social practice. The tree has **8 branch questions** (each with 2–3 options) and leads to **7 distinct named positions** (leaves). Each leaf includes a one-sentence description of its "most awkward commitment" (a counterintuitive or challenging implication of holding that view).

  The questions are built around cases that pull apart the three aspects, including all the examples you specified (procedural villagers, companion characters, non-interactive NPCs, save deletion, modding, glitch abuse, MMO avatars, and Undertale-style reactivity). The tree avoids asking about "moral status" directly and instead uses scenarios to reveal underlying commitments.

  ---

  ### **How the Quiz Works**
  - **Start** with the first question. Answer based on your intuitive reaction to the scenario.
  - **Follow the arrows** based on your answer. Each path ends at a named position (leaf).
  - **Leaves** represent coherent philosophical positions. For any path that leads to an "unnamed" position, I note why it's not held (incoherent, unattractive, or unexplored).
  - **Key design**: Questions are ordered to maximize distinction between views. The first questions target emotionally salient cases (e.g., companion NPCs) to quickly split major viewpoints, while later questions resolve ambiguities (e.g., separating virtue ethics from indirect effects).
  - **Collisions**: The tree **cannot cleanly separate** the *Artifact View* and *Fictional Internalism* in cases involving destruction of non-interactive objects (they often overlap in practice). It also **cannot distinguish** *Simulationism* from *Instrumentalism* when applied to current games (both treat today's NPCs as amoral, but for different reasons).

  ---

  ### **Decision Tree / Flowchart**

  **Start with Question 1:**

  1. **Companion Character**: In a story-driven game (e.g., *The Last of Us*), you deliberately let a beloved NPC companion die—one with a name, backstory, and emotional weight—just to test the game’s reaction. How does this feel?
     - **A**: Fine—it’s just code/data, and I’m exploring mechanics. **→ Go to Q2**
     - **B**: Wrong—it betrays the character’s role in the story or feels like "killing" a person. **→ Go to Q3**
     - **C**: Problematic—it might desensitize me, or it’s disrespectful to the devs/players who care. **→ Go to Q4**

  2. **Procedural Villager**: In a sandbox game (e.g., *Minecraft*), you kill a randomly generated villager with no backstory, name, or purpose—not for loot, just to see physics. Your judgment?
     - **A**: Neutral—it’s an object with no meaning beyond its code. **→ Go to Q5**
     - **B**: Disturbing—even minimal representation makes it feel violent or cruel. **→ Go to Q6**
     - **C**: Harmful—it might normalize bad behavior for me or others watching. **→ Position: *Indirect Moral Concern***

  3. **Undertale-Style Reactivity**: In a game that remembers your actions (e.g., *Undertale*), you kill NPCs, and the game later judges you (e.g., "genocide run" ending). What gives this moral weight?
     - **A**: Nothing—it’s a clever illusion; the judgment is just code. **→ Go to Q7**
     - **B**: The fiction—it creates real consequences *within the story world*. **→ Position: *Fictional Internalism***
     - **C**: The real-world impact—it affects my emotions or how others see me. **→ Position: *Indirect Moral Concern***

  4. **MMO Avatar**: In an MMO, you repeatedly kill another player’s avatar while they’re AFK or clearly avoiding PvP (e.g., corpse-camping). Why is this wrong?
     - **A**: It’s not—it’s allowed by game mechanics. **→ Go to Q2**
     - **B**: It breaks trust—the community sees it as griefing, so it violates norms. **→ Position: *Social Practice View***
     - **C**: It causes harm—it harasses a real person controlling the avatar. **→ Position: *Indirect Moral Concern***

  5. **Save Deletion**: You delete a save file where you spent hours building a character. That character "ceases to exist." Is this morally relevant?
     - **A**: No—it’s just deleting data, like trashing a notebook. **→ Go to Q8**
     - **B**: Yes—it erases a story or "life" that had value in the fiction. **→ Position: *Fictional Internalism***
     - **C**: Sometimes—if others cared about it, or it feels wasteful of effort. **→ Position: *Artifact View***

  6. **Virtue Check**: You spend hours torturing NPCs in a single-player game (e.g., using glitches to trap them in walls). Could this affect your real character?
     - **A**: Yes—it trains callousness or reveals dark impulses, regardless of harm. **→ Position: *Disclosure/Virtue View***
     - **B**: No—it’s just play; real ethics depends on real-world actions. **→ Go to Q7**

  7. **Modding/Art Destruction**: You mod a game to turn a serious NPC (e.g., Geralt from *The Witcher*) into a joke (e.g., giant head, clown voice). Your view?
     - **A**: Fun—it’s creative tinkering with software/art. **→ Go to Q8**
     - **B**: Wrong—it vandalizes the artist’s work or the character’s integrity. **→ Position: *Artifact View***
     - **C**: Context-dependent—it’s fine solo, but rude if shared publicly. **→ Position: *Indirect Moral Concern***

  8. **Simulation Threshold**: If an NPC *simulated true consciousness* (e.g., passes advanced AI tests but isn’t "alive"), would harming it be wrong?
     - **A**: No—it’s still just code; no consciousness, no moral weight. **→ Position: *Instrumentalism***
     - **B**: Yes—if it *seems* conscious, we must treat it as such to avoid risk. **→ Position: *Simulationism***
     - **C**: Only in-context—it depends on the story or how others perceive it. **→ Position: *Social Practice View***

  ---

  ### **Named Positions (Leaves)**
  Each leaf includes:
  - **Name**: The philosophical position.
  - **Description**: A one-sentence summary.
  - **Most Awkward Commitment**: The challenging implication of holding this view.
  - **Note on Collisions**: Where this view overlaps or conflicts with others (e.g., with Simulationism).

  1. **Instrumentalism**  
     - *Description*: Characters are mere representations; only real entities have moral status.  
     - *Most Awkward Commitment*: You must deny moral relevance to even the most emotionally compelling NPCs (e.g., shooting "Ellie" in *The Last of Us* is no different than deleting a spreadsheet).  
     - *Collisions*: Conflicts with *Simulationism* over whether advanced simulations change anything; indistinguishable from it in practice for current games.

  2. **Indirect Moral Concern**  
     - *Description*: Only effects on real people matter (e.g., player desensitization, developer intent, or social harm).  
     - *Most Awkward Commitment*: You must condemn griefing in MMOs solely for its psychological impact, even if the victim "consented" to PvP.  
     - *Collisions*: Hard to distinguish from *Disclosure/Virtue* when focused on player effects, but virtue is about character, not consequences.

  3. **Disclosure/Virtue View**  
     - *Description*: How you treat characters reveals or shapes your real virtues/vices, regardless of harm.  
     - *Most Awkward Commitment*: You must accept that torturing a glitched NPC could make you a worse person, even with no audience or effects.  
     - *Collisions*: Often reduces to *Indirect* in social cases (e.g., streaming), but the tree separates them via private acts (Q6).

  4. **Fictional Internalism**  
     - *Description*: Actions matter within the fiction (e.g., "killing" an NPC is wrong *in the story*), even without real harm.  
     - *Most Awkward Commitment*: You must care about procedural villagers as if they were "real" in their world, despite having no backstory or consciousness.  
     - *Collisions*: Merges with *Artifact View* for non-interactive NPCs (both treat them as art/fiction); conflicts with *Instrumentalism* on story weight.

  5. **Artifact View**  
     - *Description*: Characters are art objects; ethics depend on respect for the artwork/artist.  
     - *Most Awkward Commitment*: You must condemn modding a character as "vandalism," even for private creativity like reskinning Mario.  
     - *Collisions*: Hard to distinguish from *Fictional Internalism* when destroying "scenery" NPCs (both appeal to integrity); the tree routes them together in Q5B/Q7B.

  6. **Social Practice View**  
     - *Description*: Moral weight comes from player agreements/community norms (e.g., griefing is wrong because it breaks shared rules).  
     - *Most Awkward Commitment*: You must accept that harassing NPCs is fine if streamers do it for entertainment and audiences approve.  
     - *Collisions*: Overlaps with *Indirect* in multiplayer but is separated by its focus on norms over psychology.

  7. **Simulationism**  
     - *Description*: If simulations were conscious, they’d have moral status; until then, they don’t.  
     - *Most Awkward Commitment*: You must draw a sharp line (e.g., "90% human-like AI isn’t enough") where none exists, making today’s NPCs amoral by default.  
     - *Collisions*: Collides with *Instrumentalism* on hypotheticals (it adds a threshold) and with *Fictional Internalism* (story vs. computation).

  ---

  ### **Unnamed/Unoccupied Paths**
  The tree has 9 possible endpoints (7 named + 2 unnamed). All paths are covered, but two combinations are unnamed:
  - **Path: Q1-B → Q3-A → Q7-A → Q8-A**  
    - *Result*: Unnamed position (incoherent).  
    - *Why*: Claims story-driven acts (Q1B) have weight, but then denies fiction (Q3A) and art (Q7A), ending in hard instrumentalism (Q8A). This is self-contradictory.  
  - **Path: Q1-A → Q2-B → Q6-B → Q7-B**  
    - *Result*: Unnamed position (unattractive).  
    - *Why*: Admits procedural villagers feel "disturbing" (Q2B) but denies virtue (Q6B), ending in artifact view (Q7B). This is coherent but rare—most who feel Q2B’s disturbance accept virtue or indirect effects.

  ---

  ### **Why This Works**
  - **Avoids abstraction**: No direct questions about "moral status"; uses cases to force distinctions (e.g., Q6’s virtue check isolates self-focused ethics from social effects).
  - **Prioritizes conflicts**: Questions like Q8 (simulation threshold) expose where views collide (e.g., Simulationism vs. Instrumentalism).
  - **Handles your cases**:
    - Procedural villagers (Q2) test minimal representation.
    - Companion NPCs (Q1) test emotional weight.
    - Non-interactive NPCs/scenery (implied in Q7).
    - Save deletion (Q5) tests "ceasing to exist."
    - Modding (Q7) tests artifact integrity.
    - Glitch abuse (Q6) tests virtue.
    - MMO avatars (Q4) test social practice.
    - Undertale-style (Q3) tests fiction-internal consequences.
  - **Efficient**: 8 questions cover 7 major views, with minimal redundancy.

  You can turn this into a quiz by coding the flowchart (e.g., with tools like Mermaid.js or a Google Forms script). For references, I recommend starting with Sebastian Möring (on representation), Stephanie Patridge (artifact view), and Marcus Schulzke (virtue ethics). Let me know if you need tweaks!
