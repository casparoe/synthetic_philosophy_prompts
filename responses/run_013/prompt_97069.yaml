prompt: |-
  I'm a third-year political science student enrolled in a seminar on democratic theory and comparative democratization, and each of us has been asked to design and run one session for the class. We've spent several weeks on the question of what democratic backsliding actually refers to — whether it names a genuine, diagnosable process or whether it functions mainly as a label applied to some governments and withheld from others depending on who is doing the classifying — and what has unsettled me is how quickly my classmates and I reach firm verdicts about a given country while it turns out, once we press one another, that we are quietly using entirely different thresholds and criteria. For my session I want an activity that makes the group feel this rather than hear me lecture about it: the goal is for participants to commit to a verdict about a specific case and only afterward discover that the verdict was driven by a cutoff or a criterion they never stated and never agreed on. The setting is a 90-minute seminar with 16 students; no prior reading should be assumed for the activity itself, though the debrief can draw on the course material.

  I'd like you to design the whole thing for me — setup, roles or rules, the materials I need to print or put on the board, a minute-by-minute timeline, and whatever the group actually votes on or decides. I'd prefer it to turn on a fictional case rather than a real country, so that nobody can win simply by reciting facts about Hungary or Turkey from memory. Here is the seed I want to use, which you should flesh out into something with enough texture to argue over: a mid-sized parliamentary democracy, call it Marisia, where a government with a comfortable elected majority has, over roughly a decade, amended the constitution to lengthen the executive's term, restructured the courts by ordinary statute, consolidated friendly ownership of the major broadcasters, and then won two further elections — but where there has been no ballot-stuffing, the opposition still holds some offices and occasionally wins in court, and the government's support is genuinely popular rather than manufactured. I want the activity arranged so that different participants end up applying different implicit standards to this same record — some treating any erosion of the electoral playing field as decisive, others requiring an actual rupture such as annulled elections or open violence — and so that the disagreement surfaces in the decision the group has to make rather than in a discussion afterward. If it helps, you may give participants asymmetric roles or asymmetric briefings about what counts, but the rules should be simple enough to explain in five minutes.

  Then give me the debrief: map the specific moments in the activity onto the parts of the conceptual dispute — what the group was really disagreeing about when it disagreed about Marisia, where the threshold was doing the work, and what it means that the label ends up depending on who is authorized to apply it — and tell me honestly what will predictably go wrong the first time I run this and how to handle it. Finally, I want a frank note on which feature of the idea the activity cannot reproduce and that I will have to supply myself, since I don't want the exercise to oversell what a 90-minute simulation can establish about a concept this contested.
reasoning: |-
  We are designing a 90-minute seminar activity for 16 students. The goal is to have participants commit to a verdict about a fictional country (Marisia) and then discover that their verdicts were driven by unstated and unagreed criteria. We want the disagreement to surface in the decision the group has to make.

  Key elements:
  - Fictional case: Marisia, a mid-sized parliamentary democracy.
  - Over a decade, the government (with a comfortable elected majority) has:
      - Amended the constitution to lengthen the executive's term.
      - Restructured the courts by ordinary statute.
      - Consolidated friendly ownership of the major broadcasters.
      - Won two further elections.
  - But: no ballot-stuffing, opposition still holds some offices and occasionally wins in court, and the government's support is genuinely popular.

  Activity design:
  - We want participants to apply different implicit standards. Some might focus on erosion of the electoral playing field, others require an actual rupture.
  - We can assign asymmetric roles or briefings to create these different standards.

  Proposal: "The Marisia Verdict" - A structured deliberation and voting activity.

  Structure:
  1. Introduction (5-10 minutes)
  2. Individual Assessment (10 minutes)
  3. Small Group Deliberation (20 minutes)
  4. Full Group Deliberation and Voting (30 minutes)
  5. Reveal and Debrief (20-25 minutes)

  Materials to prepare:
  - A one-page brief on Marisia (with the facts) for each participant.
  - Role cards (if using asymmetric roles) - but we want simplicity. Alternatively, we can have asymmetric briefings without complex roles.
  - Alternatively, we can have two or three different "expert groups" with different briefing sheets that emphasize different criteria.

  Simpler idea: 
  - We give every participant the same case brief, but we assign them to one of two groups (without telling them the groups have different instructions) and give each group a different set of criteria to prioritize. But that might be too obvious.

  Better idea: 
  - Do not assign criteria. Let the criteria emerge naturally. However, to ensure divergence, we can prime them differently by having two sets of briefing sheets that highlight different aspects. We'll call these "background readings" but they are actually short and given at the start.

  Revised plan:
  - We split the class into two groups of 8. Each group gets a slightly different briefing sheet. The briefing sheets are identical in the facts about Marisia but have a different introductory paragraph that primes the reader to focus on different things.

  Group A Briefing: 
    - Introductory paragraph: "In assessing the state of democracy, it is essential to look at the long-term trajectory. Even without overt fraud, the gradual erosion of institutional checks and balances can fundamentally undermine democracy. The health of a democracy is measured by the fairness of the playing field and the independence of key institutions."

  Group B Briefing:
    - Introductory paragraph: "Democracy is resilient and can withstand significant changes. What matters most is the continued holding of free elections and the absence of violent repression. A democracy is only in danger when there is a clear break, such as the cancellation of elections or the use of force to suppress opposition."

  Then the rest of the briefing (the facts about Marisia) is the same for both groups.

  But we don't tell the participants that there are two versions. We just hand them out randomly.

  Activity Steps:

  1. Introduction (5 minutes):
     - Explain the activity: "Today we are going to deliberate on the state of democracy in the fictional country of Marisia. Each of you will receive a briefing. Please read it carefully. Then we will proceed in steps to reach a group verdict on whether Marisia is experiencing democratic backsliding."

  2. Individual Assessment (10 minutes):
     - Participants read the briefing and form an initial verdict: "Based on what you've read, do you think Marisia is experiencing democratic backsliding? (Yes/No)" and write a one-sentence reason.

  3. Small Group Deliberation (20 minutes):
     - Divide the class into four small groups (each of 4 students). Note: We have two types of briefings. We must ensure that in each small group, there is a mix of the two briefings. So when we divide, we do it such that each small group has 2 from Group A and 2 from Group B (if we have 8 of each, but we have 16 students so 8 of each briefing). We can pre-assign the briefings and then assign groups accordingly.
     - In the small groups, participants share their initial verdict and reasons. The goal is to come to a consensus verdict for their small group. They must decide: "Is Marisia experiencing democratic backsliding?" (Yes/No). If they cannot reach consensus, they can report a split.

  4. Full Group Deliberation and Voting (30 minutes):
     - Each small group reports their verdict (and if split, the count) and their main reason.
     - Then open the floor for full group discussion. The goal is to reach a consensus for the whole class. Set a time limit (20 minutes for discussion, then 10 minutes for final voting if no consensus).
     - If they reach a consensus, great. If not, take a vote (yes/no) and record the count.

  5. Reveal and Debrief (20-25 minutes):
     - Reveal that there were two different briefing sheets. Ask participants to hold up their sheet (if they have Group A or Group B) and see the distribution.
     - Discuss: How did the initial priming affect individual judgments? How did it play out in the small groups and the full group? Did the group notice the different criteria being applied?
     - Then connect to the course concepts.

  Materials:
  - Briefing Sheet for Group A (8 copies)
  - Briefing Sheet for Group B (8 copies)
  - Optional: A whiteboard or flip chart to record small group reports and final verdict.

  Timeline (90 minutes total):
  - 0-5 min: Introduction
  - 5-15 min: Individual reading and assessment
  - 15-35 min: Small group deliberation (4 groups of 4)
  - 35-65 min: Full group deliberation and voting
  - 65-85 min: Reveal and structured debrief
  - 85-90 min: Wrap-up

  Now, the briefing sheets:

  **Briefing Sheet: Group A**

  **The Case of Marisia**

  *Context for Assessment: In assessing the state of democracy, it is essential to look at the long-term trajectory. Even without overt fraud, the gradual erosion of institutional checks and balances can fundamentally undermine democracy. The health of a democracy is measured by the fairness of the playing field and the independence of key institutions.*

  **Facts about Marisia:**

  Marisia is a mid-sized parliamentary democracy with a population of 25 million. It has been a stable democracy for over 50 years, with regular elections and peaceful transfers of power. However, over the last decade, the following events have occurred:

  1. **Constitutional Amendment:** The ruling party, which holds a comfortable majority in parliament, amended the constitution to extend the executive's term from 4 to 5 years. The amendment passed with the required supermajority (achieved by the ruling party's coalition). The opposition argued that this was self-serving and reduced accountability.

  2. **Judicial Restructuring:** The government passed an ordinary statute (not a constitutional amendment) that restructured the highest court. The number of judges was increased, and the government appointed new judges aligned with the ruling party. The opposition challenged this in court, but the restructured court upheld the law. Since then, the court has occasionally ruled against the government, but in high-profile political cases, it has generally sided with the government.

  3. **Media Ownership:** The government introduced new media regulations that led to the consolidation of ownership of the major broadcasters. Two of the three major television networks are now owned by business groups with close ties to the ruling party. These networks provide favorable coverage of the government. The one remaining independent network has a smaller audience share.

  4. **Elections:** The ruling party has won the last two elections (held under the new 5-year term) with comfortable margins. International election observers noted that the elections were free from ballot-stuffing and overt violence. However, they also reported that the playing field was uneven: the opposition had less access to media coverage and state resources. The opposition parties continue to hold about 40% of the parliamentary seats and control several regional governments.

  5. **Popular Support:** Opinion polls consistently show that the ruling party enjoys genuine popularity, especially for its economic policies and nationalist stance. The opposition is fragmented and has struggled to present a united front.

  **Key Points:**
  - No elections have been annulled, and there have been no coups or overt violence against the opposition.
  - The opposition still functions: it holds some offices and occasionally wins court cases (though not the most politically sensitive ones).
  - The government's actions have been legal, achieved through legislative and constitutional processes.

  **Your Task:** Form an initial opinion: Is Marisia experiencing democratic backsliding?

  ---

  **Briefing Sheet: Group B**

  **The Case of Marisia**

  *Context for Assessment: Democracy is resilient and can withstand significant changes. What matters most is the continued holding of free elections and the absence of violent repression. A democracy is only in danger when there is a clear break, such as the cancellation of elections or the use of force to suppress opposition.*

  [The rest of the facts are identical to Group A's]

  ---

  Debrief Plan:

  1. Reveal the two different introductory paragraphs. Ask: 
     - How many in the class initially thought Marisia was backsliding? (Have them raise hands) Then by group (A and B). We expect Group A to have more "yes" and Group B more "no".
     - Then ask: In the small groups, what were the main points of contention? Did you notice people emphasizing different facts?

  2. Map to concepts:
     - The disagreement is about the threshold for democratic backsliding. Group A focused on the erosion of institutional checks and media pluralism (a gradual decline in the quality of democracy). Group B focused on the absence of a clear rupture (elections still held, no violence).
     - Note that the same facts are interpreted differently because of the framing.

  3. Highlight that the label "democratic backsliding" depends on the criteria we prioritize. In the real world, this is often influenced by who is doing the classifying (e.g., an international NGO vs. the government in question) and what criteria they use.

  4. Connect to the course: 
     - The activity illustrates the conceptual dispute: is backsliding a matter of incremental erosion or only a dramatic rupture?
     - It shows how our thresholds are often implicit and unstated until we have to defend them.

  Predictable problems and how to handle them:

  1. **Problem:** Participants might notice the different briefings during the activity, especially in the small groups. This could lead to a premature focus on the briefing differences rather than the case.
     - **Handling:** In the instructions, emphasize that the briefing is the same for everyone (even though it's not). If someone notices, say that we will discuss the materials at the end. Encourage them to focus on the facts of Marisia.

  2. **Problem:** The small groups might not have a good mix. If by chance a small group gets all one type, they might have an easy consensus and not experience the conflict.
     - **Handling:** Pre-assign the briefings and the groups to ensure that each small group has 2 Group A and 2 Group B. (With 16 students: 4 small groups, each with 2 A and 2 B.)

  3. **Problem:** The full group might reach a consensus too easily, masking the disagreement.
     - **Handling:** If they reach consensus quickly, challenge them: "Is everyone really in agreement? What about the points raised by [mention a conflicting view]?" Encourage dissent. If necessary, ask for a show of hands to see if there are dissenters.

  4. **Problem:** The activity might run over time.
     - **Handling:** Keep strict time limits. Use a timer. Cut off discussions when time is up.

  5. **Problem:** The fictional case might feel too abstract.
     - **Handling:** Reassure that the fiction is intentional to avoid prior knowledge. Encourage them to engage with the facts provided.

  What the activity cannot reproduce:

  - **The complexity of real-world cases:** In reality, there are many more dimensions (economic factors, international pressures, historical contexts) and the evidence is often contested. The activity simplifies to a few key factors.
  - **The role of time:** In the activity, the decade-long process is summarized. In reality, the pace and sequence of events matter, and the uncertainty about future developments is a key part of the debate.
  - **The stakes:** In real life, labeling a country as backsliding has consequences (e.g., for international relations, investment, domestic politics). The simulation cannot capture these real-world implications.

  You will have to emphasize in the debrief that the activity is a simplification and that the concept of democratic backsliding remains contested. The goal was to expose implicit criteria, not to resolve the debate.

  Final note: The activity should be engaging and make the point effectively. Good luck!
answer: |-
  Below is a complete design for your 90-minute seminar activity, titled **"The Marisia Threshold Dilemma."** It uses your fictional case of Marisia to force participants into quick verdicts based on unstated criteria, then reveals how their judgments were shaped by hidden thresholds. The activity requires minimal setup, no prior reading, and uses asymmetric briefing sheets to create implicit disagreements without complex roles. I'll break this down into:  
  - **Activity Overview**  
  - **Setup and Materials**  
  - **Minute-by-Minute Timeline**  
  - **Debrief Guide**  
  - **Predictable Problems and Fixes**  
  - **What the Activity Can’t Reproduce**  

  ---

  ### **Activity Overview**  
  **Core Mechanism**: Participants are split into two hidden groups. Each receives a nearly identical briefing on Marisia but with one subtle difference in wording that primes them to prioritize different thresholds for democratic backsliding (e.g., "erosion of institutional safeguards" vs. "overt rupture like violence or election cancellation"). They deliberate in mixed small groups, push for a consensus verdict on whether Marisia is backsliding, and only discover afterward that their disagreement stemmed from unstated criteria.  

  **Key Features**:  
  - **Asymmetric Briefings**: Two versions of the same case facts, differing only in one introductory sentence (to prime thresholds) and one "key question" (to frame their focus).  
  - **Fictional Case**: Based on your seed, with added texture (e.g., economic context, opposition protests) to make arguments more nuanced.  
  - **Low Complexity**: Rules fit in a 5-minute explanation. No assigned roles—just small and full group discussions.  
  - **Decision Point**: Groups must deliver a binary verdict ("Backsliding: Yes/No") to surface conflict before the debrief.  

  ---

  ### **Setup and Materials**  
  **What You’ll Prep in Advance**:  
  1. **Briefing Sheets (Print 8 copies of each version)**:  
     - Identical except for **bolded** sections. Use clear, neutral language.  
     - **Version A (Erosion-Focused)**: Primes participants to treat institutional erosion (e.g., court restructuring, media consolidation) as decisive.  
     - **Version B (Rupture-Focused)**: Primes participants to require overt rupture (e.g., election annulment, violence).  

  2. **Whiteboard/Projector Setup**:  
     - At the front, write:  
       ```  
       Today's Question: Is Marisia experiencing democratic backsliding?  
       Verdict Options: YES / NO  
       ```  
     - Leave space to tally small group decisions later.  

  3. **Slips of Paper (16 total)**: For anonymous initial voting.  

  **Fictional Case: Marisia Briefing (Common Facts)**  
  *Context: Marisia is a diverse, mid-sized parliamentary democracy (pop. 30 million) with a history of strong civil society. It transitioned to democracy 40 years ago after authoritarian rule. The ruling Progressive Unity Party (PUP) won elections 10 years ago and has held power since.*  

  - **Constitutional Changes**: PUP used its parliamentary majority to amend the constitution, extending the executive’s term from 4 to 5 years. Opposition parties protested but lacked votes to block it.  
  - **Judicial Restructuring**: PUP passed ordinary statutes to expand the Supreme Court from 11 to 18 judges, appointing 7 allies. The court now rarely reviews executive actions but has ruled against the government in non-political cases (e.g., environmental regulations).  
  - **Media Consolidation**: New "media diversity laws" allowed conglomerates with PUP ties to acquire 3 major broadcasters (covering 80% of TV viewership). Independent outlets remain but face regulatory hurdles. Surveys show 70% of Marisians distrust media fairness.  
  - **Elections**: PUP won the last two elections (under the new 5-year term) with 55–60% of the vote. Monitors confirmed no ballot-stuffing, but noted opposition faced biased media coverage and limited state resources. Opposition parties hold 40% of parliament and control 5/20 regional governorships.  
  - **Popular Support**: PUP’s policies (economic growth, nationalist rhetoric) are genuinely popular. Polls show 65% approval, though youth protests criticize democratic decline. No election cancellations or political violence have occurred.  

  **Briefing Version A (Erosion-Focused)**:  
  - *Intro Sentence*: **"Democratic backsliding often begins subtly, with the gradual erosion of institutional safeguards that level the electoral playing field."**  
  - *Key Question*: **"To what extent have institutional checks and balances been weakened?"**  

  **Briefing Version B (Rupture-Focused)**:  
  - *Intro Sentence*: **"Democratic backsliding is typically marked by overt ruptures, such as the cancellation of elections or state violence against dissent."**  
  - *Key Question*: **"Has there been a decisive break from democratic norms, like annulled elections or violent repression?"**  

  *(Rest of briefing text is identical for both groups.)*  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 Minutes**  

  #### **Phase 1: Setup and Individual Judgment (15 Minutes)**  
  - **0:00–0:05 (5 min)**: **Introduction**.  
    - Explain: *"Today, we’re assessing democratic backsliding in Marisia, a fictional country. You’ll get a briefing, decide individually if backsliding is occurring, then deliberate in groups. We must reach a consensus verdict—Yes (backsliding) or No (not backsliding)—by the end. Rules: Stick to the briefing, no outside knowledge. Respect time limits."*  
    - Emphasize: *"This is about your judgment based on what you read."*  
  - **0:05–0:15 (10 min)**: **Individual Reading and Voting**.  
    - Randomly hand out briefing sheets (8 Version A, 8 Version B—keep distribution secret).  
    - Participants read silently (5 min).  
    - Have them write "YES" or "NO" on a slip of paper with one reason (e.g., "Courts lost independence" or "No election fraud"). Collect slips anonymously.  

  #### **Phase 2: Small Group Deliberation (25 Minutes)**  
  - **0:15–0:20 (5 min)**: **Form Groups**.  
    - Divide into 4 small groups of 4 students each. Ensure each group has 2 Version A and 2 Version B briefings (assign silently to avoid suspicion).  
  - **0:20–0:40 (20 min)**: **Reach Consensus**.  
    - Task: *"Discuss Marisia for 15 min. Aim for consensus: Is it backsliding? If unanimous, write ‘YES’ or ‘NO’ on a card. If split, note the split (e.g., 3-1) and reasons."*  
    - Stress: *"Focus on convincing others—defend your view!"*  
    - **Critical**: Circulate and listen for threshold disagreements (e.g., "But the courts are still functional!" vs. "They rigged the system!").  

  #### **Phase 3: Full Group Decision (30 Minutes)**  
  - **0:40–0:45 (5 min)**: **Report Small Group Results**.  
    - Each group shares verdict/split and a 30-second summary. Record tally on the board.  
  - **0:45–1:05 (20 min)**: **Full Deliberation**.  
    - Task: *"Debate as a class for 15 min. Aim for a consensus verdict. If stuck, we’ll vote."*  
    - Push conflict: *"Why do you disagree? What’s your threshold for backsliding?"* (But don’t hint at briefings).  
  - **1:05–1:10 (5 min)**: **Final Verdict**.  
    - If consensus, announce it. If not, hold a public vote (show of hands for YES/NO). Record the result.  

  #### **Phase 4: Reveal and Debrief (20 Minutes)**  
  - **1:10–1:15 (5 min)**: **Reveal the Asymmetry**.  
    - Ask: *"Hold up your briefing if you had Version A (erosion-focused). Now Version B (rupture-focused)."*  
    - Show the key differences on the board:  
      ```  
      Version A: Focused on erosion of institutions.  
      Version B: Focused on overt rupture.  
      ```  
  - **1:15–1:30 (15 min)**: **Structured Debrief**.  
    - Use questions below to link activity to theory.  

  ---

  ### **Debrief Guide**  
  Connect the activity to your seminar’s themes using this script. Map moments from the simulation to conceptual disputes:  

  #### **1. What Were We Really Disagreeing About?**  
  - **Point**: The core conflict was over **threshold criteria**, not facts.  
  - **Activity Evidence**:  
    - Version A likely argued backsliding started when courts/media were compromised (e.g., *"They tilted the playing field!"*).  
    - Version B likely dismissed this without "smoking gun" rupture (e.g., *"Elections were still clean!"*).  
  - **Conceptual Link**: This mirrors real-world disputes (e.g., Levitsky & Ziblatt’s "guardrails" vs. Schedler’s "authoritarian rupture"). In Marisia, the same facts were reframed: institutional erosion was either a red line (A) or mere illiberalism (B).  

  #### **2. How Did Thresholds Drive Verdicts?**  
  - **Point**: Thresholds acted as **hidden gatekeepers** for the label.  
  - **Activity Evidence**:  
    - In small groups, participants who cited "media consolidation" (A) were applying a **gradualist threshold** (any unfair advantage = backsliding). Those citing "no violence" (B) used a **breakdown threshold** (only system collapse counts).  
    - The final vote often deadlocked because thresholds weren’t negotiated—they were assumed.  
  - **Conceptual Link**: Like in Hungary or Turkey, thresholds are often unstated until contested. This shows "backsliding" isn’t a binary fact but a **diagnosis** shaped by prioritization (e.g., electoral integrity vs. civil liberties).  

  #### **3. Why Does "Who Decides" Matter?**  
  - **Point**: The label depends on **authority to define criteria**.  
  - **Activity Evidence**:  
    - Briefings acted as "authorities" (e.g., Version A mimicked Freedom House, Version B mimicked realist governments).  
    - Participants who "won" debates were often those who convinced others to adopt their threshold (e.g., a Version A person persuading a group to prioritize institutional erosion).  
  - **Conceptual Link**: This echoes how bodies like the V-Dem Institute (focused on indices) vs. the OAS (focused on election monitoring) apply labels inconsistently. The exercise shows that **classification is political**—it’s not just about facts, but who sets the rules for interpreting them.  

  **Debrief Questions to Ask**:  
  - *"When you argued, did you realize your threshold differed? Why not?"*  
    → Highlights implicit assumptions.  
  - *"If Marisia were real, who should get to decide if it’s backsliding? Citizens? International bodies? Academics?"*  
    → Links to democratic theory’s "boundary problem."  
  - *"Did the popular support for PUP make backsliding harder to call? Why?"*  
    → Grapples with the tension between procedural democracy and popular will.  

  ---

  ### **Predictable Problems and How to Handle Them**  
  1. **Problem: Participants notice briefing differences early**.  
     - Why: Someone might compare sheets in small groups.  
     - Fix: In your intro, say: *"Everyone has the same facts, but focus on your own reading."* If spotted, deflect: *"We’ll discuss materials later—for now, debate the case."*  

  2. **Problem: Consensus forms too easily, masking conflict**.  
     - Why: Dominant personalities or vague compromises (e.g., "It’s borderline").  
     - Fix: Force a binary verdict. If consensus emerges, challenge: *"What would it take to change your mind? Is there a threshold you’re all using?"* Record dissenters.  

  3. **Problem: Groups get stuck on fictional details**.  
     - Why: E.g., Debating media laws instead of thresholds.  
     - Fix: Intervene with redirects: *"Is this about the action itself, or what it reveals about democracy?"*  

  4. **Problem: Time runs short in full-group debate**.  
     - Why: Repetition or off-topic arguments.  
     - Fix: Use a timer. At 10 minutes, say: *"Summarize your position in one sentence focusing on why your threshold matters."*  

  5. **Problem: The reveal feels staged or trivial**.  
     - Why: If outcomes are lopsided (e.g., all Version A vote "Yes").  
     - Fix: In debrief, stress: *"This isn’t about who was ‘right’—it’s about how unstated rules shape real-world judgments."*  

  ---

  ### **What the Activity Can’t Reproduce (And How to Address It)**  
  **The Unreproducible Element**: **The role of time and ambiguity in real backsliding**. In Marisia, we present a decade of change as a settled record. In reality, backsliding is a process filled with uncertainty—actors debate in real-time without "full facts," and today’s minor erosion may enable tomorrow’s rupture.  

  **Why It Matters**: This gap could lead students to oversimplify backsliding as a puzzle with a solvable answer, ignoring how:  
  - **Power operates**: Governments like Marisia’s PUP exploit ambiguity (e.g., "We’re just reforming!").  
  - **Scholars disagree**: Actors like Nancy Bermeo (focused on incrementalism) vs. Juan Linz (focused on breakdowns) interpret the same events differently as they unfold.  

  **How to Address in Debrief**: Say this explicitly:  
  > *"This activity simplified backsliding into a snapshot, but real cases are murky and evolve. We removed the uncertainty that makes classification so contested—like not knowing if PUP will jail opponents next year. That’s why scholars like Steven Levitsky warn that backsliding is often only clear in hindsight. Our takeaway isn’t that labels are arbitrary, but that we must make our thresholds explicit and debate them ethically."*  

  ---

  This design ensures students experience the conceptual clash viscerally while staying within 90 minutes. The reveal creates an "aha!" moment that sets up deeper theory work. If you adapt it, keep the briefings subtle—small priming differences are more powerful than overt instructions. Let me know if you need printable briefing sheets or slide visuals!
