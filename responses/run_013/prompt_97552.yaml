prompt: |-
  Alright, I need you to reverse-engineer a principle for me. I teach a grad seminar on causation, and every time we hit omissions my own gut answers stop being respectable, so I want to see what rule I'm actually running on without knowing it. Please skip the lit review — I know the lit, and I don't need a reading list. I need the principle. Here are the cases exactly as I use them in class, with my honest gut verdicts attached, the ones I'd give if no one were grading me.

  1. On-duty lifeguard, calm water, swimmer goes under twenty feet away, he sees it, does nothing, the guy drowns. I say the lifeguard caused the death. No hesitation.

  2. Same beach, same swimmer, but the watcher is just some guy on a towel — no duty to anyone, equally aware, equally able to swim out — and he also does nothing. I say he did not cause the death. He's a louse, fine, but not a cause.

  3. I forget to water the ficus I've had for ten years and it dies. I say I caused its death. No one was counting on me, no rule was broken, it's my plant, and I still think I killed it.

  4. Two strangers, one on each side of the pond, each independently able to toss the ring, neither does, the swimmer drowns. Here my gut says neither of them caused it. The drowning just... happened, and two people failed, but I can't name either as *the* cause, even though either one alone would have saved him.

  5. Off-duty lifeguard, still in the red uniform, sunbathing, everyone around assumes he's working. He watches, does nothing. I say he caused it — and notice I flip from case 2 on what feels like a difference in paperwork.

  6. A hospital with a hard rule against giving an experimental drug off-protocol. The doctor follows the rule. The patient, who'd have lived on the drug, dies. I don't think the doctor caused the death. The disease did. The rule did, if anything.

  7. Car company knows the brakes fail in cold weather, decides a recall costs more than the lawsuits, doesn't recall, a driver dies. Company caused it. That one's clear.

  8. I could shout at a stranger about to step into traffic. I see it coming. I stay quiet — no good reason, just spacing out. He's hit. I didn't cause it, or so it feels; the bus caused it. I merely let it happen.

  Now the thing I can't get out of. Cases 2 and 3 look identical on paper: both are me not doing something I could easily do, with no prior commitment. Yet 3 is a cause and 2 isn't. Meanwhile case 4 wrecks the obvious fix — if I say "an omission causes the harm whenever things would've gone differently had the agent acted," then 4 forces me to say *both* strangers caused it, which I won't say, and it also makes 2 a cause.

  My half-formed principle is roughly this: an omission counts as a cause when it falls under a norm the agent was on the hook for — a role, a promise, a rule, ownership of the thing in question — and doesn't count when it's just the absence of a rescue nobody owed. Call it the on-the-hook view. It handles 1, 2, 5, 6, 7, 8. It stumbles on 3, unless "it's my ficus" secretly counts as being on the hook, which feels like a cheat to save the verdict.

  What I want from you: the principle, or a small set of competing ones, stated precisely enough that I could check it clause by clause. For each clause, tell me which of my cases forces it. Then apply the best version to a case I haven't decided — an AI triage tool that's known to miss a specific class of tumors, and the hospital leaves it running, and someone dies of exactly that tumor; is the hospital's leaving-it-in-place a cause like the car company's non-recall, or more like the doctor following the rule? — and to one further case of your own invention that I haven't listed. Finally, be honest about which of my verdicts the principle can't accommodate and would have me overturn, and say which one you'd give up. Don't let me keep all eight if they can't all be kept.

  Also: I type these up fast, so ignore any typos.

  At the very end, on its own line, give me the one-sentence version of the principle you'd defend, in the form \answer{...}.
reasoning: |-
  Okay, let me tackle this causation problem step by step. The user teaches grad seminars and needs help reverse-engineering their intuitive judgments about omissions as causes. They've provided eight clear cases with their gut reactions, and the core puzzle is why cases 2 (stranger not saving swimmer) and 3 (forgetting to water ficus) feel different despite superficial similarity. 

  First, I notice their proposed "on-the-hook" view almost works but stumbles on the ficus case. That's the key tension. The user wants a principle precise enough to test clause-by-clause against their cases, plus new applications. They're clearly frustrated with theoretical inconsistencies and want operational clarity—no lit review, just functional machinery.

  Hmm... looking at the pattern: cases where they assign causation (1,3,5,7) all involve either explicit duties (lifeguard), ownership (ficus), or assumed responsibilities (off-duty lifeguard in uniform). Cases where they deny causation (2,4,6,8) involve no preexisting obligation. But normativity alone feels too vague—why does "my ficus" create obligation while "my potential rescue of stranger" doesn't? 

  Aha! What if we distinguish between "capacity-plus" conditions? For positive causation, mere capacity might suffice (e.g., pushing someone), but for omissions, we require capacity PLUS a normative anchor. That explains why the stranger isn't a cause (no anchor) but the plant owner is (ownership anchor). 

  But case 4 is tricky—two capable non-actors. Here, the user insists neither causes the death. The normative view handles this cleanly: no anchors, no causes. Meanwhile, case 7 (car recall) fits because the company has a duty via product liability, even if not written. 

  For the AI triage case: hospital leaves flawed system running. This mirrors case 7 if hospitals have duty to audit medical tools, but resembles case 6 if protocols shield responsibility. I'd argue hospitals are "on the hook" for tool safety like car companies, not mere rule-followers like the protocol-bound doctor. 

  New test case: a chef who forgets to add salt to a dish vs. a passerby not warning about salt. Only the chef caused blandness. Verifies the anchor principle. 

  Finally, the one-sentence principle: \answer{An omission causes harm iff the agent had both capacity to prevent it and a normative obligation (from role, ownership, or commitment) to do so.}
answer: |-
  Here's a precision-engineered principle derived from your pattern of judgments, designed to accommodate your core intuitions while flagging the tension point:

  **The Normative Anchor Principle (NAP):**  
  An omission (failure to act) qualifies as a cause of harm *if and only if*:  
  **(i)** The agent had the **capacity** to prevent the harm at minimal cost/risk; *and*  
  **(ii)** The agent occupied a **normatively anchored position** relative to the harm – meaning their role, ownership, commitment, or prior conduct generated a *context-specific obligation* to act; *and*  
  **(iii)** The omission constituted a **breach** of that obligation.

  ---

  **Clause Breakdown & Case Enforcement:**  
  1. **Capacity (i)**  
     - Forces: Case 8 (you *could* shout but no obligation → no cause). Case 4 (both strangers have capacity, but no anchor → no cause).  
  2. **Normatively Anchored Position (ii)**  
     - *Anchors include*: Formal role (lifeguard), ownership (ficus), implied responsibility (uniformed lifeguard), contractual/legal duty (car company), prior undertaking (owning the plant).  
     - *Excludes*: Mere opportunity (stranger on beach).  
     - Forces: Case 1 vs. 2 (duty vs. no duty). Case 5 (uniform creates implied responsibility). Case 6 (rule compliance negates breach).  
  3. **Breach (iii)**  
     - Forces: Case 6 (doctor followed rule → no breach → no cause). Case 7 (company breached safety duty → cause).  

  ---

  **Application to New Cases:**  
  - **AI Triage Tool**:  
    - *Capacity*: Hospital could disable/update the tool (✓).  
    - *Normative Anchor*: Hospital has role-based duty to ensure patient safety; regulatory obligations likely exist (✓).  
    - *Breach*: Knowingly leaving a flawed system in place breaches safety duty (✓).  
    → **NAP verdict: Hospital caused the death** (like car company, not doctor).  

  - **Invented Test Case (Chef's Secret Ingredient):**  
    *A chef accidentally omits salt from a recipe. A diner with a rare condition dies from salt deficiency exacerbated by the bland food. The chef had no knowledge of the condition.*  
    - *Capacity*: Chef could have added salt (✓).  
    - *Normative Anchor*: Chef has role-based duty to follow recipe (✓).  
    - *Breach*: Omission breached culinary duty (✓).  
    - *BUT*: Harm was unforeseeable.  
    → **NAP verdict: Chef caused the death** (matches your ficus case). *Your intuition might reject this – revealing a hidden "foreseeability" sub-clause?*  

  ---

  **Incompatible Verdicts & Tradeoffs:**  
  - **Case 3 (Ficus)**: NAP classifies this as a cause (ownership = normative anchor). *You flagged this as a tension point – but it consistently fits NAP*. If you reject this, you’d need to drop "ownership" from clause (ii).  
  - **Case 8 (Shouting at Stranger)**: NAP says no cause (no anchor). *You agree – but if you ever intuit causation here, NAP fails*.  
  - **Case 4 (Two Strangers)**: NAP says no cause (no anchor for either). *You agree – this case enforces the "no mere opportunity" limit*.  

  **Sacrifice Recommendation:**  
  If you *must* abandon one verdict to perfect coherence, **sacrifice Case 8**. If you ever intuit that the passive bystander *caused* the traffic death (e.g., if they were the *only* possible savior), NAP breaks. Otherwise, NAP holds with **Case 3 as valid**, treating ownership as a genuine normative anchor.  

  ---

  \answer{An omission causes harm iff the agent had capacity to prevent it, occupied a normatively anchored position generating an obligation to act, and breached that obligation.}
