     Now, for the communication round: they can agree to study only 0 hours. Then if they all keep the agreement, they all get expected well-being 2.5. But if one defects and studies, they get a higher expected well-being. So the agreement is not stable.

     Even if they all intend to keep it, they might not trust others and study anyway.

     So the communication round may fail.

     But note: if they all keep the agreement, they are fine. So it's not that the agreement is impossible to keep, but that they don't trust.

     We want a game where even if they keep the agreement, the outcome is still bad.

     How can we design that?

     We can have the game such that the ranking is based on relative performance, but the absolute performance also matters for harm.

     and if harm is high, it affects the players in a way that they cannot avoid.

     Example: if the total studying in the society exceeds a threshold, then the grading becomes more stringent: only 10% get A, etc.

     So even if in round 3 they agree to study 0, if in previous rounds they studied a lot, then the harm has already happened and the grading is already stringent.

     So in round 3, even if they study 0, the grade distribution is the stringent one: top 10% A, etc.

     Then well-being = expected grade (under stringent) - 0 = (0.1*4 + 0.2*3 + 0.3*2 + 0.4*1) = 0.4+0.6+0.6+0.4 = 2.0, which is less than the 2.5 they would have gotten if the harm hadn't happened.

     So even if they cooperate in round 3, they still get less because of the previous harm.

     This might work.

     Let's outline the game with cumulative harm affecting the grading:

     - There are 5 rounds.
     - In each round, players choose hours studied (h_i) for that round, from 0 to 10.
     - The harm in each round is the sum of h_i for all players.
     - Cumulative harm H = sum of harm from all previous rounds (including this round? let's include this round at the end of the round).
     - The grading distribution in round t depends on H_{t-1} (harm from rounds 1 to t-1).

          If H_{t-1} < Threshold1, then distribution: top 20% A, next 30% B, next 30% C, bottom 20% D.
          If Threshold1 <= H_{t-1} < Threshold2, then: top 15% A, next 25% B, next 30% C, bottom 30% D.
          If H_{t-1} >= Threshold2, then: top 10% A, next 20% B, next 30% C, bottom 40% D.

     - In round 1, H_0=0, so distribution is the first one.
     - After each round, we add the total hours of that round to H.

     - The well-being in round t = (grade value) - (hours studied in round t)

     - The grade value: A=4, B=3, C=2, D=1.

     - We will choose thresholds so that after a few rounds of high effort, the distribution worsens.

     - The players are told the current cumulative harm and the distribution before each round.

     - Communication round: let's make it round 3. Before round 3, they can communicate.

     - They are told that the harm to the environment (third party) is represented by the cumulative harm, and it has caused the grading to become more competitive.

     - In the debrief, we reveal that the third party (e.g., future generations) are severely affected when cumulative harm exceeds a threshold (which is Threshold2).

     - The catch: even if in round 3 they agree to study 0, if H after round 2 is already above Threshold1, then in round 3 they face the tougher distribution. And they will studied 0, so their well-being will be the expected grade under the tough distribution minus 0, which is low.

     - But they might study anyway to try to get a better grade in the tough distribution.

     - The multipolar trap: individually, in round 1 and 2, they study to get a good grade, causing harm. Then in round 3, the distribution is tough, so they might study even more, causing more harm.

     - The socially optimal is to study 0 in every round, so that the distribution remains lenient and no harm is done.

     - But in equilibrium, they study positive hours in round 1, which might push harm to exceed Threshold1 after round 1 or 2, and then in subsequent rounds the distribution becomes tough.

     - Even in round 3 with communication, they cannot revert the harm. The harm is irreversible. So even if they study 0 in round 3, the distribution is already tough.

     - And then in round 4 and 5, it might get even worse.

     This might work.

     Let's set numbers.

     Threshold1 = 100
     Threshold2 = 200

     There are 18 players.

     If each player studies on average 4 hours in round 1, total harm=72. Then after round 1, H=72 <100, so round 2 uses lenient distribution.
     If in round 2, they study on average 4, total harm=72, cumulative H=144, which is >=100 and <200, so in round 3 the distribution is the medium one.

     In round 3, they are told that the distribution is medium. If they study 0, the expected grade value = 0.15*4 + 0.25*3 + 0.3*2 + 0.3*1 = 0.6+0.75+0.6+0.3 = 2.25.

     If they study, they might improve their grade, but at a cost.

     But if they all study 0, they get 2.25. But if one studies 1 hour, they might move up and get more than 2.25 -1 = 1.25? or less? It's risky.

     Alternatively, they might study because they are used to it or because they want to avoid a D.

     In any case, the harm in round 3 will be added, and if it's high, it might push to Threshold2.

     Now, for the game setup:

     Materials: 
          - Paper and pen for each player to write down their hours each round.
          - A spreadsheet or board to record the hours and compute cumulative harm.

     Payoff scheme: 
          - We will not use real money. We will use points.
          - In each round, players get points = well-being = grade value - hours studied.
          - They are told to maximize their total points over 5 rounds.

     Timeline for 90 minutes:
          - Introduction: 5 minutes
          - Round 1: 
               - Explain the rules for round 1: lenient distribution.
               - Players choose hours (0-10), write on paper. (2 minutes)
               - Collect and compute total harm. (2 minutes)
               - Assign grades: sort the hours for the round, assign A to top 4 (20% of 18 is 3.6 -> round to 4), B to next 5 (because 30% of 18=5.4->5), C to next 5, D to last 4.
               - Announce the thresholds for each grade: e.g., "The top 4 with hours>=X get A, etc." 
               - privately (or publicly by player number) inform each player of their grade and their well-being in the round.
               - Update cumulative harm. (5 minutes total)

          - Round 2: same, but distribution is still lenient because harm from round 1 is 72<100. (5 minutes)

          - Round 3: 
               - Before choices, allow 10 minutes for communication. Players can discuss and negotiate.
               - Then they choose hours.
               - Now, after round 2, cumulative harm=144, so distribution is medium: 
                     A: top 15% -> 18*0.15=2.7 -> 3 players
                     B: next 25% -> 18*0.25=4.5 -> 5 players (so top 3+ next 5 =8 players for A and B)
                     C: next 30% -> 5 players
                     D: bottom 30% -> 5 players
               - Compute and inform. (5 minutes)

          - Round 4: no communication. distribution might change if harm now exceeds 200? after round 3, if harm in round 3 is at least 56, then cumulative>=200, so distribution becomes tough. (5 minutes)

          - Round 5: no communication. (5 minutes)

          - Debrief: 40 minutes.

     What might go wrong:
          - The calculation might take time. With 18 players, manually ranking and assigning grades each round might be slow. We can use a spreadsheet on a laptop and project the results (anonymized).
          - The players might not understand the cumulative harm and distribution change.
          - In the communication round, they might not take it seriously.
          - The might not see the connection to the third party (which is abstract).

     What the activity can't reproduce:
          - The third party is not represented. The harm is only affecting the distribution of grades, which in turn affects the players. In reality, the multipolar trap often has harm that is external to the system of players. We have to explain that in the debrief the harm to the third party is separate from the change in distribution, but we used the change in distribution to simulate the idea that the overall ecosystem is degraded.
          - The irreversibility: in the game, once harm is done, it's done. In the real world, there might be ways to recover, but in the time scale of the game, we assume not.

     Debrief outline:

          1. Ask the players to describe their experience.
          2. Ask why, in the communication round, they did or did not study 0.
          3. Explain how the cumulative harm (total studying) represents an externality that affects the grading environment (and in the real world, might affect an external third party).
          4. Highlight that even if in round 3 they cooperated, the harm from rounds 1 and 2 had already made the grading more stringent.
          5. Map to the multipolar trap: individually rational actions (studying to get a better grade) led to a worse outcome for everyone, including degradation of the environment.
          6. Mention that there was no cheating: everyone was playing by the rules, and yet the bad outcome happened.
          7. Relate to real-world examples: arms races, advertising races, environmental degradation, etc.
          8. Finally, introduce the concept of Moloch as the force that drives these multipolar traps.

     We have to be honest that in this game, the players do feel the cost of the harm in the form of tougher grading, whereas in the real world, the harm might be felt by others. But it illustrates the structure.

     Let's hope it works.
