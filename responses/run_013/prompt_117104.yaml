  ### Game Design: "The Ranked Resource Race"  
  This game simulates a multipolar trap driven by relative standing, not defection. Players compete for rank, causing collective harm to an absent third party (future generations or an ecosystem). Communication fails to resolve the trap, showing it's structural, not just about trust.

  ---

  #### **Rules & Setup**  
  - **Players**: 18 students, split into 3 teams of 6 (Team A, B, C).  
  - **Rounds**: 5 rounds (12 minutes each), 90 minutes total.  
  - **Objective**: Maximize *personal rank points* (RP).  
  - **Actions**: Each round, players secretly choose **effort level** (1–5).  
    - Effort represents investment in competitive advantage (e.g., studying, lobbying, extraction).  
  - **Ranking**:  
    - Players are ranked **within their team** by effort (high to low).  
    - **Rank Payoffs**:  
      - 1st in team: 5 RP  
      - 2nd in team: 4 RP  
      - 3rd in team: 3 RP  
      - 4th in team: 2 RP  
      - 5th in team: 1 RP  
      - 6th in team: 0 RP  
    - *Ties*: Randomly broken by facilitator.  
  - **Costs**:  
    - **Personal cost**: Effort level *subtracted* from RP (e.g., effort 3 → lose 3 RP).  
    - **Collective harm**: Sum of *all players' effort* recorded as "harm points" (HP) to third party.  
  - **Rank Points Formula**:  
    `RP = Rank Reward - Effort Cost`  
    *Example*: Rank 1st with effort 4 → 5 - 4 = 1 RP.  

  #### **Harm Thresholds & External Impact**  
  - **HP Accumulates** across rounds. At HP milestones:  
    - **HP ≥ 30**: "Ecosystem stress" (no effect on players, but narrated as coral bleaching).  
    - **HP ≥ 60**: "Biodiversity collapse" (no effect on players, but narrated as famine for third party).  
  - **Players feel no direct penalty** from harm (it affects "outsiders"). Only rank competition matters.  

  #### **Communication Round**  
  - **Round 3**: 10 minutes for open negotiation. Players can:  
    - Discuss strategies.  
    - Promise to lower effort.  
  - **Catch**: After talks, choices remain **secret and binding**. No enforcement.  

  #### **Materials**  
  - **Per Player**: Effort sheet (mark effort 1–5 each round).  
  - **Facilitator**: Whiteboard tracking:  
    - Team rankings (updated per round).  
    - Total HP (cumulative effort).  
    - Milestone alerts (at HP 30/60).  
  - **No money needed**: RP are hypothetical points.  

  ---

  #### **Timeline (90 min)**  
  1. **Intro (5 min)**:  
     - Explain rules, ranking, harm.  
     - Emphasize: *"Your goal is to maximize RP. Harm affects others, not you."*  
  2. **Rounds 1–2 (20 min)**:  
     - No communication. Silent effort choices.  
     - After each round: reveal team rankings, RP, update HP.  
  3. **Round 3 (15 min)**:  
     - **10 min negotiation**: Teams discuss. No restrictions.  
     - **5 min**: Secret effort choices.  
     - Reveal outcomes: Highlight if HP passes 30.  
  4. **Rounds 4–5 (20 min)**:  
     - No communication. Silent effort choices.  
     - After round 5: reveal final HP, milestone impacts.  
  5. **Debrief (30 min)**: Structured discussion.  

  ---

  #### **Predictable Problems & Limitations**  
  **First-Run Issues**:  
  - **Over-competition early**: Players may max effort (5) in Round 1, shooting HP to 60+ by Round 3.  
  - **Communication round fails**: Promises to cut effort ignored. Suspicion drives high effort despite deals.  
  - **Misplaced blame**: Students may fixate on "greedy" players. Redirect to structure: *"Why did no one feel safe choosing 1?"*  
  - **Slow ranking**: Manual ranking 18 players takes time. Use pre-made spreadsheets.  

  **What the Game Can’t Replicate (Say This Aloud)**:  
  - **Real-world scale**: Harm is abstract (HP). In life, the "third party" (e.g., climate victims) pays exponentially.  
  - **No recovery**: In the game, harm is irreversible. Reality may allow repair, but traps delay action.  
  - **Complex incentives**: Real actors (nations, firms) have mixed motives beyond rank. Here, rank is simplified to RP.  

  ---

  #### **Debrief: Mapping to Multipolar Trap**  
  1. **What Happened?**  
     - Ask: *"Did anyone want to choose low effort? Why didn’t you?"*  
     - Expected: Players wanted to cut effort but feared falling behind teammates.  
     - Highlight: HP soared even without "cheating" (all played by rules).  

  2. **Structure Over Villains**:  
     - Graph: Show rising effort/HP alongside stagnant RP.  
     - Key point: **No dominant strategy** (effort 3 may be optimal if others do 2, but not if they do 4).  
     - Contrast with PD: Here, conflict came from **mutual escalation**, not defection.  

  3. **Why Communication Failed**:  
     - Ask: *"Did Round 3 talks work? Why not?"*  
     - Emphasize: Promises couldn’t fix **competitive dependency**. Even if all cooperated, rank rewards required someone to lose.  

  4. **Moloch Emerges**:  
     - Define: **Moloch as coordination failure from competing for relative status**.  
     - Map to game:  
       - **Individual incentive**: Climb rank → boost effort.  
       - **Collective result**: High effort → high harm → flat RP (effort costs cancel rank gains).  
     - Real-world parallels:  
       - **Arms races**: No one wants war, but no one disarms first.  
       - **Academic overwork**: Everyone hates "publish or perish," but opts in to compete.  

  5. **Why Harm Persists**:  
     - Note: Players could see HP but didn’t stop. Why?  
       - Harm was externalized.  
       - Rank incentives dwarfed ethics.  
     - Quote: *"The trap isn’t that people are bad. It’s that they’re trapped in a system that rewards racing."*  

  ---

  This game forces students to *feel* the trap: they’ll rage at rankings, break promises, and watch HP soar—before grasping why no one could exit the race. By the debrief, "Moloch" will land with visceral clarity.
