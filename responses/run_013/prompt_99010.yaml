  To set aside the verbal part, both parties would have to agree to use distinct terms for the two notions of size (e.g., 'cardinality' vs. 'magnitude').

  Substantive part: Even with distinct terms, the finitist would still deny that the completed infinite is intelligible or that the notion of 'how many' for an infinite collection can be answered by cardinality. The Cantorian would maintain that cardinality is the correct generalization and that the completed infinite is intelligible.

