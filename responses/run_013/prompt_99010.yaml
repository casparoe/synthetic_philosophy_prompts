  But the agreed claims say the finitist concedes the internal consistency of set theory (as a formal system). So that is not the crux.

  Instead, the crux is the intelligibility of the completed infinite. Both might agree that if a clear and uncontroversial example of an actual infinite in the physical world were found, that would move the debate (the finitist would have to concede intelligibility at least in that instance). However, the Cantorian does not require physical existence for mathematical legitimacy.

  Alternatively, in the mathematical sphere, the Register case is a key test. Both agree that if the Register case (the completeness of the ledger) is intelligible and true, then the Cantorian is correct about the mathematical realm. If not, the finitist is.

