  - Cantorian's prediction: The claim can be true. The ledger is a completed infinite set, and each room has a unique natural number. The set of natural numbers is a completed totality, so the ledger is complete.

  Both agree that if the ledger can be complete, then actual infinity is intelligible and exists in at least the mathematical sense. If it cannot, then the finitist is correct about the unintelligibility.

  Crux 2: The Two-Sizes Proposal
  Proposal: Distinguish two notions of size: 
     (A) Size by the part-whole principle: if A is a proper subset of B, then size(A) < size(B).
     (B) Size by one-to-one correspondence: two sets have the same size if there is a bijection between them.

