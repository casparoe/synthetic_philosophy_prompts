prompt: |-
  For some years I have been trying to pin down a pattern I first noticed in a small single-issue campaign group I belonged to, and I would like to know whether it already has a name. The group was entirely sincere: nobody lied, nobody was paid, nobody was coerced. Yet over about two years, questions of fact stopped behaving like questions of fact. Whether a tactic worked, whether a claim about our opponents was accurate, even whether the evidence we had gathered supported the conclusion we published — raising any of these was heard as a question about loyalty, and was settled by the standing of the person who raised it rather than by the evidence. What interests me is that the members who stayed did not become hypocrites: they believed what they said, and the doubt did not have to be suppressed because it dissolved. When the group folded, several of them recovered within weeks judgments they had not held for years, as though the belief had never been theirs. I have since seen something like it in a laboratory that had closed ranks around a contested result. I have a vague sense that a French writer of the 1940s made something like this the centre of an argument about why political parties are inherently hostile to thought in their members, but I am not asking for the reference — I want to know whether the mechanism itself has been isolated. Is there an established concept for the state of a person who sincerely holds beliefs about what is true because the collective needs them held, and whose beliefs lapse when the collective dissolves? If there is, say which of the nearby notions it should be identified with — groupthink, adaptive preference, epistemic closure, motivated reasoning, false consciousness — and precisely where each of those fails to fit. If there is none, coin a term, define it, and mark its edges: what resembles it without being an instance, and what would count as an instance even where no formal organisation exists.
reasoning: |-
  Okay, let me unpack this fascinating query. The user describes a phenomenon where sincere group members stop treating factual questions as matters of evidence and instead interpret them as loyalty tests. What's striking is how authenticity persists - they genuinely believe their claims, yet these beliefs vanish when the group dissolves. 

  This reminds me of several concepts but none quite fit. Groupthink focuses on conformity pressure, but here there's no conscious suppression of doubt. Epistemic closure describes ignoring outside information, but doesn't capture the belief dissolution. False consciousness implies deception, which is absent here. 

  The key differentiator seems to be the organic emergence of collective epistemology - facts become true because the group needs them to be true. It's not about individual motivation but about how group survival reshapes cognition. When the user mentions recovered judgments after the group folded, it suggests beliefs were sustained by the group's existence rather than personal conviction.

  I recall Durkheim's collective representations and Festinger's cognitive dissonance, but neither explains the effortless belief dissolution. Janis's groupthink model comes close but overemphasizes decision-making flaws. The French reference might be to Merleau-Ponty's critique of communist epistemology, though that's more philosophical.

  The mechanism appears unique: facts become loyalty-signaling tokens within the group's economy of belonging. When the group ceases, the currency collapses. This isn't hypocrisy or self-deception - it's more like a shared reality construct where evidentiary standards get replaced by social verification.

  For terminology, "collective epistemic embodiment" seems apt - highlighting how knowledge is literally embodied by the group. The edges would exclude cases with coercion or external incentives, focusing on organic groups where belief serves cohesion. Even loose social networks could exhibit this if they develop identity-dependent truth criteria.
answer: |-
  Based on your detailed description, the phenomenon **does not have a single, universally established name**, but it intersects with several concepts while differing in crucial ways. The core mechanism – **sincerely held beliefs contingent on group cohesion, dissolving upon the group's demise without conscious suppression of doubt** – is best captured by the term **"Collective Epistemic Embodiment"** or **"Group-Constituted Belief"**. Let's break down why existing concepts don't fully fit and define the new term:

  1.  **Why Existing Concepts Don't Fully Fit:**
      *   **Groupthink (Janis):** Focuses on *poor decision-making* due to pressure for conformity, suppression of dissent, and illusion of unanimity. Your case differs: dissent wasn't suppressed *as dissent*, it was *reinterpreted* as disloyalty. Crucially, doubt *dissolved* rather than being consciously suppressed, and the beliefs vanished instantly with the group – groupthink implies more persistent flawed beliefs.
      *   **Adaptive Preference (Elster):** Involves *changing desires* to align with perceived possibilities (e.g., "sour grapes"). Your case is about *beliefs* (epistemology), not desires. The change isn't driven by feasibility but by group identity/cohesion.
      *   **Epistemic Closure (Political Science):** Focuses on *systematically excluding external information sources*. Your group wasn't necessarily closed to *external* info but reinterpreted *internal* challenges to shared beliefs as disloyalty. The mechanism is social (loyalty/standing), not just informational.
      *   **Motivated Reasoning (Kunda):** Involves *individuals* subconsciously biasing cognition to reach desired conclusions. While present, the *source* of the "motive" here is primarily the *group's need for cohesion and identity*, not individual desires (like self-esteem). The *dissolution* upon group collapse is also not explained by individual motivation.
      *   **False Consciousness (Marxist):** Implies *systematic deception* by a ruling class masking true interests. Your group had no deceivers/exploiters; members were sincere. The mechanism wasn't deception but a shared construction of reality contingent on group existence.
      *   **Cognitive Dissonance (Festinger):** Involves *individual* discomfort from conflicting beliefs/actions leading to attitude change. Here, doubt *dissolved* without apparent discomfort or active reconciliation effort. The dissonance is avoided *pre-emptively* by redefining the question's nature (fact -> loyalty). The group provides the schema that prevents dissonance from arising.

  2.  **The Proposed Concept: Collective Epistemic Embodiment (CEE) / Group-Constituted Belief (GCB)**
      *   **Definition:** A state in which an individual sincerely holds a belief about factual reality primarily *because* it is constitutive of the identity, cohesion, and operational integrity of a specific social group to which they belong. The belief's epistemic status (its apparent truth and evidence-resistance) is *embodied* and maintained by the ongoing existence and functioning of the group itself. Crucially, these beliefs are not sustained by individual motivation or suppressed doubt, but dissolve rapidly and seemingly effortlessly when the group dissolves or the individual leaves its social-cognitive sphere, as the framework sustaining their reality collapses.
      *   **Core Mechanism:** Facts become entangled with group identity and loyalty. Evaluating evidence for the belief is replaced by evaluating the believer's standing within the group. The group functions as the *locus of epistemic justification*. Belief isn't *adopted* for the group; it *emerges* and *persists* as an inherent property of the group dynamic.

  3.  **Marking the Edges:**
      *   **What Resembles It Without Being an Instance:**
          *   **Strong Ideological Conviction:** Beliefs held fervently due to ideology persist beyond specific group membership (e.g., a Marxist leaving a party still believes core tenets). CEE beliefs lapse without the *specific group*.
          *   **Tribal Epistemology:** While related, this describes a *general tendency* to trust in-group sources. CEE is a *specific state* where *particular* beliefs exist *only* because of the group's existence and serve its cohesion.
          *   **Organizational Loyalty Leading to Bias:** An employee defending their company might exhibit motivated reasoning. CEE involves a deeper cognitive shift where the *very nature* of questioning changes (fact -> loyalty), and belief vanishes instantly upon exit.
          *   **Religious Faith:** While faith can be community-dependent, it typically involves core tenets believed to be transcendentally true, persisting beyond the local congregation's dissolution. CEE beliefs have no such transcendent anchor.
      *   **What Counts as an Instance Without Formal Organization:**
          *   **Online Communities/Subcultures:** A tightly-knit online forum or fandom developing beliefs critical to its self-definition (e.g., specific interpretations of lore, claims about creators, efficacy of fan campaigns) where dissent is framed as betrayal ("not a true fan"), and members genuinely hold these beliefs only while immersed. Leaving the community leads to rapid belief dissolution.
          *   **Academic Cliques/Invisible Colleges:** Groups coalescing around a controversial theory or method within a field. Belief in the theory's core validity or superiority becomes tied to belonging. If the clique fades due to external rejection or internal schism, members moving to new groups quickly abandon the previously core belief.
          *   **Political Activism Cells:** Small, isolated activist groups (like your original example) operating outside formal structures, where tactics, assessments of opponents, and even interpretations of evidence become tests of commitment. Beliefs vanish if the cell disbands or the activist joins a different group.
          *   **Families/Cults of Personality:** Beliefs about a family narrative or a charismatic individual held sincerely only within the family unit or inner circle, dissolving if the family fractures or the individual falls from grace, revealing the belief was sustained by the group dynamic itself.

  4.  **The French Writer:** Your intuition likely points to **Maurice Merleau-Ponty** (especially *Humanism and Terror* and essays in *Sense and Non-Sense*). He argued that communist parties demanded a "proletarian truth" where judgments about facts (e.g., show trials) became tests of loyalty to the movement's historical trajectory, not assessments of evidence. He described how intellectuals within the party genuinely came to see things through this lens, framing critique as betrayal. This aligns strongly with CEE, though Merleau-Ponty focused on large political parties and historical necessity, while CEE can apply to any cohesive group.

  **In essence, Collective Epistemic Embodiment describes a state where the group doesn't just influence belief; it *becomes* the epistemic framework within which certain beliefs are possible and real. The belief is "of the group" in the deepest sense, and cannot survive its host.** This provides a precise lens for the disturbing pattern you observed: the sincerity, the redefinition of factual questions as loyalty tests, the effortless dissolution of belief upon the group's end, and its occurrence even without formal structures.
