  Then the part I actually care about: the residue report. Which claims survive translation without loss, which survive only with distortion, and which have no counterpart in the statistical vocabulary at all — and for each of the last kind, whether you think the fault lies with my vocabulary (it cannot express something the original does express) or with the original (the claim looked substantive only because of vocabulary I don't share). I have a specific suspicion I'd like adjudicated rather than hedged: that apart from the uncomputability everything washes out, and the universal prior is just a Bayesian prior over a very large hypothesis class, so a statistician who is careful about priors and model classes already had all the content. I also half-remember that the universal prior is a semimeasure rather than a proper distribution — that its mass over finite strings sums to less than one — and I don't know what that fact would even be in my terms; if it is true, tell me what the missing mass corresponds to and whether anything like it shows up in an ordinary Bayesian model. And I want to know what becomes of the invariance-up-to-a-constant result once you are comparing models on finite samples rather than in asymptotics, and whether the statistician's worry about misspecification has any counterpart when the hypothesis class is all computable processes. Take a definite position throughout: if you think the residue is small and the translation nearly total, say so and defend it, and if you think the two frameworks are answering different questions, say which question each one is answering. No citations, reading lists, or names of papers — I want the argument, not the bibliography. Hard limit: 900 words.
