answer: |-
  ### Translation to Statistical Vocabulary

  **Universal Prior**: A mixture prior over all computable data-generating processes (DGPs), weighted by \(2^{-K(h)}\) where \(K(h)\) is the Kolmogorov complexity (length of the shortest program simulating \(h\) on a universal Turing machine). Formally: \(\pi(h) \propto 2^{-K(h)}\). This is equivalent to a Bayesian nonparametric prior with an enormous hypothesis class \(\mathcal{H}\) (all computable DGPs), but with highly irregular weights favoring simpler (shorter-program) models.

  **Convergence**: For any *computable* true DGP \(h^*\), the posterior concentrates on \(h^*\) as sample size \(n \to \infty\). Total prediction error (e.g., squared error in sequential prediction) is bounded by \(K(h^*) \cdot C\) (where \(C\) is machine-dependent). This resembles Bayesian consistency but over an infinite-dimensional \(\mathcal{H}\) with no smoothness or entropy conditions.

  **Simplicity**: \(K(h)\) defines "complexity" of hypothesis \(h\). Shorter \(K(h)\) \(\iff\) simpler \(h\) \(\iff\) higher prior weight. This formalizes Occam's razor: simpler models get higher prior mass *if* they fit the data, but complexity is defined by *descriptional* (program) length, not statistical measures like parameter count.

  **Two-Part Codes (MDL)**: Minimizing description length (DL) of data \(D\) is \(\min_h [ -\log \pi(h) - \log P(D|h) ]\). By Shannon, optimal DL uses \(-\log P(D|h)\) for "likelihood" part. MDL aims to select \(h\) minimizing total DL, which asymptotically approximates the universal prior's log marginal likelihood \(-\log P(D)\).

  ---

  ### Residue Report

  #### Survives Intact
  1. **Bayesian interpretation**: The universal prior *is* a valid (if improper) prior over a vast \(\mathcal{H}\). Posterior updating follows Bayes exactly.
  2. **Consistency**: Concentration on true computable \(h^*\) mirrors Bayesian consistency for well-specified models in parametric classes.
  3. **MDL-Bayes equivalence**: For model selection, MDL \(\approx\) maximizing log marginal likelihood under the universal prior.

  #### Survives with Distortion
  1. **Invariance**: Asymptotic results (error bounds, model selection) are invariant up to \(O(1)\) constants (machine dependence). *Distortion*: For finite \(n\), this constant dominates \(K(h^*)\), making practical invariance unobtainable—unlike typical Bayesian asymptotics where constants vanish.
  2. **Simplicity as complexity**: Statisticians use effective parameters/dimension; here it’s program length. *Distortion*: While both penalize "complexity," Kolmogorov complexity is uncomputable and context-dependent (via machine choice), unlike statistical complexity measures.

  #### No Statistical Counterpart
  1. **Semimeasure property**: The universal prior sums to \(<1\) over finite strings. Missing mass (\(\sum_{x} P(x) < 1\)) corresponds to *uncomputable sequences*—data that no Turing machine can generate. **Fault**: Your vocabulary lacks this. Bayesian priors are probability measures; the semimeasure reflects incomputability, not statistical impropriety.
  2. **Uncomputability**: The prior/posterior are *provably uncomputable*, not just analytically intractable. **Fault**: Your vocabulary (priors as specifications). Statisticians approximate posteriors; here, no algorithm exists even in principle.
  3. **Misspecification immunity**: The class \(\mathcal{H}\) contains *all* computable DGPs, so "well-specified" is guaranteed if the truth is computable. **Fault**: Your framework. Statisticians assume \(\mathcal{H}\) is fixed/misspecified; here \(\mathcal{H}\) is maximal and misspecification means uncomputable truth—outside science.

  #### Adjudicating Your Suspicion
  **Incorrect**: Beyond "big prior," key differences persist:
  - **Uncomputability** isn't incidental; it prevents any approximation scheme.
  - **Semimeasure** embodies incomputable uncertainty—no Bayesian parallel.
  - **Invariance constants** matter practically (e.g., in MDL penalties).
  - **Misspecification** is redefined (computability matters, not \(\mathcal{H}\) structure).

  **Correct**: For *computable* \(h^*\) and large \(n\), it behaves like Bayes with a consistent prior over complex \(\mathcal{H}\). The convergence bound \(K(h^*)\) resembles PAC-Bayes risk.

  ---

  ### Position
  The frameworks answer different questions. **Statistics** asks: "How to infer/decide given a specified \(\mathcal{H}\)?" **Solomonoff** asks: "What if \(\mathcal{H}\) is *all* computable models?" The residue (uncomputability, semimeasure, machine-dependence) stems from this maximal \(\mathcal{H}\). For inference within pre-defined \(\mathcal{H}\), statisticians already have the core tools. But Solomonoff’s "hypothesis class of everything computable" forces concepts that statistics avoids (uncomputable truths, description-based complexity). The residue is small *only* if we ignore computability and maximal \(\mathcal{H}\)—but those are the point.
