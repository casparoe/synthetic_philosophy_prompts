  Progress might come from distinguishing different questions: one about the structure of propositions, another about how language hooks onto reality. Or a formal model showing regress doesn't occur under certain assumptions. Concessions: the first camp could admit their unifier must be primitive; the second camp could acknowledge that their view doesn't explain but describes. 

