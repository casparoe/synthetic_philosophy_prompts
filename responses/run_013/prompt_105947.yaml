  Brainstorming possible readings first: One could argue Smith's monopoly critique fully covers this, since the Company combined commercial and sovereign power. But that might miss how accountability structures specifically shaped the famine response. Alternatively, Smith's impartial spectator theory could be stretched to explain moral failures at distance - but I suspect this is the weakest reading because Smith's spectator relies on social proximity. A third option: vicarious sovereignty is Smith's implied but unnamed problem, visible in his attacks on merchant-governors but not systematized.

  For section 1 (Mapping), I'll define Smith's actors: London shareholders (monopolists), Company servants (agents with misaligned incentives), Bengali peasants (invisible sufferers). His levers: monopoly distortion, principal-agent problems in colonial administration. His theory predicts exactly the revenue extraction and neglect we saw - the 1776 "Wealth of Nations" directly cites Bengal's distress as proof.

  Section 2 (Bites/Misses): Smith brilliantly explains revenue hikes and monopolistic grain control as inevitable under this system. But he underplays how the nominal Nawab's presence exacerbated unaccountability - a gap where "vicarious sovereignty" adds value. Also, while his moral theory diagnoses individual corruption, it doesn't fully capture systemic indifference to mass death.

  Section 3 (Spectator-Gap): Here's the crux. The impartial spectator requires imagined reciprocity ("what would I feel in their place?"), but across racial and imperial distance, Bengali anguish remained unimaginable to London. Smith's own failure to foreground this in his famine commentary suggests a real limitation.

  Section 4 (Remedy): Smith's solutions - end trade monopoly, establish Crown control - would partially fix vicarious sovereignty by shortening accountability chains. But Crown rule might still lack local spectatorship, revealing his theory's blind spot: he assumes metropolitan oversight suffices without local representation.

  Section 5 (Verdict): The case confirms Smith's critique but exposes an anomaly: his framework identifies symptoms (extraction, famine) without fully diagnosing the accountability-structure disease. Vicarious sovereignty names what his theory implies but never crystallizes.

  Section 6 (Silence): Smith is silent on how moral psychology fails across empire, and on solutions embedding local voice. Pressing his texts further would be dishonest.

  Overall: Vicarious sovereignty isn't just a subset of Smith's monopoly critique - it's the missing keystone explaining why exploitation became catastrophic when commercial agents wielded sovereign power unanswerable to the governed. The famine wasn't merely greed; it was structural unaccountability.
answer: |-
  ### Brainstorming: Possible Readings of Smith on Vicarious Sovereignty  
  1. **Smith's monopoly critique fully subsumes vicarious sovereignty**: The Company’s sovereign role is merely an extreme manifestation of monopoly power, corrupting both markets and governance.  
  2. **Smith’s moral theory implicitly addresses the gap**: The impartial spectator mechanism *should* bridge distance, but colonial racism/cultural bias prevents its operation.  
  3. **Vicarious sovereignty is Smith’s unstated core problem**: His attacks on merchant-governors and distant accountability hint at it but lack a systematic concept.  
  *Weakest reading*: #2. Smith’s spectator relies on *mutual* observation and shared social context, which empire structurally negates. Bengal’s peasants were invisible to London’s "impartial" judgment.  

  ---

  ### Analysis: Smith Meets Bengal  

  #### 1. Mapping: Smith’s Actors and Levers  
  - **Actors**:  
    - *London Shareholders*: Monopolists seeking dividends. Smith’s "spirit of monopoly" (WN IV.vii.c) drives their demand for ever-higher revenues.  
    - *Company Servants in Bengal*: Agents with dual incentives. As merchants, they seek private gain via local monopolies; as tax-farmers, they maximize collections to please London. Smith’s principal-agent problem (WN V.i.e) predicts they will prioritize self-enrichment over governance.  
    - *Bengali Peasants*: The governed, excluded from accountability loops. Smith’s "invisible" producers (WN IV.ix.51), whose resentment cannot reach London.  
  - **Levers**:  
    - Monopoly power distorts prices and incentivizes extraction (WN IV.vii.b).  
    - Sovereign authority without local accountability breaks sympathy’s bonds (TMS I.i.4.7).  
  - **Prediction vs. Reality**:  
    Smith predicts that merchants wielding sovereignty will govern exploitatively (WN IV.vii.c.102). Bengal confirms this: revenue hikes (+33%), grain monopolies during scarcity, and famine neglect align perfectly. The Company’s actions are not "greed" in a vacuum but institutional incentives in action.  

  #### 2. Where Theory Bites and Misses  
  - **Bites**:  
    - Monopoly explains revenue extraction and grain hoarding. Smith’s critique of the colonial trade as a "dead weight" (WN IV.vii.c.63) mirrors Bengal’s devastation: wealth flowed to London while Bengal starved.  
    - His moral theory explains individual corruption: servants, isolated from Bengali society, pursued wealth without spectatorial restraint (TMS III.4.4).  
  - **Misses**:  
    - *Economic*: Smith underestimates how revenue farming’s *structure* (not just monopoly) amplified famine. Fixed revenue demands during crop failure were catastrophic, but Smith focuses on trade barriers, not fiscal rigidity.  
    - *Moral*: The impartial spectator assumes cultural proximity. In Bengal, distance and racial contempt prevented servants from *seeing* peasants as moral subjects. Smith’s theory cannot explain why no "spectator within" checked the famine’s brutality.  

  #### 3. Spectator-Gap Hypothesis: Test  
  The hypothesis holds: Smith’s spectator relies on reciprocity ("changing places in fancy" – TMS I.i.4.8). At imperial distance:  
  - Bengali suffering was unimaginable to London shareholders. Parliament saw Indians as subjects, not parties to a moral dialogue.  
  - Company servants in Calcutta constructed "impartiality" within colonial hierarchies, not with starving peasants.  
  **Verdict**: Fair reading. Smith’s theory *could* address this if extended – e.g., spectatorship requires equal social footing (TMS I.i.4.7) – but he never applies it trans-culturally. Settlement: If Smith condemned imperial dehumanization *using* spectator theory, he’d rebut the gap. He did not.  

  #### 4. The Remedy: Smith’s Solutions and Limits  
  - **Smith’s Remedies**: Abolish trade monopoly (WN IV.vii.c.106); transfer sovereignty to the Crown (WN V.iii.92).  
  - **Assessment**:  
    - Ending monopoly might ease extraction but wouldn’t fix *vicarious sovereignty*. Crown rule replaces shareholders with ministers – still distant, unaccountable to Bengalis.  
    - His solution is an artifact of theory’s limits: Smith assumes Crown accountability to *British* spectators (Parliament/public opinion) suffices. But Bengal remains invisible, making this "accountability" illusory.  

  #### 5. Verdict on the Theory  
  The episode **exposes an anomaly within Smith’s framework**. It confirms his critique of monopoly and merchant-governors but reveals a hole: his theory cannot fully diagnose *why* distant accountability fails morally. Vicarious sovereignty names this structural flaw.  
  - **To overturn**: If Smith had analyzed a case where imperial agents *successfully* internalized local resentment via spectatorship, the anomaly would dissolve. No such case exists in his work.  

  #### 6. Silence: Where Smith Does Not Speak  
  - Smith is silent on **cultural asymmetry in moral psychology**: How can spectators judge those they deem "inferior"?  
  - He offers no remedy for **governance without local representation**. His Crown-administered colony still excludes the colonized from accountability.  
  - He never questions whether **European states can legitimately rule non-European societies**. His critique is practical, not ethical.  

  ### Overall Verdict  
  Smith’s theory brilliantly predicts the East India Company’s exploitative governance in Bengal but stumbles over the moral void of vicarious sovereignty. His impartial spectator, rooted in shared social experience, cannot bridge imperial distance, and his remedies address symptoms (monopoly) without curing the disease (unaccountable power). The Bengal famine thus confirms Smith’s economic diagnosis while exposing a fatal gap in his moral framework: sovereignty without local spectatorship is inherently pathological. Vicarious sovereignty is not a blind spot but the dark center of his critique, unnamed yet unavoidable.
