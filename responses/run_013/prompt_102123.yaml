  ### **Collective Action Game: The Threshold Challenge**  
  **Objective:** Illustrate the inefficacy objection (individual causal inefficacy) and its limitations through experiential learning, focusing on the shift from known to hidden thresholds.

  ---

  #### **Materials**  
  - **Tokens:** 20 identical items (poker chips, buttons, or folded paper squares).  
  - **Boxes:** Two boxes labeled "CONTRIBUTE" and "NOT CONTRIBUTE."  
  - **Threshold Slips:** For Round 2, slips of paper with numbers 8–14 (one number per slip, folded in a bag).  
  - **Whiteboard:** Track contributions and outcomes.  
  - **Payoff Tracking:** Use points (no physical payouts) to simplify. Points convert to hypothetical rewards.  
  - **Timer:** For decision phases.  

  ---

  #### **Rules & Payoffs**  
  - **Group Goal:** Avoid a "collective harm" (e.g., environmental disaster) by hitting a threshold of contributors.  
  - **Individual Choice:** Each student anonymously places one token in "CONTRIBUTE" or "NOT CONTRIBUTE."  
  - **Cost/Benefit:**  
    - Contributing costs **1 point** (effort/sacrifice).  
    - If total contributors **≥ threshold**, the harm is avoided: **+5 points** for everyone.  
    - If total contributors **< threshold**, the harm occurs: **0 additional points**.  
  - **Net Payoffs:**  
    | **Your Choice** | **Group Succeeds** | **Group Fails** |  
    |------------------|--------------------|-----------------|  
    | **Contribute**   | 5 - 1 = **+4**     | 0 - 1 = **-1**  |  
    | **Not Contribute**| **+5**             | **0**           |  

  ---

  #### **Game Flow (80 Minutes Total)**  
  **0:00–0:05 — Setup**  
  - Introduce the scenario: *"Your choices affect whether the group avoids a harm. You’ll see how this works in two rounds."*  
  - **Do NOT** name theories (e.g., inefficacy, expected value).  

  **Round 1: Known Threshold (Threshold = 10)**  
  - **0:05–0:10 — Explain Round 1:**  
    - Threshold = **10** (write on board).  
    - Payoffs: Show table above. Emphasize anonymity.  
  - **0:10–0:13 — Decide:** Students drop tokens in boxes.  
  - **0:13–0:15 — Tally & Debrief Lite:**  
    - Count contributions. Write: "Threshold = 10, Actual = [X]".  
    - Ask: *"Did we succeed? How many contributors were pivotal?"* (Pivotal = exactly the 10th contributor).  
    - **Don’t answer yet**—just plant the question.  

  **Round 2: Hidden Threshold (Threshold = ?)**  
  - **0:15–0:18 — Explain Round 2:**  
    - Threshold is hidden (drawn from bag: 8–14).  
    - Payoffs unchanged.  
  - **0:18–0:21 — Decide:** Students drop tokens.  
  - **0:21–0:23 — Reveal:** Draw threshold from bag, announce, tally outcome.  

  **0:23–0:65 — Structured Debrief**  
  *(Map experiences to theory without jargon first)*  

  1. **Round 1 Reflection (10 mins):**  
     - Q: *"In Round 1, who felt their choice *caused* the outcome? Why?"*  
       - Highlight: If contributions ≠10, most weren’t pivotal. Example:  
         - Overshoot (e.g., 14 contributors): No one pivotal.  
         - Undershoot (e.g., 7 contributors): Even contributors "failed."  
     - Q: *"If you didn’t contribute, why? Did you assume you couldn’t change the outcome?"*  
     - **Key Insight:** Students articulate **causal difference-making** (you only matter if you’re pivotal).  

  2. **Round 2 Reflection (10 mins):**  
     - Q: *"In Round 2, how did not knowing the threshold change your thinking?"*  
       - Probe: *"Did you consider the *chance* your contribution might tip the scale?"*  
     - Q: *"If you contributed, what made you do it despite the cost?"*  
     - **Key Insight:** Hidden thresholds force **expected-impact reasoning** (weighing probability of being pivotal vs. cost).  

  3. **Connect to Real World (10 mins):**  
     - *"How is Round 1 like saying ‘One burger won’t kill a cow’? How is Round 2 like climate action (where we don’t know the exact threshold)?"*  
     - **Structural View Emergence:**  
       - Q: *"In Round 1, if everyone thought ‘I won’t be pivotal,’ what happened? What does that say about collective harm?"*  
       - Guide them to see: Individual reasoning ("I won’t matter") → collective failure → harm occurs.  

  4. **Name the Theories (5 mins):**  
     - Write on board:  
       - **Causal View:** "I only matter if I’m pivotal." (Round 1 logic)  
       - **Expected-Impact View:** "I might be pivotal, so I should act." (Round 2 shift)  
       - **Structural View:** "We all must act because the *group* causes harm." (Emerges from collective failure pattern)  
     - **Clarify:** *"The ‘lazy objection’ ignores Round 2 thinking and the structural problem."*  

  5. **Apply to Cases (10 mins):**  
     - Break into trios. Assign: **Climate**, **Meat**, **Voting**.  
     - Task: *"How does the ‘lazy objection’ (causal view) apply here? How would hidden thresholds (expected-impact) or structural views counter it?"*  
     - Share insights.  

  **0:65–0:80 — Wrap-Up**  
  - Summarize: *"The objection works in simple cases (Round 1) but crumbles when uncertainty (Round 2) or group patterns emerge."*  
  - Homework hook: *"Next week: What if thresholds are dynamic? Or actions are repeated?"*  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Loud Students Anchor Group:**  
     - **Fix:** Enforce **anonymous** token drops. If persuasion happens, say: *"Decide based on your own reasoning."*  

  2. **"Uninteresting" Threshold Outcome:**  
     - E.g., Round 1 lands exactly on 10 (every contributor pivotal).  
     - **Fix:** Use it! Ask: *"How often does this happen in real life? What if we reran this 100 times?"*  

  3. **Students Fixate on Points:**  
     - **Fix:** Reiterate: *"Points represent ethical stakes—focus on the reasoning, not ‘winning’."*  

  4. **Round 2 Feels Arbitrary:**  
     - **Fix:** In debrief, clarify: *"Uncertainty is the point—we rarely know exact thresholds in real life."*  

  ---

  #### **Limitations & Instructor Notes**  
  - **What the Game Can’t Do:**  
    - **Repetition/Time:** Real collective harms (e.g., climate) involve repeated actions. *Supply in debrief:* "In life, we play this game daily—what changes?"  
    - **Unequal Stakes:** Students have identical power. *Supply:* "In reality, contributions vary (e.g., corporations vs. individuals)."  
  - **Critical Debrief Move:**  
    - **Structural View Nuance:** Students may not explicitly name "duty to collective." *Ask:* *"If everyone acts only when pivotal, what’s the result? What’s the alternative?"*  
  - **Pro Tip:** Bring a bag of candy—give one piece to all post-game to thank them, regardless of points.  

  ---

  **Why This Works:**  
  - Students **experience** the inefficacy objection failing in Round 2, making the theory "stick."  
  - The hidden threshold forces a shift to expected-value reasoning organically.  
  - Minimal setup—uses tokens and a whiteboard. Run it in any classroom.  

  Good luck! This will disrupt the "nodding at the lazy objection" cycle. Let me know how it goes.
