prompt: |-
  I'm a PhD student in early modern philosophy, and I'm trying to get a clearer picture of Hobbes's relationship to geometry. A colleague in the history of science, whose judgment I generally trust, recently gave me the following summary of Hobbes's position, and I'd like to know how much of it is fair. His summary runs roughly as follows.

  Hobbes took Euclid's geometry as the model of demonstrative science because it showed that certainty is available when we reason from definitions that we ourselves lay down. Geometry is thus a science of our own constructions: we know the causes of figures because we make them, and this is why its conclusions are necessary. Hobbes then transferred this method wholesale to civil philosophy, since we also make the commonwealth. But because the definitions are arbitrary, geometrical truths are in the end verbal; they tell us only about the consequences of the names we choose, not about anything in nature. Hobbes accordingly dismissed the experimental natural philosophy and algebraic mathematics of his contemporaries—Wallis in particular—as a fallible and confused enterprise, and his late attempts at squaring the circle and duplicating the cube were not eccentric departures from his philosophy but the natural expression of a conventionalist view of mathematics. The upshot is that Hobbes's political theory is best read as a piece of applied geometry: the sovereign is constructed from definitions the way a circle is constructed from a definition, and the whole system stands or falls with the deductive rigor of its first definitions.

  I'm inclined to think the conventionalism charge is too strong, but I don't trust my grasp of the texts. How much of this is right? Please go claim by claim and tell me what a historian of early modern philosophy would accept, what they would wince at, and what is simply wrong. I'm particularly interested in whether the alleged conventionalism about geometry is really Hobbes's view, or whether it conflates commitments—nominalism, constructivism, and the arbitrariness of definitions—that Hobbes kept apart. I'd also like to know whether the inference to his political theory being applied geometry follows from anything true in the summary, or whether it overstates a methodological analogy. And if the summary's picture of his disputes with Wallis and his late mathematical work is off, please say how. I'm not asking for a reading list; I want the conceptual corrections.
reasoning: |-
  Okay, the user is a PhD student in early modern philosophy, specifically looking into Hobbes's relationship with geometry. They've received a summary from a colleague in the history of science and want to know how accurate it is. The summary makes several claims about Hobbes's views on geometry as a model for science, the arbitrariness of definitions, conventionalism, and how this applies to his political theory.

  First, I need to break down the colleague's summary point by point. The main claims are: Hobbes saw Euclid as the model for demonstrative science because definitions are arbitrary and we create the objects; geometry is a science of constructions, so we know causes because we make them; this method was transferred to civil philosophy since we make the commonwealth; definitions are arbitrary, making geometrical truths verbal; Hobbes dismissed experimental science and algebra, leading to his disputes with Wallis; his circle-squaring attempts were natural outcomes of his conventionalism; and his political theory is applied geometry where the sovereign is constructed from definitions.

  The user has specific concerns. They think the conventionalism charge might be too strong and wonder if it conflates nominalism, constructivism, and arbitrariness. They also question whether the political theory as "applied geometry" is an overstatement. Additionally, they want clarity on Hobbes's disputes with Wallis and his mathematical work.

  I recall that Hobbes was indeed influenced by Euclid and emphasized definitions. His constructivism in geometry is well-documented—knowledge comes from constructing figures. But the arbitrariness of definitions is tricky. Hobbes did say definitions are arbitrary in the sense that we impose names, but once defined, the consequences are necessary. So it's not that truths are merely verbal conventions; they're grounded in the defined essences.

  For civil philosophy, the analogy is that humans create the commonwealth, so we can have certain knowledge like in geometry. But calling it "applied geometry" might be an overstatement. The method is analogous, but the subject matter differs. The sovereign isn't constructed geometrically but through covenants, which are linguistic and volitional acts.

  Regarding conventionalism, Hobbes isn't a conventionalist like later thinkers. He combines nominalism (names are arbitrary) with realism about consequences once defined. Geometrical truths aren't just about words; they reflect necessary relations from definitions. So the summary's claim that truths are only about names is misleading.

  Hobbes criticized experimental science because it relies on sensory data, which is fallible, and algebra because he saw it as detached from clear definitions. His feud with Wallis stemmed from methodological differences, not just conventionalism. His circle-squaring attempts were consistent with his constructivist approach but mathematically flawed.

  The user might be worried that the summary oversimplifies Hobbes's epistemology and conflates different philosophical commitments. They need a nuanced view that separates nominalism from constructivism and arbitrariness. Also, clarifying that the political theory uses a methodological analogy, not literal geometry, is crucial. Correcting misconceptions about his disputes with Wallis and his math work will provide a more accurate historical context.
answer: |-
  Here's a claim-by-claim assessment of your colleague's summary from the perspective of Hobbes scholarship, focusing on conceptual accuracy and common historiographical views:

  1.  **"Hobbes took Euclid's geometry as the model of demonstrative science because it showed that certainty is available when we reason from definitions that we ourselves lay down."**
      *   **Largely Correct:** This is foundational to Hobbes. In *De Corpore* and *Six Lessons*, he explicitly states that true science ("scientia") requires reasoning from causes, and in geometry, *we* are the causes because *we construct the figures* based on our definitions. The certainty arises from this constructive act and the deductive chain that follows. Euclid is his paradigm.

  2.  **"Geometry is thus a science of our own constructions: we know the causes of figures because we make them, and this is why its conclusions are necessary."**
      *   **Correct:** This is Hobbes's core **constructivist** thesis. Geometric figures (like circles, triangles) are not Platonic forms discovered in nature; they are mental or physical constructions (using instruments we define) generated from stipulated definitions (e.g., a circle is made by rotating a line segment around one endpoint). Necessity comes from the logical consequences of the generative act defined.

  3.  **"Hobbes then transferred this method wholesale to civil philosophy, since we also make the commonwealth."**
      *   **Correct in Analogy, Potentially Misleading in "Wholesale":** Hobbes *explicitly* draws this analogy (*Leviathan* Intro, *De Cive* Preface). Because humans *artificially create* the commonwealth through covenant and authorization, we can have "scientia" (deductive certainty) about politics, just as we do about geometry. The *method* of starting from definitions (e.g., definitions of "person", "covenant", "authorization", "sovereign") and deriving necessary consequences is consciously transferred. However, "wholesale" might imply identical rigor and simplicity, which Hobbes acknowledges is harder in politics due to the complexity of human passions and language (*De Corpore* I.7). The *structure* of the method is transferred, but the *subject matter* is vastly different.

  4.  **"But because the definitions are arbitrary, geometrical truths are in the end verbal..."**
      *   **Problematic / Requires Nuance:** This is where the "conventionalism" charge becomes tricky.
          *   **Arbitrary Stipulation (Nominalism):** Yes, Hobbes is a radical nominalist. The initial *naming* and *stipulation* of what a word signifies (the definition) is conventional/arbitrary ("arbitrary imposition of names" - *De Corpore* I.2.4). We decide what "circle" means.
          *   **Consequences are NOT Arbitrary (Anti-Conventionalism):** Crucially, *once a definition is stipulated*, the logical consequences flowing from it are *not* arbitrary, conventional, or merely verbal in the sense of being *only* about words. They are *necessary truths about the properties and relations of the defined object* as generated by the definition. For Hobbes, "A figure contained by three straight lines is a triangle" is a definition. But "The interior angles of a triangle sum to two right angles" is a *necessary truth discovered by reasoning* about the constructed object defined by "triangle". It's not *just* about the word "triangle"; it's about the necessary properties of the *thing* (the constructed figure) that the word names. The truth is grounded in the act of generation defined by the nominal essence. Calling them *merely* "verbal" risks conflating Hobbes with a more radical linguistic conventionalism (like later logical positivism) that he didn't hold. The truths are *about* the constructed objects, necessitated by their definitions.

  5.  **"...they tell us only about the consequences of the names we choose, not about anything in nature."**
      *   **Half True, Half Misleading:**
          *   **About Names/Definitions?** Yes, in the sense that reasoning starts from definitions (names signifying conceptions of generation).
          *   **Not About Nature?** **Misleading.** While geometric figures are mental/physical constructions *invented* by us, Hobbes believed geometry *is applicable to the material world* precisely *because* the fundamental objects of geometry (space, body, motion) are the universal accidents of *all* real material bodies (*De Corpore* II.8.1-2, VI.6). Geometry *does* tell us about nature – it tells us about the spatial properties and motions inherent in *all* bodies. It's *not* a purely formal system disconnected from the physical world. Its truths are necessary *and* physically applicable because space and motion are fundamental aspects of material reality. It tells us about the *geometric properties* of natural things, not their contingent histories or specific compositions.

  6.  **"Hobbes accordingly dismissed the experimental natural philosophy and algebraic mathematics of his contemporaries—Wallis in particular—as a fallible and confused enterprise..."**
      *   **Correct:** Hobbes vehemently rejected the rising tide of experimentalism (Boyle, Royal Society) precisely because it relied on sense experience, which he saw as inherently fallible "prudence" or "fact" knowledge, not the demonstrable "scientia" achievable through definitional construction and deduction (*Leviathan* Ch. 5, 9). His feud with Wallis was legendary. Hobbes saw Wallis's algebra (and later, calculus) as "symbolic witchcraft" – obscure, ungeometrical manipulations of symbols lacking clear definitions grounded in construction and motion. He viewed it as generating confusion, not genuine understanding, and as detracting from the true (geometric) foundation of mathematics (*Six Lessons*, *Mr. Hobbes Considered*).

  7.  **"...and his late attempts at squaring the circle and duplicating the cube were not eccentric departures from his philosophy but the natural expression of a conventionalist view of mathematics."**
      *   **Half Right, Half Wrong:**
          *   **Natural Expression:** **Correct.** His attempts flowed directly from his constructivist philosophy. He believed a genuine solution *must* be a geometrical construction (using compass and straightedge in finite steps, consistent with his definition of geometry as the science of motion/construction). He rejected algebraic or infinite series "solutions" as illegitimate. It *was* consistent with his core views.
          *   **Conventionalist View:** **Wrong.** It was the natural expression of his **constructivist and anti-algebraic** view, *not* his nominalism/conventionalism about definitions. The *problem* was defined (squaring the circle). His conviction that a constructive solution *must exist* and his rejection of non-constructive methods stemmed from his core epistemology of science through generation, not from a belief that the truth itself was conventional.

  8.  **"The upshot is that Hobbes's political theory is best read as a piece of applied geometry: the sovereign is constructed from definitions the way a circle is constructed from a definition, and the whole system stands or falls with the deductive rigor of its first definitions."**
      *   **Strong Analogy, Overstated as "Applied Geometry":**
          *   **Methodological Analogy:** **Correct and Important.** The *structure* of the argument is rigorously analogous: start from clear, generative definitions (state of nature, natural right, law of nature, covenant, authorization, sovereign), demonstrate the *necessary* features of the commonwealth that logically follow from these acts of "construction" (e.g., the sovereign's absolute, undivided power). The system *does* rely heavily on the deductive rigor starting from those definitions.
          *   **"Applied Geometry"?** **Overstated/Winced At.** This phrasing risks implying political entities are *literally* geometric objects or that political reasoning is *identical* to geometric reasoning. Scholars recognize the powerful analogy but see it as *methodological*: both domains allow "scientia" because both involve artificial human construction. The *content* (passions, language, volition, covenant) is fundamentally different from points, lines, and motions. The sovereign is "constructed" through linguistic/legal/political acts (covenants, authorization), not geometric ones. It's "geometry-like" in its deductive structure and claim to certainty based on artificial generation, but it's not "applied geometry" in the literal sense. Calling it that obscures the unique nature of the political "matter" Hobbes is analyzing.

  **Summary of Key Corrections & Nuances:**

  1.  **Conventionalism vs. Nominalism + Constructivism + Necessity:** The summary conflates Hobbes's nominalism (arbitrary imposition of names/definitions) with a radical conventionalism about truth. This is the **biggest weakness.** Hobbes *separates* the arbitrariness of the initial stipulation from the *necessity* of the consequences derived from that stipulation through reasoning about the constructed object. Geometrical truths are *not* "merely verbal" in the sense of being *only* about words; they are necessary truths about the properties of constructed objects defined by those words. They *also* tell us about universal properties of material bodies (space, motion).
  2.  **"Applied Geometry" in Politics:** The methodological analogy is crucial and correct, but describing political philosophy as "applied geometry" is an **overstatement.** It's better understood as employing the *same type of demonstrative method* (starting from generative definitions) made possible by the same condition (artificial human construction). The subject matter and mode of construction are fundamentally different.
  3.  **Motivation for Mathematical Work:** His circle-squaring attempts stemmed from his **constructivism and anti-algebraicism**, not primarily from conventionalism. He believed true math required geometric construction.
  4.  **Geometry's Relation to Nature:** Hobbes **did** believe geometry applied to nature; it was the science of the universal spatial and motional properties of *all* bodies. It wasn't detached from the physical world.

  **Conclusion:** Your colleague captures the core constructivist impulse, the centrality of Euclid, the methodological transfer to politics, and Hobbes's rejection of rival scientific/mathematical approaches accurately. However, the characterization of geometrical truth as "in the end verbal" and "not about anything in nature" misrepresents Hobbes by leaning too far towards a simplistic conventionalism, conflating the arbitrariness of stipulation with the status of derived truths and ignoring their applicability to physics. This error slightly infects the characterization of his motivations regarding Wallis and circle-squaring. The "applied geometry" description of the political theory overstates a fundamentally sound methodological analogy into an identity. Your instinct that the conventionalism charge is too strong is justified; Hobbes's position is a unique blend of nominalism, constructivism, and a robust belief in necessary truths grounded in definitions and applicable to the material world.
