  We are writing a satirical FAQ for a firm selling interval-valued probability forecasts. The central joke is dilation, a phenomenon in imprecise probability where conditioning on evidence can widen the interval even when the evidence is independent of the event under every distribution in the credal set.

  Key points to convey without lecturing:
  1. Dilation happens: after conditioning, the set of posteriors for an event can be more spread out (i.e., the interval is wider) than the set of priors.
  2. This occurs even though each distribution in the set is updated correctly and the evidence is independent of the event under every distribution.
  3. It is a theorem, not a bug, so the firm must defend it as a feature.
  4. Dilation is not universal: it depends on the credal set and the independence condition holding for every member.
  5. We must clarify that updating happens and the widening is a genuine consequence, not a refusal to update.
  6. Philosophical stakes: dilation challenges the idea that irrelevant information shouldn't change one's attitude toward a hypothesis.

  Structure:
  - Use a corporate FAQ format: numbered questions, reassuring headings, occasional notes from compliance or marketing.
  - Invent a firm name: perhaps "Credalytics" or "Interval Insights". I'll go with "Interval Insights".
  - Use deadpan corporate prose, but with the underlying technical correctness that imprecise probability experts would recognize.

  Outline of FAQ:

  1. Introduction: welcome and purpose of the FAQ.
  2. Basic questions about interval forecasts and why they are used.
