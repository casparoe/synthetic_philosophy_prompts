prompt: |-
  Engels gets a look at the present for a day. My reading group keeps re-fighting surrogacy: Germany and France ban it outright, the UK allows it only unpaid (expenses, and the deal isn't enforceable), California has a functioning market with enforceable contracts and paid egg donors. Half of us say the bans are the feminst position, half say they just push the trade offshore. Which side does the Engels of the Origin of the Family land on, and more to the point, what's the rule doing the work.

  Three things I actually want. (1) Does his framework even have the distinction between selling nine months of your labour power and selling the child or the parental rights at the end of it, or does it flatten the two? If it flattens them, is that a feature or a gap? (2) There's a jurisdiction drafting what I think is the real test case: payment allowed but capped and paid out by a state agency instead of the intended parents; the surrogate can withdraw any time up to birth and keep the baby, no penalty; intended parents can't demand termination or selective reduction; egg donors get a flat fee with no trait selection. Real third option, fig leaf over the same market, or the closest thing to what he'd want? (3) Is the wet-nursing trade the right analogy, or does he file this under domestic service, or under prostitution?

  Then say where you had to lean hardest on his commitments to get an answer at all -- that's where the extrapolation is doing the work rather than the texts -- plus what he'd have had to think about adoption or abortion for the verdict to flip, and one concrete fact that would change your mind.

  Sections: 'What he'd recognise as the issue' (2-3 sentences); 'His calls' (the ban, the UK model, California, the new draft -- ~200 words); 'The rule I think he's running, and where it strains' (~150 words); 'Where I'd bet wrong' (~100 words).
reasoning: |-
  Okay, the user is part of a reading group debating surrogacy policies using Engels' framework from "The Origin of the Family, Private Property and the State." They want to know where Engels would stand on different surrogacy models: the bans in Germany and France, the UK's unpaid model, California's market approach, and a new draft with state-regulated payment and protections. 

  First, I need to recall Engels' core arguments. He saw the family as an economic unit tied to private property, where women's reproductive labor is exploited. His critique centers on how capitalism commodifies relationships. Surrogacy involves selling labor (pregnancy) and results in a child, which might be seen as commodifying both labor and the child. But Engels didn't directly address surrogacy, so I have to extrapolate. 

  The user's three specific questions: 
  1. Does Engels distinguish between selling labor (pregnancy) and selling the child/parental rights? He likely flattens them because both turn reproduction into a transaction under capitalism. This isn't a gap but a feature of his critique—he opposes any market intrusion into family. 
  2. The draft model with state payments, no penalties, and protections. Engels might see state involvement as reducing exploitation but still commodifying reproduction. It's better than a free market but not ideal. 
  3. Analogies: wet-nursing, domestic service, or prostitution? Wet-nursing is closest—historical precedent of reproductive labor for pay. Prostitution involves direct body commodification, which surrogacy parallels in his view. 

  The user's deeper needs: They're stuck in a polarized debate (bans vs. markets) and want a theoretical framework to break the deadlock. Engels provides a structural critique, but applying it requires stretching his ideas. The group might need to acknowledge that while Engels opposes commodification, modern contexts (like state regulation) didn't exist in his time. 

  Where extrapolation strains: Engels never discussed abortion or adoption in this context. If he supported bodily autonomy (abortion rights), he might accept surrogacy with withdrawal rights. But his focus on class struggle over individual choice makes this fuzzy. 

  Concrete fact that could change my view: If surrogacy data showed it empowered poor women economically without coercion, Engels might reconsider, but historical class exploitation patterns suggest otherwise. 

  Finally, the user wants structured sections. I'll organize the answer to match their requested sections, keeping Engels' core principles central while acknowledging the necessary stretches in applying his 19th-century theory to modern surrogacy debates.
answer: |-
  ### What he'd recognise as the issue
  Engels would see surrogacy through the lens of **commodification of reproductive labour and the child** within bourgeois property relations. He'd frame it as the transformation of biological processes – historically confined to the patriarchal family unit serving property transmission – into alienated, market-mediated transactions. The core issue isn't altruism vs. payment, but the insertion of capitalist exchange into the fundamental act of reproduction, mirroring the commodification of women's bodies and labour he critiqued in marriage and prostitution.

  ### His calls
  *   **Germany/France Ban:** He'd likely see this as a **superficial bourgeois moralism** masking the real problem. Banning the *form* while upholding the property system driving commodification elsewhere solves nothing. It pushes exploitation offshore (a point he'd grasp immediately regarding class dynamics) without challenging the underlying economic forces or offering alternatives for infertile workers. It protects the *idea* of the "sacred family" while ignoring the alienation within existing families.
  *   **UK Model (Altruistic):** He'd dismiss this as **hypocritical mystification**. Calling it "altruistic" hides the *de facto* exploitation. Expenses are still payment for labour, just inadequate and shrouded. The unenforceable nature highlights the bourgeois state's inability to truly regulate this commodification without contradicting its own property logic. It forces the risk and burden entirely onto the surrogate.
  *   **California Market:** This is the **clearest manifestation of the commodification** he abhorred. Paid egg donors + enforceable surrogacy contracts explicitly turn reproductive capacity and the child into alienable commodities. Payment based on traits would horrify him as the ultimate bourgeois perversion. It represents the logic of capitalism applied directly to human reproduction, exacerbating class exploitation (poor women selling reproductive labour to the wealthy).
  *   **The New Draft (State Agency, Caps, Protections):** This is the **closest to what he *might* tolerate as a pragmatic step**, but with deep suspicion. The state agency *reducing* direct market forces and banning trait selection mitigates the worst excesses. Surrogate withdrawal rights and no forced termination are crucial non-commodification elements respecting bodily autonomy (though he'd worry about *indirect* economic coercion). The capped flat fee remains commodification of labour/body. **Verdict:** Not the ideal (abolition of property-driven commodification), but the "least bad" *within* a bourgeois system. It's a **real third option structurally distinct** from pure market or unenforced altruism, attempting (imperfectly) to decommodify the *child* and *parental rights* while partially regulating the commodification of *reproductive labour*.

  ### The rule I think he's running, and where it strains
  **The Core Rule:** **The commodification of human reproduction (labour *and* its product) within the bourgeois family/property system is inherently exploitative and alienating, mirroring the commodification of labour power under capitalism. Any arrangement facilitating this commodification reinforces class hierarchy and patriarchal control, regardless of "choice" rhetoric.**

  **Where it strains:**
  1.  **Flattening Labour Sale vs. Child Sale:** Engels' framework **flattens the distinction**. For him, selling the labour *is* selling the product (the child's existence/relation) into the bourgeois property system. The child *is* the alienated product of commodified labour. This is **a feature, not a gap**, in his systemic critique – he sees both as facets of the same alienation. The strain comes in applying this to a world with advanced reproductive tech and complex desires for parenthood *outside* pure property transmission.
  2.  **Bodily Autonomy Nuance:** His framework prioritizes systemic class analysis over individual bodily autonomy arguments common in modern feminist debates. He'd see "choice" to sell reproductive labour as constrained by economic necessity, akin to selling any other labour power. The strain is reconciling this with modern concepts of reproductive rights and bodily integrity *outside* the property transaction.
  3.  **Abortion/Adoption Flip Factors:** If Engels strongly prioritized a woman's **absolute right to bodily autonomy and termination** (which he doesn't explicitly develop in *Origin*), the surrogate's irrevocable right to keep the baby *without penalty* becomes more defensible within his framework. If he saw **adoption primarily as a social good** rescuing children from neglect (rather than property transfer), he *might* be less hostile to transferring parental rights post-birth via non-market means. However, his core property critique makes a flip unlikely.

  ### Where I'd bet wrong
  I likely overstate Engels' potential tolerance for the state-mediated model. His visceral opposition to *any* commodification of reproduction within the existing property system might lead him to reject *all* current models, seeing even the "best" draft as legitimizing the core alienation. He might insist true resolution is *only* possible after abolishing private property and the bourgeois family, rendering surrogacy obsolete through collective childcare and freed reproductive choices. His analysis might be too totalizing to entertain "lesser evil" reforms within capitalism.

  **Concrete Fact That Would Change My Mind:** Evidence showing that within rigorously regulated, non-profit state systems like the draft model, surrogates overwhelmingly come from secure economic backgrounds *without* coercion, report high autonomy/satisfaction, *and* the practice demonstrably strengthens communal bonds rather than reinforcing class hierarchy. This would challenge his core assumption of inherent exploitation/alienation driven by property relations. (Historical precedent makes this unlikely).
