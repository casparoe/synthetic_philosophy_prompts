answer: |-
  ### Final Exam Question: Philosophy of Medicine (PHIL 490)  
  **Time Allowed:** 90 minutes  
  **Total Marks:** 30  

  ---

  **Case Stipulation:**  
  Consider adult lactase non-persistence (ALNP): the genetically programmed downregulation of lactase enzyme production after weaning. This is the ancestral, species-typical condition in *Homo sapiens*, while lactase persistence is a recent (<10,000 years) genetic variant localized to populations with dairy pastoralism. Two individuals share identical ALNP physiology:  
  - **Person A** lives in a dairy-dependent society. They experience severe gastrointestinal distress after consuming dairy and seek medical treatment.  
  - **Person B** lives in a society with no dairy tradition. They never consume dairy and experience no symptoms.  

  **Question:**  
  Using *only* the theories covered in this course:  
  1. **Biostatistical Account (BSA):**  
     - What *must* BSA say about whether ALNP is a disease for Person A and Person B?  
     - How does narrowing the reference class (e.g., to "contemporary dairy-consuming populations") change these judgments?  
     - Explain why biology alone cannot objectively determine the reference class. (6 marks)  

  2. **Harmful-Dysfunction Analysis (HDA):**  
     - What *must* HDA say about whether ALNP is a disease for Person A and Person B?  
     - How does defining "function" via *selected effects* (rather than causal role) alter HDA’s judgment in this case? (6 marks)  

  3. **Two-Index Account (TIA)** (as presented in lecture):  
     - TIA claims a state is a disease only if (i) a mechanism fails to perform its *selected function*, *and* (ii) this failure impairs the organism’s ability to meet the demands of its *actual environment*.  
     - Does TIA retain the "value-free" status naturalists seek? Or does the "actual environment" index reintroduce a reference-class problem?  
     - Contrast the implications if "actual environment" is defined *descriptively* (e.g., local dietary practices) vs. a *privileged baseline* (e.g., species-typical ecology). (10 marks)  

  4. **Your Evaluative Stance:**  
     - Defend which account (BSA, HDA, TIA, or a hybrid) best resolves this case.  
     - Precisely state what your chosen account must sacrifice theoretically or practically to achieve this. (8 marks)  

  ---

  ### Model Answer (Approx. 800 words)  

  #### 1. Biostatistical Account (BSA)  
  BSA defines disease as a statistically subnormal biological function relative to a reference class. For ALNP:  
  - **Person A & Person B:** ALNP is the *species-typical* condition, so BSA *must* classify it as healthy for both. Lactase persistence is the statistically abnormal variant.  
  - **Narrowed Reference Class:** If we redefine the reference class as "adults in dairy-consuming societies," ALNP becomes statistically abnormal. Person A now has a disease; Person B (outside this class) remains healthy.  
  - **Why Biology Cannot Fix Reference Class:** Biology identifies statistical distributions but cannot prescribe *which* group is relevant. Choosing between "species," "population," or "age cohort" depends on normative goals (e.g., clinical utility). BSA’s naturalism collapses when reference-class selection requires contextual value judgments.  

  #### 2. Harmful-Dysfunction Analysis (HDA)  
  HDA requires (i) failure of a naturally selected function, and (ii) harm judged by social norms.  
  - **Person A & Person B (Standard HDA):**  
    - *Causal Role Function:* Lactase production’s causal role is digestion. ALNP fails this role *if* dairy is consumed (harmful for A, not for B). Thus, A has a disease; B does not.  
    - *Selected Effect Function:* The selected effect of lactase is to digest milk *in infancy*. ALNP is not a dysfunction—it is the selected outcome. Neither A nor B has a dysfunction. Harm (if any) is environmentally contingent, not biological.  
  - **Implication:** Shifting to selected effects "naturalizes" dysfunction but risks pathologizing neither case, even when harm occurs (e.g., Person A’s distress).  

  #### 3. Two-Index Account (TIA)  
  TIA adds a second index: impairment in the *actual environment*.  
  - **Value-Free Status?** TIA fails to be value-free. While "selected effect" anchors dysfunction biologically, "actual environment" imports values. Person A’s dairy-rich environment is a cultural artifact, not biologically mandated. Calling ALNP a disease for A relies on valuing dairy access—a social norm.  
  - **Reference-Class Problem Relocated:** Yes. Defining "actual environment" faces the same arbitrariness as BSA’s reference class. Why privilege *current* environment over ancestral or potential ones?  
  - **Descriptive vs. Privileged Baseline:**  
    - *Descriptive:* "Actual environment" = local conditions. ALNP is a disease for A (dairy present) but not B (no dairy). This mirrors HDA’s harm criterion, surrendering naturalism.  
    - *Privileged Baseline:* "Actual environment" = species-typical ecology (no dairy for adults). ALNP is never a dysfunction. This preserves naturalism but ignores Person A’s harm, rendering disease irrelevant to medical practice.  
  **Verdict:** TIA either regresses to normativism (descriptive) or clinical irrelevance (privileged baseline).  

  #### 4. Defended Position: Hybrid HDA/TIA  
  I argue a modified HDA best resolves the case: **Dysfunction requires failure of a selected effect, while harm is relativized to statistically typical environments.**  
  - **Why:** It avoids BSA’s reference-class arbitrariness and TIA’s instability. ALNP is not a dysfunction (selected effect: weaning adaptation), so neither A nor B has a *biological disorder*. Person A’s suffering stems from a *mismatch* between biology and environment—a problem for medicine, but not a disease.  
  - **Sacrifice Required:**  
    - **Theoretical:** We surrender naturalism’s aspiration for a purely biological disease definition. Harm remains normative.  
    - **Practical:** Clinicians must treat Person A’s symptoms but cannot call ALNP a "disease." This challenges medicalization practices but aligns with evolutionary medicine’s view of "mismatch conditions."  

  **Conclusion:** No account escapes the tension between biological facts and normative demands. BSA and strict naturalism ignore context; HDA and TIA reintroduce values. The hybrid accepts that medicine must address biologically normal states causing harm in atypical environments—but without mislabeling them as diseases.  

  ---

  ### Grading Rubric (Total: 30 marks)  

  | **Moves Required**                                                                 | **Marks** | **Common Errors**                                                                 |
  |------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|
  | **1. BSA Analysis**                                                                |           |                                                                                   |
  | - Correctly states ALNP is non-diseased for A/B under species reference class.     | 2         | *Error:* Calls ALNP a disease due to symptoms in A.                               |
  | - Explains narrowed class makes ALNP a disease for A, not B.                       | 2         | *Error:* Assumes reference class is objective.                                    |
  | - Argues biology cannot fix reference class (e.g., goals determine class choice).  | 2         | *Error:* Claims species class is biologically "correct."                          |
  | **2. HDA Analysis**                                                                |           |                                                                                   |
  | - Correctly applies HDA (causal role): Disease for A (harm + dysfunction), not B.  | 2         | *Error:* Ignores dysfunction criterion for B.                                     |
  | - Correctly applies selected effect: No dysfunction for A or B.                    | 2         | *Error:* Confuses selected effect with causal role.                               |
  | - Notes selected effect may preclude dysfunction claim despite harm.               | 2         | *Error:* Assumes harm implies dysfunction.                                        |
  | **3. TIA Evaluation**                                                              |           |                                                                                   |
  | - Identifies TIA’s "actual environment" index imports values/relocates reference class. | 3     | *Error:* Claims TIA is fully value-free.                                          |
  | - Contrasts descriptive (disease for A, not B) vs. privileged baseline (no disease). | 3     | *Error:* Fails to distinguish environment interpretations.                        |
  | - Argues descriptive TIA collapses into normativism; privileged ignores context.   | 4         | *Error:* Treats both versions as equally naturalistic.                            |
  | **4. Position & Sacrifice**                                                        |           |                                                                                   |
  | - Takes a clear stance (e.g., hybrid, modified HDA/TIA, etc.).                     | 2         | *Error:* Avoids choosing or combines theories incoherently.                       |
  | - Justifies stance using case asymmetry (e.g., explains why ALNP isn’t dysfunctional). | 3     | *Error:* Justifies based on symptoms alone.                                       |
  | - Precisely names theoretical/practical sacrifice (e.g., "gives up pure naturalism"). | 3     | *Error:* Vague sacrifice (e.g., "it’s complicated").                              |
  | **Clarity, Structure, and Precision**                                              | (+1)      | *Penalty:* Unmarked if poorly organized or key terms misused.                     |  

  ---  
  **Exam Instructions:** Write legibly, number your sections, and avoid reciting lecture notes verbatim. Focus on applying theories to the case. Good luck.
