prompt: |-
  I've been teaching an immigration ethics seminar for a few years now, and every time we reach the open-borders / right-to-exclude unit the discussion slams into the same wall. One side runs the argument that movement is a basic liberty, that a border regime is a coercive distributive institution, and that the burden of proof therefore falls on whoever wants to keep people out; the other side runs the argument that a political community has a claim to self-determination, that a community which can't control its own membership isn't really self-governing, and that this claim is prior to any particular migrant's interests. And here's what gets me: by the end everyone has conceded the same empirical facts — the wage effects, the fiscal effects, the point that the poverty-reduction potential of open movement probably dwarfs just about any aid program you could design — and nobody budges an inch. Worse, both camps happily profess the same moral premises (autonomy, equality, the badness of coercion, the value of community). I keep suspecting the real disagreement sits upstream of all of it: maybe about what a political community fundamentally is, maybe about whether we're allowed to lean on the fact that states as we find them are going to keep existing, maybe about who counts as a party to the justification in the first place. A colleague has been nagging me with a further thought — that any border regime coerces would-be entrants, and that coercion has to be justified to everyone it coerces, including the person turned away, which if true makes the whole "we just want to decide our own membership" reply look question-begging; but I can also hear someone objecting that this just smuggles in a particular all-affected-interests principle that the self-determination camp never signed up for, and that we're really back at the boundary problem — you can't ask a demos to decide who gets in without already presupposing who the demos is, so the whole exercise is circular.

  What I want from you is a diagnosis, not a literature survey and definitely not a verdict on open borders. Is this a verbal dispute, a hidden empirical disagreement, a clash about which cases count as data, two groups answering different questions under one heading, or bedrock intuitions neither side can argue for? Where does the all-affected-vs-all-subjected move actually bite, and does it dissolve the impasse or just relocate it? Then tell me what would count as progress given your diagnosis — a distinction, a change of question, a formal result, or honestly nothing — and if you think it's bedrock, say so and explain why that isn't just a cop-out. Please take a definite position and defend it rather than laying out the options for me to choose from; I'd rather be told I'm wrong than handed a menu. (Also, sorry in advance, this is half-baked — I'm writing it the night before seminar and I've had two coffees and no dinner.)
reasoning: |-
  Okay, let me start by unpacking the user's problem. They teach an immigration ethics seminar and hit a recurring wall in the open-borders vs. right-to-exclude debate. Both sides agree on empirical facts and share moral premises but still can't move forward. The user suspects the real disagreement is upstream—maybe about the nature of political communities or justification boundaries. Their colleague's point about coercion and justification to the coerced adds another layer, but they worry it might beg the question or lead to circularity.

  First, I need to diagnose the core issue. The user mentions both sides agree on data and values but remain stuck. That suggests the conflict isn't empirical or about basic values but about deeper conceptual or metaphysical commitments. The colleague's argument about coercion justification points to a meta-level problem: who counts in the justificatory community? 

  The boundary problem here is key. The self-determination camp assumes a pre-defined demos whose consent is needed for membership changes. The open-borders camp argues that excluding outsiders requires justifying coercion to them, which assumes the demos includes those affected. So the circularity is real. Each side's starting point invalidates the other's premise. 

  The user wants a diagnosis, not a solution. They’re frustrated with the stalemate and suspect it's foundational. Their deeper need might be to understand why the debate is intractable and how to frame it productively for students. They might also want tools to facilitate more insightful discussions rather than repetitive arguments.

  Considering philosophical frameworks, Rawls' basic structure comes to mind. The self-determination side sees borders as part of the basic structure, needing internal justification. The open-borders side sees the structure itself as coercive to outsiders, requiring their justification. This isn't resolvable through normal debate because it's about what constitutes the justificatory framework. 

  The all-affected principle vs. all-subjected distinction might help. All-affected is too broad (anyone impacted), while all-subjected focuses on those coerced by the regime. But even that relies on defining the coercive structure's scope, which brings us back to the boundary issue. 

  Progress here might involve shifting focus from "who's right" to mapping the disagreement's structure. Highlighting the meta-level conflict helps students see why arguments talk past each other. Introducing the boundary problem explicitly could foster deeper engagement. Also, exploring what's at stake practically—like different institutional arrangements—might ground the abstract debate. 

  The user’s colleague’s point about coercion justification pushes the self-determination camp to defend their demos' boundaries, which they can't do without circularity. But the open-borders camp can't establish why the coerced must be included without presupposing inclusivity. It's bedrock because it's about foundational political ontology. 

  In conclusion, the deadlock arises from incompatible starting points regarding political community constitution. Recognizing this as a meta-ethical impasse allows the seminar to move beyond fruitless debates and explore the implications of each framework, which is progress in understanding, even without resolution.
answer: |-
  Here's a diagnosis, taking a definite position based on your description:

  **The core impasse isn't about facts, core values (equality, autonomy, community), or even primarily about *who* counts. It's a deep, structural disagreement about *the nature and justification of political authority itself*, specifically concerning the scope of the justificatory community ("the demos") *prior* to any exercise of self-determination. This is bedrock.**

  **Defending the Diagnosis:**

  1.  **The Shared Ground is Genuine, But Superficial:** Both sides agree on empirical effects and abstract moral principles. This isn't a verbal dispute (they mean the same things by "equality," "coercion," etc.), nor hidden empirics. They genuinely share a moral vocabulary and accept the data. The clash arises when applying these shared principles *to the fundamental structure*.

  2.  **Self-Determination Presupposes a Demos:** The right-to-exclude argument relies on a pre-existing, bounded political community ("we") exercising its legitimate self-determination ("deciding *our* membership"). This seems intuitive *if you start from the assumption that the "we" is already constituted and legitimate*. The argument *begins* with a defined demos.

  3.  **The Coercion Argument Challenges the Demos' Pre-Given Boundaries:** The open-borders argument highlights that the border regime itself is a coercive act *against outsiders*. Demanding justification for coercion *to those coerced* inherently challenges the initial premise of the self-determination argument. It asks: "Why are *you* (the current members) the legitimate body to make this decision that coercively excludes *me*?" This doesn't just relocate the impasse; it attacks its foundation. The self-determination camp's reply ("*We* decide") *assumes* the very point in question – the legitimacy and scope of the "we" making the decision. It *is* question-begging from this perspective.

  4.  **The "All-Affected" vs. "All-Subjected" Move is Crucial, But Reveals the Bedrock:**
      *   **"All-Affected":** (Too broad for this context). Anyone impacted by the decision. This makes the demos potentially global for immigration policy, dissolving the bounded community the self-determination camp relies on. They rightly reject this as dissolving self-determination entirely.
      *   **"All-Subjected":** (More targeted). Focuses on those *directly coerced* by the specific institution (the border regime). This move bites hard because it forces the question: "Can the coercive power exercised *against* non-members (denying entry) be legitimately exercised *only* by appealing to the interests/autonomy of the current members?" The open-borders camp says "no" – justification must include those coerced *by* the act. The self-determination camp says "yes" – the coercive act *presupposes* the authority of the existing demos to make binding rules for *its* territory/membership. **This is the core clash: Is the legitimacy of the bounded demos *prior to* and *exempt from* justification to those it coercively excludes, or is the legitimacy of that bounded demos itself *dependent on* justification to those subjected to its core coercive acts (like exclusion)?**

  5.  **It's Bedrock Because It's About Political Ontology:** This disagreement stems from fundamentally different, pre-justificatory conceptions of what constitutes a legitimate political unit in the first place:
      *   **Self-Determination Camp:** Assumes the *de facto* existence of bounded political communities as the fundamental units of political life and justification. Their legitimacy (within broad limits) is derived internally or historically. The boundary is a *precondition* for self-determination. Justification *starts* internally.
      *   **Open-Borders Camp:** Sees coercive institutions (like borders) as primary objects requiring justification. The scope of justification must include those subjected to the coercion. The legitimacy of *any* bounded demos exercising coercive power over outsiders must be justified *to those outsiders*; the boundary itself isn't a given, but something needing justification. Justification *reaches outward*.

  **Why This Isn't a Cop-Out:**

  Calling it "bedrock" acknowledges a genuine, fundamental, and likely irresolvable tension in political philosophy, not intellectual laziness. It reflects the "boundary problem" in its most acute form. Think of it as analogous to foundational disagreements in other areas: moral realists vs. anti-realists, or competing conceptions of personal identity. These disagreements structure entire frameworks of thought.

  **What Counts as Progress (Given the Diagnosis):**

  1.  **Shifting the Question:** Move *away* from "Who wins: open borders or exclusion?" Instead, explicitly frame the discussion as: **"What is the *source* of a political community's legitimate authority to coercively exclude non-members? Does this authority require justification *to the excluded*, and if not, why not?"** This forces both sides to articulate their *meta*-commitments about political legitimacy itself.
  2.  **Mapping the Stakes:** Explore the *practical and normative implications* of adopting one foundational view over the other:
      *   If the bounded demos is prior, what are the limits? (Can it exclude arbitrarily? Based on race? What internal legitimacy conditions matter?)
      *   If justification must reach the coerced, what institutional forms could possibly satisfy this? (Global democracy? Cosmopolitan right? Does it inevitably dissolve borders?)
      *   What does each view imply for other core political concepts (citizenship, territory, distributive justice, secession)?
  3.  **Distinguishing Justification from Implementation:** Acknowledge that even *if* the open-borders camp wins the foundational justificatory argument (coercion must be justified to the coerced), the question of *how* to institutionally realize that justification (open borders? guest worker programs? global reparations?) remains complex and contested. Conversely, if the self-determination camp wins the foundational argument, the question of *how* the demos legitimately exercises its exclusionary power (fair procedures? non-discrimination?) remains vital.
  4.  **Identifying the "Costs":** Make explicit the "price" each side pays for its foundational commitment:
      *   **Self-Determination Camp:** Must accept that their starting point appears arbitrary/coercive from the outside and struggles to justify exclusion to the excluded *on grounds they could reasonably accept*.
      *   **Open-Borders Camp:** Must grapple with the immense practical challenges and potential dissolution of localized self-governance and community identity their principle implies, and explain why *this specific coercive institution* (borders) uniquely requires universal justification in a way others (e.g., internal criminal law applied to citizens) might not.

  **Conclusion:**

  Your suspicion and your colleague's point are sharp. The deadlock stems from incompatible foundational assumptions about the nature and scope of political justification. The "all-subjected" principle doesn't dissolve the impasse; it exposes its deepest root: **the legitimacy of the bounded demos itself is the central, contested premise.** Progress lies not in resolving this bedrock tension, but in rigorously clarifying it, mapping its implications, and shifting the debate from "who wins" to "what are the deep structures of our disagreement and what does each imply?" This transforms the seminar from a repetitive clash into an exploration of the fundamental architecture of political legitimacy in a world of movement and exclusion.
