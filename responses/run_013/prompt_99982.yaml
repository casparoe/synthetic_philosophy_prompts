answer: |-
  ## Sestina of the Shifting Circle

  I feel the geometer’s chalk dust fall,
  A question asked: define a line, **random**,
  A fleeting mark across my perfect round.
  They seek its measure: will it be **longer**
  Than lines that bind the three-pointed star?
  But *how* is this abstraction to be found?

  Some say: pick two bright points, an **endpoint**
  Here and there, upon my curving rim,
  Then join them swift, a new-made **chord**.
  This path they call the natural way,
  Ignoring all the space within my rim.
  The fraction found? One third, they grimly say.

  Another claims: draw out a **radius**,
  Straight from my heart towards the edge so far.
  Then pick a point along that hopeful spoke,
  Its **midpoint** claimed for some strange law.
  Erect a crossing line, a fresh **chord**,
  And *this* yields one half, a different score.

  A third insists: look deep within my field,
  A single point, unseen, a seed unfurled.
  Let *that* be where the **midpoint** lies concealed.
  Then spin the line through which its truth is swirled;
  The **longer** chance thus quartered is revealed.
  A tiny fraction in the spinning world.

  Each method seems so fair, a pure partition,
  Applying Indifference with solemn might.
  But **longer** odds shift with the mathematician's
  Preference for **endpoint**, spoke, or central site.
  The **radius** of choice brings contradiction;
  My constant form admits no single light.

  O fragile **chord**, conceived by **random** thought,
  You tremble in the space you occupy.
  Is where you start, or where your heart is caught,
  Or how you sprang from center, reason why
  Your length's assessed? The answer you have sought
  Depends on which illusion they apply.

  (Envoi)
  Circle cries: One third's an **endpoint**'s view,
  One half a **radius**'s claim, one quarter paid
  Where **midpoint** hides, a **chord**'s **longer** due
  In **random** schemes that cannot be gainsaid.
