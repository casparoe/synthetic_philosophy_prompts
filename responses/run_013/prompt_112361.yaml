  - However, one might argue that if we are interested in the direct effect only, we might need to condition on Z? But note, the structure does not have any indirect path from X to Y. The only path is direct. So the total effect is the direct effect. Conditioning on Z would block part of the direct effect? Actually, conditioning on Z would bias the direct effect because Z is a collider.

    In fact, to isolate the direct effect we must not condition on a collider that is caused by X and Y. So we should not condition.

  Therefore, I think TARGET is solid.

  But what if we want to know the effect of the drug on recovery in the subpopulation that was referred? That would be a different question. The thesis says: "whether the drug raises the probability of recovery in this population." The population is the entire group. So the target is the ATE.

