prompt: |-
  I am the returning officer for a learned society's annual prize. Twelve members vote by ranking the shortlisted candidates; I must produce one winner to announce at the AGM, and the outcome is challenged often enough that I want a procedure I can defend in writing to the membership. I have no training in social choice theory and the panel changes every year, so it must be something a volunteer can run in an hour with pen and paper.

  Write that procedure. It should be a sequence of tests and decisions, grounded in what is actually established about aggregating rankings, including the impossibility results, and it must say at each step which desirable property I am sacrificing and what that sacrifice costs me. Where a step cannot be settled by a rule, say so and say who decides and on what basis. Where the rule will predictably be gamed, say whether ballots or tallies should be published, and require that the elimination order, the tie-break and the choice of rule be fixed in advance of seeing the ballots. Then run the procedure on both ballot profiles below, giving the result at each stage alongside the result under the obvious rival rules, and flagging where the procedure and my own preference come apart.

  Profile 1 (nine voters, three candidates A, B, C): four voters rank A then B then C; three rank B then C then A; two rank C then B then A. My own preference is C.

  Profile 2 (twelve voters, four candidates A, B, C, D): four rank A then C then B then D; three rank B then A then C then D; two rank C then B then A then D; three rank D then C then A then B. My own preference is D.

  Finish by telling me what the procedure cannot do — in particular, whether it can tell me that the choice of rule is a matter of value rather than of correctness, and whether it can protect the outcome from a panel that has already decided whom it wants.

  Please write the answer in British English.
reasoning: |-
  Hmm, the user is a returning officer for a learned society's annual prize. They need a defensible voting procedure to handle ranked ballots from twelve members. Key requirements: it must be runnable by volunteers in an hour with pen and paper, grounded in social choice theory, transparent about trade-offs, and resistant to challenges. They also want it tested on two specific ballot profiles and to understand its limitations.

  First, I need to recall core principles. Arrow's impossibility theorem means no perfect system exists - any method will sacrifice some desirable property. Common criteria include:  
  - **Condorcet criterion**: If a candidate beats all others head-to-head, they should win.  
  - **Later-no-harm**: Adding a lower preference shouldn't hurt a higher-ranked candidate.  
  - **Monotonicity**: Ranking a candidate higher shouldn't harm them.  
  - **Participation**: Adding ballots shouldn't reverse the winner.  

  The procedure must balance these while being practical. For hand calculation, elimination-based methods like Coombs or Tideman variants are feasible. I'll design a hybrid Condorcet-IRV method since it's auditable and mitigates some spoiler effects.  

  For transparency, each step must declare:  
  - What property is sacrificed (e.g., Condorcet efficiency for Later-no-harm)  
  - The cost (e.g., may ignore majority preferences)  
  - Who decides ties (returning officer, with pre-specified rules)  
  - Anti-gaming measures (publish elimination order/tie-breaks in advance, keep ballots private)  

  Testing on the given profiles:  
  - **Profile 1 (9 voters, A,B,C)**:  
    - My preference: C  
    - Expected outcomes: B wins under Condorcet (beats A 5-4, beats C 7-2), but C wins under IRV (B eliminated first, then C beats A 5-4). This highlights the Condorcet-IRV conflict.  
  - **Profile 2 (12 voters, A,B,C,D)**:  
    - My preference: D  
    - Condorcet winner: None (cycle: A>B, B>C, C>A, D loses to C). IRV eliminates D first, then likely A wins.  

  The procedure must flag where results diverge from the officer's preference to acknowledge subjectivity.  

  Finally, limitations:  
  - Cannot resolve value judgments (e.g., majority vs. broad support)  
  - Cannot prevent strategic voting by a coordinated panel  
  - Requires upfront rule commitment to avoid post-hoc manipulation  

  I'll structure the answer as a numbered procedure with clear steps, then analyze both profiles stage by stage, and conclude with philosophical and practical constraints.
answer: |-
  Below is a complete voting procedure for your learned society's annual prize, designed for hand-calculation in under an hour. It prioritises **defensibility**, **transparency**, and **practicality** while explicitly acknowledging trade-offs from social choice theory (including Arrow's Impossibility Theorem, which proves no system satisfies all desirable properties). The procedure is a hybrid Condorcet-IRV method (specifically, Tideman’s Alternative with Coombs elimination), chosen for its balance between Condorcet efficiency and resistance to spoilers. Crucially, it requires all rules (including elimination order and tie-breaks) to be fixed **before** ballots are cast.

  **Key Principles Embedded:**  
  1. **Pre-commitment:** Rules are immutable once voting starts.  
  2. **Anti-gaming:** Ballots are **not** published (to prevent coercion), but the elimination order, tie-break rules, and full tally sheets **are** published after the result.  
  3. **Trade-off Transparency:** Each step states sacrificed properties and their costs.  
  4. **Decider Role:** The Returning Officer (RO) resolves ties only via pre-specified rules (e.g., "alphabetical order" or "lottery"). The RO’s preferences **do not** influence outcomes.  

  ---

  ### The Procedure: Sequential Elimination Condorcet  
  *Time estimate: 45–60 minutes for 12 voters and ≤6 candidates.*

  #### **Step 0: Preparation (Before Ballots)**  
  - **Fix and publish:**  
    (a) *Elimination order:* Candidates eliminated in ascending alphabetical order (A before B, etc.) if tied on votes.  
    (b) *Tie-break for wins:* If two candidates tie head-to-head, the candidate named first alphabetically wins.  
    (c) *Rule choice:* This procedure (hybrid Condorcet-IRV) is used. No changes after ballots issued.  
  - **Sacrificed Property:** **Strategy-proofness**.  
    - *Cost:* Voters may tactically rank insincerely to manipulate outcomes. Publishing only tallies (not ballots) mitigates this.  

  #### **Step 1: Check for Condorcet Winner**  
  - **Action:** For each candidate pair (X vs. Y), count how many voters rank X above Y. If one candidate beats **all others** head-to-head, they win.  
  - **Sacrificed Property:** **Later-No-Harm** (ranking a candidate lower can help them).  
    - *Cost:* Favours broadly acceptable candidates over polarising ones. May incentivise "burying" strong rivals.  
  - **Tie/Unsettled:** If no Condorcet winner exists (e.g., a cycle: A>B, B>C, C>A), proceed to Step 2. The RO **does not decide**; the rule does.  

  #### **Step 2: Eliminate Least-Preferred Candidate (Coombs Rule)**  
  - **Action:** Count last-place votes for each candidate. Eliminate the candidate with the **most** last-place votes.  
    - If tie: Eliminate the candidate earliest in the pre-fixed elimination order (e.g., "A" before "B").  
  - **Sacrificed Property:** **Monotonicity** (ranking a candidate higher could hurt them).  
    - *Cost:* Eliminating a "moderate" candidate early may distort preferences.  
  - **RO Role:** Only applies the pre-fixed elimination order. No discretion.  

  #### **Step 3: Recount and Repeat**  
  - **Action:** Remove the eliminated candidate from all ballots. Repeat **Step 1** with the remaining candidates.  
    - If a Condorcet winner emerges, they win.  
    - If not, repeat **Step 2** with the new pool.  
  - Continue until one candidate remains or a Condorcet winner is found.  

  #### **Step 4: Final Tie-break (If 2 candidates remain)**  
  - **Action:** The winner is whoever is ranked above the other in more ballots.  
    - If tie: Use the pre-fixed tie-break rule (e.g., alphabetical order).  
  - **Sacrificed Property:** **Participation** (adding ballots could change the winner).  
    - *Cost:* A small group of voters could spoil the result by abstaining.  

  ---

  ### Application to Profile 1  
  *Ballots: 4× A>B>C ; 3× B>C>A ; 2× C>B>A. Your preference: C.*  

  - **Step 1: Condorcet Check**  
    - A vs. B: A ranked above B in 4 ballots (A>B>C), B above A in 5 (3× B>C>A + 2× C>B>A). **B beats A (5-4)**.  
    - A vs. C: A above C in 4 ballots, C above A in 5 (3× B>C>A + 2× C>B>A). **C beats A (5-4)**.  
    - B vs. C: B above C in 7 ballots (4× A>B>C + 3× B>C>A), C above B in 2 (C>B>A). **B beats C (7-2)**.  
    - **Result:** B is the Condorcet winner (beats A and C).  
  - **Outcome:** **B wins**.  

  *Comparison to Rival Rules:*  
  - **IRV (Instant Runoff):** Eliminate candidate with fewest first-pref votes. C has 2, A has 4, B has 3. Eliminate C. Redistribute: C’s 2 votes go to B (as both rank B>A). B now has 5, A has 4. **B wins**.  
  - **Borda Count:** A: (4×3) + (5×0) = 12; B: (3×3) + (6×2) = 21; C: (2×3) + (3×1) + (4×0) = 9. **B wins**.  
  - **Your Preference:** C loses. **Divergence noted**: The Condorcet winner (B) is not your favourite (C).  

  ---

  ### Application to Profile 2  
  *Ballots: 4× A>C>B>D ; 3× B>A>C>D ; 2× C>B>A>D ; 3× D>C>A>B. Your preference: D.*  

  - **Step 1: Condorcet Check**  
    - Key pairwise comparisons:  
      - A vs. B: A above B in 4 (A>C>B>D) + 3 (D>C>A>B) = 7; B above A in 3 (B>A>C>D) + 2 (C>B>A>D) = 5. **A beats B (7-5)**.  
      - A vs. C: A above C in 4 (A>C>B>D) + 3 (B>A>C>D) = 7; C above A in 2 (C>B>A>D) + 3 (D>C>A>B) = 5. **A beats C (7-5)**.  
      - A vs. D: A above D in 4+3+2=9; D above A in 3. **A beats D (9-3)**.  
      - B vs. C: B above C in 3 (B>A>C>D) + 4 (A>C>B>D? Wait, **error**: In A>C>B>D, C is above B. Recount:  
        - B above C: 3 (B>A>C>D) + 0 (A>C>B>D ranks C>B) + 2 (C>B>A>D) + 0 (D>C>A>B ranks C>B) = 5.  
        - C above B: 4 (A>C>B>D) + 3 (D>C>A>B) = 7. **C beats B (7-5)**.  
      - B vs. D: B above D in 4+3+2=9; D above B in 3. **B beats D (9-3)**.  
      - C vs. D: C above D in 4+3+2=9; D above C in 3. **C beats D (9-3)**.  
    - **Result:** No Condorcet winner (A beats B and D but loses to none directly; however, cycles exist: e.g., A>B, B>C not transitive). Proceed to Step 2.  

  - **Step 2: Coombs Elimination (Last-place votes)**  
    - Last-place votes: D has 9 (all except D-top voters), A has 0, B has 0, C has 3 (from D-top ballots: D>C>A>B, so B last).  
    - **Eliminate D** (most last-place votes).  

  - **Step 3: Recount without D**  
    - New ballots: 4× A>C>B ; 3× B>A>C ; 2× C>B>A ; 3× C>A>B (originally D>C>A>B).  
    - **Repeat Step 1 (Condorcet Check with A,B,C):**  
      - A vs. B: A above B in 4 (A>C>B) + 3 (C>A>B) = 7; B above A in 3 (B>A>C) + 2 (C>B>A) = 5. **A beats B (7-5)**.  
      - A vs. C: A above C in 4 (A>C>B) + 3 (B>A>C) = 7; C above A in 2 (C>B>A) + 3 (C>A>B) = 5. **A beats C (7-5)**.  
      - B vs. C: B above C in 3 (B>A>C) + 4 (A>C>B? Wait, **error**: A>C>B ranks C>B. Recount:  
        - B above C: 3 (B>A>C) + 0 (A>C>B) + 2 (C>B>A) + 0 (C>A>B) = 5.  
        - C above B: 4 (A>C>B) + 3 (C>A>B) = 7. **C beats B (7-5)**.  
    - **Result:** A is Condorcet winner (beats B and C).  
  - **Outcome:** **A wins**.  

  *Comparison to Rival Rules:*  
  - **IRV:** First-pref votes: A:4, B:3, C:2, D:3. Eliminate C (fewest). Redistribute C’s 2 votes to B (C>B>A>D). Now: A:4, B:5, D:3. Eliminate D; votes go 2 to C (eliminated) and 1 to A? Ballots show D-top voters rank C next (D>C>A>B), but C is eliminated, so move to A. A gains 3, now A:7 vs. B:5. **A wins**.  
  - **Borda:** A: (4×4 + 3×3 + 2×1 + 3×2) = 16+9+2+6=33; B: (4×2 + 3×4 + 2×3 + 3×1) = 8+12+6+3=29; C: (4×3 + 3×2 + 2×4 + 3×3) = 12+6+8+9=35; D: (4×1 + 3×1 + 2×1 + 3×4) = 4+3+2+12=21. **C wins**.  
  - **Condorcet (Schulze):** Resolves cycle: A>B (7-5), B>C (5-7? Wait, earlier C>B 7-5), C>A (5-7? A>C 7-5). Strongest path: A>B (7-5), A>C (7-5), C>B (7-5). **A wins**.  
  - **Your Preference:** D loses. **Divergence noted**: The winner (A) is not your favourite (D).  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve Value Judgments:** It **cannot** declare one rule "correct." Social choice is inherently normative (e.g., Condorcet methods prioritise majority preferences; IRV prioritises broad acceptability). The procedure explicitly trades properties (e.g., sacrifices Later-No-Harm for Condorcet efficiency), but it cannot justify why *this* trade-off is "best"—only that it is consistent and pre-committed.  

  2. **Prevent Panel Manipulation:** It **cannot** protect against a coordinated panel gaming the system. If voters collude to rank insincerely (e.g., "bury" a strong rival), the outcome may be distorted. Publishing tallies (not ballots) deters but does not eliminate this. The only defence is the society’s culture of integrity.  

  3. **Ensure "True" Preferences:** Like all ordinal systems, it ignores preference intensity. A candidate loved by 40% and hated by 60% may win over one liked by all.  

  4. **Guarantee Participation or Monotonicity:** Adding or removing ballots, or ranking a candidate higher, could paradoxically hurt them (as acknowledged in Steps 2 and 4).  

  5. **Override the Rules:** The RO has **no discretion** beyond applying pre-fixed rules. If the panel has pre-decided a winner, they can only manipulate outcomes through strategic voting, not procedural interference.  

  **Final Recommendation:** Pair this procedure with a written statement: *"The voting rule reflects a compromise among competing democratic principles. Its outcome depends on the structure of preferences, not an absolute 'will of the group.'"* This defends you by emphasising procedural fairness over substantive perfection.  

  ---  
  *This procedure satisfies your constraints: hand-calculable in ≤60 minutes, auditable, and grounded in accepted theory. By fixing rules in advance and publishing tallies, it ensures challenges can be rebutted objectively.*
